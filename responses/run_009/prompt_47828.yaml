prompt: |-
  I am a software engineer with no formal philosophy background, though I am comfortable with probability, the basics of program analysis, and reliability engineering. I have been reading about a research programme, associated with the AI-safety researcher Paul Christiano, that tries to formalize heuristic arguments: the informal, not-quite-proofs that mathematicians, scientists, and engineers use constantly — for instance, estimating that two complicated sums will nearly cancel because their error terms are presumably independent. The centrepiece of the programme is a proposed heuristic estimator: something that takes a question together with a set of arguments and returns an estimate, in a way that improves as good arguments are added but cannot be driven to an arbitrary conclusion by a sufficiently large pile of bad ones. As I understand it, the sticking point is that nobody has managed to define such a thing properly; treating the arguments as Bayesian evidence fails in one direction, treating them as constraints fails in another, and the presumption of independence itself — assuming two quantities are uncorrelated unless some argument connects them — is the paradigm case that resists formalization.

  Restate this whole debate in the vocabulary I actually use at work: sound versus complete static analysis (an analysis that never reports a false error but misses real ones, versus one that flags everything), property-based testing and coverage, coupling and common dependencies between supposedly independent modules, the reliability engineer's assumption that redundant components fail independently, code review, and the way a large diff can bury a harmful change in a flood of plausible-looking lines. Translate the main positions as faithfully as you can, then give me a residue report: which claims map cleanly onto my vocabulary, which had to be distorted to fit, and which cannot be expressed in it at all. Finally, tell me whether the residue points to something my vocabulary is missing or to something in the original debate that is less clear than it looks.

  Please write your answer in British English.
