prompt: |-
  So animal welfare law has been creeping down the phylogenetic tree: the EU's research directive now covers cephalopods, and the UK's sentience act from 2022 recognized crabs, lobsters, and octopuses as sentient. Both were justified on the ground that the evidence for sentience in those animals is now strong enough. Meanwhile insect farming for animal feed is scaling up to billions of black soldier flies and crickets, and as far as I can tell there are essentially no welfare rules for any of them -- a researcher needs a license to house an octopus, but you can microwave a warehouse of flies. What theory of moral status does this setup actually presuppose? Is it a presumption against sentience until the evidence is strong, i.e. uncertainty counts against the animal, and if so is that even coherent given that these same legal systems use expected-value reasoning elsewhere (we spend on low-probability catastrophic risks all the time)? Or maybe the practice is compatible with several different views -- maybe it's just about tractability, or which animals humans find charismatic -- and doesn't strictly presuppose any theory of sentience at all? Reconstruct the implicit view for me, say where the law is genuinely underdetermined between rival theories, and tell me what would actually have to change in regulation if you took the expected-value argument seriously, i.e. a lowish probability of sentience times trillions of farmed insects. Please write it as continuous prose with no headings, bullet points, bold text, or tables -- like a long email.
