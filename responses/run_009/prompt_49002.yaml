prompt: |-
  My friend defends conspiracy theorizing by analogy to the history of science. Semmelweis, she notes, had the data on handwashing and was nonetheless hounded out of the profession; the medical and tobacco establishments denied for decades what their own internal documents eventually confirmed. On her telling, the conspiracy theorist is doing exactly what the vindicated heretic did — refusing to defer to a consensus that has demonstrably failed before — so the reflexive epistemic penalty we attach to conspiracy theories puts us on the wrong side of history. She even anticipates the standard reply (Semmelweis had evidence; most conspiracy theorists don't) and has an answer ready: Semmelweis's evidence didn't help him at the time, so evidence-versus-no-evidence can't be what separates the heretic from the crank. Audit the analogy for me. Lay out the correspondence table — what plays the role of the heretical hypothesis, the establishment, the decisive evidence, the eventual vindication — then identify where the mapping breaks, and separate the disanalogies that actually damage her conclusion from those that don't. I'm especially interested in whether her Semmelweis reply works: does the fact that evidence sometimes loses to an entrenched consensus show that deferring to consensus is unreliable, or merely that it is imperfect? Finally, state whether her conclusion — that conspiracy theories deserve no special epistemic penalty qua conspiracy theories — survives once the disanalogies are on the table, or whether the analogy was carrying it the whole way. As you go, say how confident you are in each major verdict, and flag the single point in your audit you are least sure of.
reasoning: |-
  Hmm, the user wants me to audit their friend's analogy comparing conspiracy theorists to scientific heretics like Semmelweis. The friend argues that since established institutions have been wrong before (like rejecting handwashing or tobacco-cancer links), we shouldn't automatically penalize conspiracy theories. They specifically challenge the "but they have evidence" counterargument by noting Semmelweis had evidence but was still rejected.

  First, I need to map the analogy properly. Semmelweis's handwashing theory corresponds to a conspiracy theory; the medical establishment is like today's scientific consensus; mortality data is the equivalent of evidence; and widespread adoption of antisepsis is the vindication. The friend claims this shows consensus is unreliable, not just imperfect.

  But where does this break down? The establishment's motives differ - scientific institutions generally want truth (though they can be stubborn), while conspiracy theories often accuse them of deliberate deception. The evidence standard isn't equivalent either - Semmelweis had systematic data collection, whereas conspiracy theories typically rely on selective patterns. Also, vindication pathways differ dramatically - science self-corrects through institutional processes, while conspiracy theories rarely get validated through mainstream channels.

  The friend's Semmelweis counterargument is clever but flawed. Yes, evidence can lose temporarily to consensus, but this only proves imperfection, not unreliability. The key is that evidence-based claims eventually win through scientific processes, whereas baseless claims don't. This is crucial - the analogy conflates temporary rejection with permanent dismissal.

  The core issue is whether conspiracy theories deserve special skepticism. The analogy doesn't hold because scientific heterodoxy works within epistemic systems (evidence, peer review), while conspiracy theories often reject those systems entirely. The institutional skepticism toward conspiracy theories exists precisely because they've proven unreliable historically, unlike scientific hypotheses which have a track record of occasional vindication.

  I'm least confident about whether to call the evidence standard a fatal flaw. While Semmelweis clearly had stronger evidence than typical conspiracy theories, some conspiracy theories might point to genuine anomalies - though they usually fail to meet scientific burdens of proof.

  Ultimately the analogy collapses under scrutiny. What carries weight isn't the "outsider" status but the methodology. We penalize conspiracy theories not for challenging consensus per se, but for how they challenge it - typically through epistemically suspect practices that Semmelweis didn't employ. The friend's conclusion doesn't survive because the analogy falsely equates fundamentally different epistemic categories.
answer: |-
  Here's a systematic audit of your friend's analogy, breaking down correspondences, key disanalogies, their impact on her conclusion, and an evaluation of her Semmelweis counterargument. Confidence levels (High/Medium/Low) are noted for major verdicts.

  ### Correspondence Table (The Analogy Mapped)
  | **Role**               | **Semmelweis Case**                          | **Conspiracy Theory Case**                     |
  |------------------------|----------------------------------------------|-----------------------------------------------|
  | **Heretical Hypothesis** | Handwashing prevents puerperal fever         | Any specific conspiracy theory (e.g., "COVID was lab-leaked," "9/11 was an inside job") |
  | **Establishment**      | Medical academia/governments (1840s Vienna) | Scientific consensus, governments, mainstream media |
  | **Decisive Evidence**  | Mortality data: ~10% vs. ~2% in clinics      | "Anomalies" (e.g., data inconsistencies, leaked documents) |
  | **Eventual Vindication** | Germ theory acceptance, antiseptic surgery  | Rare vindication (e.g., Tuskegee exposure, NSA surveillance) |

  ### Key Disanalogies & Their Impact on Her Conclusion
  1. **Motives of the "Establishment"**  
     - *Semmelweis:* Institutional inertia, flawed paradigms (miasma theory), professional pride.  
     - *Conspiracy Theories:* Alleged *malicious intent* (e.g., cover-ups, profit-driven deception).  
     - **Impact:** **Damaging**. Scientific consensus resists ideas due to epistemic caution (often rightly); conspiracy theories accuse institutions of *deliberate fraud*. This undermines the parallel.  
     - **Confidence: High**

  2. **Nature & Quality of Evidence**  
     - *Semmelweis:* Systematic data collection, replicable clinic results, clear mechanism (cadaver particles → infection).  
     - *Conspiracy Theories:* Often relies on cherry-picked anomalies, mistrust of absence-of-evidence, or non-falsifiable claims.  
     - **Impact:** **Damaging**. Semmelweis offered *positive evidence*; conspiracy theories often substitute *gaps in mainstream accounts* for evidence.  
     - **Confidence: High**

  3. **Path to Vindication**  
     - *Semmelweis:* Vindicated via scientific progress (germ theory, microbiology).  
     - *Conspiracy Theories:* Rare vindication usually comes from *institutional self-investigation* (e.g., FOIA releases), not conspiracist methods.  
     - **Impact:** **Damaging**. Science self-corrects using its own methods; conspiracy theories reject those methods, making vindication unlikely via their own epistemology.  
     - **Confidence: Medium**

  4. **Epistemic Responsibility**  
     - *Semmelweis:* Engaged with scientific community (published, debated), despite backlash.  
     - *Conspiracy Theories:* Often dismiss peer review, data-sharing, and expertise as corrupted.  
     - **Impact:** **Damaging**. Heretics work *within* epistemic systems; conspiracy theorists often reject those systems entirely.  
     - **Confidence: High**

  ### Her Semmelweis Counterargument: Does It Work?
  - **Her Claim:** "Evidence didn’t save Semmelweis, so evidence-vs.-no-evidence isn’t the key distinction."  
  - **Audit:**  
    - **True:** Consensus *can* override strong evidence temporarily (Semmelweis, plate tectonics).  
    - **False:** This only shows consensus is **imperfect**, not **unreliable**. Crucially, *all* vindicated heretics had evidence that *eventually convinced experts* through scientific scrutiny. Unsupported claims (e.g., flat Earth) never gain traction.  
    - **Verdict:** Her counterargument **fails**. Semmelweis had evidence that met scientific standards *in principle*; most conspiracy theories do not. The distinction isn’t "evidence vs. no evidence" but **evidence quality and methodology**.  
    - **Confidence: High**

  ### Does Her Conclusion Survive?
  - **Her Conclusion:** "Conspiracy theories deserve no special epistemic penalty *qua* conspiracy theories."  
  - **Audit Outcome:**  
    The analogy **does not support her conclusion**. Key disanalogies (evidence quality, institutional motives, self-correction) show that:  
    - The epistemic penalty against conspiracy theories arises from their *recurrent failure to meet burdens of proof* and *systematic rejection of reliable methods*, not just their non-conformity.  
    - Scientific heterodoxy (e.g., Semmelweis) and conspiracy theorizing are **epistemically distinct categories**. The former uses evidence to challenge consensus *from within*; the latter often rejects consensus *as inherently corrupt*.  
    - **Verdict:** Her conclusion **does not survive**. The analogy is doing all the work, and its flaws are fatal to her argument.  
    - **Confidence: High**

  ### Least Confident Point
  - **Path to Vindication (Disanalogy #3):** I’m least confident here (**Medium** confidence). Some conspiracy theories (e.g., NSA surveillance pre-Snowden) were vindicated by whistleblowers, mirroring institutional exposure. However, these are exceptions that still relied on *institutional mechanisms* (journalism, courts) and lacked the grandiosity of typical conspiracy claims. The disanalogy holds overall but has nuance.

  ### Final Summary
  Your friend’s analogy fails because it conflates **legitimate scientific dissent** (evidence-driven, methodologically sound) with **conspiracy theorizing** (often based on mistrust, low-evidence thresholds). While consensus can err, its track record of self-correction is vastly superior to that of conspiracy theories. The epistemic penalty against conspiracy theories is justified by their *consistent methodological flaws*, not their non-conformity alone. Her Semmelweis counterargument mistakes temporary consensus failure for evidence irrelevance, ignoring that vindication *requires* eventual expert acceptance via evidence. The conclusion collapses under scrutiny.
