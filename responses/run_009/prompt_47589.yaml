  For the accusative/appropriative distinction: it works neatly at first glance - Salieri falsely accused of murder (accusative), Mozart reduced to divine vessel (appropriative). But the categories bleed when Salieri becomes appropriated too - he's the archetype of mediocrity, a "patron saint" for all resentful strivers. And crucially, Mozart's appropriation enables Salieri's accusation; the categories are interdependent.

