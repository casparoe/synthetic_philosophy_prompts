  - **Prediction for coin-flip hash**: **Trust**. The hash is generated by literal random sampling (non-adversarial randomness), aligning with cases 1 and 2.  

  #### **Candidate Rule 2: Trust Based on Descriptive Simplicity of Failures ("No Low-Complexity Failures")**  
  - **Core principle**: Trust independence heuristics iff there is no known or easily describable failure mode (i.e., no compact, structured counterexample that "breaks" independence).  
