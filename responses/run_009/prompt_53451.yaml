    - **Primality testing**: Trusts for random odd numbers (non-adversarial randomness) but not adversary-given numbers (adversarial generation).  
    - **3-colorability**: Trusts for random graphs (non-adversarial randomness).  
    - **SHA-256**: Rejects because randomness is "designed in" via cryptanalysis, not inherent to generation.  
