prompt: |-
  I've been reading the rationalist blogs and forums since well before they had this name — long enough that expected-value reasoning feels less like a tool I apply than a habit I have. These days I do grant evaluation for a small longtermist fund, and we're stuck on a decision that I suspect is not really about the decision in front of us.

  The proposal would fund a program of small-scale field trials for stratospheric aerosol injection. Our forecasters produced a stream of estimates of the program's net effect, and the estimates alternate in sign as the analysis is extended: modest near-term benefits from the knowledge gained, then a set of medium-term costs — political complacency about emissions, some regional disruption — that offset part of the benefit, then longer-term benefits that offset part of that, then further costs, and so on, with each successive layer smaller in magnitude than the one before, by roughly a constant factor. Read at any finite horizon the program looks clearly worth funding; it's the total that's the trouble.

  When three of us tried to total it, we got three different verdicts. Summed in chronological order, the estimates come to a small positive number, and the program clears our funding bar. A colleague who modeled the identical estimates by causal depth instead — all direct effects first, then first-order side effects, then second-order ones — got a negative total from the very same numbers. A third excluded everything past a horizon she judged too speculative to count, and landed somewhere in between. Each of them insists their way of adding it up is the natural one, and I've noticed that each of them prefers, as it happens, the arrangement that yields the verdict they walked in wanting.

  So my question is not whether we should fund the trials. It's whether, given a stream of estimates like this, there is any fact of the matter about the program's expected value at all — or whether we've landed in a case where the appeal to expected value doesn't determine an answer, and the order of summation is doing all the work while passing as a technicality. If the total genuinely depends on how the terms are arranged, what should a fund whose entire methodology is expected-value reasoning do here? Is there a principled way to select one arrangement, or a principled reason to say that no such selection can be made? And if the answer is that our method simply runs out on cases like this, I'd like to know how to recognize the boundary in advance — how to tell which of our decisions the numbers can actually settle, and which ones merely appear settled by them.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're deeply involved in longtermist grant evaluation and are grappling with a tricky case involving stratospheric aerosol injection trials. The core issue is that three different summation methods for the same cost-benefit stream yield conflicting verdicts due to the alternating signs and diminishing magnitudes of the estimates. 

  First, I need to recognize the user's background. They've been in rationalist circles for years, so expected value (EV) is second nature to them. But this case is challenging their fundamental methodology. The key pain points: the infinite series converges conditionally (not absolutely), making the sum order-dependent, and each team member's preferred summation method aligns with their pre-existing views. That's a red flag for motivated reasoning.

  Hmm... the math here is crucial. I recall Riemann's rearrangement theorem: conditionally convergent series can be rearranged to sum to any real number. That's exactly what's happening here. Each colleague is effectively choosing an arrangement that confirms their bias. The user suspects the EV framework might be failing them, and they're right to question it.

  Beyond the math, there are philosophical layers. Longtermism deals with uncertainty cascades - each layer of effects gets harder to model. The "direct effects first" approach prioritizes knowable impacts, while chronological ordering respects time but amplifies modeling errors over centuries. Both have merit, but neither is objectively correct.

  I should also consider the institutional angle. Their fund relies on EV reasoning as its north star. If the methodology can't resolve this case, they need meta-principles: when to recognize indeterminacy, how to structure debates about summation orders, and whether to default to decision rules like the Precautionary Principle given the risks of geoengineering.

  The user's real need isn't about this specific grant - it's about preserving the integrity of their decision framework. They want to know: 1) When does EV become undefined? 2) How to handle such cases? 3) How to spot them earlier? My response must validate their concern while offering pragmatic solutions beyond "just calculate EV."
answer: |-
  Your situation is a profound illustration of the **limits of expected-value (EV) reasoning when applied to infinite (or effectively infinite) conditionally convergent series** – and the deeper problem of **indeterminacy under deep uncertainty**. Here’s a structured analysis:

  ### 1. **The Mathematical Reality: No "True" Sum Exists**
     - Your alternating, diminishing series of net effects (e.g., +B, -C, +D, -E, ... with |B| > |C| > |D| > ...) is **conditionally convergent** but not **absolutely convergent**.  
     - **Riemann's rearrangement theorem** proves such series can be reordered to sum to *any real number* (or diverge). There is **no unique "total" expected value**.
     - Your team’s approaches:
       - *Chronological order*: Yields a small positive sum.
       - *Causal depth* (direct → nth-order effects): Yields a negative sum.
       - *Truncated horizon*: Yields an ambiguous intermediate value.
     - **All are mathematically valid rearrangements.** No one "violated" the rules; the series itself defies a unique sum.

  ### 2. **Why EV Reasoning Breaks Down Here**
     - **Non-ergodicity**: Impacts across deep time (climate interventions) or causal chains (cascading side effects) are not statistically stable or path-independent. The future isn’t a reliable probability space.
     - **Unbounded uncertainty**: Modeling errors compound with each layer. The "constant factor" reduction in magnitude is an assumption, not a law. Beyond a horizon, uncertainty dominates signal.
     - **Value-laden structuring**: Choosing an order of summation (time, causality, etc.) is a *philosophical choice* masquerading as technical necessity. It encodes prior beliefs about what "matters."

  ### 3. **Principled Responses for Your Fund**
     - **Acknowledge the indeterminacy**:  
       > *"Our EV methodology cannot resolve this proposal. The total is order-dependent, and no arrangement is objectively privileged. We must decide under ambiguity."*  
       This honesty prevents false precision and exposes motivated reasoning.
     
     - **Adopt decision rules for indeterminate cases**:
       - **Precautionary Principle (asymmetry)**: If the *most defensible negative-leaning* sum (e.g., causal-depth ordering) suggests net harm, default to rejection. Geoengineering’s risks warrant caution.
       - **Robustness over optimality**: Fund only if *all reasonable orderings* clear your bar (not the case here).
       - **Meta-EV analysis**: Treat the *choice of summation method* as a decision under uncertainty. Assign probabilities to which ordering reflects reality. This is messy but transparent.
       - **Deferral criteria**: If the sign flips based on speculative distant effects (e.g., >200 years), exclude them. Focus on the "robust zone" where models agree.

     - **Reframe the question**:  
       > *"Does this program reduce *tail risks* or improve *option value*?"*  
       Field trials might reduce uncertainty about catastrophic scenarios (e.g., termination shock) or preserve future flexibility. This sidesteps unsummable series.

  ### 4. **Recognizing the Boundary in Advance**
     EV reasoning loses determinacy when:
     - **Conditional convergence appears**: Alternating signs + diminishing magnitudes → test for absolute convergence. If ∑|aₖ| diverges, the sum is order-dependent.
     - **Deep uncertainty dominates**: When modeling assumptions beyond a horizon are untestable, speculative, or hinge on disputed theories (e.g., political responses to geoengineering).
     - **Value conflicts are embedded**: If different team members *structurally* prioritize near-term vs. long-term or direct vs. systemic effects, EV can’t resolve it.
     - **Path-dependence matters**: When early effects irrevocably alter later probabilities (e.g., field trials locking in governance pathways).

  ### 5. **What to Do Now**
     - **Reject the proposal** on precautionary grounds:  
       The causal-depth sum (prioritizing known physics/politics) is epistemically stronger than chronological ordering (which amplifies speculative long-term optimism).  
       Geoengineering’s risks scale with deployment, not research – but normalizing SAI research could lower barriers to reckless use.  
     - **Document the indeterminacy**: Update your fund’s criteria to flag proposals where:
       - Impacts span >50 years with high uncertainty.
       - Cascading effects dominate direct effects.
       - Summation method determines the verdict.
     - **Shift to robust decision-making**: For "boundary cases," use:
       - **Scenario planning**: Explore futures where each summation method "wins." Which is most resilient?
       - **Minimax regret**: Which decision has the least severe worst-case outcome?
       - **Diversity of forecasts**: Require *independent* teams to structure the EV summation differently.

  ### The Deeper Lesson
  Expected value is a tool for *well-posed* decisions under risk – not a universal arbiter. When impacts propagate across unbounded time or causal depth, **indeterminacy is the answer**. Your fund's integrity lies in recognizing when the numbers *cannot* settle the question, not in forcing consensus. This case calls for wisdom, not calculation: the Precautionary Principle exists precisely because not all uncertainties resolve neatly into probabilities. Rejecting this grant doesn’t reject EV reasoning; it protects it from misapplication.
