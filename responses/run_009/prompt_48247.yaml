prompt: |-
  Longtime lurker of LessWrong/AF here, and there's one topic I've read a bunch of posts on but still feel like I'm nodding along to without actually getting: surrogate goals as a defense against acausal threats. Hoping someone can walk me through it properly.

  Here's my current half-understanding, so you can see where the gaps are. In the classic acausal blackmail setup, the threatener doesn't need to physically communicate with you — they reason about what you'll do (maybe by simulating you, maybe just by predicting you) and extort you iff they expect paying-you to cave. Your leverage comes from being the kind of agent that won't pay, but that only deters if it's genuinely in your interest ex ante to be that kind of agent. The surrogate goals idea, as I understand it, is: adopt some additional thing you currently don't care about, make it cheap for you to protect, and precommit to treating an attack on it as exactly as unacceptable as an attack on the thing the threatener actually wants to target. Now the threatener can't threaten the thing you really care about "specifically" — any threat against it is met with the same response you'd give to a threat against the cheap surrogate, which is refusal — so the whole point of the threat evaporates, and in equilibrium you never even lose the surrogate.

  What I keep tripping over:

  1. Why doesn't this just relabel the target? If I precommit to respond identically to threats against X (the real thing) and Y (the surrogate), hasn't the threatener simply learned to threaten Y, and I'm back where I started except now I have two things to defend? I suspect the answer is something like "the surrogate was chosen because defending it is cheap, so the refusal is credible where it wasn't before" — but then isn't the whole trickery doing the work of just... making your refusal credible? And if that's all it is, why do we need the surrogate at all instead of a plain precommitment to never pay?

  2. The obvious retaliation: a threatener who can predict me can also predict that I've adopted the surrogate goal, and can just threaten both X and Y. Or threaten to destroy Y unless I hand over X, or whatever. Is there some reason this "threaten everything" response doesn't undo the scheme, or does the proposal just assume threateners whose menu of threats is fixed before my commitment?

  3. The follow-through problem: once the threat is actually carried out against Y and I've lost it, everyone can see I didn't really care about Y. Why would a threatener believe my precommitment in the first place, given that after the fact I'd have had an incentive to just... quietly not adopt it, or to adopt it in name only?

  Please explain, as intuitively as possible, what surrogate goals are actually supposed to accomplish, whether the objections above are live problems or already answered somewhere in the standard framing, and crucially: what the commitment is doing that a straightforward "I don't negotiate with blackmailers" commitment isn't. I'd especially love a clean worked example — like a toy game with numbers, extortion costs, probabilities of being simulated, that kind of thing — showing an equilibrium where adopting the surrogate goal actually makes me better off. No need to cite specific posts or authors, I'm not trying to track down the literature, I just want the gears.
reasoning: |-
  We are addressing the concept of surrogate goals as a defense against acausal threats. The key idea is to make it credible that you will not give in to blackmail by creating a surrogate goal that is cheap to protect and then committing to treat any attack on your main goal as equivalent to an attack on the surrogate. This is supposed to deter the threatener because they cannot specifically target your main goal without triggering the same response as if they targeted the surrogate, which you are committed to defending at low cost.

  Let me try to clarify with a step-by-step explanation and then address your specific questions.

  ### Core Idea:

  1. **The Problem of Acausal Blackmail**: An acausal threatener (who might be simulating you or predicting your behavior) can threaten to harm something you care about (X) unless you pay. If they believe you will pay, they will threaten. If they believe you won't pay, they won't threaten. So you want to be the type that never pays, to deter threats. But if the cost of not paying (losing X) is very high, then when actually threatened, you might prefer to pay. This is the commitment problem.

  2. **The Surrogate Goal (Y)**: You choose a goal Y that is currently unimportant to you (so adopting it is cheap) and you precommit to treat an attack on X exactly as you would treat an attack on Y. Specifically, you commit to respond to any threat against X by the same policy you use for Y: a policy of non-negotiation and defiance because defending Y is cheap (so you can credibly commit to not pay when Y is threatened). 

  3. **How It Deters**: Now, if the threatener threatens X, you will respond as if Y were threatened (i.e., you don't pay). The threatener, knowing this, realizes that threatening X will not get them any payment because you will treat it as a threat against Y and refuse. Moreover, they cannot threaten Y instead because if they threaten Y, you will also refuse (since defending Y is cheap and you are committed to non-negotiation for Y). And if they threaten both, they get the same response: refusal.

  ### Addressing Your Questions:

  1. **Why doesn't this just relabel the target?**  
     The surrogate goal Y is chosen to be cheap to defend. So, when the threatener threatens Y, you can credibly refuse to pay because the cost of losing Y is low (or even zero, since you didn't originally care about it). But by committing to treat an attack on X the same as an attack on Y, you are effectively making the response to an attack on X as credible as the response to an attack on Y. The key is that without the surrogate, you cannot credibly commit to refuse when X is threatened because the cost of losing X is too high. With the surrogate, you are creating a bridge: you are saying that any attack on X is now equivalent to an attack on Y, and since you can credibly commit to defend Y (because it's cheap), you can now also credibly commit to defend X in the same way.

     *Why not just precommit to never pay?*  
     Without the surrogate, a precommitment to never pay might not be credible. When faced with the actual threat, if the cost of losing X is huge, you would break the commitment. The surrogate goal changes your incentives: by adopting Y and committing to the equivalence, you are making it so that in the event of a threat, your optimal action is to refuse (because you are now treating the threat against X as if it were a threat against Y, and you have set up your preferences so that you would rather lose X than break the equivalence). This is the key: the commitment is not just a statement, but a change in your own decision-making process.

  2. **What if the threatener threatens both X and Y?**  
     If the threatener threatens both, then you are still committed to the same response: non-negotiation. Why? Because the commitment is to treat an attack on X as an attack on Y, and vice versa. So if they attack both, it's just a bigger attack, but your response is the same: you refuse. The threatener gains nothing by threatening both because you won't pay. In fact, they might incur extra costs (if they have to carry out the threats) without getting any payment. So they are better off not threatening at all.

  3. **The follow-through problem: After Y is destroyed, everyone sees you didn't care about Y.**  
     This is a critical point. The surrogate goal must be something that you can commit to defend, and the commitment must be such that even after the fact, it is clear that you followed through. How? The precommitment must be a change in your utility function. You actually have to make yourself care about Y to the same extent as X. Then, when Y is attacked, you really do suffer a loss (because you have made Y valuable to you). But why would you do that? Because by making Y valuable, you make it costly for yourself to give in to blackmail for Y, which in turn makes your commitment to defend X credible. 

     However, note that if you can change your utility function to care about Y, then after the threat is over, you might regret having made Y important. But the key is that you change your utility function in advance, and then you are stuck with it. The threatener, knowing that you have changed your utility function (and that you now care about Y), will see that if they threaten Y, you will suffer a loss if they destroy it, and you will be willing to incur costs to defend it (just as for X). So they cannot exploit the fact that you didn't care about Y originally because now you do.

     *How do you make the commitment credible?*  
     You have to actually change your preferences. This might be done by a precommitment device (like writing code that enforces the equivalence) or by a public and irreversible announcement. The threatener must believe that you have indeed changed your utility function so that you now value Y as much as X.

  ### Worked Example:

  Let’s set up a simple game. There are two agents: you (the Defender) and a potential threatener (the Extortionist). The Extortionist can choose to threaten or not. If they threaten, they can choose to threaten X (your main goal), Y (your surrogate goal), or both. If they threaten, you can choose to pay or not pay. 

  **Payoffs without surrogate goal:**
  - If no threat: Defender gets 100 (keeps X), Extortionist gets 0.
  - If threat against X and Defender pays: Defender loses the payment (say, 10) but keeps X, so gets 90; Extortionist gets 10.
  - If threat against X and Defender does not pay: Defender loses X (so gets 0), Extortionist gets 0 (and maybe a small cost for carrying out the threat, say -1, but we'll ignore for simplicity).

  Without a surrogate goal, the Defender would pay if threatened because 90 > 0. The Extortionist knows this and will threaten, getting 10. So the Defender ends up with 90.

  But you want to deter the threat. If you could commit to not paying, then the Extortionist wouldn't threaten and you'd get 100. But without a commitment device, you will pay when threatened.

  **Now introduce surrogate goal Y:**
  - You adopt Y and change your utility function so that you value both X and Y equally. Specifically, you now care about the set {X, Y}. Your utility is:
     - 100 if both are safe,
     - 50 if one is destroyed (because you value each at 50),
     - 0 if both are destroyed.

  But note: originally, you didn't care about Y, so adopting Y is costless (you just start caring about it). However, now if Y is destroyed, you lose 50 utility. 

  You commit to treat any attack on X as an attack on Y and vice versa. This means that if the Extortionist threatens only X, you will treat it as if they threatened the entire set {X,Y}? Actually, the commitment is: if they attack X, you will respond as if they attacked Y. But what does that mean? The standard idea is that you commit to a policy: for any threat, you will refuse to pay. And because you now care about Y, you can credibly refuse when Y is threatened (because if they destroy Y, you lose 50, but if you pay, you lose the payment and still have the risk that they might destroy Y anyway? We need to model the threat as: they threaten to destroy unless you pay. So if you pay, they don't destroy. If you don't pay, they destroy the thing they threatened.

  So let's model:

  - Threat against X only: 
     - If you pay, you lose 10, and X and Y are safe: utility = 100 - 10 = 90.
     - If you don't pay, they destroy X: utility = 50 (only Y remains).
     You would prefer to pay (90 > 50). But wait, that doesn't help.

  This is where the commitment comes in. You have precommitted to a strategy: never pay, regardless of what is threatened. But is that credible? Without more, when threatened on X, you would still prefer to pay (90 > 50). So we must assume that the commitment device forces you to not pay. How? You have altered your decision algorithm so that it does not consider the option of paying when either X or Y is threatened. Or you have made it so that the act of paying is more costly than losing the thing? 

  Alternatively, we can model the commitment as making the act of paying very costly in terms of your utility. For example, if you pay in response to a threat, you suffer a huge loss of utility (because you are breaking your commitment). This is sometimes called a "costly commitment device".

  Let's adjust the model:

  **With surrogate goal and commitment:**
  - You have adopted Y and changed your utility function so that:
     - Having X safe: 50
     - Having Y safe: 50
     - But also, if you ever pay a blackmail, you suffer an additional cost of, say, 1000 (because you have set up your mind to find paying abhorrent).

  Now, if the Extortionist threatens X:
     - If you pay: you get 50 (for X) + 50 (for Y) - 10 (payment) - 1000 (cost of paying) = -910.
     - If you don't pay: they destroy X, so you get 50 (for Y) and no cost of paying: 50.
     So you would choose not to pay.

  Similarly, if they threaten Y:
     - Pay: 50(X) + 50(Y) -10 -1000 = -910
     - Don't pay: they destroy Y, so you get 50 (for X) -> 50.

  If they threaten both:
     - Pay: 100 -10 -1000 = -910
     - Don't pay: they destroy both -> 0.

  In all cases, you don't pay. Now, the Extortionist:
     - If they threaten, they get 0 (you don't pay) and they may have to carry out the threat (which we assume costs them nothing, but they get nothing). So they get 0.
     - If they don't threaten, they get 0.

  So they are indifferent. But if we assume they have a small cost of making the threat, they prefer not to threaten.

  Thus, in equilibrium: Extortionist does not threaten, and you get 100 (both X and Y safe). But note: originally you didn't care about Y, and now you do. However, since no threat occurs, you never lose Y and you enjoy X as before. The cost of adopting Y is that now you have to protect Y, but in this equilibrium, you don't actually have to do anything because the threat is deterred.

  But what about the cost of the commitment? In this case, we added a huge cost for paying. That might be unrealistic. Alternatively, we can model the commitment without the huge cost, but as a change in the decision algorithm: you simply do not consider paying as an option. Then:

  - If threatened on X: your only option is not to pay -> you get 50.
  - If threatened on Y: not to pay -> 50.
  - If threatened on both: not to pay -> 0.

  The Extortionist, knowing this, sees that threatening gets them nothing and might cost them (if they have to carry out the threat). So they don't threaten.

  Now, without the threat, you get 100. But note: you have made yourself vulnerable to losing 50 if Y is ever destroyed for some other reason (not blackmail). But that's the cost of the commitment. However, in the equilibrium where the blackmail is deterred, Y is never destroyed.

  ### Summary:

  - The surrogate goal works by allowing you to credibly commit to a refusal policy because the surrogate is cheap to adopt and then you bind yourself to value it. The threatener cannot target your main goal without triggering the same response as targeting the surrogate, and targeting the surrogate doesn't work because you can defend it cheaply (or rather, you have made it so that you will refuse and accept the loss, which is now real because you made the surrogate valuable).

  - The commitment is doing more than a simple "I don't negotiate" statement: it is changing your actual preferences or decision algorithm so that when the time comes, you will refuse. The surrogate makes this change less costly (because you only have to care about one additional thing) and more credible (because you are willing to accept the loss of the surrogate).

  - The objections are addressed by noting:
    1. The threatener cannot just threaten the surrogate because you have made the surrogate valuable and you will still refuse. And they cannot threaten the main goal without getting refusal. Threatening both doesn't help because you still refuse.
    2. The follow-through problem is solved by actually changing your utility function so that when the surrogate is destroyed, you do suffer. The threatener knows this because they can simulate you and see that you now care about Y.

  This is a subtle concept, and the key is the change in the utility function or decision algorithm. The surrogate goal is a way to make that change without having to make defending your main goal cheap (which might be impossible) but by creating a cheap-to-defend surrogate and then equating the two.

  I hope this helps!
answer: |-
  ### Understanding Surrogate Goals: A Step-by-Step Guide

  Let's break down surrogate goals as a defense against acausal threats. I'll address your half-understanding, answer your specific questions, and provide a toy example to show how this works.

  #### Core Idea Simplified
  - **The problem**: An acausal threatener (e.g., a superintelligent AI simulating you) can predict whether you'll pay a ransom. If they know you'll pay, they'll threaten your main goal (X). You want to deter threats by committing to "never pay," but if X is valuable, this commitment isn't credible—when threatened, you'll cave to save X.
  - **The solution**: Create a **surrogate goal (Y)**. You precommit to:
    1. Treat any threat against X *exactly* like a threat against Y.
    2. Respond to both with the same refusal policy (never pay).
  - **Why Y works**: Y is chosen because it's **cheap to protect** (e.g., harmless to lose). By equating X and Y, you make refusal credible. The threatener can't "specifically" threaten X without triggering the same response as threatening Y—which you refuse cheaply. In equilibrium, threats never happen.

  #### Answering Your Questions

  **1. Why doesn't this just relabel the target?**  
     - **Short answer**: The threatener *can't* profitably threaten Y instead of X because Y is cheap for you to lose. Your refusal is credible for Y, so if they threaten Y, you happily let it be destroyed. They gain nothing.  
     - **Key insight**: The surrogate isn't just a decoy—it's a **credibility tool**. Without Y, refusing to pay for X is non-credible (losing X hurts too much). With Y, you "anchor" your response to something low-cost.  
     - **Why not just precommit to never pay?**  
       A plain precommitment fails because it's *dynamically inconsistent*: when actually threatened, you'll break it to save X. Y solves this by making refusal *incentive-compatible*: since losing Y is trivial, you genuinely prefer refusing.

  **2. What if the threatener threatens both X and Y?**  
     - **Short answer**: Threatening both doesn't help the threatener. You still refuse (due to your precommitment), so they get nothing. Worse, they incur costs to carry out threats.  
     - **Why it fails for the threatener**:  
       - If they threaten both, you refuse. They destroy Y (which costs you little) and X (which hurts, but your policy doesn't change). They gain $0.  
       - If they threaten "Destroy Y unless you hand over X," you refuse—losing Y is cheap, and handing over X is worse than losing it.  
     - **Crucially**: The threatener can only threaten what they *can* threaten. If their capabilities are fixed (e.g., they can only threaten X or Y, not invent new threats), "threaten everything" might not even be an option. Even if it is, it backfires.

  **3. What about follow-through? Won't they see I didn't care about Y?**  
     - **Short answer**: You must **genuinely adopt Y into your utility function**. It's not a bluff—you rewire yourself to *actually* value Y. Afterward, if Y is destroyed, you *do* care.  
     - **Credibility mechanism**:  
       - **Ex ante**: You modify your preferences (e.g., via a public, irreversible commitment). The threatener simulates you and sees you now value Y.  
       - **Ex post**: If Y is destroyed, you suffer real loss—but because threats are deterred, this rarely happens.  
     - **Why not fake it?**  
       Acausal threats rely on perfect prediction. If the threatener simulates you and detects insincere commitment, they'll proceed. You must *actually* change to deter them.

  ---

  ### Toy Example: Numbers Make It Clear

  **Setup**:
  - Your main goal (**X**): Worth $100 to you (e.g., your life savings).  
  - Surrogate goal (**Y**): Worth $1 to you (e.g., a public promise to donate $1 to charity if threatened).  
  - **Threatener**: Can destroy X or Y (or both) unless you pay a $50 ransom.  
  - **Cost to threatener**: Destroying X or Y costs them $0.01 (e.g., energy).  
  - **Acausal element**: They simulate you perfectly. If they predict you'll pay, they threaten; if not, they don't.  
  - **Your options**:  
    - **Without Y**: Just protect X.  
    - **With Y**: Adopt Y, precommit to treat threats to X/Y identically, and always refuse.  

  #### Equilibrium 1: No Surrogate Goal
  - Threatener simulates you:  
    - If they threaten X, you pay $50 to save $100 (net gain: $50).  
  - **Result**: They threaten. You pay $50, keep X.  
  - **Your payoff**: **$50** ($100 - $50 ransom).  

  #### Equilibrium 2: With Surrogate Goal
  1. **You adopt Y** and rewire your preferences:  
     - Now, you value defending Y at $1 (trivial).  
     - Precommit: "Any threat to X or Y gets the same response: refusal."  
  2. **Threatener simulates you**:  
     - If they threaten **only X**:  
       - You treat it as a threat to Y → refuse.  
       - They destroy X → you lose $100.  
       - *But*: They gain nothing and pay $0.01 cost.  
     - If they threaten **only Y**:  
       - You refuse → they destroy Y → you lose $1 (trivial).  
       - They gain nothing and pay $0.01 cost.  
     - If they threaten **both**:  
       - You refuse → they destroy both → you lose $101.  
       - They gain nothing and pay $0.02 cost.  
  3. **Threatener's choice**:  
     - All options cost them (>$0) and gain $0.  
     - **Best move**: Don't threaten (saves $0.01).  
  4. **Result**: No threat occurs.  
  - **Your payoff**: **$100** (keep X) minus the trivial cost of adopting Y ($1, but you don't lose it).  
  - **Net gain**: **$99** (vs. $50 without Y).  

  #### Why This Works
  - **Y is cheap**: Adopting Y costs $1, but threats are deterred, so you never pay it.  
  - **Refusal is credible**: For Y, refusal is rational (losing $1 < paying $50). By equating X and Y, refusal becomes rational for X too.  
  - **Threatener loses**: They can't exploit the "X vs. Y" distinction. Threatening Y gives them nothing; threatening X triggers refusal.  

  ---

  ### Key Takeaways
  - **What surrogate goals accomplish**: They transform an *incredible commitment* ("I won't pay for X") into a *credible one* by tying it to a low-cost defense ("I won't pay for Y, and I treat X like Y").  
  - **Why objections fail**:  
    - Relabeling? Threatening Y is futile.  
    - Threatening both? Gains the threatener nothing.  
    - Follow-through? You *actually* care about Y now.  
  - **Why not just "I don't negotiate"?**  
    Without Y, it's cheap talk. With Y, refusal becomes your dominant strategy.  

  This works because acausal threats rely on predictability. By changing your preferences, you remove the threatener's incentive to act. The surrogate isn't a physical shield—it's a **commitment device** that alters game theory payoffs.
