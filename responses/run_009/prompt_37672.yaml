  ### 1. **Candidate Principles**  
  #### (A) **Self-Sampling Assumption (SSA)**  
  - **Definition**: You should reason as if you are a random sample from the set of all *actual observers* (or observer-moments) in your reference class, conditional on your evidence.  
  - **Mechanism**: Uses the *actual* number of observers in each hypothesis. Favors hypotheses where your existence/observation is *typical* (e.g., early birth ranks suggest fewer total humans).  
  - **Reference Class**: Typically "observers with similar evidence" (e.g., awakenings in Sleeping Beauty, humans in Doomsday).  

  #### (B) **Self-Indication Assumption (SIA)**  
  - **Definition**: You should assign prior probabilities proportional to the *expected number of observers* in each hypothesis. Favors hypotheses with more observers because they imply more "slots" for you to exist.  
  - **Mechanism**: Adjusts priors based on observer count; hypotheses with more observers gain higher prior probability.  

  #### (C) **Full Non-Indexical Conditioning (FNC)**  
  - **Definition**: First, assign a non-indexical prior over objective world-states. Then condition on (1) the fact that you exist as an observer, and (2) your specific evidence.  
  - **Mechanism**: Separates physical evidence from self-locating evidence. Rejects anthropic probabilities as fundamental; uses standard Bayesian updating.  

  #### (D) **Hybrid Approaches**  
