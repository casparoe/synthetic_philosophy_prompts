answer: |-
  ## The Fanatic's Villanelle

  They say, "Define a bound! Cap worth's ascent!"
  Decree that joy can only climb so high.
  **Your best choice sums what might be times its worth.**

  They shrug, "That chance? Too faint to represent,
  A cosmic whisper lost beneath the sky.
  **A chance so small of gain so large still wins.**"

  They plead, "My gut rebels! This instrument,
  Pure math, ignores the fear I can't deny."
  *Your best choice sums what might be times its worth.*

  "Risk-aversion's rational!" they vent,
  "Not weakness, wisdom under heaven's eye!"
  *A chance so small of gain so large still wins.*

  They sigh, "Can knowledge stretch where worlds are bent?
  What proof secures such dreams before they die?"
  **Your best choice sums what might be times its worth.**

  "Pure means need ends," they argue, passion spent,
  "That payoff's dust if no real path draws nigh!"
  *A chance so small of gain so large still wins.*

  So choose: deny the sum, or take the dare
  The axioms compel, laid stark and bare.
  **Your best choice sums what might be times its worth.**
  **A chance so small of gain so large still wins.**

  ---

  **Form as Argument: Why This Works**

  1.  **The Refrains as Premise & Conclusion:**
      *   **Premise (Line 1/Refrain 1):** "**Your best choice sums what might be times its worth.**" This is the core tenet of expected value maximization (EVM): calculate the expectation value (probability multiplied by utility) for each option and choose the highest.
      *   **Conclusion (Line 3/Refrain 2):** "**A chance so small of gain so large still wins.**" This is the fanatic's inescapable implication: for *any* finite certain payoff, there exists *some* tiny probability (ε) and *some* sufficiently vast payoff (U) such that ε * U > certain payoff. EVM forces you to take the bet.

  2.  **The Tercets as Escape Attempts (and Failures):**
      *   **Tercet 1:** "Define a bound!" (Bounded utility) & "Cap worth's ascent!" (Trying to limit utility functions). The refrains return, indifferent to the cap.
      *   **Tercet 2:** "That chance? Too faint to represent," (Probability neglect/discounting tiny probabilities). The conclusion refrain dismisses this.
      *   **Tercet 3:** "My gut rebels!...ignores the fear" (Appeal to risk aversion/emotion). The premise refrain reasserts the cold calculation.
      *   **Tercet 4:** "Risk-aversion's rational!" (Trying to justify aversion within rationality). The conclusion refrain wins again.
      *   **Tercet 5:** "Can knowledge stretch...What proof secures?" (Epistemic humility - can we *know* such huge utilities/tiny probabilities?). The premise refrain demands calculation regardless. "Pure means need ends" (Instrumental critique - if the payoff is unreachable/meaningless, is it valuable?). The conclusion refrain remains unmoved.

  3.  **The Closing Quatrain as Volta:**
      *   "So choose: deny the sum, or take the dare / The axioms compel, laid stark and bare." This explicitly states the fanatic's point: the *only* escape is to reject the premise (EVM - "the sum") itself. There is no comfortable middle ground within the axioms.
      *   The final two lines force the premise and conclusion together: "**Your best choice sums...**" followed immediately by "**A chance so small... still wins.**" Their adjacency highlights their logical connection – the conclusion *is* the consequence of the premise. To reject the conclusion, you *must* reject the premise ("deny the sum").

  4.  **Mathematical Precision:**
      *   Avoids "infinity". Uses precise concepts: "bound," "cap," "chance so small" (ε), "gain so large" (U), "sums what might be times its worth" (Σ p_i * u_i). The fanatic's logic relies on the *existence* of sufficiently large U and sufficiently small ε for any given finite bound, not literal infinity.

  5.  **The Fanatic's Voice:**
      *   Calm, relentless, logical. The refrains are declarative, almost serene. The fanatic isn't shouting; they are stating what they see as undeniable mathematical truth ("laid stark and bare"). The frustration is in the *others'* failed arguments ("They say...", "They shrug...", "They plead...", "They sigh...", "They argue...").

  **Why This Meets Your Bar:**

  *   **Fanatic Debate Follower:** Will instantly recognize the refrains as EVM (premise) and the fanatic's conclusion. They'll see each tercet tackling a specific objection (bounded utility, probability neglect, risk aversion, epistemic limits, instrumental critique) and failing against the immutable refrains. The form *is* the argument: the conclusion keeps returning, enforced by the structure, just like the fanatic claims it's enforced by the axioms.
  *   **New Reader:** Gets a compelling poem about an implacable, calculating mind ("sums what might be," "chance so small of gain so large") facing down emotional and practical objections ("gut rebels," "wisdom," "dust if no real path"). The tension is clear: cold math vs. human intuition and limits. The ending offers a stark choice.
  *   **Honest Ending:** It doesn't resolve for the fanatic *or* smuggle in a refutation. It states the fanatic's position clearly ("The axioms compel") and shows the only escape is costly: abandoning the core premise ("deny the sum"). This is the "expensive" escape you requested. The poem ends with the refrains paired, emphasizing their binding link within the fanatic's framework.
