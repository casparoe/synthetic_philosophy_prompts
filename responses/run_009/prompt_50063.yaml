prompt: |-
  I sit on the moderation panel of a large online community, and last month we received two complaints about the same word in the same week: one concerned a member of the group the word targets, who had used it of herself in a post; the other concerned an ally who used it, in apparent solidarity, in a thread he did not start. The panel let the first stand and removed the second. When I was asked to write up the reasoning, I discovered that I have instincts about these words but no theory, and that the honest order of work is the specification before the rules. So that is what I am asking you for: the desiderata — what any adequate account of how slurs work has to deliver.

  Let the list be motivated by cases rather than abstract properties. At minimum it should cover:

  1. Inertness at the level of truth conditions. In most sentences one can substitute the slur's neutral counterpart without changing the sentence's truth value, yet something has plainly been added. A theory must say what was added and where it lives: in the word's content, in a presupposition, in something like conventional implicature, or in the pragmatics of the utterance.

  2. Projection. Whatever is added survives under negation, in questions, and in the antecedents of conditionals, which is one reason it cannot be an ordinary conversational implicature. The theory must accommodate this without collapsing the added content into an at-issue description.

  3. Derogation versus offense. A slur can demean a group with no member of it present to be offended, and an ordinary insult can offend its hearer without demeaning any group. Our policy cannot treat someone's being upset as the criterion, so the theory must mark this distinction for me.

  4. The same word in different mouths. In-group uses, reclamation, quotation, teaching, the reporting of harassment: the word appears constant while its force varies with speaker, audience, and setting. Either one mechanism generates that variation, or the theory should say honestly that it cannot.

  5. Use and mention. A theory should not predict that a sentence about the word derogates anyone, and my policy must permit metalinguistic uses. Yet it must also handle the bad-faith quoting of a lyric, which suggests the use–mention line is not purely grammatical.

  6. Drift. Words become slurs and cease to be slurs, and this varies across communities. The theory should say what changes when a word becomes a slur: something in the word, or something in the practice around it.

  For each requirement, give the case that makes it a requirement. Then mark which are non-negotiable and which are preferences of a particular camp, and flag any pair you suspect cannot be jointly satisfied — I have a suspicion about the uniformity demanded by the projection data and the variation demanded by reclamation, and I would like your view on whether that tension is real. Tell me also which single requirement does the most to exclude candidate theories. I do not need a scorecard of named accounts, and no reading list: the reasoning is what I want. Finally, the point I actually have to answer for the panel, and I would like it stated plainly: given all of the above, can a policy be written about the word, or only about the utterance and the user?
reasoning: |-
  Okay, the user is part of a moderation panel for an online community and faced a situation where the same word was used in two different contexts: one by a member of the targeted group referring to themselves, and another by an ally in solidarity. The panel allowed the first but removed the second. Now, they need to write up the reasoning but realize they lack a theoretical foundation. They're asking for desiderata—requirements that any theory of slurs must satisfy—based on specific cases rather than abstract properties.

  The user has outlined six key areas that the theory must cover: inertness at truth conditions, projection, derogation vs. offense, variations in usage across different speakers and contexts, use vs. mention distinction, and how slurs evolve over time. For each, they want real cases that make these requirements necessary, and they also want to know which are non-negotiable versus preferences, potential conflicts between requirements, which requirement is most exclusionary for theories, and whether policies can target the word itself or must focus on utterances and users.

  Starting with inertness. The key point here is that swapping a slur with its neutral counterpart doesn't change the truth value but adds something offensive. For example, "He is a [slur]" vs. "He is Italian" both state the same fact about ethnicity, but the slur carries extra baggage. The added element must be explained—whether it's in content, presupposition, conventional implicature, or pragmatics. This seems non-negotiable because any theory ignoring this fails to capture why such words are harmful beyond mere description.

  Next is projection. Whatever the added element is, it persists under negation, questions, or conditionals. For instance, "Isn't he a [slur]?" still implies the derogatory view even as a question. This rules out conversational implicature since those can be canceled. Accommodating this without conflating with descriptive content is crucial. Non-negotiable, as projection is a core linguistic behavior of slurs.

  Derogation vs. offense distinguishes between demeaning a group and causing individual upset. Example: using a slur in a private diary demeans the group even if no one is offended, while "You're clumsy" offends without group harm. A policy can't rely solely on offense reports, so this distinction is vital. Non-negotiable because policies need principled criteria beyond subjective reactions.

  Variation in usage looks at how the same word can have different force depending on context—like in-group reclamation versus an outsider's use. For instance, the n-word used among Black individuals versus by a white person. The theory must handle this variation without overcomplicating. Non-negotiable due to real-world moderation needs, though how to model it (single mechanism vs. multiple) might be debated.

  Use vs. mention addresses when the word is discussed versus used derogatorily. Discussing the word ("'[Slur]' is offensive") shouldn't count as derogation, but bad-faith quoting of lyrics might blur the line. This is non-negotiable for fair moderation, as purely grammatical distinctions aren't sufficient.

  Drift examines how words become slurs or lose that status over time and communities. For example, "queer" shifted from slur to reclaimed term. The theory must explain what changes—the word's meaning or social practices. Non-negotiable to account for linguistic evolution.

  Key tensions arise between projection (requiring stable derogatory content) and variation (allowing context-dependent force like in reclamation). This is a real conflict; theories struggle to accommodate both without compromising. The most exclusionary requirement is likely projection combined with variation, as many theories falter here.

  Regarding the policy question: based on these requirements, policies can't feasibly ban the word outright due to legitimate variations like reclamation, reporting, or education. Instead, policies must consider the utterance context and user's relationship to the targeted group. The panel's decision aligns with this—allowing in-group use but restricting ally usage—as it focuses on speaker position and context rather than the word itself.

  The user's deeper need is to justify their moderation policy with robust theoretical backing, ensuring fairness and clarity while handling complex real-world cases. They need a framework that accommodates nuance without over-relying on subjective judgments, especially to defend decisions to the community.
answer: |-
  Below is a structured specification of desiderata for a theory of slurs, motivated by concrete cases, with analysis of non-negotiables, tensions, and implications for policy. I'll address each requirement as framed, then synthesize your core questions.

  ---

  ### **Desiderata for a Theory of Slurs**  
  *(Motivated by Cases, Ordered by Your Points)*  

  1. **Inertness at Truth Conditions**  
     - **Case**: "He is a [slur for Italian]" vs. "He is Italian." Both sentences are true iff the referent is Italian, but the slur adds derogation.  
     - **Requirement**: The theory must explain what is added (e.g., contempt, dehumanization) and its linguistic status.  
     - **Non-negotiable**: Yes—any theory failing this cannot distinguish slurs from neutral terms.  
     - **Where it lives**: Likely **conventional implicature** (CI) or **presupposition**. CI explains inertness but projects (see #2); pragmatics (e.g., expressive speech acts) struggles with systematic projection.  

  2. **Projection**  
     - **Case**: "She isn’t a [slur], she’s just lazy." → Negation targets "lazy," but the slur’s derogation persists (implied: "others like her *are* [slur]s").  
     - **Requirement**: The added content must survive embedding (negation/questions/conditionals), ruling out conversational implicature.  
     - **Non-negotiable**: Yes—projection is empirically undeniable.  
     - **Accommodation**: Must treat the derogation as **non-at-issue content** (e.g., CI or presupposition).  

  3. **Derogation vs. Offense**  
     - **Case**:  
       - *Derogation without offense*: A private journal entry using a slur for a group with no members present.  
       - *Offense without derogation*: "You’re an idiot!" offends the hearer but demeans no group.  
     - **Requirement**: The theory must separate *group-directed harm* (derogation) from *individual upset* (offense).  
     - **Non-negotiable**: Critical for policy—moderation cannot rely on subjective offense (e.g., allies might be "offended" by reclamation, but that doesn’t make it harmful).  
     - **Mechanism**: Derogation is **systemic devaluation** encoded in the term; offense is context-dependent.  

  4. **Variation Across Contexts/Speakers**  
     - **Cases**:  
       - *In-group reclamation*: A Black person uses the n-word affectionately.  
       - *Out-group use*: A white person uses the same word → hostility.  
       - *Reporting harassment*: "He called me a [slur]."  
     - **Requirement**: The theory must explain force variability without multiplying word meanings.  
     - **Non-negotiable**: Yes—moderation hinges on this (cf. your panel’s decision).  
     - **Mechanism**: Likely **pragmatic** (e.g., speaker authority, intent, community norms). *Some theories* (e.g., semantic) struggle here; others (e.g., hybrid) use speaker-indexed conventions.  

  5. **Use vs. Mention**  
     - **Cases**:  
       - *Mention*: "‘[Slur]’ is a harmful term." → No derogation.  
       - *Bad-faith "quoting"*: Singing a lyric with a slur while winking at the target.  
     - **Requirement**: Must permit neutral mention but capture insincere quotation.  
     - **Non-negotiable**: Yes—policy requires allowing discussion of slurs.  
     - **Solution**: **Grammatical mention** (e.g., quotation marks) vs. **pragmatic pretense** (using "quotation" as a shield for genuine use). The line is **intent and context**, not grammar alone.  

  6. **Drift (Diachronic/Community Variation)**  
     - **Cases**:  
       - *Becoming a slur*: "Gypsy" shifted from ethnic label to slur in many contexts.  
       - *Reclamation*: "Queer" transitioned from slur to proud identifier.  
     - **Requirement**: Must explain what changes—the word’s semantic content or social practices.  
     - **Non-negotiable**: Yes—policy must adapt to linguistic evolution.  
     - **Mechanism**: **Social practice** is primary (e.g., a term becomes a slur when used to subordinate). Semantic content may update accordingly.  

  ---

  ### **Tensions, Trade-offs, and Exclusionary Requirements**  
  - **Key Tension: Projection vs. Variation (#2 vs. #4)**  
    - **The Conflict**: Projection suggests stable, speaker-independent derogation (e.g., CI theories). Variation demands context-dependent force (e.g., pragmatic theories).  
    - **Is it Real? Yes.** Hybrid theories (e.g., "loaded descriptives") *attempt* reconciliation: the *potential* for derogation is semantic, but *activation* depends on speaker/context. Reclamation might "defuse" the CI for in-group speakers. Not all agree this works.  
  - **Most Exclusionary Requirement**: **Projection (#2)**. Theories relying solely on pragmatics (e.g., "slurs express attitude") fail here, as attitudes don’t project systematically. This requirement forces a semantic/presuppositional component, excluding pure pragmatic accounts.  

  ---

  ### **Can Policy Target the Word, or Only the Utterance/User?**  
  **Answer: Policy must primarily address *utterances* and *users*, not the word in isolation.**  
  - **Why?**  
    - **Reclamation & Context (#4)**: The same word can be harmful or empowering. Banning the word wholesale suppresses in-group reclamation and academic discussion.  
    - **Use vs. Mention (#5)**: Policies must allow mentions (e.g., reporting harassment).  
    - **Derogation vs. Offense (#3)**: Harm stems from *how/when/by whom* the word is used, not the word itself.  
  - **Your Panel’s Decision Defended**:  
    - **In-group use permitted**: Speaker’s identity and intent (reclamation/self-identification) negate derogation.  
    - **Ally use prohibited**: Without standing in the group, the ally’s use reactivates the slur’s derogatory history, regardless of intent. Solidarity here is paternalistic, not empowering.  
  - **Policy Guidance**:  
    > *"Use of [slur] is prohibited except when:  
    > (a) used in self-reference by a member of the targeted group; or  
    > (b) mentioned academically, in quotation, or for reporting harm.  
    > Context, speaker identity, and intent are determinative."*  

  ---

  ### **Summary for Your Panel**  
  A theory of slurs must explain why *derogation* (not just offense) is systematically attached to the term yet varies by speaker and context. The deepest tension—between stable projection and fluid reclamation—demands a hybrid approach: semantic encoding of derogation *potential* + pragmatic constraints on its *activation*. **Policy cannot ban the word itself**; it must differentiate utterances based on:  
  - **Speaker-group membership**,  
  - **Grammatical/pragmatic context**,  
  - **Evidence of harmful intent**.  
  Your ruling was linguistically sound: allies weaponize slurs even in solidarity; in-group use reclaims agency. The word is a vessel—but what fills it is defined by who holds it and how.
