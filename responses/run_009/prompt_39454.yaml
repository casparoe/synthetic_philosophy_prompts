prompt: |-
  I've been thinking about this on my own, with no academic background in philosophy, and I can't make sense of a pattern in our laws and institutions — I'd like to know what theory of a person it quietly assumes. It started when a relative of mine with a serious mental illness signed what's called a psychiatric advance directive: while lucid, she authorized hospitalization in advance for a future episode, at a time when she might then be insisting loudly that she wants to leave. Once I noticed that, I saw the same structure everywhere. Casinos keep self-exclusion lists you can join voluntarily and that bar you for years; cars driven by people with past drunk-driving convictions can be fitted with ignition locks the driver agrees to in advance; and in medicine we honor refusals of treatment written by a lucid person decades earlier, even when the patient who now exists, demented and apparently content, wants to go on living. Yet the same legal system draws sharp limits: you can revoke your will any time before death, no contract can make you a slave, and courts refuse to enforce commitments that are too thorough or last too long. So the practice seems to be: the person you are today can bind the person you'll become, but only up to a threshold and only in some areas of life.

  What I want is the implicit theory. What view of rationality across time does this pattern presuppose — that a person is really one agent whose preferences extend over years, so a choice made once counts as made by the whole person; or that each momentary self is separate, and the earlier self gets to speak only when the later self is incompetent, with the past statement working as evidence rather than as a decision; or something like a rule that the sober self is the authentic one and the impaired self simply doesn't count? And is the pattern even consistent? We bind future selves even where they aren't incompetent in any ordinary sense — a gambler on a self-exclusion list who walks past the casino sober and remorseful still can't get in — while refusing to bind them where they are competent, as when someone changes a will. So tell me which parts of the practice strictly require one theory of the self rather than another, where the practice is underdetermined in the sense that several quite different views of the person would license the same rules, and what would actually have to change if we replaced the presupposed view with, say, the idea that only the person existing right now has any claim to decide for themselves.

  Since I gather this territory has real specialists, I'd like the answer to keep separate what is actually settled among them and what is genuinely contested — for instance, whether letting a past self bind a future one protects autonomy or violates it — and not to present one side of that dispute as if it were the consensus. Where the theory you reconstruct would itself be disputed, please say so openly rather than folding it into the background.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've noticed a pattern in laws and institutions where a person can bind their future self in some cases but not others. Examples include psychiatric advance directives, casino self-exclusion lists, and medical refusals of treatment. But there are limits too, like revoking wills or prohibiting permanent contracts. The user wants to understand the implicit theory of personhood behind this pattern.

  First, I need to identify the core tension they're pointing out: why are some future selves bound while others aren't, especially when competence isn't always the factor? The gambler example is key here—sober but remorseful, yet still barred. That challenges a simple incompetence-based explanation.

  The user mentions no academic background, so avoiding jargon is crucial. They’re clearly well-read and thoughtful, though, given the depth of their examples. Their frustration with inconsistency suggests they want coherence, not just a list of theories. They’re asking for the underlying philosophy, so I need to connect legal practices to theories of personal identity and autonomy.

  They specifically want to know which parts of the practice are tied to which theories, where there's flexibility, and what would change if we adopted a present-self-only view. They also want clarity on settled vs. contested issues among specialists. That means I should delineate consensus areas (like the competence model in medical contexts) from debates (like whether precommitment enhances or violates autonomy).

  Breaking down the examples: medical directives often rely on competence at the time of signing, so the "sober self" is seen as authentic. But the casino example complicates this because the future self is competent yet bound. That points to precommitment strategies where overcoming weakness of will is prioritized. Then there's the distinction in wills—why can they be revoked? That might tie into the idea that testamentary dispositions reflect ongoing autonomy, whereas mental health directives address episodic impairment.

  The user’s deeper need might be understanding if the system is philosophically consistent or just a patchwork. They might also be seeking validation that their observation is valid—that there is a tension worth examining. They could be looking for frameworks to advocate for or against certain policies, given their personal experience with psychiatric directives.

  I should consider theories like Parfit's reductionism, Locke's psychological continuity, and Dworkin's precedent autonomy. Highlighting where these theories align with practices and where they conflict is essential. For instance, the irreversibility of some directives might lean on a narrative self view, while revocable wills support a present-oriented autonomy.

  Contested areas include whether binding future selves protects true autonomy (Dworkin) or denies current self-determination (Cohen, Dresser). I need to present both sides without bias. Also, the non-competent vs. competent binding in gambling vs. wills shows that competence isn't the sole factor—time-limited constraints and reversibility matter too.

  If we shifted to a present-self-only view, psychiatric directives might not hold, wills could be irrevocable, and precommitments like self-exclusion might be unenforceable. But that could lead to exploitation and harm, which the current system tries to prevent. The user might be probing whether such a shift is feasible or desirable.

  Finally, I should structure the response around the user's questions: theories required, underdetermined areas, consequences of changing the theory. Emphasize that the system is pluralistic, balancing competing principles rather than adhering to a single theory. Acknowledge the inconsistency they noticed but frame it as a practical resolution of philosophical tensions.
answer: |-
  Your observation cuts to the heart of profound philosophical and legal debates about personal identity, autonomy across time, and the nature of rationality. There is no single, universally accepted "Theory of the Person" that perfectly justifies all these practices – the pattern emerges from a complex *balancing act* between competing principles, reflecting different underlying theories applied in different contexts. Here's a breakdown:

  **Core Theories in Play (and Their Conflicts):**

  1.  **The "Competent Self as Sovereign" (or "Authentic Self") Model:**
      *   **Premise:** A person has an "authentic" or "true" self, identifiable as the self when possessing full rational capacity (lucid, sober, unpressured). This self has the ultimate authority to speak for the person, even to future states.
      *   **Justifies:** Psychiatric Advance Directives (PADs), Medical Refusals of Treatment (via living wills), Ignition Interlock Agreements (signed sober). The lucid/sober self is presumed to know the person's "true" interests and values best, especially regarding threats posed by impaired states. The impaired future self is seen as lacking capacity, so its contemporaneous wishes are overridden by the prior competent expression.
      *   **Limits:** This model *doesn't* easily explain self-exclusion lists where the *future self is sober and competent* but still bound. It also struggles with why revoking a will (lucidly) is always permitted – the new lucid self should be equally sovereign.

  2.  **The "Extended Self / Precommitment" Model:**
      *   **Premise:** Persons are unified agents existing across time. Rationality involves managing predictable future irrationality or weakness of will. Binding future choices is an essential tool for self-governance over time, protecting long-term goals from transient impulses.
      *   **Justifies:** Casino Self-Exclusion Lists, Ignition Interlock Agreements, Ulysses Contracts (like PADs framed as precommitment against future irrationality). The earlier self makes a rational decision to constrain future options to avoid known self-destructive behaviors, even when the future self is momentarily competent but tempted.
      *   **Limits:** This clashes with the refusal to enforce truly permanent or comprehensive commitments (like slavery contracts). Why is a 5-year casino ban acceptable but a lifetime ban (or slavery) not? It also struggles with testamentary freedom – why can't I precommit my property distribution irrevocably?

  3.  **The "Present-Oriented Autonomy / Anti-Paternalism" Model:**
      *   **Premise:** The only self with legitimate decision-making authority is the self that exists *now*. Respecting autonomy means respecting the current wishes of a competent individual. Past selves are "other people" in a morally relevant sense (drawing on thinkers like Derek Parfit regarding psychological connectedness).
      *   **Justifies:** Revocability of Wills, Prohibition of Slavery/Inalienable Rights, Refusal to Enforce "Perpetual" Contracts. The current competent self must have the final say over its own body, property, and future.
      *   **Limits:** This directly contradicts honoring PADs or medical directives when the current (impaired) self objects. It would invalidate self-exclusion lists the moment the gambler changed their mind, even soberly.

  4.  **The "Best Interests / Welfare" Model:**
      *   **Premise:** The primary goal is to protect the person's overall welfare or objective interests, sometimes even against their own expressed wishes (past or present) if deemed irrational or harmful.
      *   **Justifies:** Honoring PADs (to prevent harm during psychosis), Enforcing Ignition Locks (to prevent drunk driving accidents), potentially overriding a demented patient's desire for life-sustaining treatment if the prior directive refused it *and* current suffering is inferred. Courts often use this alongside other models.
      *   **Limits:** This is highly paternalistic and clashes fundamentally with strong autonomy principles. It struggles to explain why we *don't* override a competent person's decision to gamble or make a foolish will, even if it harms them. The definition of "best interests" is also deeply contested.

  **Mapping Your Observations to the Theories (and Settled vs. Contested Areas):**

  *   **Binding Future Selves Where They *Are* Impaired (PADs, Medical Directives for Dementia):**
      *   **Settled Practice (in many jurisdictions):** The law generally accepts the "Competent Self as Sovereign" model here. The prior competent directive is seen as controlling when the current self lacks decision-making capacity. The "Best Interests" model often provides backup justification. **Consensus is relatively high** among legal systems and medical ethics on honoring valid directives for *incompetent* future states.
      *   **Contested Philosophy:** Philosophers fiercely debate whether this truly respects autonomy or violates the current self's residual interests (e.g., Ronald Dworkin's "precedent autonomy" vs. Rebecca Dresser's "then vs. now" critique). Is the demented "self" the *same person*? (Highly contested).

  *   **Binding Future Selves Where They *Are* Competent (Self-Exclusion Lists, Ignition Locks):**
      *   **Settled Practice (with limits):** Precommitment devices are accepted tools. The "Extended Self / Precommitment" model is dominant.
      *   **Contested Philosophy & Practice:** This is where your core tension lies.
          *   Why is binding the *competent* future self acceptable here but not for wills or slavery?
          *   **Thresholds:** Law imposes pragmatic limits – duration (years, not forever), scope (specific harmful behavior, not total control), reversibility (often requires waiting periods or procedures, not instant revocation like a will). These limits reflect a balancing act between the Extended Self model and the Present-Oriented Autonomy model. The **theory justifying *where* to draw these thresholds is deeply contested and often pragmatic rather than purely philosophical**. Harm prevention and the severity of the risk are significant factors.
          *   **Settled?** There's consensus that *some* precommitment is permissible, but **no consensus on the precise philosophical boundary**. Is it about preventing *irrationality* (Extended Self) or preventing *harm* (Welfare), or both?

  *   **Refusing to Bind Future Selves Permanently/Comprehensively (No Slavery, Revocable Wills):**
      *   **Settled Practice & Core Principle:** The "Present-Oriented Autonomy" model is foundational here. Inalienable rights and testamentary freedom are bedrock legal principles. A current competent self cannot be permanently enslaved by a past decision, nor permanently bound in disposing of property after death (as the will only takes effect *after* the self ceases to exist).
      *   **Settled Philosophy?** While the *practice* is settled law, the underlying philosophy is contested. Libertarians strongly support this view. Others argue that certain extreme precommitments *could* be rational expressions of autonomy (e.g., radical religious vows), but society rejects them due to concerns about coercion, changing values, and the fundamental value of ongoing liberty. **The principle of preserving a core of inalienable present autonomy is a strong legal consensus, though its philosophical depth is debated.**

  **What Theory is Strictly Required Where?**

  *   **Honoring Directives for the Incompetent Future Self:** Strictly requires *rejecting* a pure "Present-Oriented Autonomy" model for the incompetent state. It necessitates *some* version of the "Competent Self as Sovereign" model or a strong "Best Interests" override. (Consensus on practice, contested philosophically).
  *   **Enforcing Precommitments Against the *Competent* Future Self (like self-exclusion):** Strictly requires *rejecting* a pure "Present-Oriented Autonomy" model *in that specific context*. It necessitates accepting the "Extended Self / Precommitment" model *at least for bounded, harm-reducing constraints*. (Contested both in practice thresholds and philosophy).
  *   **Allowing Revocation of Wills/Prohibiting Slavery:** Strictly requires *rejecting* a model where the past self can *completely and permanently* extinguish the future self's core liberty or control over property disposition. It necessitates upholding the "Present-Oriented Autonomy" model for fundamental rights and testamentary acts. (Strong legal consensus, philosophically debated foundations).

  **Underdetermined Areas (Multiple Theories Could Fit):**

  *   The specific **duration and scope limits** on precommitments (like casino bans) are heavily underdetermined. A slightly stronger emphasis on Extended Self could justify longer bans; a stronger Present Autonomy view would shorten them. Pragmatic concerns about effectiveness and harm prevention often fill this gap.
  *   The **weight given to a prior directive** vs. inferred current interests in severe dementia cases is underdetermined. Different weightings can be justified by emphasizing Precedent Autonomy (Dworkin) vs. Current Suffering/Welfare (Dresser) vs. Narrative Identity (Schechtman).

  **What Would Change Under a "Present Self Only" Model?**

  Adopting the strict view that *only* the current competent self has any decisional authority would radically alter the landscape:

  1.  **Psychiatric Advance Directives:** Would be advisory only. A person actively refusing hospitalization during an episode, even if psychotic, could not be held if competent *at that moment* by some standard. Commitment would rely solely on dangerousness/imminent risk criteria, not prior wishes.
  2.  **Medical Directives (Living Wills):** Would be ignored if the demented patient seemed content or expressed a desire to live (however interpreted). Treatment would continue based on current presentation/inferred wishes.
  3.  **Casino Self-Exclusion/Ignition Locks:** Would be unenforceable the moment the person changed their mind, even soberly. "I agreed yesterday, but I want in today" would suffice. These programs would collapse as effective tools.
  4.  **Wills:** Might become irrevocable once signed (if viewed as a completed gift or contract), or perhaps only changeable under strict conditions, removing flexibility – though the *irrevocability* aspect might paradoxically align with a stronger past-self-binding view under this model. This is less clear-cut.
  5.  **Contracts:** Might become far more easily voidable based on present desire, undermining stability. Long-term commitments (like mortgages) would be jeopardized.

  **Conclusion:**

  The pattern you observe doesn't stem from one neat theory, but from a **pragmatic pluralism** navigating deep tensions:

  *   **Between Time-Slices:** Recognizing both the importance of the "sovereign" competent self *and* the need for persons to manage their lives across time via precommitment.
  *   **Between Autonomy and Welfare:** Balancing respect for expressed wishes (past or present) with preventing severe harm.
  *   **Between Liberty and Constraint:** Protecting a core of present freedom while allowing tools to combat self-destructive impulses.

  The "threshold" you note reflects where society (through law) currently draws lines between these competing values, heavily influenced by context (severity of harm, nature of impairment, fundamental rights involved). The **Competent Self as Sovereign** model dominates in medical incapacity. The **Extended Self / Precommitment** model justifies bounded constraints on competent future selves for specific harmful behaviors. The **Present-Oriented Autonomy** model fiercely protects fundamental liberties and testamentary freedom from permanent past encumbrance. The **consensus lies in the practical application of these principles in their respective domains**, while the **deep philosophical justification for the boundaries between these domains remains actively and fundamentally contested.** You've identified the central fissure in how we conceptualize the self across time.
