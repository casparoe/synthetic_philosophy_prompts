  Let's design the questions:

  Question 1: Straightforward case
  Scenario: A thin glass vase is sitting on a table. If it were dropped onto a hard tile floor, it would shatter.
  Options:
  A) The vase is fragile.
  B) The vase is not fragile because it hasn't shattered and might never be dropped.

  Question 2: Fink case (inspired by Martin's sorcerer)
  Scenario: A sorcerer is watching over a glass. The sorcerer has cast a spell such that if the glass were about to be struck, it would instantly become unbreakable until the danger passes, and then revert. One day, the glass is struck, and the spell activates: the glass becomes unbreakable and does not shatter.
  Options:
  A) Before being struck, the glass was fragile because it would have shattered without the spell.
  B) Before being struck, the glass was not fragile because the spell would have prevented it from shattering.

  Question 3: Mask case (intrinsic barrier)
  Scenario: A vase is packed in a custom-made styrofoam casing that is permanently attached and designed to absorb impacts. The vase inside is made of thin glass that would shatter if unpacked and dropped. If the packed vase is dropped, the styrofoam absorbs the shock and the vase remains intact.
  Options:
  A) The packed vase is fragile because the glass inside is thin and would break without the casing.
  B) The packed vase is not fragile because it would survive a drop without breaking.

  Question 4: Antidote case (independently introduced interfering agent)
  Scenario: A glass of poison is sitting on a table. The poison is lethal: if drunk, it would kill a person. However, an antidote pill is placed in the glass. If someone drinks the glass, the antidote will neutralize the poison and the person would survive.
  Options:
  A) The glass contains lethal poison because without the antidote it would kill.
  B) The glass does not contain lethal poison because drinking it would not kill.

  Question 5: Mimicry case
  Scenario: A magician sets up a device that looks like a fragile glass. The device is actually made of unbreakable plastic. When the magician "drops" it, he secretly switches it with a real glass that shatters on the floor. To the audience, it appears that the unbreakable plastic object shattered when dropped.
  Options:
  A) The plastic object is fragile because it appeared to shatter when dropped.
  B) The plastic object is not fragile because it is unbreakable, and the shattering was an illusion.

  Question 6: Categorical base for fundamental particles
  Scenario: Electrons have a property called charge. When another charged particle is nearby, they repel or attract. Some philosophers say that charge is just a disposition (the power to repel or attract). Others say that charge must be grounded in some non-dispositional, categorical property of the electron.
  Options:
  A) The charge of an electron is a disposition and there is nothing more to it than the power to exert forces.
  B) The charge of an electron must be based on some non-dispositional property, even if we don't know what it is.

  Question 7: Dispositions as causally efficacious or shorthand
  Scenario: A rubber band is elastic: if you stretch it, it returns to its original shape. When we say the rubber band is elastic, are we describing a real property that causes the return to shape, or are we just summarizing how it behaves?
