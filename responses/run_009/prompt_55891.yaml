prompt: |-
  After a career in condensed matter physics, I have spent my retirement reading philosophy of science, and I have hit a puzzle about the norms of my old profession that I cannot resolve on my own. The community I came from celebrates Einstein's explanation of the anomalous advance of Mercury's perihelion — a discrepancy known since Le Verrier in 1859, sitting in the textbooks for half a century before 1915 — as among the strongest supports general relativity ever received, and it still counts in the theory's favor in every retrospective assessment I know of. Yet the same community, along with the statisticians and machine-learning practitioners who now dominate the funding agencies, treats data that was available while a hypothesis was being built as unable to confirm it: hence the near-sacred status of the train/test split, the disdain for post-hoc curve fitting, and the premium placed on genuinely novel predictions. So the profession both prizes a retrodiction of fifty-year-old data and legislates against counting old data as confirmatory. What view of evidence does this double practice presuppose, if any? I gather philosophers call the general issue the problem of old evidence, and I can see the crude worry myself: if I already gave Mercury's behavior probability one, then conditioning on it should leave my credences untouched. But I would like the implicit epistemology reconstructed honestly — say whether the two halves of the practice actually conflict or whether they only seem to, given different things "confirm" might mean; say whether the practice strictly requires one account of evidence or is compatible with several, including non-Bayesian ones; and tell me what would have to change in how physicists and statisticians go about their business if we replaced the implicit view with a straightforwardly probabilistic one — for instance, whether the train/test distinction would lose its point, and whether anyone would still have a reason to run a new experiment rather than squeeze confirmation out of the data we already have.
reasoning: |-
  Okay, let me dive into this fascinating puzzle from the retired condensed matter physicist. They're pointing out a tension in scientific practice: physicists celebrate Einstein's explanation of Mercury's perihelion advance (old data) as strong evidence for general relativity, yet modern data science treats pre-existing data as invalid for confirming hypotheses. 

  First, I need to unpack why these seem contradictory. The core issue is what philosophers call the "problem of old evidence." If we already knew about Mercury's anomaly, how can it suddenly become evidence for a new theory? The Bayesian challenge is clear: if P(anomaly)=1, then P(theory|anomaly) = P(theory), so no confirmation. But intuitively, it clearly does support the theory.

  Hmm... I recall Clark Glymour's classic critique of Bayesianism here - he argued this shows Bayesian confirmation theory fails to capture scientific practice. But the physicist wants more than just identifying the problem; they want to understand how the two practices coexist and what epistemology underpins them.

  Let me think about different senses of "confirmation." When physicists say Mercury's orbit confirms GR, they're not talking about increasing subjective belief (Bayesian style). They're making a structural claim: that GR provides a necessary explanation where Newtonian physics failed. The anomaly was precisely the kind of problem a theory of gravity ought to solve. This is more about explanatory coherence than probability updates.

  Meanwhile, the train/test split in statistics serves a different purpose: preventing self-deception in model building. It's about reliability assessment rather than theory confirmation per se. These are different epistemic activities - one concerns explanatory power, the other concerns generalization capacity.

  I should also consider the role of novelty. For Mercury's orbit, the novelty isn't temporal but logical - Einstein didn't build GR to fit this data; the explanation emerged naturally from the theory's core principles. Contrast this with curve-fitting where the hypothesis is constructed to match known data points.

  What if we tried to force scientific practice into pure probabilism? We'd lose important distinctions. The train/test protocol might become meaningless since all data would be equally "old." And there'd be no incentive for new experiments - we could just keep reinterpreting existing data. But science doesn't work that way; we value predictive novelty precisely because it tests a theory's independent structure.

  The physicist's implicit epistemology seems to be a hybrid: explanatory considerations handle Mercury-type cases while probabilistic safeguards handle model validation. This isn't inconsistent - it's recognizing that different evidential contexts require different norms. Bayesian updating works well for new data, but old evidence requires considering how the theory reorganizes our understanding of known phenomena.

  In conclusion, the practices don't conflict because they address different problems. The solution isn't choosing one framework but recognizing science's pluralistic epistemology. If we abandoned this for straight probabilism, we'd lose crucial aspects of theory assessment while gaining little.
answer: |-
  Your puzzle cuts to the heart of scientific epistemology, exposing a tension between historical practice and modern methodology. The resolution lies in recognizing that physicists and statisticians are often addressing different epistemic problems, even when using similar terms like "confirmation." Here's a reconstruction of the implicit epistemology:

  ### 1. **Reconciling the Apparent Conflict: Two Senses of "Confirm"**
     - **For Mercury/GR: Explanatory Power Triumphs**  
       Einstein's solution wasn't valued merely because it *fit* existing data, but because it **resolved a persistent anomaly** within a *new theoretical framework*. The confirmation stems from:
       - **Necessity**: GR *required* the anomalous precession as a consequence of its core principles (spacetime curvature), unlike Newtonian gravity where it was an ad-hoc embarrassment.
       - **Unification**: It explained Mercury's orbit using the same equations governing light bending and gravitational time dilation—not by adding Mercury-specific parameters.
       - **Unexpected Precision**: GR matched the precise value (~43"/century) without tuning, demonstrating the theory's **explanatory depth**.  
       *Epistemic function:* This retro-diction tested GR's *structural adequacy*—its ability to reorganize known phenomena under a fundamental framework.

     - **For Train/Test Splits: Guarding Against Self-Deception**  
       The prohibition against "confirming with training data" targets **methodological fragility**:
       - **Overfitting Risk**: Models with high complexity can memorize noise in the training set, failing to generalize.
       - **Researcher Degrees of Freedom**: Unconscious tuning (e.g., trying 100 models and reporting the one that fits best) inflates apparent accuracy.  
       *Epistemic function:* This tests *predictive reliability*—a model's ability to generalize to *new instances* of a pattern.

     **Key Insight**: The practices don't conflict because they answer different questions:  
     - Mercury/GR: *"Does this theory provide a necessary, non-ad-hoc explanation for a deeply problematic observation?"*  
     - Train/Test: *"Will this model perform robustly on unseen data?"*  
     Calling both "confirmation" obscures their distinct goals.

  ### 2. **What Epistemology Underwrites This? A Hybrid View**
  The practice is compatible with several accounts but leans toward **explanatory coherentism** for theory appraisal and **frequentist/reliabilist** norms for model validation:
     - **For Old Evidence (Mercury)**:  
       - **Non-Bayesian Solution**: Bayesian "probability 1" problem is circumvented by shifting focus to *explanatory gain*. The anomaly had probability 1 under *Newtonian physics* but was *improbable* without an auxiliary hypothesis (e.g., Vulcan). GR made it probable *without auxiliaries*, raising its relative likelihood.  
       - **Coherentist View**: GR gained credence by increasing the coherence of the total web of belief—it resolved a contradiction (Mercury's orbit vs. Newtonian predictions) while integrating gravity with relativity.
     - **For New Predictions (Train/Test)**:  
       - **Frequentist/Error-Statistical View**: Novel predictions control error probabilities (e.g., Type I error). Testing on unseen data provides a severe test of a model's capacity to capture underlying regularities.  
       - **Pragmatic Reliabilism**: The train/test split ensures models are *reliable tools* for future predictions, not just summaries of past data.

  ### 3. **Consequences of Switching to Straightforward Probabilism**
  Adopting a rigid Bayesian framework (where evidence is only updating via Bayes' theorem) would disrupt scientific practice:
     - **Train/Test Splits Lose Justification**: If all data is "old" once known, partitioning it into training/test sets becomes epistemically arbitrary. Bayesian updates use all data simultaneously.  
       - *Result*: Overfitting detection would require alternative strategies (e.g., strong priors, Bayesian model comparison), but these are less intuitive and more computationally demanding for complex models.
     
     - **New Experiments Devalued**: Under strict probabilism, *any* data can update beliefs, reducing incentive for new experiments.  
       - *Counterargument*: New data may have higher *informativeness* (e.g., testing in a novel domain), but probabilism struggles to formally privilege novelty absent a decision-theoretic loss function.

     - **Mercury-Style Triumphs Vanish**: If old evidence cannot confirm, GR's explanation of Mercury becomes epistemically inert—a devastating loss. Bayesian attempts to rescue this (e.g., "forgetting" the evidence or relaxing its probability to <1) feel artificial and fail to capture why physicists value the result.

  ### 4. **A Better Resolution: Contextual Evidence Assessment**
  The implicit view in physics/statistics is **pluralist and pragmatic**:
     - **Old Data Can Confirm Theories** when:  
       - The theory explains it *necessarily* (not via free parameters).  
       - It resolves an anomaly that challenged predecessors.  
       - It demonstrates unifying power.  
       *Example*: GR's Mercury solution, Dirac's equation explaining electron spin.
     
     - **Old Data Cannot Validate Models** when:  
       - The model was *constructed* using that data (curve-fitting).  
       - Generalization to new instances is the goal.  
       *Example*: Training a neural network on MNIST digits and reporting accuracy on the same set.

  ### Implications for Scientific Practice
  - **Physicists** would need to justify why retrodictions (like Mercury) are evidentially significant beyond mere fit. This is already implicit in their emphasis on *explanatory necessity* and *theoretical unity*.
  - **Statisticians/ML Practitioners** should clarify that train/test splits are primarily about *generalization assessment*, not theory confirmation. For explanatory models (e.g., in causal inference), retrodictions on existing data *can* be evidentiary if they test a mechanism derived independently.
  - **Funding Agencies** would still prioritize new experiments: not because old data is "invalid," but because new data tests theories/models in *different boundary conditions*, probing robustness and expanding scope.

  **In essence**: The double practice presupposes that **evidence is not monolithic**. "Confirmation" in physics often means *explanatory triumph*, while in statistics it means *predictive reliability*. Replacing this with a one-size-fits-all probabilistic view would erase crucial distinctions, impoverishing both theory appraisal and model validation. The solution isn't to abandon either norm but to articulate *when and why* each applies—a task for which philosophy of science remains indispensable.
