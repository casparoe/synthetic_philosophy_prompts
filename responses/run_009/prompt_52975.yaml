  The twist involves granularity - instead of replacing neurons one-by-one with silicon duplicates, I'll replace blocks of a thousand functionally related neurons with a single recurrent neural network device. This device reproduces the block's overall input-output behavior but has no internal correspondence to individual neurons. The constraints are strict: one paragraph, no dualism, quantum effects or perfect scanning, and the technology must seem plausible to computational neuroscientists.

  I'll design this carefully. I'll describe a neural lace technology that integrates with the brain and replaces cortical columns with neuromorphic chips. These chips are trained to replicate the macro-scale function of neural populations but have completely different micro-architectures. This should satisfy the constraints while creating the granularity problem.

  For the argument application, I'll show how the gradual replacement seems to preserve consciousness at each step (due to functional correspondence at the block level), but ultimately leads to a system with no neuron-level correspondence. The unwelcome verdict emerges when we realize that if we accept fading qualia at the block level, we must also accept it at the neuron level - but the replacement destroys neuron-level functional organization entirely.

  Then I'll contrast the biological naturalist view (which would reject survival immediately) with the psychological-continuity view (which might accept it). The key feature here is the coarse-grain mapping - if we make it neuron-level, the problem disappears.

