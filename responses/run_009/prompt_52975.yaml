  Throughout, I need to be careful not to build fine-grain requirements into the scenario itself - the point is to expose the tacit grain assumption in the standard argument.
answer: |-
  ### Thought Experiment
  Imagine a brain integrated with a neural lace that gradually replaces cortical columns (functionally defined ~1000-neuron blocks) with neuromorphic chips. Each chip is a trained recurrent neural network that precisely replicates the *ensemble* input-output dynamics of its target column over behavioral timescales—responding identically to sensory inputs and producing identical motor outputs when stimulated—but its internal state transitions form a compressed, emergent representation bearing no isomorphic mapping to individual neuron states. No discrete substate within the chip corresponds to any specific neuron's spiking history or synaptic weights; the chip abstracts away all fine-grained neural activity while preserving macro-functional equivalence. Replacement proceeds column-by-column over months, with seamless behavioral continuity.

  ---

  ### 1. Running the Gradual-Replacement Argument & Unwelcome Verdict
  The standard argument proceeds:  
  (a) At step *n*, replacing one column with a functionally identical chip preserves consciousness (by fading/dancing-qualia: micro-differences are irrelevant if macro-function is identical).  
  (b) After all columns are replaced, the system behaves identically to the original brain.  
  (c) Therefore, consciousness (and survival) is preserved.  

  **Where it fails:** Step (a) assumes functional equivalence at the *grain of the replaced component* (columns) suffices. But the argument implicitly requires that functional organization is preserved *at every grain relevant to implementing consciousness*. Here, neuron-level functional states (e.g., spike-timing dependencies between specific neurons) are erased by design—the chip has no substates mapping to neurons. If consciousness supervenes on fine-grained dynamics (e.g., specific neural synchrony), replacing a column destroys that organization entirely, not just "fades" it. After full replacement, *no* neuron-level functional properties exist, only coarse column-level ones. Thus, if consciousness requires fine-grained functional structure, survival fails despite gradual replacement. The tacit assumption—that the grain of replacement matches the grain of consciousness—is exposed and violated.

  ---

  ### 2. Biological Naturalist vs. Psychological-Continuity Theorist
  - **Biological Naturalist:** Rejects survival immediately. Consciousness requires biological wetware; silicon chips (regardless of function) cannot instantiate it. Grain is irrelevant—non-biological implementation fails *ab initio*.  
  - **Psychological-Continuity Theorist:** Likely accepts survival. As long as the system preserves cognitive/behavioral capacities (memory, reasoning, personality) at the macro-level, identity persists. Fine-grained implementation is irrelevant.  

  **Comparison:** The psychological-continuity theorist avoids the granularity problem by fixating on macro-cognition. The functionalist (committed to functional organization *as such*) is worse off here—they must specify *which level* of functional organization matters, inviting the granularity trap. The psychological theorist ignores implementation grain entirely.

  ---

  ### 3. Key Feature and Its Removal
  **Key feature:** Functional mapping is one-to-one at the *coarse grain* (columns) but *lacks any mapping* at the fine grain (neurons).  
  **Removal (neuron-level mapping):** If each neuron is replaced by a silicon duplicate preserving its individual input-output profile, the unwelcome verdict vanishes. The functionalist claims survival is preserved, as fading qualia handle minor discrepancies. The biological naturalist still rejects it, but the functionalist/uploader avoids inconsistency.

  ---

  ### 4. Pro-Uploader Defense & Assessment
  **Defense:** "Functional organization is inherently level-relative. Cognition is defined by the causal profile at the *cognitive* level—the grain that sustains memory, perception, and decision-making. In this case, column-level organization preserves that profile. Demanding neuron-level correspondence is arbitrary biological fetishism; the brain itself likely implements cognition at multiple grains, with columns as functional units."  

  **Assessment:** This defense is coherent but overpermissive. If cognitive-level profiles alone suffice, a system that replaces the *entire brain* with a single monolithic AI trained to mimic its input-output behavior (e.g., a giant lookup table) would also preserve survival, as long as behavior is identical. Yet this "brain in a vat" lacks internal causality altogether—a conclusion most functionalists (including Chalmers) explicitly reject to avoid panpsychism or triviality. Thus, granting this defense forces acceptance of *hyper-coarse-grained* systems the pro-uploader likely wishes to exclude, revealing a tension between functionalism's commitments to causal structure and its level-relativity.

  ---
  **Core Tension Exposed:** The gradual-replacement argument tacitly assumes that functional equivalence at the *replacement grain* matches the grain of consciousness. This scenario forces acknowledgment of that assumption and shows how its relaxation risks collapsing functionalism into behaviorism.
