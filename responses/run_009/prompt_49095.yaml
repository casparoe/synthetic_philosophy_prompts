  First, I need to recall Libet's experiment details accurately. Participants flexed their wrist while EEG recorded brain activity. They noted the readiness potential (RP) onset about 500ms before movement, while conscious awareness of the urge (W-time) was around 200ms before. The friend's summary captures these basics correctly. 

