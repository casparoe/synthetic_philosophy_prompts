answer: |-
  Here is the translation of Lewis's argument into your legal vocabulary, followed by a residue report analyzing the fit and the conceptual gaps:

  ### Legal Translation of Lewis's Argument
  1.  **The Doctrine (Charging Instrument):** The claim is that humanity stands convicted of sin ("Original Sin" or cumulative actual sins). The sentence imposed is eternal punishment (damnation). Through "penal substitution," Christ, an unindicted and unconvicted third party, voluntarily submits to the execution of that sentence on humanity's behalf.

  2.  **Lewis's Challenge (Motion to Dismiss/Invalidate Sentence):** Lewis argues this purported act of "punishment" is legally void *ab initio*. Punishment (*sentence execution*) is an **in personam** remedy, intrinsically tied to the **culpability** and **conviction** of a specific offender.
      *   **Mens Rea & Conviction Requirement:** Just as a sentence imposed on someone never indicted, tried, or convicted is a legal nullity (a fundamental violation of due process), inflicting hard treatment *as punishment* requires the recipient to be the one found **guilty beyond a reasonable doubt** of the underlying offense. Christ lacks the requisite mens rea and conviction status for humanity's sins.
      *   **Non-Transferability of Core Punishment:** While certain *debts* (like **fines** or **restitution**) can sometimes be satisfied vicariously (a solvent relative pays), the core elements of criminal punishment – **incarceration, corporal punishment, execution** – are **non-delegable personal duties**. Your client cannot contractually obligate his brother to serve his prison sentence, nor can the court *lawfully* incarcerate the brother *as punishment* for your client's crime, even with the brother's consent. Attempting to do so isn't punishment; it's **wrongful imprisonment** or **assault**.
      *   **Consent is Legally Irrelevant to Punishment Validity:** The volunteer's consent does not transform the unlawful infliction of suffering into lawful punishment. Consent might be a defense to a *battery* charge for the volunteer *against the punisher* in some contexts, but it does not magically confer the status of "punishment" on the act or extinguish the original offender's liability. The state cannot "punish" a consenting innocent person *for someone else's crime*; it can only **commit a wrong against that person**.
      *   **Vicarious Liability (Respondeat Superior) is Inapposite:** This doctrine holds a principal liable for acts *of their agent* committed within the scope of employment. It does *not* allow imposing punishment on the principal *for the crimes of the agent* in the sense of substituting who suffers the hard treatment. The principal is punished *for their own culpability* (e.g., negligent supervision). Christ is not God's agent who committed humanity's sins.

  3.  **Lewis's Conclusion (Verdict):** Therefore, inflicting the suffering intended as humanity's punishment upon the innocent Christ is not an act of *punishment* at all. It is, legally speaking, the **infliction of severe bodily harm** (or worse) upon an innocent, consenting third party. Consent does not negate the fundamental *wrongfulness* of the state (or God, in this analogy) inflicting such harm on someone not convicted of the offense. This act constitutes **gross injustice** and **evil** perpetrated by the punisher, irrespective of the volunteer's agreement. Humanity's conviction and sentence remain outstanding.

  ### Residue Report
  **I. Moves Translating Cleanly:**
  *   **Punishment Requires Conviction & Culpability:** The core legal principle that punishment (*sentencing and execution*) is **void** if imposed on someone not indicted, tried, and convicted of the specific offense translates perfectly. "No punishment without conviction" is bedrock law.
  *   **Non-Transferability of Hard Treatment:** The legal rule that imprisonment, flogging, or execution *cannot be transferred* to a substitute, even a consenting one, directly mirrors Lewis's point. Your examples (client can't send brother to prison, sentence on unindicted person void) hit the nail on the head. This *is* Lewis's neighborhood.
  *   **Consent Doesn't Validate Punishment:** Legally, consent cannot make the incarceration of an innocent person *for someone else's crime* constitute "punishment." It remains an unlawful act by the state. This aligns with Lewis's "consent changes nothing" regarding the nature of the act *as punishment*.
  *   **Fines/Restitution as Transferable Debt:** The concession that monetary penalties *can* be paid by a third party without injustice also translates cleanly, reflecting Lewis's distinction.

  **II. Moves Translating with Distortion:**
  *   **"Punishment is Essentially Tied to Guilt":** While legally true (conviction is required), the *reasoning* differs subtly. Law's focus is **institutional integrity** and **procedural due process** (preventing state tyranny, ensuring reliable outcomes). Lewis's grounding is more **conceptual/moral**: the *inherent, logical link* between desert and punishment, irrespective of institutional safeguards. The *conclusion* (no substitution) is the same, but the *foundation* differs (institutional necessity vs. conceptual necessity). **Does it matter for Lewis?** Partially. His argument is fundamentally conceptual/moral. The legal rule *exemplifies* his point but doesn't *prove* its conceptual necessity; the rule could exist for purely institutional reasons (even if guilt *could* conceptually transfer, the state forbids it to prevent abuse/coercion). However, the *persistence* of this rule across systems *supports* Lewis's view that the link isn't merely arbitrary.
  *   **"Merely Doing Something Terrible":** Legally, it's clearly **wrongful imprisonment/assault**. Lewis's phrase "doing something terrible" captures the moral horror but lacks the specific legal characterization. The translation *sharpens* the nature of the wrong in legal terms.

  **III. Moves With No Direct Legal Expression (The Residue):**
  *   **God's Standing as the Wronged Party:** Law has no equivalent. Crimes are offenses against the *state* (representing societal order), prosecuted by the state. Even victim's rights don't make the victim the *sentencing authority*. God being simultaneously Judge, Prosecutor, *and* Primary Victim (offended party) is a theological concept without legal parallel. This makes "satisfaction" arguments harder to map.
  *   **Infinite Suffering vs. Finite Desert:** Legal **proportionality review** operates within human scales and temporal limits (e.g., life imprisonment for murder). The concept of *infinite* punishment for *finite* beings committing *finite* sins (even cumulatively) is utterly alien and incoherent in legal terms. Proportionality review would immediately void such a sentence as grossly disproportionate and cruel/unusual.
  *   **Consent as Normatively Inert (Deep Moral Claim):** Law says consent doesn't make the *state's act* lawful punishment. Lewis makes the stronger **moral claim** that consent doesn't negate the *inherent wrongness* of inflicting the harm *for this purpose*, even if it negates a battery claim *by the volunteer against the punisher*. This is a philosophical claim about the nature of justice and desert that transcends the legal question of the state's authority to act. Law might ask *"Can the state do this?"* Lewis asks *"Is this act just, even if consented to?"* The legal answer implies "no, it's unlawful," supporting Lewis. But Lewis pushes to the deeper moral "no, it's inherently unjust."
  *   **The Nature of "Satisfaction":** The theological claim that Christ's suffering *extinguishes* the debt/liability of humanity finds only a weak analogy in civil **restitution** or paid **fines**. It has no analogy for non-transferable punishments like imprisonment or execution. The law simply doesn't recognize "satisfaction" of a prison sentence by harming a third party.

  **IV. Analysis of Your Core Question: Does the Law Vindicate Lewis?**
  *   **Yes, Robustly, on the Central Claim:** The legal concepts **"in personam liability," "void sentence for the unconvicted,"** and **"non-delegability of core punishment"** carry the conclusion directly. They embody the principle that the state *cannot lawfully inflict the hard treatment characteristic of punishment* on anyone other than the convicted offender. Attempting to do so is not punishment; it's a distinct wrong (**false imprisonment, assault**) committed by the state. This *is* Lewis's claim: harming the innocent substitute isn't punishment, it's an evil act (injustice) by the punisher. The law doesn't just *assume* this; it *defines* punishment operationally as requiring conviction and personal application.
  *   **The Institutional vs. Conceptual Foundation:** The law's reasons *include* strong conceptual/moral intuitions about justice and desert (punishing the guilty), but are also deeply intertwined with **institutional necessity**: preventing state abuse, maintaining the integrity of the judicial process, ensuring accountability, deterrence focused on the offender. Lewis's argument is *purely* conceptual/moral, appealing to the *essence* of punishment. **Does this difference matter?** It slightly weakens the law's *proof* of Lewis's *conceptual* claim, as one could (theoretically) argue the legal rule exists *only* for institutional reasons (even if guilt *could* conceptually transfer, we forbid it to prevent chaos). However:
      *   The sheer *universality* and *foundational* nature of the "no punishment without conviction" principle across legal systems strongly suggests it reflects a deep conceptual/moral truth, not just a practical rule.
      *   Lewis would likely argue that the institutional reasons themselves *presuppose* the conceptual link – the chaos and injustice the rule prevents arises *precisely because* punishment conceptually requires desert/guilt. Punishing the innocent *is* the paradigmatic injustice the rule guards against.
  *   **The Residue in Both Directions:**
      *   **What the Law Can't Say:** The law cannot directly address the *theological* framework (God's standing, infinite punishment). It highlights the absurdity of infinite punishment via proportionality but cannot engage the metaphysics. The deeper moral inertness of consent (beyond negating battery claims) is a philosophical claim the law doesn't need to make explicitly; its operational rules imply it. The "satisfaction" concept finds no real traction for hard treatment.
      *   **Where Lewis Might Be Less Clear:** The legal translation exposes that Lewis's argument gains immense strength from its grounding in the *operational definition* of punishment used by human justice systems. The theological doctrine is trying to invoke the *legal* concept of punishment/justice while violating its most fundamental operational principles. The residue (God's standing, infinity) doesn't obscure this; it highlights the doctrine's internal tension when forced into a justice framework. Lewis's presentation is clear; the theological doctrine is the one straining against coherent concepts of justice.

  **Conclusion:** Lewis's central argument translates powerfully and cleanly into core criminal law principles. The law's refusal to permit substituted corporal punishment, incarceration, or execution for the convicted offender, rendering any such attempt a void act and a distinct wrong (assault/false imprisonment) by the state, *directly* and *robustly* vindicates his claim that harming a consenting innocent cannot constitute "punishment" and is instead an act of injustice perpetrated by the punisher. The concepts **"in personam liability," "conviction as prerequisite for punishment,"** and **"non-delegability of core punishments"** are the legal engines driving this conclusion. While the law's *reasons* include institutional necessities, these necessities are deeply intertwined with and arguably *derive from* the conceptual/moral link between punishment and desert that Lewis articulates. The untranslatable residue primarily concerns uniquely theological concepts (God's standing, infinity) which, rather than obscuring Lewis's point, further expose the tension within the doctrine of penal substitution when subjected to scrutiny under coherent principles of justice. Your legal vocabulary doesn't just reach Lewis's neighborhood; it occupies the same conceptual territory on this core issue.
