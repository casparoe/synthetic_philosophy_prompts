  The attorney might want to know if legal concepts inherently support Lewis or if institutional reasons undermine the conceptual argument. The non-transferability in law is partly practical, while Lewis is philosophical. This difference matters because Lewis's conclusion that substituting punishment is evil hinges on moral concepts beyond legal pragmatism.

