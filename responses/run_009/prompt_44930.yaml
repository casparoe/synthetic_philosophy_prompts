  Where might the translation distort? Legal systems allow fines paid by others, which Lewis concedes as transferable debts. But corporal punishment can't be transferred. The reasons here are practical: fines are monetary, while bodily punishment isn't. Lewis's argument is conceptual, not practical. Also, consent isn't a factor in law for transferring punishment, but Lewis argues consent is irrelevant normatively.

