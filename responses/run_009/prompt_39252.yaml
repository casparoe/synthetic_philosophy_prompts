prompt: |-
  My husband and I just got our carrier screening results back and it turns out we're both carriers for cystic fibrosis, so I've gone down a philosophy rabbit hole and I need someone to sort out my gut reactions for me. Apparently this is called the nonidentity problem. Here are the cases and my verdicts:

  1. The famous 14-year-old mother (Parfit's case): she has the baby now instead of waiting, the kid has a much worse upbringing, but a life worth living, and a completely different kid would have existed if she'd waited. My verdict: she does something wrong, but I can't say she wrongs the child. Wrong with no one wronged.
  2. A society that depletes resources so that future people — literally different people than would otherwise exist, since the policy changes who meets whom — live worse but still worthwhile lives. My verdict: wrong, and I really want to say it wrongs those future people. Even though the same logic as case 1 applies. These two verdicts together make me nervous.
  3. A couple who delay conception a couple of years for money reasons and thereby end up with a different child than they would have had: fine, harms no one.
  4. A woman who drinks heavily through early pregnancy before she knows she's pregnant, and the child is born with lasting effects. My gut screams that she harmed that particular child, but I can't point to anyone made worse off than they'd otherwise be — the alternative was no such child at all.
  5. Two deaf parents who knowingly conceive a child who will be deaf, because they want a child like them and they're confident a deaf life is a good life. I flip-flop constantly on this one. Swap deafness out for constant pain and I'd say wrong in the case-1 way (wrong, no one wronged), but at some point "wrong, no one wronged" starts to feel like it's not doing any work.

  So my question: is there one principle that gets all or nearly all of these, and if not, which verdicts have to go? State it precisely enough that it can answer our actual decision, which is this: conceive naturally and take the 25% chance, or do IVF with screening — knowing that screening means a different child than natural conception would have given us, so it's not like we'd be sparing our kid the condition. Does the principle say anything about which of these is better, or does it refuse to rank them? And be honest about which of my verdicts it has to overturn to do it. Under 600 words, I know thats tight, but I'd rather have your one best principle plus its verdict on our decision than a tour of the literature.
reasoning: |-
  Okay, I need to tackle this user's query about the nonidentity problem. They've presented several cases with their gut reactions and are looking for a consistent principle to apply to their real-life decision about conceiving with a cystic fibrosis carrier status. 

  First, let's unpack their scenarios. The 14-year-old mother case shows the classic nonidentity dilemma - the child isn't wronged because they wouldn't exist otherwise, yet the action feels wrong. Their conflict between cases 1 and 2 is particularly telling - why does resource depletion feel like it wrongs future people when the same logic applies? That tension is the heart of their philosophical unease. 

  The deaf parents case reveals another layer - when does a condition cross from cultural identity to genuine harm? Their intuition shifts based on severity, which suggests we need a harm threshold. The prenatal drinking case highlights how hard it is to shake the "harmed child" intuition despite the logic. 

  For their actual decision, I'm considering a harm principle with three components: severity, avoidability, and substitution. Cystic fibrosis clearly meets the severity threshold given its impact on lifespan and quality of life. IVF makes the harm avoidable through embryo selection, while natural conception risks creating a child who will experience severe, preventable suffering. Crucially, the substitute child isn't harmed by not existing. 

  This principle would require adjusting some of their verdicts. Case 2 (resource depletion) might not qualify as severe enough harm per se, making it more like case 1. Case 4 (prenatal drinking) would be wrong because the harm was both severe and avoidable without substitution. The deaf parents case becomes context-dependent based on whether deafness constitutes severe harm in that cultural framework. 

  The beauty of this approach is how it handles their personal dilemma: by choosing IVF, they prevent severe harm to a potential child without wronging anyone. That feels both philosophically consistent and emotionally satisfying - which matters deeply for someone making this choice in real life. 

  I'll make sure to be transparent about which verdicts need revision while acknowledging why their intuitions are understandable. The word limit means focusing on crystalline clarity - one robust principle applied across cases, then directly to their decision. No jargon, just actionable insight.
answer: |-
  Here's the clearest principle I can derive that respects most of your intuitions while forcing one revision:

  **The Severity-Avoidable Harm Principle:** An act is wrong if it *causally results in a person* (not merely *a person being caused*) experiencing a severe, non-trivial harm that was reasonably avoidable by the agent *without substituting that specific person for another*.

  Applying it to your cases:

  1.  **14-year-old mother:** **Not Wrong** by this principle. The child exists *because* of the act. The "harm" (worse upbringing) isn't *caused* to the child; it's part of the condition of their existence. Avoidance requires substitution. *(Overturns your verdict: It's not wrong.)*
  2.  **Resource Depletion:** **Not Wrong** *to those specific future people.* The harm is part of their condition of existence. Avoidance requires substitution (different people). *(Overturns your verdict: It doesn't wrong those people.)*
  3.  **Delay Conception:** **Fine.** No harm caused to any specific person. Avoidance requires substitution.
  4.  **Heavy Drinking:** **Wrong.** She causes severe harm *to that specific child* (FASD) that was avoidable (not drinking) *without preventing that child from existing* (she could have not drunk and still had *that child*). The harm is inflicted *on* the child during its development.
  5.  **Deaf Parents:** **Depends on Severity.** If deafness is a severe harm *in that context* (e.g., isolating, limiting opportunities despite parental support), it *might* be wrong. If it's a neutral/cultural difference with full opportunity, it's not a "harm." Constant pain clearly constitutes severe harm, making it wrong. Avoidance (using hearing embryo) requires substitution.

  **Your Decision (CF):**

  *   **Conceiving Naturally (25% CF Child):** By this principle, **this is wrong if the child has CF.** You causally result in *that specific child* experiencing severe harm (CF) that was reasonably avoidable by you (via IVF/PGD) *without substituting that child* (you could have conceived a different healthy embryo). The harm occurs *to them*.
  *   **IVF with Screening:** This avoids causing severe harm to a child you create. You create a *different* healthy child. The principle finds **this permissible.** The healthy child isn't harmed by being created instead of the potential CF child.

  **Key Revision:** The principle forces overturning your verdicts on **Case 1 (14yo mother - not wrong)** and **Case 2 (Resource depletion - doesn't wrong those people)**. It aligns with your verdicts on 3, 4, and 5 (interpreting deafness severity matters). For your CF decision, it clearly favors IVF with screening to avoid causing severe, avoidable harm to a child.
