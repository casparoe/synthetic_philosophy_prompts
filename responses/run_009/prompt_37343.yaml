prompt: |-
  I've been trying to work out what I actually believe about how much the unknowable knock-on effects of my actions should matter morally, so heres me listing my gut verdicts on a bunch of cases and hoping they add up to something. Donating some money each year to a well-studied effective charity: feels obligatory, and the fact that I can't trace the full ripple effects (population effects, second-order incentives, whatever) doesn't feel like it lets me off the hook at all. Becoming a doctor vs. going into finance and donating the surplus: both fine, neither required, even though the finance path plausibly does more good if the donations are well-chosen. Voting in a national election: my single vote is almost certain to make no difference, but I think I should vote anyway, and I'd quietly judge someone who couldn't be bothered. Eating meat: wrong, because of the agregate of many such choices, even though my individual consumption makes no difference to any particular animal. Having a child: obviously permissible, zero hesitation, even though it's the single largest unpredictable causal intervention most people ever make — a whole new person whose effects ramify for generations. Working at an AI lab when you genuinly can't tell whether you'd make things safer or accelerate something bad: permissible, but I'd want the person to have thought hard about it first, and I'm honestly not sure what the thinking hard is supposed to accomplish given the uncertainty is irresolvable. Donating to a political movement in another country because you calculated it's your highest-leverage option: feels off, kind of presumptuous, though I can't articulate why given that I endorse the ordinary charity donation.

  So — is there a principle that captures all that? The obvious candidate, something like 'act on the expected value you can reasonably estimate, and cluelessness about distant effects doesn't undermine the near effects you can see', gets the donation cases right, but I can't see how it handles the child case without implausible gymnastics. And the meat/voting pair feels unstable in its own way: both are negligible-individual-effect-big-aggregate cases, yet I feel the force of one much more than the other. Give me your best candidate principle (or two competing ones if that's more honest), say precisely which of my verdicts it can't accommodate and why I should give those up rather than complicate the principle, and tell me what it commits me to on a case I haven't listed — say, whether to take a very well-paying job at a tobacco company with the plan of donating everything above subsistance. Lead with the bottom line in your first sentence — which principle wins and which of my verdicts dies — and then give the reasoning, no preamble and no restating my cases back at me.
reasoning: |-
  Okay, let's tackle this user's moral philosophy puzzle. They've presented a series of intuitive judgments about various ethical dilemmas and are searching for an underlying principle that can coherently explain them all. The key tension lies between their strong utilitarian leanings in cases like charitable donations and their non-utilitarian intuitions about having children or working in AI labs. 

  First, I notice the user operates with a clear distinction between calculable and incalculable consequences. Their obligation toward effective charities shows strong expected value reasoning, yet they completely exempt procreation from similar scrutiny. This suggests their moral framework has a "bounded rationality" component where obligations only apply when consequences are reasonably estimable. 

  The meat/voting asymmetry is particularly revealing. Both involve negligible individual impact but large aggregate effects, yet they condemn meat-eating while endorsing voting. This might indicate an unspoken distinction between participation in systemic harm versus systemic benefit - voting as a positive duty versus meat-eating as complicity in harm. 

  For the tobacco job case, their framework would likely condemn it despite potential donated income, because the direct harm is knowable and severe. This aligns with their rejection of meat-eating based on complicity in systemic harm, even when individual impact is negligible. 

  The real challenge is the childbearing case. Their intuition completely overrides any expected value calculation, which exposes a limit to consequentialism in their thinking. I suspect they're operating with a tacit "protected spheres" principle where certain human activities (like procreation) are exempt from utilitarian calculus by default. 

  Ultimately, no single principle perfectly reconciles all their intuitions. A dual-track approach seems most honest: default to expected value when reasonably calculable, but recognize exempt domains where calculability fails or fundamental human interests prevail. This means sacrificing perfect consistency - their permissive view on childbearing remains philosophically anomalous within their otherwise consequentialist framework.
answer: |-
  **Bottom line: Adopt a dual-track principle where *expected value governs calculable impacts*, but *agent-relative permissions and prohibitions govern incalculable domains*; this preserves most verdicts but forces you to concede that *having a child is morally riskier than you acknowledge*, or that *donating to foreign politics is less "presumptuous" than you feel*.**

  ### The Principle Explained:
  1. **Track 1: Expected Value for Calculable Impacts**  
     When consequences are *reasonably estimable* (e.g., charity effectiveness, meat industry demand curves, voting's aggregate effects), act based on expected value. This justifies:
     - **Donating to effective charities** (obligatory due to high-impact certainty).
     - **Eating meat is wrong** (aggregate harm is calculable; individual complicity matters).
     - **Voting is obligatory** (low individual chance, but high-stakes aggregate impact is estimable).
     - *Verdicts preserved*: Charity, meat, voting.

  2. **Track 2: Agent-Relative Constraints in Incalculable Domains**  
     When consequences are *genuinely incalculable* (e.g., long-term ripple effects of creating a person, unknowable AI outcomes), default to *personal permissions* (you may act) or *prohibitions* (you may not act) based on:
     - **Non-maleficence**: Don't directly/intentionally cause *foreseeable* harm.
     - **Agent-Integrity**: Protect projects central to human life (e.g., family, career).
     - **Epistemic Humility**: Avoid interventions with massive, irreversible, unpredictable stakes unless necessary.  
     This justifies:
     - **Becoming a doctor vs. finance**: Both permissible (career choice is core to integrity; calculable surplus donation tilts toward finance but isn't required).
     - **Working in AI labs**: Permissible if no *foreseeable* direct harm, but "thinking hard" demonstrates integrity despite uncertainty.
     - **Having a child**: Permissible under "core life projects" – but *only if* you accept that its incalculable risk is exempt from Track 1 scrutiny.
     - *Verdicts preserved*: Career choice, AI work, childbearing (with caveat).

  ### Tensions and Sacrifices:
  - **Your childbearing verdict must weaken**: If Track 1 (expected value) applied, creating a person with massive, unpredictable, multigenerational impacts would demand justification you don't require. Track 2 *saves* it by calling childbearing a "protected sphere" – but this clashes with your strict charity obligation. *Sacrifice consistency* or *accept childbearing carries moral risk Track 2 excuses*.
  - **Foreign politics donation**: Your unease conflicts with Track 1. If its impact is *calculable* (you ran the numbers), it should feel identical to charity. Track 2 might reframe it as "arrogance" if you lack local knowledge (a constraint), but your intuition isn't well-supported. *Sacrifice the "presumptuous" feeling* or *reject Track 1 for cross-cultural interventions*.
  - **Meat vs. Voting asymmetry**: Track 1 handles both. Your stronger guilt over meat may stem from *direct complicity in suffering* (a Track 2 non-maleficence intuition) versus voting as *failed beneficence*. The principle can accommodate this if you view voting's duty as weaker (no *direct* harm from abstention).

  ### The Tobacco Job Case:
  - **Track 1**: Expected value calculation might *favor* the job: high salary → large donations → net lives saved. But...
  - **Track 2**: Directly enabling a harmful industry violates non-maleficence. Your labor actively perpetuates foreseeable, immediate harm (addiction, cancer), making it *prohibited* regardless of offsetting donations.  
  **→ You should NOT take the job.** Your meat-eating verdict (complicity in harm) implies this constraint, overriding calculable benefits.

  ### Why This Works:
  - **Charity/meat/voting** bind you to calculable duties.  
  - **Childbearing/AI work** are excused from calculation by their incalculability + human significance.  
  - **Career choices** are protected personal domains.  
  - **Foreign donations** fall to Track 1, demanding you drop the "presumptuous" intuition.  

  **The tradeoff**: You keep childbearing permissible only by treating it as *ethically exceptional* – a deeply human act exempt from consequentialist accounting. If that feels right, this principle holds. If not, you must either demand justification for procreation or weaken your charity obligation.
