prompt: |-
  I teach a 300-level epistemology seminar on testimony and expertise, fourteen students, one 75-minute session, and I have a specific target: I want them to feel the difference between answers being available and understanding being in place -- and, more pointedly, what it does to you when the availability of the answer trains you out of the generation of it. The topic has stopped being academic for me: over the past year I have quietly outsourced my own lecture derivations, problem-set answer keys, and even my reading questions to an AI assistant, and last month I discovered I could no longer reconstruct, unaided, an argument I had "produced" and taught twice. I don't want to lecture them about this; I want to run it on them.

  Design a two-phase game. In phase one, students work in pairs on a set of moderately hard but learnable tasks -- I'm thinking short formal derivations or map-coloring-style constraint puzzles, where each step is small but the strategy must be internally generated. Each pair has access to a help mechanism I'll call the Oracle: a stack of sealed slips, one per puzzle step, that they may open at will. Here is the crucial design constraint: the slips must be written so that using them feels like learning rather than cheating. Each slip should explain its step genuinely and well, so that students who use them can pass an immediate comprehension check on what the slip said. Whatever the payoff scheme is (points toward a prize, some token currency), it should reward completed puzzles, and it should not directly penalize slip use -- I want the dependence to emerge from the incentive structure, not from a rule I imposed.

  Phase two comes without warning: the same pairs, the Oracles removed, and a set of isomorphic-but-shifted problems that require transferring the strategy, not replaying the steps. Some pairs will be fine; the ones I'm after are the ones who were fastest in phase one entirely on slip power.

  For the debrief, map specific moments in the game onto the conceptual distinctions: access versus ability, competence that survives only while the artifact is plugged in, the way each slip was individually a genuine learning event while the whole pattern of use was not, and the self-assessment problem -- the students who used the slips most will report having learned the most, and I want them to see their phase-two scores alongside those self-reports. Tell me what materials I need, a minute-by-minute timeline, how to write the slips so they hit the individually-helpful/globally corrosive balance, how to handle the pairs who ignore the Oracle entirely and thereby become a control group I didn't plan for, and what will predictably go wrong the first time. Finally, be frank about what the game cannot reproduce: the Oracle is honest, instantaneous, and always available, and none of those three things is true of my relationship with the tool I actually use, so tell me which of those gaps matters most and what I must supply in the debrief myself.
reasoning: |-
  Okay, let me tackle this professor's request. They want to design a classroom game to make students feel the difference between having answers available versus genuine understanding. The professor has personally experienced outsourcing intellectual work to AI and losing the ability to reconstruct arguments. That's a powerful motivator behind this exercise.

  First, I need to understand the core challenge: creating an activity where dependence on "help" feels helpful in the moment but undermines transferable skills. The two-phase structure makes sense - initial problem-solving with aids, then sudden removal of those aids for similar but modified problems.

  For phase one, I'm considering using constraint puzzles like map coloring or logic grids. These work well because:
  - They have clear step-by-step solutions
  - Each step is small enough to explain concisely
  - Strategies can be transferred to new problems
  The key is designing the Oracle slips to be genuinely educational while still creating dependence. Each slip should contain:
  1. The specific action to take
  2. The reasoning behind it
  3. Why it's the logical next step

  The incentive structure needs careful thought. Rewarding completion without penalizing slip use will naturally encourage over-reliance. Teams that use slips will finish faster and feel more competent, setting them up for failure in phase two.

  Phase two should use isomorphic problems - same type of puzzle but with modified constraints. For example:
  - Map coloring with new adjacency rules
  - Logic grids with altered categories
  This tests whether students internalized the strategy or just memorized steps.

  I'm concerned about the unplanned control group - pairs who ignore the Oracle. This could be valuable if handled right. In debrief, we can contrast their slower phase one performance with stronger phase two results.

  The professor's point about gaps between the Oracle and real AI use is crucial. The game's Oracle is perfectly reliable, instant, and always available - unlike actual LLMs which hallucinate and require careful prompting. This difference must be explicitly addressed in debriefing.

  Potential pitfalls include:
  - Students might suspect a trap and underuse slips
  - Phase two problems could be too hard even for control group
  - Debrief might feel like a "gotcha" to slip-dependent teams

  To mitigate these:
  - Make slips genuinely helpful so using them feels natural
  - Test phase two problems to ensure solvability
  - Frame debrief as collective discovery, not shaming

  The emotional impact matters. Students who crash in phase two need to understand why without feeling attacked. The professor's personal story could help normalize the experience during debrief.

  For timing:
  - 5 min setup/explanation
  - 25 min phase one (3-4 puzzles)
  - 5 min transition (swap materials)
  - 25 min phase two (2-3 puzzles)
  - 15 min debrief

  Materials needed:
  - Phase one puzzle sets with Oracle slips
  - Phase two puzzle sets without aids
  - Scorecards showing slip use vs performance
  - Whiteboard for debrief mapping

  The debrief should connect game experiences to broader themes:
  - How "learning" from slips differs from deep understanding
  - Why we might prefer quick answers over struggle
  - Parallels to real-world reliance on tech/AI
  - The professor's own outsourcing story as cautionary tale

  This approach should create that visceral "aha" moment about externalized cognition while maintaining a supportive learning environment.
answer: |-
  Here's a comprehensive design for your experiential exercise, calibrated to trigger the precise epistemic unease you're targeting. The goal is to make students *feel* the gap between answer-access and internalized competence, then dissect it.

  **Core Mechanics & Materials**  
  - **Puzzles**: Use **KenKen puzzles** (math-based logic grids). They're ideal because:  
    - Each step involves small deductive moves (e.g., "Cell A must be 3 because 5× in a 6-grid requires factors").  
    - Strategies are transferable (candidate elimination, constraint propagation).  
    - Easily modifiable for isomorphism.  
  - **Phase One Materials per Pair**:  
    - 3 KenKen puzzles (4×4 grid, increasing difficulty).  
    - **Oracle Slips**: For each puzzle, 5–7 sealed envelopes (not slips—allows richer explanation), each labeled with a step number.  
    - **Puzzle Sheets**: With grids and rules.  
    - **"Credit" Tokens**: 1 token per completed puzzle. Tokens = tangible reward (e.g., candy, bonus point voucher).  
  - **Phase Two Materials per Pair**:  
    - 2 "Shifted" KenKen puzzles: Same rules but with *modified constraints* (e.g., change "product" to "sum" in cages, shift grid size to 5×5).  
    - No Oracle.  
  - **Tracking Sheet**: For each pair to log: puzzles completed, Oracle envelopes opened, self-assessment scores (post-phase one).  
  - **Debrief Slides**: Key concepts (testimonial knowledge, ability vs. mere access, cognitive offloading) + phase results.  

  **Oracle Slip Design: The Corrosive-Help Balance**  
  Each envelope contains:  
  1. **Action**: "Write 3 in top-left cell."  
  2. **Justification**: "Column 1 already has 1 and 4. Row 1 has 2. The cage ‘5×’ must contain 5 and 1, but 1 is blocked, so 3 is the only option."  
  3. **Strategy Note**: "This uses *candidate elimination*: list possible numbers per cell, then remove options violating row/column/cage rules."  
  **Why this works**:  
  - Feels like learning: Explains *why*, names the strategy, focuses on reasoning.  
  - Creates dependence: Solves the immediate friction, allowing rapid progress without strategy-generation labor.  
  - **Critical nuance**: Slips are *atomized*—they explain *this step* but don’t synthesize how to *initiate* steps independently.  

  **Timeline (75 Minutes Total)**  
  - **0:00–0:05** (5 min): Framing & Rules  
    - "Today we’re studying problem-solving under constraints. Work in pairs. Solve puzzles to earn tokens (1/puzzle). Use Oracle envelopes if stuck—they explain steps. Goal: Maximize tokens."  
    - *Emphasize*: "Envelopes are there to help you learn efficiently. No penalties for using them."  
  - **0:05–0:30** (25 min): **Phase One**  
    - Pairs work on 3 puzzles. Circulate to observe.  
    - At 0:25, pause: "Complete your current puzzle. Then, on your tracking sheet, rate how well you’ve *learned the underlying strategies* (1=‘Not at all’, 5=‘I could solve new ones alone’)."  
  - **0:30–0:35** (5 min): **Transition**  
    - Collect all Oracle envelopes. Distribute Phase Two materials.  
    - "New rule: No Oracles. Solve these modified puzzles. Tokens still apply."  
  - **0:35–0:55** (20 min): **Phase Two**  
    - Pairs work on shifted puzzles. Note frustration/confusion in slip-dependent pairs.  
  - **0:55–1:15** (20 min): **Debrief**  
    - Show anonymous data: Phase One tokens vs. Phase Two tokens vs. self-assessment scores.  
    - Ask: "Who felt confident after Phase One but hit a wall in Phase Two? Why?"  
    - Map game moments to concepts:  
      - *Access ≠ Ability*: "You could *execute* steps with slips but not *generate* them in Phase Two."  
      - *Artifact-Dependent Competence*: "Like my AI-derivation loss—knowledge existed only when ‘plugged in’."  
      - *Atomized Learning Illusion*: "Each slip taught a micro-skill, but you never practiced *orchestrating* them."  
      - *Self-Assessment Gap*: Contrast high self-ratings from slip-users with their Phase Two crash.  
    - **Your story**: Reveal your outsourcing experience *after* they’ve felt the effect. "This happened to me. I could ‘teach’ the argument only while the AI was my cognitive crutch."  

  **Handling the Unplanned Control Group (Oracle-Ignorers)**  
  - **Leverage them**: In debrief, contrast their outcomes:  
    - Likely slower in Phase One, fewer tokens.  
    - Often stronger in Phase Two (if they struggled through strategy-generation).  
    - Self-assessments usually more accurate.  
  - **Reframe**: "Some pairs avoided the Oracle. Their path mirrors pre-AI scholarship: slower, more friction, but competence survives tool-loss."  

  **Predictable Failure Modes & Fixes**  
  1. **Problem**: Students suspect a trap → underuse slips.  
     **Fix**: In framing, normalize slip-use: "Smart problem-solvers use resources!". Share *your* slip-use if demoing.  
  2. **Problem**: Phase Two too hard → universal failure.  
     **Fix**: Pilot test puzzles. Ensure shifted versions *are* solvable using Phase One strategies (e.g., candidate elimination still applies).  
  3. **Problem**: Debrief feels like a "gotcha".  
     **Fix**: Normalize the experience: "This isn’t about blame—it’s about how tools reshape cognition. I fell for it too."  

  **What the Game Cannot Reproduce (Gaps & Debrief Solutions)**  
  1. **Oracle is Honest** → AI hallucinates.  
     - **Debrief**: "Real tools *lie* or confabulate. My outsourcing trained me to trust outputs I couldn’t verify—a deeper corrosion."  
  2. **Oracle is Instant** → AI feels frictionless.  
     - **Debrief**: "When answers come *too* fast, you skip metacognition. My reading questions took seconds to generate—I stopped interrogating if they were *good* questions."  
  3. **Oracle is Always Available** → Real access isn’t guaranteed.  
     - **Debrief**: "In life, tools fail or contexts change (e.g., no AI in an exam). Phase Two simulated that collapse."  
  - **Most Critical Gap**: **Honesty**.  
    - Why: Slips provide *curated* truth, but AI’s hallucinations create false confidence *without a path to verification*. You outsourced not just execution but *epistemic judgment*.  
    - **Debrief Supplement**: "The slips were didactic; AI is stochastic. My ‘produced’ argument contained errors I only caught *after* internalizing it poorly. Dependence on dishonest tools is epistemic Russian roulette."  

  **Why This Works**  
  - The **KenKen shift** forces strategy-transfer, exposing slip-dependence.  
  - **Self-assessment + Phase Two crash** creates cognitive dissonance.  
  - **Your confession** post-exercise models vulnerability and frames the stakes.  
  - **Tokens** incentivize slip-use *without coercion*, making dependence emergent.  

  This design transforms your anxiety into their embodied insight. The game isn’t subtle—it’s a controlled shock to their epistemic habits. When the Phase Two paralysis hits, they’ll *feel* the void where their competence should be. That’s the moment your conceptual knife twists.
