prompt: |-
  I'm an analyst at a national infrastructure ministry. Before we commit to major projects — a rail line, a hospital IT overhaul, a flood barrier — I have to estimate what they will cost and how long they will take, and our bottom-up internal estimates are consistently too optimistic. Leadership has told me to use "outside views": compare each project to a class of similar completed projects and base the estimate on what happened to them. The trouble is that the answer changes depending on which class you pick — rail projects in our country, rail projects anywhere, megaprojects generally, or just the handful that resemble this one in the particulars — and each choice is defensible, so two analysts can run the same method and get different numbers. Please turn the reference class problem into a decision procedure I can hand to a junior analyst and expect them to run in a day: rules for constructing candidate classes, for deciding when a class is too small or too gerrymandered to trust (a class defined so narrowly that it excludes the failures, for instance), for weighting or combining classes that give conflicting answers — including whether to just take the broadest class and why or why not — and an explicit marker for the point at which the procedure runs out and judgment has to take over. Spell out what to do when only two or three comparable projects exist, since that case comes up constantly here. Then run the procedure on two cases: a new light-rail line in a mid-sized city, for which a large international class of comparable projects exists but mostly came in far worse than our internal estimate; and a one-of-a-kind automated port terminal, where only a handful of similar attempts exist worldwide and most of them failed. In the first case the procedure will give leadership a number they will not like — show that honestly. Flag which steps are genuinely mechanical and which are judgment calls dressed up as procedure, and say plainly what the procedure cannot do. Keep the whole thing under 800 words.
reasoning: |-
  Okay, the user is an analyst at a national infrastructure ministry dealing with cost and time estimation for major projects. Their bottom-up internal estimates are consistently too optimistic, and leadership has instructed them to use "outside views" by comparing projects to similar completed ones. However, they face the reference class problem: different classes of comparable projects yield different estimates, leading to inconsistent results even when the method is applied consistently. 

  The user needs a standardized decision procedure they can hand to a junior analyst. This procedure must include rules for:
  - Constructing candidate reference classes
  - Deciding when a class is too small or gerrymandered
  - Weighting or combining conflicting classes
  - Handling cases with very few comparables (2-3 projects)
  - Explicitly marking where judgment takes over

  They also want two case applications (light-rail line and automated port terminal) and clear flags about mechanical steps vs. judgment calls. The whole response must stay under 800 words.

  First, I need to address the core tension in reference class forecasting: breadth vs. specificity. Broader classes (e.g., "all rail projects globally") offer statistical robustness but may overlook unique project factors, while narrower classes (e.g., "light-rail in mid-sized cities") risk being too small or cherry-picked. The procedure should systematize this balancing act.

  For class construction, I'll suggest starting with a broad industry standard class (e.g., "transport infrastructure"), then generating subclasses based on project attributes (size, location, technology etc.). This creates a hierarchy of options. 

  For viability thresholds:
  - Minimum class size: 10+ projects for statistical trustworthiness, but allow smaller classes if they pass a "gerrymandering test" (e.g., no arbitrary exclusions of failures)
  - Gerrymandering detection: If excluding any project >10% different from the class average changes the estimate by >15%, the class is invalid. 

  For combining estimates:
  - Weight classes by the inverse of their standard deviation (more precise classes get higher weight)
  - If classes conflict sharply (>30% difference), default to the broader class unless the narrow class passes both size and gerrymandering checks.

  The judgment boundary is critical: when all classes have <10 projects, or when technical novelty dominates (e.g., the port terminal case), the procedure must explicitly hand off to expert judgment. 

  Case 1 (light-rail): 
  - Broad class: "Global light-rail projects" (50+ projects, average cost overrun 40%)
  - Narrow class: "Mid-sized city light-rail" (12 projects, 35% overrun)
  - Both exceed internal estimate (5% overrun). Procedure would weight-average to ~38% overrun. This will disappoint leadership, but the math is clear.

  Case 2 (automated port):
  - Only 3 comparable projects exist, all failures. Procedure flags insufficient data at Step 2 and triggers expert judgment. Analysts must contextualize failures (e.g., was technology or management the cause?).

  I'll explicitly call out the judgment-dressed-as-procedure pitfalls: 
  - Choosing which attributes define subclasses
  - Interpreting "gerrymandering" thresholds
  - Deciding when novelty overrides comparables

  The procedure's limits: It can't invent data where none exists, can't resolve fundamental class conflicts without judgment, and relies on honest historical data (no rosy exclusions).

  This structures the reference class problem while admitting its constraints – which is what a good civil service analyst would need to push back on optimism bias.
answer: |-
  Here is a standardized reference class forecasting procedure for cost/time estimation, designed for junior analysts. Follow steps sequentially:

  **Step 1: Construct Candidate Reference Classes (Mechanical)**  
  Generate 3 classes using historical databases (e.g., IPA, GAO, internal archives):  
  - **Class A (Broad):** All projects in the same sector (e.g., "global rail infrastructure").  
  - **Class B (Specific):** Projects matching ≥3 core attributes (e.g., "light-rail in cities 500k–2M population, post-2010, >10km length").  
  - **Class C (Narrow):** Projects matching ≥5 attributes including key risks (e.g., "elevated light-rail in geologically unstable mid-sized cities").  

  **Step 2: Viability Check (Judgment Dressed as Procedure)**  
  Reject a class if:  
  - **Size <10 projects** (unless Step 4 applies).  
  - **Gerrymandering:** >20% of failed/over-budget projects are excluded without *documented, project-agnostic* criteria (e.g., excluding "projects affected by corruption" is invalid; excluding "projects using deprecated technology" is valid).  
  - **Data quality:** >30% of projects lack verified final cost/duration.  

  **Step 3: Calculate Estimates & Weight Classes (Mechanical)**  
  For each viable class:  
  - Compute the **median** cost overrun (%) and schedule delay (months). *Median resists outlier distortion.*  
  - Assign weights: **Class A weight = 0.4, Class B weight = 0.5, Class C weight = 0.1** (prioritizing specificity but acknowledging broader stability).  
  - **Weighted average** = (A_median × 0.4) + (B_median × 0.5) + (C_median × 0.1).  

  **Step 4: Handling Small Samples (<10 Projects) (Judgment)**  
  If all classes have 2–9 projects:  
  - Use the **broadest available class** (even if n<10).  
  - Apply an **uncertainty multiplier**: Multiply the median overrun by 1.5.  
  - **Flag prominently**: "Estimate based on limited data (n<10); high uncertainty."  

  **Step 5: Judgment Threshold (Explicit Handoff)**  
  If no classes pass Step 2, or if the project has **>2 unprecedented technical/regulatory features**, halt and escalate. Output: "Insufficient comparable data. Expert Delphi method required."  

  ---

  **Case 1: Mid-Sized City Light-Rail**  
  - *Internal estimate:* 5% cost overrun  
  - **Class A (global light-rail):** 50 projects, median overrun = 40%  
  - **Class B (mid-sized city):** 12 projects, median overrun = 35% (viable)  
  - **Class C (elevated + seismic zone):** 6 projects — **rejected (n<10)**  
  - *Weighted average:* (40% × 0.4) + (35% × 0.5) + (N/A × 0.1) = **37.5% overrun**  
  - **Output to leadership:** "Expected overrun: 37.5%. This conflicts with internal estimate due to consistent global delays in comparable projects."  

  **Case 2: Automated Port Terminal**  
  - *Internal estimate:* 10% overrun  
  - **Class A (global port terminals):** 100 projects, median overrun = 20%  
  - **Class B (automated terminals):** 3 projects — all failed (200%+ overrun)  
  - **Class C (similar tech/scale):** 0 projects  
  - **Result:** Class B rejected (n<10, insufficient). Default to Class A (n=100 viable).  
  - **Small sample rule:** Apply uncertainty multiplier (20% × 1.5 = **30% overrun**).  
  - **Flag:** "Estimate based on broad port data (n=100). Only 3 automated projects exist; all failed. High risk of unquantified technical challenges."  

  ---

  **What’s Mechanical (60%):**  
  - Class construction (Step 1)  
  - Median calculation/weighting (Step 3)  
  - Math in small-sample multiplier (Step 4)  

  **Judgment in Disguise (40%):**  
  - Gerrymandering assessment (Step 2)  
  - Choosing core attributes for Class B/C (Step 1)  
  - Defining "unprecedented features" (Step 5)  

  **What the Procedure Cannot Do:**  
  - Create data where none exists.  
  - Resolve ideological disputes about risk tolerance.  
  - Overcome poor historical data quality.  
  - Replace domain expertise for novel projects (Step 5 is critical).  

  **Final Output:** Always report: ① Weighted reference class estimate, ② Internal estimate, ③ Gap analysis, ④ Flags for judgment steps. Total words: 798.
