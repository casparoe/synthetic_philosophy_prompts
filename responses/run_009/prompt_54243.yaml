prompt: |-
  I'm in a reading group that's been slowly making its way through historical materialism (this year it's the base/superstructure stuff), and I keep bumping into a move that I don't have a name for, and it's starting to bug me that I can't name it. Someone claims some superstructural thing — a legal doctrine, a family form, a religion, whatever — is explained by the economic base. Then someone points at a case where the thing seems to float free of the base: the same inheritance rules persisting across wildly different modes of production, a religion comfortably outliving the class that supposedly needed it, feudal guild forms hanging around deep into capitalism. And the response is never "ok, fine, so the base doesn't explain this one." The response is always to find some *further* function the thing serves. Feudal legality persisted into capitalism? Well, it stabilised the transition, or legitimated early bourgeois property, or lowered the costs of governance for the new class. And here's the thing: each individual rescue is genuinely plausible! I'm not saying these explanations are stupid. The problem is structural, not that the people are dumb. The theory racks up a point every time an explanation is found, but never loses a point when an explanation has to be *searched for* — the search itself gets counted as productivity, because hey, look how much the superstructure does for the base once you dig into it.

  I know some nearby stuff. Popper said Marxism (and psychoanalysis) were unfalsifiable, but that's not quite it, because the individual explanations here are falsifiable and often pretty good — it's more like the theory has a ratchet where its failures get converted into richer versions of itself. Evolutionary biologists talk about "just-so stories" and spandrels, which is close, but there the complaint is usually that the story is cheap because nothing is at stake, whereas here stuff IS at stake and the stories often pan out. And I gather G.A. Cohen and Jon Elster had a fight about functional explanation in Marxism, whether you need to specify the feedback mechanism that makes the trait serve the base — that's in the neighborhood but it's about the *microfoundations of a single explanation*, not about the pattern across many. What I'm after is a concept for the whole configuration: a research program where every anomaly is metabolized into an additional explanandum, such that the scheme can't lose and nobody treats that as a cost. My friends keep telling me it's just confirmation bias but it doesn't feel psychological, it's a property of the explanation-scheme itself, which is why I think it deserves its own name.

  So, two questions really. Is there an established term or literature for this exact pattern, in philosophy of science or wherever it lives? And if there isn't a clean one, I'd like you to coin something and define it properly — because I want to be able to distinguish it from (a) ordinary auxiliary hypotheses, which also rescue theories but where we at least pretend to be bothered by them, (b) genuine theoretical enrichment, where the new function would have been surprising in advance and so the theory pays for it, and (c) plain unfalsifiability. Give me the edges: what's the least controversial real instance, what's a borderline case, and what would a case have to look like for the label to NOT apply. I won't be satisfied with "that's Popper's falsifiability criterion," I've already considered that and it doesn't carve it right.
reasoning: |-
  Okay, the user is in a reading group focused on historical materialism, particularly the base/superstructure model. They're frustrated because whenever someone points out a superstructural element that persists despite changes in the economic base, the response is always to find another function it serves for the base. They feel this pattern turns anomalies into confirmations, making the theory unfalsifiable in a specific way. 

  Hmm, they mentioned Popper's falsifiability, just-so stories in biology, and Cohen vs. Elster on functional explanations, but none fully capture their concern. They want a term for this systematic conversion of counterexamples into deeper evidence. 

  First, I recall Lakatos's "research programmes" with hard cores and protective belts. This seems close—the base/superstructure link is the hard core, and auxiliary hypotheses (like new functions) form the protective belt. But they want something more precise about functional explanations specifically. 

  Then there's Gould and Lewontin's "spandrels" critique in evolution, where traits are assumed adaptive without evidence. But the user says here the explanations are plausible, even testable—it's the structural inevitability that bothers them. 

  Ah, "functional overdetermination" might work! It's when a trait has multiple functions, but the theory only acknowledges those serving its core mechanism. Or "teleological elasticity"—the tendency to stretch functional explanations indefinitely. But let me check if there's an existing term... 

  *Searches mental archives* Elster's "functionalist fallacy" comes up, but it's about missing microfoundations, not the ratchet effect. Maybe "explanatory ratcheting"? Or "metabolizing anomalies"? The latter feels vivid—anomalies are digested into new functions. 

  For defining boundaries: 
  - Least controversial case: Feudal guilds persisting under capitalism by "stabilizing transition." Classic! 
  - Borderline: A religion adapting post-class-collapse if there's evidence of bourgeois co-option. 
  - Not applicable: If Marxists conceded "Okay, this legal form has autonomous cultural causes," breaking the pattern. 

  User also wants to distinguish this from (a) auxiliary hypotheses (we usually penalize those), (b) genuine enrichment (like predicting a novel function), and (c) plain unfalsifiability (e.g., "God works in mysterious ways"). Here, the issue is the asymmetry: failures become "digging deeper," never costing the theory. 

  Coining "functional metabolization": 
  1. Core tenet is functional dependency (A exists because it serves B). 
  2. Anomaly (A persists without B) is solved by finding a new function (now A serves C, which maintains B). 
  3. The search effort is rebranded as discovery, not cost. 

  *Double-checks* Yes, this fits their guild/religion examples better than "confirmation bias" (which is psychological) or "unfalsifiability" (which ignores the plausibility of individual explanations). Nailed it!
answer: |-
  Your frustration resonates with a deep methodological issue in functionalist social theories. The pattern you describe isn't just confirmation bias or simple unfalsifiability—it's a **systematic conversion of anomalies into deeper confirmations** through functional elasticity. I'll define the term, situate it in philosophy of science, and demarcate its boundaries.

  ### The Term: **Functional Metabolization**
  **Definition:** A theoretical maneuver in functionalist explanation-schemes where apparent counterexamples (anomalies) to a core functional dependency (e.g., "superstructure serves the base") are reconceptualized as *additional, previously unrecognized functions* that nevertheless serve the same core mechanism. Crucially, the *process of searching* for these functions is treated as evidence of the theory's fecundity, not as an ad hoc cost. This creates an **asymmetrical ratchet effect**: successes incrementally "confirm" the theory, while failures are "metabolized" into new functional explanations, immunizing the core tenet.

  ### Why This Fits Your Case:
  - **Anomaly → Function**: Persisting feudal law isn't a counterexample; it's "revealed" to stabilize bourgeois transitions (a new function for the base).  
  - **Search as Productivity**: Finding this function is framed as *deepening* historical materialism's insight, not patching a hole.  
  - **Asymmetry**: No anomaly can falsify the core claim ("superstructure ultimately serves the base")—it can only expand the catalog of functions.  

  ---

  ### Boundaries: What It Is *Not*
  | **Concept**          | **Difference**                                                                 | Example                                  |
  |----------------------|-------------------------------------------------------------------------------|------------------------------------------|
  | **Auxiliary Hypotheses** | Auxiliary hypotheses *are penalized* as ad hoc if unsupported (e.g., epicycles in Ptolemaic astronomy). Functional metabolization *rewards* auxiliary searches as discoveries. | Adding epicycles is seen as a weakness; finding a new base-function for guilds is a "win". |
  | **Genuine Theoretical Enrichment** | Enrichment *predicts novel phenomena* or *resolves contradictions*. Here, new functions are *post hoc* and only preserve the status quo. | Marx predicting tendential fall in profit rates vs. retrofitting functions to persistent guilds. |
  | **Plain Unfalsifiability (Popper)** | Unfalsifiable theories lack testable claims. Functional metabolization *allows falsification of individual explanations* but shields the *core functional premise*. | "Class struggle explains everything" (vague) vs. "This guild *specifically* served capital accumulation by X" (testable but replaceable). |
  | **Just-So Stories** | Just-so stories are *untestable*. Functional metabolization offers *plausible, testable* explanations—but their *proliferation without cost* is the issue. | "Religion persists because it reduces cognitive dissonance" (hard to test) vs. "It lowered bourgeois governance costs" (testable via archives). |

  ---

  ### Established Philosophical Grounding
  1. **Lakatos' "Research Programmes"**:  
     - Your case fits the "degenerating problem shift": anomalies are resolved by adding epicyclic functions to the "protective belt" (auxiliary hypotheses) while the "hard core" (base/superstructure dependency) remains intact.  
     - *Why metabolization is distinct*: Lakatos doesn't address how *functionalist* programs uniquely *reinterpret anomalies as functional discoveries*.  

  2. **Gould & Lewontin's "Spandrels"**:  
     - Critiques biology's tendency to invent adaptive functions for non-adaptive traits.  
     - *Why metabolization is distinct*: In your case, the superstructure *is* functional—but the theory over-extends functional claims to *everything*, even persistences.  

  3. **Elster vs. Cohen**:  
     - Elster attacked "functional explanation without microfoundations" (e.g., "feudal law persisted because it stabilized capitalism" lacks a causal mechanism).  
     - *Why metabolization is distinct*: Your issue isn’t missing microfoundations (a single-explanation flaw) but the *systematic recyclability* of functional claims across anomalies.  

  ---

  ### Applying the Term: Cases and Edges
  - **Least Controversial Instance**:  
    Feudal guilds in capitalism → "They trained disciplined workers for factories!" (New function found; core unchallenged).  

  - **Borderline Case**:  
    A religion outliving its class base → "It now legitimizes *new* class relations!" Plausible, but if *every* persistent superstructure gets this treatment, it’s metabolization.  

  - **When the Label *Doesn’t* Apply**:  
    If Marxists said: "This legal form persists due to *autonomous institutional inertia*, not base-serving functions," they’d break the pattern. Or if an anomaly led them to *drop* the base/superstructure model entirely.  

  ---

  ### Why "Functional Metabolization" Works
  1. **Metabolize**: Anomalies are "digested" into functional fuel.  
  2. **Asymmetric**: The core never loses; anomalies only make it "richer."  
  3. **Distinguishes from cheap unfalsifiability**: Individual explanations remain empirical (unlike "the proletariat is historically necessary"), but the *scheme* is bulletproof.  

  This pattern is endemic to functionalist frameworks (not just Marxism—see functionalism in sociology/biology). Naming it lets you critique the *structure* of explanation without rejecting individual insights. Your reading group might benefit from Jon Elster's *Making Sense of Marx* (Ch. 1) and Daniel Little's *The Scientific Marx* for parallel critiques.
