        "positionName": "Single Agent with Divided Control",
        "summary": "One agent who performs all actions, but with fragmented executive control causing unawareness of some intentions.",
        "awkwardCommitment": "Must explain how an agent can genuinely disown actions performed by their own body without invoking multiple agents.",
        "cantSeparateFrom": ["Psychological-Continuity"]
      },
      {
