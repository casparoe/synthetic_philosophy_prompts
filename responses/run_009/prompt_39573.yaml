            "next": "leaf_partial_unity"
          },
          {
            "label": "No - each hemisphere pursues its goal unaware of the other's intention",
            "next": "agent_unity"
          }
        ]
      },
      {
        "id": "agent_unity",
        "question": "When the left hand spontaneously points to an object related to a right-hemisphere image, is this:",
        "answers": [
          {
            "label": "One agent acting without full self-knowledge",
            "next": "leaf_divided_control"
          },
          {
            "label": "A separate agent (the right hemisphere) initiating action",
            "next": "leaf_two_streams"
          }
        ]
      }
    ],
    "leaves": [
      {
        "id": "leaf_two_streams",
        "positionName": "Two Separate Streams",
        "summary": "Two distinct conscious subjects sharing one body, each with private experiences and agency.",
