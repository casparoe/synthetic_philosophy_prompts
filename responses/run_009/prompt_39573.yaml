answer: |-
  Here's the decision tree in your requested JSON format. The tree starts with the disavowal case to immediately force separation of agency/awareness, then systematically disentangles co-consciousness, subjecthood, and agency using your specified cases:

  ```json
  {
    "start": "disavowal",
    "nodes": [
      {
        "id": "disavowal",
        "question": "When the left hand (controlled by the right hemisphere) performs an action after seeing a cue the speaking hemisphere didn't see, and the patient says 'I didn't do that,' what does this show?",
        "answers": [
          {
            "label": "The patient didn't perform the action; the right hemisphere acted independently",
            "next": "conflict_interpretation"
          },
          {
            "label": "The patient performed the action, but the speaking hemisphere wasn't aware of the reason",
            "next": "walking_chatting"
          }
        ]
      },
      {
        "id": "conflict_interpretation",
        "question": "During intermanual conflict (e.g., one hand buttons a shirt while the other unbuttons it), what's happening?",
        "answers": [
          {
            "label": "Two separate agents fighting for control of the body",
            "next": "lateralised_response"
          },
          {
            "label": "One conflicted agent with inconsistent intentions",
            "next": "subject_unity"
          }
        ]
      },
      {
        "id": "walking_chatting",
        "question": "Outside the lab, the patient walks and chats seamlessly. Does this imply their consciousness is unified?",
        "answers": [
          {
            "label": "Yes - everyday unity shows experiences are joined",
            "next": "conflict_awareness"
          },
          {
            "label": "No - this just shows coordinated behavior, not necessarily unified consciousness",
            "next": "lateralised_response"
          }
        ]
      },
      {
