  **Key design features:**
  1. **Disavowal first:** Immediately forces distinction between agency ("who acted") and awareness
  2. **Case integration:**
     - Intermanual conflict appears in `conflict_interpretation` and `conflict_awareness`
     - Lateralised presentation drives `lateralised_response`
     - Everyday unity anchors `walking_chatting`
  3. **Separated dimensions:**
     - Co-consciousness handled in `walking_chatting` and `conflict_awareness`
     - Subject unity directly probed in `subject_unity`
     - Agency addressed in `disavowal`, `conflict_interpretation`, and `agent_unity`
  4. **Unoccupied leaf:** Path where experiences would be co-conscious but controlled by two agents (diagnosed as unattractive due to inherent contradiction)
  5. **Unseparated positions:** 
     - Psychological-Continuity and Single-Agent-Divided-Control share a leaf (B->A->A path) since both require one subject/agent but differ only in emphasis
     - Flagged in `cantSeparateFrom` fields

  The tree requires students to resolve contradictions between lab behavior and everyday unity while preventing conflation of consciousness, subjecthood, and agency.
