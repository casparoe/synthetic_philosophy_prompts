prompt: |-
  I run a small podcast on social theory and next week's guest just published a book defending a revived version of Weber's Protestant ethic thesis -- she argues that Calvinist anxiety about salvation genuinely helped cause early capitalism, not just co-occur with it, and that "ideal interests" can be drivers in the same way material interests are, without any ghost-in-the-machine stuff about values floating around outside people's heads. She's also pretty sharp about deflecting with the phrase "elective affinity" whenever someone presses her on the direction of causation, so I want questions that corner that move specifically.

  Write me eight to ten interview questions. At minimum I want one each on: (a) the materialist reversal, i.e. the objection that commerce was already thriving in Protestant regions before Calvinism and the religion just got recruited to sanctify what burghers wanted to do anyway; (b) functional equivalents -- Catholic Lyon, Quakers, Meiji Japan, diaspora merchant communities all produced capitalist behavior without predestination anxiety, so what exactly does the Calvinist mechanism add; (c) the "decisive vs enabling cause" question -- even if the ethic mattered, is a cause that only works given prior urbanization, state fragmentation, and property institutions really doing the explaining, or just the last domino that gets the credit; and (d) how she'd know she's wrong, i.e. what historical evidence would disconfirm the value-causation story. For each question, anticipate the most likely reply she'd give (including the elective-affinity deflection where relevant) and design the follow-up to make that reply harder to repeat.

  Please give it to me as a JSON object with two fields: "questions", which is an array of objects each having "question_text" (the question as I'd ask it on air), "pressure_point" (a short label for which objection it's pressing), "likely_reply" (one or two sentences), and "follow_up" (the follow-up question, keyed to that reply); and "opener", which is a single question to lead with that lets her lay out the strongest version of the thesis before I start pushing. Keep the tone conversational -- this is a podcast, not a seminar, so the questions should be things a reasonably well-read host would plausibly say out loud. Also dont make any question a two-minute speech disguised as a question, I hate that.
