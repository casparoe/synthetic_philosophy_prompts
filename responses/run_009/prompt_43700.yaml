  Then the deeper question: maybe they weren't even operating on Marxist theory at all, but simple power logic - persuasion is cheaper than force. The religious persecution example supports this; it's about eliminating rival power centers, not metaphysical consistency.

  If strict determinism were true, every ruble spent on propaganda would be wasted. But no state acts this way - even capitalists run ads. This suggests the "instrumental logic" explanation is strongest. 

