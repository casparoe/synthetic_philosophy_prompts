  First, I need to reconstruct their implied critique - that these states acted as if superstructure could independently threaten the base, contradicting their own determinist doctrine. The Engels quote becomes crucial here, where he admits superstructure can "preponderate" in shaping historical struggles. 

  Hmm... the user asks two layered questions: 
  1) What theory of base-superstructure causality must these states presuppose? 
  2) Does Engels' qualification actually justify their practices or make Marxism indistinguishable from idealism?

  I consider several angles: 
