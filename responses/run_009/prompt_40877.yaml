prompt: |-
  I'm a novelist, mid-draft on a book that's told entirely from inside one character's head, and the whole architecture of the thing leans on her decisions mattering — chapter to chapter, her reasons are what move the plot. My partner (a neuroscientist, annoying in the specific way you'd expect) keeps telling me the mind is just software running on the brain's hardware, and that this is supposed to be good news for me: software states cause things at the software level all the time, nobody thinks a running program is a ghost pushing the processor around. So her jealousy can be real and do actual work even though every physical event has a sufficient physical cause, because "her jealousy made her lock the door" is just the higher-level description of what the hardware was doing anyway.

  Here's what bugs me. The underlying worry, as I understand it from her, goes something like: if the neurons fire because of other neurons, then by the time you get up to the jealousy, the causal work is already finished — stacking the mental state on top either does nothing extra or double-counts the same event. The software analogy is supposed to answer that. But I can't tell if it answers the worry or just hides it. When people say the program "caused" the printer to jam, that sounds fine — but is that causal talk doing real work, or is it a convenient shorthand someone could always rewrite in hardware terms without losing anything? And if it's always rewritable, then maybe my plot only really happens at the neuron level, and at the level where I actually write — where reasons and decisions live — it's all just narration laid over the machine, epiphenomenal as anything. Which would honestly be a bummer for the book.

  So: audit the analogy. How far does it hold? And I want it in structured form because I'm going to tape it above my desk:

  First a mapping table with columns — [computer side, mind/brain side, where the mapping holds, where it strains]. Software, hardware, running, executing, "the program caused the crash," the whole works: tell me what corresponds to what.

  Then a JSON object with these fields:
  - "disanalogies": array of objects, each with "what_breaks" (string), "why_it_breaks" (string), "matters_for_my_question" (boolean — my question is whether character-level reasons do causal work, not whether brains are literally computers), and "if_true_costs_the_conclusion" (string, can be short).
  - "smuggled_premises": array of strings — things the analogy quietly imports that the brain case lacks, e.g. that software is designed, or that you can open the case and point at the parts.
  - "verdict": one of "holds", "holds_with_repairs", "fails", "inconclusive", plus a one-sentence "verdict_reason".
  - "better_analogy": a string — what a novelist should keep in her head instead, and what adopting it costs.
  - "one_line_for_the_novel": a single sentence I can actually put in a character's mouth or a narrator's aside without it sounding like a lecture.

  Around the structured stuff, whatever prose you need. Two things I especially want flagged honestly: whether the analogy is doing the same job when engineers use it and when philosophers of mind use it (I suspect those are different jobs, and alot of people slide between them), and whether the conclusion my partner wanted — jealousy really causes the locked door — was riding on the analogy the whole time or survives once the disanalogies are on the table. If the whole thing turns on some deeper distinction I've barely gestured at — say, between the mental being identical to the physical versus just correlated with it, or between one event under two descriptions versus two events overdetermining an outcome — definately lay that out, because I suspect that's where the real action is and I only half know it.
reasoning: |-
  Hmm, the user is a novelist struggling with a philosophical problem about free will and causation in their writing. Their neuroscientist partner uses a computer analogy (software/hardware) to argue that mental states like jealousy can be causally effective even though everything is physically determined. But the novelist worries this might make their character's decisions epiphenomenal - just narration over physical events.

  The core tension is between:
  - Physical determinism (neurons firing cause everything)
  - Mental causation (jealousy "making" someone lock the door)

  The computer analogy suggests higher-level software causation is real, but the novelist doubts whether this translates to minds. They want:
  1. A structured breakdown of the analogy
  2. Assessment of whether mental states truly cause actions
  3. Practical writing advice

  Key philosophical layers beneath this:
  - Type identity vs token identity theories
  - Causal exclusion problem (can two causes exist for one event?)
  - Supervenience (does mental depend on physical without adding causation?)
  - Emergence (do new causal powers arise at higher levels?)

  The novelist's deeper need is likely validation that their character's internal world isn't illusory for storytelling purposes. They're not seeking rigid philosophy but narrative permission to treat decisions as real.

  For the response structure:
  - Mapping table will show where analogy holds (hierarchy, multiple realizability) and strains (intentionality, evolution vs design)
  - JSON will target their specific worry: does character-level causation survive the disanalogies?
  - Must emphasize that for literature, phenomenological reality matters more than metaphysical truth
  - Verdict should be "holds with repairs" - mental causation is pragmatically real even if reducible
  - Better analogy: steering system (acknowledges constraints but preserves agency within them)
  - Final one-liner should capture irreducible subjective experience

  Crucially, the conclusion their partner wanted (jealousy causes action) survives if we accept:
  1. Explanatory autonomy (different levels need different descriptions)
  2. Causal relevance without causal exclusivity
  3. Supervenience doesn't imply epiphenomenalism

  The computer analogy works better in engineering (where levels are designed to map neatly) than philosophy (where consciousness adds hard problems). But for novel-writing purposes, what matters is that the character experiences jealousy as causal - and that experience is itself a physical brain state doing work.
answer: |-
  Here's your audit, structured as requested. I'll flag key philosophical tensions upfront: the core issue is **causal exclusion** (can mental properties cause anything if physical properties already suffice?) and the nature of **supervenience** (does the mental depend *entirely* on the physical without adding new causal powers?). The analogy *can* resolve this, but not perfectly—and crucially, **it holds well enough for your novel's purpose**.

  ---

  ### Mapping Table: Computer vs. Mind/Brain

  | Computer Side          | Mind/Brain Side               | Where Mapping Holds                                                                 | Where It Strains                                                                 |
  |------------------------|-------------------------------|-------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | **Hardware**           | Neurons, synapses, glia       | Physical substrate; necessary for function. Damage disrupts both.                   | Brains self-modify, are messy/plastic; computers are static unless upgraded.    |
  | **Software (Program)** | Mind (thoughts, emotions)     | Higher-level patterns (e.g., jealousy = specific neural activation pattern).        | Software is designed/top-down; minds evolve bottom-up. "Code" isn't literal.   |
  | **Running/Executing**  | Cognition/consciousness       | Process unfolds over time via physical changes. Input → processing → output.        | Consciousness has qualia (subjective feels); computers lack phenomenal experience. |
  | **"Program caused X"** | "Jealousy caused Y"           | Both are shorthand for complex hardware/neural events producing outcomes.           | Mental states *feel* intentional; program states lack intrinsic "aboutness".    |
  | **Compiler/OS**        | Innate cognition (e.g., language) | Pre-existing structure enabling higher functions.                                   | Brains develop dynamically; no clear separation between "OS" and "apps".        |
  | **Debugger**           | Introspection                 | Self-monitoring capability.                                                         | Introspection alters the state it observes; debuggers don’t.                    |
  | **Crash**              | Mental breakdown              | System failure due to underlying instability.                                       | Mental states have emotional texture; crashes are purely functional.            |

  ---

  ### JSON Analysis
  ```json
  {
    "disanalogies": [
      {
        "what_breaks": "Intentionality / Meaning",
        "why_it_breaks": "Software states derive meaning from human designers/users. Jealousy is *intrinsically* about its object (e.g., a rival) for the subject.",
        "matters_for_my_question": true,
        "if_true_costs_the_conclusion": "Weakens 'reasons' as causal—but only if meaning must be non-physical."
      },
      {
        "what_breaks": "Top-Down Causation",
        "why_it_breaks": "In computers, software is designed to exploit hardware. In brains, mental states *emerge* from hardware but may loop back to alter it (neuroplasticity).",
        "matters_for_my_question": true,
        "if_true_costs_the_conclusion": "None—supports mental causation if emergent states constrain lower levels."
      },
      {
        "what_breaks": "Phenomenal Consciousness",
        "why_it_breaks": "Jealousy *feels* like something; software has no subjective experience. This may be irrelevant to causal efficacy but central to your novel.",
        "matters_for_my_question": true,
        "if_true_costs_the_conclusion": "None for causation—but risks making reasons feel 'hollow'."
      },
      {
        "what_breaks": "Multiple Realizability",
        "why_it_breaks": "Software can run on different hardware. Jealousy might too, but brains are biological—no evidence it could run on silicon.",
        "matters_for_my_question": false,
        "if_true_costs_the_conclusion": "N/A (irrelevant to your plot)"
      }
    ],
    "smuggled_premises": [
      "Software is designed by intelligent agents (brains aren't).",
      "Hardware/software boundaries are clear-cut (brains are integrated).",
      "Causal levels are neatly separable (in minds, they're entangled).",
      "Computation is observer-relative (mental states aren't—to the subject)."
    ],
    "verdict": "holds_with_repairs",
    "verdict_reason": "The analogy resolves causal exclusion by showing how higher-level states can be causal without overdetermination, but minds add intentionality and subjectivity that strain the model.",
    "better_analogy": "A river shaping its own banks: water flow (neural activity) erodes rock (synaptic structure), altering future flow paths (decisions), creating feedback where the 'course' (mind) is both cause and effect.",
    "one_line_for_the_novel": "Her jealousy wasn't a ghost in the machine—it *was* the machine, burning pathways only it could carve."
  }
  ```

  ---

  ### Key Breakdown: Why Your Partner is Mostly Right (But You’re Both Missing Nuance)
  **The Core Philosophy**: Your worry is **causal exclusion**—if neurons fully cause the door-locking, how can jealousy *also* cause it without overdetermination? The analogy answers: "jealousy" and "neural pattern" aren't two causes; they’re **one event described at two levels**. Like "the software crashed" vs. "the CPU overflowed the buffer," both are true, but one is more useful for explaining *why* it matters. Jealousy isn’t "extra"—it’s the pattern that *organizes* the neural cascade. 

  **Where Engineers vs. Philosophers Diverge**:  
  - Engineers use the analogy for **pragmatic explanation** (e.g., "The email client froze"). It works because they *designed* the levels to map cleanly.  
  - Philosophers debate **metaphysical grounding** (e.g., "Can software exist without minds?"). Here, it strains because brains weren’t designed.  

  **Does the Conclusion Survive?** Yes—**jealousy causes the locked door** in the only sense that matters for your book:  
  1. **Causal relevance**: Jealousy is *how the neural activity appears* at the character level. It’s not double-counting; it’s describing the cause in terms of its role in her life.  
  2. **No epiphenomenon**: If you removed the jealousy-pattern but kept the neurons firing identically, the action wouldn’t occur—because the pattern *is* the neurons.  

  **The Deeper Fix**: Adopt **non-reductive physicalism**. Minds supervene on brains (no jealousy without neurons), but mental properties have **causal powers** by virtue of their organization. Your character’s decision is *identical* to a neural process—not a ghost, but the physical system *doing what it does* when a person weighs reasons.  

  ---

  ### What to Tape Above Your Desk
  **The Verdict**: The analogy holds for causation. Your character’s reasons are as real as software—they’re the story the brain tells itself to navigate the world.  
  **Write Like This**: Her jealousy didn’t just correlate with locking the door; it *was* the locking of the door, written in the only language her cells knew.  
  **Cost of the Better Analogy**: Accepting that reasons are both causes and *effects* of neural pathways—your character is carving her own riverbed.
