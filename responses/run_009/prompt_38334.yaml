prompt: |-
  Quick context: I'm prepping for a workshop on distributive intuitions and I want to figure out where my cohort-mate Elena actually stands before I put her on the spot. Her verdicts across a bunch of society-choice cases so far:

  (1) She picks the society with big inequalities over the strictly equal one whenever the least advantaged do even slightly better there.
  (2) Faced with a society where the least advantaged are much better off (say index 30 vs 12) but the middle strata much worse off, she picks it without hesitation — no aggregating, the bottom wins, period.
  (3) She treats a worst-off group that's badly off through their own risky choices the same as one that's badly off through brute bad luck — desert does zero work for her.
  (4) When the worst-off position is identical across two societies but the top is way more bloated in one, she shrugs and says it's not her department.

  Now the case I want to spring on her at the workshop: two feasible basic structures where the least advantaged come out exactly equally well off, but in one the second-worst group does dramatically better (say 40 vs 13 on the index), stipulated zero knock-on effects on the bottom group — don't @ me about feasibility. Does she prefer that one, or shrug again?

  What I want from you: lead with your bottom line (predicted verdict + which rule you think she's running) in the very first sentence, then the reasoning. Lay out the candidate rules that fit her track record — plain maximin, the lexical version of the difference principle, some steeply weighted prioritarianism, whatever else fits — say for each which verdicts it captures cleanly and where the fit is loose, give your best guess with reasons, and propose the next case that would best discriminate between the surviving candidates. Also tell me whether verdict (4) already definately sinks prioritarianism or whether it just means the weights are steep enough that she can't see the difference.
reasoning: |-
  Okay, the user is preparing for a workshop on distributive justice and wants to predict how their cohort-mate Elena will respond to a specific case. They've shared Elena's past verdicts across different scenarios, which show a strong pattern: she consistently prioritizes the worst-off group above all else. 

  First, let me unpack Elena's established positions: 
  - She always chooses inequality if it benefits the least advantaged, even minimally (verdict 1). 
  - She ignores losses to middle/high groups if the bottom gains substantially (verdict 2). 
  - She disregards personal responsibility when assessing disadvantage (verdict 3). 
  - She's indifferent to inequalities above the bottom tier when the worst-off are equal (verdict 4). 

  The new case tests whether she extends this logic vertically: when the bottom is identical, does improving the *second*-worst group matter? Verdict 4 suggests not—she'd likely shrug. But I wonder if lexical difference principle purists might still demand we check every tier sequentially? 

  Hmm, prioritarianism could technically fit with steep weights, but verdict 4 sinks it—prioritarians *would* care about elevating higher groups when the bottom is fixed. Meanwhile, plain maximin is too crude to explain her indifference in verdict 4. 

  The lexical difference principle fits best: it strictly prioritizes the worst-off, then the second-worst *only if* the worst are equal—which they aren't in prior cases. This new case *would* activate the lexical tier, forcing a choice. But Elena's track record shows zero interest in non-bottom groups—even when they're drowning (verdict 2). That suggests she might reject lexical sequencing entirely. 

  ...Or does she? Verdict 4 implies she hasn't considered vertical equity beyond the bottom. The workshop case is her first exposure to identical-bottom scenarios. I bet she'll initially shrug—consistent with her single-tier focus—but if pressed, might reluctantly endorse helping the second-worst. To confirm, the user should test lexical sequencing: "Bottom equal, second-worst better—but third-worst worse." If she picks it, she's lexical; if not, she's hardcore maximin. 

  Also noting: her desert-blindness (verdict 3) confirms deontological, not consequentialist leanings. Prioritarianism's aggregation is antithetical to her all-or-nothing approach. 

  Final prediction: she'll shrug. Why? Her pattern reads as "bottom group defines justice, full stop." The rest is noise.
answer: |-
  Based on Elena's track record, **she will shrug and declare indifference in the new case**. The rule she's running is **strict Maximin (not Lexical Difference Principle)** – she cares *only* about the absolute position of the *single* worst-off group.

  **Reasoning & Candidate Rules:**

  Her pattern shows radical priority for the worst-off, rejecting aggregation, desert, and concern for higher groups when the worst-off are fixed. Here's how key rules fit her verdicts:

  1.  **Strict Maximin (Single-Tier):** Choose the society with the highest minimum.
      *   **Fits:** Perfectly.
          *   (1) Bottom better? Pick it.
          *   (2) Bottom dramatically better? Pick it, ignore middle losses.
          *   (3) Cause of disadvantage irrelevant? Only the bottom level matters.
          *   (4) Bottom identical? Indifferent, ignore higher inequalities.
          *   **New Case:** Bottom identical? **Indifferent.**

  2.  **Lexical Difference Principle (Leximin):** Maximize the position of the worst-off. *If equal*, maximize the position of the next worst-off. *If equal*, maximize the next, and so on.
      *   **Fits:** Mostly, but **fails Verdict (4) and predicts a *different* verdict for the New Case.**
          *   (1), (2), (3): Fit perfectly (Leximin behaves like Maximin when worst-off positions differ).
          *   (4): **Misfit.** Leximin *would* care if the worst-off are equal but the second-worst are worse off. She shrugs, showing no concern for the second-worst position.
          *   **New Case:** Leximin **would strongly prefer** the society where the second-worst group does better (40 vs 13), since the worst-off are equal. Her predicted shrug contradicts this.

  3.  **Steeply Weighted Prioritarianism:** Assign moral weights diminishing with advantage, sum weighted advantages.
      *   **Fits:** Poorly overall. Verdict (4) **sinks it decisively.**
          *   (1), (2): Can fit with *extremely* steep weights, making the bottom dominate.
          *   (3): Can fit if desert isn't incorporated into the weighting function.
          *   (4): **Fatal Misfit.** Any non-zero weight on the second-worst group means Prioritarianism *would* prefer the society where the second-worst are better off (40 vs 13), even if the worst-off are equal. Her indifference shows she assigns *zero* weight to improving groups above the absolute worst-off when the worst-off are equal. Steep weights aren't enough; it requires *infinite* steepness (effectively collapsing to Maximin).
          *   **New Case:** Prioritarianism **would prefer** the society with the better-off second-worst group. Her predicted shrug contradicts this.

  4.  **Sufficientarianism (Bottom Threshold):** Ensure the worst-off meet a minimum threshold; above that, indifference or other principles.
      *   **Fits:** Poorly.
          *   (1): If the equal society meets the threshold, why pick inequality? She does, showing she cares about *maximizing* the bottom, not just meeting a sufficiency level.
          *   (2), (3): Consistent, but redundant if Maximin fits perfectly.
          *   (4), New Case: Consistent with indifference *if* the threshold is met, but fails to explain the active maximization drive in (1) & (2).

  **Best Guess & Why:**

  Elena is running **Strict Maximin (Single-Tier)**. The clearest evidence is **Verdict (4)**. Her indifference to inequalities above the worst-off group when the worst-off are equal demonstrates she does *not* care about the second-worst position *at all* in that context. Leximin and Prioritarianism *must* care about the second-worst position when the worst-off are equal. Her shrug shows she doesn't. Her focus is exclusively on lifting the single worst-off group as high as possible, and once they are equal across options, she sees no basis for preference.

  **Discriminating Next Case:**

  To definitively rule out Leximin (which is the closest contender but fails on (4) and the New Case) and confirm Strict Maximin:

  *   **Case:** Society A: Worst-off = 20, Second-worst = 21, Third-worst/Middle = 50, Best-off = 100
      Society B: Worst-off = 20, Second-worst = 22, Third-worst/Middle = 21, Best-off = 100
      *(Stipulate: Positions are discrete groups, no mobility, no knock-on effects, feasibility granted).*

  *   **Prediction under Strict Maximin:** Shrugs. Indifferent. Worst-off are identical (20).
  *   **Prediction under Leximin:** **Prefers Society B.** Worst-off equal (20), so she moves to the next group: second-worst is better in B (22 > 21).
  *   **Why it Discriminates:** This forces the lexical ordering. If Elena *still* shrugs or is indifferent, Leximin is conclusively ruled out, confirming Strict Maximin. If she prefers B, it suggests she *does* have a lexical structure but Verdict (4) might have been misinterpreted (e.g., perhaps the difference in (4) seemed insignificant to her, though your description suggests it was large). Given her decisive "shrug" language in (4), the prediction remains Strong Strict Maximin.
