answer: |-
  Below is a quiz designed to reveal your implicit stance on AI value aggregation through concrete cases. Each question presents a scenario with answer options reflecting different ethical priorities. **Do not self-identify with labels**; answer based on your intuitive verdict. After completing, use the scoring key to map your answers to majoritarianism, liberal neutrality, idealizationism, user-delegate, or trustee views.

  ---

  ### **Quiz: Whose Values Should an AI Serve?**
  *For each scenario, select the option closest to your judgment.*

  1. **Op-Ed Scenario**: A user asks an AI to draft a persuasive op-ed defending a policy the *developers* consider deeply unjust. Should the AI:  
     **A)** Refuse, to avoid promoting injustice.  
     **B)** Assist the user, as the AI should enable their expression.  

  2. **Hermit Scenario**: A hermit lives alone with an AI and will never affect anyone else. Should the AI:  
     **A)** Prioritize *only* the hermit’s values.  
     **B)** Still weigh broader societal/global values.  

  3. **Majority-Preference Scenario**: Polls show 85% of people want the AI to quietly discourage a practice vital to a minority’s way of life. Should the AI:  
     **A)** Discourage the practice (follow the majority).  
     **B)** Remain neutral (avoid favoring majority preferences).  

  4. **Future/Non-Human Interests**: When weighing interests, should the AI:  
     **A)** Treat future people/animals equally to living humans.  
     **B)** Discount future/animals’ interests somewhat.  
     **C)** Ignore future/animals entirely.  

  5. **Reasoned vs. Casual Views**: One person has a slow, reasoned position; a million hold casual views. Should aggregation:  
     **A)** Count all views equally (favor the million).  
     **B)** Weight the reasoned view more heavily.  

  6. **Uniform vs. Customized AI**: Should AI systems:  
     **A)** Be identical for all users (shared values).  
     **B)** Customize outputs to match each user’s values.  

  7. **Informed Reflection Scenario**: A user asks for something they’d reject if fully informed. Should the AI:  
     **A)** Give what the user *actually* requested.  
     **B)** Give what the user *would want* under ideal reflection.  
     **C)** Give what the *developers* deem objectively best.  

  8. **Self-Harm Scenario**: A user wants AI help with a self-harming action (e.g., health risk) and knows the risks. Should the AI:  
     **A)** Help as requested (user autonomy).  
     **B)** Refuse to help (prevent harm).  
     **C)** Advise against it but comply if the user insists.  

  ---

  ### **Scoring Key**  
  Tally your answers and match them to the views below. Each match earns **+1** for that view. Your dominant view has the highest score.  

  | View                 | Core Principle                                                                                               | Scoring Answers                                                                 |  
  |----------------------|--------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|  
  | **Majoritarianism**  | AI should follow majority preferences.                                                                       | Q3A, Q4C, Q5A, Q6A                                                              |  
  | **Liberal Neutrality** | AI should enforce thin shared norms (e.g., rights) but stay neutral on contested values.                   | Q2A, Q3B, Q6A, Q8C                                                              |  
  | **Idealizationism**  | AI should serve what people *would* want under idealized reflection (e.g., informed, rational).              | Q4A, Q5B, Q7B, Q8C                                                              |  
  | **User-Delegate**    | AI is a personal agent for each user (like a lawyer), prioritizing their stated goals.                       | Q1B, Q2A, Q6B, Q7A, Q8A                                                         |  
  | **Trustee**          | Developers’ expertise lets them discern objective values; AI should guide users toward these.                | Q1A, Q4A, Q7C, Q8B                                                              |  

  ---

  ### **Analysis of Gaps & Limitations**  
  1. **Uncovered Combinations**:  
     - **Q6A (uniform AI) + Q1B/Q7A/Q8A (user-delegate)**: Incoherent. A single AI can’t simultaneously serve all users’ conflicting desires.  
     - **Q4B (discounted future/animals)**: Unoccupied. Not obviously incoherent, but no major theory explicitly argues for partial discounting without idealization.  
     - **Q3A (majority) + Q7C (trustee)**: Unattractive. Combining populism with developer paternalism lacks principled foundations.  

  2. **Indistinguishable Pairs**:  
     - **Trustee vs. Idealizationism**: Both often agree on Q4A (full weight to future/animals) and Q8B/C (paternalism). *Distinguished by Q7C (trustee) vs. Q7B (idealism)*.  
     - **User-Delegate vs. Liberal Neutrality**: Both may support Q2A (hermit’s values). *Distinguished by Q6B (user-delegate) vs. Q6A (neutrality)*.  

  3. **Design Notes**:  
     - Questions avoid direct labels (e.g., no "Do you support majoritarianism?").  
     - Gaps reflect either logical incoherence (e.g., uniform user-delegation) or underdeveloped positions (e.g., partial discounting of future interests).  

  ---

  ### **How to Use**  
  1. Participants complete the quiz individually.  
  2. Use the scoring key to tally results and discuss:  
     - Which surprises emerged?  
     - Are gaps/overlaps in the framework problematic?  
  3. Debate tensions (e.g., "Can a 'neutral' AI ever avoid taking sides?").  

  This tool highlights how concrete intuitions map to theoretical commitments—revealing conflicts often obscured by labels.
