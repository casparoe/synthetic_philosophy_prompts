prompt: |-
  My sister and I got into it about whether she should take a free genetic test for a condition there's no treatment for. She said she'd rather not know, and I told her that's straightforwardly irrational because Good's theorem proves information always has non-negative expected value — as long as the test is free and accurate, refusing it can only leave her worse off in expectation. She said the theorem doesn't apply to this case but couldn't really explain why, and tbh neither can I. So who's right? If she's just being irrational I want to keep pushing her, but if the theorem doesn't actually cover a case like this, what exactly breaks?
reasoning: |-
  Okay, let me tackle this user's question about Good's theorem and genetic testing. The user and their sister are arguing over whether she should take a free genetic test for an untreatable condition. The user believes refusing the test is irrational based on Good's theorem, which states that information always has non-negative expected value. But the sister feels it doesn't apply, though she can't explain why.

  First, I need to recall Good's theorem. It's from decision theory, right? Good's theorem says that with cost-free, accurate information, the expected value of decisions can't decrease when you have that information. The user is applying this here, thinking that since the test is free and accurate, not taking it must be irrational.

  But why does the sister feel it doesn't apply? She mentions there's no treatment. That's key. Good's theorem assumes that information leads to better actions. If the test result doesn't change any actions—because there's no treatment or preventive measures—then the information's instrumental value is zero. The theorem doesn't consider non-instrumental value, like psychological impact.

  The user's sister is worried about the emotional burden. Even if the test is negative, she might have anxiety while waiting. If positive, she faces knowing she'll develop an untreatable condition, which could cause distress. The theorem doesn't account for the utility of peace of mind. Avoiding anxiety has value, which might outweigh the zero instrumental benefit here.

  Also, the theorem assumes rational decision-making with consistent utilities. But humans aren't purely rational. We have emotions, cognitive biases, and different risk perceptions. The sister's preference to avoid distress is a valid part of her utility function. For her, the disutility of knowing might be higher than any potential benefit.

  I should check if the theorem has caveats. It requires that decisions are made optimally before and after information. Without actionable steps, the decisions remain the same regardless of the test result. So, the theorem's conditions aren't met. Also, utility functions must include all psychological factors. If the sister values ignorance as bliss, that's part of her utility.

  The user wants to know if pushing their sister is justified. But respecting autonomy is important. The sister's choice is rational for her personal utility function. The user might need to understand that rationality isn't just about expected value in a vacuum but includes emotional well-being.

  In conclusion, the theorem doesn't apply because the information doesn't enable better decisions. The sister's aversion to psychological distress makes her choice rational. The user should respect her decision rather than push based on a misinterpretation of the theorem.
answer: |-
  You're both right in different ways, but your sister has the stronger case here. Good's theorem (also known as the "value of information" theorem) has crucial assumptions that **don't hold** in this specific scenario, making her choice potentially rational. Let's break it down:

  1.  **What Good's Theorem Says (Correctly):**
      *   *If* information is cost-free and perfectly accurate,
      *   *And* you can use that information to take different actions that affect outcomes,
      *   *Then* the *expected utility* (overall benefit/happiness/value) of your situation after getting the information and acting optimally based on it is *at least as high* as the expected utility of acting optimally without the information.
      *   In essence: Free, accurate information *that can change your decisions* has non-negative expected value.

  2.  **Where Good's Theorem Applies:**
      *   **Decisions with Actions:** Buying insurance, choosing medical treatment, investing, making repairs, etc. Example: A genetic test for a *treatable* condition. Knowing you have it allows you to seek treatment (action), improving your outcome. Knowing you *don't* have it might let you avoid unnecessary screenings (different action). The information changes behavior for the better.

  3.  **Why It Doesn't Apply to Your Sister's Case (The Breakdown):**
      *   **The "No Action" Problem:** This is the core issue. **There is no treatment or preventive action.** Knowing the result (positive or negative) fundamentally *does not change what she can or should do* about the condition itself. Her future actions regarding the *disease progression* remain identical whether she knows or not.
      *   **Psychological Impact is Excluded:** Good's theorem focuses *only* on the instrumental value of information for influencing *actions that change physical outcomes*. It **explicitly ignores the intrinsic psychological value or disvalue of knowing the information itself.** For your sister:
          *   **A Positive Result:** Knowing she will develop an untreatable condition could cause significant anxiety, depression, dread, or alter her outlook on life – a major negative utility (disutility).
          *   **A Negative Result:** Knowing she *won't* develop it might bring relief (positive utility), *but* the period waiting for results might cause anxiety, and the relief might be fleeting or less impactful than she hopes.
          *   **Not Knowing:** Preserves "hope" or at least avoids the specific burden of certainty about a negative future. This state of uncertainty has its own utility value for her.
      *   **Utility Function Complexity:** Her personal utility function places a very high value on avoiding the psychological distress associated with knowing bad news, especially when powerless to change it. The theorem assumes a fixed utility function over outcomes, but it doesn't mandate what *constitutes* utility. **Avoiding psychological suffering *is* a rational goal that contributes to her overall utility.**

  4.  **Reconciling with the Theorem:**
      *   **No Instrumental Value:** Because there are no disease-modifying actions to take based on the information, the *instrumental* value predicted by Good's theorem (the value from changing actions) is **zero**.
      *   **Psychological Value Can Be Negative:** The *intrinsic* value of the information (the knowing itself) can be negative *for her*, due to the anticipated distress. Since the instrumental value is zero, the *overall* expected value (instrumental + intrinsic) becomes negative: `0 + (Negative Psychological Value) = Negative Expected Value`.
      *   **Theorem Holds, But Value is Zero + Psychological:** Good's theorem still holds for the *instrumental* part (it's non-negative, specifically zero here). It just doesn't claim anything about the *total* value, which includes the psychological impact.

  **Who's Right?**

  *   **You are right** that Good's theorem proves *instrumental* information (that changes actions) has non-negative expected value.
  *   **Your sister is right** that the theorem **doesn't apply** in this specific case because:
      1.  The information has **no instrumental value** (no actions change).
      2.  The **psychological impact** (which the theorem ignores) is the dominant factor, and for her, its **expected value is negative**.

  **Is Your Sister Being Irrational?**

  **No, her position is likely rational *for her*.** She is making a valid utility calculation:
  *   She perceives the potential psychological cost of knowing (especially a positive result) as very high.
  *   She perceives the benefit of knowing (certainty if negative, but no action if positive) as low or insufficient to outweigh the potential cost.
  *   She values the current state of uncertain hope/avoidance more than the potential states induced by knowing.

  **Should You Keep Pushing Her?**

  **No, you should respect her decision.** This is a deeply personal choice about psychological well-being and confronting potentially devastating news without recourse. Her reasoning isn't illogical; it's based on a different weighting of utilities (prioritizing psychological peace over certainty when certainty can't be acted upon).

  **What Exactly Breaks?**

  1.  **The "Actionability" Assumption:** The fundamental breakdown is the lack of actions influenced by the test result. Good's theorem requires that information enables *better choices*. Without actionable choices, this core mechanism fails.
  2.  **Scope of "Utility":** The theorem's mathematical formulation typically considers utility derived from *outcomes of actions*, not directly from *states of knowledge* themselves. Your sister's utility is heavily affected by the state of knowledge (knowing vs. not knowing), independent of physical outcomes.

  **In essence:** Good's theorem is powerful for decision-making where information guides action. For untreatable genetic conditions, the decision-making power is removed, leaving only the raw psychological impact of the knowledge itself. Valuing avoidance of that psychological burden is a perfectly rational and understandable choice. Respect her autonomy on this deeply personal matter.
