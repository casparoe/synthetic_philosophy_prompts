  - 3 traders: each starts with one of each good (Red, Blue, Yellow) and 20 tokens.

  **Rules**:
  - Each round (5 rounds, 3 minutes each), traders can approach any agent and propose a trade: "I give you [good X] and you give me [good Y] plus [1 token] as fee." The agent can accept or reject.
  - Agent accepts only if:
     a) They hold good Y and the trader offers good X.
     b) They prefer X over Y (according to their preference card).
     c) They have at least 1 token to pay the fee.
  - If accepted: the agent gives Y and 1 token to the trader and receives X.
  - Traders can hold multiple goods and tokens. They can trade any good they have.
  - Agents and traders record their holdings and tokens after each trade.

  **End of Game**:
  - Agents: Their total reward is the number of tokens they have (each token = 1 point, and points can be converted to candy or extra credit).
  - Traders: Their total reward is the tokens they collected (each token = 1 point).

  **Instructor's Role**:
  - Monitor and answer questions.
  - After the game, lead the debrief.

  ### Debrief Outline:
  1. Ask cyclic agents: What happened? Did you notice a pattern?
  2. Ask an agent who refused: Why? What did you think would happen?
  3. Map the trades: For a cyclic agent who got pumped, show the sequence: started with Yellow, traded for Red (paid 1), then Red for Blue (paid 1), then Blue for Yellow (paid 1). Now back to Yellow but lost 3 tokens.
  4. Highlight: Without foresight, the agent would keep doing this until broke.
  5. But if they refuse, they break the cycle. Is that rational?
  6. Discuss the assumptions: 
     - Repeated interaction? (Yes, multiple rounds.)
     - Small fees? (Yes, 1 token per trade.)
     - Myopic evaluation? (Each trade is acceptable in isolation.)
  7. Philosophical issue: The money pump argument assumes the agent is myopic. If the agent is sophisticated (foresees the cycle), they can avoid it. So is the requirement of transitivity too strong? Or is it that cyclic preferences are only problematic when combined with myopia? What does rationality require?

  ### Predictable Problems and Fixes:
  1. **Problem**: Agents don't understand preferences. **Fix**: Give clear preference cards and do an example.
  2. **Problem**: Traders don't know who has cyclic preferences. **Fix**: Let traders try trades and see who accepts. Alternatively, after a few rounds, the instructor can hint: "Some agents have preferences that cycle." Or we can let the traders figure it out by trial.
