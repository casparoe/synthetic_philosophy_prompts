  We are designing an in-class trading game to illustrate the money pump argument and the concept of diachronic rationality. The goal is to have students experience how cyclic preferences can lead to being "pumped" of their endowment through a series of trades, and then to observe how foresight (sophisticated choice) can prevent this.

  ### Key Design Elements:
