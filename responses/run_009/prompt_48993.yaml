  2. **Endowment and Goods**: We'll use tokens (or candy) that can be exchanged for a reward (e.g., extra credit points, candy, or small prizes). Each agent starts with an endowment of one good (e.g., a fruit: Apple, Banana, Cherry) and some tokens (say, 10 tokens). Traders start with no goods but have tokens (maybe 20 tokens to start) and can hold multiple goods.

