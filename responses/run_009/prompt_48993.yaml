  - 4 cyclic agents: assign starting goods: 2 start with Yellow, 2 start with Blue? (To allow pumping from different points). Actually, to make pumping easy, we can have all cyclic agents start with Yellow? Then the cycle would be: trade Yellow for Red (if offered), then Red for Blue, then Blue for Yellow.
