  I recall the Doomsday Argument hinges on self-locating probabilities and reference classes. The key divide is between SSA (Self-Sampling Assumption) and SIA (Self-Indication Assumption). SSA treats your birth rank as a random sample, leading to doomsday predictions, while SIA weights hypotheses by the number of observers, countering the doomsday conclusion. The user is right that academics have entrenched themselves on either side without much movement.

