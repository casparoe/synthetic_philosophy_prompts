prompt: |-
  I've been arguing with my sister about assisted dying for months and I've finally written down my gut verdicts on a bunch of concrete cases, and now I want to know if they add up to a principle or if I'm just pattern-matching to whichever framing the last article I read used. Here's the list. ALS patient who's ventilator-dependent asks for the ventilator to be withdrawn, knowing she'll die within the hour: fine. Same patient instead asks her doctor to hand her a lethal prescription she swallows herself while she still can: fine, and honestly it doesn't feel very different from the withdrawal. Same patient asks the doctor to just inject her: also fine? I keep saying fine, which makes me suspicious I'm not actually tracking any distinction at all. A 45-year-old who's physically healthy but has decades of treatment-resistant depression asks for assisted death under the kind of psychiatric-suffering criteria places like the Netherlands and Belgium allow: not fine, something about it not being the endstage of anything. A woman with advanced dementia, living apparently contentedly in a care home, no longer recognizes anyone, but twenty years ago wrote an advance directive saying that if she ever reached that point she wanted to be helped to die: honoring it, I flip on weekly. A patient with untreatable cancer pain asks to be sedated into permanent unconsciousness with no food or fluids, expecting to die of dehydration within days (palliative sedation): fine. A terminally ill patient decides entirely on her own to stop eating and drinking and asks her caregivers just for comfort care while she dies over a week or two: fine, her body her choice. A doctor gives escalating doses of morphine for pain, foreseeing but not intending that a dose might suppress breathing enough to kill: obviously fine.

  The killing/letting-die line clearly isn't doing any work for me, since I treat the injection, the prescription, and the withdrawal as basically the same. My tentative thought is that it's some combination of consent plus prognosis that's doing the real work. But my sister keeps hammering the palliative sedation and the voluntary stopping of eating and drinking, saying both are just the injection with extra steps and a slower clock, and I don't have a good comeback — I feel fine about them precisely because the dying comes from the patient's own body giving out rather than anything anyone administers, but I can't say why that matters if I've already said the injection is fine. And the advance directive case seems to break every candidate principle I try, because the person consenting and the person dying are two people in every way I care about. So give me your best shot at a principle (or two candidates if you need them), stated precisely, with the case that motivates each clause. Then tell me straight which of my verdicts it can't save, and what it says about a case I haven't thought through: a man with a severe but stable high spinal cord injury, not sick, not dying, not in pain, who says life as a quadriplegic is not one he'll accept and asks for assisted death. Lead with the bottom line — the principle itself, in your first sentence — and then the reasoning; no preamble and no restating my question back at me.
reasoning: |-
  Okay, the user is wrestling with ethical consistency in assisted dying cases. They've listed concrete scenarios where they intuitively feel whether assisted dying is permissible or not, but can't articulate a unifying principle. Their struggle centers on reconciling their acceptance of some active interventions (like lethal injection) with passive withdrawals (like ventilator removal), while rejecting psychiatric euthanasia and feeling conflicted about dementia advance directives.

  Hmm... their core tension seems to be between two values: bodily autonomy versus irreversible harm prevention. They're comfortable when death results from natural processes (like dehydration after sedation) even if intentionally chosen, but uneasy when death is directly administered to someone who isn't terminally ill. The dementia case exposes their deeper concern about discontinuity of identity - does the advance directive still bind when the person no longer exists psychologically?

  Their sister's challenge about palliative sedation being "injection with extra steps" hits a nerve because it questions whether the mechanism of death matters if the outcome and consent are identical. The user intuitively feels it does matter, but can't defend why. That suggests their real principle might be about *causal proximity* - how directly medical action induces death versus allowing underlying pathology to take its course.

  For the quadriplegic case they haven't considered, their stated framework would logically permit it (autonomy + irreversible condition), but I suspect this clashes with their unstated boundary against facilitating death for non-terminal suffering. That's why their principle needs that "irreversible decline" clause - to exclude stable conditions like quadriplegia or depression where adaptation might still occur.

  The breakthrough is recognizing that "endstage" for them isn't just prognosis, but whether medical intervention is merely bridging the gap to inevitable death. With ALS, the ventilator is artificial support; with cancer, painkillers ease an unavoidable dying process. But in depression or quadriplegia, there's no biological dying process to facilitate - death would be manufactured, not mediated.
answer: |-
  **Core Principle:** *Assisted dying is permissible when a patient with decision-making capacity autonomously requests it to end suffering caused by an irreversible condition in irreversible decline that will inevitably lead to death in the foreseeable future, and the chosen method minimizes suffering while being causally proximate to the underlying pathology.*

  **Breakdown & Case Application:**

  1.  **"Patient with decision-making capacity" (Consent):** Motivated by the dementia advance directive case. The directive reflects past wishes, but the current, content self lacks capacity to re-affirm consent. This creates a discontinuity. (Verdict: Your flip-flop is consistent; the principle denies permissibility here due to *current* lack of capacity/confirmation).
  2.  **"Autonomously requests it" (Consent):** Motivated by all cases where consent is direct and current (ALS cases, depression, sedation, VSED, morphine). Rejects coercion or non-voluntary requests.
  3.  **"To end suffering caused by an irreversable condition" (Irreversible Pathology):** Motivated by the depression case. Treatment-resistant depression is severe suffering, but depression itself isn't an *irreversible biological condition* inevitably leading to death. It's a mental state with potential (however remote) for future remission or adaptation, distinct from ALS or terminal cancer *destroying the body*. (Verdict: Consistent with your "not fine").
  4.  **"In irreversible decline that will inevitably lead to death in the foreseeable future" (Prognosis):** Motivated by ALS, terminal cancer, and the spinal cord injury case. ALS/terminal cancer meet this. A stable high spinal cord injury, while irreversible and causing profound disability/suffering, is *not* in irreversible *decline* and does *not* inevitably lead to death in the foreseeable future; it's a stable state permitting life continuation. (Verdict: Your principle would likely say *not fine* for the quadriplegic case, aligning with your discomfort about non-endstage cases like depression).
  5.  **"Chosen method minimizes suffering while being causally proximate to the underlying pathology" (Method/Causality):** Motivated by your struggle with withdrawal vs. injection vs. sedation/VSED, and your sister's challenge.
      *   **Ventilator Withdrawal:** The pathology (ALS) causes inability to breathe. Removing the artificial support allows the pathology to take its natural course. Minimizes suffering via palliative care. Causal proximity is high.
      *   **Lethal Prescription/Injection:** Directly accelerates death caused by the underlying pathology. Minimizes suffering. Causal proximity is direct but artificial. Permitted under the principle if requested.
      *   **Palliative Sedation/VSED:** The pathology (cancer, terminal illness) causes suffering/death. Sedation addresses suffering; stopping nutrition accelerates death *due to the underlying pathology's impact* (e.g., body can't sustain itself). VSED leverages the body's natural failure when nutrition is withheld *due to the illness*. Minimizes suffering. Causal proximity remains: death results from the body succumbing to the illness without artificial sustenance, not from a novel external cause like poison. It *is* the injection "with extra steps," but the steps involve leveraging the *natural consequences* of the pathology itself rather than introducing a wholly foreign lethal agent. This maintains a link between the cause of death (the illness) and the method chosen.

  **Where Your Verdicts Clash with the Principle:**

  *   **ALS Patient Injection:** Your "fine" verdict aligns. The principle allows it (capacity, autonomy, irreversible decline, foreseeable death).
  *   **Depression:** Your "not fine" aligns. The principle denies it (lacks irreversible *biological* pathology in inevitable decline leading to foreseeable death).
  *   **Dementia Directive:** Your uncertainty aligns. The principle firmly denies it due to *current* lack of decision-making capacity. (Verdict clash: Your principle *cannot* consistently save your occasional "honor it" verdict).
  *   **Palliative Sedation/VSED:** Your "fine" aligns. The principle accepts it as minimizing suffering while death remains causally proximate to the underlying pathology (dehydration/starvation *because* the body is terminally ill).
  *   **Morphine:** Your "fine" aligns. Principle accepts as standard palliative care; intent is pain relief, foreseen risk is tolerated double effect. Not assisted dying per se.
  *   **Spinal Cord Injury Case:** Your principle (as articulated here) would say **not fine**. The condition is irreversible and causes suffering, but it's *stable*, not in *decline*, and doesn't inevitably lead to death in the foreseeable future. Life can continue. This distinguishes it from ALS/terminal cancer.

  **Why the Distinction Between Methods Matters:** While consent and prognosis are paramount, the method distinction explains your comfort with sedation/VSED vs. unease with non-terminal injection. Sedation/VSED leverages the *body's failure due to illness*; introducing a novel lethal agent (like an injection for a non-terminal quadriplegic) severs the causal link to pathology and makes death an *imposed* outcome on an otherwise biologically stable (though disabled) state. This maintains a boundary between facilitating a dying process already underway and creating death where none was imminent. Your sister's "slower clock" point is valid regarding *outcome*, but the *causal pathway* (body failing vs. toxin acting) retains ethical significance within this framework.
