prompt: |-
  A request about two distinctions that tend to get run together in the trolley literature: the distinction at the heart of the doctrine of double effect — between harm that is intended, whether as an end or as a means, and harm that is merely foreseen — and the distinction at the heart of the doctrine of doing and allowing — between harm an agent brings about and harm the agent merely allows to happen. It has been suggested that across the trolley family of cases the two doctrines are extensionally equivalent, delivering the same verdicts case by case, so that the choice between them is, within this family at least, partly a verbal matter. I would like you to assess that suggestion.

  Work from the following three cases, spelt out so that we share the same material:

  1. Bystander. A runaway trolley will kill five people on the main track. You can throw a switch diverting it onto a side track, where it will kill one person; had the switch not been thrown, the trolley would have proceeded to the five, and the one person would have been unharmed.
  2. Footbridge. A runaway trolley will kill five. The only way to stop it is to push a heavy person off a footbridge into its path; his body will stop the trolley, and he will die.
  3. Loop. As in Bystander, you can divert the trolley onto a side track on which it will kill one person — except that here the side track curves back onto the main track just before the five, so that if the one person's body were somehow not to stop the trolley, it would continue on and kill them. His death is thus causally necessary to saving the five in a way it need not be in Bystander.

  Please structure your response with the following sections, in this order:

  a. The two doctrines stated (roughly 150 words). Formulate each doctrine precisely enough that a defender of it would accept your formulation, and note the main interpretive question each faces: for the doctrine of double effect, how to draw the intended/foreseen line; for the doctrine of doing and allowing, what counts as doing a harm rather than allowing it.

  b. Verdicts on the three cases (roughly 300 words). Present a table with one row per case, giving the verdict each doctrine appears to deliver, the reasoning behind it, and a final column recording agreement or disagreement between the doctrines. Flag explicitly the contested point in Bystander: whether flipping the switch should be classified as doing the one person's death or as merely redirecting a threat with a foreseen death.

  c. Extensional equivalence (roughly 250 words). Assess the suggestion above: within these cases and near variants of them, do the doctrines always agree, or is there some construction on which they come apart — for instance, a harm that is allowed but functions as a means, or a harm that is done yet plainly not intended?

  d. The residual difference (roughly 200 words). Suppose the doctrines are extensionally equivalent across the whole trolley family: state what substantive difference between them nonetheless remains, and identify the kinds of cases outside that family — omissions, two-agent cases, or threats that would exist regardless of anyone's action — that would reveal it.

  e. Overall judgment (roughly 100 words). Say which doctrine you take to be doing more of the explanatory work in our trolley intuitions, and whether the equivalence suggestion survives.
reasoning: |-
  Okay, let me approach this trolley problem analysis systematically. The user presents a sophisticated philosophical request comparing two ethical doctrines across three classic cases. 

  First, I need to clearly define both doctrines as requested. The doctrine of double effect centers on intention versus foresight - this is tricky because intention isn't always conscious. The doing/allowing distinction faces its own challenges in defining what constitutes active harm. 

  For the case analysis: 
  In Bystander, both doctrines permit action but for different reasons - double effect sees death as foreseen but not intended, while doing/allowing frames it as redirecting existing harm. 
  Footbridge is prohibited by both - the death is clearly intended as means, and involves actively causing new harm. 
  Loop becomes interesting - it should theoretically split the doctrines but both end up prohibiting the action. 

  The extensional equivalence claim seems plausible within trolley cases, but breaks down elsewhere. Consider a doctor who withholds treatment to harvest organs - this would be allowing harm (permissible under doing/allowing) but intending harm (impermissible under double effect). 

  Ultimately, while the doctrines converge in trolley scenarios, their foundations differ. The doing/allowing distinction appears more fundamental to our intuitions about physical interventions, though both play roles. The equivalence holds for this specific family but not beyond.
answer: |-
  ### a. The two doctrines stated

  **Doctrine of Double Effect (DDE)** holds that it may be permissible to cause harm as a *foreseen side effect* of pursuing a good end, but impermissible to *intend* that harm either as an end or as a means. The core interpretive challenge is distinguishing intended from merely foreseen harm. Defenders argue that harm is intended if it is part of the agent’s plan (e.g., necessary for achieving the goal), not just a consequence they predict.  

  **Doctrine of Doing and Allowing (DDA)** holds that causing harm through *active intervention* (doing) is morally worse than *failing to prevent* harm (allowing). The key interpretive question is determining when an agent "does" harm versus "allows" it, often turning on whether the agent initiates a new causal chain or merely redirects an existing threat.

  ---

  ### b. Verdicts on the three cases

  | Case         | Double Effect Verdict & Reasoning                                                                 | Doing/Allowing Verdict & Reasoning                                                                                      | Agreement? |
  |--------------|---------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------|------------|
  | **Bystander** | **Permissible.** Death of the one is *foreseen but not intended*; the intention is to save the five. Diverting the trolley does not require the one’s death as a means. | **Permissible.** Flipping the switch *redirects an existing threat* rather than creating a new one. This is "allowing" the one to die by not blocking the redirected trolley. | ✅ Yes     |
  | **Footbridge** | **Impermissible.** The heavy person’s death is *intended as a means* to stop the trolley (his body is instrumentalized).               | **Impermissible.** Pushing the person *creates a new causal chain* (doing harm), not merely redirecting an existing threat. | ✅ Yes     |
  | **Loop**      | **Impermissible?** Controversial. Death of the one is *foreseen but likely intended as a means*, as his body *must* stop the trolley to save the five. | **Impermissible?** Controversial. Diverting the trolley *exploits the one as a barrier*, arguably "doing" harm by making him a necessary causal element. | ✅ Yes (typically) |

  **Contested Point in Bystander**: DDA defenders classify flipping the switch as "allowing" harm because it merely redirects an existing threat. Critics argue it actively causes death by exposing the one to lethal danger he otherwise avoids, constituting "doing" harm. DDE avoids this debate by focusing on intention.

  ---

  ### c. Extensional equivalence

  The suggestion of extensional equivalence holds *within these three cases*: both doctrines permit Bystander, forbid Footbridge, and typically forbid Loop. However, equivalence breaks in near variants:  

  1. **"Fat Man’s Fall" (Doing/Allowing counterexample)**: Suppose Fat Man accidentally slips off the footbridge into the trolley’s path, saving the five. You *could* grab him to stop his fall but refrain. DDA may deem this "allowing" harm (permissible), but DDE still forbids it if you *foresee* his death and intend not to save him as a means to save the five. Here, DDE forbids while DDA permits.  
  2. **"Pre-Existing Bomb" (Double Effect counterexample)**: A trolley will kill five unless you divert it toward one person. Unbeknownst to you, a *separate* bomb will kill that person seconds later. DDE permits diversion (death is unintended/foreseen), but DDA may forbid it if diverting the trolley actively causes death ("doing" harm) by introducing a *new* threat (the trolley) when the bomb alone would have killed him.  

  Thus, the doctrines diverge when harm is *foreseen and instrumental* but not actively caused (DDE forbids, DDA may allow), or when harm is *actively caused* but *unintended* (DDE may allow, DDA forbids). Loop’s ambiguity highlights their reliance on different criteria.

  ---

  ### d. The residual difference

  Even if extensionally equivalent in trolley cases, the doctrines retain a **fundamental distinction**: DDE is primarily concerned with *mental states* (intention vs. foresight), while DDA focuses on *causal responsibility* (initiating vs. redirecting harm).  

  Cases outside the trolley family reveal this:  
  - **Omissions**: A doctor intentionally withholds treatment from a patient to harvest organs for five others. DDE forbids (intending death as means), but DDA may permit ("allowing" death).  
  - **Two-Agent Scenarios**: A villain will kill five unless you shoot one hostage. DDE forbids (intending death), while DDA asks whether shooting "does" new harm or "allows" the villain’s threat.  
  - **Overdetermined Harm**: Pushing one person into a fire that would kill him anyway to save five. DDE may forbid (intending harm), DDA may permit (not worsening his fate).  

  Here, DDE’s constraint is stronger on intentions, while DDA focuses on causal roles.

  ---

  ### e. Overall judgment

  The **Doctrine of Doing and Allowing** does more explanatory work in trolley intuitions. Redirecting threats (Bystander) feels distinct from creating new forces (Footbridge), a physical distinction DDA captures directly. DDE’s reliance on intention is more abstract and contested (e.g., in Loop). The equivalence suggestion *largely survives within core trolley cases* but fails in variants involving omissions or pre-existing threats, revealing the doctrines’ divergent foundations. While both inform judgments, DDA better anchors the intuitive difference between "steering harm" and "imposing harm."
