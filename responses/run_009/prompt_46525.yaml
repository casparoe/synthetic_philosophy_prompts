prompt: |-
  I sit on the serious-event review committee at a mid-sized community hospital, and next week we have to issue a written determination in a case that has split the committee down the middle. An overnight patient on a telemetry floor died of worsening hyperkalemia before dawn. The lab's critical-value alert system paged the covering hospitalist twice with escalating potassium results; she acknowledged neither page — she says she was managing a rapid response on another unit and that the pages should have auto-routed to the charge nurse, which the system is not configured to do. The patient's primary nurse noticed the abnormal result but, relying on the standard practice that critical labs go to the covering physician, did not escalate further. And the patient himself had, earlier that evening, refused the repeat blood draw that would have confirmed the trend. Under our state's peer-review framework, how we fill in the "causal contribution" field on the root-cause analysis form determines whether the hospitalist is referred for remediation, whether the nurse faces a practice alert on her license record, and whether the event is reportable up the chain. Three factions have formed: the hospitalist's colleagues insist that only the hyperkalemia caused the death and that filling in any omission as a cause is unfair scapegoating; the nursing representatives argue that if any non-action counts as a cause, then the nurse's failure to escalate counts equally, and they point out that the physician is the one whose omission is being treated as more consequential; and a third group wants every salient omission — including the never-acknowledged pages and the ambiguously worded callback policy — listed as contributing causes, since that's what drives the safety fixes.

  I've been reading enough philosophy of causation to know this isn't just a hospital-politics fight, and I want the memo to be philosophically defensible, not just administratively tidy. The live issue is causation by omission: it seems wrong to say the hospitalist's silence caused the death when there's no physical process linking her not-paging-back to the patient's heart rhythm, and it seems equally wrong to say the chief medical officer — who also didn't check the potassium — contributed to the death, even though his omission is structurally the same kind of non-event. I gather the standard moves are that omissions are causes only relative to a contrast class or default, and that treating omissions as causes may just be smuggling in norms about who was supposed to do what. I'd like you to take the role of a philosopher specializing in causation who has been brought in to advise us: before drafting, think carefully about which contrast classes are in play here and who gets to set them, and consider whether the "causal contribution" field on our form is even tracking causation or something more like responsibility.

  Draft the two-page decision memo I can circulate before the meeting. It should recommend a concrete determination for the form — which omissions, if any, we list as causal contributions, and in what terms — plus criteria the committee could actually apply to comparable future cases, stated in plain language my clinical colleagues won't roll their eyes at. Engage seriously with the strongest argument on the losing side: the position that "cause" should be reserved for positive events and that everything we're really doing is assigning duty-violations under another name. And tell me honestly if your recommendation implies that our form conflates two questions the committee should be answering separately, since if so the memo should say that too — I'd rather fix the instrument than keep litigating these cases one by one.
reasoning: |-
  Okay, this is a complex and high-stakes medical ethics case wrapped in causation philosophy. The user sits on a hospital committee that must determine causal contributions in a patient death involving multiple system failures and human omissions. 

  First, let's unpack what's really being asked. The user needs:
  1) A philosophically sound but clinically practical framework for handling omissions in RCA
  2) A concrete decision memo draft for immediate use
  3) Long-term procedural recommendations

  Hmm... the core tension is between metaphysical causation (physical events causing physical outcomes) and pragmatic institutional needs (identifying preventability factors). The hospitalist's colleagues have a point about hyperkalemia being the only physical cause, but that ignores the preventability aspect. The nursing group rightly notes inconsistency in how omissions are weighted. The systems-focused faction sees the bigger picture but risks overloading the form.

  Key philosophical insights to weave in:
  - Omissions only exist against expectations (contrast classes like "standard practice")
  - Causation-by-omission is inherently normative (depends on duties)
  - The RCA form is secretly tracking two things: physical causation and responsibility gaps

  For the memo structure:
  Start by reframing the question - this isn't "what caused the death" but "what failures made it unprevented." Then provide criteria distinguishing physical causes from contributory factors. The hospitalist's omission meets both duty and reasonable preventability tests. The nurse's inaction meets duty but not preventability (since she reasonably relied on protocol). The CMO comparison fails the proximity test.

  Biggest challenge: Explaining why the hospitalist's omission "counts" but the CMO's doesn't without sounding arbitrary. Need to emphasize the direct workflow expectation and immediate window of intervention. Might borrow Hart and Honoré's "necessary condition in the circumstances" framework.

  For the form redesign suggestion: Strongly imply that separating "clinical causation" from "systems contribution" columns would prevent future disputes. The current conflation forces moral judgments into causal language.

  Ethical tightrope: Must protect frontline staff from unfair blame while honoring the patient's story. The potassium refusal complicates things - that's where a "shared responsibility" framing helps.
answer: |-
  ## MEMORANDUM  
  TO: Serious Event Review Committee  
  FROM: Philosophical Advisory Consultant  
  DATE: 24 October 2023  
  SUBJECT: Determination Framework for Causal Contribution in Hyperkalemia Case  

  ---

  ### I. Core Philosophical Problem: What "Causal Contribution" Means Here  
  This case exposes a tension in our use of "causation" on the RCA form. Philosophically, **omissions (non-events) are not causes in the physical sense**—no energy transfer links the hospitalist’s unread page to the patient’s cardiac rhythm. Yet institutionally, we use "causal contribution" to identify *preventable system failures*. This conflates two distinct questions:  
  1. **Physical Causation:** The biological sequence (hyperkalemia → cardiac arrest).  
  2. **Responsibility for Prevention:** Human/system failures that *allowed* the physical cause to proceed unchecked.  

  The strongest counterargument—that we should *only* list hyperkalemia as the cause—correctly notes that omissions lack physical efficacy. But this view ignores our mandate: to improve *preventable* harm. If "cause" is restricted to biochemistry, the RCA form becomes clinically useless.  

  ---

  ### II. Recommended Framework: "Contributory Omissions"  
  **Recommendation:** List **only the hospitalist’s failure to acknowledge pages** as a "causal contribution." Explain it as:  
  > *"Failure to acknowledge critical potassium alerts, removing the opportunity for intervention during a narrow window of preventability."*  

  **Why not the nurse or CMO?** Apply these plain-language criteria:  
  1. **Duty-Bound Intervention:** Was this person the *designated agent* for acting on this specific risk?  
     - Hospitalist: Yes (covering physician for critical results).  
     - Nurse: No (standard practice delegates critical labs to MD).  
     - CMO: No (no direct patient care duty).  
  2. **Proximate Opportunity:** Could this person *realistically* have altered the outcome at that moment?  
     - Hospitalist: Yes (treatment was possible pre-arrest).  
     - Nurse: Unlikely (lacked authority to treat hyperkalemia alone).  
     - CMO: No (not monitoring results overnight).  
  3. **System Reliance:** Did others reasonably depend on this person’s action?  
     - Hospitalist: Yes (nurse relied on MD response per protocol).  
     - Nurse: No (nurse met duty by flagging result to MD).  

  **Why not the patient’s refusal?** Patient autonomy limits our scope. While clinically relevant, refusal is not a *system failure* the hospital controls.  

  ---

  ### III. Addressing Key Dissenting Views  
  **"Only hyperkalemia caused the death"**  
  - *Agree:* Hyperkalemia is the *necessary physical cause*.  
  - *Disagree:* If "cause" is limited to pathophysiology, RCA cannot improve safety. We are tracking *why prevention failed*, not just biology. The hospitalist’s omission was the *proximate preventability gap*.  

  **"The nurse’s omission is equivalent"**  
  - *Strong point:* If omissions are causes, why prioritize the MD’s?  
  - *Response:* Not all omissions are equal. The nurse had no duty to *act* on critical labs—only to report them (which she did). The hospitalist had a duty to *respond*. Her omission directly blocked the next step in the safety chain.  

  **"List all omissions to drive fixes"**  
  - *Agree:* All factors (pages, policies) warrant review.  
  - *Disagree:* The "causal contribution" field should distinguish *critical failures* from *system vulnerabilities*. Listing everything dilutes accountability and implies equivalent blame.  

  ---

  ### IV. Criteria for Future Cases  
  For "causal contribution by omission," ALL must apply:  
  1. **Assigned Duty:** The role had explicit responsibility to act.  
  2. **Preventability:** Timely action could plausibly have changed the outcome.  
  3. **Reliance:** Others reasonably expected this action.  
  4. **No Override:** Patient/family did not refuse intervention.  

  *Examples:*  
  - ✅ *Included:* MD fails to review critical result; pharmacist misses lethal interaction.  
  - ❌ *Excluded:* Charge nurse doesn’t check every MD’s inbox; nurse doesn’t call rapid response for stable vital changes.  

  ---

  ### V. Critical Recommendation: Fix the Form  
  **The RCA form conflates causation and responsibility.** This forces us to distort language, creating needless conflict. I recommend:  
  1. **Split "Causal Contribution" into two fields:**  
     - *Clinical Cause:* The disease/injury sequence (e.g., "hyperkalemia leading to cardiac arrest").  
     - *Contributory Factors:* Human/system failures enabling harm (e.g., "unacknowledged critical alerts").  
  2. **Add a "Responsibility Assessment" section:**  
     - Ties contributory factors to roles for remediation (e.g., "Hospitalist: Protocol remediation; Lab: System upgrade").  

  This separates factual analysis (what happened?) from normative judgment (who needs support?). Until this is done, we will debate philosophy in every case.  

  ---

  ### VI. Conclusion  
  For this case: **List hyperkalemia as the clinical cause and the hospitalist’s unacknowledged pages as the sole contributory omission.** Do not escalate the nurse’s license—she followed protocol. The hospitalist’s remediation should focus on redundant alert systems during crises.  

  This framework avoids scapegoating while targeting the most consequential gap: the breakdown in physician response during a narrow window of opportunity. I urge the committee to endorse these criteria and revise the RCA form to distinguish causation from preventability.  

  ---  
  **Attend next week’s meeting to discuss revisions to the RCA instrument.**  
  *(End of Memo)*
