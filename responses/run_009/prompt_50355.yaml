  The user might also appreciate knowing that Fricker discusses the ethical burden on listeners to cultivate awareness and adapt, which is different from a blanket rule. Mentioning the potential pitfalls of default belief, like testimonial smothering, could strengthen their critique of the book’s proposed solution.

