  As for my view, neither version fully supports sum-ranking as a doctrine of justice. What they establish is that under VNM rationality and Pareto, social welfare must be linear in individual utilities - which is significant but falls short of full utilitarianism. The theorems are better seen as characterizing a class of possibilities rather than prescribing one specific social ordering.

