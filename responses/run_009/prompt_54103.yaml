prompt: |-
  I'm taking a seminar that straddles criminal law and philosophy of action, and I've become obsessed with what the doctrine of common purpose (what everyone still calls joint enterprise) quietly presupposes about collective intentionality. Please respond as if you were a philosopher of action with a firm grasp of English criminal law doctrine, and think carefully before committing to anything.

  Here is the practice as I understand it, and the tangle I can't untie. Under the pre-2016 case law, if two people set out on a criminal venture together and one of them, in carrying it out, killed with intent, the other was guilty of murder so long as he had foreseen that the killing was a real possibility — no agreement on the killing, no intent that it happen, just foresight plus continued participation. The Supreme Court in Jogee in 2016 said the law had taken a wrong turning there: foresight is merely evidence of an intention to assist, and the accessory must himself intend to assist the principal to act with the requisite intent. But the same judgment leaned heavily on conditional intention — the example given is the gang of robbers who all intend that guns be used with serious intent if resistance is met — so the group is still, in effect, treated as a single intentional unit in the run of cases, even while the official story is that liability always bottoms out in one individual's intention. And the rest of the law points in both directions at once. Criminal law insists it never imposes vicarious liability: guilt is personal, nobody is punished merely for what another did. Yet under common purpose each party is, functionally, answerable for the other's excesses within the scope of their shared design, and only escapes for what counts as a fresh departure from it. Withdrawal, meanwhile, has a peculiar shape: an accomplice who simply drifts away, stops participating, and says nothing is still in it; to get out he must communicate his withdrawal — as if participation is a commitment that cannot be rescinded unilaterally. Compare the neighbouring doctrines: in company law, the identification doctrine attributes an employee's acts to the firm only when the employee is the directing mind and will — the company literally acts through him — and a store manager whose sloppiness breaches trading law is not the company; whereas in the civil law of partnership, each partner binds the others as their agent, on a straightforward representation story. So: two people with a plan to burgle are treated as something like a single intentional agent; ten thousand shareholders and a management structure are treated as a single agent only through a directing mind; two partners are treated as separate agents tied by authority rather than shared mind. My question is what theory of joint action, if any, the criminal doctrine presupposes. Does it presuppose a genuine plural subject, something like a joint commitment that each party incurs on joining and cannot exit without communicating — or a Bratman-style shared intention built from interlocking individual intentions, or an irreducible we-intention of the Searle sort? Does Jogee's retreat to individual intention reveal a philosophical commitment to reductionism about collective intentionality, and if so, how do the withdrawal and fresh-departure rules survive that retreat — they look irreducibly structural? Or is the doctrine philosophically underdetermined, so that several rival theories of joint action would each license it?

  I'd like you to reconstruct the implicit theory of collective intentionality and joint action in the criminal rules, distinguishing what those rules strictly presuppose from what they merely sit comfortably alongside, and telling me where the practice is underdetermined. Please work through the concrete features — the foresight rule and its correction, conditional intention, the communication requirement for withdrawal, the fresh-departure limit, the contrast with the identification doctrine in company law and agency in partnership — rather than discussing the theories in the abstract, and say which theorist's account best fits which feature, if any single account fits them all. Then tell me what would actually have to change in the doctrine if the law were rebuilt on, say, a joint-commitment view rather than a reductionist one — which convictions would go, which acquittals would go. Please be honest about the points where you are reconstructing rather than reporting, state how confident you are in the fit of each part of your reconstruction, and single out the part you are least sure of. Please write in British English throughout.
reasoning: |-
  Alright, let me try to unpack this user's query. They're deeply involved in a seminar blending criminal law and philosophy of action, specifically fixated on the doctrine of common purpose and what it implies about collective intentionality. The user has outlined their understanding of the legal developments, especially the shift post-Jogee, and highlighted contradictions in how different legal areas handle collective responsibility. 

  First, I need to parse the core of their confusion. They see a tension: criminal law insists on personal liability, yet common purpose functionally holds individuals accountable for others' actions under a shared venture. The withdrawal rules, requiring communication, suggest an almost contractual commitment, while doctrines in company and partnership law differ significantly. The user is essentially asking which theory of collective intentionality underlies these legal structures.

  I should start by breaking down the key legal points they mentioned. The pre-Jogee foresight rule treated mere foresight as sufficient for liability, which was later corrected to require intent to assist. Conditional intention post-Jogee still allows for group liability in scenarios like armed robberies where violence is anticipated. The communication requirement for withdrawal and the fresh departure rule imply that participation creates a binding commitment. 

  Next, contrasting this with company law's identification doctrine (only attributing actions of the "directing mind") and partnership law's agency principles shows the criminal doctrine's unique approach. The user is right to point out these discrepancies—they highlight that criminal common purpose doesn't neatly fit into any one philosophical model but borrows elements from several.

  Now, addressing their main question: which theory of joint action does the doctrine presuppose? It seems the law is pragmatic, blending Bratman's interlocking intentions for the accessory's individual intent, Searle's we-intentions in conditional intention scenarios, and Gilbert's joint commitments in withdrawal rules. No single theory fits perfectly, which is why the doctrine appears philosophically underdetermined. 

  The user also wonders if shifting to a joint-commitment view would change legal outcomes. For instance, under a Gilbertian model, withdrawal without communication might still hold someone liable, whereas a stricter Bratman approach could require clearer evidence of intent dissolution. This could lead to fewer convictions post-withdrawal if communication isn't mandatory, altering outcomes in cases like R v Mitchell.

  I need to be honest about uncertainties, especially around conditional intention and its fit with Searle's we-intentions. The law's reliance on functional equivalence rather than philosophical purity makes it adaptable but conceptually messy. The user's deep dive into these tensions shows they're grappling with the law's implicit assumptions versus its practical applications, seeking clarity on whether the doctrine has a coherent theoretical foundation or is merely pragmatic.
answer: |-
  Your dissection is razor-sharp and pinpoints the profound philosophical tension at the heart of common purpose. Criminal law's doctrine of common purpose doesn't cleanly map onto any single philosophical theory of collective intentionality; it's a pragmatic, often unstable, amalgam driven by policy concerns (deterring group crime, attributing responsibility for foreseeable collateral harm) rather than philosophical coherence. Let's reconstruct its implicit presuppositions, feature by feature, distinguishing necessary commitments from comfortable fits and underdetermined areas, using British terminology and authority.

  **1. Foresight Rule (Pre-Jogee) & Jogee's Correction:**
  *   **Practice:** Pre-Jogee: Foresight of possibility as *sufficient* for accessory liability for murder. Jogee: Foresight is only *evidence* of the necessary *intention to assist or encourage* the principal's intentional acts, including those with murderous intent.
  *   **Presupposition:** Jogee firmly reasserts **methodological individualism**. Liability *must* bottom out in the *individual* accessory's *mens rea* – their own intention regarding the principal's conduct. This presupposes **reductionism**: collective concepts *must* be analysable into the intentions (and actions) of individuals.
  *   **Comfortable Fit:** **Bratman's Shared Cooperative Activity (SCA)**. The accessory must have a *participatory intention* ("I intend that we J [burgle] in part by my doing A [driving/getaway] and your doing B [breaking in]") and *meshing subplans*. Crucially, Bratman allows for *asymmetric* intentions – the accessory intends to assist the principal's crime, without necessarily sharing the principal's precise intent for violence. Foresight *evidences* this intention to assist the venture knowing its potential. It doesn't require a "we-intend" identical in content.
  *   **Underdetermined/Uncomfortable:** While compatible with reductionism, the *strength* of the evidential link Jogee allows between foresight and intent is a legal, not philosophical, choice. Searle's irreducible "we-intentions" (*I* intend *as part of our* intending) are conceptually possible but legally excluded by Jogee's insistence on individual intent. Gilbert's joint commitment requires mutual recognition, absent in many common purpose scenarios (e.g., a hanger-on who foresees violence but isn't "committed" with others).
  *   **Confidence:** High on the reductionist commitment post-Jogee. The law *requires* individual intent.

  **2. Conditional Intention (Post-Jogee):**
  *   **Practice:** Liability arises where parties share a plan that *includes* the conditional use of violence (e.g., "we rob, and if resisted, we use serious violence"). The accessory intends to assist *that very venture*, including its conditional violent element.
  *   **Presupposition:** Individuals can form complex, conditional intentions about the group's actions. The group plan itself is a shared object of reference.
  *   **Comfortable Fit:**
      *   **Bratman (Modified):** The shared plan *is* the conditional plan. The accessory has the participatory intention relative to *this* plan ("I intend that we rob, using violence if needed, by my driving and your violence-if-needed"). Their intention "locks on" to the plan including its conditional element.
      *   **Searle:** This fits surprisingly well with irreducible "we-intentions". Each member can have the intention: "We intend [to rob using violence if necessary]". The conditional element is baked into the collective intention itself. Jogee's example *looks* like Searle in action, even if Jogee officially reduces it to individual intent to assist *that* plan.
  *   **Underdetermined/Uncomfortable:** Gilbert's joint commitment also fits ("We are jointly committed to rob, responding with violence if necessary"), requiring mutual obligation, which the law doesn't explicitly demand. Does the law *presuppose* Searlian we-intentions here, or just complex Bratmanian interlocking intentions? The language ("common purpose", "joint enterprise") leans Searle-ward, but Jogee's core reductionism pulls it back. This is the **least confident part** of the reconstruction. The law *uses* the *language and structure* of collective conditional intention while *officially reducing* it to individual states. It's philosophically unstable but functionally effective.
  *   **Confidence:** Medium-Low on the underlying nature. The practice *invites* Searle but *officially adheres* to Bratman/reductionism. The fit is functional, not theoretically pure.

  **3. Withdrawal & the Communication Requirement:**
  *   **Practice:** Mere cessation of physical participation is insufficient. Withdrawal generally requires *communication* of disassociation to the other parties (or sometimes unequivocal acts + reasonable steps to communicate, or neutralising assistance). Silence implies continued participation.
  *   **Presupposition:** Joining the venture creates a kind of *commitment* or *obligation* to the group that persists unless actively *renounced* to the others. Participation is not just concurrent individual action; it has a normative, relational dimension.
  *   **Comfortable Fit:** **Gilbert's Joint Commitment.** Joining creates a joint commitment via mutual agreement (express or tacit). This commitment generates obligations *to the other parties*. One cannot unilaterally extinguish the obligation; it requires *release* from the others, signalled by communication. This explains why "drifting away" isn't enough – the commitment persists until communicated.
  *   **Underdetermined/Uncomfortable:** Bratman's SCA focuses on *intention* and *interdependence*. Withdrawal could be seen as changing one's *intention* and making that manifest to break the interdependence. However, Bratman doesn't inherently require *communication to others*; changing one's own intention and stopping might suffice logically. The law's insistence on communication *to others* strongly suggests a Gilbertian *interpersonal obligation*. Searle's we-intentions don't directly address the normative persistence or dissolution mechanism. Partnership law's agency rules also require notice to third parties to revoke authority, hinting at a similar relational norm.
  *   **Confidence:** High on the Gilbertian flavour. The communication requirement strongly points to a normative commitment *to the others*, not just a change in one's own mind.

  **4. Fresh Departure Limit:**
  *   **Practice:** The accessory is only liable for acts within the scope of the "common purpose". They escape liability for a "fundamental departure" or "new venture" by the principal.
  *   **Presupposition:** The scope of the shared venture defines the boundaries of each participant's *imputed responsibility*. Responsibility is tied to the *agreed-upon (or tacitly accepted) plan*.
  *   **Comfortable Fit:**
      *   **All Theories (Functionally):** Bratman (shared plan/meshing subplans), Searle (we-intend the specific venture), Gilbert (jointly committed to the specific purpose) all provide a conceptual basis for delimiting the scope of shared responsibility by the boundaries of the shared plan/intention/commitment. The act must be part of executing *that* plan.
      *   **Contrast with Vicarious Liability:** This limit is crucial for distinguishing common purpose from true vicarious liability. Vicarious liability has no inherent "scope of employment" limit tied to the *agent's* agreement; common purpose does, reinforcing the "personal" but *relational* basis.
  *   **Underdetermined:** The core idea of a bounded shared plan is central to all major theories. The legal test focuses on foreseeability and type of crime, which is a pragmatic legal gloss, not a direct philosophical commitment.
  *   **Confidence:** High that it's core to the concept of joint action presupposed, medium on which specific theory it best fits (it fits them all functionally here).

  **5. Contrasts with Company Law & Partnership:**
  *   **Company Law (Identification Doctrine):** Requires the individual (directing mind and will) to *be* the company's alter ego for *that act*. It's a strict *attribution* model, not collective action. The company acts *through* the individual. The store manager isn't "acting with" the company; they are an agent whose *non-mind* actions aren't the company's *acts*.
  *   **Partnership Law (Agency):** Based on mutual authority and representation. Each partner *is* the agent of the others *for the business of the partnership*. Liability flows from agency principles and the scope of authority, not necessarily a shared *intention* for the *specific act*.
  *   **Common Purpose Distinction:** Common purpose treats the *group itself* as the unit of action *for the criminal venture* at the moment of the offence. The accessory isn't liable because the principal was *their* agent, nor because the accessory *is* the group. They are liable because *they intentionally participated in the joint criminal action* that resulted in the crime. It presupposes a *sui generis* form of **collaborative intentional action** focused on the *criminal endeavour itself*, distinct from formal agency structures or corporate personification.

  **Synthesis of the Implicit Theory:**
  The doctrine presupposes a **hybrid, legally pragmatic model**:
  1.  **Reductionist Core (Jogee):** Liability *must* derive from the accessory's *individual* intention to assist or encourage the principal's intentional crime(s).
  2.  **Structured Interdependence (Bratman + Gilbert):** The accessory's intention is directed towards participation in a *shared plan* or *common purpose* (Bratman's SCA). Joining this venture creates a *normative, persisting commitment to the other participants* (Gilbert's joint commitment) that explains withdrawal rules and the sense of "being in it together".
  3.  **Functional We-Intentionality (Searle-esque):** Especially regarding conditional intention and the language of "common purpose", the law *functions as if* there is a collective intention ("We are doing this together, including violence if needed"), even while officially reducing it to individual states. It leverages the *phenomenology* of joint action.
  4.  **Bounded Scope:** Responsibility is tied to the agreed-upon (or foreseeable) scope of the shared criminal plan, distinguishing it from vicarious liability.

  **No single theory fits perfectly:** Bratman lacks the normative commitment element; Searle is officially excluded by reductionism; Gilbert requires mutual commitment often absent in ad-hoc criminal groups. The law picks elements useful for its purpose: holding individuals responsible for contributions to group crime.

  **Impact of Rebuilding on a Joint-Commitment (Gilbert) View:**
  *   **Potential Changes:**
      *   **Foresight:** Mere foresight *could* become insufficient even as evidence, unless it demonstrated actual participation in the joint commitment *to the venture including that risk*. Stronger proof of mutual commitment might be needed.
      *   **Joining:** Liability might require clearer evidence of *mutual recognition* of joint commitment, potentially acquitting peripheral figures who foresaw risks but weren't truly "committed" with the core group.
      *   **Withdrawal:** The communication requirement aligns perfectly. However, Gilbert might allow clearer arguments that communication *was* effectively made or that the commitment dissolved through other actions recognised by the group.
      *   **Fresh Departure:** Similar analysis – was the act within the scope of the *jointly committed* purpose?
  *   **Convictions Lost:** Peripheral participants in loosely affiliated groups (e.g., a driver who knew violence was possible but had no sense of mutual commitment with the violent actor) might escape liability more easily. Cases relying *solely* on foresight as evidence without proof of commitment to the violent *aspect* might fail.
  *   **Acquittals Lost:** Someone who silently withdrew but believed (reasonably or unreasonably) they had communicated disassociation might *still* be liable if the joint commitment wasn't properly dissolved (because others didn't receive the communication/release them). Gilbert emphasises the *interpersonal* nature of dissolution.
  *   **Overall:** It might narrow liability slightly for marginal participants but potentially solidify liability for core participants based on the normative bond, making withdrawal slightly harder to prove successfully. The *biggest* change would be philosophical coherence in the withdrawal rule, but practical outcomes might not shift dramatically.

  **Confidence Summary:**
  *   **High Confidence:** Jogee's reductionism; Gilbertian fit for withdrawal; functional reliance on a bounded shared plan.
  *   **Medium Confidence:** Bratman as the best reductionist fit for interlocking intentions post-Jogee.
  *   **Low Confidence:** The precise philosophical status of conditional intention within the doctrine – it *looks* Searlian but *is* officially reduced. This is the most philosophically unstable point.

  The doctrine is a fascinating, messy testament to law grappling with the realities of collective action using tools forged for individual responsibility. It presupposes enough collective structure to hold individuals accountable for group harm, while constantly reassuring itself it hasn't crossed into vicarious liability or group minds. It's philosophically underdetermined, leaning on reductionism but borrowing irreducibly structural features where pragmatism demands it. Your obsession is wholly justified; this is where the rubber of individual culpability meets the road of collective action.
