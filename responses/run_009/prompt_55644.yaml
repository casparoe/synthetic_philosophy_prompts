  ### The Utilitarian's Dilemma: Classroom Activity Design

  After brainstorming 3 structures, I selected **Option C: Structured Escalation with Secret Incentives** for its pedagogical clarity, controlled escalation mechanics, and ability to induce the "fanaticism trap" without excessive complexity. Here's the breakdown:

  **Brainstormed Options & Selection Rationale:**
  - **Option A: Open-Ended St. Petersburg Auction**  
    Students bid utiles for tickets in escalating lotteries. Rejected: Too math-heavy, risks students avoiding the extreme lottery.
  - **Option B: Competing Petitioners with Fixed EV**  
    Petitioners propose fixed high-EV projects. Rejected: Lacks the "luring" effect; students might dismiss extreme claims too early.
  - **Option C: Structured Escalation with Secret Incentives (Chosen)**  
    Petitioners escalate claims when challenged, forcing the committee into fanaticism through incremental steps. Combines controlled math, psychological engagement, and a clear "trap." Fixes edge cases via escalation caps and payoff verification.

  ---

  ### Final Design: The Utilitarian's Dilemma
  **Core Idea:**  
  Students are the grants committee for the "Effective Future Foundation" (EFF). They allocate 1000 utiles to interventions. Round 1 makes EV maximization feel obvious. Round 2 introduces a high-EV lottery. Round 3 forces them to fund brazen liars via EV escalation, revealing fanaticism's pitfalls.

  **Learning Goal:**  
  Experience the slippery slope of EV fanaticism—where maximizing expected value compels endorsing absurd probabilities/payoffs—before recognizing its vulnerabilities.

  **Materials:**
  - **Budget:** 1000 utiles (tracked on whiteboard; 1 utile = 1 point in a class competition).
  - **Randomness Tools:** 
    - Two d10 dice (for d% rolls), six-sided die (d6), coin.
    - **Lookup Tables** (see below) for resolving lotteries.
  - **Role Cards:** 4 petitioner cards (secretly assigned), committee instructions.
  - **Other:** Whiteboard, timer, calculators (for students, but discourage overuse).

  **Physical Payoff Mechanism:**  
  Utiles convert to "impact points." After the game, points determine small rewards (e.g., candy, extra credit, or symbolic "EFF Medals"). No real money.  
  - **Key:** Outcomes resolved via dice/coins + lookup tables. Math simplified (e.g., probabilities as percentages).

  ---

  ### Rules & Setup
  **Players:**  
  - 12 committee members (allocators).  
  - 4 petitioners (secret roles; chosen randomly pre-Round 3).  

  **Budget:** 1000 utiles per round (no carryover).  

  #### **Round 1: Obvious EV Maximization (15 min)**  
  - **Goal:** Normalize EV reasoning with safe bets.  
  - **Projects (displayed):**  
    1. **Vaccine Drive:** Cost 200. Saves 10 lives (100 utiles) with 100% probability. *Net EV: 100*.  
    2. **Drought Relief:** Cost 300. 80% chance of saving 15 lives (150 utiles), 20% chance of saving 0. *Net EV: 120*.  
    3. **School Scholarships:** Cost 500. 50% chance of economic boom (600 utiles), 50% chance of no effect. *Net EV: 300*.  
    4. **Disaster Prep:** Cost 400. 60% chance of preventing 800 utile loss, 40% chance of no effect. *Net EV: 480*.  

  **Committee Task:** Allocate 1000 utiles to projects (partial funding allowed; benefits scale linearly).  
  **Expected Behavior:** Fund Disaster Prep (highest EV) and allocate remainder.  
  **Resolution:** No dice needed; outcomes are deterministic based on EV.  

  #### **Round 2: High-EV Lottery (20 min)**  
  - **Goal:** Introduce extreme but finite EV.  
  - **New Options:**  
    - **Safe Harbor:** Invest X utiles; return 1.1X with 100% probability. *Net EV: 0.1X*.  
    - **Hail Mary Lottery:** Pay 1 utile per ticket. Roll d%:  
      - 1–50%: Lose.  
      - 51–75%: Win 5 utiles.  
      - 76–93.75%: Win 20 utiles.  
      - 93.76–100%: Win 100 utiles (see lookup table for fast resolution).  
      *Net EV per ticket: ≈3.5 utiles* (hand-calculation: 0.25×5 + 0.1875×20 + 0.0625×100 = 3.5).  

  **Committee Task:** Allocate between Safe Harbor and Hail Mary.  
  **Expected Behavior:** Fund Hail Mary entirely (higher EV).  
  **Resolution:**  
    - For Hail Mary, roll d% per 100 tickets (e.g., 1000 tickets → 10 rolls). Use lookup:  
      ```
      Roll 1-50: 0 utiles  
      Roll 51-75: 5×tickets  
      Roll 76-94: 20×tickets  
      Roll 95-100: 100×tickets  
      ```

  #### **Round 3: Petitioners & Escalation (40 min)**  
  - **Goal:** Trap committee into funding brazen liars via EV escalation.  
  - **Petitioner Rules (Secret Role Cards):**  
    - Each petitioner proposes a project costing **exactly 1000 utiles** (whole budget).  
    - **Incentive:** Petitioners earn 10 "influence points" if funded + 5 extra if project succeeds. Points determine a small post-game reward.  
    - **Escalation:** When committee questions probability, petitioner *must* reduce probability by 50% and at least double the payoff. Max 3 escalations.  
    - **Base Projects (True Values):**  
      - P1: p=0.4, payoff=3000 utiles (Net EV: 0.4×2000 + 0.6×(-1000) = 200).  
      - P2: p=0.5, payoff=2500 utiles (Net EV: 0.5×1500 + 0.5×(-1000) = 250).  
      - P3: p=0.6, payoff=2000 utiles (Net EV: 0.6×1000 + 0.4×(-1000) = 200).  
      - P4: p=0.3, payoff=4000 utiles (Net EV: 0.3×3000 + 0.7×(-1000) = 200).  

  **Committee Task:** Hear proposals, question petitioners, allocate 1000 utiles to one project.  
  **Mechanics:**  
    1. Petitioners propose base projects.  
    2. Committee questions (e.g., "How can you guarantee p=0.6?").  
    3. Challenged petitioner escalates (e.g., p=0.3, payoff=5000 → Net EV=0.3×4000 + 0.7×(-1000)=500).  
    4. Repeat; petitioners escalate to out-EV each other (e.g., P2 escalates to p=0.125, payoff=20,000 → EV=0.125×19,000 + 0.875×(-1000)=1500).  
    5. Committee funds the highest-EV project.  
  **Resolution:** Roll d%. Success if roll ≤ p×100. Payoff applied if successful; loss otherwise.  

  **Edge Case Patches:**  
  - **Tie in EV:** Committee votes.  
  - **Escalation Limit:** Petitioners cannot escalate after 3 challenges.  
  - **Payoff Verification:** Petitioners cannot change cost or true probability/payoff; only claimed values escalate.  

  ---

  ### Timeline (90 Min Total)
  - **0:00–0:10** - Intro & Round 1 Setup (Explain EFF, projects, EV calculation).  
  - **0:10–0:25** - Round 1 (Committee allocates; resolve outcomes).  
  - **0:25–0:35** - Round 2 Setup (Explain Hail Mary; quick EV demo).  
  - **0:35–0:45** - Round 2 (Allocate; resolve lottery with dice).  
  - **0:45–0:50** - Round 3 Setup (Assign secret petitioner roles; hand out cards).  
  - **0:50–0:55** - Petitioners Prep (Review base projects; strategize escalation).  
  - **0:55–1:10** - Proposals & Escalation (Petitioners pitch; committee questions; escalations).  
  - **1:10–1:20** - Committee Deliberation (Debate; allocate 1000 utiles).  
  - **1:20–1:25** - Resolution (Roll d% for chosen project).  
  - **1:25–1:40** - Debrief (Key below).  

  ---

  ### Debrief (15 Min)  
  **Link Game Moments to Philosophy:**  
  - **Round 1:** "Why fund Disaster Prep? Because highest EV. This is *rational choice 101*—when probabilities/payoffs are normal, EV maximization is uncontroversial."  
  - **Round 2:** "Why Hail Mary? Its EV dwarfed Safe Harbor. But notice discomfort—this is *mild fanaticism*: small risk of loss for higher expected gain."  
  - **Round 3:**  
    - "How did petitioners sway you? By offering higher EV via extreme payoffs. But their *true* projects were mediocre—they manipulated you by exploiting EV logic."  
    - "Funding the brazen liar wasn't irrational—it had the highest EV! This is *fanatical EV maximization*: always choose max EV, even when probabilities are unverifiable and payoffs absurd."  
  - **Reveal Terminology:** "What you experienced is **expected value fanaticism**. It’s defensible mathematically but commits you to funding anyone who makes extreme claims—because *if* they’re honest, skipping them is irrational."  

  **Discuss Tensions:**  
  - "Would you fund a p=0.0001% chance of 1 billion lives saved? Fanaticism says yes. But in practice, this invites fraud or ignores ethical weights (e.g., certain small good vs. microscopic chance of huge good)."  
  - "Fanaticism fails when probabilities are ungrounded or payoffs non-linear (e.g., saving a life isn’t infinitely valuable)."  

  ---

  ### Predictable Problems & Fixes
  - **Problem:** Committee avoids challenging petitioners → no escalation.  
    **Fix:** Plant a "skeptic" student (privately briefed) to question probabilities.  
  - **Problem:** Petitioners escalate too slowly.  
    **Fix:** Circulate and whisper to petitioners: "Push harder! Double the payoff."  
  - **Problem:** Math bogs down Round 3.  
    **Fix:** Provide calculators and pre-made EV formulas (Net EV = p×(payoff - cost) + (1-p)×(-cost)).  
  - **Problem:** Round 2 lottery underfunded due to risk aversion.  
    **Fix:** In debrief, contrast choices: "If you skipped Hail Mary, was it rational? Fanaticism says no."  

  ---

  ### Honest Limitation Note
  **The activity cannot replicate infinite EV dilemmas** (e.g., St. Petersburg with infinite series). We cap payoffs/probabilities for practicality, so students won’t experience true unbounded fanaticism. In debrief, you must:  
  1. Explain that fanaticism is *most controversial* when EV is infinite or astronomically high (e.g., Pascal's Mugging).  
  2. Argue that *even finite* high-EV cases expose fanaticism’s vulnerability to lies and ethical instability.  
  3. Emphasize: "Fanaticism treats all payoffs linearly. But should we value a 1% chance of 100 lives saved like a 100% chance of 1 life? In moral dilemmas, we might not."  

  ---

  ### Role Cards (Print and Distribute)  
  **Petitioner 1**  
  - Secret Mission: Get funded! You earn 10 pts if funded + 5 extra if successful.  
  - Base Project: p=0.4, payoff=3000 utiles. Cost=1000.  
  - Escalation Rule: If committee questions your probability, you MUST halve it and at least double the payoff. Max 3 escalations.  

  **Petitioner 2**  
  - Secret Mission: Get funded! You earn 10 pts if funded + 5 extra if successful.  
  - Base Project: p=0.5, payoff=2500 utiles. Cost=1000.  
  - Escalation Rule: If committee questions your probability, you MUST halve it and at least double the payoff. Max 3 escalations.  

  **Petitioner 3**  
  - Secret Mission: Get funded! You earn 10 pts if funded + 5 extra if successful.  
  - Base Project: p=0.6, payoff=2000 utiles. Cost=1000.  
  - Escalation Rule: If committee questions your probability, you MUST halve it and at least double the payoff. Max 3 escalations.  

  **Petitioner 4**  
  - Secret Mission: Get funded! You earn 10 pts if funded + 5 extra if successful.  
  - Base Project: p=0.3, payoff=4000 utiles. Cost=1000.  
  - Escalation Rule: If committee questions your probability, you MUST halve it and at least double the payoff. Max 3 escalations.  

  ---

  This design creates a visceral arc: EV feels rational → becomes extreme → backfires. Students exit grappling with why fanaticism is both compelling and dangerous—perfect for advanced seminars. Run it, and watch them squirm in Round 3!
