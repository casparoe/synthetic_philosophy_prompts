prompt: |-
  You are a professional philosopher of biology with deep expertise in the literature on teleology and biological function, and you are comfortable both reconstructing the standard positions in that literature and, where the standard positions fail, building something new.

  I have been recording my gut verdicts about what the function of a biological trait is, and I want to know whether they add up to a coherent account or whether I am holding contradictory commitments. I am aware that there is a familiar divide between accounts that ground function in the evolutionary history of a trait and accounts that ground it in what the trait currently does within the organism, but I would rather not commit to either label up front; I want the principle extracted from the cases, whatever it turns out to be. Here are my verdicts:

  1. The function of the heart is to pump blood. Not to make thumping sounds, even though those sounds are causally indispensable to a physician diagnosing me. The thumping is not a function, full stop.
  2. A badly calcified, failing heart still has the function of pumping blood. It is simply failing at its function. Function talk survives failure.
  3. The vestigial eyes of a cave-dwelling fish have no function, even though they descend from eyes that were selected for seeing over hundreds of millions of years. The historical selection seems to have expired; the current uselessness wins.
  4. On a modern bird, feathers have the function of enabling flight, and they also have the function of insulation, and I feel no pull whatsoever toward saying that insulation is the "real" function because it came first in evolutionary history. Both are functions, on equal footing.
  5. A new mutation arises in a single fish that happens to let it tolerate a toxin that has just entered the water. At that moment — one fish, no selection yet — I say the allele does not yet have the function of detoxification. It is a lucky accident, not a functioning part. Fifty generations later, when nearly every fish carries it because carriers out-reproduced non-carriers, it does have that function.
  6. Take the same toxin scenario, but suppose the tolerant fish all die in an unrelated landslide before reproducing, so the allele never spreads. It seems the function never came into being, even though the allele did exactly the same causal work in its one bearer as it would have fifty generations later.
  7. A genetically engineered pig heart carries a gene for a fluorescent marker, added by the designers so that surgeons can image the heart during a xenotransplant. Just one such heart is ever made; there is no population, no differential reproduction, no selection at all. I still think the fluorescent marker has the function of being visible to surgeons. Design seems to confer function without any selection history.

  Some of these sit together awkwardly, and I can see at least three ways to carve things: maybe function requires a history of selection (which fits 5 and 6), or maybe function requires current useful contribution (which fits 3 and the thumping half of 1), or maybe the history can be either selection or deliberate design (which is what 7 seems to demand). But no single one of these gets everything, and I suspect the truth is either some more complicated disjunctive principle or that one of my verdicts has to go.

  Please begin by thinking carefully through each verdict and what exactly it pressures, before settling on anything: brainstorm freely at first, consider how the standard historical and current-contribution accounts of function would handle each case, and notice where each account has to strain. Then deliver the following:

  - A statement of the best principle (or a small set of candidate principles) that captures my verdicts, stated as precisely as you can, with the specific case that motivates each clause.
  - An honest verdict on whether the principle handles the hardest tension in my set, which I take to be this: verdict 5 seems to say past selection is necessary, verdict 3 seems to say past selection is not sufficient, and verdict 7 seems to say past selection is not necessary at all. If your principle cannot reconcile all three, tell me which verdict you would overturn and why, rather than hiding the cost in a technicality.
  - Your principle's verdicts on at least two cases I have not listed: for instance, a trait that was selected for one job but that has recently come, in this population, to perform a different and more valuable job that selection has not yet had time to act on; and a version of the cave fish whose eyes are not yet vestigial but merely degraded, still detecting a faint bit of light the fish no longer uses for anything.
  - A short statement of what your principle implies about the concept of dysfunction or malfunction, since verdict 2 suggests function talk has a normative edge, and I would like to know whether your account preserves that or explains it away.

  Aim for a rigorous, essayistic answer, not a bulleted summary of the two textbook positions; the value is in the fit between principle and cases, and in your willingness to tell me where my gut has led me astray.
reasoning: |-
  Okay, let me start by really understanding the user's query. They're a philosopher of biology, or at least deeply interested in the topic, focusing on teleology and biological functions. They've provided seven specific cases where they have intuitive judgments about whether a trait has a function, and they want to know if these judgments form a coherent principle or if they're contradictory.

  First, I need to unpack each of their verdicts carefully. Verdict 1 distinguishes the heart's pumping blood from the thumping sound, even though the sound is useful for diagnosis. Verdict 2 says a failing heart still has the function to pump blood. Verdict 3 argues that vestigial eyes in cave fish have no function despite evolutionary history. Verdict 4 states that feathers in birds have both flight and insulation as functions, without prioritizing the historical one. Verdict 5 and 6 deal with a new mutation: initially no function, but after selection, it gains function. Verdict 7 claims that a designed fluorescent marker in a pig heart has a function without any selection history.

  The user mentions three possible approaches: historical selection, current contribution, or a disjunctive principle including design. But none of these cleanly cover all cases. The core tension is between verdicts 3, 5, and 7: past selection is necessary in 5, insufficient in 3, and unnecessary in 7. 

  Looking at standard accounts: The etiological view (based on selection history) struggles with verdicts 3 (vestigial traits) and 7 (design without selection). Cummins-style systemic functions might handle 1 and 7 but fail on 5 and 6 (where function emerges only after selection). The user rejects simple disjunctives, so a more integrated approach is needed.

  The user's intuitions suggest function as a status within a maintenance system. This could unify natural selection and design. For natural traits, function arises when a trait is maintained by selection. In design, it's maintained by intentional engineering. Vestigial traits lose function because they're no longer maintained. The new mutation gains function once maintained by selection. The designed marker is maintained by the designer's intentions. This addresses verdicts 3, 5, and 7 together.

  Testing this principle on new cases: A trait selected for one job but now performing a new, valuable one would still have its original function if maintained by selection, but the new effect isn't a function yet. If the trait is maintained for the new effect, then it gains that function. For the cave fish with slightly degraded eyes, if they still contribute to survival, even minimally, they retain function. If not, they become vestigial.

  Dysfunction is normative: a trait malfunctions when it fails to perform its function, which is defined by what it's maintained to do. So a calcified heart is malfunctioning because it can't pump blood, which is why it's maintained.

  The user's deeper needs: They want coherence in their intuitions, possibly to develop a new account or refine existing ones. They might be seeking validation of their approach or identifying where their judgments need adjustment. They value rigor and honesty about tensions, so addressing the hardest conflicts upfront is crucial. They also care about real-world applications, like dysfunction in medicine or conservation. Highlighting the normative aspect shows understanding of practical implications.
answer: |-
  Your intuitions reveal a sophisticated, maintenance-based account of function that navigates between purely historical and purely systemic approaches. Let's distill the principle by confronting each verdict head-on, exposing tensions, and building upward.

  ### Case-by-Case Analysis & Pressure Points:
  - **Verdict 1 (Heart's Thumping)** rejects *causal contribution alone* as sufficient for function. Pressure: Function requires *privileging* one effect over others.
  - **Verdict 2 (Failing Heart)** shows function is *normative*: a trait can fail its function. Pressure: Function is distinct from current capacity.
  - **Verdict 3 (Vestigial Eyes)** rejects *mere historical selection* as sufficient for current function. Pressure: Function can be *lost* even when history exists.
  - **Verdict 4 (Feathers)** rejects *historical priority* as hierarchically superior to newer functions. Pressure: Multiple functions can coexist without historical ranking.
  - **Verdicts 5 & 6 (Novel Mutation)** show function emerging *only after selection acts*, not at first causal efficacy. Pressure: Function requires a *stabilization process* beyond one-off utility.
  - **Verdict 7 (Engineered Marker)** shows *design* can confer function without selection history. Pressure: Intentional design is a distinct pathway to function.

  Standard accounts strain:
  - **Etiological (e.g., Millikan, Neander):** Fails Verdict 3 (vestigial traits lack function despite history) and Verdict 7 (design without selection).
  - **Systemic (e.g., Cummins):** Fails Verdicts 5 & 6 (novel mutation has causal efficacy but no function pre-selection) and Verdict 2 (function persists despite failure).

  ### The Proposed Principle: **Maintenance-Dependent Function**
  *A trait T in organism O has function F iff:*
  1. **T is causally capable of F** (trivially satisfied in non-malfunctioning cases), *and*
  2. **T’s capacity for F is a *constitutive reason* for T’s current maintenance in O’s biological system.**

  **Constitutive reason**: F explains why T is *present and retained* in the system, whether through:
  - **(a) Natural selection**: F contributed to fitness in O’s ancestors, causing T’s fixation/persistence in the lineage (Verdicts 1, 2, 4, 5).
  - **(b) Intentional design**: F is the goal for which T was included by a designing agent (Verdict 7).  
  - **Corollary for loss of function**: If neither (a) nor (b) sustains T’s presence *because of F*, and F provides no current fitness benefit, T lacks F as a function (Verdict 3).

  ---

  ### Resolving the Core Tension: History vs. Design vs. Vestigiality
  - **Verdict 5 (Selection necessary for new traits)**: Captured by (2a). The mutation gains function only when its effect becomes a *reason for its maintenance* via selection.
  - **Verdict 3 (History insufficient for vestigial traits)**: The eyes are *no longer maintained* for seeing. Historical selection explains their *presence* but not their *current maintenance*; hence no function.
  - **Verdict 7 (Design without selection)**: Captured by (2b). The marker’s visibility is the constitutive reason for its inclusion by designers.  
  **Reconciliation**: Functionality depends on *current* maintenance dynamics. Selection and design are distinct *sources* of maintenance, but both confer function by making F a sustaining cause of T’s presence. Vestigial traits lack maintenance *for F*.

  ---

  ### Verdicts on New Cases
  1. **Trait co-opted for new valuable role (pre-selection)**:  
     - *Case*: A primate’s opposable thumb, historically selected for grasping branches, now enables efficient smartphone use—a novel advantage not yet acted on by selection.  
     - **Verdict**: The thumb retains its *original function* (grasping) because it is maintained by selection for that role. Smartphone manipulation is a *beneficial effect* but not a function: it is not (yet) a constitutive reason for the thumb’s maintenance. If tool use drives selection *for thumb dexterity*, it gains a new function.

  2. **Degraded but not vestigial eyes in cave fish**:  
     - *Case*: Eyes detect faint light, but the fish ignores this input due to evolved blindness in other systems. However, the eyes still impose a metabolic cost.  
     - **Verdict**: If *no selection pressure actively maintains the eyes* for any function (e.g., if residual light detection provides no fitness benefit), they lack a function—even if not fully vestigial. Contrast a fish where faint light detection *still aids orientation*: here, eyes retain the function of light detection because selection maintains them *for this effect* (minimally). The key is whether F contributes to fitness *and* explains persistence.

  ---

  ### Dysfunction & Normativity
  Your principle **preserves the normative edge** of function talk. Dysfunction occurs when:  
  - *T is maintained for F (via selection or design), but*  
  - *T fails to perform F adequately in its current context* (Verdict 2).  

  Normativity derives from the **maintenance standard**: a trait *ought* to perform F because F is the reason it exists in the system. A calcified heart malfunctions because pumping blood is why hearts are maintained by selection; a designer-made fluorescent marker that fails to glow malfunctions relative to the designer’s intent. This grounds medical and engineering judgments of malfunction without appealing to ideal types or statistical norms.

  ---

  ### Cost of Reconciliation: One Revision Suggested
  Your verdicts cohere remarkably well under the maintenance principle. However, **Verdict 4 (feathers’ equal functions)** requires refinement:  
  - Insulation is *a* function (maintained by selection in most birds), and flight is *another* function (maintained by selection in flying birds). But in flightless birds (e.g., ostriches), flight is *not* a current function—only insulation is, as it alone explains feather maintenance. **Revised Verdict**: Functions are equal *when both are actively maintained*; historical order is irrelevant, but *current maintenance* determines the function set.

  ---

  ### Conclusion: A Hybrid Maintenance Account
  Your intuitions point to a **unified teleology of maintained effects**: function arises when a trait’s capacity is *explanatorily responsible for its own persistence* in a system, whether through selective or intentional mechanisms. This avoids the disjunction problem by grounding both pathways in a shared core—maintenance—while explaining dysfunction normatively. The cost is rejecting "zombie functions" (Verdict 3) and demanding that even historical functions require *ongoing* maintenance (Verdict 4 revised). If this fits your considered judgment, you have a robust alternative to textbook etiological and systemic views. If not—if you insist feathers *always* "have flight as a function" even in penguins—we must concede inconsistency and abandon the maintenance requirement for exapted traits. But your other verdicts suggest you won’t.
