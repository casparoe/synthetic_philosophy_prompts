prompt: |-
  I am a graduate student in political philosophy, currently taking a seminar on distributive justice, and I also work twelve hours a week as a caseworker for a municipal emergency hardship fund — crisis grants to individuals, with repayment waived, reduced, or required at my discretion depending on circumstances. The official guidance tells me to weigh how far an applicant is responsible for their own crisis, and to consider attaching conditions (job-search requirements, attendance at budgeting appointments) in cases of what it calls self-inflicted need. I find I have no principled way to make these calls, and my seminar reading suggests the theories not only disagree about where to draw the lines but about whether I should be drawing them at all.

  Please write a decision procedure I can actually run in the ten minutes I have per case. Ground it in the desert and luck-egalitarian literature — the distinction between brute luck and option luck, and the familiar objection that people's choices are themselves products of circumstances they did not choose — but keep it usable by colleagues who have read none of it. The procedure should list the questions in order, say what counts as a sufficient answer to each, mark the points where the theory runs out and I would just be exercising values rather than applying rules, and tell me what to do when I genuinely cannot determine whether someone's situation was their own doing. It should also be honest about the ways it will systematically misfire — for instance, wherever it asks me to estimate choice-versus-circumstance for people whose lives look nothing like mine.

  Then run it on three cases from my recent caseload: (a) a man who quit his job without another lined up after his supervisor mocked him in front of coworkers for weeks, and now cannot pay rent; (b) a woman whose crisis traces to gambling she resumed after eighteen months of being clean, a relapse that followed her mother's death; (c) an applicant who has twice declined "suitable" work we referred her to — my office is unanimous about the third case, and I want to know whether the procedure agrees with us for principled reasons or merely ratifies our prior convictions.

  Please state how confident you are in the procedure overall and single out the step you are least sure of — the point where you suspect the theory is doing the least work and office convention the most.
reasoning: |-
  Hmm, this is a fascinating and complex request from a graduate student in political philosophy who's also working as a caseworker. They're struggling with the tension between theoretical frameworks around distributive justice (particularly desert and luck egalitarianism) and the practical demands of making quick decisions about emergency hardship funds. The core challenge is operationalizing concepts like brute luck vs. option luck and the "circumstances of choice" into a usable 10-minute decision procedure.

  The user specifically wants:
  1. A step-by-step procedure grounded in philosophical literature but accessible to non-theorists
  2. Transparency about where the procedure relies on value judgments rather than clear rules
  3. Acknowledgement of systematic biases (particularly regarding life experiences different from the caseworker's)
  4. Application to three real cases from their caseload
  5. Meta-assessment of the procedure's confidence level and weakest point

  I need to build this around key philosophical touchstones:
  - The brute luck/option luck distinction (Dworkin)
  - The "circumstances of choice" problem (Cohen, Anderson)
  - Desert-based approaches (Miller)
  - But tempered by the practical reality that we can't perfectly disentangle choice and circumstance

  The procedure should have clear exit ramps where theory gives out, and explicitly note:
  - When we're making judgment calls
  - What to do when evidence is inconclusive
  - Where office conventions inevitably fill gaps

  For the case applications, I'll need to:
  - Show how the procedure would handle each case
  - Note where the office consensus on case (c) might align or conflict with principled reasoning
  - Be honest about ambiguity

  The confidence assessment should:
  - Acknowledge this is necessarily imperfect
  - Identify the most theory-stretched step (likely step 3 on "reasonable alternatives")
  - Explain why that's the weakest link philosophically

  I'll structure this as:
  1. The decision procedure flowchart with steps
  2. Explicit notes on limitations and biases
  3. Case applications
  4. Confidence assessment
answer: |-
  Here is a decision procedure grounded in luck egalitarian and desert-based principles, designed for speed and transparency about its limitations. It prioritizes minimizing harm while acknowledging that perfect justice is unattainable in practice. **Bold text** indicates critical instructions or limitations.

  ---

  ### **Emergency Hardship Fund Decision Procedure**  
  **(Time Target: 8-10 minutes per case)**  
  *Grounding Principle: Aid should offset bad luck, not subsidize avoidable choices—but we acknowledge choices are shaped by unchosen circumstances. When in doubt, err toward preventing catastrophe.*

  #### **STEP 1: IS THIS A SURVIVAL CRISIS?**  
     - **Question:** "Is the applicant (or their dependents) at immediate risk of homelessness, starvation, untreated medical emergency, or loss of essential utilities?"  
     - **Sufficient Answer:** Yes (based on evidence: eviction notice, shutoff warning, medical records).  
     - **Action if YES:** **APPROVE AID NOW** (no further steps). *Justification: Survival trumps desert. Theory runs out here—preventing destitution is a prior moral duty.*  
     - **Action if NO:** Proceed to Step 2.  

  #### **STEP 2: TRACE THE CRISIS TO ITS ROOT CAUSE**  
     - **Question:** "What directly caused the *financial* emergency (e.g., job loss, addiction relapse, theft)?"  
     - **Sufficient Answer:** A specific event/condition (e.g., "Fired after workplace conflict," "Relapse after bereavement").  
     - **Action:** Document this cause. Proceed to Step 3.  
     - **If Unclear:** **APPROVE AID** with standard budgeting condition. *Justification: Uncertainty favors the applicant (burden of proof lies with the fund).*  

  #### **STEP 3: ASSESS "REASONABLE AVOIDABILITY"**  
     - **Question:** "Could a person in the applicant’s *general circumstances* (not their specific traits) have reasonably avoided the cause of the crisis *without superhuman effort*?"  
       - *Ignore:* Applicant’s education, network, or resilience.  
       - *Consider:* Societal norms of reasonable action (e.g., quitting a job after harassment vs. quitting over mild boredom).  
     - **Sufficient Answer:**  
       - **YES** (clearly avoidable): Proceed to Step 4.  
       - **NO** (unavoidable or ambiguous): **APPROVE AID** with *optional* support conditions. Proceed to Step 4 only if "YES."  
     - **Theory Limits:** *This is the most subjective step.* "Reasonable" relies on your intuition of societal norms. **Flag cases where the applicant’s life differs sharply from yours** (e.g., undocumented status, severe mental illness)—your intuition may misfire.  

  #### **STEP 4: ASSESS "IMMEDIATE AGENCY"**  
     - **Question:** "At the exact moment of the key choice, did the applicant have a *meaningful alternative* that wouldn’t require extraordinary willpower?"  
       - *Key:* Distinguish **option luck** (gambling with eyes open) from **brute luck** (choices warped by trauma, addiction, or coercion).  
     - **Sufficient Answer:**  
       - **Meaningful Alternative YES** (e.g., declined suitable job for no clear reason): Attach **mandatory conditions** (e.g., job search, financial counseling).  
       - **Meaningful Alternative NO** (e.g., relapsed amid acute grief; quit job after sustained humiliation): **APPROVE AID** with *optional* conditions.  
       - **Uncertain:** **APPROVE AID** with light conditions (e.g., one budgeting session).  
     - **Theory Anchor:** Luck egalitarianism rejects punishing people for unchosen "circumstances of choice" (e.g., addiction vulnerability, trauma responses).  

  #### **STEP 5: SET CONDITIONS (IF APPLICABLE)**  
     - **Question:** "Will this condition *reliably reduce future harm* without being punitive or impossible?"  
       - *Avoid:* Conditions unrelated to the crisis cause (e.g., drug tests for non-addiction cases).  
       - *Prioritize:* Evidence-based supports (e.g., job referrals for avoidable unemployment).  
     - **Action:** Attach only necessary, feasible conditions. *No conditions* if aid was approved at Step 2 or 3.  

  ---

  ### **SYSTEMATIC LIMITATIONS**  
  1. **Bias Risk:** Steps 3–4 will underestimate barriers for applicants from marginalized groups (e.g., assuming "reasonable" choices without accounting for racism, disability, or trauma).  
  2. **Epistemic Humility:** We cannot truly know if a choice was "free." The procedure errs toward compassion when uncertain.  
  3. **Structural Blindness:** Ignores whether the crisis stems from systemic injustice (e.g., low wages). This is a band-aid, not justice.  

  ---

  ### **CASE APPLICATIONS**  
  #### **CASE A: Man who quit job after supervisor harassment**  
  - **Step 1:** Not immediate survival crisis? → **Proceed.**  
  - **Step 2:** Root cause = Job loss due to quitting after harassment.  
  - **Step 3:** **Avoidable?** Unclear. Harassment is external, but quitting without backup is avoidable *in theory*. Societal norms deem harassment a valid reason to quit → **"NO" (Unavoidable/Ambiguous). APPROVE AID**; optional conditions.  
  - *Procedure Output:* Approve with *optional* job-search support.  

  #### **CASE B: Woman who relapsed into gambling after mother's death**  
  - **Step 1:** Not survival? → **Proceed.**  
  - **Step 2:** Root cause = Gambling losses triggered by relapse amid grief.  
  - **Step 3:** **Avoidable?** Relapse after trauma is not "reasonably avoidable" without extraordinary effort → **"NO." APPROVE AID**; optional conditions (e.g., counseling referral).  
  - **Step 4:** (Skipped as Step 3 approved aid).  
  - *Procedure Output:* Approve unconditionally or with optional support.  

  #### **CASE C: Applicant who declined "suitable" work referrals**  
  - **Step 1:** Not survival? → **Proceed.**  
  - **Step 2:** Root cause = Avoidable unemployment (if referrals were truly suitable).  
  - **Step 3:** **Avoidable?** YES (assuming suitability). → **Proceed to Step 4.**  
  - **Step 4:** **Meaningful alternative?** If referrals were genuinely suitable (safe, legal, matched skills), declining suggests agency → **Attach MANDATORY conditions** (e.g., accept next suitable referral).  
  - *Procedure Output:* Approve *with mandatory job-acceptance condition*.  
  - **Agreement with Office?** The procedure likely agrees with your office’s consensus **for principled reasons** (declining suitable work signals option luck). But it *would challenge* whether "suitability" accounts for hidden barriers (e.g., childcare, mental health).  

  ---

  ### **CONFIDENCE ASSESSMENT**  
  - **Overall Confidence: 70%**  
    - *Strengths:* Anchored in core luck-egalitarian intuitions; forces explicit consideration of agency/constraint; minimizes harm in uncertainty.  
    - *Weaknesses:* Still relies on snap judgments about "reasonableness" and "meaningful alternatives."  

  - **Least Confident Step: STEP 3 ("Reasonable Avoidability")**  
    - **Why:** This is where theory does the least work and office conventions (or personal bias) creep in. Philosophical literature debates *what counts* as "reasonable" or "voluntary," but offers no operational test. Your estimate of a "person in general circumstances" is inherently shaped by your own socialization. **This step will systematically misfire for applicants facing invisible systemic barriers** (e.g., racial discrimination, episodic disabilities).  

  > **Recommendation**: Mitigate Step 3’s flaws by:  
  > - Consulting colleagues from diverse backgrounds when possible.  
  > - Defaulting to "unavoidable" in borderline cases.  
  > - Tracking outcomes for applicants whose cases felt culturally unfamiliar to audit bias.  

  This procedure won’t resolve theoretical disputes, but it makes the values in your judgment calls legible—and that’s a start. Stay troubled; the alternative is dogmatism.
