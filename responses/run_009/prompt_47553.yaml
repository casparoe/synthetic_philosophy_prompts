  I'm writing an essay on the question of whether brain size and cognitive capacity are morally relevant: whether beings with greater cognitive sophistication warrant greater moral consideration, or whether such differences are as morally arbitrary as height or eye color. I want to build the essay around Daniel Keyes's Flowers for Algernon. Read the story through that debate. Charlie Gordon is patronized and mocked at an IQ of 68, admired and resented at genius level, then pitied and abandoned as he regresses — the other characters' regard for him tracks his intelligence almost exactly, while the story itself insists he is the same person throughout. Does the story dramatize the view that moral status comes in degrees fixed by cognitive capacity, or does it expose that view as a prejudice the reader is made to share? Pay particular attention to the scientists Nemur and Strauss, who treat pre-operation Charlie as a laboratory animal rather than a person, and to the fact that the entire narrative consists of Charlie's own progress reports — does the first-person form itself commit the story to a claim about what he is owed? Also tell me where the story resists a clean reading, and what it adds to the philosophical debate that the arguments by themselves do not. Please keep your response to 500 words or fewer.
