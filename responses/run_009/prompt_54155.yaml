  ### Scenario
  In a small garden, two observers, Alice and Bob, monitor three states: \(P\) (a rare bird is at the feeder), \(Q\) (the feeder is full), and \(R\) (either \(P\) or \(Q\) is true). Time has three discrete moments: \(t_1\), \(t_2\), and \(t_3\). At \(t_1\), \(P\) is true (bird present), \(Q\) and \(R\) false; at \(t_2\), \(Q\) is true (feeder full), \(P\) and \(R\) false; at \(t_3\), all are false. Each observer can perform one action per moment: check \(P\), \(Q\), or \(R\), or ask the other about their knowledge of a state. Checking a state reveals its current truth value; asking forces the other to check it immediately if they haven’t, potentially altering knowledge. At \(t_1\), if neither checks \(P\) (e.g., Alice checks \(R\), Bob checks \(Q\)), \(P\) is true but unknown, making the proposition \(\psi\): “\(P \land \neg K P\)” (where \(K P\) means \(P\) is known by someone) true at \(t_1\). However, verifying \(\psi\) requires confirming both conjuncts simultaneously at \(t_1\). If Alice tries to know \(\psi\), she might check \(P\) (learning \(P\), falsifying \(\neg K P\)) or ask Bob about \(P\) (prompting Bob to check \(P\), making \(K P\) true). Either action falsifies \(\psi\) during verification. At \(t_2\) or \(t_3\), \(P\) is false, so \(\psi\) cannot hold retroactively. Thus, \(\psi\) is a *truth* at \(t_1\) but *unknowable* at any time.

  ### Derivation Step by Step
  1. **Assume \(\psi\) is true at \(t_1\)**: \(P \land \neg K P\) holds (bird present, unknown).
  2. **Knowability principle**: If \(\psi\) is true, some knower can know it at some time.
  3. **Attempt to know \(\psi\) at \(t_1\)**:
     - To know \(\psi\), a knower (say, Alice) must know both conjuncts: \(P\) and \(\neg K P\).
     - Knowing \(P\) requires checking \(P\), but then Alice knows \(P\), so \(K P\) becomes true, falsifying \(\neg K P\).
     - Knowing \(\neg K P\) (i.e., no one knows \(P\)) requires confirming Bob’s ignorance. If Alice asks Bob about \(P\), Bob checks \(P\), learns it, making \(K P\) true and falsifying \(\neg K P\).
     - Any action to verify one conjunct falsifies the other, making \(\psi\) false during verification. Contradiction.
  4. **Later times (\(t_2\) or \(t_3\))**:
     - \(\psi\) is false because \(P\) is false. Knowing \(\psi\) (about \(t_1\)) would require verifying \(P\)’s truth at \(t_1\), but no check at \(t_1\) recorded it, and later checks cannot access past unobserved states. Alice and Bob cannot retroactively confirm \(P\) at \(t_1\) without \(t_1\)-actions, which would have falsified \(\psi\).
  5. **Conclusion**: \(\psi\) cannot be known at any time, contradicting the knowability principle. The critical step is **3**, where the *act of verification* at \(t_1\) alters the world, falsifying \(\psi\) itself. The unknowability arises from the observers' limitations: they can only interact with present states, and their inquiries force immediate checks, disrupting the truth.

  ### Rescuing the Principle: Costs and Trade-offs
  - **Dummett-style move (index knowability to the time the truth holds)**:  
    Rescue: Require \(\psi\) to be knowable *at \(t_1\)* (when it holds).  
    Cost: In this world, \(\psi\) is *still unknowable* at \(t_1\) (as step 3 shows). The principle fails anyway, as no action at \(t_1\) can know \(\psi\) without destroying it. This move highlights the tension but doesn’t resolve it—it reinforces the paradox by demanding knowability under impossible conditions.

  - **Tennant-style restriction (only "Cartesian" truths are knowable)**:  
    Rescue: Exempt \(\psi\) from the principle since it’s "non-Cartesian" (knowing it entails a contradiction: \(K \psi \implies K(P \land \neg K P)\), but \(K P\) contradicts \(\neg K P\)).  
    Cost: The principle is saved, but it no longer covers all truths. In this world, \(\psi\) is a genuine counterexample to unrestricted knowability. However, other Cartesian truths (e.g., \(Q\) at \(t_2\)) remain knowable via ordinary checks. The trade-off is accepting that some truths (like \(\psi\)) are intrinsically unknowable due to self-falsification, narrowing the scope of anti-realism.

  **Pulling in different directions**:  
  Dummett’s move ties knowability to the truth’s temporal index but *fails* here because \(\psi\)’s verification at \(t_1\) is self-defeating. Tennant’s move exempts \(\psi\) but *succeeds* by restricting the principle to "safer" propositions. In this world, Dummett’s indexing offers no rescue (it makes \(\psi\)’s knowability *more* implausible), while Tennant’s restriction salvages the principle by excluding the Fitch proposition, at the cost of limiting its universality. The observers’ limitations—forcing present actions that change knowledge states—make Tennant’s approach the only viable rescue, but it concedes that not all truths are knowable.
