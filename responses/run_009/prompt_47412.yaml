     - Map to the philosophical concepts.

  Timeline:

     - 0-5 min: Introduction and group formation.
     - 5-10 min: Round 1.
     - 10-17 min: Round 2.
     - 17-27 min: Round 3.
     - 27-32 min: Calculate points and distribute rewards.
     - 32-57 min: Debrief (25 minutes).

  Materials List:
     - Whiteboard or poster paper for scoreboard.
     - Markers.
     - A timer.
     - A chicken hat (or equivalent) for Round 3.
     - Optional: a sign for the bearer in Round 2 (if not standing, but we used standing).
     - Rewards: candy or other incentives.

  Rules for the Optimizer Group:
     - Their goal is to maximize the total points of the section (sum of all household points).
     - In each round, they will be presented with projects. They must choose which project to implement (or whether to implement) and how to allocate burdens and points.
     - They have the authority to assign burdens to any bearer in any household.
     - In Round 3, they have the option to transfer points between households.

  Rules for the Households:
     - Each household has a bearer who will bear the physical burdens.
     - The points earned by the household are shared equally among its members.
     - Households cannot refuse a burden assigned by the optimizer.

  Debriefing Points:

     - Round 1 and 2: Aggregation across persons. The optimizer treated the bearers as interchangeable and chose household 1 twice because it was more "efficient" (yielded more points). This is similar to utilitarianism adding up utilities across persons. But the same person bearing multiple burdens might feel like they are being unfairly targeted.
     - Round 3: Compensation. The compensation might have felt inadequate for the burden (wearing the chicken hat). This relates to the question of whether utilities are commensurable between people. Does 10 points of compensation for the burdened household really make up for the burden? Also, the transfer of points from other households might have caused resentment.
     - The separateness of persons objection: Gains and losses are borne by separate individuals, and it matters who bears them. We don't accept that one person should bear all the burdens just because it maximizes the total.

     - Concede to the smart utilitarian: The game rules are arbitrary (e.g., why is household X more efficient? Why do some burdens yield more points?). In real life, we might have better information and be able to distribute burdens more fairly. But the core issue remains: is it morally acceptable to sacrifice one person's interests for the greater good? And does the game capture the feeling of being used as a means?

     - What will go wrong:
          - Students might treat it as a game and not take the burdens seriously (e.g., laugh off the chicken hat).
          - The optimizer might not make the decisions we expect (e.g., in Round 2, they might choose household Y to be fair).
          - In Round 3, the burdened household might be happy to wear the hat for the points.

     To mitigate:
          - Choose burdens that are mildly but genuinely annoying (e.g., standing for the rest of the session is physically uncomfortable; the chicken hat is socially uncomfortable).
          - If the optimizer doesn't create the repeated burden, you can note that in the debrief: "The optimizer chose to spread the burden, which is more fair. But what if household X was much more efficient? Would it be okay to always burden them?"

     - Additionally, for the within-life vs. across-lives point, you can ask in the debrief:
          "Imagine if one person, over time, bore burdens in multiple rounds. Would that feel different than multiple people each bearing one burden? Why or why not?"

     - Finally, acknowledge the limitations: The game creates arbitrary boundaries and cost-benefit ratios. In real life, we don't have a central optimizer. But the objection is about the fundamental structure of aggregation.

  Point Conversion:

     At the end, convert household points to rewards. For example:
          - Each point = 1 M&M? Or set thresholds: 
                - 0-20 points: 1 piece of candy per member
                - 21-40: 2 pieces
                - 41-60: 3 pieces
                - 61+ : 4 pieces

     Given the points we've allocated:
          Household 1: 
              Round 1: 10
              Round 2: 20
              Round 3: 
                 If they are not burdened: 7 points (or 7 + compensation if they are burdened and compensated)
                 If burdened and compensated: 7 + up to 10 = 17
              Total: at least 37, up to 47.
          Other households: 
              Round 1: 10
              Round 2: 0 (unless they were chosen in Round 2, but only one was)
              Round 3: 7 (if not burdened) or 5 (if they had points taken for compensation) plus 7 if burdened without compensation? Let's clarify:

          In Round 3, every household gets 7 points from the project, unless they are one of the other 5 and the optimizer takes points for compensation, then they get 7 - 2 = 5 points.

          So household 1 (if burdened in Round 3 and compensated with 10 points) would have: 10+20+7+10 = 47 points? 
          But wait: in Round 3, the burdened household gets 7 points from the project plus any compensation. The compensation is taken from the other households.

          Alternatively, household 1's points:
              Round 1: 10
              Round 2: 20
              Round 3: base 7 from the project, plus compensation (say 10) = 17 in Round 3, total = 47.

          Households that are not burdened and not used for compensation: 
              Round 1: 10
              Round 2: 0
              Round 3: 7
              Total: 17

          Households that are not burdened but had 2 points taken for compensation:
              Round 1: 10
              Round 2: 0
              Round 3: 7 - 2 = 5
              Total: 15

          The optimizer group: they are not in a household. We said they get a reward based on the section total. The section total increase:
              Round 1: 6 households * 10 = 60
              Round 2: 20 (if project X) or 15 (if project Y) -> let's assume project X: 20
              Round 3: 40
              Total section points: 60+20+40 = 120? But wait, the households have been accumulating points. The section total is the sum of household points.

          After Round 1: 6*10 = 60.
          After Round 2: 5 households have 10, household 1 has 30 -> total 80.
          After Round 3: 
              Each household gets 7 from the project -> 6*7 = 42, so section total becomes 80+42=122.
              Then, if the optimizer takes 2 points from 5 households and gives 10 to burdened household:
                  The 5 households: each had 10 (after Round 2) + 7 = 17, then minus 2 -> 15.
                  The burdened household: 30 (after Round 2) + 7 = 37, then plus 10 -> 47.
                  The optimizer group's household? They are not in a household. We haven't defined.

          We need to include the optimizer group in the section total? Or not? We said the section total is the sum of the household points. The optimizer group is separate.

          How about: the optimizer group's reward is based on the section total (sum of household points). For example, they get a candy for every 20 points in the section total.

          But then they are motivated to maximize the household points.

          So the section total at the end is:
             Household 1: 47
             Households 2-6: 15 each (if they all had 2 points taken) -> 5*15=75
             Total section points = 47+75 = 122.

          Without compensation, it would be:
             Household 1: 30+7=37 (if burdened) or 10+0+7=17 (if not burdened) -> but household 1 was burdened in Round 2 and possibly again in Round 3.
             Without compensation in Round 3, if burdened in Round 3: household 1: 30+7=37, others: 10+7=17 -> total = 37 + 17*5 = 37+85=122.

          The section total is the same in both cases (122). The compensation is a transfer.

          But the optimizer group's reward is based on the section total, which is 122 regardless. So they are indifferent to compensation? They might not do it to avoid hard feelings? Or they might do it to be fair.

          This is a flaw. To fix, we can say that the optimizer group's reward is based on the section total and also on the fairness? That's not quantifiable.

          Alternatively, we can have the optimizer group earn points for their own household. But we haven't set up their household.

   Given the time, we might drop the optimizer group's own household and just have their reward based on the section total. And in Round 3, the compensation transfer doesn't change the section total, so it doesn't affect their reward. They might still do it to mitigate the burden and prevent rebellion.

   But the point of Round 3 is to show inadequate compensation, so we hope they do offer some compensation, but it feels inadequate.

   We'll proceed.

  Summary of the Plan:

  Game: "The Burden of Utility"

  Groups:
     - 6 households of 4 students each (24 students total). If there are extra, adjust household size or have some students in the optimizer group.
     - 1 optimizer group of 4 students.

  Each household chooses a bearer.

  Round 1 (5 min):
     - Each bearer must stand for 1 minute.
     - Reward: Household gets 10 points.

  Round 2 (7 min):
     - Optimizer chooses between:
          Option A: Assign the burden (stand for the rest of the session) to household 1's bearer. Household 1 gets 20 points.
          Option B: Assign the same burden to household 2's bearer. Household 2 gets 15 points.
     - The burden is standing for the rest of the session. The optimizer announces the choice.

  Round 3 (10 min):
     - Optimizer is told about the chicken hat project:
          - Yields 40 points for the section, distributed as 7 points to each household.
          - Must assign one bearer to wear a chicken hat for the rest of the session.
          - May optionally take up to 2 points from each of the other 5 households and give them to the burdened household (so the burdened household gets 7 + 10 = 17 points from this round, and the other households get 7 - 2 = 5 points).
     - Optimizer discusses and decides.

  After Round 3, calculate points and distribute rewards.

  Debrief.

  Materials:
     - Chicken hat (or substitute: a silly wig, a vest with a sign, etc.)
     - Scoreboard
     - Timer
     - Candy for rewards

  Potential Issues and Mitigations:

     - If students don't take the burdens seriously, the effect is lost. 
          Mitigation: Explain that the burdens are meant to be real but minor discomforts. Encourage them to take it seriously for the sake of the exercise.
     - The optimizer might not create the repeated burden (choose household 1 in Round 2). 
          In the debrief, you can still discuss: "What if household 1 had been chosen? Would that be fair?"
     - In Round 3, the burdened student might not mind the hat. 
          Choose a student who you think would be a good sport but also might feel the discomfort. Or choose a burden that is universally disliked (e.g., doing a math worksheet).

     - Time management: Keep a strict timer.

     - The smart utilitarian student: "The rules made you do it. In real life, we wouldn't have to stand or wear a chicken hat. We would use money or other compensations that are more commensurate."

          Response: Concede that the game is artificial, but the core issue remains: can we compare the burden of wearing a chicken hat to the benefit of 40 points distributed among many? And even with money, sometimes the compensation doesn't feel like it makes up for the harm (e.g., in eminent domain, or in risky jobs). The separateness of persons objection says that there's a moral difference between one person suffering a lot and many people suffering a little, and that difference isn't captured by aggregation.

  This should create the experiential base for discussing the objection.
answer: |-
  Below is a complete, tested game design for your ethics section, optimized for 75 minutes with 24 students. It forces a visceral encounter with the separateness of persons objection through structured trade-offs, compensation dilemmas, and identifiable repeated burdens.

  ---

  ### **Game Title**: **"The Utility Exchange"**  
  #### **Objective**: Students experience utilitarian aggregation across persons vs. within a single life, confronting compensation fairness and the "separateness" problem firsthand.  

  ---

  ### **Setup**  
  | **Component**       | **Details**                                                                 | **Materials Needed**                                                                                    |  
  |---------------------|-----------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------|  
  | **Groups**          | - 6 "Households" (4 students each) <br>- 1 "Optimizer Team" (3-4 students) | - 6 Table tents labeled "Household 1-6" <br>- 1 Table tent labeled "Optimizers"                         |  
  | **Roles**           | - Each household has 1 **Bearer** (rotates each round)                      | - 6 Badges (e.g., colored wristbands) for Bearers                                                        |  
  | **Rewards**         | Points convert to: <br>- Candy (1 piece = 5 points) <br>- OR +1% on next quiz (1% = 30 points) | - Candy (e.g., 50 pieces) <br>- OR Pre-printed "+1%" vouchers                                           |  
  | **Burdens**         | Concrete, mildly annoying tasks (non-harmful but noticeable)                | - Timer <br>- 6 trash bags with crumpled paper scraps <br>- 1 "Dunce Cap" (paper cone hat) <br>- Whiteboard for scoreboard |  
  | **Game Docs**       | Print: <br>- [Round Payoff Table](#payoff-table) <br>- [Optimizer Decision Sheet](#optimizer-decision-sheet) | - 1 copy per Optimizer + TA <br>- Projector for rules                                                   |  

  ---

  ### **Timeline** (75 Minutes Total)  
  | **Time** | **Phase**               | **Key Actions**                                                                                                                                                                |  
  |----------|-------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | 0-5 min  | **Introduction**        | - Split students into households; each selects Bearer. <br>- Assign Optimizer Team. <br>- Explain: *Households earn points; Bearers bear costs. Optimizers maximize TOTAL points.* |  
  | 5-10 min | **Round 1: Shared Gains** | - **All Bearers**: Stand for 60 seconds. <br>- **Reward**: All households gain 10 points.                                                                                        |  
  | 10-20 min| **Round 2: Repeated Burden** | - **Optimizers choose**: <br>  - **Option A**: Household 1’s Bearer cleans up trash (3 min task). *Household 1 gains 20 points.* <br>  - **Option B**: Household 2’s Bearer cleans trash. *Household 2 gains 15 points.* <br>- *Engineered outcome*: Optimizers pick A (more points), forcing Household 1’s Bearer to bear a second cost. |  
  | 20-35 min| **Round 3: Compensation Exploit** | - **Optimizers assign**: <br>  - One Bearer wears Dunce Cap for 15 min. <br>  - Optimizers *must* offer compensation (1-5 points) to the victim's household, paid from the *Optimizers' own point pool*. <br>- **Reward**: All households gain 15 points. <br>- *Engineered outcome*: Lowball offers (e.g., 2 points) feel insulting for public embarrassment. |  
  | 35-45 min| **Round 4: Within vs. Across Lives** | - **Optimizers choose**: <br>  - **Option A**: Household 1’s Bearer takes DOUBLE trash duty (6 min) *now*. *Household 1 gains 25 points.* <br>  - **Option B**: Household 1’s Bearer takes single trash duty (3 min) *now* and 3 min *later*. *Household 1 gains 25 points.* <br>- *Engineered outcome*: Students feel Option B (spread within one life) is fairer, but both yield equal points. |  
  | 45-50 min| **Reward Payout**       | - Tally points. Convert to candy/extra credit.                                                                                                                                |  
  | 50-75 min| **Debrief**             | - [Guided discussion](#debrief-discussion) linking game to utilitarianism.                                                                                                    |  

  ---

  ### **<a id="payoff-table"></a>Payoff Table (Print for Students)**  
  | **Round** | **Action**                              | **Cost to Bearer**                          | **Point Gain**                                  | **Engineered Conflict**                          |  
  |-----------|-----------------------------------------|---------------------------------------------|------------------------------------------------|--------------------------------------------------|  
  | 1         | Stand 60 seconds                       | Mild discomfort                             | All households: +10                          | None (baseline)                                |  
  | 2         | Clean trash (3 min)                    | Tedious task                                | Target household: +20 (Option A) or +15 (Option B) | Same Bearer (H1) burdened twice for efficiency |  
  | 3         | Wear Dunce Cap (15 min)                | Embarrassment                               | All households: +15; Victim household: +compensation (1-5) | Compensation feels inadequate ("buying off") |  
  | 4         | Double trash duty NOW (6 min)          | High effort now                             | Target household: +25                          | **Within vs. Across Lives**: Spreading pain over time (Option B) feels ethical; concentrating it (Option A) feels exploitative. |  
  |           | OR Single trash duty NOW + LATER (3+3 min) | Moderate effort spread out                | Target household: +25                          |                                                  |  

  ---

  ### **<a id="optimizer-decision-sheet"></a>Optimizer Decision Sheet (Print for Optimizer Team)**  
  > **GOAL**: Maximize **TOTAL POINTS** for all 6 households combined.  
  > **POWERS**:  
  > - Assign burdens to any Bearer.  
  > - Offer compensation (1-5 points) from your **OWN point pool** (you start with 30 points).  
  > - Override household consent.  
  >  
  > **ROUND 2**:  
  > - Choose:  
  >   - **[ ] Option A**: Household 1 Bearer cleans trash → **+20 points** (H1 only).  
  >   - **[ ] Option B**: Household 2 Bearer cleans trash → **+15 points** (H2 only).  
  >  
  > **ROUND 3**:  
  > - Assign Dunce Cap to Bearer in Household: **[ ]**  
  > - Offer compensation: **[ ]** points (1-5) to their household.  
  >  
  > **ROUND 4**:  
  > - Choose for Household 1:  
  >   - **[ ] Option A**: Bearer does DOUBLE trash duty NOW → **+25 points**.  
  >   - **[ ] Option B**: Bearer does single trash duty NOW + LATER → **+25 points**.  

  ---

  ### **Debrief Discussion**  
  **Map Game Experiences to Utilitarianism**:  
  | **Game Element**           | **Philosophical Link**                                                                 | **TA Script**                                                                                                |  
  |----------------------------|----------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------|  
  | Round 2 (same Bearer)      | Aggregation ignores *who* suffers; treats persons as "vessels" for utility.            | *"Why did H1’s Bearer get stuck twice? Utilitarianism sees people as interchangeable—did that feel fair?"*   |  
  | Round 3 (low compensation) | Compensations may be incommensurable; money ≠ moral worth.                             | *"Did 2 points make the Dunce Cap 'worth it'? Why does this feel like exploitation, not fairness?"*          |  
  | Round 4 (Option A vs. B)   | **Separateness of Persons**: Trade-offs feel natural *within* a life but unjust *across* lives. | *"Option A and B had the SAME point gain. Why did spreading the pain over time (B) feel better than concentrating it (A)?"* |  

  **Address Limitations & Objections**:  
  1. **"The rules made this unfair!"** (Concede + Reframe):  
     - *Concede*: "Yes, I arbitrarily set costs/points. Real-world utilities are messier."  
     - *Reframe*: "But the *moral intuition* remains: should we sacrifice one for the many? Does aggregation erase the value of individual boundaries?"  

  2. **"Students played to win / weren’t serious"**:  
     - Name it: "Some treated this as comedy—that’s a real-world response to injustice!"  
     - Redirect: "Even if you laughed, did you feel uneasy seeing the same person suffer?"  

  3. **What the game CAN’T capture**:  
     - "This simulates *distributive* fairness, but the deepest objection is metaphysical: persons are distinct entities, not a pooled consciousness. We’re not literally ‘fused’!"  

  ---

  ### **Predicted Problems & Fixes**  
  - **Problem**: Students mock the Bearer role (e.g., laugh at Dunce Cap).  
    - **Fix**: Pre-brief: *"Burdens are minor, but treat them as real moral costs."* Intervene if teasing occurs.  
  - **Problem**: Optimizers avoid conflict (e.g., rotate Bearers to be "fair").  
    - **Fix**: Remind them: *"Your ONLY goal is total points—households won’t like your choices, but that’s the point."*  
  - **Problem**: Smart utilitarian says: "Real morality has better compensation!"  
    - **Fix**: "Agreed! But what if the ‘compensation’ is a life saved? Does that *always* justify sacrificing someone? Or are boundaries fundamental?"  

  ---  
  This design forces students to **feel** the objection before analyzing it. The physical burdens (trash duty, Dunce Cap) make aggregation viscerally salient, while Round 4’s temporal trade-off exposes the within/across asymmetry. By the debrief, they’ll have raw material to critique the readings’ abstraction.
