  First, I need to recall the key positions. Memetics, championed by Dawkins, Dennett, and Blackmore, emphasized discrete replicators (memes) undergoing Darwinian selection. Critics like Sperber argued for reconstruction over copying, seeing cultural transmission as epidemiological. Boyd and Richerson took a pragmatic approach with population models, bypassing the replicator debate.

