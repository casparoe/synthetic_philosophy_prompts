answer: |-
  Here's a sharp diagnosis of the memetics dispute, cutting through the noise to the core issues:

  **Diagnosis: It was a substantive but ultimately *resolved* dispute about the *necessary conditions for cumulative cultural evolution*, where the memeticists' core mechanism (high-fidelity replicator copying) was shown to be largely unnecessary.** The field didn't "stall"; it evolved past the need for the strict memetic replicator concept. The fight dissolved because the replicator-centric view lost its explanatory necessity, not because someone formally conceded.

  **Breaking Down the Substance (What Each Side Claimed & Denied):**

  1.  **The Memeticists' Core Claim (and What They Denied):**
      *   **Claim:** For culture to exhibit cumulative, adaptive, Darwinian evolution *like biology*, it **requires** discrete, high-fidelity replicators ("memes") that are copied with sufficient fidelity to allow selection to act upon variations *over many generations*. Without this, you get Lamarckian change or drift, not genuine Darwinian evolution building complex adaptations.
      *   **Denied:** That significant cultural evolution can occur primarily through processes of reconstruction, biased transformation, or guided variation where the "copying" fidelity is too low to preserve selectable variation reliably over chains of transmission. They saw this as undermining the Darwinian engine.

  2.  **Sperber's Core Claim (and What He Denied):**
      *   **Claim:** Human cultural transmission is fundamentally **epidemiological and inferential**, not replicative. Ideas ("representations") are rarely copied verbatim; they are *reconstructed* by individuals based on input, cognitive biases, prior knowledge, and context. Fidelity is generally low, and stability arises from shared cognitive attractors, not faithful replication.
      *   **Denied:** That high-fidelity copying of discrete units is the *primary* or *necessary* mechanism for cultural stability or change. He argued memetics fundamentally misdescribed the psychology of cultural transmission.

  3.  **Boyd & Richerson's Core Claim (and What They Sidestepped/Denied):**
      *   **Claim:** Cumulative cultural evolution **can occur** via multiple inheritance mechanisms (e.g., guided variation, biased transmission, indirect bias) operating on a *population* of cultural variants, **without requiring** atomistic, high-fidelity replicators. Population-level dynamics (frequency-dependence, conformism, prestige bias) drive change and adaptation. Formal models demonstrate this rigorously.
      *   **Denied/Sidestepped:** The *necessity* of the strict "meme" replicator. They showed the *explanatory work* Dawkins assigned to the replicator could be done by population-level processes acting on potentially "fuzzy" or reconstructed variants. They also denied that formal models *required* the meme concept to be useful.

  **Why It Dissolved (Not Merely Verbal or About Explananda):**

  *   **The Burden of Proof Shifted:** Memetics promised a powerful, general Darwinian theory of culture predicated on replicators. It failed to deliver:
      *   **No Operationalization:** Identifying discrete, stable "memes" proved intractable in most domains.
      *   **Lack of Predictive Models:** Memetics generated few rigorous, testable models compared to cultural evolution approaches.
      *   **Evidence Against Ubiquitous Copying:** Empirical work (cognitive psychology, anthropology, linguistics) consistently showed reconstruction, transformation, and bias were fundamental, not exceptional.
  *   **Boyd & Richerson Provided a Viable Alternative:** Their framework:
      *   **Mathematically Formalized** cultural change *without* requiring strict replicators.
      *   **Incorporated Psychology** (biases, guided variation) directly into evolutionary models.
      *   **Produced Testable Predictions** about cultural dynamics observable in real populations and history.
      *   **Explained Cumulative Complexity:** Demonstrated how adaptive complexity (e.g., technology, institutions) can evolve through population processes involving various transmission biases, not just high-fidelity copying.
  *   **The Core Question Was Answered:** The substantive question was: "Is a high-fidelity replicator *necessary* for cumulative, adaptive cultural evolution?" Boyd & Richerson (and the evidence) showed **No, it is not.** Culture can evolve cumulatively through other population-level mechanisms acting on less-than-perfectly-replicated variants. This rendered the strict memetic replicator hypothesis largely redundant for explaining the core phenomenon it was invoked to explain.

  **What Progress Looks Like Now (It's Not Resurrecting the Old Fight):**

  The field *did* move on. Progress lies in:

  1.  **Domain-Specific Mechanism Mapping:** Instead of seeking universal replicators, identify the precise *mix* of transmission mechanisms (direct copying, reconstruction, guided variation, biased transmission) and selection pressures operating in *specific cultural domains* (e.g., folk tales vs. toolmaking vs. social norms vs. internet trends). Digital trace data (e.g., tracking edits, shares, remixes) is invaluable here.
  2.  **Integrating Cognitive Science Deeper:** Understanding the cognitive architectures and biases that shape reconstruction and transformation (Sperber's attractors) and how they interact with population dynamics (Boyd & Richerson's models).
  3.  **Formal Model Refinement:** Developing ever more sophisticated models incorporating cognitive constraints, social network structures, multiple interacting traits, and gene-culture coevolution. Testing these models against rich empirical datasets (historical, archaeological, ethnographic, digital).
  4.  **Quantifying Fidelity & Variation:** Using digital data and experiments to measure transmission fidelity *in specific contexts* and understand *when and why* fidelity is high (e.g., ritualized speech, technical instructions) versus low (e.g., gossip, artistic inspiration), and the consequences for evolution.
  5.  **Understanding Internet "Memes" on Their Own Terms:** Recognizing that internet virality ("memes" in the popular sense) is often driven by attention economics, algorithmic promotion, and participatory remix culture – phenomena better explained by models of social contagion, network effects, and biased transmission than by the strict replicator logic of classic memetics.

  **In essence:** The memetics dispute was substantive about the *mechanism* required for Darwinian cultural evolution. The memeticists' proposed mechanism (strict replicator copying) lost because evidence and superior modeling showed it wasn't necessary. The field absorbed the valid core insight (culture evolves through variation, selection, and inheritance-like processes) but jettisoned the specific, untenable replicator requirement. Progress is refining models of diverse transmission mechanisms and testing them with modern tools, not re-litigating the necessity of the meme. The question dissolved because the alternative framework *worked*.
