  I'd like the explanation to work through three things: (i) why third-person and past-tense ascriptions, where the attributor's and the subject's practical stakes come apart, are supposed to be the sharpest separating cases between the two views; (ii) how each view handles the eavesdropper who overhears a low-stakes attribution while sitting in a high-stakes conversation, and what each is forced to say about whether the overheard speaker said something true; and (iii) whether the referee has a point that once contextualists avail themselves of implicature and invariantists of pragmatic explanation, the two views can be made to agree on every ascription pattern — and, if so, what remains genuinely at stake between them (for instance, the truth-conditions of knowledge sentences versus the propriety conditions of asserting them).

  Please reply in British English, with sections named and ordered as follows: 'Where the referee goes wrong' (roughly 150 words), 'The core disagreement' (roughly 250 words), 'The diagnostic cases' (roughly 300 words), 'Where the referee has a point' (roughly 150 words), and 'What this means for my rebuttal' (roughly 100 words). And do push back: if you think the referee is actually right that the distinction does no real explanatory work, or that my framing of the dispute is itself confused, say so plainly rather than politely equipping me for a rebuttal I may not be entitled to.
