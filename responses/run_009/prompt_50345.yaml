answer: |-
  ## Response to Referee Report  

  ### Where the Referee Goes Wrong  
  The referee conflates the *explanatory mechanisms* and *truth-conditions* of Interest-Relative Invariantism (IRI) and Epistemic Contextualism (EC). While both predict that practical stakes affect whether we *ascribe* knowledge, they diverge on *why* and *when* such ascriptions are true. EC treats ‘knows’ as context-sensitive: its semantic content shifts with the attributor’s practical context. IRI denies this: ‘knows’ has invariant semantic content, but whether that content is *satisfied* depends on the subject’s practical situation. The referee’s claim that they are notational variants ignores this core metaphysical and semantic disagreement. The conflation rests on mistaking shared predictions about surface ascription patterns for identity in underlying theory.  

  ### The Core Disagreement  
  The dispute centres on two irreconcilable claims:  
  1. **Truth-Conditional Basis**:  
     - *EC*: The proposition expressed by “S knows that p” is determined by the attributor’s conversational context (e.g., their stakes, salience of error). ‘Knows’ is indexical.  
     - *IRI*: “S knows that p” has fixed truth-conditions: S must meet an epistemic standard *sensitive to S’s practical situation*. The attributor’s context is irrelevant to truth-value.  

  2. **Locus of Stakes-Sensitivity**:  
     - *EC*: Stakes affect the semantic *standard* for ‘knowledge’ in the attributor’s mouth.  
     - *IRI*: Stakes affect the *facts about the subject’s epistemic position* (e.g., whether their evidence is sufficient given their practical risks).  

  This is not merely semantic vs. pragmatic: it’s a disagreement about whether ‘knowledge’ is a *relationally constituted state* (IRI) or a *contextually shifty predicate* (EC). IRI embeds stakes in the metaphysics of knowledge; EC locates variation in linguistic meaning.  

  ### The Diagnostic Cases  
  **(i) Third-Person/Past-Tense Ascriptions (Divergent Stakes):**  
  Suppose Hannah in 1930 (low stakes) asserts, “The bank manager knew the branch would be open Saturday.” Unbeknownst to her, the manager faced high stakes (e.g., risking bankruptcy if wrong).  
  - *EC*: Hannah’s assertion is **true**. ‘Knew’ inherits *her* (low-standards) context. The manager’s high stakes don’t affect the truth-value.  
  - *IRI*: Hannah’s assertion is **false**. The manager’s high stakes raised the epistemic threshold for knowledge, which they didn’t meet.  
  *This forces a choice: whose context fixes truth? EC privileges the attributor; IRI the subject.*  

  **(ii) The Eavesdropper:**  
  A low-stakes speaker (LS) says, “S knows p,” overheard by a high-stakes eavesdropper (HE).  
  - *EC*: LS’s utterance is **true** (relative to LS’s context). HE can *correctly* say, “What LS said is false,” because HE’s high-stakes context shifts ‘knows’ to a higher standard. EC accepts conflicting truth-values for the *same utterance* across contexts.  
  - *IRI*: LS’s utterance is **true or false solely based on S’s stakes**. If S has low stakes, LS spoke truly; if S has high stakes, LS spoke falsely. HE’s disagreement must be substantive (about S’s stakes/epistemic position), not contextual.  
  *Here, EC allows contextual contradiction; IRI demands invariant assessment of the proposition.*  

  ### Where the Referee Has a Point  
  The referee is correct that *both theories deploy pragmatic resources*, creating superficial convergence:  
  - EC uses implicatures (e.g., “S doesn’t know” in high stakes implicates “S doesn’t meet *our* standards,” even if S meets lower ones).  
  - IRI uses pragmatic explanations for why we *hesitate* to claim knowledge in high stakes (e.g., asserting “I know” may mislead if downplaying risks).  
  This can blur predictions about *assertion patterns*. However, convergence breaks under pressure:  
  - **Embedding Tests**: In “LS said that S knows p, but S didn’t know,” EC treats this as consistent (if ‘didn’t know’ uses HE’s standards); IRI deems it contradictory if S’s stakes are fixed.  
  - **Metasemantics**: EC requires a linguistic mechanism for context-sensitivity (e.g., hidden variables); IRI requires stakes to affect epistemic relations (e.g., justification strength).  
  The *explanatory target* differs: EC explains linguistic behaviour; IRI explains knowledge’s nature.  

  ### What This Means for My Rebuttal  
  Your defence of IRI must foreground cases where attributor/subject stakes *diverge* (e.g., past-tense, eavesdropper). Emphasise that EC and IRI assign *contradictory truth-values* to identical knowledge sentences in these scenarios, proving distinct truth-conditions. Concede pragmatic overlap but argue it masks deeper divergence: whether ‘knowledge’ is linguistically elastic (EC) or metaphysically sensitive to the subject’s situation (IRI). The referee’s charge collapses only if we ignore whose context matters—which is precisely what your paper clarifies. Push the eavesdropper case hardest: it forces EC into semantic relativism, while IRI maintains classical bivalence.  

  **Pushback Caveat**: If your paper *only* addresses stakes-shifts without leveraging these diagnostics, the referee’s frustration may be warranted. Ensure your argument explicitly turns on cases exposing the attributor/subject divide.
