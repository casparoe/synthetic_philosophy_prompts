prompt: |-
  Is there a name for this move? I keep running into it in arguments about taste -- novels, wine, movies -- and I can't find the right concept anywhere.

  Someone defends a claim like "the works that are genuinely great are the ones the best judges agree on." Fine so far. But then it turns out the best judges are picked out partly by what they agree on. If a panel of respected critics loves some pulpy thriller, well, those critics were never the right kind of judges. If a bunch of trained sommeliers rate a cheap wine above a famous vintage in a blind tasting, then the tasting must have been flawed, or those particualr palates weren't really trained. The judge pool keeps getting redrawn so that it always contains the people who converge on the "right" verdict, and the right verdict is defined as whatever they converge on. It's like the measuring instrument is validated by the reading, and the reading by the instrument.

  I know it smells like No True Scotsman, but it feels different: nobody is redefining "critic" or "thriller" to dodge a counterexample. They're adjusting who counts as the measuring device. It's also not plain question-begging, because the person making the move usually does have some independent criteria for picking judges -- experience, track record, whatever -- it's just that when those criteria point somewhere they don't like, the verdict wins and the criteria quietly bend. And it's clearly not a straight appeal to authority, since appeals to authority at least let the authority disagree with you.

  Does this have an established name, in aesthetics, argumentation theory, philosophy of science, wherever it lives? If something is close, tell me how it differs. If nothing is exact, coin a term and define it. And don't just hand me a label and walk away -- I want to know what the phenomenon is and isn't, and where the edges are.

  Please structure the answer like this:

  1. "Nearest concepts" -- the closest established terms, roughly what each says, and why none of them is exactly this (~150 words)
  2. "The carving" -- what the move precisely is, and how it differs from No True Scotsman, plain circularity, and ordinary appeal to authority (~200 words)
  3. "A name, if needed" -- either the existing term that fits best, defended, or your coined term with a tight definition (~100 words)
  4. "Edge cases" -- about three test cases where it's genuinely unclear whether the move is being made (e.g. someone who only trusts judges they expect to disagree with, or recalibrating an instrument after a known failure), and how the carving from section 2 rules on each (~200 words)
  5. "Why it matters" -- what goes wrong in arguments about taste when you can't flag this move (~100 words)

  Keep it casual -- I'm not a philosopher, I just argue too much about books on the internet.
reasoning: |-
  Okay, let me tackle this user's query about that frustrating argument move in taste debates. They're describing a circular pattern where the "best judges" keep getting redefined to match predetermined greatness, which feels familiar but doesn't quite fit existing fallacy boxes. 

  First, I need to unpack why common labels fall short. No True Scotsman tweaks definitions of categories, but here it's about cherry-picking authorities - closer to ad hoc rescue but focused on gatekeeping expertise. The circularity is real but disguised through credibility calibration. 

  For carving the precise move, I'm seeing it as a self-insulating loop where verdicts validate judges who validate verdicts. Unlike plain appeals to authority, dissenters get excluded retroactively. The key differentiator is the quiet adjustment of credibility thresholds when "good judges" deliver "bad" verdicts.

  Hmm, naming is tricky. "Calibrated Authority Loop" feels right - captures the mutual adjustment of standards and outcomes. "Epistemic gerrymandering" is punchier but might be too obscure for internet arguments. Leaning toward the first for clarity.

  Edge cases need careful handling: 
  - Trusting only contrarian judges avoids the loop by design
  - Recalibration after proven instrument failure is legit
  - Rejecting unanimous praise for obscure works tests if dissent-exclusion is organic or forced

  Why does this matter? Left unchecked, it makes taste debates unwinnable - any evidence gets absorbed into the defender's self-validating system. Spotting the calibration move at least forces the loop into daylight where "track record" claims can be properly examined.
answer: |-
  Here's a breakdown of that slippery move, structured as requested:

  **1. Nearest Concepts (~150 words):**
  *   **No True Scotsman (NTS):** Closest cousin. NTS redefines a category ("*No* *true* Scotsman would...") to dodge counterexamples. This move redefines the *pool of valid judges/measurers* ("No *true* authority would like that pulp"). The difference is subtle: NTS shifts the *essential definition* of the thing (Scotsman, critic), while this move shifts *who qualifies* as a valid *identifier* of the thing (great work), based on their output alignment.
  *   **Ad Hoc Rescue:** Protecting a theory by making unsupported excuses for counter-evidence. This move *is* an ad hoc rescue *specifically* for the claim about expert consensus, but it's a *particular type* focused on redefining the experts themselves.
  *   **Circular Reasoning (Begging the Question):** It *is* circular ("Great works are what the best judges agree on; best judges are those who agree on great works"). But it's *masked* circularity. The circularity isn't explicit in the initial claim; it's revealed in the *application* when the judge pool is dynamically adjusted based on the verdict.
  *   **Appeal to Authority:** It *uses* authority, but subverts it. Ordinary appeals accept the authority's verdict even if surprising. This move *disqualifies* the authority if the verdict is "wrong".

  **2. The Carving (~200 words):**
  This move protects a claim about quality consensus (**C**: "The genuinely great X are those the best judges agree on") by **dynamically adjusting the criteria for "best judge" based on the outcome of their judgment**. Here's the core:

  1.  **Initial Criteria:** Proposer establishes *some* independent criteria for "best judges" (training, experience, past accuracy).
  2.  **Verdict Challenge:** A group meeting these initial criteria delivers a verdict contradicting the proposer's belief about what's great.
  3.  **Retroactive Adjustment:** Instead of accepting the verdict or abandoning **C**, the proposer argues *this specific group* wasn't *truly* composed of "best judges" *after all*. The initial criteria are implicitly or explicitly *downplayed* or *reinterpreted* ("Their experience wasn't *relevant*," "The *conditions* corrupted their *true* judgment," "Their past accuracy was overrated") to exclude dissenters.
  4.  **Loop:** The "best judges" are redefined as only those who *would* converge on the "correct" verdict (which aligns with the proposer's belief). The verdict defines the judges, and the (redefined) judges validate the verdict.

  *   **vs. NTS:** NTS changes what a "Scotsman" or "Critic" *is*. This move changes *which specific Scotsmen/Critics count as valid arbiters* for *this specific purpose* without necessarily changing the core definition. It's about membership in the *authoritative subset*.
  *   **vs. Plain Circularity:** The initial statement (**C**) isn't *obviously* circular. The circularity emerges operationally when the judge pool is adjusted based on output.
  *   **vs. Appeal to Authority:** A standard appeal defers to the authority's judgment. This move *rejects* the authority's judgment *and* retroactively revokes their authoritative status *for this case* if they disagree.

  **3. A Name, If Needed (~100 words):**
  No single perfect term exists. The closest established concept is a **Self-Insulating Authority Loop**. However, coining a term feels justified: **Calibrated Authority Loop (CAL)**.

  *   **Definition:** A fallacious move defending a claim about consensus-defined quality (**C**) by *dynamically calibrating* the membership of the authoritative group ("best judges") based on the conformity of their specific verdict to a predetermined notion of the "correct" outcome. The authority pool is *retroactively adjusted* ("calibrated") to exclude dissenters, ensuring **C** remains true by definition for the redefined group.

  **4. Edge Cases (~200 words):**

  1.  **The Contrarian Curator:** "I only trust critics who *disagree* with the mainstream. They're the real experts." *Is this CAL?* **No.** The "calibration" happens *upfront* based on a *predictable pattern of disagreement* (dissent is the *criterion*). CAL involves *retroactive exclusion* based on a *specific, unexpected* verdict contradicting the proposer's belief. Here, dissent is expected and desired.
  2.  **Recalibration After Proven Failure:** A lab thermometer is dropped, then gives a reading way off known values. Scientists discard that reading and recalibrate/replace the instrument. *Is this CAL?* **No.** There's an *independent, specific reason* for doubting the instrument (physical damage) unrelated to the undesired reading itself. CAL lacks this independent reason; the "flaw" is inferred *solely* from the "wrong" verdict.
  3.  **Ignoring Unanimous Praise for the Obscure:** Critics rave about an obscure indie film, but a defender of mainstream canon dismisses them as "hipster critics" or "out of touch." *Is this CAL?* **Yes, if...** The critics meet the defender's usual criteria (experience, mainstream publications) *until* they praise something unexpected/obscure, triggering retroactive dismissal ("Oh, *those* critics were always niche"). **No, if...** The defender *consistently* values different criteria (e.g., popular appeal, historical impact) that the obscure film lacks, and their dismissal of *these particular critics* is based on *that* pre-existing framework, not just the surprising verdict.

  **5. Why It Matters (~100 words):**
  This move **immunizes claims about objective quality from empirical challenge.** In taste debates, evidence (expert consensus) is supposed to settle disagreements. CAL makes this impossible. Any consensus you point to can be dismissed by redefining the experts, while any lack of consensus is dismissed because the "real" experts agree (by definition). It shuts down conversation, replaces evidence with dogma, and makes genuine critical discussion pointless. Spotting CAL forces the defender to either justify their judge-exclusion on *independent grounds* or admit their standard of "greatness" is ultimately personal and circular, not based on discoverable consensus.
