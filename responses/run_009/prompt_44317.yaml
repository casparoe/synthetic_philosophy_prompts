  - For nature of falsity: "Is the false assumption like ignoring friction (deliberate simplification) or like assuming something with no basis in reality?"  

  Finally, I'll note where the tree can't neatly separate positions—e.g., fictionalism vs. instrumentalism might blur if both treat assumptions as tools. The user values transparency here.  

  The tree should start from the agreed scenario, branch through these questions, and end with labeled positions, roughly 7-9 leaves. I'll include Friedmanite instrumentalism, Galilean idealization, mechanistic realism, structural realism, fictionalism, and perhaps others like domain-specific approximation or deferred mechanism views. For incoherent paths, I'll add a "dead end" leaf explaining why it doesn't hold.  

