  First, I need to validate their hypothesis. They mentioned that the sorites arguments might be secondary to deeper commitments about semantics. That makes sense. Epistemicism aligns with a metaphysical view where facts exist independently of our access. Supervaluationism, on the other hand, is more about how language functions in practice, focusing on assertibility and competent use. 

  Now, the two sticking points: supertruth and higher-order vagueness. For supertruth, the user's group is debating whether "supertrue but not assertible" versus "true but unknowable" is a substantive difference. The key here is to highlight that epistemicism's truth is ontological, while supervaluationism's supertruth is about semantic norms. The assertibility point shows that supervaluationists care about linguistic practice, whereas epistemicists don't tie truth to assertibility. 

  Higher-order vagueness is trickier. Supervaluationism faces regress with admissible precisifications, but epistemicism just accepts infinitely many sharp boundaries. This might not be the crux because both sides have ways to handle it, but it does expose their foundational differences. Epistemicism's embrace of unknowable facts contrasts with supervaluationism's attempt to mirror linguistic behavior, even if it leads to regress.

  The user wants to know if this is a substantive disagreement or just different projects sharing terminology. The answer is both. The theories address different aspects: one is about metaphysical facts, the other about language use. But since they both respond to the sorites, they're forced into dialogue. The real issue might be whether meaning is constituted by use or exists independently. 

  Can the debate move forward? Formal results might refine positions but won't resolve the core divide. Empirical data on how speakers handle borderline cases could challenge both theories. For example, if speakers consistently avoid asserting borderline statements, it supports supervaluationism's assertibility. If they show patterns that suggest hidden cutoffs, it might lean towards epistemicism. But neither would settle the metaphysical questions. 

  The user also asked if the stalemate means the question is ill-posed. It's more that the problem is deeply philosophical, rooted in intuitions about language and reality. Progress might come from reframing the debate, like focusing on how meaning functions in communication rather than trying to "solve" vagueness. 

  In conclusion, the user's diagnosis holds up. The disagreement is foundational, about the purpose of semantics. The sticking points illustrate these deeper commitments. While empirical data or formal work might provide insights, the core divide persists because it's about fundamental philosophical stances.
answer: |-
  Your diagnosis is sharp and largely correct—this *is* fundamentally a clash of paradigms about the nature of meaning and the goals of semantics. The sorites is a symptom, not the disease. Here's a breakdown of your hypothesis and the sticking points, with reasons:

  ### Core Disagreement: Metaphysics of Meaning vs. Norms of Use
  1.  **Epistemicism's Commitment:** It treats semantic facts as **robustly metaphysical**—meaning supervenes on external, mind-independent reality (including potentially unknown physical, psychological, or social facts). The existence of a sharp cutoff is a *consequence* of this realism about meaning and bivalence. Knowing the cutoff is an *epistemic* limitation, not a semantic one. Semantics describes truth-conditions; epistemology describes our access. Williamson's project aligns with a broader externalist, anti-luminosity worldview.
  2.  **Supervaluationism's Commitment:** It treats semantic facts as **constituted by normative patterns of use and agreement**. Where competent speakers' dispositions, agreements, and practices definitively run out ("no settled fact of the matter"), meaning itself is indeterminate. "Admissible precisifications" model what competent speakers *could* coherently accept without changing established meaning. Supertruth codifies "robust" agreement across possibilities consistent with use. It's fundamentally a theory about *assertibility conditions* and linguistic norms, not hidden metaphysical facts.
  3.  **Your Hypothesis Holds:** Yes, the verdict on the sorites *is* predetermined by these prior commitments. The epistemicist *must* have sharp cutoffs because meaning is a determinate external fact. The supervaluationist *must* reject determinate cutoffs at the borderline because meaning is grounded in use, which lacks determinacy there. Arguing about "cutoffs" directly is futile; it's like two architects arguing about whether a cornerstone is granite or limestone when one is designing a skyscraper and the other a tent – their choices stem from entirely different blueprints (goals for semantics).

  ### Addressing the Sticking Points
  1.  **Supertruth vs. Assertibility ("Is it nearly verbal?")**
      *   **It's Not *Merely* Verbal, It's Revelatory:** The supervaluationist's discomfort asserting "There is a sharp boundary" (even though it's supertrue) isn't a bug; it's a *feature* revealing their core commitment. For them, **assertibility is primary.** To assert something requires that competent speakers *in the actual situation* would accept it, or that it's settled by meaning. "There is a sharp boundary" fails this test in the penumbra – it's *not* settled by meaning *which* boundary it is, and asserting *any specific one* is unjustified. Supertruth captures a logical consequence of their framework, but it doesn't override the normative constraints on assertion derived from use.
      *   **Epistemicism's Contrast:** The epistemicist *can* comfortably assert "There is a sharp boundary" (it's true!), while simultaneously admitting they can't assert *where* it is (epistemic failure). Truth and assertibility are distinct. Their discomfort lies only in the ignorance, not in the semantic status of the existential claim.
      *   **Why it's Substantive:** This divergence highlights the **fundamental schism.** The supervaluationist sees the inability to assert a true sentence *in a specific context* (the penumbra) as a crucial semantic datum explained by their use-based theory. The epistemicist sees it as purely an epistemic curiosity. One theory prioritizes the norms of communication (assertibility), the other prioritizes correspondence truth.

  2.  **Higher-Order Vagueness (HOV)**
      *   **It Bites Both Sides, But Exposes Their Cores:** HOV is a profound challenge for *any* theory of vagueness. Neither side has a truly satisfying solution.
          *   *Supervaluationism:* The regress threat (vagueness in "admissible") is real. Responses (e.g., fuzzy admissibility, contextualism about "admissible," brute fact admissibility) often feel ad hoc or undermine the initial motivation of grounding meaning in use. It highlights the difficulty of drawing a sharp line *around* vagueness using tools defined by sharp boundaries (precisifications).
          *   *Epistemcism:* Their "shrug" (infinitely many sharp, unknowable boundaries) is consistent but deeply counterintuitive. It posits an **infinite hierarchy of brute metaphysical facts** utterly disconnected from human cognition or linguistic practice. This seems like a reductio for those prioritizing use/conceptual-role semantics.
      *   **Why it's Not *The* Crux, But Reinforces Yours:** HOV doesn't uniquely decide the debate; both sides struggle. However, it **vividly exposes their foundational commitments.** The supervaluationist's struggle shows the tension inherent in capturing inherently messy use with a formal model requiring precisification. The epistemicist's easy acceptance of unknowable infinities reveals their detachment of meaning facts from human access or utility. The *way* each side handles HOV flows directly from their core stance on what meaning *is*. The supervaluationist looks for ways to preserve the link to use/norms, the epistemicist embraces the metaphysical consequences.

  ### Is it Substantive? Can it Move?
  1.  **Substantive, But Paradigmatic:** It's absolutely substantive. The disagreement is about the **nature of linguistic reality and the purpose of semantic theory.** Are we mapping mind-independent meaning-facts, or codifying the norms implicit in competent linguistic practice? These are deep philosophical questions about metaphysics, language, and mind. Calling it "two projects sharing a word" is partly right – they *are* different projects – but they are forced into conflict because they both offer competing answers to the *same* question: "What is the semantic status of borderline sentences?"
  2.  **Bedrock Intuitions:** Yes, the intuitions driving each side (robust externalism vs. use-constitution) feel bedrock. Arguments often become circular because each side interprets "meaning," "truth," and "fact" through their own lens. The epistemicist sees the supervaluationist's rejection of sharp cutoffs as a failure of realism. The supervaluationist sees the epistemicist's hidden cutoffs as mystical posits disconnected from language use.
  3.  **Can the Debate Move? Yes, But Not to "Resolution":**
      *   **Formal Results:** Can refine internal consistency, expose problems (like HOV for supervaluationism), or show equivalences under certain constraints. But they won't settle the core philosophical divide about what meaning is. (e.g., Showing that supervaluationism + context can model speaker judgments better might sway pragmatists, but not convince a committed metaphysical realist).
      *   **Psycholinguistic/Experimental Data:** **This is the most promising avenue for genuine movement.** Data on how speakers *actually* process, judge, assert, and reason with borderline cases is crucial. Does speaker behavior show:
          *   Patterns suggesting *tacit* commitment to sharp boundaries (leaning epistemicist)?
          *   Systematic patterns of *withholding judgment*, context sensitivity, or tolerance for multiple resolutions (leaning supervaluationist)?
          *   Evidence of higher-order vagueness in judgments? How is it manifested?
          *   *Crucially:* Does speaker behavior align better with "unknowable fact" intuitions or "no settled fact"/"depends on how you look at it" intuitions? Data could **severely challenge one paradigm's psychological plausibility** or force refinements (e.g., perhaps epistemicism needs an error theory for why we *feel* there's no fact). This wouldn't "prove" metaphysics, but it could make one view significantly harder to maintain.
      *   **Conceptual Refinement:** Distinctions like "truth vs. supertruth vs. assertibility" *have* been drawn, but deeper analysis of concepts like "competence," "admissibility," "use," or "knowable" might clarify the commitments. Exploring connections to broader philosophical issues (e.g., rule-following, conceptual engineering, semantic externalism vs. internalism) can provide new angles.
      *   **Reframing the Question:** Acknowledging the paradigmatic nature might shift focus. Instead of "Who solves the sorites?", ask: "Which framework provides the most fruitful tools for understanding *how vague language functions in communication and cognition*?" or "Which commitments are more compatible with a naturalistic worldview?" This might not end the debate, but could change its tenor.

  **Conclusion:** Your diagnosis is correct. The stalemate arises from fundamentally different, pre-theoretic commitments about the **metaphysics of meaning** (external facts vs. use-constituted norms). The sorites arguments and sticking points (supertruth/assertibility, HOV) are consequences of these commitments. Progress is possible, primarily through empirical work on actual linguistic behavior with borderline cases, which could challenge the psychological adequacy of one framework or the other. Formal work can refine, but not resolve. Conceptual analysis can clarify. However, complete resolution is unlikely because the debate rests on deep, competing intuitions about language and reality. It's not ill-posed, just exceptionally hard – grappling with the very nature of meaning and our access to it. The persistence of the debate suggests it touches something profound.
