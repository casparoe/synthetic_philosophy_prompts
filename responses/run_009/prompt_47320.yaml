  Okay, the user is wrestling with a decision-theory argument about genetic testing. Their friend shut down the debate with "information never hurts," citing I.J. Good's result. The user suspects this oversimplifies but couldn't pinpoint why. They want a systematic breakdown of what "information never hurts" could mean and whether it actually supports taking the test.

  First, I need to map the possible interpretations of the slogan. The user already hinted at key distinctions: ex ante vs ex post utility, costless vs costly information, ideal vs real-world agents. Good's original theorem is about expected utility maximizers with Bayesian updating. That's the baseline. But the genetic testing scenario introduces wrinkles—psychological impact, disclosure risks, imperfect rationality. 

  The user's frustration is palpable. They're intellectually bothered by the gap between theory and application. Their core need isn't just definitions; it's ammunition to reopen the discussion with their friend. They want to expose where the slogan overreaches. I should validate that intuition while staying precise.

  Breaking it down:
  The strongest claim—"information never harms ex post"—is clearly false. Imagine testing positive for Huntington's and spiraling into depression despite decades of symptom-free life. That's quantifiable harm. Even Good's theorem has caveats: it assumes optimal post-information decisions. If the patient wouldn't act rationally (e.g., futilely draining savings), the theorem doesn't apply. 

  Cost is another escape hatch. The theorem treats information acquisition as free. But genetic tests have financial/emotional costs. Once you subtract those, expected utility could dip. 

  Then there's social dimensions—the friend ignored that others might learn the results. Insurance discrimination exists. That's not decision theory failing; it's the model missing externalities. 

  The friend definitely leaned on the formal theorem but overextended it. The theorem says you can't expect info to hurt on average if you're rational. But the real question is whether the patient will be rational, and whether "on average" comforts someone facing worst-case results. 

  Final verdict: The slogan fails here. Not because decision theory is wrong, but because humans and genetic risk aren't Bayesian robots. The test could harm via anxiety, misjudged reactions, or social fallout. The user was right to doubt.
answer: |-
  Here's a disentanglement of "information never hurts," its precise meanings, truth status, and its application to your genetic testing argument. Your friend likely relied on an oversimplified reading that fails in this real-world scenario.

  ### The Menu of Precise Claims & Their Status

  1.  **The Modest Formal Theorem (Good's Result / Blackwell's Theorem):**
      *   **Claim:** For a rational expected-utility (EU) maximizer who updates beliefs via Bayes' rule and *chooses optimally after receiving the information*, the *expected* utility (calculated *before* seeing the information) of having access to the costless information and then deciding is *at least as high* as the expected utility of deciding without it. It can be strictly higher.
      *   **Truth Status:** **Theorem.** (Assuming a well-defined probability model, EU maximization, Bayesian updating, *optimal action after info reception*, and *costless* information acquisition).
      *   **Assumptions:** Rational EU maximization, Bayesian updating, optimal post-information action, costless information, a fixed set of actions/choices.

  2.  **Ex Post Non-Negativity (Strong Claim):**
      *   **Claim:** Once the *specific content* of the information is known, an agent is *never worse off* (in realized utility) than they would have been *had they not received that specific information* (but still acted optimally without it).
      *   **Truth Status:** **Outright False.** Information can easily leave you worse off *ex post*. Knowing a terrible truth can cause psychological harm regardless of actions taken (e.g., severe anxiety/depression upon a positive result). It might force you into a lose-lose situation (e.g., knowing you carry a gene might cause distress, but you couldn't "unknow" it to avoid that distress). The *theorem only guarantees non-negative value on average (ex ante), not for every possible outcome.*
      *   **Assumptions:** N/A - This claim is generally false.

  3.  **Costly Information:**
      *   **Claim:** The expected value of acquiring information is always non-negative, even considering the cost.
      *   **Truth Status:** **Outright False.** If the cost of acquiring the information (financial, time, emotional distress of testing itself) outweighs its expected benefit (calculated via Good's theorem), then the *net* expected value is negative. The theorem explicitly assumes costless acquisition.
      *   **Assumptions:** N/A - The claim fails when costs are introduced.

  4.  **Non-Optimal Agents (Imperfect Updating or Choice):**
      *   **Claim:** Agents who do not update beliefs perfectly (non-Bayesian) or who do not choose optimally *after* receiving information still cannot be harmed (ex ante or ex post) by receiving information.
      *   **Truth Status:** **Outright False.** If an agent misinterprets information, updates beliefs irrationally, or chooses a *worse* action *because* of the information than they would have chosen without it, the information *can* be harmful. The theorem *crucially relies* on optimal processing and action post-information.
      *   **Assumptions:** N/A - The claim fails without the core assumptions of rationality.

  5.  **Information as a Signal to Others (Strategic/Reputational Effects):**
      *   **Claim:** Acquiring information cannot harm you, even if others observe that you acquired it or learn its content and react strategically (e.g., insurers denying coverage, employers discriminating).
      *   **Truth Status:** **Outright False.** If the *act* of testing or the *result* becoming known to others changes the game (e.g., denial of future insurance, employment discrimination, social stigma), this can directly cause significant harm (reduced utility). Good's theorem assumes a *fixed* decision problem for the agent; it doesn't account for the information changing the environment *because* others react.
      *   **Assumptions:** N/A - The claim fails when information acquisition or revelation alters the strategic landscape.

  ### Verdict on Your Friend's Argument & the Genetic Test

  *   **Your Friend's Likely Reliance:** Your friend almost certainly invoked the **Modest Formal Theorem (Claim 1)** but interpreted it as implying **Ex Post Non-Negativity (Claim 2)** and ignored the critical assumptions regarding **Cost (Claim 3)**, **Optimal Post-Information Action (Claim 4)**, and **Strategic Effects (Claim 5)**. The "one-liner" "information never hurts" strongly suggests they were blurring the crucial distinction between the ex ante expected value guarantee and the potential for ex post harm.

  *   **Does this Support Taking the Test? NO.** The formal theorem, stated carefully, **does not support the blanket conclusion that "the patient should take the test"** for these reasons:
      1.  **Costs Matter:** Genetic testing isn't costless. There are financial costs, the anxiety of waiting for results ("the waiting is the hardest part"), and the potential psychological cost of the testing process itself. These *must* be subtracted from the expected benefit calculated by Good's theorem. The net expected utility could be negative.
      2.  **Ex Post Harm is Real:** As argued in Claim 2, receiving a positive result *can* cause significant, lasting psychological harm (anxiety, depression) even if the person later makes optimal medical decisions. Good's theorem doesn't preclude this possibility; it only says that *on average* (considering both positive *and* negative results), the *expected* benefit of having the information is non-negative *before* you know the result. This is cold comfort to someone who actually gets devastating news and suffers psychologically.
      3.  **Optimal Action is Not Guaranteed:** The theorem assumes the patient will make perfectly rational, optimal decisions *after* getting the result. Humans are not perfect EU maximizers. A positive result might lead to excessive anxiety, poor mental health coping mechanisms, overreaction (e.g., quitting a job prematurely), or underreaction (e.g., denial leading to poor planning). These suboptimal reactions *can* make the person worse off than if they remained ignorant.
      4.  **Strategic/Reputational Risks:** Taking the test creates a record. In many jurisdictions, genetic test results can impact eligibility for life insurance, long-term care insurance, or even employment in some fields. *Even the act of taking the test* can sometimes be used against you by insurers. This is a direct harm introduced by the information acquisition process itself, completely outside the scope of Good's theorem.
      5.  **Lack of Actionable Options:** Good's theorem assumes having the information enables better choices from a fixed set of actions. For an incurable late-onset disease like Huntington's, the actionable choices *after* a positive test might be limited (e.g., lifestyle planning, financial planning, reproductive decisions). If the patient wouldn't make different *meaningful* choices based on the result, or if the potential actions themselves carry high costs (e.g., drastic life changes), the expected benefit shrinks. The theorem doesn't guarantee a large benefit, just a non-negative one relative to acting without the info.

  **Conclusion:** Your intuition was correct. The "information never hurts" slogan, derived loosely from Good's theorem, is a profound oversimplification in the context of predictive genetic testing for incurable diseases. While the *formal theorem* is true under its strict assumptions, those assumptions (costless acquisition, optimal post-information action, no environmental changes from testing) are critically violated in this real-world scenario. The potential for significant ex post psychological harm, the real costs involved, the risk of suboptimal reactions, and the strategic risks from disclosure mean that the expected utility of taking the test **can indeed be negative** for many individuals. Your friend's argument depended on conflating the modest ex ante guarantee with a false promise of ex post safety and ignoring the messy realities of cost, psychology, and social context. The decision to test is deeply personal and requires weighing these complex potential harms against the possible benefits of knowing.
