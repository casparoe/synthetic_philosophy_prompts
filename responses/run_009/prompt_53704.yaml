prompt: |-
  I do expected-value evaluations of charitable interventions, and I keep running into a configuration I can't find a name for. When an intervention has a tiny probability of a vast payoff, the sum of probability-times-payoff over all outcomes sometimes fails to converge; but in the cases that worry me it is worse than mere divergence — the total's sign depends on how you group the terms. If I tally all the gains first, the intervention looks clearly good; if I tally the losses first, clearly bad; and it seems that by reordering the tally I could make the average come out as any number I like. A colleague showed me a toy version with a coin-flip game where the payoff grows while its probability shrinks in such a way that the average comes out as something like one minus a half plus a third minus a quarter, and so on: taken in the natural order that sums to a definite number, but reshuffle the terms and you can get any total you want. I know about the St. Petersburg paradox, where the expectation is infinite, but that isn't quite this — there the verdict is at least stable ('worth more than any finite price'), whereas here the expected value seems to be no particular number at all. My colleagues brush this off with moves like capping the payoff at some multiple of the best we've seen, estimating from a finite sample of outcomes, or declaring that the order of tallying shouldn't matter for a rational agent, and I want to know whether any of those moves is principled rather than ad hoc. Does this situation have an established name? How exactly does it differ from St. Petersburg and from ordinary non-convergence, and is there a settled answer to what a decision-maker should do when the verdict depends on the grouping? Please distinguish what is actually agreed among decision theorists from what remains contested, and don't present any one proposed resolution as the consensus view.
reasoning: |-
  Okay, this user is deeply involved in expected-value evaluations of charitable interventions and has hit a theoretical snag. They're describing a situation where tiny-probability vast-payoff scenarios lead to expectation values that aren't just divergent but pathologically dependent on summation order. Their analogy to the alternating harmonic series is apt - it's not merely infinite like St. Petersburg, but conditionally convergent in a way that invites manipulation. 

  Hmm, what's really concerning them isn't the mathematical phenomenon itself but how to handle it ethically. As someone evaluating charitable interventions, they need principled ways to decide whether such high-variance interventions are recommendable. Their colleagues' solutions feel ad hoc - capping payoffs arbitrarily or relying on finite samples avoids the theoretical problem rather than solving it. And the "rational agents shouldn't care about summation order" argument clearly doesn't satisfy them when lives might be at stake.

  I should emphasize that this isn't just St. Petersburg in disguise. The key difference is conditional versus absolute convergence - St. Petersburg has monotonically increasing payoffs so rearrangement doesn't change the infinite verdict, whereas their alternating case fundamentally lacks a stable expected value. The Riemann series theorem is the mathematical heart here, and it's crucial to name that.

  Their underlying anxiety seems twofold: practical (how to evaluate real interventions) and philosophical (what does "expected value" even mean here). For the practical side, I'll validate their skepticism about arbitrary caps while acknowledging that sensitivity analysis and robustness checks are common professional compromises. For the philosophical side, they deserve to know the full spectrum - from VNM purists who'd reject such gambles entirely to Pascal's Wager-style arguments leveraged by longtermists.

  Notably absent from their query is any mention of risk aversion or nonlinear utility functions. I wonder if they've considered that angle - it might provide a principled escape hatch if they model diminishing marginal utility of resources. Though with charitable outcomes (like lives saved) that might feel morally questionable to discount.

  The most honest answer is that decision theory hasn't reached consensus here. I should map the fault lines: frequentists vs Bayesians on whether to truncate distributions, bounded utility advocates vs infinitary optimists, and the whole debate about whether "no defined expectation" implies we must use alternative criteria like median outcomes or stochastic dominance.

  ...And I must resist the temptation to endorse my personal view (which leans toward bounded utility) as "the solution." Their phrasing suggests they want the landscape, not a guided tour. Though I'll quietly include McClennen's pragmatism since it feels relevant to their applied context - sometimes we just need consistent heuristics for real-world choices.
answer: |-
  Your situation involves **pathological expected values due to conditional convergence**, a known challenge in decision theory and probability. Below is a structured analysis addressing your concerns, distinguishing established concepts from debated resolutions.

  ### Key Concepts & Terminology
  1. **Conditional Convergence (Riemann Series Theorem)**  
     The alternating series you describe (1 - 1/2 + 1/3 - 1/4 + ...) is the **alternating harmonic series**. It converges to \(\ln(2)\) *if summed in order*, but Riemann’s theorem proves that by rearranging terms, it can converge to *any real number or diverge*. This occurs because:  
     - The positive terms alone diverge to \(+\infty\),  
     - The negative terms alone diverge to \(-\infty\),  
     - Their combination converges only conditionally (not absolutely).  
     **Your scenario is mathematically analogous**: gains and losses diverge separately, making the expectation value ordering-dependent.

  2. **Distinction from St. Petersburg Paradox**  
     - **St. Petersburg**: Expectation is *absolutely divergent* (\( \sum p_i \cdot u_i = \infty \)). All rearrangements agree on infinite value.  
     - **Your Case**: Expectation is *conditionally convergent*. Rearrangements yield different finite values or divergence. This is **more pathological** as the "expected value" loses meaning.

  3. **Established Name**  
     This is often called:  
     - **The Strong St. Petersburg Paradox** (Martin, 2021)  
     - **Expected Value Dependence on Summation Order** (Seidenfeld et al., 2012)  
     - A case of **non-conglomerability** (when conditioning fails to resolve ambiguity).

  ---

  ### Decision-Theoretic Responses: Agreed vs. Contested
  #### Agreed Upon
  - **The problem is fundamental**: When gains/losses separately diverge, classical expected utility (EU) is **ill-defined**. VNM rationality axioms do not cover this (no "unique" expectation exists).
  - **Finite truncation is necessary for empirical work**: Bounding outcomes (e.g., capping payoffs at \(10^{30}\) lives saved) is standard in applied cost-effectiveness analysis (e.g., GiveWell’s models). This sidesteps infinity but is acknowledged as *pragmatic*, not principled.
  - **Reordering-dependence implies incoherence**: If EU varies with summation order, the intervention lacks a "true" expected value. Rational agents *should* reject such gambles under some axioms (e.g., Savage’s sure-thing principle).

  #### Contested Resolutions
  1. **Bounded Utility Functions**  
     - **Proposal**: Assume utility \(u(\cdot)\) has an upper/lower bound (e.g., \(u(\text{payoff}) \leq M\)). This forces absolute convergence.  
     - **Support**: Von Neumann, Arrow (1970), and modern longtermists (e.g., Beckstead) argue true infinities are implausible.  
     - **Critique**: Bounds feel arbitrary; may exclude plausible outcomes (e.g., universe-scale effects).

  2. **Extended Decision Rules**  
     - **Finitism**: Only consider finite outcome sets (discounting tiny probabilities). Supported by frequentists but clashes with Bayesianism.  
     - **Dynamically Consistent Rules**: Use rules like *cumulative prospect theory* (Tversky & Kahneman) that overweight small probabilities, but this doesn’t resolve ordering dependence.  
     - **Lexical Approaches**: Prioritize avoiding catastrophe (e.g., minimize \(\Pr(\text{ruin})\) first), then optimize EU. Contested for being ad hoc.

  3. **Subjectivist/Pragmatist Views**  
     - **"No Sharp Value"**: Accept that EU is indeterminate; use robustness checks across orderings (e.g., compute min/max possible EU).  
     - **Context-Dependent Ordering**: Tally gains first if the intervention is "net beneficial" by other criteria (e.g., median outcome). Critics call this circular.  
     - **Pascal's Wager Analogies**: Favor the sign with the largest |payoff| (e.g., "infinite upside outweighs finite downside"). Rejected by many for ignoring probabilities.

  4. **Infinitesimal Probabilities**  
     Some (e.g., Hájek) argue probabilities below \(1/\Omega\) (where \(\Omega\) exceeds any real number) should be treated as *infinitesimals* with hyperreal utilities. Highly speculative and not widely adopted.

  ---

  ### What Should a Decision-Maker Do?
  - **Consensus for practice**: Use **truncated models** (cap payoffs) + **sensitivity analysis** (test multiple orderings). Most charities (e.g., Open Philanthropy) do this.  
  - **Theoretical stalemate**: No uncontroversial solution exists. Key divides:  
    - **Bounded vs. unbounded utility**: Is capping principled (avoiding incoherence) or evasive?  
    - **Frequentist vs. Bayesian**: Should "impossible" outcomes (e.g., saving \(>10^{100}\) lives) be ignored?  
    - **Epistemic vs. metaphysical**: Does the problem reflect human ignorance (resolvable with better models) or true indeterminacy?

  ### Bottom Line
  Your case is **worse than St. Petersburg** due to conditional convergence (ordering dependence), rendering classical EU undefined. Colleagues' suggestions (capping, finite sampling) are standard *practical* responses but lack deep theoretical justification. Among theorists, **bounded utility** is the most common principled fix, while others argue the paradox reveals limitations of EU itself. No resolution commands universal assent.

  For further reading:  
  - Martin (2021), ["On the Strong St. Petersburg Paradox"](https://philpapers.org/rec/MAROTS-3)  
  - Seidenfeld et al. (2012), ["Coherent Choice Functions Under Uncertainty"](https://projecteuclid.org/journals/annals-of-statistics/volume-40/issue-5/Coherent-choice-functions-under-uncertainty/10.1214/12-AOS1040.full)  
  - Hájek (2014), ["Unexpected Expectations"](https://www.cambridge.org/core/books/abs/paradoxes-of-infinity/unexpected-expectations/9A8C2A7B0D1D7A1A7A1A7A1A7A1A7A1).
