  ### The Core Principle
  The consistent principle that explains your verdicts across the scenarios is: **Switch envelopes if and only if the expected value of the other envelope, conditional on all your current information (including any observed amount and the prior distribution of the smaller amount), is greater than the amount you currently hold.**

  This principle is grounded in decision theory and Bayesian reasoning. It requires specifying a prior distribution for the smaller amount (or the pair of amounts) to compute expectations. Without a prior, expectations are undefined, and intuitive "50/50" assumptions can lead to contradictions. The principle respects symmetry when no information breaks it, incorporates observed values, and handles mixed priors by conditioning on all known information.

  ### Which Verdicts Have to Go and Why
  Your verdicts are mostly correct except for (2) and (5), which rely on implicit or impossible prior assumptions. Below, I'll explain why each verdict stands or falls, using your principle and simple calculations. I'll use "S" for the smaller amount in the pair, so the envelopes contain S and 2S.

  - **Verdict (1): Plain version (no opening, no prior)**  
    **Your verdict:** No reason to switch (symmetric).  
    **Why it holds:** With no information, the prior is symmetric. Let E[your envelope] be the expected value of your unopened envelope. By symmetry, E[other envelope] = E[your envelope], so switching has no expected gain. No prior specification is needed because symmetry alone implies equality.  
    **Calculation:** Not needed—symmetry suffices.

  - **Verdict (2): Open and see $100 (no prior specified)**  
    **Your verdict:** Switch because other is equally likely $50 or $200, E[other] = $125 > $100.  
    **Why it has to go:** This verdict assumes that P($100 is smaller) = P($100 is larger) = 0.5, which implies a specific prior (where the smaller amount's density f(S) satisfies f(y) ∝ 1/y for all y). But this prior is improper (infinite mean) and unrealistic. With a proper prior, E[other | see $100] may not be $125; it could be less, more, or equal. For example:
    - If S is known to be large (e.g., S > $50), seeing $100 makes it likely the larger amount, so E[other] < $100.
    - If S is uniform on [50, 150], seeing $100 yields E[other | see $100] ≈ $116.67 < $100? Wait—let's calculate:  
      - S uniform on [50, 150], density f(s) = 1/100.
      - Given see $100, P($100 is smaller) = P(S=100) / [P(S=100) + P(S=50)] but use densities.  
      g(y) = density of seeing y: g(y) = 0.5 f(y) + 0.25 f(y/2) for y in [100, 300] but S min 50, S max 150, so y from 50 to 300.  
      P(smaller | see y) = [0.5 f(y)] / g(y)  
      For y=100: f(100) = 1/100, f(50) = 1/100 (since S=50 possible).  
      g(100) = 0.5 * (1/100) + 0.25 * (1/100) * 2? f(y/2) at y=100 is f(50) =1/100, and density adjustment: g(y) = 0.5 f(y) + 0.25 f(y/2)  
      So g(100) = 0.5*(1/100) + 0.25*(1/100) = 0.005 + 0.0025 = 0.0075  
      P(smaller | see 100) = [0.5 * 1/100] / 0.0075 = 0.005 / 0.0075 = 2/3  
      P(larger | see 100) = 1 - 2/3 = 1/3  
      Then E[other | see 100] = (2/3)*200 + (1/3)*50 = 400/3 + 50/3 = 450/3 = 150 > 100. Still greater, but not 125.  
      With S uniform on [10, 1000], seeing $100:  
      f(100) = 1/990, f(50) = 1/990  
      g(100) = 0.5/990 + 0.25/990 ≈ (0.000505)  
      P(smaller | see 100) = [0.5/990] / [0.5/990 + 0.25/990] = (0.5/990) / (0.75/990) = 0.5/0.75 = 2/3  
      E[other] = (2/3)*200 + (1/3)*50 ≈ 150 again.  
      But if S is likely small, e.g., P(S=50) = 0.9, P(S=100) = 0.1, then seeing $100:  
      P($100 is smaller) = P(S=100) / [P(S=100) + P(S=50)] = 0.1 / (0.1 + 0.9) = 0.1 (since if larger, S must be 50).  
      P(smaller | see 100) = 0.1, P(larger | see 100) = 0.9  
      E[other] = 0.1*200 + 0.9*50 = 20 + 45 = 65 < 100.  
    **Conclusion:** Verdict (2) must be qualified. The "50/50" assumption is not generally true; E[other | see X] depends on the prior. With no prior, we can't compute expectations, so "always switch after seeing X" isn't universally valid. Your feeling that switching should be good before opening is wrong because unopened, symmetry ensures E[other] = E[your envelope], but after seeing X, conditioning breaks symmetry if the prior isn't uniform.

  - **Verdict (3): Known amounts ($10 and $20)**  
    **Your verdict:** See $10 → switch; see $20 → stay; unopened → indifferent.  
    **Why it holds:** With known amounts, the prior is degenerate (only one pair). Conditional on what you see, E[other] is certain: if you see $10, other is $20 > $10; if you see $20, other is $10 < $20; unopened, E[other] = E[your] = $15. Matches the principle.  
    **Calculation:** Trivial.

  - **Verdict (4): Mixed pairs (90% ($10,$20), 10% ($20,$40))**  
    **Your verdict:** See $10 → switch (other $20); see $40 → stay (other $20); see $20 → E[other] = $13 < $20, stay.  
    **Why it holds:** The prior is proper and specified. Conditional on seeing $20, you correctly computed E[other | see $20] = 0.9 * $10 + 0.1 * $40 = $13 < $20. At $20, the 50/50 itch is gone because the prior weights make $20 more likely to be the larger amount in the common pair.  
    **Calculation:** As you did.

  - **Verdict (5): Host promises "other is equally likely double or half"**  
    **Your verdict:** Always switch, even unopened, but this leads to infinite switching.  
    **Why it has to go:** The promise (for every possible amount you see, P(other is double) = P(other is half) = 0.5) requires P(your envelope is smaller | see y) = 0.5 for all y. But this implies an improper prior where f(S) ∝ 1/S (e.g., S has a log-uniform distribution), which has no finite mean. With this prior:
    - E[other | see y] = 0.5 * (2y) + 0.5 * (0.5y) = 1.25y > y, so switching seems beneficial.
    - But unopened, E[your envelope] = ∞, so "always switch" is meaningless (expectations diverge).
    - Infinite switching arises because E[other | see y] > y always, but switching twice returns you to the start, showing inconsistency.  
    However, no proper prior can satisfy the promise for all y. For example, if S has a finite range, at the minimum or maximum amount, it can't be equally likely smaller or larger. Thus, the promise is impossible, making the scenario ill-defined.  
    **Conclusion:** Reject this verdict. The promise cannot hold, so you shouldn't always switch. If forced, with the improper prior, switching once increases expected value but causes infinite regress, revealing a flaw.

  ### Predictions for Additional Cases
  The principle predicts the following in your requested scenarios:

  1. **Open, switch, look inside the new envelope, and switch a second time:**  
     - **Step 1:** You open the first envelope and see amount X. Compute E[other | X] based on the prior. If E[other | X] > X, switch (getting the other envelope).  
     - **Step 2:** You open the new envelope and see amount Y. Now, you know the previous envelope contained X (since you saw it). The other envelope (the one you just had) is fixed at X, so E[other | Y, X] = X (no uncertainty).  
       - If X > Y, switch back (gaining X - Y > 0).  
       - If X < Y, keep (since switching back would lose Y - X > 0).  
     - **Net effect:** After two switches, you end up with the envelope you initially had. But the first switch is beneficial only if E[other | X] > X on average; the second switch corrects if the first was a loss. For example, in your case (2) with X=$100 and 50/50 assumption, E[other]=$125 > $100, so you switch. If you get $50 (with P=0.5), you see Y=$50, know other is $100 > $50, so switch back. If you get $200, you see Y=$200, know other is $100 < $200, so keep. Thus, you always end with at least $100, and sometimes $200, but the expected gain from the first switch is positive.

  2. **Smaller amount drawn from a distribution with no finite mean (e.g., St. Petersburg style):**  
     - Suppose S (smaller amount) has P(S = 2^k) = (1/2)^k for k=1,2,3,... (so E[S] = ∞).  
     - You open your envelope and see X = 2^m for some m.  
     - As calculated in the thought process:  
       - For m=1 (X=2), you must have the smaller amount, so other is 4, E[other | X=2] = 4 > 2.  
       - For m>1, P(you have smaller | see X=2^m) = 1/3, P(you have larger | see X=2^m) = 2/3, so E[other | X=2^m] = (1/3) * 2^{m+1} + (2/3) * 2^{m-1} = (2/3) * 2^m + (1/3) * 2^m = 2^m = X.  
     - **Prediction:**  
       - If m=1, E[other | X] > X, so switch.  
       - If m>1, E[other | X] = X, so no reason to switch.  
     - **Why:** With no finite mean, "expected value" can be undefined unopened, but conditional on X, it may be finite and equal to X (as here for m>1). The principle still applies: switch only if E[other | X] > X. In this case, it holds for m=1 but not for m>1, so no paradox.

  ### The 50/50 Feeling in Verdict (2) and Why Variant (4) Exposes It
  - **What the assumption is:** In verdict (2), when you see $100 and feel "other is equally likely $50 or $200," you're assuming that P($100 is smaller) = P($100 is larger) = 0.5. This assumes the prior distribution for S is such that, for any observed amount y, P(y is smaller) = P(y is larger). This requires f(S) ∝ 1/S (improper, scale-invariant prior), where the density at S and 2S are related to make P(smaller | see y) = 0.5 for all y.
    
  - **Why variant (4) exposes the problem at $20:**  
    In variant (4), with a proper prior (90% ($10,$20), 10% ($20,$40)), seeing $20 does not satisfy P($20 is smaller) = P($20 is larger) = 0.5. Instead:  
    - P($20 is smaller) = P(in ($20,$40) pair) = 0.1  
    - P($20 is larger) = P(in ($10,$20) pair) = 0.9  
    So E[other | see $20] = 0.9 * $10 + 0.1 * $40 = $13 < $20, and you correctly stay. The prior weights break the symmetry, making $20 more likely to be the larger amount. At $100 in verdict (2), the "50/50" feeling hides the prior dependence because $100 seems "arbitrary," but without a specified prior, we can't justify it. Variant (4) forces you to confront the prior by having a value ($20) that acts as a "boundary" between pairs.

  - **Why variant (2) hides it at $100:** With no prior specified, $100 feels like a "typical" value, so you implicitly assume a symmetric prior (like f(S) ∝ 1/S). But this prior is improper and unrealistic. In real-world scenarios, amounts are bounded or have reasonable distributions, so at $100, P(smaller | see $100) may not be 0.5. Variant (2) hides the issue because the assumption feels intuitive, but variant (4) makes it explicit by giving a proper prior where symmetry fails.

  ### Final Thoughts: Your Brother Is (Mostly) Right
  Your brother's point—"it depends on the prior"—is correct. The two-envelope paradox arises from ambiguous or unrealistic prior assumptions. The principle I've given clarifies this:
  - With no prior, unopened is symmetric (verdict 1).
  - After seeing X, E[other | X] depends critically on the prior (verdict 2 needs qualification).
  - Proper priors resolve the expectations cleanly (verdicts 3 and 4).
  - Impossible promises (verdict 5) reveal that some assumptions break probability.

  To lose the argument for the right reason: In the open-and-see-$100 case, you can't universally claim E[other] = $125 without specifying a prior. If the prior is unknown, the best you can say is that switching might be beneficial if the prior is roughly scale-invariant, but it's not guaranteed. Variant (4) shows how the prior can make staying better even at a "middle" value. So, embrace the prior—it's the key to dissolving the paradox.
