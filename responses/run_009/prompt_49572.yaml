  ### Leaf Positions Explained:
  1. **Virtual Realism (Chalmers)**: Virtual objects are real in a digital ecosystem. Your sword exists like a physical tool, just in a virtual world.  
  2. **Fictional Props**: Virtual objects are story devices. Your character is like a character in a novel—real in the narrative, but not metaphysically.  
  3. **Abstract-Artifact View**: A virtual sword is like a poem. It’s an abstract creation, not a physical or fictional object.  
  4. **Institutional View**: Virtual objects exist because of social rules (like money or laws). Your item is "real" only because we agree it is.  
  5. **Flat Irrealism**: Virtual objects aren’t real in any sense. They’re patterns of data, no more real than a dream.  

  ---

  ### 📌 Analyst Notes:
  **(a) Indistinguishable Leaves**  
  - **Fictional Props** and **Abstract-Artifact** views aren’t separated by the cases. Both treat objects as non-concrete (e.g., a "unique" item is a narrative or abstract type), leading to identical paths.  
  - **Virtual World Harm** and **Institutional View** often align (both treat virtual acts as "real"), but the harm branch isolates ethics from ontology.  

  **(b) Unoccupied Positions**  
  - **Node 5C/7C** (claiming items are "unique" but "nothing real"): *Incoherent*—uniqueness implies reality.  
  - **Node 7A** ("unique" items are "things" but easily duplicated): *Unexplored*—no major theory accepts this tension.  
  - **Node 10B** (rights exist but property doesn’t): *Unattractive*—rights typically protect something tangible or institutional.  

