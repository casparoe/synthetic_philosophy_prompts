  ### Design Notes:
  - **Accessibility**: Concrete cases avoid jargon. Answers reflect instinct (e.g., "just rude" vs. "vandalism").  
  - **Logical Structure**: Branches from core disagreements (persistence, uniqueness, value, harm).  
  - **Node Count**: 13 ontology nodes + 1 harm node = 14 total (flexible pruning to 12 by merging Nodes 9/12/13).  
  - **Harm Separation**: Isolated branch ensures ethics isn’t reduced to ontology.
