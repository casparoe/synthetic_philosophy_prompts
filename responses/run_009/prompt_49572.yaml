  ### Decision Tree: Which View of Virtual Objects Do You Actually Hold?

  **Starting Point:** You've experienced a rare in-game item being deleted by a server glitch. Let's explore what this says about how you see virtual worlds. Answer each question based on your gut reaction—no philosophy background needed!

  ---

  #### **Node 1: Server Relaunch**  
  *Your game shuts down. Months later, it relaunches from a backup, restoring your character with all progress/items. Is this the same character?*  
  - **A. Yes, it’s the same character.** → Node 2  
  - **B. No, it’s a new duplicate.** → Node 3  

  #### **Node 2 (from A): Duplication Bug**  
  *A glitch copies a "unique" item into two identical versions. Does this reveal something fundamental about the item?*  
  - **A. Yes—it was never truly unique (just data/patterns).** → Node 4  
  - **B. No—it’s still unique; the glitch is a mistake.** → Node 5  

  #### **Node 3 (from B): Duplication Bug**  
  *Same bug: Two copies of a "unique" item exist. Your thoughts?*  
  - **A. Yes—this confirms items are just data/patterns.** → Node 6  
  - **B. No—it’s still unique; the glitch is a mistake.** → Node 7  

  #### **Node 4 (from 2A): Third-Party Purchase**  
  *You buy an in-game item with real money via a third-party seller. What did you acquire?*  
  - **A. A thing (the item itself).** → Node 8  
  - **B. A right (permission to use it).** → Node 9  
  - **C. Nothing real (it’s just pixels/data).** → **Leaf: Flat Irrealism**  

  #### **Node 5 (from 2B): Third-Party Purchase**  
  *Same purchase. What did you get?*  
  - **A. A thing.** → **Leaf: Virtual Realism (Chalmers)**  
  - **B. A right.** → Node 10  
