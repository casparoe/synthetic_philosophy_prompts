  ### 🌐 **Separate Branch: Virtual Harms**  
  *Start here for harm-focused cases (bypasses ontology).*

  #### **Node H1: Distressing Avatar Act**  
  *A distressing act on your avatar leaves you genuinely shaken. Where is the harm?*  
  - **A. In the virtual world (the act itself was harmful).** → **Harm View: Virtual World**  
  - **B. In the player (my psychological state was harmed).** → **Harm View: Player**  
  - **C. Nowhere yet (it’s just code until real impact).** → **Harm View: Nowhere**  

