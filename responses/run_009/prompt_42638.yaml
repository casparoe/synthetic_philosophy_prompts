     - A) We should remove it because it's annoying and I don't see the point. (R: Reformist)
     - B) We should find out why the rule exists. If the reason is bad or gone, then remove it. (C: Chesterton)
     - C) Even if the reason is gone, the rule might serve a purpose we don't understand, so we should keep it. (B: Burkean)
     - D) I don't like the rule, but I don't want to cause trouble by changing it. (Q: Status quo)

  Question 6: A tradition at your school is that seniors get to skip class on the last Friday of the year. It started because the teachers used to have a meeting that day, but they don't have that meeting anymore. Now it just causes disruption. What should be done?
     - A) Stop it. The reason is gone and it's disruptive. (R: Reformist and C: Chesterton) [since they know the reason and it's gone, and now it's bad]
     - B) Keep it. It's a beloved tradition and traditions are important for school spirit. (B: Burkean)
     - C) We should be cautious about removing it because it might have other benefits we don't see, like giving students a break, so we should study it first. (S: Spontaneous-order)

  Question 7: The school proposes a new rule to recycle paper in every classroom. What do you think?
     - A) We should implement it because it's good for the environment. (R: Reformist)
     - B) We should first understand why we don't recycle already and what the effects might be before implementing it. (C: Chesterton - extending to new things? Or S? But Chesterton is about existing institutions. For new things, Chesterton might not apply directly. But we can see this as caution before change, so perhaps S or C. Let's assign to S: Spontaneous-order, because they are cautious about new changes due to unpredictability.)
     - C) I'm open to it if it's well thought out, but I worry about unintended consequences. (S: Spontaneous-order) [but we have B already]
     We need an option for B: Chesterton might say for a new rule, we should understand the current situation first? This is stretching Chesterton.

     Alternatively, rephrase:
     - A) Implement it. It's a good idea and we should make the change. (R)
     - B) First, study why we don't recycle and what the impacts of the new rule would be. (S: cautious about change)
     - C) I don't like new rules, so I'd rather not. (Q)
     But then Chesterton is missing. We can skip Chesterton for this question.

     Let's do:
     - A) Implement it. It's clearly beneficial. (R)
     - B) We should proceed carefully and test it in a few classrooms first to see what happens. (S)
     - C) I'm against it because it's a change. (Q)

     But then Burkean might be missing? Burkean is about preserving old traditions, not necessarily opposing new ones. They might be open to new things if they are slow and organic, but not by design.

     This is getting messy. Let's change the question to be about a new tradition.

     Question 7: The school wants to start a new tradition: an annual talent show. What do you think?
     - A) Great idea! Let's start it. (R: open to new things)
     - B) We should think carefully about why we need it and what effects it might have before starting. (C: Chesterton-like caution for new things? Or S)
     - C) I'm not sure; traditions should grow organically and not be designed. (B: Burkean might be skeptical of designed traditions)
     - D) I don't see the point; we don't need new traditions. (Q)

     Now:
     A) R
     B) S (cautious) or C (want to understand reason first)? We can assign B to S because it's about unpredictability.
     C) B (Burkean: traditions should be organic)
     D) Q

     Chesterton might not be directly covered, but we have him in other questions.

  Question 8: Your family has a tradition of eating the same meal every Sunday. It's not your favorite, but it's been done for generations. What do you do?
     - A) Keep doing it because it's tradition and connects you to your family's past. (B: Burkean)
     - B) Suggest changing the meal to something everyone likes better. (R: Reformist)
     - C) Find out why this meal was chosen originally, then decide if it's worth keeping. (C: Chesterton)
     - D) Keep doing it because you don't want to upset the routine. (Q: Status quo)

  Scoring:

  For each answer, assign points to the positions as follows:

  Q1:
  A: B
  B: R and C  (gives 1 point to R and 1 point to C)
  C: S

  Q2:
  A: R
  B: C
  C: B
  D: Q

  Q3:
  A: R
  B: B
  C: S
  D: Q

  Q4:
  A: S
  B: B
  C: C
  D: Q

  Q5:
  A: R
  B: C
  C: B
  D: Q

  Q6:
  A: R and C  (1 point to R and 1 to C)
  B: B
  C: S

  Q7:
  A: R
  B: S   [cautious about new change]
  C: B   [skeptical of designed traditions]
  D: Q

  Q8:
  A: B
  B: R
  C: C
  D: Q

  Now, we have to count the points. Since an answer might give points to two positions, we'll add one point to each of the specified positions for that answer.

  For example, if someone chooses Q1-B, they get one point for R and one for C.

  At the end, we sum the points for each position.

  The position with the highest score is their primary type.

  If there is a tie, they are a mix of the tied positions.

  If no position has more than, say, 2 points, they might be unclassified.

  But there are 8 questions, so total points per position can vary.

  We can also note that Burkean (B) and Spontaneous-order (S) might overlap in some answers, so if they have high in both, they are a mix.

  Similarly for R and C.

  Finally, we provide a description of each position.

