        - Census 4 (round4): 
            - Harbor silting: becomes 4 (initial 3+1)
            - Trade routes: becomes 4 (3+1)
            - Demographic trend: becomes 5 (no change)
            - Land tenure: becomes 6 (5+1)
        - Census 8 (round8): 
            - Harbor silting: becomes 5 (if no investment at census4) or 4 (if investment threshold met at census4)
            - Trade routes: becomes 5 (if no investment) or 4 (if investment threshold met)
            - Demographic trend: becomes 4 (5-1)
            - Land tenure: becomes 7 (6+1)
    - Final slow variables (after census8) are used for scoring.

  - For each group (4 groups):
    - Group resource sheet: tracks wealth, food, population. Start: (100, 50, 100)
    - Role cards: Diplomat, Merchant, Geographer, Chronicler
    - Geographer's notes: a sheet to record slow variables during censuses.
    - Chronicle sheet: for the Chronicler to record decisions and reasons.

  - Public: 
    - A visible round tracker.

  **Setup**:
    - Divide students into 4 groups of 4-5. Within each group, assign roles.
    - Give each group their materials.
    - Explain the three time layers: events (roundly), structures (census every 4 rounds).

  **Round Structure** (5 minutes per round):

    - Step 1: Event phase (3 minutes):
        - GM draws and reads the event card for the current round.
        - Groups discuss and choose a response. The Diplomat leads, but all can contribute. The Chronicler records.
        - GM announces the effects of each choice. Groups apply the effects to their resources.

    - Step 2: Resource update (1 minute):
        - Merchants update the resource sheet.

    - Step 3: Geographer's brief (1 minute):
        - The Geographer may speak for 30 seconds to the group about any long-term concern (using their notes from last census or their intuition). They can use one of their intervention tokens (if they wish) to speak longer.

    Census Rounds (rounds 4 and 8, allow 10 minutes each):

    - Step 1: GM reveals the slow variables board to the Geographers. Geographers from each group come to the GM's table to see the board and take notes.
    - Step 2: Geographers return to their groups and have 2 minutes to explain the current slow variables and their implications.
    - Step 3: Groups discuss for 3 minutes and decide on investments:
          - Harbor dredging: They can contribute wealth to a city-wide fund. If the total from all groups >= 100, then the next silting increase will be prevented (at census8 for investment at census4, or at the final update for investment at census8).
          - Trade promotion: Total >= 80 to prevent the next trade routes increase.
          - Additionally, at census8 only: groups can also invest in immediate improvements for the final scoring:
               - 30 wealth to reduce harbor silting by 1 (immediately after update)
               - 25 wealth to reduce trade routes by 1 (immediately after update)
    - Step 4: Groups report their investments to the GM. The GM then updates the slow variables for the current census (according to the update rules and whether the investment thresholds were met in the previous census) and then notes the investments for the next period (or immediate improvements).

    Note: At census4, the GM updates the slow variables to (4,4,5,6) as described, and then records the investments for the next period.
          At census8, the GM first updates the slow variables:
              - Harbor silting: 5 (if no investment at census4) or 4 (if investment met) -> then if groups invest in immediate improvement, reduce further.
              - Similarly for trade routes.
              - Then set demographic trend to 4 and land tenure to 7.
          Then, groups can do immediate improvements (pay 30 wealth to reduce silting by 1, etc.).

  **Final Scoring** (after round8):

    For each group:
        Score = 
          500 * (10 - harbor silting) / 10 +
          400 * (10 - trade routes) / 10 +
          300 * (demographic trend) / 10 +
          200 * (10 - land tenure) / 10 +
          wealth + population

    The GM calculates and announces scores.

  **Debrief Questions**:
    - What events do you remember? How did they affect your resources?
    - How did it feel to only see the slow variables every 4 rounds?
    - Geographers: how did it feel to have information but not be able to communicate freely?
    - Why are the slow variables more important in the final score?
    - How does this relate to Braudel's idea of events as "foam" and structures as the deep waves?
    - In real history, what might be examples of each tier?

  **What we couldn't simulate**: The timescale of the longue durée - in reality, it unfolds over centuries, making it imperceptible to individuals who experience it as "fate". Also, in the game, players could invest to mitigate structures, but in history, such opportunities are rare.

  **Core mechanic**: The separation of fast-paced event rounds with immediate resource impacts from infrequent census rounds that reveal gradually-changing structural variables, which dominate final scoring despite receiving less attention during gameplay.
