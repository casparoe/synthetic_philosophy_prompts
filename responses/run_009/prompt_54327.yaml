  ### Annales School Simulation: "The Foam and the Waves"  
  **Core mechanic:** Players manage immediate events while slow variables evolve imperceptibly, with infrequent census revelations forcing long-term strategic shifts despite event-driven distractions.

  ---

  ### **Game Setup**  
  **Groups:** Divide 18 students into 4 teams (4–5 players each). Each team controls a merchant family in a 16th-century Mediterranean trading city (e.g., Marseille, Genoa).  
  **Roles per Team:**  
  1. **Diplomat:** Responds to news cards (events). Leads debates.  
  2. **Merchant:** Tracks resources (coins, grain, population).  
  3. **Geographer:** Sole access to slow variables board during censuses. Limited to 3 "insight tokens" (30-second interventions) *outside* censuses.  
  4. **Chronicler:** Records decisions/justifications for debrief.  

  **Materials (Print in Advance):**  
  - **News Cards (×24):** 3 unique events per round (8 rounds total). Examples:  
    > **War Declared!** *Option A:* Pay war tax (lose 30 coins). *Option B:* Refuse (lose 15 population).  
    > **Famine in Hinterland:** *Option A:* Sell grain at markup (gain 40 coins, lose 10 population). *Option B:* Distribute aid (lose 20 coins, gain 5 population).  
  - **Slow Variables Board (Hidden):** Grid tracking 4 factors on a 1–10 scale:  
    | Factor          | Start | Round 4 | Round 8 |  
    |-----------------|-------|---------|---------|  
    | Harbor Silting  | 3     | +1      | +1      |  
    | Trade Routes    | 4     | -1      | -2      |  
    | Land Tenure     | 5     | +1      | +1      |  
    | Population Trend| 6     | -1      | -1      |  
  - **Resource Sheets (Per Team):** Track coins (start: 100), grain (start: 50), population (start: 100).  
  - **Geographer’s Census Notes:** Template to record slow variables during censuses.  
  - **Round Tracker:** Visible countdown (1–8).  

  ---

  ### **Rules**  
  **1. Round Structure (8 rounds × 7 mins each):**  
  - **Phase 1: Event Phase (4 mins)**  
    - GM draws 3 news cards; teams debate and choose *one* to resolve.  
    - Diplomat announces choice; Merchant adjusts resources.  
    - *Geographer may use 1 token to warn of long-term risks (e.g., "Beware coastal investments!").*  
  - **Phase 2: Resource Trade (2 mins)**  
    - Teams trade grain/coins with each other.  
  - **Phase 3: Geographer’s Brief (1 min)**  
    - Geographer shares *one sentence* based on last census (e.g., "Harbor worsens slowly").  

  **2. Census Rounds (Rounds 4 & 8; 15 mins each):**  
  - Geographers approach the hidden board, record variables, and report to teams.  
  - Teams debate long-term investments:  
    - **Dredge Harbor:** Pay 40 coins to *halt* silting increase next census.  
    - **Lobby for Trade:** Pay 30 coins to slow trade route decline.  
  - Slow variables update *after* decisions (see board above).  

  **3. Final Scoring (Dominance of Slow Variables):**  
  > **Score =**  
  > `(10 - Harbor Silting) × 30` +  
  > `Trade Routes × 20` +  
  > `(10 - Land Tenure) × 15` +  
  > `Population Trend × 10` +  
  > `Coins ÷ 10` + `Population ÷ 10`  
  > *Example:* A team with silting=7, trade=2, tenure=8, trend=4, 80 coins, 90 population scores:  
  > `(3×30) + (2×20) + (2×15) + (4×10) + 8 + 9 = 90+40+30+40+8+9 = 217`  

  ---

  ### **Debrief (15 mins)**  
  - **Map Game to Braudel:**  
    - **Événements:** News cards (e.g., wars, famines) = "foam" – urgent but fleeting. Teams spent 80% time here.  
    - **Conjunctures:** Resource trades = medium-term cycles (price shifts, alliances).  
    - **Longue Durée:** Harbor silting/trade routes = invisible structures. Teams realized too late that these decided 70% of scores.  
  - **Geographer’s Role:** Mimics how geography/climate whisper to historians through fragments (e.g., port records). Tokens = rare "aha!" moments in archives.  
  - **Unsimulatable Element:** **Timescale.** Players *knew* censuses came every 4 rounds, but irl, the *longue durée* unfolds over lifetimes, feeling like "fate." No classroom game can replicate the despair of a silted harbor your grandfather ignored.  

  ---

  ### **What Will Go Wrong**  
  1. Teams will ignore the Geographer until Round 4, then panic when silting is already at 4/10.  
  2. Merchants will hoard coins, underestimating how land tenure (e.g., consolidation=higher rents) cripples final scores.  
  3. One group will spend all tokens in Round 1 on a pirate raid – missing the silent trade route collapse.  

  **Core mechanic:** Censuses force players to confront slow variables’ cumulative power after event-driven myopia, mirroring Braudel’s "history from below."
