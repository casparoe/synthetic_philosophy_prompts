answer: |-
  ## Dialogue: The If-Files

  **Setting:** A worn oak table in the back corner of "The Modal Bean," coffee steaming between two philosophers. Callum leans forward, gesturing animatedly. Ines sips her espresso, calm but attentive.

  **Callum (Disunified View - Adams/Edgington):** ...and that's precisely why I find Stalnaker's unification misguided, Ines. Indicative "if" isn't pointing to worlds; it's expressing a *constraint* on my current beliefs. It's *assertible* to the degree that adding the antecedent makes the consequent highly probable *now*. Counterfactuals? Different beast entirely. They *are* about worlds – specifically, the closest worlds where the antecedent is true, governed by similarity to actual causal history. Trying to shoehorn both into the same truth-conditional box misses the fundamental functional difference.

  **Ines (Unified View - Stalnaker):** Functional difference? Or just a difference in the *modal base* and *ordering source*? Callum, you're creating unnecessary complexity. Both moods involve a selection function: `If A, then C` says that in the *closest* A-worlds (according to the relevant context), C holds. For indicatives, the "closest" means "most epistemically accessible given our current knowledge." For counterfactuals, it means "most similar in causal history, minimally deviant." The *operator* is the same; the *ordering* shifts. Your assertibility just *is* the high probability assigned to the selected C-worlds under the indicative ordering. Let's test this. Your Hamlet case first?

  **Callum:** Gladly. "If Shakespeare didn't write Hamlet, someone else did." Sounds perfectly fine. Why? Because *given what we know about history and literary production*, supposing Shakespeare didn't write it, it's overwhelmingly probable *someone* must have – it exists! My conditional probability P(Someone Else | ~Shakespeare) is near 1. Now the counterfactual: "If Shakespeare hadn't written Hamlet, someone else would have." That sounds jarringly false. Why? Because the closest worlds where Shakespeare *doesn't* write it aren't worlds where Bacon or Marlowe secretly penned it – that requires massive, *gratuitous* deviation. The closest worlds are ones where *that specific play simply isn't written at all*. Minimal causal bump: Shakespeare gets distracted, dies young, becomes a cobbler. The play vanishes. Hence, false. Simple.

  **Ines:** Simple? Or *ad hoc*? You simply *stipulate* that the closest worlds have no play. But why? The play *exists* in actuality. Worlds where it exists but is misattributed involve a *local* change (a document lost, a conspiracy) and preserve the *fact* of the play's existence, a major causal and historical feature. Worlds where the play *isn't written* require a massive deviation in Shakespeare's life or motivation, affecting countless other things. By *my* similarity metric – minimizing overall, especially *big*, causal divergence – the closest ~Shakespeare worlds *are* misattribution worlds. Your counterfactual *is* true! Its oddness is pragmatic: uttering a counterfactual presupposes the antecedent is false, which highlights the *actual* causal chain making Shakespeare essential. Saying "would have" feels like denying that essentiality, hence the infelicity. My explanation uses standard similarity and pragmatic implicature. Yours requires an arbitrary preference for 'play nonexistence' worlds over 'misattribution' worlds as 'closer'. *That* feels ad hoc.

  **Callum:** Pragmatics carrying a lot of weight there, Ines. But okay, let's move to the rain. "If it rains tomorrow, the match will be cancelled." Indicative. Clear. I'm saying *conditional on my current information*, rain makes cancellation highly probable. Now, "If it were to rain tomorrow, the match would be cancelled." Counterfactual mood, same event. Yet this *suggests* the speaker thinks rain is unlikely, or at least takes the possibility less seriously. How do you explain *that* with your unified semantics? If both are about the same future rain-worlds, your "closest" ordering for the indicative (epistemic) and counterfactual (causal?) should be identical here – the future is open! Where does the difference in *felt commitment* come from?

  **Ines:** Ah, but the modal base *does* shift subtly. The indicative uses our *current knowledge base*, which includes the *genuine openness* of tomorrow's weather. The "will" reflects probability within that epistemic uncertainty. The "would" version, using the counterfactual mood, subtly *shifts* the context. It treats the rain as a *more remote* possibility, effectively placing it slightly further out in the modal landscape. It's not that the worlds are different; it's that the *ordering* for the counterfactual mood primes us to consider worlds *deviating* from the expected course. By using "were to" and "would," the speaker signals they are considering a scenario *contrary to their current expectation* (even if that expectation isn't certainty). Your view strains more here, Callum. What "probability" are you even reporting with the counterfactual? It's not your *actual* conditional probability given rain – that's captured by the indicative. The counterfactual mood seems to be doing something *else* – signalling modal distance – which my view captures via the conventional shift towards a more 'deviant' ordering source, even for the future. You need a separate assertibility rule *just* for future subjunctives?

  **Callum:** Fair challenge. With the future subjunctive, I might say it expresses *robustness*: even in scenarios *further out* from my current center of expectation (but still epistemically possible), cancellation follows. But it's a trickier case for me, I grant you. Now, the match sequence. Counterfactual first: "If you had struck the match, it would have lit." True? Presumably yes, it was dry. "True, but if you had struck it and it had been soaked, it wouldn't have lit." Also true. "Still, if you had struck the match, it would have lit." Sounds fine! We understand the first claim wasn't meant *absolutely*; it was conditional on normal circumstances. The 'soaked' scenario is a *further*, more remote deviation. Now run it indicatively: "If you strike it, it will light." "But if you strike it while it's soaked, it won't." "Still, if you strike it, it will light." *That* sounds terrible! The speaker seems stubbornly ignoring the qualification. Why? On my view, it's clear. The first indicative *asserted* a high conditional probability: P(Light | Strike). The second sentence *provides new information* that drastically lowers the probability of Light *given* Strike *and* Soaked. Crucially, it also *raises the possibility* that the match *is* soaked! This *updates* the relevant probability space. Reasserting the original claim *ignores* this update. The high P(Light | Strike) *no longer holds* in the updated belief state. Your unified truth-conditions struggle. If both indicatives use the *same* selection function based on current knowledge, why can't I just reassert that in the closest strike-worlds (presumably dry ones), it lights? What changed?

  **Ines:** Contextual *reordering*, Callum! The second sentence changes the context dramatically. By introducing the "soaked" possibility seriously, it forces us to *reconsider* what the "closest" strike-worlds are *within our current epistemic state*. Initially, the closest strike-worlds were dry. But after the rebuttal, the speaker has highlighted that *among the possibilities we now take seriously*, strike-worlds *include* soaked ones. The selection function must now consider this broader set. The original assertion was implicitly restricted to *normal* conditions. The rebuttal removes that restriction. To reassert the original, unconditional-sounding indicative *without qualification* implies that *even within the newly expanded context including soaked possibilities*, the closest strike-worlds are *still* dry and light. But that's precisely what the rebuttal *denied* by making soaked worlds salient! It sounds shifty because it ignores the contextual update. The counterfactual sequence works because the *ordering* for counterfactuals is anchored to *actual causal facts* (the match *was* dry). Adding "had been soaked" considers a *different*, *more deviant* set of worlds. Reasserting the original counterfactual refers back to the *less deviant*, primary alternative where it was struck *as it actually was* (dry). The indicative has no such anchor; its "closest" is always dynamically tied to the evolving context of what's seriously considered possible *now*.

  **Callum:** Hmm. A dynamic shift in the selection function... that feels perilously close to abandoning stable truth-conditions mid-discourse, but I see how it might work. It still seems like you're mimicking my probabilistic update with a contextual redefinition of 'closest'. Very well. Enough sparring. What would make you abandon your unified view, Ines?

  **Ines:** A clear, unequivocal case where an indicative conditional embeds in a truth-apt context (like negation, a belief report, or antecedent of a higher conditional) in a way that *cannot* be handled by the selection function semantics *and* where your assertibility account provides a demonstrably superior explanation of the embedding behavior. If we found indicatives behaving systematically like non-truth-conditional devices under embedding, resisting any coherent possible-worlds analysis, that would be fatal. Your turn. What kills your disunified view?

  **Callum:** A case where a counterfactual demonstrably *lacks* truth value under your similarity semantics, yet we have strong intuitions about its correctness or incorrectness based purely on *conditional chance* at the relevant time. Or conversely, if we found an indicative that *must* be interpreted as describing a specific, non-epistemic, historical or causal connection between non-actual events, resisting any probabilistic assertibility reading. Finding "if" doing genuine historical work without the counterfactual mood would be deeply problematic for me. More coffee?

  **Ines:** Always. This match isn't over, Callum. Pass the sugar.

  *(They continue, the debate shifting to the sugar's role in the counterfactual stability of the coffee's taste profile.)*
