  ### Step 1: Brainstorming Candidate Principles from Dr. R's Existing Verdicts
  Dr. R's verdicts reveal a pattern that rules out some popular theories of biological function while fitting others. I'll start by summarizing her rulings and then identify which general principles align with all of them. The key theories considered are:
  - **Selected-effect (SE) theories**: A trait has a function if it was shaped by natural selection for that effect (e.g., Wright, Millikan, Neander). Variants include "modern-history" SE (focusing on recent selection) and "maintenance" SE (focusing on current selection maintaining the trait).
  - **Causal-role (CR) theories**: A trait has a function if it contributes to a system's capacity (e.g., Cummins), regardless of history.
  - **Propensity theories**: A trait has a function if it currently enhances fitness or is likely to be selected in the future (e.g., Bigelow and Pargetter).
  - **Dispositional accounts**: Similar to CR but emphasizes inherent dispositions (e.g., Canfield). Often conflated with CR in practice.
  - **Goal-contribution theories**: Functions are contributions to organismal goals like survival or reproduction (e.g., Boorse). These often overlap with SE or propensity views.

  **Dr. R's Verdicts and Implications**:
  1. **Healthy mammalian heart pumping blood**: Function = yes.  
     - Fits SE (selected for pumping blood), propensity (currently enhances fitness), and CR (causal role in circulation).  
  2. **Vestigial whale pelvic bones**: No function.  
     - Rules out pure CR and dispositional accounts, as these would assign a function if the bones have *any* causal effect (e.g., anchoring muscles). Also rules out strictly *historical* SE (e.g., only ancient selection), as the bones had a past function but no longer do.  
  3. **Degraded human pseudogene**: No function.  
     - Consistent with SE (no current or recent selection), propensity (no fitness contribution), and CR (no causal role, as pseudogene is non-functional).  
  4. **Beta-lactamase gene in bacteria**: Function = breaking down antibiotic.  
     - Fits modern-history/maintenance SE (selected recently in the antibiotic environment), propensity (currently enhances fitness), and CR (causal role). Rules out strictly historical SE that requires distant selection.  
  5. **Flightless cormorant feathers**: Function = insulation, not flight.  
     - Fits SE (feathers maintained by selection for insulation, not flight), propensity (insulation currently enhances fitness, flight does not), and CR (causal role in insulation).  
  6. **Human chin**: No function.  
     - Fits SE (not selected for any effect; a byproduct), propensity (no significant fitness contribution), and CR (no critical causal role). Reinforces that causal effects alone are insufficient.

  **Candidate Principles That Fit All Verdicts**:
  - **Modern-history SE (with maintenance focus)**: A trait has a function F if it was selected for F in the recent past or is currently maintained by natural selection for F. This fits all cases: heart (selected), whale bones (not maintained), pseudogene (not maintained), beta-lactamase (recently selected), cormorant feathers (maintained for insulation), chin (not selected/maintained).
  - **Propensity theory**: A trait has a function F if it currently enhances fitness by doing F. This fits: heart (enhances fitness), whale bones (no fitness enhancement), pseudogene (no fitness enhancement), beta-lactamase (enhances fitness), cormorant feathers (insulation enhances fitness, flight does not), chin (no fitness enhancement).

  **Ruled-Out Readings**:
  - **Pure CR/dispositional accounts**: Ruled out by whale pelvis and chin verdicts, as CR would assign a function for any causal role (e.g., structural support), but Dr. R denies this.
  - **Strictly historical SE** (e.g., requiring selection in distant ancestors): Ruled out by beta-lactamase verdict, as the function arose recently.
  - **Goal-contribution without selection**: If goals are defined purely non-historically (e.g., Boorse), it would conflict with whale pelvis and chin rulings, as byproducts could contribute to goals.

  **Surviving Principles**:
  1. **Modern-history SE** (including maintenance): Selection history (recent or ongoing) is necessary.
  2. **Propensity theory**: Current fitness contribution is sufficient.

  Both fit the track record, but they diverge on cases without selection history but with current benefits.

  ### Step 2: Predictions for the Four New Cases
  For each case, I'll:
  - Explain what each surviving principle predicts.
  - Give my best guess for Dr. R's verdict, based on her pattern.
  - Note if her existing verdicts settle the case or if there's ambiguity.

  #### Case 1: De novo mutation in a lab mouse
