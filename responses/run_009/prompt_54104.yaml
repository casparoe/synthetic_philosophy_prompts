prompt: |-
  Ok so in my civics class we were arguing about whether our city should switch the school board election to ranked choice, and at some point the class basically split into two camps over whether ranked choice actually reduces spoiler effects. That's when this guy Marcus goes "wisdom of crowds, right? Condorcet mathematically proved that if you ask enough people, the majority is almost certainly correct, so we should just take a class vote and whatever the majority says, that's basically the truth." He'd already impressed everyone that same week with a jelly bean jar at the club fair — our class average guess was closer than any single person's, some people were off by like hundreds of beans and the average was only off by 4. So now half the class thinks any question can be settled by majority vote, and the other half thinks that's nuts, and I'm stuck in the middle because I can't tell how many separate claims are actually hiding inside "the wisdom of crowds."

  Can you lay out the different precise claims that slogan could be making, as a list I could bring to class? For each one I want to know whether it's trivial, contentious, or straight up false, and — this is the part I actually care about — which of them can carry the weight Marcus put on it. Like, which claim did the jelly bean thing even support? That seems like averaging a bunch of estimates, and I'm not sure that's the same thing as the theorem he cited. And is there any reading of the slogan under which a majority of a bunch of high schoolers who haven't done the reading settles a factual question better than asking the one person who has? If some readings only work when every voter is already better than a coin flip, or when their mistakes are independent, or when the question has a real true/false answer instead of being partly about which system is *fairer* — flag that too, because our class vote mixed factual claims and value stuff and I'm pretty sure Marcus was using one result to cover both. Also correct me if I've misdescribed what the theorem says, but dont assume I know the math, explain it like I'm 17.
reasoning: |-
  Okay, the user is a high school student in a civics class debate about ranked-choice voting and the wisdom of crowds. They're confused about Marcus's argument that Condorcet's theorem proves majority vote always finds the truth, especially after the jelly bean demonstration. 

  First I need to unpack why the user feels "stuck in the middle" - they intuitively sense Marcus is overreaching but can't articulate why. Three layers here: the jelly bean example (measurable fact), Condorcet theorem (binary truth), and the actual school board debate (value judgment mixed with facts). The user's smart enough to notice these aren't interchangeable but needs terminology to prove it.

  Hmm... Marcus made a classic category error. The jelly bean jar is an estimation problem (continuous quantity) while Condorcet deals with discrete choices between options. And neither applies cleanly to policy debates. User's suspicion about "mixed factual and value stuff" is spot-on - that's the core flaw in Marcus's argument. 

  For the response structure: Should start by separating the three distinct "wisdom" claims (estimation, binary truth, group preferences) since that's what they requested. Then explicitly map which ones the jelly bean experiment actually supports (only estimation). Need to visually highlight why Condorcet's jury theorem fails for their voting debate - especially the independence and competence assumptions. 

  Key nuance: When explaining Condorcet, must emphasize that "better than coin flip" means each voter must have >50% probability of being correct, which is unrealistic for complex issues. And for policy votes, there's no "correct" answer to converge to! Should use their high schooler example: If 90% of class thinks photosynthesis happens in mitochondria, majority vote won't fix that. 

  ...Wait, also need to address why the jelly bean average worked. It's about canceling random errors - some overestimate, some underestimate. But systematic errors (like everyone misremembering a fact) won't cancel out. That's crucial for why it wouldn't work on their civics question where everyone shares the same misinformation sources. 

  Final thought: User's asking for "which claims can carry the weight" - so the conclusion should explicitly rank the three claims by robustness. Estimation is strongest, Condorcet is fragile, group preference is weakest. And tag which assumptions break in their specific debate scenario.
answer: |-
  You're absolutely right to be skeptical - Marcus is conflating several distinct ideas under the "wisdom of crowds" slogan, and **none** of them support using a class vote to settle complex factual or normative questions like electoral systems. Let's break this down with a precise list of claims:

  ### Core Claims Hidden in "Wisdom of Crowds"
  1.  **Estimation Averaging (The Jelly Bean Claim):**
      *   **Claim:** When many people independently estimate a *quantifiable fact* (like the number of jelly beans), the *average* of their guesses will often be surprisingly accurate, even if most individual guesses are wildly wrong.
      *   **Truth Status:** **Generally True** under specific conditions.
      *   **Weight it Can Carry:** High for measurable quantities. This is what the jelly bean demo proved.
      *   **Crucial Conditions:**
          *   **Independence:** Guesses aren't influenced by each other.
          *   **Diversity:** People have different information/knowledge/biases.
          *   **Decentralization:** No single error dominates.
          *   **Aggregation Method:** Averaging works best for quantities. *This is NOT majority vote.*
      *   **Relevant to Your Debate?** No. School board elections aren't a quantifiable fact to be averaged.

  2.  **Condorcet's Jury Theorem (Marcus's Citation - Binary Truth):**
      *   **Claim:** If a group is voting on a single *binary* choice (True/False, Option A/Option B) where *one option is objectively correct*, and each voter has a better-than-50% chance of voting correctly *independently*, then:
          *   The *majority vote* is more likely to be correct than any single voter.
          *   As the group size increases, the probability the majority is correct approaches 100%.
      *   **Truth Status:** **Mathematically True** *if the strict conditions hold*.
      *   **Weight it Can Carry:** High *only* for clear-cut, objective, binary factual questions *if* voters are slightly competent and independent. Fragile otherwise.
      *   **Crucial Conditions (Where Marcus Goes Wrong):**
          *   **Objectively Correct Answer:** There *must* be a verifiable "correct" choice (e.g., "Is this coin fair?"). **This fails utterly for your debate.** "Does RCV reduce spoilers?" mixes factual analysis (studies on RCV) with definitions and complex causality. "Which system is *fairer*?" is entirely subjective/normative. *Condorcet does NOT apply to opinions or values.*
          *   **Voter Competence > 50%:** Each voter must be more likely right than wrong *on their own*. For complex civics/policy questions, this is highly contentious. Many voters may be misinformed, biased, or lack expertise (including high schoolers who haven't studied the evidence).
          *   **Independence:** Voters' judgments aren't swayed by others, shared misinformation, or groupthink. Often false in practice (especially in a class discussion!).
          *   **Binary Choice:** The theorem applies to A vs. B, not nuanced policy analysis with multiple dimensions.
      *   **Relevant to Your Debate?** **No.** The lack of a single objectively "correct" answer on fairness/institutional design and the unlikelihood of each student being independently >50% competent on this specific issue invalidate its use here.

  3.  **Group Preference Revelation (What Voting Actually Does):**
      *   **Claim:** Aggregating individual *preferences* (via voting) reveals the *group's collective preference*. Majority vote (or RCV, etc.) is a *fair procedure* for making *collective decisions* when there's no single "truth," only differing values and opinions.
      *   **Truth Status:** **Not about truth, it's about procedure.** Majority vote is a legitimate democratic method for group decisions. It reveals "what the group wants," not "what is factually true."
      *   **Weight it Can Carry:** High for making legitimate *decisions* based on group will. Zero for determining factual truth.
      *   **Relevant to Your Debate?** Yes, but Marcus misused it. A class vote could decide *which policy the class prefers* or *which argument they find more persuasive*. It **cannot** decide *which argument is factually correct* about spoiler effects. Voting reveals preference, not truth.

  4.  **"Crowds are Smarter than Experts" (Overreach Claim):**
      *   **Claim:** The collective judgment of a large group of non-experts is *always* or *generally* superior to that of a single expert on complex issues.
      *   **Truth Status:** **Mostly False / Contentious.** Works well for estimation (jelly beans) or simple factual aggregation ("Where's Waldo?"). Fails catastrophically for specialized knowledge requiring deep expertise, complex analysis, or dealing with misinformation. (Would you poll the class on how to do heart surgery?).
      *   **Weight it Can Carry:** Very low, except in the specific contexts of Claims 1 & 2 under their strict conditions.
      *   **Relevant to Your Debate?** Marcus implied this. It's false in this context. The student who did the reading likely has a *better* understanding of RCV's documented effects than the uninformed majority.

  ### Directly Addressing Your Questions

  *   **What did the jelly bean prove?** Only **Claim 1 (Estimation Averaging)**. It showed averaging independent guesses for a measurable quantity works well. It has nothing to do with majority vote, Condorcet, or voting on policies/truth.
  *   **Can a majority of uninformed high schoolers settle a factual question better than an expert?** **Generally, NO.** *Unless* the strict conditions of Condorcet's Jury Theorem miraculously hold (objectively correct binary answer + each voter independently >50% competent) – which is highly unlikely for complex factual questions and impossible for value judgments. The expert (or well-read student) is almost certainly more reliable on the specific facts.
  *   **What about mixed factual/value questions (like your debate)?** This is the **fatal flaw** in Marcus's argument. Voting (majority or otherwise) can reveal the *group's preference* or *collective opinion* on the value aspects ("Which system *do we think* is fairer?"). It **cannot** determine the *factual truth* ("Does RCV *actually* reduce spoilers?"). Conflating these is why the class vote is useless for settling the truth claim. You'd need to examine evidence (studies, data) for the factual part.
  *   **Did I misdescribe Condorcet?** Your understanding is good! The key points you grasped: it requires an objectively correct answer, voters better than random, independence, and gets stronger with more voters. Your instinct that it doesn't apply to values or complex mixed questions is correct.

  ### The Bottom Line for Your Class
  *   **Jelly Beans:** Proves averaging independent estimates works for *quantities*. Not relevant to voting or truth-finding in debates.
  *   **Condorcet:** Proves majority vote finds *objective binary truth* only if voters are independently slightly competent. **Does not apply** to your debate about RCV/spoilers because there's no single "correct" answer (it's mixed fact/values) and voter competence/independence is doubtful.
  *   **Voting:** Excellent for revealing *group preferences* and making *collective decisions*. Terrible for determining *factual truth* on complex or normative issues.
  *   **Marcus's Overreach:** He used a cool demo (jelly beans = Claim 1) and a cool theorem (Condorcet = Claim 2, misapplied) to argue for Claim 4 ("crowds are always smarter"), which is false, and then used *that* to justify using voting (Claim 3) to find *truth* on a mixed question, which it cannot do.

  **What to say in class:** "The jelly bean trick works because errors cancel out when you average *guesses about a number*. Condorcet's math only works if there's a single right answer and everyone is slightly more likely than not to get it right *on their own*. Deciding if ranked-choice voting is better mixes facts about how it works with opinions on what's fair. Voting tells us what the group *prefers*, not what's factually true about spoiler effects. To settle the facts, we need evidence, not a vote."
