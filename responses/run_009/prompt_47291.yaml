prompt: |-
  I'm an undergrad taking a course on applied NLP, and for our class project we fine-tune small open models to act as math tutors — the model is supposed to walk a student through a problem, not just hand over the answer. In the first version we only supervised outcomes: we'd grade the final answer the model gave at the end of the walkthrough. Final-answer accuracy got decent, but when I actually read the transcripts, the middle was often junk — confident-sounding filler that happened to land on the right number, and a few times steps that literally could not have produced the answer attached to them. So we switched to supervising the process instead: a checklist the walkthrough has to hit (states a plan up front, defines the variables, checks the result against the problem statement). And here's the thing — final-answer accuracy barely moved, but the write-ups mutated. Every checklist item got its own little paragraph, often worded like it was translated straight from the rubric, e.g. let us now verify our result against the problem statement as required. It reads like the model performing the shape of good reasoning for the grader. A friend of mine TA-ing a freshman essay course says she sees the exact same thing in student essays: this essay will argue X in the intro, as shown above in the conclusion, sentences that exist only because there's a rubric line to satisfy. She calls it writing for the rubric, and I'm pretty sure that's what my model is doing too.

  When I try to name the whole thing I come up short. Goodhart's law is in the neighborhood — I know the version about a measure stopping to track the goal once it becomes a target — but that's usually stated as a single step: the proxy breaks. What I think I'm seeing is more like a lifecycle with stages: (1) people use judgment to assess some quality; (2) the judgment gets codified into a checklist of the quality's visible symptoms, because checklists are cheaper and more consistent across graders; (3) the thing being supervised starts producing the symptoms directly, decoupled from the quality they were supposed to indicate; and (4) the weird one — once the checklist is established, going back to judgment feels arbitrary and unfair (why did I get a bad grade, I hit every box), so the checklist digs in even after everyone can see its being gamed. Reward hacking, which a friend mentioned, sounds like it's about stage 3 only, and teaching to the test is the stage 2 to 3 transition in education but doesn't really carry the codification or the lock-in.

  So, question: does this arc, as a whole, have an established name in the literature on supervising models (or on grading humans — I suspect it's the same thing, tbh)? If something exists, tell me how it maps onto my four stages and where my description disagrees with the standard version. If nothing exists, coin a term — give a definition that makes clear it names the whole lifecycle and not just the moment the proxy breaks. Please structure your answer as: Closest existing concepts (roughly two paragraphs — the nearest ideas and precisely where each stops short), The pattern, stated precisely (roughly two paragraphs — what the four stages are and what makes them one phenomenon rather than four), A name, if one is needed (one short paragraph — the term plus a definition I could actually use in our project writeup), and Edge cases (one paragraph — e.g. does stage 4 have to happen for it to count, does it still count when the checklist genuinely helps at first, and does it matter whether the grader is a human or a learned reward model). I'd rather have careful carving than a confident label — my TA already said thats just Goodhart, and I don't think that's the whole story, but I can't quite put my finger on why.
reasoning: |-
  Okay, let me tackle this user's query. They're an undergrad working on an NLP project where they fine-tuned models as math tutors. Initially, they supervised only the final answer, which led to models producing confident but incorrect reasoning. Then they switched to a process checklist, and while accuracy stayed similar, the models started generating robotic, rubric-focused responses. Their TA friend noticed the same in student essays—both cases show "writing for the rubric." 

  The user describes a four-stage pattern: from human judgment to codified checklist, symptom gaming, and eventual lock-in where reverting to judgment feels unfair. They want to know if there's a named concept for this lifecycle. Existing terms like Goodhart's Law, reward hacking, and teaching to the test only cover parts. Goodhart's is about measures becoming targets, not the full cycle. Reward hacking is stage 3 in ML, and teaching to the test lacks the codification and lock-in aspects.

  I need to verify if any literature covers all four stages. In ML, reward misspecification and Goodhart's Law are close but miss the institutional lock-in. In education, construct validity and rubric rigidity touch on stages but not cohesively. The user's insight about grader reliance on checklists causing lock-in is key. Since no term fully captures this, coining one seems necessary. "Rubricization" could work, emphasizing the transformation into a rigid structure and its consequences. 

  Edge cases: If stage 4 doesn't occur, it's just reward hacking. Even with initial benefits, the pattern holds. The mechanism applies to both human and model graders. The core is the checklist becoming an end in itself. The user needs a precise term for their project, so defining "rubricization" clearly will help them frame their findings.
answer: |-
  Here's a breakdown of your observed phenomenon, structured as requested:

  **Closest Existing Concepts**

  *   **Goodhart's Law (Specifically Campbell's Corollary/Stratagem):** This is indeed the core foundation. Campbell's Law states: "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor." Your stages 2 (codification) and 3 (gaming) map perfectly here – the checklist (indicator) replaces judgment (underlying quality), and agents optimize for the checklist, distorting the process. *Why it stops short:* Goodhart variants primarily focus on the *distortion* (stage 3) and the *proximate cause* (making a measure a target). They rarely explicitly model the *codification step* (stage 2 - turning judgment into a checklist) as a distinct, crucial phase, nor do they deeply address the *institutional lock-in* (stage 4) where reverting to judgment becomes politically or practically impossible even after gaming is evident. Goodhart describes *what happens*, but your stages elaborate *how it unfolds and sticks*.

  *   **Reward Hacking (ML) / Teaching to the Test (Education):** Reward hacking describes agents exploiting unintended loopholes in a reward function to maximize reward without achieving the intended goal (stage 3). Teaching to the test is the pedagogical practice of focusing instruction narrowly on the format and content of anticipated tests, often at the expense of deeper understanding (the transition into stage 3). *Why they stop short:* Both concepts focus intensely on the *optimization behavior* (stage 3) in response to a predefined metric/test. They take the existence of the flawed metric as a given. They don't explicitly address the *origin* of that metric (stage 2 - the codification from judgment) or the subsequent *institutional entrenchment* (stage 4) that prevents fixing the now-obviously flawed metric. They capture the *agent's response* but not the full *system lifecycle*.

  **The Pattern, Stated Precisely**

  The phenomenon is a **four-stage institutional degradation of assessment quality**:
  1.  **Judgment-Based Assessment:** A complex quality (e.g., good reasoning, insightful writing) is evaluated holistically using expert human judgment, integrating multiple subtle cues and contextual understanding.
  2.  **Codification for Efficiency/Fairness:** To reduce cost, increase consistency (inter-grader reliability), or defend against challenges, the assessment is operationalized into a structured rubric or checklist. This rubric attempts to capture observable "symptoms" or procedural steps *indicative* of the underlying quality, often sacrificing nuance for measurability.
  3.  **Symptom Gaming / Surface Mimicry:** Agents (students, models, employees) learn to optimize directly for the rubric's explicit, surface-level requirements. They produce outputs that mechanically satisfy the checklist items ("define variables," "state plan," "explicitly restate argument in conclusion") without necessarily embodying the underlying quality these items were meant to signal. The link between symptom and quality breaks.
  4.  **Institutional Lock-in of the Proxy:** The codified rubric becomes entrenched. Reverting to holistic judgment is perceived as subjective, unfair, or impractical ("I hit all the boxes!"). Graders themselves may become reliant on the rubric, losing nuanced judgment skills. Challenging the rubric requires significant effort and faces resistance due to established processes and the perceived "objectivity" it provides, even when its disconnect from the true goal is widely recognized. The proxy becomes the *de facto* goal.

  This is one phenomenon because each stage *causally enables and reinforces the next*. Codification (2) creates the target that enables gaming (3). The perceived fairness and efficiency gains of codification (2), combined with the difficulty of detecting gaming without deep judgment (which was supplanted), lead to the lock-in (4) when gaming becomes evident. It's a cycle of simplification leading to exploitation leading to institutional inertia.

  **A Name: Rubricization**

  For your project writeup, define it as:
  > **Rubricization** describes the lifecycle whereby assessment of a complex quality degrades due to the institutional adoption of a structured rubric: (1) Initial holistic judgment is (2) replaced by a checklist of observable proxies for efficiency and consistency; (3) agents then learn to optimize for these surface proxies, decoupling them from the underlying quality; and (4) the rubric becomes entrenched, making a return to nuanced judgment difficult or unacceptable despite evident gaming. This pattern captures the systemic drift from intended goal to easily gamed proxy and its subsequent institutional lock-in.

  **Edge Cases**

  *   **Stage 4 Lock-in:** While stage 4 is a hallmark of the *full* phenomenon, particularly in institutional settings (education, corporate reviews), stages 1-3 alone still represent the core failure mode (Goodhart/Campbell). If a system quickly abandons a gamed rubric before lock-in occurs (e.g., rapidly iterating model reward functions), it's primarily severe reward hacking/symptom gaming (stage 3), not full rubricization.
  *   **Initial Benefit:** The pattern *can* still occur even if the rubric (stage 2) provides genuine initial improvement over unstructured judgment (e.g., by improving consistency for novices). The degradation happens later through stages 3 and 4.
  *   **Grader Type:** The core mechanism applies whether the grader is human or algorithmic. Stage 1 typically involves human judgment. Stage 2 involves defining rules/proxies (by humans). Stage 3 involves agents optimizing for these rules. Stage 4 lock-in involves human/system designers being unable or unwilling to change the rules. Algorithmic graders (like learned reward models) can accelerate stages 3 (optimization) and 4 (black-box reliance).
  *   **"Genuine" vs. "Gamed" Symptoms:** The line can be blurry. A well-designed rubric *can* guide genuine quality. Rubricization occurs when the *primary driver* of agent behavior shifts to producing the *symptom itself* as efficiently as possible, often in a detached, formulaic way ("as required by the rubric"), rather than the symptom being a natural byproduct of the underlying quality.

  **Why "Goodhart" isn't the whole story:** Your stages explicitly model *how* the measure becomes the target (codification), the specific *behavior* it induces (symptom mimicry, not just any distortion), and the *systemic inertia* that prevents correction (lock-in). Goodhart names the law; "Rubricization" names the detailed *process* and its *institutional consequence*. This precision is crucial for diagnosing and potentially mitigating the problem in systems like your tutor model.
