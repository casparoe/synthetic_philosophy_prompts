  **Final Game Structure:**

  **Setup (10 minutes):**
  - Move desks so pairs are facing each other.
  - Explain the overall idea: they are playing a game of crisis bargaining over points that will count toward their participation grade. They will play three parts.

  **Part 1: Veto Game (10 minutes)**
  - Each pair has 100 points to split.
  - They have 3 minutes to negotiate.
  - If they agree on a split, they get that.
  - If they don't agree, they simultaneously and secretly write "ACCEPT" or "VETO":
    - If both accept, they split 50-50.
    - If at least one vetoes, both get 0.
  - Run the game. Then have them record the points.

