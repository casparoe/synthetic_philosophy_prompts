  We are designing an experiential learning game to illustrate the paradox of nuclear deterrence: that the capacity to lose control can be a bargaining asset. The game should have three parts:

  1. **Basic Crisis Bargaining (Veto Game):** Pairs of students bargain over a prize. Each can veto any deal, but vetoing destroys the prize for both (mutually assured destruction). They should discover that the veto is worthless because using it is worse than conceding.

  2. **Tripwire Game:** Each player must publicly set a "tripwire" (a declared line). If the opponent crosses it, the escalation decision is handed to a random device (e.g., a die roll) that can lead to catastrophe. The idea is that nobody chooses catastrophe, but it can happen by chance. This should show that a threat that leaves something to chance can be more credible than a fully controlled threat.

  3. **Repeated Play with Reputation:** Multiple rounds (crises) with the same pairs, where reputations carry over. Being known to have a "hair trigger" (i.e., setting a tripwire early) should start to pay off.

  Key constraints: 
  - 18 students, 75 minutes, movable desks, no budget.
  - Tools: stopwatch, index cards, dice.
  - No Cold War history needed; the game must stand alone.
  - Build in uncertainty: imperfect information about payoffs or resolve.

  **Design Considerations:**
  - **Time:** 75 minutes total. We need to allocate time for setup, three game segments, and debrief. Let's aim for:
