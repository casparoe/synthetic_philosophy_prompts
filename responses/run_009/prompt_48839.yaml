    - Part 1: Why didn't they use the veto? Because it's self-destructive. So a fully controlled threat is not credible.
    - Part 2: How did the tripwire change the dynamic? If you set a high tripwire, you might force the opponent to offer more, but if they call your bluff and offer less, you risk catastrophe. However, the threat is more credible because it's not entirely under your control.
    - Part 3: Did students who set high tripwires in early rounds get better deals in later rounds? Reputation for being tough (having a hair trigger) can pay off.

  **Three Honest Notes:**

  1. **What predictably goes wrong the first time and how to handle it:**
     - Students might not understand the rules, especially the tripwire mechanism. This could lead to confusion and a broken game experience.
