  - Explain the rules:
    - Each player sets a public tripwire (a number between 0 and 100) that represents the minimum they will accept without risking catastrophe.
    - They then have 5 minutes to negotiate a split of 100 points.
    - If they agree on a split that is above both tripwires, they get that.
    - If they agree but the split is below one or both tripwires, then for each player whose tripwire was not met, roll a die:
