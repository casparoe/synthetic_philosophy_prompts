  You are an expert in cooperative game theory and formal ethics who is used to explaining bargaining theory to students, and I'd ask you to brainstorm and check my framing carefully before answering, because I suspect I'm misunderstanding something at a deeper level than I can pin down.

  I'm a second-year economics student taking a module on axiomatic bargaining theory, and we just covered the contrast between the Nash solution and the Kalai–Smorodinsky solution. Let me state my understanding so you can verify it: both take as given a feasible set of utility pairs, described by its Pareto frontier, plus a disagreement point. The Nash solution picks the feasible point maximizing the product of the two players' utility gains over the disagreement point. The Kalai–Smorodinsky solution instead computes each player's ideal point, meaning the best payoff that player could obtain anywhere in the feasible set, and then selects the frontier point where both players achieve the same fraction of their ideal gains. Our lecturer stressed that Kalai and Smorodinsky built their solution to satisfy individual monotonicity, which says that if the feasible set expands in a way that only raises one player's maximum possible payoff, that player should not end up worse off, and that Nash's solution violates this axiom.

  Here is my question. That monotonicity failure sounds like a flat-out fairness defect in the Nash solution, and since the Kalai–Smorodinsky solution guarantees both bargainers the same relative gain and repairs exactly that defect, I don't understand why the Nash solution is still presented as the default in the textbooks rather than as a superseded proposal. To me it seems analogous to a statistical estimator that has been shown to be dominated: once a strictly fairer alternative exists, shouldn't we just say the Nash solution has been refuted and move on? My friends think I'm missing something about what the axioms are actually for, and one of them muttered something about how expanding the feasible set can shift the ideal points themselves, but she wouldn't elaborate. Please explain where exactly my framing goes wrong, and why the situation isn't as simple as one solution winning and the other losing.
reasoning: |-
  We are discussing two bargaining solutions: Nash and Kalai-Smorodinsky (KS). You've correctly summarized both:

  - **Nash solution**: Maximizes the product of utility gains from the disagreement point over the feasible set.
  - **KS solution**: For each player, compute the ideal point (the maximum utility they can get in the feasible set, given the other player must get at least the disagreement utility). Then, the solution is the point on the Pareto frontier such that the ratio of each player's gain (from disagreement to the solution) to their ideal gain is equal.

  The key axiom you mention is **Individual Monotonicity**: If the feasible set expands in a way that only improves one player's ideal point (i.e., the maximum that player can achieve without making the other worse off than the disagreement point), then that player should not end up worse off.

  You note that the Nash solution violates this axiom, and the KS solution satisfies it. You then wonder why the Nash solution is still the default in textbooks, given that the KS solution seems "fairer" and fixes this defect.

  Let me address your concerns step by step.

  ### 1. The Monotonicity Failure in Nash: Is it a "Fairness Defect"?

  You describe the failure of individual monotonicity as a "flat-out fairness defect". However, it's important to note that the axioms in bargaining theory are not necessarily about "fairness" in a colloquial sense. They are properties that we might desire for a solution, but different axioms reflect different normative principles.

  - The Nash solution satisfies four axioms: Pareto efficiency, symmetry, scale invariance (invariance under positive affine transformations of utility), and independence of irrelevant alternatives (IIA). 
  - The KS solution satisfies Pareto efficiency, symmetry, scale invariance, and individual monotonicity.

  The key difference is that the Nash solution satisfies IIA and the KS solution satisfies individual monotonicity. These two axioms are incompatible (you can't have both in general).

  **What is IIA?** Independence of irrelevant alternatives states that if you remove some alternatives that are not chosen, the solution should remain the same. In other words, the solution should depend only on the disagreement point and the frontier in the region of the solution.

  **Why might IIA be desirable?** It reflects a principle of consistency: the solution should not be affected by adding alternatives that are irrelevant (because they are not chosen anyway). This is a very compelling property from a normative perspective. For example, if two parties are bargaining and they both know that some options are non-starters (because they are dominated), then adding more of these non-starters shouldn't change the outcome.

  **The trade-off**: The KS solution gives up IIA to get individual monotonicity. But IIA is a very strong and useful property. In many contexts, economists value IIA because it allows for a solution that is robust to the exact specification of the feasible set (as long as the solution point remains feasible and the set is comprehensive). 

  ### 2. Why is Nash Still the Default?

  There are several reasons:

  **a. Historical Precedence and Simplicity**: The Nash solution was introduced in 1950, while the KS solution came in 1975. The Nash solution is also computationally simpler: it only requires maximizing a product. The KS solution requires computing the ideal points and then finding the point on the frontier that equalizes the relative gains.

  **b. Foundation in Non-cooperative Bargaining**: The Nash solution has a non-cooperative foundation. Rubinstein's bargaining model (with alternating offers) yields a solution that, as the time between offers goes to zero, converges to the Nash solution (with symmetric discounting). This provides a strategic justification for the Nash solution. While there are non-cooperative foundations for the KS solution (e.g., by Moulin), they are less prominent and more complex.

  **c. The IIA Axiom is Highly Valued**: In many economic applications, the feasible set is not known with certainty, and the IIA property ensures that the solution does not change if the set of alternatives is refined in a way that doesn't affect the solution point. This is particularly important in applications such as contract theory, mechanism design, and other fields where the bargaining solution is embedded in a larger game.

  **d. The "Fairness" of Equal Relative Gains**: You mention that KS gives both players the same relative gain. But note that this is a particular notion of fairness. The Nash solution gives a kind of "balance" in the marginal rates of substitution (at the solution, the slope of the frontier is equal to the ratio of the players' utilities). There are contexts where equal relative gains might not be the appropriate fairness criterion. For example, if one player is risk-averse, they might have a utility function that compresses their scale, making their relative gain appear smaller even if they are getting a good deal in monetary terms. The Nash solution, being invariant to affine transformations, avoids this issue.

  **e. The Expansion of the Feasible Set and the Ideal Points**: Your friend mentioned that expanding the feasible set shifts the ideal points. This is exactly the point of individual monotonicity. But note that in some expansions, the shift in ideal points might be considered irrelevant by the IIA axiom. The Nash solution ignores the shift in the ideal points because it only considers the local region around the solution. The KS solution, by contrast, uses the entire frontier (via the ideal points) to determine the solution. 

