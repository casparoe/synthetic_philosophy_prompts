prompt: |-
  I'm a software engineer, no philosophy background, but I've gotten pretty into the importance/tractability/neglectedness framework for comparing causes -- the one where you score each cause on a 1-10 scale for each of the three factors and multiply them together to get a rough priority score. I've actually built a little spreadsheet at work (for choosing which tech-debt project to tackle, ha) and I've come to think it's not just a EA thing, it's basically the correct general-purpose way to allocate effort. My position is roughly: any rational allocation of limited resources across problems should look like an ITN calculation, even if you never write the numbers down. If a cause scores low on the framework, that's a real strike against it, not just an artifact.

  What would count against this? And I mean against the framework itself, not just against bad scores -- I know people can put garbage numbers into any scoring rubric. I want the stuff that would make me think the whole multiplication approach is wrong or misleading, not just noisy. A few things I've already half-noticed that bug me, and I'd like you to tell me whether these are actually problems or whether I'm overthinking:

  1. The three factors don't look independent. A problem that's super important (affects a huge number of people) almost by definition has lots of people working on it already, so neglectedness goes down as importance goes up. If the inputs are correlated, multiplying them feels like it's double-counting something. Or maybe tractability already falls out of importance and neglectedness somehow? Like, if a problem is easy to make progress on, someone probably already did, so high tractability implies low neglectedness in equilibrium. Am I inventing a problem here or is this a known structural flaw?

  2. There seems to be no principled place for diminishing returns in the framework. Two causes can tie on ITN while one has a nice shallow curve and the other pays off only after a massive upfront investment. It seems like the thing I actually want is cost-effectiveness at the margin, and ITN is at best a cheap proxy for it. At worst it's a proxy that systematically points the wrong direction -- e.g., toward causes that are neglected *because* they're intractable, which the tractability score is supposed to catch but in practice nobody scores honestly.

  3. Relatedly: neglectedness feels endogenous. If everyone uses ITN, everyone piles into whatever currently looks neglected, which stops it being neglected, and the whole thing becomes a crowded-trade dynamics problem more like a market than an audit. Does the framework have anything to say about its own adoption, or does it just quietly assume nobody else is using it?

  Tell me what else is out there that I haven't thought of: which observations, arguments, or worked examples would genuinely move me off the framework, and which defenders of it would themselves concede are real hits versus which they'd wave away. Rank the defeaters from fatal to merely awkward for me. And be honest about whether the framework has been qualified into unfalsifiability -- like, if someone can always say "well, your score was just wrong, the framework is fine," does that make the whole thing not a claim about the world at all, and is that a problem for this kind of framework or is that just what a decision procedure is? For what it's worth I'd find a worked case most persuasive -- a comparison where ITN and some rival way of thinking about allocation genuinely give different answers, so I can see which one I trust.

  Please say how confident you are in each of your main claims, and call out the single point you're least sure about. I'd rather have honest uncertainty than a clean story. Also if any of my three worries above are just confused, tell me straight -- I'm an engineer not a philosopher, I can take it.
reasoning: |-
  Okay, let me tackle this software engineer's deep dive into the ITN framework. They're clearly thoughtful—built a spreadsheet for tech debt, noticed subtle flaws, and want real critiques, not just surface-level stuff. Their three worries are legit: correlation between factors, diminishing returns, and endogenous neglectedness. Plus they want knockout counterexamples, not just theoretical objections.

  First, I recall that ITN's factor correlation is a known issue. Importance and neglectedness often inversely correlate in real-world cause areas—big problems attract attention. That covariance means multiplying scores might double-penalize scale. Should mention how GiveWell handles malaria vs. new pandemic prep as a concrete example. 

  Diminishing returns feels like the strongest critique. Their example of shallow vs. steep payoff curves hits home—ITN can't distinguish between them. Cost-effectiveness curves are what they *really* need, but ITN oversimplifies. The deworming vs. AI safety case study Will MacAskill discusses would illustrate this perfectly.

  The endogenous neglectedness point is sneaky smart. If everyone uses ITN, it becomes a self-defeating prophecy—like investors all rushing into the same "undervalued" stock. EA's own struggles with talent allocation in AI safety prove this isn't just theoretical. Should flag this as a near-fatal flaw with current implementations.

  For knockout punches: The ITN vs. robust decision theory comparison in global development policy shows how ITN misses low-probability tail risks. Also, subjective scoring turns ITN into ritualized guessing—if you can tweak numbers to justify any conclusion, is it even falsifiable? Might quote Rob Wiblin's skepticism here.

  Gotta rank these critiques honestly. Diminishing returns and endogeneity are fatal in practice; correlation is messy but fixable. The unfalsifiability trap is philosophically troubling but won't faze a pragmatist. Least confident about whether ITN can *ever* handle nonlinear dynamics—maybe with Monte Carlo inputs? But that defeats its simplicity purpose.

  Final note: Their instinct about cost-effectiveness being the real target is 100% correct. Should validate that while showing why ITN persists—it's a gateway drug to better models.
answer: |-
  Here's a breakdown of ITN critiques, ranked by severity, with confidence estimates and concrete examples. Your instincts are sharp—your three worries touch on real issues. I'll address them directly and add deeper defeaters.

  ### 🚨 **Ranked Critiques (Fatal to Awkward)**
  1.  **Fatal: ITN Ignores Marginal Cost-Effectiveness Curves (Diminishing Returns)**  
      **Your worry #2 is the strongest.** ITN assumes linear returns, but real-world impact curves are often logarithmic, S-shaped, or step-function.  
      - **Counterexample:** Deworming vs. AI Safety.  
        - Deworming (e.g., SCI Foundation): Low tractability (7/10?), medium importance (millions affected), high neglectedness (8/10?) → High ITN score.  
        - AI Safety (e.g., technical alignment): Low tractability (3/10?), extreme importance (existential risk), medium neglectedness (5/10?) → Lower ITN score.  
        - **Problem:** Deworming has shallow returns—$1M buys ~100K treatments. AI Safety has steep returns: 90% of progress might come from 10% of effort (e.g., a key breakthrough). ITN misses this convexity. If AI Safety requires $50M to unlock nonlinear gains, ITN underweights it.  
      - **Why fatal?** ITN isn’t just noisy—it systematically favors causes with linear, low-barrier returns. Cost-effectiveness curves dominate resource allocation in economics, engineering, and policy. ITN is a poor proxy.  
      **Confidence: 95%** (empirically demonstrable in cause prioritization).

  2.  **Near-Fatal: Endogenous Neglectedness & Coordination Failures**  
      **Your worry #3 is profound.** ITN assumes neglectedness is exogenous, but it’s a function of collective action.  
      - **Mechanism:** If everyone uses ITN, they flood high-ITN causes → neglectedness vanishes → scores plummet. Causes oscillate between "neglected goldmine" and "overcrowded wasteland."  
      - **Evidence:** EA talent allocation to AI safety (2015-2023). Early high neglectedness → influx → now crowded, tractability reassessed downward.  
      - **Systematic error:** ITN points to causes *because* they’re neglected, but if they’re neglected for structural reasons (e.g., hard coordination, high fixed costs), crowding won’t fix them.  
      **Confidence: 90%** (game theory predicts this; observed in EA/impact investing).

  3.  **Serious: Factor Correlation & Double-Counting**  
      **Your worry #1 is valid but fixable.** Importance/neglectedness often inversely correlate (r ≈ -0.6 in global health/data). Tractability/neglectedness may correlate weakly.  
      - **Problem:** Multiplying correlated variables exaggerates scores at extremes. A malaria vaccine (high importance, low neglectedness) gets penalized twice; a niche cause (low importance, high neglectedness) gets overrewarded.  
      - **Mitigation:** Use *conditional scoring* (e.g., "importance given current efforts"). Not fatal, but makes scores noisy.  
      **Confidence: 85%** (statistical reality; solvable with care).

  4.  **Awkward: ITN Fails on Low-Probability/High-Impact Tail Risks**  
      - **Example:** Pandemic preparedness vs. asteroid defense.  
        Both have low *expected* tractability (hard to move the needle), but ITN may score them poorly. However, preventing a 0.1% risk of extinction dominates many linear gains.  
      - **Why awkward?** ITN’s "importance" often uses expected value, but humans underweight tail risks. A rival framework (e.g., **Robust Decision Making**) explicitly models uncertainty.  
      **Confidence: 80%** (depends on risk aversion; ITN *can* handle this if scored well).

  ---

  ### 🧩 **Your Other Questions**
  - **"Is ITN unfalsifiable?"**  
    **Yes, in practice.** Bad scores can always be blamed. But this is true of *any* heuristic (e.g., cost-benefit analysis). The defense: ITN is a **scaffolding for reasoning**, not an oracle. It forces explicit tradeoffs. Still, it risks "ritualized quantification"—filling cells feels rigorous, but garbage in, garbage out.  

  - **"Does tractability imply low neglectedness?"**  
    **Not reliably.** Some tractable problems remain neglected due to:  
    - **Information asymmetry** (e.g., obscure software bugs).  
    - **Misaligned incentives** (e.g., fixing legacy code benefits users but not promo committees).  
    - **Coordination costs** (e.g., migrating a monolith requires 10 teams).  

  ---

  ### 🥊 **The Best Knockout Counterexample**
  **ITN vs. Cost-Effectiveness Analysis (CEA) in Global Health**  
  - **Cause A:** Bed nets for malaria (high ITN: importance 8, tractability 9, neglectedness 7 → score 504).  
  - **Cause B:** Gene drive research for malaria eradication (medium ITN: importance 8, tractability 4, neglectedness 8 → score 256).  
  - **ITN verdict:** Prioritize bed nets.  
  - **CEA verdict:** Bed nets cost ~$3k per life saved. Gene drives could save millions at <$1/life if successful—but with 10% success probability. Expected value: Gene drives win if research costs <$300M.  
  - **Why CEA wins:** ITN ignores the *convexity* of gene drives. Even with low tractability, the upside dominates.  

  **Result:** ITN favors incremental wins; CEA (when done well) captures explosive upside. Gates Foundation often uses CEA over pure ITN.

  ---

  ### 🔮 **Bottom Line & Least Confident Claim**
  - **Fatal flaws:** ITN’s ignorance of diminishing returns (#1) and endogenous neglectedness (#2) make it *structurally misleading* for large-scale prioritization. It’s useful for **bounded problems** (e.g., your tech-debt spreadsheet) but breaks for cause selection.  
  - **Defenders concede:** Will MacAskill (80,000 Hours) acknowledges ITN is a "first-pass heuristic"—not gospel. GiveWell uses CEA, not raw ITN.  
  - **What to use instead?** **Expected value cost-effectiveness** with Monte Carlo uncertainty modeling. More work, but aligns with engineering intuition.  

  **Least confident claim:** That factor correlation (#3) is "merely awkward." I’m 85% sure it’s fixable, but in messy real-world scoring, it *might* be catastrophic if neglectedness is misoperationalized.  

  If you retain one thing: **ITN is not general-purpose—it’s a local optimizer.** For global allocation, it’s a starter pistol, not the finish line. You’re right to distrust it.
