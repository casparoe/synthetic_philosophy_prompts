prompt: |-
  So I'm a philosophy grad student and in a few weeks I'm presenting at an interdisciplinary workshop on the boundary (or lack of one) between moral psychology and metaethics. My paper defends a fairly specific claim: the empirical literature on cross-cultural variation in folk morality — the whole WEIRD-psychology stuff, where industrialized Western samples turn out to be global outliers on things like harm norms, fairness intuitions, and how much weight people put on intentions versus outcomes — doesn't by itself threaten moral objectivity. My argument, roughly: a lot of the documented variation concerns thick, institution-dependent norms (purity, loyalty, deference, hierarchy), the thin core of harm and fairness judgments shows striking convergence once you control for factual beliefs (people who think witches cause crop failures aren't disagreeing with us about whether causing crop failures is bad), and the remaining disagreement mostly tracks disagreement about non-moral facts rather than about moral principles themselves — the way disagreement about the shape of the earth doesn't undermine the objectivity of geography.

  The audience is going to be tricky though. It's mostly metaethicists and moral philosophers, but two of the invited speakers are empirically-minded moral psychologists who are frankly kind of contemptuous of philosophers who hand-wave the cross-cultural data, and there's also a couple of self-identified relativists in the room who've been waiting years for someone to make my kind of argument so they can tear into it. I'm worried the metaethicists will come at me with the "abstraction is cheap" objection — that you can always rescue objectivity by redescribing disagreement as merely apparent, at which point the claim does no work — and the psychologists will come at me with the data itself (some of which I only know secondhand), e.g. that supposedly "universal" harm norms get swamped by punishment norms and community-level factors in small-scale societies, or that the intention/outcome asymmetry flips in predictable ways across populations, which sounds a lot more like deep disagreement than factual error to me when I stare at it too long.

  Act as an experienced philosopher who has sat through many hostile Q&As and prepare me a realistic prep sheet. Give me the objections I'll actually get from this specific audience, ordered by how much damage they could do, phrased the way these particular people would phrase them (the psychologist's version of a point should sound different from the relativist's version). For each, give me a two-minute reply I could deliver under pressure and an honest note about where the reply is soft — I want to know what to concede up front rather than get caught backpedaling. And crucially, tell me which question I'm quietly hoping nobody asks, the one that if asked well I don't have a good answer to, so I can at least have something prepared instead of just praying. Think carefully about the actual workshop dynamics too: who pipes up first, who waits to pile on, and which objection becomes lethal only when two of them are asked back to back.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy grad student preparing for a high-stakes interdisciplinary workshop defense. Their core argument is that cross-cultural moral variation doesn't undermine objectivity, with three key pillars: variation concerns thick norms, thin norms converge when controlling for factual beliefs, and residual disagreement tracks non-moral facts. 

  First, I need to map the threat landscape by audience faction:
  - The empirically-minded psychologists will likely attack with specific datasets showing deep, non-fact-dependent variation in core norms like harm/intentionality. Their phrasing will be data-heavy and dismissive of philosophical abstraction.
  - The metaethicists will challenge methodological over-abstraction - how the "factual beliefs" carve-out makes the claim unfalsifiable. Their language will be technically precise but skeptical.
  - The relativists will pounce on any concession as proof of relativism, using slippery-slope arguments about what counts as "core" morality. Their rhetoric will be provocative and boundary-pushing.

  Now ranking objections by damage potential:
  1. The psychologist's "flipped intentionality" case (high damage): When studies show outcome-weighting > intention-weighting in some cultures for identical actions, this directly challenges the thin norms convergence claim. 
  2. Metaethicist's "abstraction is cheap" critique (medium-high): If any disagreement can be explained away as factual error, objectivity becomes tautological.
  3. Relativist's "core norms aren't core" attack (medium): Pointing to societies where harm norms are subordinated to purity/loyalty undermines the thin/thick distinction.

  For the lethal combo: If after I respond to the intentionality data by appealing to different factual contexts (e.g., spirit causation), a metaethicist immediately asks "How could we ever falsify your position then?" - that traps me between conceding to psychologists or admitting unfalsifiability.

  The question I'd dread most is a hybrid from a savvy psychologist: "In [X] study, when we controlled for all documented factual beliefs, the moral valence inversion in harm judgments persisted - doesn't this show your 'error theory' has run out of road?" This forces me to either dispute methodology (risky without expertise) or concede ground.

  For prep priorities:
  - Memorize key studies (e.g., Barrett et al. on outcome-focused blame in small-scale societies)
  - Pre-empt abstraction critique by distinguishing recoverable vs. irrecoverable factual errors
  - Have a fallback position: "Even if some variation resists explanation, objectivity only requires convergence under full information" - while noting this risks becoming an ideal theory

  Biggest vulnerability remains cases where exhaustive controls for factual beliefs still leave significant moral disagreement on thin norms. I should prepare to acknowledge this as a live empirical question rather than overclaim.
answer: |-
  Here’s your battle-tested Q&A prep sheet, structured for maximum realism. I’ve ordered objections by damage potential, calibrated to your audience dynamics. The psychologists will lead with data, metaethicists with conceptual traps, and relativists with rhetorical grenades.  

  ---

  ### **Tier 1: High-Damage Objections**  
  *(Likely from psychologists first, metaethicists amplifying)*  

  **Objection 1 (Psychologist):** "Your 'factual belief' escape hatch doesn’t hold. Take Barrett et al.’s work on the Hadza: When someone *intentionally* poisons a well but no one dies, they see *less* blame than when someone *accidentally* poisons it and kills ten people. We controlled for beliefs about spirits, causation, and consequences. This isn’t a factual error—it’s a fundamental valence inversion of the intention/outcome link you call 'universal.' How is this not deep moral disagreement?"  
  **Your 2-Minute Reply:**  
  "You’re right—the Hadza data is challenging. But note: In Barrett’s scenarios, accidental harm still implies *negligence* (e.g., mishandling poison near water). What looks like outcome-focus is better explained by culturally specific *duties of precaution* under resource scarcity. Their 'blame' targets failures to mitigate foreseeable risks, not outcomes per se. This aligns with a universal principle: 'Negligence with high stakes warrants blame.' The inversion disappears when we model their ecology of risk."  
  **Where It’s Soft:**  
  You’re reinterpreting their moral framework through Western negligence norms. If the psychologist retorts, "They explicitly cite *outcome severity*, not negligence, in interviews," concede: "Fair—this needs deeper ethnographic engagement. But we’d need proof they lack *any* concept of recklessness to rule out shared foundations."  

  **Objection 2 (Metaethicist):** "This is just the *disagreement-to-error* move. You abstract away variation by calling it 'factual' or 'institutional,' but your thin 'harm/fairness core' is so abstract it’s vacuous. If *any* divergence gets explained away, your 'objectivity' is unfalsifiable—a trivial claim no data could threaten."  
  **Your 2-Minute Reply:**  
  "My core isn’t abstract—it’s *operationalized in constraints*. Harm norms universally forbid *deliberate, unnecessary suffering*; fairness forbids *arbitrary advantage-taking*. When the Huaorani sanction spearing over theft, it’s because they see theft as parasitic (arbitrary advantage) and spearing as reciprocal (non-arbitrary). Factual errors occur when groups misattribute causes (e.g., 'witches cause blight'), not when they reinterpret principles. The test: Do they *correct* judgments when factual errors are exposed? Evidence says yes."  
  **Where It’s Soft:**  
  If pressed on "unnecessary suffering" or "arbitrary" being culturally loaded, concede: "Agreed—the *application* is context-sensitive. But the *direction of reasoning* (e.g., mitigating suffering absent overriding reasons) is cross-culturally stable. That’s all objectivity needs."  

  ---

  ### **Tier 2: Medium-Damage Objections**  
  *(Relativists pouncing, psychologists piling on)*  

  **Objection 3 (Relativist):** "You’re cherry-picking 'core' norms. In hierarchy-based societies, harm *is* morally required to enforce rank (e.g., corporal punishment for caste violations). When honor cultures demand vengeance killings, they see it as *fair*. Your 'thin core' is just Western liberalism masquerading as universal."  
  **Your 2-Minute Reply:**  
  "Hierarchical harm isn’t counterevidence—it’s *evidence*. Honor cultures don’t say 'harm for fun is good'; they say 'harm to enforce desert is justified.' That presupposes fairness (giving due) and harm (as pro tanto bad). Even vengeance killers frame acts as *rectifying unfairness*. The principle 'harm requires justification' is universal; the disagreement is over what counts as justification (e.g., caste vs. dignity), which *is* often factual (e.g., 'Do souls have ranks?')."  
  **Where It’s Soft:**  
  If they cite societies where harm *is* celebrated intrinsically (e.g., ritual torture), concede: "Those cases strain my view. But note: They’re often embedded in metaphysical beliefs (e.g., pain pleases gods). Remove those beliefs, and the practice collapses—unlike, say, condemning murder."  

  **Objection 4 (Psychologist + Metaethicist Combo):**  
  **Psychologist:** "Community-focused societies punish *victims* of harm (e.g., rape survivors) to restore group harmony. Where’s the 'harm norm' here?"  
  **Metaethicist (follow-up):** "And if you call this 'institution-dependent,' doesn’t that admit morality *is* just institutional—undermining objectivity?"  
  **Your 2-Minute Reply:**  
  "First, victim-punishment aims to *prevent future harm* (e.g., feuds)—it’s tragic misapplication, not rejection of harm norms. Second, institutions mediate *how* we satisfy moral demands (e.g., 'prevent harm' → 'maintain harmony'), but the demand itself is prior. Objectivity requires that institutions *answer to* core demands, not that they’re identical cross-culturally."  
  **Where It’s Soft:**  
  This reframing risks sounding ad hoc. Preempt: "We see parallel misapplications in WEIRD societies—e.g., jailing addicts to 'prevent harm.' That doesn’t negate objectivity; it shows humans err."  

  ---

  ### **Tier 3: The Silent Killer Question**  
  *(The one you pray isn’t asked well)*  

  **The Question:**  
  **"In Henrich’s market-integration studies, societies with less exposure to impersonal trade show weaker 'impartial fairness' (e.g., rejecting unfair offers even at personal cost). If the *mechanism* for acquiring 'core' norms is culturally contingent, how can those norms be objective? Isn’t this enculturation, not discovery?"**  

  **Why It’s Lethal:**  
  - Hits your weakest spot: the *genealogy* of moral knowledge.  
  - Psychologists love it (data shows learning = environmental).  
  - Metaethicists love it (echoes Mackie’s queerness).  
  - Relativists love it (proof morality is constructed).  

  **Your Best Reply (Under Duress):**  
  "Objectivity doesn’t require *innate* knowledge—it requires that moral truths are *mind-independent* and *discoverable*. Math isn’t subjective because some cultures develop calculus faster. Similarly, market integration may *scaffold* discovery of impartial fairness (e.g., via repeated exchange), but the principle exists independently. Evidence: Isolated groups still recognize fairness in kin contexts—they just don’t extend it broadly *until* exposed to contexts where partiality causes systemic harm."  

  **Where You Bleed:**  
  This implicitly concedes that "discoverability" depends on contingent social tools. If pressed, retreat to: "At minimum, objectivity holds that *if* a culture develops relevant social practices, they’ll converge on these norms. But yes, the path isn’t guaranteed—that’s a problem for moral *epistemology*, not ontology."  

  ---

  ### **Workshop Dynamics Playbook**  
  - **Opening Salvo:** Psychologists will hit first with a data-heavy objection (e.g., Hadza intentionality). *Your move: Nod to complexity, reframe as factual context.*  
  - **Metaethicist Ambush:** They’ll wait for your reframe, then pounce with "abstraction is cheap." *Your move: Distinguish "recoverable error" (factual) from "irrecoverable" (moral).*  
  - **Relativist Trap:** They’ll cherry-pick your concession (e.g., "You admit norms can be locally unlearnable!") to claim relativism wins. *Your move: "Unlearnable ≠ untrue. Gravity existed before Galileo."*  
  - **Lethal Combo:** If a psychologist details a "valenced inversion" study (Objection 1) and a metaethicist immediately asks, "How could we *ever* falsify your view?", you’re cornered. *Your last stand: "Show me a culture that approves of *gratuitous* harm with no factual error—e.g., torturing babies for fun. Absent that, the burden shifts."*  

  **Final Prep Advice:**  
  1. Memorize 2–3 key studies (Barrett/Hadza, Henrich/markets, Haidt/divine command) to cite when psychologists invoke "the data."  
  2. Preempt the "abstraction" critique early: Add a slide distinguishing *recoverable factual errors* (e.g., "witches cause disease") from *irreducible moral divergence* (e.g., "suffering is good").  
  3. When relativists shout "But culture!," reframe: "Culture explains *application*, not *invention*, of norms."  
  4. For the silent killer: If asked, admit the epistemology is messy but stress the ontology is intact. Concede gracefully—it’s better than flailing.  

  You’re ready. They’ll come for you—but you’ve steelmanned their best shots. Now go make objectivity plausible again.
