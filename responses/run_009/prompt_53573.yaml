  The cost of rejecting (4) is that we must accept that there are meaningful claims that are not empirically verifiable in the strict sense. But this is a common position in philosophy (e.g., moral realism). It does not require us to abandon the economic definition of utility, but it does require us to supplement it with additional principles for making comparisons.

