  We are to consider which step to reject and the cost.

  Option 1: Reject (1). We could say that there is more to utility than choices. For instance, we might appeal to introspection or physiological measures. But the friend will ask how we detect these. If we point to physiological measures (like brain scans for pain), then the friend might say that these are just more choice data: the experimenter chooses to interpret brain activity as pain. But that seems forced. Alternatively, we might say that suffering has an intrinsic intensity that is directly accessible to the subject. However, the problem of communicating that intensity to others remains. The cost of rejecting (1) is that we abandon the behaviorist foundation of economics and must build a new theory that incorporates non-choice data, which might not be interpersonally comparable either.

  Option 2: Reject (4). This is the verificationist step. We can say that interpersonal comparisons of utility are meaningful even if we cannot provide evidence for them. For example, we might believe that there is a fact of the matter about whether Ann's pain is worse than Bob's, even if we cannot know it. This is a metaphysical stance. The cost is that we then have to accept that there are truths that are in principle unknowable, which some might find objectionable. Moreover, it might leave economics without a way to make interpersonal comparisons for policy, which was the original motivation for the argument.

  Option 3: Challenge the move from (3) to (5). The argument says that because the transformation is not fixed by choice data, then no evidence can bear on the comparison. But perhaps there is other evidence. For instance, we might use physiological or neurological evidence. However, the friend might argue that such evidence would have to be interpreted via a theory that ultimately ties back to behavior (or else it's just more data that we choose to interpret). Alternatively, we might argue that the doctor's choice does provide evidence: if the doctor is impartial and well-informed, then her choice might reflect an interpersonal comparison. But the friend has already dismissed that by saying it's about the doctor's preferences.

