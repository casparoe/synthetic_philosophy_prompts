  The friend does concede that for a single chooser at a single time, we can get cardinal facts (via gambles) but only because there is a single scale.

  We are to choose which step to reject and what it costs.

  Let me analyze the steps:

  First, step (1) is a behaviorist premise: utility is defined by choices. This is standard in revealed preference theory. Rejecting this would require an alternative account of utility that is not behaviorally defined. This might be costly because it departs from the standard economic framework and might introduce unobservable mental states.

  Step (2) is correct for the standard von Neumann-Morgenstern (vNM) cardinal utility: utility functions are unique up to positive affine transformations. This is a mathematical fact.

  Step (3) follows from (1) and (2): if we have two separate sets of choice data (Ann's and Bob's), each defines a utility scale up to affine transformations, but the scales are independent. So without a way to link the two scales, we cannot compare the levels. This seems valid.

  Step (4) is a verificationist principle: if no evidence can bear on a claim, then it has no truth value. This is controversial. It is similar to the logical positivist verifiability criterion of meaning. However, there are well-known objections: for example, claims about the past or unobservable entities (like electrons) might be thought to have truth value even if not directly verifiable. The friend uses examples of temperature and mass to challenge this. The response might be that in those cases, evidence can bear on the claims indirectly, but in the utility case, the argument says there is no evidence at all.

  Step (5) then concludes that interpersonal comparisons are empty.

