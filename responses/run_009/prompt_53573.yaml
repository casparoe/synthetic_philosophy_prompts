  Therefore, if we want to keep utility as defined by choices, we may be stuck.

  But note that in the case of a single person across time, we have memory and psychological continuity. I remember how bad my headache was last year and can compare it to today's. That seems to fix the scale. But the friend would say that memory is fallible and that the act of remembering is a current state that might not accurately reflect the past state. Moreover, the utility of the past state is not directly accessible.

