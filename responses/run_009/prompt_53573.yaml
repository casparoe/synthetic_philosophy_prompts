  This suggests that without some additional assumptions, we cannot make intertemporal comparisons. But we might be willing to make those assumptions.

  Similarly, for interpersonal comparisons, we might make assumptions (e.g., that people have similar capacities for pleasure and pain) to fix the scales. But these are assumptions, not facts fixed by choice data.

  Now, what about Harsanyi? Harsanyi's idea is that an impartial observer can make extended preferences: she can imagine being in the shoes of Ann or Bob and then rank the outcomes. Harsanyi then proves that if the observer is rational and impartial, her utility function must be a weighted sum of the individuals' utilities. This gives an interpersonal comparison. But the friend says that the observer's utility function can be rescaled arbitrarily. That is true: the observer's utility function is also defined up to an affine transformation. However, note that in Harsanyi's theorem, the weights are fixed by the observer's preferences. So the relative weights (which determine the interpersonal comparisons) are fixed by the observer's choices. The problem is that if the observer's utility function is rescaled, the weights change accordingly. For example, if I multiply the observer's utility function by 2, then the weights also double. So the absolute levels of the weights are arbitrary. But the relative weights between individuals are fixed: if the observer prefers being Ann in state A to being Bob in state B, then that comparison is fixed. However, the friend might say that this only gives a comparison relative to the observer's scale. We still don't know if Ann's utility in state A is greater than Bob's in state B in an absolute sense.

  But wait: Harsanyi's theorem is about representing the observer's preferences. The observer's extended preferences give a way to compare the states of Ann and Bob. So if the observer prefers being Ann with a headache to being Bob with a stubbed toe, then we can say that according to the observer, Ann's state is better than Bob's. But is that an interpersonal comparison of utility? In Harsanyi's framework, it is, because the observer's utility function aggregates the individual utilities. But the friend would say that the individual utilities are already rescalable arbitrarily.

  However, note that in Harsanyi's setup, the individuals' utility functions are already fixed by their own choices (up to affine transformations). Then the observer's extended preferences, if they satisfy certain axioms, lead to a representation where the observer's utility for being person i in state x is a function of i's utility in state x. Specifically, it is a linear function: U_observer(i, x) = a_i * U_i(x) + b_i, but Harsanyi argues that impartiality requires that the b_i are equal and that the a_i are all the same (or perhaps normalized). Then we get U_observer(i, x) = a * U_i(x) + b. Then the observer's ranking of (i,x) vs (j,y) depends on whether a * U_i(x) + b > a * U_j(y) + b, which simplifies to U_i(x) > U_j(y). So the comparison is independent of a and b. Therefore, the interpersonal comparison is fixed by the observer's preferences.

  But this assumes that the individual utilities U_i and U_j are given on scales that are comparable. The problem is that each U_i is defined up to an affine transformation. So if we rescale U_i by multiplying by c_i and adding d_i, then we would have to adjust the observer's representation accordingly. In particular, the new representation would have a' * (c_i * U_i(x) + d_i) + b. To maintain the same observer preferences, we would need to adjust a' and the constants. But note that the condition for the observer to prefer (i,x) to (j,y) is:

  a * U_i(x) + b > a * U_j(y) + b   =>   U_i(x) > U_j(y)

  If we rescale Ann's utility: U_Ann_new = c_ann * U_ann + d_ann, and Bob's: U_bob_new = c_bob * U_bob + d_bob, then the condition becomes:

  a * (U_ann_new - d_ann)/c_ann + b > a * (U_bob_new - d_bob)/c_bob + b

  This does not simplify to U_ann_new > U_bob_new unless c_ann = c_bob and d_ann = d_bob. So the observer's preferences would change if we arbitrarily rescale the individual utilities. Therefore, to use Harsanyi's approach, we must fix the scales of the individual utilities. How do we do that? Harsanyi assumes that the individual utilities are given on a common scale. But that is exactly what we are trying to establish.

  Therefore, the friend's objection stands: without fixing the scales, the extended preferences do not give an invariant interpersonal comparison.

  Given this, the options are limited.

  Now, let's return to the intrapersonal case. We can use intertemporal choices to fix the scale across time. For example, if at time t0 I am indifferent between receiving 100 units of utility at t0 and 110 units at t1, then that reveals a discount factor and also fixes the relative scaling. But note: the 100 and 110 are in utility units. How do we know that my utility function is the same at t0 and t1? We don't, but we assume that we can measure utility at each time by choices at that time, and then the intertemporal choice links them. However, the argument in (2) says that at each time, the utility function is fixed only up to affine transformations. So at t0, we have U_t0 defined up to a0*U_t0 + b0. At t1, similarly, a1*U_t1 + b1. When I make an intertemporal choice at t0, I am trading off U_t0 and U_t1. But the choice is made using the utility function at t0. So I maximize:

  U_t0(now) + discount * U_t1(future)

  But if we rescale U_t0 and U_t1 arbitrarily, we could change the discount factor. For example, if we let U_t0' = a0 * U_t0 + b0 and U_t1' = a1 * U_t1 + b1, then the expression becomes:

  (a0 * U_t0 + b0) + discount * (a1 * U_t1 + b1) = a0*U_t0 + discount*a1*U_t1 + (b0 + discount*b1)

  To represent the same preferences, we would need to adjust the discount factor and the additive constant. But the additive constant doesn't matter for choices. The discount factor would have to be adjusted by a factor of a0/a1. That is, if we change the scale of U_t1 by a1, then the discount factor must be scaled by a1 to compensate. But without an independent way to fix a0 and a1, we cannot uniquely determine the discount factor. Therefore, even with intertemporal choices, the scaling across time is not fixed.

  This suggests that without additional assumptions, we cannot make intertemporal comparisons either.

  But we do make them. How? We assume that the utility function is stable (so that the zero and unit are the same) and then use intertemporal choices to fix the discount factor. The cost is that we are making a substantive assumption about stability.

  Given the above, I think the most promising way to reject the argument is to challenge step (4): the verificationist principle. We can argue that interpersonal comparisons of utility are meaningful even if we cannot verify them with choice data. For example, we might have a theory of welfare that is based on objective features of the person (like health, achievement, etc.), which we can measure independently. Or we might appeal to the subjective experience, which we can introspect and report. Reports (like asking people to rate their pain on a scale) might be seen as choice behavior (the choice of a number) but that could be interpreted as revealing an underlying cardinal utility.

