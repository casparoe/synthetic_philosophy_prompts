answer: |-
  ### Analysis of the Argument

  The argument presented is a sophisticated extension of the ordinalist view of utility, drawing from revealed preference theory in economics. It concludes that interpersonal utility comparisons (and, by extension, intrapersonal comparisons across time) are "empty" because no choice behavior can fix the affine transformation (scaling) between different utility functions. I will evaluate the argument step by step, identify its validity, pinpoint the flaw, and explain the costs of rejecting specific premises. I will also address your concern about preserving intrapersonal comparisons and the status of the doctor's ranking.

  #### Step-by-Step Evaluation
  1. **Premise (1): All facts about utility are exhausted by choice behavior.**  
     This is the core of revealed preference theory: utility is defined solely by observable choices, including gambles (as in von Neumann-Morgenstern expected utility theory). It assumes no introspective or non-choice facts (e.g., raw feelings of pain) contribute to utility.  
     - **Validity**: Economically orthodox, but philosophically contentious. Rejecting it requires positing non-choice facts about well-being.  
     - **Cost of rejection**: Abandoning standard economic methodology. Utility would no longer be purely behavioral, opening the door to subjective, unobservable mental states. This could make utility "unscientific" by behaviorist standards, but it aligns with common sense (e.g., pain intensity might not fully manifest in choices).

  2. **Premise (2): Choice data fix utility only up to positive affine transformations.**  
     This is mathematically correct for cardinal utility (as in expected utility theory). Multiplying utility by a positive constant or adding a constant preserves all choices, since only ordinal rankings and risk attitudes (e.g., indifference points in gambles) are observable.  
     - **Validity**: Unassailable within its framework. It reflects how utility functions are unique only up to affine transformations.  
     - **Cost of rejection**: None, as this is a technical fact. Rejecting it would require denying basic utility theory.

  3. **Premise (3): Choice data from Ann and Bob cannot fix the transformation between their scales, so interpersonal comparisons are underdetermined.**  
     From (1) and (2), Ann's choices fix her utility scale up to affine transformation, and Bob's choices fix his scale separately. Without a bridge (e.g., a common reference point), we cannot compare absolute utility levels (e.g., "Ann's headache is worse than Bob's").  
     - **Validity**: Logically follows from (1) and (2). Even rich data (e.g., gambles) cannot resolve the scaling issue across individuals.  
     - **Cost of rejection**: Contradicting revealed preference theory. It would require claiming that choice data *can* fix interpersonal scales, which (2) shows is impossible without additional assumptions.

  4. **Premise (4): A claim on which no possible evidence could bear is empty (lacks truth value).**  
     This is a verificationist principle: if no conceivable evidence could confirm or falsify a statement, it is meaningless. Your counterexamples (e.g., historical temperatures, masses before measurement) challenge this, as we accept such truths existed even without contemporary evidence.  
     - **Validity**: Highly controversial. Verificationism is largely discredited in philosophy of science. Many truths (e.g., unobservable entities, counterfactuals) are considered meaningful without direct evidence.  
     - **Cost of rejection**: Accepting that some truths are evidence-transcendent. This allows for metaphysical claims (e.g., objective facts about well-being) but may weaken empiricist foundations.

  5. **Conclusion (5): Interpersonal comparisons are empty.**  
     This follows from (3) and (4): if no evidence (from choice behavior) can bear on interpersonal comparisons, and such claims are otherwise empty, they lack truth value.  
     - **Validity**: Depends on (4). Without (4), the underdetermination in (3) does not imply meaninglessness.

  6. **Extension (6): Intrapersonal comparisons across time are also empty.**  
     The same logic applies: choices at time $t_1$ fix utility up to affine transformation, as do choices at $t_2$. Without a fixed transformation, "I am better off now than before" is unverifiable by choice data.  
     - **Validity**: Consistent with (1)–(4). Even intertemporal choices (e.g., saving for the future) rely on the current scale, not a linked scale across time.  
     - **Your concern**: This threatens intuitive self-assessments (e.g., "I am happier after leaving my job"). Rejecting (6) requires challenging earlier premises.

  #### Responses to Your Challenges
  - **The doctor example**: You proposed that a doctor choosing which patient to treat supplies a common scale. Your friend countered that this reflects the doctor's preferences (her "extended preferences" over being in Ann's or Bob's state), not an objective comparison between Ann and Bob. This is correct: the doctor's choice reveals *her* utility ranking of states involving Ann and Bob, but it doesn't fix the scaling between Ann's and Bob's *own* utility functions. Rescaling Ann's or Bob's utility would require corresponding adjustments to the doctor's extended utility to preserve her choices, leaving the comparison underdetermined.
    
  - **Harsanyi's extended preferences**: You suggested that ranking "being Ann with a headache" vs. "being Bob with a stubbed toe" creates a common scale. Your friend correctly noted that this is just another preference system (the chooser's), which can be rescaled arbitrarily. Harsanyi's approach assumes individual utilities are comparable, but choice data alone cannot fix the affine transformations across persons.

  - **Cardinal facts for a single chooser at a single time**: You noted that gambles can fix cardinal facts (e.g., contentment midway between agony and euphoria). Your friend conceded this because it involves one scale (no transformation issue). This is consistent with (2) and does not threaten the argument.

  #### Diagnosis: Where the Argument Fails
  The argument is **valid** (the conclusion follows logically from the premises) but **unsound** because **premise (4) is false**. Verificationism is untenable, and rejecting it is the least costly option for preserving meaningful interpersonal and intrapersonal comparisons. Here's why:

  - **Flaw in (4)**: Premise (4) states that unverifiable claims are empty. But as you noted, truths about historical temperatures or masses existed before measurement technology. Evidence could *in principle* bear on these claims (e.g., via new instruments), even if not currently available. Similarly, interpersonal utility comparisons might be verifiable in principle through non-choice evidence (e.g., neuroscience, psychology, or empathetic introspection). For example:
    - **Intrapersonal case**: We accept that "I am better off now than in 2015" is meaningful based on memory, psychological continuity, and self-reports—even if choice data underdetermine the scaling. We assume a stable utility scale over time, supported by intertemporal choices and introspection.
    - **Interpersonal case**: While choice data cannot fix scaling, other evidence (e.g., pain scales, brain imaging, or behavioral indicators) might support comparisons. The doctor's ranking could reflect a justified inference from such evidence, not just her preferences.

  - **Why reject (4) instead of (1)?**
    - **Cost of rejecting (1)**: Rejecting behaviorism (e.g., claiming pain intensity exists beyond choices) makes utility less scientific and measurable. Your friend would demand how these "extra facts" are detected, and any response (e.g., self-reports) could be reinterpreted as choice behavior (e.g., choosing to report a pain level). This risks circularity and may not resolve the scaling issue.
    - **Cost of rejecting (4)**: Verificationism is already weak. Rejecting it allows utility comparisons to be meaningful without requiring them to be fully verifiable by choice data. We can accept that evidence might be indirect (e.g., via conventions, neuroscience, or moral reasoning), preserving everyday and policy uses (e.g., QALYs). This is common in philosophy (e.g., moral realism) and science (e.g., dark matter).

  - **Why not reject (3)?**  
    (3) follows from (1) and (2). Rejecting it would require showing how choice data *can* fix interpersonal scaling, which (2) proves impossible. Harsanyi or the doctor might provide a practical bridge, but not a behavioral one without additional assumptions.

  - **Why not reject the move from (3) to (5)?**  
    (5) depends on (4). Without (4), underdetermination in (3) does not imply meaninglessness—only that comparisons require non-choice evidence or conventions.

  #### Defending Intrapersonal Comparisons and the Doctor's Role
  - **Intrapersonal comparisons across time**: These remain meaningful if we reject (4). We use intertemporal choices, memory, and psychological unity to assume a stable scale. For example, choosing to sacrifice now for future benefit suggests a common scale. Rejecting (4) allows this without demanding that choice data *alone* fix the transformation.
  - **What the doctor's ranking is of**: The doctor ranks states based on her extended preferences (as your friend says), but this can still be a *proxy* for interpersonal comparisons. By empathizing with Ann and Bob, she uses her own utility scale to model theirs. If we reject (4), her ranking can be seen as evidence-laden (e.g., informed by medical knowledge) rather than arbitrary. It doesn't "measure" Ann's or Bob's utility directly but provides a reasoned comparison.

