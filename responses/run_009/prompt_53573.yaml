  The argument steps are:

  (1) All facts about a person's utility are exhausted by her choices (including gambles).
  (2) Choice data fix the utility scale only up to positive affine transformations (multiply by a positive constant, add a constant).
  (3) Therefore, choice data from Ann and Bob do not fix the transformation between their scales, so we cannot compare Ann's headache to Bob's.
  (4) A claim that no possible evidence could bear on is empty (has no truth value).
  (5) Therefore, interpersonal comparisons of utility are empty.

