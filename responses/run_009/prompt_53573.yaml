  However, note that the argument in (6) about intrapersonal comparisons across time is particularly troubling. If we cannot even say that we are better off now than before, that seems counterintuitive.

  Let me focus on the intrapersonal case. The friend says that without a fixed transformation between time slices, we cannot compare. But is there a way to fix the transformation for the same person over time? One idea is that we can use the same utility function over time. But the argument says that the choices at each time fix the utility function only up to affine transformations, and we have no behavior that links the scales at different times. However, we do have choices that span time. For example, I might choose to save now for a benefit later. That choice involves trade-offs between now and then. So it seems that we can use intertemporal choices to fix the relative scaling. This is the standard approach in economics: we assume a discount rate and a utility function that is comparable over time.

