  3. **Dennett concludes ordinary conscious experience is an illusion, and we are partly zombies.** This is a misinterpretation. Dennett doesn't deny consciousness; he redefines it without qualia. For him, consciousness exists as brain processes, not as mysterious inner qualities. Zombies, in philosophy, lack consciousness entirely, so saying we're partly zombies is confusing and incorrect. The host might be conflating Dennett's view with eliminativism.

  4. **The title gloss and Quine comparison.** The host is mostly correct here. Quine rejected analytic/synthetic distinction, showing it's untenable. Dennett is doing the same for qualia, arguing they're an incoherent concept. The nod to Quine is appropriate, and the comparison holds.

