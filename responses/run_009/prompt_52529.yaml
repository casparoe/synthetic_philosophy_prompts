prompt: |-
  My friend thinks a lot about how epic and legendary traditions relate to history, and over the years she has given me fairly firm verdicts. The Trojan War: yes, some historical core — she takes it there were destructive conflicts around the Late Bronze Age settlement at Hisarlik that the epic tradition ultimately reflects, whatever the Iliad's gods and plot owe to poetry. King Arthur: no historical core, a legendary accretion around a dimly remembered post-Roman military figure. The Exodus as narrated: no departure from Egypt on anything like the biblical scale. Ragnar Lothbrok: no. Gilgamesh, by contrast: yes, she thinks a real Early Dynastic king probably stands behind the name — partly on the strength of his appearance in ancient king lists and early non-epic references. William Tell: no. Now she's agreed to hear three new cases over dinner: Robin Hood; Moses considered strictly as an individual leader, set aside from the question of the Exodus narrative's scale; and Etzel in the Nibelungenlied. Predict her verdict on each. I'm less interested in the answers than in the rule she seems to be running: several rules fit her track record equally well — for instance, one keyed to independent corroboration of the central event or site, and one keyed to whether the name attaches to a person attested early in non-epic sources — and they come apart on at least one of these cases. Identify the candidate rules, say what each predicts, give your best guess with reasons, and name a further case that would best tell the rules apart. One more request: please keep separate what is actually settled among people who work on this — for example, regarding the archaeology of Hisarlik and the later tradition around Arthur — and what is genuinely contested, and don't present a contested reading as the consensus.
reasoning: |-
  Okay, the user's friend has a consistent method for judging historical cores in epic traditions, and they've provided several examples of her verdicts. Now, they want me to predict her verdicts on Robin Hood, Moses (as an individual), and Etzel from the Nibelungenlied. But more importantly, I need to figure out the rule she's using, since there are conflicting possibilities.

  First, let's look at her past verdicts. For the Trojan War, she says yes—there's a historical core based on conflicts at Hisarlik. King Arthur is a no; no historical core, just accretion around a vague figure. Exodus as a large-scale event is no. Ragnar Lothbrok is no. Gilgamesh is yes, partly because he appears in king lists and early references. William Tell is no.

  Now, two candidate rules emerge. Rule A focuses on the central event or site having archaeological or independent corroboration. Rule B focuses on the name appearing in early, non-epic sources. Both fit most cases but might diverge on these new ones.

  For Robin Hood: Rule A would say no because there's no solid evidence for a single historical figure or the key events. Rule B would also say no since the earliest references are literary. So both agree on no.

  Moses as an individual: Rule A might lean no—no archaeological evidence for Moses himself, only textual. Rule B would also say no because Moses doesn't appear in early non-biblical sources. So both point to no.

  Etzel is tricky. He's based on Attila the Hun. Rule A: The events in the Nibelungenlied are legendary, but Attila is historical. Rule B: Attila is attested in non-epic sources like Priscus. So Rule B says yes, but Rule A might say no because the epic events aren't historical. This is where the rules diverge.

  The user mentioned that the rules come apart on one case. Etzel is likely that case. My best guess is she uses Rule B because Gilgamesh was accepted based on early king lists, similar to Attila. Plus, she separates Moses as an individual from the Exodus event, which aligns with Rule B's focus on the person's attestation.

  A further test case could be someone like Lycurgus of Sparta. If she says yes due to early references (Rule B), or no because the events are legendary (Rule A), that would clarify.

  I should also note where consensus exists. Hisarlik has evidence of destruction, but linking it to the Trojan War is debated. Arthur's historicity is contested. Gilgamesh in king lists is accepted, but the epic is embellished. Attila is historical, but Etzel's portrayal is fictional. Robin Hood is widely seen as legendary. Moses lacks contemporary evidence outside the Bible.

  So, predictions: Robin Hood - no. Moses - no. Etzel - yes. Rule B is her likely method. Test case: Lycurgus.
answer: |-
  Based on your friend's established pattern and the need to identify the rule behind her verdicts, here's the analysis, prediction, and rule differentiation:

  **Candidate Rules Derived from Her Track Record:**

  1.  **Rule A (Corroboration of Core Event/Site):** Accepts a historical core *primarily* if the central event described in the tradition (e.g., the sacking of Troy, the reign of Gilgamesh) or its specific location (e.g., Hisarlik, Uruk) has significant, independent archaeological or non-narrative historical corroboration that aligns broadly with the tradition's *scale or nature*, even if details are legendary. The *individual figure* is secondary.
  2.  **Rule B (Early Non-Epic Attestation of the Name):** Accepts a historical core *primarily* if the specific name (e.g., Gilgamesh, potentially Arthur) appears in early, non-epic, non-legendary sources (e.g., king lists, administrative records, contemporary chronicles), even if little is known about them. The *events* associated with them in epic are secondary and likely accretions.

  **Predictions for the New Cases:**

  1.  **Robin Hood:**
      *   **Rule A Prediction:** **No.** There is no archaeological evidence or credible contemporary historical record corroborating the core event (a specific outlaw operating in Sherwood/Barnsdale challenging authority and redistributing wealth) or the existence of a single identifiable figure behind the legend during the proposed periods (e.g., early 13th or 14th century). The tradition arises from literary/ballad sources.
      *   **Rule B Prediction:** **No.** The name "Robin Hood" first appears in late medieval literary/ballad sources (e.g., *Piers Plowman*, early ballads). There are no early non-epic, non-literary records (e.g., court rolls, chronicles contemporary to the proposed era) definitively attesting to a specific outlaw by that name playing the legendary role.
      *   **Consensus Note:** Scholars overwhelmingly agree Robin Hood is a legendary figure, likely an amalgamation of various outlaws and literary tropes. No credible evidence points to a single historical individual.

  2.  **Moses (Strictly as Individual Leader):**
      *   **Rule A Prediction:** **No.** There is no archaeological evidence or contemporary Egyptian/Levantine records corroborating the existence of an individual named Moses who led a group (of any significant size) out of Egypt, received laws on a mountain, etc. The core *event* (Exodus) lacks corroboration, and the individual is inseparable from it in the narrative.
      *   **Rule B Prediction:** **No.** The name "Moses" (Moshe) is *only* attested within the biblical tradition itself. There are no known early non-epic, non-biblical Egyptian or Near Eastern sources (e.g., inscriptions, administrative texts, chronicles) mentioning a figure by that name matching the biblical role. The name's potential Egyptian etymology is noted, but this doesn't constitute attestation of the individual.
      *   **Consensus Note:** There is **no** scholarly consensus on a historical Moses. While the Hebrew Bible is our main source, the complete lack of contemporary external evidence and significant historical problems with the Exodus narrative lead most historians and archaeologists to conclude that Moses, as described, is a legendary or mythical figure central to Israelite identity formation. His existence as a specific historical individual is unproven and considered unlikely by many.

  3.  **Etzel (Nibelungenlied):**
      *   **Rule A Prediction:** **No.** While the Hunnic court was real, the *specific events* surrounding Etzel in the *Nibelungenlied* (the invitation, the treacherous massacre at the feast, the role of Kriemhild's revenge as the central dramatic event) lack any historical corroboration. The epic events are legendary fabrications.
      *   **Rule B Prediction:** **Yes.** The figure "Etzel" is directly based on the historical **Attila the Hun** (d. 453 CE). Attila is extensively attested in numerous early, non-epic, non-legendary sources: Roman histories (Priscus of Panium, who actually met him; Jordanes), Gallic chronicles (e.g., *Chronica Gallica*), and possibly even fragmentary Hunnic oral traditions recorded by others. His name, his position as king of the Huns, the location of his court, and the general historical context are well-established independently of Germanic epic.
      *   **Consensus Note:** It is universally accepted by historians that **Etzel is a literary representation of the historical Attila the Hun.** Attila's existence and his powerful role in 5th-century Europe are firmly established by contemporary and near-contemporary sources. The *Nibelungenlied*'s portrayal of *events* involving him, however, is entirely legendary.

  **Where the Rules Come Apart:** The case of **Etzel/Attila** clearly differentiates the rules:
  *   Rule A focuses on the *epic event* (the massacre at Etzel's court) and finds **no corroboration**, predicting **No**.
  *   Rule B focuses on the *name* (Etzel/Attila) and finds **strong early non-epic attestation**, predicting **Yes**.

  **Your Friend's Likely Rule & Best Guess Prediction:**

  Your friend's "Yes" verdict on **Gilgamesh** hinges explicitly on "his appearance in ancient king lists and early non-epic references" (Rule B). Her "No" on Arthur aligns with the lack of such early attestation (the name appears much later in quasi-historical chronicles already blending legend). Her "Yes" on Troy focuses on the *site* and *event* (conflict/destruction at Hisarlik - Rule A), but crucially, Gilgamesh provides the clearer insight into her primary weighting for *individuals*. The Trojan War "Yes" might be an exception where site/event evidence overrides the lack of named individuals in early records, or it might indicate she uses a combined approach but prioritizes Rule B for figures. However, **Rule B (Early Non-Epic Attestation of the Name)** provides the most consistent and explicitly stated rationale across her verdicts, especially for judging *individuals* (Gilgamesh, Arthur, Ragnar, Tell).

  *   **Best Guess Prediction:**
      *   Robin Hood: **No** (Both rules agree, no early attestation or corroborated event).
      *   Moses: **No** (Both rules agree, no early attestation or corroborated event/individual).
      *   **Etzel: Yes** (She will accept the historical core *because* Etzel is directly based on the well-attested Attila, fulfilling Rule B, even though the epic events are fictional).

  **Further Case to Test the Rules:**

  *   **The Case:** **Lycurgus of Sparta** (the legendary lawgiver).
  *   **Rule A Prediction:** **No.** The core "event" (Lycurgus single-handedly establishing Sparta's entire unique constitution and social system) lacks archaeological corroboration. The system likely evolved over time.
  *   **Rule B Prediction:** **Uncertain/Probable No.** Herodotus and Xenophon mention him (5th-4th century BCE), but Sparta itself had no contemporary records from the time he supposedly lived (variously placed 9th-7th century BCE). These are historical writings, but relatively late and reliant on tradition. Earlier sources (e.g., Tyrtaeus, 7th century BCE) mention laws but not Lycurgus by name as their author.
  *   **Why it Tells Them Apart:** If she says **Yes**, she's leaning towards **Rule B** (name appears in significant, albeit later, historical sources like Herodotus, even if the events/system aren't directly corroborated). If she says **No**, she's leaning towards **Rule A** (no evidence for the specific core event/achievement attributed to him in the tradition). (Scholarly consensus: Lycurgus is almost certainly a legendary or semi-legendary figure; the Spartan system developed gradually. No contemporary evidence for him exists.)
