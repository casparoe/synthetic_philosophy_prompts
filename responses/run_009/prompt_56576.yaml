prompt: |-
  I sit on the clinical review panel at my hospital, where we adjudicate disputed comparisons — which drug to keep on formulary, which protocol performed better, who gets credit in our internal quality metrics. We've developed a track record on cases where a stratified analysis reverses the aggregate result, and next month we face a new one that has us split down the middle. I don't need a lecture on the arithmetic of the reversal; we all understand how the weighting produces it. What I need is a recommendation consistent with our own precedents, an identification of the closest analog, and a candid account of what principle we'd be committing ourselves to either way.

  Our files first. In Case 1, we had to choose a default between two stone-removal procedures: the newer procedure had the better overall success rate, but within both the small-stone group and the large-stone group the older procedure did better, because the newer one had mostly been tried on small stones. We chose the older procedure, reasoning that stone size is fixed before treatment and the aggregate was just mixing patients of different difficulty. In Case 2, our annual award between two surgeons, the junior surgeon had lower mortality within every pre-operative risk stratum, but the senior surgeon had lower raw mortality overall because he disproportionately took the easy cases. We gave the award to the senior surgeon, on the ground that the question was who had the better year with the case mix he actually had, not who we'd refer a family member to. In Case 3, an observational comparison of a cholesterol drug, the drug looked worse within both the smokers and the non-smokers but better overall, because patients on the drug were disproportionately non-smokers; we discounted the aggregate and judged the drug not shown to help.

  The new case: Drug N versus Drug O for treatment-resistant depression, using pooled observational data from our network, with no randomized head-to-head available. Within the patients who stayed on their assigned medication through the six-month endpoint, and within those who dropped out before it, O shows better symptom scores; overall, N shows better scores. The reason is that N is far better tolerated — many more patients assigned O quit within the first month — and, crucially, whether a patient stays on the medication is itself caused by which medication she got. One colleague insists that our Case 1 precedent settles it: when the strata reverse the aggregate, we trust the strata, so we recommend O. Another says the stratification variable is downstream of treatment, which is exactly what made the aggregate untrustworthy in Cases 1 and 3, so the stratified comparison here is the artifact and we should recommend N. A third notes that Case 2 shows we're perfectly willing to go with the aggregate when the question is how things actually turned out rather than what would have happened otherwise. What should we decide if we want to be consistent with ourselves? Which precedent is genuinely the closest analog, and where does the analogy break? If our track record underdetermines the verdict, name the rules that would each fit every case we've decided so far, say what each recommends here, and describe the further case — realistic enough to land on our docket — that would best force us to choose between them.
reasoning: |-
  Okay, the user is part of a clinical review panel that deals with disputed comparisons. They've provided three previous cases where stratified analysis reversed the aggregate results, and now they have a new case involving Drug N vs Drug O for treatment-resistant depression. The panel is split, and they need a recommendation consistent with their precedents, identification of the closest analog, and an honest account of the principles involved.

  First, I need to understand each precedent case thoroughly. In Case 1, they chose the older stone-removal procedure because although the newer one had a better overall success rate, the older one performed better within both small and large stone groups. The key point was that stone size is a pre-treatment variable, so the aggregate was misleading due to case mix differences. The principle here is that stratification by a pre-treatment confounder reveals the true causal effect.

  In Case 2, they awarded the senior surgeon despite the junior surgeon having lower mortality in every risk stratum. The senior surgeon had lower raw mortality because he took easier cases. The panel prioritized the actual outcomes given the case mix handled, not the counterfactual performance. So, the principle is descriptive evaluation of actual results, not causal inference.

  Case 3 involved a cholesterol drug that looked worse within smokers and non-smokers but better overall because more non-smokers were on the drug. They discounted the aggregate since smoking status was a confounder. Here, stratification by a pre-treatment variable (smoking) was trusted over the aggregate, aligning with Case 1's principle.

  Now, the new case: Drug N vs Drug O for depression. The aggregate shows N better, but within both completers and dropouts, O has better symptom scores. The twist is that adherence (staying on medication) is caused by the treatment itself. N is better tolerated, leading to higher adherence. So, adherence is post-treatment, not pre-treatment like in Cases 1 and 3.

  The user's colleagues have different interpretations. One cites Case 1, saying trust the strata. Another says adherence is downstream, so aggregate is better. A third points to Case 2's focus on actual outcomes.

  The challenge is determining the closest precedent. Cases 1 and 3 involve pre-treatment variables (stone size, smoking), making stratification valid. Case 2 is about descriptive assessment. The new case's adherence is post-treatment, so stratifying on it introduces selection bias. If they adjust for adherence, they might be adjusting away part of the treatment effect since adherence mediates the outcome.

  The closest analog is actually Case 3, but with the critical difference that the stratifying variable (adherence) is affected by treatment. This breaks the analogy because in Case 3, smoking wasn't affected by treatment. So, the principle from Cases 1 and 3 can't apply directly here.

  Case 2's principle of actual outcomes might support using the aggregate. But is that the goal here? For formulary decisions, the panel likely wants the causal effect, not descriptive performance. The user mentioned that in Case 2, they distinguished between who had a better year vs who they'd refer to, indicating context matters.

  For the depression drugs, the question is probably which drug is better causally, not descriptively. So, if they use the aggregate, they capture the real-world effectiveness including tolerability. But if they want the biological effect, conditioning on adherence is problematic.

  The panel needs to decide the question's intent. If it's about which drug works better if taken, then conditioning on adherence is necessary but biased. If it's about which drug provides better outcomes in practice, including tolerability, then aggregate is appropriate.

  The precedents underdetermine because they don't address post-treatment variables. To force a decision, a hypothetical case could involve a variable affected by treatment but also influencing outcome, like in the provided example of physical therapy attendance post-surgery.

  The user needs clarity on whether their goal is causal effect or real-world effectiveness. Given Case 2's distinction, and since this is a formulary decision, effectiveness including tolerability might be key, favoring aggregate. But they must acknowledge the new principle: not stratifying on post-treatment mediators.
answer: |-
  Based on your precedents and the specific challenge of the depression drug case, here's the recommended path forward:

  **Recommendation: Choose Drug N (the aggregate result)**  
  **Closest Analog: Case 2 (surgeon award)**  
  **Key Principle Committed To: When evaluating real-world effectiveness (including downstream effects of tolerability), aggregate outcomes reflect operational reality. Stratification on post-treatment mediators can mask a treatment's *total* clinical impact.**

  ---

  ### Breakdown of Precedents & Analogies
  1. **Case 1 (Stone Procedures)**  
     - **Principle:** Stratify when a *pre-treatment confounder* (stone size) distorts aggregate results.  
     - **Why not analogous:** Stone size is fixed before treatment. Here, adherence *is caused by treatment itself*. Conditioning on it introduces collider bias.

  2. **Case 2 (Surgeon Award)**  
     - **Principle:** Aggregate outcomes matter when assessing *actual delivered performance* (case mix handled). Not counterfactual "if same cases."  
     - **Analogy:** Drug N’s tolerability (leading to higher retention) is part of its clinical value, akin to the senior surgeon’s case selection. The aggregate reflects "what happened" in practice.

  3. **Case 3 (Cholesterol Drug)**  
     - **Principle:** Stratify when a *pre-treatment confounder* (smoking status) distorts aggregates.  
     - **Why not analogous:** Smoking status is pre-treatment. Adherence here is a *consequence* of treatment, not a confounder.

  ---

  ### Where the Analogy Breaks
  - **Case 2 analogy limitation:** The surgeon’s case mix was exogenous (assigned by hospital workflow). Here, adherence is *directly caused by the drug’s properties* (tolerability). This makes Drug N’s aggregate advantage *more* defensible—it’s an intrinsic feature, not external assignment.

  ---

  ### Underdetermined Precedents & Competing Rules
  Your track record supports **two distinct rules**, both compatible with past cases but conflicting here:  
  1. **Rule A (Causal Inference):** *"Trust strata only if stratifying on pre-treatment variables."*  
     - Fits Cases 1 & 3.  
     - **Here:** Recommends **ignoring strata** (adherence is post-treatment) → Favors **Drug N (aggregate)**.  
  2. **Rule B (Descriptive Performance):** *"Use aggregate outcomes when evaluating real-world delivery."*  
     - Fits Case 2.  
     - **Here:** Recommends **Drug N (aggregate)**.  

  **Surprise:** Both rules converge on **Drug N** in this case. Rule A rejects the strata; Rule B embraces the aggregate.  

  ---

  ### The Critical Test Case to Force a Choice
  **Scenario:** Two antibiotics for pneumonia.  
  - **Drug X:** Higher cure rate *if* full course completed, but 30% stop early due to side effects.  
  - **Drug Y:** Lower cure rate per course, but 95% complete treatment.  
  - **Aggregate:** Drug Y has higher cure rates.  
  - **Stratified:** Within "completed course" patients, Drug X is superior.  
  - **Crucial twist:** *Treatment completion is electronically monitored and unrelated to symptoms* (e.g., discontinuation solely due to drug-induced rash).  

  **Why it forces a choice:**  
  - **Rule A (Causal):** Strata (completion) is post-treatment → Trust aggregate → Favors **Drug Y**.  
  - **Rule B (Descriptive):** Favors **Drug Y** (better real-world results).  
  - **But:** If your panel *hypothetically* preferred stratification here, you’d need a **new Rule C**: *"Stratify on post-treatment actions if they reflect patient choice unrelated to outcome."* This contradicts your rejection of strata in Case 3.  

  **This test case isolates the tension:** Is discontinuation due to side effects a "clinical reality" (favoring aggregate) or a bias to adjust away (favoring strata)? Your current precedents lean toward aggregate in such scenarios.

  ---

  ### Conclusion
  To stay consistent:  
  1. **Recommend Drug N.** Its aggregate advantage stems from a clinically relevant property (tolerability affecting adherence).  
  2. **Invoke Case 2:** Emphasize that operational effectiveness includes managing downstream consequences (adherence), just as surgical outcomes include case mix.  
  3. **Clarify the principle:** *"When the stratifying variable is a consequence of treatment (e.g., adherence mediated by tolerability), aggregate outcomes reflect total clinical impact and align with real-world decision-making."*  

  This maintains coherence with your history while acknowledging that adherence is not a confounder but a *mediator*—adjusting for it would erase part of Drug N’s therapeutic value.
