    - **Resolution:** (4) can include moral projects like volunteering, and (5)'s lapse being "not wrong" reflects that projects may override relationships. Both allow for prioritization without conflict.

  #### Which Single Revision Would Clean Up the Most?
  Revising **(2)** would resolve the most severe tensions. Specifically:
  - Modifying (2) to allow for moral thresholds (e.g., "moral demands have limits when non-moral goods are at stake") would directly address:
