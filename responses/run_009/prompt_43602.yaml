  The two positions:
  1. Whole-brain criterion (WBC): Death is the irreversible loss of all brain function, because the brain is what integrates the organism as a whole.
  2. Circulatory-respiratory criterion (CRC): Death is the irreversible cessation of circulation and respiration, and a patient with a beating heart on a ventilator is still alive, whatever their prognosis.

