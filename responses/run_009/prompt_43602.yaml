  1. Agreed claims (numbered list of substantive claims both sign)
  2. Disagreements (table with three columns: topic, WBC wording, CRC wording)
  3. Cruxes (for each non-verbal disagreement, identify the crux, a joint test, and each side's prediction) - with at least three hard cases: (a) brain-dead pregnant patient, (b) DCD (donation after circulatory death), (c) experimental brain perfusion. May add more.
