  **Joint Statement of an Adversarial Collaboration on the Definition of Death**

  **Introduction**

  We, the undersigned, have engaged in a year-long adversarial collaboration to clarify our disagreements and seek common ground on the definition and criteria for determining human death. One of us (the WBC advocate) holds that death occurs with the irreversible cessation of all functions of the entire brain, which is responsible for the critical integrative functions of the organism as a whole. The other (the CRC advocate) holds that death occurs with the irreversible cessation of circulatory and respiratory functions, and that a patient with a beating heart, even if supported by a ventilator and with a devastating brain injury, remains alive until circulation and respiration irreversibly stop. 

  Despite our differences, we have identified areas of agreement, clarified the nature of our disagreements, and established tests that could potentially resolve some disputes. We hope this statement will advance public and professional understanding.

  **1. Agreed Claims**

  Both parties agree on the following substantive claims:

  1. The definition of death must be grounded in biological reality, specifically the irreversible loss of the organism's functioning as a whole. We agree that death is a biological event and not a social or legal construct, though its determination has social and legal implications.

  2. The law in the United States (and many other jurisdictions) defines death as either the irreversible cessation of circulatory and respiratory functions or the irreversible cessation of all functions of the entire brain, including the brainstem. However, the law does not resolve the philosophical and biological disagreements about which criterion is primary or correct; it merely provides two legally equivalent pathways.

  3. The dead-donor rule (DDR) — which states that organ procurement must not cause the donor's death — is a fundamental ethical constraint in transplantation medicine. Both parties are committed to maintaining the DDR and reject any move to abandon it covertly. We agree that if the DDR is to be revised, it must be done transparently through public and professional deliberation.

  4. In clinical practice, the vast majority of deaths are determined by circulatory-respiratory criteria. Brain death determination is a relatively rare event, typically occurring in intensive care units when patients with catastrophic brain injuries are mechanically ventilated. Both parties agree that in these cases, the patient has suffered an unsurvivable injury.

  5. The irreversible loss of consciousness and cognitive function (i.e., higher brain functions) alone is insufficient for declaring death under either criterion. Both parties reject the "higher brain" standard (which equates death with permanent loss of personhood) as a valid criterion for death.

  6. The term "irreversible" must be understood in a biological and clinical context, meaning that the function cannot be restored by available means. We agree that the possibility of future technological interventions (e.g., hypothetical brain resuscitation) does not affect current irreversibility if such interventions are not currently available.

  7. There is a set of cases that both parties classify identically as death: 
     - A patient with no brain activity and no circulatory activity (e.g., after cardiac arrest without resuscitation).
     - A patient declared brain dead by accepted medical standards (e.g., the American Academy of Neurology guidelines) and whose circulatory function is being maintained artificially only temporarily (e.g., for organ donation) — both agree this patient is dead.
     - A patient with a devastating brain injury but intact brainstem function who is ventilator-dependent but has spontaneous circulation — both agree this patient is alive.

  8. We agree that the public and professional confusion surrounding death determination, especially in the context of organ donation, is detrimental and requires clearer communication and education.

  **2. Disagreements**

  The following table presents key points of disagreement, with each side's position stated in their own acceptable wording.

  | Topic | Whole-Brain Camp's Wording | Circulatory-Respiratory Camp's Wording |
  |-------|----------------------------|----------------------------------------|
  | **The biological basis of death** | Death is the irreversible loss of the organism's integrated functioning as a whole, which is mediated by the brain. Without brain function, the body is no longer a unified organism but a collection of organs. | Death is the irreversible cessation of the body's vital functions of circulation and respiration. These functions are necessary to sustain the life of the organism's cells and without them, the organism cannot survive. |
  | **Status of a brain-dead patient on a ventilator** | A patient who meets the clinical and confirmatory tests for brain death is dead, even if mechanical ventilation and pharmacological support maintain circulation and respiration. The body's continued cellular metabolism and even somatic reflexes do not indicate life at the organismic level because integration is lost. | A patient with a beating heart, even if brain-dead by neurological criteria, is still alive because circulation and respiration are occurring. The cessation of these functions must be irreversible for death to occur. The use of a ventilator does not change the fact that the heart is beating and blood is circulating. |
  | **Permanence vs. irreversibility in circulatory death** | In donation after circulatory death (DCD), death is declared after a short interval (e.g., 2-5 minutes) of circulatory cessation because the cessation is permanent (i.e., it will not restart spontaneously) and irreversibility is assured by the decision not to resuscitate. This satisfies the irreversibility requirement for death. | In DCD, the cessation of circulation is permanent (due to the no-resuscitation order) but not irreversible in the strict sense because circulation could be restored if resuscitation were attempted. Therefore, the patient is not dead at the time of organ procurement. The dead-donor rule is violated unless the patient is first declared dead by neurological criteria. |
  | **The role of the brain in integration** | The brain is the central integrator without which the body cannot maintain homeostasis, respond to environmental changes, or function as a whole. Even if some somatic functions continue, they are merely disaggregated cellular activities. | While the brain plays a role in integration, the body can exhibit integrated functions (e.g., wound healing, immune response, and even gestation) without brain function. Moreover, circulation is the fundamental process that delivers oxygen and removes waste, without which brain function cannot occur. |

  **3. Cruxes**

  For each substantive disagreement, we identify the crux and a test that both parties agree would bear on it. We also state each party's prediction.

  *(a) Brain-dead pregnant patient kept on somatic support for weeks*

  - **Crux**: Can an organism that is dead (by WBC) support the growth and development of a fetus? If so, does this challenge the idea that the brain is necessary for organismal integration?
  - **Joint Test**: Cases of brain-dead pregnant women maintained for extended periods (e.g., weeks to months) to allow fetal maturation. Both parties agree to examine the physiological processes that occur in the mother's body during this period.
  - **WBC Prediction**: The WBC advocate predicts that the mother's body will exhibit only fragmented physiological processes (e.g., hormone replacement is required, infections are common, and homeostasis is artificially maintained). The body does not function as an integrated whole without the brain, and the pregnancy is an independent process of the fetus, not evidence of maternal integration.
  - **CRC Prediction**: The CRC advocate predicts that the mother's body continues to perform integrated functions (e.g., maintaining a suitable environment for the fetus, including temperature regulation, nutrient delivery, and waste removal) without brain function. This indicates that the body remains alive and that the brain is not the sole integrator.

  *(b) Donation after Circulatory Death (DCD)*

  - **Crux**: Is the cessation of circulation irreversible in DCD when a no-resuscitation order is in place, or is it merely permanent?
  - **Joint Test**: Data from cases of prolonged circulatory cessation (e.g., 10-20 minutes) without intervention, and the observed outcomes when resuscitation is attempted after similar intervals. Both parties agree to examine the threshold at which auto-resuscitation (spontaneous return of circulation) becomes impossible and the point at which resuscitation attempts fail.
  - **WBC Prediction**: The WBC advocate predicts that after 2-5 minutes of asystole, auto-resuscitation is impossible, and without intervention, the cessation is irreversible. Therefore, the patient is dead at the time of declaration in DCD.
  - **CRC Prediction**: The CRC advocate predicts that irreversibility requires that circulation cannot be restored by any means (including resuscitation), and since resuscitation could be successful if attempted even after 5 minutes, the patient is not dead at the time of declaration in DCD. The irreversibility threshold is only met when resuscitation is attempted and fails, or after a much longer period (e.g., 20-30 minutes).

  *(c) Experimental perfusion of large-mammal brains hours after death*

  - **Crux**: Does the partial restoration of cellular activity in a brain after hours of circulatory cessation indicate that the loss of brain function was not irreversible? And does this challenge the whole-brain criterion?
  - **Joint Test**: The results of experiments (e.g., the Yale Brain Ex study) that restore some cellular functions in isolated pig brains hours after death. Both parties agree to examine the extent of functional restoration (e.g., metabolic activity, cellular health, and any signs of integrated electrical activity).
  - **WBC Prediction**: The WBC advocate predicts that while cellular metabolism might be restored, integrated brain function (including electrical activity and consciousness) will not return. This does not challenge the irreversibility of brain death because the restoration is not of integrated function and is achieved only with external intervention.
  - **CRC Prediction**: The CRC advocate predicts that if cellular activity can be restored, it shows that the brain was not irreversibly damaged at the time of death declaration by circulatory criteria. This highlights that irreversibility is context-dependent and that the brain may be viable longer than previously thought, challenging the current DCD protocols.

  *(d) Added case: A patient with total brain failure except for isolated hypothalamic function (regulating some hormones)*

  - **Crux**: Does isolated hypothalamic function in an otherwise brain-dead patient constitute integrated functioning of the organism as a whole?
  - **Joint Test**: Clinical cases of brain-dead patients with preserved hypothalamic function (e.g., maintaining body temperature and some hormonal cycles) without external support beyond mechanical ventilation.
  - **WBC Prediction**: The WBC advocate predicts that hypothalamic function alone does not constitute integration of the organism as a whole because it is a single function and does not coordinate the entire body. The patient is dead.
  - **CRC Prediction**: The CRC advocate predicts that any somatic function, especially one that regulates a critical aspect of homeostasis, indicates that the organism is still alive. The patient is not dead.

  **4. Verbal versus Substantive Disagreements**

  We distinguish between disagreements that are primarily verbal (about the meaning of words) and substantive (about facts or values).

  - **Verbal Disagreement**: The dispute over the term "integration" is partly verbal. Both sides agree that the organism must function as a whole, but they define "integration" differently. The WBC camp focuses on the brain's role in neural integration, while the CRC camp emphasizes circulatory integration. This could be seen as a difference in emphasis, but it leads to different conclusions about which functions are essential.

  - **Substantive Disagreements**:
    - The role of the brain in organismal integration: This is a factual disagreement about whether the brain is necessary for the body to function as a whole. The WBC camp holds that without the brain, the body is not integrated; the CRC camp holds that integration can occur without the brain (as in somatic survival and pregnancy).
    - The irreversibility in DCD: This is a conceptual and factual disagreement about the meaning of "irreversible" and the biological facts of auto-resuscitation and resuscitability.

  Justification: The verbal component arises because both sides use the same term "integration" but apply it to different physiological processes. The substantive disagreements, however, are about what constitutes the critical functions for life and death, which are value-laden biological questions.

  **5. What Would Move Them**

  Both parties agree that the following could advance the dispute:

  - **New evidence on integration without the brain**: If studies show that bodies without brain function can maintain homeostasis and respond to stressors in a coordinated way (beyond what is currently observed), it would challenge the WBC. Conversely, if such bodies consistently deteriorate without artificial support in all systems, it would support the WBC.
    
  - **Technological advances**: If future technology allows for the restoration of integrated brain function after prolonged circulatory cessation (e.g., hours), it would force a re-evaluation of both criteria. The WBC camp would have to reconsider irreversibility, and the CRC camp would have to address the implications for death determination.

  However, both parties acknowledge that their core disagreement might not be resolved by foreseeable evidence. The WBC advocate bases the criterion on the brain's role in integration, which they see as a fundamental biological fact. The CRC advocate bases it on the primacy of circulation, which they see as the most basic vital function. These positions reflect deep-seated differences in what each considers the essence of life.

  Despite this, the collaboration was worth doing because it has clarified the points of agreement and disagreement, identified testable hypotheses, and provided a framework for public discourse. It also underscores the importance of maintaining the dead-donor rule and the need for transparency in organ procurement.

  ---

  **JSON Summary**

  We now provide a structured summary in JSON format as specified.

