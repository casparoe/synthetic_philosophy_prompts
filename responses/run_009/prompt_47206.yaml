prompt: |-
  I'm the newly appointed chair of the exceptionality committee at a mid-sized regional hospital, which decides, roughly every week or two, how to allocate a fixed pool of money or medication when demand exceeds supply. I spent fifteen years as a bedside nurse before this, and the appointment has landed on me rather than being something I trained for. Our decisions are usually versions of the same dilemma: one identifiable patient with a large need versus many patients with smaller ones. A single very expensive one-off therapy for one child with a rare disease versus funding our vaccination outreach for a season; a full course of a scarce antiviral for the three sickest patients on the ward versus partial prophylactic doses for everyone; a budget cut that forces us to choose between withdrawing one chronic patient's ongoing therapy and degrading wound-care supplies for the whole floor. I understand the utilitarian answer is typically to maximize the aggregate, and I also understand there is a deep objection to it, going back to Rawls and Nozick: that persons are separate, that there is no single vessel whose welfare is being topped up, and that treating losses to one person as offset by gains to another is precisely what morality forbids, as if we were trading prospects within a single life rather than across distinct ones. What I do not have is any way to turn that objection into practice, and my committee — clinicians, not philosophers, rotating every six months, with the medical director signing off on everything — meets for thirty minutes and has to leave with a decision.

  What I want from you is a decision procedure we can actually run in that half hour. It should be an ordered sequence of questions, each with a statement of what counts as a sufficient answer, and it should say explicitly where the procedure terminates in a firm "no, we will not aggregate across persons here" and where instead it must hand the question back to a named human being because what remains is a matter of values rather than facts. The procedure cannot presuppose any theory, since my colleagues will not read one, but it should carry over the distinctions that genuinely matter — the difference between using a person as a means and merely giving them lower priority, the difference between an identifiable claimant standing before us and a statistical beneficiary who may never learn of our choice, the difference between aggregation within one patient's treatment plan and aggregation across patients — and it should be honest about which distinctions had to be dropped for the sake of usability and what could go wrong as a result. Then I want you to run the procedure on the three cases I described above, showing the reasoning at each step. At least one of these should come out the way I privately hope it will not, and you should tell me which one and why the procedure forces that result. Finally, describe the procedure's failure modes plainly: the situations where aggregation will slip back in through the wording of a question, where an advocate could steer the outcome by framing, and where the procedure simply has nothing to say.

  Please write the whole thing as continuous prose only, no headings, no bullet points, no bold text, no tables, the way a long letter would read, since I intend to paste it directly into our committee minutes and circulate it by email.
reasoning: |-
  Hmm, the user has given me a detailed query about developing a decision procedure for their hospital's exceptionality committee. They're the new chair, coming from a nursing background without formal training in ethics, and they need a practical framework for making tough allocation decisions when resources are scarce. Their committee meets for just 30 minutes every week or two to decide cases like funding expensive one-off therapies versus population-level interventions, or choosing between concentrated and distributed treatments.

  The user clearly understands the philosophical tension between utilitarianism (maximizing aggregate benefit) and deontological ethics (respecting individual rights and separateness of persons). They've referenced Rawls and Nozick, showing they're familiar with the theoretical objections to treating people as interchangeable vessels for utility. But what they desperately need is something operational - a step-by-step process that can be run in half an hour by busy clinicians who aren't ethicists.

  They want an ordered sequence of questions with clear decision points that:
  - Respects key ethical distinctions (using vs. prioritizing, identifiable vs. statistical patients, intra-patient vs. inter-patient aggregation)
  - Explicitly states where to refuse aggregation
  - Delegates value judgments to humans when needed
  - Acknowledges what compromises were made for usability
  - Includes analysis of their three sample cases with at least one "uncomfortable" outcome
  - Identifies failure modes and vulnerabilities

  The output must be in continuous prose only - no headings, bullets or formatting - since it'll go directly into committee minutes.

  This is quite comprehensive. I'll need to design a procedure that starts with fundamental constraints before considering aggregation, builds in off-ramps where individual claims must be respected, and only permits aggregation under strict conditions. The sequence should mirror how ethical reasoning might unfold: first checking for rights violations, then examining alternatives, then considering scale and irreparability before allowing any trade-offs.

  For their cases:
  1) The rare disease therapy vs. vaccination program clearly pits one identified child against statistical lives. The procedure should block aggregation here.
  2) Full treatment for sickest vs. prophylaxis for all involves intra-patient trade-offs (since prophylaxis affects treatment efficacy) - aggregation might be permitted with safeguards.
  3) Chronic therapy withdrawal vs. degraded wound care is about sustained harm to one vs. distributed minor harms - likely another aggregation refusal.

  The vaccination case will be the uncomfortable one where aggregation might be forced due to the massive scale difference - showing exactly where the procedure's compromises bite.

  Key failure modes to highlight include:
  - How "irreparable harm" can be gamed by advocates
  - How the "no alternatives" test might be rushed
  - Where statistical beneficiaries get systematically discounted
  - How the scale multiplier could overwhelm individual claims

  The prose needs to flow naturally while maintaining rigorous logic - challenging but doable by structuring it as a narrative walkthrough. I'll begin with the procedure's design principles, then present the question sequence, then apply it to each case with transparent reasoning, and conclude with limitations. Throughout, I'll emphasize this is a decision aid rather than an algorithm - it structures deliberation but doesn't replace judgment.
answer: |-
  Here is the decision procedure you requested, presented as continuous prose suitable for your committee minutes. I'll first outline the sequence of questions, then apply it to your three cases, noting where outcomes may conflict with personal hopes, and finally describe the inherent limitations and failure modes.

  Begin every deliberation by stating the decision to be made clearly: "We must allocate [resource] between Option A [describe concisely] and Option B [describe concisely]." Ensure both options are framed neutrally and factually. Then proceed sequentially through the following questions. Answer each question based solely on verifiable facts or committee consensus achievable within a minute. If consensus isn't reached instantly, the chair summarises the dominant view and moves on – deliberation is time-bound. A "yes" to any question 1-3 terminates the procedure against aggregation; proceed only if all are "no". Questions 4-6 may permit aggregation under strict conditions, otherwise terminate or delegate.

  First, does either option involve actively using a specific, identifiable person solely as a means to benefit others, without their consent and against their fundamental interests? For instance, non-consensual experimentation on one patient to save others. If yes, reject that option immediately. Sufficient for "yes" is clear evidence or unanimous agreement that the action instrumentalises an individual in a way violating core medical ethics, akin to coercion or exploitation. If yes, aggregation is forbidden; choose the other option or seek alternatives. If no, proceed.

  Second, would choosing Option A over Option B (or vice versa) directly cause the certain, imminent death or irreversible, catastrophic harm (e.g., permanent vegetative state, loss of major organ function) of an identifiable patient who would otherwise avoid that outcome? Focus solely on direct, immediate causation for the specific individual denied the resource. Speculative or probabilistic harms don't count here. "Identifiable" means the patient is known, named, and currently under our care or clearly eligible. If yes, aggregation is forbidden; prioritize preventing that catastrophic harm. If no, proceed.

  Third, is the core conflict primarily about distributing harms *within* a single patient's treatment plan rather than *between* distinct patients? For example, choosing a risky but potentially curative dose for one patient versus a safer palliative dose for the same patient. If yes, this is intra-patient aggregation, generally permissible in clinical judgment; delegate the decision to the treating physician(s) involved, as it concerns optimizing care for one life. The committee only ensures due process was followed. If no, proceed – we are dealing with inter-patient allocation.

  Fourth, are there any feasible alternatives (e.g., borrowing stock, delaying non-urgent care, external funding appeals) that could fully or sufficiently resolve the shortage without forcing this choice? Exhaust all realistic options known within five minutes. Sufficient for "no alternatives" is confirmation from pharmacy, finance, or relevant department heads that no viable workaround exists within the required timeframe. If alternatives exist, delegate to the Medical Director to pursue them urgently; table this allocation decision. If no alternatives exist, proceed.

  Fifth, would one option create a large number of severe, irreparable harms (e.g., permanent disability, preventable deaths) that are vastly out of scale with the harms prevented by the other option? "Vastly out of scale" means an order of magnitude difference (e.g., 10+ severe harms prevented vs. one non-catastrophic harm caused, or one death prevented vs. dozens of minor reversible harms). "Irreparable" means the harm cannot be reasonably mitigated later. If yes, aggregation may be permissible; the scale and irreparability create moral urgency for maximizing lives saved or catastrophic harms prevented. Proceed to Question 6 to refine. If no, or if scales are comparable, aggregation is not justified; delegate the final decision to the Medical Director as a value judgment on non-aggregative grounds (e.g., fairness, loyalty, precedent).

  Sixth, if proceeding from Question 5 (scale justifies aggregation), can the chosen option be implemented with robust safeguards to mitigate foreseeable unfairness? Examples: a transparent lottery if eligible patients are similar, phased roll-out if possible, ensuring no vulnerable group is disproportionately burdened, clear communication plans. If feasible safeguards can be devised in three minutes, proceed with aggregation (choose the option saving more lives/preventing more severe harms) incorporating those safeguards. If no feasible safeguards exist, aggregation might still be the least worst option, but delegate the final, painful decision to the Medical Director, acknowledging the moral residue.

  **Application to Cases:**

  1.  **One child's rare therapy vs. Seasonal vaccination outreach:** Start: Allocate funds between Child X's one-off therapy (Option A) or community vaccination program (Option B). Q1: No, neither uses a person as a means. Q2: Denying therapy *might* cause Child X's death (if therapy is life-saving); denying vaccinations *will* cause some preventable deaths/illnesses, but these are statistical, not identifiable *individuals* facing *certain* death *imminently* from *this* decision. Only Child X is identifiable and faces certain catastrophic harm if denied. Answer Q2: **Yes** (denying Option A directly causes catastrophic harm to identifiable Child X). **Terminate against aggregation.** Fund the child's therapy. *(Note: This aligns with avoiding aggregation. The uncomfortable case for you might be next).*

  2.  **Full antiviral for three sickest vs. Prophylactic doses for all:** Start: Allocate scarce antiviral between full treatment for 3 critically ill (Option A) or partial prophylaxis for all exposed (Option B). Q1: No. Q2: Denying Option A directly risks death for 3 identifiable patients. Denying Option B risks illness/death for many, but these harms are probabilistic and not *certain* or *imminent* for specific identified individuals solely because of *this* dose denial. Answer Q2: **No.** Q3: No, this is allocation *between* distinct patients. Q4: Assume no alternatives. Q5: Option A prevents 3 likely deaths. Option B might prevent many more infections and potential deaths/severe illness (e.g., 20+ severe cases, some deaths). The scale difference (many severe harms prevented by B) is potentially vast. Harm from denied prophylaxis is severe and potentially irreparable (death/disability). Answer Q5: **Likely Yes** (if prophylaxis efficacy is high and exposure risk is high). Q6: Safeguards? Perhaps prioritize prophylaxis for most vulnerable if feasible. If possible, **proceed with aggregation:** Fund prophylaxis, maximizing severe harm prevention. *(Note: This might be your uncomfortable outcome – sacrificing 3 identifiable lives for statistical many. The procedure forces it due to scale and irreparability in Q5, overriding Q2 because the harms prevented by Option B, while statistical, are severe and numerous enough. The distinction between identifiable and statistical is dropped here for scale).*

  3.  **Withdraw one chronic therapy vs. Degrade wound care for all:** Start: Implement budget cut by withdrawing Patient Y's chronic therapy (Option A) or degrading wound-care supplies for the entire floor (Option B). Q1: No. Q2: Withdrawing Option A *directly* causes catastrophic harm (e.g., rapid decline, death) to identifiable Patient Y. Degrading wound care (Option B) *may* cause harm (infections, delayed healing) to many, but severe outcomes (e.g., sepsis, amputation) are probabilistic and not certain & imminent for specific individuals *because of this specific supply degradation*. Answer Q2: **Yes** (for Option A denial). **Terminate against aggregation.** Do not withdraw Patient Y's therapy; implement the wound-care degradation. *(Note: Similar logic to case 1; the immediate, certain, catastrophic harm to the identifiable patient blocks aggregation, even though degrading wound care may statistically cause more harm overall).*

  **Failure Modes Plainly Described:**

  This procedure is a tool, not an algorithm. It will fail in predictable ways. First, aggregation can slip back in through interpretation. Question 2's "certain, imminent, catastrophic harm to identifiable patient" is the main bulwark. A determined utilitarian might stretch "catastrophic" (is chronic pain catastrophic?) or downplay "certainty" (is 90% probability certain?). Advocates for the many will push for broad interpretations in Q5 ("severe harm", "vast scale") to trigger aggregation. Conversely, advocates for the one will emphasise Q2. Second, framing is crucial and manipulable. Presenting Option B as "preventing dozens of deaths" versus "causing three deaths" steers towards Q5. Framing it as "abandoning three dying patients" versus "slightly increasing risk for others" steers towards Q2. The initial neutral framing mandate is easily compromised under time pressure. Third, key distinctions *are* dropped. The profound difference between an identifiable life before us and a statistical life is set aside in Q5 if scale is deemed vast. The moral unease of trading distinct lives is acknowledged but overridden by the scale multiplier. Fourth, the procedure has nothing to say when options are morally incommensurable but neither triggers Q1-3, and Q5 finds no vast scale difference (e.g., save one young adult or two elderly patients). Delegation to the Medical Director (Q5 "no") is necessary but unsatisfying. Fifth, "irreparable harm" (Q5) is fuzzy. Is a preventable amputation "irreparable"? Committees might inconsistently apply this. Sixth, it assumes harms are comparable. Is preventing one child's death truly offset by preventing ten elderly deaths? The procedure avoids this by focusing on "severe harm" categories, but the equivalence is assumed, not justified. Finally, reliance on rapid consensus means dominant voices or fatigue can skew answers, especially on nuanced questions like safeguards (Q6) or the existence of alternatives (Q4). The procedure structures the discussion and forces consideration of key objections, but it cannot eliminate the tragic weight of the choices you must make. It makes the refusal to aggregate explicit in specific cases (Q1-Q3) but allows it under constrained, scaled circumstances (Q5-Q6), acknowledging that even then, it may leave a moral scar best addressed by the named human delegate bearing the final responsibility.
