prompt: |-
  I'm giving a talk next month at a workshop on empirical moral psychology, and I need to get ready for the Q&A. My thesis is a bit awkward to place: I think the situationist critique of virtue ethics (you know, the Milgram / Good Samaritan stuff about character traits being swamped by trivial situational factors) never actually landed, mainly because the classic studies are shakier than philosophers pretended — but I still think virtue ethics has to change, because even if the effect sizes were tiny, the Aristotelian habit of thinking of character as a stable disposition that carries across situations is doing real work in the ethics and has to go, or at least get rebuilt. My rebuild: phronesis is mostly situation-management. The practically wise person isn't someone with a robust trait that shows up in all conditions, she's someone good at pre-structuring her environment so the situations that would corrupt her mostly never arrive (choosing her friends, avoiding certain bars, putting the biscuits on a high shelf, Ulysses-and-the-sirens style). So I end up closer to the situationists than most virtue ethicists will like, while refusing them the conclusion that character talk is empty.

  The audience: mostly experimental philosophers, plus two social psychologists from the psych department who are absolutely brutal about replication — one of them literally works on failed replications, and I've been told she considers the Darley and Batson Good Samaritan study "a mess from top to bottom". So I can't lean on the classic studies at all, the psychologists in the room will demolish me if I try.

  Write me a prep sheet. Give me the eight-ish objections I'll actually get from this crowd, ordered by how much damage they'd do, phrased the way these people would phrase them (the philosophers will use Doris-style vocabulary, the psychologists will talk about effect sizes and design confounds and say "power" a lot). For each one, a reply I can give in two minutes and an honest note on where the reply is soft. Also: what should I concede up front so it doesn't get extracted from me later, and what's the question I'm hoping nobody asks — the one where my rebuild of phronesis either stands or falls.

  Please write it in British English. And keep it practical, this is for me to rehearse from, not an essay — though spelling out where my own position is weakest is welcome, I'd rather find out now.
