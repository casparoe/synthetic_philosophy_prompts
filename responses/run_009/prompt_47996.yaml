  Second, they're spot-on about the irony: the standard "Whig history is bad" narrative itself feels Whiggish. Their deeper concern seems to be whether avoiding presentism is even possible. That's thorny. I'll need to distinguish between inevitable perspective (we can't escape our vantage point) and avoidable teleology (we can avoid framing the past as destined for us). The "significance" vs. "meaning" distinction might help here—acknowledging our interests shape what we study, but shouldn't dictate how we interpret causation.

  For the miniature historiography example, I'm imagining something like the Glorious Revolution. A Whig version would frame it as a necessary step toward modern democracy, while a non-Whig one would emphasize contemporary fears about Catholic succession and local power dynamics. This concrete contrast should make the structural issue visible without moral overtones.

