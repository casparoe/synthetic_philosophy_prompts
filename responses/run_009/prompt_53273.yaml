  ## Eulogy for Mara

  **(Clears throat, looks out at the gathering)**

  Nine years is a long time to say goodbye. Nine years watching a fierce, brilliant, lightning-fast mind – a mind that wrestled with consciousness, identity, and the very nature of thought itself – gradually become clouded. My wife, Mara, taught us all what it means to grapple with the deepest questions of mind, long before Alzheimer’s forced that grappling onto her personally. For twenty-six years in this department, she challenged students, dazzled colleagues, and yes, used her poor ethics-professor husband down the hall as a philosophical guinea pig. I still maintain that changing the subject to blame when she started in on qualia was a perfectly valid defense mechanism. *(Small, warm chuckle from the philosophy section)*.

  Mara wasn’t just brilliant; she was *convincing*. She championed an idea that seemed radical to some, obvious to others: that our minds aren't locked inside our skulls. That tools we use – notebooks, smartphones, even the environment around us – can become genuine parts of our thinking process. Otto and his notebook weren’t just a thought experiment for her; they were a manifesto. The parity principle wasn't just an exam question; it was a lens she applied to the world. She believed, passionately, that the boundaries of the self are porous.

  And then... the disease. The cruel irony wasn’t lost on us. The philosopher of mind, losing her own. But here’s what happened in those last five years, especially. The notebooks stopped working. The reminders on the phone became meaningless symbols. So, we adapted. We built routines. We developed rhythms. I became the calendar, the address book, the keeper of stories. "Who's calling, love?" "What are we doing after breakfast?" "How does that story about the conference in Prague go?" I’d supply the names, the dates, the next steps. We’d finish sentences together – a collaborative act of meaning-making, long after she could start them alone. It wasn't me thinking *for* her; it was *us* navigating the world, together, using whatever tools worked.

  *(Pauses, voice thickens slightly)*

  Now, Mara would have *loved* the philosophical puzzle this presents. Did her mind, by her own definition, extend into me? Was I, quite literally, her cognitive crutch, her external memory? She’d have relished the debate, the nuance, the implications. She’d have papers drafted in her head before lunch. But standing here, the raw grief of her absence is too vast for abstract syllogisms. The philosophical question feels… intimate. And heavy.

  So, what *can* I say? What feels true?

  I can say that Mara was never *just* the sum of her fading neurons. The essence of her – her fierce curiosity, her wry humor, her deep capacity for love, her stubborn insistence on engaging with the world – that persisted. It shone through the fog, sometimes in a sudden sharp remark, a familiar squeeze of the hand, a flicker of recognition at a shared joke. The routines we built weren't just coping mechanisms; they were lifelines she actively grabbed onto. They were *her* way of staying connected, of being *Mara*, for as long as she possibly could. She participated in that connection until the very end.

  And now she’s gone. And I stand here holding… everything. The memories she couldn't hold onto anymore. The stories. The inside jokes. The feeling of her hand in mine during those quiet afternoons. The echo of her voice asking, "What comes next?"

  *(Looks around, making eye contact with different groups)*

  To our colleagues: You knew her brilliance. You wrestled with her ideas. Her work on the extended mind, her passion for understanding consciousness – that legacy lives on in your scholarship, in your classrooms. Keep arguing about Otto. She’d demand it.

  To her family: You saw the struggle. You felt the pain of losing the sister, the daughter, the aunt you knew so vibrantly. You saw things change. What I hope you can also see is that the love, the connection, the *core* of who she was – that fierce, funny, loving Mara – never vanished. It was there, fighting its way through, held aloft by the connections she built with all of us.

  I am now the keeper of Mara’s stories. I am the holder of our shared memories. And in a way she would have appreciated, even if she’d argue fiercely about the technicalities, carrying these memories *feels* like carrying a part of her forward. Not her mind, perhaps, as Clark and Chalmers strictly defined it... but her *presence*. Her impact. Her love.

  Her thesis taught us that we reach beyond our biological limits. Mara’s life, especially these last hard years, taught me something deeper: that love is the ultimate extended system. It connects us, sustains us, and outlasts even the cruelest fading. It lives in the routines we build, the stories we tell, the memories we hold for each other.

  So, we remember her. We tell her stories. We argue her ideas. We feel her absence, keenly. And in doing all that, we keep her with us. Not in a notebook. Not in a skull. But right here. *(Places hand over heart)*

  Thank you, Mara, for everything. Especially the arguments. Even the ones about blame.

  ---

  **Choice & Defense:**  
  **I chose to keep the extended mind thesis as a structural undertone.** Explicitly debating whether *he* functioned as *her* extended mind risks alienating the grieving family (sounding like a denial of their experience of loss) and could push the eulogy into overly academic territory during raw grief. Instead, describing the *function* of their routines ("we built routines," "I became the calendar," "collaborative act of meaning-making") implicitly embodies the thesis' core idea *without* the jargon, allowing both groups to connect emotionally to the reality of their shared experience. The later, more poetic claims about carrying her "presence" build naturally from this foundation without requiring philosophical assent.

  **Contested Reading & Justification:**  
  The most significant stretch occurs in the paragraph starting "I am now the keeper..." and the claim that carrying memories feels like carrying "a part of her forward... her *presence*," implying a form of survival in his memory that exceeds standard EM theory. Clark and Chalmers focus on real-time cognitive function, not post-mortem persistence or the transfer of identity/presence. **Why stand behind it?**  
  1.  **Emotional & Relational Truth:** While not strict EM, it captures the profound, lived experience of being the repository of a loved one's shared history and personality *as experienced by the partner*. It reflects how memory *feels* in deep grief and love.  
  2.  **Rooted in Mara's Spirit:** It takes her foundational idea (mind extending *outward*) and pushes it towards its deepest human implication – that our connections fundamentally shape and hold who we are, even beyond biological function. Mara, the bold philosopher, likely would have enjoyed this interpretive leap, even argued its merits.  
  3.  **Necessary Consolation:** For an atheist, finding comfort in legacy and memory is essential. This "stretch" provides a non-religious framework for enduring connection grounded in Mara's own life's work, making it a uniquely appropriate, albeit contestable, solace. It transforms a theory about cognition into a metaphor for love's endurance.
