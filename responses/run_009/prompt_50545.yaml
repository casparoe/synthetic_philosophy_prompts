  Okay, the user chairs a political philosophy discussion group with two members, C (cosmopolitan) and N (institutional nationalist), who've been arguing past each other on global justice. They want a joint statement with four parts: agreed claims, disagreements table, cruxes, and concrete cases. 

  Hmm, this requires careful neutrality. Both scholars are clearly sophisticated—C grounds partiality in instrumental effectiveness while N treats it as inherent to state coercion. The key is to avoid strawmanning either position in the agreements section. 

  For the agreed claims, I'll highlight their rejections of extremes: neither endorses radical global equality nor absolute state sovereignty. The threshold permission for domestic priority is crucial—both accept it exists but disagree on why. Must phrase that as "may permissibly give some priority" rather than "should" to satisfy C's instrumentalism and N's fairness view. 

  The disagreements table needs surgical wording. For the partiality row, C would bristle at "obligation of justice" for compatriots while N rejects "mere effectiveness." Prepared drafts: "partiality derives solely from..." vs "constitutes an independent..." captures that tension well. 

  Ah, the cruxes. The coercion-justice link is central—does justice require reciprocity? N says yes, C says no. The family analogy is trickier: C sees it as proof that affection enables effectiveness, N as evidence that special relations create distinct duties. Should add the "sufficiency threshold" crux too—they fight over where obligation turns to charity. 

  For cases... Vaccine margin will split them sharply. C will predict threshold at 0% (all doses shareable), N at some higher % based on reciprocity. Nurse recruitment convergence is fascinating—both condemn it but for different reasons (C: exploitation; N: unfair free-riding). That deserves highlighting as partial agreement despite divergent foundations. 

  Noticed a verbal rift in "justice" usage early on—C ties it to basic needs, N to reciprocal institutions. Handled it in disagreements by specifying "justice among compatriots" vs "universal duties." Explicitly flagged in footnotes to prevent talking past. 

  User clearly knows the literature—namedropping sufficientarianism and associative obligations. The structured format suggests they want this for publication or teaching. Hope the "what convergence shows" notes satisfy their pedagogical intent. 

  Final sanity check: Would C/N sign? C won't love "associative obligations" phrasing but the table forces N to concede they're institution-dependent. N might grumble at "effectiveness" but the "constitutes" wording protects their deontological view. Compromises feel balanced.
answer: |-
  ## Joint Statement on Global Justice: Cosmopolitan and Institutional Nationalist Perspectives  
  *Collaboratively Drafted by C (Cosmopolitan) & N (Institutional Nationalist), Chaired by [Your Name]*  

  ---

  ### I. Agreed Substantive Claims  
  1. **Moral Equality**: All persons possess equal fundamental moral worth irrespective of citizenship or birthplace.  
  2. **State Instrumentality**: States are human-created institutions, not intrinsically valuable entities. Their legitimacy derives from serving human interests.  
  3. **Rejection of Radical Equality**: Neither position requires *full global equality of resources* as a demand of justice.  
  4. **Permissible Partiality**: States may permissibly prioritize their own citizens’ basic needs above equally urgent needs of non-citizens *at some margin*, provided a sufficientarian threshold is met globally.  
  5. **Boundary Significance**: Political boundaries *as mere lines* hold no intrinsic moral weight. Their significance arises only from the institutions they contain.  
  6. **Institutional Necessity**: Effective institutions are indispensable for fulfilling duties of justice. Statelessness is a profound injustice.  

  ---

  ### II. Disagreements Table  
  | **Issue**                          | **Cosmopolitan Position (C)**                                                                 | **Institutional Nationalist Position (N)**                                                                 |  
  |------------------------------------|------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------|  
  | **1. Grounds of Partiality**       | Priority for compatriots is justified *only* by instrumental effectiveness in fulfilling universal duties of justice. | Priority for compatriots is a *standalone obligation of justice* arising from shared participation in coercive state institutions. |  
  | **2. Scope of Justice**            | Duties of justice apply universally; their content is determined by fundamental human interests. | Duties of justice are fundamentally *relational*; they arise only among persons subject to shared coercive institutions. |  
  | **3. Sufficiency Threshold**       | States may retain resources *only* until all persons globally achieve a sufficient minimum; surplus is owed as justice. | States may retain resources needed to maintain the *integrity of their cooperative scheme*; surplus may be charity. |  
  | **4. Analogy to Family**           | Familial partiality is defensible *because* intimate ties enable uniquely effective care—it does not support non-instrumental state partiality. | Familial partiality demonstrates that special obligations arise *directly* from constitutive relationships—parallel to civic bonds. |  

  ---

  ### III. Cruxes Requiring Resolution  
  1. **Coercion & Justice**: Must duties of justice involve reciprocity under shared coercive institutions?  
     - *If yes* → Strengthens N.  
     - *If no* → Strengthens C.  
  2. **Nature of Sufficiency Threshold**: Is the threshold for retaining domestic resources defined by (a) absolute human needs, or (b) institutional sustainability?  
     - *(a) → Favors C; (b) → Favors N.*  
  3. **Relationality of Fairness**: Does fairness presuppose a cooperative scheme?  
     - *Yes → Fairness only binds co-participants (N).*  
     - *No → Fairness applies to all moral agents (C).*  
  4. **Family/State Analogy**: Does familial partiality derive from (a) effectiveness of care, or (b) intrinsic role obligations?  
     - *(a) → Supports C; (b) → Supports N.*  

  ---

  ### IV. Case Analyses & Predictions  
  #### Case 1: **Vaccine Margin**  
  - *Scenario*: Country A (low COVID risk) has vaccines for 60% of its population. Country B (high mortality, no vaccines) requests surplus doses.  
  - **Crux**: Threshold for domestic retention (Crux 2).  
  - **C’s Prediction**: Threshold = 0%. *All* doses beyond immediate lifesaving needs for healthcare workers are owed to B as justice.  
  - **N’s Prediction**: Threshold = ~30–40%. Doses needed to maintain public trust, economic function, and scheme stability may be retained; surplus is charity.  

  #### Case 2: **Nurse Recruitment**  
  - *Scenario*: Rich State A aggressively recruits nurses trained via public subsidies in poor State B, worsening B’s healthcare crisis.  
  - **Convergence**: Both condemn this practice as unjust.  
  - **C’s Ground**: Violates universal duty to not exploit institutional vulnerabilities.  
  - **N’s Ground**: Violates fair terms of cooperation between states by free-riding on B’s investment.  
  - **What Convergence Shows**: Shared opposition to predatory interstate conduct.  
  - **What It Doesn’t Show**: Agreement on whether the wrong is *relational* (N) or *universal* (C).  

  #### Case 3: **Welfare-or-Aid**  
  - *Scenario*: A legislature must choose between increasing a modest domestic housing subsidy (lifting citizens from *moderate* hardship) or funding malaria nets abroad (saving many lives from *severe* deprivation).  
  - **Crux**: Relationality of fairness (Crux 3) & aggregation (Crux 2).  
  - **C’s Position**: Straightforward aggregation. Justice requires aiding the worst-off globally; domestic option is impermissible unless all severe deprivation is addressed.  
  - **N’s Position**: Domestic subsidy fulfills obligations of fairness to co-participants; foreign aid is supererogatory. The claims are of different kinds and not directly comparable.  

  ---

  ### V. Notes on Verbal Disagreement  
  A portion of the dispute concerns the **scope of the term "justice"**:  
  - **C** uses "justice" for duties arising from *fundamental interests* (e.g., need, autonomy).  
  - **N** uses "justice" for duties arising from *relational contexts* (e.g., reciprocity, coercion).  
  **Handling in Statement**: The disagreements table explicitly distinguishes "duties of justice" (N) from "universal duties of justice" (C), and §II.2 clarifies the divergent foundations. This isolates substantive from semantic disagreement.  

  ---  
  *Authored in collaboration,  
  C & N*  
  *Drafted neutrally,  
  [Your Name], Chair*
