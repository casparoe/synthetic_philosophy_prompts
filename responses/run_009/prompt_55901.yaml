answer: |-
  Below is a systematic breakdown of desiderata for a theory of persistence, motivated by the core problems in the literature. I'll specify non-negotiable requirements (grounded in fundamental metaphysical or epistemic constraints) and negotiable ones (often tied to intuitions that might be revised). Conflicts are flagged explicitly. I reject the demand for neutrality between 3D and 4D ontologies as incoherent—a theory of persistence **must** commit to an account of temporal ontology, or it cannot explain *how* objects persist. Finally, I score major theories and conclude that perdurantism ("worm theory") best satisfies the non-negotiable desiderata, though at a significant cost to phenomenology. The real tension is between metaphysical rigor and intuitive "folk" commitments.

  ---

  ### **Desiderata for a Theory of Persistence**  
  *(Non-negotiable = **NN**; Negotiable = **N**)*  

  1. **Explain Change Without Contradiction (NN)**  
     - **Motivation**: Temporary intrinsics problem (e.g., a banana is green at t1 and yellow at t2). If the same object has incompatible properties, it violates non-contradiction.  
     - **Non-negotiable**: Any theory permitting true contradictions is metaphysically untenable. Change is non-negotiable data; denying it eliminates the problem persistence theories aim to solve.  
     - **Conflict**: Directly opposes the endurantist "wholly present" intuition (see Desideratum 2).  

  2. **Preserve "Wholly Present" Intuitions (N)**  
     - **Motivation**: Ordinary claims like "I was wholly present at my tenth birthday" reflect how we experience persistence—as a single entity enduring through time. Cases: persons in irreversible coma (we intuit the *same person* exists, albeit impaired).  
     - **Negotiable**: This is phenomenological, not metaphysical. It might be an illusion (e.g., perdurantists argue we *feel* wholly present but are temporally extended). Rejecting it doesn’t collapse the theory.  

  3. **Resolve Fission/Fusion Cases (NN)**  
     - **Motivation**: Brain fission (e.g., hemispheres transplanted into two bodies). A theory must specify whether both, one, or neither resulting person is identical to the original—without arbitrariness.  
     - **Non-negotiable**: Fission tests transitivity and determinacy of identity. Ignoring it implies persistence is incoherent under branching.  
     - **Conflict**: Clashes with desideratum 2 (if both products are "wholly present," identity splits).  

  4. **Handle Gradual Replacement (NN)**  
     - **Motivation**: Ship of Theseus (planks replaced one-by-one). A theory must account for:  
       - (a) The original ship’s persistence (if any).  
       - (b) Whether the reassembled original planks constitute the "same ship."  
     - **Non-negotiable**: Artifacts and organisms *do* persist through part-replacement. Denial (e.g., "no persistence through any change") is empirically false.  

  5. **Accommodate Disassembly/Reassembly (N)**  
     - **Motivation**: Bicycle disassembled and rebuilt. Commonsense says it survives.  
     - **Negotiable**: This may be artifact-specific (not required for entities like persons). It tests flexibility but could be revised (e.g., "reassembly creates a duplicate").  

  6. **Avoid Massive Coincidence (NN)**  
     - **Motivation**: Statue and clay case. If the statue is squashed, the clay persists. Are they two objects in the same place? Coincident entities violate parsimony and imply overdetermination (e.g., two things occupying the same space with different persistence conditions).  
     - **Non-negotiable**: Proliferating entities without explanatory gain is ad hoc. A theory should minimize coincidents.  

  7. **Provide Epistemic Accessibility (NN)**  
     - **Motivation**: We claim to *know* objects persist (e.g., "My car exists today and yesterday"). If persistence is unknowable (e.g., due to radical indeterminacy), the theory undermines ordinary justification.  
     - **Non-negotiable**: Persistence is a precondition for empirical knowledge (e.g., tracing causes).  

  8. **Uniformity Across Entities (N)**  
     - **Motivation**: Theories should apply similarly to persons, artifacts, and events (e.g., a war "persists" through battles). Avoids ad hoc solutions.  
     - **Negotiable**: Entities may have different identity conditions (e.g., persons vs. rivers). Uniformity is ideal but not essential.  

  9. **Autonomy (Avoid Question-Begging) (N)**  
     - **Motivation**: E.g., defining persistence via identity over time, then using persistence to ground identity. This circularity plagues endurantism (which often presupposes "sameness" without analysis).  
     - **Negotiable**: Some bootstrapping may be inevitable. Theories can start with primitive persistence, provided it’s not covertly theory-laden.  

  10. **Respect Indeterminacy Where Intuitive (N)**  
      - **Motivation**: "How much change is too much?" (e.g., a tree losing leaves). Sometimes survival is vague, and a theory shouldn’t force artificial precision.  
      - **Negotiable**: Vagueness might be epistemic (we don’t *know* the boundaries) rather than metaphysical.  

  ---

  ### **Key Conflicts Between Desiderata**  
  - **Fission vs. "Wholly Present" (2 vs. 3)**: Accommodating fission (e.g., saying both products are identical to the original) contradicts "wholly present" (you can’t be wholly present in two places). *Resolution*: Abandon desideratum 2 as a negotiable intuition.  
  - **Avoiding Coincidence vs. Gradual Replacement (4 vs. 6)**: For the Ship of Theseus, denying coincidence might force you to say the original ship and the reassembled ship are identical—but they can’t be if they diverge. *Resolution*: Perdurantism allows temporal overlap without coincidence.  
  - **Epistemic Accessibility vs. Indeterminacy (7 vs. 10)**: If persistence is sometimes vague (e.g., "is this pile of sand the same after one grain removed?"), how can we know it? *Resolution*: Treat vagueness as epistemic (we lack precise criteria) to preserve knowability.  

  ---

  ### **Why Neutrality on 3D vs. 4D is Impossible**  
  A theory of persistence must explain *what persists*:  
  - If objects are 3D (enduring), they are wholly present at each time.  
  - If objects are 4D (perduring), they have temporal parts.  
  - If objects are stages (existent only at instants), persistence is a relation between distinct entities.  
  **Claiming neutrality** is like demanding a theory of matter be neutral about atoms—it conflates description with commitment. Persistence theories *are* ontological frameworks.  

  ---

  ### **Scorecard: How Theories Fare**  
  *(✔ = Satisfies; ✘ = Fails; ~ = Partially/Controversially Satisfies)*  

  | Desideratum               | Endurantism (3D)                 | Perdurantism (Worm/4D)          | Stage Theory                    |
  |---------------------------|----------------------------------|----------------------------------|----------------------------------|
  | 1. Change w/o Contradiction | ✘ (Violates non-contradiction)   | ✔ (Properties at times)          | ✔ (Properties at stages)         |
  | 2. "Wholly Present"       | ✔ (Core tenet)                   | ✘ (Objects are temporally extended) | ✘ (Only stages are "present")    |
  | 3. Fission Cases          | ✘ (Splits identity or denies it) | ✔ (Branches share initial parts) | ~ (Identity is counterpart-based) |
  | 4. Gradual Replacement    | ✘ (Leads to coincidence)         | ✔ (Temporal overlap)             | ~ (Survival depends on context)  |
  | 5. Disassembly            | ~ (Only if no part-replacement)  | ✔ (Persistence via continuity)   | ~ (Contextual)                   |
  | 6. Avoid Coincidence      | ✘ (Statue/clay are distinct)     | ✔ (No coincidence; parts overlap) | ✔ (No coincidence)               |
  | 7. Epistemic Accessibility| ~ (If identity is brute)         | ~ (Access to current stage)      | ✘ (Persistence is extrinsic)     |
  | 8. Uniformity             | ~ (Struggles with events)        | ✔ (Applies to all 4D entities)   | ✔ (Stages for all)               |
  | 9. Autonomy               | ✘ (Often presupposes identity)   | ~ (Primitive parthood)           | ✔ (No identity over time)        |
  | 10. Indeterminacy         | ~ (Vagueness in identity)        | ~ (Vague boundaries)             | ✔ (Vagueness built-in)           |

  **Analysis**:  
  - **Endurantism** fails non-negotiables (1, 3, 4, 6) due to contradiction in change, fission incoherence, and coincidence. Its adherence to desideratum 2 is a negotiable intuition, not a defense.  
  - **Perdurantism** satisfies all NN desiderata (1,3,4,6,7 minimally) but sacrifices desideratum 2 ("wholly present"). This sacrifice is justified: the intuition is phenomenological, not metaphysical. Its weakness is epistemic accessibility (how do we access non-present parts?).  
  - **Stage Theory** fails NN epistemic accessibility (persistence depends on extrinsic counterpart relations, making it unknowable) and struggles with fission (contextual identity feels ad hoc). It excels at autonomy and indeterminacy but at high cost.  

  ---

  ### **Conclusion: Trade-offs and a Verdict**  
  No theory satisfies all desiderata perfectly, but **perdurantism** (worm theory) best meets the non-negotiables: it resolves change, fission, and coincidence without contradiction, while offering uniformity. It fails the negotiable "wholly present" intuition, but this is a shibboleth—our experience of being "wholly present" is compatible with a 4D world (we access one temporal part at a time).  

  The deeper conflict is between **metaphysical rigor** (perdurantism’s strength) and **phenomenological fidelity** (endurantism’s appeal). Persistence theories cannot bridge this gap without compromising core logic. I reject the autonomy desideratum as a false constraint—theories must ground persistence in identity conditions, but this isn’t circular if identity is analyzed (e.g., perdurantism uses temporal parts).  

  **Final stance**: Perdurantism wins, but the "real issue" is whether we prioritize formal coherence (NN desiderata) or folk intuitions (N desiderata). If you insist on desideratum 2 as non-negotiable, endurantism fails; if you demand epistemic accessibility for persistence relations, stage theory fails. Perdurantism’s flaws are the least disabling. The literature argues past itself because endurantists elevate negotiable intuitions to axioms, while perdurantists dismiss phenomenology too quickly. A better approach: treat perdurantism as metaphysically correct but explain why endurantism *feels* true (e.g., through cognitive limitations).
