answer: |-
  ## Rational Choice Under Ambiguity: Core Desiderata

  Here are the key desiderata for an adequate theory of rational choice under ambiguity, motivated by core cases and conceptual demands:

  1.  **Explain Ellsberg Choices:** The theory must explain or accommodate the typical ambiguity-averse pattern observed in the two-color and three-color urn experiments (e.g., preferring betting on the known 50/50 urn over the unknown composition urn, and preferring to bet on red over yellow *and* on black-or-yellow over red-or-yellow in the three-color urn). *Motivation:* Empirical regularity demands explanation; failing this makes the theory descriptively inadequate or requires dismissing common intuition as irrational.
  2.  **Distinguish Ambiguity from Risk:** The theory must fundamentally treat ambiguity (unknown probabilities) differently from mere risk (known probabilities). It cannot simply reduce the Ellsberg paradox choices to standard subjective expected utility (SEU) with a single prior. *Motivation:* SEU fails to predict Ellsberg choices; collapsing ambiguity into risk ignores the distinct cognitive and behavioral response to unknown probabilities.
  3.  **Dynamic Consistency (DC):** Plans made ex-ante should remain optimal when re-evaluated ex-post, after non-informative events or events that don't change the relevant ambiguity. *Motivation:* Illustrated by the three-color urn embedded in a dynamic choice sequence (e.g., plan to bet on black if yellow is drawn, but then find black preferable after yellow *is* drawn). Violations seem like costly pre-commitment or irrational reversals.
  4.  **Preserve Dominance:** The theory must respect state-wise dominance: if act A yields an outcome at least as good as act B in every possible state of the world, and strictly better in some, then A should be preferred to B. *Motivation:* Fundamental principle of rationality under certainty and risk; violating it leads to clearly exploitable decisions ("Dutch books").
  5.  **Completeness:** The theory should provide a complete ranking of all acts, so the agent always knows their preference between any two options. *Motivation:* Rational choice often requires making a decision; incompleteness leaves the agent paralyzed when faced with incomparable ambiguous options. (Note: This is highly contested).

  **Negotiable or Not**
  Dominance is non-negotiable; violating it constitutes demonstrable irrationality. Distinguishing ambiguity from risk (Desideratum 2) is also core; a theory failing here doesn't address ambiguity. Explaining Ellsberg choices (Desideratum 1) is nearly essential for descriptive/prescriptive adequacy. Dynamic Consistency (Desideratum 3) is widely seen as a core requirement of rationality in sequential choice, though some argue violations can be sophisticated. Completeness (Desideratum 5) is the most negotiable; many argue rationality *permits* (or even requires) incompleteness under profound ambiguity, viewing it as a "prejudice" of the SEU tradition to demand full comparability always.

  **Joint Satisfiability**
  Suspicion of joint unsatisfiability centers on the trio: **Distinguishing Ambiguity (2), Dynamic Consistency (3), and Completeness (5)**. Achieving (2) often requires sensitivity to the *set* of possible probabilities (e.g., min, max, averaging). Maintaining (3) under updating with ambiguous information typically requires specific, often restrictive, rules for updating the representation of ambiguity (like prior-by-prior Bayesian updating for sets). This updating can interact with the decision rule (e.g., maxmin) in ways that violate DC unless the decision rule itself satisfies special properties (like constant absolute ambiguity aversion). Furthermore, maintaining completeness (5) under ambiguity while satisfying (2) often forces the theory to impose strong assumptions (like a unique second-order prior in smooth models or specific aggregation rules) that critics argue mask the true nature of ambiguity. Many theories sacrifice one: SEU sacrifices (2); early Maxmin EU sacrifices (3); models using incomplete preferences sacrifice (5).

  **The Benign-Source Urn**
  The professor's twist questions whether ambiguity aversion is rational only against adversarial uncertainty. If the unknown urn composition is fixed by an indifferent process (e.g., random device, nature), not an adversary, should rational attitudes differ from the classic Ellsberg case? Proponents of ambiguity aversion (AA) argue yes: AA stems from the agent's *lack of knowledge*, not perceived hostility. The uncertainty about the true probability remains, making known risks preferable. Critics argue rationality demands indifference: without evidence of manipulation, the agent should treat the unknown probability symmetrically, perhaps forming a uniform prior over possible compositions (implying SEU). Empirical evidence suggests people *persist* in AA even with benign sources, creating tension. A minimal rationality requirement might be *consistency*: if an agent is AA in the adversarial case, they *must* be AA in the benign case (and vice-versa) if they possess the same information about the set of possible compositions. Whether AA *itself* is rational in the benign case remains deeply contested.

  **Scorecard**

  *   **Maxmin Expected Utility (MEU):** Explains Ellsberg choices well and distinguishes ambiguity from risk using a set of priors. Fails dynamic consistency in sequential choices without restrictive assumptions (e.g., rectangularity). Preserves dominance. Often incomplete only if the maxmin value is equal.
  *   **Smooth Ambiguity Models:** Explain Ellsberg choices via aversion to mean-preserving spreads in second-order probabilities. Distinguishes ambiguity from risk. Can achieve dynamic consistency with appropriate updating of the second-order prior. Preserves dominance. Enforces completeness via the second-order utility function.
  *   **Credal Sets (without specific decision rule):** Distinguishes ambiguity from risk by representing belief as a set of probabilities. Accommodates Ellsberg choices if combined with a decision rule like MEU. Prior-by-prior updating supports dynamic consistency. Preserves dominance. Typically results in incomplete preferences unless supplemented with an aggregation rule.
