  I keep getting into it with my brother-in-law about history teaching in schools, and I've realized my gut verdicts on specific cases don't obviously add up to any one principle, so I want to lay them out and see what actually captures them, or what has to go. A Japanese middle-school textbook that, after ministry pressure, shrinks the comfort women down to a single hedged footnote: not okay, that's evasion. Texas textbooks that soft-pedal slavery's role in the Civil War and describe enslaved people in a way that makes them sound like ordinary immigrant laborers: not okay. A state adding the Tulsa massacre to the curriculum after decades of silence: obviously fine. German textbooks devoting whole units to the Holocaust: fine, that's the model. A curriculum that foregrounds the 1619-style framing — that the Revolution was fought mainly to protect slavery — as the organizing story for eighth-grade US history: I keep saying fine, it's a legitimate interpretation being given center stage. And a Chinese history textbook that spends chapters on Japanese atrocities in the war but barely mentions the famine after the Great Leap Forward: not fine, that's propaganda. Plus a UK proposal to weigh the empire's good and bad in a "balanced" way that somehow always lands harder on abolition than on the Bengal famines: also not fine. Here's my problem, though. If the principle is just "don't contradict what academic historians have established," then my 'fine' on the 1619 framing is shaky, since plenty of serious historians push back on the strong version of that claim, so maybe that verdict has to go. If the principle is "adding victims' perspectives is fine, deleting them isn't," that saves the 1619 verdict but can't handle the Chinese textbook, which is all addition and no deletion of Japanese crimes, and I still think it's propaganda — maybe the real difference is whose government is doing the pruning, or whether the omissions are about your own nation's crimes versus someone else's? Give me the candidate principles, stated precisely, tell me which clauses are motivated by which cases, be honest about which of my verdicts you had to overturn and why, and then tell me what each candidate principle predicts on a case I haven't settled: Korean schools teaching that Dokdo is indisputably Korean territory, with no real airing of the Japanese claim — I honestly go back and forth on whether that's history teaching or just civics. Write most of it as prose so I can follow the reasoning, but end with a JSON object with these fields: principle (your best candidate, one sentence), clauses (a list where each item has "clause", "motivating_case", and "verdicts_saved"), overturned_verdicts (each of my verdicts you couldn't accommodate, with the reason), and new_case_predictions (a list of "case" and "predicted_verdict" pairs, at least covering the Dokdo one and one case you make up yourself).
