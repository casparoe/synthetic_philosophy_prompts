  4. Knight of faith (gives up the finite but expects it back by virtue of the absurd)
  5. Divine-command theorist (follows divine command, which overrules ethical)
  6. Aesthete (no binding ethical order at all)
  7. Suspicious reading (pathology, not faith)

  We will design 8-10 questions that are concrete scenarios from modern domestic life. Each question will have multiple-choice answers that reflect different stances without using labels.

  We must also note the limits: which combinations are not covered, which positions are hard to separate (like knight of faith and deluded fanatic).

