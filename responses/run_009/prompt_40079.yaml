  Below is a sorting instrument designed as an 8-question quiz, grounded in concrete domestic scenarios, to map positions on whether and how the ethical (understood as universal, shareable obligations) can be suspended by a private relation to duty, God, or inwardness. The questions probe five dimensions without using technical labels:  
  1. **Intrinsic authority of the ethical**: Does the ethical order bind us inherently?  
  2. **Possibility of suspension**: Can anything overrule ethical obligations?  
  3. **Source of overruling**: Must the overruling force be publicly verifiable?  
  4. **Expectation of return**: Does the agent expect the sacrificed "finite" (e.g., relationships, security) to be restored?  
  5. **Communicability**: Can the justification for suspension be shared and understood by others?  

  Each question offers five mutually exclusive answers (A–E). The quiz avoids direct sacrificial stakes and never asks about belief in divine commands. After taking the quiz, respondents (or you, for your characters) can be sorted into one of seven named positions or an eighth "unclassified" category. The scoring key explains the mapping, flags indistinguishable positions and unstable combinations, and notes limitations.  

  ---

  ### **The Quiz: Which Path Would You Choose?**  
  Answer based on your instinctive reaction. Choose one answer per question.  

  1. **The Vocation**  
     After years in a stable but unfulfilling job, a parent feels an overwhelming inner call to quit and pursue a low-paying art career. This would drain the family’s savings and risk their home. They describe this call as a "non-negotiable duty to their true self."  
     - A. They must not do it. Responsibilities to their family’s security come first, and personal fulfillment can’t override that.  
     - B. They should only pursue art if they secure a financial backup plan first. Family stability is too important to gamble.  
     - C. They must follow the call, even into poverty. Inner convictions like this transcend social expectations.  
     - D. They should go for it—life’s too short to ignore passion. Practical worries are just fear talking.  
     - E. This "call" is likely escapism from midlife anxiety and should be questioned, not obeyed.  

  2. **The Broken Promise**  
     A person made a solemn vow to their sibling to care for their niece if anything happened to them. After the sibling’s death, the person feels a divine command to move overseas for a humanitarian mission, leaving the niece with a competent but distant relative. They cannot explain this command rationally.  
     - A. They must keep their promise. A private feeling, however intense, can’t justify abandoning a concrete vow.  
     - B. They should only go if they find a loving guardian for the niece. The duty to care must be met, even if delegated.  
     - C. They must go. A divine command overrides human promises, even if it looks irresponsible to others.  
     - D. They should follow their desire to help abroad. Promises are just words; real impact matters more.  
     - E. This "divine command" might be trauma or guilt and needs therapy, not action.  

  3. **The Secret**  
     A spouse hides a significant financial risk—like co-signing a friend’s failing business—from their partner. They feel "ordered by conscience" to help the friend, believing the secrecy protects their partner from distress. They insist this is a moral necessity, but it could bankrupt the family.  
     - A. They must confess. Marriage requires transparency; no private conviction excuses deception.  
     - B. They should tell their partner once the risk is resolved. The ethical duty to honesty remains, but timing matters.  
     - C. Keeping the secret is right if it stems from a higher duty. Some truths are too heavy to share.  
     - D. Secrets are fine if intentions are good. Rules bend to individual circumstances.  
     - E. This "conscience" is likely self-deception to avoid embarrassment or conflict.  

  4. **The Donation**  
     A family donates their entire emergency fund to a controversial cause after one member dreams it’s "God’s will." This leaves them vulnerable to medical or job-loss crises. They believe they’ll be provided for but have no rational basis for it.  
     - A. This is reckless. Protecting your family’s safety is a core duty that can’t be ignored for a dream.  
     - B. They should donate only a portion they can afford. Charity must balance with responsibility.  
     - C. They must give the money. Divine directives demand obedience, even if provision seems unlikely.  
     - D. They should trust their impulse. Money comes and goes; acting on conviction is what counts.  
     - E. The dream could be stress-induced and rationalizing it is dangerous.  

  5. **The Renunciation**  
     A parent abandons a high-pressure career to take a menial job, feeling "called" to simplicity. This halts their child’s college fund, dimming their future prospects. They don’t expect the sacrifice to be repaid—ever.  
     - A. They must reconsider. Obligations to a child’s future outweigh personal epiphanies.  
     - B. They should find a middle path—e.g., part-time work—to avoid total loss of the college fund.  
     - C. They must obey the call, however costly. True duty sometimes requires irreversible loss.  
     - D. They should embrace the change. Conventions like college are overrated; authenticity matters.  
     - E. This "calling" might be burnout or depression and warrants medical advice.  

  6. **The Return**  
     A family sells their home to fund a community project after a mystical experience assures them "all will be restored." They move into a cramped rental, trusting their home will somehow return to them.  
     - A. This is irresponsible. You can’t gamble essential resources on a feeling, however profound.  
     - B. They should fund the project incrementally while keeping their home. Big sacrifices need safeguards.  
     - C. They must act if they believe it’s demanded, but expecting the home back is naive—loss is final.  
     - D. They should take the leap. If it feels right, the universe will provide.  
     - E. Mystical certainty about outcomes is delusional; this is magical thinking.  

  7. **The Higher Duty**  
     A doctor leaves their family for a year to serve in an epidemic zone, ensuring their children are cared for by a trusted relative. They see this as a non-negotiable duty to the greater good, though it causes their family pain.  
     - A. They should stay. Primary duties to immediate family can’t be outsourced, even for noble causes.  
     - B. This is acceptable only because the children’s care is guaranteed. Serving others mustn’t neglect core responsibilities.  
     - C. They must go. Some calls to serve override personal commitments, and explaining it isn’t necessary.  
     - D. They should follow their passion. If the work excites them, that’s justification enough.  
     - E. This "duty" might be a coping mechanism for avoiding family intimacy.  

  8. **The Unshareable Conviction**  
     A person breaks a business contract with a friend, citing an "inner voice" forbidding the deal. This looks like betrayal and could ruin the friendship. They insist the reason can’t be articulated or verified.  
     - A. They must uphold the contract. Shared agreements bind us; private intuitions don’t override them.  
     - B. They should negotiate a compromise. Ethics requires repairing relationships, not unilateral moves.  
     - C. They must obey the voice. Some truths are too personal to justify to others.  
     - D. They should act on their gut. Rules are made to be broken when they chafe.  
     - E. An "inner voice" overriding social bonds may signal psychological instability.  

  ---

  ### **Scoring Key and Position Mapping**  
  Tally your answers and match them to the positions below. Each position corresponds to a specific combination of stances on the five dimensions (see "Logical Space" diagram). Positions are mutually exclusive; the quiz assigns you to the one with the most matching answers. If multiple positions tie, see "Ambiguities and Limits."  

  | Position                  | Defining Answers (from Questions) | Core Stance on Suspending the Ethical |  
  |---------------------------|-----------------------------------|---------------------------------------|  
  | **Universalist**          | Mostly A or B                     | Denies suspension. The ethical has intrinsic authority; private convictions (divine or otherwise) cannot override shareable duties. Sacrifice only for a higher *public* good (e.g., saving lives) and only if core obligations are still met (e.g., Question 7B). |  
  | **Tragic Hero**           | Strong match: 7B, 2B              | Allows suspension *only* for a higher universal (e.g., the greater good), which must be publicly verifiable. Sacrifice is real and not expected back, but vindicated *within* the ethical order (e.g., ensuring the child is cared for in Question 7). |  
  | **Knight of Infinite Resignation** | Strong match: 5C, 6C          | Allows suspension via private call (e.g., divine/inner). Gives up the finite forever without expecting return. Incommunicable ("cannot explain," Question 2C). |  
  | **Knight of Faith**       | Strong match: 6D, 4C              | Allows suspension via private call. Expects the impossible return of the finite "by virtue of the absurd" (e.g., the home restored in Question 6). Incommunicable. |  
  | **Divine-Command Theorist** | Strong match: 2C, 4C            | Allows suspension via divine command (public or private). No inherent expectation of return (differs from knights). Authority comes from God, not inwardness. |  
  | **Aesthete**              | Mostly D                          | Denies the ethical has intrinsic authority. No "duties"—only personal impulses matter. Suspension is meaningless; all choices are aesthetic self-expression. |  
  | **Suspicious Reading**    | Mostly E                          | Denies suspension. Any "call" overriding ethics is pathology (e.g., delusion, trauma). Duty must be socially accountable. |  
  | **Unclassified**          | No clear majority                | Incoherent or unexplored stance (see "Unstable Combinations"). |  

  #### **Logical Space Diagram**  
  Positions mapped to the five dimensions:  
  ```  
  Authority: Ethical has intrinsic authority? (Y/N)  
  Suspension: Can ethical be overruled? (Y/N)  
  Source: Overruling must be public? (Y/N/NA)  
  Return: Expect finite restored? (Y/N/NA)  
  Communicable: Can exception be shared? (Y/N/NA)  

  Universalist:           Y | N | NA | NA | NA  
  Tragic Hero:            Y | Y | Y  | N  | Y  
  Knight of Inf. Resign.: Y | Y | N  | N  | N  
  Knight of Faith:        Y | Y | N  | Y  | N  
  Divine-Command:         Y | Y | N/A| N/A| N/A (source/return vary)  
  Aesthete:               N | NA| NA | NA | NA  
  Suspicious Reading:     Y | N | NA | NA | Y (must be verifiable)  
  ```  

  #### **Ambiguities and Limits**  
  - **Indistinguishable Pairs**: The Knight of Faith and the "deluded fanatic" (a subtype of Suspicious Reading) are *inseparable by design*. Both claim private calls expecting miraculous returns (e.g., Answer 6D). The quiz cannot differentiate pathology from genuine faith—it hinges on external truth, not internal stance.  
  - **Unstable Combinations**: These answer patterns are rare, unattractive, or incoherent and map to **Unclassified**:  
    - **A (Universalist) + C (Private Call)**: Claims ethical authority *and* that private calls override it, but denies suspension is possible. Incoherent.  
    - **D (Aesthete) + E (Suspicious)**: Denies ethics while pathologizing its suspension. Unstable self-contradiction.  
    - **B (Tragic Hero) + C (Private Call)**: Mixes public higher universal with private authority. Rare; most resolve to one (e.g., Question 7B is Tragic Hero; 2C is Divine-Command).  
  - **Edge Cases**: The Divine-Command Theorist overlaps with Knights on suspension but is broader (no requirement for resignation/faith movements). It splits from Knights if answers lack expectation of return (e.g., 5C vs. 6D).  
  - **Why No Ninth Position?** The "plain" Divine-Command Theorist is absorbed into the Knight positions when expectation of return is specified (e.g., Question 6). Without that, it stands alone (e.g., Question 2C).  

  This instrument distinguishes **8 positions** (7 named + 1 unclassified). Use it to place characters by their dominant traits, or for readers as a self-discovery tool. In your novel, the father’s unresolved call might hover between Knight of Faith and Suspicious Reading—the quiz’s deliberate blind spot.  

  \positions{8}
