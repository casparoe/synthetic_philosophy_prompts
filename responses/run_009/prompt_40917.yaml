  Okay, the user is a high school junior who's into charity debates and noticed a pattern in their cousin's effective altruism crowd. They focus only on causes with measurable outcomes, like malaria nets, but ignore systemic issues like court reforms because they can't be quantified. The user wants to know if there's a specific term for this exclusion of unquantifiable options from decision-making.

  First, I recall concepts like the streetlight effect and Goodhart’s law. The streetlight effect is about searching where it's easiest, not avoiding dark areas entirely. Here, the group actively excludes non-measurable options. Goodhart’s law involves metrics being gamed, which isn't the case here. So those don't fit perfectly.

  Next, McNamara fallacy comes to mind—focusing only on quantifiable data while ignoring qualitative factors. That matches: the group only considers what they can measure, dismissing anything else as incomparable. The term originates from the Vietnam War, so it's historical and not too jargon-heavy.

  Other related ideas include quantitative bias and instrumental convergence. Quantitative bias is broader, while instrumental convergence is more about AI goals. McNamara seems the closest. Also, methodological exclusion is descriptive but not a standard term. The user might need examples to differentiate these.

  The user also wants to explain the boundaries clearly. They need to articulate why streetlight effect isn't sufficient—here, it's not just convenience but a principled exclusion. Highlighting McNamara fallacy's emphasis on discarding unquantifiable factors would clarify that distinction. 

  They probably want to sound knowledgeable without being pretentious. McNamara fallacy is recognizable but not overly technical. Suggesting phrases like "quantification trap" could be alternatives if the term isn't known. Emphasizing examples and clear boundaries will help them in arguments, showing it's a systemic flaw in the decision process itself.
answer: |-
  That's an *extremely* sharp observation for a high school junior! You've nailed a profound problem in decision theory and applied ethics. You're right that the streetlight effect and Goodhart's Law are close but don't perfectly capture the specific mechanism you're describing.

  **The closest established concept is the McNamara Fallacy (Quantitative Bias Fallacy).**

  Here's the breakdown:

  1.  **McNamara Fallacy (Named after Robert McNamara, US Secretary of Defense during Vietnam):**
      *   **Definition:** Making decisions based *solely* on quantitative factors while ignoring qualitative factors that are harder or impossible to measure, simply *because* they are unquantifiable. It assumes that if something can't be measured, it doesn't matter or can't be compared.
      *   **Origin:** Coined by Daniel Yankelovich (social scientist) in the context of Vietnam War strategy, where McNamara famously relied heavily on body counts as the primary metric of success, ignoring crucial unquantifiable factors like troop morale, political will, cultural dynamics, and long-term societal impact.
      *   **Why it fits your case:**
          *   **Deletion Mechanism:** The core flaw is the *deliberate exclusion* of unquantifiable factors ("fixing the courts," systemic change, justice, fairness, long-term stability) from consideration. They aren't just overlooked out of laziness; they are deemed *inadmissible* evidence by the methodology.
          *   **Decision Procedure Rule:** The rule is explicit: "Only quantifiable inputs/outputs are valid for comparison." Anything that doesn't fit that mold is dismissed as "incomparable," leading inevitably to the selection of only quantifiable interventions (like bed nets).
          *   **Not Gaming:** You're right, it's not about corrupting the metric (Goodhart), but about the *initial selection criteria* for what even *counts* as a valid option or outcome.
          *   **Not Just Laziness:** They are diligently following the rule, not being lazy. The rule itself is flawed.

  2.  **How it differs from the Streetlight Effect:**
      *   **Streetlight Effect:** A man searches for his keys under the streetlight *not because he thinks they are there*, but *because that's where the light is*. It's a search bias driven by convenience or accessibility of data. He *knows* the keys could be elsewhere, but it's harder to look there. The unlit areas aren't *excluded* by rule, they are just *neglected* or *hard to access*.
      *   **McNamara Fallacy:** The person *explicitly argues* that searching anywhere *outside* the light is irrational or impossible because you can't see/measure there. They *deny the validity* of looking elsewhere ("You can't measure justice impact, so it's not a valid comparison point"). The unlit areas are *ruled out* of the decision framework itself. They might even argue systemic interventions *aren't* "effective charity" by definition because they lack countable outputs.
      *   **Your Edge Case:** The streetlight effect guy *would* look in the dark if he had a flashlight (a new measurement tool). The McNamara Fallacy guy would argue that the dark area *fundamentally cannot* be meaningfully searched, even with a flashlight, because darkness itself makes the search invalid.

  3.  **How it differs from Goodhart's Law:**
      *   **Goodhart's Law:** When a measure *becomes* a target, it ceases to be a good measure. People game the system to optimize the metric, often at the expense of the real goal (e.g., teachers teaching to the test, CEOs cutting R&D to boost quarterly profits).
      *   **McNamara Fallacy:** The problem isn't gaming an *existing* metric. The problem is that the *decision methodology itself* refuses to consider any factors that *aren't* easily quantifiable metrics from the outset. The "gaming" hasn't happened yet because the unquantifiable options were never even on the table. The metric isn't corrupted; the *scope* of consideration is artificially narrowed.

  4.  **Other Related Concepts & Differences:**
      *   **Quantitative Bias / Metric Fixation:** These are broader terms describing the *preference* for quantitative data over qualitative. They capture the *tendency* but lack the specific *exclusionary mechanism* ("we *cannot* compare it, therefore we *must* ignore it") that defines the McNamara Fallacy.
      *   **Instrumental Convergence (AI Safety):** The idea that AIs pursuing different ultimate goals might converge on similar sub-goals (like self-preservation, resource acquisition) because those are instrumentally useful. This is about goal *structures*, not specifically about quantification vs. non-quantification in human decision-making.
      *   **Methodological Exclusion:** A descriptive term for what happens, but not a specific named fallacy. McNamara Fallacy *is* the named fallacy describing this type of methodological exclusion in decision-making.

  **How to Talk About It (Without Sounding Like a Textbook):**

  *   **Use the Name (Carefully):** "This sounds like the **McNamara Fallacy** – where we only consider what we can easily count, and *dismiss anything unquantifiable as incomparable*, even if it might be crucial. It's like saying we'll only fix problems we can measure with a ruler, and ignore all the problems that require a different kind of understanding."
  *   **Describe the Mechanism Clearly:** "The problem isn't that bed nets are bad – they're great! The problem is that your *methodology* systematically **excludes entire categories of potentially crucial interventions** – like fixing unjust systems – *simply because they don't produce neat numbers*. You've built a rule that says 'If we can't count it, we can't consider it,' which guarantees you'll only ever pick countable things, regardless of whether uncountable things might be more important in the long run."
  *   **Highlight the Consequence:** "By focusing *only* on countable lives saved *right now*, you're ignoring interventions that might save *far more* lives *over time* by preventing the problems that cause the disease or poverty in the first place, just because that long-term, systemic impact is harder to put a number on."
  *   **Coin a Simple Term (if needed):** If "McNamara Fallacy" feels too obscure, try:
      *   **"The Quantification Trap"**: (Emphasizes the decision-making system is trapped by its own requirement for numbers).
      *   **"Measurability Myopia"**: (Short-sightedness caused by only seeing measurable things).
      *   **"Counting-Only Bias"**: (Very direct).
      *   **"The Incomparability Dodge"**: (Highlights how declaring things "incomparable" is used to avoid grappling with them).

  **Key Boundaries to Articulate:**

  *   **Vs. Streetlight:** "It's not just that it's *easier* to look under the streetlight (streetlight effect). It's that your method *says* it's *invalid* to even *try* looking anywhere else because those areas can't be measured to your standard. You've ruled them out on principle."
  *   **Vs. Goodhart:** "It's not that people are *gaming* the metric for bed nets (Goodhart). It's that the metric-focus *itself* prevents systemic interventions like court reform from even being considered as valid options in the first place."
  *   **Vs. Hard Problems:** "It's not that systemic change is *harder* to evaluate. It's that your specific decision rule *requires* a specific *type* of quantification (like lives/dollar saved *this year*) that systemic change inherently *cannot* provide in the same way, so it gets deleted from the list."

  You've identified a genuine and significant limitation in a popular approach to altruism. Framing it as the McNamara Fallacy gives you a precise, historically grounded concept to explain *why* their methodology inherently biases towards countable interventions and systematically overlooks potentially transformative systemic change. Good luck with the debates!
