prompt: |-
  I've been reading the rationalist blogosphere since the Overcoming Bias days, and I now help run a local community meetup that has drifted over the years from its early epistemics-hygiene roots toward a membership of working ML engineers. Next month it's my turn to lead the session, and I want to do it on Bongard problems — the little six-by-six grids where you induce the rule separating two classes of figures from a dozen examples — and on what they do and don't show about learning concepts from very few positive and negative instances.

  My audience is mostly engineers who came to the meetup through AI-interest channels in the last few years. They are bright, allergic to anything that smells of philosophy of mind, and quietly convinced that the sample-efficiency question was settled the moment large models started picking up new tasks from a handful of in-context examples; their implicit slogan is that priors are what you needed back when you didn't have scale. Two or three old-timers from the early days will also come, and they will treat any appeal to priors or inductive bias as either trivially true or unfalsifiable, whichever is more convenient at the moment.

  I don't want you to write the session's content. I want a teaching plan: the order the pieces have to go in and why, given what depends on what — I suspect the audience has to see that a learner needs a hypothesis space before data can mean anything, but I'm not sure how to get there without a lecture they'll tune out. Then: which single Bongard problem should carry the whole session — what properties it needs, and why the canonical easy ones that open Hofstadter's discussion in Gödel, Escher, Bach are probably the wrong choice despite being the ones everyone half-remembers. Then the misconceptions I should expect, in the order they'll actually surface: that this is just clustering or classification with a small dataset; that in-context learning has made the priors question obsolete; that once you say Solomonoff induction the matter is closed and nothing empirical remains; and that these puzzles are a solved benchmark from the seventies, so why care. For each, tell me where in the sequence it should be headed off rather than left for the discussion to stumble into.

  I should also say what my own thesis for the evening is, because the plan should be built to defend it: my view is that the deep question isn't how any particular solver cracks a given grid but why the space of humanly learnable rule sets is so strikingly small — Bongard problems are curated, and the curation encodes a substantive theory of which concepts are natural or joints-like, which means the dataset itself is evidence about inductive structure rather than a neutral test of it. If the session works, the engineers should leave seeing the problem-set designer, not the solver, as the interesting object. Include a check I can run at the end to see whether that landed as opposed to just leaving them mildly entertained, and tell me what to explicitly refuse to cover — I assume the formal details of Kolmogorov complexity and the entire literature on analogy-making are on that list, but I'd like to know what else joins them and how to say so without sounding like I'm dodging.
reasoning: |-
  We are designing a teaching session on Bongard problems for an audience of ML engineers and a few old-time rationalists. The goal is to shift focus from the solver to the problem designer and to highlight the substantive theory of natural concepts encoded in the curation of Bongard problems.

  Key audience characteristics:
  - Mostly ML engineers, recent attendees via AI channels.
  - Bright, allergic to philosophy of mind.
  - Believe that sample efficiency is solved by large models with in-context learning (priors are outdated).
  - Old-timers: see priors/inductive bias as trivially true or unfalsifiable.

  Thesis:
  The deep question is why the space of humanly learnable rule sets is so small. Bongard problems are curated, and that curation encodes a theory of natural concepts (what makes a rule "joint-like"). Thus, the dataset is evidence about inductive structure, not a neutral test.

  Teaching Plan Structure:

  1. **Engage immediately with a concrete Bongard problem** to avoid tuning out. But we cannot start with the canonical easy ones from GEB because they are too simple and might reinforce the idea that this is trivial. We need one that is:
     - Non-trivial but solvable in a few minutes by humans.
     - Illustrates the need for a hypothesis space (so that the rule isn't obvious from one or two examples).
     - Has multiple plausible hypotheses at first, requiring more examples to disambiguate.
     - The rule should be one that is "natural" for humans but might not be for a machine without the right bias.

  2. **Sequence of Activities**:

     a. **Warm-up with a Problem (5-10 min)**:
        - Present a Bongard problem (without the rule) and ask the audience to work in pairs for 3-5 minutes to come up with the rule. 
        - Why? To engage and to create a shared experience of the learning process.

     b. **Discussion of the Problem (10 min)**:
        - Ask a few pairs to share their hypotheses. (Expect multiple hypotheses at first.)
        - Then reveal the rule and discuss why some hypotheses were eliminated by which examples.
        - Point: The data alone didn't specify the rule until you had enough examples and the right kind of examples. But note: even with a few examples, humans converge quickly. How?

     c. **The Key Question: How is this possible? (10 min)**:
        - Pose the question: How can we learn from so few examples?
        - Expected responses: 
            - "We have prior knowledge." (But what form does that take? They are allergic to philosophy, so we need to avoid that trap.)
            - "We are biased towards simple rules." (But what counts as simple?)
        - We want to steer towards: We have a constrained hypothesis space. We don't consider every possible rule.

     d. **Contrast with Machine Learning (10 min)**:
        - In ML, we often have a model class (e.g., neural networks) and we optimize within that class. But in Bongard problems, the hypothesis space is defined by the problem designer. The designer has chosen a rule that is meant to be "natural" for humans.
        - Point: The problem is designed to be solvable by humans because the rule is in the space of hypotheses we are prone to consider.

     e. **The Curated Nature of Bongard Problems (10 min)**:
        - Highlight that Bongard problems are a curated set. They are not random. The designer (Bongard, and later others) chose rules that are:
            - Learnable from a small number of examples (6 positive, 6 negative).
            - But also, they are rules that humans find "natural".
        - This curation is evidence of what the human inductive bias is.

     f. **Addressing Misconceptions** (Weave these into the above, but also have explicit points):

        - **Misconception 1: This is just clustering/classification with a small dataset.**
            - When: Likely to come up in the warm-up or during the ML contrast.
            - How to head off: During the contrast with ML, emphasize that standard clustering/classification algorithms without a strong inductive bias (like the one we have) would require many more examples. The point is that the hypothesis space is constrained in a way that matches the problem designer's intent.

        - **Misconception 2: In-context learning has made the priors question obsolete.**
            - When: During the discussion of how we learn from few examples, or when talking about ML.
            - How to head off: Point out that in-context learning in large models is impressive, but note that the model's ability to solve a Bongard problem in-context would rely on having seen similar patterns during training. The model's prior is built from vast data. The problem designer's prior (what rules are natural) is what allows the problem to be posed in the first place. Without that, even a large model might not solve it from 12 examples if the rule were arbitrary.

        - **Misconception 3: Once you say Solomonoff induction, the matter is closed.**
            - When: Might be raised by the old-timers during the discussion of priors.
            - How to head off: Acknowledge Solomonoff as a theoretical framework, but point out that it is uncomputable and doesn't explain why humans find some rules natural and others not. Moreover, the Bongard problems are designed to be solvable by humans, so they avoid rules that are complex in a human sense (even if they are short in Kolmogorov complexity for a universal machine). The point is that the human bias is a particular one, and that's what the problem set reveals.

        - **Misconception 4: These are solved benchmarks from the seventies, so why care?**
            - When: Possibly at the beginning or during the ML contrast.
            - How to head off: In the introduction, frame Bongard problems not as a benchmark for AI (though they have been used as such) but as a window into human concept learning. The fact that they are from the seventies doesn't matter because the cognitive question is timeless. Also, note that recent AI work (like in the Abstraction and Reasoning Corpus, ARC) is inspired by similar ideas.

     g. **The Big Picture: The Problem Designer as the Interesting Object (10 min)**:
        - Reiterate the thesis: The space of humanly learnable rules is small and structured. The Bongard problem set is a reflection of that structure. Therefore, the problem designer is making a claim about what the natural concepts are.
        - This structure is what allows learning from few examples. Without it, even 12 examples wouldn't be enough because there would be too many rules consistent with the data.

     h. **Check for Understanding (5 min)**:
        - Ask: "If we were to create a new Bongard problem, what considerations would we have to make to ensure it is solvable by humans in 12 examples?"
        - We want to hear: 
            - The rule must be one that humans can easily think of (in their hypothesis space).
            - The examples must be chosen to rule out alternative hypotheses that humans might consider.
            - The rule should be one that is not too sensitive to small variations (robust).
        - Alternatively, we could ask: "What does the existence of Bongard problems tell us about human learning that we don't get from studying in-context learning in LLMs?"

  3. **Choice of Bongard Problem**:

     We need a problem that:
     - Is not too easy (like "all left have a triangle").
     - Has some ambiguity that gets resolved by the examples.
     - Illustrates that the rule is about a structured concept (like symmetry, connectedness, topological property, etc.).

     Example: Let's use BP #6 from the classic 100 (readily available online). The rule for BP #6 is: 
        - Left: All figures have exactly one dot inside and one dot outside the main shape.
        - Right: Either the number of dots inside is not equal to one, or the number outside is not equal to one (or both).

     Why this one?
     - At first glance, the examples might seem to have dots in various positions. 
     - Hypotheses might include:
          - Presence of dots? (But both sides have dots.)
          - Number of dots? (But there can be the same total number on both sides.)
          - Location of dots? (Inside vs outside the shape? But then note: the left always has one inside and one outside, while the right might have two inside, or two outside, or one inside and two outside, etc.)
     - It requires noticing two properties and their conjunction.

     This problem is also good because it is not about a single feature but a relational one (inside/outside) and a count. It is not the most complex but not trivial either.

  4. **What to Avoid**:

     - Formal details of Kolmogorov complexity: Mention it as a theoretical ideal, but don't dive into the math.
     - Literature on analogy-making: We are not focusing on how humans solve these by analogy but on the structure of the problem set.
     - Philosophy of mind: Frame everything in terms of hypothesis spaces and inductive bias without using philosophical jargon. Talk about what rules are considered and what are not.

     How to say so: "We're going to focus on the structure of the problems and what they reveal about the constraints on learning. We won't be diving into the cognitive mechanisms of how we solve them or the formal information theory behind it, because our goal is to understand why these problems are designed the way they are."

  5. **Timing**:

     - Total session: 60-75 minutes.
     - Breakdown:
          - Warm-up problem: 10 min (5 min work, 5 min initial share)
          - Discussion of the problem and how we solved it: 10 min
          - The key question (how we learn from few examples) and hypothesis space: 10 min
          - Contrast with ML and addressing misconceptions: 15 min
          - The curated set and the problem designer: 10 min
          - Check for understanding and wrap-up: 10 min

     Adjust as needed.

  Plan Summary:

  1. Start with a Bongard problem (BP #6) to engage.
  2. Discuss how we solved it, highlighting the hypothesis space and disambiguation.
  3. Draw the lesson: learning from few examples requires a constrained hypothesis space.
  4. Contrast with ML: in-context learning is impressive but relies on a prior built from data; the problem designer's prior is what makes the problem possible.
  5. Emphasize the curation: the problem set is evidence of human inductive bias.
  6. Check: Ask them to design a new Bongard problem, or to reflect on what the problem set tells us about human learning.

  This plan should shift the focus to the problem designer and the structure of the problem set.
answer: |-
  Below is a structured teaching plan designed to achieve your goals. It prioritizes engagement, addresses misconceptions preemptively, and builds toward your thesis—that Bongard problems reveal the **curated nature of "natural" concepts** and the **smallness of the humanly learnable hypothesis space**. The audience's ML background and biases are central to the sequencing. I'll outline the flow, rationale, problem selection, misconception handling, and an assessment check.

  ---

  ### **Teaching Plan Structure & Rationale**  
  **Total Time:** 60–75 minutes (adjustable).  
  **Core Flow:** Concrete problem → Inductive struggle → Hypothesis space → Designer’s role → Thesis.  
  **Why this order?**  
  - Start with a **hands-on puzzle** to engage engineers (avoids philosophical abstraction).  
  - Use their **failure/slow progress** to reveal the need for hypothesis constraints (data alone is insufficient).  
  - Contrast with ML to disarm "priors are obsolete" early.  
  - End with curation as the key insight (designer > solver).  

  ---

  ### **Session Flow**  
  #### **1. Hook: Struggle with a Bongard Problem (10–12 min)**  
  - **Activity:** Distribute a **single Bongard problem** (details below). Ask small groups to:  
    - *"Find the rule separating left/right boxes using only the provided examples. Write 2–3 candidate rules in 5 minutes."*  
  - **Rationale:** Forces them to confront the ambiguity of few-shot learning. Engineers expect quick wins; a well-chosen problem induces frustration, revealing that data alone is uninformative without constraints.  
  - **Facilitation:** Circulate and note groups’ hypotheses. Don’t confirm answers—use uncertainty to transition.  

  #### **2. Debrief: Why Was This Hard? (10 min)**  
  - **Activity:**  
    - Poll groups: "What rules did you propose?" List hypotheses on board.  
    - Ask: "Which examples ruled out your initial guesses? Why weren’t 12 examples enough to be certain?"  
  - **Key Point:** Highlight that >99% of possible rules fit the data equally well—e.g., a pixel-level rule vs. a high-level geometric one. Data underdetermines the solution without a bias toward "natural" hypotheses.  
  - **Rationale:** Creates cognitive dissonance. Engineers tacitly assume data efficiency comes from scale; here, scale is absent, exposing the need for prior structure.  

  #### **3. Hypothesis Spaces: The Scaffolding of Learning (10 min)**  
  - **Activity:**  
    - Define "hypothesis space" in ML terms: "The set of rules/models your learner considers *before* seeing data."  
    - Use the board’s list: "Your hypotheses weren’t arbitrary—they were geometric (shapes), topological (connectivity), or combinatorial (counts). Why not pixel-level rules? Why not rules about moon phases?"  
  - **Key Point:** Learning requires a constrained hypothesis space. Without it, no amount of data resolves ambiguity.  
  - **Transition to ML:** "This is why ‘priors’ aren’t philosophical—they’re your model architecture, data augmentations, or token embeddings. GPT’s in-context learning works because its hypothesis space is pre-constrained by training."  
  - **Rationale:** Grounds "priors" in engineering. Preempts dismissal by linking to familiar concepts (e.g., ResNet’s bias for translation invariance).  

  #### **4. Contrast with Modern ML: Why Bongard Problems Still Bite (10 min)**  
  - **Activity:**  
    - Q: "Could GPT-4 solve this? Would fine-tuning on 12 examples work?" Acknowledge successes but stress:  
      - GPT-4’s "priors" come from scale/training, not magic. It would fail on novel Bongard rules unlike those in its training distribution.  
      - Fine-tuning fails here without the right inductive bias (demonstrate with a toy example: a rule like "shapes with odd/even symmetry" if absent from pre-training).  
  - **Key Point:** Scale solves *some* sample-efficiency problems but doesn’t explain *which rules feel natural to humans*. Bongard problems probe this core inductive bias.  
  - **Rationale:** Directly counters "in-context learning obsoletes priors." Shows scale shifts priors but doesn’t eliminate the need for them.  

  #### **5. The Designer as the Star: Curation as Evidence (10 min)**  
  - **Activity:**  
    - Reveal the problem’s rule. Ask: "How many of you guessed this? How many considered it *possible* from the start?"  
    - Display 3–4 other Bongard rules (e.g., "shapes contain a closed loop", "dots are inside/outside boundaries"). Note: "These are all solvable by humans in minutes. Why?"  
  - **Thesis Delivery:**  
    > "The puzzle isn’t the solver—it’s the designer. Bongard curated these problems to be learnable from 12 examples by *humans*. That means the hypothesis space is tiny: only rules that align with human cognitive biases (e.g., symmetry, topology, object persistence) are included. The dataset isn’t a neutral benchmark; it’s evidence of what our minds treat as ‘natural joints’ in reality."  
  - **Rationale:** Positions curation as the takeaway. Uses concrete examples to show the hypothesis space’s smallness.  

  #### **6. Misconception Handling & Discussion (15 min)**  
  Address these **as they arise** (likely in Q&A) but preempt key points earlier:  

  | Misconception | When to Address | How to Preempt/Respond |
  |---------------|-----------------|------------------------|
  | **"This is just small-data classification"** | During Hook/Debrief (Steps 1–2) | **Preempt:** Emphasize that classification assumes a predefined feature space (e.g., pixels). Bongard requires *discovering* the relevant features—which depends on the hypothesis space. |
  | **"In-context learning makes priors obsolete"** | During ML Contrast (Step 4) | **Preempt:** Scale provides broad priors but doesn’t explain why *specific* rules (e.g., topology over pixel counts) are universally human-natural. Bongard problems isolate this bias. |
  | **"Solomonoff induction solves this"** | During Hypothesis Space (Step 3) or Q&A | **Preempt:** "Solomonoff is a theoretical prior—uncomputable and too broad. Humans don’t consider all computable rules; we consider <0.1% of them (e.g., not ‘shapes visible only on Tuesdays’). Bongard problems are a map of that 0.1%." |
  | **"Solved 70s benchmark—why care?"** | During Designer Focus (Step 5) | **Preempt:** "They’re not a benchmark for machines but a window into human cognition. Modern analogs (e.g., ARC) still grapple with the same issue: which concepts are learnable from few examples?" |
  | **Implicit: "Priors are unfalsifiable"** | During Hypothesis Space (Step 3) | **Preempt:** "Hypothesis spaces *are* falsifiable: Train a model without the right bias (e.g., a pixel CNN) on 12 examples. It fails. Add the bias (e.g., geometric primitives), and it works." |

  #### **7. Check for Understanding (5 min)**  
  - **Activity:** Pose: **"What would a Bongard problem look like if it *couldn’t* be solved by humans in 12 examples? What does that tell us?"**  
    - **Desired Response:** Rules outside human "natural" concepts (e.g., "shapes whose SVG code has prime-length paths"). If they grasp the thesis, they’ll note:  
      - The problem would feel "arbitrary" or "unlearnable."  
      - Its existence would challenge the designer’s assumptions about human biases.  
  - **Why this works:** Tests if they see curation (not solvers) as the core. Engineers enjoy "breaking" systems—this flips the focus to designing unlearnable rules.  

  ---

  ### **Bongard Problem Selection**  
  **Chosen Problem:** **[BP#47](https://www.foundalis.com/res/bps/bpidx/00000.html#BP00047)** (e.g., "Left: Shapes with a dot *inside* a closed region; Right: Shapes with a dot *outside* all closed regions").  

  | **Property**          | **Why BP#47?** | **Why Not Canonical GEB Problems?** |  
  |------------------------|---------------|-------------------------------------|  
  | Non-trivial ambiguity  | Dots can be inside/outside/on boundaries. Early examples might suggest simpler rules (e.g., "presence of dots"). | GEB problems (e.g., "triangles vs. squares") are too obvious—audience solves them instantly, reinforcing "this is trivial." |  
  | Requires hypothesis constraints | Humans consider topological relationships (inside/outside) but ignore noise (e.g., exact dot position). Rules like "dots within 0.5cm of an edge" feel unnatural. | Easy problems can be solved with low-level features (shape counts), obscuring the need for high-level biases. |  
  | Illustrates "natural" concept | Topology (inside/outside) is human-natural but not default for ML models. Pre-trained vision models often fail without explicit bias. | Canonical problems use basic geometry, which modern ML handles well—feeding the "scale solves this" misconception. |  
  | Curated difficulty     | 6 examples per side are sufficient for humans but challenging for unguided ML. | Some GEB problems are too hard (e.g., abstract analogies), causing frustration without insight. |  

  ---

  ### **What to Explicitly Exclude**  
  Declare upfront to manage expectations:  
  > *"We won’t cover:  
  > - Kolmogorov complexity/Solomonoff induction (theoretical ideals, but not practical here).  
  > - Cognitive theories of analogy (e.g., Hofstadter’s fluid concepts).  
  > - ML solver code (today is about what makes a problem *learnable*).  
  > Why? Our goal is to dissect the problems’ design—not build solvers or debate philosophy. If you’re keen on those, I’ll share resources post-session."*  

  **Why this works:** Signals focus without dodging. Engineers respect boundary-setting.  

  ---

  ### **Expected Challenges & Mitigations**  
  - **Engineers rush to "solve" computationally:** During the Hook, stress: *"Solve this as a human would—no ML heuristics."*  
  - **Old-timers derail with theory:** If they invoke Solomonoff, respond: *"Let’s test that—what would happen if we gave this problem to an unconstrained learner?"* and pivot to empirical failure.  
  - **Skepticism about relevance:** Use ARC (Abstraction and Reasoning Corpus) as a modern hook: *"Bongard problems are the ARC of the 1960s—both expose how hard it is to formalize ‘natural’ concepts."*  
  - **Dominant participants:** Assign groups with clear roles (e.g., "hypothesis tracker" vs. "skeptic").  

  ---

  ### **Summary: Why This Plan Works**  
  - **Meets engineers where they are:** Starts concrete, uses their language (hypothesis spaces, model biases), and validates their ML knowledge while stretching it.  
  - **Thesis defense:** The struggle with BP#47 → hypothesis space discussion → ML contrast → designer focus creates an "aha" moment: curation is the core.  
  - **Efficient misconception handling:** Preempts major objections by sequencing activities to expose flaws in default assumptions.  
  - **Check:** The "unlearnable problem" question tests if the curation insight landed.  

  By the end, engineers should see Bongard problems not as dusty puzzles but as evidence of the inductive biases that make human learning possible—biases that scale alone doesn’t replicate. Let me know if you'd like refinements!
