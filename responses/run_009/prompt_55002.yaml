prompt: |-
  I'm a senior editor at a popular history magazine and our line editors keep having to referee pieces built around non-human causes — a plague that "redrew the map of Europe," a drought behind a revolution, a volcanic winter that topples a dynasty. Some of these pieces are great, others quietly become "the germs did it" storytelling where nobody in the past actually makes a decision. My editors aren't historians and get about half an hour per draft, so vibes-based pushback isn't cutting it.

  Write me a procedure they can actually run on a draft: the questions to ask in order (I'm imagining stuff like: is the volcano doing the causal work or just setting the price of grain?, would the writer make the same claim if a human agent were substituted in?), what counts as a sufficient answer at each step, where the procedure terminates in a "rewrite this paragraph," and where it has to kick the draft back to me because the real issue is a value judgment about which story of the past we're telling, not a factual one. Be honest about the known failure modes — e.g. that the procedure will over-flag good environmental history, and what a cheap second-look pass for that looks like.

  Then run it on two drafts: one arguing a decade of cold, wet summers after a major eruption pushed a grain-short empire into civil war, and one arguing plague-driven labor scarcity forced elites to rewrite wage law — where the humans are visibly responding rather than being swept along. I'd also like one worked case where the procedure tells the writer to kill the thesis sentence, since that's usually the sentence the whole pitch was sold on and they'll fight us on it.
reasoning: |-
  We are creating a procedure for line editors to evaluate historical drafts that center non-human causes. The goal is to avoid reductionist storytelling where historical events are solely attributed to environmental factors without human agency. The procedure should be a step-by-step checklist with specific questions, criteria for sufficient answers, and clear outcomes (rewrite, kick upstairs, or pass). We also need to account for over-flagging good environmental history and provide a quick second-look.

  ## Procedure: Evaluating Non-Human Causes in Historical Narratives

  **Step 0: Pre-screening**
  - Check if the draft's central thesis or key turning points are attributed primarily to a non-human cause (e.g., plague, volcano, drought). If not, stop. The procedure doesn't apply.

  **Step 1: Identify the Causal Role of the Non-Human Factor**
  - **Question:** Is the non-human factor doing the causal work (i.e., directly causing the outcome) or is it setting the stage (e.g., creating conditions that humans respond to)?
  - **Sufficient Answer:** The non-human factor should be presented as a context or catalyst, not the sole cause. If the text implies the outcome was inevitable because of the non-human factor, that's insufficient.
  - **Outcome:** 
    - If the non-human factor is the sole or direct cause (e.g., "The volcano destroyed the dynasty"), flag for rewrite. The rewrite should reframe to show how humans reacted to the conditions created by the volcano.
    - If it's setting the stage (e.g., "The volcanic eruption led to crop failures, which prompted the emperor to..."), proceed to Step 2.

  **Step 2: Check for Human Agency**
  - **Question:** Are human decisions, institutions, and actions clearly visible and necessary in the causal chain? (Sub-question: If you substituted the non-human factor with a human agent (e.g., a war, a policy change) would the same causal logic hold? If yes, that's a good sign because it means the humans are doing the work.)
  - **Sufficient Answer:** The draft must show that humans made choices (even constrained ones) and that these choices were critical to the outcome. The non-human factor should not be able to replace human agency.
  - **Outcome:**
    - If human actions are absent, vague, or passive (e.g., "the plague led to higher wages"), flag for rewrite. Specify where to add human decisions (e.g., "laborers negotiated for higher wages because of scarcity").
    - If human agency is present and necessary, proceed to Step 3.

  **Step 3: Evaluate the Balance of Factors**
  - **Question:** Does the draft acknowledge other contributing factors (e.g., pre-existing tensions, economic structures, individual leadership) alongside the non-human one?
  - **Sufficient Answer:** The non-human factor should be integrated with other historical factors, not isolated. It should not be presented as the only or overwhelmingly dominant cause.
  - **Outcome:**
    - If the draft is monocausal (only the non-human cause), flag for rewrite to add complexity.
    - If multiple factors are present, but the non-human one is overemphasized, flag for rewrite to adjust emphasis.
    - If balanced, proceed to Step 4.

  **Step 4: Assess the Thesis Statement**
  - **Question:** Does the thesis sentence (or the core argument) overstate the role of the non-human cause? (Look for words like "caused", "led to", "forced" without human intermediaries.)
  - **Sufficient Answer:** The thesis should reflect the integrated causal model (non-human factor -> human response -> outcome). It should avoid implying inevitability.
  - **Outcome:**
    - If the thesis is reductionist (e.g., "The Little Ice Age caused the French Revolution"), kick the draft back to the senior editor because revising the thesis may fundamentally change the story the writer wants to tell and requires high-level judgment.
    - If the thesis is appropriately balanced (e.g., "The Little Ice Age created agricultural distress that contributed to the outbreak of the French Revolution"), proceed to Step 5.

  **Step 5: Final Check for Environmental Determinism Traps**
  - **Question:** Does the draft avoid implying that the environment is a historical agent (e.g., "the drought decided the fate of the empire")?
  - **Sufficient Answer:** Non-human factors are inanimate and cannot "decide" or "act". Humans must be the agents.
  - **Outcome:**
    - If there's metaphorical language that attributes agency to the non-human, flag for rewrite to remove such language.
    - Otherwise, the draft passes.

  **Termination Points:**
  - **Rewrite Paragraph:** Steps 1, 2, 3, or 5 flag an issue that can be fixed by revising specific sections (e.g., rephrasing a sentence, adding a paragraph about human decisions).
  - **Kick Upstairs:** Step 4 (thesis) or if the entire draft's argument is fundamentally reductionist and the writer is committed to that framing (requires senior editorial judgment).

  **Known Failure Modes:**
  1. **Over-flagging good environmental history:** The procedure might flag drafts that appropriately center environmental factors but do so with nuance (e.g., showing how environmental conditions were mediated by human institutions). 
     - **Second-Look Pass:** Quickly scan for the presence of human agency and multi-causality. If these are present, even if the environmental factor is prominent, let it pass.

  2. **Under-flagging:** If the draft pays lip service to human agency but still implies inevitability, it might slip through. Editors should be especially vigilant in Step 2 to ensure human actions are not just mentioned but are necessary and active.

  Now, we run the procedure on three examples:

  ### Example 1: Volcanic Eruption and Civil War
  **Draft Argument:** A decade of cold, wet summers after a major volcanic eruption pushed a grain-short empire into civil war.

  **Step 0:** Yes, non-human cause (volcanic eruption and climate effects) is central.

  **Step 1:** The volcanic eruption is setting the stage (causing cold, wet summers and grain shortage). But the phrasing "pushed" implies the empire was passively pushed into war. The non-human factor is doing too much work. **Outcome:** Flag for rewrite to clarify how the grain shortage led to human decisions that resulted in civil war.

  **Step 2:** Human agency is not visible. The empire is "pushed" without mention of human actors (e.g., rebels, rulers, soldiers). **Outcome:** Rewrite to show human responses (e.g., "the grain shortage led to peasant uprisings and the emperor's harsh repression, which sparked civil war").

  **Step 3:** The argument is monocausal. No other factors (e.g., pre-existing political tensions) are mentioned. **Outcome:** Rewrite to include other factors.

  **Step 4:** The thesis overstates: "pushed ... into civil war" implies direct causation. **Outcome:** Kick upstairs? Actually, the rewrite in Steps 1-3 might fix this. But if the thesis remains unchanged, it might still be reductionist. We'd rewrite the thesis to: "A decade of cold, wet summers after a major volcanic eruption caused grain shortages that contributed to the outbreak of civil war in an empire already strained by [other factors]." Since this is a rewrite of the thesis, but not a fundamental reorientation, the line editor can request it. If the writer resists, then kick upstairs.

  **Step 5:** The volcano isn't anthropomorphized. Pass.

  **Verdict:** Rewrite the paragraph(s) to include human agency and multiple factors. Adjust the thesis to reflect a contributing cause, not the sole cause.

  ### Example 2: Plague and Wage Laws
  **Draft Argument:** Plague-driven labor scarcity forced elites to rewrite wage law — where the humans are visibly responding rather than being swept along.

  **Step 0:** Non-human cause (plague) is central.

  **Step 1:** The plague is setting the stage (causing labor scarcity). The elites are "forced" — but note: the writer says humans are "visibly responding". Let's see: "forced" might imply inevitability, but if the draft shows the elites making a decision, it's okay.

  **Step 2:** Human agency is present: elites are rewriting wage laws. The plague didn't rewrite the laws; humans did. The substitute test: If we replaced the plague with, say, a war that killed many workers, would the elites still have rewritten the laws? Probably yes. So the humans are doing the causal work. **Outcome:** Pass.

  **Step 3:** The draft might be implying that the plague was the only reason, but the writer says humans are visibly responding. We'd need to see if other factors are mentioned (e.g., pre-existing trends, other pressures). If not, flag to add. But the writer states it's about response, so we'll assume it's handled. **Outcome:** Pass (with a note to ensure other factors are acknowledged if absent).

  **Step 4:** Thesis: "Plague-driven labor scarcity forced elites to rewrite wage law." The word "forced" is problematic because it implies no choice. But if the draft shows that elites had alternatives and chose to rewrite the laws, then the thesis should be rephrased to "led elites to rewrite" or "prompted elites to rewrite". **Outcome:** Rewrite the thesis sentence to remove "forced".

  **Step 5:** No agency attributed to plague. Pass.

  **Verdict:** Rewrite the thesis sentence to avoid "forced" (e.g., "led to" or "prompted"). Otherwise, the draft is okay.

  ### Example 3: Kill the Thesis Sentence
  **Draft Argument:** "The Dust Bowl caused the Great Migration of African Americans from the rural South to Northern cities."

  **Step 0:** Non-human cause (Dust Bowl) is central.

  **Step 1:** The Dust Bowl is presented as the cause. But the Great Migration was a human response to multiple factors, including economic opportunities and racial oppression. The Dust Bowl (which mainly affected the Great Plains) is misattributed as the cause of a movement from the South. **Outcome:** Flag for rewrite.

  **Step 2:** Human agency is absent in the thesis. The migration is presented as a direct result of the Dust Bowl, which is inaccurate and erases the decisions of African Americans and the complex reasons for migration. **Outcome:** Rewrite to show human decision-making and other factors.

  **Step 3:** Monocausal and factually incorrect (the Dust Bowl was not in the South). **Outcome:** Rewrite to include the actual causes (e.g., economic opportunities in the North, mechanization of agriculture, racial terror in the South, and the Dust Bowl as one factor among many that affected some migrants from overlapping regions).

  **Step 4:** The thesis is fundamentally flawed and reductionist. **Outcome:** Kill the thesis sentence and kick the draft back to the senior editor because the entire argument needs restructuring. The writer may have built the piece around this incorrect thesis, so it requires rethinking the narrative.

  **Verdict:** Kill the thesis sentence and kick upstairs for fundamental restructuring.
answer: |-
  Here's a practical, step-by-step procedure for your line editors to evaluate pieces centered on non-human causes. It focuses on **causal agency** and **narrative balance**, with clear exit points for rewrites or senior escalation. The goal is to catch "germs did it" reductionism while preserving strong environmental history.

  ---

  ### **Procedure: Non-Human Cause Audit**
  **Time Budget:** 5-7 minutes per draft (focus on key paragraphs/thesis)  
  **Tools Needed:** Highlighter for non-human agents (e.g., "plague," "drought"), agency verbs (e.g., "forced," "caused"), and human actions.

  #### **Step 1: Identify the Non-Human Cause’s Role**  
  - **Question:** *Is the non-human factor (e.g., volcano, plague) the primary subject of active verbs?* (e.g., "The plague *redrew* the map," "Drought *toppled* the dynasty.")  
  - **Sufficient Answer:** Non-human nouns should **never** be the subject of verbs implying intent, strategy, or direct causation. They may only set conditions (e.g., "The plague *created labor shortages*," "Drought *reduced harvests*").  
  - **Outcome:**  
    - **Fail → Rewrite paragraph:** Replace agency verbs with passive/conditional phrasing (e.g., change "The volcano *destabilized* the empire" to "The volcano *triggered famines that destabilized* the empire").  
    - **Pass → Proceed to Step 2.**

  #### **Step 2: Test Human Agency**  
  - **Question:** *If you substituted the non-human cause with a human agent, would the sentence still make sense?* (e.g., Swap "plague" → "King John"; "drought" → "tax collectors.")  
  - **Sufficient Answer:** The substitution should **break the logic** because human responses are necessary intermediaries (e.g., "Labor scarcity from the plague led *workers to demand* higher wages" fails if swapped to "King John led *workers to demand* higher wages" – why would he?).  
  - **Outcome:**  
    - **Fail → Rewrite paragraph:** Add explicit human decisions/actions (e.g., insert "*landlords responded to* labor scarcity by...").  
    - **Pass → Proceed to Step 3.**

  #### **Step 3: Check for Structural Inevitability**  
  - **Question:** *Does the narrative imply the outcome was unavoidable?* (e.g., "The famine *made* collapse inevitable," "There was no alternative to revolution.")  
  - **Sufficient Answer:** At least **one alternative path** or **contingent choice** must be acknowledged (e.g., "The famine *intensified* unrest, *though* the emperor’s refusal to release grain reserves triggered revolt").  
  - **Outcome:**  
    - **Fail → Rewrite paragraph:** Add a counterfactual or historical contingency (e.g., "*Had the regime distributed grain stockpiles*, unrest might have been avoided...").  
    - **Pass → Proceed to Step 4.**

  #### **Step 4: Thesis Stress Test**  
  - **Question:** *Does the thesis sentence attribute the outcome primarily to the non-human cause?* (e.g., "The volcanic winter *caused* the dynasty’s fall.")  
  - **Sufficient Answer:** The thesis must **include human agency** and frame the non-human factor as a *catalyst* or *context* (e.g., "The volcanic winter *created conditions that led rebels to exploit* the dynasty’s weaknesses.").  
  - **Outcome:**  
    - **Fail → Kill the thesis sentence and escalate to senior editor:** If removing the thesis undermines the entire argument, the piece’s core narrative requires senior-level debate about historical framing.  
    - **Pass → Draft approved.**

  ---

  ### **Known Failure Modes & Mitigations**  
  1. **Over-flagging nuanced environmental history:**  
     - **Why:** Strong pieces may center environmental factors but still show human mediation (e.g., "The Little Ice Age *shaped* farming adaptations"). The procedure will flag these as "high risk."  
     - **Fix:** Add a 2-minute **"Second-Look Pass"** for drafts that fail Step 1/2:  
       - Scan for "institutional filters" (e.g., "The drought *exposed* the regime’s corruption," "Plague deaths *enabled* worker bargaining"). If present, override the flag.  

  2. **Missing subtle determinism:**  
     - **Why:** Writers may bury "inevitability" in conclusions (e.g., "Thus, the pathogen decided Europe’s fate").  
     - **Fix:** Editors should prioritize scanning the **first/last paragraphs** and **headings** for deterministic language.  

  3. **Under-scoring power imbalances:**  
     - **Why:** The procedure may pass pieces where elites "respond" to non-human causes but ignore marginalized groups (e.g., only kings/bureaucrats "act").  
     - **Mitigation:** Not in scope for this audit—assign to sensitivity readers separately.  

  ---

  ### **Applied to Your Draft Examples**  
  #### **Draft 1: Volcanic Eruption → Grain Shortage → Civil War**  
  - **Thesis:** "A decade of cold, wet summers after the 1600 BCE Alaskan eruption pushed the Bronze Age Mediterranean Empire into civil war."  
  - **Audit:**  
    - **Step 1:** *Fail.* "Eruption pushed the empire" assigns agency to the volcano.  
    - **Rewrite:** Change to "The eruption *triggered* climate changes that *contributed to* grain shortages; these shortages *amplified* regional tensions, *leading rebels in the northern provinces to launch* a civil war."  
    - **Step 2:** Substitution test: "The eruption" → "General Marcus" → "General Marcus pushed the empire into civil war" *works* – implies General Marcus caused it directly. Rewrite adds human actors ("rebels").  
    - **Step 3:** No alternatives mentioned. *Fail.* Add: "The central regime *could have averted* war by negotiating with northern leaders but *chose* military suppression."  
    - **Step 4:** Original thesis fails. Revised thesis passes. **Verdict:** Rewrite paragraph + thesis.  

  #### **Draft 2: Plague Scarcity → Wage Law Changes**  
  - **Thesis:** "Labor shortages from the 1351 plague forced elites to rewrite wage laws to retain workers."  
  - **Audit:**  
    - **Step 1:** *Pass.* "Labor shortages" (condition) not acting. "Forced" is borderline but acceptable if humans respond.  
    - **Step 2:** Substitution test: "Labor shortages" → "Queen Isabella" → "Queen Isabella forced elites to rewrite laws" *fails logically* (elites *are* Queen Isabella). Human intermediaries are explicit (elites made choices). **Pass.**  
    - **Step 3:** Contingency acknowledged: "Workers *used* scarcity to demand higher pay, *prompting* elites to cap wages." **Pass.**  
    - **Step 4:** Thesis passes but tighten "forced" → "led elites to rewrite." **Verdict:** Minor rewrite ("forced" → "prompted").  

  #### **Draft 3 (Kill Thesis Example): "The Dust Bowl Caused the Great Migration"**  
  - **Thesis:** "The 1930s Dust Bowl alone forced millions of Black sharecroppers to flee the South for northern cities."  
  - **Audit:**  
    - **Step 1:** *Fail.* "Dust Bowl forced" implies agency.  
    - **Step 2:** Substitution test: "The Dust Bowl" → "Mayor LaGuardia" → "Mayor LaGuardia forced sharecroppers to flee" *works* – illogical (he’s a NYC mayor). Humans are passive.  
    - **Step 3:** Ignores Jim Crow, factory jobs, lynching. *Fail.*  
    - **Step 4:** **Kill thesis and escalate.** The sentence erases racism/agency; the piece likely overweights environment. Senior editor must decide: reframe around "environment as one factor" or kill the pitch.  

  ---

  ### **Procedure Workflow Summary**  
  ```mermaid
  graph TD
      A[Start Audit] --> B{Step 1: Non-human as agent?}
      B -->|Yes| C[Rewrite Paragraph]
      B -->|No| D{Step 2: Human substitution breaks logic?}
      D -->|No| E[Rewrite Paragraph]
      D -->|Yes| F{Step 3: Inevitable outcome?}
      F -->|Yes| G[Rewrite Paragraph]
      F -->|No| H{Step 4: Thesis overclaims?}
      H -->|Yes| I[Kill Thesis + Escalate to Senior]
      H -->|No| J[Approve Draft]
      C --> K[Return to Writer]
      E --> K
      G --> K
      I --> L[Senior Editor Judgment]
  ```  
  **Escalation Note:** Steps requiring senior input (thesis kill, contested framing) should include a 1-sentence rationale: *“This reduces historical actors to passive victims of environment – clashes with our ‘human-centric complexity’ standard.”* Pair with writer talking points (e.g., "Can we reframe the volcano as a backdrop to imperial mismanagement?").  

  This procedure prioritizes **actionable checks** over vibes, minimizes senior workload, and allows nuanced environmental history to pass with minor tweaks. I’d recommend a 1-hour training session with editors to practice the substitution test and thesis stress-test.
