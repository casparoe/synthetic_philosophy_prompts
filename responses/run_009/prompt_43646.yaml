prompt: |-
  I'm a PhD student in philosophy whose dissertation defends a fitting-attitude analysis of final value, and I've run into a worry I can't seem to dissolve. As I understand the literature, the wrong kind of reasons problem is supposed to show that we sometimes have decisive reasons to hold attitudes for considerations that have nothing to do with the attitudes' fittingness — for instance, the stock case where a demon threatens to torture you unless you admire her, so that you seem to have a reason to admire her that has nothing to do with her admirability. Here's my problem: if that's right, then we can have good reasons to believe things for entirely non-evidential considerations too (the demon could just as well demand belief), and it seems to follow that evidentialism about belief is simply false and that the pragmatist tradition won this debate long ago. My advisor keeps writing "different problem" in the margins, but I honestly can't see the difference: in both cases we appear to have genuine reasons for attitudes that don't track how the world actually is, so whatever supports the one case should support the other. What am I missing about how the wrong kind of reasons problem is supposed to be a problem about the analysis of value rather than a discovery about what justifies attitudes? And is there any principled way to accept the demon cases in the fitting-attitude literature while still insisting that only evidence can justify belief? I'd be grateful for a careful explanation, written in continuous prose only — no headings, bullet points, bold text, or tables — as I'd like to incorporate it into a chapter draft.
reasoning: |-
  Okay, the user is a PhD student in philosophy working on a fitting-attitude analysis of final value. They're stuck on how the wrong kind of reasons (WKR) problem relates to evidentialism about belief. Their worry is that if pragmatic reasons can justify attitudes like admiration in demon cases, then the same should apply to belief, undermining evidentialism. Their advisor says it's a different problem, but they don't see the distinction. They need a clear, prose-only explanation to integrate into their chapter draft.

  First, I need to recall the core issues here. The WKR problem for fitting-attitude theories (FA) of value is that reasons to have an attitude (like admiration) can come from external factors (e.g., a demon's threat) that don't make the object fitting. For belief, pragmatism suggests non-evidential reasons (like practical benefits) could justify belief, while evidentialism denies this. The user is conflating these, thinking if WKR shows pragmatic reasons work for admiration, they should for belief too. But that's not necessarily true because the nature of the attitudes differs.

  The key distinction lies in the constitutive norms of each attitude. Belief aims at truth, so its norm is evidential. Admiration's fittingness isn't tied to truth in the same way. The demon case for admiration exposes a problem for FA analysis because fittingness is supposed to define value, but pragmatic reasons muddy the waters. For belief, the demon case might show we have pragmatic reasons to cause ourselves to believe, but not that these reasons make the belief justified in the epistemic sense. 

  The user might be missing that reasons can be of different kinds: justifying vs. requiring. Pragmatic reasons might require causing an attitude without making it fitting or justified. So for belief, a demon's threat gives a reason to bring about a belief state, but not an epistemic reason that justifies the belief's content. The advisor's "different problem" note probably points to this distinction between the structure of FA analysis versus the norms governing specific attitudes.

  I should explain why WKR is problematic for FA theories: they use fitting attitudes to define value, so if reasons from threats count as fittingness reasons, it distorts the analysis. But for belief, evidentialism is about the justification conditions specific to that attitude, not about value analysis. Even if FA theories have a WKR problem, it doesn't transfer directly to belief because belief has its own constitutive aim.

  Possible solutions for the user: one approach is to bite the bullet and accept pragmatism, but that's likely not their goal. Alternatively, refine FA to exclude WKRs, perhaps by appealing to the attitude's internal standards. For belief, maintain that only evidence can justify because belief's nature requires it. Emphasize the difference between having a reason to cause an attitude versus it being fitting or justified.

  The user needs to incorporate this into their chapter, so the explanation must be smooth and connected. Avoid jargon where possible, but since it's a PhD thesis, precision is key. Make sure to validate their concern—it's a real tension—but show why the responses exist. Highlighting the constitutive norms and the different projects (value theory vs. epistemology) should clarify the advisor's point.
answer: |-
  Your worry is astute and cuts to a deep tension in normative theory. The apparent similarity between the "wrong kind of reasons" (WKR) problem for fitting-attitude (FA) analyses of value and the challenge to evidentialism about belief is genuine, but the responses your advisor gestures towards—and the literature generally assumes—rely on crucial distinctions concerning the nature of the attitudes involved and the specific projects of value theory versus epistemology. Here’s a careful explanation of why the WKR problem is primarily a problem *for the analysis of value* rather than a straightforward vindication of pragmatism about belief, and how one might consistently accept the demon cases for FA while rejecting them for belief justification.

  The core of the WKR problem is that it threatens to collapse the very distinction FA analyses aim to capture: the difference between something being *valuable* (and thus *fitting* to value) and there being merely *instrumental reasons* to value it. The demon case exposes this: you have a decisive reason (avoiding torture) to admire the demon, but this reason doesn’t seem to make the demon *admirable*. If FA analyses cannot exclude such reasons as the "wrong kind" for determining fittingness (and thus value), they fail. The problem is *internal* to the FA project of defining value *in terms of* fitting responses. It asks: What constrains the "reasons" relevant to fittingness to be the *right kind* (RKRs)—reasons that speak to the *object's properties* making it worthy of the attitude? Solutions often involve appealing to the *nature of the attitude itself* (e.g., admiration is *constitutively* a response to perceived admirability) or to the *kind of reason* (e.g., reasons that are "object-given" rather than "state-given").

  Now, your challenge is this: If a demon can give you a decisive reason to *admire* her (a WKR), seemingly making admiration "justified" pragmatically in *some* sense, why can't a demon give you a decisive pragmatic reason to *believe* something, making belief pragmatically justified? Doesn't this show evidentialism is false? The crucial move to resist this conclusion lies in distinguishing between two things:

  1.  **The Generic Normative Force of "Reasons":** It is undeniable that in both cases, the demon gives you a powerful, *normatively significant* reason *to bring it about that you have the attitude*. You *should* (prudentially, perhaps morally) cause yourself to admire the demon or believe the proposition to avoid torture. This is a genuine normative reason to *cause* or *sustain* a mental state.
  2.  **The Constitutive Norms of Specific Attitudes:** However, not all attitudes are governed by the same constitutive norms. The *kind* of "justification" relevant to *holding* an attitude *as the attitude it is* depends on what that attitude *is*. Belief and admiration are fundamentally different kinds of mental states with different "directions of fit" and constitutive aims.

  *   **Belief** is widely held to be constitutively aimed at *truth*. Its standard of correctness is *factive*: a belief is correct only if it is true. The *justification* for *holding* a belief *as a belief* is therefore intrinsically tied to its likelihood of being true, i.e., to *evidence*. A pragmatic reason to cause yourself to believe P does not make the *content* of the belief (P) any more likely to be true. It provides a reason to *bring about the state of believing P*, but it does not provide a reason *for P* or *for the truth of P*. To hold a belief *on pragmatic grounds alone* is arguably to violate the constitutive norm of belief – it ceases to be a genuine belief in the full sense and becomes more like a pretense, an acceptance, or a pragmatic assumption. Evidentialism asserts that only considerations relevant to the truth of the content can *justify* the attitude *as a belief*. Pragmatic reasons justify *causing the belief-state*, not *holding the belief* in the sense governed by its truth-aim.
  *   **Admiration (as per FA):** Admiration, within the FA framework, is constitutively tied to the *recognition of value* (specifically, admirability). Its constitutive norm is *fittingness*: admiration is correct (fitting) when directed towards an admirable object. However—and this is key—*admiration is not constitutively tied to truth in the same way belief is*. While admiration might involve *beliefs* about properties (which *are* subject to evidential norms), the *evaluative response itself* (admiration) is not assessed as correct/incorrect based solely on whether those properties *exist* (truth), but on whether they *warrant admiration* (fittingness). The WKR problem arises precisely because FA analyses try to *define* value *in terms of* this fittingness norm. The demon case shows that reasons to cause admiration aren't necessarily reasons that make admiration *fitting*, exposing a potential gap in the analysis. Solutions aim to isolate the RKRs—reasons that bear on the *admirability-making properties* of the object.

  Therefore, the difference your advisor notes is this: The demon case for belief highlights a point about the *constitutive norm of belief itself* (truth/evidence). Accepting pragmatic reasons as justifying *belief* would require abandoning belief's core nature. The demon case for admiration, however, highlights a problem *for the attempt to use the fittingness norm of admiration to define value*. It doesn't necessarily show that admiration lacks a constitutive norm of fittingness; rather, it shows that *reasons to cause the attitude* are not always *reasons relevant to that norm*. Pragmatic reasons for admiration don't make admiration *fitting*, just as they don't make belief *true* or *evidentially justified*. They are reasons to *cause* a state that *has* its own internal standard.

  **Principled Acceptance of Both:**

  One can consistently hold:

  1.  **For FA Analysis of Value:** The demon case shows there are reasons to hold attitudes (like admiration) that are not reasons of the right kind for determining *fittingness* (and thus, by FA, *value*). This necessitates refining FA analyses to exclude WKRs (e.g., by appealing to the attitude's constitutive standard, or to reasons that are "object-given" or that would survive scrutiny from the perspective of the attitude itself). The demon's threat gives a reason to *cause* admiration, not a reason that makes the demon *admirable* or admiration *fitting*.
  2.  **For Belief Justification:** The demon case for belief gives a powerful pragmatic reason to *cause yourself to be in the state of believing* P. However, this pragmatic reason is irrelevant to the *constitutive norm* governing belief, which is truth. It does not provide *epistemic justification* for the belief that P. Only evidence for P's truth can do that. Belief remains constitutively subject to evidential norms. The pragmatic reason justifies *action* (self-manipulation) to bring about a belief-state, not the *doxastic stance* towards the content P itself.

  **What you might be missing:** The WKR problem is fundamentally a *metanormative* problem about *what constitutes value*. It arises within the specific project of defining value via fitting responses. Its demonstration that pragmatic reasons can exist for attitudes does *not* automatically transfer to undermine the *constitutive norms* of specific attitudes like belief, which are grounded in the *nature* of those attitudes. The "justification" relevant to the WKR debate for FA is "fittingness-justification" (relevant to defining value), while the justification relevant to the belief debate is "epistemic-justification" (tied to belief's truth-aim). Pragmatic reasons can provide *practical justification* for *causing* either state without providing *fittingness-justification* or *epistemic-justification* for *holding* the state according to its internal norm.

  In essence, the WKR problem is a discovery about the complexity of defining value through attitudes, revealing a need to filter reasons. It is *not* a discovery that all attitudes are fundamentally subject to pragmatic justification in the manner that would overthrow their constitutive aims. Pragmatism about belief requires the stronger claim that the constitutive aim of belief *is* pragmatic, or that its norm *can* be overridden. The WKR problem for FA doesn't establish this; it only shows that reasons to cause attitudes exist and complicate value analysis. One can acknowledge the normative force of the demon's threat as a reason for action (causing mental states) while steadfastly maintaining the autonomy of the distinct normative standards governing the correctness of belief (truth/evidence) and the fittingness of admiration (admirability) within their respective domains.
