  For each, I need to check if it supports the friend's shutdown in forecasting and physics. For example, the epistemic view might work for elections but not for QM, where many believe in objective chances. The strong subjectivist view that even QM probabilities are subjective would be radical and controversial.

  Also, consequences matter. If probability is only subjective, how do we justify calibration? De Finetti had the Dutch book argument and exchangeability, but the user's friend might be overreaching by dismissing all calibration. The user needs to point out that even under subjectivism, scoring forecasts against reality isn't confused because it updates beliefs, not compares to a "true probability."

  Another point: the bridge example. Is the 50% finesse chance objective or subjective? In card games, the probabilities can be seen as objective if we consider the physical deck, but subjectivists would say it's about information. However, under perfect information, the probability collapses to 0 or 1, which aligns with the subjectivist view.

  For physics, especially quantum mechanics, the friend's dismissal is more contentious. If they deny any objective chances in QM, that's a minority view. Most interpretations accept some form of objective probability in QM, even if not in a single-case propensity sense.

  The user also wants to know which interpretation de Finetti held. From his preface, he rejected objective probabilities entirely, including in physics. He thought QM probabilities were about our knowledge, not the system itself. So, he would likely endorse a strong subjectivist stance but might accept that frequentist probabilities emerge in collectives.

  I need to structure this as a clear list. Weakest to strongest, each with a description, defensibility, support for shutting down "true probability," support against physics chances, and consequences. Highlight where the friend's uses are supported or not, especially when the two contexts diverge.

