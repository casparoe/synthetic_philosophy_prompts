  1. **The Tortured Individual vs. Vast Happiness**
     - Scenario: Imagine a future world with trillions of beings living very content lives (say, 7 out of 10 on happiness). But there's one individual who is tortured (extreme suffering, -1000 out of 10) for the entire duration of this future. Would you choose to bring about this world?
       - (A) Yes, because the net happiness is overwhelmingly positive (trillions * 7 minus 1000 is still huge).
       - (B) No, because the extreme suffering of one outweighs any amount of positive happiness in others.

  2. **Stubbed Toes vs. Lifelong Agony**
     - Scenario: You have a magic button that can either:
          - Prevent one million people from experiencing a minor pain (a stubbed toe, which is -1 on a scale of suffering) OR
          - Cure one person of a condition that causes them lifelong agony (constant, severe pain, rated -1000).
       You can only press one button. Which do you choose?
       - (A) Prevent the million stubbed toes (because a million * -1 = -1,000,000, which is worse than -1000).
       - (B) Cure the lifelong agony (because the intensity of the suffering matters more than the aggregate of minor pains).

  3. **The Extinction Button**
     - Scenario: Suppose you are presented with a button that, if pressed, would painlessly and instantly extinguish all sentient life in the universe. This would guarantee that there would never again be any suffering above a very high threshold (like torture). However, it would also eliminate all current and future happiness. Would you press the button?
       - (A) Yes, because the elimination of all possibility of extreme suffering is worth the loss of all happiness.
       - (B) No, because the loss of all happiness and the extinction of sentient life is too great a cost, even to prevent future extreme suffering.

  4. **Aggregating Mild Pleasures vs. One Agony**
     - Scenario: Imagine you have to choose between two outcomes:
          - Outcome 1: One person experiences a short episode of extreme agony (say, -1000).
          - Outcome 2: A huge number of people (say, 10^100) each experience a tiny, barely noticeable pleasure (say, +0.0001, which is just above neutral). 
       Which outcome do you choose?
       - (A) Outcome 2: The aggregate pleasure is enormous (10^100 * 0.0001 = 10^96) and outweighs the one instance of agony.
       - (B) Outcome 1: No amount of such mild pleasure, no matter how many, can outweigh even one instance of extreme agony.

  5. **The Threshold Question**
     - Scenario: Consider a suffering level that is just below what you would call "extreme" (say, a severe migraine, rated -100). Could a sufficiently large amount of high pleasure (say, many people experiencing intense joy, +10 each) outweigh this suffering?
