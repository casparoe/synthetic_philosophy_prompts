       - (B) No, because suffering above a certain threshold (even if not the very top) is incommensurable with any amount of pleasure.

  6. **Preventing Future Suffering vs. Creating Present Happiness**
     - Scenario: You have resources to either:
          - Fund a project that will prevent a small chance (say 0.1%) of a future catastrophe causing extreme suffering to a million people, OR
          - Fund a project that will create a lot of happiness for a million people now (say, +5 each).
       Which do you choose?
       - (A) Fund the happiness project: because the expected suffering prevented (0.1% * 1,000,000 * extreme suffering) is small compared to the guaranteed happiness created (1,000,000 * 5).
