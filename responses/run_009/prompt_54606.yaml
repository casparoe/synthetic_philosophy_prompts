     - If Q1:B, Q2:B, Q4:B, Q7:B, and Q3:B, and Q5:A, Q6:B -> LTNU.

     - If Q1:A, Q2:B, Q3:B, Q4:A, Q5:A, Q6:B, Q7:A -> WNU.

     - If Q1:A, Q2:A, Q3:B, Q4:A, Q5:A, Q6:A, Q7:A -> CHU.

     Unoccupied combinations:

     - Pattern: B, B, B, B, A, B, A -> Incoherent, because they accept lexical threshold in Q1, Q2, Q4 but then in Q7 they prioritize the aggregate below-threshold suffering over an above-threshold suffering.

     - Pattern: B, B, B, A, A, B, B -> Incoherent, because they accept lexical threshold in Q1 and Q2 (so torture cannot be outweighed by any number of happy lives or minor pains) but then in Q4 they say mild pleasures can outweigh torture.

     - Pattern: B, B, A, B, A, B, A -> Incoherent for the same reason as above (Q7).

     - Pattern: B, B, A, B, A, B, B -> HLTNU (occupied).

     - Pattern: Q3:A and not (Q1:B and Q2:B and Q4:B and Q7:B)? For example, someone who answers Q3:A but also Q1:A. That would be: they want to press the extinction button, but they also think the world with one torture and vast happiness is acceptable? That's inconsistent. So incoherent.

     We'll also note that there might be other views, but these are the main ones.

     Finally, we write the quiz and the scoring key.

