  1. Classical Hedonistic Utilitarianism (CHU): Pleasure and pain are commensurable and aggregate linearly (or with diminishing returns, but no lexical thresholds). The goal is to maximize net pleasure.
  2. Weak Negative Utilitarianism (WNU): Suffering has priority (e.g., we should reduce suffering first) but ultimately all welfare is commensurable and aggregable. So, extreme suffering can be outweighed by enough mild pleasure, but it might require a lot.
  3. Lexical Threshold Negative Utilitarianism (LTNU): There exists a threshold of suffering (e.g., torture-level) which is lexically worse than any amount of pleasure. This suffering cannot be outweighed by any amount of pleasure below that threshold. However, below the threshold, suffering and pleasure are commensurable.
  4. Hard Lexical Threshold Negative Utilitarianism (HLTNU): The same as LTNU, but also accepts that if the only way to eliminate all suffering above the threshold is to painlessly extinguish all life, then that is the right choice.

  We also note that some answer combinations might be unoccupied because they are incoherent, unattractive, or unexplored.

