  ### Step 1: Re-deriving the Equilibria and Payoffs
  I'll re-derive the equilibria for both the uninformed and informed versions of your game, confirming your calculations step by step. The game has two players: an entrant (E) and an incumbent (I). Demand is strong (S) or weak (W) with probability \( \frac{1}{2} \) each. Payoffs are as you specified:
  - **Entrant's payoffs** (state-dependent, given as (S, W)):
    - Launch/Restrain: (12, -8)
    - Launch/Expand: (3, -1)
    - Shelve: (0, 0) in both states.
  - **Incumbent's payoffs** (state-independent):
    - Launch/Restrain: 4
    - Launch/Expand: 1
    - Shelve/Restrain: 6
    - Shelve/Expand: 12

  #### Uninformed Version (No Signal)
  - Neither player observes the state before moving; they move simultaneously.
  - **Entrant's decision**: E chooses between Launch and Shelve, with expected payoffs based on the incumbent's possible actions:
    - If I plays Restrain: E's expected payoff from Launch is \( \frac{1}{2}(12) + \frac{1}{2}(-8) = 6 - 4 = 2 \).
    - If I plays Expand: E's expected payoff from Launch is \( \frac{1}{2}(3) + \frac{1}{2}(-1) = 1.5 - 0.5 = 1 \).
    - Shelve always yields 0.
    - Thus, Launch gives 2 or 1 depending on I's action, both strictly greater than 0, so Launch strictly dominates Shelve. E always chooses Launch.
  - **Incumbent's decision**: Facing certain entry (since E always Launches), I compares:
    - Restrain: 4
    - Expand: 1
    - Since 4 > 1, I chooses Restrain.
  - **Equilibrium**: (E: Launch, I: Restrain).
  - **Entrant's expected payoff**: \( \frac{1}{2}(12) + \frac{1}{2}(-8) = 2 \).
  - **Incumbent's expected payoff**: 4.

  Your calculation of 2 for the entrant is correct.

  #### Informed Version (Entrant Learns State Privately)
  - E privately observes the state before moving; this is common knowledge. I does not observe the state and has state-independent payoffs, so no signal affects I.
  - Players move simultaneously after E observes the state.
  - **Entrant's strategy**: E has four pure strategies: Always Launch (AA), Never Launch (NN), Launch if Strong/Shelve if Weak (AS), or Shelve if Strong/Launch if Weak (SA). We evaluate these against I's possible actions.
    - Against Restrain:
      - AA: E gets \( \frac{1}{2}(12) + \frac{1}{2}(-8) = 2 \)
      - NN: E gets \( \frac{1}{2}(0) + \frac{1}{2}(0) = 0 \)
      - AS: E gets \( \frac{1}{2}(12) + \frac{1}{2}(0) = 6 \) (Launch in S, Shelve in W)
      - SA: E gets \( \frac{1}{2}(0) + \frac{1}{2}(-8) = -4 \) (Shelve in S, Launch in W)
    - Against Expand:
      - AA: E gets \( \frac{1}{2}(3) + \frac{1}{2}(-1) = 1 \)
      - NN: E gets 0
      - AS: E gets \( \frac{1}{2}(3) + \frac{1}{2}(0) = 1.5 \)
      - SA: E gets \( \frac{1}{2}(0) + \frac{1}{2}(-1) = -0.5 \)
    - AS dominates all others:
      - Against Restrain: AS (6) > AA (2), NN (0), SA (-4)
      - Against Expand: AS (1.5) > AA (1), NN (0), SA (-0.5)
    - Thus, AS ("launch iff strong") is strictly dominant for E. E plays AS in equilibrium.
  - **Incumbent's decision**: Facing AS, entry occurs only in the strong state (prob \( \frac{1}{2} \)).
    - If I plays Restrain:
      - In S: E Launches, I gets 4 (Launch/Restrain)
      - In W: E Shelves, I gets 6 (Shelve/Restrain)
      - I's expected payoff: \( \frac{1}{2}(4) + \frac{1}{2}(6) = 5 \)
    - If I plays Expand:
      - In S: E Launches, I gets 1 (Launch/Expand)
      - In W: E Shelves, I gets 12 (Shelve/Expand)
      - I's expected payoff: \( \frac{1}{2}(1) + \frac{1}{2}(12) = 6.5 \)
    - Since 6.5 > 5, I chooses Expand.
  - **Equilibrium**: (E: AS, I: Expand).
  - **Entrant's expected payoff**: With AS and I playing Expand, E gets \( \frac{1}{2}(3) + \frac{1}{2}(0) = 1.5 \) (3 in S from Launch/Expand, 0 in W from Shelve).
  - **Incumbent's expected payoff**: 6.5.

  Your calculation of 1.5 for the entrant (down from 2) is correct. The signal lowers E's payoff while raising I's.

  ### Step 2: The Argument and Where It Breaks
  Your argument is:
  1. **Good's theorem**: For a Bayesian agent in a fixed decision problem, a costless signal cannot lower maximal expected utility, as the agent can ignore it.
  2. **Decision problem in games**: A player in a game faces an ordinary decision problem where the co-player's behavior is part of the environment.
  3. **Signal properties**: Your signal is costless and about the state (not actions), so it should be covered by Good's theorem.
  4. **Conclusion for entrant**: E cannot be worse off with the signal, as she can ignore it and secure her uninformed payoff (2).
  5. **Contradiction**: E is worse off (1.5 < 2).

  The arithmetic is sound, so the flaw must be in the reasoning. I'll evaluate two candidate points of failure before settling on the core issue.

  #### Candidate 1: Step 2 (The Decision Problem Is Not Fixed)
  - **Why it might break**: Step 2 claims that from E's perspective, the game reduces to a fixed decision problem where I's behavior is part of the environment. However, in games, the co-player's behavior is endogenous to the information structure. When E gains the signal, it changes I's beliefs and actions in equilibrium (here, I switches from Restrain to Expand), altering the "environment." Thus, the decision problem E faces is not fixed—it depends on the information regime.
  - **Why it looked fine**: In non-strategic settings (lone decision makers), the environment (e.g., state distribution) is exogenous and fixed. It's intuitive to extend this to games by treating others' actions as part of a fixed background. But in equilibrium, others' actions respond to information, violating the "fixed" assumption.
  - **Verification in your game**: 
    - Uninformed: I plays Restrain, so E's "environment" includes I's action fixed at Restrain. E's optimal act (Launch) yields 2.
    - Informed: I plays Expand due to E's signal. If E ignores the signal and plays "always Launch" (AA), she might intend to replicate the uninformed choice, but I still plays Expand (because he knows E can condition), so E gets only 1 with AA, worse than 1.5 from AS. E cannot unilaterally force I to play Restrain; I best responds to the information structure.
    - Thus, when E ignores the signal, she cannot achieve the uninformed payoff because I's behavior has changed. Good's theorem requires a fixed environment, which games violate.

  #### Candidate 2: Step 4 (Ignoring the Signal Secures Uninformed Payoff)
  - **Why it might break**: Step 4 assumes that ignoring the signal allows E to achieve exactly the uninformed payoff (2). But in the informed game, "ignoring" means playing a state-independent strategy like AA, which may not yield the same payoff if I's equilibrium action differs. Here, with I playing Expand, AA gives E only 1, not 2. Even if E plays AA, it might not be a best response, and I might not play Restrain as in the uninformed case.
  - **Why it looked fine**: In a fixed decision problem, ignoring a signal lets you mimic your uninformed strategy. But in games, "mimicking" doesn't guarantee the same outcome because co-players adapt to the new information structure. The uninformed payoff (2) relies on I playing Restrain, which only happens in the uninformed equilibrium.
  - **Verification in your game**: 
    - In the informed game, if E plays AA and I plays Restrain, E could get 2. But this is not an equilibrium: if I plays Restrain, E prefers AS (yielding 6) over AA (2), so E would deviate. Similarly, if E plays AA, I would only play Restrain if he expects AA, but in equilibrium, he expects AS and plays Expand. E cannot unilaterally ignore the signal and force the uninformed outcome.

  #### The Core Breakdown: Step 2 is Flawed
  I reject **Step 2** as the primary failure. While Step 4 is also problematic, it derives from Step 2's incorrect assumption. Here's the detailed diagnosis:

  - **Why Step 2 is wrong**: In games, a player does not face a "fixed" decision problem because the information structure affects equilibrium behavior. Good's theorem assumes the decision problem (prior, acts, utilities) is unchanged when adding a signal. But here, adding the signal changes I's equilibrium action from Restrain to Expand, which alters the consequences of E's acts. Specifically:
    - Uninformed: E's feasible acts are {Launch, Shelve}, with utilities dependent on I's fixed Restraint.
    - Informed: E's feasible acts are strategies like {AA, NN, AS, SA}, with utilities dependent on I's new action (Expand).
    - The environment (I's behavior) is not part of a fixed background; it co-evolves with information. Thus, E's decision problem is not ordinary or fixed.

  - **What rejecting Step 2 costs**: It means Good's theorem does not directly apply to individual players in games. The theorem holds only when the decision problem is truly fixed, meaning no strategic interdependencies or when others' behaviors are invariant to information. In games, information has **strategic value**, which can be negative if it triggers adverse reactions (e.g., here, I becomes aggressive because E's signal reduces entry in weak states).

  - **Why other steps are less central**:
    - Step 1 (Good's theorem) is correct for non-strategic settings and should be kept.
    - Step 3 is true: your signal is costless and about nature, so if the environment were fixed, Good's theorem would apply.
    - Step 4 fails as a consequence of Step 2: ignoring the signal doesn't secure the uninformed payoff because I's behavior changes.
    - Step 5 is empirical and correct.

  ### Step 3: Implications for Good's Theorem and Information Policy
  #### What Survives of Good's Theorem
  Good's theorem remains valid for **lone decision makers** or **fixed environments**. However, in strategic settings:
  - **Scope limitation**: The theorem assumes the decision problem is fixed. In games, adding information changes the game form, so the decision problem isn't fixed. Value of information (VoI) must be redefined in equilibrium terms.
  - **Redefining VoI in games**: VoI for a player is the difference in their equilibrium payoffs between the informed and uninformed games. It can be positive, negative, or zero, as your game shows (E's VoI is -0.5).
  - **When VoI is non-negative**: In games, VoI can still be non-negative if:
    - The information is private (not common knowledge), reducing strategic responses.
    - Others' payoffs or actions are unaffected by the signal (e.g., if I had no strategic reason to change).
    - The player can commit to ignore it (but commitment may not be feasible).

  #### The "Never Turn Down Free Information" Policy
  - **In non-strategic settings**: The policy holds strictly under Good's theorem. A lone decision maker should always accept costless information, as it weakly increases expected utility (ignoring dominates rejecting).
  - **In strategic settings**: The policy does not hold universally. Information can lower a player's payoff due to **informational externalities**:
    - **Adverse reactions**: As in your game, others may act against the informed player's interests (I expands to exploit reduced entry).
    - **Signaling effects**: Even costless, non-strategic information can signal intentions, changing behavior.
    - **Policy implication**: Players should turn down free information if:
      - It is common knowledge and likely to provoke harmful responses.
      - The information has low intrinsic value but high strategic cost (e.g., in zero-sum games).
      - Example: In your game, E should reject the signal if possible, as it lowers her payoff from 2 to 1.5.

  ### Final Thoughts
  Your paradox arises from applying a non-strategic result (Good's theorem) to a strategic setting. The flaw is in Step 2: games violate the "fixed decision problem" assumption because co-players' behaviors are equilibrium-dependent. The cost is that Good's theorem cannot be naively extended to games; VoI must be analyzed through equilibrium comparisons. Your game is a canonical example of how information can have negative private value in strategic contexts—a key insight for your dissertation. I recommend exploring extensions like hidden information acquisition or commitment to ignore signals, but your core result stands: free information isn't always beneficial in games. If you keep Good's theorem (as you prefer), stress its non-strategic domain in your chapter.
