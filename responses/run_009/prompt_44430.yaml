prompt: |-
  I lead the user research team at a company that builds a health-tracking app, and I've become uneasy about how much of our evidence about users consists of their own explanations of themselves. Our findings routinely hinge on questions like why someone abandoned an onboarding flow, what made them distrust a permissions screen, whether they would use a proposed feature, and how a red notification badge made them feel. My product leads treat the answers as windows directly into users' minds, and honestly, so did I for a long time. But I've read enough psychology to know the field has been skeptical of this for decades: the old Nisbett-and-Wilson worry that when people explain why they did something they are reporting a plausible theory about themselves rather than observing an inner process; experiments where people confidently justify choices they never actually made; the general finding that reports about one's own motives track what a person thinks would make sense of them. At the same time, I don't want to overcorrect into dismissing everything users tell us. It seems like some introspective reports are in much better shape than others -- say, what just passed through my mind a second ago versus why my mind did what it did over the past week -- and I can't run a lab, so I need the distinction usable in a conference room.

  Please turn the philosophy and psychology of introspection's reliability into a decision procedure my team can actually run each time they design or interpret one of these self-report questions. My team has no psychology background, sessions and surveys run weekly, and whatever survives has to fit in a one-page summary that product leads will actually read, so it needs to be a short ordered list of questions with clear stopping points: what to ask about a proposed or collected self-report, what counts as a sufficient answer, where the procedure concludes that the report shouldn't be used as evidence at all (or only with an explicit caveat attached), and where it should hand the call back to a human because the issue is a judgment about stakes or product context rather than something the literature settles. I'd like the distinctions that actually matter to survive the translation -- for instance, reporting a just-completed experience versus reconstructing one after a delay, reporting what was in mind versus why the mind did it, characterizing a specific episode versus a general disposition, whether the person could have arrived at the answer by observing their own behavior and circumstances rather than by looking inward, and whether the way we elicited the report could have planted the very state or explanation being reported. But you should decide which distinctions earn their place in a ten-minute procedure and which belong in a footnote, and say so. Also please be explicit about where the procedure will misfire -- in particular, questions about preferences and feelings for which we have no behavioral substitute, where a skeptical procedure would leave us with no evidence at all.

  Then run the procedure on three cases from our recent work: (a) a think-aloud session where users are asked, immediately after completing a task, why they hesitated on a particular screen; (b) a cancellation exit survey sent three days after a user downgraded their subscription, asking them to select and explain their reasons; (c) a focus group shown a mockup of a proposed privacy dashboard and asked whether they would use it and why. Include at least one case where the procedure tells us to downweight findings that are vivid, unanimous, and that everyone on the product side loved. I'd rather know now where my own habits of interpretation fail than after we've shipped something on the strength of them.
reasoning: |-
  We are designing a decision procedure that evaluates the reliability of self-report data. The procedure must be concise, fit on a one-page summary, and be usable by a team without psychology background. The goal is to flag when self-reports are likely unreliable and when they can be used (with or without caveats).

  Key psychological principles to incorporate:
  1. **Immediacy**: Reports about very recent experiences (e.g., within the last few seconds) are more reliable than those about the past.
  2. **Content**: Reports about the contents of consciousness (e.g., "I felt confused") are more reliable than reports about the causes of behavior or mental states (e.g., "I hesitated because the button was too small").
  3. **Specificity**: Reports about a specific, concrete episode are more reliable than generalizations about habits or dispositions.
  4. **Behavioral vs. Introspective**: If the user could have arrived at the answer by observing their own behavior or the environment (rather than introspection), it's less reliable.
  5. **Leading Questions**: If the question might have planted the answer, the report is compromised.

  We'll create a decision tree with clear stopping points. The procedure will be a list of questions to ask about each self-report method or collected response. Each question will have a clear "yes/no" answer and lead to a conclusion.

  **Decision Procedure: "The Introspection Reliability Check" (IRC)**

  *Run this procedure for each self-report question (or set of related questions) in your research.*

  1. **Question 1: Is the self-report about a mental event that occurred within the last 10 seconds?**
     - *Why?*: Very recent experiences are less subject to reconstruction and memory errors.
     - *Yes*: Proceed to Question 2.
     - *No*: Proceed to Question 3.

  2. **Question 2: Is the self-report about the *content* of a mental state (e.g., "I saw", "I heard", "I felt", "I thought about X") rather than the *cause* of that state?**
     - *Why?*: People are better at reporting what was in their mind than why it was there.
     - *Yes*: **Reliable**. Use without major caveats. (But note: even content reports can be incomplete.)
     - *No*: **Unreliable for cause**. Flag: "User's explanation for cause may be a reconstruction. Treat as hypothesis, not fact."

  3. **Question 3: Is the self-report about a specific, concrete episode (not a generalization)?**
     - *Why?*: Generalizations are often based on theories of self rather than actual recall.
     - *Yes*: Proceed to Question 4.
     - *No*: **Unreliable for accuracy**. Flag: "This is a generalized self-report and may reflect beliefs rather than specific experiences. Use with caution, especially for causal claims."

  4. **Question 4: Could the user have answered this question by observing their own behavior or the external circumstances (without needing introspection)?**
     - *Example*: "Why did you abandon the onboarding?" -> User might infer from the environment (e.g., "it was too long") without knowing the actual mental cause.
     - *Why?*: If the answer is based on observable facts, it's not truly introspective and might be a post-hoc story.
     - *Yes*: **Unreliable for mental causes**. Flag: "Response may be based on inference from behavior/environment, not introspection. Treat as hypothesis."
     - *No*: Proceed to Question 5.

  5. **Question 5: Is the question about a feeling, preference, or intention that is currently active (i.e., at the time of reporting)?**
     - *Why?*: Current states are directly accessible, while past states are reconstructed.
     - *Yes*: **Reliable for current state**. Use with minor caveat: "Self-report of current state, but may change or be influenced by context."
     - *No*: **Unreliable for past state**. Flag: "Past feelings/preferences are reconstructed. Use as indicative of user's current belief about the past, not as a record of the past."

  **Special Note on Leading Questions**:
     - If at any point the question posed to the user was leading (e.g., "Did the confusing layout make you hesitate?") or suggested an answer, then regardless of the above, mark the response as **Compromised by leading question**. Flag: "Response may reflect suggestion rather than genuine experience. Do not use as evidence for the suggested state."

  **Hand-off to Human Judgment**:
     - If the research question is about stakes, product priorities, or requires contextual knowledge (e.g., "How important is this feature to our business goals?"), then the IRC is not applicable. The procedure is for evaluating the reliability of self-reports about mental states.

  **Where the Procedure Misfires**:
     - For questions about *current* preferences, feelings, or intentions, we have no good behavioral substitute. The procedure will mark current self-reports as reliable (with caveats), but note that even these can be influenced by context and question framing. However, without behavioral data, we must rely on them.
     - The procedure might be too strict for some practical purposes. In such cases, the team should note the caveats and triangulate with other data.

  **Summary of Flags**:
     - **Reliable**: Use as is (with minor caveats if noted).
     - **Unreliable for cause**: Do not use to infer causality; treat as a hypothesis.
     - **Unreliable for accuracy**: The report may be a reconstruction or theory; use with extreme caution.
     - **Compromised by leading question**: The response is likely influenced by the researcher; do not use as evidence for the suggested state.

  Now, run the procedure on the three cases:

  **Case (a): Think-aloud session where users are asked, immediately after completing a task, why they hesitated on a particular screen.**
     - Q1: Is the report about a mental event within the last 10 seconds? 
       - *Answer*: The hesitation just happened, so likely within 10 seconds? **Yes** -> Proceed to Q2.
     - Q2: Is it about content or cause? 
       - The question is "why" (cause), so **No**. 
       - **Conclusion**: Unreliable for cause. Flag: "User's explanation for why they hesitated may be a reconstruction. Treat as hypothesis, not fact."
     - *Note*: Even though immediate, asking for "why" (cause) makes it unreliable. The user might report a plausible reason (e.g., "the button was small") but that might not be the actual cause.

  **Case (b): Cancellation exit survey sent three days after a user downgraded their subscription, asking them to select and explain their reasons.**
     - Q1: Within last 10 seconds? **No** (it happened days ago) -> Q3.
     - Q3: About a specific episode? **Yes** (the cancellation event) -> Q4.
     - Q4: Could the user have answered by observing behavior/circumstances? 
       - *Answer*: **Yes**. The user might recall the circumstances (e.g., "I was laid off", "I saw a cheaper alternative") without knowing the precise mental causes. They might also reconstruct reasons that make sense.
       - **Conclusion**: Unreliable for mental causes. Flag: "Response may be based on inference from behavior/environment, not introspection. Treat as hypothesis."
     - *Note*: This is a case where the product team might love vivid, unanimous reasons (e.g., "80% said pricing was too high"), but the procedure flags it as a reconstruction. We should downweight these findings and look for behavioral data (e.g., when did they cancel? after a price increase?).

  **Case (c): Focus group shown a mockup of a proposed privacy dashboard and asked whether they would use it and why.**
     - The question has two parts: (1) whether they would use it (future intention) and (2) why (cause).
     - For part 1: "Would you use it?"
       - Q1: Within 10 seconds? The mental state (intention) is current. **Yes** -> Q2.
       - Q2: Content or cause? "Would you use it?" is about a current intention (content). **Yes** -> **Reliable** for current intention (with caveat that intentions may not predict behavior).
     - For part 2: "Why?" (the reason for their intention)
       - Q1: Within 10 seconds? The intention is current, but the reasons might be reconstructed. The question is about the cause of the current intention. **No** (because the cause is not necessarily a current mental event) -> Q3.
       - Q3: Specific episode? No, it's about a future hypothetical. **No** -> **Unreliable for accuracy**. Flag: "This is a generalized self-report and may reflect beliefs rather than specific experiences. Use with caution, especially for causal claims."
     - *Note*: The focus group setting might also lead to groupthink. Additionally, the "why" part is doubly unreliable: it's about a future hypothetical and about causes.

  **Highlighting a case for downweighting vivid findings**:
     - In case (b), the cancellation reasons are vivid and might be unanimous (e.g., "price too high"), and the product side might love it because it's clear. But the procedure flags it as unreliable for mental causes. We should not take the stated reasons at face value but treat them as hypotheses and look for other evidence (e.g., did a price change correlate with cancellations?).

  **Final Note**:
  The procedure is a guide. It might err on the side of caution. In practice, self-reports can still provide valuable insights when triangulated with other data. Always ask: "What behavioral data could we collect to complement this?"
answer: |-
  ### Decision Procedure: Introspection Reliability Check (IRC)  
  *A 5-minute checklist for evaluating self-report questions/responses. Use per question or survey item.*  

  #### Step 1: **Timing**  
  **Ask:** *Did the user report on an experience within 10 seconds of it occurring?*  
  - **Yes** → Proceed to Step 2.  
  - **No** → Flag: "Risk of reconstruction." Proceed to Step 3.  
  *Why?* Memories decay rapidly; delays invite plausible storytelling (Nisbett & Wilson).  

  #### Step 2: **Content vs. Cause**  
  **Ask:** *Is the user reporting WHAT they felt/saw/thought (content) or WHY it happened (cause)?*  
  - **Content** (e.g., "I felt confused") → **Reliable**. Use with low caution.  
  - **Cause** (e.g., "I hesitated because of X") → Flag: "High reconstruction risk." Proceed to Step 4.  
  *Why?* People accurately report conscious content (e.g., "I saw a red badge") but invent causes for behavior.  

  #### Step 3: **Specificity**  
  **Ask:** *Is the user describing a SPECIFIC moment (e.g., "yesterday’s login") or a GENERAL pattern (e.g., "I usually…")?*  
  - **Specific** → Proceed to Step 4.  
  - **General** → **Unreliable**. Stop. Flag: "Belief-based, not introspective."  
  *Why?* Generalizations reflect folk theories, not observed mental events.  

  #### Step 4: **Observability**  
  **Ask:** *Could the user have answered this by observing their own behavior or environment?*  
  - **Yes** (e.g., "I left because the screen was cluttered") → **Unreliable for mental states**. Stop. Flag: "Post-hoc inference."  
  - **No** (e.g., "I felt anxious") → Proceed to Step 5.  
  *Why?* If the answer is inferable (e.g., counting clicks), it’s not introspection.  

  #### Step 5: **Leading Influence**  
  **Ask:** *Could the question have planted the answer?* (e.g., "Did the red color make you anxious?")  
  - **Yes** → **Compromised**. Stop. Flag: "Response likely suggested."  
  - **No** → **Conditionally reliable**. Use with caution + triangulation.  

  #### Final Outputs  
  - **Reliable**: Use as direct evidence (rare; mostly immediate content reports).  
  - **Flagged**: Use with caveats (specify the flag).  
  - **Unreliable/Compromised**: Discard or treat as weak hypotheses.  
  - **Handoff to Human**: When stakes/context outweigh reliability (e.g., "Is this critical for compliance?").  

  **Where IRC Misfires**:  
  - For preferences/feelings *with no behavioral alternative* (e.g., "How much do you value privacy?"), IRC may flag them as unreliable—but you must use them cautiously. Over-reliance here is a necessary evil; mitigate with triangulation.  

  ---

  ### IRC Applied to Your Cases  

  #### Case (a): Think-aloud session, asked immediately why they hesitated  
  1. **Timing**: Yes (within 10 sec). → Proceed.  
  2. **Content vs. Cause**: "Why?" = **Cause**. → Flag: High reconstruction risk.  
  3. **Specificity**: Specific moment. → Proceed.  
  4. **Observability**: "Why hesitated?" → Likely **Yes** (e.g., they see a button). → **Unreliable for mental states**. Flag: "Post-hoc inference."  
  5. **Leading**: Unlikely if neutral phrasing.  
  **Verdict**: **Unreliable for causality**. Treat as hypothesis; *not* a mental truth.  
  *Why?* User invents reasons for hesitation (e.g., "The button was small") that may not match real drivers.  

  #### Case (b): Cancellation exit survey (3-day delay), select & explain reasons  
  1. **Timing**: No (3-day delay). → Flag: Reconstruction risk.  
  2. **Content vs. Cause**: "Reasons for leaving" = **Cause**. → Flag: High reconstruction risk.  
  3. **Specificity**: Specific (cancellation event). → Proceed.  
  4. **Observability**: **Yes** (e.g., "Price too high" inferable from billing). → **Unreliable for mental states**. Flag: "Post-hoc inference."  
  5. **Leading**: Depends on options (e.g., if survey lists "price," it plants ideas).  
  **Verdict**: **Unreliable**. Downweight findings even if vivid/unanimous.  
  *Downweight Example*: If users unanimously cite "price," it may reflect a socially plausible excuse (not the real trigger). Behavioral data (e.g., usage drop pre-cancellation) is better evidence.  

  #### Case (c): Focus group on privacy mockup, "Would you use this? Why?"  
  1. **Timing**: No (future hypothetical). → Flag: Reconstruction risk.  
  2. **Content vs. Cause**:  
     - "Would you use?" = **Current intention (content)** → **Reliable** for *present* intent.  
     - "Why?" = **Cause** → Flag: High reconstruction risk.  
  3. **Specificity**: General/hypothetical. → **Unreliable** for "why."  
  4. **Observability**: "Why?" → **Yes** (e.g., "It looks useful" based on mockup). → **Unreliable for mental states**.  
  5. **Leading**: High risk (group dynamics, moderator phrasing).  
  **Verdict**:  
  - "Would you use?" → **Conditionally reliable** (but intentions ≠ behavior).  
  - "Why?" → **Unreliable**. Discard or treat as weak hypothesis.  

  ---

  ### Key Takeaways for Your Team  
  - **Trust**: Immediate content reports (e.g., "I felt X now").  
  - **Distrust**: Causal explanations, delayed/general reports, inferable answers.  
  - **Mitigate**: Triangulate with behavioral data (e.g., clicks, session recordings).  
  - **Product Impact**: Flagged evidence can inform hypotheses—but never drive decisions alone. Share flags in summaries (e.g., "User reasons are post-hoc inferences").  

  **Your Habits Alert**: In case (b), you previously treated cancellation reasons as truth. IRC reveals this as a reconstruction trap—a common over-reliance on vivid stories. Use behavioral logs (e.g., feature usage pre-cancellation) to test stated reasons.  

  ---  
  *One-Page Summary Available: [IRC_Quick_Reference.pdf] (imaginary link for your team)*
