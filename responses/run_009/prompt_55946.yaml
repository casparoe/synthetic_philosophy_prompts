prompt: |-
  So I'm a software engineer, definitely no physics or philosophy training beyond pop-science youtube, but I fell down a rabbit hole last weekend about why time only seems to run in one direction even though (I gather) the fundamental laws work pretty much the same forwards and backwards. The explanation I keep running into is: the universe happened to start out in an extremely low-entropy state just after the big bang, entropy has been climbing ever since, and that entropy gradient is what gives time its direction.

  Here's what's bugging me though. I also keep reading that right after the big bang, everything was a super hot, dense, almost perfectly smooth soup of particles and radiation sitting at basically the same temperature everywhere — i.e., thermal equilibrium. And from my one thermodynamics course in college, equilibrium is MAXIMUM entropy. That's like the entire point of the second law, systems evolve toward equilibrium and stop changing. So if the early universe was already at equilibrium, it was already at (or near) max entropy, and there was no room left for entropy to grow into. How can cosmologists then turn around and call that same state "extremely low entropy"? That looks like a straight contradiction to me.

  And if the low-entropy part is wrong, doesn't the whole story about the arrow of time being inherited from a special low-entropy initial condition kind of collapse? It feels like the explanation is built on a mistake that everyone just repeats to each other. I assume I'm the one making the mistake somewhere and not every physicist since Boltzmann, so set me straight. Please answer in American English btw, I got a reply somewhere else full of "colour" and "whilst" and it was wierd lol.
