  ### Lottery Design and Session Structure

  #### **Prize Formula and Parameters**
  - **Prize function**: The prize awarded is \( P(T) = \frac{k}{T} \), where \( T \) is the total number of entries submitted by all players, and \( k \) is a constant.
  - **Expected value for player \( i \)**:
    \[
    \text{EV}_i = \frac{x_i}{T} \times \frac{k}{T} = k \cdot \frac{x_i}{T^2}
    \]
    Here, \( x_i \) is the number of entries submitted by player \( i \), and \( T = \sum_{j=1}^{12} x_j \). The cost per entry is **zero** (no monetary cost to submit entries).

  - **Key properties**:
    - **(a) Dominance pulls upwards**: For fixed \( S_i \) (sum of others’ entries), \( \text{EV}_i \) is maximized when \( x_i = S_i \). This is derived from calculus: the derivative of \( \text{EV}_i \) w.r.t. \( x_i \) is zero at \( x_i = S_i \), and it’s a maximum.
    - **(b) Symmetric outcome dominates arms race**: If all submit 1, \( T = 12 \), and each player’s \( \text{EV}_i = k / 144 \). In the Nash equilibrium (all submit 0), \( \text{EV}_i = 0 \), which is worse. If players "arms-race" (e.g., all submit \( x \)), best-response dynamics drive entries to 0.

  - **Parameter choices**:
    - **Group size**: 12 players. Small enough for interaction, large enough for strategic complexity.
    - **Constant \( k = 144 \)** (in voucher units).  
      - **Why 144?** When all submit 1:
        - Prize \( P(12) = 144 / 12 = 12 \) units.
        - Each player’s expected value: \( \frac{1}{12} \times 12 = 1 \) unit.
      - **Voucher stakes**: Set 1 unit = £0.50 (so symmetric outcome gives expected £0.50 per player). Total prize fund scales with \( T \):
        - If \( T = 1 \), prize = £72.00 (impractical, but theoretically clean).
        - If \( T = 12 \), prize = £6.00.
        - **Why vouchers?** Cash raises ethical issues; bookshop vouchers (cleared with department) are "real but not too real" — stings enough to incentivize, but avoids large payouts.
      - **Defense**: \( k = 144 \) ensures integer arithmetic for transparency. Symmetric outcome gives exactly 1 unit EV, making comparisons intuitive. Scaling to £0.50/unit keeps departmental costs low (max £36 if one player wins with \( T = 1 \), but this is unlikely).

  ---

  ### **Session Structure**  
  *Total time: 90 minutes. Rules are read aloud; submissions are secret and nonnegative integers.*

  #### **Stage 1: Cold Round (10 mins)**  
  - Players submit initial entries silently.  
  - **Facilitator collects \( x_i \), computes \( T_{\text{round1}} = \sum x_i \), and reveals only \( T_{\text{round1}} \)**. Do not reveal individual submissions.

  #### **Stage 2: Discussion and Resubmission (20 mins)**  
  - Open discussion: Players can talk freely (but promises are unenforceable). Focus: "What should we do?"  
  - After discussion, players resubmit secretly.  
  - **Facilitator computes \( T_{\text{round2}} \), reveals it, and pays out one voucher** (e.g., £6.00 if \( T_{\text{round2}} = 12 \)).  
    - *Payment now adds stakes and makes Stage 3 salient.*

  #### **Stage 3: Symmetry-Stipulated Round (25 mins)**  
  - **Mechanism to inject symmetry**: "The lottery pays out only if the total entries \( T \) exactly match a sealed prediction \( T^* \), written by a randomly selected player during Stage 2."  
    - \( T^* \) is sealed in an envelope during Stage 2 (random player writes it privately).  
    - Players submit entries. If \( T = T^* \), prize \( P(T) = 144 / T \) is awarded. If \( T \neq T^* \), no prize.  
  - **Why this works**:  
    - Fixes the symmetry premise: Each player’s belief about \( T^* \) depends on their own choice (since they are symmetric to the predictor).  
    - Creates common knowledge: "If I expect others to match, I should match."  
    - *Debrief note*: This stage artificially induces the correlation superrationality requires. Players feel the "vertigo" of evidential reasoning.

  #### **Stage 4: Binding Vote and Final Round (20 mins)**  
  - Vote: "Should we cap entries at 3 per player? Majority wins, binding for final round."  
  - Players submit final entries under the cap (if passed).  
  - **Payout**: Prize awarded based on final entries.  
  - **Post-vote discussion**: "Why did you vote as you did? Fear of defection, or belief that your reason was everyone’s reason?"  

  ---

  ### **Debrief Script (15 mins)**  
  *Map the experience to decision theory, then reveal historical context.*

  1. **Dominance and the arms race**:  
     - "In Stage 1, your EV formula \( \text{EV}_i = k \cdot x_i / T^2 \) made it rational to submit \( x_i = S_i \) (others’ total). This pulls entries upward — a feedback loop. But where does it stop? At 0, the Nash equilibrium."  
     - Numerical example:  
       - Suppose others submit sum \( S_i = 5 \). Your optimal \( x_i = 5 \).  
       - If all do this, \( x \) spirals down: if others play \( x \), you play \( 11x \), so \( x = 11x \) only if \( x = 0 \).  
     - **Whiteboard verification**:  
       - If all submit 1: \( \text{EV}_i = 144 \cdot 1 / 12^2 = 1 \).  
       - If one player submits 11, others submit 1:  
         \( T = 11 + 11 \cdot 1 = 22 \),  
         \(\text{EV}_{\text{deviant}} = 144 \cdot 11 / 22^2 = 3.27\),  
         \(\text{EV}_{\text{others}} = 144 \cdot 1 / 22^2 \approx 0.30\).  
       - Nash: all 0, \(\text{EV} = 0\). Pareto inferior to symmetric outcome.

  2. **Superrationality and symmetry**:  
     - "Stage 3 forced you to treat your choice as evidence about identical players. This is Hofstadter’s superrationality: if all reason identically, your choice determines others’ choices."  
     - "But in a room of friends, common knowledge of rationality fails — you know others might not ‘get it’. That’s why discussion devolved into collusion."

  3. **What couldn’t be replicated**:  
     - "A reading group isn’t a population of strangers. Symmetry was *stipulated* in Stage 3, not organic. Superrationality requires *actual* correlation, but here it’s facilitator-fiat."  
     - "What you discovered: the tension between individual dominance (upward pull) and group Pareto efficiency (symmetric 1)."

  4. **Reveal historical context**:  
     - "This is a classroom analogue of Hofstadter’s Platonia Dilemma and Luring Lottery. In those, a prize is structured so rational pursuit drains it — a paradox of rationality."

  ---

  ### **Predicted Pitfalls and Handling Instructions**  
  - **Absurdly large submissions** (e.g., 10,000 in Stage 1):  
    - *Why*: Misunderstanding EV (thinks \( \text{EV}_i \propto x_i \)).  
    - *Handle*: Clarify formula; remind that EV drops as \( T \) grows. If disruptive, cap entries at 50 (but avoid if possible).

  - **Abstentions** (submitting 0):  
    - *Why*: Protest or Nash play.  
    - *Handle*: If \( T = 0 \) in payout round, award nothing. Explain: "Nash is possible, but you collectively lost the prize."

  - **Discussion round collapses into collusion**:  
    - *Why*: Friends trust each other.  
    - *Handle*: Allow it! Then debrief: "Did collusion hold? Why/why not? This mirrors real-world coordination in small groups."

  - **Stage 3 symmetry fails**:  
    - *Why*: Players doubt others’ rationality.  
    - *Handle*: Ask: "What did you assume about the predictor? Did you feel your choice controlled theirs?"

  ---

  ### **Facilitator’s Role: Fiat vs. Discovery**  
  - **Fiat-driven**:  
    - Symmetry in Stage 3 (players don’t organically correlate; it’s forced).  
    - Costless entries (no sunk-cost effect; pure strategy).  
  - **Discovery-driven**:  
    - The arms-race tension (felt in rising entries).  
    - Pareto inefficiency of Nash (symmetric 1 has higher EV than 0).  
    - The fragility of collusion (Stage 2 discussion).  
  - **Crucial disclaimer**:  
    > "Superrationality isn’t ‘proven’ here. It’s a thought experiment. What you experienced was the *logic* of evidential reasoning in a controlled setting. Real-world applications (e.g., climate pledges) need enforceable symmetry."

  This design balances mathematical clarity, psychological engagement, and pedagogical honesty. The group leaves with visceral insight into Newcomb-like tensions between dominance and cooperation.
