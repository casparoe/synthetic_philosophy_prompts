  The prize is a function of the total pool T. We want the prize to shrink as T grows. Specifically, we want two properties:

  (a) For each player, given the sum of the others' entries (denoted S_i = T - x_i), the expected value for player i is maximized when x_i is approximately equal to S_i (which is the total of the other 11 players). This will create a force that pulls everyone's numbers upwards.

  (b) If everyone submits 1 (so T = 12), then the expected value for each player is high, and higher than in any outcome that results from an arms race (i.e., when T becomes very large).

  Let the prize when the total pool is T be P(T). Then the expected value for player i is:
    EV_i = (x_i / T) * P(T) - c * x_i

  Note: We are charging a cost per entry. We can set the cost c to be 1 unit (say, one dollar or one voucher unit) per entry. Then the net expected value is:
