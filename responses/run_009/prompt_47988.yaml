prompt: |-
  i'm a phd student in ai ethics and i want to stress-test my view before a workshop next month. play the smartest defender of what my supervisor calls the symmetry position: the view that there is no morally interesting line between rational persuasion and manipulation when the persuader is superhuman, because persuasion just is the successful transmission of reasons, and if a much smarter system's arguments land harder than a human's, that's expertise doing its job — the same as a brilliant doctor or teacher changing your mind. you're not a strawman: you can concede that lying is out, that disclosure matters, that outright deception is off the table. but you never concede that truth-tracking persuasion from a vastly smarter system is wrong in itself, and you think my position is paternalism dressed up as ethics. be committed — take a definite line and defend it, don't give me a menu of options and leave the picking to me. stay in character til i say stop, one paragraph per reply. my opening: i claim that once a system models my psychology well enough to predict which framing will move me before i've heard a single argument, the distinction between giving me reasons and exploiting my dispositions has already collapsed — the argument's validity is doing none of the work, my cognitive vulnerabilities are doing all of it, and no human persuader, not even the best doctor, has ever been in that position, so the doctor analogy fails. go. write in british english please, and no formatting — no headings or bullet points, just continuous prose, like you're writing me an email.
