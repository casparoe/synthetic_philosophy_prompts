answer: |-
  ### (1) Exam Question  
  **Question 5 (20 marks)**  
  You are to evaluate the following theory of valid consent:  
  **The Deliberative Risk Theory (DRT)**: Consent is invalid if and only if it was obtained in circumstances that predictably caused the consenter to run risks she would not have accepted after calm, fully informed deliberation.  

  Apply DRT to these cases:  
  **(a)** A surgeon truthfully discloses all surgical risks to a patient but falsely claims a 95% success rate (actual rate: 70%). The patient consents.  
  **(b)** A patient requires immediate life-saving surgery. Due to the emergency, she has only 5 minutes to decide. With no manipulation by anyone, she consents under severe time pressure.  
  **(c)** *Threat Scenario*: Alex agrees to sell their car to Blair for $1 after Blair threatens to reveal Alex’s secret criminal record.  
  *Offer Scenario*: Casey agrees to sell their identical car to Dana for $1 after Dana (a stranger) spontaneously offers Casey $10,000 to do so.  

  **Tasks**:  
  1. For each case (a)–(c), state whether DRT invalidates consent and whether this seems *morally correct*. Briefly justify (∼50 words/case).  
  2. Diagnose *where and why* DRT diverges from the best traditional account (using deception in (a) to show the gap between *wronging* and *invalidating consent*, and the threat/offer pair in (c) to expose the problem of *baseline dependence* in coercion).  
  3. *Either* propose a repair to DRT *or* defend the traditional triad against DRT.  

  *(90 minutes suggested)*  

  ---

  ### (2) Model Answer (720 words)  
  **Part 1: Case Judgments**  
  *(a) Deception*: DRT likely *validates* consent. The exaggeration may not alter *risks* (truthfully disclosed) but distorts perceived benefits. A rational agent might still accept the same risks with accurate success rates. Yet consent feels invalid—the surgeon wronged the patient by lying. **Verdict**: DRT incorrect.  
  *(b) Emergency*: DRT *invalidates* consent. Time pressure predictably causes rash risk-taking (e.g., ignoring alternatives). This aligns with intuition: consent under duress is suspect. **Verdict**: DRT correct.  
  *(c) Threat*: DRT *invalidates* consent. Blair’s threat alters Alex’s baseline (no exposure → exposure), pushing Alex to accept a bad deal they’d reject calmly. **Verdict**: DRT correct.  
  *Offer*: DRT *validates* consent. Dana’s offer creates a new benefit; Casey wouldn’t reject free money calmly. But consent seems valid—Casey gains without prior entitlement. **Verdict**: DRT correct.  

  **Part 2: Diagnosis**  
  DRT fails where traditional accounts succeed because it conflates two distinct mechanisms for invalidity:  
  - **Option-set manipulation vs. belief distortion**: The threat/offer pair in (c) reveals DRT’s blindness to *how options are altered*. Coercion traditionally invalidates consent by *wrongful constraint* (Blair’s threat imposes a new harm), while offers expand options without wronging. DRT treats both as “risk-distorting” but misses why threats (unlike offers) undermine autonomy by *imposing illegitimate baselines*.  
  - **Wronging ≠ Invalidating**: Case (a) shows DRT conflating *moral harm* with *invalidity*. Traditional accounts hold that deception *wrongs* the patient but doesn’t necessarily invalidate consent if beliefs about core risks/benefits are intact. DRT’s focus on “predictable risk distortion” cannot isolate when deception voids consent (e.g., lying about surgery’s *nature* vs. incidental details).  

  **Part 3: Defense of Traditional Account**  
  I defend the traditional triad (deception/coercion/incompetence) against DRT. DRT’s core flaw is reducing consent’s validity to *deliberative outcomes* rather than *procedural fairness*. Validity should turn on whether the agent’s choice was made with adequate epistemic access and free from *wrongful interference*.  
  - **Coercion**: The threat/offer distinction hinges on *baseline wrongfulness*. Blair’s threat violates Alex’s right to non-interference; Dana’s offer violates none. DRT cannot capture this, as "risks not accepted calmly" applies to both.  
  - **Deception**: Invalid consent requires *material deception* (distorting intrinsic features of the act). The surgeon’s lie in (a) is immoral but immaterial if risks were clear; consent stands. DRT overreaches by invalidating whenever lies cause suboptimal choices.  
  - **Structural purpose**: The triad’s mechanisms protect autonomy differently: coercion guards against *forced choices*, deception against *ignorant choices*. DRT flattens these into a generic "poor deliberation" metric, losing precision.  

  **Conclusion**: DRT usefully highlights deliberation’s role but cannot replace the traditional account. The triad’s structure—tying invalidity to specific *wrongs* (fraud, force)—better protects autonomy by flagging *procedural violations*, not just suboptimal outcomes.  

  ---

  ### (3) Marking Scheme (20 marks total)  
  | **Points**                                                                                                | **Marks** | **Common Mistake**                                                                 |
  |----------------------------------------------------------------------------------------------------------|-----------|-----------------------------------------------------------------------------------|
  | **1. Correct DRT application to (a), (b), threat (c), offer (c)** (State verdict + moral intuition)      | 4         | Missing counterintuitive DRT validation in (a)/offer (c) or misapplying risk test |
  | **2. Distinguish mechanisms**: Deception (beliefs) vs. coercion (options) in diagnosis                   | 5         | Treating all cases as “manipulation” without differentiating causal pathways      |
  | **3. Baseline analysis**: Use threat/offer pair to show DRT ignores *wrongful option restriction*        | 4         | Claiming both scenarios "distort risks" without addressing baseline legitimacy    |
  | **4. Wronging/invalidation gap**: Use (a) to show DRT conflates moral harm with consent invalidity       | 4         | Equating deception’s wrongfulness with automatic invalidity                       |
  | **5. Coherent repair/defense**: Fix DRT’s mechanism gap *or* defend triad’s structural superiority       | 3         | Superficial repair (e.g., “add exceptions”) or vague triad defense                |

  ---

  ### Closing Note  
  **Fairness & Efficacy**: I am highly confident this question is fair (tests core concepts, not trivia) and that the marking scheme separates analytical depth (A: mechanism distinction) from rote recall (B: generic "manipulation"). The model answer is defensible, as debates about procedural vs. outcome-based validity are live in the literature.  

  **Hesitation**: The **5 marks for mechanism distinction (Point 2)** may be overly stringent. Students often struggle to articulate "beliefs vs. options" clearly, and able answers might conflate them subtly without fully missing the point. However, this distinction is the *core philosophical insight* demanded, so I retain high weighting despite potential harshness.
