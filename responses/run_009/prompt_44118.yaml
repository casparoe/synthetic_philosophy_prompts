  #### Consensus and Disputes in Population Ethics
  - **Settled knowledge**: Classical TU entails the repugnant conclusion (a world with vast numbers at barely positive welfare can be best), and AU is sensitive to population size in counterintuitive ways. Both are rejected by your friend's verdicts.
  - **Genuinely contested**: Whether to accept or resist the repugnant conclusion is debated. CLU and TV are both resistant and align with "person-affecting" intuitions, but they differ in how they value low-welfare lives. CLU is a standard alternative in the literature, but TV has adherents. No consensus exists on the "correct" rule.
