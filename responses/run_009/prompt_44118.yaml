     - Binding: \( 45 < t < 60 \). For example, \( t = 50 \) fits all verdicts.

  **Key Observations**:
  - Both CLU and TV fit the five verdicts, but they rely on different mechanisms: CLU subtracts a critical level \( c \) from each life's welfare, while TV ignores lives below a threshold \( t \).
