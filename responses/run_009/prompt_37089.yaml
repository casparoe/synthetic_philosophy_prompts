prompt: |-
  I manage collections care at a maritime museum, and my work keeps forcing a distinction on me that I cannot find a name for. It concerns the conditions under which a thing counts as the same thing after its parts have been replaced — but not, I think, the usual version of that question. What I keep noticing is that those conditions seem to differ systematically by category of thing, and to be settled in practice by communities of people rather than by anything in the objects themselves.

  Concretely: when we plan a major restoration, the curatorial team debates what proportion of original fabric a vessel must retain to be exhibited under its historic name rather than labeled a reconstruction, and the number we can live with differs between a wooden hull, a riveted iron hull, and a small craft where the lines matter more to us than the material. Meanwhile, the volunteer fire brigade in my town still refers to its personnel carrier as the 1972 engine even though nothing of 1972 remains but the registration plate, and nobody considers that fraudulent; but if I stood a newly built boat next to a two-hundred-year-old hull and labeled the new one as the original on the grounds that it carried on the name, I would be dismissed, and rightly. Bands keep their names after every founding member has left; restaurants survive changes of owner, chef, building, and cuisine, with the regulars carrying the continuity; yet a painting restored beyond a certain point is quietly reclassified. The same physical facts — total or near-total replacement of matter, continuity of name — are treated differently depending on what kind of thing the object is and on who is doing the treating. And in the clearest case, the law, this administration is fully explicit: a corporation persists through total turnover of its members, and the statute simply says so.

  So what I am after is a concept for this layer: the category-relative, community-administered persistence rules that sit above whatever the metaphysical facts turn out to be. I know the neighborhood is the Ship of Theseus, but as I understand it, that debate is about which of two material continuities wins — the gradually repaired body or the reassembly of the discarded planks — and my question is prior to it: what settles which continuity conditions a thing is subject to in the first place, why those conditions vary by category, and why it falls to a community to apply and occasionally revise them. A friend with a philosophy degree muttered the word sortals at me when I described this, but could not say whether the fit is exact, and I have gathered that some philosophers hold the sterner view that any replacement of a part destroys the thing — which is plainly not what museums, fire brigades, or band names are doing. There is also a further feature I would want the concept to capture: the disputes feel substantive to us — labels, grants, and careers turn on them — even though I suspect the underlying rules are conventions we could have set differently. I would like to know whether that appearance of substance is an illusion, or whether a convention can still be applied correctly or incorrectly in a way that makes disagreements about it genuine rather than verbal.

  Is there an established concept, term, or body of work for identity conditions of this administered, category-relative sort? If there is, please relate it carefully to the nearest neighbors — sortals, the classical Ship of Theseus problem, and the coarse idea that some things are socially constructed — and say where the fit is loose. If nothing established covers it, coin a term, define it, and trace its boundary cases: does it include nations and languages, or only entities like vessels, bands, and corporations, where the administering community has a recognizable membership? And at what point does the administering community lose its authority — when everyone who cared has died, or before that? A bare label will not help me; what I need is a map of the phenomenon's edges, so I can tell which of our museum's disputes are substantive disagreements about the object and which are merely confusion about which convention we are applying.
reasoning: |-
  Okay, let me start by unpacking the user's query. They manage collections at a maritime museum and are grappling with how different categories of objects have varying criteria for identity after parts are replaced. The key point is that these criteria depend on the object's category and are decided by communities, not the objects themselves. 

  First, I need to understand their core question. They want a term or concept for these community-administered, category-specific persistence rules. They mentioned sortals and the Ship of Theseus but feel those don't quite fit. Sortals deal with identity conditions per category, but the user is focused on how communities enforce and vary these rules. The Ship of Theseus is a metaphysical debate, whereas the user sees the rules as prior and socially determined.

  The user provided examples: ships vs. fire engines vs. bands. A ship's identity is tied to original material percentage, while a fire engine keeps its identity with just the registration plate. Bands and restaurants persist through total member or location changes. This variation by category and community is central. 

  They also want to know if disputes over these rules are substantive. Even though the rules are conventions, disagreements affect labels, grants, careers. So, is there real correctness here, or is it all arbitrary? 

  Looking into philosophy, I recall John Searle's institutional facts. He talks about status functions assigned by collective intentionality—like money or property. That seems relevant. Amie Thomasson's artifact theory also fits, as artifacts depend on creator intentions and social practices. 

  The term "Persistence Convention" comes to mind. It captures the communal agreement aspect. But I need to define it clearly, distinguishing it from sortals (which are the categories themselves) and social construction (which is broader). 

  Boundary cases: Nations and languages. Nations might fit as they rely on collective recognition, but languages are trickier. If a community dissolves, does the convention lose authority? Probably, once the relevant community ceases to exist or care. 

  The user needs to differentiate substantive disputes from conventional ones. If two curators agree on the convention but disagree on material percentage, that's substantive. If they're applying different conventions, that's confusion. 

  Also, the Ship of Theseus problem assumes fixed criteria, but here the criteria themselves are flexible. Highlighting that distinction is key. 

  I should structure the response: introduce the concept, define it, compare to existing terms, address boundary cases, and explain how disputes can be substantive within a convention. Make sure to tie it back to their museum work, giving them a framework to analyze their debates.
answer: |-
  This is a profound and beautifully articulated observation about the nature of identity in practice. You're right that standard metaphysical debates (like the Ship of Theseus) often assume fixed criteria for persistence *within* a category, while your core insight is that **the criteria themselves are category-relative, community-defined, and administratively applied.** There isn't one universally perfect term, but the best established *conceptual framework* for this is **Institutional Identity** or **Status-Functional Persistence**, drawing heavily on the work of philosopher **John Searle** on **institutional facts** and **collective intentionality**.

  Here's a breakdown, mapping it to your needs:

  1.  **The Core Concept: Institutional Identity / Status Persistence**
      *   **Definition:** The persistence of an entity's identity over time, despite material change, is determined by the **collective acceptance** of a relevant community that the entity continues to fulfill a specific **status function** assigned to it, according to rules (often implicit) recognized by that community for that category of thing.
      *   **Key Elements:**
          *   **Status Function:** The purpose, role, or value assigned *to* the entity *by* the community. (e.g., "The historic vessel *Cutty Sark*," "The town's 1972 fire engine," "The Rolling Stones," "The corporation XYZ Corp," "The painting *Starry Night*").
          *   **Constitutive Rules:** The (often unwritten, context-dependent) rules the community uses to determine when the status function persists through change. These rules *define* what counts as persistence for that status in that context. ("If >X% original hull material remains, it's still *Cutty Sark*"; "If the registration plate is transferred, it's still the '1972' engine"; "If the founding charter is maintained and shareholders recognize continuity, it's still XYZ Corp"; "If the artist's original creative intent remains materially dominant, it's still *Starry Night*").
          *   **Collective Intentionality:** The shared belief or acceptance *by the relevant community* that the rules apply and that the entity continues to hold the status. This is the "administered" part.
          *   **Category-Relativity:** The constitutive rules differ fundamentally based on the *kind* of status function involved (historic artifact vs. functional tool vs. artistic creation vs. commercial entity vs. cultural group). The rules derive from what the community values in *that type* of thing.

  2.  **Relation to Neighboring Concepts:**
      *   **Sortals:** Sortals are the *categories* themselves ("ship," "fire engine," "band," "painting," "corporation"). They *imply* persistence conditions. **The fit is close but not exact.** Traditional sortal theory often treats the persistence conditions as inherent to the *concept* itself (metaphysically fixed). Your insight (and Searle's) shows that the *application* of those conditions – the specific rules defining "same ship," "same band," etc. – is socially administered and can vary even within a broad sortal category (e.g., "ship" has different rules for a historic wooden hull vs. a modern functional ferry). Sortals provide the framework; institutional identity explains how the framework is *populated with specific, operational rules* by communities.
      *   **Ship of Theseus (Classical Problem):** This problem assumes there *is* a single, correct, metaphysical answer about persistence conditions for "the ship" (e.g., spatiotemporal continuity vs. original material). **Your question is indeed prior:** It asks *what determines which set of persistence conditions (spatiotemporal, material, functional, intentional) even applies to this particular thing in this context?* The Ship of Theseus debate happens *within* a presumed set of criteria; you're highlighting that the *choice* of which criteria are relevant is settled institutionally, by the community for that category. The puzzle often ignores that "ship" can mean different things (historic relic vs. functional vessel) demanding different criteria.
      *   **Social Construction:** This is a broad umbrella. Institutional identity is a *specific mechanism* of social construction. It explains *how* identity is constructed: through the assignment and collective maintenance of status functions via constitutive rules. Not all social constructions work exactly this way (e.g., gender norms are more diffuse), but entities like corporations, artworks, historic artifacts, and named institutions are *paradigm cases* of institutional construction. The "administered" aspect is key – it's not just diffuse belief, but rule-governed assignment and maintenance by a specific community.

  3.  **Addressing the "Substance" of Disputes:**
      *   Searle argues that once the constitutive rules for a status function are established (even implicitly) within a community, they create "deontic powers" – real obligations, permissions, entitlements, and responsibilities. Calling something "the original *Cutty Sark*" vs. "a reconstruction" isn't *just* descriptive; it carries normative weight (exhibition status, funding eligibility, historical significance, professional reputation, public trust).
      *   Therefore, **disputes are substantive:** They are disagreements about the *correct application of the community's own constitutive rules* to the specific case, or sometimes about *what the constitutive rules actually are* for that category in that context. Is 15% original fabric sufficient *given our museum's established standards for historic wooden ships*? Does replacing the lead singer and all members mean it's no longer "The Band X" *according to the conventions of the music industry and fan base*? These have real consequences (labels, grants, careers, authenticity claims).
      *   **It's not an illusion, nor purely verbal:** While the *underlying rules* might be contingent (we *could* have chosen different thresholds), once established, applying them correctly matters. Disagreements are genuine when they concern the facts of the object relative to the rules ("Does it meet the 20% threshold?"), or the interpretation of the rules themselves ("Does 'original fabric' include replaced timbers using original methods?"). They become merely verbal *only* if participants are using the *same* rules but miscommunicating, or if they are *fundamentally* talking about different categories/conventions without realizing it.

  4.  **Boundary Cases & Scope:**
      *   **Nations:** Fit well. A nation's persistence relies heavily on collective recognition (domestic and international) of its governing institutions, continuity of legal system, territorial claims (even if borders shift), and often a narrative of historical continuity, despite complete turnover of population, government personnel, and physical changes to the land. The constitutive rules are complex and contested, but clearly institutional.
      *   **Languages:** More complex. Linguists often define language identity based on mutual intelligibility and grammatical structure (more "objective" but fuzzy). However, the *status* of a language (e.g., "French," "Mandarin") and its continuity through radical change (Old -> Middle -> Modern English) involves strong institutional elements: standardization by academies, education systems, literary traditions, and collective speaker identity. The *label* and perceived continuity are institutionally maintained, even if the underlying linguistic facts change.
      *   **Community Requirement:** The administering community *must* have some form of recognition or authority over the status function. For a museum artifact, it's the curatorial profession, donors, and the public. For a band, it's the music industry, fans, and remaining members. For a fire engine, it's the fire brigade and the town.
      *   **Loss of Authority:** Authority dissipates when:
          *   The **relevant community ceases to exist** or **ceases to care** about the status function (e.g., a forgotten band; a corporation dissolved and its records lost).
          *   **Consensus completely breaks down** within the community with no mechanism for resolution.
          *   **External power** forcibly imposes a new status (e.g., conquest renaming a nation; a court order dissolving a corporation).
      *   **Does death end it?** Not necessarily. Historians and institutions *become* the relevant community for maintaining the status function of historical entities (ships, artifacts, figures, defunct corporations for legal purposes). Authority transfers. It only truly ends when *all* communities with a claim or interest vanish, which for significant historical/cultural entities might be never.

  **Practical Application for Your Museum Disputes: The Identity Audit**

  To distinguish substantive disagreements from conventional confusion:

  1.  **Identify the Status Function:** What is the valued status? (e.g., "Authentic historic vessel *HMS Pinafore*," "Representative example of a 19th-century whaling boat").
  2.  **Identify the Administering Community:** Who defines the rules? (Curators? Maritime historians? Donors? The public? Government heritage bodies? All of the above?)
  3.  **Articulate the Constitutive Rules (Explicit or Implicit):** What are the *current, recognized* criteria within your institution/profession for persistence of *this specific status* (historic vessel vs. representative example)? What % material? What parts are critical? Is design intent paramount? What documentation is required? (Consult past precedents, professional guidelines, institutional policies).
  4.  **Analyze the Dispute:**
      *   **Substantive Disagreement (About the Object/Rules):** Do parties agree on (1-3) but disagree on whether the *object meets the criteria* (e.g., "Is this timber original?" "Does replacing this component violate the 'lines matter most' rule for small craft?")? Or do they disagree on the *interpretation* of an existing rule (e.g., "Does 'original fastenings' include replaced ones using original methods?")? These are substantive.
      *   **Conventional Confusion (About the Convention):** Do parties disagree fundamentally on *which status function* is primary (e.g., "Is this valued primarily as *the specific historic vessel* or as *a functional replica*?")? Or are they applying *different constitutive rules* without realizing it (e.g., one curator uses "major structural timbers" %, another uses "any original material" %)? This is confusion about which convention applies. Resolution requires clarifying (1-3) first.

  **In essence, you've identified the operational layer of "institutional ontology."** The persistence isn't in the planks or the paint; it's in the collectively maintained *status* assigned to the object according to category-specific rules. Understanding this framework provides the map you need to navigate the very real, consequential, and often fascinating disputes over what counts as the "same" thing in the complex world of cultural heritage and institutional life.
