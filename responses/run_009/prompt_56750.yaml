answer: |-
  Below are the desiderata for an adequate theory of genetic information, grounded in the phenomena you've specified and essential biological realities. Each requirement is motivated by empirical evidence or conceptual necessity, with explicit notation of non-negotiables versus potentially contentious assumptions. Key tensions and tripwires are flagged.

  ---

  ### **Desiderata for an Adequate Theory of Genetic Information**

  1. **Accommodate Molecular Implementation**  
     *Requirement*: The theory must account for the **physical realisation of the codon–amino acid mapping** via tRNA, aminoacyl-tRNA synthetases, and ribosomes.  
     *Motivation*: The mapping isn't abstract; it's materially instantiated by evolvable macromolecules.  
     *Status*: **Non-negotiable**. Neglecting this reduces the code to mysticism.  

  2. **Explain Degeneracy Without Semantic Loss**  
     *Requirement*: Must clarify why **multiple codons specify the same amino acid** without implying "redundancy = noise" or functional hierarchy among synonymous codons.  
     *Motivation*: Degeneracy buffers against mutation and enables codon usage biases (e.g., for translational efficiency), yet all codons for an amino acid are equally "meaningful".  
     *Status*: **Non-negotiable**. A theory failing this misrepresents evolutionary dynamics.  

  3. **Reconcile Near-Universality with Deviations**  
     *Requirement*: Must explain the **code’s conservation across most life** while allowing **lineage-specific variants** (e.g., in mitochondria or ciliates).  
     *Motivation*: Universal common descent implies an ancient, stable mapping, yet isolated changes occur. A theory must avoid implying the code is either immutable or infinitely malleable.  
     *Status*: **Non-negotiable**. Empirical fact demands both stability and limited plasticity.  

  4. **Function Without a Coder**  
     *Requirement*: The theory must **operationalise "coding" without invoking an intentional agent, designer, or "coder"**.  
     *Motivation*: Biological processes are undirected. Analogies to human-made codes (Morse, ASCII) falter here.  
     *Status*: **Non-negotiable**. Smuggling in intentionality is a category error.  

  5. **Support Transposability & Substrate Independence**  
     *Requirement*: Must justify how **DNA sequences can be expressed across species/kingdoms** (e.g., jellyfish GFP in bacteria) despite differences in cellular context.  
     *Motivation*: Gene function often transfers with codon optimisation, implying the mapping’s logic is separable from its material base.  
     *Status*: **Non-negotiable**. Cornerstone of genetic engineering.  

  6. **Incorporate Non-Coding Regulatory Elements**  
     *Requirement*: Must encompass **genomic regions that regulate expression** (e.g., promoters, enhancers) without conflating "information" solely with protein-coding sequences.  
     *Motivation*: Most eukaryotic DNA is non-coding but functional. Ignoring regulation reduces the theory’s scope.  
     *Status*: **Non-negotiable**. Omits key genome biology if absent.  

  7. **Arbitrariness vs. Constraint**  
     *Requirement*: Must clarify whether the codon–amino acid mapping is **arbitrary (contingent but fixed) or constrained** (by chemistry, evolution, or error minimization).  
     *Motivation*: The code appears arbitrary (e.g., different codons for same amino acid), but its universality and error-minimising properties suggest constraints.  
     *Status*: **Contentious**. *Arbitrariness is incidental, not essential*: a theory need not demand it if constraints explain the mapping.  

  8. **Semantic vs. Shannon Information**  
     *Requirement*: Must specify whether genetic "information" is **semantic (contentful, about something) or correlational/Shannonesque**.  
     *Motivation*: DNA sequences correlate with outcomes (Shannon), but also specify functions (semantic). Regulatory elements lack clear "meaning" yet are informational.  
     *Status*: **Pivotal tension**. A theory *shouldn’t presuppose semantics*; adequacy hinges on explanatory power.  

  9. **Causal Efficacy of DNA as Molecule**  
     *Requirement*: Must reconcile DNA’s **causal-dispositional properties** (e.g., shape, charge, binding affinity) with its role as an "information carrier".  
     *Motivation*: DNA physically interacts with proteins/RNA; reduction to chemistry alone ignores coding robustness, while ignoring chemistry ignores mechanism.  
     *Status*: **Non-negotiable**. Dichotomising "molecule vs. code" is false.  

  ---

  ### **Key Tensions & Tripwires**
  - **Unsatisfiable Triad?**  
    Full arbitrariness + evolutionary origins + universality **cannot coexist**. If the mapping is *evolved*, it is not arbitrary (it’s constrained by selection, chemistry, or historical contingency). Universality implies stabilising selection, further negating arbitrariness.  
    **→ Resolution**: Drop "arbitrariness" as essential; admit constrained contingency.  

  - **The Major Tripwire**: **Requirement #4 (no coder)**.  
    Popular "intentionalist" positions (e.g., intelligent design) fail here. Conversely, overly reductionist views (e.g., "DNA is *just* a polymer") skirt #4 but stumble on #5 (transposability) and #2 (degeneracy).  
    **Why omitted elsewhere**: Critics of the "code metaphor" often ignore transposability (#5), allowing them to dismiss semantics. Proponents of "real codes" downplay #9 (causal efficacy).  

  ---

  ### **Scorecard: Three Theories Tested**
  *(In British English, as requested)*  

  1. **Bare Causal-Dispositional Account** (DNA as "smoke to fire")  
     *Fails*: #2 (degeneracy as noise?), #5 (no transposability), #8 (no semantics for coding). Treats DNA as a mere correlational signal, ignoring mapping logic. *Passes*: #9 (causal efficacy).  

  2. **Arbitrary Mapping sans Coder**  
     *Fails*: #7 (arbitrariness vs. constraint—evolution *does* constrain the code), #8 (semantics unexplained). Handles #5 (transposability) well but struggles with #3 (universality’s evolutionary basis).  

  3. **Teleosemantics** (meaning = selected function)  
     *Fails*: #2 (degeneracy—synonymous codons need not differ in selected function), #6 (regulatory elements’ "meaning" is nebulous). *Passes*: #4 (no coder), #3 (evolutionary basis). Treats DNA as semantic but risks overextension.  

  ---

  ### **Conclusion**
  An adequate theory must be **non-intentionalist, substrate-flexible, and mechanistically grounded**. The core tension lies in reconciling causal molecular details with robust, transposable function—a false dichotomy if the mapping is seen as an evolved, *physically realised* constraint. **Arbitrariness is a red herring**; what matters is that the mapping is *contingent but stabilised*. Shannon information is necessary but insufficient: the genetic code’s "aboutness" stems from its evolved causal role in specifying functional outcomes, not intentionality. The desiderata jointly support a view where DNA is both a chemical entity *and* an information carrier, with "coding" emerging from evolved molecular interactions.
