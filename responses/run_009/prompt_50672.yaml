prompt: |-
  My housemate and I have been having a running argument about anthropic reasoning for like two weeks now and it's gotten a bit out of hand — we spent most of a dinner party last friday interrogating our poor guests about hypothetical copies of themselves. The core thing we're stuck on is the dispute between the self-sampling assumption (reason as if you're a random sample from the observers in your reference class) and the self-indication assumption (additionally weight hypotheses in proportion to how many observers they predict, so that existing at all is evidence for hypotheses involving more observers). He thinks SIA is obviously right because it neatly neutralizes the doomsday argument, and he does a little smug face when he says it. I think SIA has its own absurdity, since it seems to license the presumptuous philosopher move where you can become near-certain of a theory purely because it says there are vastly more observers, without ever looking at the world. We keep going in circles.

  Rather than continue yelling across the kitchen, I want a second opinion with actual structure. Give me your honest credence that SIA is the right way to handle anthropic evidence, but more importantly decompose it: e.g., the probability that indexical evidence like "here I am" can legitimately confirm or disconfirm non-indexical hypotheses at all, the probability that the presumptuous-philosopher conclusion is actually unacceptable (as opposed to weird but true), the probability that the reference class / measure problem even has a principled solution rather than just being a parameter you fiddle with to get whatever answer you wanted, and any other sub-questions you think belong in there. Give each a number with a one-line justification, then combine them, and tell me which term the final credence is most sensitive to.

  And then, since my housemate is the kind of person who will absolutely ask: what concrete argument or thought experiment would move your number the most in either direction? Not just "more philosophy papers," something specific. If it helps you understand where we're each coming from: my credence in SIA is maybe 0.35 and his is around 0.8, and I suspect our real disagreement is less about the assumptions themselves and more about whether the doomsday argument's conclusion is independently plausible or not — but I'd like your read on where two people with those numbers most likely disagree.
