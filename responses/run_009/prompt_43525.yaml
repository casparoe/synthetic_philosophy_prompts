  **Case 1: The matchbox in the dark**

  - Prior: P(on table) = 0.5
  - After grope: we have a shift in our credence about the veridicality of the feeling (V: veridical, not V: not veridical)
    - Q(V) = 0.80, Q(not V) = 0.20
  - If V is true, then the box is on the table (so P(on table | V) = 1).
  - If not V, then we are back to 50/50 (so P(on table | not V) = 0.5).
  - By Jeffrey conditioning:
      Q(on table) = P(on table|V)*Q(V) + P(on table|not V)*Q(not V)
                 = 1*0.80 + 0.5*0.20 = 0.80 + 0.10 = 0.90

  This matches the user's verdict of 0.90.

