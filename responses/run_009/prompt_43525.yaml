  We are going to test the updating principles on the six cases. The principles we consider are:

  A. **Bayesian Conditioning (Conditioning on Evidence)**: 
     - We condition on a proposition E that we become certain of.
     - Posterior P(H|E) = P(E|H) * P(H) / P(E)

  B. **Jeffrey Conditioning** (for when the evidence shifts our credences over a partition without making us certain of any particular proposition):
     - We have a partition {E1, E2, ..., En} and we get new credences Q(Ei) for each element of the partition.
     - Then for any hypothesis H, the posterior is: 
          Q(H) = sum_i P(H|Ei) * Q(Ei)
     - This requires that the partition is such that P(H|Ei) remains unchanged by the update.

  C. **Other possibilities?** The user's slogan: "all uncertain evidence is really certain evidence about my own experience". We might try to model each case by conditioning on a detailed proposition about the experience.

