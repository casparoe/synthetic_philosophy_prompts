  ### Fresh Case: Hearsay Through Two Links
  - **Setup**: 
    - Hypothesis \(H\): Source claim is true.
    - Prior \(P(H) = 0.50\) (symmetric).
    - Chain: Source → Link 1 → Link 2 → You.
    - Each link has reliability \(r = 0.80\) (i.e., \(P(\text{report } H \mid H) = P(\text{report } \neg H \mid \neg H) = 0.80\)).
    - Reports are independent given the source.
    - You hear Link 2 assert \(H\) (certain of this assertion).

  - **Principle**: Plain conditioning on Link 2's assertion (\(L_2\)).
    - We need \(P(H \mid L_2)\).
    - **Model the chain**:
      - \(P(L_2 \mid H) = P(L_2 \mid L_1, H) \cdot P(L_1 \mid H)\) + \(P(L_2 \mid \neg L_1, H) \cdot P(\neg L_1 \mid H)\).
        - Given \(H\), \(P(L_1 \mid H) = 0.80\) (Link 1 reports truth).
        - \(P(L_2 \mid L_1, H) = 0.80\) (Link 2 reports Link 1's report truthfully).
        - \(P(L_2 \mid \neg L_1, H) = 0.20\) (Link 2 lies if Link 1 lied).
        - Thus: \(P(L_2 \mid H) = (0.80 \times 0.80) + (0.20 \times 0.20) = 0.64 + 0.04 = 0.68\).
      - Similarly, \(P(L_2 \mid \neg H) = P(L_2 \mid L_1, \neg H) \cdot P(L_1 \mid \neg H)\) + \(P(L_2 \mid \neg L_1, \neg H) \cdot P(\neg L_1 \mid \neg H)\).
        - Given \(\neg H\), \(P(L_1 \mid \neg H) = 0.20\) (Link 1 lies), \(P(\neg L_1 \mid \neg H) = 0.80\).
        - \(P(L_2 \mid L_1, \neg H) = 0.80\) (Link 2 truthfully reports the lie).
        - \(P(L_2 \mid \neg L_1, \neg H) = 0.20\) (Link 2 lies about the truth).
        - Thus: \(P(L_2 \mid \neg H) = (0.80 \times 0.20) + (0.20 \times 0.80) = 0.16 + 0.16 = 0.32\).
    - \(P(L_2) = P(L_2 \mid H) P(H) + P(L_2 \mid \neg H) P(\neg H) = (0.68 \times 0.50) + (0.32 \times 0.50) = 0.50\).
    - \(P(H \mid L_2) = (0.68 \times 0.50) / 0.50 = 0.68\).

  - **Result**: 0.68 credence in \(H\).  
    - Note: Direct report from source would give 0.80. Each link degrades reliability.

