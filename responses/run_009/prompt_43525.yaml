      P(A | not resigned) = 0.20
  - We condition on A (because we are certain that the colleague asserted it).
  - Posterior: 
      P(resigned | A) = [P(A | resigned) * P(resigned)] / [P(A)]
      P(A) = P(A | resigned)*P(resigned) + P(A | not resigned)*P(not resigned)
            = 0.90 * 0.25 + 0.20 * 0.75 = 0.225 + 0.15 = 0.375
      P(resigned | A) = (0.90 * 0.25) / 0.375 = 0.225 / 0.375 = 0.60

