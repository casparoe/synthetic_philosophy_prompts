  ### Conclusion
  - **Single principle?** **No, verdicts fragment**.  
    - Cases 1, 2, 4 (first update), and 5 work with **plain conditioning** on experience propositions.
    - Case 3 requires an **ad hoc model** (e.g., weighted average) because likelihoods are missing.
    - Case 4 (second update) is a **model correction**, not standard updating.
    - Case 6 uses a **heuristic** (override with superior evidence), not derived from conditioning.
  - **Slogan test**:  
    - **Succeeds** in Cases 1, 2, 4, 5: Uncertain evidence reduces to plain conditioning when experiences are properly described (e.g., assertions, tactile feels).  
    - **Fails** in Cases 3 and 6:  
      - Case 3: No likelihoods for expert credences.  
      - Case 6: No general rule for overriding evidence; conditioning on joint experiences requires unavailable likelihoods.  
    - Jeffrey conditioning is **redundant** when plain conditioning applies (Case 2) and **coincidental** in Case 6.
  - **Recommendations**:  
    - **Surrender** the verdict in **Case 3** as non-principled (it's a heuristic average).  
    - **Accept** **Case 6**'s verdict as pragmatic but not general (it relies on evidence hierarchy).  
    - **Keep** other verdicts: They are consistent with plain conditioning and model corrections.  
  - **Key insight**: The line between Cases 5 and 6 is **evidence independence**.  
    - In Case 5 (two colleagues), evidence is independent given the hypothesis, so updates compound.  
    - In Case 6 (two perceptions), evidence is dependent (same sensory system), so no compounding—later, better evidence overrides. This isn't gerrymandering; it's a consequence of dependence and reliability hierarchy.

  Your approach is insightful: Plain conditioning suffices when evidence propositions are precise and likelihoods known. Jeffrey conditioning handles coarser uncertainty but doesn't add new power. Cases 3 and 6 expose limitations where either likelihoods are missing (Case 3) or evidence dependence dominates (Case 6).
