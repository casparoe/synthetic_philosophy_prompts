     6. Bullet-biting (from synchronic)

     But we can combine the two bullet-biting leaves into one: "Deny confirmation by old evidence (bullet-biting)"

     So 5 leaves.

     Now, the bullet-biting leaf covers both the diachronic and synchronic denials. And in both cases, the proponent can still hold that novel predictions confirm.

     We can note that the synchronic counterfactual leaf is very similar to Howson's approach, but applied synchronically.

     Now, the tree:

