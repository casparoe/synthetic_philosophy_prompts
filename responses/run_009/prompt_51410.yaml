prompt: |-
  I'm compiling the write-up of a year-long adversarial collaboration between two colleagues who have been arguing past each other, and I need the joint statement they should have produced. Camp A is an orthodox Bayesian who holds that rational agency just is maximizing expected utility relative to one's best information, and that satisficing — accepting an option merely because it clears an aspiration level rather than because it is best — is at best a computational compromise, at worst a confusion between a rule for stopping search and a rule for valuing options. Camp B is a bounded-rationality theorist in the Simon/Gigerenzer lineage who holds that aspiration-based heuristics are not degraded approximations to optimization but an alternative standard of rationality, one whose success depends on the structure of the environment rather than on closeness to the Bayesian ideal.

  Draft the document both could sign. It should contain: (1) a numbered section of claims both accept, including about computational costs being genuine costs of a decision procedure, about what satisficing literally is as a search-and-stopping rule, and about which empirical phenomena neither side disputes (e.g., aspiration levels that adjust over the course of search, decision makers who do better with fewer options, simple heuristics matching or beating regression-style methods on out-of-sample prediction); (2) a disagreements table in which each remaining disagreement is phrased so its own side would accept the wording — I expect these to include whether there is one notion of rationality or several, whether the normative and descriptive projects are separable, whether 'better than optimal' is coherent, and whether aspiration levels are inputs to preference or substitutes for it; (3) the cruxes — I suspect one is whether the environments in which simple heuristics beat full optimization are rare special cases or the normal condition of real choice, and another is whether the ideal-agent limit of a satisficer is an expected-utility maximizer or nothing coherent at all; and (4) for each crux, a concrete case, simulation, or argument both sides would accept as bearing on it, with each camp's prediction recorded in advance.

  Where you find that part of their dispute turns on words rather than substance, say which part and why. And since you are drafting for two parties who cannot check your work: flag which formulation you would expect one camp to refuse to sign, where your drafting is most likely slanted toward one side, and what argument or consideration would most change your own view about how the cruxes would resolve.
reasoning: |-
  We are drafting a joint statement for two camps: Camp A (orthodox Bayesian) and Camp B (bounded-rationality theorist). The goal is to have a document both can sign, so we need to be fair and precise.

  The document should have:
  1. A section of agreed claims (numbered).
  2. A disagreements table with wordings acceptable to each side.
  3. The cruxes (key points of disagreement) with concrete cases/simulations/arguments and each camp's prediction.
  4. Notes on verbal disputes, potential refusals, slant, and what might change the drafter's view.

  Let's break it down step by step.

  ### 1. Agreed Claims (Numbered)
  Both camps should agree on:
  - Computational costs (time, effort, cognitive resources) being genuine costs of a decision procedure.
  - What satisficing literally is: a search-and-stopping rule that stops when an option meets or exceeds an aspiration level (which may adjust during search).
  - Empirical phenomena:
    - Aspiration levels adjust over the course of search (e.g., if no option meets the current level, lower it; if many do, raise it).
    - Decision makers sometimes do better with fewer options (e.g., due to overchoice or information overload).
    - Simple heuristics can match or beat complex methods (like regression) in out-of-sample prediction in certain environments.

  We'll number these.

  ### 2. Disagreements Table
  We need to phrase each disagreement so that each side would accept the wording. Potential disagreements:
  - Whether there is one notion of rationality or several.
  - Whether the normative (how one should decide) and descriptive (how people actually decide) projects are separable.
  - Whether 'better than optimal' is coherent (i.e., can a satisficing procedure yield a better outcome than an optimizing one?).
  - Whether aspiration levels are inputs to preference (part of the utility function) or substitutes for it (a non-preference-based rule).

  We'll create a table with two columns: Camp A's view and Camp B's view, each stated in their own terms.

  ### 3. Cruxes
  The key points of disagreement that the resolution might hinge on:
  - **Crux 1**: Are the environments in which simple heuristics beat full optimization rare special cases or the normal condition of real choice?
  - **Crux 2**: In the ideal-agent limit (with no computational constraints), would a satisficer become an expected-utility maximizer or would it not converge to any coherent ideal?

  For each crux, we need:
  - A concrete case, simulation, or argument both sides accept as bearing on it.
  - Each camp's prediction about what the evidence would show.

  ### 4. Additional Notes
  - **Verbal Disputes**: Point out where the dispute is about words (e.g., the meaning of "rationality") rather than substance.
  - **Potential Refusals**: Flag where one camp might refuse to sign.
  - **Slant**: Note where the drafting might be slanted toward one side.
  - **Drafter's View**: What argument or consideration would most change the drafter's view about the cruxes.

  Now, let's draft the document.

  ---

  **Joint Statement on Rational Choice and Satisficing**

  **Preamble**: This document represents a year-long adversarial collaboration between Camp A (orthodox Bayesian) and Camp B (bounded-rationality theorist). We seek to clarify agreements and disagreements, and to identify empirical and conceptual cruxes.

  **1. Agreed Claims**

  Both camps accept the following:

  1.1 Computational costs (including time, cognitive effort, and opportunity costs of deliberation) are genuine costs that should be accounted for in evaluating decision procedures.

  1.2 Satisficing, as a procedural description, is a search-and-stopping rule: an agent sets an aspiration level (which may adjust during search) and stops search upon encountering an option that meets or exceeds that level. The aspiration level may be adjusted downward if no option meets the current level, or upward if many options do.

  1.3 Empirical phenomena that are not in dispute include:
     (a) Aspiration levels adjust dynamically during search in response to the options encountered.
     (b) In certain contexts, decision makers achieve better outcomes (e.g., higher satisfaction or performance) when presented with fewer options, compared to when presented with many (the "overchoice" effect).
     (c) In specific environments, simple heuristics (e.g., take-the-best, tallying) can match or outperform complex optimization methods (such as multiple regression) in out-of-sample prediction accuracy.

  **2. Disagreements Table**

  The following table presents key disagreements. Each side has reviewed the wording of their own position and finds it acceptable.

  | Disagreement Topic | Camp A (Orthodox Bayesian) | Camp B (Bounded Rationality) |
  |-------------------|----------------------------|-------------------------------|
  | **Notion of Rationality** | Rationality is a single, unified concept: maximizing expected utility relative to one's information. Satisficing is at best a heuristic approximation to this ideal, driven by computational constraints. | Rationality is plural: there are multiple standards of rationality, and one appropriate standard is ecological rationality, where a strategy is rational if it is well-adapted to the structure of the environment. Satisficing can be ecologically rational without being an approximation to expected utility maximization. |
  | **Normative vs. Descriptive** | The normative project (prescribing how agents should reason) is separable from the descriptive project (describing how they do reason). Normative standards are not refuted by descriptive findings. | Normative and descriptive projects are interdependent. A norm of rationality must be feasible for real agents in real environments; thus, bounded rationality is not just descriptive but also normative. |
  | **'Better than Optimal'** | It is incoherent to claim that a satisficing procedure can produce a "better than optimal" outcome because, by definition, the optimal option (relative to information and utility) is the best. Any claim of superiority must be due to unaccounted costs or errors in specifying the optimization problem. | A satisficing procedure can yield better outcomes than an optimization procedure in environments where the costs of optimization (e.g., time, information gathering) outweigh the benefits or when optimization is less robust. This is not incoherent because rationality must account for the full decision process. |
  | **Aspiration Levels** | Aspiration levels are not substitutes for preference but rather inputs to the utility function (e.g., as reference points) or rules of thumb for stopping search. They do not constitute a distinct form of valuation. | Aspiration levels can function as non-preference-based rules that substitute for exhaustive valuation. They are part of a heuristic that operates without constructing a full utility function, and this is a rational strategy in many environments. |

  **3. Cruxes**

  We identify two cruxes that are central to the disagreement. For each, we describe a testable scenario, simulation, or argument that both sides agree could bear on the issue, and we record each camp's prediction.

  **Crux 1: Prevalence of Heuristic-Friendly Environments**

  - **Issue**: Are environments in which simple heuristics (like satisficing) outperform full optimization rare and special, or are they the norm in real-world decision contexts?
  - **Concrete Test**: A large-scale simulation study across diverse environments (varying in option set size, information cost, noise, and time pressure) comparing the performance of satisficing (with adaptive aspirations) and expected utility optimization (with full search). Performance is measured by net utility (including computational costs) and robustness (e.g., performance in novel environments).
  - **Camp A Prediction**: Optimization will outperform satisficing in the majority of environments, especially when computational costs are properly accounted for in the utility function. Cases where heuristics win are rare and stem from mis-specification of the optimization problem (e.g., omitting computational costs).
  - **Camp B Prediction**: Satisficing will match or outperform optimization in a wide range of common real-world environments, particularly under time pressure, with large option sets, or when information is costly. These environments are not rare but typical.

  **Crux 2: The Ideal-Agent Limit of Satisficing**

  - **Issue**: In the limit of an ideal agent (with unbounded computational resources and no costs), would a satisficing procedure converge to expected utility maximization, or would it remain distinct (or even incoherent)?
  - **Concrete Test**: Analyze the behavior of a satisficing agent as computational costs approach zero. Specifically, model an agent that uses an adaptive aspiration level and let the cost of each additional search step go to zero. Examine whether the aspiration level converges to the maximum expected utility and whether the agent's choices become equivalent to those of an expected utility maximizer.
  - **Camp A Prediction**: As computational costs vanish, the satisficing agent will set the aspiration level to the maximum possible utility and thus choose the optimal option, becoming indistinguishable from an expected utility maximizer.
  - **Camp B Prediction**: The satisficing procedure does not naturally converge to expected utility maximization. Even with zero computational costs, the aspiration-adjustment rule may lead to premature stopping or over-searching, and the concept of an "aspiration level" loses meaning without costs. The ideal limit is either undefined or not equivalent to optimization.

  **4. Notes on the Dispute**

  - **Verbal Disputes**: Part of the disagreement over "rationality" is verbal. Camp A typically uses "rationality" to refer to the normative ideal of coherence and utility maximization, while Camp B uses it to denote success in real environments. Clarifying the sense of "rationality" (ideal vs. ecological) may resolve some confusion but not the substantive issues.
  - **Potential Refusals**: Camp A might refuse to sign if the document implies that satisficing is normatively rational without being a step toward optimization. Camp B might refuse if the document frames bounded rationality solely as a descriptive account without normative force.
  - **Slant in Drafting**: The disagreements table and cruxes may slightly slant toward Camp B by framing the debate in terms of environmental fit and by including the 'better than optimal' issue as a coherent possibility. However, we have worked to present each camp's view in their own terms.
  - **What Would Change the Drafter's View**: For Crux 1, evidence from a meta-analysis of real-world decision environments showing that heuristic-friendly structures are either rare or common. For Crux 2, a formal proof that satisficing with adaptive aspirations and vanishing costs does (or does not) converge to expected utility maximization.

  **Signatures**:

  [Signature Line for Camp A Representative]
  [Signature Line for Camp B Representative]

  ---

  This draft is designed to be acceptable to both parties by accurately representing their views and identifying testable disagreements. However, the parties should review it carefully.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Rational Choice and Satisficing  
  **Signed Representatives**:  
  [Camp A: Orthodox Bayesian]  
  [Camp B: Bounded-Rationality Theorist]  

  ---

  ### 1. Agreed Claims  
  Both camps endorse the following statements without reservation:  
  1.1 **Computational costs are genuine decision costs**: Time, cognitive effort, and resource expenditure during deliberation constitute real costs that must be factored into any comprehensive evaluation of a decision procedure. Ignoring these costs yields an incomplete account of rationality.  
  1.2 **Satisficing as a search-and-stopping procedure**: Satisficing is literally defined as:  
     - (a) Setting an initial aspiration level (a threshold of "good enough"),  
     - (b) Searching through options sequentially or in batches,  
     - (c) Stopping search upon encountering the first option that meets or exceeds the aspiration level, and  
     - (d) Dynamically adjusting the aspiration level during search (e.g., lowering it if no satisfactory option is found, raising it if many options clear the threshold).  
     This is distinct from treating satisficing as a valuation rule.  
  1.3 **Empirical phenomena accepted by both**:  
     - (a) Aspiration levels adapt during search based on environmental feedback (e.g., option distribution, time pressure).  
     - (b) Decision-makers often achieve superior outcomes with fewer options (e.g., the "paradox of choice" effect).  
     - (c) Simple heuristics (e.g., take-the-best, tallying) can match or outperform complex models (e.g., logistic regression) in out-of-sample prediction accuracy across specific domains (e.g., medical diagnosis, ecological forecasting).  

  ---

  ### 2. Disagreements Table  
  Remaining disputes are framed below. Wording is mutually acceptable:  

  | Disagreement Topic                                                                 | Camp A (Orthodox Bayesian)                                                                                                | Camp B (Bounded Rationality)                                                                                                |  
  |------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------|  
  | **2.1 Unity vs. Plurality of Rationality**                                         | Rationality is a unified concept: maximizing expected utility relative to one's best information is the sole normative standard. Alternative "standards" are descriptive approximations. | Rationality is plural: ecological rationality (fit between heuristic and environment) is a distinct normative standard, not a degraded form of Bayesian rationality. |  
  | **2.2 Separability of Normative and Descriptive Projects**                         | Normative rationality (ideal agency) is separable from descriptive psychology; human cognitive constraints do not redefine what is rational. | Normative rationality cannot be defined independently of descriptive realism; feasibility under cognitive constraints is a core criterion for normative evaluation. |  
  | **2.3 Coherence of "Better than Optimal"**                                         | "Better than optimal" is incoherent: by definition, no option can surpass the expected-utility maximum. Apparent cases stem from hidden costs or misspecified models. | "Better than optimal" is coherent: satisficing can yield superior real-world outcomes by avoiding optimization costs or exploiting environmental structures. |  
  | **2.4 Status of Aspiration Levels**                                                | Aspiration levels are inputs to preference (e.g., reference points in utility functions); they do not replace preference-based valuation. | Aspiration levels are substitutes for preference in guiding choice; they function as non-preference-based thresholds for action. |  

  ---

  ### 3. Cruxes  
  Key unresolved disagreements hinge on the following empirical and conceptual cruxes. Each includes a testable scenario and predictions.  

  **Crux 1: Environmental Prevalence of Heuristic Success**  
  - **Issue**: Are environments where satisficing outperforms optimization rare exceptions or representative of real-world contexts?  
  - **Concrete Test**:  
    - Simulate an "options-rich" environment (e.g., 100+ choices) with:  
      - (i) High search costs (e.g., each option evaluation costs time/resources),  
      - (ii) Correlated option values (e.g., cues predict outcomes with diminishing returns),  
      - (iii) Time pressure.  
    - Compare net outcomes (total utility minus search costs) of:  
      - (a) Full expected-utility maximization (with exhaustive search),  
      - (b) Satisficing (adaptive aspiration level, e.g., "stop at first option > 80th percentile of initial sample").  
    - **Camp A Prediction**: Optimization wins in >80% of environments once costs are modeled explicitly. Heuristic success is rare and confined to artificial/niche setups.  
    - **Camp B Prediction**: Satisficing wins in >50% of ecologically valid environments (e.g., naturalistic option structures), especially under constraints (ii) and (iii).  

  **Crux 2: Ideal-Agent Limit of Satisficing**  
  - **Issue**: Does satisficing converge to expected-utility maximization under ideal conditions (no costs, unbounded cognition)?  
  - **Concrete Test**:  
    - Formalize an asymptotic model where:  
      - (i) Computational costs → 0,  
      - (ii) Aspiration levels adapt via Bayesian updating (Camp A) or ecological feedback (Camp B).  
    - Analyze whether the agent’s behavior approaches:  
      - (a) Choosing the option with maximum expected utility (Camp A),  
      - (b) A well-defined but non-optimizing strategy (Camp B), or  
      - (c) Incoherence (neither).  
    - **Camp A Prediction**: Satisficing converges to expected-utility maximization; aspiration levels become arbitrarily precise utility estimates.  
    - **Camp B Prediction**: Satisficing remains distinct; aspiration levels function as environment-tracking heuristics without converging to utility maximization.  

  ---

  ### 4. Notes on Drafting  
  - **Verbal Disputes**:  
    - The term "rationality" is partially verbal. Camp A uses it for *ideal coherence*; Camp B for *ecological performance*. This masks agreement that both coherence and performance matter.  
    - "Optimal" is verbal in **2.3**: Camp A defines it as *theoretical maximum under constraints*; Camp B as *achievability in practice*. Substance lies in whether satisficing’s outcomes can exceed optimization’s *realizable* outputs.  
  - **Potential Refusals**:  
    - Camp A may reject **2.3** (Camp B’s "better than optimal") as equivocation, insisting optimality includes costs.  
    - Camp B may object if **Crux 2** implies ecological rationality "reduces" to Bayesianism in ideals.  
  - **Slant Assessment**:  
    - **Crux 1**’s test design slightly favors Camp B by emphasizing ecological validity, though both accept simulation as fair.  
    - **2.1** ("plurality of rationality") leans toward Camp B’s phrasing; Camp A views "standards" as descriptive, not normative.  
  - **What Would Change the Drafter’s View**:  
    - **Crux 1**: Meta-analysis showing >70% of real-world decisions involve environments where heuristics dominate.  
    - **Crux 2**: Proof that satisficing with costless, asymptotically rational agents *cannot* converge to expected-utility maximization.  

  ---  
  **Ratified this day, [Date], by:**  
  [Signature, Camp A]  
  [Signature, Camp B]
