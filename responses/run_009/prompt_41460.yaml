answer: |-
  Here are the distilled desiderata for any scientifically adequate method in consciousness research, following critical pruning of school-specific biases. Non-negotiables are marked **(NN)**; others reflect core scientific constraints without endorsing specific theories. Conflicts are noted explicitly.

  ### Desiderata with Rationale
  1. **Handle non-reporting subjects (infants, animals, anesthetized) without presupposing consciousness presence/absence.**  
     *(Case: Consciousness science must generalize beyond humans. Denying this limits scope arbitrarily; affirming it risks anthropomorphism. **NN** for scope, but method must justify its approach.)*  

  2. **Dissociate subjective report from behavior and neural activity.**  
     *(Case: Blindsight (reports "no sight" but accurate forced-choice) and confabulation (false post-hoc narratives) prove reports ≠ experience. **NN** — uncontested by robust evidence.)*  

  3. **Treat first-person reports as data, not self-validating evidence.**  
     *(Case: Reports are measurable outputs, but their accuracy is testable (e.g., via congruence with behavior/neural patterns). Distinction prevents privileging introspection uncritically. **NN** for avoiding question-begging.)*  

  4. **Respect the subjectivity barrier: No direct observation of others' experiences.**  
     *(Case: All methods infer consciousness indirectly. Violating this collapses the hard problem into behaviorism or neuro-reductionism. **NN** for epistemic honesty.)*  

  5. **Be compatible with unconscious information processing.**  
     *(Case: Psychology/neuroscience show perception, learning, and decision-making occur without awareness (e.g., priming, implicit memory). Contradicting this ignores foundational data. **NN**.)*  

  6. **Avoid assuming functional equivalence entails experiential equivalence.**  
     *(Case: Two systems may behave identically while differing phenomenally (e.g., philosophical zombies). Method must not presuppose this equivalence. Preference: Pruned — this *demands* neutrality, but some theories (e.g., illusionism) reject the possibility.)*  

  7. **Resolve ambiguity in "fringe" states (dreams, sedation, disorders of consciousness).**  
     *(Case: These challenge clear consciousness/unconsciousness dichotomies. Method must provide criteria beyond mere report. **NN** for clinical/empirical relevance.)*  

  ### Critical Distinctions to Uphold
  - **Report-as-data vs. report-as-evidence:** Data is raw; evidence requires validation against independent markers (e.g., neural correlates, behavioral predictions). Collapsing these conflates measurement with interpretation.  
  - **Behavioral indicator vs. consciousness itself:** Blindsight shows behavior can dissociate from awareness. Method must explain such gaps, not ignore them.  

  ### Non-Contradiction Mandate  
  Methods must align with:  
  - **Neural correlates of consciousness (NCCs):** E.g., recurrent processing, global workspace activation.  
  - **Dissociation evidence:** E.g., locked-in syndrome (awareness without report), anesthesia (report without awareness).  
  - **Evolutionary continuity:** Animal models must be feasible without assuming identical phenomenology.  

  ### Flagged Conflicts  
  - **Desideratum 4 (Subjectivity Barrier)** vs. **Desideratum 6 (Settle What Experience Is Like):**  
    If we cannot observe experience directly (4), settling *what it is like* (e.g., "does a bat feel redness?") may be impossible without inference. This *does* conflict with neutrality on report-outrunning (your hunch): Neutrality demands methods that detect unreportable states (e.g., in infants), but settling "what it is like" requires report-like data. *Judgment:* **Conflict is genuine**. Resolving it requires either redefining "settle" (e.g., via theory-laden inference) or accepting limits.  
  - **Desideratum 1 (Non-reporting Subjects)** vs. **Desideratum 3 (Reports as Data Only):**  
    Studying non-reporters forces reliance on proxies (neural/behavioral). But if reports aren't evidence, why trust proxies? *Mitigation:* Proxies must be validated *in reporters* first.  

  ### Dennett's Heterophenomenology: Fit and Critiques  
  Dennett’s method treats subjective reports as cultural narratives to be explained alongside behavior and neurology. It **excels** at desiderata 2, 3, and 4: dissociating report from truth, treating reports as data, and respecting subjectivity. It **struggles** with 1 and 7 (non-reporters/fringe states) by avoiding claims about unreportable experience. Critics (e.g., phenomenologists) allege it "cheats" by *dismissing* experience rather than *explaining* it: Reducing consciousness to "judgments" (report-generation) ignores qualia, violating the spirit of 6. Its neutrality collapses into eliminativism.
