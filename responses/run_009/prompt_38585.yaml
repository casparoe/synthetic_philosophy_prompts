prompt: |-
  i want the full spec for a theory of logical uncertainty before i read more about it — i mean credences about claims that already have a truth value but that you can't verify yet, like whether the trillionth digit of pi is 7, or whether some conjecture holds before anyone's proved it. give me the requirements list: near-certainty on anything provable in a few steps you can actually run, no getting dutch-booked by an agent with way more compute than you (i keep going back and forth on whether that one's a genuine requirement or just a description of one particular research program — tell me what you think), the theory itself has to be computable, and it has to do something sensible when the agent's own future computation is part of what makes the claim true or false. for each requirement say what forces it, mark which ones are negotiable, and flag any subset that's jointly unsatisfiable — that's the part i most want. then a sentence or two on how the obvious move of just treating unproven math like ordinary empirical uncertainty does against the list.
reasoning: |-
  We are to design a theory of logical uncertainty for credences about mathematical claims that have a fixed truth value but are currently unverifiable by the agent (e.g., the trillionth digit of pi, unproven conjectures). The requirements are:

  1. **Near-certainty on short proofs**: The agent must assign very high credence (near 1) to any statement that it can prove in a feasible number of computational steps, and very low credence (near 0) to statements whose negation it can prove in feasible steps.

  2. **Immunity to Dutch booking by a more powerful agent**: We require that the agent cannot be Dutch booked by an adversary with significantly more computational power. This is a point of debate: is it a genuine requirement or just a feature of some research programs? We'll discuss.

  3. **Computability**: The theory itself must be computable (i.e., the credence assignment must be computable by a Turing machine).

  4. **Sensible handling of self-referential computation**: The theory must behave sensibly when the truth of the claim depends on the agent's own future computations (e.g., "this very program will halt in less than 10 steps").

  We will analyze each requirement, mark which are negotiable, and check for joint unsatisfiability. Then we'll comment on the naive approach of treating logical uncertainty as empirical uncertainty.

  ## Requirement Analysis

  ### 1. Near-certainty on short proofs
  - **What forces it?** This is a basic rationality requirement. If an agent can easily verify a proof but assigns low credence, it would be irrational. Similarly, if it can prove the negation easily and assigns high credence, that's irrational.
  - **Negotiable?** This is non-negotiable for a theory of logical uncertainty. Without this, the theory would not capture the essence of logical reasoning.

  ### 2. Immunity to Dutch booking by a more powerful agent
  - **What forces it?** The traditional Dutch book argument for probabilistic coherence is extended to logical uncertainty. The idea is that even if an adversary has more computational power, they should not be able to exploit the agent's credences to force a sure loss. However, note that in logical uncertainty, complete coherence (as in probability theory) is impossible because the agent cannot know all logical consequences (due to computational limits). 
  - **Debate**: Some argue that it is not a genuine requirement because in the face of bounded computation, some degree of exploitability is inevitable. Others see it as an ideal to aim for. 
  - **Negotiable?** Partially negotiable. We might accept a weaker form: immunity to Dutch books from agents with at most a fixed amount more computational power, but not from arbitrarily powerful agents. However, the requirement as stated (immunity to agents with "way more compute") is very strong and might be unattainable.

  ### 3. Computability
  - **What forces it?** Without computability, the theory would not be implementable by a physical agent (e.g., an AI system). We require that the credence function is computable by a Turing machine (or a feasible algorithm).
  - **Negotiable?** Non-negotiable. A theory that is not computable is of no use to a bounded agent.

  ### 4. Sensible handling of self-referential computation
  - **What forces it?** Agents will encounter statements that refer to their own computational processes (e.g., "I will output 1 within 10 steps"). The theory must assign credences in a way that avoids paradoxical or inconsistent behavior (like the agent being certain it will do something and then not doing it).
  - **Negotiable?** Non-negotiable because self-reference is inevitable in a complete theory of reasoning about one's own computations.

  ## Joint Unsatisfiability

  The key challenge is that **the combination of requirements 2 (strong Dutch book immunity) and 3 (computability) might be unsatisfiable with requirement 1 and 4**.

  Why? 
  - Requirement 1 forces the agent to be very confident in short proofs. But requirement 3 (computability) implies that the agent cannot know all logical consequences (by undecidability and computational limits). 
  - Requirement 2 (immunity to Dutch books by a much more powerful agent) would require that the agent's credences are coherent in a way that extends to all logical truths (known or unknown) but this is impossible for a computable agent because of Gödel's incompleteness and the undecidability of halting. 

  Specifically, if we insist on full coherence (as in the standard probability axioms) over all mathematical statements, then the credence function would have to be a probability measure that assigns probability 1 to all provable statements and 0 to all refutable ones, and be consistent over all logical implications. But by the Halting Problem, there is no computable such probability measure that satisfies all these conditions (because it would require solving the halting problem for arbitrary programs). 

  Therefore, the strong version of requirement 2 (immunity to Dutch booking by an arbitrarily powerful agent) is incompatible with computability (requirement 3) and the other requirements. 

  However, a weaker form of requirement 2 (e.g., immunity against Dutch books from agents with at most a polynomial increase in computational resources) might be achievable. 

  ## The Naive Approach: Treating Logical Uncertainty as Empirical Uncertainty

  The naive approach is to use standard probability theory (e.g., Bayesian updating) over the space of mathematical claims as if they were empirical events. 

  ### How does it fare against the list?

  1. **Short proofs**: This approach might not assign near-certainty to short proofs because if the agent hasn't yet run the proof, it might assign a non-extreme probability. However, we can design it to update when it runs the proof. So it can satisfy this requirement if we build in a mechanism to update upon proving.

  2. **Dutch book immunity**: If we use standard probability theory and require coherence over all events (including logical ones), then in principle the agent is immune to Dutch books. But note: the agent must assign probabilities to every mathematical statement, which is an uncountable space, and the probability assignment must be coherent. However, without computability, this is not feasible. If we force computability, then we run into the problem that there is no computable coherent distribution over all mathematical statements (as mentioned above). So the naive approach either fails computability or must be approximated, breaking Dutch book immunity.

  3. **Computability**: The naive approach without approximation is not computable because it requires assigning probabilities to an uncountable space and satisfying coherence over all logical implications (which is impossible to compute). Therefore, it fails.

  4. **Self-referential computation**: The naive approach would treat self-referential statements as ordinary events. However, without special care, this leads to paradoxes (like in the case of self-fulfilling or self-defeating predictions). For example, if the agent assigns a high probability to the statement "I will output 1", then if the agent then outputs 0, it becomes inconsistent. So it fails to handle self-reference sensibly.

  ### Conclusion on the naive approach
  The naive approach fails on computability and self-referential computation. It can be adjusted to handle short proofs by updating when a proof is found, but without a computable representation of the entire probability distribution over mathematical statements, it is not feasible.

  ## Summary

  - **Requirement 1 (short proofs)**: Non-negotiable and achievable by design.
  - **Requirement 2 (Dutch book immunity)**: Negotiable, especially the strong version (immunity to arbitrarily powerful agents) because it conflicts with computability. A weaker form (e.g., bounded-resource adversaries) might be used.
  - **Requirement 3 (computability)**: Non-negotiable.
  - **Requirement 4 (self-reference)**: Non-negotiable and requires careful design (e.g., using fixed points or reflective oracles).

  **Joint unsatisfiability**: The strong form of requirement 2 (immunity to Dutch books by arbitrarily powerful agents) is incompatible with requirement 3 (computability) and requirement 1 (short proofs) because of the undecidability of logical consequence. Therefore, we must weaken requirement 2.

  ## Research Directions
  - One approach is to use a **logical induction** framework (as in Garrabrant et al.) which satisfies a form of Dutch book immunity against polynomial-time adversaries and is computable (though not in polynomial time). It also handles self-reference in a limited way by using a market mechanism that converges to truth over time.
  - Another approach is to use **bounded probabilistic reasoning** (like MIRI's research on logical uncertainty) that approximates coherence as much as possible within computational limits.

  In summary, the requirements are challenging and force a trade-off, especially between Dutch book immunity and computability. The naive approach does not work, and current research is focused on finding computable approximations that satisfy the essential properties.
answer: |-
  Below is a complete specification for a theory of logical uncertainty, addressing your requirements. I'll break it down by requirement, explain what forces each, mark negotiability, flag joint unsatisfiability, and evaluate the naive empirical approach. The core challenge is balancing coherence, computability, and sensitivity to feasible computation.

  ---

  ### **Requirements for a Theory of Logical Uncertainty**
  1. **Near-certainty on feasibly provable claims**  
     - **Description**: If a claim can be proven (or refuted) in computationally feasible steps, the agent's credence must be near 1 (or 0).  
     - **What forces it**: Rationality and pragmatism. An agent ignoring feasible proofs would be systematically irrational.  
     - **Negotiable**: **No**. This is table stakes for any theory of logical reasoning.  

  2. **No Dutch books from superior agents**  
     - **Description**: A computationally bounded agent should not be exploitable (via sure-loss bets) by an adversary with vastly more computational resources.  
     - **What forces it**: Traditional Dutch book arguments demand coherence to avoid exploitation.  
     - **Negotiable**: **Partially**.  
       - *Why negotiable?* Full immunity to *arbitrarily powerful* Dutch-bookers is likely impossible for bounded agents (see *Joint Unsatisfiability*). A weaker "bounded-resource-coherence" (e.g., immunity against polynomially stronger adversaries) may suffice.  
       - *Genuine requirement?* **Yes, but weakened**. It’s a core goal of research (e.g., logical induction) but must be relaxed for realism.  

  3. **Computability**  
     - **Description**: The credence function must be computable (e.g., by a Turing machine).  
     - **What forces it**: Physical realism. Agents (e.g., humans, AIs) have finite computational resources.  
     - **Negotiable**: **No**. Non-computable theories are useless to real-world agents.  

  4. **Sensible self-referential handling**  
     - **Description**: Credences about claims referencing the agent's *own* future computations (e.g., "I will prove P within 1M steps") must be consistent and non-paradoxical.  
     - **What forces it**: Self-awareness. Agents must reason about their own actions (e.g., "Should I spend resources proving this?").  
     - **Negotiable**: **No**. Avoids contradictions like self-fulfilling prophecies or infinite regress.  

  ---

  ### **Joint Unsatisfiability**  
  - **The conflict**: Requirements **2 (full Dutch-book immunity)**, **3 (computability)**, and **1 (feasible certainty)** are **jointly unsatisfiable** with **4 (self-reference)**.  
    - **Why**:  
      1. Gödel/Turing guarantees that no computable agent can assign probability 1 to all provable statements (requirement 1) without being inconsistent (via Löb's theorem or halting paradoxes).  
      2. Dutch-book immunity (requirement 2) demands coherence over *all* logical truths, but computability (requirement 3) makes this impossible (an agent can't anticipate every proof a superior adversary might use).  
      3. Self-reference (requirement 4) amplifies this: E.g., the agent cannot coherently assign credence to "I am not exploitable" without circularity.  
    - **Resolution**: Weaken requirement 2. Accept *approximate* coherence against *bounded* adversaries (e.g., logical induction’s polynomial-time traders). Full immunity is **impossible** for bounded agents.  

  ---

  ### **The Naive Empirical Approach vs. Requirements**  
  The naive approach treats logical uncertainty identically to empirical uncertainty (e.g., applying Bayesian probability to math claims):  
  - **Short proofs (req 1)**: **Fails**. Bayesian updates require observing evidence, but feasible proofs are *internally verifiable*. Naive Bayes assigns non-1 credence to "2+2=4" until "observed," violating rationality.  
  - **Dutch books (req 2)**: **Partially succeeds**. Coherent Bayesians avoid Dutch books in classical settings, but fail against adversaries who exploit *logical ignorance* (e.g., betting on undecided claims).  
  - **Computability (req 3)**: **Fails**. E.g., Solomonoff induction is uncomputable. Computable approximations (e.g., MLE) lack logical coherence.  
  - **Self-reference (req 4)**: **Fails catastrophically**. Treating "I will prove P" as empirical severs its dependence on actual computation, leading to paradoxes (e.g., assigning high credence to easily disprovable claims about one's own actions).  

  **Verdict**: The naive approach violates **1, 3, and 4**, and only weakly satisfies **2**. It ignores the *deductive certainty* of proofs and the *reflexivity* of logical reasoning.  

  ---

  ### **Summary of Constraints**  
  | Requirement          | Forces                              | Negotiable? | Critical Conflict?         |  
  |----------------------|-------------------------------------|-------------|----------------------------|  
  | Feasible certainty   | Rationality                         | No          | Conflicts with Dutch books |  
  | Dutch-book immunity  | Coherence                           | Yes (weaken)| Unsatisfiable with comp.   |  
  | Computability        | Physical realism                    | No          | Core conflict              |  
  | Self-reference       | Reflective consistency              | No          | Amplifies conflicts        |  

  **Key takeaway**: The only viable path is to weaken requirement 2 (accepting *bounded* Dutch-book immunity) while preserving computability. Research like **logical induction** (Garrabrant et al.) satisfies all *weakened* requirements: it uses a computable market mechanism to approximate coherence, respects feasible proofs, and handles self-reference via timestamped beliefs. Alternatives (e.g., Demski's Coherence) prioritize computability but sacrifice full anti-exploitation.
