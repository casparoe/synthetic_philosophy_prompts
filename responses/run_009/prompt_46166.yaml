prompt: |-
  I'm the standards editor at a mid-sized regional news outlet, and the fight I keep losing is over the word "knew." Every week someone wants a headline or a lede like "Company knew pipes were leaching lead for a decade" or "Officials knew the dam report was flawed," the lawyers wince because "knew" reads as an accusation of intent, and the reporters push back that everyone talks like that and the documents obviously show the company was aware. What I need is a decision procedure the copy desk can actually run in ten minutes per headline: an ordered list of questions to ask about the subject's evidence and what was at stake for them, then questions about us — because I suspect the truth of a "knew" attribution isn't just about the subject, it's also about the context we're publishing it in — and for each outcome a safe fallback like "was aware," "was told," "had reason to suspect." It should say where it hands the call back to me because it's a values question and not a fact question, and it should be honest about which steps are judgment calls dressed up as procedure.

  For grounding: I took exactly one epistemology course a long time ago, so I half-remember this stuff. My recollection is that there are two distinct ideas that everyone runs together. One is that whether *you* know something can depend on the practical stakes for you — the famous thought experiments have someone deciding whether to stop at the bank on a Friday, where the same evidence counts as knowledge when the stakes are low and not when everything hinges on it. The other is that whether a "knows" claim comes out *true* can depend on the situation of the person doing the attributing — the standards for "knows" shift with the conversational context, so the same subject can be truly said to know by one speaker and not by another. If I have that right, they pull in different directions for us: one says look at the governor's stakes, the other says look at our headline's context, and a lot of our newsroom fights are people talking past each other because one side is running each theory. Please bake the distinction into the procedure rather than glossing over it, and tell me if I've misremembered.

  Then run it on three cases so I can see it work. First: internal memos from 2011 where a company scientist flagged one small, ambiguous study linking our chemical to tumors, and the reporter wants "Company knew chemical was carcinogenic since 2011." Second: an aide mentioned bridge inspection worries to the governor in passing at a fundraiser, and the desk wants "Governor knew bridge was unsafe." Third, the one where I expect to be annoyed: a sympathetic whistleblower whose story everyone wants to tell as "she knew the product was dangerous," when what she actually had was one dataset and a strong hunch — if the procedure tells me to soften *that* one too, I want to see exactly why, and whether that's the procedure working or a place where it misfires.
reasoning: |-
  Okay, let me unpack this editor's problem. They're wrestling with the word "knew" in headlines - reporters want it for impact, lawyers fear it implies intent, and everyone's talking past each other. The core issue seems to be two philosophical concepts about knowledge attribution that are getting tangled: practical stakes for the subject (whether the consequences change what counts as "knowing") and conversational context for the speaker (how the news outlet's framing affects truth). 

  First I need to verify if their epistemology memory holds up. They recall two distinct ideas: 1) subject-sensitive invariantism (where stakes for the knower matter) and 2) contextualism (where standards shift based on the attributor's context). Yes, those do pull in opposite directions here - one looks at the governor's risks, the other at the headline's implications. Their newsroom fights likely stem from people unconsciously applying one theory while ignoring the other.

  For the decision procedure, I'll need to structure it as a flowchart-style checklist that forces explicit consideration of both angles. Key components should include:
  - Evidence quality (direct/indirect? corroborated?)
  - Subject's stakes (were they betting lives or reputations?)
  - Attributor context (is this a breaking news headline or deep analysis?)
  - Fallback options mapped to specific failure points
  - Clear "values call" flags where judgment overrules mechanics

  For the examples:
  1) The ambiguous study case should probably reject "knew" - low evidence quality + high stakes make it shaky. "Was aware" would fit better.
  2) The fundraiser mention definitely fails - it's hearsay-level evidence with massive gubernatorial stakes. "Was told" is safer. 
  3) The sympathetic whistleblower is tricky - her conviction is strong but evidentiary support weak. Here's where the procedure should force a values discussion about protecting sources vs precision.

  The challenge is making this usable under deadline pressure. I'll need to balance philosophical rigor with newsroom practicality - maybe a 5-step sequence with clear exit points to fallbacks. Crucially, it must surface when the word "knew" is being used as a rhetorical weapon rather than factual descriptor.
answer: |-
  Here's a decision procedure incorporating your epistemological framing, designed for speed and transparency. It forces explicit consideration of **subject stakes** (practical consequences *for the subject*) and **attributor context** (standards *for our headline*), flags judgment calls, and provides fallbacks. Steps 1-3 focus on the subject/knower; Steps 4-5 on us/attributor.

  **The "Knew" Attribution Decision Procedure (10-Minute Version)**

  1.  **EVIDENCE QUALITY: What is the *nature and directness* of the evidence showing awareness?**
      *   **A. Direct & Unambiguous:** Signed memos, official reports they acknowledged, sworn testimony they received/wrote it, clear admissions. (e.g., "Memo to CEO: 'Lead leaching confirmed in 50% of tests.' CEO reply: 'Delay remediation.'")
      *   **B. Direct but Ambiguous:** Reports received, meeting minutes mentioning concerns, internal emails raising questions *without clear acknowledgment/action*. (e.g., "Scientist email: 'One study shows tumor link; needs replication.'")
      *   **C. Indirect/Circumstantial:** Aides claim they told them, public data existed, whistleblower claims (uncorroborated), logical inference from role. (e.g., "Aide says he mentioned bridge worries at a fundraiser.")
      *   **D. Speculative/Interpretive:** Strong suspicion, professional opinion, "should have known" arguments.
      *   ***If C or D: STOP. Use Fallback ("was told," "report suggested," "whistleblower alleged," "had reason to suspect," "concerns were raised").*** *[Judgment Call: Assessing ambiguity]*

  2.  **SUBJECT ACKNOWLEDGMENT: Did the subject *demonstrate understanding* of the significance?**
      *   **A. Explicit Action/Admission:** Took steps to conceal, mitigate, or explicitly discussed implications/risks internally. (e.g., "Emails show CFO calculating liability costs from lead.") *Supports "knew".*
      *   **B. Explicit Inaction Despite Risk:** Ignored specific warnings, defunded safety checks, silenced dissent directly related to the issue. *Supports "knew".*
      *   **C. Passive Reception:** Received information but no record of response, discussion, or action. (e.g., Report sits in inbox). *Weakens "knew".*
      *   **D. Ambiguous Response:** Actions/responses don't clearly connect to the specific risk. (e.g., Funded general safety program). *Weakens "knew".*
      *   ***If C or D: Proceed cautiously; "knew" weakens.*** *[Judgment Call: Interpreting actions/responses]*

  3.  **SUBJECT STAKES (Practical Stakes *for the Subject*): What were the *real-world consequences* for the subject if they took the information seriously?** (Adapted from Stanley/Bank Cases)
      *   **A. High Stakes:** Significant financial loss, major legal liability, career-ending scandal, large-scale public safety risk. (e.g., Fixing lead pipes costs billions; admitting bridge flaw triggers emergency response/political crisis). ***Requires HIGHER evidence standard for "knew".*** *[Judgment Call: Assessing stakes]*
      *   **B. Low Stakes:** Minor cost, manageable PR issue, easily fixable problem. ***LOWER evidence standard for "knew".***
      *   ***If A (High Stakes):*** *Combine with Step 1 & 2. Only proceed to "knew" if evidence is A and acknowledgment is A/B. Otherwise, likely Fallback ("was aware of concerns," "ignored warnings," "had evidence suggesting").*

  4.  **ATTRIBUTOR CONTEXT (Conversational Context *for Our Headline*): What is the *purpose and placement* of this "knew" claim?** (Adapted from DeRose/Contextualism)
      *   **A. Breaking News/High-Impact Accusation:** Major scandal, significant harm alleged, prominent placement (Front Page, Top of Website), accusatory tone. ***Raises standards for "knew" significantly.*** *[Judgment Call: Assessing context impact]*
      *   **B. Context-Rich Reporting:** Deep in an investigative piece, surrounded by evidence and nuance, part of a documented timeline. ***Slightly lowers standards, but "knew" still needs support.***
      *   **C. Routine/Neutral Reporting:** Standard business/political reporting, lower prominence, factual tone. ***Moderate standards.***
      *   ***If A (High-Impact Accusation):*** *Combine with Steps 1-3. "Knew" requires near bulletproof evidence (1A, 2A/B) AND manageable subject stakes (3B) OR overwhelming evidence even with high stakes. Otherwise, FALLBACK HARD ("documents show awareness," "reports warned," "evidence indicates knowledge").*

  5.  **VALUES CHECK & FALLBACK:**
      *   **If "knew" passed Steps 1-4:** It *might* be defensible. **Pause: Does using "knew" here:**
          *   Accurately reflect the *strength and nature* of the evidence? (Or does it imply more certainty than exists?)
          *   Serve the core journalistic purpose (truthful informing) without being unduly inflammatory *in this specific context*?
          *   Risk implying *intent to harm* where we only have evidence of *awareness*? (This is the lawyer's core fear).
      *   ***If ANY hesitation on Values Check, or if any prior step flagged a Judgment Call necessitating caution: USE A FALLBACK.***
      *   **Fallback Options (Map to Failure Points):**
          *   Weak/Indirect Evidence (Step 1C/D): "was told," "report suggested," "whistleblower alleged," "concerns were raised".
          *   Lack of Demonstrated Understanding (Step 2C/D): "was aware of," "had received reports about," "information indicated".
          *   High Subject Stakes + Good but not Perfect Evidence (Step 3A + 1B/2B): "ignored warnings," "disregarded evidence," "failed to act on concerns," "was aware of significant risks".
          *   High-Attributor Context (Step 4A): "documents show officials were aware," "evidence indicates company knew" (use "evidence indicates" *before* "knew" as a buffer), "reports warned for years".
          *   General Precision/Safety: "understood," "recognized," "were informed".

  **Where it Hands Back to You (The Values Questions):**
  *   **Step 4 (Attributor Context):** Assessing the *impact* of the headline/lede and whether that context *justifies* the strong claim "knew" based on the available evidence. Is the potential for perceived accusation worth the precision loss if we soften it?
  *   **Step 5 (Values Check):** The final gate. Does "knew" *feel* right, accurate, and responsible *here*, considering everything? Is it the *truest* way to convey the situation to our readers in this format? This is editorial judgment, not pure procedure.

  **Judgment Calls Dressed as Procedure (Be Honest):**
  *   Step 1: Classifying evidence as Ambiguous vs. Unambiguous.
  *   Step 2: Interpreting actions/inaction as demonstrating understanding or not.
  *   Step 3: Assessing the practical stakes *for the subject* (High vs. Low).
  *   Step 4: Determining the conversational context *impact* of *this specific headline* (High vs. Mod/Low).
  *   Step 5: The final Values Check.

  ---

  **Running the Cases:**

  **Case 1: Ambiguous Study (2011 Memo)**
  *   **Step 1:** **B (Direct but Ambiguous).** One small, ambiguous study flagged internally. Not confirmation. *Flag: Judgment Call (Ambiguity).*
  *   **Step 2:** Likely **C (Passive Reception)** or **D (Ambiguous Response)** unless evidence shows specific action *based on the tumor risk* (e.g., secret testing, silencing the scientist *specifically* about tumors). *Weakens "knew".*
  *   **Step 3:** **A (High Stakes).** Labeling a product carcinogenic has massive financial/legal/reputational consequences. *Requires HIGHER evidence standard.*
  *   **Step 4:** **A (High-Impact Accusation)** if prominent headline. **C (Routine)** if buried in a long piece. *Assume A for headline.* *Raises standards significantly.*
  *   **Step 5:** **Values Check:** "Knew" implies certainty ("was carcinogenic") far beyond what "one small, ambiguous study" supports. Using it here would be inflammatory and inaccurate.
  *   **Fallback:** "Company was aware of study suggesting cancer link since 2011" or "Memo flagged tumor study in 2011". *Procedure: STOP at Step 1 (B - Ambiguous) or Step 3 (High Stakes + Ambiguous Evidence = Fallback).*

  **Case 2: Fundraiser Mention (Governor & Bridge)**
  *   **Step 1:** **C (Indirect/Circumstantial).** Aide's claim of a mention in passing at a fundraiser. Low reliability context. *STOP. Use Fallback.*
  *   **Fallback:** "Aide says governor was told of bridge worries" or "Concerns about bridge reached governor, aide alleges". *Procedure: Hard STOP at Step 1 (C).*

  **Case 3: Sympathetic Whistleblower (Dataset & Hunch)**
  *   **Step 1:** **C (Indirect/Circumstantial - her testimony)** or **D (Speculative - if relying solely on her hunch)**. The dataset is evidence *she possessed*, but its interpretation as "dangerous" is her professional opinion/hunch unless it was blatantly obvious or externally validated at the time. *Flag: Judgment Call (Is the dataset alone conclusive proof of danger everyone would "know"?). Likely STOP/Caution.*
  *   **Step 2:** **A/B (Explicit Action).** *If* she took strong action based *specifically* on believing it was dangerous (e.g., escalating vehemently, resigning in protest, leaking *because* of danger), this supports *her conviction*, but not necessarily that the danger was an objective fact she "knew". *Supports "believed," not necessarily "knew".*
  *   **Step 3:** **A (High Stakes).** Calling a product dangerous has major consequences. *Requires HIGHER evidence standard.* Her *personal* stakes (doing the right thing) are high, but Step 3 is about the stakes *for the subject of the attribution* (her employer/colleagues if *they* knew - which isn't the claim here). *For attributing knowledge TO HER:* **B (Low Stakes)** - her reputation/professional opinion might be on the line, not usually billions/liability. *LOWER standard for attributing "knew" TO HER specifically.*
  *   **Step 4:** **Likely A (High-Impact Accusation/Sympathetic Profile).** Framing her as "knowing" makes her a clearer hero/victim. *Raises standards.*
  *   **Step 5:** **Values Check:** Does "knew" accurately describe her state of mind? She had data and a *strong belief based on expertise*, but not necessarily irrefutable *knowledge* (especially if others reasonably disagreed). "Believed" or "concluded" is more precise. Using "knew" risks overstating her certainty *then* and could inadvertently undermine her credibility if the data later seems less conclusive. The story's power is in her *courageous belief and action*, not an impossible claim of perfect foresight/knowledge.
  *   **Fallback:** "She believed the product was dangerous," "Her analysis concluded the product was unsafe," "Convinced by her data that danger existed". *Procedure: STOP at Step 1 (C/D - Indirect/Speculative Evidence for the *fact* of danger) OR Values Check (Step 5 - "Believed" is truer to her state of mind).*

  **Why Soften the Whistleblower? (The Procedure Working)**
  The procedure flags that the evidence she possessed (Step 1) likely shows *her strong belief and basis for it*, but not necessarily that the danger was an uncontestable fact she objectively "knew" at the time, especially given potential ambiguity (others disagreeing, data needing interpretation - Step 1 Judgment Call). Step 5 (Values) highlights that "knew" might misrepresent her epistemic state and the nature of her heroism, which was acting on conviction, not omniscience. Using "believed" protects the paper (accuracy), protects her (avoids overstatement), and still tells the powerful story. It misfires only if your *goal* is rhetorical amplification at the expense of precision. The procedure forces precision.
