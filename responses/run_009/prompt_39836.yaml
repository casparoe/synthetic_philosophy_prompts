  Okay, the user writes historical fiction and has a firm stance on fidelity of spirit over fact, using the example of Amadeus. They've been losing arguments at dinner parties and want to stress-test their view. They're looking for the strongest counterarguments, not just the usual slander complaints. 

  First, I need to understand their core position: fabricated scenes are acceptable if they're true to the person's overall character and the audience knows it's fiction, not a documentary. The two conditions are genre clarity and thematic truthfulness. 

  Now, the user presents several challenges: the victim-of-the-biopic scenario (recent deaths affecting living people), scale (small readership vs. mass media), and AI reconstruction of dead performers. They also mention a friend's accusation that "true to the overall shape" might just justify any fabrication they like. 

  Hmm, the AI objection seems particularly strong because it directly attacks the genre-signaling defense. If AI can create hyper-realistic fake footage, the line between drama and documentary blurs. The audience can't easily distinguish, so the first condition (genre clarity) fails. Even if labeled, the sensory realism might override cognitive awareness. This could fundamentally break their position unless they add safeguards, like prohibiting ultra-realistic recreations of specific dead individuals. 

  The victim-of-the-biopic issue is also serious. When a subject died recently, fabricated scenes can harm living people who knew them. The "fidelity to the dead" argument doesn't account for the living. The user might need to concede a recency boundary—maybe a 50-year rule—or adjust their principle to include avoiding direct harm to survivors. 

  Scale is a real concern too. A novelist with few readers causes less societal impact than a viral Netflix series. But their principle isn't inherently scale-dependent, so they’d need to either bite the bullet (all scales are equal) or admit scale matters, which complicates the theory. 

  As for the friend’s accusation about "true to the overall shape" being self-serving... that’s a valid critique. If the standard is too vague, it risks becoming unfalsifiable. The user needs concrete criteria—like alignment with documented motivations or avoidance of disproven actions—to prevent this. Otherwise, the principle collapses into subjective taste. 

  Ranking these:  
  1. **AI reconstruction** (breaks the genre-signaling mechanism).  
  2. **Victim-of-the-biopic** (ignores living stakeholders).  
  3. **Self-serving "shape" definition** (vagueness undermines principle).  
  4. **Scale** (practical concern but not fatal to core idea).  

  The position survives with major surgery:  
  - **AI**: Ban ultra-realistic recreations.  
  - **Recency**: Add a time buffer for the living.  
  - **Vagueness**: Define "shape" with historical constraints.  

  Without these fixes, the view dies under the AI and recency challenges. The core insight about spirit vs. fact is salvageable, but it needs guardrails. The user’s friend isn’t wrong—they must tighten "shape" to avoid arbitrariness. Taste can’t be the only standard; history must anchor it.
answer: |-
  Here's the stress-test verdict: **Your position survives, but requires major surgery to avoid fatal flaws in the AI and "victim-of-the-biopic" cases. The strongest objection is AI reconstruction, which demands a new boundary.** The "self-serving shape" critique is dangerous if unaddressed but fixable with rigor. Below is the ranked breakdown, surgical amendments, and blunt truths.

  ---

  ### **The Verdict: Strongest to Weakest Objections**
  1.  **AI Reconstruction of the Dead (Fatal if Unmodified)**  
      **Why it breaks your view:** Your defense relies on *genre signaling* (audience knows it's fiction). AI shatters this by creating hyper-realistic, deceptive fabrications. When Marilyn Monroe's deepfake "stars" in a new "biopic" with fabricated dialogue, the audience isn't choosing between *drama* and *documentary*—they're choosing between *real footage* and *fake footage that looks equally real*. Your genre contract collapses.  
      **Surgery Required:** You must add a *non-realism boundary*. **The view survives only if you prohibit *ultra-realistic simulations* of specific dead individuals (voice, face, mannerisms).** Fabricated dialogue in prose? Permissible. An AI Churchill giving a speech he never gave? Forbidden. The dead are owed protection from technological ventriloquism that erases the line between artifact and artifice. Without this, your principle enables digital necromancy.  

  2.  **Victim-of-the-Biopic (Potentially Fatal)**  
      **Why it threatens you:** When the subject died recently (e.g., Freddie Mercury, Stephen Hawking), living stakeholders exist: heirs, victims, allies. A "spiritually true" but factually false scene (e.g., inventing a betrayal by a living friend) can actively harm real people, reshape legacies maliciously, or retraumatize survivors. Your "duty to the dead" ignores *duties to the living*.  
      **Surgery Required:** Impose a **recency buffer**. **The view survives only if you exclude subjects who died within 50–70 years** (or where direct survivors/combatants exist). For recent subjects, fidelity *must* extend to factual care with events involving living people. The dead may "owe" only spirit, but the living are owed truth.  

  3.  **"True to the Overall Shape" is Self-Serving (Dangerously Vague)**  
      **Why your friend is partially right:** "Shape of the person" *can* become a license for cherry-picking. Example: A novelist depicts Emily Brontë as a secret anarchist bomber because it "captures her rebellious spirit." Is this defensible? Only if "shape" is anchored to *documented traits, values, and historical consensus*—not the artist's agenda.  
      **Surgery Required:** Define "shape" **strictly as core motivations, documented contradictions, and historically attested impact**. Envy in Salieri? Valid (he wrote it in letters). Mozart as a giggling man-child? Valid (contemporaries called him juvenile). But if you invent an action *fundamentally misaligned* with proven character (e.g., Gandhi committing an act of racist violence), it fails the shape test—even if it "serves" a theme about colonialism. **Cut subjective interpretations unsupported by evidence.**  

  4.  **Scale (Annoying but Not Fatal)**  
      **Why it’s merely irritating:** Your principle isn't scale-dependent. A lie that misrepresents Marie Antoinette to 10 readers is still a lie; scale amplifies harm but doesn’t redefine ethics. However, mass media *accelerates* legacy distortion (e.g., *The Crown* swaying public perception of Charles/Diana).  
      **Surgery Optional:** Acknowledge scale as a *practical* boundary for harm, not an ethical one. **The view survives intact**—but artists with mass reach bear greater responsibility to signal genre *aggressively* (e.g., "THIS IS FICTION" disclaimers every 30 minutes).  

  ---

  ### **Does Your Position Survive?**  
  - **Intact? No.**  
  - **With Surgery? Yes.**  
    - **AI:** Ban ultra-realistic simulations of the dead.  
    - **Recency:** Exclude recently deceased subjects (or living stakeholders).  
    - **"Shape":** Define it as *evidence-based character traits*, not thematic convenience.  

  ### **Blunt Truth About Taste vs. Principle**  
  Your friend’s accusation has teeth: **"True to the overall shape" *is* unfalsifiable if untethered from evidence.** But it *can* be a principle, not just taste, if you bind it to three constraints:  
  1.  **Negative Capability:** Never fabricate actions the person *would have found morally alien* (e.g., Lincoln supporting slavery).  
  2.  **Historical Causality:** Don’t alter events that *defined their legacy* (e.g., Newton discovering gravity via apple *is* fabricatable; Newton stealing calculus from Leibniz *is not*).  
  3.  **Consent of the Dead:** Use only traits *they revealed or contemporaries attested*. Invented secrets violate their autonomy.  

  **Final Judgment:** Your core insight—that spirit transcends fact—is ethically sound *if* you build fences against tech exploitation, harm to the living, and self-indulgence. Without these, your view is indeed "fabrication for art I like." With them, it’s a defensible ethic for historical art. Now go win those dinner parties.
