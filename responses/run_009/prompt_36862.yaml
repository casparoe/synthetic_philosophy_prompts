prompt: |-
  I am writing the semantics chapter of my thesis, and before I commit to a framework I want the full specification written out: what a theory of the English conditional construction has to deliver, covering both its indicative and its subjunctive/counterfactual moods, to be good enough for one job and one job only — predicting, and explaining, speakers' acceptability judgments about conditionals and the validity of everyday arguments in which conditionals figure. Adequacy is relative to that job, so judge everything against it.

  Below are the raw data I want covered, described the way I ran into them rather than in the literature's vocabulary. Don't treat my descriptions as the requirements themselves; carve them into well-formed requirements, name each (standard name if there is one, invented name if not), and attach the datum that motivates it.

  1. Minimal pairs where everything stays fixed except the mood of the verb, and the judgment flips: nearly everyone accepts "If the butler didn't do it, the gardener did" while rejecting "If the butler hadn't done it, the gardener would have" in the same situation.
  2. Sequences where a counterfactual is asserted, then the antecedent is strengthened by a far-fetched conjunct, and the original assertion is retracted as no longer even assertible — but where doing the same with indicatives is stubborn: the indicative reading of the strengthened conditional is resisted, and no retraction of the original seems called for.
  3. Counterfactuals whose antecedent is strengthened by an entirely relevant (not far-fetched) conjunct also often fail: "If the match had been struck, it would have lit" but not "If the match had been struck and had been soaked in water overnight, it would have lit." Yet in mathematical and formal reasoning, strengthening the antecedent seems perfectly in order.
  4. Asserting an indicative conditional whose antecedent one is certain is false strikes speakers as bad in a way the corresponding counterfactual is not: standing in dry sunshine, "If it is raining right now, the streets are wet" is hard to utter; "If it were raining right now, the streets would be wet" is fine.
  5. Judgments that "if A, then if B, C" and "if A and B, then C" come to the same thing — at least for indicatives; whether it extends to counterfactuals is one of the things I want you to rule on.
  6. Argument forms that fail on some reading or another: contraposition, three-step transitivity chains whose conclusion sounds wrong even when each link sounds right, and the way "if A or B, C" does not visibly entail "if A, C" for counterfactuals, while something like it seems to hold for indicatives.

  For each requirement, decide and defend a status: non-negotiable for the fixed job, a strong default that could in principle be bought off, or a prejudice of one camp that the specification should not include at all — be willing to demote my data if the datum is parochial. Then examine the list for internal conflict: identify any subset of the requirements that cannot be jointly satisfied by any semantics, say which one has to go or be weakened, and resolve it — do not leave the tension standing with "more research needed." Commit throughout: where reasonable people differ, take a position and give your reason. I am more interested in a defensible ruling than a diplomatic one.

  Deliver the whole thing as a single JSON object with exactly this schema:

  {
    "purpose": string, one sentence restating the job the theory must do;
    "requirements": array of objects, each with fields "name" (string), "statement" (string, one sentence), "motivating_case" (string, concrete, may be drawn from the list above or a better instance you construct), "status" (one of "non_negotiable", "strong_default", "camp_prejudice"), "status_defense" (string);
    "tensions": array of objects, each with fields "requirements" (array of two or more names), "problem" (string), "ruling" (string, a definite resolution);
    "joint_satisfiability_verdict": object with fields "unsatisfiable_subsets" (array of arrays of names, empty if none), "resolution" (string);
    "most_exclusionary_requirement": object with fields "name" (string), "why" (string) — the single requirement that eliminates the most candidate frameworks;
    "scorecard": array of at most three objects, one per major contender you judge most worth scoring (a material-conditional view, a Stalnaker–Lewis-style possible-worlds view, and an Adams-style view denying truth-aptitude to at least some conditionals are the natural candidates, but choose as you see fit), each with fields "theory" (string), "meets" (array of names), "fails" (array of names), "one_line" (string).
  }

  Keep the weight on "requirements": the scorecard lines are a check on your carving, not the deliverable. Plain strings, no LaTeX; if you need an example conditional inside a string, put it in single quotes.
reasoning: |-
  We are constructing a specification for a semantic theory of English conditionals (both indicative and subjunctive/counterfactual) with the sole job of predicting and explaining speakers' acceptability judgments and the validity of everyday arguments involving conditionals.

  The raw data provided are:

  1. Minimal pairs: Indicative accepted, counterfactual rejected in the same situation.
     Example: "If the butler didn't do it, the gardener did" (acceptable) vs. "If the butler hadn't done it, the gardener would have" (unacceptable) when we know the butler did it.

  2. Strengthening with a far-fetched conjunct: Counterfactuals are retracted when the antecedent is strengthened by a far-fetched conjunct, but indicatives resist such retraction.
     Example: Asserting "If the match had been struck, it would have lit", then adding "and it had been soaked in water" leads to retraction. But for indicative: "If the match is struck, it will light" -> strengthening with "and it is soaked" does not lead to retraction of the original.

  3. Strengthening with a relevant conjunct: Counterfactuals often fail when the antecedent is strengthened by a relevant conjunct, but in mathematical contexts, strengthening is fine.
     Example: "If the match had been struck, it would have lit" is acceptable, but "If the match had been struck and had been soaked in water, it would have lit" is not. But in math: "If n>2 then n^2>4" entails "If n>2 and even, then n^2>4".

  4. Asserting conditionals with false antecedents: Indicative conditionals with antecedents known to be false are bad, while counterfactuals are acceptable.
     Example: On a sunny day, "If it is raining right now, the streets are wet" is bad, but "If it were raining right now, the streets would be wet" is fine.

  5. Import-Export: "if A, then if B, C" equivalent to "if A and B, then C" for indicatives? And for counterfactuals?
     Example: "If the match is dry, then if it is struck, it will light" vs. "If the match is dry and struck, it will light" (seem equivalent for indicative). What about counterfactuals?

  6. Invalid argument forms: Contraposition, transitivity, and or-to-if fail for some conditionals.
     Examples: 
     - Contraposition: "If it is a bird, then it flies" does not entail "If it doesn't fly, then it isn't a bird" (penguins). 
     - Transitivity: "If A, B" and "If B, C" do not entail "If A, C" in some cases (e.g., A: I jump from 10 feet, B: I break my leg; C: I die. But if I break my leg, I don't necessarily die). 
     - Or-to-if: "A or B" entails "if not-A, then B" for indicatives? But for counterfactuals: "Either the butler did it or the gardener did" does not entail "If the butler hadn't done it, the gardener would have".

  We now carve these into requirements.

  Requirement 1: Mood Sensitivity
     Statement: The theory must account for the difference in acceptability between indicative and counterfactual conditionals in minimal pairs where the only difference is the mood and the situation is such that the antecedent is false.
     Motivating case: 1 ("If the butler didn't do it, the gardener did" accepted, but "If the butler hadn't done it, the gardener would have" rejected when the butler did it).
     Status: Non-negotiable. Without this, the theory fails to capture the core contrast between the two moods.

  Requirement 2: Antecedent Strengthening for Counterfactuals (Non-monotonicity)
     Statement: The theory must predict that counterfactual conditionals do not generally allow strengthening of the antecedent, especially with relevant or even far-fetched conjuncts, leading to retraction in some cases.
     Motivating case: 2 and 3 (the match example: when strengthened, the counterfactual is retracted or becomes unacceptable).
     Status: Non-negotiable. This is a hallmark of counterfactual reasoning.

  Requirement 3: Context Shift Resistance for Indicatives
     Statement: The theory must predict that indicative conditionals resist retraction when the antecedent is strengthened by a far-fetched conjunct, even when the same strengthening for counterfactuals leads to retraction.
     Motivating case: 2 (the indicative match example: strengthening by "and soaked" does not lead to retraction of the original).
     Status: Non-negotiable. This shows indicatives are robust in a way counterfactuals are not.

  Requirement 4: Mathematical Monotonicity
     Statement: The theory must account for the fact that in mathematical and formal contexts, conditionals (whether indicative or counterfactual) allow strengthening of the antecedent.
     Motivating case: 3 (the mathematical example: strengthening the antecedent in a mathematical conditional is acceptable).
     Status: Strong default. This is a key feature of deductive reasoning and must be captured, but note that conditionals in natural language are not always mathematical.

  Requirement 5: False Antecedent Assertability
     Statement: The theory must predict that indicative conditionals with antecedents known to be false by the speaker are unassertable, while the corresponding counterfactuals are assertable.
     Motivating case: 4 (the raining example on a sunny day).
     Status: Non-negotiable. This is a fundamental contrast in the use of the two moods.

  Requirement 6: Import-Export for Indicatives
     Statement: The theory must predict that for indicative conditionals, "if A, then if B, C" is equivalent to "if A and B, then C".
     Motivating case: 5 (the match example for indicatives).
     Status: Strong default. This is a widely observed pattern for indicatives, but note that it might not hold in all contexts (e.g., if the inner conditional is itself conditional on A).

  Requirement 7: Import-Export for Counterfactuals?
     Statement: The theory must rule on whether the Import-Export principle holds for counterfactuals. Given the data, it should not hold in general.
     Motivating case: 5 (we note that the equivalence for counterfactuals is not clear and might fail).
     Status: We set it as: the theory must predict that Import-Export fails for counterfactuals. Why? Because there are cases where the two forms come apart. For example: "If I had been a man, then if I had been pregnant, I would have been the first man to give birth" vs. "If I had been a man and pregnant, I would have been the first man to give birth". The first might be vacuously true (because the inner antecedent is impossible) and the second is false (because under the joint assumption, it's impossible). But note: this is a complex issue. Given the job, we require the theory to account for the fact that they are not equivalent in general. We'll call this requirement: "No Import-Export for Counterfactuals".

  Requirement 8: Contraposition Failure
     Statement: The theory must predict that conditionals (at least indicatives and counterfactuals in non-monotonic contexts) do not generally support contraposition.
     Motivating case: 6 (the bird example: "If it's a bird, it flies" does not contrapos to "If it doesn't fly, it's not a bird" because of penguins).
     Status: Non-negotiable. This is a classic failure.

  Requirement 9: Transitivity Failure
     Statement: The theory must predict that conditionals (both indicative and counterfactual) do not generally support transitivity.
     Motivating case: 6 (the leg-breaking example: "If I jump from 10 feet, I break my leg" and "If I break my leg, I die" do not entail "If I jump from 10 feet, I die", because breaking a leg doesn't necessarily cause death).
     Status: Non-negotiable. This is a well-known failure.

  Requirement 10: Or-to-If for Indicatives Only
     Statement: The theory must predict that for indicative conditionals, "A or B" entails "if not-A, then B", but for counterfactuals, the corresponding entailment fails.
     Motivating case: 6 (the butler or gardener example: for indicative, "Either the butler did it or the gardener did" entails "If the butler didn't do it, the gardener did", but the counterfactual version fails: "Either the butler did it or the gardener did" does not entail "If the butler hadn't done it, the gardener would have").
     Status: Non-negotiable. This contrast is crucial.

  We have 10 requirements. Now, note that requirement 4 (Mathematical Monotonicity) might conflict with requirement 2 (Non-monotonicity for counterfactuals). But note that requirement 4 is about a special context (mathematical). The theory must account for both by allowing context-dependence.

  Tensions:

  1. Requirements 2 (Antecedent Strengthening for Counterfactuals) and 4 (Mathematical Monotonicity):
     Problem: How can the same conditional form (counterfactual) sometimes be monotonic (in math) and sometimes not?
     Ruling: The theory must incorporate context-dependence. In mathematical contexts, conditionals are understood as strict conditionals (or universal generalizations) and hence monotonic. In everyday contexts, they are non-monotonic. This is a resolution: context-sensitivity.

  2. Requirements 3 (Context Shift Resistance for Indicatives) and 2 (Non-monotonicity for Counterfactuals) are not in conflict because they are about different moods.

  3. Requirement 6 (Import-Export for Indicatives) and Requirement 7 (No Import-Export for Counterfactuals) are consistent because they apply to different moods.

  4. Requirement 6 (Import-Export for Indicatives) might conflict with Requirement 10 (Or-to-If for Indicatives) if we consider complex conditionals? Actually, they are independent and both must hold.

  But note: the Import-Export principle is sometimes used to derive Or-to-If. However, we require both independently. Our requirement 10 is about the entailment from disjunction to conditional, and requirement 6 is about the equivalence of two conditional forms. They are both supported by the data.

  Joint Satisfiability:

  We believe the requirements are jointly satisfiable. There are no unsatisfiable subsets. We have one tension (2 and 4) that is resolved by context-dependence.

  The most exclusionary requirement: Requirement 2 (Antecedent Strengthening for Counterfactuals) because it forces a non-monotonic logic for counterfactuals, which eliminates many classical frameworks (like material conditional and strict conditional without context). Also, requirement 5 (False Antecedent Assertability) excludes the material conditional for indicatives.

  Scorecard:

  We consider three major contenders:

  1. Material Conditional (MC): Conditionals are truth-functional; "if A, C" is false only when A is true and C is false, else true.

  2. Stalnaker-Lewis (SL) possible-worlds semantics: Conditionals are evaluated by considering the closest worlds where A is true and checking C there. Indicatives and counterfactuals differ in how the set of relevant worlds is determined (with counterfactuals involving a more radical shift).

  3. Adams-style (Probabilistic) view: Conditionals are not truth-apt; instead, they express high conditional probability. For indicatives, the acceptability is a matter of P(C|A) being high. For counterfactuals, it's more complex, but one can use a similarity-based account (like SL) or a probabilistic one.

