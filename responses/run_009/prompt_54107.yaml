prompt: |-
  You are a professional philosopher specializing in collective responsibility and the philosophy of history. I keep encountering arguments about blame for the First World War — the Versailles war-guilt clause (Article 231), Fritz Fischer's thesis that Germany's leadership deliberately pursued a war for world power, and more recent accounts on which the great powers stumbled into the catastrophe together — and I've noticed the participants rarely agree on what question they are answering. Before I read another monograph on the war-guilt question, I want the specification first. Think carefully, and do some preliminary brainstorming before you write.

  Write the desiderata that any adequate theory of national responsibility for starting a war must meet. The theory must handle, at minimum: wars of unmistakable unilateral aggression, where assigning full guilt to one state seems easy; multi-causal crises like July 1914, where several governments each knowingly ran risks no one of them could control; and "cascade" wars joined late for fear of being left out of a settlement. It must also respect the distinctions that these debates tend to collapse — causal contribution versus culpability, triggering a war versus creating the conditions for one, the responsibility of leaders and decision-makers versus that of the citizens who must bear reparations, and a retrospective verdict versus one that could have been reached in advance by those deciding. For each requirement, give the case or consideration that motivates it; mark which requirements are non-negotiable and which are merely the prejudices of particular camps (pro-Fischer, anti-Fischer, and outright structuralist); and flag any subset of the desiderata you suspect cannot be jointly satisfied — that tension is the part I most want to see. Note explicitly how the theory should avoid the two standard failure modes: concentrating responsibility so tightly that it fits only pre-written conclusions about Germany, and diffusing it so thin that no one remains answerable at all. Conclude briefly with which single requirement does the most to adjudicate between Fischer-style verdicts and shared-responsibility verdicts, but keep the weight on the criteria themselves rather than on scoring the historians. Please answer in American English.
reasoning: |-
  Okay, the user is asking me to outline the requirements for a theory of national responsibility for starting wars, specifically using WWI as a case study. They want this framework to handle different war scenarios while respecting key philosophical distinctions. 

  Hmm, this is complex. The user clearly has deep background knowledge - they reference Versailles' Article 231, Fritz Fischer's thesis, and structuralist accounts. Their frustration about scholars talking past each other resonates; historians often conflate causality with culpability. 

  First, I need to map the non-negotiable requirements. The theory must distinguish between causal contribution and moral blameworthiness - that's foundational. Like when Serbia facilitated the assassination but didn't intend continental war. Also crucial: separating leaders' decisions from citizens' burdens, since Versailles punished populations for elite actions. 

  The trickiest part will be handling multi-actor crises like 1914. Austria-Hungary triggered hostilities, Germany enabled it, but Russia's mobilization escalated things. How do we assign shares of responsibility here without either scapegoating one nation or dissolving all accountability? 

  I should flag inherent tensions upfront. Take "foreseeability" - if we require proven intent (Fischer's view), we neglect reckless risk-taking. But if we lower the bar to foreseeable consequences, we might over-blame actors for outcomes they couldn't control. 

  The cascade war problem is equally thorny. When Turkey joined WWI months in, was it "responsible for starting" anything? The theory needs criteria for late entrants versus core belligerents. 

  For the failure modes: Concentrated blame (à la Versailles) ignores how systemic factors enabled the war, while diffuse responsibility becomes morally useless. The sweet spot might lie in a "sufficient cause" standard where each essential contributor bears weight proportional to their avoidable actions. 

  Ah! The adjudicating requirement will be the "recklessness clause" - whether actors knowingly accepted catastrophic risk. That captures Germany's blank check without requiring Fischer-level proof of deliberate war plans, while still holding others accountable for their gambles. 

  Better emphasize this isn't about scoring historians. The framework should make their assumptions explicit - like how structuralists implicitly value systemic analysis over agency - without taking sides. 

  ...time to structure this carefully. Desiderata first, then tensions, then the recklessness point as the differentiator. Must keep distinctions crisp: causality/culpability, triggers/conditions, leaders/populations. Versailles shows why collapsing these is disastrous.
answer: |-
  Here are the desiderata for any adequate theory of national responsibility for starting a war, designed to handle the complexities you've identified. Requirements are categorized, motivated by cases, and tensions are flagged.

  ---

  ### **Core Philosophical Distinctions (Non-Negotiable)**
  1.  **Causal Contribution vs. Culpability/Moral Responsibility:**  
      *   *Motivation:* Serbia provided the *causal trigger* for WWI (assassination facilitation), but Austria-Hungary/Germany bore greater *culpability* for choosing war over diplomacy. An action can be necessary but not sufficient, or sufficient but not blameworthy under duress.  
      *   *Requirement:* The theory must separate factual causation (who did what that increased war likelihood) from normative assessment (who acted wrongly, recklessly, or with malign intent).

  2.  **Triggering vs. Condition-Setting:**  
      *   *Motivation:* Germany's "blank cheque" to Austria-Hungary *triggered* the July Crisis escalation, but decades of militarism, alliance rigidity, and imperial rivalry across Europe *set the conditions*. Versailles focused on the trigger; structuralists focus on conditions.  
      *   *Requirement:* The theory must account for both proximate acts initiating hostilities *and* deeper, systemic factors enabling the war, without conflating them. Responsibility for conditions may be diffuse; for triggering acts, more specific.

  3.  **Decision-Maker Responsibility vs. National/Populational Responsibility:**  
      *   *Motivation:* Article 231 assigned guilt to "Germany," leading to reparations borne by citizens. But Kaiser Wilhelm II, Moltke, Bethmann-Hollweg made key decisions. Holding a *nation* responsible (e.g., for reparations) is distinct from blaming its *people* or its *leaders*.  
      *   *Requirement:* The theory must distinguish responsibility attributable to state *agents* (leaders, officials) from responsibility ascribed to the *state* as a legal/political entity, and from burdens imposed on the *population*.

  4.  **Retrospective vs. Prospective Judgment:**  
      *   *Motivation:* Historians judge with hindsight, but leaders acted with partial information and uncertainty. What seems reckless *now* (e.g., Russian mobilization) might have seemed prudent *then*. A purely retrospective view risks "presentism."  
      *   *Requirement:* Responsibility assessments must consider the knowledge, options, and perceived risks *available to decision-makers at the time*, not just the known outcome.

  ---

  ### **Scope Requirements (Handling Diverse War Types)**
  5.  **Unilateral Aggression (Clear Case):**  
      *   *Motivation:* Nazi Germany invading Poland (1939). Causal contribution and culpability clearly lie with one state.  
      *   *Requirement:* The theory must assign primary/full responsibility to a single actor in unambiguous cases of deliberate, unprovoked aggression. (*Non-Negotiable*)

  6.  **Multi-Causal Crisis w/Shared Agency (Complex Case):**  
      *   *Motivation:* July 1914. Austria-Hungary (seeks punitive war vs. Serbia), Germany (enables AH, risks continental war), Russia (mobilizes preemptively, escalating), France (firmly backs Russia), Britain (ambiguous signals). Each made conscious choices increasing war risk.  
      *   *Requirement:* The theory must assign *graded* responsibility reflecting differing levels of causal contribution, culpability (intent, recklessness), and avoidability of actions by *multiple* actors. (*Non-Negotiable for complex wars*)

  7.  **"Cascade" Wars / Late Joiners:**  
      *   *Motivation:* Ottoman Empire joining WWI (Nov 1914) or Italy switching sides (1915). Motives often involve opportunism or fear of exclusion from the post-war settlement, not causing the initial outbreak.  
      *   *Requirement:* The theory must distinguish responsibility for *initiating the core conflict* from responsibility for *prolonging, expanding, or exploiting* an existing war. Late joiners may bear responsibility for their *entry decision* but not for "starting" the original war.

  ---

  ### **Normative & Practical Requirements**
  8.  **Avoid "Hyper-Concentration" (Versailles/German Guilt Trap):**  
      *   *Motivation:* Article 231's sole attribution to Germany ignored other actors' roles and systemic factors, fueling resentment and historical debate. Fischer's *Griff nach der Weltmacht* risks over-concentration if interpreted as *exclusive* German guilt.  
      *   *Requirement:* The theory must not assign responsibility *solely* based on the identity of the defeated power or predetermined narratives. It must withstand scrutiny against complex causality.

  9.  **Avoid "Hyper-Diffusion" (Structuralist/Nihilism Trap):**  
      *   *Motivation:* Purely structuralist accounts (e.g., alliance systems, militarism, imperialism) can imply "no one was responsible, everyone was trapped," absolving decision-makers of agency and moral judgment.  
      *   *Requirement:* The theory must preserve meaningful moral agency and assign responsibility *somewhere* (even if shared/graded) when deliberate, avoidable, reckless, or malign choices were made by identifiable actors.

  10. **Intent vs. Recklessness vs. Negligence:**  
      *   *Motivation:* Did Germany *intend* continental war (Fischer)? Or did it recklessly accept the high risk (Clark)? Or was the system so complex that actions were merely negligent? Culpability hinges on this spectrum.  
      *   *Requirement:* The theory must incorporate modes of fault: *deliberate instigation*, *conscious risk-taking* (recklessness), and *failure of due diligence* (negligence), assigning differing weights.

  11. **Avoidability:**  
      *   *Motivation:* Could Austria-Hungary have achieved its aims without war? Could Germany have restrained AH? Could Russia have delayed mobilization? Responsibility implies feasible alternatives existed.  
      *   *Requirement:* Assigning responsibility requires demonstrating that the actor(s) had *reasonably available alternative courses of action* that would have significantly reduced the risk of war.

  ---

  ### **Tensions & Potential Incompatibilities**
  *   **Graded Responsibility vs. Hyper-Diffusion (6 vs. 9):** Assigning nuanced shares of responsibility in multi-actor crises (6) risks blurring into "everyone shares a bit, therefore no one *really* bears the burden" (hyper-diffusion - 9). Maintaining clear thresholds for *meaningful* responsibility is difficult.
  *   **Prospective Judgment vs. Retrospective Clarity (4 vs. 6/8):** Judging based on contemporary knowledge/options (4) complicates assigning clear *retrospective* responsibility in complex cases (6), potentially undermining the need to avoid hyper-concentration (8). Hindsight clarifies outcomes but obscures the fog of decision-making.
  *   **State Responsibility vs. Decision-Maker Responsibility (3):** Holding the *state* (e.g., for reparations) often feels necessary for redress, but risks punishing populations unfairly. Focusing solely on leaders may let the state/system off the hook. Reconciling these levels is philosophically and practically fraught.
  *   **Intent (Fischer) vs. Recklessness/Structures (Anti-Fischer/Structuralist):** Requirement 10 highlights the core tension between camps. Fischer emphasizes demonstrable intent; critics emphasize the reckless gamble within a dangerous system. The theory must accommodate *both* as potential sources of culpability without prejudging which applies in a given case.

  ---

  ### **Avoiding Failure Modes**
  *   **Avoiding Hyper-Concentration:** Insist on distinctions 1, 2, and 3. Apply requirement 6 rigorously: even if one actor is primary, others may bear secondary responsibility. Requirement 4 prevents judging solely by the catastrophic outcome. Requirement 11 checks for alternatives beyond the "aggressor."
  *   **Avoiding Hyper-Diffusion:** Uphold requirement 9. Focus on requirement 10 – actions demonstrating intent, recklessness, or gross negligence. Emphasize requirement 6 – responsibility can be graded but *assigned*. Requirement 5 shows clear cases exist, proving responsibility *can* be assigned.

  ---

  ### **The Key Adjudicator: Requirement 10 (Modes of Fault - Intent vs. Recklessness)**
  *   **Why it Adjudicates:** The core debate between Fischer (deliberate German pursuit of war) and shared-responsibility verdicts (reckless risk-taking by multiple powers) hinges *precisely* on the mode of fault. An adequate theory must provide rigorous criteria for distinguishing:
      *   **Intentional Warmaking:** Active, primary desire for war as a chosen instrument (rare outside clear aggression like Requirement 5).
      *   **Reckless Risk-Acceptance:** Consciously pursuing a policy where catastrophic war was a known, highly probable, and accepted consequence (the core charge against German leadership in July 1914 by Fischer *and* many non-Fischer scholars, and arguably Russia/France).
      *   **Negligence:** Failure to perceive risks or consider alternatives that a responsible actor should have (lesser culpability, potentially applying more broadly).
  *   **Adjudicating WWI:** If the theory finds **recklessness** sufficient for major responsibility (even absent proven primary *intent* for continental war), then Fischer-style verdicts implicating German leadership as *centrally culpable* hold, alongside other reckless actors (Russia). If the theory requires proven **intent** for major responsibility, Fischer's stronger claim becomes harder to sustain, pushing towards a more distributed verdict where recklessness carries lesser weight. The theory's stance on *how culpable recklessness is compared to intent* becomes decisive. Requirement 11 (Avoidability) is crucial evidence for establishing recklessness.

  This framework prioritizes the *criteria* for judgment. Applying it to 1914 requires historical evidence about decision-makers' knowledge, perceived alternatives, and the degree to which they accepted the risk of general war – the very battleground Fischer and his critics occupy. The desiderata force clarity on *what kind* of responsibility is being debated.
