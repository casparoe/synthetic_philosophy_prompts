prompt: |-
  I've spent enough years reading decision-theory arguments on rationalist forums to know that intuitions are cheap, but I've been unable to make progress on when a society owes its members compensation for bad outcomes without cataloguing my own gut verdicts on cases and seeing whether a principle falls out. So here they are. Someone born with a congenital condition that keeps them from working: full compensation, no hesitation. Someone who bet their entire savings on a single spin of the roulette wheel and lost: no compensation — they took a fair gamble and lost. A commuter badly injured in a train crash: compensation owed, since the risk they ran was imposed on them rather than chosen. A recreational skier who breaks a leg on an expert slope they freely chose: no compensation, though I admit this one is slightly less firm. So far I'd have guessed the option luck / brute luck distinction — responsibility for outcomes tracks whether the risk was knowingly and voluntarily taken on — captures everything. But then there are the cases that make me doubt it.

  Two neighbors own identical houses in a marginal flood zone. One buys flood insurance; the other, not reckless but careful, runs the numbers, judges the premium actuarially unfair, and self-insures, accepting the risk as part of the deal. The flood takes both houses. My gut says the self-insurer is owed substantial help despite having voluntarily taken on the risk — which looks flatly inconsistent with my verdict about the gambler, who also knowingly and voluntarily took on a risk. Worse, there's the smoker who started at sixteen in a town where everyone smoked, was hooked by eighteen, and now has emphysema at fifty-five: I go back and forth on whether that's closer to the congenital condition or to the skier. So my questions are these. Is there a single principle, or a slightly refined version of the option/brute luck distinction — perhaps distinguishing gambles taken for entertainment from risk decisions made within constraints one didn't choose, or gambles one would have been irrational to decline from gambles one could sensibly have declined — that saves every verdict above? If so, state it precisely, tell me which case motivates each clause, and say what it predicts for a case I haven't listed: someone who drifts into a sedentary desk-job lifestyle they never reflectively endorsed and develops heart disease. If no principle saves all my verdicts, tell me honestly which ones have to go and why, and give me your best candidate principle even if it costs me a verdict or two. I know reflective equilibrium can launder my biases along with my intuitions, so if you think one of my verdicts is simply status quo bias or scope insensitivity dressed up, say so.

  Lead with your bottom line — the single principle or the verdict about whether one exists — in your first sentence, then give the reasoning, with no preamble and no restatement of my cases.
reasoning: |-
  Hmm, the user is grappling with compensation ethics in decision theory. They've laid out intuitive verdicts on cases like congenital conditions (compensate), roulette gamblers (don't compensate), train crashes (compensate), and risky skiers (don't compensate), but hit contradictions with the uninsured flood victim (compensate?) and lifelong smoker (unsure). Their core tension is reconciling voluntary risk-taking with societal obligations.

  I notice their flood case exposes a flaw in pure option/brute luck distinction. Both gambler and flood victim voluntarily accepted risk, yet their intuitions demand different treatment. Why? The key might be that the flood victim's decision was economically constrained - rejecting unfair premiums isn't reckless but rational. This suggests "contextual voluntariness" matters: Was the risk decision made under duress of circumstance?

  The smoker case amplifies this. Starting young in a high-smoking environment challenges true voluntariness. Their ambivalence here is revealing - it's neither pure brute luck (like congenital condition) nor pure choice (like skier). I'd argue this points to "choice architecture" factors: addiction, social pressure, and limited alternatives undermine autonomy.

  For their unasked desk-job/heart disease case: Compensation likely owed. The "drifting" implies lack of deliberate risk-taking, making it closer to imposed risks like train crashes. Sedentary harm often stems from workplace design and societal infrastructure failures.

  Their roulette verdict seems solidly defensible - it's pure entertainment gambling with clear alternatives. But the skier case wobbles because skiing involves social goods (recreation access) and potential industry safety failures. Might need to concede that if ski resorts misrepresented dangers, compensation could apply.

  Bottom line: We need a principle emphasizing *structural constraints* on choice. I'll frame it as: "Compensation owed when bad outcomes stem from risks that were (a) unchosen, or (b) chosen under significant constraints not of the agent's making." This preserves their core intuitions while resolving contradictions by making the flood victim's actuarial hardship and smoker's social context compensable. The gambler remains uncompensated because their constraint was merely entertainment preference.

  I'll also note that their intuition for the uninsured flood victim reveals hidden wisdom: Society often has role in creating risk landscapes (e.g., allowing flood-zone development). This isn't bias but recognition of systemic responsibility.
answer: |-
  **Bottom line: A refined principle incorporating *constrained voluntariness* and *social necessity* saves all your verdicts except possibly the skier, which may require adjustment if slope risks were misrepresented or unavoidable.**

  **Principle:** *Society owes compensation for bad outcomes when either (1) the risk was unchosen ("brute luck"), or (2) the risk was chosen ("option luck") but under conditions where the choice was significantly constrained by unchosen circumstances (lack of viable alternatives, severe information deficits, or coercive social/economic pressures), **and** bearing the risk was reasonably necessary for accessing fundamental social goods or avoiding severe deprivation.*

  **Application & Motivation:**

  1.  **Congenital Condition (Compensate):** Brute luck (1). No chosen risk.
  2.  **Roulette Gambler (No Comp.):** Pure option luck. Chosen risk for entertainment, not necessity. Viable alternatives existed (not gambling). Lacks the "constrained necessity" clause (2).
  3.  **Train Crash Victim (Compensate):** Brute luck (1). Risk of commuting is typically imposed by societal structure/norms, not truly optional for participation in work/life. *Motivates "fundamental social goods" aspect of (2).*
  4.  **Recreational Skier (No Comp. - tentative):** Option luck. Chosen risk for non-essential activity. Viable alternatives existed (easier slopes, other sports). *This verdict holds IF risks were clear AND safer alternatives were truly accessible. If not, it might shift.*
  5.  **Uninsured Flood Victim (Compensate):** *Motivates the refinement.* Option luck *technically*, but choice was severely constrained: rejecting unfair premiums was economically rational self-insurance, not recklessness. Living in the zone might be due to unchosen economic pressures. Accessing housing (a fundamental good) inherently required bearing *some* risk. Principle (2) applies: choice constrained (unfair premium, economic necessity), risk necessary for fundamental good (shelter). Different from gambler: Gambling isn't necessary; shelter is.
  6.  **Smoker with Emphysema (Compensate - leaning):** *Motivates "coercive social pressures" and "information deficits".* Option luck *initially*, but choice at 16 was under severe constraints: unchosen environment (ubiquitous smoking), developmental stage (susceptibility to addiction), likely information deficits about long-term risks/addiction. Continued smoking driven by powerful addiction (constraining later choice). Accessing social inclusion (a fundamental good for teens) may have implicitly required conformity. Principle (2) applies heavily: choices profoundly constrained by unchosen circumstances, making the risk-taking less than fully voluntary. Leans towards the congenital case due to diminished voluntariness over time.

  **Sedentary Desk-Job/Heart Disease Case (Prediction): Compensation Owed.** While "drifting" implies some passivity, the core risk (sedentary lifestyle leading to heart disease) stems significantly from unchosen constraints: work demands imposed by employer/society (necessitating desk work), potentially inadequate breaks/exercise options, societal infrastructure discouraging activity, and possibly information deficits about specific health impacts. Accessing livelihood (a fundamental good) required bearing this risk. Principle (1) & (2) apply: aspects are brute luck (imposed work structure), and choice to *not* counteract it is constrained by time, energy, resources, and societal design.

  **What Might Need Adjustment & Why:**

  *   **The Skier Verdict:** Your intuition is "slightly less firm" rightly so. If the expert slope was misrepresented as safer, or if safer alternatives were unavailable/practically inaccessible (e.g., cost, location), the voluntariness diminishes. Principle (2) *could* apply if the choice was constrained and skiing access was deemed a fundamental social good in that context (debatable). If risks were clear and alternatives truly open, "no compensation" holds. This verdict is the most vulnerable to needing refinement based on specifics. **Scope insensitivity/pro-status-quo bias isn't the main issue here; it's the ambiguity of "viable alternatives" and "fundamental good" for recreation.**

  **Why This Works:** It refines option luck by focusing on the *quality of the voluntariness* behind the choice and the *necessity of the risk-bearing* for basic functioning/social participation. It captures why the flood victim (constrained economic choice for necessary shelter) differs from the gambler (unconstrained choice for non-necessary thrill), and why the smoker (constrained by environment, development, addiction) differs from the skier (presumed unconstrained choice for non-essential recreation).
