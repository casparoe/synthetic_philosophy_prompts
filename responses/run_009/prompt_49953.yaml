prompt: |-
  My roommate is a CS guy who's been on an origins-of-life documentary kick, and last night he laid his new position on me: DNA is literally a code, not a metaphor, and he thinks this matters way beyond biology. His summary went roughly like this: DNA stores information digitally, in discrete symbols — A, T, G, C — the same way a computer stores bits. The genetic code is a genuine cipher: a codon table mapping 64 three-letter words onto 20 amino acids plus a stop signal, exactly analogous to how ASCII maps bit patterns onto characters. And crucially, the mapping is arbitrary — nothing in the chemistry of a codon determines which amino acid it "stands for," which is precisely what makes it a code rather than just chemistry. Since every other code we know of — Morse, ASCII, braille — was invented by a mind, and codes don't invent themselves, the existence of a code at the heart of every cell is evidence of a coder. And the code being essentially universal across all life is just what you'd expect from a single act of design, not from messy unguided origins.

  I pushed back that "it's a code" is just a handy metaphor biologists use, and he pounced: if it's a metaphor, why does it have a decoding table with start and stop signals? Metaphors don't have stop codons. I tried the thing about how a ribosome doesn't "read" anything, it's all just molecular shapes bumping into each other, and he said that's exactly what people said about computers before information theory — voltage levels aren't symbols either, until you notice the systematic mapping. I honestly ran out of footing somewhere around there. I don't buy where he ended up but I can't put my finger on which parts of his chain are solid and which parts are doing sleight of hand, and it bugs me because he's clearly right about *some* of it.

  Go through his summary claim by claim and tell me which parts a careful biologist or philosopher of biology would sign off on, which are subtle overstatements or conflations, and whether the conclusion about a coder actually follows from whatever legitimate parts survive. Lead with your bottom line in the first sentence — who's basically right here — and then walk me through it, no preamble or restating his whole thing back at me. Extra credit if you can tell me whether the universality point helps him or quietly hurts him.
