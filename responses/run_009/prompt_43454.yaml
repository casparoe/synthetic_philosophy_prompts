answer: |-
  ### One-Paragraph Verdict  
  Case 2 resolves most cleanly: **Block public blame** because the blamer directly enabled the harm. The procedure is a 5-question flowchart that filters out cases where public blame would undermine community trust, prioritizing direct contributions to harm, unresolved hypocrisy, and situational fairness over factual accuracy. Outputs are: **Block**, **Recommend Private**, or **Proceed Publicly**.  

  ---

  ### Standing-to-Blame Decision Procedure  
  *For volunteer panel use in 20-minute prep meetings*  

  **Purpose:** Decide whether a person has the right to publicly blame someone in a formal session, *even if their accusation is true*. Focus on whether public blame would damage trust or fairness. Ignore whether the accusation is true/false—that’s separate.  

  **Questions to Ask in Order:**  
  1. **Did the blamer directly cause or worsen the problem?**  
     - *Example:* Gave bad instructions, withheld help, or created the risky situation.  
     - ✅ **Enough answer:** Clear evidence they played a key role (e.g., emails, witnesses).  
     - ❌ **Not enough:** They were just nearby or vaguely responsible.  
     - *Output:* If **YES → Block public blame** (go to "Final Output" below).  

  2. **Has the blamer done the same/similar thing recently, without fixing it?**  
     - *Example:* Blaming theft while stealing themselves last month, with no amends.  
     - ✅ **Enough answer:** Incident within ~2 years, same type of harm, no repair (apology/change).  
     - ❌ **Not enough:** Old incident (>2 yrs), different type of harm, or they made amends.  
     - *Output:* If **YES → Block public blame**.  

  3. **Did the blamer ignore a clear chance to prevent the harm?**  
     - *Example:* Voted against a fix, dismissed warnings, or had power to act but didn’t.  
     - ✅ **Enough answer:** They knew the risk and could have easily stopped it (e.g., skipped a vote they should’ve joined).  
     - ❌ **Not enough:** They didn’t know or couldn’t have changed things.  
     - *Output:* If **YES → Recommend private resolution** (e.g., "Talk directly, not here").  

  4. **Is the blamer’s past problem irrelevant or resolved?**  
     - *Example:* Old issue, unrelated to this harm, and they’ve owned it/changed.  
     - ✅ **Enough answer:** Past issue >2 yrs ago, different context, and they’ve shown change (e.g., apologized, new habits).  
     - ❌ **Not enough:** Recent, similar, or no evidence of change.  
     - *Output:* If **YES → Proceed publicly**. If **NO → Go to Q5**.  

  5. **Would public blame look like bullying or sabotage?**  
     - *Example:* Blaming a junior person they trained poorly, or someone they dislike.  
     - ✅ **Enough answer:** Power imbalance, personal feud, or blamer benefits from shame.  
     - ❌ **Not enough:** Neutral relationship, no hidden motive.  
     - *Output:* If **YES → Block public blame**. If **NO → Recommend private resolution**.  

  **Final Output (after all questions):**  
  - **Block public blame:** Formal accusation isn’t allowed. Suggest alternatives (e.g., panel addresses the harm without the blamer).  
  - **Recommend private resolution:** Blamer should discuss 1-on-1 or with a mediator first.  
  - **Proceed publicly:** No standing issue found. Handle the accusation normally.  

  ---

  ### Worked Cases  
  **Case 1: President wants to censure member for padding expenses**  
  - **Q1:** No—president didn’t cause member’s padding.  
  - **Q2:** Yes—president padded expenses before, but not "recent" (past employer, no timeline) and no evidence of *unremedied* similar conduct here. *Judgement call:* "Recent" undefined; assume >2 yrs → **NO**.  
  - **Q3:** No—president enforced policy strictly; didn’t ignore prevention.  
  - **Q4:** Yes—past issue resolved (stopped, never hid it), unrelated context.  
  - **Q5:** No—no evidence of bullying.  
  - **Output: Proceed publicly** (standing exists).  
  - **If changed:** If president padded expenses *here* 6 months ago → Q2 = YES → **Block public blame**.  
  - **Why it matters:** Hypocrisy requires *ongoing/unresolved* similarity.  
  - **Your gut test:** This output may feel wrong, but the procedure prioritizes change and context. Intuition misfires if it equates *all* past hypocrisy with lost standing.  

  **Case 2: Member blames treasurer for lax controls after voting against audit**  
  - **Q1:** No—member didn’t directly cause lax controls.  
  - **Q2:** No—no similar conduct by member.  
  - **Q3:** Yes—member voted against funding the audit that would have prevented this, ignoring a clear prevention chance.  
  - **Output: Recommend private resolution** (stop at Q3).  
  - **If changed:** If member voted *for* audit but was outvoted → Q3 = NO → proceed to Q4/Q5 → likely **Proceed publicly**.  
  - **Why it matters:** Voting against prevention is direct contribution to harm.  

  **Case 3: Senior member blames new member for confidentiality breach**  
  - **Q1:** Yes—senior member created ambiguous situation with contradictory instructions, despite warnings.  
  - **Output: Block public blame** (stop at Q1).  
  - **If changed:** If senior member gave clear instructions (no ambiguity) → Q1 = NO → check Q2–Q5. If no other issues → **Proceed publicly**.  
  - **Why it matters:** Creating the harm negates standing immediately.  

  ---

  ### What the Procedure Can’t Do (and Why)  
  1. **Severity comparisons (e.g., blamer’s offense much worse):** Not included. Volunteers can’t reliably rank harms quickly. *Fallback:* Use Q2 (unremedied similar conduct) or Q5 (bullying) as proxies.  
  2. **Blame for "narrowed options" (e.g., blamer limited accused’s choices):** Partly covered in Q1 (direct cause) and Q3 (ignored prevention). Deep nuance (e.g., structural coercion) is lost—it’s too complex for 20 mins.  
  3. **Non-hypocrisy standing issues (e.g., blamer lacks expertise):** Only handles hypocrisy, direct contribution, and prevention failures. Other issues (e.g., "you weren’t there") are excluded—too abstract for volunteers.  
  4. **Factual disputes about the accusation:** Deliberately ignored. True/false is handled separately in the main resolution process.  
  5. **Group blame or systemic factors:** Focuses on individual blamer-accused dynamics. Systemic issues need other tools.  

  **Philosophy sacrificed:**  
  - **Moral authority vs. epistemic standing:** We merge these into "fairness/trust" (Q5) for simplicity.  
  - **Forgiveness thresholds:** Q4’s ">2 years + resolved" is arbitrary but practical.  
  - **Intention vs. impact:** We focus on observable actions (what volunteers can see).  

  **Counterintuitive output check:** In Case 1, your gut says "hypocrite!" but the procedure says "proceed." This means the intuition is *over-inclusive*—not all past misconduct voids standing. The procedure avoids punishing growth.  

  **Final note:** This won’t please everyone. It prioritizes speed, detectability, and community trust over philosophical purity. Use panel consensus for judgement calls (e.g., "recent" in Q2).
