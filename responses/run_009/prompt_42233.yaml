answer: |-
  Here’s a battle-tested lesson plan targeting your exact needs, designed to surgically separate pragmatic encroachment from contextualism while preempting student pitfalls. Prioritize clarity over comprehensiveness.

  **Core Objective:** Distinguish *pragmatic encroachment* (practical stakes raise the *epistemic standard* for knowledge) from *contextualism* (the word "knows" *shifts its semantic meaning* with context).

  **Lesson Structure (50 mins):**

  1.  **Anchor the Fixed Parameters (10 mins):**
      *   **Why?** Essential groundwork. Without this, the debate dissolves into noise.
      *   **What:** Hammer home what *must* be held constant to isolate the effect of stakes:
          *   **Agent:** Same person (Sarah).
          *   **Proposition:** Same claim (P: "My car is parked in Lot B").
          *   **Evidence:** Same information (E: Sarah parked in Lot B 30 mins ago, saw the sign, has no reason to doubt it moved/ticketed/stolen *yet*).
          *   **Time:** Same moment (Right now).
      *   **How:** Use a simple whiteboard diagram: "Sarah | P | E | Time T". Emphasize: "Changing *any* of these changes the knowledge question fundamentally. We are changing ONLY the *stakes* or *situation* surrounding Sarah's assessment of P."

  2.  **Introduce the Variable: Practical Stakes & the Core Question (5 mins):**
      *   **Example:** **The Parking Validation Case (Low/High Stakes)**.
          *   *Low Stakes:* Sarah needs validation to save $5 on parking. Forfeiting $5 is annoying but trivial.
          *   *High Stakes:* Sarah is a courier delivering a life-saving organ. If her car is towed from Lot B (invalid parking), the organ is ruined, the recipient dies, and she loses her job and faces lawsuits.
      *   **Crucial Silence:** *Do not mention any change in Sarah's psychological state (doubt, anxiety) or any external context demanding justification (like a court).* Focus purely on the *consequences* of being wrong. "Does the terrible cost of being wrong *itself* affect whether Sarah *knew* P at time T, given fixed Agent/P/Evidence/Time?"
      *   **Core Question:** "With E, does Sarah *know* P in Low Stakes? Does she *know* P in High Stakes?"

  3.  **Define the Two Theses (Using the Example) (10 mins):**
      *   **Pragmatic Encroachment (PE):**
          *   "In Low Stakes, Sarah's evidence E *is enough* for knowledge. She knows P."
          *   "In High Stakes, Sarah's *same evidence E is NOT enough* for knowledge. The high stakes *raise the epistemic bar*. She does *not* know P, even though nothing about her, her evidence, or the world (regarding P) has changed – only the stakes of being wrong."
          *   **Key Point:** *Knowledge itself* is harder to achieve when stakes are high. The *truth condition* for "S knows that P" includes a stakes-sensitive component. Same concept, higher standard.
      *   **Contextualism (C):**
          *   "The word 'knows' *means something different* in a low-stakes conversation vs. a high-stakes conversation (e.g., discussing parking vs. testifying about the organ delivery)."
          *   "In a low-stakes context, 'Sarah knows P' is true because the standards for 'knows' *in that context* are low enough for E to suffice."
          *   "In a high-stakes context (e.g., a courtroom inquiry about the organ delivery), 'Sarah knows P' is false because the standards for 'knows' *in that context* are much higher, and E doesn't meet them."
          *   **Key Point:** The *meaning* of "knows" shifts. Sarah might meet the low standard meaning but not the high standard meaning. It's about the *word*, not necessarily Sarah's epistemic state changing.

  4.  **Confronting the Crucial Conflation (Your Friend's Slide) (10 mins):**
      *   **This is the moment.** After defining both *using the same example*.
      *   **The Slide:** "But if the courtroom demands more, doesn't that *mean* 'knows' means something different there?" (PE → C Conflation).
      *   **The Surgical Strike:**
          1.  **PE says:** The courtroom demands more *because knowledge itself requires more when the stakes are high for Sarah*. They are demanding *more of the same thing* (knowledge) due to Sarah's practical situation. Sarah's epistemic position is *objectively weaker* relative to the high stakes.
          2.  **C says:** The courtroom demands more *because the word 'knows' in that conversational context sets a higher semantic standard*. They might be demanding Sarah meet a standard she never needed to meet before, even if her actual epistemic relation to P hasn't changed. The *meaning* of the question changed.
      *   **Analogy (Careful):** PE: Needing a stronger lock for a vault (same concept: security, higher standard). C: Using "secure" to mean "has a lock" in one conversation vs. "has a biometric scanner" in another (different meanings/concepts).
      *   **Emphasize:** PE changes *what it takes to know* given stakes. C changes *what "knows" means* given conversational context. The courtroom demanding more is *explained differently*.

  5.  **Addressing Key Misconceptions & the Reductio (10 mins):**
      *   **(1) Psychological Claim (Believing Harder):**
          *   **When:** Immediately when introducing stakes or if a student suggests it. Preempt it.
          *   **Crush it:** "Stakes might *cause* Sarah to *doubt* or *seek more evidence*, but PE isn't about that. PE says: *Even if Sarah feels just as confident in High Stakes as she did in Low Stakes*, her evidence E might be enough for knowledge in Low Stakes but *not* in High Stakes. It's about the *objective epistemic status* relative to stakes, not her psychology." Refer back to fixed evidence/agent/time.
      *   **(2) "Context Changes Knowledge" Conflation:** Handled explicitly in Step 4.
      *   **(3) The Testimony Reductio:** "If PE is true, a witness under threat knows *less* than the same witness relaxed?"
          *   **When:** During Q&A after steps 3-4, or proactively present it as an implication.
          *   **Absorb it:** "Exactly! This is a *feature* of PE, not necessarily a bug, though it's counterintuitive. PE proponents *accept* that the threatening situation (high stakes for the witness if wrong) can make it true that the witness *doesn't know* P *at that moment*, even if they knew it moments before when relaxed (low stakes). Their *epistemic position relative to the truth of P* is weakened by the high stakes of being wrong. Contextualists avoid this: the relaxed witness and the threatened witness might both meet the *same* (low) semantic standard for 'knows' used in their casual chat earlier; the courtroom just uses a *different, higher* standard." **Acknowledge the weirdness:** "PE forces us to accept that knowledge can be lost *without any change in evidence or the world*, just by stakes rising. That's controversial! But it's distinct from claiming the *word* changed meaning."

  6.  **Diagnostic Closing Question (5 mins):**
      *   **The Question:** "Imagine Sarah is in the High Stakes (organ delivery) situation. Could a defender of Pragmatic Encroachment and a defender of Contextualism *both* agree that the courtroom is right to say 'Sarah does not know her car is in Lot B'? Could they agree *while giving completely different explanations* for why the courtroom says that?"
      *   **Why it works:** It forces students to see that both views can *predict* the same linguistic behavior ("We say she doesn't know in court") but for fundamentally different *reasons* (PE: Knowledge requires more evidence due to stakes; C: The word "knows" means something stricter in court). Grasping the distinction means seeing the *explanatory difference* behind a shared surface observation. Students merely comfortable with jargon will struggle to articulate the distinct explanations.

  **What to Explicitly Decline Covering:**
  *   **Say This:** "Today is *only* about understanding the *distinction* between these two ways of explaining how practical stakes *seem* to affect knowledge claims: Pragmatic Encroachment vs. Contextualism. We are **not** covering: Which one is *correct*? Detailed arguments for/against PE (like subject-sensitive invariantism) or C. Other responses to skepticism or the lottery paradox. Deep dives into the semantics of 'knows'. Keep focused on the split in the road we mapped today."

  **Key to Success:**
  *   Relentlessly refer back to the **fixed parameters** (Sarah/P/E/Time).
  *   Use the **Parking Validation Case** consistently. Drill: "Same Sarah, same parking memory, same time. Only stakes change."
  *   **Contrast Explanations:** Constantly ask: "Is this explanation saying the *standard for knowing changed* (PE) or the *meaning of 'knows' changed* (C)?"
  *   **Preempt Psychology:** Stomp out "believing harder" immediately.
  *   **Embrace the Reductio:** Use it to crystallize PE's implications.

  This structure forces the distinction by isolating the variable (stakes), defining the theses *against* that fixed background, confronting the core conflation head-on, and using a diagnostic question focused on explanatory divergence. Good luck with the section!
