prompt: |-
  I teach a second-year module on collective decision-making — about sixty students who have had a term of introductory rational-choice material (preference orderings, expected utility) but no formal game theory. Next week I have a fifty-minute lecture on the rational-choice paradox of voting: the problem that the expected instrumental payoff of a single vote in a large election is so small relative to its cost that high turnout, rather than abstention, is what cries out for explanation.

  Please don't give me the lecture itself; give me a plan for it, in British English. Specifically:

  1. The order of the pieces, and why that order — which ideas must be in place before the paradox can be stated so that it lands as a paradox rather than as a truism about lazy people. I'd expect the expected-utility machinery to come in somewhere, but I want you to say where the empirical magnitude of the probability of being pivotal should sit relative to the normative sting: whether students should see the arithmetic before or after they've decided they already know the conclusion.

  2. The one carrying example — a concrete election with actual numbers for electorate size, the cost of voting, and the benefit at stake, so students can watch the arithmetic swallow the stakes. Please say what the example must contain and what it must lack: in particular, it shouldn't be a small committee where being pivotal is genuinely plausible, since that lets students file the paradox as a matter of scale rather than of structure. I'd also like a variant worked in where the voter counts everyone's benefit rather than only her own, so students see that the conclusion is robust even to a hundredfold inflation of the stakes — but say whether you'd front-load that or hold it as a rebuttal absorber.

  3. The misconceptions students will bring or form, in the order they'll actually surface, and where in the arc each should be headed off. The ones I can predict: (a) confusing this paradox with Condorcet's cycling paradox and with Arrow's theorem, which share the name across different literatures; (b) hearing the civic-duty term in the pB − C + D calculus as a knock-down refutation rather than as a promissory note that itself demands explanation; (c) the thought that if everyone reasoned like the abstaining voter, no one would vote, so the conclusion must be wrong — a smuggling-in of collective rationality that students won't notice themselves doing; and (d) the overcorrection that one vote literally never matters, even in electorates of two hundred. But there will be others I haven't predicted, and I'd like to know where in the sequence each belongs rather than getting a flat list.

  4. What I should explicitly decline to cover at this level, and say so aloud to the students. I'm thinking of the minimax-regret response and of any serious treatment of mixed-strategy equilibria in turnout models, both of which I can name-drop without teaching — but tell me if something else belongs behind that line more urgently.

  5. One check-for-understanding question for the tutorial sheet that would separate a student who has grasped the structure of the problem from one who has merely learned the slogan that voting is irrational — and a sentence on what a good answer to it looks like and what a memorised answer would say instead.
reasoning: |-
  Okay, the user is teaching a second-year module on collective decision-making. They need a lecture plan on the paradox of voting. Let me start by understanding their main concerns. They want the paradox to land effectively, not seem like a truism. The students have some background in rational choice but no game theory. 

  First, the structure. The user mentioned that the order is crucial. I need to ensure students see the paradox as surprising. Starting with the intuitive view that voting matters, then introducing the probability of being pivotal. The expected utility formula should come after establishing the initial intuition. That way, the calculation challenges their preconception.

  Next, the carrying example. It must be a large electorate to show scale isn't the main issue. Numbers like 100,000 voters, close race, cost of voting in time/money, benefit of preferred outcome. Show that even with high stakes, the probability is minuscule. The altruism variant should come after the initial paradox to show robustness, acting as a rebuttal absorber.

  Misconceptions: Arrow and Condorcet confusion first. Clarify early that this is about instrumental rationality. Then, the civic duty point (pB - C + D) as a promissory note. The collective rationality fallacy ("if everyone abstained...") needs addressing by distinguishing individual vs. collective. Overcorrection about small electorates should be handled by discussing pivotality in smaller groups but emphasizing large-scale irrelevance.

  Exclusions: Minimax-regret and mixed-strategies. Mention them as advanced topics without details. The check question should test understanding of the structure, not just memorization. A question about why a voter abstains despite caring, requiring grasp of pivot probability and cost.

  Also, the user wants British English terms like "tutorial sheet" and "queue". Need to ensure the examples use UK context, like GBP and local references. Timing each section is important for a 50-minute lecture. Allocate time for each part, especially misconceptions which might take longer with student interactions.

  Finally, the tutorial question should force students to apply the expected utility calculation, showing they understand the components and why the cost outweighs the expected benefit. Avoid letting them just parrot the slogan without understanding the mechanics.
answer: |-
  Here’s a structured 50-minute lecture plan addressing your requirements, using British English and pedagogical sequencing to maximise impact:

  **Lecture Title:** *The Puzzle of Participation: Why Voting Defies Rational Choice*

  **Core Sequence & Rationale:**  
  *(Total: 50 mins)*  

  1.  **Hook & Intuition Pump (5 mins):**  
      - *Content:* Start with a show-of-hands: "Who believes their single vote could change the outcome of a UK general election?" Discuss why *feeling* influential is intuitive. Contrast with rational-choice foundations: individuals act instrumentally when benefits > costs.  
      - *Why first?* Establishes the *prima facie* case for voting’s rationality. Without this, the paradox seems trivial ("people are lazy"), not paradoxical.  

  2.  **The Machinery: Expected Utility of Voting (10 mins):**  
      - *Content:* Revisit EU: `EU(vote) = [P(pivot) × B] - C`. Define:  
          - `B` = Utility difference if preferred candidate wins vs. loses (e.g., £1000 lifetime tax saving).  
          - `C` = Cost of voting (time, travel; monetise as £5).  
          - `P(pivot)` = Probability your vote breaks a tie.  
      - *Key move:* Stress that `P(pivot)` is *not* subjective confidence but a *calculated probability* under uncertainty.  
      - *Why now?* EU must precede the pivot probability calculation to frame the paradox formally.  

  3.  **The Carrying Example: Crunching the Numbers (10 mins):**  
      - *Example Parameters:*  
          - Electorate: **100,000 voters** (large enough to negate "scale" dismissal).  
          - Expected closeness: **Toss-up election** (P=0.5 per candidate).  
          - `B` = **£1,000** (significant personal stake).  
          - `C` = **£5** (modest: 30 mins at £10/h wage).  
      - *Calculation:*  
          `P(pivot) ≈ 1 / √(π × N/2)` (Simple binomial approximation).  
          `P(pivot) ≈ 1 / √(3.14 × 50,000) ≈ 1/396 ≈ 0.0025`.  
          `EU(vote) = (0.0025 × £1000) - £5 = £2.50 - £5 = -£2.50`.  
      - *Outcome:* **Negative EU → Abstain is rational.**  
      - *Why this example?* Large `N` eliminates "small committee" escape hatch; huge `B` makes the negative result shocking.  

  4.  **Robustness Test: Altruism Inflation (5 mins):**  
      - *Variant:* "What if you care about *everyone's* welfare? Let `B_total = B_you × 100,000 = £100m`."  
          `EU(vote) = (0.0025 × £100,000,000) - £5 = £250,000 - £5 = £249,995`.  
      - *Paradox holds:* **But `P(pivot)` is now ~1/396 for a *tie* in a 100k electorate. In reality, one vote only matters in *exact* ties. `P(exact tie)` in a binomial with N=100,000 is astronomically small—closer to 10^−300` range. My approximation (`1/√(πN/2)`) is a standard simplification for the probability of being decisive in a close election (P=0.5). For N=100,000:  
          `√(π × 50,000) ≈ √(157,000) ≈ 396.2 → P≈1/396 ≈ 0.0025`.  
      - *Actual P(exact tie) formula:* `P_tie = [C(N, N/2)] × (0.5)^N` for even N.  
          For N=100,000:  
          `C(100,000, 50,000) ≈ 2^100,000 / √(π × 50,000)` (Stirling's approx).  
          `P_tie ≈ 1 / √(π × 50,000) ≈ 1/396` (same as above).  
      - **So the approximation holds for the *decisiveness* probability in a close election.**  
      - *Why include?* Shows paradox withstands wildly charitable assumptions. Place *after* initial shock—**absorbs the "but I care deeply!" rebuttal** while deepening confusion.  

  5.  **Stating the Paradox (5 mins):**  
      - *Formalise:* "Instrumental rationality predicts near-zero turnout in large elections. Yet we observe high turnout. This is the paradox."  
      - *Why last?* Only now, with EU and concrete numbers, does the conclusion feel *surprising* and analytically rigorous—not a truism.  

  ---

  **Misconceptions & Deflection Sequence:**  
  *(Integrated into the above flow)*  

  1.  **"Isn't this Arrow/Condorcet?" (Pre-empt @ start)**  
      - *When:* During lecture intro, after stating the topic.  
      - *Deflection:* "A common confusion! Arrow’s theorem is about *aggregating preferences*, Condorcet’s about *majority cycles*. This is distinct: it’s about *individual participation incentives* under instrumental rationality."  

  2.  **"Civic Duty (D) Solves It!" (Address during EU setup)**  
      - *When:* Introducing the EU formula, add `+ D` term.  
      - *Deflection:* "Yes, we often write `EU = P×B - C + D`. But `D` isn’t a magic bullet—it *names* the problem (why do people derive utility from duty?) rather than solving it. We’d need a rational-choice explanation for why `D > C`."  

  3.  **"If Everyone Abstained, Democracy Collapses!" (Triggered after paradox stated)**  
      - *When:* After stating the paradox, invite reactions.  
      - *Deflection:* "Ah, you’re thinking *collectively*! But rational choice is about *individual* incentives. My abstention won’t cause everyone else to abstain (I’m negligible). It’s a collective action problem, not a logical error."  

  4.  **"So One Vote *Never* Matters?" (Post-paradox clarification)**  
      - *When:* After Q&A following paradox statement.  
      - *Deflection:* "Not never—just vanishingly rarely in large elections. In small groups (e.g., 100 voters), `P(pivot)` might be ~8% if tied. The paradox bites as electorate size grows."  

  ---

  **Explicit Exclusions (2 mins):**  
  *(State clearly during concluding remarks)*  
  > “We stop here for now. Notably, we **exclude**:  
  > - The *minimax regret* approach (voting to avoid regret if your candidate loses by one).  
  > - *Game-theoretic models* with mixed-strategy equilibria (where randomness induces turnout).  
  > These are sophisticated responses—but grasping this core paradox is essential before tackling them.”  

  ---

  **Tutorial Question & Marking Guide:**  
  *(Distribute at lecture end)*  

  **Question:**  
  > "In a London borough council election with 10,000 voters, Ali faces a £3 cost to vote. Her preferred party would save her £200 in services if elected. Polls show a dead heat. Using rational choice calculus, explain why Ali might abstain—even if she cares intensely about the outcome. Where does the intuitive 'every vote counts' slogan fail?"  

  **Good Answer (Grasp):**  
  - Calculates `P(pivot) ≈ 1/√(π×5000) ≈ 1/125 ≈ 0.008`.  
  - Computes `EU(vote) = (0.008 × £200) - £3 = £1.60 - £3 = -£1.40`.  
  - Concludes: Negative EU → abstention rational.  
  - Explains slogan’s failure: Confuses *collective* impact of *all* votes with *individual* pivot probability.  

  **Memorised Answer (Slogan-Level):**  
  - Parrots "voting is irrational" without calculations.  
  - Mentions "costs exceed benefits" but doesn’t quantify pivot probability.  
  - Uses vague phrases like "one vote doesn’t matter" without engaging EU logic.  

  ---

  **Timing Buffer:**  
  Built-in flexibility: Adjust example calculation (+/-2 mins) or Q&A depth (+/-3 mins) to hit 50 mins. This structure ensures the paradox *lands* by making students confront their intuition with inescapable arithmetic.
