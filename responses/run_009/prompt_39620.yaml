answer: |-
  Below is a specification of desiderata for a theory of "what matters in survival," grounded in your cases and conceptual distinctions. I'll mark each desideratum as **non-negotiable** (N) (widely accepted as essential) or **parochial** (P) (demanded by specific schools), flag tensions, and identify the most eliminative requirement.

  ---

  ### **Core Desiderata for a Theory of What Matters in Survival**  
  *(Motivating cases in italics; "correct" handling defined)*  

  1. **Prudential Significance (N)**  
     - *Motivation*: Branch-line case. If I step into the teletransporter, should I anticipate the replica's experiences *as mine*? If the original survives briefly, should I dread Earth-bound pains?  
     - *Requirement*: The theory must explain when (and why) future beings warrant *egoistic concern* (e.g., fear of their pain, anticipation of their joys).  
     - *Correct handling*: Either (a) the replica warrants full prudential concern (discounting the Earth-bound original) or (b) concern is split/attenuated. But it must *explain* the discounting/transfer.  

  2. **Handling Fission (N)**  
     - *Motivation*: Slow-fission case. If my hemispheres are transplanted 30 years apart, do *both* resulting persons inherit my survival? If only one, which?  
     - *Requirement*: The theory must deliver consistent, non-arbitrary verdicts on fission (symmetrical or asymmetrical outcomes) without covertly presupposing identity.  
     - *Correct handling*: Either (a) survival is shared/non-binary (e.g., "I survive as both"), or (b) survival is determinate but explained by asymmetric relations (e.g., psychological connectedness). Avoids brute stipulation.  

  3. **Accounting for Temporal Gaps/Discontinuity (N)**  
     - *Motivation*: Year-old scan. If a replica is created from a year-old scan, why does it feel like "I" am not the replica? What happened to the stranded year?  
     - *Requirement*: The theory must explain the intuitive *loss* or *discontinuity* when psychological connections are degraded by time or interruption.  
     - *Correct handling*: Explains why the replica (from stale data) isn't the proper target of anticipation *for the original at scan-time*—e.g., due to lack of causal/immediate psychological ties.  

  4. **Distinguishing Identity from What Matters (N)**  
     - *Motivation*: Ethical vs. prudential questions. Should the replica pay my debts? Should I *fear* its destruction? These often pull apart.  
     - *Requirement*: The theory must decouple numerical identity (e.g., for legal responsibility) from prudential/personal *concern*. Survival can matter without identity.  
     - *Correct handling*: Allows that identity may be necessary for ethics (e.g., promise-keeping) but *not* for prudence (e.g., teletransporter anticipation).  

  5. **Gradual Change Compatibility (N)**  
     - *Motivation*: Neuroscience (neural turnover, aging). If cells and memories replace gradually, am I the same person? Why don’t we treat gradual change like teletransportation?  
     - *Requirement*: The theory must explain why gradual psychological/biological continuity (e.g., over 50 years) supports survival, while abrupt replication might not.  
     - *Correct handling*: Avoids implying that we "die" constantly via cellular turnover. Grounds survival in *degree of continuity*, not all-or-nothing identity.  

  6. **Non-Arbitrariness in Borderline Cases (P)**  
     - *Motivation*: Split-brain patients. If hemispheres control separate behaviors, is there one person or two?  
     - *Requirement*: Demands a *determinate* answer in all cases (parochial to some realist views).  
     - *Correct handling*: Either delivers determinacy or explains why indeterminacy is acceptable (e.g., survival is scalar).  
     - **Tension**: Conflicts with (2) and (5). Fission/gradience may *require* indeterminacy (per Parfit).  

  7. **Ethical Neutrality (P)**  
     - *Motivation*: Debts/promises. Some theories (e.g., animalism) tie obligations strictly to biological identity.  
     - *Requirement*: Demands that what matters for ethics (e.g., promises) aligns with prudential concern (parochial to some ethical views).  
     - *Correct handling*: Either unifies ethics/prudence or explains their divergence (e.g., "I should care about the replica, but it needn’t repay my loans").  

  ---

  ### **Key Tensions & Meta-Constraints**  
  - **Fatal tension**: Desiderata (2) *Fission* + (6) *Determinacy* + (5) *Gradual Change* may be **jointly unsatisfiable**. Fission forces a choice: accept non-binary survival (violating 6) or arbitrary asymmetry (violating 5’s gradualism).  
  - **Most eliminative requirement**: **Handling Fission (2)**. It forces theories to confront:  
    - Whether survival can be "branched" (eliminates strict identity theories).  
    - Whether psychology alone suffices (eliminates animalism if fissioned humans aren't identical).  
    - Whether causal continuity is necessary (eliminates no-continuity views).  
  - **Neuroscience’s role**: Must *inform* (e.g., split-brain cases test psychological unity) but not *dictate* metaphysics. A good theory uses science to refine "continuity," not reduce it to biology.  

  ---

  ### **Brief Scorecard of Major Theories**  
  | **Theory**               | **Strengths**                                  | **Fails Desiderata**                         |  
  |--------------------------|-----------------------------------------------|---------------------------------------------|  
  | **Pure Psychological-Continuity** | Handles teletransport prudence (1,4); explains year-old scan (3). | Fission (2): Can’t non-arbitrarily choose one branch. Gradual change (5): Implies "death" via amnesia? |  
  | **Animalism**            | Explains gradual change (5); ethical unity (7). | Prudential significance (1): Why care about teletransport? Fission (2): Only one body survives? |  
  | **Closest-Continuer/No-Continuity-Needed** | Handles fission (2) flexibly; no determinism (6). | Year-old scan (3): Why care about immediate continuity? Ethical neutrality (4): Prudence/ethics may diverge wildly. |  

  ---

  ### **Conclusion**  
  The desiderata reveal that **no theory satisfies all constraints without cost**. The deepest tension is between *indeterminacy* (required by fission/gradience) and *determinacy* (demanded by ethics/realism). The **branch-line case** is the litmus test for prudential significance, while **slow fission** exposes the need to reject binary identity or accept arbitrariness. A theory prioritizing *what matters* will likely treat survival as **degree-based and potentially branching**, sacrificing determinacy (6) and strict ethical unity (7). The list itself shows why debates persist: competing desiderata reflect irreconcilable intuitions about selfhood. Start your reading by asking which cost each theorist is willing to pay.
