answer: |-
  ### Teaching Plan: Revealed Preference and Utility

  #### **Dependency Order**  
  *(Start with distrusting "utility" to avoid tautology perception)*  
  1. **Begin with observed choices** (5 mins): Present a simple choice scenario (tea vs. coffee at same price). Ask: "What can we infer?" Highlight that **choice reveals preference** but note a single choice is limited—it only tells us "tea > coffee in this context." *Presupposes no prior theory; builds from raw observation.*  
  2. **Introduce a minimal pattern of choices** (10 mins): Expand to two budget constraints. Show how **multiple choices reveal consistent preferences** (e.g., tea chosen when cheap, coffee when tea is expensive). *Presupposes understanding that preferences must be tested across constraints.*  
  3. **Distrust "utility" as a substance** (10 mins): Explicitly reject the idea of utility as "happiness units." Argue: "If choice is all we see, utility can’t be a hidden reservoir—it must be derived from behavior." *Presupposes step 2; sets up utility as a tool, not an assumption.*  
  4. **Define utility as bookkeeping** (10 mins): Now frame utility as a convenient numbering system for rankings revealed by choices. Stress: "Utility is ordinal—it only records order, not size." *Presupposes steps 1–3; utility emerges from preferences, not vice versa.*  
  5. **Address normative misconceptions** (5 mins): Last, clarify that revealed preference ≠ "good" choices. *Presupposes steps 1–4; avoids conflating positive and normative too early.*  

  **Why this order?**  
  Starting with choice (not utility) prevents the tautology. If you begin with utility, students see "choice reveals preference" as circular ("preference" is defined by utility, which is defined by choice). By first building preference from observable choices, utility enters as a *consequence*, not an axiom. This order forces students to confront the thinness of single-choice data early, making utility’s purpose clearer.

  ---

  #### **Carrying Example**  
  **Example**: A person faces two scenarios:  
  - **Scenario 1**: Tea = $1, Coffee = $1. Chooses tea.  
  - **Scenario 2**: Tea = $3, Coffee = $1. Chooses coffee.  

  **Must contain**:  
  - Two different budget constraints (price changes).  
  - A consistent pattern: Tea is preferred when prices are equal, but coffee is chosen when tea becomes relatively expensive.  

  **Must lack**:  
  - Direct contradictions (e.g., choosing tea when expensive and coffee when cheap—this violates consistency).  
  - Any mention of "why" (e.g., taste, happiness). Focus solely on choices.  

  **Why this works**:  
  - **Minimal**: Two observations are the smallest pattern showing how preferences *respond to constraints*.  
  - **Reveals ordinal ranking**: Scenario 1 reveals tea ≻ coffee. Scenario 2 confirms coffee ≻ tea *when tea is costly*, but doesn’t contradict the first ranking (budgets differ).  
  - **Avoids overload**: No math (e.g., indifference curves) or jargon (e.g., "marginal utility").  

  ---

  #### **Misconceptions**  
  | Misconception | Where Intercepted | How |  
  |---------------|-------------------|-----|  
  | **(a) Utility as measurable substance** | Immediately after introducing utility (step 4) | **Trap it**: Ask: "If utility isn’t observed, how can we measure it? We can’t—it’s just numbers we assign to rankings." Use analogy: "Like numbering athletes by race rank: #1 isn’t ‘better’ by a fixed amount than #2." |  
  | **(b) Revealed preference = rational/good choices** | Deliberately last (step 5) | **Delay reason**: Early focus must stay positive (what *is* chosen). Address late to avoid normative distractions. **How**: Contrast with harmful choices (e.g., "If someone chooses cigarettes, revealed preference describes the choice but doesn’t endorse it"). |  
  | **(c) Indeterminate utility comparisons over time** | During utility definition (step 4) | **Trap early**: After explaining ordinality, ask: "Can we say ‘utility doubled’? No—the scale is arbitrary. We can only compare bundles the person *actually chose between*." |  

  **Why this ordering?**  
  - (a) must be crushed **before** utility is accepted, or it corrupts everything.  
  - (c) must follow (a) to show why cardinal claims fail.  
  - (b) is left last because it’s a *normative* distraction; addressing it too early risks derailing the *positive* theory.  

  ---

  #### **Closing Check Question**  
  **Question**: *"If we double all utility numbers for a person’s choices, does this mean they are twice as happy? Why or why not?"*  

  **Why it works**:  
  - Tests **ordinality**: Correct answer ("No—only rankings matter, not absolute values") forces recognition that utility is a ranking tool.  
  - Distinguishes **internalization** from rote learning: Students must articulate why rescaled numbers preserve preferences.  
  - **Avoids** vague questions (e.g., "What is utility?").  

  ---

  #### **Declined Topics**  
  1. **Interpersonal utility comparisons**:  
     - *Reason*: "We’ve only defined utility for one person. Comparing across people requires cardinal assumptions we reject."  
  2. **Utility monster** (Nozick’s thought experiment):  
     - *Reason*: "It relies on cardinal utility and normative ethics, which are beyond our positive, ordinal framework."  

  **Why decline these?**  
  They violate the session’s core: utility as *ordinal* and *individual*. Introducing them risks reviving misconceptions (a) and (b).  

  ---

