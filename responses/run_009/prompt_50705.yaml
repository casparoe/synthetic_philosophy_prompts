prompt: |-
  I've noticed an odd combination of norms within professional historiography, and I'd like to understand what theory of explanation the discipline is implicitly committed to — or whether it's committed to anything coherent at all.

  Consider the following cluster of practices and norms, all of which are standard:

  1. Training, methodology sections, and peer review treat "hindsight," "presentism," "anachronism," "outcome bias," and "Whig history" as cardinal sins. The historian is faulted for explaining the outbreak of the First World War as though contemporaries could see it coming, or for treating a decision made under deep uncertainty as though its consequences were visible to the person making it. The agent's open future is supposed to be respected.

  2. At the same time, the discipline's flagship genre is outcome-driven in title and design: books and courses organized as the origins, the road to, the collapse of, the making of some known result. Historians select topics because of how things turned out, enter archives already knowing the ending, and pick from the record the threads that run forward to it. Nobody proposes to research the run-up to a crisis that never happened, and no press would publish it.

  3. Referees add a further, apparently independent demand: that the author demonstrate contingency — that at some juncture things could plausibly have gone otherwise — while also insisting that the cited causes genuinely carry the outcome rather than merely accompany it. The monograph must make the result both explicable and avoidable.

  4. The publication market runs on narrative shape. A book whose conclusion is that the outcome issued from an accumulation of low-grade frictions, none individually decisive, several of which nearly failed to occur, is hard to publish and harder to assign in a seminar; a book with an arc — mounting pressure, a turning point, resolution — is not. Individual historians are told to resist the narrative fallacy, yet the collective structure of the discipline seems to guarantee it.

  What I want to know is what this cluster presupposes about historical explanation. Some candidate readings, none of which I'm confident in:

  - Perhaps the discipline presupposes a distinction borrowed from statistics: using the outcome to generate hypotheses is legitimate, using it as a premise of inference is not. But historians never receive fresh data — they go back to the same outcome-loaded archives — so there is no held-out set on which a retrospective conjecture could be tested. Can the generate/test distinction survive the absence of anything like a second sample?
  - Perhaps it presupposes a kind of double vision: a good narrative must render the outcome intelligible to the reader, who knows it was coming, while accurately representing it as an open question to the agents, who did not. The genre title ("the road to X") then encodes both perspectives at once. But is that a theory of explanation, or just a description of a rhetorical accomplishment — and is it even achievable, since selection of detail is itself retrospective?
  - Perhaps the anti-hindsight norm is not an epistemic norm at all but a norm of display — don't let the reader see the outcome shaping your inquiry — and the discipline knows, at the aggregate level, that outcome-shaped topics and narrative-shaped publications will produce hindsight bias regardless of individual historians' virtues, much as a casino profits while individual gamblers sincerely intend to win.

  Please reconstruct the implicit theory as best it can be reconstructed: which parts of the practice are strictly required by that theory, which merely fit well with it, and where the practice is underdetermined such that rival theories of explanation would license it too. Then tell me what a historiography built on a rival theory would have to change — for instance, one that treated every retrospective narrative as merely one of several accounts equally well supported by the record, or one that explained non-events with the same seriousness as events. Finally, if you think the puzzle is badly posed — say, because using the outcome to select what to explain is different enough from hindsight bias that no single implicit view needs to cover both, or because the contingency demand in (3) simply tracks a different norm than the causal demand does — please say so plainly rather than manufacturing a unified theory where the practice may simply be making incompatible demands.
reasoning: |-
  Okay, the user is grappling with a fascinating paradox in historiography. They've observed that historians simultaneously reject hindsight bias while structuring their entire discipline around known outcomes. This tension manifests in training norms (condemning presentism), genre conventions (outcome-driven narratives), peer review demands (simultaneous contingency and causality), and market pressures (preference for dramatic arcs). 

  The user is clearly well-versed in historical methodology - they notice how historians "enter archives already knowing the ending" yet must pretend agents didn't. Their frustration with the "narrative fallacy" is palpable. They're not just asking for textbook answers but probing whether the field has coherent epistemological foundations.

  Hmm, their proposed solutions are sophisticated but incomplete. The statistical analogy fails because history lacks control groups. The "double vision" idea captures the rhetorical ideal but not the mechanics. And the "norm of display" theory rightly questions if anti-hindsight rules are performative. 

  What they might be missing is how professional history evolved to solve practical problems. The outcome-focus isn't just market-driven - it's how humans make meaning from time. When they ask about explaining non-events, they're touching on counterfactual history's marginalized status. 

  The real pain point seems to be: can historians claim objectivity while building narratives shaped by present concerns? That's why they want to know what rival theories would change. Underneath this academic question, I sense someone wrestling with whether history can ever be "true" given its constructed nature.

  Their challenge about contingency vs causality is particularly sharp. Peer reviewers demanding both "it was avoidable" and "it was inevitable" is indeed paradoxical. This connects to deeper philosophical tensions - free will vs determinism, structure vs agency. 

  I should acknowledge that the discipline might simply tolerate inconsistency. But that feels unsatisfying. Better to show how historians navigate these tensions through what I'll call "constrained retrospection" - using outcomes heuristically while methodologically bracketing them. 

  For rival theories, I'll contrast radical constructivism (all narratives equally valid) and event-symmetric history (treating non-events seriously). The user will appreciate concrete alternatives since they dislike "manufactured" unity. 

  Most importantly, I must resist false resolution. The tensions are real. The art lies in how historians sustain productive double vision - like seeing both duck and rabbit in the famous illusion. That's not incoherence but professional skill honed against the limits of human temporality.
answer: |-
  Your dissection captures a profound tension at the heart of professional historiography. The discipline *does* operate with an implicit theory of explanation—**constrained retrospection**—but it navigates unresolved philosophical tensions rather than achieving full coherence. Here's a reconstruction:

  ### The Implicit Theory: Constrained Retrospection
  1. **Core Epistemic Principle**:  
     Historical explanation requires reconstructing *past causality* (why events unfolded as they did *from the agents' perspective*) while respecting the *temporally bounded knowledge* of historical actors. The outcome is a *heuristic filter* for selecting significant questions, but **not a causal premise**.  

  2. **Distinction Between Selection and Explanation**:  
     - **Legitimate**: Using the outcome to identify *which chains of causation* merit study (e.g., "Origins of WWII" is chosen *because* WWII happened).  
     - **Illegitimate**: Importing outcome knowledge into causal reasoning (e.g., "Chamberlain appeased Hitler *foolishly* because he couldn't see WWII coming").  
     This mirrors statistics' hypothesis-generation vs. inference distinction, *despite* the absence of fresh data. Historians "test" by:  
     - **Internal coherence**: Does the narrative fit *all* relevant contemporary evidence?  
     - **Counterfactual robustness**: Could minor changes (per peer-review contingency demands) alter the outcome?  

  3. **Double Vision as Explanatory Ideal**:  
     A successful narrative *simultaneously* achieves:  
     - **Retrospective intelligibility**: Showing readers *why* the outcome occurred (causes sufficient to produce it).  
     - **Prospective uncertainty**: Showing agents acting without foreknowledge (causes not guaranteeing the outcome).  
     *This is a theory of explanation*: It holds that historical understanding requires mapping the *space of possibilities* agents faced, not just the actualized path.  

  4. **Contingency and Causality**:  
     Peer reviewers demand both because:  
     - **Contingency** ensures historians avoid determinism (respecting agency and alternative futures).  
     - **Causality** ensures they avoid trivializing causes (showing why *this* outcome, not others, emerged).  
     The tension is productive: It forces historians to identify *causes that mattered* (e.g., "The assassination *triggered* war because tensions were high, but war wasn't inevitable until July 28").  

  5. **Narrative as Necessary Compromise**:  
     The market preference for arcs isn't *strictly* required by the theory but *fits* its emphasis on process. Linear narratives are tolerated because:  
     - They efficiently organize complex causality.  
     - "Mounting pressure → turning point" can reflect *contemporaneous perceptions* (e.g., diplomats sensing crisis).  
     The "frictions" monograph is hard to publish because it challenges narrative conventions, not necessarily the theory.  

  ### Where Practice Is Underdetermined/In Tension
  - **Outcome Selection vs. Hindsight Bias**:  
    Using outcomes to select topics *is* distinct from hindsight bias, but the line blurs in practice. Archivists *do* preserve records anticipating "significant" events, creating a survivorship bias. The theory accepts this pragmatically: All history is written from a present standpoint, but *methodological rigor* (sourcing, contextualization) mitigates distortion.  
  - **Contingency Demands**:  
    A Marxist historian might see WWII as structurally inevitable; a critic might call this determinism. The theory *requires* contingency only insofar as actors perceived alternatives—not metaphysical possibility.  

  ### Rival Theories & Required Changes
  1. **Radical Constructivism**:  
     - **Premise**: All narratives are equally supported by the record; outcomes don't "cause" past events.  
     - **Changes**: Historians would write parallel histories (e.g., "1914: Five Paths Europe Might Have Taken"). Topics like "The Non-Collapse of the Habsburg Empire, 1848" would be common. Outcome-driven titles vanish. Peer review would prioritize interpretive novelty over causality.  
     - **Challenge**: Erases distinction between significant/trivial causes.  

  2. **Event-Symmetric History**:  
     - **Premise**: Explain non-events (e.g., "Why No Nuclear War in 1962?") with the same rigor as events.  
     - **Changes**: Archives would be mined for "near misses" (e.g., almost-passed reforms, failed revolts). Causality focuses on *stability mechanisms*. Narrative structures shift from arcs to "equilibrium analyses."  
     - **Challenge**: Risk of overemphasizing fragility ("We almost had nuclear war daily!").  

  3. **Strict Determinism**:  
     - **Premise**: Outcomes were inevitable; contingency is illusion.  
     - **Changes**: No peer-review demand for "avoidability." Hindsight bias ceases to be a sin—historians *should* judge past actions by outcomes. Titles like "The Inevitable Revolution" dominate.  
     - **Challenge**: Erases human agency.  

  ### Is the Puzzle Badly Posed?
  **Partly**. The norms target *distinct problems*:  
  - **Anti-hindsight** = epistemic caution (don't misattribute knowledge).  
  - **Outcome-driven topics** = pragmatic significance-filtering.  
  - **Contingency + causality** = anti-determinism + anti-accidentalism.  
  - **Narrative shape** = cognitive necessity + cultural convention.  

  **But**: The *tension is real and irreducible*. Historians must:  
  - Use the present to interrogate the past, while not projecting the present onto the past.  
  - Show why something happened, without implying it *had* to happen.  
  The discipline's "incoherence" reflects the dual nature of history: It studies a *determinate past* (the outcome is fixed) through *indeterminate experiences* (agents faced open futures). **Constrained retrospection** is the best imperfect tool for this.
