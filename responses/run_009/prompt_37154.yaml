prompt: |-
  Write me a corporate FAQ / complaints-handling policy, around 650 words, for a fictional budget airline (call it whatever you want, something like Dialethiair or Paraconsistent Pacific) that has officially adopted dialetheism as its customer relations philosophy. Some of their flights both departed and did not depart. A gate can be simultaneously the correct gate and the wrong gate. Many refunds are both owed and not owed.

  The humor has to come from getting the logic right, not from "lol contradictions are crazy." Specifically:

  - The airline is paraconsistent, NOT trivial. A single true contradiction in their operations does not entitle every passenger to every form of compensation, and the FAQ should be smug about this — e.g. under their previous classical management, one contradictory departure board legally obliged them to pay out literally everything to everyone (ex falso quodlibet / explosion), which is officially cited as the reason they switched logics. This should read like a genuine corporate humblebrag about operational efficiency.
  - At least one bit exploiting the fact that they reject the law of non-contradiction but are still perfectly happy to use excluded middle whenever it suits the bottom line. (That's real: even the standard paraconsistent logics keep excluded middle.) Like, every seat is either occupied or unoccupied when they're checking you in, somehow.
  - Something on negation: the policy should carefully distinguish "your complaint is false" from "your complaint is not upheld," because negation doesn't behave classically for them and they know it.
  - A section on the customer who files the complaint "this complaint is not upheld" and what the staff handbook instructs them to do. Liar-adjacent, but keep it deadpan corporate — an escalation path, a reference number, a form.
  - A clause where they quietly clamp down on inference: passengers are not permitted to chain together "if the flight is delayed then you recieve a voucher" with "the flight is delayed" to demand a voucher, and the policy should give some hand-wavy corporate justification. You don't have to name the actual technical issue (the detachable conditional problem in the standard paraconsistent systems), but a logician should be able to tell that's what's being gestured at.

  Keep it deadpan the whole way — no winking at the reader, no "isn't this absurd," the joke is that corporate policy language is already like this and these people are just weirdly rigorous. The airline shouldn't be evil or incompetent exactly; they're applying their logic with more care than most airlines apply anything.

  Format it as numbered sections like a real FAQ, with a fake revision number and effective date. It should be readable to someone who knows zero logic, but someone who actually knows the Priest literature should think the satire is fair and not a strawman — nothing in it should be a misrepresentation of what dialetheists actually claim (e.g. don't have them say contradictions are "all true" or that anything goes).

  keep it under 700 words for the FAQ itself, and no preamble, just the document. typos in the doc are fine, it's an airline.
reasoning: |-
  We are creating a corporate FAQ for a fictional budget airline that has adopted dialetheism. The airline is called "Paraconsistent Pacific" (as per the example). The document must be in a numbered FAQ format, deadpan, and incorporate specific logical points as requested.

  Key points to cover:
  1. The airline switched to paraconsistent logic because under classical logic, a single contradiction led to explosion (ex falso quodlibet) which caused them to have to pay out everything to everyone. They are smug about avoiding that now.
  2. They reject the law of non-contradiction but still use excluded middle when it benefits them (e.g., for seat occupancy during check-in).
  3. Distinction between a complaint being "false" and "not upheld" because negation is non-classical.
  4. How they handle the complaint "this complaint is not upheld" (a liar-like situation) with corporate procedure.
  5. A clause that forbids passengers from chaining conditionals (to address the detachable conditional problem) with a corporate justification.

  We'll structure it as:

  [Airline Name] Customer Relations Policy
  Effective Date: [Date]
  Revision: [Number]

  Section 1: Introduction
  Section 2: Our Commitment to Logical Rigor
  Section 3: Handling Contradictions in Operations
  Section 4: Complaint Resolution Process
  Section 5: Specific Complaint Types and Handling
  Section 6: Limitations on Inferences by Customers
  Section 7: Contact Information

  We'll aim for 650 words, so we need to be concise.

  Let's write with a deadpan corporate tone, but with the logical twists.
answer: |-
  **PARACONSISTENT PACIFIC AIRWAYS**  
  **CUSTOMER RELATIONS & COMPLAINTS POLICY**  
  **Effective Date:** 01-APR-2024 | **Revision:** 7.1β  

  ### 1. INTRODUCTION  
  Paraconsistent Pacific (PP) operates under a dialetheic framework to resolve operational and customer service ambiguities. This policy ensures complaints are addressed with logical precision, enhancing efficiency and fairness.  

  ### 2. WHY PARACONSISTENCY?  
  Under classical management (pre-2023), a single contradictory departure-board entry triggered *ex falso quodlibet* ("explosion"), legally obligating PP to compensate all passengers for all conceivable damages. This resulted in unsustainable payouts, including 3,200 free flights to Helsinki for a gate error in Toledo. Our paraconsistent system prevents such triviality: a localized contradiction (e.g., Flight PP202 *both* departing *and* not departing) does not propagate system-wide liabilities. This innovation saved  ₣4.2M in 2023.  

  ### 3. KEY PRINCIPLES  
  - **Non-Contradiction Suspension:** PP acknowledges that statements can be simultaneously true *and* false (e.g., "Gate B2 is correct" may hold *and* not hold).  
  - **Excluded Middle Retention:** PP fully enforces binary determinations where operationally critical. Example: During check-in, every seat is *either* occupied *or* unoccupied. Partial occupations are resolved via coin flip.  
  - **Negation Nuance:** "Your complaint is false" ≠ "Your complaint is not upheld." A complaint may be *true* (e.g., "My flight both left and didn’t leave") yet denied due to policy constraints (see §5).  

  ### 4. COMPLAINT RESOLUTION PROCESS  
  #### 4.1 Submission  
  Complaints must be filed via Form 33-∇ within 14 days of flight completion. Incomplete forms are rejected.  
  #### 4.2 Assessment  
  PP evaluates complaints against flight logs, which may contain true contradictions. A complaint is "upheld" only if it is *at least true* (i.e., not *solely* false) *and* meets compensation criteria (see §6).  
  #### 4.3 Outcome Notification  
  You will receive one of three determinations:  
  - **Upheld:** Compensation issued (e.g., voucher for  ₣20).  
  - **Not upheld:** Complaint is *at least false* (may also be true).  
  - **Dialethically upheld:** Complaint is both true *and* false (e.g., "My refund is owed"). Outcome: 50% compensation.  

  ### 5. SPECIAL CASES  
  #### 5.1 Liar-Type Complaints  
  Complaints asserting their own denial (e.g., "This complaint is not upheld") are processed as follows:  
  - **Step 1:** Agent issues Provisional Denial (Reference: LIAR-∇).  
  - **Step 2:** Customer submits Appeal Form 33-L¬ via post within 7 days.  
  - **Step 3:** VP of Logic reviews. Outcome is *always* dialethically upheld (see §4.3).  

  #### 5.2 Refund Requests  
  Refunds may be *both owed and not owed* (e.g., if your flight *both* arrived late *and* on time). Status is determined by a quantum RNG. To check: Text **REFUND?** + PNR to 555-∇.  

  ### 6. INFERENCE RESTRICTIONS  
  Customers may not chain conditional statements to demand outcomes. Example:  
  > *If flight delay →  ₣50 voucher.  
  > Flight PP202 was delayed.  
  > ∴ I demand  ₣50.*  

  **PP Policy:** While both premises may hold, the conclusion does not necessarily follow. Paraconsistent systems detach implications non-monotonically; thus, voucher eligibility requires explicit audit (Form 33-IC). "Delay" is defined as *classically delayed* (≥3 hrs), excluding dialethic delays (simultaneously 0hr and 5hr).  

  ### 7. CONTACT  
  Logic Compliance Dept.: logic@paraconsistentpacific.∇ | 1-888-PP-∇-AIR (1-888-77-∇-247)  
  *Note: Hold times may be both 2 minutes and 45 minutes.*  

  ---  
  **Policy Integrity:** PP’s approach resolves 98.7% of complaints without explosion-related bankruptcy.  
  **Feedback:** To report non-dialethic inconsistencies, email classicalcomplaints@paraconsistentpacific.∇ (Responses may be classically true or false, not both).
