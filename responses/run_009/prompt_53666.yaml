prompt: |-
  My flatmate and I run a little philosophy reading group out of our living room, and this semester we've been doing the peer disagreement literature — conciliationism vs steadfastness, the equal weight view, all that stuff. Well, "we've been doing it" — we've mostly been reenacting the debate ourselves, because it turns out we disagree about peer disagreement, and we each think the other one is our epistemic peer, so you can imagine how the arguments go. He's a conciliationist, thinks that when you find out someone equally smart and equally informed disagrees with you, you should split the difference and move at least halfway toward their view. I'm more on the steadfast side — I think you're allowed to just keep your original confidence if you've genuinely thought it through. Next week it's my turn to host and I want to open with a joke, because this group takes itself WAY too seriously. Problem: every philosophy joke I can find online is the generic kind (philosopher walks into a bar, etc.) and everyone would just groan. I want a joke where the punchline actually turns on the substance of the debate — e.g. the self-undermining thing where two conciliationists who disagree about conciliationism are each required to move toward the other's position, or how a steadfast person responds to news of disagreement by basically just shrugging, or the awkwardness of what "splitting the difference" even means when one of you is really confident and the other isn't. Write me something — a joke, or maybe a short comedic exchange between two epistemologists, that's up to you — that someone who has actually read this literature would find funny, not just "haha philosophers argue forever." Bonus points if it somehow lands on both of us, since my flatmate and I will both be in the room and each of us thinks we're getting the last laugh.
