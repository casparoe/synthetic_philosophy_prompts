prompt: |-
  I do claims policy at a mid-sized home insurer, and I need your help with something that turns out to be weirder than it sounds. Our policies cap payouts per "article" — so whether the destroyed thing counts as one article or several can swing a claim from fully covered to mostly out of pocket, and adjusters argue about it constantly with no framework. Recent examples: a sectional sofa ruined by smoke (one article or five interlocking pieces?), a modular garage shelving system, a fence blown down in a storm (one fence or forty panels?), a custom kayak with an aftermarket rudder and fishfinder, and a set of china that's only valuable as a set.

  Here's the thing — I gather there's an actual live debate in metaphysics about when a bunch of parts make up one thing. Like, one camp apparently says any old parts whatever always compose a further thing, another camp says strictly speaking there are no composite objects at all, a third says only special things (living organisms?) get to count as one, and some people think there's no informative rule and it's just a brute fact. This sounds exactly like our problem, except our adjusters have fifteen minutes per call and can't be discussing ontology with a customer whose stuff just burned.

  So: write me a decision procedure an adjuster could actually run during a claims call, in plain language. I want the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and says "pay out as one article," where it says "several articles," and where it has to punt to a human because it's a values/policy call rather than a fact. Ground it in what those metaphysical positions actually imply — but be honest about where the theory just doesn't answer the adjuster's question and we're improvising. If the procedure only works because we quietly adopted one of those camps as policy, say that explicitly, because I'd rather know when we're choosing universalism for bookkeeping reasons than pretend the metaphysics settled it.

  Then run it on three cases: (1) the sectional sofa, (2) the fence, and (3) a homeowner whose built-in floor-to-ceiling bookshelves were destroyed, where the question is whether those count as part of the house structure (different sublimit) or as furniture. Also worth handling somewhere: over the years before the storm, about half the fence's panels had been individually replaced after smaller incidents — does that change what "the fence" even is, or is that a different question than the composition one?

  Constraints: adjusters have ~15 minutes, no jargon they'd have to look up, anything that changes typical payouts needs my sign-off, and if some step only works if we rewrite the policy language, flag that instead of burying it. Include at least one case where the procedure gives an answer I'm going to hate defending to the customer, because I want to know where those are before we roll this out.
reasoning: |-
  Okay, let me tackle this insurance claims problem with a metaphysical twist. The user needs a practical decision procedure for adjusters to determine when multiple items count as one "article" under policy limits – a question philosophers have debated for centuries. 

  First, I need to understand the core tension: insurance requires binary decisions (one article vs. several) where metaphysics offers only spectrums. The user's examples highlight this perfectly – is a sectional sofa one unit or five pieces? That's essentially asking when parts compose a whole object, which is the central question of mereology.

  Hmm, the user explicitly wants this grounded in metaphysical positions but warns against pretending philosophy solves practical problems. They're sharp – they know universalism (everything composes) would make every claim maximally expensive, while nihilism (no composites) turns a house into billions of atoms. Neither works for insurance. 

  The procedure must:
  - Be executable in 15-minute calls
  - Avoid terms like "endurantism" 
  - Flag when it's making policy choices disguised as facts
  - Handle edge cases like the fence with replaced panels
  - Produce defensible (if unpopular) outcomes

  I consider structuring it as a flowchart with three layers:
  1. Practical unity: Can it be moved/used as one thing? (Solves kayak accessories)
  2. Functional dependence: Do parts need the whole? (Solves china set)
  3. Intentional unity: Was it designed/bought as one? (Solves sofa vs fence)

  For the bookshelf case – that's a boundary object between structure and furniture. The key question should be: "If the house sold tomorrow, would this stay?" That aligns with real estate conventions, not metaphysics. 

  Ah, the fence with replaced panels is fascinating. Metaphysically, it's Theseus's ship – but adjusters can't ask that. Instead, I'll focus on current functional unity: are all panels currently interconnected? The replacement history becomes irrelevant if it functions as one fence today.

  Biggest trap: The china set. Metaphysics says "no whole object" but customers will riot if we count 48 plates separately. So we'll need to openly overrule philosophy with policy: "Sets are one article when value depends on completeness." User will hate defending this, but it's better than underpaying.

  Final design principle: When philosophy conflicts with customer expectations in obvious ways, punt to human review. That's not failure – it's ethical claims handling.
answer: |-
  Here's a practical decision procedure for adjusters, grounded in metaphysical principles but streamlined for 15-minute claims calls. It prioritizes functional and contextual unity over philosophical purity, explicitly acknowledging where policy choices override unresolved debates.

  **Decision Procedure: Is It One Article or Several?**
  *(Run these questions in order; stop when you get a clear answer)*

  1.  **"Was it physically connected and functioning as a single unit at the time of loss?"**
      *   **Yes, securely connected:** Proceed to Q2.
      *   **No, easily separable pieces:** Likely multiple articles (e.g., loose fence panels piled in the yard). *Stop: Pay as multiple articles.*
      *   **Mixed/Unclear (e.g., modular shelving snapped together):** Proceed to Q2.
      *   *Metaphysics Basis:* Challenges mereological nihilism (if it *was* functioning as one, we treat it as one). *Policy Choice:* We prioritize the state *at loss*.

  2.  **"Does separating the parts destroy their primary intended function or value?"**
      *   **Yes, critically (e.g., china set, kayak rudder essential for steering):** Likely one article. *Proceed to Q3 for confirmation.*
      *   **No, parts work fine alone (e.g., modular sofa sections usable as chairs, standard fence panels):** Likely multiple articles. *Proceed to Q4.*
      *   *Metaphysics Basis:* Addresses "special composition" (teleological/functional view). *Policy Choice:* We value functional unity and economic reality (sets).

  3.  **"Was it originally purchased, installed, or intended as a single, named item?"** (Confirms Q2)
      *   **Yes (e.g., "a china set," "a kayak package," "a sectional sofa"):** *Stop: Pay as ONE article.*
      *   **No (e.g., fishfinder bought years after kayak, rudder added later):** *Proceed to Q4 for the non-integral add-on.*
      *   *Metaphysics Basis:* Appeals to intentionality/social construction. *Policy Choice:* We rely on common purchase/description practices.

  4.  **"Are the parts interchangeable, mass-produced, and commonly sold/replaced individually?"**
      *   **Yes (e.g., fence panels, standard bookshelf units, modular tiles):** *Stop: Pay as MULTIPLE articles.*
      *   **No (e.g., custom-cut bookshelves fitting one specific wall, unique sectional piece):** *Stop: Pay as ONE article.*
      *   *Metaphysics Basis:* Contrasts "universalism" (everything is an object) with practical individuation. *Policy Choice:* We favor reparability and market reality.

  5.  **"Is there significant ambiguity after Q1-Q4, OR is the item physically attached to the structure?"**
      *   **Yes:** *PUNT TO SUPERVISOR/HUMAN REVIEW (Flag as "Boundary/Ambiguity").*

  **Special Case: Structure vs. Contents**
  *   **For items attached to the building (like bookshelves):** Ask: **"If the homeowner moved out tomorrow, would they reasonably take this item with them, or would it stay as part of the house?"**
      *   **Take it (e.g., freestanding bookshelf, even if large):** Treated as Contents/Furniture (one article under contents limit). *Apply Article Procedure above.*
      *   **Leave it (e.g., shelves nailed/screwed/glued to walls, built into alcove):** Treated as part of the Structure (covered under dwelling limit, different rules). *Stop: Not subject to "article" cap.*
      *   *Policy Choice:* This relies entirely on real estate conventions and intent, *not* metaphysics. It's a bright-line rule for efficiency.

  **The Fence Panel Replacement History:**
  *   This is a **different question** than composition *at the time of loss*. Replacements don't change the *current* unity of the fence. The procedure focuses on **Q1 (Current Connection/Function)**. If the fence was standing and connected as one barrier when the storm hit, its history is irrelevant to *this* claim's "article" count. (It *might* affect depreciation or ACV vs. RCV, but not the "what is it?" question).

  ---

  **Running the Procedure:**

  **Case 1: Sectional Sofa (Smoke Damage)**
  1.  **Physically connected?** Likely **Yes** (interlocked). Proceed.
  2.  **Separating destroy function/value?** **Mixed.** Sections *can* function as chairs (argues multiple), but the *primary intended function* (large seating area) is lost (argues one). Proceed cautiously.
  3.  **Purchased/intended as single item?** **Yes.** Sold and described as "a sectional sofa." *Stop: Pay as **ONE article**.*
      *   *Why you might hate defending it:* Customer argues "it's *five* pieces!" Adjuster must explain: "Our procedure looks at how it was sold, installed, and used as a single functional unit when the loss happened."
      *   *Metaphysics/Policy:* Overrules strict mereological nihilism; adopts intentional/functional view as policy. Universalism would also say "one thing" but for different reasons.

  **Case 2: Fence Blown Down**
  1.  **Physically connected?** **Yes** (if standing and connected when storm hit). Proceed.
  2.  **Separating destroy function/value?** **No.** Individual panels retain their inherent function/value as fence panels. Proceed to Q4.
  3.  *(Q3 skipped as Q2 was "No")*
  4.  **Interchangeable/Mass-produced?** **Yes.** Fence panels are standard, sold/replaced individually. *Stop: Pay as **MULTIPLE articles** (e.g., 40 panels).*
      *   *Replacement History:* Irrelevant per procedure. Focus is on state *at loss*.
      *   *Metaphysics/Policy:* Rejects universalism here; adopts a practical, reparability-focused view (closer to nihilism or "special composition" only for functional wholes). **This is the answer you might hate defending.** Customer sees "a fence." Adjuster must explain: "The policy cap applies per 'article,' and our guidelines treat standard, replaceable fence panels as individual articles based on how they are sold and installed."

  **Case 3: Built-in Floor-to-Ceiling Bookshelves (Destroyed)**
  *   **First: Structure vs. Contents?** Ask: **"Would you take it if you moved?"**
      *   **Likely Answer:** **No.** Built-in shelves are typically considered part of the house. They are custom-fitted, attached to walls/floor/ceiling, and increase home value.
      *   **Result:** Treated as **part of the Structure**. Covered under the dwelling coverage limit, *not* subject to the personal property "article" cap. *Stop.*
      *   *If Ambiguous (e.g., freestanding unit cut to fit):* Punt to supervisor (Q5). Supervisor might ask: "How physically integrated is it? (Screws/nails/glue vs. just sitting there?)" or "Does the policy define 'built-in'?" (Flag for potential policy language clarification: "We need a clearer definition of 'built-in' vs. 'freestanding furniture'.").
      *   *Metaphysics/Policy:* This bypasses the composition question entirely. It's purely a policy-driven boundary between dwelling and contents based on attachment and intent upon moving.

  **Key Takeaways & Policy Flags:**

  1.  **Policy Choices Over Metaphysics:** The procedure actively chooses interpretations:
      *   **Functional/Intentional Unity:** Favored for items like sofas, sets, kayaks (Q2, Q3). This overrules strict nihilism.
      *   **Reparability/Standardization:** Favored for fences, shelving *systems* (Q4). This overrules universalism for these items.
      *   **State at Loss:** The replacement history is explicitly ignored (The Ship of Theseus problem is avoided practically).
      *   **Structure vs. Contents:** Defined by removability, not composition.
  2.  **Where Metaphysics Runs Out:** Q5 explicitly punts when functional unity (Q2) is ambiguous or the Structure/Contents line is blurry. This acknowledges the "brute fact" or "no informative rule" camp.
  3.  **Defensibility:** The fence case (**multiple articles**) will be hardest to defend. Be prepared with reasoning: "The policy cap is *per article*. Standard fence panels are manufactured, sold, priced, and replaced as individual units. While connected, they retain their identity as distinct, replaceable components."
  4.  **Potential Policy Language Changes:**
      *   **Consider defining "article" explicitly:** E.g., "An 'article' is a single physical object or a group of objects permanently joined together *and* intended by the manufacturer or purchaser to function as a single unit where the parts lose their primary value or function if separated. Standardized, mass-produced, interchangeable components (like fence panels, modular tiles, shelving units) are considered separate articles."
      *   **Clarify "Built-in":** Add examples or criteria to the policy (e.g., "attached via screws/nails/glue to the structure, custom-fitted to a specific space, and not reasonably removable without damage to itself or the structure").
  5.  **Efficiency:** The flowchart (Q1->Q2->Q3/Q4->Q5/Stop) is designed for rapid assessment. Most common cases (fence, sofa) resolve by Q3 or Q4. Structure/Contents is a pre-filter.

  This procedure provides a consistent, auditable framework grounded in practical interpretations of the underlying philosophical problems, while being honest about where policy choices are made and where ambiguity requires human judgment. It significantly reduces ad-hoc arguing by giving adjusters clear steps and criteria.
