answer: |-
  1. Driver with transient global amnesia faces three identical exits; driver payoffs: exit 1 gives 1, exit 2 gives 4, exit 3 gives 3, passing all gives 0; sister's payoffs: 0, 0, 9, 1 for same outcomes; pre-departure side payments are allowed.

  2. Amnesic driver's optimal policy: stationary exit probability \( p \approx 0.523 \) maximizes expected utility at \( \approx 1.877 \), computed by solving \( \max_p [p \cdot 1 + p(1-p) \cdot 4 + p(1-p)^2 \cdot 3] \); this strictly exceeds pure strategies (always exit: 1, never exit: 0).

  3. Informed driver (knows exit number) exits at exit 2 for utility 4, which strictly exceeds amnesic optimum (1.877), confirming amnesia is a handicap.

  4. Sister prefers amnesic driver running optimal policy (her utility \( \approx 1.178 \)) over informed driver (0 at exit 2); she values committing driver to her preferred \( p = 0.25 \) (her utility 1.688) at up to 0.510 utils, and a side payment in [0.455, 0.510] utils makes both strictly better off (driver gets \( \geq 1.422 + 0.455 = 1.877 \), sister gets \( \geq 1.688 - 0.510 = 1.178 \)).

  5. Critical feature: sister's payoff is zero at exit 2 but high at exit 9; minimal break: increasing sister's exit 2 payoff to \( \geq 1.178 \) (e.g., to 1.18) flips her preference to informed driver (utility \( \geq 1.178 \)) over amnesic.
