  Okay, let me unpack this user's query. They had a debate with their roommate about how bad practices die—specifically, whether moral arguments alone drive change or if social signaling shifts are the real catalyst. The user uses dueling and footbinding as examples. They noticed that arguments against dueling existed for centuries but only became effective when the social meaning shifted from honor to ridicule. The user wants to know if there's a term for this phenomenon where old arguments suddenly work due to a change in status signals, not new reasoning.

  First, I need to recall relevant concepts from sociology and philosophy. Terms like "norm cascade," "pluralistic ignorance," and "status functions" come to mind. The user mentions the Overton window and moral panic but notes these don't quite fit. The Overton window is about acceptable discourse, while moral panic is about amplification. The key here is the shift in social signaling without new arguments.

  I should break down the user's core observation: the causal mechanism is the change in what a practice signals (honor to embarrassment), making existing arguments actionable. The legal status might be separate, as dueling was illegal but persisted until the signal changed. The user also asks if this applies to practices like footbinding, where the practitioners (women) weren't the status-setters.

  Looking at sociology, Bicchieri's norm theory explains how norms collapse when enough people stop complying because they believe others have stopped. This aligns with the dueling example—once it's seen as ridiculous, compliance drops. Searle's status functions could explain how collective acceptance assigns meaning (honor/ridicule) to practices. The "civilizing process" by Elias shows how societal changes in embarrassment can shift norms.

  For footbinding, Mackie's account shows it ended not by new arguments but coordinated abandonment, influenced by elites. Here, the signal changed from marriageability to backwardness, driven by external pressures and media.

  The user might be seeking validation that social dynamics, not just moral reasoning, drive change. They might also want tools to analyze current issues (e.g., MeToo, environmental practices). Deeper needs could include understanding how to effect change or reconciling the role of arguments versus social factors in moral progress.

  I consider coining a term like "signal cascade" or "status function collapse." But existing terms like norm cascade or tipping point might suffice with clarification. Emphasizing the distinction between argument validity and social enforcement is key. The user’s edge cases (legal vs. social change, different practitioner groups) should be addressed by noting that signal shifts can override laws and that elite influence often drives change even in non-elite practices.
answer: |-
  That's a brilliantly observed pattern! You're pinpointing a crucial dynamic in social change where the *meaning* or *social signal* of a practice shifts dramatically, rendering existing, long-stagnant arguments suddenly potent, without the arguments themselves changing. This is distinct from the Overton Window (which governs what's *sayable*) and moral panics (which amplify perceived threats). Let's carve out this concept:

  **Core Concept & Proposed Term: "Signal Collapse" (or "Status Signal Collapse")**

  **Definition:** The rapid decline or abandonment of a social practice, not primarily driven by new information, moral arguments, or legal coercion, but by a fundamental shift in the *social meaning* or *status signal* associated with participating in it. This shift transforms the practice from a marker conferring desirable status (honor, belonging, prestige) into a marker of undesirable status (ridicule, backwardness, irrationality, social incompetence). Crucially, arguments *against* the practice were often widely known and accepted *before* the collapse but were socially inert until the signal flipped. The argument itself acts as a retroactive justification or a "licence" for the social exclusion that now accompanies the practice.

  **How it Differs from Related Concepts:**

  1.  **Norm Cascade / Tipping Point (e.g., Sunstein, Bicchieri):** This is the *closest* established concept. A norm cascade describes the rapid abandonment of a norm once a critical mass of people defect, making non-compliance suddenly safer or even advantageous. **The key difference you highlight:** In your "signal collapse," the cascade is specifically triggered by the *reversal of the status signal*, not just by changing costs/benefits *or* new arguments. The *meaning* attached to the act flips. The old arguments were *always there*, inert, waiting for the signal to change before they became socially usable weapons.
  2.  **Pluralistic Ignority (e.g., Allport, Prentice & Miller):** This is where individuals privately reject a norm but publicly comply because they (mistakenly) believe everyone else accepts it. Your pattern *can* involve this (people privately thought dueling was stupid but thought others valued it). However, signal collapse goes further: it requires an *overt shift in the perceived public meaning*, making the private rejection not only safe to express but actively rewarded through the *assignment of negative status* (ridicule) to those who persist. The collapse *ends* the pluralistic ignorance.
  3.  **Overton Window:** This defines the range of *politically acceptable discourse*. Signal collapse is about the *social meaning and status consequences of an *action*, not just its discussability. Dueling could be (and was) discussed critically *while* it was still a high-status signal. The Overton Window might shift *as a result* of signal collapse, but it's not the primary mechanism you describe (the signal flip happens first, enabling the arguments to become socially potent).
  4.  **Moral Panic:** This involves the rapid *amplification* of perceived deviance and threat around a practice or group, leading to increased social control, often disproportionate to the actual threat. Signal collapse is the opposite: the rapid *devaluation* and *loss* of perceived legitimacy/social benefit of a practice. It's a spiral *down* in social desirability, not up in perceived danger.
  5.  **Stigmatization:** This is the *result* of signal collapse. Stigmatization (assigning deep discredit) is the *tool* used to enforce the new negative signal. Signal collapse *describes the process by which stigmatization suddenly becomes effective* against a previously high-status practice due to the meaning shift.
  6.  **Civilizing Process (Elias):** This broader theory describes long-term historical shifts in manners, sensitivity to violence, and thresholds of shame/embarrassment. Signal collapse can be a *specific mechanism within* a civilizing process – the rapid, observable moment where a practice like dueling flips from honorable to embarrassing due to these deeper shifts in sensibility.

  **Addressing Your Edge Cases & Questions:**

  1.  **Formal Illegality vs. Social Meaning Flip (Dueling):** Signal collapse *absolutely* still counts in this scenario. Legal prohibition often precedes the social signal shift precisely *because* the arguments were accepted intellectually but lacked social traction. The law was (like the arguments) inert without the shift in social meaning. Dueling persisted *despite* laws because the social cost of *not* dueling (loss of honor) outweighed the legal risk. Signal collapse made the social cost of *dueling* (ridicule) outweigh any remaining perceived benefit, rendering the law finally enforceable in practice. The legal change is a separate category but often ineffective without the signal collapse.
  2.  **Practitioners vs. Status-Setters (Footbinding):** This is crucial and shows signal collapse works even when practitioners aren't the primary status-setters.
      *   **Footbinding:** While practiced on girls/women, its *meaning* (signaling family status, refinement, marriageability) was assigned *by* the broader society, particularly elite men and the families arranging marriages. The arguments against it (cruelty, health, backwardness) existed for centuries. What changed?
          *   **External Pressure:** Western condemnation framed it as barbaric, linking it to China's perceived weakness.
          *   **Internal Reformers:** Educated elites (often influenced by Western ideas) began associating it with national humiliation and backwardness, *changing the signal it sent about the family and the nation*. Binding your daughter signaled you were hindering China's progress, not elevating her status.
          *   **Coordinated Abandonment:** Groups like the "Natural Foot Society" created explicit pledges and social pressure. Marrying an unbound foot woman became a signal of being modern and patriotic.
      *   **Mechanism:** The signal collapsed because the *status-setters* (elites, reformers, increasingly the state/media) redefined what the practice signaled about the *family* and the *nation*. Families stopped binding feet not primarily because of new facts about pain, but because it now signaled being *backward* and *unpatriotic*, damaging the family's social standing. The *old* arguments about cruelty provided the justification for this new stigma. This fits the "signal collapse" perfectly: the meaning flipped from high-status (refinement, good marriage prospects) to low-status (backwardness, national shame), activating pre-existing arguments.

  **Why the Argument Seems Causally Inert (But Gets Credit):**

  You're right. The argument itself doesn't *cause* the collapse. Its power is latent until the social meaning shifts. Why does it get credit?

  1.  **Narrative Convenience:** It's easier to tell a story of moral progress driven by reason ("Wilberforce convinced people") than the messier, more contingent story of shifting social signals and status games.
  2.  **Legitimization:** The argument provides a post-hoc *moral justification* for the social exclusion that now enforces the collapse. It makes the new stigma seem rational and deserved.
  3.  **Mobilization Tool:** Once the signal starts shifting, the *existing* arguments become powerful tools for activists to *accelerate* the collapse and stigmatize holdouts. They become the public vocabulary of condemnation.

  **In essence:** "Signal Collapse" describes the moment when a practice falls off a social cliff because the ground beneath it – its perceived status value – disappears. The arguments against it were always there, like gravity, but only became lethal when the practice lost its social footing. It's the social meaning that collapses, making the pre-existing arguments finally have devastating social consequences. This applies whether the practitioners are high-status duelists or families binding daughters, as long as the *signal* they intend to send is catastrophically reversed by the dominant social group or newly influential actors.
