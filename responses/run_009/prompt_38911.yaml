answer: |-
  ### Translation of Buddhist Ethical Claims into Consequentialist Population Ethics

  **1. First Noble Truth (Dukkha)**  
  *Translation:* Conditioned existence entails pervasive *welfare deficit*. Dukkha is not merely pain but *structural unsatisfactoriness* inherent in impermanent, conditioned phenomena.  
  - **Negative utilitarianism?** Partially: Dukkha implies welfare states are net-negative *unless liberated* (nirvāṇa). But Buddhism permits *relative* welfare gains (e.g., jhānic bliss), rejecting blanket anti-natalism.  
  - **Welfare-negativity survival?** Flattened: The cosmic/existential register (e.g., "birth is dukkha") becomes *aggregate disvalue of dependent origination*. Affective dimensions (e.g., "suffering of change") map to *frustrated preference or hedonic treadmill*.  
  - **Key distortion:** Reducing dukkha to "disvalue" loses its soteriological role as the *truth* requiring realization.  

  **2. Rebirth**  
  *Translation:* Death is not welfare-loss but *causal sequence interruption*. Welfare-subjects are *numerically distinct but causally linked aggregates* across lives ("streams").  
  - **Death as welfare-loss?** Rejected: Conventional death is a *local welfare disruption*; the stream persists. Person-affecting concerns arise only *within* a life-stream.  
  - **Totalist ledger?** Retained: Aggregation occurs over all welfare-moments in beginningless time. Rebirth smuggles in *stream-relative person-affectingness* but aggregates impartially *across streams*.  
  - **Key insight:** "Identity" is pragmatic designation for karmic continuity—no persistent self violates consequentialist atomism.  

  **3. Karma**  
  *Translation:* Karma is *causal moral accounting*: actions generate *agent-bound welfare effects* across time, enforceable via rebirth mechanics.  
  - **Consequentialist analogue?** *Agent-relative expected utility*: Acts have predictable welfare consequences *for the actor's stream*. But unlike desert, karma is impersonal law (like gravity).  
  - **Conflict with consequentialism?** Yes: Consequentialism rejects *inherent agent-relativity*; karma binds welfare to the actor. This is *consequentialist-like* (emphasis on outcomes) but not purely consequentialist (due to agent-centeredness).  
  - **Distortion:** Framing karma as "prudential rationality" ignores its retributive structure (e.g., hell realms as *necessary* outcomes).  

  **4. No-Self (Anattā)**  
  *Translation:* Welfare-subjects are *conventional labels* for ephemeral aggregates (skandhas). Aggregation occurs over *welfare-moments in causal sequences*.  
  - **Aggregation without subjects?** Possible: Analogous to *momentary utilitarianism* (Parfit-style). Welfare is property of *dharmic events*, not persons.  
  - **Framework presupposition?** Fatal flaw: Population ethics assumes *countable subjects*. Buddhism denies this ontology—residue is irreducible.  
  - **Distortion:** "Welfare-streams" reify what Buddhism sees as empty conceptual designations.  

  **5. Bodhisattva Vow**  
  *Translation:* Postponing nirvāṇa is a *lexical tradeoff*: accepting finite welfare loss (continued samsara) for *infinite welfare gain* (liberating all beings).  
  - **Supererogatory?** No: Under Mahāyāna metaphysics, it is *obligatory* (bodhicitta as optimal welfare-maximizing strategy).  
  - **Person-affecting?** Irrelevant: All beings are empty; aggregation is cosmic. The vow reflects *infinite time horizon totalism*.  
  - **Vocabulary limit:** Consequentialism cannot capture the *non-instrumentality* of the vow (e.g., compassion as inherent value).  

  **6. Recommendation of Cessation**  
  *Translation:* Nirvāṇa is *cessation of disvalue* (dukkha), not annihilation. Conditioned existence's net welfare is negative; thus, optimal state is *universal liberation* (no beings to aggregate).  
  - **Empty cosmos?** Monstrous misreading: Nirvāṇa is *unconditioned*, not non-existence. Cessation applies to *dukkha*, not sentience per se.  
  - **Negative utilitarianism?** Rejected: Buddhism seeks *freedom from dukkha*, not pain-minimization. A Buddha's post-nirvāṇa activity (e.g., teaching) has welfare-positive value.  
  - **Distortion:** Equating nirvāṇa with "zero welfare" misconstrues it as a state of subjects rather than the cessation of conditions.  

  ---

  ### Residue Report  
  | Claim | Clean Survival | Distortion (How) | No Expression | Residue Adjudication |  
  |-------|----------------|------------------|--------------|----------------------|  
  | 1. Dukkha | Welfare deficit in conditioned states | Existential truth → hedonic/teleological disvalue | Dukkha as *truth to realize* (not just disvalue) | **Defect of consequentialism**: Cannot capture phenomenological insight as normative ground. |  
  | 2. Rebirth | Welfare-moments in causal streams | "Personhood" over streams → pragmatic designation | Death as *delusion* (not ledger event) | **Doctrinal clarity**: Rebirth's mechanism is metaphysical, not reducible to aggregation. |  
  | 3. Karma | Cause-effect welfare binding | Agent-relativity → prudence | Karmic "imputation" without self | **Defect of consequentialism**: Lacks tools for *impersonal agent-relative causation*. |  
  | 4. No-Self | Momentary welfare aggregation | "Streams" → subtle reification | Ontological emptiness of aggregates | **Fatal defect**: Consequentialism requires subjects; Buddhism denies them. |  
  | 5. Bodhisattva Vow | Infinite-horizon optimization | Intrinsic compassion → instrumental sacrifice | Vow as *expression of śūnyatā* | **Doctrinal clarity**: Vow transcends optimization (e.g., "skillful means" as non-calculative). |  
  | 6. Cessation | Nirvāṇa as welfare optimum | Unconditioned → "zero welfare" | Nirvāṇa as *beyond existence/non-existence* | **Doctrinal clarity**: Conflation with extinction (ucchedavāda) is heretical in Buddhism. |  

  ---

  ### Verdict on Your Hypothesis  
  **Your hypothesis is wrong.** While Buddhist ethics shares *structural features* with totalist consequentialism (impartiality, aggregation, infinite scope), it fractures on ontology and normativity:  
  1. **No-self undermines aggregation**: Without persistent subjects, "total welfare" is a convention—not an objective sum.  
  2. **Karma violates agent-neutrality**: Welfare effects are bound to the actor’s stream, creating a *moral mechanics* alien to consequentialism.  
  3. **Nirvāṇa is not a welfare state**: It is the *cessation of conditions for welfare assessment*, rendering maximization incoherent.  

  **Breaking point**: The bodhisattva vow (mapping #5) decisively refutes your hypothesis. If Buddhism were "exotic utilitarianism," the vow would be irrational: delaying nirvāṇa (the putative welfare optimum) to liberate others *increases net dukkha*. Yet Mahāyāna frames this as *necessary*—not supererogatory—because emptiness reveals no "optimum" to achieve and no "beings" to liberate. The vow emerges from wisdom (prajñā), not calculation.  

  **Weight of mappings**: #4 (No-Self) carries the most weight. Consequentialist aggregation *presupposes* the very selfhood Buddhism negates. This ontological gap ensures Buddhist ethics can only be "consequentialist-like" in motivation, never in foundation. The monster in #6 arises from forcing Buddhist metaphysics into a ledger framework—it is a failure of translation, not doctrine.  

  **Conclusion**: Buddhism is *karmic-consequentialist* in emphasizing causal outcomes across time, but its core axioms (anattā, śūnyatā, nirvāṇa) render it metaphysically and normatively incompatible with any form of utilitarianism. The residue is irreducible.
