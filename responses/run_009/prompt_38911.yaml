prompt: |-
  You are a professional philosopher with serious training in both Buddhist ethics (early Buddhism and the Mahāyāna tradition, at the level of a scholar rather than a popularizer) and contemporary consequentialist population ethics. Before writing your final answer, brainstorm: map each Buddhist claim below to its candidate consequentialist analogues, note wherever two or more mappings compete, and choose between them deliberately rather than by default. Take this as a translation exercise in the strict sense — not an invitation to vague comparative religion, and not an occasion to flatter either tradition.

  Here is my situation. I work in the effective altruism ecosystem. I am fluent in consequentialist population ethics — totalism versus averaging, person-affecting views, the non-identity problem, replacement, lexical thresholds, the problems of infinite ethics — and I have a decent but non-scholarly grasp of Buddhism: the four noble truths, rebirth, karma, no-self, karuṇā, and the bodhisattva vow. Restate the central claims of Buddhist ethics in my vocabulary, as faithfully as you can, one at a time:

  1. The first noble truth — that conditioned existence is dukkha — restated as a claim about the aggregate welfare of welfare-subjects. Does it amount to a negative utilitarianism about existence, and does the notion of dukkha survive as welfare-negativity at all, or does the affective/cosmic register of the original get flattened?
  2. Rebirth — restated as a claim about the identity and persistence of welfare-subjects across lives. What happens to the conventional consequentialist treatment of death as a welfare-loss event? Does rebirth quietly import a person-affecting structure into what looked like a totalist ledger?
  3. Karma as moral causation — a mechanism by which welfare attaches to the agent across time. Is this expressible as anything in my vocabulary, or is it exactly the kind of agent-relative desert structure consequentialism is designed to exclude? If the latter, can Buddhist ethics still be consequentialist, or only consequentialist-looking?
  4. No-self — if there are no persisting subjects, only momentary psychophysical streams, what does aggregation aggregate over? Does welfare without welfare-subjects have any expression in population ethics, or does the whole framework presuppose the very ontology the Buddhists deny?
  5. The bodhisattva vow to defer one's own final liberation until all beings are freed — restated as a welfare-tradeoff decision. Under the translations above, is this a supererogatory personal sacrifice, a person-affecting requirement, or something the vocabulary cannot distinguish?
  6. The recommendation of cessation — if (1) translates as negative utilitarianism about conditioned existence, does Buddhism become a philosophy whose optimum is the empty cosmos: a recommendation of universal cessation? If that sounds monstrous, say whether the monster comes from the translation or from the doctrine.

  Then the part I actually care about, the residue report. For each of the six translations, state what survives cleanly, what had to be distorted to fit — say exactly how you distorted it — and what has no expression at all in my vocabulary. Then adjudicate the residue: in each case, is the untranslatable remainder a defect of the consequentialist vocabulary (something real that my framework is missing), or evidence that the Buddhist claim was less clear, or more purely normative and less theoretical, than it looked? I want a view, not a diplomatic both-sides answer.

  Finally, test my working hypothesis against the translation: that once rebirth is taken seriously, Buddhist ethics collapses into a very demanding totalist consequentialism over beginningless time — death drops out of the ledger, karuṇā supplies impartial aggregation across all sentient beings, and nirvāṇa functions as the single welfare-maximizing outcome each subject has prudential reason to seek, so that the whole system is just utilitarianism with exotic metaphysics attached. If that hypothesis is wrong, tell me exactly where the translation breaks and which of the six mappings carries the most weight in breaking it. Don't soften the verdict.

  Structure the answer as the six translations first, then the consolidated residue report, then the verdict on my hypothesis, in that order.
