prompt: |-
  i run a fortnightly meetup for software people, ~30 min talks, whiteboard, no slides. next slot is mine and the topic is logical uncertainty — the idea that you can be *rationally* unsure about necessary truths (statements that are either logically true or logically false, no coin flips involved), and roughly what the logical induction result says about updating on them in a principled way instead of hand-waving. the audience is comfortable with probability and code but has zero formal logic beyond a cs degree, and at least three of them are walking in with "it's all computable in principle so uncertainty about math is fake."

  don't write the talk for me. write the plan for the talk. specifically: what order the pieces have to go in and what depends on what — i suspect you can't even pose the problem right until they see why "just run the program and see" is sometimes useless even in principle, tell me if that's the right first move or a trap. then: what single example should carry the whole 30 minutes? i'm torn between the 10^100th digit of pi and some collatz-flavored statement — say if either works, what it must have and lack, or propose something better. then the misconceptions, in the order they'll actually form them, and the exact point in the sequence where i should head each off — i'm betting "this is just Bayes over a fixed set of possible worlds" shows up around minute 15, and someone will definately bring up the halting problem like it ends the conversation. also tell me what to flat-out refuse to cover at this level and say so out loud (the actual market/trader construction? the proof? something else), and give me one question i can ask at the end to check the idea landed versus them just nodding along.

  format: start with your bottom line — the whole plan compressed into one sentence — then the plan and reasoning. no preamble, no restating my question back at me.
reasoning: |-
  We are going to build the talk in the following sequence:

  Bottom line: Start by making the problem concrete with an example that forces the audience to feel the tension of logical uncertainty, then introduce the core idea of logical induction as a principled way to update beliefs about such statements, while explicitly avoiding technical details and addressing misconceptions as they arise.

  Plan:

  1. (0-5 min) **The Problem Setup**: Use a concrete example that is clearly a necessary truth but where direct computation is infeasible. We choose the 10^100th digit of pi (let's say we ask: is it 0? 1? ... 9?). Why this example?
     - It's a well-defined mathematical fact (so no coin flips).
     - The audience knows that in principle it's computable, but in practice it's not (and even in principle, the computation is too long for any physical computer). 
     - This example immediately forces the audience to confront that they are uncertain about this digit right now. But note: we are not talking about practical uncertainty (which they'll grant) but *rational* uncertainty. The challenge: how to assign a probability to this digit being 7, say, and update that probability as we get more evidence (without computing the digit)?

  2. (5-10 min) **Why "Just Compute It" Fails in Practice and in Principle?**
     - In practice: The computation is too long (even if we started now, we wouldn't finish before the heat death of the universe). 
     - In principle: What if we consider the entire lifetime of the universe? We still can't compute it. Moreover, even if we had a fast computer, we might be waiting for the result and need to make decisions in the meantime (e.g., betting). But more importantly, we are going to extend to statements that are not just about digits of pi but about more complex things (like Collatz) where we don't even know if the computation halts.

  3. (10-15 min) **Introduce a More Challenging Example: Collatz Conjecture** (or similar). 
     - Why? Because the digit of pi is computable (we know the algorithm) but Collatz is open: we don't know if the computation for every starting number halts. So we can't even run a program to check for all numbers. But we can run it for some numbers and get evidence. 
     - We can ask: what is the probability that the Collatz conjecture is true? We can update this as we check more numbers and they all converge to 1. But note: we might also get a counterexample. However, if we check a trillion numbers and they all hold, we feel more confident. How do we formalize that without Bayes over possible worlds (which we'll address next)?

  4. (15-20 min) **Address Misconceptions** as they arise:
     - "This is just Bayes over possible worlds": 
          - Rebuttal: In standard Bayesianism, you have a fixed set of possible worlds. But here, the truth is necessary (only one world). So how can you assign a probability? We need to assign probabilities to *propositions* that are either true or false in the one real world. Logical induction is about having a probability distribution over logical sentences that respects logical constraints in a timely manner (as proofs come in).
     - "Halting problem says we can't know, so we should just assign 0.5 and be done":
          - Rebuttal: The halting problem says there's no general algorithm, but that doesn't mean we can't have a rational degree of belief. We update as we see partial results (e.g., the program hasn't halted after 1 billion steps). Also, we might have meta-mathematical evidence (e.g., many similar programs halt). Logical induction can incorporate that.

  5. (20-25 min) **The Core Idea of Logical Induction** (without the machinery):
     - We want a probability assignment to logical statements that is "coherent" in the limit (i.e., eventually correct) and that updates efficiently as new proofs (or evidence) comes in. 
     - The key: We can think of a logical inductor as a trader in a market who is trying to avoid being exploited. The prices (probabilities) are set so that no trader can make infinite money by betting against the market if the market is wrong. 
     - We don't need to build the market; just the idea that the probabilities are set in a way that they cannot be "arbitraged" in the long run. 
     - Example: If we have a proof that statement A implies statement B, then the probability of B should be at least as high as that of A. If the market doesn't satisfy that, a trader could buy B and sell A and make a sure profit in the long run.

  6. (25-30 min) **Wrap-up and the Big Picture**:
     - Logical uncertainty is real because we are bounded agents. 
     - Logical induction gives a principled way to assign probabilities and update them as we get more logical evidence (like checking more digits, more numbers in Collatz, or even getting part of a proof). 
     - It's not just about digits of pi or Collatz: it applies to any mathematical statement, including the consistency of ZFC, the Riemann Hypothesis, etc.

  What to avoid:
     - The actual construction of the market and the traders. Say: "We won't go into the details of how the market is built, but the key is that it avoids arbitrage and converges to the truth."
     - The proof of convergence. Say: "The proof is complex and we don't have time, but the result is that such a logical inductor exists and has nice properties."

  Check question at the end:
     - Ask: "Suppose we have two statements: A and B. We don't know if they are true, but we know that A implies B. How should the probability of A and B relate? And what if we then find a proof that A is true? How does the probability of B change?" 
       - Answer: Initially, P(B) should be at least P(A). After proving A, P(B) should jump to at least the old P(A) (and in fact, to 1 if we are certain of the proof and the implication).

  This question checks if they understood that logical induction enforces coherence with logical constraints and updates appropriately.
answer: |-
  **Bottom line:** Start with a concrete example that forces the audience to confront the impracticality of brute-force computation for necessary truths (using the 10¹⁰⁰th digit of π), pivot to the Collatz conjecture to highlight undecidability and evidence-based updates, preempt misconceptions about Bayesianism and computability at key points, explicitly skip the trader/market mechanics and proof details, and end with a question probing coherence under implication.

  ### Plan & Reasoning  
  **1. Hook with π's digit (0–5 min)**  
  - **Example:** "What's P(10¹⁰⁰th digit of π is 7) *today*?"  
  - **Why:**  
    - Necessary truth (no randomness).  
    - Computable *in principle* but *infeasible in practice* (state that computing it would take > universe's age).  
    - **Force the tension:** Ask *"Would you bet your life savings at 50:50 odds right now?"* → Highlights that "just compute it" is practically useless. Preempts "fake uncertainty" objections by making uncertainty visceral.  

  **2. Deepen with Collatz (5–12 min)**  
  - **Example:** "I run Collatz(10¹⁰⁰ + 1). After 1 minute, it hasn't halted. What’s P(Conjecture is true) *now*?"  
  - **Why better than π:**  
    - Adds *undecidability*: We don’t even know if it halts for all n (unlike π, where algorithm exists).  
    - Shows *updating with evidence*: Observing 10⁶ steps without halting vs. halting after 10³ steps changes beliefs.  
    - **Key transition:** "Unlike π, here we can’t ‘just compute’—we might *never* know. But we still update rationally."  

  **3. Define logical uncertainty (12–15 min)**  
  - **Core problem:** "How to assign P(φ) to logical statement φ when we lack a proof/disproof?"  
  - **Clarify scope:** Reject physical randomness. Emphasize *bounded rational agents*.  
  - **Bridge:** "This isn’t about ignorance—it’s about principled updates with partial evidence."  

  **4. Preempt misconceptions (15–22 min)**  
  - **Order and timing:**  
    - *Minute 15:* **"Bayes over possible worlds"** objection.  
      - **Response:** "Worlds don’t help here—there’s only *one* math universe. If φ is true, all ‘worlds’ must satisfy it. How do you assign P(φ) without worlds?" → Introduce *coherence*: P must respect logical constraints (e.g., if φ → ψ, P(φ) ≤ P(ψ)).  
    - *Minute 18:* **Halting problem** objection ("Uncertainty is inevitable, so why formalize?").  
      - **Response:** "Yes, undecidability exists. But we *do* update beliefs (e.g., after seeing 10¹⁰ Collatz sequences converge). Logical induction tells us *how* to do this without hand-waving."  

  **5. Logical induction intuition (22–27 min)**  
  - **Core idea:** "A ‘logical inductor’ is a process that outputs probabilities for logical claims, satisfying:  
    1. *Coherence:* No Dutch books (e.g., if φ → ψ, P(φ) ≤ P(ψ) at all times).  
    2. *Timely updates:* If φ is proven, P(φ) → 1 quickly.  
    3. *Learning:* In the limit, it’s correct on all provable/disprovable claims."  
  - **Analogy:** "Like a prediction market for math. Traders bet on statements, pushing prices toward truth."  
  - **Explicitly skip:** "We won’t cover *how* the market works (traders, etc.) or proofs—just the guarantees."  

  **6. Big picture and check question (27–30 min)**  
  - **Why care:** "For AI alignment, decision theory, or anytime you act on unproven math (e.g., crypto)."  
  - **Check question:** "If you know A → B, and P(A) = 0.6, what *must* P(B) be? What if you then learn A is true?"  
    - **Goal:** Test grasp of coherence (P(B) ≥ 0.6 pre-proof → P(B) = 1 post-proof). If they nod but answer wrong, reteach coherence.  

  ### Why This Sequence Works  
  - **π first:** Creates intuitive discomfort with "compute in principle." Collatz then generalizes to undecidable cases.  
  - **Misconceptions timed:** Bayesian objection arises when probability is defined—address it *then*. Halting objection comes after undecidability is visible.  
  - **Collatz > π for evidence:** Shows how negative observations (no halt yet) lower P(conjecture)—more vivid than static π digit.  
  - **Skipped:** Trader/market construction (too technical), convergence proofs (overkill). Say: "We’re focusing on *what it does*, not *how it’s built*."  
  - **Check question:** Targets the most critical insight (coherence under implication), which underpins the entire framework.
