prompt: |-
  hey! so for my school's "science meets philosophy" club we do this thing where we interview a guest scholar, and this month our teacher got us a logic/metaphysics person who defends the open future view — like the Łukasiewicz idea that a statement about tomorrow's sea battle is neither true nor false yet. i'm supposed to write the questions but honestly i'm way out of my depth lol.

  you're a profesional philosopher who specializes in time, truth, and logic. please think carefully before you write, and maybe start with a quick brainstorm of where this view is weakest, so the questions actually go somewhere. i need 8-10 interview questions that press on the view instead of just asking him to re-explain it. specifically i want at least:

  - one question about the "it's true NOW that tomorrow it will have been false that there was a sea battle" thing — my friend says this trick basicly wrecks the whole view but i don't fully get why, so ask it in a way that forces him to untangle it
  - one about whether the sentence "either there will be a sea battle tomorrow or there won't" is itself true — bc on his three-valued logic i think that sentence also comes out neither-true-nor-false, and that seems like a bug not a feature (is he really ok losing all those obvious truths?)
  - one about whether he has only fixed a problem about SENTENCES (semantics) and not about whether the future actually exists yet (metaphysics) — like is the open future just a fancy way of changing the subject
  - one wierd one of my own: what happens to predictions in his view — if a fortune teller says "there will be a sea battle tomorrow" and the future is open, is she wrong, right, or neither? what would even count as her knowing the answer?

  and for each main question, add a follow-up keyed to the answer he's most likely to give. our teacher warned us he likes to deflect with something like "that's a feature of the view, not a bug," so try to write follow-ups that make that line harder and harder to keep using, ending with one question about what evidence could actually count against his view. don't make it super formal — it's for high schoolers — but no softball questions like "what drew you to philosophy," our club president already called dibs on that one
