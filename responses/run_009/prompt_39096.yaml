prompt: |-
  I lead a small estimation team at a mid-size engineering firm — our whole job is telling other departments how long projects will take and what they'll cost. I got sold on the outside view idea after reading some forecasting stuff: don't reason forward from the details of YOUR project, start from how similar projects actually went, because the details are mostly wishful thinking. Sounds great, but every time I bring it to a meeting it dies one of two ways. Either someone says "every project is different, you can always find a reference class that gives you whatever number you wanted," which... I don't have a good answer to. Or someone says "the whole point of our expertise is the inside view — if we can't use what we know about OUR parts supply chain, what are we even being paid for," which I also don't have a good answer to. And there's a third thing I can feel but can't name, where the team defers way too much to whichever engineer is most confident in the room, which seems like the opposite of epistemic modesty but I'm not sure the outside-view stuff actually says anything about that.

  So I want a procedure we can actually run inside an estimation meeting — one hour, engineers with zero patience for philosophy, a number has to come out the other end. Not a lecture on reference classes. Something like: steps in order, when the outside view is allowed to override inside reasoning and when it isn't, how to handle the reference class selection problem (how many projects before a class isn't gerrymandered, what to do when two plausible classes give very different numbers), what actually counts as "we fixed the thing that made the last three projects late" as opposed to a story about how we fixed it, and how to fold in the room's individual estimates without the loudest person just winning. Mark clearly where the procedure runs out and it becomes a judgment call I have to own as the lead — I don't want it pretending to be mechanical where it isn't. Also tell me where it will predictably misfire; I'd rather know now.

  Then run it on three of our actual kinds of jobs: (1) a cooling retrofit that's late because of a parts supply issue we think we've genuinely solved, (2) an internal software migration where the reference class of enterprise migrations says 2x over budget every single time but we're using a new method the vendor swears changes the game, and (3) a first-of-its-kind pilot for the company — some AI-based inspection thing — where I honestly cannot find a reference class that isn't cherry-picked to give the answer someone wants. At least one of these should come out with an answer I won't like — I suspect the migration one, since I already committed a number to the client — and tell me what I'm supposed to say to my team when the procedure contradicts me.
reasoning: |-
  We are designing a structured estimation procedure for a team meeting. The goal is to incorporate both the outside view (reference class forecasting) and the inside view (specific expertise) while avoiding common pitfalls like overconfidence, loudest voice wins, and cherry-picking reference classes.

   The procedure must:
   - Fit into a one-hour meeting.
   - Be step-by-step, with clear rules for when to use outside vs inside view.
   - Address reference class selection: how to avoid gerrymandering, what to do when multiple classes conflict.
   - Define what counts as evidence of having "fixed" a past problem (vs just a story).
   - Aggregate individual estimates without letting the loudest dominate.
   - Clearly mark where judgment calls are needed and where the procedure might misfire.

   Steps:

   1. **Preparation (Before Meeting):**
      - The estimation lead (you) prepares:
          a. A list of potential reference classes (with data: number of projects, average duration/cost, variance).
          b. For each reference class, note the reasons why it might be similar or different to the current project.
          c. Identify the key uncertainties and risks that have caused deviations in the past (e.g., parts supply chain in cooling retrofits).
      - Each team member is asked to provide an initial estimate (with a range) and a brief rationale (via email or form) without group discussion. This avoids anchoring by the first speaker.

   2. **Step 1: Define the Project (5 minutes)**
      - Briefly describe the project, its scope, and key features.
      - Identify the key variables to estimate (e.g., duration, cost).

   3. **Step 2: Outside View - Reference Class Selection (10 minutes)**
      - Present the pre-identified reference classes and their statistics (average, variance).
      - Rule: A reference class must have at least 5 projects to be considered (to avoid small sample issues). If a class has less, it can only be used if there is a strong similarity and no larger class exists, but this must be flagged as weak.
      - Discuss which reference classes are most relevant. The lead should note the reasons for similarity and difference.
      - If multiple reference classes are plausible and give different numbers, the lead must:
          - If the classes are nested (e.g., all software migrations vs. migrations with this vendor), use the most specific class that has at least 5 projects.
          - If the classes are non-nested (e.g., cooling retrofits vs. HVAC projects in general) and give conflicting numbers, present both and note the conflict. Then, the lead must make a judgment call on which is more relevant (and state why) OR take a weighted average (weighted by similarity). This is a judgment point.
      - Output: A reference class estimate (with range) and a note on the quality of the reference class (strong, medium, weak).

   4. **Step 3: Inside View - Adjustments (15 minutes)**
      - Now, the team discusses specific factors of the current project that may cause it to differ from the reference class.
      - Rule: Adjustments are only allowed if there is documented evidence or a clear, measurable difference from the reference class. For example:
          - "We fixed the parts supply issue" must be backed by evidence: e.g., a new contract with the supplier that has been tested in a pilot and resulted in on-time delivery for the last 3 small projects, or a redundant supply chain. A story without evidence is not enough.
          - "We are using a new method" must have a pilot or data from a similar context showing it works. Vendor promises without evidence are not enough.
      - Each adjustment must be quantified (e.g., "this factor reduces the time by 10%"). The team must agree on the magnitude of the adjustment and the evidence.
      - The lead records the adjustments and the evidence level (strong, medium, weak).

   5. **Step 4: Individual Estimates and Aggregation (15 minutes)**
      - Display the initial individual estimates (from the pre-meeting) anonymously. Show the range and the median (or mean) of the individual estimates.
      - Discuss the reasons for the high and low estimates. Encourage the estimators to explain their reasoning without naming themselves.
      - Rule: The loudest voice does not win. The lead must ensure that everyone speaks. If someone is dominating, the lead should explicitly ask others: "Do you agree? What is your take?"
      - After discussion, each member revises their estimate (if they wish) and submits it anonymously again.
      - Aggregate the revised estimates: take the median as the group estimate (to avoid outliers) and note the range (e.g., 25th to 75th percentile).

   6. **Step 5: Reconciliation and Final Estimate (10 minutes)**
      - Now, we have:
          - Reference class estimate (from step 2)
          - Adjusted reference class (after step 3 adjustments)
          - Aggregated individual estimates (from step 4)
      - Compare these numbers. The lead must consider:
          - If the adjusted reference class and the aggregated individual estimates are within 20% of each other, take the average of the two.
          - If they are more than 20% apart, then:
              - Check the quality of the reference class and the adjustments: if the reference class is strong and adjustments are evidence-based, then the reference class estimate should be weighted more (say 70% reference, 30% individual). If the reference class is weak and the adjustments are weak, then weight the individual estimates more (say 70% individual, 30% reference). This is a judgment call by the lead.
      - The lead states the final estimate and the rationale, including the weights used and the key uncertainties.

   7. **Step 6: Document and Review (5 minutes)**
      - Document the reference class(es) used, adjustments, individual estimates, and the final estimate with reasoning.
      - Note the evidence level for adjustments and the reference class quality.

   Where the procedure runs out and requires judgment:
     - Step 2: When multiple reference classes conflict and are non-nested -> lead decides which to use or how to weight.
     - Step 5: When the adjusted reference class and the aggregated individual estimates are far apart -> lead decides the weighting.
     - Throughout: The lead must judge the quality of evidence for adjustments.

   Predictable Misfires:
     - When there is no good reference class (e.g., first-of-its-kind project) -> the outside view becomes weak and the procedure may over-rely on individual estimates, which are prone to overconfidence.
     - When the team is overly optimistic about adjustments (e.g., believing vendor promises) and the lead doesn't push back -> adjustments without evidence may lead to underestimates.
     - When the initial individual estimates are anchored by pre-meeting information (if not collected properly) or if the group discussion doesn't correct for overconfidence.
     - When the reference class data is poor (e.g., past projects were not tracked well) -> the outside view may be misleading.

   Now, apply the procedure to the three examples:

   Example 1: Cooling retrofit (late because of parts supply, now fixed)

   Step 1: Project: Cooling system retrofit. Key variable: duration.

   Step 2: Reference class:
     - Class A: Past cooling retrofits (10 projects). Average duration: 6 months, with 2 months standard deviation. 
     - The current project is similar in scope and size.

   Step 3: Inside adjustments:
     - Claim: Parts supply issue fixed. Evidence: We have a new contract with the supplier that includes penalties for delay, and we have successfully completed 3 small projects with this supplier on time since the new contract. This is strong evidence.
     - Adjustment: The previous delays due to parts were 1 month on average. So we reduce the estimate by 1 month? But note: the reference class already includes projects with and without the issue? We must check: in the 10 projects, 7 had the issue and were delayed by 1 month, 3 without were on time. So the average of 6 months includes the issue. Without the issue, the average would be (6*10 - 7*1) / 10 = 53/10 = 5.3 months? But better: recalc average of the 3 without: they were 5 months. So we adjust to 5 months? But wait, we are not sure if the current project is like the 3 without. The lead must judge: if the current project is similar to the 3 without, then 5 months. Otherwise, we can adjust by subtracting the average delay (1 month) from the class average? But that is 5 months. So we'll go with 5 months.

   Step 4: Individual estimates (pre-meeting): 
     - Estimates in months: [4, 5, 5, 6, 7] -> median=5, range 4-7.
     - After discussion, revised estimates: [5, 5, 5, 6, 6] -> median=5, range 5-6.

   Step 5: Reconciliation:
     - Adjusted reference: 5 months.
     - Individual median: 5 months.
     - They are the same -> final estimate: 5 months.

   Example 2: Internal software migration (reference class: 2x over budget; vendor claims new method)

   Step 1: Project: Software migration. Key variable: cost (relative to initial budget).

   Step 2: Reference class:
     - Class A: Enterprise software migrations (20 projects). Average cost overrun: 100% (i.e., 2x budget). 
     - Class B: Migrations with this vendor? (if any) Let's say we have 5 projects with this vendor (without the new method) and they averaged 120% overrun. 
     - We choose Class A because it's larger and more general (and Class B is with the same vendor but without the new method). So we start with 100% overrun.

   Step 3: Inside adjustments:
     - Claim: New method changes the game. Evidence: Vendor provided a case study of one company that had only 20% overrun using the method. But we have no internal experience with the method. This is weak evidence (only one example, from the vendor). 
     - Adjustment: We might adjust the overrun downward? But how much? We don't have a basis. The team might argue for a 50% reduction? But without evidence, the lead should reject the adjustment or only allow a small adjustment. 
     - Alternatively, we can create a new reference class: "projects using this new method". But we only have one project -> too small (n<5). So we cannot use it as a reference class. 
     - Therefore, no adjustment is allowed due to lack of evidence. The reference class estimate remains 100% overrun.

   Step 4: Individual estimates (pre-meeting): 
     - Estimates for overrun: [20%, 50%, 100%, 120%, 150%] -> median=100%, range 20-150%.
     - After discussion: Some may be swayed by the vendor's story. Revised: [50%, 80%, 100%, 100%, 120%] -> median=100%, range 50-120%.

   Step 5: Reconciliation:
     - Adjusted reference: 100% overrun (no adjustment).
     - Individual median: 100% overrun.
     - Final: 100% overrun.

   But note: the lead might feel pressure because they already committed a lower number to the client. The procedure says 100% overrun. The lead must own this and explain to the team: "The procedure, based on the evidence we have, suggests 100% overrun. We must communicate this to the client and renegotiate or add contingency. We cannot ignore the reference class without strong evidence of a change."

   Example 3: First-of-its-kind AI pilot

   Step 1: Project: AI-based inspection pilot. Key variable: duration.

   Step 2: Reference class:
     - The lead has tried to find reference classes but found:
          Class A: Traditional inspection projects (n=15) -> average 3 months.
          Class B: AI projects in other domains (n=8) -> average 6 months.
          Class C: Similar AI inspection pilots in other companies (n=2) -> average 9 months.
     - All have issues: Class A is not AI, Class B is not inspection, Class C is too small. 
     - Judgment: The lead decides to use Class B as the primary (because it's AI) and Class A as a secondary. But Class B is non-inspection and Class A is non-AI. We might use a weighted average? For example, 70% Class B and 30% Class A? Then: (0.7*6 + 0.3*3) = 4.2 + 0.9 = 5.1 months. But this is arbitrary. Alternatively, we can take the average of the two averages? (6+3)/2=4.5? 
     - However, note the variance: Class B has a standard deviation of 2 months, Class A has 1 month. 
     - Since the project is an AI pilot, the lead might choose Class B (6 months) but note the high uncertainty. 
     - Alternatively, we might create a new class by combining? But that's not statistically sound. 
     - The lead decides to use Class B (AI projects) with 6 months as the reference, but marks it as medium quality (because it's not the same domain).

   Step 3: Inside adjustments:
     - The team might argue that this pilot is smaller in scope than the average AI project in Class B. 
     - Evidence: The project has only 5 inspection points, while the average in Class B had 10. We can adjust: half the scope? Then 3 months? But is it linear? We don't know. 
     - Without evidence, the lead should be cautious. Maybe adjust by 20%? Then 6 * 0.8 = 4.8 months? 
     - But let's say we have data from Class B: a few small projects (n=3) in that class averaged 4 months. Then we can adjust to 4 months? 
     - If we have that data, then we can use a subset of Class B (small AI projects) as a new reference class? But n=3 is too small. 
     - So we might allow an adjustment of 25% (because 4 is 33% less than 6, but we only have 3 projects -> weak). 
     - The lead might decide: adjust by 25% -> 4.5 months? Or stick to 6 months? 
     - Without strong evidence, the lead might decide to keep the 6 months and note the risk.

   Step 4: Individual estimates:
     - Pre-meeting: [2, 3, 4, 6, 12] -> median=4, range 2-12.
     - After discussion: [3, 4, 5, 6, 8] -> median=5, range 3-8.

   Step 5: Reconciliation:
     - Adjusted reference: 6 months (or 4.5 if we allowed a weak adjustment? Let's say the lead kept 6 months).
     - Individual median: 5 months.
     - They are 16.7% apart (|6-5|/6=16.7% < 20%), so take average: (6+5)/2 = 5.5 months.
     - But the lead must consider the quality: reference class is medium, adjustments were weak, individual estimates are from experts. The lead might decide to round to 6 months to be conservative? Or take 5.5? 
     - Given the high uncertainty in AI projects, the lead might choose 6 months with a note that the range is 3-8.

   What to say when the procedure contradicts the lead's prior commitment (as in Example 2):
     - "I understand that we have a prior commitment, but the procedure we've agreed upon as a team has produced this estimate based on the available evidence. We have two choices: either we present this to the client and renegotiate, or we document the risk and set aside a contingency. Ignoring the reference class without strong evidence would be against our process and could lead to failure. Let's discuss how to communicate this to the client."

   This procedure provides structure but requires the lead to make key judgments. It forces the team to confront the evidence and reduces the impact of the loudest voice by using anonymous estimates and structured steps. However, it may break down when data is very scarce (like Example 3) and relies heavily on the lead's impartiality and judgment.
answer: |-
  ### Structured Estimation Procedure for Team Meetings  
  **Goal:** Integrate outside view (reference class forecasting) and inside view (expertise) in 60 minutes, with clear rules to avoid cherry-picking, overconfidence, and loudest-voice bias.  

  ---

  ### Step-by-Step Procedure  
  **Preparation (Before Meeting):**  
  - **Estimation Lead (You):**  
    - Gather data on past projects (duration, cost, why they succeeded/failed).  
    - Pre-identify 2–3 plausible reference classes (e.g., "cooling retrofits," "enterprise software migrations").  
    - Require engineers to submit initial estimates + rationale via email (prevents anchoring).  

  **Meeting Flow (60 Minutes):**  
  #### 1. **Frame the Problem (5 mins)**  
     - State the project’s scope, deliverables, and key uncertainties (e.g., "This is a cooling retrofit; key risk is parts supply").  
     - **Output:** Clear problem statement.  

  #### 2. **Outside View: Anchor with Reference Class (15 mins)**  
     - **Rule:** Start here—no inside-view arguments yet.  
     - **Steps:**  
       a. Present pre-identified reference classes and their historical averages/ranges.  
       b. **Selection Criteria:**  
          - Minimum 5 projects per class (avoids cherry-picking).  
          - If classes conflict (e.g., "HVAC projects" vs. "retrofits with Supplier X"), use the narrowest class with ≥5 projects.  
          - If no narrow class exists, use the broader class and flag low confidence.  
       c. **Output:** Baseline estimate (e.g., "Cooling retrofits: Avg. 6 months, 70% went over").  
     - **When Overridden:** Only if the project is *truly* novel (e.g., first AI pilot).  

  #### 3. **Inside View: Adjustments (20 mins)**  
     - **Rule:** Allow adjustments only for *proven, measurable* deviations from the reference class.  
     - **Steps:**  
       a. Team lists proposed adjustments (e.g., "Parts delays fixed").  
       b. **Evidence Test:**  
          - **Valid Evidence:** Data (e.g., "Supplier delivered on-time in last 3 pilot projects").  
          - **Invalid Evidence:** Stories (e.g., "Vendor swears method is faster").  
       c. Quantify adjustments (e.g., "-1 month for parts fix").  
       d. If no evidence, revert to reference class baseline.  
     - **Output:** Adjusted estimate (e.g., "6 months – 1 month = 5 months").  

  #### 4. **Aggregate Individual Estimates (15 mins)**  
     - **Rule:** Silence loud voices; use anonymity.  
     - **Steps:**  
       a. Share pre-meeting estimates (anonymously) as a range (e.g., "4–8 months").  
       b. Discuss divergences (e.g., "Why do some think 4 months?").  
       c. Revote anonymously; take the **median** (reduces outlier influence).  
     - **Output:** Median estimate (e.g., "5.5 months").  

  #### 5. **Reconcile & Finalize (5 mins)**  
     - Compare:  
       - Reference class baseline.  
       - Adjusted outside view.  
       - Median inside view.  
     - **Rule of Thumb:**  
       - If estimates are within 20% → Average them.  
       - If >20% apart → Default to reference class *unless* inside view has strong evidence.  
     - **Lead’s Judgment Call:** Weigh evidence quality (e.g., "Weak vendor claim vs. solid historical data").  
     - **Output:** Final estimate with rationale (e.g., "5 months: Reference class minus proven fix").  

  #### 6. **Document & Flag Uncertainty (Ongoing)**  
     - Record: Reference class, adjustments, evidence, and confidence level (High/Medium/Low).  
     - Track estimates vs. outcomes to improve future reference classes.  

  ---

  ### Where Judgment Is Required (Own It!)  
  1. **Reference Class Conflicts:** When two classes are equally valid but disagree, you decide which is more relevant.  
  2. **Evidence Weighting:** You judge if "we fixed it" evidence is strong enough.  
  3. **Novel Projects:** No reference class? Default to inside view but add 30% contingency (see Pilot example below).  
  4. **Reconciliation Deadlock:** You break ties by favoring the outside view unless evidence is overwhelming.  

  ### Predictable Misfires  
  - **Over-Optimism:** Engineers will push weak adjustments ("This time is different!"). Hold the line on evidence.  
  - **Sparse Data:** Few past projects? Reference class may be unreliable. Mitigate by using broader industry data.  
  - **Black Swans:** Unprecedented events (e.g., supply chain collapse) won’t be captured. Always include a risk buffer.  
  - **Politics:** Stakeholders may reject estimates that threaten budgets. Document your rationale and escalate.  

  ---

  ### Applied to Your Cases  
  #### Case 1: Cooling Retrofit (Parts Issue "Fixed")  
  - **Reference Class:** Past 8 cooling retrofits → Avg. 6 months, 75% had parts delays.  
  - **Adjustment Claim:** "Parts issue solved."  
    - **Evidence Test:** New contract with penalties + 3 on-time deliveries for small projects → **Valid.**  
    - **Quantify:** Past delays averaged 1 month → Subtract 1 month.  
  - **Individual Estimates:** Pre-meeting median: 5 months.  
  - **Reconcile:**  
    - Baseline: 6 months → Adjusted: 5 months.  
    - Inside-view median: 5 months.  
    - **Final:** 5 months (high confidence).  
  - **Why It Works:** Evidence-backed adjustment aligns with team input.  

  #### Case 2: Software Migration (Vendor Promises "Game Changer")  
  - **Reference Class:** 12 enterprise migrations → 100% went 2x over budget.  
  - **Adjustment Claim:** "New method cuts overruns."  
    - **Evidence Test:** Vendor case study (1 project) + no internal trials → **Weak.**  
  - **Individual Estimates:** Pre-meeting median: 1.5x overrun (optimism).  
  - **Reconcile:**  
    - Baseline: 2x overrun.  
    - Adjusted: No change (no evidence).  
    - Inside-view median: 1.5x.  
    - **>20% gap** → Default to reference class (2x).  
  - **Final:** 2x overrun (medium confidence).  
  - **Contradicts Your Commitment?** Your script:  
    > "I know I promised less, but the data says 100% of similar projects blew up. Unless we have proof this vendor is different, we’d be gambling with the company’s money. Let’s either renegotiate with the client or add contingencies."  

  #### Case 3: AI Inspection Pilot (No Reference Class)  
  - **Reference Class:** None with ≥5 projects. Broader classes:  
    - "AI projects" (volatile, avg. 8 months).  
    - "Traditional inspections" (stable, avg. 3 months).  
  - **Judgment Call:**  
    - Use "AI projects" as baseline (higher risk).  
    - Add 30% contingency due to novelty → 10.4 months.  
  - **Individual Estimates:** Wild spread (2–18 months); median: 6 months.  
  - **Reconcile:**  
    - Baseline: 8 months → Adjusted: 10.4 months (contingency).  
    - Inside-view median: 6 months.  
    - **>20% gap** → Default to outside view (novelty risk).  
  - **Final:** 10 months (low confidence, document high uncertainty).  
  - **Why You’ll Hate It:** It’s longer than engineers want, but novelty demands caution.  

  ---

  ### Keys to Success  
  - **Shut Down "Every Project Is Different":** Respond:  
    > "Data shows 80% of projects in this class overran by X%. If we ignore that, we’re ignoring reality. What *specific* evidence makes this one an exception?"  
  - **Neutralize Loud Voices:** Enforce anonymous voting and evidence checks.  
  - **When Engineers Push Back:**  
    > "Our expertise matters most when it’s tested against data. If we’re always the exception, why did past projects fail?"  
  - **Train the Team:** Run a 15-minute workshop showing past projects where "this time is different" failed.  

  This procedure forces evidence-based decisions, curtails storytelling, and makes uncertainty explicit. It won’t eliminate politics—but it gives you the tools to defend the numbers.
