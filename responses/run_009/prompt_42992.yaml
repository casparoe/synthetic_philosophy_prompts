  Fame presupposing an audience ties into the homunculus problem. If fame needs an internal observer, it reintroduces the Cartesian theater. Similarly, the spotlight needing an operator suggests a controller, which GWT attributes to unconscious processes, but that might not resolve the issue. Broadcast reconfiguring the audience shows that in the brain, the modules change based on the information, which could be a point for GWT's dynamic system view, but it doesn't necessarily address phenomenality.

