  First, I need to break down the core claims of each theory. Higher-order theories (HOT) say a mental state is conscious if it's represented by a higher-order state. First-order theories (FOT) argue that consciousness is intrinsic to the first-order state itself. The user mentions common objections: misrepresentation, lack of a monitoring mechanism, and whether dispositionalist versions still hold the original view.

  The user's hypothesis is that they're using "conscious" for different explananda. One is a functional property tied to access and reporting (HOT), the other is the subjective experience itself (FOT). This makes sense. HOT is about how states become available for higher cognition, while FOT is about the qualitative feel. 

  But are they really talking about different things? Some might argue that both aim to explain phenomenal consciousness. HOT theorists might say their theory does account for phenomenality through representation. But critics say that HO representation doesn't necessarily create phenomenality; it's just about access. The user's point here seems valid. 

  Then, is there a hidden question? Maybe about how brain states relate to reports, or the nature of representation. For example, if neuroscience finds that first-order states suffice for reports without HO states, that could challenge HOT. Or if HO states are always involved when reports happen, it might support HOT. But even then, FOT could argue that HO states are just enabling access, not creating the experience. 

  What about conceptual issues? The concept of representation itself might be muddy. HOT relies on representation to confer consciousness, but if representation is a functional relation, does it add phenomenality? Or is it just about information processing? 

  Progress could be empirical. Neuroscience might find neural correlates for HO states during conscious reports. If HO activity is necessary for reports but not for phenomenology (if that can be measured), that could split the explananda. Or if HO states are found to directly modulate first-order states' phenomenology, HOT gains ground. But separating phenomenology from report is tricky. 

  Conceptual progress: clarifying terms like "consciousness," "representation," "access." Maybe adopting different terms for access vs. phenomenality. Or redefining the debate's scope. 

  The user might be frustrated with the stalemate and seeking a way to move beyond it. Their deeper need might be to provide students with a clearer framework or to find a resolution path. They might also want validation that their hypothesis is reasonable, which it is. 

  In conclusion, the user's diagnosis holds weight. The disagreement might stem from targeting different aspects. Progress could come from empirical findings that dissociate neural mechanisms for phenomenality and access, or conceptual refinements that clarify the terms. Without such developments, the debate might remain stuck.
answer: |-
  Your diagnosis—that the two camps are targeting distinct explananda—captures a core structural issue in the debate. However, the disagreement is not *merely* verbal; it reflects a substantive clash about the **nature and mechanisms of phenomenal consciousness**. Below, I assess the structure of the dispute, identify hidden questions, and outline potential paths for progress.

  ### Core Claims & The Hidden Tension
  1. **Higher-Order Theories (HOT)**  
     - **Claim**: A state is phenomenally conscious iff it is represented by a higher-order state (e.g., Armstrong, Rosenthal).  
     - **Target explanandum**: *Introspective access*—why some states are available for reporting, self-reflection, and cognitive integration.  
     - **Hidden commitment**: Phenomenality is constitutively tied to access ("consciousness = mental appearance").  

  2. **First-Order Theories (FOT)**  
     - **Claim**: Phenomenal consciousness is an intrinsic property of first-order representational states (e.g., Dretske, Tye).  
     - **Target explanandum**: *Subjective experience* itself—the "what-it’s-like" independent of higher-order awareness.  
     - **Hidden commitment**: Phenomenality is grounded in first-order representation (e.g., sensory processing).  

  **The crux**: HOTs see consciousness as *relational* (requiring meta-representation), while FOTs see it as *non-relational* (intrinsic to perceptual states). The "verbal" disagreement arises because:  
  - HOTs equate "conscious" with *access-consciousness* (reportability, introspective visibility).  
  - FOTs equate "conscious" with *phenomenal consciousness* (raw subjective feel).  

  But the **substantive conflict** remains: **Does phenomenality *require* higher-order representation?**  

  ### Hidden Substantive Questions  
  1. **Empirical**:  
     - **Neural dissociation**: Are there neural states supporting phenomenal qualities (e.g., visual qualia) *without* activation in regions associated with meta-cognition (e.g., prefrontal cortex)?  
       - *Evidence for FOT*: Blindsight patients report no visual experience despite preserved first-order processing.  
       - *Evidence for HOT*: Prefrontal lesions impair conscious access despite intact sensory processing (e.g., global workspace theories).  
     - **Mechanism of "inner sense"**: Is there a cognitive architecture for higher-order monitoring (e.g., attentional feedback loops)?  

  2. **Conceptual**:  
     - **The nature of representation**: Can higher-order states *create* phenomenality, or merely *report* it? (FOT: HO states are "empty" without first-order content; HOT: HO states confer subjective "presence").  
     - **Misrepresentation**: If a HO state misrepresents a first-order state, does the subject experience an illusion (HOT) or nothing (FOT)?  

  ### Paths to Progress  
  Progress requires **disambiguating explananda** and **resolving empirical dependencies**:  

  1. **Neuroscientific Breakthroughs**:  
     - Identify neural correlates of *phenomenality* (e.g., via no-report paradigms or biomarkers for subjective states) vs. correlates of *access* (e.g., report-related activity).  
     - **Critical test**: If prefrontal/higher-order activity is *necessary* for phenomenal states (e.g., in dreams or anesthesia), HOT gains ground. If sensory/affective cortices suffice (e.g., in minimally conscious states), FOT is strengthened.  

  2. **Conceptual Refinement**:  
     - **Adopt distinct terminology**: Separate *phenomenal consciousness* (qualitative feel) from *access-consciousness* (reportability), per Block (1995). This clarifies that HOTs target access, while FOTs target phenomenality.  
     - **Reject the "monitoring" metaphor**: HOTs like Kriegel (same-order theory) argue HO representation isn't literal "scanning" but intrinsic to the state’s structure. This defuses the "inner sense" objection but blurs HOT/FOT boundaries.  

  3. **Shift the Question**:  
     - Instead of "What makes a state conscious?", ask: **"What mechanisms enable a state to be *introspectable*?"** (HOT’s domain) vs. **"What mechanisms generate qualitative character?"** (FOT’s domain).  
     - This exposes HOT as a theory of *awareness* and FOT as a theory of *phenomenal content*.  

  4. **The "Nothing at All" Scenario**:  
     If phenomenal consciousness is *fundamental* (e.g., panpsychism) or *wholly dissociated* from access, the debate collapses into a category error. But current evidence suggests overlap (e.g., no unreportable rich phenomenality).  

  ### Conclusion  
  Your diagnosis is **largely correct**: The stalemate stems from conflating *access* and *phenomenality*. Yet a **substantive disagreement persists** about whether phenomenality is *intrinsic* to first-order states (FOT) or *constituted* by higher-order relations (HOT).  

  **What counts as progress?**  
  - **Short-term**: Conceptual disentanglement (e.g., accepting Block’s distinction) to reframe objections.  
  - **Mid-term**: Neuroscientific evidence dissociating neural substrates of phenomenality and access (e.g., no-report paradigms in fMRI).  
  - **Long-term**: A unifying model (e.g., Global Workspace + First-Order dynamics) showing how HO *access depends on* FO phenomenality, or vice versa.  

  Without empirical or conceptual breakthroughs, the debate risks eternal recurrence. The key is to **treat "consciousness" as a cluster concept** and demand clarity: *Which facet are you explaining?* Only then can the proxy war end.
