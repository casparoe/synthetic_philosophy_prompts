answer: |-
  ### Grading Rubric & Private Brainstorm  
  **Strong Answer Requirements:**  
  (a) *Paradox of Deontology (Scheffler):*  
  - Must articulate the tension: Agent-relative constraints forbid minimizing harm (e.g., refusing to kill 1 to save 5), leading to worse outcomes.  
  - Core paradox: Constraints appear *irrational* because they reject optimizing good/avoiding bad.  
  - Key citation: Scheffler’s framing (not Williams!) as a conflict between rationality and morality.  

  (b) *Threshold Deontology (Moore):*  
  - Define threshold: Constraints bind absolutely *until* a catastrophic threshold (e.g., millions of lives), then consequentialism overrides.  
  - Emphasize Moore’s "balance of evils" focus: Thresholds vary by act-type (torture vs. theft).  

  (c) *Assessment:*  
  - **Escape?** Threshold deontology avoids the paradox in sub-threshold cases (constraints hold) but adopts consequentialism above threshold.  
  - **Relocate?** Paradox resurfaces at the threshold (e.g., "Why is killing 1 to save *n* wrong, but saving *n+1* permissible?").  
  - Strong answers note Moore’s non-arbitrariness defense (contextual thresholds) but stress lingering discontinuity problems.  

  **Common Intro Student Errors:**  
  - Misattributing the paradox to Williams (it’s Scheffler’s formulation).  
  - Conflating double effect with the *grounds* for constraints (Scheffler treats DDE as one response, not the paradox itself).  
  - Oversimplifying threshold deontology as "becoming consequentialism" (Moore preserves deontological structure but overrides it).  
  - Ignoring the *structural* relocation of the paradox to the threshold point.  

  ---  

  ### Point-by-Point Assessment of Student Answer  
  **Letter Grade: B+** (87%)  
  **Breakdown:**  
  1. **Part (a): Scheffler’s Paradox (4.5/5)**  
     - *Strengths:* Correctly identifies the core conflict: Constraints cause worse outcomes ("five dead instead of one") and appear "inconsistent with minimizing harm." Captures Scheffler’s agent-neutral/relative distinction.  
     - *Weaknesses:*  
       - ❌ **Misattribution:** "Williams [...] was the first to press this point." *This is incorrect; Scheffler developed the paradox independently. Williams criticized consequentialism’s demandingness, not this specific formalism.*  
       - ⚠️ **Overreach on Double Effect:** "The natural way to ground such a constraint is the doctrine of double effect." *Scheffler discusses DDE as a response to the paradox but doesn’t present it as the primary grounding. The paradox applies even if DDE is rejected.*  

  2. **Part (b): Threshold Deontology (4/5)**  
     - *Strengths:* Clear definition: Constraints hold "absolutely" below a threshold, then "revert to maximizing good." Correctly notes Moore’s stakes-based threshold ("enormous level") and variable seriousness ("threshold varies with the act").  
     - *Weaknesses:*  
       - ❌ **Mischaracterization:** "Above [threshold] we revert to maximizing the good." *Moore does not frame it as "reverting" to consequentialism; threshold deontology remains deontological but overrides constraints in extremis. Consequentialism has no constraints to override.*  
       - ⚠️ **Oversimplification:** "Threshold deontology agrees with consequentialism whenever it actually matters." *This ignores cases where thresholds preserve constraints despite high stakes (e.g., no torture to save 100 lives if threshold is 1,000).*  

  3. **Part (c): Assessment (3.5/5)**  
     - *Strengths:* Correctly argues threshold deontology "escapes" the paradox sub-threshold and "relocates it to the threshold." Defends relocation as a "cost worth paying" due to identical verdicts in extreme cases. Addresses arbitrariness objection well.  
     - *Weaknesses:*  
       - ❌ **Incomplete Defense:** Claims relocation is benign because "the two views give identical verdicts in all cases that matter." *This is false: Threshold deontology still forbids (e.g.) torture at 99% of the threshold, while consequentialism permits it. The paradox persists structurally.*  
       - ⚠️ **Misses Key Problem:** Fails to note that the threshold itself creates a *new* paradox: Why is violating a constraint impermissible at *n* deaths but permissible at *n+1*? Moore’s "varying thresholds" don’t resolve this discontinuity.  

  **Writing/Clarity:** +1 bonus (Excellent concision; minor typos irrelevant).  
  **Total: 4.5 + 4 + 3.5 + 1 = 13/15 → 87% (B+)**  

  ---  
  ### Feedback to Student  
  > **Overall:** A sharp, philosophically engaged response that grasps the core arguments but stumbles on historical details and theoretical nuances. Your writing is admirably concise.  

  > **Part (a):** You precisely articulate Scheffler’s paradox: Constraints seem irrational by forbidding harm-minimization (e.g., saving 5 by killing 1). However, note that Scheffler—not Williams—formally developed *this specific paradox*. Williams critiqued consequentialism’s *demandingness*, not this structural inconsistency. Also, while double effect is one response to the paradox, Scheffler doesn’t treat it as the "natural" grounding; the paradox challenges *any* non-consequentialist constraint.  

  > **Part (b):** You correctly define threshold deontology (absolute constraints until catastrophic stakes) and note Moore’s act-sensitive thresholds. But avoid saying we "revert to consequentialism" above thresholds. Moore maintains that threshold deontology remains distinct—it *overrides* constraints in emergencies but doesn’t adopt consequentialism’s full rejection of agent-relativity.  

  > **Part (c):** Your claim that threshold deontology "escapes the paradox by becoming consequentialism where it matters" is insightful but overstated. The paradox *is* relocated to the threshold: Why is violating a constraint wrong at *n* deaths but permissible at *n+1*? Moore’s varying thresholds answer arbitrariness but not this deeper discontinuity. Crucially, threshold deontology and consequentialism *do not* "give identical verdicts in all cases that matter"—e.g., at 99% of the threshold, one forbids torture while the other permits it. This preserves the paradox’s core tension.  

  > **Final Note:** You’re thinking like a philosopher—grappling with structural tensions and defending trade-offs. Tighten attributions and push assessments further (e.g., "Does relocation *solve* the paradox or just mask it?"). Keep it up!  

  **Grade: B+**  
  *—TA’s note: No need to apologize for typos; handwriting transcriptions are brutal. Your answer was a pleasure to read.*
