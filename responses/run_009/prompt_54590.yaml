prompt: |-
  I'm taking a philosophy of physics course this semester and we just did the spacetime substantivalism vs relationism unit, and honestly I walked away more confused than when we started. My roommate is a GR grad student and keeps telling me the whole debate is obsolete because general relativity "just is" the resolution, which seems too quick -- relationists can't obviously say what the metric field is if there's no spacetime for it to live on, but substantivalists in GR have to deal with the hole argument and the fact that diffeomorphic models are supposed to be the same world. So before I try to figure out who's right, I want the spec first. Write me the list of desiderata: what any adequate account of spacetime structure actually has to deliver. The obvious ones are explaining inertial effects (Newton's bucket, the two globes tied by a cord in otherwise empty space, the difference between rotating and non-rotating when there's nothing external to rotate relative to), but also things like: handling universes with no matter at all (or only a single test particle), saying something about the metric field and gravitational waves propagating through "empty" regions, respecting the idea that shifting all the matter around without changing relational facts gives you the same world, and being consistent with how GR actually gets used by physicists. For each requirement, give the case or consideration behind it, and then tell me which ones are genuinely non-negotiable versus which are just what one camp happens to care about -- e.g. does a relationist really have to be a Machian about rotation, or is that optional?

  The part I most want is whether any subset of the desiderata is jointly unsatisfiable -- my TA hinted that something like "explain inertia relationally" plus "allow matter-free solutions" can't both be had, and if that's right the list itself is kind of a theorem. Also flag which single requirement knocks out the most candidates: I suspect it's the one about the metric field but I'm not sure. Then, briefly and without turning it into a scorecard, say how you'd even set about scoring substantivalism, relationism, and whatever the "structural realist about spacetime" middle position is supposed to be against the list -- like, does the structural view get credit for the diffeomorphism requirement or does it dodge it?

  One more constraint: don't give me a bibliography or tell me to go read某某. I can find the literature myself, and I mostly want to see whether the requirements themselves are right -- especially whether I'm smuggling in a prejudice by demanding that a theory "explain" inertia rather than just postulating it, since I've caught myself assuming that explanations bottom out somewhere. It's for a term paper proposal so I have maybe a month to decide on an angle.
