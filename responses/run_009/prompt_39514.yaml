answer: |-
  Your intuition about strict identity across time is precisely the problem endurantism fails to solve. When you say the mug is "the very same mug," you assert numerical identity between the mug-at-t1 and the mug-at-t2. But consider: if the mug was hot at t1 and cool at t2, and identity is strict (Leibniz's Law applies), how can one thing be both hot and cool without contradiction? Endurance demands that a single entity *wholly present* at different times possesses incompatible intrinsic properties—a violation of logic. Perdurantism avoids this by recognizing that the "mug" you refer to is the entire temporally extended worm; the mug-at-t1 is a temporal part *of* that whole, bearing the hotness property, while the mug-at-t2 is a distinct temporal part bearing coolness. Change *is* variation across these parts, but this *is* real change for the persisting whole—the mug-worm *has* a hot part and later a cool part. Your road analogy misfires because spatial variation isn't temporal change; perdurantism captures the asymmetry of time. Deny temporal parts, and you're stuck with a subject enduring through incompatible predicates. How is *that* coherent?

