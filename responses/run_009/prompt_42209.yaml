prompt: |-
  I'm teaching a summer intro course on political philosophy (about 22 students, one 75-minute session) and next week is the Nozick entitlement theory section from Anarchy, State, and Utopia. The reading went fine but discussion keeps stalling at the Wilt Chamberlain argument — half the class just hears "so inequality is fine??" and the other half immediately objects that D1 was never legitimately obtained in the first place, so nobody actually feels the tension Nozick is pointing at between a patterned distributional principle and people being allowed to make voluntary transfers. I want them to live through that tension instead of arguing past it. So design me an in-class game: a token economy with some real-ish stakes (points toward skipping a homework problem or something, no money), an initial distribution, trading rounds where people actually have reasons to trade, one student designated as the "Wilt" whose special skill everyone wants to pay for, and then a redistribution round imposed by majority vote after each trading round — so the redistribution has to keep happening, over and over, which is the part I most want them to feel viscerally. Also include one wrinkle I've been toying with: I want a few of the starting tokens to have deliberately sketchy provenance (some were lifted from another section's supply box before class), so the students hit the justice-in-acquisition problem themselves mid-game rather than me raising it in lecture like an objection I'm handing them.

  Give me the design as exactly five numbered sections: (1) materials and setup, including how to seed the initial distribution and the dirty tokens; (2) the rules of the trading rounds and how the Wilt-analog student gets set up so the payments to them feel voluntary and not staged; (3) the redistribution mechanic — how the vote works, what happens to people who voted against it, and how often it recurs; (4) a debrief that maps specific moments from the game onto D1/D2, the notion of a distributional pattern, and the historical vs. end-state distinction, without me lecturing for more than five minutes; and (5) an honest note on what will predictably go wrong the first time I run this, plus which parts of Nozick's argument the game just cannot reproduce no matter how I run it (the Lockean proviso, obviously, and the fact that nobody's life prospects are actually at stake over tokens). Keep each section to a tight paragraph, no intro or conclusion.
reasoning: |-
  We are designing an in-class game to illustrate Nozick's entitlement theory, focusing on the Wilt Chamberlain argument and the tension between voluntary transfers and patterned principles of justice.
   The game should have: initial distribution with some sketchy tokens, trading rounds with a "Wilt" student who has a desired skill, and repeated redistributions by majority vote.
   We'll break it down into 5 sections as requested.

   Section 1: Materials and Setup
   Materials: Prepare tokens (e.g., poker chips, candy, or printed paper slips) for the entire class. Also, prepare a few special tokens that are marked (e.g., with a dot or different color) to represent the "dirty" tokens. Setup: Before class, hide a few dirty tokens in the supply box of the room. At the start, assign each student a random number of tokens (say, between 1 and 5) to create an unequal initial distribution (D1). Then, reveal that you "found" some tokens in the supply box (the hidden dirty tokens) and arbitrarily assign them to a few students (e.g., by giving them to the first three students who answer a trivial question). This creates a mix of legitimate and sketchy acquisitions.

   Section 2: Trading Rounds and Wilt Setup
   Rules: Each trading round lasts 5 minutes. Students can trade tokens for services or goods. Designate one student as "Wilt" (e.g., by random draw) who has a special skill: they can draw a quick caricature of any student (or provide some other fun, non-monetary service that is desirable and quick). Other students can pay tokens to Wilt for this service. Alternatively, if drawing is not feasible, Wilt could offer to write a short, funny haiku about the payer. The key is that the service is voluntary and students must genuinely want to pay for it. Also, allow other trades (e.g., tokens for answers to a puzzle, or for a piece of candy you provide to some students in advance). The trades must be voluntary and mutually agreed upon.

   Section 3: Redistribution Mechanic
   After each trading round (do 2-3 rounds total, with redistribution after each), hold a majority vote on redistribution. Announce that the current distribution (D2) will be redistributed to a pattern (e.g., strict equality). All tokens are collected and redistributed equally. However, to simulate the objection that redistribution punishes those who traded, allow students who voted against redistribution to keep one extra token (a minor concession to the anti-redistribution side). Redistribution occurs after every trading round, so they experience the cycle repeatedly.

   Section 4: Debrief
   After the game, debrief for 5 minutes. Map: (a) Initial distribution (D1) included tokens with sketchy provenance (justice in acquisition). (b) Trading rounds led to D2 (voluntary transfers). (c) Each vote imposed a pattern (equality) but erased the transactions. Highlight the tension: even if D1 was flawed, the students' voluntary trades were disrupted. Ask: "How did it feel when your hard-earned tokens were taken away? What about when you paid Wilt and then the tokens you gave were redistributed?" Connect to historical principles (respecting the process) vs. end-state (the pattern). Note that the repeated redistribution made it hard to keep any gains.

   Section 5: Honest Note
   Predictable problems: Students might hoard tokens, avoid trading to avoid redistribution, or the Wilt student may feel pressured. The sketchy tokens might not be noticed or challenged. The voting could become chaotic or take too long. Also, the stakes are low, so emotions may not run high. Parts not reproduced: The Lockean proviso (no one made worse off) isn't enforced. The tokens don't represent real resources, so the impact on life prospects is absent. Also, in real life, redistribution isn't necessarily repeated instantly, and the game simplifies the complex social systems.
answer: |-
  ### (1) Materials and Setup
  **Materials:** 100+ identical tokens (e.g., poker chips); a sealed envelope; a "Wilt Skill Card" (e.g., "Can solve any 1 logic puzzle for tokens"); homework-skip vouchers (1 per 5 tokens held at game end). **Setup:** Randomly distribute tokens unevenly (e.g., 10 students get 1 token, 10 get 3, 2 get 10). Secretly mark 5 tokens with ink ("dirty tokens") and place them in the envelope. Announce: "Some tokens were taken from another class’s supplies—they’re in this envelope." Open it and arbitrarily give the dirty tokens to 3 students. Label this initial distribution **D1**.

  ### (2) Trading Rounds and Wilt Role  
  **Rules:** Three 5-minute trading rounds. All trades are voluntary (tokens for services/goods). Before Round 1, hold a blind auction: Students bid tokens for the **Wilt Skill Card** (highest bidder wins it anonymously). The Wilt-holder (e.g., "Ava") can now sell her skill during trading rounds (e.g., solving puzzles you provide). Others can also trade tokens for non-skill items (e.g., "2 tokens for help with a quiz question"). Emphasize: "Pay Wilt only if you value her service." Record major transactions publicly (e.g., "Ben paid Ava 3 tokens for puzzle help").

  ### (3) Redistribution Mechanic  
  After each trading round, hold a 2-minute **redistribution vote**: Majority vote imposes strict equality (total tokens ÷ 22, rounded down). Tokens are confiscated and redistributed equally. Students who **voted against** redistribution each keep 1 extra token as a concession. Repeat after every trading round. No one is exempt—Wilt loses her earnings too. Announce: "Current distribution is erased. Back to equal shares."

  ### (4) Debrief (5-Minute Script)  
  "Recall D1: Some tokens were ‘stolen’—did that taint all later distributions? When you paid Wilt voluntarily, that was **D2** (post-transfer). Redistribution ignored your choices to enforce a **pattern** (equality). How did it feel when your transactions were undone? That’s Nozick’s tension: **Historical justice** (respecting trades) vs. **end-state justice** (matching a pattern). Even if D1 was unjust, does erasing voluntary acts fix it?"

  ### (5) Honest Note  
  **Predictable issues:** Students may refuse to trade (fearing redistribution), causing deadlocks. Wilt might undercharge to avoid envy. Sketchy tokens could be ignored unless you highlight them mid-game. Voting may rush or become partisan. **Unreproducible elements:** The **Lockean proviso** (no harm to others) isn’t enforced—trades don’t risk depleting shared resources. **Real stakes**: Tokens lack life-impact, so "voluntary" feels hollow. **Scale**: Redistribution is immediate/mechanical, unlike state processes. **Structural justice**: The game can’t model systemic barriers (e.g., discrimination affecting starting positions).
