answer: |-
  ## Essay Question

  **The Factory Floor Case:** A factory produces two playing cards, both Queen of Hearts, from the same sheet of cardboard on the same day. These cards are numerically distinct physical objects but match exactly in shade of red, shape, and facial pattern. The factory's quality-control manual lists specifications such as "red," "symmetrical heart-and-crown pattern," etc. When an inspector judges that both cards meet the specification for "shade of red," there is an apparent "one thing (the specification/property) applying to many things (the cards)."

  **Analyze the problem of universals using this case. Your essay must critically engage with the following specific issues:**

  1.  **Resemblance Nominalism's Challenge:** Can resemblance nominalism adequately explain the sameness of shade between the two cards without implicitly relying on a shared universal? Does appealing to "resemblance" itself risk reintroducing a universal-like entity? Explain the core worry here.
  2.  **The Resemblance Regress:** Suppose resemblance is treated as a universal relation. What kind of regress arises? Crucially, explain *why* some philosophers consider this regress vicious, while others argue it is benign or even necessary. What is *at stake* in this debate?
  3.  **The Manual's Role:** Does the existence and use of the quality-control manual lend support to predicate nominalism or conceptualism? Does the manual *encode* a mind-independent sameness in shade, or does it *create* the relevant sameness? Defend your interpretation of the manual's metaphysical significance.
  4.  **The "Wholly Present" Puzzle:** If a realist claims the identical shade *is* a single universal wholly present in both cards, what specific challenge does the physical nature of these distinct cards pose to understanding this "wholly present" doctrine? How might a realist attempt to make this notion intelligible in this context?

  **Avoid merely naming or classifying positions (realism, nominalism, trope theory). Focus on the philosophical arguments and challenges illuminated by this specific case. Crucially, distinguish points of genuine philosophical contention from more settled background assumptions.**

  ---

  ## Model Answer (Approx. 700 words)

  The factory case vividly illustrates the core "one over many" problem: two distinct cards (the "many") share an identical shade of red (the putative "one"). This sameness is crucial for the inspector’s judgment based on the manual. Analyzing this case forces us beyond textbook taxonomies into the deeper dialectic surrounding universals.

  **(1) Resemblance Nominalism & Sameness:** Resemblance nominalism claims the two cards are similar *because* they resemble each other in shade; there is no shared universal "redness," just a network of resemblances. The immediate challenge is whether "resemblance" can explain the *sameness* without presupposing what it explains. The cards resemble each other *in shade*. But what grounds *this* resemblance? If it's because they both instantiate some *further* property (like reflecting light at 650nm), haven't we reintroduced a universal-like entity? The nominalist might insist resemblance is primitive: the cards simply *are* similar, full stop. However, the worry is that appealing to resemblance *in a specific respect* (shade) inevitably smuggles in the very shared feature (the respect) it was meant to avoid. This doesn't *prove* resemblance nominalism fails—it might truly be primitive—but the case highlights the burden: the nominalist must convincingly argue that resemblance itself isn't just a disguised universal or that invoking "respects" doesn't require universals. **(Settled:** Resemblance nominalists face the charge of circularity/regress. **Contested:** Whether this charge is fatal; whether resemblance *must* be analyzed in terms of shared properties; whether primitive resemblance is explanatorily adequate.)**

  **(2) The Resemblance Regress:** Suppose we treat resemblance itself as a universal relation, R. Then for Card A and Card B to resemble each other in shade, they must instantiate R. But then, how do we explain that A instantiates R and B instantiates R? If their instantiating R is *also* a matter of resemblance (i.e., the state "A-instantiates-R" resembles the state "B-instantiates-R"), we need a *second-order* resemblance relation R2, and so on *ad infinitum*. This is Bradley's regress. **Crucially, whether this regress is "vicious" is precisely the point of contention.** Critics (like Bradley) argue it is vicious because it shows the initial relation (R) cannot perform its unifying function without an infinite chain of further relations, which is metaphysically impossible or explanatorily bankrupt. The relation itself requires further relations to "connect" it to its relata, leading to an infinite explanatory demand never satisfied. Defenders of universals (like Armstrong) argue the regress is benign: the instantiation of R by A and B is a *fundamental, non-relational* fact. The regress only arises if we mistakenly demand a further relation to "glue" the universal to the particular; this "non-relational tie" of instantiation is primitive. The stakes are high: if vicious, it undermines universals *and* arguably any relational analysis; if benign, universals survive this challenge. **(Settled:** Treating resemblance as a universal leads to a regress. **Contested:** Whether the regress is vicious; whether instantiation requires a non-relational primitive.)**

  **(3) The Manual's Significance:** The manual seems to support predicate nominalism or conceptualism: the sameness consists *only* in both cards satisfying the predicate "shade S" in the manual/language, or falling under the same concept "shade S." The inspector's judgment using the manual is central. However, the realist counters: *Why* can the single predicate "shade S" correctly apply to both distinct cards *if not* because the cards objectively share a mind-independent property? The manual, they argue, *successfully tracks* this pre-existing sameness; it doesn't create it. The conceptualist might reply that the manual (and the concepts it encodes) *structures* our experience, making the sameness salient or even constitutive *for us*, but this doesn’t necessitate mind-independent universals. The cards' physical similarity might be brute, and the manual merely labels it. The key question illuminated by the case is: does the manual's role in *identifying* the sameness reveal it as mind-dependent, or does it presuppose a sameness the manual merely describes? The realist interpretation gains plausibility from the intuition that the cards would share the shade even if the manual (or humans) didn't exist. **(Settled:** The manual facilitates human recognition/judgment of sameness. **Contested:** Whether this implies the sameness is mind-dependent; whether the manual's applicability requires mind-independent universals.)**

  **(4) "Wholly Present" and Physical Multiplicity:** Realism asserts the numerically identical shade universal is "wholly present" in each card. The physicality of the cards makes this vividly puzzling. How can one *thing* (the shade) be entirely located in two separate pieces of cardboard simultaneously? If the shade is a constituent *in* card A, how can that *same* constituent also be *in* card B without being divided? The realist typically distinguishes the universal from its instances: the universal itself is not a spatial part of the card; it is *instantiated* by the card's particular red surface. The universal isn't located *in space* in the way the cardboard is; rather, it is exemplified *at* multiple locations. The challenge is to make this notion of non-spatial "presence" or "being exemplified" coherent. Critics (like trope theorists) argue this is deeply mysterious – how can one entity be in two places without being divided? Realists counter that spatial location is a property of particulars, not universals themselves. The cards *have* the property, but the property isn't *inside* them like a physical part; it's *had by* them. The factory case sharpens the intuition that if the shade is truly *one*, its presence in two distinct physical objects seems paradoxical. The realist must offer a plausible account of instantiation that resolves this apparent paradox. **(Settled:** Realism requires a universal to be numerically identical in its instances. **Contested:** Whether "wholly present" is coherent; how to understand instantiation non-mysteriously; whether tropes offer a better solution.)**

  The factory floor doesn't resolve the problem of universals, but it illuminates the live tensions: the pressure resemblance nominalism faces, the pivotal debate over regress viciousness, the complex interplay between language/concepts and objectivity, and the persistent challenge of understanding universals' mode of being in a world of distinct particulars.

  ---

  ## Marking Scheme (Total: 20 Marks)

  An **A Answer (17-20 marks)** must demonstrate **all** of the following:

  1.  **Addresses All Cruxes (4 marks):** Explicitly and accurately addresses each of the four specified issues (Resemblance Challenge, Regress, Manual, Wholly Present). Does not merge them or omit any. (1 mark per crux addressed adequately)
  2.  **Critical Analysis over Recitation (4 marks):** Moves beyond naming positions to analyze the *arguments* and *problems* inherent in each crux, using the case for illustration. Avoids simple classification (e.g., "This is resemblance nominalism").
      *   *Specifically:* (a) For Crux 1, clearly articulates the circularity/regress worry for resemblance nominalism regarding "respects" (1 mark). (b) For Crux 2, clearly explains *both* sides of the regress viciousness debate, identifying what is at stake (1 mark). (c) For Crux 3, evaluates *both* interpretations of the manual (encoding vs. creating) and their implications (1 mark). (d) For Crux 4, articulates the specific spatial challenge posed by the distinct cards to "wholly present" and sketches a realist response (1 mark).
  3.  **Distinguishes Settled vs. Contested (4 marks):** Explicitly marks, for each crux where relevant, what is generally agreed upon versus what is philosophically debated. Correctly identifies the core points of contention (e.g., *that* a regress arises is settled, *whether* it's vicious is contested; *that* the manual is used is settled, *whether* this implies mind-dependence is contested). (1 mark per crux where the distinction is accurately made and relevant to the argument).
  4.  **Clarity & Structure (4 marks):** Well-organized, logically structured essay with clear prose. The argument flows smoothly between points. The specific case is consistently used to illuminate the philosophical points. Mechanics are sound. (Holistic mark based on overall execution).
  5.  **Engagement with Case (4 marks):** Effectively uses the specific details of the playing card case (distinct physical objects, exact match, manual specifications, inspector's judgment) to ground and illustrate the philosophical arguments throughout the essay, not just in the introduction. (Holistic mark based on integration).

  A **B Answer (13-16 marks)** typically:

  *   Addresses all four cruxes but with less depth or precision.
  *   May describe positions or name debates without sufficient critical analysis (e.g., states "there's a regress" for Crux 2 but doesn't explain *why* it's considered vicious by some or what the stakes are; states that resemblance nominalism has problems for Crux 1 but doesn't clearly articulate the worry about "respects" or circularity).
  *   May gesture at the settled/contested distinction but not consistently or accurately apply it across the cruxes (e.g., might treat the viciousness of the regress as settled fact).
  *   Uses the case, but perhaps less consistently or illustratively than an A answer.
  *   Is generally clear and structured but might have minor lapses in logic or flow.

  **Lower Marks (Below 13):** Omit or severely mishandle one or more cruxes; primarily recite textbook positions without critical analysis using the case; fail to engage with the specific requirements of the question; show significant confusion about core concepts; lack structure or clarity; ignore the settled/contested requirement entirely.

  **Key Differentiators for A vs. B:**
  *   **Crux 2:** An A answer *explains the debate over regress viciousness and the stakes*. A B answer may only *describe the regress*.
  *   **Crux 1:** An A answer *clearly articulates the worry about "respects" reintroducing universals*. A B answer may only state resemblance nominalism has problems.
  *   **Settled/Contested:** An A answer *explicitly marks the distinction accurately for each relevant crux*. A B answer may be vague or incorrect about what is contested.
  *   **Case Usage:** An A answer *integrates case details deeply into the argument for each point*. A B answer may use the case mainly as an introductory example.
