  ### **Toxin Puzzle Activity: Intention & Incentives**  
  **Total Time:** 90 minutes  
  **Students:** 18  
  **Core Goal:** Students experience the tension between forming intentions and relying on incentives *before* theoretical framing.  

  ---

  ### **Materials**  
  1. **Unpleasant Task:**  
     - *Option A (Default):* 1 oz of highly bitter tonic (non-alcoholic, e.g., quinine soda).  
     - *Option B (Alternative):* 60-second hand immersion in ice water (5°C/41°F, in a basin).  
     - *Safety:* Non-toxic, opt-out allowed without penalty. Screen for health issues (e.g., Reynaud’s syndrome).  
  2. **Rewards:**  
     - $5 cash (or 5 bonus points on next quiz) per round.  
     - Envelopes for bond collection in Round 2.  
  3. **Judgment Tools:**  
     - Written intention statements (index cards).  
     - TA’s rubric for verbal interviews (simulates fallible "billionaire").  
  4. **Consent Forms:** Explicit opt-out, task safety details.  

  ---

  ### **Timeline**  
  #### **0:00–0:10 — Setup (10 mins)**  
  - **TA Script:**  
    > "Today we’re exploring how we make commitments. There are two rounds with small rewards. Participation is voluntary—you can opt out anytime. The task is safe but unpleasant: drink bitter tonic or place your hand in ice water for 60 seconds. No lasting harm, but discomfort is real."  
  - Distribute consent forms, explain alternatives.  
  - **Emphasize:** "Rewards depend on my judgment of your *genuine intention* at a specific moment."  

  #### **0:10–0:35 — ROUND 1: Classic Structure (25 mins)**  
  - **Rules:**  
    - **T1 (0:25):** $5 rewarded if TA judges you *genuinely intend* to do the task at **T2 (0:40)**.  
    - **T2 (0:40):** Do the task or not. *No penalty for skipping*; you keep the $5 regardless.  
  - **Intention Judgment Mechanism:**  
    1. **Written Statement (0:10–0:15):**  
       - Students write anonymously on index cards: "At this moment (T1), I genuinely intend to do the task at T2."  
    2. **Verbal Interview (0:15–0:25):**  
       - TA conducts 60-second interviews per student:  
         > "Do you, right now, genuinely intend to do the task at T2? Why?"  
       - **Judgment Rubric:** Note sincerity cues (eye contact, conviction), consistency with written statement.  
       - **Candid Note:**  
         > "I’m judging based on what I observe, not mind-reading. This is imperfect—unlike the ‘infallible billionaire’ in a puzzle we’ll discuss later."  
  - **T1 (0:25):** Distribute $5 to students judged as having genuine intention.  
  - **Waiting Period (0:25–0:40):** Students sit silently. No distractions.  

  #### **0:35–0:40 — ROUND 1 Task Execution (5 mins)**  
  - **T2 (0:40):**  
    - Students who committed may do the task (tonic/ice water) or opt out.  
    - TA records who follows through.  

  #### **0:40–0:45 — Transition to ROUND 2 (5 mins)**  
  - **TA Script:**  
    > "Round 2 has the same reward but adds an option: you can *post a bond*. Pay $3 now. If you do the task at T2’, you get $5 + $3 back. If you skip, you lose the $3."  

  #### **0:45–1:00 — ROUND 2: Precommitment (15 mins)**  
  - **Rules:**  
    - **T1’ (0:55):** $5 rewarded if judged to *genuinely intend* to do the task at **T2’ (1:05)**.  
    - **Bond Option:** Choose to post $3 (or equivalent points) at T1’. Forfeited if task skipped.  
  - **Intention Judgment (0:45–0:55):**  
    - Same as Round 1 (written statement + verbal interview).  
    - Students opting for bond hand $3 to TA in an envelope during the interview.  
  - **T1’ (0:55):** Distribute $5 to those judged genuine.  

  #### **1:00–1:05 — ROUND 2 Task Execution (5 mins)**  
  - **T2’ (1:05):** Students do task or opt out. TA records follow-through and bond forfeiture.  

  ---

  ### **Debrief (1:05–1:35; 30 mins)**  
  **Goal:** Students articulate the puzzle’s core tension *without jargon*.  

  1. **Map the Activity to the Puzzle (15 mins):**  
     - *TA Questions:*  
       - "In Round 1, when you decided at T1, did you *know* you could skip at T2? How did that affect your intention?"  
       - "How many of you struggled to ‘genuinely intend’ in Round 1? What did that feel like?"  
       - "In Round 2, did the bond make forming the intention easier? Why?"  
     - *Reveal the Structure:*  
       > "You faced a puzzle: To get the reward, you needed to *intend now* to do something you knew you’d have no reason to do later. The bond in Round 2 altered your future incentives—but did it change your *intention* or just your *motivation*?"  

  2. **Key Distinction: Intentions vs. Incentives (10 mins):**  
     - *Student Reflection:*  
       > "Raise your hand if, in Round 2, you thought: ‘I’ll do it because I paid $3.’ Now, raise your hand if you thought: ‘I *intend* to do it’ independently of the bond."  
     - *TA Synthesis:*  
       > "The bond *engineers incentives* to make you act, but the puzzle asks whether you can *form the intention* without such tricks. This is why my gym contract fines me—it creates an incentive, but I still wonder: ‘Do I *intend* to go, or just fear losing money?’"  

  3. **Limitations & Original Puzzle (5 mins):**  
     - *Candid Notes:*  
       - "Our activity couldn’t replicate three things:  
         1. **The illness:** A day of misery is harder to dismiss than 60 seconds of discomfort.  
         2. **The reward size:** $5 isn’t life-changing; a ‘large sum’ would intensify the tension.  
         3. **Infallibility:** I judged you imperfectly. The puzzle assumes the billionaire *knows* your intention with certainty."  
     - *Bridge to Theory:*  
       > "Next lecture, we’ll name this as Kavka’s toxin puzzle and discuss how philosophers wrestle with intention-formation."  

  ---

  ### **Predictable Challenges & Solutions**  
  - **Judgment Fallibility:** Students may lie or perform sincerity in interviews.  
    - *Mitigation:* Acknowledge this openly—it highlights the gap between external cues and true intention.  
  - **Low Stakes:** Some may dismiss the task as "easy."  
    - *Mitigation:* Emphasize the *structural* parallel to high-stakes cases (e.g., gym contracts).  
  - **Bond Logistics:** Students without cash can use points; bonds are collected in sealed envelopes to reduce embarrassment.  
  - **Ethical Safeguards:** No peer pressure; alternatives for task; consent forms reviewed by ethics board.  

  ---

  ### **Why This Works for You**  
  The activity forces students to confront the murkiness of intention-formation through embodied stakes (bitterness, cold) and your candid reflection on your gym contract. By separating the experience from theory until the debrief, they grasp the *feeling* of "intending to intend" before labeling it—making Kavka’s puzzle a lived dilemma, not just a thought experiment.
