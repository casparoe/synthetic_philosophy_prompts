prompt: |-
  I'm a software engineer (backend, mostly distributed systems, no formal philosophy or math training beyond a couple of undergrad courses) who has gotten increasingly interested in algorithmic probability over the past couple of years, mostly through blog posts and Wikipedia rabbit holes. I'm applying for a three-month summer research fellowship at an organization that works on forecasting and AI safety, and they want a two-page proposal for an independent project. I have a half-formed idea and I need it turned into something precise enough that a reviewer can tell what I would actually do all summer.

  The idea concerns the standard story that Solomonoff induction justifies Occam's razor: shorter programs get more prior weight, and this preference for simplicity isn't an arbitrary add-on but a theorem. When people raise the objection that Kolmogorov complexity depends on the choice of universal machine, the usual reply is the invariance theorem — machine choice only changes complexities by an additive constant. My worry, coming from engineering: an additive constant is a fixed cost that never amortizes. If the constant is, say, a few thousand bits, then for any dataset or prediction horizon shorter than that, the machine choice dominates everything, and no actual agent — human, scientific community, or ML system — ever operates at data scales where the constant becomes negligible. So it looks like the razor's justification holds only in an asymptotic limit nothing finite ever reaches, and the practical warrant for preferring simple hypotheses must be coming from somewhere else: maybe the empirical track record of simplicity priors in particular domains, maybe something about which machines a physically realizable agent can even implement. My hazy thought is that the honest conclusion is that Solomonoff induction justifies a weaker claim than "simplicity is the right prior," something more like "no computable prior beats it in the long run, and the long run is longer than you can afford" — and that this distinction matters for people building actual approximate-Bayesian systems.

  Please turn this into the two-page proposal. It should state the question so it has a determinate answer rather than dissolving into "it depends what you mean by simplicity"; explain why the standard textbook answers (the invariance theorem, the convergence-to-great-orthodoxy-style results, and the MDL tradition's suggestion that you just pick a code and accept the relativity) leave it open; lay out a month-by-month method — e.g., first pinning down exactly what "justifying the razor at finite horizon" would mean formally, then evaluating candidate escapes like restricting to a natural family of machines, averaging over machines, or arguing that physical computability constraints single out a machine class; and say explicitly what would count as the project succeeding and what would count as it failing (including the possibility that the question, once made precise, turns out to be trivial). Include an honest assessment of whether this is doable in three months by someone with my background, and if not, what a realistic first slice would be. Don't include a bibliography — I'll add references myself; describe positions and arguments by content, not by citation. Start directly with the proposal document itself, no preamble and no commentary before it.
