prompt: |-
  I teach an undergrad seminar on comparative ethics, about 14-16 students, and we have one 80-minute session left in our unit on Buddhist ethics. The students have read enough to know the basics: karma is tied to intention (the early texts basically say it's volition that I'd call karma, rather than the outward act), intentions have wholesome or unwholesome roots, and the fruits of action can ripen on a delay. But they've all latched onto this move where they say "oh, so it's just consequentialism with a longer time horizon and rebirth bolted on as the payoff structure," and I want them to feel where that reading actually strains instead of just being told. I'd rather the problem show up in what they do than in anything I say at the whiteboard.

  So I want you to design a game/simulation for that session. The shape I'm imagining: some kind of multi-round scenario where students make real choices with real stakes -- a village during a drought deciding about water allocation, or something better if you can think of it -- with hidden information so that good intentions sometimes go badly wrong and self-interested moves sometimes turn out great. The key mechanic: two separate ledgers running the whole time. A welfare ledger that gets scored purely from outcomes (the facilitator can just tally this from the outcome tree), and a karma ledger scored from intentions, which each player writes down on a card *before* their move is revealed and which a rotating "registrar" scores against a simple rubric keyed to the wholesome/unwholesome roots. Design at least one round where the two ledgers demand opposite moves, and some way for karma to ripen late -- carry across rounds or pay off at a delay -- so they feel that karmic consequences aren't just immediate welfare consequences. Cheap materials only, no software, no money changing hands.

  Then the debrief: how to map specific moments onto the doctrine and onto the consequentialism question, i.e. whether the game is evidence that Buddhist ethics is or isn't consequentialism, or is a third thing entirely. Tell me honestly what will predictably go wrong the first time I run it -- I'm guessing players will learn to *perform* compassion on the motive cards once they figure out the rubric, which, fine, maybe that's even instructive, but I want to know how to handle it -- and be frank about what the activity flatly cannot reproduce and I'll have to supply myself at the end. (My own worry is that rebirth across lifetimes and the no-self stuff can't be gamified with points without quietly smuggling back a self who owns them, but maybe you disagree.) Please write the whole thing in American English.
reasoning: |-
  Okay, let me tackle this professor's request for a Buddhist ethics simulation game. They teach undergrad comparative ethics and need an 80-minute activity where students experience the tension between karmic intentionality and consequentialism firsthand. The core problem is students reducing Buddhist ethics to "consequentialism with rebirth" - I need to design something that makes this oversimplification collapse experientially.

  Hmm... the professor wants two key mechanics: separate welfare and karma ledgers, with intentions recorded before outcomes. Also needs delayed karmic effects and at least one round where good intentions backfire while selfish ones succeed. Constraints are strict: no tech, no money, physical materials only. And importantly - they want me to anticipate pitfalls like students gaming the karma system by faking intentions.

  First, the scenario... drought-stricken village works but feels overdone. What about... ah! A Himalayan trade caravan facing bandits and weather? Students play families transporting goods through dangerous passes. Multiple stressors: resource scarcity (food/medicine), random events (storms/bandits), and social dilemmas (help others or hoard). This creates richer ethical friction than just water allocation.

  For mechanics: each round represents a mountain pass crossing. Players secretly write intentions on cards using three root categories: greed/aversion/delusion or generosity/compassion/wisdom. Then actions resolve - say drawing event cards that make good intentions backfire (e.g. giving medicine leads to your own family falling ill). A rotating "karma registrar" scores intentions against a simple rubric while the professor tracks collective welfare points.

  Delayed karma is tricky... maybe have "karma tokens" earned now that modify future dice rolls? Like extra survival chance in later rounds. Or abstract "future life advantage" points that unlock endgame bonuses. Not perfect but workable.

  Biggest design headache: preventing karma-point gaming. The rubric must judge *discernible* intentions, not just words. Maybe require stating both action AND reason? And the registrar rotates so peer pressure varies. Actually, students faking compassion could become a teachable moment about performative ethics - so maybe lean into that.

  What can't be simulated? Rebirth's existential discontinuity for sure. Also anattā (no-self) - points inherently create point-owners. I'll flag this for the debrief. Also the cessation aspect of karma... but that's too advanced probably.

  For debrief questions: focus on moments when welfare and karma diverged. Ask "When did following karma feel irrational?" and "Did anyone resent 'late' karmic rewards?" Key is letting them articulate why reducing it to consequentialism chafes.

  Predictable failures: some rounds will bog down, registrars might be inconsistent, and yes - cynical students will write "generosity" while hoarding resources. That's actually gold for discussion. Have the professor track examples of intention-action gaps anonymously.

  Materials list: index cards, dice, tokens, a big visible ledger. Total prep under 20 minutes. I'll structure it with three rounds: one where karma/welfare align, one where they clash, and one with delayed karmic payoff. Debrief script included.

  ...wait, should the welfare points be individual or collective? Collective better models interdependence but weakens self-interest tension. Make it both - personal survival AND village health tracked separately. Yes, that creates layered dilemmas.

  Final structure: introduction (5min), three gameplay rounds (45min total), debrief (30min). I'll write full facilitator script with timing cues. The professor seems experienced - they'll adapt if rounds run long. 

  Most valuable insight: the game won't prove what karma "is," but will make the consequentialist reading feel inadequate. That discomfort is the learning objective.
answer: |-
  Here's a simulation designed for your 80-minute session, aiming to make the tension between karmic intentionality and consequential outcomes *felt*, using simple materials.

  **Game Title:** *The Valley Pass: A Himalayan Caravan Dilemma*

  **Core Conflict:** Students are families in a trade caravan traversing treacherous mountain passes during a harsh season. They must manage scarce resources (food, medicine, warm clothing) while facing unpredictable events (storms, bandits, treacherous paths). The goal is collective survival to reach the safe valley, but individual survival is also at stake.

  **Learning Objectives:**
  1.  Experience the distinction between intention (karma) and outcome (welfare).
  2.  Confront situations where "good" intentions lead to bad outcomes and vice-versa.
  3.  Feel the "delay" and potential disconnect in karmic fruition.
  4.  Grapple with the difference between maximizing immediate welfare and cultivating wholesome roots.

  **Materials:**
  *   Index cards (2 per player per round + extras)
  *   Pens/Pencils
  *   Large poster paper or whiteboard (for Welfare Ledger)
  *   Small notebook or pad (for Karma Ledger - held by rotating Registrar)
  *   Dice (1d6 or 1d10)
  *   Tokens (e.g., beads, paperclips, buttons - 15-20 per resource)
      *   **Food Tokens (Brown/Plain)**
      *   **Medicine Tokens (Red)**
      *   **Warmth Tokens (Blue)** (Represents clothing/fuel)
  *   Bowl or bag (for drawing Event Cards)
  *   Pre-written **Event Cards** (See examples below)
  *   Timer

  **Setup (5 mins):**
  1.  **Group:** Divide students into 4 "Family Units" (3-4 students each). Each Unit shares resources and makes collective decisions.
  2.  **Resources:** Give each Family Unit:
      *   4 Food Tokens
      *   2 Medicine Tokens
      *   3 Warmth Tokens
  3.  **Ledgers:** Draw the Welfare Ledger on the board: Columns for each Family Unit and "Collective Welfare." Draw rows for "Round 1," "Round 2," "Round 3," "Final." Initialize Karma Ledger notebook similarly.
  4.  **Registrar:** Choose one student (rotates each round) as the Karma Registrar. Give them the Karma Ledger notebook and the Karma Rubric (see below).
  5.  **Event Deck:** Shuffle the pre-written Event Cards and place them face down.

  **Karma Rubric (For Registrar - Simplified Roots):**
  *   **Unwholesome (Negative Karma Point):** Motivated primarily by...
      *   *Greed/Lobha:* Desire for more resources/advantage for *only* your own family.
      *   *Aversion/Dosa:* Fear, anger, hostility towards another family; desire to harm or see them fail.
      *   *Delusion/Moha:* Ignoring interdependence, acting without considering consequences for others or based on false assumptions (e.g., "They deserve to suffer").
  *   **Wholesome (Positive Karma Point):** Motivated primarily by...
      *   *Generosity/Dāna:* Willingness to share resources to alleviate suffering, expecting nothing specific in return.
      *   *Compassion/Karuṇā:* Acting to reduce the suffering of others.
      *   *Wisdom/Paññā:* Understanding interdependence; acting for long-term good of the whole caravan, even if it involves short-term sacrifice.
  *   **Neutral (0 Points):** Actions focused purely on basic, immediate survival needs of *only* your own family without explicit greed, aversion, or compassion towards others. (This is tricky; encourage registrar to look for *discernible* motivation beyond pure self-preservation).

  **Gameplay (3 Rounds, ~15 mins each):**

  1.  **The Dilemma (2 mins):** Announce the Round number. Describe the immediate challenge (e.g., "A sudden blizzard hits!", "The path ahead is washed out!", "Bandits are spotted watching from the ridge!"). Highlight scarcity. Pose a specific resource allocation/sharing dilemma (e.g., "One family's shelter collapsed. They need 2 Warmth tokens to survive the night." or "A landslide blocks the path; clearing it requires 3 Food tokens worth of energy from the group.").
  2.  **Intention & Action Choice (3 mins):**
      *   Each Family Unit secretly discusses their action (e.g., give 0,1,2 tokens; refuse to help; offer help under condition X).
      *   **CRITICAL STEP:** Each Unit writes their **Action** AND their **Primary Motivation/Intention** (using the root terms: e.g., "Give 1 Medicine - Compassion", "Keep all Food - Greed", "Give 2 Warmth - Wisdom (we're stronger together)") on an index card. *Stress honesty for the simulation to work.* Fold the card.
      *   Units give their folded card to the Karma Registrar.
  3.  **Karma Scoring (Registrar - 2 mins):** The Registrar opens each card, reads the stated Intention *only*, and assigns a Karma Point (+1 Wholesome, -1 Unwholesome, 0 Neutral) based *solely* on the stated motivation, using the rubric. They record this secretly in the Karma Ledger for that Unit. *They do NOT reveal the karma score yet.*
  4.  **Action Reveal & Outcome (5 mins):**
      *   Families reveal their actions simultaneously (e.g., announce "We give 1 Medicine").
      *   Facilitator adjusts resources accordingly.
      *   **Event Resolution:** Draw the top Event Card. Read it aloud. Resolve its effects based on the *actual actions taken* and the event description. This is where intentions and outcomes diverge!
      *   **Welfare Scoring (Facilitator):** Update the Welfare Ledger:
          *   Did the family lose/gain resources? (Affects future survival chances)
          *   Did anyone "die" (lose all tokens of one type? Facilitator discretion)? Mark a major welfare loss.
          *   Note Collective Welfare changes (e.g., path cleared? Bandits deterred?).
  5.  **Resource Check & Survival (3 mins):** After the event, each family must "pay" survival costs (e.g., lose 1 Food per round). Families lacking a required resource type roll a die. Low roll (e.g., 1-2 on d6) = "Injury/Sickness" (lose future action choice?) or "Death" (severe welfare penalty). Adjust tokens.

  **Round Designs (Examples):**

  *   **Round 1: Aligned Interests (e.g., Blizzard)** Dilemma: A family's shelter is destroyed. They need 2 Warmth tokens.
      *   *Event Card 1 (Likely):* "The shared fire built with offered warmth tokens keeps everyone alive through the night. Collective Welfare +." (Good intentions + Good outcome)
      *   *Event Card 2 (Less Likely):* "A hidden avalanche triggered by the commotion buries the donated tokens! All offered Warmth is lost, and the receiving family is still exposed." (Good intentions + Bad outcome)

  *   **Round 2: The Strain - Opposite Demands (e.g., Bandits)** Dilemma: Bandits demand 5 Food tokens total, or they attack. The caravan only has 8 Food tokens left collectively. Who contributes how much?
      *   *Event Card 3:* "The bandits, seeing the caravan divided and arguing over contributions, decide you are weak and attack anyway! Families who gave *less* food lose less in the scramble (better welfare outcome for selfish). Families who gave generously trying to meet the demand are targeted first (worse welfare)." (Compassion/Generosity leads to *worse* immediate welfare for givers; Greed/Self-Preservation leads to *better* immediate welfare for hoarders).
      *   *Karma Ledger:* Hoarders get Unwholesome points (Greed), Givers get Wholesome points (Generosity/Compassion). Welfare Ledger shows opposite results.

  *   **Round 3: Delayed Ripening & Collective Peril (e.g., Treacherous Pass)** Dilemma: The path is icy and deadly. Crossing safely requires total Warmth tokens >= 12 (collective action). Families must decide how many (if any) of their precious Warmth tokens to contribute to melting ice/supporting others.
      *   *Event Card 4:* "The combined effort based on contributions makes the pass *barely* traversable. Everyone survives, but..." **Delay Mechanic:** The Registrar now reveals the *Karma Points* from Round 2 secretly. Any family with *Net Positive Karma* from R2 gains a +2 modifier on a survival roll here (representing unseen karmic support - better footing, a helpful gust). Any family with *Net Negative Karma* gets a -2 modifier. Roll for each family (e.g., failure = lose 1 member/resources). (Karma from *previous* action ripens *now*, affecting outcome independent of *current* action's intention).
      *   *Welfare Outcome:* Based on collective contribution *and* the dice rolls modified by prior karma.

  **Final Scoring & "Rebirth" (5 mins):**
  *   **Welfare Victory:** The family with the highest remaining total resources (Food+Medicine+Warmth) wins "this life."
  *   **Karmic Standing:** The Registrar reveals the *total net Karma Points* for each family across all rounds.
  *   **"Rebirth" Advantage:** The family with the *highest net Karma Points* gets a starting resource bonus for a hypothetical "next journey" (e.g., +2 Food, +1 Medicine). Emphasize this is abstract and delayed. *Don't play the next journey.* This is purely symbolic of future karmic fruit.

  **Debrief (20 mins):** Guide discussion using specific moments from the game:

  1.  **Mapping Moments:** "Recall Round 2 with the bandits. Walk me through Family X's intention, their karma score, their welfare outcome. How does this map to the doctrine? How does it challenge a simple consequentialist reading?"
  2.  **The Ledger Tension:** "When did acting for good karma *feel* like it directly *hurt* your welfare? When did acting for immediate welfare *feel* like it generated bad karma? How did that *feel*?"
  3.  **The Delay:** "How did the karma modifier in Round 3 feel? Did it seem 'fair' based on *that* round's actions? What does this say about karma's 'time horizon'?"
  4.  **Consequentialism?** "Is this game evidence that Buddhist ethics is consequentialist? Why or why not? (Probe: What is the 'consequence' valued in karma vs. welfare? Is the 'end' the same?) Where does the analogy hold? Where does it break down?"
  5.  **Performed Intentions:** "Did anyone feel tempted to write a 'wholesome' intention even if they felt differently? Why? What does this say about karma? Is 'faking it' possible? Does it work?" (Acknowledge the performativity - it highlights the challenge of *genuine* intention cultivation, a core practice).
  6.  **What the Game CAN'T Capture (Be Frank):**
      *   **Rebirth & No-Self:** "We smuggled in a 'self' who earned and carried karma points to a 'next life' bonus. But Buddhist doctrine denies a permanent, fixed self (*anattā*). Karma propels the process of becoming, not a soul's journey. This game inherently reifies a 'karma owner' we can't truly simulate."
      *   **Cessation:** The ultimate goal isn't maximizing good karma points, but ending the karmic cycle (*nibbana*). The game reinforces cycle continuation.
      *   **Depth of Intention:** Our rubric was simplistic. Real karmic assessment involves subtleties of mental states beyond our game.
      *   **Scale:** Karma operates across lifetimes in unimaginably complex ways.

  **Predictable Problems & Mitigations:**

  1.  **Gaming the Karma Ledger (Performative Intentions):**
      *   *Likely:* Students will quickly learn to write "Generosity" or "Wisdom" regardless of feeling.
      *   *Handle It:* Acknowledge it in debrief! Ask: "Did writing 'Compassion' *feel* like compassion? Does the registrar scoring the *word* capture the *mental state*? What does this reveal about the challenge of karma?" Use it to discuss *cetanā* (volition) vs. superficial labeling and the importance of *bhāvanā* (cultivation).
  2.  **Registrar Inconsistency:** Different students will interpret the rubric differently.
      *   *Handle It:* Accept it as part of the simulation. Debrief: "Was the karma scoring 'fair'? How does this reflect the opacity of judging others' intentions? Does karma depend on a human registrar?" Highlight internal, natural law aspect in doctrine.
  3.  **Over-Competitive Welfare Focus:** Students might ignore karma entirely to "win" welfare.
      *   *Handle It:* The "Rebirth Bonus" is a small incentive, but the debrief must emphasize the *experiential* goal isn't winning, but feeling the tension. Frame welfare as "this life," karma as "the long game."
  4.  **Time Crunch:** Rounds might run long, especially discussion.
      *   *Mitigate:* Use a strict timer. Keep dilemmas focused. Have pre-written Event Cards ready. Prioritize gameplay flow over perfect discussion in-round; save analysis for debrief.
  5.  **Oversimplification:** Some students might find the mechanics reductive.
      *   *Handle It:* Acknowledge it upfront and in debrief. Emphasize it's a *provocation*, not a perfect model. Use its limitations to point towards the doctrine's depth.
  6.  **"Cheating" / Hidden Motives:** Students might privately agree on selfish motives but write wholesome ones.
      *   *Handle It:* Trust the exercise. If suspected, gently note in debrief: "Karma, in the end, relates to the *actual* volition in the mind, known fully only to oneself. Could anyone truly 'cheat' the system?"

  **Why this works:** It forces students to *live* the gap between intention and outcome, experience the frustration of good intentions failing and selfishness "working," feel the arbitrariness of delayed consequences linked to past choices, and confront the performativity of stated motives. The debrief then connects these visceral experiences directly to the doctrinal points and the core question about consequentialism. The limitations become part of the learning, highlighting what *can't* be easily simulated. Good luck!
