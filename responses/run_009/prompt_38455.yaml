  ### 3. Bets on Logically Equivalent Propositions

  **Philosophers' Version**: If an agent assigns different credences to two logically equivalent propositions, then a Dutch book can be made against them.

  **Quant Translation**:
  - Logically equivalent propositions are events that are sure to have the same outcome (they are the same event in different descriptions). In finance, this is like two securities that have identical payoff structures (e.g., two representations of the same contingent claim).
  - If the agent quotes different prices for two digital options that have the same payoff in every state, then this is an arbitrage opportunity. The bookie can buy the cheaper one and sell the more expensive one, creating a portfolio with negative cost (or zero cost) and non-negative payoffs in every state (in fact, zero in every state) and positive cash flow at initiation.

  **Example**: 
  - Suppose the agent assigns p(A) = 0.4 and p(B) = 0.5, but A and B are logically equivalent (so in every state, A occurs if and only if B occurs). 
  - The bookie can buy a digital on A from the agent at 0.4 and sell a digital on B to the agent at 0.5. 
  - Net cash flow at initiation: -0.4 + 0.5 = 0.1 (bookie receives 0.1).
  - At maturity, in every state, if A occurs (and hence B occurs), the bookie receives 1 from the digital on A and pays 1 on the digital on B: net 0. If neither occurs, both pay 0. 
  - So bookie pockets 0.1 for sure.

  This is clearly model risk: the agent has failed to recognize that A and B are the same event, so they are mispricing the duplication.

