  ### 1. Classic (Synchronic) Dutch Book for Probabilism

  **Philosophers' Version**: If an agent's credences over a set of propositions do not satisfy the axioms of probability (non-negativity, normalization, and additivity for disjoint events), then a Dutch book can be made against them. That is, there exists a set of bets, each of which the agent finds acceptable given their credences, but which together guarantee a loss for the agent and a gain for the bookie.

