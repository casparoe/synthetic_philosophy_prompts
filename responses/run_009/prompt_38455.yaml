  1. **Classic (synchronic) Dutch book argument for probabilism**: Shows that if an agent's degrees of belief (credences) do not satisfy the probability axioms, then there exists a set of bets (a portfolio) that the agent would accept which together result in a sure loss (an arbitrage).

  2. **Diachronic Dutch book argument for conditionalization**: Shows that if an agent does not update by conditionalization upon receiving new evidence, then there exists a series of bets (a dynamic portfolio) that the agent would accept at different times which together result in a sure loss regardless of the state of the world and the evidence received.

  3. **Arguments involving logical/mathematical equivalence**: Shows that if an agent does not assign the same credence to logically equivalent propositions, then a Dutch book can be made against them. This relates to model risk in that the agent might not recognize that two positions are identical due to an incomplete model.

