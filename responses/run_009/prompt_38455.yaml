  - **Pressure Point: Computability**:
    - The philosophers' version does contain an additional element: the normative force of the argument is challenged by the finite agent's computational limitations. But this challenge also exists in finance: model risk departments are aware that their models might not capture all equivalences. The argument shows that if the agent had a complete and correct model, they would avoid this arbitrage. But since they don't, they are vulnerable.

  #### Overall Residue and the Underlying Question

  - **Where the Philosophers' Argument Might Be Stronger**:
