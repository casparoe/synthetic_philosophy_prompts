    - Violation of probability axioms leads to an arbitrage opportunity for the bookie.

  - **Distortion**:
    - In finance, prices are typically for buying or selling, and there might be a bid-ask spread. The Dutch book argument assumes the agent will accept any bet at exactly their credence (i.e., they are a market maker with zero spread). This is an idealization. In real markets, even if there is a violation of the probability axioms in the mid-price, it might not be arbitrageable due to spreads and transaction costs.
    - The argument requires that the agent is willing to take either side of the bet at the same price. In practice, agents might only be willing to take one side (e.g., only buy or only sell) at their quoted price.

  - **Missing in Quant Vocabulary**: 
    - The argument assumes that the agent is forced to accept any and all bets at their announced credences. In finance, a trader might not be obligated to fill an order if it exceeds their risk limits or if they don't have the inventory.
    - The workhorse in finance is the risk-neutral measure, which exists if there is no arbitrage. But risk-neutral probabilities are not the same as the agent's subjective credences because they incorporate risk aversion and market conditions. The Dutch book argument does not account for risk aversion: it assumes the agent is risk-neutral for small enough bets. If the agent is risk-averse, they might not accept a bet at their true credence.

  - **Pressure Point: Obligation to Bet**:
    - The assumption that the agent will accept any bet at the odds implied by their credence is doing real work. It is not a harmless idealization if we are using the argument to normatively constrain degrees of belief. If the agent is not actually offering to bet, then the vulnerability might not be there. However, the argument is often interpreted as: if the agent were to bet in accordance with their credences, they would be vulnerable. This is a hypothetical vulnerability.

  #### b. Diachronic Dutch Book for Conditionalization

  - **Clean Mapping**:
    - The dynamic hedging strategy across time by the bookie is analogous to dynamic replication in finance. The bookie constructs a self-financing portfolio that locks in a profit.
    - The bets at different times are like entering into forward contracts and then spot contracts.

  - **Distortion**:
    - In finance, dynamic hedging might not be perfect in practice (due to discrete hedging, transaction costs, etc.) and is usually done to replicate a derivative along the actual path. The diachronic Dutch book, however, is supposed to guarantee a loss for the agent in every state of the world. But note that the strategy is state-dependent: it is only executed if the conditioning event (E) occurs.
    - The disanalogy: in finance, a dynamic replication strategy might not yield a risk-free profit in every state if the hedging is not done continuously or if there are jumps. But in the diachronic book, we are assuming the bookie can trade at the agent's prices at the exact moment of updating, which is a discrete event.
    - The standard philosophical complaint is that the diachronic argument might not show that conditionalization is the only rational way to update, because the bookie needs to know in advance how the agent will update. But in the quant world, this is like counterparty risk or model risk: if you have a model of how your counterparty will behave, you can exploit it.

