  Background:
  - Naive set theory: allows unrestricted comprehension, i.e., for any property P, we can form the set { x | P(x) }.
  - Russell's paradox: consider the set R = { x | x ∉ x }. Then R ∈ R if and only if R ∉ R, a contradiction.

  In type theory, we have types and terms. Types classify terms. In a typical statically typed functional language, types are not terms and cannot be members of a type (unless we have a universe hierarchy, but even then, each type lives at a specific level).

  Analogy:
  - Sets are like types.
  - Set membership (x ∈ A) is like having a term of a type (x : A).

  The Russell set R is defined by the property: R = { x | x ∉ x }.

  In type theory, if we try to form a type R such that:
    R = { x : Type | x ∉ x }   [but note: in type theory, we don't usually have membership for types in types]

  But wait, in type theory, we don't have a set of all sets (because types are not terms). However, if we try to model this in a language with a type of all types (like * : * in the inconsistent system of Martin-Löf's original type theory), then we can try to form:

    R : Type   (and since Type : Type, then R : Type and also R is a term of type Type, so we can ask about R : R?)

  But then we can define:
    R = { x : Type | not (x : x) }

  Then we ask: is R : R?
    If R : R, then by definition of R, we must have not (R : R) -> contradiction.
    If not (R : R), then by definition of R, we must have R : R -> contradiction.

  So we get a paradox.

  This is analogous to the "type in type" system which is inconsistent.

  Now, the two repairs:

  1. Russell's type theory (ramified theory of types, later simplified by Ramsey and others) uses a hierarchy of types. Types are stratified: type 0 for individuals, type 1 for sets of individuals, type 2 for sets of sets of individuals, etc. In this system, we cannot form a set that contains itself because a set of type n can only contain elements of type < n.

     In programming languages, this is analogous to having a hierarchy of universes (like in Agda or Coq) where we have Type0, Type1, Type2, ... and Type i : Type (i+1). Then we cannot have a type that contains itself because if we have T : Type i, then T cannot be in Type j for j <= i (only in Type j for j>i). So self-application for types is prohibited.

     This stratification is similar to the type error we get when we try to form an infinite type (like in Haskell, when we see "infinite type" error for recursive types without a proper recursive mechanism) or when we try to assign a type to itself.

  2. Zermelo-Fraenkel set theory (ZF) does not use a hierarchy of types. Instead, it restricts the comprehension axiom: we can only form subsets of existing sets (via the axiom of separation) and use other axioms to build sets step by step. Also, it does not allow a universal set. The universe of sets is cumulative (sets are built from the empty set and closed under power set, union, etc.), but there is no set of all sets.

     In programming languages, this is analogous to having a single universe (like in a language without universe levels) but with restrictions on how we form types. In particular, we don't have unrestricted type formers. We have:

       - Base types (like Int, Bool)
       - Ways to form new types from old: function types (A -> B), product types (A * B), etc.

     But note: in ZF, we have a cumulative hierarchy: sets are built in stages (V0, V1, ...) by taking power sets. This is similar to having a universe that is closed under certain operations.

     However, in programming languages, we don't typically have a "runtime guard" for type formation. Instead, we have a fixed set of type formers that are known to be safe.

     But the analogy to a "runtime guard" might be that in ZF, when we form a set by comprehension, we must specify a set from which we are separating. Then the Russell set for the whole universe is disallowed because we cannot form a set of all sets. However, for any given set A, we can form { x ∈ A | x ∉ x }. But then we can show that this set cannot be in A (otherwise we get a contradiction for that set). So it doesn't lead to a paradox because we don't have a universal set.

     In programming languages, we don't have a universal type (like `Type : Type`). Instead, every type lives in a fixed universe. But we don't have a runtime check for type formation; it's all at compile-time.

     The analogy to a "runtime guard" might be that in ZF, we have the axiom of regularity (which implies no set can be a member of itself) but that is not the main point. The main point is the restriction of comprehension to separation.

