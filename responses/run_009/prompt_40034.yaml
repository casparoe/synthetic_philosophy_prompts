prompt: |-
  I've spent fifteen years in management consulting, first as an analyst and now as an engagement manager, and there's a pattern in my industry I've never seen named. Everyone at my firm is expected to be visibly responsive at all hours: midnight emails answered within the hour, weekends given over to "quick turns," juniors competing to copy the widest distribution list on work nobody will read. This is expensive for every one of us, and — this is the part that puzzles me — it can't be demonstrating anything, because everybody does it. A client can't learn anything about my team from behavior that is uniform across the entire industry, and internally a partner can't infer that one associate is more devoted than another, since all of them perform the same display at the same intensity. Yet the display is compulsory: the handful of people who opt out are marked, and not favorably.

  I see the same shape elsewhere. My partner is a postdoc, and in her field nearly everyone referees papers for journals, unpaid and under time pressure; the work is expected of all, performed by most, and, as far as I can tell, read by almost no one as evidence about anyone's quality, since the people who do the most of it are not the people who get the jobs. And at a wedding this summer I watched two families spend sums neither could comfortably afford, each knowing the other was doing the same, and neither able to stop first. What unites these cases, I think, is that a costly display has become universal: the cost is still real and paid by all, but whatever it was once supposed to reveal, it now reveals to nobody — and yet no one can abandon it unilaterally.

  I dimly remember that evolutionary biologists have a story about absurdly expensive displays — peacock tails, stag antlers — in which the very wastefulness of the display is what makes it believable: only a genuinely healthy animal can afford to squander resources that way. But in that story the display still varies, and the choosing party still discriminates on the basis of the variation. In my cases the display no longer varies, so there is nothing left to discriminate on; the expense has become a tax everyone pays and no one benefits from. Three questions, then. Does this configuration — a costly display that has saturated, uniform across a population, informative for none, yet still compulsory — have an established name in economics, biology, or sociology? If so, I want to know exactly how the established concept differs from my cases, since the peacock story, and the half-remembered economics claim that university degrees function to display something to employers rather than to teach, both seem to require that the display still separate people, and mine don't. If there is no established name, I'd like you to coin one, define it precisely, and mark out the boundary cases — most importantly the one I suspect holds the key to the whole pattern: when someone opts out, the opting out is itself read as a statement, usually an unflattering one about the person's commitment or taste, even though everyone privately agrees the display is meaningless. Please don't just hand me a label; I want to know what the phenomenon is, what it is not, and where its edges are.
reasoning: |-
  Okay, the user is describing a phenomenon they've observed in their management consulting career and other fields. They notice that everyone is engaging in costly displays—like answering emails at midnight, refereeing papers unpaid, or overspending on weddings—even though these behaviors don't actually signal anything because everyone does them. They're wondering if there's a name for this and how it differs from concepts like costly signaling in biology or economics.

  First, I need to recall relevant theories. Costly signaling theory comes to mind, where signals like a peacock's tail show fitness because only the fittest can afford the cost. But in the user's examples, the signals are uniform and don't vary, so they don't differentiate individuals anymore. That's a key difference. Then there's the Red Queen Effect, where you have to keep running just to stay in place, but that might not capture the signaling aspect.

  The user also mentioned that opting out is seen negatively. That points to norm enforcement. Even if everyone knows the display is pointless, not participating signals a lack of commitment. So it's about social conformity. I should check if there's a concept combining signaling and social norms. Schelling's idea of focal points could be related, but not quite. Maybe pluralistic ignorance, where people privately reject a norm but think others accept it, leading to compliance.

  The user wants a precise definition and boundaries. They need to distinguish this from similar concepts. For example, in education, degrees might still signal ability if not everyone has one, but in their case, universal participation makes the signal meaningless. Also, the penalty for opting out is crucial—it's a social sanction, not just missing out on benefits.

  I think "signaling saturation" could be a good term. It emphasizes that the signal's information value is gone due to universality. The core mechanism is mutual enforcement of a costly norm where deviation is punished, even when the original purpose is obsolete. The boundaries include when the display still has variation (not saturated) or when opting out has no penalty (then the norm collapses).

  The user's deeper need might be to understand why these behaviors persist and how to address them. They might want leverage points for change or validation of their frustration. Highlighting the social enforcement aspect could help them see that collective action is needed to break the cycle.
answer: |-
  Your observation cuts to the heart of a profound and under-discussed social paradox. What you're describing is **Signaling Saturation**: *The state where a costly display, originally intended as a signal of quality or commitment, becomes universally adopted within a population, rendering it non-informative and functionally obsolete, yet its performance remains mandatory due to self-reinforcing social penalties for non-compliance.*

  Let's break this down, contrasting it with established concepts and marking its boundaries:

  1.  **Core Mechanism & Definition:**
      *   **Original Function:** A behavior (midnight emails, unpaid refereeing, lavish weddings) emerges as a *costly signal* (as in Spence's job market signaling or Zahavi's Handicap Principle). The cost (time, effort, money) is meant to credibly convey an underlying, hard-to-observe trait (dedication, competence, social status, group loyalty).
      *   **Saturation:** The behavior becomes *universal* within the relevant group (industry, academic field, social circle). Because *everyone* performs the display at high intensity, it loses its *differential* value. It cannot signal *relative* quality/commitment if everyone exhibits it identically.
      *   **Obsolescence:** The display no longer conveys meaningful information to observers (clients, hiring committees, other families) about the *individual* performer. It becomes background noise.
      *   **Enforced Compulsion:** Despite its loss of signaling value *and* its real cost, failure to perform the display incurs severe social penalties (being "marked," losing opportunities, social disapproval). This penalty stems not from the signal's *informative* value, but from the *violation of the group norm itself*.
      *   **Mutual Assent & Private Resentment:** Group members privately recognize the display's futility and cost, but believe others value it (Pluralistic Ignorance) and fear the penalty of non-compliance. This creates a collective action problem: everyone would be better off if the norm vanished, but no one can unilaterally defect without cost.

  2.  **How it Differs from Established Concepts:**
      *   **Costly Signaling (Spence, Zahavi):** The *core difference* is **variation**. Classic signaling *requires* variation in signal intensity/cost correlated with the underlying quality to be informative. Signaling Saturation occurs *when that variation disappears* due to universal adoption. The peacock's tail *still* varies in size/quality, signaling fitness; your midnight emails do not vary informatively.
      *   **The Red Queen Effect / Arms Races:** While related (e.g., ever-increasing work hours), this focuses on the *escalation* of effort just to maintain position ("running faster to stay in place"). Signaling Saturation focuses on the *loss of information* and *enforcement of obsolete cost* once uniformity is achieved. Escalation can *lead* to saturation, but saturation is the endpoint state.
      *   **Social Norms / Conformity:** Signaling Saturation *is* a type of social norm, but specifically one that:
          *   Originated as a *signaling* mechanism.
          *   Has lost its *original* signaling function due to universality.
          *   Is enforced *primarily* because deviation is interpreted as a *new, negative signal* (lack of commitment, poor taste, disloyalty) rather than just non-conformity.
      *   **Pluralistic Ignorance:** This is often a *supporting mechanism* for Signaling Saturation. People continue the display because they (mistakenly) believe others still find it meaningful and would punish its absence, while privately doubting its value themselves.
      *   **Veblen Goods / Conspicuous Consumption:** These focus on goods whose value *increases* with price, signaling status through waste. This can *lead* to saturation (e.g., everyone "needs" a luxury car), but Veblen goods don't inherently lose *all* signaling value if adopted widely (brand, model, exclusivity often persist). Signaling Saturation applies to *behaviors*, not just goods, and emphasizes the *complete loss* of differential information and the *enforcement penalty*.
      *   **Ritualization:** While saturated signals can become ritualistic, rituals often retain social cohesion functions beyond signaling. Signaling Saturation specifically highlights the *persistence of cost* and *penalty* after the *informational* purpose has vanished.

  3.  **Boundary Cases & Key Edges:**
      *   **The Opt-Out Penalty (The Core Enforcer):** *This is the defining edge.* If opting out carried *no penalty*, the norm would collapse as individuals rationally defect. The penalty arises because **non-participation itself becomes a new, super-signal.** In a group saturated with "commitment displays," *not* displaying is interpreted as:
          *   **Negative Commitment Signal:** "You aren't dedicated enough to pay the pointless cost." (Consulting, Academia)
          *   **Negative Group Loyalty Signal:** "You don't value 'our way' or respect shared sacrifices." (Consulting, Academia)
          *   **Negative Taste/Status Signal:** "You can't *afford* it or don't understand *how things are done*." (Wedding example, potentially consulting bonuses/lifestyle).
          *   **Threat to the Norm:** Your defection highlights the absurdity, making others uncomfortable and potentially threatening the fragile equilibrium. Punishing you reinforces the norm's necessity.
      *   **When Saturation Isn't Complete:** If even a *minority* fails to perform the display *and* that minority exhibits lower underlying quality/commitment, the signal *retains* some value. Saturation requires near-universal adoption *among those for whom the signal is expected*.
      *   **When Cost Becomes Trivial:** If the "costly" display becomes cheap or effortless (e.g., hitting "reply all" instantly with AI), it loses its *cost* element and reverts to a simple conformity norm. The *real, ongoing cost* paid by all is essential.
      *   **When an External Observer Still Values It:** If clients *mistakenly* believe the midnight emails *do* signal something unique, or if academic hiring committees *do* value excessive refereeing, the signal isn't fully saturated *for that audience*, even if insiders know it's meaningless. True saturation implies the display fails to inform *relevant observers*.
      *   **Distinction from Pure Status Displays:** If the wedding expense *still* allowed Family A to visibly outspend Family B, conveying higher status, it wouldn't be saturated. Saturation occurs when the display level becomes the *minimum required* just to avoid penalty, not to gain advantage.

  **In Essence:**

  Signaling Saturation is a **social trap**. A behavior, initially useful for signaling, becomes so universally adopted and intensely performed that it ceases to provide useful information. However, the *cost* remains real, and crucially, *failure to pay this now-pointless cost* is interpreted by the group as a *new, highly negative signal* (lack of commitment, disloyalty, low status). This penalty enforces universal participation in a costly ritual that benefits no one, sustained by mutual fear and pluralistic ignorance. It's the point where the peacocks all have equally gigantic, cumbersome tails, no peahen learns anything new by looking at them, but any peacock who molts his tail is immediately ostracized as "unfit."

  The escape requires coordinated action to redefine norms and decouple non-participation from negative judgments – a challenge as immense as the costs currently being borne. Your identification of this pattern is remarkably astute; it's a pervasive but often invisible engine of modern inefficiency and burnout.
