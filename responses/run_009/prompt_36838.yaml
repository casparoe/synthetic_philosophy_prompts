  For the gradualist test, I'll argue that while there's no magic threshold, the absurdity of flipping coins for thousand-vs-one reveals that aggregation becomes morally necessary beyond some point. The complaint test is tricky - if no individual is wronged when we save the many, what kind of wrong is committed? I'll suggest it's a wrong against the value of human life itself when we refuse to acknowledge its cumulative weight. 

