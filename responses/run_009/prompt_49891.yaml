prompt: |-
  I have recently taken a seat as the physician member of the clinical ethics committee at a mid-sized public hospital, and the appointment has turned questions I used to treat as seminar material into decisions I am accountable for. Next week I must present our recommendation on a scarce-resource case, and before I do, I want to understand what our own precedent record actually commits us to. Here is the record from the surge two winters ago, which the senior members treat as controlling:

  1. Withholding. Our stock of the only effective agent was sufficient for two of three patients, all of whom would certainly die without it and were expected to recover with it. We treated the two and withheld from the one.

  2. Reallocation. We moved our single ECMO circuit from Patient D, who could not survive to discharge and would die within the day without it, to Patient E, who had a strong chance of recovery. We accepted that D would die within hours of disconnection; the disconnection, not D's death, was what made the circuit available.

  3. The transplant proposal. We rejected, unanimously, a plan to give Patient F a lethal infusion so that his organs could save two patients in end-stage failure. F was gravely ill but would have survived with continued treatment. We did not treat the projected net saving of a life as counting in favor.

  4. Palliative dosing. We approved escalating sedation for Patient G's refractory terminal suffering at doses that foreseeably shortened her life. Her death was not the aim, and hastening it was no part of how the sedation relieved her.

  5. Refusal of requested death. We declined to comply with Patient J's own repeated, competent request for a lethal dose in his final days, notwithstanding his suffering and notwithstanding that two of us privately thought the refusal cruel.

  The new case, which must be decided within hours: a freezer failure destroyed our inventory of the red-cell units compatible with three patients now exsanguinating — an obstetric hemorrhage, a trauma, and a gastrointestinal bleed, each carrying multiple red-cell antibodies and compatible only with antigen-negative blood that our supplier cannot deliver for some fourteen hours, long after all three will have died. The only compatible donor on site is Patient K: an unconscious man in our own ICU with precisely that rare antigen-negative blood, deteriorating from a condition likely to kill him within two weeks in any event, with no surrogate reachable and no time to petition a court. Extracting the volume the three need tonight would very likely precipitate his death within hours — not as our aim, but as a foreseeable effect of drawing that much blood from a man in his condition.

  What should we decide if we want to be consistent with ourselves? Please identify the closest analog among the five precedents; name the rule we seem to have been running, and the rival rules that fit the record about as well (for instance, a doctrine of double effect reading, a prohibition on using a person merely as a resource, or a distinction between what we do and what we allow); and state candidly which principle we would be adopting if we extract the blood, and which if we refuse. If the record genuinely underdetermines the answer — and I suspect it does — tell me so, give me your best guess at our verdict anyway with your reasons for preferring it, and describe the further case, in outline, that would best discriminate between the rival rules.
reasoning: |-
  Okay, let me start by really understanding what the physician is asking. They're new to the ethics committee and need to make a recommendation on a scarce-resource case involving taking blood from a dying patient to save three others. They provided five precedents and want consistency. 

  First, I need to parse each precedent carefully. Precedent 1 is withholding treatment from one to save two others. That seems utilitarian—maximizing lives saved. Precedent 2 reallocates a resource from a patient who won't survive to one who will. Again, saving a life by reallocating based on prognosis. Precedent 3 rejected killing one to save two, even if net life saved. So actively causing death is off-limits. Precedent 4 allowed palliative sedation that hastened death as a side effect, using double effect. Precedent 5 refused assisted dying despite patient request, valuing life sanctity over autonomy.

  Now the current case: Taking blood from Patient K will likely kill him but save three others. The key points are that death is a side effect, not the intent, but it's still an active intervention. How does this compare to the precedents?

  Looking at Precedent 3: They rejected killing for organs. Actively causing death was unacceptable. But here, the death isn't intentional; it's a side effect. Precedent 4 allowed sedation that hastened death as a side effect. So maybe double effect applies? But extracting blood is more direct than sedation. It's physically causing harm, whereas sedation was managing symptoms. 

  Precedent 2 involved reallocating a resource but only after the patient was going to die naturally. Here, Patient K might live two weeks, but the blood draw would actively cause death. That's different. Precedents 1 and 2 didn't involve active harm; they involved withholding or reallocating. Precedent 3 explicitly prohibits active harm to use someone as a resource.

  The committee seems to distinguish between allowing death (withholding, reallocating) versus causing death (killing for organs). Patient K's case is causing harm that leads to death, which is closer to Precedent 3. But the double effect might argue that the intent is to save others, not kill K. However, Precedent 3 rejected net saving lives as a justification when active killing was involved. So even if the intent isn't to kill, using K's body as a resource might violate the principle against instrumentalization.

  The physician suspects underdetermination. Precedents 1,2,4,5 align with rules like proportionality and double effect, but Precedent 3 draws a line at using a person. So if they take the blood, they're prioritizing outcomes over individual rights. If they refuse, they're upholding inviolability even at high cost. 

  A discriminating case would be one where an unconscious patient could be saved, but treatment is withheld to use organs for others. That would test if they truly prioritize non-use over saving lives, reinforcing Precedent 3's principle.
answer: |-
  Based on your record, the closest analog is **Precedent 3 (The Transplant Proposal)**, and consistency likely requires **refusing to extract Patient K's blood**. Here's the analysis:

  ---

  ### **1. Closest Analog: Precedent 3 (Transplant Proposal)**
  - **Parallels**: 
    - Both involve *actively causing one patient's death* (lethal infusion / massive blood draw) to harvest biological resources (organs/blood) to save others.
    - Both patients (F and K) would likely die soon regardless, but could survive longer with continued treatment.
    - Both lack consent (F was never consulted; K is unconscious with no surrogate).
  - **Distinction**: 
    - Precedent 3 involved *intentional killing* (lethal infusion), while K's death would be a *foreseeable side effect* of blood extraction.  
    *However*, your committee rejected the transplant *not solely because it was intentional killing*, but because it violated the principle that **a person cannot be used as a resource to save others**—even when net lives would be saved. This core principle applies equally here.

  ---

  ### **2. The Rule Your Committee Seems to Follow**
  - **The "Anti-Instrumentalization" Principle**:  
    *It is impermissible to actively harm or cause the death of one patient—even foreseeably—primarily to use their body as a means to save others, regardless of net utility.*  
    - **Support**: 
      - Precedent 3 explicitly rejects sacrificing one to save others, even with a net gain.
      - Precedent 2 (ECMO) involved *reallocating a resource already in use* from a patient with no survival chance to one with a chance. It did not *create* harm (Patient D was dying imminently regardless); it merely allowed nature to take its course sooner.
      - Precedent 1 (Withholding) allowed natural death by inaction, not active harm.
      - Precedent 4 (Palliative dosing) accepted unintended hastening of death *as a side effect of relieving suffering*, not harvesting resources.
      - Precedent 5 (Refusal of death) prioritizes the sanctity of life over autonomy when death is the direct goal.

  ---

  ### **3. Rival Rules (Rejected by Your Record)**
  - **Utilitarianism**: Maximize net lives saved.  
    *Why rejected?* Precedent 3 explicitly overruled this (net saving a life did not justify killing F).
  - **Doctrine of Double Effect (DDE)**: Permits harm as a foreseen side effect if:  
    (a) The act is good/neutral (e.g., sedation),  
    (b) Harm is not intended,  
    (c) Good effect isn't achieved *by* the harm, and  
    (d) Proportionality justifies the harm.  
    *Why rejected here?* Your committee’s DDE application (Precedent 4) requires the *primary goal* to be the patient's own welfare (relieving suffering). Extracting K's blood fails (a) and (c): the "good" (saving others) *requires* harming K, violating anti-instrumentalization.
  - **Distinction Between Killing and Letting Die**:  
    *Why insufficient?* Your record forbids *both* active killing (Precedent 3) *and* using a patient as a resource via active harm (K's case). Precedent 2 allows "letting die" only when no survival chance exists.

  ---

  ### **4. Principles Adopted by Each Decision**
  - **If you EXTRACT the blood**:  
    You adopt **Consequentialism with DDE Overextension**:  
    *Foreseeable harm to one patient is permissible if it saves more lives, provided the harm isn't "intended."*  
    This contradicts Precedent 3, where intention was secondary to the prohibition on using a person as a resource.
    
  - **If you REFUSE to extract**:  
    You uphold the **Anti-Instrumentalization Principle**:  
    *A patient’s bodily integrity cannot be violated to harvest resources for others, even in extremis.*  
    This aligns with Precedent 3 and your committee’s prioritization of individual inviolability over aggregate outcomes.

  ---

  ### **5. Underdetermination and Best Guess**
  - **Yes, the record underdetermines the answer**.  
    Precedent 3 is the strongest guide, but K’s death being a *foreseeable side effect* (not an intentional aim) creates ambiguity. Precedent 4 shows you accept DDE, but only for the *patient’s own benefit*.  
    - **Best Guess**: Your committee would **REFUSE extraction**.  
      **Why?**  
      - Precedent 3 establishes a bright line: *never use a patient’s body against their interests to save others*. Blood extraction is physiologically akin to organ harvesting—both involve non-consensual, life-ending appropriation of biological material.  
      - Precedent 2 involved discontinuing *futile* treatment (D had no survival chance); K has >0 survival chance (2 weeks).  
      - Precedent 5 prioritizes life sanctity over suffering relief.  
      - **Risk of Slippery Slope**: Allowing this would undermine trust in ICU care and open the door to utilitarian overrides of bodily autonomy.

  - **Discriminating Case for Clarity**:  
    *"The Unconscious Organ Donor"*:  
    An unconscious, dying patient (survival: days) is the only match for a life-saving organ transplant needed by two stable patients. Harvesting the organ would immediately kill the donor.  
    - **Why it discriminates**:  
      - Tests whether your rejection of Precedent 3 was based *only* on intention (killing) or *also* on instrumentalization (using the body as a resource).  
      - If you still prohibit harvesting, anti-instrumentalization is your core principle. If you allow it, intention (or DDE) is decisive.

  ---

  ### **Recommendation for Consistency**
  To be consistent with your precedent—especially the **absolute rejection of instrumentalization in Precedent 3**—**do not extract Patient K's blood**. The moral cost of violating bodily integrity to use a person as a resource outweighs the net lives saved. Your committee’s record suggests this principle is non-negotiable, even in tragic scarcity. 

  **Final Step**: Frame your recommendation around *why* K is different from the ECMO case (Precedent 2): Disconnecting ECMO allowed an inevitable death to occur; extracting blood *causes* death to exploit K’s body. That distinction is ethically decisive in your framework.
