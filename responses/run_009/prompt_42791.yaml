  i'm a PhD student in cog sci and my advisor and i keep going in circles on this one. She gives maybe 10% that the ordinary concepts of belief and desire will eventually go the way of phlogiston -- dropped by mature science rather than revised -- and i give maybe 25%, mostly because i keep running into messy cases (self-deception, implicit biases, aversions that don't line up with what people sincerely avow) where the folk picture of attitudes as discrete, mutually consistent, behavior-guiding states fits really badly. Give me your own credence, but the number matters less than the decomposition. A few terms i'd want on the table: the probability that belief-desire psychology even functions as an empirical theory that could come out strictly false, rather than a framework so entrenched it gets immunized against refutation; conditional on it being falsifiable, the probability that science eliminates it outright rather than just patching it locally; how much to discount for the track record of past 'eliminations' failing to spread from journals into everyday talk (nobody stopped saying the sun rises); and anything else you think belongs in there. Then tell me which term you're least confident in and what would move it. One more thing: which of us do you think is more likely just using 'eliminated' differently -- she may mean gone from serious science, i may half mean gone from how ordinary people talk -- and if that's a verbal dispute, say so plainly.
