prompt: |-
  My roommate has strong opinions about knowledge-how and I'm trying to figure out what view she actually holds before her cousin visits. Her verdicts so far: a ski instructor who could write the definative manual on ski technique but can't stay upright — she says he does NOT know how to ski. A self-taught natural who skis beautifully but couldn't explain the first thing about what she's doing — knows how. A guy who picked up a putter for the very first time and drained the putt — doesn't know how to putt, lucky isn't skilled. A lifelong cyclist who's totally wrong about how bikes stay up (he thinks you keep the handlebars dead straight) — knows how to ride. And a retired surgeon whose hands now shake too badly to operate but who remembers every step — still knows how to operate, she insists. When her cousin comes three cases are on the table: (1) an apprentice baker who has never once baked on her own but has watched a master for years and would turn out a perfect loaf on the first solo attempt — does she know how to bake before that first loaf? (2) a golfer who shoots great scores but only because a coach feeds her instructions through an earpiece in real time, and falls apart the second the coach goes quiet; (3) a typist doing 90 wpm who sincerely swears he has no idea how he does it. Predict her verdicts on all three, say what rule she seems to be running — I can see at least an ability-plus-reliability view and something like a Stanley-and-Williamson practical-mode-of-presentation thing both fitting the first five cases — and tell me which of the three would best pull those rules apart, plus one further case that would settle it if these don't manage to. (And is she right that my "it's all just knowledge-that under a funny description" line makes me a closet intellectualist? that part is mostly for my pride.)
reasoning: |-
  Hmm, the user is trying to figure out their roommate's philosophical stance on knowledge-how based on her judgments about various scenarios. They've provided several cases where she's made clear verdicts: the ski instructor who can't ski doesn't know how, the natural skier does know, the lucky putt isn't knowledge, the cyclist with wrong beliefs still knows, and the surgeon with shaky hands retains knowledge. Now three new cases are coming up when her cousin visits, and the user wants predictions, to identify the underlying rule, and to test between intellectualist vs. ability-based views.

  First, I need to analyze the roommate's existing verdicts. She clearly separates theoretical knowledge from practical ability. The ski instructor has all the theoretical knowledge but can't perform, so he doesn't know how. Conversely, the self-taught skier performs well without being able to explain, so she does know. The first-time putter is just lucky, not skilled—so reliability matters. The cyclist has the ability despite false beliefs, which suggests that ability trumps theoretical understanding. The retired surgeon retains the knowledge despite current inability, indicating that past reliable ability might be sufficient.

  Looking at the new cases: (1) The apprentice baker has never baked alone but would succeed on the first try. Since she hasn't actually performed yet, but the roommate accepted the surgeon who can't operate now, maybe she'd say the baker knows how? The surgeon's case implies that disposition based on past ability counts, but the baker has no past performance. This might lean towards Stanley & Williamson's view where the ability is tied to a practical mode of presentation, even if not exercised.

  For (2) the golfer with the coach: she performs well only with instructions, not independently. The roommate rejected the ski instructor who can't perform, so likely she'd say this golfer doesn't know how, because the ability isn't reliable without external help. It's similar to the lucky putt—no real skill.

  Case (3) the typist who types fast but claims no knowledge: this resembles the natural skier who couldn't explain. The roommate said that skier knows how, so probably she'd say the typist knows how, emphasizing ability over articulable knowledge.

  The underlying rule seems to be: S knows how to φ iff S has a reliable ability to φ, grounded in competence rather than luck. The surgeon retains the competence from past ability, while the lucky putt lacks reliability. The cyclist has competence despite false beliefs. This points to an ability-based view, maybe like Ryle's, where know-how is demonstrated through successful performance.

  However, the first five cases could also fit Stanley & Williamson's intellectualist view, where know-how is a form of knowledge-that under a practical mode of presentation. For example, the natural skier has non-propositional knowledge manifested in action. But the roommate might reject that because she emphasizes ability. The baker case could differentiate: if she says the baker knows how without ever performing, that leans intellectualist (dispositional ability), but if she says no, it's more ability-based. Since she accepted the surgeon, who has past performance, she might not extend it to the baker with no actual performance.

  The golfer case with the coach would best pull the rules apart. If she says the golfer doesn't know how, it supports ability-based views requiring independent competence. If she says she does know, it might lean towards intellectualist views where the instructions provide the knowledge-that. But based on her past rejections of unreliable performance, she'd likely say no.

  A further case to settle it: imagine someone who has the theoretical knowledge and has performed before but can't now due to temporary amnesia. If she says they don't know how, it's ability-focused; if yes, it's intellectualist. Or, someone with no experience but innate talent—untested. But she accepted the self-taught skier, so innate ability might count if reliable.

  On the user's pride: if they think know-how is just knowledge-that "under a funny description," that is intellectualist. Given the roommate's emphasis on ability, she'd call them a closet intellectualist. But her view seems anti-intellectualist, so she'd disagree.

  Predicting her verdicts: (1) Baker: knows how, because dispositional ability. (2) Golfer: doesn't know, lacks independent ability. (3) Typist: knows how, ability present. Rule: reliable ability grounded in competence. The golfer case pulls apart ability vs. intellectualist views. Further case: someone with theoretical knowledge and past ability but current temporary inability (e.g., amnesia) to test if current ability is necessary.
answer: |-
  Based on your roommate's verdicts, her view is a robust **anti-intellectualist, ability-centric view** with a strong emphasis on **reliable, non-lucky performance**. She prioritizes *successful action grounded in competence* over theoretical knowledge or past ability alone. Here's a breakdown of her likely verdicts, the rule she follows, and how to test it further.

  ### Predicted Verdicts for the Three Cases:
  1. **Apprentice baker (watched for years, would succeed on first try)**:  
     **Verdict: DOES NOT know how to bake yet.**  
     *Why?* She hasn't *actually performed* the task. Your roommate requires demonstrated reliable ability, not just potential. The surgeon case involved a *history* of successful performance; here, there's zero track record. Mere disposition isn't enough—it needs to be actualized or grounded in past success.

  2. **Golfer with earpiece coach (fails without instructions)**:  
     **Verdict: DOES NOT know how to play golf.**  
     *Why?* This golfer lacks *independent* ability. Like the "lucky putt" case, success here is externally dependent and unreliable without the coach. Your roommate requires the skill to be *internalized*—the golfer is a passive executor, not a competent agent.

  3. **90 wpm typist (no idea how he does it)**:  
     **Verdict: KNOWS how to type.**  
     *Why?* This mirrors the "self-taught skier" and "cyclist with false beliefs." Reliable performance trumps the inability to articulate *how*. Competence is demonstrated through consistent action, even if unconscious.

  ### The Rule She’s Running:
  - **"Reliable Ability as Competence" (RAC)**:  
    *S knows how to φ if and only if S possesses a reliable, non-lucky ability to φ, grounded in their own competence (i.e., the success is attributable to S's skill, not external factors), and this ability is either currently exercisable or was robustly demonstrated in the past.*  
    - **Key elements**:  
      - **Anti-intellectualism**: Knowledge-how isn't reducible to knowledge-that (rejects your "closet intellectualist" view).  
      - **Performance-centric**: Current or past reliable action is essential (rejects the ski instructor, accepts the surgeon).  
      - **Non-luck**: Success must stem from skill, not chance or dependence (rejects the putt and golfer).  
      - **Competence over cognition**: Ability doesn’t require correct beliefs or articulacy (accepts the typist and cyclist).  

  ### Why Stanley & Williamson (S&W) Doesn’t Fully Fit:
  S&W’s intellectualist view (know-how as knowledge-that under a practical mode of presentation) *could* explain some cases (e.g., the natural skier has non-propositional practical knowledge). But it **fails** for your roommate:  
  - She rejects the ski instructor who *has* full propositional knowledge.  
  - She accepts the cyclist with *false* propositional beliefs.  
  - She requires *ability* (e.g., the typist’s performance matters more than his lack of "presentation").  
  Her view is closer to **Rylean anti-intellectualism** (know-how as ability) or **virtue-reliabilism** (knowledge as reliable success from competence), not S&W.

  ### Which Case Best Pulls the Rules Apart?
  **The golfer case (2)** is the best wedge:  
  - **Under RAC (her view)**: The golfer fails because her success isn’t self-sufficient; it’s parasitically reliant on the coach. No independent competence → no knowledge-how.  
  - **Under S&W**: If the golfer understands the coach’s instructions *as practical knowledge*, she might "know how" via the externalized "mode of presentation." Your roommate would reject this.  
  This case forces a choice between *internalized ability* (RAC) and *externalizable knowledge* (S&W). Her verdict ("doesn’t know") confirms her anti-intellectualism.

  ### A Further Case to Settle It:
  If the three cases don’t fully resolve it, try this:  
  > **"The Amnesiac Pianist"**: A concert pianist suffers amnesia. She forgets all music theory and can’t explain scales, but when seated at a piano, she plays complex pieces flawlessly out of habit. Does she know how to play?  

  - **Predicted RAC verdict**: **YES**. Reliable ability persists despite lost propositional knowledge (like the cyclist/typist).  
  - **S&W verdict**: **NO** (or unclear). Amnesia may disrupt the "practical mode of presentation" linking knowledge-that to action.  
  This tests whether *ability alone* suffices (her view) or if cognitive access is needed (intellectualism). Her "yes" would cement RAC.

  ### On Your Pride (and Intellectualism):
  **Yes, your "it's all just knowledge-that" line makes you a closet intellectualist.** Your roommate’s view explicitly rejects this: for her, know-how is *sui generis*—ability isn’t disguised propositional knowledge. Intellectualism can’t explain her verdicts (e.g., the cyclist’s false beliefs or the typist’s lack of articulation). Embrace the Rylean life, or prepare to debate!  

  ### Summary:
  | Case                  | Roommate’s Verdict | Why?                                |
  |-----------------------|--------------------|-------------------------------------|
  | Apprentice baker      | ❌ No knowledge    | No actual performance history       |
  | Golfer with earpiece  | ❌ No knowledge    | Success isn’t self-reliant          |
  | 90 wpm typist         | ✅ Knows how       | Reliable ability > articulation     |
  | **Rule**: Knowledge-how requires reliable, competent ability (past or present), not luck or dependence. |  

  When her cousin visits, watch the baker case closely—it’s the most contentious. If she waffles, the amnesiac pianist will force clarity. Good luck defending your intellectualism! 🏂🎾👩‍🍳
