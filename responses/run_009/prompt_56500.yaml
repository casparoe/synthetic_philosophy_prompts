  Here’s a careful analysis of the Spitzer scandal through the lens of standing to blame and hypocrisy literature, mapping the complexities rather than reducing it to a punchline:

  **1. The Blamers and the Question of Standing:**
     *   **The Diffuse Public:** Their standing is contested. On one hand, they granted Spitzer authority based on his "moral crusader" image; his hypocrisy betrayed that trust, arguably giving them standing to condemn the *betrayal* and *erosion of public trust*. However, mass public condemnation is often anonymous, inconsistent, and laced with schadenfreude, weakening claims to consistent moral commitment required by some standing theories (e.g., R. Jay Wallace). Their standing derives more from being the *deceived collective* whose trust was exploited than from impeccable personal virtue.
     *   **The Press:** Functionally, the press acts as proxy for the public and custodian of public figures' accountability. Their standing hinges on their role, not personal purity. While accusations of media hypocrisy ("hounding him while ignoring systemic issues") arose, their primary standing comes from exposing the *discrepancy* between Spitzer's public persona and private acts – a core journalistic function. Their legitimacy depends on procedural fairness and intent (public interest vs. sensationalism).
     *   **Political Rivals:** Their standing is most vulnerable. Accusations of hypocrisy from rivals risk being seen as opportunistic weaponization of morality for political gain (the "tu quoque" fallacy). While the *substance* of their criticism might be valid, their *standing* is severely compromised because their condemnation appears self-serving rather than rooted in genuine moral concern for the principle violated. Their blame primarily served to force resignation via political pressure, not moral dialogue.
     *   **Prosecutor Colleagues & Former Targets:** This group holds the strongest potential claim to standing under traditional theory.
          *   *Colleagues:* Shared the prosecutorial mission and professional ethical standards Spitzer championed and then violated. Their standing stems from shared commitment to the norms he betrayed. Their condemnation likely carried significant weight *within* the legal/political sphere due to this shared identity and the perceived damage to the profession's reputation.
          *   *Former Targets:* Potentially the most ironic claimants. Their standing is complex. While Spitzer's hypocrisy *validated* their past claims of his self-righteousness or unfairness, their own prior misconduct (the reason he prosecuted them) undermines their *moral authority* to condemn *his* sexual misconduct. Their condemnation primarily served to discredit *him* and his past actions against them, rather than uphold the principle against solicitation.

  **2. What Hypocrisy Adds: Beyond the Underlying Conduct**
     Hypocrisy added distinct and significant wrongs beyond the act of solicitation itself:
     *   **Moral Fakery & Betrayal of Trust:** Spitzer built his power and reputation (as AG and Governor) on a persona of exceptional integrity and moral rigor, specifically targeting corruption and prostitution rings. His private conduct revealed this persona as, at best, a facade and, at worst, a calculated deception. This was not just wrongdoing; it was a *betrayal* of the public trust invested in that persona. He traded on a reputation for integrity he did not uphold.
     *   **Erosion of Public Trust & Democratic Function:** Hypocrisy in a leader, especially one defined by moral authority, corrodes public faith in government and the integrity of public office. It makes future genuine moral leadership harder to establish and trust.
     *   **Compounding the Wrong Against Sex Workers:** As a prosecutor who aggressively targeted prostitution rings, his participation as a client demonstrated a profound disrespect for the very individuals he claimed to be protecting or the systems he claimed to be upholding. It revealed a power imbalance and potential cynicism underlying his prosecutions.
     *   **Discounting Past Blame:** Yes, it significantly discounted his past moral condemnations. His prosecutions of others for similar acts (prostitution-related offenses) and corruption lost moral force. It suggested his condemnations were not rooted in genuine principle but perhaps in self-aggrandizement, political calculation, or even psychological projection. The *force* of his past blame was undermined, regardless of its factual accuracy.

  **3. The Limits of Standard Machinery: Collective, Anonymous, Schadenfreude-Laced Blame**
     The standard interpersonal model of blame (A blames B, staking A's own character) struggles profoundly here:
     *   **Collective & Anonymous Blame:** Mass public condemnation isn't a unified agent staking its character. It's a diffuse, often contradictory, wave. Individuals within the "public" don't individually stake their moral standing; anonymity shields them. The "character" staked is amorphous – a perceived collective moral standard Spitzer violated, not the specific virtues of individual blamers. The theory struggles to parse *who* exactly lacks standing in an anonymous crowd.
     *   **Schadenfreude:** The palpable glee ("he got what he deserved") contaminates the moral force of condemnation. It shifts the focus from upholding principles to reveling in the downfall of a perceived hypocrite. This undermines the claim that the blame is primarily about restoring moral order; it reveals a baser, punitive enjoyment inconsistent with the high-ground posture often implied in standing theories.
     *   **Sound Criticism Despite Lapsed Standing:** The core insight holds: Spitzer's past prosecutorial *arguments* (e.g., prostitution rings exploit women, Wall St corruption harms society) weren't rendered *factually* false by his hypocrisy. The legal cases weren't invalidated. However, in the *public arena of moral condemnation*, his hypocrisy fatally undermined his *authority* to make those arguments *as a moral crusader*. The public largely dismissed his past moralizing *because* of who delivered it, not because the underlying evils ceased to exist. The "soundness" of the criticism survived in abstract principle but lost virtually all persuasive power *coming from him*.

  **Conclusion: What the Case Teaches the Theory**

  The Spitzer case doesn't render standing theories useless, but it exposes their limitations and necessitates adaptation:

  1.  **Standing Matters, But Differs in Public Sphere:** Standing *does* operate powerfully in public scandals, but its basis shifts. It becomes less about the blamer's *personal* virtue in a direct interpersonal sense and more about:
      *   **Betrayal of Role-Based Trust:** The public trusted Spitzer *in his role* based on his persona. Hypocrisy violated that role-specific trust.
      *   **Exploitation of Reputation:** Standing is lost because the hypocrite *leveraged* a reputation for integrity to gain power/authority they undermined.
      *   **Relationship to the Principle:** Those most closely associated with the principle violated (colleagues) retain stronger standing; those using it opportunistically (rivals) have weaker standing.
  2.  **Hypocrisy as a Distinct, Amplifying Wrong:** The case powerfully demonstrates that hypocrisy isn't merely a discount on past blame; it's an *additional, distinct wrong* involving moral fakery, betrayal, and erosion of institutional trust. This dimension is crucial for understanding the intense public reaction.
  3.  **The Collective Problem:** The theory *is* strained by mass, anonymous condemnation. It struggles to neatly assign "standing" to a diffuse entity exhibiting schadenfreude. This suggests the core theory is indeed optimized for face-to-face reproach or defined communities with shared norms.
  4.  **Schadenfreude as a Confounding Factor:** The prevalence of schadenfreude in public scandals reveals that public condemnation is often a messy mix of genuine moral concern, outrage at betrayal, and visceral enjoyment of the fall. Standing theories, focused on the moral claim, don't adequately account for this contaminating element, which undermines the purity of the "blamer stakes their character" premise.
  5.  **Power of the Persona:** The case underscores that for public figures, especially those built on moral authority, the *persona* is a core asset. Hypocrisy destroys that asset, making continued leadership untenable regardless of the precise standing calculations of individual blamers. The loss of standing is effectively total in the court of public opinion.

  **In essence:** The Spitzer case validates the *core insight* of standing theories – hypocrisy severely damages the authority to blame – but highlights that in mass public scandals, standing functions more through the lens of *betrayal of public trust and exploited reputation* within a specific role, rather than through the meticulous accounting of individual blamer virtue central to interpersonal models. It exposes the theory's limitations regarding anonymity and schadenfreude while confirming the distinct, corrosive wrong of hypocrisy itself. The theory doesn't "misdescribe" mass condemnation, but it requires recognizing that mass condemnation operates by different, messier, yet still morally significant rules where perceived betrayal is paramount.
