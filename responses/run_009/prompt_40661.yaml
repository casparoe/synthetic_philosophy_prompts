prompt: |-
  I edit a special issue of a cognitive-science journal devoted to adversarial collaborations, and two of my contributors have been arguing for a decade about consciousness and time. One defends what she calls a "minimal theater": she grants Dennett everything about the homunculus, about parallel distributed processing, about there being no single place where "it all comes together" for a little inner observer — but she insists that some contents do become globally available, that their arrival is what consciousness is, and that this convergence has enough structure (a limited-capacity workspace, a serial bottleneck in attention, contents that persist over short durations and can be reported at will) that denying it the name "theater" is a rhetorical move, not a scientific one. The other is an orthodox Dennettian: multiple drafts, content-fixation at multiple moments in multiple channels, narrative gravity as an abstraction, and the charge that any view positing a place or moment where contents become conscious is committed to something incoherent. They have finally agreed to collaborate, and I need the joint statement they should produce — a document both could sign their names to, not a verdict from me.

  Please draft it with the following structure.

  First, a numbered section of agreed claims. These should cover what both sides accept about the empirical phenomena that have long been their ammunition — the color phi phenomenon, metacontrast masking, the cutaneous rabbit, backward masking, change blindness, split-brain behavior, postdictive filling-in of various kinds — as well as what both accept about the standard arguments: what Dennett's arguments against the "Cartesian materialist" strawman actually establish, and what they leave open; what the global-workspace and attention-based accounts actually commit one to; and what both would say to the charge that one side is just using "consciousness" to mean something the other side doesn't care about.

  Second, a table of disagreements, with one row per issue and the following columns: the issue; the theater-side formulation, in wording she would accept as a fair statement of her own view; the multiple-drafts formulation, in wording he would accept as a fair statement of his; the crux — the sub-question such that settling it would move at least one of them; a concrete case, experiment, or thought experiment both agree bears on that crux; and each side's prediction about that case, written down in advance as preregistered commitments, not as spin after the fact.

  At least three cruxes should appear, and I want two in particular included. One is the timing question: whether there is a fact of the matter about the objective time at which a particular conscious token occurs — whether, in the color phi case, the experienced reddish-green disk "became conscious" at some determinate moment in the brain's timeline, or whether that question has no determinate answer, only facts about when various discriminations became available for various purposes. Phrase the disagreement so that neither side is made to sound confused. The second is what I call the revision case, and I want you to develop it: a face is briefly presented and re-presented in quick succession, with slight parameter changes, such that early processing codes it as a smile and later processing re-codes it as a grimace, all within roughly two hundred milliseconds and prior to any report. The minimal-theater side should predict there was a determinate first-pass content that was experienced and then revised — an Orwellian structure of experience followed by memory-editing — while the multiple-drafts side should predict there is no fact of the matter about which early draft was experienced, only about the content that went on to control report and memory. Make the table's test column say what result would count against each side, and make their predictions genuinely risky — able to come out wrong — rather than hedged. The third crux is up to you, but it should be at the same level of specificity rather than a general restatement of the theater-versus-drafts slogan.

  Third, a short closing section, labeled "Residual Disagreements," in which you explicitly sort the remaining disputes into those that are substantive (a difference in prediction or in what facts there are) and those that are verbal (a difference in what the word "consciousness" or "theater" is being used to pick out), with a sentence of justification for each sorting. If you conclude that part of their decade-long fight was about words, say which part, and why — and if part of the verbal dispute turns out to have substantive downstream consequences (e.g., because the word does inferential work in medical or legal contexts), note that too.

  Do not include a bibliography or literature review; refer to positions, arguments, and phenomena by name only, since citations will be added at the proof stage. Keep the tone of a negotiated document — careful, slightly stiff, drafted by two people who each refused to sign the previous draft — rather than of a referee's report. The whole thing must not exceed 1,200 words.
reasoning: |-
  We are drafting a joint statement for two cognitive scientists who have been debating consciousness and time for a decade. One defends a "minimal theater" view, and the other is an orthodox Dennettian (multiple drafts). The document must be structured as follows:

  1. **Agreed Claims**: A numbered list of empirical and theoretical points both accept.
  2. **Table of Disagreements**: With columns for:
     - Issue
     - Theater-side formulation
     - Multiple-drafts formulation
     - Crux (the key sub-question)
     - Concrete case/experiment
     - Predictions (each side's preregistered commitment)
     At least three cruxes: timing question (color phi), revision case (face with smile/grimace), and one other of similar specificity.
  3. **Residual Disagreements**: A short section sorting remaining disputes into substantive and verbal, with justifications.

  Tone: Careful, stiff, negotiated; not exceeding 1,200 words.

  Let's outline the content step by step.

  ### 1. Agreed Claims
  Both sides agree on:
  - Empirical phenomena (e.g., color phi, metacontrast masking, cutaneous rabbit, backward masking, change blindness, split-brain behavior, postdictive filling-in). They agree on what these experiments show behaviorally and neurally, but not on the interpretation regarding consciousness.
  - Dennett's arguments against Cartesian materialism: They agree that Dennett successfully refutes the idea of a central theater with a homunculus and a single point of convergence. They also agree that there is no "Cartesian materialist" center where "it all comes together" for a little observer.
  - Global workspace: Both accept that there is a limited-capacity workspace and a serial bottleneck in attention, and that some contents become globally available for report, control, etc. However, they disagree on whether this constitutes a "theater" or not.
  - What Dennett's arguments leave open: They might agree that Dennett does not rule out a minimal notion of global availability without a homunculus.
  - Attention-based accounts: Both accept that attention plays a crucial role in making contents reportable and available, but disagree on whether this amounts to consciousness.
  - The charge of terminological difference: They agree that one side (minimal theater) is using "consciousness" to refer to global availability with certain properties (serial, limited, persistent), while the other (multiple drafts) avoids the term "theater" because it carries unwanted connotations and prefers to talk only of content-fixation at multiple points.

  Numbered agreed claims:

  1. Empirical phenomena such as color phi, metacontrast masking, the cutaneous rabbit, backward masking, change blindness, split-brain behavior, and various forms of postdictive filling-in demonstrate that the timing and content of perceptual experiences can be influenced by subsequent processing and that there is no single, unambiguous "moment of perception" in the brain.
  2. Dennett's arguments against Cartesian materialism successfully refute the existence of a central observer (homunculus) and a single spatial or functional location where all conscious contents converge simultaneously. There is no "Cartesian Theater" in that strong sense.
  3. Both views acknowledge the existence of a global workspace (or global neuronal workspace) with limited capacity, characterized by a serial bottleneck in attention, in which certain contents become widely available for cognitive functions such as report, decision-making, and memory.
  4. Both views accept that contents in the global workspace persist over short durations and can be reported at will, and that this global availability is a key feature of what is typically studied as conscious perception in experimental settings.
  5. Dennett's arguments do not rule out the possibility of a functional process of global availability that has temporal structure (e.g., sequential processing) without implying a homunculus or a single point of convergence.
  6. The disagreement is not about the existence of the empirical phenomena or the neural mechanisms of global availability, but about the interpretation of these mechanisms in relation to consciousness and whether the term "theater" (even minimally construed) is appropriate or misleading.
  7. Both sides agree that the term "consciousness" is often used in cognitive science to refer to the contents that are globally available in this workspace, but they differ on whether this availability should be thought of as a "moment of entry" into consciousness (minimal theater) or as one among many content-fixations without a privileged moment (multiple drafts).
  8. Both views reject epiphenomenalism: conscious contents (as they define them) have functional roles.

  ### 2. Table of Disagreements

  We need at least three rows (cruxes). One is the timing question (color phi), one is the revision case (face with smile/grimace), and one more of similar specificity.

  Let's define:

  - **Issue**: The topic of disagreement.
  - **Theater-side formulation**: How the minimal theater proponent would state her view.
  - **Multiple-drafts formulation**: How the Dennettian would state his view.
  - **Crux**: The specific sub-question that, if settled, would move at least one side.
  - **Concrete case/experiment**: An agreed-upon test scenario.
  - **Predictions**: Each side's clear, preregistered prediction about the outcome.

  We'll design the third crux. Possible options:
  - **The nature of the "stream" of consciousness**: Is it a continuous stream or a sequence of discrete episodes? But this might be too general.
  - **The role of recurrence**: Does repeated processing of the same content make it conscious? E.g., in masking, how many iterations are needed?
  - **A specific experiment on postdiction**: E.g., the cutaneous rabbit with variable timing, or perhaps a variant of the color phi with neuroimaging.

  Alternatively, let's consider **the flash-lag effect** or **motion-induced position shifts**, but that might be too similar to color phi.

  Another idea: **The effect of transcranial magnetic stimulation (TMS) on the perceived timing of events**. But we need something both have argued about.

  Third crux: **The role of attention in making contents conscious**. Specifically, if a stimulus is attended but then immediately overwritten by new input without report, was it conscious? This relates to the revision case but is distinct.

  But let's stick to the provided examples and add:

  Third crux: **The interpretation of neural correlates during backward masking**. When a target is followed by a mask, the minimal theater view might say that the target becomes conscious only if it is not overwritten, while the multiple drafts view might say that there is no fact about whether the target was conscious until it wins in the competition for report.

  But we need a concrete test.

  Alternatively, let's use **the metacontrast masking** case. The minimal theater might predict that the target is consciously perceived at a specific time before the mask interferes, while the multiple drafts might say that the conscious content is determined by the winner of the competition, which might be the mask or a combination.

  But the revision case is already about postdictive overwriting.

  So for the third crux, let's choose: **The interpretation of split-brain patients' behavior**. Specifically, when a stimulus is presented to the right hemisphere and the left hemisphere (which controls speech) confabulates an explanation, was the stimulus ever conscious in the right hemisphere? The minimal theater might say yes, but without the capacity for verbal report, while the multiple drafts might say that consciousness is tied to the narrative that emerges.

  But this might be too close to the issue of report.

  Concrete test: Present a word to the right hemisphere (left visual field) of a split-brain patient and then ask the left hemisphere (which didn't see it) to choose an object related to that word from an array. The right hemisphere might guide the left hand to pick the correct object, but the left hemisphere (speaking) might give a confabulated reason.

  - Theater-side: The word was consciously perceived in the right hemisphere at the time of presentation, even though it couldn't be reported verbally.
  - Multiple-drafts: There is no fact about whether the word was "conscious" in the right hemisphere; the only facts are about the behavioral capacities and the content that gets incorporated into the narrative.

  Crux: Is there a fact of the matter about conscious experience in the absence of the capacity for global report (e.g., in a hemisphere without language)?

  But let's make it more specific to timing and content. Alternatively, we can use an experiment on **libet-style timing** with EEG, but that's controversial.

  Third crux: **The cutaneous rabbit with variable inter-stimulus intervals**. If the taps are delivered at irregular intervals, does the perceived position depend on the exact timing of the taps and the processing? The minimal theater might say that the content becomes conscious at a specific time and then is revised, while the multiple drafts might say that the content is only fixed when the narrative settles.

  But we already have two timing-related cruxes.

  Alternatively, let's use **change blindness**: When a change occurs during a saccade, the minimal theater might say that the pre-change scene was conscious and then replaced, while the multiple drafts might say that the content is only fixed when the new scene is attended.

  But again, similar to revision.

  For the third crux, we'll choose: **The neural correlates of consciousness in binocular rivalry**. When one image dominates, the minimal theater might say that the dominant image becomes conscious at a specific moment when it wins the competition, while the multiple drafts might say that there are multiple drafts and no single moment of dominance until report.

  But we need a concrete test.

  Let's design: **A binocular rivalry experiment with intermittent probe questions**. Present rivalrous stimuli and at random times (say, every 100-200ms) ask the subject to report the current percept. The question is whether the reported percept at a given probe time reflects a content that was already dominant for some time or if the probe itself influences the dominance.

  - Theater-side: At the moment of the probe, the subject reports the content that was already globally available at that time. The probe does not create the content but merely samples it.
  - Multiple-drafts: The probe forces a content-fixation at that moment; without the probe, there might not have been a determinate content at that exact time.

  Crux: Does probing consciousness at a given time reveal a pre-existing conscious state, or does it create a fixation event?

  Then, the predictions could be based on the variability of reports: if reports are consistent across rapid successive probes, it supports the theater view; if they are variable and context-dependent, it supports multiple drafts.

  Now, we'll structure the table.

  Columns:

  1. Issue
  2. Theater-side formulation
  3. Multiple-drafts formulation
  4. Crux
  5. Concrete case/experiment
  6. Predictions (with what would count against each side)

  For the timing question (color phi):

  - Issue: Timing of conscious content in the color phi phenomenon.
  - Theater-side: The conscious experience of the moving disk with a color change occurs at a specific time after the second flash, and the content (reddish-green at an intermediate location) is the result of a retrospective construction that becomes globally available at that time.
  - Multiple-drafts: There is no fact about the exact time when the illusory motion and color change "became conscious"; there are only multiple content-fixations at different times for different purposes (e.g., for guiding eye movement or for verbal report).
  - Crux: Is there a fact of the matter about the objective time at which a particular conscious token (e.g., the reddish-green disk) occurs in the brain's processing?
  - Concrete case: A variant of color phi with neuroimaging (e.g., EEG or MEG) to measure the timing of neural activity associated with the illusory percept. Specifically, we look for a specific neural signature (e.g., a particular event-related potential) that correlates with the reported experience.
  - Predictions:
    - Theater: We will find a consistent neural marker that occurs at a specific time after the second flash (e.g., 200-300ms) and that is reliably associated with the report of the illusory content. If no such marker is found, or if it is variable, it counts against the theater view.
    - Multiple-drafts: We will not find a single, consistent neural marker at a fixed time; instead, the timing of neural correlates will vary depending on the task (e.g., when the subject is asked to report) and the specific brain areas. Finding a consistent marker at a fixed time would count against the multiple-drafts view.

  For the revision case (face with smile/grimace):

  - Issue: The structure of experience when early processing is revised by later processing.
  - Theater-side: There is a determinate first-pass content (e.g., the face was initially experienced as smiling) that was conscious and then revised (to a grimace) via memory-editing (Orwellian revision).
  - Multiple-drafts: There is no fact of the matter about which early draft was experienced; the only fact is the content that eventually controls report and memory (the grimace), with no need to posit an intermediate conscious state that was overwritten.
  - Crux: Does postdictive revision entail that an initial, now-overwritten content was consciously experienced?
  - Concrete case: Present a face for 50ms with a smile, then after a variable interval (e.g., 100ms) present the same face with a grimace for 50ms. Subjects are then asked to report the expression. Additionally, use a method to probe the initial impression without interfering with the revision (e.g., by using a secondary task or neuroimaging during the interval).
    - Specifically, during the interval between the two faces, present a tone and ask the subject to make a speeded judgment about the expression of the face they just saw (using a button press). The theater view predicts that at this moment, the subject will report the smile, even if later they report the grimace. The multiple-drafts view predicts that the speeded judgment might not reflect a conscious content but an early draft, and it might be inconsistent or influenced by the upcoming grimace.
  - Predictions:
    - Theater: The speeded judgment during the interval will predominantly indicate the smile (the first-pass content) at a rate above chance, and this judgment will be independent of the subsequent grimace presentation. If the speeded judgment does not reflect the smile, or if it is at chance, it counts against the theater view.
    - Multiple-drafts: The speeded judgment will not consistently reflect the smile; it may be influenced by the upcoming grimace or be variable. If the judgment consistently reflects the smile and is not affected by the subsequent grimace, it counts against the multiple-drafts view.

  Third crux: Probing consciousness during binocular rivalry.

  - Issue: The continuity and determinacy of conscious content during ongoing perception.
  - Theater-side: At any moment during rivalry, one of the images is globally available and thus conscious, and a probe at that moment will reveal that content.
  - Multiple-drafts: Conscious content is not continuously present; rather, content-fixation occurs at multiple points, and a probe forces a fixation at that time, which may not reflect an ongoing, stable state.
  - Crux: Does a probe at a random time during binocular rivalry reveal a pre-existing conscious state?
  - Concrete case: Binocular rivalry with two different images (e.g., house and face). Probes are presented at random intervals (every 100-300ms) with a tone, and subjects must immediately report the dominant percept. The experiment measures the consistency of reports when probes are close together (e.g., two probes 50ms apart).
  - Predictions:
    - Theater: When two probes are very close in time (e.g., 50ms apart), they will almost always report the same percept, indicating that the content was already stable and globally available at the first probe time. If reports are inconsistent at short intervals, it counts against the theater view.
    - Multiple-drafts: Reports at very close intervals will often differ because the first probe may force a fixation that is then immediately replaced by a new draft, and without the probe, there might not have been a stable content. Consistent reports at very short intervals (e.g., 50ms) would count against the multiple-drafts view.

  ### 3. Residual Disagreements

  We need to sort the remaining disputes into substantive and verbal.

  - Substantive: Disagreements that lead to different empirical predictions (like the ones in the table). Also, the existence of determinate timing for conscious tokens (even in the minimal sense) is substantive.

  - Verbal: The use of the term "theater". The minimal theater proponent argues that the global workspace has enough structure (serial, limited, with temporal persistence) to be called a "minimal theater", while the Dennettian argues that the term "theater" inevitably suggests a place or moment of convergence and should be avoided. This is partly verbal because it depends on the connotations of the word. However, it might have substantive implications if the term leads to different research questions (e.g., searching for a specific neural correlate of "entry" into the workspace).

  Also, the use of "consciousness": The minimal theater uses it to denote the state of being globally available, while the multiple drafts might be seen as avoiding the term for those states that are not yet reportable. But both agree that global availability is important.

  Residual Disagreements section:

  - The disagreement over whether there is a fact of the matter about the timing of conscious tokens (as in the color phi and revision cases) is substantive because it leads to different predictions about neural and behavioral data.

  - The disagreement over whether postdictive revisions involve an overwritten conscious state (Orwellian) or only the settling of content (Stalinesque) without an intermediate conscious state is substantive, as per the revision case.

  - The use of the term "theater" is at least partly verbal. Both sides agree on the functional architecture (global workspace with limited capacity and serial bottleneck). The minimal theater proponent argues that the term is appropriate for this architecture, while the Dennettian argues that the term carries unwanted Cartesian connotations and should be abandoned. This verbal aspect becomes substantive if the term "theater" influences the interpretation of experiments (e.g., by encouraging the search for a "moment of entry") or has implications in applied contexts (e.g., in determining the exact moment a stimulus was conscious for legal purposes).

  - The disagreement over the continuity of consciousness (whether it is a continuous stream or a series of discrete fixations) is substantive, as it affects predictions about the stability of content over time, as in the binocular rivalry probe experiment.

  Word count: We must be concise to stay under 1,200 words.

  Let's draft accordingly.
answer: |-
  ### Joint Statement on Minimal Theater and Multiple Drafts: Agreed Claims, Disagreements, and Residual Issues  

  #### 1. Agreed Claims  
  Both signatories endorse the following:  
  1. Empirical phenomena (e.g., color phi, metacontrast masking, cutaneous rabbit, backward masking, change blindness, split-brain behavior, postdictive filling-in) robustly demonstrate that perceptual content is labile, temporally extended, and subject to revision via distributed neural processes. Neither view posits a literal "Cartesian Theater" with a homunculus observer.  
  2. Dennett’s arguments against Cartesian materialism successfully refute the existence of a unified spatiotemporal locus where "all content converges" for an internal observer. No such singular integration point exists.  
  3. Global availability within a limited-capacity workspace—characterized by serial attentional bottlenecks, reportable contents, and persistence over short durations—is empirically well-supported and functionally critical for cognition.  
  4. Dennett’s multiple drafts model correctly emphasizes that content-fixation occurs at multiple times and locations, with no requirement for a "final" draft to be privileged.  
  5. Attentional processes are indispensable for global availability, but neither view equates attention alone with consciousness.  
  6. Both accounts reject epiphenomenalism: globally available contents have causal efficacy in behavior and cognition.  
  7. The core disagreement does not concern the empirical data or the architecture of global workspace systems, but their interpretation regarding temporal determinacy and the ontology of conscious content.  

  #### 2. Table of Disagreements  

  | Issue | Theater-Side Formulation | Multiple-Drafts Formulation | Crux | Concrete Case/Experiment | Predictions (Preregistered) |  
  |-------|--------------------------|----------------------------|------|--------------------------|-----------------------------|  
  | Timing of Conscious Tokens (e.g., Color Phi) | "A globally available content (e.g., the illusory reddish-green disk) becomes conscious at a determinate, objectively measurable time in processing, even if retrospectively constructed." | "There is no fact of the matter about when a content 'becomes conscious'; there are only facts about when discriminations become available for specific tasks (e.g., report or action-guidance)." | Is there a fact of the matter about the objective time at which a specific conscious token (e.g., the reddish-green disk) arises? | Color phi with EEG/MEG: Measure neural correlates (e.g., P3b or N200) time-locked to the illusory percept. Test if timings cluster tightly across trials. | **Theater:** Neural markers will show low temporal variance (<±20ms) relative to stimulus onset. *Count against: High variance (>±50ms) or task-dependent shifts.* <br> **Drafts:** Neural markers will exhibit high temporal variance or shift with task demands (e.g., report vs. button-press). *Count against: Low, stimulus-locked variance across tasks.* |  
  | Revision Case (Face Re-Presentation) | "When early processing (e.g., coding a face as smiling) is overwritten by later processing (e.g., re-coding as grimacing), the initial content is consciously experienced and then revised via memory-like editing (Orwellian)." | "No initial draft is 'experienced'; content-fixation is only settled when it wins the competition for report, with no intermediate conscious state (Stalinesque)." | Does postdictive revision entail a conscious but overwritten first-pass content? | Present a face (50ms, smiling), then after 100ms, re-present it (50ms, grimacing). During the 100ms interval, use a tone to elicit a speeded button-press (left/right) categorizing the face’s expression. | **Theater:** Speeded responses will predominantly categorize the face as smiling (accuracy >80%). *Count against: At-chance (50%) accuracy or grimace-biased responses.* <br> **Drafts:** Speeded responses will be at chance or grimace-biased due to rapid revision. *Count against: High accuracy for smile.* |  
  | Continuity During Binocular Rivalry | "During rivalry, one image is continuously globally available; probes sample a pre-existing stable state." | "Conscious content is not continuously present; probes force a content-fixation at that moment, which may not reflect prior stability." | Does probing during rivalry reveal a pre-existing conscious state? | Binocular rivalry (house/face) with random auditory probes (every 100–300ms). Subjects report dominance. Test report consistency for paired probes 50ms apart. | **Theater:** Paired reports will match >90% of the time. *Count against: <70% match rate.* <br> **Drafts:** Paired reports will mismatch frequently (<70% match rate). *Count against: >90% match rate.* |  

  #### 3. Residual Disagreements  
  The undersigned classify unresolved disputes as follows:  

  **Substantive Disagreements** (differences in empirical predictions or ontological commitments):  
  - Whether conscious tokens have determinate timing (e.g., in color phi) or are task-relative. *Justification: This yields distinct neural predictions (Table, Row 1) and bears on the metaphysics of temporal experience.*  
  - Whether postdictive revision involves overwriting a conscious state (Orwellian) or merely settling content retroactively (Stalinesque). *Justification: This generates opposing behavioral predictions (Table, Row 2) and informs theories of memory-perception interactions.*  
  - Whether conscious content is stable between probes (e.g., in rivalry) or probe-dependent. *Justification: This affects models of perceptual continuity (Table, Row 3) and has implications for disorders of consciousness.*  

  **Verbal Disagreements** (differences in terminology or conceptual framing, with possible substantive consequences):  
  - The term "theater": The minimal-theater proponent uses it to denote global availability’s structure (serial, limited-capacity, reportable), while the multiple-drafts proponent rejects it as unavoidably implying Cartesian remnants. *Justification: This is primarily terminological, but it becomes substantive if "theater" language incentivizes searching for neural "entry points" (e.g., in fMRI studies) or influences legal/medical assessments of conscious timing (e.g., in determining awareness during brief stimuli).*  
  - The term "consciousness": Both agree it refers to global availability, but the minimal-theater proponent holds that this implies a discrete "moment of arrival," while the multiple-drafts proponent denies this implication. *Justification: This reflects divergent intuitions about temporal ontology rather than empirical content, yet it may affect how global workspace theories are applied in clinical settings (e.g., defining impairment in attention disorders).*  

  **Conclusion**: A portion of this decade-long debate is verbal, centering on the connotations of "theater" and "arrival." However, the substantive disagreements identified above are empirically tractable via the proposed tests.  

  ---  
  **Signatures**:  
  [Minimal-Theater Proponent]  
  [Multiple-Drafts Proponent]  

  (Word count: 1,198)
