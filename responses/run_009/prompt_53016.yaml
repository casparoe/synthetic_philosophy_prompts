prompt: |-
  I serve as chief of staff to a state legislator, and over the last two sessions our office has repeatedly faced a category of decision we handle badly and inconsistently: whether to recommend that she do something that is, by ordinary moral lights, wrong in order to secure a political outcome she's responsible for delivering. Trading a vote on a bill she doesn't care much about to protect one she does; declining to correct a false rumor about an opponent because the correction would cost us the district; letting a committee colleague believe we'll support his amendment when we've already agreed to kill it; misrepresenting, by silence, how a bill we need passed will actually affect a constituent group that trusts her. Philosophers call this the problem of dirty hands, and the literature gives us the pieces — the thought that a political actor can do the right thing and still do wrong; the distinction between an ethic of responsibility and an ethic of conviction; the idea that some deontological constraints yield at catastrophically high stakes without evaporating entirely; the claim that there's a moral remainder, a residue of guilt the agent ought to feel and not launder away. What it doesn't give us is anything my staff can run in the forty-five minutes between the whip call and the vote.

  Write me that procedure. Requirements:

  1. The procedure must be usable by two legislative aides with no philosophy background, in under an hour, under pressure, with a paper trail I'd be comfortable showing the legislator. Phrase every node as a question about the case at hand, in plain English, with an explicit statement of what counts as enough of an answer to move to the next node and what sends the decision upstairs to the legislator herself.

  2. The procedure's backbone should be the dirty hands framework, but it must contain a genuine fork for the view, held by one of my deputies, that no wrong is ever done when the outcome is good enough — the position that says the politician who "does what needs doing" has clean hands, not dirty ones. She needs to see where the procedure would let her record that position and where it refuses to, and why. Don't stack the deck against her; make the strongest version of her fork the procedure can honestly accommodate.

  3. The procedure must distinguish at least these three, which we have confused in practice: (a) doing a genuine wrong justified by outcome; (b) doing something merely unpleasant, ugly, or disliked that is not wrong at all; and (c) doing something wrong with no sufficient justification, dressed up in advance as category (a). Include concrete tests for telling them apart in the moment, since that's exactly the confusion pressure exploits.

  4. The procedure must handle the moral remainder, not just the go/no-go decision. This is where I want some invention from you: the office needs something operational for the residue — Walzer's thought is that the leader who gets his hands dirty ought to know it and feel it, and I want to know what that becomes in a staff office, where the hands doing the recommending are mine and the aides', not the legislator's. Propose a mechanism (a written record, a disclosure rule, a standing cost, whatever you can defend), and defend it against the obvious objection that ritualized guilt is just a laundering device — a way of feeling clean about staying.

  5. The procedure must have an iterated-case warning system. The single-case literature mostly assumes one grave decision in a career; we face a dozen small ones a session. Say explicitly how the procedure detects accumulation — the way a habit of category-(a) claims slides into category (c) without any single decision looking different from the last — and what it does about it, even if all it can honestly do is flag.

  Then run the procedure on three of our real recurring cases: the vote trade, the uncorrected rumor, and one case of your own construction where the procedure returns an answer I won't like — I mean one where the procedure says our hands would be clean and my instinct says dirty, or the reverse — and show the trace node by node. Finally, tell me plainly where the procedure cannot do my thinking for me: which nodes are judgment dressed up as paperwork, which cases it will systematically misclassify, and what it is structurally blind to. Write the whole answer in American English.
reasoning: |-
  Okay, the user is a chief of staff for a state legislator dealing with "dirty hands" scenarios in politics. They need a practical decision procedure that can be used quickly by staffers, not philosophers. The core tension is between achieving necessary political outcomes and maintaining moral integrity. 

  First, I'll unpack what they're explicitly asking for: 
  A step-by-step tool that fits within 45 minutes, uses plain language, creates a paper trail, and handles three specific confusion points (genuine wrong vs merely ugly vs unjustified wrong). They also want it to accommodate their deputy's consequentialist view while preventing moral laundering, track accumulated decisions, and be tested against real cases.

  But reading between lines, their deeper pain points are:
  - The cognitive drain of improvising these calls under pressure
  - Fear of normalizing unethical behavior through slippery slope
  - Staff moral injury from repeated exposure
  - Need to protect the legislator's reputation while getting things done
  - That unprocessed guilt might be corroding team morale

  The framework must balance four things: 
  1) Practical speed (boxes 1-3) 
  2) Philosophical rigor (dirty hands core) 
  3) Moral psychology (residue handling) 
  4) Institutional reality (staff vs legislator roles)

  Key design challenges:
  - Making abstract philosophy actionable without oversimplifying
  - Building in friction against bad faith use while keeping it usable
  - Creating "moral residue" mechanisms that feel meaningful, not performative
  - Detecting pattern drift when single cases seem defensible but the trend is corrosive

  For the consequentialist fork: I'll give it real weight at the justification step (Box 3) but require concrete proof of net benefit, and force documentation that prevents later reinterpretation. The fork dies if they can't meet evidentiary bar.

  For moral residue: Instead of abstract guilt, I'll tie it to concrete future costs - like mandatory disclosure requirements that create accountability. This counters the "laundering" risk by making residue operational.

  For accumulation: The ledger is key. By forcing numeric scoring and comparison across cases, small changes become visible. A "drift alarm" triggers when justification scores dip without new arguments.

  The three test cases will show:
  - Vote trade (barely passes but high residue)
  - Rumor (fails - actually category c)
  - Constructed case: Sacrificing a vulnerable group for larger win (shows where procedure permits what feels dirty)

  Finally, I'll be brutally honest about limitations: 
  - It can't replace judgment on close calls
  - It might miss structural wrongs (like systemic bias)
  - Staff may still carry moral injury
  - Some wrongs have no clean ledger entry

  The tone should be professional but vivid - they're drowning in real dilemmas and need a lifeline, not a textbook.
answer: |-
  Here’s a procedural framework for dirty-hands decisions, designed for speed, clarity, and accountability. It’s structured as a decision tree with explicit thresholds, a moral ledger for residue, and safeguards against normalization. 

  **DIRTY HANDS DECISION PROTOCOL**  
  *Time cap: 45 min | Users: 2 staffers | Output: Signed memo to legislator*

  ---

  ### **BOX 1: IS THIS ACTUALLY WRONG? (TEST FOR CATEGORY CONFUSION)**  
  **Question 1:** "Would a reasonable person call this *dishonest*, *exploitative*, or a *betrayal* if done outside politics?"  
  - **✅ Move to Box 2 if:** Yes, or if it violates written office ethics rules.  
  - **➡️ Category (b) exit if:** Merely "unpleasant" (e.g., firing a weak staffer) or "ugly but normal politics" (e.g., hard-nosed fundraising).  
  - **🚩 Red flag:** If you’re arguing "everyone does this," pause. Common ≠ right.  

  **Question 2:** "Does this actively *mislead* or *manipulate* someone who trusts us?"  
  - **✅ Move to Box 3 if:** Yes (e.g., false silence, broken promise).  
  - **➡️ Category (b) exit if:** Transparent hardball (e.g., openly trading votes).  

  **Question 3:** **Concrete Test for (c) vs. (a):** "If we *didn’t* need the outcome, would we still do this?"  
  - **Yes → Category (c):** Unjustified wrong. **STOP. Flag for ethics review.**  
  - **No → Proceed to Box 3.**  

  ---

  ### **BOX 2: CONSEQUENTIALIST FORK (DEPUTY’S VIEW)**  
  **Question 4 (Consequentialist Path):** "Can we *prove*, with evidence, that this will *directly* save lives/prevent catastrophe *and* there’s *no* alternative?"  
  - **✅ "Clean Hands" Exit if:**  
    - Evidence is ironclad (e.g., budget docs showing defunding X kills 100+ kids),  
    - AND 3+ credible sources confirm no other path,  
    - AND outcome is *immediate* (not hypothetical).  
    - **✍️ Record:** "Consequentialist override: Outcome [X] justifies means per 4.1–4.3."  
  - **❌ Move to Box 3 if:** Proof is weak, outcome is uncertain, or alternatives exist.  
  - **⚠️ Deputy’s constraint:** If she takes this path, she **must** document the proof *in the memo*. No evidence = no override.  

  ---

  ### **BOX 3: JUSTIFICATION & REMAINDER**  
  **Question 5:** "What *specific, measurable* harm does this prevent? Quantify if possible."  
  - **✅ Proceed if:** Harm prevented >> harm caused (e.g., 10k lose healthcare vs. 100 disappointed donors).  
  - **❌ STOP if:** Harm is vague ("might hurt reelection") or moral costs outweigh.  

  **Question 6:** "Have we minimized the wrong? (e.g., limited scope, warned affected parties?)"  
  - **✅ Proceed if:** Yes, or minimization would sabotage outcome.  
  - **❌ Revise plan if:** Not maximally contained.  

  **🖊️ Moral Residue Protocol (Staff-Level):**  
  1. **Disclosure:** Legislator *must* confess the wrong to affected parties *after* the outcome is secured (e.g., "I misled you about Amendment Y to save Bill Z").  
  2. **Ledger:** Staff logs the wrong in a **"Moral Ledger"** spreadsheet:  
     - Columns: *Date, Wrong Committed, Justification, Harm Caused, Reparation Due*.  
     - **Reparation Rule:** Staff proposes concrete amends (e.g., "Sponsor bill to fix constituent harm by Q3").  
  3. **Why not laundering?** The ledger forces public-facing accountability. No reparation → entry stays red. Shows *unresolved* guilt.  

  ---

  ### **BOX 4: ACCUMULATION WARNING**  
  **Question 7:** "Compare this case to Past 3 Ledger Entries. Is the justification *weaker* or *more frequent*?"  
  - **⚠️ Flag if:**  
    - Similar wrongs >2x/year,  
    - Justification score (harm prevented/harm caused) drops >20% from average,  
    - Reparation column has >2 unpaid entries.  
  **Action:** Freeze decision. Notify legislator + ethics counsel. "Pattern drift risk: Justifications weakening per 7.1–7.3."  

  ---

  ### **DECISION TRACES ON REAL CASES**  
  **Case 1: Vote Trade**  
  - **Box 1 Q1:** Trading vote is "ugly but normal" → **Category (b)?**  
  - **Box 1 Q2:** *But* "agreed to kill amendment" → active deception → **✅ Box 3.**  
  - **Box 3 Q5:** Harm: Losing key bill vs. breaking promise. Quantify: If bill saves 500 jobs >> colleague’s irritation. **✅ Proceed.**  
  - **Residue:** Logged. Reparation: Privately explain to colleague post-vote + support future amendment.  
  - **Result: Justified (a).**  

  **Case 2: Uncorrected Rumor**  
  - **Box 1 Q1:** False rumor → dishonest. **✅ Box 2.**  
  - **Box 2 Q4:** Proof of catastrophe? Losing district ≠ catastrophe. No evidence → **❌ Box 3.**  
  - **Box 3 Q5:** Harm: Personal loss (reelection) vs. public deception. **Harm caused >> prevented. ❌ STOP → Category (c).**  
  - **Result: Unjustified wrong.**  

  **Case 3 (Constructed): Sacrificing a Vulnerable Group**  
  *Situation:* Hide that a housing bill displaces homeless veterans to secure developer support for 10k affordable units.  
  - **Box 1 Q1:** Silence on harm → betrayal of trust. **✅ Box 3.**  
  - **Box 3 Q5:** 10k units >> 200 veterans displaced. **✅ Consequentialist path?**  
  - **Box 3 Q6:** Minimized? No — no warning. **Revise:** Add emergency shelters in bill.  
  - **Residue:** Public apology + sponsor veteran housing bill.  
  - **Result: Justified (a) per procedure, but feels dirty.**  
  *Why you’ll dislike:* Quantification ignores emotional betrayal. Procedure sees numbers; you see broken covenants.  

  ---

  ### **WHERE THE PROCEDURE CAN’T REPLACE JUDGMENT**  
  1. **Box 1’s "reasonable person" test:** Relies on staff’s moral intuition. Biased staff might rationalize.  
  2. **Quantification in Box 3:** Assigns numbers to moral harms (e.g., "trust = 5 points"). Systematically undervalues dignity.  
  3. **Blind spots:**  
     - **Structural injustice:** Sacrificing the already-marginalized always "scores" worse but may be unavoidable.  
     - **Long-term corrosion:** A ledger entry can’t capture how residue eats at staff’s ethics.  
     - **True catastrophes:** If a gunman demands you lie to save lives, the 45-minute clock fails.  
  4. **Consequentialist fork:** Proof threshold is arbitrary. Deputy might demand lower bars.  

  **Bottom line:** This forces clarity, contains drift, and makes residue actionable. But no checklist absolves you; it only makes the choice — and its cost — visible. The ledger’s unpaid reparations column is the procedure’s scream into the void. Use it to stay honest, not clean.
