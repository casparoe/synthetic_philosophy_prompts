answer: |-
  ### Luring Lottery Classroom Simulation  
  **Objective:** Explore the tension between individual rationality (Nash equilibrium) and collective optimality in a "Luring Lottery" where the prize is split among entrants, but only one wins. Test effects of communication, commitments, and incentives.

  **Game Rules:**  
  - Prize = 100 points.  
  - If \( k \) entrants: Each entrant receives \( \frac{100}{k} \) points. Winner is randomly drawn but irrelevant to payoffs.  
  - Non-entrants receive 0.  
  - **Nash Equilibrium:** All enter (each gets \( \frac{100}{14} \approx 7.14 \) points).  
  - **Collective Optimum:** Exactly one enters (winner gets 100; others get 0).  

  **Setup:**  
  - 14 students, seated to minimize peer pressure.  
  - **Materials:** Decision slips (ENTER/NOT ENTER), whiteboard for results, timer.  
  - **Payoffs:** Points recorded cumulatively per student (no real money). Announce: "Maximize your own points."  

  ---

  ### Minute-by-Minute Timeline (75 minutes total)  
  #### **0–10 min: Introduction & Rules**  
  - **Facilitator:**  
    - Explain game rules, payoffs, and paradox ("Everyone *should* enter, but one entrant is best overall").  
    - Clarify: "Each round is independent. No talking except during Round 3."  
    - **Candid gap note:** *"In real life, this is a one-shot anonymous game. Here, you know each other and play repeatedly—this might ease coordination. We’ll discuss later."*  

  #### **10–20 min: Round 1 (Baseline – No Communication)**  
  - Distribute decision slips.  
  - Students privately choose ENTER or NOT ENTER (1 min).  
  - Collect slips, calculate entrants (\( k \)), and announce:  
    - "\( k \) entered. Each entrant gets \( \frac{100}{k} \) points. Non-entrants: 0."  
  - Record results on board (e.g., "Round 1: 12 entrants, 8.3 pts each").  

  #### **20–30 min: Round 2 (Baseline Repetition)**  
  - Repeat Round 1.  
  - **Facilitator:** "See if you adjust based on Round 1."  
  - Announce results.  

  #### **30–45 min: Round 3 (Public Non-Binding Commitments)**  
  - **Step 1: Commitment Phase (5 min)**  
    - Students publicly declare intentions (e.g., "I will NOT ENTER").  
    - **Emphasize:** "Commitments are non-binding—you can change your mind privately."  
    - Facilitator records commitments on board (optional anonymity: numbers only).  
  - **Step 2: Decision Phase (5 min)**  
    - Private decisions as before.  
  - Announce results.  
  - **Facilitator note:** *"Real-world commitments lack enforcement—observe if ‘cheap talk’ builds trust."*  

  #### **45–60 min: Round 4 (Entry Fee/Side-Payment)**  
  - **New Rule:** Entry fee = 10 points. Entrants pay fee *before* prize split:  
    - Entrant payoff: \( \frac{100}{k} - 10 \)  
    - Non-entrants: 0  
  - **Facilitator:** "Fee reduces entrant payoffs. Does this incentivize cooperation?"  
  - Private decisions (1 min), collect, and announce results.  

  #### **60–75 min: Debrief & Discussion**  
  - **Map results to concepts (use whiteboard data):**  
    - **Nash reasoning:** "Did we trend toward all entering? Why is entering a dominant strategy?"  
    - **Superrationality:** "Did anyone think, ‘If we all do the same, what’s best?’"  
      - Superrational choice: All abstain? (Pays 0) vs. all enter? (Pays 7.14). Neither achieves one entrant.  
      - *"Is superrationality rational? Or disguised altruism?"*  
  - **Analyze devices:**  
    - **Commitments (R3):** Did declarations reduce entries? Why did/didn’t it work? (Non-binding → betrayal risk).  
    - **Entry fee (R4):** Did fewer enter? Fee worsens Nash payoff (7.14 → -2.86 if all enter) but doesn’t change equilibrium—discuss why.  
  - **Critical questions:**  
    - "Can a group of rational agents achieve the collective optimum without enforcement? Why/why not?"  
    - "Is superrationality a *refinement* of rationality (e.g., assuming symmetry) or group-thinking altruism?"  
  - **Limitations recap:**  
    - Classroom ≠ real world: Repeated play, face-to-face interaction, and small size inflated cooperation chances.  
    - In one-shot anonymous settings, communication/fees rarely overcome the dilemma.  

  ---

  ### Expected Outcomes & Teaching Insights  
  - **Baseline (R1–R2):** Likely high entry rates (11–14) → Nash equilibrium emerges.  
  - **Commitments (R3):** Possible dip in entries if trust forms, but defections likely.  
  - **Entry Fee (R4):** May slightly reduce entries (psychological effect), but equilibrium holds.  
  - **Key Insight:** Devices fail without enforcement. Superrationality may *feel* rational but conflicts with individualism.  

  **Why this works:** Students experience the dilemma viscerally, setting up deep debrief on rationality, coordination, and institutional design.
