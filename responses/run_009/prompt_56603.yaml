prompt: |-
  I write novels for a living and somehow got roped into running a ninety-minute session at a writers' retreat on what emotions actually are -- like, philosophically. The hook is that it matters for us practically: if you believe an emotion is basically a judgment (a way of thinking about the world, like "this dog is dangerous" that happens to come with heat attached), you'll write fear one way, as the character's appraisal leaking into their body. If you think an emotion is more like a perception (the body's read on a situation, which can be accurate or off, the way your eyes can be fooled), you'll write it another way, closer to how you'd write a character seeing something. And if it's basically just a feeling-state, raw and non-representational, that's a third kind of scene entirely. So the three-way fight -- judgment theories, perceptual theories, pure feeling theories -- is the thing I want to get across to about fifteen fiction writers, none of whom have read any philosophy since maybe one intro course twenty years ago.

  But I don't want you to just explain the theories to me. I want a teaching plan. Concretely: what has to go first in the ninety minutes and why (I suspect you can't do perceptual theories before judgments, but I'm honestly not sure), what single carrying example I should build the whole session around -- and here's a constraint, it should be an emotion that a novelist would plausibly have to write, so maybe not the usual fake examples, though tell me if a fake example does some job a realistic one can't. The example needs to be rich enough that all three theories can get a grip on it and yield different writing advice, and ideally it should have some structure that makes the theories visibly disagree rather than just redescribe the same thing in different words.

  Then the misconceptions. I can already predict one: my crowd will hear "emotions are judgments" and think I mean emotions are deliberate or conscious, that the character decides to be afraid, and the room will revolt because that's obviously wrong -- so I need to know exactly where in the sequence to block that off. Another one I'm worried about is people treating "perception" as meaning the emotion is always of something out in the world, and then getting stuck on things like shame or nostalgia where it's murky what's even being perceived. There's also the classic puzzle of recalcitrant emotions -- being afraid of flying while fully believing it's safe -- which is actually the reason I got interested in this, because that's precisely the kind of character moment we're always trying to render, but I don't know whether that puzzle should come early as the hook or late as the payoff, and I suspect it's load-bearing for the order of everything else.

  I'd also like a check I can do at the end, some exercise or question where the writers show me they can now think in terms of the three theories instead of just nodding along -- ideally something that forces them to make a writing choice they couldn't have articulated a reason for at the start.

  And tell me what to flat-out refuse to cover in ninety minutes, because I know myself, I will try to cram in the mind-body stuff and the whole question of whether AI characters in fiction could "really" have emotions, and someone will bring up that one novel where the character can't feel anything and I'll lose forty minutes. What do I explicitly park for another session, and do I say so upfront or just quietly cut it?

  One formatting thing: whatever you write back, please keep it as plain continuous prose, no bullet points, no headers, no bold or tables -- I want to read it like a long letter, not skim a powerpoint. And it's fine to be a bit rough, I'd rather have your actual thinking than something polished into shapelessness.

  (Apologies for typos, I'm scribbling this on the train.)
reasoning: |-
  Okay, the user is a novelist preparing a 90-minute session on emotion theories for fellow writers. They need a practical teaching plan centered on three philosophical views: judgment, perceptual, and feeling theories. The goal is to show how each theory influences writing choices. 

  Hmm, they've clearly wrestled with this themselves—mentioning recalcitrant emotions (fear of flying despite knowing it's safe) as a key puzzle. That's smart; it's exactly where the theories clash visibly. Their worries about misconceptions are spot-on too. Writers will absolutely misinterpret "judgment" as deliberate if not preempted. 

  First, sequencing matters. Can't start with perception theories because they lean on judgment concepts (the "danger" appraisal). Must clarify judgment ≠ conscious choice upfront. The fear-of-dog example works—it's visceral, familiar, and lets me show how "danger!" judgment lives in the body. Recalcitrant emotions should come later as the payoff; too early and it muddies the basics. 

  For the core example... shame? Too self-referential. Nostalgia? Too diffuse. Fear of flying is perfect—it's novelistically rich, involves bodily tension (white knuckles), clashes with belief ("stats say safe"), and all three theories handle it differently. Judgment theory calls it a conflict between judgments, perceptual says the body "sees" threat, feeling theory just gives raw panic. 

  Biggest pitfall: writers will try to debate AI emotions or clinical numbness. Must explicitly ban those upfront. Save for another session. 

  End with a choice exercise: write a character feeling envy three ways. Forces them to apply theories practically. If they can articulate why judgment-theory envy needs a rival's success appraisal, while feeling-theory is just acid-in-veins sensation—that's the win. 

  Time allocation: 15 min intro/hook, 25 min judgment, 20 min perception, 15 min feeling, 15 min exercise. No wiggle room. Cut tangents with "parking lot" list on a flipchart. 

  Their anxiety about philosophical jargon is valid. Must translate "representational" as "does it point to something?" and "non-conceptual" as "pre-verbal." Show, don't explain. 

  ...And never say "Stoic cognitivism." Just call it "judgment-first."
answer: |-
  Here’s how I’d structure your ninety minutes, grounded in practicality for novelists and designed to sidestep the pitfalls you’ve anticipated. Think of it as a guided exploration where the writers actively discover the theories through their craft instincts, rather than being lectured at.

  **Start with the Hook & the Core Example (First 10 mins)**  
  Open with the recalcitrant emotion you love: fear of flying. *"Imagine your character white-knuckling their armrest during turbulence. They know the stats: flying is safer than driving. They’ve read the engineering specs. Their rational mind believes it’s safe. Yet their heart hammers, their palms sweat, and they’re convinced the wing is buckling. How do you write that disconnect?"* This hooks them immediately because it’s a *writer’s problem* – they’ve all wrestled with rendering such moments. It also establishes why philosophy matters: each theory explains this clash differently, leading to different writing choices. Avoid defining theories yet. Let the tension simmer.

  **Judgment Theory First (25 mins total: 15 explanation + 10 exercise)**  
  *Why first?* It’s the most intuitive bridge from thought to feeling for writers. Start by reframing the flying fear: *"One view: emotions *are* judgments. Fear *is* the judgment ‘this is dangerous’. Not a feeling that follows the thought – the feeling *is* that thought, experienced bodily."* Crucially, **immediately block the misconception:** *"This isn’t conscious deliberation. It’s automatic appraisal. Think of jumping at a sudden shadow. Your body screams ‘threat!’ before your conscious mind labels it ‘just a coat’. The judgment is fast, often subconscious, but it’s still *about* the world – ‘that shadow is dangerous’."* Use "appraisal" instead of "judgment" if helpful, but stress it's *evaluative thinking*.  

  *Exercise:* "Write 2-3 sentences of a character becoming afraid of a stranger on a dark street using *only* the judgment lens. Show the appraisal leaking into the body. How does the world look *through* the fear-judgment? (e.g., *'The man’s casual stride wasn’t casual; it was a predator’s glide. Each footfall measured the distance to her. Safety was five steps too far.'*)"

  **Perceptual Theory Next (20 mins total: 10 explanation + 10 exercise)**  
  *Why now?* It builds on judgment but shifts focus. *"Another view: emotions are like perceptions. Your gut *feels* the danger directly, like your eyes see the shape. It’s the body’s readout, which can be accurate (real threat) or inaccurate (fear of flying). It’s not *thinking* ‘this is dangerous’; it’s *sensing* danger, the way you sense heat or a sour smell."* Address the misconception head-on: *"But what about shame? Or existential dread? Perception doesn’t always mean ‘out there’. You perceive your *own* failure in shame, or the uncanniness of existence in dread. It’s about the body registering *meaning* – often before your rational mind catches up."* Contrast with judgment: Judgment = *thinking* "dangerous". Perception = *feeling* the danger-signal itself.

  *Exercise:* "Rewrite the street fear scene, but now the fear is purely perceptual. Focus on the raw bodily sensation *as* information. How does the world feel *through* the fear-perception? (e.g., *'The air thickened between them, turning syrupy with menace. The streetlights dimmed, funnelling the darkness towards his silhouette. Her pulse thudded a warning against her ribs: *too close, too close.*')"

  **Feeling Theory Last (15 mins total: 8 explanation + 7 discussion)**  
  *Why last?* It’s the hardest to distinguish from "just description" and the least intuitively tied to meaning for writers. *"The third view: emotions are raw feeling-states. Heat, pressure, churning, buzzing – patterns of bodily sensation without inherent meaning. The ‘aboutness’ (fear *of* flying, shame *about* failure) comes from our interpretation *later*, not the feeling itself."* Stress the difference: Judgment = thought-as-feeling. Perception = sensation-as-information. Feeling = pure sensation *before* meaning. *"This isn’t just ‘weak writing’. It’s crucial for overwhelming, inchoate moments – panic attacks, sudden grief, euphoria. The meaning hasn’t formed yet."*  

  *Discussion (not exercise yet):* "How would pure feeling change the flying fear? Or the street scene? What gets lost? What’s gained? (e.g., flying: *'A cold wire spooled tight in her chest. Static filled her ears. The world narrowed to the shuddering plastic under her fingertips.'* Street: *'Ice flooded her veins. Her breath hitched, sharp and shallow. Muscles coiled, ready to spring – but where?')*"

  **The Clash & Payoff: Recalcitrant Emotions Revisited (10 mins)**  
  Return to the flying fear. *"Now apply each lens to the disconnect:*
  1.  *Judgment:* Two clashing judgments! The conscious mind judges safety ("Stats prove it"), but the automatic survival system *still* judges danger ("This noise = death").
  2.  *Perception:* The body misperceives. It *feels* the threat-signal (turbulence, noise) as catastrophic danger, even though the mind knows it's not.
  3.  *Feeling:* Raw panic-sensations erupt. The mind tries (and fails) to interpret them rationally as 'safe'. The sensations just *are*."  
  This shows the theories aren't just renaming the same thing. They diagnose the *source* of the conflict differently, offering distinct paths into the character's experience.

  **The Check: The Choice Exercise (10 mins)**  
  **Introduce a new emotion: Envy.** *"Pick one:*
  1.  *Write envy as judgment:* Show the appraisal leaking into the body. What does the character *think* (consciously or not) that *is* the envy? (e.g., *'Her success wasn't just talent; it was a spotlight stealing the light from everything I'd ever done...'*)
  2.  *Write envy as perception:* Show the bodily sensation *as* the perception of unfairness/loss. How does the world feel through envy's lens? (e.g., *'The trophy on her shelf pulsed like a stolen sun. The air around her achievements tasted metallic, bitter.'*)
  3.  *Write envy as feeling:* Describe the raw, non-representational sensations. Avoid implying *why* they feel it. (e.g., *'A sour heat prickled behind her eyes. Her jaw clenched until the muscle jumped. Something heavy and cold settled in her gut.')*  
  Crucially, **ask them to articulate *why* they made the choices they did in their snippet, linking it back to the theory.** This forces application, not just recognition.

  **What to Ruthlessly Cut (Announce Upfront!)**  
  *"In 90 mins, we can't cover:*
  1.  *The mind-body problem (Is emotion just brain chemistry?)*
  2.  *AI, robots, or truly non-human emotion in fiction.*
  3.  *Clinical conditions like anhedonia (inability to feel) – fascinating, but a deep dive.*
  4.  *Historical debates (Aristotle vs. Descartes vs. James).*
  *We’re focusing *only* on these three modern frameworks for *rendering* recognizable human emotion in prose. If we stray, I’ll park it for later!"* Write "Parking Lot" on a flipchart. Stick to it.

  **Why This Sequence Works**
  1.  **Hook First:** Recalcitrant emotion creates immediate need-to-know.
  2.  **Judgment First:** Most accessible, bridges cognition and feeling. Misconception blocked *immediately*.
  3.  **Perception Next:** Builds on judgment, clarifies "aboutness" misconception using bodily focus.
  4.  **Feeling Last:** Contrasts sharply with the "aboutness" of the first two, avoids confusion.
  5.  **Recalcitrance as Payoff:** Shows the *value* of the distinctions.
  6.  **New Emotion Check:** Forces application, reveals understanding.
  7.  **Explicit Boundaries:** Prevents derailment. Announcing them upfront gives you permission to steer back.

  **Your Core Example:** **Fear of Flying** works perfectly. It’s relatable, involves clear bodily sensation (white knuckles, sweat), involves a clash with belief (recalcitrance), and isn’t overly simplistic. A "fake" example (philosopher’s favorite: fear of a slime in a drawer) risks disengagement. Stick with flying or the dark street – things writers *actually* write.

  **Final Tip:** Constantly link back to *writing*. "So, if you buy this view, how would you show jealousy in a scene? What details become crucial? What internal monologue fades?" Make the philosophy serve the craft, always. Good luck – it sounds like a fascinating session!
