      But that uses labels.

    Given the constraints, I will describe a tree in continuous prose that uses the cases and hope to cover as much as possible, noting where the tree has limitations.

    Final tree in prose:

    Start by considering the dog case: two spouses each privately intend that we walk the dog, each expecting the other to do it, and by coincidence the dog gets walked once. Do you think this is a case of the spouses walking the dog together? If you answer yes, then your view aligns with the reductive or summative view, which dissolves joint actions into patterns of individual intentions and actions that happen to mesh. If you answer no, then you believe that joint action requires more than this, and we move to the next question.

    Now consider the corporation case: every employee acts from private intentions that happen to mesh in a way that results in the internal memo being buried, and no single employee intends the burying. Do you think the company decided to bury the memo? If you answer yes, then you are led to the group-agent realism of List and Pettit, which holds that some collectives are themselves intentional agents over and above their members. If you answer no, then we move to the next question.

    Next, think about the fence case: the four households repaint the shared fence each spring with no agreement, each showing up because the others do, and each would feel let down if the others didn't participate. Do you think they are repainting the fence together? If you answer no, then we have a combination of answers that isn't well captured by the standard accounts we've studied; it might be that you require explicit agreements or a higher degree of organization for joint action, which is a coherent but perhaps less explored position. If you answer yes, then we move to the next question.

    Now consider the walking case: two people are walking together, and one of them wants to stop. Do you think that she can simply decide to stop on her own, or is she obligated to account to the other for stopping? In other words, is she in some way answerable to the other for continuing the walk? If you believe she is answerable to the other (obligation exists), then we move to one branch; if not, then another.

    For those who said there is an obligation in the walking case, we ask about the duet case: two singers perform a duet, but one is only mouthing the words while a recording does the work, and the audience is none the wiser. Do you think they are singing the duet together? If you answer yes, then this combination (obligation in the walking case and yes in the duet) isn't occupied by any of the standard accounts; it might be that you think obligations can exist even when one participant is deceptive, which could be coherent but is not a view we've studied. If you answer no, then you are aligned with Margaret Gilbert's view, which emphasizes joint commitment and the obligations it creates, and which would not count the duet as genuine joint action because of the lack of commitment from the faker.

    For those who said there is no obligation in the walking case, we ask the duet case: do you think the duet is being performed together? If you answer yes, then we need to distinguish between two possibilities. We then ask: in the fence case, is the feeling of being let down (if others don't show) explained by the individuals having intentions that are directly about the group (such as "we intend to repaint") or rather by each having intentions about their own actions and expectations about the others (e.g., "I intend to repaint because I expect you to")? If you think the intentions must be about the group, then you are close to John Searle's appeal to we-intentions. If you think it is sufficient to have interlocking individual intentions, then you are close to Michael Bratman's interlocking-intentions account. If you answered no to the duet case (no obligation in walking and not joint in duet), then you might be aligned with Raimo Tuomela's account that distinguishes between the I-mode and the we-mode; in this case, the fence case might be in the I-mode, which doesn't require strong group commitments, and the duet fails because the faker is not genuinely participating even in the I-mode.

