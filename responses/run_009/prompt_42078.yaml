  Let's begin at the root commitment: everyone here accepts that there’s a genuine difference between two people each mowing their own half of a lawn side by side and two people mowing the lawn together—the latter involves a "togetherness" that isn’t reducible to mere coincidence. Now, to diagnose your underlying account, we’ll walk through a series of cases. Answer each question honestly, based on your intuitive judgment about what constitutes joint action, not what you recall from the readings.  

  First, consider the dog case: two spouses each privately intend that we walk the dog tonight, each expecting the other to do the actual walking, and by chance these intentions mesh so the dog is walked exactly once. Do you believe the spouses walked the dog together? If yes, your view aligns with the reductive or summative account, where joint action dissolves into overlapping individual intentions—even if meshed, there’s no robust "we." This path ends here. If no, joint action requires more than coinciding intentions, so we proceed.  

  Next, the corporation case: every employee acts from private intentions that mesh to bury an internal memo, but no single person intends the burying. Do you agree that the company decided to bury it? If yes, you’re drawn to group-agent realism (List and Pettit), where the collective itself is an intentional subject beyond its members. This leaf is terminal. If no, we move forward.  

  Now, the fence case: four households repaint the shared fence each spring with no agreement; each shows up because others do, and each would feel let down if others didn’t participate. Is this a joint action? If no, this combination—rejecting the dog case, corporation case, and fence case as joint—isn’t occupied by our surveyed accounts. It might be a strict individualist view requiring explicit negotiation, but it’s largely unexplored in our readings and risks incoherence by denying intuitively collective scenarios. If yes, the fence case qualifies as joint, so we continue.  

  Proceed to the walking case: two people are walking together, and one wants to stop. Must they do more than decide alone to stop? That is, are they answerable to the other—e.g., ought they to announce, justify, or seek agreement? If no, there’s no inherent obligation; stopping is individual. If yes, they owe the other something, implying shared responsibility.  

  For those who said no obligation in the walking case, we turn to the duet case: two singers perform a duet, but one silently mouths words while a recording sings, unbeknownst to the audience. Is this a genuine duet? If yes, your view prioritizes external perceptibility over internal commitment. If no, the faker’s insincerity invalidates the jointness.  

  Now, if you said no obligation in walking and yes to the duet, this path converges on Searle’s account: we-intentions (individual minds with collective content) are primitive, so the duet’s outward "togetherness" suffices despite one singer’s deceit. If you said no obligation and no to the duet, you’re with Bratman: joint action requires interlocking intentions (each intends "we J") and mutual responsiveness, so the duet fails without real-time coordination.  

  For those who said yes to obligation in the walking case, we revisit the dog case. Given you earlier rejected the dog case as joint action (at the start), now ask: why does it fail? Is it because both spouses lacked awareness of the other’s intention? If yes, you’re with Tuomela: joint action demands operating in the "we-mode," where intentions are group-focused and mutually known, unlike the private dog case. If no—i.e., the dog case fails for reasons beyond mutual unawareness—this branch (obligation in walking plus this answer) isn’t clearly occupied; it might reflect an overlooked hybrid view.  

  Finally, for those who said yes to obligation in walking and haven’t yet terminated, consider the duet case again. If you say the duet isn’t joint due to the faker’s insincerity, you’re with Gilbert: joint commitment creates mutual obligations, so the duet’s deception breaches the commitment. If you say the duet is joint despite the faker, this position is unoccupied—Gilbert and Tuomela require sincerity, while others don’t impose such obligations.  

  The tree ends here. Some leaves are shared: Searle’s and Bratman’s accounts both emerge from the "no obligation" path in the walking case, distinguished by the duet case. Adjacent leaves—like Gilbert and Tuomela—might blur; both demand mutual awareness and commitment, but Tuomela’s we-mode could be prised apart by a case testing group reasons versus normative obligations. The reductive view and group-agent realism stand apart early. The unoccupied positions arise from under-explored combinations (e.g., obligation without sincerity) or strict individualism rejecting multiple cases. Use this to spark discussion: How do your answers map to theorists you thought you favored?
