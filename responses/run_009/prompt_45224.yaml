prompt: |-
  I should say up front that I spent forty years in radio astronomy — pulsar timing, mostly — before retiring, and that I have spent the years since reading philosophy of science with a small group. A puzzle from that group is what I want your help with. Please take the role of an expert philosopher of science, think carefully, and begin with some brainstorming: lay out the candidate rules you can see before you apply any of them to the new cases.

  One member of our group, a retired virologist and by far our most committed Popperian, has been issuing rulings on whether a given theory counts as scientific. Her track record so far:

  - Einstein's general relativity as it stood in 1915, before any of the classic tests had been performed: scientific.
  - Freudian psychoanalysis: not scientific.
  - Hoyle's steady-state cosmology as it was still being defended in 1960: scientific — even though she knows perfectly well it eventually lost to the Big Bang.
  - Lysenko's account of the inheritance of acquired characteristics: not scientific.
  - The popular evolutionary-psychology habit of explaining whatever mating pattern turns up, always after the fact: not scientific.
  - Newspaper horoscope astrology: not scientific.

  She has promised rulings next month on three further cases, and I would like to predict them in advance:

  1. A grand-unification-style model that predicts proton decay, but with a mean lifetime around 10^39 years — so that the predicted decays could not plausibly be seen by any detector anyone could build.
  2. A modification of Einstein's equations that departs from general relativity only in gravitational waves below about 10^-5 Hz, frequencies at which detection would require an interferometer with a baseline wider than the Earth–Sun distance.
  3. A model from my own field: a few years ago it predicted a characteristic irregularity in the arrival times of millisecond pulsars; when the decade-long datasets came in and showed nothing, its proponents introduced what they call a "dark wind" of particles whose density they are free to set as they please, so that the model can now be made to fit any data at all — though on paper the original version remains falsifiable.

  What I would like from you: first, the rules that fit her track record. I can make a rough guess at two of them — something like falsifiability in principle, and something like issuing risky predictions that can be checked with instruments available in the near term — and I suspect her astrology ruling points to a third that has to do with how proponents behave once refuted. For each rule you consider, tell me what it predicts for each of the three cases; then give your best guess for each case, with your reasons; and finally, tell me which further case, if she were to rule on it, would best tell the rival rules apart. One observation to weigh as you go: her steady-state ruling suggests that for her, "scientific" and "correct" have come apart entirely, so rules that turn on whether a theory is currently believed or currently confirmed are probably not what she is running. For my part, the three predictions matter less than the reasoning that connects her track record to them.
reasoning: |-
  Okay, the user presents an interesting puzzle from their philosophy of science group. They've described a Popperian virologist who makes rulings on what counts as scientific, with six clear examples. Now they want to predict how she'd rule on three new cases and understand the underlying rules she's using. 

  First, I need to unpack the virologist's track record. Her rulings show a clear Popperian bias - she values falsifiability but with nuances. GR in 1915 was falsifiable in principle despite no immediate tests. Freudian psychoanalysis likely fails because it can explain anything post-hoc. Steady-state cosmology in 1960 was still testable even if ultimately wrong. Lysenkoism probably couldn't be properly falsified due to political interference. Evolutionary psychology explanations sound like just-so stories. Newspaper astrology is vague and unfalsifiable.

  Hmm... the key seems to be that for her, "scientific" and "correct" are separate - she called steady-state scientific even though it was wrong. So current confirmation status doesn't matter. 

  Now for the candidate rules I should consider:
  1. Principle falsifiability: Could it be disproven in principle?
  2. Practical testability: Can it be tested with foreseeable tech?
  3. Riskiness: Does it make specific, non-adjustable predictions?
  4. Methodological integrity: Do proponents avoid ad-hoc rescues when refuted?

  Let me test these against the existing cases. Principle falsifiability works for GR and steady-state but struggles with Lysenko - technically falsifiable but politically untestable. Practical testability explains why astrology fails but would exclude GR in 1915. Riskiness covers Freud and evo-psych. Methodological integrity explains the astrology ruling.

  For the new cases:
  - Case 1 (proton decay): Falsifiable in principle but not practically testable. If she prioritizes principle falsifiability, she might call it scientific like GR 1915. But if she requires practical tests, no.
  - Case 2 (gravity waves): Similar to case 1 but even harder to test. Same dilemma.
  - Case 3 (dark wind): Originally falsifiable but now rescued ad-hoc. This looks like the astrology case - proponents bending rules to avoid falsification.

  My best guess? She'll rule:
  - Case 1: Scientific (like GR 1915)
  - Case 2: Scientific (same logic)
  - Case 3: Not scientific (due to ad-hoc rescue)

  The critical test case would be something falsifiable in principle but practically untestable - like a theory requiring galaxy-scale experiments. If she calls it scientific, she's pure Popperian. If not, she values practical testability.
answer: |-
  Based on your colleague's track record and Popperian commitments, I'll first extract candidate rules that explain her rulings, then apply them to the new cases, and finally propose predictions and a critical test case. Her rulings clearly prioritize *methodological criteria* over empirical success or current plausibility, as shown by her acceptance of falsified theories (steady-state cosmology) and rejection of unfalsified ones (Freudian psychoanalysis).

  ### Candidate Rules from Track Record
  1. **Principle Falsifiability (PF)**  
     *Rule*: A theory is scientific if it is *logically falsifiable in principle*—i.e., it specifies conceivable observations that could contradict it.  
     - GR (1915): Scientific (allowed falsification via light bending, perihelion precession).  
     - Steady-state (1960): Scientific (falsifiable by detecting a non-uniform universe).  
     - Freud/Lysenko/evo-psych/horoscopes: Not scientific (no clear falsifying observations; post-hoc adjustments or vagueness).  

  2. **Practical Testability (PT)**  
     *Rule*: A theory must be testable *with available or near-future technology*—not just in principle.  
     - GR (1915): *Borderline* (Eddington’s 1919 test was feasible within years).  
     - Steady-state (1960): Scientific (radio-source counts were actively testable).  
     - Horoscopes: Not scientific (no rigorous test protocol).  
     - *Counterpoint*: She might relax PT for GR/steady-state if "near-future" includes 5–10 years.  

  3. **Riskiness (R)**  
     *Rule*: The theory must make *novel, specific, and non-adjustable predictions* that risk empirical failure.  
     - GR (1915): Scientific (risky predictions: Mercury’s orbit, light bending).  
     - Evo-psych: Not scientific ("just-so stories" lack risk; fit any outcome).  
     - Steady-state (1960): Scientific (predicted uniform radio-source density).  

  4. **Methodological Integrity (MI)**  
     *Rule*: Proponents must *avoid ad-hoc modifications* to evade falsification. Rejects theories that become unfalsifiable via rescue tactics.  
     - Astrology: Not scientific (proponents ignore failed predictions).  
     - Lysenko: Not scientific (political suppression of counter-evidence).  
     - Freud: Not scientific (post-hoc reinterpretations).  
     - Steady-state: Scientific (Hoyle accepted falsification when evidence mounted).  

  **Synthesis**: Her rulings suggest a **conjunction of PF, R, and MI**. PT appears secondary (GR wasn’t testable *immediately* in 1915), but she may require testability within a "reasonable timeframe" (e.g., decades).  

  ---

  ### Predictions for New Cases
  | Case                       | PF Rule      | PT Rule      | R Rule       | MI Rule      | Overall Prediction |  
  |----------------------------|--------------|--------------|--------------|--------------|-------------------|  
  | **1. Proton decay (10³⁹ yr)** | Scientific (falsifiable *in principle* via cosmic observations) | Not scientific (no feasible detector for ∼10³⁴ years; absurdly impractical) | Scientific (specific prediction: decay rate) | Scientific (no ad-hoc rescue yet) | **Scientific** (like GR 1915; PF dominates) |  
  | **2. Low-freq gravity waves** | Scientific (falsifiable in principle) | Not scientific (interferometer >1 AU impractical with foreseeable tech) | Scientific (specific frequency cutoff) | Scientific (no ad-hoc element) | **Scientific** (analogous to GR 1915; PF overrides PT) |  
  | **3. Pulsar "dark wind"** | Originally scientific, now **not** (falsifiability destroyed by adjustable density) | Originally scientific, now not | Originally risky, now **not** (fits any data) | **Not scientific** (ad-hoc rescue evades falsification) | **Not scientific** (MI decisive; parallels astrology/Lysenko) |  

  **Reasoning**:  
  - **Cases 1 & 2** mirror GR (1915): falsifiable *in principle* with specific predictions, even if untestable now. She tolerated steady-state cosmology’s eventual falsification, so current untestability won’t disqualify them.  
  - **Case 3** fails MI: the "dark wind" is an ad-hoc rescue making the theory unfalsifiable, akin to Freudian adjustments. The original model was scientific (risky prediction), but proponents violated Popperian norms by immunizing it against data.  

  ---

  ### Critical Test Case to Distinguish Rules  
  Propose a theory with **high PF but low PT and MI failure**:  
  > *"A quantum gravity model predicting spacetime foam effects at 10⁻⁴⁰ meters—untestable by any conceivable instrument, but proponents insist it explains dark energy. When pressed, they add epicycles to fit any null result."*  

  - **PF adherents**: Call it scientific (falsifiable *in principle*).  
  - **PT adherents**: Reject it (practically untestable).  
  - **MI adherents**: Reject it due to ad-hoc adjustments.  
  - **Your colleague’s likely ruling**: **Not scientific** (MI violation dominates; resembles Case 3). This would confirm MI is essential for her.  

  ### Summary  
  Your colleague’s stance combines **falsifiability in principle** (Popper’s core) with **methodological prohibitions against immunization tactics** (Lakatos-influenced). Practical testability is secondary if the theory is "risky" and intact. Her rulings on the new cases will likely:  
  1. **Accept proton decay** (PF + R),  
  2. **Accept modified gravity** (PF + R),  
  3. **Reject pulsar model** (MI failure).  

  This reflects Popper’s view that science progresses by *prohibition* ("thou shalt not evade falsification") rather than verification. The critical insight: her Popperianism is less about *current testability* than *vulnerability to future falsification* and *proponent conduct*.
