answer: |-
  Here's a careful audit of your housemate's summary, point-by-point, followed by a fair one-paragraph version:

  **Claim-by-Claim Audit:**

  1.  **"The dominant view... is that the rule of assertion is that you may assert something only if you know it."**
      *   **Accuracy:** **Largely Correct.** Williamson (2000) *Knowledge and its Limits* is indeed the seminal modern defense of the Knowledge Norm of Assertion (KNA): "One must: assert *p* only if one knows *p*". It *was* dominant for much of the early 2000s and remains highly influential.

  2.  **"Since knowledge is justified true belief..."**
      *   **Accuracy:** **Misrepresentation.** This is the critical flaw. While JTB (Justified True Belief) is the *classic* definition of knowledge dating back to Plato, it was famously shown to be *insufficient* by Edmund Gettier in 1963. Almost all contemporary epistemologists, *including Williamson*, agree that JTB is not adequate for knowledge. Knowledge requires JTB *plus* something else (e.g., the absence of "Gettierizing" luck). KNA defenders emphatically do *not* equate knowledge with mere JTB.

  3.  **"...the rule really comes to saying you should only assert what you're justified in believing..."**
      *   **Accuracy:** **Genuine Misrepresentation.** This directly follows from the JTB mistake and fundamentally misstates KNA. The KNA is *stricter* than a justification norm. You can be justified in believing a false proposition or a true proposition in a Gettiered way (justified true belief without knowledge). The KNA forbids asserting in *both* these cases, whereas a pure justification norm would allow asserting justified falsehoods. The KNA requires *knowledge*, which entails truth and the satisfaction of anti-luck conditions beyond mere justification.

  4.  **"Williamson just puts it in terms of knowledge."**
      *   **Accuracy:** **Correct (but context is misleading).** Yes, Williamson formulates it directly in terms of knowledge. However, the previous claim that he reduces this to a justification norm is wrong.

  5.  **"The view nicely explains why 'how do you know?' is always an appropriate challenge to an assertion..."**
      *   **Accuracy:** **Defender Accepts / Standard Argument.** This is a core argument for KNA. If assertion requires knowledge, then asking for the basis of that knowledge is a direct challenge to whether the assertion met its constitutive norm.

  6.  **"...and why Moore's paradox arises: saying 'it's raining, but I don't believe it's raining' is absurd..."**
      *   **Accuracy:** **Simplification / Mixed.** KNA defenders *do* use Moorean absurdity to support their view, but the paradox directly relevant to *assertion* norms is usually the *epistemic* Moorean paradox: "P, but I don't *know* that P". Asserting this is deeply problematic *specifically* if assertion requires knowledge (you'd be asserting P while simultaneously denying you meet the condition for properly asserting P). The belief version ("P, but I don't *believe* P") is also absurd, and KNA proponents might argue it indirectly supports KNA (knowledge entails belief, so denying belief also implies you lack knowledge). Her phrasing uses the belief version, but the *work* for KNA is done by the knowledge version. Her point *touches* on a relevant argument but isn't quite precise.

  7.  **"But the view was pretty much refuted by the lottery problem..."**
      *   **Accuracy:** **Overstatement / Simplification.** The lottery problem (asserting "My ticket will lose" in a large fair lottery seems improper, even though the probability of winning is tiny) is arguably the *strongest* and most widely discussed objection to KNA. It *seriously challenges* KNA and is a major reason why many philosophers seek alternatives. However, it is **not** universally considered a "refutation". KNA defenders offer sophisticated responses:
          *   **Deny Knowledge:** Argue that you don't *actually know* your ticket will lose in a lottery, precisely because there is a salient, non-eliminated possibility of winning (linking to fallibilism/infallibilism debates and anti-luck conditions for knowledge).
          *   **Pragmatic Factors:** Argue that while the assertion might violate a purely epistemic norm, the *primary* reason it sounds bad is pragmatic (e.g., high stakes, conversational irrelevance, tempting fate).
          *   **Contextualism/Subject-Sensitive Invariantism:** Argue that the standards for knowledge (and hence proper assertion) rise in high-stakes contexts like lotteries.
      Calling it a "refutation" overstates the case; it's a powerful and persistent challenge.

  8.  **"...whereas it seems fine to assert things you don't know in everyday cases, like telling someone a train leaves at 6:10 based on a timetable that's occasionally wrong."**
      *   **Accuracy:** **Standard Objection / Defender Disputes.** This is another classic objection (sometimes called the "Timetable Case" or part of broader objections from "reasonable falsehoods" or "testimony from fallible sources"). The intuition is that such assertions are often perfectly appropriate, even though the asserter lacks *knowledge* (due to the fallibility of the source). KNA defenders respond similarly to the lottery:
          *   **Deny Lack of Knowledge:** Argue that in many ordinary contexts, relying on a generally reliable timetable *does* confer knowledge.
          *   **Argue Impropriety:** Argue that if the asserter *is* aware of the fallibility and the stakes are high, asserting *is* improper without qualification ("The timetable says 6:10, but it's occasionally wrong").
          *   **Secondary Norms:** Suggest such assertions might be governed by secondary norms (warrant, reasonableness) but still violate the primary constitutive norm (knowledge).
      It's a significant challenge but not a knockdown refutation.

  9.  **"So most people now accept the truth rule instead: assert only what is true."**
      *   **Accuracy:** **Overstatement / Misrepresentation of Field.**
          *   **"Most people"**: This is highly debatable. While KNA faces challenges, it still has numerous prominent defenders. Many alternatives are actively debated: Justified/Reasonable Belief Norms, Warranted Assertibility Norms, Supportive Reasons Norms, Belief Norms, etc. The Truth Norm ("Assert only what is true") is *one* alternative, but it faces its own severe problems:
              *   It seems far too weak. It allows asserting pure guesses or completely unjustified claims, as long as they happen to be true. This doesn't match intuitions about assertion being a responsible act.
              *   It makes the propriety of an assertion unknowable to the asserter at the time (you can't know if P is true just by asserting it).
          *   A more common competitor is some form of **Justified** or **Reasonable Belief** norm ("Assert only what you are justified in believing" or "Assert only what you reasonably believe"). This avoids the lottery/timetable problems *if* justification/reasonableness is set lower than knowledge, but arguably makes 'How do you know?' less directly appropriate as a challenge and struggles with Moorean paradoxes involving justification/belief.
          *   **Conclusion:** The field is pluralistic and actively debated. KNA remains a major player. The Truth Norm is generally seen as inadequate on its own. Justified/Reasonable Belief norms are significant competitors, but no single view commands a clear "most people" consensus post-lottery.

  **Your Specific Questions:**

  *   **Step from "know" to "justified belief"?** It is **not** innocent. It's a fundamental misrepresentation of KNA. KNA requires *more* than justified belief (truth and anti-luck conditions).
  *   **Moore's Paradox:** Her description (using the belief version) touches on relevant arguments but obscures the core *epistemic* Moorean paradox ("P, but I don't know P") which is the direct argument for KNA. The belief paradox is related but secondary.
  *   **Lottery & Timetable:** They are **standard and powerful objections**, perhaps the most discussed. They are **not knockdown refutations** because KNA defenders have developed sophisticated, ongoing responses. However, they are major reasons why many philosophers find KNA too strict and explore alternatives.
  *   **Conclusion ("most accept truth rule")?** This **does not follow** from the corrected summary and overstates/misrepresents the field. KNA remains viable (though challenged); the Truth Norm is widely seen as insufficient; Justified/Reasonable Belief norms are major competitors.

  **Fair One-Paragraph Summary:**

  "Timothy Williamson famously argued that the fundamental rule governing assertion is that you should only assert something if you *know* it to be true. This Knowledge Norm explains why asking 'How do you know?' is a natural challenge to an assertion and why saying something like 'It's raining, but I don't *know* it's raining' seems deeply odd. However, this view faces serious challenges. The 'lottery problem' questions whether we can truly know a single ticket will lose in a large fair lottery, even with overwhelming odds, making assertions like 'My ticket lost' seem improper before the draw. Similarly, cases like asserting a train time based on a generally reliable but occasionally wrong timetable seem acceptable even without meeting the strict standard of knowledge. While these problems have led many philosophers to propose alternative norms – such as asserting only what you justifiably believe or reasonably believe – the Knowledge Norm still has strong defenders who offer responses to these objections, and the debate remains very active. Saying 'most accept the truth rule' oversimplifies, as the simple Truth Norm faces its own significant problems."

  **Use this summary to engage your housemate constructively.** It acknowledges the core points she made accurately, corrects the key misstep about knowledge=JTB and the overstatement about the Truth Norm, presents the objections fairly as challenges rather than refutations, and accurately reflects the ongoing debate. It avoids embarrassing her while providing a more nuanced picture. You could start with, "That was really helpful! I read a bit more and it seems the lottery and timetable cases are indeed major sticking points, but I also saw that Williamson's defenders argue we *don't* actually know the lottery ticket will lose..."
