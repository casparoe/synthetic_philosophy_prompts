  Regarding alternate possibilities, Kant seems to prioritize the will's autonomy over having options. In the _Metaphysics of Morals_, he links Wille with reason, not alternatives. So he might side with Frankfurt in rejecting PAP, but for different reasons. That could be a point to highlight.

  The real weak spot is transcendental freedom's explanatory power. If it's completely detached, how does it affect responsibility? Kant's appeal to the fact of reason might be circular. The user needs this pointed out as a structural weakness, even if Kant himself wouldn't concede.

