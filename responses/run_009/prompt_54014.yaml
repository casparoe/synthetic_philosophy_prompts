prompt: |-
  I'm a third-year student in a seminar on the law of atrocity, spending most of the term on Raphael Lemkin — how he built the concept out of earlier vocabulary like "denationalization" and "barbarism," how his original conception covered the destruction of a group's national pattern through means well beyond killing (displacing people, destroying institutions, suppressing language, settling the oppressor's population onto the land), and how the 1948 Convention then narrowed it: only national, ethnic, racial, and religious groups count, political groups were dropped under Soviet pressure, cultural destruction largely fell out, and the whole thing hinges on the special intent to destroy the group "as such." On the side, I volunteer as a research intern at a small NGO that writes monthly situation reports on ongoing mass atrocities. Our drafting has been ad hoc: one report calls a situation "genocide," the next calls the same situation "ethnic cleansing," and a reviewer once softened a draft to "widespread abuses" for reasons nobody recorded. My supervisor has asked me to build a rubric the drafting team can actually apply, so that the label follows from stated criteria rather than from whoever happens to be writing.

  Please turn this into a usable decision procedure for our situation reports. It should pose its questions in a fixed order — roughly: which protected-group question, which acts question (the Convention's enumerated acts go beyond killing to include infliction of serious harm, conditions of life calculated to destroy, prevention of births, forcible transfer of children), and above all the specific-intent question — and for each it should say what counts as a sufficient answer, given that perpetrators rarely announce their intent and we often have to infer it from patterns (systematic exclusivity of targeting, language of dehumanization in official channels, refusal to allow survival options). It must be explicit about the distinction between the legal label and looser moral uses, and about the fallback hierarchy: when the evidence won't support "genocide," what do we write instead — crimes against humanity, ethnic cleansing, persecution — and what each fallback commits us to. It should also be honest about the politics baked into naming: governments avoid the word because of the duty to prevent it triggers and the diplomatic costs it imposes, and euphemisms get coined precisely to avoid it, so our rubric has to say why we are not simply mirroring that avoidance. Mark clearly the points where the procedure runs out and a human judgment call has to be recorded with its reasons.

  Then run the procedure on three hypotheticals: first, a Khmer Rouge-style campaign in which a regime kills a vast proportion of a political-economic class — enormous death toll, but the victims are defined by class and political alignment rather than by any of the four protected grounds; second, a Myanmar-Rohingya-style case with mass killing, systematic destruction of villages, and prevention of births, where the pattern evidence is strong but there is no smoking-gun statement of intent; third, a case of mass forced displacement and the systematic dismantling of a group's language, religious institutions, and children's transfer into the oppressor's families, but with comparatively few killings — the situation where Lemkin's own broader concept and the Convention's definition pull apart most visibly. At least one of these should come out in a way I will find uncomfortable; please pick which one honestly. Then tell me what the procedure cannot do — the cases it will misfire on and the questions it cannot settle. Keep the whole thing under 750 words.
reasoning: |-
  Okay, the user is a third-year law student specializing in atrocity law, particularly focused on Raphael Lemkin's work. They've noted how Lemkin's original concept of genocide was broader than the UN definition, including cultural destruction and targeting political groups. Now they're interning at an NGO that produces situation reports on mass atrocities, and they need a consistent rubric to classify events as genocide or other categories. 

  The user's request is very specific: they want a step-by-step decision procedure that addresses protected groups, acts, and intent—especially inferring intent from patterns. They also want clarity on fallback terms (crimes against humanity, ethnic cleansing) and honesty about the politics of labeling. Plus, they want three hypotheticals tested, with one deliberately uncomfortable outcome. 

  Hmm, the underlying need here is precision in a high-stakes context. The NGO's ad hoc labeling risks credibility gaps or misrepresentation. The user is likely frustrated by arbitrary revisions ("widespread abuses" softened without reason) and wants to shield their team from political pressure. They're also subtly asking how to handle Lemkin's vision vs. the Convention's limits—especially in cases with cultural destruction but few killings. 

  For the rubric, I'll structure it as three strict filters: protected group → enumerated acts → specific intent. If any step fails, it cascades to fallback labels. Key nuances: 
  - Protected groups: Only national/ethnic/racial/religious. Political/class groups don’t count, per the Convention. 
  - Intent: Must infer from systematic patterns (e.g., dehumanizing rhetoric, blocking aid). If inconclusive, it’s not genocide. 
  - Fallbacks: "Ethnic cleansing" isn’t a legal term—it’s a descriptor for forced displacement, which could overlap with CAH or genocide. 

  The uncomfortable truth will be the first hypothetical (Khmer Rouge-style). Class/political targeting isn’t genocide under the Convention, however horrific. I’ll flag this as a deliberate legal gap. 

  For the Myanmar-style case: Strong pattern evidence (village destruction, birth prevention) should suffice for intent inference. Cultural destruction alone (third hypothetical) fails—it’s persecution under CAH, not genocide. 

  Limitations: The rubric can’t resolve debates about expanding protected groups (e.g., political) or handle purely cultural destruction. It also can’t force consensus when evidence is ambiguous—that’s a human call. 

  Politics note: I’ll stress that avoiding "genocide" due to diplomatic pressure betrays victims; the rubric must prioritize evidence over convenience. 

  Word count is tight—I’ll keep the analysis lean and use bullet points in the response for clarity.
answer: |-
  Here's a Genocide Determination Rubric for Situation Reports, designed for clarity and consistency:

  **Decision Procedure:**

  1.  **Protected Group?** Are victims targeted *as members* of a national, ethnic, racial, or religious group? (Exclude political, economic, or social groups).
      *   *Sufficient:* Credible evidence (patterns of targeting, perpetrator statements, victim identities) showing group membership is the primary basis for victimization.
      *   *Fail:* Targeting based primarily on political opposition, economic class, or other non-protected grounds. Proceed to Crimes Against Humanity (CAH) analysis.
      *   *Judgment Call:* If group identity is one factor among others (e.g., political *and* ethnic). Record reasoning.

  2.  **Enumerated Acts?** Is there evidence of acts listed in Article II of the Genocide Convention?
      *   Killing members of the group;
      *   Causing serious bodily or mental harm;
      *   Deliberately inflicting conditions of life calculated to bring about physical destruction (e.g., siege, famine);
      *   Imposing measures intended to prevent births (e.g., sterilization, sexual violence, separation of sexes);
      *   Forcibly transferring children of the group to another group.
      *   *Sufficient:* Credible evidence of one or more of these acts occurring systematically against the protected group.
      *   *Fail:* Acts not meeting this threshold (e.g., widespread discrimination, destruction of property alone, forced displacement *without* other qualifying acts/destructive intent). Consider "Ethnic Cleansing" or "Persecution" (as CAH).

  3.  **Specific Intent ("Dolus Specialis")?** Is there evidence the perpetrators *intended* to destroy the protected group, in whole or in part, *as such*?
      *   *Sufficient Evidence for Inference:* Pattern evidence showing systematic exclusivity of targeting the group; explicit statements of annihilation/dehumanization by leaders/commanders (official documents, speeches, orders); systematic destruction of group foundations (homes, institutions, livelihoods); refusal to allow survival options (blocking aid, escape routes); scale and nature of acts logically requiring genocidal intent.
      *   *Fail:* Insufficient evidence of this specific intent. Acts may be severe but motivated by counter-insurgency, territorial control, or indiscriminate repression without intent to destroy the group *as such*. Proceed to CAH or "Ethnic Cleansing".
      *   *Judgment Call:* When pattern evidence is strong but circumstantial, lacking explicit statements. Record reasoning and weight given to different factors.

  **Fallback Hierarchy (If Genocide Criteria Not Met):**
  *   **Crimes Against Humanity (CAH):** Widespread or systematic attack against any civilian population (no protected group requirement), including murder, extermination, deportation, persecution, etc. *Use when:* Acts are widespread/systematic but lack protected group or specific genocidal intent.
  *   **Ethnic Cleansing:** A policy rendering an area ethnically homogeneous by force. While not a standalone crime under international law, it often constitutes CAH (deportation, persecution) and *can* overlap with genocide if intent/criteria met. *Use when:* Primary focus is forced displacement/expulsion of an ethnic group, but genocide criteria (especially intent or full range of acts) aren't met. *Note:* Label clearly as a descriptive term, not a legal crime.
  *   **Persecution (as CAH):** Severe deprivation of fundamental rights against an identifiable group on political, racial, national, ethnic, cultural, religious, or gender grounds. *Use when:* Systematic discrimination, violence, or rights violations target a group, but acts/intent don't reach genocide threshold.
  *   **Widespread Abuses/Atrocity Crimes:** Use only if more specific labels (CAH, Ethnic Cleansing, Persecution) cannot be applied with reasonable confidence based on evidence.

  **On Politics & Naming:**
  *   This rubric prioritizes evidence and legal definitions over diplomatic convenience. Governments avoid "genocide" due to the Convention's obligation to "prevent and punish," triggering potential intervention and reputational cost. Euphemisms ("conflict," "instability") obscure severity and evade responsibility.
  *   We use precise labels to accurately reflect the harm, uphold legal obligations, mobilize appropriate responses, and counter impunity. Avoiding "genocide" when criteria are met mirrors perpetrator denial and abdicates moral responsibility. Our credibility depends on consistent, evidence-based labeling.

  **Hypothetical Applications:**

  1.  **Khmer Rouge-Style (Class/Political Targeting):**
      *   Protected Group? **FAIL** (Targeting based on class/politics, not protected groups).
      *   *Result:* **Crimes Against Humanity (Extermination, Persecution)**. *Uncomfortable Truth:* However horrific and massive the killing, it legally isn't genocide under the Convention due to the excluded groups. This highlights the Convention's political compromise.

  2.  **Myanmar-Rohingya-Style (Mass Killing, Village Destruction, Birth Prevention - No Explicit Intent Statement):**
      *   Protected Group? **YES** (Ethnic/religious group).
      *   Enumerated Acts? **YES** (Killing, serious harm, conditions of life destruction, prevention of births).
      *   Specific Intent? **YES** (Sufficient Inference: Systematic exclusivity of targeting, scale of village destruction, documented dehumanizing rhetoric by officials/military, measures preventing births/survival).
      *   *Result:* **Genocide**. Pattern evidence strongly infers intent.

  3.  **Cultural Destruction/Forced Assimilation (Few Killings):**
      *   Protected Group? **YES** (e.g., Ethnic group).
      *   Enumerated Acts? **DEBATABLE/FAIL**: Forcible transfer of children **YES**. Destruction of language/institutions? Fits Lemkin but *not* the Convention's "conditions of life" unless it demonstrably causes *physical* destruction (rare). Few killings.
      *   Specific Intent? **Likely YES** (Intent to destroy group *as such* via assimilation).
      *   *Result:* **NOT GENOCIDE** under Convention (Insufficient qualifying acts). **Fallback:** **Crimes Against Humanity (Persecution, possibly Extermination if slow death results, or other inhumane acts) AND Ethnic Cleansing** (if displacement involved). *Lemkin's Concept vs. Law:* This case starkly shows the Convention's narrowing.

  **What the Procedure Cannot Do:**

  1.  **Resolve Ambiguous Evidence:** It can't make evidence appear. When intent or group targeting is genuinely unclear, it forces a fallback label and requires recording the uncertainty.
  2.  **Settle Definitional Debates:** It applies the *current* law. It can't incorporate arguments for including political groups or purely cultural genocide without treaty change.
  3.  **Address "In Part" Threshold:** How big must the "part" be? The rubric flags this as a critical judgment call requiring contextual analysis (scale, strategic importance of the targeted part).
  4.  **Handle Evolving Jurisprudence:** It's a snapshot based on prevailing interpretations (e.g., ICTY/ICTR/ICJ precedents on intent inference). Users must stay updated.
  5.  **Eliminate All Subjectivity:** Judgment calls remain at key points (group identity weighting, intent inference from patterns, "part" threshold). The rubric ensures these are explicit and reasoned, not hidden.
