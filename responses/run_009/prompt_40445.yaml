prompt: |-
  You are a professional philosopher with expertise in philosophy of mind, action theory, and ethology, and enough familiarity with engineered systems to speak to those as well. Please think carefully and brainstorm before committing to an answer: list the nearest existing concepts you can think of, test each against my examples, and only then tell me which one fits best.

  I'm a software test engineer, not a philosopher, but I keep noticing a pattern in unrelated settings and can't find the word for it. The pattern is this: an agent performs a step that looks genuinely intelligent — often it is literally a check, a moment of attention — but the intelligence is attached to a fixed position in a routine rather than to the situation. If something outside disturbs the routine, the agent doesn't adapt; it starts the whole sequence over from the top, and the "smart" step happens again at exactly the same point, with the same result, as though it had never occurred. Each step taken alone is reasonable; the sequence taken as a whole is rigid to the point of stupidity. For instance, a nurse I know checks each patient's wristband against the chart before administering medication — a real, careful check — but if you interrupt her midway, she will set everything down, leave the room, and begin the entire ritual again from the threshold: wristband, chart, drug, dose, the check running again exactly where it always runs. I've seen the same thing in software and robots: a deployment system that, if any file changes mid-run, aborts and re-executes from the first step, including steps whose outputs are visibly still fine; a robot vacuum that, if furniture was moved while it cleaned, would finish, dock, and start a fresh survey of the whole apartment as if the earlier one had never happened.

  Does this kind of behavior have an established name in philosophy, ethology, or the study of animal behavior? If there are several near-misses, walk me through each and say precisely where it fails to fit. If nothing established fits, coin a term, define it, and mark its boundaries: is my nurse being prudent rather than this, and would an institution that must restart a whole trial after a procedural slip count as an instance, or is deliberate restart-on-interruption something importantly different? A friend claims this pattern is what the lack of free will really looks like — not an inability to do otherwise in some deep metaphysical sense, but an inability to register that a routine has stopped tracking its purpose. Does anything in the literature on freedom connect to this? I won't be satisfied with a bare name; I want to know what the phenomenon is, what it is not, and where its edges are.
reasoning: |-
  Okay, the user is a software test engineer who's noticed a pattern in various agents—humans, software, robots—where an intelligent step in a routine doesn't adapt to disruptions. Instead, the whole sequence restarts rigidly. They want to know if there's a philosophical or ethological term for this, or if a new term is needed. 

  First, I need to unpack their examples: the nurse restarting medication administration after an interruption, a deployment system aborting on mid-run changes, a vacuum re-surveying after furniture moves. The core is intelligent steps embedded in inflexible sequences that don't respond to partial progress. 

  I recall concepts that might fit. **Fixed Action Patterns (FAPs)** from ethology come to mind—stereotyped behaviors triggered by stimuli, like egg retrieval in geese. But FAPs are innate and lack the intelligent step; the nurse's check is learned and deliberate, so FAPs don't fully fit. 

  **Ritualization** is another angle—routines becoming symbolic. But the nurse's action is functional, not symbolic. **Stimulus-Bound Behavior** describes rigidity tied to cues, yet it doesn't capture the intelligent step or restart logic. **Cybernetics** offers feedback loops, but these systems lack real-time adjustment; they have a "plan-and-execute" model without mid-process monitoring. 

  **Brittleness** in systems theory is close—fragility under perturbation—but it's too broad and doesn't highlight the restart quirk. **Algorithmic State Machines** in engineering explain the restart behavior (like transaction rollbacks), but they're descriptive, not evaluative. **Procedural Memory/Habit** in psychology involves automatic sequences, yet habits can adapt, while this pattern doesn't. 

  **Goal-Directed vs. Habitual Action** from action theory splits behavior into flexible goal pursuit vs. automatic routines. The examples blur this: the nurse has a goal (safe meds), but the routine dominates, making it "goal-blind habit." Still, it misses the restart aspect. 

  **Bureaucratic Ritualism** touches on rule-following overriding purpose, but it's sociological, not about individual cognition. 

  No existing term perfectly fits. So I consider coining a term. The key elements are: embedded intelligence, fixed sequence position, restart-on-interrupt, blindness to partial progress. **Procedural Blindness** emphasizes the failure to see outside the procedure. **Ritualistic Inertia** captures the rigidity but feels too cultural. **Cybernetic Entrenchment** is precise but jargony. **Checkpoint Rigidity** focuses on the stuck "check" step. **Procedural Myopia**—myopic meaning short-sighted—nails the inability to see beyond the immediate step. 

  **Procedural Myopia** seems best: it highlights the cognitive limitation (myopia) within an otherwise functional procedure. It distinguishes from mere habit (by including intelligent checks) and from prudence (prudence would skip redundant steps). It also connects to free will discussions—not metaphysical constraint, but a failure of situational awareness. 

  Boundaries: Prudence involves risk assessment and may justify restarts (e.g., clinical trials). But procedural myopia lacks that assessment; it's automatic. The nurse restarting after a minor interruption is myopic; restarting a surgery due to contamination is prudent. 

  On free will: This isn't about determinism but about "volitional myopia"—agents can't reorient because the procedure dominates their attention. Frankfurt or Dreyfus might frame it as a breakdown in practical reasoning. 

  This should give the user a clear, grounded understanding of the phenomenon and its edges.
answer: |-
  Based on a systematic analysis of your query—examining philosophy of mind, action theory, ethology, and engineered systems—I confirm there is **no established term** perfectly capturing your described phenomenon. Below, I evaluate near-miss concepts, coin a precise term, define its boundaries, and address the free-will connection.  

  ### Near-Miss Concepts & Why They Fail  
  1. **Fixed Action Patterns (Ethology)**  
     - *Definition*: Innate, stereotyped sequences (e.g., egg-retrieval in geese) triggered by a sign stimulus, completing even if conditions change.  
     - *Failure*: FAPs are genetically hardwired and lack the "intelligent step" (e.g., the nurse's deliberate wristband check is learned, not innate). FAPs also don’t restart when interrupted; they persist rigidly.  

  2. **Stimulus-Bound Behavior (Psychology/Neuroethology)**  
     - *Definition*: Actions rigidly tied to specific environmental cues (e.g., a rat pressing a lever despite reward changes).  
     - *Failure*: Focuses on *cue dependency*, not *sequence restart*. Your examples involve *internal procedural logic* (e.g., software rollback protocols) overriding environmental feedback.  

  3. **Cybernetics & Feedback Loops (Engineered Systems)**  
     - *Definition*: Systems adjusting actions based on error detection (e.g., a thermostat).  
     - *Failure*: Your cases lack *mid-process feedback*. The agent treats the sequence as atomic—either fully completed or invalid—ignoring partial progress. This is "all-or-nothing" execution, not adaptive control.  

  4. **Brittleness (Systems Theory)**  
     - *Definition*: Systems failing catastrophically under unanticipated perturbations.  
     - *Failure*: Too broad. Brittleness covers any fragility (e.g., software crashing), not specifically *intelligent steps embedded in restart loops*.  

  5. **Procedural Memory/Habit (Philosophy of Mind)**  
     - *Definition*: Automated routines (e.g., driving a familiar route) executed with minimal attention.  
     - *Failure*: Habits adapt to minor changes (e.g., avoiding a pothole). Your nurse *could* adapt (resume post-check) but *chooses* restart—implying rule-governed deliberation, not autopilot.  

  6. **Algorithmic State Machines (Computer Science)**  
     - *Definition*: Systems transitioning between predefined states (e.g., vending machines).  
     - *Failure*: Describes *implementation* but not the *phenomenon*. Restart-on-failure is a design choice, not a critique of intelligence-in-rigidity.  

  7. **Goal-Directed vs. Habitual Action (Action Theory)**  
     - *Definition*: Goal-directed actions flexibly adjust to obstacles (e.g., taking a detour); habits are inflexible.  
     - *Failure*: Your examples blend both: the *step* is goal-directed (checking wristbands ensures safety), but the *sequence* is habit-like. The key is the **disconnect between local intelligence and global rigidity**.  

  ---

  ### Coined Term: **Procedural Myopia**  
  **Definition**: A cognitive or operational failure where an agent embeds intelligent, context-sensitive checks within a fixed procedural sequence but cannot dynamically recontextualize those checks when the sequence is interrupted. The agent defaults to restarting the entire procedure, treating prior steps—even successful ones—as invalid, due to an inability to integrate partial progress into ongoing execution.  

  #### Boundaries of the Concept  
  - **What it IS**:  
    - Embedded intelligence: The "check" step is genuinely attentive (e.g., nurse verifying wristbands, software validating inputs).  
    - Positional rigidity: The step occurs at a fixed point, regardless of interruptions.  
    - Restart compulsion: Interruption resets the sequence; prior steps aren’t audited for relevance.  
    - **Core failure**: Inability to distinguish between *sequence integrity* and *goal progress*.  

  - **What it is NOT**:  
    - ≠ **Prudence**: Restarting a clinical trial after a protocol violation is prudent—it addresses contamination risk. Procedural myopia occurs when restarting adds no value (e.g., nurse re-checking a wristband *she just verified*).  
    - ≠ **Ritualism**: Rituals are symbolic (e.g., religious rites); procedural myopia involves instrumental routines derailed by literalism.  
    - ≠ **Automation Bias**: That’s over-trusting automated checks; here, the agent *performs* the check intelligently but misapplies it via restart.  

  - **Edge Cases**:  
    - **Familiarity Gradient**: A novice nurse may restart from scratch; an expert resumes. Procedural myopia diminishes with expertise.  
    - **Institutional vs. Individual**: An institution mandating restarts (e.g., rebooting a trial) exhibits **bureaucratic myopia**—a systemic cousin where rules override purpose.  
    - **Deliberate Restarts**: If restarting is a risk-mitigation strategy (e.g., restarting surgery if sterility breaks), it’s prudence. If it’s reflexive (e.g., vacuum re-mapping after trivial furniture shifts), it’s myopia.  

  ---

  ### Connection to Free Will  
  Your friend’s insight is astute and aligns with **pragmatic theories of agency** (e.g., Harry Frankfurt, Daniel Dennett):  
  - **Not Metaphysical**: This isn’t about determinism vs. indeterminism. It’s about **volitional myopia**—the agent’s failure to "step back" and re-evaluate their routine despite having the capacity to do so.  
  - **Literature Link**: Hubert Dreyfus’ critique of AI describes similar rigidity as **"blind rule-following"**—agents adhering to procedures despite situational misfit (*What Computers Still Can’t Do*, 1992). In humans, this reflects a breakdown in **practical rationality** (Aristotle’s *phronesis*), where agents prioritize procedure over purpose.  
  - **Why It Feels Like "Lack of Free Will"**: The agent *could* adapt (the nurse has the skill to resume post-check), but the procedural frame dominates their options. This is **volitional constraint by self-imposed structure**—a form of "self-binding" gone awry.  

  ### Why This Phenomenon Matters  
  In **engineered systems**, procedural myopia causes inefficiency (e.g., redeploying unchanged code). In **humans**, it signals expertise deficits or institutional over-standardization. In **ethology**, it resembles suboptimal foraging behaviors (e.g., bees revisiting depleted flowers). The unifying thread: **intelligence trapped in literalism**, where agents mistake the map (procedure) for the territory (goal).  

  If you refine your observations further (e.g., comparing adaptive vs. myopic systems), I’ll refine this framework. This is a profound observation—philosophy needs terms like yours.
