prompt: |-
  I am a novelist four years into a book narrated from inside the July Crisis of 1914, told by four characters — a Serbian consular official, a Habsburg staff officer, a London shipping clerk, a Berlin socialist printer — each of whom understands the coming war as the work of exactly one cause: the assassination, the alliance system, naval rivalry, the timetables of the general staffs. The book's formal problem is that the history appears to be overdetermined all the way down — remove any one of these and there is plausibly still a war in 1914 or 1917 — while narrative is constitutively selective; a novel cannot narrate all the jointly sufficient causes at once and remain a novel. Before I commit the book to any causal picture, I want the specification rather than the theory: please write the desiderata that any adequate account of overdetermined and multi-causal explanation in history must meet, fixing the purpose yourself as licensing or vetoing a novelist's choices about which causes to foreground.

  Among the cases I would expect such an account to get right: the two fires that merge and jointly destroy a house, either of which alone would have sufficed; the preempted backup, the assassin stationed further along the route whose bullet was never needed; a cause that figures in no single sufficient set of which its removal would change nothing, and yet without which everything would have run differently. The distinctions it must not collapse include cause versus explanation, overdetermination versus redundancy, and causal contribution versus explanatory salience. I would add one requirement of my own, which you should assess rather than assume: that the theory say when narrative emphasis on one member of an overdetermining set is merely a choice of contrast class and when it is a distortion — and if that requirement turns out to be confused, tell me why.

  Give the case or consideration behind each requirement, mark which are non-negotiable and which are merely the prejudices of one school (counterfactualists will demand what regularity theorists will refuse to grant), and identify — this is the part I most want — whether some subset of the desiderata is jointly unsatisfiable, since if adequacy is unachievable in principle, that is a fact my narrators are entitled to know. Then, briefly and only briefly, tell me how a counterfactual-dependence account, an INUS- or NESS-style regularity account, and a contrastive account fare against the list: enough for me to see which one forgives a novelist's selectivity and which one condemns it as falsification.
reasoning: |-
  Hmm, the user is a novelist working on a complex historical novel about the July Crisis of 1914 with four narrators, each convinced of a single cause of WWI. Their core challenge is that the war appears overdetermined—too many causes, each possibly sufficient on its own—while the novel form requires selectivity. They need a framework to justify which causes to emphasize without falsifying history.

  The user wants desiderata (essential requirements) for any adequate account of overdetermined historical causation. These should help them license or veto narrative choices. They also want to know if some requirements conflict, and how different causal theories (counterfactual, regularity, contrastive) handle these desiderata. Crucially, they want to know when emphasizing one cause is legitimate selectivity versus distortion.

  Breaking down the user's key points:
  - They need desiderata for multi-causal historical explanations, specifically for overdetermined events like WWI
  - The purpose is to guide novelistic choices about what causes to foreground
  - They provide examples: merging fires (overdetermination), preempted backup (redundancy), and causes that seem non-necessary but systemically vital
  - They insist on preserving distinctions like cause vs explanation and overdetermination vs redundancy
  - Their added requirement: a theory should differentiate between legitimate narrative emphasis (choice of contrast class) and distortion
  - They want to know which desiderata are non-negotiable vs school-dependent, and if any are mutually unsatisfiable
  - Finally, they want a brief comparison of how three causal theories handle these, particularly regarding novelistic selectivity

  I should structure the response clearly. First, define the desiderata with cases justifying each, marking negotiability. Then analyze conflicts between them. Finally, evaluate the three causal theories against the list, focusing on how they view narrative selectivity.

  For desiderata, I'll cover:
  1. Distinguishing causation from explanation (non-negotiable)
  2. Distinguishing overdetermination from redundancy (key for WWI cases)
  3. Handling causal contribution without necessity (like systemic factors)
  4. Accounting for explanatory salience (where selectivity lives)
  5. Their added requirement about emphasis vs distortion (which needs careful handling)
  6. Acknowledging scalar overdetermination (degrees matter)
  7. Preserving historical contingency (against determinism)
  8. Distinguishing enabling conditions from triggers

  The user's added requirement about emphasis vs distortion is insightful but tricky. In history, "distortion" implies misrepresentation, while narrative emphasis is inherent to storytelling. The line depends on context—what's omitted, audience expectations, etc. A theory can help by clarifying when a cause was genuinely salient versus peripheral, but judgment calls remain. I'll explain this.

  For conflicting desiderata: #3 (systemic causes) and #4 (salience) might clash with #2 (overdetermination vs redundancy) because complex systems blur these lines. Also, #1 (causation/explanation divide) could conflict with theories that tightly link them, like some counterfactual accounts.

  For theory comparison:
  - Counterfactual dependence: Clear on overdetermination/redundancy but struggles with systemic causes (#3) and might see selectivity as distortion
  - Regularity (INUS/NESS): Handles overdetermination well but is clunky on salience (#4) and may forgive selectivity if causes are part of a minimal set
  - Contrastive: Best on explanatory salience (#4) and the emphasis/distinction issue, as it frames explanations relative to "why this rather than that." This likely forgives selectivity most naturally

  The user's narrators can be comforted: since no theory satisfies all desiderata perfectly, novelists have philosophical cover for selectivity. Contrastive accounts align best with their needs.
answer: |-
  Below is a structured specification of desiderata for an account of overdetermined historical causation, tailored to your purpose of licensing/vetoing narrative choices. I derive these from philosophical debates on causation (Mackie, Lewis, Woodward, etc.) and historical methodology (counterfactual vs. structural approaches). Each desideratum includes a **case/justification**, marks **negotiability**, and notes **conflicts**. I then assess the three causal frameworks. The core tension: *Explanatory salience is context-dependent, but historical adequacy demands fidelity to causal structure*.

  ---

  ### **Desiderata for an Adequate Account**
  1. **Distinguish Causation from Explanation**  
     - *Requirement*: Separate what *caused* an event from how we *explain* it. Causation is ontological; explanation is epistemological/pragmatic.  
     - *Case*: The July 1914 war declarations were *caused* by a web of factors (assassination, alliances, etc.), but we *explain* it differently to different audiences (e.g., emphasizing alliances to diplomats vs. militarism to pacifists).  
     - *Negotiability*: **Non-negotiable**. Rejected only by strict ontic reductionists.  
     - *Conflict*: Conflicts with theories conflating causation with explanation (e.g., naive counterfactualism).

  2. **Distinguish Overdetermination from Redundancy**  
     - *Requirement*: Overdetermination = multiple *sufficient* causes (e.g., two fires). Redundancy = a *backup* cause that wasn’t needed (e.g., the unused assassin).  
     - *Case*: The alliance system and mobilization timetables were *overdetermining* (either could suffice for war). Austria’s post-assassination ultimatum was *redundant*—war was coming regardless.  
     - *Negotiability*: **Non-negotiable** for historical accuracy.  
     - *Conflict*: None—this is a consensus distinction.

  3. **Account for Non-Sufficient but Necessary-in-the-Context Causes**  
     - *Requirement*: Handle causes that aren’t individually sufficient, and not part of any minimal sufficient set, but whose removal would alter the *path* or *character* of the event.  
     - *Case*: The Berlin socialist printer’s worldview—remove socialist agitation, and the war still occurs, but with altered public sentiment, timing, or war aims.  
     - *Negotiability*: **Negotiable**. Regularity theorists (e.g., Mackie’s INUS) reject this; process theorists (e.g., Salmon) accept it.  
     - *Conflict*: Clashes with #7 (scalar overdetermination) if context-dependence is ignored.

  4. **Preserve Explanatory Salience**  
     - *Requirement*: Identify why some causes are foregrounded in narratives (e.g., vividness, moral responsibility, or contrastive focus).  
     - *Case*: The Serbian official foregrounds the assassination not because it was the only cause, but because it was *actionable*—a pivot for intervention.  
     - *Negotiability*: **Negotiable**. Counterfactualists downplay salience; contrastivists center it.  
     - *Conflict*: Tensions with #1 if salience is mistaken for causal primacy.

  5. **Your Added Requirement: Legitimize Selective Emphasis vs. Distortion**  
     - *Requirement*: Specify when emphasizing one cause is a valid "contrast class" choice (e.g., "Why war in *1914*?" vs. "Why war *at all*?") versus a distortion (e.g., ignoring necessary conditions).  
     - *Assessment*: **Partially confused but salvageable**. "Distortion" occurs if a cause is presented as *necessary/sufficient* when it wasn’t, or if context implies other causes didn’t exist. "Emphasis" is legitimate when:  
       - (a) It reflects *agent-relative salience* (e.g., your printer *experiences* capitalism as the cause).  
       - (b) The contrast class is explicit (e.g., "This caused war *in July*" vs. "*inevitably*").  
     - *Case*: Foregrounding naval rivalry is distortion if the narrative implies it was sufficient alone; it’s legitimate if framed as "why Britain joined *when it did*."  
     - *Negotiability*: **Novelist-essential**—but depends on #4 and #1.

  6. **Acknowledge Scalar Overdetermination**  
     - *Requirement*: Accept that overdetermination exists on a spectrum (e.g., 2 causes vs. 20), and some causes are "more sufficient" than others.  
     - *Case*: The assassination was a "weak" sufficient cause (needed Austria’s response); the alliance system was "strong" (bound to trigger war eventually).  
     - *Negotiability*: **Semi-negotiable**. Non-negotiable for complex events like 1914; rejected by binary accounts.  
     - *Conflict*: Clashes with #3 if scalar causes are excluded.

  7. **Avoid Determinism**  
     - *Requirement*: Explain why the event *happened* without implying it *had to happen*.  
     - *Case*: Remove the assassination, and war might occur in 1914 over another crisis (e.g., Balkans or colonies), but not necessarily.  
     - *Negotiability*: **Non-negotiable** for historical contingency.  
     - *Conflict*: None—this is a baseline for credible history.

  8. **Distinguish Enablers from Triggers**  
     - *Requirement*: Systemic causes (e.g., militarism) enable events; proximate causes (e.g., assassination) trigger them.  
     - *Case*: Alliances were an enabler; the Blank Cheque was a trigger.  
     - *Negotiability*: **Non-negotiable** for narrative coherence.  
     - *Conflict*: Tensions with #5 if triggers are overemphasized.

  ---

  ### **Conflicts and Joint Unsatisfiability**
  - **Conflict Cluster**: #3 (systemic causes), #4 (salience), and #5 (emphasis vs. distortion) are **jointly unsatisfiable** under rigid frameworks.  
    - *Why*: If a cause is non-sufficient but contextually vital (#3), its narrative emphasis (#4) risks distortion (#5) unless the contrast class is explicit. No theory fully resolves this.  
  - **Resolution for Novelists**: Adequacy is achievable *if* your account accepts **explanatory pluralism** (different causes matter for different questions). Your narrators can know: *All theories agree that overdetermined events have no single "true" narrative*.

  ---

  ### **How the Three Theories Fare**  
  *(Focus: Do they forgive novelistic selectivity?)*  

  1. **Counterfactual-Dependence (e.g., David Lewis)**  
     - *Frames causation*: Event C causes E if E wouldn’t occur without C.  
     - *Overdetermination*: Struggles. Two fires → neither is necessary; war still occurs if you remove one cause. Calls overdetermination "redundant causation," undermining sufficiency.  
     - *Novelist-friendliness*: **Condemns selectivity as distortion**. If removing a cause (e.g., alliances) doesn’t change the outcome (war), it’s not a cause—so emphasizing it misleads. Fails #3 and #6.  
     - *Verdict*: Poor fit. Makes your narrators’ single-cause views false by definition.  

  2. **Regularity (INUS/NESS; e.g., J.L. Mackie)**  
     - *Frames causation*: C is an *Insufficient but Necessary part of an Unnecessary but Sufficient* (INUS) condition, or a *Necessary Element of a Sufficient Set* (NESS).  
     - *Overdetermination*: Handles well. Each fire is a NESS condition; both form sufficient sets.  
     - *Novelist-friendliness*: **Forgives selectivity if causes are INUS/NESS**. Your Habsburg officer can foreground mobilization timetables (part of a sufficient set) without distortion. Allows #5 if the contrast class is implied. Fails #3 (systemic causes aren’t INUS).  
     - *Verdict*: Best for objective causal structure but rigid for character perspectives.  

  3. **Contrastive (e.g., Peter Lipton)**  
     - *Frames causation*: Explanation answers "Why P *rather than Q*?". Salience depends on the contrast class (e.g., "Why war in 1914 *vs. 1912*?").  
     - *Overdetermination*: Natural fit. The assassination explains "why July 1914" vs. "why eventual war"; alliances explain "why continental war" vs. "localized conflict."  
     - *Novelist-friendliness*: **Celebrates selectivity**. Each narrator’s cause is valid for their contrast class (e.g., the clerk sees naval rivalry as "why Britain joined *rather than stayed neutral*"). Meets #1, #4, #5, and #8. Fails #6 (scalarity).  
     - *Verdict*: Ideal for your novel. Turns "overdetermination" into a feature: each character’s lens is one contrast in a symphony of causes.  

  ---

  ### **Recommendation**  
  Adopt a **contrastive framework**. It licenses your narrators’ selectivity by framing each cause as an answer to a specific question (e.g., "Why now?" vs. "Why so total?"). To avoid distortion:  
  - Embed contrast classes in character voices (e.g., "Without the timetables, it might have been a *shorter* war").  
  - Use narrative irony (e.g., the socialist knows capitalism is systemic but *lives* it as the sole cause).  
  - Briefly juxtapose perspectives to hint at overdetermination (e.g., the clerk’s naval fears cross-cut with the printer’s labor struggles).  

  **Why this works**: History *is* overdetermined, but narrative thrives on constrained perspectives. Contrastivism doesn’t just forgive selectivity—it demands it. Your novel’s power lies in showing how each character’s truth is both partial and necessary.
