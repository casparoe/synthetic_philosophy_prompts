answer: |-
  Here’s the essay question, model answer, and marking scheme in continuous prose as requested. I’ve structured the marking scheme narratively and ensured the model answer highlights ambiguity.

  ---

  **Essay Question:**  
  "Using the 'scrubber case' described below, critically evaluate how the *Moral Judgment* and *Norm Deviation* explanations of the Knobe Effect would predict and interpret intentionality attributions. The case: A manager at a polluting firm installs scrubbers against the owner’s explicit rule, marginally hurting profits but significantly cleaning the town’s air. The manager states, 'I don’t care about the owner’s rule, I just want the plant to pass the town’s inspection.' Subjects are asked whether the manager *intentionally helped the environment*. In your essay, first outline the core mechanism of each explanation using classic Knobe cases for context. Then, articulate each explanation’s prediction for the scrubber case and justify why they *might* diverge. Finally, discuss how messy empirical results (e.g., a split in intuitions) could challenge or refine these theories, addressing where the case may underdetermine a clear winner."

  ---

  **Model Answer (Approx. 600 words):**  
  The Knobe Effect reveals asymmetries in intentionality attributions: people more readily judge harmful side-effects intentional than beneficial ones. Two dominant explanations are the *Moral Judgment* account, which argues that negative moral valence directly biases attributions of intentionality, and the *Norm Deviation* account, which claims intentionality hinges on whether an outcome violates context-specific norms, irrespective of morality.  

  In the classic chairman/harm case, both explanations align. The chairman knowingly harms the environment while pursuing profit. Moral Judgment theorists argue the bad outcome triggers a judgment of intentionality; Norm Deviation theorists note that harming the environment breaches a salient norm (e.g., "don’t damage ecosystems"). Conversely, in the help variant, helping is morally neutral/good but norm-conforming (business-as-usual profit-seeking), so both predict low intentionality attribution.  

  The scrubber case complicates this alignment. Here, the manager helps the environment (morally positive) but violates a powerful local norm: the owner’s "no emissions controls" rule. The Moral Judgment account, focused on outcome valence, should predict high attributions of intentionality—helping is good, so subjects should agree the manager intentionally helped. The Norm Deviation account, prioritizing abnormality, should *also* predict high intentionality, as helping via rule-breaking is norm-transgressive. Both theories seemingly converge on "yes." However, two nuances create tension. First, the manager’s stated motive ("I just want to pass inspection") instrumentalizes helping as a means to an end, potentially weakening the *moral* salience of the outcome. Moral Judgment may require perceived moral commitment, so this could lower intentionality attributions despite the good outcome. Second, Norm Deviation must define the "operative norm." If the salient norm is professional obedience (don’t defy the owner), helping becomes a deviant act, supporting "intentional." But if subjects prioritize the environmental norm (don’t pollute), helping is normative, potentially lowering intentionality.  

  A messy split in intuitions—some saying "yes," others "no"—challenges both theories. For Moral Judgment, significant "no" responses suggest moral valence alone is insufficient; motive or awareness may mediate attributions. For Norm Deviation, disagreement may reveal instability in which norm subjects deem operative (owner’s rule vs. civic duty). Neither theory is falsified: Moral Judgment can argue instrumental motives dilute perceived moral agency, while Norm Deviation can attribute splits to contextual ambiguity in norm salience. However, the case exposes limitations. Moral Judgment struggles if morally good outcomes *don’t* reliably boost intentionality when motives are mixed. Norm Deviation falters if it cannot predict *which* norm governs intuitions without circularity. This divergence matters because it shows that the theories aren’t functionally equivalent: they weight different factors (valence vs. rule-breaking) and may handle countervailing cues (like complex motives) differently. Future work could test refined versions—e.g., does clarifying the manager’s environmental concern shift Moral Judgment attributions? Does emphasizing the owner’s authority strengthen Norm Deviation’s prediction? Ultimately, the scrubber case doesn’t crown a winner but reveals where deeper mechanisms (motive sensitivity, norm prioritization) must be articulated.

  ---

  **Marking Scheme Described in Prose:**  
  The marking scheme totals 20 marks across five essential criteria. To achieve full marks, students must demonstrate clear understanding of both theories in the standard Knobe cases, accurately apply them to the scrubber variant, identify the potential divergence point(s), engage thoughtfully with ambiguous data, and articulate the case’s theoretical significance. Specifically: First, a strong answer will correctly summarize the core claims of the Moral Judgment and Norm Deviation accounts, illustrating how each explains the intentionality asymmetry in the original chairman cases (harm vs. help), earning up to 4 marks if both are outlined precisely with reference to valence and normativity. Second, it must apply each theory to the scrubber case, predicting intentionality attributions for "helping the environment" and justifying those predictions based on the case details (morally positive outcome vs. violation of owner’s rule), for up to 4 marks. Third, it should identify where the explanations might diverge in their reasoning or predictions despite both initially seeming to predict "yes," particularly noting the role of the manager’s stated motive (instrumental vs. moral) and/or ambiguity about which norm is "operative" (owner’s policy vs. environmental responsibility), which is worth up to 5 marks for nuanced analysis. Fourth, the answer must discuss how messy empirical results (e.g., a split in intuitions) challenge both theories, avoiding premature claims that data "proves" one theory and honestly addressing underdetermination—such as whether motives dilute moral valence or which norm dominates context—for up to 4 marks. Fifth, it should explain why this case advances debates beyond the original effect, such as testing the theories’ robustness to conflicting cues or exposing gaps in their mechanisms (e.g., Moral Judgment’s handling of mixed motives or Norm Deviation’s norm selection problem), earning up to 3 marks for insightful implications. An A-grade answer (17–20 marks) will excel in criteria three and five, revealing deep insight into the divergence (e.g., dissecting motive ambiguity) and theoretical stakes, while a B-grade answer (13–16 marks) will competently cover all points but with less originality or precision in critiquing the theories’ limitations, perhaps oversimplifying the divergence or underplaying ambiguity. Answers missing key predictions or ignoring motive/norm conflicts will be capped at lower marks. Partial credit applies where concepts are recognizably engaged but imprecise.
