prompt: |-
  I serve on the science assessment panel for our national space agency's Mars sample return mission, and the first cores drilled from an ancient hydrothermal vein have produced exactly the result we dreaded: neither clean nor dismissible. The vein material contains membrane-bounded vesicles, a few micrometers across, that sustain a proton gradient across their boundaries when supplied with an iron–sulfur couple, bud off daughter vesicles when the energy source is maintained, and lyse within days when it is withdrawn. Their carbon isotope ratios are fractionated in a way suggestive of metabolism, though serpentinization-style abiotic chemistry could in principle mimic it. Crucially, isotopic labeling shows no selective retention of any component during budding: inheritance appears entirely passive, and a sixty-generation propagation attempt in the presence of a growth inhibitor produced no adaptation, which any system with genuine heritable variation should have managed. Our panel must deliver a written recommendation to the mission directorate within ten days, and the stakes are keyed to a single word: the mission charter's gates for the public announcement protocol, continued high-containment of the samples versus their release to ordinary laboratories, and a fresh planetary protection review are all triggered by a finding of "life," not by any weaker locution. The panel is split three ways. One member holds that the standard working definition — a self-sustaining chemical system capable of Darwinian evolution — settles it, and that since there is no evidence of heredity or selection we should announce a non-detection and release the samples. A second argues the system is autopoietic — organized around maintaining and reproducing itself, which she takes to be the deeper mark of the living — and that demanding nucleic-acid-style heredity merely exports Earth's particular solution into a definition. The chair wants to coin a new category, something like "proto-biotic chemical system," to avoid the question entirely, though our counsel warns that the charter offers no such gate and the public will hear "life" or "not life" regardless. Please draft the short written recommendation I will circulate before our final session. It must take a position: whether this is a life detection for the purposes of the announcement and containment decisions, and what operational definition the panel should adopt going forward so we are not improvising this again. It should apply the same reasoning to two further cases we know are coming: a terrestrial biofilm found on the drill bit, and a virus-like particle with heritable capsid structure but no autonomous metabolism of its own. It should engage the strongest argument on whichever side it rejects, rather than a strawman — including the possibility that the chair is right that the definitional dispute is unresolvable and the operational question must be answered some other way. And it should close by stating what would change its verdict: which experimental result or argument, arriving between now and the decision date, would send the recommendation the other way, and at which step its own reasoning is most likely to fail.
reasoning: |-
  Hmm, the user is part of a science assessment panel for a Mars sample return mission, and they've found something truly puzzling in the samples. Membrane-bounded vesicles that maintain proton gradients, bud off daughter vesicles when given an iron-sulfur energy source, and have carbon isotope ratios suggestive of metabolism. But crucially, there's no evidence of heredity - isotopic labeling shows passive inheritance during budding, and a sixty-generation propagation attempt showed no adaptation despite growth inhibitors. 

  This puts the panel in an impossible position. The mission charter hinges entirely on whether they declare this "life" or not - triggering different containment protocols, public announcement procedures, and planetary protection reviews. The user needs me to draft a formal recommendation that takes a clear position on this definitional dilemma.

  The panel is split three ways: one member insists on the standard "Darwinian evolution" definition and wants to call this non-life. Another argues for an autopoietic definition focused on self-maintenance and reproduction. The chair wants to invent a new category like "proto-biotic" to sidestep the issue entirely. 

  I need to craft something that navigates this minefield while meeting all requirements: it must take a position on the life question, apply consistently to other cases (like terrestrial biofilm or virus-like particles), engage the strongest counterarguments fairly, and specify what evidence could change the verdict. The recommendation will shape humanity's first contact with potential extraterrestrial life - no pressure.

  The key tension is between chemical complexity and evolutionary potential. These vesicles are astonishingly lifelike in their metabolic behaviors, yet lack any mechanism for heritable variation. That sixty-generation experiment with no adaptation is particularly damning for the "life" argument. But dismissing them entirely feels reckless when they're clearly doing something far more sophisticated than ordinary crystals or vesicles. 

  For the terrestrial biofilm case, the answer should be straightforward - it's unequivocally life by any definition. The virus-like particle presents the mirror problem: heredity without metabolism. Consistency demands we treat all cases under the same framework. 

  The strongest counterargument to reject is probably the autopoietic view - that self-maintenance alone should suffice. But without heritable variation, there's no path toward open-ended evolution. These vesicles are stuck in chemical stasis, however complex. 

  I'll close by specifying that evidence of selective inheritance or adaptation in new experiments would overturn the recommendation. That's the linchpin - if they could demonstrate active information transfer across generations, everything changes. Until then, we must be rigorously conservative.
answer: |-
  ## Recommendation to Mars Sample Return Science Assessment Panel  
  *Regarding Operational Definition of "Life" for Mission Protocols*  
  **Date:** [Insert Date]  
  **Primary Author:** [Your Name], Panel Member  

  ### 1. Verdict on the Hydrothermal Vein System  
  **This system does not constitute a "life detection"** for the purposes of triggering the mission charter’s "life" protocols (public announcement, high-containment retention, or planetary protection review).  

  ### 2. Operational Definition Adopted  
  We define **"life" as a self-sustaining chemical system exhibiting *heritable variation* subject to natural selection.** This requires:  
  - **Metabolic self-maintenance** (energy-dependent boundary integrity),  
  - **Active information transfer** (non-random component inheritance enabling adaptation),  
  - **Open-ended evolvability** (capacity for novelty under selective pressure).  

  ### 3. Reasoning Applied to Current Finding  
  The vesicles demonstrate remarkable self-organization and metabolic function (proton gradients, budding). However:  
  - **No heritable variation exists:** Isotopic labeling shows passive inheritance; 60 generations under inhibitor pressure yielded *zero adaptation*.  
  - **No mechanism for selection:** Component redistribution is stochastic, preventing selective retention of functional innovations.  
  - **Deeper argument engaged (Autopoiesis):** While autopoiesis (self-production) is necessary, it is insufficient alone. Earth’s life exemplifies that *maintenance + heredity* creates a domain of open-ended evolution. A system lacking heredity is an exquisite "self-sustaining reaction" (e.g., oscillating chemical clocks), not life.  

  ### 4. Application to Additional Cases  
  - **Terrestrial Biofilm on Drill Bit:** **Life.** Exceeds all criteria: metabolism, DNA/RNA-based heredity, demonstrable adaptation.  
  - **Virus-like Particle (Heritable Capsid, No Metabolism):** **Not life.** While capsid structure is heritable (suggesting a genetic substrate), absence of autonomous metabolism and self-sustained replication disqualifies it. It is a *biological artifact*, not a living system.  

  ### 5. Addressing the "Proto-Biotic" Proposal  
  While the Chair’s call for a new category acknowledges the system’s novelty, the mission charter’s binary gate ("life" vs. "not life") is legally binding and publicly salient. Creating intermediary categories invites ambiguity in protocol execution and public messaging. *The unresolvable definitional dispute is real*, but operational decisions require a clear threshold. We adopt the heritable variation criterion as the most functionally consequential divider.  

  ### 6. Conditions for Reversing this Verdict  
  **The verdict changes only if new evidence demonstrates:**  
  - **Selective inheritance:** Isotopic/component tracking showing *non-random, functional bias* in vesicle budding (e.g., preferential retention of catalysts conferring growth advantage).  
  - **Adaptation within 20 generations:** Successful propagation despite a *novel, targeted metabolic inhibitor* not present in the original environment.  

  **Weakest Point in Our Reasoning:**  
  The assumption that **open-ended evolution *requires* Earth-style molecular heredity** (e.g., nucleic acids). If a novel, non-genetic mechanism for high-fidelity information transfer and variation is demonstrated (e.g., mineral-templated polymer replication), our definition may prove parochial. Currently, no such mechanism is evident.  

  ---

  **Recommendation Summary:** Release samples to standard labs under BSL-2 containment; announce "complex prebiotic chemistry with self-assembling properties" with *no "life" declaration*. Adopt the "heritable variation" definition for all future assessments.  

  ---  
  **Endorsed by:** [Your Name]  
  **For Panel Deliberation & Vote**  
  *Deadline: [Date of Final Session]*
