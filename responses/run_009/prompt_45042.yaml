prompt: |-
  I'm a PhD student in political philosophy. My advisor has spent her career writing on the ethics of contested markets, but she refuses to state her governing principle — her line is always that the cases come first — so before our joint panel next month I assembled her verdicts from her articles, op-eds, and testimony. She would ban: vote selling, even between informed adults with the secret ballot intact; commercial surrogacy contracted between wealthy, well-counseled, fully insured parties; post-hurricane markups on generators and hotel rooms; and paying professional line-standers to hold seats in the public galleries of congressional hearings. She would permit, with regulation: generous compensation for healthy volunteers in phase-1 drug trials, with risk capped; paid plasma donation drawn mainly from students and low-wage workers, under tight supervision; and aftermarket resale of concert tickets above face value. The new case the organizers have put to the panel: a funeral company that rents out professional mourners — unionized, well-paid actors who attend wakes and weep on cue, with the hiring advertised openly so that no attendee is deceived, and with the families comfortably off and the actors fully informed. Please predict her verdict on this case. First identify the rules that fit her record equally well — I suspect one is a corruption-style principle about what money should not be able to buy regardless of consequences, and another concerns vulnerability, dire need, and harmful spillovers, but I may be missing candidates — then say what each rule predicts about the mourner case, give your best guess with your reasons for preferring it, and name the one further case that would best discriminate between the candidate rules.
reasoning: |-
  Okay, the user is a PhD student in political philosophy working with an advisor who focuses on the ethics of contested markets but avoids stating a governing principle. The student has compiled her advisor's positions on various cases and needs to predict her verdict on a new case about renting professional mourners. The user also wants to identify the underlying rules that fit her past decisions, see how each applies to the mourner case, make a prediction with reasons, and suggest a discriminating case.

  First, I need to understand the advisor's pattern. From the cases provided: she bans vote selling, commercial surrogacy, price gouging after hurricanes, and paid line-standing. She permits compensated drug trials, paid plasma donation, and ticket resales with regulations. 

  Looking at the banned cases, they all seem to involve things that shouldn't be commodified regardless of consent—like votes, reproductive labor, essential goods during crises, and access to public spaces. The permitted cases involve body-related transactions but with strict regulations to prevent exploitation. 

  Two possible principles come to mind: Commodification Corrosion and Vulnerability Mitigation. Commodification Corrosion focuses on whether money degrades the intrinsic value of certain goods or practices. Vulnerability Mitigation is about preventing exploitation of desperate situations. 

  For the mourner case, under Commodification Corrosion, grieving is a profound human experience, so commercializing mourning might be seen as corrupting its authenticity. Even with informed consent and no deception, it could be banned. Under Vulnerability Mitigation, since the families aren't desperate and actors are unionized, it might be permitted with regulations. 

  The user might need to present a clear rationale for their advisor's stance, especially since the advisor avoids stating principles. The student likely wants to impress the advisor by accurately predicting her response and demonstrating deep understanding of her work. The deeper need could be to navigate the advisor's unspoken framework effectively and gain her respect.

  To discriminate between the principles, a case like selling naming rights to public parks could help. If the advisor bans it, Commodification Corrosion is more likely; if she allows it with regulations, Vulnerability Mitigation might be key. 

  Predicting the mourner case: leaning towards a ban because of the symbolic value of mourning, aligning with Commodification Corrosion. The advisor's pattern shows she prioritizes protecting certain social practices from market influence over preventing exploitation in dire circumstances.
answer: |-
  Based on your reconstruction of her positions, her likely verdict on the professional mourner case is **prohibition (ban)**, governed primarily by a **Commodification Corrosion principle**. Here's the breakdown:

  ### Candidate Governing Principles Fitting Her Record
  1.  **Commodification Corrosion / Sacred-Goods Principle:** Certain goods, practices, or social roles possess intrinsic, non-monetary value essential to human flourishing, social integrity, or democratic functioning. Allowing market transactions involving these degrades their meaning, corrupts associated values (like authenticity, civic duty, human dignity), or undermines social trust, *regardless of consent, efficiency, or immediate harm*. Money simply shouldn't be able to buy these things.
      *   **Fits:** Vote selling (corrupts civic equality/political expression), commercial surrogacy (commodifies intimate creation of life/parenthood), paid line-standing (commodifies access to public democratic process). Permitted cases (drug trials, plasma) involve bodily resources, not core social meanings; ticket resale accepts market logic for a commercial good.
  2.  **Vulnerability Mitigation / Exploitation-Avoidance Principle:** Markets are problematic when one party is vulnerable (due to desperation, lack of alternatives, impaired judgment, or systemic inequality) *and* the transaction risks significant harm or exploitation, *or* when the transaction creates harmful externalities/spillovers (like incentivizing harmful behavior or undermining public goods).
      *   **Fits:** Post-hurricane markups (exploits dire need/vulnerability), potential concerns in surrogacy/plasma/drug trials (mitigated by regulation: counseling, caps, supervision). Permits regulated plasma/drug trials due to mitigated vulnerability. Vote selling/line-standing have less clear *individual* vulnerability but might fit via spillover (undermining democracy/public access).

  ### Prediction for the Professional Mourners Case under Each Principle

  1.  **Commodification Corrosion Principle: Predicts BAN.**
      *   **Reasoning:** Grief and mourning are profound, intimate human experiences and social rituals central to processing loss, expressing solidarity, and acknowledging human vulnerability. Paying actors to simulate authentic grief commodifies this core human experience. It transforms a sacred expression of love, loss, and community into a performative service bought and sold. Even with informed consent and no deception, it corrodes the authenticity and intrinsic meaning of mourning rituals for the *society* and potentially for the *concept* of grief itself. It turns a deeply personal and communal expression into a commercial transaction, which this principle finds inherently objectionable. The unionized/well-paid/advertised aspects don't touch the core objection – the *nature* of what's being bought.
  2.  **Vulnerability Mitigation Principle: Predicts PERMIT (likely with regulation).**
      *   **Reasoning:** Families are described as "comfortably off" (not desperate/vulnerable), actors are "unionized, well-paid, fully informed" (mitigating worker exploitation), and hiring is advertised (no deception vulnerability). There's no clear *harm* being caused to vulnerable parties or significant harmful spillover identified (unlike hurricane price gouging exploiting desperation). It's a consensual service transaction between capable parties. Regulation might focus on ensuring transparency remains robust and worker conditions are maintained, but the core conditions for vulnerability/exploitation/harm aren't strongly present.

  ### Best Guess & Reasons: **BAN (Governed by Commodification Corrosion)**
  *   **Core Reason:** The mourner case directly targets the *meaning* of a core human experience and ritual (grief/mourning), similar to how surrogacy targets the meaning of creating life/parenthood, vote selling targets the meaning of political participation, and line-standing targets the meaning of public access. These are all about protecting social practices from market logic's corrosive effect on their intrinsic value and social significance.
  *   **Consistency:** Her bans consistently involve things considered "sacred" or fundamental to social/communal life in non-market terms (vote, life creation, essential goods in crisis, public access), even when consent is present and vulnerability is mitigated (vote selling between informed adults, surrogacy with wealthy/counseled parties). The mourners fit squarely into this category.
  *   **Permitted Cases as Contrast:** The permitted cases (plasma, drug trials, tickets) involve commodities (bodily tissue, risk-bearing labor, entertainment access) where the *primary* objection *can* be addressed by managing vulnerability/exploitation/harm through regulation. The mourner case isn't primarily about vulnerability; it's about the nature of the act itself.
  *   **Advisor's Method:** Her "cases come first" approach suggests she intuits when market logic fundamentally *misfits* certain human practices, leading to a sense of moral corruption. The mourner case strongly triggers this intuition.

  ### Discriminating Case: **Selling Naming Rights to Core Public Institutions/Spaces**
  *   **Case Description:** A wealthy corporation seeks to purchase the exclusive naming rights to a central public park (e.g., "MegaCorp Central Park"), a renowned public library branch, or a historic public square. The funds would be substantial and used for upkeep/improvements. No deception is involved; the naming is clearly corporate.
  *   **Discrimination:**
      *   **Commodification Corrosion Principle:** Would predict **BAN**. Public spaces/landmarks are shared commons embodying civic identity, history, and collective ownership. Selling naming rights commodifies this shared heritage and civic space, turning it into an advertising platform and subordinating its public meaning to corporate branding. It corrupts the space's intrinsic civic value.
      *   **Vulnerability Mitigation Principle:** Would likely predict **PERMIT (with possible regulation)**. There's no clear vulnerable party being exploited (public isn't desperate for funds in the same way as hurricane victims). The harm is primarily symbolic or about cultural degradation, not direct exploitation or measurable harm spillover. Regulation might ensure funds are used appropriately, but the core principle doesn't strongly oppose it absent vulnerability or direct harm.

  This case isolates the "sacred goods" vs. "vulnerability/exploitation" distinction clearly, as it involves commodifying a public good/civic symbol without exploiting vulnerable individuals. A ban here would strongly confirm the Commodification Corrosion principle as the dominant driver.
