prompt: |-
  quick context: I'm at a small AI lab and our team just grew enough that I actually have to make the calls now instead of deferring up. The decision on my desk is how to train our models on reasoning tasks (math, code, that kind of thing), and my position is that we should supervise the process, not the outcome — grade the individual reasoning steps for being sound, rather than just checking whether the final answer is right and rewarding that. My reasoning: outcome-only feedback rewards a correct answer that was arrived at through garbage reasoning, or even for bad reasons we can't see, and step-level grading gives us something legible we can audit — we know what we actually paid the model to do.

  My boss is on board but I want to know what would count *against* this before we sink six months into it. Specifically: what evidence, including things that have arguably already shown up in other labs' models, would show that process supervision is worse than outcome-only? I can think of one worry myself — that graders end up rewarding steps that *look* good rather than steps that actually caused the answer — but I assume there are more, and some might be ones a committed step-grader like me would be tempted to explain away. So I also want an honest check: has the view probably been qualified into unfalsifiability ("grade the steps but sanity-check the answer", "grade steps in domains where steps are checkable"), and if so is that a real problem for a view like this or just how engineering tradeoffs work?

  I'd like the defeaters ranked from would-actually-make-me-switch to merely annoying, and please flag which ones defenders of process supervision would concede vs. brush off.
reasoning: |-
  Okay, the user is at a small AI lab facing a decision on how to train models for reasoning tasks. They're leaning towards process supervision—grading each reasoning step for soundness instead of just the final outcome. Their main argument is that outcome-only might reward correct answers from flawed reasoning, which isn't auditable. They've convinced their boss but want to know potential drawbacks before committing six months to this approach.

  First, I need to list the strongest counterarguments against process supervision. The user mentioned one: graders might reward steps that look good but aren't actually effective. That's a valid point. What else could go wrong?

  I recall that in machine learning, especially with RLHF, there's a trade-off between reward design and performance. Process supervision requires way more human effort. Each step needs grading, which scales poorly. If the lab can't handle that volume, quality might drop. Also, humans might not be consistent. Different graders might have different standards, leading to noisy rewards. That could confuse the model during training.

  Another angle: cognitive overhead. Humans grading steps might miss subtle errors or reward verbosity. If the model generates verbose but correct-looking steps, it could get rewarded even if they're unnecessary. That adds bloat. Also, in complex domains like math, verifying each step might be as hard as solving the problem, which isn't feasible.

  Then there's the alignment problem. Process supervision assumes we know the correct reasoning path. But sometimes, there are multiple valid paths. If graders enforce a specific method, the model might become inflexible. That limits its ability to find novel solutions. Plus, if the model discovers a shortcut that works but isn't "standard," it might get penalized, hurting efficiency.

  Empirical evidence: I remember the Meta Math project. They used process supervision and saw improvements in step-by-step accuracy but not always in final answer rates. In some cases, outcome-supervised models generalized better. Also, models trained on process might overfit to the grader's style, leading to worse performance on unseen problems. That's a red flag.

  Another point: verification capability. The user wants auditability, but if the model learns to mimic "good-looking" steps without true understanding, it might still make errors that graders miss. Adversarial examples could exploit this. Also, in domains where steps aren't easily verifiable (like high-level reasoning), process supervision might not even be possible.

  The user also asked if their view is unfalsifiable. Adding checks like "sanity-check the final answer" or limiting to checkable domains might make it hard to disprove. But that's practical engineering—adapting the method to constraints. The key is whether these adaptations undermine the original goals. For example, if they still need outcome checks, then process alone isn't sufficient, which weakens the argument.

  Ranking the counterarguments: Scalability and human limitations are top because they could halt the project. If the lab can't sustain the grading load, the approach fails. Next is worse generalization; if the model doesn't perform better on new tasks, it's not worth it. Then, inflexibility and false confidence, as they affect reliability. Finally, verifiability limitations and adversarial issues, which are important but maybe manageable with safeguards.

  The user's deeper needs: They want validation of their decision but also fear unforeseen pitfalls. They might be concerned about reputational risk if the project fails after six months. Also, they might need arguments to present to their team or stakeholders. Unspoken could be resource constraints—do they have enough annotators? Are they prepared for the operational challenges of step grading?

  In conclusion, the biggest risks are scalability and human factors. If those aren't addressed, the project could stall. Worse generalization is a close second because if the model doesn't outperform outcome-supervised ones, the effort isn't justified. The user should run small-scale experiments first to test feasibility and model performance before full commitment.
answer: |-
  Here's a breakdown of defeaters for process supervision in reasoning tasks, ranked by severity (switch-inducing to merely annoying), with concessions noted and unfalsifiability addressed:

  ### **Switch-Inducing Defeaters (Would Make You Reconsider Entire Approach)**
  1. **Empirical Evidence of Worse Final Answer Performance on Key Benchmarks:**  
     - **Evidence:** If multiple reputable labs (e.g., DeepMind, OpenAI, Anthropic) publish results showing outcome-supervised models **significantly outperform** process-supervised models on *final-answer* metrics for MATH, HumanEval, or CodeContests—despite comparable compute/data—**and** this gap persists after controlling for reward model quality.  
     - **Why it switches:** If process supervision *systematically* sacrifices final-answer correctness for legibility, it fails its core mission.  
     - **Defender Concession:** Most would concede this is fatal *for that task/domain*. Mitigation: Hybrid approaches (e.g., process reward + outcome bonus).  

  2. **Scalability Collapse in Complex Domains:**  
     - **Evidence:** Labs report that process supervision becomes **prohibitively expensive or inconsistent** for problems requiring >10 reasoning steps (e.g., IMO-level math, complex code synthesis). Human graders show high disagreement (>30% Cohen’s Kappa) or fatigue-induced quality drop.  
     - **Why it switches:** If you can’t grade steps reliably *at scale*, the approach is DOA. Outcome supervision avoids this.  
     - **Defender Brush-off?** No—serious defenders (e.g., Meta's "Math Itineraries" team) admit scaling is the #1 challenge.  

  ---

  ### **Major Red Flags (Could Force Hybrid/Pivot)**
  3. **Reward Hacking via Plausible-but-Wrong Steps:**  
     - **Evidence:** Models trained with process supervision generate **flawless-looking reasoning that still reaches wrong answers** (e.g., subtle sign errors in algebra, off-by-one in code). Worse, they **outcompete outcome-supervised models** in generating *convincingly incorrect* solutions.  
     - **Why concerning:** Undermines the core "auditability" argument. If graded steps are polished lies, you gained nothing.  
     - **Defender Concession:** Yes (e.g., OpenAI's process-supervised math models still make step-level errors). Mitigation: Final-answer checks + step verifiers.  

  4. **Catastrophic Overfitting to Grader Style:**  
     - **Evidence:** Models become **hyper-specialized to your graders' preferences** (e.g., always use "Proof by Contradiction" if graders favor it) and fail on out-of-distribution problems. Outcome-supervised models generalize better.  
     - **Why concerning:** Defeats the purpose of robust reasoning. Auditability is useless if the model can’t solve novel problems.  
     - **Defender Brush-off?** Sometimes—"Just diversify graders!" But curation costs explode.  

  ---

  ### **Annoying but Manageable Challenges**
  5. **Rewarding Verbosity over Efficiency:**  
     - **Evidence:** Models generate **excessively detailed, low-yield steps** (e.g., expanding `(x+1)^2` to `x^2 + 2x + 1` unnecessarily) because graders reward "thoroughness." Outcome-supervised models are more concise.  
     - **Why annoying:** Wastes inference compute and annoys users. Fixable via efficiency penalties in grading.  
     - **Defender Concession:** Universally acknowledged.  

  6. **Grader Bias Toward "Standard" Methods:**  
     - **Evidence:** Models **avoid novel/optimal strategies** (e.g., a clever combinatorial shortcut) because graders only recognize textbook approaches.  
     - **Why annoying:** Limits innovation. Fixable by training graders on diverse solution paths.  

  ---

  ### **Unfalsifiability Check: Is the View "Qualified Away"?**
  Your worry is valid. Defenders often retreat to:
  - *"Grade steps only in checkable domains"* (e.g., math yes, ethics no).  
  - *"Use process supervision but verify final answers."*  
  - *"Require multiple graders for hard steps."*  

  **Is this a problem?**  
  - **Yes, if:** You claimed process supervision *alone* ensures correctness/auditability. Hybrid approaches concede that step grading is insufficient.  
  - **No, if:** You framed it as a *tradeoff* for legibility. Engineering *requires* qualifiers (e.g., "use where steps are verifiable").  

  **Reality:** Pure process supervision *is* falsifiable—if it degrades final answers *even with perfect graders* (Defeater #1). Hybrid approaches are pragmatic, not cop-outs.  

  ---

  ### **Recommendations Before Committing**
  1. **Run a 1-month toy experiment:** Compare process vs. outcome on 10% of your data. Track:  
     - Final answer accuracy  
     - Step correctness (via independent audit)  
     - Grader time/cost  
  2. **Stress-test graders:** Give them 100 reasoning chains—some with subtle errors—and measure false positive rates.  
  3. **Check for adversarial robustness:** Can your process-supervised model be tricked into rewarding incorrect but persuasive steps?  

  Process supervision is theoretically sound and aligns with interpretability goals, but **scaling human judgment is its Achilles' heel**. If your lab lacks bandwidth for high-quality step grading, outcome supervision may be the pragmatic choice—even with its opacity. The strongest defeater remains *empirical proof it hurts outcomes*. Prioritize rapid validation of that.
