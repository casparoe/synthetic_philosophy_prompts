  The top two rules are **Strict Etiological (Rule 1)** and **Recent Selection (Rule 2)**. They overlap in most cases but diverge when a trait has deep historical selection but no recent maintenance, or when selection is very recent but not long-established. A case involving a trait that was historically selected but is no longer under selection in a derived population can discriminate between them.

  **Discriminating Case: Island Insect Wings**  
  - **Description**: A population of insects colonizes a small, wind-swept island. Over millennia, wings become a liability (they cause blow-away deaths), and selection favors wing reduction. Now, 50% of the population has vestigial wings (non-functional and not maintained by selection), while 50% has full wings (due to genetic drift). The full wings still allow flight, but flight is disadvantageous and not selected for; the wings persist solely due to drift.  
  - **Key elements**:  
    - Historical selection: Wings were selected for flight in the ancestral mainland population.  
    - Recent context: On the island, flight is maladaptive, and there is no current selection for wings (only drift maintains them). Vestigial wings are not maintained at all.  
  - **Expected verdicts under each rule**:  
    - **Strict Etiological Rule (Rule 1)**: Wings have the function of flight, even in the island population, because they were historically selected for flight. Malfunction occurs if wings fail at flight (e.g., vestigial wings). This matches her verdict on the misfolded ion channel (Case 6).  
    - **Recent Selection Rule (Rule 2)**: Wings have no function, because there is no recent or ongoing selection for flight on the island. Vestigial wings also have no function. This would align with her cave fish verdict (Case 2), treating wings as non-functional due to lack of maintenance.  
  - **Why it discriminates**:  
    - Rule 1 prioritizes historical selection, so wings retain the flight function.  
    - Rule 2 requires recent/ongoing selection, so wings lose their function in the island context.  
    - Her verdict on Case 6 (malfunction) suggests she would say the wings still have the function of flight, even if maladaptive, because they were selected for it. This would support Rule 1 over Rule 2.

  ### Exposing a Hybrid Approach
