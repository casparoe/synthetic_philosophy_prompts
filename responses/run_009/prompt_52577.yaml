    - **Natural "lucky mutation" case**: Suppose a wild mouse has a novel, non-selected mutation that fortuitously stabilizes a critical protein. The mutation is indispensable for survival but arose yesterday and hasn't been subject to selection.  
      - Hybrid approach might attribute function here (systemic role) but not to the spacer, exposing inconsistency.  
      - Strict etiological consistency (her stated view) would deny function in both, as neither has a selection history.  

