  - **Pattern that exposes hybridism**: If she denies function for the synthetic spacer (no selection) but attributes function to a similar indispensable trait in a natural organism with no selection history (e.g., a "lucky mutation" that has not yet been selected but is vital), she would be pluralist.  
  - **Test with cases**:  
