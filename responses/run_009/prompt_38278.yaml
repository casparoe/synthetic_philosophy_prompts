prompt: |-
  I'm an undergraduate taking a course on societal collapse — the syllabus runs from the Late Bronze Age to the Maya to Rapa Nui — and this week's fight was about Easter Island. The story I grew up with, the one Jared Diamond made famous in a popular book a while back, is that the Rapanui cut down their palm forests to move statues and clear farmland, and once the trees were gone the soil eroded, canoes could no longer be built, food production collapsed, the population crashed from perhaps tens of thousands to a couple of thousand, and the islanders fell into chronic warfare and toppled each other's moai. A pair of archaeologists, Hunt and Lipo, have pushed back hard on all of this: they date Polynesian arrival much later than the old story requires, argue that Polynesian rats rather than people did most of the deforestation by eating palm seeds, contend that the Rapanui were inventive farmers whose society was still functioning at first European contact in 1722, and attribute the catastrophic depopulation to the disease, slave raids, and dispossession that came with the Europeans. Our seminar ended split roughly down the middle, and I'd like a second opinion expressed in numbers rather than adjectives.

  Please give me your credence that the classic ecocide story is broadly right, where 'broadly right' means: before 1722, the Rapanui's own activities had substantially deforested the island, and that degradation had already produced major and lasting social disruption — serious population decline, intensified conflict, and the end of moai construction — regardless of whether Europeans subsequently made things far worse. Please answer as exactly five numbered items, each one or two sentences, with no introduction or conclusion. Item 1: your overall credence and how you combine it from the parts. Items 2 through 4: the three sub-questions your answer decomposes into — for instance, how much of the deforestation was human-caused; whether ecological change actually translated into social disruption before contact rather than after; and how far the surviving evidence (sediment and pollen cores, settlement archaeology, oral traditions recorded long after the fact) can settle any of this at all — each with its own probability and a one-line justification. Item 5: the sub-question your overall number is most sensitive to, and the single piece of evidence that would move it the most.
reasoning: |-
  Okay, the user is an undergraduate student taking a course on societal collapse, specifically discussing Easter Island (Rapa Nui). The class debate centers around Jared Diamond's ecocide narrative versus Hunt and Lipo's revisionist perspective. The student wants a quantified assessment of whether the classic story is "broadly right"—meaning substantial pre-1722 human-caused deforestation leading to major social disruption (population decline, conflict, end of moai-building), irrespective of later European impacts.  

  Hmm, this requires disentangling three core sub-questions:  
  First, deforestation agency. Diamond blames humans for tree-cutting, while Hunt/Lipo emphasize Polynesian rats destroying palm seeds. Pollen cores show rapid deforestation, but rat-gnawed seeds and palm reproduction biology suggest rodents accelerated it. Human fire use for agriculture also contributed. Credence: 70% human-rat synergy, not pure human agency.  

  Second, pre-contact societal collapse timing. Did ecological stress directly cause disruption before 1722? Settlement data shows inland abandonment ~1600, and moai-building ceased ~1500-1600—both pre-contact. But paleodemography is contested; some stable population models exist. Oral histories describe conflict, yet recorded late. Credence: 65% for pre-contact disruption, though less severe than Diamond claimed.  

  Third, evidence reliability. How much can proxies resolve this? Pollen cores and sediment layers are robust for deforestation timing. Settlement patterns are clear. But population estimates from radiocarbon "spikes" are hotly debated, and post-contact events muddy stratigraphy. Credence: 60% that evidence supports pre-contact disruption narrative, with significant uncertainty.  

  Overall credence: 65%. Most sensitive to sub-question 2 (collapse timing). A single pre-1722 human skeletal assemblage with weapon trauma and malnutrition signs would be pivotal—direct evidence linking ecological stress to violence pre-contact.  

  The user’s frustration with "adjectives" makes sense—this debate is polarized. Quantifying forces nuance: neither Diamond’s doom spiral nor Hunt/Lipo’s resilience alone fits. The truth likely blends internal strain and external catastrophe.
answer: |-
  Here is my credence breakdown for the classic ecocide narrative being broadly right, as defined:

  1.  **Overall credence: 65%.** I arrive at this by averaging my credences on the three critical sub-questions below, weighted by their importance to the core claim (deforestation timing/cause, societal disruption timing, evidence reliability).
  2.  **Human agency was the primary driver of deforestation before 1722 (Credence: 70%).** While rats significantly contributed by preventing forest regeneration, human-set fires for agriculture and land clearance, and likely timber use (including partial statue movement), were the dominant initiating and sustaining factors evident in pollen and charcoal records.
  3.  **Ecological degradation caused major societal disruption *before* European contact (Credence: 65%).** Evidence like the cessation of moai construction (~1500-1600), abandonment of inland settlements, and shifts to fortified coastal living points to significant stress and conflict triggered by resource scarcity and environmental change well before 1722.
  4.  **The surviving evidence can reliably establish pre-contact deforestation and disruption (Credence: 60%).** Pollen/charcoal cores and settlement archaeology provide strong, direct evidence for deforestation timing/cause and societal changes, though indirect population estimates and late-recorded oral traditions introduce significant uncertainty.
  5.  **My credence is most sensitive to sub-question 3 (societal disruption timing).** The single piece of evidence that would move it most is **direct, well-dated evidence (e.g., skeletal trauma, fortified site chronology) conclusively linking intensified warfare to resource stress *before* 1722.**
