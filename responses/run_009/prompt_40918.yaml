  I'm a numerical relativist — my working vocabulary is the ADM 3+1 split, gauge conditions, constraint equations, and gravitational-wave extraction at null infinity — and my knowledge of the old debate about absolute space is limited to a historical footnote: Newton, Leibniz, something about a bucket. Restate the substantivalism/relationism debate in the language I actually think in, as faithfully as you can. Treat Newton's arguments for absolute space — the bucket, the rotating globes — as claims about entities in my formalism; restate Leibniz's shift argument in terms of diffeomorphisms and gauge; and say what "space is a real thing" comes to when the metric is a dynamical field on a manifold and diffeomorphism invariance is a gauge symmetry of the theory. Use the hole argument and Einstein's point-coincidence reasoning where they do real work, and tell me what, in a universe governed by the field equations I solve, the water in Newton's bucket is rotating with respect to — including whether Mach's principle comes out true, false, or something in between once you account for frame dragging and known rotating-source solutions. Then give me the residue report: which parts of the seventeenth-century debate survive the translation cleanly, which survive only with distortion, and which have no expression in my vocabulary at all. I'd also like a verdict on a claim a philosopher colleague made to me: since the metric is a genuine dynamical entity, general relativity is substantivalism in disguise. Is that a fact about my formalism or a philosophical gloss on it? And when something refuses to translate, tell me whether the fault lies with the physicist's vocabulary — something the philosophers saw that I have no way to say — or with the original debate, which was less clear than it looked. I want the translation to be honest: don't quietly assume GR's own commitments and present them as the translation, and don't treat the residue as an embarrassment to be smoothed over — it's the part I care about most.
