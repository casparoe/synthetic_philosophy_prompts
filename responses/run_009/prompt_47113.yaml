prompt: |-
  I'd like your read on a running argument my friend and I have. She believes in karma, and her version of it is explicitly a theory of moral desert: roughly, the harm you are responsible for comes back to you in proportion to that responsibility, and the good you are responsible for comes back to you likewise. She has issued verdicts on cases as they have come up over the years, and I have kept a list:

  1. A hunter who kills animals for sport and relishes it: heavy bad karma.
  2. A committed vegetarian who, without knowing, is served a dish containing meat at a friend's house: no karma at all.
  3. A slaughterhouse worker who does the job without relish because it is the only work available to him: bad karma, but far lighter than the sport hunter's.
  4. An attentive driver who kills a child that darts into the road when stopping in time is impossible: no karma.
  5. A person who, in genuine fear, shoves an armed mugger, who falls, strikes his head, and dies: no karma.
  6. Someone who pays a third party to injure an enemy, doing none of it himself: bad karma, nearly as heavy as if he had done it with his own hands.
  7. A donor who gives generously to charity chiefly to be admired, with little real concern for the recipients: some good karma, but much less than the same gift given anonymously and from the heart.

  Four new cases are now on the table, and I want your prediction of her verdicts before we discuss them:

  A. A man who spends his final decade nursing a grudge, drafting and refining an elaborate plan of revenge in obsessive detail, but who never acts on it and dies without having harmed anyone.
  B. A juror who conscientiously votes to convict on testimony that later turns out to be perjured; the innocent defendant spends twenty years in prison.
  C. An heir who inherits a fortune built on his grandfather's brutal exploitation of workers, harms no one, lives comfortably off the income, and donates generously from it.
  D. A driver who kills a pedestrian while texting, is immediately and sincerely remorseful, and bore the pedestrian no ill will.

  I care less about the four verdicts themselves than about which rule she is actually running. Her track record looks to me consistent with more than one principle — for instance, one on which the ledger tracks the quality of the agent's will, and one on which it tracks the agent's causal responsibility for outcomes — and the four cases seem designed (by fate, not by me) to pull them apart. So please: identify the candidate rules that fit her verdicts so far, note any verdict a given rule has to strain to accommodate, give your best guess on each of A through D with your reasons, say which of the four would best discriminate between the rules you think are still tied, and describe one further case, not among the four, that would settle it decisively.

  Please answer with a brief prose lead-in of at most 100 words, followed by a JSON object and nothing after it. The schema:

  {
    "candidate_rules": [
      {
        "name": "short label",
        "statement": "one or two sentences stating the rule",
        "precedent_fit": "which of verdicts 1-7 it handles cleanly, and which it must strain to fit"
      }
    ],
    "predictions": [
      {
        "case": "one of A, B, C, D",
        "verdict_by_rule": "what each candidate rule implies for this case",
        "best_guess": "the verdict you predict she will give",
        "confidence": "low, medium, or high",
        "reason": "why the best guess is preferred"
      }
    ],
    "discriminating_analysis": {
      "most_informative_of_the_four": "which case, and why",
      "residual_ties": "which rules remain unseparated even after it"
    },
    "further_case": {
      "description": "a new case, not A-D",
      "what_it_would_settle": "which rules it separates and how"
    }
  }
reasoning: |-
  Alright, let's tackle this karma theory puzzle. The user wants to understand which rule their friend is using based on past verdicts and predict her judgments on four new cases. 

  First, looking at the friend's previous verdicts: the sport hunter gets heavy bad karma, the accidental meat-eater none, the slaughterhouse worker lighter bad karma. The driver who killed a child accidentally has no karma, but the person who kills a mugger in genuine fear also gets no karma. Hiring someone to hurt an enemy gets nearly full bad karma, and donating for admiration gets reduced good karma. 

  Two main candidate rules seem to fit: Quality of Will (focusing on intentions and attitudes) and Hybrid Volitional Responsibility (combining intent and causal role). For example, Case 2 (vegetarian eating meat unknowingly) fits Quality of Will perfectly since there's no ill intent. Case 3 (slaughterhouse worker) might strain a pure intent rule since the worker has no ill will but still gets some bad karma—Hybrid handles this better by adding causal responsibility. Case 6 (hiring a hitman) fits both rules well because the intent is malicious, even if they didn't physically act. 

  Now, predicting the new cases:

  Case A: The man nurses a grudge but never acts. Quality of Will would assign bad karma because of his malicious intent, even without action. Hybrid might give lighter karma since there's no actual harm. The friend will likely say heavy bad karma here, given her past emphasis on inner malice (like the hunter who relishes killing). Confidence is high because intent seems crucial to her.

  Case B: The juror convicts innocently based on perjured testimony. Quality of Will focuses on the juror's conscientious intent, so no bad karma. Hybrid might assign some due to causal role in the outcome. The prediction is no bad karma, as the juror acted in good faith. Medium confidence because Hybrid could go either way.

  Case C: The heir benefits from exploitation but donates generously. Quality of Will sees no ill intent, so no bad karma. Hybrid assigns bad karma for benefiting from harm. Prediction is bad karma here because the grandfather's exploitation matters, even if the heir didn't cause it. High confidence based on Case 6, where paying for harm brought heavy karma.

  Case D: The texting driver kills someone but is remorseful. Quality of Will assigns bad karma due to recklessness (poor intent while texting). Hybrid also assigns bad karma because of direct causation. Prediction is bad karma despite remorse. High confidence since recklessness shows poor intent, similar to the hunter's disregard.

  Case C is the most informative because it separates Quality of Will (no bad karma) from Hybrid (bad karma). The friend's verdict here will likely favor Hybrid, given her judgment on Case 6 (paying for harm). Residual ties might persist with Hybrid and a stricter intent rule, but Hybrid seems more consistent.

  A further case: Someone accidentally causes harm while acting virtuously (e.g., a doctor causing a fatal error during a sincere rescue attempt). Quality of Will would say no bad karma due to good intent, while Hybrid would assign some for causal responsibility. This would clarify if intent alone absolves or if causation plays a role.
