  For my argument, I'll focus on the continuation of valued projects rather than species survival. I can point to how we already value non-biological continuations in other contexts - like institutions outliving individuals, or digital archives preserving culture. The key is whether our contributions persist in a chain of valuing beings, regardless of their biology.

  I need to give the strongest form to the "hollow substitute" objection. People might feel that machines completing human projects would lack authenticity - like a symphony finished by AI might feel like a technical exercise rather than a human expression. I'll acknowledge this emotional weight but argue that the meaning comes from the project's continuation in a valuing community.

  For the second objection, I'll admit that Scheffler emphasizes human-like beings with futures they care about. But I'll argue that if successors have internal perspectives and the capacity to value, they can fulfill this role. The dependence is on the persistence of valuing consciousness, not DNA.

