  Based on your friend's consistent pattern across the past rulings, I've predicted her verdicts for the three new situations. Her rule seems to center on whether the critic exempts themselves from the moral standard they apply to others—essentially, a form of hypocrisy where the critic creates an exception for their own behavior while holding others accountable. This is distinct from merely sharing the vice (even in a diluted form) or contributing to the prevalence of the wrong, as her past cases show that standing is denied only when there's a lack of personal consistency in applying the standard. Reform with full acknowledgment of past wrongs (like the uncle) can restore standing, as it demonstrates commitment to the standard without exemption.

  Here's a summary of her apparent rule:
  - **Standing is lost by exempting oneself from a standard one applies to others**: If a critic argues that their own similar behavior is "different" or justified in a way that others' is not, they lack standing. This exemption can be based on scale (e.g., "mild" vs. "severe" wrongdoing), context, or personal justification. Standing is maintained if the critic applies the standard uniformly—either by not engaging in the vice at all, or by reforming and acknowledging their own past faults without exception.

  ### Predicted Verdicts for the Three New Situations
  1. **Marketing director (condemns brother for gambling while working for sports-betting apps)**:  
     - **Predicted verdict: Standing**.  
       - **Explanation**: The director does not exempt himself from the standard—he personally disapproves of gambling, would condemn his own hypothetical gambling, and does not engage in the vice. While he contributes to the prevalence of gambling through his work, your friend's past rulings suggest that contributing is not the issue; the focus is on personal hypocrisy. Since he applies the anti-gambling standard uniformly to himself and others (even hypothetically), he is consistent. This mirrors the uncle's case, where reform and acknowledgment created standing, but here the director has no vice to reform from. The contributing factor (his job) doesn't override this consistency, as per the officemate case, where contributing (eating meat) was only relevant because of exemption.

  2. **Book club member (condemns gossiping after giving it up but justifying her past)**:  
     - **Predicted verdict: No standing**.  
       - **Explanation**: The book club member exempts herself from the standard by claiming her past gossiping was justified and that she would do it again. This creates a double standard: she applies the anti-gossiping rule to others but not to her own past (or potentially similar future) actions. Even though she no longer gossips, her lack of acknowledgment that her past behavior was wrong means she isn't applying the standard uniformly. This contrasts with the uncle, who acknowledged his past DUIs as wrong, making his rebuke costlier but legitimate. Here, the exemption—similar to the stepfather's "red lights don't count" reasoning—disqualifies her from being the critic.

  3. **Neighbor (condemns speeding in a school zone while admitting to mild speeding on highways)**:  
     - **Predicted verdict: No standing**.  
       - **Explanation**: The neighbor exempts himself from the full standard against speeding by treating highway speeding as "mildly wrong" and acceptable (or at least tolerable) while condemning school zone speeding as egregious. This is akin to the stepfather exempting red-light texting and the officemate exempting grocery-store meat—he creates a hierarchy of wrongness to justify his own behavior. Even though he admits mild speeding is wrong, he still engages in it and doesn't hold himself to the same strict standard he applies to others. His behavior is a diluted form of the same vice, but the denial of standing stems from the exemption, not the dilution itself.

  ### The Rule She Seems to Be Running
  Your friend's rule appears to be: **Standing is lost by exempting oneself from the standard one applies to others**. This means that a critic must apply the moral standard consistently to themselves and others; any attempt to carve out an exception for one's own behavior—based on context, severity, or personal justification—invalidates their standing, even if the criticism is factually correct. This rule is distinct from:
