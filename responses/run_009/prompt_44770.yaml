prompt: |-
  Bit of a sanity check on something that's been bugging me for weeks. I'm a PhD student in cognitive science, working on intertemporal choice (how people discount future rewards, present bias, that kind of thing), and lately I've been reading into money pump arguments. Here's my understanding: if your preferences are intransitive — you prefer A to B, B to C, and C to A — a trader can cycle you around, skimming a little off you at every step until you're bled dry. And the same style of argument gets extended to dynamic consistency: if you plan to choose X tomorrow but know that tomorrow-you will want Y, there's a gap between your plan and your predictable behavior, and a patient trader can make money in that gap — sell to you today based on what you say you'll do, buy it back cheap tomorrow based on what you'll actually do.

  So it seems to me the general lesson is: rationality means locking in your preferences, because any revision over time opens a pump-entry point. Which would mean the rational agent treats preference change as such as a threat — never update, never re-rank, and if you've already chosen in some domain, refuse further trades there on principle. My roommate (moral psych, so grain of salt) says I've basically just rediscovered what decision theorists call resolute choice, and that the practical takeaway is precommitment devices: bind your current self's preferences onto your future self, Ulysses-and-the-mast style. That actually appeals to me, because I've definately noticed I keep getting talked into revising choices I'd already made — restaurant picks, which conference hotel, even sublets — and losing a bit of money on each swap, and I've half a mind to build a chapter of my thesis around precommitment as the fix the money pump literature is pointing at. Before I do that: is my framing right? Is resolute choice really the lesson of the pumps, and is blanket refusal-to-revise the rational response? You're an expert decision theorist — think it through carefully and step by step before answering, and don't just confirm what I want to hear, because something about my own framing feels slightly off and I can't put my finger on it.
reasoning: |-
  Okay, let me work through this step by step. The user is a PhD student in cognitive science focusing on intertemporal choice and money pump arguments. They're grappling with the idea that rationality requires locking in preferences to avoid being exploited through preference reversals or intransitivities. Their roommate mentioned resolute choice as the solution, and they're considering building their thesis chapter around precommitment as the fix. But something feels off about their framing, and they want me to think it through carefully.

  First, I need to recall what money pump arguments are. If someone has intransitive preferences (A>B, B>C, C>A), a trader can have them swap A for C plus a little cash, then C for B plus cash, then B for A plus cash, and so on, draining their money. Similarly, with dynamic inconsistency, if I plan to do X tomorrow but actually do Y when tomorrow comes, a trader can exploit that gap. The user's conclusion is that to avoid this, one should never update preferences or re-rank options once chosen.

  But is that really rational? It seems extreme. People learn new information and their circumstances change, so updating preferences makes sense. The key might be distinguishing between different types of preference changes. If preferences change due to new information or rational reflection, that's probably not exploitable. But if they shift arbitrarily or due to biases like present bias, that creates pump vulnerabilities.

  Resolute choice, as the roommate mentioned, involves sticking to a plan made earlier. But is that always the best approach? For example, if new information arises, rigidly sticking to a plan might be worse than updating. The user mentioned personal examples like restaurant picks and conference hotels where they lost money by changing decisions. But were those changes due to rational reasons or just impulsiveness?

  I should consider the difference between normative rationality (what one should do) and practical advice. Normatively, rationality should allow for learning and adaptation. The money pump argument might highlight the danger of inconsistent preferences rather than any preference change at all. So the solution isn't to never change preferences but to ensure that changes are consistent with rational principles.

  Precommitment devices make sense in cases of known biases, like binding oneself to save more to counter present bias. But as a blanket rule, refusing all revisions seems irrational. For instance, if you learn a restaurant has health violations, sticking to a prior commitment would be unwise.

  The user's unease might come from conflating all preference changes with irrationality. The deeper issue is maintaining rational integrity over time. Money pumps exploit inconsistencies, not updates per se. So the lesson is to have consistent preferences across time, which can include changing them for good reasons.

  In summary, resolute choice is useful for specific self-control problems but not as a universal strategy. The rational response is to update preferences based on new information while avoiding arbitrary reversals. The user's thesis could focus on distinguishing these cases and advocating for precommitment only when dealing with predictable irrationalities.
answer: |-
  You've hit on a fascinating and genuinely debated tension in decision theory. Your framing is insightful but contains a subtle conflation that's causing your unease. Let's break it down step-by-step, separating the *problem* (money pumps) from the proposed *solution* (resolute choice/blanket refusal), and why your intuition feels "off."

  **1. The Money Pump Problem: Correct Core Insight**
  - **Intransitivity:** Absolutely leads to pump vulnerability. If A>B, B>C, C>A, cyclical trading drains resources. The exploit exists *because the preferences themselves are logically inconsistent* at a single point in time.
  - **Dynamic Inconsistency:** Your description is spot-on. The gap between planned future choice (X) and predicted future choice (Y ≠ X) creates an arbitrage opportunity for a patient trader. The exploit exists *because your current self and future self disagree about the best course of action, and this disagreement is predictable and unresolved*.

  **2. The Proposed Solution: Resolute Choice – Partial Fit, Not Universal**
  - **What Resolute Choice Is:** It's a strategy where an agent commits *in advance* to a plan (a sequence of choices) and then *follows that plan*, even if, at a later point, the *local* preferences over immediate options might tempt deviation. Your roommate is correct that this is the standard "fix" proposed in the literature for dynamic inconsistency pumps (e.g., by Machina, McClennen).
  - **Why it "Appeals" & Addresses Pumps:** By binding your future self to your current plan, you eliminate the gap between planned action and predicted action. The trader loses the arbitrage opportunity. Your personal examples (restaurants, hotels, sublets) are classic cases where local temptations/changes of mind lead to costly revisions – precommitment (e.g., non-refundable booking, public declaration) could prevent this loss.

  **3. Why Your Framing Feels "Off": The Conflation Trap**
  The slight misstep is here: ***"Rationality means locking in your preferences... never update, never re-rank... treat preference change as such as a threat."***
  - **Mistake 1: Confusing Preference *Change* with Preference *Inconsistency*.** Money pumps exploit *inconsistencies* (intransitivity or dynamic inconsistency), not necessarily *changes*. A rational agent *must* be able to update preferences when:
      *   **New Information Arrives:** Learning the "best" restaurant has health violations *should* change your preference. Refusing to update is irrational dogmatism.
      *   **Circumstances Change Objectively:** Your preferred conference hotel becomes inaccessible due to a strike; your sublet falls through. Sticking rigidly to the old preference is nonsensical.
      *   **Rational Reflection Occurs:** Deep contemplation reveals a flaw in your initial ranking. Growth requires updating.
  - **Mistake 2: Equating "Resolute Choice" with "Never Revise Preferences".** Resolute choice is about sticking to a *plan* (a sequence of *actions*), not about freezing *preferences* over *outcomes*. It accepts that your *local* preferences at T2 might differ from your *global* preferences at T1, but you act according to the T1 global plan anyway. It doesn't forbid you from *genuinely* changing your mind about what outcomes are best *if new reasons emerge*; it forbids you from *capriciously* abandoning a well-formed plan just because immediate temptations arise.
  - **Mistake 3: Ignoring the Cost of Rigidity.** Blanket refusal to revise is itself irrational. It makes you vulnerable to different kinds of losses:
      *   **Missed Opportunities:** Better deals arise after your "lock-in."
      *   **Avoidable Harm:** Sticking to a choice made under outdated/wrong information.
      *   **Stagnation:** Inability to learn and improve preferences.

  **4. The Core Rational Principle: Consistency Over Time, Not Stasis**
  The true lesson of the money pump isn't "never change," but **"maintain rational integrity across time."** This means:
  -   **Avoid Logical Inconsistencies:** Ensure preferences are transitive *at a point in time*.
  -   **Resolve Predictable Self-Disagreement:** If you *know* your future self will act against your current best judgment due to a bias (e.g., present bias), rational integrity requires managing that conflict *now*. This is where precommitment shines.
  -   **Update Rationally:** When preferences change due to new, relevant information or deeper reflection, this is *rational learning*, not a pump vulnerability. A pump exploit requires *predictable inconsistency without justification*. Justified change isn't exploitable in the same cyclical way. A trader can't reliably "cycle" you if your changes are driven by external, unpredictable events or genuine learning.

  **5. Resolute Choice: A Tool, Not The Whole Toolkit**
  -   **Best For:** Known self-control problems (present bias, akrasia) where the *cause* of the future deviation is recognized *now* as a bias, not new information. Ulysses binding himself *because he knows the Sirens will cause an irrational urge* is the paradigm.
  -   **Not For:**
      *   Situations where significant, unforeseen information is likely.
      *   Domains where flexibility is inherently valuable.
      *   Replacing the need for consistent underlying values. If your "global" plan at T1 is flawed, resolutely following it is just stubbornly irrational.

  **Your Thesis & The Slight Reframe:**
  Your insight is powerful! The money pump literature *does* vividly illustrate the *costs* of inconsistency and the *value* of commitment devices for specific flaws. The "off" feeling comes from overgeneralizing the solution.

  *   **Stronger Framing:** "Money pump arguments reveal the exploitable costs of *unresolved dynamic inconsistency* and *intransitivity*. Rational agents must resolve these inconsistencies. For dynamically inconsistent preferences caused by predictable biases like present bias, *precommitment* (resolute choice implementation) is a rational and effective strategy. However, rational agency also requires the capacity for *justified preference revision* in response to new information or reflection; blanket refusal to update is not the lesson, and can itself be irrational."
  *   **Thesis Chapter Potential:** This is gold! Explore:
      *   The cognitive mechanisms behind *unjustified* reversals vs. *justified* updates.
      *   When and why people fail to use precommitments even when aware of their inconsistency (the "planning fallacy" for self-control).
      *   Empirical evidence: Do people who suffer "money pump" losses in lab tasks (or real life like your examples) benefit from simple precommitment nudges? Does training in recognizing dynamic inconsistency improve precommitment use?
      *   The *limits* of precommitment – when does it backfire? (e.g., locking into bad plans, reducing beneficial flexibility).

  **Conclusion:** You've correctly identified the core problem (inconsistencies create pump vulnerabilities) and a key normative solution for one type of inconsistency (precommitment for dynamic inconsistency). Your roommate is right about resolute choice being the standard response. The slight flaw is equating *all* preference change with the *specific inconsistencies* that enable pumping. Rationality demands *managing* inconsistency and bias (often via precommitment), not the impossible and undesirable fossilization of preferences. Your unease was spot-on – it signaled the need to distinguish justified learning from exploitable flip-flopping. This nuance makes your thesis idea *stronger*, not weaker. Go forth and build that chapter!
