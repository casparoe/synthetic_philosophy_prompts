  ## The Overreaching Exclusion: Why Kim's Argument Undermines All Higher-Level Causation

  Jaegwon Kim's causal exclusion argument aims to show that irreducible mental properties are causally inert. However, a careful examination reveals that its logic, if sound, demolishes not just mental causation but *all* higher-level causation—be it geological, economic, engineering, or biological. The only tenable response is to retain the causal closure of physics while jettisoning the problematic exclusion principle.

  **1. Generalizing the Exclusion: From Mind to Macrophysics**
  Kim's argument relies on three premises:
  - (i) **Causal Closure of the Physical (CCP)**: Every physical event has a sufficient physical cause.
  - (ii) **Exclusion Principle (EP)**: If a physical event has a sufficient cause at a lower level (e.g., physical), no distinct higher-level cause (e.g., mental) contributes to it.
  - (iii) **No Systematic Overdetermination (NSO)**: Widespread, systematic causal overdetermination (multiple *independent* sufficient causes for the same effect) is implausible.

  Kim applies this to mental causation: Suppose mental property M causes physical effect P*. CCP entails P* has a sufficient physical cause, say P (the physical realizer of M). EP states that since P is sufficient for P*, M (distinct from P) cannot also cause P*. NSO rules out P and M *both* being independent sufficient causes. Thus, M is causally excluded.

  Now generalize: Consider the Cretaceous asteroid impact (a macrophysical event) causing mass extinction P*. CCP entails P* has a sufficient *microphysical* cause: the precise quantum states and interactions of the particles constituting the asteroid and Earth at impact (call this complex micro-state μ). EP dictates that since μ is sufficient for P*, the distinct macrophysical event "asteroid impact" cannot cause P*. NSO rejects μ and the impact as independent overdetermining causes. Thus, the asteroid impact is causally inert.

  Identical reasoning applies to:
  - A central bank's interest rate hike (economic event) causing reduced inflation (P*). Its microphysical realizer (μ: particles in computers, documents, human brains enacting the decision) suffices for P* via CCP. EP excludes the rate hike itself.
  - Corrosion in a bridge girder (engineering event) causing structural failure (P*). Its microphysical realizer (μ: atomic decay processes) suffices for P*. EP excludes the corrosion.

  **What does the mental case add? Nothing structurally.** The mental case is not unique in involving realization: *all* special-science and macrophysical properties/events are realized by microphysical states. The argument hinges solely on realization + CCP + EP + NSO. If EP excludes the mental because it’s realized, it excludes *any* realized property. Kim’s mental causation dilemma is just a specific instance of a general higher-level causation dilemma.

  **2. Diagnosing the Flaw: Proportionality and the Misstep of Exclusion**
  This generalized exclusion is a *reductio ad absurdum* of EP, not CCP. The absurdity is the elimination of all non-microphysical causation—denying the efficacy of asteroid impacts, rate hikes, or corrosion contradicts scientific practice and intuition. CCP remains plausible: physics is causally closed, meaning microphysical causes suffice within their domain. The flaw lies in EP’s demand that a sufficient micro-cause *excludes* any higher-level cause.

  EP’s error is its insensitivity to **causal proportionality**. A cause is proportional to its effect when it is both *sufficient* (given background conditions) and *necessary* in the sense of being at the right level of abstraction to explain *why that specific effect occurred*. Microphysical states (μ) are typically *disproportionate* causes:
  - **Too Fine-Grained**: μ specifies irrelevant details (e.g., precise quantum spin of atoms in the asteroid) irrelevant to *why* the extinction occurred. Many distinct μ-states realize the same asteroid impact and cause extinction. μ is sufficient but not necessary for the extinction effect; it’s overly specific.
  - **Explanatorily Deficient**: Citing μ doesn’t explain *why* dinosaurs died; citing the asteroid impact does. Proportional causes track explanatory relevance.

  The proportional cause of the extinction is the asteroid impact. Similarly, the proportional cause of my arm rising is my intention (mental), not the firing of specific neurons (physical). Crucially, proportionality rescues *both* special-science *and* mental causation. EP fails because it mistakes sufficiency at one level for exclusivity across all levels. A sufficient microphysical cause does not render a proportional higher-level cause redundant or "non-contributory"; it provides a different, indispensable type of causal explanation.

  **3. Defending Against Overdetermination: Harmonious, Not Vicious, Multiplicity**
  The obvious riposte is that rejecting EP licenses pervasive overdetermination: if both μ (micro-state) and M (mental) or I (impact) cause P*, isn’t everything overdetermined? This worry is misplaced. The overdetermination EP and NSO rightly reject is *independent* overdetermination (e.g., two assassins firing simultaneously). The relationship here is **dependent overdetermination**:
  - **Constitution, Not Independence**: The asteroid impact *is constituted by* μ; my intention *is realized by* neural state N. They are not independent causes. The higher-level cause depends metaphysically on the lower-level realizer. μ causes P*, and I causes P*, but I’s causing P* is *grounded in* μ’s causing P*. There is only one causal process, described at two levels.
  - **No Explosion of Causes**: This doesn’t imply every arbitrary grouping causes its effects. Only properties that are *proportionate*, *difference-making*, and *grounded* in the physical base have causal efficacy. The microphysical realizer μ and the proportional macro-cause (e.g., impact, intention) are not competitors; they are aspects of the same causal structure. This multiplicity is harmonious, not vicious—it reflects the layered nature of reality without threatening causal closure.

  **4. Physicalism After Exclusion: Closure without Exhaustion**
  Rejecting EP while retaining CCP transforms Kim’s argument. Without EP, the path to reductionism is blocked. Physicalism survives as **non-reductive physicalism**:
  - **Causal Closure Intact**: CCP holds—every physical effect has a sufficient physical cause (e.g., μ causes P*). Physics is causally complete within its domain.
  - **Causal Exhaustion Rejected**: Physics is *not* causally exhaustive. Higher-level properties (mental, geological, economic) have genuine, irreducible causal powers *in virtue of* their physical realization. The asteroid impact causes the extinction *because* its microphysical realizer does, but the impact itself is the proportional cause.
  - **Price of Irreducibility**: We must reconstrue "sufficient cause." CCP requires a sufficient microphysical cause, but "sufficiency" here doesn’t imply *explanatory exclusivity* or *causal exclusivity*. A sufficient micro-cause provides a complete physical account, but higher-level causes provide indispensable explanations at their own grain. The cost is accepting that causation is multi-level and that physics, while complete, doesn’t monopolize causal discourse.

  Kim’s reductionism fails because EP—the linchpin demanding reduction to avoid exclusion—is unjustified. Physicalism endures as the view that all concrete phenomena depend on the physical, but causation operates at multiple dependent levels.

  ---

