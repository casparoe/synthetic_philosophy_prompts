  | **Premise (ii)**     | Exclusion Principle (EP): If P* has a sufficient physical cause C, no distinct higher-level D causes P*. | Target of reductio             | EP is intuitive; two causes for one effect seem redundant.                          | EP ignores proportionality & levels; redundancy only applies to independent causes, not grounded higher levels.    |
  | **Premise (iii)**    | No Systematic Overdetermination (NSO): Widespread independent overdetermination is implausible.        | Supports EP in original argument | Permitting dependent overdetermination is still implausible proliferation.          | Dependent overdetermination (constitution) is ubiquitous and benign (e.g., statue/clay causing shattering).        |
  | **Inference 1**      | Apply premises to mental case: M causes P* → P (physical realizer) suffices for P* → EP excludes M.    | Standard Kim argument          | Mental properties are uniquely problematic (e.g., anomalous).                       | Realization is general; geology/economics face identical realization relations. No unique mental problem.          |
  | **Inference 2**      | Apply premises identically to macrophysical/special-science cases (e.g., asteroid impact I causing P*). | Generalization (reductio)      | Macrophysical causes *just are* microphysical causes; no distinct higher level.     | I and μ are distinct properties/events (one coarse-grained, one fine-grained), though I is realized by μ.          |
  | **Inference 3**      | Generalized exclusion is absurd (denies known science/everyday causation).                             | Reductio against EP             | Science only needs micro-causes; macro-causes are heuristic.                        | Science relies on macro-causation (e.g., climate models, economics); heuristics require genuine causal grounding. |
  | **Rejection Step**   | Reject EP; retain CCP & proportionality.                                                               | Diagnosis & solution           | Proportionality is vague/subjective; why think mental properties are proportional? | Proportionality is objective (e.g., counterfactual dependence, natural properties); mental states track behavioral effects better than neural states. |
  | **Overdetermination**| Dependent overdetermination (I and μ both cause P*) is acceptable; not independent.                    | Resolves worry                  | Constituted causes are still distinct causes; overdetermination remains.            | Causes are distinct but not independent (I’s causal power depends entirely on μ). One process, two descriptions. |
  | **Conclusion**       | Non-reductive physicalism: CCP true, higher-level causation real and irreducible, EP false.            | Final position                 | Admits "causal drainage" – all causal power still "drains down" to micro-level.     | Causal powers at higher levels are real but dependent; drainage confuses levels with fundamentality. Powers are realized, not drained. |

