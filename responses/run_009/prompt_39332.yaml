        "test": "Present models with text describing a false correlation (e.g., 'umbrella sales cause rain') alongside causal explanations. Test if models distinguish correlation from causation in generated responses.",
        "parrot_prediction": "Models will perpetuate correlational fallacies proportionally to their statistical prevalence in training data.",
