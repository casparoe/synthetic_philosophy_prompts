  **Key design notes:**
  - **Agreed claims** focus on mechanistic interpretations of evidence both accept (e.g., editing experiments show *something* structural exists, but claims don't specify *what* that structure represents)
  - **Disagreements** use each side's preferred framing:
    - Parrot positions emphasize statistical origins and absence of referents
    - Understanding positions emphasize functional outcomes and relational structures
  - **Cruxes** isolate testable predictions where outcomes would force belief revision:
    - Grounding test targets the core "referent" dispute
    - Symmetry test probes statistical vs. structural boundaries
    - Causality test examines abstract reasoning capabilities
  - **Verbal disputes** explicitly call out definitional splits (per your instruction), showing where disagreements are terminological rather than empirical

  Both advisors should recognize their core arguments while seeing how specific empirical tests could advance the debate. The statement avoids "weak agreement" traps by making concessions substantive (e.g., both acknowledge editing experiments reveal *some* structure, but disagree on its nature).
