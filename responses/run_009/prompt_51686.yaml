  Okay, the user is part of a theatre panel dealing with scripts based on real people. They need a practical standard for permissible invention. Let me unpack their query.

  First, they mentioned recurring fights in the panel because there's no shared standard. Everyone has pet cases instead of consistent criteria. The user wants a specification document in British English, usable for reaching verdicts on scripts. Key points: no abstract principles, must handle specific cases they listed, like composite characters or invented motives. Also, they want to know which requirements are non-negotiable versus faction preferences.

  Looking at their examples: composite characters can misrepresent individuals; invented interiority adds unrecorded thoughts; motive substitution changes reasons for actions; selective editing creates a false overall picture; recency affects living relatives; framing (fantasia vs. "true events") matters; private vs. public truths. The standard must avoid relying solely on harm or audience awareness, and address conflicts between requirements.

  The user's deeper needs: They need a framework that resolves panel disputes by providing clear, actionable criteria. They want to prevent subjective biases and ensure ethical consistency. Also, they need to handle nuances like the difference between misleading and transparent distortions. Identifying non-negotiable points will help unify the panel, while highlighting conflicts shows where compromises are needed.

  I should start by structuring the requirements. The core principles could include veracity, ethical responsibility, contextual integrity, and transparency. Each requirement must address the cases mentioned. For composites, a rule like "no significant misattribution" with consent or justification. Interiority needs clear labelling as invention. Motive substitution should require narrative necessity without defamation. Selection bias needs harm prevention and proportionality checks.

  Recency and living relatives need stricter consent or anonymization. Framing requires explicit signposting in marketing and scripts. Private info needs higher thresholds for public interest and harm assessment. Non-negotiables are veracity of core facts, harm prevention, and transparency. Conflicts might arise between narrative necessity and harm, requiring case-by-case balancing.

  I should test each requirement against the cases. For example, composite characters: if merging causes misrepresentation, it fails unless justified and signposted. Selection that lies: if scenes create a false picture, harm prevention and proportionality checks apply. The "Contextual Integrity" requirement is key—it challenges the "facts-only" view by allowing some invention, the "emotional truth" view by requiring accuracy, and the genre view by mandating transparency beyond marketing.

  Adding missed cases: living subjects, marginalised groups, legal risks, and sourcing reliability. This covers more ground. The document should be clear, with a decision flowchart for usability. The goal is a living document, adaptable with examples. Ensuring British English terms like "signposting" and "caretaker institutions" for local relevance.
answer: |-
  Here is a comprehensive requirements specification for permissible invention regarding real persons in scripts, drafted in British English and designed for practical application by your panel. It addresses your stated concerns, incorporates additional critical cases, identifies non-negotiables, flags conflicts, and highlights the key requirement that challenges common standards.

  **Theatre Company: Standard for Permissible Invention Regarding Real Persons**

  **1. Purpose:** To provide a consistent, ethically grounded, and practically applicable framework for evaluating the degree and nature of permissible invention when depicting real, identifiable individuals in scripts based on historical events, biographies, or lived experiences. This standard aims to balance artistic expression with ethical responsibility and historical integrity.

  **2. Core Principles:** Decisions must be guided by:
      *   **Veracity:** Commitment to truthfulness regarding core facts and the overall representation.
      *   **Ethical Responsibility:** Minimising unjustified harm, respecting privacy, and acknowledging sensitivities, especially concerning living individuals or recent events.
      *   **Contextual Integrity:** Ensuring inventions serve the narrative purpose *within the specific context presented* and do not fundamentally distort the individual's character, legacy, or historical role.
      *   **Transparency:** Signalling the nature of the invention to the audience where appropriate and necessary.

  **3. Requirements List (Non-Negotiables Marked [NN]):**

      1.  **Core Fact Accuracy [NN]:**
          *   *Requirement:* Undisputed, materially significant facts (e.g., key dates, locations, major actions taken, documented outcomes of decisions, publicly known relationships) must be portrayed accurately.
          *   *Rationale:* Foundation of trust and historical integrity. Misrepresentation here constitutes a fundamental breach.
          *   *Handles:* Motive substitution (if the *outcome* is misrepresented), Selection that Lies (if omission creates a false factual outcome).

      2.  **Prevention of Unjustified Harm [NN]:**
          *   *Requirement:* Invention must not create a substantial risk of unjustified harm (e.g., reputational damage, significant distress, harassment, safety risk) to the depicted individual (if living) or their close surviving relatives/friends (especially concerning recent subjects). Harm risk must be proportionate to the narrative necessity and public interest value of the invention.
          *   *Rationale:* Ethical imperative to avoid causing real-world damage. "Unjustified" excludes legitimate satire/critique of public figures.
          *   *Handles:* Composite Characters (risk of misattribution/harm), Motive Substitution (especially to a damning one), Recency, Private Material.

      3.  **Character & Legacy Fidelity [NN]:**
          *   *Requirement:* The cumulative representation of an individual's character, core motivations (where reasonably knowable), significant relationships, and historical/social legacy must not be fundamentally distorted by invention or selective portrayal. The portrayal must be consistent with the known, significant body of evidence about the person.
          *   *Rationale:* Protects the individual's fundamental identity and place in history/narrative.
          *   *Handles:* Composite Characters (attributing actions/words changes character), Motive Substitution (alters core motivation), Selection that Lies (cumulative distortion), Invented Interiority (if it fundamentally alters perceived character).

      4.  **Narrative Necessity & Proportionality:**
          *   *Requirement:* The level and nature of invention must be demonstrably necessary to achieve the script's core artistic/narrative purpose *and* proportionate to the significance of the alteration. Minor inventions for pacing/scene economy are more permissible than major alterations affecting character or key events.
          *   *Rationale:* Ensures invention serves artistic goals, not convenience or sensationalism. Prevents gratuitous distortion.
          *   *Handles:* Composite Characters (necessity of merger?), Motive Substitution (is the invented motive *necessary*?), Invented Interiority (is it crucial insight or filler?).

      5.  **Transparency & Signposting:**
          *   *Requirement:* The nature and degree of invention must be clearly indicated to the audience where its absence would likely cause significant misunderstanding about historical reality. This can be achieved through:
              *   Framing devices (e.g., "a fantasia", "imagined", "inspired by").
              *   Programme notes / Director's notes.
              *   Explicit textual/directorial cues within the work itself (e.g., stylisation, unreliable narrator signals).
              *   Marketing materials accurately reflecting the level of fictionalisation ("based on true events" implies less invention than "inspired by" or "a fantasia").
          *   *Rationale:* Maintains audience trust and allows informed viewing. Fulfils the implicit contract about the work's relationship to truth.
          *   *Handles:* The Frame, Invented Interiority, Selection that Lies (if signposted as *one* perspective), Motive Substitution (if signalled as interpretation).

      6.  **Sensitivity to Recency & Proximity:**
          *   *Requirement:* Greater strictness (especially regarding Requirements 2, 3 & 7) applies when depicting individuals who died recently or where close relatives/friends/communities directly affected are still living and likely to encounter the portrayal. Increased weight must be given to potential distress and misrepresentation.
          *   *Rationale:* Ethical duty of care towards those still grieving or directly impacted. Reduces risk of immediate harm.
          *   *Handles:* Recency explicitly. Influences application of Harm Prevention and Character Fidelity.

      7.  **Treatment of Private Material:**
          *   *Requirement:* Depicting intensely private matters (e.g., secret affairs, confidential health diagnoses, deeply personal trauma) requires a significantly higher threshold of justification than public facts, even if well-evidenced. Justification requires:
              *   Overwhelming narrative necessity and centrality to the core story.
              *   A compelling public interest argument (beyond prurience or dramatic effect).
              *   Extreme diligence in minimising harm (Requirement 2).
              *   Consideration of the individual's known or reasonably inferred wishes regarding privacy.
          *   *Rationale:* Respects personal dignity and autonomy even posthumously. Avoids gratuitous intrusion.
          *   *Handles:* Private Material explicitly. Creates a higher bar than "true but public".

      8.  **Avoidance of Significant Misattribution (Composites & Inventions):**
          *   *Requirement:* Merging individuals into composites or inventing actions/dialogue must not:
              *   Significantly misrepresent the character, actions, or legacy of the real individuals subsumed or affected.
              *   Attribute specific, significant negative actions or views to a real person who did not hold/perform them, unless strictly necessary and heavily signposted (see Requirement 5).
              *   Obscure important historical dynamics that the real separate individuals represented.
          *   *Rationale:* Prevents concrete, individual harm and distortion through false association.
          *   *Handles:* Composite Characters explicitly, Motive Substitution (if attributed), Invented Interiority (if it becomes defamatory).

      9.  **Acknowledgment of Sourcing & Uncertainty:**
          *   *Requirement:* Where interpretation is inherent (e.g., motives, interiority where no record exists), or where sources conflict, the script should, where feasible and dramatically coherent, subtly reflect the inherent ambiguity or the act of interpretation itself. Avoid presenting speculative invention as definitive fact.
          *   *Rationale:* Intellectual honesty and reflects the reality of historical/biographical work.
          *   *Handles:* Invented Interiority, Motive Substitution (if ambiguous), Selection that Lies (if ambiguity exists).

  **4. Additional Cases Handled by Requirements:**
      *   **Depicting Living Subjects:** Covered by Harm Prevention [NN], Character Fidelity [NN], Recency Sensitivity, Private Material (stricter), Transparency. Requires extreme caution.
      *   **Portraying Marginalised/Historical Victims:** Heightens sensitivity under Harm Prevention [NN] and Character Fidelity [NN] to avoid perpetuating harmful stereotypes or re-traumatising communities.
      *   **Legal Risks (Libel/Defamation):** Covered primarily by Harm Prevention [NN] and Core Fact Accuracy [NN] – but legal advice is essential alongside this standard.
      *   **Reliability of Sources:** Covered by Core Fact Accuracy [NN] (requires reliance on credible sources) and Acknowledgment of Uncertainty.

  **5. Potential Conflicts & Balancing:**
      *   **Narrative Necessity vs. Harm Prevention [NN]:** A minor invention causing minor distress might be acceptable if crucial to the story. A major invention causing major distress likely fails, regardless of narrative need. *Balancing Act:* Proportionality (Req 4) is key. Is the harm *unjustified* given the necessity and public interest?
      *   **Character Fidelity [NN] vs. Transparency:** Signalling "this is imagined" (Req 5) doesn't automatically absolve a fundamental distortion of a real person's core character (Req 3). A fantasia about a recent, beloved figure portraying them as a monster, even if signalled, likely violates Req 3 & Req 2. *Balancing Act:* Genre/Frame sets expectations, but doesn't eliminate core ethical duties towards real individuals, especially recent ones (Req 6).
      *   **Private Material vs. Public Interest/Narrative Necessity:** The high bar for Req 7 must be met. A private affair might be crucial to understanding a major public political decision (higher public interest) vs. being salacious detail in a singer's biopic (lower justification).

  **6. The Key Requirement Challenging Common Standards:**
      *   **Character & Legacy Fidelity [NN]** (Requirement 3) is the most significant challenge to the candidate standards.
          *   **Facts-Only View:** Requirement 3 explicitly allows *some* invention (interiority, composites, motives *if* core character isn't distorted) while demanding overall fidelity, rejecting a rigid "only documented facts" rule. It necessitates interpretation.
          *   **"Emotional Truth" View:** Requirement 3 directly confronts this by insisting the "essence" must demonstrably align with the known evidence of the *actual person's* character and legacy. It prevents using "emotional truth" as carte blanche to reinvent the core identity against the historical record.
          *   **Genre-Contract View:** Requirement 3 asserts that the ethical duty to the real individual (especially concerning harm and core fidelity) exists *beyond* just setting audience expectations via genre/frame. A fantasia signalled as such still cannot fundamentally distort a recent real person's core character without justification (Req 7) and harm mitigation (Req 2).

  **7. Application Process Recommendation:**
      1.  Identify all real, identifiable individuals depicted.
      2.  For each significant individual/scene involving invention: Map against Requirements 1 (Core Facts), 3 (Character Fidelity), 8 (Misattribution).
      3.  Assess potential Harm (Req 2), considering Recency/Proximity (Req 6) and Private Material (Req 7).
      4.  Evaluate the Narrative Necessity/Proportionality (Req 4) of each significant invention.
      5.  Scrutinise the planned Transparency/Signposting (Req 5) – is it adequate for the *level* of invention used?
      6.  Weigh any conflicts identified (Section 5).
      7.  Reach a verdict: Pass (meets standard), Pass with Mandated Revisions (e.g., strengthen signposting, adjust harmful element), Fail (fundamental breach of NN requirements).

  This standard provides concrete criteria to evaluate scripts, moving beyond pet cases. It establishes clear non-negotiables (Harm Prevention, Core Facts, Character/Legacy Fidelity) while offering practical guidance on navigating the inherent tensions in docudrama. Use it as a living document – refine it based on panel experience. Good luck with the next meeting!
