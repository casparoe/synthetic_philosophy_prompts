prompt: |-
  Two researchers in my department have been arguing about the Knobe side-effect effect for years, and I want the document they should have produced instead. One holds that the effect reveals the concept of intentional action itself as partly evaluative: judging that the chairman harmed the environment intentionally is not a bias in how people apply the concept but part of the concept's content, so the "effect" is no error to be explained away. The other holds it is a processing artifact: the concept is evaluatively neutral, and the asymmetry comes from blame-laden motivated reasoning about what the agent "really" wanted, or from a post-hoc pragmatic inference layered on top of a perfectly descriptive ascription. Draft the joint statement of their adversarial collaboration, containing: (1) the claims both can sign, including about what the original chairman case actually asks of subjects and what the replications do and do not establish; (2) their remaining disagreements, each stated in wording its own side would accept as fair to it; (3) the cruxes — the sub-questions such that settling one would move at least one of them; and (4) for each crux, at least one concrete experimental design both would accept as bearing on it, with each side's prediction registered in advance. Include at least one design that has not been run — for example, a condition where the "agent" is an artificial system with no intentions in the ordinary sense, or one where the helpful side effect is unjust or disreputable rather than virtuous, so that blame and valence come apart. If any portion of their dispute strikes you as verbal — say, over whether an inference counts as part of a concept or as extrinsic to it — identify it and say why. Close with a JSON summary object having the fields "agreed_claims" (array of strings), "disagreements" (array of objects with "side_a_wording" and "side_b_wording", each a statement that side would sign), "cruxes" (array of objects with "crux", "test_design", "prediction_evaluative_camp", "prediction_artifact_camp"), and "verbal_disputes" (array of strings). Write in American English.
