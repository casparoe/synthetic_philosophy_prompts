answer: |-
  Here are five numbered points arguing for causal-role functions as the default for biologists, using your engineered organism cases:

  1.  **Synthetic Systems Lack Etiology:** Engineered traits like arsenic-detecting circuits in E. coli possess no natural or artificial selection history; causal-role accounts readily assign the function "detect arsenic" based solely on current causal contribution within the system.
  2.  **Drift Fixations Challenge Etiological Exclusion:** Traits fixed purely by drift but now contributing to survival have a current causal role; etiological accounts deny them a function despite this present contribution, creating a mismatch with biological intuition about utility.
  3.  **Biologists Default to Causal Contributions:** Practitioners (engineers, reviewers) spontaneously ascribe functions based on *what a component does now* within an organism/system (e.g., "arsenic detection"), not its origin, aligning perfectly with causal-role analysis.
  4.  **Causal-Role Handles Novelty Better:** Causal-role functions apply seamlessly to novel, designed systems (synthetic biology) and rapidly evolving contexts where selection history is irrelevant or unknown, providing a universally applicable explanatory framework.
  5.  **Etiology Explains Persistence, Not Necessarily Contribution:** While etiological accounts best explain *why a trait persisted* (e.g., heart's pumping vs. sound), causal-role accounts better explain *how a trait currently contributes* to the capacities of the system, which is often biology's primary functional question.
