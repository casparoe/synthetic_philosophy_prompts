prompt: |-
  I teach an intermediate course on game theory and rational choice for philosophy students — eighteen of them, philosophically sophisticated but viscerally allergic to anything that looks like algebra — and we've just finished the prisoner's dilemma and Nash equilibrium. Next week I want to spend our single 75-minute session on Hofstadter's superrationality, and rather than lecturing on it I want them to be burned by it before they can name it. The vehicle should be a live, in-class replica of the Luring Lottery he ran through his Scientific American column in 1983, where readers could submit as many contest entries as they wished on a single postcard, the prize was a fixed pool divided by the total number of entries received, and one entry was drawn uniformly at random to take the prize — so every additional entry anywhere in the pool raised its submitter's chance of winning while shrinking the prize for everyone, submitter included. Here is the classroom mechanics I have in mind; please refine it if you see a flaw, but keep the core incentive structure intact: each student privately writes a nonnegative integer on a slip (their entry count), I pool the slips, draw one entry uniformly at random, and the winner receives 1,000 lottery dollars divided by N, the total number of entries submitted, convertible to extra credit at a rate I announce in advance. If everyone submits exactly 1, each person's expected payout is 1,000/324 lottery dollars; if everyone submits 100, expected payouts collapse by two orders of magnitude; and here is the trap I want them to fall into and then dig themselves out of — a student who believes the other seventeen will together submit M entries maximizes her own expected payout by submitting exactly M entries, a best-response rule that, applied by everyone simultaneously, has no rest point and drives the pool toward worthlessness.

  I'd like you to design this as two rounds with an interlude. Round one runs cold, with the rules explained but no discussion of strategy permitted. In the interlude, students should receive a short anonymous "open letter to all entrants" — I'd like you to draft this letter, about 150 words, in the voice of a reader trying to talk the whole pool into submitting exactly 1 entry, using only arguments the students themselves could reconstruct, and without ever using the word "superrationality" or gesturing at mind-control; the letter should get the logic right, since I'll ask them to attack it afterward. Before round two, students should also have the option of a brief open caucus where they may publicly pledge to submit 1 — but the actual slips must stay anonymous, so that trusting the pledge is a genuine epistemic gamble. Design the sequencing so the interesting moment arrives on its own: the reveal of N after each round, ideally with the slips counted aloud, so the class hears the pool inflate and then, maybe, contract.

  Beyond the two rounds, please provide a full lesson plan: rules, materials, timing, the letter itself, and a debrief that does the expected-value algebra on the board, shows why the best-response rule produces escalation with no symmetric equilibrium, and only then names superrationality — framing it carefully as the claim that perfectly rational agents facing a symmetric problem will decide identically, so each should choose as if choosing for all, and distinguishing it from both altruism and wishful causation. The debrief should also connect to the historical outcome: Hofstadter's readers, having just been told about superrationality, nevertheless submitted entries of astronomically large size (including at least one googolplex), rendering the prize a minuscule fraction of a cent — a result worth dwelling on as a failure of the epistemic premise rather than of the logic. I'd also like an honest comparison to the prisoner's dilemma: unlike defection there, no strategy here is dominant, and students should be pushed to say whether that makes superrational cooperation more or less credible when it's actually your own payoff shrinking. Finally, tell me what will predictably go wrong the first time I run this — I already anticipate a joker writing a number with a hundred digits, so give me a principled rule for handling absurd entries and whatever else you foresee — and a candid note on what the exercise cannot reproduce (real money, a pool of 700,000 anonymous strangers rather than eighteen classmates who share a dorm, the impossibility of post-lesson retaliation), so I know which parts of the lesson I'll have to supply by fiat. Begin your response with the design itself — no preamble, no restating of this request — opening with a one-sentence summary of the plan, then the details.
reasoning: |-
  We are going to run two rounds of the Luring Lottery: a silent round, then an interlude with an open letter and an optional public pledge, and finally a second round with the same rules. After both rounds, we reveal the total entries and the winner's prize. Then we debrief with the expected-value algebra, the best-response escalation, and the concept of superrationality, followed by connections to the prisoner's dilemma and the historical outcome.

  **Materials:**
  - Slips of paper for each student (18 per round) and a container for collection.
  - A method for drawing one slip uniformly at random (e.g., a hat).
  - A whiteboard or projection for recording results.

  **Timing (75 minutes total):**
  1. **Introduction and Round 1 (15 minutes):**
     - Explain the rules (5 min): 
       - Each student writes a nonnegative integer (their entry count) on a slip. Emphasize anonymity and that the number can be zero or any positive integer.
       - The total number of entries (N) is the sum of all submitted numbers.
       - One entry is drawn at random. The winner gets 1000 lottery dollars divided by N.
       - Lottery dollars convert to extra credit at a rate to be announced (e.g., 100 lottery dollars = 0.1% added to final grade, but adjust based on your grading scale to make it meaningful but not excessive). 
       - Example: If N=100, the winner gets 10 lottery dollars. If N=1000, the winner gets 1 lottery dollar.
       - Expected payout if all submit 1: 1000/18 ≈ 55.55 lottery dollars per student (but note: only one wins, so each has a 1/18 chance of winning 1000/18 ≈ 55.55, so expected payout is about 3.09 lottery dollars per student). Actually, if each of 18 students submits 1, N=18. Each has a 1/18 chance to win 1000/18. So expected payout per student is (1/18) * (1000/18) = 1000/(18*18) ≈ 1000/324 ≈ 3.086 lottery dollars. Clarify this during the explanation.
     - Run Round 1 (10 min):
       - Distribute slips. Students write their number (without discussion) and submit anonymously.
       - Collect slips and count the total entries (N1) aloud, writing it on the board.
       - Draw one entry: announce the winner (without revealing their entry count) and the prize: 1000/N1 lottery dollars.

  2. **Interlude (15 minutes):**
     - Distribute the anonymous open letter (see draft below) to each student (2 min).
     - Allow 5 minutes for silent reading and reflection.
     - Optional public pledge (8 min):
       - Invite students to publicly pledge to submit exactly 1 in the next round. They can stand up, raise a hand, or simply say "I pledge" (record names if they do).
       - Emphasize: pledges are not binding because submissions are anonymous. They may lie.

  3. **Round 2 (10 minutes):**
     - Run Round 2 with same rules as Round 1 (no discussion during submission). 
     - Collect slips, count total entries (N2) aloud, draw a winner, announce prize (1000/N2).

  4. **Debrief (35 minutes):**
     - Reveal the two totals (N1 and N2) and compare. Note any change (5 min).
     - Expected-value algebra (10 min):
       - Write on board: Let T = total entries by others. Your entries = k (nonnegative integer). Total N = T + k.
       - Your probability of winning: k/(T+k) [because you have k entries out of T+k].
       - Expected payoff: [k/(T+k)] * [1000/(T+k)] = 1000k / (T+k)^2.
       - Now, for a fixed T, what k maximizes this? Let f(k) = k/(T+k)^2. Take derivative or reason: 
          - When k=0: f(0)=0.
          - As k → ∞: f(k) ≈ k/k^2 = 1/k → 0.
          - Maximum at some k>0. Set derivative to zero: let g(k)=k, h(k)=(T+k)^2, then f=g/h. 
            f' = (g'h - gh') / h^2 = [1*(T+k)^2 - k*2(T+k)] / (T+k)^4 = (T+k)[T+k - 2k] / (T+k)^4 = (T - k) / (T+k)^3.
            Set f'=0: T-k=0 → k=T.
          - So best response is k = T.
       - But if everyone uses best response: each assumes others are symmetric? Then T = 17 * k (if 17 others each submit k). So k = T = 17k → k=17k → k=0? Contradiction unless k=0. But k=0 is not a best response to T=0? If T=0, then k=0 gives 0, but if you submit k>0, then N=k, you win with probability 1, and get 1000/k. So you would choose k=1? Then T=0? Actually, if T=0, then k=1 gives 1000/1=1000. So k=1 is better than k=0. Therefore, no symmetric pure Nash equilibrium? Actually, the best response k=T implies that if everyone does it, then each must set k = (n-1)*k, which for n>1 implies k=0. But k=0 is not a best response to k=0 by others because then one could submit k=1 and win 1000. So no equilibrium? The only equilibrium is in mixed strategies? Or the system escalates? 
       - The key point: the best-response rule (k = total by others) leads to escalation because if everyone thinks that way, they will keep increasing k. There is no stable symmetric pure strategy equilibrium.

     - Introduce superrationality (10 min):
       - "Superrationality" (now name it): the idea that in a symmetric game, perfectly rational players will all choose the same strategy. Therefore, each should choose as if they are deciding for everyone. 
       - In this lottery: if all choose k, then N=18k. Each wins with probability k/(18k)=1/18. The prize is 1000/(18k). Expected payoff: (1/18) * (1000/(18k)) = 1000/(18^2 * k) = 1000/(324k). 
       - To maximize this expected payoff per player, we choose k to maximize 1/k. So k=1 gives 1000/324 ≈ 3.086. If k=2, it becomes about half: 1000/(324*2)≈1.543. So the best k is 1. 
       - This is not altruism: it's because by choosing k=1, you are part of a symmetric solution that maximizes your own expected payoff. But it requires that everyone does the same. 
       - Distinguish from wishful causation: you are not causing others to choose 1 by your choice. It's a logical deduction: if we are all identical rational agents, we must all do the same.

     - Historical outcome and epistemic failure (5 min): 
       - Hofstadter's readers, even after reading about superrationality, submitted huge numbers (like googolplex). Why? Because they didn't trust others to be superrational. The symmetric reasoning breaks if there's any doubt about others' rationality or adherence.

     - Comparison to Prisoner's Dilemma (5 min):
       - In PD, defection is a dominant strategy: it gives a better payoff regardless of what the other does. Here, there is no dominant strategy: your best response depends on T (the total by others). 
       - Ask: Does the lack of a dominant strategy make cooperation (here, k=1) more credible? Or less? 
          - More: because there is no inherent pull to "defect" (i.e., submit more) regardless of others? But note: if you expect others to submit low, then you can get a big prize by submitting a little more. But if you expect them to submit high, then you have to submit high to have a chance. 
          - Less: because without a dominant strategy, it's harder to predict what others will do? 
       - In PD, mutual cooperation is not an equilibrium because of the dominant strategy. Here, mutual k=1 is an equilibrium under superrationality but not under Nash (because if everyone else chooses k=1, then T=17, and your best response is k=17, not k=1). So without superrationality, it collapses.

  **The Open Letter (draft, ~150 words):**

  Dear Fellow Entrants,

  We are all in the same boat. Each of us wants to maximize our expected prize. If we all submit exactly one entry, then each has a 1 in 18 chance to win 1000/18 ≈ 55.55 lottery dollars, giving an expected gain of about 3.09 lottery dollars. 

  But if we submit more, we face a trade-off: more entries increase our chance of winning but shrink the prize for everyone. Crucially, if we all submit the same number k, then each of us gets an expected prize of 1000/(324*k). This decreases as k increases. So it's best for each of us if we all choose k=1.

  If you submit more than one, you might win more if others don't, but if everyone does that, we all get less. The only way to avoid the worst outcome is to trust that everyone will choose one. I will choose one. Please join me.

  Sincerely,
  A Fellow Student

  **Handling Absurd Entries:**
  - Announce a rule at the start: "To keep the numbers manageable, any entry count above 10,000 will be treated as 10,000." This prevents a joker from crashing the math. Alternatively, cap entries at 10,000. Explain that this is for practicality and that the lesson is about the logic, not about writing the largest number.

  **What Will Predictably Go Wrong:**
  1. **Round 1:** Many students will likely submit numbers greater than 1, and the pool N1 will be large. Some might even submit 0. 
  2. **Pledges in the interlude:** Some students will pledge and then submit more than 1 (or less). Others might not pledge but submit 1. Trust is fragile.
  3. **Round 2:** After the letter and pledges, N2 might be lower than N1, but it's also possible that some students, fearing defection, will submit even more than in round 1. This happened in Hofstadter's original: despite the article, entries were huge.
  4. **Debrief:** Some students may be confused by the expected-value algebra. Be ready to go step by step.

  **What the Exercise Cannot Reproduce:**
  - **Real money:** The extra credit conversion may not feel as real as cash.
  - **Scale and anonymity:** With 18 classmates, there is face-to-face interaction and potential for trust (or distrust) based on personal relationships. In a large pool of strangers, trust is harder. Also, in a class, there might be implicit threats of retaliation (socially) after the game, which we must ignore.
  - **Time for reflection:** In Hofstadter's case, readers had days to decide and could have coordinated. Here, it's immediate.

  **Adjustments for Clarity:**
  - During the expected-value derivation, use concrete numbers: e.g., if others total 17, then your k=17 gives expected payoff 1000*17/(17+17)^2 = 1000*17/(34^2)=17000/1156≈14.71. If you choose k=1, then 1000*1/(18)^2≈3.09. So best response is 17. But if all do that, then each would have to set k=17*17? Actually, if each of 18 does k=17, then T for one student is 17*17=289, so they would need k=289? This leads to escalation. 

  **Final Note:** The exercise is designed to create a lived experience of the escalation and the failure of coordination without superrationality. The debrief should highlight the tension between individual rationality (best response) and collective rationality (mutual k=1). The open letter is a coordination device that may or may not work, and the pledges add a layer of social commitment that can be broken. This sets up the discussion of why Hofstadter's readers failed and what superrationality requires (common knowledge of rationality and symmetry).
answer: |-
  **Two-round Luring Lottery simulation with interlude and debrief on superrationality, replicating Hofstadter’s incentives.**

  **Rules Announced to Class (5 min):**  
  - Each student writes a **nonnegative integer** (0, 1, 2, ...) on a slip, representing their entry count.  
  - Slips are anonymous and collected. Total entries \(N\) = sum of all submitted numbers.  
  - I draw one entry uniformly at random. The winner receives **1,000 lottery dollars ÷ \(N\)**.  
  - Lottery dollars convert to extra credit: **100 lottery dollars = +0.1%** on final grade (adjustable for fairness).  
  - **Example:** If \(N = 20\), winner gets 50 lottery dollars (≈ +0.05% extra credit).  
  - **No communication during rounds.**  

  **Round 1: Cold Start (10 min)**  
  - Students silently write numbers on slips (1 min).  
  - Collect slips, shuffle, and count \(N_1\) aloud: call out each number as you tally (3 min).  
  - Draw winner randomly. Announce: "Winner gets \( \frac{1000}{N_1} \) lottery dollars." (1 min).  
  - Record \(N_1\) and prize on board.  

  **Interlude (15 min)**  
  1. **Distribute Anonymous Letter** (2 min): Hand out pre-printed copies (draft below).  
  2. **Silent Reading & Reflection** (5 min): Students read letter without discussion.  
  3. **Optional Public Pledge** (8 min):  
     - "You may publicly pledge to submit ‘1’ in Round 2. This is non-binding—actual slips stay anonymous."  
     - Volunteers raise hands/stand to pledge. Record names on board as "Pledged: [Names]".  
     - Emphasize: "Trusting pledges is risky. Anyone can lie."  

  **Round 2: After Letter and Pledges (10 min)**  
  - Same as Round 1: Silent slip submission, tally \(N_2\) aloud, draw winner, announce prize.  
  - Record \(N_2\) and prize beside Round 1 results.  

  **Debrief (35 min)**  
  1. **Observe Outcomes** (5 min):  
     - Contrast \(N_1\) and \(N_2\). Ask: "Did pledges lower \(N\)? Why or why not?"  
     - Highlight: If all submit 1, \(N = 18\) → expected payout ≈3.09 lottery dollars each. If all submit 100, \(N = 1800\) → expected payout ≈0.0003 lottery dollars.  

  2. **Algebra of Incentives** (10 min):  
     - **Expected payout for a student:** Let \(k\) = their entries, \(T\) = total entries from others.  
       - Win probability = \(\frac{k}{k + T}\)  
       - Prize = \(\frac{1000}{k + T}\)  
       - Expected payout = \(\left(\frac{k}{k + T}\right) \times \left(\frac{1000}{k + T}\right) = \frac{1000k}{(k + T)^2}\)  
     - **Best-response analysis:** For fixed \(T\), maximize \(\frac{1000k}{(k + T)^2}\). Calculus shows maximum at \(k = T\).  
       - *Example:* If \(T = 17\) (others all submit 1), best response is \(k = 17\).  
     - **Symmetric escalation:** If all use best-response, \(k = T\). But \(T = 17k\) (since 17 others), so \(k = 17k\) → no solution except \(k \to \infty\).  

  3. **Introduce Superrationality** (10 min):  
     - Define: "Superrationality: Perfectly rational players in symmetric games assume all decide identically, so each chooses as if setting the rule for everyone."  
     - **Apply to lottery:** Assume all choose \(k\). Then \(N = 18k\), expected payout = \(\frac{1000}{18^2 k} = \frac{1000}{324k}\). Maximized at \(k = 1\).  
     - **Clarify distinctions:**  
       - Not altruism: Choosing \(k=1\) maximizes *your* payout if all do it.  
       - Not causation: You don’t "control" others—it’s a logical deduction from symmetry.  

  4. **Historical Outcome & Epistemic Failure** (5 min):  
     - Hofstadter’s readers submitted massive numbers (e.g., googolplex) despite understanding superrationality. Why?  
     - **Key point:** Superrationality fails without **common knowledge of rationality**. Readers distrusted others’ rationality or cooperativeness.  

  5. **Compare to Prisoner’s Dilemma** (5 min):  
     - **PD:** Defection is dominant (better *no matter* what others do). Mutual defection is Nash equilibrium.  
     - **Luring Lottery:** No dominant strategy (best response depends on \(T\)). No symmetric Nash equilibrium.  
     - **Discussion prompt:** "Does lacking a dominant strategy make superrational cooperation *more* credible (no built-in bias toward escalation) or *less* (harder to predict others)?"  

  ---

  **Open Letter Draft (149 words):**  
  Dear fellow entrants,  
  We all face the same temptation: submitting more entries boosts your chance of winning but shrinks the prize. If we all submit one entry, each of us has a 1/18 chance to win 55.55 lottery dollars, giving an expected gain of ≈3.09. This is the best we can all achieve together.  

  But if you submit more—say, 100 entries—while others submit one, you’d likely win a larger share. However, if everyone thinks this way, we all submit huge numbers, and the prize collapses to nearly nothing. Your expected payout plummets.  

  The logic is inescapable: when all choose identically, higher entries always reduce our expected payouts. Submitting one is the only choice that avoids mutual destruction. I will submit one, trusting you to see this too. Let’s prove rationality doesn’t doom us.  

  Sincerely,  
  A co-entrant  

  ---

  **Predictable Problems & Solutions:**  
  - **Absurdly large entries:** Announce: "Numbers above 10,000 will be capped at 10,000." Prevents math errors and keeps focus on incentives.  
  - **Pledges ignored:** Students who pledged may submit high numbers (distrusting others). **Mitigation:** Stress anonymity’s realism in debrief.  
  - **Round 2 escalation:** \(N_2\) may exceed \(N_1\) if pledges backfire. **Use pedagogically:** Highlights distrust.  
  - **Zero submissions:** Allowed (rational if expecting high \(T\)), but rare. If prevalent, discuss risk-aversion.  

  **What the Exercise Cannot Reproduce:**  
  - **Real stakes:** Extra credit lacks cash’s weight. **Compensate:** Frame debrief around "real-world" logic (e.g., environmental resources).  
  - **Scale/anonymity:** Eighteen classmates know each other; strangers don’t. **Note:** Trust is easier here, but retaliation post-game is possible (unlike strangers).  
  - **Time pressure:** Decisions are instant; Hofstadter’s readers had weeks. **Mitigation:** Emphasize interlude’s "public pledge" as a coordination crutch.  
  - **No superrational precedent:** Students lack Hofstadter’s column context. **Compensate:** Use historical outcome as a revelation in debrief.  

  **Final Tip:** Start tallying slips dramatically—pause when large numbers are called—to make inflation visceral. After reveal, ask: "Hear how fast the prize vanished?" to cement intuition.
