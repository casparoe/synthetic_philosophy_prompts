prompt: |-
  My friend Maya and I had a three-hour argument over dinner about supererogation (what's heroic-but-optional vs what you're actually obligated to do), and I've realised her position is weirder than I first thought. Here's her track record from all the cases we fought about:

  - wading into a pond to pull out a drowning kid, ruining your $200 shoes — required, obviously
  - jumping on a grenade to save five squadmates, certain death for you — heroic but NOT required, supererogatory
  - donating 10% of your income to effective charities — supererogatory
  - donating 5% of your income — also supererogatory, she was really firm on this which surprised me
  - donating a kidney to your brother (small surgical risk, weeks of recovery) — supererogatory
  - walking 20 minutes out of your way to return a lost wallet with the cash still inside — required

  So here's the new case we never got to before the restaurant closed: you get called as a bone marrow match for an anonymous stranger. The donation is genuinely painful, wipes you out for a few weeks, but you fully recover — no permanent damage, essentially zero risk of death — and it saves the person's life.

  Predict her verdict on the marrow case. But more than that: I want you to lay out the rules that actually fit her track record. Like, one rule might be about how big the sacrifice is, another might be a line at your body vs your money and time, another might be about whether there's a particular person right in front of you vs statistical far-away beneficiaries. Show me where those rules agree and disagree on the marrow case specifically (I suspect the "how big is the sacrifice" framing is where it gets messy — is a few weeks of intense pain a big cost or a small one?). Give me your best guess at what she'd say and why you prefer that rule over the others. And then give me one further case I could spring on her that would really seperate the leading candidate rules — I want to win the rematch.

  End your response with a single line of the form "Verdict: X" where X is one word: either "required" or "supererogatory" (your prediction for the marrow case).
reasoning: |-
  Hmm, the user wants me to predict Maya's verdict on a bone marrow donation case based on her previous positions on moral obligations. They've provided Maya's track record from their argument about supererogation - what's required versus what's heroic but optional.

  Looking at Maya's positions:
  - Ruining $200 shoes to save a drowning kid is required
  - Jumping on a grenade is supererogatory (heroic but not required)
  - Donating 10% or even 5% of income to charity is supererogatory
  - Donating a kidney to a brother is supererogatory
  - Walking 20 minutes to return a lost wallet is required

  For the new case: bone marrow donation to an anonymous stranger. It's painful with several weeks of recovery but no permanent damage or death risk, and it saves a life.

  I need to identify consistent rules from Maya's positions and see how they apply to this marrow case. Then predict her verdict, and suggest a new case to test the rules.

  Possible rules that fit Maya's previous decisions:
  1. **Personal Sacrifice Scale:** High sacrifice (like death) is supererogatory, while moderate sacrifice (ruined shoes, 20-minute walk) is required. But the kidney donation (moderate sacrifice) was deemed supererogatory, so this isn't consistent.

  2. **Body Integrity Boundary:** Anything involving bodily intrusion (like kidney donation) might be supererogatory regardless of sacrifice level. This fits with the kidney case being supererogatory and the wallet/shoe cases (no bodily involvement) being required. The grenade case involves bodily sacrifice but is supererogatory, which aligns.

  3. **Relationship/Proximity:** Obligations might be stronger when there's direct proximity (drowning kid) or specific relationship (though kidney to brother was supererogatory). But the wallet return has no relationship and was required, while charity to strangers is supererogatory. Proximity seems key - "right in front of you" versus abstract/statistical beneficiaries.

  4. **Non-Transferable Harm:** Required when you're the only possible savior in an immediate situation (drowning kid, lost wallet where you're the finder). Supererogatory when others could act or the harm isn't immediate/imputed to you.

  The marrow case involves bodily intrusion (like kidney donation) and no proximity (anonymous stranger), so the Body Integrity and Non-Transferable Harm rules would lean supererogatory. The sacrifice is moderate but not extreme like death, so Sacrifice Scale is ambiguous.

  For a test case to separate the rules: A scenario with bodily involvement but high proximity, like performing CPR on a stranger choking right next to you (involves physical contact and effort, but no lasting harm). If Body Integrity is key, it might be supererogatory; if Proximity/Non-Transferable Harm is key, it should be required.

  Prediction for marrow case: supererogatory, consistent with her kidney stance.

  Verdict: supererogatory
answer: |-
  Based on Maya's track record, her position appears to hinge on a combination of **bodily integrity boundaries** and **immediate/imputed responsibility**, with sacrifice size being secondary and often overruled. Here's a breakdown of the rules that fit her past verdicts, how they apply to the marrow case, and why I favor one interpretation.

  ### Key Rules Derived from Her Track Record:
  1. **Bodily Integrity Boundary**:  
     - Any significant, non-trivial use of your *body* (organs, tissue, exposure to severe harm) is supererogatory unless the threat is immediate and directly witnessed.  
     - *Fits*: Kidney donation (your body) is supererogatory, while ruining shoes (property) or walking 20 minutes (time/effort) for the wallet is required. Grenade jump (body destruction) is supererogatory despite high stakes.  
     - *Doesn't fit*: Nothing contradicts this—even the drowning kid case doesn't involve bodily *intrusion*, just property and effort.

  2. **Immediate/Imputed Responsibility**:  
     - You're required to act only when:  
       a. The harm is **immediate and concrete** (drowning kid, lost wallet—you're the finder).  
       b. You're the **only plausible agent** (no one else can save the kid; returning the wallet is "your" responsibility once you find it).  
     - *Fits*: Drowning kid (imminent death, you're present) and wallet (concrete loss, you're the discoverer) are required. Donating to charities (statistical, abstract beneficiaries) or organs to a stranger (no immediacy) is supererogatory. Grenade jump has immediacy but isn't required because others *could* act (even if unlikely).  
     - *Doesn't fit*: Kidney to brother has relational proximity but is still supererogatory—immediacy and sole agency matter more than relationship.

  3. **Sacrifice Scale**:  
     - Cost matters but is secondary: High sacrifice (death, permanent risk) makes supererogation more likely, but moderate sacrifice (5% income, weeks of pain) doesn't automatically make something required.  
     - *Fits*: Donating 5% income is supererogatory despite low cost because beneficiaries are abstract. Kidney donation is supererogatory despite moderate risk. Walking 20 minutes is low-cost but required due to immediacy.  
     - *Doesn't fit*: The kidney case has higher sacrifice than the wallet walk but is supererogatory—so sacrifice alone isn't decisive.

  ### How Rules Apply to the Marrow Case:
  - **Bone Marrow Donation**: Painful, weeks of recovery, saves an anonymous stranger's life. No permanent risk or death.  
    - *Bodily Integrity Boundary*: **Strongly supererogatory**. Donation involves bodily intrusion (extracting marrow), aligning with kidney donation. Your body isn't "on the line" in required cases like shoes/wallet.  
    - *Immediate/Imputed Responsibility*: **Supererogatory**. The stranger is anonymous—no immediacy (you're not witnessing their death) and no sole agency (others could match or donate).  
    - *Sacrifice Scale*: **Ambiguous, but leans supererogatory**. Weeks of pain are significant but less than kidney surgery. However, since sacrifice didn't sway her on 5% donations (low cost) or kidneys (moderate cost), it likely won't override here.  

  **Conflict**: Sacrifice scale is messy here—is weeks of pain "big" like a kidney or "small" like a wallet walk? But Maya's kidney verdict shows she prioritizes bodily integrity over sacrifice size. The marrow case is *closer to kidney donation* than to wallet return on all axes (bodily, non-immediate, abstract beneficiary).  

  **Why I Prefer Bodily Integrity as the Leading Rule**:  
  - It's the most consistent across her decisions: all "required" cases (shoes, wallet) avoid bodily intrusion, while all bodily-involving acts (kidney, grenade) are supererogatory.  
  - It explains why 5% donations are supererogatory (no bodily element) despite low cost, and why the wallet walk is required (no body, only time). Sacrifice or proximity alone can't explain the kidney/wallet split.  
  - In the marrow case, bodily integrity cleanly resolves ambiguity—donation is invasive, so it's supererogatory.  

  ### Test Case to Win the Rematch:  
  **The CPR Case**: You're eating at a café when a stranger at the next table starts choking. You know CPR—performing it involves 5 minutes of physical effort (no bodily risk to you), but you’d get sweaty, ruin your $50 shirt, and miss your bus. Saving them is near-certain if you act immediately.  

  **Why This Separates the Rules**:  
  - *Bodily Integrity Rule*: Predicts **supererogatory**—CPR involves physical contact (using your body) and minor property loss. Aligns with her kidney/marrow stance.  
  - *Immediate Responsibility Rule*: Predicts **required**—harm is immediate (like drowning kid), you're the only plausible agent (no one else is closer), and it’s concrete (a person right in front of you).  
  - *Sacrifice Scale Rule*: Predicts **required**—cost is low (shirt, time, comparable to wallet walk).  

  Her verdict here would force a choice:  
  - If she says "required," *Immediate Responsibility* is her core rule (overruling bodily contact).  
  - If she says "supererogatory," *Bodily Integrity* dominates (despite immediacy).  

  Given her wallet/drowning cases, I suspect she might say "required," but it would expose tension with the bodily rule. Either way, it refutes sacrifice scale as primary.  

  **Prediction for Marrow Case**: Maya will deem it **supererogatory**. It mirrors the kidney case (bodily intrusion, no immediacy, anonymous recipient) and lacks the "right in front of you" urgency of required acts. The pain/recovery is a factor but secondary—it didn't change her stance on 5% donations or kidneys.  

  Verdict: supererogatory
