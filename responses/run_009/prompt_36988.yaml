  ### 4. The Residue Report

  **What maps cleanly?**
  The mathematical structure of Buchak's REU is identical to a distortion risk measure (Choquet integral) for the gain variable (utility). The distortion function is the same as the one used in finance. In particular, the convexity of r for risk aversion corresponds to the convexity of the distortion function in finance for a risk-averse distortion (like in the TVaR, which uses a convex distortion). The representation as a weighted average of quantiles (the spectral representation) also maps directly, with the weight function being the derivative of the distortion function (with an argument adjustment).

  **What has to be bent to fit?**
  1. **Direction of the random variable**: In finance, risk measures are typically applied to losses (positive is bad). Buchak applies her functional to gains (utility, so positive is good). This is a simple sign flip, but it means that the interpretation of the distortion function is inverted: in finance, a convex distortion function for the survival function of losses (which gives more weight to the tail) corresponds to risk aversion. In Buchak, risk aversion corresponds to a convex distortion function applied to the cumulative distribution of gains (from the worst to the best). However, note that distorting the cumulative distribution of gains from the worst is equivalent to distorting the survival function of losses? Actually, if we let L = -X (loss = negative utility), then the survival function of L at level t is P(L>t) = P(X<-t). The cumulative distribution of X from the worst is F_X(x) = P(X≤x). They are different. But the mathematics is the same as a distortion risk measure for the gain variable.

  2. **Coherence**: In finance, we often require risk measures to be coherent (satisfy subadditivity, etc.). Buchak's REU does not impose coherence. In fact, for risk aversion, she uses a convex r, which corresponds to a concave distortion in the loss domain? (We saw that convex r for gains corresponds to a distortion in the loss domain that is convex? Not exactly, but the point is that the coherence properties are not the same.) The coherence of the risk measure in finance is a property about how it aggregates risks. Buchak is not aggregating multiple risks but evaluating a single gamble. However, if we consider the REU as a functional on the space of random variables (utilities), then we can ask if it satisfies the coherence axioms. But note: the coherence axioms are designed for risk measures (which are for losses and are to be minimized). For a utility functional (to be maximized), we would need to redefine the axioms. The point is: Buchak's framework is not designed to be coherent in the Artzner sense.

  **What has no expression in the financial risk vocabulary?**
  1. **Normativity and Rationality**: The core of Buchak's argument is not mathematical but philosophical. She argues that the independence axiom (which is violated by Allais preferences) is not a requirement of rationality. In finance, we use risk measures that might violate the independence axiom (like distortion risk measures with non-linear r) and we do not consider users irrational for doing so. We judge risk measures by their properties (coherence, backtesting, etc.) and their suitability for the context. Buchak's claim is that decision theory should not rule out risk-averse agents with convex r as irrational. In finance, we don't have a concept of rationality for preferences; we have models that capture observed behavior and that are useful for risk management.

