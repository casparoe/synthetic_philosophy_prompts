  We are going to map Buchak's risk-weighted expected utility (REU) theory to the vocabulary of risk measures in finance, particularly distortion risk measures and spectral risk measures. Then we will analyze the residue: what fits, what doesn't, and where the philosophical debate might not be captured by the mathematical framework.

  ### 1. Buchak's Risk-Weighted Expected Utility (REU) Framework
  Buchak proposes a model of decision-making under risk that generalizes expected utility (EU). The standard EU for a prospect (gamble) that yields utility \( u_i \) with probability \( p_i \) (for \( i = 1, \dots, n \)) is:
  \[
  EU = \sum_{i} p_i \cdot u_i
  \]

  In REU, the agent applies a risk function \( r: [0,1] \to [0,1] \) (which is increasing and satisfies \( r(0)=0, r(1)=1 \)) to the cumulative probabilities. The outcomes are ordered from worst to best: \( u_1 \leq u_2 \leq \dots \leq u_n \). Then the REU is defined as:
  \[
  REU = u_1 + \sum_{i=2}^{n} r\left( \sum_{j=i}^{n} p_j \right) (u_i - u_{i-1})
  \]
  Alternatively, it can be written as:
  \[
  REU = \sum_{i=1}^{n} \left[ r\left( \sum_{j=1}^{i} p_j \right) - r\left( \sum_{j=1}^{i-1} p_j \right) \right] u_i
  \]
  where the term in brackets can be seen as a distorted probability (but note: the distortion is applied cumulatively from the worst outcome).

  The function \( r \) captures the agent's risk attitude. A concave \( r \) corresponds to risk aversion: it underweights the probabilities of the best outcomes (relative to the worst) and overweights the worst. This can explain the Allais paradox.

  ### 2. Mapping to Distortion Risk Measures
  In finance, a distortion risk measure is defined by a distortion function \( g: [0,1] \to [0,1] \) (non-decreasing, with \( g(0)=0, g(1)=1 \)) applied to the cumulative distribution function (CDF) of a loss random variable \( L \) (which is the negative of P&L). The risk measure \( \rho_g(L) \) is:
  \[
  \rho_g(L) = \int_{-\infty}^{\infty} x \, d(g \circ F_L)(x) = \int_{0}^{1} F_L^{-1}(p) \, dg(p)
  \]
  where \( F_L^{-1} \) is the quantile function. Alternatively, using integration by parts, we can write:
  \[
  \rho_g(L) = \int_{0}^{1} g(1-p) \cdot F_L^{-1}(p) \, dp
  \]
  but note that the standard form is with respect to the survival function (for losses) or the CDF (for gains).

  However, note that in the REU framework, we are dealing with gains (utilities) and the distortion is applied to the cumulative probabilities from the worst to the best. In distortion risk measures for losses, we typically distort the survival function (i.e., the tail probabilities) because we care about the right tail of the loss distribution.

