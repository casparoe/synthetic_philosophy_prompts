prompt: |-
  I've recently been appointed to the equity review panel of my mid-sized city, and our first task is to decide which inequality measure the city should use when it evaluates competing budget proposals — whether to fund, say, a personal care attendant program for homebound residents, versus expanding subsidized transit, versus a general tax rebate. I took a political philosophy course years ago and remember the "equality of what?" question — the one Amartya Sen pressed in his 1979 Tanner Lecture — but I never expected to have to actually pick a currency of egalitarian concern rather than write an essay about the options. Before we choose between subjective welfare, resources, and capabilities as our metric, I want the specification a candidate metric would have to satisfy, written out in full.

  Please write the desiderata list for an adequate "currency" for measuring and comparing how well off our residents are, for the purpose of ranking and choosing between municipal budget proposals. For each requirement, give the motivating case from our actual deliberations. The cases I most want handled: (1) a homebound resident with severe chronic fatigue who reports high life satisfaction, plausibly because her expectations have adapted downward over decades of illness, while her neighbor with the same condition reports misery — a welfare metric apparently calls the first one better off, and I want a requirement that speaks to whether that's a feature or a bug; (2) a sailing enthusiast who is healthy, employed, and childfree but claims his hobby makes him "effectively poor" next to families with children — a requirement about expensive tastes versus expensive needs; (3) a Deaf resident who firmly rejects the framing of deafness as a deficit and would resent any metric that scores him below his hearing neighbors — a requirement about not smuggling in a controversial conception of the good life; and (4) the plain fact that whatever we pick has to be computable from administrative data the city can actually collect about a quarter-million people. Beyond these, include whatever further requirements you think the literature implies — distinctions that must be respected (e.g., between how much advantage someone has and whether they have any claim on us at all), results from economics or psychology the metric cannot contradict, and so on.

  Then tell me three things. First, mark each requirement as non-negotiable versus a preference of one camp, and, most importantly, flag any pair of requirements you suspect is jointly unsatisfiable — I suspect the anti-adaptive-preferences requirement and the no-controversial-conception-of-the-good requirement pull against each other, and I want to know whether the list itself, in the right form, is a result. Second, tell me which single requirement does the most work excluding the main contenders, as a brief remark rather than a full scorecard; I'll do the scoring in the panel meeting myself. And third, be candid about where the requirements you've listed are genuine demands of adequacy and where they are prejudices of one scholarly camp dressed up as necessary conditions. Please take the role of a political philosopher specializing in distributive justice who also has practical experience advising public bodies, reason carefully about each requirement before writing, and structure the deliverable as a numbered list of desiderata with the motivating case stated alongside each.
reasoning: |-
  Alright, the user is on an equity review panel for their city and needs to choose an inequality measure for evaluating budget proposals. They mentioned Amartya Sen's "equality of what?" question and have four specific cases they want addressed: adaptive preferences, expensive tastes, disability as difference, and data feasibility. 

  First, I need to unpack their core request. They want a desiderata list for a metric to compare residents' well-being. The examples they provided are critical because they highlight real-world dilemmas. The homebound resident with high life satisfaction due to adapted expectations challenges subjective welfare metrics. The sailing enthusiast with expensive tastes versus families with children touches on needs vs. preferences. The Deaf resident rejecting deficit framing raises issues of imposing a "good life" conception. And data computability is a practical constraint.

  The user's deeper needs might include avoiding philosophical pitfalls while ensuring practical applicability. They might be worried about choosing a metric that's theoretically sound but impossible to implement, or one that causes unintended social backlash. They also need the panel to make a defensible decision, balancing ethical considerations with administrative reality.

  Next, structuring the desiderata. They asked for numbered requirements with motivating cases. I should start with non-negotiable ones like non-imposition of conceptions of the good, anti-adaptive preferences, and data constraints. Then move to important but potentially negotiable ones like sensitivity to unchosen disadvantages and practical measurability. 

  The tension between anti-adaptive preferences and non-imposition is crucial. If a metric corrects for adapted expectations, it might impose a standard of what people should want. But ignoring adaptation risks mistaking resignation for well-being. This conflict might be unresolvable, so it needs to be flagged. The data constraint also limits options; capabilities might be ideal but hard to measure.

  The most exclusionary requirement is likely the data computability. Subjective welfare can be surveyed but is unreliable. Resources are measurable but miss variations in conversion. Capabilities are comprehensive but data-intensive. If the city lacks capability indicators, resources might be the fallback despite limitations.

  I should also note where requirements reflect scholarly biases. For example, the focus on conversion factors comes from Sen's capability approach, which not all agree with. But in the context of equity, considering how resources translate to functionings is reasonable. The user needs transparency on these biases to present them fairly in the panel.

  Finally, summarizing the key takeaways: the metric must respect individual diversity without ignoring hidden disadvantages, while being practically measurable. The conflicts between some requirements mean trade-offs are inevitable, and the panel must prioritize based on the city's values and data capacity.
answer: |-
  Here is a carefully reasoned list of desiderata for a metric of egalitarian concern tailored to your municipal context, drawing on distributive justice theory while grounded in your practical cases. I flag tensions and biases transparently.

  **Desiderata for a Municipal Equity Metric ("The Currency")**

  1.  **Non-Imposition of a Controversial Conception of the Good Life (Non-Negotiable)**
      *   **Motivating Case:** The Deaf resident who rejects deficit framing. A metric must not presuppose that hearing is inherently superior to being Deaf for a flourishing life. Scoring him lower implicitly imposes a specific, contestable view of human flourishing.
      *   **Reasoning:** Fundamental to liberal neutrality and respect for pluralism. Metrics implying inherent superiority of specific functionings (e.g., hearing) over others violate this by defining "advantage" according to a single blueprint.

  2.  **Sensitivity to Unchosen and Significant Obstacles (Non-Negotiable)**
      *   **Motivating Case:** The homebound resident with severe chronic fatigue (CFS). While her reported satisfaction might be high, the unchosen, severe limitation on her range of possible functionings (mobility, social interaction, work) constitutes a significant disadvantage that any genuine equity metric must capture.
      *   **Reasoning:** Addresses the core concern of distributive justice: mitigating the impact of brute bad luck on life prospects. Disabilities, severe illnesses, and significant care burdens are paradigmatic cases.

  3.  **Resistance to Adaptive Preferences (Non-Negotiable, but Tension with #1 & #5)**
      *   **Motivating Case:** The homebound resident with CFS reporting high satisfaction. A metric relying solely on subjective welfare would falsely consider her as well off as her healthy neighbor, mistaking resignation/adaptation for genuine flourishing. The metric must be robust against such distortions.
      *   **Reasoning:** Sen's core critique of utility-based metrics. If justice aims at real freedom, judging advantage based on preferences shaped by deprivation is perverse. This requires an objective (or inter-subjectively reasoned) baseline of significant functionings.

  4.  **Insensitivity to Expensive Tastes (Non-Negotiable)**
      *   **Motivating Case:** The sailing enthusiast claiming "effective poverty." His inability to afford his preferred hobby due to his chosen, expensive tastes does not constitute an inequity demanding public redress, unlike the unmet basic needs of families with children.
      *   **Reasoning:** Dworkin's famous argument. Justice concerns mitigating disadvantages arising from circumstances, not subsidizing expensive choices. A metric must distinguish between needs (rooted in unchosen circumstances) and mere preferences/wants.

  5.  **Respect for Value Pluralism & Agency (Non-Negotiable)**
      *   **Motivating Case:** The Deaf resident *and* the sailing enthusiast (interpreted differently). The metric should not dictate *which* valuable functionings individuals must pursue, only that they have the *effective capability* to pursue a range of functionings they have reason to value. The Deaf person values capabilities accessible within Deaf culture; the sailor values sailing, but lacks claim for public subsidy.
      *   **Reasoning:** Extends #1. Justice is about expanding people's real freedoms (capabilities), not forcing them into specific ways of life or judging the intrinsic worth of their chosen ends, provided those ends are not harmful. This focuses on *opportunity* rather than *outcome* or *specific choice*.

  6.  **Focus on Advantage, Not Claims (Non-Negotiable)**
      *   **Motivating Case:** All cases. The metric's job is to measure *relative advantage/disadvantage* across the population. Determining *who* has a claim on municipal resources based on that disadvantage involves separate principles (e.g., sufficiency, priority to the worst off, cost-effectiveness) applied *after* the metric identifies the disadvantage.
      *   **Reasoning:** A common conflation. The currency defines the "space" of advantage (e.g., welfare, resources, capabilities). Distributive principles (e.g., egalitarianism, prioritarianism, sufficientarianism) then determine how to allocate resources based on that measure. The metric itself should be neutral to the claim.

  7.  **Practical Measurability at Population Scale (Non-Negotiable)**
      *   **Motivating Case:** The requirement to compute for ~250,000 residents using administrative data. A theoretically perfect metric is useless if reliable, consistent, and reasonably accurate data cannot be gathered affordably for the entire relevant population.
      *   **Reasoning:** A fundamental constraint of public policy. Metrics requiring deep individual psychological assessment or vast new data collection (e.g., detailed capability surveys) are often infeasible. Must leverage existing data (tax, benefits, health, education, housing, census) or scalable surveys.

  8.  **Sensitivity to Differential Conversion Factors (Important, but Negotiable Scope)**
      *   **Motivating Case:** The homebound resident with CFS. Even if she has the same financial resources as her neighbor, those resources "convert" into far fewer actual functionings (mobility, comfort) due to her health. A pure resource metric misses this.
      *   **Reasoning:** Core insight of the Capability Approach. Individuals differ in their ability to convert resources (income, goods) into valuable functionings due to health, disability, social location, or environment. A good metric should, where feasible, account for major, unchosen conversion barriers.

  9.  **Focus on Core Functionings Relevant to Social Participation (Important, Negotiable List)**
      *   **Motivating Case:** Comparing the home care attendant (supports health, personal dignity, avoiding isolation) vs. subsidized transit (supports mobility, work, access to services/community) vs. tax rebate (general resources). The metric should prioritize capabilities central to participation in society as a free and equal citizen (e.g., health, shelter, security, education, social inclusion, mobility).
      *   **Reasoning:** Nussbaum's Central Capabilities. Avoids getting bogged down in endless possible functionings. Focuses policy on enabling a minimally decent life and effective citizenship, providing a plausible "objective" list without being overly perfectionist. The *exact* list can be debated locally.

  **Analysis as Requested:**

  1.  **Non-Negotiable vs. Preferences/Tensions:**
      *   **Non-Negotiable:** 1, 2, 3, 4, 5, 6, 7. These are fundamental requirements of adequacy for a liberal, anti-oppressive, and practically implementable public equity metric.
      *   **Important but Negotiable (Scope/Interpretation):** 8, 9. *How* to measure conversion factors or the *precise list* of core functionings involves practical and normative compromises.
      *   **Key Tension:** #3 (Anti-Adaptive Preferences) and #1/#5 (Non-Imposition/Value Pluralism) **are in significant tension**. Correcting for adaptation (#3) requires *some* objective standard of significant functionings people *should* have access to (#9 helps), which risks imposing a conception of the good (#1) or undermining agency (#5) if done insensitively. **This tension is unresolvable at the level of desiderata; it requires careful balancing in the chosen metric's design and implementation.** #7 (Measurability) also strongly constrains how well any metric can satisfy #2, #3, and #8.

  2.  **Most Exclusionary Requirement:**
      *   **#7 (Practical Measurability)** does the most work *immediately* excluding contenders. Highly granular capability assessments or nuanced subjective welfare measures are generally infeasible for 250k people with administrative data, strongly pushing towards more objective, resource-based, or coarse-grained capability proxies. Pure preference-satisfaction welfare metrics are also severely undermined by #3 and #4.

  3.  **Candid Assessment of Genuineness vs. Prejudice:**
      *   **Genuine Demands of Adequacy:** #1, #2, #3, #4, #6, #7 are core demands arising from the fundamental aims of distributive justice (mitigating unchosen disadvantage, respecting pluralism, feasibility) and the specific cases. Ignoring them leads to metrics that are oppressive (#1), blind to real deprivation (#2, #3), wasteful (#4), conceptually confused (#6), or useless (#7).
      *   **Scholarly Camp Influence (Capability Approach Leaning):** #5, #8, #9 strongly reflect the Capability Approach (CA). While I argue they are *responsive* to the cases (especially the Deaf resident and differential impact of illness), a resourcist might reject #5/#8 as unnecessary (focusing solely on fair shares of resources, letting individuals choose), and a welfare egalitarian might reject #9 as paternalistic. However, #2 and #3 create powerful *rebuttals* against pure resourcism or welfarism in the given cases, making CA elements *highly relevant*, even if not the *only* possible response. The emphasis on freedom (#5) and conversion (#8) within CA directly addresses the limitations of resources and welfare exposed by the cases. This isn't mere prejudice, but a reasoned response to the inadequacies of the alternatives *in this context*.

  **Conclusion for the Panel:**
  This list reveals the inherent tensions in choosing a "currency," particularly between respecting pluralism and correcting for hidden disadvantage, all under severe data constraints. No metric will perfectly satisfy all desiderata. **The Capability Approach (focusing on a limited set of core functionings measurable via proxies) best navigates the core tensions (#1, #2, #3, #5), but its practical viability (#7, #8) hinges entirely on identifying measurable indicators within your city's data ecosystem.** Pure resource metrics struggle with #2, #3, and #8. Pure welfare metrics fail #1, #3, and #4 catastrophically. Your task is to find the most feasible capability-proxy metric that respects these constraints, acknowledging where practical compromises are necessary. Start by auditing available data against potential core functionings (e.g., health access/outcomes, safe housing, educational attainment, employment access, mobility, digital access, social connection proxies).
