  I'm a science and ideas journalist who also runs a twice-yearly statistics bootcamp for early-career reporters — sixteen people, one three-hour Saturday block — and I want a game for the session on aggregated data. The idea I want them to feel in their bones is Simpson's reversal: that a comparison between two groups can point one way in the aggregate and the opposite way within every meaningful subgroup, and that neither number is simply wrong — the real question is which one answers which question, and what you need to know to decide. Here's the scenario I've been imagining, which you should refine or replace if you can do better: participants play hospital-placement analysts at a fictional insurer, allocating two cohorts of patients — walk-ins in decent shape and urgent critical cases — between St. Antonia's and Mercy General. They receive printed slips summarizing a previous quarter: aggregate mortality is lower at St. Antonia's, but within each cohort it is lower at Mercy General, because St. Antonia's quietly receives far more of the easy cases. In round one, participants bet points on hospitals using only the aggregate table, and their scores rise or fall with outcomes drawn from cards or dice weighted to match the tables. In round two, half the room receives the cohort-split tables while the other half still sees only the aggregates, and the two halves must jointly allocate a new batch of patients before outcomes are drawn — so some participants will experience the reversal as information that others refuse to credit, and the room will have to negotiate the disagreement rather than merely observe the arithmetic. Design the full thing: the materials I can print or buy cheaply, the actual numbers, chosen so the reversal is genuine and the margins large enough not to be dismissed as noise, a scoring scheme that uses points rather than money, a minute-by-minute timeline for the three hours, and a debrief that maps specific moments in the game onto the formal distinction between marginal and conditional association, explains what the case-mix confounding does to the aggregate comparison, and takes up the hard part: given that both numbers are arithmetically correct, which one should steer the insurer's decision, and what would we need to know that the tables alone cannot tell us. You might also consider a short third round in which a third hospital enters the market and the aggregate happens to agree with the subgroups, so participants can see that reversals are knife-edge properties of particular partitions rather than permanent features of the world. Tell me what will predictably go wrong the first time I run it — I expect someone will spot the reversal from the slip design, or the room will decide the subgroup numbers are automatically the real ones — and how I should handle each failure. Finally, be honest about which feature of the actual phenomenon the game cannot reproduce and I will have to supply in the debrief; my own guess is that reversals in the wild never announce their stratification variable the way my handout does, but I'd like your assessment. Please write the whole thing as continuous prose only — no headings, bullet points, bold text, or tables — the way you would write a long memo to a colleague.
