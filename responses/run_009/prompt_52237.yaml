prompt: |-
  I'm advising a funder who can support a small group — four researchers over three years — on conceptual questions in AI safety via debate, where the funder wants the entire portfolio organized around the problem of obfuscated arguments. To fix terms: an obfuscated argument is one in which a misleading or false conclusion is defended by a very large set of individually verifiable but jointly unrepresentative considerations — every step checks out, yet the overall picture is wrong because the sheer bulk of the argument conceals the few considerations that would decide the matter. A standard illustration: a debater defends the claim that some chess move is a blunder by citing dozens of plausible refuting lines, each a valid sequence on inspection, while the one line that saves the move is buried in a search tree the judge will never have the budget to examine. The worry is that debate-based oversight — two systems arguing before a human judge — degrades precisely when arguments are obfuscated, because the judge's evaluation capacity is small relative to the size of the argument. Theoretical responses ask, roughly, for protocols in which an honest debater can refute an obfuscated argument with an effort that grows only logarithmically in the argument's length, but it is far from obvious that this ideal survives contact with human judges who have realistic limits on attention, time, and background knowledge.

  Given that setting, which open questions in this area matter most, and in what order should the team attack them? Please give a dependency-aware prioritization rather than a survey: for each question you rank highly, explain why it sits upstream of the others, whether it is tractable for theorists with backgrounds in complexity theory and epistemology rather than empirical machine learning, and what evidence over the next few years — new impossibility results, stronger protocol constructions, or empirical studies of how human judges actually fare against obfuscated argumentation — would move it up or down the list. I am equally interested in what you would deprioritize: for example, further game-theoretic analysis of ideally rational debaters, additional protocol constructions whose assumptions about judge competence are never tested, or work on judge-side heuristics that presupposes the very guarantees the protocols were meant to supply. Finally, tell me candidly whether you think the framing itself rests on a mistake — for instance, that obfuscated arguments are just ordinary epistemic opacity relabeled, or that the logarithmic-effort ideal is an artifact of idealized judges with no analogue among humans — since an answer of that kind would change where the money should go more than any ranking of the questions within it.
reasoning: |-
  We are given a specific problem setting: the funder wants to support research on obfuscated arguments in the context of debate for AI safety. The core issue is that in debate, an obfuscated argument (which is long and individually verifiable but jointly misleading) can overwhelm a human judge's limited capacity. The ideal goal is to have protocols where an honest debater can refute such an argument with effort logarithmic in the length of the obfuscated argument. However, we must consider the limitations of human judges (attention, time, knowledge).

  We are to prioritize open questions for a team of four researchers over three years, focusing on conceptual questions (so more theoretical than empirical). The team has backgrounds in complexity theory and epistemology, not necessarily empirical machine learning.

  Key considerations for prioritization:
  1. Dependency: which questions must be addressed first because they are foundational?
  2. Tractability for theorists (complexity theory, epistemology).
  3. What evidence in the next few years would change the priority (e.g., impossibility results, protocol constructions, empirical studies on human judges).
  4. We are also to deprioritize certain areas (like idealized game theory without human constraints, protocol constructions without testing judge assumptions, or judge heuristics that presuppose the protocol guarantees).

  We must also consider whether the framing is mistaken (e.g., obfuscated arguments being a relabeling of ordinary epistemic opacity, or the logarithmic ideal being infeasible for humans).

  I propose the following prioritization:

  ### Top Priority Questions

  1. **Formalizing the Problem and Judge Model**  
     - **Why upstream?** Before we can design protocols or evaluate them, we need a clear model of what an obfuscated argument is and what the constraints of the human judge are. This includes:
       - A complexity-theoretic model of obfuscated arguments (e.g., how to formalize the notion that the argument is long and individually verifiable but misleading).
       - A model of the judge's limitations: bounded attention (e.g., can only read a certain number of tokens), bounded time, and bounded background knowledge (what they can be assumed to know without being overwhelmed).
     - **Tractability for theorists:** This is highly tractable for complexity theorists and epistemologists. They can draw from computational complexity (e.g., interactive proofs, communication complexity) and epistemic logic (e.g., models of bounded rationality).
     - **Evidence that would move it:** 
       - If empirical studies (even small-scale) on human judges show that certain limitations are more critical than others (e.g., attention is more binding than time), that would refine the model.
       - If we find that the problem is inherently impossible under realistic judge models (an impossibility result), then the entire project might shift.

  2. **Feasibility of Logarithmic Refutation under Realistic Judge Models**  
     - **Why upstream?** This question is central: can we even hope for logarithmic effort? Without a positive answer, the entire research direction may be in jeopardy. We must investigate:
       - Whether there are inherent complexity-theoretic barriers (e.g., under standard complexity assumptions, no protocol can achieve logarithmic refutation for a broad class of problems without unrealistic judge abilities).
       - Whether there are any positive results (even in restricted settings) that show logarithmic refutation is achievable with a judge model that is plausible for humans.
     - **Tractability:** Complexity theorists are well-suited for this. They can look at reductions from known hard problems and interactive proof systems with bounded verifiers.
     - **Evidence that would move it:**
       - A strong impossibility result (e.g., showing that for NP-hard problems, no such protocol exists unless the polynomial hierarchy collapses) would lower priority and might shift focus to alternative approaches.
       - A positive result (even in a toy setting) would boost confidence and guide subsequent protocol design.

  3. **Designing and Analyzing Protocols with Realistic Judge Constraints**  
     - **Why next?** Once we have a judge model and know that logarithmic refutation is at least possible in some settings, we can design and analyze specific debate protocols that work under these constraints. This involves:
       - Modifying existing debate protocols (e.g., those from Irving et al.) to account for the judge's limitations.
       - Proving properties (e.g., soundness, robustness) under the judge model.
     - **Tractability:** This is a mix of complexity theory and protocol design. Theorists can use tools from interactive proofs and communication complexity.
     - **Evidence that would move it:**
       - Empirical studies on human judges interacting with debate protocols (even with current AI systems) might reveal which protocol features are helpful and which are not. This would guide the design.
       - If we find that no protocol can be both efficient and robust under the judge model, then we might need to revisit the judge model or consider alternatives.

  ### Lower Priority

  4. **Empirical Validation of Judge Models**  
     - **Why later?** While empirical work is important, we are prioritizing conceptual questions. This would involve designing experiments to test how humans handle obfuscated arguments in debate settings. However, without a formal model and without knowing what protocols are even theoretically possible, empirical work might be premature.
     - **Tractability:** This is more empirical and might require collaboration with experimental psychologists or ML researchers. Our team of theorists might not be the best for this, but they can design experiments that are theoretically informed.
     - **Evidence that would move it up:** If early theoretical work suggests a particular judge model is critical and we need to test it, then we might do small-scale experiments. Also, if we have a candidate protocol and we want to test it, then empirical work becomes necessary.

  5. **Judge-Side Heuristics**  
     - **Why deprioritize?** The problem states that we should avoid work on judge heuristics that presuppose the guarantees the protocols were meant to supply. We are focusing on protocols that make the judge's job easier by design, not on training judges to handle obfuscation (which might be impossible). Also, without a protocol, we don't know what heuristics to build.

  ### Deprioritized Areas

  - **Further game-theoretic analysis of ideally rational debaters:** We already have work on this (e.g., the original debate paper). The key challenge is human limitations, so we deprioritize the idealized setting.
  - **Additional protocol constructions without testing judge assumptions:** We will design protocols, but only with the judge model in mind. Constructions that ignore the judge's limitations are less relevant.

  ### Candid Assessment of the Framing

  Is the framing mistaken? There are two concerns:

  1. **Are obfuscated arguments just ordinary epistemic opacity?**  
     There is overlap, but obfuscated arguments are a specific form of opacity where the problem is the bulk of the argument hiding key counterexamples. This seems distinct enough to warrant specific study, especially in the interactive setting of debate.

  2. **Is the logarithmic-effort ideal an artifact of idealized judges?**  
     This is a real concern. In complexity theory, we have logarithmic-time verifiers for some problems (e.g., in interactive proofs for P), but these rely on the verifier being able to perform specific computations (like evaluating low-degree polynomials) that humans cannot. Therefore, the ideal might not transfer to humans. However, we don't know until we try to formalize the judge model and investigate. If we find that logarithmic refutation is impossible for humans, then we might need to aim for a more modest goal (e.g., polynomial with a low exponent) or consider augmenting the judge (e.g., with AI assistance).

  **Conclusion on framing:** The framing is not fundamentally mistaken, but it is contingent on the feasibility of logarithmic refutation for human judges. Therefore, we prioritize the feasibility question (item 2) early. If that fails, we must pivot.

  ### Proposed Order of Attack for the Team

  **Year 1:**
  - Focus on **Formalizing the Problem and Judge Model** (Priority 1) and **Feasibility of Logarithmic Refutation** (Priority 2). 
    - Split the team: two on formalization (one on argument structure, one on judge model) and two on feasibility (complexity barriers and positive constructions in simple settings).

  **Year 2:**
  - Based on Year 1 outcomes:
    - If feasibility looks promising, shift to **Designing and Analyzing Protocols** (Priority 3).
    - If feasibility is challenged, revisit the judge model and consider whether a different goal (e.g., sublinear but not logarithmic) is achievable, or whether we need to adjust the problem.

  **Year 3:**
  - Refine protocols and begin **Empirical Validation** (if the team has capacity or collaborates) on small-scale human studies to test the judge model and/or protocols.

  This plan is adaptive. If in Year 1 we get a strong impossibility result for logarithmic refutation under any plausible judge model, then we might need to pivot the entire portfolio (e.g., toward investigating alternative oversight methods or accepting higher effort). Similarly, if empirical work becomes critical earlier (e.g., to validate the judge model), we can adjust.

  Finally, the team should regularly review new evidence (impossibility results, positive constructions, empirical findings) and adjust priorities accordingly.
answer: |-
  ### Prioritization of Open Questions
  The core challenge is designing debate protocols where an honest debater can efficiently refute obfuscated arguments given human judges' limitations. Below is a dependency-aware prioritization, focusing on tractability for theorists (complexity theory/epistemology), key dependencies, and evidence that would shift priorities. I'll also address deprioritization and framing concerns candidly.

  ---

  ### **Top 3 Questions (Ordered by Dependency and Impact)**
  #### **1. Formalize "Human-Like Judge" Complexity Constraints**  
  **Why upstream?**  
  All protocol designs depend on a rigorous model of human judges. Current work often assumes idealized rationality (e.g., unbounded computation), but real judges have strict limits on attention, working memory, and background knowledge. Without this, we cannot evaluate whether protocols are feasible. This question is foundational:  
  - **Dependency:** Defines the computational "budget" for refutation (e.g., logarithmic effort must be achievable within attention/time constraints).  
  - **Tractability:** Ideal for complexity theorists. Use computational complexity frameworks (e.g., bounded Turing machines, communication complexity) to model:  
    - Attention: Fixed token limits per interaction.  
    - Time: Polynomial or sublinear steps for verification.  
    - Knowledge: Oracles for domain-specific priors (e.g., chess rules).  
  Epistemologists can integrate cognitive bounds (e.g., how humans chunk information).  

  **Evidence shifting priority:**  
  - ⬆️ **Up if:** Empirical studies (even small-scale) show humans consistently fail/succeed on specific argument structures (e.g., "buried counterexample" tests).  
  - ⬇️ **Down if:** New impossibility proofs reveal *no* protocol works under realistic constraints, forcing a pivot.  

  #### **2. Prove Feasibility of Logarithmic Refutation for Realistic Problems**  
  **Why upstream?**  
  This tests whether the core ideal is achievable. If logarithmic effort is impossible under human constraints, protocol design is futile. Focus on:  
  - **Dependency:** Requires the judge model (Question 1) to define "effort." Shapes all subsequent work—if infeasible, shift to damage control (e.g., quadratic effort).  
  - **Tractability:** Complexity theorists excel here. Reduce to interactive proof systems:  
    - Can an honest prover refute an obfuscated argument in $O(\log n)$ steps with a bounded verifier?  
    - Analyze problem classes: e.g., combinatorial games (like chess) vs. statistical claims.  
    - Key insight: Human judges may need "amortization" (e.g., caching common subproofs).  

  **Evidence shifting priority:**  
  - ⬆️ **Up if:** Constructions show logarithmic refutation for narrow domains (e.g., graph reachability) with human-like constraints.  
  - ⬇️ **Down if:** Strong impossibility results (e.g., reductions from PSPACE-hard problems show $\Omega(n)$ effort is required).  

  #### **3. Design Protocols Robust to Adversarial Obfuscation**  
  **Why next?**  
  With feasible bounds (Question 2), we design protocols where honest debaters *win* without overloading judges. Prioritize:  
  - **Dependency:** Builds on judge constraints (Question 1) and feasibility (Question 2). Focus on overcoming "joint unrepresentativeness" (e.g., forcing dishonest debaters to commit to falsifiable summaries).  
  - **Tractability:** Complexity theorists can adapt:  
    - **Interactive oracle proofs** (IOPs): Allow judges to query arbitrary argument steps.  
    - **Recursive debate:** Decompose arguments into sub-debates, controlling depth.  
  Epistemologists ensure protocols align with human heuristics (e.g., trusting high-level summaries).  

  **Evidence shifting priority:**  
  - ⬆️ **Up if:** Feasibility (Question 2) is proven, or empirical tests show humans handle IOPs well.  
  - ⬇️ **Down if:** Judge studies reveal protocols require superhuman memory (e.g., tracking recursive state).  

  ---

  ### **Deprioritized Areas**  
  - **Idealized Game-Theoretic Models:** Low priority. Existing work (e.g., Irving et al.) covers rational agents. Human bounds are the bottleneck—further analysis without constraints yields diminishing returns.  
  - **Untested Protocol Constructions:** Avoid new protocols without empirical validation. Constructions must be tested against the judge model (Question 1); otherwise, they risk being unusable.  
  - **Judge-Side Heuristics as Primary:** Deprioritize work relying on judges "detecting obfuscation" unaided. This presupposes guarantees protocols must provide—a circular dependency.  

  ---

  ### **Candid Assessment of the Framing**  
  The framing **is not fundamentally mistaken**, but it risks **over-optimism** about logarithmic effort and **underestimation** of human constraints:  
  1. **Obfuscated arguments ≠ general epistemic opacity:**  
     - The focus on "jointly unrepresentative" arguments is novel and worth studying. Unlike broad opacity (e.g., neural net interpretability), obfuscation exploits debate-specific dynamics (e.g., asymmetric proof burdens).  
  2. **Logarithmic effort may be infeasible for humans:**  
     - While logarithmic refutation works in theory (e.g., with probabilistic checks), human judges lack the consistency/unbiased randomness of idealized verifiers. **Evidence needed:** Early empirical tests (e.g., Can judges find "buried needles" in argument haystacks?). If humans consistently miss key points, logarithmic goals may be untenable.  
  3. **Pivot if human limits are prohibitive:**  
     - If evidence shows humans cannot handle even moderate refutation efforts, shift focus to:  
       - **Augmented judges:** E.g., AI-assisted oversight where protocols optimize for human-AI teams.  
       - **Alternative mechanisms:** "Truthful" debate formats that avoid obfuscation entirely (e.g., forcing comparisons via Socratic methods).  

  ---

  ### **Recommended Research Timeline**  
  1. **Year 1:** Tackle Question 1 (judge constraints) and Question 2 (feasibility).  
     - *Outputs:* Formal judge model, initial feasibility proofs/impossibility results.  
  2. **Year 2:** If feasibility is plausible, advance to Question 3 (protocols). If infeasible, pivot to judge augmentation.  
     - *Outputs:* Protocol designs, small-scale human experiments (collaborate with psychologists).  
  3. **Year 3:** Stress-test protocols against adversarial obfuscation and human judges.  
     - *Outputs:* Refined protocols or a pivot recommendation.  

  **Budget allocation:**  
  - 70% to Questions 1–2 (foundations), 30% to empirical validation (e.g., outsourcing behavioral studies).  
  - If Year 1 reveals existential barriers, redirect funds to judge augmentation or alternative oversight.  

  This approach ensures resources target the linchpins first: understanding human limits and the viability of efficient refutation. Without this groundwork, protocol design is premature.
