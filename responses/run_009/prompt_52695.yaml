prompt: |-
  My brother works in factual drama, and over Christmas we got into a running argument about what we owe the real dead when we dramatise them. I kept issuing verdicts on particular films without any principled basis, so I have tried to write down what I actually think, case by case, and I would like to know whether a principle captures it. Compressing ten years of patient work into one triumphant afternoon in a laboratory: fine. Giving a historical figure invented dialogue that expresses views she demonstrably held and wrote down elsewhere: fine. Creating a composite character — a rival stitched together from three real contemporaries so that no single person carries the blame: fine, and possibly more honest than the alternative. Having a named real person commit a wickedness for which there is no evidence — implying a colleague sabotaged the experiments when the record shows nothing of the sort: not fine, and not fine even with a disclaimer in the end credits. Inventing an affair between the subject and a real subordinate: not fine. Wholesale invention of private interiority — deathbed scenes, invented weeping, a diary no one ever found — for a long-dead public figure who put herself before the world: fine. The same wholesale invention for someone obscure who never sought attention and left little record: here I balk, though I can't say what changed.

  I can see two problems with my own list. First, the last two verdicts seem to run on publicness rather than fidelity, and I don't know whether that is a principled distinction or a prejudice about whose lives are fair game. Second, the affair verdict and the deathbed verdict point in opposite directions: both are inventions about a real person's private life, yet one imputes vice and the other imputes virtue, and only the former strikes me as a violation. That suggests a tentative principle of mine — something like: we owe the dead fidelity in their vices and licence in their virtues, so you may make the dead braver or kinder than they were, but not baser — and I would like this principle tested and repaired rather than accepted. It gets uncomfortable fast, though, because by its lights it should be fine to give a fully documented war criminal an invented moment of private decency, humanising him for the audience, and that is the case I keep going back and forth on: part of me says the principle licenses it and part of me says this is exactly where the licence should stop.

  So, please: state the principle or principles that best capture my verdicts, making each clause precise and tying it to the case that motivates it. Then tell me honestly which of my verdicts the best simple principle cannot accommodate, and whether I should pay that price or buy the complexity needed to save them all. Finally, apply the result to cases I haven't considered — the humanised war criminal, but also a drama that gives a real, long-dead disaster victim, someone who left barely a trace, an invented act of courage, and a biopic that rearranges the chronology so that events the subject caused appear to have merely happened to her. I want your predictions for those cases together with an argument for which verdicts, if any, I ought to give up.
reasoning: |-
  Okay, so the user is grappling with ethical principles for dramatizing real people in factual dramas. They've listed specific cases where they feel certain inventions are acceptable or not, but they're struggling to find a consistent principle. Their main concerns are around public figures versus obscure individuals, and inventing vices versus virtues.

  First, I need to parse their verdicts. They're okay with compressing timelines, using composite characters, inventing dialogue based on documented views, and interiority for public figures. But inventing affairs, unsubstantiated wickedness, or private details for obscure people crosses the line. The tension lies in why public figures are treated differently and why inventing virtues feels permissible but vices don't.

  The user's tentative principle—fidelity in vices, license in virtues—has a problem with humanizing war criminals. That's a key test case. Also, they're unsure about inventing courage for a disaster victim who left no trace. And there's the issue of rearranging chronology to shift agency from the subject to external events.

  I need to derive principles that fit their judgments. The core seems to be avoiding harm and respecting autonomy. Public figures have already exposed their lives, so some invention is fair game as long as it doesn't falsely vilify. For private individuals, their anonymity should be preserved; inventing anything substantial violates their right to be forgotten. The vice/virtue asymmetry ties into harm: attributing misdeeds can damage legacies and affect living relatives, while virtuous inventions might be seen as benign or even respectful.

  But the war criminal example challenges this. Adding a moment of decency could soften their image, potentially misleading audiences and causing pain to victims. The user is torn here. The principle might need refinement: perhaps the license to invent virtues applies only when it doesn't distort significant historical truths or cause harm. For someone like a war criminal, their documented crimes are central to their legacy, so any invented virtue that obscures that reality is problematic.

  For the obscure disaster victim, inventing courage might be acceptable if it's framed as a tribute and doesn't misrepresent known facts. Since there's no legacy or relatives to harm, and if it serves a narrative purpose without claiming historicity, it might align with the user's public figure stance. But the user initially balked here. Maybe the distinction isn't just public/private but the availability of counter-evidence. If nothing is known, invention is less likely to conflict with reality, but the ethical concern is about appropriating someone's identity without consent.

  Chronological rearrangement that removes agency is tricky. If it turns the subject from actor to victim, it falsifies their responsibility. That seems a violation of fidelity, as it distorts their role in events. The user hasn't mentioned this, but it's similar to inventing wickedness—both misrepresent agency negatively. Here, it's misrepresenting agency by omission, which could be equally harmful.

  So the principles could be: 
  1. **Harm Avoidance**: No inventions that would cause unjustified harm (e.g., false accusations, violating privacy of non-public figures). 
  2. **Fidelity to Agency**: Don't misrepresent someone's role in events; their actions and responsibilities must remain accurate. 
  3. **Legitimacy of Invention**: For public figures, interiority and virtues can be invented if they don't contradict known facts, but vices require evidence. For obscure individuals, avoid detailed inventions unless necessary, and ensure they don't create false narratives.

  The user might need to adjust their view on the obscure person. If the invention is minimal and doesn't attach negative traits, it might be acceptable. But they feel uneasy—perhaps because obscurity implies a greater ethical duty to not speculate. However, in a disaster victim's case, if the act of courage is presented as symbolic and not a definitive claim, it could be justified.

  For the war criminal, inventing a moment of decency is problematic because it risks whitewashing, unless it's clearly framed as fictional. Here, the user's initial principle breaks, and they might need to concede that virtues can't be invented if they undermine the factual gravity of the person's actions.

  The rearranged chronology case clearly violates the fidelity to agency principle. The subject's active role being turned passive distorts historical truth, similar to inventing wickedness. So the user should likely reject that as not fine.

  In summary, the principles derived should prohibit harmful misrepresentations, protect the obscure, and maintain accurate agency. The user might need to accept that inventing virtues for notorious figures is off-limits and allow some license for obscure individuals if done respectfully without negative implications. Complexity is necessary here; a single simple principle won't cover all cases without trade-offs.
answer: |-
  Based on your specific verdicts and the tensions you identify, I derive the following core principles:

  1.  **Harm Minimization Principle:** *Avoid inventions that cause unjustified harm to the living (e.g., descendants, communities) or unjustifiably damage the legacy/reputation of the deceased based on their documented life and values.* (Motivated by: Invented wickedness/sabotage, invented affair. These inventions inflict reputational damage, potentially harm living relatives/associates, and distort the historical record in a negative, consequential way.)
  2.  **Agency & Responsibility Fidelity Principle:** *Maintain fidelity to the subject's demonstrable agency, choices, and responsibility for significant actions or inactions.* Do not invent actions (especially negative ones) that misrepresent their character or role in events, nor distort chronology in ways that fundamentally misattribute agency (making them the victim of events they caused, or vice-versa). (Motivated by: Invented sabotage (misattributes blame/agency), invented affair (misrepresents character/choices). Contrasts with deathbed scene/interiority, which don't alter documented agency.)
  3.  **Consent & Public Persona Principle:** *The degree of permissible invention about private life/interiority is proportional to the extent the individual intentionally crafted and exposed a public persona during their life, and inversely proportional to the obscurity and privacy they maintained.* (Motivated by: Deathbed scene for public figure (fine) vs. similar invention for obscure person (balk). Public figures knowingly enter the arena of public interpretation; obscure individuals who sought privacy retain a stronger claim to it even after death.)
  4.  **Virtue-Vice Asymmetry Corollary (to Harm Minimization):** *Inventions attributing undocumented virtues (kindness, courage, private decency) are generally more permissible than inventions attributing undocumented vices (cruelty, dishonesty, infidelity), as the former are less likely to cause direct harm or damage a legacy in the same consequential way, provided they do not fundamentally distort the individual's documented character or historical role.* (Motivated by: Your explicit discomfort with invented vices vs. acceptance of virtuous interiority/deathbed scenes, and your tentative principle. The key caveat prevents whitewashing.)

  **The Best Simple Principle & Its Failure:**
  The simplest unifying principle is: **"Avoid inventions that unjustifiably harm the living or misrepresent the deceased's core character and documented agency, with greater license granted for the private lives of public figures."**

  *   **What it Accommodates:** It covers invented sabotage/affair (harm/misrepresentation), composite characters (no specific harm/misrepresentation), compressed timelines (not core agency), documented dialogue elsewhere (fidelity to views), virtuous interiority for public figures (license granted, no core misrepresentation/harm), and the balk at inventing interiority for the obscure (less license).
  *   **Where it Fails (and the Price):** This simple principle struggles with the **Virtue-Vice Asymmetry Corollary**, particularly its caveat. The simple principle doesn't *explicitly* differentiate the ethical weight of inventing virtues vs. vices. It relies on "unjustified harm" and "core character," but your intuition strongly distinguishes them even absent immediate *direct* harm. To fully capture your verdicts (especially the war criminal dilemma and the obscure disaster victim), you need the corollary's explicit asymmetry. **The price of simplicity is ambiguity on the virtue-vice boundary in high-stakes cases.** You should buy the complexity – the corollary is necessary for precision.

  **Applying the Principles (with Corollary) to New Cases:**

  1.  **The Humanized War Criminal:**
      *   **Principle Application:** The Virtue-Vice Asymmetry Corollary *permits* inventing a private moment of decency *in theory* (attributing a virtue). However, the Harm Minimization Principle and caveat ("provided they do not fundamentally distort the individual's documented character or historical role") come into sharp conflict.
      *   **Verdict Prediction:** **Not Fine (with your principles).** *Argument:* For a figure defined by documented, extreme wickedness (war crimes), an invented moment of private decency *fundamentally risks distorting* their core character and historical role *in the audience's perception*. It softens the horror, potentially implying mitigating factors absent in reality ("he wasn't *all* bad"), which *is* a form of misrepresentation and can cause harm by disrespecting victims, obscuring the true nature of evil, and potentially aiding revisionist narratives. The potential for harm and distortion outweighs the licence granted by the asymmetry. Your balking is justified; this is where the licence *should* stop. *You should hold this verdict.*

  2.  **Invented Act of Courage for an Obscure Disaster Victim:**
      *   **Principle Application:** Consent & Public Persona Principle (obscure, private individual) suggests caution. Virtue-Vice Asymmetry Corollary (attributing a virtue) leans towards permission. Harm Minimization Principle is key: is there harm in inventing courage for someone unknown?
      *   **Verdict Prediction:** **Fine (with caveats), aligning with your potential shift.** *Argument:* The obscurity factor (Consent Principle) makes you balk initially. However:
          *   Harm is unlikely: No known legacy to distort, no specific descendants likely harmed.
          *   It attributes a *virtue* (Courage - Asymmetry Corollary).
          *   The invention serves a narrative/humanizing purpose central to the drama about the disaster.
          *   Crucially, it doesn't *misrepresent documented agency* (Agency Principle) – we know nothing of their actions. It fills a void with something positive, honoring victims collectively rather than defaming an individual. While the Consent Principle creates unease, the lack of harm and the virtuous nature tip the balance towards acceptability. *You should accept this verdict as consistent with the refined principles.*

  3.  **Rearranged Chronology Diminishing Subject's Agency:**
      *   **Principle Application:** This directly violates the **Agency & Responsibility Fidelity Principle**. Making events the subject *caused* appear to merely *happen* to her fundamentally misrepresents her demonstrable role, choices, and responsibility.
      *   **Verdict Prediction:** **Not Fine.** *Argument:* This is as serious as inventing wickedness. It falsifies her historical impact, portrays her as passive rather than active, and distorts the causal chain of events. It misrepresents her core agency and responsibility, potentially absolving her (in the audience's mind) of blame she deserves or implying victimhood where there was control. This violates fidelity and can cause harm by misinforming the audience about history and the individual's role. *You should firmly hold this verdict.*

  **Conclusion & Recommendations:**

  *   **Your Core Principles:** Harm Minimization, Agency Fidelity, Consent/Public Persona, and the essential Virtue-Vice Asymmetry Corollary best systematize your judgments.
  *   **Verdicts to Uphold:** Your instincts against inventing vices, affairs, sabotage, and agency distortion are strongly supported. Uphold your balk regarding obscure individuals – the Consent Principle is valid. Uphold your rejection of humanizing war criminals via invented decency – the Harm/Distortion risk is too high despite the Asymmetry Corollary.
  *   **Verdict to Adjust:** Accept that inventing a virtuous act (courage) for a *truly obscure* disaster victim (where no harm/distortion occurs) is permissible under the principles. The Consent Principle unease is real, but the lack of counter-evidence, the virtuous nature, and the narrative purpose make this a justified exception where obscurity *enables* respectful invention, rather than forbidding it entirely.
  *   **Complexity is Necessary:** The ethical terrain is complex. A simple principle sacrifices too much precision, especially concerning the virtue-vice distinction and the interplay of harm, agency, and publicness. Embrace the nuanced framework you've implicitly developed.
