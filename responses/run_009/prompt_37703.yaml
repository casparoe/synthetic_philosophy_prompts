  ### Lampfish Glow: Underdetermination Simulation  
  **Objective:** Experience theory underdetermination (multiple theories fit the same evidence) through collaborative hypothesis-building, prediction, and pragmatic scientific pressures.  

  ---

  ### **Materials**  
  1. **20 Observation Cards** (details below; glow hidden until reveal).  
  2. **Team Worksheets** (for theories, predictions, patches).  
  3. **Scoreboard** (track points/patches).  
  4. **Timer** (strict 80-minute schedule).  

  #### **Deck Design**  
  *Hidden Rule*: The lampfish glows if:  
  - **Moon is new** (internal rhythm proxy)  
  - **OR**  
  - **Water is calm AND prey activity is high** (environmental/behavioral triggers).  

  *Deck Construction*:  
  - Engineered so moon phases, water conditions, and prey activity co-occur to support 3 theory families:  
    - **Internal Rhythm**: Glow tied to moon cycles (e.g., "Glows on new moons").  
    - **Environmental Trigger**: Glow tied to water conditions (e.g., "Glows in calm water").  
    - **Prey-Cue Response**: Glow tied to prey behavior (e.g., "Glows when prey is high").  
  - **Full 20-Card Deck** (glow determined by hidden rule; reveal "Glow?" during activity):  

  | Night | Moon     | Water    | Prey Activity | Glow? |  
  |-------|----------|----------|---------------|-------|  
  | 1     | Crescent | Stormy   | High          | No    |  
  | 2     | Half     | Stormy   | Low           | No    |  
  | 3     | Full     | Choppy   | Medium        | No    |  
  | 4     | Crescent | Calm     | Low           | No    |  
  | 5     | New      | Calm     | High          | Yes   |  
  | 6     | Crescent | Calm     | High          | Yes   |  
  | 7     | Half     | Calm     | High          | Yes   |  
  | 8     | Full     | Choppy   | High          | No    |  
  | 9     | Crescent | Calm     | Medium        | No    |  
  | 10    | New      | Calm     | High          | Yes   |  
  | 11    | Crescent | Choppy   | Low           | No    |  
  | 12    | Half     | Calm     | High          | Yes   |  
  | 13    | Full     | Calm     | Medium        | No    |  
  | 14    | Crescent | Stormy   | Low           | No    |  
  | 15    | New      | Calm     | High          | Yes   |  
  | 16    | Crescent | Calm     | Low           | No    |  
  | 17    | Half     | Stormy   | Medium        | No    |  
  | 18    | Full     | Calm     | High          | Yes   |  
  | 19    | Crescent | Choppy   | Medium        | No    |  
  | 20    | New      | Calm     | High          | Yes   |  

  **Key Collinearities**:  
  - New moons *always* co-occur with calm water + high prey (prevents falsifying non-moon theories).  
  - Non-new moon glows *only* when calm water + high prey co-occur (allows rhythm theories to patch).  
  - All 20 cards fit these 3 patched theories equally:  
    - *Patched Rhythm*: "Glows on new moons **OR** (calm water + high prey)."  
    - *Patched Environmental*: "Glows **only** in calm water **AND** high prey."  
    - *Patched Prey-Cue*: "Glows **only** with high prey **AND** calm water."  

  ---

  ### **Rules & Scoring**  
  1. **Teams**: 4 groups of 4 students (rival labs).  
  2. **Predictions**: Teams predict "Glow?" for designated nights (6, 9, 12, 15, 18).  
     - Correct prediction = **+1 point**.  
  3. **Patching**:  
     - After a failed prediction, teams may use **ONE** patch to adjust their theory (e.g., "Glows on new moons... **except when water is stormy**").  
     - Patch cost = **-3 points** (trade-off: save theory but lose credibility).  
     - Patch must be written + integrated into the theory.  
  4. **Funding Round**:  
     - After Night 9 (2 predictions), the expedition sponsor (you) funds **ONE** team (highest points → tie-break by vote).  
     - **Defection allowed**: Members of non-funded teams may join the funded team. Defectors carry no points.  
  5. **Winning**: Most points post-Night 18. Sponsor declares the funded team’s theory as "expedition’s conclusion."  

  ---

  ### **Timeline (80 Minutes)**  
  | Phase             | Time    | Activity                                                                 |  
  |-------------------|---------|--------------------------------------------------------------------------|  
  | **Setup**         | 0-5 min | Divide teams. Distribute Batch 1 (Nights 1–5). Explain: *"Find the glow rule."* |  
  | **Batch 1**       | 5-15 min| Teams develop theory + predict Night 6 glow.                            |  
  | **Reveal Night 6**| 15-17 min| Score predictions. Teams may patch if wrong.                            |  
  | **Reveal Nights 7–8** | 17-18 min| Share data (no prediction).                                       |  
  | **Predict Night 9** | 18-23 min| Teams update theories + predict Night 9.                            |  
  | **Reveal Night 9**| 23-25 min| Score predictions. Teams may patch if wrong.                            |  
  | **Funding Round** | 25-30 min| Fund highest-scoring team. Allow defection (1 min to decide).            |  
  | **Reveal Nights 10–11** | 30-31 min| Share data.                                                  |  
  | **Predict Night 12**| 31-36 min| Teams predict.                                                       |  
  | **Reveal Night 12**| 36-38 min| Score + patch if needed.                                              |  
  | **Reveal Nights 13–14** | 38-39 min| Share data.                                                |  
  | **Predict Night 15**| 39-44 min| Teams predict.                                                       |  
  | **Reveal Night 15**| 44-46 min| Score + patch if needed.                                              |  
  | **Reveal Nights 16–17** | 46-47 min| Share data.                                                |  
  | **Predict Night 18**| 47-52 min| Teams predict.                                                       |  
  | **Reveal Night 18**| 52-54 min| Score + patch if needed.                                              |  
  | **Reveal Nights 19–20** | 54-55 min| Share data.                                                |  
  | **Conclusion**    | 55-60 min| Sponsor announces funded team’s theory as "official."                  |  
  | **Debrief**       | 60-80 min| Guided discussion (below).                                             |  

  ---

  ### **Debrief (20 Minutes)**  
  **Goal**: Map gameplay to underdetermination, distinguishing "not-yet-resolved" from "permanent" underdetermination.  

  1. **Key Moments → Concepts**:  
     - *Finite Evidence*: "After Batch 1 (5 cards), did anyone feel their theory was proven? How did 15 more cards change that?"  
       → **Link**: Evidence is always finite; theories outrun data.  
     - *Patches*: "When you patched, what did it cost? Did it feel like a legitimate fix or a cop-out?"  
       → **Link**: Auxiliary hypotheses (Duhem-Quine) save theories holistically but erode parsimony.  
     - *Funding/Defection*: "Why did defectors switch teams? Did evidence or points decide funding?"  
       → **Link**: When evidence underdetermines, social/pragmatic factors (grants, prestige) "break ties."  
     - *Expedition’s Conclusion*: "The sponsor declared one theory ‘correct,’ but what did the full deck reveal?"  
       → **Link**: Underdetermination means evidence alone *cannot* pick a winner; non-evidential factors do.  

  2. **Two Types of Underdetermination**:  
     - *Temporary*: "Could new data resolve this? For example, a new moon with stormy water + low prey would falsify rhythm theories but confirm environmental/prey theories. We avoided this card deliberately."  
     - *Permanent*: "Collinear variables (e.g., new moons always with calm water + high prey) make underdetermination *inescapable*. No amount of data could distinguish theories if correlates are perfectly aligned."  

  3. **What the Game *Can’t* Reproduce** (Be Transparent):  
     - "You knew this was rigged—but real scientists don’t. They face genuine uncertainty."  
     - "Auxiliaries can be tested later (e.g., lab checks if calm water *alone* triggers glow); here, patches were untestable in-game."  
     - "Real science involves careers, institutional power, and decades of data—not 80 minutes."  
     - **Your Role**: Bridge gaps by sharing your lab story. Emphasize: "Underdetermination isn’t failure—it’s a structural feature of science. What matters is *how* we navigate it."  

  ---

  ### **Predictable Challenges & Fixes**  
  - **Problem**: Teams fixate on one theory family (e.g., all choose prey-cue).  
    **Fix**: Assign theory hints covertly (e.g., "Team 1: focus on moon/water/prey" without labels).  
  - **Problem**: Point ties at funding round cause chaos.  
    **Fix**: Tie-break by "best-explained anomaly" or sponsor fiat (it mirrors real grant decisions).  
  - **Problem**: Defectors dominate the funded team, silencing original members.  
    **Fix**: Cap defectors at 2 per team; require funded teams to integrate new members.  
  - **Problem**: Students resent the "rigged" deck.  
    **Fix**: In debrief, concede: "Yes, I engineered collinearity—but that’s *how* underdetermination arises in real systems (e.g., dark matter vs. gravity-modifying theories)."  

  ---

  **Why This Works**: Students *feel* the tension of clinging to a theory amid ambiguous data, experience pragmatic trade-offs (patching vs. points), and confront how social dynamics (funding/defection) "settle" underdetermined debates. The debrief ties gameplay to your lab story, making philosophy visceral.
