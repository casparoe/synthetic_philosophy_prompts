prompt: |-
  Say I'm a grad student with a philosophy-of-probability background and maybe two years of dissertation work to spend, and I've gotten sucked into the Sleeping Beauty rabbit hole after seeing a huge forum thread where nobody convinced anybody. Halfers, thirders, and then the people who insist it's all just a verbal dispute about what 'credence' means and we should all go home. I'm not sure I buy that dispute story, but I'm also not sure I want to spend two years arguing 1/2 vs 1/3 directly if that's basically settled as unfalsifiable. So help me prioritize the actual open questions in this space: is the more valuable work on how self-locating belief should connect to decision theory (what Beauty should *do* with her credence rather than what number she should report), on whether the Beauty framework generalizes cleanly to anthropic cases like the Doomsday argument or duplicated minds, on the verbal-dispute diagnosis itself (is there a real disagreement left once you fix a betting protocol, or does the protocol just smuggle in the answer?), or something else I'm not listing. For each, tell me whether it's upstream of the others, whether someone with a logic/probability background can actually make progress or whether it's a swamp, and what finding would tell me I picked wrong. I want a defended ranking, not a tour of the positions.
