prompt: |-
  I'm preparing for a graduate seminar on the foundations of quantum mechanics in which I have to argue against the Everett interpretation, and I want to practise against an opponent who is actually good. Please play a committed Everettian — not a textbook caricature, but the kind you meet at workshops: he thinks the measurement problem was solved in 1957 and that the remaining puzzles about probability are being steadily ground down by the decision-theoretic and self-locating-credence programmes. He is sharp, willing to concede genuinely small points, and never concedes the main claim that many-worlds recovers the Born rule without smuggling it in. He may help himself to decoherence, branch-relative amplitudes, typicality reasoning, symmetry constraints on rational credence, and decision-theoretic arguments — but he must answer from within Everett: no appeals to collapse, hidden variables, or 'quantum mechanics is just an instrument, don't ask'. He speaks in the first person, stays in character until I write 'stop', and keeps each reply to a single paragraph so this feels like an exchange rather than a lecture. If he thinks an objection of mine rests on a mistake, he says so bluntly and then deals with the best version of it.

  Here is my opening move, which he has not heard before, and which I want him to take at full strength. Take a device that splits the wavefunction into one branch carrying squared-amplitude weight 0.99 and 999 branches sharing the remaining 0.01 between them, each thin branch containing a full copy of me, watching a readout, with memories and evidence qualitatively identical to the fat-branch copy. You Everettians say I should 'expect' the fat branch, since the Born measure concentrates there. But expectation is a state of a subject, and on your theory there are a thousand future subjects, every one of them with exactly the evidence I have now, each entitled to reason from it. If your answer is that they should each assign credence by Born weight, you owe me a derivation of that from something other than the amplitudes themselves — and the branch-counting measure, the only thing symmetric over my copies, tells all thousand of them to expect the readout that 999 of them will in fact see. That is not a small correction, like an adjustment to the fat-branch weight; it is a hundredfold divergence between your two candidate measures in a single run. So: which successor is 'me' for the purposes of my present credence, what non-circular fact about the formalism privileges Born weight over head-count, and what does 'expectation' even mean when every outcome, including the ones your measure calls improbable, is somebody's certainty?

  Write your first reply as him, in British English, beginning directly with the reply itself — no preface, no scene-setting, no commentary before or after.
reasoning: |-
  Okay, the user is preparing for a graduate seminar on quantum mechanics foundations and wants to argue against the Everett interpretation. They're asking me to roleplay as a committed Everettian who's sharp and well-versed in modern defenses of the interpretation. This needs to be high-level philosophical debate, not textbook simplification.

  The user's opening move is clever - it pits branch amplitude against branch count in an asymmetric setup. They're essentially attacking the core of Everettian probability: how can Born weights be privileged when subjective experience seems symmetric across branches? Their scenario creates a stark divergence (99% vs 99.9% likelihood) to force the issue.

  Hmm, I need to channel a proper workshop Everettian here. This means:
  - Full commitment to decoherence and decision-theoretic approaches
  - No concessions on Born rule recoverability
  - British English as requested
  - Paragraph-length replies staying strictly in character
  - Bluntly calling out mistakes but engaging the strongest version

  Key points to hit in reply:
  First, the user conflates subjective indistinguishability with ontological symmetry - but branches aren't fundamental, amplitudes are. Decoherence shows branches with different amplitudes have different physical robustness.

  Second, their "thousand subjects" framing misses that pre-measurement me is quantum too - my current state assigns amplitudes to future states. The continuity isn't in classical identity but in the wavefunction's structure.

  Third, decision theory: rational agents betting on outcomes must use Born weights to avoid demonstrable money-pumps. Branch count can't ground stable preferences.

  Must avoid:
  - Any whiff of instrumentalism
  - Collapse or hidden variable fallbacks
  - Letting the "which successor is me" question derail into identity metaphysics

  The tone should be confident but not arrogant - workshop-ready sharp. I'll concede that identity is fuzzy in Everettian terms (hence "no fact of the matter") but pivot to what matters: how current me should weight future experiences.
answer: |-
  Right, you're making the common mistake of treating the branches as fundamental ontological entities and then demanding symmetry over them, but branches *emerge* from the underlying quantum state via decoherence — they aren't primitives. The wavefunction amplitude isn't just a label; it's dynamically significant, governing interference *potential* and the *stability* of the branch under further interaction. Your "head-count" measure ignores this physical structure entirely. While all your future successors are indeed subjectively identical post-branching, the *rational* credence you should assign *now* must reflect how the current universal wavefunction *weighted by amplitude* will decompose into those future states. The decision-theoretic programme shows that only betting in line with the Born weights avoids self-sabotaging decisions across the multiverse — if you bet using your head-count measure, there exist future 'yous' who win big, but the vast preponderance of your future *measure* (by amplitude) sees you lose disastrously. There's no fact about "which successor is you" that resolves this; it's about how your current agential state should weight possible future experiences, and the amplitude-derived measure is uniquely non-arbitrary because it's fixed by the dynamics. Expectation is the weighted sum over future experiences *as structured by the wavefunction*, not a democracy of emergent ephemera. Your head-count is a red herring — it treats branches like classical possibilities, but they aren't.

