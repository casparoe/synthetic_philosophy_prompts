prompt: |-
  My partner and I recently learned, through expanded carrier screening, that we are both carriers of the same recessive condition — serious, late-onset, and compatible with a good though shortened life. We now face a concrete choice: conceive naturally, accepting roughly a one-in-four chance that our child will express the condition, or pursue IVF with preimplantation genetic testing, which would give us a child free of the condition but, on anyone's account of embryonic development, a numerically different child. Reading around the issue, I ran into the nonidentity problem, and I have noticed that the standard presentations — Parfit's depletion case, the teenage mother, the risk-of-defect scenarios — do not cleanly settle our situation. Before we decide, I want to be clear about what I should be demanding of any answer to this problem, because the practical advice we receive will only be as good as the theory behind it.

  Please write the desiderata: what an adequate treatment of the nonidentity problem must deliver, with the case or consideration motivating each requirement. I would particularly like you to address the following, though I do not want the list limited to them: which cases the treatment must get right (including, importantly, a probabilistic version like ours, where identity is fixed regardless of outcome and only the risk attaches to the choice — I suspect this behaves differently from the textbook cases, and a good theory must say whether it does); which distinctions it must respect — for instance, between being harmed and being wronged, between making a person worse off and making the world worse, and between the claim that an action was wrong and the claim that a particular person has a complaint against it; and whether the theory owes us a verdict that is action-guiding rather than merely classificatory, since some of us have a decision to make within the month.

  Mark which requirements are non-negotiable for a theory that could guide a real decision like ours and which are, in your judgment, preferences of particular camps rather than genuine demands. Then tell me where the genuine tension lies: in particular, whether the person-affecting intuition — that morality is fundamentally about making people worse off — can be held alongside the conviction that identity-affecting choices (depletion, or conceiving when one could have avoided the risk) can be wrongs without being harms to any identifiable person. If some subset of the desiderata is jointly unsatisfiable, say so explicitly and say which requirement you would drop. Finally, in a few sentences each rather than a full scorecard, indicate how the familiar escape routes — harm-free wrongings, impersonal principles about the quality of lives, and views that deny identity is ever a moral obstacle in these cases — do against the list. Keep the weight on the requirements themselves; the camps and their signatures are the part I can look up, but only the specification will tell me whether the answer we eventually act on is any good.
reasoning: |-
  Okay, the user is dealing with a deeply personal and ethically complex situation. They and their partner are both carriers of a serious recessive condition and are facing a reproductive choice with profound philosophical implications. They've encountered the nonidentity problem in their research and are seeking clarity on what constitutes a robust ethical framework to guide their decision. 

  The core of their request is methodological: they want a set of rigorous criteria to evaluate ethical theories, specifically tailored to their probabilistic nonidentity scenario. They're not asking for a direct answer (which would be irresponsible to give without proper genetic counseling), but rather the tools to assess whatever advice they receive. This shows impressive intellectual humility and precision.

  Hmm, their case has unique features that distinguish it from classic nonidentity examples: (1) identity is fixed regardless of choice (natural conception always produces the same child), (2) the harm is probabilistic (25% chance of disease expression), and (3) the alternative (PGT-IVF) guarantees a healthy child but changes identity. Most literature focuses on either deterministic harm or identity-altering choices, so this hybrid case needs special attention.

  They're explicitly asking for desiderata that cover: 
  - Necessary vs negotiable theoretical features 
  - Treatment of probabilistic cases 
  - Key distinctions (harmed vs wronged, personal vs impersonal) 
  - Action-guidance requirement 
  - Tension between person-affecting intuition and impersonal wrongs

  The emotional weight here is significant. They mention needing to decide "within the month," so the response must balance philosophical rigor with practical urgency. Their tone suggests they've done substantial research but feel standard frameworks don't quite fit. There's an unspoken need for ethical clarity that doesn't dismiss their emotional stakes - they describe the potential child's life as "good though shortened," indicating they're resisting simplistic "disease=wrongful life" narratives.

  Professionally, I should note: 
  1. The fixed-identity aspect is crucial. Unlike Parfit's depletion case where different people exist, here natural conception produces Child A who might be healthy or ill, while IVF produces Child B who's healthy. This collapses two nonidentity subproblems: probabilistic harm to a fixed identity vs identity-altering prevention of harm. 
  2. The harm/wrong distinction becomes vital because Child A can't claim they'd be better off unborn (if ill) since their life is still worth living - yet the parents' choice might still be objectionable. 
  3. Action-guidance is non-negotiable. Theoretical elegance means nothing if it can't direct their concrete choice.

  I'll structure the desiderata to first establish absolute requirements (probabilistic handling, action-guidance, etc.), then show where theories diverge. The tension between person-affecting and impersonal approaches must be laid bare without advocacy - their phrasing suggests they'll reject any theory that entirely dismisses the intuition that morality concerns actual people. The IVF alternative complicates impersonal "better world" arguments since it creates a different happy child rather than preventing a miserable one.

  Most importantly, the response must avoid implying one choice is "correct." The ethics here are genuinely contested, so the desiderata should equip them to interrogate any advice they receive, whether from clinicians, ethicists, or religious counselors. Their closing line about "the answer we eventually act on" reveals awareness that philosophy informs but doesn't replace personal judgment.
answer: |-
  Below is a systematic specification of the desiderata for an adequate treatment of the nonidentity problem, tailored to your probabilistic case and the need for action-guidance. Requirements are categorized as **non-negotiable** (essential for practical decision-making) or **negotiable** (domain-specific or contested). Tensions and trade-offs are explicitly identified.

  ---

  ### **Core Desiderata for an Adequate Treatment**  
  *(Non-negotiable requirements in bold)*

  1. **Handles Probabilistic Harms to Fixed Identities**  
     - **Case**: Your scenario (natural conception risks harming a specific, identifiable child; IVF avoids harm but alters identity).  
     - **Requirement**: Must distinguish between (a) choices affecting *who exists* (e.g., depletion) and (b) choices imposing *risks on a fixed individual* (e.g., your natural conception option). A theory must explain why risking harm to a specific child is wrong, even if their life is worth living.  
     - **Non-negotiable**: Yes. Your decision hinges on this asymmetry.

  2. **Delivers Action-Guidance**  
     - **Case**: Your urgent need to decide between conception methods.  
     - **Requirement**: Must yield a clear verdict on which option is permissible/impermissible, not merely categorize abstract wrongs.  
     - **Non-negotiable**: Yes. Purely classificatory theories (e.g., some desert-based views) fail this test.

  3. **Respects the Harm/Wrong Distinction**  
     - **Case**: A child born with the condition cannot claim they are "harmed" (their life is better than nonexistence), yet parents may still feel they wronged the child.  
     - **Requirement**: Must explain how an act can wrong someone (e.g., violate duties of care) without making them *worse off*.  
     - **Non-negotiable**: Yes. Without this, the nonidentity problem dissolves all duties to future children.

  4. **Distinguishes Personal vs. Impersonal Harms**  
     - **Case**: Depletion (choosing a policy that causes future pollution) makes future people worse off than *possible* people, but not worse off than *they* would otherwise be.  
     - **Requirement**: Must clarify whether wrongness stems from harming *a person* or creating a *worse world*.  
     - **Non-negotiable**: No (theoretical preference). But a good theory should state its stance.

  ---

  ### **Secondary Desiderata**  
  *(Negotiable but important for coherence)*

  5. **Accommodates Person-Affecting Intuition (PAI)**  
     - **Case**: The belief that morality must connect to impacts on actual people.  
     - **Requirement**: Should reconcile PAI with impersonal harms (e.g., "We wronged this child by risking their health" vs. "We created a worse world").  
     - **Negotiable**: Yes. Some consequentialists reject PAI entirely.

  6. **Explains Textbook Cases Correctly**  
     - **Cases**: Depletion (impersonal), teenage mother (fixed-identity risk), Wilma (infertility treatment causing blindness).  
     - **Requirement**: Need not treat all identically, but must justify differential verdicts (e.g., why risking harm to a fixed child is worse than creating a different harmed child).  
     - **Negotiable**: No. Consistency with intuitions in clear cases is essential.

  7. **Clarifies the Nature of Wronging**  
     - **Requirement**: Must specify whether wronging requires a *complaint* from the victim (e.g., your child cannot complain if their life is worth living) or a *duty violation* independent of complaints.  
     - **Negotiable**: Yes. Complaint-based theories (e.g., contractualism) struggle here.

  ---

  ### **Tensions and Trade-offs**  
  The central tension is between:  
  - **The Person-Affecting Intuition (PAI)**: Wrongs require a victim who is made worse off.  
  - **The Impersonal Intuition**: Some choices are wrong due to creating avoidable suffering, even if no victim is identifiably harmed.  

  **Your case intensifies this tension**:  
  - Natural conception: Risks harming a specific child (supports PAI), but the child cannot claim to be worse off than nonexistence.  
  - IVF: Avoids suffering impersonally by creating a different child, but severs the victim-focused link.  

  **Joint Satisfiability**:  
  - **PAI + Fixed-Identity Risk**: *Can* be reconciled via a **duty-based view**: Parents have a duty to avoid imposing serious risks on their child (a fixed victim), even if the child isn’t harmed overall. This satisfies PAI by focusing on the child’s interests.  
  - **PAI + Identity-Affecting Choices**: *Cannot* be reconciled. If IVF creates a different, healthy child, no one is harmed, so PAI implies no wrong occurs. Yet many intuit that choosing to risk harm (natural conception) *is* wrong.  

  **Trade-off Required**:  
  To condemn identity-affecting wrongs (e.g., depletion), you must drop strict PAI and accept **impersonal principles** (e.g., "it’s wrong to create avoidable suffering"). For your fixed-identity risk, PAI-compatible theories suffice.  

  ---

  ### **How Theories Fare Against Desiderata**  
  1. **Harm-Free Wrongings (Deontological)**  
     - *Strengths*: Clears non-negotiable desiderata (action-guidance, harm/wrong distinction, probabilistic/fixed-identity cases). Argues parents have duties to minimize risks to their child.  
     - *Weaknesses*: Struggles with identity-affecting cases (e.g., depletion).  

  2. **Impersonal Principles (Consequentialist/Total View)**  
     - *Strengths*: Condemns both probabilistic risks and depletion by comparing worlds.  
     - *Weaknesses*: Violates PAI; may imply dubious duties (e.g., "create as many happy people as possible").  

  3. **Identity-Is-Irrelevant Views (e.g., Some Capabilities Approaches)**  
     - *Strengths*: Treats all cases uniformly: avoid creating suffering where possible.  
     - *Weaknesses*: Ignores the moral significance of harming vs. replacing a person; weak action-guidance (doesn’t prioritize fixed-identity risks).  

  ---

  ### **Conclusion**  
  For your decision, an adequate theory **must**:  
  - Prioritize fixed-identity risks (desideratum 1),  
  - Guide action (desideratum 2),  
  - Explain harm-free wronging (desideratum 3).  

  **The tension is resolvable** for your case without abandoning PAI: A duty-based view can condemn natural conception as a breach of parental obligation to your specific child. IVF becomes a discharge of that duty. However, to condemn *identity-affecting* choices (e.g., depletion), PAI must be relaxed. Since your choice involves a fixed child, PAI-compatible theories suffice.  

  **Practical advice**: Prioritize theories that ground duties to avoid imposing risks on identifiable future persons (e.g., Kantian reproductive ethics or risk-sensitive consequentialism). These directly address your core dilemma without requiring impersonal trade-offs.
