prompt: |-
  ok so I'm a junior and I basically run our school's robotics team — I'm the student captain, we have a faculty advisor but he mostly just signs forms. we're about 30 people and we keep getting into fights about who actually gets a say in team decisions. it used to be simple, whoever shows up to the meeting votes, but this year it's a mess. some examples from just the last few months:

  - a girl who moved to another state but still wants to vote on our competition lineup over discord (her family still pays the activity fee somehow, or says they do)
  - two homeschooled kids who joined through a friend and come to literally every meeting
  - an alumni mentor who founded the team back in like 2015 and shows up more than half the current members do — does he get a vote?
  - a senior who's checked out and hasn't come since october but still wants to weigh in on how we spend the $800 left in the budget

  and the questions aren't just "who votes" — it's who votes on spending money, who gets a say on who takes the 12 spots in the van to regionals, whether we can kick someone out, even whether parents get to talk at our meetings. so basically every couple weeks there's a new one, the stakes are small individually but the fights eat whole meetings and one kid already quit over it.

  I have to chair these and I'm tired of every argument turning into "well I've been on this team longer than you." it's honestly not about robotics at all, it's about who counts as part of the group. I've heard there's actual political philosophy about this, something about who belongs to the demos, like the difference between everyone affected by a decision and everyone subject to it or something — not sure I'm saying that right, that's kinda why I'm asking.

  can you write me an actual procedure the five of us on the officer team can run whenever a "wait, does X get a vote?" question comes up? like: the questions to ask in order, what counts as a good enough answer to each one, where the procedure just says no and that's it, and where it has to stop and hand it back to us because it's a values thing we shouldn't pretend has an objective answer. it has to be usable in ten minutes at the end of a build session by tired people, not a philosophy essay, and anything involving money still needs the advisor's signature so factor that in.

  then run it on three of the fights above — the girl who moved away, the alumni mentor, and the checked-out senior voting on the budget — and be honest if any of them come out in a way I definately won't like. also tell me what the procedure can't do, the cases it'll just choke on, because I know there will be some.
reasoning: |-
  Okay, the user is a junior and the student captain of their high school robotics team. They're dealing with a messy situation where there's constant fighting over who gets to vote on team decisions. The team has about 30 people, and their faculty advisor is mostly hands-off, just signing forms. 

  The user described several specific problems: a member who moved out of state but still wants to vote remotely, homeschooled kids who attend every meeting, an alumni mentor who's very involved but not a current student, and a senior who's checked out but wants input on budget decisions. These conflicts are eating up meeting time and causing one member to quit already. 

  They mention political philosophy concepts like "who belongs to the demos" but need practical solutions, not theory. They want a clear, step-by-step procedure that their officer team can use in about 10 minutes during meetings. It needs to handle voting eligibility questions objectively where possible, but also recognize when it's a values decision. The procedure must account that the advisor still has to sign off on money matters. 

  I should create a decision tree that's efficient and fair. Key principles would include active participation, direct impact from decisions, and alignment with the team's educational purpose. The steps should start with simple questions like physical presence and move to more nuanced ones like commitment level and consequence of decisions. 

  For the three test cases: the out-of-state student would likely not get a vote because she can't attend meetings or contribute physically. The alumni mentor might get limited voice but no vote since he's not subject to team rules as a student. The checked-out senior wouldn't get to vote on budget since they're not active. 

  I should be honest that the alumni mentor outcome might frustrate some who value his contributions, but the procedure prioritizes current student governance. Limitations include cases where participation is borderline or when external parties like parents demand input - those need subjective judgment calls by officers. 

  The procedure should have clear stopping points where officers must make a values-based decision, and emphasize documenting these precedents. It should also remind everyone that the advisor has final approval on financials regardless of votes. 

  This approach balances efficiency with fairness, reduces meeting time wasted on arguments, and empowers the officer team while acknowledging some decisions require human judgment.
answer: |-
  Here's a battle-tested procedure designed for speed, clarity, and minimizing philosophical debates during crunch time. It prioritizes **active participation, direct consequence, and the educational mission**.

  **Robotics Team Voting Eligibility Procedure (The "Who Gets a Vote?" Flowchart)**

  **Goal:** Determine if Person X has a *voting right* on *this specific decision* at *this specific time*.
  **Time Limit:** 10 Minutes Max. Stop at Step 4 if time runs out; officers vote immediately on eligibility.
  **Officer Role:** Chair asks questions neutrally. Officers vote only if the flow hits a "Values Call" or time runs out. Document the decision & reason briefly.
  **Advisor Note:** *All financial decisions require advisor signature AFTER any vote. Voting eligibility does not override this.*

  **The Flowchart (Ask Sequentially):**

  1.  **Is Person X Physically Present at THIS Meeting?**
      *   **YES:** Proceed to Step 2.
      *   **NO:** **No Vote.** *(Rationale: Core principle - Active participation requires presence for real-time debate & immediate consequence. Exceptions are untenable long-term.)*

  2.  **Is Person X a CURRENTLY ENROLLED STUDENT at our school OR a formally approved homeschooler participating under school/district policy?**
      *   **YES:** Proceed to Step 3.
      *   **NO:** **No Vote.** *(Rationale: The team is fundamentally a school activity for current students. Alumni, parents, community members are valued contributors but not primary decision-makers subject to the rules.)*

  3.  **Has Person X attended at least 50% of the official team meetings/workshops IN THE LAST 8 WEEKS?** (Officers track a simple attendance log)
      *   **YES:** Proceed to Step 4.
      *   **NO:** **No Vote** *on this specific decision.* *(Rationale: Voting rights require consistent contribution and bearing the consequences of decisions. "Ghost members" shouldn't decide.)*

  4.  **Is the Decision Primarily About...?**
      *   **a) Core Robotics Work (Design, Build, Code, Strategy, Competition Rules/Lineup):** **YES - Gets Vote.** *(Rationale: Directly impacts their work, learning, and competition experience.)*
      *   **b) Team Logistics (Meeting Times, Van Spots, Non-Technical Schedules):** **YES - Gets Vote.** *(Rationale: Directly impacts their participation and ability to contribute.)*
      *   **c) Team Discipline/Removal:** **YES - Gets Vote** *ONLY if they are directly involved in the situation or it impacts team safety.* Otherwise, officers decide. *(Rationale: Avoids conflicts of interest; core team governance.)*
      *   **d) Budget Allocation:** **YES - Gets Vote** *ONLY if the spending directly funds work they are ACTIVELY involved in (e.g., buying parts for their subteam).* Otherwise, officers decide with advisor approval. *(Rationale: Spend money where active effort is applied.)*
      *   **e) Team Constitution/Governance/Membership Rules:** **VALUES CALL - Officers Vote.** *(Rationale: Foundational rules require broader consensus but need focused deliberation. Officers represent continuity.)*
      *   **f) Parental Involvement/External Input:** **No Vote** for non-students. Officers decide communication/input policy for parents. *(Rationale: Parents are stakeholders but not team members.)*

  **Where it Stops & Says No:**
  *   Step 1 (Not Present)
  *   Step 2 (Not Current Student)
  *   Step 3 (Insufficient Attendance - *for this vote*)
  *   Step 4d (Budget - Not Actively Involved)
  *   Step 4f (Parents/External)

  **Where it Hands Back (Values Call - Officers Vote Immediately):**
  *   Step 4e (Team Constitution/Gov Rules)
  *   Step 4c (Discipline - If not directly involved)
  *   **ANY TIME** the officers feel the flowchart produces an outcome fundamentally at odds with the team's core mission or fairness (*rare, but document why*).

  **Running the Test Cases (Honestly):**

  1.  **The Girl Who Moved Away:**
      *   Step 1: Is she physically present? **NO. --> NO VOTE.**
      *   *Why you might not like it:* She feels invested, paid a fee. It feels harsh.
      *   *Flowchart Rationale:* Presence is non-negotiable for active, accountable participation. Remote voting creates precedent chaos. Fees ≠ voting rights (treat them as donations/support if paid).

  2.  **The Alumni Mentor:**
      *   Step 1: Present? **YES.**
      *   Step 2: Current Student? **NO. --> NO VOTE.**
      *   *Why you might not like it:* He's dedicated, knowledgeable, founded the team! His input is valuable.
      *   *Flowchart Rationale:* The team belongs to the *current* students. His role is advisor/mentor, not member. He provides input, not votes. Giving him a vote undermines student leadership and blurs roles.

  3.  **The Checked-Out Senior (Voting on $800 Budget):**
      *   Step 1: Present? **NO (assumption: not at *this* meeting). --> NO VOTE.**
      *   *Even if miraculously present:*
          *   Step 2: Current Student? **YES.**
          *   Step 3: Attended >50% last 8 weeks? **NO (hasn't come since Oct). --> NO VOTE on *this* decision.**
          *   Step 4d: Budget - Actively involved? **NO. --> NO VOTE.**
      *   *Why you might not like it:* He's technically a member, maybe feels entitled as a senior.
      *   *Flowchart Rationale:* Consistent absence removes accountability. Budget votes require involvement in the work being funded. Seniority ≠ eternal privilege.

  **What the Procedure CAN'T Do (Limitations & Choke Points):**

  1.  **The "Borderline" Active Member:** Someone hovering around the 50% attendance mark. The flowchart forces a binary (Yes/No), which might feel unfair. Officers need to apply the rule consistently and perhaps review the attendance threshold periodically (another Values Call).
  2.  **The Critical Non-Student:** What if the Alumni Mentor or a specific parent has *essential* expertise for a technical decision? The flowchart says "No Vote," but officers must deliberately seek their *input* before the vote without granting a vote. Managing this distinction takes practice.
  3.  **Defining "Actively Involved" (Budget):** Is someone who occasionally sweeps the shop floor "actively involved" in the pneumatics budget? Officers need a common-sense interpretation (e.g., "contributes significant, regular effort to the subsystem needing the funds").
  4.  **"Subject to the Decision" vs. "Affected":** The homeschooler denied a van spot is deeply *affected*, but if they missed meetings (Step 3), they aren't *subject* to the vote. This feels harsh. The flowchart prioritizes participation over potential impact. Officers might need a compassionate aside, but the rule stands.
  5.  **The Blatantly Unfair Outcome:** If the flowchart, followed perfectly, leads to an outcome everyone agrees is terrible (e.g., barring a key contributor on a technicality), officers MUST use the "Values Call" override and vote to grant eligibility *this one time*, **documenting the exceptional reason clearly**. Don't break the procedure lightly.
  6.  **Parent Revolt:** The procedure explicitly excludes parents from voting. If they demand a say in major decisions (like budget or travel), the officers (with advisor support) need to have a separate, clear policy on parent communication and advisory roles, *outside* the membership voting structure.

  **Key to Success:**

  *   **Track Attendance Religiously:** A simple sign-in sheet is vital for Step 3.
  *   **Officer Unity:** The 5 officers MUST agree to uphold the procedure's outcomes, even when unpopular. Discuss the rationale beforehand.
  *   **Transparency:** Explain the steps and reasoning *briefly* when applying it ("Per our procedure, because you weren't present, you don't get a vote on this today, but we value your input via Slack later.").
  *   **Document Precedents:** Keep a log of Values Calls and borderline decisions for future reference.
  *   **Review Annually:** At the *start* of next season, review the procedure itself (a Values Call!) based on experience.

  This won't eliminate all conflict, but it provides a fast, objective framework that prioritizes the active, contributing student core of the team, minimizes "seniority" arguments, and gets you back to building robots much faster. Good luck, Captain!
