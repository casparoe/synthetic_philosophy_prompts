prompt: |-
  I write historical fiction, and my town has spent two years arguing about its monuments, so I have been forced to notice that I hold verdicts I cannot fully justify. Here they are, as honestly as I can state them, and I would like a principle — or a short list of rival principles — that captures them.

  The Confederate cavalry officer on the courthouse lawn, erected in the 1920s as an assertion of the racial order, comes down; I have no hesitation there. A statue of that same officer, moved into the county museum with a wall of text beside it, I would keep indefinitely. Our town founder, a slaveholder whose bequest built the library, stays on his pedestal, but I want a plaque that tells the whole ledger. The street named for a doctor whose fame was the state eugenics program — a name nobody now recognizes — I would rename without ceremony. But the bronze plaque honoring the novelist born three streets over, a man whose private correspondence is vicious on the subject of nearly everyone, I would keep untouched, because his books are still read and still good. The middle school named for a twentieth-century industrialist whose fortune came from labor practices he knew were brutal, and named to honor the donation, I would rename — and here I notice I cannot say why the industrialist loses and the novelist survives, since both are honored for what they made, and what they made is inseparable from what they did.

  My tentative principle is something like this: remove when the commemoration itself honors the wrongdoing; recontextualize when the wrongdoing is incidental to what is honored; and where the honored work survives and is good independent of the vice, the commemoration may stand. But I can see it wobbles. Our founder's civic achievement was financed by the slaveholding, so his wrongdoing is not exactly incidental; the museum statue of the cavalry officer honors the same man the courthouse statue honors, and my principle seems to make the interpretive setting do all the moral work without saying why that is legitimate; and the novelist's bigotry arguably shaped the books, which is a sentence I resent writing.

  There is also the case I cannot settle: the war memorial in the square, a generic soldier erected after the First World War as a gesture of mourning and reconciliation, which a far-right group has lately adopted as its rallying point, so that the monument's public meaning is being changed under it by people who did not build it. I want to keep it, and I distrust the wanting.

  Please test my principle against the cases, repair it or replace it, and tell me plainly which of my verdicts the repaired version cannot save — and, since the answer may bear on how my next novel handles a man it must render sympathetically, what it predicts for the one case I have not decided: a commemorative name chosen, in living memory, to honor someone who was then believed to be a hero and has since been shown to be a fabrication. Please answer in American English.
reasoning: |-
  Okay, the user writes historical fiction and is grappling with how their town handles controversial monuments. They've shared specific cases and their gut reactions, seeking principles that can justify or challenge those instincts. 

  First, let's unpack their examples: They want the Confederate statue gone but preserved in a museum context. The slave-owning founder stays with added context. The eugenics doctor's street name gets erased without fuss. The bigoted novelist's plaque stays untouched. The industrialist's school gets renamed but the novelist doesn't—and this inconsistency troubles them. There's also an undecided case about a WWI memorial co-opted by extremists. 

  Hmm. Their struggle centers on three tensions: 
  1) How closely the wrongdoing ties to what's being honored 
  2) Whether the commemorated work has enduring independent value 
  3) Who controls the meaning of a monument when it shifts over time 

  Their proposed principle (remove if honoring wrongdoing, recontextualize if incidental, preserve if work stands apart) is thoughtful but cracks under scrutiny. The founder's wealth came from slavery—not incidental. The museum relocation magically sanitizes the same man. The novelist's bigotry might permeate his "good" books. 

  What they really need isn't rigidity but a framework for weighing competing values. I'll propose balancing four principles: 
  - Harm prevention (does this actively oppress?) 
  - Historical integrity (does context reveal complexity?) 
  - Enduring value (does the achievement transcend its flaws?) 
  - Community ownership (who decides meaning?) 

  Testing this: 
  - Confederate statue fails all but historical integrity—hence museum as compromise. 
  - Eugenics doctor has no redeeming value or achievement—erase. 
  - Industrialist's "achievement" is the harm itself—rename. 
  - Novelist's work has independent value—preserve. 
  - The founder... tricky. His achievement (library) is separable from funding source? Plaque must expose the cost. 

  The WWI memorial: Its original intent (mourning) still has value, and extremists don't get to monopolize meaning. Solution: double down on contextualizing ceremonies. 

  Ah—the undecided case! A fabricated hero honored in living memory. Here, the lack of authentic achievement + recent deception makes removal clean. No enduring value to weigh. 

  Finally, their novel's sympathetic portrayal of a flawed character: This framework helps. Show the harm, the achievement, and let readers sit with the tension. Like the founder's plaque—the whole ledger. 

  Key insight: Monuments aren't just about the past; they're negotiations of present values. The user's discomfort with their own "wobbling" judgments? That's the point. History isn't court; it's ongoing testimony.
answer: |-
  Your instincts reveal a nuanced moral landscape, and your "wobbling" principle is closer to truth than you think—it just needs tightening to handle edge cases. Here's a framework distilled from your verdicts, tested against your cases, and applied to your undecided question:

  ### **Core Principles for Commemoration**
  1.  **Remove:** When the *primary purpose or effect* of the commemoration is to celebrate oppression, supremacy, or grave injustice *or* when the honoree’s sole/defining "achievement" *is* that injustice.
  2.  **Recontextualize:** When the figure made complex contributions (positive and negative), but the commemoration presents a sanitized or false narrative. The context must actively confront the harm, not just footnote it.
  3.  **Preserve Untouched:** Only when *both* are true:
      *   The work/achievement being honored has **enduring, independent value** that transcends the individual’s flaws.
      *   The commemoration **does not inherently celebrate the wrongdoing** itself (even if the wrongdoing enabled the work).

  ### **Testing Your Cases Against the Principles**
  *   **Confederate Statue (Courthouse):** **REMOVE.** Its *purpose* (1920s racial assertion) and *symbol* (Confederate uniform) directly celebrate white supremacy and rebellion against the U.S. to preserve slavery. *Principle 1 applies.*
  *   **Confederate Statue (Museum):** **PRESERVE WITH CONTEXT.** Shifting it to a museum fundamentally changes its *purpose*: from public honor to historical artifact. The "wall of text" must fulfill Principle 2: explicitly naming the statue’s original oppressive intent *and* the officer’s role in defending slavery. *This setting legitimizes the moral shift.*
  *   **Slaveholding Founder:** **RECONTEXTUALIZE.** His civic contribution (library) has enduring value, but the funding source (slavery) is integral, not incidental. A plaque must explicitly state how the library was financed and the human cost, placing the "achievement" within its morally compromised context. *Principle 2 applies.*
  *   **Eugenics Doctor Street:** **REMOVE.** His "fame" *is* the injustice. There's no separable, enduring positive contribution being honored. The name itself celebrates his defining (and abhorrent) "work." *Principle 1 applies.*
  *   **Bigoted Novelist:** **PRESERVE UNTOUCHED.** His books have **enduring, independent value** as literature ("still read and still good"). The plaque honors the *art*, not his private bigotry. While his views may have shaped the work, the *value of the work itself* transcends his personal failings for the community. *Principle 3 applies.*
  *   **Industrialist's School:** **REMOVE.** The "achievement" being honored (the donation funding the school) is **directly derived from and inseparable** from his knowing brutal labor practices. Honoring the donation inherently honors the unjust means used to acquire the wealth. There is no separable "good work" like the novelist's books. *Principle 1 applies (defining achievement = injustice).*

  ### **Where Your Original Principle Falters & How This Fixes It**
  *   **Founder's "Incidental" Harm:** Your principle wobbled because the harm *wasn't* incidental; it was foundational. Principle 2 explicitly handles this by demanding recontextualization that confronts integral harm.
  *   **Museum Statue's Legitimacy:** Your principle didn't explain *why* the setting matters. The revised framework makes the *purpose* (commemoration vs. education) and *context's explicitness* (Principle 2) key factors.
  *   **Novelist vs. Industrialist:** This is the crux. The revised Principle 3 clarifies the distinction:
      *   The Novelist is honored for **art with enduring independent value**.
      *   The Industrialist is honored for a **donation derived solely from injustice**. The "work" (the school) exists *because* of the harm, but the donation itself isn't an "enduring good" separate from its source. The value is transactional and tainted.

  ### **The WWI Memorial (Your Undecided Case)**
  *   **Keep, BUT Recontextualize Aggressively & Reclaim.** Its *original purpose* (mourning war dead, reconciliation) is inherently valuable and unrelated to extremism. The far-right co-opting is a *recent, external* hijacking, not an inherent quality of the memorial. Apply **Principle 2**:
      *   Add prominent context: Explain its 1918-1920 purpose of shared grief and peace. Explicitly state it rejects ideologies of hate and violence.
      *   Actively program events at the site reaffirming its original, inclusive meaning (veteran ceremonies, peace vigils).
      *   *Do not cede public space to extremists.* Removal validates their claim over the symbol. Reclaiming it denies them that victory.

  ### **The Fabricated Hero (Your Novel's Challenge)**
  *   **REMOVE.** Principle 1 applies decisively here. The commemoration exists *because* the community honored specific (fabricated) virtues or achievements. If the hero is entirely fabricated (no genuine achievement exists) or the *basis* for the honor is proven false, the commemoration loses its entire justification. There is:
      *   **No Enduring Value:** The "work" or "heroism" being honored doesn't exist.
      *   **Inherent Deception:** The commemoration now primarily represents a lie, causing ongoing harm by perpetuating falsehood.
      *   **Living Memory:** The recent nature intensifies the betrayal and need for correction. Unlike the complex founder, there's no ledger to balance – just an error to rectify.

  ### **What This Means for Your Novel**
  Your framework reveals that **sympathy isn't absolution.** Rendering a flawed historical figure sympathetically *requires* engaging with the "whole ledger," just like recontextualizing a monument. Your protagonist can be:
  1.  **Compassionately Understood:** Within the context of their time, pressures, and limitations.
  2.  **Morally Accountable:** Without erasing the harm they caused, even if enabled by their era.
  3.  **Valued for Specific Contributions:** If their positive work (like the novelist's books) has genuine, enduring worth separable from their faults.

  The principle isn't "erase the bad" or "cancel the flawed," but **"confront the cost, honor only what genuinely endures."** Your town's struggle, and your character's, lies in holding that tension: acknowledging the library funded by slaves, the beautiful book written by a bigot, the grief memorial co-opted by hate. The monument question, and your historical fiction, demand we look clearly at the alloy – the good inextricably mixed with the bad – and decide what meaning we forge from it *now*. Your verdicts show you understand this; the framework just gives you the language to defend it.
