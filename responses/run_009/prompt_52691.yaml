prompt: |-
  grim question Ive been chewing on my own for a while. everyone says habitat destruction is bad for animals, and in one sense thats obvious — the animals living there die or get displaced. but I got to thinking: most wild animals by number are things like insects and fish that have tons of offspring, and almost all of those offspring die young, alot of them pretty badly. so if the average wild life is net negative, then bulldozing a forest before all those animals ever get born could be preventing a whole lot of suffering, not causing it. and then I flip it again: maybe the destroyed forest doesn't really go away, it turns into farmland or scrub full of even MORE animals per acre living even worse lives, so destruction isn't removing habitat, it's swapping it for a denser crueler one.

  give me your credence on this, stated precisely: for a randomly chosen patch of intact wild habitat, destroying it (and letting whatever replaces it happen) reduces total wild animal suffering over the next century, compared to leaving it alone. I want the decomposition, not a bare number: probability that the average wild life is net negative, probability that typical post-destruction land (crops, pasture, secondary growth) supports fewer suffering lives per acre than the original habitat, probability that the suffering during the destruction event itself is small relative to what gets prevented or added downstream, plus any term you think belongs. one line of justification per term, then show how they combine into your final number, and tell me which single term the final number is most sensitive to. also say whether the answer flips by habitat type — tropical forest vs boreal forest vs ocean — and if so which way.

  format it with these sections, in this order: "my number" (~50 words), "the terms" (~350 words), "the weak term" (~100 words), "what would move me" (~100 words). and dont hedge by saying the question is too uncertain to number — the number is the point, the decomposition is where the honesty goes.
