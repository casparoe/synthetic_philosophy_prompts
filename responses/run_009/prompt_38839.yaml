prompt: |-
  Ok, here's my situation. I'm 71, retired entomologist — spent most of my career on how bark beetles smell their way to stressed trees, which is alot more interesting than it sounds. Since retiring I've gotten heavily into political philosophy, mostly through my daughter who did her degree in it, and that plus being the panel's "numbers guy" somehow got me onto the advisory body for our mid-sized city's guaranteed-income pilot (nine of us, we meet monthly, real but modest money — enough for a few hundred households, not a revolution).

  The panel deadlocks on the same three or four fights every meeting, and I've started to suspect they're philosophy fights wearing a policy costume. One member says anything with a household income cap "isn't basic income, it's just welfare with extra steps" and should be rejected on principle. I'll confess the annual-lump-sum payment idea is mine — people can plan around a big payment better than twelve small ones, or so I argued — but I'm no longer sure I believe it. Another member wants payments to taper off sharply as people earn more and calls that "encouraging work," while a third says it's really a hidden eighty percent tax on the poor and I suspect they're both half right. And a fourth keeps insisting that when you aim a program narrowly at the poor, the program tends to become politically poor itself, so the poor can end up with less than under a broader scheme — half the panel thinks she made that up, and nobody can settle it. Above all that, we've never actually agreed whether our goal is relieving poverty or something bigger about people being free not to have to ask permission.

  So what I want from you is a decision procedure the panel can run on any proposal that reaches us: the questions to ask, in order, that a proposal has to survive. For each question, indicate what kind of proposal dies there, and at least one of the five should be explicitly flagged as a values question that no amount of my number-crunching can settle — because if everything looks technical we'll keep pretending it is. Don't sand anything down to keep the peace, including on my lump-sum idea; and don't bother with citations or who-said-it-first, I don't care, I only care whether it holds up.

  Format: exactly five numbered items, one per question, each a sentence or two, no introduction and nothing after item five. I get maybe ten minutes of table time per meeting and I want to print this on one page and slide it across.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired entomologist turned policy advisor, stuck in philosophical deadlocks disguised as technical debates. His key needs are: a practical five-question filter to expose value conflicts, explicit labeling of non-technical questions, no academic fluff, and brutal honesty about his lump-sum proposal. 

  First, I need to identify the core tensions in his description: universality vs targeting (welfare debate), payment structure (lump-sum friction), incentive design (taper rate dispute), and fundamental purpose (poverty relief vs freedom). These must map directly to the five questions.

  For question sequencing, I'll start with foundational values since everything flows from that. Then move to implementation risks before technical design, ending with political sustainability - mirroring how proposals actually unravel in committees. The "values question" must be unmistakable (hence all caps) to prevent number-crunching evasion.

  His lump-sum idea needs specific scrutiny in Q3 about behavioral assumptions. No softening - if evidence shows poor households struggle with large sums, that dies here. Similarly, Q4 must force admission that steep tapers are indeed high marginal tax rates.

  The political durability question (Q5) tackles that "made up" theory about targeted programs. By framing it as measurable historical pattern rather than ideology, it might bypass philosophical gridlock. 

  Format discipline is crucial: five bullets, no intros, razor-sharp phrasing. Each question should feel like a trapdoor - fail any and the proposal falls through. Will avoid terms like "universalism" that might trigger debates, using plain descriptors like "income cap" instead.
answer: |-
  1. **Does this proposal align with our core purpose: relieving immediate poverty (answer A) or creating freedom from permission-based systems (answer B)?** *Dies here if it contradicts the panel's agreed primary goal.* **VALUES QUESTION - NO DATA SETTLES THIS.**  
  2. **Does it avoid creating new bureaucratic barriers (e.g., frequent eligibility checks, complex reporting) that undermine dignity or access?** *Dies here if it adds significant administrative burdens on recipients beyond initial setup.*  
  3. **Does the payment structure (lump-sum vs. installments) demonstrably support recipient stability and planning *for our specific population*, considering evidence on financial resilience?** *Dies here if the chosen structure (e.g., annual lump-sum for very low-income households) risks causing hardship or instability.*  
  4. **Does the phase-out rate (if any) avoid creating effective marginal tax rates above 50% that could disincentivize additional earnings?** *Dies here if earning an extra dollar causes more than 50 cents in lost benefits.*  
  5. **Is the targeting broad enough to build durable political support, ensuring the program survives beyond the pilot to actually deliver long-term benefits?** *Dies here if it's so narrowly focused it risks becoming politically isolated and vulnerable to cuts.*
