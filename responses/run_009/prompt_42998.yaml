  My roommate and I just burned an entire evening arguing about takeoff speeds and I want to salvage something from it. He thinks an intelligence explosion is basically overdetermined: once AI systems meaningfully contribute to AI research, progress compounds on itself, doubling times shrink, and you get a fast transition where the world is transformed before anyone can react. I keep pushing back that this ignores where the actual bottlenecks are — compute, fabs, energy, data, and all the slow physical-world stuff you can't just think your way past — so even a superhuman software engineer just spins its wheels and we get something much more continuous, more like an unusually steep economy-wide productivity boom. We ended up admitting we'd been talking past each other for hours and half-drunkely agreed the only fix is to write down an adversarial collaboration document like the ones they do in other fields. Draft it for us. I want the claims we could both actually put our names to (including boring stuff like: algorithmic progress exists and is real; scaling isn't the whole story; "takeoff speed" needs defining before arguing about it). Then the precise disagreements, worded so each of us would accept how our own view is stated — no strawmen. Then the cruxes: I suspect one is what fraction of AI progress is algorithmic vs compute-driven, another is whether the non-cognitive bottlenecks bind hard enough to stop recursive self-improvement, and maybe one about whether a lead can be translated into further leads. For each crux, give an argument, historical case, or measurable thing we'd both agree bears on it, with both of our predictions written down in advance so we can actually be wrong. Numbered list of agreed claims first, then a disagreements section. Also flag anywhere you think our fight was actually just verbal, e.g. about what counts as "fast."
