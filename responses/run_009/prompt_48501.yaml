answer: |-
  Below is a **Special Composition Quiz** designed to sort readers by their intuitive views on when things compose a further object, without relying on philosophical jargon. The quiz presents concrete cases with 2-3 options per question. Afterward, a scoring key maps answer patterns to named philosophical positions (and flags unnamed or incoherent combos). 

  **Instructions:** For each scenario, pick the option that feels most correct to you. Be honest—don't overthink it!

  ---

  ### Quiz Questions  
  1. **Trout and Turkey**  
     A trout is swimming in a river near a turkey on the bank. Is there an object that is just the trout and the turkey together?  
     (A) Yes, that’s a real thing.  
     (B) No, there’s only the trout and the turkey separately.  

  2. **Everything on Your Desk**  
     Think of all the items on your desk right now (e.g., laptop, mug, papers). Does "everything on my desk" refer to one single object?  
     (A) Yes, it’s a single object (the whole collection).  
     (B) No, it’s just a way of talking about multiple separate things.  

  3. **You and Your Cells**  
     Are you a single, unified being, or are you just a collection of cells?  
     (A) I am a single being (more than just my cells).  
     (B) I am just a collection of cells; there’s no "me" over and above them.  

  4. **Shoe and Half-Moon**  
     Is there an object made of your left shoe and the northern half of the Moon?  
     (A) Yes, that’s a real thing (the shoe and half-Moon together).  
     (B) No, there’s no such thing.  

  5. **The Chair**  
     Is a wooden chair one single object, or just pieces of wood arranged in a chair shape?  
     (A) It’s one object (the chair itself).  
     (B) It’s just pieces of wood arranged chairwise.  

  6. **Top Half of a Coffee Mug**  
     Is the top half of your coffee mug (e.g., everything above the handle) a real object?  
     (A) Yes, it’s a real object.  
     (B) No, it’s just a way of talking about part of the mug.  

  7. **Bike Wheel Removal**  
     You remove the front wheel from your bike. Afterward, is the bike still the same bike?  
     (A) Yes, it’s the same bike, just missing a wheel.  
     (B) No, the original bike is gone; it’s now a different thing.  

  8. **Pile of Sand**  
     Is a sand pile one object, or just many grains of sand?  
     (A) One object (the pile itself).  
     (B) Just many grains of sand.  

  9. **Cloud**  
     Is a cloud one object, or just many water droplets in the air?  
     (A) One object (the cloud itself).  
     (B) Just many water droplets.  

  10. **Human Corpse**  
      When a person dies, their body becomes a corpse. Is the corpse one object?  
      (A) Yes, it’s one object.  
      (B) No, it’s just a collection of tissues/cells.  

  ---

  ### Scoring Key  
  Tally your answers (A/B for each question). Match your pattern to the views below. **Q7 (bike wheel) does not sort for composition views**—it catches if you’re conflating composition (when parts form a whole) with persistence (whether an object survives change). If you chose B for Q7, you might be thinking about persistence, not composition!  

  #### Mapping Answer Patterns to Views  
  - **Nihilism** (Composition never happens):  
    All B for Q1–6, Q8–10. *Why?* Only simples (like cells or grains) exist; no composites like chairs or "you" are real.  
    - Key pattern: Q1:B, Q2:B, Q3:B, Q4:B, Q5:B, Q6:B, Q8:B, Q9:B, Q10:B  

  - **Universalism** (Composition always happens; "trout-turkey" objects exist):  
    All A for Q1–6, Q8–10. *Why?* Any collection of things composes a further object.  
    - Key pattern: Q1:A, Q2:A, Q3:A, Q4:A, Q5:A, Q6:A, Q8:A, Q9:A, Q10:A  

  - **Contact Restrictivism** (Composition only when parts touch):  
    Q1:B (trout/turkey apart), Q2:B (desk items may not all touch), Q3:A (cells touch), Q4:B (shoe/Moon apart), Q5:A (chair parts touch), Q6:A (mug parts touch), Q8:A (sand grains touch), Q9:B (cloud droplets don’t touch), Q10:A (corpse parts touch).  
    - *Named position?* Yes, "Contact."  

  - **Life/Organicism** (Composition only for living things):  
    Q1:B (not alive), Q2:B (not alive), Q3:A (you’re alive), Q4:B (not alive), Q5:B (chair not alive), Q6:B (mug not alive), Q8:B (pile not alive), Q9:B (cloud not alive), Q10:B (corpse not alive).  
    - *Named position?* Yes, "Organicism."  

  - **Activity/Functional Restrictivism** (Composition when parts work together):  
    Q1:B (not cooperating), Q2:B (desk items not functional), Q3:A (cells work together), Q4:B (not cooperating), Q5:A (chair has a function), Q6:B (top half doesn’t work alone), Q8:B (pile has no function), Q9:B (cloud has no function), Q10:B (corpse has no function).  
    - *Named position?* Yes, "Functionalism."  

  - **Familiar Shape/Common-Sense Restrictivism** (Composition for familiar human-scale objects):  
    Q1:B (not familiar), Q2:B (not a familiar object), Q3:A (human is familiar), Q4:B (not familiar), Q5:A (chair is familiar), Q6:B (top half not familiar), Q8:A (pile is familiar), Q9:A (cloud is familiar), Q10:A (corpse is familiar).  
    - *Named position?* Unnamed (a form of "Common-Sense Restrictivism").  

  - **Brutalism** (Composition happens, but it’s brute—no rule):  
    Any pattern not covered above. *Why?* Brutalism has no consistent principle, so answers may vary arbitrarily.  
    - *Example incoherent pattern?* Q1:A (trout-turkey exists) + Q4:B (shoe-half-Moon doesn’t) is incoherent for universalism/nihilism but possible for Brutalism.  

  #### Notes on Answer Combos  
  - **Incoherent combos**: None logically impossible (any combo is coherent under Brutalism).  
  - **Unnamed positions**: If your pattern fits no named view, you may hold an unnamed restrictivism (e.g., if you require "human intention" for composition).  
  - **Q7 (Bike Wheel)**: Scores as "N/A" for composition—it flags conflation with persistence. Choosing B suggests you may confuse composition (when parts form a whole) with persistence (whether a whole survives part changes).  

  #### Weakness in the Quiz  
  The quiz does the worst job of separating **Brutalism** from **unnamed restrictivist views** since Brutalism can mimic any restrictivist pattern arbitrarily.  

