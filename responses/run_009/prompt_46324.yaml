  someone in my vagueness reading group keeps saying 'there's no fact of the matter' whether the guy with 57 hairs counts as bald, and he used it most recently to wave off the one epistemicist among us, who thinks there IS a sharp cutoff somewhere between 0 and 100,000 hairs, we just can never know where. i get that 'no fact of the matter' sounds deep but i honestly couldnt tell you what its claiming. can you break that one-liner into the different precise theses it could be expressing? like -- that the sentence is neither true nor false, that it's true on some precisifications and false on others, that there's a fact but it's unknowable, that the world itself is indeterminate about it -- and for each reading say whether its plausible, and whether it actually supports treating the epistemicist as obviously wrong. my friend thinks there's literally a last hair that makes you bald; the other guy acted like that was insane. lay the readings out as a list i can bring to the next meeting
