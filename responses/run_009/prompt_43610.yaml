prompt: |-
  A friend of mine who works on decision theory swears up and down that the Dutch book argument for probabilism either proves way to much or refutes itself, and I can't find where it slips. He lays it out like this:

  1. Your degrees of belief are rational only if you're not exploitable — there's no set of bets, each of which you'd accept, that together guarantee you a loss.
  2. You accept a bet iff its expected value, computed using your own degrees of belief, is positive.
  3. So a rational agent accepts every bet that has positive expected value by its own lights.
  4. Now take an agent whose credences are coherent, so by the standard result no Dutch book is possible, and offer them a single bet on a fair coin: they lose their entire savings of $10,000 on tails and win $10,200 on heads. Expected value is +$100, so by 3 they must take it.
  5. But refusing to risk everything you have for a 1% edge is obviously rational — he'd refuse it himself — so by 2 he's irrational, and so is basically everyone.
  6. Therefore either 2 is false, in which case the Dutch book argument for probabilism collapses (it needs 2 to get from "your credences are incoherent" to "you'll accept a package guaranteeing a loss"), or 2 is true and rationality demands taking ruinous bets.

  My hunch is that something equivocates in step 2 between what the original argument actually needs and what "positive expected value" means when the stakes are your whole bankroll, but I can't put my finger on it cleanly. Which premise should he give up, and what does giving it up cost the probabilist? Also want to hear whether the standard argument survives in some weakened form, and exactly what it's weakened to — alot of people wave at "small stakes" here without saying what work that assumption is doing.
reasoning: |-
  Okay, let me try to unpack this friend's argument about the Dutch book. He's saying that the standard argument for probabilism either proves too much or refutes itself. Probabilism is the idea that rational beliefs should follow probability rules. The Dutch book argument is supposed to show that if your beliefs don't follow probability rules, someone can make a series of bets against you that you'll accept but which guarantee you lose money.

  The friend's argument goes through several steps. First, he says that your degrees of belief are rational only if you can't be exploited by such bets. Second, you'll accept a bet only if its expected value, based on your beliefs, is positive. Third, this means a rational agent must accept every bet with positive expected value. 

  Then he gives a specific example: a bet on a fair coin where you risk your entire $10,000 savings to win $10,200. The expected value is +$100, so the agent should take it. But refusing to risk everything for a small edge seems rational. If the agent refuses, by the second premise, they're irrational. So either the second premise is false (which undermines the Dutch book argument), or rationality requires taking ruinous bets.

  Hmm, I need to figure out where this goes wrong. The key seems to be in step 2 and how expected value is defined. The friend assumes that expected value is calculated the same way regardless of the stakes. But in utility theory, especially when dealing with significant sums, we don't use linear utility. That is, gaining $10,200 isn't just twice as good as losing $10,000 when that loss means bankruptcy or ruin.

  So the problem might be that step 2 should be about expected utility, not expected monetary value. The Dutch book argument assumes that utility is linear with money, but that's only true for small stakes. When the stakes are high, utility functions are usually concave. Losing $10,000 could mean total ruin, which has a much higher disutility than the utility gain from an extra $200. 

  Therefore, the agent isn't irrational for rejecting the bet because the expected utility, considering the diminishing marginal utility of money, might actually be negative. So premise 2 needs to be amended to say that you accept a bet iff its expected utility is positive. This resolves the paradox because the Dutch book argument relies on coherence in probabilities, not linear utility. 

  The standard Dutch book argument survives by assuming small stakes where utility is approximately linear. For larger stakes, we need to incorporate the agent's risk aversion via their utility function. So the friend's mistake is conflating expected monetary value with expected utility in high-stakes scenarios.
answer: |-
  Your friend's argument is clever but contains a critical flaw in **premise 2**, which conflates **monetary value** with **utility**. The Dutch book argument for probabilism (coherent credences) survives, but it requires a more nuanced understanding of rationality and betting preferences. Here's a step-by-step breakdown:

  ### Where the Argument Fails: Premise 2
  - **Premise 2 states**: "You accept a bet iff its expected **monetary value**, computed using your degrees of belief, is positive."  
  - **The flaw**: Rational agents care about *utility* (or welfare), not raw money. Money has diminishing marginal utility: losing your life savings is catastrophic, while winning a little extra provides modest benefit. Expected **monetary** value ≠ expected **utility**.

  ### The Resolution: Expected Utility, Not Expected Money
  1. **Revise Premise 2**:  
     A rational agent accepts a bet iff its **expected utility** (EU), computed using their credences *and utility function*, is positive.  
     - Utility functions account for risk aversion. Losing $10,000 might cause bankruptcy, homelessness, or existential ruin (disutility far exceeding the nominal value). Winning $10,200 might only marginally improve a wealthy person's life.  
     - In the coin bet:  
       - EU = (0.5 × U(\+$10,200)) + (0.5 × U(−$10,000)).  
       - If U(−$10,000) ≈ −∞ (e.g., ruin), EU is *negative* even with +$100 expected monetary value. Refusing the bet is rational.

  2. **The Dutch Book Argument's Actual Premise**:  
     The core argument assumes **linear utility** (utility proportional to money). This is only reasonable for *small stakes* where marginal utility is constant.  
     - **Standard Dutch Book Theorem**: If your credences are incoherent, there exists a set of *small-stakes bets* (where utility ≈ money) that jointly guarantee a loss.  
     - **Converse**: If your credences are coherent, no *small-stakes* Dutch book exists.  
     - **What "small stakes" does**: It ensures utility is linear (or approximately linear), so EU ≈ expected money. This justifies premise 2 *only in that context*.

  ### Addressing Your Friend's Steps
  - **Step 4**: The agent with coherent credences *should* accept the bet **only if utility is linear**. For high stakes, declining doesn't violate coherence—it reflects a rational utility function.  
  - **Step 5**: Refusing a ruinous bet is rational because:  
    - (a) Expected utility is negative (not expected money!),  
    - (b) The Dutch book argument never demanded accepting *arbitrarily large* bets.  
  - **Step 6**: Premise 2 is false *as stated* (it ignores utility), but the Dutch book argument uses a weaker version restricted to small stakes. It doesn't collapse.

  ### What the Dutch Book Argument *Actually* Proves (and Its Limits)
  - **What it proves**:  
    If an agent has *any* utility function (monotonic in money), and their credences are **incoherent** (not probabilistic), then for **any** stake size, there exists a set of bets they'll accept that guarantees a loss.  
  - **What it doesn't prove**:  
    - That rational agents must accept *every* positive-EV monetary bet (utility matters).  
    - That probabilistic credences prevent *all* losses (they only prevent sure losses under small stakes *or* with linear utility).  
  - **Surviving in a "Weakened" Form**:  
    The argument holds for:  
    - Small-stakes bets (utility ≈ linear), or  
    - Agents with linear utility functions (risk-neutral bettors).  
    In both cases, premise 2 holds *as long as "value" means utility*.

  ### Cost to the Probabilist? Minimal.
  - **Probabilism** (credences must be probabilities) still stands:  
    - Incoherent credences + *any* utility function → vulnerability to Dutch books.  
    - Coherent credences + *any* utility function → no small-stakes Dutch book.  
  - **Added insight**: Rationality requires *both* probabilistic beliefs *and* sensible utility functions. The Dutch book argument targets the former; expected utility theory handles the latter.

  ### Why "Small Stakes" Isn't Vague Handwaving
  - **Work it does**: It ensures that the **marginal utility of money is constant** within the bet's range. If the most you can win/lose in a Dutch book is ε (small), then:  
    - U(\+ε) − U(0) ≈ U(0) − U(−ε) ≈ kε (linear approximation).  
    - Thus, EU ≈ k × (expected money), so sign(Expected Money) = sign(EU).  
  - This justifies the link between incoherence and accepting guaranteed losses. Without it, utility curvature could "rescue" incoherent agents—but it doesn't (see below).

  ### Key Takeaway
  Your friend's argument exploits an **illegitimate generalization**: the Dutch book argument uses "expected value" to mean *expected utility under linearity*, but he applies it to *expected money in nonlinear contexts*. Revising premise 2 to **expected utility** resolves the paradox. Rational agents:  
  1. Have probabilistic beliefs (to avoid Dutch books under small stakes),  
  2. Have concave utility functions (to avoid ruinous bets),  
  and these are consistent. The Dutch book argument for probabilism remains intact but must be understood within its domain of applicability.
