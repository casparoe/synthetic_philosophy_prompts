prompt: |-
  In my ethics seminar we just wrapped up the separateness of persons objection to utilitarianism, and my tutor kept gesturing at Sidgwick's old line that ethics requires taking up the point of view of the universe — the phrase everyone traces to him, anyway. She used it twice in one supervision for what seemed like different jobs: once to justify summing happiness across persons as if they were one big bucket, and once to say that my complaint about sacrificing the one for the many was somehow a failure to widen my perspective, a kind of moral parochialism. Those can't both be the same claim, can they?

  Can you lay out the distinct precise theses that line could be expressing — from innocuous ones a Rawlsian would happily accept (something like "impartiality between persons matters") to the strong metaphysical one that seems to do real work for the utilitarian (that at the fundamental level there's just one rational agent, or one good, and individual lives are mere windows onto it)? For each reading, say whether it's plausible, whether it actually gets you aggregative utilitarianism, and whether it can answer the objection that it deletes the very separateness of persons the objection is about — i.e. whether "you must see yourself as part of a larger whole" is a moral insight or just a refusal to answer the question. Also flag which reading my tutor probably needed for each of her two uses, since I suspect only one of them survives. Finish with a last line beginning "Verdict:" naming the strongest defensible reading of the slogan and whether it's enough to save the aggregation.
