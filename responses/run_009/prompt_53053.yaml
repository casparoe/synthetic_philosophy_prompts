prompt: |-
  I've become fairly convinced of the functional-decision-theoretic picture: the rational agent treats her decision as the output of a fixed decision procedure and asks which output of that very procedure yields the best results, which means paying the $100 in the counterfactual mugging (the coin was fair, you know Omega already predicted your response before flipping, and the $1,000,000 is there iff the procedure outputs pay in the tails world), while refusing to pay in XOR blackmail (the blackmailer's letter is sent iff she predicted you will not pay, so paying is bad news about your own decision function and buying silence only rewards a policy of exploitable predictability). I find the package attractive precisely because it gets both cases right without ad hoc machinery, where causal decision theory pays the blackmailer and evidential decision theory balks at one-boxing's cousins. What would actually count against this view? I want exactly five candidate defeaters, presented as a numbered list with no introduction or conclusion, each item a sentence or two: these might be a decision problem where the functional prescription seems clearly wrong, a way the notion of "the same decision function" fails to be well-defined across agents and predictors of differing accuracy, a result about the view collapsing into or being extensionally equivalent to a rival, or a general worry about whether the theory is tested against intuitions it has already been tuned to fit and so risks nothing. For each defeater, say whether a committed functional decision theorist should concede it as counting against the view, and rank the five from most to least threatening.
reasoning: |-
  Okay, the user is deeply immersed in decision theory, specifically advocating for Functional Decision Theory (FDT). They appreciate its handling of Counterfactual Mugging and XOR Blackmail without ad hoc fixes, contrasting it favorably with CDT and EDT. Now they want five potential defeaters against FDT, ranked by threat level. 

  Hmm, the challenge is identifying weaknesses that aren't just rehashes of existing debates. The user clearly understands FDT's core mechanics, so surface-level objections won't suffice. I need to dig into foundational tensions: where does the "fixed procedure" abstraction crack under pressure? 

  First, the Achilles' heel seems to be predictor interactions in asymmetric information games. Newcomb's Paradox is clean because Omega is infallible, but real-world cases involve probabilistic predictors. If FDT's prescription flips based on prediction accuracy—like sometimes paying blackmailers when predictors are noisy—that feels unprincipled. That's probably the top defeater because it attacks FDT's coherence in its own domain. 

  Next, the indexical dependence problem. If two agents share identical decision functions but different histories (e.g., one previously paid muggers, one didn't), FDT might demand different acts for the same procedure. That undermines the "fixed function" premise. User would likely concede this as serious—it's not fixable by tweaking. 

  Third, the EDT collapse under uncertainty. When predictors are fallible, FDT sometimes mimics EDT's "act=evidence" reasoning, like refusing beneficial trades due to correlated errors. But EDT is what FDT tries to surpass! If they converge in key cases, FDT loses explanatory edge. 

  Fourth, the computational blindness issue. FDT ignores whether the decision function *can* practically compute the counterfactual. Requiring humans to simulate impossible computations seems unreasonable, but building computability into FDT might break its elegance. 

  Last, the self-tuning intuition worry. Since FDT was designed around puzzles like Mugging/Blackmail, its "success" might be circular. The user explicitly flagged this, so it's included—but it's more meta than technical, hence least threatening. 

  Ranking reflects how much each threatens FDT's internal logic. User seems prepared for heavy objections—they even specified "no ad hoc machinery" as a virtue. I'll avoid softballs.
answer: |-
  Here are five candidate defeaters for Functional Decision Theory (FDT), ranked from most to least threatening, with an assessment of whether a committed FDTist should concede it:

  1.  **Predictor Accuracy Dependence in Asymmetric Information Games:** In scenarios where the predictor's accuracy is imperfect and *unknown* to the agent, and where the predictor has access to information the agent lacks (e.g., a probabilistic variant of XOR Blackmail where the blackmailer sends the threat based on a noisy prediction), FDT's prescription can become highly sensitive to the *exact* (but unknown) prediction accuracy and mechanism, leading to prescriptions that seem either arbitrary or clearly dominated by alternatives in expected utility *given the agent's actual knowledge state*. A committed FDTist *should concede* this counts against the view, as it demonstrates a critical vulnerability in real-world applicability where predictor reliability is uncertain.
      *   **Should Concede:** Yes (High threat - undermines robustness in realistic epistemic conditions)

  2.  **Indexical Dependence / History Contingency:** The "same decision function" might prescribe different actions depending on its *indexical context* or *past history* within the same abstract specification. For instance, if an agent previously faced (and paid) a counterfactual mugging, a subsequent identical mugging (with the same function) might be prescribed to refuse, because paying *now* would make the agent "the kind" who paid in the past, altering the predictor's simulation/counterfactual. This makes the "fixed procedure" unstable over time/contexts. A committed FDTist *should concede* this highlights a significant ambiguity in defining the "fixed procedure" across instances.
      *   **Should Concede:** Yes (High threat - challenges core identity of the "fixed function")

  3.  **Collapse into EDT in High-Uncertainty Self-Fulfilling Prophecies:** When predictors are highly fallible and predictions are strongly self-fulfilling or self-defeating *based solely on the correlation they create* (e.g., a medical test predicting a rare disease where taking preventative medication *causes* the disease *only if* the test predicted you would take it), FDT can prescribe acting *against* the causal effect of the action itself (e.g., refusing medication) because taking it is strong evidence the predictor foresaw it, triggering the causal mechanism. This mirrors EDT's focus on correlation-as-causation and ignores the agent's direct causal levers. A committed FDTist *should concede* this shows FDT can inherit EDT's worst pathologies in specific, albeit contrived, scenarios.
      *   **Should Concede:** Yes (Moderate-High threat - replicates a key flaw of the theory it aims to supersede)

  4.  **Computational Irrelevance / Ignoring Feasibility:** FDT requires reasoning about the output of one's abstract decision function in impossible-to-compute counterfactual worlds (e.g., worlds where the predictor simulated you perfectly). It ignores the computational cost, feasibility, or logical possibility of the agent actually *running* their function in those worlds or the predictor simulating it. Prescribing actions based on counterfactuals that are fundamentally uncomputable for the agent seems irrational. A committed FDTist *might resist* conceding, arguing FDT deals with idealized functions, but *should concede* it raises a serious philosophical worry about the theory's foundations in computability and practical rationality.
      *   **Should Concede:** Yes (Moderate threat - questions foundational assumptions about counterfactuals)

  5.  **Tuned Intuitions / Lack of Novel Predictive Power:** FDT's primary support comes from solving pre-existing puzzles (Newcomb, Mugging, Blackmail) that its formalism was explicitly designed to address. It lacks strong, *novel* predictions or successful applications to complex, real-world decision problems distinct from these canonical thought experiments where it demonstrably outperforms CDT/EDT *without* seeming ad hoc. Its appeal might stem from retrofitting explanations to tuned intuitions rather than independent predictive power. A committed FDTist *should concede* this is a legitimate methodological concern (theory risks being "just so"), but can argue its coherence and unification *are* novel strengths.
      *   **Should Concede:** Yes (Low-Moderate threat - methodological weakness, but not a direct logical flaw)
