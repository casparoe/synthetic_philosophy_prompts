prompt: |-
  been reading OB/LW since about 2011 and after all these years of decision theory arguments here's roughly where I've landed -- I want to know if it actually hangs together or whether I'm just collecting verdicts I like the feel of and ignoring the ones that clash. My set:

  1. One-box in Newcomb, obviously.
  2. Pay the driver in Parfit's hitchhiker, once you're safe in the city.
  3. In XOR blackmail -- the one where the blackmailer sends the letter iff (you have the disease XOR he predicted you'd pay) -- I refuse to pay. Pay $1000 doesn't do anything about whether I have the disease, and I'm not paying just to buy better news about my own health.
  4. Counterfactual mugging: I refuse. The coin already came up tails, full stop, and the version of me in heads branch doesn't exist and can't be helped by my $100.
  5. But if Omega had offered me the whole deal *before* flipping -- 50% I get $1000, 50% I pay $100 -- I'd of taken it in a heartbeat, and I think agents should follow through on precommitments they would have made.
  6. And I hold pretty strongly that the right decision shouldn't depend on when you happen to first reason about the problem -- "the boxes were already filled" and "the coin already landed" are the same move, and I reject it in both places.

  Is this a coherent package or am I helping myself to something in one item that others rule out? Two things I keep going back and forth on: whether refusing in XOR blackmail and refusing in counterfactual mugging are basically the same refusal, such that paying in one and not the other is me dodging rather than taking a position; and whether my stated reason in (3) is the sort of reason that would get me two-boxing somewhere I don't want to go. Go through the pairs that are actually in tension vs the ones that only look that way, rank the tensions by how bad they are, and tell me which single change would clean up the most -- I genuinely don't know which one I'd give up.
reasoning: |-
  Okay, let me start by unpacking this user's query. They've been into decision theory since 2011, mostly through OB/LW, and have arrived at a set of positions on classic thought experiments. They want to know if their stance is coherent or if they're just picking what feels right. Let me go through each point one by one.

  First, they one-box in Newcomb. That's standard for causal decision theorists who accept that Omega's prediction is reliable. Then they pay the driver in Parfit's Hitchhiker once safe. That makes sense because paying ensures future cooperation, aligning with self-interest and cooperative norms. 

  Next, XOR blackmail: refusing to pay because it doesn't affect the disease and avoids paying for information. But here's a potential issue. If the blackmailer predicts based on your decision, refusing might correlate with having the disease. The user's refusal could be seen as ignoring the correlation, which might conflict with their Newcomb stance where they consider the correlation with Omega's prediction.

  Counterfactual mugging: they refuse since the coin landed tails, and the heads version doesn't exist. But they'd take the deal pre-flip. This highlights a tension between precommitment and actual action. CDT usually refuses post-flip, while FDT would pay. The user's precommitment stance suggests they value time consistency but don't follow through post-flip, which might be inconsistent.

  Their sixth point emphasizes that timing shouldn't affect decisions. But in counterfactual mugging, refusing post-flip while accepting pre-flip seems contradictory. The user argues that "boxes already filled" and "coin already landed" are the same move, but they reject it in Newcomb (one-boxing despite boxes filled) but accept it in mugging (refusing because coin landed). That's a key tension.

  Now, the user's concerns about XOR blackmail and counterfactual mugging being similar refusals. Both involve refusing to pay based on current state (disease status, coin result). But in Newcomb, they one-box, acknowledging the predictor's correlation. So refusing in XOR might ignore the predictor's role, which is inconsistent with Newcomb. 

  The deeper issue might be between CDT and FDT. The user leans towards FDT in Newcomb and Parfit but CDT in mugging and XOR blackmail. XOR blackmail's refusal is like two-boxing if the blackmailer's prediction is reliable. The user's reason—not paying for better news—might be valid, but if the prediction correlates with disease, it's similar to Newcomb's dependency.

  The biggest tension is between counterfactual mugging and their precommitment view. Refusing post-flip contradicts their willingness to precommit. If they value precommitments, they should pay in mugging, but they don't. That inconsistency needs addressing. Either they should pay in mugging or abandon precommitment as a principle for such cases.

  To clean up, the user could start paying in counterfactual mugging, aligning with precommitment. Alternatively, accept that decisions depend on timing, but that contradicts their sixth point. Another option is to pay in XOR blackmail to maintain consistency with Newcomb's handling of predictors, but the user might resist that as extortion.

  Overall, the most critical fix is resolving the mugging/precommitment clash. Paying there would align better with their other positions and reduce tension. But they need to decide if their refusal in mugging is worth the inconsistency or if adjusting that stance improves coherence.
answer: |-
  Based on your positions, you've landed in a **coherent but locally inconsistent** package that leans heavily towards **Causal Decision Theory (CDT)** with significant **Functional Decision Theory (FDT)** influences, plus a pragmatic stance on precommitment. The tensions arise where FDT intuitions clash with CDT logic, and where your rejection of "timing dependence" isn't fully upheld. Here's the breakdown:

  ### Core Coherence
  1.  **One-boxing (Newcomb):** Classic FDT move. You care about the *type* of decision-maker you are, as it influences the predictor's action.
  2.  **Paying the Driver (Parfit's):** Coherent with FDT/cooperative principles. Your action *now* signals your type for *future* interactions, impacting long-term outcomes. CDT struggles here.
  3.  **Refusing XOR Blackmail:** Pure CDT. You correctly note paying doesn't *cause* you to lack the disease. It only correlates via the predictor. You refuse to pay for correlation/evidence.
  4.  **Refusing Counterfactual Mugging (Post-Flip):** Pure CDT. The coin landed tails. Paying $100 causes a loss *now* with no causal benefit to anyone who exists.
  5.  **Accepting Counterfactual Mugging (Pre-Flip):** FDT/Precommitment. You commit to being the *type* of agent who upholds fair deals across branches, maximizing expected value.
  6.  **Rejecting Timing Dependence:** A core FDT/foundational principle. The *logical structure* of the decision should determine the action, not when you first encounter it.

  ### Key Tensions Ranked by Severity
  *(From most critical to less critical)*

  1.  **Counterfactual Mugging Refusal (Post-Flip) vs. Precommitment Principle (Pre-Flip) & Rejecting Timing Dependence:**
      *   **Tension:** This is the **most severe inconsistency**.
      *   **Why:** Your stated reason for refusing post-flip ("The coin already came up tails, full stop, and the version of me in heads branch doesn't exist") **is fundamentally the "timing dependence" move you explicitly reject in point 6** and in Newcomb. You wouldn't accept "the boxes were already filled" as a reason to two-box. Yet, "the coin already landed" is the *exact same move* justifying refusal. Your precommitment principle (point 5) demands you pay post-flip to honor the deal you would have made. Refusing violates both rejection of timing dependence *and* your precommitment stance.
      *   **Resolution Needed:** You *must* either:
          *   **Start paying in Counterfactual Mugging (post-flip)** to align with precommitment & rejection of timing dependence (FDT).
          *   **Abandon the precommitment principle for cases involving non-existent branches** (weakening point 5).
          *   **Accept that decisions *can* depend on timing/framing** (contradicting point 6).

  2.  **XOR Blackmail Refusal vs. Newcomb One-Boxing:**
      *   **Tension:** Moderate. Structurally similar (predictor correlates with state), but you treat them differently.
      *   **Why:** The blackmailer is a predictor, just like Omega. Refusing payment in XOR correlates (via prediction) with *having* the disease, just like one-boxing correlates with getting $1M. Your stated reason ("Pay $1000 doesn't do anything about whether I have the disease") is causally correct (CDT), but it **ignores the correlation created by the predictor**, which is the *exact reason* you one-box. If you consistently valued the correlation/evidence aspect (FDT), you might pay the blackmailer to correlate with *not* having the disease.
      *   **Is it Dodging?** Not exactly, but it highlights a **value judgment difference**: In Newcomb, you value the money correlation highly. In XOR, you value avoiding extortion more than the information correlation ("I'm not paying just to buy better news"). This *can* be a coherent position ("Correlation matters only when it directly causes large gains/losses, not for information"), but it feels ad hoc.
      *   **Resolution Needed:** Less critical than Mugging tension. To resolve:
          *   **Accept that predictors create correlations you sometimes pay for (Newcomb) and sometimes don't (XOR) based on context/value.** (Your current position).
          *   **Start paying in XOR** to be fully FDT-consistent on predictors (but this feels like rewarding extortion).
          *   **Two-box in Newcomb** to be fully CDT-consistent (you clearly don't want this!).

  3.  **XOR Blackmail Refusal vs. Counterfactual Mugging Refusal:**
      *   **Tension:** Low. They share surface similarity ("Refuse to pay $") but the *reasons* differ significantly.
      *   **Why:** XOR refusal is based on **causal inefficacy + rejecting payment for information**. Mugging refusal is based on **branch non-existence + timing dependence**. The underlying logic (CDT vs CDT+TimingDependence) isn't inherently contradictory, even if the action is the same.
      *   **Are they the same refusal?** **No.** The motivations are distinct. Refusing both is consistent *if* you hold both CDT (XOR) and accept timing dependence for mugging (contradicting your point 6). Your problem isn't paying in one and not the other; it's the *internal conflict* within your mugging stance and with point 6.

  ### Which Single Change Cleans Up the Most?
  **Start paying in Counterfactual Mugging (post-flip).**

  *   **Why:**
      1.  It directly resolves the **most severe tension** (Mugging vs Precommitment & Timing Dependence).
      2.  It strongly reinforces your rejection of timing dependence (point 6) – paying post-flip is the *only* way to be consistent with the decision you'd make pre-flip *and* the one-boxing logic ("the predictor acted based on your type, act accordingly").
      3.  It makes your stance more FDT-coherent overall without forcing you to change any *other* positions (like paying the blackmailer or two-boxing).
      4.  It feels less like "giving something up" and more like fully committing to the principles you already endorse (precommitment, rejection of timing dependence, FDT-like thinking in Newcomb/Parfit).

  *   **Impact on Other Positions:** Paying in Mugging strengthens your FDT leanings but doesn't *force* you to pay in XOR Blackmail. You can maintain your pragmatic, CDT-based refusal there ("I don't pay extortionists, even if it correlates with bad news"). The tension between XOR and Newcomb remains moderate but manageable.

  ### Conclusion
  Your package **hangs together pragmatically** but has a **significant internal rupture** around Counterfactual Mugging. The refusal post-flip violates your core principles of rejecting timing dependence and honoring precommitments. **Paying in Counterfactual Mugging is the single change that would maximize coherence.** It resolves the worst tension and aligns your actions with the principles you value in Newcomb, Parfit, and precommitment. Refusing in XOR Blackmail, while creating a moderate tension with Newcomb, remains defensible as a value-based choice about extortion vs. direct reward. You're not "just collecting verdicts," but you *are* applying FDT selectively where the gains are large and obvious (Newcomb, Parfit) and falling back on CDT where FDT feels counterintuitive or extortionate (XOR, Mugging post-flip). Committing to paying in Mugging post-flip would make that selectivity much less pronounced.
