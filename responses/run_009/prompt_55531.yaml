prompt: |-
  For the final exam of my upper-level seminar "Historiography: Theory and Method" — a mixed group of final-year history majors, philosophy students, and two MA candidates — I need one essay question on presentism: whether historians can escape the standards of their own time. The exam is a three-hour sit-down with two questions; candidates will have roughly seventy minutes for this one, closed book. The problem with every draft I've written so far is that it can be answered by reciting the seminar's first-week slogans — "avoid anachronism," "understand actors in their own terms," "don't judge the past by the present." My students have memorized that vocabulary; I want to find out whether they can use it under pressure, in a case where the vocabulary doesn't settle anything.

  The question should be built around a concrete scenario, which you should embed verbatim in the exam paper so it's fully self-contained. Here is the case I want: a fictional student, R., has written a thesis chapter on a fictional nineteenth-century municipal reformer, E. M. Corven (1838–1902), who campaigned successfully for clean water and sewers in a fast-growing industrial city — reforms that demonstrably saved thousands of lives — and whose private papers also show her as an early and enthusiastic advocate of segregating and eventually sterilizing people classified as feeble-minded, a cause she shared with several respected medical voices of her own generation. The chapter reports both facts without commentary. Two examiners have now clashed over it: one demands an added paragraph of explicit moral condemnation, arguing that silence in the face of such views is itself a moral stance; the other demands the removal of all evaluative language, calling the proposed paragraph "presentism" and a failure of historical empathy. The exam question should ask the candidate to adjudicate this disagreement and, crucially, to say whether it is really a disagreement about presentism at all.

  Please deliver three things: (1) the exam question itself, written so it cannot be discharged by summarizing the standard presentism-versus-contextualism debate; (2) a model answer of about 600 words; (3) a marking scheme of five must-hit points, 4 marks each for a total of 20, each with a one-line note on how candidates typically get it wrong. I want the marking scheme to build in the following, which my students will not find in their lecture notes: at least one must-hit point should be that the refusal to evaluate is not a neutral, timeless stance but itself a norm with a history — the ideal of value-neutral scholarship is our period's commitment, which cuts against any blanket appeal to "escaping our standards"; at least one should be the applause asymmetry — we happily credit Corven for the sanitation reforms by standards she did not fully share, and call that history rather than presentism, so the objection to condemnation cannot simply be "the standards aren't hers"; at least one should require distinguishing conceptual anachronism from moral evaluation, noting that describing Corven's position as eugenic is not anachronistic in the way calling it by some later label would be. Beyond the five must-hit points, the scheme should say in two or three sentences what separates an A answer from a B answer — I expect the difference to lie in whether the candidate sees that "whose standards?" is the wrong question if asked once, and only a good question if the candidate goes on to ask which standards could be defended to the historical actors themselves, on terms those actors had some access to. The question, model answer, and scheme should assume no specialized knowledge beyond what an attentive reader gets from the embedded scenario, and should not require or reward citations of particular historians or works.
reasoning: |-
  Okay, the user is a professor teaching an advanced historiography seminar. They need an exam question on presentism that pushes students beyond memorized slogans. The key challenge is designing a question that can't be answered by simply regurgitating "avoid anachronism" or "understand actors in their own terms." 

  The professor wants a concrete case study involving a fictional 19th-century reformer who did both praiseworthy (sanitation reforms) and condemnable (eugenics advocacy) things. The core tension is between two examiner positions: one demanding moral condemnation, the other rejecting any evaluation as presentist. 

  I need to craft a question that forces students to grapple with deeper issues: 
  - That refusing to evaluate isn't neutral but reflects our own historical moment's norms
  - The asymmetry in how we apply standards (we credit past figures for good deeds by our standards but resist condemning bad ones)
  - The difference between conceptual anachronism and moral judgment

  For the model answer, I'll demonstrate how to reject both extreme positions. The reformer's eugenics views weren't anachronistic for her time, so describing them isn't presentist. But the historian's choice to include or omit moral framing isn't neutral - it's a methodological stance with its own history. The applause asymmetry shows we constantly apply our standards selectively.

  The marking scheme should reward students who:
  1) Recognize non-evaluation isn't timeless (4 marks)
  2) Spot the applause asymmetry (4 marks)
  3) Distinguish moral judgment from anachronism (4 marks)
  4) Explain why "whose standards?" is too simplistic (4 marks)
  5) Propose context-sensitive evaluation methods (4 marks)

  Top answers (A-grade) will see that the real issue is how to justify evaluations to both our contemporaries and historical actors. Merely choosing between "condemn" or "don't condemn" misses the point - we need to ask what forms of evaluation could be defended to Corven herself using concepts available in her era.
answer: |-
  Here is a complete exam package designed to meet your specifications, pushing students beyond slogans into the methodological tensions surrounding presentism.

  **1. Exam Question**

  > **SECTION B: ANSWER ONE QUESTION (Suggested time: 70 minutes)**
  >
  > **Question 2: Presentism and Historical Judgment**
  >
  > Consider the following scenario concerning a fictional historical thesis:
  >
  > *   **The Historical Subject:** E. M. Corven (1838-1902) was a prominent municipal reformer in the rapidly industrializing city of Millborough. Her successful campaigns for modern sewage systems and clean water supplies are widely credited by historians with drastically reducing disease and saving thousands of lives. Corven’s meticulously kept private papers, however, also reveal her as a vocal early advocate for the compulsory segregation and eventual sterilization of individuals classified as "feeble-minded" or "unfit." She corresponded extensively with leading medical figures of her era, who shared and bolstered these views.
  > *   **The Thesis Chapter:** A student, R., has written a thesis chapter documenting both Corven’s life-saving sanitation reforms and her advocacy for eugenic policies. The chapter presents these facts neutrally, describing the eugenic views as part of her belief system and reform agenda without offering explicit moral commentary or condemnation.
  > *   **The Examiner Dispute:** Two examiners have reviewed the chapter.
  >     *   **Examiner A** argues R. *must* add a paragraph explicitly condemning Corven’s eugenic views. Examiner A contends that remaining silent in the face of such morally repugnant ideas, even historically situated ones, constitutes an unacceptable moral abdication by the historian. Silence, they argue, is itself a stance.
  >     *   **Examiner B** argues R. should *remove* any suggestion of evaluative language and specifically rejects Examiner A’s demand for condemnation. Examiner B calls the proposed paragraph "presentism" – imposing contemporary moral standards on the past – and a fundamental failure of historical empathy. The historian's task, Examiner B insists, is solely to understand and explain Corven’s actions within the context of her own time’s values and knowledge.
  >
  > **Your Task:** Adjudicate this dispute. Should R. add the condemnation paragraph, remove all evaluation, or find a third path? Crucially, **is this disagreement fundamentally *about* presentism?** In formulating your answer, move beyond simply defining presentism and contextualism. Engage specifically with the complexities presented by Corven’s case, considering the nature of historical understanding, the historian's responsibilities, and the possibility (or impossibility) of escaping contemporary frameworks.

  **2. Model Answer (Approx. 600 words)**

  The dispute between Examiners A and B hinges on a genuine methodological tension, but framing it *solely* as a debate about presentism versus contextualism oversimplifies the deeper issues at play in R.'s treatment of Corven. While presentism is a factor, the core disagreement concerns the historian's *mode of engagement* with morally complex historical actors and the inescapable normative commitments involved in historical narration itself.

  Examiner B correctly identifies the danger of crude presentism – judging Corven *only* by 21st-century ethical standards she could not have known. Condemning her eugenics advocacy *as if* it were a shocking aberration in 1880, ignoring its alignment with contemporary medical and social thought (represented by her respected correspondents), would indeed violate historical empathy and understanding. It risks turning history into a simplistic morality tale. However, Examiner B is mistaken in believing that simply removing *all* evaluation achieves neutrality or escapes contemporary frameworks. The very decision to report Corven's eugenic views neutrally, alongside her life-saving work, without framing, prioritization, or implicit cues, is itself a stance – one reflecting a specific, modern historiographical norm valuing dispassionate description and the avoidance of overt moral judgment. This "value-neutral" ideal is not a timeless truth but a historically situated commitment of *our* academic culture. Insisting on it exclusively is not escaping our standards; it's applying one particular standard of ours (methodological objectivity) while suppressing another (moral concern).

  This reveals the "applause asymmetry" inherent in Examiner B's position. We readily *credit* Corven for the sanitation reforms using standards *she did not fully hold*. She likely saw clean water as a matter of civic duty, Christian charity, economic efficiency, or public order – not primarily through the lens of universal human rights or modern public health ethics we use to laud her today. We call this legitimate history, not presentism. Yet Examiner B argues we *cannot* condemn her eugenics advocacy using *our* standards because "they weren't hers." The inconsistency is glaring. If applying our standards to praise her past actions is acceptable, why is applying them to condemn other actions unacceptable? The objection cannot rest solely on the origin of the standards.

  Crucially, describing Corven's advocacy *as* eugenic is not necessarily anachronistic. While the term gained wider currency later, the core ideas – selective breeding, preventing the "unfit" from reproducing – were actively discussed and promoted by figures she engaged with *in her own time*. Labeling it "eugenics" uses a contemporaneous conceptual framework available to historical actors, unlike, say, calling it "proto-Nazism," which would impose a later, alien ideology. This is conceptual accuracy, not anachronistic moral judgment. The moral judgment comes in *how* we frame this description – whether with neutrality, implicit distancing, or explicit condemnation.

  Therefore, R. should find a third path. Adding a paragraph of raw, presentist condemnation ("Corven was morally wrong about eugenics") is analytically thin and fails as history. Removing all evaluation is impossible and ignores the historian's role in shaping narrative meaning. Instead, R. can integrate contextualized moral reflection. This could involve:
  1.  **Explaining the Contemporaneous Context:** Clearly outlining *why* eugenic ideas gained traction (fears of degeneration, misinterpretations of evolution, class prejudice) and who supported them, showing Corven was within a significant current of thought.
  2.  **Acknowledging the Tension:** Explicitly stating that while these views were held by respected contemporaries, they conflict fundamentally with core values held today (and potentially hinting at critiques *available* then, like concerns about state overreach or defining "fitness").
  3.  **Reflecting on the Historian's Position:** Briefly acknowledging the historian's situatedness, perhaps noting that the task involves understanding *both* the pastness of the past *and* the unavoidable perspective of the present, without letting either dominate.

  This approach avoids crude presentist condemnation while recognizing that the historian's "neutral" stance is itself a choice laden with contemporary norms. The dispute isn't *fundamentally* about presentism; it's about how historians responsibly navigate the inherent tension between understanding historical actors empathetically and acknowledging the moral frameworks – both past *and* present – that shape the significance of their actions.

  **3. Marking Scheme (20 Marks Total: 5 points @ 4 marks each)**

  Candidates must hit the following five points, demonstrating analytical depth beyond basic definitions:

  1.  **Critique of "Neutrality":** Identifies that Examiner B's demand for *removing all evaluation* is not a neutral, timeless stance but reflects the specific modern historiographical norm of "value-neutral" scholarship, which is itself a commitment of *our* time. *(Common Mistake: Treating non-evaluation as the default, objective, or ahistorical position; failing to see it as a methodological choice with its own history.)*
  2.  **Applause Asymmetry:** Clearly articulates the inconsistency ("applause asymmetry") where we readily *credit* Corven for sanitation using modern standards she didn't fully hold, while simultaneously arguing we *cannot condemn* her eugenics using modern standards because "they weren't hers." Shows this undermines a simple appeal to "only use their standards." *(Common Mistake: Accepting the asymmetry uncritically; failing to challenge Examiner B's inconsistency; not recognizing that praise also involves applying contemporary values.)*
  3.  **Distinguishing Concept from Evaluation:** Explains that accurately describing Corven's views using concepts available to her and her contemporaries (e.g., "eugenics," "sterilization of the unfit") is not anachronistic, whereas applying labels from much later contexts (e.g., "proto-Nazi") would be. Recognizes that moral evaluation is separate from this conceptual description. *(Common Mistake: Conflating the use of accurate historical terminology with presentist moral judgment; assuming any negative description is inherently anachronistic.)*
  4.  **Rejects Dichotomy & Proposes Third Way:** Clearly rejects both Examiner A's demand for simple presentist condemnation *and* Examiner B's demand for complete removal of evaluation as inadequate solutions. Argues for a third path involving contextualization and integrated reflection. *(Common Mistake: Simply siding with one examiner over the other; failing to propose an alternative approach that addresses the shortcomings of both extremes.)*
  5.  **Core Dispute Beyond Presentism:** Argues convincingly that while presentism is a factor, the *fundamental* disagreement is not *about* presentism per se. Instead, it concerns the historian's mode of engagement with moral complexity and the inescapability of normative commitments (like the value of dispassionate description *or* moral concern) in shaping historical narrative. *(Common Mistake: Framing the entire answer solely around the definition and dangers of presentism vs. contextualism; missing the deeper methodological conflict about narrative stance and responsibility.)*

  **Distinguishing A from B Answers:**

  *   **A Answer (17-20 marks):** Excels in all five must-hit points. Demonstrates sophisticated understanding by **explicitly grappling with the core tension identified in the final must-hit point**. It doesn't just ask "whose standards?" but explores *how* a historian can engage morally in a way that is intellectually honest – perhaps by asking **which standards or evaluations could be defended *to the historical actors themselves* on terms *accessible* within their own conceptual and moral universe** (e.g., pointing out internal contradictions, foreseeable consequences, or marginalized contemporary critiques), while also acknowledging the historian's own situated perspective. Shows awareness that historical judgment involves dialogue between past context and present concerns.
  *   **B Answer (13-16 marks):** Hits all five must-hit points competently but may treat them more mechanistically. Demonstrates understanding of the complexities (non-neutral neutrality, asymmetry, conceptual distinction) and rejects the dichotomy, proposing a reasonable third way. However, it **lacks the deeper insight into the nature of the disagreement** or the most sophisticated articulation of how moral evaluation *can* function contextually. It might settle for acknowledging the tension without fully exploring how to navigate it beyond basic contextualization. May frame the issue primarily as balancing presentism and contextualism rather than seeing it as a conflict over the historian's inherent normative engagement.
