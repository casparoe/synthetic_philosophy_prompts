answer: |-
  Here's a breakdown of Kyle Stanford's transient vs. permanent underdetermination distinction, its interaction with Duhem-Quine holism, the resolvability contrast, and the contested status within philosophy of science:

  1.  **The Core Distinction (Stanford):**
      *   **Transient Underdetermination:** Occurs when currently *available* evidence is insufficient to decide between competing theories (T1 and T2), but *further evidence we can reasonably obtain in the future* (through improved instruments, experiments, or observations) *could*, in principle, discriminate between them.
      *   **Permanent Underdetermination:** Occurs when *no possible evidence we could ever obtain* is capable of discriminating between T1 and T2. The theories are *empirically equivalent* not just now, but for all possible observations, past, present, and future. They make exactly the same predictions about all observable phenomena.

  2.  **Why Only Permanent Underdetermination Threatens Realism:**
      *   Scientific realism asserts that our best scientific theories are (approximately) true descriptions of the unobservable world. Realists accept that science progresses through overcoming temporary ignorance and evidential limitations.
      *   **Transient:** Poses no fundamental threat. It reflects the practical, ongoing nature of scientific inquiry. Realists believe that as science progresses and more evidence is gathered (especially evidence testing the theories' *novel predictions*), transient underdetermination is resolved. We eventually converge on the (approximately) true theory.
      *   **Permanent:** Poses a devastating threat. If two (or more) fundamentally different theories about the unobservable world are forever empirically indistinguishable, then *even ideal future science* could never tell us which one (if any) is true. There is no evidential path to preferring one unobservable ontology over the other. This directly undermines the realist claim that science successfully discovers the truth about unobservables.

  3.  **Interaction with Duhem-Quine Holism (DQT):**
      *   **DQT Thesis:** Scientific hypotheses (especially those about unobservables) are not tested in isolation. They are embedded within a complex web of auxiliary assumptions (A), background theories, and theories about instruments and observation. When a prediction fails, the blame can be assigned to the main hypothesis (H) *or* to some part of the auxiliary assumptions (A). Logically, one can always save H by making suitable (often radical) adjustments to A.
      *   **Does DQT Entail Permanent Underdetermination?**
          *   **No, Not Necessarily.** DQT primarily highlights **transient underdetermination in practice**. It shows that *at any given time*, faced with recalcitrant evidence, a theorist *could* preserve a favored hypothesis by revising auxiliaries. However, this doesn't automatically mean the resulting *revised* theory complex (H' + A') will be *permanently* empirically equivalent to its rivals.
          *   **The Stubborn Transient Interpretation:** Most philosophers (including many anti-realists) acknowledge that DQT creates persistent and often very stubborn transient underdetermination. Saving a theory can require increasingly complex, contrived, or implausible revisions to auxiliaries. While *possible* in principle at a single moment, such maneuvers often lead to theories that make *different* novel predictions than their rivals. Future evidence *may* eventually discriminate against some preserved versions by showing their auxiliaries are implausible or lead to new empirical conflicts elsewhere in the web of belief. DQT makes underdetermination pervasive and difficult to resolve quickly, but not necessarily permanent.
          *   **The Potential for Permanent Interpretation (Stanford's Concern):** Stanford argues that DQT *opens the door* to the *possibility* of permanent underdetermination. A sufficiently ingenious (or desperate) defender of a theory might construct revisions to auxiliaries that result in a new theory complex that is *empirically equivalent* to its successful rival *for all possible evidence*. While DQT doesn't *guarantee* this is always possible, it makes it a live threat. The "pessimistic meta-induction" (based on past scientific revolutions) suggests we might *always* be in a position where such unconceived, empirically equivalent alternatives exist but remain undiscovered.
      *   **Settled vs. Contested:** It's widely accepted that DQT entails *widespread and stubborn transient* underdetermination. **It is contested** whether DQT logically entails, or makes practically inevitable, genuine *permanent* underdetermination involving fully developed, empirically equivalent rivals. Many realists (e.g., Psillos, Devitt) argue DQT only shows transient underdetermination is hard to overcome, not that it's insurmountable or permanent.

  4.  **The Resolvability Contrast & Potential Circularity:**
      *   **The Line:** The transient/permanent distinction hinges on resolvability:
          *   **Transient:** Resolvable *in principle* by evidence *we can actually obtain* (even if difficult, expensive, or requiring future technology).
          *   **Permanent:** *Not* resolvable *even in principle* by *any possible* evidence whatsoever.
      *   **The Contrast:** It contrasts resolvability **by evidence accessible to us within the constraints of the physical universe and our cognitive/epistemic capacities** (transient) vs. **resolvability by any conceivable evidence whatsoever, even if physically impossible for us to obtain** (permanent implies no such evidence exists).
      *   **The Circularity Worry:** Defining "possible evidence" non-circularly is notoriously difficult. Does it mean:
          *   Logically possible? (Too broad - includes evidence violating physical laws)
          *   Physically possible? (Requires defining physical laws independently of the theories being evaluated - tricky)
          *   Epistemically/humanly possible? (Risks making permanent underdetermination trivial, as many things are beyond our grasp)
      *   **Status:** This is a **deeply contested and unresolved problem**. Realists often argue that "possible evidence" must mean evidence consistent with the *actual* laws of nature (which realism assumes we can discover). Anti-realists like Stanford argue that if we don't know the true laws, we can't definitively rule out the physical possibility of evidence that would discriminate between theories we *currently* deem equivalent. Defining the boundary without presupposing realist success is challenging. There is **no consensus** on a perfectly non-circular definition, making the *practical application* of the permanent category contentious.

  5.  **The Status of Real Scientific Cases:**
      *   **Illustrations vs. Instantiations:** Philosophers frequently use examples like:
          *   Newtonian Mechanics vs. Special Relativity (before crucial tests like Michelson-Morley, but resolved later - transient).
          *   Lorentz's Ether Theory vs. Einstein's Special Relativity (mathematically equivalent in predictions for all experiments *within their shared domain*, but Lorentz's theory required increasingly complex auxiliary assumptions about the unobservable ether - often seen as stubborn transient resolved by Occam's Razor and further developments like General Relativity).
          *   Global formulations of Quantum Mechanics (e.g., Copenhagen vs. Bohmian Mechanics vs. Everett (Many-Worlds) - arguably empirically equivalent regarding the outcomes of any conceivable measurement, making underdetermination *potentially* permanent).
      *   **Settled View:** There is **widespread agreement** that historical cases (like Lorentz/Einstein) *illustrate* the *logical possibility* of empirically equivalent rivals and the *practical difficulty* of overcoming transient underdetermination. They are powerful illustrations of the *threat* and the role of non-empirical virtues (simplicity, coherence).
      *   **Contested View:** It is **highly contested** whether *any actual, fully developed scientific theory currently or historically* faces a genuine, persistent, *permanent* empirically equivalent rival. Critics (like Laudan, Leplin, Psillos) argue:
          *   The equivalence often breaks down when considering *novel predictions* outside the original domain, counterfactuals, or theoretical unification.
          *   Examples like Bohmian Mechanics vs. Copenhagen QM involve significant interpretative differences that *might* lead to empirically testable differences with future physics (e.g., quantum gravity).
          *   The "unconceived alternatives" from the pessimistic meta-induction remain speculative possibilities, not demonstrated permanent rivals.
      *   **Stanford's Position:** Stanford argues that the historical record (pessimistic meta-induction) strongly suggests we are *always* surrounded by unconceived alternatives, some of which *might* be permanently empirically equivalent to our best theories. He sees the Lorentz case as *approximating* permanent underdetermination for a significant period and warns that current theories likely face similar unconceived equivalents. He doesn't necessarily claim to have a definitive *current* example, but argues the threat is real and ever-present.

  **Summary of Consensus vs. Contested:**

  *   **Settled/Consensus:**
      *   The distinction between transient and permanent underdetermination is meaningful.
      *   Only permanent underdetermination poses a fundamental threat to scientific realism.
      *   DQT entails pervasive and stubborn transient underdetermination.
      *   Historical cases like Lorentz/Einstein illustrate transient underdetermination and the power of non-empirical virtues.
      *   Defining "possible evidence" non-circularly for the permanent case is philosophically challenging.
  *   **Contested/Unsettled:**
      *   Whether DQT logically entails or makes inevitable genuine permanent underdetermination.
      *   Whether "permanent" underdetermination can be defined non-circularly in a satisfactory way.
      *   **Crucially:** Whether any *actual, specific, past or present scientific theory* is in a state of *genuine, permanent* underdetermination relative to a fully developed, scientifically viable rival. (Most agree it's *possible in principle*; deep disagreement exists on whether it *actually occurs*).
      *   The ultimate significance of the permanent underdetermination threat for scientific realism (Is it a decisive refutation, a serious challenge requiring realist concessions, or merely a logical curiosity?).

  Stanford leverages the *possibility* of permanent underdetermination (highlighted by DQT and the pessimistic meta-induction) to argue that realism is unjustified. Realists counter that this possibility remains uninstantiated and that scientific practice successfully overcomes transient underdetermination, warranting belief in our best theories. The debate hinges significantly on the contested existence of genuine permanent empirical equivalents.
