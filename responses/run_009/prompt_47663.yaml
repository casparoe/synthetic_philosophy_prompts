  **Historical Confidence Note:**

  *   **Overall Confidence:** High. The core events (Masada siege and mass suicide, Battle of Kosovo, Dunkirk evacuation, Confederate military defeats in the US Civil War) and the *nature* of their subsequent mythologization ("Last Stand" defiance at Masada, Serbian martyrdom/Heavenly Kingdom narrative, "Dunkirk Spirit" as miraculous deliverance/moral victory, "Lost Cause" ideology valorizing Confederate sacrifice and downplaying slavery) are well-documented historical phenomena. The specific elements satirized (omission of mass suicide details, romanticization of Lazar's choice, focus solely on the evacuation's "miracle," erasure of slavery as the Confederate cause) accurately reflect common features of these myths.
  *   **Least Confident Detail:** The specifics surrounding Prince Lazar's purported "choice" between a heavenly and earthly kingdom at Kosovo Field. While this is a central tenet of the Serbian national myth and appears in epic poetry (notably the *Kosovo Cycle*), the historical record of Lazar's actual motivations or any explicit statement framing the battle in those precise terms is less clear. The myth solidified significantly *after* the event. The brochure presents the mythologized version as it's popularly understood and commemorated, which is the target of the satire, but the literal historical accuracy of Lazar framing it exactly as "Heavenly Kingdom vs. Earthly Kingdom" in that moment is the shakiest ground.
