  The two-envelope paradox and its variants highlight a subtle issue in probability: the legitimacy of expected-value calculations depends critically on the availability of a well-defined probability distribution. The key principle is that **the expected-value argument for swapping is legitimate only when you can condition on the observed amount in your envelope and assign meaningful, finite probabilities to the two scenarios (that your amount is the smaller or the larger of the two envelopes).** Without this, the argument fails. I'll break this down case by case, reconciling your intuitions and addressing the infinite variant.

  ### Core Principle: Conditioning and Probability Assignment
  - The expected-value calculation for swapping requires two things: 
    1. **Conditioning on the observed value**: You need a specific amount to condition on (e.g., by opening the envelope).
    2. **Well-defined probabilities**: You must assign probabilities to the events "my amount is the smaller" and "my amount is the larger" based on available information. Crucially, these probabilities must be consistent with a proper prior distribution or known mechanism, and the expected values must be finite.
  - When these conditions hold, the expected gain from swapping can be computed meaningfully. When they don't, the calculation is invalid or misleading.

  Now, let's apply this to your cases:

  ### 1. Plain Case (No Information, Envelopes Closed)
  - **Your verdict**: Swapping is pointless; the argument is broken.
  - **Explanation**: Here, there is no observed amount to condition on, so you cannot assign probabilities to "smaller" or "larger" for a specific value. The naive calculation (assuming a 50% chance of doubling or halving any arbitrary amount) leads to infinite regress because it implicitly relies on an improper or undefined prior. Without conditioning, the global expected gain is zero: you are equally likely to gain or lose by swapping, so no advantage exists. The principle confirms that the argument is illegitimate here due to the lack of conditioning.

  ### 2. Open and See $100 (No Additional Information)
  - **Your verdict**: You feel a pull to swap.
  - **Explanation**: This pull arises because you now have an observed amount ($100) to condition on. With no other information, you implicitly assume symmetry—that $100 is equally likely to be the smaller or larger amount—so the other envelope has a 50% chance of $50 or $200, yielding an expected value of $125. This makes swapping seem advantageous.
  - **Reconciliation with the plain case**: The difference is conditioning. Before opening, there's no value to anchor the probabilities; after opening, you have one. The principle allows the argument here because conditioning is possible, and the symmetry assumption (while not always rigorous) is a reasonable default when no prior information contradicts it. However, this assumption is fragile—it depends on the unspoken prior distribution. For instance, if the true prior favors smaller amounts, the probability that $100 is the larger envelope might be higher, reducing the expected gain. But without evidence for such a prior, the pull to swap is understandable and locally valid under symmetry.

  ### 3. Cap at $300, See $250
  - **Your verdict**: Refuse to swap.
  - **Explanation**: The cap breaks symmetry. Given that no envelope exceeds $300, your $250 must be the larger amount (since doubling it to $500 would violate the cap). Thus, the other envelope must contain $125. Here, conditioning on $250 and the cap information assigns a 100% probability that your amount is larger, so swapping loses $125 on average. The probabilities are well-defined and unequal, making the argument legitimate against swapping. The principle shows why the open-and-see-$100 case differs: there, no cap forces unequal probabilities.

  ### 4. Known Filling Method ($100 in Your Envelope, Coin Flip for the Other)
  - **Your verdict**: Swapping is advantageous.
  - **Explanation**: The mechanism defines the probabilities: given your observed $100, the other envelope is objectively $50 or $200 with 50% probability each, so the expected value of swapping is $125, a clear $25 gain. Conditioning on the observed amount and the known probabilities makes the argument legitimate. This contrasts with the plain open-and-see case, where probabilities are assumed, not known.

  ### 5. Infinite Expected Value (Generated by Coin Flips)
  - **Your verdict**: Unsure; something seems wrong.
  - **Explanation**: Here, amounts are generated by repeated coin flips (e.g., double on heads), so the smaller amount has infinite expected value. This violates the principle: even with conditioning, the expected values are infinite, so the expected gain is undefined or incoherent. For any finite observed amount, you might assign probabilities (e.g., if the distribution is symmetric, P(your amount is smaller) = 1/2), but the expected gain calculation diverges. For instance, if you see amount X, the expected value of the other envelope is (1/2)(X/2) + (1/2)(2X) = 1.25X, but since X could be immense, this doesn't imply a real advantage—it just reflects the infinite mean. Unconditionally, swapping doesn't change the expected value (both envelopes have the same distribution), so there's no benefit. The principle says the argument is illegitimate here due to infinite expectations; you should ignore it and not swap. If forced to decide, stick with your envelope to avoid the paradox.

  ### Addressing Your Questions
  - **Reconciling the pull after seeing $100 with the refusal before opening**: The pull after opening comes from valid conditioning and default symmetry. Before opening, conditioning is impossible, so no probabilities can be assigned—refusing the argument is correct. The two states (closed vs. open) are fundamentally different under the principle.
  - **What the principle says about the infinite case**: It deems the expected-value argument illegitimate because infinite expectations render probabilities meaningless for decision-making. Stick with your initial envelope.
  - **If verdicts must be revised**: Only the open-and-see-$100 verdict might need softening. While the pull to swap is natural, it relies on an untested symmetry assumption. In reality, for some priors (e.g., if small amounts are more likely), swapping could be neutral or harmful. But with no information, symmetry is a practical default—just acknowledge it's an assumption, not a proof. Your other verdicts (plain case, cap, known filling) are solid under the principle.

  ### Final Thought for the Column
  The paradoxes dissolve when we insist on proper conditioning and probability assignments. In essence: **never use expected-value arguments for swapping without a specific observed amount and well-defined, finite probabilities.** This principle covers all your cases and warns against vague priors or infinite expectations. For readers, emphasize that probability is about information—without it, math can mislead. In the infinite case, this becomes a cautionary tale against unbounded distributions in decision theory. If pressed, give up strict advocacy for swapping after seeing $100; present it as a common intuition based on symmetry, but not a universal truth.
