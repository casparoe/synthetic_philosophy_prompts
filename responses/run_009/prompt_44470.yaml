  Okay, let me start by unpacking what the user is asking. They're a science writer who's noticed a pattern in vague concepts—borderline cases where individual judgments are fuzzy, but certain combinations of those judgments are treated as invalid. They give three examples: color grading, height descriptions, and town vs. city classifications. The core question is why some combinations within the gray area are forbidden while individual calls are acceptable.

  First, I need to recall relevant philosophical concepts. The Sorites Paradox comes to mind, which deals with vagueness and borderline cases. But the user mentions that existing discussions focus on where the line is drawn, not the constraints within the gray zone. So, this seems different. 

  Looking at their examples, each instance shows that while individual borderline calls are permissible, inconsistent sequences or combinations are rejected. The materials lab allows borderline samples but rejects a sequence that jumps between categories. Similarly, calling two nearly identical heights differently in terms of "tall" is seen as an error. The town/city example is especially interesting because describing a place as both or neither is asymmetrical—neither is acceptable, but both is contradictory.

  I should check if there's an established term for this. Epistemicism? Supervaluationism? Those deal with truth values in vagueness but don't address constraints on combinations. Contextualism involves context-dependence, but the user's examples show constraints even within the same context. Maybe "penumbral connections" from legal theory? That's about conceptual entailments, which fits the examples where category membership implies something about adjacent cases. 

  Penumbral connections might be the closest concept. In law, even in vague areas, certain relationships must hold. For example, if A is red and B is more orange, B can't be called red if A isn't. That aligns with the user's examples. But I need to confirm if this applies beyond law to their cases. The height example: if two people have nearly identical heights, calling one tall and the other not violates the penumbral connection that similar objects should have similar classifications. 

  Now, relating this to the Sorites Paradox. The paradox relies on tolerance principles (one grain doesn't make a difference). The user's constraint is different—it's about consistency in application rather than the impossibility of drawing a line. So, the Sorites challenges the existence of sharp boundaries, while these constraints enforce relational consistency within the boundary area. 

  The user also asks if this applies to context-dependent rules, like different regulatory standards. Here, penumbral connections might still hold within a single context. For example, within one regulatory regime, if two pollution readings are similar, one shouldn't be "elevated" while the other isn't. But across contexts, different standards apply, so no inconsistency. This distinction is crucial. 

  Coining a term: "Penumbral Constraints" fits, but maybe "Vagueness Coherence Principles" or "Fuzzy Consistency Rules." The key is defining it as relational constraints in borderline cases that prevent arbitrary combinations. 

  I need to ensure the definition covers both the examples and distinguishes from context-dependence. Also, the user wants precision—so defining when these constraints apply (same context, same continuum) and when they don't (across different contexts). 

  Lastly, verifying if this answers all parts: the term, relation to Sorites, extension to context-dependence. The penumbral connections concept seems robust, but emphasizing its application beyond law to general vague concepts. Highlighting the difference between individual borderline tolerance and combinatorial constraints. Yes, this should address the user's needs.
answer: |-
  This phenomenon you've observed is profound and under-discussed—it's a **relational constraint within vagueness itself**, where *consistency* between borderline judgments is enforced even when individual judgments are arbitrary. Here's the precise carving you requested:

  ### 1. **Established Name & Scope**  
     The closest established concept is **"penumbral connections"** (originating from Hart's legal philosophy and refined by Fine/Keefe in *supervaluationist* semantics).  
     - **What it covers**: In vague predicates, certain *relationships* between objects must hold regardless of where boundaries are drawn. If A is redder than B, no admissible precisification can call B "red" while calling A "not red." Your examples violate this:  
       - *Color grading*: If sample 55 is oranger than sample 42, calling 42 "red" and 55 "not red" violates the penumbral rule that redder things cannot be excluded while less red things are included.  
       - *Height*: The taller prospect cannot be "not tall" if the shorter is "tall."  
       - *Town/City*: "Neither" is acceptable (no violation of entailment); "both" implies a boundary exists where the municipality simultaneously satisfies contradictory criteria—a logical impossibility under any precisification.  
     - **Scope**: Penumbral connections enforce *ordering*, *monotonicity*, or *conceptual entailments* within the gray zone. They are syntactic rules for coherently applying vague predicates.

  ### 2. **Relation to the Sorites Paradox**  
     - **Sorites**: Challenges whether *any* sharp boundary exists (e.g., "If removing one grain never turns a heap to non-heap, there are no heaps"). It targets the *existence* of a boundary.  
     - **Penumbral Connections**: Assume vagueness but enforce *internal consistency*. They are **complementary**:  
       - The Sorites *exploits* the absence of boundaries; penumbral connections *constrain* how we navigate that absence.  
       - Violating penumbral connections (e.g., calling adjacent grains "heap" and "non-heap") isn't just arbitrary—it’s *incoherent*, as it breaks transitivity or monotonicity required by the predicate’s meaning.  
     - **Key difference**: Sorites questions boundary *existence*; penumbral connections govern boundary *behavior* in relation to other objects.

  ### 3. **Coined Term & Definition**  
     If "penumbral connections" feels too technical, I propose **"vagueness coherence constraints"** (VCCs).  
     - **Definition**:  
       > *A **vagueness coherence constraint** is a rule that prohibits certain combinations of judgments about borderline cases of a vague predicate P, even when no individual judgment is determinately true/false. These constraints arise from the semantic structure of P, requiring that judgments respect ordering (if x is P-er than y, y cannot be P while x is ¬P), non-contradiction (x cannot be both P and ¬P), or other conceptual entailments across the vague domain.*  
     - **Boundaries**:  
       - **Contested Case (Regulatory Contexts)**: VCCs apply *within a single context of assessment*. If two pollution readings are identical, calling one "elevated" (for regime A) and the other "not elevated" (for regime A) violates VCCs. But if regimes A and B use different thresholds, no violation occurs—it’s *context-dependence*, not incoherence.  
       - **Vs. Ordinary Context-Dependence**: Context-dependence allows *shifting* boundaries (e.g., "tall" for jockeys vs. basketball). VCCs operate *within* a fixed context, forbidding locally inconsistent applications even when global boundaries are fluid.  

  ### Why Your Examples Are Captured
  - **Materials Lab**: Jumping between "red" and "not red" for samples moving monotonically toward orange violates ordering.  
  - **Sports Heights**: Calling nearly identical heights "tall"/"not tall" ignores monotonicity.  
  - **Town/City**: "Both" violates non-contradiction; "neither" does not.  

  ### Why This Matters
  VCCs reveal that vagueness isn't lawless: **meaning imposes structure even where precision fails**. They are the "guardrails" ensuring that borderline judgments, while indeterminate individually, collectively respect the predicate’s architecture. This bridges philosophy of language and practical reasoning—essential for your science writing on thresholds and categorization.

  Would you like an example-driven expansion for any specific aspect?
