  We are drafting a joint statement between two interpretive camps regarding Gongsun Long's "White Horse Dialogue". The camps are:
  - Dissolution reading: The argument is a sophistical exercise trading on ambiguity, specifically equivocation between identity and predication or reference.
  - Theory reading: Gongsun Long is a serious semantic theorist, and the claim that a white horse is not a horse is literally true on his semantics, where each name picks out exactly one "whatness".

  The structure is fixed:

  1. **Agreed Claims**: A numbered list of claims both sides can accept.
  2. **Disagreements Table**: Each stated in wording acceptable to its side, flagged as substantive or verbal (and if verbal, explain the term usage).
  3. **Cruxes**: Two specified cruxes (with possible revision) and for each, an agreed test and each side's prediction.
  4. **Predictions for New Evidence**: What each camp would expect from hypothetical new evidence, and if there's any finding both agree would move one of them.

  We must avoid resolving the dispute, and the statement should stand alone without bibliography.

  Let's build each part:

  ---

  ### 1. Agreed Claims

  Both sides can agree on:

  1. **Transmission and Compilation**: The received text of the *Gongsun Longzi* is a late compilation (likely Han dynasty or later) with uncertain authorship and possible alterations, interpolations, or corruptions. The "White Horse Dialogue" as we have it may not be a verbatim record of an actual disputation but a constructed dialectic.

  2. **Formal Validity in Modern Logic**: When reconstructed in modern predicate logic, the steps of the white horse dialectic are not uniformly formally valid. In particular, the step from "Horse is that which has shape; white horse is that which has color" to the conclusion that a white horse is not a horse involves a formal fallacy (such as equivocation on the term "horse") if one assumes a standard extensional semantics. However, the argument may be valid under a non-standard semantics (e.g., intensional) that the text might presuppose.

  3. **Translation Indeterminacy**: Translators of the *Gongsun Longzi* routinely import their own semantic commitments (e.g., about reference, identity, or properties) when rendering key terms. Therefore, no single translation can establish the correct interpretation; divergent translations are evidence of the text's inherent ambiguity and the difficulty of mapping ancient Chinese terms to modern philosophical categories.

  4. **Companion Arguments**: The chapters on "Hardness and Whiteness" and "On Referring" (or "On Names and Things") are part of the same transmitted corpus and share thematic concerns (e.g., the separability of attributes, the relation between names and things). However, the degree to which they form a unified system is a matter of interpretation.

  5. **Dialectical Structure**: The white horse argument is presented as a dialogue where objections are raised and answered, and it uses analogies (e.g., the example of seeking a horse vs. seeking a yellow horse). Both sides agree that Gongsun Long's responses aim to defend the master claim, but they disagree on whether this defense is ad hoc or systematic.

  ---

  ### 2. Disagreements Table

  | Disagreement | Camp | Substantive/Verbal | If Verbal, Explanation |
  |--------------|------|-------------------|------------------------|
  | The primary purpose of the white horse argument is to expose and exploit linguistic ambiguity for dialectical effect (e.g., to win a disputation or train in logic) rather than to assert a metaphysical or semantic theory. | Dissolution | Substantive | N/A |
  | The primary purpose of the white horse argument is to articulate and defend a substantive philosophical theory about names and their referents (specifically, that each name picks out a unique abstract object, and compound names pick out distinct objects from simple ones). | Theory | Substantive | N/A |
  | The term "horse" in the master claim "a white horse is not a horse" is being used in two different senses: one as a general term (for the species) and one as a compound term component (in "white horse"), leading to equivocation. | Dissolution | Substantive | N/A |
  | The term "horse" in the master claim is consistently used to denote a single abstract object (the whatness 'horseness'), and "white horse" denotes a distinct compound whatness, so there is no equivocation but a strict application of a univocal semantic theory. | Theory | Substantive | N/A |
  | The negative in "is not" functions as a denial that the compound name 'white horse' has the same referent as the simple name 'horse', which is true on a theory of reference where compound names refer to subsets or qualified instances, but the argument trades on an ambiguity between this and the denial of identity between an instance and the type. | Dissolution | Verbal | "Verbal" because both sides might agree that the denial is about reference, but the dissolutionist sees ambiguity in the context (allowing the argument to deceive), while the theorist sees a consistent reference denial. Key term: "referential denial" – Dissolutionist: it is ambiguous between two kinds of reference (e.g., type vs. token); Theorist: it is univocally a denial of co-reference of two distinct names. |
  | The negative in "is not" is a denial of identity between two distinct referents (the referent of 'white horse' and the referent of 'horse'), and there is no slippage because the theory consistently maintains that each name has a unique referent. | Theory | Substantive | N/A |

  Note: We flag one as verbal because the disagreement might turn on whether the same kind of reference is at issue. The dissolutionist sees a shift (e.g., from type to token reference), while the theorist sees no shift (both names refer to abstract objects, but different ones).

  ---

  ### 3. Cruxes

  **Crux (a): The nature of the negative in the master claim**

  - *Agreed Test*: Both sides agree that if the dialogue consistently uses the negative in one way (e.g., only for denial of identity or only for denial of predication) and the objections and replies presuppose this, that would support the univocal reading. If the dialogue shifts between different uses without clarification, that would support the ambiguity reading. Specifically, we can examine the objections (e.g., "if a white horse is not a horse, then a white horse is not a horse?") and Gongsun Long's replies (e.g., about seeking a horse vs. seeking a white horse) to see if they treat the negative uniformly.

  - *Dissolutionist Prediction*: The dialogue will show shifts in the use of the negative (e.g., sometimes denying identity, sometimes denying class membership) without explicit disambiguation, allowing the argument to proceed by equivocation.

  - *Theorist Prediction*: The dialogue will consistently use the negative as a denial of identity between the referents of two distinct names (as per the semantic theory), and the objections and replies will be addressed within that univocal framework.

  **Crux (b): Unity of the corpus**

  - *Agreed Test*: Both sides agree that if the arguments in the "Hardness and Whiteness" and "On Referring" chapters explicitly reference or presuppose the white horse argument (or vice versa), that would support a unified theory. If the chapters use consistent terminology and argumentative methods, that would also support unity. If they are thematically similar but methodologically or terminologically divergent, that would suggest compilation from different strands.

  - *Dissolutionist Prediction*: The chapters will show thematic overlaps but no necessary connection; the "White Horse" chapter does not rely on the separability thesis of "Hardness and Whiteness" or the naming theory of "On Referring". The compilation is likely a later grouping of independent disputations.

  - *Theorist Prediction*: The chapters will share core doctrines (e.g., the separability of attributes, the unique reference of names) and form a coherent system; for instance, the white horse argument relies on the separability of attributes as argued in "Hardness and Whiteness".

  ---

  ### 4. Predictions for New Evidence

  - **Hypothetical New Evidence 1**: An excavated manuscript containing a fuller version of the white horse discourse, with additional explanatory passages.

    - *Dissolutionist Expectation*: The fuller version would show more clearly the dialectical context (e.g., it is part of a series of sophistical puzzles) and might contain internal cues that the argument is meant to expose ambiguity (e.g., a concluding remark about the importance of clarifying terms). It would not contain a systematic semantic theory.

    - *Theorist Expectation*: The fuller version would elaborate the semantic theory (e.g., defining what a name picks out) and show explicit connections to the other chapters (e.g., using the separability argument from "Hardness and Whiteness" to support the white horse claim).

  - **Hypothetical New Evidence 2**: A contemporary commentary (e.g., from the Warring States period) discussing how Gongsun Long's white horse argument was received.

    - *Dissolutionist Expectation*: The commentary would describe the argument as a clever paradox or a tool for training in disputation, possibly with criticism that it trades on confusion. It would not treat it as a serious ontological or semantic theory.

    - *Theorist Expectation*: The commentary would engage with the argument as a substantive philosophical claim, either endorsing or refuting its semantic foundations, and might link it to other theoretical arguments of the school.

  - **Finding Both Camps Agree Would Move At Least One**: Both camps agree that if a newly discovered manuscript contained an explicit statement by Gongsun Long (or a direct disciple) that the white horse argument was intended as a mere dialectical exercise (or, conversely, as part of a systematic theory), that would be decisive evidence. The dissolutionist would be moved by the former, the theorist by the latter. Absent such a statement, they also agree that evidence of the argument being consistently interpreted in one way by early commentators (e.g., multiple independent sources) could shift the balance.

  ---

