answer: |-
  ### Joint Statement on the Interpretation of Gongsun Long's "White Horse Discourse"

  #### 1. Agreed Claims  
  Both the dissolution and theory camps jointly affirm the following claims about the "White Horse Discourse" (*Báimǎ Lùn*) and its context:  

  1.1. **Transmission and Compilation**: The received text of the *Gongsun Longzi* is a product of late, uncertain compilation (likely Han dynasty or later), with the white horse chapter potentially incorporating Warring States materials but subject to scribal errors, editorial interventions, or accretions. This textual instability precludes treating any passage as a verbatim record of Gongsun Long's own words, requiring critical scrutiny of the dialectic's structure and terminology.  

  1.2. **Formal Validity in Logical Reconstruction**:  
     - Under a modern predicate-logical reconstruction, the core inference from premises (e.g., "horse denotes shape" and "white horse denotes color and shape") to the conclusion ("a white horse is not a horse") is formally invalid if "is" is interpreted as standard identity or class membership, due to equivocation on "horse."  
     - The argument becomes formally valid only if "is not" is reconstructed as denying co-reference (i.e., that "white horse" and "horse" pick out the same object), but this requires non-standard semantic assumptions not explicit in the text. The dialectic's persuasive power relies on steps that are invalid under extensional semantics but may appear valid in a context-dependent disputation.  

  1.3. **Translation Indeterminacy**: No single translation can resolve the discourse's meaning, as key terms (e.g., *míng* 名, "name"; *wù* 物, "thing"; *fēi* 非, "is not") are inherently ambiguous and routinely translated in ways that import the translator's own semantic commitments (e.g., Platonic forms, linguistic conventionalism, or nominalism). Divergent translations (e.g., of *fēi* as "is not identical to" vs. "is not an instance of") reflect the text's underdetermination, not definitive solutions.  

  1.4. **Companion Chapters as Context**: The "Hardness and Whiteness" (*Jiānbái Lùn*) and "On Names and Things" (*Zhǐwù Lùn*) chapters share surface similarities with the white horse discourse (e.g., separability of attributes and name-thing relations) and are transmitted together. However, their thematic overlap does not entail a unified authorial system; they may represent distinct strands of the "School of Names" later grouped by compilers.  

  1.5. **Dialectical Purpose**: The discourse is structured as a persuasive dialogue with objections and replies (e.g., the analogy of seeking a horse vs. seeking a white horse), aimed at defending the master claim against intuitive counterarguments. Both camps agree this reflects a broader Warring States culture of rhetorical disputation (*biàn* 辯), but they disagree on whether the defense is primarily logical or tactical.  

  #### 2. Disagreements Table  
  Each camp’s position is stated in its own accepted wording. Disagreements are flagged as substantive (S) or verbal (V). Verbal disagreements include an explanation of divergent key-term usage.  

  | Disagreement                                                                                                | Camp          | S/V | Explanation (if verbal) |
  |-------------------------------------------------------------------------------------------------------------|---------------|-----|--------------------------|
  | The white horse discourse is best understood as a deliberate exposure of linguistic ambiguity, where the master claim equivocates between denying identity and denying class membership to achieve dialectical effect. | Dissolution | S   | — |
  | The white horse discourse is best understood as a rigorous application of a semantic theory in which names (e.g., "horse" and "white horse") denote distinct, abstract objects (whatnesses), making the master claim literally true. | Theory     | S   | — |
  | The argument's force depends on an unmarked shift in the use of "horse": from a general term (species) in the objection to a component of a compound term ("white horse") in the reply. | Dissolution | S   | — |
  | The argument's coherence depends on a consistent use of "horse" as denoting a single abstract object (horseness) across all steps, with "white horse" denoting a compound object (white-horseness), eliminating shift. | Theory     | S   | — |
  | The negative in "a white horse is not a horse" functions as a denial that the compound name "white horse" picks out the same thing as the simple name "horse," but the dialogue exploits an ambiguity between this and the denial that white horses are instances of the horse-kind. | Dissolution | V   | **Verbal**: Both sides agree the negative involves reference denial, but "picks out" is used differently. Dissolution: "picks out" equivocates between reference to kinds (e.g., horse-kind) and qualified instances (e.g., white horses). Theory: "picks out" univocally denotes reference to mind-independent whatnesses. |
  | The negative in "a white horse is not a horse" functions solely as a denial of identity between the referents of "white horse" and "horse," with no ambiguity, because each name picks out a unique whatness. | Theory     | S   | — |

  #### 3. Cruxes  
  **Crux (a): Function of the Negative**  
  Whether *fēi* 非 ("is not") in the master claim functions as (i) denial of identity, (ii) denial of predication/class membership, or (iii) denial of co-reference (one name singles out what the other does), and whether the dialogue treats these as distinct.  

  - **Agreed Test**: If the interlocutor's objections and Gongsun Long's replies consistently treat *fēi* as one type of denial (e.g., identity) without conflating it with others, that supports a univocal reading. If objections shift between types of denial (e.g., "How can a white horse not be a horse?" implies predication denial, while replies about "seeking a horse" imply co-reference denial) without explicit disambiguation, that supports ambiguity.  
  - **Dissolution Prediction**: The dialogue will show slippage, with objections assuming predication denial (e.g., objecting that white horses are horses) and replies switching to co-reference denial (e.g., "seeking a horse" allows yellow horses but "seeking a white horse" does not).  
  - **Theory Prediction**: The dialogue will uniformly treat *fēi* as co-reference denial, with objections and replies consistently addressing whether "horse" and "white horse" name the same object.  

  **Crux (b): Corpus Unity**  
  Whether the white horse, hardness-whiteness, and name-thing chapters form a unified theory (e.g., shared semantics and ontology) or are independent arguments later compiled.  

  - **Agreed Test**: If the chapters cross-reference each other's core concepts (e.g., "white horse" cites separability from "Hardness and Whiteness," or "On Names and Things" defines terms used in the discourse) with consistent terminology, that supports unity. If they share themes but use key terms (e.g., *zhǐ* 指, "reference") inconsistently or lack intertextual links, that supports compilation.  
  - **Dissolution Prediction**: The chapters will show thematic parallels but no necessary logical dependencies; e.g., "Hardness and Whiteness" discusses sensory separability without mentioning the white horse argument.  
  - **Theory Prediction**: The chapters will share technical terms (e.g., *dú* 獨, "independence") and doctrines (e.g., names pick out single whatnesses), with "Hardness and Whiteness" providing the separability thesis required for the white horse claim.  

  #### 4. Predictions for New Evidence  
  - **Hypothetical Evidence 1: A newly excavated manuscript containing a fuller white horse discourse**  
    - *Dissolution Expectation*: Additional passages would emphasize dialectical context (e.g., framing it as a training exercise), clarify ambiguities (e.g., defining "is not" ad hoc), or show the argument abandoned when pressed (e.g., conceding white horses are horses in practice).  
    - *Theory Expectation*: Additional passages would elaborate the semantic theory (e.g., explicit definitions of whatnesses), link to hardness-whiteness separability, or systematize naming conventions.  
    - **Shared Constraint**: Both camps agree that if the manuscript resolves crux (a) by explicitly distinguishing types of denial (e.g., "I mean not identity, not predication"), it would substantiate dissolution; if it treats *fēi* uniformly as co-reference denial, it would substantiate theory.  

  - **Hypothetical Evidence 2: A contemporary commentary discussing the argument's reception**  
    - *Dissolution Expectation*: The commentary would describe the discourse as a famous paradox used to train debaters, with critiques highlighting its "tricky" ambiguity or limited real-world applicability.  
    - *Theory Expectation*: The commentary would engage it as a serious ontological thesis (e.g., debating whether whatnesses exist), possibly linking it to other theoretical chapters.  
    - **Finding Both Agree Would Move One Side**: Both camps agree that if new evidence explicitly stated the argument's purpose (e.g., "This is a mere exercise in exposing confusion" or "This proves names denote eternal whatnesses"), it would decisively sway one camp. Absent this, consensus on early reception (e.g., multiple commentaries treating it uniformly as sophistry or metaphysics) could shift probabilities.  

  #### Closing  
  This collaboration clarifies that dissolution and theory readings diverge not on textual facts but on the discourse's *aims* (ambiguity-exposure vs. theory-building) and _semantic consistency_ (equivocation vs. univocality). Both predict that future discoveries could resolve cruxes but agree that absent explicit authorial intent, the text's indeterminacy permits multiple defensible readings. The camps remain divided on whether Gongsun Long is best read as a critic of language or a speculative ontologist—yet this joint statement marks progress in isolating where substantive disagreement begins.
