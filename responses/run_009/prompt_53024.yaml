prompt: |-
  So I'm the (relatively new) program manager at a mid-sized regional transit authority, and one of my jobs is chairing the monthly "continuance review" -- the stage-gate meeting where we decide whether projects that are over budget or behind schedule keep getting funded or get killed/paused. We run maybe 15-20 active projects at a time, everything from bridge refurb contracts to an automated fare system to little pilot programs, and at any given moment 3 or 4 of them are in trouble. The meetings are two hours, the people in the room are engineers, a finance person, and a council liaison who gets twitchy about anything that looks like waste right before an election, and whatever we recommend goes to the board, which can and does overrule us for political reasons.

  I got handed this job after our previous fare-system integration went something like four years and way too much money past its original estimate before someone finally pulled the plug, and the postmortem basically said "escalation of commitment" and left it at that. Since then I've been reading up, and the dollar auction framing really clicked for me: once you're in a dollar auction, bidding again can be locally rational because quitting means eating your whole loss for sure, and yet the whole thing only works as a trap because everyone reasons that way. Which is a much sharper diagnosis than "people irrationally honor sunk costs" -- in the auction the sunk cost reasoning isn't even exactly fallacious, it's the tournament structure that's broken. Or at least I think that's right, tell me if I'm mangling it.

  What I want from you is a procedure. Something the review committee can actually run in the meeting, on one page, question by question: what to ask about each project, in what order, what a sufficient answer to each looks like, and where the procedure should output "this is now a values call, escalate to the board" rather than pretending to have derived the answer. Some things I specifically want it to handle, which I think the textbook version doesn't:

  1. Quitting isn't free in the auction and it isn't free for us. When we kill a project we face write-offs, possible litigation with the contractor, and -- this is the part nobody writes down -- staff whose careers are invested in the thing, plus a public "the authority wasted X million" story where X includes everything we already spent. A procedure that treats stopping as a clean reset will get ignored. So the procedure has to honestly price the exit, not just the continuation.

  2. The classic advice is "don't enter the auction," but we're already in basically all of these. I want something for mid-auction decision-making: is there a principled difference between "keep bidding" and "bid once more, with a credible pre-commitment to a stopping rule we set now, under which future-us is bound"?

  3. We tried a rule that the project's own champion can't be the one to present the continuance case -- fresh eyes, no sunk costs of their own, since a colleague with no history on the project is basically a new bidder entering the auction at zero. It half worked and half turned into theater where the fresh presenter just gets steamrolled by the project team. Is there a version of that idea that actually works, or should the procedure formalize something else about who speaks and who decides?

  Then run the procedure on three of our real-ish cases so I can see if it survives contact with them:

  - The fare system replacement (the successor to the disaster): two years late, vendor keeps saying 90% done, we've already paid most of the contract, and the old system it replaces is physically dying.
  - A contractor walked off a bridge refurb about a third in, we'd have to rebid at current prices to finish, and the bridge is currently closed either way so the sunk-cost pressure partly comes from the public seeing a closed bridge.
  - A small pilot -- on-demand shuttle service in a low-ridership area -- that shows basically no ridership gains after a year, but a couple of council members love it and it's cheap. I suspect the procedure will say kill this one, which will make my life hell, and I want you to be honest about whether that's what it says and what it says about the procedure if the politically easy answer and the procedurally correct answer diverge this neatly.

  Also be upfront about where the whole framing stops applying -- we're not literally in a winner-take-all auction, the "prize" here is a functioning asset not a fixed dollar bill, and I'd like to know if the disanalogy is cosmetic or if it breaks the procedure. If escalation-of-commitment theory says our meeting structure is itself part of the trap (e.g. monthly review = we keep paying to stay at the table), say that too, even though fixing the meeting is above my pay grade.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're a program manager at a transit authority, dealing with continuance reviews for troubled projects. The key issues they mentioned are escalation of commitment, the dollar auction analogy, and the practical challenges in their current process. 

  First, I need to make sure I understand their environment. They have 15-20 active projects, with 3-4 usually in trouble. The meetings involve engineers, finance, and a council liaison. There's political pressure, especially before elections. The board can overrule decisions, which adds another layer of complexity. 

  The user mentioned a past project that failed due to escalation of commitment. They read up on the dollar auction concept, where continuing seems rational at each step but leads to bigger losses. They want a procedure that addresses the real costs of quitting—like write-offs, litigation, staff morale, and public perception. Traditional advice like "don't enter the auction" doesn't help since they're already in. 

  The user tried having a fresh presenter for troubled projects, but it didn't fully work. They need a structured process that forces objective evaluation without ignoring exit costs. Also, they want to know if pre-committing to a stopping rule mid-auction is feasible. 

  Now, the three case studies: fare system replacement, bridge refurb, and the shuttle pilot. Each has different issues. The fare system is late, vendor issues, old system failing. The bridge has a contractor walk-off, public pressure. The pilot has low ridership but political support. 

  I should consider how the dollar auction applies here. Unlike an auction, their "prize" is a functioning asset, not a fixed dollar. The value changes over time, and exit costs are significant. The procedure must account for these differences. Also, the monthly reviews might encourage continuing just to avoid immediate decisions, which is part of the trap. 

  Building the procedure requires clear steps: start with objective facts, then evaluate both continuation and exit costs, assess the value of the completed project, and compare alternatives. It should include triggers for escalation when decisions become value-based. 

  For the fare system, the exit cost is high due to sunk costs, but continuing might not be better. The bridge has high exit costs but also public pressure. The pilot is cheap but ineffective, so killing it should be straightforward, but political love complicates it. 

  The user needs honesty about when the procedure recommends killing a project despite politics. Emphasizing that the procedure's job is to provide clarity, not make the decision, might help. Also, highlighting where the dollar auction analogy breaks down—like the asset's changing value—ensures the procedure remains practical. 

  Finally, the user might have deeper needs: wanting legitimacy for tough decisions, protecting their team from blame, and having a defensible process against political pressure. The procedure should provide a framework that makes these challenges explicit, so the board owns the value judgments.
answer: |-
  Below is a **Continuance Review Procedure** designed to combat escalation of commitment using dollar auction logic while addressing your constraints. It forces explicit valuation of *both* continuation *and* exit, mandates pre-commitment, and isolates emotional/political pressures.  

  ---

  ### **Continuance Review Procedure (1-Page Template)**  
  *For each troubled project, answer in sequence. If any answer is insufficient/contested, escalate to the board.*  

  1. **Objective Status Update (5 mins max, by independent facilitator - *not* project lead)**  
     - *Q:* What is the *independent verification* of current schedule/budget vs. baseline?  
     - *Sufficient Answer:* Third-party audit, validated milestones, or objective KPIs (e.g., "Test failure rate: 42% vs. target 5%").  
     - *Red Flag:* "Vendor says 90% done" without evidence. **→ Escalate if unverified.**  

  2. **Exit Cost Calculation (Finance Lead + Legal)**  
     - *Q:* What is the *fully loaded cost to kill*? (Include: contract penalties, rebid premiums, staff redeployment, PR/legal, asset write-downs, *and* value of diverted staff time).  
     - *Sufficient Answer:* Quantified range (e.g., "$1.2M-$1.8M: $500k penalties + $700k rebid premium + $200k staff unwind").  
     - *Red Flag:* "We lose sunk costs" (irrelevant) or omission of reputational/ops risks. **→ Escalate if incomplete.**  

  3. **Continuation Cost & Credible Forecast (Project Team *with* independent peer review)**  
     - *Q:* What is the *minimum credible cost to complete* (MCC)? Forecast must include:  
       - Independent risk-adjusted estimate (e.g., Monte Carlo sim).  
       - Vendor performance penalties/enforceability.  
       - *Pre-commitment trigger:* "If [milestone] misses by [date/cost], auto-terminate."  
     - *Sufficient Answer:* "MCC: $2.5M (vs. $4M 'optimistic'). Trigger: If UAT not passed by 6/30, terminate."  
     - *Red Flag:* "We need just 3 more months" without triggers/validation. **→ Escalate.**  

  4. **Net Value of Completion (Engineering + Finance)**  
     - *Q:* Post-completion, what is the *net operational/financial benefit* vs. next-best alternative? (e.g., new fare system savings vs. patching old system).  
     - *Sufficient Answer:* NPV, benefit-cost ratio, or quantified strategic value (e.g., "Avoids $500k/yr maintenance; 10% ridership upside").  
     - *Red Flag:* "We must finish because we started" or "The council expects it." **→ Escalate (values call).**  

  5. **Decision Matrix (Committee Vote)**  
     - **Terminate** if: *Exit Cost* + *Cost of Next-Best Alternative* < *MCC*  
     - **Continue** if: *MCC* + *Risk Premium* < *Net Value of Completion* **AND** triggers are credible.  
     - **Escalate** if: Political/staff morale factors dominate (*values call*), or data is contested.  

  ---

  ### **Key Innovations vs. Textbook Sunk Cost Advice**  
  - **Exit Cost Honesty:** Step 2 forces quantification of killing costs (addressing your point #1).  
  - **Mid-Auction Pre-Commitment:** Step 3 requires *binding stopping triggers* now (addressing #2). "Bid once more" only valid with enforceable rules.  
  - **Neutralized Champions:** Independent facilitator (Step 1) + peer review (Step 3) prevent steamrolling. Facilitator controls airtime, not just presentation (fixing #3).  

  ---

  ### **Application to Your Cases**  
  **1. Fare System Replacement**  
  - *Step 1:* "90% done" rejected – demand test pass rates.  
  - *Step 2:* Exit = contract penalties ($1M) + write-offs ($3M) + *cost to extend dying old system* ($700k/yr).  
  - *Step 3:* MCC = Independent estimate of remaining work ($5M) + $1M risk buffer. Trigger: "Full system integration test by 9/30 or terminate."  
  - *Step 4:* Net value = $300k/yr savings vs. old system.  
  - *Decision:* **Terminate** if ($1M+$3M+$700k) + $5M (MCC) > NPV of savings. *Likely terminate.* Escalate due to strategic importance.  

  **2. Bridge Refurb (Contractor Walked Off)**  
  - *Step 1:* Verify site conditions (soil tests? design flaws?).  
  - *Step 2:* Exit = Rebid premium (30% higher = $1.5M) + litigation hold ($200k) + *public trust erosion* (quantify as political capital).  
  - *Step 3:* MCC = Rebid cost ($6.5M) + delay penalties ($10k/day). Trigger: "If bids exceed $7M by 8/1, abandon design; build temporary span."  
  - *Step 4:* Net value = Road reopen economic benefit ($50k/day).  
  - *Decision:* **Continue** with triggers. Value ($50k/day) >> MCC. *But escalate* to board for "temporary vs. permanent" trade-off.  

  **3. On-Demand Shuttle Pilot**  
  - *Step 1:* "No ridership gains" confirmed by trip data.  
  - *Step 2:* Exit = Minimal ($50k contract closeout + minor PR).  
  - *Step 3:* MCC = $200k/yr (even "cheap" adds up).  
  - *Step 4:* Net value = $0 (no measured benefits vs. baseline).  
  - *Decision:* **Terminate.** MCC ($200k) > Exit ($50k) + Alternative ($0).  
  - *Brutal Truth:* The procedure *will* say kill it. Political love is a *values call* – escalate to board with this note: *"Committee recommends termination on cost-effectiveness grounds; continuation is a discretionary values/political decision."* **This is the procedure working** – it forces explicit ownership of politics.  

  ---

  ### **Where the Dollar Auction Analogy Fails (and How the Procedure Adjusts)**  
  | **Auction Element**      | **Transit Project Reality**               | **Procedure’s Fix**                          |  
  |---------------------------|-------------------------------------------|----------------------------------------------|  
  | Fixed prize ($1 bill)     | Asset value decays; alternatives exist    | Step 4 values *net* benefit vs. alternatives |  
  | "Winning" is binary       | Partial completion may have value         | Step 2/4 includes salvage value              |  
  | Other bidders are adversaries | Vendors/staff are partners             | Steps 1-3 enforce objectivity via triggers   |  
  | **Critical Insight:** The *monthly review cycle itself* is part of the trap ("just one more month..."). The procedure counteracts this by forcing **pre-commitment to future exits** (Step 3 triggers).  

  ### **Recommendation**  
  - **Pilot this procedure** next month on 1-2 projects. Assign roles: neutral facilitator (rotate among engineers), finance for exit costs, independent validator (e.g., PMO analyst).  
  - **Escalate early and often** – when data is fuzzy or politics loom, kick it upstairs. Your job is to surface the *cost of values*, not override them.  
  - **Track outcomes:** If the board overrides a "terminate" recommendation, document the *non-financial rationale* and tie it to their strategic goals.  

  This won’t stop political overrides, but it will force sunlight onto the true costs of escalation – and make "kill" decisions defensible when the numbers demand it.
