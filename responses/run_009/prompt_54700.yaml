  **Bottom line: The advisor question (whether someone with all non-moral facts could settle moral questions) does the most sorting work because it cleanly separates views that reduce morality to facts about the world from those that see it as inherently dependent on perspective or response.**

  ### The Quiz
  1. **Order Effect Flip**  
     You judge two policies: Policy A slightly harms one person to save five, Policy B kills one to save five. You condemn B more harshly—but realize you’d have condemned A more if presented first. Does this weaken your judgment?  
     a) Yes, because the strength of my reaction shouldn’t depend on presentation order.  
     b) No, because different framings highlight distinct moral aspects, and both judgments hold.  

  2. **Group Benefit Flip**  
     You believe corporate tax avoidance is immoral. You then learn that if your income relied on it, you’d likely support it. Does this challenge your view?  
     a) Yes, because it shows my judgment is self-interested, not about rightness.  
     b) No, because I can still impartially confirm it’s harmful society-wide.  

  3. **Historical Flip**  
     You think gender equality is objectively right. You learn you’d have opposed it if born in 1700. Does this undermine your belief?  
     a) Yes, because it reveals my view is culturally shaped, not timeless.  
     b) No, because we now have better evidence of equality’s benefits.  

  4. **Dumbfounding Case**  
     Two adult siblings, raised apart, have a secret, consensual relationship with reliable contraception. No harm occurs. Is this wrong?  
     a) Yes, it feels deeply violating regardless of harm.  
     b) No, since nobody is hurt or deceived.  

  5. **Slavery Abolition**  
     When societies abolished slavery, was this:  
     a) Discovering a truth that always existed, even if unrecognized.  
     b) Changing values to fit new social or economic realities.  

  6. **All-Knowing Advisor**  
     An advisor knows all non-moral facts (physics, psychology, etc.). Could any moral question remain unsettled for them?  
     a) No—knowing all facts would answer every moral question.  
     b) Yes—but only in the way a puzzle is unsolved until you apply rules.  
     c) Yes—in the way preferences are unresolved (e.g., "Which flavor is best?").  

  7. **Harmless Taboo**  
     A culture forbids stepping on elders’ shadows, believing it disrespectful—but no harm results. Is this wrong?  
     a) Yes, because disrespect is inherently wrong.  
     b) No—it’s just a local custom with no real impact.  

  8. **Moral Disagreement**  
     Two informed people debate eating meat: one calls it cruel, the other permissible. Does this show no objective fact exists?  
     a) Yes—if there were one, they’d agree.  
     b) No—one could be mistaken, like in science.  

  ### Scoring Key  
  **Logical Space & Position Mapping**  
  Answers group into three clusters:  
  - **Cluster X** (aligned with moral discovery): 1b, 2b, 3b, 4b, 5a, 6a, 7a, 8b  
  - **Cluster Y** (aligned with bias/response-dependence): 1a, 2a, 3a, 4a, 5b, 6c, 7b, 8a  
  - **Cluster Z** (middle-ground): 6b (puzzle-like openness)  

  Positions occupy these clusters as follows:  
  - **Naturalist Moral Realism**: Cluster X.  
    *Awkward commitment: Must explain why harmless acts (e.g., Q4 siblings) feel wrong without invoking non-natural properties.*  
  - **Error Theory**: Cluster Y.  
    *Awkward commitment: Acting as if morality is real while believing all moral claims are false.*  
  - **Sentimentalism/Expressivism**: Cluster Y.  
    *Awkward commitment: Moral outrage is just a psychological noise, even when it feels like truth-tracking.*  
  - **Constructivism**: Cluster X *except* Q6b.  
    *Awkward commitment: Moral truths are "made up" by rational agents yet binding like objective laws.*  
  - **Plain Subjectivism**: Cluster Y *plus* Q6c.  
    *Awkward commitment: "Torture is wrong" is no truer than "I dislike broccoli."*  

  **Inconsistencies & Overlaps**  
  - **Unoccupied combinations**: Answers aligning with discovery (X) *and* Q6c. *Diagnosis: Incoherent—if morality reduces to preferences (Q6c), flip effects (1a–3a) should matter.*  
  - **Sentimentalism vs. Expressivism**: Both fall in Cluster Y. *Cannot split them here. Follow-up: "If two people feel opposite ways about torture, can both be right?" (Sentimentalism: no—emotions track universal human nature; Expressivism: yes—attitudes vary).*  
  - **Constructivism vs. Naturalist Realism**: Both endorse Cluster X, but Constructivism *requires* Q6b. If Q6a, it defaults to Realism.  

  **Reader Results**  
  - **Mostly Cluster X + Q6a → Naturalist Moral Realism**  
  - **Mostly Cluster X + Q6b → Constructivism**  
  - **Mostly Cluster Y + Q6c → Plain Subjectivism**  
  - **Mostly Cluster Y → Sentimentalism or Expressivism** (use follow-up above)  
  - **Cluster Y + Q4b/Q5a → Error Theory** (rejects harm-based wrongness but endorses discovery)  

  **Inconsistent Patterns**  
  If answers straddle X/Y:  
  - **Likely clash**: Flip-case sensitivity (1a–3a) with Q6a. *Reveals: You treat morality as perspective-dependent yet believe facts settle it.*  
  - **Likely clash**: Q5a (slavery discovery) with Q6c. *Reveals: You see progress as truth-revealing but morality as preference-like.*  

  ### Notes  
  - The advisor (Q6) and flip cases (1–3) drive sorting: Q6 distinguishes discovery (a), construction (b), and bias (c); flip cases test judgment fragility.  
  - Quasi-realism scores like Realism (Cluster X) but will be flip-sensitive (1a–3a), creating inconsistency—a marker for the position.  
  - "Harm" in Q4/Q7 probes if wrongness requires tangible damage or is intrinsic.  
  - Positions like non-natural realism don’t appear—no answers consistently require non-natural properties.
