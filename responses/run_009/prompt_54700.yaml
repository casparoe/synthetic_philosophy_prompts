  The scoring key must map answer combinations to philosophical positions (sentimentalism, expressivism, constructivism, naturalist moral realism, plain subjectivism, error theory) and be honest about overlaps and inconsistencies.

  Bottom line (as per format): The distinction that does the most sorting work is whether moral judgments are seen as discovery of mind-independent truths or as expressions/contingent constructions, which is probed by reactions to flip cases and the advisor question.

  Now, the quiz:

  **Question 1 (Flip case - order effect)**
  You are asked to judge two scenarios: 
  A) A company lays off 10% of its workforce to avoid bankruptcy. 
  B) A company lays off 10% of its workforce to increase profits. 
  You initially hear A then B and condemn B more harshly. Then you realize that if you had heard B first, you would have condemned A more harshly. Does this realization make you less confident in your judgments?
  a) Yes, because the order shouldn't matter if I'm tracking something real.
  b) No, because the context of why the layoffs happened matters and the order just focuses my attention on different aspects.

  **Question 2 (Flip case - group benefit)**
  You feel strongly that a certain business practice (like paying below a living wage) is deeply wrong. Then you learn that if your social group (e.g., your economic class) benefited from that practice, you would likely see it as acceptable. Does this make you doubt your conviction?
  a) Yes, because it suggests my judgment is just about what helps my group, not what's truly right or wrong.
  b) No, because I can still reflect and see that the practice is harmful regardless of who benefits.

  **Question 3 (Flip case - historical contingency)**
  You believe that democracy is the best form of government. Then you learn that if you had been born in a different century, you would have believed just as strongly in the divine right of kings. Does this shake your belief in democracy's superiority?
  a) Yes, because it shows my belief is just a product of my time, not a timeless truth.
  b) No, because I can see that democracy leads to better outcomes and that past societies didn't have the same evidence.

  **Question 4 (Dumbfounding case)**
  Two adult siblings, raised apart, meet as adults and have a fully consensual sexual relationship. They use reliable contraception and keep it secret, so no one is harmed. Do you think this is wrong?
  a) Yes, it still feels deeply wrong even if I can't explain why.
  b) No, because without harm, there's no real reason to condemn it.

  **Question 5 (Slavery abolition)**
  When society abolished slavery, was that:
  a) Discovering a moral truth that was always there, even when people didn't see it.
  b) Changing moral standards to fit new social conditions and values.

  **Question 6 (Advisor with non-moral facts)**
  Imagine an advisor who knows every non-moral fact about the universe (all physical, psychological, and social facts). Is there any moral question that this advisor could not settle?
  a) No, the advisor could settle every moral question because morality is based on non-moral facts.
  b) Yes, but only because the advisor might not know which moral principles to apply (like a puzzle with missing rules).
  c) Yes, because moral questions involve personal or cultural preferences that aren't settled by facts alone.

  **Question 7 (Moral disagreement)**
  Two people from different cultures have a deep disagreement: one thinks it's wrong to eat meat, the other sees no problem. Both are equally informed about the facts of animal suffering and nutrition. Does this show that there's no objective fact about whether eating meat is wrong?
  a) Yes, because if there were an objective fact, informed people wouldn't disagree.
  b) No, because one of them might be making a mistake, just like in scientific disagreements.

  **Question 8 (Moral progress)**
  We often say society has made moral progress (e.g., on women's rights). Is this progress:
  a) Like scientific progress: getting closer to the truth about right and wrong.
  b) Like fashion progress: changing to better suit our current preferences and circumstances.

  **Question 9 (Harmless taboo)**
  In a society, it is considered deeply wrong to step on shadows of elders, but no one believes it causes any harm. Is this practice:
  a) Objectively wrong, just like any violation of respect, even if the specific rule seems arbitrary.
  b) Not morally wrong, because without harm or disrespect (as we understand it), it's just a cultural quirk.

  **Question 10 (Emotion and judgment)**
  When you make a strong moral judgment (e.g., "That's unjust!"), and then you realize you're emotionally calm (not angry or upset), does that make the judgment feel less compelling?
  a) Yes, because strong moral judgments typically come with emotions; without them, it feels like an intellectual exercise.
  b) No, because I can recognize injustice without feeling angry at that moment.

