  I've become pretty convinced by the handicap principle, like the idea that peacock tails and stotting in gazelles are honest signals precisely BECAUSE they're wasteful and costly -- only a genuinely fit animal can afford them, so the cost guarantees the honesty. I first heard about it in a bio video and now I kind of see it everywhere, from luxury watches to people doing dumb dangerous stuff to impress each other. But I want to stress-test this. What would actually count against the handicap principle? I know some biologists prefer the idea that signals are cheap and honest only because of repeated interactions and punishment for lying, so like how would a defender of the handicap story respond when a signal turns out to be nearly cost-free for the strong and weak alike? Also, when Zahavi himself extends the principle to stuff like altruism (saying being helpful is a way of showing off your surplus resources), does the theory get stretched so thin that nothing could disconfirm it anymore -- and would that be a real problem or just how theories in biology are? Rank the objections from most to least serious, and tell me which ones a committed handicap person like me should genuinely worry about vs which ones they can reasonably brush off. (btw if any of the peacock stuff actually works differently than I described, correct me)
