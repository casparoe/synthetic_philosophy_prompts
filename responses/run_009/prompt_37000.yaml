  ### MEMORANDUM  
  **To:** Investment Committee  
  **From:** [Your Name]  
  **Date:** [Current Date]  
  **Subject:** Recommendation on Decision Rule for Investment Committee  

  #### Background and Recommendation  
  The committee’s March and April decisions appear inconsistent under expected-utility (EU) theory due to reversing preferences when shared outcomes are "zeroed out" (per the quant’s independence axiom argument). However, this inconsistency stems from context-dependent factors tied to our mission—not cognitive bias. I recommend **adopting a modified EU rule** requiring decisions to use expected-utility reasoning but with a utility function that incorporates mission-specific constraints (e.g., reputational risks and earmarked projects). This avoids banning context-driven deviations like our March/April combo while ensuring rigor.  

  #### Engaging the Quant’s Argument: Does Zeroing Out Preserve Context?  
  The quant’s critique—that removing March’s shared 89% ($2.4M) reduces it to April’s choice, making our flip irrational—is logically sound under EU theory’s independence axiom. If our utility were purely linear and context-agnostic, this would indeed be a violation. However, zeroing out the 89% overlooks that the certainty in March carried unique *narrative weight*: the funds were earmarked for a wetland acquisition, making the 1% failure risk a 1% chance of breaching partner trust and abandoning a conservation goal. This narrative cost vanishes when we isolate the "remainder" gamble, rendering the zeroing-out test incomplete. The axiom holds only if utility is defined solely in dollars, but our utility included relational and mission-critical dimensions.  

  #### The Wetland Member’s Point: Mission Risk Beyond Spreadsheets  
  The wetland member rightly argues that March’s certainty had tangible value unreducible to financial metrics. Failing the wetland deal would have damaged partnerships, delayed conservation, and eroded donor confidence—costs that persist even if the endowment’s size ($30M) implies linear dollar utility. This isn’t irrational "bias"; it’s a legitimate expansion of utility to include institutional reputation. In April, the auction lacked earmarks or external commitments, allowing us to pursue upside risk (10% chance of $12M) without reputational fallout. The two cases differed fundamentally: one involved safeguarding trust, the other did not.  

  #### The Endowment’s Utility and Risk Aversion’s "Home"  
  While a $30M endowment likely has near-linear dollar utility (we’re diversified and not consumption-constrained), our risk aversion lives in the *narrative and relational domain*. In March, the 1% failure risk threatened a "story" cost: explaining to partners why the wetland deal collapsed. This isn’t relabeled inconsistency—it’s a discrete disutility (e.g., -$X for reputational harm) that can be quantified and included in EU calculations. Conversely, April’s risk had no such narrative burden, making the higher expected-value gamble rational. A modified EU rule accommodates this by formalizing narrative costs.  

  #### Strongest Case for a Strict EU Rule  
  The quant’s stance for a strict EU rule ("adopt-eu-rule") is compelling: it would enforce consistency and prevent objectively suboptimal choices. For instance, if our endowment has linear utility, March’s rejection of +$960K in expected value ($2.4M certain vs. $3.36M expected) was a clear error, and April’s choice only compounded it. Without EU rigor, we risk arbitrariness, predictable financial losses (e.g., violating stochastic dominance), and opaque decision-making that undermines fiduciary duty.  

  #### Proposed Decision Rule for Future Proposals  
  All investment decisions must justify choices in expected-utility terms, with utility functions that:  
  1. **Incorporate mission constraints**, including quantifiable narrative/reputational costs (e.g., "failure disutility" for earmarked projects), modeled via step functions or scalar adjustments.  
  2. **Default to linear utility** for unrestricted funds.  
  3. **Require explicit documentation** of context (e.g., "earmarked or not?") and non-dollar disutilities.  

  #### Open Questions for Retreat Discussion  
  1. How do we quantify "narrative costs" (e.g., reputational harm) in utility functions?  
  2. What defines an "earmark" stringent enough to trigger non-linear utility (e.g., signed agreements vs. internal intent)?  
  3. Should we set a materiality threshold for when narrative costs apply (e.g., only for projects >5% of endowment)?  

