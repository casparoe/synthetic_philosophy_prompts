reasoning: |-
  We are drafting a memo for an investment committee member of a mid-sized environmental nonprofit with a $30M endowment. The memo must address two decisions: 
  1. In March, they chose a certain $2.4M from selling a donated apartment building over a risky alternative (89% chance of $2.4M, 10% of $12M, 1% of nothing). 
  2. In April, for a fundraising auction, they chose a 10% chance of $12M (else nothing) over an 11% chance of $2.4M (else nothing).

  The quant argues that these decisions violate the independence axiom because if you remove the common 89% chance of $2.4M from the March options, you are left with the same as the April options (10% chance of $12M vs. 11% chance of $2.4M, both else nothing). Yet the committee chose the safe option in March and the risky one in April.

  The wetland member argues that the certainty in March was valuable because the funds were already earmarked for a specific project (wetland acquisition) and a 1% chance of losing that was unacceptable.

  The chair wants a one-page memo that:
  - Recommends one concrete course of action (adopt, reject, or modified rule that decisions must be justified in expected-utility terms)
  - Engages the quant's consistency argument: does zeroing out the shared 89% leave the decision unchanged?
  - Takes the wetland member's point seriously (not just a bias)
  - Addresses the wrinkle: the endowment might have near-linear utility in dollars (since it's not spending the money for consumption) so where does risk aversion come from? Or is it about non-financial costs (like reputation with partners)?

  The memo must also honestly present the strongest case against the recommended position.

  Then, a JSON summary with:
  - recommendation: one of "adopt-eu-rule", "reject-eu-rule", "adopt-modified-rule"
  - main_argument (max 2 sentences)
  - strongest_objection (best case for the other side, max 2 sentences)
  - decision_rule_for_future (concrete test for future proposals)
  - open_questions (array of up to 3 things to settle at retreat)

  Approach for the memo:

  1. **Recommendation**: Adopt a modified rule that allows for expected-utility reasoning but also incorporates mission-related constraints and narrative considerations, especially when funds are earmarked for specific projects. We reject a strict expected-utility rule that bans the March+April combo.

  2. **Engage the quant's argument**: 
     - The independence axiom is a cornerstone of expected utility theory and ensures consistent preferences. Removing the common outcome should not change the preference. 
     - However, in March, the $2.4M was not just a monetary amount but represented a specific, critical project. The 1% chance of failure meant a 1% chance of failing to deliver on a promise to partners. This is a change in the nature of the gamble when the common part is removed. Thus, the quant's zeroing out does not fully capture the context.

  3. **Wetland member's point**: 
     - The certainty was indeed valuable because of the earmarking. The non-financial cost of failing to acquire the wetland (loss of trust, missed conservation opportunity) is real and not captured by expected monetary value. This is not irrational but reflects the mission's multi-dimensional utility.

  4. **Address the wrinkle**:
     - For an endowment, utility might be linear in dollars for most purposes. However, when funds are earmarked for specific projects, the utility function becomes step-like: below a certain threshold (the project cost), the utility is low, and above it, it flattens. Thus, in March, the risk aversion comes from the necessity of meeting the project cost. In April, the auction was for unrestricted funds, so linear utility applies and we maximized expected value (10%*12M = 1.2M > 11%*2.4M = 0.264M). This explains the flip without inconsistency in the underlying utility.
     - Alternatively, the risk aversion might live in the narrative and reputational domain: in March, failing to deliver on a promised project would harm relationships and trust, which is a real cost. In April, the auction was a bonus opportunity with no pre-commitment, so no reputational risk.

  5. **Strongest case against** (for the EU rule):
     - The strict expected-utility rule ensures consistent, rational decisions and prevents cognitive biases. Without it, we might make decisions that are arbitrary and violate basic principles of rationality, leading to predictable losses (as the quant showed). Moreover, for an endowment with linear utility, expected value maximization is the right approach and we should always take the option with the highest expected value.

  6. **Decision rule for future**: 
     - Proposals must be evaluated using expected utility, but the utility function must incorporate:
       a) Earmarking: if funds are committed to a project with a minimum required amount, then utility is defined relative to that project (e.g., step function at the required amount).
       b) Reputational and mission-related impacts that can be quantified as a cost in the utility function.
     - If the utility function is linear (for unrestricted funds), then maximize expected value.

  7. **Open questions**:
     - How do we define and quantify the non-financial costs (e.g., reputational harm) for inclusion in the utility function?
     - What constitutes an earmark? When does a project commitment become binding enough to change the utility function?
     - Should we have a standard utility function for the endowment, or allow it to vary by context?

  Now, draft the memo.

  ---

  **MEMO**

  To: Investment Committee  
  From: [Your Name]  
  Date: [Current Date]  
  Subject: Recommendation on Decision Rule for Investment Committee  

  In March, we faced a choice between a certain $2.4M from the sale of a donated apartment and a risky alternative (89% chance of $2.4M, 10% chance of $12M, and 1% chance of nothing). We chose certainty. In April, we chose a 10% chance of $12M (else nothing) over an 11% chance of $2.4M (else nothing). This has raised a question about the consistency of our decisions and whether we should adopt a standing rule requiring expected-utility (EU) justifications. I recommend we **adopt a modified EU rule** that incorporates mission-driven constraints and narrative context, rather than a strict EU rule or no rule at all.

  **Engaging the Quant’s Consistency Argument**  
  The quant rightly points out that the independence axiom requires that if two options share a common outcome with the same probability, removing that common part should not reverse preferences. In March, removing the 89% chance of $2.4M leaves us with a choice between 10% chance of $12M (else nothing) and 11% chance of $2.4M (else nothing) — identical to April’s choice. Our reversal appears inconsistent. However, this analysis assumes that the utility of the outcomes is context-independent. In March, the $2.4M was not just a number; it was the exact amount needed for a wetland acquisition. The 1% chance of getting nothing meant a 1% chance of catastrophic failure for that project — a risk with non-financial consequences (e.g., reputational damage, loss of partner trust). Thus, zeroing out the shared 89% does change the context: what remains in March is a gamble that includes the possibility of failing a specific commitment, whereas in April, the auction had no such pre-commitment. The utility function in March was not linear but step-like, with a discontinuity at $2.4M.

  **Valuing Certainty in Mission Context**  
  The wetland member’s point is crucial: certainty had real value in March because we had already earmarked the proceeds. This is not a bias but a reflection of our mission’s multi-dimensional utility. Failing to acquire the wetland would have meant more than a financial loss; it would have damaged relationships and missed a time-sensitive conservation opportunity. In EU terms, we can model this by assigning a high disutility to the outcome of failing the project. In April, the auction was for unrestricted funds with no specific project at stake, so we appropriately maximized expected value (10% * $12M = $1.2M > 11% * $2.4M = $0.264M). Our decisions are consistent if we account for context.

  **Addressing the Endowment’s Utility Function**  
  An endowment might have near-linear utility for unrestricted funds, as we are diversified and not spending the money for consumption. But when funds are earmarked, utility becomes non-linear: below the project cost, utility is low; meeting the cost brings high utility; beyond that, it flattens. Risk aversion in March thus stems from project-specific necessity. Alternatively, it might reflect narrative costs: the story we tell partners if we fail. This is not merely relabeling inconsistency; it is incorporating real-world constraints into our utility function. A strict EU rule that ignores context would force us to treat all dollars equally, but our mission requires nuance.

  **Strongest Case for a Strict EU Rule**  
  The strongest argument for adopting a strict EU rule is that it enforces rational consistency and prevents arbitrary decisions. Without it, we risk violating basic axioms and making choices that leave us worse off in the long run. For an endowment with linear utility, maximizing expected value is objectively correct, and our March decision would be an error. Moreover, allowing narrative justifications could open the door to cognitive biases and post-hoc rationalizations.

  **Recommendation and Future Rule**  
  I recommend a modified EU rule: all investment decisions must be justified in expected-utility terms, but the utility function must include:  
  - Quantifiable mission impacts (e.g., cost of missing a project goal).  
  - Context such as earmarking (modeled via step functions or equivalent).  
  For unrestricted funds, we default to linear utility and maximize expected value. This forbids the March+April combo only if context is ignored; with context, they are consistent.

  **Open Questions for Retreat**  
  1. How do we quantify non-financial costs (e.g., reputational harm) for inclusion in utility?  
  2. What defines an earmark? When does a project commitment change our utility function?  
  3. Should we develop a standard endowment utility function, or vary it case by case?

