  2. Imagine you could trade one month of your life for a pen that is slightly nicer than the one you currently use. When you think about this offer, you (A) believe that the month of life is clearly better, and that's a fact, (B) believe that there's no way to compare them; they are in different categories, (C) believe that if the pen were valuable enough, it might be worth it, so there is a price, or (D) believe that the pen is worse, but not because it has less of some common value, but because life is in a different league — the pen is trivial.

