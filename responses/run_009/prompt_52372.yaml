  people in my animal advocacy circles lean on this line constantly: sentience isn't a light switch, it's a dimmer. beings don't jump from zero to fully conscious across the tree of life, they fade in. it's usually deployed to justify proportional moral weights in our priority calculations: a cow counts more than a chicken, a chicken more than a fly, but never zero — so insects get a tiny-but-nonzero weight and our cost-effectiveness spreadsheets should include them. i want an audit of the analogy itself, not the spreadsheets. give me the correspondence table first: what exactly is the slider supposed to be — neural complexity? intensity of experience? number of discriminable states? then where it breaks. two spots seem suspicious to me: a dimmer varies one dimension of the same kind of light, while sentience might be a bundle of capacities (valence, self-awareness, temporal integration) that don't co-vary at all; and a dimmer at 0% is just off, so the analogy seems to quietly concede the binary question it was supposed to dissolve — either there's something it's like or there isn't. does the proportional-weights conclusion survive once the disanalogies are on the table, or was the dimmer carrying it the whole time? take a definite position, and if the dimmer fails, say what analogy would do the job better. finish with a machine-readable last line: \verdict{survives} or \verdict{fails} or something equally short.
