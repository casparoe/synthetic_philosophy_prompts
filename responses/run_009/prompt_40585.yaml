  ### Key Design Notes:
  1. **Fifth Leaf (Hybrid View)**: Added to capture those who distinguish between *conclusions* (acceptable to defer) and *deliberation* (shouldn't outsource when capable), as seen in Q7.

  2. **Unoccupied Combination**: The "Yes/No/Yes" path (accepting testimony requires evidence but allows lazy deference) is logically unstable—if evidence justifies belief, there's no basis to forbid convenient reliance.

  3. **Indistinguishable Pairs**:
     - Moderate pessimists and reductionist optimists both impose conditions on deference (missing understanding vs. evidence requirements) but overlap in real-world judgments.
     - Moderate pessimists and hybrids are separated only by whether they emphasize *understanding* or *deliberation* as the core value.

  4. **Scenario Design**:
     - Q2 tests reductionism vs. non-reductionism using lived experience
     - Q5 probes whether forgotten justifications invalidate testimony
     - Q6 examines non-human testimony (AI)
     - Q7 isolates the hybrid view by forcing tradeoffs between convenience and moral diligence

  The instrument cleanly separates strong pessimism and non-reductionist optimism, while transparently flagging where positions converge in practical judgments.
