  Okay, let me approach this systematically. The user is a philosophy of science professor who co-teaches archaeology field school interpretation. Their core frustration is students (and sometimes museums) overusing "ritual" as an explanation cop-out. They need a practical, teachable decision procedure for undergrads with no stats background or lab access during fieldwork. 

  First, I need to unpack the epistemological foundations. The key issues here are:
  - Inference to Best Explanation (IBE) pitfalls: students often stop at the first plausible idea without rigor
  - Underdetermination problem: multiple interpretations can fit the same evidence
  - Analogical reasoning dangers: projecting modern/anthropological analogies without critical examination
  - Trash-can categorization: "ritual" becoming a default for unexplained phenomena
  - Function vs meaning distinction: conflating what something was used for with what it symbolized

  The decision procedure must be:
  1. Field-practical (10 min max, no tech)
  2. Gradable with clear thresholds
  3. Tiered for different claim types (functional vs symbolic)
  4. Explicit about when intuition is involved

  For the three test cases:
  - Figurine case will likely fail the procedure (user anticipates this)
  - Grinding stone should pass as functional claim
  - Bone pit will reveal where judgment calls are unavoidable

  Special attention needed on:
  - Terminating rules for "don't claim this"
  - Qualifier triggers (e.g., "possibly", "likely")
  - Explicitly marking value judgments (e.g., museum risk tolerance)

  The museum conflict prediction is crucial - I should prepare the user with concrete procedural justifications they can cite when arguing against the "fertility goddess" label. The bone pit case will demonstrate how to structure productive debate when evidence is ambiguous.

  Biggest challenge: designing steps that constrain interpretation without stifling insight. Need to balance philosophical rigor with archaeological practicality. The qualifier system ("possibly", "probably", "context suggests") may be the key compromise tool.
answer: |-
  Here's a practical decision procedure grounded in archaeological epistemology, designed for undergrads in field conditions. It focuses on **eliminating unsupported claims** and **forcing explicit justification** before interpretation. The core principles are: (1) **Function claims** require material evidence of use; (2) **Symbolic/meaning claims** require contextual or comparative evidence; (3) "Ritual" is never a default explanation.

  ---

  ### **Interpretive Claim Decision Procedure**  
  *(10-minute field version)*  
  **Ask these questions IN ORDER. Stop if any answer is "No" or "Insufficient".**

  1. **EVIDENCE ANCHOR:**  
     *"What specific, observable feature of this object/context directly supports the claim? (List physical traits, residues, spatial relationships, etc.)"*  
     - ✔️ **Sufficient:** At least **one** unambiguous physical descriptor (e.g., "red mineral residue," "exaggerated breasts," "bone cut marks").  
     - ❌ **Terminate:** Vague attributes ("looks special," "weird placement").  
     *Why:* Stops "intuition-first" interpretations. Grounds claim in data.

  2. **PLAUSIBLE ALTERNATIVES:**  
     *"What are 2-3 other *equally likely* explanations for this evidence? (Include mundane/functional options.)"*  
     - ✔️ **Sufficient:** At least one alternative is **non-symbolic/non-ritual** (e.g., "grinding stone could process grain OR ochre," "figurine could be a toy OR cult object").  
     - ❌ **Terminate:** No alternatives listed, or alternatives are straw men ("or aliens did it").  
     *Why:* Forces engagement with underdetermination. Ritual claims often fail here.

  3. **DIFFERENTIATION TEST:**  
     *"What specific evidence makes your interpretation *more likely* than the alternatives? (Prior site data? Analogies? Use-wear?)"*  
     - ✔️ **Sufficient:** Cites **comparative evidence** (e.g., "ochre residues match other confirmed ochre processors," "similar figurines in ritual contexts").  
     - ⚠️ **Qualifier Needed:** Only circumstantial evidence ("no other grinding stones here," "looks like other goddess figurines"). → Add "**possibly**" or "**tentatively**" to claim.  
     ❌ **Terminate:** Relies on "absence of alternatives" or "it just fits."  
     *Why:* Ritual/meaning claims often collapse here due to lack of positive differentiation.

  4. **CATEGORY RISK ASSESSMENT** (For symbolic/ritual claims ONLY):  
     *"Is 'ritual' or '[symbolic label]' doing actual explanatory work? Or is it a placeholder for 'unknown'?"*  
     - ✔️ **Sufficient:** Evidence specifically supports **symbolic action** (e.g., "object broken in pattern seen in known rituals," "deposit in structured placement unlike waste").  
     - ⚠️ **Qualifier Needed:** Evidence is ambiguous → Use "**ritual?**" or "**symbolic?**" with question mark.  
     ❌ **Terminate:** Label is used due to lack of functional explanation.  
     *Why:* Directly combats "ritual" as a trash-can category.

  ---

  ### **Procedure Outputs**  
  - **TERMINATE → "Don't make the claim."**  
    *(Fails Steps 1-3; claim is unsupported or indistinguishable from alternatives)*  
  - **QUALIFY → "Make claim with cautionary language."**  
    *(Passes Steps 1-3 weakly or fails Step 4; e.g., "possibly used for...", "interpreted as ritual?")*  
  - **PROCEED → "Claim is reasonably supported."**  
    *(Passes all steps with direct evidence; e.g., "used to process ochre based on residue match")*  
  - **HUMAN JUDGMENT NEEDED →** When evidence is ambiguous but context *might* support a higher-stakes claim. **Values decision:** How much risk is acceptable for public labels vs. academic write-ups?

  ---

  ### **Case Studies: Applying the Procedure**  
  ***(Key: ⚠️=Qualify, ❌=Terminate claim, ✔️=Proceed)***

  #### **1. CLAIM: "Clay figurine = fertility goddess"**  
     - **Step 1 (Evidence Anchor):** ✔️ Exaggerated breasts/genitalia.  
     - **Step 2 (Alternatives):** ✔️ Toy, teaching model, erotic art, ancestor figure.  
     - **Step 3 (Differentiation):** ❌ **TERMINATE CLAIM**  
       - *Why:* No evidence favors "goddess" over other symbolic roles (ancestor, spirit). Resemblance to "fertility goddesses" elsewhere is an unsupported analogy. "Fertility" is inferred from sexual characteristics—but these could symbolize maturity, eroticism, or lineage.  
     - **Step 4 (Category Risk):** ❌ "Goddess" is a meaning claim with zero direct evidence.  
     - **Procedure Output:** ❌ **"Don't make the claim."**  
       - *Better claim:* "Anthropomorphic figurine with emphasized sexual features, possibly ritual or symbolic."  
       - *Why you won't like this:* The procedure kills unsupported high-stakes symbolic labels. Tell the museum director: **"Without contextual evidence (e.g., figurine in shrine, associated with birthing imagery), 'fertility goddess' is an assertion, not an inference. We risk misleading the public."**  

  #### **2. CLAIM: "Grinding stone used for ochre processing"**  
     - **Step 1 (Evidence Anchor):** ✔️ Red mineral residue on stone.  
     - **Step 2 (Alternatives):** ✔️ Grinding hematite, clay, or red ochre; could be reused for multiple minerals.  
     - **Step 3 (Differentiation):** ✔️ **PROCEED** (with qualifier)  
       - *Why:* If ochre is known at the site (e.g., in pigment cache), residue matches visually, and stone has coarse texture suitable for ochre. But without lab testing, alternatives exist.  
     - **Procedure Output:** ⚠️ **"Make with qualifier: 'Likely used to process ochre or similar iron-rich minerals.'"**  
       - *No Step 4 needed:* This is a functional (not symbolic) claim.  

  #### **3. CLAIM: "Pit of bones = ritual deposit" vs "Butchery waste"**  
     - **Step 1 (Evidence Anchor):** ✔️ Disarticulated bones, some burnt, in a pit.  
     - **Step 2 (Alternatives):** ✔️ Ritual offering, butchery waste pit, scavenger den, accidental burning (e.g., hearth cleanup).  
     - **Step 3 (Differentiation):** ⚠️ **HUMAN JUDGMENT NEEDED**  
       - *Why:*  
         - **Pro-ritual:** Burnt bones *not* from hearth area; rare species; intentional arrangement.  
         - **Pro-butchery:** Cut marks match food processing; bones from common food animals; mixed with trash.  
         - *Neither side has decisive evidence.* Differentiation requires contextual knowledge (e.g., site type, period norms).  
     - **Step 4 (Category Risk):** ⚠️ Ambiguous → Ritual claim needs positive evidence of *non-utilitarian* action.  
     - **Procedure Output:** ⚠️ **"Insufficient evidence to confirm ritual. Qualify as 'possible ritual deposit?' or assign lower-risk interpretation ('food processing waste')."**  
       - **Values Decision:** Public labels should default to the *least speculative* interpretation that fits evidence ("butchery waste with unusual burning"). Academic write-ups can note ritual as a possibility if context suggests it.  

  ---

  ### **What the Procedure Can't Settle**  
  1. **Interpretive Risk Tolerance:** How bold should a museum label be? This is a **values decision** balancing education (engaging the public) vs. accuracy (avoiding misinformation). The procedure flags unsupported claims, but humans must decide acceptable risk.  
  2. **Weighting Contextual Knowledge:** If *every* nearby site has fertility shrines, the figurine claim gains plausibility—but this relies on expert familiarity, not checklist logic.  
  3. **Analogy Validity:** Deciding if an ethnographic analogy (e.g., "modern group X uses similar pits for rituals") is appropriate requires scholarly debate.  

  **Recommendation:** Train students to use this *before* writing interpretations. For museums, add a final step: *"Would this claim hold up if new evidence contradicted it?"* If not, it’s too fragile for a 10-year label. The fertility goddess? It fails the test. Fight for accuracy—you’re guarding against mythology masquerading as science.
