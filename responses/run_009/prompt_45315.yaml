  For the "origin of priors" question, the trivialization risk is real - if priors just absorb all pre-disagreement differences, CPA becomes unfalsifiable. The follow-up should force engagement with demarcation criteria. 

  On common knowledge requirements, the user correctly notes it's a major objection - I'll emphasize how rarely humans achieve common knowledge of posteriors. The follow-up should probe whether she sees CPA as primarily normative.

