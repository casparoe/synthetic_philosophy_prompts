prompt: |-
  I direct operations at a regional crisis and emotional-support hotline. Our funding comes partly from a state contract and partly from donors, both of whom want numbers; our staff are paid supervisors and volunteer responders; and the thing we actually exist for — callers leaving less desperate than they arrived — is exactly the thing we cannot measure directly. I have been reading LessWrong and the Alignment Forum for about a decade: long enough to know the difference between regressional, causal, extremal, and adversarial Goodhart, to have read the Manheim–Garrabrant elaboration of the taxonomy, and to know that the tails come apart every time a dashboard singles out our top performers. But knowing the taxonomy has never once helped me at ten in the morning on a Thursday when a board member proposes a new number.

  The decisions are constant, and mostly mine. Every quarter someone — a board member, a contract officer, a supervisor, a well-meaning data analyst — proposes adopting, changing, or attaching consequences to a metric, and I have to bless it, kill it, or redesign it, usually within days, with no one above or below me who has read any of this. Average handle time, abandonment rate, volunteer retention, successful referrals, first-call resolution, response speed on the text line: each proposal arrives looking obviously reasonable, and some of them are quietly lethal.

  Please write me a decision procedure I can run on one proposed metric in under an hour, on paper, without having to remember the taxonomy. It should list the questions in order; for each, state what a sufficient answer looks like and what a disqualifying one looks like; distinguish clearly the outcome of a plain no (never attach consequences to this) from the outcome of usable-for-monitoring-only; and mark explicitly the points at which the procedure cannot decide and a human must, so that those points do not masquerade as findings. The theory must survive the translation: I want the four Goodhart modes and the underlying structure — what a proxy is a proxy for, and how the relationship between proxy and goal breaks under optimization pressure — doing real work inside the steps rather than name-checked in a preamble, but expressed in plain words my supervisors could apply without me. And where the modes pull in different directions, resolve the tension with a definite rule rather than presenting it to me as a difficulty for further study. For example: regressional drift is everywhere and unavoidable, while adversarial pressure only begins once consequences are attached; so the procedure cannot treat this metric is imperfect and this metric determines someone's bonus as the same kind of problem — I want a rule for when a metric may be tracked despite being imperfect and when its imperfection alone disqualifies it from ever being attached to rewards, not a shrug in both directions.

  Then run the procedure, step by step and in writing, on three cases:

  1. A board member proposes giving supervisors a quarterly bonus for reducing average handle time below the network average. My guess is this should fail; I want the procedure to fail it at a specific step, for specific reasons, not by general apprehension.
  2. Our state contract officer asks us to begin reporting successful warm transfers, defined as transfers the receiving agency accepts — a number the receiving agency controls half of and we control none of. My instinct is that this is harmless because we would only be reporting it, not rewarding anyone on it. Test that instinct and say whether it survives.
  3. First-call resolution: the metric I trust most and the one our best responders are proudest of. I already suspect the procedure will tell me something here I do not want to hear — that we have let a number we cannot audit stand in for a question we never ask. Run it honestly, and if the answer is that this metric should be demoted from performance measure to open question, say exactly that.

  Two commitments I need from you. First, take positions throughout: where the procedure is silent, extend it; where two steps conflict, choose one and say why; where a case is genuinely borderline, decide it one way and give the reason, rather than returning a balanced maybe for me to mull over. Second, at the end, describe the procedure's own failure modes as candidly as the ones it diagnoses — including the most predictable one, which is that I will deploy it selectively against metrics I dislike and discover reasons to waive it for metrics I like — and state plainly what the procedure cannot do. It will not tell us whether a caller was helped. I want to know exactly where its reach ends, stated as a genuine limit and not as a humility flourish.
reasoning: |-
  We are designing a decision procedure for evaluating a proposed metric. The procedure must be executable in under an hour, on paper, without requiring recall of complex taxonomies. It must be grounded in the Goodhart problems (regressional, causal, extremal, adversarial) but expressed in plain language.

  The procedure will be a series of questions. For each question:
  - We state what a sufficient answer looks like (meaning we can proceed or the metric passes that check).
  - We state what a disqualifying answer looks like (meaning we stop and reject the metric for that reason, or at least for that use).
  - We distinguish between a metric that is rejected entirely (never attach consequences) and one that is only acceptable for monitoring (tracking without consequences).

  The procedure must resolve tensions between the Goodhart modes with definite rules.

  We'll break down the procedure into steps:

  **Step 0: Clarify the Metric and Its Proposed Use**
  - Before evaluating, we must understand exactly what the metric is and how it will be used. We write down:
    - The metric definition (what is being measured?).
    - The proposed use: monitoring only, or with consequences (e.g., bonuses, penalties, performance evaluations).
    - The target: who or what will be measured (e.g., supervisors, responders, the whole organization).

  **Step 1: Is the Metric Directly Aligned with the Ultimate Goal?**
  - **Question:** Can we confidently say that an improvement in this metric, by itself, would mean we are achieving our ultimate goal (callers leaving less desperate) more often? 
    - *Sufficient answer:* Yes, and we have evidence that the metric is a direct and necessary component of the goal. (Example: The metric is a validated measure of caller distress reduction.) 
    - *Disqualifying answer:* No, or we are uncertain. Then we note that the metric is a proxy and proceed to Step 2.
  - *Rule:* If the answer is sufficient, we mark the metric as "aligned" and skip to Step 5 (to check for other issues). Otherwise, we proceed to Step 2.

  **Step 2: What Kind of Proxy is This?**
  - **Question:** Why do we think this proxy is related to our goal? 
    - *Sufficient answer:* We have strong evidence (from research or our own data) that this metric correlates with the goal in our context. The relationship is causal (changing the metric causes goal improvement) or at least reliably correlational in the absence of manipulation.
    - *Disqualifying answer:* The relationship is assumed without evidence, or we have reason to believe the correlation might break under pressure. Then we note the risk and proceed to Step 3 to assess the risks of Goodhart problems.
  - *Rule:* If we have strong evidence, we proceed to Step 5. Otherwise, we proceed to Step 3.

  **Step 3: Assess Goodhart Risks**
  - We break down the risks into four types (without naming them). We ask four sub-questions:

    **3a: Regressional Drift (The metric is imperfect and becomes less correlated when optimized)**
    - **Question:** How stable is the relationship between the metric and the goal? If we push the metric to an extreme, will it still correlate with the goal?
      - *Sufficient answer:* We have data showing the relationship holds across the range we might push to, or we can bound the metric so we don't push into regions where it breaks.
      - *Disqualifying answer:* We know or suspect that the metric becomes decoupled at high (or low) values. Then we note that regressional drift is a risk and the metric is not safe for optimization (but may be okay for monitoring if we don't push).

    **3b: Causal (The metric is not causally linked; changing it might not change the goal)**
    - **Question:** If we directly change the metric (without cheating), will the goal improve? 
      - *Sufficient answer:* Yes, because the metric is a lever that causes the goal to change (e.g., reducing wait times causally reduces caller distress).
      - *Disqualifying answer:* We cannot establish that changing the metric causes the goal to change. Then we note that causal disconnection is a risk.

    **3c: Extremal (The metric is defined in a way that can be gamed without helping)**
    - **Question:** Can the metric be artificially increased (or decreased) without actually improving the goal? 
      - *Sufficient answer:* No, because we have safeguards against gaming (e.g., audits, multiple metrics, or the metric is hard to fake).
      - *Disqualifying answer:* Yes, easily (e.g., by redefining what counts, by avoiding hard cases, or by superficial actions). Then we note extremal risk.

    **3d: Adversarial (People might actively manipulate the metric)**
    - **Question:** If we attach consequences, will people have an incentive to manipulate the metric in ways that harm the goal?
      - *Sufficient answer:* No, because either (a) the metric is hard to manipulate, or (b) we can detect and prevent manipulation.
      - *Disqualifying answer:* Yes, and we cannot prevent it. Then we note adversarial risk.

  - *Rule:* We do not stop at Step 3. We note the risks and proceed to Step 4 to decide on the metric's use.

  **Step 4: Decision Based on Risks and Proposed Use**
  - **Question:** What is the proposed use? 
    - If **monitoring only** (no consequences): 
      - *Sufficient answer:* Even if there are risks, we can track the metric for informational purposes. We require only that the metric is not completely arbitrary (it has some plausible link to the goal). We then mark as "monitoring only".
      - *Disqualifying answer:* The metric is so arbitrary that tracking it would waste resources or mislead. Then we reject entirely.
    - If **with consequences** (bonuses, penalties, performance reviews):
      - *Sufficient answer:* The metric has no disqualifying risks from Step 3 (or the risks are mitigated) and it passed Step 2 (strong evidence). Then we mark as "acceptable for consequences".
      - *Disqualifying answer:* There is any high risk (from 3a, 3b, 3c, or 3d) that cannot be mitigated. Then we reject for consequences. However, it might be acceptable for monitoring.

  **Step 5: Check for Unintended Consequences**
  - **Question:** Even if the metric is aligned and risks are low, could focusing on it cause harm by neglecting other important aspects?
    - *Sufficient answer:* We have identified and will track counterbalance metrics to ensure a balanced view (e.g., if we optimize for speed, we also monitor quality).
    - *Disqualifying answer:* We cannot mitigate the risk of neglect, and the harm could be severe. Then we reject for consequences (but might allow monitoring).

  **Step 6: Final Decision**
  - We combine the findings:
    - If the metric is rejected at any step for the proposed use, we state that.
    - Otherwise, we approve for the proposed use (with any restrictions, like monitoring only).

  Now, we apply this procedure to the three cases.

  ---

  **Case 1: Quarterly bonus for supervisors reducing average handle time below the network average.**

  *Step 0:*
  - Metric: Average handle time (AHT) for calls.
  - Proposed use: Quarterly bonus for supervisors if they reduce AHT below the network average.
  - Target: Supervisors.

  *Step 1: Is AHT directly aligned with the goal?*
  - No. Lower AHT does not necessarily mean callers leave less desperate. In fact, rushing calls might hurt quality. So we proceed to Step 2.

  *Step 2: What kind of proxy?*
  - We might have a weak correlation: in some cases, efficient calls might be good, but long calls might be necessary for complex issues. Evidence? We don't have strong evidence that lower AHT in our context always correlates with better outcomes. So we proceed to Step 3.

  *Step 3: Assess Goodhart Risks*
    - 3a (Regressional): If we push AHT very low, the correlation with good outcomes might break (or invert). Disqualifying risk: pushing too low might harm callers.
    - 3b (Causal): Does reducing AHT cause better outcomes? Not necessarily. It might cause worse outcomes if rushed. So causal risk.
    - 3c (Extremal): Can AHT be reduced without helping? Yes, by rushing callers, cutting off, or avoiding complex calls. Extremal risk.
    - 3d (Adversarial): With a bonus, supervisors might pressure responders to end calls quickly, even when inappropriate. Adversarial risk.

  *Step 4: Proposed use is with consequences (bonus).*
  - Because of multiple risks (3a, 3b, 3c, 3d) and no mitigation, we reject for consequences.

  *Step 5: Unintended consequences?*
  - Focusing on AHT might lead to neglect of quality and caller needs. This reinforces the rejection.

  *Step 6: Final decision for Case 1:*
  - **Reject for use with consequences.** We might track AHT for monitoring (without consequences) to spot extremes, but we cannot attach bonuses.

  ---

  **Case 2: Reporting successful warm transfers (defined as transfers the receiving agency accepts).**

  *Step 0:*
  - Metric: Number of successful warm transfers (accepted by the receiving agency).
  - Proposed use: Reporting only (to the state contract officer). No consequences attached.
  - Target: The organization (or perhaps the transfer process).

  *Step 1: Is it directly aligned?*
  - Not directly. The goal is that callers get the help they need. A successful transfer is a step, but not the end goal. So proxy.

  *Step 2: What kind of proxy?*
  - We believe that a warm transfer is better than a cold one, but the acceptance by the agency doesn't guarantee the caller was helped. However, for reporting only, we don't require strong evidence. We note it's a weak proxy and proceed.

  *Step 3: Goodhart Risks?* (But note: no consequences, so risks are lower.)
    - 3a: Regressional? The number of transfers might not correlate with caller outcomes if agencies accept transfers that aren't helpful. But without consequences, drift isn't forced.
    - 3b: Causal? We control our half (making the transfer) but not whether the agency accepts. We can't cause the goal (caller helped) by this alone.
    - 3c: Extremal? We could game by only transferring easy cases, but without consequences, no incentive.
    - 3d: Adversarial? Since no consequences, no strong incentive to manipulate.

  *Step 4: Proposed use is monitoring only (reporting).*
  - We require only a plausible link. Warm transfers are intended to help, so there's a plausible link. We do not reject for monitoring.

  *Step 5: Unintended consequences?*
  - If we start reporting, might there be pressure to attach consequences later? But the procedure is for the current proposal. We note the risk but allow reporting.

  *Step 6: Final decision for Case 2:*
  - **Approve for monitoring only (reporting).**

  ---

  **Case 3: First-call resolution (FCR).**

  *Step 0:*
  - Metric: First-call resolution (the issue is resolved in the first call, without the caller needing to call back for the same issue).
  - Proposed use: Performance measure (for responders and supervisors). It is already used with consequences (implicitly or explicitly).
  - Target: Responders.

  *Step 1: Is FCR directly aligned?*
  - Partially. If a caller's issue is resolved in one call, they might leave less desperate. But not always: sometimes a follow-up is needed. And we don't measure if they leave desperate. So it's a proxy.

  *Step 2: What kind of proxy?*
  - We have trusted it and our best responders are proud of it. But we admit we have no audit: we don't ask the caller if it was truly resolved. So the evidence is anecdotal. We proceed to Step 3.

  *Step 3: Goodhart Risks*
    - 3a (Regressional): If we push FCR too high, responders might avoid complex cases or claim resolution when it's not true. So risk.
    - 3b (Causal): Does high FCR cause better outcomes? Not necessarily. Some callers might need multiple calls. So causal risk.
    - 3c (Extremal): Can FCR be gamed? Yes, by telling the caller to call back on a different line, or by avoiding callers with recurring issues. Extremal risk.
    - 3d (Adversarial): With performance pressure, responders might manipulate by discouraging callbacks or misclassifying. Adversarial risk.

  *Step 4: Proposed use is with consequences (performance measure).*
  - There are multiple risks (3a, 3c, 3d especially) and we cannot audit. Without audit, we cannot mitigate gaming. So we must reject for consequences.

  *Step 5: Unintended consequences?*
  - Focusing on FCR might lead to neglect of callers who need multiple sessions. We should track recontact rates and caller outcomes if possible.

  *Step 6: Final decision for Case 3:*
  - **Reject for use with consequences.** We demote FCR to monitoring only. We should work on a way to audit (e.g., follow-up surveys) to validate FCR.

  ---

  **Commitment 2: Describe the procedure's failure modes.**

  1. **Selective application:** You might apply it only to metrics you dislike and waive it for favorites. The procedure cannot force consistency. To mitigate, use it on every proposed metric, and document the results.

  2. **Overconfidence:** The procedure might give a false sense of security. It cannot guarantee that a metric won't cause harm, especially if risks are underestimated.

  3. **Static analysis:** The world changes, and a metric that passes today might become harmful tomorrow. The procedure does not include re-evaluation steps.

  4. **Human factors:** The questions require honest assessment. If people are overly optimistic or defensive, they might downplay risks.

  5. **Cannot measure the goal:** The procedure cannot directly tell us if a caller was helped. It can only evaluate proxies. We must accept that we are managing by proxies and remain vigilant.

  6. **Complexity:** Even simplified, the procedure has multiple steps. In practice, it might take longer than an hour for complex metrics.

  7. **Mitigation blindness:** The procedure assumes we can design effective mitigations (like audits) but doesn't check if they are feasible or implemented.

  8. **Tension between steps:** We tried to resolve with rules, but some cases might be ambiguous. Our rules are:
     - For monitoring, we allow weak proxies.
     - For consequences, we require no high risks or strong evidence and mitigation.
     - But if a risk is identified and cannot be mitigated, we reject for consequences.

  **What the procedure cannot do:**
  - It cannot create good metrics; it only evaluates proposals.
  - It cannot measure the unmeasurable (like caller distress reduction) directly.
  - It cannot replace domain expertise; we still need to understand the context.
  - It cannot prevent all Goodhart effects; it only reduces the risk.

  We hope this helps. Now, we write the procedure in a standalone form.
answer: |-
  Below is a decision procedure designed for your context. It translates the core concepts of Goodhart's Law (regressional drift, causal disconnection, extremal gaming, and adversarial pressure) into plain language, with rules to resolve tensions between them. The procedure assumes your ultimate goal is "callers leave less desperate," which is unmeasurable. It focuses on evaluating a proposed metric's suitability for either (a) **consequences** (e.g., bonuses, penalties, performance evaluations) or (b) **monitoring only** (tracking without consequences). 

  The procedure is structured as a linear checklist. For each question:
  - **Sufficient answer** means you proceed or approve the metric for the proposed use.
  - **Disqualifying answer** means you reject the metric for the proposed use (with options to downgrade to monitoring-only or reject entirely).
  - **Human judgment needed** is marked explicitly when the procedure cannot decide automatically.

  Rules to resolve tensions:
  1. **Regressional drift** (metric becomes less correlated with the goal under optimization) is always present but only disqualifies for consequences if it can't be bounded or mitigated.
  2. **Adversarial pressure** (active manipulation) only matters when consequences are attached. If a metric is for monitoring-only, adversarial risks are ignored.
  3. **Causal disconnection** (changing the metric doesn't change the goal) is critical for consequences but acceptable for monitoring.
  4. **Extremal gaming** (hitting the metric target without helping the goal) disqualifies a metric for consequences unless it can be audited or counterbalanced.

  ---

  ### Decision Procedure for a Proposed Metric  
  *(Run in order; answer each question based on your knowledge of the hotline. Use simple notes.)*

  **Step 0: Define the Proposal**  
  *Write down:*  
  - What is the metric? (e.g., "average handle time")  
  - How is it measured? (e.g., "time from call start to end, averaged weekly")  
  - What is the proposed use? (Consequences: e.g., bonus for staff. Monitoring only: e.g., reported to board with no stakes.)  
  - Who is affected? (e.g., supervisors, responders, whole organization)  
  ***If unclear, stop: Ask proposer for specifics. Do not proceed until defined.***

  **Step 1: Does This Metric Directly Represent a Caller's Outcome?**  
  *Ask: "If this metric improves, does it mean callers are clearly leaving less desperate?"*  
  - **Sufficient answer:** Yes, and we measure it directly from callers (e.g., post-call survey on desperation). → **Approve for consequences** and skip to Step 5.  
  - **Disqualifying answer:** No (it's a proxy for the goal). → Proceed to Step 2.  
  *Why?* Proxies are vulnerable to Goodhart problems. Ultimate goal is unmeasurable, so most metrics fail here.  

  **Step 2: Is There Strong Evidence Linking the Metric to the Goal?**  
  *Ask: "Do we have data or research showing that when this metric improves, callers actually get better outcomes? Is this true even at extreme values (e.g., very high or very low)?"*  
  - **Sufficient answer:** Yes, based on our historical data or credible studies, and the link holds across all realistic values. → Proceed to Step 4.  
  - **Disqualifying answer:** No, evidence is weak or only works in "normal" ranges (e.g., we’ve seen lower handle time helps only up to a point). → Proceed to Step 3.  
  *Rule:* Weak evidence alone doesn’t disqualify—it just means we must check risks.  

  **Step 3: Can Optimization Break the Link to the Goal?**  
  *Ask three sub-questions. Answer for the metric’s worst-case scenario (e.g., if pushed 20% beyond current levels).*  
  - **3a: Regressional Drift Risk:** "If we push this metric to the best possible value, will it stop correlating with caller outcomes?"  
    - *Sufficient:* No, because data shows the correlation holds even at extremes (e.g., very low handle time still helps).  
    - *Disqualifying:* Yes, because extremes harm callers (e.g., rushing calls) or the link is weak. → **Flag risk.**  
  - **3b: Causal Disconnection Risk:** "If we force this metric to improve, will it actually cause callers to leave less desperate? Or could it be coincidental?"  
    - *Sufficient:* Yes, it’s causal (e.g., shorter wait times reduce distress).  
    - *Disqualifying:* No, because other factors dominate (e.g., reducing handle time might not help if call quality drops). → **Flag risk.**  
  - **3c: Extremal Gaming Risk:** "Can people hit the target without helping callers? (e.g., by redefining success, avoiding hard cases, or superficial actions)"  
    - *Sufficient:* No, because it’s hard to game (e.g., requires deep engagement) or we audit it.  
    - *Disqualifying:* Yes, and we can’t detect or stop it (e.g., responders could hang up on long calls). → **Flag risk.**  
  ***Human judgment needed:*** If all three are sufficient, proceed to Step 4. If any risk is flagged, proceed to Step 4—risks aren’t disqualifying yet.  

  **Step 4: What’s the Proposed Use?**  
  *Ask: "Is this metric for consequences (e.g., bonuses) or monitoring only?"*  
  - **A. If monitoring only:**  
    - *Sufficient answer:* The metric has a plausible link to the goal (any evidence from Step 2 or common sense). → **Approve for monitoring only.**  
    - *Disqualifying answer:* No plausible link (e.g., it’s arbitrary like "number of call logs filed"). → **Reject entirely.** Stop.  
  - **B. If consequences:**  
    - *Sufficient answer:* No risks flagged in Step 3, OR risks are mitigated (e.g., by capping targets, audits, or counterbalance metrics). → Proceed to Step 5.  
    - *Disqualifying answer:* Any unmitigated risk from Step 3. → **Reject for consequences.** Downgrade to monitoring-only if plausible (Step 4A).  
  *Rules:*  
    - Regressional drift (Step 3a) disqualifies only if extreme values are likely and unbounded.  
    - Adversarial risk is assessed in Step 5 (only matters for consequences).  
    - Extremal gaming (Step 3c) disqualifies unless auditable.  

  **Step 5: Can People Manipulate or Sabotage the Goal?**  
  *Ask: "If we attach consequences, could staff distort the metric in ways that hurt callers? (e.g., by cherry-picking, falsifying data, or harming collaboration)"*  
  - **Sufficient answer:** No, because it’s hard to manipulate (e.g., automated tracking) or we have safeguards (e.g., random audits). → Proceed to Step 6.  
  - **Disqualifying answer:** Yes, and safeguards are infeasible (e.g., responders control the data). → **Reject for consequences.** Downgrade to monitoring-only.  
  *Rule:* Adversarial pressure starts only with consequences. Ignore this step for monitoring-only.  

  **Step 6: Will This Metric Distract from Other Goals?**  
  *Ask: "Could overfocusing here make us neglect critical areas? (e.g., speed vs. quality)"*  
  - **Sufficient answer:** No, because we pair it with counterbalance metrics (e.g., track handle time with caller feedback). → **Approve for consequences.**  
  - **Disqualifying answer:** Yes, and we can’t counterbalance (e.g., no resources to track quality). → **Reject for consequences.** Downgrade to monitoring-only.  
  ***Human judgment needed:*** If counterbalances are possible but not yet implemented, you must decide feasibility.  

  **Output:**  
  - **Approve for consequences:** Metric is safe to use with rewards/penalties.  
  - **Approve for monitoring only:** Track but never attach stakes.  
  - **Reject entirely:** Do not track (wastes resources or misleads).  

  ---

  ### Step-by-Step Application to Your Cases  
  **Case 1: Supervisor bonus for reducing average handle time (AHT) below network average.**  
  - **Step 0:** Metric = AHT (call duration average). Use = Quarterly bonus for supervisors. Affected = Supervisors.  
  - **Step 1:** Disqualifying. AHT is a proxy (shorter calls ≠ less desperation).  
  - **Step 2:** Disqualifying. Evidence is mixed; very low AHT may harm callers (e.g., rushed conversations).  
  - **Step 3:**  
    - 3a: Disqualifying. Regressional drift likely (pushing AHT too low breaks correlation with outcomes).  
    - 3b: Disqualifying. Causal link weak (reducing AHT may not cause less desperation; could hurt).  
    - 3c: Disqualifying. Extremal gaming easy (supervisors could pressure responders to end calls early).  
  - **Step 4:** Proposed use = consequences. Disqualifying due to unmitigated risks. → **Reject for consequences.**  
  - **Step 5:** (Not run; already rejected.)  
  - **Step 6:** (Not run.)  
  **Final Decision:** Reject for consequences. May track for monitoring only if bounded (e.g., "flag if AHT < 3 minutes").  
  ***Why failed:*** Step 3 (all risks flagged). Bonus amplifies regressional and adversarial risks.  

  **Case 2: Reporting successful warm transfers (accepted by receiving agency).**  
  - **Step 0:** Metric = successful warm transfers (agency accepts). Use = Reporting only (no consequences). Affected = Organization.  
  - **Step 1:** Disqualifying. Proxy (accepted transfer ≠ caller helped).  
  - **Step 2:** Sufficient. Plausible link (warm transfers improve continuity of care).  
  - **Step 3:**  
    - 3a: Disqualifying. Regressional drift possible (e.g., agencies may accept transfers for trivial cases).  
    - 3b: Disqualifying. Causal link weak (we control only half; agency actions affect outcomes).  
    - 3c: Disqualifying. Extremal gaming possible (e.g., prioritize easy transfers).  
  - **Step 4:** Proposed use = monitoring only. Sufficient (plausible link). → **Approve for monitoring only.**  
  - **Step 5:** Skipped (no consequences).  
  - **Step 6:** Skipped.  
  **Final Decision:** Approve for monitoring only. Harmless to report, but never attach consequences. Your instinct survives because risks are ignored when no stakes exist.  

  **Case 3: First-call resolution (FCR) as a performance measure.**  
  - **Step 0:** Metric = FCR (caller doesn’t callback for same issue). Use = Performance measure (consequences). Affected = Responders.  
  - **Step 1:** Disqualifying. Proxy (no callback ≠ desperation reduced).  
  - **Step 2:** Disqualifying. Evidence is weak; no audit to confirm if issue was resolved (you suspect this).  
  - **Step 3:**  
    - 3a: Disqualifying. Regressional drift likely (pushing FCR too high may discourage complex calls).  
    - 3b: Disqualifying. Causal link weak (some callers need multiple sessions; high FCR may not cause better outcomes).  
    - 3c: Disqualifying. Extremal gaming easy (responders could discourage callbacks or misclassify issues).  
  - **Step 4:** Proposed use = consequences. Disqualifying (unmitigated risks; no audit). → **Reject for consequences.**  
  - **Step 5:** Disqualifying. Adversarial risk high (responders could manipulate callbacks if rewarded).  
  - **Step 6:** Disqualifying. Distraction risk (neglects callers needing follow-up).  
  **Final Decision:** Reject for consequences. Demote to monitoring-only. Add an audit (e.g., random caller follow-ups) to make it viable later.  
  ***Hard truth:*** FCR is a vanity metric for top responders because it’s unaudited. It cannot be trusted for performance.  

  ---

  ### The Procedure’s Failure Modes and Limits  
  I commit to candor: This procedure is a heuristic, not a theorem. Its failures include:  

  1. **Selective deployment:** You (or others) will waive it for liked metrics (e.g., FCR). *Mitigation:* Apply to every proposal, document decisions, and revisit annually.  
  2. **False negatives:** It may reject safe metrics due to overcaution (e.g., if Step 3 ignores mitigations). *Mitigation:* In Step 4, require explicit risk mitigations (e.g., "cap targets at X").  
  3. **False positives:** It may approve harmful metrics if risks are underestimated (e.g., assuming "audits will catch gaming" without feasibility checks). *Mitigation:* In Steps 3c and 5, demand evidence that safeguards work.  
  4. **Static analysis:** It assumes today’s context. Shifts in caller needs, staff behavior, or donor demands may break it. *Limit:* It cannot predict future Goodhart effects. Re-run the procedure if context changes.  
  5. **Human bias:** Steps 2–3 rely on honest self-assessment. Optimism may downplay risks. *Limit:* It cannot compensate for bad-faith input.  
  6. **Overhead:** Complex metrics (e.g., multi-part indices) may exceed the 1-hour limit. *Mitigation:* Focus on key risks; defer to human judgment if stuck.  
  7. **Unmeasurable goal:** The procedure cannot resolve the core problem: **It will never tell you if a caller was helped.** It only evaluates proxies. *Limit:* Use qualitative checks (e.g., caller stories) to ground decisions.  
  8. **Tension resolution flaws:** The rules prioritize avoiding harm over potential gains. This may stifle innovation (e.g., rejecting all high-risk metrics). *Mitigation:* For monitoring-only, allow experimentation.  

  **Where it ends:**  
  - **Reach:** It only judges if a metric is safe to use, not if it’s "true" or "good." It cannot:  
    - Measure the unmeasurable (caller desperation).  
    - Replace wisdom (e.g., when to ignore metrics).  
    - Solve systemic issues (e.g., underfunding that forces bad metrics).  
  - **Boundary:** The procedure fails when the goal itself is contested (e.g., "is reducing desperation even the right aim?"). It assumes goal alignment.  

  This reflects reality: You manage proxies because the truth is inaccessible. The procedure’s job is to stop proxies from becoming enemies. Use it as a "circuit breaker," not a philosopher.
