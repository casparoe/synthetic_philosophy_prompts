answer: |-
  Your observation hits upon a fundamental tension in labour law across liberal democracies. The pattern you describe – protecting the *principle* of striking while meticulously constraining its *practice*, especially its most potent forms – does indeed point to an underlying, often unstated, legal and political theory. Here's a reconstruction of that presupposed view, the areas where it's underdetermined, and the concrete changes a "political speech" theory would demand:

  **The Dominant Presupposed Theory: The Strike as a Regulated Economic Pressure Valve within Industrial Pluralism**

  The prevailing, implicit theory embedded in these restrictive laws views the strike primarily as:

  1.  **A Necessary (but Aberrant) Economic Tactic:** Striking isn't seen as a fundamental, inherent exercise of liberty like free speech or assembly. Instead, it's treated as a necessary, *tolerated* exception to the normal rules of contract (employment) and market operation, required to correct imbalances in bargaining power between employers and employees *within the existing economic system*.
  2.  **Focused on Specific Bargaining Units:** The legitimacy of a strike derives almost exclusively from a direct dispute between identified workers (the bargaining unit) and their immediate employer over specific terms and conditions of employment (wages, hours, safety). This creates the "proximate cause" justification.
  3.  **Balancing Rights with Economic/Social Stability:** The core purpose of regulation is to *balance* the workers' right to withdraw labour *against*:
      *   **Employer Property Rights & Continuity:** Minimising disruption to business operations and investment.
      *   **Third-Party/Public Interest:** Preventing widespread economic chaos and protecting the public from undue hardship, especially regarding essential services.
      *   **Internal Union Democracy:** Ensuring the strike genuinely reflects the will of the workers affected (hence ballots).
      *   **Orderly Collective Bargaining:** Framing the strike as the ultimate, but contained, tool within a state-supervised system of negotiation and dispute resolution (arbitration, labour boards).
  4.  **Containing Solidarity as "External" Coercion:** Solidarity/sympathy strikes are problematic under this view because they:
      *   Lack the "proximate cause" – the secondary workers don't have a direct dispute with *their* employer.
      *   Are seen as imposing excessive, potentially uncontrollable, economic pressure beyond the specific bargaining relationship, disrupting unrelated businesses and supply chains ("chain reaction" fear).
      *   Risk escalating conflicts beyond the state's capacity to manage or mediate within the intended industrial relations framework.
  5.  **Treating Essential Services Differently:** Here, the "public interest" element overwhelmingly tips the scale. The potential societal harm (paralysed transport, untreated patients) is deemed so severe that the economic pressure valve function of striking is either removed entirely or replaced with a state-managed alternative (compulsory arbitration), prioritising continuity of essential functions above the workers' leverage in those sectors.
  6.  **"Permanent Replacements" (US Specific):** This fits the "regulated exception" model. The strike is tolerated as a temporary withdrawal of labour, but the employer's fundamental right to operate its business and hire labour to do so is preserved. The "half-protection" (no firing, but replacement) reflects the tension: acknowledging the *act* of striking shouldn't be penalised *as dismissal*, but refusing to guarantee the striker *their specific job* if the business finds a way to function without them during the dispute. It heavily tips the balance towards employer continuity.

  **Underdetermined Aspects (Where Multiple Theories *Could* Lead to Similar Rules):**

  1.  **Ballot Requirements:** While easily justified under the "industrial pluralism/regulated valve" theory (ensuring mandate, preventing minority tyranny), a "political speech" theory *could* also support *some* form of democratic authorisation for collective action representing a group. However, the administrative burden, state scrutiny, and high thresholds often seen go *beyond* what's typically required for political assemblies or petitions.
  2.  **Essential Services Restrictions:** Almost any theory of strikes would likely acknowledge *some* need for maintaining critical life/safety functions. The *political speech* theory might demand far narrower definitions ("essential" only meaning immediate threat to life/limb, not mere inconvenience) and require robust, impartial arbitration with real worker input as the *quid pro quo* for the restriction. The *existence* of restrictions isn't underdetermined; their *scope and the adequacy of alternatives* are.
  3.  **The Distinction Between Protected/Unprotected Strikes:** Most systems have this. The *industrial pluralism* theory uses it to channel action into predictable forms. A *breach of contract* theory might see *all* strikes as unprotected breaches but tolerate some. A *political speech* theory would struggle with the concept of "unprotected" strikes unless they involved violence or extreme coercion tangential to the speech act itself.

  **The "Political Speech" Theory: Concrete Changes If Adopted**

  If a country fundamentally reconceived the strike as an exercise of political speech and assembly – a collective expression of grievance, solidarity, and demand for justice within the economic sphere, akin to a protest march or petition – the legal landscape would require radical transformation:

  1.  **Abolition of Solidarity/Sympathy Strike Bans:** This would be the most significant change. Preventing workers from striking in support of others' disputes would be viewed as a prior restraint on political expression and association, akin to banning protests supporting a foreign cause or another group's domestic struggle. The "external coercion" argument would hold far less weight against the core political right.
  2.  **Radical Reform or Abolition of Ballot Requirements:** While internal union democracy might be valued, state-supervised ballots with turnout thresholds and procedural hurdles would likely be seen as unacceptable burdens on the exercise of a fundamental political right. Requiring a government-approved ballot before holding a protest march would be unthinkable; similarly for strikes. Authorisation might remain a matter for union rules, not state law with penal consequences for non-compliance.
  3.  **Fundamental Shift on Essential Services:** Restrictions would face *strict scrutiny*:
      *   "Essential" would be defined extremely narrowly (likely only immediate, direct, life-threatening situations – e.g., emergency surgery coverage, not all hospital porters; air traffic control, not all railway staff).
      *   Blanket bans would be unconstitutional. The focus would shift to requiring *minimum service levels* negotiated in good faith or set by truly independent bodies, with the *right to strike otherwise remaining intact*.
      *   Compulsory arbitration would only be acceptable as a last resort for narrowly defined essential services, and its outcomes would need strong safeguards against being biased towards the status quo or employer interests. The default assumption would be that the right to strike applies.
  4.  **Elimination of Permanent Replacements (US) & Stronger Reinstatement Rights:** Firing or permanently replacing strikers would be seen as punishing them for exercising a fundamental political right – directly analogous to firing someone for attending a lawful protest. Robust legal guarantees of reinstatement to their *original* (or equivalent) position after the strike concludes would be essential.
  5.  **Broader Definition of "Labour Dispute":** The justification for striking could extend beyond immediate terms and conditions of employment for the specific bargaining unit. Strikes related to broader social justice issues, corporate ethics, government policy affecting workers, or in solidarity with other struggles could gain protected status as political expression.
  6.  **Reduced Role for Labour Boards in Authorising Strikes:** The focus of state bodies would shift dramatically from *regulating permission to strike* towards enforcing protections *against retaliation* for striking and mediating disputes only when requested by the parties, rather than acting as gatekeepers.

  **In essence:** The current restrictive pattern presupposes strikes are a dangerous but necessary economic tool that must be carefully fenced in to protect the wider system's stability and property rights. Treating strikes as political speech presupposes they are a fundamental expression of democratic voice and collective agency in the workplace, where restrictions require overwhelming justification akin to limiting other core civil liberties. Moving to the latter theory wouldn't eliminate *all* regulation, but it would dismantle the core mechanisms designed to blunt the strike's sharpest edges, particularly solidarity and leverage in critical sectors, viewing them not as prudent safeguards but as impermissible suppressions of fundamental rights. The practice reveals a deep-seated commitment to managing labour conflict within tightly controlled economic parameters, not unleashing it as a form of democratic expression.
