prompt: |-
  Science journalist here -- I mostly write about animal behavior and cognition, and there's a question I keep failing to google my way out of. Every book about wasps or insect intelligence trots out the old story of the digger wasp: she drags her paralyzed prey to the burrow entrance, leaves it there, goes inside to inspect the burrow, comes back out, and pulls the prey in. But if you nudge the prey a few inches away while she's inside, she comes out, drags it back to the entrance... and does the whole inspection routine again before pulling it in. You can apparently repeat this many times and she never catches on. Some French naturalist noticed this back in the 1800s (Fabre, I think? It's been a while since I read the original anecdote). The standard takeaway is "insects are wind-up toys."

  Here's my actual question: I keep noticing what looks like the same shape of behavior in humans, and I can't find a word for the human version. Instances I've seen: my dad checking the stove before leaving -- three knobs, always left to right -- and if you speak to him mid-check he goes back to the first knob and starts over, he doesn't just resume where he left off. A colleague whose leaving-the-house routine is keys, wallet, phone, patted in exactly that order, and if you hand him his keys while he's mid-pat-down he begins the whole pat-down again from the top. And the one that really spooked me: me, on a trail I've hiked dozens of times, taking the old fork instead of the rerouted one becuase in that moment the "keep walking straight" program just ran and nothing in me registered that the trail had changed.

  So is there an established term for this in humans? It doesn't seem to be just habit, because habits usually flex when circumstances change -- the defining feature of this thing, at least as I've been describing it to myself, is that a small perturbation makes it re-run from the start rather than adapt. It doesn't look like OCD either, as far as I can tell: no distress attached, these are all functional people. And I have a vague memory that philosophers got real mileage out of that wasp at some point -- something about the difference between a system that merely executes and one that can notice it's executing? If there's a term, I want to know what it is, what exactly it's supposed to cover and not cover, and whether anyone thinks the human cases matter for anything bigger -- free will, conciousness, where you draw the mind/machine line. I'd rather not just get a name thrown at me; I want to know what the phenomenon actually is and where its edges are.
reasoning: |-
  Okay, the user is a science journalist specializing in animal behavior and cognition. They're stuck on this digger wasp anecdote that's often used to illustrate insect stupidity, but they've noticed similar patterns in humans and can't find the right term for it. They want to know if there's an established concept for this in humans, what it covers, and its implications for free will or consciousness.

  First, I need to recall the digger wasp example. Fabre's experiment shows the wasp's fixed sequence: inspect burrow, move prey. If interrupted, it restarts the whole sequence. The user sees parallels in human behaviors like their dad checking stove knobs in order and restarting if interrupted, or their colleague's pat-down routine. The key point is the restart rather than adapting to the interruption.

  The user mentioned it's not just habit because habits can adapt. It's not OCD since there's no distress. They also hinted at philosophical implications about automatic vs. conscious systems. So, I need terms that capture rigid, automatic sequences in humans.

  Possible terms come to mind: "Fixed Action Pattern" (FAP) from ethology, but that's usually for animals. In humans, it might be "motor program" or "habit script." "Procedural memory" is another angle, where skills become automatic but inflexible. "Chunking" as in grouping actions into a single unit, but that doesn't explain restarting. "Goal neglect" or "capture errors" might relate but aren't exact.

  The user probably needs a term that bridges animal and human behavior, showing the mechanistic similarities. They might be looking for a concept that challenges the human exceptionalism in cognition. Also, deeper needs: understanding if this behavior undermines free will or consciousness, and how automaticity plays a role in daily life without pathology.

  I should check cognitive psychology sources. Terms like "closed-loop vs. open-loop control" might fit—where the sequence runs without feedback. Or "automaticity" in skill execution, where interruptions cause restart because the sequence is a single chunk. "Action disorganization syndrome" is clinical, not common. "Habit strength" from behaviorism, but maybe outdated.

  Philosophical angle: Dennett's "sphexishness" or "competence without comprehension." This ties back to the wasp example. The user wants to highlight that humans have similar automatic behaviors, suggesting that higher cognition isn't always involved.

  Also, considering the examples: the dad restarting stove check, colleague's pat-down, user's trail mistake. These are routine, overlearned actions where attention isn't engaged. When interrupted, the cognitive system defaults to restarting the sequence because monitoring isn't active. So terms like "attentional capture" or "slip of action" from Norman's error classification.

  Need to ensure the term isn't pathologizing. Since the users are functional, terms like OCD or compulsions don't fit. Emphasize normal cognitive processes. "Procedural sequence" or "automated routine" might work, but are there established terms?

  The user mentioned philosophers using the wasp. Dennett and Hofstadter's "sphexish" as a metaphor for deterministic systems. Highlighting that humans aren't exempt. So the term might be "sphexishness" itself, applied metaphorically to humans.

  Also, in cognitive science, "subpersonal processes" or "zombie systems" (Kahneman's System 1). This relates to dual-process theory. The behavior is a System 1 response—fast, automatic, inflexible.

  To cover all bases: the term should capture the rigidity, restart on interruption, and lack of higher-order monitoring. "Fixed sequence automaticity"? But that's not standard. Maybe "procedural reinstatement" or "sequence reset."

  I think the best bet is to frame it as "automated motor programs" with properties similar to FAPs, acknowledged in human skill literature. Use terms like "chunked action sequences" or "ballistic execution." Cite Norman's "slips" for errors like taking the wrong trail.

  Also, mention that this doesn't negate free will but shows layers of cognition. Human flexibility comes from being able to override, but interruptions sometimes prevent that.

  So, the core phenomenon is overlearned sequences running to completion without online monitoring. Terms: fixed action pattern (with caveats), automaticity, chunking, slips (capture errors). Philosophical term: sphexishness. Emphasize that this is normal and functional, not pathological.
answer: |-
  This is a brilliantly observed connection, and you're absolutely right—this "restart phenomenon" bridges insect and human cognition in a way that's deeply revealing. While there's no single universally agreed-upon term for the *specific* "restart-on-perturbation" aspect in humans, the phenomenon you're describing sits squarely at the intersection of several well-established concepts in cognitive science, neuroscience, and philosophy. Let's break it down:

  ### Core Phenomenon & Key Concepts
  1.  **The Underlying Mechanism: Procedural Memory & Automaticity:**
      *   **Definition:** This refers to the memory system responsible for knowing *how* to do things (skills, habits, routines). When a sequence of actions (like checking stove knobs, patting pockets, walking a familiar trail) is **overlearned** through massive repetition, it becomes **automatized**.
      *   **Why it runs:** Automatized sequences are executed as single, integrated units ("chunks" or "motor programs") by subcortical brain structures (like the basal ganglia and cerebellum), requiring minimal conscious attention or working memory resources. This is highly efficient for routine tasks.
      *   **The Restart Trigger:** An unexpected interruption (a noise, a question, the trail changing) disrupts the smooth execution. Crucially, this disruption often occurs *before* the sequence's internal "completion signal" is generated. Because the sequence is stored and executed as a single unit, the brain doesn't inherently know *where* it was interrupted within the sequence. The safest, most reliable error-correction strategy programmed into these systems is often **complete re-initiation**.

  2.  **The Specific "Restart" Feature: Ballistic Execution & Open-Loop Control:**
      *   **Definition:** Highly automatized sequences often run in a **ballistic** manner – once triggered, they tend to run to completion without constant sensory feedback (open-loop control), especially if the environment is predictable and the sequence is short.
      *   **The Fabre/Wasp/Human Parallel:** The wasp's inspection routine and your human examples are likely ballistic motor programs. The trigger is the context (arriving at the burrow/leaving the house/reaching the trail fork). The program runs its predefined steps. An interruption *during* execution doesn't provide feedback the system is designed to incorporate mid-flow; it simply aborts the current run. When the context is still present (prey at burrow/dad still needs to leave/you're still hiking), the program triggers again from the start.
      *   **Why not adapt?** Adapting mid-sequence requires:
          1.  **Online Monitoring:** Actively maintaining the sequence's state in working memory.
          2.  **Error Detection:** Recognizing the interruption specifically disrupted step X.
          3.  **Error Correction:** Calculating and executing only the remaining steps (Y and Z).
      *   For deeply ingrained routines, the cost (cognitive resources) of maintaining online monitoring often outweighs the benefit, so the system defaults to the cheaper strategy: restart. The *expectation* is usually that the environment hasn't changed, so restarting is efficient.

  3.  **Related Concepts & Why They Fit (or Don't Quite):**
      *   **Fixed Action Pattern (FAP):** This *is* the ethological term for the wasp's behavior – a species-specific, instinctive, highly stereotyped sequence triggered by a specific stimulus (Sign Stimulus/Releaser), that runs to completion and is resistant to modification once started. **Application to Humans:** While human routines *aren't* instinctive FAPs in the strict biological sense, **highly overlearned, context-triggered, ballistic sequences in humans exhibit strong FAP-*like* properties**, including the restart phenomenon. Calling human routines "FAPs" is metaphorical but captures the rigid, automatic nature well. Philosophers like Daniel Dennett explicitly use the wasp (and "sphexishness") to argue humans have similar mechanistic layers.
      *   **Chunking:** This is the cognitive process of grouping individual actions or items into a single unit. The whole routine (knob-check, pocket-pat) becomes one "chunk." An interruption breaks the chunk, forcing its re-initiation.
      *   **Slips (Capture Errors):** When you took the old trail, that's a classic **slip** or **capture error** (in Donald Norman's classification). A highly practiced action sequence ("walk straight") is triggered inappropriately because the initial steps match the context, and the newer, less-practiced routine ("veer right") isn't activated strongly enough to override it. The restart phenomenon often occurs *after* such a slip or other interruption disrupts a *correctly* triggered sequence.
      *   **Goal Neglect:** Sometimes, the interruption causes a brief lapse in holding the overall *goal* ("leave safely") actively in mind. Restarting the routine is a way to reliably re-engage with the goal.
      *   **Attentional Blink / Inattentional Blindness:** The trail change might not have registered because your attention was focused elsewhere (internal thoughts, scenery), and the change wasn't salient enough to break through the automatic pilot mode.
      *   **Why it's NOT just "Habit":** Habit is the broader category. The restart phenomenon is a specific *consequence* or *feature* of certain highly automatized, ballistic habits operating under interruption. Many habits *are* flexible; this highlights the subset that are rigidly sequenced.
      *   **Why it's NOT OCD:** You're correct. OCD involves intrusive thoughts, anxiety, and compulsive behaviors performed explicitly to reduce distress or prevent a feared outcome. The routines you describe are functional, non-distressing efficiency mechanisms, lacking the obsessional component.

  ### The Philosophical Angle: Sphexishness, Zombies, and Layers of Mind
  *   **Sphexishness:** This is the term coined by philosophers (notably Douglas Hofstadter and Daniel Dennett) directly inspired by Fabre's wasp. It denotes a system that rigidly executes a predetermined sequence in response to a trigger, with no apparent capacity for reflection, learning from the immediate context, or true comprehension. **This is the most direct conceptual term for the phenomenon you're describing across species.** Dennett uses it to argue that much human cognition also operates via "sphexish" subpersonal mechanisms. We *feel* conscious and in control, but underneath, layers of automaticity are humming along.
  *   **Dennett's Multiple Drafts Model / "Competence without Comprehension":** Dennett argues consciousness isn't a single unified control center. Instead, various parallel processes ("drafts") compete for influence. Highly automatized routines are executed with competence but without ongoing conscious comprehension *of the execution itself*. The restart occurs because the "comprehending" layer wasn't actively monitoring that specific draft when it was interrupted.
  *   **The "Zombie" Systems (Kahneman's System 1):** In dual-process theories (like Daniel Kahneman's System 1 / System 2), this behavior is classic **System 1**: fast, automatic, effortless, associative, and often inflexible. It contrasts with **System 2**: slow, effortful, conscious, rule-based, and flexible. The restart happens because System 2 wasn't engaged to override or adapt the System 1 program when it was disrupted.
  *   **Free Will & The Mind/Machine Line:** This phenomenon is potent ammunition for philosophers (like Dennett, but also earlier materialists) who argue against a simplistic "ghost in the machine" view of free will. It demonstrates that significant chunks of sophisticated human behavior are mechanistic, predictable, and run on "autopilot" much like the wasp's program. It suggests consciousness and "free will" (if defined as contra-causal freedom) aren't required for complex, functional behavior. However, defenders of free will (often compatibilists like Dennett himself) argue this doesn't eliminate free will; it just shows it operates *on top of* and *by modulating* these underlying mechanisms. Our capacity to *sometimes* notice the interruption, reflect ("Why am I checking that knob again?"), and *choose* to override the restart sequence is where higher-order cognition and potential freedom reside. The line between mind and machine blurs – we *are* machines, but machines capable of reflection, learning, and self-modification far beyond the wasp.

  ### The Term(s) to Use & Implications
  *   **For Precision in Your Writing:** Describe it as **"the ballistic restart of automatized procedural sequences"** or **"sphexishness in human routine behavior."** You can note it arises from **highly overlearned motor programs running in open-loop mode**.
  *   **For Broader Impact:**
      *   **Sphexishness** is the evocative, cross-species philosophical term. It directly links the wasp to the human and carries the conceptual weight of mechanistic determinism vs. consciousness.
      *   **Automaticity with Ballistic Execution** is the core cognitive science description.
      *   **System 1 Dominance / Slip** covers the specific error cases like the trail.
  *   **Why Human Cases Matter:**
      1.  **Demystifying Cognition:** They show that complex, functional, *apparently* purposeful behavior can emerge from relatively simple, mechanistic processes, challenging notions of human exceptionalism at the basic operational level.
      2.  **Efficiency vs. Fragility:** They highlight the trade-off inherent in efficient cognition. Automation frees up resources but makes us vulnerable to errors and rigidities when the environment unexpectedly changes or we're interrupted.
      3.  **Layered Mind:** They provide concrete examples supporting models of the mind as layered, with conscious control operating intermittently on top of a vast substrate of unconscious, automatic processes.
      4.  **Real-World Design & Safety:** Understanding this helps design better interfaces (e.g., preventing errors in aviation or medicine where interruptions are common), safer environments (e.g., trail rerouting needs clear, salient cues), and strategies for self-management (e.g., minimizing interruptions during critical sequences or building in explicit checkpoints).
      5.  **Philosophical Grounding:** They provide empirical weight to philosophical arguments about determinism, consciousness, and the nature of agency. We are not *constantly* conscious directors; much of our behavior runs on rails we laid down long ago.

  The beauty of your observation is that it takes a classic animal behavior anecdote, often used dismissively ("just an instinct"), and reveals its profound relevance to understanding the very nature of human cognition, agency, and the sometimes blurry line between efficient automation and oblivious rigidity. The wasp isn't just a curiosity; it's a mirror reflecting a fundamental aspect of how *all* brains, including ours, operate a significant portion of the time.
