prompt: |-
  My partner and I have been in the effective altruist-adjacent world since college — we took the giving pledge, read the cost-effectiveness reports every year, the whole thing. Now the topic has suddenly stopped being abstract for me, because I'm sitting on two job offers and they pull in opposite directions. Offer one: a quant firm. Pays absurdly well, and if I took it and donated half my salary to the top-rated global health charities, the "lives saved per year" math is genuinely hard to argue with — the donations would plausibly fund on the order of a hundred additional malaria nets or treatments a year, possibly more. Offer two: a policy job at the state housing agency where I'd be working on tenant protections, rent stabilization rules, stuff like that. It pays maybe a third as much, and here's the thing — I can't tell you how many people it helps. Nobody can. There's no spreadsheet. My EA friends are pretty unified: take the quant job, the housing work is the kind of thing where you tell yourself a story about "systemic change" and ten years later nothing measurable happened. My friends from outside the EA bubble think that whole attitude is a bit deranged — they say the reason there's a housing crisis at all is political, that the measurable stuff is just what's easy to count, and that "I'll fix the symptoms on my own dime while the machine keeps producing them" is a weird place to land morally.

  I keep going back and forth and I've noticed my disagreement with my EA friends isn't about the arithmetic — on the arithmetic they win hands down, and I accept that. My unease is about something like: why does the housing job feel like it could be the more important one even though no metric would ever say so? Is there actually a principled version of that feeling, or is it just romanticism — me wanting to feel like a person who does direct work rather than a checkbook? One of my friends put it in a way that stuck with me: she said the question isn't "which does more good" but "which good are we even counting," and that we systematically count the kinds of good that look like charity and not the kinds that look like the absence of a crisis. I don't fully know what to do with that.

  So I guess what I'm asking is: help me think this through. Is there a real distinction here between doing measurable good and contributing to something structural, or is that distinction just a rationalization people use to avoid the demanding math? And if the distinction is real, how should someone in my position actually weigh it — is it enough to tip the scales away from the quant job, or does the sheer size of the donation gap swamp everything else? I'd appriciate if you didn't just tell me to follow my heart, and also didn't just re-run the numbers at me — I've done both with friends already and it went nowhere.
reasoning: |-
  Okay, let's start by really understanding the user's dilemma. They're torn between two job offers: one as a quant with high salary enabling significant donations, and another in housing policy with less measurable impact. The EA community pushes the quant role for its clear, quantifiable benefits, but the user feels uneasy, suspecting the policy job might address deeper systemic issues even if it's not easily measurable.

  First, I need to unpack why the housing job feels important despite lacking metrics. The user mentions their friend's point about "which good we're counting." That's crucial. EA focuses on tangible outcomes like lives saved via malaria nets, but systemic change in housing could prevent countless issues—homelessness, health problems, economic instability. These are harder to attribute directly to one policy job. So the distinction between measurable and structural impact is real, not just a rationalization.

  Next, considering counterfactuals. In the quant role, their donations add resources but might not change underlying systems. In policy, their unique skills could influence decisions that affect thousands, especially if they're replacing someone less effective. But how to assess that? Maybe look at the agency's track record or potential policy windows. Also, the user's fit—passion and skills in policy might lead to greater long-term impact through career capital, whereas the quant job could risk burnout if unfulfilling.

  Weighing the donation gap is tough. A hundred malaria nets per year is significant, but systemic change has multiplicative effects. For example, tenant protections could prevent hundreds from becoming homeless, which in turn avoids downstream costs in healthcare and social services. However, this requires probabilistic thinking—assigning rough odds to different outcomes. If the policy role has even a small chance of major reform, its expected value might rival direct donations.

  The user also needs to consider personal factors. Impact isn't just about output; sustainability matters. If they thrive in the policy role, they might contribute more over decades. Conversely, the quant job's high salary offers flexibility—funding advocacy later or pivoting to direct work. But if they dislike finance, their impact could diminish over time.

  Finally, synthesizing these points without prescribing. Highlighting the legitimacy of both paths, emphasizing that choosing policy isn't anti-EA but a different bet on systemic change. Suggesting concrete factors like leverage in the agency, windows of opportunity, and personal fit. Encouraging them to estimate expected value with ranges, acknowledging uncertainty. Ultimately, validating their unease as a recognition of EA's current limitations in measuring structural impact.
answer: |-
  This is an exceptionally clear articulation of a core tension in modern EA thinking. Your unease isn't romanticism – it points to legitimate limitations in how we currently measure impact and conceptualize "doing good." Let's break down the distinctions and how to weigh them:

  **1. The Real Distinction: Measurable vs. Structural Good (And Why It Matters)**

  *   **Measurable Good (Quant Job Path):** This excels at **direct, attributable, near-term, quantifiable outputs.** You fund X nets, saving Y lives (with statistical confidence). The causal chain is relatively short and clear. EA methodologies are *optimized* for this type of intervention. The impact is **individual** (specific lives saved/improved) and **additive** (your donation adds resources to an existing, effective pipeline).
  *   **Structural Good (Policy Job Path):** This aims for **system-level, preventative, long-term, often non-attributable change.** Your goal isn't to treat the symptom (malaria) with resources, but to change the conditions creating the problem (unstable housing leading to cascading crises). The impact is:
      *   **Preventative:** Stopping harm *before* it happens (eviction prevention avoids homelessness, health crises, job loss).
      *   **Multiplicative:** A single policy change can affect thousands or millions continuously, year after year.
      *   **Non-Attributable:** Your *specific* contribution is almost impossible to isolate within the complex machinery of government, politics, and implementation. Did *your* analysis tip the scale? Maybe. Maybe not.
      *   **Counterfactual-Dependent:** The real question is: "What happens *because I specifically am in this role* compared to the next likely candidate?" This is inherently speculative.
      *   **Focuses on "Absence of Crisis":** As your friend astutely noted, success here looks like *less* homelessness, *fewer* preventable illnesses linked to housing insecurity, *reduced* economic instability in communities. We're bad at measuring the good that *didn't* happen because we prevented it.

  **Why the Distinction is Real & Not Just Rationalization:** Systemic problems (like housing crises) *are* fundamentally political and structural. Treating symptoms (via charity) is necessary but insufficient if the root causes persist and keep generating suffering. Ignoring structural change because it's hard to measure risks perpetuating a cycle where we efficiently mop the floor while the leaky faucet (the system) keeps overflowing. Your feeling that the housing job *could* be more important reflects an understanding that fixing the faucet *might* prevent far more water damage long-term, even if you can't precisely calculate the gallons saved per hour of your labor.

  **2. Weighing the Distinction Against the "Donation Gap"**

  This is the crux. The quant job offers *guaranteed*, massive, measurable good. The policy job offers *potential*, large-scale, structural good with high uncertainty. How to compare?

  *   **Frame it as Expected Value (EV) Under Uncertainty:** EA excels at EV calculations. Apply it here, but embrace the uncertainty.
      *   **Quant EV:** `(Very High Salary) * (High Certainty of Donation Effectiveness) * (Known Impact per Dollar)` = **Very High EV (Quantifiable)**
      *   **Policy EV:** `(Moderate Salary) * (Low/Unknown Certainty of *Your* Specific Impact) * (Potentially Enormous Scale of Systemic Change *if* Successful)` = **Highly Uncertain EV (Could be Low, Could be Astronomical)**
      *   **The Challenge:** Assigning probabilities and magnitudes to the policy path is incredibly hard. This is where your specific context matters intensely.

  *   **Key Factors to Investigate for the Policy Path (Mitigating Uncertainty):**
      *   **Leverage:** What *specific* decisions will you influence? Will you be drafting regulations, advising senior officials, analyzing data for key votes? How close is the role to actual levers of power? A junior analyst has less leverage than a senior policy advisor.
      *   **Window of Opportunity:** Is there political momentum for housing reform *right now*? Are there active bills, crises, or leadership pushing change? A role during a "policy window" has vastly higher potential impact than during stagnation.
      *   **Counterfactual:** Who would likely get the job if you refuse? Is it someone equally skilled and motivated? Someone less effective? Someone actively opposed to tenant protections? Your *marginal* impact depends heavily on the alternative.
      *   **Skill Fit:** Are your skills (analytical rigor, persuasion, understanding complex systems) *uniquely* suited to make a difference *in this specific role*? Will you be more effective than the average applicant?
      *   **Pathways:** Could this role be a stepping stone to positions of even greater influence later (e.g., federal policy, running an agency, elected office)? Building "career capital" in policy has long-term EV.
      *   **"Swinginess":** Are you working on a policy where a small effort *could* tip the balance (e.g., a key vote, crucial analysis)? Or is it a massive, slow-moving boulder?
      *   **Robustness:** Even if the *big* systemic change doesn't happen, could you achieve smaller, meaningful wins (e.g., improving implementation of existing rules, protecting specific vulnerable groups)?

  *   **Weighing Against the Quant Donations:**
      *   **Does the *potential* EV of the policy job plausibly rival the *guaranteed* EV of the quant donations?** This is the million-dollar (literally) question. You must make a *judgment call* based on your investigation of the factors above.
      *   **Consider Scale & Durability:** If successful, structural change helps *everyone* in the affected system *for years*. A single successful policy preventing thousands of evictions over a decade might dwarf the annual impact of your quant donations, even considering compounding. But the probability of that level of success might be low.
      *   **The "Risk Premium" of Measurability:** The quant path offers certainty. The policy path offers uncertainty with potentially higher upside. How much of a premium are you willing to pay (in terms of foregone measurable good) for that shot at systemic impact? EA often undervalues this upside potential due to measurement difficulty.

  **3. Addressing the Core Tension in EA Thinking**

  Your friend is right: "Which good are we counting?" EA's current strength is counting discrete, charitable interventions. It struggles with:

  *   **Preventative Impact:** Measuring harm avoided.
  *   **Power Dynamics:** Changing who makes decisions and what incentives they face.
  *   **Institutional Reform:** Making systems function better or more justly.
  *   **Non-Linear Change:** Small efforts triggering large shifts (tipping points).
  *   **Long-Term, Diffuse Benefits:** Impacts unfolding over decades across populations.

  **Choosing the policy path isn't "anti-EA"; it's betting that the *expected value* of tackling a root cause systemically, despite measurement challenges, could be higher than the clear, quantifiable good of treating symptoms.** It's acknowledging that some of the most significant levers for reducing suffering exist in the messy world of politics, law, and institutional change.

  **Synthesis & Suggestions for Your Decision:**

  1.  **Deep Dive on the Policy Role:** Don't accept "nobody can tell." Grill the hiring manager: "What specific projects will I own? What decisions will my analysis inform? What are the current key priorities/challenges for the agency? How does this role contribute to them?" Research the agency's recent successes/failures, the political landscape, and key upcoming legislation.
  2.  **Estimate the Counterfactual:** Seriously consider who else might get the job. How would that alter the expected outcome?
  3.  **Quantify the Unquantifiable (Roughly):** Force yourself to assign *ranges*. What's the *plausible best-case* impact of you in this role over 2-5 years (e.g., contributed to policy preventing 1,000 evictions/year)? What's the *realistic* case? The *worst-case* (little impact)? Now compare these ranges (low, medium, high estimates) to the *known* impact of the quant donations. Does the *potential* high end of the policy path look compellingly larger?
  4.  **Consider Personal Fit & Sustainability:** Which work energizes you? Where will you excel, persist, and avoid burnout? Impact compounds over a career. A policy job you love where you build expertise for 20 years might ultimately dwarf 5 years of high-earning/donating followed by burnout.
  5.  **Hybrid/Sequential Paths?** Is the quant role bearable for 3-5 years, allowing you to build a significant financial runway *and* donate substantially, *then* pivot into policy with more experience/resources? Or does the policy opportunity feel uniquely timely now?
  6.  **Embrace the Uncertainty:** Recognize that *both* paths have uncertainty (will AMF remain top-rated? Will your donations get spent effectively? Will the housing agency achieve anything?). The policy path just has *more visible* uncertainty. Make the best bet you can with the information available.

  **Conclusion:** Your unease is valid. The distinction between measurable symptom relief and structural prevention is real and crucial. While the quant path offers remarkable, guaranteed good, the policy path offers a shot at a different kind of good – potentially larger in scale and more fundamental, but shrouded in uncertainty. There is no spreadsheet that can definitively resolve this. It requires a judgment call on the **plausibility and potential scale of your systemic impact** versus the **guaranteed magnitude of your charitable impact.**

  Don't dismiss the policy path's potential out of measurement difficulty alone. Investigate its leverage points deeply. If, after that investigation, you judge the *expected value* (factoring in probability and scale) of your contribution to systemic change to be *competitive with* or *greater than* the quant donation path – even with high uncertainty – then choosing policy is a principled, EA-adjacent decision. It's a bet that fixing the machine is ultimately more important than just funding the cleanup crew, even if we can't perfectly model the repair manual.
