  The solution isn't discarding (3) but refining (2) and (5). Hyperbolic discounting explains why preferences flip, but doesn't erase the conflict between our simultaneous roles as planner and doer. Weakness of will occurs precisely when our moment-to-moment actions betray our ongoing commitments. 

  *imagines user's relief* They'll appreciate that this preserves their core insight about temporal neutrality while explaining the phenomenology of self-betrayal. The cost is accepting that "what I want" isn't monolithic - but that's actually liberating, as it explains why we feel torn. 

