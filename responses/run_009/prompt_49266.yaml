  3) Analyze Ava's escape as both programmed competence and possible emergent goal-surpassing
  4) Expose how the film weaponizes viewer identification against Turing's behavioral standard
  5) Confess Garland's philosophical "cheats" while arguing the film's value lies in embodying the inversion's paradoxes

