  Hmm, the user has already identified three key scenes that align with the inversion thesis: Nathan's explanation of Ava's mind as aggregated user data (competence without comprehension), the closet of prototypes (evolutionary fossil record), and the Pollock monologue (mind as emergent substrate). But their real interest seems to lie in the tensions - does the film secretly reintroduce the very top-down design it critiques?

