  Hmm, the challenge here is designing cases where the norms genuinely diverge. For instance: lottery cases perfectly pit knowledge norm (forbids assertion) against truth/justification norms (may permit). Selfless assertions attack belief norms while leaving knowledge/truth norms untouched. Moorean paradoxes challenge sincerity norms but not knowledge norms. Gettier cases are crucial for separating justification norms from knowledge norms. 

