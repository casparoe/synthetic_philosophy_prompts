answer: |-
  Here’s a diagnostic quiz designed to sort students by their intuitive judgments about assertion norms, with a transparent scoring key. Each scenario isolates conflicts between major positions (Knowledge, Truth, Belief/Sincerity, Justification/Reasonable Belief).  

  ---

  ### **Diagnostic Quiz: Assertion Norms**  
  *Instructions: Read each scenario and choose the verdict that best matches your judgment. There are no right answers—we’re exploring intuitions.*  

  1. **Lottery Ticket**: Ava has a 1-in-10-million lottery ticket. Before the draw, she says, "My ticket will lose."  
     - (A) Ava shouldn’t have said that—it was improper.  
     - (B) It was fine for her to say it.  
     - (C) It was fine *only if* she had strong evidence it would lose.  

  2. **Selfless Evolution**: Maya, a biology teacher, was raised to doubt evolution. Despite her personal disbelief, she teaches her students, "Evolution is scientifically well-supported," based on her review of the evidence.  
     - (A) Maya acted properly—she gave students accurate information.  
     - (B) Maya shouldn’t have said it—you shouldn’t assert what you don’t believe.  
     - (C) It was fine *because* she had good evidence.  

  3. **Moorean Paradox**: Leo asserts, "The meeting is at noon, but I don’t believe that it is."  
     - (A) This assertion is deeply improper.  
     - (B) It’s odd but permissible if the meeting *is* at noon.  
     - (C) It’s improper only if Leo has no evidence.  

  4. **Gettiered Clock**: Emma glances at a stopped clock that reads 3:00 PM. Unbeknownst to her, it stopped exactly 24 hours ago, so it *is* 3:00 PM now. She asserts, "It’s 3:00 PM."  
     - (A) Emma’s assertion was proper—it was true and she had evidence.  
     - (B) It was improper—she got it right by luck.  
     - (C) It was proper *only because* her belief was reasonable.  

  5. **False Conspiracy**: Omar has meticulously researched a conspiracy theory (using credible-seeming but fabricated sources). He asserts, "The government is covering up alien contact," with total confidence.  
     - (A) Omar’s assertion was improper—it was false.  
     - (B) It was proper—he had excellent evidence.  
     - (C) It was improper because he *should have known* his sources were unreliable.  

  6. **Retraction Demand**: After Lena asserts, "The lab results prove the chemical is safe," Luis challenges her: "But the lab used contaminated samples!" Lena checks and admits this is true.  
     - (A) Lena must fully retract her assertion—it was unwarranted.  
     - (B) Lena should only clarify: "I *thought* it was safe based on the data."  
     - (C) Lena should stand by her assertion if her evidence was strong at the time.  

  7. **"How Do You Know?"**: After Finn asserts, "This painting is a forgery," Gwen asks, "How do you know?"  
     - (A) Finn must cite solid evidence or admit he spoke improperly.  
     - (B) Finn only needs to show he *believes* it’s a forgery.  
     - (C) Finn must show his belief was reasonable, even if he lacks proof.  

  8. **Sincere False Accusation**: Zara sees someone who looks identical to her neighbor stealing a package. She asserts, "My neighbor is a thief!" (It was actually the neighbor’s twin.)  
     - (A) Zara spoke improperly—her claim was false.  
     - (B) It was proper—she sincerely believed it.  
     - (C) It was proper *because* her belief was reasonable.  

  ---

  ### **Scoring Key**  
  *Positions mapped to answer patterns (A/B/C for Q1–Q8):*  

  | **Position**               | **Answer Pattern**                              | **Notes** |  
  |----------------------------|-----------------------------------------------|-----------|  
  | **Knowledge Norm (KN)**    | A, A, A, B, A, A, A, B                         | *Rejects lottery/Gettier/confident false assertions; demands retraction/evidence. Selfless assertion (Q2) is debatable—contextualists may say B.* |  
  | **Truth Norm (TN)**        | B, A, B, A, A, B, *any*, A                     | *Permits lottery/selfless/Moorean assertions if true; forbids false assertions regardless of evidence. Retraction (Q6) often B.* |  
  | **Belief/Sincerity Norm (BN)** | B, **B**, A, A, B, C, B, B                 | **Q2 is key**: Forbids selfless assertion. Permits lottery/false assertions if sincere. Moorean (Q3) always improper. |  
  | **Justification/Reasonable Belief (JN)** | C, C, C, C, B/C, C, C, C | *Permits assertions with strong evidence, even if false/unlucky (Q4/Q5/Q8). Q1/2/3 often C.* |  

  ---

  ### **Honest Diagnostics & Caveats**  
  1. **Indistinguishable Pairs**:  
     - **Truth Norm (TN) vs. Belief Norm (BN)** overlap significantly *except on Q2 (selfless assertion)*. TN permits it (if true); BN forbids it. If a student answers **A on Q2**, they likely hold TN; **B on Q2** suggests BN.  
     - **KN vs. JN** diverge sharply on Gettier (Q4: KN=B, JN=C), lottery (Q1: KN=A, JN=C), and retraction (Q6: KN=A, JN=C).  

  2. **Incoherent/Unattested Combinations**:  
     - **A on Q3 (Moorean) + B on Q2 (selfless)**: BN forbids both, KN permits selfless but forbids Moorean. This combo is rare—likely unstable.  
     - **Mostly B answers except A on Q5/Q8**: TN requires A on false assertions, but B-heavy elsewhere. Mixing B on Q1/Q4 with A on Q5 suggests confusion.  
     - **Mostly C answers with A on Q1/Q4**: JN typically avoids forbidding lottery/Gettier assertions. Could indicate "threshold justification" or inconsistency.  

  3. **Destabilization Tactics** (per position):  
     - **KN**: Press on *selfless assertion* (Q2): "If Maya’s assertion is true and well-supported, why is it improper just because she doesn’t believe it?"  
     - **TN**: Use *Gettier case* (Q4): "If Emma’s assertion was true, why must she retract it? Isn’t truth sufficient?"  
     - **BN**: Challenge with *sincere error* (Q8): "If Zara’s false accusation was sincere, was it really blameless? What if it ruins her neighbor’s life?"  
     - **JN**: Push on *lottery* (Q1): "If strong evidence is enough, why can’t we assert *any* probable claim (e.g., ‘I’ll never get cancer’)?"  

  ---

  ### **Design Notes**  
  - **Why these scenarios?**  
    - Q1/Q4/Q5 isolate externalism (KN/TN) vs. internalism (BN/JN).  
    - Q2/Q3 split BN from others.  
    - Q6/Q7 test normative consequences (retraction/defeasibility).  
  - **Efficiency**: 8 questions, ~90 seconds per question = 12 minutes. Replace Q8 with Q5 if shortening.  
  - **Blindness to Labels**: Options avoid theory-laden terms ("knowledge," "justified")—verdicts focus on propriety/blame.  

  This reliably clusters students into the four camps while flagging hybrids. If results show BN/TN overlap (via Q2), emphasize selfless assertions in seminar. For KN/JN ambiguity, stress Gettier cases. Let me know if you need tweaks!
