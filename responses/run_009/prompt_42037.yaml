  *Final check*: Does Q8 (sincere false accusation) add value? Yes—it distinguishes belief norm (permits) from truth norm (forbids), which Q2 alone can't do. All other overlaps are covered. Scoring key will show belief/truth norms diverging only on selfless/Q2 and false-assertion cases/Q5/Q8. Coherent combinations include KN (A-heavy), Truth (B-heavy except Q2/Q8), Belief (C-heavy except Q2), Justification (D-heavy). Incoherent mixes (e.g., approving both Moorean and selfless assertions) get flagged as "unattested/unstable". 

