answer: |-
  Below is a systematic analysis mapping Ireland's Citizens' Assembly (2016–2018) onto sortition theory and its adjacent concepts, addressing both theoretical alignments and gaps. The structure follows your dual-direction framework, concluding with implications for term limits and career politicians.  

  ---

  ### **I. Mapping Sortition Theory onto the Citizens' Assembly**  
  *(Theory → Case Study)*  

  1. **Descriptive Representativeness**  
     - **Theory Claims**: Random selection (stratified for diversity) mirrors the population, avoiding bias toward wealth, charisma, or political ambition.  
     - **Assembly Alignment**:  
       - 99 members stratified by gender, age, region, and class achieved *statistical* representativeness.  
       - **Key Success**: Members lacked prior political experience, fulfilling the ideal of "ordinary citizens" in deliberation.  
       - **Theoretical Validation**: The replacement scandal (non-random recruits) confirms legitimacy hinges on lottery integrity. When 7 replacements were handpicked, the Assembly’s moral authority was compromised until corrected.  

  2. **Anti-Careerism & Rotation**  
     - **Theory Claims**: Sortition prevents a political class by design: no campaigns, fixed terms, no reelection.  
     - **Assembly Alignment**:  
       - **Term Limits**: Members served only for the Assembly’s lifespan (5 topics, 18 months). Rotation was total—no continuity, no path to power.  
       - **Contrast with Statutory Term Limits**: Unlike electoral term limits (e.g., US Congress), which still select for ambition and often shift politicians to other offices, the Assembly’s lottery *eliminated self-selection*. No member sought the role; none could leverage it for future office.  

  3. **Accountability Mechanism**  
     - **Theory Claims**: Accountability shifts from voters to the *process*: transparency, reasoned deliberation, and public legitimacy.  
     - **Assembly Alignment**:  
       - **No Electoral Accountability**: Members faced no voters, yet deliberative rigor replaced it. Proceedings were public; expert testimonies forced evidence-based debate.  
       - **Authority Despite Advisory Status**: The Assembly’s influence (e.g., abortion repeal) stemmed from perceived impartiality and procedural fairness—validating theory that legitimacy arises from design, not formal power.  

  4. **Structural Equality**  
     - **Theory Claims**: Random selection negates hierarchies of merit or status.  
     - **Assembly Alignment**:  
       - The judicial chair (Laffoy) moderated but did not dominate. Expert input informed—but did not dictate—recommendations, preserving citizen sovereignty.  

  ---

  ### **II. Where Theory Fails or Is Silent**  
  *(Case Study → Theory Critique)*  

  1. **Agenda Control & Power Asymmetry**  
     - **Theory Blind Spot**: Sortition assumes agenda-setting neutrality.  
     - **Assembly Reality**: Government chose topics (e.g., excluding housing crises), revealing how elites control the scope of "citizen" input. Theory understates this vulnerability to capture.  

  2. **Deliberative Engineering**  
     - **Theory Oversimplification**: Pure sortition imagines unstructured equality.  
     - **Assembly Complexity**:  
       - Expert witnesses and a judicial chair shaped discussions, challenging the "co-equal citizens" ideal.  
       - **Implication**: Without scaffolding, random groups may struggle with complex topics (e.g., climate policy).  

  3. **Implementation Gap**  
     - **Theory’s Unanswered Question**: How do lotteried bodies ensure impact?  
     - **Assembly Reality**: Members disbanded after recommendations; no capacity to lobby or monitor implementation. Success relied on political elites’ goodwill (e.g., abortion repeal).  

  4. **Dropouts and Recruitment Bias**  
     - **Theoretical Blind Spot**: Assumes full participation.  
     - **Reality**: 20% attrition skewed representation (likely excluding time-poor/low-income citizens). Unpaid service favored retirees or financially secure members—*contra* descriptive representativeness.  

  ---

  ### **III. Term Limits vs. Sortition: Rethinking Career Politicians**  
  **Your Core Question**: *Does the Assembly suggest term limits are a crude proxy for sortition?*  

  | **Dimension**         | **Term Limits**                          | **Sortition (via Assembly)**              |  
  |------------------------|------------------------------------------|-------------------------------------------|  
  | **Selection Mechanism**| Elects ambitious candidates; evicts them later. | Randomly selects non-ambitious citizens. |  
  | **Anti-Careerism**     | Weak: Politicians pivot to lobbying/new offices. | Strong: No path to power exists.          |  
  | **Citizen Inclusion**  | Indirect: Opens seats but still favors professionals. | Direct: Forces diversity of lived experience. |  
  | **Accountability**     | To voters (short-termism/reelection incentives). | To process (deliberative integrity).      |  

  - **Assembly’s Lesson**:  
    - Term limits fail to address the *root* of careerism: **self-selection by the ambitious**. The Assembly achieved what term limits promise (rotation) but more radically, by excluding ambition entirely.  
    - **Caveat**: Sortition suits *limited-task bodies* (e.g., constitutional reviews). For legislatures, term limits may remain pragmatic—but the Assembly proves that for focused deliberation, random selection outperforms as an anti-oligarchic tool.  

  ---

  ### **IV. Conclusion: Theory Refined by Practice**  
  - **Where Theory Earns Its Keep**:  
    The Assembly validated sortition’s core tenets: descriptive representation, legitimacy via lottery integrity, and authority through process (not power). The abortion outcome exemplifies how such bodies can disrupt elite capture.  

  - **Where Theory Needs Evolution**:  
    1. **Agenda Vulnerability**: Sortition requires safeguards against elite control of topics.  
    2. **Stratification Gaps**: Unpaid roles risk class bias—theory must address compensation.  
    3. **From Deliberation to Action**: New models (e.g., linking assemblies to referendums) are needed.  

  - **Term Limits Reconsidered**:  
    The Assembly shows sortition is the *purer* antidote to careerism. Term limits are a half-measure: they rotate elites but cannot democratize entry. For revitalizing citizen sovereignty, sortition offers a sharper tool—yet its scalability beyond micro-publics remains contested.  

  This case suggests sortition and term limits target different problems: the former *prevents* a political class; the latter merely *limits* its tenure. The Assembly proves that when descriptive representation and anti-ambition designs align, ordinary citizens can reshape politics—but only if elites cede agenda power.
