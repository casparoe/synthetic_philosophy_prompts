prompt: |-
  i'm a second-year grad student and I've gotten into a running argument with a friend about Quine's indeterminacy of translation, and I want a third opinion in the form of an actual number, not the usual "well, it depends how you read Word and Object" hand-waving. The claim I want you to put a credence on, stated so it has a truth value: there could exist, for some suitably remote language, two translation manuals that both fit all possible behavorial evidence — every speech disposition, every pattern of assent and dissent, everything a field linguist could in principle ever collect — and yet systematically conflict with each other, with no further fact of the matter making one of them correct. To be clear, this is meant to be stronger than the humdrum point that current data underdetermines theory choice; the manuals would keep disagreeing no matter how much evidence came in.

  I'd like the decomposition spelled out, and here are some terms I'd expect to see in it, though feel free to add or drop ones as you judge fit: whether Quane's move of piggybacking translation on the underdetermination of physical theory is legit (translation inherits physics' holism, so if physics is underdetermined, so is translation — is that inference sound or a sleight of hand?); whether stimulus meaning really is all the translator has to go on; whether the standard appeal to natural joints and objective similarity — the Lewis-style reply, something like Searle's point that in actual fieldwork causally salient cats fix "gavagai" to rabbit whether the linguist likes it or not — actually breaks the tie or just changes the subject; and whether something like Chomsky's innateness story would cancel the indeterminacy even granting Quine's premises. Give each term a probability and one line of justification, say how they combine into your final number, and then tell me which single term that number is most sensitive to and what argument or discovery would move it the most.

  For reference, my credence is around 0.55 and my friend's is around 0.2 — she thinks the indeterminacy is just garden-variety underdetermination dressed up in scary language, and that once you notice this there's nothing left to be a Quinian about. If you end up on her side, I want to see exactly which premise I'm losing on. Please write your answer as continuous prose only, no headings or bullet points or bold text — the decomposition can just live in ordinary paragraphs, the way you'd write an email.
