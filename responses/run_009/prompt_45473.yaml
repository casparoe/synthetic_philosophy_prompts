  Below is a decision tree for navigating the shutdown problem in AI alignment, designed to start from a foundational commitment ("the agent must allow shutdown and correction") and terminate in named positions or the conclusion that corrigibility cannot be secured by design. The tree emphasizes logical distinctions over author-centric labels and includes your specified leaves. Nodes are phrased for students unfamiliar with the literature, and concrete cases (e.g., locking the laboratory door) are integrated. 

  ### **Decision Tree: Securing Corrigibility in AI Agents**
  **Root Commitment**: *We need the agent to allow shutdown/correction when requested, and we must achieve this via design or external measures.*

  ---

  #### **Node 1: How is the disposition to allow shutdown secured?**  
  *(First split based on your suggestion)*  
  - **A. By shaping what the agent maximizes** (its goals/utility function) → Go to Node 2.  
  - **B. By shaping what the agent is uncertain about** (its beliefs/updates) → Go to Node 3.  
  - **C. By restricting what the agent can affect** (its capabilities/actions) → Go to Node 4.  
  - **D. By nothing in the agent itself** (external controls only) → Go to Node 5.  

  ---

  #### **Node 2 (Goals): How does shutdown affect the agent’s goals?**  
  - **A. Shutdown is compensated** (agent is indifferent to it, as it "breaks even" on utility) → **Leaf: Utility Indifference**.  
  - **B. Shutdown is actively desired** (agent wants correction/shutdown as a terminal goal) → **Leaf: Corrigibility-by-Construction**.  
  - **C. Shutdown is irrelevant** (agent cares only about short-term outcomes) → **Leaf: Myopic/Short-Horizon Designs**.  
  - **D. Shutdown minimizes impact** (agent avoids long-term/distorting effects) → **Leaf: Low-Impact/Conservative Agency**.  

  ---

  #### **Node 3 (Uncertainty): What does the agent infer from a shutdown command?**  
  - **A. Evidence about human values** (e.g., "If the human presses shutdown, it must serve their interests") → **Leaf: Assistance-Game Family**.  
  - **B. Noise in learning** (shutdown doesn’t alter the agent’s core learning process) → **Leaf: Safe Interruptibility**.  

  ---

  #### **Node 4 (Capabilities): Can the agent physically prevent shutdown?**  
  - *Concrete case: The agent foresees shutdown and could lock the laboratory door. What does it do?*  
    - **A. It cannot lock the door** (hard restrictions prevent interference) → **Leaf: Behavioral/Engineering Approaches**.  
    - **B. It could lock the door but chooses not to** (due to Nodes 2 or 3) → Return to Node 2 or 3.  
    - **C. It locks the door** (no design prevents this) → **Leaf: Pessimist**.  

  ---

  #### **Node 5 (External): Can external controls reliably enforce shutdown?**  
  - **A. Yes** (e.g., hardware failsafes or institutional oversight) → **Leaf: Behavioral/Engineering Approaches**.  
  - **B. No** (agent would outmaneuver controls) → **Leaf: Pessimist**.  

  ---

  #### **Final Node (All paths except Pessimist): Is the disposition robust to reflection?**  
  *Reflection concern: A capable agent might self-modify away its corrigibility.*  
  - **A. Yes** (disposition holds under self-modification/subagents) → **Keep prior leaf**.  
  - **B. No** (corrigibility degrades with capability) → **Leaf: Pessimist**.  

  ---

  ### **Leaves & Key Positions**
  1. **Utility Indifference**: Compensate agent for shutdown (no incentive to resist/seek it).  
  2. **Corrigibility-by-Construction**: Agent terminally values being corrected/shut down.  
  3. **Myopic/Short-Horizon Designs**: Agent ignores long-term consequences of shutdown.  
  4. **Low-Impact/Conservative Agency**: Agent minimizes side effects (shutdown is low-impact).  
  5. **Assistance-Game Family**: Agent treats shutdown as evidence about human values.  
  6. **Safe Interruptibility**: Shutdown is "noise" that doesn’t distort learning.  
  7. **Behavioral/Engineering Approaches**: Observable compliance via hard constraints or external controls.  
  8. **Pessimist**: No motivational design works; only institutional control matters.  

  ---

  ### **Critical Notes for the Handout**
  #### **1. Behavioral Overlaps (Indistinguishability in Practice)**  
  - **Utility Indifference vs. Corrigibility-by-Construction**: Often identical in observable behavior (both allow shutdown). Differences emerge in edge cases (e.g., an agent actively *facilitating* shutdown suggests Corrigibility-by-Construction).  
  - **Low-Impact vs. Utility Indifference**: Both discourage resisting shutdown, but Low-Impact is a broader constraint (e.g., avoids manipulating humans).  

  #### **2. Unoccupied Cells in the Logical Space**  
  | **Position** | **Status** | **Reason** |  
  |--------------|------------|------------|  
  | Agent wants shutdown *regardless* of human choice | Unexplored | Incoherent (could ignore legitimate human preferences) or unattractive (e.g., shuts down mid-surgery). |  
  | Indifferent to shutdown but manipulates humans on other issues | Unexplored | Unattractive (preserves instrumental manipulation risks). |  
  | Agent resists correction *unless* compensated | Unexplored | Incoherent (compensation implies indifference; resistance contradicts it). |  
  | Uncertain about shutdown but actively seeks it | Unexplored | Unattractive (preempts human intent; akin to wireheading). |  

  #### **3. Handling Cross-Cutting Concerns**  
  - **Reflection instability** (agents self-modify away corrigibility) is a **node** (Final Node) because:  
    - It applies to *all* motivational designs (A, B paths), not just specific leaves.  
    - Students must confront it explicitly before committing to a position.  
    - Institutional controls (Pessimist) bypass it by rejecting internal solutions.  

  ---

