answer: |-
  ### The Canceling Game  
  **Target:** Experience the difference between sentence meaning and speaker meaning, and discover that some inferences (implicatures) can be canceled ("unsaid") while others cannot (or become entrenched).  

  **Total Time:** 80 minutes  
  **Students:** 12 (divided into 3 teams of 4)  

  ---

  ### Phases  
  #### **Phase 1: Implicature Relay (30 min)**  
  - **Mechanic:** Teams rotate roles: **Speaker**, **Hearer**, and **Referee**.  
    - **Speaker** draws a scenario card (e.g., "Make Team B believe Professor Smith is strict without saying it"). They utter 1–2 sentences.  
    - **Hearer** guesses the intended inference (e.g., "You want us to think Professor Smith is strict!").  
    - **Referee** can veto with: **"Veto! You’re trying to get them to believe X, but you didn’t say X."** If veto is valid (TA/judge approves), Speaker loses.  
  - **Scoring:**  
    - Hearer guesses correctly: +1 point.  
    - Speaker fools Hearer: +1 point.  
    - Valid veto: Referee’s team +1 point.  
  - **Gricean Concept:** Speaker meaning vs. sentence meaning; spoilsport veto enforces covert intent.  

  #### **Phase 2: Cancelation Challenge (30 min)**  
  - **Mechanic:**  
    - After Hearer guesses an inference, Speaker **must cancel it** aloud (e.g., "...but I don’t mean to suggest Professor Smith is strict").  
    - Hearer judges the cancelation:  
      - 🤯 **Contradictory** (feels logically impossible) → Hearer +1.  
      - 🤨 **Weird** (odd but possible) → No points.  
      - 🙂 **Fine** (totally acceptable) → Speaker +1.  
    - **Soak Time Twist:** For half the rounds, Speaker must wait 30 seconds (simulating real-world delay) before canceling.  
  - **Scenarios:**  
    - *Generalized Implicature* (short soak): "She’s from Alaska, so she’ll handle the cold" → Cancel: "...but I don’t mean she’s used to cold." *(Often contradictory)*.  
    - *Particularized Implicature* (long soak): "Nice weather!" (during a storm) → Cancel: "...but I don’t mean it’s bad." *(Often fine after short soak, weird after long soak)*.  
  - **Gricean Concept:** Cancelability; soak time exposes entrenchment of inferences.  

  #### **Phase 3: Ambiguity Round (10 min)**  
  - **Mechanic:** One **pre-set ambiguous scenario** (e.g., "Some students passed the exam" → Implicature: "Not all passed").  
    - Teams debate cancelation ("...but I don’t mean not all passed").  
    - Vote: Contradictory/Weird/Fine → **No consensus required**. Highlight split opinions.  
  - **Gricean Concept:** Boundary between conversational and conventional implicatures (e.g., scalar "some" vs. entrenched norms).  

  #### **Debrief (10 min)**  
  - **Map to Grice:**  
    - Phase 1 = Speaker meaning vs. sentence meaning.  
    - Phase 2 = Cancelability → **Conversational** (often cancelable) vs. **Conventional** (harder to cancel).  
    - Phase 3 = **Generalized** (pattern-driven) vs. **Particularized** (context-driven) implicatures.  
  - **What we couldn’t recreate:**  
    - **Calculability**: Students guessed inferences (pattern-matched) but didn’t *compute* them via Gricean reasoning (CP + maxims).  

  ---

  ### Failure Modes & Fixes  
  1. **Referee over-vetoes or freezes.**  
     - **Trigger:** Referee vetoes every move or hesitates.  
     - **Fix:** TA pre-trains Referee with examples; limit to 1 veto/round.  

  2. **Cancelation judgments turn into arguments.**  
     - **Trigger:** Teams deadlock on "contradictory vs. weird."  
     - **Fix:** TA intervenes as tiebreaker; use 30-second timer for deliberations.  

  3. **Soak time feels artificial.**  
     - **Trigger:** 30-second delay disrupts flow.  
     - **Fix:** Use a visible timer; reframe as "time for hearer to absorb inference."  

  ---

  ### Materials  
  - Scenario cards (e.g., "Hint that the coffee is terrible without saying it").  
  - Timer (for soak time and deliberations).  
  - Scoreboard (whiteboard or poster).  
  - Voting cards (🤯/🤨/🙂 for Phase 2).  

  ---

  ### JSON Summary  
  ```json
  {
    "name": "The Canceling Game",
    "target": "Experience speaker meaning vs. sentence meaning and the cancelability of inferences.",
    "phases": [
      {
        "phase": "Implicature Relay",
        "minutes": 30,
        "mechanic": "Teams rotate Speaker/Hearer/Referee roles. Referee can veto overt speaker intent.",
        "gricean_concept": "Speaker meaning vs. sentence meaning; spoilsport intervention."
      },
      {
        "phase": "Cancelation Challenge",
        "minutes": 30,
        "mechanic": "Speaker cancels inferences; Hearer judges as contradictory/weird/fine. Soak time varies by implicature type.",
        "gricean_concept": "Cancelability; entrenchment via soak time."
      },
      {
        "phase": "Ambiguity Round",
        "minutes": 10,
        "mechanic": "Teams debate cancelation of a scalar implicature (e.g., 'some').",
        "gricean_concept": "Boundary of conversational vs. conventional implicatures."
      }
    ],
    "materials": [
      "Scenario cards",
      "Timer",
      "Scoreboard",
      "Voting cards (🤯/🤨/🙂)"
    ],
    "failure_modes": [
      {
        "what_goes_wrong": "Referee over-vetoes or freezes.",
        "trigger": "Referee misuses veto power.",
        "fix": "TA trains Referee; limit vetos to 1/round."
      },
      {
        "what_goes_wrong": "Cancelation judgments deadlock.",
        "trigger": "Teams argue over contradictory/weird/fine.",
        "fix": "TA breaks ties; 30-second deliberation timer."
      },
      {
        "what_goes_wrong": "Soak time feels artificial.",
        "trigger": "30-second delay disrupts flow.",
        "fix": "Use visible timer; frame as 'absorption time'."
      }
    ],
    "cant_reproduce": "Calculability: Students pattern-match inferences rather than computing them via Gricean reasoning (CP + maxims)."
  }
  ```  

  ---  
  **Run Notes:**  
  - **Prep:** Print scenario cards (include 2 generalized/2 particularized examples per team).  
  - **Flow:** Keep phases strict on time; use a loud timer.  
  - **Debrief Key:** Emphasize that "weird" judgments reveal *entrenchment*, not logical contradiction.  
  - **Why it works:** Forces production/judgment of implicatures under pressure; soak time and ambiguity emerge naturally.
