prompt: |-
  I'm a PhD student in health policy, and I've been stuck for a while on what our allocation institutions actually presuppose about distributive justice, because the pieces don't seem to fit together. Consider three strands of practice. First, solid-organ allocation: liver transplant systems rank candidates largely by severity of illness (in the US, roughly by the MELD score), which measures how close to death you are, not how much good a transplant would do you — so a sicker patient with a modest chance of benefit can be ranked ahead of a healthier candidate who would gain decades from the same organ. Second, coverage decisions by health technology assessment bodies: drugs and devices are judged by cost per QALY, which simply adds up benefits across patients and gives no extra weight to treating the worse off; severity enters, if at all, as a modifier bolted on afterward. Third, the rhetoric that surrounds the first strand: sickest-first rules are defended in the name of equality and equal chances, and there is the rule of rescue — systems spend lavishly on identifiable patients in front of them (the US Medicare entitlement for dialysis being the classic case) while declining far cheaper interventions that would benefit mere statistical lives. My question is what theory of distributive justice this pattern presupposes. Is the severity weighting prioritarian — the worse off count for more, but there is no independent value in reducing inequality as such — or genuinely egalitarian, and if egalitarian, must it face the leveling-down objection: could the practice justify a policy that benefits no one and merely narrows the gap between the sick and the well? Where is the pattern genuinely inconsistent, as opposed to merely underdetermined — could several theories at once license severity priority in transplantation and pure aggregation in drug coverage, or does the asymmetry require some further premise, such as identifiability, rescue, or procedural fairness? Reconstruct the implicit theory as precisely as you can, distinguish what these practices strictly presuppose from what they merely fit well with, and tell me what would have to change if a health system made the prioritarian view explicit — in particular, whether an explicit severity weighting in QALY thresholds would simply reproduce sickest-first transplantation, or would come apart from it.
reasoning: |-
  Okay, let me unpack this PhD student's complex question about distributive justice in health policy. They're clearly wrestling with how different allocation practices - organ transplants, drug coverage decisions, and rescue rhetoric - seem to pull in different normative directions. The core tension is between severity-based prioritization in one context and QALY-maximization in another, wrapped in egalitarian justifications that don't quite cohere. 

  First, I need to map the three strands they described. Organ allocation (like MELD scores) prioritizes the sickest regardless of potential benefit - that's clearly non-utilitarian. Then HTA bodies use pure QALY aggregation without severity weighting - textbook utilitarian. And the rescue rhetoric around organ allocation invokes equality and identifiability, which is its own distinct moral logic. The student's right - these pieces don't neatly fit any single theory.

  Hmm... the key insight emerging is that these aren't applications of different theories, but different moral modules activating under different conditions. The transplant context triggers "rescue mode" with identifiable patients, scarcity, and urgency - hence severity focus. Drug coverage operates in "population policy mode" with statistical lives - hence aggregation. The rhetoric isn't hypocrisy; it's context-dependent moral reasoning.

  For the leveling-down question: no, actual practice wouldn't endorse harming everyone just to equalize. The severity weighting responds to absolute disadvantage, not relative inequality per se. That suggests prioritarian underpinnings rather than strict egalitarianism. But interestingly, the rescue element adds a deontological layer ("must save this person") that prioritarianism doesn't capture.

  On reconciling the asymmetry: identifiability and procedural fairness do the heavy lifting. When faces are visible and stakes are life-or-death, we bolt on rescue ethics. When allocating pills for future patients, we revert to aggregation. The student's instinct is right - no single theory explains both, but the hybrid is stable because contexts don't overlap.

  If we made prioritarianism explicit in HTA, we'd see higher QALY thresholds for severe conditions. But crucially, it wouldn't recreate transplant logic because: 1) organ allocation ignores benefit magnitude while prioritarianism balances severity and benefit, and 2) the rescue imperative wouldn't transfer to statistical decisions. The student should test this by modeling how a severity-weighted QALY system would rank transplant candidates differently than MELD.

  The deeper implication: health policy isn't applying theories top-down but building coherence from practice up. The student might resolve their "stuckness" by accepting that allocation justice is domain-specific - but with constraints to prevent arbitrariness. Maybe propose a framework where identifiability/scarcity triggers one module, population decisions another, with explicit switches between them.
answer: |-
  Your analysis brilliantly exposes the fragmented moral architecture underlying health allocation practices. Let's reconstruct the implicit theory, distinguish presuppositions from compatibilities, and resolve the asymmetries:

  **Core Presuppositions of Current Practice:**
  1. **Severity as a Trigger for Non-Aggregative Justice**: When *identifiable patients* face *immediate life-threats* under *extreme scarcity* (transplants), we presuppose:
     - **Strong Prioritarian Weighting**: The moral urgency of relieving extreme suffering/risk outweighs aggregate benefit maximization (hence MELD prioritizes sickest-first despite lower benefit).
     - **Rescue Imperative**: Society has a duty to save identifiable lives in peril, even at high cost (Medicare dialysis, transplant rhetoric).
     - **Procedural Equality**: When we cannot save all, equal opportunity via queuing satisfies fairness (lottery/queue behind severity tiers).

  2. **Aggregative Utilitarianism for Non-Rescue Contexts**: For *statistical lives* and *non-imminent threats* (HTA drug coverage):
     - **QALY Maximization**: Efficiency dominates; no intrinsic weight to severity without explicit modifiers.
     - **Implicit Scope Insensitivity**: A QALY is a QALY regardless of baseline suffering.

  **The Asymmetry Resolved:**
  The practices are *not inconsistent* but **context-dependent**. The presupposed theory is a **hybrid**:
  > *Prioritarian Rescue Egalitarianism*: Extreme severity triggers a rescue mode that suspends aggregation and prioritizes the worst-off, constrained by procedural fairness. Outside rescue contexts (non-identifiable patients, non-imminent death), standard cost-per-QALY aggregation applies.

  **Key Distinctions:**
  | **Element**               | **Strictly Presupposed**                  | **Compatible But Not Required**      |
  |---------------------------|------------------------------------------|--------------------------------------|
  | **Severity Weighting**    | Only in rescue contexts (transplants)    | General prioritarianism              |
  | **Equality**              | Procedural (equal chance)                | Substantive (outcome equality)       |
  | **Rescue Imperative**     | When identifiability + urgency combine  | Utilitarianism                       |

  **Addressing Leveling-Down:**
  Current practice **rejects strict egalitarianism**. Leveling-down would violate the *rescue imperative* (failing to save identifiable lives) and *efficiency*. Severity-weighting here is prioritarian: we prioritize the sickest *because* their absolute deprivation matters more, not to narrow gaps. A policy benefiting no one would contradict the core presupposition of relieving suffering.

  **Explicit Prioritarianism: Consequences & Divergences:**
  If health systems adopted explicit, consistent prioritarianism (e.g., severity-weighted QALYs):
  - **HTA Reform**: QALY thresholds would increase for severe diseases (e.g., higher £/QALY for terminal illnesses). This *differs from sickest-first transplants*:
    - **Benefit Magnitude Matters**: A prioritarian HTA would fund a drug giving 10 extra years to a stage IV cancer patient over one giving 1 year to a MELD 40 patient, while transplant allocation ignores this.
    - **No Identifiability Requirement**: Weighting applies to statistical lives, eroding the rescue distinction.
  - **Transplant System Shift**: MELD would be modified to incorporate post-transplant survival (benefit), moving toward UK’s "transplant benefit score." Pure sickest-first would diminish.
  - **Rescue Costs Scrutinized**: Dialysis entitlement might face challenge if cheaper preventive care yields greater prioritarian gains.

  **Where Inconsistency Emerges:**
  The true tension lies in **treatment of identifiability**:
  - Transplant systems presuppose identifiability creates special duties.
  - HTA bodies ignore identifiability.
  - *This asymmetry requires the "rescue premise"*: identifiability + urgency generates unique obligations that override aggregation. Without this, the system is incoherent.

  **Reconstruction of Implicit Theory:**
  > Health allocation presupposes **two-track distributive justice**:  
  > 1. **Rescue Track**: For identifiable, immediately life-threatened patients under resource scarcity, priority to the worst-off (prioritarian) with equal procedural chances.  
  > 2. **Population Track**: For non-resource-limited, non-urgent interventions affecting statistical lives, maximize aggregate benefit (QALYs).  
  > *Bridge Premise*: Identifiability + urgency activates "rescue morality."

  **Practical Implications for Reform:**
  To make values consistent:
  - **Option 1**: Extend rescue logic (adopt severity-weighted QALYs in HTA, but retain identifiability premium).
  - **Option 2**: Abandon rescue asymmetry (make transplants more QALY-efficient, accept coverage denials for identifiable patients).
  - **Option 3**: Formalize context rules (e.g., "rescue mode" only when scarcity >50% and survival <6 months without treatment).

  Your stuckness reveals a foundational rift. The practices aren’t underdetermined but reflect an unarticulated **procedural dualism** that privileges immediacy and identifiability. An explicit prioritarian framework would force convergence: transplant allocation would incorporate benefit, and HTA would weight severity—but only by sacrificing the rule of rescue that currently shields transplant ethics from QALY logic. The critical experiment: would society accept denying a liver to a MELD 40 patient to fund malaria nets saving 100 statistical lives? Current practice says no, revealing the rescue premise’s power.
