prompt: |-
  Had a stupidly long argument with a friend last night and I can't stop thinking about it. It started with her saying that if her parents had conceived a month later, that kid would still have been her — same parents, different month, so a different egg and a different sperm. I said no way, that would be some sibling-ish stranger who happens to look a lot like her, and she said that's crazy, obviously it would be her, just with a different body — the same way she'd still be her if she'd been born with different hair or a different nose. Then it got wierd, because when I pressed a variant — same egg, different sperm — my own intuition suddenly hardened: THAT one really feels like it couldn't be me, that's my half-sibling at best. But when she flipped it, same sperm but a different egg, I noticed my intuition got a lot weaker, even though biologically that's exactly as big a change. And then she brought up cases like a frozen embryo implanted in a surrogate, or identical twins splitting from the same fused cell days after conception, and neither of us could even say which origin fact is supposed to be doing the "you-making" work there — the egg, the sperm, the fused cell, the uterus, some combo?

  So here's what I actually want to know, and I'd rather get a real answer than a label I could google. There seem to be two things going on. One is the underlying view we were fighting about: that some fact about your biological origin is essential to you in such a way that a person formed from a different sperm and egg just wouldn't be YOU — she thinks that's obviously false, I think it's obviously true, or at least I did before my intuitions started wobbling. The second thing is the pattern I can't shake: whenever someone tells one of these stories, whichever origin fact is being held fixed in that version silently becomes the one that feels like "the real me," and the strength of the feeling shifts depending on whether the change comes through the mother's side or the father's side or through gestation instead. Do either of these have established names and literature? If so, tell me what the nearest concepts are and how what I've described differs from each — and if the flip-flopping pattern in particular isn't an established thing, name and define it yourself, with some boundary cases to show where it starts and stops. Like, does someone conceived from the same embryo but carried by a different woman fall inside it, or someone with the same egg but donated sperm? Don't just hand me a term and move on — I want to know what the phenomonon actually is, what it isn't, and where its edges are, because right now I honestly can't tell whether my intuitions are tracking something real or just whichever half of the story got told last.
reasoning: |-
  Okay, the user had a long argument with a friend about whether a child conceived at a different time would still be the same person. The friend thinks yes, the user thinks no. But during the argument, the user noticed their intuition changed based on which biological element was altered—like feeling stronger when the sperm changed versus the egg. Now they want to understand two things: first, the philosophical debate about biological origins being essential to identity, and second, the pattern where holding one origin element fixed makes it feel like the "real me." They want proper concepts, literature, and a clear definition of the pattern, including boundary cases.

  First, I need to address the essentialism part. The user's position aligns with biological origin essentialism, which argues that the specific gametes (sperm and egg) that created you are necessary for your identity. If either changes, it's a different person. This comes from thinkers like Kripke and his work on necessity and identity. The friend's view is more in line with psychological continuity theories, where identity is tied to consciousness or experiences, not biology. So if the person has the same memories or psychology, it's still them, even in a different body. That’s Parfit's territory. Then there's the fusion essentialism angle where the zygote itself is the starting point of identity. 

  Next is the pattern of shifting intuitions. The user noticed that whichever element is held constant in a hypothetical scenario feels like the anchor for identity. Changing sperm feels like a half-sibling, but changing the egg feels less certain. This seems related to cognitive biases. The focalism or anchoring bias might explain why fixating on one element makes it seem more essential. Also, there might be cultural or societal influences—like patrilineal associations making paternal lineage feel more significant. 

  I should name this phenomenon. "Origin Fixation Bias" seems fitting. It describes how the narrative frame highlights certain biological elements, making them appear crucial. Boundary cases: same embryo in a different surrogate? Here, the embryo is fixed, so it might still feel like the same person. Donated sperm with the same egg? The egg holder (mother) is fixed, so it might feel more like the user than if the sperm was fixed. But if the egg is donated and sperm is the same, it might feel less like the user because maternal lineage is often emphasized. 

  Need to differentiate this from essentialism. Essentialism is a philosophical stance, while Origin Fixation Bias is a cognitive pattern influenced by how scenarios are presented. The bias can cause inconsistent intuitions, as seen when the user's feelings shifted during the argument. 

  Also, consider edge cases like identical twins—same zygote but splits later. Here, both twins share the origin but are different people. This challenges fusion essentialism because the same zygote leads to two identities. Surrogacy might not affect identity if the embryo is the same, but if the surrogate provides environmental factors, does that matter? Probably not, per fusion essentialism. 

  The user's deeper need is to understand why their intuitions are inconsistent and whether there's a real basis for them. They might be seeking validation that their shifting feelings are a known cognitive bias rather than a flaw in their reasoning. Providing clear concepts and examples can help them make sense of the argument and their reactions.
answer: |-
  Your argument touches on deep philosophical fault lines in **personal identity** and reveals a fascinating cognitive pattern I'll term **Origin Fixation Bias**. Here's the breakdown:

  ### 1. **The Core Philosophical Debate: Biological Origin Essentialism**  
     - **Your Position**: You're defending **Biological Origin Essentialism** (specifically *Gametic Essentialism*). This asserts that your identity is necessarily tied to the specific sperm and egg that created you. Change either, and a numerically different person exists.  
     - **Her Position**: She's advocating **Psychological Continuity** or **Bodily Theory**, where identity hinges on psychological traits or the physical body (regardless of origin). To her, you're defined by your mind/body, not your conception story.  
     - **Key Concepts**:  
       - *Kripkean Necessity* (Saul Kripke): Argues origins are essential. If you originated from different gametes, you wouldn't exist.  
       - *Parfit's Reductionism* (Derek Parfit): Claims identity isn't what matters; survival depends on psychological connectedness, not biological origins.  
       - *Fusion Essentialism*: Focuses on the zygote (fertilized egg) as the "first identity-bearing entity."  

     **Why intuitions wobble**:  
     - **Same sperm, different egg**: Feels less "you" because the egg contributes mitochondria, cytoplasm, and maternal DNA imprinting, making it biologically more dominant.  
     - **Same egg, different sperm**: Feels more "you-ish" due to cultural patrilineal associations or perception of sperm as mere "delivery vehicles."  
     - **Embryo cases**: A frozen embryo implanted in a surrogate challenges *gestational essentialism* (womb = essential). Identical twins (from one zygote splitting) defy *fusion essentialism*—same origin, two people.  

  ### 2. **The Cognitive Pattern: Origin Fixation Bias (OFB)**  
     **Definition**:  
     A cognitive bias where whichever biological origin element is *held constant* in a hypothetical scenario is subconsciously elevated as the "anchor" of personal identity, while altered elements are discounted. The bias intensifies when the fixed element aligns with sociocultural notions of lineage (e.g., paternal vs. maternal).  

     **Boundary Cases & Edges**:  
     | Scenario                          | OFB Prediction                                                                 | Why?                                                                 |  
     |-----------------------------------|--------------------------------------------------------------------------------|----------------------------------------------------------------------|  
     | Same embryo → different surrogate | "Still me" (zygote fixed)                                                      | Fusion essentialism dominates; womb seen as environment, not origin. |  
     | Same egg + donor sperm            | "Me-ish, but not fully" (egg fixed)                                            | Egg fixation + sperm as "replaceable." Maternal bias amplifies this. |  
     | Same sperm + donor egg            | "Not me" (sperm fixed)                                                         | Paternal lineage feels less identity-conferring than maternal.       |  
     | Identical twins (post-split)      | OFB *collapses*; no anchor                                                    | Same origin, two identities—exposes OFB's narrative dependency.      |  
     | Cloned embryo from your cell      | "Not me" (no gametes involved)                                                 | OFB requires gametic/fusion origin; somatic cells don't trigger it.  |  

     **What OFB Is NOT**:  
     - Not *essentialism itself*: Essentialism is a philosophical stance; OFB is the *psychological distortion* of it in thought experiments.  
     - Not *mere framing effect*: It specifically hyper-fixates on *biological origins*, not just any narrative element.  
     - Not *universal*: People deeply versed in embryology or philosophy may resist OFB (e.g., knowing mitochondria's maternal role).  

  ### Why This Happens & Literature Roots  
  - **Cognitive Science**: OFB is a blend of **anchoring bias** (fixating on the first detail given) and **essentialist thinking** (innate human tendency to categorize by hidden "essences"). Studies like Susan Gelman's work on psychological essentialism show we intuit invisible cores defining identity.  
  - **Gender Asymmetry**: Your stronger reaction to sperm-change vs. egg-change mirrors studies on **maternal essentialism** (e.g., work by Linquist et al. on "birth mothers" being seen as more "real" than genetic fathers).  
  - **Philosophical Trigger**: Cases like Parfit's *Teletransporter Paradox* expose similar inconsistencies, but OFB is uniquely tied to *conception narratives*.  

  ### The Real Answer  
  **Biologically**: A month-later conception means a genetically distinct individual (different gametes → different DNA). *Objectively, not you*.  
  **Philosophically**: Essentialists (Kripke) agree; anti-essentialists (Parfit) say "you" is a flexible concept.  
  **Psychologically**: OFB explains your flip-flopping—it's a bug in human intuition, not a feature of reality.  

  Your intuitions aren't tracking an underlying truth; they're being hijacked by the narrative structure of each hypothetical. The only consistent takeaway: **Personal identity is a mosaic of biology, psychology, and story—and no single piece holds all the glue**.
