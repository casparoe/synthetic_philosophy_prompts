answer: |-
  Here’s your tailored Q&A sheet, designed for maximum dialectical efficiency against your specific audience. Each objection is phrased in the opponent’s likely vocabulary, followed by your 2-minute reply strategy, a note on concessions, your position’s vulnerability, and the "pray they don’t ask" question.

  ---

  ### **Q&A Sheet: Colloquium on Promissory Obligation as Normative Power**

  **Core Thesis:** Promising involves the promisor using a normative power to grant the promisee temporary, revocable directive authority over their future conduct. This explains the promisee-specific wrong, obligations to the dead, and the necessity of consent for release.

  ---

  #### **1. Kantian Objection (Self-Alienation & Autonomy Violation)**  
  *Phrased as they might ask:*  
  "You argue the promisor alienates a fragment of their will to the promisee. But for Kantians, autonomy is inalienable—it *cannot* be transferred without self-contradiction. Directing another’s will is heteronomy. How is this not a violation of the Categorical Imperative’s requirement that rational beings be ends in themselves, not mere means?"  

  **Your 2-Minute Reply:**  
  "Autonomy isn’t compromised here—it’s *exercised*. The promisor *chooses* to share authority as an act of self-determination, creating a relational obligation. Kant’s worry about treating persons as means applies to *coercion*; this is consensual self-binding. The promisee’s authority is constrained by the promisor’s initial grant and can be revoked or waived—it’s a temporary delegation, not surrender. Like giving someone a limited power of attorney, it extends, rather than abandons, autonomy."  

  **Concedes:**  
  That autonomy has limits (it can’t be permanently alienated), and that Kantianism captures a core truth about non-instrumentalization.  
  **Weakest Joint:**  
  Justifying why this "delegation" isn’t heteronomous if the promisee *directs* the promisor. Shore up by stressing *revocability* as proof of ongoing agential control.  
  **Pray Nobody Asks:**  
  *"If autonomy requires acting only on maxims you could will as universal law, how can you universalize granting *variable* authority to others without collapsing into contradiction?"*  

  ---

  #### **2. Humean Conventionalist Objection (Authority as Epiphenomenal)**  
  *Phrased as they might ask:*  
  "Your ‘normative power’ is a phantom! Obligation arises *only* from the social practice of promise-keeping—its expectations, sanctions, and coordinative benefits. This ‘authority’ you describe is just the *felt experience* of the practice’s demands. Isn’t your model merely dressing up convention in metaphysical robes?"  

  **Your 2-Minute Reply:**  
  "The practice enables the *exercise* of the power but doesn’t *constitute* the obligation. If obligation were purely conventional, we couldn’t explain:  
  1. **Obligations to the dead**: The practice no longer binds anyone, yet the obligation persists.  
  2. **Novel promises**: We can bind ourselves in wholly new contexts without pre-existing conventions.  
  The practice provides the *stage* for normative powers—like language enabling a speech act—but the obligation springs from the agent’s act, not the stage itself."  

  **Concedes:**  
  Conventions are necessary scaffolding for wielding normative powers (e.g., uptake requires shared understanding).  
  **Weakest Joint:**  
  Explaining how normative powers *emerge* without convention. Shore up by analogizing to constitutive rules (e.g., "checkmate" in chess: the rules enable the power, but the move creates the outcome).  
  **Pray Nobody Asks:**  
  *"If a child on a desert island ‘promises’ a coconut to a parrot, does it create obligation? If not, doesn’t that prove your ‘power’ requires a convention after all?"*  

  ---

  #### **3. Decision Theorist Objection (Non-Circular Operationalization)**  
  *Phrased as they might ask:**  
  "‘Directive authority’ is operationally hollow. How do we *measure* who holds it? Your model relies on *recognition* by the promisor, but that’s circular: authority exists only if the promisor acknowledges it, which is exactly what we’re trying to explain! Give me a testable criterion independent of the parties’ beliefs."  

  **Your 2-Minute Reply:**  
  "Authority is operationalized through *performative success*:  
  1. **Input**: A deliberate utterance/act satisfying felicity conditions (intent, uptake by promisee).  
  2. **Output**: Asymmetric obligations/permissions (e.g., only promisee can release, demand, or waive).  
  The ‘test’ is counterfactual: If the promisee demands performance, the promisor owes *them* (not society) a special justification for refusal. This asymmetry is observable in interaction patterns—no mind-reading needed."  

  **Concedes:**  
  Recognition by the promisee is necessary for uptake, but the authority itself is constituted by the act, not the recognition.  
  **Weakest Joint:**  
  Proving "asymmetric obligations" without invoking circular norms. Shore up with examples like unilaterally binding contracts or testamentary promises.  
  **Pray Nobody Asks:**  
  *"If a promisor ignores a promisee’s demand but complies later for selfish reasons, has the authority been exercised? If not, how is it real?"*  

  ---

  ### **Strategic Summary**  
  - **Order Matters**: Kantians first (emotive charge), Conventionalist next (metaphysical pushback), Decision Theorist last (analytic scrutiny).  
  - **Concessions Are Strength**: Acknowledge partial truths to appear dialectically credible.  
  - **Shore Up**:  
    - **Kantians**: Emphasize revocability = proof of autonomy.  
    - **Conventionalists**: Distinguish *enabling conditions* from *obligation sources*.  
    - **Decision Theorists**: Treat "asymmetric normative positions" as data.  
  - **Nightmare Question**: Focus on the *dead promisee*—it’s your strongest case against convention but risks sounding metaphysically extravagant. Prep this:  
    *"The promisor’s act created a *relational* obligation. The promisee’s death freezes that relation; no new acts (release/waiver) are possible, but the promisor’s duty to fulfill the *past act* remains. Like a debt owed to an estate, it binds the promisor, not the cosmos."*  

  **Final Prep Tip**: Pre-empt the Kantian by opening with *"This isn’t will-alienation—it’s autonomy in community"* and the Decision Theorist by defining "directive authority" operationally upfront. Good luck!
