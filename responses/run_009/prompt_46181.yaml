  The user's hypothesis about interest-relativity seems strong. But maybe there's more. The methodological commitments: content wants an objective, language-independent measure, likeness is okay with context-dependence. This affects applicability. For example, in scientific domains with clear metrics (like physics), likeness works. In more abstract areas, content might be preferred. 

