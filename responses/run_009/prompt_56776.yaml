  From these cases, two main candidate rules emerge. Both focus on the **sampling procedure** rather than the logical equivalence of the raven paradox. The key is whether the procedure could have produced a counterexample (a non-black raven), which aligns with Maya's emphasis on avoiding "lazy" evidence and her annoyance at Case 2.

  1. **Rule 1: Risk of Falsification (Could Have Yielded a Counterexample)**
     - Confirmation occurs if and only if the sampling procedure had a non-zero probability of producing a counterexample to the hypothesis (i.e., a non-black raven).
     - **Why it fits**: This rule explains all four cases:
       - Case 1: Birdwatching could have revealed a non-black raven, so a black raven confirms.
       - Case 2: Grabbing a specific white shoe had no risk of a counterexample (it couldn't be a raven), so no confirmation.
       - Case 3: The mixed barrel could have contained a non-black raven, so a white golf ball confirms weakly.
       - Case 4: The all-golf-ball barrel could not contain a raven, so no confirmation.
     - **Underlying principle**: Evidence only counts if there was a "risk" of falsification— the observation could have contradicted the hypothesis. This captures Maya's rejection of "lazy" evidence and her focus on active testing.

  2. **Rule 2: No Fixed Properties (Unbiased Sampling from a General Population)**
     - Confirmation occurs only if the object was randomly sampled from a broad population where neither color (black/non-black) nor kind (raven/non-raven) was fixed or pre-selected in advance.
