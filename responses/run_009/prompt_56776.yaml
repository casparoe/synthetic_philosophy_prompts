       - Case 3: The mixed barrel sampled from a diverse population (no properties fixed), so a white golf ball confirms.
       - Case 4: The all-golf-ball barrel fixed the kind (to golf balls), so no confirmation.
     - **Underlying principle**: Evidence must come from an unbiased, open-ended process where multiple outcomes are possible. Fixing a property (e.g., color or kind) "taints" the sample by making it uninformative for the hypothesis.

