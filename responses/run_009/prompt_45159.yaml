answer: |-
  Here's your Q&A prep sheet, tailored to your audience and ordered by potential damage (highest to lowest). Replies are designed for 2-minute delivery under seminar pressure, with soft spots flagged. I've included the "pray nobody asks" question and the referee-style objection.

  ---

  ### **Objection 1 (Powers Essentialist)**  
  *"Your whole project assumes extrinsic interferers can individuate dispositions. But dispositions *are* intrinsic causal powers. If the glass’s fragility is masked or finked, that just shows we misidentified its intrinsic profile. You’re polishing a taxonomy for extrinsic pseudo-dispositions, not real ones."*  
  **Why it hurts:** Directly attacks your metaphysical foundation. Ignores your target (conditional analysis) to reframe the debate.  
  **Reply:**  
  "I agree fragility *as an intrinsic power* isn’t lost in masking/finking. But my target is the *conditional analysis* (CA), which aims to reduce dispositions to stimulus-response conditionals. Martin/Lewis use extrinsic cases to show CA fails. I’m arguing their *diagnosis* of CA’s failure is flawed—not defending extrinsic dispositions. Even if CA is wrong, we need a unified account of *why* it fails for interferers."  
  **Soft spot:** Concedes the intrinsicity point. May not satisfy them if they reject CA entirely.  

  ---

  ### **Objection 2 (Old-School Lewisian)**  
  *"Lewis already conceded CA is dead. Why waste time splitting hairs over *how* it failed? Finks and masks both kill it—end of story. Shouldn’t we just move to better analyses (e.g. reformed conditional analysis, causal bases)?"*  
  **Why it hurts:** Questions the project’s relevance. May resonate with the crowd.  
  **Reply:**  
  "Two reasons. First, the fink/mask distinction still structures debates—e.g., Bird uses it to argue masks undermine CA *differently* than finks, requiring distinct solutions. Second, my continuum shows *why* reformed analyses (like Manley/Wasserman’s) that handle finks fail for masks: they ignore stimulus duration. Fixing CA requires grappling with time-sensitivity, not just adding epicycles."  
  **Soft spot:** If they dismiss *all* CA salvage attempts, this won’t sway them.  

  ---

  ### **Objection 3 (Powers Theorist #2)**  
  *"Your ‘stimulus duration’ fix just relabels the problem. What determines the ‘completion’ of a stimulus? If it’s the manifestation’s occurrence, that’s circular. If it’s a physical process, we need a principled way to individuate stimuli—which you haven’t given."*  
  **Why it hurts:** Targets the core innovation (temporal continuum). Forces vagueness to the surface.  
  **Reply:**  
  "Stimulus completion is *not* defined by manifestation (no circularity). It’s fixed by the disposition’s causal role. Fragile things break *when struck sufficiently hard*. ‘Striking’ is an external process with min duration (e.g., momentum transfer). We can anchor ‘completion’ to physical thresholds (e.g., peak force). The fuzziness isn’t a bug—it reflects how dispositions work in a non-instantaneous world."  
  **Soft spot:** Thresholds are context-dependent. Hard to specify without idealization.  

  ---

  ### **🚨 The Question You’re Praying Nobody Asks 🚨**  
  *"If a mask is just a ‘pre-emptive fink’, why does the fragile glass *retain* its disposition under masking but *lose* it under finking? Your view erases this difference—but intuitively, the masked glass *is* still fragile (it would break sans packing), while the finked glass isn’t. How does your continuum preserve this asymmetry?"*  
  **Why it’s deadly:** Challenges your core claim that they’re "the same kind of thing." Forces you to deny intuitions everyone accepts.  
  **Reply (tread carefully):**  
  "The asymmetry is epistemic, not metaphysical. Pre-emptive finks (masks) leave the intrinsic base intact, while late finks alter/destroy it. But CA doesn’t care about intrinsic bases—it’s a counterfactual test. Both cases break the conditional *for the same reason*: the interferer ensures the stimulus (fully delivered!) doesn’t cause manifestation. The ‘fragility’ intuition in masks relies on *background knowledge* of the base—something CA excludes."  
  **Damage control:** Concede that your view *dissolves* the asymmetry for CA’s purposes. Stress that realists can still distinguish cases via causal bases.  

  ---

  ### **Objection 4 (General Metaphysician)**  
  *"Isn’t this just a problem of *time-indexing*? Why not say ‘fragile-at-t’ and specify interferers temporally? Why reframe everything as ‘finkishness’?"*  
  **Why it’s manageable:** Seeks clarification, not destruction.  
  **Reply:**  
  "Time-indexing treats symptoms, not the disease. Finks/masks aren’t about when the *disposition* exists, but when the *interferer* acts relative to stimulus delivery. Reframing as ‘finkishness’ unifies the failure of CA: the conditional *‘if struck, then breaks’* is false whenever an interferer operates between stimulus-initiation and manifestation—whether early (mask) or late (fink)."  
  **Soft spot:** May not convince if they think time-indexing is adequate.  

  ---

  ### **Objection 5 (General Metaphysician)**  
  *"If stimuli have duration, doesn’t CA fail for *all* dispositions? E.g., a vase’s fragility could be ‘finked’ mid-strike by a nano-wizard. Do we need CA to handle *every* micro-interruption?"*  
  **Why it’s manageable:** Tests implications, but your thesis can absorb it.  
  **Reply:**  
  "Exactly—and that’s a feature! CA *always* fails for dispositions in open systems (which is everywhere). My view shows masks/finks aren’t special cases; they’re points on a spectrum of interference vulnerability. This doesn’t ‘save’ CA; it generalizes its failure, pushing us toward better analyses (e.g., causal powers)."  

  ---

  ### **Referee-Grade Objection (For Journal Submission)**  
  *"Your continuum presupposes stimuli are natural kinds with well-defined durations. But ‘striking’ is agent-relative (e.g., a gentle touch vs. a sledgehammer). If stimuli are contextually individuated, your ‘onset time’ parameter collapses into circularity or vagueness."*  
  **Why it’s sneaky:** Questions the objectivity of your key variable.  
  **Anticipate:** Ground stimulus duration in the *minimal physical process required to trigger the manifestation* (e.g., "force ≥ threshold F over Δt"). Accept context-sensitivity but argue it mirrors dispositional attributions in science/folk psychology.  

  ---

  ### **Tactical Summary**  
  - **Concede early:** The intrinsicity of dispositions (to the powers theorist). Your target is CA, not realism.  
  - **Redirect:** When attacked for "bothering with CA," emphasize its lingering influence in the literature.  
  - **Leverage weakness:** Admit stimulus duration is vague but argue it’s a *metaphysical feature* (like vagueness in "heap" predicates).  
  - **Hope:** The "pray nobody asks" question goes unasked. If raised, *don’t fight intuitions*—relocate the asymmetry to causal bases.  

  Good luck—your thesis is sharp, and this crowd’s pushback will only toughen it.
