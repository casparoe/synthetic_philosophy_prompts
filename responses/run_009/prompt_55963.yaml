  The circularity concern: Solomonoff assumes a computable universe, which isn't proven. If the world has uncomputable elements, the whole framework breaks. That's a foundational weakness, even if it's not immediately fatal.

  Unfalsifiability is another issue. Since Solomonoff dominates all predictors, any failure can be blamed on approximation errors. That makes it hard to test empirically. The user asked if any observation could contradict "simpler is better" at this abstraction level. Probably not, which might be unsatisfying.

  For historical cases, quantum mechanics vs. classical physics is a good example. Quantum theories are more complex but more accurate. Also, messy models like deep learning outperform simpler ones in many tasks. These show that in practice, complexity sometimes wins.

