prompt: |-
  I'm a software engineer, and for the last year I've been volunteering with a small nonprofit that does cost-effectiveness analysis for charities. The way they compare interventions that help different species is with what they call a "moral weights" table: a human's suffering counts as 1, a chicken's counts as something like 0.03, a shrimp's as 0.006, and so on. Where the numbers come from is a mix of expert surveys and some neuroscience-ish heuristics about neuron counts, but the analysts are upfront that underneath it all they're just morally uncertain — some of them think a chicken's suffering matters nearly as much as ours, others think it barely matters at all, and the number in the spreadsheet is basically an average across that disagreement. That average then gets fed into expected-value calculations that decide where millions of dollars actually go.

  It struck me the other day that this is a pretty strange thing to do. When we're uncertain about facts, averaging makes obvious sense — if I'm 50/50 on whether a server has 32GB or 64GB of RAM, expected value is the right tool. But moral disagreement doesn't feel like that. If half the staff thinks factory farming is one of the worst things humans do and half thinks it's basically fine, is the "right" number really the midpoint? That would mean nobody on the staff actually endorses the figure that drives the decisions. And it seems like the spreadsheet quietly rules out people who refuse to play the game at all — someone who thinks you can't trade one person's interests against any number of chicken interests, or that certain things just don't go into a weighted sum no matter what.

  So here's my question: what does this whole practice — collapsing moral disagreement into a weighted average and then optimizing over it — actually presuppose? What view of moral uncertainty does it need to be legitimate, which rival views does it rule out just by existing as a spreadsheet, and could the nonprofit keep its current setup while staying genuinely neutral between, say, "moral uncertainty is literally just like factual uncertainty, so averaging is correct" versus "the average is only a pragmatic compromise, a rough patch on our ignorance"? Relatedly, I want to know where the practice is philosophically underdetermined, i.e. where several incompatible underlying theories would still license the exact same table. Please keep it accessible — I have no philosophy backround, just a lot of arguments at lunch.

  At the very end, give me your final answer in machine-readable form: a single line reading \answer{...} with exactly one of three labels — "committed" if the practice strictly presupposes expected-value aggregation over moral theories, "underdetermined" if several incompatible theories of moral uncertainty would license it, or "incoherent" if no single theory could justify it — followed by one short clause saying why.
reasoning: |-
  Hmm, the user is a software engineer volunteering at a nonprofit that uses "moral weights" tables to compare interventions across species. These weights average staff members' differing moral views—like valuing human suffering at 1, chicken at 0.03, shrimp at 0.006—and feed into funding decisions. The user finds this strange because moral disagreement feels different from factual uncertainty. They question whether averaging makes sense when no one actually endorses the midpoint, and whether it excludes views that reject trade-offs entirely. Their core question is what this practice presupposes philosophically: what view of moral uncertainty justifies it, what alternatives it rules out, and whether it can remain neutral between "moral uncertainty = factual uncertainty" vs. "averaging as mere pragmatic compromise."

  The user is clearly thoughtful and analytical, drawing parallels to expected-value calculations in engineering but sensing a disconnect in ethics. They're likely frustrated by lunch-table debates and want philosophical clarity to improve their nonprofit's work. Unspoken needs might include: reassurance they're not overcomplicating things, practical ways to frame discussions with colleagues, or even validation that their discomfort is philosophically grounded.

  Breaking this down:
  - **The practice**: collapsing moral disagreement into a weighted average, then optimizing expected value.
  - **Key philosophical tension**: Is moral uncertainty analogous to factual uncertainty? Expected-value optimization assumes it is, but many ethicists argue moral views aren't probabilistic beliefs to average—they might be incommensurable (e.g., deontologists rejecting trade-offs) or require different aggregation methods.
  - **What the practice presupposes**: It implicitly treats moral uncertainty as probabilistic (like not knowing a server's RAM). This commits to "expected moral value" theory, where averaging across plausible moral theories is rational. Rivals like "my favorite theory" (just pick one view) or "procedural approaches" (negotiate compromises without averaging) are excluded by design.
  - **Neutrality possibility**: The nonprofit could *present* the average as a pragmatic tool while acknowledging deeper disagreements, but the *act of optimizing* via the spreadsheet still assumes averaging is action-guiding. True neutrality would require ditching optimization or adding disclaimers.
  - **Underdetermination**: The table alone can't distinguish between *why* you average—e.g., whether you see moral truth as unknown (cognitivism) or deny objective truth but average preferences anyway (non-cognitivism). But the optimization step locks in expected-value theory.

  Final verdict: The practice isn't incoherent—expected-value theorists defend it rigorously. But it's **committed**, not neutral, because it builds in expected-value aggregation and rules out rivals. Hence: \answer{committed} because optimizing over a weighted average assumes moral uncertainty resolves like factual uncertainty.
answer: |-
  As a software engineer grappling with this, you've pinpointed a profound tension in your nonprofit's methodology. Let's break down what the practice presupposes, what it rules out, and whether neutrality is possible.

  ### Core Presuppositions of the Practice
  1. **Moral uncertainty as probabilistic factual uncertainty**:  
     The spreadsheet approach assumes moral disagreements are akin to empirical unknowns (like server RAM). By averaging weights, it treats moral positions as hypotheses to which probabilities can be assigned (e.g., "30% chance chickens matter 0.8× humans, 70% chance 0.01×"). This requires **two key beliefs**:  
     - *Cognitivism*: Moral claims (e.g., "chicken suffering matters less") can be true or false.  
     - *Expected Moral Value (EMV) theory*: Under moral uncertainty, the right action maximizes expected value across all plausible moral theories, weighted by their probability.  

  2. **Commensurability**:  
     It assumes all moral values (human/chicken/shrimp welfare) can be compared on a single scale. This rules out views where certain interests are *incommensurable* (e.g., "human dignity can't be traded for animal suffering").  

  3. **Additivity**:  
     By summing weighted utilities, it presupposes welfare is additive across individuals and species. This excludes "threshold" views (e.g., "no amount of shrimp suffering outweighs human suffering").  

  ### What the Practice Rules Out
  - **Non-aggregationist theories**: Deontological views (e.g., "rights violations are forbidden, regardless of outcomes") or pluralist approaches (e.g., "suffering and autonomy require separate scales") can't be represented in the spreadsheet.  
  - **Moral nihilism/anti-cognitivism**: If morality isn't truth-apt (e.g., "suffering weights are expressions of emotion, not facts"), averaging becomes meaningless.  
  - **Lexical views**: Positions like "any human suffering outweighs any number of animal sufferings" are excluded because they can't be modeled with finite weights.  
  - **"My Favorite Theory" approaches**: Critics argue that under moral uncertainty, we should follow our *best-judged* theory rather than average all theories. The spreadsheet implicitly rejects this.  

  ### Can the Nonprofit Stay Neutral?  
  - **Neutrality is impossible in practice**. Using the average to *optimize spending* commits to EMV theory. Calling it a "pragmatic compromise" doesn't resolve this—it still uses the average as the action-guiding standard, which is EMV's core tenet.  
  - **Underdetermination exists at the margins**:  
    - The *same weights* could arise from different underlying theories (e.g., EMV vs. a "veil of ignorance" social choice model).  
    - But once you *optimize* over the average, you're locked into EMV. Alternatives would demand different procedures (e.g., satisficing, veto rules, or separate funding pools for different moral views).  

  ### Key Takeaway  
  The spreadsheet isn't philosophically *incoherent*—expected-value theorists (e.g., William MacAskill) defend it rigorously. But it is **committed** to a specific view of moral uncertainty, treating it like factual uncertainty. It can't be neutral because optimization requires a single utility function, and averaging *is* the EMV method.  

  **Final Answer**:  
  \answer{committed} because optimizing over a weighted average presupposes expected moral value theory.
