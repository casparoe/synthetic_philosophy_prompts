  My friend has strong opinions about the nonidentity problem — not that she'd ever call it that — and we've been cataloguing her verdicts. So far: a couple who conceive now, while the mother is on a medication that will give their kid a mild but lifelong condition, when they could have waited two months and had a different, healthy kid instead — she says thats wrong, full stop. Same couple but the risk was a freak one-in-a-million thing nobody could have known about — fine. A couple where every child they could biologically have will have a mild condition (the mom's mitochondrial thing, every offspring gets it), life clearly worth living — fine to conceive. A couple at the IVF clinic who pick the embryo with the condition over the healthy one because the paperwork was easier — wrong. A government that depletes resources so that future people — different people than would have existed otherwise — have worse but still worth-living lives — also wrong. And once the affected kid is born, obviously the parents owe her the treatment.

  Her sister's situation comes up next week: same mitochondrial setup, every possible child affected, but this time the severe version of the condition — decades of pain, life barely worth living (my friend insists she'd still count it as worth living, for what its worth). Second case: the mild-condition couple from before learns they could adopt a healthy kid instead of conceiving the affected one.

