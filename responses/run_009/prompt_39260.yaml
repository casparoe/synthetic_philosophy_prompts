answer: |-
  Based on your friend's track record, her rule appears to be **Avoidable Harm via Better Feasible Alternatives** – specifically, it's wrong to cause a *foreseeable, avoidable harm* to a person when a *significantly better outcome* for an equivalent person (including a different potential person) is *feasible without excessive cost*. This rule explains all her verdicts and cleanly predicts her likely responses to the new cases.

  ### Why "Avoidable Harm via Better Feasible Alternatives" Fits Best:
  1. **Avoidable Harm Focus**:
     - **Wrong Cases**: Conceiving now (vs. waiting) and IVF selection involve *foreseeable, preventable harm* when a better alternative (healthy child) exists.
     - **Fine Cases**: Unforeseen risk and mitochondrial mild condition lack feasible alternatives to prevent harm. The government case is wrong because policy changes *could* avoid harm to future people.
  2. **"Better Outcome" Requirement**:
     - Harm isn't enough alone – the alternative must yield a *significantly better life*. In IVF, selecting a sick embryo creates a worse life unnecessarily.
     - A life "worth living" isn't sufficient justification if a *better* life is achievable (e.g., healthy child via adoption).
  3. **Feasibility & Cost**:
     - Alternatives must be realistic. Waiting 2 months or picking a healthy embryo is low-cost; government policy shifts are feasible. Unforeseen risks aren't feasible to avoid.
     - Adoption may be a feasible alternative if accessible, making conception wrong when it causes avoidable harm.

  ### Predictions for New Cases:
  1. **Sister's Severe Mitochondrial Condition**:  
     **Verdict**: **Fine to conceive**.  
     - *Why*: No alternative child can exist without the condition. Though the life is "barely worth living," it's still *worth living* (per your friend's view), and no better feasible alternative exists. This mirrors her "mitochondrial mild condition" verdict. Avoidable harm isn't present since the harm *cannot* be circumvented for any child they could have.  

  2. **Mild-Condition Couple Can Adopt Instead**:  
     **Verdict**: **Wrong to conceive**.  
     - *Why*: A feasible, low-cost alternative exists (adopting a healthy child) that avoids inflicting the mild condition. Conceiving their biological child now foreseeably causes harm when a *better outcome* (a healthy child via adoption) is available. This aligns with her IVF verdict – selecting a worse outcome when a better one is easily possible is wrong.

  ### How the Rules Split:
  - **Comparative Alternatives**: Predicts both new cases correctly (severe: fine; adoption: wrong).  
  - **Duties to Actual Kid**: Fails – duties apply post-birth, but her verdicts (e.g., IVF) focus on pre-conception choices.  
  - **Impersonal Quality**: Fails severe case – if impersonal harm mattered, creating a "barely worth living" life would be wrong even without alternatives, but she approved the mild version.  

  ### The Decisive Further Case to Spring:
  **Scenario**: *A couple can conceive a child who will have a severe condition (life barely worth living, as in the sister's case) OR choose not to conceive any child. There are no other options (no adoption, IVF, etc.).*  

  - **Why this tests the rule**:  
    - **Avoidable Harm Rule**: Predicts **fine to conceive**. No better alternative exists for any potential child (non-conception means no child at all, so no "better" outcome for that child). Harm isn't avoidable via a superior feasible option.  
    - **Impersonal Quality Rule**: Predicts **wrong to conceive**. Creating a life of severe suffering is inherently objectionable, regardless of alternatives.  

  **Betting on Her Response**:  
  She’ll likely say **fine to conceive** (consistent with her mitochondrial cases). If she says it’s *wrong*, it suggests a threshold where "barely worth living" isn’t sufficient – but this contradicts her stance that the life *is* worth living and her approval in the mild/no-alternative case.  

  This final case isolates the core of her principle: harm is only wrong when you *could* have easily created a healthier or happier person instead. If no alternative exists, creating a life worth living is permissible – no matter how difficult that life may be.
