  The tercets should show the diarist's descent into delusion. Verses 2-5 can explore his rituals and fading certainty, using sensory decay (chill fading, marks blurring) to hint at memory's unreliability. The final tercet should land on persistent conviction, perhaps with a flicker of unease ("doubt like a moth") to invite discussion.

