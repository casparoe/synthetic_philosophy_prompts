prompt: |-
  I'm the historical researcher (basically the in-house accuracy person) at a mid-size production company that makes limited-series dramas about real people, and I keep running into the same fight with the writers' room: somebody invents a deathbed scene, or has a real dead person do something cruel that's pure invention, and when I object I get told it's "true to her essence" and that biopics have always done this and everyone accepts the convention. Legal won't help me — our lawyer only cares about defamation of living people, and there's apparently no cause of action for libeling the dead. But I'm not comfortable with the conclusion that therefore anything goes once someone's died, and I'd like something more principled than my own gut. What I have half-formed in my head is this old philosophical debate about whether you can harm (or wrong) the dead at all: the obvious worry that they can't experience anything anymore, versus the view that people have interests in how they're remembered that can be set back after death, versus the move of saying even if the dead aren't wronged, the *audience* or the living relatives or the historical record itself is. I don't need a philosophy lecture, but I'd like the procedure to actually be grounded in that debate rather than just being studio risk management dressed up.

  So: please write me a decision procedure I can actually run on a scene, one I can apply in a day or two during prep, not just vibes. It should be an ordered set of questions — what counts as a sufficient answer to each, where the procedure stops with a firm "this has to change," and where it hands the decision back to a human because the remaining question is genuinely one of values rather than facts. It should take seriously the distinction between (a) compressing or inventing events that leave the person's overall character intact, (b) inventing something that changes how the audience judges them, and (c) doing that to someone whose defenders are dead or scattered and can't push back — and it should say whether that asymmetry between famous dead people with living advocates and forgotten dead people actually matters or is just sentiment. Then run it on three real cases I've had: giving a real mid-century woman scientist an invented romance with a real dead colleague (it's the best scene in the episode and I don't want it to fail the procedure, but I suspect it does), merging two real aides into one composite character who gets the villain beats that neither actual person earned, and a scene where a real dead person commits a specific act of betrayal that historians actually dispute, but our script presents it as settled fact because the drama needs it.

  One more thing: I want you to actually take positions, not hand me the options with "reasonable people could disagree." If the procedure says the romance scene stays, say so and say why; if it says the composite has to go even though composites are industry-standard, commit to that. And be honest about the points where the procedure just can't settle anything — where it's me or the showrunner making a judgment call that no checklist can absorb — but even there, tell me which way you'd jump and what's driving it. I'd also like a short note at the end on where the procedure is likely to misfire, the cases it was never really designed for.
reasoning: |-
  Okay, the user is a historical researcher at a production company, facing ethical dilemmas when scriptwriters invent scenes involving real deceased people. They need a principled decision procedure to evaluate such scenes, moving beyond legal concerns and personal discomfort. Their main frustration is the "true to her essence" justification used by writers. The user wants a structured, step-by-step process grounded in philosophical debates about harming the dead, with clear outcomes for specific cases they've encountered.

  First, I need to recall the philosophical debates. The key points are: can the dead be harmed? Some argue they can't experience harm posthumously, but others say their interests in reputation persist. Also, lying to the audience or misrepresenting history could wrong living people or distort the historical record. The user mentioned interests, audience deception, and relatives, so the procedure must address these.

  Next, structuring the decision procedure. It should be an ordered set of questions, each leading to a stop or continue path. Steps should distinguish between inventing events that don't alter character judgment versus those that do. The asymmetry between famous and forgotten dead is important—maybe it affects who is wronged, like living defenders or historical accuracy.

  The three cases: invented romance for a scientist, composite villain, and disputed betrayal presented as fact. Need to apply the procedure consistently. For the romance, if it's fictional but doesn't change her character judgment, maybe it passes. But if it implies she got opportunities through romance, that could harm her legacy. The composite character merges real people, assigning villainy neither deserved—this likely fails because it misattributes actions, wronging the individuals and misleading the audience. The disputed betrayal presented as fact risks distorting history, especially if the person's defenders can't contest it.

  The user wants the procedure to take positions, not just present options. So, in each case, I must decide: pass, fail, or escalate. For the romance, if it's not exploitative and doesn't affect her achievements, it might pass. The composite should be changed because it creates false judgments. The betrayal scene needs adjustment unless there's strong consensus among historians.

  Also, the user mentioned forgotten dead versus those with advocates. The procedure should consider if misrepresentation goes uncontested, which harms historical integrity more. For the composite, since the aides are lesser-known, the wrong is primarily to historical accuracy and audience trust.

  Where the procedure can't decide, like ambiguous historical interpretations, it should escalate to showrunners with clear reasons. But the procedure must force explicit justification, not just "dramatic necessity."

  Finally, potential misfires: cases where historical consensus is split but the procedure demands evidence. Or when a scene is fictional but thematically true, which might pass the procedure but still feel unethical to some. Also, legal vs. ethical distinctions—legal clearance isn't enough, so the procedure must stay focused on ethical harm.

  Ensuring each step has clear criteria. For example, Step 1 checks if the invention creates a false judgment. If yes, it fails. Step 2 assesses if it violates core documented traits. Step 3 looks at uncontested misrepresentation, where lack of defenders increases harm to historical record. Step 4 considers harm to living relatives or audience trust. Step 5 evaluates narrative necessity only after passing previous steps.

  Applying this to the romance: if the romance is fictional but doesn't imply her success depended on it, and her traits remain intact, it might pass Step 1. If historians note she avoided relationships due to professional challenges, but the romance shows otherwise, it fails Step 2. Since she has living colleagues, Step 3 might not apply, but Step 4 checks if it exploits her. If not, then Step 5 allows it as additive drama.

  Composite character: merging and assigning villainy creates false judgments (fails Step 1). Even if traits are approximated, the specific misdeeds weren't committed by either, so Step 2 violation. As lesser-known figures, no living defenders, so Step 3 flags higher risk to historical record. This should fail and require changes.

  Betrayal scene: presenting disputed facts as settled creates false judgment if it's not consensus (fails Step 1). If it contradicts known traits, fails Step 2. If the person has defenders, Step 3 applies; otherwise, historical integrity is harmed. Should be adjusted to reflect the dispute.

  Misfires might occur when a scene is essential for thematic reasons but distorts facts. The procedure might not capture symbolic truth, leading to conflicts. Also, if evidence is ambiguous, the escalation to showrunners could be misused to override ethical concerns. Need to emphasize that narrative necessity only comes after ethical checks.
answer: |-
  Here is a principled, actionable decision procedure grounded in the philosophical debate about wronging the dead, historical integrity, and audience trust. It prioritizes **preventing significant harm to reputation, distorting historical judgment, or deceiving the audience** over dramatic convenience, while acknowledging legitimate narrative techniques. The core principle: **Invention is permissible only when it does not create a materially false judgment about the deceased person's character, motivations, or historical contribution, and does not exploit their legacy or mislead the audience.**

  **The Decision Procedure:**

  1.  **Does the invented element (action, statement, relationship, or omission) create a materially false negative judgment about the person's character, motivations, or key contribution?**
      *   *What to look for:* Does it depict them as cruel, cowardly, incompetent, treacherous, or exploitative where there is no evidence of such behavior? Does it imply their achievements were unearned (e.g., stolen, granted via favoritism/romance)? Does it falsely assign blame for a negative outcome?
      *   *Sufficient Answer:* **YES** (Proceed to Outcome A) / **NO** (Proceed to Step 2).
      *   *Outcome A: This has to change.* The invention fundamentally misrepresents the person in a damaging way. It wrongs the deceased by harming their enduring interest in their reputation and legacy. It wrongs the audience by deceiving them. It harms the historical record by cementing a false narrative. *Rationale:* This violates the core interest in not being defamed posthumously, a widely accepted philosophical position (e.g., Joel Feinberg). It also prioritizes historical fidelity over dramatic license where the stakes are highest.

  2.  **Does the invented element contradict a core, well-documented aspect of their known character, values, or documented choices?**
      *   *What to look for:* Does it show them acting completely contrary to established principles (e.g., a documented pacifist committing violence, a fiercely independent person relying entirely on a lover, someone known for integrity committing a betrayal without evidence)? Is it inconsistent with their *known* relationships, documented personality traits, or recorded significant actions?
      *   *Sufficient Answer:* **YES** (Proceed to Outcome B) / **NO** (Proceed to Step 3).
      *   *Outcome B: This has to change.* While perhaps not as severe as Step 1 (it might not make them "evil," just wildly inconsistent), it still significantly distorts their "essence" in an unsupported way. It wrongs the deceased by misrepresenting their core identity. It risks misleading the audience about who this person fundamentally was. *Rationale:* "True to their essence" requires fidelity to *known* essence, not invention of a contradictory one. This protects the individual's historical identity.

  3.  **Does the invention primarily impact a lesser-known person whose legacy has few/no contemporary defenders or established historical narratives to counter the portrayal?**
      *   *What to look for:* Is the person obscure? Are their descendants/close associates likely unaware or unable to contest it? Is there little established public understanding of them that this portrayal could contradict?
      *   *Sufficient Answer:* **YES** (Proceed to Outcome C) / **NO** (Proceed to Step 4).
      *   *Outcome C: This has to change (or requires extreme justification).** The asymmetry **absolutely matters**, but *inversely* to how writers often use it. Lesser-known figures are *more* vulnerable to distortion because there's less countervailing information. Misrepresenting them does greater harm to the *historical record itself* and is a greater betrayal of the historian's/audience's trust precisely *because* it's uncontested. It exploits their obscurity. *Rationale:* This prioritizes protecting the vulnerable dead and historical accuracy over narrative convenience. It prevents the creation of damaging falsehoods that become "fact" by default. A "YES" here is a strong red flag, not a green light.

  4.  **Does the invented element cause significant distress or harm to identifiable living descendants, close associates, or the community they represent?**
      *   *What to look for:* Have descendants/former colleagues/community representatives expressed strong objection? Does the portrayal perpetuate a harmful stereotype about a group they belong to? Is it gratuitously cruel or exploitative of trauma?
      *   *Sufficient Answer:* **YES** (Proceed to Outcome D) / **NO** (Proceed to Step 5).
      *   *Outcome D: This has to change.* While the primary wrong might be to the living, showing respect for the deceased often involves respecting those who care(d) for them and their shared legacy. Causing unnecessary harm to the living for dramatic effect is unethical. *Rationale:* This acknowledges the relational aspect of legacy and prevents tangible harm.

  5.  **Is the invention necessary to achieve a core, demonstrable narrative purpose that cannot be achieved by compressing, reordering, or slightly fictionalizing *non-character-defining* events, or by using a fictional character?**
      *   *What to look for:* Is this the *only* way to convey a *true* thematic point about the era, their work, or a *documented* aspect of their struggle? Does it illuminate a *documented* truth about their life in a way factual events cannot within runtime? Could the purpose be served by a fictional composite or character?
      *   *Sufficient Answer:* **YES** with strong justification (Proceed to Outcome E) / **NO** or weak justification (Proceed to Outcome F).
      *   *Outcome E: Escalate to Showrunner/Producer for Final Judgment.* The invention passes the harm-prevention gates (Steps 1-4) but involves significant fabrication. The ethical burden now shifts to proving its *narrative necessity*. **I would argue strongly against approval unless the justification is exceptionally compelling and the fabrication minimal.**
      *   *Outcome F: This should change.* The invention lacks sufficient justification. Use documented events, compression, fictional characters, or find another narrative solution.

  **Procedure Summary:**
  *   **Stop & Change:** Fail Step 1, 2, 3, or 4.
  *   **Likely Change (Needs Strong Justification):** Fail Step 5 (Outcome F).
  *   **Escalate for Judgment (Ethical Yellow Light):** Pass Steps 1-4 but outcome depends on Step 5 (Outcome E).

  ---

  **Application to Your Cases (Taking Positions):**

  1.  **Invented Romance for Woman Scientist:**
      *   **Step 1:** Does it create a false negative judgment? *Crucial Question:* Does the romance imply her scientific success, opportunities, or recognition were *dependent* on or significantly aided by this relationship? Does it depict her as using romance manipulatively? If YES, **FAIL (Change)**. If the romance is portrayed as mutual, respectful, and *separate* from her scientific merit/achievements (e.g., it shows personal life without impacting her professional depiction), proceed.
      *   **Step 2:** Does it contradict core character? Did she explicitly avoid relationships for career reasons? Was she known for extreme professional isolation contradicting *any* romance? If YES, **FAIL (Change)**. If her personal life is simply undocumented, and a respectful romance doesn't contradict her *known* professional drive/ethics, proceed.
      *   **Step 3:** Lesser-known with no defenders? *She's the subject*. Likely has defenders (colleagues, historians, admirers). **Proceed.**
      *   **Step 4:** Harm to living? Unlikely specific harm if Steps 1 & 2 passed. **Proceed.**
      *   **Step 5:** Narrative necessity? It's the "best scene," implying strong drama. But *is it necessary* to convey a core truth about *her* or her *work*? Could the same emotional/dramatic beat be achieved through a documented struggle, relationship with a mentor (even if platonic), or challenge? *Likely Outcome:* **FAIL Step 5 (Change, or use fictional character)**. Pure romantic invention, even if positive, attached to a real person for drama alone is hard to justify as *necessary* when alternatives exist. It risks reducing her to a romantic trope. **Verdict: Change it.** Make the colleague a friend/mentor, or make the romantic interest fictional. *Why I Jump This Way:* The burden of proof for attaching a significant fictional *personal* relationship to a real person whose personal life isn't the documented focus is high. "Best scene" isn't sufficient justification if it fictionalizes a core human aspect of her.

  2.  **Composite Character Getting Villain Beats:**
      *   **Step 1:** Create false negative judgment? **YES.** The composite *is* depicted as villainous, performing actions neither real person committed. This falsely attributes negative character traits and harmful actions to real individuals. **FAIL (Outcome A: This has to change).**
      *   *Procedure Stops.* **Verdict: Change it.** Either split the character back up and assign documented actions (even if inconvenient), invent a purely fictional villain, or significantly alter the "villain beats" so they reflect *documented, proportional* criticisms of the *actual* aides, not invented atrocities. *Why:* This is the clearest case of wronging the dead and deceiving the audience by falsely condemning real people. Composites are industry-standard but ethically fraught when used to *condemn*.

  3.  **Disputed Betrayal Presented as Fact:**
      *   **Step 1:** Create false negative judgment? **YES.** Presenting a disputed act (especially betrayal) as settled fact inherently creates a negative judgment that is *not* established. It declares the person definitively guilty of a serious ethical breach. **FAIL (Outcome A: This has to change).**
      *   *Procedure Stops.* **Verdict: Change it.** The scene *must* reflect the historical ambiguity. This can be done dramatically: show conflicting perspectives, have characters debate it, use voiceover acknowledging the dispute, or structure the scene so the betrayal is *alleged* or *perceived* but not confirmed as fact by the narrative. *Why:* Presenting disputed negative facts as settled is historical malpractice in a docudrama. It wrongs the deceased by cementing a potentially false negative judgment and deceives the audience. "Drama needs it" is insufficient against this harm.

  ---

  **Where the Procedure Misfires (Limitations):**

  1.  **The "Documented Core" Ambiguity (Step 2):** For figures with complex or contradictory records, defining their "core character" can be interpretive. The procedure demands evidence, but historians can disagree on weighting evidence. This is where escalation (after Step 2 passes) and **your** expertise as the researcher are vital to argue what the preponderance of evidence supports.
  2.  **Positive Inventions:** The procedure is heavily weighted against *negative* inventions. What about invented acts of kindness or courage? Step 1 focuses on *negative* judgment. A positive invention would likely pass Step 1 & 2 unless it wildly contradicted known character (e.g., inventing philanthropy for a notorious miser). Steps 3 & 4 might still flag issues. Step 5 becomes the main hurdle. The procedure errs on the side of allowing positive inventions *if* they pass Step 5's high bar for necessity and don't create false heroism that distorts history (e.g., inventing a white savior moment). **This is a potential weakness if positive myths are also harmful.**
  3.  **"Necessity" Battles (Step 5):** This is inherently subjective and where most writer-researcher conflict will land after passing 1-4. The procedure forces the *writers* to justify necessity concretely, not just say "it's better drama." But it can't eliminate debate. Your role is to rigorously challenge weak justifications.
  4.  **Symbolic "Truth" vs. Literal Fact:** Writers often argue a scene captures a "deeper truth." The procedure prioritizes literal factual accuracy regarding the *individual's* actions and character. It rejects using a specific falsehood to represent a general "truth" *about that person*. (Using a fictional character to represent a general truth is different). This is a core philosophical stance: the ends (symbolic truth) don't justify the means (false portrayal of a real individual).
  5.  **Extremely Minor Characters:** Does Step 3 force excessive research into every named janitor? Use judgment: if the character has a name, a role, and is given lines/actions that define them (even slightly), apply the procedure. Truly anonymous background figures might fall below the threshold, but composites or named characters with actions do not.

  This procedure provides a strong, ethically grounded framework to push back against harmful inventions. It forces the justification away from "true to essence" vagueness and towards demonstrable evidence and necessity, prioritizing the integrity of the individual subject and the audience's trust over purely narrative desires. It gives you concrete arguments rooted in philosophy and historical practice.
