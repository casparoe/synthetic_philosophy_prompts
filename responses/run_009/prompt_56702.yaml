  ## ALTERNATIVE POSSIBILITIES INSURANCE POLICY (API-2024F)

  **Policyholder:** [Insured Agent's Name]
  **Policy Period:** From [Start Date] to [End Date], or until metaphysical indeterminism is conclusively proven false, whichever comes first.
  **Policy Number:** FRK-AP-[Unique ID]

  **DEFINITIONS**

  1.  **Alternative Possibility (AP):** A genuinely available course of action distinct from the action actually performed by the Policyholder at time T, under the exact same conditions immediately prior to T, including the complete physical state of the universe and the Policyholder's mental states. Mere *belief* in having an alternative does not constitute an AP.
  2.  **Principle of Alternative Possibilities (PAP):** The principle stating that an agent is morally responsible for an action only if they could have done otherwise (i.e., possessed an AP regarding that action).
  3.  **Frankfurt-Style Counterexample (FSC):** A scenario involving an **Intervener** (Def. 4) specifically designed to demonstrate that an agent can be morally responsible for an action even in the absence of any AP regarding that action.
  4.  **Intervener:** A non-divine, highly reliable predictive mechanism or agent possessing the following characteristics:
      *   **Prior Sign (Black Box):** Monitors a specific, prior state S of the Policyholder (e.g., neural pattern, conscious deliberation) occurring at time T-1.
      *   **Predictive Capacity:** Based solely on detecting state S at T-1, predicts with near-certainty (≥99.999%) the Policyholder's subsequent action A at time T.
      *   **Intervention Capacity:** Possesses the means and standing intention to causally compel the Policyholder to perform action A at T *if and only if* the Intervener detects that the Policyholder will *not* perform A based on state S at T-1. The Intervener's intervention, if triggered, is sufficient to *guarantee* performance of A.
      *   **Non-Actualization:** In the actual sequence of events, the Policyholder performs A at T *without* any intervention by the Intervener, solely based on their own decision-making processes initiated by state S. The Intervener remains entirely passive ("counterfactual intervener").
  5.  **Trigger Event:** The occurrence of an FSC where the Policyholder performs action A at T, the Intervener was present and operational (possessing the Prior Sign, Predictive Capacity, and Intervention Capacity regarding A), and the Intervener remained passive because the Policyholder performed A "on their own."
  6.  **Moral Responsibility Challenge (MRC):** A formal accusation, philosophical argument, or significant self-doubt experienced by the Policyholder asserting that their moral responsibility for action A is undermined *specifically and solely* because the presence of the Intervener in a Trigger Event eliminated all relevant APs concerning A.
  7.  **Covered Loss:** The complete or partial diminution of the Policyholder's justified belief in their own moral responsibility for action A, *or* the successful third-party denial of the Policyholder's moral responsibility for A, *directly resulting* from an MRC linked to a Trigger Event.

  **COVERAGE CLAUSES**

  **Section I: Base Coverage (Leeway Coverage)**
  1.  **Coverage Trigger:** Upon verification of a Trigger Event and the subsequent arising of an MRC, the Insurer agrees to provide the following indemnification:
      *   (a) **Defense Costs:** Reimbursement for reasonable costs incurred by the Policyholder in defending their moral responsibility against the MRC. This includes, but is not limited to, fees for qualified philosophical consultants, logic tutors, and the preparation of sourcehood-based counter-arguments.
      *   (b) **Restitution:** If, despite reasonable defense, the MRC is deemed successful in a recognized forum (e.g., ethics committee, peer-reviewed journal, deeply unsettling seminar discussion), the Insurer will provide compensation proportional to the determined diminution of moral responsibility. Compensation may take the form of public statements affirming the Policyholder's sourcehood, symbolic acts of atonement performed by proxy, or vouchers for existential validation services (subject to limits).
  2.  **Coverage Limit:** Coverage under Section I is limited to losses stemming *exclusively* from the elimination of APs by the Intervener's *presence and capacity*, not from the actual performance of A itself or any inherent features of determinism unrelated to the FSC structure.

  **Section II: Enhanced Coverage (Sourcehood Coverage) - Requires Rider SHT-1**
  1.  **Coverage Trigger:** Same as Section I (Trigger Event + MRC).
  2.  **Coverage Scope:** In addition to the benefits under Section I, Enhanced Coverage affirms that the Policyholder's action A in the Trigger Event sequence *originated* sufficiently within the Policyholder (i.e., stemmed from their own reasons-responsive mechanism unimpeded by the Intervener's actual intervention) to ground full moral responsibility, *regardless* of the absence of APs. This coverage provides:
      *   (a) **Guaranteed Affirmation:** A binding insurer declaration affirming the Policyholder's full moral responsibility for A, based solely on sourcehood criteria, nullifying the MRC.
      *   (b) **Enhanced Restitution:** If, under extraordinary circumstances, the MRC prevails even after insurer affirmation, compensation includes enhanced benefits such as sponsored sabbaticals for character reformation or priority placement in compatibilist therapy programs.

  **EXCLUSIONS**

  This policy DOES NOT cover:
  1.  **Pre-Existing Blockage:** Diminished moral responsibility stemming from the absence of APs caused by factors *other* than the specific Intervener in the Trigger Event (e.g., ordinary determinism, brain tumors, coercive threats, logical necessity).
  2.  **Intervention Actualization:** Any claim arising from a scenario where the Intervener *actually intervened* to cause the Policyholder to perform A. (Coverage requires the Intervener's passivity).
  3.  **Predictive Failure:** Any claim where the Intervener's prediction based on Prior Sign S was incorrect, and the Policyholder performed an action other than A. (The Intervener must have correctly predicted A for its presence to be relevant to AP elimination).
  4.  **Non-FSC Manipulation:** Diminished moral responsibility resulting from direct manipulation of the Policyholder's decision-making process *prior* to state S at T-1, such as covert neural programming, pharmacological override, or deceptive conditioning, *unless* such manipulation is an inherent, non-causal feature of the Intervener's Predictive Capacity (as per Def. 4b).
  5.  **Intrinsic Inability:** Lack of moral responsibility due to the Policyholder's inherent inability to perform A *even in the absence of the Intervener* (e.g., physical impossibility, lack of competence, overwhelming phobia).
  6.  **Moral Turpitude:** Actions (A) deemed inherently blameworthy regardless of APs or sourcehood (e.g., wanton cruelty). This policy addresses the *condition* of responsibility, not the *degree* based on the action's nature.

  **OPTIONAL RIDERS**

  1.  **Rider SHT-1 (Sourcehood Affirmation):** Adds Enhanced Coverage (Section II) to the policy. Premium adjustment required. *Excludes* coverage for responsibility challenges based on manipulation occurring *prior* to the establishment of the Prior Sign state S, even if the Intervener didn't causally induce S.
  2.  **Rider CIR-1 (Counterfactual Intervention Reassurance):** Provides ongoing monitoring and an annual attestation confirming that no Intervener meeting the Definitions (4a-d) was operational regarding the Policyholder's actions during the policy period. Does *not* cover the discovery of Interveners after the fact. Offers peace of mind only.

  **CLAIMS PROCESS**

  Notification of a potential Trigger Event and MRC must be submitted in writing to the Insurer within 30 metaphysical moments of the MRC arising. The Insurer reserves the right to appoint an independent Frankfurt Case Auditor (FCA) to verify the existence of the Intervener, the accuracy of its prediction, its passivity, and the direct causal link between the FSC and the MRC. Coverage determinations are final, subject only to appeal based on novel interpretations of sourcehood or unforeseen developments in agent-causal theory.

  ---

  **Underwriting Note: Philosophical Assumptions & Vulnerabilities**

  This policy assumes the standard Frankfurt-case architecture where the Intervener's predictive capacity ("Prior Sign") is *non-causal* with respect to the agent's actual decision-making process leading to action A. It presupposes the Prior Sign is a reliable, non-interfering indicator of the agent's *own* impending choice. This is precisely the point compatibilist critics challenge ("the prior sign dilemma"): if the sign is causally independent, how can it be infallible without implying determinism (rendering the Intervener redundant)? If it *is* causally linked, it may manipulate the agent pre-T-1, undermining sourcehood. **This dilemma represents the core vulnerability.** If a successful argument demonstrates that a non-redundant, non-manipulating Intervener is impossible (i.e., the dilemma is inescapable), the foundational Trigger Event becomes metaphysically incoherent, voiding the core coverage premise. Coverage under Section I might survive only if the Intervener's mere *presence* (despite incoherence) is still widely perceived to eliminate APs and cause MRCs. Section II (Sourcehood) coverage would likely remain valid only for compatibilist-friendly responsibility, independent of FSCs. A definitive resolution of the dilemma against Frankfurt would necessitate a complete product redesign or discontinuation.
