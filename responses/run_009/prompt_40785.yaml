answer: |-
  The apparent contradiction you've identified is profound and cuts to the heart of decision-making under uncertainty. Let's break it down intuitively, then tackle the ergodicity argument and fractional Kelly.

  **The "Contradiction" Resolved: Skew vs. Survival**

  1.  **The "Go For Broke" Bettor (f=1):**
      *   **Expected Wealth (Mean):** Maximized *at every finite horizon*. Why? Because there's a tiny, but non-zero, probability of hitting an *astronomically* large payoff early on. Imagine flipping a coin 100 times; betting it all each time on a 51% edge. The probability of winning all 100 flips is tiny (0.51^100 ≈ 10^-15), but the payoff is *obscenely* large (wealth * (1+1)^100 = wealth * 2^100 ≈ wealth * 1.27e30). This single path dominates the *average* calculation of expected wealth. Even though the vast majority of paths end in ruin (wealth = 0) very quickly, these vanishingly rare mega-win paths pull the *average* wealth upward massively. The Law of Large Numbers *does* eventually win... but only for the ensemble average over infinite paths. For finite N, the skewness is immense.

  2.  **The Kelly Bettor (f = edge/odds):**
      *   **Typical Wealth (Median/Mode):** Maximizes the *growth rate* (g = E[log(1+f*X)]). This focuses on the *compounded* outcome along a *single* path over time. Kelly avoids ruin (f=1 goes bust almost surely with enough bets). It grows wealth steadily, compounding at the optimal rate g*. While Kelly won't hit those universe-breaking jackpots that boost the *mean* for f=1, it also avoids the pits of ruin that trap almost all f=1 paths.
      *   **Asymptotic Dominance (Almost Surely):** As the number of bets N approaches infinity:
          *   *Any* strategy betting a *fixed* fraction `f > f_kelly` goes bankrupt *with probability 1*. (It overbets, volatility drag kills it).
          *   *Any* strategy betting a *fixed* fraction `f < f_kelly` grows at a *strictly slower* exponential rate (g < g*).
          *   Therefore, along *almost every* infinite path (specifically, every path where the empirical outcome frequencies converge to the true probabilities), the Kelly bettor's wealth will *eventually* surpass the wealth of *any* other fixed-fraction bettor and stay larger forever. This is "asymptotic dominance almost surely."

  **The Intuitive Gut-Level Coexistence:**

  *   **Think Distribution, Not Single Number:** At finite N, the wealth distribution is *extremely* skewed for aggressive bettors (like f=1). It has:
      *   A **huge, flat mass near zero** (most paths are ruined or nearly ruined).
      *   **Vanishingly thin, incredibly long tails** (a few paths have incomprehensibly large wealth).
  *   **The Mean is Deceptive:** That long tail pulls the *average* (expected value) way up, making it look amazing on paper. But it's a statistical mirage. If you could run the universe millions of times and average your wealth across all copies of yourself, f=1 would win. *You*, however, only live *one* path. In your single reality, you are overwhelmingly likely to be in the ruined mass, not the lucky tail. The mean is dominated by paths you will almost certainly never experience.
  *   **Kelly Focuses on the Likely:** Kelly maximizes your wealth along the *typical* paths you are actually likely to experience. It sacrifices the (practically impossible) dream of universe-breaking wealth for the solid reality of consistent, sustainable growth and survival. It wins in the long run *because it survives to play the long run* and compounds efficiently. The Law of Large Numbers *does* wash things out *along a single path*: over time, the realized growth rate converges to `g`, and maximizing `g` wins. This convergence happens *within your single experience*.

  **The Ergodicity Argument: Time-Average vs. Ensemble Average**

  This is the core defense against Samuelson's critique:

  1.  **The Issue:** Samuelson is formally correct. Maxing E[log(W)] *is* expected utility maxing with U(W) = log(W). It *is* an assumption about preferences (risk aversion proportional to 1/W). The asymptotic dominance result, while mathematically true, occurs in the infinite limit, which no mortal faces.
  2.  **The Ergodicity Defense:**
      *   **Ensemble Average (Expected Value):** What if you had a vast number of parallel universes (an "ensemble"), all running the same betting strategy independently? At time N, you average the wealth across *all* these universes. This is E[W_N].
      *   **Time Average (Growth Rate):** What does a *single* bettor experience in *one* universe over many periods? They see their wealth evolve multiplicatively: W_N = W_0 * (1+f*X_1) * (1+f*X_2) * ... * (1+f*X_N). Their *realized growth rate* is (1/N) * log(W_N / W_0) = (1/N) * Σ log(1+f*X_i).
      *   **The Key Point (Ergodicity):** For the multiplicative wealth process, the *time-average growth rate* (what the single bettor experiences) **converges** to the *ensemble-average growth rate* `g = E[log(1+f*X)]` as N -> ∞ (by the Law of Large Numbers). Crucially, the *ensemble-average wealth* `E[W_N]` grows at a *different* rate (dominated by rare events) and **does not** describe the typical experience within a single path.
      *   **"Forced" Logarithm:** Because the single bettor cares about the multiplicative growth *along their one life path*, and because the long-run realized growth rate per bet is determined by E[log(1+f*X)], maximizing this expectation *is* directly maximizing the thing that determines their long-run wealth *in their lived experience*. It's not *just* a utility function; it's the *structure of multiplicative dynamics* that makes the log essential for describing the long-run growth a single individual experiences. The ergodicity argument says: "If you care about your long-run wealth outcome *as you will actually experience it*, maximizing E[log(1+f*X)] is necessary and sufficient for maximizing your asymptotic growth rate."

  **What Ergodicty Does and Doesn't Do:**

  *   **Does:** It provides a *compelling rationale* for why maximizing E[log(W)] is the *natural* objective for long-run capital growth in repeated multiplicative bets for a *single individual*. It directly links the optimization criterion to the observable asymptotic growth rate *within a single realized path*. It counters the claim that log utility is *arbitrary* in this specific context.
  *   **Doesn't:** It does *not* abolish expected utility theory (EUT). It shows that *within the specific structure of repeated, independent, multiplicative bets*, EUT with U(W)=log(W) emerges as the optimal rule for maximizing long-run growth. It doesn't prove EUT is wrong; it justifies a *specific* utility function *derived from the dynamics of the problem*. For finite horizons or different risk preferences (like strong aversion to drawdowns), other utility functions may be appropriate.

  **Fractional Kelly & The Dispute:**

  *   **What it is:** Betting a fixed fraction `c * f_kelly` where 0 < c < 1 (e.g., "half Kelly").
  *   **Why it's Popular:**
      1.  **Risk Aversion:** Kelly is aggressive. Fractional Kelly (f < f_kelly) reduces volatility and drawdowns significantly, at the cost of a *small* reduction in long-run growth rate (`g`). The reduction in growth is quadratic in `c` (since `g` is max at f_kelly), while the reduction in variance is linear. Many investors value the smoother ride and reduced risk of ruin more than the slight theoretical growth sacrifice. This *is* a utility-based choice (greater aversion to volatility/drawdowns than implied by log utility).
      2.  **Parameter Uncertainty:** The true edge and odds are often estimated poorly. Betting full Kelly is highly sensitive to overestimation of edge. Fractional Kelly acts as a robust "margin of safety."
      3.  **Finite Horizons & Liquidity Needs:** Real investors need money at finite times and can't wait for asymptotic dominance. Reduced volatility provides more predictable liquidity.
  *   **What it Says About the Dispute:**
      *   **Samuelson's Side is Valid:** Fractional Kelly's prevalence shows that investors *do* have preferences beyond pure long-run growth maximization. They willingly sacrifice *some* growth potential for reduced volatility, less severe drawdowns, and robustness. This is classic expected utility maximization with a (slightly) different utility function (e.g., CRRA with γ > 1, where log utility is γ=1).
      *   **Kelly's Defenders are Also Valid:** Fractional Kelly practitioners *start* from the Kelly criterion as the theoretical benchmark for growth and then *scale back* based on their *additional* risk preferences or practical constraints. They acknowledge Kelly as the *growth optimum*. The ergodicity argument explains *why* full Kelly is the growth optimum in a way that resonates with the experience of a single investor. Without Kelly as the anchor, fractional Kelly has no meaning.

  **Conclusion:**

  The coexistence is possible because the *mean* (expected wealth) is dominated by extremely rare, high-payoff paths that are irrelevant to the experience of almost every individual bettor. Kelly succeeds by surviving and achieving good growth on the *vast majority* of paths. The ergodicity argument bridges the gap: it shows that maximizing E[log(1+f*X)] is equivalent to maximizing the *long-run realized growth rate* that a single bettor *actually experiences*, making it a compelling objective derived from the multiplicative dynamics, not just an arbitrary utility assumption. Fractional Kelly acknowledges this power but demonstrates that real-world constraints and preferences often lead investors to temper pure growth maximization with risk reduction, validating the flexibility of the expected utility framework while still relying on Kelly's growth-optimal foundation. Both perspectives hold essential truths.
