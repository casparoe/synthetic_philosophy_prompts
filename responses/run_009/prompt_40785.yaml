  Then connect to ergodicity. The time-average growth rate matters for a single bettor experiencing one path. The ensemble average (expected value) considers all possible paths at once, which isn't realistic for an individual. So ergodicity isn't rivaling utility theory but highlighting how multiplicative dynamics make log utility natural. 

