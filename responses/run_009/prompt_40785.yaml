  Also, clarify that ergodicity arguments justify focusing on growth rates, which leads to log utility, but don't replace utility theory. They provide a specific utility function based on the problem's structure. Fractional Kelly then adjusts this for personal risk preferences, showing that the utility framework is still relevant. 

