prompt: |-
  I teach an intro-level ethics course and we're about to hit the unit on consent (medical, sexual, and contractual consent — I want all three in one frame, since the students will notice the differences anyway). Rather than lecturing on the standard accounts and letting them pick a favorite, I want to flip it: give them the spec first. So here's what I want from you. Write out the requirements that any adequate theory of when consent is valid (i.e., actually transforms what would otherwise be wrongful into permissible) has to satisfy, with the motivating case behind each one. By way of seeding, here are the sorts of puzzles I want the spec to be able to handle, since my students keep generating variants of them and I never have a clean answer: a patient agrees to join a clinical trial believing it's mostly for their own treatment benefit even though the consent form never said that and nobody at the clinic thinks they said it either; a massage therapist who, over months of sessions, cultivates a client's emotional attachment and only then proposes a sexual relationship — no false statement was ever made, no threat was ever made, and the client says yes and even insists they mean it, but something still smells; a person who marries someone who, unknown to both, would have called the whole thing off if they'd known about a hidden affair — no deceiver, yet we're tempted to say the consent was defective; and the sweatshop-adjacent case where someone "freely" takes a terrible job because every alternative open to them is worse, where the person pressuring them isn't any agent at all but just their circumstances. Those four shouldn't get four unrelated ad hoc treatments — the spec should say what they share and how they differ.

  A few specific things I want you to take a stand on rather than just laying out options. First, is there a single validity condition (say, uncoerced, competent, informed choice) or does consent valid for one purpose become invalid for another, and is that a feature of consent or just of our sloppy vocabulary? Second, distinguish for me which requirements are non-negotiable and which are actually just the preferences of one camp — e.g., whether mere circumstances can coerce, or whether wrongfulness-of-the-pressure vs. causal-effect-of-the-pressure is a substantive dispute or a verbal one. Third, and this is the part I care about most: tell me whether any subset of the desiderata is jointly unsatisfiable, the way I suspect the "fully informed" and "actually obtained from ordinary humans" requirements might be — since nobody who understood everything about the trial, the relationship, and the job market in the cases above would consent the way the people in them did, and yet the world is set up so that we need their consent anyway. If some requirements can't be met together, say which ones you'd sacrifice and why.

  One formatting note because I'm going to read this on my phone while prepping: please no headings, bullet points, bold text, or tables — just continuous prose like a long email. And don't give me a neutral survey; I want you to commit to a spec, defend the ranking of requirements, and own the tradeoffs, even where you're not certain. If some part of your answer depends on a contested judgement call, flag it inline as contested but still make the call. No citations or reading lists either, I have the bibliography covered — it's the carving up of the problem I need.
reasoning: |-
  Okay, let me tackle this ethics professor's request. They want a unified specification for consent validity across medical, sexual, and contractual contexts, with clear requirements grounded in real cases. 

  First, I need to establish the core purpose: consent transforms wrongful acts into permissible ones. The professor's four cases reveal gaps in standard theories - the clinical trial misunderstanding, the massage therapist's grooming, the marriage with undisclosed affair, and the coerced sweatshop worker. These show consent can fail without explicit deception or threats.

  I'll propose five non-negotiable requirements based on structural integrity rather than mental states:
  1) Situational non-coercion (no illegitimate constraints)
  2) Relational non-manipulation (no power exploitation)
  3) Transactional alignment (consent matches the act)
  4) Epistemic adequacy (reasonable understanding)
  5) Agency competence (capacity to choose)

  The key tension is between epistemic adequacy and practicability - we can't demand full understanding yet need real-world consent. I'll resolve this by distinguishing core understanding from peripheral details, using the clinical trial case as illustration. 

  For the controversial bits: I'll treat circumstantial pressure as coercive when it substitutes for human agency (sweatshop case), and argue that the marriage example fails on transactional alignment since the undisclosed affair fundamentally changes the commitment's nature. The grooming case highlights how relational manipulation corrupts consent even without lies.

  The tradeoff is clear: we must accept reasonable rather than perfect understanding. I'll defend this by showing how demanding full knowledge would paralyze social cooperation while too little enables abuse. The professor's "smell test" across cases confirms this balance.
answer: |-
  Here’s a unified specification for consent validity across domains, grounded in your cases and designed to force students to confront tensions rather than memorize checklists. I’ll build it around five core requirements, rank them, flag contested points, and own the tradeoffs. The core claim: **Consent is valid only if it’s a *structurally intact authorizing act* relative to the specific domain’s normative risks.** Validity isn’t a binary switch but a context-sensitive filter for defects that undermine the moral work consent does in each sphere.  

  **Non-Negotiable Requirement 1: Situational Non-Coercion (Pressure Test)**  
  *Motivating Case: The sweatshop worker.* Validity requires the absence of *illegitimate constraints* that replace the agent’s will with an external force. Coercion isn’t just about explicit threats by identifiable agents; it includes systemic pressures that functionally hijack choice by removing *reasonable alternatives*. The sweatshop case fails because the "choice" isn’t an endorsement of the job’s terms but a surrender to circumstances engineered by others’ prior wrongdoing (e.g., unjust labor laws, exploitative global markets). **Contested Call:** I treat *circumstantial coercion* (poverty, systemic injustice) as invalidating when it functions identically to a human coercer—by imposing a "offer you can’t refuse" that the consent-giver wouldn’t accept under minimally just conditions. Rejecting this collapses into blaming victims for "choosing" their oppression.  

  **Non-Negotiable Requirement 2: Relational Non-Manipulation (Power Test)**  
  *Motivating Case: The massage therapist.* Validity demands the absence of *cultivated dependence or distorted judgment*. Even without lies or threats, consent fails if obtained by exploiting a relationship of trust, vulnerability, or professional authority to warp the consent-giver’s perspective. The therapist’s gradual emotional cultivation isn’t seduction; it’s a *corruption of the relational frame*. The client’s "yes" emerges from a distorted self-assessment fostered by the therapist’s abuse of their role. This differs from coercion: the victim feels agentic but their agency has been colonized. **Key Distinction:** Manipulation invalidates by *stealthy will-subversion*; coercion does so by *overt will-overriding*.  

  **Conditional Requirement 3: Transactional Alignment (Scope Test)**  
  *Motivating Case: The clinical trial patient.* Consent must align with the *normative stakes of the specific act*. Medical consent requires disclosure of risks/benefits because bodily integrity and health are non-fungible goods. The patient’s misconception (believing the trial is therapeutic) voids consent because they’re authorizing a different *kind* of act than what’s proposed—a personal treatment versus a societal experiment. Contrast with a contract for a used car: failing to disclose a minor scratch might not void consent because monetary value is fungible and caveat emptor applies. **Contested Call:** Validity *is domain-relative*. Sexual consent demands higher alignment than buying coffee because the stakes (autonomy, dignity) differ. This isn’t sloppy vocabulary—it’s moral granularity.  

  **Conditionally Negotiable Requirement 4: Epistemic Adequacy (Understanding Test)**  
  *Motivating Case: The marriage with the undisclosed affair.* Consent requires *reasonable understanding of core commitments*, not omniscience. The undisclosed affair invalidates marital consent because monogamy (explicit or implied) is a *structural pillar* of the undertaking; unknowingly accepting a different bargain. But if the affair was a one-time mistake years ago with no ongoing risk, nondisclosure might not void consent—the core commitment (present fidelity) stands. **The Tension You Noted:** Perfect understanding is impossible. Sacrifice completeness for *salience*: disclose what a reasonable person in that role would need to know to grasp the act’s essence. In the clinical trial, "this is research, not treatment" is salient; the chemical formula of the drug might not be.  

  **Non-Negotiable Requirement 5: Agency Competence (Capacity Test)**  
  *Baseline for all cases.* Consent requires minimal rationality and situational awareness (e.g., not intoxicated, delusional). This is table stakes—without it, we’re not dealing with a *consent-giver* but a body making noises.  

  **Ranking & Tradeoffs:**  
  Requirements 1 (Non-Coercion) and 5 (Competence) are *absolute*; their absence means no valid consent exists in any domain. Requirement 2 (Non-Manipulation) is nearly absolute—it’s hard to imagine valid consent built on exploited vulnerability. Requirements 3 (Alignment) and 4 (Understanding) are *scalar and context-dependent*. This is where your tension bites hardest: **We cannot demand full understanding or perfect alignment and still have functional consent in an imperfect world.** We must sacrifice *comprehensive* knowledge for *sufficient* knowledge relative to domain-specific risks.  

  **Resolving Your Cases Through the Spec:**  
  - *Clinical Trial*: Fails **Transactional Alignment**. Consent for medical research requires understanding its purpose; the patient authorized treatment, not experimentation.  
  - *Massage Therapist*: Fails **Relational Non-Manipulation**. The therapist weaponized professional trust to manufacture "consent."  
  - *Marriage with Undisclosed Affair*: Fails **Epistemic Adequacy** *if* monogamy was a core commitment. The unknowing partner consented to a false bargain.  
  - *Sweatshop Worker*: Fails **Situational Non-Coercion**. Systemic injustice removed reasonable alternatives, making consent a surrender, not authorization.  

  **The Overarching Tradeoff You Suspected:**  
  The **Epistemic Adequacy** and **Transactional Alignment** requirements *are* in tension with real-world feasibility. We sacrifice *depth* of understanding for *functionality*. But we compensate by:  
  1. Elevating disclosure standards in high-stakes domains (medicine, sex),  
  2. Judging understanding by what’s *reasonably accessible*, not absolute truth,  
  3. Invalidating consent only for defects touching the act’s *moral core* (e.g., the affair in marriage, not the cake flavor).  

  **Why This Spec Over Others:**  
  It rejects the false choice between "single unified condition" and "sloppy relativism." Consent is a *structured moral act* with core safeguards (against coercion, manipulation) and variable features (understanding, alignment) tuned to context. This handles your cases without ad-hockery by diagnosing *how* consent fractures: coercion shatters the will, manipulation poisons the well, misalignment distorts the act, ignorance blinds to the stakes. The sweat isn’t in picking a theory; it’s in rigorously applying this scaffold to the blurry world.
