  Below is a one-page decision tree designed to sort reactions to Fitch’s paradox ("every truth is knowable" implies "every truth is known"). It starts after the proof is accepted as logically valid (using classical logic and factivity of knowledge) and focuses on intuitive commitments rather than labels. Nodes use plain English questions, and leaves summarize core positions with their "awkward commitment"—the hardest pill to swallow for that view. Unoccupied branches and ambiguous splits are flagged at the end.

  ---

  **Fitch’s Paradox: What’s Your Move?**  
  *After seeing the proof, does "every truth is already known" strike you as...*  
  **1. Absurd? (You must escape this conclusion.)** → Go to Q2  
  **2. Harmless? (You can shrug it off.)** → Go to Q7  

  **Q2: Do you think the proof’s logic is flawed?**  
  *(Specifically: Does deriving a contradiction from "p ∧ ¬Kp is knowable" force us to reject that it’s knowable?)*  
  - **Yes, the logic is flawed** → Go to Q3  
  - **No, the logic is sound** → Go to Q4  

  **Q3: What’s wrong with the logic?**  
  - **Classical logic overreaches (e.g., double negation is invalid here)** → **Intuitionist**  
    *Awkward commitment: Rejecting classical logic in some areas, risking incompatibility with math/science.*  
  - **Contradictions can be true/acceptable (the contradiction doesn’t refute anything)** → **Paraconsistent**  
    *Awkward commitment: Some truths are inconsistent (e.g., "p ∧ ¬Kp" is knowable but implies Kp ∧ ¬Kp).*  

  **Q4: How do you amend "every truth is knowable" to avoid the paradox?**  
  - **Restrict which truths it applies to** → Go to Q5  
  - **Reinterpret what "knowable" means** → Go to Q6  

  **Q5: Which truths remain "knowable"?**  
  - **Only basic/non-compound truths (e.g., "it is raining", not "it is raining and no one knows it")** → **Restrictionist (Williamson-style)**  
    *Awkward commitment: Simple compounds (e.g., "A and B") may not be knowable even if A and B are.*  
  - **All except self-refuting ones like "p ∧ ¬Kp" (i.e., truths that don’t entail contradictions when known)** → **Restrictionist (Tennant-style)**  
    *Awkward commitment: Some truths (e.g., "there are unknown truths") are inherently unknowable for logical reasons.*  

  **Q6: How is "knowable" redefined?**  
  - **As knowable from actual knowledge of other truths (e.g., "p is knowable" means we can know p by knowing a truth-maker for p)** → **Actualist (Edgington-style)**  
    *Awkward commitment: "Knowability" depends on actual knowledge, not mere possibility.*  
  - **As knowable by an ideal agent at the end of inquiry (e.g., "p is knowable" means p could be known when all facts are settled)** → **Idealized Verifier**  
    *Awkward commitment: Truths like "p ∧ ¬Kp" vanish at the end of inquiry, so they need not be "knowable" now.*  

  **Q7: Can you accept that "every truth is known"?**  
  - **Yes** → **Embrace the conclusion**  
    *Awkward commitment: Universal omniscience (all truths, past/present/future, are known by someone).*  
  - **No** → **Realist Reductio**  
    *Awkward commitment: Abandoning anti-realism (truth isn’t tied to knowability).*  

