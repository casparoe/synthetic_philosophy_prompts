  **Key Notes:**  
  - **Unoccupied Branches:**  
    - **Embrace the conclusion** is theoretically coherent but universally rejected (implies absurd omniscience; e.g., "the number of sand grains on Beach X is even" must be known). No major position defends this.  
    - **Coherent but undefended combinations:** Blocking the principle *without* restricting/reinterpreting it (e.g., denying "p ∧ ¬Kp" is a truth) is unexplored—likely because it’s implausible or ad hoc.  
  - **Ambiguous Splits:**  
    - The **Restrictionist leaves (Q5)** look identical until pressed: Williamson excludes *all* non-basic truths (e.g., conjunctions), while Tennant excludes *only* "anti-Cartesian" truths like the Fitch conjunction. They split when asked: *"Can a complex truth (e.g., a conjunction) be knowable if it doesn’t claim its own ignorance?"* Tennant says yes; Williamson says no. On a one-page handout, merge them as "Restrictionist" and clarify the split in discussion.  
  - **Idealized Verifier vs. Others:** This is a distinct position (reinterprets "knowable" temporally/ideally), not just relabeling. It avoids amending logic or the principle’s scope but struggles with truths that are never known (e.g., "Caesar’s last thought was X" if lost to history).  

  **Leaves Summary:**  
  1. **Intuitionist:** Blocks classical logic.  
  2. **Paraconsistent:** Accepts contradictions.  
  3. **Restrictionist (Williamson):** Knowability only for basic truths.  
  4. **Restrictionist (Tennant):** Knowability only for non-self-refuting truths.  
  5. **Actualist (Edgington):** "Knowable" = grounded in actual knowledge.  
  6. **Idealized Verifier:** "Knowable" = knowable at the end of inquiry.  
  7. **Realist Reductio:** Rejects knowability principle.  
  8. **Embrace Conclusion:** Unoccupied.  

