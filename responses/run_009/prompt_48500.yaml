  Starting with the weakest interpretation: Linguistic Ownership. This simply states that vagueness is a semantic property of words, not physical objects. It's nearly tautological and doesn't resolve the heap/death questions. Then moving to Semantic Indeterminacy - that vague predicates lack precise application conditions. This is still fairly weak and doesn't commit to any particular theory of vagueness.

