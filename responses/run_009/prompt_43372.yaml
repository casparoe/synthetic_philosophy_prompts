  2. **Rule B: Counterfactual Vulnerability (Based on Dispositions)**  
     - A chooser is irrational if, holding their dispositions fixed, there exists *some possible sequence of offers* (even if not actually available) that they would accept and that would leave them worse off.  
     - Rationality requires either:  
       (i) No cyclic preferences, or  
       (ii) Cyclic preferences + dispositions that reject at least one swap in every harmful sequence.  
     - **Fits all cases**:  
       - Dan: Would accept a harmful sequence (Alps→Algarve→Rome→Alps, €90 loss) → irrational.  
       - Sophisticated chooser: Dispositions reject the first swap (anticipates loss) → no harmful sequence accepted → rational.  
       - Single-swap chooser: Would accept the full harmful sequence if offered (even if unavailable) → irrational.  
       - Sticky-rule chooser: Dispositions reject all swaps (€500 margin) → no harmful sequence accepted → rational.  

