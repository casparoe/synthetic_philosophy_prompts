answer: |-
  Here is the exam question, model answer, and marking scheme designed to meet your specifications:

  **Exam Question:**
  > Consider the exact duality in classical electromagnetism where electric and magnetic quantities can be interchanged, yielding two empirically equivalent formulations that posit different fundamental entities. An epistemic structural realist (ESR) argues this supports structural realism: we should believe only in the shared mathematical structure preserved across both formulations. A scientific antirealist replies that if structure exhausts theory content, the ESR cannot claim the two formulations describe the *same world* (rather than merely fitting the same evidence), as ‘sameness of structure’ transcends observational consequences. Adjudicate this exchange by addressing:  
  > (a) Whether ontic structural realism’s (OSR) claim that "there is nothing more to being an entity than occupying a position in a structure" resolves the duality case or worsens entity individuation;  
  > (b) Where Newman’s objection applies, and whether it poses a problem specific to the duality case or only to Ramsey-sentence reconstructions;  
  > (c) Whether duality offers structural realism a distinctive response to underdetermination or merely restates it structurally.

  **Model Answer (700 words):**
  The duality scenario presents a profound challenge for structural realism (SR), exposing tensions between its epistemic (ESR) and ontic (OSR) variants. While the ESR leverages duality to argue for structural preservation as the locus of belief, the antirealist correctly identifies that SR struggles to secure reference to a unique world. I argue that OSR exacerbates the problem, Newman’s objection reveals a deeper limitation beyond Ramseyfication, and duality restates—rather than resolves—underdetermination.

  **(a) OSR and Entity Individuation:** OSR’s claim that entities *are* their structural roles appears initially helpful but ultimately worsens the duality problem. For the ESR, the preserved structure licenses belief in *some* underlying entities (even if underdetermined). However, OSR’s radical claim—that entities *are* nothing beyond position-holders—leaves no room for "thick" entities that could break the symmetry. If E-field and B-field roles are isomorphic under duality, and OSR reduces entities to roles, then the "entities" in the two formulations are *identical* by definition. This collapses the formulations into notational variants, making it incoherent to ask which is "real." Worse, it obliterates entity individuation: if occupying a role exhausts entity identity, swapping roles via duality implies swapping entities, yet OSR cannot ground what distinguishes these entities *as distinct*. Thus, OSR intensifies the problem by making entity individuation structurally indeterminate.

  **(b) Newman’s Objection:** Newman’s critique—that any Ramsey-sentence for a theory is trivially satisfied by *any* set of objects with the right cardinality—bites at the core structuralist claim that structure captures objective content. While often framed against Ramsey-sentence reconstructions, its force extends to the duality case. The preserved structure across dual formulations is, minimally, an abstract relational pattern. Newman shows that merely asserting "there exists a relational system satisfying this structure" is empirically empty without specifying *which* relations/objects instantiate it. Duality exemplifies this: both formulations instantiate the *same* abstract structure, but disagree on its physical interpretation (which relations are "electric," which "magnetic"). Thus, the ESR’s belief in "the structure" cannot discern between these competing instantiations, rendering the structure itself referentially thin. This isn’t *just* about Ramseyfication; it’s about whether structure alone can fix reference without collapsing into triviality. Duality crystallizes this: the structure is preserved, but its physical realization is underdetermined.

  **(c) Underdetermination: Restatement, Not Resolution:** Duality does not provide SR with a distinctive solution to underdetermination; it merely relocates it. The ESR argues that underdetermination between dual formulations is benign because structure is preserved. However, this preserves *only* the structure’s formal properties, not its physical content. The antirealist insists that the formulations *empirically* describe the same phenomena but *ontologically* conflict (e.g., differing causal powers if monopoles exist). By retreating to structure, SR avoids choosing a formulation but cannot affirm they describe the *same world*—only that they are empirically adequate. Crucially, the underdetermination recurs *within* the structural description: is the world’s structure instantiated by E-fields causing B-effects, or B-fields causing E-effects? SR lacks resources to answer this without invoking non-structural factors, conceding the antirealist’s point. Thus, duality shifts underdetermination from entities to structural interpretations, failing to dissolve it.

  **Conclusion:** The antirealist prevails. Duality reveals SR’s inability to secure a unique structural ontology. OSR dissolves entities to the point of incoherence, Newman exposes the referential poverty of "structure" alone, and underdetermination persists structurally. SR must either accept radical ontological indeterminacy or supplement structure with non-structural content.

  ---

  **Marking Scheme (5 marks per point, 25 total):**

  1. **OSR’s Entity Problem:**  
     *Must-hit:* OSR’s "thin" entities make individuation impossible under duality, collapsing formulations into variants.  
     *Common botch:* Claiming OSR resolves duality by denying "hidden" entities.

  2. **Newman’s Scope & Target:**  
     *Must-hit:* Newman bites at SR’s core referential claim; duality shows structure alone cannot fix physical interpretation.  
     *Common botch:* Treating Newman as solely about Ramsey sentences or conflating it with underdetermination.

  3. **Underdetermination Outcome:**  
     *Must-hit:* Duality restates underdetermination at structural level (competing interpretations of roles), failing to resolve it.  
     *Common botch:* Asserting preserved structure dissolves underdetermination.

  4. **Antirealist Challenge:**  
     *Must-hit:* Structural "sameness" cannot ground the claim that formulations describe the *same world* (vs. same evidence).  
     *Common botch:* Ignoring the "same world" vs. "same evidence" distinction.

  5. **Pressure Point Synthesis:**  
     *Must-hit:* Integrates (a)-(c) to show duality exposes SR’s inability to fix reference/ontology uniquely.  
     *Common botch:* Treating (a)-(c) in isolation without showing their collective force against SR.

  ---
  This design ensures candidates must engage critically with structural realism’s internal tensions, moving beyond exegesis to evaluate philosophical coherence under pressure. The marking scheme penalizes superficial or reductive treatments while rewarding nuanced analysis of the specified fault lines.
