prompt: |-
  In my AP Biology class we have been studying levels of selection, and my teacher has been ruling on examples one by one. I want to work out the rule she is applying before she presents next week's case, but I have gotten stuck, and I would appreciate your help thinking it through.

  Her verdicts so far: the peacock's tail is individual selection, full stop. Ground squirrels that give alarm calls and thereby draw hawks toward themselves are kin selection, and she insists this is not group selection. Sterile worker honeybees are also kin selection, not group selection, even though she concedes the colony as a whole functions rather like an organism. When we discussed a colony of genetically identical bacteria that secretes an enzyme into its shared surroundings — so that no single cell's contribution is distinguishable and the enzyme level is a property of the colony as a whole — she called that genuine group selection, with the colony as the unit of selection. Finally, when a classmate asked about slime mold cells from genetically different spores that aggregate and sacrifice themselves to build a stalk, she said that is not group selection either, because by that point the aggregate behaves as an organism and so it is just selection at the organism level.

  Next week's case involves a colony of aphids founded by a single asexual female, in which some individuals develop into sterile soldiers that defend the colony against predators. Every aphid in the colony is a genetic clone of every other, yet the sacrifice is made by particular, individually identifiable soldiers.

  What will she say about the aphids? My problem is that I can see at least two rules that fit everything she has said so far. One rule keys on genetic identity: group selection only when the group's members are clones, so the group is effectively a single genotype, with kin selection reserved for related-but-distinct individuals. Another keys on where the trait lives: group selection only when the trait under selection is a property of the group as a whole, like the colony's enzyme level, while a cost paid by a particular individual counts as kin or individual selection. These rules agree on all her previous verdicts, as far as I can tell, but they seem to come apart on the aphids, which are clonal yet defended by individual sacrifices.

  Please predict her verdict on the aphid case, lay out the candidate rules consistent with her track record and what each one predicts, give your best guess with your reasons for preferring it, and suggest the further example — beyond the aphids — that would most cleanly distinguish between the rules. If you think there are other rules that also fit her verdicts, such as one about whether the group functions as an integrated organism, I would like to hear about those too, including whether any of her verdicts quietly rules them out.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're in an AP Biology class studying levels of selection. Their teacher has specific rulings on different examples: peacock tail as individual selection, ground squirrels' alarm calls as kin selection, sterile worker bees as kin selection, bacterial colony enzyme secretion as group selection, and slime mold aggregation as organism-level selection. The user is trying to deduce the teacher's rule before the next case involving aphids with sterile soldiers in a clonal colony.

  The user has identified two possible rules: one based on genetic identity (clones imply group selection) and another on where the trait is expressed (group-level traits vs. individual actions). Both rules fit the previous examples but conflict on the aphid case. The user wants a prediction, alternative rules, and a distinguishing example.

  First, I need to analyze each of the teacher's verdicts. The peacock's tail is straightforward individual selection because it's about mating success affecting the individual's genes. Ground squirrels giving alarm calls benefit relatives but put themselves at risk—kin selection since the altruism is towards kin. Worker bees are similar; they help relatives, so kin selection. The bacterial colony secretes an enzyme as a collective action, which is a group-level trait, so group selection. Slime molds, even though they aggregate, are considered organism-level because the aggregate acts as a single organism, not because of genetic differences.

  For the aphids: they're clonal, so genetically identical. But the soldiers are individually sacrificing. If the rule is genetic identity, this should be group selection. But if it's about the trait being a group property, it's kin selection because individual soldiers are paying the cost. 

  Looking at the teacher's past rulings, she called the bacterial colony group selection because the enzyme is a collective property. In the slime mold case, she emphasized the aggregate behaving as an organism. So maybe her rule is about functional integration: if the group acts as a single organism, it's organism-level selection; if it's a group trait but not integrated, it's group selection; individual sacrifices for kin are kin selection.

  In the aphid case, the soldiers are distinct individuals performing a sacrificial act, similar to worker bees or squirrels. Even though they're clones, the trait is expressed by individuals. The teacher might see this as kin selection, not group selection. 

  Alternative rules could include functional integration. Her slime mold verdict mentions the aggregate behaving as an organism. The bacterial colony doesn't act as an organism; it's just a group trait. Aphid soldiers are individuals acting, not the colony as a whole. So she might rule kin selection here.

  A distinguishing example would be something like a mutualistic system with unrelated individuals. If the group benefits through cooperation but individuals aren't kin, what would she call it? If she says group selection, then her rule isn't about genetic relatedness. If she says individual selection, then relatedness might be key. But she hasn't covered such a case yet.

  I think the user's deeper need is to understand the underlying principles the teacher uses, possibly to anticipate exam questions or grasp the concepts better. They might also want to engage in class discussions more effectively by predicting arguments.
answer: |-
  Based on your teacher's established rulings and reasoning, here's the analysis and prediction:

  ### Candidate Rules Consistent with Her Verdicts
  1.  **Genetic Identity Rule:** Group selection requires the group *to be a single genetic unit* (all members are genetically identical clones). Kin selection applies when individuals are related but genetically distinct. Individual selection applies when there's no altruism or group-level traits.
  2.  **Trait Locus Rule:** Group selection requires the trait under selection *to be a property of the group as a whole* (e.g., collective enzyme level), where selection acts directly on the group-level phenotype. Kin selection applies when altruistic acts are performed *by identifiable individuals* benefiting relatives, even if they are clones. Individual selection applies to traits benefiting only the individual.
  3.  **Functional Integration Rule (Alternative):** Group selection applies to groups that are *not functionally integrated organisms* but exhibit group-level traits benefiting the group. Kin selection applies to altruism by individuals towards kin. If the group functions *as a single integrated organism* (like the slime mold aggregate or honeybee colony *in her view*), then selection acts at the *organism level*, even if composed of multiple cells/individuals.

  ### How the Rules Fit Previous Cases

  | Example                 | Teacher's Verdict        | Genetic Identity Rule Fit | Trait Locus Rule Fit     | Functional Integration Rule Fit        |
  | :---------------------- | :----------------------- | :------------------------ | :----------------------- | :------------------------------------- |
  | Peacock Tail            | Individual Selection     | ✅ Individual trait       | ✅ Individual trait      | ✅ Individual trait                   |
  | Squirrel Alarm Call     | Kin Selection            | ✅ Related, distinct      | ✅ Individual sacrifice  | ✅ Individual sacrifice for kin       |
  | Sterile Worker Bees     | Kin Selection            | ✅ Related, distinct      | ✅ Individual sacrifice  | ❓(Colony organism? Still kin)       |
  | Bacterial Enzyme        | **Group Selection**      | ✅ Clonal group trait     | ✅ **Group-level trait** | ✅ Group trait, not integrated organism |
  | Slime Mold Stalk        | Organism-level Selection | ❌ Genetically different | ❌ Individual sacrifice? | ✅ **Integrated organism**             |

  *   **Bees Note:** Her concession that the colony "functions like an organism" but *still* calling it kin selection is crucial. It suggests "organism-level" is reserved for cases like slime molds where the integration is absolute and developmentally coordinated *from the start*, not just emergent functionality in a colony of distinct individuals. Bees remain kin selection under all rules.
  *   **Slime Mold Note:** Her ruling explicitly invokes the "behaves as an organism" criterion, strongly supporting the Functional Integration Rule.

  ### Prediction for Aphid Soldiers

  *   **Genetic Identity Rule:** Predicts **Group Selection** (Colony is a single genetic unit).
  *   **Trait Locus Rule:** Predicts **Kin Selection** (Sacrifice is made by identifiable individuals, even if clones. The trait "sterile soldier" is expressed *by* individuals).
  *   **Functional Integration Rule:** Predicts **Kin Selection** (While clonal, the aphid colony isn't described as functioning *as a single integrated organism* like the slime mold. Soldiers are distinct individuals performing an altruistic act, analogous to worker bees).

  **My Best Guess & Reasoning: She will say Kin Selection.**

  *   **Primary Reason:** Her **Trait Locus Rule** is the most consistent across *all* her rulings, especially the distinction between the bacterial enzyme (group trait) and the slime mold sacrifice (organism trait). The aphid soldiers are *identifiable individuals* sacrificing themselves, just like the squirrels and worker bees. The clonality doesn't change the *locus* of the sacrificial act. Her bee ruling (kin despite colony function) shows clonality alone isn't sufficient for group selection in her framework.
  *   **Supporting Reason:** Her **Functional Integration Rule** also points to kin selection. Aphid colonies, while clonal, are typically seen as collections of distinct individuals cooperating, not a single integrated organism with differentiated tissues arising from a coordinated developmental program like the slime mold (or arguably, the honeybee *larvae* developing into castes). Soldiers are modified *individuals*, not analogous to somatic cells. Her slime mold verdict shows she reserves "organism-level" for extreme integration.
  *   **Weakness of Genetic Identity Rule:** Her ruling on the *slime mold* (not group selection despite genetic *differences*) directly contradicts the Genetic Identity Rule. Genetic identity alone is neither necessary (bacteria are clonal, but she used group trait) nor sufficient (aphids are clonal, but sacrifice is individual) for her group selection verdict.

  ### Crucial Distinguishing Example

  To definitively separate the Trait Locus Rule from the Functional Integration Rule, propose this scenario:

  *   **"The Mutualistic Cleaner Fish Flock":** A group of *genetically unrelated* cleaner fish of different species work together at a cleaning station. Their *collective reputation* for thorough cleaning attracts more client fish to the station, benefiting all individuals in the group. However, individuals can be lazy ("cheat") without immediate individual penalty, reducing the group's reputation and fitness over time. Selection acts on the *group's collective reputation and client attraction rate*.

      *   **Trait Locus Rule Prediction:** **Group Selection.** The trait under selection (collective reputation/client attraction) is a property of the group as a whole.
      *   **Functional Integration Rule Prediction:** **Group Selection.** The group is not a functionally integrated organism; it's a cooperative association where selection acts on a group-level property.
      *   **Genetic Identity Rule Prediction:** **Individual Selection or Kin Selection?** (Fails - unrelated individuals). This case breaks the Genetic Identity Rule immediately. Her verdict here would reveal if she accepts group selection without genetic relatedness/clonality.

  ### Why Not Other Rules?
  *   **Pure Kin vs. Group Distinction:** Her clear separation of squirrel/bees (kin) from bacteria (group) rules out frameworks where kin selection *is* a form of group selection. She treats them as distinct categories.
  *   **"Group as Organism":** Her verdicts show this is nuanced. Bacteria (group trait) are *not* called an organism. Bees (highly integrated colony) are *still* kin selection, not organism-level. Only the developmentally integrated slime mold aggregate qualifies as an "organism" for selection level. This supports the Functional Integration Rule *in combination* with the Trait Locus Rule.

  **In summary:** Your teacher strongly prioritizes **where the trait is expressed and where selection directly acts** (Trait Locus Rule), supported by whether the group constitutes a functional organism (Functional Integration Rule). Clonality alone is insufficient. Therefore, the aphid soldiers, being individually sacrificing clones in a non-organismal colony, will be classified as **Kin Selection.** The Cleaner Fish Flock example will force a clear distinction between trait locus/functional integration rules and other frameworks. Good luck in class!
