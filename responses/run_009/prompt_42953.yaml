  Breaking this down: First, the activity needs to force "robots" to follow defaults literally—no improvisation. Maybe using a timer for decisions would create pressure. The scenarios should be medical (like insulin drips) to tie back to bioethics. For blame migration, the payoff structure must make inaction costly but intervention cumbersome. 

