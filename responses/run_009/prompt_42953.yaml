  What the game can't capture: It won't resolve whether doing/allowing is morally distinct—it just exposes baseline relativity. Also, human empathy factors (e.g., seeing a patient) won't translate. Debrief should clarify these gaps. 

  User’s hidden needs: They’re avoiding rehashing trolley problems. The game must stand alone. They also want low prep—so providing printable templates is key. And they need the debrief to explicitly connect gameplay moments to concepts like "omission relative to what." 

  Final tweaks: Add a "Blame Tracker" worksheet to log shifting perceptions post-scenario. In debrief, ask: "Who felt responsible when the patient crashed? Did it change based on defaults?" This makes the migration visceral.
answer: |-
  Here’s a polished, ready-to-run activity designed to make the "baseline relativity" problem visceral, with printable materials and a tight 75-minute timeline:

  **Activity Title:** **The Default Dilemma Simulator**  
  *Core Insight:* **Blame migrates to the default-setter when systems fail, exposing how "omission" is defined by programmed baselines.**

  ### Materials Needed (Printable)
  1. **Role Cards** (6 sets: 1 Default Designer, 2 Protocol Executors, 1 Nurse, 1 Family Member per group)  
  2. **Scenario Cards** (3 medical scenarios, e.g., "Hypoglycemic Crisis," "Ventilator Weaning," "Drug Allergy")  
  3. **Intervention Request Forms** (For Nurses/Family: Physical slips requiring 30+ seconds to "complete" with checkboxes/details)  
  4. **Default Setting Template** (Simple worksheet for Designers: "System will ALWAYS ______ unless ______")  
  5. **Blame Tracker Sheet** (Whole-class: Grid to record post-scenario blame votes)  
  6. **Timer** (Visible countdown for decisions)

  ---

  ### Roles & Rules (18 students → 3 groups of 6)
  | **Role**             | **Rules**                                                                 | **Pressure Mechanics**                                  |
  |----------------------|---------------------------------------------------------------------------|---------------------------------------------------------|
  | **Default Designer (x1)** | Writes initial system defaults (e.g., "Continue insulin delivery").       | 3 mins to write defaults; can’t change mid-game.        |
  | **Protocol Executors (x2)** | **Must rigidly follow defaults.** No interpretation allowed.             | 30-sec timer per decision; delay = "system error" penalty. |
  | **Nurse (x1)**       | Can intervene by submitting *costly* form (e.g., "Override Request").     | Forms require writing 3 reasons + signature (takes 45+ sec). |
  | **Family Member (x1)** | Can request changes via "Ethics Review Form" (longer/more complex).      | Form takes 60+ sec; only 1 request per scenario.        |
  | **Patient Status (x1)**| Silent role; holds card showing vitals (e.g., "Stable → Critical" if no action). | N/A (Passive outcome tracker)                           |

  ---

  ### Timeline (75 Min Total)
  1. **Intro (5 min):** Frame the problem: *"Today, we test how system defaults redefine acts/omissions. You’ll *feel* who shoulders blame."*  
  2. **Prep (10 min):**  
     - Split into 3 groups. Designers write defaults (using template).  
     - Hand out Role Cards + explain rules. **Crucial:** Drill Executors: *"You are machines. If it’s not written, you CAN’T act. Speed is life!"*  
  3. **Gameplay (45 min, 3x 15-min scenarios):**  
     - **Scene 1:** Run scenario with Group A (others observe).  
     - **Aftermath:** All students vote on "Primary blame target" (Designer/Executor/Nurse/Family/None). Record on Blame Tracker.  
     - Repeat for Groups B/C with new scenarios.  
  4. **Debrief (15 min):** Structured discussion linking gameplay to theory.

  ---

  ### Scenarios (Example: "Hypoglycemic Crisis")  
  > *Patient is diabetic. Insulin pump running. Blood sugar drops dangerously low.*  
  > - **Default A (Continue):** Executors keep insulin flowing → patient crashes.  
  > - **Default B (Pause):** Executors withhold insulin → no harm.  
  > *Nurse must "override" to stop/pump; Family must "request ethics review" to restart.*  

  **Payoff Structure:**  
  - If Executors follow defaults and harm occurs → Blame shifts to Designer.  
  - If Nurse/Family fail to intervene in time → Blame hits them, *but students notice the hurdle was set by defaults*.  

  ---

  ### Debrief Framework (Map Game → Theory)  
  | **Game Moment**                  | **Philosophical Link**                                                                 | Discussion Question                                                                 |
  |----------------------------------|----------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | Executors rigidly obeying defaults | "Omission" only exists relative to the programmed baseline ("what happens anyway").   | *"When the patient crashed, was the Executor’s inaction an 'act' or 'omission'? Did the default change your answer?"* |
  | Nurse struggling with forms      | **Costly barriers** = Making omission *easier* than action shifts moral perception.   | *"Did the form feel like a 'positive duty'? How did defaults make intervention harder?"* |
  | Blame tracker showing Designer blame | **Baseline problem**: Moral responsibility is outsourced to the default-setter.        | *"Why did we blame the Designer for what the Executor *didn’t* do?"*                  |
  | Family member’s delayed request  | **Reversal vs. Stopping**: Changing a default requires "new action," unlike letting it run. | *"Was stopping the pump 'redirecting' or 'creating harm'? How did defaults define this?"* |

  ---

  ### Predictable Problems & Fixes  
  1. **Problem:** Executors improvise "sensible" choices.  
     **Fix:** Assign a "Rule Enforcer" (TA or observant student) to penalize groups if Executors deviate. Penalty = Automatic "system failure."  
  2. **Problem:** Designers write overly complex defaults.  
     **Fix:** Give a template: *"The system will [ACTION] unless [CONDITION]."* (e.g., *"Continue insulin unless glucose <70."*)  
  3. **Problem:** Interveners don’t act due to "cost."  
     **Fix:** Make the Patient role visibly suffer (e.g., flip status card to "SEVERE BRAIN DAMAGE" if no action).  

  ---

  ### What the Game *Can’t* Capture  
  - **The core normative debate:** Whether doing/allowing is *inherently* morally distinct (the game presupposes it is).  
  - **Human empathy factors:** Real nurses/doctors experience emotional stress; machines don’t.  
  - **Intentionality:** Humans have motives; defaults are "intentionless" yet bear blame.  

  **Address in Debrief:** *"The game makes us blame the Designer, but does that mean defaults *should* carry moral weight? Or does this expose a flaw in how we assign responsibility?"*  

  ---

  ### Printable Templates  
  - [Default Designer Worksheet](https://tinyurl.com/default-bioethics)  
  - [Intervention Request Form](https://tinyurl.com/bioethics-override)  
  - [Blame Tracker Sheet](https://tinyurl.com/blame-tracker-bioethics)  

  This forces students to *experience* baseline relativity through pressure, rigid roles, and tangible blame-shifting. The physical paperwork makes "costly omission" viscerally frustrating, and the rapid blame votes reveal how quickly we point fingers at the hidden architect. Run it tight, and the debrief writes itself!
