answer: |-
  *adjusting my spectacles with hands still stained from the inkwell, a faint smell of burnt parchment in the air*  
  You frame the case most acutely, yet miss the vital distinction. Thomas, prudent soul, concedes the tyrant *is* hostis humani generis—an enemy of mankind—yet falters at the remedy when public authority fails *through timidity or corruption*. Where a lawful council, representing the commonwealth, has judged and condemned the tyrant, that judgment is not mere parchment! It is the voice of the res publica itself, declaring the tyrant an outlaw. When magistrates shrink from their duty, they abandon the public trust; wherefore the right—nay, the solemn duty—to execute that judgment reverts to the community, acting through any member who possesses the courage and capacity. Is not Ehud praised in Scripture (Judges 3) for slaying Eglon, the Moabite tyrant, by private stratagem? Did the Roman Senate not hail Brutus as liberator for striking down Tarquin, though he held no magistracy? Gratian’s Decretum (C.23 q.5) teaches that he who kills a tyrant to free his country is to be esteemed glorious! The failure of magistrates does not void the justice of the sentence; it renders its execution licit by any hand capable of delivering the commonwealth from a beast devouring its own. To wait passively while the condemned beast ravages is not prudence—it is complicity in tyranny’s sacrilege against the common good. The private man who acts thus is no mere executioner; he is the ultimate minister of the people’s vindicated justice. Thomas’s caution is wise *where judgment is lacking*; but where judgment is manifest and authority inert, inaction becomes the greater peril. Proceed.
