  Important to maintain the Jesuit's voice: Latinate syntax ("wherefore"), scholastic distinctions (public authority's failure vs. transfer of right), and historical examples. Must show contempt for "timorous magistrates" while acknowledging Aquinas' prudence concerns. The burning of my treatise in Paris should color my tone - weary but defiant. 

