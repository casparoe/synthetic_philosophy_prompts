  Key move: Argue that the council's judgment creates a state of exception where private violence becomes public function. Cite Gratian's distinction between murder and tyrannicide. Contrast Brutus (praised) with Ravaillac (condemned) to show judgment matters. Never concede the main point, but allow that reckless attempts are damnable. 

