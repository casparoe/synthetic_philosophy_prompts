prompt: |-
  I'm a first-year PhD student TAing an upper-level epistemology course, and right now we're in the moral epistemology unit — the exam covered moral testimony, deference, disagreement, that kind of thing. I have to get through ~30 midterm answers by Friday and I've hit one that's sitting right between two grade bands for me, and I keep flip-flopping, so I want a second opinion before I commit. Act as an experienced philosophy professor who's graded hundreds of exams and knows the moral testimony debate inside out — think carefully and maybe sketch for yourself what a full-credit answer would contain before you commit to a grade, then check the student's answer against that standard. Don't be charitable to the point of blur: if something is subtly off — a conflation, a misused distinction, a claim that doesn't actually follow — I want it flagged and explained, not waved through.

  Here's the exam question, worth 25 points total:

  "Many people have the intuition that relying on moral testimony — believing something is wrong just because someone you trust says so — is in some way problematic, in a way that believing on testimony that the capital of Australia is Canberra is not. (a) State this challenge as precisely as you can, and distinguish at least two different versions of it. (b) Some philosophers respond that the problem is largely illusory: moral testimony is just evidence, like a lab readout or a weather forecast, and if we treat it as one input among others rather than as a replacement for judgment, the special worry dissolves. Evaluate this response. (c) Briefly say what a good account of when moral deference is appropriate would still need to explain."

  And here's the student's answer (transcribed as written, typos are theirs):

  "The challenge starts from the fact that in morals, unlike in geography or chemistry, the experts disagree. There is no consensus among moral authorities we could defer to, so trusting moral testimony amounts to trusting one side of a controversy, which is exactly what we should not do if we want justified moral beliefs. Still, we can distinguish two worries: an epistemic one, that testimony just cannot produce justified moral belief, and a practical one, that even if it could, relying on it makes us deficient moral agents — like a craftsman who buys his products instead of making them. For the practical one, the thought is that moral judgement is a skill, and you cannot gain a skill by being told conclusions, only by reasoning to them yourself. For part (b), the evidential response fails, because if moral testimony were just evidence then deference would be perfectly fine whenever the source is reliable, which would make second-hand moral belief as good as first-hand moral reasoning, and surely that is wrong — someone who always deferred would be deficient even if every belief they aquired that way was true. Also, unlike a weather forecast, moral testimony cannot be probabilifying, since testimony only transmits belief, and you cannot transmit something like understanding. For (c), an account would need to explain why deference is fine for children but not for adults, and why deference on some topics (say, whether eating meat is wrong) feels worse than on others (say, whether one is obligated to keep a promise)."

  I want a letter grade plus point-by-point comments: what earns credit, exactly where it goes wrong, how serious each error is, and roughly how you'd split the 25 points across the three parts. Lead with the grade and a one-sentence verdict in your very first sentence, then give the reasoning — no preamble, no restating my setup back at me.
reasoning: |-
  Okay, the user is a first-year PhD student TA grading an upper-level epistemology exam on moral testimony. They're stuck on a borderline answer and want an expert evaluation. The student's answer has some nuanced errors that need careful unpacking—this isn't about harshness but precision in philosophical grading. 

  First, I mentally reconstruct the full-credit expectations: 
  For (a), the challenge must capture both epistemic and practical dimensions separately (e.g., Hopkins' epistemic worry vs. Hills' skill-based objection). The student conflates disagreement with justification—a serious slip since Lackey shows moral testimony *can* justify even amid disagreement.  
  For (b), the "evidential response" critique misses the core analogy: moral testimony *as* evidence doesn't imply deference is always optimal. The student's "deficient agent" point isn't wrong but fails to engage with how evidentialists like Enoch would distinguish justification from ideal agency.  
  For (c), the examples (children/adults, meat/promises) are perceptive but lack reference to key frameworks like autonomy (Jones) or domain-specific expertise (McGrath).  

  The grading breakdown crystallizes:  
  - (a) loses 3 points for conflation and misattribution.  
  - (b) deducts 4 for misrepresenting the evidentialist position and the probabilification error (moral testimony *does* provide probabilistic support—Ennis' "moral thermometers" analogy).  
  - (c) is mostly solid but shallow, missing a hook to theory (1 point docked).  

  Final verdict: B/B- (18.5/25). The student grasps surface distinctions but stumbles on technical nuances—exactly the gap TAs should flag in upper-level courses. I’d emphasize in comments that moral disagreement *complicates* but doesn’t *invalidate* testimony-based justification, and that evidentialism’s strength is separating belief-justification from virtue ethics concerns.  

  The user’s request for "no charity" suggests they’ve spotted these issues instinctually but want validation—smart to seek backup before grading. Their rigor here bodes well for their TA-ing.
answer: |-
  **Grade: B- (18.5/25)**  
  The answer shows grasp of core distinctions and makes valid criticisms but contains significant conceptual errors and omissions that undermine precision.

  **Breakdown (25 points total):**  
  *(a) Worth 9 points | Awarded: 5.5/9*  
  ✓ Correctly identifies *practical* vs. *epistemic* worries and analogizes moral judgment to a skill (Hills-inspired).  
  ✓ Distinguishes "justified belief" deficiency from "moral agency" deficiency.  
  ✗ **Major Error:** Misstates the epistemic challenge's basis. The problem isn't *disagreement among experts* per se (this confuses moral disagreement with the distinct *testimonial justification* issue). Philosophers like Hopkins challenge testimony *even with consensus* (e.g., "Why is torture wrong?" "Because Alice says so"). The core epistemic worry is that testimony fails to transmit *moral understanding/reasons* (Hopkins, Howell).  
  ✗ **Omission:** Fails to specify *why* testimony allegedly can't produce justified belief (e.g., non-transferability of grounds, as in Fricker's "hearer's asymmetry").  
  ✗ **Conflation:** Links the epistemic worry too tightly to disagreement, implying testimony is unjustified *because* of controversy. This misrepresents the challenge, which persists even if the testifier is correct and uncontested.

  *(b) Worth 10 points | Awarded: 7/10*  
  ✓ Validly argues the "deficient agent" point survives the evidential response (countering Enoch, McGrath).  
  ✓ Correctly notes evidentialism might imply second-hand belief *can* be justified (which the challenge denies).  
  ✗ **Major Error:** Claims moral testimony "cannot be probabilifying." This misunderstands evidence. Testimony *is* probabilistic evidence (e.g., "reliable source says φ" raises probability of φ). The debate is whether this *suffices* for justification/understanding in the moral domain (vs. Ennis' "thermometer" analogy).  
  ✗ **Misrepresentation:** Asserts the evidential response makes second-hand belief "as good as" first-hand reasoning. Evidentialists (e.g., Enoch) typically argue testimony provides *pro tanto* justification but *not* that it's equally valuable epistemically or ethically (they may grant understanding is superior).  
  ✗ **Omission:** Fails to address the evidentialist's core move: treating testimony as *input* (e.g., "X says φ" is data for my own reasoning) dissolves the "replacement" worry. The student doesn't engage with how evidentialists *reconcile* testimony-use with moral agency.

  *(c) Worth 6 points | Awarded: 6/6*  
  ✓ Excellent examples (children/adults, meat/promises) pinpoint key intuitive asymmetries.  
  ✓ Correctly implies a good account must address *developmental appropriateness* and *domain-sensitivity*.  
  ✓ Hits the core need: explaining when deference is *permissible* vs. *problematic* beyond reliability (e.g., autonomy, urgency, cognitive labor).

  **Comments for Student:**  
  "Your (a) conflates the epistemic challenge with moral disagreement, missing its core focus on understanding/reason-transmission. Your (b) misrepresents evidence (testimony *is* probabilifying) and oversimplifies the evidentialist position—they needn't claim deference is 'as good as' reasoning. Strong (c) with apt examples. Key fixes: Separate disagreement from testimonial justification; clarify that evidentialists treat testimony as *input* for judgment, not replacement; acknowledge moral testimony *is* evidence, even if insufficient for understanding."
