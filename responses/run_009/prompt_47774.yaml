  We are constructing a Q&A prep sheet for a presentation on the commissive theory of state apology. The audience segments are:
    1. Speech-act theorists (Austinian): concerned with whether a collective can perform a commissive act and stand behind it.
    2. Transitional-justice scholars: concerned that the theory makes apology hostage to budget cycles and downplays symbolic value.
    3. Political realists: see sincerity conditions on states as a category error.
    4. One nationalist-minded member: worried that the mandate condition turns apology into a permanent referendum.

