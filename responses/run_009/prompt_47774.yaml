          "reply_if_it_comes": string (salvage attempt, honestly labeled if salvage)
          "the_one_that_must_land": string (the single reply that must work, else the session fails) and a note on why

   Let's brainstorm the objections:

   1. From speech-act theorists (Austinian):
      - How can a state, as a corporate agent, be said to have the capacity to commit itself in the way an individual does? Isn't the official just ventriloquizing without the state being able to stand behind its word?

   2. From transitional-justice scholars:
      - By tying the validity of an apology to the fulfillment of a remedial program, you are making the apology conditional on budget allocations and political will that are inherently unstable. Doesn't this undermine the independent symbolic and ritual value of an apology for victim communities?

   3. From political realists:
      - States are not moral agents and cannot have intentions or sincerity. How can we impose conditions of sincerity on an entity that is fundamentally an amoral mechanism for power?

   4. From the nationalist-minded member:
      - Your mandate condition turns every apology into a perpetual referendum on national self-accusation, which is politically unworkable and undermines the goal of closure.

   5. From transitional-justice scholars (another angle):
      - Your theory ignores the fact that an apology, even without immediate remedial action, can be a crucial first step in a longer process of reconciliation. Doesn't your nullification thesis risk dismissing such steps as worthless?

   6. From speech-act theorists (another angle):
      - If the state is the same corporate agent over time, how do you account for radical regime changes? If a new regime comes to power that repudiates the old regime, can it still be bound by an apology made by the previous regime?

   7. From transitional-justice scholars (symbolic value):
      - Many communities value the recognition and validation that comes with an official apology, even if reparations are not fully realized. Doesn't your theory dismiss their experience?

   8. From political realists (another angle):
      - Your entire theory seems to anthropomorphize the state. States don't have emotions or moral commitments; they have interests. Why force them into a moral framework that doesn't fit?

   9. From the nationalist-minded member (another angle):
      - Doesn't your retroactive nullification create an endless cycle of blame? If an apology is nullified because a future government defunds the program, then the original wrong is not only unaddressed but the state is now guilty of having deceived the victims. This seems to exacerbate rather than heal.

