  But for the standard interpretation or for our universe, we don't have that relativity.

  But in first-order logic, there is no standard model, so it might be tricky.

  However, we can accept relativity for formal models but not for the intuitive notion.

  But that might not be satisfactory.

  I think rejecting step 4 is the way to go.

