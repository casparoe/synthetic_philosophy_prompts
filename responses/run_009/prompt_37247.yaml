  In the case of Skolem's paradox, that's exactly what's happening.

  So for the argument, step 4 is the error: it assumes that countability is absolute, but it's not.

  Therefore, M's reals are countable relative to the metatheory but uncountable relative to M itself. No contradiction.

  Then step 6 and 7 don't follow; we don't have to say that for V, it's relative in the same way, or at least, we can maintain that from within V, the reals are uncountable, and that's the only perspective we have.

  Moreover, for mathematics, we work within our foundational system, so cardinalities are determinate there.

  Now, about the tension I mentioned: in step 3, when we say "M is countable", this is from our perspective, absolutely in the metatheory. Similarly, when we say that in V the reals are uncountable, that's from within V.

  But V might not be a set; it's the universe, so we can't have an external perspective.

  In the case of M, M is a set in our universe, so we can talk about it externally.

  For V, there is no external universe, so we can't say that V is countable from outside; there is no outside.

