answer: |-
  Here’s a structured 90-minute session plan targeting the core tensions between disciplines, preempting misconceptions, and deepening engagement with Friedman’s "F-twist":

  ---

  ### **Session Structure**  
  *(Timings are flexible; focus on dialogue over coverage)*  

  #### **Part 1: Framing the Puzzle (0–20 min)**  
  **Goal:** Make the F-twist *plausible*, not defensible.  
  - **Opening Question (5 min):** *"Why would anyone think a theory with false assumptions could be scientifically valuable?"*  
    - Elicit initial reactions from economists (e.g., "Assumptions are scaffolding—only predictions matter") vs. philosophers (e.g., "False premises can’t support sound inferences").  
  - **Key Move (10 min):** Introduce **"as if"** as Friedman’s escape hatch. Clarify:  
    - It’s *not* "false assumptions are harmless" but "agents behave *as if* assumptions hold, making predictions reliable."  
    - Example: *Trees "compute" Fibonacci sequences to optimize sunlight—no consciousness needed.*  
  - **Why This Matters (5 min):** Establish that "as if" separates *causal explanation* from *predictive reliability*. Friedman cares only about the latter.  

  #### **Part 2: The Central Example: Billiard Players (20–50 min)**  
  **Why Billiards?** It’s concrete, tests predictive vs. explanatory power, and forces confrontation with "unrealism."  
  - **Friedman’s Claim (5 min):** *Billiard players act "as if" they know physics/math, even if they don’t. Predictive success justifies the model.*  
  - **Debate Catalyst (25 min in small groups):** *"Is this a strength or dodge? Compare to physics: Do we say planets orbit 'as if' obeying gravity, while denying gravity?"*  
    - **Economists’ Predictable View:** "Billiards shows prediction trumps realism—the player’s cognition is irrelevant."  
    - **Philosophers’ Pushback:** "But physics *explains why* planets orbit; billiards only *describes* outcomes. Where’s the *theory*?"  
  - **Why Alternatives Fail:**  
    - *Falling bodies in a vacuum:* Too easily defensible as "negligible air resistance" (domain restriction).  
    - *Arbitrage clearing:* Too abstract; lacks "cognitive unreality" tension.  
    - **Billiards wins** because it’s *maximally jarring*: false assumptions about cognition, yet predictive.  

  #### **Part 3: Musgrave’s Taxonomy & Salvage Operation (50–70 min)**  
  **Goal:** Test if Musgrave rescues or replaces Friedman.  
  - **Introduce Musgrave’s Types (10 min):**  
    - *Negligibility* (air resistance): Harmless simplification.  
    - *Domain* (perfect competition): Limits where the theory applies.  
    - *Heuristic* (profit maximization): Fiction guiding discovery.  
  - **Critical Question (10 min):** *"Which type fits Friedman’s billiard player? Does Musgrave legitimize the F-twist or betray it?"*  
    - **Key Insight:** Friedman treats *all* assumptions as negligible/heuristic. Musgrave shows some are *domain-specific* (e.g., perfect competition).  
    - **Economists’ Risk:** Conflating heuristic assumptions with negligibility.  
    - **Philosophers’ Risk:** Seeing domain assumptions as refuting Friedman (but he never required *universal* applicability).  
  - **Verdict:** Musgrave *refines* the F-twist by showing *which* unrealism is excusable, but Friedman’s original stance (all assumptions "as if") is weaker.  

  #### **Part 4: Predictable Misconceptions & Preemption (Thread throughout)**  
  Preempt *before* they entrench:  
  - **"Assumptions don’t matter" (Head off in Part 1):** Stress Friedman says *some* false assumptions are excused *if predictive*, not that *any* falsehood is tolerable.  
  - **"F-twist = instrumentalism" (Preempt in Part 2):** Clarify: Instrumentalism denies *any* truth-value to theories; Friedman allows theories to latch onto *patterns* (e.g., billiard player *really does* act optimally).  
  - **"Same as Galilean idealization" (Correct in Part 3):** Galilean models (e.g., frictionless planes) are *approximations*; Friedman’s billiard player is a *counterfactual pattern*.  
  - **"Licenses desired predictions" (Combat in Part 4):** Note Friedman’s demand: *Testable predictions*. "Assume firms are profit-maximizers" works if it predicts; "assume pixies set prices" won’t.  

  #### **Closing (70–90 min)**  
  - **Diagnostic Question (5 min):**  
    *"Why might 'firms maximize profits' be a false-but-excused assumption, while 'firms are run by witches' is false-but-unexcused?"*  
    **Answer:** The first yields *systematically accurate predictions across contexts*; the second is *ad hoc/unpredictive*. Shows grasp of Friedman’s empirical criterion.  
  - **What We Won’t Settle (5 min):**  
    *"Whether prediction is the *only* goal of science. Friedman prioritizes prediction; others demand explanation. This debate underpins the F-twist but requires epistemology we can’t resolve today."*  
    **Why:** Forces acknowledgment that disciplinary values (economics vs. philosophy) shape the disagreement—deepening mutual respect.  

  ---

  ### **Why This Works**  
  - **Billiards over Arb:** Billiards forces cognitive dissonance; arbitrage is "too economic" to challenge philosophers.  
  - **Musgrave’s Placement:** After Friedman’s example, it becomes a tool for critique, not a distraction.  
  - **End on Open Question:** Highlights that the F-twist debate rests on deeper divides about science’s aims—leaving students with a lens to analyze future methodological clashes.  

  This plan treats both cohorts as intelligent but partial, using friction to illuminate why Friedman’s move seemed revolutionary to some and incoherent to others.
