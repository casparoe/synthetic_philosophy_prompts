prompt: |-
  So heres my situation: I spent about thirty-five years doing population genetics on beetles before retiring, and now that I finally have time to read properly I've fallen down the rabbit hole of the units of selection literature. What started as gene vs. individual vs. group arguments in the 60s and 70s seems to have turned into this sprawling thing — replicators vs. vehicles, interactors, MLS vs. kin selection bookkeeping, the whole "is it all just accounting, like the same spreadsheet in different fonts" question. Some of it strikes me as genuinely important, some of it as forty years of people talking past each other, and I'm honestly not sure which parts are which anymore.

  If you could put together a small working group — say one philosopher of biology, one theoretical evolutionary biologist, and a sharp grad student — and give them two or three years on the open questions in this debate, which would you tell them to work on, in what order, and why? For each one I'd want the actual reasoning: does anything downstream in biology or philosophy hinge on how it gets resolved, or is it self-contained? Is it tractable with the tools those folks actually have, or does it secretly require data nobody can get? Is it neglected, or is half the field already on it? A couple of things I'd especially like your take on: (a) whether the whole gene-selectionism vs. multilevel-selection framing dispute is basically settled-as-equivalent and people should just move on, or whether there's still a substantive fight left there; (b) whether the applied spinoffs are real or hype — e.g., does getting clear on units of selection actually matter for virulence management in pathogens, or for treating tumors as evolving populations of cells where the "group" is the patient's body, or is that just people borrowing the debate's prestige for grant applications; and (c) whether ecosystem- or community-level selection, including the microbiome stuff, is a serious extension of the framework or a category error dressed up as a research program. And tell me what sort of development over the next few years — a conceptual result, a case study, something empirical — would make you reshuffle the priority list.

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble, no restating my question back at me, and no reading list — I want your ordering and your justification, not a bibliography.
reasoning: |-
  Okay, let me tackle this user's query. They're a retired population geneticist who's diving into the units of selection literature and feeling overwhelmed by the debates. They want a prioritized list of open questions for a hypothetical working group, focusing on what's substantive versus just academic noise. 

  First, I need to unpack their three specific concerns: (a) gene vs multilevel selection equivalence, (b) applied value in virulence/tumor contexts, and (c) ecosystem-level selection validity. The user clearly values practical impact - they're skeptical of purely semantic debates and want to know where biology or philosophy would actually change based on resolutions.

  Hmm, their background in beetle population genetics matters here. They've seen real-world evolutionary processes, so abstract theoretical fights probably frustrate them. The "spreadsheet in different fonts" analogy suggests they suspect much of the debate is terminological. But they're open to being wrong - that "genuinely important" comment is key.

  For prioritization, I should consider:
  - Tractability: Can a small group make progress in 2-3 years?
  - Downstream impact: Would resolving this change research or applications?
  - Neglectedness: Are others already solving it?

  The gene-selection equivalence question feels most urgent. If it's truly settled, it could prevent wasted effort. But recent work on genomic architecture (like Holobionts) suggests there might be unresolved nuances. This connects directly to their applied interest in tumors and pathogens - if gene-centric models miss higher-level interactions, that matters clinically.

  For applied spinoffs, I recall virulence management uses Price equation frameworks. But is this actually improving outcomes? Maybe the group should pressure-test specific cases like antibiotic rotation protocols. The tumor evolution angle seems more speculative - cool idea, but limited real-world adoption so far.

  Ecosystem selection is the riskiest. It's either revolutionary or a category error. The microbiome complicates things - if host-microbe coevolution counts as "group selection," that could redefine individuality. But operationalizing this for experiments is brutally hard. A few well-designed microbial community studies might tip the balance.

  Biggest surprise in my reading: the "vehicles vs interactors" debate might be more practical than I thought. If we can rigorously define when a group becomes an evolutionary individual (e.g., through compartmentalization in cancer or biofilms), that could unify theories.

  What would make me reshuffle? Empirical results showing MLS matters in cancer treatment resistance, or a philosopher nailing down necessary/sufficient conditions for group individuality. Either could force reorganization of the whole framework.

  The grad student role is crucial here - they'd bridge the theorist's models and philosopher's concepts with actual data. Their fresh eyes might spot where old battles are truly obsolete.
answer: |-
  Here's your prioritized agenda:

  1.  **Resolve the equivalence/utility question of gene-selection vs. MLS/kin frameworks for evolutionary modeling and prediction.** *Why:* This is foundational. If truly equivalent (different accounting), vast theoretical effort is wasted debating semantics. If not, core evolutionary theory needs refinement. Downstream impact is huge: it dictates how we model adaptation, design experiments, interpret data across biology. It's tractable: conceptual analysis by the philosopher, modeling by the biologist (e.g., comparing predictions in complex scenarios like social traits with non-additive fitness effects), validated by the grad student with case studies (e.g., obligate vs. facultative sociality). Neglected? No, but often argued poorly. **Your (a)**: It's *mostly* settled as formally equivalent *for many cases* via Price equation, but substantive fights remain about: (i) **Causal adequacy**: Does the gene's-eye view *explain* the emergence of higher-level functionality, or just describe it? (ii) **Tractability/Parsimony**: Which framework yields better predictions or simpler models for complex traits (e.g., major transitions, genomic conflict)? (iii) **Heuristic value**: Which framework better guides empirical discovery? *This* is the substantive core needing clarity.

  2.  **Empirically validate and refine the practical utility of units-of-selection thinking in applied evolutionary dynamics (virulence, cancer).** *Why:* Potential high-impact payoff in medicine. Does distinguishing levels (e.g., cell vs. tumor vs. patient) lead to better interventions? Or is standard population genetics sufficient? Downstream impact is direct: treatment strategies. Tractability is good: philosopher clarifies conceptual links (e.g., defining "vehicle" in a tumor), biologist develops/test models (e.g., MLS models of metastasis vs. cell-level selection), grad student analyzes clinical/microbial evolution data. **Your (b)**: It's **both real and hype**. *Real*: Framing tumors as multi-level systems informs understanding of therapy resistance (targeting cooperative cell behaviors). Framing virulence involves conflict between pathogen levels (within-host vs. between-host). *Hype*: Overclaiming novelty ("just group selection rebranded") or ignoring that standard models often suffice. *Crucial question*: Does the *specific units framework* generate *novel, testable, and clinically actionable predictions* unavailable via standard population genetics? Prioritize this to cut through the hype and identify genuine value.

  3.  **Establish rigorous criteria for when multispecies communities/ecosystems can be legitimate units of selection and design tractable tests.** *Why:* Expands evolutionary theory's scope, relevant to microbiome/host coevolution, ecosystem resilience. High risk/reward: could be revolutionary or a dead end. Downstream impact: ecology, conservation, understanding major transitions. Low tractability: Major conceptual hurdles (defining individuality, inheritance, fitness for communities), immense empirical difficulty controlling variables. **Your (c)**: **Potentially serious but plagued by category error risks.** Key is defining *heritable variation in fitness* at the community level *due to community properties*. Microbiomes are the best test case (inheritance via vertical transmission/founding). *Category errors abound*: Mistaking coevolution or community assembly for selection *on* the community. The group must ruthlessly enforce operational definitions. Neglected in *rigorous* form; much speculative literature exists.

  **What would reshuffle priorities?**
  *   **A clear conceptual result** proving deep, irreconcilable differences (beyond heuristics) between gene/MLS frameworks would elevate #1 further.
  *   **Definitive empirical success** (e.g., a virulence management/cancer therapy protocol demonstrably improved *because* it targeted a specific level) would rocket #2 to the top.
  *   **A robust experimental demonstration** of community-level selection in a controlled microbial system meeting strict criteria would make #3 tractable and urgent. Conversely, repeated failures would deprioritize it.
