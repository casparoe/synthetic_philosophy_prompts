prompt: |-
  I'm taking a seminar on Strawson's Freedom and Resentment, and I keep running into something I can't find a label for. Excuses and what Strawson calls exempting conditions seem to work selectively: when we learn that a harmful act issued from coercion, severe mental illness, or a childhood that explains everything about the person, resentment and indignation dissolve. But the same kind of causal story, told about a friend's kindness or a benefactor's generosity, seems to leave gratitude untouched — at most it adds understanding, and often it deepens the attachment. The asymmetry feels puzzling: if what defeats resentment is that the act traces back to factors outside the agent's control, then gratitude looks exactly as exposed, since the benefactor's character is a product of the same kind of luck. Yet nobody thinks that learning about someone's fortunate upbringing is a defeater for gratitude, the way the parallel story about an unfortunate upbringing is a defeater for resentment. Does this asymmetry — negative reactive attitudes being hostage to excuses in a way positive ones are not — have an established name? I'm aware of Strawson's suggestion that the reactive attitudes form a web that cannot be selectively abandoned, and I know the moral luck literature, but neither is about the asymmetry itself, and they seem to pull in opposite directions on whether it is even coherent to keep gratitude while giving up resentment. If there is no standard term, please coin one, define it precisely, and draw its boundaries: does it cover third-party indignation as opposed to personal resentment, attitudes like pride and shame, and cases where someone explains their own good deeds causally?
reasoning: |-
  Okay, the user is studying Strawson's "Freedom and Resentment" and noticed an asymmetry between how excuses affect negative vs. positive reactive attitudes. They point out that excuses like coercion or mental illness dissolve resentment but don't seem to touch gratitude. Even when a benefactor's kindness stems from fortunate upbringing, gratitude remains intact. The user is looking for a term to describe this asymmetry and wants to know if it applies to other attitudes like indignation, pride, or shame.

  First, I need to recall Strawson's framework. He distinguishes between reactive attitudes (like resentment and gratitude) and objective attitudes (viewing someone as not responsible). Excuses and exemptions shift us from reactive to objective. But the user's observation is that this shift only happens for negative attitudes, not positive ones. 

  The user mentions moral luck literature. Nagel's moral luck problem shows that responsibility is influenced by factors beyond control, which challenges fairness. But again, gratitude isn't questioned the same way resentment is. So why the asymmetry? The user might be seeking a term that captures this resilience of positive attitudes versus the fragility of negative ones.

  Looking for existing terms: "Asymmetry of Excuse" or "Gratitude's Immunity" come to mind, but I'm not sure if they're established. Susan Wolf's "Asymmetry of Blame and Praise" discusses how praise isn't undermined by determinism like blame is. Maybe that's relevant. But the user wants a specific term for the reactive attitudes context.

  The user also asks if this applies to third-party attitudes like indignation versus resentment. Strawson groups resentment and indignation together as negative, so the asymmetry should hold. But for pride and shame, it's trickier. Explaining one's own good deeds causally might not diminish pride, similar to gratitude. Shame, however, might persist even with excuses because it's more about self-perception than responsibility.

  The user's deeper need might be understanding why this asymmetry exists. They might be grappling with the coherence of holding onto positive attitudes while letting go of negative ones. They referenced Strawson's "web" of attitudes, suggesting abandoning one might unravel others. But the asymmetry challenges that. So the user could be seeking validation that their observation is recognized in philosophy, possibly for their seminar work or paper.

  I should check if there's a coined term. After a mental search, it seems no standard term exists. So proposing a new term like "Affective Asymmetry of Responsibility Responses" (AARR) makes sense. Define it precisely, noting it's selective vulnerability of negative attitudes to excuses/exemptions. Boundaries: covers third-party indignation, pride/shame (with caveats), and self-attributions. 

  Also, address why this asymmetry exists. Maybe positive attitudes serve different social functions—reinforcing bonds versus protecting from harm. Gratitude maintains relationships, while resentment's dissolution prevents conflict. This functional difference could explain the asymmetry. The user might need this for their argument in the seminar.
answer: |-
  This is a profound and beautifully articulated observation about a genuine asymmetry in our responsibility practices. You're right that while Strawson himself notes the parallel structure of positive and negative reactive attitudes, he doesn't explicitly name or deeply analyze *this specific asymmetry* in their susceptibility to causal explanations/exemptions. The literature hasn't settled on a single, universally accepted term for it, though it's widely recognized.

  Here's a breakdown, including a proposed term and its boundaries:

  1.  **Established Discussions & Near-Misses:**
      *   **Strawson's Framework:** You correctly note that Strawson treats excuses (justifying the *act*) and exemptions (justifying the *agent* - childhood, coercion, madness) as dissolving *both* resentment/indignation *and* gratitude (when the "good" act is excused/exempted). However, your observation highlights that in practice, *exemptions* seem far more effective at dissolving the *negative* attitudes than the *positive* ones when applied to the *source* of the disposition (like upbringing).
      *   **Moral Luck (Nagel, Williams):** This directly confronts the problem of responsibility being contingent on factors beyond control ("constitutive luck"). The "Problem of Moral Luck" *is* the overarching framework where this asymmetry lives. Nagel specifically notes the asymmetry: we find it intuitive to withhold blame for bad actions due to constitutive luck, but feel no similar pull to withhold praise for good actions due to the same luck. However, "moral luck" names the *problem*, not the specific *asymmetry in reactive attitude dissolution*.
      *   **Asymmetry of Blame and Praise (Susan Wolf, others):** Philosophers like Susan Wolf ("Asymmetry and Praise") explicitly argue for an asymmetry in our practices: determinism (or deep causal histories) seems to threaten blameworthiness more directly than praiseworthiness. This is very close. "Asymmetry of Blame and Praise" is a recognized phrase, but it's often discussed in the context of *desert*, *retribution*, or *ultimate responsibility*, rather than specifically focusing on the *dissolution of the reactive attitudes* as Strawson defines them. It also tends to be broader than just exemptions.
      *   **Gratitude's Resilience / Excuse-Immunity:** Some discussions (e.g., in work on gratitude by McConnell, Manela, or in commentaries on Strawson like Bennett's) note gratitude's relative robustness compared to resentment in the face of certain explanations, but without a single standard label for the phenomenon.

  2.  **The Coined Term & Definition:**
      Given the lack of a universally accepted term *specifically* for this asymmetry in the *dissolution of reactive attitudes by exempting conditions*, and drawing on your precise description, I propose:

      > **Affective Asymmetry of Responsibility Responses (AARR)** or **Reactive Attitude Dissolution Asymmetry (RADA)**

      *   **Definition:** The empirically observable and normatively significant phenomenon whereby exempting conditions (e.g., coercion, severe mental illness, formative constitutive luck undermining agential competence) reliably dissolve or significantly mitigate *negative* participant and vicarious reactive attitudes (resentment, indignation, blame) directed towards the source of unwelcome or harmful conduct, but fail to dissolve, and may even sometimes enhance or deepen, *positive* participant reactive attitudes (gratitude, approbation) directed towards the source of welcome or beneficial conduct, even when the positive disposition or action is traced to the same types of constitutive luck or exempting factors.

  3.  **Drawing the Boundaries (Applying the Term):**
      *   **Third-Party Attitudes (Indignation vs. Resentment):** **Yes, AARR/RADA covers this.** Strawson groups resentment (first/participant) and indignation (third/vicarious) together as the negative "retributive" reactive attitudes susceptible to exemptions. The asymmetry holds: learning the perpetrator of a harm suffered by *another* was severely mentally ill dissolves our indignation just as it dissolves the victim's resentment. Learning the source of a *benefit* to another was mentally ill (e.g., a delusion driving philanthropy) typically does *not* dissolve our vicarious approval/approbation in the same way; we might find it poignant or strange, but the *positive* valence towards the *benefit* and its source often persists.
      *   **Self-Directed Attitudes (Pride and Shame):** **AARR/RADA applies here, but with nuances.**
          *   *Shame:* Functions somewhat like the negative attitudes. Learning my *harmful* action stemmed deeply from constitutive luck or an exempting condition (e.g., "I was raised that way, I couldn't help it") *can* mitigate shame by shifting focus from my flawed self to my damaged history/fate. It offers an explanation that lessens the sting of self-condemnation. (Though shame can be stubborn!).
          *   *Pride:* Functions more like gratitude. Learning my *beneficial* action or character stemmed from constitutive luck (e.g., "I was raised well, I had great role models") typically does *not* dissolve pride. It might contextualize it ("I'm fortunate"), but the positive feeling about the achievement or trait itself usually remains intact, and the explanation might even enhance appreciation for the lucky factors. Pride seems resistant to dissolution by the *source* of the good disposition in a way shame is not for the bad. Explaining my *own* good deeds causally doesn't usually erase pride.
      *   **Self-Attributions of Good Deeds:** **Yes, covered under Pride (as above).** Explaining my kindness as caused by my fortunate upbringing doesn't make me *ungrateful* for my own disposition or less *proud* of acting kindly. It adds understanding, perhaps humility about my luck, but the positive self-reactive attitude persists.
      *   **Excuses vs. Exemptions:** **Crucial Distinction.** AARR/RADA primarily targets *exempting conditions* (affecting the *agent*'s status). Genuine *excuses* ("I broke your vase because I was pushed") *do* seem to dissolve gratitude *for the specific act* if the apparent benefit wasn't intentional or was forced ("He only saved me because he was shoved into the path of the bullet"). The core asymmetry is in how *constitutive luck/exemptions* targeting the *source of the disposition* impact positive vs. negative attitudes.

  4.  **Why the Asymmetry? (Briefly - the core puzzle):**
      You've hit the nail on the head. The common justification for dissolving resentment via exemptions is the lack of control/true agency. If consistency demands applying the same standard, gratitude should dissolve too. Possible explanations often cited for the asymmetry include:
      *   **Functional Difference:** Negative attitudes primarily serve to protect us from harm and demand repair. If the source isn't a competent agent, the protective/demand function is pointless or cruel. Positive attitudes primarily serve to build and maintain valuable social bonds. Dissolving gratitude upon learning of constitutive luck might actively *harm* those bonds without a clear protective benefit. The social utility differs.
      *   **Focus of the Attitude:** Resentment focuses intensely on the *agent as responsible source* of the harm. Exemptions directly undermine this. Gratitude focuses more on the *benefit received* and the *relationship* it signifies or fosters. While agency matters, the value of the benefit and the bond can persist even if the agent's disposition was luck-based.
      *   **The "Problem" of Good Luck:** We generally don't perceive good constitutive luck *itself* as something that *undermines* the value of the resulting good character or action in the same way bad luck *taints* the bad character/action. We celebrate the outcome regardless of its origins in a way we don't condemn the outcome regardless of origins.

  **In summary:** While the overarching issue is Moral Luck and the specific asymmetry is often discussed as the Asymmetry of Blame and Praise, there isn't a universally accepted term *specifically* for the asymmetry in the *dissolution of reactive attitudes by exempting conditions/constitutive luck* that you've so clearly identified. **Affective Asymmetry of Responsibility Responses (AARR)** or **Reactive Attitude Dissolution Asymmetry (RADA)** precisely captures this phenomenon. It robustly covers third-party indignation, applies to self-directed attitudes (pride/shame) with the noted nuances regarding shame's mitigation versus pride's resilience, and includes cases of self-attribution of good deeds. This asymmetry highlights a fascinating tension within our responsibility practices that Strawson's framework exposes but doesn't fully resolve. It's a fantastic topic for deep seminar discussion!
