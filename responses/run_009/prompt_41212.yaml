  **NeuroSyn™ Gradual Neuron Replacement Therapy**
  **Patient Information Leaflet**
  **PL 20483/1172**

  **Read all of this leaflet carefully before you decide to undergo NeuroSyn™ Therapy. Keep this leaflet. You may need to read it again.**

  **What NeuroSyn™ Therapy is and what it is used for**
  NeuroSyn™ Gradual Neuron Replacement Therapy is an elective medical procedure designed to replace your biological neurons with functionally identical synthetic substitutes over an extended period (typically 3-7 years). The process occurs in discrete stages, replacing several thousand neurons per session. NeuroSyn™ Therapy is indicated for individuals seeking enhanced neural resilience, reduced biological ageing effects within the central nervous system, or as a preventative measure against neurodegenerative conditions. The synthetic neurons perform all standard electrochemical functions of biological neurons.

  **Before you begin NeuroSyn™ Therapy**
  *   A full neurological and psychological baseline assessment is mandatory.
  *   Discuss any existing medical conditions or medications with your clinician.
  *   Ensure you understand the long-term commitment and scheduling requirements.
  *   Inform your clinician if you have a history of ontological anxiety or identity dysphoria.
  *   **Do not undergo this procedure if:**
      *   You are under 25 years of age (neurological development must be complete).
      *   You have an active, unstable psychiatric condition.
      *   You are pregnant, planning pregnancy, or breastfeeding (safety not established).
      *   You are unable or unwilling to commit to the full course of scheduled replacements. *(See Section 5: Important Considerations Regarding Continuity)*.
      *   You plan to create parallel biological and synthetic substrates during the migration period ("off-label branching").

  **How NeuroSyn™ Therapy is performed**
  1.  Under local anaesthetic and light sedation, a cranial access port is fitted.
  2.  Using precision nanoscale techniques, a small cohort of your biological neurons is deactivated and removed.
  3.  Pre-calibrated synthetic NeuroSyn™ neurons are introduced and integrated into the existing neural network.
  4.  Functionality is verified in real-time before concluding the session.
  5.  This process repeats at scheduled intervals (e.g., monthly) until replacement is complete. The access port is removed upon programme conclusion.

  **Possible Complications (Adverse Events)**
  Like all medical procedures, NeuroSyn™ Therapy can have side effects. Most are mild and temporary. Report any persistent or severe side effects to your clinician immediately.

  **Very Common (may affect more than 1 in 10 people):**
  1.  Mild headache post-procedure.
  2.  Temporary scalp tenderness or itching around the access port site.
  3.  Short-term (<24 hours) cognitive fog or mild disorientation.
  4.  Vivid dreams for 1-3 nights following a session.

  **Common (may affect up to 1 in 10 people):**
  5.  Minor, transient fluctuations in mood or affect.
  6.  Temporary alterations in sensory perception (e.g., taste, smell) lasting <48 hours.
  7.  Mild nausea following anaesthesia.

  **Uncommon (may affect up to 1 in 100 people):**
  8.  Localised infection at the access port site (requires antibiotics).
  9.  Persistent mild headache (>72 hours).
  10. Temporary episodic memory recall difficulty resolving within one week.
  11. Subjective reports of altered phenomenological experience ("fading qualia" - see FAQ 7). This is not considered clinically significant if cognitive function remains within baseline parameters.

  **Rare (may affect up to 1 in 1000 people):**
  12. Allergic reaction to synthetic components or anaesthetic.
  13. Unexpected neural network integration issues requiring corrective intervention.
  14. Significant anxiety related to procedural milestones. Counselling is available.

  **Very Rare (may affect up to 1 in 10,000 people):**
  15. Major integration failure requiring suspension of the programme.
  16. Cerebrospinal fluid leak (requires surgical repair).

  **Important Considerations Regarding Continuity**
  *   **Procedural Completion:** NeuroSyn™ Therapy is designed as a continuous programme. The manufacturer guarantees functional and experiential continuity *only* upon successful completion of the *entire* replacement schedule. **Liability is expressly disclaimed for any questions of numerical identity or subjective continuity arising from a procedure aborted or suspended at any stage prior to 100% synthetic integration.** For clinical management purposes during an ongoing programme, the patient is treated as a single, continuous entity.
  *   **Off-Label Branching:** Creating and running parallel biological and synthetic substrates simultaneously ("branching") is strictly **off-label** use. This bypasses safety protocols, **voids the manufacturer's continuity guarantee entirely**, and may result in **two distinct experiential outcomes. Only the outcome associated with the primary, clinically managed synthetic substrate is covered under warranty or support agreements.** The biological remnant is not supported.

  **Frequently Asked Questions (FAQ)**
  1.  **Q: Will I feel different?** A: Most patients report feeling entirely like themselves throughout the process. Minor, transient side effects (like headache) are possible but resolve quickly. Core personality and memories are functionally preserved.
  2.  **Q: How long does the whole process take?** A: Duration varies based on individual neural density and replacement schedule, typically 3-7 years. Your clinician will provide a personalised timeline.
  3.  **Q: Can I stop partway through?** A: You may elect to suspend or terminate the programme at any time. However, be aware this may leave you with a hybrid biological/synthetic neural network. See Section 5: Important Considerations Regarding Continuity. Consult your clinician about implications.
  4.  **Q: My relative is considering this. Is the person who walks out at the end the same person who walked in?** A: NeuroSyn™ Therapy is designed to ensure seamless functional and psychological continuity. The individual completing the programme will possess the same memories, personality traits, and behavioural patterns as when they began, now housed within a more resilient synthetic substrate. For administrative, legal, and clinical purposes, they are considered the same person.
  5.  **Q: Are there any long-term risks?** A: Long-term studies (>20 years) show excellent durability of NeuroSyn™ neurons. Ongoing monitoring is recommended as standard. No unexpected long-term behavioural deviations have been observed beyond statistical norms.
  6.  **Q: Will my thoughts feel artificial?** A: No. NeuroSyn™ neurons replicate the electrochemical functions of biological neurons precisely. Thought processes remain natural and indistinguishable.
  7.  **Q: The leaflet mentions "fading qualia". What does that mean?** A: A very small number of patients report a subtle, subjective sense that sensory experiences (like the colour red or the taste of coffee) feel less vivid or "distant" over time. This is a reported phenomenological experience, not a measurable dysfunction. Cognitive performance and behavioural responses remain entirely normal. Counselling can help manage this perception if it occurs. It is not listed as a formal side effect as it does not impact clinical function.

  **Reporting Side Effects**
  If you get any side effects, talk to your doctor, pharmacist, or nurse. This includes any possible side effects not listed in this leaflet. You can also report side effects directly via the Yellow Card Scheme at [www.mhra.gov.uk/yellowcard](www.mhra.gov.uk/yellowcard). By reporting side effects you can help provide more information on the safety of this procedure.

