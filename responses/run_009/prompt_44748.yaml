prompt: |-
  I'm on the curriculum committee of a smallish department, and something keeps happening that I can't find a name for. Last month we were deciding whether to make a stats course mandatory for the major. Everyone accepted (it's basically written into our bylaws) that the course should be mandatory if and only if it both (a) covers material students can't get anywhere else in the program and (b) students reliably struggle without it. We voted on (a): 4-3 yes. We voted on (b): 4-3 yes. Then someone said, great, so it's mandatory. And the room errupted, because when we finally took the direct vote on "should it be mandatory," it came out 4-3 no. Here's the thing: every single member of the committee was perfectly consistent in their own views. Three people were yes/yes, three were no/no, and there were two people who split (one yes on (a) no on (b), one the reverse). It's the committee as a body that ended up believing an inconsistent package: majority yes on the premises, majority no on the conclusion that follows from the premises by rules the group itself had signed off on. The same thing happened again last week with a hire -- the ad listed two required qualifications, a majority of us thought the candidate met each one, and yet the straight up-or-down hire vote went against her. So now I'm wondering whether we just have weird bylaws or whether this is a thing.

  I know about Condorcet's paradox, the rock-paper-scissors cycles thing, but that's not this. Nobody has cyclical preferences, every individual is fine, it's only the group-level set of accepted propositions that's incoherent. And I gather Arrow's theorem is somewhere in the neighborhood, but that's about people ranking candidates and independence of irrelevant alternatives and so on, whereas what I've got is people giving yes/no answers to propositions tied together by an "if and only if" that everyone accepts. So my questions: does this exact configuration have an established name and literature behind it, and if so how is it usually stated and how is it distinguished from Condorcet and from Arrow, since people keep telling me those are the relevant results and neither seems to be? And if nothing in the literature captures it exactly, then I'd want you to say so honestly and then coin a term for it with actual edges -- does it only show up with two premises joined by an "iff", or does any logical connective produce versions of it? Is majority rule special, or would any way of combining the votes hit some version of the problem? Does it matter that we voted on premises first rather than the bottom line directly (they gave opposite answers, which is what unsettled people)? I'm not after just a label, I want to know what the phenomenon is and isn't, and where its boundaries are.
reasoning: |-
  Okay, the user is part of a curriculum committee facing a peculiar voting inconsistency. They described two scenarios where majority votes on individual premises led to one outcome, but a direct vote on the conclusion resulted in the opposite. Everyone's individual stance was consistent, but the group decision was contradictory. They mentioned Condorcet's paradox and Arrow's theorem but feel those don't fit. 

  First, I need to recall if there's a specific term for this. The user mentioned premises connected by an "if and only if" condition. The voting results were 4-3 on each premise, yet 4-3 against the conclusion. The key is that the group accepted both premises but rejected the logical consequence. 

  The term "doctrinal paradox" comes to mind. That's when a group votes on interconnected propositions and ends up with an inconsistent collective judgment. The doctrinal paradox specifically deals with logical dependencies between propositions. The user's case fits: the committee agreed that both conditions (a) and (b) must be true for the course to be mandatory. They voted yes on both individually, but no on the mandate. That's a textbook example.

  Wait, but the user said the direct vote was against the hire or the mandate. In the doctrinal paradox, the inconsistency arises when aggregating votes on premises versus the conclusion. Here, they voted separately on premises and then on the conclusion, getting conflicting results. That matches. The reverse could happen too—no on premises but yes on conclusion. 

  How is this different from Condorcet? Condorcet involves cyclical preferences in rankings, like A>B, B>C, C>A. Here, no cycles—each voter has consistent preferences. Arrow's theorem is about ranking systems and IIA, which isn't directly about logical propositions. So the doctrinal paradox is more precise here.

  The user also asked about other logical connectives. The paradox can occur with any logical structure. For example, with "and," voting yes on both premises but no on the conjunction. Or with "or," no on each premise but yes on the disjunction. The issue is about aggregating judgments on linked propositions.

  Regarding voting methods, majority rule is the problem here. Other methods like premise-based or conclusion-based approaches could avoid inconsistency but have trade-offs. Premise-based prioritizes logical coherence; conclusion-based reflects the direct vote. Both have downsides depending on the case.

  The user's bylaws requiring voting on each premise led to the paradox. If they only voted on the conclusion, there'd be no inconsistency, but they might miss evaluating the reasons behind the decision. The order of voting matters because it reveals the aggregation problem.

  Boundaries of the phenomenon: it happens with any logical connection between propositions. The size of the group and majority thresholds can affect it. Smaller groups might avoid it if majorities align, but here the split votes caused it. The key is the disconnect between individual rationality and group irrationality due to aggregation.

  The user might need practical solutions. They could adjust their voting procedure—either vote only on the conclusion or use a premise-based approach to ensure consistency. But changing bylaws requires consensus. Explaining the paradox to the committee could help them understand it's a systemic issue, not personal inconsistency.
answer: |-
  This is a classic case of the **Doctrinal Paradox** (also sometimes called the **Discursive Dilemma**). It's distinct from Condorcet's paradox and Arrow's theorem, though it shares the core insight that aggregating individual judgments can lead to collective irrationality.

  Here's a breakdown addressing your specific questions:

  1.  **The Name and Distinction:**
      *   **Name:** **Doctrinal Paradox** / **Discursive Dilemma**.
      *   **Distinction from Condorcet:**
          *   **Condorcet:** Deals with *preferences* over *alternatives* (e.g., candidates A, B, C) and shows how majority rule can lead to cyclical rankings (A>B, B>C, C>A). It's about inconsistent *rankings* of *options*.
          *   **Doctrinal Paradox:** Deals with *judgments* on logically interconnected *propositions* and shows how majority rule can lead to an inconsistent set of *beliefs*. It's about violating *logical consistency* in collective *reasoning*.
      *   **Distinction from Arrow:**
          *   **Arrow:** Deals with aggregating individual *preference orderings* (rankings) over three or more *alternatives* into a social welfare function satisfying specific fairness axioms. It proves no such function can satisfy all axioms simultaneously. The focus is on *ranking outcomes*, not logical consistency of propositions.
          *   **Doctrinal Paradox:** Focuses specifically on aggregating *judgments* (true/false, yes/no) on a set of *propositions* connected by a known logical rule (the "doctrine"). It shows this aggregation can violate the logical rule itself, even if all individuals satisfy it.

  2.  **How it Matches Your Case Exactly:**
      *   **The Doctrine:** Your bylaws established the logical rule: `Mandatory IFF (A AND B)`. Everyone accepted this rule.
      *   **Individual Consistency:** Every member voted consistently *with this doctrine*:
          *   Yes/Yes: `Mandatory = True` (consistent with True AND True = True)
          *   No/No: `Mandatory = False` (consistent with False AND False = False)
          *   Yes/No on A, No on B: `Mandatory = False` (consistent with True AND False = False)
          *   No on A, Yes on B: `Mandatory = False` (consistent with False AND True = False)
      *   **Collective Inconsistency:**
          *   Majority Vote on A: True (4-3)
          *   Majority Vote on B: True (4-3)
          *   Majority Vote on `Mandatory`: False (4-3)
          *   **Result:** The group collectively affirms A is True and B is True, affirms the rule `Mandatory IFF (A AND B)`, but collectively affirms `Mandatory` is False. This violates the very rule they agreed upon: True AND True *must* imply True, but they concluded False.
      *   **The Core:** The group's judgment set {A=True, B=True, Mandatory=False} is logically inconsistent *given the rule* `Mandatory IFF (A AND B)`.

  3.  **Boundaries and Deeper Analysis:**
      *   **Logical Connectives:** The paradox is **not limited to "iff" or "and"**. It arises whenever propositions are logically connected. Crucially, it requires *multiple premises* feeding into a *conclusion* via a *non-unanimity rule* (like majority).
          *   **AND:** (Your case) Majority for each premise True, majority for conclusion False.
          *   **OR:** Majority says each premise False, majority says conclusion True. (E.g., "Hire if expert in Field X OR Field Y". Majority votes "No" on X-expert, "No" on Y-expert, but "Yes" on Hire).
          *   **Material Implication (If A then B):** Majority says A True, majority says B False. (Collectively affirms A is true, and `If A then B` is true, but B is false - contradiction).
          *   **IFF:** (Your case, equivalent to `(A AND B) OR (NOT A AND NOT B)`). Your vote showed the `AND` aspect failing. It could also fail the `OR` aspect (majority says A False, B False, conclusion False - consistent with `IFF`; but if the conclusion vote was True, it would be inconsistent).
      *   **Voting Methods:** The paradox **specifically highlights a flaw in premise-based vs. conclusion-based voting under majority rule**.
          *   **Premise-Based Procedure:** Vote on each premise (A, B) by majority, then deduce the conclusion (`Mandatory`) *logically* from the rule and the voted premises. Result: A=True, B=True => Mandatory=True. (This gives the "logically coherent" but counter-intuitive result where the mandate passes despite the direct vote failing).
          *   **Conclusion-Based Procedure:** Vote directly on the conclusion (`Mandatory`) by majority, ignoring the premises. Result: Mandatory=False. (This respects the direct mandate vote but ignores the group's judgment on the *reasons*).
          *   **Your Committee:** Unwittingly performed *both* procedures and got *different* results (Premise-Based: Mandatory=True; Conclusion-Based: Mandatory=False), exposing the paradox. **The paradox exists because these two reasonable ways to aggregate votes can conflict.** Majority rule on individual propositions is the culprit; other aggregation rules (unanimity, dictatorship, supermajorities on premises) might avoid it *in specific cases*, but often introduce other problems (like indecision or unfairness). **No perfect aggregation method exists** that guarantees logical consistency, respects individual judgments, and satisfies other basic fairness criteria (like non-dictatorship) for all possible configurations – this is the essence of the broader **Judgment Aggregation Problem**.
      *   **Order of Voting:** The order *revealed* the paradox but didn't *cause* the underlying inconsistency. The inconsistent collective judgment set ({A=True, B=True, Mandatory=False}) exists regardless of the order you discover the votes. Voting on the premises first made the logical conflict glaring when the conclusion vote contradicted the deduced result. If you voted on `Mandatory` first and got "No", then voted on A and B and got "Yes" on both, the inconsistency would be just as real, though perhaps less intuitively shocking initially.
      *   **When Does it Occur?** It requires:
          1.  A logical connection between 3+ propositions (at least 2 premises and 1 conclusion).
          2.  The possibility of a "splitting" voter profile (like your two split voters) that creates a disconnect between majority premises and majority conclusion.
          3.  Using simple majority voting on each proposition individually.
          4.  The group size and vote split must allow the majorities to diverge (e.g., odd number of voters > 1, not unanimous).
      *   **"Weird Bylaws"?** Not inherently weird. Requiring votes on premises ensures explicit consideration of the *reasons* behind a decision. However, your bylaws mandate a specific logical rule (`IFF (A AND B)`) *and* then use majority voting on each component, creating the *perfect conditions* for the doctrinal paradox to manifest. Recognizing the paradox helps understand why the results *feel* contradictory even though individuals are consistent.

  **Conclusion:**

  You've encountered the **Doctrinal Paradox**. It's a fundamental result in social choice theory and judgment aggregation, demonstrating that aggregating individual judgments on logically connected propositions using majority rule can lead to collectively inconsistent outcomes, even when every individual is perfectly consistent. It highlights the tension between two democratic ideals: respecting the majority's view on individual reasons (premise-based) vs. respecting the majority's view on the final outcome (conclusion-based). Your committee's experience is a textbook example, showing how a group can affirm premises leading logically to a conclusion while simultaneously rejecting that conclusion by majority vote. Understanding this paradox is crucial for designing fair and rational collective decision-making procedures, especially when outcomes depend on interconnected criteria.
