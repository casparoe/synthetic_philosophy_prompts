answer: |-
  Based on your request, here is a structured menu of the distinct theses that "all animals are equal" could express, analyzed for their status (platitude, defensible, contested, or false), their necessity for your granddaughter's conclusion, and the status of the racism analogy. I will adhere strictly to your requirements: separating settled from contested views, avoiding presenting contested views as consensus, and focusing on precision.

  ### Core Theses Expressed by "All Animals Are Equal"

  1.  **Thesis: Sentience Entails Moral Significance (The Anti-Ignorability Claim)**
      *   **Meaning:** The capacity to experience suffering and pleasure (sentience) is a sufficient condition for an entity to have *some* moral standing. The interests of sentient beings (including non-human animals) cannot be ignored in moral deliberation; their suffering matters morally.
      *   **Status:** **Widely Accepted (Near-Platitude).** Rejecting this is now a minority position among philosophers engaged in animal ethics. The scientific consensus on animal sentience (especially for mammals) bolsters this. Disagreements persist on *which* animals are sentient (e.g., insects, fish) and the *degree* of significance.
      *   **Necessary for Granddaughter's Conclusion?** **Yes, necessary but insufficient.** This is the foundational claim that animals enter the moral sphere. However, accepting this does *not* logically entail condemning *all* research or the strong equality claim; it requires weighing animal interests against others (including human benefits).
      *   **Racism Analogy:** **Implicit but weak.** The analogy highlights that dismissing the moral relevance of sentience based on species is akin to dismissing it based on race – both are arbitrary exclusions of morally relevant experiences. Critics argue the disanalogy lies in the *fact* of differing capacities between species vs. the *false belief* of differing capacities between races.

  2.  **Thesis: Equal Moral Status (The Anti-Speciesism Claim)**
      *   **Meaning:** Species membership itself is not a morally relevant property for determining basic moral status or intrinsic value. Assigning different basic moral worth or status *solely* based on species ("speciesism") is unjustified prejudice, analogous to racism or sexism. All sentient beings possess the same fundamental moral status.
      *   **Status:** **Substantive, Defensible, but Highly Contested.** This is Peter Singer's core argument ("speciesism") and the heart of much animal liberation philosophy. Proponents argue that capacities like sentience, not species labels, are morally relevant. Critics (e.g., Cohen, Scruton, many virtue ethicists/Nussbaum, some Kantians) argue that species membership *is* relevant because it correlates with morally significant capacities (e.g., rationality, autonomy, moral agency, "dignity") that humans typically possess to a higher degree or uniquely, justifying differential status. Others argue that special obligations within species (human-to-human) make species membership relevant.
      *   **Necessary for Granddaughter's Conclusion?** **Yes, directly required.** Your granddaughter's assertion that preferring humans "simply because they are human" is prejudicial structurally identical to racism relies *entirely* on this thesis. Without accepting that speciesism is arbitrary prejudice, her specific condemnation of prioritizing human interests *per se* collapses.
      *   **Racism Analogy:** **Central and Integral to the Thesis.** The analogy *is* the argument: both racism and speciesism are forms of unjustified group bias favoring one's own group based on an arbitrary biological characteristic, ignoring morally relevant individual capacities (sentience). Critics press the disanalogy: Racism discriminates *within* a group (humans) sharing the morally relevant capacities for full moral status (rationality, autonomy). Speciesism discriminates *between* groups possessing these capacities to *radically different degrees* or not at all. Proponents counter that the capacity for *suffering* (sentience) is the relevant one for the most basic moral consideration, and this is shared across species lines.

  3.  **Thesis: Equal Consideration of Comparable Interests (Singer's Utilitarian Principle)**
      *   **Meaning:** In moral deliberation, we must give equal weight to the *equivalent interests* of all sentient beings. A unit of suffering (or pleasure) of equal intensity and duration matters equally, regardless of the species of the being experiencing it. The principle applies to the *interest itself* (e.g., interest in avoiding pain), not to beings receiving identical treatment regardless of differing interests.
      *   **Status:** **Substantive, Defensible within Utilitarianism, Highly Contested Outside It.** This is Singer's specific operationalization of "equality." It flows naturally from the combination of Sentience Entails Moral Significance and the rejection of speciesism, within a utilitarian framework prioritizing the minimization of suffering/maximization of pleasure. Non-utilitarians (deontologists, virtue ethicists, contractarians) strongly contest that interests *must* be weighed equally in this aggregative way. Many argue that different capacities generate different interests or alter the weight interests deserve (e.g., a human's complex psychological suffering vs. an animal's momentary pain).
      *   **Necessary for Granddaughter's Conclusion?** **Likely Required for her Strong Condemnation.** While rejecting speciesism (Thesis 2) condemns the *bias*, this thesis provides the mechanism for why prioritizing human benefit in research might be *always* impermissible (if the animal suffering is severe and the human benefit doesn't vastly outweigh it *after* equal consideration). Her conclusion that "no amount of human benefit can justify" your work *could* stem from this principle (if she sees the interests as non-overridable in that context) or from a rights view. It's the most direct challenge to cost-benefit justifications in research.
      *   **Racism Analogy:** **Indirectly Supported.** If speciesism is analogous to racism (Thesis 2), then discounting animal interests based on species is analogous to discounting the interests of another race. The equal consideration principle operationalizes what overcoming that prejudice requires in decision-making.

  4.  **Thesis: Equal Basic Rights (The Deontological Claim)**
      *   **Meaning:** All sentient animals possess certain fundamental, inviolable rights (e.g., the right not to be killed, not to be caused suffering, not to be treated as property) that are equal in strength to analogous human rights. These rights impose strict side-constraints on actions, regardless of consequences.
      *   **Status:** **Substantive, Defensible by Some (e.g., Tom Regan), Highly Contested.** This view, often grounded in the inherent value ("subject-of-a-life") of beings, goes beyond utilitarian balancing. It typically leads to abolitionist conclusions regarding animal use (research, food, etc.). Critics argue that rights are conceptually tied to capacities like reciprocity, moral agency, or autonomy, which non-human animals generally lack, and that extending full rights is conceptually incoherent or practically unworkable. Others argue for *different* rights based on different capacities.
      *   **Necessary for Granddaughter's Conclusion?** **Sufficient but not Necessary.** If animals possess equal basic rights, then harmful research violates those rights and is impermissible regardless of benefit (concluding your work was unjustified). However, your granddaughter could reach the same strong condemnation via Singer's equal consideration principle (Thesis 3) if she deems the costs *always* to outweigh the benefits. Her specific phrasing ("prejudice") aligns more closely with the anti-speciesism argument (Thesis 2) than a rights framework per se.
      *   **Racism Analogy:** **Weaker Link.** While rights violations are central to combating racism, the analogy here is less direct than for speciesism. Critics focus on the disanalogy of capacities required for holding rights.

  5.  **Thesis: Literal Sameness / Identical Value (The Strong Egalitarian Claim)**
      *   **Meaning:** All animals (including humans) possess absolutely identical value or worth in every conceivable respect. All interests, regardless of nature or whose they are, must be treated identically. This implies no distinctions can ever be made based on any capacity.
      *   **Status:** **Generally Considered False and Indefensible.** This is a strawman or radical misunderstanding. No serious animal ethicist (including Singer) defends this. It ignores the obvious differences in capacities, interests, and needs between species and individuals (e.g., a bird's interest in flying vs. a human's interest in voting; vastly different cognitive capacities affecting experiences). Even proponents of strong animal equality focus on *basic interests* like avoiding suffering, not all possible interests.
      *   **Necessary for Granddaughter's Conclusion?** **No.** Her argument, referencing Singer and the analogy to prejudice, clearly relies on the rejection of arbitrary bias (Thesis 2) and likely equal consideration of interests (Thesis 3), not this literal sameness. Orwell's satire targets this crude misinterpretation.

  ### Summary of Your Granddaughter's Position & Key Disputes

  *   **Her Core Requirement:** Thesis 2 (**Equal Moral Status / Anti-Speciesism**) is **absolutely essential** for her claim that prioritizing humans *simply because they are human* is prejudicial and analogous to racism. This is the structural core of her argument.
  *   **Her Likely Requirement:** Thesis 3 (**Equal Consideration of Comparable Interests**) is **very likely required** to support her strong, seemingly absolute condemnation ("no amount of human benefit can justify") of your research within a consequentialist framework like Singer's. Thesis 4 (Equal Rights) could also support this condemnation, but her "prejudice" language aligns better with Singer's speciesism argument.
  *   **The Foundation:** Thesis 1 (**Sentience Entails Moral Significance**) is the **necessary foundation** for *any* serious animal ethics position, including hers, but is insufficient alone for her specific conclusions.
  *   **The Racism Analogy:** This is **integral to Thesis 2 (Anti-Speciesism)**. Its validity is **highly contested**:
      *   **Proponents:** Argue the analogy holds because both involve arbitrarily favoring one's own group based on a biological characteristic, ignoring a morally relevant shared property (sentience/capacity for suffering).
      *   **Critics:** Argue it fails because racism discriminates *within* a group sharing the capacities grounding full moral status (rationality, autonomy), while speciesism discriminates *between* groups differing fundamentally in those capacities. They see sentience as necessary but insufficient for *equal* status.

  ### Consensus vs. Contested Terrain (As Requested)

  *   **Settled/Near Consensus:** Thesis 1 (**Sentience Entails Moral Significance**) is widely accepted. Rejecting the moral relevance of animal suffering altogether is a fringe position. The fact of animal sentience (in vertebrates, at least) is scientifically robust.
  *   **Contested:**
      *   The validity and strength of **Thesis 2 (Equal Moral Status / Anti-Speciesism)** is the central philosophical battleground in animal ethics. Reasonable, informed philosophers disagree profoundly.
      *   The validity of **Thesis 3 (Equal Consideration of Comparable Interests)** is contested, primarily along meta-ethical lines (utilitarian vs. non-utilitarian). Even among utilitarians, applying it perfectly is debated.
      *   The validity of **Thesis 4 (Equal Basic Rights)** is highly contested, with critics arguing rights language only coherently applies to beings with specific higher-order capacities.
      *   The validity and usefulness of the **Racism Analogy (central to Thesis 2)** is heavily disputed, as outlined above.
      *   Whether **Theses 2 & 3** actually imply the **abolition of all animal research** (as your granddaughter suggests) is contested *even among those who accept them*. Some argue rare, high-benefit, low-harm research *could* theoretically pass muster under strict equal consideration, though they find current practices generally fail. Others (especially rights theorists) argue it never can.

  You are correct: the bare moral significance of animal suffering is widely accepted. The stronger claims about speciesism as prejudice, equal consideration of interests, and the analogy to racism remain deeply controversial among serious philosophers. Your granddaughter's conclusion relies squarely on the most contested of these theses (Anti-Speciesism) and its contested analogy, likely coupled with the contested Equal Consideration principle. The debate remains open and vigorous.
