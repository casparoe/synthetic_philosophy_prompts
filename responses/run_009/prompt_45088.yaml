answer: |-
  Here is a specification of desiderata for an adequate philosophy of mathematics, designed to serve both the working mathematician (preserving practice) and the metaphysician (respecting ontological/epistemic scruples). Each desideratum is motivated by a core case, classified as negotiable/non-negotiable, and analyzed for conflicts and exclusionary power. Scorecards for key theories follow.

  ---

  ### **Desiderata Specification**

  1.  **Face-Value Semantics**  
      *   **Requirement**: Ordinary mathematical claims must be genuinely truth-apt (true/false), with a compositional semantics enabling embedding in conditionals, negation, and inference.  
      *   **Motivating Case**: The bridge engineer states, "The bridge is safe *if* this stress theorem holds." If the theorem lacks truth-value, the conditional's status (and the inference licensing construction) becomes unintelligible.  
      *   **Classification**: **Non-Negotiable** (Mathematician-Primary). Essential for understanding mathematics *as practiced*, especially applied mathematics and logical reasoning. Rejecting this requires explaining away pervasive features of mathematical discourse.

  2.  **Identification**  
      *   **Requirement**: The theory must either identify the referents of mathematical terms (e.g., what *is* the number 3?) or explain why such identification is unnecessary or misguided.  
      *   **Motivating Case**: **Benacerraf (1965)**: Two children learn arithmetic via different set-theoretic reductions (von Neumann vs. Zermelo ordinals). They agree on all arithmetic facts but disagree on "3 ∈ 17". Which reduction captures the "true" numbers?  
      *   **Classification**: **Negotiable** (Philosopher-Primary). While resolving ontological vagueness interests metaphysicians, *working mathematicians* largely operate without needing a unique reduction. The pressure comes from philosophical worries about reference and ontology, not mathematical practice itself. Structuralism directly addresses this by denying identification is needed.

  3.  **Epistemic Access**  
      *   **Requirement**: The theory must explain how finite, causally embedded humans can reliably form *justified true beliefs* about the objects/truths of mathematics.  
      *   **Motivating Case**: **Benacerraf (1973) Dilemma**: Platonism (motivated by semantics) posits acausal abstracta, seemingly making knowledge impossible. Nominalism avoids abstracta but struggles with semantics/applicability. Is "knowledge requires causal contact" a universal constraint or a misapplied empirical model?  
      *   **Classification**: **Negotiable** (Metaphysician-Primary). The *demand* for a causal/epistemic story is primarily a philosophical scruple stemming from empiricist leanings. Many mathematicians find their proof practices intrinsically justifying, without feeling a need to explain "access" to abstracta. However, *some* account of justification is non-negotiable.

  4.  **Applicability**  
      *   **Requirement**: The theory must explain why mathematics is not just useful but *indispensable* and *unreasonably effective* in describing the physical world. The explanation should account for the increasing mathematical sophistication of physics without rendering mathematics merely instrumental.  
      *   **Motivating Case**: Quantum Field Theory (QFT) relies deeply on complex mathematical structures (Hilbert spaces, operator algebras, path integrals). Nominalizing QFT à la Field's program for Newtonian gravity seems intractable. Is nominalization *required* for adequacy, or is it an optional project?  
      *   **Classification**: **Non-Negotiable** (Joint). Both mathematicians and metaphysicians demand an explanation. The *form* of explanation (e.g., mapping structures, abstracta governing concrete, mere representation) is contested, but ignoring applicability fails both clients.

  5.  **Open Questions**  
      *   **Requirement**: The theory must account for the status of questions like the Continuum Hypothesis (CH), which are independent of standard axioms (ZFC). Does CH have a determinate truth value? Must the theory preserve the "realist intuition" that there's a fact of the matter?  
      *   **Motivating Case**: Working set theorists display deep divisions over whether CH is true, false, or indeterminate. Some seek new axioms to decide it; others embrace multiverse views.  
      *   **Classification**: **Negotiable** (Mathematician-Primary, but contested). *Some* mathematicians feel strongly there's a fact; others are comfortable with indeterminacy or multiverses. A theory needn't mandate determinacy, but it must explain the *practice* of seeking resolution (e.g., via intrinsic/extrinsic justifications for new axioms) without dismissing the question as meaningless if practitioners don't.

  6.  **Consistency with Practice**  
      *   **Requirement**: The theory must cohere with the core observable features of mathematical practice: the role of proof as truth-establishment, the resolution of disagreements via argument/proof, and the ubiquitous use of object-language ("the prime numbers", "this group"). It must avoid systematic error theories or question-begging.  
      *   **Motivating Case**: Mathematicians universally treat proofs as settling claims and refer to mathematical entities as objects. A theory claiming numbers don't exist must explain why this discourse is so effective and stable; a theory simply reifying this discourse must justify its ontological leap.  
      *   **Classification**: **Non-Negotiable** (Joint). Ignoring how mathematics is *done* fails both clients. A theory needn't take practice at absolute face value (e.g., it can offer a paraphrase), but it must provide a non-debunking, non-question-begging account of why practice manifests as it does.

  ---

  ### **Analysis of the List**

  1.  **Negotiability & Interests**:
      *   Non-Negotiable: (1) Face-Value Semantics (Math-Primary), (4) Applicability (Joint), (6) Consistency with Practice (Joint). These are core to mathematics *as an activity* and its interaction with science/world.
      *   Negotiable:
          *   (2) Identification: Primarily serves the Metaphysician's desire for ontological precision. Structuralism shows practice doesn't demand it.
          *   (3) Epistemic Access: Primarily serves the Metaphysician's demand for integration with a (causally oriented) general epistemology. Practice relies on proof, not contact.
          *   (5) Open Questions: Primarily serves the Mathematician's (or Philosopher-of-Math's) realist intuitions, but practice contains diverse attitudes. A theory can respect the *activity* of pursuing answers without requiring determinacy.

  2.  **Joint Unsatisfiability**:
      *   **The Core Tension: (1) Face-Value Semantics + (3) Epistemic Access.** Benacerraf (1973) argues these pull in opposite directions. Platonism satisfies (1) but struggles with (3); nominalism satisfies (3) but struggles with (1). **Status: Argued, not Proven.** Hartry Field *argues* nominalism can satisfy both via conservative extension and logical knowledge. Platonists *argue* epistemic access is possible without causation (e.g., intuition, indispensability). The tension remains a powerful motivator, but neither side concedes it's *logically* impossible to satisfy both. It captures the central dispute.

  3.  **Most Exclusionary Desideratum**:
      *   **(1) Face-Value Semantics.** This immediately excludes:
          *   Strict Fictionalism (e.g., Mary Leng): Denies mathematical statements are true.
          *   Non-Cognitivist/Expressivist Views: Deny mathematical statements express propositions.
          *   Radical Revisionary Views: Demand paraphrasing math statements into something non-truth-apt or radically different.
      It forces theories to take mathematical discourse seriously *as stating truths*, setting a high bar for non-platonist accounts (e.g., requiring sophisticated truth-makers like structures or modalities).

  ---

  ### **Brief Scorecards**

  *   **Mathematical Platonism (e.g., Gödel, Frege):**
      *   (1) **Excels:** Takes semantics literally; mathematical statements are true because abstract objects exist and have properties.
      *   (2) **Struggles:** Must identify numbers (e.g., as sets), facing Benacerraf's 1965 multiple-reduction problem. Structuralist platonism avoids this.
      *   (3) **Major Weakness:** Epistemic access to causally inert abstracta is deeply problematic (Benacerraf 1973). Relies on contested solutions (intuition, indispensability).
      *   (4) **Moderate:** Explains applicability via abstracta governing/structuring concrete reality (Gödel) or representation (Quine), but the "unreasonable effectiveness" remains mysterious.
      *   (5) **Excels:** Naturally preserves determinacy for open questions; motivates the search for new axioms to discover truths.
      *   (6) **Excels:** Mirrors practice directly; mathematicians *are* describing independently existing abstract objects.

  *   **Field-Style Nominalism (Fictionalism + Conservative Extension):**
      *   (1) **Major Weakness:** Denies mathematical statements are literally true. Faces huge challenges explaining truth-aptness of embeddings (e.g., the bridge conditional) and the reliability of mathematical reasoning *without* truth.
      *   (2) **Avoids:** No numbers exist, so no identification problem.
      *   (3) **Excels:** Eliminates abstract objects; knowledge grounded in logical/conceptual knowledge and science.
      *   (4) **Major Weakness:** Requires nominalizing fundamental physics to show mathematics is dispensable. Success limited (Newtonian gravity yes; QFT no). Explaining *effectiveness* is hard if math is fiction.
      *   (5) **Struggles:** Tends toward anti-realism about independence results; CH lacks truth value, conflicting with many mathematicians' intuitions.
      *   (6) **Struggles:** Requires a complex error theory: why do mathematicians act *as if* describing objects if they aren't? Why is proof so reliable?

  *   **Hellman's Modal Structuralism (Eliminative Structuralism):**
      *   (1) **Moderate:** Mathematical statements are true, but paraphrased as modal claims about possible systems satisfying structures. Truth-aptness preserved, but non-literal semantics. Embedding handled via modal logic.
      *   (2) **Excels:** Denies numbers are objects; only structures (defined modally) matter. Solves the multiple-reduction problem directly.
      *   (3) **Moderate:** Knowledge is modal knowledge + logical/combinatorial knowledge. Avoids causal access to abstracta, but modal epistemology is challenging.
      *   (4) **Moderate:** Applicability explained by concrete systems (approximately) instantiating structures. Effectiveness remains somewhat mysterious ("miracle" reduced but not eliminated).
      *   (5) **Struggles:** Determinacy of CH depends on modal facts about possible set-theoretic universes. Preserves the *question* but may not mandate a unique answer.
      *   (6) **Moderate:** Explains object-talk as convenient shorthand for modal-structural claims. Justifies proof as establishing modal facts. Offers a paraphrase, not a direct reading, but avoids systematic error.
