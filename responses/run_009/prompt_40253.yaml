prompt: |-
  First, a note on how I'd like your answer: plain continuous prose only, the way you'd write a letter, no headings or bullet points or bold text or tables. I read these things on a beat-up old e-reader and anything fancier than paragraphs turns to mush on it.

  Some background so you know where I'm coming from: I spent thirty-five years as a physical chemist, mostly reaction kinetics, and only took up phiosophy of mind after retiring, so treat me as an interested amateur. My neighbor Ingrid has gone deep into integrated information theory and likes to play a game over dinner: she hands down verdicts on whether various things are conscious, and I've started keeping a log because I suspect there's a system to it. Her record so far: a normal mouse, yes; a mouse with almost the entire cerebellum removed, still yes, and she insists it's not even much diminished; that isolated cerebellum sitting in a dish, no; a desert locust, yes, but only barely; a very large feedforward network that classifies odors as well as the locust does, no, and she's adamant that adding a hundred more layers wouldn't budge her; a hard drive containing a complete recording of a mouse's spike trains, obviously no; and a mouse brain cooled so its dynamics run a thousand times slower with nothing else changed, still yes.

  Next week she's bringing two new cases and I'd like to walk in with a prediction instead of my usual flailing. Case one: a detailed whole-brain emulation of the locust, indistinguishable from the living insect in its inputs and outputs, but running as software on ordinary serial hardware, one processor at a time, so that no part of the physical machine is wired up the way the brain is. Case two: the locust connectome physically rebuilt, not simulated, in an analog circuit, each neuron a tiny silicon element genuinely wired to the others with real recurrent connections. Predict her verdicts on both, lay out the rules that fit her track record equally well (I can see roughly a "what matters is the physical irreducible cause-effect structure" rule and a "what matters is what the thing does" rule, and I suspect a third one about needing living biological substrate hiding in there too), say where those rules agree and disagree about the two new cases, and tell me what further case I could spring on her that would best expose which rule she's actually running. I care less about guessing right than about understanding what the candidate rules are and why they come apart exactly where they do.
