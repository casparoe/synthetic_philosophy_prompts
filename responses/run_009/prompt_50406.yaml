answer: |-
  ## Grading the Cat-Tormenter: A Dialogue in the Common Room

  **Setting:** The Philosophy Department common room, well past midnight. Fluorescent lights hum over scarred tables buried under teetering stacks of blue exam books. Empty coffee cups litter the landscape. PRIYA (me, the narrator) and DANA (my co-TA, moral realist) are nearing the end of grading the "Arguments in Ethics" section of the final exam.

  **Characters:**
  *   **PRIYA:** Graduate TA, sympathetic to expressivist approaches to ethics, narrator. Tired but wired, concerned about philosophical bias in grading.
  *   **DANA:** Graduate TA, staunch moral realist, writing a dissertation defending it. Focused, intense, believes strongly in clear logical standards.

  **(The scene opens with PRIYA sighing, rubbing her eyes, and sliding two blue books toward DANA.)**

  **Priya:** Okay, Dana, brace yourself. We’ve got the cat-tormenter twins here. Question 3: Formalize and assess validity. Argument: ‘Tormenting the cat for fun is wrong; If tormenting the cat for fun is wrong, then paying your little brother to torment the cat is wrong; Therefore, paying your little brother to torment the cat is wrong.’ Student A nails it: ‘Modus ponens. Valid.’ Full points, easy. But Student B... well, read it.

  **Dana:** (Takes the blue book, scans it quickly, frowns) "The premises aren't the kind of thing that can be true or false — they just express disapproval of tormenting the cat — so the argument can't be valid, since validity requires premises that could be true." Zero points. Obviously. They fundamentally misunderstand the point of the exercise. We’re teaching logic, not metaethics. The question asks them to *assess validity*, which is purely formal. Student A understood the assignment. Student B didn’t. Case closed. (Starts to put a big '0' on the page).

  **Priya:** Whoa, hold the red pen. Zero? Seriously? Look, I agree Student A deserves full credit. They correctly identified the logical structure. But Student B… they’re stumbling towards something *real*, something anyone grappling with expressivism has to confront. Doesn’t that merit *some* recognition? Even if they’re garbled?

  **Dana:** Priya, the assignment isn't "Stumble towards a metaethical view." It's "Put this argument into premise-conclusion form and assess its validity." Validity is defined solely in terms of truth-preservation: *If* the premises are true, *then* the conclusion must be true. Student B explicitly says the premises *can't* be true or false. Therefore, by their own reasoning, the concept of validity doesn't apply. They haven't assessed the validity; they've denied the framework in which it makes sense. That's a category error for *this question*. It’s like refusing to solve ‘2+2=?’ because you think numbers are social constructs.

  **Priya:** But isn’t that *exactly* the Frege-Geach problem Student B is accidentally channeling? Their "garbled" point is the core challenge for an expressivist: How *can* moral sentences, which seem to function differently when used nakedly ("Tormenting is wrong!"), also function as truth-apt components in logical structures like conditionals and arguments? If "Tormenting is wrong" just *boos* the action when said alone, what is "If tormenting is wrong..." doing? It’s not *booing*; it’s setting up a hypothetical connection. Student B’s clumsy version – "aren't the kind of thing that can be true or false" – is their way of hitting that wall. Giving them zero feels like punishing them for bumping into a genuine philosophical problem.

  **Dana:** (Leans back, arms crossed) Fine. Let's grant Student B stumbled onto the problem. But stumbling onto a problem isn't solving it. In fact, their answer *embraces* the problem as a reason to reject the validity of the argument. That's precisely *wrong* for this context. The argument *is* formally valid. The question is whether expressivism can even *make sense* of that validity. Can it? If moral sentences aren't truth-apt, what are they contributing to the conditional "If P, then Q" that allows modus ponens to work? How can ‘If tormenting is wrong, then paying your brother is wrong’ be understood *consistently* with the expressivist’s core idea about the function of ‘Tormenting is wrong’? If expressivism can't explain that, then Student B’s conclusion – that the argument *can’t* be valid – might be the *only* consistent expressivist answer, however disastrous that is for logic. And that’s a fatal flaw for expressivism, not a point in Student B’s favor.

  **Priya:** It’s not fatal. Expressivists have developed sophisticated strategies precisely to handle embedding. Let’s take the conditional premise: "If tormenting the cat is wrong, then paying your brother is wrong." An expressivist *doesn’t* have to say this just expresses a simple boo or hurrah. Instead, they can analyze it as expressing a *complex, higher-order attitude*.

  **Dana:** Go on. What complex attitude?

  **Priya:** Think about what accepting that conditional *does* to your moral psychology. If you sincerely say "If tormenting is wrong, then paying your brother is wrong," you’re expressing a *disposition* or a *commitment*. Specifically, you’re committed to disapproving of paying your brother *if* you come to disapprove of tormenting the cat yourself. It’s not expressing disapproval *now*; it’s expressing a rule for coordinating future attitudes. The conditional expresses a state of mind that links the potential disapproval of tormenting to the disapproval of paying. It’s a state of planning, or policy-making, for your moral sentiments.

  **Dana:** Hmm. So, for the expressivist, the entire argument becomes an expression of nested commitments? Premise 1: "Tormenting is wrong" expresses disapproval of tormenting. Premise 2: "If tormenting is wrong, then paying is wrong" expresses a commitment to disapprove of paying *if* one disapproves of tormenting. Therefore, the conclusion "Paying is wrong" expresses disapproval of paying?

  **Priya:** Exactly. And the validity of modus ponens, on this view, reflects a kind of *practical consistency* in your attitudes. If you *actually* disapprove of tormenting (Premise 1), and you *also* have the commitment expressed by the conditional (Premise 2), then you *must* disapprove of paying (Conclusion) to avoid a kind of practical contradiction – holding incompatible attitudes or commitments simultaneously. The logical ‘must’ becomes a demand for coherence in your motivational states.

  **Dana:** Okay, that’s one strategy. But here’s a difficulty. What about *denying* the conclusion while accepting the premises? Logically, that’s inconsistent. Does your expressivist account capture that? Suppose someone says: "Yes, tormenting is wrong (I disapprove of it). And yes, *if* it’s wrong, paying is wrong (I have that commitment). But no, paying your brother is *not* wrong (I approve of it!)." According to your account, they disapprove of tormenting, have the conditional commitment, yet approve of paying. Is this a *logical* inconsistency, or just someone who has messy, conflicted feelings? Your account seems to reduce logical inconsistency to mere psychological conflict. But logic isn't psychology. We want to say this person is contradicting *themselves*, not just feeling bad. Their *beliefs* clash, not just their feelings.

  **Priya:** Fair point. That’s why some expressivists refine it further. They distinguish the *content* of the attitude from the attitude itself. The sentence "Tormenting is wrong" doesn't *just* express disapproval; it expresses disapproval *towards a specific state of affairs*: the tormenting of the cat. This state of affairs is the *propositional content*, the thing we have an attitude *about*. Crucially, this propositional content can be shared across different speech acts.

  **Dana:** How does that help with the conditional?

  **Priya:** So, "Tormenting is wrong" expresses disapproval towards the proposition <Tormenting occurs>. The conditional "If tormenting is wrong, then paying is wrong" isn't expressing some higher-order attitude directly. Instead, it's *asserting a relationship between two prescriptive contents*. It’s saying that the *commitment expressed by* "Tormenting is wrong" *requires* the *commitment expressed by* "Paying is wrong." The truth of the conditional premise depends on whether this normative requirement *actually holds* – whether the prescriptive commitments involved are genuinely linked in the structure of practical reasoning. Validity then becomes about the preservation of *prescriptive correctness* or *commitment consistency* across the argument, grounded in the actual relationships between these normative demands, not just psychological tidiness.

  **Dana:** (Taps a finger thoughtfully) So now you’re smuggling in normative facts – these "actual relationships between prescriptive commitments"? What *are* these relationships? Are they mind-independent? If so, you're drifting towards realism. If not, if they are just patterns in our attitudes, then haven't we circled back to the psychological conflict problem? What makes the link between disapproving of tormenting and *having* to disapprove of paying an *objective* requirement of logic, rather than a contingent feature of *our* moral psychology? And how does this account for why someone who accepts the premises but denies the conclusion is making a *mistake in reasoning*, not just a failure of emotional coherence? The objection still feels like it reduces logical force to psychological or social pressure.

  **Priya:** It's a tightrope, I admit. The expressivist needs to ground the necessity of the logical connection *in* the nature of the attitudes and commitments themselves, showing that certain combinations are inherently unstable or self-defeating for a practically rational agent. It’s not about mind-independent facts, but about the constitutive norms of planning, prescribing, and consistency that govern *any* system of practical commitments, including moral ones. The person who accepts the premises but rejects the conclusion isn't just conflicted; they are violating the constitutive standards of what it *means* to hold those commitments coherently. The mistake is in *reasoning*, because reasoning with commitments has its own internal standards.

  **Dana:** That still feels like a significant departure from classical logic, where validity is defined purely in terms of truth and falsity of propositions, independent of agents or their attitudes. But let’s table that meta-debate for now. We have grades to submit. Back to Student B. Even if I grant that sophisticated expressivists offer *strategies* like these to handle embedding, Student B didn’t articulate anything remotely like that. They just said premises can’t be true/false, so argument can’t be valid. Full stop. That’s not pointing to a solution; it’s stating the problem as if it were an answer. Meanwhile, Student A correctly identified the formal structure and its validity within the standard logical framework we taught. Full credit for A is uncontroversial.

  **Priya:** But Dana, be honest. How much credit do *you* think an answer deserves that says, "This is modus ponens, therefore valid," *if* the student were a naive expressivist who secretly believes moral sentences can't be true or false? Do they get full credit for correctly applying a formal rule they think is inapplicable to the subject matter? Or are they just playing a syntactic game? Student B, however clumsily, is at least *trying* to engage with what they perceive as a fundamental mismatch between the logic and the nature of the claims. They see a problem where you see a straightforward application. And crucially, the *problem* they see is one *you* take incredibly seriously in your own work! You spend chapters refuting the idea that moral sentences aren't truth-apt precisely *because* of the threat it poses to logic and objectivity. Doesn’t Student B’s answer, in its naive way, demonstrate they grasped a *core implication* of a non-realist view – an implication you fight against? Doesn't that show *some* understanding, however imperfect, worth more than zero?

  **Dana:** (Sighs, rubs temples) Okay, Priya. You’re forcing me to separate my philosophical convictions from fair pedagogy. Fine. Student A gets full credit because they demonstrated mastery of the specific skill tested: recognizing and labeling a standard logical form. Whether they are a realist, expressivist, or nihilist in their heart of hearts is irrelevant to *that* skill. Student B... failed to demonstrate that skill. They substituted a metaethical objection for the logical assessment requested. *However...* you’re right that their objection, however poorly framed, touches on a profound and genuine philosophical issue relevant to the *subject matter* of the course – the nature of moral language and reasoning. Giving them *zero* for that part feels unduly harsh; it ignores that they identified *a* problem, even if they misdiagnosed its implications for this specific task. Maybe... partial credit? Half? With a note that while they identified a metaethical challenge, they failed to correctly assess the argument's formal validity as instructed?

  **Priya:** Half feels fair. They got the metaethical point *about* the premises, but missed the logical point *of* the argument structure. It acknowledges the kernel of insight without rewarding the failure to follow instructions.

  **Dana:** Agreed. Half for B. Full for A. Now, about this Frege-Geach ambush...

  **Priya:** (Smiles wearily) Still not convinced by the higher-order attitudes or prescriptive content strategies?

  **Dana:** Not yet. Your second strategy – prescriptive content and normative requirements – sounds like it needs robust, non-psychological foundations for those requirements to avoid collapsing into realism or just relabeling the problem. If you can show me how those requirements are genuinely *constitutive* of practical reasoning *without* sneaking in truth-conditions, and how that explains logical inconsistency as more than just pragmatic failure... *then* we might have progress. But for now, the stack awaits. Grades first, metaphysics later.

  **Priya:** Deal. Pass me the next blue book. And Dana? Thanks for not just waving your hand.

  **Dana:** (Picks up her red pen again) Don't thank me yet. Wait until we hit the Kantian imperative question. I have *opinions* about hypothetical vs. categorical...

  **(They both turn back to the towering stacks of blue books, the philosophical tension unresolved but the grading compromise struck, the fluorescent light humming over the quiet clash of worlds contained within exam answers about a cat.)**
