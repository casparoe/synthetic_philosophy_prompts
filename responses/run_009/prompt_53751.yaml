  Hey, so I'm a 2nd year student in a philosophy of history course called something like "Cyclical Time: From Polybius to Spengler" (we're doing cyclical vs linear thinkers this block — Polybius first, then Ibn Khaldun later). We have to hand in short response papers on an assigned passage, and mine is from Book 6 of Polybius' Histories (Paton's translation, the Loeb one), and I've read it like five times now and I'm still stuck on a couple things.

  You're a professional scholar of ancient Greek political thought and historiography, and I need you to actually think carefully about this — maybe brainstorm a few possible readings of the passage before you settle on one, and don't just paraphrase it back at me or give me wikipedia-level generalities. If you're not sure about something (especially Greek terminology), just say so instead of guessing.

  Here's the passage:

  "Most of those whose object it has been to instruct us methodically concerning such matters, distinguish three kinds of constitutions, which they call kingship, aristocracy, and democracy. Now we should, I think, be quite justified in asking them to enlighten us as to whether they represent these three to be the sole varieties or rather to be the best; for in either case my opinion is that they are wrong. For it is evident that we must regard as the best constitution a combination of all these three varieties, since we have had proof of this not only theoretically but by actual experience, Lycurgus having been the first to draw up a constitution — that of Sparta — on this principle. Nor on the other hand can we admit that these are the only three varieties; for we have witnessed monarchical and tyrannical governments, which while they differ very widely from kingship, yet bear a certain resemblance to it, this being the reason why monarchs in general falsely assume and use, as far as they can, the regal title. There have also been several oligarchical constitutions which seem to bear some likeness to aristocratic ones, though the divergence is, generally, as wide as possible. The same holds good about democracies. The truth of what I say is evident from the following considerations. It is by no means every monarchy which we can call straight off a kingship, but only that which is voluntarily accepted by the subjects and where they are governed rather by an appeal to their reason than by fear and force. Nor again can we style every oligarchy an aristocracy, but only that where the government is in the hands of a selected body of the justest and wisest men. Similarly that is no true democracy in which the whole crowd of citizens is free to do whatever they wish or purpose, but when, in a community where it is traditional and customary to reverence the gods, to honour our parents, to respect our elders, and to obey the laws, the will of the greater number prevails, this is to be called a democracy. We should therefore assert that there are six kinds of governments, the three above mentioned which are in everyone's mouth and the three which are naturally allied to them, I mean monarchy, oligarchy, and mob-rule."

  My questions:

  1. When he says "for in either case my opinion is that they are wrong," the two options were (a) these three are the only kinds, or (b) these three are the best. But then he answers them completely separately — the best is actually the mixed constitution (Lycurgus, Sparta), AND there are six kinds, not three. So is this one argument or two stapled together? Why does he phrase it as a single claim if the two halves need totally different answers?

  2. This is the thing that really confuses me. In the middle of the passage the bad lookalike of kingship is clearly tyranny, and oligarchy is the degenerate version of aristocracy. But then at the very end, "the three which are naturally allied to them, I mean monarchy, oligarchy, and mob-rule" — where did tyranny go?? And monarchy gets listed as one of the bad allied forms, even though just after this passage (not quoting here, but it's in my reading) Polybius says "the first of these to come into being is monarchy, its growth being natural and unaided," and that proper kingship is "derived from monarchy by the aid of art and by the correction of defects," and then "Monarchy first changes into its vicious allied form, tyranny." So monarchy is somehow the raw starting point, gets refined into kingship, then collapses back into tyranny?? Is monarchy good, bad, or a stage, and why does it end up on the corrupt side of the ledger in the sixfold list? My professor hinted there's something going on with the Greek words for king/monarch/tyrant that the translation kind of flattens, but wouldn't say more.

  3. Smaller thing: his defintion of true democracy is one "where it is traditional and customary to reverence the gods, to honour our parents, to respect our elders, and to obey the laws." That reads weirdly conservative, almost like it could come out of a modern traditionalist's mouth. Was this just the standard Greek view of what a well-functioning democracy requires, or is Polybius putting his thumb on the scale so that his own preferred "restrained" democracy looks like the real one?

  4. Bigger picture, since the paper is supposed to be about cyclical views of history: the whole section around this passage describes constitutions degenerating into one another in a fixed natural sequence that eventually loops back around. But the mixed constitution is apparently the best one, and Rome (the subject of the whole book!) supposedly has it. So does the cycle apply to Rome or not? Is the mixed constitution outside the cycle entirely, just a slower lap, or the end state of it? My TA said Polybius is ambivalent about whether Rome escapes the cycle and honestly I don't see where that ambivalence is supposed to come from, but it sounds like it could make a decent paper thesis if I understood it.

  Please keep your answer grounded in what the passage actually says — like, if you explain the monarchy/tyranny thing, walk me through the actual terms he's using rather than giving a generic "Greece had three types of government" spiel. And no reading lists please, I just want the explanation itself. Thanks!
