  Hmm, the user presents a sophisticated challenge regarding the Pasadena game and the applicability of physics-style regularization to decision theory. They're a retired theoretical physicist with a strong background in quantum field theory, clearly comfortable with advanced mathematics and philosophical nuance. Their rebellion against the philosophical "defeatism" regarding divergent expectations is understandable given their disciplinary toolkit - they've seen regularization work miracles in QFT.

  The core analogy they propose is intriguing: just as renormalization extracts finite values from divergent QFT integrals, perhaps summability methods could assign decision-relevant expected utilities to pathological games. But the disanalogies run deeper than they acknowledge. In physics, regularization earns authority through empirical success - the Lamb shift calculations weren't justified by Cesàro summation being "mathematically nice" but because they matched experimental results to breathtaking precision. Decision theory lacks this external validator.

  There's also the critical issue of path-dependence that distinguishes physical systems from choice scenarios. When two regularization schemes conflict in physics, nature arbitrates; in the Pasadena game, the player's actual sequence of coin flips determines their payoff, making the "correct" summation method fundamentally unverifiable. The 1/2 value they propose (via Abel summation) feels arbitrary when other methods yield different results - why not use Euler summation or insist on the partial sums' oscillatory behavior as ontologically primary?

  Moreover, the translation from formal assignment to actionable preference breaks down. If I "assign" 1/2 via Abel summation, does that mean I should be indifferent between this game and a guaranteed 50 cents? But the game's payoff structure remains radically uncertain - I might win £1, lose £2, win £4, etc., with decreasing but non-negligible probabilities. The regularized number washes out this volatility in a way that feels dishonest to rational choice.

  Perhaps most damningly, such conventions would need to cohere across all possible games, including variations where the payoff signs are permuted (yielding -1/2 or other values under Abel summation). This makes choice comparisons between different pathological games convention-dependent in a way that violates the spirit of expected utility theory. At least the philosophical acknowledgement of indefiniteness preserves transparency about the limitations of the framework.

  The user might push back noting that QFT also involves convention-dependence (renormalization schemes), but there the conventions are constrained by physical symmetries and ultimately grounded in measurement. Decision theory's "measurements" are revealed preferences, which are precisely what fail to materialize coherently for Pasadena games. Our regularization would be solving a problem we've created rather than one the agent faces. Better to admit the theory's boundary conditions than force artificial solutions that obscure the true novelty of such decision problems.
answer: |-
  My dear colleague, your frustration with the philosophical resignation surrounding the Pasadena game and its kin is entirely understandable, particularly given your background wrestling successfully with the formidable divergences of quantum field theory. The impulse to deploy the powerful machinery of summation methods or regularisation—tools that yielded such spectacularly verified results in physics—to tame these decision-theoretic monstrosities is a natural one. Abel summation suggesting a neat value of one half for your toy series feels like a compelling solution, mirroring the physicist’s success in extracting finite, predictive quantities from apparent infinities. However, while tempting, I must argue that transplanting this approach directly into decision theory encounters profound difficulties, not merely technical, but conceptual and normative. Allow me to elaborate on the disanalogies.

  The crucial divergence lies not in the mathematics of assigning a value to the series *per se*, but in the *role* that assigned value is intended to play. In physics, particularly in renormalisation, the regulator is introduced, calculations are performed, and the regulator is removed. The ultimate justification for the finite result extracted is its *empirical adequacy*. The Lamb shift, the anomalous magnetic moment of the electron—these are not vindicated because Abel or Cesàro summation is mathematically elegant, but because the predicted numbers, obtained *using* these regulated procedures, match experimental measurements with breathtaking precision. The regulator is a tool serving the end of predicting observable phenomena. Its legitimacy is earned *a posteriori* by the success of the predictions it enables. The "authority" you rightly mention for symmetries or experimental success in physics is precisely this: they connect the formalism to the world.

  In decision theory, however, the "expected utility" is not a quantity designed for subsequent experimental verification against an external reality. It is meant to be the very *ground* of rational choice *itself*. It is supposed to guide the agent's preference *before* any outcome is known. Assigning the value 1/2 via Abel summation to your game is an act of formal bookkeeping, but the question is: what normative force does this number carry for the deciding agent? Why should Abel summation, rather than, say, insisting on the limit of partial sums (which doesn't exist), or employing a different summability method (Euler summation might suggest different values for variants), dictate what a rational agent *ought* to prefer? There is no "experiment" analogous to measuring the Lamb shift that can confirm whether choosing the Pasadena game over a sure $0.50 was "correct" in the same way. The choice *is* the primary phenomenon.

  This leads directly to the problem of convention and disagreement. In physics, if two different regularisation schemes (say, Pauli-Villars and dimensional regularisation) yield the same empirically verified result for a physical quantity, their equivalence reinforces the validity of both. If they yielded *different* results for a measurable quantity, one (or both) would be discarded or modified until agreement with experiment was achieved. The external arbiter resolves the conflict. In the Pasadena game, different summability methods (Abel, Cesàro, Euler), or different regularisation schemes (e.g., capping the maximum number of tosses at N and then letting N approach infinity – which, for alternating signs like this, would yield different 'expected values' depending on whether N is even or odd!), can readily yield different finite values: 1/2, 0, or other values altogether. Which convention should the rational agent adopt? There is no external arbiter analogous to experiment to resolve this. The choice of convention itself becomes arbitrary from the perspective of *guiding choice*. Why should Abel's dictate be privileged over Cesàro's, or over the insistence that no finite value is meaningful precisely because the series oscillates? The lack of a unique, compellingly justified value undermines the very purpose of expected utility as an unambiguous guide for preference ordering.

  Furthermore, consider what the "regularised" value obscures. Assigning the value 1/2 washes out the inherent, radical uncertainty and volatility of the game. An agent facing this game knows that with probability 1/2, they get +£1 on the first heads; with probability 1/4, they get -£2 on the second; with probability 1/8, they get +£4; and so on. While the probabilities decrease, the potential swings in fortune grow without bound. Saying the "expected value" is 1/2 suggests a stability and predictability akin to a fair coin flip for 50 pence. This is profoundly misleading about the actual risk profile the agent confronts. The oscillation in the partial sums isn't just a mathematical nuisance to be smoothed away; it reflects a genuine, deep indeterminacy in the potential outcomes and their magnitudes that is central to the decision problem. A regularised value risks papering over this crucial feature that a rational agent might reasonably care about beyond any single summary statistic.

  The philosophical conclusion that these games lack an expected value is not mere defeatism. It is an acknowledgment of the specific role expected utility plays in standard rational choice theory: as a unique, well-defined quantity (as the sum of probability-weighted utilities) that *should* order an agent’s preferences in a consistent way. When this sum fails to converge absolutely or even conditionally to a unique limit, the theory lacks the very resource it relies upon to prescribe a choice. Introducing a summability convention *is* a form of bookkeeping that assigns a number, but it does not automatically bestow upon that number the normative authority required to guide rational choice. That authority, unlike in physics where it is earned through empirical success, would have to be stipulated axiomatically within the decision theory itself – a significant and potentially ad hoc modification whose justification remains unclear and contested.

  In essence, while your physicist's toolkit brilliantly extracts workable numbers from divergent formalisms *for the purpose of predicting observable phenomena*, decision theory requires its foundational quantity – expected utility – to possess intrinsic normative force *for guiding action under uncertainty* prior to any outcome. The lack of a unique, compellingly justified value via summation conventions, the potential for conflicting results from equally natural schemes, and the obscuring of the game's inherent volatility, all suggest that such conventions cannot straightforwardly restore well-defined expected values with the requisite authority for rational choice in these pathological cases. The disanalogy lies not in the mathematics of divergence, but in the fundamental purpose and justification of the quantities being calculated. Yours, in continued admiration for the physicist's ingenuity, but persuaded by the philosopher's caution.

  Yours sincerely.
