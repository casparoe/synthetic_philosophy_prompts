prompt: |-
  My friend went through a Gongsun Long phase in college and honestly it never wore off. His verdicts on the old cases, so you know his track record: he signs on to a white horse not being a horse, and when I push him he runs the color argument -- ask for a horse and a yellow-brown one will do, ask for a white horse and it won't. He agrees a yellow-brown horse is not a horse too, says it follows the same way. And on the hard and white he's with Gongsun Long again: hardness and whiteness don't sit in the stone together as one thing, you can separate them out.

  We argue about this constantly and next time I want to be ready. Three satements I'm saving up: (1) a steed is not a horse, assuming steed is just a fancy word for horse. (2) an old horse is not a horse. (3) that white horse in the paddok over there is a horse, said while pointing at one.

  Predict his verdict on each, assuming he wants to stay consistent with his record. Then tell me which rule he's implicitly running -- roughly, is it about extensions (the "not" tracks whatever the qualifier rules out), about names (different words with different content name different things), or about particulars never being identical with a universal -- which rules fit his record about equally well, and which of the three statements would best split those rules apart. Keep it under 300 words and give me the verdicts first.
reasoning: |-
  Okay, the user's friend is deeply into Gongsun Long's philosophy, particularly the "white horse is not a horse" paradox and the separation of attributes like hardness and whiteness. The user wants to predict how his friend would react to three new statements to challenge him next time they argue. 

  First, I need to recall Gongsun Long's core ideas. He emphasizes that names and attributes define objects strictly. So "white horse" isn't just "horse" because the color qualifier changes what it refers to—it excludes non-white horses. Similarly, hardness and whiteness are distinct attributes that don't inherently belong together in the stone. 

  For the three test statements:  
  (1) "A steed is not a horse"—if "steed" is just a synonym, Gongsun Long's follower should reject this because synonyms refer to the same extension. Verdict: False.  
  (2) "An old horse is not a horse"—"old" adds a qualifier, excluding young horses, so it should be True for him, parallel to the white horse argument.  
  (3) Pointing at a specific white horse and calling it "a horse"—here, he might concede because particulars can exemplify universals, but his philosophy treats "white horse" as a compound concept distinct from "horse." Verdict: False.  

  The underlying rule seems to be about qualifiers altering extensions (adding "white" narrows the set). But it could also be about names (different words = different referents) or particulars vs. universals. To split these, statement (3) is key: if he denies the particular white horse is "a horse," it leans toward nominalism (words define reality strictly). If he accepts it, it's more about extensions.  

  The user needs this to corner his friend in their next debate. Smart move—using concrete examples to expose inconsistencies in the philosophy. I should keep it concise but precise, matching his analytical style.
answer: |-
  Based on Gongsun Long's principles as described, your friend's verdicts will likely be:

  1.  **"A steed is not a horse"**: **False.** (He'll say this *is* a horse).
  2.  **"An old horse is not a horse"**: **True.**
  3.  **Pointing: "That white horse is a horse"**: **False.**

  **Explanation & The Rule:**

  He's primarily running an **"extensional" rule**: The word "not" tracks what the qualifier *rules out*. Adding any qualifier ("white", "old", "yellow-brown") creates a more specific concept (a subset) that excludes other members of the broader category ("horse"). Therefore, the specific concept *is not* identical to the general concept.

  *   **Steed:** "Steed" is just another *name* for the *entire* extension "horse". No qualifier excludes anything, so it *is* a horse.
  *   **Old Horse:** "Old" is a qualifier. It excludes young, middle-aged, etc. horses. Therefore, an old horse *is not* (identical to) a horse (the general concept).
  *   **That White Horse:** Pointing makes it a particular. However, you still use the *qualified* name "white horse". This concept excludes non-white horses. Therefore, *this* white horse *is not* (identical to) the universal "horse". The pointing doesn't change the logical relationship of the *concepts*.

  **Splitting the Rules:**

  *   **Extensions (Qualifier Rule):** Fits perfectly (as above). "White horse" ≠ "horse" because the extensions differ.
  *   **Names (Different Words):** Fits *partially*. He accepts synonyms (steed/horse), showing names alone aren't the *primary* issue. The *content* of the name (specifically qualifiers) matters.
  *   **Particulars vs. Universals:** Fits *partially*. He denies the particular white horse *is* the universal "horse". However, his core argument relies more on the qualifier creating a *different concept* (a compound universal "white-horse") than a strict particular/universal divide.

  **Best Splitter: Statement (3).**
  *   If he insists (3) is **False**, it strongly emphasizes the **extensional/qualifier rule** or a strict **nominalism** where compound names create distinct universals ("white-horse" ≠ "horse").
  *   If he concedes (3) is **True**, it leans towards acknowledging **particulars instantiating universals** *despite* the qualifier. This would be inconsistent with his record on the yellow-brown horse or the "hard and white" separation where attributes define distinct existences.
