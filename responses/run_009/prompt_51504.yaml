answer: |-
  ## Dissertation Proposal: Precision Leakage and the Measurability Critique in Effective Altruism  

  **Research Question:** Under what formal conditions do standard Effective Altitruism (EA) prioritization procedures—specifically, comparing point estimates of cost-effectiveness across interventions with radically different measurement precision—systematically misrank interventions by mistaking *evidential precision* for *interventional efficacy* ("precision leakage"), and how might compounding statistical artifacts (e.g., the winner’s curse in noisy estimates) distort resource allocation?  

  ### Why the Question Remains Open
  The existing dialectic stalls because it conflates two distinct comparisons:  
  1.  **Intra-domain comparison:** Ranking interventions *within* a cause area (e.g., different deworming programs) where evidence quality is relatively homogeneous. Defenders rightly argue that preferring better-measured options here is epistemically sound.  
  2.  **Cross-domain comparison:** Ranking interventions *across* cause areas (e.g., deworming vs. policy advocacy) where evidence quality differs drastically. Critics allege bias, but lack a formal model of *how* precision distorts comparisons. Defenders counter that low precision doesn’t imply high impact—yet their methods often treat point estimates from high- and low-precision domains as commensurate. This masks a potential error: precision leakage occurs when the *certainty* of an estimate is misinterpreted as a property of the intervention itself during cross-domain ranking. The winner’s curse further distorts selections *within* high-precision domains by overestimating top-ranked interventions. The debate lacks a rigorous framework to isolate and test these mechanisms.  

  ### Method: Month-by-Month Plan  
  **Months 1–4: Formalizing Precision Leakage**  
  -   Develop a decision-theoretic model of cross-cause comparison. Define a "comparison procedure" as any rule ranking interventions by expected utility estimates derived from heterogeneous evidence sources.  
  -   Specify formal conditions for precision leakage: *When does a procedure assign de facto weight to measurement precision beyond its evidential value, thereby advantaging high-precision interventions irrespective of true effect size?*  
  -   Key task: Articulate the bias as a violation of a normative axiom (e.g., "Scale Invariance under Precision": Ranking should be invariant to rescaling of uncertainty intervals holding point estimates constant).  

  **Months 5–8: Modeling the Winner’s Curse & Portfolio Implications**  
  -   Simulate intervention selection within a high-precision domain (e.g., global health) using realistic distributions of true effects and estimation noise. Quantify overestimation bias in top-ranked interventions due to selection over noisy estimates.  
  -   Integrate with precision leakage: Does winner’s-curse inflation *compound* when comparing top-ranked high-precision options against low-precision alternatives?  
  -   Derive correction mechanisms:  
      -   *Shrinkage estimators* for within-domain rankings (pulling extreme estimates toward the mean).  
      -   *Precision-weighted resource allocation* for cross-cause budgets (allocating funds inversely proportional to aggregate uncertainty per cause, not just point estimates).  

  **Months 9–12: Stress-Testing & Integration**  
  -   Confront core objections:  
      -   *Defender’s Epistemic Reply:* Shouldn’t low precision *itself* count against an option? Test if standard EA procedures adequately discount for risk/ambiguity aversion vs. conflating epistemic uncertainty with low expected value.  
      -   *Collapse into Standard Decision Theory?* Does "precision leakage" reduce to known principles (e.g., ambiguity aversion)? If so, clarify why EA’s *practices* deviate from normative benchmarks.  
      -   *Tractability of Low-Precision Causes:* Can structural interventions be modeled with useful uncertainty bounds? Explore proxy metrics or Bayesian hierarchical modeling of expert priors.  
  -   Refine formal bias conditions and correction rules. Draft dissertation chapters.  

  ### What a Result Looks Like for Funders  
  A successful outcome provides:  
  1.  **Diagnostic Tools:** A formal test determining if a given allocation procedure (e.g., relying on GiveWell-style CEA) suffers from precision leakage and/or winner’s curse distortion.  
  2.  **Corrective Protocols:**  
      -   Mandatory shrinkage adjustments for rankings within noisy domains.  
      -   A "precision-discounted" cross-cause comparison rule (e.g., allocating a fixed % of funds to causes based on point estimates, and a separate % based on inverse uncertainty).  
      -   Explicit portfolio rules demanding diversification across evidence-quality tiers.  
  3.  **Clarified Burden of Proof:** Shifts the debate from "measurable vs. structural" to defining *how much* uncertainty reduction is required before an intervention is deemed "comparable" to high-precision alternatives in cross-domain ranking.  

  ### What Would Count as Failure (and Lessons)  
  1.  **Precision Leakage Collapses:** If the phenomenon reduces entirely to standard decision theory under ambiguity (e.g., Ellsberg Paradox), the project fails to identify a *novel* bias. *Lesson:* EA’s deviation from normative ambiguity-averse models becomes the core critique.  
  2.  **Formalization Fails:** If cross-cause comparisons resist rigorous modeling of evidence heterogeneity, the critique remains rhetorical. *Lesson:* Documents fundamental limits of quantitative prioritization, strengthening the structuralist case.  
  3.  **Corrections Are Impractical:** If proposed protocols (shrinkage, precision-weighting) demand unrealistic data or computation, the project offers no actionable solution. *Lesson:* Highlights inherent tensions in EA’s evidence-based ethos, necessitating qualitative governance of quantitative methods.  
  4.  **Winner’s Curse is Negligible:** If simulation shows winner’s curse effects are trivial in real-world EA contexts, that layer fails. *Lesson:* Confirms robustness of current within-domain rankings, narrowing the critique to cross-domain leakage alone.  

  **Even in failure**, this project advances the debate by replacing vague charges of "bias" with testable claims about comparison procedures. Success provides tools to make EA allocation more robust; failure clarifies why measurability critiques resist technical resolution, urging methodological pluralism.
