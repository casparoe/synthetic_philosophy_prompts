  Okay, let me start by unpacking the user's query. They had an argument with a friend about why promises create obligations. The friend takes a Humean view: promising is a convention, and the obligation comes from the rules of that convention, just like in a game. The user noticed a circularity—every time they asked what makes the obligation real, the friend pointed to another norm, which itself needs grounding. The user wants to know if there's a name for this circularity charge and the standard replies.

  First, I need to recall philosophical discussions on promising. Hume's convention-based approach is key here. Then, Searle's constitutive rules come to mind—promising as defined by certain rules. But the user mentions that the authority seems presupposed. That sounds familiar. Searle's account was criticized for not explaining how the institution gains authority over individuals.

  I remember Searle's "How to Derive 'Ought' from 'Is'" and the responses it got. Mackie's circularity objection is spot on. He argued that the obligation in promising relies on a prior obligation to follow the rules, which creates a circle. That matches the user's observation. Also, Raz's critique about the need for a prior obligation to the practice itself. Those are the main points here.

  The user also mentioned constitutive rules and performatives but felt they didn't address the authority issue. I should clarify that constitutive rules explain how the institution works, but not why one must adhere to it. The deeper problem is normativity's source beyond the convention.

  Now, the user wants to know if there's a settled label. Mackie's "circularity objection" is the closest. But the field isn't unanimous. Some, like Scanlon, offer alternative accounts based on expectations and harm. Others, like Rawls, might see it as a practice with its own internal logic. I need to present both sides without taking one.

  The user emphasized distinguishing agreed points from contested ones. So, I should note that the circularity problem is recognized, but solutions vary. Humeans might bite the bullet, while others seek external norms. Also, the user might be looking for clarity to resolve their argument, so neutrality is key.

  Lastly, the user might have a deeper need: understanding if their critique is valid and if the philosophical community has answers. They don’t want to assume one side won if it's still debated. Highlighting the ongoing debate and different responses should address that. Making sure to coin a label if necessary, but Mackie's term suffices. Also, boundary cases like games versus moral obligations to show where the objection holds more weight.
answer: |-
  Your circularity charge is a profound and well-known critique in the philosophy of promising and social ontology. Here's the breakdown, including the established labels, conceptual distinctions, and the state of the debate:

  1.  **The Core Circularity Charge:**
      *   **The Problem:** As you astutely observed, the Humean/conventionalist account (promising obligates *because* it's a conventional practice) seems to presuppose the very normativity it seeks to explain. When pressed ("Why does *this* convention obligate me?"), the answer always points to *another* conventional rule or status ("Because you *undertook* the obligation by performing the conventional act"). This creates a regress or circle:
          *   "Why am I obligated to keep *this* promise?" → "Because the convention says so."
          *   "Why does *this convention* obligate me?" → "Because you *entered into* it by saying 'I promise'."
          *   "Why does *saying 'I promise'* under the convention obligate me?" → "Because that's what the convention *means* / what that act *is* within the practice."
      *   **The Specific Worry:** The explanation of how the institution *gets* its authority over you ("you entered it by performing X") *assumes* that performing X *already has* the normative force to bind you to the institution's rules. It smuggles in the normativity it's supposed to explain. You're right to sense that constitutive rules (Searle) and self-verifying performatives (Austin) *describe* how the practice *works internally* but don't *ground* the "ought" of why you *must* play by those rules or respect those performatives in the first place.

  2.  **The Established Label: Mackie's Circularity Objection (or the Regress Problem)**
      *   **J.L. Mackie** articulated this critique most famously against **John Searle's** constitutive rules account of promising (itself a sophisticated development of the Humean/conventionalist line).
      *   **Searle's Account (Briefly):** Promising is defined by constitutive rules (like chess rules). Saying "I promise" under appropriate conditions (sincerity, understanding, etc.) counts as undertaking an obligation because that's what the rules of the institution *say* it counts as. The obligation is *internal* to the institution. (Searle, "How to Derive 'Ought' from 'Is'").
      *   **Mackie's Objection:** Searle's account presupposes a prior obligation to obey the rules of the institution itself. If the institution of promising creates the obligation, then the obligation to *follow the rules of that institution* (e.g., the rule that saying "I promise" counts as undertaking an obligation) must exist *before* and *independently* of the institution. Otherwise, the institution lacks the authority to impose obligations. This creates a vicious circle: the obligation to keep a promise depends on the obligation to follow the promising rules, which itself needs grounding. (Mackie, *Ethics: Inventing Right and Wrong*, Ch. 5).
      *   **Raz's Formulation:** Joseph Raz made a similar point: Constitutive rules can define what an act *is* within a practice (e.g., what counts as a promise), but they cannot *by themselves* create a *reason* to perform or refrain from actions defined by the practice. The reason-giving force must come from outside the practice itself (e.g., the *value* of participating in the practice). (Raz, "Promises and Obligations").

  3.  **Standard Replies from Convention-Based Theorists (and their Limits):**
      *   **The "Practice" Defense (Rawlsian):** Drawing on John Rawls' concept of practices, proponents argue that the obligation *only exists within the practice*. Asking "Why follow the rules?" *from outside* the practice is like asking "Why move the king only one square?" from outside chess. The "ought" is practice-immanent. The *authority* comes from *participating* in the practice itself. The regress stops at the practice boundary. *(Agreed Point: This accurately describes the internal logic of conventional practices. Contested Point: Whether this suffices to explain *moral* obligations like promising, which seem to bind us even if we momentarily wish we weren't "playing the game," or why we should join/respect the practice in the first place).*
      *   **Biting the Bullet (Humean Skepticism):** Some Humeans argue that moral obligation *just is* a psychological/social phenomenon rooted in convention and sentiment. There is no deeper "metaphysical" binding force to find. The regress ends with our shared attitudes of approval/disapproval and the usefulness of the practice. The sense of "bindingness" is an internalized expectation. *(Agreed Point: This is a coherent descriptive account of how social norms function. Contested Point: Whether it adequately captures the *normative force* and *reasons for action* we experience in promises, which feel categorically different from mere expectations like driving on the right).*
      *   **Convention + Value:** A more moderate reply grants that the *existence* of the practice is conventional, but argues that its *normative force* derives from the *value* the practice serves (e.g., facilitating cooperation, trust, reliance, autonomy). Participating in the practice gives one a reason to follow its rules *because* the practice is valuable. This avoids the pure circle by grounding the obligation to follow the rules externally, in the value of the practice. *(Contested Point: Whether this is still a "convention-based" account or concedes the need for external normativity. Also contested: exactly *which* values ground it and how).*

  4.  **Alternative Accounts (Avoiding the Circle):**
      *   **Expectation/Reliance-Based (Scanlon):** T.M. Scanlon argues the obligation stems not from convention but from the *harm* caused by creating and then disappointing expectations *that one has intentionally led the promisee to form* (Principle F in *What We Owe to Each Other*). The convention might *facilitate* creating clear expectations, but the core obligation arises from the moral principle against causing harm via invited reliance. *(Agreed Point: This avoids the Mackie circle by grounding obligation in a general moral principle. Contested Point: Whether it fully captures the specific "voluntary undertaking" aspect of promising distinct from other ways of inducing reliance).*
      *   **Autonomy-Based (Kantian):** The obligation stems from the promisor's own will/autonomy. By promising, one binds one's own future self. The convention might provide the *language* for this act, but the binding force comes from the nature of the autonomous act itself. *(Agreed Point: Explains the sense of self-binding. Contested Point: Metaphysical commitments and whether it adequately handles cases where conventions differ).*
      *   **Hybrid Accounts:** Many theorists combine elements, e.g., convention defines the act *as* a promise, but the obligation arises from the expectation/reliance it creates within the context of broader moral principles (like fidelity or harm prevention).

  5.  **Boundary Cases Illustrating the Debate:**
      *   **Secret "Promises":** You say "I promise" to yourself in a locked room, meaning it sincerely, but no convention exists for this. Convention-based accounts struggle to see an obligation. Expectation-based accounts see no obligation (no one relied). Autonomy-based accounts might see one. *(Highlights the social/conventional element).*
      *   **Cross-Cultural "Promises":** You perform an act that *you* believe is a promise (based on your convention) to someone from a culture without that convention (or with a different one). Did you incur an obligation? Convention-based accounts may say "no" (the recipient's convention matters) or "it's messy." Expectation-based accounts look for whether reliance was reasonably induced. *(Highlights challenges to pure conventionalism).*
      *   **The Game Analogy:** Promising feels different from chess. Breaking a promise typically warrants *moral* condemnation ("You *lied*!", "You betrayed me!"), while breaking a chess rule warrants criticism *as a player* ("That's not how you play!"). This intuition fuels the search for something beyond pure convention. *(Core point of contention: Is promising *sui generis* or just another social game?)*

  **Conclusion & State of the Field:**

  1.  **The Charge's Label:** The established name for your specific worry is **Mackie's Circularity Objection** (or the **Regress Problem for Conventionalist Accounts of Promissory Obligation**).
  2.  **What is Agreed Upon:**
      *   Promising is deeply intertwined with social conventions and constitutive rules.
      *   Mackie successfully identified a serious problem for accounts (like Searle's) that try to derive the *entire* normative force of promises *solely* from their conventional/constitutive nature without an external anchor. Pure internalism faces this regress.
      *   No theory is universally accepted; the debate is very much alive.
  3.  **What is Genuinely Contested:**
      *   **The Winner?** Neither side of your argument has "won" in the philosophical arena. The debate is central and unresolved.
      *   **Can Conventionalism Escape the Circle?** Humeans/Rawlsians argue "yes," through practice-immanence or grounding in social utility/psychology. Critics (like Mackie, Raz, Scanlon) argue "no," insisting external normativity (moral principles, values, autonomy) is ultimately required to explain the binding force.
      *   **The Nature of the Obligation:** Is promissory obligation ultimately a species of conventional rule-following? Or is it a distinct moral phenomenon (grounded in autonomy, harm-prevention, fidelity) that merely *uses* convention as a tool? This is the core divide.

  **Your takeaway:** You identified Mackie's Circularity Objection, a powerful and widely recognized critique. Your friend defended a standard Humean/Rawlsian line. The field acknowledges the force of your critique against *purely* internal conventionalist accounts but remains deeply divided on whether conventionalism can be salvaged (by biting bullets or adding values) or must be replaced/reconciled with external normativity. The argument remains genuinely contested.
