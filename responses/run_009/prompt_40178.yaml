answer: |-
  Your intuitions form a surprisingly coherent pattern rooted in **desert constrained by agency and social reciprocity**, not cosmic justice. Here's the principle that captures your cases, why your karma-like intuition for punishment feels metaphysical, and which verdict might need adjustment:

  ### The Principle: Restricted Agent-Relative Desert
  > **"X deserves Y" is a meaningful statement only when:**
  > **1. Y is intrinsically linked to X's agential choices (intention, effort, or culpable negligence);**  
  > **2. AND Y serves a socially functional purpose (deterrence, reciprocity, or affirming agency).**  
  > **Desert diminishes or vanishes when:**
  > **- Y is disconnected from X's agency (congenital illness, pure luck),**  
  > **- OR assigning Y would undermine social function (e.g., punishing the abused).**

  ### How It Explains Your Cases
  | **Case**                          | **Verdict**                 | **Explanation via Principle**                                                                 |
  |-----------------------------------|-----------------------------|-----------------------------------------------------------------------------------------------|
  | **Escaped war criminal**          | "Didn't get what was owed"  | **Violates agency + social function:** His suffering is *owed* because it's causally tied to **his choices** AND needed to affirm moral order (deterrence/reciprocity). Your intuition isn't metaphysical—it's **unfulfilled social demand for accountability.** |
  | **Child with illness**            | "Does not deserve it"       | **Agency missing:** No link to her choices. Assigning desert would be morally monstrous and socially destructive.               |
  | **Lottery winner**                | "Not deserved, but not offensive" | **Agency missing:** Windfall is pure luck. No social harm in unearned gain (asymmetry explained below).                         |
  | **Drunk drivers**                 | "First more blameworthy"    | **Agency illusion:** Your intuition conflates *outcome* with *culpability*. Control principle is correct—but **outcome affects social function** (need for restitution/deterrence). |
  | **Hard worker with mediocre talent** | "Deserved but diluted"    | **Partial agency:** Desert exists for *effort* (agential), but diluted by luck of talent. Social function: rewarding effort incentivizes virtue. |
  | **Abused perpetrator**            | "Blame shrinks but ≠0"      | **Agency constrained:** Choices exist but are contextually limited. Full punishment would violate social function (mercy/restoration > retribution). |

  ---

  ### Addressing Your Core Questions
  1. **Can I keep "owed suffering" without karma?**  
     **Yes, but it's not cosmic debt—it's a social claim.** Your war-criminal intuition reflects **moral residue**: unaddressed harm demands societal response to restore equilibrium. If society fails, it feels like a "cosmic" injustice—but it’s really **unmet social obligation**. Karma mistakenly personalizes this as individual cosmic debt.

  2. **Punishment vs. Reward Asymmetry**  
     Your stronger reaction to *undeserved suffering* (child) than *undeserved gain* (lottery) isn’t salience bias—it’s **evolutionary and normative**:  
     - Undeserved suffering directly threatens survival/well-being.  
     - Undeserved gain rarely harms others systemically.  
     - Moral systems prioritize minimizing harm over maximizing fairness.

  3. **The Stolen Inheritance Case**  
     - **Did they deserve the inheritance? No.** It originated in theft (no agency link).  
     - **Does giving it away "deserve" praise? Yes.** Their *choice* to redistribute is agential and socially functional.  
     - **Is justice achieved? Partially.** Victims aren’t made whole (theft’s harm persists), but the act mitigates harm and affirms reciprocity.  

  ---

  ### Which Verdict Should Go? The War Criminal
  Your intuition that the war criminal’s peaceful death is a **metaphysical injustice** must be revised. It’s a **social/political failure**, not evidence of a cosmic ledger. The "unpaid debt" is owed *by society*, not *to the universe*. If no one enforces desert, it doesn’t collapse into aesthetics—it highlights **human responsibility to create justice systems**. 

  ### Why the War Criminal Feels Metaphysical
  - **Social Ape Wiring:** Your brain equates unpunished grave wrongs with **unresolved threats to group cohesion**. Evolutionarily, this feels existentially urgent—hence the "cosmic" tone.  
  - **Moral Disgust:** Acts like war crimes trigger deep-seated revulsion, making their escape feel like a violation of natural order.  

  ---

  ### The Real Takeaway: Desert as a Social Tool
  Your intuitions align with **desert as a human construct for regulating cooperation**. It requires:  
  1. **Agency** (to assign responsibility),  
  2. **Social utility** (to maintain trust and order).  
  Karma’s appeal is its false promise of automated justice—but your own principles show why we must build justice ourselves. The war criminal *is* owed suffering—**by us**.
