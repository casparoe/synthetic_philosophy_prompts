          Question 5 (invented: Bilingual immediacy):
            "In bilinguals who speak two languages that differ in the relevant feature (like carving up the blues differently or using different spatial frames), when they are tested in each language and show a shift in cognitive patterns, does this shift happen because they are currently using that language (suggesting an online effect) or because they have developed two different enduring cognitive habits (one for each language)?"

          Now, leaves:

            Leaf "Third-factor co-tracking" (unnamed): 
               Awkward commitment: "Must hold that language and cognition are independently shaped by the same external factors, even when the linguistic feature seems to be the obvious driver."

            Leaf "Thinking-for-speaking":
               Awkward commitment: "Must hold that language only affects cognition during the moments when we are using language, even for deep-seeming cognitive patterns."

            Leaf "Grammar-specific offline modulation" (unnamed):
