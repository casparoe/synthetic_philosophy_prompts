  ### Decision Tree: Does Language Shape Thought?

  **Starting Point:** You grant that controlled experiments show cross-linguistic differences in non-linguistic tasks (e.g., spatial reasoning, color discrimination, object personification).  
  **Instructions:** Answer each question based on concrete cases (described below). Do not rely on theoretical labels—use your judgment about the phenomena.

  ---

  #### Cases for Reference:
  - **Absolute Directions:** A language requires compass-like directions (north/south) even for indoor tasks (e.g., "the cup is north of the plate"). Speakers show superior non-linguistic spatial reorientation skills.  
  - **Color Carving:** Two languages partition the blue spectrum differently (e.g., one has a single "blue" term; another distinguishes "light blue" and "dark blue"). Speakers differ in non-linguistic color discrimination tasks.  
  - **Number Marking:** A language obligatorily marks number on all nouns (e.g., "apple" vs. "apples"); another rarely marks it. Speakers differ in attention to quantity changes.  
  - **Grammatical Gender:** A language assigns gendered pronouns to objects (e.g., a bridge is "she"); another has no gender. Speakers personify objects differently in non-linguistic tasks.  
  - **Bilingual Shifting:** Bilinguals tested in each language shift cognitive patterns (e.g., spatial framing or color discrimination) with the language of the session.  

  ---

  #### The Tree:  
  1. **Direction of causation?**  
     - *Consider cases like absolute directions or grammatical gender. Do you think:*  
       - **(A)** The language itself shapes the cognitive pattern (e.g., using compass directions trains spatial skills)?  
       - **(B)** Both language and cognition are jointly shaped by external factors (e.g., culture, environment, schooling)?  

     - **If (B) → Leaf: Third-Factor Co-Tracking (unnamed)**  
       - *Awkward commitment:* Must hold that language and cognition are independent effects of a shared external cause, even when linguistic features appear directly responsible.  
     - **If (A) → Proceed to 2.**  

  2. **Persistence under load?**  
     - *When subjects perform a concurrent verbal task (e.g., repeating words), do differences vanish? For example:*  
       - In absolute directions: If verbal working memory is overloaded, do speakers lose their non-linguistic spatial advantage?  
       - In number marking: Do speakers stop noticing quantity changes?  
       - **(A)** Differences wash out under verbal load.  
       - **(B)** Differences survive verbal load.  

     - **If (A) → Leaf: Thinking-for-Speaking**  
       - *Awkward commitment:* Must hold that language only affects cognition during language planning/production, despite evidence of "deep" cognitive habits.  
     - **If (B) → Proceed to 3.**  

  3. **Modulation or constitution?**  
     - *Consider number marking or evidentiality (grammatical marking of evidence sources). Does the linguistic resource:*  
       - **(A)** Make certain thoughts *easier/harder* (e.g., noticing quantities)?  
       - **(B)** Make whole classes of thought *unavailable* without it (e.g., exact large quantities or fine evidential distinctions)?  

     - **If (A) → Proceed to 4.**  
     - **If (B) → Proceed to 5.**  

  4. **Grammar or vocabulary?**  
     - *Do differences arise only for grammatical features (e.g., obligatory number/gender marking) or also for vocabulary (e.g., color terms, spatial metaphors)?*  
       - **(A)** Only grammar (e.g., gender affects personification; number affects quantity attention).  
       - **(B)** Also vocabulary (e.g., color terms affect discrimination; spatial metaphors affect reasoning).  

     - **If (A) → Leaf: Grammatical Primacy (unnamed)**  
       - *Awkward commitment:* Must hold that only grammatical features modulate non-linguistic cognition, even when vocabulary differences are pronounced.  
     - **If (B) → Leaf: Habit-Level Relativity**  
       - *Awkward commitment:* Must hold that language molds habitual thought but cannot make thoughts *impossible*, despite cases like rare color distinctions.  

  5. **Grammar or vocabulary?** (Reused for constitution branch)  
     - *Same as Question 4.*  
       - **(A)** Only grammar.  
       - **(B)** Also vocabulary.  

     - **If (A) → Leaf: Language as Cognitive Tool**  
       - *Awkward commitment:* Must hold that grammatical features enable thoughts otherwise impossible (e.g., exact arithmetic), even if vocabulary could theoretically compensate.  
     - **If (B) → Leaf: Strong Determinism**  
       - *Awkward commitment:* Must hold that lacking a word (e.g., for a color or direction) makes the concept unthinkable, despite bilinguals accessing "missing" concepts.  

  ---

  ### Unseparated Leaves & Unoccupied Combinations  
  **Unseparated Pair:**  
  - **Habit-Level Relativity** and **Language as Cognitive Tool** cannot be cleanly divided.  
    - *Why:* Both endorse offline effects and acknowledge grammatical influence. The tree uses "modulation vs. constitution" to split them, but if a student sees language as *enabling* (not forcing) new thoughts without strict unavailability, they could ambiguously align with either.  

  **Unoccupied Combination:**  
  - **"Vocabulary-Only Constitution"** (constitution + vocabulary differences only) is absent.  
    - *Why likely empty:* If language *constitutes* thought (making concepts impossible without specific words), grammar is typically implicated (e.g., grammatical number enabling exact quantities). Vocabulary differences alone (e.g., color terms) rarely render concepts inaccessible—bilinguals and context can access "missing" labels. Thus, this combination lacks empirical support.  

  ---

  ### Notes  
  - **Universalist View:** Not a leaf because the starting point grants experimental differences. It would require rejecting the initial premise (e.g., attributing results to task design).  
  - **Your Invented Question:** Question 5 (**Grammar or vocabulary?** reused) is the only custom addition. It disambiguates constitution cases.  
  - **Cases Drive Answers:** All questions are answerable from concrete phenomena (e.g., bilingual shifting for immediacy; color terms for vocabulary effects).
