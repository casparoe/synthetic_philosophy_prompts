            - Habit-level relativity we have (long-term branch).
            - Universalist is missing -> we will note in closing.

          Let's write the tree with concrete cases in the questions:

          Question 3 (Direction of causation): 
            "Consider a language that requires speakers to use compass-like directions (north, south) even for giving directions indoors, and its speakers show superior performance on non-linguistic tasks involving absolute directions. Do you think the language is causing the cognitive skill, or are both the language and the cognitive skill independently shaped by the surrounding culture or environment?"

