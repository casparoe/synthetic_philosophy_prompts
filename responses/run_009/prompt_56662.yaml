  In graduate seminars the argument over Nozick's Wilt Chamberlain example gets replayed with the same few moves and no converts: the Nozickian holds that any patterned principle of justice, such as Rawls's difference principle, must either forbid voluntary transfers — the fans' dollar bills going into Wilt's box — or else repeatedly interfere with them, so that maintaining a pattern requires ongoing violations of liberty; the egalitarian replies, in the spirit of G. A. Cohen, that whether Wilt's takings count as voluntary depends on the baseline, so liberty is not a pattern-neutral input, and that one cannot certify the starting distribution as just without already knowing something about how later holdings may turn out. Neither side has visibly moved in decades, and both quietly route the hard cases through the rectification clause that everyone agrees is underdeveloped. My working hypothesis is that the dispute is really about baselines — about when a person counts as taking from another rather than merely failing to give, and whether entitlement theory presupposes a baseline it cannot itself ground — so that the impasse is internal to Nozick's framework rather than a stalemate between it and its critics. Diagnose what kind of disagreement this actually is — substantive, verbal, or two different questions under one heading — grounded in what each side actually argues, and tell me what, if anything, would count as progress: a sharper distinction, a formal account of baselines, a change of question, or nothing at all. Lead with your diagnosis in the first sentence, then give your reasoning, with no preamble and no restatement of my question.
