prompt: |-
  i'm agnostic, raised evangelical, and my sister is a theist who reads a lot of philosophy of religion. We've been going around about divine hiddenness for like a year. My credence that it's a genuine problem for theism — that God's staying hidden enough that nonresistant nonbelievers exist is significant evidence against a perfectly loving God — is about 0.75. Hers is about 0.25. Give me your actual number, not a tour of the positions, and decompose how you got it: the chance that nonresistant nonbelief even exists (she thinks everyone who disbelieves is resisting somehow, which is awkward, since by my own lights I'm one of them), the chance that a perfectly loving God would prevent it if theism were true (vs the epistimic-distance idea that God hides to leave room for a free response, or wants mature souls rather than dependent ones), whether hiddenness is just the problem of evil wearing a costume and so adds nothing new once you already weigh the evil, and any other terms you think belong. A rough probability and one line of justification for each, then how they combine into your final credence. Then tell me which term you're least confident in, what would actually move it, and which single premise, if one of us budged on it, would collapse the gap between us. Take a side — I've had a year of "reasonable people differ."
reasoning: |-
