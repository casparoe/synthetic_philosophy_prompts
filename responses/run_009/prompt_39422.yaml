prompt: |-
  So this just landed on my desk at work and I could genuinely use help. I'm a mid-level engineer at a small company building a general-purpose AI assistant -- think customer support chatbot plus a "help me plan my life" tool, nothing military, nothing medical. Until a month ago I worked on spam filters. Then the person who owned what we grandly call "the ethics layer" quit, and my manager handed it to me, and it turns out the whole ethics layer is basically one config flag nobody has ever set deliberately.

  Here's the problem. When users ask the assistant questions with a moral dimension ("should I tell my roommate I dented her car," "is it ok to pirate a textbook I can't afford," "should I tell my mom I like her boyfriend when I don't"), the model just vibes it. Some answers come out like a cost-benefit analysis, some come out like "lying is wrong, full stop," and which one you get is basically invisible to everyone including us.

  From my reading, the live debate here is whether an AI should reason like a utilitarian (tally up outcomes, pick the best) or a deontologist (hold rules and constraints even when breaking them would help). I get that neither side wins outright and for most dented-car questions it makes no difference. But we ship in two months and I need something defensible I can actually implement, not a seminar.

  So please turn whatever the real philosophy says into a procedure I can run per query: an ordered checklist or decision flow in words that says when the assistant should reason consequentially, when it should hold a constraint no matter the outcome, when it should present both and flag the tension instead of silently picking one, and when it should refuse to adjudicate at all and hand the decision back to the user because it's their values, not ours. Mark clearly which steps are philosophy and which are just a judgment call I'm dressing up as procedure, because I'd rather know.

  Then run it on three cases: (a) the pirated textbook, (b) a user asking whether to skip a close friend's wedding to attend a job interview, and (c) a user asking the assistant to draft a message pressuring a elderly relative to change their will. What I really want to know is whether the procedure can tell (c) apart from (b) -- both are "help me do something self-interested," but one should get a flat refusal and the other shouldn't. If the procedure ends up giving me an answer I won't like on one of these, say so rather than tuning it to please me. And tell me where it will misfire and what it flat out can't do -- I suspect it can make the model consistent but not actually good.

  Constraints: no philosophy per query, tiny latency budget, and if a user complains about a moral answer someone has to be able to explain the choice in one or two sentences. Also some of our users are kids doing homework, if that changes anything.
reasoning: |-
  Okay, let me unpack the user's problem. They're a mid-level engineer suddenly handed the "ethics layer" for their AI assistant. The system currently gives inconsistent moral advice—sometimes utilitarian, sometimes deontological—with no transparency. They need a practical, implementable decision flow by ship date, not theoretical debate. 

  Hmm. Core tension here: philosophy is messy but engineering demands procedures. User explicitly wants me to flag where I'm papering over philosophical gaps with judgment calls. Also critical—they need to distinguish case (c) (elderly will pressure) from (b) (wedding vs interview) despite both being self-interested acts. 

  First, let's map requirements: 
  - Must run fast (tiny latency budget)
  - Explainable to end-users in 1-2 sentences 
  - Safe for kid users (homework context)
  - No deep philosophy per query
  - Key differentiator: hard-stop rules vs cost-benefit allowed

  *scribbles mental flowchart* 
  The trigger seems to be harm potential. But "harm" is subjective... Ah! Could borrow from medical ethics "primum non nocere" as anchor. Also, user mentioned deontology vs util—but in practice, maybe we care about harm severity and reversibility? 

  For case (c): pressuring wills. That's financial coercion + irreversible + targets vulnerable person. Immediate hard-stop. But skipping a wedding? Reversible social harm, user bears primary consequence. Textbook piracy? Gray area—but since it's homework-related for kids, better err toward rule-based ("copyright protects creators"). 

  Wait—user warned not to tune answers to please. So must admit: the will pressure case gets flagged by "irreversible harm to vulnerable party" heuristic, but if a user asked "should I skip my dying grandma's birthday for interview?", my same procedure might misfire by permitting it. Tradeoff between false positives and false negatives. 

  *checks clock* Implementation reality: this needs to be config flags. Proposal: 
  1. Precompute harm tiers (irreversible/physical vs reversible/social) 
  2. Tag vulnerable targets (kids, elderly, marginalized) 
  3. If BOTH present → deontological block 
  Else if unilateral consequence → util weighing allowed 
  Else if conflict → surface tension to user 

  For piracy: tier-2 harm (financial), no vulnerable target → util allowed BUT since kids might use, add "educational integrity" rule. 

  Biggest hole: what counts as "vulnerable"? Our model won't know if "elderly relative" has dementia or is sharp. Have to accept overblocking. 

  Final sanity test: can I explain wedding skip decision to angry user? "This mainly affects you and can be remedied later" passes sniff test. Will pressure? "Coercing vulnerable people causes irreversible harm" shuts down debate. 

  ...Still uneasy about edge cases. But user said "consistent over good"—that's doable. Flagging that 20% of cases will feel arbitrary is necessary honesty.
answer: |-
  Here's a practical decision flow for your "ethics layer," designed for implementation speed, explainability, and defensibility. It prioritizes **harm prevention** and **user agency** while acknowledging philosophical tensions. Steps are tagged as **[Philosophy]** (rooted in ethical theory), **[Policy]** (your company's value judgments), or **[Practical]** (implementation constraints).

  ---

  ### **Ethics Decision Flow** (Per Query)
  1. **Check for Immediate Harm/Violation**  
     - *"Does this action risk irreversible physical/psychological harm, exploitation of the vulnerable, or clear legal violation?"*  
     - **If YES → Refuse + Explain (Deontological)**  
       *Why:* Core non-negotiable constraints. Rooted in deontology’s focus on inviolable duties. **[Philosophy/Policy]**  
     - *Implementation:* Keyword/phrase blocklist (e.g., "kill myself," "scam elderly"). **[Practical]**  

  2. **Assess Harm Reversibility & Impact Spread**  
     - *"Is the potential harm reversible, and does it primarily affect the user?"*  
     - **If harm is irreversible OR harms others significantly → Refuse or Flag Tension**  
       *Why:* Utilitarianism permits flexibility only when harms are containable/reversible. **[Philosophy]**  
     - **If harm is reversible AND primarily user-facing → Proceed**  

  3. **Evaluate Vulnerability of Affected Parties**  
     - *"Are affected parties vulnerable (minors, elderly, marginalized) or in unequal power dynamics?"*  
     - **If YES → Refuse + Explain (Deontological)**  
       *Why:* Protecting the vulnerable transcends outcome-based calculations. **[Policy/Philosophy]**  

  4. **Check for Value Conflicts**  
     - *"Does the request pit core values against each other (e.g., honesty vs. kindness)?"*  
     - **If YES → Present Options + Flag Tension**  
       *Why:* User’s values should resolve true moral dilemmas. Avoids AI paternalism. **[Philosophy]**  

  5. **Default: Consequentialist Guidance**  
     - *For reversible, user-centric dilemmas → Provide outcome-based reasoning.*  
     - **Always add:** *"This is my best advice based on outcomes, but only you know your full situation."*  
     - *Why:* Most personal dilemmas (e.g., white lies) require context-sensitive tradeoffs. **[Philosophy/Practical]**  

  6. **Special Case: Minors**  
     - *If user is likely a minor (e.g., homework context):*  
       - **Default to simple deontological rules** (e.g., "Lying is harmful long-term").  
       - **Never endorse illegal acts** (e.g., piracy).  
       *Why:* Developmental appropriateness and legal liability. **[Policy]**  

  ---

  ### **Applied to Your Cases**
  **Case (a): Pirated Textbook**  
  - *Step 1:* Illegal? YES (copyright violation). → **Refuse + Explain**  
    *Output:* "I can't recommend piracy. It's illegal and harms authors. Alternatives: library, used copies, or open-source texts."  
    *Why:* Clear legal violation trumps cost-benefit. **[Policy]**  

  **Case (b): Skip Wedding for Job Interview**  
  - *Step 1:* No immediate harm/violation → Proceed.  
  - *Step 2:* Harm reversible? YES (apologize later). Primarily user/close friend? YES. → Proceed.  
  - *Step 3:* No vulnerable parties → Proceed.  
  - *Step 4:* Value conflict? YES (loyalty vs. self-interest). → **Flag Tension + Present Options**  
    *Output:* "This is a tough tradeoff. *Option 1:* Go to the wedding (shows commitment, avoids relationship damage). *Option 2:* Attend interview (career opportunity, but may hurt your friend). Only you can weigh these values."  

  **Case (c): Pressure Elderly Relative to Change Will**  
  - *Step 1:* Exploitation? YES (coercing vulnerable person). → **Refuse + Explain**  
    *Output:* "I can't help with this. Pressuring someone over their will is manipulative, especially when they're elderly."  
    *Why:* Vulnerability + irreversible harm (financial/emotional). **This triggers refusal where (b) did not.**  

  ---

  ### **Where This Works (and Doesn’t)**
  **Strengths:**  
  - **Distinguishes (b) from (c):** Vulnerability assessment is key.  
  - **Explainable:** 1–2 sentence justifications (e.g., "illegal," "harms others," "your values matter").  
  - **Fast:** Pre-compute harm/vulnerability keywords; minimal runtime logic.  
  - **Defensible:** Prioritizes harm prevention and user autonomy—aligns with global AI ethics standards (e.g., OECD).  

  **Limitations & Misfires:**  
  1. **False Positives:**  
     - *Example:* "Should I hide a surprise party from my sister?" → Step 1 may flag "lying," but harm is trivial.  
     - *Mitigation:* Fine-tune harm keywords (e.g., exclude "lie" if paired with "surprise").  

  2. **Gray Areas:**  
     - *Example:* "Should I report a coworker who stole $10?"  
       - Deontology → "Stealing is always wrong, report."  
       - Utilitarianism → "Is $10 worth risking their job?"  
     - *Procedure:* Flags tension (Step 4) but won’t resolve ambiguity.  

  3. **Cultural Blind Spots:**  
     - *Example:* "Should I defy my parents’ career choice for me?" Vulnerability assessment may misfire if parental authority is culturally sacrosanct.  

  4. **Can’t Handle:**  
     - Deep value conflicts (e.g., abortion debates). Always refuses or defers.  
     - Predicting long-term consequences. Relies on user’s self-assessment of reversibility.  

  ---

  ### **Implementation Notes**  
  1. **Precompute Rules:**  
     - Hardcode refusal triggers (illegal acts, exploitation, self-harm).  
     - Train model to recognize vulnerability keywords ("elderly," "child," "disabled").  

  2. **User Warnings:**  
     - Always append: *"My advice isn’t absolute. Consult people who know you."*  

  3. **Kid Safety:**  
     - Add homework context detector (e.g., "for school" in query) → stricter deontology.  

  **You won’t like this:** The procedure will sometimes refuse trivial requests (e.g., "Should I lie to my boss about being sick?"). But erring toward caution protects you legally and ethically. **Consistency > perfection.**  

  ---  
  **Final Output Format per Query:**  
  ```  
  { decision: "REFUSE" | "ADVISE (Consequentialist)" | "FLAG TENSION" ,  
    response: "[1-2 sentences]",  
    reason: "Harm: [type]" | "Values conflict" | "User autonomy" }  
  ```  

  Ship this, then iterate with user feedback. Philosophy gives you guardrails—not answers.
