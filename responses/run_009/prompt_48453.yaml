  2. The "keep going" process itself — if I keep picking strictly bigger elements, why can't that just go on forever? I gather the answer is something like "you run out of ordinals before you run out of steps," but I want to see how that actually gets cashed out in the proof. And does this mean we need the axiom of replacement somewhere, or is the Hartogs construction enough to do the job?

  Also a smaller thing: does the empty chain needing an upper bound actually matter, or is the poset being nonempty just a convention people tack on?

  Give me the gut-level version, not the formal statement again — I've read the formal statement like five times lol. If some piece of the naive intuition is genuinely wrong or incomplete, say that plainly instead of rescuing it.
