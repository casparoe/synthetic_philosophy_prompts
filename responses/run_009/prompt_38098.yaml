prompt: |-
  I'm a PhD student in political theory writing a dissertation on republican liberty, and for the past year I've also served as bylaws reviewer for the housing cooperative I live in — about 180 units, an elected seven-person board, and an amendment process in which every proposed change passes through me for a first read before it goes to a membership vote. Lately the board has been sending a steady stream of governance amendments, and I've noticed my written comments have degenerated into vibes: I call a rule "a bit heavy-handed" or "seems fine" without any systematic account of why. Since non-domination is supposed to be the organizing concept of my dissertation, I'd like to hold our bylaws to the standard my thesis defends rather than to my mood on a given Tuesday.

  The distinction I want the procedure built around is the republican one between interference and domination: a rule can constrain a member without dominating them, provided it isn't arbitrary — provided it tracks interests the constrained members share, and provided those subject to it can contest its application and get decisions reviewed — whereas a rule vesting an official with open-ended discretion dominates the member even if the discretion is never once exercised, because the member lives at the official's mercy. The co-op setting supplies the natural materials for testing this: who proposed the rule, on what terms, what counts as compliance, and what recourse a member has after a decision is made.

  Please give me a screening procedure I can run on any proposed amendment in about ten minutes, expressed as exactly five numbered steps, each a sentence or two, with no introduction or conclusion. Make the order matter — a proposal should be able to fail at step two without my having to work through step four. Weave a brief application of each step into at least one of the two live proposals I'm reviewing this month: (a) the board may enter any unit on 48 hours' notice to inspect for documented maintenance concerns, with the inspection report appealable to the membership; and (b) the board may levy discretionary fines of up to one month's fees for conduct it deems "uncooperative," with no appeal specified. Make the fifth step the one that identifies where judgment cannot be eliminated, and be honest about which kinds of proposals the procedure will wave through despite the fact that a republican theorist ought to be suspicious of them.
reasoning: |-
  Okay, the user is a PhD student in political theory focusing on republican liberty, specifically non-domination. They're also reviewing bylaws for their housing cooperative and want a systematic, republican theory-based screening procedure for amendments. They've noticed their reviews have become too vague, so they need a structured, five-step process that's efficient—each step should take about ten minutes total. 

  The key distinction they want to apply is between interference (acceptable if non-arbitrary) and domination (unacceptable due to arbitrary power). They provided two real proposals: (a) inspections with appeal and (b) discretionary fines without appeal. The procedure must be ordered so early steps can reject proposals without completing later ones, and step five should highlight unavoidable judgment calls. The user also wants honesty about limitations—what kinds of proposals might slip through despite republican concerns.

  First, I need to extract the core principles from republican theory. Non-domination requires rules to not be arbitrary—meaning they must track shared interests and allow contestation. For the co-op context, this translates to: rules should have clear purposes aligned with collective interests, defined terms to limit discretion, and review mechanisms. The two examples illustrate this well. Proposal (a) has notice and appeal, which might pass step one but could fail later if the inspection criteria are vague. Proposal (b) has undefined "uncooperative" conduct and no appeal, which will likely fail early at step three.

  Now, structuring the five steps. Order matters for efficiency: start with purpose alignment (step one), then move to discretion limits (step two), review mechanisms (step three), and contestation paths (step four). Step five should address irreducible judgment, like assessing shared interests in borderline cases. For the flow: if a proposal fails step one (e.g., no clear shared purpose), I don't need to assess later steps. Same for step two—if discretion is boundless, it fails immediately. 

  Applying this to the examples: 
  - For (a), step one passes (maintenance is shared interest), step two might pass if "documented concerns" are defined, step three passes (appeal exists), but step four could flag if appeal is impractical. 
  - For (b), step one is weak ("uncooperative" lacks clarity), step two fails (discretion unlimited), so it stops there. 

  The user's deeper needs: They want academic rigor applied practically, saving time while upholding their dissertation principles. Unspoken needs include avoiding co-op conflict by depersonalizing critiques ("vibes" to theory), and ensuring the procedure covers most cases but acknowledges where subjectivity remains (step five). 

  Honesty about limitations: The procedure might wave through rules with superficial appeals or broad-but-defined criteria, as step five admits. For example, a rule with narrow discretion and token review might pass, even if a theorist worries about subtle domination. 

  Finally, I'll phrase steps concisely, weaving in examples as proof of concept. Each step is one to two sentences, numbered, no fluff. This should give the user a replicable tool that aligns with their research and reduces Tuesday-mood bias.
answer: |-
  Here is a five-step screening procedure based on republican non-domination:

  1.  **Identify the rule's purpose and assess if it demonstrably tracks a shared, fundamental interest of the cooperative membership as a whole.** If the purpose serves only a faction, administrative convenience, or an unsubstantiated claim of collective interest, it risks arbitrary interference. *(Application: (a) Inspections for documented maintenance concerns track the shared interest of preserving common property/assets. (b) Prohibiting "uncooperative" conduct is vague; without defined harm to shared co-op interests (safety, finances, governance), the purpose is unclear and likely factional/convenience-based.)*

  2.  **Examine the rule's criteria and constraints for bounded, predictable application, specifically checking for open-ended discretion.** Rules granting officials subjective judgment without clear, objective standards create arbitrary power (domination), regardless of current officeholders. Vague terms like "deems appropriate" or "uncooperative" are red flags. *(Application: (a) "Documented maintenance concerns" implies an objective trigger (existing reports/issues), bounding discretion. (b) "Conduct [the board] deems 'uncooperative'" grants boundless subjective discretion, creating domination.)*

  3.  **Determine if the rule mandates a fair, accessible process for contesting decisions *before* they impose significant burdens (fines, penalties, eviction).** The mere existence of *post*-decision review (like membership appeal) is insufficient to prevent arbitrary *application*; contestation must be possible when the decision is made or immediately after. Rules lacking preliminary contestation mechanisms dominate. *(Application: (a) While appeal *follows* inspection, the initial trigger ("documented concerns") offers a potential pre-application contest point (disputing the documentation). (b) No process for contesting the fine *before* or *immediately upon* levy is specified; the member bears the burden first, indicating domination.)*

  4.  **Verify that a robust, independent review mechanism exists for *final* decisions imposing significant burdens, ensuring it is accessible and capable of overturning arbitrary rulings.** Review must be meaningful (not merely procedural) and distinct from the initial decision-maker. Lack of specified appeal for penalties signifies arbitrary power. *(Application: (a) Appeal to the membership provides robust, independent review. (b) No appeal mechanism is specified for fines, meaning the board's discretionary decision is final, constituting clear domination.)*

  5.  **Judge whether the rule's structure (Steps 1-4) genuinely prevents domination *in practice* for this specific cooperative context, acknowledging irreducible judgment on the sufficiency of constraints, contestation accessibility, and the "sharedness" of interests.** This step flags rules technically satisfying 1-4 but where constraints are too weak, contestation too costly, or the "shared interest" too contested/stretched, requiring your assessment. *(Application: This step acknowledges that even (a) might be problematic if "documented concerns" is abused or appeals are impractical, requiring your judgment. Conversely, rules with narrowly defined powers, strong pre-application checks, and easy review (e.g., minor fee schedules for clear violations) will pass despite potential republican unease about any coercion, because the procedure eliminates arbitrariness.)*

  **Honest Limitations:** This procedure will wave through rules with:
  *   **Minimal but defined burdens:** Small, predetermined fees for objectively verifiable violations (e.g., late rent).
  *   **Highly constrained discretion:** Powers with very narrow, objective triggers and strong review, even if coercive.
  *   **Efficient but rigid processes:** Rules lacking nuanced individual consideration if constraints are strict and review exists, potentially feeling "interfering but non-arbitrary."
  Republican theorists might still critique these for *interference* or insufficient responsiveness, but the procedure specifically screens for *domination* (arbitrary power).
