prompt: |-
  For some years I have been recording my private verdicts on when an unrealistic assumption in a scientific model counts as a legitimate idealization and when it counts as intellectual cheating, and I would like to know whether a single principle governs them, because I have begun to suspect that it does not. Here are the verdicts.

  The ideal gas model's noninteracting point particles: legitimate, and the model is not even discredited by its failure near condensation, provided we know where it fails. The infinite-population assumption of classical population genetics: legitimate, even though every real population is finite and drift is real, because the finite models converge to the infinite one wherever it matters. Friedman's billiard player, the expert who plays as though he had solved the relevant optimization problem, and Friedman's leaves, which behave as though they had deliberately positioned themselves to maximize exposure to sunlight: legitimate in both cases, even though a psychologically realistic model of the player would predict missed shots, and a realistic model of the tree would predict shaded branches, that the as-if model cannot. Calvo pricing in macroeconomics — the assumption that firms may reset their prices only at randomly arriving opportunities: I accept it, flagrantly false as it is, purely for tractability. But the mortgage-security pricing models built on the assumption that a simultaneous nationwide fall in housing prices was effectively impossible: those were also chosen for tractability, and I refuse them — they seem to have assumed away the very phenomenon they existed to price. Likewise a model of bank runs that grants every depositor rational expectations and common knowledge of solvency: cheating, since the panic is the explanandum. The case I cannot settle is the homogeneous-mixing assumption in the compartmental epidemic models governments actually used in 2020: false in every particular, since contacts are structured by households, workplaces, and schools, and yet those models were useful enough to steer policy. And I confess a standing asymmetry: I accept as-if explanation in biology without blinking, but I distrust the same move when economists claim that firms behave as if they were literal profit maximizers, and I cannot tell whether that reflects a principled difference or merely my sense of which discipline has earned its idealizations.

  My tentative principle is this: an assumption is legitimate just in case substituting the more realistic assumption would leave the model's predictions about its target roughly unchanged. I can see that it is in trouble, since the billiard player and the leaves look legitimate to me while a realistic replacement would change the predictions considerably. Repair my principle or replace it so that it captures my verdicts; if nothing can capture them all, tell me which verdicts I should surrender, and why those rather than the others. State the resulting principle precisely enough to decide new cases, and tell me what it says about two cases I have not yet classified: the Coase theorem's zero-transaction-cost assumption, and the rational-expectations assumptions in the integrated assessment models used to price long-run climate damage. Finally, tell me whether the biology-versus-economics asymmetry can be given a principled defense, or whether I should discard it as prejudice.
reasoning: |-
  Hmm, the user presents a fascinating philosophical challenge about scientific modeling. They've cataloged various cases where unrealistic assumptions feel legitimate versus intellectually dishonest, and seek a unifying principle. Their examples span physics, biology, economics, and epidemiology - revealing deep interdisciplinary engagement.

  I notice their proposed principle ("realism wouldn't change predictions") fails with Friedman's billiard player case. This suggests we need a more nuanced view. The mortgage-security example is particularly illuminating - when tractability assumptions accidentally exclude the core phenomenon being modeled, it crosses into cheating. 

  The unresolved epidemic modeling case is timely. Despite homogeneous-mixing being "false in every particular," its policy utility suggests legitimacy. This hints that purpose matters more than literal accuracy. Their confessed asymmetry between biology and economics feels psychologically honest - I suspect it stems from biology's stronger track record of predictive success with "as-if" models.

  For the Coase theorem, zero transaction costs seems legitimate as a limiting case - much like infinite populations in genetics. But for climate models, rational expectations might be cheating given the unprecedented nature of climate change. The key distinction appears to be whether the assumption preserves the model's explanatory core while simplifying periphery.

  Ultimately, their intuition maps well to a "purpose-relative robustness" framework. The asymmetry isn't mere prejudice - economics faces greater challenges in verifying its "as-if" claims due to weaker predictive validation. Perhaps advising them to refine their principle around "explanatory targets" rather than blanket predictions would resolve most cases.
answer: |-
  Your quest for a principled distinction between legitimate idealization and intellectual cheating is profound. Your cases reveal a pattern that *can* be unified, but your tentative principle needs refinement to accommodate your verdicts. Below, I repair your principle, apply it to your cases (including unresolved ones), and address the biology-economics asymmetry.

  ### The Repaired Principle: Purpose-Relative Robustness
  An unrealistic assumption is **legitimate** if and only if:  
  **The assumption preserves the model’s explanatory target for its intended purpose, even when violated, such that substituting realism would not qualitatively alter the model’s core insights or utility for that purpose.**  

  Conversely, **intellectual cheating** occurs when:  
  **The assumption directly negates, obscures, or trivializes the very phenomenon the model exists to explain or predict, rendering the model unfit for its purpose.**

  This framework prioritizes *why* the model exists and *what* it aims to explain, rather than demanding quantitative robustness.

  ---

  ### Applying the Principle to Your Cases
  1. **Ideal Gas (noninteracting particles)**  
     - **Legitimate:** The target is macroscopic behavior (PV=nRT). Substituting intermolecular forces changes predictions near condensation, but the *core insights* (e.g., pressure-temperature relationships) hold robustly where intended.  
     - **Principle Fit:** Quantitative failure at condensation doesn’t undermine the purpose (explaining ideal-gas laws).

  2. **Infinite Populations in Genetics**  
     - **Legitimate:** The target is allele frequency dynamics under selection. Finite models converge to infinite ones for large N, preserving core insights (e.g., Hardy-Weinberg equilibrium).  
     - **Principle Fit:** Drift matters for small populations, but the model’s purpose (modeling selection) isn’t invalidated.

  3. **Friedman’s Billiard Player & Leaves ("as-if" optimization)**  
     - **Legitimate:** The target is aggregate behavior (shots made, leaf positions), not cognitive processes. Realistic substitutions (e.g., heuristics) may predict errors, but the *outcome pattern* converges to the optimum. Core insight: selection pressures drive apparent optimization.  
     - **Principle Fit:** Realism changes details but not the explanatory target (outcome efficiency).

  4. **Calvo Pricing (sticky prices)**  
     - **Legitimate:** The target is inflation inertia, not microfoundations. Realistic price-adjustment mechanics would be intractable but *wouldn’t qualitatively change* core insights (e.g., monetary policy lags).  
     - **Principle Fit:** Falsity is tolerated because the purpose (modeling macro inertia) is preserved.

  5. **Mortgage-Security Models (ignoring nationwide price drops)**  
     - **Intellectual Cheating:** The target was pricing systemic risk. Assuming away nationwide collapses *directly negated the explanandum* (correlated defaults).  
     - **Principle Fit:** Substituting realism (correlated risks) would radically alter predictions, and the assumption destroyed the model’s purpose.

  6. **Bank Runs (common knowledge of solvency)**  
     - **Intellectual Cheating:** The target is panic dynamics. Assuming rational expectations *erases the panic mechanism itself* (coordination failure under uncertainty).  
     - **Principle Fit:** Realism (asymmetric information) is essential to the explanandum.

  7. **Epidemic Models (homogeneous mixing, 2020)**  
     - **Legitimate:** The target was aggregate infection trajectories to guide lockdowns/vaccine rollout. Structured contacts matter for fine-grained predictions (e.g., superspreading), but the *qualitative insights* (e.g., R0 thresholds, herd immunity) were preserved for policy timing.  
     - **Principle Fit:** Substituting network structures would change details but not the core purpose (projecting caseload curves). Utility for urgent policy outweighed granular falsity.

  ---

  ### Resolving Your Unclassified Cases
  1. **Coase Theorem (zero transaction costs)**  
     - **Legitimate Idealization.**  
       - *Target:* Demonstrating that efficient outcomes *can* emerge via bargaining if property rights are clear.  
       - *Purpose:* Illustrate the role of institutions, not predict real negotiations.  
       - *Principle Application:* Realism (transaction costs) changes outcomes, but the core insight—institutional design enables efficiency—remains intact. The assumption acts as a "stress test" for institutional economics.

  2. **Rational Expectations in Climate IAMs**  
     - **Intellectual Cheating.**  
       - *Target:* Pricing long-run climate damage under deep uncertainty.  
       - *Purpose:* Inform mitigation investments by forecasting economic impacts.  
       - *Principle Application:* Rational expectations assume perfect foresight of climate tipping points, technological shifts, and policy—an impossibility over centuries. Substituting realistic bounded rationality (e.g., adaptive learning) would *qualitatively alter* damage estimates (e.g., fat-tailed risks). The assumption trivializes the core challenge: pricing unknowable systemic risks.

  ---

  ### Addressing the Biology-Economics Asymmetry
  Your distrust of economics' "as-if" profit maximization (vs. acceptance in biology) **is principled**, not mere prejudice. The difference lies in **empirical accountability and selection mechanisms**:  

  - **Biology:** "As-if" optimization (e.g., leaves maximizing sunlight) is legitimized by **evolutionary selection**. Organisms failing to approximate optima die. Predictive success (e.g., optimal foraging theory) is empirically validated.  
  - **Economics:** Firms lack comparable selection pressure. Many survive without profit maximization (e.g., via inertia, regulation, or innovation). Crucially, economics struggles to empirically verify "as-if" claims:  
    - *Earned Idealizations:* Biology’s models generate testable predictions (e.g., phylogenetic constraints). Economics’ profit maximization often relies on untestable auxiliary assumptions.  
    - **Conclusion:** Your asymmetry is defensible. Biology’s idealizations are grounded in a tractable theory of selection; economics’ often assume away the very market failures (e.g., agency problems) its models should explain.  

  ---

  ### Final Principle Summary
  **A model’s unrealistic assumption is legitimate iff:**  
  It simplifies without undermining the model’s *explanatory target for its intended purpose*. Substituting realism may alter peripheral predictions but must preserve the core insight or utility.  

  **Intellectual cheating occurs iff:**  
  The assumption masks the phenomenon under study or makes the model useless for its purpose.  

  **This principle:**  
  - Validates your verdicts (including epidemic models).  
  - Condemns mortgage models and climate IAMs.  
  - Justifies your biology-economics asymmetry.  
  - Provides clear criteria for new cases.  

  The unifying thread is **purpose-relative robustness**, not predictive invariance. Science idealizes to illuminate; it cheats when it obscures.
