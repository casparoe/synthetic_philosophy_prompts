prompt: |-
  Hey, I want you to take on the role of an expert on ethics under moral uncertainty and decision theory, and help me do some reflective equilibrium on a topic I've been going back and forth on for literally years. Longtime LessWrong/EA forum reader here. Please think carefully and actually brainstorm a bit before committing to an answer -- don't just hand me the first principle that fits three of my cases.

  Background so we're on the same page: the scale argument for insects says there are something like 10^18+ insects alive at any moment, so even if you assign each one a tiny probability of sentience (or a tiny degree of it), the expected moral stakes of insect-affecting actions swamp basically everything else, including all the vertebrate welfare stuff I care about. I find this persuasive in the abstract and completely unable to act on it, so like I did with a bunch of other questions, I went by gut on a pile of cases to see what principle falls out. Here are my verdicts, in no particular order:

  - Swatting a mosquito that's biting me: totally fine, I don't even register it as a decision.
  - Eating honey: fine. I know bees get squashed in ordinary beekeeping and it doesn't move me at all.
  - Poisoning the ant colony that keeps getting into the cat food: fine, though I feel mildly bad about it.
  - My neighbor torching a wasp nest full of larvae: somehow not fine?? I'd judge them a little, and I can't articulate why this feels different from the ant poison, which kills larvae too.
  - Boiling a lobster alive for dinner: not fine, I stopped years ago. But crickets roasted en masse as reptile feed: fine, even though I'd guess crickets are about as likely to be sentient as lobsters and there are vastly more of them.
  - Driving on the highway knowing my windshield will splatter a bunch of bugs over a long trip: fine, and I wouldn't take a slower route to reduce it.
  - A gene drive that wipes out malaria mosquito species, saving hundreds of thousands of human lives a year: clearly good.
  - Someone proposing a gene drive to painlessly eliminate all insects everywhere, on the theory that wild insect lives are net-negative: monstrous, obviously, even granting the premise.
  - $10 to a chicken welfare charity vs $10 to insect welfare research/interventions: chicken, no contest, even though the expected-value math with 10^18 insects says I'm off by orders of magnitude.

  So: is there a principle that captures most of this, or am I just hopelessly vertebrate-biased? Some hypotheses I want you to test rather than accept: (a) something like "harm you watch happen counts for more than diffuse statistical harm," (b) my probability estimates are doing secret work -- maybe I'm implicitly saying lobster sentience is 0.9 and cricket sentience is 0.01, and the pattern is just honest Bayesianism about qualia rather than a bias, (c) it's all disgust and proximity dressed up as ethics. Spell out one or two candidate principles precisely, say which verdict motivates which clause, tell me what each principle predicts on cases I haven't listed (I'd genuinely like your read on: a backyard bug zapper, a movie production releasing ten thousand locusts for one shot, farmed black soldier fly larvae as animal feed, and whether I should feel bad walking on grass), and be blunt about which of my verdicts has to go if you can't save them all. If you think the verdicts should mostly be overturned rather than systematized, fine, but then explain why the sheer number should or shouldn't override them, because right now the 10^18 figure and my gut are in a staring contest and I don't know which one blinks.
