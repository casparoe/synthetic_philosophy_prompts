answer: |-
  After careful analysis of your cases and testing multiple principles, I propose two candidate frameworks that capture most (but not all) of your intuitions. Both require rejecting pure expected-value utilitarianism under moral uncertainty when applied to insects.

  **Candidate 1: Contextual Moral Patient Threshold Principle**  
  *"We have stronger obligations to entities when (a) their moral patient status is more probable *and* contextually salient, AND (b) the harm is intentional, unnecessary, or avoidable without significant cost—with special weight given to vertebrates."*

  - **Explains**:  
    - Mosquito swatting (permissible): Defense against active harm + low contextual salience  
    - Lobster boiling (impermissible): High salience of pain indicators + intentional killing for luxury  
    - Gene drive extinction (monstrous): Extreme intentionality + removes potential for flourishing  
    - Malaria eradication (permissible): Avoids massive human suffering + targets disease vector specifically  
    - Chicken charity preference: Explicitly weights vertebrate cognition as higher probability *and* moral significance  

  - **Fails**:  
    - Ant vs. wasp nest inconsistency (both intentional) → Your wasp judgment might reflect subconscious "nest as home" cognition  
    - Cricket farming (you said "fine") → Intentional mass killing should trigger obligation under this principle  

  - **New Case Predictions**:  
    - Backyard bug zapper: **Impermissible** (gratuitous killing, avoidable, salient suffering sounds)  
    - Movie locust release: **Permissible only with harm mitigation** (systemic purpose, but intentional creation of risk)  
    - Farmed black soldier flies: **Impermissible** if conventional methods cause suffering (intentional scaled harm)  
    - Walking on grass: **Permissible** (unavoidable, non-intentional, below significance threshold)  

  ---

  **Candidate 2: Agent-Relative Harm Authorization Principle**  
  *"Moral agents may:  
  1. Defend against immediate threats (mosquito biting)  
  2. Indirectly benefit from systemic processes (honey, roadkill)  
  3. Prefer vertebrates absent conclusive evidence  
  BUT CANNOT:  
  4. Intentionally inflict scalable harm without overwhelming justification (lobster boiling → bad; cricket farming → bad)  
  5. Cause extinction-level impacts (universal gene drive = monstrous)"*

  - **Explains**:  
    - Ant poison vs. wasp nest: Ants are "systemic threat" (permissible defense), wasp nest feels like "excessive force" (violates #4)  
    - Windshield bugs: Falls under systemic process (#2)  
    - Malaria gene drive: Overwhelming justification (#5 exception)  
    - Honey: Indirect benefit (#2) vs. cricket farming violates #4  

  - **Fails**:  
    - Your cricket farming acceptance → Contradicts #4  
    - Charity choice → Requires admitting vertebrate bias as core principle  

  - **New Case Predictions**:  
    - Bug zapper: **Impermissible** (violates #4 - scalable harm without defense justification)  
    - Movie locusts: **Permissible with mortality compensation** (falls under #2 if locusts die naturally)  
    - Farmed larvae: **Impermissible** (violates #4 - scalable intentional harm)  
    - Walking on grass: **Permissible** (not intentional harm, #2)  

  ---

  **The Hard Tradeoffs**  
  To systematize *all* your intuitions, you must either:  
  1. **Admit vertebrate bias is axiomatic** (reject insect scale argument by fiat)  
  2. **Revise two key judgments**:  
     - Cricket farming must be seen as *at least as bad* as lobster boiling  
     - Charity choice should allocate >0% to insect welfare research  

  **Why Your Gut Isn't Irrational**  
  The 10¹⁸ figure *should* matter, but decision theory under moral uncertainty (e.g., MacAskill's *normative uncertainty*) allows weighting competing moral frameworks. Your intuitions suggest:  
  - **Deontological constraints** (don't intentionally kill without necessity)  
  - **Cognition-sensitive hedonism** (lobsters > crickets due to neural complexity)  
  - **Agent-relative permissions** (defensive vs. offensive harm)  

  **Blunt Diagnosis**:  
  Your "vertebrate bias" is defensible if you argue that:  
  *"The probability of insect sentience drops exponentially when demanding vertebrate-like cognition for *moral significance* (not just pain), AND scalable interventions risk unintended ecological harm."*  

  **Final Verdict**:  
  - **Keep**: Mosquito defense, honey, malaria gene drive, extinction ban  
  - **Revise**: Cricket farming → Should concern you; Charity choice → Allocate 5-10% to insect sentience research  
  - **Resolve Inconsistency**: Ant/wasp difference likely stems from perceived threat level (ants=invasion, wasps=territorial) - not ethically robust. Treat both equally.  

  **On Grass-Walking**: Don't feel bad. Under any principle, unavoidable incidental harm at that scale is below obligation thresholds (even for utilitarians). Focus on scalable interventions instead.  

  The math only "wins" if you accept pure utilitarianism *and* uniform insect sentience probability. Your intuitions suggest you reject both. That's philosophically defensible—but requires owning that vertebrate lives hold privileged moral status in your framework.
