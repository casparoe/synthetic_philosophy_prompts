  - The conditional probability of NE given the eastern half (i.e., given NE or SE) is 3/4. That is:
    \[
    \frac{q_{NE}}{q_{NE} + q_{SE}} = \frac{3}{4}
    \]
    which implies:
    \[
    4 q_{NE} = 3 (q_{NE} + q_{SE}) \quad \Rightarrow \quad q_{NE} = 3 q_{SE}
    \]

