  - **A grade (27–30 points):**  
    - Correct, detailed explanations in (a) and (b).  
    - In (c), clearly articulates intuition, notes posterior violates it, and proves partition invariance.  
    - In (d), discusses both minimum entropy and alternatives, and argues non-uniqueness convincingly.  
    - Numerical results in (b) accurate.  

  - **B grade (22–26 points):**  
    - Correct (a) and (b), with minor errors in (b) numerics.  
    - In (c), articulates intuition and notes violation but does not address partition invariance or does so weakly.  
