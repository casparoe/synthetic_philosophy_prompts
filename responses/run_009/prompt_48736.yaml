  - **C grade (17–21 points):**  
    - Partially correct (a) and (b), with errors in setup or derivation.  
    - In (c), intuition stated but assessment missing/incorrect; no partition discussion.  
    - In (d), limited argument; may claim uniqueness without justification.  

  - **D/E grade (≤16 points):**  
    - Major errors in (a) or (b).  
    - Incomplete/missing responses in (c) or (d).  

  **Key separator:** The B student typically executes (b) correctly but overlooks partition invariance in (c) and provides a weak/non-existent argument for non-uniqueness in (d). The A student addresses all nuances, especially partition invariance in (c) and the debate in (d).  

