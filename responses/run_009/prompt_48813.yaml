answer: |-
  Here is a prioritised research agenda for your fellowship programme, justified by interdependency, philosophical tractability, neglect, downstream impact, and practical relevance. I’ve revised your six questions into a tighter framework, deprioritising two and elevating one new angle.

  ### **Ranked Research Priorities**
  1.  **The Relational-Metric Nexus: Does relational equality *require* a metric?**  
      **Why #1:**  
      - **Foundational:** If relational equality (RE) obviates the metric question, all other priorities become secondary. If RE *needs* a metric, it reshapes every subsequent debate (especially capabilities/resources).  
      - **Tractability:** Purely conceptual work on social ontology, non-material domination, and the "stuff" of relational standing. Philosophers excel here.  
      - **Neglect:** RE critiques are influential but rarely engage deeply with *how* to measure relational goods (e.g., non-humiliation, deliberative voice).  
      - **Downstream Impact:** Resolving this unlocks coherence for priorities #2 and #5. A "relational metric" could redefine policy design (e.g., disability rights as recognition, not redistribution).  
      - **Plausible Answer:** RE likely needs a *hybrid* metric (capabilities + procedural resources) to avoid vacuity. Example: Equal standing requires *both* health access (capability) and anti-discrimination protections (relational structure).

  2.  **Capability Measurement & Indeterminacy: Operationalisation or virtue?**  
      **Why #2:**  
      - **Bottleneck:** Capabilities dominate policy discourse (e.g., UN SDGs) but remain theoretically unstable. If they collapse into resources/welfare, the approach loses distinctiveness.  
      - **Tractability:** Conceptual work on comparability, indexing, and "core capabilities" – philosophers can define thresholds economists can’t.  
      - **Neglect:** Most literature either celebrates pluralism or handwaves measurement. Few tackle *which* indeterminacies are fatal vs. productive.  
      - **Downstream Impact:** A rigorous framework would empower statisticians (e.g., designing surveys for "agency freedom") and force resource/welfare theorists to respond.  
      - **Plausible Answer:** Capabilities need "contextually salient bundles" (e.g., health+education in low-income settings) with local deliberation *constrained* by universal minima. Indeterminacy is manageable, not virtuous.

  3.  **Money-Metric Critique: Is welfarism inevitable in resource pricing?**  
      **Why #3:**  
      - **Interdependency:** Directly tests resource egalitarianism’s coherence. If pricing smuggles in welfare, capabilities/RE gain ground; if not, resources are more defensible.  
      - **Tractability:** Philosophers can dissect economists' assumptions (e.g., revealed preference, commensurability) without doing econometrics.  
      - **Neglect:** Resource theorists (e.g., Dworkin) dismiss this too quickly. Welfare economists ignore normative implications.  
      - **Downstream Impact:** Clarifies whether "objective" resource metrics exist – crucial for policy (e.g., calculating cash transfers vs. in-kind benefits).  
      - **Plausible Answer:** Resource metrics *can* avoid welfarism by pricing based on *opportunity sets* (not utility) but require robust theories of non-market goods (e.g., care work).

  4.  **Population-Metric Entanglement (Trustee’s Question)**  
      **Why #4:**  
      - **Emerging Urgency:** Climate migration, AI disruption, and falling birth rates make population ethics unavoidable.  
      - **Tractability:** Philosophers lead on population ethics; linking it to *what* we equalise (e.g., capabilities per capita vs. total) is novel.  
      - **Neglect:** Almost no work connects Sen to Parfit. Does equalising capabilities require limiting population? Or prioritising future generations?  
      - **Downstream Impact:** Informs long-term policy (pension systems, ecological footprints). A weak answer risks irrelevance.  
      - **Plausible Answer:** Capability thresholds may imply *sufficientarian* population ethics (e.g., no one below threshold X), rejecting strict equality.

  5.  **Non-Ideal Convergence: Do rival metrics collapse in practice?**  
      **Why #5 (Lower Priority):**  
      - **Test Case for Theory:** Important but derivative – the answer depends on priorities #1–3.  
      - **Tractability:** Requires case studies (e.g., disability policy), but philosophers risk duplicating applied policy work.  
      - **Value:** If metrics diverge in practice (e.g., universal basic income vs. capability grants), it refocuses debate. If they converge, it simplifies policy.  
      - **Place in Agenda:** Best tackled *after* core theories are refined. Fellows could collaborate with policy scholars late-cycle.

  ### **Deliberately Deprioritised**
  - **Luck Egalitarianism Quarrels (Question #4):**  
    **Why:** Baroque disputes (e.g., "brute luck vs. option luck") now yield diminishing returns. The core insight – neutralizing unchosen disadvantage – is absorbed into capabilities/resources. New work often rehearses old objections (adaptive preferences) without advancing policy. **Exception:** If linked to #1 (e.g., is "luck" a relational concern?), it regains relevance. Otherwise, retire it.

  - **Relational Critique as Obsolete (Implied in #1):**  
    **Why:** The claim that RE ends the metric debate is overplayed. Anderson/Scheffler target *distributive fetishism*, not metrics per se. Funding work assuming obsolescence wastes resources.

  ### **What Could Change the Ranking**
  - **↑ Priority #4 (Population-Metric)** if: Longtermism gains traction in policy circles (e.g., EU AI regulations) or new inequality data reveals demographic crises (e.g., youth unemployment in ageing societies).  
  - **↑ Priority #2 (Capability Measurement)** if: Major institutions (World Bank, OECD) overhaul welfare metrics – creating demand for philosophical foundations.  
  - **↓ Priority #3 (Money-Metric)** if: Economists develop non-welfarist pricing tools (e.g., "basic goods" indices) that satisfy philosophers.  
  - **New Priority:** **Digital Equality Metrics** – If AI governance explodes as a policy issue, philosophers must define equal standing in algorithmic societies (e.g., data rights as capability).

  ### **Funding Rationale Summary**
  This agenda targets **foundational leverage points**:
  1.  **#1 and #2** address existential threats to the field (obsolescence claims, operational incoherence).  
  2.  **#3 and #4** tackle under-scrutinised assumptions with high policy stakes (resource pricing, future generations).  
  3.  **#5** offers concrete validation but depends on prior work.  

  It **deprioritises exhausted debates** (luck egalitarianism) and balances **pure theory** (#1, #3) with **theory-to-policy bridges** (#2, #4). Each priority is tractable for philosophers but invites downstream collaboration. If relational equality needs a metric (#1), capabilities are operationalised (#2), and resources avoid welfarism (#3), the "equality of what?" debate emerges *renewed* – ready for policy translation in 3–5 years.  

  **Trade-off:** Prioritising conceptual groundwork (#1–#4) over immediate policy (#5) risks short-term irrelevance but prevents theoretical dead ends. This aligns with your remit: fund the architecture, not the wallpaper.
