prompt: |-
  I keep running into the same move in arguments about whether AI systems deserve moral consideration, and I want to know if it has a name. Someone says a language model might be having something like experiences, and the reply is always a mechanism: it's just matrix multiplications, it's just trained to predict the next token, there's no little person inside looking at the outputs. And the weird part is that the mechanistic description gets treated as if it settles the moral question by itself -- as if once you can say what the system is "really" doing, down at the level where it's all arithmetic, nothing morally interesting could be happening there. But nobody accepts this in the other direction for brains (the brain is just ion channels flipping, therefore no moral status), so it can't literally be the mechanism-level description doing the work. Is there an established concept for this move, where explaining how something works gets treated as explaining away what it is? A second, related thing I've noticed: even people who accept that computations can matter morally can't agree on which ones do -- like whether the same weights running in full precision vs heavily quantized, or on a GPU vs some brain-inspired chip, should count differently even when the outward behavior is identical. Does that boundary-drawing problem have its own name or literaure? For each of these: tell me the nearest established concepts, how exactly they differ from what I've described, and if nothing fits, coin a term with a definition that carves off the edges. Answer in exactly five numbered points, each a sentence or two, no intro or conclusion.
reasoning: |-
  Hmm, the user is describing a recurring argument pattern in AI ethics debates. They've noticed two distinct but related phenomena: 

  First is the tendency to dismiss moral consideration for AI by reducing it to mechanistic descriptions ("just matrix multiplications"), even though we wouldn't accept such reductionism for biological brains. This feels like a rhetorical sleight-of-hand where explanation gets conflated with explanation-away.

  Second is the boundary problem where people can't agree which computational implementations matter morally - like whether quantization or hardware differences change moral status when outputs are identical. This seems related to philosophical questions about substrate dependence.

  For the first issue, "reductionist fallacy" comes close but isn't quite precise. The existing "mere machine" rhetoric is descriptive but not conceptual. I should coin "explanatory reduction" to capture this specific move where mechanistic explanation is improperly used to deny emergent properties.

  For the second problem, "substrate independence" debates are relevant but don't fully cover the moral aspect. The "hard problem of consciousness" is adjacent but too narrow. "Implementation variance dilemma" could work as a new term focusing on how moral evaluations change across physically different but functionally identical systems.

  The user seems philosophically sophisticated - they're spotting subtle argumentative asymmetries. Their frustration suggests they've encountered this repeatedly in debates. By naming these patterns, they're likely seeking better tools to counter these arguments or clarify discussions.

  I'll structure the response in exactly five numbered points as requested: first two for the reduction issue, next two for the boundary problem, and a final point connecting them. Each will compare existing concepts before offering new terms where needed, keeping definitions tight to avoid overgeneralization.
answer: |-
  1.  The move treating mechanistic explanation as settling moral status is closest to **reductive physicalism** or the **"nothing but" fallacy** (e.g., "it's *nothing but* matrix multiplications"), differing in that these are broad ontological positions, while your described move is a specific rhetorical tactic misapplying reductionism to dismiss emergent properties like experience.
  2.  A more precise term for this argumentative tactic is **explanatory reduction fallacy**: the error of believing that providing a lower-level mechanistic explanation (e.g., neural activity, matrix math) automatically explains away or negates the reality and potential moral significance of higher-level phenomena (e.g., pain, subjective experience).
  3.  For the boundary problem regarding which computational implementations matter morally, the nearest established concept is the debate over **substrate independence** (whether the physical implementation matters for cognitive properties) applied to ethics, but it lacks a specific name for the *moral* boundary issue when functional outputs are identical across implementations.
  4.  This specific dilemma of assigning moral status based on computational substrate despite identical function is akin to a **moral version of the "hard problem of consciousness"** (focused on why/how experience arises from physical processes), but differs as it centers on the criteria for moral patiency rather than the explanatory gap itself.
  5.  This second problem can be termed the **implementation variance dilemma**: the difficulty in determining whether, and why, morally relevant properties (like experience) depend on the specific physical or low-level computational implementation of an algorithm when the high-level input-output behavior remains constant (e.g., full precision vs. quantized weights, GPU vs. neuromorphic hardware).
