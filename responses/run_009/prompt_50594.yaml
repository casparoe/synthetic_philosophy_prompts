prompt: |-
  I'm a science-and-ideas correspondent at a national daily, and I also sit on our standards committee, which rules on corrections and sets editorial policy for the newsroom. Last month our health desk ran a front-page feature crediting a hospital network's new sepsis protocol with a dramatic improvement: network-wide mortality fell from 12.0 percent to 8.0 percent after the protocol was introduced. This week a biostatistician wrote in to point out what the underlying figures show. The network consists of two hospitals. Before the protocol, the large tertiary hospital treated 600 sepsis patients with 15.0 percent mortality, and the small community hospital treated 200 patients with 3.0 percent mortality; together, 800 patients and 12.0 percent. After the protocol — which also changed triage so that far more patients were routed to the community hospital — the tertiary hospital treated 400 patients at 16.0 percent mortality and the community hospital 800 patients at 4.0 percent; together, 1,200 patients and 8.0 percent. So within each hospital, mortality rose slightly, and the celebrated aggregate improvement is an artifact of case mix. Our health editor's defense is that the network-wide rate is the number that matters to readers deciding where care is delivered, and that any disaggregation can be sliced to tell an opposing story; several colleagues retort that the hospital-level numbers are the real ones and we printed an effect that reversed on inspection. The committee meets Tuesday and must decide two things: what, if anything, we print as a correction, and whether to adopt a standing rule for when an aggregate claim requires a check for reversal across relevant subgroups before publication. Draft the decision memo. It should give a concrete recommendation on both questions — with criteria a reporter without statistical training can actually apply on deadline — and it should engage seriously with the strongest argument for standing by the aggregate figure, including the worry that demanding stratification for every aggregate statistic invites both paralysis and cherry-picking of whichever subgroup framing flatters a preferred conclusion.
reasoning: |-
  Okay, this is a fascinating case study in statistical literacy and journalistic ethics. The user is a science correspondent doubling as a standards committee member, which means they need to navigate both technical nuance and practical newsroom realities. 

  Hmm, the core issue is Simpson's Paradox - where aggregate data shows one trend but subgroups reveal the opposite. The biostatistician caught what the health desk missed: mortality rates increased in both hospitals individually despite the network-wide drop. That's textbook reversal. 

  The health editor's defense has some merit - readers do care about system-level outcomes. But this feels like a cop-out. If the protocol actively shifted patients to lower-mortality facilities (while worsening outcomes at both), that's crucial context. Calling the aggregate "the real number" is like saying a restaurant's average meal rating matters more than knowing both their steak and fish got worse but they served more fish.

  For the memo... Need to balance three things: corrective action (must run a prominent correction), policy change (require subgroup checks), and philosophical rebuttal (address the paralysis/cherry-picking concern). The "reporter-friendly criteria" bit is key - can't expect journalists to be statisticians, but they must spot red flags.

  Ah, the cherry-picking worry is valid but solvable. The rule should target "logical subgroups" not all possible splits. Like here: hospitals were obvious units. No need to slice by patient shoe size. And "reversal" is rare - most aggregates hold up. This won't paralyze the newsroom. 

  Biggest challenge: phrasing the correction without sounding like the paper was incompetent. Should emphasize the new information angle - "upon further review" rather than "we screwed up." The policy justification needs to show this protects readers from being misled about healthcare choices. 

  ...Wait, the committee meets Tuesday. Better draft something actionable.
answer: |-
  ## MEMORANDUM  
  **To:** Editorial Standards Committee  
  **From:** [Your Name], Science & Ideas Correspondent & Committee Member  
  **Date:** [Date prior to Tuesday meeting]  
  **Subject:** Decision Recommendation: Sepsis Protocol Correction & Aggregate Data Policy  

  ---

  ### I. EXECUTIVE SUMMARY  
  The sepsis protocol article presented a network-wide mortality decrease (12% → 8%) as evidence of success. Subsequent analysis reveals this aggregate improvement was driven *entirely* by shifting patients to the lower-mortality hospital, while mortality *increased* at both hospitals individually. This is a textbook case of **Simpson’s Paradox**, where aggregated data reverses direction when stratified by a key subgroup (here, hospital site).  

  We recommend:  
  1. **Print a Correction:** Clarify the nature of the mortality change and its drivers.  
  2. **Adopt a New Policy:** Require reporters to check for reversal effects in logical subgroups *before* publishing aggregate claims about causal impacts.  
  3. **Define Practical Criteria:** Use a simple "Reversal Risk Checklist" for reporters under deadline.  

  ---

  ### II. RECOMMENDATION 1: CORRECTION  
  **Proposed Wording:**  
  > "Correction: Our September [Date] article, 'Hospital Network Cuts Sepsis Deaths with New Protocol,' reported a network-wide decline in sepsis mortality following a new protocol. While the network’s *aggregate* mortality rate fell from 12.0% to 8.0%, newly provided data shows mortality rates *increased* at both individual hospitals after the protocol’s implementation. The aggregate improvement resulted primarily from a significant shift in patient volume to the hospital with historically lower mortality rates, a change also part of the protocol. We regret not providing this fuller context initially. Readers should note that outcomes within each facility worsened slightly."  

  **Rationale:**  
  - **Accuracy:** The original framing implied the protocol *caused* improved clinical outcomes. The data shows it caused a shift in *where* care was delivered, while outcomes at both sites deteriorated.  
  - **Transparency:** Readers (especially patients choosing care) *do* care about facility-level outcomes. A system-wide rate masking opposing trends at sites is misleading without context.  
  - **Trust:** Ignoring the biostatistician’s valid critique damages credibility. Acknowledging the nuance strengthens science reporting.  

  ---

  ### III. RECOMMENDATION 2: STANDING POLICY ON AGGREGATE CLAIMS  
  **Policy:**  
  > **"Reversal Risk Assessment for Causal Claims:** Before publishing claims that an intervention caused a change in an aggregated outcome (e.g., overall mortality, average test scores, system-wide sales), reporters *must* check whether the trend reverses direction when data is stratified by logical, pre-defined subgroups relevant to the story (e.g., hospitals, demographic groups, product lines). If reversal is found, the aggregate claim cannot be presented as the primary evidence of causal effect without explicit caveats explaining the subgroup dynamics."  

  **Practical Criteria for Reporters (The Reversal Risk Checklist):**  
  Ask these questions *when reporting on aggregate changes linked to an intervention/policy*:  
  1. **Subgroup Relevance:** Are there obvious, meaningful subgroups (e.g., specific locations, key demographics, product types) whose individual results readers would expect to see? *(If YES, proceed to #2)*  
  2. **Data Availability:** Is subgroup data readily obtainable? *(If YES, obtain it)*.  
  3. **Trend Check:** Does the *direction* of change (increase/decrease) for the aggregate outcome match the direction of change for *all major subgroups*?  
     *   **Match?** Proceed (but still consider context).  
     *   **Mismatch?** (i.e., aggregate improves but key subgroups worsen, or vice versa) → **STOP.** You likely have Simpson's Paradox. The aggregate trend *cannot* be presented as the primary evidence of the intervention's effect without explaining the reversal and subgroup shifts. Consult an editor/statistician.  

  **Examples of Triggers:**  
  - "New policy X reduced city-wide crime rate." → *Check major precincts/demographics.*  
  - "Curriculum Y boosted district-wide test scores." → *Check key schools/grade levels/student groups.*  
  - "Strategy Z increased company profits." → *Check major divisions/product lines.*  

  ---

  ### IV. ENGAGING THE STRONGEST COUNTERARGUMENT  
  **The Argument (Health Editor's View):**  
  *"The network-wide rate is what matters to readers choosing care systems. Disaggregation invites cherry-picking and paralysis, letting critics always find a subgroup to undermine any aggregate finding."*  

  **Our Serious Engagement & Rebuttal:**  
  1. **Reader Relevance:** While the *system* outcome matters, readers also deserve to know *how* the result was achieved and whether it reflects genuine improvement or administrative reshuffling. Here, the protocol demonstrably *worsened* outcomes at the point of care while changing triage. This is critical for patients assessing care quality and policymakers evaluating interventions.  
  2. **Cherry-Picking vs. Logical Subgroups:** The policy targets *obvious, relevant subgroups* (like individual hospitals in a network story), not fishing expeditions. Cherry-picking involves searching endless subgroups until one fits a narrative. Our criteria require checking pre-defined, inherently relevant groups readers would expect to see.  
  3. **Paralysis Risk:** The "Reversal Risk Checklist" is targeted and efficient:  
     - It only applies to **causal claims based on aggregate trends.**  
     - It focuses on **major, logical subgroups** (not obscure splits).  
     - The core check (**Trend Direction Match**) is simple and binary.  
     - Reversal is *rare*; this won’t burden most reporting. When it *does* occur (like here), it prevents major errors.  
  4. **Misrepresentation Risk:** Presenting a reversed aggregate as proof of causal success *is itself a form of cherry-picking* – one that ignores contradictory underlying data. Our policy combats this specific, high-impact distortion.  

  **Conclusion on Counterargument:** The desire for simplicity is understandable, but presenting a reversed aggregate as evidence of causal success is fundamentally misleading. This policy ensures aggregate figures are robust enough to support the claims made about them, without demanding impractical levels of stratification.  

  ---

  ### V. CONCLUSION  
  The sepsis story revealed a critical vulnerability in how we handle aggregated data for causal claims. The proposed correction addresses the immediate error with transparency. The standing policy provides reporters with a simple, actionable tool to prevent similar reversals from misleading readers in the future, while carefully balancing the need for clarity, accuracy, and practical workflow. It targets a specific, high-risk scenario without inviting paralysis or spurious disaggregation.  

  **Recommended Vote:**  
  1. **Approve** the correction for immediate publication.  
  2. **Adopt** the "Reversal Risk Assessment for Causal Claims" policy and "Reversal Risk Checklist."  

  ---  
  **Attachments:**  
  - Draft Correction Text  
  - "Reversal Risk Checklist" One-Pager for Newsroom Distribution
