  I recall that infinite ethics is a messy field. The math about conditionally convergent series and order dependence is solid—that's settled. But solutions like the bubble approach are debated. I should explain why the bubble method, while intuitive, might be problematic: it could undervalue long-term impacts and is arbitrary in its boundaries. The board members worried about sinking long-horizon grants have a point here.

  For the recommendation, expected value with a modified discounting function seems better. Hyperbolic discounting, which declines more slowly than exponential, might handle long-term risks without ignoring them. But I must note that choosing a discount function is contested—different scholars back different approaches. The key is to show that this method preserves both near-term and far-future considerations, avoiding the bubble's pitfalls.

  I should also address the strongest counterarguments. For the bubble approach, the big weakness is neglecting potentially massive future impacts. For the modified expected value, it's the lingering arbitrariness in choosing discount rates. Being transparent here builds trust.

  Structuring the memo: start with the problem, explain settled vs. contested points, recommend modified expected value with hyperbolic discounting, and outline implementation steps. Keep the tone casual but precise, using analogies like "putting your thumb on the scale" for discounting. Highlight that this isn't perfect but is the most robust middle ground.

  Finally, ensure the memo doesn't overclaim consensus where there isn't any. Flag areas of debate clearly, especially around discount function choices. This honesty will help the board understand the reasoning without false certainty.
answer: |-
  **MEMORANDUM**  
  **TO:** Grantmaking Board Members  
  **FROM:** [Your Name], Board Member  
  **DATE:** November 1, 2023  
  **SUBJECT:** Decision Rule for Grant Allocation in Light of Infinite Ethics Concerns  

  Hey team,  

  Let’s cut to the chase: our advisor’s paper on infinite universes and value aggregation is legitimately unsettling, but **it shouldn’t sink our long-horizon grants—and we shouldn’t adopt his “bubble rule” either.** Instead, we should **modify our expected value (EV) framework to handle long-term impacts more rigorously**, using a *hyperbolic discounting function* for catastrophic risk mitigation. I’ll walk through why, tackle the math head-on, and flag where things get hairy.  

  ### The Advisor’s Core Argument (and Where He’s Undeniably Right)  
  Our decision theorist freaked us out with two rock-solid points:  
  1. **If the universe/future is infinite, naive EV sums break.**  
     ✅ **Settled consensus:** Summing "value per dollar" over infinite domains *can* lead to divergent series or conditional convergence. Conditionally convergent series (e.g., 1 - 1/2 + 1/3 - 1/4 + ...) can be rearranged to sum to *any real number*, or even diverge. If our grant impacts have both positive/negative tails stretching to infinity (e.g., preventing extinction vs. funding mosquito nets), EV comparisons *could* be arbitrarily rearranged. This isn’t noise—it’s a fundamental breakdown.  
  2. **“Off the books” bubbles fix the math but create bigger problems.**  
     His “finite bubble” (e.g., 500 years/100 light-years) *does* resolve the infinity issue. But it also treats impacts beyond the bubble as *literally irrelevant*. That’s where we hit trouble.  

  ### Why the Bubble Rule Is a Bad Fit for Us  
  Half the board worries this sinks long-horizon grants. They’re right to panic—but not because the math is wrong. The bubble’s *practical implications* are the issue:  
  - **Arbitrary boundaries = moral blind spots.** Why 500 years, not 501? If a grant reduces x-risk by 0.001% in year 501, the bubble rule says that’s worth *nothing*. But preventing human extinction in year 501 saves ∞ lives. Ignoring this feels like burying our heads in the sand.  
  - **Undermines our mandate.** Our fund exists *because* we care about future beings. The bubble rule contradicts that.  
  - **Strongest point for bubble advocates:** It dodges impossible math and forces focus on tractable, near-term wins. If we’re truly paralyzed by infinity, this is a clean escape hatch. But it’s overkill.  

  ### Why “Just Keep EV” Is Also Risky  
  The other half thinks this is academic navel-gazing. They’re half-right—but the divergence problem isn’t hypothetical. If we rank:  
  - **Grant A:** 90% chance of +10 utils now, 10% chance of -1000 utils in 10,000 years  
  - **Grant B:** 100% chance of +9 utils now  
  ...naive EV could rank B > A via rearrangement shenanigans, even though A avoids catastrophe. That’s not acceptable.  

  ---

  ### The Recommendation: Modified Expected Value + Hyperbolic Discounting  
  **Adopt a discounting framework that smoothly weights near-term impacts more heavily but avoids hard cutoffs.** Specifically:  
  1. **Calculate EV per dollar as usual** for direct-impact grants (malaria nets, vitamins, etc.).  
  2. **For long-horizon grants (x-risk, etc.), apply a hyperbolic discount function:**  
     `Discount(t) = 1 / (1 + k*t)`  
     Where `t` = years in the future, and `k` is a small constant (e.g., k=0.001 to 0.01).  

  #### Why This Works Better  
  - **Engages the infinity problem directly:** Discounting avoids divergent sums by ensuring impacts decay as `t` → ∞. Hyperbolic discounting (unlike exponential) allows heavy weighting of the medium/long-term (e.g., 10k-100k years).  
  - **Preserves far-future relevance:** A 1% reduction in extinction risk in 1M years still gets *some* weight (e.g., discounted by 1/1000 to 1/10,000). It’s not "off the books."  
  - **Pragmatic and defensible:** We already discount future benefits implicitly (e.g., via opportunity cost). This makes it explicit, tunable, and math-consistent.  
  - **Handles the advisor’s worry:** Conditionally convergent series become absolutely convergent after discounting. EV rankings are stable.  

  #### The Strongest Counterargument (Be Honest)  
  **Critique:** *“Choosing ‘k’ is arbitrary! Hyperbolic discounting doesn’t fix the underlying philosophical problem—it’s still ad hoc.”*  
  ✅ **True.** There’s no "consensus" k-value. But:  
  - We can calibrate `k` to reflect our fund’s values (e.g., set `k` so an extinction risk in 10k years is discounted by ≤50%).  
  - **All solutions to infinity are imperfect.** The bubble rule’s boundary is arbitrary too—and more morally jarring. Discounting is the industry standard (e.g., climate economics) for a reason.  

  #### Contested Territory (Flagging Loudly!)  
  - **Is hyperbolic the “right” function?** Consensus: **NO.** Some theorists prefer **exponential discounting** (harsher on long-term) or **time-invariant** methods. Others advocate **person-affecting views** (ignore non-existent beings). This is deep, unsettled philosophy.  
  - **Why not other fixes?** The advisor’s bubble is one alternative. **Dampening functions** (e.g., `1/t^2`) are another—but they’re harder to interpret and can overweight the extreme long-term. Hyperbolic is a pragmatic middle ground.  

  ---

  ### Implementation for This Cycle  
  1. **Adopt hyperbolic discounting for long-horizon grants.** Start with `k=0.001` (1% risk reduction in 10,000 years discounted to ~0.9% today).  
  2. **Run sensitivity analysis:** Test `k=0.0001` (weight far future more) and `k=0.01` (weight it less). See if rankings flip.  
  3. **Keep direct-impact grants undiscounted.** Their benefits are near-term, so discounting adds noise.  
  4. **Pilot on 3-5 long-horizon proposals this cycle.** No full overhaul—just stress-test.  

  ### Bottom Line  
  The advisor’s paper is brilliant and terrifying—but his cure is worse than the disease. The bubble rule sacrifices our duty to the future for mathematical tidiness. Modified EV with hyperbolic discounting confronts the infinity problem without moral bankruptcy. It’s not perfect (no solution is), but it keeps our long-horizon portfolio alive while ensuring our math doesn’t melt down.  

  We can revisit `k` or explore time-invariant methods next cycle. For now: **no bubbles, no paralysis. Discount the far future, but don’t delete it.**  

  Let’s discuss at the December meeting—I’ll bring coffee and a whiteboard.  

  —[Your Name]  

  ---  
  **P.S.** For the truly curious: Key contested papers are Arntzenius (2014) on “bubbles” vs. Beckstead (2013) on discounting. I’ll circulate excerpts.
