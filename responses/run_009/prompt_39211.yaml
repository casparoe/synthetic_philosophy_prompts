  The user also questions if counterfactual history is pointless. Structuralists would argue that without Hitler, another figure might have emerged, but the systemic issues would still lead to authoritarianism. However, the specifics—like the Holocaust's scale—could differ. So counterfactuals aren't useless but need to focus on structural possibilities.

