prompt: |-
  Been reading rationalist blogs since the Overcoming Bias days, and I've been around EA money circles long enough to watch the culture shift from an ethos of "multiply it out, but only where the evidence is solid" to something more like multiply it out, all the way up, however thin the tail. Here's the tension I keep chewing on. The global health wing of the movement is famous for refusing to fund things without randomized trials, cost-effectiveness estimates with error bars, explicit penalties for optimism — deep uncertainty is basically a veto on a grant. The longtermist wing happily funds things whose own proponents give a 1% or 0.1% chance of working, on the theory that a small probability of an astronomically large payoff dominates the arithmetic, and that robustness of evidence shouldn't change the expected value itself, only the estimate going into it. Same donors, same forums, people moving money between both pots. Everyone waves it off as different problems needing different tools, which strikes me as exactly the sort of thing people say when they havent worked out the actual commitments.

  So what decision theory does this two-faced funding practice presuppose, if any? Reconstruct it for me, because as far as I can tell there are a few candidate stories with very different implications. Story one: everyone's a pure EV maximizer, and the evidence-demanding side is just a debiasing correction — we systematically overestimate small chances, so demanding RCTs is a heuristic for cleaning up credences, not a principled departure from maximizing expected value, and the robustness requirement should melt away once estimates get honest enough. Story two: the community is implicitly risk-averse, or scope-insensitive, at heart, and only tolerates the fanatical bets because the numbers are too big and slippery to feel real — meaning the longtermist portfolio rests on a foundation the health wing already rejected. Story three: something like EV-is-right-but-tiny-probabilities-of-huge-payoffs-deserve-special-suspicion, i.e., the practice presupposes a non-fanatical decision theory that nobody will state out loud, since stating it would put a ceiling on the biggest bets. I want to know which of these the practice actually needs, where it's genuinely underdetermined such that several views would license it, where the two halves flatly contradict each other, and what a funder who made the presupposed view explicit would have to change — does the RCT requirement go, or do the long-shot bets?

  And since I keep getting the different-domains defense at parties: tell me whether it holds water. Is there a coherent position where you weight the reliability of evidence differently precisely when the stakes are astronomical, or does the whole edifice only stand because no one funder is forced to bet the same way twice?
reasoning: |-
  Okay, let me start by unpacking the user's query. They've been involved in rationalist and EA circles for a long time, observing a cultural shift in how decisions are made about funding. The tension they point out is between the global health wing's strict evidence requirements and the longtermist wing's willingness to bet on low-probability, high-impact interventions. They want to understand the decision theory behind this duality.

  First, I need to break down their three proposed stories. Story one suggests it's all about expected value (EV) maximization with debiasing heuristics. Story two points to implicit risk aversion. Story three hints at a special skepticism towards tiny probabilities of huge payoffs. The user also questions the "different domains" defense often given at parties.

  I recall that in decision theory, EV maximization is a standard approach. But applying it consistently in both domains seems inconsistent. Global health demands RCTs and error bars, while longtermists accept 1% chances. So maybe the heuristics in global health are about avoiding cognitive biases, like overestimating small probabilities. But does that hold when longtermists embrace those same small probabilities?

  Then there's risk aversion. If EAs were truly risk-averse, why fund longtermist bets? Unless the astronomical stakes create scope insensitivity—making the risk feel abstract. That would mean longtermism's bets rely on a psychological trick that the health wing rejects. But is that a coherent position?

  The third story about special skepticism for tiny probabilities ties into ideas like Pascal's Mugging. Maybe EAs are using something like regularized decision theories that downweight extreme tail probabilities. But if they admit that, it caps their biggest bets, which they might not want to do.

  The user also asks if the "different domains" defense holds water. Can you justify different evidence standards based on stakes? In global health, the consequences of a failed intervention are immediate and measurable, whereas longtermist risks involve existential threats with high uncertainty. But does that difference in uncertainty type change the decision theory itself? Or is it about the feasibility of evidence?

  Another angle: maybe the longtermist bets are about option value and learning. Early investments in AI safety could build knowledge even if they fail. That's different from health interventions where failure means wasted resources without learning. But does that align with how proponents justify their bets?

  I should also consider if there's an unstated non-fanatical decision theory. EAs might be using a hybrid model: EV for tractable problems and a fallback to robustness or diversification for deep uncertainty. But that needs to be explicit. The user wants to know if the two approaches contradict and what changes if made explicit.

  The user's deeper need seems to be a frustration with the community's inconsistency. They want a coherent framework that either reconciles the approaches or admits the tension. They might be concerned that longtermism's bets are intellectually dishonest, relying on EV rhetoric while avoiding its strictest requirements. Or they might worry that global health's rigor is myopic, missing out on high-impact opportunities.

  I need to address where the stories hold, where they clash, and what changes if presuppositions are made explicit. For example, if EV is primary, the RCT requirement might be a heuristic that could relax with better evidence. But in longtermism, better evidence isn't feasible, so the heuristic doesn't apply. However, that doesn't resolve the tension in decision theory itself.

  If risk aversion is implicit, then longtermist bets shouldn't happen unless they're not perceived as real risks. But that undermines their rationale. If special skepticism is applied, then longtermism's biggest bets get capped, which might change funding allocations.

  The "different domains" defense might hold on a practical level due to uncertainty type and stakes, but not on a pure decision theory level. The community might be relying on the fact that no single funder faces repeated bets, allowing different approaches without personal inconsistency.

  In conclusion, the practice is a patchwork. Making presuppositions explicit would likely force a choice: either relax evidence standards in global health for high-stakes but uncertain interventions (which they won't do) or apply more skepticism to longtermism's tail risks, reducing those bets. The underlying tension is between EV's theoretical purity and the practical need for robustness in different contexts.
answer: |-
  This tension isn't just surface-level; it cuts to the core of decision theory under uncertainty. Let's dissect your candidate stories, identify the presupposed commitments, and evaluate the "different domains" defense.

  **Analyzing Your Candidate Stories:**

  1.  **"Pure EV Maximizer with Debiasing Heuristic" (Story One):**
      *   **Plausibility:** High on the surface, especially for the global health side. RCTs, error bars, and optimism penalties *are* tools to get better-calibrated probability estimates (P) and effect size estimates (impact * QALYs/$). The *stated goal* is often "maximize EV, but only with reliable inputs."
      *   **Problems:**
          *   **The Veto Point:** The "deep uncertainty veto" isn't just about *improving* the estimate; it's about *rejecting action* when uncertainty is too high *even if the central estimate is promising*. This resembles a robustness requirement or a minimax-regret concern, not pure EV maximization. A pure EV maximizer would still act on the best available central estimate, however uncertain.
          *   **Asymmetry:** Why is this "debiasing" applied so rigorously to tractable problems but seemingly relaxed for longtermism? The longtermist wing also faces massive biases (scope insensitivity, availability heuristics for existential risks, motivated reasoning about pet causes). Why isn't the *same* level of skepticism/debiasing applied there? This suggests the heuristic isn't just about debiasing, but about *domain-specific risk tolerance*.
          *   **Implied Commitment:** If this story holds, the RCT requirement *should* melt away with better (non-RCT) evidence or more honest estimates, even in global health. Yet, RCTs often remain a gold standard even when strong observational data exists. The veto seems more fundamental.

  2.  **"Implicit Risk Aversion / Scope Insensitivity" (Story Two):**
      *   **Plausibility:** High for explaining the *asymmetry*. Global health interventions deal with concrete, immediate suffering. Failure is visible, measurable, and feels like a direct loss. Funding a dud bednet program *feels* like wasting money that could have saved lives *now*. This fosters a culture of caution and robust evidence. Longtermist bets, however, involve abstract, distant, unimaginably large payoffs. A 0.1% chance of preventing human extinction feels more like a conceptual exercise than a tangible risk. Losing $10M on a failed AI safety project doesn't *feel* like costing millions of lives in the same visceral way. Scope insensitivity makes the tail risk psychologically "cheap" to bet on.
      *   **Problems:**
          *   **Contradicts Stated Aims:** EA explicitly champions scope sensitivity and (often) risk-neutral EV maximization as core tenets. Admitting implicit risk aversion or scope insensitivity undermines the intellectual foundation, especially for longtermism.
          *   **Foundation:** Does it mean longtermism rests on a rejected foundation? **Yes, partially.** The health wing's practice implicitly rejects betting on highly uncertain central estimates *when the stakes feel real and immediate*. Longtermism exploits the *unreality* of astronomical stakes to bypass this same aversion. The contradiction is psychological, not necessarily logical, but it creates tension.
      *   **Implied Commitment:** If made explicit, funders would need to either:
          *   Apply similar risk aversion to longtermism (drastically reducing tail-end bets), OR
          *   Admit they are less risk-averse/scoped-sensitive when stakes are abstract (challenging core EA rhetoric), OR
          *   Double down on health-wing risk aversion, potentially missing tractable high-EV opportunities even there if uncertainty exists.

  3.  **"Special Suspicion for Tiny Probabilities of Huge Payoffs" (Story Three):**
      *   **Plausibility:** This aligns with critiques of fanaticism (Pascal's Mugging) and decision theories designed to avoid it (e.g., Regularity, Dud Detection, Leverage Penalties, Normalized Utilitarianism, various forms of Ambiguity Aversion). The intuition is that the mind (and potentially rational decision theory) is poorly equipped to handle tiny probabilities, making estimates highly unreliable and prone to manipulation or wild error. Robustness requirements act as a filter against this.
      *   **Problems:**
          *   **Unstated Ceiling:** As you note, stating this explicitly *would* put a ceiling on the biggest bets. It forces the question: "How tiny is *too* tiny to count at full weight?" This is anathema to pure longtermist EV maximization rhetoric.
          *   **Inconsistent Application:** Why apply this "special suspicion" filter rigorously in global health (where tail risks are usually smaller) but not in longtermism (where they are the *entire game*)? The justification based on *stakes* (astronomical consequences deserve *more* scrutiny, not less) directly contradicts the longtermist practice.
      *   **Implied Commitment:** This is the most intellectually coherent *potential* foundation for the *asymmetric practice*, but it's the one the community is least likely to state. Making it explicit would force longtermists to either defend a specific non-fanatical decision theory (capping bets) or abandon the practice of funding ultra-low-probability ventures. It would challenge the health wing to justify their robustness requirements *specifically* as a guard against tail-probability fanaticism in *their* domain.

  **The Presupposed Decision Theory & Practice:**

  The *actual practice* you observe presupposes a **hybrid, domain-specific, and often unexamined approach:**

  1.  **EV Maximization is the *Aspirational* Core:** Both wings pay lip service to it.
  2.  **Robustness Requirements Trump Pure EV Under "Tractable" Uncertainty:** When uncertainty is deemed resolvable with effort (like via RCTs in global health), the community demands that resolution *before* acting on EV, even if the central EV estimate is high. Failure to resolve it sufficiently leads to veto. This resembles **Minimax Regret** or a strong **Ambiguity Aversion**.
  3.  **Pure EV (on Central Estimates) Governs Under "Intractable" Uncertainty:** When uncertainty is perceived as inherently unresolvable (like the effectiveness of specific AI safety interventions or the probability of x-risks), the community defaults to acting on the best central EV estimate, however speculative. The robustness requirement *melts away* precisely when it would be most crucial under Story Three.
  4.  **Domain Definition Determines Uncertainty Type:** The key presupposition is that **"Global Health" = "Tractable Uncertainty"** and **"Longtermism" = "Intractable Uncertainty"**. This categorization drives the switch in decision rules.

  **Contradictions and Underdetermination:**

  *   **Flat Contradiction:** The core contradiction lies in the *treatment of deep uncertainty*. The health wing says: "Deep uncertainty? Veto. Resolve it first." The longtermist wing says: "Deep uncertainty? Plug in your best guess and maximize EV." This fundamental inconsistency in how uncertainty mandates action is papered over by the "different domains" label.
  *   **Underdetermination:** The *specific* decision theory *within* each wing is underdetermined. The health wing's practice is compatible with:
      *   EV Maximization + Strong Ambiguity Aversion/Epistemic Caution.
      *   Minimax Regret.
      *   Satisficing with a high bar.
      *   Story Three (suspicion of tails). The longtermist wing's practice is compatible with:
      *   Pure Fanatical EV Maximization.
      *   EV Maximization with a very high bar for "intractability".
      *   Scope sensitivity overwhelming implicit risk aversion (Story Two).

  **The "Different Domains" Defense: Does it Hold Water?**

  It holds **practical, context-dependent water**, but **fails as a deep, principled justification** for the contradictory decision rules:

  1.  **Where it Holds:**
      *   **Nature of Uncertainty:** Global health often deals with *parametric* uncertainty (What's the *exact* effect size?) resolvable by more/better data. Longtermism often deals with *structural/model* uncertainty (What are the right variables? Is this causal model correct?) that is harder or impossible to resolve with standard evidence-gathering. Demanding an RCT for AI consciousness research is nonsensical.
      *   **Stakes & Urgency:** Existential risks might demand action *now* with imperfect information; delaying for perfect evidence could be catastrophic. Global health problems are ongoing; gathering robust evidence often has less acute time pressure (though this is debatable).
      *   **Feasibility of Evidence:** RCTs *are* feasible for bednets or deworming; they are infeasible for many longtermist interventions.
      *   **Option Value & Learning:** Longtermist bets often have high option value (building fields, capacity, knowledge) even if the direct intervention fails. Health interventions are more often evaluated on direct, immediate impact.

  2.  **Where it Leaks:**
      *   **The Core Decision Rule Inconsistency:** It doesn't resolve *why* deep uncertainty mandates *inaction* in one domain but *action based on central estimates* in the other. The principled response to deep uncertainty shouldn't flip based solely on the *scale* of potential impact or *type* of uncertainty. If robustness is paramount in health due to uncertainty, why isn't it *more* paramount for existential stakes? If central EV estimates are actionable in longtermism despite uncertainty, why aren't they actionable in health *when robust evidence is genuinely infeasible*? The defense avoids grappling with the underlying decision-theoretic conflict.
      *   **Psychological Convenience:** It allows the community to compartmentalize, avoiding the discomfort of applying health-wing skepticism to cherished longtermist causes (or vice-versa).
      *   **"Betting the Same Way Twice":** This is astute. Individual funders rarely face *identical* high-stakes bets repeatedly where their inconsistency would be glaringly exposed. The portfolio approach and domain separation mask the tension at the individual decision level.

  **Conclusion: What Would Change?**

  A funder making the *actual presuppositions* explicit would likely need to:

  1.  **Abandon Pure EV Maximization as the Sole Principle:** Acknowledge that robustness, ambiguity aversion, or suspicion of tiny probabilities are core decision factors *in addition to* EV.
  2.  **Harmonize the Treatment of Deep Uncertainty:** Develop a *single* framework for action under deep uncertainty applicable *across* domains. This would likely involve:
      *   **For Longtermism:** Applying *some* form of regularization/discounting to tiny probabilities of huge payoffs (Story Three), or demanding much stronger robustness checks (diversification, sanity checks, clear failure modes) before funding ultra-speculative bets. Many long-shot bets would shrink or vanish.
      *   **For Global Health:** Potentially relaxing the "veto" for truly intractable uncertainties within health (e.g., some complex systemic interventions) if a plausible high-EV case exists *and* robustness can be achieved through other means (pilots, theory of change, diversification). The RCT stranglehold might loosen slightly at the margins.
  3.  **Explicitly Define "Tractable" vs. "Intractable":** Rigorously defend the criteria for placing a problem in one bucket or the other, rather than relying on intuitive labels like "global health" vs. "longtermism."

  **In essence, the current practice "works" because it leverages domain separation to avoid confronting a fundamental inconsistency in how uncertainty mandates action. Making the presuppositions explicit would force a choice: significantly scale back the long-shot bets, or significantly relax the robustness demands in global health when high stakes meet intractable uncertainty. The "different domains" defense is a useful practical categorization but an inadequate decision-theoretic justification for the contradictory rules applied within those categories.** The tension you've identified is real, structural, and points towards an unresolved challenge at the heart of consequentialist action under profound uncertainty.
