answer: |-
  ## Joint Statement: Humean Frequentism & Propensity Realism Adversarial Collaboration  
  **Participants:** Humean Frequentist Faction (HFF) & Propensity Realist Faction (PRF)  
  **Duration:** September 2023 - September 2024  
  **Purpose:** To clarify disagreements, identify testable cruxes, and distinguish substantive from verbal disputes regarding the metaphysics of objective chance.  

  ---

  ### (i) Jointly Accepted Claims  
  Both factions affirm the following:  

  1.  **Centrality of the Principal Principle (PP):** Rational credence (`Cr`) in an outcome `A` must satisfy `Cr(A | ch(A) = p ∧ E) = p`, where `E` is admissible information relative to `ch(A) = p`. The PP is the core constraint any adequate theory of objective chance must satisfy.
  2.  **Failure of Simple Frequentism:** Objective chance cannot be reductively analyzed as actual limiting frequency. The problem of finite sequences, the possibility of skewed frequencies in lawful worlds, and the undermining problem demonstrate its insufficiency.
  3.  **Role of Fit:** For any proposed chance function `ch`, its fit with the actual history of outcomes (frequencies) is epistemically relevant to its evaluation and plausibility. Both sides accept that low fit counts against a candidate `ch` theory.
  4.  **Role in Repeated Trials:** For repeated, identically prepared chance setups within a world, the objective chance `p` of outcome `A` entails that the sequence of outcomes is statistically expected to exhibit a long-run frequency close to `p`. Both sides accept the Law of Large Numbers as relating chance and frequency *within* a world.
  5.  **The Undermining Problem is Genuine:** Information about the *entire* future history of the world (or the entire Humean mosaic) is generally inadmissible relative to a Humean chance assignment `ch(A) = p`, because such information can entail that the actual frequency diverges from `p` in a way inconsistent with `ch` being part of the *actual* best system (Humean) or inconsistent with the true dynamical dispositions (Propensity). Both sides acknowledge this poses a significant challenge requiring theoretical resources.

  ---

  ### (ii) Table of Remaining Disagreements
  | Topic | Humean Frequentist (HFF) Position (as endorsed by HFF) | Propensity Realist (PRF) Position (as endorsed by PRF) |
  | :---- | :------------------------------------------------------ | :----------------------------------------------------- |
  | **Nature of Chance** | Objective chance is a theoretical posit: it is the probability function that achieves the best balance of simplicity, strength, and fit as part of the systematization of the entire Humean mosaic of particular matters of fact. Chance supervenes on the mosaic. | Objective chance is an irreducible, causally efficacious dispositional property inherent in chance setups. It is a fundamental feature of the world's dynamics, ontologically prior to and independent of global patterns of events. |
  | **Metaphysical Status** | Chance is a real, objective feature of the world *because* it is an indispensable component of the best description of the mosaic. Its reality consists in its role within this systematization. | Chance is a real, fundamental dynamical feature of the world, existing independently of its role in any description or systematization. Its reality consists in its causal power to produce outcomes. |
  | **Basis of the Principal Principle (PP)** | The PP is a synthetic, substantive principle of rationality. It is justified because deference to the best system is the optimal rational strategy for minimizing inaccuracy in credence given the actual patterns in the mosaic. | The PP is analytic or near-analytic to the concept of objective chance. It is justified because rational credence *just is* the recognition of the causal tendency (propensity) of the setup to produce the outcome. |
  | **Source of Credence Constraint** | Chance constrains rational credence *because* it encodes the globally optimal summary of the mosaic's probabilistic patterns, and rational agents seek to align their beliefs with these patterns. | Chance constrains rational credence *because* it *is* the causally efficacious feature of the world that directly governs the occurrence of outcomes. Credence tracks causal power. |
  | **Handling Undermining (Focus)** | Admissibility must be defined relative to the *Humean thesis itself*. `E` is admissible relative to `ch(A)=p` iff `E` contains no information that screens off `A` from the facts that determine whether `ch` is the best system *or* information about outcomes not relevant to determining `ch` in the best system. (Lewis 1994 "Humean Supervenience" approach). | Admissibility must be defined without presupposing the truth of a specific metaphysical theory of chance. `E` is admissible relative to `ch(A)=p` iff `E` contains no information about the causal processes leading to `A` or its outcomes beyond what is already factored into `ch(A)=p`. Information about the distant future/mosaic is admissible only if it doesn't reveal causal details impacting `A`. |

  ---

  ### (iii) Identified Cruxes & Testable Predictions
  Both sides agree that resolving the following questions would significantly advance the debate. Predictions are stated in advance.

  1.  **Crux: Is the PP Analytic?**
      *   **Question:** Can the concept of objective chance be coherently defined without essential reference to its role in constraining rational credence (via the PP or something equivalent)?
      *   **HFF Prediction:** Yes. We can conceive of a world with probabilistic patterns so complex that no useful systematization (and thus no Humean chance) emerges, yet rational agents might still develop credences about events. The PP is a substantive link between pattern and rationality, not definitional.
      *   **PRF Prediction:** No. Any concept labelled "objective chance" that does not inherently constrain rational credence in the manner of the PP is not a concept of *chance* at all, but something else (e.g., mere description of pattern). The PP is constitutive.
      *   **Relevant Cases/Thought Experiments:**
          *   **Patterned Chaos World:** A world governed by deterministic chaos, producing sequences statistically indistinguishable from genuinely stochastic sequences over all feasible observation periods. Is there objective chance here? HFF: Likely not (no best system advantage over deterministic description). PRF: No (no genuine stochastic disposition).
          *   **Ineffable Propensity World:** Imagine a world containing genuine causal propensities (`P*`), but where these `P*` are completely uncorrelated with any patterns in the mosaic (e.g., `P*` constantly shifts in ways leaving no traceable frequency patterns). Could `P*` be called "chance"? HFF: No (fails to constrain credence via mosaic patterns). PRF: Yes (it's the true disposition, even if unknowable/ineffable).

  2.  **Crux: Can Admissibility Be Defined Non-Circularly?**
      *   **Question:** Can a non-question-begging, non-circular criterion for "admissible information" (`E`) relative to `ch(A)=p` be given that both (a) validates the PP and (b) is acceptable to both HFF and PRF, without presupposing the truth of either specific metaphysical account?
      *   **HFF Prediction:** Yes, but only by building in the Humean account (e.g., Lewis's "no information about the future" or "no information undermining the best system" criteria). A truly neutral definition is impossible because admissibility *depends* on what chance *is*.
      *   **PRF Prediction:** Yes, based on causality. `E` is admissible iff it contains no information about the *causal history* or *outcome* of `A` beyond what is entailed by the complete specification of the chance setup `S` giving rise to `ch(A)=p`. Information about non-causally-connected distant events is admissible.
      *   **Relevant Cases/Thought Experiments:**
          *   **The Oracle's Whisper:** An agent learns from an infallible oracle *only* the proposition: "The actual frequency of `A`-like events in the complete mosaic diverges significantly from `p`." Is this information admissible relative to `ch(A)=p`? HFF: Clearly inadmissible (directly undermines `ch` being in the best system). PRF: Admissible (it's information about the mosaic pattern, not the causal propensity inherent in setup `S` affecting *this* `A`).
          *   **Microphysical Leak:** An agent learns a specific microphysical detail `D` about the setup `S` that, according to the true fundamental dynamical laws (which may be deterministic or indeterministic), completely determines whether `A` occurs or not. Is `D` admissible? HFF: Depends. If `D` screens off `A` from the facts fixing the best system *and* is not part of the "suitable" specification of `S`, likely inadmissible. PRF: Inadmissible (it provides information about the causal production of `A` beyond the chance `p`).

  3.  **Crux: Does Chance Necessarily Guide Credence?**
      *   **Question:** Is the constraining role of chance on credence explained *solely* by its role as the optimal summary of patterns (HFF) or *essentially* by its nature as a causal power (PRF)? Could there be a world with the HFF-best-system `ch` but where rational agents should *not* set `Cr(A) = ch(A)`?
      *   **HFF Prediction:** No. The rationality of deferring to the best system's `ch` is inherent in the goal of aligning beliefs with the actual, globally optimal summary of the mosaic's patterns. In any world where a best system `ch` exists, rational agents *should* defer to it via PP.
      *   **PRF Prediction:** Yes, potentially. If the HFF-best-system `ch` in a world did *not* correspond to genuine causal propensities governing individual trials (e.g., a "Best System" world lacking real indeterminism), then rational agents aware of this metaphysical fact *should not* set `Cr(A) = ch(A)` for single cases, though they might find `ch` useful for predicting frequencies. Deference requires real modal force.
      *   **Relevant Cases/Thought Experiments:**
          *   **Deterministic Best System World:** A world that is fundamentally deterministic at the microphysical level, but where the coarse-grained, macro-level patterns are such that a probabilistic theory `P` achieves incredible simplicity and strength gains over the deterministic description, making `P` part of the best system. Should a rational agent, who *knows* the world is fundamentally deterministic and that `P` is just a compact summary, set `Cr(A) = P(A)` for a single trial? HFF: Yes (PP applies; `P` *is* the chance). PRF: No (No real propensity; credence should track underlying determinism where known).
          *   **Alien Systematizers:** Imagine beings whose cognitive architecture and goals lead them to systematize the mosaic using radically different virtues, producing a "best system" `X` utterly unlike our `ch`, perhaps non-probabilistic. Would rational agents *like us*, inhabiting that world, still be constrained by our PP to defer to `ch` (if it exists) or `X`? HFF: Yes, to *their* world's best system `X` (if we could discern it). PRF: No; rational credence for us is constrained only by real propensities, not by alien systematizations.

  ---

  ### (iv) Verbal vs. Substantive Disagreement

  The collaboration identifies one significant area where disagreement appears **primarily verbal**:  

  *   **The Claim: "Chance is Real."**
      *   **HFF Interpretation:** "Real" means "is an indispensable component of the objectively best description of the contingent features of the actual world." Chance is real in the same way centers of mass or gravitational fields are real within physical theories – as robust, objective features of the systematization.
      *   **PRF Interpretation:** "Real" means "is a fundamental, causally efficacious property of entities or setups, existing independently of its representation in any description or its manifestation in actual events." Chance is real in the way fundamental forces or masses are real.
      *   **Analysis:** Both sides agree chance is objective and not merely subjective. The dispute over whether it is "real" often reduces to a dispute over the meaning of "real" in a metaphysical context – specifically, whether "real" requires *causal power irreducible to patterns* (PRF) or whether it can apply to *indispensable patterns/descriptions* (HFF). This is a difference in the background metaphysics of properties and reduction, not specifically about chance.

  **Substantive Core:** The collaboration affirms that the disagreements documented in sections (ii) and (iii) remain **substantive**. These concern the *nature* of the property that plays the chance role (pattern-based vs. causal-power-based), the *source* of its normative force over credence (systematization benefits vs. causal governance), the *logical status* of the PP, the *possibility of non-circular admissibility*, and the *explanatory priority* between chance and pattern. The testable cruxes outlined in (iii) target these substantive differences.

  ---

  **Conclusion:** This collaboration has succeeded in crystallizing points of agreement, formulating core disagreements in mutually acceptable terms, and identifying key, potentially resolvable cruxes with associated predictions and test cases. While a fundamental metaphysical divide remains, progress has been made in distinguishing verbal differences about "reality" from substantive disagreements about the structure and source of objective chance and its connection to rationality. Future work should focus on analyzing the thought experiments outlined in the cruxes.  

  ---
  **Signed,**  
  [Representative 1, Humean Frequentist Faction]  
  [Representative 2, Propensity Realist Faction]  
  [Date]
