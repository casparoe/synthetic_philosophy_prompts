tly what he would call anyone else who cheats — and with equal heat he condemns a close friend's newly revealed affair. Second: a manager has quietly padded her own expense claims for a decade, waving it off as something everybody does, and she now condemns, with full severity, a friend caught shoplifting goods of comparable value. Third: an old college friend of a husband, no longer in contact with either spouse, learns independently of the wife's affair and condemns her, to her face, at a dinner party. Predict her verdict on each of the three. Then reconstruct the candidate principles that could generate all seven of her earlier verdicts — there is more than one, and part of the work is saying precisely where they come apart, including how broadly each reads the notion of the same fault and what exactly her acquaintance verdicts are responding to. Commit to your best reading of her rather than surveying the options: tell me which principle she is actually running, why it fits better than its rivals, and what each rival would predict where they diverge. Finally, design the single further case that would most cleanly separate the leading candidates — the one whose verdict would tell me, in one stroke, which rule she is obeying. I am not interested in a taxonomy that ends in it depends; I want definite predictions with reasons.
