prompt: |-
  So I'm a novelist, and I've gotten stuck on something that turned out to be more philosophy than craft, and I'm hoping you can tell me whether the thing I've noticed has actual names attached to it — right now my notes are a mess of phrases like "the collapse kind," "the ugly kind," and "the parasite kind."

  Here's the situation. Several characters in the book I'm writing lean on the move where somebody justifies a moral rule by asking what would happen if everyone did the thing. You know the move. "What if everybody made promises they never intended to keep?" But while drafting argument scenes I realized the move doesn't come in one flavor, it comes in at least three, and I can't find the seams between them.

  Flavor one: the reply is that the practice eats itself. If everyone made promises with zero intention of keeping them, the word would stop doing any work — nobody would beleive it, so making one wouldn't get you anything, so there'd be nothing left to misuse. The act becomes impossible, not just inconvenient. (Collapse kind.)

  Flavor two: the reply is that the world keeps running but becomes one you couldn't want. If everyone decided to never lift a finger for a stranger in trouble, the machinery of daily life doesn't break — promises still function, queues still form — its just a world where, next time you're the one in trouble, nobody comes. Nothing logical contradicts; it's a world you couldn't stomach choosing. (Ugly kind.)

  Flavor three is the one giving me trouble. If everyone cheated on their taxes, the act of cheating wouldn't become impossible — lying to the tax office works fine as an act no matter how many people do it. What breaks is the background: no revenue, no tax office, nothing left to lie to. But that's not the same as flavor one, is it? In flavor one the thing destroyed is the very tool the maxim uses (the promise). In flavor three the tool (the lie) survives; it's the stage it was built on that goes. (Parasite kind: it only works because it stays rare.)

  So, questions. Does this three-way split have established names, or do any of the individual flavors? I have a feeling I'm brushing up against something old and systematic — the "what if everyone did it" move smells like Kant to me, but I only know him at the t-shirt level — but I don't want a label, I want the actual carving: which cases go in which bucket, and what to do with the ones that could fall either way depending on how you describe the act. Is "cheating on my taxes when I feel like it" one act, or just a species of "getting money by whatever means work"? Because if the description is up for grabs, it looks like the bucket a case lands in is up for grabs too, and that seems like it should bother somebody besides me. If the split is real but unnamed, coin me terms and give me boundary cases a novelist can actually put in dialogue. Please don't hand me a name and call it a day — I need to know where the edges are, since my characters are going to fight about exactly those edges.
reasoning: |-
  Okay, let me start by unpacking what the user is asking. They're a novelist who's noticed three different flavors of the "what if everyone did that?" argument in moral reasoning. They’ve categorized them as collapse, ugly, and parasite kinds. Their main request is to identify if these have established philosophical names and to clarify the boundaries between them. But digging deeper, they need this for their characters' arguments, so the distinctions must be clear and actionable in dialogue.

  First, I recall Kant's categorical imperative, especially the universalizability formulation. That’s probably what they’re referencing with the "t-shirt level" knowledge. Kant’s test is about whether a maxim can be universalized without contradiction. But the user’s three flavors show different failure modes. Let me match each to Kant’s concepts. Flavor one (collapse) seems like a contradiction in conception—where the maxim self-destructs when universalized. Flavor two (ugly) is more about contradiction in will, where the world isn’t logically impossible but unacceptable. Flavor three (parasite) is trickier; it’s not directly in Kant but relates to coordination problems or free-rider issues.

  The user’s real struggle is with the third type. They describe it as the tool (lying) surviving but the system collapsing. That feels like an institutional or systemic failure. I remember concepts like the free-rider problem in game theory—where individuals benefit from a common resource without contributing, leading to its depletion. Also, public goods and collective action problems fit here. The tax cheating example is classic: if everyone cheats, the tax system collapses, even though lying itself doesn’t become impossible.

  Next, the issue of act descriptions. The user is concerned that how you define the action changes which category it falls into. For example, is tax cheating a specific act or part of a broader category like "gaining money by any means"? This ties into how maxims are formulated in Kantian ethics. Philosophers like Korsgaard discuss the level of generality in maxims. If defined narrowly, it might fit collapse; broadly, it could be parasite. This ambiguity is crucial for their characters' debates. The novelist needs examples where the same action can be argued in different categories based on description.

  The user also wants boundary cases for dialogue. I should think of scenarios that sit on the edges. For instance, littering: if universalized, does it make littering impossible (collapse) or just create a horrible world (ugly)? Or consider overfishing—it’s a parasite kind where the system collapses, but fishing as an act remains possible. These examples can fuel character arguments.

  Underlying needs: The user is building philosophical conflicts between characters. They need clear distinctions, terminology that’s usable in fiction, and edge cases that generate tension. They might also want to explore moral relativism or how definitions shape ethical outcomes. Highlighting the ambiguity in act descriptions allows characters to challenge each other’s framing, which is great for drama.

  I should ensure the terms are memorable for a novel. "Collapse," "Ugly," and "Parasite" are good, but linking them to philosophical terms adds depth. Contradiction in Conception, Contradiction in Will, and Systemic Collapse/Free-Rider Problem. Providing these labels helps the novelist anchor the concepts while keeping their original terms for accessibility.

  Also, considering the characters' perspectives, some might insist on narrow definitions, others broad. For example, a Kantian character might argue tax cheating as a contradiction in conception by framing the maxim tightly, while another sees it as a systemic issue. This creates natural conflict.

  Finally, summarizing the three with clear criteria and examples. Making sure the parasite kind is distinguished by its dependence on the system’s stability, unlike collapse which destroys the act itself. Emphasizing that the parasite’s survival relies on rarity, which ties into game theory’s Nash equilibrium.
answer: |-
  You've hit upon a profound and beautifully observed philosophical distinction! Your "three flavors" absolutely map onto established concepts in ethics, particularly stemming from Kant but extending into game theory and institutional analysis. The "what if everyone did it?" move is indeed Kant's **Categorical Imperative (specifically, the Formula of Universal Law)**, but your instinct about its nuances is spot-on – Kant himself primarily focused on your first flavor, leaving the others implicit or underexplored.

  Here's the breakdown, with established names (where they exist), precise boundaries, and edge cases for your characters to fight over:

  1.  **Your "Collapse Kind" (The Act Self-Destructs):**
      *   **Kantian Name:** **Contradiction in Conception (or Logical Contradiction).**
      *   **Core Mechanism:** Universalizing the maxim leads to a *logical* or *practical impossibility*. The act *requires* a background condition that universalizing the act itself destroys. It's self-defeating.
      *   **Your Example:** Promising falsely. Universal false promising destroys the very institution of promising (trust in the word), making *any* promise (true or false) impossible and thus the *act* of false promising impossible.
      *   **Other Examples:** Stealing property (universal stealing destroys the concept of "property" itself). Lying (universal lying destroys the possibility of communication and thus the effectiveness of lying). Queue-jumping (if everyone jumps queues, the queue ceases to exist as an orderly structure).
      *   **Boundary Marker:** *Does the act cease to be possible or meaningful at all if everyone does it?* If yes, it's likely a Contradiction in Conception.
      *   **Character Argument Edge Case:** "What if everyone always parked in disabled spaces 'just for a minute'?" Proponent: "It destroys the point of the space – no one could ever reliably find one when needed, so the concept 'disabled parking space' vanishes." Opponent: "No, the *space* physically exists; it just becomes chaotic – that's your 'Ugly' kind!"

  2.  **Your "Ugly Kind" (The World Becomes Intolerable):**
      *   **Kantian Name:** **Contradiction in Will (or Volitional Contradiction).**
      *   **Core Mechanism:** Universalizing the maxim doesn't create a logical impossibility, but it creates a world *no rational being could consistently will to live in*. It reveals that the agent depends on others *not* acting on the same maxim they propose for themselves.
      *   **Your Example:** Never helping strangers. The world functions, but becomes a place of universal isolation and mutual neglect. You *need* the possibility of help when *you* are in trouble, so you cannot rationally will that *no one ever helps anyone*.
      *   **Other Examples:** Universal non-charity (a world devoid of compassion or safety nets). Universal free-riding on public goods without contributing (a world where nothing gets built/maintained). Universal refusal to vote (democracy collapses, leading to tyranny).
      *   **Boundary Marker:** *Could the world technically exist if everyone did this, but would you find it rationally acceptable to choose to live in that world, knowing you are just as vulnerable as everyone else?* If the answer is "No, that's horrific," it's a Contradiction in Will.
      *   **Character Argument Edge Case:** "What if everyone decided to have as many children as biologically possible?" Proponent: "That's clearly a contradiction in will! The planet would be unsustainable, famine rampant – no one could rationally will that future." Opponent: "But it's not *logically* impossible! Maybe technology saves us? Or it's just a massive population boom – ugly, but coherent. Or maybe it's 'Parasite' – *I* can only have 10 kids if *most* people have 2."

  3.  **Your "Parasite Kind" (The System Collapses Beneath the Act):**
      *   **Established Names:** **Free-Rider Problem, Collective Action Problem, Exploitation of a Commons, Institutional Collapse (Non-Kantian).**
      *   **Core Mechanism:** The act *depends for its benefit* on being the exception, not the rule. Universalizing it destroys the underlying *system, resource, or institution* that makes the act *beneficial or even possible* in the first place. The *act itself* (e.g., lying) might remain possible, but its *context* vanishes. This is where Kant is less explicit; it's more the domain of game theory and institutional economics.
      *   **Your Example:** Cheating on taxes. Universal cheating destroys the tax base, leading to the collapse of government services and potentially the government itself. The *act* of lying on a form remains possible, but the *institution* (the tax office collecting revenue) it parasitizes disappears. Cheating only "works" (provides individual benefit) if most people pay.
      *   **Other Examples:** Poaching endangered species (universal poaching drives them extinct, ending the possibility). Overfishing a common stock (fish gone, no one fishes). Looting during a disaster (destroys the remaining social order and infrastructure needed for survival). Using "insider" trading loopholes (if everyone does it, the market becomes pure chaos or collapses, and the "insider" advantage disappears).
      *   **Boundary Marker:** *Does the act provide individual benefit only because most people are upholding the system it exploits? Would universalizing it destroy that system, rendering the act pointless or impossible within its original context?* If yes, it's the Parasite/Free-Rider kind.
      *   **Distinguishing from Collapse:** In Collapse, the *act* dies (promising). In Parasite, the *system/context* dies, while the *act* (lying, taking fish) *as a physical behavior* might persist, but without its beneficial context.
      *   **Character Argument Edge Case:** "What if everyone exploited every legal loophole to avoid regulations?" Proponent: "That's pure Parasite/Free-Rider! The regulatory system collapses – pollution runs rampant, food becomes unsafe, trust vanishes. The loopholes only save *me* money because the *system* mostly functions for others." Opponent: "No, exploiting a loophole isn't like promising. The *act* of finding and using a loophole doesn't vanish if everyone does it; the *world* just becomes lawless – that sounds like 'Ugly'! Or maybe it's 'Collapse' because 'exploiting a loophole' implies a functioning legal system to have loopholes *in*?"

  **The Crux: The "Act Description" Problem (Where Characters Can Fight)**

  You've nailed the biggest philosophical headache: **The level of generality of the maxim matters immensely.** This is a major point of debate *within* ethics.

  *   **Kant's View (Narrow):** Focus on the *specific maxim of the agent*. "I will cheat on my taxes *to keep more money for myself when I think I can get away with it*." Universalizing *this specific* maxim leads to Systemic Collapse (Parasite kind). Kant might argue this reveals a contradiction because the agent *wills* both the benefit of the system (roads, police) *and* the act that destroys it if universalized (Contradiction in Will?), though it's arguable.
  *   **Broader Descriptions:** If you broaden the maxim, it can shift categories.
      *   "I will *gain money by any means necessary*." Universalizing *this* might lead to a Hobbesian "war of all against all" – clearly an **"Ugly" (Contradiction in Will)** world no one could rationally choose.
      *   "I will *lie when it benefits me*." Universalizing lying destroys communication – **"Collapse" (Contradiction in Conception)**.
  *   **Why Characters Fight:** One character might insist on the narrow description ("I'm just underreporting *this specific income stream* on *this specific form*"), arguing it falls into Parasite or maybe isn't universalizable at all without contradiction in *their specific case*. Another character insists on the broader, morally relevant description ("You're cheating the system that benefits everyone for personal gain"), forcing it into Parasite or Ugly. A Kantian purist might argue any lying is Collapse, regardless of context.
  *   **Edge Case for Dialogue:** **"What if everyone only voted based on their immediate, narrow self-interest?"**
      *   Character A (Narrow): "That's just how democracy works! Individuals vote their interest. Universalizing it... well, that *is* democracy. No contradiction." (Argues it passes the test).
      *   Character B (Broader/Ugly): "No! The maxim is 'I will *ignore the common good and long-term consequences* when voting.' Universalizing *that* leads to short-termism, pandering, societal collapse – a world no rational person could will! **Ugly Kind.**"
      *   Character C (Parasite): "Actually, it's **Parasite/Free Rider.** *I* can vote purely selfishly only because *most* people vote based on some notion of the common good or informed policy, maintaining a stable system. If *everyone* voted like me, the system would produce chaos, corruption, and ultimately fail, harming even my narrow interests."
      *   Character D (Collapse?): "Voting based purely on selfishness *undermines the very concept of representative democracy* as a means to find common ground. If universalized, the institution loses legitimacy and collapses into tyranny or anarchy – **Collapse** of the democratic system itself." (Blurs into Parasite/Systemic Collapse).

  **Terms for Your Novel:**

  You have great instincts with "Collapse," "Ugly," and "Parasite." They are vivid and novelistic. To anchor them to the philosophy without jargon:

  1.  **The Self-Destruct Rule (Collapse / Contradiction in Conception):** "If everyone did *that exact thing*, the thing itself would vanish. Like trying to light a fire in a room where everyone’s pouring water."
  2.  **The Unlivable World Rule (Ugly / Contradiction in Will):** "If everyone did it, the world wouldn't break, but you'd hate living in it. Especially knowing *you* made it that way. Like everyone turning their back on everyone else."
  3.  **The Free Rider's Trap (Parasite / Systemic Collapse):** "That only works *because* most people don't do it. If everyone tried to cheat the system like you, the whole thing falls apart, and your cheat doesn't work anymore. Like sneaking extra rations until the food runs out for everyone."

  **The Takeaway for Your Characters:**

  Their arguments should hinge on:
  1.  **Defining the Act:** What *exactly* is the maxim being proposed? How specific or broad is it? ("Is it 'cheating *this tax*' or 'gaining advantage by deception' or 'disregarding shared rules'?")
  2.  **Identifying the Failure Mode:** What happens when universalized? Does the act vanish (Collapse)? Does the world become hellish but coherent (Ugly)? Or does the system it exploits crumble (Parasite)?
  3.  **The Rational Will Test (Especially for Ugly/Parasite):** Could you *rationally* choose to live in that universalized world, knowing you are as vulnerable as everyone else? Does your action depend on others *not* doing it?

  You've encountered the messy reality behind a seemingly simple moral test. This ambiguity is *rich* territory for fictional conflict. Let your characters grapple with defining the act and diagnosing the consequences – that's where the genuine philosophical tension, and great dialogue, lies. Good luck!
