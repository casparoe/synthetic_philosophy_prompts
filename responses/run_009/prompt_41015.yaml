  I'm teaching an upper-level seminar on rational choice for philosophy and econ students — 14 people, one 75-minute session — and next week is backward induction. I want them to actually play a centipede game before they've seen any of the theory, so the puzzle arrives as something that happened to them instead of as a diagram on the board. Design the activity: the exact payoff shcedule (tokens or entries in a bonus-points lottery — no real money, but stakes they'll actually care about), how pairs are formed and how partners rotate across rounds, and at least one structural variation per round that sets up the debrief — maybe a round where they have to pre-commit to a written node-by-node strategy before play starts, maybe a round where everyone plays against a stooge who always passes, or something you think works better. What I really want is for them to hit the paradox themselves: the backward induction argument that passing at the very first node is the "rational" move, versus the near-certain reality that people pass for a while and someone takes in the middle — plus the extra wrinkle that if you find yourself six nodes deep, your opponent has already falsified the premises the argument needed to run. Then a debrief that maps specific moments from their games onto the formal story: the terminal node, common knowledge of rationality, what it means to be "surprised" to reach a late node. And be honest about which feature of the real paradox no classroom version can reproduce and I'll just have to supply by fiat.

  Two more asks. First, tell me what will predictably go wrong the first time I run this — I'm guessing some pairs will try to collude and split the winnings afterwards, or the doubling gets so big the numbers stop feeling real — and how to handle each. Second, on the debrief content: please keep a clear line between what's settled and what's genuinely contested among people who actually study this. My sense is that the empirical fact (play almost never matches the backward induction prediction in one-shot games) is settled, and so is the formal result *given* the assumptions, but the interpretation is a live fight — whether the prediction failing shows the argument is unsound, whether it just shows common knowledge of rationality never held in the room, whether the way play drifts toward earlier takes with repetition and learning vindicates the concept (Aumann vs. Binmore-ish, I think?). I don't want to hand my students a contested resolution dressed up as consensus, so flag which debrief points are safe to state flatly and which I should present as "here's where the field disagrees."
