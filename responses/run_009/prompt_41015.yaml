    - Aumann: the backward induction solution is the only rational outcome, so if players are rational and know the structure, they must take at the first node.
    - Binmore: the backward induction argument relies on common knowledge of rationality, which is a very strong assumption and not met in practice. The learning in repeated play might be due to learning about the other player's type (not necessarily becoming more rational).

  In the debrief, we can say:

  - "The backward induction argument, under the assumptions of rationality and common knowledge of that rationality, leads to taking at the first node. This is a formal result that is uncontroversial given the assumptions."
  - "However, in actual human play, we observe passing. The field disagrees on why this happens. One view is that the common knowledge assumption is too strong and does not hold. Another view is that the backward induction argument is flawed because it does not account for the fact that reaching a later node provides information about the other player's rationality. And some argue that humans are not perfectly rational in the game-theoretic sense."

  Predictable problems:

  1. Collusion: students might try to collude and split the winnings. For example, agree to pass until the end and then split the bonus points. How to handle: explicitly state that collusion is not allowed. They are not allowed to communicate during the game (except in the variation where we allow it? but we don't). And bonus points are non-transferable? So they cannot split. But they might agree to both get a high payoff by passing to the end? But in the game, if they pass to the end, at node 6, if B passes, they both get 0? Or in our design, at node 6 if B passes, both get 0. So there is no mutual reward at the end? Only by stopping at an earlier node? Actually, in our design, there is no mutual reward. So collusion is not beneficial? 

  But wait: if they pass until node 5 and then A takes? Then A gets 16 and B gets 0. Then they might feel bad? So they might pass to node 6 and then B takes? Then B gets 32 and A gets 0. Then they can split the tokens? But tokens are not transferable. So we state: tokens are individual and non-transferable. And they are converted to bonus points individually.

  2. Doubling gets big: the numbers at node 6 are 32 tokens. That's 1.6 bonus points (if 1 token=0.05). That's acceptable? And the baseline is 0.5 for A at node 1? So the range is 0 to 1.6 bonus points. We can scale down: divide all payoffs by 2? Then node 1: (0.5,0) -> 0.025 bonus points? That becomes too small? So we keep as is.

  3. Some pairs might finish quickly (if they take at node 1) while others take time. We can have a time limit per node? Or let them finish at their own pace? It shouldn't take long.

  4. In the pre-commit round, students might not write a strategy that is consistent with backward induction? But that's the point: they might write a strategy that passes for a few nodes. Then when they play, they have to follow it? And they might regret? 

  5. In round 3 (baseline again), they might take earlier? But we want to see if that happens.

  Logistics of the rounds:

  Total time: 75 minutes.

  - Introduction: 5 minutes (explain the rules, no theory, just the mechanics)
  - Round 1: 10 minutes (including distribution of sheets, playing, and collection)
  - Round 2: 15 minutes (because they have to write a strategy first, then play)
  - Round 3: 10 minutes
  - Debrief: 35 minutes

  The debrief is critical.

  Debrief structure:

  1. Ask for results: for each round, how many pairs took at node 1? How many reached node 3? node 5? node 6? Record on the board.

  2. Then ask: why did you pass at node 1? (if someone did) What were you hoping for?

  3. Then present the backward induction argument step by step, using the actual game tree.

  4. Then ask: "But according to this, you should take at node 1. Why didn't you? Or if you did, why did others not?"

  5. Then discuss: what if you reach node 3? What does that say about player B at node 2? (they should have taken but didn't). So now, at node 3, player A might think: B is not rational? Or B is cooperative? Then what?

  6. Then the key insight: backward induction relies on the assumption that at every node, the player believes that the other player is rational and will take at the next opportunity. But if they pass, that belief is contradicted.

  7. Then the field's disagreement: 
     - Is the backward induction argument flawed because it doesn't account for the revision of beliefs? 
     - Or is it that common knowledge of rationality is never present in real life?
     - Or are humans not rational in this way?

  8. Finally, note that in repeated play, we often see a shift toward taking earlier. Why? (learning about the other player's type, or learning the backward induction?).

  9. And what no classroom version can reproduce: 
     - Truly one-shot: in a classroom, they know they are in a class about rational choice, so they might expect rationality? 
     - The social context: they are playing with classmates they might see again? 
     - The low stakes: bonus points are not as real as money? 
     - We cannot enforce common knowledge of rationality? It's an assumption we make.

  Then you have to supply by fiat: "Assume that both players are rational and that there is common knowledge of rationality. Then the backward induction argument holds."

  Summary of the activity:

  - Payoff: tokens convert to bonus points at 1 token = 0.05 bonus points (or adjust to your grading scheme). Maximum 32 tokens = 1.6 bonus points.

  - Game tree (6 nodes) as described.

  - Rounds:
    1. Baseline: play with partner 1.
    2. Pre-commit: with partner 2, they write a complete strategy (for every node where they move, what they will do) before the game starts. Then they play and must follow that strategy.
    3. Baseline again: with partner 3, same as round 1.

  - Rotation: fixed seats in two rows, shifting one seat per round.

  - Hand out game sheets for each pair at the beginning of each round.

  - Collect data: record the node at which the game ended and the payoffs.

  - Debrief as above.

  This should fit in 75 minutes.
answer: |-
  Below is a comprehensive design for your centipede game classroom activity, optimized for a 14-student seminar with one 75-minute session. The goal is to create an experiential paradox where students encounter the tension between backward induction's "rational" prediction (taking immediately) and real-world play (passing for mutual gain), then debrief how their actions map to formal concepts like common knowledge of rationality and belief revision.

  ---

  ### **Activity Design: Centipede Game**

  #### **1. Payoff Schedule & Stakes**
  - **Token System**: Use tokens convertible to **bonus points** (students care about these, but avoid real money).  
    - **Conversion Rate**: 1 token = 0.05% bonus on final course grade (e.g., 20 tokens = 1.0% bonus).  
    - **Why this works**: Stakes feel meaningful (even small bonuses motivate students), and linear conversion avoids lottery complexities.  
  - **Game Structure**: **6-node centipede** (3 moves per player), with payoffs doubling at each node. Asymmetric payoffs ensure backward induction predicts immediate taking:  
    - **Node 1 (Player A)**: Take (4, 0); Pass → Node 2  
    - **Node 2 (Player B)**: Take (0, 8); Pass → Node 3  
    - **Node 3 (Player A)**: Take (16, 0); Pass → Node 4  
    - **Node 4 (Player B)**: Take (0, 32); Pass → Node 5  
    - **Node 5 (Player A)**: Take (64, 0); Pass → Node 6  
    - **Node 6 (Player B)**: Take (0, 128); Pass (0, 0)  

    *(Payoffs in tokens: A’s take, B’s take)*  
    - **Terminal Pass Punishment**: Passing at Node 6 gives (0, 0) to ensure backward induction holds theoretically (B should always take at Node 6, as 128 > 0).  
  - **Why 6 nodes?**: Long enough to incentivize passing (max joint payoff: 128 tokens for B at Node 6), but short enough to finish quickly. Max payoff = 128 tokens (6.4% bonus) keeps stakes tangible without feeling unreal.  

  ---

  #### **2. Pair Formation & Rotation**
  - **Initial Pairs**: 7 pairs (14 students), assigned randomly via numbered slips.  
  - **Rotation Across Rounds**:  
    - **Round 1 (Baseline)**: Pairs play once.  
    - **Round 2 (Pre-Commit Variation)**: Re-pair using a **shift system** (students in one row move one seat left; partners change).  
    - **Round 3 (Stooge Variation)**: Re-pair again (shift one more seat).  
  - **Time per Round**: 10 minutes max (prevents overthinking; mirrors one-shot game).  
  - **Logistics**:  
    - Provide each pair with a **game sheet** showing the full tree (students see all nodes to mimic standard centipede experiments).  
    - Moves recorded on a **decision log** (private; no communication beyond moves).  

  ---

  #### **3. Rounds & Structural Variations**
  Three rounds (20 mins total), each with a twist to highlight debrief themes:  

  - **Round 1: Baseline**  
    - **Goal**: Experience the paradox raw.  
    - **Setup**: Play normally (no pre-commitment).  
    - **Predicted Outcome**: Most pairs pass until Nodes 3–5. A takes late, or B takes at Node 6. Few take at Node 1.  

  - **Round 2: Pre-Commit Strategy**  
    - **Variation**: Players write a **complete strategy** before playing (e.g., “If Node 1: Pass; If Node 3: Take...”). Must follow it verbatim.  
    - **Goal**: Forces forward-thinking. Highlights how backward induction "plans" but conflicts with reactive play.  
    - **Debrief Hook**: “If you pre-committed to pass early, why? If you pre-committed to take, did you regret it when play reached later nodes?”  

  - **Round 3: Stooge Variation**  
    - **Variation**: One player per pair (assigned secretly) is a **stooge** instructed to **always pass** until Node 6. Use a folded instruction card (“You must pass at Nodes 2, 4, 6 unless taking ends the game”).  
    - **Goal**: Creates “irrational” partners. Students experience reaching late nodes, exposing backward induction’s fragility (belief revision when opponents defy rationality).  
    - **Why this works**: Stooges ensure late-node play, letting students feel the “surprise” of deep nodes.  

  ---

  #### **4. Data Collection**  
  - **Track for Debrief**:  
    - Node where game ended.  
    - Payoffs per player.  
    - For Round 2: Copies of pre-commit strategies.  
  - **Display**: Tally results on the board after each round (e.g., “Round 1: 1 pair took at Node 1, 5 pairs reached Node 4+”).  

  ---

  #### **5. Predicable Problems & Solutions**  
  - **Problem 1: Collusion/Side Agreements**  
    - *Risk*: Pairs agree to “pass to Node 6 and split tokens afterward.”  
    - *Solution*: **Rules upfront**: “No communication. Tokens are non-transferable and converted individually. Collusion invalidates data.” Emphasize academic integrity.  

  - **Problem 2: Unrealistic Doubling**  
    - *Risk*: Large numbers (e.g., 128 tokens) feel abstract, reducing stakes.  
    - *Solution*: **Frame tokens as “bonus points”** (not raw numbers). Remind students: “20 tokens = 1% grade boost.” Use smaller payoffs if needed (halve all values).  

  - **Problem 3: Stooge Suspicion**  
    - *Risk*: Students guess stooges, altering play.  
    - *Solution*: **Debrief stooges after Round 3**. Say pre-game: “Some players have unique instructions,” but don’t specify until debrief.  

  - **Problem 4: Time Overruns**  
    - *Solution*: **Hard caps**: 2 min/node. Assign a timekeeper. Skip Round 3 if behind (Baseline + Pre-Commit suffice).  

  ---

  ### **Debrief Structure (35–40 mins)**  
  Map student experiences to theory, flagging settled vs. contested points.  

  #### **1. Settled Points (State Flatly)**  
  - **Empirical Fact**: “In one-shot games, players rarely take at Node 1. Most pass until mid-game (e.g., Node 3–5).”  
    - *Map to activity*: Show your Round 1 data. Ask: “Why did you pass early? What did you expect from your partner?”  
  - **Formal Backward Induction**: “Given common knowledge of rationality (CKR) and perfect information, backward induction *formally proves* taking at Node 1 is the only rational outcome. Let’s derive it:  
    - Start at Node 6: B takes (128 > 0).  
    - Node 5: A takes (64 > 0, since B takes at 6).  
    - Node 4: B takes (32 > 0, since A takes at 5).  
    - ...Continue to Node 1 (A takes).”  
    - *Map to activity*: “In Round 2 (pre-commit), did anyone write a Node 1 take strategy? Why/why not?”  

  #### **2. Contested Points (Present as Live Debates)**  
  - **Why Predictions Fail**:  
    - *Settled*: “Backward induction fails empirically because CKR rarely holds in practice.”  
    - *Contested*: **Why CKR fails** is disputed:  
      - **Aumann-type view**: “Players *are* rational, but CKR is too idealized. Failure shows the assumption doesn’t hold.”  
      - **Binmore-type view**: “The argument is circular. Reaching Node 3 means Player B passed at 2, contradicting CKR. Beliefs must be revised, undermining induction.”  
      - **Bounded rationality**: “Humans can’t compute long induction chains or value fairness.”  
    - *Map to activity*: Use Round 3 (stooge): “When you reached Node 4, what did you think about your partner? Did you revise beliefs?”  

  - **Learning & Repetition**:  
    - *Settled*: “With repeated play, takes shift earlier (see Round 3 vs. Round 1 data).”  
    - *Contested*: **What learning means**:  
      - “Aumann: Learning *vindicates* backward induction—players discover rationality.”  
      - “Binmore: Learning reveals opponents’ types (e.g., ‘irrational’ partners), not abstract rationality.”  
    - *Map to activity*: Compare Round 1 and 3 data: “Did takes happen earlier? Why?”  

  - **The ‘Surprise’ Paradox**:  
    - *Settled*: “Reaching Node 4 means Player B passed at 2, violating backward induction’s initial assumptions.”  
    - *Contested*: **Whether this invalidates the model**:  
      - “Orthodox view: The model is sound; reality is ‘noisy’.”  
      - **Critics**: “The model assumes fixed rationality. Real players update beliefs, so induction is inapplicable past Node 1.”  
    - *Map to activity*: “At Node 5 (Round 1), did taking feel ‘rational’? Or did passing seem better since you’d come so far?”  

  #### **3. Unreproducible Element (Supply by Fiat)**  
  - **The Issue**: No classroom game replicates **true common knowledge of rationality**. Students know peers (not strangers), stakes are low, and social dynamics (e.g., trust, fairness) intrude.  
  - **Handle by Fiat**: “For the *formal argument*, we assume CKR. In practice, this is fragile—human play adds beliefs about others’ motives. We’ll use CKR as a ‘what if’ tool.”  

  ---

  ### **Timeline for 75-Minute Session**  
  1. **Intro (5 mins)**: Explain rules, tokens, no theory.  
  2. **Round 1: Baseline (10 mins)**.  
  3. **Round 2: Pre-Commit (15 mins)**.  
  4. **Round 3: Stooge (10 mins)**.  
  5. **Debrief (35 mins)**: Data recap → Backward induction derivation → Paradox discussion → Contested issues.  

  ---

  ### **Why This Works**  
  - **Experiential Paradox**: Students *feel* the tension—altruism/trust vs. “rational” defection—before seeing theory.  
  - **Variations Illuminate Theory**: Pre-commit exposes planning vs. reactivity; stooges force belief revision.  
  - **Academic Rigor**: Cleanly separates settled math (backward induction given CKR) from contested interpretations (why it fails).  

  This design mirrors real experimental economics (e.g., McKelvey & Palfrey, 1992) while fitting classroom constraints. Adjust payoffs/rounds as needed, but retain the core: **students must live the paradox to debate it**.
