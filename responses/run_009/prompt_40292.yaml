prompt: |-
  I help run a small population ethics reading group at my university — we're mostly grad students, a mix of philosophy and econ people, and every year the exact same fight happens: someone claims everyone secretly accepts the procreation asymmetry (creating a miserable life is bad, but creating a happy life isn't good, or at least isn't owed in the same way), someone else says that's just a status-quo bias dressed up as a principle, and we never actually figure out where each person stands. So this year I want to settle it with a quiz. Like one of those dumb online personality quizzes, except it actually does philosophy.

  Please take on the role of a professional philosopher who works on population ethics, and think carefully before writing — ideally do a quick brainstorm about which cases really split the positions, since that's the whole point. Then write the quiz: eight to ten questions, each a concrete case with two or three answer options, and a scoring key at the end mapping answer patterns onto named positions. The positions that need to show up as leaves are at least: straight total utilitarianism, the procreation asymmetry itself, critical level views, person-affecting views (including the Narveson-style making-people-happy versus making-happy-people distinction), Benatar's antinatalist asymmetry, and the Epicurean line that coming into existence can't be bad for you because there's no one it's bad for. The questions have to sort people by what they say about cases, not by which label they like — so no question can just ask whether someone accepts the asymmetry. Some cases I'd like in there: failing to create a happy child when you easily could (my friend swears people who say this isn't wrong are just weirded out rather than convinced — probe that), the couple who can conceive now and get a child with a minor disadvantage or wait and get a different, healthy child, the tradeoff between adding lots of barely-worth-living lives versus a few wonderful ones, and one case I invented that I want you to include: a hospital can spend its budget either extending an existing patient's happy life by forty years or bringing an equally happy new person into existence — if those feel different to you, is the difference about identity or about the act of creation itself? I genuinely don't know what my own answer to that says about me, so make sure the scoring key handles it.

  Two more things. First, flag any pair of positions your quiz can't actually separate — I suspect critical level and lexical views collapse into each other on most realistic cases, but tell me if I'm wrong, and be honest about it rather than pretending the key is cleaner than it is. Second, check my cases: if one of my answer options is secretly two options, or if a case is doing no diagnostic work, say so and fix it — I'd rather have seven clean questions than ten mushy ones. The quiz is going out to about fifteen people who've read Parfit but argue like it's a pub, so the questions should be readable but not dumbed down.
reasoning: |-
  Okay, let me tackle this population ethics quiz request. The user runs a reading group where the same procreation asymmetry debate happens annually, and they want a concrete quiz to map positions without directly asking about labels. 

  First, I need to identify core positions to distinguish: total utilitarianism, procreation asymmetry, critical level theories, person-affecting views (Narveson-style), Benatar's antinatalism, and Epicureanism. The quiz must force these apart through cases, not labels.

  The user specifically requested four scenarios:
  1. Failing to create a happy child (tests if creation is seen as obligatory)
  2. Conceiving now vs. later for different children (probes identity vs. quality tradeoffs)
  3. Many barely-worth-living vs. few wonderful lives (scales aggregation questions)
  4. Hospital budget: extend existing life vs. create new life (isolates creation/identity tension)

  I'll brainstorm additional cases that split key disagreements:
  - For Benatar vs. procreation asymmetry: a case where not creating prevents suffering but also prevents happiness
  - For Epicureanism: harm comparisons involving non-existent beings
  - For critical level: tradeoffs where creating lives below/above threshold affects decisions
  - For person-affecting: choices that change who exists versus how well-off they are

  Potential pitfalls to avoid:
  - Critical level and lexical views might collapse if no "barely worth living" option appears
  - Person-affecting views could bifurcate into narrow (only existing people) vs. wide (future people)
  - The hospital case might conflate creation/identity if not worded precisely

  For question design:
  - Each case needs asymmetric answer options that clearly branch
  - Avoid "mushy" cases where multiple positions give same answer
  - Include at least one counterintuitive option to reveal true commitments
  - Use the user's invented hospital case verbatim since it puzzles them personally

  Scoring key must:
  - Map answer patterns to positions, admitting where distinctions fail
  - Flag unresolvable overlaps (e.g., critical level vs. lexical on some cases)
  - Show how hospital case answers map to identity/creation explanations

  Finally, I'll:
  - Keep language accessible but philosophically precise
  - Limit to 8 questions for focus
  - Pre-test logic to ensure positions diverge
  - Acknowledge in key where real-world views might blend principles

  This approach should force the group's implicit assumptions into the open while making the annual debate more productive.
answer: |-
  Here's a rigorously designed population ethics quiz to sort positions based on concrete intuitions. I've refined your cases, added diagnostic questions, flagged limitations, and included a scoring key mapping answer patterns to core positions. The quiz targets the fault lines you described.

  **The Population Ethics Intuition Probe: Where Do You Stand?**

  *Instructions: Answer intuitively based on moral wrongness (assuming no other obligations/rights conflicts). Assume all lives are secular, self-contained, and knowledge is certain. "Wrong" means morally impermissible, not merely unfortunate.*

  **Question 1: The Happy Child Omission**
  > A healthy, happy child would certainly exist if you take a simple, painless action (e.g., press a button). You choose not to act. No one else is affected.
  >
  > A) **Wrong.** You deprived the world of happiness at no cost.
  > B) **Not wrong.** You didn't harm anyone who exists or will exist.
  > C) **Not wrong, but it would be good to act.**

  **Question 2: The Disabled Child vs. Later Healthy Child**
  > A couple can conceive a child now who will have a minor but lifelong disability (e.g., deafness), leading to a life slightly less happy than average but still very much worth living. If they wait 3 months to conceive, they'll have a different, fully healthy child with an average happy life. They want a child either way.
  >
  > A) **Conceive now is permissible.** The child will have a good life, and creating *them* is good.
  > B) **Conceive now is wrong.** They should wait to create the healthier child.
  > C) **Conceive now is wrong only if it harms the later child (but it doesn't).** Permissible, but waiting is better.

  **Question 3: The Hospital Budget Dilemma (Your Case)**
  > A hospital has funds to either:
  > - **Option X:** Extend an existing, happy 20-year-old patient's life by 40 years of equal happiness.
  > - **Option Y:** Create a completely new, equally happy person who will live 40 years.
  > No other patients are affected; these are the only options.
  >
  > A) **Strongly prefer X.** Extending life is clearly better/more urgent.
  > B) **Strongly prefer Y.** Creating new life is clearly better/more urgent.
  > C) **Morally equivalent.** Same total happiness added.
  > D) **X is better, but not because of happiness total.** Something else matters.

  **Question 4: Preventing Misery vs. Creating Happiness**
  > You can do only one:
  > - **Action A:** Prevent an existing person from enduring 10 years of excruciating suffering (they'll live happily otherwise).
  > - **Action B:** Cause a new, very happy person to exist for 10 years (who wouldn't exist otherwise).
  >
  > A) **A is obligatory.** Preventing suffering matters more.
  > B) **B is obligatory.** Creating significant happiness matters more.
  > C) **A is obligatory,** but if B created *much more* happiness, it could outweigh A.
  > D) **Neither is obligatory,** but A is better to do if choosing.

  **Question 5: The Non-Identity Problem (Minor Deprivation)**
  > Policies today cause minor climate change impacts in 200 years. This slightly reduces the quality of life for future people (still very good) *and* changes who is born. Without the policy, different, equally happy people would exist.
  >
  > A) **Wrong.** Future people are worse off than possible people *could* have been.
  > B) **Not wrong.** No future person is worse off than *they* would have been otherwise.
  > C) **Wrong,** but only because the policy harms existing people too (assume it doesn't).

  **Question 6: Millions of Barely-Good Lives vs. Few Excellent Lives**
  > A choice affects a large future population:
  > - **Scenario Alpha:** 1 billion people exist with lives barely worth living (+1 utility unit each).
  > - **Scenario Beta:** 10 million people exist with extremely happy lives (+1000 utility units each).
  > Total utility: Alpha = 1 billion, Beta = 10 billion.
  >
  > A) **Alpha is better.** More total units of wellbeing.
  > B) **Beta is better.** Lives shouldn't be barely worth living; quality matters more.
  > C) **Beta is better,** but because 10 billion > 1 billion, not because of quality per se.
  > D) **Alpha is better only if we must compare totals.** But ideally, avoid creating barely-worth-living lives.

  **Question 7: Avoiding a Miserable Life**
  > You can easily prevent the conception of a child who would certainly have a life full of excruciating suffering, deemed not worth living by any standard. You choose not to prevent it.
  >
  > A) **Wrong.** You caused a miserable existence.
  > B) **Not wrong** (though tragic). There's no subject harmed by being created.
  > C) **Wrong,** specifically because creating suffering is bad, even if no one is "harmed."

  **Question 8: Creating Happiness vs. Relieving Suffering (Symmetry Check)**
  > Consider two actions:
  > - **Action P:** Relieve a mild headache (small suffering) in an existing person.
  > - **Action Q:** Create a brief moment of mild pleasure for a new person (who wouldn't exist otherwise).
  > Assume equal intensity/duration.
  >
  > A) **P is morally significant; Q is not.** Relieving suffering matters; creating small pleasure doesn't.
  > B) **Both are morally significant and roughly equivalent.** Adding positive value is similar.
  > C) **Neither is morally significant,** but P might be slightly preferable.

  ---

  **Scoring Key & Position Mapping**

  *How it works: Compare your answers to the patterns below. Positions are listed where they most consistently fit. **Limitations are flagged.** Real views often blend elements.*

  1.  **Total Utilitarianism (TU):** Focus on net happiness sum.
      *   Q1: A | Q2: B | Q3: C | Q4: C (leaning B) | Q5: A | Q6: A or C | Q7: A | Q8: B
      *   *Core:* Creating happy lives is good; preventing happy lives is bad if costless. Aggregates impersonally.

  2.  **Procreation Asymmetry (PA):** Creating suffering is bad; creating happiness is not good (or not required).
      *   Q1: B | Q2: A or C | Q3: A or D | Q4: A or D | Q5: B | Q6: D | Q7: A or C | Q8: A
      *   *Core:* Q1=B, Q7=A/C, Q8=A are key. Q4=A/D shows asymmetry. Q3=A/D reveals non-equivalence. *Variant:* Some (Q1=C) see creating happiness as good but *not obligatory*.

  3.  **Critical Level (CL) / Lexical Threshold (LT):** Happiness must exceed a threshold (CL) or be "sufficiently high" (LT) for creation to be good.
      *   Q1: B or C | Q2: B | Q3: C or D (if D, reason = quality) | Q4: A | Q5: A | Q6: B | Q7: A | Q8: A
      *   *Core:* Q6=B is crucial (rejecting Alpha). Q4=A prioritizes preventing suffering. *Distinction:* **CL** (Q6 might accept Alpha if sum high enough) vs. **LT** (Q6 always B - quality floors matter absolutely). *Limitation:* CL/LT often converge on Q2, Q4, Q6, Q7. Q3=C vs D might separate impersonal CL from person-affecting-leaning LT.

  4.  **Person-Affecting (Narveson-type) (PAff):** "Make people happy, but don't make happy people." Focus on harm/benefit to specific individuals.
      *   Q1: B | Q2: A (or sometimes C) | Q3: A or D (reason = benefiting *that* patient) | Q4: A or D | Q5: B | Q6: D or B | Q7: A or C | Q8: A
      *   *Core:* Q1=B, Q5=B (Non-Identity), Q3=A/D (non-equivalence favoring existing person). *Narveson Distinction:* "Making people happy" (Q3=A/D, Q4=A/D) vs. "Making happy people" (Q1=B, Q2=A). *Limitation:* Overlaps heavily with PA on Q1,B; Q5,B; Q8,A. Q3 and Q4 answers help distinguish *why*.

  5.  **Benatar's Antinatalist Asymmetry (BA):** Coming into existence *is* always a harm (because good things only benefit you if you exist, but bad things *harm* you by existing), but non-existence isn't a harm.
      *   Q1: B | Q2: A (but creation is still *overall* harmful!) | Q3: B (creation is harmful) or D (harm aversion) | Q4: D (neither obligatory, but A avoids harm) | Q5: B | Q6: D (avoid creating) | Q7: C | Q8: A
      *   *Core:* Q7=C is signature (wrong *because* creating suffering is bad, not harm *to* the child). Q1=B is essential. Q3 often B/D. *Limitation:* Can mimic PA/PAff on many answers (Q1,B; Q5,B; Q8,A). Q7=C is the strongest differentiator.

  6.  **Epicurean View (EV):** Nonexistence cannot be harmed or benefited. Only harms/benefits to existing beings matter.
      *   Q1: B | Q2: A or C | Q3: A or D | Q4: D (A might be *kinder*) | Q5: B | Q6: ? (Applies poorly to aggregates) | Q7: B | Q8: A (P matters for existing person; Q doesn't)
      *   *Core:* Q1=B, Q7=B, Q5=B are definitive. Q4=D (Neither obligatory). *Limitation:* Converges with PA/PAff/BA on Q1, Q5, Q8. Q7=B is the clearest marker against PA/BA/CL/TU.

  **Key Limitations & Flagged Overlaps:**

  1.  **Critical Level vs. Lexical Threshold:** Very hard to distinguish with small cases. Q6 (Alpha/Beta) is the best shot: CL might accept Alpha if the sum is sufficiently larger than Beta (if the critical level is low), LT would always reject Alpha. Most quiz answers will be identical. **Assume CL/LT score together unless Q6=B is absolute.**
  2.  **Procreation Asymmetry vs. Person-Affecting vs. Epicurean:** Significant overlap on answers (Q1=B, Q5=B, Q8=A). Crucial differentiators:
      *   **Q7:** PAff/A/CL/TU = A or C (wrong); EV = B (not wrong).
      *   **Q3/Q4 Motivation:** PAff (Benefit *that* person), PA (Avoid creating suffering/duty asymmetry), EV (No subject to harm/benefit).
      *   **Q6:** PAff often D (avoid creating marginal lives), PA similar, EV silent/confused.
  3.  **Benatar vs. Others:** Q7=C ("Wrong *because* creating suffering is bad") is the strongest Benatar signal vs. PAff/PA (who say A: "Wrong *because* you caused harm to the child" or imply it) and EV (B: Not wrong).
  4.  **Hospital Case (Q3) Diagnostics:**
      *   **A ("Extend"):** PAff (benefit *that* person), PA (asymmetry/duty to existing), EV (only existing beings matter), CL/LT (if quality focus).
      *   **B ("Create"):** Rare! Maybe strong TU or negative utilitarians avoiding future suffering? Benatar might see it as actively harmful. Not a core position here.
      *   **C ("Equivalent"):** TU, some CL.
      *   **D ("X better, not happiness"):** PAff (identity matters - benefit *that* patient), PA/EV (act of creation itself isn't required/good, extending is preventing loss).

  **Refinements & Checks:**

  *   **Your Friend's Hunch (Q1):** The options cleanly split TU (A) from almost everyone else (B/C). If many choose B/C, your friend might be right that "weirdness" drives intuition.
  *   **Disabled Child Case (Q2):** Fixed ambiguity. Option C captures the "permissible but suboptimal" view common in PAff/PA. Option B is CL/LT/TU.
  *   **Hospital Case (Q3):** Added Option D to capture non-utilitarian reasons for preferring extension (identity/duty/avoiding creation). This is crucial for diagnosing PAff/PA/EV.
  *   **Aggregation Case (Q6):** Options clearly split TU (A/C) from CL/LT/PA/PAff (B/D). D allows expressing discomfort with marginal lives without rejecting aggregation entirely.
  *   **Epicurean Case (Q7):** Explicit Option B is essential to isolate EV.
  *   **Suffering/Happiness Symmetry (Q8):** Directly probes the core PA/BA asymmetry vs. TU/CL symmetry. Option A is the asymmetry signature.

  This quiz forces distinctions through contrasting cases and carefully structured options. It won't capture every nuance, but it will reliably sort your group into the core camps and make the annual fight much more productive! Good luck.
