prompt: |-
  My housemate just finished a seminar on philosophy of language and gave me this account of Austin on performative utterances: Austin noticed that some utterances do not report on the world but act on it — saying "I promise to have it back by Friday" does not describe a promise but makes one. He called these performatives and said that instead of being true or false they are happy or unhappy, depending on whether the felicity conditions hold: the right person must speak in the right circumstances, the procedure must be executed properly and completely, and the speaker must have the requisite thoughts, feelings, and intentions. According to my housemate, if any of these conditions fails, the act is null and void — so an insincere promise is not a promise at all, which, he says, neatly explains why we don't hold people to promises they never meant to keep. He added that there is a clean grammatical criterion for spotting performatives: you can insert the word "hereby" (as in "I hereby promise") and still make sense, unlike with ordinary statements. He concluded that the lasting upshot of Austin's theory is the dichotomy between performative and constative utterances, and that insincerity voids speech acts across the board.

  Two things bother me. First, when my housemate once muttered a sarcastic "sorry" after denting my car, my sense was that he had apologized badly rather than not apologized — the act was still there, just defective. Second, I have a vague memory that Austin ended up changing his mind about something central here rather than leaving the dichotomy standing. How much of my housemate's account would a philosopher of language accept, where exactly does it go subtly wrong, and does his explanation of insincere promises survive the corrections?
reasoning: |-
  Okay, the user's query is about Austin's theory of performative utterances. Their housemate explained it, but they have two concerns. First, when the housemate sarcastically said "sorry" for denting the car, it felt like a bad apology, not a non-apology. Second, they recall Austin might have changed his mind about the performative-constative dichotomy. I need to address these points.

  The housemate's summary includes key points: performatives act rather than describe, felicity conditions, insincere promises being void, the "hereby" test, and the dichotomy. The user's first issue is about the sarcastic apology. According to the housemate, insincerity voids the act, but the user felt it was still an apology, just defective. This suggests Austin's initial strict view might be problematic. I remember Austin later realized that infelicities don't always nullify acts; some just make them flawed. So in the sarcastic "sorry," while insincere, it still counts as an apology, albeit a bad one. That explains the user's intuition.

  The second point is about Austin changing his mind. The dichotomy between performatives and constatives was central in his early work, but he later abandoned it in "How to Do Things with Words." He concluded that all utterances are performative to some extent, introducing locutionary, illocutionary, and perlocutionary acts instead. The constative-performative distinction collapses because even statements like "it's raining" perform actions (e.g., informing). So the housemate's claim about a lasting dichotomy is incorrect.

  The "hereby" test is a useful heuristic but not foolproof. Some performatives don't work with "hereby" if they're not explicit (e.g., "guilty" in court). Also, some statements can use "hereby" humorously but aren't performatives. So it's a guideline, not a strict rule.

  Regarding insincere promises, Austin's initial view was that insincerity voids the act, but later thinkers like Searle argued that the act still occurs but is abused. So insincere promises are still promises, just defective. This aligns better with the user's experience. The housemate's explanation that insincere promises aren't promises at all doesn't hold under the revised view.

  I should also note that Austin's shift to illocutionary acts changes how we view utterances. The focus is on the act being performed, which can be infelicitous in different ways. Misfires make the act null, but abuses still see the act as occurring. The user's sarcastic apology is an abuse, not a misfire.

  The user might be looking for validation of their intuitions against their housemate's rigid interpretation. They probably want a clearer understanding of Austin's actual contributions and where the housemate oversimplified. Explaining the evolution of Austin's thought and the nuances in speech act theory will address their concerns. Highlighting the difference between misfires and abuses clarifies why the sarcastic apology still counts. Correcting the dichotomy and the insincerity point shows the housemate's account is outdated. Emphasizing that Austin himself moved beyond these ideas is key.
answer: |-
  Your intuitions are spot-on, and your vague memory is correct: Austin significantly refined, and ultimately abandoned, the initial framework your housemate described. While your housemate accurately presents the *starting point* of Austin's work (as in his 1955 William James Lectures, later published as *How to Do Things with Words*), Austin's own analysis evolved considerably. Here's a breakdown of what a philosopher of language would accept and where your housemate's account goes subtly wrong:

  **What Your Housemate Gets Right:**

  1.  **Core Insight (Performatives Act):** Absolutely correct. Austin's revolutionary insight was that utterances aren't just true/false descriptions; many *do* things (promising, apologizing, marrying, betting, etc.).
  2.  **Felicity Conditions:** Correct. Performatives require certain conditions to be "happy" or "felicitous" (Austin later preferred these terms over "unhappy").
  3.  **"Hereby" as a Heuristic:** Useful, but overplayed (see below). Adding "hereby" *can* be a good initial indicator for *explicit* performatives.

  **Where Your Housemate Goes Subtly (and Crucially) Wrong:**

  1.  **The Insincerity/Thoughts & Intentions Condition (Your First Concern):**
      *   **Housemate's Claim:** Insincerity (lack of requisite thoughts/intentions) voids the act entirely ("not a promise at all").
      *   **Austin's Refinement:** Austin distinguished *different types* of infelicities with *different consequences*:
          *   **Misfires (Acts purported but void):** These occur when the *procedure* itself is flawed (wrong person, wrong circumstances, botched execution). E.g., a layperson saying "I sentence you to life" or saying "I bet you $10" when there's no accepted procedure for that bet. The act *is* null and void - it simply doesn't come off.
          *   **Abuses (Acts performed but flawed):** These occur when the procedure is correct *but* the speaker lacks the requisite thoughts, feelings, or intentions, or subsequently doesn't follow through. **Crucially, Austin argued that in cases of abuse, *the act is still performed*, but it's *infelicitous*.** Your sarcastic "sorry" is a perfect example of an **Abuse**. He *did* apologize (he performed the illocutionary act of apologizing), but the apology was insincere, hollow, and defective. It *was* an apology, just a really bad, infelicitous one. We might still hold him morally accountable *because* he apologized, even if badly.
      *   **Why this matters:** Your intuition ("apologized badly rather than not apologized") aligns perfectly with Austin's mature view. Insincerity (Abuse) doesn't erase the act; it makes it defective. The housemate's claim that "an insincere promise is not a promise at all" is **incorrect** according to Austin's later framework. An insincere promise *is* a promise (it creates an obligation, it can be accepted or rejected), but it's an *abusive*, infelicitous one. The explanation for why we might not hold someone to an insincere promise isn't that *no promise occurred*, but rather that the *conditions of its felicity* (sincerity) were violated, potentially releasing the promisee or making the promiser blameworthy for insincerity *on top of* breaking the promise.

  2.  **The Performative/Constative Dichotomy (Your Second Concern):**
      *   **Housemate's Claim:** Austin established a lasting dichotomy.
      *   **Austin's Conclusion:** This is the *biggest* correction. **Austin explicitly ABANDONED the performative/constative dichotomy.** As he dug deeper, he realized:
          *   **Constatives can be infelicitous too:** Statements like "The present King of France is bald" or "John's children are all asleep" (said when John has no children) aren't simply "false"; they involve presupposition failures or other infelicities *similar* to performative misfires.
          *   **Performatives imply truth/falsity:** Saying "I warn you the bull is about to charge" implies the bull *is* about to charge. If it's not, the warning is misleading in a way akin to falsity.
          *   **The Fundamental Unit:** Austin concluded that *all* utterances are **speech acts**. The real distinction isn't between doing and describing, but between different *types of acts* we perform *in* speaking. He developed his **tripartite framework**:
              *   **Locutionary Act:** The act *of* saying something with a certain meaning (phonetic, phatic, rhetic).
              *   **Illocutionary Act:** The act performed *in* saying something (promising, warning, stating, asking, apologizing, etc.). This became the central focus. The "performatives" of the early lectures are specific types of illocutionary acts where the action is explicitly named by a performative verb.
              *   **Perlocutionary Act:** The act performed *by* saying something, its effects or consequences (persuading, alarming, convincing, amusing, etc.).
      *   **Why this matters:** The "lasting upshot" is **not** the dichotomy, but the **illocutionary act** as the core concept and the realization that *all* utterances involve doing things (illocutionary forces) – including stating, which is just one type of illocutionary act among many. The dichotomy was a stepping stone Austin discarded.

  3.  **The "Hereby" Criterion:**
      *   **Housemate's Claim:** A "clean grammatical criterion".
      *   **Reality:** It's a useful *heuristic* for spotting *explicit* performatives (where the verb names the act), but it's **not foolproof or theoretically watertight**:
          *   Many perfectly felicitous performatives sound unnatural with "hereby" in everyday contexts ("I hereby name this ship..." works ceremonially, but "I hereby promise..." sounds overly formal).
          *   Some utterances are clearly performative without an explicit verb and *don't* work with "hereby" ("Guilty!" said by a foreperson; "Out!" said by an umpire).
          *   Some constative utterances *can* be humorously or emphatically prefixed with "hereby" without changing their fundamental nature ("I hereby declare that it is raining!").

  **Summary & Answers to Your Questions:**

  1.  **How much would a philosopher accept?** They would accept the *initial impetus* (performatives exist, felicity conditions matter) and the *heuristic value* of "hereby". However, they would reject the claims that (a) insincerity voids the act, (b) the performative/constative dichotomy is Austin's lasting contribution or even valid at all, and (c) the "hereby" test is a clean grammatical criterion.
  2.  **Where does it go subtly wrong?**
      *   **Most importantly:** Conflating *all* infelicities as making the act "null and void". Specifically, misclassifying *insincerity* (an Abuse) as voiding the act, rather than making it defective.
      *   **Fundamentally:** Presenting the abandoned performative/constative dichotomy as the lasting upshot, rather than the theory of illocutionary acts and the recognition that *all* speech involves action.
      *   **Overstating:** The "hereby" test as a definitive grammatical rule.
  3.  **Does his explanation of insincere promises survive?** **No, it does not.** His explanation ("not a promise at all") relies on the oversimplified early view that *any* infelicity voids the act. Austin's mature view (and the view of subsequent speech act theorists like Searle) is that an insincere promise **is still a promise** (it is an illocutionary act of promising), but it is **infelicitous** due to the speaker's lack of intention (an Abuse). The obligation may be created, and the promiser can be held accountable for *both* making an insincere promise *and* for failing to keep it.

  **Your sarcastic "sorry" example perfectly illustrates why Austin had to abandon the strict dichotomy and develop the Abuse category.** The act *was* performed (illocutionary act of apologizing), but it was infelicitous due to insincerity (an Abuse). Your housemate performed the illocutionary act of apologizing very badly, not no act at all. Austin's later work provides the richer framework to capture this crucial nuance.
