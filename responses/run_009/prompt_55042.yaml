prompt: |-
  So, background: I'm a retired isotope geochemist, spent about forty years dating rocks and groundwater, and since I retired I've gotten properly sucked into philosophy — mostly ethics. The statues and street-names fights are what hooked me, partly because my own field is full of dead men's names (the Curie, the becquerel) that nobody ever suggests revisiting, while medicine keeps renaming eponymous diseases. Before I wade into the actual arguments I want a spec, the way I'd want one before designing an experiment. Write me exactly five requirements — numbered 1 to 5, no intro, no wrap-up, nothing after the last item — that any adequate theory of commemoration (what honors are for, when they can be withdrawn, who gets a say) has to meet. Each item should be a sentence or two: state the requirement, give the case or scenario that motivates it, and say whether it's non-negotiable or just one camp's prejudice dressed up as one. Somewhere in the five, deal with my own proposal, which I've not seen anyone discuss: the half-life idea. On my view no commemoration should be permanent — every statue, street name, and building name comes up for scheduled re-ratification, say every 75 years, the way we re-analyse old samples when better instruments come along. Is that a genuine desideratum, a negotiable preference, or a category mistake (an honor isn't evidence, maybe it's more like a promise, and promises don't work that way)? And in at least one item, tell me whether it's in tension with another item on the list — that joint-satisfiability bit is honestly the part I care about most. My hunch from chemistry is that lists like this are usually jointly unsatisfiable in some quiet corner and everybody pretends otherwise. No need to score the existing views against the list, I'll try that myself and probably make a mess of it. (Also forgive any typos, my eyes arent what they were.)
reasoning: |-
