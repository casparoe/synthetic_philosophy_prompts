prompt: |-
  For a reading group on social norms I've written up my position on convention, roughly in the spirit of David Lewis's *Convention* (1969), and I'd like a consistency check before I circulate it. Here is the package: (1) a convention is a solution to a coordination problem — a regularity that nearly everyone conforms to, expects others to conform to, and would rather conform to provided nearly everyone else does, in a situation where some alternative regularity would have served about as well; (2) conventions require common knowledge: unless the parties expect the conformity of others, expect the others to expect it, and so on, there is no convention, only a habit; (3) driving on the right is a paradigm convention, even though no driver has met, or could enumerate, most of the people she is coordinating with; (4) punishment-backed norms such as dueling or foot-binding, where the practice persists because deviation is sanctioned, are conventions in the full sense and not merely regularities propped up by penalties; (5) conventions are arbitrary, in that among the available alternatives the payoffs do not favor the one actually adopted — and this arbitrariness is compatible with our actual driving side having a straightforward historical explanation; (6) language is conventional in the same sense as driving on one side of the road, so that meaning is just one more regularity of this kind; (7) conventions by themselves generate no obligations, so unilateral deviation from one is at most imprudent, never wrong; and (8) breaking a promise is wrong, and promising is itself a convention. Go through these and tell me which pairs are in real tension and how badly, which only appear to be, and what the cheapest revision would be for each genuine tension — please rank the tensions by severity rather than presenting them all as equally serious, and tell me which single revision would clean up the most. I genuinely don't know where the problem lies, so don't read into my ordering a preference about what should be dropped.
reasoning: |-
  Okay, the user has laid out their position on social norms based on David Lewis's Convention and wants a consistency check before sharing it with their reading group. They've listed eight points and want me to identify tensions between them, rank those tensions by severity, and suggest the cheapest revisions. 

  First, I need to carefully analyze each point and see how they interact. The user seems well-versed in philosophy, given their reference to Lewis and the nuanced distinctions they're making. They're clearly preparing for academic discussion, so precision in identifying contradictions will be valuable. 

  Looking at point (4) about punishment-backed norms like dueling being full conventions, and point (7) saying conventions generate no obligations... Hmm, that's a major clash. If dueling persists because deviation is sanctioned, that implies there's some normative pressure or perceived "ought" involved, which directly contradicts the claim that breaking conventions is merely imprudent, not wrong. This seems like the most severe tension. 

  Then there's point (8) about promising being conventional but wrong to break. The user explicitly says breaking promises is wrong, but if conventions create no obligations (point 7), how can promise-breaking be morally wrong? This is closely related to the first tension but focuses specifically on the promising case. 

  Point (6) claiming language is conventional like driving side seems okay at first glance, but Lewis himself noted key differences - language has structure and systematicity that simple coordination problems lack. Treating them as identical might be oversimplifying. 

  The historical arbitrariness in point (5) actually fits well with point (1)'s definition - the fact that driving side could've been different doesn't undermine its conventional nature. No tension there. 

  For the punishment issue, the cheapest fix would be to distinguish between "pure" coordination conventions (like driving side) and punishment-backed norms, treating the latter as a hybrid category. This maintains Lewis' core framework while acknowledging the normative element in practices like dueling. 

  For promising, clarifying that the moral obligation comes from the specific practice of promising rather than from conventionality itself would resolve the contradiction. The convention enables the practice, but the wrongness stems from the commitment made. 

  I should emphasize that point (4) and (7) create the most fundamental problem - it's hard to maintain both that punishment-backed norms are "conventions in the full sense" while insisting conventions never create obligations. That contradiction needs priority attention before the promising issue. 

  The user seems open to revisions - they specifically asked not to infer preferences from their ordering. My response should stay neutral and solution-focused, offering clear pathways to resolve each inconsistency while preserving as much of their original framework as possible. The key is showing how minor tweaks can eliminate contradictions without abandoning Lewis' core insights about coordination and common knowledge.
answer: |-
  Based on a close analysis of your package, here's a breakdown of tensions ranked by severity, followed by the cheapest revisions:

  **Severe Tensions (Fundamental Contradictions):**

  1.  **Tension between (4) & (7): Punishment-Backed Norms vs. No Obligations**
      *   **Conflict:** (4) asserts that punishment-backed norms (dueling, foot-binding) are "conventions in the full sense." (7) states that "conventions by themselves generate no obligations," so deviation is merely "imprudent, never wrong."
      *   **Problem:** Punishment-backed norms *fundamentally* rely on the perception (and often reality) that deviation *is* wrong or normatively forbidden, not just imprudent. The punishment exists *because* there is a perceived obligation to conform, and deviation is seen as meriting sanction. Saying these are "conventions in the full sense" while simultaneously claiming conventions generate *no* obligations creates a direct contradiction. Lewis explicitly distinguishes conventions from norms enforced by sanctions precisely on grounds related to obligation and preference structure.
      *   **Severity:** Highest. This strikes at the core definition of convention vs. norm. (4) pulls punishment-backed norms *into* the definition of convention, while (7) pushes anything generating obligation *out* of it.

  2.  **Tension between (7) & (8): No Obligations vs. Promise-Breaking is Wrong**
      *   **Conflict:** (7) states conventions generate no obligations. (8) states that promising is a convention, but breaking a promise *is* wrong. This implies that the convention *of promising* generates an obligation (the obligation to keep the promise).
      *   **Problem:** If promising is *just* a convention like driving on the right, then breaking a promise should be merely imprudent (like driving on the left), not morally wrong. But (8) explicitly states it *is* wrong. This suggests that the convention of promising has a special status *because* it generates obligations, contradicting (7).
      *   **Severity:** Very High. This is a classic problem in the literature. Lewis himself grappled with it, ultimately arguing that the *content* of the obligation in promising comes from the *specific* expectations created by the act within the convention, but he acknowledged the special nature of promising conventions. Your (7) and (8) directly conflict.

  **Significant Tension (Potential Oversimplification):**

  3.  **Tension between (1)/(6) & Lewis's Nuance: Language as Purely Coordination**
      *   **Conflict:** (1) defines conventions as solutions to coordination problems where alternatives are roughly equal. (6) explicitly equates language conventions with driving side conventions.
      *   **Problem:** While Lewis argues language *rests on* conventions, he acknowledges significant differences. Language involves complex systems with structure, productivity, and often lacks perfect symmetry between alternatives (e.g., the word "dog" vs. "zgx" isn't *quite* like left vs. right; the system itself imposes constraints). Crucially, language conventions often solve *communication* problems, which are a special *type* of coordination problem, but with unique features concerning meaning and truth. Equating them directly can be seen as an oversimplification of Lewis's more nuanced view.
      *   **Severity:** Moderate. It's not a direct contradiction within your package, but it might be challenged on fidelity to Lewis and the complexity of language. It *potentially* conflicts with the "alternatives serve about as well" clause in (1) when applied to complex linguistic systems.

  **Minor Tension/Apparent Tension Resolved:**

  4.  **Apparent Tension between (5) & History: Arbitrariness vs. Explanation**
      *   **Conflict?** (5) states conventions are arbitrary (payoffs don't favor the adopted solution over alternatives). It also states this is compatible with the adopted solution having a straightforward historical explanation.
      *   **Resolution:** This is **consistent** and a key Lewis point. Arbitrariness means the *reasons for persistence* lie in coordination and common knowledge, *not* in inherent superiority. History explains *which* arbitrary solution got established (e.g., Napoleon's influence on driving side), not *why* it persists (which is due to coordination/expectations). No tension here.

  **Cheapest Revisions, Ranked by Impact:**

  1.  **Revise (4) - Punishment-Backed Norms:** This is the most severe tension and impacts the core definition.
      *   **Cheapest Revision:** Distinguish "pure" Lewisian conventions (like driving side) from punishment-backed norms. Modify (4) to state: *"While punishment-backed norms (dueling, foot-binding) exhibit surface regularities and rely on expectations similar to conventions, they are distinct because conformity is motivated primarily by the threat of sanction rather than the mutual preference for coordination given others' conformity. Their persistence relies on perceived obligations and sanctions, moving them beyond the scope of 'conventions' as defined by Lewis."*
      *   **Impact:** Resolves the severe conflict with (7), better aligns with Lewis, and clarifies the core concept.

  2.  **Revise (7) or (8) - Conventions & Obligations/Promising:** This is also severe but slightly less fundamental than the (4)/(7) clash. Revising (7) is cheaper philosophically than redefining promising.
      *   **Cheapest Revision (Option A - Modify (7)):** Soften (7) to acknowledge *some* conventions *can* generate normative expectations that feel like obligations. Modify (7) to: *"Conventions themselves, as solutions to coordination problems, do not inherently generate moral obligations. However, certain specific conventions, particularly those embedded in social practices involving commitments (like promising), can give rise to obligations through the specific expectations and normative attitudes they create within that practice. Unilateral deviation from a pure coordination convention is primarily imprudent."*
      *   **Cheapest Revision (Option B - Modify (8)):** Reframe promising slightly. Modify (8) to: *"Breaking a promise is wrong. Promising relies on a conventional apparatus to create the commitment, but the wrongness stems from the violation of the specific obligation undertaken through that conventional act, not solely from deviating from the convention itself."* (This implicitly accepts that the *convention* enables the creation of an obligation, which isn't generated by other conventions like driving).
      *   **Impact:** Resolves the direct conflict between (7) and (8). Option A is more comprehensive but alters the core "no obligations" claim. Option B is more surgical but leaves (7) potentially clashing with other potential cases.

  3.  **Refine (6) - Language Convention:** This addresses the moderate tension.
      *   **Cheapest Revision:** Qualify the direct equivalence. Modify (6) to: *"Language relies fundamentally on convention in Lewis's sense – meaning arises from regularities in use sustained by common knowledge and mutual expectations within a community, solving coordination problems of communication. While sharing the core structure of coordination, language involves complex systematicity and constraints that differentiate it in degree from simpler cases like driving side."*
      *   **Impact:** Maintains the core conventionalist thesis about meaning while acknowledging complexity, aligning better with Lewis's own discussion.

  **Which Single Revision Cleans Up the Most?**

  **Revising (4) to exclude punishment-backed norms as "pure" Lewisian conventions is the single most impactful revision.** It resolves the most severe internal contradiction (with (7)), strengthens the core definitional coherence of (1) and (2), and better aligns the entire package with Lewis's framework. While the (7)/(8) tension is also severe, it's a more focused issue on one specific convention (promising) and has slightly cheaper resolution paths that don't undermine the core concept as fundamentally as including punishment-backed norms within it does. Resolving (4) first provides the clearest foundation.
