  We are designing an in-class activity to simulate the surprise exam paradox. The goal is for students to experience the paradox through a game where they try to predict when a "quiz" (a surprise event) will occur over a compressed week (5 rounds). The key is to have them naturally arrive at the backward induction argument and then see it fail in practice.

  ### (1) Setup and Rules
  **Game Structure:**
  - The "week" is compressed into **5 rounds** (representing Monday to Friday).
  - Each round is **3-5 minutes** long (adjust based on total time; 5 rounds * 3 min = 15 min, plus discussion and debrief fits 75 min).
  - **Roles:** 
    - You (the TA) are the "teacher" who has pre-committed to a specific round for the quiz (by writing it down and sealing it in an envelope, or using a digital commitment that can be verified later).
    - Students are the "class" and individually make predictions each round.

  **Prediction Mechanism:**
  - At the start of **each round**, every student **privately** writes down two things:
    1. **Prediction for this round:** "Yes" (I think the quiz happens this round) or "No" (I don't think it happens this round).
    2. (Optional) **Overall guess:** If you want to allow a one-time guess at the beginning for the exact round, but we'll focus on per-round predictions to mimic the step-by-step reasoning.

  **Why per-round?** Because the paradox unfolds day by day. We want them to experience the elimination step by step.

  **Scoring (Points System):**
  - **Correct Prediction Bonus:** If a student correctly predicts "Yes" (quiz happens) in the round it happens, they get **+10 points**.
  - **Surprise Penalty:** If the quiz happens in a round and the student predicted "No" (so they are surprised), they get **-5 points**.
  - **Correct "No" Prediction:** If a student predicts "No" and no quiz happens that round, they get **+1 point** (a small reward for being right, but not too high to avoid incentivizing always saying "No").
  - **Incorrect "Yes" Prediction:** If a student predicts "Yes" but no quiz happens, they get **-2 points** (to penalize false alarms).

  **Rationale for Payoffs:** 
  - We want students to be motivated to predict the quiz correctly when it happens (hence the high +10) but also to avoid being surprised (penalty -5). 
  - The small reward for a correct "No" and penalty for a false "Yes" should encourage them not to cry wolf every round. However, the backward induction might suggest that they should always say "No" until the last round? But let's see.

  **Quiz Rules:**
  - The teacher (you) has pre-committed to exactly one round for the quiz (or none? but we want exactly one to mirror the paradox). So there will be one quiz in one of the five rounds.
  - The quiz occurs at the **end** of the round (so during a round, students make predictions at the start, then the round proceeds, and at the end the teacher reveals whether the quiz happens or not).

  **Commitment:**
  - Before the game starts, you write down the round number (1 to 5) on a piece of paper, seal it in an envelope, and show the sealed envelope to the class. Alternatively, use a digital method (e.g., a Google Form that records a timestamped response) that you can reveal at the end.

  **Game Flow:**
  - The game proceeds round by round (round 1 to round 5).
  - At the start of each round, students write their prediction for that round (and hand it in or record it in a way that is private and timestamped? e.g., using index cards collected by TAs or via a simple form on their laptops if available).
