answer: |-
  ### (1) Setup and Rules  
  **Objective:** Students experience the surprise quiz paradox firsthand by trying to predict when a "quiz" will occur during 5 compressed rounds (representing Monday-Friday). The teacher (you) have pre-committed to one quiz day, sealed in an envelope. Students earn/lose points based on predictions vs. actual outcomes.  

  **Materials:**  
  - Sealed envelope with quiz round number (1–5) inside (show students it’s sealed before starting).  
  - Index cards or digital forms (e.g., Google Forms) for private predictions.  
  - Whiteboard for tracking rounds and scores.  
  - Tokens (e.g., poker chips) or a point ledger for scoring (no real money).  

  **Rules:**  
  - **Rounds:** 5 rounds (3 minutes each). Each round starts with predictions and ends with a quiz/no-quiz reveal.  
  - **Predictions:** At the **start** of each round, every student **privately** guesses:  
    - **"Yes"** (I believe the quiz happens **this round**) or **"No"** (I believe it does not).  
    - *No revisions allowed* between rounds—commitment mimics real-time reasoning.  
  - **Quiz Execution:**  
    - At the **end** of each round, you open the envelope (or use a verified method) to reveal if it’s the quiz round.  
    - If yes: Administer a 1-question mini-quiz (e.g., "What is 2+2?"). Focus is on surprise, not content.  
    - If no: Simply announce "No quiz."  
    - Quiz occurs exactly once; after it happens, subsequent rounds have no quiz (remind students).  
  - **Scoring (Per Round):**  
    | Prediction | Actual Outcome | Points | Rationale |  
    |------------|----------------|--------|-----------|  
    | Yes       | Quiz occurs   | +10   | Correct anticipation |  
    | No        | Quiz occurs   | −5    | Surprise penalty |  
    | No        | No quiz       | +1    | Correct non-prediction |  
    | Yes       | No quiz       | −2    | False alarm |  
  - **Winning:** Highest point total after Round 5 earns bragging rights (e.g., "Paradox Master" title).  

  **Why this works:**  
  - Payoffs incentivize avoiding surprise (−5) but reward correct "Yes" (+10). Backward induction suggests "never predict Yes until Friday," but if all follow this, early quizzes surprise everyone.  
  - Pre-commitment (envelope) ensures trust—you don’t adapt to predictions.  

  ### (2) Round-by-Round Flow  
  **Pre-Round 1 (5 mins):**  
  - Explain rules, show sealed envelope, and clarify: "Quiz happens exactly once. You won’t know the day until it’s revealed."  
  - Emphasize: Points depend on predictions vs. reality.  

  **Rounds 1–5 (3 mins/round):**  
  1. **Prediction Phase (1 min):**  
     - Students write "Yes/No" for the current round on cards/forms. Collect immediately.  
  2. **Activity Phase (1.5 mins):**  
     - Discuss a tangential topic (e.g., "Is a tomato a fruit?") to fill time—distracts from overthinking.  
  3. **Reveal Phase (0.5 mins):**  
     - Announce if the quiz occurs. If yes, give the mini-quiz; if no, move on.  
     - *After quiz occurs:* Remind, "Quiz is done! Future rounds are prediction-only."  
  4. **Scoring (0.5 mins):**  
     - Display outcomes on the board. Students self-score (honor system) or assign a "scorekeeper."  

  **Teacher’s Play:**  
  - Pre-commit to **Round 2 or 3** (e.g., Wednesday) to maximize surprise.  
  - **Sample Flow (Quiz on Round 3):**  
    - *Round 1:* Most predict "No" (safe bet). No quiz → "No" predictors earn +1.  
    - *Round 2:* Many still predict "No." No quiz → +1 for "No."  
    - *Round 3:* Most predict "No" (reasoning: "It can’t be Friday yet!"). **Quiz occurs** → "No" predictors get −5 (surprised), few "Yes" get +10.  
    - *Rounds 4–5:* Quiz already happened → "No" predictions correct (+1 each).  

  **Phase 2: Robot Group (15 mins total):**  
  - After Phase 1, ask for 5 volunteers ("robots").  
  - **Rules for Robots:** "You are perfectly rational. Use backward induction: Eliminate days starting from Round 5. Since you ‘prove’ no day works, predict ‘No’ every round."  
  - Replay with a **new commitment** (e.g., Round 4). Robots predict "No" regardless.  
  - **Outcome:** Robots get −5 when quiz occurs (surprised) and +1 on non-quiz rounds. Non-robots watch and compare.  

  ### (3) Debrief Plan (20 mins)  
  **Step 1: Elicit Student Experiences (5 mins)**  
  - Poll: "Who was surprised? Who predicted ‘Yes’ on the quiz round?"  
  - Ask: "What was your strategy? Did anyone use backward induction?"  
  - Highlight contradictions: "If you ‘knew’ it couldn’t be Friday, why were you surprised earlier?"  

  **Step 2: Reconstruct the Paradox (5 mins)**  
  - Whiteboard the elimination argument together:  
    - "If no quiz by Round 4, must be Round 5 → not a surprise. So Round 5 impossible."  
    - "If no quiz by Round 3, must be Round 4 → not a surprise. So Round 4 impossible." (Repeat to Round 1.)  
  - Ask: "Where did this break down in the game?"  

  **Step 3: Locate the Flaw (5 mins)**  
  - Guide discussion to:  
    - **Knowledge Assumption:** "Did you truly ‘know’ on Thursday that Friday was impossible? Or did you assume the teacher would avoid Friday? But the teacher was committed!"  
    - **Self-Defeating Rationality:** "The argument requires you to believe the quiz must happen. But if you believe the argument, you think it’s impossible—so you’re always surprised!"  
  - Connect to the reading: "The announcement creates a self-referential loop: ‘You won’t know’ becomes unknowable."  

  **Step 4: Takeaways (5 mins)**  
  - Moral: "The paradox exposes limits of idealized rationality. Real agents (you!) can be surprised because knowledge isn’t infinite or perfectly recursive."  
  - Preview next topic: "We’ll see how this links to larger themes of common knowledge in game theory."  

  ### (4) What Will Go Wrong and Fixes  
  - **Trust Issues:** Students suspect you peeked at predictions.  
    - *Fix:* Have a student write/verify the envelope pre-game. Use a digital randomizer (e.g., RNG app) if possible.  
  - **Gaming Predictions:** Some always predict "Yes" for +10 chance.  
    - *Fix:* Point out this loses points (−2 per false alarm). In debrief, contrast their "noise" strategy with rational robots.  
  - **Time Crunch:** Rounds run long.  
    - *Fix:* Use a timer. Cut Activity Phase to 1 min if needed. Skip Phase 2 if short on time (but it’s gold!).  
  - **Robot Confusion:** Volunteers don’t grasp "predict ‘No’ always."  
    - *Fix:* Simplify: "Robots, you’ve logically proven the quiz can’t happen. Stick to ‘No’!"  

  ### (5) What the Game Can’t Reproduce  
  - **Idealized Rationality:** The game assumes students are "mostly rational," but real humans use heuristics (e.g., "Quiz won’t be first day"). The paradox’s "airtight" feel relies on *perfect* reasoners with infinite deductive capacity—something a 75-min game can’t simulate.  
  - **Common Knowledge:** In the paradox, everyone knows everyone knows the announcement. In class, uncertainty about others’ reasoning breaks the chain, allowing surprise. The game can’t fully isolate the self-referential "I know that you know..." loop.  
  - **Temporal Dynamics:** The game compresses a week into minutes, losing the dread of "waiting" that makes the paradox psychologically potent.
