prompt: |-
  I'd like you to act as a moral philosopher specializing in consequentialist ethics and rational choice, and to think carefully before answering — ideally sketching two or three candidate principles and testing each against my cases, rather than announcing the first one that seems to fit.

  Here is my problem. I've been recording my verdicts on cases where I don't know — and often can't know — the full consequences of the available actions, and I can't find the principle behind the pattern:

  - Between two charities that save similar lives per dollar, I'm comfortable picking on a whim; my ignorance of the small remaining differences doesn't paralyze me.
  - A bystander who shoves someone out of the path of a car did right, though nobody can trace what the saved life goes on to cause. I'd say the same about the trolley: five over one, full stop — even though I have no idea what either the five or the one will later do.
  - Whether to have a child, though: there I'm genuinely stuck. I can list weighty considerations on both sides, and I still can't compare them.
  - I think we were right to phase out leaded gasoline without being able to foresee the full cascade it would trigger, and I'd say a billionaire did right to fund basic research with a radically unforeseeable payoff rather than a certain, moderate good — yet I can offer no calculation there, only a story, and I half suspect the story is rationalization.
  - Finally, I believe my vote in a national election matters, even though nearly all of its effects are unknowable.

  Is there a single principle that captures when ignorance of consequences defeats a decision and when it doesn't? One thought I half have: in some cases the unknowable effects seem symmetric, in the sense that I have no reason to expect them to run one way rather than the other, so they can be set aside; in other cases I have specific, serious reasons pointing in opposite directions with no way to weigh them against each other, and there my confidence collapses. Does that split my cases correctly, and is it defensible rather than a mood? What does the resulting principle predict for a case I haven't listed: whether to tell a friend a hard truth that will reshape our relationship for decades? And please be honest about which of my verdicts, if any, the principle has to overturn.
reasoning: |-
  Okay, the user wants me to act as a moral philosopher specializing in consequentialism and rational choice. They've presented several cases where they make decisions despite uncertainty about consequences, and they're struggling to find a unifying principle. Let me start by understanding their examples.

  First, they're comfortable choosing between two similar charities on a whim. The key here is that the charities are almost identical in effectiveness, so the unknown differences are negligible. Then, in the bystander and trolley cases, they act despite not knowing the future outcomes of the saved lives. The uncertainty here is symmetrical—no reason to think the saved person will cause more harm or good. 

  But when it comes to having a child, they feel stuck because there are weighty pros and cons that can't be easily compared. The unknowns here are asymmetric; there are specific, significant risks and benefits pulling in opposite directions. 

  Phasing out leaded gasoline and funding basic research involve large-scale, unpredictable outcomes, yet they support those actions. The uncertainty is symmetrical because the potential for massive positive change outweighs the status quo, and there's no specific reason to expect net harm. 

  Voting matters despite unknowable effects because the impact, while tiny, is symmetrical in expectation when aligned with good policies. 

  Their proposed principle is about symmetry versus asymmetry in unknowns. I need to test this against their cases. Charity choice: the small unknowns are symmetric, so setting them aside makes sense. Bystander/trolley: the future impacts of individuals are also symmetric. Having a child: asymmetric unknowns like environmental impact vs. personal joy. Leaded gasoline and research: the unknowns are symmetric in the sense that the potential upside is vast and no specific downside is predicted. Voting: the ripple effects are symmetric. 

  But the user mentioned a new case: telling a friend a hard truth. Here, the unknowns might be asymmetric. The truth could lead to growth or resentment, with specific risks on both sides. If the principle holds, they should feel uncertain here, similar to the child decision. 

  I should also consider if any of their verdicts need overturning. Maybe the voting example? They believe their vote matters, but consequentialists often debate this due to minimal impact. However, the symmetry principle might justify it if the expected value is positive and symmetric. 

  Need to ensure the principle isn't just a mood. Justifying symmetry with expected value theory: if unknowns have neutral or canceling effects, they can be ignored. Asymmetric unknowns require explicit weighing, which might be impossible. 

  For the child case, the principle explains the paralysis because the asymmetries can't be quantified. Same with the hard truth—specific risks and benefits create asymmetry. 

  Possible objections: Is symmetry always discernible? In leaded gasoline, what if there were known risks? But historically, the harms were clear, and unknowns were about broader impacts, which were symmetric. 

  Overall, the principle seems robust. It captures most cases without overturning their judgments, except maybe prompting a rethink on voting's significance, but the symmetry argument supports their belief. Honesty about that is important. The user's insight about symmetry vs. asymmetry appears defensible and coherent.
answer: |-
  Your intuition about symmetry in expected effects is remarkably perceptive—it aligns closely with rigorous consequentialist frameworks. Let's systematize this by testing candidate principles against your cases, then refining the core idea. I'll evaluate three principles before proposing a unified one.

  ### Candidate Principles
  1.  **The Aggregated Neutrality Principle:** Ignore unknowable consequences when they *probably cancel out* across similar options or have *zero expected value* due to symmetry.
  2.  **The Asymmetric Burden Principle:** Uncertainty paralyzes only when there are *compelling, non-canceling reasons to expect significant net harm* that cannot be outweighed by foreseeable benefits.
  3.  **The Expected Value Heuristic:** Act when you can estimate *expected value* (probability × magnitude) for key outcomes, even crudely. Paralysis arises when opposing asymmetric risks/benefits defy such estimation.

  ---

  ### Testing Principles Against Your Cases
  | **Case** | **Your Verdict** | **Aggregated Neutrality** | **Asymmetric Burden** | **Expected Value Heuristic** |
  |----------|------------------|---------------------------|------------------------|-----------------------------|
  | **Charity choice** | Comfortable | ✅ Unknown differences likely net-neutral | ✅ No asymmetric risk | ✅ Expected value identical; whim is rational |
  | **Bystander/Trolley** | Act despite ignorance | ✅ Future acts of saved persons symmetric | ✅ Asymmetric harm *avoided* is certain & large | ✅ Clear expected value: 5 > 1 lives saved now |
  | **Having a child** | Stuck | ❌ Risks (climate, suffering) vs. benefits (joy, potential) are asymmetric | ✅ Strong opposing asymmetric risks | ❓ Can't compute EV; paralysis rational |
  | **Phase out leaded gas / Fund research** | Act despite ignorance | ✅ Unknowable effects symmetric (net neutral/positive) | ✅ Burden of proof on status quo (known harm) | ✅ High upside variance justifies action |
  | **Voting** | Matters | ✅ Ripple effects likely symmetric | ✅ Asymmetric risk of bad policies winning | ✅ Tiny chance × huge impact = non-zero EV |

  **Analysis:** 
  - **Aggregated Neutrality** fails the *child* case (asymmetry) and struggles with *voting* (tiny personal impact).
  - **Asymmetric Burden** fits most cases but is vague on *voting* (what counts as "compelling reason"?).
  - **Expected Value Heuristic** explains paralysis in the *child* case but oversimplifies *leaded gas* (we acted without EV calculations).

  ---

  ### The Unified Principle: **Symmetry-Adjusted Expected Value**
  > **Act when foreseeable consequences dominate or unknowables are symmetric. Paralysis is justified only when asymmetric unknowables create unquantifiable, high-stakes tradeoffs with no decisive baseline.**

  **Mechanism:**
  - **Symmetric unknowables** → treated as net-neutral noise (charities, bystander, leaded gas).
  - **Asymmetric unknowables** → require weighing if feasible (e.g., research: high upside vs. known cost).
  - **Intractable asymmetry** → paralysis when tradeoffs involve incommensurable values (having a child).

  **Why it works:**
  1. **Charities:** Residual uncertainties are symmetric → negligible noise.
  2. **Bystander/Trolley:** Future unknowables symmetric *relative to the immediate, certain harm averted*. Saving life is the moral baseline.
  3. **Leaded Gas/Research:** Known harms (lead poisoning) or low opportunity costs create a *decisive baseline*. Unknowns are symmetric "variance" around a net-positive expectation.
  4. **Voting:** Effects are symmetric *if* your vote aligns with better expected policies. The tiny chance of decisiveness × massive impact justifies action.
  5. **Having a Child:** Asymmetric unknowables (e.g., child's suffering vs. joy; carbon footprint vs. potential contributions) lack a baseline. Tradeoffs resist quantification → paralysis is rational.

  ---

  ### New Case: **Telling a Friend a Hard Truth**
  - **Principle Prediction:** Paralysis likely. 
  - **Why:** 
    - **Asymmetric unknowables:** Truth could cause lasting resentment (harm) *or* deepen trust (benefit). 
    - **No symmetry:** No neutral outcome; effects depend on unpredictable factors (friend's resilience, your delivery).
    - **Unquantifiable stakes:** Relationship value vs. honesty defy EV calculation.
  - **Contrast with Trolley:** Here, no "certain harm averted" baseline (unless deception is actively harmful). The burden of proof isn't decisively on silence or speech.

  ---

  ### Honest Tensions with Your Verdicts
  - **Voting:** The principle *supports* your view but exposes a vulnerability. If your preferred policy's *net effect* is truly ambiguous (e.g., two moderate candidates), symmetry collapses → voting may become irrational. Your intuition assumes policy alignment justifies symmetry.
  - **Billionaire's Research Funding:** The principle agrees but notes: if the "moderate good" addressed *urgent, asymmetric suffering* (e.g., famine relief), funding research might be harder to defend. Your verdict holds if the alternative lacks overwhelming asymmetric urgency.

  **Conclusion:** Your symmetry insight is defensible—not a mood. It synthesizes consequentialism with epistemic humility. When unknowns *could* systematically favor one option but resist quantification, rational paralysis emerges. Elsewhere, symmetry allows action under uncertainty. For the hard truth case, expect discomfort: the principle predicts your struggle, mirroring the child dilemma.

  > *"We sail a vast ocean of uncertainty; symmetry is our compass when the stars are hidden."* — Adapted from decision-theoretic traditions.
