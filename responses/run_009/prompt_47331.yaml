prompt: |-
  i'm a grad student working on philosophy of probability and something keeps bugging me about the objective chance literature. everyone argues best-system humeanism vs propensities as if we all agree on what a theory of chance is even supposed to DO, and i dont think we do. so before i commit to a dissertation topic i want the spec written down.

  write the list of desiderata any adequate theory of objective chance has to meet. the ones i can think of, at least -- you add whatever i'm missing:

  - it has to tell rational agents how to set their credences given the chances (the deference idea, the thing lewis called the principal principle). but note the hard part here is admissibility: deference is supposed to hold even when you know other stuff, except for "inadmissible" evidence, and the obvious definition of inadmissible ("evidence that would rationally change your credence despite knowing the chance") is circular. so if you count this as a desideratum, count it in a form that isnt trivially satisfiable by definition.
  - chance has to underwrite the connection to frequencies -- long runs of coin flips, insurance tables, that stuff. does it have to explain why frequencies track chances, or just permit it? decide and say why.
  - it has to say something about chances in deterministic settings. classical statistical mechanics gives us probabilities that look for all the world like chances, and there are deterministic interpretations of quantum theory too. is "allows nontrivial single-case chances in a deterministic world" a genuine requirement or a confusion -- and if it's a requirement, which camp gets to fail it?
  - it owes us an explanation of why deference is rational at all, not just the assertion that it is. (this one might be doing a lot of work, tell me if so)

  for each requirement: the case or consideration behind it, whether it's non-negotiable or just a preference one camp elevated into a principle, and -- this is the part i actually want -- flag any subset you suspect can't be jointly satisfied. i have a feeling there's one here, something like: if chances supervene on how the whole history of the world goes (including future stuff, as on humean views), then evidence about the future should change your credence about current chances, which fights with unconditional deference. if that tension is real, say so plainly, that's a result about the list itself, not just about the theories.

  last thing: tell me which single requirement knocks out the most contenders if you take it seriously. my hunch is it's the explanation-of-deference one, but argue it either way. no scorecard against named theories, i'll do that myself -- i just want the requirements, clearly motivated, with the tension flagged. and keep it usable for someone like me: the theory is supposed to earn its keep in statistical mechanics and quantum contexts, not just in the seminar room. sorry for the rambling, its late here.
reasoning: |-
  Okay, the user is a grad student in philosophy of probability. They're frustrated because the literature seems stuck in a debate between Humean best-system accounts and propensities, without clarifying what a theory of chance should actually do. They want a clear list of desiderata for any adequate theory of objective chance, with motivations, tensions, and which requirements are non-negotiable.

  First, I need to recall the standard desiderata from Lewis and others. The Principal Principle is crucial—it connects chance to rational credence. But admissibility is tricky. Defining inadmissible evidence as what rationally changes credence despite knowing the chance is circular. So the desideratum should be that the theory provides a non-circular criterion for admissibility.

  Next, frequency connection. Chances should relate to frequencies. The question is whether the theory must explain why frequencies tend to match chances or just permit it. Explanation seems necessary; otherwise, it's too weak. This is non-negotiable because even in insurance or physics, we rely on this link.

  Deterministic chances. Classical stat mech gives probabilities in deterministic systems. Should a theory allow non-trivial single-case chances here? Yes, because otherwise it dismisses useful scientific practices. Propensity theories might struggle here if they tie chance to indeterminism.

  Explaining deference. Why should rational agents defer to chances? The theory should ground this norm, not just assert it. This might be the killer requirement because many theories take deference as a primitive norm without explaining its rationality.

  The user mentioned a tension: if chances depend on the future (like in Humeanism), then future evidence affects current chances, conflicting with unconditional deference. That's a real issue—Humean chance values can change over time, so deference needs to be conditional on the complete theory.

  Other desiderata? Chance-credence coherence: chances should be probabilities. Also, temporal asymmetry: chances are future-directed. Scientific role: chances explain and predict frequencies. These are important but maybe less contentious.

  Tensions: The big one is between Humean supervenience (including future events) and the Principal Principle. If chances depend on the future, knowing future outcomes changes the chance, making deference messy. Also, explaining deference is tough for Humeans because chances are summaries, not guides. Propensities might explain deference but struggle with deterministic chances.

  Which desideratum knocks out the most? Explaining deference. Humeans might say it's just a conceptual truth, but that's not an explanation. Propensities might lack a clear ontology. Non-reductive theories avoid this but face other issues. This requirement forces a deep justification, which many theories skip.

  I should also consider the user's deeper needs. They want a framework to evaluate theories beyond the current debate. Highlighting tensions shows where new work is needed. They might be looking for a dissertation topic that addresses these gaps, like refining admissibility or exploring deference in deterministic settings. Emphasize practical applications in stat mech and QM to keep it grounded.
answer: |-
  Here's a distilled, rigorously motivated list of desiderata for a theory of objective chance, designed to clarify the "spec" and expose tensions. I've structured each item with: **Motivation**, **Non-Negotiability**, **Tension Flags**, and added critical desiderata you hinted at but didn't explicitly list. The key tensions are real and significant.

  ---

  ### **Core Desiderata for a Theory of Objective Chance**

  1.  **The Deference Constraint (Non-Circular Principal Principle):**
      *   **Motivation:** Chances must *guide rational action and belief*. If you know the chance of E is x, and possess no "undercutting" information, your credence in E should be x (Lewis's PP). The **hard problem** is defining "undercutting" (inadmissible) evidence *non-circularly*. A theory must specify what makes evidence inadmissible (e.g., its logical form, its temporal relation to E, its ontological status) *without* appealing to the rational credence-setting role of chance itself.
      *   **Non-Negotiability:** High. Without this, chance loses its core normative role in epistemology and decision theory. It's the primary reason we *care* about chance.
      *   **Tension Flags:** **Severe tension with Humeanism.** If chances supervene on the *entire* history (past and future), then information about the future *directly bears on the true chance value now*. This makes *all* future information prima facie admissible *now*, potentially collapsing the PP into triviality ("credence should match the chance, which is whatever makes the whole history likely"). Humeans need a non-trivial account of *temporary* chances and admissibility tied to time.

  2.  **The Frequency Connection (Explanatory Constraint):**
      *   **Motivation:** Chances aren't just numbers; they must *explain* (not just permit) the observed stability of relative frequencies in repeated trials under sufficiently similar conditions (coin flips, radioactive decay, mortality tables). Science relies on this explanatory link. A theory should explain *why* we expect frequencies to approximate chances in the long run (e.g., via a Law of Large Numbers), and why deviations are surprising.
      *   **Non-Negotiability:** High. A theory failing this loses empirical grounding. "Permitting" frequencies isn't enough – many functions "permit" frequencies without being chances.
      *   **Tension Flags:** Tension with **non-Humean accounts lacking robust frequentist convergence guarantees**. Some propensity views might struggle to rigorously ground the LLN connection without smuggling in Humean elements. Also, potential tension with **single-case chances** – can a theory satisfying this still make sense of chance for genuinely unique, non-repeatable events?

  3.  **Compatibility with Determinism (Non-Trivial Deterministic Chances):**
      *   **Motivation:** Science demonstrably uses objective probability successfully in putatively deterministic frameworks (classical statistical mechanics, deterministic QM interpretations like Bohmian mechanics, chaotic systems). Dismissing these as "not real chances" is scientifically revisionist and ignores a core use-case. A theory should allow non-trivial (0 < P(E) < 1) chances even if the fundamental laws are deterministic.
      *   **Non-Negotiability:** High for a theory aspiring to capture scientific practice. Denying this is an option (e.g., for some propensity theorists), but it concedes a major domain to rivals or leaves it unexplained.
      *   **Tension Flags:** **Knocks out standard propensity theories** that define propensities as irreducible tendencies inherent in *indeterministic* causal processes. Humean BSA generally satisfies this. The tension is *between camps*: propensity views often *must* fail this to maintain their core identity, while Humean views embrace it.

  4.  **The Rationale for Deference (Explanatory Grounding):**
      *   **Motivation:** Why *should* rational agents defer to chances? This demands more than asserting the PP as a conceptual truth. A theory must provide a *reason* why aligning credence with chance is rational. Is it because chances are ontologically fundamental guides to the future? Because they summarize optimal predictive information? Because they are lawlike? Without this, deference feels arbitrary or dogmatic.
      *   **Non-Negotiability:** Crucial for theoretical depth. While the PP might be taken as primitive, a satisfying theory explains *why* it holds.
      *   **Tension Flags:** **The biggest potential killer.** Humean BSA struggles: if chances are just summaries of patterns (past *and* future), why defer *now* to a summary that can be overturned by future events? Propensity views have the opposite problem: if chances are fundamental causal tendencies, why *should* rational agents care about them? What justifies the normative link? **This desideratum exposes a deep gap in *all* major theories.** It demands an account linking the metaphysics of chance to the epistemology of rationality.

  5.  **Chance-Credence Coherence (Formal Constraint):**
      *   **Motivation:** Chances themselves must obey the probability axioms (non-negativity, normalization, additivity). This is necessary for them to coherently guide credences (which also obey these axioms) via the PP and for them to fit into standard scientific models.
      *   **Non-Negotiability:** Non-negotiable. A non-probabilistic "chance" is incoherent for its primary role.
      *   **Tension Flags:** Generally uncontroversial and satisfied by major theories. Potential minor tension with views where chance values are fundamentally vague or context-dependent, but these usually aim to recover coherence within contexts.

  6.  **Temporal Asymmetry (The Arrow of Chance):**
      *   **Motivation:** Chances are inherently future-directed. The chance *now* of a past event is typically 0 or 1 (barring extreme skepticism). A theory should explain this temporal directionality – why chances concern the open future, not the fixed past. This connects to the asymmetry of explanation and evidence.
      *   **Non-Negotiability:** High. A theory making past events genuinely chancy (non-0/1) conflicts with how we use and understand chance.
      *   **Tension Flags:** Humean BSA derives this from the temporal asymmetry of macro-patterns in the universe. Propensity views often build it in via causal directionality. Significant tension arises if a theory's base ontology lacks temporal asymmetry (e.g., some block universe views), requiring it to be emergent.

  7.  **Scientific Role (Explanatory & Predictive Power):**
      *   **Motivation:** Chances earn their keep in science (SM, QM, bio, econ) by providing the best explanations of irreversible processes, fluctuations, decay rates, stable frequencies, and by enabling robust predictions where deterministic prediction is impossible. A theory should show how chances play this indispensable role.
      *   **Non-Negotiability:** High. A theory failing this is irrelevant to the primary context where "objective chance" matters.
      *   **Tension Flags:** Tension with views that make chances *too* epistemic or *too* detached from actual patterns (e.g., some simplistic propensity views might struggle with the explanatory breadth of Humean chances in complex sciences like SM).

  ---

  ### **Key Tensions & Which Desideratum is the Toughest**

  1.  **The Central Tension (Humean Futurity vs. Deference):** Your intuition is correct. **This is the most significant tension inherent in the list.** If chances supervene holistically on the entire space-time pattern (Humeanism), then:
      *   The chance *at time t* of an event *at t* is not a stable, locally accessible fact; it depends on the future.
      *   Therefore, learning about the future *directly changes the truth value* of chance statements about the present/past.
      *   This directly threatens the non-circular PP (Desideratum 1). If future evidence F is relevant to the true chance C at t, then F seems *admissible* for setting credence about events at t, even when you know C? This makes unconditional deference incoherent. Humeans need complex fixes (e.g., "PP2" conditional on the entire chance theory + history up to t).
      *   It also strains the Rationale for Deference (Desideratum 4): Why defer *now* to C_t if C_t is partly constituted by future events unknown to you? It feels like deferring to a summary that includes the answer.

  2.  **The Toughest Desideratum: Explanatory Grounding for Deference (Desideratum 4)**
      *   **Why it knocks out the most contenders:** While other desiderata often rule out specific *types* of theories (e.g., Determinism rules out some Propensities; Formal Coherence is table stakes), Desideratum 4 exposes a foundational weakness in *all* major approaches if taken seriously:
          *   **Humeanism (BSA):** "Defer because chances are the *best summary* of the entire pattern (past *and* future) for predictive purposes." *Problem:* Why is deferring to this holistic summary *rational* for an agent *now* who lacks future information? How does summarizing the future rationalize *predicting* it? This risks conflating description with justification. The rationale feels instrumental ("it works") rather than deeply explanatory *of the norm*.
          *   **Propensities:** "Defer because chances *are* fundamental tendencies that *make* outcomes likely." *Problem:* Why *should* rational agents care about these metaphysical tendencies? What epistemic principle links irreducible causal powers to rational credence? Without this, it's a brute assertion. It also struggles with deterministic chances (Desideratum 3).
          *   **Primitivism (Chance as Fundamental Law):** "Defer because it's a fundamental law that rational credence matches chance." *Problem:* This explicitly avoids explaining *why* it's rational. It posits the norm as brute.
      *   **Result:** Taking this desideratum seriously forces the theory to bridge the metaphysical nature of chance with the epistemology of rationality in a non-ad-hoc way. Most existing theories either hand-wave this (Propensity), offer a potentially circular or instrumental rationale (Humean), or simply take it as primitive. **This is the most fertile ground for original dissertation work.** Can a theory provide a genuinely satisfying answer? (e.g., linking chance to fundamental information constraints, robust causation, or a teleological account of agency?).

  ---

  ### **Usable Summary for Your Work**

  This list provides a robust framework to evaluate theories. Focus your dissertation on dissecting how contenders handle:

  1.  **The Deference/Admissibility Problem** (especially the Humean Futurity Tension).
  2.  **The Rationale for Deference** (the major unsolved problem exposing weaknesses everywhere).
  3.  **Deterministic Scientific Practice** (a key battleground between Humean and Propensity views).

  The most promising path might involve rigorously formalizing the tensions (especially Humean futurity vs. PP) or developing a novel account that directly tackles the rationale for deference while respecting scientific practice (including deterministic chances). Good luck – this is core philosophy of science territory!
