prompt: |-
  I'm on the steering committee for my university's library systems overhaul, and next month we have to vote on whether to cancel the thing. Quick background: six years ago we decided to replace our ancient catalogue platform with a system built in-house rather than buy off-the-shelf. Original budget £1.8m, we're now at £8.6m and roughly 60% done, with each phase having revealed new integration problems. There's a proposal to pull the plug and license a commercial system, and another to fund the two remaining phases (~£1.5m more).

  The committee is split in a weird way and I have to write the memo everyone circulates before the vote. Most of the "cancel" side just chants sunk costs are sunk, which is easy. But our deputy librarian, who's the smartest person in the room and actually wants to cancel, keeps arguing the opposite direction on the way there: she says our situation is structurally a dollar auction — remember the game where a $1 bill is auctioned and the second-highest bidder also has to pay their bid? Her point is that in-house build vs. buy was never a fresh choice, it's an escalating bidding war with our own past decisions, and the runner-up pays everything and gets nothing — so if we frame it as "we've come too far to stop now" we'll keep bidding, but if we frame it as pure sunk costs we might ignore the real question, which is whether finishing has higher expected value than switching *now that either way we absorb the £8.6m*. She thinks it doesn't, partly because the commercial vendors can smell our desperation and their licensing quotes went up after news of our delays leaked.

  So the memo needs a clear recommendation (cancel, or fund the last phases, or something with conditions), and it has to do justice to her auction framing — where the analogy genuinely fits, where it breaks down (e.g., the prize isn't a fixed dollar here; the value of a finished system may decay the longer we take), and why the recommendation follows. Please don't just side with whichever view sounds like the textbook fallacy. Keep it short enough that my colleagues will actually read it, maybe 800 words.
reasoning: |-
  Okay, the user is on a university library steering committee facing a critical vote about whether to cancel an over-budget in-house system build or continue funding it. They need to draft a memo that presents a clear recommendation while addressing a sophisticated "dollar auction" analogy raised by their deputy librarian. 

  First, let's unpack the deputy librarian's argument because it's the intellectual core here. She's saying the sunk cost fallacy is actually a red herring - the real trap is a dollar auction dynamic where continuing feels necessary precisely because so much has been invested, creating a self-reinforcing cycle of bad decisions. That's brilliant framing. The user clearly respects this colleague's insight, so the memo must engage with it seriously, not just pay lip service.

  Hmm... where does this analogy hold? Well, like in a dollar auction:
  - The university is already "bid" £8.6m without getting the prize (working system)
  - Stopping now means total loss of investment with nothing to show
  - Continuing feels like the only way to justify past spending
  - Competitors (vendors) are exploiting their desperation

  But key differences matter too:
  - The "prize" isn't fixed-value $1 - a delayed system loses value as tech evolves
  - There are alternatives (commercial systems) unlike a true auction
  - The costs aren't just monetary - there's opportunity cost and staff morale

  The user's hidden needs emerge between lines:
  - They want the memo to prevent emotional decision-making
  - Need to legitimize canceling without making colleagues feel foolish for past votes
  - Must reframe "cutting losses" as strategic rather than defeatist
  - Has to disarm the "we've come too far" rhetoric effectively

  For structure... start by validating the auction insight to honor the deputy librarian's contribution, then dissect where it diverges from reality. The recommendation should flow from that analysis. Emphasize that £8.6m is gone regardless - the only question is future value. Vendor price gouging is a concrete symptom of the auction dynamic they're trapped in.

  Commercial licensing quotes rising due to their desperation... that's such a damning detail. It perfectly illustrates the auction trap. Including that in the memo makes the theory tangible.

  Final recommendation must be unambiguous: cancel and switch to commercial. But cushion it with "transition support" to acknowledge past efforts. The conditional approval for last-phase funding feels like a trap - it's exactly the "one more bid" mentality the deputy warned against.

  Word count is tight. Need brutal editing to stay under 800 while keeping the auction explanation crisp. Prioritize:
  1. Core analogy breakdown
  2. Vendor exploitation evidence
  3. Decaying value of delayed system
  4. Recommendation with transition plan

  The tone should be analytical but urgent - no academic jargon. These are exhausted committee members who've sat through years of this mess. They need clarity, not theory.
answer: |-
  ## Steering Committee Recommendation: Library Systems Overhaul

  **To:** Library Systems Steering Committee  
  **From:** [Your Name/Position]  
  **Date:** [Date]  
  **Subject:** Recommendation on Library System Overhaul Project & Vote  

  Our critical vote requires confronting a profound dilemma: continue funding our overrun in-house build or pivot to a commercial solution. While "sunk costs are sunk" is valid, Deputy Librarian [Name]'s "Dollar Auction" framing demands deeper analysis. This memo examines her analogy, its applicability, and recommends a clear path forward.

  ### The Dollar Auction Analogy: Where It Fits
  In a dollar auction, two bidders compete for a $1 prize. The *second-highest* bidder also pays their bid but receives nothing. Rationality evaporates as players escalate bids beyond the prize's value to avoid total loss.  

  This mirrors our situation chillingly well:  
  1.  **Escalating Commitment:** Each phase approval was a "bid," justified by prior investment ("We’ve spent £X, we *must* finish").  
  2.  **Losing Bidder Pays:** If we cancel *now*, we pay the £8.6m "bid" and get no operational system – the "losing bidder" outcome.  
  3.  **Forced Competition:** Our "opponent" is our own past decisions, trapping us in a cycle where stopping feels catastrophic, but continuing demands ever-higher bids (£1.5m+ now, likely more later).  
  4.  **Vendor Exploitation:** As [Deputy Librarian] notes, commercial vendors, aware of our distress, have inflated quotes – a direct consequence of perceived desperation akin to auction dynamics.  

  ### Where the Analogy Breaks Down (Critically)
  1.  **The Prize Isn’t Fixed:** The value of a *completed* in-house system isn't $1. It diminishes with every delay due to:  
      *   **Technical Obsolescence:** Core components chosen 4-6 years ago may already be outdated.  
      *   **Opportunity Cost:** Continued resource drain prevents investment in modern services (e.g., AI-driven discovery, enhanced digital collections).  
      *   **Morale & Expertise:** Protracted failure erodes staff morale and diverts talent from core library missions.  
  2.  **Alternatives Exist (Unlike a True Auction):** We *can* walk away and still get a functional system – by licensing a commercial product. We aren't left empty-handed.  
  3.  **Future Costs Are Uncertain (Likely Higher):** True auctions have defined bid increments. Our "next bid" (£1.5m+) is merely an *estimate*. Given the 60% completion after £8.6m (vs. £1.8m budget) and persistent "new integration problems," significant further overruns are probable, if not inevitable. The auction hasn't ended.  

  ### The Core Question Reframed
  Given the £8.6m is irrevocably sunk:  
  *   **Option A (Finish):** What is the *expected total cost* (current £1.5m + high probability overrun) and *timeline* to achieve a functional system? What is its *expected value* upon delivery (considering decay)?  
  *   **Option B (Switch):** What is the *total cost* (license + implementation + data migration + vendor lock-in) and *timeline* to achieve a functional system? What is its *expected value*?  

  ### Analysis & Recommendation

  *   **Expected Value of Finishing (Option A):** Low and High Risk.  
      *   Cost: £1.5m (optimistic) + high probability of ≥£2m+ overrun = **Likely ≥£10m+ total.** Timeline: Minimum 2+ years (history suggests longer).  
      *   Value: A system built on aging specs, facing integration debt, delivered late into a changed technological landscape. High risk of underperformance or needing near-term replacement.  
  *   **Expected Value of Switching (Option B):** Higher Certainty, Faster Value.  
      *   Cost: Vendor premium is real, but commercial systems (even at inflated £1m-£1.8m license + £0.5m-£1m implementation/migration) = **Likely £2m-£3m total new spend.** Timeline: 12-18 months to go-live.  
      *   Value: A modern, supported, feature-rich system. Faster access to innovations. Regained focus for library staff.  

  **The "Auction" Insight is Decisive:** Continuing is placing another escalating bid (£1.5m+) on a prize (the finished in-house system) whose **value is rapidly decaying below the likely final bid price**. Vendors raising prices confirms we are *in* the trap. The rational bidder in a dollar auction quits *before* total losses exceed the prize value. We passed that point long ago.  

  **Recommendation: Cancel the In-House Build & Move to a Commercial Solution**  

  *   **Why:**  
      1.  **Minimizes *Future* Loss:** Throwing good money after bad. The £1.5m+ is a *new* investment with poor expected ROI compared to alternatives.  
      2.  **Arrests the Auction:** Stops the cycle of escalating commitment and vendor exploitation.  
      3.  **Faster Value Delivery:** Gets a functional, modern system to users and staff sooner.  
      4.  **Mitigates Risk:** Shifts technical risk and maintenance burden to an experienced vendor.  
      5.  **Focuses Resources:** Frees capital and talent for core library priorities.  

  *   **Critical Next Steps (Conditional on Cancellation):**  
      1.  **Negotiate from Strength (Mask Desperation):** Frame the pivot as a strategic shift, not a distress sale. Leverage competitive bids.  
      2.  **Salvage Value:** Mandate the project team document all usable code, data models, and lessons learned for potential integration or future leverage.  
      3.  **Transparent Post-Mortem:** Commission an independent review to understand failure points and prevent recurrence.  
      4.  **Staff Transition Plan:** Support and redeploy internal technical staff affected.  

  **The £8.6m is gone. Our choice is not about justifying it, but about where we direct our *next* investment. Continuing the in-house build is placing a bad bet in a rigged game. Switching to a commercial system, despite imperfect vendor dynamics, offers a faster, lower-risk, higher-value path to delivering the modern library services our university needs. I urge the committee to vote to cancel the current project and initiate a commercial procurement.**
