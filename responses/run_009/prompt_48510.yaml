prompt: |-
  I'm writing a term paper on theories of distributive justice, and there is something I cannot make sense of. Amartya Sen's Tanner lecture "Equality of What?" (1979) appears to have settled the debate about the metric of egalitarian concern: it shows that welfare is the wrong space, because people in chronically deprived circumstances adjust their expectations downward and end up reporting that they are content; it shows that resources are the wrong space too, because the same bundle of goods converts into very different lives for someone who is ill or disabled and someone who is healthy; and it then supplies capabilities as the correct and complete metric of equality. If capabilities really settle the question, the debate should have ended there — Rawlsians should have dropped primary goods, and welfare economists should have switched over. Yet more than forty years on, philosophers still argue over resources versus welfare versus capabilities as though the lecture had never happened. Is the resistance just disciplinary inertia, or economists protecting the measurability of the quantities they like? Or is there some technical obstacle to putting capabilities into a single index that I haven't come across? For the term paper, I would also like to know what the strongest surviving objection to the capability metric is, so that I can present the other side fairly. Please write your answer in American English.
reasoning: |-
  Okay, the user is working on a term paper about distributive justice theories and is confused about why Amartya Sen's 1979 lecture "Equality of What?" didn't settle the debate. They note that Sen critiqued welfare and resources, proposed capabilities as the solution, yet philosophers still debate all three metrics. They're wondering if it's just inertia, economists clinging to measurability, or some technical issue with capabilities. They also want the strongest surviving objection to capabilities for their paper.

  I recall that Sen argued that welfare fails because of adaptive preferences (people adjusting expectations downward) and resources fail due to differential conversion (same goods mean different things for disabled vs. healthy people). His solution was capabilities—what people can do and be. The user is puzzled why this didn't end the debate.

  The user is likely a student in political philosophy or economics, writing a term paper. Their explicit need is to understand the resistance to capabilities and find a strong objection for their paper. But deeper, they might want to show critical thinking by not just accepting Sen's view as dominant. They could be seeking a balanced analysis to impress their professor, or grappling with why theoretical debates persist despite seemingly decisive arguments. Their frustration suggests they value intellectual progress and are annoyed by apparent stagnation.

  Now, why didn't capabilities end the debate? It's not just inertia or measurability. Philosophers like Rawlsians and welfare economists have substantive counterarguments. Rawls argued primary goods are necessary for his theory of justice, which is about fairness in social cooperation, not just outcomes. He thought capabilities could be too vague. Welfare economists point out that capabilities lack a clear measurement system, unlike utility, which can use money or surveys. Also, capability theory often ignores preference satisfaction, which some see as essential to well-being. There's also the indexing problem: how to rank capabilities without being subjective or paternalistic.

  For the strongest objection, I think the indexing problem is key—it's practical and philosophical. Martha Nussbaum tried to list capabilities, but critics say any list is arbitrary. For the term paper, the user should present this clearly. They might also mention that Rawlsians emphasize procedural fairness over outcomes.

  I should structure the response to confirm Sen's contributions, explain the ongoing debates with reasons, and highlight the indexing objection. Emphasize that it's not about resistance but genuine philosophical disagreements. Use American English, as requested, and keep it academic but accessible.
answer: |-
  Here's a breakdown of why Sen's critique was transformative but didn't "end the debate," the nature of the ongoing arguments, and the strongest surviving objections to the capability approach – essential for presenting a balanced term paper:

  ### Why Sen's Critique Was Transformative (But Not Definitive)
  1.  **Devastating Critique:** Sen's arguments against both welfare (adaptive preferences) and resources (differential conversion) are widely accepted as *powerful and largely correct*. They exposed fundamental flaws in relying solely on either metric. No serious theorist today ignores these problems.
  2.  **Foundational Shift:** Sen fundamentally shifted the debate *away* from the simplistic "resources vs. welfare" dichotomy. He established that **what matters is what people can actually *do* and *be*** – their real freedoms and opportunities. The capability space became a mandatory reference point.
  3.  **Not a Complete Settlement:** The lecture wasn't meant to provide a single, finished, operationalizable theory of justice. It brilliantly identified the *space* (capabilities) but left many crucial questions open, which became the new battleground. Resistance isn't just inertia; it's substantive engagement with the complexities Sen revealed.

  ### Why the Debate Continues: Substantive Reasons, Not Just Inertia
  1.  **Rawlsians (Primary Goods) - The "Social Cooperation" & "Fair Procedure" Defense:**
      *   **Focus on Fair Shares, Not Outcomes:** Rawlsians argue justice is primarily about distributing the *means* (primary goods) citizens need to be free and equal participants in social cooperation and pursue their own conceptions of the good. It's about ensuring a *fair starting point* and *procedural fairness* within basic institutions.
      *   **Responsibility & Agency:** They contend that focusing *directly* on capabilities/functionings risks neglecting individual responsibility. People should use their fair share of primary goods responsibly; the state shouldn't constantly compensate for all differential outcomes stemming from personal choices or expensive tastes developed after the initial fair distribution. Capability metrics can blur this line.
      *   **Tractability & Avoidance of Paternalism:** Primary goods are argued to be more objective, measurable, and less intrusive to assess than capabilities. Defining and measuring a person's full set of capabilities can involve deep judgments about their life that some see as paternalistic. Primary goods aim for a baseline enabling freedom, leaving outcomes more to individual agency.
      *   **Rawls's Own View:** Rawls himself responded to Sen, acknowledging the conversion problem but arguing primary goods were the appropriate metric for his *political* conception of justice focused on citizens' *moral powers* (sense of justice, capacity for a conception of the good) within a well-ordered society. He saw capabilities as relevant to policy *implementation* once basic justice was established via primary goods.

  2.  **Welfare Economists/Utilitarians (Welfare) - The "Subjective Experience" & "Aggregation" Defense:**
      *   **What Ultimately Matters?** They maintain that subjective well-being (happiness, satisfaction, preference fulfillment) is the ultimate *telos* of justice. Even if adaptive preferences exist, they argue it's controversial to override an individual's *felt* experience of satisfaction. If someone *genuinely* feels content with less, why force more upon them? Respecting autonomy includes respecting their subjective state.
      *   **Adaptive Preferences Aren't Always Bad:** Some argue adaptive preferences can be psychologically beneficial coping mechanisms. Forcing constant comparison or unattainable aspirations might decrease well-being.
      *   **Measurement & Aggregation:** Welfare (especially modern variants like happiness economics) claims superior measurability and aggregability for policy purposes. While imperfect, utility (via revealed preference, surveys, etc.) offers a common currency. Capabilities lack this single index (see below).
      *   **Capabilities as Means, Not Ends:** They often view capabilities instrumentally – valuable *because* they (usually) lead to increased welfare. Welfare remains the ultimate good.

  3.  **Capability Approach Advocates (Internal Debates & Challenges):**
      *   **The Indexing Problem (The Biggest Technical/Practical Obstacle):** This is **the** major operational hurdle you asked about. Sen deliberately avoided providing a definitive list or weighting scheme for capabilities. He emphasized the need for public reasoning. Critics argue:
          *   **Incompleteness:** Without a specific index, how do we compare situations, prioritize policies, or make trade-offs? Is being well-nourished more important than being literate? How much more?
          *   **Subjectivity/Arbitrariness:** Any attempt to create an index (like Nussbaum's list) seems unavoidably value-laden, culturally specific, or even paternalistic. Who decides?
          *   **Aggregation:** How do we aggregate different individuals' capability sets into a social evaluation? Maximin? Sum? This requires value judgments the approach itself doesn't resolve.
      *   **Scope:** What capabilities matter? Only the most basic? All possible human functionings? Where is the line drawn?
      *   **"Capability" vs. "Functioning":** Should justice focus on guaranteeing opportunities (capabilities) or ensuring actual achievements (functionings)? Sen emphasized capabilities (freedom), but policy often pushes towards functionings (e.g., compulsory education).

  ### The Strongest Surviving Objection (For Your Term Paper)
  **The Indexing Problem/Objection is arguably the most potent *practical* and *theoretical* challenge:**

  *   **Core of the Objection:** The capability approach, while correctly identifying the relevant space (freedoms to achieve functionings), lacks a theoretically rigorous, non-arbitrary, and practically applicable method for **identifying a specific set of core capabilities, weighting their relative importance, and aggregating them across individuals to make comparative judgments of justice or guide specific policy choices.** This renders it incomplete as a *complete* theory of distributive justice for implementation.
  *   **Why it's strong:**
      1.  **Hits at Practicality:** Justice theories need to inform real decisions about resource allocation, policy priorities, and trade-offs. Without an index, the capability approach struggles here compared to (flawed but operational) metrics like income or utility.
      2.  **Highlights Value Pluralism:** It exposes the deep problem of plural and potentially conflicting values inherent in defining the "good life." Any proposed list or weighting scheme (like Nussbaum's) inevitably reflects specific philosophical commitments and risks imposing values.
      3.  **Connects to Paternalism:** Deciding *for* people which capabilities matter most can be seen as undermining the very agency and freedom the approach seeks to promote.
      4.  **Fuels Counterarguments:** Rawlsians argue primary goods *do* provide a workable, objective(ish) index focused on citizenship. Welfare economists argue utility provides a common denominator.
  *   **Capability Response:** Advocates acknowledge the challenge but see it as a strength, forcing democratic deliberation and context-specific reasoning rather than imposing a single formula. Sen argues that incomplete specification is preferable to being precisely wrong (like relying solely on resources or welfare). They focus on identifying clear "capability deprivations" (e.g., starvation, lack of basic healthcare) where the moral imperative is clear even without a full index.

  ### Conclusion for Your Paper
  Sen's "Equality of What?" wasn't ignored; it revolutionized the field by exposing fatal flaws in the dominant paradigms and establishing capabilities as the essential *space* for egalitarian concern. The debate didn't end because Sen brilliantly uncovered deeper complexities: **How do we define, measure, and prioritize capabilities? How do we balance opportunity with outcome, freedom with responsibility, and plural values? How do we operationalize justice in this space?** The continuing arguments between proponents of resources (emphasizing fair procedures and responsibility), welfare (emphasizing subjective experience and aggregation), and capabilities (emphasizing real freedom) represent substantive disagreements about the nature of freedom, responsibility, well-being, and the practical demands of justice, not mere inertia. When presenting the "other side," the indexing problem provides the most robust and enduring critique, highlighting the approach's practical and philosophical challenges in moving from a powerful insight to a fully specified theory of distributive justice.
