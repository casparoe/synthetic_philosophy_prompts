  First, I need to understand their perspective. They've been discussing this for a year, so they're familiar with Russell/Prior, Dummett, Wittgenstein, and the formal-systems view. Their working hypothesis is that the core disagreement is about what "justification" means—propositions vs. rules/practices. They also mention the possibility that the split is about whether meaning precedes rules or is constituted by them. They want to know if that's the real fault line, and what would count as progress.

  The user seems frustrated with the circular debates. They might be looking for a fresh angle or a synthesis that moves beyond the usual arguments. Their mention of "two questions run under a single heading" suggests they suspect conflation of issues. They also want honesty about whether progress is possible or if it's just inherently thorny.

  I recall that Carroll's tortoise exposes a regress when trying to justify inference rules. The camps each have their take: 
  - Russell/Prior see it as confusing rules with premises. 
  - Dummett accepts circularity but argues it's benign via meaning-based justification. 
  - Wittgensteinians focus on practice over propositions. 
  - Formalists call it a category error.

  The user’s hypothesis about "justification" seems spot-on. The deeper divide might indeed be about meta-philosophical commitments: what counts as justification? Some camps demand propositional grounding (leading to regress), while others accept practical or constitutive explanations. The meaning/rules relationship is key here—if rules define meaning, justification shifts from "correctness" to internal coherence.

  On progress: Distinctions might help, but formal results alone won't resolve meta-disagreements. Maybe highlighting the pragmatic stakes (e.g., what hangs on accepting one view over another?) could reframe the debate. The user might appreciate acknowledging that some standoffs are foundational and that clarity about commitments is the real win.

