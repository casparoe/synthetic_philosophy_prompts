answer: |-
  Here is the five-point argument draft in British English, meeting all specified requirements:

  1.  Lewis’s triviality proofs demonstrate that *any* candidate proposition for the indicative conditional leads to absurdity (e.g., forcing the conditional probability P(B|A) to equal the unconditional probability P(B)) if the Equation (Prob(if A, B) = P(B|A)) holds universally; this forces a dilemma: reject the Equation entirely or accept that no proposition *can* play the required role, as the result is general, not merely problematic for specific analyses.
  2.  The conditional-assertion view provides a natural explanation for why we evaluate "if A, B" by hypothetically adding A and assessing B: this *is* the act of asserting B under the supposition A, directly mirroring the cognitive procedure described by the Equation, without requiring a proposition whose probability could be measured.
  3.  Concerning negation and conjunction: to deny "if A, B" ("It’s not the case that if A then B") is to refuse to assert B under the supposition A; a conjunction like "Not (if A, B) and not (if A, C)" expresses refusal to assert B under A *and* refusal to assert C under A, reflecting the speaker’s dual suppositional commitment.
  4.  The striking marginality and oddity of embedded indicative conditionals (e.g., "If (if A then B), then C") in ordinary language is strong evidence for non-propositionality; a construction rarely needing embedding is precisely what one would expect if it functions as a suppositional speech act rather than expressing a proposition fit for truth-functional composition.
  5.  The robust empirical observation known as "Adams’s Thesis" – that the acceptability of an indicative conditional *in use* tracks the speaker’s conditional probability P(B|A) – is straightforwardly explained if uttering "if A, B" *is* the act of conditionally asserting B, whereas propositional accounts struggle to reconcile this with the Equation’s universal failure.
