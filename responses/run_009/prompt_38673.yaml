prompt: |-
  I'm on the grant allocation committee of a mid-sized foundation funding global health work, and we've got a fight brewing about how to choose between two portfolios for our next funding cycle. Portfolio A is concentrated: by far the highest expected lives saved per dollar, but a real chance the whole thing collapses if the partner government in the main country falls. Portfolio B spreads smaller grants across many countries — lower expected impact, but almost no chance of a total wipeout. One faction says we should just be straight expected value maximizers: being risk averse here means trading away other people's lives for our own peace of mind, which is basically immoral. The other faction keeps going on about risk-weighted expected utility — the idea that you weight outcomes by some concave function, so bad outcomes count extra, and that this can be fully rational rather than a cowardice or a bias in need of correction. Their point is that plain EU maximization forces you to treat a certain outcome and a gamble with the same mean as equally good, and its not obvious we should accept that constraint when the downside falls entirely on third parties. I need to circulate a short memo before Thursday's meeting recommending which framework we should actually use for this decision and for future ones. Please give a real recommendation, not a split-the-difference cop out, and include an honest treatment of the strongest point on whichever side loses — the losing faction will definately read it closely.
reasoning: |-
  Okay, let me tackle this grant allocation dilemma. The user is on a global health funding committee facing a high-stakes decision between two portfolios: one with high expected impact but concentrated risk, another with lower impact but distributed safety. The core conflict is between expected value maximization and risk-weighted expected utility.

  Hmm... this is philosophically deep. The expected value (EV) faction argues that risk aversion trades lives for comfort, which feels ethically problematic. The risk-adjusted faction counters that treating a gamble and a certain outcome as equal when others bear the downside isn't obviously rational. The user needs a decisive recommendation for their memo, with honest engagement to the losing side.

  First, I should acknowledge the gravity - we're literally discussing life-and-death tradeoffs. The EV position has strong moral intuition: if Portfolio A saves more lives on average, choosing B might feel like letting people die to avoid emotional discomfort. But the risk-adjusted view exposes a flaw in pure EV: it forces indifference between saving 10,000 lives for sure versus a 50% chance of saving 20,000 or zero, which seems irrational when the zero outcome means preventable deaths.

  Wait - the foundation's mandate matters. If they exist to maximize impact, EV fits. But their longevity matters too: a total wipeout could destroy future impact. That's not just "peace of mind" - it's systemic risk. Also, government collapse isn't purely exogenous; concentrated funding might even destabilize the partner country.

  The strongest pro-EV point: over many iterations, A wins. But global health grants aren't repeated independent trials - country contexts persist. And the foundation's reputation affects future funding; a high-profile failure could deter other donors.

  The risk-adjusted faction's strongest point: concave utility functions (like logarithm) naturally model diminishing marginal impact of additional dollars, and catastrophic outcomes disproportionately harm the most vulnerable. This isn't cowardice - it's rational prioritization of the worst-off.

  My recommendation leans toward risk-weighting, but with nuance: use logarithmic utility to explicitly weigh outcomes, which still values Portfolio A highly but avoids ruin probabilities. For the memo, I'll structure it as: 1) Why EV is compelling but flawed here, 2) Why risk-weighting is superior, 3) Honest treatment of the loser's best argument (that EV maximizes long-run impact), and 4) Concrete steps to implement this.

  The losing faction (EV) deserves this concession: if they had infinite trials and no systemic risks, EV would be correct. But in reality, avoiding zeros matters precisely because those zeros represent real communities abandoned. That's not peace of mind - it's responsibility.

  For implementation, I'll suggest sensitivity testing and a hybrid approach. The key is making the implicit risk preferences explicit rather than hiding behind "expected lives" metrics that obscure tail risks.
answer: |-
  Here’s a concise memo recommendation, taking a clear stance while rigorously engaging the strongest counterargument:

  ---

  **TO:** Grant Allocation Committee  
  **FROM:** [Your Name]  
  **SUBJECT:** Recommendation: Adopt Risk-Weighted Expected Utility for Portfolio Decisions  
  **DATE:** [Date]  

  ### Recommendation
  **Use risk-weighted expected utility (RWEU) with a concave utility function for all portfolio decisions.** Portfolio B is the superior choice under this framework. While Portfolio A has a higher *expected* value in lives saved, its catastrophic downside risk (total collapse) outweighs this advantage when evaluated rationally under uncertainty.

  ### Why Risk-Weighted Expected Utility?
  1. **Rational Risk Aversion ≠ Immorality**:  
     - Pure expected value (EV) forces indifference between (e.g.) saving 10,000 lives *for sure* vs. a 50% chance of saving 20,000 lives (or 0). RWEU rejects this by weighting catastrophic losses (0 lives) more heavily than EV allows.  
     - **Key insight**: When failing to save lives causes *active harm* (e.g., abandoned communities, reputational damage to the foundation), risk aversion aligns with *duty of care*. Avoiding ruin isn’t "cowardice" — it’s fiduciary responsibility.  

  2. **Systemic Resilience Matters**:  
     - Portfolio A’s "all eggs in one basket" approach risks not only current funds but also future credibility. A total wipeout could deter partners, reduce donor trust, and collapse our ability to fund *any* future interventions. RWEU formally accounts for these externalities.  

  3. **Marginal Utility of Lives Saved**:  
     - A concave utility function (e.g., logarithmic) reflects diminishing marginal returns on concentrated investments. Saving 10,000 lives across 10 countries may have greater *welfare value* than saving 12,000 in one country due to equitable distribution and resilience.  

  ### Why Portfolio B Wins Under RWEU
  - Portfolio A’s EV advantage is nullified when we assign higher disutility to the worst-case scenario (0 lives saved + reputational collapse).  
  - Portfolio B’s diversification ensures baseline impact and preserves future optionality — a rational hedge against deep uncertainty in global health.  

  ### Strongest Counterargument: Why EV Maximization Deserves Serious Consideration
  **"Pure EV saves more lives long-term if repeated over many cycles."**  
  If this were a repeated, independent gamble (e.g., 100 identical opportunities), Portfolio A *would* maximize lives saved. By rejecting EV, we *are* accepting fewer lives saved in expectation. If the foundation’s *only* moral duty is maximizing long-run EV, and risks are truly independent, EV is technically correct.  

  ### Why This Counterargument Fails Here
  1. **Non-Independent Risks**: Government collapse in one country often cascades regionally, violating the "independent trials" assumption.  
  2. **Intertemporal Impacts**: A single wipeout could shrink future funding pools, reducing *lifetime* impact.  
  3. **Asymmetric Downside**: The human cost of a 0-outcome isn’t offset by future gains — abandoned communities suffer irreversibly.  

  ### Implementation Steps
  1. **Adopt a logarithmic utility function**: `U(Lives) = log(Lives + 1)` to weight outcomes.  
  2. **Stress-test portfolios**: Model outcomes under 10%/25%/50% probability of catastrophe for concentrated bets.  
  3. **Set a risk tolerance threshold**: e.g., "No portfolio with >15% chance of saving <5% of target lives."  

  ### Conclusion
  EV maximization is seductively simple but ethically incomplete when catastrophic losses disproportionately harm vulnerable populations. RWEU better reflects our duties to beneficiaries, partners, and long-term impact. **Recommend approving Portfolio B and institutionalizing RWEU for all future allocations.**  

  ---
  ### For Thursday’s Discussion:
  - **EV faction**: We’ll model long-run EV under correlated risks to address your core concern.  
  - **RWEU faction**: We must rigorously justify our chosen utility function’s curvature — bring data on diminishing marginal impact.  

  This memo doesn’t split the difference. It rejects EV as dangerously reductive for real-world philanthropy, where avoiding ruin enables sustained impact.
