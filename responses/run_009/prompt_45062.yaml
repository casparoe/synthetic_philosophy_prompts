  ok, background first: no college, I never took a philosophy class in my life. I run a small shop and for the last few years I've been chewing on whether lying is ever ok, mostly from library books and arguments with my brother in law. I started with the usual nazi-at-the-door stuff but the more I read, the more it seemed like Augustine was actually the hard case — he's the one who basically said never, period, not even a small lie to save a life. What's been on my mind lately is entrapment. Undercover cops, journalists who join a cult to expose it — they don't tell one lie, they live one, for months, every day fresh lies. And I have this vague memory of reading that Augustine himself got asked about something like this once: some guys in spain wanted to infiltrate a heretic sect by pretending to convert so they could figure out what the sect was really up to, and he apparently went along with it at first and later admitted he'd been wrong to. I might be garbling the details badly, it was a long time ago in a used bookstore copy of some letters. Doesn't matter much, that's the setup, not the point.

  Write me a short story set back then, a few pages. A bishop with Augustine-style convictions about lying (call him a follower of Augustine if you like, or just have him hold the same conviction), who gets approached with the plan: send a man into a heretical community as a fake convert to find out what they're actually doing. Tell it from the point of view of the guy who goes in, not the bishop. And I want it genuinely hard, no strawmen either way: the heretics shouldn't be evil caricatures, and the bishop shouldn't be a fool. Maybe the infiltrator starts to like the people he's deceiving, or starts loosing track of which parts of himself are the act. I especially want one scene where staying in character requires telling a lie at exactly the moment it hurts most. And please no tidy ending where everyone learns a lesson — I'd rather come away unsure whether the deception was worth it, or even unsure what "worth it" would mean here. If you can work in something about whether a lie you tell every day stops feeling like a lie, that'd be great. Don't stress about historical accuracy on my half-remembered anecdote, the story itself can be pure fiction.
