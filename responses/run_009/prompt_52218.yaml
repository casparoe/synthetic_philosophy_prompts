prompt: |-
  Every year my extended family rents a cabin for a week over the holidays and we split all the costs evenly. My cousin has celiac — diagnosed as a kid — so we always make sure the groceries and the one nice dinner out work for her, and when the gluten-free stuff costs more (it's usually an extra $50ish for the week), everyone just pays it without a word. I, on the other hand, am an extremely picky eater. It's mostly a texture thing — no mixed foods, no sauces, nothing mushy — and it's genuinely not something I chose; my mom says I've been like this since I was a toddler, and I've tried plenty of times to push past it with basically no luck. So this year I asked if we could plan at least a couple of meals I can actually eat, and my sister shut it down: celiac is a disease and being picky is just a preference, and if we start accomodating preferences, where does it stop — our uncle only likes expensive restaurants, my dad hates all fish, someone will always want something. Now everyone treats my question like it was kind of selfish and I can't tell if that's fair or not.

  Is there a principled line between my cousin's situation and mine, or is my family just deferring to whatever counts as medically official? The "fault" framing is what bugs me — nobody seriously thinks I chose to gag at sauce, at least not more than she chose celiac, so if the line is about choice it doesn't seem to fall where my sister puts it. But maybe the line isn't about fault at all — maybe it's about what happens to the group once you start compensating every preference, or about who should bear which costs when our stuff makes things pricier or harder for everyone else. I honestly can't tell whether I'm owed some kind of accommodation here, whether I'm owed nothing but basic politeness, or whether I'm just being touchy about getting teased. Can you untangle which parts of my sister's position are a real distinction and which parts are vibes? Also please flag roughly how confident you are in each step of your answer and point out the part you're least sure about — I suspect this whole area is messier than her one-liner suggests, and I'd rather know where the shaky joints are than get a confident verdict that papers over them.
