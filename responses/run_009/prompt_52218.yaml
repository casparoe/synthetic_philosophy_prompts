  You're absolutely right that this is messier than a "medical vs. preference" one-liner. Your frustration is understandable – the "fault" framing feels unfair, and the dismissal stings. Let's dissect your sister's argument and the underlying principles step-by-step, flagging confidence levels and shaky points:

  **1. Deconstructing the "Medical Necessity vs. Preference" Distinction:**
  *   **Your Sister's Claim (High Confidence in Representing Her View):** Celiac requires strict gluten avoidance to prevent serious physical harm (intestinal damage, malnutrition, long-term health risks). Picky eating, even involuntary, doesn't pose a health *threat*; it's about discomfort or avoidance. Therefore, accommodating disease is non-negotiable, while accommodating preference is optional and risks opening floodgates.
  *   **Where the "Medical" Line Gets Fuzzy (Medium-High Confidence):**
      *   **Involuntariness:** You rightly point out that neither condition was *chosen*. Celiac is autoimmune; your sensory/textural aversion seems deeply ingrained and resistant to change.
      *   **Severity of Distress:** While celiac avoidance prevents physical harm, involuntary food aversions can cause significant psychological distress (anxiety, gagging, social isolation, going hungry). Dismissing this distress as mere "preference" minimizes your genuine experience. Eating incompatible foods isn't just "unpleasant," it can be physically revolting.
      *   **The "Health Threat" Threshold:** Is the line *only* about preventing physical harm? What about preventing severe distress that significantly impacts participation? This is a **major shaky joint.** Society often draws the line at preventing harm, but basic inclusion and preventing acute misery are also values.
  *   **Conclusion on this Distinction:** The "medical necessity" label gives your cousin's needs stronger *moral weight* and clearer boundaries due to the objective health risk. However, labeling your needs *merely* a "preference" ignores their involuntary nature and the real distress caused. The distinction is **real but significantly oversimplified** by your sister. Her framing erases your genuine struggle.

  **2. The "Slippery Slope" Argument ("Where Does It Stop?"):**
  *   **Your Sister's Fear (Medium Confidence):** Accommodating one "preference" sets a precedent, leading to endless demands (expensive restaurants, no fish, etc.), creating chaos, resentment, and unsustainable cost/complexity.
  *   **Evaluating the Slippery Slope (Medium Confidence - Shaky Joint Here):**
      *   **Legitimacy of the Fear:** It's a valid *concern*. Groups *do* need boundaries to function. Not every whim can be accommodated.
      *   **False Equivalence (High Confidence):** Comparing your documented, lifelong sensory/textural aversion (causing gagging) to "Uncle likes expensive restaurants" or "Dad hates fish" is flawed. Your need is arguably closer to a *sensory processing difference* than a simple preference like cost or mild dislike.
      *   **Practical Distinctions (Medium Confidence):** Accommodations exist on a spectrum:
          *   **Avoidance vs. Active Provision:** Celiac requires *avoidance* of gluten. Your ask seems primarily about *provision* of a few simple meals you can eat (e.g., plain chicken, rice, steamed veg - things unlikely to cost *more*). These are fundamentally different asks. Uncle demanding expensive restaurants is an active, costly provision demand.
          *   **Cost:** The GF accommodation costs extra ($50). Your request likely costs *nothing extra* if planned (simple staples are cheap). Asking for expensive specialty items *would* be different. Dad avoiding fish costs *less* if fish isn't bought.
      *   **Manageability (Low-Medium Confidence - Shaky):** Could the family reasonably accommodate *core* involuntary restrictions (like yours) while politely declining *preferences* (expensive tastes, mild dislikes)? Probably yes, with clear communication ("We'll ensure basic options for X due to their sensitivity, but we can't accommodate every individual taste preference"). This requires nuance your sister dismisses.
  *   **Conclusion on Slippery Slope:** The core fear is reasonable, but your sister uses it to dismiss *your* specific need by falsely equating it with trivial preferences. A more nuanced approach *is* possible. Her argument relies heavily on **vibes** (fear of chaos) rather than assessing your *specific* ask's reasonableness.

  **3. Cost and Burden:**
  *   **Celiac (High Confidence):** The extra $50 for GF staples is a clear, quantifiable additional cost borne by the group.
  *   **Your Situation (High Confidence):** Accommodating you likely involves **minimal to zero extra cost** (planning 2-3 simple meals using basic ingredients like plain meat, potatoes, rice, plain pasta, basic veg) and **minimal extra effort** (cooking a portion plain before adding sauce/mixing). It does require *consideration* during planning. Contrast this with demanding entirely separate expensive ingredients or complex alternative meals.
  *   **The Disparity (High Confidence):** The group readily absorbs a known extra cost ($50 GF) but balks at what appears to be a negligible cost/effort increase for your needs. This inconsistency fuels your feeling of unfairness. The "cost" argument doesn't seem to apply equally here.

  **4. "Owed" Accommodation & Basic Politeness:**
  *   **Owed Formal Accommodation (like Celiac)? (Medium Confidence):** No. The health risk disparity is significant. The group isn't *obligated* to cater to sensory/textural aversions the same way they are for a life-altering autoimmune disease.
  *   **Owed Consideration & Basic Inclusion? (High Confidence):** **Absolutely yes.** You are owed:
      *   **Respect:** Not being dismissed or labeled "selfish" for an involuntary condition.
      *   **Basic Politeness:** Teasing that hurts isn't "just teasing." Minimizing your distress is unkind.
      *   **Reasonable Efforts for Inclusion:** Asking that *some* meals (not all!) include components you can eat, *especially* if this requires minimal extra effort/cost, is a reasonable request for family who supposedly enjoy spending the week together. It's about ensuring you can participate in the communal meals without distress.
  *   **The Core Issue (High Confidence):** This seems less about demanding special treatment and more about wanting your family to acknowledge your reality and make a *modest* effort so you aren't isolated or miserable during shared meals. It's about belonging.

  **5. Are You Being Touchy About Teasing? (Medium Confidence):** Probably not *just* touchy. While families tease, being consistently dismissed and having your genuine difficulty framed as selfishness or willfulness is hurtful. The teasing likely stings more *because* it reflects the broader dismissal of your experience.

  **Untangling Your Sister's Position:**

  *   **Real Distinction (Medium-High Confidence):** The *quantifiable health risk* of celiac vs. the *distress/avoidance* of sensory aversion. This *does* create a difference in the *level* of obligation.
  *   **Vibes & Oversimplifications (High Confidence):**
      *   Labeling your aversion a mere "preference" (ignoring involuntariness).
      *   The crude "medical=real / preference=selfish" dichotomy.
      *   The false equivalence slippery slope (equating your need with Uncle's expensive tastes).
      *   Ignoring the minimal actual cost/effort involved in accommodating *your specific ask*.
      *   Framing a request for basic inclusion during a few meals as unreasonable or selfish.

  **The Verdict (with Confidence Nuance):**

  *   **Your sister's medical vs. preference line is a real distinction in terms of health risk, but it's overly simplistic and misapplied to your situation (High Confidence).** It ignores the involuntary nature of your aversion and the genuine distress it causes.
  *   **Her slippery slope argument relies heavily on vibes and false equivalence, dismissing the reasonableness and low burden of *your specific request* (Medium-High Confidence).**
  *   **You are not "owed" accommodation on par with celiac due to the health risk disparity (Medium Confidence).**
  *   **However, you are absolutely owed respect, basic kindness, and reasonable consideration from your family to ensure you can participate in shared meals without significant distress (High Confidence).** Asking for 2-3 simple meals you can eat during the week, given the minimal burden, is a **perfectly reasonable request** in the context of a close family gathering. Dismissing it entirely and labeling you selfish was unfair.
  *   **The family's inconsistency in readily absorbing the GF cost while rejecting your low-cost ask feels unfair (High Confidence).**

  **What Now?** Instead of reframing it as "I deserve accommodation like cousin," focus on: "This is hard for me, it's not a choice, and I'm asking for a little planning so I can eat *with* you a few times this week without feeling awful. Simple things like plain chicken or pasta on the side would make a huge difference to me being able to enjoy our time together." Appeal to their care for you, not a rights-based argument. If the cost of *your* specific staples is genuinely higher (e.g., you only eat expensive cuts?), offer to cover that small difference yourself. The goal is inclusion, not winning a philosophical debate – though your analysis of the principles is spot-on.
