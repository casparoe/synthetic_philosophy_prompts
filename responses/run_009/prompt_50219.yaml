answer: |-
  You've hit on a key objection, but you're conflating *descriptive* complexity with *executional* complexity in a way that misunderstands Kolmogorov compression. The hypothesis isn't "evolves consequentialists who do X" as a separate burden; it's "runs physics law F in initial state S" — and the *same* (F,S) that produces galaxies and bacteria *also* produces consequentialists as an emergent outcome. If (F,S) is Kolmogorov-simple (like a cellular automaton with a small seed), it gets high prior weight regardless of what complex structures emerge during its computation. Crucially, the consequentialists' policy *itself* isn't encoded in the program; it emerges from their optimization against *their* environment, which includes the simulator's output channel. Charging for their reasoning is like charging a fluid dynamics sim extra for forming vortices — the complexity is generated by the rules, not described upfront. The prior only cares about the shortest *source code*, not runtime behavior.
