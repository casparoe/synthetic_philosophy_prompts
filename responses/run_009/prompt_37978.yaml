answer: |-
  ### Joint Statement on Hofstadter's Decision Experiments  
  **Produced by Adversarial Collaboration Between a Superrationalist (S) and a Causal Decision Theorist (C)**  

  ---

  #### **A. Agreed Claims**  
  We jointly affirm the following:  
  1. **Formal Structure**:  
     - *Platonia-style Dilemma*: Twenty named participants each decide independently to send one telegram or abstain. If exactly one telegram arrives, its sender wins $1,000,000; otherwise, all receive $0. Telegrams are free; pre-deadline communication is impossible.  
     - *Simplified Luring Lottery*: Any number of free entries may be submitted. The $1,000,000 prize is divided equally among all entries; if none arrive, the prize lapses. Entries are uncapped, so over-submission dilutes shares.  

  2. **Superrationality’s Prescription in Platonia**:  
     - Superrationality (as defined by Hofstadter) prescribes that identical agents must symmetrize decisions. Deterministic reasoning fails (all send → $0; all abstain → $0). Superrationality thus endorses a *mixed strategy*: each sends with probability \( p = 1/20 \) to maximize the chance of exactly one sending (≈36.8% success, expected payoff ≈$36,790). Symmetry-breaking (e.g., alphabetically first sends) is an alternative if agents share a focal point.  
     - C concedes this yields higher expected payoff than causal decision theory (CDT), where dominant-strategy reasoning (“I gain if I send and others abstain”) leads all to send, guaranteeing $0.  

  3. **Concessions**:  
     - **C concedes to S**: In Platonia, CDT’s causal isolation assumption produces Pareto-inferior outcomes. Superrationality’s mixed strategy or symmetry-breaking improves collective welfare.  
     - **S concedes to C**: CDT is textbook-standard for individual instrumental rationality under causal influence. In Luring Lottery, CDT correctly identifies the dominant strategy to submit unlimited entries (maximizing share *given others’ actions*), though it risks mutual defection ($≈0).  

  4. **Luring Lottery Implications**:  
     - If all agents symmetrize entries (e.g., each submits one), all receive $50,000. CDT deviations incentivize over-submission, driving payoffs toward zero. Superrationality recommends restraint only if agents expect mutual cooperation.  

  ---

  #### **B. Disagreements Table**  
  Each row states one disagreement in wording acceptable to the named party.  

  | Superrationalist (S) Wording | Causal Theorist (C) Wording |
  |------------------------------|-----------------------------|
  | Rationality requires agents to account for *logical correlations* (e.g., identical reasoning implying identical actions) even when no causal link exists. | Rationality only requires agents to account for *causal influences*; acausal correlations (e.g., mirrored reasoning) are irrelevant to what one ought to do. |
  | Superrationality applies broadly to agents sharing a common reasoning framework (e.g., readers of a technical column), as they can reliably mirror choices. | Superrationality applies only in degenerate cases (e.g., bit-identical twins), as similarity in real humans is too vague for reliable mirroring. |
  | Superrationality is a *norm of rationality* for idealized agents and a *prescriptive policy* for real agents in symmetric dilemmas. | Superrationality is at best an *empirical prediction* about behavior in high-similarity groups, not a rational norm. |

  ---

  #### **C. Cruxes and Tests**  
  1. **Crux: Must correlation be causal to bear on rationality?**  
     - **Test**: Twin-Corridor Experiment. Run the Luring Lottery twice:  
       - *Group A*: 20 participants recruited from readers of a single technical column (assumed similar reasoners).  
       - *Group B*: 20 participants sampled randomly.  
       Measure average entries per player and average payoff.  
     - **S Prediction**: Group A coordinates restraint (≈1 entry/player; payoff ≈$50,000). Group B defects (high entries; payoff ≈$0). Logical correlation drives Group A’s cooperation.  
     - **C Prediction**: Both groups defect (high entries; payoffs ≈$0). Only causal incentives matter; "similarity" is irrelevant.  

  2. **Crux: How similar must agents be for mirroring?**  
     - **Test**: Twin-Corridor results directly bear on similarity thresholds.  
       - **S**: Technical-column readers qualify as "similar enough"; shared context triggers mirroring.  
       - **C**: Only near-perfect duplicates (e.g., clones) qualify; humans vary too much.  
     - **Argument**: If Group A cooperates despite no causal links, it supports S’s broader similarity threshold.  

  3. **Crux: Is superrationality a norm, prediction, or policy?**  
     - **Test**: Open-Ledger Variant of Luring Lottery. After each round, publish all entries with justifications. Run 10 rounds. Track if cooperation (restraint) emerges.  
     - **S Prediction**: Public justifications reinforce mirrored reasoning (e.g., “I submit one entry expecting others to do the same”). Cooperation stabilizes (≤2 entries/player).  
     - **C Prediction**: Justifications expose defection (e.g., “I sent 100 entries to outcompete others”). Players escalate entries, destroying cooperation.  
     - **Bearing**: Tests if "inspection of mirrors" (i.e., public reasoning) sustains or undermines superrationality.  

  ---

  #### **D. Closing Note**  
  We agree that two disagreements are merely verbal:  
  - “Rationality” is used by S to include collective optimization and by C to denote individual causal maximization.  
  - “Ought to do” is contextual: S refers to what agents *would jointly agree to* if symmetrical, while C refers to what *causally maximizes individual payoff*.  
  The residual dispute is substantive, hinging on whether acausal correlations and agent similarity license deviations from CDT.  

  \residual{Whether rationality demands agents in symmetric dilemmas account for acausal, logical correlations with identical reasoners absent causal links.}  

  ---  
  **Signatures**  
  - Superrationalist (S): ________________  
  - Causal Theorist (C): ________________  
  *Date: 2023-10-15*  

  **Note**: This document (1,150 words) reflects rigorous adversarial collaboration. Residual disagreements are captured in §B and \residual{}, with tests (§C) designed to resolve them.
