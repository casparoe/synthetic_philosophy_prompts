  Crux 3: Status of superrationality.

  Test: The open-ledger variant. After each round, the sponsor publishes every entry along with the entrant's written justification (which they write at the time of entry). Entrants know this in advance. We run multiple rounds of the Luring Lottery and observe if the level of cooperation (restraint in sending entries) changes over time.

  Predictions:
  - S: Initially, there might be over-sending, but as justifications are published, players see that others are trying to be cooperative (using superrational reasoning), and so they will learn to restrain. Cooperation will emerge and be sustained.
  - C: Players will quickly see that others are sending many entries, and so they will send even more to get a larger share. Or they might try to signal cooperation but then defect. Cooperation will not be sustained.

