prompt: |-
  A friend in my bioethics reading group has an argument she built herself, and it has been nagging at me since, because every step sounds acceptable and I cannot accept where it lands. It is meant to show that the difference between killing and letting die is not intrinsically moral at all. Here it is, as she presents it:

  (1) If the distinction between doing and allowing has intrinsic moral significance — if killing someone is worse than letting him die in and of itself, rather than because of intentions, side effects, or social conventions — then there must exist a pair of cases that differ in nothing except that one involves doing and the other allowing. Otherwise the extra badness of doing would have nothing to hang on.

  (2) Here is a candidate pair. In case A, a patient will die within minutes unless his ventilator keeps running; the machine is running. A nurse who wants him dead walks over and switches it off, and he dies. In case B, everything is the same — the same patient, the same machine, the same nurse, with the same desire, the same beliefs, and the same knowledge — except that the machine's power fails on its own; the nurse, wanting him dead, simply does nothing, and he dies.

  (3) The nurse's intention, desires, and beliefs, and the outcome, are identical across the cases. The only remaining difference is that in A the death flows through a movement of her body, while in B it does not.

  (4) A difference in bodily movement — muscle contractions present in one case, absent in the other — cannot be what separates murder from mere failure to rescue. Morality is not keyed to physiology.

  (5) Since the cases differ in nothing else, and one is a doing while the other is an allowing, the distinction itself carries no intrinsic moral weight.

  (6) Whatever moral weight the distinction appears to have must therefore come from elsewhere: conventions about medical roles, expectations the patient and his family had formed, legal fictions about who "caused" what.

  My problem is that the argument seems to prove too much, in a direction I did not expect. Consider a different contrast, one I am confident is real: whether I am the only person able to save a drowning swimmer, or one of fifty equally positioned people on the pier, makes a real difference to how much blame I deserve for staying put. But the only thing that differs between those situations is facts about other people — their existence, their positions — which are just as external to my body as the machine's power supply is external to the nurse. So facts outside someone's body can apparently ground differences in responsibility. If that is right, then something like (3) or (4) has quietly narrowed what counts as a real difference between the nurse's two cases: maybe what separates them is not the motion of her muscles but something else that is not in either her body or the list in (3) — though I cannot say what without smuggling in exactly what (1) demanded, a bare difference.

  I can see two escape routes and dislike both. One is to deny that the pair in (2) really differs in nothing but doing and allowing, and to name the hidden difference; but the pair was engineered to be as bare as possible, so this needs to be more than a hand-wave. The other is to deny (1) and allow that a distinction can matter morally even though its significance is not inspectable in any single pair of cases; but that seems to hand a blanket exemption to anyone who claims a moral distinction without ever having to exhibit it. If it matters to the analysis, I would most like to keep (4) — I agree morality is not keyed to physiology — and the reality of the blame difference between one rescuer and fifty.

  Please tell me which step, or which pair of steps, I should reject; what rejecting each candidate costs; and whether the rescue example shows that the argument fails outright or only that my friend has misdescribed what the cases have in common.
reasoning: |-
  Okay, let me start by unpacking the user's dilemma. They're grappling with a bioethics argument from a friend that challenges the intrinsic moral difference between killing and letting die. The argument uses a nurse scenario where the only difference is a bodily movement turning off a ventilator versus not intervening when it fails. The conclusion is that the doing/allowing distinction lacks intrinsic moral weight. 

  The user feels this proves too much because they see a clear moral difference in another scenario: being the only potential rescuer versus one of many. They point out that external factors (like others' presence) can affect blame, so why can't external factors matter in the nurse case too? Their core tension is: rejecting the friend's argument seems to require either (a) finding a hidden difference in the nurse pair, or (b) denying that moral distinctions need isolatable case pairs—both options feel unsatisfying.

  Hmm, the user's rescue example is smart. It exposes a flaw in premise (3)/(4): the nurse cases *do* differ beyond bodily movement. The power failure in Case B is an external event, while Case A involves the nurse *creating* a threat. The friend incorrectly lumped "machine power failing" under "same circumstances," but it's actually a critical difference: in A, the nurse removes safety; in B, safety vanishes independently. This isn't about physiology—it's about causal responsibility. 

  The user's instincts are sharp. The rescue analogy shows that external factors *can* alter moral responsibility without relying on conventions. For the nurse, the key external factor is who/what created the lethal situation. Case A is active harm (she breaks a protection); Case B is passive endangerment (she doesn't fix a broken protection). That distinction *is* inspectable in the pair—it just wasn't captured by the friend's description. 

  So the cleanest solution is to reject premise (3). The cases differ not just in bodily movement but in the nurse's relationship to the threat: she *initiates* harm in A versus *fails to counter* harm in B. This preserves the blame difference in rescues (e.g., only you can save vs. 50 others) because both scenarios share the same "failing to counter" structure. No need to abandon premise (1) or concede to conventionalism. 

  Cost-wise, this forces refining what "differ in nothing except doing/allowing" means. Future case pairs must control for *all* causal/external factors—not just internal states. But that's manageable. The user keeps their defense of (4) (no physiology fetish) and their rescue intuition. The friend's oversight was misdescribing the cases' commonality, not a fatal flaw in the whole project.
answer: |-
  Your unease is justified—the argument smuggles in a crucial misstep at **premise (3)**, which your rescue example brilliantly exposes. Here's the breakdown:

  ### Step to Reject: **Premise (3)**
  > *"The only remaining difference is that in A the death flows through a movement of her body, while in B it does not."*

  **Why it fails:**  
  The cases **do** differ beyond bodily movement. The difference lies in **the source of the threat to the patient’s life** and **the nurse’s causal relationship to it**:
  - **Case A (Killing):** The ventilator *is working* and sustaining life. The nurse *creates a new threat* (deactivation) that didn’t exist.
  - **Case B (Letting Die):** The ventilator *fails independently*. The nurse *fails to respond* to an *existing threat* she didn’t cause.

  This isn’t about physiology—it’s about **whether the agent *introduces* a lethal cause or *omits* to intervene in a cause arising externally**. Your rescue analogy nails this:  
  - If you’re the *only* person on the pier, you *allow* an existing threat (drowning) to proceed.  
  - If you’re *one of fifty*, you *still* allow the same threat—but your blame is diluted because others share responsibility.  
  The "external facts" (others' presence) *modify the degree of responsibility*, but the **core moral distinction** (allowing vs. initiating harm) remains intact.  

  ### Costs of Rejecting Premise (3):
  - **Cost:** Requires clarifying that "doing" vs. "allowing" must account for **pre-existing conditions**. The nurse’s *act* in Case A *alters the status quo* (working ventilator → off), while her *inaction* in Case B *leaves the status quo* (failed ventilator → not fixed).  
  - **Benefit:** Preserves the moral distinction without appealing to conventions or physiology. It aligns with your intuition about the rescue cases and avoids granting a "blanket exemption" to moral distinctions.

  ### Why Other Premises *Can* Stand:
  - **Premise (1)** holds: Isolating the doing/allowing distinction *is* possible—but your friend’s pair fails.  
  - **Premise (4)** stands: Morality isn’t about muscle contractions. The real difference is *causal/relational* (agent as threat-creator vs. threat-neglecter).  
  - **Premise (2)** is accurate but incomplete: The cases *seem* identical, but the **source of the threat** differs (nurse vs. machine failure).  

  ### How Your Rescue Example Defeats the Argument:
  It shows that **external facts matter**—but not arbitrarily. They affect *responsibility*, not the *fundamental moral category*. The nurse’s cases differ in a morally relevant external fact:  
  - In **A**, the nurse *causes the threat*.  
  - In **B**, nature causes the threat; she *fails to counter it*.  
  This difference is **inspectable in the pair** (contra your "blanket exemption" fear) and doesn’t rely on conventions.  

  ### Refined Candidate Pair:
  To satisfy (1) *correctly*, engineer this pair:  
  - **Case A'**: Nurse deactivates a *working* ventilator (killing).  
  - **Case B'**: Nurse *refuses to activate* a *disabled* ventilator (letting die).  
  Here, the threat (disabled ventilator) is identical; only the nurse’s act/inaction differs. *Now* the moral weight *might* reduce to intentions/conventions—but your friend’s original pair didn’t achieve this.  

  ### Conclusion:
  Reject **premise (3)**. The cases differ in **who/what created the lethal situation**, not just bodily movement. This preserves the intrinsic moral distinction (harming vs. failing to aid) while accommodating your rescue intuition. The cost is minor: future case-building must control for pre-existing threats. Your friend’s error was misdescribing the commonality—not proving the distinction hollow.  

  *This resolves your core tension: external facts can matter without reducing morality to conventions, and the doing/allowing distinction retains intrinsic weight.*
