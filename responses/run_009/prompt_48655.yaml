prompt: |-
  Last night my friend and I had a long argument about what Harsanyi's work actually establishes, and I left it unable to tell how much of what he said to believe. My friend is a graduate student in economics, very confident, and at one point he laid out the whole case in a paragraph I more or less memorized because it sounded so tidy. As I recall it, he said: Harsanyi showed back in the fifties that utilitarianism is not just a moral intuition but a theorem — if every individual has von Neumann–Morgenstern preferences, if society's preferences satisfy those same axioms, and if social preferences never contradict a unanimous individual preference, then social welfare must be a sum of individual vNM utilities; and since vNM utilities are cardinal rather than ordinal, the ancient objection that you cannot add one person's utility to another's dissolves, because the theorem supplies precisely the common scale that utilitarians were always accused of lacking. He then added that the same argument shows that a rational agent behind a veil of ignorance, not knowing which person in society it will be, must choose to maximize average utility, which means Rawls, starting from his own original position, simply draws the wrong conclusion from his own setup — maximin would be rational only for someone with essentially infinite risk aversion, which no agent satisfying the vNM axioms could have.

  I argued back for a while but mostly on moral grounds, and I could tell he thought I was changing the subject. Two things nag at me, though. First, I have a vague memory that cardinal utility in the vNM sense is only unique up to a positive affine transformation for each person separately, which sounds like it might matter for the "common scale" claim, but he brushed this off. Second, I also have a vague sense that Harsanyi gave two different arguments — one about aggregating individual preferences, and a separate one about a single impartial observer choosing under uncertainty — and I don't know whether it's legitimate to run them together the way my friend did. I don't know where the real errors are, if there are any; the summary sounded professionally competent, and I'm inclined to believe at least the mathematical part.

  Could you go through his summary claim by claim and tell me what a welfare economist or a Harsanyi scholar would accept, what they would wince at, and what they would reject outright? In particular, I'd like to know whether the interpersonal-comparability step is as innocent as he made it sound, whether the veil-of-ignorance point is genuinely part of the same theorem or a distinct argument with different assumptions, and whether the conclusion he drew — that utilitarianism has a mathematical proof and that Rawls's maximin is thereby refuted on Rawls's own terms — actually follows from whichever parts of the summary turn out to be accurate. If some of it needs repairing, I'd also appreciate a corrected version of the paragraph that a careful defender of Harsanyi would be willing to sign.
reasoning: |-
  Okay, the user and their friend had a heated debate about Harsanyi's work, specifically regarding utilitarianism and Rawls' maximin principle. The friend, a grad student in economics, presented a neat summary claiming Harsanyi proved utilitarianism as a theorem and refuted Rawls. The user is skeptical but unsure where the flaws lie. Let me break down the key points.

  First, the friend mentioned that Harsanyi showed social welfare must be a sum of individual vNM utilities under certain axioms. But I recall that vNM utilities are cardinal per person but lack interpersonal comparability. Each person's utility is affine, so scaling differs between individuals. Aggregating them requires a common scale, which the axioms don't provide. The friend brushed this off, but it's crucial. Harsanyi assumes interpersonal comparisons, but doesn't derive them from the axioms. That's a big gap.

  Next, the veil of ignorance argument. The friend linked it directly to the aggregation theorem, but they are separate. The impartial observer setup is different: it's one entity making decisions under uncertainty. Here, maximizing expected utility does lead to average utility, but only if the observer uses identical scales for all individuals. Again, the scaling issue arises. The friend conflated the two models, but they have different assumptions. Also, claiming that maximin is irrational under vNM ignores that Rawls' veil of ignorance doesn't assume vNM axioms. Rawls rejects those axioms for moral reasoning, so the critique misses the mark.

  The user's nagging points are valid. The affine transformation problem means no common scale without additional assumptions. The two Harsanyi arguments (aggregation vs. impartial observer) are distinct. The friend's summary oversimplifies and overclaims. The conclusion that utilitarianism is "proven" and Rawls is refuted is too strong. Harsanyi provides a formalization under specific assumptions, but interpersonal comparability remains an ethical choice, not a mathematical derivation. 

  The user needs clarity on where the friend's account is accurate versus misleading. They also want a corrected version that's defensible. Key corrections: acknowledge the need for interpersonal comparability as an assumption, separate the two theorems, and note that Rawls' rejection of vNM axioms makes Harsanyi's critique not directly applicable. The user's deeper need might be understanding the legitimacy of utilitarianism versus Rawls' theory, and how much weight to give formal economic models in moral philosophy. They might also seek reassurance that their skepticism about overclaimed conclusions is justified.
answer: |-
  Here's a breakdown of your friend's summary, point-by-point, from the perspective of welfare economics and Harsanyi scholarship. His account captures the *spirit* and ambition of Harsanyi's work but oversimplifies critical technical details and overstates the conclusiveness, particularly regarding interpersonal comparisons and the refutation of Rawls.

  **Your Friend's Summary & Analysis:**

  1.  **Claim:** "Harsanyi showed... that utilitarianism is... a theorem — if every individual has von Neumann–Morgenstern preferences, if society's preferences satisfy those same axioms, and if social preferences never contradict a unanimous individual preference, then social welfare must be a sum of individual vNM utilities."
      *   **What's Accurate:** Harsanyi did prove a famous **Aggregation Theorem**. Under the stated conditions (individuals have vNM rational preferences over lotteries, the social preference ordering also satisfies vNM rationality axioms, and the Pareto Principle holds - social preference respects unanimous individual preference), the *only* form the social welfare functional (SWFL) can take is a **weighted sum** of individual vNM utility functions: W = Σ aᵢ Uᵢ, where aᵢ are positive weights. This is a profound and central result.
      *   **The Critical Oversimplification (The "Common Scale" Problem):** This is the core issue your intuition correctly flagged. While individual vNM utilities are cardinal *within* each person (unique up to positive affine transformations: Uᵢ' = bᵢUᵢ + cᵢ, bᵢ > 0), **they are not automatically comparable *across* persons by the theorem alone.** The weights `aᵢ` in the sum W = Σ aᵢ Uᵢ **are arbitrary positive constants**. Choosing their values **requires making interpersonal comparisons of utility levels and units**.
          *   `Uᵢ` represents person i's preferences over lotteries.
          *   `Uⱼ` represents person j's preferences over lotteries.
          *   The scaling constants `bᵢ` and `bⱼ` (from the affine transformations) are chosen independently. **The theorem does not tell us how to relate bᵢ to bⱼ.** Setting `aᵢ = 1` for everyone implicitly assumes we've chosen scales where one unit of utility for i is deemed "equivalent" to one unit for j. This is an *ethical* or *informational* judgment, not a consequence of the axioms. Harsanyi *assumed* such comparisons were meaningful, but the theorem itself **does not derive or supply a unique common scale**; it presupposes one can be chosen (via the weights `aᵢ`).
      *   **Welfare Economist's Verdict:** The theorem is mathematically correct and shows that social welfare *must be linear* in individual vNM utilities. However, the claim that it "dissolves" the objection to interpersonal comparison by "supplying precisely the common scale" is **flatly incorrect and the most significant error in the summary.** The theorem *relies* on interpersonal comparability being possible (to set the `aᵢ` weights meaningfully) but does not *create* it from the ordinal preferences or vNM axioms alone. This is a major point of contention in welfare economics.

  2.  **Claim:** "since vNM utilities are cardinal rather than ordinal, the ancient objection that you cannot add one person's utility to another's dissolves, because the theorem supplies precisely the common scale..."
      *   **What's Accurate:** vNM cardinality *does* overcome the problem of adding purely *ordinal* utilities (where any monotonic transformation is allowed, making sums meaningless). Cardinality restricts transformations to affine ones, making the *form* of summation meaningful *if* scales are comparable.
      *   **What's Misleading/Incorrect:** As above, the theorem **does not supply the common scale.** Cardinality within persons is necessary but **not sufficient** for meaningful interpersonal addition. The "dissolution" only happens *if* we accept that interpersonal comparisons of utility differences (e.g., "gaining one util matters as much to person i as gaining one util matters to person j") are possible and meaningful. Harsanyi believed they were (often based on extended sympathy or the impartial observer), but this is an **additional ethical assumption**, not a conclusion of the aggregation theorem. The objection dissolves only *conditional* on accepting interpersonal comparability.

  3.  **Claim:** "the same argument shows that a rational agent behind a veil of ignorance, not knowing which person in society it will be, must choose to maximize average utility..."
      *   **What's Accurate:** Harsanyi *did* provide a distinct but related **Impartial Observer Theorem**. Here, a single rational observer (satisfying vNM axioms), placed behind a veil of ignorance where they have an equal chance of *being* any person in society (and know each person's preferences/circumstances), will rank social states by maximizing the **average** of the individual vNM utilities: W = (1/n) Σ Uᵢ. This is a powerful argument for average utilitarianism.
      *   **The Conflation & Oversimplification:** Your friend treats this as "the same argument" as the aggregation theorem. While philosophically linked (both aim for utilitarianism, both use vNM rationality), they are **formally distinct models with different assumptions:**
          *   **Aggregation:** *Multiple* individuals, *one* social preference ordering. Assumes Pareto.
          *   **Impartial Observer:** *One* observer facing uncertainty about their *identity*. Assumes vNM rationality for *that observer* and the "equal probability" setup. Pareto isn't directly assumed here.
      *   **The "Common Scale" Issue Persists (Subtly):** Even in the impartial observer setup, the observer needs a single utility function over outcomes that depends on *who* they are. Harsanyi assumed the observer would use each person's *own* vNM utility function `Uᵢ` to evaluate outcomes if they turn out to be person i. **Crucially, this assumes that the scaling of these individual Uᵢ functions is comparable.** The equal probability assumption combined with vNM rationality *leads* to averaging *only if* the utility values assigned by `Uᵢ` and `Uⱼ` are on scales where "one unit" has comparable meaning for aggregation by the observer. The theorem doesn't *create* this comparability; it *uses* it. (Harsanyi argued the veil itself provided the perspective for making such comparisons).

  4.  **Claim:** "...which means Rawls, starting from his own original position, simply draws the wrong conclusion from his own setup — maximin would be rational only for someone with essentially infinite risk aversion, which no agent satisfying the vNM axioms could have."
      *   **What's Accurate (within Harsanyi's framework):** If an agent in *Harsanyi's* veil of ignorance (equal probability, vNM rational) chose maximin, it *would* imply infinite risk aversion, violating the continuity axiom of vNM.
      *   **What's Problematic/Rejected by Rawls & Critics:**
          *   **Different Veils, Different Rationalities:** Rawls explicitly *rejected* the vNM axioms (especially the strong independence axiom and the assumption that all probabilities, including the probability of being any person, are known/meaningful) as the appropriate model of rationality *for fundamental moral choice* in the Original Position. He argued the choice of principles of justice is too grave and the probabilities too uncertain/speculative to apply standard expected utility. He proposed maximin precisely *as* a rational rule *under conditions of radical uncertainty* (or "uncertainty behind a veil of ignorance") where probabilities are unknown or meaningless, not merely risk.
          *   **Misrepresentation of Rawls's Setup:** Rawls's Original Position uses a veil of ignorance that removes knowledge of *specific* probabilities of ending up in any position. Harsanyi assumes *known, equal* probabilities. These are fundamentally different assumptions about the informational and epistemic constraints. Saying Harsanyi's theorem shows Rawls "draws the wrong conclusion from his own setup" **misrepresents Rawls's setup**. Rawls deliberately constructed a scenario where vNM rationality *wouldn't* apply.
          *   **Normative vs. Positive:** Harsanyi's theorems show what follows *if* you accept vNM rationality as the model for social choice or impartial choice. Rawls challenges the applicability of that model to the foundational moral problem. Harsanyi highlights a *tension* for someone who *wants* to use vNM rationality in a veil of ignorance, but it doesn't constitute a mathematical "refutation" of Rawls on Rawls's own terms because Rawls rejects the core vNM assumptions within the Original Position.

  **Overall Verdict on the Summary:**

  *   **Professionally Competent Core?** Yes, in capturing the *formal structure* and *ambition* of Harsanyi's two key theorems and the link to utilitarianism.
  *   **Major Flaw:** **Grossly overstates the resolution of the interpersonal comparability problem.** The theorems *require* interpersonal comparability (to set weights in aggregation, to assume comparable scales in the observer model) but do not *derive* it from individual preferences alone. This is the most significant wince/rejection point.
  *   **Significant Oversimplification:** Conflates the two distinct theorems (Aggregation vs. Impartial Observer) as "the same argument."
  *   **Overreach vs. Rawls:** Presents Harsanyi's critique of maximin within the vNM framework as a decisive refutation of Rawls on Rawls's own terms, ignoring Rawls's explicit rejection of the vNM axioms for the Original Position. It's a powerful *counter-argument*, not a mathematical refutation.

  **A Corrected & Careful Summary (Defensible by a Harsanyi Scholar):**

  "Harsanyi provided two profound formal arguments for utilitarianism. First, his Aggregation Theorem shows that if individual preferences and social preferences satisfy the von Neumann-Morgenstern rationality axioms (including completeness, transitivity, continuity, and independence), and if social preferences respect the Pareto principle (unanimous individual preference implies social preference), then social welfare *must* be a *weighted sum* of individual vNM utility functions: W = Σ aᵢ Uᵢ, with aᵢ > 0. Second, his Impartial Observer Theorem shows that a single rational agent, placed behind a veil of ignorance where they have an equal chance of being any person in society and know each person's circumstances and preferences, will rank social states by maximizing the *average* of the individual vNM utilities: W = (1/n) Σ Uᵢ, provided this agent also satisfies the vNM axioms.

  These theorems demonstrate that utilitarianism – specifically, the idea of summing or averaging cardinal utilities – is the unique form of social welfare compatible with these sets of axioms. The cardinality of vNM utilities solves the problem of aggregating *within* a person's preferences under uncertainty. However, both theorems rely on the *possibility of making meaningful interpersonal comparisons of utility levels and units*. The aggregation theorem requires choosing the weights aᵢ, and the impartial observer theorem requires assuming that the scales of the individual Uᵢ functions are comparable for the purpose of averaging. Harsanyi argued such comparisons were possible, often through empathetic identification, but this remains a distinct ethical assumption; the theorems themselves do not derive interpersonal comparability solely from the individual vNM preference orderings.

  Regarding Rawls, Harsanyi's impartial observer argument implies that a vNM-rational agent in a veil of ignorance *with known equal probabilities* would maximize average utility, not choose maximin. Maximin would violate vNM rationality by implying infinite risk aversion. However, Rawls explicitly rejected the application of vNM rationality, particularly the use of known probabilities and the strong independence axiom, in the profound moral uncertainty of his Original Position. He designed his veil specifically to make probabilities unknown or irrelevant, arguing maximin is rational under those conditions. Thus, while Harsanyi's model highlights a conflict for those accepting vNM rationality under risk, it does not refute Rawls's conclusion *within the specific framework Rawls constructed*, which intentionally departs from Harsanyi's assumptions."

  This corrected version maintains the power of Harsanyi's results while accurately representing the critical role of interpersonal comparability as an *assumption*, clearly distinguishing the two theorems, and presenting the point about Rawls as a conflict of assumptions rather than a mathematical refutation on Rawls's terms.
