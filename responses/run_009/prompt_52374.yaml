prompt: |-
  My flatmate and I argued about this for like two hours last night so I'm hoping someone can settle it. The thing we kept circling: she says she "knows" stuff in some situations and not in others while literally having the same evidence. Concretely: she'll say she knows the back door is locked because she checked it an hour ago and nobody's been home, but when she's about to leave for a weekend and I ask her whether it's locked, she says she should go double check, and when I point out that she checked an hour ago she says yeah but this time it matters. Same memory, same door, same hour — but when the cost of being wrong goes up, she stops counting it as knowledge. And it's not that she forgot checking or got new evidence, she just refuses to call it knowledge anymore.

  We also noticed it does something weird when the stakes are mine instead of hers. If I'm the one relying on her door-checking because I'm the one coming home late, she's fine saying she knows it's locked, even though a wrong belief would now cost *me* a lot — the word seems to track what it costs her to be wrong, not what it costs whoever she's talking to. Except other times it seemed to track something else again, like how bad it would be to have said "I know" out loud and then be caught out, which is embarassment about the speech act rather than the stakes of the thing itself. And there was one case we could not agree on: if the mistake is cheap to undo — say she can check a camera on her phone and let someone in remotely if it turns out she was wrong — she happily goes back to saying she knows it's locked, even though being wrong is just as likely as before. So is this pattern tracking stakes at all, or is it really tracking whether the error is fixable?

  Her theory is that it's all just vagueness — that "know" is a threshold word over confidence, high stakes make people second-guess themselves, so her actual confidence genuinely drops and there's nothing deeper going on. I half buy that, but it doesn't seem like the whole story, because she'll admit her confidence is exactly the same as an hour ago and still refuse to say she knows. So: does this have an actual name in philosophy, and if so, which concept is it exactly? I've heard people say something about how words like "know" shift depending on who's talking and why, but that doesn't sound right either, since here it seems to be about her situation and not mine. Whatever the nearest concept is, does it distinguish the sub-cases we stumbled into — stakes for the believer vs stakes for the listener, costly-to-be-wrong vs embarrassing-to-have-claimed, fixable vs unfixable errors — or does it just lump them all together? If nothing out there carves it exactly this way, I'd take a name and definitions for the different versions too, because "my flatmate won't say she knows the door is locked" is getting old as a way to refer to this.
reasoning: |-
  Okay, the user and their flatmate had a lengthy argument about when someone can claim to "know" something, especially when the stakes change. The core issue is that the flatmate says she knows the door is locked when the cost of being wrong is low (like during a regular evening), but refuses to say she knows when the stakes are high (like before leaving for a weekend), even though the evidence—her memory of checking an hour ago—remains the same. 

  The user noticed several nuances: First, the stakes seem personal to the knower. When the user is the one at risk (coming home late), the flatmate confidently says she knows the door is locked, even though a mistake would cost the user dearly. This suggests "know" isn't about the listener's stakes but the speaker's own potential consequences. Second, embarrassment plays a role—the flatmate seems wary of saying "I know" out loud if being proven wrong would humiliate her, regardless of actual stakes. Third, if an error is easily fixable (e.g., checking via camera), she reverts to claiming knowledge, implying "know" also depends on the reversibility of a mistake. 

  The flatmate's theory is that high stakes just make her second-guess, lowering her confidence, but the user points out she admits her confidence hasn't changed—she just won't call it "knowledge." This feels like a deeper linguistic or philosophical puzzle. 

  The user wants to know:  
  1. Is there a formal name for this phenomenon?  
  2. How do philosophers break down the sub-cases (personal stakes vs. listener stakes, embarrassment, fixability)?  
  3. Are there distinct concepts for each variant?  

  I recall this aligns closely with *contextualism* in epistemology, specifically *pragmatic encroachment*. The key idea is that practical factors (like stakes) can affect whether a belief counts as knowledge, even if evidence is identical. For example:  
  - **Pragmatic encroachment**: High stakes "raise the bar" for what counts as sufficient justification. Same evidence might suffice for knowledge in low-stakes contexts but not high-stakes ones.  
  - **Interest-relativity**: Whether you "know" depends on your practical goals. If it matters more (e.g., leaving for the weekend), the standards tighten.  

  The sub-cases map to nuances within these theories:  
  - **Stakes for believer vs. listener**: Pragmatic encroachment focuses on the believer's practical interests. The flatmate cares about *her own* potential losses (e.g., burglary while she's away), not the user's. This explains why she's confident when only the user is at risk.  
  - **Embarrassment**: This ties to *assertion norms*. Some philosophers (like Timothy Williamson) argue you should only say "I know" if you’re in a position to assert it confidently. Fear of embarrassment might make her withhold the claim even if she privately feels certain.  
  - **Fixable errors**: If a mistake is easily corrected, the practical risk vanishes, so standards revert to low-stakes mode. This is still pragmatic encroachment—just with lowered stakes due to reversibility.  

  The flatmate’s "confidence drop" theory doesn’t fully hold because she admits her confidence is unchanged. Instead, it’s about *what she’s willing to claim publicly* given the consequences.  

  Recommended terms:  
  - **Main concept**: "Pragmatic encroachment on knowledge" (or "interest-relative invariantism").  
  - **Sub-cases**:  
    - "Speaker vs. hearer stakes" → Emphasize pragmatic encroachment is *speaker-centered*.  
    - Embarrassment → "Norms of assertion" or "epistemic caution in speech acts."  
    - Fixability → "Reversible error lowering practical stakes."  

  Philosophers like Jason Stanley ("Knowledge and Practical Interests") and Jeremy Fantl/Matthew McGrath ("Knowledge in an Uncertain World") have detailed analyses. For embarrassment, look to "assertion norms" (DeRose, Williamson).  

  This resolves the argument: The flatmate isn’t inconsistent—she’s intuitively tracking context-dependent standards for knowledge attribution. Next time, the user can just say, "Ah, pragmatic encroachment in action!" and enjoy the silence.
answer: |-
  This is a **fantastically** sharp observation of a real phenomenon in epistemology (the philosophy of knowledge), and it has a **very well-established name: pragmatic encroachment**. Your flatmate is intuitively tracking something philosophers have debated intensely for decades.

  Here's the breakdown, matching your observations to the concepts:

  1.  **The Core Concept: Pragmatic Encroachment**
      *   **Definition:** Pragmatic encroachment is the view that whether a true belief counts as *knowledge* isn't *just* determined by the evidence or the belief's truth, but also by **practical factors** – primarily, the **stakes** or **practical interests** of the person attributing the knowledge (the "knower").
      *   **Your Example:** Same evidence (memory of checking an hour ago, no one home). Low stakes (normal evening)? "I know it's locked." High stakes (leaving for the weekend, potential burglary)? "I don't know for *sure*; I need to check." The practical cost of being wrong "encroaches" on the standards for knowledge.
      *   **Why "Encroachment"?** Traditionally, knowledge was thought to be purely about truth, belief, and justification ("TBJ") – factors independent of practical interests. Pragmatic encroachment argues that practical concerns *encroach* on this domain, changing what counts as sufficient justification or even whether the belief qualifies as knowledge at all in that context.

  2.  **Addressing Your Sub-Cases and Nuances:**
      *   **Stakes for the Believer vs. Stakes for the Listener:**
          *   Pragmatic encroachment is almost always formulated in terms of the **stakes for the *subject* who is attributing knowledge to themselves or others** (i.e., the speaker saying "I know" or "S knows"). It's about *their* assessment of the costs *from their perspective*.
          *   **Your Observation is Spot On:** When *you* bear the cost of being wrong (you coming home late), the stakes *for her* are low. Her saying "I know" reflects *her* low-stakes context. When *she* bears the cost (her stuff getting stolen while she's away), the stakes *for her* are high, so she refuses to say she knows. This fits perfectly with standard pragmatic encroachment. Philosophers like **Jason Stanley** ("Knowledge and Practical Interests") explicitly argue knowledge is *interest-relative* to the subject.
      *   **Embarrassment / Cost of Being Caught Out (Speech Act):**
          *   This connects to **norms of assertion**. Many philosophers (e.g., **Timothy Williamson**, **Keith DeRose**) argue that you should only assert that P if you *know* that P. But conversely, the *social risk* of being wrong can also feed *back* into the willingness to *claim* knowledge.
          *   **Pragmatic Encroachment Link:** High stakes often *include* social embarrassment if you're wrong. The potential cost of being publicly shown incorrect can be a significant practical factor that raises the stakes *for the speaker*. So, while distinct as a *motive* (fear of embarrassment), it often operates *alongside* the direct stakes (burglary) as part of the overall practical cost the speaker is considering. It reinforces the encroachment effect.
      *   **Fixable vs. Unfixable Errors:**
          *   This is a **crucial and insightful** elaboration. Pragmatic encroachment theorists readily acknowledge that what matters is the **net practical cost** of being wrong.
          *   **Your Example:** If she can easily check via camera and let someone in remotely, the *effective cost* of being wrong plummets. Even if the *probability* of being wrong is the same, the *consequences* are now minor (a minor inconvenience). This dramatically lowers the practical stakes *for her*.
          *   **Result:** The justification threshold required for "knowledge" lowers back down to its low-stakes level. She happily says "I know" again because the high stakes that "encroached" have been mitigated by the easy fix. This is still pragmatic encroachment – the net stakes determine the threshold.

  3.  **Why Your Flatmate's Confidence Theory Doesn't Fully Fit:**
      *   As you noted, she admits her *confidence level* (her subjective feeling of certainty based on the evidence) hasn't changed. Pragmatic encroachment explains this: it's not that her confidence drops, it's that **high stakes raise the bar for what *counts* as sufficient justification to qualify as knowledge**. Her evidence might justify belief sufficiently for low-stakes action, but not for high-stakes action. She recognizes her evidence hasn't changed, but now *demands more* to count it as secure "knowledge" for this high-stakes purpose.

  **Putting it All Together:**

  *   **The Core Concept:** **Pragmatic Encroachment** (or **Interest-Relative Invariantism** - a specific flavor).
  *   **The Mechanism:** Practical stakes (cost of error, including embarrassment and irreversibility) for the *speaker/subject* determine the threshold of justification required for a true belief to count as "knowledge" in that context. Same evidence, different standards.
  *   **Your Sub-Cases Explained:**
      *   *Speaker vs. Listener Stakes:* Encroachment tracks the *speaker's* stakes (as the subject attributing knowledge).
      *   *Embarrassment:* Can be a component of the practical stakes (social cost) motivating encroachment; also linked to norms of assertion.
      *   *Fixable Errors:* Lower the *net practical stakes*, thus lowering the justification threshold needed for "knowledge". Reversibility mitigates encroachment.

  **Philosophers to Look Up (if curious):**

  *   **Key Pragmatic Encroachment Defenders:** Jason Stanley ("Knowledge and Practical Interests"), Jeremy Fantl & Matthew McGrath ("Knowledge in an Uncertain World"), John Hawthorne ("Knowledge and Lotteries" - touches on related issues).
  *   **Contextualism (a related but distinct view):** Keith DeRose, Stewart Cohen (argues the *meaning* of "know" shifts with context).
  *   **Norms of Assertion:** Timothy Williamson ("Knowledge and its Limits").

  **What to Call It:**

  Instead of "my flatmate won't say she knows the door is locked," you can now say:

  *   "Ah, classic **pragmatic encroachment** in action."
  *   "Her **knowledge attributions are stakes-sensitive**."
  *   "She's intuitively tracking **interest-relative invariantism**."

  This phenomenon is precisely why pragmatic encroachment gained traction. Your flatmate's intuitions align remarkably well with sophisticated philosophical arguments about how we actually *use* the word "know" in practical life. Her reluctance isn't irrational inconsistency; it's a deep, context-sensitive feature of knowledge attribution!
