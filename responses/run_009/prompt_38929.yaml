answer: |-
  You've hit on one of the most profound and contested problems in political philosophy and ethics: **the problem of tracing responsibility through causal chains rooted in unchosen circumstances.** Here's a breakdown of the conceptual landscape:

  ### Core Concepts & Established Frameworks
  1. **Moral Luck (Nagel/Williams):**  
     Your examples are textbook cases of "constitutive luck" (unchosen traits/circumstances) and "circumstantial luck" (unchosen environments). Philosophers agree these exist, but **bitterly disagree** on whether they *exonerate* individuals from responsibility.

  2. **Coercive Background Conditions (Pogge/Young):**  
     When choices are made under severe constraints (poverty, lack of education, geographic isolation), many argue the choice isn't truly free. The warehouse worker didn't "choose" to destroy her knees; she faced a **coerced choice** between survival and health.

  3. **The Responsibility Cutoff Problem:**  
     *Agreed:* Responsibility must stop tracing back somewhere (infinite regress is absurd).  
     *Contested:* **Where to draw the line?**  
     - **Libertarians/Personal Responsibility Advocates:** Draw the line at legal adulthood/mental competence ("You chose the job, you bear costs").  
     - **Structuralists/Capability Theorists (Sen/Nussbaum):** Draw the line at "genuine opportunity to choose otherwise." If no feasible alternative existed, it's not a responsibility-triggering choice.

  ### The Crucial Divide: Two Incompatible Foundations
  | **View**                  | Core Principle                                     | Your Case #1 (Diabetes)                     | Your Case #2 (Knees)                       | Weakness                          |
  |----------------------------|---------------------------------------------------|--------------------------------------------|-------------------------------------------|-----------------------------------|
  | **Choice-Autonomy Model** | Responsibility begins with capable adult consent. | "He chose junk food for decades."          | "She chose the job knowing risks."        | Ignores formative disadvantages. |
  | **Structural Fairness Model** | Responsibility requires *fair background conditions*. | "He never had real dietary agency."        | "Survival isn't a free choice."           | Risks diluting all responsibility. |

  ### What Scholars ACTUALLY Disagree On
  - **The "Agency Threshold":** At what point do constraints become so severe that consent is invalidated? *No consensus exists.*
  - **Quantifying Disadvantage:** How bad must circumstances be to negate responsibility? (Is a 1-hour bus ride to fresh food "enough" opportunity?).
  - **Foreseeability vs. Constraint:** Does *knowing* the risk (like the warehouse worker) make one responsible, even if alternatives were terrible? *Hotly contested.*
  - **Policy Implications:** Should society help those harmed by "constrained choices"? **Left:** Yes, it's justice. **Right:** Only selectively, to avoid "moral hazard."

  ### Proposed Term: **Conditional Voluntariness**
  **Definition:** An act is *conditionally voluntary* if it meets formal criteria of consent (intentional, informed, uncoerced by direct force) but occurs under background conditions so unjust that the agent lacked *meaningful alternatives*, thereby weakening or negating moral responsibility for downstream harms.

  ### Boundary Cases Testing the Concept
  1. **Edge Case A (Testing Constraint):**  
     *A miner with black lung disease.*  
     - Chose the job knowing risks, but only employer in town paid living wages.  
     - **Conditionally voluntary?** Likely yes—structural constraints dominate.

  2. **Edge Case B (Testing Foreseeability):**  
     *A trust-fund recipient who develops diabetes from gourmet excess.*  
     - Faced zero constraints, fully informed.  
     - **Conditionally voluntary?** No—privileged background negates constraint defense.

  3. **Edge Case C (The Hard Case):**  
     *A former addict (who started using as a trafficked teen) relapses after 10 years clean, needing liver transplant.*  
     - Initial harm unchosen, but subsequent agency exercised.  
     - **Contested:** Where does responsibility "start"? No philosophical agreement.

  ### Where the "Own Doing" Distinction Breaks Down
  It fails when:
  1. Choices are **adaptations to injustice** (e.g., "choosing" unhealthy food in a food desert).
  2. **Informed consent** exists but **feasible alternatives** do not.
  3. The *capacity* to choose wisely was **undermined by prior disadvantage** (e.g., poor education → poor health literacy).

  ### The State of Debate
  - **Agreed:** Pure "choice vs. chance" is a false dichotomy; chains of cause/effect exist.  
  - **Agreed:** Society bears *some* responsibility for mitigating unchosen disadvantages.  
  - **Contested:** Whether society must also mitigate harms from *choices made under duress*.  
  - **Contested:** How far back we trace causality for responsibility assignments.  
  - **Contested:** Whether helping "conditionally voluntary" victims rewards recklessness or rectifies injustice.

  **In short:** You're wrestling with the collision between **individual agency** and **structural injustice**. There's no tidy solution—only better or worse arguments about where to set the balance. The term "conditional voluntariness" captures the gray zone, but its policy implications remain fiercely disputed. The debate continues because it's fundamentally about competing values: liberty vs. equality, responsibility vs. compassion.
