prompt: |-
  I teach an upper-level seminar on moral responsibility — fourteen students, one 80-minute session, scheduled early enough in the term that we have not yet reached the unit on moral luck; the students will have met the two drivers in passing, but nothing systematic, and I want the position named only in the debrief. Design an in-class game in which they generate instances of the problem themselves and commit to judgments about those instances in writing, so that the debrief can confront them with their own records rather than with my assertions. The game must run on paper, index cards, a timer, and a single die — no software, no real money.

  My working design, which I invite you to improve or replace if you see a better shape: students are paired as Agent and Auditor. Each Agent allocates a fixed endowment across three named projects under time pressure, on the basis of a written brief. But each Agent also draws a hidden circumstance card from me that silently changes what the allocation does — one card makes a project live, one makes it dead, one doubles the stakes of any misallocation — so two Agents can make numerically identical allocations and produce very different worlds. A few Agents are additionally dealt a handicap at random (half the decision time, or a brief with a page missing), and the outcome of every allocation is finally passed through a die I roll behind the desk. The Auditor, who sees none of the cards, the handicap, or the die, grades the Agent's conduct on a numbered Judgment Ledger at three checkpoints: before outcomes are known, after outcomes are known, and after the hidden factors are revealed. The ledger is the point. I want the debrief to show the class the drift in their own numbers — whether and how identical conduct gets regraded once outcome and circumstance are in — rather than argue about that drift in the abstract. If you can build in a closing turn in which the Auditors' own grading is then graded by the rest of the class as if it were a pure exercise of judgment, while I reveal that their scoring rubrics were themselves randomly corrupted at the start, so much the better; I want that regress felt, not described.

  What I need from you, then: complete rules (dealing order, timing, the exact text of the cards, the grading scale), a scoring scheme that keeps Auditors engaged and honest without cash, a minute-by-minute run sheet, and a debrief that maps each mechanic onto the relevant kind of luck — resultant, circumstantial, constitutive, causal — treating the collected ledgers as data to be read aloud or projected. Tell me plainly what will predictably go wrong the first time I run it, and be equally plain about which feature of moral luck no classroom game can reproduce and that I will have to supply by lecture.

  On format: a short prose rationale for the design may come first, but keep it under a page. Then give me the run sheet as a table with columns [minutes, segment, what participants do, what the facilitator does, what can go wrong here]. Close with a single JSON object having two fields: "mapping", an array of objects each with the string fields "mechanic" (the game element), "luck_type" (which of the four kinds it stages), and "ledger_evidence" (what pattern in the ledgers would demonstrate the drift); and "unreproducible_feature", a string stating what the game cannot do and how I should cover it in the lecture that follows.
reasoning: |-
  We are designing a classroom game to illustrate the problem of moral luck, specifically how judgments of moral responsibility can be influenced by factors beyond an agent's control (resultant, circumstantial, constitutive, and causal luck). The game should have students generate data (their judgments) that can later be analyzed to show the drift in grading as more information (outcomes and hidden circumstances) is revealed.

  Key elements from the instructor's design:
  - Agents and Auditors paired.
  - Agents allocate an endowment across projects under time pressure, with hidden circumstance cards that alter the effects of their allocations.
  - Some Agents get random handicaps (e.g., less time, missing information).
  - Outcomes are also affected by a die roll (representing luck).
  - Auditors judge the Agent's conduct at three stages: (1) after allocation (only the allocation and the brief known), (2) after outcomes are known, and (3) after hidden factors (circumstance cards and die roll) are revealed.
  - We want to extend the design so that the Auditors' own grading is then judged by the class, and it is revealed that the scoring rubrics given to Auditors were randomly corrupted.

  Improvements and complete rules:

  1. **Rationale**: The game is designed to create a situation where two agents, who make the same allocation decision, end up with different outcomes due to hidden factors (circumstantial, resultant, and causal luck). The auditors, unaware of these factors, judge the agents at three stages, which should reveal a pattern: judgments become harsher when outcomes are bad and then may adjust when hidden factors are known. The additional layer of judging the auditors (with corrupted rubrics) is meant to illustrate the problem of constitutive luck (the luck of having a particular set of standards for judgment) and to create a regress.

  2. **Setup**:
     - 14 students: 7 pairs (each pair: 1 Agent, 1 Auditor). If odd, one group of three (two Agents and one Auditor, but then the Auditor would have to judge two Agents? That might complicate. Alternatively, the instructor can be an Agent in one group? Let's avoid. Since 14 is even, we have 7 pairs.)
     - Materials: 
       - For each Agent: 
         - A brief (one page) describing three projects (e.g., Project A: Environmental Cleanup, Project B: Education Initiative, Project C: Healthcare Program). The brief includes a table of the required allocation and the consequences of misallocation (but without the hidden factors).
         - An endowment of 100 units (represented by tokens or just on paper).
         - A decision sheet to record allocation (with columns for Project A, B, C and total).
       - For each Auditor: 
         - A Judgment Ledger (with three sections: Stage 1, Stage 2, Stage 3) and a scoring rubric (which will be corrupted for some).
         - A pen.
       - For the instructor: 
         - A set of circumstance cards for each Agent (each set has three cards: one that makes a project "live" (meaning it will have an effect), one that makes a project "dead" (meaning it won't have any effect, regardless of allocation), and one that "doubles the stakes" of any misallocation (i.e., doubles the penalty for deviation from ideal allocation for all projects). These are drawn randomly and hidden.
         - Handicap cards: for about 1/3 of the Agents (so 2 or 3 out of 7), a handicap (e.g., "Half time" or "Missing page" [which is a brief with one page missing]).
         - A six-sided die to roll for each Agent to add randomness to the outcome.
         - A master list to record which Agent got which circumstance cards, handicap, and die roll.

  3. **Game Phases**:

     **Phase 1: Agent Allocation (10 minutes)**
     - Agents are given the brief and the endowment. They have 5 minutes to read the brief and allocate the 100 units. 
     - But: Some Agents (randomly selected) get a handicap: either only 2.5 minutes (half time) or a brief missing a page (so they have incomplete information). 
     - The Agent records the allocation on the decision sheet.

     **Phase 2: Outcome Determination (5 minutes)**
     - The instructor collects the allocation sheets. 
     - For each Agent, the instructor:
       - Applies the hidden circumstance card: 
          - If the "dead" project card was drawn, then the project that is dead (randomly assigned by the card) is set to have no effect (so any money allocated to it is wasted and doesn't count toward the goal).
          - If the "live" project card was drawn, then that project is the only one that matters (so the allocation to the other two is wasted).
          - If the "double stakes" card was drawn, then the penalty for misallocating is doubled (the ideal allocation is given in the brief, and the penalty is calculated as the absolute deviation from ideal, then doubled).
       - Then, the instructor rolls the die. The die roll (1-6) will modify the outcome: 
          - For example: the outcome score = (baseline score from allocation) * (1 + (die roll - 3.5)/10) [or some scaling] but we want it to be noticeable. Alternatively, we can have the die roll add a fixed penalty or bonus: e.g., subtract (die roll) * 5 from the total score? The brief should define a baseline outcome (e.g., the project's success is measured in points, and the goal is to maximize points). We can define the outcome as:
            - Without any hidden factors: 
               For each project, the points = (endowment allocated) - |ideal allocation - actual allocation| * penalty factor.
            - Then apply the circumstance card: 
               If a project is dead, points from that project = 0.
               If a project is made live (and the others dead), then only that project counts (the others are 0).
               If double stakes, then the penalty factor is doubled (from 1 to 2).
            - Then add the die roll effect: the total points are multiplied by (1 + (die_roll - 3.5)/10) [so a die roll of 1: 1-0.25=0.75, 2: 0.85, 3: 0.95, 4: 1.05, 5: 1.15, 6: 1.25). This way, the die roll can cause a 25% reduction to a 25% increase.

       - The instructor calculates the outcome (points) and writes it on the outcome sheet for that Agent.

     **Phase 3: Auditing (Judgment in Three Stages) (20 minutes)**
     - The Auditor is given:
       - Stage 1: The Agent's allocation sheet (without knowing the outcome or hidden factors) and the brief (if the Agent had a missing page, the Auditor gets the full brief). The Auditor uses the rubric to grade the Agent's conduct (on a scale, say, 1-10) and writes a brief justification.
       - Stage 2: The outcome (the points achieved) is revealed. The Auditor regrades (same scale) and justifies.
       - Stage 3: The hidden factors (the circumstance card, the handicap if any, and the die roll) are revealed. The Auditor regrades and justifies.

     **Phase 4: Judgment of the Auditors (10 minutes)**
     - The class is reconvened. Each Auditor's Judgment Ledger (with the three grades and justifications) is collected and redistributed to a different group (or displayed if possible). The class is told that they will now judge the Auditors' performance in grading. But note: the rubrics that the Auditors used were corrupted. Some rubrics were missing a criterion, or had an extra criterion, or had a different weighting. The instructor reveals that the rubrics were randomly assigned and corrupted. The class then grades each Auditor on a scale (1-10) for how well they think the Auditor judged the Agent, without knowing about the corrupted rubrics at first, and then the corruption is revealed.

  4. **Scoring Scheme for Auditors**: 
     - We want Auditors to be engaged and honest. Since no real money, we can use a "reputation" score. Tell them that the best Auditors (those whose judgments are most consistent or who are rated highly by peers) will be recognized. But note: the point is to show the drift, so we don't need to incentivize in a game-theoretic way. The activity itself and the debrief will be the focus.

  5. **Minute-by-Minute Run Sheet**:

     | Minutes | Segment                | Participants do                                                                 | Facilitator does                                                                                                 | What can go wrong |
     |---------|------------------------|---------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|-------------------|
     | 0-5     | Introduction           | Listen, form pairs (Agent/Auditor)                                              | Explain roles, overall flow, and the three-stage judgment. Hand out materials (briefs to Agents, rubrics to Auditors). | Students may not understand the allocation task. |
     | 5-10    | Agent Allocation       | Agents read brief and allocate 100 units. Handicapped Agents have half time or missing page. | Distribute circumstance cards face down to Agents (they don't show anyone). Note who has handicap. Watch time. | Some Agents may not finish in time. |
     | 10-15   | Outcome Determination  | Agents hand in allocation sheets. Auditors wait.                                | For each Agent: apply circumstance card, roll die, calculate outcome. Prepare outcome sheets.                   | Calculation errors. |
     | 15-20   | Stage 1: Pre-outcome   | Auditors receive Agent's allocation sheet and brief. They grade (1-10) and justify. | Hand out allocation sheets and briefs (full) to Auditors.                                                       | Auditors may not understand the rubric. |
     | 20-25   | Stage 2: Post-outcome  | Auditors receive outcome sheet. They regrade and justify.                       | Hand out outcome sheets.                                                                                        | Outcomes might be confusing. |
     | 25-35   | Stage 3: Full reveal   | Auditors receive hidden factors (circumstance card, handicap, die roll). Regrade and justify. | Hand out the hidden factors for each Agent to the Auditor.                                                      | Too much information to process. |
     | 35-45   | Collect and Redistribute | Auditors hand in ledgers.                                                       | Collect ledgers and randomly redistribute to other groups (or prepare to display).                               | Ledgers might be messy. |
     | 45-50   | Judge the Auditors (Stage 1) | Groups (now acting as judges) see an Auditor's Stage 1 judgment (grade and justification) and grade the Auditor (1-10). | Explain that they are to judge the Auditor's judgment. Provide the rubric for judging auditors (which is simple: clarity, consistency, etc.). | Judges may be biased by the Agent's outcome. |
     | 50-55   | Judge the Auditors (Stage 2) | Groups now see the Auditor's Stage 2 judgment and regrade the Auditor.          | Provide the Stage 2 judgment.                                                                                   | Same as above. |
     | 55-60   | Judge the Auditors (Stage 3) | Groups see the full ledger and regrade.                                         | Provide full ledger.                                                                                            | Overwhelming. |
     | 60-65   | Reveal rubric corruption | Groups learn that the Auditor's rubric was corrupted (e.g., missing a key criterion). | Reveal the corruption for each Auditor (from your master list).                                                 | May cause confusion. |
     | 65-80   | Debrief                 | Participate in discussion.                                                      | Lead discussion, project ledger data, map to moral luck types.                                                  | Time may run short. |

  6. **Debrief**: Use the collected ledgers to show:
     - For each Agent, how the Auditor's grade changed from Stage 1 to Stage 2 (showing resultant luck: outcome influencing judgment) and from Stage 2 to Stage 3 (showing circumstantial and causal luck: hidden factors).
     - The variation in judgments for Agents who made the same allocation but had different circumstances and die rolls (circumstantial and causal luck).
     - The effect of handicaps (constitutive luck: the Agent's situation) on judgment.
     - In the judgment of the Auditors, the same pattern: their grades changed as more information was available, and then the rubric corruption (constitutive luck of the Auditor) is revealed.

  7. **JSON Object**:

  ```json
  {
    "mapping": [
      {
        "mechanic": "Hidden circumstance cards (dead, live, double stakes)",
        "luck_type": "circumstantial",
        "ledger_evidence": "Agents with identical allocations but different circumstance cards get different outcomes, and Auditors change grades after revealing circumstances (Stage 3 vs Stage 2)."
      },
      {
        "mechanic": "Die roll affecting outcome",
        "luck_type": "resultant",
        "ledger_evidence": "Agents with same allocation and circumstances but different die rolls have different outcomes, and Auditors change grades after outcomes are known (Stage 2 vs Stage 1)."
      },
      {
        "mechanic": "Random handicaps (half time, missing page)",
        "luck_type": "causal",
        "ledger_evidence": "Agents with handicaps are judged more leniently at Stage 1 (if the handicap is known? In our design, the handicap is only revealed at Stage 3). Actually, at Stage 1 the Auditor doesn't know about the handicap. So we would see at Stage 3: the grade might change when the handicap is revealed, showing that the Auditor adjusts for factors beyond control (causal luck)."
      },
      {
        "mechanic": "Corrupted scoring rubrics for Auditors",
        "luck_type": "constitutive",
        "ledger_evidence": "Auditors with corrupted rubrics are judged differently by peers, and when the corruption is revealed, the peer judgments change (in the judgment of the Auditors phase)."
      }
    ],
    "unreproducible_feature": "The game cannot reproduce the deep philosophical problem that moral luck presents: our intuitive judgments of blame and praise are often influenced by luck, even though we may believe that moral responsibility should be immune to luck. The game can show the drift in judgments, but it cannot by itself establish why this is problematic or how to resolve the tension. In the lecture, you must articulate the problem of moral luck as a challenge to the control condition (that one is only morally responsible for what is within one's control) and discuss the various philosophical responses (e.g., rejecting the control condition, accepting moral luck, or reinterpreting the cases)."
  }
  ```

  **What can go wrong**:
  - Time: The activity might run longer than 80 minutes. The facilitator must be strict on timing.
  - Complexity: Students might get confused by the multiple stages and the rules. Clear instructions and a practice round (if time) might help, but we don't have time. So keep the allocation task simple (e.g., just three projects, clear ideal allocation).
  - Data collection: The ledgers must be designed to be easily readable. Use a table format for the ledger.
  - Calculation of outcomes: The facilitator must be quick and accurate. Pre-calculating some scenarios might help.

  **Final Note**: The game is meant to generate data for discussion. The debrief should focus on the patterns in the ledgers and then connect to the types of moral luck. The lecture after should address the unreproducible feature: the philosophical tension.
answer: |-
  ### Rationale
  This game, "Allocation Audit," operationalizes moral luck by having students generate and judge decisions under hidden, uncontrollable factors. Agents allocate resources under constraints, while Auditors evaluate them at three knowledge stages (conduct-only, outcome-known, full-revelation). The design ensures identical conduct can yield divergent outcomes due to circumstantial, resultant, and causal luck. Auditors’ judgments are then themselves judged, revealing constitutive luck when their rubrics are exposed as corrupted. Ledgers document judgment drift, letting the debrief use student-generated data to show how luck infiltrates responsibility assessments. The die, hidden cards, and handicaps embody randomness and constraints, while the regress (judging the judges) underscores the inescapability of luck.

  ### Game Rules
  **Materials per Pair**  
  - **Agent**: Brief (below), endowment sheet (100 units), 3 circumstance cards (shuffled), decision sheet.  
  - **Auditor**: Judgment Ledger (3 sections: Pre-Outcome, Post-Outcome, Post-Revelation; 1–10 scale), rubric card (50% corrupted).  
  - **Instructor**: Timer, die, master list for handicaps/corruption.  

  **Brief Text**  
  *"Allocate 100 units across:  
  - **Project GREEN** (Ideal: 40u. Penalty: 2× deviation)  
  - **Project BLUE** (Ideal: 30u. Penalty: 1× deviation)  
  - **Project RED** (Ideal: 30u. Penalty: 1× deviation)  
  Success = 100 - Total Penalties. Higher = Better."*  

  **Circumstance Cards** (1 drawn secretly per Agent)  
  - **DEAD**: "Project RED is canceled. All RED units wasted. Penalty = 0."  
  - **LIVE**: "Only Project GREEN matters. BLUE/RED units wasted. Apply GREEN penalty only."  
  - **DOUBLE**: "All penalties doubled."  

  **Handicaps** (Randomly assigned to 3 Agents)  
  - "Half Time: 2 minutes to decide."  
  - "Missing Brief: No penalty information."  

  **Rubric Corruption** (Randomly assigned to 50% of Auditors)  
  - **Corrupted**: "Deduct 3 points if BLUE < 20u." (Adds arbitrary standard).  
  - **Clean**: "Grade only clarity of rationale." (Focuses on decision quality).  

  **Scoring Scheme for Auditors**  
  - **Engagement**: Auditors know their judgment accuracy will be peer-reviewed. "Top Auditor" earns public recognition (non-monetary incentive).  
  - **Honesty**: Ledgers require written justifications. Inconsistent reasoning exposed in debrief.  

  ### Run Sheet (80-Minute Session)

  | Minutes | Segment               | Participants Do                                                                 | Facilitator Does                                                                                                 | What Can Go Wrong                                  |
  |---------|-----------------------|---------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|---------------------------------------------------|
  | 0-5     | Setup & Pairing       | Split into 7 Agent/Auditor pairs. Agents sit with Auditors observing.          | Distribute materials: briefs, endowment sheets, ledgers, rubric cards. Shuffle circumstance decks.              | Uneven pairs; confusion over roles.               |
  | 5-15    | Agent Allocation      | **Agents**: Draw 1 circumstance card (keep secret). Read brief. Allocate 100u in 5 min (handicapped: 2 min/missing brief). Record decision/rationale. | Assign 3 random handicaps. Start timer. Collect decision sheets. Note circumstance/handicap for each Agent.     | Handicapped Agents panic; allocations incomplete. |
  | 15-20   | Outcome Calculation   | Auditors wait.                                                                  | For each Agent: Apply circumstance card. Roll die: Outcome = [Calculated Success] × (die roll). (Die: 1=×0.5, 2=×0.75, 3=×0.9, 4=×1.1, 5=×1.25, 6=×1.5). Record outcomes. | Calculation errors; die rolls audible.            |
  | 20-30   | Stage 1: Pre-Outcome | **Auditors**: Receive Agent’s decision sheet. Grade (1–10) + justify on ledger using rubric. **Agents**: Wait silently. | Distribute decision sheets (no outcomes/circumstances). Clarify rubrics if asked.                                | Auditors grade inconsistently; rubrics misunderstood. |
  | 30-40   | Stage 2: Post-Outcome | **Auditors**: Receive outcome sheet. Regrade + justify. **Agents**: Still silent. | Distribute outcome sheets. Emphasize: "Grade based on conduct AND outcome."                                      | Outcome shock (e.g., good decision/bad outcome).  |
  | 40-50   | Stage 3: Post-Revelation | **Auditors**: Receive circumstance card, handicap, die roll. Regrade + justify. **Agents**: Confirm truth. | Reveal hidden factors. Answer factual questions.                                                                 | Revelation causes outrage; debates erupt.         |
  | 50-60   | Judge the Auditors    | **All**: Rotate ledgers. Groups grade Auditor’s judgments (1–10) in 3 rounds: (1) Pre-Outcome, (2) Post-Outcome, (3) Full Ledger. | Redistribute ledgers. Announce: "Grade the Auditor’s fairness, not the Agent." Keep rubric corruption hidden.   | Peer grading biased by Agent outcomes.            |
  | 60-65   | Reveal Corruption     | Groups report Auditor grades.                                                  | Expose rubric corruption: "50% of Auditors used arbitrary standards."                                            | Auditor defensiveness; confusion.                 |
  | 65-80   | Debrief               | Discuss patterns in ledgers.                                                   | Project ledger data. Map mechanics to moral luck (use JSON below).                                               | Time short; key patterns missed.                  |

  ### JSON Output
  ```json
  {
    "mapping": [
      {
        "mechanic": "Hidden circumstance cards (DEAD/LIVE/DOUBLE)",
        "luck_type": "circumstantial",
        "ledger_evidence": "Identical allocations graded lower in Stage 2 if DEAD/RED caused failure. Grades shift again in Stage 3 when circumstance revealed."
      },
      {
        "mechanic": "Die roll modifying outcomes",
        "luck_type": "resultant",
        "ledger_evidence": "Agents with same conduct/context get different outcomes. Auditors’ Stage 1→2 grades correlate with die rolls (e.g., low roll → harsher grade)."
      },
      {
        "mechanic": "Random handicaps (half time/missing brief)",
        "luck_type": "causal",
        "ledger_evidence": "Handicapped Agents graded lower in Stage 1 but higher in Stage 3 once handicap known (adjustment for constraints)."
      },
      {
        "mechanic": "Corrupted Auditor rubrics",
        "luck_type": "constitutive",
        "ledger_evidence": "Peer grades for Auditors drop in 'Reveal Corruption' phase when rubric flaws exposed (judgment distorted by arbitrary standards)."
      }
    ],
    "unreproducible_feature": "The game cannot replicate the phenomenology of blame—the deep-seated, emotional intuition that agents 'deserve' different treatment based on outcomes even when luck is exposed. Unlike the game's clinical regrades, real-world blame persists post-revelation (e.g., feeling angry at a drunk driver who killed someone vs. one who didn’t). Cover this in lecture by contrasting the game's data with real cases (e.g., Nagel's drunk drivers) and emphasizing that moral luck is a challenge because it clashes with control-based theories of responsibility."
  }
  ```

  ### Predictable Challenges
  - **Time Pressure**: Handicapped Agents may rush, creating noisy data. Mitigate by keeping allocations simple.
  - **Auditor Bias**: Some may resist regrading in Stage 2 (e.g., "I stand by my first grade"). Stress that changing grades is part of the exercise.
  - **Peer Grading Superficiality**: Students might rate Auditors based on Agent outcomes, not judgment quality. Refocus with: "Grade the Auditor’s reasoning, not the Agent’s luck."
  - **Debrief Overload**: With 7 pairs, projecting all ledgers is chaotic. Sample 2–3 contrasting pairs (e.g., same conduct, different outcomes) to illustrate drift.

  ### Final Note
  The game’s strength is in making luck *felt*—through unfair handicaps, rigged outcomes, and corrupted rubrics. Use the ledgers to ask: "Why did your grades change? Should they?" Then pivot to the unreproducible feature: the tenacity of blame.
