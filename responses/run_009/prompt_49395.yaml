prompt: |-
  I have to teach Quine's indeterminacy of translation in one 90-minute session to second-years who've done basically no philosophy of language, and I want a plan rather than the doctrine itself. My thought is the rabbit/gavagai thing can't do any work until radical translation is set up properly -- the field linguist with no interpreter, only stimulus and assent/dissent to go on -- so that nothing about meaning is smuggled in from the outside. But tell me if I've got the dependency structure wrong, and whether inscrutability of reference (gavagai as undetached rabbit part) should come before or after the sturdier thesis about whole sentences, since I keep going back and forth on which one is the pedagogical entry point. Beyond that: which concrete scene should carry the whole session, and does the standard pointing-at-a-rabbit version actually produce the vertiginous conclusion or does it just feel like a party trick. The misconceptions I expect: it's just ambiguity or vagueness, it's just the underdetermination of theory by evidence (Quine invites that comparison himself, so I need to be careful where it holds and where it doesn't), and "so Quine thinks the natives might mean something totally different and we'd never know," which quietly reifies a fact of the matter. Tell me where in the sequence each one needs to get headed off, how much of stimulus synonymy I owe them or whether I can flag it and move on, and give me one question to put on the board at the end that seperates actually getting it from having memorized the rabbit joke. Also tell me what to explicitly refuse to cover at this level.
