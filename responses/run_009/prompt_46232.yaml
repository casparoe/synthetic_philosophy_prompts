prompt: |-
  For three years I have sat on my city's commemorative review panel, and I have kept a private list of my verdicts in the hope of finding the principle behind them. The cases, with my gut answers:

  1. A Confederate general's statue erected in the 1920s, decades after the war, at a time and place where such monuments were partly a statement about the racial order — remove entirely, and I don't think relegating it to a museum rotunda cures anything, since that just continues the honoring under another roof.
  2. A statue of a founding father who owned slaves, erected for his political achievement — keep, with an added plaque putting the slaveholding in full view.
  3. A university science building named for a man whose work in that very field was important but who was also a prominent eugenicist — rename, and here the plaque solution that satisfied me in case 2 strikes me as whitewashing, though I cannot articulate why.
  4. A statue of the town founder, a slave trader whose fortune built half the city, erected by grateful citizens in the 1870s — remove.
  5. A statue of someone morally comparable to the man in case 4, but carved by a sculptor of the first rank, so that it is genuinely a work of art — I keep going back and forth; my inclination is to move it indoors as art, but I distrust this, since whether honoring a person is wrong shouldn't depend on how well he was sculpted.
  6. Renaming a street that carries the name of a long-dead mayor no living person can identify — fine, but I also think it accomplishes nothing morally; there is no honor left in the name to withdraw.
  7. A mediocre statue of a man roughly comparable in virtue and vice to the founder in case 2 — I notice I want it gone, partly on the grounds that it is ugly anyway, which I recognize as no reason at all.

  My tentative principle is that a commemoration should be removed when the bad is what is being celebrated, and retained with context when the bad is incidental to what is being celebrated. It fits cases 1, 2, and 4, but it fails on 3, and it is no help at all on 5 through 7. Can any single principle capture most of my verdicts? I would like it stated precisely enough to generate verdicts on new cases — in particular, what it implies about eponymous species names in taxonomy, where a bird carries a man's name that almost no birdwatcher connects to the man, and about a stained-glass window that is at once a depiction of a slaveholding bishop and a memorial donated by his grieving family. And if some of my verdicts have to go, tell me which ones and why those rather than the others.
reasoning: |-
  Okay, let me start by understanding the user's problem. They've been on a commemorative review panel for three years and have a list of cases with their gut reactions. They want a unified principle that explains their decisions across all cases, especially where their initial principle falls short. 

  First, I need to look at each case and see the patterns. Cases 1 and 4 involve removing statues where the primary purpose was to honor figures associated with oppression (Confederate general, slave trader). Case 2 keeps a founding father's statue because the commemoration is for political achievements, not slavery, so adding a plaque provides context. But case 3 is tricky—renaming a building named after a eugenicist, even though their scientific work was important. The user feels a plaque isn't enough here. Why?

  The user’s initial principle is that removal happens when the "bad" is celebrated, not when it's incidental. That works for 1, 2, 4 but not 3. So why does case 3 differ? Eugenics might be more central to the honoree's legacy than slaveholding is to the founding father's. The founding father is celebrated for political contributions, slavery is a separate aspect. But the eugenicist's work in science might be intertwined with their eugenics advocacy, making it inseparable. Also, the building is for science, so honoring someone with such a conflicting legacy in that field creates a direct clash. 

  Case 5 is a morally bad person with a high-art statue. The user is torn. Moving it indoors as art separates the artistic value from the person, but they worry that the honor shouldn't depend on artistic merit. The key here might be whether the display context frames it as art rather than commemoration. If it's in a museum discussing the controversy, it could work. 

  Cases 6 and 7 are different. Renaming a street with an unknown mayor is neutral because there's no active honor. Removing a mediocre statue partly because it's ugly—here, the user admits the ugliness isn't a valid reason. But maybe the mediocrity means it lacks artistic value, so removing it doesn't lose much, and the person's vices make the commemoration unjustified. 

  The user also mentions two new cases: species names and a stained-glass window. For the bird species, if the name isn't associated with the person, renaming might not be urgent. The stained-glass window is both art and a family memorial, so it's multifaceted. Context matters—why is it displayed? If it's historical art with explanation, it might stay. 

  The proposed principle needs to handle intentionality (why was it erected?), resonance (what does it symbolize now?), and integrity (does the bad aspect undermine the reason for honor?). Testing this on case 3: the building's name honors scientific work, but eugenics directly contradicts scientific ethics, so the integrity is compromised. A plaque can't reconcile that. 

  In case 5, if the statue is displayed as art with context, the honor is negated, so moving it could work. Case 6 has no resonance, so renaming is fine but not urgent. Case 7: if the statue is mediocre and the person's vices are significant, removing it aligns with the principle since the honor isn't deserved. 

  The user might need to adjust their verdict on case 7, accepting that artistic mediocrity isn't the reason but that without significant contribution, the commemoration isn't warranted. For the stained-glass, if it's more about art and family grief than public honor, it might be retained with context. Species names, lacking resonance, might not need changing unless the namesake is particularly egregious. 

  Deep down, the user wants consistency and moral clarity, avoiding arbitrary decisions. They might also seek validation that some intuitions are correct while others need rethinking, especially where emotions like disgust (case 7's ugliness) interfere. Ensuring the principle is robust enough for future cases is key, balancing historical harm with current meanings.
answer: |-
  Your intuitive verdicts reveal a consistent moral logic centered on **commemorative intent versus present impact**. Your tentative principle is a strong start but can be refined into a unified framework:

  ### Proposed Principle:
  **A commemoration should be altered or removed if its *primary purpose or current perception* celebrates morally indefensible acts, or if the honoree’s harmful actions are inseparable from their commemorated legacy. It may be retained with critical context if the harm is incidental to the celebrated contribution, and the commemoration holds significant independent value (historical, artistic, or communal).**

  This principle resolves your cases and provides guidance for new ones:

  ### Applying the Principle to Your Cases:
  1. **Confederate General (Remove)**:  
     - **Why**: The statue’s *intent* (1920s racial hierarchy) *and* current perception celebrate white supremacy. No separable positive legacy.  
     - **Museum?** Correctly rejected: relocation doesn’t negate the honoring intent.

  2. **Slaveholding Founder (Keep with plaque)**:  
     - **Why**: Slavery is incidental to his commemorated achievement (founding the nation). Plaque contextualizes without erasing contribution.  
     - **Key**: Harm isn’t the *reason* for the statue.

  3. **Eugenicist Scientist (Rename)**:  
     - **Why**: Eugenics is **inseparable** from his scientific legacy. Honoring him *in a science building* implicitly endorses his full ideology, making a plaque inadequate.  
     - **Crucial distinction**: Unlike Case 2, the harm is tied to the field he’s honored for.

  4. **Slave-Trading Founder (Remove)**:  
     - **Why**: The city’s wealth (and thus its foundation) *directly stems* from his slave-trading. The commemoration celebrates the harm itself.

  5. **Immoral Figure with Great Art (Move indoors as art)**:  
     - **Why**: The statue has **independent artistic value**. Moving it to a museum reframes it as cultural artifact, not honor. Label it: "*This statue commemorates X, whose actions [harm]. We display it for its artistic significance, not to endorse his legacy.*"  
     - **Distrust addressed**: Artistic merit doesn’t absolve the person but justifies preserving the *object* as art, not tribute.

  6. **Street Named for Forgotten Mayor (Rename is fine but neutral)**:  
     - **Why**: No active "honor" exists; the name has lost commemorative resonance. Renaming is morally neutral—neither imperative nor objectionable.

  7. **Mediocre Statue of Flawed Figure (Remove)**:  
     - **Why**: Low artistic value + no unique historical contribution = no independent reason to retain. Your "ugly" reaction signals the lack of compensating value.  
     - **Adjusted verdict**: Removal aligns with the principle—no significant loss of art/history outweighs commemorating vice.

  ### Verdicts Requiring Adjustment:
  - **Case 7 must change**: "Ugliness" alone isn’t valid, but the principle confirms removal is justified due to **no compensating value**.
  - **Case 5 stands**: Reframing as art *with explicit context* negates the "honoring" function. Your instinct is defensible.

  ### New Cases Tested:
  - **Eponymous Species Name (e.g., a bird named after a racist)**:  
    - **Verdict: Retain the name**.  
    - **Why**: The name has no commemorative *resonance*; it’s a taxonomic label, not active honor. Renaming would be bureaucratic with minimal moral impact (unless the namesake’s crimes are exceptionally grave and widely known).

  - **Stained-Glass Window of Slaveholding Bishop (Family Memorial)**:  
    - **Verdict: Retain with critical context**.  
    - **Why**: It serves dual purposes—religious art *and* private family memorial. The harm (slaveholding) is incidental to the window’s primary role. Add a plaque: "*This window depicts Bishop X, who enslaved people. Donated by his family in grief, it reflects complex legacies we must confront.*"

  ### Why This Principle Works:
  1. **Intent Matters**: Addresses *why* the commemoration exists (Cases 1, 4 vs. 2).  
  2. **Harm-Legacy Connection**: Separates incidental harm (Case 2) from inseparable harm (Case 3).  
  3. **Independent Value**: Preserves art/history when reframed critically (Case 5).  
  4. **Resonance Test**: Dismisses "empty" commemorations (Case 6).  
  5. **Burden of Justification**: Requires compensating value to retain contested commemorations (Case 7 removed due to lack thereof).

  ### When Context Fails:
  A plaque is insufficient when:  
  - The harm is foundational to the honor (Cases 1, 3, 4).  
  - The setting inherently endorses the harm (e.g., science building for a eugenicist).  
  - The commemoration’s scale or prominence overwhelms context.

  Your intuitions largely hold under this principle. Case 3 is the linchpin: **commemorating someone *in a context directly tied to their harm* makes the harm unavoidable, not incidental**. This clarifies why a plaque feels like "whitewashing" there but not for the founding father.
