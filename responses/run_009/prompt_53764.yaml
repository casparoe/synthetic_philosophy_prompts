prompt: |-
  I'm trying to work out what I actually think about picking people or outcomes by lottery, going just by my gut on cases. A criminal jury of randomly selected citizens deciding guilt: fine — in fact I trust that more than I'd trust career judges. A citizens' assembly of randomly picked ordinary people hashing out abortion policy, like Ireland did before its referendum: fine. A lottery for who gets the next transplant organ among medically matched patients: fine, and honestly I'd rather have the lottery than let a committee of doctors pick. Same for a lottery allocating subsidized housing among qualified applicants. But a randomly selected panel of citizens setting the central bank interest rate: clearly bad. And full-blown lottocracy — picking the whole legislature by lot, real power, no elections — leaves me uneasy, though I can't say why its any worse than the jury, which also wields real power over someone's life. So is there a principle underneath all this? My rough guess is something like: lotteries for allocating equally valid claims, random citizens for judgements ordinary people can make, experts for technical decisions — but I'm not sure that covers the organ case, where I prefer the lottery over the experts. Whatever principle you land on, tell me what it predicts for a case I haven't mentioned (randomly auditing tax returns vs. randomly choosing which companies recieve a scarce licence, say), and be honest about which of my verdicts it can't save.
reasoning: |-
  Okay, the user is grappling with their intuitive feelings about using lotteries in different societal contexts. They've listed several scenarios where they're comfortable with lotteries (juries, citizens' assemblies, organ transplants, housing allocations) and some where they're not (central bank decisions, full lottocracy). They've proposed a rough principle about lotteries for equally valid claims and citizen judgment versus expert technical decisions, but they recognize it doesn't fully explain their view on organ allocation (where they prefer lottery over experts). They want a coherent principle that explains their pattern of judgments and can predict new cases.

  I need to unpack why they might feel differently about these cases. For criminal juries and citizens' assemblies, they mention trusting ordinary people's judgment over professionals. This suggests they value common sense or community values in certain decisions. For organ transplants and housing, they explicitly prefer lottery over committee selection, indicating distrust of subjective human judgment when claims are equal. But they reject lottery for central bank policy, which makes sense because interest rates require specialized economic knowledge. Their unease about full lottocracy is interesting - they acknowledge it's similar to juries but still feel uncomfortable, perhaps because legislative decisions require both expertise and long-term accountability that random selection can't provide.

  The organ transplant case is key - it contradicts their initial "experts for technical decisions" intuition. Here, they prefer randomness because they distrust the potential for bias in committee decisions, even though medical matching is technical. This points to a deeper concern about fairness and corruption when stakes are high and discretion exists. Their principle might need to incorporate not just the nature of the decision but also the risk of abuse in discretionary systems.

  For a unified principle, I'm considering something about the balance between three factors: whether the decision is about value judgments versus technical expertise, whether claimants have equal validity, and whether discretion creates unacceptable bias risks. The organ case shows that when technical experts have discretion in high-stakes allocations, lottery may be better despite the technical aspect. The central bank case lacks equal claimants entirely - it's about optimal policy, not allocation among equals. Full lottocracy fails because legislatures need both expertise and accountability mechanisms that random selection doesn't provide.

  Testing this on their new examples: Random tax audits? Likely fine because it deters cheating through unpredictability and avoids profiling bias. But random allocation of scarce licenses? Problematic if companies aren't equally qualified - it could waste resources and reward incompetence. Their principle would approve tax audits (procedural fairness) but reject license lotteries unless qualifications are truly equal.

  This principle explains most of their judgments except perhaps citizens' assemblies - why trust amateurs on complex policy? But they see it as values-based deliberation, not technical optimization. Their unease about lottocracy remains justified because accountability matters more there than in temporary juries. I should note that the line between "values" and "technical" decisions can be fuzzy - abortion policy has both aspects, yet they accepted Ireland's approach. The key is whether societal values should dominate.

  Ultimately, their intuition points to a sophisticated understanding that randomness serves fairness and anti-corruption when claims are equal, while deliberation or expertise is needed elsewhere. The organ case isn't an outlier - it's where avoiding biased discretion trumps technicality. I'll structure this as a clear principle with conditions, test it against their cases, and honestly note where it might deviate from their gut feelings about legislative lotteries.
answer: |-
  Here's a principle distilled from your intuitions, refined to cover the organ allocation case and tested against new scenarios:

  **The Randomness Legitimacy Principle:**
  Random selection is legitimate when:
  1.  **Claims are Roughly Equal:** The candidates/options have met a legitimate threshold of eligibility or validity (making their claims non-trivial and comparable).
  2.  **AND Decision Type is Suitable:** The core nature of the decision falls into one of these categories:
      *   **A. Value Judgement/Community Representation:** Determining shared societal values, norms, justice, or "what is right/fair" in a specific context (where diverse perspectives *are* the expertise).
      *   **B. Anti-Corruption/Fairness Assurance:** Allocating a scarce good/service where discretionary human judgment poses a high risk of bias, corruption, or unfair advantage, *even if some technical expertise exists*.
  3.  **AND Accountability/Competence is Managed:** Mechanisms exist to ensure basic competence (e.g., jury instructions, expert advisors to citizens' assemblies) or the consequences of incompetence are bounded (e.g., a jury's decision applies to one case).

  **Applying this to your cases:**

  1.  **Criminal Jury:**
      *   *Equal Claims?* Defendants have a right to a fair trial (equal claim to justice).
      *   *Decision Type?* A. Value Judgement (guilt/innocence based on evidence & law - community standards matter). B. Anti-Corruption (avoiding biased/judicial corruption).
      *   *Competence?* Managed via instructions, judge oversight, deliberation. ✅
  2.  **Citizens' Assembly (Abortion):**
      *   *Equal Claims?* Citizens have equal stake in fundamental societal norms.
      *   *Decision Type?* A. Value Judgement (profound societal/ethical question). ✅
  3.  **Organ Transplant Lottery:**
      *   *Equal Claims?* Medically matched patients have equal claim based on need & eligibility.
      *   *Decision Type?* **B. Anti-Corruption/Fairness Assurance.** Technical expertise (matching) is used *before* the lottery to define the pool of equals. The core allocation *among* equals uses lottery to *eliminate* bias/subjectivity in life-or-death choice. ✅ (Explains why lottery > experts *for the final allocation step*).
  4.  **Subsidized Housing Lottery:**
      *   *Equal Claims?* Qualified applicants meet the threshold for need/eligibility.
      *   *Decision Type?* B. Anti-Corruption/Fairness Assurance (preventing favoritism/bias in allocation). ✅
  5.  **Central Bank Interest Rate Panel:**
      *   *Equal Claims?* **NO.** There are no claimants with "equal validity" to set the rate. It's about optimizing complex technical outcomes (inflation, employment, growth), not allocating among equals or representing values.
      *   *Decision Type?* **Not A or B.** It's fundamentally a **Technical Optimization** problem requiring specialized, continuous expertise and analysis of vast data. Random citizens lack the necessary competence, and "values" are secondary to technical efficacy. ❌
  6.  **Full-Blown Lottocracy (Legislature):**
      *   *Equal Claims?* Citizens have equal claim to representation (in theory).
      *   *Decision Type?* **Mixed, but Competence/Accountability fails.** While *some* legislative work involves A. Value Judgement, *much* is complex B. Technical Optimization (budgets, regulations, treaties, oversight) requiring sustained expertise and deep subject knowledge. Crucially, the **Accountability/Competence** condition fails: Legislators need long-term learning/relationships, and lack of elections removes democratic accountability. The scale and scope make "managing" competence via advisors impractical. Your unease likely stems from this mismatch and lack of accountability. ❌

  **Predictions for New Cases:**

  1.  **Randomly Auditing Tax Returns:**
      *   *Equal Claims?* All taxpayers are potentially subject to audit (equal claim to scrutiny? Or rather, equal obligation?).
      *   *Decision Type?* **B. Anti-Corruption/Fairness Assurance.** This is classic. Randomness deters cheating by creating uncertainty and prevents targeting based on bias/politics. It ensures the *process* of selection is fair, even if the audits themselves require expertise. The competence (auditing) is handled by professionals *after* the random selection.
      *   **Prediction:** ✅ Legitimate under this principle. Matches your gut (likely fine).

  2.  **Randomly Choosing Which Companies Receive a Scarce License (e.g., broadcasting spectrum, mining right):**
      *   *Equal Claims?* **Highly Questionable.** Are all applicants *truly* equally qualified? Does "qualified" just mean "met minimum legal requirements" (making claims roughly equal) or should merit/experience/capacity matter significantly (making claims unequal)? This is crucial.
      *   *Decision Type?* **Likely Not Suitable.** If the license is highly valuable and its effective use matters significantly for public good/economic efficiency (beyond just meeting minimum requirements), then:
          *   It's primarily a **Technical Optimization/Merit Selection** problem (who will use it best?).
          *   Randomness fails B. Anti-Corruption only if merit *should* dominate. If a lottery is used where merit *should* matter, it wastes public resources/rewards luck over competence.
          *   If *only* minimum requirements exist and no further merit distinction is possible/desired, *then* it might fit B. Anti-Corruption. But this is rare for valuable licenses.
      *   **Prediction:** ❌ **Not Legitimate under this principle** (unless truly no valid merit distinctions exist). Your gut would likely balk at giving a crucial license to a manifestly less capable company purely by luck.

  **Which of Your Verdicts Can't Be Fully Saved (and Why):**

  *   **Citizens' Assembly on Abortion:** The principle justifies it under A. Value Judgement. However, some might argue complex policy like abortion *also* involves significant technical elements (medical, legal nuances). Your principle prioritizes the core *values* aspect, but someone could challenge whether random citizens are truly the *best* way to resolve such multi-faceted issues, even with expert advisors. Your gut accepts it; the principle justifies it, but it's arguably the case where the "Value Judgement" category is stretched furthest into complex policy.

  **Conclusion:**

  Your intuition is remarkably coherent. The principle hinges on **equality of standing** and whether the decision is fundamentally about **values/representation** or **avoiding corruption in allocation**, rather than **technical optimization requiring expertise**. Randomness shines for fairness among equals and injecting diverse perspectives on values, but falters badly for complex, ongoing technical tasks requiring specialized knowledge and accountability. The organ transplant case fits perfectly under Anti-Corruption *after* technical pre-qualification.

  This principle explains your unease with lottocracy: legislatures require sustained technical optimization and accountability that random selection can't provide, unlike a single-issue citizens' assembly or a one-off jury decision.
