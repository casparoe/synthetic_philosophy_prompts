answer: |-
  ## The Threshold Tango: A Dialogue on Consequentialism and Supererogation

  **Characters:**
  *   **Max:** A maximizing consequentialist.
  *   **Sera:** A defender of supererogation.

  **Setting:** A quiet corner of a university library.

  **(Max is reading; Sera approaches, looking thoughtful.)**

  **Sera:** Max, I was just re-reading that paper on consequentialism and supererogation. That argument you always make... it still troubles me. How *can* you deny that someone donating a kidney to a stranger is going *beyond* what duty requires? It seems so clear-cut.

  **Max:** (Looks up, setting his book aside) Because, Sera, the clarity is an illusion. If donating that kidney *genuinely* produces the greatest net good compared to *any* other action available to that person at that moment – including keeping it – then it was, quite simply, their moral obligation. To call it "beyond duty" implies they had a permissible alternative that produced *less* good. But if a less-good alternative exists, why would choosing the *better* one be praiseworthy? Praise should track the obligatory, or perhaps the difficult, but not the merely "better than bad enough."

  **Sera:** But that’s precisely where your monistic ‘ought’ collapses crucial distinctions. Duty *isn’t* the same as maximal good production. Duty is a *threshold*. It demands we act *well enough*, ensuring we don’t cause undue harm and contribute a reasonable share. Once we cross that threshold of basic decency and minimal contribution, we enter the realm of the supererogatory. *There*, we can do *more* – much more – and that excellence merits genuine moral credit. Omitting that extra act isn’t *wrong*; it’s just not saintly. Hence: praiseworthy but not obligatory.

  **Max:** And who sets this magical threshold, Sera? "Well enough"? "Reasonable share"? These are hopelessly vague and, frankly, arbitrary. Why is donating 10% of your income the ‘duty’ line, and 20% supererogatory? Why not 15% or 5%? Your "threshold" seems like a convenient fiction to let people off the hook for not doing the *best* they can. It smuggles in complacency. Isn’t it far simpler and more honest to say we *ought* to do the best, and praising acts that achieve significant good, especially when difficult or costly, is simply a powerful social tool? It encourages more good-producing behaviour. We praise the kidney donor because we want more people to consider such acts, knowing full well that, strictly speaking, if it *was* the best option, it *was* required.

  **Sera:** (Leans forward) Ah, Max, now *that’s* the point where your explanation feels deeply inadequate, even cynical. You reduce our admiration for the kidney donor to mere social engineering? When we call that act noble, selfless, or heroic, we aren’t just deploying a behavioral incentive; we’re recognizing a quality of *character* and an *excellence* of action that transcends a baseline requirement. Your "useful tool" diagnosis makes our moral praise seem manipulative, a Pavlovian bell for societal benefit. But genuine admiration for supererogation feels like a response to intrinsic moral value, not a calculated nudge. Can you honestly say your heart doesn't recognize a fundamental difference between the *obligation* to not steal and the *admiration* for someone who gives away their life savings to save strangers?

  **Max:** (Pauses, considering) I feel the psychological pull, Sera, I grant you that. And the incentive *is* tied to recognizing the difficulty and the magnitude of the good done – factors that *are* morally relevant within consequentialism. But let me press you back on your own ground. You say duty is a threshold. But doesn't your theory struggle just as much to explain the *intensity* of different wrongs? If I have ten dollars and a starving child needs five for food, my duty might demand I give five. But if I only give four, I've failed my duty – I'm blameworthy. If I betray my closest friend for personal gain, I am also blameworthy. On your view, both are "below the threshold." But the *wrongness* feels categorically different! One is a failure to meet a minimal demand of beneficence; the other is a profound violation of loyalty and trust. My view captures this: both reduce net good, but the *magnitude* and the *nature* of the harm (broken trust causes deep, lasting harm) explain the difference in intensity. Your "threshold" flattens the landscape below it.

  **Sera:** (Nods slowly) That’s a fair challenge, Max. The *degree* of wrongness below the threshold needs explaining, and perhaps my satisficing structure needs refinement to incorporate the *type* of duty breached – negative vs. positive, fidelity vs. beneficence. But notice: even if the *intensity* of blame varies for different threshold violations, the *presence* of blame marks them all as failures of *duty*. Conversely, *above* the threshold, the absence of blame for omission marks the supererogatory space. Your monistic ‘ought’ struggles to explain why *failing* to donate a kidney (assuming you’ve met your basic duties) feels *so* different from failing to give that last dollar to the starving child, or worse, betraying your friend. The first feels like a missed opportunity for greatness, the latter two feel like active wrongdoing demanding blame. Only a structure recognizing a threshold for obligation can capture that categorical difference in the *absence* of blame. Your view must either condemn the non-kidney-donor as blameworthy (which seems far too harsh) or dilute the blame for the friend-betrayer by putting both failures on the same continuum (which seems far too lenient). The dual character of supererogation – credit but no blame for omission – points to a real structural feature of morality, not just psychological trickery.

  **Max:** Hmm. You argue forcefully that my view risks harshness or dilution. And I concede that psychologically, the distinction feels real. But I still see the threshold as arbitrary and the praise for supererogation as ultimately rooted in its good-consequences, both direct and indirect. However... (he gestures slightly) I acknowledge the pull of your kidney donor example. Reducing that pure admiration to *just* social engineering does feel... reductive, even if I think it's functionally accurate. Perhaps the difficulty and sacrifice involved create a *special kind* of good – the good of moral exemplarity – that deserves recognition *as* maximal good in those specific contexts? I need to ponder that.

  **Sera:** And I’ll grant your point about needing a richer account of wrongness below the threshold. The nature of the duty breached *does* matter. But I maintain that difference pales compared to the chasm between falling short of duty and merely failing to soar above it. The space for genuine, unblameworthy moral choice beyond the minimum – that’s the realm of supererogation, and consequentialism’s relentless ‘ought’ can’t quite fence it off. Thanks for the spar, Max. You always push me to sharpen my arguments.

  **Max:** (Smiles wryly) Likewise, Sera. That chasm you see... I still see a smooth slope. But perhaps the incline is steeper in some places than others. Food for thought, definitely. Another round tomorrow?

  **Sera:** Absolutely. Tomorrow.

  **(They both return to their books, the unresolved tension hanging in the air, a testament to the depth of the debate.)**
