prompt: |-
  My oldest friend, Maya, has been ruling on hypothetical promise cases since we were graduate students together; she treats them the way other people treat crossword puzzles. Her track record, in the order she decided them:

  1. A promise extracted at gunpoint (drive the getaway car or else): not binding.
  2. A promise made during a blackout caused by a drug interaction — sincere in tone, entirely unremembered, and the promisee had no reason to suspect anything was off: not binding.
  3. A promise made because the promisee fabricated an emergency that didn't exist: not binding.
  4. A promise to look after a friend's cat while the friend traveled, later expressly released — the friend said, in front of witnesses, that she was free of it and shouldn't feel bound at all, while still quietly hoping she'd do it: not binding.
  5. A promise made to her father, while he was dying and fully lucid, to keep the family house in the family — performed years after his death: binding.
  6. A vow spoken at the graveside, addressed to her already-dead father, no promise ever having been made while he was alive: not binding.
  7. A promise to a four-year-old to attend the school play — the child too young to grasp the very idea of promising, but old enough to wait by the window all afternoon: binding.
  8. A silent, never-communicated vow to pay for a friend's surgery, existing only in her own head and her diary: not binding.

  Next month's case: a field linguist who has spent years with an isolated community that has no institution of promising — no vows, no oaths, no concept of a binding commitment. Their nearest practice is announcing one's intentions, which they treat as forecasts that may or may not come true. In their language she tells them, truthfully and with full seriousness, that she will bring medicine next month. They understand her as forecasting her own behavior, weigh the forecast accordingly, and stake a great deal on it. Maya will be asked whether the commitment binds.

  I want a careful extrapolation from her record, not a survey of the literature:

  - Which accounts of why promises bind actually survive all eight verdicts — assurance or expectation-based views, social-practice views, consent- or will-based views, and anything else worth taking seriously — and which are already eliminated by a specific ruling (say which ruling kills which). Note the variants each survivor needs to absorb cases like the dead father or the four-year-old.
  - What each surviving rule predicts for the medicine case, and whether any rule is forced into an uncomfortable distinction between a promise's bindingness and some nearby ground of obligation (like a duty to make good on induced reliance).
  - Your best guess at Maya's verdict, with your reasons for preferring that reading of her: which of the eight rulings does the most work, and is any of them close enough to tension with your guess that you'd want to ask her about it first?
  - The single further case — other than the medicine case itself — whose verdict would best divide the surviving rules, and what each rule would say about it.

  End with a final line, exactly of the form \answer{BINDING} or \answer{NOT BINDING}, giving your prediction for the medicine case.
reasoning: |-
  Hmm, let me tackle this fascinating problem about promise binding. The user presents eight precedent cases decided by Maya and asks me to extrapolate her reasoning for a ninth case involving a linguist's commitment to an isolated community without a concept of promising. 

  First, I need to analyze which philosophical theories of promise-binding survive all eight rulings. Looking at the cases:

  - Ruling 1 invalidates consent-based views since consent under duress isn't valid. 
  - Ruling 2 challenges will-based theories because the promisor lacked capacity.
  - Ruling 3 undermines expectation-based views since reliance was fraudulently induced.
  - Ruling 4 complicates social practice theories as the promise was formally released.
  - Ruling 5 is interesting - the deathbed promise binds despite no reliance or enforcement mechanism, suggesting something about the act itself matters.
  - Ruling 6 contrasts with 5 - a vow to the dead doesn't bind, implying the promisee's existence matters.
  - Ruling 7 is surprising - a promise to someone who can't understand promising still binds, which strains most theories.
  - Ruling 8 shows uncommunicated intentions aren't binding.

  The theories that survive seem to be hybrid assurance-social practice views, with adjustments. Assurance theory needs modification for case 7 (child can't understand assurance), while social practice theory must account for case 5 (no ongoing practice with the dead). 

  For the medicine case, these theories diverge:
  - Assurance: No binding promise since no mutual understanding of commitment
  - Social practice: No binding promise without shared institution
  - Hybrid view: Might bind due to context creating quasi-practice

  The key tension is between rulings 5 (binding deathbed promise) and 6 (non-binding graveside vow). The difference appears to be the promisee's state - alive and capable versus deceased. This suggests Maya might prioritize the promisor's serious commitment when communicated to a capable recipient, regardless of cultural context. 

  I predict NOT BINDING for the medicine case, as the community lacks the conceptual framework to receive a promise, similar to how the deceased in ruling 6 couldn't receive a vow. The strongest precedent is ruling 2 - lack of mutual understanding voids commitment.

  A good test case would be a promise made to someone with dementia who intermittently understands promises. The theories would split on whether lucid moments create bindingness.

  Ultimately, I think Maya will rule NOT BINDING, consistent with her pattern that binding promises require a meeting of minds about commitment, which is absent here.
answer: |-
  Based on Maya's rulings, we identify surviving accounts of promise binding and extrapolate to the medicine case.

  ### Surviving Accounts & Eliminated Views
  - **Eliminated: Pure Consent/Will-Based Views** (Killed by Ruling 2 & 3).  
    Ruling 2 (blackout promise) shows bindingness isn't solely about the promisor's will (she was sincere but incapacitated). Ruling 3 (fabricated emergency) shows reliance on a defective "consent" doesn't bind.  
  - **Eliminated: Pure Reliance/Expectation-Based Views** (Killed by Ruling 4 & 5).  
    Ruling 4 (released cat promise) had induced reliance (friend hoped) but wasn’t binding. Ruling 5 (deathbed promise) bound despite no reliance (father dead).  
  - **Eliminated: Simple Social-Practice Views** (Killed by Ruling 7 & 6).  
    Ruling 7 (promise to child) binds though the child lacks cultural understanding of promising. Ruling 6 (graveside vow) fails despite existing in a promise-rich culture.  
  - **Eliminated: Internal Commitment Views** (Killed by Ruling 8).  
    Uncommunicated vow isn’t binding.  

  **Survivors: Hybrid Assurance + Normative Practice Accounts**  
  Must absorb:  
  - *Ruling 5 (deathbed promise)*: Binding due to **assurance given to a capable recipient** (lucid father) creating a moral debt, even posthumously.  
  - *Ruling 7 (child promise)*: Binding because **assurance was communicated and accepted** (child waited), despite the child’s conceptual lack. Focus shifts to the promisor’s duty to honor the *relationship*, not the promisee’s understanding.  
  - *Ruling 4 (released promise)*: Not binding because **express release** dissolves the obligation, overriding residual reliance.  
  - *Ruling 6 (graveside vow)*: Not binding because **no assurance was received** (father dead).  

  This hybrid requires:  
  1. **Assurance:** A sincere, communicated commitment intended to induce reliance.  
  2. **Capable Recipient:** The promisee must be capable of receiving assurance (alive/lucid, per Rulings 5 vs. 6).  
  3. **Normative Context:** The act must occur in a relationship/framework where such commitments generate duties (absent in Ruling 1/duress).  

  ### Prediction for Medicine Case
  - **Hybrid Assurance View:** **NOT BINDING**. The community lacks the concept of binding commitment; they interpret her words as a forecast, not assurance. No mutual understanding of a promissory norm exists.  
  - **Uncomfortable Distinction:** This view *must* distinguish binding promises from **reliance-based obligations**. While the promise isn’t binding, Maya might still impose a duty to mitigate harm from reasonable reliance (e.g., if lives depended on the forecast).  

  ### Best Guess for Maya's Verdict: NOT BINDING  
  **Why:**  
  - **Key Precedent:** Ruling 2 (blackout promise) does the heaviest lifting. The promisor’s sincerity and the promisee’s innocence are irrelevant if the communicative act lacks mutual normative recognition (here, no shared institution of promising).  
  - **Tension with Ruling 7?** The child case (binding) seems closest but differs crucially: The child *accepted* the assurance behaviorally (waiting), creating a relational duty. Here, the community *reinterprets* the utterance as a non-binding forecast.  
  - **Ask Maya?** Clarify Ruling 5 (deathbed promise): Why does a promise bind when the recipient dies, but not when no recipient ever existed (as in the medicine case, where the concept is absent)?  

  ### Best Dividing Case  
  **Case:** A promise made to a person with severe dementia who smiles and nods but cannot comprehend promises, in a culture where promising is institutionalized. The promisee’s family relies on it.  
  - **Hybrid Assurance View:** **NOT BINDING** (recipient incapable of receiving assurance, per Ruling 6).  
  - **Alternative Social-Relational View:** **BINDING** (if the practice exists culturally and reliance is induced).  

  This tests whether "capable recipient" requires individual understanding (per Maya’s child case) or cultural context alone suffices.  

  \answer{NOT BINDING}
