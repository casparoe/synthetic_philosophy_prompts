prompt: |-
  quick background so you know what vocabulary to pitch this in: I did a physics PhD (statistical mech, a bit of QFT) and now do ML engineering, so my native language for anything involving adding up infinitely many things is divergent series, summation conventions like Cesaro and Abel summation, regularization, renormalization, improper priors, and order-of-limit pathologies. Recently a friend in an EA-adjacent reading group got me into the infinite ethics literature — the cluster of problems about what happens to consequentialist aggregation when the universe contains infinitely many welfare subjects — and I keep having the feeling that I've seen each puzzle before in a different costume, but I can't tell whether that feeling is insight or just pattern-matching.

  here's the ask. Restate the main debates in infinite ethics in my vocabulary, as faithfully as you can. At minimum I want these three translated: (1) infinitarian paralysis, where any finite change to an infinite world leaves the total the same (or undefined), so no action we could take ever makes a difference; (2) the family of responses that compare worlds by looking at finite subsets of people, expanding the subsets, and taking limits, where a lot rides on the fairness constraints you put on which people get included at each stage; and (3) the more deflationary move that says we should just be indifferent among infinite worlds and get on with our lives. If there are other major positions in the debate that don't fit neatly under those three, translate those too.

  then I want the residue report, which is the part I actually care about. Which parts of the philosophers' disagreement are just choosing a summation convention — the kind of thing that in my world would be settled by "whichever one makes the downstream math nice" and is arguably aesthetic rather than substantive? Which parts have a real counterpart I should recognize — for instance, I've gathered that one objection to the expansion approaches is that reshuffling which people you include when can flip the verdict, which smells exactly like the Riemann rearrangement theorem for conditionally convergent series, but I want to know whether the moral version adds anything the theorem doesn't already say? And which parts have no expression in my vocabulary at all — like the fact that the terms being summed are people with identities and locations rather than anonymous contributions, or the worry that a discounting scheme makes what matters depend on where the agent happens to stand. One more specific thing: does treating the discount-the-neighborhood moves as analogous to renormalization smuggle in an assumption (renormalization is fine because we only care about predictions at a scale, but axiology is supposed to be about the total, no?) that already settles a philosophical question under the guise of translation. Finally, give me your honest read: does the residue point at something my vocabulary can't say, or at something in the original debate that's less substantive than it looks? I'd rather be told the philosophy reduces to picking a convention than be flattered, but I'd also rather not miss something real just because it doesn't look like math.
reasoning: |-
  We are going to approach this step by step, as requested.

   Step 1: Restate the main debates in infinite ethics using your vocabulary.

   (1) Infinitarian paralysis:
      - In your terms: Consider a universe with infinitely many welfare subjects. The total welfare is a divergent series (or undefined). Any finite change (local perturbation) to the welfare distribution leaves the total unchanged (still divergent or with the same divergence character) or undefined. This is analogous to how in QFT or statistical mechanics, adding a finite number of terms to a divergent series doesn't change its divergence. Thus, we have "paralysis" because the action doesn't change the total.

   (2) The expansion approaches (with fairness constraints):
      - This is about defining a summation convention for the welfare series. The idea is to take a sequence of finite subsets (like nested boxes in space or increasing time intervals) that grow to cover the whole universe. Then we compute the average welfare per subject (or total welfare) in each subset and take a limit. However, the result can depend on the choice of subsets (the "foliation" or "exhaustion" of the infinite set) and on how we sample. 
      - The fairness constraints are like conditions on the summation method (e.g., Cesaro or Abel summation) to ensure that the limit exists and is independent of the path (or at least, independent under reasonable symmetries). But as you know from the Riemann rearrangement theorem, conditionally convergent series can be rearranged to converge to any value. Similarly, if we don't have absolute convergence (which we typically don't in infinite ethics because the welfare series is often conditionally convergent or divergent), then the way we order the subjects (which is equivalent to the choice of subsets and their order of inclusion) can change the outcome.

   (3) The deflationary move (indifference):
      - This is the stance that all divergent welfare series are in the same equivalence class (or undefined) and thus we should be indifferent. In regularization terms, we might say that the regularized total is always infinity (or minus infinity, or undefined) for any non-trivial state, so we cannot compare. Therefore, we should focus on what we can affect (finite beings) and ignore the infinite part.

   Step 2: Residue report.

   (a) Parts that reduce to choosing a summation convention:
      - The core of the expansion approaches (2) is exactly about choosing a summation convention. The fairness constraints (like requiring the subsets to be "balanced" or to respect some symmetry) are attempts to pick a convention that is "natural" (e.g., Lorentz-invariant in QFT, or translation-invariant in statistical mechanics). The philosophers are arguing over which convention is "fair", which is analogous to arguing over which summation method preserves the linearity and stability properties we want. This is aesthetic/substantive only in the sense that we want the convention to respect our moral intuitions (like anonymity, or spatial/temporal symmetry) in the finite case.

      - The infinitarian paralysis (1) is a direct consequence of trying to use the "actual sum" (if it exists) and finding that it doesn't change under finite perturbations. But if we adopt a different summation convention (like Cesaro), then a finite change might change the average in the limit. So paralysis is only absolute under the conventional sum of a divergent series.

   (b) Parts that have a real counterpart you should recognize:
      - The rearrangement problem in the expansion approaches is exactly the Riemann rearrangement theorem. The moral version doesn't add anything mathematically new, but it does add a normative layer: is it morally acceptable to rearrange? The philosophers are concerned with whether the ordering of the subsets (which might be based on spatial location, time, or some other index) is arbitrary or whether it should respect some moral priority (e.g., temporal proximity to the agent, or giving equal weight to all subjects). The theorem says that without absolute convergence, the result is order-dependent. The moral version then asks: is there a morally privileged ordering? And if not, then the expansion approach is flawed.

   (c) Parts that have no expression in your vocabulary (or that add new elements):
      - The non-anonymity of subjects: In math, the terms in a series are just numbers. In ethics, each term is a person with an identity and location. This matters because:
          * We might care about the distribution of welfare (not just the total) if we have prioritarian or egalitarian intuitions. This is like caring about the variance or higher moments, not just the mean.
          * We might care about the agent-relative obligations: e.g., should we discount the welfare of subjects far away in space or time? This is like introducing a discount factor that breaks translational symmetry. In math, we can do that, but in ethics, we have to justify why the discount factor is there (e.g., due to epistemic limitations, causal influence decay, or moral parochialism). 
          * The worry about "where the agent stands" is a symmetry-breaking: in physics, we often assume translational invariance, but an agent is at a particular location. This leads to discounting schemes that are centered on the agent (like a Gaussian discount over distance). This is a form of regularization (like a cutoff) that makes the sum converge, but it breaks the symmetry. The philosophical question is whether this is morally justified.

      - The renormalization analogy: You point out that renormalization in physics is about effective theories at a scale, but axiology is about the total. This is a key difference. If we use a discounting scheme (like a spatial or temporal discount) to get a finite total, we are effectively saying that we only care about the "local" universe. But if the universe is infinite, then the total (without discount) is still infinite, so we are changing the question. This smuggles in the assumption that only the local part matters, which is a substantive philosophical claim (e.g., due to practical limitations, or because we are morally obligated only to those within a certain horizon). 

   (d) Honest read:
      - A significant portion of the debate (especially about the expansion approaches) is indeed about choosing a summation convention. The paralysis and the deflationary move are natural consequences of sticking to the conventional sum. However, the ethical context adds constraints that don't appear in pure math: we have to justify the convention by moral principles (like fairness, anonymity, impartiality). 

      - The residue that doesn't reduce to math includes:
          * The agent-relative considerations: In physics, we don't typically have a preferred center (unless we are doing cosmology with an observer). But in ethics, the agent is at a particular location and time, and that breaks the symmetry. This leads to discounting schemes that are not symmetric and hence not "fair" in the impartial sense.
          * The non-anonymity: We might care about specific people (like our children) more than others. This is like having weights that are not uniform. The expansion approaches that use symmetric subsets are trying to avoid this, but if we allow agent-relative weights, then we have a different summation.

      - Also, note that in physics we are often happy with a convention that gives us predictive power, but in ethics we are trying to capture what we "ought" to do. So even if a summation convention is mathematically nice, it must align with our moral intuitions (at least in the finite cases) and be justifiable on normative grounds.

      - Finally, I think the Riemann rearrangement issue is exactly as you say: it's the theorem showing that without absolute convergence, the result is order-dependent. The moral debate then becomes: can we find an ordering that is morally privileged (e.g., by time, by space, by some natural ordering)? If not, then we must either reject the expansion approach or accept that it's arbitrary. This is a substantive philosophical problem because it forces us to decide if there is a natural ordering in the universe (like a cosmic time) that we should use.

   Conclusion:
      - Much of the debate is about choosing a summation convention, and the paralysis is a consequence of not choosing one (or choosing the conventional one). However, the ethical context imposes additional constraints (fairness, agent-relative duties) that make the choice more than just aesthetic. The residue includes the agent-relative aspects and the non-anonymity of persons, which are not present in mathematical series. Also, the renormalization analogy breaks down because we are not just interested in the effective theory at a scale but in the total value. Therefore, using discounting as regularization is a substantive move that might be philosophically controversial.

      - My honest read: Your vocabulary captures the core mathematical structure, but the ethical debate adds normative constraints that are not just about mathematical elegance. However, a lot of the disagreement among philosophers is indeed about which summation convention to adopt, and that is a convention. The rest is about how to justify that convention morally. So the debate is partly substantive (because the moral justifications are in play) and partly conventional (because without a convention, we get paralysis).

      - One more thing: In your world, you might choose the convention that makes the downstream math nice. In ethics, we might choose the convention that makes the downstream moral decisions align with our considered judgments (like saving a life is good, and we can do that without worrying about the infinite tail). But note: our considered judgments might be formed in finite contexts, so extending them to infinity is nontrivial.

