answer: |-
  Here is a sestina crafted from Otto's perspective, designed so its form enacts the extended mind thesis, adhering strictly to your requirements:

  **Sestina: Otto's Parity Principle**

  This morning started like the rest: my **eyes**
  Struggled to fix the world inside my **head**.
  The brittle film of recent thought, **forgetting**
  Its hold. But here, the worn familiar **pages**
  Offer their anchor. With deliberate **ink**
  I trace the needed fact: new gallery **entries**.

  The walk demands I check the **entries**.
  Street signs blur past my aging **eyes**.
  I pause beneath a lamp, scan smudged blue **ink**:
  "The Modern, 53rd Street." Inside my **head**
  No map persists, just trust in these thin **pages**
  That hold what time insists on **forgetting**.

  Is it the flaw, this constant **forgetting**,
  Or just the way I manage **entries**
  Of vital things? Without these **pages**
  The world dissolves before my **eyes**.
  The city's grid within my **head**
  Exists because I trusted in the **ink**.

  A habit now, this faith in **ink**,
  The only cure I know for **forgetting**.
  The path unfolds before my **head**
  As clearly as the listed **entries**.
  It guides my feet, like seeing **eyes**,
  The knowledge kept alive on **pages**.

  Is it outside, these faithful **pages**?
  Or is the thought composed of **ink**
  As real as sight within my **eyes**?
  Does it matter, this **forgetting**,
  When meaning flows from **entries**
  Secured outside the failing **head**?

  The boundary blurs within my **head**:
  What's stored within these weathered **pages**,
  What springs from these recorded **entries**,
  What's born of neuron, born of **ink**,
  What shields me from the **forgetting**,
  What sees the path for weary **eyes**.

  **Envoi**

  (These **eyes** trust **ink** against **forgetting**;
  The **head** finds **entries** on the **pages**;
  One mind: **ink-steady head**, recalling.)

  ---

  **How the Poem Enacts the Argument:**

  1.  **End-Word Selection & Initial Separation:** The words begin clearly categorized:
      *   *Biological:* **eyes**, **head**, **forgetting**
      *   *Notebook:* **pages**, **ink**, **entries**
      Stanzas 1 and 2 largely maintain this distinction, reflecting the initial intuitive separation between Otto and his tool.

  2.  **Sestina Rotation Blurs the Lines:** The sestina's fixed rotation pattern forces the words into new grammatical and conceptual pairings each stanza:
      *   Stanza 3: "**forgetting**" ends a line about managing "**entries**". "**Head**" is linked to trust in "**ink**".
      *   Stanza 4: Questions arise: Is knowledge on "**pages**" outside? Is "**ink**" a defense against "**forgetting**"? "**Entries**" guide the "**head**".
      *   Stanza 5: The blurring intensifies: The "**head**" questions the boundary itself. "**Pages**", "**entries**", and "**ink**" are directly framed as alternatives to biological processes ("neuron").
      *   Stanza 6: The culmination of the rotation: "**Head**" is paired with "**pages**". "**Forgetting**" is directly opposed by the action of "**eyes**" reading "**ink**". The notebook's components ("**entries**", "**pages**") are now the active agents guiding perception and action ("sees the path", "guides my feet") just as biological components would. Crucially, the final end-word list (**head**, **pages**, **entries**, **ink**, **forgetting**, **eyes**) mixes the categories thoroughly. A reader *cannot* reliably sort them back into "inner" and "outer" without flipping back to see the original assignment. This formal confusion *is* the parity principle: if you can't tell from the functional role which is biological and which is external, they are on a par – both are part of the cognitive system.

  3.  **The Envoi: Enacting Unified Cognition:** The final three lines merge the elements completely:
      *   Line 1: "**eyes** trust **ink** against **forgetting**" – Biological sense organs rely on external material to perform a cognitive function (memory).
      *   Line 2: "**head** finds **entries** on the **pages**" – The biological organ locates information within the external artifact as seamlessly as if it were neural.
      *   Line 3: "One mind: **ink-steady head**, recalling." – The closing line merges one word from each side (**ink** - notebook, **head** - biological) into a single cognitive unit "**ink-steady head**". This unit performs the cognitive act: "recalling." The hyphenation signifies the inseparability and parity. The notebook isn't *helping* the head recall; the *ink-steady head* *is* the system that recalls. The poem doesn't *state* the thesis; the final line *enacts* the unified cognitive process demanded by the parity principle.

  4.  **Faithfulness to the Case:** The poem depicts Otto's condition ("brittle film," "aging eyes," "constant forgetting"), his action of writing the address ("trace the needed fact"), and consulting the notebook on the walk ("pause beneath a lamp, scan smudged blue ink"). It avoids language implying the notebook is merely a convenient tool (e.g., "crutch," "aid," "reminder"); instead, it's "anchor," "faith," the source of the "path" and "meaning," and ultimately part of the "mind."

  5.  **Dual Accessibility:**
      *   *Philosophy Student:* Will see the argument in the word choice, the progression of pairings, the deliberate confusion in stanza 6, and the crucial merger in the envoi.
      *   *General Reader:* Will encounter a poignant portrayal of memory loss, reliance on a familiar object, the blurring of self and tool in moments of need, and a sense of wholeness restored through integration ("One mind," "recalling").

  The sestina's relentless rotation becomes the perfect formal analogue for Otto's cognitive process, where biological and external resources are cycled through interchangeably to achieve the goal, demonstrating their functional parity and unity within the extended mind.
