      - A split on soundness (you yes, R. and D. no in Case 3; you and D. yes, R. no in sleep book).  
      - Unanimous/majority engagement (all found Case 3 engaging; you and R. found sleep book engaging).  
      - Only one juror voting to shortlist.  
    - Your past decisions treated the overall vote tally as decisive. To deviate now would contradict this implicit norm.

  - **Why not Method B?**  
    While Method B is logically consistent with past outcomes, your jury has *never* used it to override the overall votes. The sleep book is the first case where the criteria majority and vote majority diverge. Absent prior precedent for Method B, Method A aligns with your de facto process.

  ---

  ### **3. Rules That Fit Your Record (and Which Are Ruled Out)**
  - **Fitting rules:**  
    - **Majority of overall votes (Method A):** Shortlist iff ≥2 jurors vote yes. Fits all cases.  
    - **Unanimity of overall votes:** Shortlist only if all 3 jurors vote yes. Fits all cases (only Case 1 was unanimous).  
    - **R. decides (chair authority):** Shortlist iff R. votes yes. Fits all cases (R. voted yes only in Case 1).  
