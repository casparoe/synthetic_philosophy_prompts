  ### **6. The Name for This Mess**
  You’re recalling the **doctrinal paradox** (or **discursive dilemma**), a concept from philosophy/social choice theory. It highlights how groups can reach inconsistent decisions when aggregating judgments on connected premises (here, soundness and engagingness) versus overall conclusions (shortlist votes). Key references:  
  - Kornhauser & Sager (1986): Introduced in legal contexts.  
  - List & Pettit (2002): Generalized in philosophy/political science.  
  Your case is a textbook example: Majority support for both premises (Method B) conflicts with majority rejection of the conclusion (Method A).

