  - **Key takeaway:** Your record supports rules that prioritize the **overall vote tally** (e.g., majority or unanimity) or **R.’s authority**, but it does not support rules that ignore the overall votes or use premise-based aggregation (Method B).

  ---

  ### **4. Commitments for Future Rulings**
  If you choose **Method A (majority of overall votes)** for consistency:  
  - **Commitment:** Shortlist iff ≥2 jurors vote yes overall.  
  - **Pros:** Simple, preserves past practice.  
  - **Cons:** May exclude books where criteria pass at group level (e.g., sleep book).  
