     This is a classic example of the "doctrinal paradox" or the "discursive dilemma". 

     The doctrinal paradox occurs when a collective decision on a set of premises (here: sound and engaging) leads to a different outcome than aggregating the conclusions (here: the overall vote) drawn from those premises by individuals.

     Specifically:

       - Premise-based approach: take a vote on each premise (sound? engaging?) and then apply the rule (AND) to the group votes.
       - Conclusion-based approach: have each individual apply the rule (AND) to their own premises and then aggregate the conclusions (by majority or otherwise).

     In the current book:

       - Premise-based (group-level AND): shortlist because both premises have majority.
       - Conclusion-based (with majority on conclusions): not shortlist because only one conclusion is yes.

     This is the doctrinal paradox.

