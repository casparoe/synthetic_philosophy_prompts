       - Kornhauser, L. A., & Sager, L. G. (1986). Unpacking the Court. Yale Law Journal, 96(1), 82–117.
       - List, C., & Pettit, P. (2002). Aggregating Sets of Judgments: An Impossibility Result. Economics and Philosophy, 18(1), 89–110.

