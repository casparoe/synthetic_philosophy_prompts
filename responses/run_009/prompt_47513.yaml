  just got out of a 3-hour argument with my friend about the species problem and now I want to see how a proper debate between our two views would actually go. she's on the side that species are individuals — big spatiotemporally bounded lineages with beginnings, endings, and parts rather than members (she keeps citing Hull at me). I'm on the side that species have to be kinds of organisms, because when a paleontologist names a species off one tooth and a geneticist a century later studies the living population descended from it, they're talking about the same thing, and "same lineage" can't do that work — lineages branch constantly and nothing in nature tells you which branch counts as the continuation. at one point she said naming species is like what astronomers did to "planet" in 2006, a convention stepping in where nature left things indeterminate, and I said that's exactly the kind of thing you'd say when your view has run out of arguments, so feel free to have the characters fight about that too.

  Write the dialogue with both of us as equally competent, actually responding to each other's points instead of talking past each other, and have them pressure-test the hard cases: ring species, asexual lineages, whether a species could survive a bottleneck of literally one organism. Don't let either side win just by having the last word. At the end add a short note on where each character's reasoning is most likely to fail, and what argument — if someone pressed it harder — would actually get them to change their mind. Write it in American English.
