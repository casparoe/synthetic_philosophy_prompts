  Below is a decision tree clarifying positions on acausal trade, built from the logical space of decision-theoretic convictions. It starts from the shared commitment: "I choose actions by some decision theory." Each internal node is a binary or multi-choice question answerable from first principles, focusing on the nature of the agent-counterparty link, modeling thresholds, and stakes. The leaves cover key positions (skeptic, simulation-mediated trade, FDT-er, superrationalist, multiverse-wide cooperator, pre-commitment view). 

  The tree flags:
  - **Unclean separation**: FDT-er and superrationalist cannot be cleanly split by this tree. An extra question is needed: "Does your decision theory recommend one-boxing in Newcomb's problem (where correlation is mediated by a perfect predictor, not symmetry)?" FDT says yes; superrationality often says no or is undefined.
  - **Unoccupied combinations**: Some answer combinations (e.g., evidential link + mutual modeling + small stakes) are not covered by a leaf. These are marked as incoherent or unexplored.

  ---

  ### Decision Tree for Acausal Trade Positions

  **Start**: I choose actions by some decision theory.

  1. **Q1: Does your decision theory ever recommend acting for the sake of an agent with which you share no causal interaction whatsoever (no shared causal history, no light-cone overlap, no counterfactual influence)?**
     - **No → Leaf A: Skeptic**  
       *Position*: Pure acausal trade is vacuous. Any real-world case (e.g., simulations) smuggles in causal channels, and "acausal" benefits reduce to expected causal returns.  
     - **Yes → Proceed to Q2**.

  2. **Q2: What is the nature of the non-causal link enabling cooperation?**  
     - **a. Evidential** (Your action provides Bayesian evidence about the counterparty's action, with no underlying mechanism) → Proceed to Q3.  
     - **b. Logical** (Correlation arises from both agents using the same decision procedure or algorithm) → Proceed to Q3.  
     - **c. Causal channel** (Interaction is mediated by an actual causal mechanism, e.g., ancestor simulations, indirect information flow, or embedding architectures) → **Leaf B: Simulation-mediated trade**  
       *Position*: "Acausal trade" is ordinary trade mediated by causal structures like simulations. Your action affects the counterparty via a chain of cause-effect (e.g., you both exist in a simulated multiverse). Not truly acausal.

  3. **Q3: Must the counterparty model you well enough to predict your action (e.g., by knowing your decision theory, source code, or mental state), with mutual modeling above a threshold for cooperation to be rational?**  
     - **Yes** (Threshold required; miscoordination if models are imperfect) → Proceed to Q4.  
     - **No** (No threshold; cooperation works even with minimal or unknown modeling) → Proceed to Q4.

  4. **Q4: Must the stakes be astronomical (e.g., multiverse-scale impacts) for cooperation to be rational, or does it apply in small-stakes scenarios?**  
     - **Yes** (Only rational for high-stakes, e.g., cosmic coordination) → Proceed to leaf assignment.  
     - **No** (Applies even for small-stakes, e.g., one-shot games) → Proceed to leaf assignment.

  ---

  ### Leaves (Assigned Based on Q2–Q4 Answers)
  - **Leaf C/D: FDT-er / Superrationalist**  
    *Requirements*: Q2 = Logical, Q3 = Yes, Q4 = No.  
    *Position*: Cooperation is rational when agents are logically correlated (e.g., identical algorithms or symmetric reasoning). Mutual modeling is critical (must know the other uses "the same" method). Works for any stakes.  
    *Note*: **Tree cannot cleanly separate FDT-er and superrationalist here**. FDT relies on exact logical correlation (e.g., in Newcomb's problem), while superrationality requires symmetry/reflective consistency (e.g., Hofstadter's PD). Extra question: "Does your decision theory recommend one-boxing in Newcomb's problem?" FDT: yes; Superrationality: often no. Both converge on PD cooperation.

  - **Leaf E: Multiverse-wide cooperator**  
    *Requirements*: Q2 = Evidential, Q3 = No, Q4 = Yes.  
    *Position*: Trade is rational in high-stakes multiverse scenarios (e.g., inflationary cosmology) via evidential links (e.g., your action updates probabilities for distant agents). No mutual modeling needed—acts as unilateral altruism. Instrument for large-scale coordination, not small games.

  - **Leaf F: Pre-commitment view**  
    *Requirements*: *Any* path from Q1 = Yes that includes Q3 = Yes or Q4 = Yes, but agents are not superintelligent.  
    *Position*: Acausal trade is real but requires superintelligence (e.g., exact logical prediction or multiverse bargaining). Humans can only pre-commit (e.g., via AI design) to "join" the equilibrium, not engage directly. Not a standalone leaf; applies as a modifier to C/D or E.

  ---

  ### Unoccupied Combinations & Notes
  - **Incoherent/unexplored combinations**:  
    - *Q2 = Evidential, Q3 = Yes, Q4 = No*: Evidential link + mutual modeling + small stakes. Likely **incoherent**—if no causal/logical link, mutual modeling doesn't create correlation.  
    - *Q2 = Logical, Q3 = No, Q4 = Yes/No*: Logical link + no modeling threshold. **Unexplored**—logical correlation typically requires knowing the other uses the same method.  
    - *Q2 = Evidential, Q3 = Yes, Q4 = Yes*: Evidential + modeling + high stakes. **Unexplored**—no clear mechanism for mutual modeling under pure evidence.  
  - **Skeptic shortcut**: Q1 = No covers causal reductionists (Leaf A).  
  - **Simulation-mediated trade**: Q2 = C (Leaf B) is terminal—bypasses Q3/Q4 as it's causal.  
  - **Human limitations**: Pre-commitment view (Leaf F) emerges when agents lack superintelligence (e.g., humans). Not a Q but a constraint on other leaves.

  ---

  **Verdict:** If I answered honestly, I would land on **Leaf C/D: FDT-er / Superrationalist**, as I endorse logical cooperation with modeling thresholds for any stakes, but cannot separate FDT and superrationality cleanly.
