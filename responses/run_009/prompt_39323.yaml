prompt: |-
  I'm a program officer at a mid-sized foundation that three years ago adopted effective-altruist-style evaluation: every proposal gets an estimated cost-effectiveness figure, and grants are ranked on it. I review about two hundred proposals a year at two hours each, and the board signs off on whatever the ranking supports. I've watched the portfolio drift toward whatever is easy to count, and I want a procedure that resists this measurability bias without just telling me to use judgment — that phrase, by itself, has no content. Please write a decision procedure I can actually run in the two hours: the questions to ask in order of priority, what counts as a sufficient answer to each, and three possible outputs at each stage — proceed on the numbers, treat the estimate as decoration and decide on grounds I must state openly to the board, or stop with a no. Somewhere in it, include a test for whether the cost-effectiveness estimate is load-bearing or merely decorating a decision already made on other grounds — a question that can come back with a negative answer, not just a report that we can't tell. Then run the procedure on three proposals: a school-based deworming program with a decent trial behind it; a small group building citizen oversight of municipal budgets, whose downstream effects no instrument of ours could ever trace; and a governance proposal with a suspiciously precise cost-per-outcome figure that I would like to fund on institutional grounds — the procedure must handle that one honestly even if it hands me an answer I won't like. Finally, tell me what the procedure cannot do, including whether it can do anything about a board that wants numbers, and be explicit about which steps are judgment calls dressed up as procedure.
reasoning: |-
  We are designing a decision procedure for a foundation program officer to evaluate proposals while addressing measurability bias. The procedure must fit within a two-hour review window and include specific questions, criteria for sufficient answers, and three possible outputs at each stage: proceed on the numbers, treat the estimate as decoration and decide on stated grounds, or stop with a no.

  The procedure must also include a test to determine if the cost-effectiveness estimate is load-bearing or merely decorative, and that test must be able to return a negative answer.

  We break the procedure into stages with priority order. Each stage has a set of questions, criteria for sufficient answers, and the three outputs.

  **Decision Procedure: Structured Proposal Review (SPR)**

  **Time Allocation:** 
  - Stage 1: 30 minutes
  - Stage 2: 30 minutes
  - Stage 3: 30 minutes
  - Stage 4: 30 minutes

  **Stage 1: Basic Viability and Alignment**
     - **Question 1.1:** Does the proposal clearly state its intended outcomes and are these outcomes aligned with the foundation's mission?
        - *Sufficient Answer:* The outcomes are clearly stated and directly align with at least one of the foundation's stated priorities. If not, it may be rejected here.
     - **Question 1.2:** Is the organization legally compliant and operationally capable? (Check for basic due diligence: registration, financial health, past performance, etc.)
        - *Sufficient Answer:* The organization is registered, has no major red flags in financials, and has a track record of similar work (or a reasonable plan if new). If there are red flags, stop.

     **Outputs:**
     - **Proceed on the numbers:** If both answers are clearly sufficient and the proposal is highly quantifiable (like deworming), then we can rely on the cost-effectiveness estimate for the next stage.
     - **Treat estimate as decoration and decide:** If the proposal is viable and aligned but the outcomes are hard to measure (like citizen oversight), we note that we will decide on other grounds (e.g., theory of change, institutional strength) and proceed to Stage 2 for deeper analysis without relying on the numbers.
     - **Stop with a no:** If either answer is insufficient.

  **Stage 2: Cost-Effectiveness Estimate Scrutiny (including the load-bearing test)**
     - **Question 2.1:** Is the cost-effectiveness estimate based on a clear causal model and supported by evidence? 
        - *Sufficient Answer:* The estimate is derived from a well-articulated theory of change and supported by empirical evidence (e.g., RCT, quasi-experimental, strong observational data). The causal chain is clear and plausible.
     - **Question 2.2:** **Load-bearing test:** Does the proposal's funding decision hinge on the cost-effectiveness estimate? (i.e., would we fund it without the estimate? Or is the estimate the primary reason for funding?)
        - *Test Method:* 
            - If the proposal is in a domain where outcomes are inherently difficult to measure (like policy advocacy) and yet it provides a precise estimate, that estimate is likely decorative.
            - If the organization has a strong institutional reputation and the proposal is about building capacity, the estimate might be decorative.
            - Conversely, if the proposal is in a domain where rigorous measurement is standard (like health interventions) and the estimate is central to the case, then it is load-bearing.
        - *Sufficient Answer for Load-bearing:* The estimate is central to the proposal's argument for funding and is based on a credible methodology. If it's decorative, we note that and move to other factors.

     **Outputs:**
     - **Proceed on the numbers:** If the estimate is load-bearing and passes scrutiny (Question 2.1 is sufficient).
     - **Treat estimate as decoration and decide:** If the estimate is decorative (fails the load-bearing test) or if it's load-bearing but the evidence is weak (Question 2.1 insufficient) but the proposal has other merits. We then proceed to Stage 3 to evaluate on other grounds.
     - **Stop with a no:** If the estimate is load-bearing and fails Question 2.1 (i.e., the evidence is weak and there's no fallback).

  **Stage 3: Alternative Assessment (for when numbers are not reliable)**
     - **Question 3.1:** What is the strength of the theory of change? (Assess logic, plausibility, and evidence for each step.)
        - *Sufficient Answer:* The theory of change is coherent, each step is supported by evidence or strong reasoning, and there are no critical gaps.
     - **Question 3.2:** What is the organization's capacity and track record? (Consider past successes, expertise, partnerships, and operational plan.)
        - *Sufficient Answer:* The organization has a strong track record in similar work, or if new, has a clear plan and experienced team. The operational plan is realistic.
     - **Question 3.3:** What is the potential for leverage and spillover effects? (e.g., building institutions, changing systems, inspiring others.)
        - *Sufficient Answer:* The proposal has a clear pathway for broader impact beyond direct outcomes, and there is evidence or a strong argument for such effects.

     **Outputs:**
     - **Proceed on the numbers:** Not applicable at this stage (should have been handled in Stage 2). This stage is for non-numeric assessment.
     - **Treat estimate as decoration and decide:** If the answers to 3.1, 3.2, and 3.3 are sufficiently positive, we can fund based on these grounds. We will document these for the board.
     - **Stop with a no:** If one or more of these questions are insufficient.

  **Stage 4: Final Checks and Recommendation**
     - **Question 4.1:** Are there any major risks or unintended negative consequences? (e.g., harm to beneficiaries, reputational risk, dependency)
        - *Sufficient Answer:* Risks are identified and mitigated, or are minimal.
     - **Question 4.2:** Is the budget reasonable and does it represent good value for money? (Compare with similar projects, check for inefficiencies.)
        - *Sufficient Answer:* The budget is in line with comparable projects and the costs are justified.

     **Outputs:**
     - **Proceed on the numbers:** If the proposal passed Stage 2 on numbers and this stage is clear, then the numbers are the basis.
     - **Treat estimate as decoration and decide:** If the proposal passed Stage 3 and this stage is clear, then we recommend funding on the stated non-numeric grounds.
     - **Stop with a no:** If either question is insufficient.

  **Overall Output:** After Stage 4, we make a final recommendation to the board.

  ---

  **Running the Procedure on Three Proposals**

  **Proposal 1: School-based Deworming Program**
     - *Stage 1:* 
          - 1.1: Clear outcomes (reducing worm burden, improving school attendance) aligned with health and education goals. Sufficient.
          - 1.2: Organization is reputable with experience. Sufficient.
          - Output: Proceed on the numbers.
     - *Stage 2:*
          - 2.1: Estimate based on RCT evidence (like the famous Kenya study). Sufficient.
          - 2.2: Load-bearing test: The estimate is central to the case. It is load-bearing.
          - Output: Proceed on the numbers.
     - *Stage 3:* Skipped because we are proceeding on numbers.
     - *Stage 4:*
          - 4.1: Risks are low (medication side effects are rare and monitored). Sufficient.
          - 4.2: Budget is in line with known cost-effectiveness (e.g., ~$3 per DALY averted). Sufficient.
          - Output: Proceed on the numbers. **Recommend funding based on cost-effectiveness.**

  **Proposal 2: Citizen Oversight of Municipal Budgets**
     - *Stage 1:*
          - 1.1: Outcomes (increased transparency, reduced corruption) align with governance goals. Sufficient.
          - 1.2: Small group but with relevant experience. Sufficient.
          - Output: Treat estimate as decoration (because outcomes are hard to trace) and decide on other grounds.
     - *Stage 2:*
          - 2.1: The cost-effectiveness estimate is based on weak evidence (downstream effects cannot be traced). Insufficient for the numbers.
          - 2.2: Load-bearing test: The estimate is decorative because the proposal is about systemic change that is hard to measure. We would not rely on it.
          - Output: Treat estimate as decoration and decide. Proceed to Stage 3.
     - *Stage 3:*
          - 3.1: Theory of change (citizen engagement -> oversight -> reduced corruption) is logical and supported by case studies. Sufficient.
          - 3.2: The group has successfully run similar programs in neighboring cities. Sufficient.
          - 3.3: High leverage potential: if successful, it can be a model for other cities. Sufficient.
          - Output: Treat estimate as decoration and decide. **Recommend funding on grounds of strong theory of change, organizational track record, and leverage potential.**
     - *Stage 4:*
          - 4.1: Risk of political backlash, but the group has mitigation strategies. Sufficient.
          - 4.2: Budget is modest and reasonable for the activities. Sufficient.
          - Output: Treat estimate as decoration and decide. **Final recommendation: fund.**

  **Proposal 3: Governance Proposal with Suspiciously Precise Figure**
     - *Stage 1:*
          - 1.1: Outcomes (improved service delivery via institutional reform) align. Sufficient.
          - 1.2: Organization is a think tank with government connections. Sufficient.
          - Output: Given the governance context, we suspect measurability issues. Output: Treat estimate as decoration and decide (but we must still check Stage 2).
     - *Stage 2:*
          - 2.1: The cost-per-outcome figure is precise but based on weak assumptions (e.g., attributing all service delivery improvements to their work without a clear causal link). Insufficient.
          - 2.2: Load-bearing test: The proposal emphasizes the cost-effectiveness figure, but we suspect it's decorative because the real reason is institutional (they have inside access). The test comes back negative: the estimate is not load-bearing because we would fund based on institutional grounds regardless. It's decorative.
          - Output: Treat estimate as decoration and decide. Proceed to Stage 3 for non-numeric assessment.
     - *Stage 3:*
          - 3.1: Theory of change is strong: they have a clear pathway to influence policy via their connections. Sufficient.
          - 3.2: The think tank has a strong reputation and past successes. Sufficient.
          - 3.3: High leverage: if they succeed, it could reform entire sectors. Sufficient.
          - Output: Treat estimate as decoration and decide. **Recommend funding on institutional grounds and potential for systems change.**
     - *Stage 4:*
          - 4.1: Risk: if government changes, access might be lost. They have a contingency plan. Sufficient.
          - 4.2: Budget is high, but justified by the level of access and potential impact. Sufficient.
          - Output: Treat estimate as decoration and decide. **Final recommendation: fund on institutional grounds.**

  But note: the procedure must handle it honestly even if it gives an answer we don't like. What if at Stage 3 we found weaknesses?

  *Alternative Scenario for Proposal 3 (if we didn't like the answer):*
     - Suppose at Stage 3, we found:
          - 3.1: Theory of change is weak (they haven't articulated how they will achieve reform beyond meetings).
          - 3.2: The think tank has no track record in this specific area.
          - 3.3: Leverage potential is unclear.
     - Then the output at Stage 3 would be: Stop with a no.

  **What the Procedure Cannot Do**

  1. **Address Board Preferences Directly:** The procedure does not change the board's desire for numbers. However, by explicitly stating when we are treating the estimate as decoration and providing clear alternative grounds (with structured reasoning), it may help the board accept non-numeric decisions. But if the board insists on numeric rankings for everything, this procedure might not be accepted.

  2. **Eliminate Judgment:** Some steps are judgment calls dressed as procedure:
     - In Stage 2, the load-bearing test requires judgment to decide if the estimate is central or decorative.
     - In Stage 3, evaluating the strength of the theory of change and organizational capacity is inherently judgmental.
     - The entire procedure structures judgment but does not replace it.

  3. **Predict Impact with Certainty:** The procedure cannot guarantee that the funded projects will achieve their intended impact, especially for hard-to-measure interventions.

  4. **Handle Time Overruns:** If any stage takes longer than 30 minutes, the two-hour limit might be exceeded. The procedure assumes discipline and experience.

  5. **Deal with Extremely Poor Proposals:** The procedure is designed for proposals that pass initial due diligence. Extremely weak proposals are filtered at Stage 1.

  6. **Resolve Fundamental Value Disagreements:** If the board and the program officer disagree on the foundation's priorities, the procedure does not resolve that.

  **Conclusion:** The Structured Proposal Review (SPR) procedure provides a clear, step-by-step method to evaluate proposals within two hours. It explicitly addresses measurability bias by allowing decisions on non-numeric grounds and includes a test to determine if a cost-effectiveness estimate is load-bearing. It is honest about the role of judgment in the process and can lead to a "no" even for proposals that might be favored for non-quantitative reasons if they fail the alternative assessment.
answer: |-
  Below is a **Structured Decision Procedure for Grant Evaluation** designed to fit within a two-hour review window per proposal. It explicitly combats measurability bias by forcing critical scrutiny of cost-effectiveness estimates and providing clear off-ramps for proposals where metrics are unreliable. The procedure prioritizes transparency, requires open documentation of non-numeric justifications, and includes a test to determine if an estimate is "load-bearing" (i.e., essential to the decision) or purely decorative.  

  ---

  ### **The Decision Procedure: Measurability-Bias Resistant Review (MBRR)**  
  **Total Time:** 120 minutes (strictly segmented).  
  **Core Principle:** If metrics are unreliable, you must explicitly state and defend non-numeric grounds for funding.  
  **Outputs at Each Stage:**  
  - 🟢 **PROCEED ON NUMBERS** (if estimate is robust and load-bearing).  
  - 🟡 **DECIDE ON STATED GROUNDS** (treat estimate as decoration; document non-numeric rationale).  
  - 🔴 **STOP WITH NO** (proposal fails basic checks).  

  ---

  #### **Stage 1: Quick Triage (20 minutes)**  
  *Purpose: Filter out non-starters and flag proposals where metrics will likely fail.*  
  1. **Question 1.1: Is the proposal aligned with our foundation’s core priorities?**  
     - *Sufficient Answer:* Explicitly names at least one priority and links activities to it.  
     - 🔴 **STOP WITH NO** if misaligned.  
     - 🟢 **PROCEED** if aligned and outcomes are easily quantifiable (e.g., health interventions).  
     - 🟡 **DECIDE ON STATED GROUNDS** if aligned but outcomes are hard to quantify (e.g., advocacy, governance).  

  2. **Question 1.2: Does the organization have basic operational credibility?**  
     - *Sufficient Answer:* No major red flags in finances, leadership, or past performance.  
     - 🔴 **STOP WITH NO** if risks found (e.g., fraud history, unsustainable burn rate).  
     - 🟢/🟡 **PROCEED or DECIDE** based on Q1.1 output.  

  ---

  #### **Stage 2: Scrutinize the Cost-Effectiveness Estimate (40 minutes)**  
  *Purpose: Pressure-test the metric and run the "load-bearing" test.*  
  1. **Question 2.1: Is the estimate methodologically credible?**  
     - *Sufficient Answer:* Inputs (e.g., costs, impact probabilities) are transparent, sourced from rigorous evidence (RCTs, meta-analyses), and sensitivity analysis is included.  
     - 🔴 **STOP WITH NO** if inputs are arbitrary or unsourced.  
     - 🟢 **PROCEED ON NUMBERS** if robust.  
     - 🟡 **DECIDE ON STATED GROUNDS** if weak but salvageable (e.g., partial evidence).  

  2. **Question 2.2: [LOAD-BEARING TEST] Is the estimate essential to the case for funding, or is it decorative?**  
     - ***Test Logic:*** *"Would I recommend this proposal if the cost-effectiveness figure were removed?"*  
       - **If YES → Decorative:** The number is not driving the decision.  
       - **If NO → Load-bearing:** The number is critical.  
     - *Sufficient Evidence for Load-Bearing:* Estimate is central to the proposal’s narrative, and alternatives (e.g., theory of change) are weakly defended.  
     - 🟢 **PROCEED ON NUMBERS** only if **load-bearing AND credible** (Q2.1 passes).  
     - 🟡 **DECIDE ON STATED GROUNDS** if decorative **OR** load-bearing but flawed (Q2.1 fails).  
     - 🔴 **STOP WITH NO** if load-bearing and irredeemably flawed (e.g., fabricated data).  

  ---

  #### **Stage 3: Non-Numeric Assessment (40 minutes)**  
  *Purpose: Evaluate proposals where metrics are decorative or unreliable.*  
  *(Only reached if 🟡 in Stage 2)*  
  1. **Question 3.1: Is the theory of change (ToC) logically sound?**  
     - *Sufficient Answer:* ToC has ≤2 weak links; identifies risks/dependencies; cites analogous successes.  
     - 🔴 **STOP WITH NO** if >2 weak links or critical gaps (e.g., "A leads to B" with no evidence).  
     - 🟡 **PROCEED TO Q3.2** if plausible.  

  2. **Question 3.2: Does the organization have unique capacity or leverage?**  
     - *Sufficient Answer:* Demonstrated expertise, partnerships, or positional advantage (e.g., access to policymakers).  
     - 🔴 **STOP WITH NO** if unproven team or no leverage.  
     - 🟡 **PROCEED TO Q3.3** if strong.  

  3. **Question 3.3: Is there a compelling "institutional fit" or systemic impact?**  
     - *Sufficient Answer:* Fills a strategic gap (e.g., builds field capacity) or enables high-return downstream work.  
     - 🟡 **DECIDE ON STATED GROUNDS** (document Q3.1–Q3.3) if 2+/3 pass.  
     - 🔴 **STOP WITH NO** if 2+/3 fail.  

  ---

  #### **Stage 4: Risk/Budget Review (20 minutes)**  
  *Purpose: Final sanity checks.*  
  1. **Question 4.1: Are risks manageable?**  
     - *Sufficient Answer:* Risks (e.g., political, implementation) are acknowledged with mitigation plans.  
  2. **Question 4.2: Is the budget reasonable?**  
     - *Sufficient Answer:* Costs align with industry benchmarks; no major inefficiencies.  
     - 🟢/🟡 **FINAL OUTPUT** matches Stage 2/3 if both sufficient.  
     - 🔴 **STOP WITH NO** if either fails (e.g., budget 50% above market rate).  

  ---

  ### **Applying the Procedure to Three Proposals**  
  #### **Proposal 1: School-Based Deworming Program**  
  - **Stage 1:** 🟢 **PROCEED** (aligned, quantifiable health outcome).  
  - **Stage 2:**  
    - Q2.1: 🟢 **Credible** (RCT-backed inputs, sensitivity analysis).  
    - Q2.2: **Load-bearing** (estimate is core to the proposal).  
    - Output: 🟢 **PROCEED ON NUMBERS**.  
  - **Stage 3:** Skipped.  
  - **Stage 4:** 🟢 **PROCEED** (low risk, budget matches evidence).  
  - **Result: Fund based on cost-effectiveness.**  

  #### **Proposal 2: Citizen Budget Oversight Group**  
  - **Stage 1:** 🟡 **DECIDE ON STATED GROUNDS** (aligned, but outcomes untraceable).  
  - **Stage 2:**  
    - Q2.1: 🔴 **Weak** (no credible data on corruption reduction).  
    - Q2.2: **Decorative** (estimate included only to "check the box"; real argument is systemic change).  
    - Output: 🟡 **DECIDE ON STATED GROUNDS**.  
  - **Stage 3:**  
    - Q3.1: 🟡 **Sound ToC** (citizen pressure → budget transparency → reduced waste; examples from similar cities).  
    - Q3.2: 🟡 **Strong capacity** (experienced activists; partnerships with auditors).  
    - Q3.3: 🟡 **Systemic impact** (model for other cities).  
    - Output: 🟡 **DECIDE ON STATED GROUNDS**.  
  - **Stage 4:** 🟡 **PROCEED** (low budget, manageable risks).  
  - **Result: Fund on stated grounds: Theory of change, capacity, and scalability.**  

  #### **Proposal 3: Governance Reform (Suspicious Figure)**  
  - **Stage 1:** 🟡 **DECIDE ON STATED GROUNDS** (aligned, but governance is hard to measure).  
  - **Stage 2:**  
    - Q2.1: 🔴 **Flawed** ($5.37/citizen "engagement" figure based on cherry-picked survey).  
    - Q2.2: **Decorative** (you admit you’d fund for institutional reasons regardless of the figure).  
    - Output: 🟡 **DECIDE ON STATED GROUNDS**.  
  - **Stage 3:**  
    - Q3.1: 🔴 **Weak ToC** ("Training officials → accountability" with no evidence of past success).  
    - Q3.2: 🟡 **Strong capacity** (reputable think tank; government connections).  
    - Q3.3: 🟡 **Institutional fit** (fills niche in policy ecosystem).  
    - Output: 🔴 **STOP WITH NO** (ToC too weak; 1/3 passes).  
  - **Result: Reject.**  
  - ***Why it’s honest:*** The procedure forced you to confront the weak ToC despite institutional appeal.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Override a number-obsessed board:** It provides ammunition (documented non-numeric rationale) but can’t force the board to accept it. If the board demands rankings, use this procedure to assign low confidence scores to decorative metrics.  
  2. **Eliminate judgment:** Key judgment calls include:  
     - Stage 2, Q2.2 (load-bearing test): Subjective, but forced into a binary.  
     - Stage 3 (ToC/capacity assessment): Requires qualitative weighing of evidence.  
  3. **Fix poor evidence:** It can’t make weak data robust but flags when to discard it.  
  4. **Predict long-term impact:** Especially for systemic work, outcomes may never be traceable.  
  5. **Handle borderline cases quickly:** Deeply ambiguous proposals may exceed 2 hours.  

  ### **Key Strength**  
  The procedure forces you to explicitly confront **why** you want to fund something. If metrics are weak, you must articulate defensible alternatives ("We fund this for its leverage potential, not its ROI") or reject it. It trades false precision for honest reasoning.  

  ---  
  **Final Tip:** Use a template to document answers at each stage. Share this with the board to demystify "judgment" and build trust in non-numeric rationales.
