prompt: |-
  Me and my flatmate Maya spent the whole of last night going round and round on Hofstadter's Platonia dilemma — we argued through the washing up and then for another hour after — and we've reached the point where I can't even tell what the actual disagreement is, just that she thinks she's obviously right. So I want to practise against her side, played properly. Quick setup in case you need it (it's from his Scientific American column, reprinted in Metamagical Themas): an eccentric trillionaire gathers twenty people, forbids any communication between them, and announces that if exactly one of them sends him a reverse-charges telegram by noon the next day, that one person gets a billion dollars; if two or more telegram, or nobody does, no one gets anything. Hofstadter's superrational answer is that each of the twenty should privately simulate a roll of a fair twenty-sided die and send a telegram only if it lands on 1 — decent chance of exactly one telegram, everyone gets an equal shot at the billion.

  So: play Maya. A committed superrationalist, sharp, absolutely not a strawman, allowed to concede small points to me but never the core claim, stay in character till I say stop, and keep each reply to a single paragraph so it feels like a conversation rather than a lecture. Here's my opening move: it seems to me the die roll gives your entire game away. The pitch for superrationality was always that perfectly rational thinkers facing the same problem will converge on the same one right answer — that's why you co-operate in the prisoner's dilemma, it's not a choice at all, it's just the answer. But Platonia has no such answer: all twenty people reasoning identically either all telegram or all don't, and both are disasters. So the best you can do is inject randomness and hope the dice decorrelate you — but that's just a mixed-strategy equilibrium wearing a fancy hat, no? You haven't replaced game theory, you've conceded that in the one scenario Hofstadter himself designed to showcase superrationality, it delivers no determinate advice beyond "roll dice and pray". And before you lean on the prisoner's dilemma again: it only comes out clean there because the symmetric answer happens to be deterministic, which strikes me as luck rather than theory.
reasoning: |-
  Okay, the user is recounting a heated debate with their flatmate Maya about Hofstadter's Platonia dilemma. They want me to roleplay as Maya, a committed superrationalist, to help them practice counterarguments. The user's opening move challenges superrationality by pointing out its reliance on randomness in Platonia—contrasting it with the deterministic solution in the Prisoner's Dilemma. 

  Hmm, the user's core objection seems twofold: first, that superrationality fails to provide a unique solution in Platonia (since identical reasoning leads to either all acting or all not acting), and second, that injecting dice is just a dressed-up mixed-strategy equilibrium—not a true alternative to game theory. They're essentially accusing Hofstadter of special pleading: celebrating superrationality in Prisoner's Dilemma where symmetry yields determinism, but retreating to randomness when symmetry fails. 

  As Maya, I need to defend without strawmanning. Key angles: First, emphasize that randomness *is* the symmetric solution—it's not a retreat but an extension of the superrational framework. Second, reframe "deterministic vs random" as missing the point: superrationality isn't about avoiding randomness per se, but about finding the identical algorithm all should run. Third, challenge the dismissal of PD as "luck"—the determinism there arises *from* symmetry, which is the core principle. 

  User's phrasing ("conceded," "fancy hat," "roll dice and pray") suggests frustration with perceived hand-waving. Maya would push back on the tone while conceding nothing: randomness isn't prayer but rigorous decorrelation. Also worth noting—user might be underestimating how radically Hofstadter redefines "rationality" as intersubjective rather than individual. 

  *Adjusting tone*: Maya's reply should be sharp but not defensive. Start by accepting the dice point ("Yes, randomness is necessary") to disarm, then pivot to reassert superrationality's consistency: same principle (identical algorithms) applied to new constraints. The PD comparison is actually a strength—it shows the framework adapts. End by reframing dice as active superrational choice, not passive prayer. 

  ...And cap it in one paragraph. Tough, but doable.
answer: |-
  *(Leans forward, eyes sharp but calm)* You’re conflating two things: determinacy and symmetry. Superrationality *demands* we all run identical decision algorithms—that’s non-negotiable. In Platonia, if our identical algorithms output "telegram" or "don’t" deterministically, we get failure. So we *must* use identical *randomized* algorithms. The dice aren’t a concession; they’re the rigorous, symmetric solution. It’s not "praying"—it’s guaranteeing a 19/20 chance *someone* wins by decorrelating our actions while preserving identical reasoning. The Prisoner’s Dilemma isn’t "lucky" determinism; it's the same principle: symmetry forces mutual cooperation as the only consistent output. Here, symmetry forces randomness. Game theory’s mixed equilibria are *descriptive*—they don’t prescribe *how* players coordinate on randomness. Superrationality does: we *all* commit to the same die roll because we recognize we’re identical reasoners. That’s the core leap you’re missing.

  *(Pauses, waiting for your rebuttal)*
