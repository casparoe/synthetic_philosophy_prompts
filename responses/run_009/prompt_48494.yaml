answer: |-
  The practice presupposes a theory of democratic legitimacy where popular sovereignty is paramount but accepts a strictly ceremonial, hereditary head of state whose symbolic role is distinct from the operational exercise of power, relying on convention to neutralize formal authority.

  1.  **Symbolic vs. Operative Distinction:** The arrangement strongly presupposes a sharp distinction between symbolic/constitutive functions and operative governmental functions. Democratic authorization is deemed necessary *only* for offices wielding actual governmental power. The monarch's role – embodying historical continuity, national unity, and state identity – is seen as fulfilling a distinct, non-political function that does not require popular election. While a pure electoral-authorization theory *could* technically license it by arguing an office with *no* power needs no mandate (the "needs no mandate" view), this is a *possible fit* rather than the core presupposition. The core logic is that the symbolic function *itself* is valuable and *inherently different* from governance, legitimized by tradition, acceptance, and non-interference, not by an electoral mandate. The "needs no mandate" view is a secondary, potentially compatible argument, but the primary driver is the distinct nature of the symbolic role.

  2.  **Convention and Normativity:** Yes, the practice fundamentally presupposes a view that constitutional conventions – unwritten, politically enforced norms – can effectively constrain power without legal sanctions. It assumes political actors will internalize these norms and face severe political costs (loss of legitimacy, constitutional crisis) for breaching them. The stability of this presupposition is **genuinely contested**. The 1975 Australian dismissal (and events like the 2008–2009 Canadian prorogation crisis) demonstrate the latent potential for reserve powers to be activated. This doesn't necessarily *falsify* the implicit theory; proponents argue it reveals its *true* nature: conventions are powerful constraints *until* extraordinary circumstances create actors willing to bear the immense political cost of breaking them, proving the constraint is political, not legal. Critics argue such events expose the inherent fragility and potential for abuse within a system relying on unenforceable norms, undermining the theory's stability.

  3.  **Political Neutrality:** The practice *does* presuppose that political neutrality is both a coherent and attainable status for a hereditary official. This neutrality is understood as strict non-intervention in partisan politics and public adherence to government advice. However, this presupposition is **highly contested**. The neutrality is entirely dependent on adherence to convention by both the monarch *and* politicians. Its coherence relies on the ability to strictly separate "state" (embodied neutrally by the monarch) from "government" (the partisan executive). Critics argue this separation is artificial, that the monarch's very existence and privileges are inherently political, and that their public actions (even ceremonial) carry unavoidable political valence. The observation that neutrality is convention-dependent doesn't inherently destroy the presupposition within the theory; proponents accept it requires constant vigilance and institutional discipline. However, critics contend this dependence makes the neutrality fragile and potentially illusory, especially in times of deep political division or if a monarch actively sought to exert influence, highlighting a significant vulnerability in the implicit theory. **(Contested Position:** I find the critique compelling; the required neutrality seems perpetually precarious and its coherence relies on ignoring the inherent political nature of the institution itself.)

  4.  **Philosophical Underdetermination:**
      *   **Licensing Theories:** The *current* arrangement is licensed by:
          *   **Symbolic Legitimacy Theory:** Legitimacy stems from embodying national unity, historical continuity, and state identity distinct from partisan politics. Democratic authorization applies only to operational governance.
          *   **Consequentialist Theories:** The monarchy's benefits (stability, national unity, ceremonial efficiency, tourism, constraining executive ambition by embodying a higher state ideal) outweigh the democratic deficit, especially since conventions neutralize its power. Popular acceptance (high approval ratings) is key evidence.
          *   **(Weakly) Modified Electoral-Authorization:** If power is truly neutralized, the office "needs no mandate," existing purely as a ceremonial artifact tolerated by popular will expressed through other channels (e.g., no major movement to abolish it).
      *   **Changes Under Rival Theories:**
          *   **Strict Electoral-Authorization Theory:** This theory would be incompatible with a hereditary head of state holding *any* formal constitutional position, even ceremonial. It would require abolishing the monarchy and replacing it with an entirely elected head of state (e.g., a president, directly or indirectly elected), whose powers, even if largely ceremonial, would derive from an electoral process. All formal constitutional functions (assent, dissolution, appointing PM) would need to be explicitly vested in elected officials or mechanisms.
          *   **Purely Consequentialist Theory:** The *form* of the arrangement might remain similar *if* the consequences were deemed positive. However, the justification would shift entirely to outcomes (stability, unity, cost-effectiveness, popularity). If evidence emerged that the monarchy caused instability, hindered democracy, or became deeply unpopular, a consequentialist view would readily support abolition or radical reform (e.g., making it elective, stripping all residual formal powers definitively, as Sweden did). The focus would be purely on net benefits, not tradition or symbolic distinctiveness. The specific conventions might be codified into law if deemed necessary for stability.
