  Okay, let me approach this film class teaching request methodically. The professor wants to use the Du Bois-Locke debate as a lens for analyzing "Do the Right Thing," focusing on how the film engages with their 1926 argument about Black art's purpose. 

  First, I need to consider how to frame the historical context efficiently. For undergraduates who know the film well but not the Harlem Renaissance figures, I'll need to distill Du Bois' "propaganda" stance and Locke's "art for art's sake" position clearly, perhaps through vivid quotes that show their conflict. The key is making their century-old debate feel urgently relevant to Lee's filmmaking choices.

  The analysis should tackle specific scenes the professor highlighted: the racial slur montage, Mookie's trash can throw, and the dual Malcolm/King quotes at the end. For each, I'm considering how to avoid simplistic "Du Bois vs Locke" binaries. The slur scene especially interests me - it's both artistic innovation and political provocation, which actually reveals how their theories aren't mutually exclusive. 

  On Mookie's action, I'm struck by how Lee's ambiguity becomes the ultimate test case. Du Bois might criticize the lack of clear moral stance, while Locke could applaud the artistic restraint. But maybe the film transcends both by showing how context shapes interpretation - the same scene functions as propaganda or art depending on who's watching. That double-audience effect feels crucial.

  The professor's hunch about simultaneous reception by Black and white audiences seems perceptive. Du Bois acknowledged different readers but didn't explore how a single artwork could be weaponized differently in real-time. Lee's film demonstrates this experientially - the trash can throw isn't just a plot point but becomes a Rorschach test revealing viewer biases.

  For the Malcolm/King ending, I'm considering how the dual quotes resist propaganda while still demanding political engagement. It's neither didactic (against Du Bois) nor apolitical (against Locke), but something third - an invitation to sit with contradiction, which only visual storytelling can achieve so effectively.

  Throughout, I'll maintain that the film doesn't "prove" either theorist right, but rather exposes new dimensions they couldn't foresee. The mass medium context - where art hits millions simultaneously - creates reception dynamics that 1926 essayists couldn't anticipate. This feels like the core insight to leave students with: that Lee turns audience fragmentation into the artwork's very subject.
answer: |-
  Here's a focused reading of *Do the Right Thing* through the Du Bois-Locke lens, designed for your film class:

  **The 1926 Fight (Quick & Dirty):**
  *   **W.E.B. Du Bois ("Criteria of Negro Art," 1926):** "All Art is propaganda and ever must be." Art isn't neutral; it *always* serves an agenda, consciously or not. The crucial question is *which* side it serves – uplift for Black people or the status quo (often pandering to white sensibilities). He distrusted art made primarily for white approval.
  *   **Alain Locke ("The New Negro," 1925, and surrounding essays):** Pushed back hard. Black art should be valued first and foremost as **Art**, judged by universal aesthetic standards, not solely as racial representation or political tool. Loading it with the burden of representing the "whole race" stifles individual expression and artistic freedom. Let the art be complex, multifaceted, even ugly – *because it's art*.

  **Do the Right Thing as Test Case:**

  Lee’s film is a Molotov cocktail thrown into this debate. It doesn't neatly vindicate either; instead, it forces their arguments into a new, messier, mass-media reality, exposing limitations and revealing something new.

  1.  **The Racial Slur Montage: Propaganda, Art, or Both? (Can They Even Be Separated?)**
      *   **Du Bois Lens:** This is *pure* propaganda in action. It weaponizes language, forcing the audience (especially white viewers) to confront the visceral ugliness of racial hatred they might ignore or sanitize. It's deliberately provocative, designed to shock and challenge complacency – serving an anti-racist agenda. Locke might accuse Du Bois of seeing *only* this function.
      *   **Locke Lens:** It's a bold, formally innovative piece of cinema. The direct address breaks the fourth wall, the rhythmic editing creates a disturbing musicality, the sheer accumulation is overwhelming. Its power lies in its *aesthetic construction* – the jarring juxtaposition, the uncomfortable intimacy. Judged purely as filmmaking technique, it's brilliant and unsettling art.
      *   **The Film's Answer:** It's **both simultaneously and inseparably.** The scene's *artistic choices* (direct address, rhythm, editing) *are* what make its propagandistic force so potent. Trying to separate the "message" from the "medium" here is impossible. The film shows that at its most powerful, politically charged art uses aesthetic mastery to deliver its punch. Locke's "art for art's sake" feels naive here; Du Bois's "propaganda" feels too reductive for the artistry involved.

  2.  **Mookie Throws the Trash Can: Withholding the Verdict**
      *   **Du Bois's Suspicion:** Lee refusing to say if it was "right" seems like the *opposite* of Du Boisian propaganda, which demands clarity of purpose. Du Bois might suspect this ambiguity is precisely *for* the white audience – letting them off the hook, allowing them to project their own interpretation (often condemning Mookie), avoiding a clear "incendiary" message he was accused of making.
      *   **Locke's Potential Relief:** Locke might applaud this ambiguity as true artistic complexity. It refuses simplistic moralizing, forcing the audience to grapple with the chaotic, morally fraught reality of the moment. It prioritizes showing the human complexity (Mookie's anger, his later demand for pay, Sal's grief) over delivering a political lesson.
      *   **The Film's Move:** This is where Lee outmaneuvers the binary. **Withholding the verdict *is* the political act.** It forces *every* viewer to confront their own biases and assumptions. Does the white liberal audience see senseless destruction? Does the Black audience see justified rebellion against oppression? The ambiguity *exposes* the audience, making *them* reveal their own stance. It's not pandering; it's a trap. It turns Du Bois's fear of white misinterpretation into the *very point*. The film trusts the audience *to reveal themselves*, not to find a "correct" answer.

  3.  **The Malcolm & King Title Cards: Refusing to Rank**
      *   Applying the same logic: Presenting both quotes without hierarchy is neither propaganda (it doesn't tell you which path is "right") nor apolitical art (it forces engagement with the core political/philosophical dilemma). It’s **presenting the irreconcilable tension itself as the unavoidable reality.** It demands the audience sit with the contradiction Black America has always navigated. Again, it exposes the viewer's leanings.

  **Where the Film Resists Both:**
  *   **Humor & Vitality:** The film's incredible humor, its celebration of neighborhood life, music, and style (Radio Raheem's love of "Fight the Power," the dancing, the sheer *life* on the block) doesn't neatly serve Du Boisian uplift propaganda nor exist purely for Locke's aesthetic appreciation. It's a vital, messy portrayal of community that complicates any singular political or artistic agenda.
  *   **Character Complexity:** Sal isn't a pure villain; Mookie isn't a pure hero; even the much-maligned Clifton (the white cyclist) has a moment of bewildered humanity ("I'm not from this neighborhood!"). This depth resists being reduced to propaganda symbols.

  **What the Film Shows that the Essays Couldn't See: The Double-Audience Problem & Mass Medium Revelation**

  Your hunch is dead-on. **The film's core revelation is the inherent, simultaneous, and *conflicted* double-audience of mass-media Black art.**

  *   **Du Bois's Foreshadowing:** Du Bois *did* obsess over "writing for white eyes" and the dangers of pandering. He sensed the problem of reception. But his essay couldn't *show* it happening in real-time to millions of people via a single, unified artifact.
  *   **Locke's Blind Spot:** Locke, advocating for art judged aesthetically, underestimated how the *mass dissemination* of that art (especially film) inherently politicizes its reception when the subject is race. A painting in a gallery is one thing; a film about a racial powder keg hitting theaters nationwide is another.
  *   **Lee's Discovery:** *Do the Right Thing* **makes the double-audience dynamic the text itself.**
      *   The **same scene** (Mookie throwing the can) *is* propaganda (a call to action, a symbol of rebellion) for one audience and propaganda (a confirmation of dangerous criminality) for another, *simultaneously*.
      *   The **mainstream white fear of riots** *proves* Du Bois's point about art being seen as propaganda, *while also proving* that the white audience was the one whose reaction was politically loaded and dangerous.
      *   The **ambiguity** isn't just artistic; it's a **strategic necessity** for a work navigating this minefield. Lee knows the film *will* be read differently, and he structures it to exploit and expose that.
      *   **The medium *is* the message:** Only a mass medium like film, experienced collectively yet interpreted individually across racial lines, could so viscerally demonstrate this split reception. The film doesn't just *have* an audience; it *diagnoses* its audience's divisions.

  **Conclusion for Undergrads:**

  *Do the Right Thing* is neither pure Du Bois nor pure Locke. It **absorbs and transcends their 1926 debate.** It proves Du Bois right about art's inevitable political dimension and the dangers of white reception, *especially* in mass media. It proves Locke right about the power of complex artistry and withholding simple moralizing. But crucially, it **reveals something new:** the inescapable, real-time tension of creating ambitious Black art for a racially divided mass audience. Lee uses the power of film not just to tell a story, but to hold up a mirror to America, forcing *all* viewers to see themselves and their interpretations reflected in the heat of Bed-Stuy. He shows that in a mass society, the "propaganda" effect isn't just in the artist's intent; it's equally in the fractured, politicized heart of the audience itself. The film adds the dimension of **simultaneous, contested reception** that the essayists, writing before the age of mass media blockbusters on race, could only partially anticipate.
