prompt: |-
  I'm TA-ing a philosophy of mind course -- third-year undergrads, ~16 of them, one 90-minute seminar slot, next week's reading is Dennett on the three stances and real patterns. The lecture covers the theory, so I don't want my seminar to just be me re-explaining it. I want an activity where they *feel* why the intentional stance is something you'd take seriously rather than a polite fiction, ideally by getting beaten at a prediction task.

  Here's the idea I had but can't flesh out: a prediction game with one target system and several teams, where each team gets a different kind of information about the same system, and the teams reasoning at the higher level reliably beat (or at least match) the team drowning in the lower-level stuff, even though the lower-level info is strictly more complete. Something like: one team gets a full dump of the system's internal state or code but has to actually compute from it, another team gets the rules and design, another team just gets logs of its past behavior and has to find the pattern themselves. I want the "more information is useless without compression" thing to show up in the scores, not in my slides.

  Requirements:

  - Runnable by one person with a laptop, a projector, index cards, and whatever free/browser stuff exists. No coding assignments for the students beforehand, no special software I have to install at 9am.
  - The target system should be boring enough to be fully knowable but not so boring that the intentional-level predictions are trivially right. You pick it -- a simple game bot, a little maze agent, a group of students playing a fixed strategy, whatever actually works. Justify the choice briefly.
  - There need to be real stakes of some kind (points, candy, bragging rights -- no real money), and ties need a story, because I suspect ties will happen.
  - Somewhere in the debrief I want the "okay but is the pattern *real* or just a convenient compression trick" question to come out of *their* mouths, not mine. Build the activity so it has a natural pressure point where that question becomes urgent, and tell me where it is so I can shut up and wait.

  Please structure your answer with these sections, in this order, roughly these lengths:

  1. **The target system and why** -- one paragraph.
  2. **How to run it** -- step by step with timing across the 90 minutes, including team assignments and what info each team recieves and when; about a page.
  3. **Scoring and stakes** -- half a page, including tie-breaking and what to do if one level of description just doesn't win on the day.
  4. **Debrief script** -- what to ask, in what order, and how to map specific moments in the game onto the physical/design/intentional stances and onto what makes a pattern "real" for Dennett; half a page to a page.
  5. **What will go wrong the first time** -- a short list, honestly. I've run enough seminars to know something will.
  6. **What the game can't reproduce** -- a short paragraph on which part of the position this activity genuinely cannot make them feel, and that I'll have to supply in conversation myself.

  One more thing: I'd rather the game not stack the deck so hard that the intentional team always wins. If the design-level team can win sometimes, or the log-readers stumble onto the pattern first, that's fine -- arguably better. Tell me whether your design allows that and whether that helps or hurts the point I'm trying to make.
reasoning: |-
  We are designing an activity for a philosophy of mind seminar on Dennett's three stances (physical, design, intentional) and real patterns. The goal is to have students experience how adopting a higher-level stance (like the intentional) can be more efficient for prediction even when lower-level information is available, and to provoke the question of whether the pattern is real or just a useful fiction.

  1. **The target system and why**

  We'll use a simple grid-world agent (a "bug") that moves in a 10x10 grid. The bug has a fixed set of rules: it always tries to move toward a goal (which is fixed for the entire game) but with a twist: it has a "preference" for moving horizontally first if the horizontal distance is greater than or equal to the vertical distance, and vertically otherwise. However, the bug is also programmed to avoid obstacles (which are placed in the grid) by going around them in a fixed way (e.g., if blocked, it will try to go up, then right, then down, then left until it can move toward the goal again). The grid, goal, and obstacles are fixed for the entire session. Why? It's simple enough that the physical state (exact cell positions) and the design (the rules) can be fully described, but complex enough that predicting the next move from the physical state alone is computationally heavy without knowing the rules. The intentional stance (treating the bug as if it has beliefs and desires) can quickly predict by ascribing the goal and some rudimentary rationality. The grid is small enough to be tractable but not trivial.

  2. **How to run it**

  **Preparation (before class):**
  - Create a 10x10 grid on a poster or projected image. Mark the starting position, the goal (e.g., a star), and some obstacles (e.g., 3-5 black squares). The obstacles should be placed such that the bug sometimes has to detour.
  - Program (or pre-calculate) the bug's path for the entire grid. You can do this in a spreadsheet or write a simple script (in Python, JavaScript, or even Excel) that, given the current position, outputs the next move. Alternatively, you can pre-calculate the entire path and write it down. The bug's rules are:
    1. If the goal is directly reachable in a straight line (no obstacles in between), move one step toward the goal (horizontally or vertically as appropriate).
    2. If there's an obstacle, use a fixed obstacle-avoidance subroutine: try to go around by moving in the first available direction in the order: up, right, down, left, until it can resume toward the goal.
    3. If multiple moves are equally good (e.g., same horizontal and vertical distance), move horizontally (right or left) first.
  - Prepare index cards with information for each team (see below). Also, prepare a scoreboard (on the board or projected).

  **In class (90 minutes):**

  - **Introduction (5 mins):** Explain that we are going to play a prediction game. There is a bug moving in a grid. The goal is to predict the bug's next move at each step. There will be three teams, each with different information. Emphasize that the team with the best predictions will win (and mention the stakes, e.g., candy or bonus points).

  - **Team formation and information distribution (5 mins):** Divide the class (16 students) into three teams. It's okay if teams are uneven (e.g., 5-5-6). Assign each team a stance and give them the corresponding information on index cards or handouts:

    - **Team Physical (P-Team):** They get a full dump of the current physical state at each step. This will be a grid representation (with the bug's current position) and nothing else. They do not get the rules. (But they can try to infer from the state.)
      *Card: "You have access to the current state of the system: the grid, the bug's current position, the goal, and obstacles. You do not know the rules of how the bug moves. At each step, we will show you the current grid. Predict the next move (up, down, left, right)."*

    - **Team Design (D-Team):** They get the design stance information: the exact rules the bug follows (as written above) and the initial state (starting position, goal, obstacles). They do not get the current state during the game until they are shown the grid (but they can track it if they pay attention).
      *Card: "You know the design: the bug's movement rules. [Write the rules clearly.] You also know the initial setup (start, goal, obstacles). At each step, we will show the current grid to everyone. Use the rules to predict the next move."*

    - **Team Intentional (I-Team):** They get the intentional stance information: they are told that the bug "wants" to get to the goal and is "rational" in taking the shortest path, but they are not given the exact rules. They also know the initial state.
      *Card: "You know that the bug 'desires' to reach the goal and is 'rational' in choosing moves that get it closer. You know the initial setup (start, goal, obstacles). At each step, we will show the current grid. Predict the next move by ascribing beliefs and desires to the bug."*

  - **Practice round (5 mins):** Start at the initial position. Show the grid (projected). Give all teams 1 minute to discuss and write their prediction (on an index card) for the first move. Collect the predictions and reveal the correct move (by running the bug one step). Award a point for each correct prediction. This round is for understanding and does not count toward the final score.

  - **Main game (30-40 mins):** Run the bug for 10-15 moves (enough to see the pattern and obstacles). At each step:
    1. Project the current grid (with the bug's position).
    2. Start a timer (1-2 minutes per step). Each team discusses and writes their prediction (on a new index card) for the next move. They must write the direction (up, down, left, right) and turn in the card before time is up.
    3. Collect the cards and then reveal the bug's actual next move (by moving the bug and updating the grid).
    4. Record which teams were correct. Award one point per correct prediction.

  - **Mid-game twist (optional, if time allows and to break ties):** After a few moves, change the goal (announce that the bug now has a new goal). Do not change the rules. Now, the intentional team might adjust quickly (by ascribing a new desire), the design team must figure out how the rules apply to the new goal, and the physical team has no history of moves toward the new goal. Run 3-5 moves with the new goal.

  - **Scoring and winner announcement (5 mins):** Tally the points and declare the winner.

  3. **Scoring and stakes**

  - **Scoring:** Each correct prediction in the main game (and mid-game twist if used) earns one point. The team with the most points wins. If there is a tie, use the tie-breaker: the team that made the fastest correct prediction in the last step (if they have a timestamp, or else have a quick sudden-death prediction round at a new position).

  - **Stakes:** Offer a small prize (e.g., candy bars for the winning team, or bonus participation points). Bragging rights are also effective.

  - **What if one level doesn't win?** That's okay. The point is not that the intentional stance always wins, but that it is often competitive or better despite having less information. If the design team wins (because they have the rules and can compute), that's fine because it shows the design stance is powerful when you know the design. If the physical team wins, it might be because the grid was so simple that brute force worked, but that's unlikely if the obstacles force complex detours. In debrief, we can discuss why one stance won and what it tells us about the system and the stance.

  4. **Debrief script (15-20 mins)**

  Start by asking:

  - "Which team won? How did you feel about the information you had?" (Let each team share briefly.)

  Then, map the experience to the stances:

  - "Team Physical, you had the lowest-level information. What was it like trying to predict? Did you feel like you were drowning in data?" (They might say they tried to see patterns but it was hard without knowing the rules.)

  - "Team Design, you had the blueprint. How did that help? Were there times when it was still hard to compute?" (They might say they could compute but it took time, especially when obstacles forced detours.)

  - "Team Intentional, you had the least information but a higher-level description. How did you make predictions? Did you feel like you were mind-reading?" (They might say they just imagined what they would do to get to the goal, avoiding obstacles.)

  Now, provoke the key question:

  - "Notice that the intentional stance often worked well. But did the bug *really* have beliefs and desires? Or was it just a program following rules?" (Let them debate. Then ask:) "Suppose the intentional stance made correct predictions. Does that mean the pattern of 'goal-seeking' is real? Or is it just a useful fiction for us?"

  Link to real patterns:

  - "Dennett says a pattern is real if it is projectible from some perspective. Here, the intentional stance projectibly predicted the moves. But so did the design stance. What does that tell us about reality? Is there one true description?"

  Finally, address the twist (if used):

  - "When the goal changed, how did your predictions change? Did one stance adapt better? What does that say about the flexibility of the stances?"

  5. **What will go wrong the first time**

  - **Time management:** The prediction steps might take longer than 2 minutes. Be strict with time. If a team is late, they lose the point for that step.
  - **Technical issues:** If you are running a live simulation, a bug in the code could cause wrong moves. Pre-calculate the entire path to avoid this.
  - **Team confusion:** Some teams might not understand their role. Clarify during practice.
  - **Ties:** If two teams have the same points, use the tie-breaker. If still tied, declare both winners.
  - **Intentional team cheating:** They might try to infer the rules. Remind them to use only the stance they were given.

  6. **What the game can't reproduce**

  The game cannot fully capture the depth of the intentional stance in real life, where we attribute rich mental states (like beliefs about the world) to systems that are vastly more complex than our grid bug. Also, in real systems, the intentional stance often involves interpretation and can be indeterminate (multiple interpretations might fit). Here, the intentional stance has a clear, correct answer. The activity cannot make them feel the *indeterminacy* of interpretation that Dennett acknowledges, nor the full extent of how the intentional stance works in systems with learning or evolution. You'll have to bring that up in conversation.
answer: |-
  ### 1. **The target system and why**  
  I propose a **simple maze-solving bot** that navigates a 5x5 grid to reach a goal (★). The bot follows deterministic rules:  
  - Always moves toward the goal via the *shortest path*.  
  - If multiple shortest paths exist, it prioritizes horizontal (left/right) over vertical (up/down) movement.  
  - Obstacles (■) block paths, forcing detours (e.g., moving around a wall).  
  **Why this works**:  
  - **Physical-level complexity**: The bot’s state (position, grid layout) is fully knowable but requires processing all coordinates to simulate step-by-step moves.  
  - **Predictive depth**: Obstacles create non-linear paths, making low-level computation tedious but allowing the design/intentional stances to "compress" the pattern (e.g., "it seeks ★ efficiently").  
  - **Balance**: The intentional stance won’t always dominate—e.g., near obstacles, the design stance might compute faster; if the bot’s path is simple, physical observers might brute-force correctly. This mirrors Dennett’s view: stances are tools, not strict hierarchies.  

  ---

  ### 2. **How to run it**  
  **Total time**: 90 minutes (adjustable).  
  **Materials**: Projector (display grid), laptop (run simulations via free tools like [Maze Generator](https://www.mazegenerator.net/) or pre-made in Google Sheets), index cards (predictions), whiteboard (scores).  

  #### **Steps**:  
  1. **Intro (5 mins)**:  
     - Explain the rules: Teams predict the bot’s next move (up/down/left/right) at each step. Stakes: Points → prizes (candy/bonus participation points).  
     - Project the grid: Label start (S), goal (★), obstacles (■). Use a pre-solved maze for consistency (e.g., [this layout](https://tinyurl.com/yc78d4j5)).  

  2. **Team assignments (5 mins)**:  
     - Divide into three teams (5–6 students each). Assign stances via index cards:  
       - **Team Physical (P)**: Receives *full state data*—a spreadsheet dump of the bot’s past positions (e.g., "Step 1: (1,1), Step 2: (1,2)") updated live.  
       - **Team Design (D)**: Receives *rules*—the movement algorithm (written plainly).  
       - **Team Intentional (I)**: Receives *only behavior logs*—a list of past moves (e.g., "Step 1: right, Step 2: down") + the hint: "The bot *wants* to reach ★."  

  3. **Practice round (10 mins)**:  
     - Run 2 moves without scoring. Clarify questions.  
     - *Example*: Bot starts at (1,1), ★ at (5,5). First move: right (horizontal priority).  

  4. **Main game (40 mins)**:  
     - **15 prediction rounds**: Advance the bot 1 cell/round. For each round:  
       1. **Display current grid** (projector).  
       2. **Teams predict next move** (1–2 mins): Write direction on index cards.  
          - *P-team*: Uses coordinates to simulate moves.  
          - *D-team*: Applies rules to current state.  
          - *I-team*: Infers goal-seeking from logs.  
       3. **Reveal correct move**, update scores (1 pt/correct prediction).  
     - **Twist (round 8)**: Add a new obstacle blocking the current path. Reshuffles predictions—tests adaptability.  

  5. **Final scoring (5 mins)**: Tally points. Declare winner.  

  ---

  ### 3. **Scoring and stakes**  
  - **Scoring**: 1 pt per correct prediction (15 rounds max).  
  - **Stakes**: Winning team gets candy/trinkets + "Stance Champion" title (write on board). Bragging rights emphasized!  
  - **Tiebreakers**:  
    - Sudden-death round: Predict a move from a new maze layout.  
    - If tie persists: Award all tied teams—then discuss why stances tied (e.g., "Was the pattern obvious to everyone?").  
  - **If one stance dominates**: Likely I- or D-team wins, but if P-team scores high (e.g., in simple rounds), highlight: "More data helped here, but was it *efficient*?" If I-team loses badly, note: "Intentional stance relies on patterns—if the system is too chaotic, it fails." This reinforces Dennett’s pragmatism.  

  ---

  ### 4. **Debrief script**  
  **Goal**: Elicit "Is the pattern real?" organically.  
  **Timing**: 20 mins.  

  1. **Start with reactions** (5 mins):  
     - Ask each team: "What was hardest? Did your info feel useful?"  
     - *Physical team* often says: "We had all the data but no time to process it."  
     - *Design team*: "Rules helped, but computing took effort."  
     - *Intentional team*: "We just asked, ‘What would a goal-seeker do?’"  

  2. **Map to stances** (5 mins):  
     - "Team P, you used the **physical stance**—raw data without interpretation. How did that feel?"  
     - "Team D, you used the **design stance**—you knew the ‘blueprint.’ Was it like reverse-engineering?"  
     - "Team I, you used the **intentional stance**—treated the bot as if it had desires. Did that feel like a ‘cheat’?"  

  3. **Trigger the key question** (5 mins):  
     - Pose: "Team I often won by assuming a ‘desire.’ But *does the bot actually want anything?* Or did you just impose a story?"  
       - **Pressure point**: When students note I-team’s efficiency despite "made-up" beliefs. *Stay silent—wait for comments*.  
       - Likely student quote: "But the pattern worked... does that make it *real*?"  
     - If silent, ask: "If a stance predicts well, does that make its pattern ‘real’?"  

  4. **Link to Dennett** (5 mins):  
     - "Remember the bot’s detour around obstacles? Team I saw ‘goal-seeking,’ Team D saw rules, Team P saw coordinates. Dennett says a pattern is **real** if it’s *discernible* and *projectible*—like how ‘goal-seeking’ let Team I predict faster. But is it in the bot, or just in us?"  
     - Conclude: "Stances are tools. The ‘real pattern’ is what reliably compresses information for a purpose."  

  ---

  ### 5. **What will go wrong the first time**  
  - **P-team gets overwhelmed**: They might freeze analyzing data. Mitigate: Remind them to "spot trends, not simulate everything."  
  - **Tech hiccups**: Maze generator lags? Pre-load 2–3 mazes in Google Slides as backup.  
  - **Ties dominate**: Common if moves are obvious. Use the twist to break ties.  
  - **Intentional team "cheats"**: E.g., they infer rules from logs. Redirect: "Stick to your stance—no detective work!"  
  - **Time runs short**: Skip rounds 12–15 if needed; focus on twist rounds for critical discussion.  

  ---

  ### 6. **What the game can’t reproduce**  
  This activity **cannot simulate the indeterminacy of real intentional systems**. Students see a bot with fixed rules, but Dennett argues real minds (or complex systems like evolution) have *multiple valid intentional interpretations* (e.g., "Is the bot avoiding obstacles or seeking efficiency?"). Here, the "goal" is unambiguous, so the intentional stance feels less like a "fiction" and more like a direct readout. You’ll need to **explicitly discuss** this post-activity: "In real life, the intentional stance is a bet on the best story—not a guaranteed map. Its ‘reality’ is in its utility, not perfect truth."  

  ---

  **Design note**: The game doesn’t rig outcomes—I-team often wins, but D-team can dominate near obstacles, and P-team might score high on early/simple moves. This *helps* your point: It shows stances are context-dependent, mirroring Dennett’s view that no stance is universally "truer." The key is efficiency under constraints, which the scores will starkly reveal.
