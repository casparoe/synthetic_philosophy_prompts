prompt: |-
  I have just been elected chair of my university's curriculum committee, a position I did not especially seek, and before our first consequential vote I need to understand something I stumbled into while reading up on committee procedure.

  Over the summer, in anticipation of a vote on restructuring the general-education requirements, I informally polled the eight other members about their preferences over the three leading proposals. When I tabulated the results, I found that a majority prefers proposal A to proposal B, a majority prefers B to C, and a majority prefers C to A. Whatever we do, it seems, a majority of the committee would rather we had done something else.

  A colleague in the mathematics department waved this off, telling me it is just Arrow's impossibility theorem and that I should stop worrying. But I am not sure the shoe fits. My understanding, from a hasty reading, is that Arrow's theorem concerns rules for converting ranked ballots into a ranking of options, whereas my problem begins after everyone's preferences are known. It is a problem about which procedure to run, and I have noticed that it has two parts that may or may not be the same phenomenon:

  First, there is the cycle itself. No single option commands a majority against each rival, so the result of head-to-head voting depends on the order in which the head-to-head votes are held. If I, as chair, pair A against B first and then the winner against C, we end up with C; run it in the other direction and we end up with A. Every individual vote is a fair majority vote, and yet the final outcome tracks my choice of agenda nearly as much as it tracks the committee's preferences. I have noticed that political scientists use the phrase agenda-setting for the media's control over what gets discussed at all, and I cannot tell whether that is the same concept or a neighboring metaphor.

  Second, in an earlier episode I have belatedly understood, the committee did not use head-to-head voting at all. We voted to eliminate the least popular option and then voted again between the survivors, and the option that survived that gauntlet would, on the preferences I have since reconstructed, have lost a direct comparison with one of the eliminated options. So even when the committee's preferences do contain an option that beats every other one on one, the procedural details can still smuggle in a different result. That makes me suspect my mathematician friend has pointed me at a famous theorem while missing the actual mechanism.

  I am not asking for a reading list. What I want is a careful answer to the following: Do these phenomena — the order-dependence of sequential majority voting, and the divergence between elimination-style procedures and pairwise comparisons — have established names in the social-choice literature? Is my friend right that this is Arrow's theorem, or is it something adjacent to it, and what exactly is the boundary between the two? I have also heard that there is a separate literature about voters misrepresenting their preferences in early rounds to secure a better final outcome, and I would like to know where that ends and what I have described begins, since in my case I am assuming everyone votes sincerely throughout. Finally, a request about how you answer: please keep clearly separate what is mathematically settled from what is genuinely contested among people who study this, for instance about how much any of it matters in real committees like mine, and do not present a contested view as the consensus. I ask because the practical question facing me is whether any procedure I choose can honestly be described as neutral, and I need to know which parts of the answer I can rely on and which are matters of ongoing dispute.
reasoning: |-
  Okay, let me unpack this complex query from the newly elected curriculum committee chair. They're grappling with two distinct but related voting paradoxes in their 9-member committee, and need precise terminology and conceptual clarity to navigate an upcoming vote. 

  First, I recognize their primary example (A>B, B>C, C>A majority preferences) as a classic Condorcet cycle - that's the unambiguous label for the first phenomenon. The chair's observation about agenda manipulation potential is spot-on; this directly connects to McKelvey-Schofield theorems on path dependence. 

  The second issue (elimination procedure producing different results than pairwise comparisons) strikes me as a textbook illustration of how voting systems violate independence of irrelevant alternatives (IIA). The chair's reconstructed example shows how a "Condorcet winner" can lose in elimination formats - that's crucial terminology to provide.

  I need to carefully distinguish this from Arrow's theorem, which their math colleague mentioned. While related (both involve collective rationality failures), Arrow's theorem is more abstract - about impossibility of perfect ranking systems. The chair's concrete procedural dilemmas are better explained by Condorcet paradox and IIA violations. 

  Regarding strategic voting, I should note that the Gibbard-Satterthwaite theorem applies to insincere voting, but since the chair specified sincere voting throughout, that's a separate issue. The core problems here emerge even with sincere votes.

  For practical implications, I must separate settled math from disputed real-world relevance. The existence of these paradoxes is mathematically proven, but their frequency in small committees is debated. Some scholars (like Niemi) have empirical estimates that could reassure the chair, while others (Riker) emphasize strategic risks. 

  The chair's request for "neutral" procedures requires honesty: no ranked system satisfies all fairness criteria simultaneously. I should recommend practical mitigations like Condorcet-compatible methods (e.g. Copeland) while acknowledging no perfect solution exists. 

  Most importantly, I need to validate their insight that agenda control becomes powerfully consequential in these scenarios - that's not just media terminology but a core concept in social choice theory. Their observation about procedure mattering as much as preferences is profoundly correct.
answer: |-
  You've identified two distinct but interconnected phenomena in social choice theory, neither of which is precisely Arrow's Impossibility Theorem—though they are closely related. Below is a breakdown of the established terminology, conceptual boundaries, and practical implications, separating settled mathematics from contested interpretations.

  ### 1. **The Cycle Phenomenon (A > B > C > A)**
     - **Name:** **Condorcet Paradox** (or **Voting Cycle**).
     - **What it is:** A situation where collective preferences cycle despite individual preferences being transitive (e.g., majority prefers A > B, B > C, but C > A). This arises from pairwise majority voting.
     - **Agenda Dependence:** The outcome depends entirely on the order of votes (e.g., pairing A vs. B first yields C; pairing B vs. C first yields A). This is **agenda manipulation** (or **path dependence**), a direct consequence of the cycle.
     - **Relation to Arrow's Theorem:**  
       Arrow's theorem proves *no* ranked voting system can satisfy universal axioms (e.g., transitivity, independence of irrelevant alternatives, no dictator) when aggregating individual rankings. The Condorcet Paradox is a *specific example* illustrating why Arrow's conditions fail: it violates **collective rationality** (transitivity of group preferences). Arrow's theorem is the broader theoretical framework; the cycle is a concrete manifestation.
     - **Settled Mathematics:**  
       Cycles are inevitable under majority rule with ≥3 options if preferences are not single-peaked (a specific alignment pattern). The likelihood of cycles increases with more voters/options (proven by combinatorial models, e.g., McGarvey's theorem).

  ### 2. **Divergence Between Elimination Procedures and Pairwise Comparisons**
     - **Name:** **Violation of the Condorcet Criterion** (and **Independence of Irrelevant Alternatives**).  
     - **What it is:**  
       - A **Condorcet Winner** is an option that beats every other in pairwise comparisons.  
       - Your elimination procedure (e.g., eliminate the "least popular" first) may defeat a Condorcet Winner because:  
         (i) The "least popular" is defined by plurality, not pairwise comparisons;  
         (ii) Eliminating an option alters later comparisons (violating **independence of irrelevant alternatives (IIA)**).  
     - **Example:** If C is a Condorcet Winner (beats A and B pairwise), but is eliminated first for having fewest first-place votes, then A wins—even though C would beat A head-to-head.  
     - **Relation to Arrow's Theorem:**  
       Arrow's theorem requires IIA (ranking of A vs. B shouldn't depend on other options). Elimination procedures violate IIA by design, as removing "irrelevant" alternatives changes outcomes. This is another *consequence* of Arrow's axioms clashing, not Arrow itself.  
     - **Settled Mathematics:**  
       No elimination method (e.g., instant-runoff voting/IRV) satisfies the Condorcet Criterion. Systems like plurality/IRV can eliminate Condorcet winners; systems satisfying Condorcet (e.g., Copeland, Schulze) avoid this but may have other flaws.  

  ---

  ### Key Distinctions from Strategic Voting
  You mentioned potential misrepresentation of preferences. This is **strategic voting** (or **tactical voting**), governed by the **Gibbard-Satterthwaite theorem**. It proves that *all* voting systems with ≥3 options are vulnerable to manipulation by insincere voting—unless dictatorial or restrictive.  
  - **Boundary:** Your question focuses on **sincere voting** (no misrepresentation). Strategic voting is a *separate* problem that compounds procedural issues but is not the cause of cycles or IIA violations. Sincere voting suffices to produce both paradoxes.

  ---

  ### Practical Implications for Your Committee
  #### Settled Mathematics:
  1. **Neutrality is impossible** in the strict sense. All procedures are vulnerable to:  
     - Cycles (if preferences cycle),  
     - Agenda manipulation (if sequential voting is used),  
     - Failure to elect Condorcet winners (if not using a Condorcet method),  
     - Violations of IIA (in most methods).  
  2. **Procedural choice determines outcomes** as much as preferences do.  
  3. **No "fairest" system exists**—trade-offs are inevitable (e.g., Condorcet methods avoid some paradoxes but may be complex or indecisive).

  #### Contested/Contextual Issues:
  1. **Likelihood of Cycles:**  
     - In small committees (<20) with correlated preferences (e.g., ideologically aligned faculty), cycles may be rare. Empirical studies suggest cycles occur in 10-20% of real-world cases with 3 options.  
     - **Contested:** Whether cycles are "common enough to worry about" depends on context. Political scientists (e.g., Riker) argue they undermine legitimacy; others note committees often have single-peaked preferences (no cycles).  
  2. **Choosing a "Neutral" Procedure:**  
     - **Minimal Claim:** A procedure is "neutral" if it treats all *options* symmetrically (no built-in bias). Most standard methods (e.g., Borda, IRV, Copeland) satisfy this.  
     - **Maximal Claim:** No procedure is "neutral" in outcome due to path dependence or IIA violations.  
     - **Practical Advice:**  
       - Use a **Condorcet method** (e.g., Copeland, Schulze) if electing a pairwise-beats-all winner is prioritized.  
       - Use **Borda count** if compromise options are valued (but it violates IIA and Condorcet).  
       - **Avoid sequential votes** if cycles are suspected—use a single ballot.  
       - **Explicitly justify the procedure** to the committee: "We use Copeland because it ensures the winner beats all others head-to-head when possible."  

  ---

  ### Summary of Terminology
  | Phenomenon                  | Established Name          | Relation to Arrow          | Key Criterion Violated       |
  |-----------------------------|---------------------------|----------------------------|------------------------------|
  | Cycle (A>B>C>A)             | Condorcet Paradox         | Example of Arrow failure   | Collective rationality       |
  | Agenda-dependent outcomes   | Path dependence           | Consequence of cycles      | —                            |
  | Elimination ≠ pairwise      | Violates Condorcet Criterion / IIA | Consequence of Arrow | Condorcet criterion / IIA    |

  Your mathematician friend oversimplified: Arrow's theorem explains *why* these paradoxes emerge (impossibility of perfect aggregation), but your dilemmas are specific instantiations—**Condorcet cycles** and **IIA violations**—which have distinct literature and mitigation strategies. In practice, acknowledge the trade-offs transparently and choose a procedure aligned with your committee's priorities (e.g., pairwise robustness vs. simplicity). The only consensus: no system is invulnerable, but not all systems fail equally.
