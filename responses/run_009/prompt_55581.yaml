answer: |-
  Your observation cuts to the heart of a profound tension in how models function in complex, adaptive systems like finance. The practice you describe – the enduring use of Black-Scholes as a quoting convention despite its known predictive failures – **presupposes a methodology distinct from Friedman's instrumentalism, best understood as *Model-Based Coordinative Pragmatism*.** Here's a careful reconstruction:

  **Core Presuppositions of the Practice (What it Strictly Requires):**

  1.  **Models as Shared Schemas/Languages:** The primary function is not prediction *of* the world, but *coordination within* a social system (the market). Black-Scholes provides a standardized, universally understood "coordinate system" (as you aptly put it) for expressing beliefs about uncertainty (via implied volatility) and facilitating trade. Its survival is due to network effects and convention, not predictive accuracy.
  2.  **Inversion as the Primary Operation:** The model is treated as an *invertible mapping device*. Market participants input the observed price (P) and other knowns (S, K, r, T) and solve for the implied parameter (σ_imp). This inverted output (IV) is the valuable information, not the model's forward price prediction. The model's structure defines the *relationship* between variables, enabling communication.
  3.  **Parameterization as Belief Encoding:** The inverted parameter (implied volatility) becomes the *market's collective encoding* of its current assessment of uncertainty/risk *relative to the model's framework*. It's a "consensus indicator" distilled from countless trades.
  4.  **Trading on Model Deviations (Reflexivity):** The market actively trades *against the deviations revealed by the model itself* (e.g., the volatility smile/skew). The model defines "normal" (flat volatility surface), and deviations (smile) signal opportunities or risks. The model's *failures* become the *basis* for action, not a reason to discard it.
  5.  **Minimal Ontological Commitment:** The practice requires no belief that the model's assumptions (log-normality, constant vol, etc.) are "true" or even "as-if" true descriptions of agent behavior or market dynamics. It only requires agreement on the *mathematical transformation* (BS formula) and the *meaning* of its output (IV as a measure of perceived risk).

  **Where it Diverges from Friedman's Instrumentalism:**

  *   **Friedman's Focus:** Predictive power *is* the ultimate justification. Unrealistic assumptions are tolerated *only insofar as* they lead to successful predictions ("The only relevant test of the *validity* of a hypothesis is comparison of its predictions with experience").
  *   **Market Practice Focus:** Predictive power is demonstrably *secondary* and often poor (as evidenced by the volatility smile). The justification is **coordinative utility and information extraction via inversion**. The model isn't valued for telling us *what will happen* (prediction), but for telling us *what the market currently believes* (measurement/coordination) and *where those beliefs exhibit tension* (via deviations like the smile).
  *   **The "F-Twist" and Inversion:** Friedman's license ("unrealistic assumptions don't matter if it predicts") doesn't explicitly cover or justify *inverting* a predictively poor model to create a *conventional unit of measurement*. The F-Twist defends using an "as-if" theory to predict outcomes. This practice uses a predictively flawed theory to *measure* and *coordinate* market sentiment. It's a different use case.

  **What it is Compatible With (But Doesn't Strictly Require):**

  *   **Pragmatism:** The model is a tool judged by its usefulness in achieving specific practical goals (trading, communication, risk management), not by its truth-likeness.
  *   **Constructive Empiricism (van Fraassen):** Models can be "empirically adequate" (yield correct observable outputs – in this case, the IV surface *is* an observable output used effectively) without their theoretical structures being true.
  *   **Instrumentalism (Broader Sense):** Models as instruments for organizing thought/action, not mirrors of reality. However, this is a weaker, more general instrumentalism than Friedman's prediction-centric version.
  *   **Mary Morgan's "Models as Mediating Instruments":** Models serve as instruments that mediate between theory and the world, but crucially, also between different agents *in* the world, facilitating interaction and negotiation.

  **The Role of False Assumptions:**

  The practice **does not presuppose** that the false assumptions (Gaussian tails, etc.) are harmless. Instead:

  1.  **The Known-False Assumptions Define the "Baseline":** The model's idealized world defines the "simple" case (flat volatility) against which deviations (the smile) are measured and interpreted. The *falsity* of the assumptions is precisely *why* the deviations exist and are informative.
  2.  **Trading *Around* the Assumptions:** Traders are acutely aware the assumptions are false. They trade instruments (options, volatility derivatives) explicitly designed to hedge or speculate *against* the risks arising from these false assumptions (e.g., tail risk not captured by log-normality). The model provides the common language to express *disagreements* with its own embedded assumptions. The Gaussian assumption isn't doing "load-bearing work" in describing reality; it's doing "load-bearing work" in defining the *conventional framework for disagreement*.

  **What Would Change Under a Realist View?**

  A strict realist methodology, demanding models represent underlying mechanisms or make predictively accurate assumptions, would likely lead to significant changes:

  1.  **Abandonment of Black-Scholes as Core Framework:** Realists would focus on developing and using models that more accurately reflect the "true" mechanisms (e.g., stochastic volatility, jumps, rough volatility models). Black-Scholes would be seen as a pedagogical toy or historical artifact, not the central quoting convention.
  2.  **Direct Study of Assumptions:** Instead of using IV as an abstract measure *within* the flawed BS framework, realists would prioritize direct empirical study and modeling of the phenomena the assumptions get wrong (e.g., modeling tail distributions, volatility clustering, market microstructure effects).
  3.  **Alternative Coordinative Frameworks:** A new, more "realistic" model (or suite of models) might eventually emerge as a *de facto* standard if it demonstrably improved predictive power *and* achieved critical mass adoption. However, network effects are powerful; the shift would be slow and difficult. Coordination might fracture across different models/schools.
  4.  **Less Reliance on "Implied" Parameters:** The focus might shift away from inverting a simple-but-flawed model to extract an implied parameter, towards using models that directly estimate parameters believed to represent real processes (e.g., fitting stochastic volatility model parameters to time series data).
  5.  **Potential for Increased Complexity & Disagreement:** Realist models are often more complex and less analytically tractable than BS. This could make them harder to use as a universal quoting language, potentially leading to less standardization and more fragmented markets. Disagreements might be about *which* realistic model is best, rather than the *degree of deviation* from a shared, simple baseline.

  **Conclusion:**

  The enduring use of Black-Scholes as an inverted quoting convention **presupposes a methodology centered on models as coordinative schemas and measurement devices within a complex social system, not as predictive theories.** It strictly requires agreement on the model's mathematical structure as a *convention* for communication and information extraction (via inversion), but requires *no belief* in the truth or "as-if" adequacy of its assumptions. Friedman's instrumentalism justifies using simple models with false assumptions *if* they predict well; this practice justifies using a predictively flawed model *because* its simplicity and invertibility create a powerful, self-referential coordination tool. The market trades *on* the model's known failures, using them as signals within the very framework it reveals as inadequate. A switch to realism would likely destabilize this deeply embedded coordinative function, forcing a shift towards potentially more accurate but less standardized models and a focus on directly studying the mechanisms the current practice cleverly, if indirectly, trades around. The genius (and danger) of the practice lies in its pragmatic recognition that sometimes, a flawed shared language is more valuable than a fragmented pursuit of perfect realism.
