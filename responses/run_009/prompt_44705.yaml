prompt: |-
  Quick context first: next month I'm presenting at a philosophy department colloquium, and I need Q&A prep. The room will be roughly half Lewis-style conventionalists — people who think of conventions as solutions to coordination problems and who get twitchy the moment the phrase "moral obligation" appears anywhere near the word "convention" — plus a couple of Kantians who hold that conventions can at best generate hypothetical imperatives, and one person who does empirical work on social norms and will pounce on any empirical claim I make without a study behind it.

  My thesis, in brief: everyday conventions like tipping, queueing, and rules about jaywalking generate genuine pro tanto moral obligations — not just etiquette, not just prudence — and visitors are bound by them too. But I want to defend a specific asymmetry, and this is the part I think is actually new: conventions that solve pure coordination problems (which side of the sidewalk you walk on, say) bind visitors only weakly, while conventions that are really about redistribution bind visitors more strongly. Tipping is my big example. My rough idea is that when you tip you're not coordinating anything — you're plugging into a system where locals have made costly, hard-to-reverse ajustments premised on compliance (waiters in the US structure their wage expectations around it, their employers even build the minimum wage around it). So the obligation tracks who has structured their life around the convention. A tourist who doesn't tip isn't failing to coordinate, they're free-riding on an arrangement someone else's life plans depend on. Whereas the tourist walking on the "wrong" side of the footpath inconveniences nobody in any lasting way, so their obligation there is thin even if the locals' is thicker.

  So, prep me for the question period. Give me the objections in roughly the order they'll actually arrive, phrased the way each group would phrase them — the Lewisians, the Kantians, the norms person; make them sound like their training, not like generic smart-people pushback. For each: how much damage it does if I fumble it, a two-minute reply I can actually deliver standing up, and where the reply is soft. Tell me what I should concede up front. And dig up the question I'm hoping nobody asks — I suspect it's the one about whether my "who structured their life around it" test just collapses into "the waiter benefits from compliance," which would make the whole thing look like a utilitarian argument in a convention costume, but if you think there's a worse one lurking, name it. That one gets the longest prep.
reasoning: |-
  Okay, the user is preparing for a philosophy colloquium Q&A and needs targeted prep. Their thesis argues that everyday conventions create genuine moral obligations, with an asymmetry: coordination conventions (like sidewalk rules) bind weakly, while redistributive ones (like tipping) bind stronger. They'll face Lewisians (convention-as-coordination purists), Kantians (hypothetical-imperative skeptics), and an empirical norms researcher. 

  First, the Lewisians will pounce on the blurring of convention and obligation. Their core objection is that conventions solve coordination problems, not moral ones. If the user fumbles this, it undermines the whole foundation. The reply must stress that redistributive conventions *aren't* coordination problems—they're collective action failures where free-riding harms real people. Concede that pure coordination problems lack moral weight, but hold the line on redistribution. 

  The Kantian will demand a categorical imperative basis. Fumbling here makes the theory look like disguised utilitarianism. The reply should leverage Kant's own "dependence" principle from the Doctrine of Virtue: undermining others' life plans violates respect for humanity. Soften by admitting hypothetical elements exist but reframe reliance as a dignity issue. 

  The norms researcher will want citations. Since the user won't have studies on-hand, fumbling risks looking empirically flimsy. Reply by shifting to thought experiments (e.g., "Imagine a waiter who...") and emphasize this is normative theory building on empirical phenomena. Concede the need for future collaboration. 

  The nightmare question is lurking: isn't this just utilitarianism? Because if "life plans" = welfare gains, the distinction collapses. The user needs to preempt this by stressing *relational* harm—not just that the waiter loses money, but that the tourist exploits a *relationship of mutual reliance* the locals maintain. The non-tipper isn't merely optimizing outcomes; they're betraying the cooperative baseline. 

  Secondary trap: what if locals *don't* rely? (E.g., a waiter who hates tips.) Reply: obligation stems from the *institution's* design, not individual psychology. The system expects reliance, so violating it still risks harm. 

  User's blind spot: they're so focused on defending asymmetry they haven't defined "redistribution" sharply enough. Someone could argue sidewalk rules *do* redistribute (e.g., favoring right-handers). Need a tighter criterion—maybe "whether non-compliance transfers costs to specific parties without consent."
answer: |-
  Here's your Q&A battle plan, structured for maximum survival. I'll simulate the room's objections in probable order of attack, with tactical responses. The nightmare question *is* the utilitarian collapse one, but I've buried a worse landmine at the end.

  **The Order of Attack & Your Defense:**

  1.  **The Lewisian Salvo (First, loudest, most agitated):**
      *   **Objection (Phrased Lewis-style):** "You're smuggling morality into convention by the back door! Lewis showed conventions are arbitrary equilibria solving pure coordination problems – like driving sides. Obligation only arises hypothetically: *if* you want coordination, *then* follow convention. Tipping might be a different *kind* of pattern, maybe a norm or a social contract, but calling it a 'convention' generating *moral* obligation for visitors? That conflates distinct concepts and ignores the arbitrariness essential to genuine conventions. Where's the coordination problem tipping solves? It looks like pure redistribution, not coordination!"
      *   **Damage if Fumbled:** High. Undercuts your core claim that tipping *is* a convention generating obligation. Makes your asymmetry look confused.
      *   **Your 2-Minute Reply (Concede & Reframe):**
          > "You're absolutely right to insist on the core Lewisian insight: pure coordination conventions *are* arbitrary equilibria, and their *primary* function is solving coordination problems, generating hypothetical imperatives conditional on wanting coordination. Where I propose a distinction is recognizing that some patterns *called* conventions aren't solving pure coordination problems. Tipping in the US *isn't* arbitrary in the same way the driving side is. It's a deeply entrenched *redistributive mechanism* masquerading as etiquette. It lacks the key Lewisian feature of multiple, equally good equilibria. Crucially, it's not about coordinating actions to avoid mutual frustration; it's about transferring resources based on a widely understood (if flawed) economic expectation. Locals *rely* on this transfer to structure their livelihoods. Calling it a 'convention' might be stretching the term, but it's the common label for the practice. The key point is this specific *kind* of social pattern – one involving costly reliance and redistribution – generates a different kind of reason for visitors than a pure coordination rule."
      *   **Softness:** Concede the core Lewisian definition applies perfectly to pure coordination. Reframe tipping as a *different beast* commonly lumped under "convention" but functionally distinct in ways that *do* ground obligations.

  2.  **The Kantian Challenge (Calm, precise, principle-driven):**
      *   **Objection (Phrased Kantian-style):** "Even granting your distinction, how does this reliance generate a genuinely *moral*, *categorical* obligation for the visitor? At best, it seems to generate a hypothetical imperative: *If* you don't want to harm the waiter's livelihood (or *if* you want to benefit from the local service economy), *then* you should tip. But where is the universalizable maxim? Where is the duty grounded in pure practical reason, independent of contingent consequences like reliance? Isn't this just prudence or beneficence dressed up as obligation?"
      *   **Damage if Fumbled:** Moderate-High. Makes your "moral obligation" claim look like mere prudence or optional beneficence, undermining its force.
      *   **Your 2-Minute Reply (Concede & Elevate):**
          > "A crucial point. I concede that pure coordination conventions likely only bind hypothetically. But for redistributive conventions like tipping, I argue the obligation stems not just from consequences, but from *exploiting a system of mutual reliance*. The visitor knowingly enters a cooperative scheme locals have built their lives around. Failing to contribute (tipping) while benefiting (eating the meal) treats the waiter merely as a means to an end – enjoying service paid for by others' compliance. It violates the duty of respect by undermining the conditions upon which the waiter reasonably depends for fair compensation. It's not *just* about harming welfare (though that happens); it's about free-riding on a system of mutual contribution others sustain. This failure of reciprocity and exploitation of reliance *can* be grounded in a universalizable maxim concerning fair participation in cooperative practices one willingly engages with."
      *   **Softness:** Acknowledge the hypothetical element in pure coordination cases. Ground the stronger obligation in Kant's *own* principles of non-exploitation and treating others as ends, linking it to reciprocity within a specific cooperative practice the visitor *chooses* to engage in.

  3.  **The Norms Expert Snipershot (Data-focused, skeptical):**
      *   **Objection (Phrased Empirically):** "Your claim that waiters 'structure their life plans' around tipping is empirically shaky without citation. What evidence shows this reliance is universal or sufficiently costly/reversible to ground an obligation? Studies show tip amounts vary wildly based on factors unrelated to service quality or need (race, gender, appearance). Doesn't this variability and potential bias undermine the claim it's a reliable, obligation-grounding system? How do you know the visitor's non-compliance actually disrupts this system meaningfully?"
      *   **Damage if Fumbled:** Moderate. Makes your empirical premise look speculative, weakening the foundation of your asymmetry argument.
      *   **Your 2-Minute Reply (Concede & Theorize):**
          > "Excellent point – the empirical details matter deeply, and I concede my argument leans on a stylized model of how tipping *functions* within the specific US service economy. While I can't cite a single study proving *every* waiter structures their *entire* life around it tonight, the structural reality is undeniable: the Federal tipped minimum wage is $2.13/hour, predicated on tips making up the difference. Numerous industry reports, wage lawsuits, and worker testimonials consistently show workers *depend* on tips for basic living expenses; it's the economic engine of the sector. Yes, tipping is biased and flawed – that's a moral critique *of the system itself*, not necessarily of the obligation to comply *within* it as a visitor benefiting from it. The core point isn't about perfect reliability or fairness *of the convention*, but about the *fact of costly reliance* built into the institutional structure. Even a flawed system generates expectations and dependencies that a free-riding visitor exploits."
      *   **Softness:** Acknowledge the need for empirical support and the system's flaws. Shift focus to the *institutional structure* (minimum wage laws, standard practice) as evidence of systemic reliance, separating the obligation to participate fairly *within* a flawed system from the obligation to *reform* the system itself.

  4.  **The Nightmare Question: The Utilitarian Collapse (Likely from a sharp Lewisian or Kantian):**
      *   **Objection:** "Isn't your 'who structured their life around it' test just a proxy for who *benefits* from compliance? This seems to reduce your entire asymmetry to a utilitarian calculus: stronger obligation = greater welfare loss from non-compliance. The 'redistributive' label is just window dressing. Your tourist's 'obligation' to tip boils down to 'not harming the waiter's welfare', making it consequentialist, not uniquely about conventions at all. Haven't you just smuggled utilitarianism into conventionalism?"
      *   **Damage if Fumbled:** Catastrophic. Undermines the novelty and distinctiveness of your thesis, making it look like a convoluted way to say "don't harm people."
      *   **Your Extended Prep & Reply (3-4 mins):**
          *   **Core Defense:** Distinguish the *source* of the harm and the *relational* wrong.
          *   **Reply Structure:**
              1.  **Concede Partial Overlap:** "There's certainly overlap with welfare consequences, and harm avoidance is part of the picture. Utilitarianism captures *one* reason why non-compliance in redistributive conventions is wrong."
              2.  **Reframe as Relational/Systemic Wrong:** "But the *distinctive* wrong here is relational and systemic. It's not *just* that the waiter loses $X. It's *how* and *why* that loss occurs:
                  *   **Exploitation of Cooperative Structure:** The tourist benefits from a service delivered within a *cooperative scheme* (the tipping convention) that locals uphold. They free-ride on the contributions of others.
                  *   **Violation of Fair Play:** They accept the benefit (the meal/service) made possible by a system where compensation *depends* on customer tips, yet refuse to pay the understood cost.
                  *   **Undermining Reasonable Reliance:** The harm stems specifically from *violating a reliance interest reasonably induced by the established convention*. The waiter isn't just randomly harmed; they are harmed *because* they reasonably structured their expectations based on a widely known and practiced rule the visitor chose to disregard while participating.
                  *   **It's Conventional:** The *content* of the reliance and the *mechanism* of harm are defined *by the convention itself*. The obligation is generated by the specific social practice and one's voluntary participation in it, not by a raw welfare calculus independent of context. The wrong is *constituted* by the violation of the conventional expectations within that cooperative practice."
              3.  **Contrast with Utilitarianism:** "A pure utilitarian might say 'don't harm the waiter' applies even if tipping *wasn't* the convention (e.g., if wages were high and tipping was unheard of). My argument says the *specific obligation to tip* arises *because* of the conventional structure and the visitor's participation within it. The convention creates the *specific form of reliance* and the *specific form of free-riding* that constitutes the wrong."
              4.  **Asymmetry Holds:** "In pure coordination (walking sides), there's no analogous reliance, no cooperative scheme being exploited, no transfer of resources premised on compliance. Non-compliance causes fleeting frustration, not the undermining of a costly life plan built on mutual contribution. The wrong is thinner because the *relational/systemic harm* is absent."

  5.  **The Hidden Landmine: "What if the Locals Don't Rely? / Is the Convention Just?"**
      *   **Objection (Could come from anyone, likely the Kantian or Norms person):** "Your argument seems to make the obligation hinge on factual reliance and the convention's existence. But what if, empirically, many waiters *don't* actually rely on tips (e.g., high-end restaurants where base pay is good)? Or what if the convention is deeply unjust (reinforcing wage theft, exploitation, bias)? Does the visitor *still* have a strong obligation to tip? If not, doesn't your 'reliance' test collapse, or reveal that justice overrides convention? If yes, aren't you endorsing participation in injustice?"
      *   **Why it's Worse:** It attacks the *sufficiency* of your reliance criterion and forces you into messy real-world complexities your model might not handle cleanly. It pits your obligation against justice.
      *   **Damage if Fumbled:** High - can make your theory seem overly rigid, amoral, or blind to injustice.
      *   **Your 2-Minute Reply (Concede Complexity & Prioritize):**
          > "This exposes crucial nuance. My core argument applies to the *paradigm case*: a widely established convention where significant reliance is structurally embedded (like standard US tipping). **Concede:** 1) If demonstrably *no* reliance exists in a specific context, the obligation weakens significantly. 2) Profound injustice *in the convention itself* is a serious countervailing reason. **Defend:** However, even in flawed systems:
          *   **Systemic vs. Individual:** The obligation stems partly from participating in the *system as it exists*. Individual variation doesn't erase the systemic reliance the convention creates.
          *   **Burden of Proof:** The visitor generally lacks the information to make fine-grained judgments about individual reliance or systemic justice *in the moment*. Presumptively following the convention avoids harm and respects the local practice.
          *   **Reform vs. Compliance:** The obligation to comply *as a visitor* doesn't negate the duty to *work to reform* an unjust convention. But individual non-compliance by a tourist is rarely an effective or fair form of protest; it usually just harms the worker without changing the system. Choosing *not to patronize* establishments reliant on unfair tipping might be a more coherent protest than accepting service and then not tipping.
          *   **Threshold:** Only in cases of *extreme, undeniable* injustice or *complete* lack of reliance should the visitor's obligation dissolve entirely. The default presumption, especially for a short-term visitor, favors compliance to avoid harm and free-riding, even in imperfect systems."

  **Key Takeaways for Your Delivery:**

  *   **Lead with Concessions:** Acknowledge the valid core insights of each school (Lewis's coordination focus, Kant's categorical/hypothetical distinction, the need for empirical grounding). This builds credibility.
  *   **Reframe Relentlessly:** Constantly pivot back to your core distinction: **Pure Coordination** (arbitrary, solves mutual frustration, weak visitor obligation) vs. **Redistributive Convention** (resource transfer, costly reliance, systemic free-riding, stronger visitor obligation).
  *   **Emphasize the Relational Wrong:** The unique harm in redistributive cases is *exploiting a cooperative scheme others sustain*.
  *   **Have Your "Redistribution" Examples Ready:** Be clear on why tipping, certain queueing rules (e.g., priority for elderly/disabled), maybe some jaywalking norms (where it signals respect for traffic flow impacting others' safety/time) fit, while sidewalk walking doesn't.
  *   **"Pro Tanto" is Your Shield:** Repeatedly stress "pro tanto" – these obligations can be overridden by stronger moral reasons (dire emergency, profound injustice).

  This prep arms you for the likely assaults. Good luck at the colloquium – your thesis is provocative and deserves a strong defense! Remember to breathe and drink water during the Q&A.
