  Okay, the user is writing their master's thesis on deflationary theories of truth and encountered a challenge from their uncle during a family dinner. The uncle, an engineer and philosophy enthusiast, summarized deflationism in a way that seems flawed. The user needs an expert assessment to clarify inaccuracies and prepare for future discussions.

  First, I need to recall the core tenets of deflationism accurately. Key figures include Ramsey, Quine, and modern proponents like Horwich. The central idea is that truth isn't a substantive property but a logical device enabling generalizations. For instance, "everything he said is true" avoids listing all statements individually. The redundancy theory is part of it, but modern versions like minimalism acknowledge the utility of "true" without committing to it being a property.

  The user's uncle made several claims: that deflationists see "true" as redundant and removable, that they can't distinguish science from myth, leading to relativism, and that mainstream philosophy abandoned deflationism. I'll address each point step by step.

  The redundancy claim: Early versions like Ramsey's did suggest redundancy in specific cases, but Quine's disquotationalism and Horwich's minimalism show "true" is indispensable for generalizations. The uncle's statement that we could remove "true" entirely is a misrepresentation. Deflationists argue it's necessary for expressing generalizations efficiently.

  The inability to distinguish science from myth: Deflationism doesn't deny that assertions can be true or false based on evidence. It separates the concept of truth from justification. Science is reliable because of evidence and methodology, not because truth is substantive. The uncle conflates truth with justification, a mistake deflationists explicitly avoid.

  Relativism charge: Deflationism doesn't imply that all beliefs are equally valid. It maintains that truth is objective but not a deep property. For example, "snow is white" is true iff snow is white. The relativism inference doesn't follow, as truth-bearers are still accountable to the world.

  Abandonment claim: Deflationism remains influential, with Horwich's minimalism being a current major theory. It's not abandoned but actively debated alongside inflationary views.

  The user's deeper needs include confidently defending their thesis topic against critiques and correcting misconceptions without alienating family. They might also need succinct points for future discussions with their uncle.

  Key points to raise: the utility of "true" for generalizations, the distinction between truth and justification, deflationism's current relevance. Suggest using accessible examples to explain these concepts. Emphasize that deflationism avoids relativism by maintaining objectivity through correspondence without a substantive property.
answer: |-
  ## Professional Assessment of Uncle's Characterization of Deflationism

  **Brainstorm: Core Tenets of Leading Deflationary Positions**

  1.  **Ramsey (Redundancy/Prosentence Theory):** "It is true that p" is logically equivalent to "p". "True" serves primarily as a device for emphasis or forming prosentences ("That is true") enabling generalization over propositions ("Everything he said is true").
  2.  **Quine (Disquotationalism):** Truth is captured by the disquotation schema: "p" is true iff p. The truth predicate is primarily a device for semantic ascent/descent, allowing us to generalize over open-ended sets of sentences (e.g., "All theorems of logic are true") without infinitely long conjunctions. Truth is *immanent* to language.
  3.  **Strawson (Performative Theory):** "True" is a performative device used to endorse or concede a statement rather than describing a property.
  4.  **Horwich (Minimalism - Current Dominant View):** The *meaning* of 'true' is exhaustively captured by the equivalence schema: <p> is true iff p. The concept has no underlying nature or hidden essence to be discovered; it's "minimal". Its utility lies in forming generalizations and expressing attitudes towards propositions we cannot explicitly state.
  5.  **Key Shared Commitments:**
      *   Truth is not a substantive or "thick" property (like mass, charge, or moral goodness) revealing the deep nature of reality.
      *   The primary function of 'true' is logical/expressive, not descriptive of a complex property.
      *   The core instances of truth-talk are explained by equivalences like "Snow is white' is true iff snow is white".
      *   Denial of correspondence as a substantive *relation* or *structure* beyond the equivalence schema.
      *   Compatibility with realism about ordinary objects and science (most deflationists are realists!).

  **Assessment of Uncle's Summary Claim by Claim:**

  1.  **"The deflationists — Ramsey, Quine, and their modern followers..."**
      *   **Fair?** Mostly. Ramsey and Quine are foundational figures. Modern followers include Horwich, Field (to some extent), Grover/Camp/Belnap (prosentential theory), Williams, arguably Brandom in certain aspects.
      *   **Simplification?** Yes. Grouping them under one label is common, but subtle differences exist (e.g., Quine's disquotationalism is language-bound, Horwich's minimalism is proposition-based).
      *   **Misrepresentation?** No significant misrepresentation in the grouping itself.

  2.  **"...hold that truth is not a genuine property of sentences at all."**
      *   **Fair?** **Defensible Simplification, but needs nuance.** Deflationists *do* deny that truth is a *substantive* or *explanatory* property. Calling it "not genuine" is strong phrasing common in popular summaries. A deflationist like Horwich would say it *is* a genuine property, but a *logical* or *minimal* one with no underlying nature. Quine might say it's a predicate with a clear disquotational role, but not one denoting a "real" property like mass. The core point (no substantive property) is captured.
      *   **Misrepresentation?** Slightly misleading phrasing. Better: "deny truth is a substantive, explanatory property."

  3.  **"To say 'it is true that snow is white' is to say no more and no less than 'snow is white,'"**
      *   **Fair?** **Yes, largely fair.** This captures the core equivalence schema central to all deflationary theories. It's the fundamental insight.

  4.  **"...so the word 'true' is pure redundancy: we could strike it from the language entirely and lose nothing."**
      *   **Fair?** **Significant Misrepresentation.** While the *redundancy theory* (often attributed to Ramsey) *does* suggest this for specific contexts ("It is true that p"), **no leading deflationist, including Ramsey and Quine, actually endorses eliminating 'true' entirely.** They emphasize its **logical indispensability**:
          *   **Generalization:** We *need* 'true' to say things like "All instances of modus ponens are true," "Everything the witness said is true," or "Max Planck's last utterance was true." Eliminating 'true' would force infinitely long conjunctions, which is impossible.
          *   **Indirect Reference:** We need it to endorse propositions we can't state explicitly ("What Susan believes about quasars is true").
          *   **Semantic Ascent/Descent (Quine):** Crucial for logic, metamathematics, and discourse about language.
      *   **Deflationist Stance on Indispensability:** Deflationists universally *accept* and *explain* the indispensability of 'true' via its logical/generalizing function. Its utility is *precisely why* they offer their theory. Claiming it's redundant *simpliciter* and could be eliminated is a fundamental misunderstanding.

  5.  **"That is why they call the theory deflationary — the concept of truth just deflates into the individual assertions."**
      *   **Fair?** **Defensible Simplification.** The "inflation" deflationism opposes is the idea that truth is a metaphysically substantive property. "Deflates into individual assertions" is a vivid, if slightly crude, way of saying the equivalence schema exhausts the content of truth claims for specific propositions. The *concept* doesn't vanish; its *explanatory burden* is drastically reduced ("deflated").
      *   **Misrepresentation?** Slightly. It doesn't "deflate into" assertions so much as its *content* for a given proposition is given *by* that proposition via the schema.

  6.  **"But notice where this lands us: if truth is empty in this way, the deflationist cannot distinguish a well-confirmed scientific theory from a comforting myth except by talking about what people believe or what is useful to believe..."**
      *   **Fair?** **Profound Misrepresentation.** This is the core error.
          *   **Truth vs. Justification:** Deflationists sharply distinguish *truth* from *justification*, *warrant*, *evidence*, or *utility*. A deflationist absolutely *can* distinguish science from myth.
          *   **How?** By appealing to *justification* and *evidence*, not to a substantive property of truth. "The scientific theory is *better justified* by the evidence," "The scientific theory makes *more accurate predictions*," "The myth lacks empirical support." Deflationists fully endorse the objectivity of evidence and justification procedures. They argue we don't need a *substantive truth property* to do this work; the ordinary standards of evidence and reason suffice.
          *   **The Equivalence Schema Still Holds:** For the scientific theory, "Theory T is true" is equivalent to what T asserts about the world (e.g., electrons exist, spacetime is curved). For the myth, "Myth M is true" is equivalent to what M asserts (e.g., the world rests on a turtle). The deflationist says the *evidence* overwhelmingly supports T and refutes M. The *truth* of T consists *only* in the world being as T says it is (per the schema), which the evidence indicates is likely the case. Truth isn't "empty" of content; the content is given by the proposition itself. The deflationist denies that *truth itself* is the *criterion* for distinguishing theories; *justification* is.
      *   **Conflation?** Yes, this conflates the *concept* of truth with the *criteria* for *applying* it (justification/evidence).

  7.  **"...which was precisely the work the concept of truth was supposed to do."**
      *   **Fair?** **Misrepresentation.** Deflationists *deny* that the primary or essential "work" of the truth concept *is* to distinguish well-confirmed theories from myths. They argue its core work is *logical/expressive* (generalization). Distinguishing theories is the work of *epistemology* (justification, evidence, methodology), not the metaphysics of truth. They claim substantive theories of truth *mistakenly* try to load this epistemological work onto the truth property itself.

  8.  **"So the view slides into relativism..."**
      *   **Fair?** **False Inference.** This does **not** follow from deflationism.
          *   Deflationism is compatible with robust realism and objectivism. Horwich, Quine, and Ramsey were realists. The equivalence schema "<p> is true iff p" is *objectivist*: 'Snow is white' is true iff snow *is* white (in the world), regardless of what anyone believes or finds useful. If my culture believes snow is green, "<Snow is green> is true" is still equivalent to snow being green, which it isn't. Truth remains objective.
          *   Relativism arises from views about justification or meaning, not directly from a deflationary view of truth itself. Deflationism is largely neutral on these issues.

  9.  **"...and that is why mainstream philosophers gave it up decades ago."**
      *   **Fair?** **Factually Incorrect.**
          *   Deflationism, particularly Horwich's Minimalism (published 1990, 2nd ed. 1998), is **one of the dominant and most actively debated theories of truth in contemporary analytic philosophy.** It is absolutely *not* abandoned.
          *   While substantive theories (correspondence, coherence, pragmatic) are also vigorously defended, deflationism remains a major player. Significant debates center on whether minimalism *can* fully account for all truth-talk (e.g., generalizations about future contingents, normative domains) and its relationship to meaning, but it is far from discarded. Articles and books defending, refining, and criticizing deflationism are published constantly.

  **Conclusion & Verdict**

  *   **Relativism Charge:** Does **not** survive. It stems from conflating truth with justification and misunderstanding the objectivity inherent in the deflationary equivalence schema. Deflationism is compatible with, and often coupled with, objectivist realism.
  *   **Abandonment Claim:** Does **not** survive. Deflationism, especially in its minimalist form, is a central and active position in contemporary philosophy of language and metaphysics.

  **Points Worth Raising with Your Uncle (Tactfully!):**

  1.  **The Essential Utility of 'True':** "You're right that the redundancy idea is a starting point, but even Ramsey and Quine stressed we *can't* actually eliminate 'true' from the language. It's crucial for making generalizations like 'Everything the expert said is true' or 'All logical truths are true.' That's a key part of the deflationist case – explaining *why* we have this word if it's not naming a deep property."
  2.  **Truth vs. Justification:** "I think there's a really important distinction here that deflationists emphasize. They don't say *truth* distinguishes science from myth; they say *evidence and justification* do that. Saying a scientific theory is 'true' just means the world is the way the theory says it is (that's the equivalence schema). But figuring out *which* theories are likely true? That's the job of scientific method and evidence. Deflationism tries to separate the *meaning* of truth from the *process* of finding it out."
  3.  **No Slide to Relativism:** "Because 'Snow is white' is true iff snow *is* white, deflationism actually keeps truth firmly anchored to how the world is, not what we believe. If my belief is wrong, the truth doesn't change to match me. That's the opposite of relativism."
  4.  **Very Much Alive:** "Actually, deflationism, especially Paul Horwich's 'Minimalism' from the 90s, is still a huge topic in philosophy today! It's not something people gave up on; it's a major theory constantly being debated and refined. My thesis is engaging with very current arguments."

  **Overall:** Your uncle captured the core equivalence insight (point 3) and the anti-substantive property stance (point 2, albeit crudely). However, he fundamentally misunderstood the indispensability of the truth predicate, catastrophically conflated truth with justification, drew an invalid inference to relativism, and was factually wrong about the status of the theory. His critique highlights common popular misunderstandings but doesn't accurately reflect the actual deflationary position or its contemporary standing. Good luck with the thesis and the next dinner!
