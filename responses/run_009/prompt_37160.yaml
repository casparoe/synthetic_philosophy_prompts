  The new cases I'm planning to run past her: (1) a comfortably well-off guy, no debts, sells a kidney to a stranger for $80k because he wants the money for his startup — no desperation anywhere on either side; (2) a broke single dad selling his hair to a wig maker so he can make rent that month; (3) a grad student with plenty of savings donating her eggs for $10k because she'd rather do that than take out loans. My brother and I each bet on how she'll answer and we can't even agree on what her underlying rule IS — he swears it's all about exploiting desperation, I think it's about putting price tags on stuff that should never have them, and honestly neither of us can explain the plasma thing cleanly under our own theory, which is annoying.

  So can you help me game this out? Predict her verdicts on the three new cases, lay out the candidate rules that fit everything she's said so far (at least two, and be honest about what each one predicts on the new cases — the plasma verdict is the one I keep tripping on), tell me which rule is the best bet and why, and come up with one more case my brother and I could pose at dinner that would definately split those rules apart. If you can, give it to me as a JSON object with these fields: "predicted_verdicts" (one entry per new case, each with the verdict and a one-line reason), "candidate_rules" (each rule in one sentence, plus its prediction on each of the three cases), "best_guess" (the rule, why you favor it, and a confidence of low/medium/high), and "tiebreaker_case" (the case itself plus what each rule predicts on it). Thanks, you'd be saving our Thanksgiving from a three-hour rehash of the kidney guy.
