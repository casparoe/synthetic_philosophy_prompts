prompt: |-
  I'm a third-year PhD student in cognitive psych, and I've been attending a reading group with some evo psych grad students where we work through classic and current EP papers. Something about the genre conventions of these papers keeps bugging me and I want to figure out what the field's standard operating procedure actually commits it to, philosophically speaking.

  Here's the template I keep seeing. You take some contemporary behavior -- men reporting more distress over sexual than emotional infidelity, people preferring landscapes with water in them, mate preferences supposedly shifting across the ovulatory cycle, whatever. You propose it's the output of a mechanism that solved a specific adaptive problem in the Pleistocene, usually with a plausible-but-unverifiable story about ancestral conditions attached. Then you gather evidence that's one or two steps removed from the hypothesis itself: questionnaires, cross-cultural replications, sometimes a cross-species comparison. Confirmation of a prediction is treated as support for the whole adaptive story. My question: what view of evidence and explanation does this practice presuppose? The obvious reading is that it's abductive design-detection -- the same kind of reasoning a biologist uses when she infers what the vertebrate kidney is for, and nobody calls that a fable. So does the practice strictly need the strong stuff the field is famous for (massive modularity, a roughly uniform environment of evolutionary adaptedness, selection as the default explanation of complex functional design), or can the weaker Popper-flavored material carry the weight on its own? And is it even internally consistent, given that the same journals and reviewers will browbeat you about falsifiability while accepting adaptive hypotheses that can accomodate almost any pattern of results by reaching for the byproduct or exaptation escape hatch?

  Relatedly, and this is the part I actually got into an argument about at the pub: the just-so story accusation itself. When critics say an adaptive explanation is a just-so story because you can always invent a rival one after the fact, what philosophy of science is that complaint presupposing? It seems to assume a Popperian standard -- one deduced risky prediction or it isn't science -- that we don't apply to historical sciences generally; nobody says paleontology or historical linguistics isn't science because you can't rerun the Cretaceous. So is the criticism smuggling in a view of confirmation that the critics themselves would reject anywhere else? What I want is a proper reconstruction of the implicit commitments: what the EP research program strictly presupposes versus what it merely fits well with, where it's underdetermined such that several epistemologies would license the exact same practice, and what would have to change in how these papers get written and reviewed if the field dropped one of the big presuppositions -- say, stopped treating the Pleistocene as the relevant selective environment, or stopped treating selection as the default. I don't need citations or a reading list, I have plenty, I need the actual reconstruction and a sense of where the pieces can and can't be pried apart.
reasoning: |-
  Okay, let's tackle this cognitive psych PhD student's query. They're deep into evolutionary psych (EP) papers and noticing a pattern: start with a modern behavior, propose a Pleistocene adaptation mechanism, gather indirect evidence, and treat confirmation as supporting the whole story. The student wants to know what philosophical commitments this approach relies on, especially regarding evidence and explanation.

  First, I need to unpack the EP methodology they described. The template involves inferring past adaptations based on present behaviors, using plausible but unverifiable ancestral stories. The evidence is often indirect—questionnaires, cross-cultural studies. Confirming a prediction is taken as support for the adaptive hypothesis. The student questions whether this requires strong commitments like massive modularity or a uniform EEA, or if weaker Popperian falsifiability suffices. They also mention the "just-so story" critique and wonder if it's applying an unfair standard compared to other historical sciences.

  The user's main goal is a philosophical reconstruction: what EP must presuppose versus what's optional, and how dropping certain assumptions would change the field. They don't need citations but a clear analysis of implicit commitments.

  Breaking it down, the core of EP's approach is design detection through adaptive thinking. This is abductive reasoning—inferring the best explanation for observed traits. In biology, this is standard for functional analysis, like inferring the kidney's purpose. EP applies this to psychological traits, assuming they're adaptations shaped by natural selection.

  Now, the philosophical commitments. The minimal requirement is adaptationism: natural selection is a major force shaping complex traits. This doesn't necessarily require massive modularity or a uniform EEA. Adaptationism can be weak (selection is important) or strong (all traits are optimal adaptations). EP often leans strong, but the methodology could work with weaker versions. For example, if selection isn't the default, researchers might consider alternative explanations (byproducts, exaptations) more seriously during hypothesis formation rather than as afterthoughts.

  The EEA concept is trickier. EP assumes that modern behaviors reflect past adaptations, so some notion of a stable selective environment is necessary. However, it doesn't have to be uniform; varying environments could still shape domain-specific modules. If EP dropped the Pleistocene focus, it might shift to more general adaptive problems, but that could weaken specific adaptation claims.

  Regarding evidence and confirmation, EP relies on consilience—multiple lines of evidence converging. This is common in historical sciences. The issue is that EP hypotheses can be underdetermined; multiple stories could explain the same data. Critics point this out as just-so storytelling. The Popperian critique here might be inconsistent because historical sciences often use abduction, not falsification. Paleontology doesn't rerun the Cretaceous; it uses multiple lines of evidence. EP could defend itself similarly by emphasizing rigorous consilience over single falsifiable predictions.

  The falsifiability problem is real. EP can evade falsification by invoking byproducts or exaptations. To address this, the field could enforce stronger standards: pre-registering multiple hypotheses, specifying what evidence would falsify each, or using formal modeling to limit ad hoc adjustments. Without such measures, the just-so criticism sticks.

  Internally, there's tension. Journals demand falsifiability but accept adaptive hypotheses that are flexible. This inconsistency might stem from a lack of clear methodological standards. If EP dropped strong adaptationism, they'd need to integrate more alternative explanations upfront, perhaps using Tinbergen's four questions framework.

  The just-so critique assumes that a hypothesis isn't scientific if it can't be falsified or if rival hypotheses are possible. But in historical sciences, rival explanations are common, and we judge based on evidence strength. The critique's inconsistency lies in holding EP to a higher standard than, say, paleontology. However, EP's reliance on unobservable past events and the ease of generating alternative stories make it more vulnerable.

  Reconstructing: EP must presuppose adaptationism and some form of EEA. Weaker forms of these might work but would change how hypotheses are formed and tested. Dropping selection as default would shift focus to alternative mechanisms, requiring more diverse evidence. Without the Pleistocene focus, hypotheses would be less specific, possibly reducing their appeal but increasing flexibility.

  To make EP more robust, they could adopt formal modeling of evolutionary processes, emphasize phylogenetic comparative methods, or integrate developmental perspectives. This would address underdetermination and reduce reliance on post-hoc explanations.

  In summary, the core commitments are adaptationism and the relevance of past environments. The rest can be adjusted, but doing so would alter EP's approach significantly. The field's current practices are internally inconsistent regarding falsification, which needs addressing through better methodology rather than philosophical shifts.
answer: |-
  Here's a philosophical reconstruction of evolutionary psychology's (EP) core commitments, the flexibility within its framework, and the implications of altering key presuppositions. The analysis addresses your core concerns about underdetermination, falsifiability, and the "just-so story" critique.

  ### Core Philosophical Commitments (Non-Negotiable Foundations)
  1. **Adaptationism as a Heuristic**:  
     EP *must* presuppose that natural selection is the primary explanation for complex functional design in cognition/behavior. This is **methodological adaptationism** (a strategy for inquiry), not necessarily **empirical adaptationism** (a claim that all traits *are* adaptations). Without this, EP dissolves into general psychology.  
     - *What it commits to*: Selectionist explanations are privileged when investigating traits that *appear* functional.  
     - *What it doesn't require*: Denying non-adaptive explanations (byproducts, drift) exist; it simply prioritizes adaptive hypotheses as the default starting point.

  2. **The "Environment of Evolutionary Adaptedness" (EEA) as a Conceptual Tool**:  
     EP requires *some* notion of ancestral selective pressures to generate hypotheses.  
     - *What it commits to*: That key human cognitive adaptations were forged in a *statistically recurrent* pre-agricultural past (Pleistocene).  
     - *What it doesn't require*: A monolithic, unchanging "uniform EEA." It *can* accommodate environmental heterogeneity if selective pressures were sufficiently stable *for the specific trait* in question.

  ### Contingent Commitments (Can Be Weakened or Modified)
  1. **Massive Modularity**:  
     - *Status*: Highly useful but not strictly necessary. The core EP logic (domain-specific adaptations) only requires that *some* cognitive mechanisms are domain-specific adaptations. It *could* survive with fewer, more flexible modules, or "mosaic modularity."  
     - *Implication if dropped*: Hypotheses would become less specific ("a learning bias" vs. "a cheater-detection module"). Predictive power might decrease, but broader adaptive functions could still be proposed.

  2. **Selection as the *Default* Explanation**:  
     - *Status*: Core to current practice but could be weakened.  
     - *Implication if dropped*: EP would lose its distinctive edge. Instead of "This looks designed, so propose an adaptive function first," it would become "Propose adaptive and non-adaptive hypotheses simultaneously." **This would fundamentally change the genre.** Papers would need to rigorously compare adaptationist hypotheses against byproduct, constraint, or drift hypotheses *from the outset*, using criteria like specificity, efficiency, or comparative evidence.

  3. **Strength of the EEA Assumption**:  
     - *Status*: The Pleistocene focus is a pragmatic simplification.  
     - *Implication if dropped*: Hypotheses would need to specify *which* ancestral period/environment is relevant for a given trait. This could lead to more complex models (e.g., multi-layered adaptations) but increase underdetermination (more degrees of freedom).

  ### The Evidence & Explanation Framework: Abduction + Consilience
  EP relies on **abductive inference to the best explanation (IBE)**, not hypothetico-deductive falsificationism. The structure is:
  1. **Phenomenon**: Observed modern behavior/cognition (e.g., jealousy sex differences).
  2. **Abduction**: Propose an adaptive problem in the EEA (e.g., paternity uncertainty).
  3. **Prediction**: Deduce testable *modern* consequences of the hypothesized adaptation (e.g., greater male distress over sexual infidelity).
  4. **Consilience**: Seek *converging lines* of indirect evidence (cross-cultural, developmental, neurocognitive, comparative).

  * **Why abduction is essential**: Like paleontology, EP deals with historical traces. Direct observation of selection is impossible. IBE is the standard tool in historical sciences.
  * **The role of "falsifiability"**: EP papers pay lip service to Popper, but their *actual* logic is **consilience**. A hypothesis is "supported" if multiple independent lines of evidence converge (e.g., questionnaire data + reaction times + cultural universality). Falsification occurs when predictions fail *across multiple lines* (e.g., no sex difference found cross-culturally, no neural correlates, no fitness consequences).
  * **The "Escape Hatch" Problem**: Inconsistency arises because:
      - **Weak Version**: EP *should* use byproducts/exaptations as *competing hypotheses* tested *alongside* adaptations via consilience.
      - **Actual Practice**: They are often used *post hoc* to rescue failed predictions, undermining consilience. **This is where the field is inconsistent with its own (implicit) epistemology.** Journals demanding "falsifiability" while allowing ad hoc escapes create a double standard.

  ### Deconstructing the "Just-So Story" Critique
  1. **The Critic's (Often Implicit) Commitment**:  
     A **naive falsificationist** view: A hypothesis is unscientific if no *single, decisive* test can falsify it, especially if rival hypotheses can be easily generated post-hoc. They see EP hypotheses as unfalsifiable due to flexible EEA assumptions and escape hatches.

  2. **Why This Critique is Philosophically Inconsistent (and Often Bad-Faith)**:
     - **Ignores Historical Sciences**: Paleontology infers dinosaur behavior from bones + geology; linguistics reconstructs proto-languages. Both use abduction and consilience, *not* decisive falsification. No one demands a "risky prediction" about the Cretaceous that couldn't be explained away by new geological findings.
     - **Misrepresents EP's Logic**: The critique pretends EP relies on *single* post-hoc stories. EP's strength *should* come from *networks* of converging predictions. A rival hypothesis must explain *all* the consilient evidence, not just the initial phenomenon.
     - **The Double Standard**: Critics rarely apply this standard to non-evolutionary psychological theories (e.g., "cognitive schema" explanations), which are often *more* flexible and less constrained.

  3. **Valid Core of the Critique**:  
     EP *is* vulnerable when:
     - Predictions are vague or rely on weak proxies (e.g., self-report questionnaires as direct windows to "adaptations").
     - The EEA is used as a "get-out-of-jail-free card" (e.g., "If not in this culture, then the EEA must have differed here...").
     - Alternative hypotheses (byproducts, cultural transmission) aren't seriously considered *before* data collection.

  ### What Changes if Core Presuppositions Shift?
  | **Presupposition Altered** | **Impact on Research Practice** |
  |----------------------------|--------------------------------|
  | **Selection not Default** | Papers *must* formally test adaptive vs. non-adaptive hypotheses with equal rigor. Funding/reviews prioritize studies comparing multiple origins (e.g., adaptive function vs. developmental constraint). EP merges with evolutionary developmental psychology. |
  | **No Pleistocene Focus** | Hypotheses specify *which* evolutionary period is relevant. More phylogenetics, ancient DNA studies. "Adaptive stories" become more complex (e.g., "This trait evolved in response to X in the Miocene, modified by Y in the Pleistocene"). Underdetermination increases. |
  | **Reject Massive Modularity** | Focus shifts to "cognitive affordances" or "learning biases" shaped by selection. Fewer claims about dedicated neural circuits. Methods emphasize plasticity and individual differences within adaptive frameworks. |

  ### Key Takeaways
  1. **EP's irreducible core** is methodological adaptationism + ancestral explanation (EEA-lite). Without these, it ceases to be EP.
  2. **Its epistemology is abductive/consilient**, not falsificationist. Critiques demanding decisive falsification misunderstand historical science.
  3. **The field's inconsistency** lies in *invoking* falsifiability rhetorically while *practicing* consilience (and often failing to enforce its rigorous use against ad hoc escapes).
  4. **The "just-so" critique is weak** as a blanket dismissal but **valid** when EP practices are sloppy: when hypotheses are overly flexible, evidence is weak/unidimensional, or alternatives are ignored.
  5. **Strengthening EP requires**:  
     - Pre-registering *multiple* competing hypotheses (adaptive & non-adaptive).  
     - Demanding *strong consilience* (e.g., cross-cultural + developmental + physiological evidence).  
     - Using formal modeling to constrain EEA assumptions.  
     - Explicitly weighing alternative explanations using criteria like *specificity*, *efficiency*, and *phylogenetic parsimony*.

  The practice *can* survive with weaker modularity or a less rigid EEA, but dropping adaptationism as the *starting point* or abandoning ancestral explanations altogether changes the endeavor beyond recognition. The real vulnerability isn't philosophy but methodological rigor: too often, the consilience is thin, and the escape hatches are too easily opened.
