  ---

  #### 2. Scoring Key (Leaves)
  - **PC**: Psychological continuity (branching allowed). Survival = continued mental connections.
  - **PC_no_branch**: Psychological continuity (no branching). Survival requires no competing successors.
  - **Closest**: Closest continuer view. Survival = being the most psychologically similar successor.
  - **Body**: Bodily/organism view. Survival = same living physical body.
  - **Narrative**: Narrative identity. Survival = coherent life story incorporating past/future.
  - **No_self**: No-self/deflationary. "Survival" is a linguistic convention; no fact of the matter.

  ---

  #### 3. Separability Notes
  - **PC vs. Closest**  
    *Not separable in non-branching cases*. Both agree when only one continuer exists. *Separating case*: A scenario with one close continuer and one distant continuer (PC accepts both; Closest picks the closer).
    
  - **Narrative vs. PC (minus memory)**  
    *Not fully separable*. Both may value dispositions over memory. *Separating case*: A radical personality shift with a *narratively justified* break (Narrative may accept; PC rejects without psychological links).

  ---

  #### 4. Unoccupied Logical Space
  - **Hybrid Body + Psychological views** (e.g., "I need my brain *and* memories").  
    *Why*: Rarely defended; body/memory questions pull apart (e.g., in `amnesia`, body says "yes" but PC says "no").
    
  - **Narrative + No-Branching**  
    *Why*: Narrative views naturally accommodate multiple stories; no-branching is a psychological constraint.

  ---

  #### 5. Tie-Handling Rule
  If tie: Show tied positions + this follow-up:  
  ```json
  {
    "id": "tie_body_narrative",
    "scenario": "Your brain is transplanted to a new body; the old body is destroyed. The brain recipient has your memories and personality. Are you them?",
    "options": [
      {
        "label": "Yes, my brain defines me.",
        "vector": {"body": 1, "narrative": 0}
      },
      {
        "label": "Yes, my life story continues.",
        "vector": {"narrative": 1, "body": 0}
      }
    ]
  }
  ```

  ---

  #### 6. Question to Cut for 6-Question Quiz
  **Cut `closest_cont` (Closest Continuer Scenario)**  
  *Why*:  
  - Least diagnostic weight: Fission (`fission`) already distinguishes branching views.  
  - Closest continuer scores correlate highly with PC_no_branch in key cases (e.g., `fission`).  
  - Lower real-world intuition for "degree of similarity" vs. binary branching/body cases.

  ---

  ### Final Notes
  - **Philosophical Jargon**: Absent from questions; definitions appear only in results.  
  - **Scoring**: Sum vectors for each position; highest score "wins." Ties trigger follow-up.  
  - **Design Insight**: Prioritizes concrete intuition over self-reported labels (e.g., a "no-self" adherent may still reject teletransporters pragmatically).  
  - **Test Coverage**: All required scenarios included, with prudential (`dread`) and retrospective (`guilt`) concerns.
