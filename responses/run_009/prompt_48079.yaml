prompt: |-
  Over the past few months I've been trying to write up, for a political-theory seminar, a working account of what "left" and "right" actually denote — prompted by a friend who insists the terms are empty because the two sides have swapped positions on free trade within living memory. I disagree with him, but when I tried to state my own view precisely, I noticed I was holding a number of things at once, and I can't tell whether they fit together. Here is the package. First, the left-right distinction is real rather than merely nominal: it carves political life at a genuine joint, and the fact that we inherited the labels from the seating arrangement in the French National Assembly is an accident of naming, not evidence that the axis itself is a convention. Second — and this is what supposedly makes the axis deep — the distinction is at bottom about hierarchy: the right is the standpoint from which existing inequalities and hierarchies are seen as natural or at least defensible, while the left is the standpoint from which they are seen as artificial and to be flattened. Third, the axis is fundamentally economic; cultural issues acquire their left-right alignment only contingently, through the coalitions built over the twentieth century, so in principle that alignment can come apart, and one should not infer someone's position on the axis from their stances on immigration, religion, or crime. Fourth, I hold two verdicts on concrete cases that I feel confident about: a present-day voter who wants a generous welfare state and steeply progressive taxation, but also strict immigration control and active state promotion of the national culture, is in her bones right-wing; and a libertarian who wants open borders, free markets, and a minimal state is right-wing, even though the open-borders component looks like it points the other way. Fifth, the distinction is a single axis: any two political positions are comparable as more-left or more-right, so talk of "left-libertarians" versus "right-libertarians" is really just a way of saying that one of them is further left.

  What I'd like from you is an audit of this package rather than a lecture on the history of the terms. Go through the five commitments, tell me which ones are genuinely in tension and which tensions only look real, and rank the genuine ones by severity instead of treating them all as equally bad. For each genuine tension, say precisely which commitment would have to give and what giving it up would cost me elsewhere. If the case verdicts in the fourth commitment are what does the damage, I want that said plainly; but don't protect them by fiat either — if my theory can't deliver them, it may be the theory that has to go, and I'd like to know which single revision would clean up the most.
reasoning: |-
  Okay, let me approach this user's query methodically. The user presents a sophisticated political theory framework with five interlocking commitments about the left-right distinction and requests a rigorous audit of internal tensions. They're clearly an academic (political theory seminar context) struggling to reconcile intuitive convictions with systematic coherence.

  Hmm, the core challenge seems to be balancing their foundational hierarchy-based definition (Commitment 2) with the economic primacy claim (Commitment 3) and concrete case judgments (Commitment 4). The voter example is particularly thorny - how can welfare progressivism be "in her bones right-wing" if economics is primary? 

  Let me map the fault lines: First, Commitment 2 (hierarchy) and Commitment 3 (economic primacy) clash directly. If hierarchy is truly fundamental, cultural positions shouldn't be contingent appendages. Yet the user insists cultural issues only gained left/right alignment through 20th century coalition-building. But doesn't that historical contingency undermine the "deep axis" claim?

  Ah, the libertarian case reveals another crack. The user concedes open borders "looks left" but still labels the whole package right-wing. That only works if economic stance overrides all else - but then why posit hierarchy as fundamental? Unless... perhaps they're implicitly privileging economic hierarchy as more "real"?

  The single-axis commitment (5) compounds these issues. When they dismiss "left-libertarians" as merely "less right," they're flattening multidimensional differences. Real-world examples like Chomsky (anti-state but anti-capitalist) would rupture this schema.

  For the audit, I should:
  1) Highlight Commitment 2-3 as the critical tension: Keeping hierarchy fundamental requires abandoning economic primacy. The cost? Their voter example becomes left-wing unless...
  2) Propose revising Commitment 4: If hierarchy is key, the welfare nationalist voter could be right-wing based on cultural hierarchy defense, but that forces economics off-center stage.
  3) Flag Commitment 5 as unsustainable: Many political theorists (Rokeach, Eysenck) show orthogonal axes exist. Sacrificing this allows their other commitments to breathe.

  The user seems attached to their case judgments, but protecting them might require demoting economics from "fundamental" to "dominant in modern politics." That's a defensible retreat. Alternatively, they could double down on hierarchy but accept multi-dimensional scoring - though that breaks Commitment 5.

  Most salvageable path? Revise Commitment 3: Make hierarchy the core with economic/cultural expressions context-dependent. Then the welfare nationalist is clearly right-wing via cultural hierarchy defense, and the libertarian is right-wing via economic hierarchy acceptance. Open borders becomes an exception proving the rule - it challenges national hierarchy but reinforces market hierarchy. This keeps Commitments 1,2,4 intact while only softening 3 and abandoning 5.

  Biggest casualty would be the elegant single-axis model, but the payoff is coherence: hierarchy remains the "genuine joint" in political life, accidental naming claims stay viable, and case judgments hold. The user might miss parsimony, but gain explanatory power for real-world complexities like socialist patriots or neoliberal multiculturalists.
answer: |-
  Here's an audit of your five commitments, ranking tensions by severity and identifying necessary revisions:

  **Critical Tension (Severity: High)**  
  *Commitments Clashing:* **#2 (Hierarchy as Fundamental)** vs. **#3 (Economic Primacy)**  
  - **Conflict:** If hierarchy is *truly* fundamental (#2), cultural positions cannot be "contingent" (#3). Hierarchical views on race/gender/culture are *intrinsically* right-wing (e.g., defending patriarchy or racial caste), not accidentally aligned via coalitions. Your welfare-nationalist voter defends cultural hierarchy – making her right-wing by #2 – but #3 implies economics alone defines the axis.  
  - **Resolution Needed:** Abandon **#3 (Economic Primacy)**.  
  - **Cost:** You lose the claim that economics is *uniquely* fundamental. Cultural hierarchy becomes core to the axis, not derivative. This strengthens #2 but forces you to accept that issues like immigration *can* directly signal left/right alignment based on hierarchical worldview.  

  **Significant Tension (Severity: Medium)**  
  *Commitments Clashing:* **#2 (Hierarchy as Fundamental)** vs. **#4 (Case Verdict: Libertarian = Right-Wing)**  
  - **Conflict:** The libertarian rejects *state-enforced* hierarchy but embraces *market-generated* hierarchy (wealth inequality, power imbalances). #2 suggests this is still a defense of hierarchy (naturalizing market outcomes), supporting your verdict. *However*, their radical rejection of traditional social/state hierarchies (e.g., opposing state religion, criminalization of vice, nationalism) creates friction. Calling them "right-wing" relies heavily on prioritizing economic hierarchy as definitive.  
  - **Resolution:** Maintain #4 verdict *only if* you explicitly **subordinate non-economic hierarchy to economic hierarchy** within #2.  
  - **Cost:** Weakens the universality of #2. It implies economic hierarchy is the "master hierarchy," making your theory more economically reductionist. Hardcore anti-capitalist libertarians (e.g., left-wing market anarchists) become incoherent under your model.  

  **Structural Tension (Severity: Medium)**  
  *Commitments Clashing:* **#1 (Real Distinction)** / **#2 (Hierarchy)** vs. **#5 (Single Axis)**  
  - **Conflict:** Real political actors combine positions that resist easy placement on *one* hierarchy axis. Your welfare-nationalist is economically egalitarian/hierarchically restrictive; the libertarian is economically hierarchical/anti-state-authority. Forcing these onto *one* axis (#5) requires prioritizing one hierarchy over others (e.g., economic > cultural), which is arbitrary and contradicts #1's claim to carve at a "genuine joint" if that joint is multi-dimensional.  
  - **Resolution Needed:** Abandon **#5 (Single Axis)**.  
  - **Cost:** You lose parsimony and confront the messy reality of multi-dimensional political space. "Left-libertarian" vs. "right-libertarian" becomes a valid distinction (e.g., on cultural hierarchy or anti-capitalism).  

  **Apparent Tension (Resolvable)**  
  *Commitments:* **#4 (Case Verdict: Welfare-Nationalist = Right-Wing)** vs. **#3 (Economic Primacy)**  
  - **Apparent Conflict:** #3 says economics is fundamental, yet you call an economically left-wing (welfare, taxes) voter right-wing based on culture.  
  - **Resolution:** This tension *vanishes* if you **revise #3** as proposed above. Once cultural hierarchy is recognized as intrinsic to the axis (#2), labeling this voter right-wing is consistent *because of her defense of cultural/national hierarchy*, overriding her economic egalitarianism. Her stance isn't "economically left-wing" *in spirit* if the core is opposing hierarchy; she seeks to flatten economic hierarchy *only within* a culturally/nationally bounded in-group she defends as superior.  

  **Recommendation for Minimal Revision with Maximum Coherence:**  
  1.  **Abandon #3 (Economic Primacy):** This is the main source of crippling tension with your core #2. Accept that both economic *and* cultural/social hierarchy are fundamental to the left/right distinction.  
  2.  **Abandon #5 (Single Axis):** This is unsustainable empirically and theoretically once #3 is gone. Different hierarchies (economic, racial, gender, national, epistemic) can align or cross-cut.  
  3.  **Slightly Refine #2:** Explicitly encompass *multiple forms of hierarchy* (economic, social, cultural, political). The right defends some/all as natural/necessary; the left seeks to dismantle them as artificial/oppressive.  
  4.  **#4 Verdicts Become Robust:**  
      *   The welfare-nationalist is clearly **right-wing**: She defends national/cultural hierarchy (strict immigration, state promotion of national culture) even while mitigating economic hierarchy *within* that bounded group.  
      *   The (typical) libertarian is **right-wing**: They defend market hierarchy as natural/just, even while opposing state/religious hierarchy. Open borders aligns *contingently* with left anti-nationalism, but libertarian motivation (free movement of labor as a market good) is distinct.  
  5.  **#1 (Real Distinction) is Strengthened:** Grounding the axis in the fundamental attitude toward *hierarchy in general* makes it more durable across issues and time, explaining consistency despite policy shifts (like trade).  

  **What You Keep & What You Lose:**  
  *   **Keep:** The core insight that hierarchy is fundamental (#2 revised), your intuitive case judgments (#4), and the reality of the distinction (#1).  
  *   **Lose:** The clean simplicity of economic primacy (#3) and the single-axis model (#5).  
  *   **Cost:** Your theory becomes more complex (multi-dimensional hierarchies) and less parsimonious. However, it gains significant explanatory power, consistency, and resilience against the "swapped positions" critique. The "genuine joint" is the stance toward hierarchy itself, manifesting in different domains contextually.  

  **Conclusion:** Your package is insightful but internally stressed. **Commitment #3 (Economic Primacy) is the primary culprit.** Abandoning it, along with #5 (Single Axis), resolves the severe tensions, preserves your core hierarchy insight (#2) and case verdicts (#4), and strengthens the reality of the distinction (#1). The cost is accepting a more complex, multi-dimensional foundation for left/right.
