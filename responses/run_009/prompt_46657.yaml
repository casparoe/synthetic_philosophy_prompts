prompt: |-
  My mother moved into hospice care two months ago and I am her medical proxy, and a series of decisions I had assumed were the doctors' to make have landed on me. I've come away with a set of verdicts I can't reconcile, and I'd like to know whether there's a principle beneath them or whether I'm simply inconsistent.

  The verdicts, as I find I hold them: honoring her instruction not to start antibiotics when she developed pneumonia felt acceptable — like declining to intervene rather than like letting her die. Taking her off the ventilator she had been on for ten days, per her advance directive, also felt acceptable, but like a different kind of thing: something we did, not something we declined to do. The hospice nurse raising her morphine to a dose that would foreseeably shorten her life felt acceptable too, yet closer to the second than the first, and I can't say why. And when a doctor suggested that instead of withdrawing the ventilator we could wean her from it over several days of diminishing capacity, I found the weaning proposal squeamish in a way I can't justify — the abrupt withdrawal seemed more honest.

  My verdicts outside the hospital run along similar and possibly incompatible lines. Walking past a child drowning in a shallow pond would be monstrous. Declining to give a month's income to save a distant child through a charity is not wrong, though I decline. A friend who, caring for his old dog, forgoes a medication that would prolong its life by a few painful weeks seems blameless; a vet who lethally injects that same dog at my friend's request also seems acceptable to me, but not quite in the same way, and I can't locate the difference.

  The pair I keep snagging on: I treat the morphine increase as something the nurse did, while treating the ventilator withdrawal as a mere act of hers that we undid — and I can't see what distinguishes the morphine increase, given at her implied request, from the vet's injection, given at the owner's, except who is holding the syringe and in what institution. Is there a principle here — some version of the doing/allowing distinction, perhaps combined with a role-based duty of care that the proxy and the nurse acquire and the stranger at the pond lacks — that fits all of these verdicts? If so, state it precisely, tell me which of my verdicts it would have to overturn, and say what it implies for a case I haven't raised: had her doctors proposed terminal sedation without food or water, rather than morphine titration, would my answer have to change?
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They're the medical proxy for their mother in hospice and they're struggling with the ethical distinctions between different decisions they've had to make. They've listed several scenarios: withholding antibiotics for pneumonia, withdrawing the ventilator, increasing morphine, and even some analogies like the drowning child and the dog. 

  First, I need to unpack their core confusion. They feel that some actions are merely "declining to intervene" (like not starting antibiotics) while others are active interventions (like withdrawing the ventilator). The morphine increase sits somewhere in between for them. They're also questioning why weaning the ventilator felt worse than abrupt withdrawal. Then there are the external examples which seem to parallel these dilemmas.

  Hmm, the key here is the distinction between acts and omissions, but that's not enough because they sense a difference even between active interventions. For example, withdrawing the ventilator versus increasing morphine. Both are active, yet they feel differently about them. The user is hinting at the doctrine of double effect and perhaps the role-based duties. 

  Looking at the morphine case: increasing dosage to manage pain while foreseeing life-shortening is acceptable under double effect because the intent is pain relief, not causing death. But terminal sedation without hydration is trickier because withdrawing sustenance might be seen as directly causing death. The user is worried about consistency here. 

  Also, the ventilator weaning versus abrupt withdrawal. The user feels abrupt is more honest. Why? Maybe because weaning prolongs the dying process, making it seem like avoiding responsibility. Abrupt withdrawal aligns more directly with the patient's directive to not prolong life artificially. 

  The analogies: the drowning child is a clear duty to rescue, but donating to a distant child isn't mandated. The dog's case shows allowing natural death versus active euthanasia. The user accepts both but senses a difference. Here, role matters—the vet has a professional duty, but the owner's decision to withhold treatment is passive. 

  So the principles at play: double effect, role-based obligations, and the distinction between allowing death versus causing it. But they need a unified principle. The best fit seems to be combining the duty of care with double effect. Medical professionals can act within their role to relieve suffering, even if death is a foreseen side effect, but not intend death. 

  Terminal sedation without hydration would cross into intending death by dehydration, so it might not be acceptable under double effect. That's a key point the user needs to consider. 

  I need to check if this framework fits all their judgments. Withholding antibiotics is an omission under the advance directive, so it's allowing death. Ventilator withdrawal is stopping an intervention, also allowing death. Morphine increase is acting but with double effect. Weaning feels wrong because it delays the inevitable, contrary to the patient's wishes. The dog's medication omission is allowing death; euthanasia is active but done by a vet under professional guidelines. 

  The user's discomfort with weaning might be because it prolongs the dying process, which isn't aligned with the goal of comfort care. Abrupt withdrawal respects the directive more directly. 

  So the unified principle would be: As medical proxy, you have a role-based duty to honor the patient's directives and prioritize comfort, using acts that may foreseeably hasten death only if the primary intent is symptom relief, and avoiding procedures that prolong dying against the patient's wishes. 

  This principle supports most of their verdicts but might require accepting terminal sedation only if hydration is maintained, otherwise it could be seen as intending death. That's the nuance they need.
answer: |-
  Your ethical intuitions reveal a coherent structure grounded in three principles: **role-based duties of care**, the **doctrine of double effect (DDE)**, and a distinction between **allowing death** versus **intending death**. Your verdicts largely align with these—but one requires refinement.

  ### The Core Principles
  1. **Role-Based Duty of Care**:  
     As medical proxy/nurse/vet, you acquire obligations to act in the patient's best interests *that strangers lack*. A passerby *must* rescue a drowning child (minimal effort, direct harm averted). No one *must* donate to distant charities (no role-based duty, disproportionate burden). Similarly:
     - Withholding antibiotics: Honoring a directive is fulfilling your *duty as proxy*.
     - Ventilator withdrawal: Same duty—*ceasing an unwanted intervention* isn't "killing" but respecting autonomy.
     - Morphine increase: The nurse’s *duty to relieve suffering* justifies foreseeably life-shortening acts under DDE.

  2. **Doctrine of Double Effect (DDE)**:  
     An act causing foreseeable harm (e.g., hastening death) is permissible if:  
     - (a) The *intent* is solely to achieve a good effect (e.g., pain relief).  
     - (b) The harm is not the *means* to the good effect.  
     - (c) The good outweighs the harm.  
     *This distinguishes the morphine increase (good intent: comfort; bad effect: hastened death) from lethal injection (good intent: comfort; means: death itself).*

  3. **Allowing vs. Intending Death**:  
     - **Allowing**: Withholding/withdrawing treatment (antibiotics, ventilator) *permits the underlying illness to cause death*.  
     - **Intending**: Acts where death is the *instrument* of relief (e.g., lethal injection) cross a line.  
     *Morphine sits in between: death is foreseen but not used as the tool for relief.*

  ---

  ### Applying Principles to Your Cases
  | **Scenario**               | **Your Verdict**       | **Principle Applied**                                                                 | **Consistency Check**                                     |
  |----------------------------|------------------------|---------------------------------------------------------------------------------------|-----------------------------------------------------------|
  | **Withhold antibiotics**   | Acceptable (allowing)  | Role-based duty to honor directive; *allowing* death from disease                    | **Fits**: No intent to cause death; duty fulfilled.       |
  | **Ventilator withdrawal**  | Acceptable (doing)     | Duty to cease unwanted intervention; *allowing* death                                | **Fits**: Active *cessation*, not active *killing*.       |
  | **Morphine increase**      | Acceptable (DDE)       | Nurse’s duty + DDE: intent is comfort, death foreseen but unintended                  | **Fits**: Distinguishable from lethal injection by intent.|
  | **Ventilator weaning**     | Unacceptable           | Weaning *prolongs the dying process* against directive; violates duty to avoid futile suffering | **Fits**: Abrupt withdrawal aligns with duty to honor wishes directly. |
  | **Lethal injection (dog)** | Acceptable but distinct| Vet acts per owner’s request, but *death is the means* to end suffering              | **Inconsistent?** *Requires refinement below.*            |

  ### Resolving the Snag: Morphine vs. Lethal Injection
  - **Morphine**: Nurse’s act is *treatment* (pain relief) with a *foreseen side effect* (respiratory depression). Death is unintended, even if inevitable.  
  - **Lethal Injection**: Vet’s act is *administration of death* as the direct solution. Death is the *intended mechanism* for ending suffering.  
  **The difference is intent under DDE**: The injection fails condition (b)—death *is* the means to relief. Morphine does not.  

  *Why roles matter*: The nurse’s duty is *palliation*, not causing death. The vet’s role (where euthanasia is legal) *includes* causing death as a last resort. This explains your unease: the *proxy’s request* for euthanasia feels distinct from a *clinical decision* to titrate morphine.

  ---

  ### Terminal Sedation Case: Your Answer *Would* Change
  - **Terminal sedation + withholding food/water**:  
    - If sedation is titrated *only* to relieve refractory symptoms (e.g., agony, delirium), and death results from the underlying disease, DDE *may* apply.  
    - **But** if sedation is deepened *specifically to enable starvation/dehydration*, death becomes intended as the means to end suffering—violating DDE.  
    - **Key question**: Is the primary intent to make the patient *unconscious so they starve*, or to relieve *unbearable symptoms*? The former is ethically suspect.

  **Your verdict** would likely depend on intent:  
  - If sedation targets symptoms (e.g., intractable pain) and withholding food/water follows naturally from imminent death/dysphagia, it aligns with DDE.  
  - If sedation is a vehicle to hasten death via dehydration, it parallels lethal injection and conflicts with your other verdicts.

  ---

  ### One Verdict to Overturn: The Dog’s Lethal Injection
  Your acceptance of the dog’s injection is inconsistent with your rejection of *intending death as a means* in human cases. To align:  
  - **Revised verdict**: The vet’s injection is *less justifiable* than withholding medication, as it intends death directly.  
  - **Why?** Your other judgments prioritize *allowing death* or *foreseeing it* over *causing it*. The injection is causally identical to euthanasia in humans—which you implicitly reject by distinguishing it from morphine.

  ---

  ### The Unified Principle
  > **As a proxy or clinician, you may (a) withhold/withdraw interventions against the patient’s wishes, allowing death; or (b) perform acts *intended to relieve suffering* that *foreseeably* hasten death, provided death is not the *instrument* of relief. Intent, role-based duties, and the distinction between *ceasing harm* versus *inflicting harm* govern permissibility.**

  This preserves all your verdicts *except* accepting the dog’s lethal injection, which must be re-evaluated as ethically distinct from morphine titration. In terminal sedation, your answer changes if the *design* of the act intends death by dehydration rather than symptom relief.
