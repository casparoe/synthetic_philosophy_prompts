prompt: |-
  I'm writing a position paper for a policy institute on what immigration policy a just state should have — not a survey of the literature but my own considered view, which I've boiled down to six commitments. Before I circulate it, I want to know whether the package hangs together. Here it is:

  1. Freedom to cross borders to live and work is a basic human right. Restrictions on it are presumptively wrong in roughly the way censorship is presumptively wrong: they stand in need of a very strong justification, and the ordinary run of economic and cultural reasons does not come close to providing one.

  2. Even so, a democratic people retains legitimate collective authority over the terms on which its political community grows, including the setting of numerical caps on admission. I ground this in something like collective ownership: citizens and their forebears built the territory's infrastructure and institutions, and they are entitled to decide the pace at which others join.

  3. Caps may not be set for cultural-preservation reasons. "We want the country to remain recognizably ours" is not an admissible justification for limiting entry, and neither is anxiety about changes to the national character.

  4. As a condition of entry, states may require a binding waiver of access to means-tested welfare benefits for the first ten years of residence, provided immigrants have full labor-market access and full tax obligations from day one. My rationale is that the welfare state is best understood as a scheme of reciprocity among contributors rather than an entitlement that attaches to mere residence.

  5. After five years of residence, naturalization should be essentially automatic. Any citizenship test may probe only operational competence — enough language to take part in civic life — not values, history, or loyalty.

  6. Case: suppose a small island democracy of 300,000 admits freely under conditions 4 and 5; within a decade, new arrivals are two-fifths of the population; and the new majority votes to abolish the probation waiver and open the borders entirely. I think that outcome is fully legitimate, and that the old majority has no standing to complain that their community was transformed out from under them.

  What I want from you is an audit, not a lecture: which of these six commitments are actually in tension, which only appear to be, and what the least costly revision would be. Please rank the tensions by severity rather than presenting them as equally bad; for each genuine one, say what would have to give and what that concession would cost elsewhere in the set; and for each merely apparent one, show how it dissolves on inspection rather than just declaring it harmless. Don't assume I have a private preference about which commitment to drop, because I don't think I do — I may just be failing to see where the pressure is. I'm especially interested in whether any tension between (2) and (6) can be defused by distinguishing the old majority's interest in the pace of their community's growth from their interest in remaining the same electorate — but do not treat that as a hint that I believe it can be.

  End your reply with a single final line of the form "Verdict: <short phrase>" naming the one revision that would clean up the most.
reasoning: |-
  Hmm, the user wants me to audit their six commitments on immigration policy for internal tensions. They've developed a position paper for a policy institute and need to ensure their arguments cohere logically before circulating it. This isn't about literature review but their own synthesized view.

  Looking at their six points: They start with strong free movement as a human right (1), then introduce democratic control over admission caps (2), while banning cultural-preservation justifications (3). They propose welfare waivers for immigrants (4), automatic naturalization (5), and validate demographic transformation through democratic processes (6). 

  The most obvious tension appears between democratic control in (2) and the transformation scenario in (6). In (2), citizens claim authority over growth pace due to collective ownership of institutions, but (6) permits new majorities to dismantle those very controls. This isn't superficial - it questions whether the "collective ownership" principle has enduring weight or evaporates at majority whim. 

  A secondary tension exists between the welfare waiver in (4) and automatic naturalization in (5). Requiring 10 years of welfare exclusion while granting citizenship after 5 creates a 5-year gap where citizen immigrants pay taxes but can't access safety nets - a reciprocity paradox. 

  Point (3) banning cultural arguments seems stable but reveals subtle friction with (6): if cultural anxiety is illegitimate pre-entry, why is post-entry cultural transformation acceptable? The distinction lies in agency - the state can't exclude based on identity, but individuals can vote for change. 

  For revisions: The (2)-(6) tension demands clarification. Distinguishing "pace control" from "electorate control" helps - citizens can regulate inflow speed but not future voters' decisions. This costs some rhetorical force in (2) but preserves coherence. The welfare gap in (4)-(5) could be resolved by shortening the waiver to match naturalization timelines. 

  Final verdict targets the most severe tension: refining (2) to specify that democratic authority applies only to admission pace, not future policy choices by new majorities. This maintains logical integrity while upholding their core principles.
answer: |-
  Here's an audit of your six commitments, ranking tensions by severity (High > Medium > Low), analyzing genuine/apparent conflicts, and identifying minimally costly revisions:

  ### High Severity Tensions
  1. **Tension: (2) vs. (6) - Democratic Control vs. Democratic Transformation**  
     - **Conflict**: (2) grounds citizens' authority over admission caps in their collective ownership of institutions/territory built over time. But (6) permits a new majority (composed largely of recent arrivals) to abolish those caps entirely, effectively nullifying the original community's control. The "collective ownership" claim in (2) implies a *persistent* stake, yet (6) allows that stake to be extinguished via demographic change enabled by the original policy.  
     - **Least Costly Revision**: Clarify that (2) grants authority over the *initial pace* of community growth, not permanent veto power over future policy changes by new democratic majorities. Specify that "collective ownership" confers control over *admission rules*, not immunity from subsequent democratic decisions.  
     - **Cost**: Weakens the "perpetual stewardship" reading of (2), making it more procedural ("we set the rules now") than ontological ("this is ours forever").  
     - **Defusing (2)/(6)**: Your instinct is correct—distinguish the *pace-setting interest* (legitimate under (2)) from the *interest in permanent electoral dominance* (illegitimate under (6)). The tension dissolves if (2) protects only the former: citizens control *how quickly* newcomers join, but not *whether* those newcomers may later vote to change policy.  

  2. **Tension: (4) vs. (5) - Welfare Waiver vs. Citizenship**  
     - **Conflict**: (5) grants automatic citizenship after 5 years, but (4) denies welfare access for 10 years. This creates a 5-year period where *citizens* (who pay taxes and have full political rights) are barred from safety-net benefits. This violates the reciprocity principle in (4), as citizens are contributors excluded from the scheme.  
     - **Least Costly Revision**: Align the timelines—either shorten the waiver to 5 years or extend naturalization eligibility to 10 years (the latter contradicts (5)’s automaticity).  
     - **Cost**: A 5-year waiver weakens fiscal safeguards; a 10-year naturalization delay risks creating a disenfranchised underclass.  

  ---

  ### Medium Severity Tension
  3. **Tension: (1) vs. (2) - Presumptive Right vs. Caps**  
     - **Apparent Conflict**: (1) calls border freedom a "basic human right" presumptively wrong to restrict, while (2) endorses numerical caps.  
     - **Dissolution**: Your "presumptively wrong" framing in (1) and "strong justification" threshold in (2) are consistent. (2) *is* your strong justification: collective ownership and democratic self-governance override the presumption. No revision needed if you explicitly frame (2) as meeting (1)’s high bar.  

  ---

  ### Low Severity Tensions
  4. **Tension: (3) vs. (6) - Cultural Exclusion vs. Cultural Transformation**  
     - **Apparent Conflict**: (3) bans caps for cultural preservation, yet (6) accepts a community’s cultural transformation.  
     - **Dissolution**: (3) prohibits the *state* from restricting entry to preserve culture; (6) permits *individuals* (including newcomers) to democratically change institutions. The principle is anti-exclusion, not cultural stasis.  

  5. **Tension: (2) vs. (4) - Collective Ownership vs. Welfare Exclusion**  
     - **Apparent Conflict**: If citizens "own" institutions (2), why can’t they exclude immigrants from welfare (4)?  
     - **Dissolution**: (4) is a reciprocity condition, not an exclusionary right. It aligns with (2) by treating welfare as a *membership benefit* for contributors, not a territorial entitlement.  

  ---

  ### Summary of Revisions & Costs
  - **Highest Priority**: Revise **(2)** to clarify that democratic authority applies only to *setting initial admission rules/pace*, not binding future majorities. *Cost:* Weakens the "permanent ownership" narrative.  
  - **Secondary Fix**: Align **(4) and (5)** timelines (e.g., 5-year waiver + citizenship). *Cost:* Reduces fiscal protection or delays political inclusion.  

  **Verdict: Clarify democratic authority in (2) as pace-setting only**
