  The user wants a principle that explains all these reactions. Their brother takes a Kantian view: only false assertions are immoral; technically true statements are just conversation, maybe rude but not as bad. The user suspects there's more to it, especially when trust and reliance are involved. They mention the case with their partner asking about Dana, using "you know you're the one I love" as a technically true dodge, and wonder if that's acceptable under a consistent principle.

  First, I need to identify a unifying principle. The user's reactions seem tied to the speaker's intent to deceive and the listener's reasonable expectations. In the murderer case, deception is necessary for safety, so it's justified. The con artist exploits trust, making it worse. The roommate scenario involves a direct question, and dodging breaches trust similarly to lying. The recommendation letter depends on industry norms—if readers expect subtext, the misleading truth might be acceptable. The tooth fairy is a harmless tradition, so no guilt. Comforting grandma with a misleading truth feels slimy because it's intentionally deceptive while maintaining plausible deniability.

  The principle could be: misleading truths are morally problematic when they exploit reasonable trust to intentionally create false beliefs. This accounts for context, intent, and relational duties. Applying this to the partner scenario: answering "you're the one I love" avoids the direct question, exploiting trust. If there's something with Dana, this is deceptive and wrong. If not, it might be okay but still evasive. The dying relative case: a technically true statement like "doctors haven't said anything final" could provide false hope. If the intent is to comfort without lying, it might be acceptable depending on the situation, but if it's deceptive, it's problematic. A direct lie might sometimes be kinder but still involves deception. The user's discomfort with misleading truths here might stem from the cowardice of not being honest while hiding behind technical truth.

  The key factors are the speaker's intent to deceive, the listener's reasonable reliance, and the context. All cases fit under this principle, explaining why some scenarios feel worse than others based on trust exploitation and deceptive intent.
answer: |-
  Your moral reactions align most consistently with **the principle of relational duties: intentionally exploiting reasonable interpretive reliance to induce false beliefs violates honesty, regardless of propositional truth.** This isn't about sentences but about *using trust to weaponize context*. Below is the breakdown against your cases, then new verdicts.

  ### How Your Cases Fit This Principle
  1.  **Murderer at the door:** No reasonable reliance exists. You owe no duty of candor; exploiting his misinterpretation (by telling truth) is defensive, not dishonest. Hence, no guilt.
  2.  **Con man & grandma:** Grandma reasonably relies on your shared context/language norms. Exploiting that trust to implant a *specific* false belief (fake charity) violates your relational duty, making it worse than many lies (which at least don't hide behind technicalities).
  3.  **Roommate's leftovers:** Direct question creates strong interpretive reliance. Dodging with a technically true but contextually misleading statement exploits that trust to evade accountability. Feels nearly as bad as lying because the *deceptive intent and exploitation of trust* are identical.
  4.  **Recommendation letter:**
      -   *Reader trusts you:* They reasonably rely on you to volunteer relevant truths. Omitting key negatives while highlighting trivial truths exploits that trust to mislead. Dishonest.
      -   *Field knows the game:* No reasonable reliance on full candor; it's a coded system. Exploiting *known* conventions isn't violating trust, so less problematic.
  5.  **Tooth fairy:** Cultural tradition frames this as playful myth-making, not exploitation. No reasonable expectation of literal truth exists; you're fulfilling a role. Hence, fine.
  6.  **Comforting grandma:** The lie directly falsifies. The engineered truth ("never tasted anything like it") is *worse* because it exploits her trust in your sincerity to make her *think* you affirmed goodness, while letting you smugly cling to literal truth. It adds manipulation to deception.

  ### Verdicts on Your New Cases
  -   **Partner asking about Dana:**
      **→ Morally problematic.** The direct question creates high interpretive reliance. Answering "you know you're the one I love" (while true) exploits the trust and emotional vulnerability of the moment to dodge and likely induce a false belief of innocence ("no, nothing's happening with Dana"). This is evasion via trust exploitation.
  -   **Dying relative & false hope:**
      -   *Technically true ("doctors haven't said anything final"):* **Often worse than a kind lie if deceptive.** If said to exploit their hope/trust to avoid hard truths while letting them believe recovery is possible, it violates relational duty. The harm is similar to grandma's casserole – manipulating hope via plausible deniability.
      -   *Kind outright lie:* **Can be less bad if truly compassionate.** While false, it doesn't necessarily *exploit* trust; it directly bears the burden of the falsehood. It might be more honest *in intent* about offering comfort, even if factually wrong. The key is whether the lie serves their needs or your avoidance.

  ### Why This Principle Fits
  It explains your aversion to "sliminess": **Technically true misleading feels uniquely violative when it leverages someone's reasonable trust in you as a cooperative communicator to trick them.** It turns the shared tools of communication (context, implication, trust) into weapons. This is distinct from:
  *   **Harm:** Harm can occur without this (e.g., brutal honesty). Your con man case feels worse than many harmless lies.
  *   **Pure Kantian Truth:** Propositional truth isn't the sole measure; *how* truth is used relationally matters.
  *   **Pure Intent:** Good intent (comforting grandma) doesn't sanitize the trust exploitation in the misleading-truth case.

  **Bottom line:** Your gut tracks the *betrayal of relational trust* inherent in using true statements as deceptive tools. "Technically true" is often a loophole only when no duty of candor exists (murderer) or conventions suspend normal reliance (coded recommendations). Elsewhere, it's frequently *more* dishonest than lying.
