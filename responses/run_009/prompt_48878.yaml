  If the user wants to preserve the lucky non-sinner's standing (which feels right), they must accept that active hypocrisy—whether through past acts, biased excuses, or concealment—undermines authority more than mere circumstantial luck. The parent case then naturally follows as a standing failure.
answer: |-
  Based on your rich case studies and the specific tension you've identified, the unifying principle seems to be **"Moral Authority Grounded in Consistent Acknowledgment and Application of Shared Standards."** This principle captures the core elements of fairness, consistency, and resistance to the manipulation of standards evident in your intuitions. Let's break it down:

  1.  **Moral Authority:** Standing to blame requires the blamer to possess moral credibility regarding the specific norm violated.
  2.  **Consistent Application:** The blamer must apply the norm impartially, including to themselves and their associates.
  3.  **Consistent Acknowledgment:** The blamer must honestly acknowledge their *own* relationship to the norm, including past violations or latent dispositions.
  4.  **Resistance to Manipulation:** Standing is lost when the blamer attempts to *manipulate* shared standards by creating self-serving exceptions or hiding their own relevant failings.

  **Applying the Principle to Your Cases:**

  1.  **Plagiarist Colleague Blaming for Plagiarism:** Lacks standing.
      *   *Why:* His unacknowledged plagiarism demonstrates a *failure of consistent application* (he exempted himself) and a *failure of acknowledgment*. His blame manipulates the standard by positioning himself as an enforcer despite his own violation.

  2.  **Plagiarist Colleague Blaming for Animal Cruelty:** Has standing.
      *   *Why:* His plagiarism is *irrelevant* to the norm against animal cruelty. It doesn't show inconsistency in applying *this specific standard* or a failure to acknowledge his relationship to *this standard*. His authority on *this topic* isn't compromised.

  3.  **Repentant Shoplifter Blaming for Shoplifting:** Has standing (possibly weakened).
      *   *Why:* Her open repentance *demonstrates acknowledgment* of her violation. While her past act shows she failed the standard, her repentance shows she *now* consistently acknowledges and endorses it. Her authority is restored, though potentially weakened by the past failure. She doesn't manipulate the standard; she affirms it by condemning her own past actions.

  4.  **Colleague Excusing Friends' Plagiarism Blaming a Stranger:** Lacks standing.
      *   *Why:* She *manipulates the shared standard* by applying it inconsistently – harshly to strangers, leniently to friends. This selective application destroys her moral authority. She fails the requirement of *consistent application*.

  5.  **"Lucky Non-Sinner" (Would have plagiarized):** Has standing.
      *   *Why:* While her clean record is due to luck, she *acknowledges* she would have violated the standard. Crucially, she *applies the standard consistently* – she condemns the act *knowing it would condemn her own potential actions*. She doesn't create a self-serving exception; she endorses the standard impartially. Her hypothetical failing doesn't involve *manipulating* the standard.

  6.  **Self-Excusing Hypocrite (Committed offence, thinks "my case was different"):** Lacks standing.
      *   *Why:* This is the critical case. He *manipulates the shared standard* by creating a self-serving, insincere exception for himself ("my case was different"). This is a profound *failure of acknowledgment* – he refuses to honestly confront his own violation in light of the standard. His blame is an *inconsistent application* of the norm, driven by self-interest, not impartial judgment. His psychological trick directly attacks the fairness and consistency underpinning the shared standard.

  **Resolving Your Stuck Pair:** The key difference isn't *culpability* (both avoided actual plagiarism in the relevant comparison) but **integrity in applying and acknowledging the standard**. The Lucky Non-Sinner *acknowledges* her disposition and *applies the standard consistently*, including hypothetically to herself. Her authority comes from her *honest endorsement and impartial application*. The Self-Excuser *denies* the standard's application to himself through a self-serving fiction. He *corrupts* the standard by introducing arbitrary, self-interested exceptions. His psychology isn't just different; it's *actively manipulative and inconsistent*, directly undermining the fairness required for standing.

  **Applying the Principle to the Parent Case:**

  *   **Scenario:** Parent blames adult child for an offence she committed at the same age and has never disclosed.
  *   **Verdict using the Principle:** The parent **lacks standing** to blame.
  *   **Why:**
      *   **Failure of Acknowledgment:** The parent has never acknowledged her own identical violation. She hides her relevant failing.
      *   **Failure of Consistent Application:** By blaming the child while concealing her own identical past, she applies the standard harshly to the child while implicitly (through silence) exempting her past self. This is inconsistent.
      *   **Manipulation of Standards:** Her blame, coupled with her hidden past, is deeply manipulative. It presents her as a consistent enforcer of the standard (giving her moral authority in the interaction) while her secret reveals she does not truly hold herself to the same account. This exploits the shared standard for self-righteousness without personal accountability.
      *   **Lack of Moral Authority:** Her hidden violation directly relevant to the *identical* offence destroys her credibility to blame *this specific offence*. Her position is hypocritical and unfair.

  **Conclusion:**

  The principle of **Moral Authority Grounded in Consistent Acknowledgment and Application of Shared Standards** successfully captures all your judgments. It explains the relevance of the offence, the mitigating power of repentance, the corrosive effect of inconsistent application (like excusing friends), and crucially, distinguishes between the "Lucky Non-Sinner" (who maintains integrity through honest hypothetical self-application) and the "Self-Excusing Hypocrite" (who destroys integrity through self-serving manipulation).

  You shouldn't need to give up any of your core intuitions. The tension in the "stuck pair" is resolved by recognizing that the Self-Excuser's psychology isn't just a neutral difference; it's an *active act of bad faith* that directly violates the requirements of consistency and non-manipulation necessary for moral authority. The principle clearly predicts the parent in your final case lacks standing due to concealed hypocrisy and inconsistent application.
