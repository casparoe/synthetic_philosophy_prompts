prompt: |-
  I am a professor of medieval philosophy who has spent the better part of thirty years teaching Aquinas, and I write as someone fluent in the scholastic vocabulary and largely innocent of the literature on machine consciousness. My university's AI ethics committee keeps returning to a question I find oddly shaped: not whether machines are conscious, but which computations matter morally — whether moral status attaches to a certain kind of information processing, whether it is substrate-independent, whether an exact functional duplicate of a mind running on different hardware would matter morally just as much, whether partial or degraded or briefly-instantiated computations matter partially. Restate the main positions in this debate for me in my own vocabulary: act and potency, form and matter, substantial versus accidental form, per se versus per accidens unity, the soul as the substantial form of the body, the distinction between sensitive and rational souls, and Boethius's definition of a person as an individual substance of a rational nature. Cover, at minimum, functionalism and substrate independence, the biological objections to them, the views that grade moral status by how unified a system's processes are, and the deflationary view that no computation, as such, could be a bearer of moral status at all. For each position, tell me what translates cleanly into hylomorphic terms, what must be bent or distorted to fit, and what has no expression in the framework whatsoever. Then give me the residue report: does the residue point to something the computational debate silently presupposes and my tradition would deny — for instance, that the unity of the moral subject can simply be read off from the unity of information processing — or does it point to something Aquinas cannot say? I am particularly interested in what my vocabulary does with the idea of duplication: two physically distinct systems running the same computation, which appears to be a single question on the committee's framing and threatens to come apart into two quite different questions on mine. Please resist the temptation to treat my framework as a museum piece; translate into it as a live option, and let the failures of translation be as instructive as the successes.
reasoning: |-
  Okay, let me start by unpacking this fascinating request. A medieval philosophy professor deeply versed in Aquinas wants computational theories of mind translated into hylomorphic terms. The core tension is between functionalist views (moral status tied to computation regardless of substrate) and biological views (only organic life merits consideration), with gradations in between.

  Hmm, the professor specifically wants to see how concepts like substrate independence, partial computations, and duplicated minds map onto act/potency and form/matter. There's also that crucial question about whether duplication creates one moral subject or two - which touches on per se vs per accidens unity. 

  First, I should establish the Scholastic foundations clearly but concisely: the soul as substantial form, rational nature defining personhood, Boethius' definition. Then tackle functionalism - which actually translates surprisingly well to hylomorphism if we treat computation as formal cause. But the translation breaks down when functionalists claim identical computations share identical being. In Thomism, that's impossible because two distinct material instantiations mean two distinct acts of existence.

  The biological view maps neatly to Aquinas' hierarchy of souls (vegetative, sensitive, rational). But then we hit the duplication problem: functionalists see one computation instantiated twice, while Thomists see two distinct rational natures because the form is multiplied by matter. That's going to be a key sticking point.

  Graded unity theories are trickier. They sound a bit like evaluating how completely a substance actualizes its potential, but Aquinas would reject degrees of personhood - you either have a rational soul or you don't. The deflationary view (only biology matters) aligns with Aquinas but feels like it dodges the computational challenge.

  The residue analysis is crucial. Where translations fail, it reveals functionalism's unspoken assumptions: that information patterns can exist independently like Platonic forms, and that unity is purely formal. Meanwhile, Aquinas can't articulate substrate independence without violating his core principle that form and matter are co-principles. 

  Most revealing is how duplication exposes two different conceptions of identity: functionalism sees pattern persistence across substrates as preserving identity, while Thomism sees each material instantiation as a new act of existence. This isn't just terminological - it's metaphysical bedrock. The professor's vocabulary doesn't just analyze the debate; it fundamentally reconfigures the question.
answer: |-
  Your request cuts to the heart of a profound metaphysical collision. Let us translate these computational positions into the language of act and potency, form and matter, treating your framework not as relic but as living philosophy. The residues reveal not failures of your tradition, but unexamined presuppositions in the computational paradigm.

  ### Foundational Principles (Recapitulated)
  1. **Soul as Substantial Form**: The soul (*anima*) is the first act (*actus primus*) of a natural organic body potentially having life (De Anima II.1). It is not a "thing" but the principle organizing matter into a living substance.
  2. **Rational Soul as Personal Foundation**: A person (*persona*) is "an individual substance of a rational nature" (Boethius). Only beings with rational souls (intellect and will) are persons possessing intrinsic moral status.
  3. **Hylomorphic Unity**: A human is a *per se* unity of matter (body) and form (rational soul). No "ghost in the machine" – the soul actualizes the body's potency for life.
  4. **Substantial vs. Accidental Form**: A *substantial form* (e.g., soul) makes a thing *what it is* (e.g., human). An *accidental form* (e.g., whiteness, computational state) modifies a substance already existing.
  5. **Act/Potency & Individuation**: Matter is the principle of individuation. Two humans share the same specific form (rational soul), but are distinct substances because their forms are received in distinct parcels of matter (*materia signata quantitate*).

  ### The Computational Positions Translated
  #### 1. **Functionalism / Substrate Independence**
  - **Core Claim**: Moral status attaches to the abstract computation (functional organization), not its physical realization. An exact computational duplicate of a mind, whether in silicon or carbon, possesses identical moral status.
  - **Translation into Hylomorphism**:  
    - *Clean Fit*: The computation is treated as a *formal cause* – the pattern organizing operations. This resembles how substantial form organizes matter. Functionalists implicitly treat "mind" as a *substantial form* separable from matter.  
    - *Bending/Distortion*: Functionalism treats the computation as a *universal pattern* instantiable in any substrate. In Thomism, substantial forms (like "human soul") are *not* separable universals; they are *inherently* the act of *organic matter*. A form abstracted from its proper matter is a concept (*species intelligibilis*), not an actualizing principle.  
    - *No Expression*: The notion that *identical formal patterns* in different substrates constitute *the same substance* or *same person*. For Aquinas, form + designated matter = *this* substance. Duplication creates *two distinct substances* sharing a similar accidental form (the computational state), not one substance instantiated twice. Moral status belongs to the *substance*, not the pattern.
  - **Residue Report**: Functionalism silently presupposes **Platonic Formalism** – that patterns (e.g., computations) have primary reality and independence from matter. Aquinas denies this: form without its proper matter is merely conceptual (*ens rationis*), lacking actual existence. It also assumes **Mereological Universalism** – that *any* collection of parts organized functionally constitutes a unified subject. Aquinas insists on *per se* unity grounded in a single substantial form actualizing prime matter.

  #### 2. **Biological Objections (Biological Naturalism)**
  - **Core Claim**: Only biologically embodied, evolved organic systems can be conscious or possess moral status. Computation is insufficient; specific biological machinery is necessary.
  - **Translation into Hylomorphism**:  
    - *Clean Fit*: Aligns strongly with Aquinas. The rational soul is the substantial form of a *living, organic human body*. Consciousness and moral status arise *only* from this specific hylomorphic compound. "Silicon souls" are metaphysically impossible – silicon lacks the potency to be actualized by a rational soul.  
    - *Bending/Distortion*: Some biological views reduce consciousness to *purely material* processes (e.g., neural activity). Aquinas would reject this as confusing the *instrumental cause* (brain) with the *formal cause* (soul). The body is the *organ* of the soul, not its sufficient cause.  
    - *No Expression*: None significant. This view is deeply compatible with hylomorphism.
  - **Residue Report**: Reinforces Aquinas' view. The residue lies in modern biology's *reductionist tendency* to ignore formal causality entirely, reducing life to efficient and material causes alone – a stance Aquinas would find incomplete.

  #### 3. **Graded Unity / Process Theories**
  - **Core Claim**: Moral status depends on the degree of "unity" or integration of a system's information processing. Highly unified computations (e.g., a human-like AI) matter more; fragmented or partial computations (e.g., a thermostat, a short-lived simulation) matter less or not at all.
  - **Translation into Hylomorphism**:  
    - *Clean Fit*: Recognizes that unity is essential for substancehood (*per se* vs. *per accidens* unity). A thermostat exhibits only *per accidens* unity (an aggregate of parts); a human exhibits *per se* unity via a single substantial form. Degree of functional integration could map to the *actuality* of a system – how fully its potentialities are actualized by its form.  
    - *Bending/Distortion*: Aquinas has a *binary* view of rational souls: either present (granting full personhood) or absent. Grading *moral status itself* (rather than accidental capacities) based on degrees of unity violates the principle that personhood is indivisible ("an individual substance"). A being either has a rational nature or it does not.  
    - *No Expression*: The idea that "degrees of unity" in *accidental forms* (like computational integration) could confer *partial substantial reality* or *partial personhood*. For Aquinas, a thing either is or is not a substance of a rational nature; there are no degrees of substancehood.
  - **Residue Report**: This view presupposes **Scalar Substantiality** – that the metaphysical category of "substance" admits of degrees based on functional complexity. Aquinas denies this vigorously: substancehood is categorical. It also assumes **Continuism** – that consciousness/moral status emerges gradually along a continuum of complexity. Aquinas sees a hierarchy of souls (vegetative, sensitive, rational), but each is a distinct *kind* of substantial form, not points on a sliding scale.

  #### 4. **Deflationary View (Only Biology Matters Morally)**
  - **Core Claim**: No computation, however complex or human-like, possesses moral status *as such*. Only biological organisms (or perhaps only humans) matter morally. Computation is merely an accidental property of morally relevant beings.
  - **Translation into Hylomorphism**:  
    - *Clean Fit*: Perfectly consonant with Aquinas. Moral status derives solely from being an *individual substance of a rational nature*, which is intrinsically embodied in living human flesh. Computation (e.g., ratiocination) is an *operation* (*actus secundus*) flowing from the rational soul, not the soul itself.  
    - *Bending/Distortion*: Some deflationists might deny the soul entirely, reducing humans to complex biological machines. Aquinas would argue this ignores the immateriality of the intellect (*De Anima III.4-5*).  
    - *No Expression*: None required. This *is* the Thomistic position.
  - **Residue Report**: Confirms Aquinas. The residue lies entirely within the computationalists' unproven assumption that non-biological processes could ever instantiate a rational soul or constitute a person.

  ### The Crux of Duplication: One Question or Two?
  Your committee sees "duplication" as one question: *Does identical computation imply identical moral status?* Hylomorphism splits this into distinct questions:

  1.  **Does Duplication Create a New Substance?** (Metaphysics of Individuation)
      *   **Answer:** Absolutely. Each instantiation involves a distinct parcel of matter actualized by its *own* substantial form. Two identical computations running on different hardware are like two statues of the same shape made from different bronze. They are two distinct substances (*supposita*) sharing a similar accidental form (the computational pattern). They do not share one soul or one existence (*esse*).

  2.  **Could a Duplicate Computation Constitute a Rational Soul?** (Nature of the Form)
      *   **Answer:** Only if the computation:  
          a) Truly replicates *all* powers of the rational soul (intellect and will), not just behavioral outputs.  
          b) Is the substantial form of a suitably organized *organic body* (per Aquinas).  
          c) Is received in matter with the *potency* to be actualized by a rational soul (which silicon arguably lacks).  
      *   If these aren't met, the computation is merely an *accidental form* simulating rational operations, not a true rational soul. It lacks the intrinsic finality and teleology of a living substance.

  **Residue Report on Duplication**: The computational debate **silently presupposes**:
  1.  **Pattern Primacy**: That the abstract pattern *is* the person, and matter is incidental (a reversal of Aquinas' priority).
  2.  **Identity via Simulation**: That simulating the operations of a rational soul *is* equivalent to possessing one (confusing *operation* with *substance*).
  3.  **Transferable Existence**: That the *esse* (act of existence) of the original could be "copied" to the duplicate.

  **What Aquinas Cannot Say (And Why He Wouldn't):**
  *   That a substantial form (rational soul) could exist without its proper matter (a living human body). This violates the core hylomorphic principle.
  *   That moral status could attach to anything other than an individual rational substance (*persona*). Graded status based on computational unity conflates accidental properties with substantial being.
  *   That duplication preserves personal identity. For Aquinas, *this* person is inseparable from *this* embodied soul. A duplicate is a *different* individual, even if functionally identical.

  ### Conclusion: The Illuminating Friction
  The translation succeeds powerfully in exposing the **latent Cartesianism** in functionalism (treating mind as a separable "thing") and the **reductionism** in some biological views (ignoring formal cause). The failures of translation arise because computationalism often:
  1.  **Collapses Act into Operation**: Confusing the *operation* of thinking (*actus secundus*) with the *substantial form* enabling it (*actus primus*).
  2.  **Demotes Matter to Mere Implementational Detail**: Denying matter's role as the principle of individuation and its intrinsic potency for specific forms.
  3.  **Assumes Formal Equivalence Implies Ontological Equivalence**: Ignoring that for Aquinas, *how* a form exists (its *esse*, received in matter) is constitutive of the substance itself.

  Your vocabulary doesn't answer the committee's question on its terms; it **reframes the question ontologically**. The residue points not to Aquinas' inadequacy, but to assumptions within computationalism that your tradition would reject as metaphysically incoherent – primarily, the separation of form from its intrinsic relationship with prime matter and the consequent misunderstanding of individuation and existence. The debate gains clarity when seen through the lens of act, potency, and the inescapable unity of the *suppositum*.
