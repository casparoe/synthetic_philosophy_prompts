prompt: |-
  I'm on the committee of a small charity in Leeds that hands out roughly £40,000 a year in grants to struggling families in the borough -- help with school uniforms, boiler repairs, that sort of thing. We always have more applicants than money, and I've got into long arguments with the other trustees about what a "fair" split even means here. A couple of them basically want to give to whoever seems worst off emotionally (welfare, I take it?), others want a flat rule based on income bands (resources?), and I keep thinking the real question is what people are actually able to do -- whether a kid can go on the school trip, whether a mum can keep her job with the childcare costs she's got. From reading around a bit I gather this is an old argument philosophers have under the heading "equality of what", and that there are live puzzles underneath it: expensive tastes (if someone's genuinely miserable unless they get a foreign holiday, are they worse off than someone content with less?), people whose wants have shrunk to fit their circumstances (I think one article called these adaptive preferences), and whether you should treat bad luck differently from choices people made themselves.

  I've got no philosophy training, just a stubborn streak, a decent chunk of committee time, and about a year before we rewrite our allocation guidelines. Which of the open questions in this area actually deserve my evenings, in what order, and why those rather than the others? I don't want a tour of the whole debate -- I want a defended pecking order. What makes one puzzle worth my time given that it's me and a spreadsheet, not a research institute? Some of this stuff (like whether tastes are "expensive" through anyone's fault) feels like it might matter loads for who gets a £200 grant, and some feels like it only matters for ideal societies we'll never live in -- tell me which is which. And what would change your ranking? For instance if we started means-testing properly, or if the council doubled our funding, or if a third of the applicants were asylum seekers with essentially zero income on paper.
reasoning: |-
  Okay, the user is on a charity committee in Leeds distributing £40k annually to families for essentials like school uniforms and boiler repairs. They face more applicants than funds and are debating what "fair" means. The trustees have different views: some prioritize emotional distress, others income bands, and the user focuses on capabilities—like whether a child can join a school trip or a parent can keep their job due to childcare costs.

  The user mentions philosophical concepts like "equality of what," expensive tastes, adaptive preferences, and luck vs. choice. They need practical guidance on which philosophical puzzles are worth their limited time, given they're working with spreadsheets, not a research institute. They want a prioritized list based on real-world impact for their charity.

  First, I need to unpack their scenario. The charity has limited funds, so prioritization is crucial. They’re dealing with immediate needs: preventing kids from missing school, ensuring heating works, enabling parents to work. The user’s capability approach (Amartya Sen) seems most relevant here because it addresses what people can actually do, which aligns with their concerns about school trips and job retention.

  The key issues they raised:
  1. **Expensive Tastes**: Should someone’s unhappiness without luxuries (like a holiday) make them more deserving? In practice, for a small charity focused on basics, this seems low priority. Their grants are for essentials, not luxuries. So this might be a theoretical distraction.
     
  2. **Adaptive Preferences**: People lowering expectations due to circumstances. This is critical. For example, a parent might not apply for a school trip grant because they’ve accepted their child can't participate, perpetuating disadvantage. The charity must proactively identify these hidden needs. This affects outreach and application design—ensuring they capture unvoiced needs.

  3. **Luck vs. Choice**: Distinguishing between misfortune (e.g., illness) and personal choices (e.g., overspending). This is operational but tricky. They need a balanced approach. Verifying circumstances is resource-intensive. Maybe focus on clear cases of bad luck (boiler breakdown) versus less clear-cut situations. Avoid moral judgments; use proxies like sudden expenses vs. chronic issues.

  The user’s constraints: limited time, spreadsheet-based, yearly guidelines. They need actionable insights, not theory. 

  Prioritizing the puzzles:
  1. **Adaptive Preferences**: Top priority. Impacts who applies and how needs are assessed. If overlooked, the most vulnerable might be missed. Solutions: train assessors to ask probing questions, design forms to uncover hidden needs, community outreach.
     
  2. **Luck vs. Choice**: Second. Affects fairness perceptions. Need practical criteria: e.g., prioritize unexpected crises over chronic but manageable issues. Avoid stigma; use documents (bills, eviction notices) as proof without intrusive inquiries.
     
  3. **Expensive Tastes**: Least relevant. Their grants are for essentials, so this is a non-issue. Focus resources elsewhere.

  External factors changing priorities:
  - **Means-testing**: If implemented, luck vs. choice becomes more prominent. Need to verify income and circumstances, which could strain resources. Adaptive preferences still matter for identifying needs.
  - **Funding Doubled**: More room to help, so adaptive preferences might be prioritized to reach those who don't apply. Also, could address borderline cases where luck vs. choice is ambiguous.
  - **Asylum Seekers**: This group has minimal resources, so expensive tastes and luck vs. choice are irrelevant. Focus shifts to verifying status and urgent needs. Adaptive preferences still key, as they may not voice needs due to trauma or distrust.

  The user’s deeper needs: They want to maximize the impact of each £200 grant. They need efficient, defensible criteria that trustees agree on. Avoiding theoretical debates in favor of practical, impactful solutions. Ensuring funds reach those most hindered by lack of resources, enabling basic capabilities.

  In summary, adaptive preferences and luck vs. choice are the most pressing. The former ensures they reach the right people, the latter ensures fair allocation. Expensive tastes can be ignored. The approach should be flexible based on changing circumstances like funding or applicant demographics.
answer: |-
  Based on your situation – a small charity with limited funds, immediate practical decisions, and a focus on enabling basic functioning (school, work, warmth) – here's a **defended pecking order** for the philosophical puzzles, ranked by **practical impact per hour of your time**:

  1.  **Adaptive Preferences (Your Top Priority)**
      *   **Why it matters most *right now*:** This directly impacts **who even applies** and **how needs are perceived**. If families have resigned themselves to hardship (e.g., the child *never* goes on trips, the mum *assumes* she must quit), they might not apply, or their application might downplay the severity. Your charity risks missing the most disadvantaged *because* they've adapted. This isn't just about "wants"; it's about suppressed **capabilities** (the kid *can't* participate, the mum *can't* work).
      *   **Your Evening Time Focus:**
          *   **Application Design:** Craft questions that uncover hidden deprivations. Instead of "Do you need help with X?", ask "Has your child missed school events due to cost?" or "Has maintaining employment been difficult due to childcare/uniform costs?". Probe for *capability failures*.
          *   **Assessor Training:** Train trustees/staff to recognise signals of resignation ("Oh, we manage without," "It's fine, others need it more") and gently explore the underlying barriers. Focus on objective impacts (attendance, employment status) rather than subjective expressions of distress.
          *   **Outreach:** Actively reach into communities where adaptive preferences might be high (e.g., long-term deprived areas, isolated groups) to explain *what* you can fund and *why* applying matters. Challenge the narrative that "this is just how it is".
      *   **Why over others?** This is fundamental to identifying the *true* level of disadvantage you aim to address. Misjudging need due to adaptation means resources miss their target entirely. It underpins the effectiveness of *any* allocation method.

  2.  **Luck vs. Choice (Operationalising "Responsibility")**
      *   **Why it matters practically:** You *already* make judgments here, even informally. Was the boiler breakdown due to neglect (choice) or ancient age despite maintenance (bad luck)? Is chronic unemployment due to disability (luck) or... other factors? While perfect fairness is impossible, having *consistent, humane principles* prevents arbitrary decisions and trustee conflict. It directly affects who gets priority when funds are tight.
      *   **Your Evening Time Focus:**
          *   **Developing Practical Heuristics:** Don't aim for perfect moral judgments. Focus on **verifiable facts** and **proxies**:
              *   **Sudden vs. Chronic:** Prioritise sudden, catastrophic hardship (boiler breakdown in winter) over long-term, managed hardship (though adaptive preferences complicate this!). Bad luck often manifests as shocks.
              *   **External Circumstances:** Give weight to factors demonstrably beyond control (disability, illness, redundancy, fleeing violence, asylum status) vs. patterns where agency *might* play a larger role (need clearer evidence).
              *   **Avoid Stigma:** Err on the side of assuming bad luck unless there's clear, documented evidence of reckless choices *directly causing* the *specific need*. The burden of proof for "choice" should be high and evidence-based.
              *   **Focus on the Present Need:** Does the *immediate grant* address a barrier largely caused by circumstance? If yes, the background "why" matters less than the *current capability failure*.
          *   **Documentation Guidelines:** What constitutes acceptable evidence of "bad luck" (e.g., redundancy notice, eviction notice, medical letter)? Be transparent and proportionate (don't demand excessive proof for a £200 grant).
      *   **Why over Expensive Tastes?** This question surfaces constantly in grant assessments ("Could they have avoided this?"). Ignoring it leads to inconsistent decisions. Expensive tastes, in your context, are largely irrelevant (see below).

  3.  **Expensive Tastes (Minimal Priority - Mostly Ignore)**
      *   **Why it deserves *least* of your time:** Your grants are for **basic necessities and capabilities** (school participation, essential repairs, work sustainability). Someone "genuinely miserable" without a foreign holiday is simply *not the target demographic* for your £200 grants. Their distress, while real, stems from a lack of a *luxury*, not a deprivation of basic functioning or opportunity in Leeds. Your criteria should screen this out implicitly.
      *   **Your (Minimal) Time Focus:**
          *   **Clarity in Purpose:** Explicitly state your grants are for enabling **basic participation, safety, and economic security** within the community. Frame need around these concrete *capabilities*, not subjective happiness or unconstrained desires.
          *   **Application Screening:** Applications requesting non-essentials (like holidays) can be quickly filtered out based on your stated criteria. No deep philosophical dive needed.
      *   **Why bottom?** It's a fascinating theoretical problem for universal basic income or ideal societies, but it's a distraction for a small charity focused on fundamental needs. Your problem is *scarcity of essentials*, not adjudicating the validity of desires for non-essentials.

  **What Changes This Ranking? Your Scenarios:**

  1.  **Means-Testing Properly:**
      *   **Impact:** Reduces (but doesn't eliminate) debates about "resources" (income bands). **Adaptive Preferences** become *even more critical* – means-testing might miss those who don't apply or under-report due to resignation/shame. **Luck vs. Choice** becomes sharper – with verified low income, the question becomes "Why are they *still* unable to meet this *specific* essential need despite income? Bad luck or choice?". **Expensive Tastes** remains irrelevant.
      *   **New Priority:** 1. Adaptive Prefs, 2. Luck vs. Choice (now focused on specific need causation), 3. Expensive Tastes.

  2.  **Council Funding Doubled:**
      *   **Impact:** Reduces absolute scarcity. You can help more in the "grey zones". **Adaptive Preferences** remains top to ensure you reach the *most* hidden needs. **Luck vs. Choice** becomes *slightly* less acute – you might have capacity to help some where "choice" is ambiguous, focusing more on the severity of the *capability failure* itself. **Expensive Tastes** remains irrelevant.
      *   **New Priority:** 1. Adaptive Prefs, 2. Luck vs. Choice (less intense focus), 3. Expensive Tastes.

  3.  **1/3 Applicants are Asylum Seekers with Zero Paper Income:**
      *   **Impact:** **Adaptive Preferences** is crucial – they may be highly resigned, distrustful, or unaware of support. **Luck vs. Choice** is largely moot – their situation is overwhelmingly due to catastrophic bad luck (persecution, displacement). Focus shifts to **verifying status/need** (a practical, not philosophical, task) and recognising unique barriers (language, trauma, no recourse to public funds). **Expensive Tastes** is completely off the radar.
      *   **New Priority:** 1. Adaptive Prefs (specifically for this group & outreach), 2. Practical Verification/Needs Assessment (replaces Luck vs. Choice as the key operational challenge), 3. Luck vs. Choice (greatly diminished relevance for this cohort).

  **Critical Action Beyond Philosophy:**

  *   **Define Your Core Metric of Disadvantage:** Based on your instinct, **formally adopt a "Capability" framework** (Amartya Sen). State clearly: "We prioritise grants that most effectively remove barriers to *essential capabilities*: a child's full participation in school, an adult's ability to secure/maintain employment, a family's safety and basic health (warmth, repairs)." This directly addresses your concern ("what people are actually able to do") and provides a lens to evaluate *all* applications and philosophical puzzles.
  *   **Gather Data (Simply):** Use your spreadsheet to track, over time:
      *   Types of capability failures addressed.
      *   Any patterns linked to potential adaptive preferences (e.g., referrals from specific sources yield different need profiles).
      *   Outcomes where possible (e.g., child attended trip, boiler fixed, job retained). This evidence informs future guidelines better than abstract debate.
  *   **Focus on Process Fairness:** However you resolve the philosophy, ensure the *process* is transparent, consistent, respectful, and documented. This builds trust and legitimacy, even when decisions are hard.

  **In short: Spend your evenings wrestling with how to identify hidden hardship caused by resignation (Adaptive Preferences) and developing humane, practical rules for handling unavoidable misfortune vs. potential agency (Luck vs. Choice). Ignore debates about champagne tastes when you're funding school shoes and boilers. Anchor everything in enabling basic capabilities.** This focus maximises the real-world impact of your £200 grants where it matters most.
