prompt: |-
  I'm putting together background for a reading group on whether the special sciences — economics, cognitive science, evolutionary biology — earn their ontologies or merely enjoy useful fictions. People keep appealing to Dennett's notion of real patterns, together with his distinction between the physical, design, and intentional stances, as though that appeal settled something. Before anyone argues from it, I'd like the specification. Please write the desiderata: the requirements any adequate theory of real patterns must meet, with the motivating case behind each, and flag any pair of requirements you suspect cannot be jointly satisfied.

  The following sorts of cases should at least be forced onto the list, though you should decide what the full list is:

  - Grain-relativity. A pattern can be detectable only by beings with particular computational limits: gliders in an enormous run of Life are obvious at a coarse grain and invisible at the pixel grain. Must the theory count such patterns as real, and if so, real relative to what?
  - Usefulness versus gerrymandering. A partition of the night sky into constellations, or a projection that groups randomly scattered dots into shapes that predict nothing a simpler projection wouldn't. What separates a real pattern from a projection that merely suits our interests?
  - The thermostat and the chess program. Things we routinely talk about as though they want or believe things. Where should the theory place the threshold for legitimate intentional-stance attribution, and can that threshold be principled rather than merely a matter of habit?
  - Non-coincidental success. Cases where the physical stance is predictively hopeless — turbulence, a chess position many plies deep — and the intentional stance does better. What should count as a pattern's predictive leverage being non-coincidental when we have no independent way to check that the pattern tracks anything?
  - Levels. If beliefs are real patterns and neurons are real patterns, the theory owes us an account of how patterns at different levels coexist, and of the difference between a coarse pattern being reduced by a finer one and its being eliminated outright.

  For each requirement, please say whether it is non-negotiable or a prejudice of one camp (for instance, a demand for observer-independent existence that only a thoroughgoing metaphysical realist would insist on), and identify the single requirement that excludes the most candidate theories. Finally, and briefly: how does Dennett's own account fare against your list, and where is it weakest?
reasoning: |-
  Okay, let me tackle this query step by step. The user is preparing for a reading group debate about whether special sciences like economics or cognitive science deal with real entities or just useful fictions. They specifically want to dissect Dennett's "real patterns" concept and his three stances (physical, design, intentional). 

  First, I need to extract the core challenges they listed: grain-relativity (patterns visible only at certain scales), usefulness vs gerrymandering (what makes a pattern "real" versus arbitrary), thermostat/chess cases (how much complexity justifies intentional stance), non-coincidental success (when predictive power isn't accidental), and levels (how patterns at different scales coexist). 

  Hmm, the user seems frustrated by people invoking Dennett as if it's a silver bullet. They want rigorous criteria to test any theory of real patterns, especially Dennett's. Underneath this, I suspect they're probing whether anti-realism about special sciences can be avoided without naive realism. 

  For the requirements, I'll start from their cases but generalize. Grain-relativity forces us to accept observer-relative patterns without making them subjective - that's tricky. Usefulness needs a criterion beyond pragmatism, maybe algorithmic compressibility. The thermostat case demands a principled threshold for intentionality. Non-coincidental success requires linking prediction to pattern robustness. Levels need emergence without mysterious overdetermination. 

  Ah, the toughest conflict: algorithmic compressibility (requirement 2) vs grain-relativity (requirement 1). Compressibility suggests an objective feature, but grain-dependence makes patterns observer-relative. Most theories stumble here - either collapsing into subjectivity or denying relativity. 

  For Dennett's account: his predictive indispensability handles usefulness and non-coincidence well, and his emergentism addresses levels. But he's weakest on grain-relativity - calling patterns "real for all practical purposes" feels evasive about objectivity. And his intentional stance threshold seems vague despite invoking system complexity. 

  The user will likely push back on whether predictive success alone justifies ontology. Maybe flag that as the key meta-debate: must a "real" pattern be mind-independent, or is indispensability to observers enough? That's where realist vs pragmatic camps split.
answer: |-
  Here’s a structured breakdown of desiderata for an adequate theory of "real patterns," motivated by your cases, with assessments of negotiability and conflicts:

  ---

  ### **Core Desiderata for a Theory of Real Patterns**
  1. **Grain-Relativity Accommodation**  
     - *Requirement*: Must acknowledge patterns detectable only at specific scales/resolutions as *real*, but relativized to observers or epistemic contexts (e.g., gliders in Game of Life).  
     - *Motivating Case*: Coarse-grained patterns (e.g., "beliefs") vs. fine-grained neural activity.  
     - *Negotiability*: Non-negotiable for anti-reductionists; a "prejudice" for hardcore reductionists who demand scale-invariant reality.  

  2. **Non-Arbitrariness (vs. Gerrymandering)**  
     - *Requirement*: Must distinguish *projection-independent* patterns (e.g., gravitational orbits) from human-relative projections (e.g., constellations). Criterion: predictive robustness, counterfactual stability, or algorithmic compressibility.  
     - *Motivating Case*: Useful star groupings vs. scientifically inert constellations.  
     - *Negotiability*: Non-negotiable for realists; instrumentalists may relax this.  

  3. **Threshold for Intentionality**  
     - *Requirement*: Must define a *principled threshold* (e.g., complexity, feedback sensitivity) for when intentional stance attribution is legitimate (e.g., chess AI vs. thermostat).  
     - *Motivating Case*: Thermostat "desires" (oversimplified) vs. deep strategic cognition.  
     - *Negotiability*: Negotiable—pragmatists (like Dennett) accept usefulness; realists demand causal structure.  

  4. **Non-Coincidental Predictive Leverage**  
     - *Requirement*: Patterns must provide *robustly reliable* predictions where alternatives fail (e.g., predicting stock markets via economics vs. particle physics). Success must not be accidental.  
     - *Motivating Case*: Intentional stance predicting chess moves where physical stance is computationally intractable.  
     - *Negotiability*: Non-negotiable—all camps require non-accidentality, but disagree on *how* to verify it.  

  5. **Multi-Level Coexistence without Overdetermination**  
     - *Requirement*: Must explain how patterns at different levels (e.g., beliefs and neurons) coexist without causal exclusion or inconsistency. Clarify reduction (pattern preserved) vs. elimination (pattern false).  
     - *Motivating Case*: Beliefs (intentional) realized by neural patterns (design/physical).  
     - *Negotiability*: Non-negotiable for non-reductive physicalists; eliminativists reject higher-level reality.  

  6. **Observer-Independence (Optional but Contentious)**  
     - *Requirement*: Patterns should exist independently of human cognition (e.g., evolutionary patterns before humans).  
     - *Motivating Case*: Biological adaptations as patterns detectable by any sufficiently advanced observer.  
     - *Negotiability*: *Prejudice* of metaphysical realists; pragmatists reject it.  

  ---

  ### **Key Conflict: The Central Tension**  
  - **Requirement 1 (Grain-Relativity)** vs. **Requirement 2 (Non-Arbitrariness)**  
    - *Conflict*: Grain-relativity makes patterns observer-relative, but non-arbitrariness demands objectivity. Can a pattern be both "real" *and* dependent on cognitive limitations?  
    - *Excluded Theories*: Eliminates strict objectivity-based theories (e.g., Platonic realism) and radical subjectivism (e.g., social constructivism).  

  ---

  ### **Dennett’s Account: Strengths and Weaknesses**  
  **Strengths**:  
  - Excels at **grain-relativity** (patterns real *for practical purposes*).  
  - Addresses **non-coincidental success** via predictive indispensability.  
  - Handles **levels** via patterns "emerging" from the design stance.  

  **Weaknesses**:  
  1. **Threshold for Intentionality (Desideratum 3)**: Dennett’s criterion ("adopting the stance works") is *too pragmatic*—lacks principled complexity metrics.  
  2. **Non-Arbitrariness (Desideratum 2)**: His reliance on "practical utility" risks collapsing into instrumentalism, failing to exclude gerrymandered patterns.  
  3. **Observer-Independence (Desideratum 6)**: Dennett explicitly rejects this, weakening realism.  

  **Verdict**: Dennett’s account satisfies grain-relativity, predictive leverage, and levels elegantly but stumbles on objectivity and precise intentional thresholds. It’s a *pragmatic* solution that prioritizes utility over metaphysics—ideal for anti-realists but unsatisfying for robust realists.  

  ---

  ### **Summary Table of Desiderata**  
  | **Requirement**               | **Non-Negotiable?**          | **Dennett’s Performance** |  
  |-------------------------------|------------------------------|---------------------------|  
  | Grain-Relativity              | Anti-reductionists only      | ★★★★☆ (Strong)            |  
  | Non-Arbitrariness             | Realists                     | ★★☆☆☆ (Weak: too pragmatic)|  
  | Intentional Threshold         | Context-dependent            | ★★☆☆☆ (Vague)             |  
  | Non-Coincidental Success      | Universal                   | ★★★★★ (Core strength)     |  
  | Multi-Level Coexistence       | Non-reductionists           | ★★★★☆ (Emergentist)       |  
  | Observer-Independence         | Metaphysical realists only  | ☆☆☆☆☆ (Rejected)          |  

  The unresolved tension between **relativity** and **objectivity** is where debates will crystallize. Dennett resolves it by sacrificing strong objectivity—a move realists will contest.
