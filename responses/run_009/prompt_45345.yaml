  |-------------------------------|-------------------------------------------------------------|-------------------------------------------------------------|-----------------|-----------------|------------------------|-----------------------------------------------------------------------------------|  
  | **Counterfactual Mugging** (in tails branch) | Tails: pay = -$100, refuse = $0. Heads: +$10k if payer.     | Heads reward depends on *counterfactual* tails action.      | Refuse          | Refuse          | Pay                   | "Paying $100 for nothing feels dumb. But precommitting buys the heads reward."    |  
  | **XOR Blackmail** (when letter received) | Pay = -$100, refuse = -$10,000.                             | Receiving letter signals you’re a "payer"; refusing triggers disaster. | Pay            | Pay             | Pay (but avoidable via precommit) | "Once the letter arrives, you’re toast: pay or face ruin."                        |  
  | **Hybrid Mugging** (when contacted)       | Tails: pay = +$9,900, refuse = $0. Heads: pay = -$100, refuse = $0. | Contact in heads only if you’d pay in tails.                | Pay             | Pay             | Pay                   | "50% chance of tails jackpot outweighs 50% chance of heads loss. Roll the dice."  |  

  ---

  ### Key Takeaways  
  - **Your Distinction**: You’re onto something! In CM, the coin flip is **causally independent** of you—your decision doesn’t affect whether the coin lands heads/tails, only whether you get the reward. In XB, the blackmailer’s action **depends on their prediction of your algorithm**, so the letter’s arrival is *evidence* about your type. EDT *formalizes this*: in XB, conditioning on the letter forces you to pay; in CM, conditioning on tails makes paying seem useless.  
  - **Theories**:  
    - **CDT** refuses CM (no causal benefit in tails) but pays in XB/HM (avoids immediate loss).  
    - **EDT** refuses CM (tails world is fixed; paying doesn’t change heads) but pays in XB/HM (action correlates with avoiding disaster).  
    - **Updateless** pays in CM/HM (optimizes global policy) and pays in XB *if cornered*, but prefers precommitting to refuse to dodge the letter entirely.  
  - **Hybrid Case**:  
    - **Structurally closer to CM**: The coin flip is independent, but contact in heads depends on your counterfactual action (like CM’s reward).  
    - **All theories say "pay"** when contacted. Why? Even though heads contact is evidence you’re a "payer," the expected value of paying (+$4,900) beats refusing ($0) when you don’t know the coin state.  

