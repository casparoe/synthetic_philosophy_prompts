answer: |-
  ### Integrated Intake Procedure for Allegations of Research Misconduct

  This procedure harmonizes reductionist and anti-reductionist approaches to testimony by setting clear thresholds for action, explicit defeater checks, and a tiered corroboration framework. It prioritizes **pragmatic epistemology**: testimony alone can justify action when uncontradicted and from competent sources (anti-reductionist default), but requires independent support in high-risk contexts (reductionist safeguard). Conflicts between theories are resolved through **sequenced filters** and **institutional risk thresholds**, with values-based decisions elevated to the director.

  **Procedure Workflow**  
  *Fixed order; complete all steps within 60 minutes. Terminate at first qualifying exit point.*

  ---

  #### **Step 0: Pre-Screen for Jurisdiction**  
  *Question:* Does the allegation describe *fabrication, falsification, plagiarism, or serious ethical violation* in research?  
  - **Sufficient:** Description matches institutional definitions of misconduct.  
  - **Insufficient:** Allegation concerns authorship disputes, harassment (refer to HR), or honest error.  
  *Exit:* → **"No basis" close** if insufficient.  
  *Philosophy note:* Both camps agree testimony must be *relevant*; this step filters scope, not truth.

  ---

  #### **Step 1: Assess Informant Reliability**  
  *Goal: Identify undercutting defeaters (reasons the informant may be unreliable in this context).*  
  *Questions:*  
  1. **Identifiability:** Is the informant named and contactable?  
     - *Anonymous claims proceed but require stronger corroboration (Step 3).*  
  2. **Position to Know:** Could the informant directly observe/fact-check the alleged event?  
     - *Examples:* Lab member for data collection; co-author for manuscript drafting.  
     - *Exclusion:* Hearsay (e.g., "I heard from a colleague").  
  3. **Undercutting Defeaters (UDs):** Any evidence suggesting the informant might misinterpret or misrepresent?  
     - *UD Examples:*  
       - *Conflict of Interest:* Financial stake, ongoing grievance against accused, rivalry.  
       - *Competence Gap:* No training in relevant methods (e.g., non-scientist judging statistics).  
       - *Contextual Impairment:* High stress during the event, language barriers.  
       - *Prior False Allegations:* Verified history of dishonesty in similar contexts.  
     - *Not UDs:* Personal dislike of accused, whistleblower incentives, or unverified rumors.  

  *Decision Tree:*  
  - **UD present** → Proceed to Step 3 (corroboration needed to overcome).  
  - **No UD + Identifiable + Position to Know** → Proceed to Step 2.  
  - **Anonymous or No Position to Know** → Proceed to Step 3 (requires corroboration).  

  ---

  #### **Step 2: Evaluate Testimonial Content**  
  *Goal: Check internal coherence and identify rebutting defeaters (evidence contradicting the claim).*  
  *Questions:*  
  1. **Specificity:** Does the testimony include verifiable details?  
     - *Sufficient:* Methods used, location, time, specific figures/data.  
     - *Insufficient:* Vague assertions (e.g., "data was faked").  
  2. **Internal Consistency/Plausibility:**  
     - Are details logically compatible?  
     - Does the claim align with known research practices? (e.g., "PI ordered reruns until p<0.05" is plausible; "AI generated survey responses in 2010" is not).  
  3. **Rebutting Defeaters (RDs):** Independent evidence contradicting the claim.  
     - *RD Examples:*  
       - Timestamped records showing accused was on leave during alleged event.  
       - Original data files proving no duplication in questioned images.  
       - Peer-reviewed replication supporting accused’s findings.  
     - *Not RDs:* Accused’s denial, character references, or general reputation.  

  *Decision Tree:*  
  - **RD present** → → **"No basis" close** (unless rebutted by Step 3 corroboration).  
  - **Insufficient specificity** → → **"Seek corroboration first" hold** (request specifics from informant).  
  - **No RD + Sufficient specificity + Plausible** → Proceed to Step 3.  

  ---

  #### **Step 3: Corroboration Ladder**  
  *Goal: Assign weight to independent evidence supporting the claim.*  
  *Hierarchy (strongest to weakest):*  
  - **Strong:** Physical/digital evidence directly proving the claim (e.g., draft images showing duplication, audit logs of data manipulation).  
  - **Moderate:**  
    - *Independent witness:* Another person with first-hand knowledge confirming *key elements* (e.g., "I saw the PI manipulate those images" from a separate lab member).  
    - *Pattern evidence:* Prior verified allegations against the accused with similar methods.  
  - **Weak:**  
    - Contextual support (e.g., lab records placing informant at the scene).  
    - Partial documentary trails (e.g., emails alluding to "problematic data" without specifics).  
  - **Not Corroboration:**  
    - Secondhand rumors.  
    - Redundant testimony (e.g., two people repeating the same hearsay).  
    - General character endorsements (e.g., "the informant is honest").  

  *Decision Tree (combines Steps 1-3):*  
  | Condition                          | Outcome                     |  
  |------------------------------------|-----------------------------|  
  | **No UD/RD + Identifiable + Strong/Moderate corroboration** | → **Open formal inquiry** |  
  | **No UD/RD + Identifiable + Weak corroboration**          | → **Open formal inquiry** |  
  | **No UD/RD + Identifiable + No corroboration**            | → **"Seek corroboration first" hold** (attempt to find weak+) |  
  | **Anonymous + Strong corroboration**                      | → **Open formal inquiry** |  
  | **Anonymous + Moderate/Weak corroboration**               | → **"Seek corroboration first" hold** (request identification) |  
  | **Anonymous + No corroboration**                          | → **"No basis" close**     |  
  | **UD present + Strong corroboration**                     | → **Open formal inquiry** |  
  | **UD present + Moderate corroboration**                   | → **Director referral** (Step 4) |  
  | **UD present + Weak/No corroboration**                    | → **"No basis" close**     |  

  *Philosophy reconciliation:*  
  - **Anti-reductionist win:** Weak corroboration suffices for identified informants without defeaters (default credibility honored).  
  - **Reductionist win:** UDs or anonymity require corroboration; no-corroboration cases are held/closed (independent verification prioritized).  
  - **Shared ground:** Both accept that RDs defeat testimony and strong corroboration overcomes UDs.

  ---

  #### **Step 4: Institutional Values Referral**  
  *Goal: Elevate non-epistemic decisions to the director.*  
  *Questions:*  
  1. **Proportionality:** Would investigation cause *exceptional, disproportionate harm*?  
     - *Examples:* Shutting down a clinical trial affecting patients; targeting an early-career researcher for minor offense.  
  2. **Complainant Protection:** Is there high risk of retaliation?  
     - *Note:* Risk alone doesn’t block inquiry but may alter methods.  
  3. **Resource/Scope Threshold:** Does the allegation fall below institutional severity benchmarks?  

  *Handoff:* → **Director’s discretion** if any answer is "yes."  
  *Philosophy note:* Values-based tradeoffs fall outside epistemology; both camps defer to institutional judgment.

  ---

  ### Case Applications

  #### **Case 1: Named Former Lab Member Alleges Image Duplication**  
  - Step 0: Falsification → Proceed.  
  - Step 1: Identifiable, position to know (lab member), no UD.  
  - Step 2: Specific (2019 paper), plausible, no RD.  
  - Step 3: No corroboration → **"Seek corroboration first" hold**.  
    - *Action:* Request informant pinpoint duplicated images; check if HR records place them in the lab in 2019 (weak corroboration). If obtained → Open inquiry.  
    *Why both agree:* Anti-reductionist accepts testimony but reductionist requires corroboration; compromise via hold.

  #### **Case 2: Anonymous Email Alleges Survey Fabrication**  
  - Step 0: Fabrication → Proceed.  
  - Step 1: Anonymous → Proceed to Step 3.  
  - Step 2: Vague, but non-public detail → Moderate specificity? Insufficient alone.  
  - Step 3: Non-public detail = weak corroboration (supports access, not truth).  
  - Outcome: Anonymous + weak corroboration → **"Seek corroboration first" hold**.  
    - *Action:* Reply to email requesting specific data rows/participant IDs and identification. If unresponsive → Close.  
    *Why both agree:* Anti-reductionist credits the detail but reductionist demands stronger support for anonymity.

  #### **Case 3: Unwanted "Open" Recommendation**  
  - *Scenario:* Identified complainant with prior grievance against popular PI. Alleges data falsification. Specific, consistent, no RD. UD = grievance (motive to lie). Weak corroboration (anomalies in data logs).  
  - Procedure:  
    - Step 1: UD present (grievance) → Step 3.  
    - Step 3: UD + weak corroboration → **"No basis" close**.  
      *Unless...* Corroboration upgraded: If data anomalies are *inexplicable without misconduct* (moderate), then → **Director referral** for proportionality review.  
  - **Handling Distrust Temptation:**  
    - Investigators may confuse personal dislike of complainant with UD. Procedure prevents this by:  
      - Requiring *evidence-based* UDs (e.g., grievance must be documented and directly relevant).  
      - Forbidding "sincerity cues" (e.g., "they seemed resentful") as defeaters.  
      - Mandating Step 3 corroboration to offset UDs.  
    *Why both agree:* Reductionists get independent verification; anti-reductionists get objective defeater standards.

  ---

  ### What the Procedure Cannot Do  
  1. **Sincerity ≠ Truth:** Uses demeanor (calmness, detail) to assess competence in Step 1, but explicitly *excludes* these as truth indicators. A poised liar passes; a nervous truth-teller fails.  
  2. **Corroboration Gaps:** Cannot resolve "he-said-she-said" conflicts without independent evidence. Epistemology offers no tool to weigh contradictory testimony.  
  3. **Unfalsifiable Claims:** Allegations lacking verifiable details (e.g., "the PI faked all data") stall at Step 2 regardless of philosophical stance.  
  4. **Moral Risks:** Cannot quantify "proportional harm" (Step 4)—this remains a values call.  
  5. **Certainty Illusion:** Outputs binary decisions (open/close), not probabilities. A "close" recommendation doesn’t mean misconduct didn’t occur; it means insufficient *actionable* evidence.  

  This procedure transforms testimony theory into auditable steps. It respects both camps by:  
  - Defaulting to credibility when defeaters are absent (anti-reductionism),  
  - Requiring corroboration for high-risk cases (reductionism), and  
  - Using defeater/corroboration thresholds to force objectivity.  
  Director oversight at Step 4 ensures institutional values temper epistemological purity.
