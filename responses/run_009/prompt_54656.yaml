     C. Open formal inquiry if:
        - The testimony is from an identified informant in a position to know, with no undercutting or rebutting defeaters, and at least weak corroboration, OR
        - There is strong corroboration even if the informant is anonymous (but note: we still need to know the details of the claim, so if anonymous and vague, we cannot proceed) OR
        - There is an undercutting defeater but it is overcome by strong or moderate corroboration.

     Step 4: Institutional values referral.
        Some factors are not about the epistemic justification but about institutional policy. These must be flagged for the director:
          - The accused is a very prominent researcher and an investigation might cause disproportionate harm even if justified? (But note: we don't want to bias against the prominent.) This is about proportionality: the seriousness of the allegation vs. the harm of investigation.
          - The complaint is about a minor issue that does not meet the threshold for misconduct? (But our procedure assumes the allegation is of misconduct. We might have a filter for that at the very beginning.)
          - The complainant is vulnerable and there is a high risk of retaliation? This might affect how we proceed (e.g., we might take steps to protect the complainant) but not whether we investigate.

