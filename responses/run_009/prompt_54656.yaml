  We are designing an intake procedure that incorporates insights from both reductionist and anti-reductionist perspectives on testimonial justification. The goal is a practical, step-by-step process that both investigators can follow, with explicit decision points and clear criteria.

  Key philosophical considerations:
  - Reductionism (Fricker): Testimony requires independent corroboration or positive reasons to trust the testifier in this context. Without such, we cannot justify moving forward.
  - Anti-reductionism (Coady): Testimony is inherently credible unless there are defeaters. We start by trusting the testifier and only reject if there are reasons to doubt.

  The procedure must balance these by:
  1. Starting with a default of considering testimony as having some weight (anti-reductionist), but requiring checks for defeaters and, in some cases, corroboration (reductionist).
  2. Explicitly defining what counts as a defeater (undercutting or rebutting) and what counts as corroboration.
  3. Having clear exit points for decisions.

  Procedure Structure:
  We'll have a fixed sequence of questions. Each question must be answered based on the information available at intake (typically a written complaint or an initial interview). The procedure will terminate in one of three outcomes:
  - "Open formal inquiry": sufficient grounds to proceed to a full investigation.
  - "Seek corroboration first": hold the file and attempt to gather additional evidence without opening a formal inquiry (e.g., ask the complainant for more details, check internal records).
  - "No basis": close the file without further action.

  Additionally, some questions are about institutional values and must be referred to the director (you) because they involve policy trade-offs.

  Definitions:
  - Undercutting defeaters: reasons to think the informant might not be reliable in this instance (e.g., they were not in a position to know, they have a conflict of interest, they are known to be dishonest in similar matters).
  - Rebutting defeaters: independent evidence that the claim is false (e.g., records that contradict the allegation, a validated alibi).

  Corroboration ladder:
  - Strong corroboration: independent evidence that directly supports the claim (e.g., documents, physical evidence, a second witness who observed the same event independently).
  - Moderate corroboration: independent evidence that indirectly supports the claim (e.g., records showing opportunity, a pattern of similar allegations from independent sources).
  - Weak corroboration: evidence that only supports the credibility of the informant (e.g., a colleague vouching for the informant's honesty, the informant's good track record in similar matters). Note: This does not directly support the claim and thus may not be enough by itself.
  - Not corroboration: a second person repeating the same rumor (hearsay), or evidence that is merely consistent with the claim but does not make it more likely.

  The Procedure:

  Step 1: Assess the informant's basic competence and sincerity (without requiring corroboration).
     Question 1.1: Is the informant identifiable? (Anonymous reports are not automatically rejected, but they require more scrutiny.)
     Question 1.2: Does the informant appear to be in a position to know the facts they allege? (e.g., were they present? Do they have relevant expertise?)
     Question 1.3: Are there any immediate undercutting defeaters? (e.g., obvious bias, conflict of interest, history of false allegations, or evidence of impaired perception/memory at the time?)

     - If 1.1 is "no" (anonymous), proceed to Step 2 but note that the lack of identifiability may be a factor in Step 3.
     - If 1.2 is "no" (not in position to know), then this is an undercutting defeater. The file should be closed ("no basis") unless there is strong corroboration (see Step 3).
     - If 1.3 identifies an undercutting defeater, then the testimony is weakened. The file may be closed if the defeater is strong, or go to Step 3 to see if corroboration overcomes it.

     Note: At this step, we are not yet evaluating the truth of the claim, only the reliability of the testifier in this context.

  Step 2: Evaluate the content of the testimony.
     Question 2.1: Is the testimony sufficiently specific? (e.g., does it include details like time, place, method, and specific actions?)
     Question 2.2: Is the testimony internally consistent and plausible? (Plausibility means it fits with general knowledge of how research is conducted, without requiring proof at this stage.)
     Question 2.3: Are there any rebutting defeaters? (i.e., independent evidence that the claim is false? e.g., the lab notebook shows the experiment was done differently, the data in question were collected when the informant was not present.)

     - If 2.1 is "no", then the testimony is too vague. Outcome: "seek corroboration first" (ask for more specific details) or if that is not possible, "no basis".
     - If 2.2 is "no", then this may be an undercutting defeater (if the inconsistency suggests the informant is not reliable) or a rebutting defeater (if the implausibility is extreme). Outcome: likely "no basis" unless there is strong corroboration.
     - If 2.3 identifies a rebutting defeater, then the file should be closed ("no basis") unless the defeater is weak and there is strong corroboration for the claim.

  Step 3: Consider corroboration and context.
     Question 3.1: Is there any independent corroboration for the claim? (Refer to the corroboration ladder: strong, moderate, weak, or none.)
     Question 3.2: Are there any institutional factors that might affect the decision? (This is where we hand off to the director: e.g., the potential harm of investigation to the accused, the seriousness of the alleged misconduct, the risk of retaliation to the complainant. These are not defeaters but considerations of proportionality and values.)

     Now, we combine the results from Steps 1-3 to make a decision.

     Decision Matrix:

     - If there is a rebutting defeater (Step 2.3): close the file ("no basis") unless the corroboration is strong enough to override it (rare).
     - If there is an undercutting defeater (Step 1.3 or 2.2) and no corroboration: close the file ("no basis").
     - If there is an undercutting defeater but there is strong or moderate corroboration: then the defeater might be overcome. Proceed to the next check.
     - If the testimony is anonymous and there is no corroboration: then we cannot establish the informant's reliability. Outcome: "seek corroboration first" (try to get the informant to identify themselves or provide evidence) or if that fails, "no basis".
     - If the testimony is from an identified informant, in a position to know, with no defeaters, and at least weak corroboration: then we have grounds to open an inquiry. But note:
          - Weak corroboration (e.g., the informant has a good reputation) might not be enough by reductionist standards. Therefore, we require at least weak corroboration to satisfy reductionism, but in the absence of defeaters, anti-reductionism would accept even without. To satisfy both, we set a minimum of weak corroboration for identified informants without defeaters.

     However, to bridge the gap:
     - For an identified informant with no defeaters and no corroboration: anti-reductionism says we can accept. Reductionism says we need independent reasons. Our compromise: we require at least weak corroboration. Why? Because in institutional settings, we must have some minimal independent check. Weak corroboration (e.g., the informant's employment record shows they were present at the time) is often available and not burdensome. If there is no weak corroboration, then we mark as "seek corroboration first" to try to get it.

     - For an identified informant with no defeaters and at least weak corroboration: open formal inquiry.
     - For an identified informant with no defeaters and no corroboration: seek corroboration first (try to find weak corroboration, e.g., check if the informant was indeed in the lab at the time). If that fails, then we must close? But note: anti-reductionism would say we don't need it. However, the procedure requires at least weak corroboration to satisfy the reductionist concern. So if we cannot get any, then we close? Or we note that the institutional context requires more. This is a point of tension.

