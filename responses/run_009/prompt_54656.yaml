          - If there is at least weak corroboration: open formal inquiry.
          - If there is no corroboration: then we have a conflict between the two views. The procedure will say: "seek corroboration first". This is a compromise. We are giving the reductionist the requirement for independent evidence (by seeking it) and the anti-reductionist the default credit (by not closing immediately). We try to get at least weak corroboration. If we can't, then we close? Actually, we have to decide. Let's set: after seeking corroboration, if we get weak or better, then open. If not, then close? But that would be reductionist. Alternatively, we might say that after a failed attempt to get corroboration, we open anyway because the anti-reductionist view allows it. But then the reductionist investigator would object.

     To satisfy both: we note that in the institutional context, the risk of harm from an investigation without any independent support is too high. Therefore, we require at least weak corroboration. If we cannot get it, we close. This is a practical constraint. Both sides can accept that the institution must manage risk.

     Therefore, the decision rules are:

     A. Close the file ("no basis") if:
        - There is a rebutting defeater that cannot be overcome.
        - There is an undercutting defeater and no corroboration (or the corroboration is weak and the defeater is strong).
        - The testimony is anonymous and there is no corroboration and no way to get more information.
        - The testimony is too vague and cannot be clarified.

     B. Hold and seek corroboration first if:
        - The testimony is anonymous and there is no corroboration, but we have a way to contact the informant to ask for more (e.g., an anonymous email that we can reply to).
        - The testimony is from an identified informant with no defeaters but without even weak corroboration (we try to gather weak corroboration, e.g., by checking records to confirm the informant was employed at the time, or asking for any documentation).
