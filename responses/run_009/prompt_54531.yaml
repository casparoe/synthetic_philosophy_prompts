answer: |-
  Here's a systematic translation of key free will arguments into control-theoretic terms, followed by the residue report you requested. The translations expose both illuminating parallels and stubborn incompatibilities.

  **1. Van Inwagen's Consequence Argument (Control-Theoretic Rendering):**  
  - **Premise:** The plant state \( \mathbf{x}(t) \) is fully determined by deterministic laws \( f(\mathbf{x}, \mathbf{u}, \mathbf{d}, t) \) and initial conditions \( \mathbf{x}(t_0) \) (the "distant past").  
  - **Premise:** The controller's output \( \mathbf{u}(t) \) is part of the plant state (i.e., \( \mathbf{u}(t) = g(\mathbf{x}_{\text{controller}}(t)) \), where \( \mathbf{x}_{\text{controller}} \subset \mathbf{x} \)).  
  - **Conclusion:** The "controller" is merely a subsystem *within* the plant loop. Its output \( \mathbf{u}(t) \) is not an independent input but a state-dependent function. Calling this "control" is anthropomorphic misdescription—it's just state evolution.  

  **Strength in Control Vocabulary:**  
  - **Stronger:** The argument becomes crisply technical. It reduces to the claim that *all subsystems are internal to the closed-loop dynamics* under determinism. Controllers are observer-dependent labels for partitioned dynamics.  
  - **Weaker:** Control engineers *routinely* designate subsystems as "controllers" even in fully deterministic systems (e.g., PID controllers). Functionality (reference tracking, disturbance rejection) matters more than metaphysical independence.  

  **2. Alternative Possibilities & Reachability:**  
  - **Incompatibilist Claim:** Holding fixed laws \( f \) and past trajectory \( \mathbf{x}(t \leq t_0) \), the reachable set \( \mathcal{R}(\mathbf{x}(t_0)) \) at decision time \( t_0 \) is a singleton \( \{\mathbf{x}(t_0 + \Delta t)\} \). "Could have done otherwise" is false.  
  - **Compatibilist Relaxation:**  
    - **Classical (e.g., Moore):** Hold fixed laws \( f \) and external inputs \( \mathbf{d}(t \leq t_0) \), but allow the controller's internal state \( \mathbf{x}_c \) to vary (e.g., "if she had *wanted* to"). Expands \( \mathcal{R}(\mathbf{x}(t_0)) \) by treating \( \mathbf{x}_c \) as a free parameter.  
    - **Hierarchical (Frankfurt/Dennett):** Hold fixed \( f \) and \( \mathbf{x}(t \leq t_0) \), but evaluate reachability under a *coarse-grained model* of the controller (e.g., "could have done otherwise *if her higher-order volition had differed*").  

  **Substantive or Verbal Dispute?**  
  - **Verbal:** The core disagreement is about *which state variables count as "fixed"* for the counterfactual. Incompatibilists fix the entire microstate; compatibilists fix a subset (external constraints + laws) while treating controller states as free parameters.  
  - **Substantive:** The dispute reflects deeper disagreement about whether coarse-grained controller states (e.g., "desires") are *legitimate sources of agency* or just deterministic epiphenomena.  

  **3. Frankfurt-Style Hierarchical Compatibilism as Cascaded Loops:**  
  - **Translation:**  
    - **Inner Loop:** Fast, low-level controller (e.g., motor control, impulse responses). Output: actions \( \mathbf{u} \).  
    - **Outer Loop:** Slower, high-level controller generating setpoints \( r_{\text{inner}} \) for the inner loop. Uses an internal model \( \hat{f} \) of the plant *and* inner controller to simulate outcomes.  
    - **"Identification with Desire":** The outer loop's setpoint generator \( r_{\text{inner}} = h(\mathbf{x}_{\text{outer}}) \) corresponds to endorsing a desire. "Free will" occurs when \( r_{\text{inner}} \) is consistent with the outer loop's model-based optimization.  

  **What Philosophers Add:**  
  - **Normative Tuning Criteria:** A "well-tuned" cascade requires:  
    - **Observability:** The outer loop must have a sufficiently accurate model \( \hat{f} \) of inner dynamics (knowing one's own motives).  
    - **Non-Domination:** The outer loop's bandwidth must be compatible with the inner loop's dynamics. If the outer loop overpowers the inner loop (high gain, no feedback), it becomes *suppressive*—e.g., addiction as an outer loop overriding its own setpoints.  
    - **Stability Margin:** "Identification" implies the inner loop tracks \( r_{\text{inner}} \) with minimal error (no persistent oscillations or limit cycles).  
  Philosophy adds the *evaluative standard* for when this structure counts as "free" (e.g., no external model hacking, adequate model fidelity).  

  **4. Pereboom's Manipulation Argument:**  
  - **Designed Controller (Manipulation):** Gains \( K \), internal models \( \hat{f} \), and cost functions \( J \) are set exogenously by neuroscientists.  
  - **Developed Controller (Normal Shaping):** \( K \), \( \hat{f} \), \( J \) emerge from adaptive control via interaction with the plant/environment (e.g., reinforcement learning).  

  **Control-Theoretic Difference?**  
  - **None Structurally:** Both are instances of parameter adaptation. The closed-loop dynamics \( \dot{\mathbf{x}} = f(\mathbf{x}, \mathbf{d}, t; \theta) \) are identical whether \( \theta \) is set by gradient descent or a designer.  
  - **Defect or Finding?**  
    - **Defect:** Control theory lacks a *normative distinction* between "self-acquired" vs. "externally implanted" parameters. It only describes *how* \( \theta \) came to be, not whether it violates "authenticity."  
    - **Finding:** Pereboom's argument *presupposes* this distinction. If control theory cannot capture it, the argument may rely on an illusory boundary between "self" and "environment" in parameter space.  

  **5. Reactive Attitudes as Coupled Agents:**  
  - **Translation:** Agents A and B are coupled dynamical systems.  
    - **Resentment (A→B):** A updates its internal model \( \hat{f}_B \) of B ("B is hostile"), increasing the gain \( K_A \) on defensive actions. This alters B's input \( \mathbf{d}_B \).  
    - **Forgiveness:** A recalibrates \( \hat{f}_B \) ("B was coerced"), reducing \( K_A \) and changing B's operating point.  
    - **Function:** Not a "verdict" but *adaptive feedback* that reshapes the coupled system's equilibria. Blame/praise are disturbance inputs regulating social coordination.  

  ---

  ### Residue Report  
  **Clean Translations:**  
  1. **Determinism & Controller Authority:** Van Inwagen's argument maps precisely to the absorption of the controller into plant dynamics.  
  2. **Hierarchical Control:** Frankfurt/Dennett-style compatibilism is essentially cascaded control with model-based setpoint generation.  
  3. **Reactive Attitudes:** Strawsonian attitudes function as adaptive feedback in multi-agent systems.  

  **Translations with Distortion:**  
  1. **Alternative Possibilities:**  
     - *Bent Element:* Philosophers treat "could have done otherwise" as a *modal* property; control theory treats it as a *reachability* property under specified constraints. The distortion arises in defining which constraints are "relevant," which is normative.  
  2. **Manipulation vs. Development:**  
     - *Bent Element:* Control theory flattens the history of parameter acquisition. Pereboom's moral distinction requires bending "authenticity" into a stability property (e.g., Lyapunov functions for identity over time), which doesn't fully hold.  

  **No Expression in Control Vocabulary:**  
  1. **Ultimate Sourcehood:**  
     - Incompatibilists demand a controller whose state \( \mathbf{x}_c \) is *uncaused* by prior states. Control theory has no concept of an *ex nihilo* state transition; all dynamics are \( \dot{\mathbf{x}} = f(\mathbf{x}, \ldots) \).  
     - **Your Insight is Correct:** "Ultimate sourcehood" is indeed a dispute about loop boundaries. Incompatibilism insists that *any* controller boundary is artificial because the *entire system* (including boundary definitions) is part of a deterministic plant. Control theory confirms this: boundaries are pragmatic, not ontologically fundamental.  

  2. **Ought-Implies-Can:**  
     - **Partial Translation:** Maps to *feasibility constraints* in optimal control (e.g., \( \min J \) subject to \( \mathbf{u} \in \mathcal{U} \), where \( \mathcal{U} \) is the set of admissible controls).  
     - **Residue:** The *normative force* of "ought" has no counterpart. Control theory can ensure \( \mathbf{u}^* \) is feasible but cannot say why you *should* implement it rather than a suboptimal \( \mathbf{u} \). This is external to dynamics.  

  3. **Non-Physical Agency:**  
     - Concepts like "agent-causation" (where the self causes acts without prior states) are irreducibly non-dynamical. No \( f(\cdot) \) can represent uncaused causation.  

  **Honest Assessment of the Residue:**  
  - **Where Philosophy is Less Well-Posed:**  
    - "Ultimate sourcehood" is a category error. In dynamical systems, *all* sources are relative to a chosen subsystem boundary. Demanding a source "outside the loop" is like demanding a transfer function without a block diagram.  
    - Manipulation arguments often conflate *structural identicality* with *moral equivalence*. Control theory exposes this by showing identical \( f(\cdot) \) can arise from different histories.  
  - **Where Control Theory is Deficient:**  
    - It lacks semantics for *normativity* ("ought") and *phenomenology* (what it feels like to be the outer loop setting a setpoint). These are not dynamical properties but first-person experiences.  
    - It cannot model *truly stochastic* agency (e.g., quantum indeterminacy) without treating randomness as just another disturbance input \( \mathbf{d}(t) \).  

  **Conclusion:**  
  ~80% of the free will debate reduces to:  
  - Disputes about where to draw the controller/plant boundary (e.g., is the outer loop part of "the system" or the "agent"?),  
  - Verbal disagreements about which counterfactual perturbations are meaningful,  
  - And whether functional descriptions (tracking error minimization) suffice for agency.  
  The residue (normativity, phenomenology, ultimacy) is either philosophically suspect or outside dynamical modeling. **Your vocabulary doesn't resolve the debate but clarifies that its core is engineering, not metaphysics: agency is how well-tuned subsystems generate robust trajectories in coupled systems.**  

  **Recommendation:** Use this framing to build better autonomous systems. Hierarchical control with model-based setpoint generation *is* compatibilist free will in practice—and it’s all you need for functional agency. The incompatibilist’s "ultimate control" is a phantom.
