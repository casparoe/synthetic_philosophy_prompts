  #### **Appendix B: Precedent Cards**  
  *Print 3 per commission per group (blue for stratigraphy, green for history).*  

  **B1: Stratigraphy Precedents (Blue)**  
  1. **Holocene GSSP (2008)**: *Boundary*: 11,700 yr ago. *Marker*: Oxygen isotope shift in Greenland ice core. *Rule*: "Boundary defined by a single, globally correlative marker in one reference section."  
  2. **Cretaceous-Paleogene (1991)**: *Boundary*: 66 MYA. *Marker*: Iridium layer from asteroid in Tunisian rock. *Rule*: "Marker must be synchronous (global within error margins)."  
  3. **Anthropocene Working Group (2019)**: *Boundary*: Proposed 1950. *Marker*: Radionuclides in Crawford Lake sediment. *Rule*: "Reject diachronous markers (e.g., agriculture)."  

  **B2: History Precedents (Green)**  
  1. **Industrial Revolution**: *Start*: 1784. *Event*: Watt patents steam engine. *Rule*: "Periods begin with transformative inventions, even if impacts diffuse gradually."  
  2. **Columbian Exchange**: *Start*: 1492. *Event*: Columbus’s voyage. *Rule*: "Anchors can be symbolic events; impacts need not be immediate or global."  
  3. **Great Acceleration**: *Start*: 1950. *Event*: Post-WWII economic surge. *Rule*: "Periods reflect systemic shifts, not isolated events."  

  #### **Appendix C: Role Cards**  
  *Print 1 set per group (7 cards).*  
  - **Chair**: “You enforce rules and time. Ensure everyone speaks. Start votes.”  
  - **Recorder**: “Take notes on: (1) Evidence used, (2) Precedent cited, (3) Minority statement.”  
  - **Commissioner ×5**: “Argue for a start date using evidence and precedents. Vote honestly.”  

  #### **Appendix D: Rules & Voting Sheets**  
  *Print 1 per commission per group.*  

  **Stratigraphy Rules**  
  - “You are the *Geological Time Commission*. Define the Anthropocene start by:  
    - Selecting **ONE** evidence card with a *global, physical marker* in a single location (e.g., ice core, rock layer).  
    - Citing **ONE** precedent to justify.  
  - Voting: Requires **5/7 YES votes**. Dissenters write a minority statement. Time: 20 min.”  

  **History Rules**  
  - “You are the *History & Heritage Council*. Define the Anthropocene start by:  
    - Choosing a **DATE** tied to an *event* (e.g., invention, voyage). Multiple evidence cards allowed.  
    - Citing **ONE** precedent to justify.  
  - Voting: **4/7 YES votes** wins. Any dissenter can write a minority statement. Time: 15 min.”  

  **Voting Sheet** (Blank template)  
  ```  
  Commission: ___________________  
  Proposed Start Date: __________  
  Evidence/Event: _______________  
  Precedent Cited: ______________  
  Vote: YES / NO / ABSTAIN (circle)  
  [ ] Minority statement: __________________________  
  ```  

  ---  
  **Rationale for Discarded Concept**: "Epochal Negotiation" was rejected because collapsing both commissions into one blurred the structural contrast. Students would likely default to evidence-based arguing rather than feeling rules *force* different outcomes. The dual-commission design weaponizes cognitive dissonance—when students cite the Orbis Spike in history but reject it in stratigraphy, they viscerally grasp underdetermination.  

  Run this as-is: it primes students to see scientific controversies as battles over *procedural legitimacy*, not just facts. When they groan, “But 1784 doesn’t work for stratigraphy!”—the penny has dropped.
