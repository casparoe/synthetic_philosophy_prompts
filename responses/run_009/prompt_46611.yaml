prompt: |-
  You are an experienced instructional designer with a foot in two worlds: you spent a decade running undergraduate seminars in philosophy of science, and you have worked alongside Quaternary geologists on how formal time units actually get defined and ratified. You are also unusually good at designing classroom activities in which the structure of the exercise, rather than anything the facilitator says, delivers the lesson.

  I teach an upper-level seminar called Deep Time and the Present — 14 students, mostly philosophy and environmental studies majors, one 90-minute session. Next week's topic is the Anthropocene: when this putative epoch is supposed to have started, and who is entitled to decide that. I do not want a debate about whether the Anthropocene is "real." I want an activity in which students run into, first-hand, the fact that the start date of a historical period is not lying in the sediment waiting to be found, but comes out differently depending on who is asking, for what purpose, and under which rules. The penny I want them to drop is this: "when did it start" is underdetermined until "who decides, and in order to do what" is fixed — and the choice of decider is itself a decision with stakes, not a neutral delegation to expertise.

  Design the activity. It must meet the following requirements:

  1. At least two rounds in which the same body of evidence is processed by two differently constituted commissions with different mandates and different decision rules — for instance, a stratigraphy-style body that must pin the boundary to a marker in a single physical reference section and a dated layer, versus a history- or heritage-style body that is permitted to anchor a period to an event. The same students should sit on both, so the contrast is felt personally rather than observed. The evidence base should be a deck of evidence cards you write yourself: plausible signals such as a radionuclide layer, a CO2 curve, shifts in pollen and domesticated-animal bone assemblages, concrete and plastics in sediment, and a colonial-era land-use signal. Use real anchors where you are confident of them (for example, the convention that "radiocarbon present" is fixed at 1950, or the mid-twentieth-century bomb spike), and explicitly flag anything you invent.

  2. A precedent mechanic: each commission receives a short list of its own past rulings (which you also write) and must justify any new decision by citing one. This is where students should discover that consistency does a great deal of the work that evidence appears to do — the candidate start dates you build in (consider using roughly 1610, 1784, and 1950, or your own set) should be sortable according to which precedent each commission naturally reaches for.

  3. A voting rule with teeth — supermajority thresholds, abstentions, a written minority statement — so that "who decides" shows up procedurally, not just rhetorically.

  4. A minute-by-minute timeline for the 90 minutes, a materials list containing nothing exotic, and role cards if roles are needed.

  5. A debrief that maps specific moments in the activity onto the conceptual distinctions: empirical onset-detection questions versus the classificatory decision; periodization as interest-relative; the difference between "the Anthropocene is real" and "the Anthropocene is a useful unit for purpose X"; and what was at stake in each commission's jurisdictional claim to be the one deciding.

  6. An honest section on what will predictably go wrong the first time I run it — students treating it as a quiz with a right answer, the two rounds collapsing into the same date anyway, a dominant student steamrolling the vote — and how to handle each failure mode.

  7. An equally honest note on which feature of the real controversy the activity cannot reproduce and I must supply myself: for example, the years of fieldwork behind real stratigraphic evidence, the formal constitutional rules that constrain real scientific bodies, or the political weight of actual ratification. Pick what is genuinely true of your design and tell me what I should say, and when, to patch the gap.

  Before writing the final design, think it through carefully: brainstorm at least two distinct activity concepts, select the one that best makes the underdetermination show up in the rules and incentives rather than in the debrief, and close with a few sentences noting what you discarded and why. Aim for something I can run from your write-up alone, with no web access, no further reading, and no preparation beyond printing a few pages.
reasoning: |-
  We are designing a 90-minute seminar activity on the Anthropocene start date controversy. The goal is for students to experience how the start date is underdetermined by evidence and depends on who decides, for what purpose, and under which rules.

  Key requirements:
  - Two rounds with different commissions: one stratigraphy-style (must pin boundary to a marker in a single physical reference section and a dated layer) and one history/heritage-style (can anchor to an event).
  - Same students on both commissions to feel the contrast.
  - Evidence cards: real signals (like radionuclide layer, CO2 curve, etc.) and invented ones flagged.
  - Precedent mechanic: each commission has past rulings and must cite one to justify the decision.
  - Voting rule with teeth (supermajority, minority statement, etc.).
  - Debrief mapping activity to concepts.
  - Predictable problems and how to handle.
  - Note on what the activity cannot reproduce and what the instructor must supply.

  Brainstorming two distinct concepts:

  Concept 1: "Commission Simulation"
  - Two commissions: (A) International Commission on Stratigraphy (ICS)-style and (B) a Historical Periodization Council (HPC). 
  - Round 1: Commission A (stratigraphy) must choose a Global Boundary Stratotype Section and Point (GSSP) using the evidence cards. They must pick one site and one marker (like a golden spike) and a date. They have precedents from past epoch definitions (e.g., Holocene GSSP in Greenland ice core, Quaternary GSSP in marine sediment).
  - Round 2: Same students as Commission B (history/heritage) must choose a start date for the Anthropocene as a historical period. They can use events (e.g., Industrial Revolution, Columbian Exchange) and have precedents from historical periodization (e.g., start of the Renaissance, the Atomic Age). 
  - Evidence cards are the same for both but each commission has different precedents.

  Concept 2: "Time Period Negotiation"
  - Instead of two separate commissions, the same group is asked to make two different decisions: one as geologists and one as historians. But to keep the structure, we might still have two rounds with different rules.
  - Alternatively, we could have two simultaneous groups, but the requirement is the same students in both, so sequential is better.

  I choose Concept 1 because it clearly separates the two decision-making contexts and allows for the same students to experience the shift in perspective.

  Now, let's design the activity in detail.

  ---

  **Activity Title:** Defining the Anthropocene: Two Commissions, Two Logics

  **Learning Objective:** Students will experience how the start of a historical period is underdetermined by evidence and depends on the decision-making body's mandate, precedents, and rules.

  **Materials:**
  1. Evidence cards (one set per commission, same for both rounds). Each card has a short description and a date (or date range) for the signal. We'll have about 10-12 cards. We'll use real signals where possible and flag invented ones.
  2. Precedent cards (two sets: one for the stratigraphy commission and one for the history commission). Each set has 3-4 past rulings.
  3. Role cards (optional, but since we want the commissions to have a chair and perhaps a rapporteur, we can assign roles).
  4. Voting ballots (for each commission round) and a template for the minority statement.
  5. Timer.
  6. Whiteboard or flip chart to record decisions.

  **Evidence Cards (examples):**
  1. **Radionuclide layer (plutonium-239, etc.) from atmospheric nuclear tests:** First appears in 1945, peaks in 1963 (Partial Test Ban Treaty). *Real and well-documented.*
  2. **CO2 curve from ice cores:** Shows steady rise from about 1850, but a sharp acceleration post-1950. *Real.*
  3. **Shift in pollen assemblages in North America:** Indicates deforestation and agriculture, starting around 1650-1700 in eastern North America. *Real, but regional.*
  4. **Domesticated animal bones in European archaeological sites:** Increase in chicken and cattle bones, starting around 1500-1600. *Real, but regional.*
  5. **Concrete and plastics in sediment:** First appearance of concrete fragments in river sediments (early 20th century) and plastic particles (post-1950). *Real.*
  6. **Colonial-era land-use signal in South America:** Charcoal and pollen evidence of deforestation and plantation agriculture, starting around 1550-1650. *Real, but regional.*
  7. **Lead pollution in Greenland ice:** Traces of lead smelting from ancient Rome and then again from the Industrial Revolution, but a global spike in lead from leaded gasoline (1920s-1970s). *Real.*
  8. **Nitrogen and phosphorus in lake sediments:** From fertilizer use, starting around 1950. *Real.*
  9. **Bomb spike in radiocarbon (C-14):** Sharp increase in atmospheric C-14 from nuclear tests, peaks in 1964. *Real, with the convention that "pre-bomb" is before 1950.*
  10. **Microplastic particles in marine sediments:** First appearance in 1950s, exponential increase. *Real.*
  11. **Invention of the steam engine (event):** 1784, James Watt patents the steam engine. *Real event, but note: this is not a stratigraphic marker but an event.*
  12. **Columbian Exchange (event):** 1492 onwards, but a key signal is the Orbis Spike (1610) in atmospheric CO2 from reforestation in the Americas due to population collapse. *The event is real, the Orbis Spike is a proposed marker (real science) but not ratified.*

  *Note: We have a mix of global and regional signals, and events. We'll flag that for the stratigraphy commission, they need a global marker, so regional ones are less ideal. Also, we include two event cards (11 and 12) to nudge the history commission.*

  **Precedent Cards:**

  For the Stratigraphy Commission (ICS-style):
  1. **Holocene GSSP:** Defined in the NGRIP ice core (Greenland) at 11,700 years before 2000, marked by a shift in deuterium (climate warming). *Rule: Must have a global correlation, and the marker must be in a single reference section.*
  2. **Quaternary GSSP:** Defined in marine sediments at 2.58 million years ago, marked by the appearance of cold-water foraminifera and the Gauss-Matuyama magnetic reversal. *Rule: Boundary must be tied to a physical marker in a specific rock layer.*
  3. **Cretaceous-Paleogene boundary:** Defined at a site in El Kef, Tunisia, marked by iridium layer (from asteroid impact) and mass extinction of plankton. *Rule: The marker must be globally identifiable and synchronous.*

  For the History Commission (HPC-style):
  1. **The Renaissance:** Period start set at 1401 (Florentine artists) or 1453 (fall of Constantinople) — but note, multiple start dates exist. *Rule: Periods can be anchored to key events, and the choice reflects cultural significance.*
  2. **The Industrial Revolution:** Often set at 1760 (beginning in Britain) or 1784 (Watt's steam engine). *Rule: The start can be tied to a transformative invention or event.*
  3. **The Atomic Age:** Set at 1945 (Trinity test and Hiroshima). *Rule: Periods can begin with a single symbolic event.*
  4. **The Anthropocene (as an informal term):** In popular usage, sometimes tied to the first nuclear test (1945) or the Industrial Revolution. *Rule: The start may reflect human awareness and cultural narratives.*

  **Structure of the Activity (90 minutes):**

  **0-5 min: Introduction (Instructor)**
  - Frame the activity: "Today we are going to simulate how different bodies might define the start of the Anthropocene. You will serve on two commissions, each with a different mandate and rules. Your job is to reach a decision in each round. Remember, we are not debating whether the Anthropocene is real, but how we set its start date."

  **5-15 min: Setup and Commission A (Stratigraphy)**
  - Divide the class into two groups of 7 (or if 14, two groups of 7, but note: same students in both commissions, so we do Round 1 with Commission A for Group 1 and Commission B for Group 2? Wait, no: the requirement is the same students sit on both. But we have two rounds? We can do:
    - Round 1: All students are Commission A (stratigraphy) and deliberate together? But 14 is too big for a single deliberation. So split into two groups of 7. Each group will have two rounds: first as Commission A (stratigraphy) and then as Commission B (history). But the evidence and precedents change per round? Actually, we want the same evidence for both rounds, but the mandate changes.

    Alternative: We have two commissions (Group 1 and Group 2) but each group does both rounds? That would take too long. Instead, we can have:

    - The class is one commission for Round 1 (stratigraphy) and then the same class as one commission for Round 2 (history). But 14 is large, so we need to structure the discussion.

    Let's adjust: We break into two groups of 7. In Round 1, both groups are acting as the Stratigraphy Commission (so they each deliberate and come to a decision). Then in Round 2, both groups become the History Commission. But we want the contrast to be felt by the same students, so that's okay. The problem is that we have two groups and they might come to different decisions in Round 1, which is fine because it shows variability. But the activity might run long.

    Alternatively, we do the whole class as one commission for Round 1 and then one for Round 2, but we assign roles (e.g., chair, timekeeper, etc.) to manage the large group.

    Given time constraints and the requirement for voting, I think splitting into two groups of 7 is better. Each group will have two rounds (stratigraphy then history) and the instructor circulates. We'll have to time it tightly.

    Revised timeline:

    - 5-15 min: Setup and assign groups. Each group gets a packet for Commission A (stratigraphy): evidence cards, precedent cards, and rules. They have 10 minutes to deliberate and vote.

    - 15-25 min: Commission A (stratigraphy) deliberation and vote in groups.

    - 25-30 min: Report out: each group shares their decision and the key reasons.

    - 30-40 min: Switch to Commission B (history) for each group. They get a new packet (same evidence cards, but different precedent cards and rules). They deliberate for 10 minutes.

    - 40-50 min: Commission B deliberation and vote.

    - 50-55 min: Report out.

    Then debrief.

    But we have 90 minutes, so:

    0-5: Intro
    5-15: Commission A deliberation (10 min)
    15-20: Commission A vote and record (5 min) [Note: voting must be done within the 10 min? Let's adjust]

    Actually, let's extend:

    **Detailed Timeline:**

    0-5 min: Introduction and group setup (split into two groups of 7, each in a separate area). Assign roles in each group: Chair (moderates), Rapporteur (takes notes), and the rest are Commissioners. Rotate roles if needed, but for time, assign once.

    5-25 min: **Round 1: Stratigraphy Commission (20 minutes)**
      - Each group receives:
          - Set of evidence cards (same for both groups)
          - Precedent cards for stratigraphy (3-4 cards)
          - Rules of Procedure: 
              - Must define the boundary by selecting one evidence card that provides a Global Boundary Stratotype Section and Point (GSSP). The GSSP must be a physical marker in a specific location (they can choose a location, but for simplicity, the card represents the marker and its date).
              - The decision must be justified by citing one precedent.
              - Voting rule: 5 out of 7 must agree (supermajority). If not, the group must write a minority statement (by the dissenters) and the majority decision stands but is noted as contested.
          - The Chair leads the discussion, the Rapporteur records the decision and justification.
      - Groups deliberate for 15 minutes and then vote in the last 5 minutes.

    25-30 min: **Report out Round 1** (5 minutes total, 2.5 min per group): Each group's Rapporteur shares the chosen start date, the evidence card used, and the precedent cited.

    30-50 min: **Round 2: History Commission (20 minutes)**
      - Same groups, same roles, but now they are a History and Heritage Commission.
      - They receive:
          - Same set of evidence cards (but they can use them differently)
          - Precedent cards for history (3-4 cards)
          - Rules of Procedure:
              - Must define the start of the Anthropocene as a historical period by choosing a specific year or event (they can use an event from an evidence card or an event mentioned in a card).
              - They must cite one precedent to justify.
              - Voting rule: Simple majority (4 out of 7) but any dissenter can write a minority statement.
          - Deliberate for 15 minutes, vote in the last 5.

    50-55 min: **Report out Round 2** (5 minutes): Each group shares their decision and justification.

    55-90 min: **Debrief (35 minutes)** - Instructor-led discussion.

  **Voting Procedure:**
  - In each round, after deliberation, the Chair calls for a vote. Each member votes "yes" for a proposed start date (which must be specified by the group) or "abstain". 
  - For Round 1 (stratigraphy): requires 5 "yes" votes (out of 7). If the proposal fails, the group must either modify the proposal and revote (within the time) or, if time runs out, the majority proposal is recorded but marked as not having a supermajority. Dissenters can write a minority statement (one sentence) explaining why they disagree.
  - For Round 2 (history): requires 4 "yes" votes. Minority statement option for any dissenter.

  **Predictable Problems and Solutions:**

  1. **Students treating it as a quiz with a right answer:** 
     - Problem: They might think one date is "correct" and argue based on that, rather than the commission's rules.
     - Solution: In the introduction, stress that the goal is to follow the rules of the commission they are in, not to find the "real" start. Remind during the activity.

  2. **The two rounds collapsing into the same date:**
     - Problem: Students might ignore the different mandates and pick the same date in both rounds.
     - Solution: The precedent cards and rules are designed to push them in different directions. Also, in the debrief, if it happens, point out that the same evidence led to the same conclusion despite different rules, and ask: "Was the decision rule followed? Did the history commission consider events that the stratigraphy commission couldn't use?"

  3. **Dominant student steamrolling:**
     - Problem: One student might dominate the discussion or the vote.
     - Solution: Assigning roles (Chair is responsible for ensuring everyone speaks) and using structured voting helps. Also, the minority statement gives dissenters a voice.

  4. **Time overrun:**
     - Problem: 20 minutes per round might be tight.
     - Solution: Keep strict time and remind groups when they have 5 minutes left. If a group hasn't reached a decision by the vote time, they must vote on the leading proposal and record the outcome as contested.

  **What the Activity Cannot Reproduce:**
  - The activity cannot reproduce the years of fieldwork and complex scientific analysis that go into real stratigraphic markers. The evidence cards are simplified and presented as given. Also, the real process of ratifying a geological time unit involves multiple committees and years of review, which we compress into 20 minutes.

  - **What the instructor should say:** During the debrief, note: "In the real world, defining a GSSP requires extensive fieldwork to identify a marker that is globally detectable and can be found in a well-preserved, accessible section. Our evidence cards are summaries of complex data. Moreover, the real ICS process involves multiple stages of voting and review by the International Union of Geological Sciences, which we've simplified. The point of the activity was to highlight the decision-making logic, not to simulate the full scientific process."

  **Debrief Plan (35 minutes):**

  1. **Reflection on the process (5 min):** 
     - Ask: "How did your group's decision in the stratigraphy round differ from the history round? What was the most challenging part of each?"

  2. **Mapping to concepts (15 min):**
     - Empirical vs. classificatory: "In the stratigraphy round, what evidence was considered? Was the focus on detecting a global marker? In the history round, what kinds of evidence were more compelling? How did the rules shape what counted as good evidence?"
     - Interest-relativity: "How did the mandate and precedents of each commission reflect different interests? For stratigraphy, what was the interest? (e.g., global correlation for scientific communication) For history? (e.g., cultural significance or narrative coherence)"
     - "The Anthropocene is real" vs. "useful for purpose X": "Did your commission's decision imply that the Anthropocene is real? Or that it is a useful unit for a particular purpose? How did the voting rules affect the legitimacy of the decision?"

  3. **Stakes and jurisdiction (10 min):**
     - "What was at stake in each commission's claim to be the one deciding? Why might it matter whether the Anthropocene is defined by geologists or historians? How did the voting rules (supermajority vs. majority) affect the perceived legitimacy of the decision?"

  4. **Connecting to the real world (5 min):**
     - "In the actual Anthropocene Working Group, both stratigraphic and historical considerations are in play, but the official process (through the ICS) requires a stratigraphic definition. How does our activity help us understand the controversy over the start date (e.g., 1610 vs. 1950)?"

  **Materials to Prepare:**
  - Evidence cards (12 cards, one set per group, same for both rounds). Print two sets (one for each group). Each card has a title, description, and date (or date range). Flag any invented content (in our list, we have real signals, but note that the Columbian Exchange card uses the Orbis Spike proposal, which is not ratified, so we can say: "Proposed marker: Orbis Spike (1610)" and note in the instructor's notes that it's a proposal).
  - Precedent cards: Two sets per group (one for stratigraphy, one for history). Each set has 3-4 cards. Print on different colored paper or mark clearly.
  - Rules of Procedure: Two sheets per group (one for each round).
  - Role cards: Chair, Rapporteur, Commissioners (optional, but helpful).
  - Voting ballots and minority statement sheets (blank paper is fine).
  - Timer.

  **Final Note:**
  This design emphasizes the decision rules and precedents to make the underdetermination apparent. The evidence cards are designed so that different commissions will be drawn to different dates: stratigraphy to a global, synchronous marker (like radionuclides) and history to an event (like the Industrial Revolution). The precedents reinforce this.

  Discarded idea: A single commission that changes mandate mid-deliberation. That might be confusing and doesn't allow for a clean contrast. Also, having two separate groups for the two commissions would not let the same students experience both, so we did sequential rounds for the same group.

  Let me know if you need more details on the evidence or precedent cards.
answer: |-
  ### Deep Time and the Present: Anthropocene Start Date Activity  
  **Title:** "Boundary Commissions: Who Decides When Time Begins?"  
  **Objective:** Students experience how the start date of a period is underdetermined by evidence and depends on a commission's mandate, precedents, and decision rules. The goal is to surface that "when" depends on "who decides and why," with jurisdictional choices carrying implicit stakes.

  ---

  ### **Activity Design Overview**  
  I brainstormed two concepts:  
  1. **"Epochal Negotiation"**: Students act as a single commission shifting mandates mid-deliberation. *Discarded*—it blurs the contrast between decision logics and risks students missing the structural shift.  
  2. **"Dual Commission Simulation"** (selected): Students serve on two distinct commissions sequentially, forcing them to apply incompatible rules to the same evidence. This makes underdetermination visceral—students *feel* the rules steering outcomes, not the debrief explaining it.  

  The design ensures:  
  - **Contrast through rules**: Stratigraphy rules require a single physical marker; history rules prioritize narrative events.  
  - **Precedents as hidden drivers**: Past rulings constrain choices more than evidence.  
  - **Voting with friction**: Supermajorities force compromise, exposing how procedure shapes legitimacy.  
  - **Predictable pitfalls**: Built-in safeguards (e.g., role cards, timers) mitigate common issues.  

  ---

  ### **Materials List** (Print 1 set per group; 2 groups total)  
  - **Evidence Cards** (12 cards, double-sided; [Appendix A](#appendix-a-evidence-cards))  
  - **Precedent Cards**:  
    - *Stratigraphy Commission* (3 cards; blue paper) [Appendix B1](#appendix-b-precedent-cards)  
    - *History Commission* (3 cards; green paper) [Appendix B2](#appendix-b-precedent-cards)  
  - **Role Cards** (7 per group: Chair, Recorder, 5 Commissioners; [Appendix C](#appendix-c-role-cards))  
  - **Rules & Voting Sheets** (1 per commission; [Appendix D](#appendix-d-rules--voting-sheets))  
  - **Timer** (phone or classroom clock)  
  - **Whiteboard** (to record group decisions)  

  **Total Prep**: Print 24 evidence cards (2 sets), 12 precedent cards (2 colors), 14 role cards, 4 rules sheets. No tech needed.

  ---

  ### **Timeline** (90 Minutes Total)  
  #### **0–10 min: Setup and Framing**  
  - **Instructor does**:  
    - Divide class into two groups (7 students each).  
    - Distribute materials: Each group gets evidence cards, stratigraphy precedents (blue), role cards, rules sheets.  
    - Frame: *“Today, you’ll serve on two commissions tasked with setting the start of the Anthropocene. Your job isn’t to debate if it’s ‘real’—it’s to follow your commission’s rules. Pay attention to how the rules change what counts as ‘good’ evidence.”*  
    - Clarify: *“The evidence cards are simplified proxies for real data. Dates are approximate; ⚠️ marks invented details.”*  

  #### **10–35 min: Round 1 – Stratigraphy Commission**  
  - **Structure**:  
    - Groups have 20 min. Roles: **Chair** (enforces rules), **Recorder** (notes justifications), **Commissioners** (deliberate/vote).  
    - **Task**: Pin the Anthropocene start to *one* global marker in a physical reference section (e.g., ice core, sediment layer). Must cite one **stratigraphy precedent** to justify.  
    - **Voting**: Requires 5/7 supermajority. Dissenters write a 1-sentence minority statement.  
  - **Predictable pitfall**: Students fixate on "strongest" evidence.  
    - **Mitigation**: Chair intervenes: *“Remember—you need a marker tied to a single layer. A regional signal like pollen isn’t global. Which precedent fits?”*  
  - **Outcome**: Groups report: (1) Chosen start date, (2) Evidence card used, (3) Precedent cited. Recorder posts on whiteboard.  

  #### **35–50 min: Round 2 – History Commission**  
  - **Instructor does**:  
    - Swap precedent cards: Replace blue (stratigraphy) with green (history) cards.  
    - Distribute new rules sheet.  
    - Reframe: *“You’re now a History & Heritage Commission. Your mandate: Define the Anthropocene as a cultural period. You can anchor to an event—no physical marker needed.”*  
  - **Structure**:  
    - 15 min. Same roles.  
    - **Task**: Set a start date tied to a transformative event. Must cite one **history precedent**.  
    - **Voting**: Simple majority (4/7). Abstentions allowed; any dissenter writes a minority statement.  
  - **Predictable pitfall**: Groups reuse the same date as Round 1.  
    - **Mitigation**: If this happens, ask in debrief: *“Did the rules change your reasoning, or did evidence dominate? Why?”*  

  #### **50–60 min: Report-Back**  
  - Groups share:  
    - Stratigraphy outcome (date, evidence, precedent).  
    - History outcome (date, event, precedent).  
    - Minority statements (read aloud).  
  - **Instructor notes contrasts**: e.g., *“Group 1 chose 1950 for stratigraphy (radionuclides) but 1784 for history (steam engine). Why?”*  

  #### **60–90 min: Debrief**  
  Link activity moments to concepts:  
  1. **“Empirical vs. Classificatory”** (10 min):  
     - *Prompt*: “In Round 1, you needed a ‘golden spike’—like radionuclides in ice. Was this about *detecting* onset or *classifying* a boundary?”  
     - *Key point*: Stratigraphy focused on detection (e.g., “Is this layer global?”); history focused on classification (e.g., “Is this event meaningful?”).  

  2. **“Periodization as Interest-Relative”** (10 min):  
     - *Prompt*: “Group 2 cited the ‘Columbian Exchange’ precedent in history round but rejected it in stratigraphy. Why?”  
     - *Key point*: Stratigraphy precedents prioritize synchronous markers; history precedents prioritize narrative weight. Who benefits? Stratigraphy serves scientific coordination; history serves cultural memory.  

  3. **“Useful vs. Real”** (5 min):  
     - *Prompt*: “When Group 1’s minority statement called 1950 ‘arbitrary,’ was it rejecting the Anthropocene or the *rule*?”  
     - *Key point*: “The Anthropocene is real” ≠ “1950 is the right start.” Start dates are tools: useful for geology (global correlation) or history (event symbolism).  

  4. **“Stakes of Jurisdiction”** (5 min):  
     - *Prompt*: “Why might scientists resist historians defining the Anthropocene? What power comes from owning time?”  
     - *Key point*: Stratigraphy’s supermajority rule claims “neutrality,” but it’s a stake-laden choice—ratification by geologists shapes funding, policy, and legacy.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **“Treating it as a quiz”**: Students argue over “right” dates.  
     - **Fix**: Interrupt early: *“Stop. Re-read your rules. Which precedent applies? Your opinion on the ‘best’ date is irrelevant—follow your mandate.”*  

  2. **“Dominant student steamrolls”**: One voice controls the vote.  
     - **Fix**: Role cards empower Chairs to enforce “no interruptions” and call on quiet members. Minority statements give dissenters leverage.  

  3. **“Rounds collapse to same date”**: Groups ignore rules, pick 1950 twice.  
     - **Fix**: In debrief, dissect *why*: *“Did evidence trump rules? Would real stratigraphers accept ‘invention of steam engine’ as a boundary? Why not?”*  

  4. **“Time overrun”**: Deliberation drags.  
     - **Fix**: Hard stop at 20/15 min. If deadlocked, vote on top 2 options.  

  ---

  ### **What the Activity Cannot Reproduce**  
  **Gap**: The real-world weight of *ratification*—how formal rules (e.g., ICS voting hierarchies, national committees) slow decisions and amplify political stakes. Students see "rules" but not institutional inertia.  
  **Patch**: During debrief (min 70–75), say:  
  > *“In reality, defining a geologic time unit takes years. The ICS requires 60% supermajority in multiple working groups, then ratification by an international body. This isn’t just ‘slow’—it privileges certain voices (e.g., Global North geologists) and embeds power in procedure. Our 20-minute vote? It skipped that. So when you hear ‘Anthropocene rejected by scientists,’ ask: Who voted? Under whose rules?”*  

  ---

  ### **Appendices**  
  #### **Appendix A: Evidence Cards**  
  *Print 12 cards per group (6 sheets, double-sided). ⚠️ = invented detail.*  

  | Card | Signal                 | Date(s)                     | Description                                                                                                | Global? |  
  |------|------------------------|----------------------------|------------------------------------------------------------------------------------------------------------|---------|  
