prompt: |-
  A working group in my department is drafting standards for how to interpret failed replications, and at our last meeting a colleague shut down discussion of a string of null results with the old slogan that absence of evidence is not evidence of absence. As far as I could tell, her point was that the failures told us nothing about whether the original findings were real. It struck me afterward that this one sentence is being asked to do a great deal of work while remaining perfectly ambiguous, and I would like to know exactly what it commits us to before the group endorses it in any report.

  Please lay out, as a menu rather than a verdict, the distinct precise claims the slogan could be expressing. For instance, it might be a purely logical point that failure to prove a hypothesis is not proof of its negation; a frequentist point that a failure to reject a null hypothesis is not confirmation of the null, and that non-significance reflects absence of evidence only under low power; a Bayesian point about when missing evidence is genuinely uninformative rather than diagnostic of absence, which would seem to make the slogan false in general and true only when the evidence we failed to obtain would have been just as likely whether or not the effect is real; a point about the balance of evidence versus its weight; or something further still, such as a caution about treating unfalsifiability as a merit. For each reading, say whether it is a platitude, a substantive and defensible claim, or simply false.

  Then address the question that actually matters for our working group: on which of those readings, if any, does the slogan support dismissing a well-powered failed replication as saying nothing about the original effect? I want you to be especially explicit about the unstated assumption doing the work here — an assumption about what we should have expected to observe if the effect were real, and about detectability and statistical power — and about whether the slogan, so used, is symmetric in a way its users would find uncomfortable: if absence of evidence can never count as evidence of absence, what, in their view, ever could count as evidence against an effect, and does that commitment make the original findings effectively insulated from replication failure in a way the rest of us should refuse to accept in a replication standard?
reasoning: |-
  Okay, the user is part of a working group setting standards for interpreting failed replications. Their colleague dismissed a string of null results by saying "absence of evidence is not evidence of absence," implying these failures don't challenge the original findings. The user wants to unpack this slogan before it's endorsed in their report.

  This seems like a classic statistics interpretation problem wrapped in academic politics. The user isn't just asking for definitions—they're subtly challenging a position that could institutionalize poor replication standards. There's urgency here: if the slogan is misinterpreted, their group might codify a loophole where original findings become unfalsifiable.

  Breaking down the slogan's possible meanings is essential. The logical interpretation (failure to prove ≠ proof of falsity) is uncontroversial but irrelevant to replication studies. The frequentist view (non-significance ≠ confirming null) is technically correct but often misapplied—especially when power is high. The Bayesian angle is more nuanced: when exactly is missing evidence uninformative? Only when the evidence was equally likely under both hypotheses.

  The real meat is how these interpretations apply to well-powered replications. If a high-powered study fails to find an effect, that absolutely is evidence of absence under any reasonable framework. The colleague's position seems to rely on an unspoken assumption that power was low—but if that's not true, their argument collapses. Worse, if they insist no amount of failed replications could disprove an effect, that makes science unfalsifiable.

  The user needs ammo for their next meeting. They're probably facing someone using statistical truisms to shield pet theories. Key counters: 1) Well-powered null results shift likelihood ratios, 2) Demanding infinite evidence is unscientific, and 3) The symmetry point exposes hypocrisy—if they accept that presence of evidence proves an effect, they must accept that absence can disprove it given sufficient power.

  Power calculations are the silent killer here. If the group can establish that replications must pre-register power analyses, then "absence of evidence" arguments only hold water when power is genuinely low. That's the compromise: the slogan stays, but with an asterisk requiring power transparency.
answer: |-
  Here's a breakdown of the slogan "absence of evidence is not evidence of absence" (AoE ≠ EoA), its possible interpretations, and its implications for your working group's question about well-powered failed replications. The key insight is that the slogan's truth and relevance depend *entirely* on the context of evidence quality and prior assumptions.

  **Menu of Precise Claims Encapsulated by the Slogan:**

  1.  **Logical/Proof-Theoretic Interpretation:**
      *   **Claim:** Failure to prove a proposition `H` (e.g., "Effect exists") is not logically equivalent to proving its negation `~H` ("Effect does not exist").
      *   **Status:** **Platitude (True).** This is fundamental logic. Observing no evidence *in a specific attempt* doesn't constitute proof the thing doesn't exist elsewhere or under different conditions. (e.g., Not finding your keys on the desk doesn't prove they don't exist in the house).
      *   **Relevance to Replication:** Irrelevant to scientific inference. Science deals with evidence and probability, not logical proof of universal negatives.

  2.  **Frequentist Interpretation (Low Power / Insensitive Test):**
      *   **Claim:** A non-significant result (p > alpha) *from a test with low statistical power* does not confirm the null hypothesis (`H0`: No Effect). It primarily reflects the *absence of conclusive evidence* either way, often due to insufficient data, noise, or methodological limitations. Non-significance *is* absence of evidence *for the effect*, but it is *not* interpretable as evidence *for the absence of the effect* under low power.
      *   **Status:** **Substantive and Defensible Claim (True, but context-dependent).** This is a core frequentist caution against accepting `H0` based on non-significance alone when power is low. The "absence of evidence" (non-significance) truly isn't "evidence of absence" (support for `H0`) in this scenario.
      *   **Relevance to Replication:** **Crucial.** This is likely the interpretation your colleague *intended*. It correctly warns against interpreting *underpowered* replication failures as evidence the original effect is absent.

  3.  **Frequentist Interpretation (High Power / Sensitive Test):**
      *   **Claim:** A non-significant result *from a test with high statistical power* *is* meaningful evidence *against* the existence of an effect of the originally claimed size (or larger). High power means the test was very likely to detect the effect *if it existed* at the expected magnitude. Failing to find it then *is* evidence the effect is absent or substantially smaller.
      *   **Status:** **Substantive and Defensible Claim (True).** This is the logical counterpart to interpretation 2. High power makes non-significance diagnostically informative *against* the originally hypothesized effect size.
      *   **Relevance to Replication:** **Crucial.** This directly contradicts the dismissal of *well-powered* failures. A well-powered non-significant result *is* "absence of evidence" (for the effect) that *does* legitimately constitute "evidence of absence" (of an effect at the expected size).

  4.  **Bayesian Interpretation (Uninformative Absence):**
      *   **Claim:** Failure to observe evidence `E` is only completely *uninformative* about hypothesis `H` (i.e., doesn't change the prior probability of `H` or `~H`) if the *likelihood* of *not* seeing `E` is exactly the same *whether `H` is true or false* (i.e., `P(not E | H) = P(not E | ~H)`). If failing to see `E` is *more likely* under `~H` than under `H` (`P(not E | ~H) > P(not E | H)`), then *not seeing `E`* actually *is* evidence *for* `~H` (absence).
      *   **Status:** **Substantive and Defensible Claim (True).** This defines precisely when absence of evidence *is* uninformative. The slogan AoE ≠ EoA holds *only* when `P(not E | H) = P(not E | ~H)`.
      *   **Relevance to Replication:** **Crucial.** In a well-powered replication attempt: `P(Not find effect | Effect Exists)` is **low** (Type II error rate, β). `P(Not find effect | Effect Does Not Exist)` is **high** (≈1). Therefore, `P(Not find effect | Effect Does Not Exist) >> P(Not find effect | Effect Exists)`, meaning failing to find the effect *strongly supports* the hypothesis that the effect is absent. The slogan is **FALSE** in this specific context. The absence of evidence *is* evidence of absence.

  5.  **Evidence Weight vs. Evidence Balance Interpretation:**
      *   **Claim:** "Absence of evidence" refers to the *weight* of evidence (the precision or conclusiveness of the investigation), while "evidence of absence" refers to the *balance* of evidence (which way the evidence points, even if weak). The slogan cautions that a study with very low weight (e.g., tiny sample, flawed method) yielding a null result doesn't shift the balance meaningfully towards absence, even if technically the result points that way.
      *   **Status:** **Substantive and Defensible Claim (True).** Emphasizes the importance of study quality and precision.
      *   **Relevance to Replication:** **Highly Relevant.** A failed replication with "low weight" (low power, poor methodology) might not meaningfully shift the overall evidence balance away from the original finding. A failed replication with "high weight" (high power, rigorous methodology) *does* meaningfully shift the balance towards absence.

  6.  **Unfalsifiability Shield Interpretation:**
      *   **Claim:** The slogan is invoked to imply that a hypothesis (like the original effect being real) can never be meaningfully challenged by negative evidence (failed replications), effectively rendering it unfalsifiable. Any failure can be dismissed as merely "absence of evidence," not evidence of absence.
      *   **Status:** **False and Misleading.** This misapplies the valid points above (especially #2 and #5) to insulate a claim from disconfirmation, violating core scientific principles. It confuses "absence of evidence *under all conceivable circumstances*" (which *would* be strong evidence of absence) with "absence of evidence *in this specific, potentially flawed, test*".
      *   **Relevance to Replication:** **Highly Problematic.** This is the dangerous implication if the slogan is misapplied to dismiss *all* failed replications.

  **Addressing the Working Group's Core Question:**

  > **"On which readings does the slogan support dismissing a *well-powered* failed replication as saying nothing about the original effect? What is the unstated assumption? Is the position symmetric and what are its implications?"**

  1.  **Support for Dismissal:**
      *   The slogan **only supports dismissing a well-powered failed replication** under **Interpretation #2 (Frequentist, Low Power)** or **Interpretation #5 (Low Evidence Weight)**, *but only if the unstated assumption is true*.
      *   **The Crucial Unstated Assumption:** ***"This replication attempt had low statistical power (or otherwise lacked sufficient evidential weight) to detect the original effect."***
      *   If this assumption is *false* (i.e., the replication *was* well-powered), then interpretations #2 and #5 **do not apply**, and interpretations #3 (Frequentist, High Power), #4 (Bayesian), and the correct application of #5 (High Evidence Weight) **directly contradict the dismissal**. They show that a well-powered failure *is* strong evidence of absence (or at least substantial reduction) of the original effect.

  2.  **Symmetry and Implications:**
      *   **Asymmetry:** The position that "AoE ≠ EoA" *always* applies, especially to dismiss well-powered failures, is **fundamentally asymmetric and unsustainable**.
      *   **What Counts as Evidence Against?** If absence of evidence *never* counts as evidence of absence, even under high power, then logically:
          *   **No finite amount of failed replications could ever suffice** as evidence against the original effect. Each failure would just be another "absence of evidence".
          *   **Only direct logical proof of universal non-existence** (which is impossible for empirical effects) could count. This makes the original finding **effectively unfalsifiable**.
      *   **Contradiction with Acceptance of Positive Evidence:** Proponents of this asymmetric view readily accept that *finding* evidence (a significant positive replication) *is* evidence *for* the effect (presence of evidence *is* evidence of presence). This violates the symmetry inherent in probabilistic reasoning (Bayes) and power analysis (Frequentist). If finding `E` supports `H` (`P(E | H) > P(E | ~H)`), then *not* finding `E` *should* support `~H` *if* `P(not E | ~H) > P(not E | H)` – which is exactly what high power ensures.
      *   **Implication for Standards:** **Endorsing the slogan without explicit caveats regarding power and evidential weight would be a grave error.** It would create a standard where original findings are insulated from disconfirmation by replication failure, no matter how rigorous or well-powered the replication. This undermines the core purpose of replication.

  **Conclusion & Recommendation for the Working Group:**

  The slogan "absence of evidence is not evidence of absence" is **not** a universal truth that applies regardless of context. Its validity **depends critically on the sensitivity and quality of the search for evidence (i.e., statistical power and methodological rigor)**.

  *   **For Well-Powered Failed Replications:** The slogan is **false or misapplied** (Interpretations #3, #4, #5 correctly applied). A well-powered failure *is* significant evidence of absence (or severe attenuation) of the originally claimed effect. Dismissing it as "saying nothing" relies on the **unstated and erroneous assumption that the replication was underpowered or lacked evidential weight**.
  *   **Asymmetric Unfalsifiability:** Using the slogan to dismiss *all* failed replications, regardless of power, creates an asymmetric standard where evidence *for* an effect is accepted, but evidence *against* it is perpetually deferred. This renders original findings unfalsifiable via replication, which is scientifically unacceptable.

  **Recommendation:** Your standards must explicitly **reject** the blanket dismissal of failed replications based solely on this slogan. Instead, emphasize:
  1.  **Power is Paramount:** The interpretation of a null result (failed replication) depends fundamentally on the statistical power of that specific study *to detect the original effect size*. High-power failures are strong evidence against the original effect; low-power failures are inconclusive.
  2.  **Evidence Weight Matters:** Rigorous methodology and pre-registered analysis plans increase the evidential weight of both successful and failed replications.
  3.  **Bayesian Reasoning Clarifies:** Failed replications *update* the probability of the effect existing. The degree of update depends critically on the power (likelihood) of the replication attempt.
  4.  **Avoid Unfalsifiability:** Standards must ensure that claims *can* be overturned by sufficiently rigorous and well-powered contradictory evidence. The slogan should only be invoked where low power or poor methodology legitimately makes the failure uninformative, not as a shield against all disconfirmation.

  Do not endorse the slogan without rigorously defining its limited, power-dependent applicability. Doing so would provide a ready-made rhetorical tool to dismiss even the most compelling evidence against an effect.
