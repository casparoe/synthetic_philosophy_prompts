prompt: |-
  You are a professional moral philosopher with a gift for pedagogical design. I teach an advanced undergraduate seminar on moral luck, and I want a one-page decision-tree handout that starts every student at the same innocent-looking starting commitment — "a person's degree of blameworthiness can only depend on factors within their control" — and walks them, node by node, to the position on moral luck they actually hold. Before drafting, brainstorm carefully about what the genuinely load-bearing questions are; the tree must be built from the logical space, not from a memorized list of labels.

  Requirements on the nodes. Each node must be a concrete case or a claim about one, phrased so a student can answer it without knowing which position it leads to. The tree must route through at least these cases, which I consider non-negotiable: (a) the equally reckless drunk drivers, one of whom kills a child and one of whom arrives home unnoticed; (b) the painter who abandons his family for his art, where the question is whether the eventual success or failure of the paintings bears on how his choice is assessed; (c) the German who emigrates in 1932 and later reflects that had he stayed he would very likely have become a Nazi functionary, a man of no worse character than himself; and (d) a person of innately vicious temperament who struggles daily to behave decently, contrasted with a naturally gentle person who behaves equally decently with no effort — the question of whether character itself is luck in a morally relevant sense. The nodes should force students to distinguish blame from regret, from admiration, and from how a life retrospectively adds up, since much of the literature's apparent disagreement trades on running these together.

  Requirements on the leaves. At least five distinct end-points, including: the strict Kantian who holds the control principle without exception and accepts whatever counterintuitive results follow; the position that concedes luck pervades moral assessment so thoroughly that the everyday practice of blame is largely incoherent, and says what should replace it; the position that what one's life retrospectively amounts to can depend on luck even though blame cannot, and that this is the interesting phenomenon all along; and any principled mixed view — e.g., someone who denies that outcomes matter while conceding that circumstances or character do. Give each leaf a name, a one-sentence statement of its most awkward commitment, and, where a region of the logical space is unoccupied, say so and hazard a diagnosis: is nobody there because the combination is incoherent, because it is unattractive, or because it is simply unexplored?

  Finally, flag honestly any pair of leaves the tree cannot separate — I suspect at least two of the positions differ mainly in tone or emphasis rather than in any case they would decide differently — and tell me where the tree would need another discriminating case to pull them apart. Keep the whole thing compact enough to hand out and work through in twenty minutes of discussion.
reasoning: |-
  Okay, the user is teaching an advanced undergrad seminar on moral luck and needs a decision-tree handout. They want a logical progression from a common starting point—blameworthiness depends only on factors within control—through key cases to distinct positions. 

  First, I need to identify the core tension: the intuitive control principle vs. real-world cases where luck seems to affect judgment. The tree must force students to confront this repeatedly. The non-negotiable cases are:
  - Drunk drivers (outcome luck)
  - Artist abandoning family (constitutive/circumstantial luck)
  - German emigrant (circumstantial luck)
  - Innate temperament (constitutive luck)

  The pedagogy challenge: Each node must be a concrete question about a case, not theoretical labels. Students should "discover" their position through choices. Need to distinguish blame vs. regret/admiration/retrospective assessment—common conflation points in literature.

  Branching logic: Start with the drunk driver case because it’s stark and forces the outcome luck dilemma immediately. If they bite the bullet (no blame difference), they’re on the Kantian path. If they hesitate, probe deeper with the artist case to test consistency about constitutive/circumstantial luck. 

  The German emigrant case is perfect for separating blame from retrospective assessment—does his relief imply moral luck or just existential luck? The temperament case then tests whether character itself is a luck-based factor. 

  For endpoints: Need at least five distinct positions. The Kantian is straightforward. The skeptic who rejects everyday blame is radical but coherent. The retrospective-only view (Williams-inspired) is crucial. Mixed views are tricky—must avoid mushiness. The "effort-based" mixed view (denies outcome/constitutive luck but accepts circumstantial) seems defensible. 

  Potential hole: The "regret theorist" and "skeptic" might collapse if they both reject blame but for different reasons. Need to flag that. Also, the tree might not separate Williamsians who care about "agent-regret" from those who don’t—might need an additional case about first-personal anguish (e.g., "If you accidentally caused a death, would your self-blame be irrational?"). 

  Compression challenge: Must fit on one page. Use terse case descriptions and binary choices. Sacrifice some nuance for clarity—e.g., in the artist case, stipulate "same intention/effort" to isolate luck of success/failure. 

  Finally, diagnostic honesty: Note where positions are adjacent (e.g., Kantian vs. mixed view on character) and why some combinations are empty—e.g., accepting outcome luck but denying circumstantial luck is incoherent since both are external. 

  The user’s deep need: They want students to viscerally grasp why moral luck fractures ethical theories, not just memorize positions. The tree should make the tensions unavoidable.
answer: |-
  Here is a concise decision-tree handout designed for a 20-minute seminar discussion, forcing confrontation with core tensions while routing through your required cases. Nodes are concrete questions; leaves are distinct positions with diagnostic notes.

  **Moral Luck: Where Do You Stand?**  
  *Start Here:* "A person's blameworthiness can only depend on factors within their control." (The Control Principle)

  ### The Tree
  1.  **Node 1 (Drunk Drivers):** Two equally reckless drivers drive home drunk. Driver A kills a child; Driver B arrives safely. Is Driver A *more blameworthy* than Driver B?
      *   **Yes → Go to Node 2**
      *   **No → Go to Node 3 (Kantian Path)**

  2.  **Node 2 (Artist's Sacrifice):** An artist abandons his family to pursue art. Years later, we assess his choice. Does it matter *for blaming his choice* whether his paintings turned out to be masterpieces (Success) or worthless failures (Failure)?
      *   **Yes → Go to Node 4**
      *   **No → Go to Node 5 (Mixed Path A)**

  3.  **Node 3 (Kantian Path: Character Luck):** Consider two people: Vicious Virtue (VV), born with cruel impulses, struggles daily to act kindly; Gentle Ease (GE), naturally kind, acts kindly with no effort. Both act equally kindly today. Is VV *more morally admirable* (or less blameworthy *for their character*) than GE?
      *   **Yes → Leaf 1: Strict Kantian**
      *   **No → Leaf 1: Strict Kantian** (Both answers are consistent: Admiration/Character blame ≠ action blame per strict control)

  4.  **Node 4 (German Emigrant):** In 1932, a German (Hans) emigrates. Later, he learns that had he stayed, he *very likely* would have become a Nazi functionary, despite being no worse a person then than he is now. Hans feels profound relief and guilt-by-association. Is Hans *correct* to feel he is *morally lucky* to have emigrated?
      *   **Yes → Leaf 2: Outcome/Constitutive Luck Advocate**
      *   **No → Go to Node 6**

  5.  **Node 5 (Mixed Path A: Retrospective Assessment):** Regarding the German Emigrant (Hans): Does Hans's relief show that his *life, overall*, turned out morally better *because* he emigrated?
      *   **Yes → Go to Node 7**
      *   **No → Leaf 3: Outcome-Only Luck Denier** (Accepts circumstantial/constitutive luck but *not* outcome luck)

  6.  **Node 6 (Regret vs. Blame):** Hans's feeling (Node 4) is best described as...?
      *   **Agent-Regret (a first-personal feeling about one's causal role, distinct from blameworthiness) → Leaf 4: Williamsian Retrospectivist**
      *   **Residual Blame (implying he *was* partly responsible for the possible Nazi self) → Leaf 2: Outcome/Constitutive Luck Advocate**

  7.  **Node 7 (Character Luck):** Consider Vicious Virtue (VV) vs. Gentle Ease (GE) again. Is VV *more morally admirable* (or less blameworthy *for their character*) than GE?
      *   **Yes → Leaf 5: Skeptic/Effort Theorist**
      *   **No → Leaf 4: Williamsian Retrospectivist**

  ---

  ### The Positions (Leaves)
  1.  **Strict Kantian:** *Awkward Commitment:* Driver A (killer) is no more blameworthy than Driver B (lucky); Success/Failure of the Artist's work is irrelevant to blame; Hans's relief is purely non-moral.
  2.  **Outcome/Constitutive Luck Advocate:** *Awkward Commitment:* The *actual outcome* (dead child) makes Driver A more blameworthy; the Artist's *success* can partially justify his earlier blameworthy choice; Hans *is* morally lucky he left.
  3.  **Outcome-Only Luck Denier (Mixed View):** *Awkward Commitment:* Driver A is *not* more blameworthy than Driver B (rejects Outcome Luck), *but* Hans *is* morally lucky he left (accepts Circumstantial Luck), and the *failed* Artist's choice is *worse* than the successful one's would be (accepts Constitutive Luck re: judgment of character/choice).
  4.  **Williamsian Retrospectivist:** *Awkward Commitment:* "Blameworthiness" (in the strict control sense) is largely incoherent; the *interesting* question is how luck shapes what one's life *retrospectively amounts to* (Hans's relief, the Artist's success coloring his sacrifice). Admiration (VV vs. GE) is agent-relative, not about objective blame.
  5.  **Skeptic/Effort Theorist:** *Awkward Commitment:* Everyday blame *is* incoherent because constitutive/circumstantial luck pervades everything (character, circumstances, effort-capacity); replace blame with assessing effort against one's own limitations (VV>GE) or systemic factors. Outcomes are irrelevant (Driver A=B).

  ---

  ### Diagnostics & Notes
  *   **Unoccupied Space?** A principled view accepting *only* circumstantial luck (Hans) but *rejecting* outcome (Drivers) *and* constitutive (Artist Failure, VV/GE) luck is unstable. Why accept luck in *one* external factor but not others? Likely **unattractive/incoherent**.
  *   **Indistinguishable Pairs?**
      *   **Strict Kantian & Outcome-Only Luck Denier:** Both answer "No" on Node 1 (Drivers). They *only* diverge if the tree forces them onto different paths via Node 2 (Artist) or Node 5 (Hans Retrospective). The tree *can* separate them (Node 5/Node 7), but their core agreement on outcome luck is robust.
      *   **Williamsian & Skeptic:** Both might answer similarly on many cases (e.g., Hans's relief is significant, Drivers A/B same blame). Key difference is the Skeptic's focus on *effort/innate limits* (VV>GE - Node 7 Yes) vs. Williamsian focus on *narrative totality* (Node 7 No). **Needs Discrimination:** Add a node forcing choice: "Is assessing VV as 'more admirable' than GE a legitimate *moral* judgment (Skeptic) or a different, non-moral evaluation of 'the struggle' (Williamsian)?"
  *   **Tone/Emphasis Differences:** Williamsian Retrospectivist vs. Skeptic differ mainly in *what they salvage* (meaningful retrospective assessment vs. effort-focused evaluation) from the wreckage of strict blame, not in case judgments. The flagged node above helps pull them apart.

  **Handout Note:** Use concise case names (e.g., "Drivers", "Artist", "Hans", "VV/GE") on the tree for speed. Encourage students to justify their answers based *only* on the concrete cases as presented.
