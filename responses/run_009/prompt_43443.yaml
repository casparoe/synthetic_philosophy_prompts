answer: |-
  Here's your Q&A battle plan, structured for maximum impact with this crowd. I'll walk through the objections in predicted order, with concessions, core replies, soft spots, and that dreaded final question.

  **Core Strategy:** Frame Williams' integrity not as "selfishness," but as the **structural impossibility of fully integrating one's deeply constitutive projects into a moral framework that makes them perpetually conditionally valuable** (i.e., only valuable *if* they rank high enough impartially *right now*). Emphasize the *subject-changing* nature of the "moral uncertainty" move.

  ---

  ### Objection 1: The Sophisticated Reply Already Solved This (Criterion vs. Decision Procedure)
  *"Your critique seems to ignore the core move of *sophisticated* consequentialism. We distinguish the *criterion* of rightness (maximize impartial good) from the *decision procedure* (use heuristics, live your life). Williams worried about constant calculation crushing projects. We solved that. You can wholeheartedly pursue your projects *within* the optimal strategy for maximizing good. Where's the integrity problem?"*

  **Concession Up Front:** "You're absolutely right that the decision procedure move *is* a massive improvement and directly addresses Williams' concerns about the *psychological burden* of constant calculation. It allows breathing room for personal life."

  **Two-Minute Reply:** "The integrity objection bites *deeper*. It's not just about *how* you decide (procedure), but about the ultimate *justification* of your projects (criterion). Sophisticated consequentialism says: 'Live your life... *because* doing so is part of the best *impartially justified* strategy.' Your projects aren't ultimately *yours* in a robust sense; their validity *always* derives from and is hostage to their contribution to an external, impartial ranking *at the level of justification*. Williams argued that integrity requires some projects to be valued *non-contingently* by the agent – valued *as* the agent's own, not *because* they score X points in God's (or the Impartial Observer's) calculus. The sophisticated reply makes projects *instrumentally* valuable components of the strategy, but it doesn't grant them the *intrinsic*, non-overridable (from the agent's perspective) status Williams thought crucial for integrity. The *criterion* still subordinates them."

  **Soft Spot:** Distinguishing "justification" from "motivation" is tricky here. Can an agent *feel* wholehearted commitment while knowing the justification is ultimately contingent? Williams might say "no," but it's a phenomenological claim hard to disprove. Emphasize the *justificatory structure*.

  ---

  ### Objection 2: Turning "One Thought Too Many" Back On You
  *"Isn't *your* insistence on 'integrity' as a separate value introducing the *real* 'one thought too many'? The consequentialist agent, using a good decision procedure, saves their spouse *because* they love them. Full stop. *You're* the one demanding they add the thought: '...but only if this doesn't conflict with my integrity!' That seems like the extraneous thought Williams warned about!"*

  **Concession Up Front:** "That's a sharp point. Williams *was* deeply concerned about over-intellectualizing moral psychology. And yes, an agent acting directly from love is psychologically simpler."

  **Two-Minute Reply:** "Williams' 'one thought too many' wasn't primarily about *counting* thoughts; it was about the *structure of justification*. The problem for consequentialism *wasn't* that the agent *might* think about impartiality when saving their spouse; it's that *if asked why saving their spouse was permissible or obligatory*, the *only possible justification within consequentialism* ultimately points back to the impartial good. The 'one thought too many' *exemplified* this deeper issue: even the loving act *must* be justifiable impartially to be truly right. My point about integrity isn't adding an *extra* thought *during* action; it's highlighting that the consequentialist *justificatory framework* itself provides no *independent normative space* for the agent's projects *as such*. The 'thought' is forced upon the agent not necessarily at the moment of action, but when reflecting on *why* their life and commitments have value *at all*. The 'integrity' worry is about that foundational justification, not an extra step in deliberation."

  **Soft Spot:** Needs careful phrasing to avoid conflating deliberation with justification. The reply hinges on the *retrospective/justificatory* burden consequentialism imposes on projects.

  ---

  ### Objection 3: Integrity for Terrible People (The Bigot Problem)
  *"Okay, suppose we grant 'integrity' as you describe it. Doesn't this protect the commitments of *anyone* deeply invested in their projects? What about the Nazi sincerely committed to his racist ideology? Doesn't Williams' view imply we must respect *his* integrity too? That seems morally abhorrent and suggests 'integrity' isn't a moral value worth preserving."*

  **Concession Up Front:** "Absolutely. This is the hardest bullet for Williamsian integrity to bite, and it's a major point in consequentialism's favor. We *should* condemn the Nazi's projects. Integrity, as Williams described it, *isn't* an intrinsic moral good that automatically makes projects praiseworthy."

  **Two-Minute Reply:** "Williams wasn't arguing that integrity *sanctifies* any project. He was diagnosing a *structural flaw in consequentialism* regarding how it treats the agent's *own* perspective on their *permissible* projects. The Nazi's project is *objectively immoral*. The point is: *even for morally permissible personal projects* (like George's chemistry research or Jim's love for his family), consequentialism struggles to accommodate the agent's experience of them as having *non-negotiable* value *to them*. The Nazi case shows integrity isn't sufficient for moral rightness; it highlights that integrity is an *agent-relative* phenomenon distinct from *agent-neutral* moral evaluation. The objection reveals a limitation of Williams' *positive* account, but it doesn't refute his *negative* critique: that consequentialism fails to make adequate room for the *agent's own standpoint* even concerning *good* projects. It shows integrity isn't the *whole* of morality, but it doesn't show the problem doesn't exist for decent people."

  **Soft Spot:** Concedes significant ground. The strength of the objection highlights that Williams' integrity is more of a *diagnostic tool* (revealing a cost/consequence of consequentialism) than a full-blown *alternative moral theory*. Focus the reply tightly on the *permissible project* case.

  ---

  ### The Dreaded Question: Is Integrity Just Fancy Laziness?
  *"Isn't 'integrity' in Williams' sense really just a high-minded way of saying 'I don't *feel* like doing the hard thing impartial morality requires'? George doesn't want the weapons job because it's icky and inconvenient, not because of some profound philosophical truth about the self. Isn't this just dressing up reluctance as a virtue?"*

  **Concession Up Front:** "Williams' examples *do* often involve reluctance to do distasteful things, and it's easy to read them cynically. And yes, sometimes reluctance *is* just laziness or squeamishness."

  **Two-Minute Reply:** "That's a fair challenge, and Williams needs better examples! But let's push past the surface. The core isn't the *reluctance*, it's the *source of the reluctance* and what it *reveals*. George's reluctance isn't (just) about the job being 'icky'; it's about betraying his *deep commitment* to pacifism and scientific research *for peace*. The 'integrity' cost occurs when the *justification* for abandoning his project is *solely* that some impartial calculation shows slightly more good elsewhere. Williams' point is that demanding this sacrifice *on those grounds* treats George's defining commitments as having *no intrinsic weight from his perspective* – they are mere inputs to the calculator. It asks him to see himself as fungible. The *feeling* of violation points to a deeper truth: we experience our core projects as partly *constitutive* of who we are, not just preferences we can trade away based on aggregate utility. Saying this is 'laziness' misses the *existential* dimension – it's about the coherence of the self *over time* under a moral theory that makes one's deepest values perpetually contingent. It's not that the sacrifice is *never* required; it's that the *reason* consequentialism gives (pure impartial optimization) fails to capture why such sacrifices are truly *tragic* and personally devastating, rather than just a suboptimal preference trade-off."

  **Soft Spot:** This relies heavily on accepting Williams' phenomenological claims about the experience of core projects. It's subjective and potentially elitist (whose projects count?). The strongest counter is the EA ethos: "Tough. The universe doesn't care about your 'existential coherence'; suffering demands optimization." Your reply must make the *cost* vivid and argue it's a genuine philosophical problem, not just whining.

  ---

  **Key for Delivery:**

  *   **Acknowledge Sophistication:** Show you understand their framework deeply. "I agree sophisticated consequentialism solves X, but..."
  *   **Focus on Justification:** Hammer the point about the *criterion* subordinating projects, not the procedure.
  *   **"Changed the Subject":** Use this phrase explicitly for the "moral uncertainty" move. "That reframes the question from 'what is the structure of justification?' to 'how do we weigh intuitions?', which sidesteps Williams' core concern about the *nature* of the Projects intuition."
  *   **Channel Williams' Tone:** Be slightly world-weary, emphasize the *personal cost* and *tragic* dimension. Avoid sounding self-righteous.
  *   **Own the Soft Spots:** Briefly acknowledging them builds credibility. "Now, the obvious counter here is... and that's a fair challenge, but..."

  Good luck! You're stepping into the lion's den with a nuanced argument. Clarity, respect for their intelligence, and sticking to the core structural point are your best weapons.
