  I'm writing a dissertation chapter on higher-order evidence and my advisor and I keep going in circles on whether epistemic akrasia is always irrational -- by which I mean the state of believing p while also believing that your evidence doesn't support believing p, or believing p via evidence you simultaneously take to be misleading. She's basically a conciliationist about it: higher-order evidence is just more evidence, so when your evidence says "don't trust your first-order take," the akratic combination is never permitted, full stop. My instinct is that there's something to the level-splitting idea -- that first-order and higher-order evidence live at different levels and don't have to be blended into one credence, so some akratic-looking states are at least sometimes okay. But I can't tell how much of my view is actual argument and how much is me finding that literature fun to read.

  So give me your honest credence that epistemic akrasia is always irrational. An actual number, not a hedge. And decompose the thing: roughly what probability do you assign to higher-order evidence being evidence in the same sense as first-order evidence, such that there's always a unique rational answer to how they combine? What probability that "rational" in this debate tracks blamelessness rather than permissibility, given that most people agree the akratic agent can be blameless even if irrational? What probability that akratic belief pairs are even coherent psychological states, versus requiring something like self-deception or a disordered mind rather than ordinary belief? Add any other terms you think belong in the decomposition, give each one a number and a line of justification, then show me how they combine into your final credence.

  Then do the self-critical part, which for me is the important part: which term are you least confident in, what argument or consideration would move your final number the most, and where is your own reasoning here most likely to fail? Like, concretely -- what would a defender of level-splitting have to demonstrate for your credence in "always irrational" to drop below 0.5, and is there a version of the akrasia debate where both camps are answering different questions and the disagreement is partly verbal? Im around 0.4 on "not always irrational" myself but I genuinely can't tell if that number survives contact with a decomposition, so id like to see whether yours does.
