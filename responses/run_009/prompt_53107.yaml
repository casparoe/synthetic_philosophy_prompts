answer: |-
  ### Decision Procedure for Simpson's Paradox Reversals

  This 10-minute procedure addresses reversals where aggregate and stratified results conflict. It prioritizes causal validity, noise reduction, and pre-specified variables. The core philosophy: **Report the number that best estimates the average treatment effect (ATE) without introducing bias**. Pre-test variables (fixed before treatment) can justify stratification; post-test variables (measured after treatment starts) often create bias.

  ---

  #### Procedure Flowchart
  1. **Check for statistical significance**  
     - **Check**: Are the aggregate effect and segment effects *statistically significant* (p < 0.05 or 95% CI excludes zero)?  
     - **Settles**: Whether the reversal is noise.  
     - **Sufficient answer**:  
       - If **aggregate is not significant**: Report aggregate (reversal is likely noise).  
       - If **segments are not significant**: Report aggregate (segments underpowered).  
       - If **both are significant and conflict**: Proceed to Step 2.  
     - **Confidence**: High (standard statistical practice).

  2. **Classify the slicing variable**  
     - **Check**: Was the slicing variable **fixed pre-test** (e.g., platform, plan tier) or **measured post-test** (e.g., engagement, onboarding completion)?  
     - **Settles**: Risk of bias from conditioning.  
     - **Sufficient answer**:  
       - **Pre-test**: Proceed to Step 3.  
       - **Post-test**: Report aggregate (high bias risk).  
     - **Confidence**: High (well-established in causal inference).  
     - **Why post-test is problematic**:  
       - Conditioning on post-test variables (e.g., "engaged users") can introduce *collider bias* or *mediation* if the treatment affects the slicing variable. This manufactures artificial reversals.  
       - Example: If the feature affects engagement (e.g., more users become "engaged"), slicing by engagement distorts the outcome by conditioning on a variable influenced by treatment.

  3. **Check for imbalance in pre-test slices**  
     - **Check**: For pre-test variables, is there **imbalance in segment distribution** between treatment/control? (e.g., 60% mobile in treatment vs. 40% in control).  
     - **Settles**: Whether aggregate results are confounded by segment imbalance.  
     - **Sufficient answer**:  
       - **Imbalance present**: Report stratified ATE (weighted average of segment effects, using overall segment proportions).  
       - **No imbalance**: Report aggregate (reversal likely due to other factors; hand to person).  
     - **Confidence**: Medium (imbalance directly causes Simpson’s paradox).  
     - **Least confident rule**: This step assumes imbalance is the primary driver. If reversal persists without imbalance, unmeasured confounders may exist.

  4. **Handoff to human**  
     - **Conditions**:  
       - Steps 1–3 yield conflicting guidance.  
       - No imbalance in pre-test slices but reversal persists.  
       - Uncertainty about variable classification (pre-test vs. post-test).  
     - **Action**: Escalate to data scientist for causal modeling (e.g., propensity scoring).

  ---

  ### Case Applications
  #### Case 1: Notification Feature (Mobile vs. Desktop)
  - **Overall**: Significant 7-day retention decrease.  
  - **Segments**: Significant retention increase on both mobile and desktop.  
  - **Slicing variable**: Platform (pre-test).  
  - **Imbalance**: Mobile share drifted between arms (e.g., treatment had 70% mobile, control had 50%).  

  **Procedure**:  
  1. **Step 1**: Both aggregate and segments significant → Proceed.  
  2. **Step 2**: Platform is pre-test → Proceed.  
  3. **Step 3**: Imbalance confirmed → **Report stratified ATE**.  
     - Compute stratified ATE: `(mobile_effect * overall_mobile_prop) + (desktop_effect * overall_desktop_prop)`.  
     - Result will likely be positive (aligns with segments).  

  **Why**: Imbalance in pre-test variable confounds aggregate. Stratified adjustment corrects bias.  

  #### Case 2: Same Feature (Engaged vs. Unengaged)
  - **Overall**: Significant 7-day retention decrease.  
  - **Segments**: Significant retention increase in both engaged/unengaged users.  
  - **Slicing variable**: Engagement in first week (post-test).  

  **Procedure**:  
  1. **Step 1**: Both significant → Proceed.  
  2. **Step 2**: Engagement measured post-test → **Report aggregate**.  

  **Why**:  
  - Engagement is post-test; conditioning likely introduces bias.  
  - Example: If the feature *causes* engagement (e.g., notifications increase activity), slicing by engagement:  
    - Compares inherently different users (e.g., "engaged" in treatment may be less loyal than "engaged" in control).  
    - Manufactures false reversals by conditioning on a collider.  
  - **PM argument rejected**: Reporting stratified here misrepresents ATE.

  ---

  ### Final Answers
  \answer{case 1: stratified; case 2: aggregate}
