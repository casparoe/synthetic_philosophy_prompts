prompt: |-
  I teach an upper-level epistemology seminar — 14 students, 90 minutes — and next week's topic is higher-order evidence and epistemic akrasia: cases where your evidence about your own evidence points away from your first-order judgment. My worry is that on paper the phenomenon looks like a technicality, and I want an in-class activity where students run into the akratic combination in themselves before we name it.

  Here is the mechanism I have in mind, which you should refine into something runnable rather than replace wholesale. Students take a short forced-choice quiz: about a dozen questions, deliberately mixed between ones they can re-verify on the spot if pressed (simple arithmetic, a syllogism they can check) and ones where they'll have nothing but their first-order memory (geography trivia, say), each with a confidence rating. Then each student opens a sealed envelope. One third of the envelopes say the student was randomly selected to receive the misleading version of the quiz — where the wording of several questions subtly points toward the wrong answer — one third say the student's quiz was clean, and one third are blank, and students know these proportions in advance. In fact every quiz is identical; the envelopes give genuine higher-order evidence of unreliability that is completely uncorrelated with any actual first-order error. Students then decide, question by question, whether to stick or switch, and re-rate their confidence, for payoff points. The interesting data are the students who, on a re-checkable arithmetic question, still switch because of the envelope, and the ones who stick while conceding in the debrief that their total evidence didn't support sticking.

  Design the full session: rules, materials, the payoff scheme, how to run the envelope draw so students believe the probabilities, timing, and a debrief that maps specific moments onto the distinction between first-order and higher-order evidence, and onto the question of whether higher-order evidence merely lowers credence or outright defeats. The debrief should also connect the checkable versus uncheckable questions to the debate over whether one can rationally re-verify one's way out of higher-order defeat. No lecture beforehand; they shouldn't meet the terms "higher-order evidence" or "epistemic akrasia" until the debrief.

  Tell me honestly what will predictably go wrong the first time I run it — the envelope mechanism has failure modes I can already half see, and I want yours. And say plainly which feature of the phenomenon the activity cannot reproduce and I will have to supply by discussion afterwards. Finally, be self-critical about the design itself: identify where your reasoning about how students will respond is most likely to fail, and what observation during the session would change your mind about whether the activity is doing its job. End with a line of the form "Verdict:" followed by the single design element most likely to teach the wrong lesson instead of the intended one.
reasoning: |-
  Hmm, the user is an epistemology professor designing an in-class activity about higher-order evidence and epistemic akrasia. They want students to experience the phenomenon firsthand before learning the terminology. Their proposed mechanism involves a quiz with verifiable and unverifiable questions, plus misleading envelopes suggesting possible quiz manipulation.

  The professor is clearly experienced - they've anticipated some failure modes but want me to identify more. Key concerns include: making the akrasia visceral rather than theoretical, ensuring the envelope deception is believable, and designing clean debrief connections. Their anxiety about it feeling "technical" suggests they value pedagogical impact over theoretical purity.

  I need to preserve their core triad: (1) forced-choice quiz with mixed question types (2) deceptive higher-order evidence via envelopes (3) revision phase where akrasia might emerge. But several elements need refinement:
  - The blank envelopes add unnecessary complexity - better to simplify to just "manipulated" vs "clean" groups
  - Payoff structure must incentivize truth-seeking, not just confidence reporting
  - Timing for a 90-minute session needs strict partitioning
  - Debrief must scaffold from concrete decisions to abstract concepts

  Major predictable failures:
  Cognitive: Students might not internalize the envelope probabilities, especially under time pressure. Some may brute-force check all verifiable questions despite instructions.
  Behavioral: Peer influence during revision phase could override individual reasoning. The "manipulated" group might overcorrect.
  Logistical: Envelope distribution could create visible patterns. Question ambiguity might generate false first-order errors.

  The activity can't reproduce cases where higher-order evidence directly conflicts with first-order perception (e.g., drug-induced unreliability). This gap must be addressed in post-activity discussion.

  Most fragile element: The confidence ratings. Students may conflate confidence in memory with confidence in reasoning, or anchor to initial ratings. A botched confidence measure could teach that epistemic states are more stable than they actually are.

  Verdict: The confidence rating scale - if poorly designed, it risks masking the akratic tension rather than revealing it.
answer: |-
  Here’s a refined, runnable design for your 90-minute session, followed by failure mode analysis and self-critique. The goal is to induce visceral epistemic akrasia before labeling it.

  ---

  ### **Session Design: "The Reliability Test"**
  **Total Time:** 90 mins  
  **Materials:**  
  - 14 identical quiz packets (12 Qs: 6 *verifiable* [arithmetic/syllogisms], 6 *unverifiable* [obscure geography trivia])  
  - 14 sealed envelopes (5 "MANIPULATED", 5 "CLEAN", 4 "NO INFO")  
  - Whiteboard for rules/payoffs  
  - Timer  
  - Answer key (for debrief)  

  **Phase 1: Quiz & Initial Confidence (25 mins)**  
  - **Rules:**  
    - 12 multiple-choice questions (30 sec/Q). For verifiable Qs, students *may* recalculate but *only during the initial phase*.  
    - After each answer, rate confidence: 3 (Certain) | 2 (Probable) | 1 (Guessing).  
    - **Payoff:** Correct answer + confidence rating = points (e.g., Correct @3=3pts; Incorrect @3= -3pts).  
  - **Execution:**  
    - Strict timing. Collect quizzes immediately.  

  **Phase 2: Envelope Reveal & Revision (20 mins)**  
  - **Envelope Distribution:**  
    - Shuffle envelopes visibly. Students draw one. Announce: "5 get 'MANIPULATED' (quiz subtly points to wrong answers), 5 'CLEAN', 4 'NO INFO'."  
    - *Truth:* All quizzes are identical; envelopes contain only higher-order evidence.  
  - **Revision Phase:**  
    - Return original quizzes. Students review Qs *without recalculating verifiable Qs* (emphasize: "No re-verification now").  
    - For each Q, decide: **STICK** or **SWITCH** to another option.  
    - Re-rate confidence (same 1-3 scale).  
    - **Revised Payoff:** Points based on *revised* answer/confidence.  

  **Phase 3: Debrief & Concept Mapping (45 mins)**  
  - **Reveal Truth:** All quizzes identical; envelopes were pure higher-order evidence.  
  - **Analyze Data:**  
    - Compare initial vs. revised answers/confidence. Highlight:  
      - Cases where students switched *verifiable* Qs due to envelope (e.g., arithmetic, despite no re-check).  
      - Cases where students stuck but reported in debrief: "I knew my math was right, but the envelope made me doubt."  
  - **Concept Scaffolding:**  
    1. **First- vs. Higher-Order Evidence:**  
       - "Your calculation = first-order evidence. The envelope = evidence *about* your evidence."  
       - Map: "When you switched on math due to the envelope, you overrode first-order with higher-order."  
    2. **Epistemic Akrasia:**  
       - "Did anyone think: 'My answer is correct, but I shouldn't trust it'? That tension is akrasia."  
       - Use student quotes: "I stuck but felt like a hypocrite—that’s akrasia."  
    3. **Defeat vs. Downgrade:**  
       - "Did the envelope *lower* confidence (downgrade) or *force* a switch (defeat)?" Contrast verifiable vs. trivia Qs.  
    4. **Re-verification Escape Hatch:**  
       - "Could you 're-check' your way out? Why was it banned? Relate to debates: Can fresh first-order evidence override higher-order doubts?"  

  ---

  ### **Predictable Failure Modes**  
  1. **Envelope Skepticism:** Students may disbelieve the 5/5/4 split ("Prof tricked us"). *Mitigation:* Shuffle envelopes publicly; state probabilities clearly.  
  2. **Verifiable Q Recalculation:** Students sneak re-checks despite rules. *Mitigation:* Ban calculators; patrol during revision.  
  3. **Peer Influence:** Students confer ("What envelope did you get?"). *Mitigation:* Seat apart; strict silence rule.  
  4. **Confusion in Revision:** Misunderstanding "STICK/SWITCH." *Mitigation:* Demo one example.  
  5. **Trivia Qs Flop:** Obscure geography may feel "unfair," reducing engagement. *Mitigation:* Use mildly challenging but plausible trivia (e.g., "Capital of Kyrgyzstan?").  

  ---

  ### **What the Activity Can’t Reproduce**  
  **The normative force of higher-order evidence.** Students may experience akrasia as *psychological* (doubt due to envelope) but not grasp why philosophers argue it could be *rationally required*. Post-activity discussion must clarify: "Even if your math was correct, should the higher-order evidence compel a rational agent to doubt?"  

  ---

  ### **Self-Critique: Where Reasoning Might Fail**  
  **Assumption:** Students will feel akrasia when sticking to verifiable answers post-manipulation envelope.  
  - **Failure Risk:** Students with "MANIPULATED" envelopes may switch indiscriminately (no akrasia—they fully defer). Those with "CLEAN" may become overconfident. Only "NO INFO" or conflicted "MANIPULATED" students might feel tension.  
  - **Corrective Observation:** During debrief, listen for:  
    - "I knew 2+2=4, but the envelope said I was messed with, so I switched... but it felt wrong." → *Success*.  
    - "I got 'MANIPULATED,' so I switched all my answers—duh." → *Failure* (akrasia not elicited).  
    - If few report tension, emphasize the "stuck but conflicted" cases in discussion.  

  **Verdict:** The envelope labeling ("MANIPULATED") is most likely to teach the wrong lesson by incentivizing blind deference rather than genuine evidence conflict. Students might treat it as a game-theoretic signal, not epistemic evidence.  

  ---

  **Final Note:** Run this *before* introducing readings (e.g., Titelbaum, Christensen). The visceral confusion is the hook—then use debrief to show how philosophers systematize it. Good luck!
