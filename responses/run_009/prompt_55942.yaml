  I'm a second-year PhD student and my advisor says I need to have a proper research propsoal before the end of term, ideally something I could also adapt for the departmental summer funding call. The thing I keep circling around is the whole blame-Germany-for-WWI mess (the Fischer controversy, the war guilt clause at Versailles, all of it). My half-baked thought is that everyone in that fight -- Fischer and his critics alike -- ran together at least three different questions: (a) who caused the war in some counterfactual sense, (b) which individual decision-makers were blameworthy given what they knew and what options they realistically had, and (c) whether "Germany" as some kind of corporate agent can be blamed at all, as opposed to its being a shorthand for a bunch of people in July 1914. And I suspect the Versailles reparations machinery made this worse, because reparations needed ONE legally culpable party, so the diplomacy and the historiography both got squeezed into a single-blame format that the underlying events didn't fit. That's my angle, roughly: the debate wasn't just politically heated, it was conceptually malformed, and it's still malformed when people argue about it today.

  What I want from you is the actual proposal text: state the research question precisely (make it something that could in principle get an answer, not just "it's complicated"), say why the existing positions on the war-guilt question leave my question open, describe what I'd actually DO for a year of dissertation work on this -- what distinctions I'd build, what cases beyond Germany 1914 I'd test them on so it's not just another round of the same fight (I'm thinking maybe comparing how blame got assigned after other wars, but you pick), and what would honestly count as the project failing or turning out to be trivial. My advisor hates proposals with no failure condition, so please include one. No citations needed, I'll drop those in myself later -- just refer to positions and arguments by description. Keep the whole thing under 800 words or she genuinely won't read it, and don't make it sound like a template, she can smell those from a mile off.
