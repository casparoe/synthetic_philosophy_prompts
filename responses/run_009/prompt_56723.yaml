  ### Peer Disagreement Quiz  
  **Instructions:** For each scenario, select the option that best reflects what you would genuinely do in that situation. There are no trick questions—answer based on your instinctive epistemic reaction.  

  #### Questions  
  1. **Flawed Reasoning (Specific Flaw Case)**  
     You and a colleague—both experienced in logic puzzles—work on one independently. You conclude the answer is 47. Your colleague insists it’s 52. In discussion, you spot a clear error in their calculation (e.g., misapplying the distributive property). They dismiss your critique. How do you react?  
     a) I become less certain of my answer (e.g., from 95% to 75%).  
     b) I remain just as confident in my answer—their mistake is obvious.  
     c) I withhold judgment until we consult a third party.  

  2. **Overwhelming Majority (One vs. Eleven)**  
     Twelve climate scientists, including you, independently model sea-level rise using identical data. Eleven predict a 1.2-meter increase by 2100; you get 1.8 meters. You’ve triple-checked your code and found no errors. All have your expertise. How do you respond?  
     a) I lower my confidence significantly (e.g., from 90% to 50%).  
     b) I stay just as sure of my 1.8-meter result—my checks were thorough.  
     c) I suspend belief and re-run all models.  

  3. **Meta-Disagreement (Disagreement About Disagreement)**  
     Two renowned epistemologists—both sharper than you—debate how to handle peer disputes. Dr. Alpha argues you should always defer to peers; Dr. Beta insists you should trust your reasoning. Their disagreement is unresolved. You initially sided with Dr. Beta. How does this affect your view?  
     a) I become less confident in my position—experts disagree deeply.  
     b) I hold steady—my reasons for supporting Dr. Beta still stand.  
     c) I abandon my view until I can resolve this debate.  

  4. **Evaluative Judgment (Grant Proposal)**  
     You and a fellow ethicist—equally qualified—review a philosophy grant. You deem it groundbreaking; they call it mediocre. After discussing, you realize you weight "originality" differently, and neither convinces the other. What happens to your assessment?  
     a) I downgrade my evaluation (e.g., "maybe it’s only good, not great").  
     b) I stick with "groundbreaking"—my standards are sound.  
     c) I withhold endorsement pending a tiebreaker.  

  5. **Secondhand Report (Unvetted Source)**  
     A podcast mentions a biologist with your credentials and data rejects your conclusion about CRISPR risks. The host offers no details on their reasoning, and you doubt the podcast’s accuracy. How does this impact your confidence?  
     a) I lower my confidence—a peer disagrees, regardless of the source.  
     b) I dismiss it—without reliable details, it’s not evidence.  
     c) I suspend belief until I verify the report.  

  6. **Numerical Confidence (Jellybeans in a Jar)**  
     You and a friend—equally skilled estimators—guess independently. You’re 90% sure there are 800–900 beans; they’re 90% sure it’s 950–1050. Discussing, neither finds flaws in the other’s method. What happens to your 90% confidence?  
     a) I drop to ~60%.  
     b) I drop slightly to ~85%.  
     c) I become agnostic.  

  7. **Suspension vs. Belief (Chemical Reaction)**  
     You and a lab partner replicate an experiment. You observe a clear reaction; they see nothing. Equipment checks out, and both are meticulous. You’re certain you didn’t hallucinate. How do you proceed?  
     a) I remain fully convinced the reaction occurred.  
     b) I suspend judgment—I no longer believe it occurred.  
     c) I lean toward "it occurred" but am less sure.  

  8. **Historical Interpretation**  
     You and a peer historian—same archives, same training—interpret a medieval letter. You think it implies King John was illiterate; they think it doesn’t. After debate, neither budges. What do you do?  
     a) I reduce my confidence in the illiteracy claim.  
     b) I stand by my reading—the text supports it.  
     c) I withhold belief pending new evidence.  

  9. **Moral Disagreement**  
     You and a philosopher friend—equally reflective—judge a thought experiment. You see a lie as impermissible; they see it as justified. Discussion reveals irreconcilable intuitions. How do you react?  
     a) I become less certain the lie is wrong.  
     b) I hold firm—my moral reasoning feels solid.  
     c) I suspend moral judgment here.  

  10. **Scientific Theory Choice**  
      You and a fellow physicist—equally competent—interpret quantum data. You favor Theory X; they favor Theory Y. After hours of debate, neither concedes. What happens next?  
      a) I lower my confidence in Theory X.  
      b) I stay just as confident in Theory X.  
      c) I abandon both theories until new data emerges.  

  ---

  ### Scoring Key  
  **How to score:** Tally your answers using the table below. Match the pattern of A/B/C responses to the views. Philosophers associated with each view are noted for reference.  

  | View | Core Position | Philosophers | Diagnostic Answer Pattern | Gaps/Limitations |  
  |------|---------------|--------------|----------------------------|------------------|  
  | **Equal Weight (EW)** | Split the difference in confidence when peers disagree. | Christensen, Elga | Mostly **A** (esp. Q1, Q6, Q8, Q9, Q10), occasional **C**. Avoids **B** in symmetric cases. | Cannot distinguish from Full Withholding if you pick **C** everywhere. |  
  | **First-Order Evidence Swamping (FOS)** | Strong first-hand evidence overrules peer dissent. | Kelly, Sosa | **B** when evidence is direct/checked (Q1, Q2, Q7); **A** or **C** elsewhere (Q3–Q6, Q8–Q10). | Collapses into Steadfast if you pick **B** in Q4/Q9 (evaluative/moral). |  
  | **Right Reasons (RR)** | Hold steady if your reasoning was sound—even if others disagree. | Titelbaum, Weatherson | **B** in *all* cases (Q1–Q10). | Indistinguishable from Lonely Steadfast (differs only in justification). |  
  | **Lonely Steadfast (LS)** | Reasonable people can persist, believing they’re "lucky" to be right. | van Inwagen | **B** in *all* cases (Q1–Q10). | Quiz cannot separate from RR (needs a case where you *haven’t* checked your work). |  
  | **Full Withholding (FW)** | Withhold judgment in all peer disagreements—you can’t rule out error. | Feldman | Mostly **C** (esp. Q2, Q7, Q10), **A** only if forced. Avoids **B**. | Indistinguishable from EW if you pick **A/C** mix without **C**-only dominance. |  
  | **Dig-In (DI)** | Never discount being the unreliable one—so double down on your view. | (Uncommon; hybrid) | **B** in *all* cases (like RR/LS), but motivated by fear of self-doubt. | Quiz cannot distinguish from RR/LS (same answers; differs in psychology). |  

  #### Unoccupied Positions & Gaps  
  The quiz cannot detect:  
  - **"Domain-Specific" Views** (e.g., conciliatory in science but steadfast in ethics): Answers like **B** in Q4/Q9 (evaluative/moral) but **A/C** elsewhere are *consistent* but unattractive—no major philosopher defends this ad hoc split.  
  - **Asymmetry-Exploiting Steadfastness**: Picking **B** only when you "see a flaw" (Q1) or "re-checked" (Q2) but **A/C** otherwise. Logically coherent but unexplored—no theory privileges *your* checks as uniquely decisive.  
  - **Strong Conciliationism Without Suspension**: All **A** (no **C**). Consistent but rare; most conciliationists accept suspension in extreme cases (e.g., Q2, Q7).  

  #### Why Certain Views Collapse  
  - **EW vs. FW**: Cannot separate if you pick **C** in Q6/Q8/Q10 but **A** in Q1/Q4. Needed: A case where suspension is irrational (e.g., trivial arithmetic).  
  - **RR vs. LS vs. DI**: Identical answer patterns. Needed: A case where you *lack* independent checks (e.g., "You solved a puzzle quickly; peers disagree").  
  - **FOS vs. RR/LS**: If you pick **B** in evaluative/moral cases (Q4/Q9), FOS collapses into steadfastness. FOS requires conciliation where first-order evidence is "soft."  

  **Note**: This key prioritizes honesty over precision. If your pattern spans multiple views, you may hold a hybrid position—or vanity might be selecting flattering answers! For academic sources, see the philosophers cited.
