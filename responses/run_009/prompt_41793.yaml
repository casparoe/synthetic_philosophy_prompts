prompt: |-
  Been arguing with my brother about Wittgenstein's private language thing and I realize I've just been going with my gut on cases rather than having any actual theory, so let me lay out my verdicts and you tell me if anything captures them.

  Case 1: guy stranded alone on an island keeps a diary of his recurring headaches, marking them with a squiggle he invented. My gut says that's fine, it's a real language, even though no one else will ever read it. Case 2: someone tries to keep a diary of a particular private sensation, writing "S" each time it occurs, with nothing but her memory of previous entries to check against. This one feels broken to me in a way case 1 doesn't, though I can't say why exactly — the islander at least has headaches as an anchor? Case 3: a chemist names a compound only she has ever synthesized, nobody else could currently check her usage. Obviously fine, not even a little broken. Case 4: someone invents a word for a private twinge that comes with her tinnitus and explains it to friends by analogy ("like pins and needles but colder"), friends get roughly it. Fine. Case 5: same as 4 except the friends can NEVER recognize the twinge, they just take her word for it each time. And... honestly this feels okay to me too? But it's structurally a lot like case 2, and I can't get both verdicts to sit together.

  My tentative principle is something like "the word has to be tied to something that could in principle be checked by others." But that rules case 2 broken (good) and case 5 fine only if you squint (she's the check?), and I can't figure out why the chemist's "only I can check this, for now" differs from case 5's "only she can check this, ever" in a way that makes one obviously fine and the other merely tolerable.

  So: is there a cleaner principle that saves most of my verdicts, and which ones do I have to drop? And tell me what it says about a case I didn't list — a woman who's a tetrachromat among us ordinary trichromats, who insists she can distinguish two shades everyone else sees as identical and names them, and we just take her word for it. Keep it under 400 words please, I genuinely will stop reading past that.
