  - "discriminating_case": an object with "description" (a new case, described concretely, on which the leading candidate rules diverge), "rules_it_distinguishes", and "what_each_rule_predicts".

  After the JSON, add one brief paragraph flagging anything in his record that resists capture by any single rule, so I know where my hypothesis might be wrong.
