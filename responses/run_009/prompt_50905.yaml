  ### 2. Disagreements
  We have the following unresolved disagreements, which we clarify below. For each, we state the positions and an agreed-upon test with predictions.

  #### Crux 1: Ontological Status of Features
  - **Realist Position**: Features (e.g., "deception features") are real computational primitives in the network, existing prior to and independent of our probing tools.
  - **Deflationist Position**: Features are not objective entities but are interest-relative descriptions we impose; the network only has weights and activations.
  - **Agreed Test**: 
    - We will apply multiple feature extraction methods (e.g., sparse autoencoders with different hyperparameters, NMF, ICA) to the same model. We will measure:
