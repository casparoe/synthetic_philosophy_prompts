answer: |-
  ## Joint Statement: Adversarial Collaboration on Interpretability Ontology  
  *Drafted per PI request to clarify disagreements and agreements between realism and deflationism camps*  

  ### 1. Agreed Empirical and Conceptual Claims  
  We jointly affirm the following, based on reproducible observations and shared principles:  

  1. **Engineering Utility**: Steering vectors and sparse autoencoder features demonstrably alter model behavior (e.g., inducing refusal in code contexts) with greater precision and reliability than expected by random chance.  
  2. **Cross-Model Feature Recurrence**: Features associated with specific behaviors (e.g., "deception") emerge across independently trained models of the same architecture, even with varied random seeds/data orders.  
  3. **Probe Generalization**: Linear probes trained on one distribution of activations often generalize to out-of-distribution inputs and partially transfer to architecturally similar models.  
  4. **Non-Artifactual Steering**: The efficacy of steering vectors cannot be fully explained by probe overfitting or measurement artifacts.  
  5. **Minimal Ontological Commitment**: The network’s fundamental components are weights and activation vectors. Claims about "features" or "circuits" require empirical verification beyond intuitive appeal.  
  6. **Narrative Insufficiency**: A human-readable "story" about weights/activations (e.g., "this circuit implements deception") is insufficient evidence for feature objectivity.  
  7. **Retrain Stability Observation**: Retraining identical architectures on identical data often yields behaviorally near-identical models with poorly aligned internal activations (e.g., low CKA similarity).  

  ---

  ### 2. Disagreements and Testing Protocol  
  The table below documents unresolved disagreements, phrased neutrally and endorsed by each camp. For each crux, we specify an agreed-upon test and pre-registered predictions.  

  | Crux                                                                                                | Realist Position                                                                                                | Deflationist Position                                                                                                | Agreed Test & Predictions                                                                                                                                                                                                                                                                                               |  
  |-----------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Ontological status of features**<br>*Are features mind-independent computational primitives?*     | Features (e.g., "deception vectors") reflect causal structures in the network prior to measurement—akin to latent variables in scientific models. Their recurrence suggests discovery, not invention. | Features are pragmatic clustering heuristics. Their utility stems from our predictive goals, not pre-existing "joints in nature." Recurrence reflects task constraints, not ontological discovery. | **Test**: Train 100 SAEs on the same model with randomized initializations and hyperparameters. Measure variance in feature semantics (via automated interpretation) and causal efficacy.<br>→ *Realist prediction*: >70% of high-impact features (e.g., top-10 steering efficacy) will converge semantically.<br>→ *Deflationist prediction*: Semantic variance will correlate with SAE hyperparameters; no convergence above chance. |  
  | **Retrain stability implications**<br>*What do non-aligned internals imply about feature reality?* | Retrain stability shows features are multiply realizable: different weight configurations can implement identical high-level functions. Non-alignment is expected and doesn’t undermine feature objectivity. | Retrain stability shows features are measurement-dependent artifacts. If features were real, functionally identical models should share invariant internal structures under cross-probing. | **Test**: Train 10 behavioral clones (same loss, different seeds). Extract steering vectors for a fixed behavior (e.g., code refusal) in each. Apply each vector across all clones and measure effect consistency.<br>→ *Realist prediction*: Vectors will transfer successfully (>80% behavior match) despite low CKA similarity.<br>→ *Deflationist prediction*: Transfer will fail (<50% match) unless vectors are retuned per model. |  
  | **Causal depth**<br>*Do features have model-internal causal power?*                                | Steering vectors tap into directional causes within the computational graph. Their efficacy implies features are causal intermediaries, not just correlates. | Features summarize activation-behavior correlations. Their causal power is borrowed from the probe’s external imposition; they don’t participate in the model’s native computation. | **Test**: Ablate neurons contributing most to a feature. Compare behavior change against ablating random neurons with identical activation norms.<br>→ *Realist prediction*: Feature-targeted ablation disrupts behavior 3× more than norm-matched random ablation.<br>→ *Deflationist prediction*: Both ablations will show statistically similar disruption (feature "causality" is an artifact of correlation). |  

  ---

  ### 3. Purely Verbal Disagreements  
  We identify one core terminological ambiguity:  
  - **"Representation"**: The term is used in three distinct senses:  
    1. *Activation encoding* (agreed): Activations carry information about inputs.  
    2. *Decomposition primitive* (disputed): Whether SAE features reflect natural computational units.  
    3. *Cognitive analogy* (disputed): Whether features "represent" concepts *as humans do*.  
  **Resolution**: We will replace "representation" with precise terms: "activation information" (sense 1), "feature vector" (sense 2), and "cognitive analog" (sense 3).  

  ---

  ### Residual Disagreement  
  This document does not seek consensus. We remain divided on whether *the recurrence and steerability of features imply their mind-independent existence in the model’s computational structure*. The realist camp holds this is an open empirical question; the deflationist camp maintains it confuses predictive utility for ontological discovery. The agreed tests above will empirically resolve specific sub-disputes but not this core philosophical divergence.  

  ---  
  *This draft ratified for accuracy by both camps on [DATE]*  
  **Realist Signatories**: ___________________  
  **Deflationist Signatories**: ___________________
