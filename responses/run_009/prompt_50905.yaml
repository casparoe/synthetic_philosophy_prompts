prompt: |-
  my research group has been stuck in the same fight for a year now and our PI suggested we do one of those adversarial collaboration writeups before we keep talking past each other. I want you to draft the joint statement we'd theoretically produce at the end of it.

  The two camps: on one side, the realists about interpretability -- the people who think that when sparse autoencoder methods find a "deception feature" or a steering vector that makes a model refuse to answer questions about code, they've found something that is really in the network, prior to and independent of our probing tools. On the other side, the deflationists -- people who think "features" and "circuits" are interest-relative descriptions of our own making: the network has activation vectors and weights, full stop, and everything above that level is a clustering we impose because it helps us predict and steer, not a joint in nature. (Nobody in the second camp doubts the engineering value of the work, to be clear -- they just deny it's discovery.)

  Here's what I want in the document:

  1. A numbered section of claims both camps can actually sign. Include the empirical stuff they agree on -- steering works better than you'd expect if features were pure artifacts, probes often generalize out of distribution, the same kinds of features show up across models trained on different data, etc. -- but also the conceptual agreements, e.g. about what would NOT count as evidence (like a human finding a nice story to tell about some weights).

  2. The disagreements, each phrased so the camp it's about would accept the wording without wincing. I'm specifically interested in where they fall on the crux of what I've been calling retrain stability: if you retrain the same architecture on the same data with a different random seed or data order and get behaviorally near-identical models whose internals line up poorly with each other, what does that show? The realists in my group think the jury is genuinely out on that one and I want it recorded honestly rather than smoothed over.

  3. For each crux, a concrete experiment or argument both sides would agree bears on it, with each side's prediction written down in advance. This is the part I care most about -- I've watched too many interpretability arguments where both sides claim the same result vindicates them after the fact.

  4. Flag whether any part of the dispute is purely verbal, and if so which part. I have a suspicion that "the model has representations" means at least three different things in our meetings and we've never once untangled them, but I could be wrong.

  Format: numbered agreed claims first, then a table (or table-like structure) for the disagreements with columns for the crux, the realist position, the deflationist position, and the agreed-upon test. Keep the language neutral enough that neither side would say the framing rigs it for the other guy. And please don't have them converge at the end -- the whole point of this document is to make the residual disagreement exact, not to paper over it.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two camps in an interpretability research group: realists and deflationists.

  The structure we need:
  1. A numbered section of agreed claims (both empirical and conceptual).
  2. A table (or similar) for disagreements, with:
     - The crux (e.g., retrain stability)
     - Realist position
     - Deflationist position
     - Agreed-upon test/experiment and each side's prediction
  3. Flag any purely verbal disputes.

  Instructions:
  - Keep language neutral.
  - Do not converge at the end; make residual disagreement exact.
  - For the agreed claims, include both empirical agreements (steering works, probes generalize, etc.) and conceptual agreements (what doesn't count as evidence).

  Let's start with the agreed claims.

  ### Section 1: Agreed Claims

  We, the undersigned, agree on the following points:

  1. **Engineering Utility**: The methods of sparse autoencoders and steering vectors have demonstrated significant practical value in understanding and controlling model behavior. For example, steering vectors can be used to consistently alter model outputs (e.g., inducing refusal in code-related questions) across a variety of prompts.

  2. **Empirical Robustness**: 
     a. Steering interventions often work better than would be expected if the identified features were purely artifacts of the probing method. The effects are robust across different prompts and sometimes even out-of-distribution.
     b. Probes (such as linear classifiers) trained on one set of activations often generalize to unseen data and even to different models with similar architecture and training data, suggesting some underlying consistency.

  3. **Cross-Model Consistency**: When applying the same interpretability methods to different models (e.g., same architecture trained on the same data but with different random seeds), we often observe similar features (e.g., "deception features") that can be used for similar steering effects.

  4. **Conceptual Agreements**:
     a. The existence of a compelling narrative about a set of weights or activations (e.g., a "story" about a circuit) is not, by itself, sufficient evidence for the objective existence of that feature or circuit in the model. Such narratives may be post hoc and subject to confirmation bias.
     b. The network's fundamental components are weights and activations (vectors). Any description at a higher level (e.g., "features", "circuits") is a product of our analytical tools and objectives.

  5. **Retrain Stability Phenomenon**: We agree that when retraining the same architecture on the same data with different random seeds or data order, we sometimes obtain models that are behaviorally near-identical (i.e., they produce similar outputs on the same inputs) but whose internal activations and weights do not align well under standard metrics (e.g., linear probing or activation clustering). This phenomenon is observed and requires explanation.

  Now, for the disagreements, we structure them in a table. We'll have the following columns: Crux, Realist Position, Deflationist Position, Agreed Test and Predictions.

  We'll list the key cruxes. The main one mentioned is retrain stability, but there might be others. Let's identify:

  - Crux 1: The ontological status of features (are they "real" or imposed by our tools?).
  - Crux 2: The interpretation of retrain stability (what does it say about the reality of features?).

  But note: the retrain stability is a specific test case for the broader ontological question.

  We can structure the table as:

  | Crux | Realist Position | Deflationist Position | Agreed Test and Predictions |
  |------|------------------|-----------------------|----------------------------|
  | ...  | ...              | ...                   | ...                        |

  ### Section 2: Disagreements

  We have identified the following points of disagreement, which we clarify below.

  #### Crux 1: Ontological Status of Features

  - **Realist Position**: The features (e.g., "deception features") identified by interpretability tools (like sparse autoencoders) are real entities in the network that exist prior to and independently of our probing tools. These features are causally involved in the model's computations and are not merely artifacts of our analysis. When we find a feature that consistently correlates with and can control a behavior (like refusal), it reflects a genuine computational primitive of the model.

  - **Deflationist Position**: Features and circuits are not objective entities in the network but are instead interest-relative descriptions that we impose. The network only has weights and activation vectors; any grouping of these into "features" or "circuits" is a clustering that we do because it helps us predict and steer the model. While these descriptions are useful, they do not correspond to a "joint in nature" in the model's internal structure.

  #### Crux 2: Interpretation of Retrain Stability

  - **Realist Position**: The phenomenon of retrain stability (where behaviorally similar models show poor alignment of internals) does not necessarily undermine the reality of features. It may indicate that the same high-level computational primitives (features) can be implemented by different low-level structures (weights and activations) across models, much like how biological systems can achieve the same function with different implementations. The jury is still out on whether the features we identify are stable across retrainings, and if they are not, it might be because we have not found the right level of abstraction or because the models are not functionally identical in the relevant aspects.

  - **Deflationist Position**: The retrain stability phenomenon (poor internal alignment across behaviorally similar models) supports the deflationist view. If the same high-level behavior can be implemented by very different internal structures, then the specific features we identify in one model are not fundamental to the computation but are contingent on the particular training run. This suggests that the features we identify are not universal and thus not "real" in the sense of being inherent in the network independently of our analysis.

  #### Agreed Test and Predictions for Crux 2 (Retrain Stability)

  We agree to conduct the following experiment to test the implications of retrain stability:

  - **Experiment**: 
    1. Train multiple instances of the same model architecture on the same dataset, varying only the random seed and data order.
    2. Ensure these models are behaviorally near-identical (by testing on a broad set of inputs).
    3. Apply the same interpretability methods (e.g., sparse autoencoders) to each model to identify features (e.g., a "deception feature").
    4. Measure the alignment of these features across models. We will use two types of alignment metrics:
       a. **Inter-model feature alignment**: For a given feature (e.g., "deception") in model A, how well does the corresponding feature vector in model A transfer to model B? (e.g., by using the steering vector from model A on model B and observing if it produces the same behavioral effect).
       b. **Structural alignment**: Compare the internal representations (e.g., via Canonical Correlation Analysis (CCA), centered kernel alignment (CKA), or other similarity metrics) of the models to see if the features are in similar directions in activation space.

  - **Realist Prediction**: 
    - The realist camp predicts that, despite differences in the exact weights and activations, the same high-level features (like deception) will be found in each model and that the steering vectors will transfer across models with high fidelity (i.e., applying model A's steering vector to model B will induce the same behavioral effect). They also predict that structural alignment metrics will show significant similarity in the relevant subspaces when aligned by feature function.

  - **Deflationist Prediction**: 
    - The deflationist camp predicts that the steering vectors will not transfer well across models. They expect that the same behavioral effect (e.g., inducing refusal) might require finding a new steering vector for each model, and that the internal representations will show poor alignment under standard metrics. They also predict that the features identified in one model will not have a consistent counterpart in another model in terms of direction or structure.

  #### Crux 3: What Constitutes a "Joint in Nature"

  - **Realist Position**: There are natural joints in the network's computational structure that our interpretability tools can discover. These joints are defined by the causal role of the feature in the model's computation and are not arbitrary.

  - **Deflationist Position**: There are no natural joints in the network's structure beyond the weights and activations. Any grouping into features is arbitrary in the sense that different groupings might serve different purposes equally well, and the success of a grouping does not imply it corresponds to a pre-existing structure.

  #### Agreed Test for Crux 3

  - **Experiment**: 
    - We agree to test whether there is a unique or privileged way to decompose the network into features. We will take a set of activations from a model and apply multiple different feature extraction methods (e.g., sparse autoencoders with different hyperparameters, non-negative matrix factorization, independent component analysis, etc.) and evaluate:
      a. How well the features from each method predict the model's behavior.
      b. Whether the features from one method can be linearly reconstructed from another method's features (i.e., is there a consistent basis?).
      c. Whether the features from one method can be aligned with those from another method in a way that preserves their functional roles.

  - **Realist Prediction**: There will be a high degree of consistency between the features extracted by different methods that are successful at prediction and control, suggesting they are approximating the same underlying structure.

  - **Deflationist Prediction**: Different methods will yield different sets of features that are similarly effective for prediction and control, and there will be no consistent mapping between them, supporting the idea that the choice of features is interest-relative.

  ### Section 3: Purely Verbal Disputes

  We note that part of the dispute may be verbal. Specifically:

  - The term "representation" is used in at least three distinct ways in our discussions:
    1. As an activation vector that carries information about an input (e.g., a neuron's activation).
    2. As a feature that is a component of the model's computation (e.g., a vector in a sparse autoencoder's dictionary).
    3. As a high-level concept that the model "understands" (e.g., the concept of deception).

  Additionally, the term "real" is ambiguous. We agree that features are real in the sense of being useful tools for prediction and control. The disagreement is whether they are real in the sense of being objective, mind-independent structures in the network.

  We agree to disambiguate these terms in future discussions.

  ### Final Note

  This document does not resolve the disagreements but clarifies them and sets the stage for empirical testing. Both camps commit to updating their views based on the outcomes of the agreed tests.

  Signed:

