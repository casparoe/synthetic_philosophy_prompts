  #### Crux 2: Retrain Stability and Feature Transfer
  - **Realist Position**: The phenomenon of retrain stability (behavioral similarity with poor internal alignment) is compatible with feature realism because features may be implemented by different low-level structures. The jury is out on whether features are stable across retrainings.
  - **Deflationist Position**: Retrain stability undermines feature realism because it shows that the specific features identified are contingent on the training run and not fundamental to the behavior.
  - **Agreed Test**:
    - We will train multiple models (same architecture, same data, different seeds/data order) and verify behavioral similarity.
    - For each model, we will use the same interpretability method to find a specific feature (e.g., a "deception feature").
