prompt: |-
  Like many people here, I've spent years on LessWrong and adjacent forums, so the vocabulary I actually think in is the house one: utility functions, revealed preferences, optimization targets, budget constraints, agent-environment framings, coherent extrapolated volition, QALY-style aggregation. I'd like the "equality of what?" debate restated in those terms. Specifically, take the three main answers — equality of welfare, Dworkin's equality of resources (including his distinction between brute luck and option luck, and the envy test), and Sen's capability approach (resources versus what people can actually do with them) — and translate each into my vocabulary. Welfare egalitarianism presumably becomes something like equalizing a utility scalar across agents, resource egalitarianism something like equalizing the budget set each agent faces before optimization begins, and the capability view something about the size and shape of the feasible action space, or the mapping from resources to outcomes under heterogeneous architectures. Do this as faithfully as you can, flagging where you have to distort to make it fit.

  Then I want the residue report. Which parts of the philosophical debate translate cleanly, which survive only in distorted form, and which have no counterpart in my vocabulary at all? I'm especially interested in whether the following are expressible on my side: expensive tastes (one agent's utility function prices the same goods much higher), adaptive or preference-formation problems (an agent whose utility function was shaped by scarcity, so equalizing measured utility ratifies the scarcity), and Dworkin's insistence that we compensate people for unchosen endowments but not for the results of chosen gambles. And finally, the diagnostic question: where there's residue, is it because the rationalist framework is missing something real, or because the philosophical position was less crisp than it looked on paper? I'd rather know which of my commitments I'd have to give up than get a diplomatic answer.
reasoning: |-
  We are going to translate the three main approaches to equality (welfare, resources, capabilities) into the rationalist vocabulary. We'll then discuss the residue: what doesn't translate cleanly.

  ### 1. Welfare Egalitarianism
  **Philosophical view**: The goal is to achieve equality in welfare (well-being, happiness, satisfaction) across individuals.

  **Translation**: 
  - Each agent has a utility function \( u_i \) that maps their state (or resource bundle) to a real number (utility scalar). 
  - Welfare egalitarianism aims to equalize the utility scalar across agents: for all agents \( i \) and \( j \), \( u_i = u_j \).

  **Notes**: 
  - This assumes interpersonal comparability of utility, which is a strong assumption in economics (though common in social choice). 
  - It also assumes that utility is a scalar and that we can measure it.

  ### 2. Resource Egalitarianism (Dworkin)
  **Philosophical view**: Equality of resources. Dworkin distinguishes between brute luck (unchosen circumstances) and option luck (results of deliberate gambles). The envy test: a distribution is equal if no one prefers someone else's bundle of resources to their own.

  **Translation**:
  - Each agent \( i \) has a budget set \( B_i \) (the set of resource bundles they can afford). 
  - Resource egalitarianism requires that all agents face the same budget set: \( B_i = B_j \) for all \( i, j \). 
  - The envy test: for every agent \( i \), there is no agent \( j \) such that \( i \) strictly prefers \( j \)'s chosen bundle \( x_j \) (from the common budget set) to their own chosen bundle \( x_i \). 

  **Brute luck vs. option luck**:
  - Brute luck: Aspects of the agent's endowment (e.g., health, innate talents, inherited wealth) that are outside their control. We model this as part of the initial state that the agent did not choose. 
  - Option luck: The outcome of risks that the agent voluntarily took. We model this as a choice from a set of lotteries (or actions with uncertain outcomes) that the agent selected. 
  - Dworkin's compensation: We compensate for brute luck (by adjusting the budget set to offset disadvantages) but not for option luck (since the agent chose the gamble).

  ### 3. Capability Approach (Sen)
  **Philosophical view**: Focuses on what people are actually able to do (capabilities) and what they manage to achieve (functionings). It's about the freedom to achieve well-being, not just the resources or the utility.

  **Translation**:
  - Each agent \( i \) has a set of feasible actions (or strategies) \( A_i \). Each action leads to an outcome (which may include states of the world and functionings). 
  - The capability set is the set of outcomes (or vectors of functionings) that the agent can achieve: \( C_i = \{ f(a) \mid a \in A_i \} \), where \( f \) maps actions to outcomes/functionings.
  - Equality of capabilities would require that the capability sets \( C_i \) be equal across agents. Alternatively, we might require that the sets are equally valuable (but then we need a valuation function).

  **Note**: 
  - The capability set is more than the budget set: it accounts for how resources translate into functionings, which can vary by agent (e.g., due to disability: two people with the same resources might have different capabilities because one needs a wheelchair).

  ### Residue Report

  #### What translates cleanly?
  - **Welfare egalitarianism**: The translation to equalizing utility scalars is straightforward. However, the problem of interpersonal utility comparison remains a challenge in both frameworks.
  - **Resource egalitarianism**: The envy test and the idea of equal budget sets translate well. The distinction between brute luck and option luck can be captured by distinguishing between exogenous initial endowments (which are compensated) and the outcomes of chosen actions (which are not).
  - **Capability approach**: The idea of a capability set as a set of achievable outcomes (or functionings) can be mapped to the set of outcomes achievable from the feasible action space.

  #### What survives in distorted form?
  - **Expensive tastes**: 
    - In welfare egalitarianism: An agent with expensive tastes (i.e., a utility function that requires more resources to achieve the same utility level) would require more resources to be equally happy. This is a classic problem: should we compensate for expensive tastes? 
      - Translation: We have two agents with utility functions \( u_1 \) and \( u_2 \). Suppose that for the same resource bundle \( x \), \( u_1(x) < u_2(x) \). To achieve equality, we might give more resources to agent 1. But is that fair? 
      - Dworkin and others argue that expensive tastes are often voluntary (so we shouldn't compensate) but sometimes not (e.g., if due to a medical condition). The rationalist framework can express the utility functions and the need for more resources, but the normative question (whether to compensate) remains a philosophical one.

  - **Adaptive preferences**:
    - Translation: An agent's utility function \( u_i \) has been shaped by past constraints (e.g., scarcity). For example, if an agent was poor, they might adapt and learn to derive high utility from small amounts. Then, equalizing utility (welfare egalitarianism) might leave the adapted agent with fewer resources. 
    - This is expressible: we can model the utility function as being a function of past experiences or constraints. But the rationalist framework does not, by itself, tell us whether to adjust for adaptation. The capability approach might avoid this by focusing on opportunities (capabilities) rather than achieved utility.

  - **Dworkin's brute luck vs. option luck**:
    - We can model brute luck as an initial state \( s_i \) (which is exogenous) and option luck as the outcome of a chosen action (like a lottery) from a set of available actions. 
    - Distortion: The rationalist framework may not have a built-in way to distinguish between what is "chosen" and what is "given" in a non-arbitrary way. We can define the initial state as given and then let the agent choose actions, but the boundary between the two (e.g., when is a preference or a skill part of the initial state?) can be blurry.

  #### What has no counterpart?
  - **The normative force of "choice" and "responsibility"**: 
    - The rationalist framework can model choices and outcomes, but it doesn't inherently assign moral weight to choice. Dworkin's view that we should not compensate for option luck (because the agent chose the gamble) relies on a normative principle of responsibility. This principle must be imported from outside.

  - **Valuing freedom (capabilities) without a utility function**:
    - In the capability approach, we might want to say that two capability sets are equal even if they lead to different levels of utility. The rationalist framework typically uses utility to value sets (e.g., the expected utility of the best action). But Sen rejects reducing capabilities to utility. Without utility, how do we compare capability sets? The rationalist framework might struggle with this non-utility-based evaluation of sets.

  - **The envy test in capability space**:
    - Dworkin's envy test is defined on resources. How would we extend it to capabilities? We might say that agent \( i \) envies agent \( j \) if \( i \) prefers \( j \)'s capability set to their own. But the rationalist framework doesn't have a standard way to model preferences over sets (as opposed to outcomes). 

  ### Diagnostic: Missing or Less Crisp?

  - **Expensive tastes and adaptive preferences**: These are expressible in the rationalist framework. The issue is that the framework doesn't resolve the normative debate. So the philosophical position is not less crisp, but the framework doesn't decide the moral question.

  - **Dworkin's brute luck/option luck distinction**: The framework can model the mechanics, but the moral distinction (compensate brute luck, not option luck) is an external normative commitment. The framework doesn't tell us where to draw the line between what counts as brute luck (e.g., is a talent for poker brute luck?).

  - **Capabilities without utility**: The capability approach resists reduction to utility. The rationalist framework is built around optimization (often of utility). This might be a fundamental gap: the rationalist framework might be missing the intrinsic value of freedom (as opposed to its instrumental value in achieving utility). However, we can try to model capabilities as sets and define preferences over sets, but that is an extension.

  ### Conclusion
  The translations are mostly faithful, but the residue lies in:
  1. The normative aspects (why compensate brute luck but not option luck? why not adjust for expensive tastes?) which are not settled by the framework.
  2. The capability approach's rejection of utility as the sole metric, which challenges the utility-centric rationalist framework.

  You might have to give up the idea that utility is the only relevant metric (if you want to fully embrace capabilities) and accept that the framework does not resolve the normative debates about responsibility and choice. Alternatively, you might decide that the rationalist framework can be extended to incorporate these ideas (e.g., by defining a new value function for capabilities) but that requires additional structure.

  If you are committed to a purely utility-based view, then the capability approach will leave residue. Similarly, if you are committed to ignoring the formation of preferences (adaptive preferences) and treating utility functions as fixed and beyond critique, then you might have to reject welfare egalitarianism in its adaptive form.
answer: |-
  ### Translations into Rationalist Vocabulary

  **1. Welfare Egalitarianism**  
  *Core idea*: Equalize well-being across individuals.  
  *Translation*: **Equalize the utility scalar output of each agent's utility function, post-optimization**.  
  - Agents are modeled as having utility functions \(u_i(\cdot)\) mapping resources/outcomes to a scalar utility value.  
  - Goal: Achieve \(u_i = u_j\) for all agents \(i, j\) after resource allocation and optimization.  
  *Distortions*:  
    - Assumes interpersonal comparability of utility (a contested assumption in economics).  
    - Utility functions are treated as fixed and measurable, ignoring that they might be endogenous to the system.  

  **2. Dworkin's Resource Egalitarianism**  
  *Core ideas*:  
    - Equalize *resources* (not welfare), using an "envy test" (no agent prefers another's bundle).  
    - Compensate for **brute luck** (unchosen disadvantages) but not **option luck** (outcomes of deliberate gambles).  
  *Translation*:  
    - **Equalize the initial budget set \(B_i\) faced by each agent, prior to optimization**.  
      - \(B_i\) is the set of feasible resource bundles agent \(i\) can access.  
      - "Envy test" satisfied iff no agent \(i\) strictly prefers any other agent \(j\)'s chosen bundle \(x_j \in B_j\) over their own \(x_i \in B_i\), given identical budget sets \(B_i = B_j\).  
    - **Brute luck**: Initial constraints \(c_i\) (e.g., health, talent) that are part of the agent's immutable architecture. Compensation adjusts \(B_i\) to offset low \(c_i\).  
    - **Option luck**: Outcomes of voluntary actions (e.g., gambling) modeled as *chosen lotteries* from a menu \(\mathcal{L}_i\). Losses/gains are not compensated.  
  *Distortions*:  
    - The envy test assumes agents optimize identically given the same \(B_i\), ignoring differences in utility functions or risk preferences.  
    - "Choice" in option luck is idealized; real-world choices may be constrained (e.g., by limited information).  

  **3. Sen's Capability Approach**  
  *Core idea*: Equalize *capabilities* (real opportunities to achieve functionings), not resources or welfare.  
  *Translation*: **Equalize the *feasible set* \(F_i\) of high-level outcomes or "functionings" an agent can achieve, accounting for heterogeneous mappings from resources to outcomes**.  
    - Define \(F_i = \{ f \mid \exists \, \text{action} \, a \in A_i \; \text{s.t.} \; a \; \text{produces} \; f \}\), where \(A_i\) is the action space.  
    - \(A_i\) depends on:  
      - Resources converted via agent-specific conversion function \(g_i(\cdot)\) (e.g., a wheelchair user needs ramps to achieve mobility).  
      - Constraints from architecture (e.g., biology) or environment.  
  *Distortions*:  
    - Capabilities are multidimensional sets, while rationalist frameworks prefer scalar optimization. Sen rejects reducing capabilities to utility.  
    - Requires defining "valuable" functionings externally (e.g., health, education), which may not align with revealed preferences.  

  ---

  ### Residue Report: What Doesn't Translate Cleanly

  #### **Clean Translations**  
  - **Utility egalitarianism** → Equalizing utility scalars.  
  - **Resource budgets** → Equalizing pre-optimization budget sets \(B_i\).  
  - **Capabilities as feasible sets** → Defining \(F_i\) as the achievable outcome space.  
  - **Brute luck** → Constraints embedded in agent architecture; **option luck** → outcomes of chosen lotteries \(\mathcal{L}_i\).  

  #### **Survives with Distortion**  
  1. **Expensive tastes**:  
     - *Philosophy*: Should we compensate agents who need more resources to achieve the same utility? (e.g., someone who only enjoys champagne).  
     - *Translation*: Agents with utility functions requiring higher resource inputs for baseline utility (e.g., \(u_i(x) = \log(x)\), \(u_j(x) = \sqrt{x}\)) would demand larger \(B_i\) to reach \(u_i = u_j\).  
     - *Distortion*: Rationalism treats utility functions as exogenous. Dworkin argues expensive tastes are often *chosen* (hence not compensated), but rationalism lacks a native "taste formation" model to adjudicate this.  

  2. **Adaptive preferences**:  
     - *Philosophy*: Utility functions shaped by oppression (e.g., the poor "adapt" to low expectations) may perpetuate inequality if equalized.  
     - *Translation*: Agents with utility functions optimized under scarcity (e.g., \(u_i(x)\) saturates quickly) show high measured utility with few resources. Equalizing utility locks in disadvantage.  
     - *Distortion*: Rationalism can model preference adaptation via **utility function updates** (e.g., \(u_i^{t+1} = h(u_i^t, x)\)), but struggles to normatively evaluate "authentic" vs. "distorted" preferences without external criteria.  

  3. **Brute luck vs. option luck**:  
     - *Dworkin's requirement*: Compensate brute luck (e.g., disability) but not option luck (e.g., stock market losses from voluntary risks).  
     - *Translation*: Brute luck is a hardcoded constraint \(c_i\); option luck is a stochastic outcome of a chosen action \(a_i \in \mathcal{L}_i\).  
     - *Distortion*: The framework *can* distinguish pre-choice endowments from post-choice outcomes, but **cannot inherently justify why compensation applies to one and not the other**. This is a normative import.  

  #### **No Native Counterpart**  
  1. **Sen's "Valuation Function" for Capabilities**:  
     - Sen insists capabilities must be valued *non-utilitarianly* (e.g., "freedom to live well" has intrinsic worth).  
     - *Residue*: Rationalism lacks a way to optimize multidimensional \(F_i\) without collapsing to a scalar (e.g., utility or QALYs). Revealed preferences may not capture Sen's objective list of functionings.  

  2. **Dworkin's Normative Distinction of Choice**:  
     - The claim that "chosen gambles don't deserve compensation" relies on **moral responsibility**, absent in rationalism’s descriptive model of agency.  
     - *Residue*: While option luck can be modeled as stochastic actions, the framework doesn’t explain *why* society should indemnify brute luck but not option luck.  

  3. **Social and Relational Factors**:  
     - Capabilities often include social participation (e.g., "appearing in public without shame"). These involve *intersubjective* dynamics alien to atomistic agent-environment framings.  

  ---

  ### Diagnostic: Why Residue Exists  
  - **Rationalism is missing something real**:  
    - The framework has no machinery for **preference endogeneity** (how constraints shape utility functions) or **normative responsibility** (why "choice" absolves society of compensation).  
    - Sen's emphasis on *objective opportunities* (vs. utility/resource budgets) highlights rationalism's tendency to reduce everything to optimization scalars.  

  - **Philosophical positions are less crisp**:  
    - "Expensive tastes" and "adaptive preferences" are underspecified in philosophy too. When is a taste "chosen"? When is adaptation "oppressive"? Rationalism exposes this by demanding formal codification.  
    - Dworkin’s brute/option luck boundary is arbitrary in edge cases (e.g., is a *risk preference* brute luck?). Rationalism’s explicit parameters make this fuzziness visible.  

  ### Commitments You’d Need to Give Up  
  1. **Utility as the sole metric**: To fully adopt Sen, you must abandon scalar utility as the arbiter of equality.  
  2. **Exogenous preferences**: To handle adaptive preferences, you’d need dynamic utility functions + a theory of "authentic" preferences.  
  3. **Neutrality on choice**: To side with Dworkin, you must inject a normative principle that "choice legitimizes inequality."  

  ### Final Note  
  The rationalist vocabulary excels at clarifying *mechanisms* but stumbles on *normative* and *dynamic-preference* questions. Where residue exists, it’s often because philosophy engages values (e.g., "freedom," "responsibility") that rationalism deliberately brackets. The tradeoff is precision versus comprehensiveness.
