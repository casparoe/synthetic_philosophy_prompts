answer: |-
  ### Exam Question: Bargaining Theory in Wage Negotiation

  **Total Marks: 20**  
  **Context**: In a wage negotiation, a firm (Player 1) and a union (Player 2) bargain over profit \(x\) (for the firm) and wage bill \(y\) (for the union). If they fail to agree, both get \(0\). The feasible set \(S\) of payoffs \((x, y)\) is defined by:  
  \[
  x \geq 0, \quad y \geq 0, \quad x + 2y \leq 4, \quad 2x + y \leq 3.
  \]  
  The **disagreement point** is \(d = (0, 0)\).  

  **Definitions**:  
  - The **ideal point** \(a = (a_1, a_2)\) is computed as:  
    \[
    a_1 = \max \{ x \mid (x, y) \in S \text{ and } y \geq 0 \}, \quad a_2 = \max \{ y \mid (x, y) \in S \text{ and } x \geq 0 \}.
    \]  
  - The **Nash bargaining solution (NBS)** maximizes the product \((x - d_1)(y - d_2) = xy\) over \(S\).  
  - The **Kalai–Smorodinsky bargaining solution (KSBS)** is the Pareto-efficient point in \(S\) satisfying:  
    \[
    \frac{x - d_1}{a_1 - d_1} = \frac{y - d_2}{a_2 - d_2}.
    \]  

  **Axioms**:  
  - **Nash’s Independence of Irrelevant Alternatives (IIA)**: If \(T \subseteq S\) contains \(d\) and the solution for \(S\), then the solution for \(T\) is the same as for \(S\).  
  - **Kalai–Smorodinsky’s Individual Monotonicity (IM)**: If \(S' \supseteq S\) has the same \(d\) and \(a_1\), but \(a'_2 \geq a_2\), then the KSBS for \(S'\) gives Player 2 at least as much as for \(S\).  

  **Tasks**:  
  1. **(7 marks)** Compute the ideal point, NBS, and KSBS for the given problem. Show all work.  
  2. **(13 marks)** Suppose the union’s outside options improve, increasing \(a_2\) (while \(a_1\) and \(d\) remain unchanged). Without recomputing:  
     - Explain what happens to the union’s payoff under NBS and KSBS.  
     - Argue which axiom (IIA or IM) is more defensible for this change, using your computed solutions.  
     *In your argument, explicitly identify why the axiomatizations diverge: KSBS depends on the ideal point (reflecting the feasible set’s upper boundary), while NBS depends only on the set of alternatives and \(d\).*  

  ---

  ### Model Answer (≈600 words)  
  **Part 1: Computation of Solutions**  
  **Step 1: Ideal point**  
  - For Player 1 (firm): Maximize \(x\) s.t. \(y = 0\).  
    Constraints: \(x + 2(0) \leq 4 \implies x \leq 4\) and \(2x + 0 \leq 3 \implies x \leq 1.5\).  
    Binding constraint: \(x \leq 1.5\), so \(a_1 = 1.5\).  
  - For Player 2 (union): Maximize \(y\) s.t. \(x = 0\).  
    Constraints: \(0 + 2y \leq 4 \implies y \leq 2\) and \(2(0) + y \leq 3 \implies y \leq 3\).  
    Binding constraint: \(y \leq 2\), so \(a_2 = 2\).  
    \(\therefore\) Ideal point \(a = (1.5, 2)\).  

  **Step 2: Nash bargaining solution (maximizes \(xy\))**  
  The Pareto frontier has two segments:  
  1. **Segment A**: \(x + 2y = 4\) (from \((0, 2)\) to \((2/3, 5/3)\)).  
     Solve \(y = 2 - x/2\). Nash product: \(xy = x(2 - x/2) = 2x - x^2/2\).  
     Derivative: \(2 - x = 0 \implies x = 2\) (outside \([0, 2/3]\)). Maximum at \(x = 2/3\):  
     \(y = 2 - (2/3)/2 = 5/3\), product \(= (2/3)(5/3) = 10/9 \approx 1.111\).  
  2. **Segment B**: \(2x + y = 3\) (from \((2/3, 5/3)\) to \((1.5, 0)\)).  
     Solve \(y = 3 - 2x\). Nash product: \(xy = x(3 - 2x) = 3x - 2x^2\).  
     Derivative: \(3 - 4x = 0 \implies x = 0.75\).  
     \(y = 3 - 2(0.75) = 1.5\), product \(= (0.75)(1.5) = 1.125\).  
     Compare: \(1.125 > 1.111\), so maximum at \((0.75, 1.5)\).  
     \(\therefore\) NBS \(= (0.75, 1.5)\).  

  **Step 3: Kalai–Smorodinsky solution (solves \(\frac{x}{1.5} = \frac{y}{2}\))**  
  Equation: \(2x = 1.5y \implies y = \frac{4}{3}x\).  
  - **Segment A**: \(y = 2 - x/2\). Set \(2 - x/2 = \frac{4}{3}x \implies x = 12/11 \approx 1.09\) (not in \([0, 2/3]\)).  
  - **Segment B**: \(y = 3 - 2x\). Set \(3 - 2x = \frac{4}{3}x \implies x = 0.9\).  
    \(y = 3 - 2(0.9) = 1.2\). Feasibility check: \(x + 2y = 0.9 + 2(1.2) = 3.3 \leq 4\); \(2x + y = 1.8 + 1.2 = 3\).  
    \(\therefore\) KSBS \(= (0.9, 1.2)\).  

  **Part 2: Axiom Defensibility**  
  **Response to improved union outside options**:  
  - Under KSBS, the union’s payoff **increases**. IM requires that when \(a_2\) rises (holding \(a_1\) fixed), Player 2 benefits. The KSBS equation \(\frac{x}{a_1} = \frac{y}{a_2}\) ensures \(y\) grows with \(a_2\).  
  - Under NBS, the union’s payoff **remains unchanged** (at \(y = 1.5\)). IIA implies that expanding \(S\) without altering the Nash product maximum (here, \((0.75, 1.5)\)) does not change the solution.  

  **Which axiom is more defensible?**  
  In wage bargaining, an improved outside option for the union (e.g., better alternative jobs) should strengthen its position, warranting a higher payoff. KSBS’s IM captures this by tying outcomes to the ideal point, which reflects the *shape of the feasible set’s upper boundary*. NBS’s IIA ignores changes to \(a_2\) if they do not affect the Nash product maximum, as it depends *only on the set of alternatives and \(d\)*, not the ideal point.  

  **Why the axiomatizations diverge**:  
  KSBS conditions on \(a\) (which tracks how \(S\) expands), while NBS fixes a solution based on the entire set. When \(a_2\) increases, KSBS adjusts to preserve proportional gains relative to \(a\), whereas NBS remains static if the expansion does not displace the Nash maximizer. Here, IM better aligns with real-world fairness: a party should gain when their best-possible outcome improves.  

