     • The Nash bargaining solution is the point in S that maximizes (x1-d1)*(x2-d2) over S.
     • The Kalai-Smorodinsky bargaining solution is the point in S on the Pareto frontier that satisfies: 
            (x1-d1)/(a1-d1) = (x2-d2)/(a2-d2)

     Axioms:

     • Independence of Irrelevant Alternatives (Nash): If T is a subset of S that contains the disagreement point d and the solution for S, then the solution for T is the same as the solution for S.
     • Individual Monotonicity (Kalai-Smorodinsky): If we have two bargaining problems (S,d) and (S',d) with the same disagreement point, and if the ideal point for player 1 is the same in both (a1 = a1') and the ideal point for player 2 in S' is at least as high as in S (a2' >= a2) and S' contains S, then the solution for player 2 in (S',d) is at least as high as in (S,d).

