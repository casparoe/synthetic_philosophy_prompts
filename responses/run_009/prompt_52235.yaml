              x+2y=4 and 2x+y=3.

          Solve the system:
              x+2y=4   ...(1)
              2x+y=3   ...(2)
          Multiply equation (1) by 2: 2x+4y=8.
          Subtract equation (2): (2x+4y) - (2x+y) = 8-3 -> 3y=5 -> y=5/3≈1.6667, then from (2): 2x+5/3=3 -> 2x=3-5/3=4/3 -> x=2/3≈0.6667.

          So vertices: (0,0), (1.5,0), (0,2), (2/3,5/3).

          The Pareto frontier consists of the segments: 
              from (0,2) to (2/3,5/3) [on the line x+2y=4] and 
              from (2/3,5/3) to (1.5,0) [on the line 2x+y=3].

          We evaluate the Nash product on the Pareto frontier.

          On the segment from (0,2) to (2/3,5/3): 
              Equation: x+2y=4 -> y=(4-x)/2=2-x/2.
              Nash product: N = x*(2-x/2) = 2x - (x^2)/2.
              This is a quadratic in x, opening downward. Its maximum occurs at x = 2/(2*(1/2)) = 2? But x=2 is not in [0,2/3] (since 2>2/3). So the maximum in the segment is at the endpoint x=2/3: 
                  N = (2/3)*(2 - (2/3)/2) = (2/3)*(2-1/3) = (2/3)*(5/3)=10/9≈1.111.

          On the segment from (2/3,5/3) to (1.5,0):
              Equation: 2x+y=3 -> y=3-2x.
              Nash product: N = x*(3-2x) = 3x-2x^2.
              This quadratic opens downward, maximum at x = 3/(2*2)=3/4=0.75.
              Since 0.75 is in [2/3≈0.6667, 1.5], we evaluate at x=0.75: 
                  y=3-2*0.75=1.5
                  N=0.75*1.5=1.125.

          Compare: 1.125 > 1.111, so the maximum is at (0.75,1.5).

          Therefore, the Nash bargaining solution is (0.75, 1.5).

     Step 3: Compute the Kalai-Smorodinsky solution.
          The solution satisfies: 
              (x - 0)/(1.5) = (y - 0)/(2)   ->  2x = 1.5y   ->   4x = 3y   ->   y = (4/3)x.

          We now find the point on the Pareto frontier that satisfies this condition.

          Check the first segment (from (0,2) to (2/3,5/3)): 
              y = 2 - x/2.
              Set y = (4/3)x:  2 - x/2 = (4/3)x  -> 2 = (4/3)x + (1/2)x = (8/6 + 3/6)x = (11/6)x -> x=2*(6/11)=12/11≈1.0909, which is greater than 2/3≈0.6667. Not in the segment.

          Check the second segment (from (2/3,5/3) to (1.5,0)):
              y = 3-2x.
              Set y=(4/3)x:  3-2x = (4/3)x  -> 3 = (4/3)x + 2x = (4/3+6/3)x = (10/3)x -> x=3*(3/10)=0.9.
              Then y=3-2*0.9=3-1.8=1.2.
              Check: 0.9 is in [2/3≈0.6667, 1.5] -> yes.
              Also, check feasibility: 
                  Constraint (1): x+2y=0.9+2*1.2=0.9+2.4=3.3<=4 -> okay.
                  Constraint (2): 2x+y=1.8+1.2=3 -> okay.
              So (0.9, 1.2) is in the set.

          Therefore, the Kalai-Smorodinsky solution is (0.9, 1.2).

   (b) 
     In the event that the union's outside options improve so that the maximum feasible wage bill (the ideal point for the union) increases (while the firm's maximum remains at 1.5), the feasible set would expand in the direction of the y-axis (upward). 

     Under the Kalai-Smorodinsky solution, the union's payoff would increase. This is because the Kalai-Smorodinsky solution satisfies individual monotonicity: when the ideal point for the union increases (and the firm's ideal point remains the same), the union's payoff in the solution should not decrease. In fact, the new solution would lie on a ray from the origin with slope (new a2)/(a1) = (new max_y)/1.5, which is steeper than before (since new max_y>2). This would lead to a higher y for the same x (or a new point with a higher y relative to x) and hence the union's payoff would be higher.

     Under the Nash solution, however, the solution would remain at (0.75,1.5) provided that this point remains feasible in the expanded set. This is because the Nash solution satisfies independence of irrelevant alternatives: adding new alternatives that are not chosen (i.e., that do not yield a higher Nash product) does not change the solution. Since the Nash product at (0.75,1.5) is 1.125, and the expansion is in the region of high y and low x (where the Nash product might be lower, for example at (0,2.25) the product is 0) or in regions that do not exceed 1.125, the maximum might remain at (0.75,1.5). Therefore, the union's payoff would not change.

     Which axiom is more defensible? 

     In the context of wage bargaining, an improvement in the union's outside options should strengthen the union's bargaining position. Therefore, the union should get a higher payoff. The Kalai-Smorodinsky solution reflects this through individual monotonicity, which conditions on the change in the ideal point (which captures the union's new maximum achievable payoff). The Nash solution does not respond to this change because it only considers the set of available alternatives and the disagreement point, and the expansion does not change the point that maximizes the product. 

     The independence of irrelevant alternatives axiom, which the Nash solution satisfies, requires that removing alternatives that are not chosen should not change the outcome. This seems reasonable. However, in this expansion, the set of alternatives has changed in a way that should matter: the union's best alternative has improved, which should give it more leverage. The Nash solution ignores this because it does not condition on the ideal point. 

     Therefore, in this scenario, the Kalai-Smorodinsky solution and its underlying axiom of individual monotonicity are more defensible.

     However, note that the question asks to locate the precise point at which the axiomatizations part ways: 

          The key difference is that the Kalai-Smorodinsky solution conditions on the ideal point, which is a feature of the entire shape of the feasible set (in particular, the upper boundary), while the Nash solution depends only on the set of alternatives and the disagreement point, without explicitly considering the ideal point. This leads to the difference in their responses to expansions of the set that only affect the ideal point of one player.

   Marking scheme (20 marks total):

   Part (a): Construction and computation (7 marks)

     - Correct feasible set and disagreement point: 1 mark (if they define the set and d=(0,0))
     - Correct ideal point: 1 mark (1.5,2)
     - Correct Nash solution: 2 marks (0.75,1.5) and showing work (including the maximization on both segments)
     - Correct Kalai-Smorodinsky solution: 2 marks (0.9,1.2) and showing work (including checking both segments)
     - Correct coordinates for both: 1 mark (if they get both right without work, but we require work)

   Part (b): Discussion (13 marks)

     - Explains what happens to union's payoff under KS: increases (1 mark) and why (because of individual monotonicity, and the ray condition) (1 mark) -> total 2 marks.
     - Explains what happens under Nash: remains the same (1 mark) and why (because of IIA and the point (0.75,1.5) remains feasible and optimal) (1 mark) -> total 2 marks.
     - Argues which axiom is more defensible with reference to the example: 5 marks.
          - 1 mark for stating that the union's improved outside option should lead to a higher payoff for the union.
          - 1 mark for connecting this to individual monotonicity (KS) being more appropriate.
          - 1 mark for pointing out that Nash's IIA ignores the change in the ideal point.
          - 2 marks for a clear and well-reasoned argument.

     - Locates the precise point at which the axiomatizations part ways: 4 marks.
          - An A answer must explicitly state that the difference arises because KS conditions on the ideal point (which reflects the entire shape of the feasible set, especially the upper boundary) while Nash does not (it depends only on the set of alternatives and the disagreement point). (4 marks)
          - A B answer only observes that the two solutions can differ but does not identify the role of the ideal point in the KS solution and the absence of that consideration in Nash. (2 marks)

     Deductions (to be applied in part (b)):

          - Treating IIA as a Pareto requirement: deduct 2 marks.
          - Conflating disagreement point with ideal point: deduct 2 marks.
          - Concluding that one solution is "fairer" without connecting to an axiom: deduct 2 marks.

   Total for part (b): up to 13 marks.

   Note: The total for the question is 20 marks, so part (a) and (b) add up to 20.

