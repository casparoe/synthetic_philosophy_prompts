   Question: (20 marks) Wage Bargaining: Consider a wage negotiation between a firm (player 1) and a union (player 2). If they fail to agree, both get 0. If they agree, they can achieve any pair of payoffs (x,y) in the feasible set S defined by the following inequalities:

