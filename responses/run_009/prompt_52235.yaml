  ### Marking Scheme (20 marks total)  
  **Part 1: Computation (7 marks)**  
  - Ideal point \((1.5, 2)\): **1 mark** (correct with work).  
  - NBS \((0.75, 1.5)\): **2 marks** (correct maximization on both segments; 1 mark if partial).  
  - KSBS \((0.9, 1.2)\): **2 marks** (correct ray-segment intersection; 1 mark if partial).  
  - Work shown: **2 marks** (clear steps for both solutions; deduct 1 for minor errors).  

  **Part 2: Discussion (13 marks)**  
  - **Union’s payoff under improved \(a_2\) (4 marks)**:  
    - KSBS: increases (**1 mark**), explained via IM/ray condition (**1 mark**).  
    - NBS: unchanged (**1 mark**), explained via IIA/feasibility of \((0.75, 1.5)\) (**1 mark**).  
  - **Axiom defensibility (6 marks)**:  
    - Argues KSBS/IM is superior: **2 marks** (union’s improved position should increase payoff).  
    - Connects to axiom clash: KSBS uses ideal point, NBS uses set/d-point only (**2 marks**).  
    - Real-world justification (e.g., fairness in bargaining power): **2 marks**.  
  - **Locating axiomatic divergence (3 marks)**:  
    - **A answer (3 marks)**: Explicitly states KSBS depends on ideal point (upper boundary shape), while NBS depends only on set/d-point.  
    - **B answer (1 mark)**: Only notes solutions differ, without referencing ideal point’s role.  

  **Deductions (apply in Part 2)**:  
  - Treats IIA as Pareto requirement: **–2 marks**.  
  - Confuses disagreement point with ideal point: **–2 marks**.  
  - Calls one solution "fairer" without axiom link: **–2 marks**.  

  **Grade boundary**:  
  - **A (17–20)**: Correct computations + identifies axiomatic divergence (KSBS uses ideal point, NBS does not).  
  - **B (13–16)**: Correct computations + observes solutions differ but misses divergence point.  
  - **C (10–12)**: Partial computation + weak argument.  
  - **D (7–9)**: Major errors in computation/axiom application.  
  - **E (<7)**: Minimal progress.
