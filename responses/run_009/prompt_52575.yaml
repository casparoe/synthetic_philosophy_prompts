  The user has provided very specific requirements: the two refrains should represent the skyhook's promise of a "lifter that never needed lifting" and the crane's insistence that everything is built "from below." I need to make sure each recurrence of these lines gains new meaning based on context.

  I should structure the poem so that it progresses through different frontiers where people typically invoke skyhooks - design, purpose, meaning, and self. For each tercet, I'll explore how the skyhook temptation reappears in these areas, while the crane refuses each time by showing bottom-up construction.

