prompt: |-
  I'm doing a module on the ethics of emerging tech, and last week's reading included a long magazine article about the transhumanist philosopher David Pearce and his "Hedonistic Imperative" — the manifesto from the nineties arguing that suffering is just an ugly artefact of our evolutionary legacy and that biotechnology will eventually let us phase it out, not only in humans but across the whole living world, predators included. I mostly followed it, but the article's gloss of the underlying ethics is what I want to check, because it did alot of work in a short space. Here's roughly what it said: since Pearce is a negative utilitarian, he holds that happiness has no moral worth in itself — only the absence of pain counts — so his ideal end state is a world of constant, uniform bliss with no striving, curiosity or achievement, since all of those depend on being dissatisfied with how things currently are. In other words, the article concluded, what he actually wants is to wirehead the entire biosphere, and a consistent negative utilitarian of his stripe would even have to prefer a universe with no sentient life over one containing a single pinprick, which is why critics apparently call the whole thing extinctionism in a lab coat.

  My flatmate, who's read a bit more of this stuff, says the article is mixing up several distinct claims — something about how Pearce talks about "gradients" of wellbeing rather than flat bliss, and about whether the version of negative utilitarianism he actually holds commits him to anything like the pinprick thing. But she couldn't really explain why, and honestly the article sounded convincing to me, since the author clearly knew the biology.

  Could you go through the article's characterisation claim by claim and tell me which parts Pearce himself would accept, which are conflations or overstatements of his actual position, and which are just wrong? In particular I want to know whether the wirehead picture and the extinctionism conclusion actually follow from anything he's committed to, or whether the article has bundled together views he keeps separate. And if some of the criticisms are closer to the mark than my flatmate admits, I'd want to know that too. Please write your answer in British English (so "behaviour", "programme", that sort of thing), and don't just tell me it's a caricature — tell me exactly where the summary goes off the rails and what an accurate version would say.
