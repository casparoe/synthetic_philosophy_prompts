  The salt wind whipped Thalassa’s braid as she hauled her leaking skiff, *Wave Dancer*, onto the shingle beside Silas’s shed. Inside, the rhythmic *thump-scrape* of the adze paused. Silas emerged, wiping sweat and sawdust from his brow, his eyes immediately drawn to the gaping seam near the stern.

  “Been swallowing more than she catches, has she?” Silas asked, crouching to probe the rotten wood with a calloused finger.

  Thalassa grimaced. “Like a thirsty gull. Need a new hull, Silas. Before the mackerel run’s done.”

  Silas straightened, looking past her to the meager catch drying on racks near his own, much smaller, boat. “What’ve you got? Fish are thin this week.”

  “Half my next three hauls,” Thalassa offered quickly, the standard opening gambit.

  Silas snorted. “Half your hauls when the fish are jumping? Maybe. Half now, when the sea’s stingy? That hull,” he tapped the worn wood of *Wave Dancer*, “cost me good timber floated down from the pine forests, a moon’s worth of shaping, tar and oakum. What’s half a thin haul worth against that?” He didn’t say it unkindly, just stating a fact as he saw it. Silas had a way of making the obvious feel like a challenge.

  “What do you *need*, then?” Thalassa pressed, shifting tactics. Need was the grease in Saltspray’s gears. “Boots? Bren’s got a new pair that’ll fit you, I saw ‘em.”

  “Bren’s boots are fine,” Silas conceded. “But I need a new set of storage crocks. Big ones. Marta’s glazing holds brine better than anyone’s.”

  Thalassa’s shoulders slumped. “Marta won’t take fish. Her kiln chimney cracked last week. Says she needs Bren to patch it with his special clay mix before she can fire anything new.”

  “And Bren,” Silas finished the chain, “won’t patch anything until someone pays him in decent lamp oil. Which Elara presses. And Elara’s boy just outgrew his clothes, so she’s bartering her cloth for…” He spread his hands. “Where does the fish fit? It doesn’t. My hull isn’t *worth* ten crocks or twenty boots or a barrel of lamp oil. It’s worth what you’ll give me that I *need*, and what I need right now depends on Marta needing something fixed, which depends on Bren needing oil, which depends on Elara needing… something else entirely.” He kicked a pebble. “Two fishermen came last week. One offered me half his catch for life if I patched his rudder – desperate fool, that one. The other offered me three fine nets mended by Elara. Same rudder. Which was the ‘equal’ exchange? The nets were useful. Half a life’s catch? Sounds grand, but fish rot. It’s just… agreement. Shifting sand.”

  Thalassa felt the familiar frustration bubble. Silas wasn’t greedy, just… stubbornly convinced value was smoke. “So what? I need a hull. You need crocks. The crocks exist, they just need fixing. The fix exists, it just needs oil. The oil exists, it just…” She stopped. Elara. Elara needed… what? She pictured the weaver, her quick fingers flying over the loom. “Silas, could you build Elara a new shuttle? Her best one snapped.”

  Silas paused, considering. “Aye. Good ash wood. Takes a day, careful shaping.” He looked at Thalassa’s leaking boat, then back towards the town. “So: I build Elara a shuttle. She gives me lamp oil. I give oil to Bren. He fixes Marta’s kiln. Marta makes my crocks. I give crocks… to you? For the hull?”

  Thalassa nodded vigorously. “Yes! Exactly! Then we’re square.”

  Silas laughed, a dry bark. “Square? Thalassa, look at the chain! A shuttle for oil? Fair enough. Oil for a kiln patch? Seems reasonable. Patch for crocks? Probably. Crocks for a *hull*? That’s months of my work! Is a shuttle equal to a hull? Are ten crocks? How? By weight? By time? By how much we need them? You need the hull desperately now. I need crocks before the herring brine spoils. But Elara just *fancies* a new shuttle, Bren *could* patch later, Marta *might* get her kiln fixed eventually. The *need* isn’t the same in each step. It’s not equal; it’s just… connected.”

  “But it *works*,” Thalassa insisted. “It gets us all what we need.”

  “It gets us trading,” Silas corrected. “But it doesn’t make the things *equal*. It just makes them… tradable. Because we agree to see the connection. Today. Tomorrow, Bren might decide lamp oil isn’t enough, he wants fish *and* oil for his clay. Where’s the ‘true ratio’ then? Gone with the tide.”

  He sighed, rubbing his neck. “But you need the boat. And frankly, I need the crocks. So, we’ll try your chain. But don’t tell me it’s because a hull is mystically ‘worth’ a shuttle plus oil plus a patch plus crocks. It’s worth it because we say so, today, for these reasons.”

  The chain worked, but it creaked. Elara was delighted with the shuttle, a thing of smooth beauty. She readily gave Silas a jug of her precious pressed fish-oil. Bren, however, squinted at the oil jug. “That’s… less than I thought for patching a kiln chimney. Hard work, that. And the clay mix is special.”

  Silas, already weary, argued. “It’s the same jug I always get for a shuttle! Elara knows the measure!”
  “Shuttle’s one thing,” Bren said stubbornly. “Kiln patch is another. Needs more oil. Or… maybe Elara could throw in a length of that tough sailcloth for patching my awning?”

  Another round of negotiation. Elara agreed to the cloth, grumbling that Bren drove a hard bargain. Bren patched the kiln. Marta, thrilled, fired Silas’s crocks – big, beautiful, salt-glazed vessels. Silas accepted them, relief warring with his ingrained skepticism. He delivered the crocks to Thalassa.

  She stared at the four magnificent pots. “Four? Silas, they’re huge! This is… too much for just the hull?”
  Silas shrugged. “Marta was grateful. Said the patch worked perfectly. She threw in an extra. See? ‘Equal’? What’s ‘equal’? Your hull was worth four crocks to Marta, via Bren and Elara and me. To another fisher, it might be worth two. Or six. It’s not in the wood, Thalassa. It’s in the wanting.”

  Thalassa took the crocks, overwhelmed. She needed the hull, but Silas was right – this felt lopsided. She had fish now, good catches since borrowing Bren’s brother’s boat. But Silas didn’t need fish. He had his crocks. The imbalance nagged at her. She couldn’t give him half a haul *now*; he had no use for it. But the debt felt… unresolved.

  A few days later, standing on the newly sea-tight *Wave Dancer*, Thalassa spotted Elara down by the weaver’s hut, struggling to drag a heavy roll of raw wool up from the strand. Inspiration struck. Thalassa helped her haul it, then hesitated.

  “Elara… Silas fixed my hull. I got him his crocks, but… it felt uneven. Marta gave extra. I’ve got fish. Good fish. Could you… use some? For the wool?”

  Elara brightened. “Oh, yes! Perfect. Been craving a proper fish stew. But… how much? A basket?” She bit her lip. “Is a basket fair for helping haul the wool? Seems light. Is it worth half a hull? Seems heavy! This is Silas’s headache rubbing off.”

  Thalassa laughed, but Elara’s eyes suddenly sparked. She rummaged in her belt pouch and pulled out a small, smooth shard of pottery – the rim of one of Marta’s earlier, broken cups, glazed a deep blue. “Here,” she said, pressing it into Thalassa’s hand. “Marta gave me this when I wove her an apron before she’d fired my order. Said it was a… token. A ‘remembering piece’. Hold onto it. It means I owe you… something. Worth the hauling. Later, when I have cloth, or you need something woven… you give it back. Or pass it on if I do something for you then. Saves arguing ‘equal’ right this second.”

  Thalassa looked at the cool, blue shard. It felt solid. Agreed upon. Not a measure of the sea or the wool, but a marker of a promise, a need acknowledged but deferred. “Like Bren’s patch for your oil and cloth?”

  “Exactly!” Elara grinned. “A little *thing* to stand for the ‘when’ and ‘what later’. Easier than juggling fish and wool and hulls in your head.”

  Word spread. The blue shard changed hands again – Thalassa gave it to Bren for a quick repair on her nets, settling the vague debt from the kiln-patch negotiation. Bren later gave it to Marta for a small milk jug he fancied. Marta held it, thoughtful. It wasn’t money. It didn’t proclaim that a milk jug *equaled* net mending *equaled* wool hauling *equaled* part of a hull. It just meant someone, somewhere, had accepted an obligation. It was a knot in the net of need, not a ruler.

  Silas watched the blue shard circulate with wry amusement. He accepted it himself once, from Bren, for a minor repair on a fish-box, instead of the pair of crabs Bren had offered. “Handy little thing,” he admitted to Thalassa as they watched the sunset gild the harbor. “Saves the breath of arguing whether my time fixing a box is worth two crabs or three. We just agree it’s worth… the token. For now.”

  “So?” Thalassa asked, hopeful. “Does it make things equal? Measurable?”

  Silas picked up a smooth, grey stone from the shingle. He weighed it in his hand. “This stone. Is it heavy? Compared to a feather, yes. Compared to that anchor? No. The token… it’s like agreeing to call this stone ‘heavy’ today, for this purpose. It doesn’t tell you *how* heavy. Just that we both said ‘heavy enough’. It makes trading smoother, Thalassa. But it doesn’t find the true weight hidden inside the stone.” He tossed the stone into the advancing tide. “The true weight was only ever the wanting.” He nodded towards the blue shard, now tucked in Bren’s pocket as he admired his new milk jug. “The wanting, and the agreeing. That’s all the measure we’ve ever really had.” He turned back to his shed, the rhythmic *thump-scrape* resuming as the first stars pricked the violet sky. The token gleamed dully in Bren’s hand, a simple piece of broken pot, holding the weight of a dozen unspoken needs.
