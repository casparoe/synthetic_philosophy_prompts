prompt: |-
  My roommate somehow got appointed tiebreaker for our debate club's "should this be sellable" bracket (long story), and her rulings so far have been suprisingly consistent: paid plasma donation, fine; selling a kidney to a stranger, not fine; commercial surrogacy, fine; a hardware store marking up generators from $60 to $550 the night before a hurricane, not fine; paying someone to stand in line for you at the DMV, fine; selling your vote in an election, not fine; paying students a decent wage to test a mildly risky sunscreen ingredient, fine.

  Thursday I have to run two more cases past her and I'd like to go in with predictions: (a) a healthy, comfortably-off guy sells a kidney to a stranger for $80k — fully informed, zero financial pressure; (b) a homeowner who genuinely doesn't care about the outcome sells their vote in a low-stakes homeowners association election to a neighbor who does. I'm less interested in her actual answers than in the rule she's running, because to me atleast two rules fit her track record equally well: one where the problem is exploiting desperate people on either side of the deal, and one where certain things (body parts, votes) just don't belong on a market no matter what the terms are. Answer as exactly five numbered items, each a sentence or two, nothing before item 1 or after item 5: 1, your prediction for case a with the why; 2, your prediction for case b with the why; 3, the best-fit rule for her whole track record; 4, the closest rival rule that fits her earlier verdicts just as well; 5, the single new case you'd put to her that would most cleanly split those two rules apart, and what each rule predicts she'd say about it.
reasoning: |-
  Hmm, the user is describing their roommate's role as a tiebreaker in a debate club bracket about what should be sellable. They've listed several rulings where she approved or disapproved of various transactions: paid plasma donation is fine, selling a kidney to a stranger isn't, commercial surrogacy is fine, price gouging generators before a hurricane isn't, paying someone to stand in line at the DMV is fine, selling your vote isn't, and paying students to test sunscreen is fine.

  Now they want to predict how she'll rule on two new cases: (a) a comfortably-off person selling a kidney to a stranger for $80k with no financial pressure, and (b) a homeowner selling their vote in an HOA election to a neighbor. The user is less interested in the actual answers and more in identifying the underlying rule she's using, since two possible rules seem to fit equally well based on her past decisions: one about exploiting desperation, and one about certain things like body parts or votes being inherently non-marketable.

  I need to provide exactly five numbered items as requested:
  1. My prediction for case (a) with why
  2. My prediction for case (b) with why
  3. The best-fit rule for her entire track record
  4. The closest rival rule that also fits
  5. A single new case that would distinguish between these two rules, and what each rule would predict she'd say

  For prediction #1 (case a): Even though the seller isn't desperate, she ruled against kidney sales before. This suggests she sees body parts as inherently non-marketable. I'll predict she says "not fine."

  For prediction #2 (case b): She ruled against vote-selling before, and this case has no desperation either. Votes seem to be in the same category as kidneys - things that shouldn't be commodified regardless of context. I'll predict "not fine."

  For #3 (best-fit rule): Her pattern shows disapproval only when the transaction involves something essential to human dignity or societal function (kidneys, votes, emergency goods). The common thread is commodification of inalienable things, not just exploitation.

  For #4 (rival rule): The exploitation rule also fits most cases - she disapproved when there was clear vulnerability (hurricane victims, potential kidney sellers under financial pressure). But it struggles with the kidney case where no desperation exists in the new scenario.

  For #5 (distinguishing case): I need a scenario where something normally non-marketable is sold without exploitation. Selling citizenship rights without desperation would split the rules - commodification rule says not fine (like votes/organs), while exploitation rule says fine if no coercion.
answer: |-
