  You are a philosopher of language with a strong sideline in classical Chinese philosophy. Please think carefully before answering, and work through the nearest candidate concepts rather than jumping to a label.

  I'm a graduate student in comparative literature, and a survey course on early Chinese thought recently took me through the white horse dialogue of Gongsun Long, where the sophist argues that a white horse is not a horse — partly on the grounds that the term for horse picks out shape while the term for white picks out colour, so asking for a horse is not asking for a white horse. I initially wrote it off as clever wordplay, but since then I have started noticing a family of cases in English that feel structurally similar: a stone lion is not a lion, a toy duck is not a duck, a fake gun is not a gun, a former senator is not a senator. In each case the modifier seems not to narrow down the class of things picked out by the head noun, the way red in red car does, but to change what kind of thing we are talking about, or to swap the category entirely. So my question is this: does this pattern have an established name or names in linguistics or philosophy of language, and does the white horse case actually belong to it, or is Gongsun Long doing something quite different — perhaps something about what names refer to rather than about how compounds are built? Please be precise about what each candidate concept covers and where the boundary runs: for instance, is a chocolate rabbit in, or is it different because it still resembles a rabbit, and where does a sea horse fall? If no established concept fits cleanly, coin one, define it, and demarcate it from its nearest neighbours. I am not after a bare label; I want the carving.

  Please answer in British English, in no more than 350 words, without citations or reading lists — just the analysis.
reasoning: |-
  Alright, let's tackle this step by step. The user is a grad student in comparative literature who's encountered Gongsun Long's white horse paradox and noticed similar patterns in English like "stone lion" or "toy duck." They want to know if there's a established term for this phenomenon and whether Gongsun Long's argument fits into it.

  First, I recall that in philosophy of language, there's a distinction between attributive and non-attributive modifiers. Red car is attributive—it narrows down the category of cars. But in cases like stone lion, the modifier changes the category entirely. That's closer to what's called a "qualia shift" in some frameworks, where the modifier alters the essential nature of the noun.

  Next, considering Gongsun Long's argument. He's separating the referents of "horse" (shape) and "white" (color), claiming that combining them creates a new entity distinct from "horse." His focus is on reference and the ontology of attributes, not just linguistic structure. So while the surface similarity exists, his underlying argument is more about metaphysical distinctions than compound formation.

  Looking at boundary cases: a chocolate rabbit might be tricky. If it's shaped like a rabbit, it's a representation, so it fits the pattern. A seahorse, though, is a biological category misaligned with its name—here, the term is lexicalized, not a modifier changing the category. Then there's terms like "fake gun," which denies actual membership, versus "toy duck," which creates a new representational category.

  So the key difference is whether the modifier re-categorizes the noun into a new kind (representational, imitation, former) rather than specifying a subset. Gongsun Long's case is similar but rooted in classical Chinese philosophy's focus on naming and reality. While there's overlap in structure, his argument is ontological, using language to probe metaphysics.

  The user needs a precise carve-up, avoiding vague labels. They’re likely seeking conceptual tools for comparative analysis, so clarifying the boundaries between linguistic re-categorization and metaphysical arguments is crucial. No single term perfectly fits, but "non-attributive category-shifting modification" captures the linguistic pattern, while noting Gongsun Long's distinct focus on referential opacity.
answer: |-
  This pattern involves **non-attributive category-shifting modification**, where a modifier fundamentally alters the ontological category of the head noun rather than merely specifying a subtype. Let's carve the boundaries:

  1.  **Attributive Modification (e.g., "red car"):** The modifier ("red") restricts the *extension* of the head noun ("car") to a subset (red cars). The ontological category remains "car".
  2.  **Category-Shifting Modification (e.g., "toy duck", "stone lion", "fake gun", "former senator"):** The modifier ("toy", "stone", "fake", "former") changes the *kind* of thing denoted. A "toy duck" is an artefact representing a duck, not a biological duck. "Fake gun" denotes a non-functional imitation, excluding it from the category "guns" as functional weapons. The modifier alters the *intension* (defining properties) and thus the extension entirely.
  3.  **Gongsun Long's Argument:** While structurally similar to category-shifting, his focus is distinct. He argues that "horse" and "white" pick out different, non-overlapping *attributes* (shape vs. colour). Combining them in "white horse" creates a compound name referring to the *conjunction* of these attributes, which, he claims, is not identical to the single attribute "horse". His concern is the **referential opacity** of names and the ontological status of abstract attributes ("horse-ness" vs. "white-horse-ness"), not primarily the linguistic mechanism of modification. It's a metaphysical argument about naming and identity, using compound terms as an example.
  4.  **Boundary Cases:**
      *   **Chocolate Rabbit:** If shaped like a rabbit ("chocolate rabbit"), it's category-shifting: an edible representation, not an animal. If merely a rabbit made of chocolate (e.g., a blob), "chocolate" is attributive (specifying material) within the category "rabbit-shaped object".
      *   **Seahorse:** This is **lexicalisation**, not modification. "Sea" isn't functioning as a productive modifier here; "seahorse" is a fixed name for a specific biological creature misaligned with "horse" due to superficial resemblance. Its category isn't shifted by a modifier; the term itself is a conventional label.

  **In essence:** The English examples illustrate a *linguistic phenomenon* where modifiers create new categories. Gongsun Long uses superficially similar compound terms to argue for a *metaphysical position* about the discreteness of abstract attributes and the referential specificity of names. The overlap is structural, but his aim is ontological. The cleanest label for the linguistic pattern is **non-attributive category-shifting modification**.
