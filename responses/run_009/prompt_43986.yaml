answer: |-
  Here is a rigorously constructed set of desiderata for a theory of standing to blame, treating this as a design specification for your philosophical inquiry. I've prioritized non-negotiable demands based on core intuitions driving the literature, flagged key tensions, and identified the major theoretical fault line.

  **Core Desiderata for an Adequate Theory of Standing to Blame**

  1.  **The Hypocrisy Constraint (Non-negotiable):**
      *   **Demand:** Must explain why a hypocrite (who has committed, and fails to own/resolve, the *same* wrong they blame another for) typically lacks the standing to blame, *even if* their factual assessment of the wrong is correct.
      *   **Case:** A serial adulterer blaming someone else for adultery. The intuition is not just that they are wrong *to* blame, but that they *lack the authority* to do so, making their blame "off" or "galling" regardless of the target's guilt.
      *   **Crucial Distinction:** This is distinct from the hypocrite being factually mistaken *about the wrongness* of the act itself. The issue is the blamer's own conduct relative to the norm they invoke.

  2.  **The Third-Party/Meddlesome Outsider Constraint (Non-negotiable):**
      *   **Demand:** Must explain why someone with *no relevant connection* to the wrong or the parties involved often lacks standing to blame, making their blame seem intrusive, unwelcome, or "cheap," even if factually correct.
      *   **Case:** A complete stranger, uninvolved and unaffected, publicly blaming someone for a private dispute they overheard. Their blame feels less weighty or legitimate than that of the victim.
      *   **Crucial Distinction:** This is distinct from the stranger being factually mistaken *about what happened*. The issue is their position relative to the normative violation.

  3.  **The Victim's Privileged Standing (Non-negotiable):**
      *   **Demand:** Must explain why the *primary victim(s)* of a wrong typically possess paradigmatic (often the strongest) standing to blame the wrongdoer.
      *   **Case:** The person who was robbed has a clear and strong claim to blame the robber, stronger than a neighbor or a distant observer. Their standing stems directly from the wrong done *to them*.
      *   **Crucial Distinction:** This is distinct from the victim merely having more *knowledge* or *intensity of feeling*. The standing itself seems intrinsically linked to their victimhood.

  4.  **Standing vs. Incorrect Blame Distinction (Non-negotiable):**
      *   **Demand:** Must clearly differentiate between blame that is *incorrect* (because the blamed act wasn't actually wrong, or the person didn't do it) and blame that is *inappropriate due to lack of standing* (even if the act *was* wrong and the person *did* do it).
      *   **Case:** Blaming someone for stealing when they didn't (Incorrect) vs. A hypocrite correctly blaming someone for stealing (Lacks Standing). The latter fails *even if* the factual and normative premises are true.
      *   **Rationale:** Collapsing these obscures the core phenomenon of standing, which concerns the *blamer's normative position*, not the accuracy of their judgment about the target.

  5.  **Character Flaw vs. Specific Standing Loss Distinction (Non-negotiable):**
      *   **Demand:** Must distinguish between having a *general character flaw* that makes one *prone* to lacking standing (e.g., being generally hypocritical) and *lacking standing for a specific act of blame* due to a specific failure relative to the *particular norm* invoked in that blame.
      *   **Case:** A generally rude person blaming someone for a specific act of theft. Their general rudeness doesn't *automatically* negate their standing to blame *this specific theft* unless their rudeness is somehow *directly relevant* to the norm of property rights they are invoking. Lacking standing requires a failure concerning *this specific norm*.
      *   **Rationale:** Prevents overgeneralization. Standing is norm-relative and act-specific.

  6.  **Standing Dynamics (Negotiable/Contested):**
      *   **Demand:** Must plausibly account for whether standing can be:
          *   **Lost:** (e.g., through one's own relevant wrongdoing - Hypocrisy Constraint).
          *   **Waived/Forgone:** (e.g., Can a victim choose *not* to exercise their standing, and does this affect others?).
          *   **Acquired:** (e.g., Can someone gain standing through a special role, like a mediator, or deep personal investment?).
          *   **Innate:** (e.g., Is the victim's standing inherent and unlosable?).
      *   **Considerations:** Cases involving repentance (does a hypocrite regain standing if they repent?), victim forgiveness (does it remove the wrongdoer's standing?), or designated community representatives. Different theories will handle these differently; adequacy requires *some* coherent account, not universal agreement on the specifics.

  7.  **Uniformity vs. Pluralism (Negotiable/Contested Preference):**
      *   **Demand:** Must either (a) provide a *single, uniform condition* that explains standing across all core cases (Hypocrite, Outsider, Victim) OR (b) provide a *principled pluralism* explaining why different types of standing exist (e.g., victim standing vs. community standing) and what grounds each.
      *   **Rationale:** Some theorists demand a unifying principle (Uniformity). Others argue the differences between victim standing and third-party standing are fundamental and require distinct bases (Pluralism). An adequate account must be explicit about its approach and justify it against the core cases.

  **Key Tensions (Where Desiderata Clash or Strain Theories):**

  1.  **Hypocrisy vs. Victim Standing:** Can a *victim* who is *also* a hypocrite regarding the *specific norm* violated still blame? (E.g., A thief victimized by another thief for stealing *from them*). Does victimhood trump hypocrisy? Or does hypocrisy negate even victim standing for *that specific norm*? This is a major pressure point.
  2.  **Third-Party vs. Uniformity:** Providing a *single condition* that explains why *both* the completely disconnected outsider *and* the hypocrite lack standing, while *also* explaining why the victim (who might share some other flaw) has it, is extremely challenging. Simpler uniform accounts often struggle to capture the qualitative difference between victim and non-victim blame.
  3.  **Acquisition vs. Innateness (Dynamics):** If victim standing is innate and unlosable (strong intuition), how does this square with the idea that standing can be lost (e.g., through severe hypocrisy)? Does waiving imply it wasn't innate? Dynamics create internal tensions within the concept.

  **The Knockout Blow: Why Common Contenders Fail**

  The **single most demanding desideratum** is the **Hypocrisy Constraint** (*Desideratum 1*) combined with the necessity to also satisfy the **Third-Party Constraint** (*Desideratum 2*) and the **Victim's Privileged Standing** (*Desideratum 3*) under a plausible account (whether uniform or pluralist).

  *   **Why "Hypocrisy-Only" Accounts Fail:** They excel at *Desideratum 1* but utterly fail *Desideratum 2*. They cannot explain why the completely uninvolved stranger (who isn't hypocritical about the norm in question) also lacks standing. They also struggle to uniquely ground the special strength of *Desideratum 3* beyond the victim simply not being hypocritical *in this instance*.
  *   **Why "Personal Stake/Involvement" Accounts Fail:** They excel at *Desideratum 2* (outsider lacks stake) and *Desideratum 3* (victim has maximal stake). However, they fail *Desideratum 1* spectacularly. The hypocrite often *does* have a significant personal stake in the norm being upheld (e.g., the adulterer has a stake in norms of fidelity within their own marriage/community). Their hypocrisy doesn't necessarily erase their stake, yet their standing is compromised. Reducing standing *only* to stake cannot capture the specific normative failing of hypocrisy.

  **Conclusion:** An adequate theory must navigate the core intuition that hypocrisy (*Desideratum 1*) and irrelevance (*Desideratum 2*) each independently *can* undermine standing, while victimhood (*Desideratum 3*) robustly grounds it. Crucially, it must do this without conflating standing with incorrect blame (*Desideratum 4*) or general bad character (*Desideratum 5*), and provide a coherent story about dynamics (*Desideratum 6*) and structure (*Desideratum 7*). The fundamental challenge lies in reconciling the distinct ways hypocrisy and lack of connection each negate standing, particularly when contrasted with the victim's robust position, without collapsing into ad hoc explanations. Any theory that cannot clearly satisfy *Desiderata 1-5* should be considered deficient. Use this framework to dissect and evaluate the accounts you encounter.
