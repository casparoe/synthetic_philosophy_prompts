prompt: |-
  You're a professional philosopher specializing in interpersonal ethics, so treat this as a request for a spec, not a survey. Before I read any more papers on standing to blame, I want to know what I should be demanding of a theory. Write the desiderata: what any adequate account of standing to blame has to deliver -- which cases it must get right, which distinctions it must respect, and where it's allowed to say things are just messy.

  The cases it has to handle, at minimum: the hypocrite whose blame seems off somehow even though the target did exactly the wrong thing being blamed for (is that loss of standing or something else?); the meddlesome third party with no stake in the matter, whose blame seems worth less than the victim's; the victim's apparently stronger claim to blame; and whether standing is something you can loose, waive, or never had in the first place. The distinctions it can't collapse: blame that lacks standing vs blame that's simply mistaken about the facts, and having a character issue yourself vs lacking standing for one particular act of blame.

  For each requirement give the case or consideration behind it, mark which are non-negotiable and which are just preferences of one camp (e.g. the demand that a single uniform condition cover all cases, versus letting the victim's standing and the stranger's standing be structurally different), and flag any pair you suspect can't be jointly satisfied -- that's the part I most want to see. Then one short paragraph on which single requirement does the most to knock out the usual contenders: accounts built around hypocrisy alone, and accounts that tie standing to having a personal stake. Please think it through carefully and brainstorm the list before writing it out.
