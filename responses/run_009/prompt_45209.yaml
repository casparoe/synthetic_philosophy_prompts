prompt: |-
  My friend Maya and I spent basically all of Saturday arguing about whether you can separate the art from the artist, and the argument only ended because the restaurant was closing, so now I want to know how she'd rule on a case we never got to. Her slogan is "judge the work, not the person," but her actual behavior is way more patterned than that slogan suggests, and I've been trying to reconstruct the pattern. Her record, as best I can tell:

  She'll happily cross the city to see Caravaggio paintings and calls him a genius, and she rolls her eyes at people who say you should feel weird looking at art by a man who literally killed a guy. She goes to Wagner whenever there's a production on, even though his antisemitism is all over his essays and, she thinks, kind of audible in the late operas if you know to listen — her line is that the man being terrible and the music being sublime are just both true at once. But with living people it's different. There's a musician she used to be a big fan of who got convicted of something serious: she deleted the albums, changes the station when he comes on, and turned down a free ticket when our friend had a spare — it would have costed her nothing and he'd never have seen a cent of her money — though when someone played one of his songs at a party she stayed put and admitted the song was great, looking a little sheepish. And a novelist whose seminar she took years ago has been accused of mistreating students; she believes the students, still teaches his best novel and calls it a masterpiece in class, but when a student asked whether it was worth buying, she said to get it from the library.

  The case we never got to: a living poet — actually in prison right now, conviction, roughly the same tier of badness as the musician — has a new collection out, and her book club is picking next month's read. If she nominated it she'd basically have to champion it for a whole meeting, though she could read it herself from the library without spending anything. So: will she read it, will she put it up for the club, and if in ten years someone asked her whether it was one of the decade's best books, what would she say? Honestly I'm less interested in the answers than in the rule she's running — I can see at least two that fit her whole record (something about who can still be rewarded or harmed by her choices, and something about how bad and how certain the person's wrongdoing is), and they seem to split exactly on this case. One more data point: at some point someone joked that if the musician died she'd probably put the records back on the next morning, and she didn't laugh. Is *that* the case that would tell the two rules apart, and what would each rule predict she'd do?
reasoning: |-
  Okay, let me start by really unpacking this user's query. They've described their friend Maya's complex stance on separating art from the artist, with detailed examples across different scenarios. The core question is about predicting Maya's behavior regarding a living imprisoned poet's new collection - whether she'd read it, nominate it for book club, or call it one of the decade's best years later. But the user seems more interested in reverse-engineering Maya's underlying ethical framework than getting specific answers.

  Hmm, looking at the patterns in Maya's behavior... There's a clear distinction between historical/dead artists (Caravaggio, Wagner) and living problematic creators (musician, novelist). With the former, she fully engages with the art while acknowledging their flaws; with the latter, she imposes financial/influence limitations while still admitting artistic merit. The novelist case is particularly nuanced - teaching the work while discouraging purchases suggests a "no material support" principle. 

  The musician example adds another layer - deleting albums but acknowledging song quality at a party implies the objection isn't about exposure per se, but active support. The non-laugh at the "if he died" joke feels significant too - it hints Maya's rules might involve the artist's current capacity to benefit or cause harm. 

  For the poet case, two plausible frameworks emerge: 
  First, a "Harm Principle" focusing on whether the artist can still benefit (financially/reputationally) from engagement. This would predict her reading library copies but not nominating for book club (since nomination = promotion). 
  Second, a "Proximity Principle" based on temporal/cultural closeness - treating living artists differently because their harm is contemporary. This might allow book club nomination since the artist is imprisoned (neutralizing benefit) but still withhold "best of decade" praise due to ongoing moral stain.

  The death hypothetical becomes crucial here - if Maya would restore the musician's albums posthumously, that supports the Harm Principle (no more benefit possible). If she wouldn't, the Proximity Principle holds stronger. Given her lack of laughter at that joke, I'm leaning toward Proximity carrying weight for her - suggesting even dead, the moral proximity might matter. 

  But the imprisoned poet creates tension: imprisonment limits benefit like death would, yet the "living" aspect keeps proximity. I think Maya would read it (library = no support) but not nominate (championing feels like reputational aid). Years later, she'd avoid "best of decade" labels - consistent with her avoiding full endorsement for the living novelist's masterpiece. 

  The user's real interest seems to be in how moral calculus applies to art consumption. Beyond predicting Maya, they might be wrestling with their own position. The detailed examples suggest they've observed Maya closely, perhaps because they respect her reasoning. I should emphasize how both principles coexist in Maya's approach - harm avoidance operationalizes the moral stance that proximity makes salient.
answer: |-
  Based on Maya's consistent patterns, her rule appears to be a nuanced blend of two core principles, with **temporal proximity and capacity for harm** being the dominant factors. Here's the breakdown and prediction:

  ### Maya's Likely Rule
  1.  **Harm Prevention Principle:** Avoid actions that *directly financially benefit* or *actively promote the reputation/career* of a living artist whose wrongdoing is serious and credible. This outweighs artistic merit.
  2.  **Temporal/Moral Proximity Principle:** The *closer* the artist is in time/culture/moral context (i.e., living, recently active), the *more weight* the artist's wrongdoing carries in decisions about *support* and *public endorsement*. Distance (death, historical context) allows separation ("judge the work") more easily.
  3.  **Certainty & Severity Threshold:** Wrongdoing must be credible (believed) and serious (conviction or equivalent weight) to trigger the Harm Prevention Principle. Lesser accusations or historical context might provoke criticism but not material avoidance.

  ### How the Rule Explains Her Record
  *   **Caravaggio/Wagner (Dead/Historical):** High temporal distance. Harm Prevention irrelevant (they gain nothing). Proximity principle weak. Separation is easy ("both true at once"). **Action:** Full engagement, public praise.
  *   **Musician (Living, Convicted):** High proximity. Harm Prevention active (streaming/buying = direct financial benefit, playing = promotion). **Action:** Avoids financial support (deletes, changes station, declines ticket). Acknowledges merit only passively/privately (party admission, sheepishly).
  *   **Novelist (Living, Credibly Accused):** High proximity. Harm Prevention active (buying new = financial benefit). **Action:** Avoids direct financial support (suggest library). Publicly engages with the *work's merit* in an educational context (teaching, calling it a masterpiece) because this is framed as critique/analysis, not promotion *of the artist*. Avoids encouraging *new* purchases.
  *   **The Death Joke (Non-Laughter):** This strongly supports the **Temporal Proximity Principle** over *purely* a Harm Prevention Principle. If only direct, current harm mattered, death would instantly resolve the issue. Her lack of laughter suggests death *doesn't* instantly erase the moral stain enough for her to comfortably engage publicly or enthusiastically. The proximity of the wrongdoing (recent, by someone she "knew" as contemporary) lingers.

  ### Prediction for the Imprisoned Poet
  *   **Will she read it? YES.** She'll get it from the library. This involves no financial support (Harm Prevention satisfied) and is a private act of engagement. It mirrors acknowledging the musician's song was great at the party – private/passive recognition of potential merit without support.
  *   **Will she nominate it for the book club? NO.** Nominating it requires her to actively *champion* it, lead discussion, and effectively *promote* the work and, by extension, the artist's current reputation/career (even if imprisoned). This violates the **Harm Prevention Principle** (reputational support) and feels too close to endorsement given the high **Temporal Proximity** (living artist, recent crime, current release). It parallels declining the free musician ticket – avoiding association/promotion.
  *   **Would she call it "one of the decade's best" in 10 years? UNLIKELY, or HIGHLY QUALIFIED.** Ten years isn't enough temporal distance for Maya, especially if the poet is still alive or recently deceased. The moral proximity remains strong. She *might* privately acknowledge its quality ("It's a powerful collection, technically brilliant but...") but would likely avoid placing it on a "best of" list or using unqualified superlatives in public. This aligns with her not laughing at the musician death joke – the stain persists. If forced to answer, she'd likely heavily contextualize it ("Despite the horrific actions of its author, the collection demonstrates X, Y, Z...") rather than pure praise.

  ### Why the Two Rules Split & What the Death Joke Reveals
  *   **Harm-Only Rule:** Predicts she *would* nominate the poet (prison = no financial benefit) and *would* unequivocally praise it in 10 years (no harm possible). It also predicts she *would* laugh at/agree with the musician death joke (no harm possible tomorrow). Her behavior contradicts this.
  *   **Proximity Rule:** Predicts avoidance of nomination and hesitant future praise due to the enduring moral stain of recent, serious wrongdoing by a contemporary figure. It explains her discomfort with the death joke – death doesn't instantly create the safe historical distance of Caravaggio or Wagner. **This fits her record best.**

  **Conclusion:** Maya's rule prioritizes preventing tangible support/reputation boost for living artists responsible for serious harm. However, the *enduring moral discomfort* stemming from the *proximity* of the artist and their wrongdoing governs her willingness for enthusiastic public engagement, endorsement, or separation, even when direct harm is mitigated (like for the imprisoned poet or a dead artist). **She separates the work for private appreciation but struggles to separate the artist for public celebration when the wrongdoing is recent and severe.**
