          However, to avoid complexity, we can fix the threshold at the midpoint of the possible range (which is 0 to 18, so 9). Then we have two kinds of bets:
            - Bet on High: Payer (the one who believes high) pays 1 unit to the receiver (who believes low) now. If T>=10 (for example), then the receiver pays the payer 2 units. If T<10, the receiver pays nothing. Note: This is a bet at 1:1 odds (the payer risks 1 to win 1 net, because they get 2 back but they already paid 1 so net gain is 1 and net loss is 1). Alternatively, we can do:

