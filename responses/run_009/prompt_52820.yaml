  4. **Trading Period:**
     - Students walk around and try to find partners to trade. They can show their private signals if they wish? But note: they are not forced to reveal their signals. They can lie or be strategic in what they reveal. However, the key is that the willingness to trade is a signal.

     - The instructor records each trade (who bought and who sold) on the board.

     - The trading period lasts 10 minutes.

  5. **Reveal and Settlement:**
     - After trading, the instructor reveals the true `T`.
     - Settle all bets: For each bet, if T>=10, the buyer gets 2 units from the seller. If T<10, the seller keeps the 1 unit and the buyer gets nothing.

  6. **Payoff:** Students count their final play money (or candy). They started with 10, and then they made trades.

  **Debriefing:**

  The point is to show that if students are rational and update based on the fact that someone is willing to take the other side of the bet, they should become less sure and hence trade less. We expect that after a few trades, students might become reluctant to trade because they realize that the other person's willingness to trade is evidence against their own belief.

  However, what will likely happen is that initially there will be trades because students have different signals. Then, as they talk to each other, they might update but not fully. Also, note that the common prior assumption: we all started with the same prior over `T`? Actually, in this setup, we didn't specify a prior. We can assume that before the vote, the prior is symmetric? But actually, the vote is taken from the class, so the prior is the distribution of the vote. We can note that the prior distribution of `T` is binomial (if we assume each student independently votes yes with probability p) but we don't know p. Alternatively, we can think of the prior as the empirical distribution of the class.

  **Key Discussion Points:**
  1. **Common Prior Assumption:** In this game, the common prior is the distribution of `T` before any signals. We can ask: what did we all know about `T` before we got our signals? We knew it would be between 0 and 18. But without a shared prior distribution, the updating might be inconsistent. We can assume a uniform prior? Actually, we didn't specify. This is a weakness of the game: we don't have a well-defined common prior. But we can note that the signals were generated from the same true state and the same noise distribution. So the common prior is the joint distribution over the state and signals. The fact that the noise is independent and symmetric is part of the common prior.

  2. **Why trade occurs:** Students with high signals will be buyers (bet that T>=10) and those with low signals will be sellers. But when a buyer approaches a seller, the buyer should think: "Why is this person willing to sell? They must have a low signal." Similarly, the seller thinks: "Why is this person willing to buy? They must have a high signal." This should cause them to update their beliefs and possibly not trade.

  3. **What actually happens:** In practice, students may not update fully. They might trade because they trust their own signal more. Or because they don't think about the informational content of the trade. So we expect some trades to happen.

  4. **Common Knowledge:** We don't achieve common knowledge in the game because students don't know what others know. They only know their own signal and the fact that someone is willing to trade. But they don't know the entire structure of the information. Also, after trading, they might reveal their signals to each other, which would update their beliefs and lead to no further trade. But the theorem says that even without revealing signals, the willingness to trade should be enough.

  **Predictable Problems:**
  1. **Time Constraints:** The trading period might be too short for students to update and realize the trap.

  2. **Lack of Rational Updating:** Students might not update their beliefs correctly. They might trade based on their initial signal and ignore the informational content of the trade.

  3. **Heterogeneous Priors:** Students might have different prior beliefs about the question (e.g., some think the class is more likely to say yes to pineapple on pizza). This violates the common prior assumption. We can try to mitigate by choosing a neutral question? But it might not be enough.

  4. **Noise in Signals:** The noise we added might be too large or too small. If too large, signals are not very informative, so trade might be heavy. If too small, signals are very informative, and trade might be light. We chose uniform {-2,-1,0,1,2} to have moderate noise.

  5. **Threshold Choice:** The fixed threshold (10) might not be the natural midpoint. We can set the threshold at the median of the prior? But we don't know the prior. Alternatively, we can let students choose the threshold? But that complicates the game.

  6. **Common Knowledge Gap:** The theorem relies on common knowledge of rationality and the information structure. In the game, we don't have common knowledge of the signal structure (everyone knows the noise distribution? We can tell them). We can explain the signal generation process to everyone, so they know that signals are T plus independent noise from the uniform set {-2,-1,0,1,2}. Then they share a common prior.

  **What the Game Cannot Reproduce:**
  1. **Common Knowledge of Rationality:** We cannot assume that every student is a perfect Bayesian updater. Some might trade for fun, or not update at all.

  2. **Common Knowledge of the Information Structure:** Even if we explain the signal generation, students might not fully incorporate that into their reasoning.

  3. **Iterative Nature of Aumann:** The theorem involves iterated knowledge: I know that you know that I know ... the information structure. In the game, we get at most one or two levels.

  4. **Infinite Regress of Knowledge:** In theory, the updating goes on until they agree. In practice, we get one or two updates.

  **Revised Setup to Address Common Prior:**
  - Before the vote, explain to the class that we are going to assume a common prior: each student independently votes "yes" with probability 0.5. Then T is Binomial(18,0.5). And the signals are generated as T + e_i (with e_i as above). Then we can compute the posterior distribution for each student. But we don't do that in class? We just assume it.

  **Alternative: Use a Known Distribution for T:**
  - Instead of using the class vote, we can have T drawn from a known distribution. For example, the instructor rolls a 19-sided die (0 to 18) in advance (or uses a random number generator) to get T. Then the signals are generated as above. Then the vote is not needed? Actually, we don't need the vote at all. We can just have T be the unknown state, and then we reveal it at the end.

  This avoids the issue of having a prior that is not common because the class vote introduces heterogeneity in priors (if students have different beliefs about the class). So:

  **Revised Setup:**
  1. The instructor chooses T randomly from a uniform distribution over {0,1,...,18}. (Write T on a piece of paper and seal it in an envelope, or use a random number generator and show the class the result at the end.)

  2. Generate signals: For each student, the instructor computes s_i = T + e_i (with e_i uniform from {-2,-1,0,1,2}, clipped to [0,18]). Then hand out the signals.

  3. Proceed with the betting as described.

  This way, the common prior is the uniform distribution over T and the independent noise for each signal.

  **Materials:**
  - Random number generator (or a way to draw T uniformly from 0 to 18).
  - Slips of paper for signals.
  - Play money (or candy) for each student (10 units each).
  - A way to record trades (clipboard for instructor).

  **Rules:**
  - Each student gets a private signal (a number between 0 and 18) and 10 units of play money.
  - They can trade the bet defined as: 
     - The event: T >= 10.
     - A buyer pays 1 unit to a seller to enter the contract. At the end, if T>=10, the seller pays 2 units to the buyer. If T<10, no further payment.
  - Students are allowed to discuss and show their signals if they wish, but they are not required to be truthful.
  - The instructor records each trade (buyer, seller, and the time?).
  - Trading period: 10 minutes.
  - After trading, reveal T and settle the bets.

  **Debriefing Guide:**
  1. **What happened?** Ask the class: How many trades occurred? Why did you trade? Did anyone change their mind during the trading period? Why?

  2. **The Trap:** Did anyone think: "Why is this person willing to take the other side of the bet? Maybe they know something I don't." If so, did that stop them from trading?

  3. **Common Prior:** Remind them that we all started with the same prior (uniform T) and the same understanding of the signal generation. Ask: How should a rational Bayesian update?
     - Suppose a student has a signal of 12. Then they believe T is around 12. They are bullish and want to buy the bet (that T>=10). But when they find a seller, they must ask: what signal must the seller have? The seller is willing to sell only if they think T<10 is likely. So the seller probably has a low signal. Then the buyer should update downward: "If the seller is selling, maybe T is not as high as I thought." Similarly, the seller updates upward. This might make them not want to trade.

  4. **No-Trade Theorem:** Explain that in theory, if there is a common prior and common knowledge of rationality, then no trade should occur because the mere willingness to trade reveals that the other person has information contradicting your position, and you should update until you agree and don't see any gain from trade.

  5. **Why did trade happen?** Discuss:
     - Maybe because we don't have common knowledge of rationality? (Some students didn't update.)
     - Maybe because we didn't update iteratively? (We only updated once, but in theory it goes on until agreement.)
     - Heterogeneous priors? (Even though we set a common prior, students might have different risk attitudes or different ways of updating? But the common prior assumption requires that they update using Bayes' rule.)

  6. **Common Knowledge vs. Everyone Knowing:** 
     - Everyone knows the rules (the signal generating process) -> but that's not common knowledge. Common knowledge would require that everyone knows that everyone knows, and so on. In practice, we only explained it once, so it's not common knowledge. But we can hope that it's at least mutual knowledge.

  7. **What the Game Shows:** The game illustrates that trade can break down because of the informational content of the trade itself. But it doesn't perfectly achieve the no-trade result because of the limitations.

  **Predictable Problems:**
  - Students might trade a lot because they are not updating at all. Then the debriefing becomes about why they didn't update.
  - The threshold of 10 might not be the natural point. If the true T is 9 or 10, then the bet is close. But if T is 15, then many signals will be high and few low, so there might be few sellers. And vice versa.
  - Students might not understand the bet. We should explain the bet clearly and do an example.

  **What the Game Cannot Reproduce:**
  - **Common Knowledge:** We cannot achieve the infinite regress of knowledge in a classroom setting.
  - **Perfect Bayesian Updating:** Students are not computers. They might not update correctly.
  - **Common Prior in Practice:** Even though we set a common prior, students might not have internalized it the same way.

  Despite these limitations, the game should still create an engaging experience that makes the no-trade theorem feel more surprising and real.

  **Final Instructions for the Instructor:**
  - Pre-generate T (or use the class vote with the understanding that the prior might not be uniform) and the signals.
  - Explain the rules clearly, including the bet structure and the updating process (if you wish, you can remind them to think about why the other person is willing to trade).
  - Run the trading period.
  - Reveal T and settle.
  - Lead the debriefing.

  This should take about 40-50 minutes, leaving time for discussion.
answer: |-
  Below is a complete design for an in-class game to illustrate the common prior assumption, Aumann's agreement theorem, and no-trade theorems. The game uses asymmetric private signals, play money (or candy), and a betting mechanism where willingness to trade serves as evidence, leading to reduced trade volume. I'll outline the setup, rules, materials, and debrief, then address predictable pitfalls and inherent limitations.

  ---

  ### **Game Title**: The Signal Betting Challenge  
  **Objective**: Students bet on an unknown quantity (a "mystery number" \(X\)) using private signals. The goal is to show that rational agents should stop trading once they realize a counterparty's willingness to bet reveals contradictory information.  

  ---

  ### **Rules and Setup**  
  **Step 1: Define the Unknown Quantity**  
  - **\(X\)**: A number between 0–100, known only to the instructor (e.g., \(X = 60\)).  
  - **Why this works**: \(X\) is symmetric and intuitive. Students bet on whether \(X \geq 50\) (simplifying to a binary outcome).  

  **Step 2: Generate Private Signals**  
  - **Signal Structure**:  
    - Each student receives one of two signal types:  
      - **Type A (Precise but Narrow)**: "\(X\) is between \([Y-10, Y+10]\)" (e.g., [50, 70]).  
      - **Type B (Broad but Noisy)**: "\(X\) is between \([Y-30, Y+30]\)" (e.g., [30, 90]).  
    - \(Y\) is generated by adding noise to \(X\):  
      - For Type A: \(Y_A = X + \epsilon\), where \(\epsilon \sim \text{Uniform}(-5, 5)\) (clipped to keep \(Y_A \in [10, 90]\)).  
      - For Type B: \(Y_B = X + \epsilon\), where \(\epsilon \sim \text{Uniform}(-15, 15)\) (clipped to \(Y_B \in [0, 100]\)).  
  - **Distribution**:  
    - 9 students get Type A signals.  
    - 9 students get Type B signals.  
    - **Seeding**: Pre-generate signals on slips of paper. Example for \(X=60\):  
      - Type A: "Between 55–75", "Between 50–70", etc.  
      - Type B: "Between 45–105" (clipped to 45–100), "Between 30–90", etc.  

  **Step 3: Betting Mechanism**  
  - **Bet Definition**: Students bet on whether \(X \geq 50\).  
    - **Bull bet (Optimist)**: Pays $1 to bet. Wins $2 if \(X \geq 50\).  
    - **Bear bet (Pessimist)**: Pays $1 to bet. Wins $2 if \(X < 50\).  
  - **Trading Rules**:  
    - Students start with $10 in play money (or 10 pieces of candy).  
    - They pair up freely to propose bets. A bet is valid only if one student is Bull and the other is Bear.  
    - After a bet is agreed, both students pay $1 to the instructor (escrow). The winner collects $2 after \(X\) is revealed.  
    - **Key Constraint**: No student can bet twice on the same side (e.g., a Bull cannot make multiple Bull bets). This forces diversification and mirrors real markets.  
  - **Trading Period**: 10 minutes. Instructor tracks:  
    - Number of bets placed.  
    - How many students decline bets after initial enthusiasm.  

  **Step 4: Payoff and Revelation**  
  - After trading, reveal \(X\) (e.g., 60).  
  - Settle bets: Bulls win $2 if \(X \geq 50\); Bears win $2 if \(X < 50\).  
  - Students count final wealth. No participation prizes—emphasize that rational play should preserve wealth.  

  ---

  ### **Materials**  
  - **Signals**: 18 pre-generated paper slips (mix Type A/B).  
  - **Money**: Play money (e.g., poker chips) or candy (e.g., M&M’s).  
  - **Tracking**: Whiteboard to record:  
    - "Bets Placed: [Count]" (update live).  
    - "Public Belief: X ≥ 50?" (track shifts via hand votes).  
  - **Revelation**: Envelope with \(X\) written inside.  

  ---

  ### **Predictable Problems & Mitigation**  
  1. **Students won’t update beliefs**  
     - **Why**: Humans underweight others' signals. A Type A student with [55,75] might ignore a Bear’s willingness to bet.  
     - **Mitigation**: Mid-game pause. Ask: *"If someone bets against you, what does that imply about their signal?"* Nudge Bayesian reasoning.  

  2. **Trading is too active or too sparse**  
     - **Why**: Signals may cluster (e.g., all Type B near \(X=60\) support \(X \geq 50\)). Noise can overwhelm evidence.  
     - **Mitigation**: Ensure signal diversity. Include at least 2–3 students with signals suggesting \(X < 50\) (e.g., Type A: [40,60]).  

  3. **Signals are misunderstood**  
     - **Why**: "Between 30–90" feels uninformative. Students may ignore it.  
     - **Mitigation**: Clarify: *"This means \(X\) is equally likely to be 30 or 90. What does that imply about \(X \geq 50\)?"*  

  4. **Wealth effects distort behavior**  
     - **Why**: Losing $1 feels inconsequential with play money.  
     - **Mitigation**: Use candy (loss aversion) or shame: *"If you lose, announce ‘I was wrong!’ to the class."*  

  ---

  ### **Debrief: Mapping to Theory**  
  **Part 1: What Happened?**  
  - Poll students:  
    - *"How many bets were placed? Why did trading slow down?"*  
    - *"Who declined a bet? What changed your mind?"*  
  - Highlight: Willingness to bet (e.g., a Bear’s offer) is evidence against your position. Rational players update and decline.  

  **Part 2: Common Knowledge vs. "Everyone Knows"**  
  - **Scenario**: Suppose all Type A signals imply \(X \geq 50\).  
    - *"Everyone knows \(X \geq 50\)? Yes. But is it common knowledge?"*  
    - **Critical distinction**: "Everyone knows" ≠ common knowledge. Students don’t know *that others know*. A Type B student may doubt others’ certainty, allowing bets until evidence compounds.  
  - **Game link**: Early bets happen because students don’t realize others hold strong signals. As refusals mount, it becomes "known" that signals conflict, drying up trade.  

  **Part 3: Common Prior Assumption (CPA)**  
  - **Where CPA works**: Signals were drawn from a shared prior (noise distributions were public). Students updated from the *same* starting point.  
  - **Where CPA is idealized**:  
    - Real people have heterogeneous priors (e.g., "Type B signals are useless").  
    - CPA ignores distrust. If students suspect signal manipulation, trade persists.  
  - **Key insight**: CPA enables agreement. Without it, no-trade fails (e.g., if pessimists distrust optimists’ signals, bets continue).  

  ---

  ### **Limitations of the Game**  
  1. **Genuine common knowledge is unrealizable**  
     - **Why**: Aumann assumes infinite recursion ("I know that you know that I know..."). In class, students grasp 1–2 levels.  
     - **Consequence**: Trade doesn’t vanish instantly. Some bets occur before evidence cascades.  
     - **How to explain**: *"In theory, common knowledge means no trade happens. Here, it takes time—because we’re human."*  

  2. **Perfect rationality is absent**  
     - **Why**: Students won’t Bayes-update perfectly. Some bet for "fun."  
     - **Consequence**: Residual trade occurs, muddying the no-trade signal.  
     - **Silver lining**: This flaw illustrates why CPA is a modeling tool—it abstracts psychological noise.  

  3. **Signals aren’t "hard" evidence**  
     - **Why**: Real agents receive verifiable data (e.g., research). Here, signals are just ranges.  
     - **Consequence**: Students may not treat signals as credible, weakening the update.  
     - **Fix**: Stress that signals are generated honestly.  

  ---

  ### **Instructor Script Snippents**  
  - **Intro**: *"You’re traders with insider info. Bet on whether \(X \geq 50\), but remember: if someone takes the other side, they might know something you don’t."*  
  - **Mid-game**: *"Pause! If a Bear accepts your Bull bet, what does that tell you? Should you still bet?"*  
  - **Reveal**: *"X was 60. Bulls win. How many of you lost money? Why did you bet despite the risks?"*  
  - **Debrief closer**: *"In theory, common knowledge + CPA means no bets. But humans need time to update. That’s why no-trade theorems describe idealized rationality."*  

  This game creates an experiential hook for Aumann’s theorem. It won’t perfectly replicate the math, but it forces students to confront why "rational agents can’t agree to disagree" is profound—not just a slogan. Run it with candor about flaws, and it will stick.
