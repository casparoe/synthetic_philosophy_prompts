          **Logistics:**
            - To avoid the need for escrow, we can do: When two students agree on a bet, they each write down the terms and the names and hand it to the instructor. The instructor records the bet and collects the stakes (each puts 1 unit into the pot). Then after the reveal, the instructor pays 2 units to the winner and nothing to the loser. So each bet costs 1 unit to enter and pays 2 units to the winner.

          - Alternatively, we can have a bet that costs 1 unit to buy and pays 2 units if the event happens. Then one student is the buyer and the other is the seller. The buyer pays 1 unit to the seller at the time of the bet. Then after the reveal, if the event happens, the seller pays 2 units to the buyer. If not, nothing. This is equivalent to the buyer having a net gain of 1 unit if the event occurs (because they paid 1 and get 2) and a loss of 1 if not. The seller has the opposite.

          We'll use the latter for simplicity in explanation.

          **Events to bet on:** We can let the students choose the event arbitrarily? But that might be too complex. Instead, we can fix the event to be "T >= 10". Then students can either buy or sell the bet on T>=10.

          - Buyer (bull): Pays 1 unit to the seller now. If T>=10, receives 2 units from the seller at the end. If T<10, receives nothing.
          - Seller (bear): Receives 1 unit from the buyer now. If T>=10, pays 2 units to the buyer. If T<10, pays nothing.

