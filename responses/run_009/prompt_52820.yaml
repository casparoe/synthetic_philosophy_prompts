  We are going to design an in-class game to illustrate the no-trade theorem and the common prior assumption. The goal is for students to experience how the willingness of others to trade can be informative and lead to a breakdown in trade even before the true state is revealed.

  ### Game Design: "The Common Prior Betting Game"

  **Objective:** Students will trade bets on an unknown quantity (like the total number of "yes" votes in a class survey) based on private signals. The twist is that the very fact that someone is willing to bet against you should update your belief, potentially leading to no trade.

  **Setup:**
  1. **Unknown Quantity:** Choose a number that will be determined by the class. For simplicity, let it be the number of students in the class who answer "yes" to a specific question. Example question: "Do you think that pineapple belongs on pizza?" (or any lighthearted question that might split the class). Let the true state be the total count of "yes", denoted by `T`. Note: `T` is between 0 and 18 (the class size).

  2. **Private Signals:** Each student receives a private signal about `T`. We will generate noisy signals as follows:
     - Each student is told the true `T` plus some noise. The noise is drawn independently from a symmetric distribution around zero. For simplicity, we can use a uniform distribution over {-2, -1, 0, 1, 2}. So the signal `s_i = T + e_i`, where `e_i` is the noise. However, note that `T` is not known until after the betting, so we cannot compute the signal until we have the votes. Instead, we can simulate the signals by having the instructor generate a plausible `T` in advance? But that would break the realism. Alternatively, we can use a two-step process:

     **Alternative approach to signals:**
     - We want the signals to be informative but noisy. Since the true `T` is the count of a binary event, we can have each student get a signal that is a sample from a binomial distribution with mean `T` but with added noise? Alternatively, we can do:

     **Practical signal generation:**
     - After the vote, we know `T`. But we want to give signals before the vote? Actually, we can do the vote first and keep it secret until the end. Then the signals can be computed by the instructor and given to the students.

     **Steps:**
     a. Have each student vote "yes" or "no" on the question (on a piece of paper, collected by the instructor). The instructor counts the total `T` (number of "yes") but does not reveal it.
     b. For each student, the instructor generates a signal `s_i = T + e_i`, where `e_i` is independently drawn from a uniform distribution over {-2, -1, 0, 1, 2}. However, we must clip the signal so that it is between 0 and 18. So if `T + e_i` is negative, set to 0; if above 18, set to 18.

     Then, write each signal on a slip of paper and hand it to the student. This is their private signal.

