prompt: |-
  I'm a psychiatry resident taking a bioethics course, and I keep snagging on what our institutions actually assume about whether my earlier self can speak for my later self. Consider three features of practice that everyone in the hospital recognizes. First, in ordinary medicine: a woman, while competent, writes a living will refusing artificial nutrition should she ever have advanced dementia. Decades later, demented, she seems content — she smiles at visitors, enjoys music, eats willingly when offered — and nobody doubts she would accept food. Yet the directive is honored: the staff withhold or withdraw the tube feeding, and nearly everyone in the practice treats this not merely as permitted but as required, as a way of respecting her. Second, the demand side: had she instead written that she should be kept alive on a ventilator at all costs, whatever the doctors say, the directive would not bind — in somatic medicine an advance directive can refuse treatment but cannot compel it against clinical judgment. Third, closest to my daily work: some patients with psychotic illness, while lucid, sign psychiatric advance directives of a self-binding, Ulysses-contract kind — if I am psychotic and refuse medication, treat me over my objection. Some clinicians honor these during the episode, even over the violent protest of a patient screaming that he doesn't want it, on the grounds that this is what he asked for; others refuse, and in most jurisdictions a directive cannot compel treatment the treating team does not itself endorse. What strikes me is that the self-binding psychiatric case feels far more fraught to most people than the dementia case, even though in both an earlier, competent self gave an instruction that a later, incompetent self visibly contradicts, and in both the earlier self's word prevails over the later self's wishes.

  So here is my question: what theory of the authority of the earlier self does this pattern of practice presuppose? What view of the relation between the earlier and the later self makes it the case that the woman's earlier refusal should trump her demented self's contented continuation, or that the man's earlier signature should trump his present screaming — while also explaining why the demand side doesn't bind, and why the psychiatric self-binding case strikes so many as harder to justify than the dementia case? Some candidate views worth distinguishing, at least: that the earlier competent self just is the patient in a fuller sense than the later incompetent one (a metaphysical claim about identity over time); that directives protect the critical interests in a life going a certain way, which only a competent self can grasp, so that the later self's merely experiential interests can be overridden; that the earlier self's authority is really a protective arrangement made on the later self's behalf — a contract with future caregivers — rather than the later self being bound at all; or that the practice rests simply on distrust of incompetent wishes, taking them to express the disease rather than the person. Reconstruct the implicit theory as faithfully as you can, mark where the practice is philosophically underdetermined (compatible with several of these views), and identify where its parts presuppose inconsistent things. Then tell me what would have to change in the practice if we replaced the presupposed view with one on which the later self's interests count in their own right, whoever the later self turns out to be.

  For format: give the main analysis as prose, then follow it with a table with these columns — "Feature of the practice" (one row per element: advance refusal honored; advance demand non-binding; psychiatric self-binding honored only over objection; present competent refusal sovereign); "What it presupposes about the earlier self's authority"; "Rival views it quietly rules out"; and "Strictly required or underdetermined?", meaning whether several of the candidate views could justify that feature or only one. Include a final row covering the practice as a whole, and close with a one-paragraph verdict on whether the implicit theory comes out coherent.
reasoning: |-
  Hmm, this is a deep bioethics question from a psychiatry resident. The user is grappling with how medical institutions handle conflicts between a person's past competent directives and their present incompetent wishes across different contexts. They've identified three key practices: honoring advance refusals in dementia cases, not honoring advance demands for treatment, and the contested nature of psychiatric Ulysses contracts. 

  The core tension seems to be why we readily override a demented patient's apparent willingness to live but hesitate when a psychotic patient resists pre-authorized treatment, despite both involving competent past selves overruling incompetent present selves. 

  I need to reconstruct the implicit theory behind these practices. The institutional logic appears to prioritize competent past selves' decisions as more authentic representations of the person's true interests. In dementia cases, we treat the advance directive as sacred because we see the demented self as having lost the capacity to make value-based judgments - that smile over pureed carrots isn't a real choice. 

  For treatment demands, the refusal to honor them makes sense because medicine can't be compelled against clinical judgment - this is about resource allocation and professional integrity more than personal identity. 

  The psychiatric Ulysses contracts are tricky because psychosis doesn't obliterate personhood like dementia might; we still perceive the screaming patient as having moral weight. Plus there's the coercion factor - injecting someone against their will feels different than withholding a feeding tube.

  The table will help organize how each practice feature constrains possible theories. Notably, the dementia refusal case rules out theories where present experiential interests matter equally, while the non-binding demand feature contradicts strong metaphysical identity theories. 

  What's philosophically messy is how we weigh different types of incompetence. Dementia seems to erase the self more completely than psychosis in our collective imagination - hence the differential unease. If we truly valued present selves equally, we'd need radical changes: perhaps only honoring directives when present self can't communicate, or developing clearer tests for when incompetence voids personhood. 

  The whole system hangs together only if we accept a hierarchy of selves where competent past you gets to veto incompetent present you, except when your past demands clash with medical authority. It's coherent pragmatically but ethically shaky upon inspection.
answer: |-
  ## Analysis of the Implicit Theory of Self-Authority in Medical Practice

  The pattern of practice you describe reveals an implicit theory prioritizing the **authorized narrative agency** of the competent past self over the experiential state of the incompetent present self, grounded in a **hierarchical view of personhood and interests**. This theory rests on several interconnected presuppositions:

  1.  **Metaphysical Primacy of the Competent Self:** The competent self is viewed as the "true" or "authentic" self. Incompetence (dementia, psychosis) is seen as obscuring or distorting this core identity. The directive issued by the competent self represents the person's *enduring values and considered life plan*, while the wishes expressed during incompetence are primarily expressions of the *disease state*.
  2.  **Hierarchy of Interests:** The theory distinguishes between:
      *   **Critical Interests:** Long-term, value-laden goals defining a "good life" (e.g., avoiding prolonged life in severe dementia, maintaining autonomy via pre-commitment against psychosis). Only the competent self can form and articulate these.
      *   **Experiential Interests:** Moment-to-moment states of comfort, pleasure, or distress (e.g., contentedness in dementia, aversion to medication during psychosis). These are recognized but are considered subordinate to critical interests when competence is lost. Respecting the person means honoring their critical interests, even if it overrides their current experiential interests.
  3.  **Negative Liberty Focus:** The practice strongly affirms the right of the past self to *refuse* future unwanted interventions (negative liberty), seeing this as core to bodily autonomy and avoiding indignity. It does *not* recognize a corresponding right to *demand* specific future treatments (positive claim-rights), reserving clinical judgment and resource allocation decisions for the medical team and society. The past self cannot bind providers to actions they deem futile or inappropriate.
  4.  **Distrust of Incompetent Agency:** Wishes expressed during incompetence are heavily discounted. They are presumed *not* to reflect the authentic person's values or reasoned choices, but rather the pathology itself (brain disease in dementia, delusional thinking in psychosis). The screaming psychotic patient's refusal isn't seen as a valid expression of *their* will, but as a symptom obstructing their recovery to competence.
  5.  **Differential Weighting of Incompetence:** The theory implicitly ranks the *degree* to which incompetence negates the self. Advanced dementia is seen as fundamentally eroding the *capacity for value-laden existence and narrative continuity* – the smiling patient may experience pleasure, but lacks the cognitive structure to have "critical interests" competing with the past directive. Psychosis, however, is often seen as distorting judgment and perception *while preserving a core self still capable of suffering and protest*. Overriding the screaming psychotic patient feels like a direct assault on a *presently experiencing agent*, making the Ulysses contract feel more ethically fraught than withholding a feeding tube from the profoundly demented patient, whose experiential interests are seen as fleeting and disconnected from their former identity.

  **Philosophical Underdetermination and Inconsistency:**

  *   **Underdetermined:** The metaphysics of personal identity (is the demented self the "same person"?). The practice is compatible with both:
      *   A narrative identity view (the directive defines the authentic story).
      *   A "loss of personhood" view (the demented individual is no longer a bearer of critical interests).
      *   A purely interest-based view (critical > experiential interests, regardless of strict identity).
  *   **Underdetermined:** The precise justification for honoring psychiatric Ulysses contracts. It could be based on:
      *   Respecting past critical interests (avoiding consequences of psychosis).
      *   Restoring competence as the paramount goal (a therapeutic imperative).
      *   Fulfilling a pre-commitment viewed as self-preservation.
  *   **Potential Inconsistency:**
      *   The *degree* of discounting the present self's experiential interests seems arbitrary or context-dependent. Why is the demented self's contentedness so easily overridden while the psychotic self's distress and protest carry more (though not decisive) weight? The implicit hierarchy of incompetence types lacks a clear philosophical foundation within the practice itself.
      *   The justification for *not* honoring treatment demands (clinical judgment) is fundamentally different from the justifications for honoring refusals and Ulysses contracts (respecting autonomy/critical interests). The practice relies on distinct ethical principles (autonomy vs. beneficence/professional integrity/resource stewardship) for different features, making a single, unified "theory of self-authority" elusive.

  **Impact of Valuing the Later Self's Interests Equally:**

  If the later self's experiential interests held equal standing to the past self's directives, significant practice changes would be necessary:

  1.  **Advance Refusals:** Would require much stronger evidence that the *current* incompetent state aligns with the *predicted* state in the directive to justify withholding life-sustaining treatment. Contentedness in dementia might trigger a re-evaluation or presumption *against* withholding basic care like nutrition, prioritizing present well-being. Directives might be seen as creating a rebuttable presumption rather than a binding command.
  2.  **Psychiatric Ulysses Contracts:** Would become extremely difficult to justify over present objection, except perhaps in narrowly defined crisis situations where immediate treatment is essential to prevent catastrophic harm *to the present self*. The focus would shift towards less coercive crisis planning and respecting the present self's expressed aversion, even if irrational.
  3.  **General Practice:** Greater emphasis on "supported decision-making" during fluctuating competence. Advance directives might function more as guides to the *past self's values* to inform *current* best interest judgments by surrogates/teams, rather than as binding instructions. Withholding treatment against present experiential interests would require a much higher justificatory burden.

  **Analysis Table**

  | Feature of the Practice                          | What it Presupposes about the Earlier Self's Authority                            | Rival Views it Quietly Rules Out                                  | Strictly Required or Underdetermined?                     |
  | :----------------------------------------------- | :-------------------------------------------------------------------------------- | :---------------------------------------------------------------- | :-------------------------------------------------------- |
  | **Advance Refusal Honored** (Dementia Tube Feed) | Authority to define critical interests (avoiding indignity); Present experiential interests subordinate; Present self lacks capacity for authentic critical interests. | Views granting the incompetent self equal standing or authority; Views prioritizing present experiential well-being over past values. | **Underdetermined:** Compatible with Narrative Identity, Critical Interests > Experiential Interests, Loss of Personhood views. Rules out strong Present-Self Sovereignty. |
  | **Advance Demand Non-Binding**                   | Authority is limited to *refusing* interventions (negative liberty); Cannot create positive obligations against clinical/societal judgment; Future caregivers not bound by contract. | Strong "binding contract" views; Views where patient demand creates absolute provider obligation; Libertarian views mandating requested treatment. | **Strictly Required:** Rules out views where the earlier self can compel treatment via directive. Based on distinct principle (provider integrity/resource limits). |
  | **Psychiatric Self-Binding Honored Only Over Objection** | Authority to pre-commit to treatment based on critical interests (avoiding psychosis consequences/restoring competence); BUT present self's protest/experiential interests carry significant (though not decisive) weight; Distrust of psychotic refusal is strong but not absolute. | Views that completely discount the psychotic self's protest (as pure pathology); Views granting the psychotic self full present sovereignty. | **Underdetermined:** Compatible with Critical Interests focus (prioritizing past), Therapeutic Imperative focus (restoring competence), or a heavily discounted Present Self view. Rules out Present-Self Sovereignty. |
  | **Present Competent Refusal Sovereign**          | The *current* competent self has absolute authority over body and treatment *now*; Trumps any past directive demanding treatment. | Views that past binding commitments override current competent choices. | **Strictly Required:** Core principle of contemporaneous autonomy. Rules out strong Ulysses views applied to the competent. |
  | **Practice as a Whole**                          | Hierarchical view: Competent Self > Critical Interests > Experiential Interests of Incompetent Self; Past competent self is the primary author of the life narrative; Incompetent wishes are discounted as non-authentic; Strong asymmetry between refusing vs. demanding treatment. | Unified theories of strict personal identity persistence; Views granting significant moral weight to the experiential interests of the incompetent self; Views seeing incompetent selves as equally "owners" of their present existence. | **N/A** - The combination reveals the core presuppositions and tensions. |

  **Verdict on Coherence:**

  The implicit theory is **pragmatically coherent but philosophically tense**. It coheres around the central pillar of prioritizing the critical interests articulated by the competent self and distrusting the agency of the incompetent self, providing a workable framework for respecting autonomy-over-time in contexts like dementia refusal. However, tension arises from: 1) The inconsistent weighting of experiential interests across types of incompetence (dementia vs. psychosis), which lacks a clear principled basis within the theory itself; 2) The reliance on distinct ethical principles (autonomy for refusals/Ulysses, beneficence/professional integrity for non-binding demands) without fully reconciling them under a single view of self-authority; and 3) The underdetermined metaphysics of identity. While functional for decision-making, the theory's internal justifications for *why* the past self binds the future self differ subtly between contexts and reveal unresolved philosophical conflicts, particularly regarding the moral status of the experiencing incompetent self.
