  For part (a) on whether this preserves personhood concepts: I think Dennett can handle moral responsibility through his "intentional stance" framework. Responsibility attaches to systems predictable via narratives of agency. First-person authority becomes narrative authority - you're the "editor-in-chief" of your story. But is this enough? The eliminativists have a point about raw experience - the "what it's like" seems lost in abstraction.

