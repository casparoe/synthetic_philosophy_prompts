  My verdict: I'll defend a modified Dennettian view. The pure deflationists are too dismissive of phenomenology, while the eliminativists underestimate narrative's constitutive power. The self is abstract but not therefore unreal - it's a pattern that genuinely unifies cognition and experience. I'll use concepts from enactivism (Varela) and narrative psychology (Bruner) to show how narratives scaffold subjective experience. For responsibility, I'll argue that the narrative self is the only "self" we've ever held responsible - the inner CEO was always a myth.

