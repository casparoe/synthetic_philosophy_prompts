  We are going to construct a scenario in the context of insurance. The key idea is that the availability of information can lead the agent to make a commitment (an insurance contract) that turns out to be suboptimal ex post, and the commitment is such that without the possibility of the information, the agent would have chosen a different and better action.

  Setting: An individual faces a potential loss. There are two states: loss (L) and no loss (N). The loss amount is fixed at $L. The individual has initial wealth $W. The probability of loss is p.

  The agent has the option to buy insurance. The insurance contract is a pair (premium, coverage). We consider two types of contracts:

  1. Full insurance: The agent pays a premium π and is fully covered in case of loss. So wealth becomes W - π in both states.

  2. No insurance: The agent pays nothing and faces the risk. Wealth is W in no loss, and W - L in loss.

  Additionally, we introduce the possibility of a free, perfectly reliable, and verifiable test that reveals whether the loss will occur or not. The test result is available after the insurance purchase decision but before the loss state is realized. However, the agent can sign a binding contract (commitment) regarding how they will use the insurance after the test result.

  The twist: The agent, before knowing whether the test will be available, can choose to commit to a contingent plan. Specifically, the agent might sign a contract that says:

     "If the test becomes available and reveals that the loss will occur, then I must buy full insurance at a premium that is actuarially fair given the test result. If the test reveals no loss, then I will not buy insurance."

  But note: the test might not be available at all. The agent has to decide on this commitment before knowing whether the test will be offered.

  However, we must design the case so that without the test, the agent would prefer one action (say, no insurance) but with the test and the commitment, the agent ends up worse off.

  How? We make the premium for full insurance in the case of a positive test result (loss will occur) very high. Why? Because if the test is available and shows that the loss will occur, then the insurance company knows that they will have to pay the loss for sure. So they charge a premium that is equal to the loss (actuarially fair for that state). Similarly, if the test shows no loss, then the agent doesn't buy insurance.

  But without the test, the agent might prefer to not buy insurance at all. However, if the agent commits to the above plan and the test becomes available, then in the event of a positive test (which happens with probability p) the agent must pay the entire loss amount as premium (so wealth becomes W - L) and in the event of a negative test (probability 1-p) the agent does nothing and has wealth W. So the expected utility without the test (if the agent doesn't buy insurance) is:

     EU_no_insurance = (1-p)*u(W) + p*u(W - L)

  But if the test becomes available and the agent has committed to the plan, then the agent's expected utility (conditional on the test being available) is:

     EU_commit_with_test = p * u(W - L) + (1-p) * u(W)

  Which is exactly the same as not having insurance! So why would the agent commit to this?

  Here's the catch: the agent might be forced into this commitment because without the test, the agent might prefer to buy full insurance at a fair premium for the whole population. But in this scenario, we assume that the insurance market is such that without the test, the agent can buy insurance at a fair premium based on the prior probability. That premium would be π = p * L.

  So without the test, the agent has two choices:

     Option 1: No insurance -> EU = (1-p)*u(W) + p*u(W-L)

     Option 2: Full insurance at premium π = p*L -> EU = u(W - p*L)

  If the agent is risk averse, then u(W - p*L) > (1-p)*u(W) + p*u(W-L), so they would choose full insurance.

  But now, if the agent is given the option to have the test and commit to the above plan, what happens?

  We must consider that the test might be available or not. Let’s assume that the test becomes available with probability q. The agent has to make a decision ex ante (before knowing if the test is available) about whether to commit to the contingent plan.

  The commitment contract we described is:

     - If the test becomes available and shows loss, then the agent buys insurance at premium L (so wealth W-L).
     - If the test becomes available and shows no loss, then the agent does nothing (wealth W).
     - If the test is not available, then the agent must do... what? We need to specify.

  We have two main strategies for the agent ex ante:

  Strategy A: Do not commit to the test-based plan. Then, regardless of whether the test becomes available, the agent will buy full insurance at the fair premium π = p*L when the test is not available. But what if the test is available? Then the agent, not having committed, can make a decision after the test result. They would:

     - If the test shows loss, they would want to buy insurance at the fair premium for that state, which is L. But the insurance company, knowing the test result, would only offer insurance at premium L. So the agent buys insurance and gets wealth W - L.
     - If the test shows no loss, they don't buy insurance and get W.

     So if the test is available and the agent did not commit, they get:

          p * u(W-L) + (1-p) * u(W)

     But note: without the test, they get u(W - p*L). So expected utility for Strategy A is:

          q * [ p*u(W-L) + (1-p)*u(W) ] + (1-q) * u(W - p*L)

  Strategy B: Commit to the contingent plan. This plan specifies:

     - If the test is available: 
          - if loss: buy insurance at premium L -> wealth W-L
          - if no loss: no insurance -> wealth W
     - If the test is not available: then the agent must have a default action. We must specify this. Let's say the commitment contract also specifies that without the test, the agent buys full insurance at the fair premium π = p*L.

     Then, the expected utility for Strategy B is:

          q * [ p*u(W-L) + (1-p)*u(W) ] + (1-q) * u(W - p*L)

     This is the same as Strategy A! So what's the problem?

  We need to design a scenario where the agent is forced to take a different action in the no-test case under commitment. Alternatively, we can introduce a cost or a constraint.

