prompt: |-
  So i'm a phd student in econ, writing a dissertation chapter on rational ignorance, and my claim is that information can have *negative* expected value even for a perfectly rational expected-utility agent, as long as the agent could sign binding contracts before the info arrives. The obvious referee worry is that this is just the surprise party / "knowing ruins the anticipation" phenomenon dressed up, and i want a case where that reading isn't available. This is where you come in.

  Build me the thought experiment. Specs:

  - One agent, no adversary, no predictor, no weird physics. The setting should be something like insurance, medical diagnostics, hiring, or warranties.
  - The information is genuinely free, perfectly reliable, and conditionally verifiable — the agent always knows whether they received it. (I'm told problems only really show up with non-verifiable info, so I want a case that sidesteps that whole literature.)
  - Beliefs do not enter utility directly. No "the fun is in not knowing" moves, no anxiety costs from the test result itself.
  - The agent is a straightforward EU maximizer throughout.
  - The value of the information comes out strictly negative *in the formal sense*: the best the agent can do after receiving it, given the commitment they made before it arrived, is worse than the best they could have done had the info never been offered. Equivalently, if you like, they'd pay not to know.
  - And crucially the commitment can't be a dumb one — it has to be something they'd rationally choose ex ante, all things considered, if they knew the information might come their way.

  After the scenario, do the walkthrough: sketch the decision tree and expected utilities at a level a seminar audience can follow, and point at exactly which premise of Good's theorem the case violates (it has to violate one — that's the whole point, I just don't want it to be the belief-in-utility one). Then tell me what happens if you delete the commitment option, whether the construction generalizes beyond my hand-picked setting or if it only works because of some specific feature of the case, and give me the strongest reply from someone determined to rescue the "information is always weakly valuable" slogan. My advisor will absolutely say it's the surprise party again with extra steps unless I can say precisely why it isn't — or bite the bullet and concede it kind of is. Be honest about which one my case turns out to be.
