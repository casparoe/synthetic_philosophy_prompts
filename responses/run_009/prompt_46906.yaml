     The commitment (the contract) was rationally chosen ex ante because without it, they couldn't hire the candidate and would get 0, but with it, they get 50 - 10q, which for q<5 is positive and better than 0.

     Specifically, for q=0.5, expected profit=50-5=45>0.

     Now, if we delete the commitment option, meaning the firm can always wait for the test result before deciding on hiring, then they would only hire if the test is good. Then expected profit = q * [ p*200 + (1-p)*0 ] + (1-q) * [ they would have to decide without test: if p*200 - (1-p)*100>0, which is 50>0, so they hire and get 50 ]
            = q * 100 + (1-q)*50.

     This is always at least 50, and greater than 50 if q>0. So information is weakly valuable.

     The case violates which premise of Good's theorem? Good's theorem assumes that the decision maker can always choose to ignore the information and do what they would have done without it. But in this case, the commitment contract forces them to act on the information in a specific way (fire with severance) that is costly. So they cannot ignore the information.

     The theorem also assumes that the information is available for free and that the decision maker can condition on it freely. However, here the conditioning is constrained by the contract.

     The strongest reply from the defender of "information is always weakly valuable" might be: the information itself is not harmful; it's the contract that is harmful. If the firm could renegotiate the contract after the test result, they might avoid the severance cost in the bad state. For example, they might keep the bad candidate anyway and not fire, so they only lose 100. But the contract forces them to fire if the test is bad? We designed the contract that way. Why would they sign such a contract? Because the candidate requires it: the candidate wants protection against being fired arbitrarily. But then the firm has to weigh the costs.

     However, in the scenario, the firm is forced into the contract by the need to secure the candidate. Without the contract, they get nothing. With the contract and no test, they get 50. With the contract and test, they get 40. So they are better off with the contract even though it sometimes forces them to do something harmful when information arrives.

     Is this the surprise party? No, because there's no direct utility from beliefs. The harm comes from the physical cost of the severance payment.

     Therefore, it's not just the surprise party.

     Let's formalize the example.

     Parameters:
        p = 0.5 (probability candidate is good)
        X = 200 (profit from good candidate)
        Y = 100 (loss from bad candidate) [so without test and without firing, if bad, they get -100]
        S = 120 (severance payment)
        q: probability that the test becomes available after the contract is signed.

     Without any contract, the firm cannot hire the candidate -> profit=0.

     Contract option: a binding contract that says: if the test becomes available and the candidate is bad, the firm must fire the candidate and pay severance S. Otherwise, the candidate is hired and no severance is paid.

     Ex ante expected profit of the contract:
          If test available (prob q): 
               good (0.5): profit=200
               bad (0.5): profit=-120
               expected = 0.5*200 + 0.5*(-120) = 100 - 60 = 40
          If test not available (prob 1-q): 
               the candidate is hired and kept: expected profit = 0.5*200 + 0.5*(-100) = 100 - 50 = 50
          So overall: q*40 + (1-q)*50 = 50 - 10q

     Without the contract, profit=0.

     So for q<5, the contract is signed.

     Now, if the test is offered (available), then the firm's expected profit is 40, whereas if the test had not been offered, it would have been 50. So the test has reduced their profit by 10.

     Moreover, the firm would be willing to pay up to 10 to avoid the test when it is available, but only after they have signed the contract.

     However, ex ante before knowing if the test will be available, they are still happy to have signed the contract.

     This satisfies the condition that the information has strictly negative expected value in the context of the commitment.

     Therefore, we have our example.

     Walkthrough for a seminar audience:

     - Decision tree:

          Ex ante, the firm decides whether to sign the contract or not.

          If they don't sign, profit=0.

          If they do sign:
              Nature decides if the test is available (with prob q) or not (1-q).
              If test not available: then the candidate is hired and the firm gets either 200 (if good) or -100 (if bad), each with prob 0.5. Expected profit=50.
              If test available: then the test is taken.
                 If candidate is good (prob 0.5), firm gets 200.
                 If candidate is bad (prob 0.5), firm fires and pays severance, so gets -120.
                 Expected profit=40.

          So expected profit from signing: 50 - 10q.

     - The value of the information (test) in the context of the contract is negative: when the test is available, it lowers the expected profit from 50 to 40.

     - Good's theorem assumes that the decision maker can conditionally adopt any policy that was available without the information, and also can choose to ignore the information. Here, the contract forces a specific policy upon the firm that is not the same as the policy without information. Without information, the firm would keep the candidate and get -100 in the bad state. With information, they are forced to fire and pay -120. They cannot choose to ignore the information because the contract requires them to fire if the test shows bad.

     - If we delete the commitment option (i.e., the firm can always wait for the test result before hiring), then the firm would not need the contract. They could wait to see if the test becomes available. If it does, they test and only hire if good. If it doesn't, they might still hire (if p*X - (1-p)*Y>0) or not. In either case, they can avoid the severance cost. So the expected profit would be:
            q * [p*200] + (1-q) * [max(0, p*200 - (1-p)*100)] = q*100 + (1-q)*50   [since p*200-(1-p)*100=50>0]
          = 50 + 50q, which is at least 50 and increasing in q.

     - The construction relies on the commitment (the contract) being necessary to secure the candidate and on the contract containing a costly action upon receiving bad news. It should generalize to any setting where a binding contract requires a costly response to information.

     - The strongest reply: The firm could have designed a better contract. For example, a contract that does not require firing upon a bad test result, but rather allows the firm to keep the candidate. Then in the bad state, they would only lose 100. But then why would the candidate sign? The candidate might insist on job security. However, if the firm can renegotiate the contract after the test result, they might avoid the severance cost. But renegotiation might be costly or impossible. The defender might say: the example relies on the contract being poorly designed. But in the scenario, the candidate might only accept a contract with strong job security, including severance if fired for cause (which includes being found unqualified by a test). So the firm is forced to accept these terms.

     Conclusion: This is not the surprise party phenomenon. It's a case where the information has negative value because it triggers a costly contractual obligation.

     Therefore, we have our example.
answer: |-
  ### Thought Experiment: The Severance Commitment in Hiring

  **Setting:** A firm must decide whether to hire a candidate for a critical position. The candidate is either qualified (with probability \(p\)) or unqualified (probability \(1-p\)). Hiring yields:
  - Profit \(X\) if qualified.
  - Loss \(-Y\) if unqualified (e.g., due to project failure).

  If not hired, profit is \(0\). The firm is risk-neutral and maximizes expected profit. Before hiring, the firm can sign a **binding contract** committing to severance pay \(S\) if the candidate is fired after a negative test result. The candidate demands this contract for job security; without it, they refuse employment. After signing, a free, perfectly reliable, and verifiable test (available with probability \(q\)) reveals the candidate's quality. The contract forces the firm to fire an unqualified candidate and pay \(S\) if the test is taken and shows "unqualified." If the test is unavailable, the candidate is hired unconditionally.

  **Parameters (concrete example):**
  - \(X = 200\) (profit from qualified candidate)
  - \(Y = 100\) (loss from unqualified candidate)
  - \(S = 120\) (severance pay)
  - \(p = 0.5\) (probability qualified)
  - \(q\) (probability test is available; e.g., \(q = 1\) for simplicity)

  ---

  ### Decision Tree and Expected Utilities
  **1. Ex-Ante Choices (before knowing test availability):**  
  The firm chooses whether to sign the contract or forgo hiring.

  - **Option A: Forgo hiring**  
    Profit = \(0\).

  - **Option B: Sign contract**  
    - **If test available (prob \(q\)):**  
      - Test shows qualified (prob \(p\)): Hire, profit = \(X = 200\).  
      - Test shows unqualified (prob \(1-p\)): Fire and pay \(S\), profit = \(-S = -120\).  
      *Expected profit (if test available):*  
      \[
      pX + (1-p)(-S) = (0.5)(200) + (0.5)(-120) = 100 - 60 = 40.
      \]
    - **If test unavailable (prob \(1-q\)):**  
      Hire unconditionally:  
      *Expected profit:*  
      \[
      pX + (1-p)(-Y) = (0.5)(200) + (0.5)(-100) = 100 - 50 = 50.
      \]  
    *Overall expected profit (for any \(q\)):*  
    \[
    q \cdot 40 + (1-q) \cdot 50 = 50 - 10q.
    \]

  **2. Rational Ex-Ante Choice:**  
  - Signing yields \(50 - 10q\), forgoing yields \(0\).  
  - For \(q < 5\) (always true), signing is optimal. If \(q = 1\), expected profit = \(40 > 0\).  
  *The firm signs the contract.*

  **3. Ex-Post Outcome (after test availability known):**  
  - **If test available:**  
    Expected profit = \(40\) (as above).  
  - **If test unavailable:**  
    Expected profit = \(50\).  

  **4. Negative Value of Information:**  
  - If test is available, the firm’s expected profit is \(40\).  
  - If test were **never offered**, the firm would hire unconditionally (as per contract) and earn \(50\).  
  *The test reduces expected profit by \(10\) when available.* The firm would pay up to \(10\) to avoid the test, as it triggers a costly action (firing with severance) that worsens outcomes.

  ---

  ### Why This Violates Good’s Theorem
  Good’s theorem states that for a Bayesian agent, information has non-negative expected value. It assumes:
  1. The agent can **freely choose actions** after seeing the information (or ignore it).  
  2. Information is free and reliable.  

  **Violation:** The binding contract **restricts post-information actions**. The firm cannot ignore the test result; it *must* fire an unqualified candidate and pay \(S\). Without the contract, the firm could act optimally on the information (e.g., avoid hiring if unqualified). But the commitment, rationally chosen ex ante, forces a suboptimal response ex post.

  ---

  ### What If Commitment Is Deleted?
  Without commitment:
  - The firm waits for the test result if available.  
  - Hire only if qualified (profit \(X = 200\)) or if no test and expected profit \(>0\).  
  - Expected profit:  
    \[
    q \cdot (pX) + (1-q) \cdot \max\{0, pX - (1-p)Y\} = q(100) + (1-q)(50) = 50 + 50q \geq 50.
    \]  
  Information is weakly valuable: profit ranges from \(50\) (no test) to \(100\) (test available), never worse than no information.

  ---

  ### Generalizability
  - **Core Mechanism:** Information triggers costly contractual obligations.  
  - **Applies Broadly:**  
    - **Insurance:** Commitment to a premium that becomes unfair if a test reveals low risk.  
    - **Warranties:** Commitment to repair if a test reveals defects, where repair costs exceed benefits.  
    - **Medical Diagnostics:** Commitment to treatment if a test is positive, but treatment side effects outweigh benefits for a subgroup.  
  - **Key Feature:** Binding commitments that impose costs when information reveals "bad" states, overriding the agent’s preferred action.

  ---

  ### Strongest Rebuttal and Defense
  **Rebuttal (from "information always valuable" defenders):**  
  *"The negative value arises from poor contract design, not information itself. A rational agent would negotiate a contract allowing them to ignore the test (e.g., no severance clause)."*

  **Your Counter:**  
  - The candidate demands severance as a condition for employment. Without it, no hiring occurs.  
  - The firm rationally accepts this to secure the *chance* of profit, knowing the test *might* trigger costs.  
  - **Not the surprise party:** No direct utility from beliefs (e.g., anxiety/anticipation). The loss stems from a physical cost (severance payment), not belief-dependent utility.  

  **Honest Assessment:**  
  This is **not** "surprise party with extra steps." The surprise party relies on beliefs directly affecting utility (e.g., "knowing ruins the fun"). Here, utility depends solely on monetary outcomes, and the loss arises from constrained actions due to a rational ex-ante commitment. It violates a core premise of Good’s theorem (free action choice), not the belief-utility premise. **Bite the bullet?** No—this case cleanly isolates contractual commitments as the culprit.
