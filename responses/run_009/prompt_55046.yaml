  ### Justice in Action: The Ambush Game  
  **Objective:** Make students viscerally experience how "equality" fractures under different metrics (resources, welfare, capabilities) and how solving one injustice creates another.  

  ---

  #### **Setup (10 min)**  
  1. **Assign Roles & Distribute Materials (5 min):**  
     - Each student draws a **Secret Condition Card** (see examples below) and receives **10 "Justice Points" (JPs)** (paper chits).  
     - **Goods Shop** posted on board (prices are *base costs*):  
       - Mobility: 1 JP  
       - Pleasant Afternoon: 1 JP  
       - Achievement: 2 JP  
       - Good Health: 3 JP  
       - Social Respect: 2 JP  
     - **Condition Cards (18 unique):**  
       - *Disability (4 players):* Mobility costs 3x base. *(e.g., Mobility = 3 JP)*  
       - *Expensive Tastes (4 players):* Pleasant Afternoon costs 3x base. *(e.g., Pleasant Afternoon = 3 JP)*  
       - *Contented (4 players):* All goods grant 2x Satisfaction Points (SP) *but* you start with 5 SP (pre-loaded "happiness").  
       - *Socially Marginalized (3 players):* Social Respect costs 3x base.  
       - *Prodigy (3 players):* Achievement costs 0.5x base. *(e.g., Achievement = 1 JP)*  

  2. **Rules Brief (5 min):**  
     - "Buy goods to maximize your **Satisfaction Points (SP)**. 1 good = 1 SP, *except* Contented (1 good = 2 SP).  
     - **Secret conditions** affect your costs. **Do not reveal your card.**  
     - Two redistribution votes will happen. Vote outcomes *will* change your JPs.  
     - Goal: "Win" by maximizing SP, but *how* we redistribute will change what "winning" means."  

  ---

  #### **Gameplay (45 min)**  
  **Round 1: Initial Market (10 min)**  
  - Students spend 10 JPs at the Shop (record purchases privately).  
  - *Facilitator:* Walk around, answer rule questions.  
  - **Calculate SP:**  
    - Non-Contented: SP = # of goods bought.  
    - Contented: SP = (2 × # of goods) + 5 (starting bonus).  

  **Redistribution Vote 1 (10 min)**  
  - Vote options (write on board):  
    - **Option A:** Equal Resources (all get 10 JPs).  
    - **Option B:** Equal Welfare (redistribute JPs so everyone ends with *same SP*).  
    - **Option C:** Equal Capabilities (all get enough JPs to buy "basic goods": Mobility + Good Health).  
  - **Vote & Implement:**  
    - Tally vote → apply redistribution:  
      - *Option A:* All reset to 10 JPs.  
      - *Option B:* Facilitator adjusts JPs to equalize SP (e.g., take JP from high-SP players, give to low-SP).  
      - *Option C:* Disability/Socially Marginalized get 6 JP (covers Mobility+Health at their cost), others get 4 JP (covers base cost).  
    - *No pre-lecture!* Students must infer what metrics mean.  

  **Round 2: After Redistribution (10 min)**  
  - Shop again with new JPs.  
  - Recalculate SP.  

  **Redistribution Vote 2 (10 min)**  
  - Same options, but students can propose *new principles* (e.g., "Extra JP to unlucky players").  
  - Vote → apply again.  

  **Round 3: Final Round (5 min)**  
  - Shop one last time → calculate final SP.  

  ---

  #### **Debrief (25 min)**  
  1. **Reveal Condition Cards** (5 min): Students share their card, costs, and SP trajectory.  
  2. **Map Game to Theory** (15 min):  
     | **Game Moment**           | **Theory**                          | **Problem Surfaced**                  |  
     |---------------------------|-------------------------------------|---------------------------------------|  
     | Round 1 (equal JPs)       | Equality of Resources (Dworkin)     | Disability/expensive tastes can’t buy basics |  
     | Vote 1 (Equal Welfare)    | Equality of Welfare (Bentham/Sen)   | Leveling down: Contented lose JPs but stay happy; others gain little |  
     | Vote 1 (Equal Capabilities)| Capabilities Approach (Sen/Nussbaum)| Fixes disability but ignores preferences |  
     | Vote 2 (Student proposals)| Libertarianism/Desert Theories      | Who "deserves" compensation? |  
  3. **Discuss Tensions** (5 min):  
     - "When we fixed disability unfairness, Contented players became poor but still happy. Is that just?"  
     - "Expensive Tastes players had high costs *and* were penalized by welfare equality. Should we compensate them?"  

  ---

  #### **What the Game Can’t Replicate**  
  1. **Interpersonal Utility Comparisons:** SP is arbitrary/quantifiable; real welfare is ineffable.  
  2. **Responsibility for Preferences:** Conditions are randomly assigned. IRL, should we compensate cultivated expensive tastes?  
  3. **Structural Injustice:** Cards focus on individual luck, not systemic bias (e.g., racism).  

  ---

  #### **Predictable Problems & Fixes**  
  - **Problem:** Expensive Tastes player jokes, "I’m bougie! Charge me more champagne!" → derails seriousness.  
    - **Fix:** Pre-empt: "Conditions are *coercive disadvantages*. Role-play seriously."  
  - **Problem:** 2-3 students hoard JPs or buy only Achievement to "win" SP.  
    - **Let them!** Then debrief: "Why did you optimize SP? What does that say about welfare metrics?"  
  - **Problem:** Vote ties or deadlock.  
    - **Fix:** Flip a coin → discuss how real voting is messy.  
  - **Problem:** Time crunch.  
    - **Fix:** Use pre-printed tables for redistribution math.  

  ---

  #### **Materials & Incentives**  
  - **Materials:** Condition cards, JP chits, Shop poster, SP record sheets.  
  - **Incentive:** Chocolate for all + "Theorist’s Prize" (extra chocolate for 3 highest SP) to spark competition.  

  ---

  #### **Minute-by-Minute Breakdown**  
  | Segment           | Time (min) | Notes                                  |  
  |-------------------|------------|----------------------------------------|  
  | Setup             | 10         | Distribute cards, JPs, explain rules.  |  
  | Round 1 Shopping  | 10         | Monitor for confusion.                 |  
  | Vote 1            | 10         | Force a vote at 7 min.                 |  
  | Round 2 Shopping  | 10         |                                        |  
  | Vote 2            | 10         | Allow new proposals.                   |  
  | Round 3 Shopping  | 5          |                                        |  
  | Debrief           | 25         | Focus on emotional "ambush" moments.   |  
  | **Total**         | **80**     |                                        |  

  ---

  **Why This Works:**  
  - **Ambush Achieved:** Students *feel* the disability struggle (can’t afford mobility), the unfairness of leveling down (Contented punished for being happy), and the chaos of interpersonal comparisons.  
  - **Theory Comes Alive:** The debrief explicitly ties game moments to Dworkin, Sen, and Nussbaum.  
  - **Constraints Honored:** No lecturing, no real money, and the game surfaces all target problems experientially.  

  **Run it, then watch them question everything they "knew" about justice.** 🍫✨
