prompt: |-
  I'm an undergraduate taking a philosophy of art seminar this term, where we've been reading on the aesthetic testimony problem — whether one can legitimately form beliefs about the aesthetic value of a work on the basis of other people's say-so, or whether genuine aesthetic judgment requires first-hand acquaintance with the work. I also have a practical stake in this: I serve on the jury for our university's annual student art prize, and the pragmatics of the job keep forcing the question on me.

  Here is the setup. We receive roughly 180 submissions across painting, sculpture, photography, video, sound, installation, and performance. Each of the five jurors is expected to review everything, but the review window is two and a half weeks, most of us are in classes all day, and the final rankings must be signed off by the jury chair, a studio-art lecturer who is explicitly worried that we defer too much to one another and to faculty endorsements. Some works can only be judged on site — a sound installation you have to sit inside, a scent piece, a durational performance scheduled at specific hours — and for some of those, video documentation is all that will ever be available to most jurors. We also have, for each submission, a faculty sponsor's letter, and a small number of pieces come with reputations attached (last year's runner-up's new series, a piece already picked up by a student-run gallery).

  What I would like from you is a decision procedure the jury can actually run, not an essay on the philosophy. It should tell us, in order: when testimony about a work is admissible as a filter for our attention, when it is admissible as evidence toward our verdict, and when it must be quarantined entirely — along with what counts as a sufficient basis for each ruling. It should incorporate what the philosophical literature actually establishes (the acquaintance principle, Hume's appeal to qualified judges, the distinction between deferring about a verdict and deferring about where to look, and the point that testimony may justify a belief without transmitting knowledge), but translated into language a juror can apply in a few minutes per submission. It should be honest about which steps are genuinely settled by the theory and which are judgment calls dressed up as procedure, and it should mark the points where the procedure must hand the decision back to a juror as a matter of values.

  Then run it on three cases. First, a painting that arrives with a letter from a well-regarded professor calling it the strongest student work she has seen in a decade. Second, a six-hour durational performance for which only a nine-minute edited video and a written description by the performer's classmates exist, and which cannot be restaged before our deadline. Third, a photograph by a student whose work took second prize last year, submitted this year with no supporting materials and no reviews yet. I want to see at least one case where the procedure yields an answer I or the chair will dislike, and I want the procedure's limits stated plainly — what it cannot do for us, and where following it scrupulously would still leave us open to the charge that our prizes were awarded on the strength of reputation rather than anyone's genuine acquaintance with the work.
reasoning: |-
  Okay, let me unpack this user's request. They're an undergrad philosophy of art student grappling with the aesthetic testimony problem in a practical jury setting. The core tension is between philosophical ideals (direct aesthetic experience) and operational realities (time constraints, mediated artworks). 

  Hmm... they need a decision procedure, not theory. That means translating concepts like Hume's "qualified judges" and the acquaintance principle into actionable steps. The three test cases are cleverly chosen to stress different pressure points: external endorsement (professor's letter), inaccessible work (durational performance), and reputation bias (past winner).

  The user's unspoken frustrations peek through - the jury chair's skepticism about deference, the physical impossibility of experiencing 180 works firsthand. They're likely feeling caught between academic purity and pragmatic necessity. Also notable: they want the procedure to explicitly flag its own limitations, showing intellectual honesty.

  For the procedure itself, I'm considering a tiered approach separating attention allocation from evidentiary weight. Key philosophical touchstones need operational definitions:
  - "Qualified judges" becomes "faculty sponsors with demonstrated expertise"
  - "Acquaintance principle" morphs into accessibility categories
  - Testimony's epistemic status gets split: permissible for triage, restricted for evaluation

  The three cases will test different failure modes. That painting with glowing endorsement? Procedure should allow using the letter to prioritize viewing but prohibit it from swaying judgment - which might annoy jurors who trust the professor. The performance piece forces confrontation with documentation as proxy experience. The photographer's case is trickiest - past success can't count evidentially, but human jurors will struggle to ignore it.

  Biggest tension point: the procedure can enforce methodological rigor but can't eliminate reputation's subconscious influence. I should emphasize that in limitations - like noting jurors might still give past winners benefit of the doubt during close calls. Also worth flagging that for truly time-based works, any judgment is inherently provisional.

  ...Better include an "accountability log" idea too. Making jurors document their evidence sources creates friction against over-reliance on testimony. The chair will appreciate that transparency.
answer: |-
  Here's a practical decision procedure for your jury, grounded in core philosophical insights but designed for operational use. It acknowledges the tension between epistemic ideals and practical constraints, explicitly marks judgment calls, and forces transparency about evidence sources.

  **Core Principles Embedded:**
  1.  **Acquaintance Principle (AP):** Direct experience is *essential* for final aesthetic judgment; testimony cannot *substitute* for it.
  2.  **Hume's Qualified Judges (HQJ):** Testimony from sources demonstrably qualified *can* legitimately guide attention and be considered as *evidence*, but not as a verdict replacement.
  3.  **Deference Types:** Distinguishes *deferring attention* (philosophically acceptable) from *deferring judgment* (problematic under AP).
  4.  **Justification vs. Knowledge Transmission:** Testimony can *justify* a belief formed later via acquaintance ("That expert said it was complex; now that I see it, I understand why") but doesn't *transmit* aesthetic knowledge itself ("It's beautiful because they said so").
  5.  **The Ineliminable Role of Judgment:** Some steps require juror values; the procedure flags these.

  **The Jury Decision Procedure:**

  **PHASE 1: FILTERING ATTENTION & PRIORITIZATION (What *Must* I See/Experience Directly?)**

  1.  **Accessibility Check:** Can the work be directly experienced by the juror within the constraints?
      *   **Yes (Accessible):** Proceed to direct review. *Testimony is INADMISSIBLE here for filtering attention away.* You *must* engage.
      *   **No (Inaccessible):** Proceed to Step 2. *(Judgment Call: Define "Accessible." Does video *suffice* for video art? Probably yes. For a scent piece? Probably no. The chair must rule on media-specific adequacy upfront.)*
  2.  **Inaccessible Works: Testimony as Triage Tool:** For inaccessible works, use available documentation (video, descriptions) *and* testimony (faculty letters, reputations) **ONLY** to decide:
      *   **A.** Does this work seem *prima facie* significant/competent enough based on documentation + testimony to warrant *attempting* a direct experience (e.g., scheduling time for the performance, visiting the installation)? If **Yes**, prioritize scheduling/visiting. *(Philosophically Settled: HQJ justifies using testimony to direct attention to potentially worthy but hard-to-access works.)*
      *   **B.** If direct experience remains impossible, does the combination of documentation + testimony suggest the work is likely non-competitive? *(Judgment Call: Requires defining a threshold of "non-competitive." Values involved: Risk of missing a worthy work vs. efficient resource allocation. The chair should set a high bar for exclusion here.)*
          *   If **Yes (Likely Non-Competitive)**, the juror may note this for final deliberation but *cannot* assign a ranking score without direct experience. It remains "Unranked - Insufficient Access."
          *   If **No (Cannot be Dismissed)**, the juror *must* engage as deeply as possible with the documentation and note its limitations. Proceed to Phase 2 with a strong caveat.

  **PHASE 2: FORMING JUDGMENT & EVIDENCE WEIGHTING (How do I evaluate what I've experienced?)**

  3.  **Direct Experience Mandate:** For any work receiving a ranking score, the juror **must** have had a direct, attentive experience meeting the chair's defined minimum adequacy for the medium. *(Philosophically Settled: AP violation if skipped.)*
  4.  **Evidence Admissibility During Evaluation:**
      *   **Direct Experience:** Primary and essential evidence. Forms the core of the judgment.
      *   **Documentation (for context only):** Admissible *only* to understand the artist's stated intent, technical process, or context *after* initial direct experience. Cannot override the juror's perceptual experience. *(Philosophically Settled: Documentation is secondary to the perceptual encounter.)*
      *   **Testimony (Faculty Letters, Reputation, Peer Descriptions):**
          *   **INADMISSIBLE AS PRIMARY EVIDENCE:** Cannot be the basis for the judgment ("Prof. X says it's great, so it must be"). *(Philosophically Settled: Violates AP.)*
          *   **ADMISSIBLE AS CORROBORATIVE/INTERPRETIVE EVIDENCE:** *After* forming an initial judgment based on direct experience, testimony can be considered to:
              *   Check for potential oversights ("The letter mentions subtle layering in the shadows; did I miss that?" - prompting re-inspection).
              *   Understand technical ambition or context that might influence the *significance* of what was experienced ("The letter explains this used a novel technique, which adds to its achievement").
              *   Resolve ambiguities in interpretation ("The description clarifies the performance's intended thematic focus").
          *(Philosophically Settled: HQJ justifies this limited role; testimony justifies belief *about* features potentially confirmable by acquaintance, not the aesthetic verdict itself.)*
      *   **Reputation:** Treated strictly as a form of testimony (often from an amorphous source). Subject to the same limitations: **inadmissible** for primary judgment, potentially **admissible** for prompting closer attention (Phase 1) or interpretive context (Phase 2, Step 4b), but highly suspect due to source vagueness. *(Judgment Call: How much weight to give vague reputation? Values involved: Fairness vs. acknowledging consistent quality. The procedure demands extreme caution and transparency here.)*
  5.  **The Deliberation Caveat:** During jury discussion, jurors *must* articulate the basis of their judgment ("Based on seeing the painting, I felt...") and can cite testimony *only* as per Step 4b ("The faculty letter helped me notice X upon second look"). Discussions leaning heavily on testimony should be challenged by the chair.

  **PHASE 3: ACCOUNTABILITY & TRANSPARENCY**

  6.  **Evidence Log (Per Juror, Per Work):** Jurors must record for *each* work:
      *   **Accessibility:** Direct (Full/Partial), Documentation Only, Documentation + Testimony Only.
      *   **Basis for Score:** "Direct Experience Only" / "Direct Experience + Corroborative Testimony Cited: [Source, e.g., Faculty Letter]" / "Unranked - Insufficient Access".
      *   **Ranking Score:** Based solely on categories above.
  7.  **Chair Review:** The chair reviews logs before finalizing rankings. Scores primarily based on testimony (beyond limited corroboration), or ranking inaccessible works highly based *only* on testimony, should be flagged and require justification. The chair has final authority to adjust based on adherence to procedure.

  **Running the Cases:**

  **Case 1: Painting with Glowing Faculty Letter**
  *   **Phase 1:** Accessible (painting). **Must** be viewed directly. Letter *cannot* be used to skip viewing.
  *   **Phase 2:** Juror views painting, forms initial impression. *Then* can read letter.
      *   **Admissible:** Letter might prompt: "The professor praised the color harmony; let me look more closely at that specific aspect." Or: "She mentions it references artist Y; knowing that context adds another layer." It *cannot* be: "She says it's the best in a decade, so I'll score it high."
  *   **Verdict:** Verdict must be based on direct experience. The letter can influence *how* the juror looks (attention within the work) or interpretive context, but not the core judgment of aesthetic value. **Answer You/Chair Might Dislike:** A juror might still be unduly swayed subconsciously, but the procedure forces them to articulate the experiential basis and minimizes overt deference. The log shows if testimony was cited.

  **Case 2: Six-Hour Performance (9-min video + classmate description)**
  *   **Phase 1:** Inaccessible (within time/resource constraints). Video + description are documentation/testimony.
      *   **Step 2A:** Use video + description to assess if *prima facie* significant/competent enough to warrant *trying* to see it live. Jury must decide collectively: Is it worth scheduling? (Likely yes for a past contender, but depends on schedule clash).
      *   **Outcome A (Seen Live):** Proceed like Case 1. Testimony (description) only admissible post-experience for context/corroboration.
      *   **Outcome B (Not Seen Live):**
          *   **Step 2B:** Can video + description suggest it's *likely non-competitive*? High bar. The documentation is poor (9 mins of 6 hours), but reputation/description might suggest ambition. **Probably No** (Cannot be Dismissed).
          *   **Phase 2:** Juror must engage deeply with the *video documentation*. **Strong Caveat:** Judgment is based on a *fragment*. Description (testimony) admissible *only* to understand intent/context *after* viewing the video. E.g., "The description says the full piece involves gradual exhaustion; this helps interpret the intensity I see in this excerpt." **Cannot** judge the aesthetic value of the *full durational piece* based on testimony about it.
      *   **Verdict:** **If seen live:** Judgment possible. **If not seen live:** Ranking must be based *only* on the video documentation, with a clear note of its severe limitations. Testimony provides context, not a substitute verdict. Score likely suffers due to inadequate access. **Chair's Concern Valid:** This highlights the procedure's limit – the jury might be forced to judge a work poorly based on bad documentation, or potentially overlook a great work if Step 2B is misapplied.

  **Case 3: Photograph by Last Year's Runner-Up (No materials, no reviews)**
  *   **Phase 1:** Accessible (photograph). **Must** be viewed directly. Reputation exists but is vague ("last year's runner-up").
  *   **Phase 2:** Juror views photograph, forms initial impression.
      *   **Reputation (Testimony):** **INADMISSIBLE** as primary evidence. Cannot think "They were good last year, so this is probably good too." *After* forming a judgment, reputation is **barely admissible** even as context – it's vague and not about *this specific work*. Its only legitimate use is *extremely limited*: "Knowing they've produced strong work before, does this photograph seem like a significant departure or potential decline warranting closer scrutiny?" Not to elevate the score.
  *   **Verdict:** Judgment **must** be based solely on the direct experience of *this specific photograph*. Reputation should play almost no role. **Answer You/Chair Might Dislike:** A juror might subconsciously give the benefit of the doubt based on past success, but the procedure forces them to articulate experiential reasons for their score. The log shows no testimony cited (as there is none besides reputation, which is minimized).

  **Procedure's Limits Stated Plainly:**

  1.  **Cannot Guarantee Pure Acquaintance:** Time/resource constraints *force* reliance on documentation and testimony for triage (Phase 1) and sometimes context (Phase 2). For inaccessible works, judgment is compromised.
  2.  **Cannot Eliminate Subconscious Bias:** Reputation and testimony, even when procedurally quarantined from *overt* decision-making, can subtly influence perception during direct experience or the weight given to certain features. The log increases accountability but isn't a mind-reader.
  3.  **Cannot Resolve Value Conflicts:** Defining "qualified judge," "sufficient documentation," "prima facie significance," and "non-competitive" are inherently value-laden judgment calls the procedure requires but doesn't solve. The chair must rule.
  4.  **Cannot Create Knowledge from Testimony Alone:** For inaccessible works judged on poor documentation, the resulting ranking is epistemically weak – justified perhaps by necessity, but not knowledge of the work's aesthetic value in the strong sense demanded by AP.
  5.  **Open to Reputation Charges:** Scrupulous following minimizes overt reputation-based decisions. However:
      *   Reputation inevitably influences Phase 1 triage (attention).
      *   Reputation can subtly influence Phase 2 perception despite rules.
      *   Works by "unknowns" dismissed in Phase 1 Step 2B might have been gems – a risk inherent in filtering. Critics can *always* argue reputation played a role if known artists win, especially if their works were harder to access but prioritized. The procedure's strength is *transparency*: the logs show *why* decisions were made and force reliance on direct experience where possible, providing a defense against charges of *blatant* deference.

  This procedure operationalizes the philosophy into actionable steps, forces transparency about evidence, minimizes deference to testimony for *verdicts*, and explicitly marks where judgment and values take over. It navigates the practical mess while respecting the core insight that seeing (hearing, experiencing) is believing, aesthetically speaking.
