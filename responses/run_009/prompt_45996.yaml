prompt: |-
  I'm a journalist who covers science and ideas, and I've spent the last year reporting a long-form series on how the word "genocide" travels from Lemkin's original conception -- which explicitly included not just killing but the deliberate dismantling of a group's language, institutions, and way of life -- through the 1948 Convention's narrower legal definition, and out into ordinary argument. Somewhere along the way I accumulated gut verdicts on cases, and now I want to know whether they add up to anything. The Herero and Nama extermination campaign: genocide, clearly. The Holodomor, where the famine that killed millions of Ukrainians was engineered or at least weaponized by Soviet policy: my gut says yes, genocide, even though I know the intent question is contested and the group was targeted in part as a class of "kulaks." Boarding schools that took Indigenous children from their families to erase their languages, with deaths but not mass killing as the mechanism: my gut says this is genuinely genocidal, and I notice I'm relying on Lemkin's broader notion of cultural destruction rather than the Convention's. The Atlantic slave trade and the Middle Passage: the scale of death was foreseen and tolerated as a cost of profit, but the point was exploitation, not destruction of the group as such -- and my gut says not genocide, which disturbs me, because the death toll dwarfs cases I do call genocide. The expulsions and massacres of partition-era Punjab in 1947: not genocide in my gut, though the aim was, in a real sense, to remove a group from a territory, and I can't articulate what separates "removal" from "destruction." Pol Pot's killing of anyone with glasses or an education: morally the equal of any genocide I'd name, but the groups were defined by class and politics, which the Convention excludes, and my gut follows the exclusion while resenting it. And a case I keep chewing on: a rising sea slowly erasing an island people whose state is not the perpetrator of anything -- my gut says that's a catastrophe but not a genocide, yet I can't say why intent matters so much when the outcome is a group's disappearance.

  What I want from you is a principle, or a small set of candidates, that captures as many of these verdicts as possible: state it precisely enough that it could be applied to a new case by someone who shares your framework, tell me which clauses are doing the work for which verdict, and then be honest about which of my verdicts it cannot save -- I would genuinely rather revise a gut verdict than smuggle in ad hoc clauses, but you should take a definite position on which way to go rather than leaving the choice to me. I'd also like your prediction for a case I haven't listed: a counterinsurgency campaign that doesn't aim at a group's destruction but foreseeably destroys its economic base and thereby its ability to persist as a distinct people. Don't lay out the options and wave at the tradeoffs; commit. Please close with a single machine-readable line of the form \answer{...} containing, in a short phrase, the core of your principle together with the verdict you think I must give up (for example, something like "destruction-in-any-sphere, drop the slave trade carve-out" -- but use your own wording).
reasoning: |-
  Hmm, the user is a journalist who has spent a year researching the evolution of the term "genocide" from Lemkin's broader conception to the narrower legal definition in the 1948 Convention. They've accumulated gut verdicts on several historical cases and want me to develop a principle that captures most of these verdicts while forcing them to revise one. They specifically want me to commit to a clear position rather than presenting options.

  Looking at their gut verdicts:
  - Herero/Nama: genocide (clear)
  - Holodomor: genocide (despite contested intent)
  - Indigenous boarding schools: genocide (using Lemkin's cultural destruction)
  - Atlantic slave trade: not genocide (though disturbing due to death toll)
  - Partition-era Punjab: not genocide (cannot articulate why removal ≠ destruction)
  - Pol Pot: not genocide (due to class exclusion in Convention)
  - Sea-level disappearance: not genocide (lacks perpetrator intent)

  The key tensions here are:
  - Lemkin's cultural destruction vs. Convention's physical destruction
  - Intent requirement (especially for Holodomor/slave trade)
  - Group definition (class/politics exclusion for Pol Pot case)
  - Perpetrator requirement (for climate disappearance)

  The slave trade verdict seems particularly dissonant - they feel it should be genocide but can't square it with the exploitation motive. This might be the one to revise. 

  For the boarding schools case, Lemkin's cultural destruction framework clearly applies even without mass killing. The partition case highlights how territorial removal differs from group destruction - though I'd argue that distinction needs clearer articulation.

  The rising sea case reveals the non-negotiable role of perpetrator intent in genocide designation. Climate impacts, however catastrophic, lack this agency.

  My proposed principle: "Systematic destruction of group integrity through targeted dismantling of constitutive elements (biological, social, cultural), regardless of method or speed, when perpetrator intends to destroy the group as such."

  This would:
  - Cover boarding schools via cultural dismantling (Lemkin)
  - Exclude slave trade (no group destruction intent) ← the revision point
  - Exclude climate disappearance (no perpetrator)
  - Exclude Pol Pot (class not protected group) - though I disagree with this exclusion
  - Cover Holodomor via intent to dismantle peasant class as group proxy

  For the counterinsurgency case: If economic destruction foreseeably eliminates group integrity and the state knows this, it edges toward genocide - but only if group destruction is the purpose rather than collateral damage. The principle requires active dismantling intent.

  Final answer must specify both the core principle and which gut verdict to change. The slave trade is the logical revision point - that massive demographic destruction with foreseeable death should qualify regardless of profit motive.
answer: |-
  After analyzing your gut verdicts and the conceptual tensions, I propose this principle:  

  **"Genocide requires a perpetrator's systematic effort to destroy a group *as such* by dismantling its core constitutive capacities (biological, social, or cultural), where the intent to destroy the group is the driver of policy, not a side effect of other goals."**  

  ### How It Captures Your Verdicts:  
  1. **Herero/Nama**: Covered by "systematic effort," "destroy the group," and "biological/social dismantling" (explicit extermination orders).  
  2. **Holodomor**: Captured by "intent to destroy the group as a driver" (Stalin targeted Ukrainians *as a national group* under kulak pretexts; famine was weaponized against their collective existence).  
  3. **Indigenous Boarding Schools**: Covered by "dismantling cultural capacities" (language/institutions) + "intent to destroy the group as such" (assimilation = destruction of distinct identity).  
  4. **Atlantic Slave Trade**: *Not covered*—death was a tolerated cost of economic exploitation, not a driver of policy aimed at group destruction. **This is the verdict you must revise.**  
  5. **1947 Punjab**: Not covered—violence aimed at territorial partition/expulsion, not systemic dismantling of group capacities *beyond* the territory. "Removal" ≠ "destruction" when group persists elsewhere.  
  6. **Pol Pot**: Not covered—targeting class/politics (excluded by "group *as such*"). Gut follows the exclusion correctly.  
  7. **Sea-Level Disappearance**: Not covered—lacks a *perpetrator* and intentional dismantling. Outcome ≠ genocide without agency.  

  ### The Counterinsurgency Case:  
  A campaign destroying a group's economic base foreseeably erasing them *would be genocide* **only if** the state intentionally uses economic dismantling *as a means to destroy the group*. If economic ruin is collateral damage (e.g., scorched-earth tactics against rebels), it fails the "intent as driver" clause. If the state *aims* to collapse the group’s distinctiveness (e.g., destroying cultural economies like nomadic herding), it qualifies.  

  ### Why Revise the Slave Trade Verdict?  
  Your discomfort stems from conflating *scale of harm* with *genocidal logic*. The slave trade’s goal was commodification, not annihilation of Africans *as a group*. Enslavers relied on reproduction; destruction was instrumental, not intentional. This distinguishes it from the Herero (explicit extermination) or boarding schools (intentional cultural dismantling). To call it genocide dilutes the specific evil of *intentional group destruction*.  

  **Non-Negotiable Elements**:  
  - **"Perpetrator"**: Rules out environmental cases.  
  - **"Intent as driver"**: Excludes slave trade/partition.  
  - **"Dismantling constitutive capacities"**: Expands beyond killing to include boarding schools.  
  - **"Group as such"**: Excludes class-based targeting (Pol Pot).  

  \answer{perpetrator-intent-driven-dismantling, revise slave trade}
