  I'm a vision-science PhD student who keeps getting nowhere in an argument with a philosopher friend about Molyneux's question, so let me pin down a precise version of it and ask for your number: if a congenitally blind adult, competent at distinguishing cubes from spheres by touch, were made to see, could they sort the two by sight alone, before any experience correlating vision with touch? Give me your credence in a positive answer, understood synchronically — no learning period, just above-chance immediate discrimination — and decompose it: the probability that cross-modal spatial representations exist prior to visual experience; the probability that the clinical evidence from newly-sighted patients is actually probative, given that such patients are few, that restored vision is often degraded in ways congenitally intact observers' isn't, and that long-term blindness plausibly affects the visual system itself; the probability that the question stays well-posed once we distinguish mere discrimination from genuine identification, and that this distinction isn't doing all the work; and any other terms you think belong, each with a rough number and a line of justification. Then combine them, tell me which term the final credence is most sensitive to, and what — a specific experiment, a patient population, a conceptual repair — would move that term the most.
