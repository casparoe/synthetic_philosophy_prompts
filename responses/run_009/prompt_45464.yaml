prompt: |-
  Quick question for something I'm writing for my intro ethics course on voting. At a workshop last month a colleague defended what I've started calling the cheerleader view: since a single vote almost never decides anything, the act of voting is basically expressive, like cheering at a football game -- you do it to show who you're for, and the showing is the whole point. He leaned on this to argue two things. First, that there's no duty to vote, since nobody thinks you're obligated to cheer. Second, that you should vote your heart rather than strategically: if it's all expression anyway, voting for the lesser evil in a swing state is like suppressing your actual allegiances to please the crowd, whereas voting for the third-party candidate you love is the honest analog of rooting for the underdog. My students loved it, because it licenses everyone's favorite move ("my vote is a statement"), but it struck me as smuggeling in a whole lot under the surface.

  Can you audit the analogy properly? I want the correspondence table -- what plays the role of the stadium, the scoreboard, the opposing fans, the season, the team owners -- and then the places the mapping breaks, with some care to distinguish the disanalogies that matter for his two conclusions from the ones that don't (I genuinely don't care whether football has early voting). The thing I keep snagging on is that cheering seems constitutively non-causal and aimed at an audience of other fans, while voting is secret and counted, and I suspect secrecy and being counted are doing real work somewhere. So tell me: does either conclusion survive once the disanalogies are on the table, and if one falls but not the other, explain why the analogy could carry one and not the other. Maybe also say what a better analogy would be if there is one.

  Don't dumb it down -- they can handle the expected-utility stuff and the expressive-versus-causal distinction, we've done both. And please flag where you're confident and where you aren't, and single out the one point in your own answer you'd least want to bet on; I want to show them that even a clean-looking philosophical answer has a soft spot. American English, please.
reasoning: |-
  Okay, the user is teaching an intro ethics course and wants to dissect this "cheerleader view" of voting that a colleague presented. The analogy compares voting to cheering at a football game - both as expressive acts with no real causal impact. The colleague used this to argue two things: 1) there's no duty to vote, and 2) you should vote your heart rather than strategically. 

  Hmm, the user seems skeptical about this analogy but wants a thorough breakdown for their students. They're specifically concerned about how secrecy and vote-counting might undermine the comparison. I need to audit this analogy properly while keeping it rigorous enough for an ethics class that's already covered expected utility and expressive/causal distinctions.

  First, let's map the football analogy fully:
  - Stadium = voting booth
  - Scoreboard = election results
  - Opposing fans = voters for other candidates
  - Season = election cycle
  - Team owners = political elites
  - Etc.

  But where this breaks down is crucial. Cheering is public and performative while voting is private. Cheering has no causal mechanism - it doesn't physically affect the game. Voting does have a causal chain, however statistically insignificant. That statistical insignificance is key here - it's why people think their vote doesn't matter.

  For the first argument (no duty to vote): The analogy holds somewhat because both are low-stakes expressive acts. But voting has downstream consequences that cheering doesn't - policies affect real lives. So the duty question isn't settled by the analogy.

  For the second argument (vote your heart): This is where the analogy really collapses. In voting, expression and causation are entangled in ways cheering isn't. A third-party vote might express purity but could inadvertently help the worse candidate win - something that never happens in cheering. The secrecy of voting also means no one sees your "expression" anyway.

  A better analogy might be adding drops to a bucket - each drop seems insignificant but collectively matters. Or maybe participating in a silent auction where bids are secret but aggregated.

  I'm least confident about whether the "no duty" argument fully collapses - maybe voting's expressive value alone could justify it as a civic ritual regardless of consequences? But that feels shaky. The weakest point in my analysis is probably how much weight to give that expressive aspect versus the causal chain.

  The students loved this view because it justifies voting as self-expression without responsibility - exactly what needs unpacking. I should show how the analogy smuggles in assumptions by ignoring voting's unique features: secrecy, aggregation, and real-world impact.
answer: |-
  Here’s a full audit of the cheerleading analogy, mapped to voting and critiqued for its implications on your colleague’s two arguments. I’ll flag confidence levels and highlight the soft spot.

  ---

  ### **Correspondence Table: Cheerleading ↔ Voting**
  | **Football Element**      | **Voting Element**               | **Mapping Rationale**                                                                 |
  |---------------------------|----------------------------------|---------------------------------------------------------------------------------------|
  | **The Stadium**           | Polling place / Voting booth     | Physical space where the expressive act occurs.                                       |
  | **The Game**              | Election                         | Discrete event with an outcome and participants.                                      |
  | **Cheering**              | Casting a vote                   | Primary expressive act; signals support.                                              |
  | **Cheerleader/Fan**       | Voter                            | Agent performing the expressive act.                                                  |
  | **Opposing Fans**         | Supporters of other candidates   | Those expressing conflicting preferences.                                             |
  | **The Scoreboard**        | Election results                 | Public display of the outcome.                                                        |
  | **The Season**            | Election cycle                   | Broader context (primaries, campaigning, etc.).                                       |
  | **Team Owners**           | Political elites / Parties       | Entities with material stakes in the outcome.                                         |
  | **The Underdog Team**     | Third-party/long-shot candidate  | Symbolic favorite with low win probability.                                           |
  | **The Crowd**             | Electorate                       | Collective body generating the "expression."                                          |
  | **Referees**              | Election officials               | Neutral arbiters ensuring rules are followed.                                         |

  ---

  ### **Critical Disanalogies & Their Implications**
  #### **1. Core Disanalogies (Fatal to Both Arguments)**
  - **Secrecy vs. Public Spectacle**:  
    - 🏈 *Cheering*: Inherently public, performative, and directed at an audience (players, other fans).  
    - 🗳️ *Voting*: Secret ballot; no audience observes *your specific act*. Your "expression" is anonymous and aggregated.  
    - **Why it breaks the analogy**: If voting is expressive, its audience is abstract (the "public record"), not immediate. Cheering gains meaning from social reinforcement; voting’s "expression" is statistically diluted and invisible. *Undermines both arguments*: If no one "hears" your vote, how is it meaningfully expressive? Why not just wear a button?  

  - **Causal Mechanism vs. Pure Expression**:  
    - 🏈 *Cheering*: Constitutively non-causal. Noise doesn’t change the game’s outcome; it’s epiphenomenal.  
    - 🗳️ *Voting*: Has a *causal pathway* (votes are counted → influence outcomes). Statistically negligible ≠ non-causal.  
    - **Why it breaks the analogy**: Voting is *instrumental*: it aggregates to produce outcomes. Cheering is *ritualistic*. *Undermines both arguments*: If votes *can* (rarely) be pivotal, a duty might exist. Strategic voting is rational because causation matters.  

  #### **2. Disanalogies Damaging "No Duty to Vote"**
  - **Stakes of the Outcome**:  
    - 🏈 *Football*: Low-stakes entertainment. Losses don’t alter fans’ lives.  
    🗳️ *Elections*: High-stakes governance. Outcomes affect rights, resources, survival.  
    - **Impact**: Even if one vote rarely matters, the *collective* outcome does. This may ground a duty to contribute to the process (e.g., Kantian "what if everyone did that?"). Cheering lacks this moral gravity.  
    - *Confidence: High*.  

  - **Rivalry Without Exclusion**:  
    - 🏈 *Cheering*: You can cheer for multiple teams; no exclusivity.  
    🗳️ *Voting*: You get one vote. Choosing A excludes B/C.  
    - **Impact**: Voting’s exclusivity raises opportunity costs. Not voting *withholds* influence in a zero-sum system. Cheering imposes no such cost.  
    - *Confidence: Medium-High*.  

  #### **3. Disanalogies Damaging "Vote Your Heart"**
  - **Aggregation Dynamics**:  
    - 🏈 *Cheering*: All cheers are "counted" equally in atmosphere. Rooting for the underdog doesn’t help the rival win.  
    🗳️ *Voting*: Votes are zero-sum. In FPTP systems, a vote for a third party *reduces* votes for the mainstream alternative, potentially aiding your least-preferred candidate (e.g., Nader voters in 2000 aiding Bush).  
    - **Impact**: Strategic voting responds to this spoiler effect. "Voting your heart" can be instrumentally self-defeating—unlike cheering for an underdog.  
    - *Confidence: High*.  

  - **The "Crowd" Isn’t the Audience**:  
    - 🏈 *Cheering*: Aimed at fellow fans/players to build morale.  
    🗳️ *Voting*: The "audience" isn’t other voters—it’s the electoral system translating preferences into power.  
    - **Impact**: Voting isn’t about "pleasing the crowd" but avoiding worse outcomes. Honesty ≠ naiveté in systems with strategic pivots.  
    - *Confidence: High*.  

  ---

  ### **Do His Conclusions Survive?**
  - **"No Duty to Vote"**: **No.** The disanalogies (secrecy, stakes, aggregation) show voting isn’t *merely* expressive. Its causal potential in high-stakes collective action creates a plausible duty (e.g., as a fair-share contribution).  
  - **"Vote Your Heart"**: **No.** Voting’s instrumental logic (spoiler effects, pivotality risk) makes expressive purity potentially irresponsible. Honesty matters less than avoiding catastrophic outcomes when your vote is part of a causal chain.  

  ---

  ### **A Better Analogy: Jury Duty**  
  - **Why it fits**:  
    - Like voting, a single juror rarely sways a verdict (high bar for reasonable doubt).  
    - Secret deliberation → no performative audience.  
    - High stakes → outcomes affect lives.  
    - Duty exists despite low individual causality (you participate because the system needs collective input).  
    - Strategic elements (e.g., voting guilty/not guilty involves trade-offs).  
  - **Limitation**: Jurors aren’t expressing personal identity; they’re seeking truth under rules.  

  ---

  ### **Confidence Flags & Soft Spot**
  - **High Confidence**: The core breakdowns (secrecy, causality) and jury duty analogy.  
  - **Medium Confidence**: "No duty" collapse—some philosophers (e.g., Jason Brennan) argue voting *is* optional if you’re uninformed, but this relies on competence, not expressivity.  
  - **The Soft Spot (Betting Least Here)**:  
    I’m least confident that **secrecy alone** fatally wounds expressivism. *Could voting’s expressivity be in the aggregate?* (e.g., "I voted Green to boost their national numbers"). This might salvage "vote your heart" in *safe* states (e.g., a Californian voting Green to signal progressive discontent). But in swing states, instrumentality dominates.  

  ---

  ### **Summary for Your Students**  
  The cheerleading analogy fails because voting is a *causal, secret, high-stakes, aggregative* act—not a public performance. It confuses *personal expression* with *systemic instrumentality*. His conclusions collapse because:  
  1. **Duty** may arise from voting’s role in producing morally significant outcomes.  
  2. **"Voting your heart"** ignores how electoral math can distort expression into collateral damage.  

  The analogy’s appeal lies in absolving us of hard choices—but ethics demands we grapple with systems, not just symbols.
