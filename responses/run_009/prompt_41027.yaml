answer: |-
  Here’s a structured diagnosis of your reading group’s debate:

  ### 1. The two positions, stated fairly
  **Skeleton View:** Letters possess an abstract, invariant topological or structural skeleton that defines their identity (e.g., ‘a’ = closed counter + vertical stem + terminal aperture). Visual styles are "flesh" layered onto this core scaffold. This explains radical stylistic variation (e.g., blackletter vs. sans-serif ‘a’) while preserving recognizability. The skeleton is not a specific shape but a relational framework of critical features and connections.  

  **No-Core View:** Letter identity has no fixed structural essence. It emerges from family resemblances (overlapping features across instances) and systemic contrasts within an alphabet (e.g., how ‘a’ differs from ‘o’ or ‘d’ in a given typeface). Examples like single-/double-storey ‘g’ prove no single structure is necessary. Identity is relational and contextual, maintained only by functional differentiation from other letters in a system.  

  ### 2. What kind of disagreement this is
  This is primarily an **empirical disagreement about human cognition**, layered with a **methodological/metaphysical tension**.  

  - **Empirical Core:** Both sides make claims about how literate humans recognize letters. The skeleton view implies our brains extract/decode abstract structural invariants. The no-core view implies recognition relies on probabilistic feature matching and contextual contrast. This is testable via cognitive science (e.g., priming studies, distortion experiments, neural imaging).  

  - **Metaphysical Layer:** The skeleton view leans toward **moderate essentialism** – a "causal essence" (the skeleton) enables recognition across contexts. The no-core view is **non-essentialist**, seeing identity as a cluster concept stabilized by system dynamics (Wittgenstein’s family resemblances).  

  - **Methodological Divide:** Skeletons are often posited as *designer-centric abstractions* (tools for creating coherent alphabets). No-core focuses on *reader-centric perception* (bottom-up pattern recognition). Neither side necessarily denies the other’s observations but disagrees on which mechanism is fundamental to identity.  

  **Why not merely verbal?** The terms ("skeleton," "family resemblance") are understood, but they embody conflicting models of cognition. **Why not purely metaphysical?** Because both sides appeal to observable phenomena (e.g., ‘g’ variants, OCR generalization) to support their model of *how recognition works*.  

  ### 3. The OCR wrinkle
  OCR evidence is **ambiguous but leans toward the no-core view’s cognitive model**. OCR models recognize novel ‘a’s via learned statistical patterns (feature correlations, spatial relationships, contrast with other glyphs) – not explicit skeletons. This mirrors the no-core emphasis on flexible feature-based recognition within a system. However, skeletons might *describe* what models implicitly learn (e.g., "closed loop" as a high-level feature). Thus, OCR demonstrates recognition *without requiring pre-defined skeletons*, supporting the no-core mechanism, but doesn’t disprove skeletons as a useful *description* of invariant relational properties.  

  ### 4. What would count as progress  
  Progress requires **empirical testing and conceptual refinement**:  

  - **Key Experiment:** Test human recognition of systematically distorted glyphs or "morphed" letters between categories (e.g., ‘a’→‘o’). Measure error rates/reaction times.  
    - *Skeleton Prediction:* Recognition fails abruptly when critical structural nodes (e.g., closure point) are disrupted.  
    - *No-Core Prediction:* Recognition degrades gradually based on feature overlap and contextual contrast; no single disruption is catastrophic.  

  - **Crucial Distinction:** Separate **recognition mechanisms** (cognitive/algorithmic) from **design principles** (how to create distinct, coherent glyphs). Skeletons may be vital for design but not necessary for perception.  

  - **Reformulation:** Ask: "Under what perceptual and contextual constraints can a visual form be reliably recognized as ‘a’?" This shifts focus from *essence* to *boundary conditions*.  

  - **Honest Stalemate?** If recognition proves highly context-dependent (e.g., a form is ‘a’ in one typeface but ‘ɑ’ in another), the no-core view wins. If invariant structural features are neurally validated (e.g., fMRI shows consistent brain responses to ‘closed loop + stem’ across fonts), skeletons gain ground. Absent such evidence, the debate risks being metaphysical – but current cognitive tools can resolve it.  

  **Your hypothesis is astute:** The stalemate likely stems from conflating *designer abstractions* (skeletons as tools) with *perceptual/cognitive primitives* (how brains actually process glyphs). OCR shows recognition can emerge from statistical learning, not explicit skeletons – but the brain might still extract skeleton-like invariants. Empirical work on human perception is the path forward.
