prompt: |-
  I do ML tooling work, pretty far from philosophy, so forgive me if this has an obvious name and I just can't find it. I keep running into what looks like the exact same fight at different scales, and I want to know if anyone has named the thing the fight is about.

  Instance one: someone trains a linear probe on a network's activations, shows you can decode, say, the sentiment of the input from layer 27, and announces the network has a sentiment representation there. Someone else says that's way too fast — decodability is cheap, you can find some linear readout in almost any sufficiently high-dimensional blob of features, so what have you really shown? The first person then does an ablation: they knock out the direction the probe found and the network's output changes, and declares victory, the feature is causally used. Then a third person points out that the ablation is done along the probe's own direction, so of course it perturbs something — you've found a real input to the network, but calling it a representation is an extra step nobody earned. And it just never resolves.

  Instance two, same shape: a game-playing network where people showed you can decode the board position from the activations, and half the discussion was about whether that means the network "has" a board state internally or whether the probe is just a clever enough reader that it could reconstruct the board from all sorts of things, including ones that don't use it. Meanwhile my philosopher friend muddies it further by pointing out that a mercury thermometer "represents" temperature on a pretty deflationary reading, so if decodability is all it takes, we're using the word so thinly it covers the thermometer, and presumably that's not what the interpretability people want to claim.

  So: does the gap between decodable-from-activations and actually-used-as-a-representation have an established name? Is there a standard carve-up of the senses of "the network represents X" — like a decodable sense, a causally-used sense, maybe a sense where the network uses it *for* something in a stronger way? I know there's a mountain of philosophy of mind on representation generally, but I'm after the specific version of this debate, if it exists, and if it doesn't, I'd like you to build the carve-up yourself and tell me which sense the ablation actually supports and where the edges of each are. I'm not looking for a bare label — I want to know what the phenomenon is and isn't, e.g. whether the probe-direction-ablation circularity worry can be fixed by ablating along other bases, or whether that misses the point entirely.

  One more thing: please tell me honestly where your answer is most likely to be wrong. Like, which of these distinctions is contested enough that a specialist might say I've misdescribed the debate, and what consideration would actually flip you on whether the ablation settles anything?
reasoning: |-
  Okay, let me start by unpacking the user's query. They work in ML tooling and keep encountering the same debate about whether decodable features in neural networks are genuine representations. They want to know if there's a name for this gap and a framework to understand the different senses of "representation." 

  First, I recall their examples: linear probes and ablations in sentiment analysis and game-playing networks. The core issue is the leap from decodability to causal use. The user mentions their philosopher friend bringing up deflationary representations like thermometers, which complicates things. 

  The user isn't just asking for a term; they want a structured breakdown of the concepts. They also want honesty about where the answer might be contested. So, I need to address both the taxonomy and its potential weaknesses.

  Looking into philosophy of mind and cognitive science, I remember the distinction between correlation and causal role. Patricia Churchland's work on activation vectors comes to mind, but she's critiqued for underplaying causal roles. Then there's Dennett's stance on the intentional stance versus design stance. For ML-specific discussions, Chris Olah's work on circuits and functional roles is relevant. The "representation" debate in XAI (explainable AI) circles also fits here.

  The user's deeper need seems to be resolving these debates in their work. They might be designing interpretability tools or evaluating others' claims. They need clarity to avoid overclaiming or understating their findings. Their frustration with unresolved arguments suggests they want practical criteria for when a feature is a "real" representation.

  Building the taxonomy: I consider three senses—decodable, causally potent, and functional. Decodable is just correlation; causally potent involves ablation evidence; functional ties to the system's goals. The mercury thermometer is decodable but not causally potent in the system's function. The circularity in ablations (using the probe's direction) is a key issue. Breaking that circularity requires methods like interchange interventions or finding orthogonal bases.

  I need to address where my answer might be wrong. Critics might argue that causal potency alone doesn't suffice for representation. Functionalists might demand teleological elements. The ablation methods themselves (e.g., patching) have limitations, like unintended downstream effects. Also, the framework's applicability across network architectures could be contested.

  Finally, I should offer practical steps: suggest methods like causal scrubbing, emphasize functional relevance, and advise clear definitions in papers. Highlighting ongoing debates shows the user that the field is evolving and their engagement is part of the solution.
answer: |-
  This is a **deeply entrenched and unresolved debate** in interpretability and philosophy of mind, precisely because it touches on what "representation" even *means* in artificial systems. There isn't one universally accepted name for the *exact* gap you describe, but we can build a robust conceptual carve-up based on adjacent philosophical and ML discourse. Here's the breakdown:

  **The Carve-Up: Senses of "The Network Represents X"**

  1.  **Decodability (Correlational / Information-Theoretic Sense):**
      *   **What it means:** There exists *some* function (e.g., a linear probe, a small MLP) that can reliably decode information about `X` from the activations `A` at a given point. `I(X; A)` is high.
      *   **Strengths:** Objective, measurable, relatively easy to demonstrate.
      *   **Weaknesses:** Extremely permissive. As your philosopher friend notes, a mercury column "represents" temperature in this sense. It doesn't imply the information is *used* by the system itself, nor that it's structured in a way the system leverages. It might be an epiphenomenon or a byproduct of computation for something else.
      *   **What your Instance 1/2 critics attack:** "Decodability is cheap, ubiquitous, and doesn't show 'representation' in a meaningful sense."

  2.  **Causal Potency (Interventionist Sense):**
      *   **What it means:** Manipulating the *specific state* hypothesized to represent `X` within the activations `A` *causes* a predictable, specific change in the network's output or downstream behavior *relevant to `X`*. The ablation you describe (knocking out the probe direction/feature) aims for this.
      *   **Strengths:** Demonstrates the information isn't just present; perturbing it *does* something causally relevant to the task involving `X`. Moves beyond mere correlation.
      *   **Weaknesses (The Circularity Problem):**
          *   **Direction Dependence:** Ablating *along the probe's direction* is circular. The probe found a direction correlated with `X`. Ablating that direction is guaranteed to remove *whatever variance the probe was using*, which necessarily included signal about `X`. It *might* be removing much more (or less) than just the "representation of X".
          *   **Specificity:** Does the ablation *only* affect `X`-related outputs? Or does it break many unrelated things? If it breaks everything, it might just be disrupting general computation, not a specific representation.
          *   **"Used As" vs. "Is Input":** Demonstrating causal potency shows the information *flows through* this point and *affects* the output. It doesn't necessarily show that the network treats this state *as a representation* of `X` internally. It might be an intermediate calculation *used to compute* `X` elsewhere, or a side effect. Your third critic is spot-on here.
      *   **What your ablation claims:** "This direction contains information causally relevant to the output concerning `X`."

  3.  **Functional Role (Teleological / Computational Sense - The Strong Claim):**
      *   **What it means:** The activation state `A` doesn't just *contain* information about `X` and *affect* output; it is *used by the network's own computational processes* *as* a representation of `X` within its internal algorithm. The state *stands in for* `X` for the purposes of the network's own subsequent computations. It plays the *functional role* of a representation of `X` in the system's causal structure.
      *   **Strengths:** This is what most people intuitively *mean* when they say "the network has an internal representation of the board state." It implies the representation is a distinct, manipulable component within the system's reasoning.
      *   **Weaknesses:** Extremely difficult to demonstrate conclusively. Requires understanding the network's internal algorithm and how states are utilized. How do you *prove* the system is "using it *as* a representation" beyond it being causally potent?
      *   **The Mercury Thermometer Contrast:** The mercury height decodes temperature and is causally potent (break it, the reading is wrong). But we wouldn't say the thermometer circuit *uses the mercury height as a representation of temperature internally*; it *is* the direct physical output. The representation is for the *external observer*. The network analogue would be if the activation *was* the direct output logit for sentiment, not an internal state used to compute it.

  **Addressing the Ablation Circularity & Your Questions**

  *   **Can ablating along other bases fix the circularity?** Yes, partially. This is where techniques like **Interchange Interventions** or **Activation Patching** shine:
      *   **Interchange Intervention:** Find two inputs `I1` and `I2` that differ *only* in `X` (e.g., different board positions, opposite sentiments). Run `I1` through the network up to layer `L`, capture activations `A1`. Run `I2` up to layer `L`, capture `A2`. Now, "patch" the activations at `L` for input `I1` by replacing them with `A2`. Run the rest of the network from `L` onward *using these patched activations*.
      *   **Result:** If the output *changes specifically in ways predictable based on `X` in `I2`* (e.g., the network now acts as if the board state from `I2` is present, or outputs the sentiment of `I2`), this is *strong evidence* for causal potency **and** that the state at `L` encodes `X` in a way that functionally replaces the original computation. It breaks the probe-direction circularity because you're intervening based on *inputs differing in `X`*, not on a learned probe direction.
  *   **Does this prove the "Functional Role" sense?** It gets much closer! It shows the state at `L` can *substitute* for the state generated by a different input concerning `X` and lead to downstream behavior consistent with that substituted `X`. This strongly suggests the network treats the state at `L` *as* an input representing `X` for its subsequent computations. However, purists might argue it doesn't prove it's the *canonical* or *only* representation, or that the network has explicit *concepts*.

  **Names for the Gap/Phenomenon**

  *   **The Decodability vs. Causal Role Gap:** The most direct description.
  *   **The Correlation vs. Causation Problem in Representation:** A classic framing.
  *   **The Problem of Epistemic vs. Constitutive Representation:** (Philosophical) Is the representation in the eye of the decoder (epistemic) or built into the system's function (constitutive)?
  *   **The "Clever Hans" Problem in Interpretability:** Analogous to the horse that tapped answers based on cues, not math. Is the probe finding a real representation or just clever correlations?
  *   **The Activation Patching Criterion:** Specifically for the interventionist approach to bridge the gap.

  **Where My Answer is Most Likely to Be Wrong (and Contested)**

  1.  **"Causal Potency is Sufficient for Representation":** Some philosophers and ML researchers (especially those influenced by interventionist causality) might argue that demonstrating robust causal potency via non-circular interventions (like patching) *is* sufficient to say the network "represents" `X` at that point. They might see the "Functional Role" sense as unnecessarily strong or ill-defined for artificial systems. I lean towards requiring more for "representation," but this is a core point of contention.
  2.  **The Necessity of Teleology for "True" Representation:** Strict functionalists (especially in philosophy) argue that true representation requires the state to have a *function* or *purpose* within the system, often tied to evolutionary or design history. Since neural nets lack this history, they might argue *no* internal state truly "represents" in the strongest sense – only decodes or is causally potent. This view might dismiss the whole debate as category error. I think this is too restrictive for AI interpretability.
  3.  **The Efficacy and Scope of Patching:** Critics could argue that even patching doesn't *fully* break circularity or prove functional role:
      *   Patching might induce unexpected states that corrupt *more* than just `X`, leading to misleading effects.
      *   It might only show that `X` *can be* represented there, not that it *is* used that way in normal operation.
      *   Finding truly minimal pairs (`I1` and `I2` differing *only* in `X`) is often impossible in complex inputs.
  4.  **"Representation" is the Wrong Word:** Some (like your philosopher friend pushing the thermometer) might argue that "representation" is fundamentally a term for how *we* interpret systems, not an objective property *in* the system. Trying to find it "in the network" is misguided. The debate should be about causal structure and information flow, not "representation."

  **What Would Flip Me?**

  If someone showed me a network where:
  1.  `X` is robustly decodable from layer `L`.
  2.  Clean interchange interventions show causal potency specific to `X`.
  3.  But a detailed analysis of the network's *actual computational pathways* revealed that the state at `L` is *never* directly accessed or utilized by subsequent layers in a way that treats it as a coherent unit representing `X`; instead, downstream layers only use scattered, transformed fragments of the information in a way that doesn't correspond to the structure of `X` found by the probe/intervention. This would challenge the idea that *the state itself* is the representation, even if the information passes through.

  **Practical Advice for Your Work**

  1.  **Be Precise:** When claiming "representation," specify the sense: "We show sentiment is decodable from L27," "We demonstrate the board state feature at L15 is causally potent via patching," "We provide evidence that the network uses the state at L42 as a functional representation of X."
  2.  **Prioritize Non-Circular Interventions:** Use interchange interventions/activation patching over simple ablation along the probe direction whenever possible. Frame interventions around *inputs* differing in `X`, not just the probe vector.
  3.  **Check Specificity:** When intervening, measure not just the effect on `X`, but on unrelated outputs. Does perturbing the "sentiment direction" *only* affect sentiment, or also grammaticality, topic, etc.?
  4.  **Acknowledge the Thermometer:** Accept that decodability alone is weak evidence for "representation" in any interesting internal sense. The ablation strengthens it, but non-circular causal demonstrations are stronger still for the "used as" claim. The functional role claim remains the gold standard but is hardest to prove.
  5.  **Engage the Philosophy:** Your friend is right that "representation" is a loaded term. Understanding the philosophical baggage helps clarify the debate you keep seeing. It's fundamentally about the nature of meaning and computation in artificial minds.

  The fight persists because it's grappling with the very nature of how complex information processing systems embody meaning. Your instinct that it's the "same fight at different scales" is exactly right.
