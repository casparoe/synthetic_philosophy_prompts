  Then there's Kripke's quus. This is about rule-following. If I've only added numbers below 57, maybe I meant "quus" where it's plus up to 56 and then 5. How do I know I meant plus? The skeptic says there's no fact about what I meant. It's not about translation but about meaning itself. The normativity is key—meaning plus implies I should answer 125, not 5, but why?

