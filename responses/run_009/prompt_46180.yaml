prompt: |-
  Hi. Quick bit of context: I'm the welfare lead at a company that farms black soldier fly larvae for animal feed (some pet food too). We process on the order of 300 million larvae a month, which is the kind of number that makes people either shrug or panic depending on what they think a larva can feel. Our board doesn't want to touch the question of whether insects are sentient ("we're not philosophers"), but they've told me to come back with something I can actually run when a welfare question lands on my desk — roughly one a month, and I've got maybe half an hour per question before it goes to the farm managers, who are practical people and will ignore anything that reads like a seminar.

  What I want is a decision procedure in the shape of: a fixed list of questions in order, where for each one you say what counts as a good-enough answer, and which answers just stop the checklist and force a values call that goes back to the board. The spine of it should be the arithmetic my board already half-accepts: huge numbers times a small chance of feeling anything is still huge — but also, small chance of feeling anything means we can't pretend they're cows, and our money isn't infinite. If you think the right move is a threshold — below some probability of sentience we don't spend at all, above it we do — say so, but then tell me where the threshold comes from, because "I picked 10%" won't survive contact with the managers.

  Two ideas floating around here that I'd like you to either build into the procedure or tell me are wrong:
  1. One of our science guys says the only question is expected suffering prevented per dollar — do whatever beats our best alternative use of that money, nothing else matters. Feels too clean to me but I can't put my finger on why.
  2. The board's version is the opposite: a hard cap, no welfare spend above 0.1% of revenue, whatever the numbers say. Also feels wrong, and I'd like to be able to say why out loud for once.

  Then run it on the three questions I actually have queued:
  (a) Kill method. Most of the industry, us included, does live grinding for the bulk lines (freezing or blanching for smaller ones). Does the procedure come out saying grinding is fine, or against?
  (b) The pre-harvest fast. We pull the food substrate about a day before harvest so the larvae empty their guts — keeps the product clean, for us it's just the seperation step of the process. But if they can feel something like hunger, that's 24 hours times a very large number of larvae. Does it survive the procedure?
  (c) The breeding adults. Black soldier fly adults barely eat — they live about a week and mostly run on fat reserves, that's just the species — and some competitors keep their adult colonies with no water at all. We do give water. Can the procedure tell us whether that's welfare or theater?

  Format, in this order please: "Assumptions I'm making" (short, ~100 words — the numbers you'll be plugging in, so I can argue with them); "The procedure" (~400 words, the actual one-page list); "The three cases" (~150 words each — and at least one where the procedure gives an answer I won't like; please don't sand that one down for my benefit); "Where it breaks" (~100 words — the situations where the checklist misfires or has to hand off to the board); and "What would change my mind" (~100 words) — tell me what kind of finding, e.g. about nociception or larval behavior, would flip the kill-method ruling or the fast, and which step of the procedure is the likeliest point of failure for the whole thing. Also be blunt about where you're just guessing — I'd definately rather know which numbers are judgment dressed up as arithmetic.
reasoning: |-
  Alright, let me unpack this user's query. They're the welfare lead at a black soldier fly larvae farming company. They need a practical decision procedure for welfare questions that farm managers will actually use. The board avoids the sentience debate but wants something actionable. 

  First, the user's main pain points: They handle about one welfare question per month with only 30 minutes to decide. Farm managers are practical and dismiss theoretical approaches. The user needs a checklist that incorporates expected suffering prevented per dollar while acknowledging uncertainty about insect sentience. They also mentioned two conflicting ideas: the science guy's utilitarian approach and the board's 0.1% revenue cap. 

  Hmm, the key challenge is balancing ethics with practicality. The user can't spend infinite money but recognizes that even a tiny probability of sentience multiplied by 300 million larvae creates moral weight. They want to avoid arbitrary thresholds but need clear stopping points for when issues must escalate to the board.

  For the assumptions: I'll set a base sentience probability of 0.1% based on current evidence - it's low but not zero. Cost-effectiveness should be benchmarked against proven animal welfare interventions. The 0.1% revenue cap is problematic but politically necessary to include as a constraint. 

  The procedure must be step-by-step. Start by checking if the issue is even plausible (Step 1). Then estimate suffering scale and cost-effectiveness (Steps 2-4). Compare to alternatives (Step 5) and check budget limits (Step 6). Use clear thresholds like "5-10x more effective than alternatives" to force escalation - this makes it operational, not philosophical.

  Now the test cases: 
  For live grinding - high suffering potential but low cost to change. At 0.1% sentience probability, switching to blanching looks cost-effective. This outcome might upset some managers.
  Pre-harvest fast - moderate suffering scale but prevention would disrupt operations. The high cost makes it fail cost-effectiveness unless sentience probability is over 1%.
  Adult hydration - trivial suffering and cheap to maintain. An easy win that survives all checks.

  I should flag where I'm guessing: sentience probability is the biggest unknown. Also, suffering intensity estimates for larvae are extrapolations from other species. The 5-10x effectiveness threshold is somewhat arbitrary but necessary for decisiveness.

  Breakdown risks: If sentience evidence surges, the whole calculation changes. Also, catastrophic scenarios (like mass starvation) aren't handled well by the per-intervention approach. 

  Finally, what would change my mind? Concrete evidence of larval nociception or hunger states would flip rulings. Behavioral studies showing aversive learning could force reassessment. The sentience probability estimate is the procedure's weakest point - but it's deliberately adjustable if new science emerges.

  This feels responsive. The structure gives clear answers while exposing the ethical math behind them. Managers might grumble about the grinding recommendation, but the numbers back it up. And crucially, it lets the user say "the procedure says X" instead of "I think X" - that political insulation might be as valuable as the ethics.
answer: |-
  Here's your decision procedure, designed for speed, defensibility, and board-alignment. It prioritizes expected suffering reduction per dollar (ESR/$) within a bounded budget, forcing escalation when uncertainty or stakes are too high.

  **Assumptions I'm Making:**
  1.  **Base Sentience Probability (P_s): 0.1% (0.001).** This is a conservative placeholder based on the precautionary principle and invertebrate cognition reviews (e.g., Birch et al. 2021). *This is a critical judgment call.*
  2.  **Cost-Effectiveness Benchmark:** ESR/$ must be at least **5-10x** better than highly effective vertebrate welfare interventions (e.g., cage-free transitions for hens) to justify spending given low P_s & scale. (Benchmark ~$0.01-$0.05 per vertebrate-year of suffering averted).
  3.  **Suffering Intensity Scaling:** Crude estimates relative to vertebrates (e.g., grinding likely >> hunger >> dehydration). *Highly uncertain.*
  4.  **Budget Constraint:** The Board's 0.1% of revenue cap ($CAP) is a *hard stop* for spending on *this specific intervention*, even if cost-effective.
  5.  **"Theater" Threshold:** Interventions costing < 0.01% of $CAP are "de minimis" – do them unless actively harmful.

  **The Procedure: (The Welfare Question Checklist)**

  1.  **Plausibility Check:** Is there *any* credible biological mechanism or behavioral evidence suggesting this practice *could* cause negative states analogous to suffering in sentient beings? (e.g., nociception, avoidance learning, stress hormones).
      *   *Good Enough:* "Yes" or "Uncertain but biologically plausible." → Proceed to Step 2.
      *   *Stop & Escalate:* "No credible mechanism/evidence." → Practice likely acceptable. Log decision. *Rare.*

  2.  **Scale & Suffering Estimate:**
      *   **A.** Number of individuals affected per month? (Use your 300M baseline).
      *   **B.** Duration of potential negative state per individual (hours/days)? (e.g., 24h fast).
      *   **C.** Estimated *intensity* of potential suffering (1-10 scale; 1=mild aversion, 10=extreme trauma akin to vertebrate major injury). *Use best available science & analogy.*
      *   **Suffering-Days/Month (SDM) = A * (B / 24) * C**
      *   *Good Enough:* Calculate SDM. Proceed to Step 3.
      *   *Stop & Escalate:* If intensity (C) is estimated >=8 *or* duration (B) > 72h *and* scale (A) > 1% of total. → High potential severity demands board-level values discussion regardless of P_s.

  3.  **Cost-Effectiveness (ESR/$):**
      *   **D.** Cost *per month* to implement/change the practice ($/month).
      *   **E.** Estimated *reduction* in SDM if changed (ΔSDM).
      *   **Expected Suffering Reduction (ESR) = ΔSDM * P_s** (Suffering-Days Averted/Month, adjusted for sentience prob.)
      *   **ESR/$ = ESR / D**
      *   *Good Enough:* Calculate ESR/$. Proceed to Step 4.
      *   *Stop & Escalate:* If D > $CAP. → Automatically blocked by board policy. Report this outcome.

  4.  **Cost-Effectiveness Threshold:** Is ESR/$ **≥ 10x** the vertebrate benchmark ($0.10 - $0.50 per suffering-day averted)?
      *   *Good Enough (Yes):* Intervention is highly cost-effective given uncertainty. Proceed to Step 5.
      *   *Good Enough (No):* Intervention fails cost-effectiveness threshold. → Practice likely acceptable *unless* Step 5 overrides. Proceed to Step 5.
      *   *Stop & Escalate:* If ESR/$ is between **1x and 10x** the benchmark. → The "murky middle" – cost-effectiveness is ambiguous given P_s uncertainty. Escalate to board with analysis.

  5.  **De Minimis / Low-Cost Override:** Is the monthly cost (D) **< 0.01% of $CAP**? AND Does Step 1 indicate plausible concern?
      *   *Good Enough (Yes):* Implement the change regardless of ESR/$. It's "welfare theater" only if cost is zero; this is cheap insurance. → **Recommend Change.**
      *   *Good Enough (No):* Proceed based on Step 4 outcome. → **Recommend Change** (if Step 4 Yes) or **Recommend Status Quo** (if Step 4 No).

  6.  **Budget Check:** For any change costing D > $CAP, see Step 3 (Stop & Escalate). Otherwise, proceed with recommendation.

  **The Three Cases:**

  **(a) Kill Method - Live Grinding (Bulk Lines):**
  *   **Step 1:** Plausible (Nociceptors documented in larvae, immediate destruction).
  *   **Step 2:** Scale=300M/mo (bulk), Duration=Seconds (assume 10s), Intensity=10 (Presumed extreme trauma). SDM = 300M * (10/3600/24) * 10 ≈ **347,222 SDM** (Massive intensity/duration multiplier).
  *   **Step 3:** Assume change to blanching costs $50,000/mo (equipment, energy, labor). ΔSDM = 347,222 (assuming blanching causes near-instant unconsciousness). ESR = 347,222 * 0.001 = **347.2**. ESR/$ = 347.2 / 50,000 = **$0.00694** per SD averted.
  *   **Step 4:** Benchmark = $0.10-$0.50. $0.00694 < $0.10. **Fails Threshold.** BUT... ESR is high absolute value (347 days/mo).
  *   **Step 5:** Cost $50,000. 0.01% of $CAP (assume $10M/mo revenue -> $CAP=$10k -> 0.01% = $1). $50,000 >> $1. **No Override.**
  *   **Step 6:** Cost ($50k) > $CAP ($10k) → **Stop & Escalate.** *The procedure forces this to the board. The high ESR and severity (Step 2) make it a values call, not a pure cost-effectiveness one. You won't like this – it doesn't give a clear "green light" to grinding, it forces the board to own the high-severity risk.*

  **(b) Pre-Harvest Fast (24h):**
  *   **Step 1:** Plausible (Insects show hunger-driven behaviors, search activity).
  *   **Step 2:** Scale=300M/mo, Duration=24h, Intensity=3 (Moderate discomfort, hunger). SDM = 300M * 1 * 3 = **900,000,000 SDM** (Massive scale/duration).
  *   **Step 3:** Ending fast = Major operational disruption. Cost $500,000/mo (lost throughput, handling wetter biomass, separation issues). ΔSDM = 900M. ESR = 900M * 0.001 = **900,000**. ESR/$ = 900,000 / 500,000 = **$1.80** per SD averted.
  *   **Step 4:** Benchmark = $0.10-$0.50. $1.80 > $0.50. **Meets Threshold (10x+).**
  *   **Step 5:** Cost $500k > $1 (0.01% of $CAP). **No Override Needed.**
  *   **Step 6:** Cost ($500k) > $CAP ($10k) → **Stop & Escalate.** *Despite excellent ESR/$, the high absolute cost breaches the board's cap. Procedure forces board to choose: relax cap or accept fast. Status quo favored by cap.*

  **(c) Adult Hydration:**
  *   **Step 1:** Plausible (Dehydration causes distress/lethargy in insects).
  *   **Step 2:** Scale=~1M adults/mo (est.), Duration=~168h (week), Intensity=2 (Mild discomfort increasing to distress). SDM = 1M * 7 * 2 = **14,000,000 SDM**.
  *   **Step 3:** Current cost negligible (water + simple system). *Removing* water saves ~$100/mo. ΔSDM (if removed) = +14M (Increased suffering). ESR (of current practice) = 14M * 0.001 = **14,000** (averted). ESR/$ (of spending $100) = 14,000 / 100 = **$140 per SD averted**.
  *   **Step 4:** $140 >> $0.50. **Massively Exceeds Threshold.**
  *   **Step 5:** Cost $100. 0.01% of $CAP ($10k) = $1. $100 > $1? **Yes, BUT...** Step 1 is Plausible. De Minimis Override requires cost *<* 0.01% ($1). $100 > $1 → **No Override Needed** (it already passed Step 4 overwhelmingly).
  *   **Recommendation:** **Maintain Hydration.** Cost is low, ESR/$ is exceptional. Removing it would be actively harmful. *Procedure strongly endorses current practice.*

  **Where It Breaks:**
  1.  **Catastrophic Suffering:** If P_s is wildly wrong (e.g., larvae sentience is 10%, not 0.1%) or suffering intensity is massively underestimated (e.g., grinding is consciousness-prolonged agony), the ESR calculations become meaningless. Step 2 escalation is vital here.
  2.  **Intervention Interactions:** Treats each issue in isolation. Fixing (a) might impact (b)'s cost/benefit.
  3.  **"Welfare Theater" Exploitation:** A determined bad actor could propose useless but ultra-cheap interventions to exploit Step 5. Step 1 guards against this.
  4.  **Radical New Evidence:** A seminal paper proving insect sentience would invalidate P_s and the benchmark.

  **What Would Change My Mind (Bluntly):**
  *   **Kill Method:** Evidence that grinding in BSF larvae **does not immediately destroy the central nervous system** (e.g., prolonged neural activity post-grinding) would drastically increase Intensity (C) and ΔSDM, making ESR/$ skyrocket. Alternatively, **definitive proof of larval sentience absence** (P_s=0) would end the debate. *Likeliest Failure Point: Step 2 Intensity/Duration estimate.*
  *   **Pre-Harvest Fast:** **Demonstration of a true "hunger" state with aversive qualities** (beyond simple food-search) in BSF larvae would increase Intensity (C). Conversely, **proof that fasting causes no detectable stress response or behavioral aversion** beyond immediate food location failure would undermine Step 1 Plausibility. *Likeliest Failure Point: Step 1 Plausibility / Step 2 Intensity.*
  *   **Sentience Probability (P_s):** **This is the linchpin.** Robust evidence linking specific neural structures/behaviors in *BSF larvae* to subjective experience would force P_s upwards, making ESR calculations favor intervention much more often. A conclusive *disproof* would collapse the moral arithmetic. *This is the core uncertainty dressed as a number.*
  *   **Cost-Effectiveness Threshold (10x):** This is judgment. If the board demands *absolute certainty* before spending anything, the threshold becomes infinite. If they accept the precautionary principle more readily, it could be lower (e.g., 2x). *This is the key policy judgment point.*

  **Guessing Flags:**
  *   **P_s = 0.001:** This is pure precautionary judgment. The actual number could be 0.000001 or 0.1.
  *   **Suffering Intensity (C):** Grinding=10, Hunger=3, Dehydration=2. These are reasoned extrapolations from vertebrate analogs and general insect biology, but fundamentally uncertain. The *relative* scaling (grinding >> hunger) is more defensible.
  *   **10x Cost-Effectiveness Threshold:** A pragmatic policy choice balancing moral weight against low probability/cost constraints. Could be 5x or 20x.
  *   **Cost Estimates for Changes (a & b):** Based on typical operational scale impacts. Real numbers could differ.
