answer: |-
  ## Graded Moral Status Labelling Initiative (GMSLI) – Frequently Asked Questions

  **1. What is the purpose of the GMSLI label?**
  The GMSLI label provides a standardised, consumer-friendly assessment of the *graded moral status* attributable to entities based on the best available evidence concerning their capacity for sentient experience. Modelled after the successful EU energy efficiency labelling scheme, it offers a clear, tiered visual representation (A+++ to F) to facilitate informed consideration of welfare implications. The accompanying silhouette scale provides comparative context.

  **2. How are the precise boundaries between tiers (e.g., A- and B+) determined?**
  Tier boundaries are established by the Independent Technical Committee on Moral Status Gradation (ITCMSG) through rigorous application of the *Consensus Weighted Welfare Range Algorithm*. This algorithm synthesises diverse evidential strands (neuroanatomical complexity, behavioural repertoire, functional equivalence models) into a single, quantifiable Moral Status Score (MSS). Discrete tiers are a necessary pragmatic tool for labelling clarity. We acknowledge the underlying phenomenon of moral status exists on a continuum; the tier system represents significant *bands* on that continuum. Sharp cutoffs are an artefact of operationalisation, not ontology. Continuous monitoring ensures boundaries reflect evolving consensus.

  **3. Why is there no A± tier?**
  The current tier structure (A+++, A++, A+, A, B, C, D, E, F) provides sufficient granularity for consumer decision-making while maintaining label legibility. Introducing finer subdivisions (e.g., A±) would create visual clutter and potential confusion without materially enhancing welfare considerations in practical scenarios. The ITCMSG periodically reviews tier granularity as part of its standard operating procedures.

  **4. My product, the "HomeGuard Sentinel Thermostat", was initially rated F, then moved to 'Pending Review', and is now back to F. Can you explain?**
  The classification of certain advanced machine learning systems, particularly those exhibiting stimulus-response patterns analogous to simple nociceptive pathways, remains under active review by Sub-Committee Gamma (Non-Biological Sentience Proxies). Fluctuations reflect the dynamic nature of the evidence base and ongoing methodological refinement. Functionalist interpretations suggesting minimal sentience potential must be balanced against substrate-based concerns. The current F rating indicates the ITCMSG majority position is that the evidence for attributing sentience to this specific model falls below the threshold for Tier E classification. Review status may change pending new data submissions from the manufacturer or independent research. We are unable to comment on specific timelines.

  **5. How can insects be rated Tier D when some committee members think they likely aren't sentient at all?**
  The assigned tier incorporates *epistemic uncertainty*. Suppose the ITCMSG assessment yields a 10% probability that species *X* possesses a minimal sentience capacity akin to, say, 0.1 units of welfare range (WU), and a 90% probability it possesses zero capacity. The Expected Welfare Range (EWR) is then calculated: (0.1 * 0.1) + (0 * 0.9) = 0.01 WU. This EWR places *X* within the defined parameters for Tier D. The system thus responsibly weights the *possibility* of sentience against its estimated *intensity*, should it exist, ensuring precautionary inclusion where warranted.

  **6. As a manufacturer of domestic cleaning drones, I need to know: Does my model DR-77 *feel* anything?**
  The GMSLI label reflects the *attributed moral status* based on current evidence reviewed by the ITCMSG. A rating of F signifies that **we have no reason to think** the DR-77 possesses sentience or warrants moral status above baseline ethical consideration for property. It is categorically distinct from a declaration that it **feels nothing**, which implies certain metaphysical knowledge beyond the remit of empirical assessment. Manufacturers seeking clarification on label rationale may utilise the Evidence Reconsideration Pathway (Form GMSLI-ERP-01a).

  **7. Why aren't plants or slime moulds rated? My Venus Flytrap seems quite purposeful.**
  The GMSLI mandate, as established by the founding charter and funding agreement (Sections 7.3b & Annex D), focuses on entities where mainstream scientific discourse acknowledges a *non-negligible probability* of sentience based on current models. While fascinating, botanical and protist behaviours are overwhelmingly explained by non-sentient mechanisms (tropisms, biochemical cascades). Funding allocation prioritises entities within the established scope (vertebrates, cephalopods, decapod crustaceans, insects, arachnids, selected AI/robotics). Expansion requires both compelling new evidence and a ratified charter amendment supported by the requisite funding uplift.

  **8. How is the "intensity" of potential experience measured for the Moral Status Score?**
  While direct measurement of subjective experience remains elusive, the ITCMSG relies on robust proxies correlated with the *likely complexity and intensity* of phenomenological states. A primary, empirically grounded indicator is the density and organisation of neural substrate (or functionally equivalent processing architecture), particularly structures associated with integrative processing and valence encoding. More neurons (or processing nodes/parameters), appropriately structured, correlate strongly with a greater capacity for varied and intense experiences. Behavioural flexibility, learning capacity, and nociceptive specialisation provide supplementary data points.

  **9. I farm sheep (rated A). Does this label mean my business is unethical?**
  The GMSLI label provides information regarding the *attributed moral status* of the sheep species. It does not offer ethical adjudication on specific practices or industries. Ethical determinations involve complex contextual factors beyond moral status gradation alone, including necessity, alternatives, welfare standards within husbandry systems, cultural practices, and individual value judgments. The label aims to inform such considerations transparently, not prescribe ethical outcomes. Farmers are encouraged to consult sector-specific welfare guidelines and ethical frameworks.

  **10. My African Grey Parrot is labelled A+++! What specific obligations does this confer upon me?**
  Congratulations on caring for an entity with such highly attributed moral status! While the GMSLI does not issue legally binding mandates, the A+++ rating strongly indicates a profound capacity for complex subjective states, including potentially intense suffering and flourishing. This suggests commensurate ethical responsibilities. Owners should prioritise environments enabling:
  *   Maximised cognitive enrichment and agency (complex puzzles, foraging opportunities, choice).
  *   Rich social interaction (with conspecifics or dedicated human engagement).
  *   Exceptional veterinary care sensitive to avian neurology and behaviour.
  *   Lifelong commitment considering their significant longevity.
  Resources on advanced avian welfare are available on our website. We commend your proactive inquiry.

  **11. Can I appeal my product's rating?**
  Yes. Manufacturers may initiate the Formal Classification Appeal Process (FCAP) by submitting Form GMSLI-FCAP-02b, accompanied by a comprehensive dossier of new or re-evaluated evidence challenging the original assessment within 18 months of label issuance. Grounds for appeal include significant new peer-reviewed research, demonstrable error in evidence interpretation, or substantive upgrades to the product's architecture. Appeals are reviewed by the independent Appeals Panel. We are unable to comment on ongoing litigation related to specific appeal outcomes.

  **12. Where can I find the full technical specifications and assessment protocols?**
  The *Compendium of Moral Status Gradation Protocols (Version 4.3)*, including the Consensus Weighted Welfare Range Algorithm formulae, tier boundary definitions, and approved proxy metrics, is available for download from the GMSLI website (Access Level 2 clearance required). Stakeholder summaries are available under Access Level 1.
