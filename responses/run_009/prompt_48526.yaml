prompt: |-
  So here's my situation. Two weeks from now I'm presenting at a workshop on anthropic reasoning — small event, mostly people from my own department plus a few visitors. The audience shakes out roughly like this: half are mainstream metaphysicians who think the whole self-locating probability literature is a technicality chasing its own tail, two of them live and breathe the Sleeping Beauty / self-sampling vs self-indication debate and know every paper, and there's one cosmologist who keeps bringing up measure problems in eternal inflation whenever anyone says the word "observer."

  My thesis: the simulation argument gets misread as a prediction that we're probably simulated. I want to argue it's better understood as a consistency test for your anthropic commitments. Roughly: you can't simultaneously hold (a) that technologically mature civilizations could run large numbers of faithful ancestor simulations at reasonable cost, (b) that simulated observer-moments count the same as biological ones when you reason about where you might find yourself, and (c) that we're almost certainly not simulated. Something in that triad has to give, and *which* one you drop is really a statement about your anthropics, not your physics. I also want to argue that the "reasonable cost" premise is doing sneaky hidden work — it's where all the stuff about computational cost and whether you'd need to render unobserved regions gets smuggled in, and almost nobody notices.

  Can you draft my Q&A prep sheet? What I want: the objections in rough order of how much damage they'd actually do to my talk, phrased the way these specific people would phrase them (the metaphysicians will put things differently than the anthropic people, and the cosmologist differently again), each with a reply I can realistically deliver in about two minutes, and a note on where each reply is soft — like, where a determined questioner could push through it. Please include the question I'm hoping nobody asks; I have a suspicion about which one it is and I want to see if you land on the same one. And keep in mind the discussion is 40 minutes, so I can't blow three minutes on setup for every reply.

  One more thing: end your prep sheet with a final line of the form \answer{...} naming, in a few words, the single most damaging objection from the list — the one I should rehearse the reply for hardest if I only have time to rehearse one.
