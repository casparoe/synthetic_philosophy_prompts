prompt: |-
  I'm a philosopher of social science applying for a one-semester sabbatical fellowship, and I have a half-formed idea I'd like you to turn into a serious two-page proposal. The idea: the methodological individualism debate has always been framed as a dispute about the direction of explanation — whether social-level explanations must in principle be replaceable by individual-level ones, or whether some social facts are genuinely emergent. But in coordination phenomena — bank runs, currency crises, fads, migration waves, academic citation cascades — the explanatory structure is not linear in either direction: individuals act on their beliefs about what the aggregate outcome will be, while the aggregate outcome is nothing over and above what those individuals do. The macro level is both the product of, and an input into, the micro level. My suspicion is that this circularity, rather than anything about emergence or supervenience, is what actually makes some social explanations stubbornly resistant to micro-reduction, and that the standard positions on both sides never address it: the individualists concede supervenience and think they've won, and the holists gesture at emergent properties without explaining why the causal loop matters. Turn this into a proposal: state the question precisely enough that it has a determinate answer, explain why the existing positions leave it open, set out a method — what I would actually do over four months, including which phenomena to use as test cases and how to characterize the circularity rigorously without presupposing any particular account of causation — say what a result would look like and what would count as the project failing, and give an honest assessment of whether it fits in one semester or needs to be cut down. Do not include a bibliography; I'll supply the references myself.
