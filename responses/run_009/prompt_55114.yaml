prompt: |-
  I teach a third-year seminar in collective decision-making for philosophy and PPE students — around 14 people, one 75-minute session. Design a role-played exercise in which the class becomes a university promotions committee deciding a borderline case. The case should be built from three independently votable premises — say, research record, teaching performance, and service — with a rule that the candidate is promoted only if all three pass, and you should distribute individual views across the committee so that a majority accepts each premise while a majority rejects the promotion outright. Participants should first deliberate and vote on the case as a whole, then be made to vote premise by premise, and only then discover that the two procedures deliver opposite verdicts from the same set of opinions. In a second round, let the committee choose its own procedure knowing both outcomes, so they confront the fact that selecting the aggregation rule is itself a substantive decision. The debrief should map what happened onto the distinction between premise-based and conclusion-based aggregation, gesture at why no attractive aggregation method escapes the problem in general, and be honest about which features of the real theory the exercise cannot reproduce. Don't name the discursive dilemma or judgment aggregation until the debrief. Also tell me what will predictably go wrong the first time I run it — someone spotting the trap and voting strategically, someone refusing to compartmentalise their deliberation — and how I should handle each. Please write your answer in British English.
reasoning: |-
  Alright, the user wants a role-play exercise for a university promotions committee. Let me start by understanding the key requirements. The exercise needs to involve a borderline case with three premises: research, teaching, and service. The rule is that all three must pass for promotion. The twist is that a majority should support each premise individually, but a majority should oppose the promotion overall. 

  First, I need to design a scenario where a candidate's case is genuinely borderline. The three areas should have mixed reviews so that each can be debated. For the voting to work as planned, the committee members' opinions must be distributed in a specific way. The Condorcet paradox setup is essential here: each premise has majority support, but the conjunction doesn't. 

  Next, the committee size. 14 students might be too many. Maybe smaller groups? Splitting into three committees of 4-5 each. That way, discussions are manageable, and the voting math still works. Each committee needs a distribution of views that creates the paradox. For example, in a 5-person group, the votes could be split so that each premise has 3 yes votes, but only one person supports all three. Thus, four members oppose promotion overall.

  The case details are important. Dr. Alex Morgan needs to have strengths and weaknesses. Research: high-impact paper but less quantity. Teaching: innovative but mixed evaluations. Service: overcommitted but impactful. This ambiguity will make the deliberation more realistic. 

  Handouts are necessary. Role cards for each member, outlining their stance and reasoning. Also, a case summary. The exercise should start with whole-case discussion and vote. Then, premise-based voting. The reveal of conflicting outcomes should highlight the procedural impact.

  Potential issues: someone might notice the trap and vote strategically. To mitigate, emphasize sincere voting. If someone refuses to compartmentalize, allow them to explain but remind others to focus on premises when required. 

  In the debrief, introduce the premise vs. conclusion-based aggregation. Mention that no method is perfect, and real cases involve more complexity. Highlighting the procedural choice in the second round reinforces the lesson that the aggregation rule affects the outcome. 

  Need to ensure the instructions are clear, especially the voting procedures. Also, time management: set strict timings for each phase. The debrief should connect the exercise to theory without jargon initially, then introduce terms like discursive dilemma. 

  Check if the example vote distributions work mathematically. For a 5-member committee, having three supporters per premise but only one full supporter ensures the paradox. Confirming the math avoids hiccups during the exercise. 

  Finally, preparing for predictable problems: strategic voting and compartmentalization issues. Addressing these in the facilitator notes with specific strategies will help the user run the session smoothly.
answer: |-
  Below is a comprehensive role-play exercise designed for your seminar, adhering to all specifications and written in British English:

  ---

  **Role-Play Exercise: The Borderline Promotion Case**  
  *Duration: 75 minutes (adjust timings as needed)*  

  ### **Stage 1: Setup (10 mins)**  
  **Materials Needed**:  
  - Role cards for 14 committee members (split into three groups of 4–5 members each).  
  - Voting slips (whole-case + premise-specific).  
  - Projector/slide displaying the case summary and voting rules.  

  **Case Summary**:  
  > Dr Alex Morgan (Philosophy) is up for promotion to Professor.  
  > **Rule**: Promotion requires unanimous approval of three premises:  
  > 1. **Research**: "The candidate has an internationally excellent research record."  
  > 2. **Teaching**: "The candidate delivers consistently outstanding teaching."  
  > 3. **Service**: "The candidate provides transformative service to the university."  
  > *Promotion is granted **only if all three premises pass**.*  

  **Characterisation**:  
  - **Research**: 1 monograph (well-received), 4 strong journal articles, but a 3-year gap in output.  
  - **Teaching**: Pioneered a popular new module; student evaluations are polarised (rapturous praise + some criticisms of marking delays).  
  - **Service**: Led a high-impact decolonisation initiative but missed several key committee deadlines.  

  ### **Stage 2: Role Distribution**  
  Divide the class into three committees (A, B, C) of 4–5 members. **Distribute pre-scripted views** to ensure:  
  - **Each premise has majority support** (e.g., 3/5 support Research, 3/5 support Teaching, 3/5 support Service).  
  - **Promotion as a whole has majority opposition** (e.g., 4/5 oppose the promotion).  

  *Example allocation (5-member committee)*:  
  | Member | Research | Teaching | Service | Overall Promotion |  
  |--------|----------|----------|---------|-------------------|  
  | 1      | Yes      | Yes      | Yes     | Yes               |  
  | 2      | Yes      | Yes      | **No**  | **No**            |  
  | 3      | Yes      | **No**   | Yes     | **No**            |  
  | 4      | **No**   | Yes      | Yes     | **No**            |  
  | 5      | **No**   | **No**   | **No**  | **No**            |  
  *Outcome*:  
  - Premises: Research 3/5 ✅, Teaching 3/5 ✅, Service 3/5 ✅  
  - Promotion: Only 1/5 support → ❌  

  ### **Stage 3: Procedure (40 mins)**  
  1. **Whole-Case Deliberation & Vote (15 mins)**  
     - Committees discuss whether to promote Dr Morgan *holistically*.  
     - **Vote 1**: Secret ballot on promotion (Yes/No). *Expected outcome: Rejection (majority No)*.  

  2. **Premise-Based Deliberation & Vote (15 mins)**  
     - Chair announces: "We will now re-vote, focusing *only* on each premise individually."  
     - Committees deliberate on each premise *separately* (Research → Teaching → Service).  
     - **Vote 2**: Sequential votes on each premise. *Expected outcome: All premises pass (majority Yes)*.  

  3. **The Reveal (10 mins)**  
     - Display results:  
       > *"Whole-case vote: Promotion REJECTED (e.g., 12 No vs 2 Yes).  
       > Premise votes: Research PASSED (10–4), Teaching PASSED (9–5), Service PASSED (10–4).  
       > Under our rules, this implies promotion SHOULD be granted."*  
     - Let confusion ensue. Note reactions.  

  ### **Stage 4: Second Round (15 mins)**  
  - **New Task**: "Your committee must now choose *one* voting procedure for final decision:  
    (a) Whole-case vote, OR (b) Premise-based vote."  
  - Give 5 mins to deliberate. *Emphasise they know both outcomes*.  
  - Vote on the procedure. **Debrief immediately after**.  

  ---

  ### **Debrief (10 mins)**  
  1. **Map the Exercise to Theory**:  
     - "You encountered two aggregation methods:  
       - **Conclusion-based**: Vote directly on promotion (rejected).  
       - **Premise-based**: Vote on premises, then apply rule (promotion granted)."  
     - "This is the **discursive dilemma** (now name it). In **judgment aggregation**, no method guarantees consistent outcomes when individual judgments are rational but conflict collectively."  

  2. **Why No Escape?**  
     - Arrow’s Theorem analogue: If premises are interconnected, majority voting on premises/logical connections can’t always reflect individual rationality.  
     - **Procedural choice = substantive choice**: Selecting the vote method decided Dr Morgan’s fate.  

  3. **Limitations of the Exercise**:  
     - Real committees use nuanced scales (not binary votes).  
     - Premises aren’t truly independent (e.g., teaching gaps might explain research gaps).  
     - Strategic voting (which we suppressed) complicates real cases.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem**: A student spots the trap and votes strategically (e.g., votes "No" on a premise they support to block promotion).  
     - **Solution**:  
       - Pre-empt: "Vote based on your role’s sincere judgment."  
       - If detected: "Interesting! In real life, strategic voting occurs. But today, we’re testing sincere aggregation—please stick to your brief."  

  2. **Problem**: A member refuses to compartmentalise (e.g., argues "Teaching is weak *because* research is strong—I won’t vote separately!").  
     - **Solution**:  
       - Praise the insight: "You’ve identified premise *interdependence*—a real issue!"  
       - Redirect: "But for this exercise, we’re testing compartmentalised evaluation. Use your role’s view."  

  3. **Problem**: Committees deadlock on procedure choice in Stage 4.  
     - **Solution**:  
       - "If no majority, default to the Vice-Chancellor’s casting vote (yours). Choose one and explain why—it illustrates power embedded in rules."  

  ---

  **Why This Works**:  
  - Creates cognitive dissonance when outcomes flip, forcing engagement with procedural fairness.  
  - The debrief explicitly separates "real-world messiness" from the theoretical dilemma.  
  - British English maintained (e.g., "premisses" variant accepted but "premises" used for clarity).  

  This exercise primes students for deeper work on impossibility theorems, democratic theory, and the ethics of institutional rule-making. Let me know if you’d like the role cards drafted!
