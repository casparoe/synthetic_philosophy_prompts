  First, I need to channel Dennett’s voice. His later writing was folksy but precise, using analogies like prosthetic eyes or termite colonies. I’ll avoid jargon unless it’s his own (e.g., "competence without comprehension"). The user wants British English, so I’ll use "colour" and "centre," but Dennett’s Americanisms might slip—I’ll prioritise his idioms over strict UK spelling.  

