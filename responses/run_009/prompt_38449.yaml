  We are building a decision tree to classify a reader's intuitive theory of emotion into one of four categories: cognitive, perceptual (bodily), feeling, or constructivist. The tree should have 8-12 questions, each a concrete scenario with answer options that don't require technical vocabulary.

   Key Theories:
   1. Cognitive: Emotions are evaluative judgments (e.g., fear is the judgment that something is dangerous).
   2. Perceptual/Bodily: Emotions are perceptions of bodily changes (e.g., James-Lange) or perceptions of the world as having certain properties (e.g., fear is seeing something as fearsome).
   3. Feeling: Emotions are raw, non-cognitive feelings (qualia) that are not inherently about anything.
   4. Constructivist: Emotions are constructed from basic ingredients (like core affect and conceptual knowledge) and the categories are culturally and contextually dependent.

   We need to design scenarios that force distinctions between these theories.

   Some classic scenarios and their implications:

    A. Bear Scenario (James-Lange): 
        - Seeing a bear leads to running and then feeling fear because of the bodily changes.
        - Cognitive: You see the bear, judge it as dangerous, then feel fear and run.
        - Bodily: You see the bear, run, and then feel fear as the perception of your running.

    B. Actor Scenario (Schachter-Singer): 
        - Given adrenaline without knowing, then placed in a situation. The emotion is labeled based on context.
        - Supports constructivist? or two-factor (cognitive + arousal).

    C. Brain Lesion: 
        - A person with a brain lesion that prevents bodily arousal but can still cognitively appraise. If they report no fear, that supports bodily theories. If they do, cognitive.

   We also need novel scenarios:

    1. Medication that suppresses bodily response (beta-blockers) but leaves cognition intact.
        - After taking the medication, the person faces a typically frightening situation (e.g., public speaking). 
          - If they still feel fear (but without the bodily symptoms), that supports cognitive or constructivist.
          - If they don't feel fear, that supports bodily.

    2. Emotion toward a harmless situation: 
        - E.g., a person knows that spiders in their region are harmless but still feels fear when seeing one.
          - Cognitive: They wouldn't feel fear because they don't judge it as dangerous. So if they do feel fear, it's a problem for pure cognitive.
          - Bodily: Maybe the bodily response is triggered by the spider and then they feel fear? But why the bodily response if they don't judge it as dangerous?
          - Feeling: They just have a feeling of fear when they see the spider, regardless of judgment.
          - Constructivist: The concept of "spider" triggers fear because of past experiences or cultural associations, even if the current appraisal is safe.

    3. Mood shift by blood sugar: 
        - A person becomes irritable because of low blood sugar, even though they know there's no real reason to be upset.
          - Cognitive: They don't appraise anything as offensive, so they shouldn't feel irritable. If they do, it's a problem.
          - Bodily: The bodily state (low sugar) causes the emotion (irritability) without any cognitive trigger.
          - Feeling: They have a raw feeling of irritability without an object.
          - Constructivist: The low sugar creates negative affect, and then the mind might construct an emotion by finding a cause (misattribution).

    4. Novel: A person feels an emotion without being able to identify why (free-floating anxiety).
          - Cognitive: Hard to explain because there is no object of judgment.
          - Bodily: Might be due to a bodily state that is perceived as anxiety.
          - Feeling: The anxiety is just a feeling without any object.
          - Constructivist: The core affect (unpleasant, high arousal) is present and then labeled as anxiety.

    5. Novel: A person experiences an emotion (e.g., anger) when they see a person they know is an actor in a movie playing a villain, even though they know the actor is a nice person in real life.
          - This might test the independence of the emotional response from the cognitive judgment.

    6. Novel: A person who has lost the ability to feel bodily sensations (e.g., due to spinal cord injury) but can still form cognitive appraisals. What happens when they face a dangerous situation?

    7. Novel: A person is told that they will be given a drug that makes them feel happy, but they are actually given a placebo. They then watch a sad movie. If they report feeling sad, that might show that the cognitive appraisal overrides the expectation (cognitive). If they report feeling happy, that might be due to the expectation (constructivist?).

    8. Novel: A person is in a situation that is ambiguous (e.g., a stranger approaches). The person is told that the stranger is friendly. If they still feel fear, that might be due to a bodily reaction or a feeling. If they don't, that might be cognitive.

