  Below is a decision tree designed to identify a reader's intuitive theory of emotion through concrete, relatable scenarios. The tree uses 8 branching questions (with binary options for simplicity) and results in one of four theory classifications: **Cognitive**, **Perceptual (Bodily)**, **Pure Feeling**, or **Constructivist**. Each question avoids technical jargon and focuses on real-world cases where theories diverge. Novel scenarios (marked with ★) are included to force clean splits.  

  ---

  ### **Decision Tree Questions**  
  *Instructions: For each scenario, select the answer that best matches your intuition.*  

  1. **Public Speaking with Beta-Blockers (★)**  
     *You take medication that prevents physical anxiety symptoms (e.g., shaking, racing heart) but doesn’t affect your thoughts. When giving a speech:*  
     - **(A) You still feel nervous/fearful.**  
     - **(B) You feel calm or only mildly uneasy.**  

  2. **Harmless Spider Encounter (★)**  
     *You see a spider you know is harmless (e.g., non-venomous species). Despite this knowledge:*  
     - **(A) You feel a flash of fear or disgust.**  
     - **(B) You feel no fear/disgust—just curiosity or indifference.**  

  3. **Anger During Low Blood Sugar (★)**  
     *You’re irritable from hunger (low blood sugar), but fully aware of the cause. When a friend makes a minor joke at your expense:*  
     - **(A) You feel intense anger anyway.**  
     - **(B) You recognize the hunger and feel little/no anger.**  

  4. **Free-Floating Anxiety**  
     *You wake up with sudden dread for no reason—no thoughts trigger it. Is this:*  
     - **(A) A genuine emotion (e.g., anxiety).**  
     - **(B) Just a mood, not a true emotion.**  

  5. **Actor Playing a Villain**  
     *Watching a movie, you see a kind actor play a cruel villain. During their evil scene:*  
     - **(A) You momentarily dislike the actor.**  
     - **(B) You feel nothing—you know it’s fictional.**  

  6. **Fear After Spinal Injury (★)**  
     *Imagine someone who cannot feel their body (due to injury) but understands danger. In a life-threatening situation:*  
     - **(A) They feel intense fear.**  
     - **(B) They feel no fear—just intellectual concern.**  

  7. **Placebo "Happy Pill" and Sad Film**  
     *You take a fake pill promised to induce happiness, then watch a tragic movie:*  
     - **(A) You feel deeply sad—the movie overrides the pill.**  
     - **(B) You feel happy/unaffected—the pill’s promise distracts you.**  

  8. **Reassured but Jumpy at Night**  
     *Walking alone at night, you hear footsteps but reassure yourself it’s safe. Yet:*  
     - **(A) You still feel a jolt of fear.**  
     - **(B) You feel relaxed—your reasoning calms you.**  

  ---

  ### **Theory Classification Logic**  
  Based on the answer combinations, the tree maps to these theories:  

  | **Theory**              | **Definition**                                                                 | **Path to Leaf**                                                                                               |
  |-------------------------|-------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------|
  | **Cognitive**           | Emotions are judgments about the world (e.g., fear = danger appraisal).      | **Dominantly B answers** in Q2, Q3, Q5, Q8; **A in Q6**. Key: Emotions require conscious evaluation.         |
  | **Perceptual (Bodily)** | Emotions are perceptions of bodily states (e.g., fear = feeling your heart race). | **Dominantly B answers** in Q1, Q6; **A in Q2, Q3, Q4, Q8**. Key: Physical feedback is essential.          |
  | **Pure Feeling**        | Emotions are raw, non-cognitive sensations (e.g., fear = "bad" vibe).        | **Dominantly A answers** in Q1, Q2, Q3, Q4, Q8; **B in Q6**. Key: Emotions need no appraisal or body link. |
  | **Constructivist**      | Emotions are concepts built from context/culture (e.g., fear = learned category). | **A in Q7** or **mixed A/B patterns** with **B in Q6**. Key: Context shapes emotion.                      |

  - **Unresolved Overlaps**:  
    - **Pure Feeling vs. Bodily Perception**: The tree separates them via Q1 (beta-blockers) and Q6 (spinal injury). Pure Feeling requires emotion without bodily input (A in Q1, B in Q6); Bodily requires bodily input (B in Q1, A in Q6). *If both theories align (e.g., A in Q1 and A in Q6), the result defaults to Pure Feeling, as it tolerates bodily links but doesn’t require them.*  
    - **Constructivist Ambiguity**: Classified by Q7 (placebo) or non-aligned answers. Strong Cognitive/Bodily patterns override it.  

  - **Unoccupiable Corners** (200 words):  
    - **"Bodily-Only" (e.g., B in Q1 + B in Q6)**: Suggests emotions require bodies but persist without them—incoherent. No theory holds this.  
    - **"Judgment-Only" (e.g., A in Q6 + B in Q2)**: Claims emotions need judgments but persist without appraisals (e.g., harmless spider). Rare; only marginal hybrid theories (e.g., "embodied cognition") might fit, but they’re unattractive due to internal tension.  
    - **"Non-Constructivist Context-Dependence" (e.g., A in Q7 + strong Cognitive pattern)**: Asserts context shapes emotions without cognitive mediation. Empty; it collapses into Constructivism or Cognitive theories.  
    These corners are unoccupied because they’re either logically inconsistent (body-dependence without bodies) or redundant (context without construction). Only the "Judgment-Only" corner has niche appeal, but it lacks influential defenders.  

  ---

  ### **Design Notes & Caveats**  
  - **Potentially Unfair Questions**:  
    - **Q3 (Low Blood Sugar)**: May stack against Cognitive theories by presenting a visceral, non-appraisal trigger. *Keep it—it cleanly isolates bodily/feeling views.*  
    - **Q6 (Spinal Injury)**: Could disadvantage Bodily theories if readers doubt the thought experiment. *Keep it—it’s a standard philosophical test.*  
  - **Accuracy Trade-offs**: The tree prioritizes clean splits over granularity (e.g., social Constructivism isn’t distinguished). Hybrid theories (e.g., somatic appraisal) may not fit neatly but are noted in "unoccupiable corners."  
  - **Time Estimate**: 3–4 minutes for 8 binary choices.  
  - **Novelty**: 4/8 scenarios are original (★), avoiding overused examples (e.g., James-Lange’s bear).  

  This tree isolates core commitments of each theory through experiential dilemmas, letting readers self-identify before engaging with technical content. For the interactive widget, ensure answer cards are visually distinct to enhance usability.
