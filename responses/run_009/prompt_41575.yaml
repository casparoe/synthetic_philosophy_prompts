  Key points to cover:
  1. PMI's purpose: challenges scientific realism, not to halt science.
  2. Theories can be successful yet incomplete; useful even if not wholly true.
  3. Science builds cumulatively; past theories contribute.
  4. Current theories like atoms/evolution are robust; unlikely to be completely overturned.
