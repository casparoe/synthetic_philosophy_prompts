  Phrasing must pass the "wince test"—functionalists shouldn't balk at implying micro-entities *could* have valence, panpsychists shouldn't feel it precludes fundamental experience.  

  For the disagreements table, I'll frame each side's view in their own terms:  
  - Panpsychists: valence is intrinsic, not dependent on function  
  - Functionalists: suffering requires specific capacities (nociception, learning, etc.)  
  Avoid caricatures—no "rocks feel pain" unless a panpsychist would say it.  

  Cruxes are critical. The user suggested three, but I'll refine:  
  1. **Valence-motivation link**: Can an entity "suffer" if it can't react? Test: decerebrate mammals vs. intact ones in pain studies. Functionalists predict only intact mammals show avoidance; panpsychists expect valence in both.  
  2. **Scale discounting**: Should tiny credences × huge numbers dominate ethics? Test: nematode optogenetics. Functionalists predict suffering scales with complexity; panpsychists expect binary presence/absence.  
  3. **Combination problem**: Does micro-suffering "add up" in aggregates? Test: anesthesia disrupting neural binding. Functionalists predict suffering vanishes; panpsychists say micro-valence persists locally.  

  Verbal vs. real disagreement:  
  - "Suffering" is partly verbal—functionalists mean a functional role, panpsychists mean phenomenal character.  
  - But the core survives: *Is valence separable from function?* That’s substantive.  

