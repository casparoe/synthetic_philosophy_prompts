prompt: |-
  I host a small philosophy-of-history podcast, and next week's guest is a historian who's just written a book arguing that the great famines of the last two centuries -- Ireland in the 1840s, Bengal in 1943, and the Great Leap Forward -- should be understood as political crimes rather than natural disasters. She leans heavily on Sen's entitlement approach and on his well-known claim that you don't get famines in functioning democracies with a free press. Draft eight to ten interview questions that push past the headline thesis. I want at least one question on whether "crime" can survive without intent: the British administration in Ireland was mostly doctrinaire rather than murderous, so does treating laissez-faire negligence as a crime stretch the category until it's meaningless? Another on the Great Leap Forward, where the press was state-controlled and the scale of the disaster was actively concealed -- ask her whether her point there is really about democracy at all, or whether it's that deliberate cover-up alongside continued grain procurement looks more like a crime against humanity than an entitlement failure, something Sen's framework doesn't itself distinguish. And one on the Irish case specifically, since grain and livestock kept leaving the island throughout: does entitlement failure actually do any explanatory work there, or does it just relabel the fact that the people who died lacked the money to buy food that existed? For each of those three, add a follow-up keyed to the answer she's most likely to give. Keep the questions pointed but courteous -- she's a guest, not a defendent.
