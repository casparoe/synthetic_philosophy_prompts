answer: |-
  Here are 10 interview questions (including your 3 requested angles with follow-ups) designed to probe deeper into the historian's thesis, maintaining intellectual rigor while respecting her expertise:

  1.  **Core Thesis Nuance:** "Your book powerfully reframes these famines as political crimes. Beyond the core argument, what's the most significant *conceptual shift* you hope readers undergo? Is it about rethinking state responsibility, the nature of disaster, or perhaps the very definition of 'crime' in this context?" *(Follow-up if she emphasizes responsibility/crime definition):* "Building on that shift, how do you respond to critics who might argue that labeling policy failures like negligence as 'crimes' risks diluting the term, especially when compared to intentional acts like genocide?"

  2.  **Negligence vs. Intent (Ireland Focus):** "You discuss the Irish Famine extensively. The British administration’s adherence to laissez-faire doctrine seems more like catastrophic negligence than premeditated murder. Can negligence *this* severe genuinely constitute a 'political crime' without requiring specific intent to harm? Does stretching 'crime' to cover this potentially weaken its meaning for events with clearer intent?" *(Likely Answer Focus: Emphasizing consequences/duty of care)*. *(Follow-up):* "If we accept negligence of this magnitude as criminal, does that imply a fundamental duty of care states *cannot* abdicate, even under prevailing economic doctrines? How do you define the threshold where policy failure becomes criminal neglect?"

  3.  **Entitlement Failure vs. Extraction (Ireland Specific):** "In Ireland, food exports continued throughout the famine. Sen's entitlement failure explains why the starving couldn't *access* that food. But does his framework adequately capture the specific *political* reality – that colonial policy actively facilitated the *extraction* of food from a starving population? Or does 'entitlement failure' risk becoming a technical euphemism for what was, in essence, state-sanctioned extraction leading to mass death?" *(Likely Answer Focus: Entitlement as mechanism, policy as cause)*. *(Follow-up):* "So, if the *cause* of the entitlement failure was political (export policy, lack of intervention), does focusing primarily on the *mechanism* of failure (entitlement collapse) potentially obscure the active political choices that *engineered* that collapse?"

  4.  **Sen's Democracy Claim & the Great Leap Forward:** "Sen famously links famines to a lack of democracy and free press. The Great Leap Forward seems a stark counterpoint: a catastrophic famine occurring *despite* a highly mobilized (though controlled) populace and state apparatus. Does the GLF suggest your core argument is less about formal democracy/press freedom, and more about the specific *political crime* of systematic concealment and continued resource extraction *despite* evident mass death?" *(Likely Answer Focus: Cover-up/denial as key crime)*. *(Follow-up):* "Following that, does the GLF case show that Sen's framework, while brilliant on *entitlement mechanisms*, might be insufficient for categorizing the distinct *political atrocity* of a state knowingly perpetuating famine through denial and forced procurement? Is there a hierarchy of 'crimes' here?"

  5.  **Beyond Entitlement - Accountability & Power:** "Sen's entitlement approach brilliantly illuminates the *mechanism* of famine. Your work uses it to build a case for *culpability*. What analytical tools beyond Sen are most crucial for making that leap from understanding 'how' famine happens to definitively assigning it as a 'crime'? Is it about tracing decision-making, power structures, or the violation of specific obligations?" *(Forces articulation of methodology beyond Sen)*.

  6.  **Bengal 1943 - War or Crime?:** "The Bengal famine occurred amidst the immense pressures of World War II and Japanese advances. Defenders of British policy often cite these exigencies. How do you disentangle the genuine chaos of war from the specific political decisions (like prioritization, export policies, denial strategies) that your book argues crossed into criminal negligence or worse?" *(Tests application of "crime" in complex context)*.

  7.  **Conceptualizing "Crime":** "You use the potent term 'political crime.' Are you arguing primarily from a *moral* perspective (a profound violation of duty), a *legal* one (implying these acts *should* have been prosecutable under some standard), or a *historical* one (that this framing best captures the essential nature of what happened)? Or is it a combination?" *(Probes the foundation of the "crime" label)*.

  8.  **Applicability & Modern Parallels:** "If we accept this framework, are there contemporary food security crises or near-famines that you see operating under similar dynamics of political culpability, even if not reaching the scale of your case studies? Does this lens change how we view, say, failures in Yemen or Somalia?" *(Tests relevance and modern application)*.

  9.  **Functioning Democracies - A Qualified Shield?:** "Sen claimed functioning democracies with free press don't have famines. Recent democratic history shows severe food crises, even if not full-blown famines (e.g., economic collapses). Does your framework suggest that democracies are merely *better at mitigation*, or does the 'crime' label only apply when state action/inaction *causes or significantly exacerbates* the crisis, regardless of regime type?" *(Refines Sen's claim & links to "crime" concept)*.

  10. **Legacy & Responsibility:** "Finally, reframing these events as crimes inevitably raises questions about legacy and redress. Beyond historical understanding, what are the implications of this reframing? Does it demand different forms of acknowledgment, apology, or even reparations from successor states or entities? Or is the primary value in fundamentally altering our historical consciousness about these events?" *(Concludes on significance and consequences of the thesis)*.

  **Key Tone Elements Incorporated:**
  *   **Courtesy:** Phrases like "Your book powerfully...", "How do you respond to critics who might argue...", "Building on that...", "Following that...", "Finally...".
  *   **Pointedness:** Directly addresses the requested nuances (negligence as crime, GLF concealment, Ireland's exports), uses precise terms ("extraction," "concealment," "procurement," "entitlement failure," "threshold," "euphemism," "atrocity").
  *   **Intellectual Push:** Questions framed as conceptual challenges ("Can negligence *this* severe...?", "does 'entitlement failure' risk becoming...?", "Does the GLF suggest...", "Is there a hierarchy...?"), requests for clarification of terms ("moral," "legal," "historical").
  *   **Follow-up Logic:** Follow-ups anticipate likely answers (duty of care, policy causing entitlement failure, cover-up as key crime) and push the reasoning further (threshold definition, obscuring root causes, Sen's framework's insufficiency for atrocity categorization).
  *   **Guest Expertise:** Assumes deep knowledge ("Sen's entitlement approach," "denial strategies," "continued procurement"), focuses on *her* interpretation and argumentation.

  These questions should foster a deep, nuanced, and rigorous discussion that moves well beyond the book's headline thesis while treating the guest with the respect her expertise deserves. Good luck with the interview!
