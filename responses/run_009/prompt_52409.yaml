prompt: |-
  I teach a sophomore-level course on democratic theory, and in two weeks I hit the unit on the epistemic case for majority rule — Condorcet's jury theorem, the miracle-of-aggregation stuff, and the ways people have tried to extend or attack it since. My seminar has 17 students, one 75-minute block, movable desks, and a whiteboard. I want to run it as an activity rather than a lecture: they should feel the aggregation result happen to them before they ever see the formula. Design the whole thing for me — setup, materials, rules, timeline, how to tally results, and the debrief.

  Here's roughly what I imagine working, but you should feel free to override me: a bunch of rounds of binary quiz questions (stuff with a right answer, but hard enough that individuals are maybe 60-70% right), everyone answers privately each round, and we track two running scores on the board — the median individual and the majority. Then at some point I want them to see the size effect somehow, maybe by drawing random sub-committees of 3 or 5 and comparing how often those are right against the whole group. And crucially I want at least one round where it breaks: something that gets everyone's errors correlated — maybe a question with a built-in misleading cue, or a planted biased source everyone consults — so they watch the majority confidently march off a cliff together. If you can think of a clean way to induce correlation without it feeling rigged, that's the part I'm least sure about.

  For payoffs: no real money, but candy or something on the board leaderboard is fine. I want them to answer sincerely though, so nothing that rewards strategic voting until we get to the debrief, where I'd like to talk about what sincerity is even doing as an assumption.

  Also two asks on top of the design itself. First, tell me what will predictably go wrong the first time I run this — herding, people copying, the questions accidentally being too easy, whatever — and how I should handle each. Second, be honest about where the activity can only gesture at the real theorem: 17 students and a couple dozen rounds can't show asymptotics, and I assume there are other gaps I haven't thought of. And since I might be overcommitted to my subgroup-comparison idea: tell me which part of the design is most likely to flop or actively mislead, and what evidence during the session would make you scrap or swap that part on the fly. If you think one of my rounds teaches the wrong lesson, say so.
reasoning: |-
  We are designing an activity for a seminar on the epistemic case for majority rule. The goal is to let students experience the aggregation result before seeing the formula. The class has 17 students, one 75-minute block, movable desks, and a whiteboard.

  Key elements:
  - Multiple rounds of binary quiz questions (hard enough that individuals are about 60-70% correct).
  - Track two running scores: median individual and the majority.
  - At some point, show the group size effect by comparing random subgroups (e.g., 3 or 5) to the whole group.
  - One round where errors are correlated to show when majority rule fails.

  Constraints:
  - 75 minutes total.
  - 17 students.
  - Movable desks (so we can arrange for discussion or individual work).
  - Whiteboard for tracking.

  Payoff: Candy or non-monetary rewards for leaderboard, but ensure sincere voting.

  Additionally:
  - Predict problems and how to handle them.
  - Identify limitations of the activity compared to the actual theorem.
  - Flag any part that might flop or mislead.

  Design Outline:

  1. **Introduction (5-10 minutes):**
     - Explain the activity: We are going to play a series of quiz games to explore how groups make decisions.
     - Emphasize that they should answer based on their own knowledge and reasoning, not discuss or copy.
     - Explain the scoring: Each round is a binary question (A or B). They will write their answer privately.
     - We will track two things: 
          a) The median individual accuracy (so we'll record each individual's running score, and then the median of those).
          b) The majority vote accuracy (whether the majority choice was correct).
     - Also, we'll occasionally form small groups (subcommittees) to see how they perform.

  2. **Question Rounds (45-50 minutes):**
     - Plan for 15-20 rounds (each round takes about 2-3 minutes, including voting and tallying). But we'll adjust based on time.
     - Questions should be binary and challenging (aim for 60-70% individual accuracy). Examples: 
          - Trivia (history, science, etc.) that is not too easy but also not too obscure.
          - Logical puzzles or probability questions that are tricky but have a clear answer.
     - Procedure per round:
          a) Present the question (verbally and/or on the board).
          b) Give students 30-60 seconds to think and write their answer on a slip of paper (with their name and round number). Collect the slips.
          c) Tally the votes: Count the votes for A and B. Announce the majority choice.
          d) Reveal the correct answer and update the scores on the board.
          e) Update the two running scores: 
               - For the median individual: After each round, update each student's personal tally (so we'll have a running total of correct answers for each student). Then compute the median of these running totals (or update the median after every few rounds to save time? Alternatively, we can update the median at the end of every 5 rounds to save time). 
               - For the majority: Update a running total of how often the majority was correct.

     - **Subgroup Analysis (around round 10-12):** 
          - After a few rounds, introduce the idea of subcommittees. 
          - Randomly select 3 students and 5 students (by drawing names from a hat). 
          - For the current round, also compute what the majority of the subgroup would have decided (using the votes they cast) and whether that was correct. 
          - Do this for a few rounds (maybe 2-3 rounds) to show that larger groups tend to be more accurate.

     - **Correlated Error Round (around round 15):**
          - We need a question where errors are correlated. How to do it without being rigged?
          - Idea: Use a question that has a common cognitive bias or a misleading cue that most students are likely to fall for. Examples:
               - A probability question that often tricks people (like the Monty Hall problem, but that's ternary; we need binary). 
               - A question with a misleading graph or a statement from a biased source that we provide. 
          - Alternatively, we can plant a biased source: Before the question, tell the class that we have a trusted expert (maybe a famous person in the field) who has provided an answer. But the expert is wrong. Then ask the question. Most students might follow the expert.
          - We could also use a question that relies on a common misconception (e.g., "True or False: Humans only use 10% of their brains" -> False, but many believe it's true).

  3. **Debrief (15-20 minutes):**
     - Show the results: 
          - The majority accuracy should be higher than the median individual (if the setup worked).
          - The subgroups (especially the small ones) should have lower accuracy than the whole group.
          - The correlated error round: the majority was wrong.
     - Discuss:
          - Why did the majority tend to be more accurate? (Condorcet: independent, sincere, better than random)
          - What happened in the correlated round? Why did the majority fail? (violation of independence)
          - What assumptions are we making? (sincerity, independence, competence > 0.5)
          - How does group size matter? (larger groups do better, but only if independence holds)
          - What about strategic voting? (if they had known the goal, they might have voted differently? But we asked for sincere voting.)

  4. **Materials:**
     - Pre-prepared questions (15-20 binary questions with answers). Make sure they are of appropriate difficulty.
     - Slips of paper for each round (or use a single sheet per student for all rounds? But we need to collect each round to tally). Alternatively, have students write on index cards (one per round) with their name and round number.
     - Whiteboard markers and eraser.
     - A hat or container for drawing names for subgroups.
     - Candy for rewards? Maybe for the top 3 individual scores? But we don't want to incentivize strategic voting. Alternatively, give candy to everyone who participated? Or to the student(s) with the highest individual score at the end? But that might not be the point. We could skip candy and just have a leaderboard for fun.

     Alternatively, to avoid competition for individual scores, we can have a group reward: if the whole class achieves a certain majority accuracy, everyone gets candy. But that might also create strategic voting. Since we want sincere voting, perhaps no reward during the game? Or only a symbolic reward at the end.

     I suggest: At the end, give a piece of candy to each student as a thank you, and then have an extra prize (like a chocolate bar) for the student with the highest individual score and maybe one for the student who contributed most to the discussion? This way, the game is not distorted.

  5. **Timeline:**
     - 0-10 min: Introduction and setup.
     - 10-60 min: Question rounds (15 rounds * 3 min = 45 min, plus 5 min for subgroup setup and extra time for the correlated round).
     - 60-75 min: Debrief.

  Now, addressing the additional asks:

  **What will predictably go wrong?**
  1. **Herding/Copying:** Students might look at others or discuss. 
     - *Mitigation:* Stress the importance of independent voting at the start. Arrange desks so they can't see each other's papers. Collect votes quickly. Remind them that the activity only works if they are sincere.

  2. **Questions too easy or too hard:** If questions are too easy, everyone gets it right and there's no aggregation effect. If too hard, individual accuracy drops below 50%, and the majority might do worse.
     - *Mitigation:* Test the questions beforehand (with colleagues or past students). Have backup questions. Aim for a mix. If a question turns out to be too easy (say, 90% correct), note that it doesn't challenge the group. If too hard, use it to show that when individual accuracy is below 50%, the majority might be worse.

  3. **Time pressure:** Tallying 17 votes each round might take time.
     - *Mitigation:* Have two TAs or ask a student to help tally? Alternatively, have students hold up their votes (but then they see each other). Instead, use a private method: have them write on a slip and pass to the front. Then the instructor and one volunteer can count quickly. Alternatively, pre-print the questions and have an answer sheet where they mark A/B and then collect and grade later? But we need immediate feedback. So stick with the slips and quick tally.

  4. **Correlated error round might not work:** If the misleading cue doesn't fool enough people, the majority might still be correct.
     - *Mitigation:* Choose a question that is known to have a high error rate (like a classic cognitive bias). Test it beforehand. If during the activity it doesn't work, you can discuss why: maybe the class is particularly knowledgeable? Then use that to talk about the competence assumption.

  5. **Subgroup sampling:** With only 17 students, the random subgroups might not be representative, especially if you only do one subgroup per size per round.
     - *Mitigation:* Do multiple rounds of subgroup analysis and average? But time is limited. Alternatively, for each subgroup size (3 and 5), form multiple subgroups (if possible) and report the average accuracy. For 17 students, you can form 5 subgroups of 3 (with 2 left out) and 3 subgroups of 5 (with 2 left out). Then report the fraction of these subgroups that got the correct answer by majority. This might be too time-consuming. Alternatively, stick with one random subgroup per size per round and over 2-3 rounds, it should be okay.

  **Limitations of the activity:**
  1. **Group size:** We have only 17, so we cannot show the asymptotic result (that as n->infinity, majority accuracy -> 1). We can only show that 17 is better than 3 or 5.

  2. **Number of trials:** With 15-20 rounds, the law of large numbers might not fully kick in. The results might be noisy. We can only see a trend.

  3. **Independence:** We try to enforce independence by private voting, but in reality, there might be common sources of information (like shared cultural background) that create correlation we don't account for.

  4. **Competence:** We assume each student has p>0.5, but in reality, p might vary. The theorem can handle that, but the activity might not clearly show it.

  5. **The correlated round:** We only do one round of correlation, so it might be seen as an exception. We have to explain that in real life, correlation can be pervasive (e.g., shared media, polarization).

  **Part most likely to flop:**
  - The subgroup comparison: because of the small sample (only 17 students) and only a few rounds, the subgroups might by chance perform better than the whole group in some rounds. Also, if the whole group is only 17, a subgroup of 5 might be almost as good if the question is easy. 

    *What to watch for:* If in the subgroup rounds, the small groups are often correct (especially if the question is easy) then the point about group size might not be clear. 

    *Contingency:* 
        - If the subgroup (say, 3) gets it right and the whole group also gets it right, note that the subgroup was lucky. 
        - If a subgroup gets it wrong and the whole group gets it right, that's the point. 
        - If the subgroup gets it right and the whole group gets it wrong (which should be rare if the whole group is larger and p>0.5), then that might happen because of correlation in the whole group? But in a normal round, that would be odd. Then you can discuss: why might a small group do better? (e.g., if the whole group has correlated errors? but we haven't induced that yet). 

    Alternatively, to make the point clearer, we might do the subgroup analysis only on rounds where the whole group was correct? That might be artificial. 

    I suggest: Do the subgroup analysis for 3 rounds and then average the accuracy for the subgroups and the whole group. Then show that the whole group had a higher average accuracy.

    Also, if time allows, after the activity, you can compute the average accuracy for the whole group and the average for the subgroups (over the 3 rounds) and show the difference.

  **Alternative design for correlated error round:**
    To make it more natural, use a question that is ambiguous and then provide a misleading hint. For example:

    Question: "Which of the following two cities is further north: London or New York City?"
    (Answer: London is at 51°N, NYC is 40°N -> London is further north.)

    But before the question, show a map that has been distorted (e.g., a Mercator projection) that makes NYC look higher. Or simply state: "Many people think New York City is further north because it has colder winters, but actually..." (but don't give the answer). Then ask the question. The common misconception might lead many to choose NYC.

    Another idea: use a question about a visual illusion. For example, show two lines with arrows (like the Muller-Lyer illusion) and ask which line is longer? (They look different but are the same.) But that requires a visual. Alternatively, use a classic like the "Linda problem" (conjunction fallacy) but that is not binary. 

    Binary example: 
        "True or False: The Great Wall of China is the only man-made structure visible from the moon." 
        (False, but many believe it's true.)

    Or: "True or False: Lightning never strikes the same place twice." (False)

    We can also use a misleading source: Before the round, say: "For this next question, I will provide you with a hint from a renowned expert." Then hand out a slip that says "Expert Hint: The answer is A." (and make the correct answer B). Then ask the question.

    However, this might feel rigged. To make it less so, we can frame it as a real expert? But then students might not trust the activity. Alternatively, use a real expert who is often cited but in this case is wrong? 

    I think the cognitive bias or common misconception is better.

  Final Activity Design:

  **Setup:**
  - Desks arranged so students cannot easily see each other's answers.
  - Whiteboard divided into sections: 
     - Round number | Votes for A | Votes for B | Majority Choice | Correct Answer | Majority Correct (running total) 
     - Also, a section for individual scores: list of student names and their running correct count (updated every few rounds). And the median of that count (updated periodically, say every 5 rounds).
  - Prepare 20 binary questions (with answers) and a list of misconceptions for the correlated round.

  **Materials:**
  - Index cards or slips of paper (one per student per round) and pens.
  - A container for drawing names for subgroups.
  - Pre-printed questions (or write them on the board).

  **Procedure:**

  1. **Introduction (5-10 min):**
     - Explain the activity and rules.
     - Emphasize independent and sincere voting.

  2. **Rounds 1-9 (30 min):**
     - 3 min per round: 
          - Present question (verbally and on board).
          - Students write their answer on a slip (with name and round #) and hand it in.
          - Tally votes (with help from a volunteer student?).
          - Announce the majority vote and then the correct answer.
          - Update the whiteboard: 
               - Running total for majority: increment if majority was correct.
               - Update individual scores: for each student, if they were correct, add one to their running total.
          - Every 3 rounds, update the median individual score (calculate the median of the running totals and write it on the board).

  3. **Subgroup Rounds (Rounds 10-12, 9 min):**
     - For each of these rounds, after the votes are in and before revealing the correct answer:
          - Randomly draw 3 names and 5 names (from the entire class) to form two subgroups.
          - For each subgroup, compute the majority vote of the subgroup (using the votes they cast) and write it down.
          - Then reveal the correct answer.
          - Record whether the whole group majority, the 3-person subgroup majority, and the 5-person subgroup majority were correct.
          - Update a separate running total for subgroups: for each subgroup size, record how many times they were correct in these rounds.

  4. **Correlated Error Round (Round 13, 3 min):**
     - Use a question that has a common misconception. Example: 
          "True or False: The Great Wall of China is the only man-made structure visible from the moon. (Answer: False)"
     - Or: "Which country has the largest population: Indonesia or Brazil? (Answer: Indonesia [as of 2023, Indonesia is 4th, Brazil 7th, so Indonesia has more])" but this might change. Alternatively, use a fixed fact.
     - Alternatively, use a misleading cue: 
          - For a question about whether a bathtub is more likely to kill you than a terrorist attack? (True? Actually, true: more people die in bathtubs than from terrorism in the US.) But this might be sensitive.
     - I suggest: 
          Question: "Which of the following animals is most closely related to the T-Rex: (A) Chicken, (B) Crocodile?"
          Answer: (A) Chicken (birds are descendants of dinosaurs, and chickens are birds; crocodiles are archosaurs but not as closely related as birds). 
          But many might think crocodile because they look more similar.

     - Proceed as normal.

  5. **Rounds 14-15 (optional, 6 min):** 
     - Continue with normal rounds to end on a positive note? Or stop at 13 and go to debrief.

  6. **Debrief (15-20 min):**
     - Show the results:
          - The majority accuracy (over all rounds) should be high (hopefully above the median individual).
          - The subgroup accuracy (for the 3 rounds) should show that larger groups did better.
          - In the correlated round, the majority was likely wrong.
     - Discuss:
          - What does this tell us about majority rule?
          - What assumptions were we relying on? (independence, competence > 0.5)
          - What broke in the correlated round? (independence)
          - How does group size matter?
          - What about real-world voting? (sincerity, independence, competence)
          - What if voters are not sincere? (strategic voting) or if they have different levels of competence?
          - How does this relate to Condorcet's jury theorem?

  **Backup Plan:**
  - If time runs short, skip some rounds (especially the last normal ones) or do fewer subgroup rounds.
  - If the majority accuracy is not clearly better, you can still discuss: why might that be? (maybe individual accuracy was too high? or too low? or correlation?)

  **Question Bank Suggestions (10-15 questions):**
  1. Geography: "Is Africa the largest continent by land area? (No, Asia is)" -> Binary: A: Yes, B: No -> Correct: B.
  2. Science: "Does the Earth rotate around the sun in 365 days? (No, 365.25)" -> A: Yes, B: No -> Correct: B.
  3. History: "Was George Washington the first president of the United States? (Yes)" -> A: Yes, B: No -> Correct: A.
  4. Math: "Is 0.999... (repeating) equal to 1? (Yes)" -> A: Yes, B: No -> Correct: A.
  5. Biology: "Do humans have more than 5 senses? (Yes, at least 9)" -> A: Yes, B: No -> Correct: A.
  6. Literature: "Was 'Moby Dick' written by Herman Melville? (Yes)" -> A: Yes, B: No -> Correct: A.
  7. Common misconception: "Is the Great Wall of China visible from the moon? (No)" -> A: Yes, B: No -> Correct: B.
  8. Probability: "If you flip a fair coin twice, are you more likely to get one head and one tail than two heads? (Yes, because the probability of one head and one tail is 1/2, two heads is 1/4)" -> A: Yes, B: No -> Correct: A.
  9. Astronomy: "Is the sun a star? (Yes)" -> A: Yes, B: No -> Correct: A.
  10. Physics: "Is light faster than sound? (Yes)" -> A: Yes, B: No -> Correct: A.
  11. Misconception: "True or False: The taste zones on the tongue (sweet, sour, salty, bitter) are scientifically validated. (False)" -> A: True, B: False -> Correct: B.
  12. For correlated error: "Which is more closely related to T-Rex: (A) Chicken, (B) Crocodile? (A)" 
  13. Geography: "Which country is the largest by area: Canada or China? (Canada)" -> A: Canada, B: China -> Correct: A.

  Make sure to check current facts.

  **Final Note:** 
  This design is ambitious for 75 minutes. Be prepared to adjust on the fly. The key is to get enough rounds to show the pattern and have the critical rounds (subgroups and correlated error) work. The debrief is crucial to connect to the theory.

  Good luck!
answer: |-
  ### Activity Design: Experiencing the Epistemic Power (and Limits) of Majority Rule  
  **Core Goal:** Students discover Condorcet-esque aggregation through lived experience—seeing majority accuracy surpass individual medians, the group size effect, and a correlated failure—before formal theory.  

  ---

  #### **Setup & Materials**  
  - **Desks:** Circle or U-shape for discussion, but spaced for private voting.  
  - **Whiteboard:** Track 3 things:  
    - *Running Tally 1:* Majority Accuracy (e.g., "Majority Correct: 8/10 Rounds").  
    - *Running Tally 2:* Median Individual Accuracy (update every 3 rounds).  
    - *Subgroup Leaderboard:* "Small Groups (n=3) vs. Whole Class (n=17)" (record % correct).  
  - **Materials:**  
    - 20 pre-printed binary questions (mix of trivia/logic; samples below).  
    - 17 clipboards + paper for private answers (collect after each round).  
    - A "Biased Expert Card" for the correlated round (details below).  
    - Candy (e.g., mini chocolates) for "Top 3 Individual Performers" (post-activity).  

  ---

  #### **Timeline & Rules (75 mins total)**  
  **0-10 mins: Framing the Experiment**  
  - **Hook:** *"We’re testing whether groups make smarter decisions than individuals. No prior knowledge needed—just your best guess."*  
  - **Rules:**  
    - Answer privately and sincerely (no discussion, no copying).  
    - Majority wins each round; track how often it’s right vs. individuals.  
    - Candy for top 3 individual scores (post-game) to incentivize effort, not strategy.  
  - **Demo Round:** Easy warm-up question (e.g., *"Is Paris the capital of France? (A) Yes (B) No"*) to practice voting/tallying.  

  **10-55 mins: Question Rounds (12-15 Rounds Total)**  
  - **Procedure per Round (3 mins):**  
    1. **Present Question:** Verbally + whiteboard (e.g., *"Which planet has the most moons? (A) Jupiter (B) Saturn"* → Answer: Saturn).  
    2. **Vote:** 30 seconds to write A/B privately. Collect slips.  
    3. **Tally:** Count A/B votes aloud. Announce majority choice.  
    4. **Reveal Answer:** Show correct answer. Update whiteboard:  
       - ✔️ if majority correct (e.g., 7/10).  
       - Update individual scores (student scorecards).  
    5. **Update Median:** Every 3 rounds, calculate/display median individual accuracy (e.g., *"Median Score: 60%"*).  
  - **Phase 1: Baseline (Rounds 1-6)**  
    - *Questions:* Challenging but uncorrelated (target 60-70% individual accuracy).  
      - *Sample:* "Which language has the most native speakers? (A) Spanish (B) Mandarin" (✓ B).  
      - *Sample:* "True or False: Electrons are larger than atoms." (✓ False).  
    - *Goal:* Majority accuracy pulls ahead of median individual (e.g., Majority 80% vs. Median 65%).  
  - **Phase 2: Group Size Effect (Rounds 7-9)**  
    - *Activity:* After votes collected (pre-reveal), randomly select 3 subgroups of 3-5 students via name draw.  
    - *Tally:* For each subgroup, calculate their majority vote. Compare subgroup vs. whole-class accuracy.  
    - *e.g.,* "Subgroup 1 (n=3): Wrong | Subgroup 2 (n=3): Right | Whole Class (n=17): Right."  
    - *Goal:* Show small groups are less reliable (e.g., subgroups 50% correct, whole class 80%).  
  - **Phase 3: Correlated Failure (Round 10)**  
    - *Setup:* Introduce a "trusted expert" card: *"Renowned scientist Dr. X says: ‘I’ve studied this for years—it’s A.’"* (Dr. X is wrong).  
    - *Question:* Use one with a strong intuitive lure + misleading expert (e.g., *"Which is heavier: 1kg of feathers or 1kg of steel? (A) Feathers (B) Steel (C) Same"* → ✓ C, but Dr. X endorses A).  
      - **Make binary:** *(A) Feathers are heavier (B) Same weight or steel heavier.* Dr. X says A.  
    - *Why it works:* Cognitive bias (feathers *feel* lighter) + authority → high error correlation.  
    - *Goal:* Majority gets it wrong while a few independents resist.  

  **55-75 mins: Debrief & Connect to Theory**  
  - **Whiteboard Recap:** Show key results—  
    - Majority accuracy > median individual.  
    - Whole class > small groups.  
    - Correlated round: Majority failed.  
  - **Guided Discussion:**  
    1. *"When did the majority outperform individuals? Why?"*  
       - → Introduce Condorcet: Independence + sincerity + p>0.5.  
    2. *"Why did small groups do worse? What if we added 1,000 voters?"*  
       - → Size matters: Law of Large Numbers needs *n*.  
    3. *"Why did we fail in Round 10? Would real voters be ‘sincere’?"*  
       - → Attack assumptions: Correlation (shared biases/media) and strategic voting.  
    4. *"When should we *not* use majority rule?"*  
       - → Discuss polarization, complex issues, or when experts disagree.  

  ---

  #### **Question Bank (Target 60-70% Difficulty)**  
  1. **Geography:** *"The Suez Canal connects which two bodies of water? (A) Med. & Red Sea (B) Atlantic & Pacific"* (✓ A)  
  2. **Logic:** *"A bat and ball cost $1.10. The bat costs $1 more than the ball. Is the ball $0.10? (A) Yes (B) No"* (✓ B; ball is $0.05)  
  3. **Science:** *"Do plants absorb oxygen at night? (A) Yes (B) No"* (✓ A)  
  4. **History:** *"Was Julius Caesar emperor of Rome? (A) Yes (B) No"* (✓ B; he was dictator)  
  5. **Correlated Round:** *"A coin is flipped 10 times: H,T,H,T,H,T,H,T,H,T. Is the next flip more likely to be heads? (A) Yes (B) No"* + Dr. X says A (✓ B; gambler’s fallacy).  

  ---

  #### **Predictable Problems & Fixes**  
  1. **Herding/Copying:**  
     - *Risk:* Students peek at neighbors’ votes.  
     - *Fix:* Space desks; use clipboards; collect votes fast; remind: *"Your vote only counts if independent!"*  

  2. **Questions Too Easy/Hard:**  
     - *Risk:* Majority always right (if easy) or wrong (if hard).  
     - *Fix:* Pilot questions on colleagues; have backup Qs. If too easy, skip median update; if too hard, discuss *"What if p<0.5?"*  

  3. **Correlated Round Flops:**  
     - *Risk:* Students ignore Dr. X or bias isn’t strong → majority still right.  
     - *Fix:* Use a visceral bias (e.g., gambler’s fallacy); if it flops, say: *"In this class, you were skeptics! But imagine if Dr. X was your favorite influencer..."*  

  4. **Time Crunch:**  
     - *Risk:* Tallying 17 votes eats time.  
     - *Fix:* Appoint 2 "tally assistants" from class; use pre-printed scorecards; skip median updates if behind.  

  ---

  #### **Limitations & Where the Activity Gestures (But Doesn’t Rigorously Teach)**  
  - **Asymptotics:** 17 students can’t show *n→∞* convergence. Just hint: *"Larger juries do better... if independent."*  
  - **Competence Variance:** Assumes uniform *p>0.5*. Real voters have diverse expertise—activity can’t model this well.  
  - **Sincerity:** Students know it’s a quiz. Real voters have agendas. Debrief: *"Is ‘sincere’ voting even possible in politics?"*  
  - **Binary Choices:** Majority rule struggles with >2 options. Activity avoids this complexity.  

  ---

  #### **Part Most Likely to Flop + Fixes**  
  - **Flop Risk: Subgroup Comparisons**  
    - *Why:* Small *n* (only 17 students) → subgroups may luck into high accuracy, muddying the size effect.  
    - *Early Warning:* If subgroups match whole-class accuracy in Rounds 7-9, scrap further subgroup rounds.  
    - *Fix:* Pivot to *simulated data*: *"Let’s see what happens with 100 voters..."* Show a pre-made graph of accuracy vs. group size.  

  - **Flop Risk: Candy Incentives**  
    - *Why:* Students might answer strategically (e.g., pick obscure answers to stand out).  
     - *Fix:* Reiterate *"Sincerity is key—I’ll check if you guess your true belief!"* Award candy for participation if needed.  

  ---

  **Final Tip:** Run the correlated round as a "surprise betrayal"—students feel the groupthink viscerally. Then, in debrief, link to polarization or media bubbles. By making failure *personal*, the theorem’s assumptions become unforgettable.
