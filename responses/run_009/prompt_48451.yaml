prompt: |-
  I'm in a reading group that just spent two sessions on Lewis's triviality results for indicative conditionals, and I walked away with an argument I wrote down myself that seems to prove way too much, and I can't locate the seam. Here's the chain as I have it. (1) An indicative conditional like "if the die comes up even, it comes up six-or-four" is a proposition: at any possible situation it's either true or false, so it can be embedded — negated, disjoined, and crucially conditioned on. (2) The natural constraint on its probability is that the probability of "if A, B" equals the conditional probability of B given A — this is basically the ratio thesis everyone finds intuitive. (3) Since the conditional is a proposition, the law of total probability applies: P(if A, B) = P(if A, B | B)·P(B) + P(if A, B | ¬B)·P(¬B). (4) Now apply the constraint from (2) to the probabilities you get after conditioning on B — i.e., treat P(·|B) as just another probability function the thesis holds for — and you get P(if A, B | B) = P(B | A&B) = 1. (5) Same move conditioned on ¬B gives P(if A, B | ¬B) = P(B | A&¬B) = 0. (6) So P(if A, B) = P(B). (7) Combine with (2) and P(B|A) = P(B) always, for any A and B whatsoever. Which is obviously false — my credence that the die lands even given it lands six is 1, not 1/6.

  The friend who walked me through this says the moral is just "indicative conditionals aren't true or false at all," full stop, and that Lewis proved it. That feels too fast to me, but I genuinely can't tell whether the problem is a hidden equivocation somewhere in (3)-(5) or whether the argument is valid and something in (1) or (2) has to give. For what it's worth, I really want to keep (2) in some form — the whole reason conditionals seem probabilistic to me is that "I'm 80% sure that if she takes the job she'll move" just sounds like P(move | takes job), and I don't want to be told that's a loose way of talking with no systematic content. But I also don't want to be a person who says ordinary conditionals are neither true nor false, because we argue with them constantly ("you said if it rained you'd come, it rained, you didn't come, so you lied").

  So: which step do you reject, and what does rejecting it actually cost? If the flaw is somewhere in my application of the thesis under conditionalization, I'd like to understand exactly why that application is illegitimate rather than merely inconvenient — what exactly changes between the unconditional and the conditionalized setting that lets me keep (2) in one and not the other. And if instead the right move is biting a bullet on (1) or (2), tell me what the standard escape routes are and price each of them: what do the people who keep truth conditions but restrict the probability constraint have to give up, and what do the people who keep the constraint but deny the conditional is a proposition say about the embedding behavior and about my rain-and-lying example? One more thing: please keep clear about what's actually settled versus what specialists still argue about — I know there's some real disagreement about how bad these results are and what they establish, and I don't want the friend's "Lewis proved conditionals aren't truth-evaluable, case closed" presented as the consensus when I suspect it isn't. Also if I've misstated the argument itself somewhere, say so, since I reconstructed it from memory and might have garbled a step.
reasoning: |-
  Okay, this user is grappling with Lewis's triviality results for indicative conditionals after a reading group discussion. They've reconstructed an argument that leads to an absurd conclusion (P(B|A) always equals P(B)), and they're rightly suspicious. Their core tension is between wanting conditionals to have truth values (to preserve ordinary reasoning like "you lied") and wanting to maintain the intuitive probability constraint (P(if A,B) = P(B|A)).

  Hmm, the user is clearly philosophically sophisticated—they identify the exact pressure points in the argument and explicitly ask for: (1) which step to reject, (2) costs of rejection, (3) specialist disagreements, and (4) clarity on settled vs debated issues. They even anticipate two main escape routes (denying truth-values vs restricting the probability thesis). 

  First I need to verify their reconstruction. Steps (1)-(7) look standard except possibly (3)-(5). The key move is applying the ratio thesis under conditionalization—that's where the trouble starts. Lewis's original proof does hinge on this, but the user might be missing why this application is problematic. They sense an "equivocation" but can't pinpoint it.

  The friend's "full stop" conclusion feels premature to me too. Current consensus is more nuanced—even among non-propositionalists. The rain/lying example shows why truth-values seem indispensable for accountability. But preserving truth-values has costs: either you must abandon the ratio thesis (which guts the probabilistic intuition) or accept limited triviality (Adams's "or-to-if" problems). 

  Specialist landscape: While Lewis/Stalnaker-type triviality is widely accepted, responses diverge. Contextualists like Kaufmann or probabilistic modellers like Kaufmann/Bacon keep truth-conditions but complicate the probability link. Dynamic semanticists (Gillies, Starr) avoid truth-values altogether but handle embeddings differently. The user's "systematic content" worry is valid—dynamic accounts do explain embeddings, just not truth-conditionally.

  On the argument's flaw: Step (4)/(5) are the culprits. Applying P(if A,B | B) = P(B|A,B) assumes that the ratio thesis holds under every supposition, which effectively demands that conditionals express *only* conditional probability—something the triviality proofs show to be impossible. This is where the "equivocation" lives: the conditional probability P(B|A) isn't a stable entity across belief states.

  Escape routes priced:
  - **Deny (1) (non-propositional):** Keep ratio thesis. Cost: Conditionals aren't truth-apt, so "you lied" needs reinterpretation (e.g., as failed commitment). Handles embeddings via dynamic rules. Best for preserving probabilistic intuition.
  - **Restrict (2) (propositional):** Keep truth-values. Cost: Ratio thesis fails under conditionalization. Must accept that P(if A,B) ≠ P(B|A) in complex contexts. Adams's "no truth conditions" variant is leanest; Stalnaker's "local probability" is more systematic but less intuitive.

  User's rain example: Non-propositionalists would say "if it rains I'll come" expresses a conditional intention. "Lying" attaches to the *speaker's commitment* being broken, not to truth-value. Some find this satisfying; others think it stretches "lie" beyond recognition.

  Consensus note: Even Lewis didn't think he'd *settled* the issue—he saw it as a paradox needing resolution. Current debate is vibrant, especially with causal/interventionist approaches (Bacon, Zhang) offering new propositional models that avoid triviality by making conditionals context-sensitive.

  Final thought: The user might resonate with "weakly" non-propositional accounts (like Starr's) that treat conditionals as test-like but still allow truth-evaluation in limited contexts. Or Bacon's relativist approach where P(if A,B) = P(B|A) holds relative to a context.
answer: |-
  You've hit the nail on the head: Lewis's triviality results *do* force a painful choice, and your reconstruction is essentially correct (though Step 4/5 is where the critical, contentious move happens). **The flaw is in applying the ratio thesis (P(if A, B) = P(B|A)) unconditionally *and* also applying it under arbitrary suppositions (like B or ¬B) within the Law of Total Probability (Step 4/5).** This "double application" assumes the conditional's meaning/probability is rigid across all evidential contexts, which the triviality proofs show is impossible if conditionals are propositions. Let's break down the rejection, costs, and current landscape.

  ### Where the Argument Fails & Why
  1.  **Steps (1) and (2) are the Premises:** You accept conditionals are truth-apt propositions (1), and you accept the Ratio Thesis (P(if A, B) = P(B|A)) as a universal constraint (2). These are the starting points.
  2.  **Step (3) is Unobjectionable:** If "if A, B" is a proposition, the Law of Total Probability applies.
  3.  **Steps (4) and (5) are the Problematic Leap:**
      *   You assume that the Ratio Thesis **holds within the *conditional* probability measures** `P(·|B)` and `P(·|¬B)`.
      *   Specifically, you assume: `P(if A, B | B) = P(B | A, B)` (which is 1) and `P(if A, B | ¬B) = P(B | A, ¬B)` (which is 0).
      *   **Why is this illegitimate?** The Ratio Thesis (P(if A, B) = P(B|A)) is a constraint on an agent's *current, unconditional* credence function `P`. Conditioning on `B` or `¬B` fundamentally changes the agent's epistemic state. The new probability function `P(·|B)` represents the agent's beliefs *after learning B*. There is **no guarantee** that the meaning or probability of the conditional "if A, B" remains tied to the *new* conditional probability `P(B|A)` *under this supposition*.
      *   **The Equivocation:** You treat "if A, B" as having a fixed meaning/content (a proposition) whose probability *must* obey the Ratio Thesis relative to *every* possible credence function derived from `P` by conditioning. This demands that `P(if A, B | C) = P(B | A, C)` for *any* proposition `C` consistent with the relevant algebra. Lewis proved that this demand is incompatible with `P(if A, B) = P(B|A)` holding universally for a non-extreme range of probabilities, *if* "if A, B" is a proposition. The conditional probability `P(B|A)` is highly context-sensitive (it changes when you learn `C`), while a proposition's truth conditions are (usually) taken to be fixed. You can't make the probability of a fixed proposition track a constantly shifting conditional probability under *all* suppositions.

  ### The Escape Routes and Their Costs
  You *must* reject either (1) or (2) as universally true. There's no free lunch. Here are the main strategies, their costs, and their handling of your concerns:

  1.  **Reject (1): Indicative Conditionals Aren't Truth-Apt Propositions (Non-Propositionalism)**
      *   **Champions:** Adams, Edgington, Bennett (later work), many dynamic semanticists (Gillies, Starr).
      *   **Core Idea:** "If A, B" doesn't express a proposition with truth conditions. It doesn't describe a state of affairs in the world that is simply true or false independent of our epistemic state. Instead, it primarily expresses a constraint on belief or a speech act.
      *   **Preserves:** The Ratio Thesis (2) as fundamental. `P(if A, B) = P(B|A)` is taken as the *definition* or core feature of the conditional's meaning in terms of rational credence.
      *   **Costs:**
          *   **Embedding:** Non-propositionalists must explain embedding (negation, disjunction, conditioning) without truth conditions. This is complex.
              *   **Negation:** "It's not the case that if A, B" might be understood as "If A, it might be that not-B" or analyzed via incompatible speech acts.
              *   **Disjunction:** "(if A, B) or C" is tricky. Adams proposed it's only assertible if `P(B|A) + P(C) - P(B|A)*P(C|A) > threshold`, but it's controversial.
              *   **Conditioning (Your Step 4/5):** This is where non-propositionalism shines. Since "if A, B" isn't a proposition, the Law of Total Probability (Step 3) *doesn't apply* to it. Steps 4/5 become meaningless. The argument simply doesn't get started. `P(if A, B | B)` isn't defined in the standard way because "if A, B" isn't the kind of thing you condition on in that propositional sense.
          *   **Truth & Falsity / Lying (Rain Example):** This is the biggest cost. Non-propositionalists argue that we don't *literally* assign truth/falsity to conditionals. When we say "You lied; you said if it rains you'd come!", we mean the speaker *violated a commitment* or *misled* the hearer. The assertion of "if A, B" commits the speaker to having a high `P(B|A)`, and if A happens and B doesn't, that commitment was clearly incorrect/misleading, warranting criticism ("You lied!"), but not because a proposition was false. It's more like criticizing a promise that wasn't kept.
      *   **Handles Your Intuition:** Keeps the direct link between "80% sure if job then move" and `P(move | takes job)` as the core semantic contribution.

  2.  **Reject (2) as Universal: Conditionals are Propositions, but the Ratio Thesis is Limited (Restricted Ratio Thesis)**
      *   **Champions:** Stalnaker (with caveats), van Fraassen, McGee, Jeffrey, Douven, some "contextualist" or "intensional" accounts.
      *   **Core Idea:** "If A, B" *does* express a proposition (e.g., the closest A-world is a B-world, or A provides a reason for B), so it has truth conditions and embeds fully. However, `P(if A, B) = P(B|A)` does **not** hold universally. It holds only under specific, usually "open" conditions – when the antecedent is epistemically possible and the agent hasn't *already* ruled out A or presupposed something that conflicts with the conditional probability link under supposition.
      *   **Preserves:** Truth-aptness and standard embedding logic. Easily handles the rain/lying example: the conditional *was* false, so the speaker lied.
      *   **Costs:**
          *   **The Ratio Thesis Intuition:** This is the major cost. Why does "80% sure if job then move" *feel* so much like `P(move | job)` if it's not? Proponents argue the thesis holds in the *core, simple cases* where the conditional is assessed relative to the agent's current knowledge, and A is an open question. It breaks down under complex embeddings (like conditioning on B/¬B) or when A is known/believed false.
          *   **Explaining the Intuition:** They need an explanation for *why* `P(if A, B)` often equals `P(B|A)` in simple cases. Stalnaker suggested that in "non-dogmatic" contexts where A is possible, the probability of the conditional *is* the conditional probability. Others appeal to pragmatic factors or the idea that the conditional's truth conditions are *designed* to make the equation hold when it matters.
          *   **Limited Triviality:** While they avoid the *global* triviality of `P(B|A) = P(B)`, they often face more localized issues. For example, Adams showed that accepting both propositionality and the Ratio Thesis for simple conditionals leads to problems with compounds like "Either (if A, B) or (if C, D)" and the "or-to-if" inference (from "not-A or B" to "if A, B").
          *   **Complexity:** Defining the exact conditions under which the Ratio Thesis holds is difficult and often context-dependent.
      *   **Handles Your Intuition (Partially):** Explains why the ratio feels right in simple cases, but says it's not the whole story. `P(if A, B | B)` is just the probability of the proposition "if A, B" given B, which isn't constrained to be 1 (e.g., learning B might change my view of the connection between A and B).

  3.  **Hybrid/Other Approaches:**
      *   **Three-Valued Logics (e.g., de Finetti):** Conditionals have a third truth value (void/indeterminate) when A is false. `P(if A, B)` is defined as P(B|A). This avoids triviality but struggles with embeddings and the feeling that conditionals *are* sometimes straightforwardly true/false. Cost: Significantly alters standard logic.
      *   **Contextualist/Relativist Propositions:** The proposition expressed by "if A, B" is context-sensitive or assessment-sensitive, allowing `P(if A, B)` to track `P(B|A)` relative to different contexts. Cost: Highly complex semantics, still faces embedding challenges under supposition. (e.g., Bacon, MacFarlane-inspired views).
      *   **Dynamic Semantics:** Treats conditionals as context-updating instructions rather than truth-bearers. Can preserve the Ratio Thesis intuition dynamically. Cost: Radical departure from truth-conditional semantics, embedding handled via complex compositional rules. (e.g., Gillies, Starr).

  ### The Specialist Landscape: Settled vs. Debated
  *   **Settled:** Lewis (and others like Stalnaker initially, Hájek) definitively proved that **you cannot have all three simultaneously:**
      1.  "If A, B" is a proposition (truth-conditional, embeds logically).
      2.  `P(if A, B) = P(B|A)` holds universally for a rationally coherent `P`.
      3.  Conditional probabilities `P(B|A)` can take values other than 0 or 1 across a non-trivial range of propositions.
  *   **Debated:**
      *   **Which assumption(s) to drop?** This is the *core* ongoing debate. There is **no consensus.** Both non-propositionalism and restricted-ratio propositionalism have strong advocates and sophisticated defenses. The "hybrid" space is also active.
      *   **How bad are the costs?** Non-propositionalists argue the embedding challenges are solvable and worth it to save the Ratio Thesis. Propositionalists argue that non-propositionalism makes semantics unacceptably non-compositional and mishandles truth/falsity intuitions.
      *   **Refinements:** Within each camp, there's intense work on refining the accounts (e.g., better non-propositional treatments of embedding, better propositional accounts of when the Ratio Thesis holds).
      *   **Your Friend's Claim ("Lewis proved it, case closed"):** This is **overstated.** Lewis proved that a *specific, attractive combination* of ideas is impossible. He didn't prove which one *must* be given up; that's a matter of philosophical argument based on weighing costs and benefits. Many prominent philosophers reject non-propositionalism.

  ### Recommendation Based on Your Concerns
  You strongly want to keep the Ratio Thesis (2) and are deeply uncomfortable with giving up truth-aptness (1) because of the rain/lying example.

  *   **If the rain/lying example feels non-negotiable (truth/falsity is essential),** you need to explore **Restricted Ratio Propositionalism (Option 2).** Be prepared to accept that `P(if A, B) = P(B|A)` is a useful heuristic or holds only in core cases, not a universal law. Look at Stalnaker (1970), van Fraassen (1976), or more recent defenders like Douven.
  *   **If the direct link between credence in the conditional and conditional probability feels like the non-negotiable core,** and you can stomach reinterpreting "truth" and "lying" for conditionals as being about commitment violation, then **Non-Propositionalism (Option 1)** is your path. Study Adams (1975), Edgington (1995), and dynamic semantics (Gillies 2004, Starr 2014).
  *   **The "hidden equivocation" you suspected is real:** It's treating the Ratio Thesis as a rigid constraint holding under *every* possible conditionalization, which is incompatible with the conditional being a stable proposition. Rejecting Step 4/5 as illegitimate is the key move shared by both main solutions (they just explain *why* it's illegitimate differently).

  Lewis proved the dilemma, not the solution. The choice is yours, based on which cost seems less damaging to the phenomena you care about most. The debate remains very much alive.
