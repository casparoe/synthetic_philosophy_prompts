  ### In-Class Activity: The Unnamed Probability Puzzle

  **Total Time:** 75 minutes  
  **Students:** 16  
  **Goal:** Simulate the Sleeping Beauty problem without naming it, highlight self-locating uncertainty, and contrast with a control run.

  ---

  ### **Setup (5 min)**  
  - **Explain rules:**  
    - A fair coin will be tossed (instructor hides result).  
    - **Control Run (baseline):** Each student is interviewed once.  
    - **Experimental Run:**  
      - **Heads:** Each student interviewed once.  
      - **Tails:** Each student interviewed **twice**.  
    - **Amnesia rule (critical):** "In the experimental run, if the coin is tails, you are interviewed twice. But you *cannot remember* your first interview during the second. Since I can’t erase memories, you must *imagine* you don’t know if this is your first or second interview today. Treat each interview as if it might be your only one."  
  - **Interview task:**  
    - State credence \( p \) (0–1) for heads.  
    - Wager 2 tokens (out of 10 given) at stated \( p \).  
    - Scoring:  
      - If heads: win \( \frac{2}{p} \) tokens (if \( p = 0.5 \), win 4 tokens).  
      - If tails: lose wagered tokens.  
    - *Tokens convert to class points (1 token = 0.1 pt).*  

  ---

  ### **Control Run (15 min)**  
  1. **Coin toss (hidden).**  
  2. **Single interview:**  
     - Students write \( p \) and wager on slips (no names).  
     - Collect slips.  
  3. **Reveal coin outcome.**  
  4. **Calculate scores** and record in ledger.  

  ---

  ### **Experimental Run (25 min)**  
  1. **Coin toss (hidden).**  
  2. **First interview:**  
     - All students write \( p_1 \) and wager. Collect slips.  
  3. **Second interview (regardless of coin!):**  
     - *Crucial reminder:* "If the coin is tails, this is your second interview. But *imagine amnesia*—you don’t know if it’s your first or second. Set \( p_2 \) as if uncertain."  
     - All students write \( p_2 \) and wager. Collect slips.  
  4. **Reveal coin outcome:**  
     - If **heads**: Use *only first-interview* slips.  
     - If **tails**: Use *both* slips.  
  5. **Calculate scores** (only for used slips).  

  ---

  ### **Debrief (30 min)**  
  *(Withhold "Sleeping Beauty" name until end.)*  

  1. **Contrast runs:**  
     - **Control:** Students see one interview per coin toss → \( p \) near 0.5.  
     - **Experimental:**  
       - *Heads:* One interview → \( p \) near 0.5.  
       - *Tails:* Two interviews → Likely lower \( p \) (e.g., 0.25–0.4).  
     - **Key insight:** Dispute isn’t about coin fairness—it’s about *what "this interview" means*.  

  2. **Map to reasoning:**  
     - **Halfer view (control logic):**  
       - "Coin is fair → \( p = 0.5 \). Tails doesn’t change the coin’s probability."  
       - Wagering: Bet 2 tokens at \( p = 0.5 \) (win 4 on heads, lose 2 on tails).  
     - **Thirder view (emergent in experimental):**  
       - "On tails, I’m interviewed twice → more chances to *be in this situation* if tails."  
       - Self-locating question: **"How many times am I having this conversation today?"**  
         - Heads: 1 interview total.  
         - Tails: 2 interviews total.  
       - Probability: \( P(\text{heads}) = \frac{1}{1+2} = \frac{1}{3} \).  
       - Wagering: Bet less on heads (e.g., \( p = 0.33 \) → win 6 tokens on heads, but avoid losses on tails).  

  3. **Reveal the puzzle:**  
     - "This is the **Sleeping Beauty problem**. Halfers (like in control) and thirders (like in experimental tails) clash over self-locating uncertainty—*not* the coin."  

  ---

  ### **Predictable Issues & Mitigation**  
  1. **Amnesia pretense fails in second interview:**  
     - Students *know* it’s the second interview → some set \( p_2 = 0 \) on tails.  
     - **Handle it:**  
       - Pre-activity: Stress, "You *must* simulate amnesia—imagine you’re unsure if this is your first or second interview."  
       - Debrief: Use this to discuss why genuine amnesia is irreplaceable.  

  2. **Confusion about wagering:**  
     - Some may not grasp odds (e.g., bet 2 tokens at \( p = 0.2 \) → win 10 tokens on heads).  
     - **Handle it:** Show quick example before starting.  

  3. **Time pressure:**  
     - Keep interviews to 5 min each. Use countdown timers.  

  ---

  ### **Limitation: The Unreproducible Element**  
  - **Genuine first-person uncertainty cannot be staged:**  
    > "In the real problem, Sleeping Beauty *truly doesn’t know* if it’s Monday or Tuesday on tails. Rules alone can’t make you forget you’re in a second interview. I’m asking you to *imagine* that uncertainty—this is the core of the philosophical puzzle."  

  ---

  **Conclusion:**  
  By contrasting control/experimental runs, students experience how context (interview count) alters credence. The debrief ties their actions to halfer/thirder views and self-locating uncertainty, culminating in the "Aha!" of naming Sleeping Beauty.  

  **Word count:** 795
