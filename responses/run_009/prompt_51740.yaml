              P(heads | U) = P(U | heads) * P(heads) / [ P(U|heads)*P(heads) + P(U|tails)*P(tails) ]
                            = (1/2 * 1/2) / (1/2*1/2 + 1*1/2) = (1/4) / (1/4+1/2) = (1/4)/(3/4)=1/3.

            So they should report p=1/3.

          This yields the thirder position. 

          But note: in this setup, there is a chance they are not paid, which is different from the original problem. In the original, every awakening is interviewed and paid. Here, on heads, half of the interviews are not paid.

          We can explain in the debrief that this is a different setup that leads to the same credence of 1/3.

          And in the control run, we did not have this extra uncertainty.

          Then we can say: 
            In the control run, you were always paid for your interview. In the experimental run, you might not be paid (if heads and your round is not chosen). This extra uncertainty about whether your interview counts changes the credence.

          Then we map to the Sleeping Beauty problem: 
            In Sleeping Beauty, every awakening is counted. But the thirder argues that there are twice as many awakenings on tails, so the probability of heads given an awakening is 1/3. 

          And the halfer says: the coin is fair, so it should be 1/2.

          We can then reveal the name.

          This revised experimental run might be the best we can do.

          We'll go with that.

  Activity design in brief:

    Materials:
      - A fair coin for the instructor (and one more coin for the random selection if needed).
      - Slips of paper for the students.
      - Two boxes for collection (one for round1, one for round2).
      - A ledger for the points.

    Control Run:
      - Toss coin (hidden).
      - Do one round: each student writes their credence p (for heads) on a slip, collects.
      - Reveal the coin and calculate points for each student using the quadratic scoring rule.

    Experimental Run:
      - Toss coin (hidden).
      - Do two rounds:
            Round1: each student writes p on a slip, put in box1.
            Round2: each student writes p on a slip, put in box2.
      - Reveal the initial coin:
            If heads:
                 Toss a fair coin: 
                   if heads: use box1
                   if tails: use box2
            If tails: use both box1 and box2.
      - For each used slip, calculate points based on the coin outcome and the reported p.

    Debrief:
      - Show the average credence in the control run (should be near 0.5) and in the experimental run (should be near 0.5 in the control run, and in the experimental run we expect an average around 0.33? But note: in the experimental run, every used interview has p? We will average all used interviews).

      - In the experimental run on heads, we have one set of interviews (either round1 or round2) and they should have reported p=1/2? But they might have reported 1/3 because they knew the rules.

      - In the experimental run on tails, we have two sets of interviews and we hope they reported p=1/3 in both.

      - We then explain the two positions.

      - Finally, reveal the name: Sleeping Beauty problem.

    What cannot be reproduced: 
        We must plainly say: "In the real problem, Beauty genuinely doesn't know what day it is. We could not make you forget that you are in round 2, so we introduced a random selection of which round to use on heads to create uncertainty. This changed the setup slightly but led to the same credence of 1/3."

    Predictable problems:
        - Students might not understand the scoring rule -> explain it clearly.
        - In the experimental run, they might report p=1/2 in both rounds even though the rules suggest 1/3? We can discuss why.

    Let's hope it fits in 75 minutes.

    Time allocation:
        - Control run: 10 minutes (explain, one round, collect, reveal coin, record points).
        - Experimental run: 20 minutes (explain, two rounds, then reveal coin and which rounds count, then record points).
        - Debrief: 30 minutes.

    Total: 60 minutes, leaving room for delay.

    Note: We are doing two coin tosses in the experimental run (the initial one and then one for selecting the round if heads). We can do the second coin toss only if heads.

  Final design in under 800 words:

    Activity: Philosophy of Probability - Unknown Interview (Sleeping Beauty)

    Control Run (10 min):
      1. Toss a fair coin, hide result.
      2. Each student writes on a slip: their credence p (0≤p≤1) that the coin is heads.
      3. Collect slips.
      4. Reveal coin. For each student, calculate points:
            If heads: points = 10 * [1 - (1-p)^2]
            If tails: points = 10 * [1 - p^2]
         Record in ledger.

    Experimental Run (20 min):
      1. Toss a fair coin, hide result.
      2. Round 1: Each student writes credence p1 on slip, put in Box 1.
      3. Round 2: Each student writes credence p2 on slip, put in Box 2.
      4. Reveal the initial coin:
            - If heads: 
                 Toss a second coin: 
                   Heads -> use Box 1, discard Box 2.
                   Tails -> use Box 2, discard Box 1.
            - If tails: use both boxes.
      5. For every used slip, calculate points as above based on the initial coin outcome.

    Debrief (30 min):
      1. Compare control run: most reported p=0.5? Points averaged 7.5? This is baseline.
      2. Experimental run results:
            - Heads scenario: one set of slips. What was the average p? (Expect near 0.5 or 0.33?)
            - Tails scenario: two sets of slips. What was the average p? (Expect near 0.33 if they understood the rules.)
      3. Explain the two philosophical positions:
            - Halfer: The coin is fair, so p should be 0.5 in every interview.
            - Thirder: Given that an interview is happening, and that on tails there are twice as many interviews, then P(heads | interview) = 1/3.
      4. Map to self-locating uncertainty: 
            In the experimental run, the uncertainty was about whether the interview would be used (on heads) and also about the coin. 
            In the real Sleeping Beauty problem, the uncertainty is about which day it is (on tails) but every interview counts.
      5. Note the limitation: 
            "We could not make you forget the previous interview, so we introduced a random selection on heads to create uncertainty. This led to the same 1/3 probability. In the real problem, the amnesia makes the uncertainty about the day genuine."
      6. Reveal the name: This is the Sleeping Beauty problem.

    What might go wrong:
        - In the experimental run, students might not understand the second coin toss for heads. Explain clearly: "If the first coin is heads, we randomly choose which round to use, so your interview has only a 50% chance of counting."
        - Students might report p=0.5 in the experimental run even though the calculation suggests 1/3. Discuss why: they might be halfers.
        - Time: keep strict pace.

    Total words: ~750.
