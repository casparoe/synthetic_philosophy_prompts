answer: |-
  Here’s a systematic map of objections to deflationism, ranked by severity from potentially fatal to awkward, with analysis of deflationist replies and conditions under which rivals become compelling:

  ---

  ### **I. Fatal Objections (If Unanswered)**
  #### **A. Semantic Paradoxes & Revenge Problems**
  - **Core Problem**: The Liar ("This sentence is false") and strengthened versions ("This sentence is *not true*") exploit deflationism’s reliance on the equivalence schema. Minimalist truth-predicates struggle with self-reference without generating inconsistency.
    - **Revenge Challenge**: Hierarchical solutions (Tarski-style) fragment truth into distinct predicates (True₁, True₂, ...), violating deflationism’s claim that "true" is univocal and non-substantive. Paraconsistent or contextualist fixes add complexity antithetical to deflationary minimalism.
  - **Deflationist Replies**: 
    - *Fixed-point approaches* (Kripke): Truth gaps allow sentences to be neither true nor false.  
    - *Expressive role*: Treat truth as a device for *endorsement*, not a property inviting metaphysical analysis.  
  - **Verdict**:  
    - **Conceded Cost**: Deflationists accept hierarchy/context-dependence as a technical necessity but deny it reintroduces substantivity.  
    - **Fatal If**: Revenge cycles persist *without non-ad-hoc solutions* (e.g., if every proposed fragmenting fix spawns new paradoxes).  
    - **Waved Away?** Only if solutions preserve core deflationist insights (e.g., truth remains disquotational *within* levels).

  #### **B. Coherently Stating Truth-Conditions Holistically**
  - **Core Problem**: Deflationism explains "Snow is white is true iff snow is white" but struggles to state *what it is* for *all* sentences of a language to have truth-conditions without circularity or invoking correspondence.
    - **Objection**: Defining truth for a whole language via infinite conjunctions of T-sentences (e.g., "∀φ: True(φ) ↔ φ") requires a metalanguage, implicitly endorsing a richer notion.
  - **Deflationist Replies**: 
    - *Disquotation as exhaustive*: Truth-conditions *just are* given by T-sentences; no further explanation needed.  
    - *Generality without metaphysics*: Truth enables blind endorsement (e.g., "All F=ma consequences are true"), not ontological grounding.  
  - **Verdict**:  
    - **Conceded Cost**: Admits truth-conditions are "deflated" but denies this is circular.  
    - **Fatal If**: Metalanguage use *inescapably* relies on correspondence (e.g., in explaining reference).  

  ---

  ### **II. Serious but Possibly Survivable Objections**
  #### **A. Normative Role of Truth**
  - **Core Problem**: If truth is merely logical, how can it *normatively govern* belief ("Believe *p* only if *p* is true") or assertion ("Assert only what is true")? Thin concepts lack directive force.
  - **Objection**: Deflationism reduces truth to a "device," but norms require robust properties to *aim at*.
  - **Deflationist Replies**:  
    - *Norms are derivative*: Truth norms reduce to *correctness*: "Assert *p* only if *p*." No metaphysics needed.  
    - *Pragmatic role*: Truth’s normativity arises from communication practices, not metaphysics.  
  - **Verdict**:  
    - **Awkward But Survivable**: If normativity is parasitic on non-truth properties (e.g., justification), deflationism holds.  
    - **Fatal If**: Aiming at truth is irreducible (e.g., false beliefs are defective *because* they fail to correspond).  

  #### **B. Explanatory Inadequacy**
  - **Core Problem**: Truth appears to explain success (e.g., "True theories enable accurate predictions") or reference (e.g., "Cats cause 'cat' to refer"). Deflationism denies truth explains anything.
    - **Objection**: If truth is inert, why does acting on true beliefs typically succeed?  
  - **Deflationist Replies**:  
    - *Explanation redirect*: Success is explained by *worldly facts*, not truth (e.g., "Belief that snow is white succeeds because snow *is* white").  
    - *Reference without truth*: Causal theories of reference explain word-world relations sans substantive truth.  
  - **Verdict**:  
    - **Conceded Cost**: Deflationists grant truth isn’t explanatory but deny this is a flaw.  
    - **Fatal If**: Reference/causation *themselves* require substantive truth (e.g., in naturalizing semantics).  

  ---

  ### **III. Awkward But Manageable Objections**
  #### **A. Truth-Aptness & Non-Declaratives**
  - **Problem**: Deflationism assumes all declaratives have truth-values. But what of moral, aesthetic, or mathematical claims?  
  - **Reply**: Deflationism is neutral—apply the schema *if* discourse is truth-apt.  
  - **Verdict**: Awkward for pluralists but not fatal.  

  #### **B. Unfalsifiability via Qualification**
  - **Problem**: If deflationism absorbs all counterarguments via technical fixes (hierarchies, gaps) or redefinition, does it become vacuous?  
  - **Reply**: Conceptual analysis aims for coherence, not empirical falsifiability. Minimalism is its virtue.  
  - **Verdict**: Awkward if revisions become ad hoc, but not fatal if internally consistent.  

  ---

  ### **When to Switch to a Rival Theory**
  Deflationism fails **only if** one or more of these holds:  
  1. **Revenge Paradoxes**: Logicians prove *no* consistent/disquotational truth predicate exists for sufficiently rich languages (e.g., unavoidable revenge in modal/truth-conditional semantics).  
  2. **Indispensable Explanation**: Truth is shown necessary to explain:  
     - Convergence in science (e.g., why theories converge to *truth*, not just empirical adequacy).  
     - Causal relations in perception/cognition (e.g., neural states track *truth-makers*).  
  3. **Normative Grounding**: Aiming at truth is irreducible (e.g., false beliefs are defective *sui generis*).  
  4. **Reference Requires Truth**: A theory of reference *must* appeal to substantive truth (e.g., Fodor’s asymmetric dependence fails without truth-conditional content).  

  **Rivals to Consider**:  
  - **Correspondence Theory**: If truth *must* explain mind-world covariance.  
  - **Pluralism (Lynch, Wright)**: If different domains (e.g., ethics vs. physics) need distinct truth-constitutions.  
  - **Primitivism (Davidson)**: If truth is inexplicable but normatively foundational.  

  ---

  ### **Conclusion**
  Deflationism’s strength lies in parsimony and logical utility. Its fatal flaw would be *inescapable inconsistency* (paradoxes) or *explanatory irreducibility* (truth as causal/normative bedrock). Current technical fixes manage paradoxes at the cost of elegance. Norms and explanations are redirected plausibly but not decisively. **Switch rivals if**:  
  - Paradoxes demand a *substantive* truth property (e.g., truth as grounding logical order).  
  - Cognitive science shows truth as a *causal-normative attractor* in belief-formation.  
  Until then, deflationism remains a defensible, if occasionally awkward, default.
