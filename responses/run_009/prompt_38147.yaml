answer: |-
  Here is a decision tree handout designed for your group, focusing on concrete cases and logical progression while hitting all your key questions. I've structured it to start from shared intuitions, branch through scientifically-relevant distinctions, and expose underlying commitments. The language avoids jargon, and each node uses observable behaviors or traits.  

  ---

  **Moral Status: Where Do We Draw the Line?**  
  *Follow the questions below based on your intuitive responses. Start with what you believe matters.*  

  ### The Decision Tree  
  **1. We all agree it’s wrong to kick a dog for fun. Does this wrongness depend on the dog FEELING pain?**  
  - **YES** (→ Go to 2)  
  - **NO** (→ Go to 8)  

  **2. If an animal DOESN’T feel pain/pleasure (e.g., a jellyfish reflexively avoiding damage), does it still have moral status?**  
  - **YES** (→ Go to 3)  
  - **NO** (→ Position: **Sentience Threshold**. Status requires felt experience. Stop here.)  

  **3. Consider a honeybee rolling a ball for fun (no reward). Does this “play” behavior increase what we owe it?**  
  - **YES** (→ Go to 4)  
  - **NO** (→ Go to 5)  

  **4. Does a nematode (like C. elegans with 302 neurons) deserve SOME consideration—even a tiny bit—because it avoids harm?**  
  - **YES** (→ Go to 6)  
  - **NO** (→ Position: **Complexity Graded Sentience**. Status scales with behavioral flexibility/richness. Stop here.)  

  **5. Plants release warning chemicals when neighbors are damaged. Does this “communication” give them ANY moral claim?**  
  - **YES** (→ Go to 7)  
  - **NO** (→ Position: **Pain-Centric Binary**. Only pain/pleasure matters, and it’s all-or-nothing. Stop here.)  

  **6. Does a bacterial cell (e.g., swimming toward food) deserve INFINITESIMAL moral weight?**  
  - **YES** (→ Position: **Universal Intrinsic Value**. Goal-directedness grants trace status to all living things. Stop here.)  
  - **NO** (→ Position: **Nociception Floor**. Status starts with detectable harm-avoidance (e.g., worms, insects). Stop here.)  

  **7. Is an ant colony MORE morally important than the sum of individual ants?**  
  - **YES** (→ Position: **Holism/Systems View**. Status applies to integrated systems like hives/forests. Stop here.)  
  - **NO** (→ Position: **Individual Biocentrism**. Goal-directedness grants status to individuals only (plants, microbes). Stop here.)  

  **8. Does a thermostat (turning heat on/off to reach a goal) deserve ANY moral consideration?**  
  - **YES** (→ Position: **Functional Minimalism**. Goal-directed systems have trace status. Stop here.)  
  - **NO** (→ Go to 9)  

  **9. Is a beehive morally important BEYOND its individual bees?**  
  - **YES** (→ Position: **Ecocentrism**. Superorganisms/ecosystems have status. Stop here.)  
  - **NO** (→ Position: **Rational Agents Only**. Status requires complex reasoning (e.g., primates, humans). Stop here.)  

  ---

  ### Key Positions Identified  
  - **Sentience Threshold**: Status requires felt pain/pleasure; binary (e.g., mammals yes, insects no).  
  - **Pain-Centric Binary**: Like above, but only pain/pleasure matters (ignores play/communication).  
  - **Complexity Graded Sentience**: Status scales with cognitive/behavioral richness (e.g., elephants > bees > worms).  
  - **Nociception Floor**: Status starts with observable harm-avoidance (worms/insects in, plants out).  
  - **Individual Biocentrism**: Any goal-directed organism has status (plants, microbes in; thermostats out).  
  - **Universal Intrinsic Value**: All living things have trace status (bacteria in; thermostats out).  
  - **Holism/Systems View**: Systems (hives, forests) have irreducible moral status.  
  - **Ecocentrism**: Ecosystems/superorganisms matter most; individuals less so.  
  - **Functional Minimalism**: Any goal-directed system has trace status (thermostats in).  
  - **Rational Agents Only**: Status requires reason/language (e.g., adult humans only).  

  ---

  ### Gaps & Blind Spots  
  1. **Bacteria/Plants vs. Thermostats (Node 8 → "NO" branch)**: If you deny thermostat status but grant it to plants (Node 5), the tree doesn’t distinguish *why*. This gap exists because:  
     - **Incoherent?** No—it’s consistent to value life but not machines.  
     - **Unexplored?** Yes—philosophers debate "life" as a threshold.  

  2. **Graded vs. Binary (Nodes 3–4)**: The tree can’t resolve *how* to compare beings (e.g., 1 elephant vs. 1M bees). Graded views force trade-offs; binary views avoid them.  

  3. **Holism vs. Individualism (Nodes 7, 9)**: If you value systems, the tree doesn’t specify if this *overrides* individual status (e.g., killing bees for hive health).  

  ---

  ### Why This Structure Works  
  - **Concrete Cases**: Uses play (bees), signaling (plants), wiring (nematodes), and thermostats instead of abstractions.  
  - **Logical Flow**: Starts from shared intuition (dogs), tests sentience, then explores goal-directedness and systems.  
  - **Your Angles Covered**:  
    - (1) Felt experience (Nodes 1–2) vs. goal-directedness (Nodes 5–8).  
    - (2) Graded (Nodes 3–4) vs. binary (Nodes 2,5).  
    - (3) Tracks measurable traits (harm-avoidance, play, neuron count in Nodes 4,6).  
    - (4) Floor at nociception (Node 6), life (Node 7), or function (Node 8).  
    - (5) Systems (Nodes 7,9) vs. individuals (Nodes 4–6).  
  - **Accessible**: No jargon; 12 nodes fit on one page.  

  **Handout Tip**: Print the tree (left column) and positions (right column) side-by-side. Encourage your group to debate dead ends—the gaps are where philosophy lives! Let me know if you'd like tweaks for specific test cases.
