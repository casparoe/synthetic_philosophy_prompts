prompt: |-
  Quick background so you know where I'm coming from: I spent 37 years as an entomologist (nematodes mostly, some bee work late in my career), retired two years ago, and have since fallen down the philosophy rabbit hole pretty hard. I help run a monthly discussion group at the local nature center -- mostly other retired scientists and a couple of curious laypeople -- and next month it's my turn to present. I've gotten obsessed with the question of whether moral status comes in degrees, and I want the group to actually figure out what they believe instead of just nodding along to whatever I say about it.

  I'd like you to write me a decision tree handout. You are an expert in ethics and philosophy of mind, someone who thinks really carefully about animal cognition and moral status -- so please actually think this through rather than dashing something off. Maybe brainstorm the logical space first before you commit to a structure, and double check that every branch question could be answered honestly by someone who has never read a page of philosophy.

  The tree should start from a commitment everyone in my group will share -- something like "it matters, morally, how we treat dogs" -- and work its way down to the weird cases I actually care about from my career: insects, nematodes (C. elegans has exactly 302 neurons and we know the wiring diagram, which makes it a great test case), plants that signal to each other, bacteria, and at the very bottom, dumb artifacts like a thermostat or my smart sprinkler controller. Each node should be a question a normal person can answer without knowing where it leads -- concrete cases rather than abstract doctrine ("a bee rolls a ball around for no reward, apparently just for play -- does that change what we owe it?" not "do you affirm phenomenal consciousness in arthropods?").

  Here's the angle I want, and please honor it because it's the whole point: build the tree from the logical space first, not from a list of famous names. The questions that matter to me are roughly: (1) does moral status require felt experience at all, or can mere goal-directedness or valenced function ground some minimal claim; (2) is status all-or-nothing at some threshold, or does it come in quantities that can be traded off (one elephant vs. a million bees -- is that even a sensible comparison, and does a graded view force you to say yes); (3) if it's graded, does the gradient track anything a scientist could measure -- neuron count, behavioral flexibility, nociception, integration of information -- or is it something mushier; (4) where's the floor, and is the floor placed where it is for a principled reason or just because we need to stop somewhere; and (5) does status attach only to individuals, or can it attach to systems -- a hive, a forest -- since I've spent my life on superorganisms and I refuse to let that question get skipped.

  The leaves should be actual positions in the space: the binary threshold view, the graded hierarchy, sentience-only with an epistemic cutoff, the rational-agents-only view, the holist/ecocentric view, and whatever minimal-claim view extends a vanishing sliver of status all the way down to thermostats. If some combinations of node-answers correspond to no real position anybody holds, note that at the bottom of the handout and tell me briefly whether you think the gap is there because the view is incoherent, just unattractive, or merely unexplored. Also flag any pair of leaves the tree genuinely can't seperate -- I'd rather the group know the instrument has blind spots than have you paper over them.

  Two more practical things: keep it to one page worth of decision tree (maybe 10-14 nodes, I don't want people's eyes glazing over), and keep the language at the level of my group -- smart people, zero jargon tolerance for words like "qualia" unless you define them in passing on the handout itself. If you think a question I've suggested above is badly phrased or won't actually discriminate between the positions, fix it and tell me why you changed it. Thanks in advance, take your time and get this right.
