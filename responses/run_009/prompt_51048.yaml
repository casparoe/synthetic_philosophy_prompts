prompt: |-
  I am a second-year PhD student in philosophy, and my supervisor is a committed particularist in the tradition of Jonathan Dancy: she holds that moral reasons are holistic, so that what counts in favour of an act in one case may count against it, or make no difference at all, in another. I have never managed a decisive objection to her, but last term I realised that the standard route to her conclusion, stated as a strict argument, appears to prove a great deal more than either of us is prepared to accept. I would be grateful for a careful diagnosis of it: which step should be rejected, why that step looked acceptable, and what rejecting it costs.

  The argument as I have it:

  (1) For a general claim to be a genuine moral principle, rather than a record of coincidences, it must hold good in every case that falls within its scope: if it says that a feature F counts in favour of an act, that must be so in each case in which F is present and the principle applies.
  (2) For any candidate F, there is a possible case in which F is present, the principle applies, and yet F does not count in favour of the act: that the act would keep a promise does not count in favour of it when the promise was extracted by a threat to torture a third party unless it was given; that it would relieve pain does not count in favour of it when the pain is a punishment the person undergoing it has insisted on completing; that it would give pleasure does not count in favour of it when the pleasure is taken in a rival's humiliation.
  (3) So, by (1) and (2), no general claim of this form is a genuine moral principle.
  (4) Whatever is not a genuine principle can at most be a summary of what has usually happened, and a summary of what has usually happened has no authority over a new case.
  (5) Therefore moral thought is not guided by principles: each case must be judged by discerning, within it, which features matter here.

  My supervisor regards (1) through (5) as a fair statement of her position. What alarms me is that the pattern does not stop at morals. Substitute laws of nature: for any proposed law there is a regime in which its antecedent holds and its consequent fails — Newton's mechanics holds to a point and then gives way near very strong gravitational fields — yet nobody concludes that there are no laws of nature, only case-by-case prophecies. Substitute grammar: the generalisation that attributive adjectives precede their nouns in English fails for a handful of borrowings, yet English grammar is not on that account a record of coincidences. Substitute epistemology: any rule of belief-formation — ceteris paribus, trust the apparently reliable witness — can be defeated by an unnoticed bribe, yet we do not conclude that there are no epistemic principles and that each belief must be formed by discerning, in the situation, what counts in its favour. Run the same five steps in each domain and the argument sweeps away generalisation as such: no laws, no grammar, no canons of evidence. That is more than I am prepared to pay, and I suspect more than my supervisor realises she is committed to.

  I therefore have three questions, in order of importance. First, which step of the argument do you reject — and does the same rejection cover the parallels, or must the moral case be handled differently from the rest? Second, is there a disanalogy that would let the moral case go one way and the others another — moral principles are supposed to guide action, whereas laws of nature merely describe, and it is not obvious that grammar guides at all — and if so, does the disanalogy in the end help the generalist or the particularist? Third, once the faulty step is rejected, what must be put in its place, and at what price? In particular, I want to know whether the generalist who repairs the argument owes us a way of distinguishing a genuine defeasible principle from one that has been gerrymandered into unfalsifiability — a 'principle' that holds except where it doesn't. If she cannot draw that line, I am not sure the repair is worth much.

  Please answer in British English throughout. Take the reasoning in as much detail as the argument requires, but close with a final line in exactly the form \answer{...}, replacing the ellipsis with just the numeral of the single step you reject (if you reject several, the one you regard as the root error).
reasoning: |-
  Hmm, the user is a second-year PhD student in philosophy grappling with their supervisor's particularist view inspired by Jonathan Dancy. They've presented a five-step argument that supposedly proves moral particularism, but they've noticed this same pattern of reasoning would destroy generalization in other domains like physics, grammar and epistemology too. That seems absurd - we clearly do have valid generalizations in those fields. The student wants me to diagnose which step is faulty, explain why it seemed plausible initially, and explore the costs of rejecting it.

  Let me analyze the argument step by step. Premise (1) claims genuine principles must hold universally within their scope - no exceptions allowed. This seems reasonable at first glance; we wouldn't call something a "law" if it kept breaking. Premise (2) gives moral examples where features switch valence (promise-keeping becomes bad when coerced by torture threats). The student cleverly extends this to scientific laws (Newton fails near black holes), grammar (adjective exceptions like "attorney general"), and epistemology (reliable witnesses who've been bribed). Step (3) combines (1) and (2) to conclude no moral principles exist. Then (4) claims non-principles are just summaries without authority, leading to (5): total particularism.

  The problem arises when this reasoning bleeds into other domains. If we accept (1)-(5), we must deny natural laws (because exceptions exist), grammatical rules (because irregularities exist), and epistemic norms (because defeaters exist). But that's clearly unsustainable - scientists don't abandon the concept of physical laws just because relativity modifies Newtonian mechanics. So where's the flaw?

  I suspect step (1) is the culprit with its overly strict definition of "genuine principle." It assumes principles must be exceptionless to be real, but that's not how generalizations work in most fields. Valid principles can be defeasible - holding unless certain conditions override them. The grammar example is perfect: "attributive adjectives precede nouns" remains a rule despite "attorney general" because we understand it as having implicit caveats (like "except for certain loan phrases"). Similarly, Newton's laws weren't false; they were contextually valid within their domain of applicability.

  Why did (1) seem plausible? Probably because particularism borrows from logical necessity - in formal logic, a universal claim is falsified by a single counterexample. But moral principles (and scientific laws, and grammatical rules) aren't logical necessities; they're substantive generalizations that allow for qualification. Rejecting (1) means accepting that principles can have built-in defeasibility conditions.

  The cost? Particularists might argue this makes principles vacuous - if we just add "unless it doesn't apply" clauses, haven't we made them unfalsifiable? The generalist reply is that defeasible principles aren't gerrymandered; their exceptions are systematic (like torture voids promises) and rooted in higher-order principles (like "don't enable coercion"). Drawing that line is tricky but possible - we distinguish genuine defeasibility from ad-hoc excuses by examining whether exceptions form patterns explicable by deeper norms.

  Regarding disanalogies: yes, moral principles guide action while laws describe nature, but this doesn't save the particularist. Guiding principles can still be defeasible - traffic rules ("stop at red lights") have exceptions ("unless an ambulance is behind you"), yet remain valid guides. If anything, the action-guiding nature of morality makes defeasibility more necessary, not less.

  So my verdict is step (1) must go. We replace it with a conception of principles as defeasible generalizations whose authority comes from systematic explanatory power, not exceptionless universality. The price is accepting that moral reasoning involves both principles and judgment about when they apply - but that's far cheaper than denying generalization altogether.
answer: |-
  Your analysis is astute: the argument, if sound, would indeed undermine generalisation across multiple domains. The root error lies in **step (1)**, which imposes an implausibly strict criterion for what constitutes a "genuine principle". Let's unpack this step-by-step, addressing your queries in order.

  ### 1. Diagnosis: Why Step (1) is the Faulty Premise
  **Step (1)** claims that for a generalisation to be a "genuine principle" (rather than a "record of coincidences"), it must hold in *every* case within its scope, with *no exceptions*. This presupposes that principles must be **exceptionless universals** to have normative or explanatory authority.  

  - **Why it seemed plausible**:  
    In moral philosophy, particularly within particularist critiques of "absolute" principles (e.g., rigid Kantian or utilitarian rules), (1) appears compelling because it targets principles that *ignore context*. Dancy-style particularism rightly notes that features like "promise-keeping" can change their moral valence (e.g., become irrelevant or even negative) in aberrant cases (e.g., coerced promises). Step (1) implicitly equates "genuine principle" with *invariant, context-insensitive* necessity—a standard no plausible moral principle could meet.  

  - **Why it fails**:  
    Step (1) conflates **defeasibility** with **accidentality**. A generalisation can be *defeasible* (i.e., hold unless overridden by specific conditions) without being merely coincidental. Defeasible principles:  
    - Have *systematic* exceptions governed by higher-order rules (e.g., "Relieve pain, *unless* it undermines a greater good like just punishment").  
    - Explain patterns while accommodating contextual variation.  
    - Are falsifiable *not* by single counterexamples, but by showing their exceptions are *arbitrary* or *unprincipled*.  

  Your parallels confirm this flaw:  
  - **Laws of nature**: Newtonian mechanics is not "false" or "non-genuine" due to relativistic exceptions; it is a *defeasible approximation* valid within a scope (low gravity, non-relativistic speeds). Its authority derives from systematic predictive power within that domain.  
  - **Grammar**: The rule "attributive adjectives precede nouns" holds *defeasibly*; exceptions like "attorney general" are borrowings governed by historical/linguistic constraints, not random accidents. The rule still guides language acquisition and usage.  
  - **Epistemology**: "Trust reliable witnesses" is a defeasible norm; defeaters (e.g., bribery) are specifiable conditions where the norm *ceases to apply*, not proof that no norm exists.  

  Rejecting (1) thus covers **all parallels**: the argument fails identically in morals, physics, grammar, and epistemology by demanding an unattainable standard of exceptionless universality.  

  ### 2. Disanalogies: Do They Save Particularism?  
  You note potential disanalogies: moral principles "guide action", laws of nature "describe", and grammar's role is ambiguous.  
  - **Action-guidance vs. description**: While moral principles are prescriptive, this does not rescue step (1). Defeasible prescriptive norms exist elsewhere (e.g., legal principles like "keep contracts" have exceptions for duress). Guiding action *requires* accommodating context, which defeasible principles achieve.  
  - **Grammar's normative role**: Grammar guides linguistic practice (e.g., correcting "house red" to "red house"), albeit descriptively. Its defeasibility shows norms can be context-sensitive without collapsing into particularism.  
  - **Outcome**: These disanalogies **harm particularism**. If anything, action-guidance *strengthens* the case for defeasible principles: morality requires adaptable norms, not ad hoc intuition. The burden is on particularists to explain how "discernment" works without implicit principles.  

  ### 3. Repairing Step (1): Costs and Alternatives  
  Replacing step (1) requires accepting that **principles can be defeasible**. The repair:  
  > **(1*)** For a general claim to be a genuine principle, it must hold *defeasibly*: its exceptions must be *systematically explicable* by higher-order conditions (e.g., "F counts in favour, *unless* condition C obtains"), and it must provide non-accidental explanatory/prescriptive power across its domain.  

  **Costs for generalists**:  
  - They must articulate **meta-principles** governing exceptions (e.g., "Coercion voids promissory obligations"). This risks regress but can be halted by a finite set of fundamental norms (e.g., Rossian prima facie duties).  
  - They must **distinguish genuine defeasibility from gerrymandering**:  
    - A defensible principle (e.g., "Relieve pain, except when it is deserved") has exceptions grounded in coherent moral reasons (e.g., desert).  
    - A gerrymandered "principle" (e.g., "Relieve pain, except on Tuesdays") lacks systematic justification.  
    The line is drawn by **explanatory coherence**: genuine defeasibility appeals to deeper features of the domain (e.g., in morals, reasons like fairness or welfare).  

  **Costs for particularists**:  
  - They lose the "no true principles" conclusion. Defeasible principles can handle holism (e.g., "F usually counts in favour, but its valence depends on context").  
  - They must concede that moral discernment relies on *implicit* general patterns, even if unformulated.  

  ### Final Assessment  
  Rejecting step (1) preserves robust generalisation across domains while accommodating holism. The price—defeasibility and meta-principles—is worth paying: it avoids the absurdity of denying all laws, norms, and rules. Generalists *can* distinguish genuine principles from gerrymandered ones via systematic justifications for exceptions. Your supervisor's argument overreaches by ignoring that principles, like tools, are valid within their designed scope.  

