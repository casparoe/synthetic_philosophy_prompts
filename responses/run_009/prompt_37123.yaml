prompt: |-
  I teach an upper-level seminar on institutions and collective choice — 24 students, one 90-minute session, a room with movable desks and a projector. Design an in-class simulation that makes students feel the central bet of futarchy: that a market in predictions about a policy's consequences aggregates what people know, while a vote aggregates what people want — and that these two can come apart in the same room, on the same question, in the same hour.

  The policy at stake should be something the class can actually enact for the rest of the term — a real decision with real consequences for them, such as whether the final exam becomes a take-home or whether weekly reading responses become optional. Run both institutions in the same session: first a straight vote on the policy, then a play-money prediction market on a sharply defined outcome conditional on the policy's adoption, with the live price displayed for all to see while they trade. Assign a handful of secret roles before the session — at least one trader with a large budget and an incentive to move the price rather than to be right, and a few insiders whose private behavioural choices partly determine the outcome the market is pricing — and reveal what these roles were doing only in the debrief.

  Deliverables: the exact policy question and outcome variable (chosen so that the outcome is measurable within the term), rules and materials assuming no real money and nothing more exotic than index cards or a shared spreadsheet, the token economy and what tokens are worth when the market resolves, a minute-by-minute timeline, the text of the secret role cards, and a debrief that maps what happened onto the futarchist claim that citizens should vote on values but bet on beliefs. The debrief should also stage the strongest objection the class will have just lived through — manipulation, self-fulfilling prices, traders whose interests are entangled with the outcome they are pricing — and say what their experience of that objection does and does not show about futarchy at national scale. Finally, be honest about which feature of futarchy no classroom simulation can reproduce however cleverly it is designed, and tell me what will predictably go wrong the first time I run this. Please write the whole thing in British English.
reasoning: |-
  We are designing an in-class simulation for futarchy. The central idea is to separate the vote on values (what we want) from the prediction market on beliefs (what we think will happen). We'll choose a policy that the class can actually enact and an outcome that we can measure within the term.

  Policy question: "Should the seminar replace the final in-class exam with a take-home assignment?"

  Outcome variable: The percentage of students who report that the take-home assignment (if implemented) took them more than 10 hours to complete. We will measure this via a confidential survey at the end of the term.

  We'll run two institutions in one 90-minute session:

  1. Vote: A simple majority vote on the policy.
  2. Prediction market: A play-money market on the outcome conditional on the policy being adopted. The market will predict the probability that the outcome (more than 10 hours) occurs.

  We'll use a token economy with play money. Each student starts with 100 tokens. We'll use a shared Google Sheet for trading (with real-time updating) and display the current market price (probability) on the projector.

  Secret roles:
  - One "Manipulator": Given a large budget (500 tokens) and instructed to try to move the price as high as possible, regardless of their true belief, because they have a side incentive (e.g., they get extra credit if the market price exceeds 70% at any point during trading).
  - Three "Insiders": Each is told privately that they will choose, after the policy is decided, whether to put in extra effort on the take-home assignment. Their choices will affect the outcome. They are told to keep this private and not to reveal their role until the debrief.

  We'll create role cards for these.

  Timeline (90 minutes total):

  0:00 - 0:10 (10 min): Introduction and setup. Explain the policy and the outcome. Hand out role cards to the secret role players (without revealing their identities). Assign each student 100 tokens (on the spreadsheet). Explain the market: they are trading a contract that pays 100 tokens if the outcome (more than 10 hours) occurs, and 0 otherwise. The market price (in tokens) will represent the estimated probability (because the expected value of the contract is probability * 100). So a price of 75 means 75% chance.

  0:10 - 0:15 (5 min): Vote. Secret ballot (using index cards) on the policy. Collect and count the votes. Announce the result but do not implement it yet (we'll decide at the end of the session whether to implement based on the vote).

  0:15 - 0:50 (35 min): Prediction market trading. Open the market (conditional on the policy being adopted). The market runs for 35 minutes. Display the live price (current highest bid, lowest ask, and last trade) on the projector. Students can trade via the shared spreadsheet (we'll set up a simple order book). They can buy and sell contracts. The market resolves at the end of the term when we measure the outcome.

  0:50 - 1:05 (15 min): Debrief part 1: Reveal the vote result and the final market price. Then, reveal the secret roles and ask the manipulator and insiders to share what they did.

  1:05 - 1:25 (20 min): Debrief part 2: Discuss the futarchy concept. Map the experience: the vote captured what the class wanted (e.g., more time flexibility? less stress in class?) while the market captured the aggregated belief about the time burden. Note any divergence.

  1:25 - 1:30 (5 min): Implement the policy decision: If the vote passed, we implement the take-home assignment. If not, we keep the in-class exam. (Note: the market was conditional on adoption, so it only runs if the vote passes. If the vote fails, the market doesn't resolve. But for the simulation, we ran the market conditionally.)

  Token economy:
  - Each student starts with 100 tokens.
  - The contract: A contract pays 100 tokens if the outcome (more than 10 hours) occurs, and 0 otherwise.
  - At the end of the term, we survey the students. If the policy was implemented, we pay out the contracts based on the actual outcome. If the policy wasn't implemented (because the vote failed), then the contracts become void and worthless.

  What tokens are worth: We can make tokens redeemable for small rewards (e.g., 1 token = 0.1% extra credit, capped at 2% extra credit for the term). Or we can keep it as bragging rights. But to make it meaningful, we suggest:
  - Tokens can be exchanged for extra credit: 100 tokens = 1% extra credit, up to a maximum of 2% extra credit (so students can't go above 2% even if they have more than 200 tokens). This gives an incentive to trade seriously.

  Secret role cards:

  Manipulator card (given to one student):
  "You are the Manipulator. You have been given 500 tokens (plus your initial 100, so 600 total). Your goal is to push the market price as high as possible (above 70% if you can). You don't care about being right; you care about the price. Why? Because if the market price exceeds 70% at any point during trading, you will receive an additional 2% extra credit. Trade aggressively to buy contracts and drive up the price. Do not reveal your role until the debrief."

  Insider cards (given to three students):
  "You are an Insider. After the policy decision, you will choose whether to put in extra effort on the take-home assignment. If you choose to put in extra effort, it will take you more than 10 hours. If you choose not to, it will take less. The outcome we are measuring is the percentage of the class that takes more than 10 hours. Your choice will affect that. You are free to choose, but note: if the policy is implemented and you are assigned the take-home, you must actually do the assignment and report honestly in the survey. However, you can decide how much effort to put in (and hence how long it takes). Keep this role secret until the debrief."

  Debrief:

  1. Reveal the vote result and the market's final price. Compare: did the class vote for the take-home? And what did the market predict about the time burden?

  2. Reveal the secret roles. Ask:
     - The manipulator: How did you trade? Did you succeed in moving the price?
     - The insiders: Did you decide to put in extra effort? (They might have been influenced by the market? Or not?) And how did that affect the outcome?

  3. Map to futarchy:
     - The vote was about values: do we prefer the take-home option? (Each student voted based on whether they think a take-home is better for their learning, stress, etc.)
     - The market was about beliefs: if we adopt the take-home, what is the chance that it ends up taking more than 10 hours for the majority? The market aggregated information (including the insiders' private intentions) and also the manipulator's actions.

  4. Discuss the objections they experienced:
     - Manipulation: The manipulator tried to distort the price. Did it work? How? What does that say about real prediction markets? (In real markets, there might be regulations and more participants, making manipulation harder. But it's a risk.)
     - Self-fulfilling prices: The insiders might have been influenced by the market price. For example, if the market said there was a high chance of the assignment taking long, maybe they decided to put in less effort? Or more? (This is a feedback loop that can distort the prediction.)
     - Entangled interests: The manipulator had an incentive to move the price, not to be correct. The insiders' actions directly affected the outcome and they knew it. In real life, traders might have stakes in the outcome (e.g., betting on a policy that affects their industry).

  5. What the simulation does and does not show about futarchy at national scale:
     - It shows how a market can aggregate dispersed information (like the insiders' intentions) and how a vote captures preferences.
     - However, at national scale, markets would be much larger (harder to manipulate) and more liquid. But also, the stakes are higher and the potential for manipulation or perverse incentives is more complex.
     - The simulation cannot capture the full complexity of national policies (which affect millions and have many dimensions). Our outcome was one-dimensional and measurable, but real policies have many outcomes.

  6. Honest limitation: No classroom simulation can reproduce the scale and liquidity of real prediction markets. Also, the outcome we chose (time spent) is only one aspect of the policy. In reality, we care about multiple outcomes (learning, fairness, stress, etc.). Futarchy requires defining measurable outcomes for every policy, which is hard.

  7. Predictable problems the first time:
     - The market might be thin (not enough trading). To mitigate, encourage trading by making tokens worth extra credit and by having a few active traders (like the manipulator).
     - Students might not understand the market mechanism. Spend time explaining and perhaps run a practice round.
     - The outcome might not be perfectly measurable (if students misreport time). We rely on honesty.

  Materials:
  - Index cards for the vote.
  - A shared Google Sheet set up as an order book (with columns: type [buy/sell], price, quantity, trader ID). We'll use a simple continuous double auction. (Alternatively, we could use a simpler setup: the instructor acts as a market maker, updating the price based on buy/sell orders, but that might be less realistic. For simplicity, we can do a market maker.)
    Alternatively, we can use a prediction market platform like Inkling Markets (if available) or a simple spreadsheet with a market maker.

  Given time constraints, we suggest a market maker:

  We set up a spreadsheet with:
  - Current market price (probability in %, so 50 means 50%).
  - Students can submit buy or sell orders for any quantity at the current price. The market maker (the instructor or a TA) will execute at the current price and then adjust the price: for every buy order, the price goes up by 0.5% per contract; for every sell order, it goes down by 0.5% per contract. This is a simple automated market maker.

  Instructions for students:
  - To buy one contract, you pay the current price (in tokens) and get one contract.
  - To sell one contract, you get the current price (in tokens) and give up one contract.
  - The contract pays 100 tokens if the outcome occurs, 0 otherwise.

  The market price is updated after each trade.

  This is easier to run in a classroom.

  Timeline adjustment for market maker:

  0:15 - 0:50: Trading. The instructor (or a designated student) runs the market maker. Students raise their hands to trade. The instructor announces the current price and updates it after each trade.

  We start the market at 50%.

  Example: 
  - Student A wants to buy 2 contracts. Current price is 50. They pay 100 tokens (50*2) and get 2 contracts. Then the price increases by 1% (0.5% per contract) to 51.
  - Student B wants to sell 1 contract. Current price is 51. They get 51 tokens and give up 1 contract. Price decreases by 0.5% to 50.5.

  This is manageable.

  Finally, after the debrief, we implement the policy based on the vote.

  Let me write the entire plan in British English as requested.
answer: |-
  ### **Futarchy Classroom Simulation: Vote Values, Bet Beliefs**  
  **Designed for a 90-minute seminar with 24 students.**  

  ---

  ### **1. Policy Question & Outcome Variable**  
  - **Policy:** "Should the seminar replace the weekly mandatory reading responses with optional responses for the remainder of term?"  
    - *Why this?* Directly impacts workload, trade-offs between flexibility and accountability are tangible.  
  - **Outcome Variable:** "The average grade difference between students who submit optional responses and those who submit none, measured at the term’s end."  
    - *Sharp definition:* If the policy passes, students self-select into two groups:  
      - **Group A:** Submits ≥8 optional responses (of 10 remaining weeks).  
      - **Group B:** Submits ≤2 optional responses.  
    - Outcome = (Avg. final exam score of Group A) – (Avg. final exam score of Group B).  
    - *Measurability:* Instructor calculates after final exam; resolution is objective.  

  ---

  ### **2. Materials & Setup**  
  - **Physical Setup:**  
    - Movable desks arranged in a circle.  
    - Projector displaying a **live Google Sheet** (shared link sent to all).  
    - Index cards for voting + secret role assignments.  
  - **Token Economy:**  
    - **Currency:** "Futarch Pounds" (£F).  
    - **Initial allocation:** £F 100 to each student.  
    - **Trading Asset:** "Workload Impact Certificates" (WICs).  
      - Each WIC pays £F 100 if the outcome is **≥+5%** (i.e., responders outperform non-responders by 5%+ on the final exam).  
      - Pays £F 0 if outcome is **<+5%**.  
    - **Token Redemption:**  
      - £F 1,000 = 1% extra credit on final grade (capped at 3% max bonus).  
      - *Why tradable?* Incentivises engagement with real stakes.  

  ---

  ### **3. Secret Roles**  
  *(Assign via index cards before session; students keep roles hidden.)*  
  - **The Manipulator (1 student):**  
    > **ROLE CARD:**  
    > *"You are a Manipulator. You start with £F 500 (not £F 100). Your goal is to make the market price of WICs rise above 70%, regardless of the true outcome. If the price hits 70% at any point, you earn £F 300 extra. Trade aggressively to inflate the price. Do NOT reveal your role."*  
    - *Purpose:* Tests market vulnerability to distortion.  

  - **Insiders (3 students):**  
    > **ROLE CARD:**  
    > *"You are an Insider. If the policy passes, you must decide privately whether to submit ≥8 responses (boosting Group A’s average) or ≤2 (boosting Group B’s). Your choice affects the outcome. You start with £F 150. Trade based on your planned action, but do NOT reveal your role."*  
    - *Purpose:* Their hidden choices shape the outcome, simulating real-world information asymmetry.  

  ---

  ### **4. Timeline (90 Minutes)**  
  **0:00–0:10 — Introduction (10 mins)**  
  - Explain futarchy: "Votes reveal what we *want*; markets reveal what we *believe*."  
  - Clarify policy ("optional reading responses") and outcome ("exam gap ≥+5%").  
  - Distribute role cards (secretly).  
  - Share Google Sheet link. Display initial WIC price: **50%** (£F 50 per contract).  

  **0:10–0:20 — Vote on Values (10 mins)**  
  - Secret ballot using index cards: "Yes/No to optional responses."  
  - Tally votes publicly. *Do not implement yet.*  

  **0:20–0:55 — Prediction Market (35 mins)**  
  - **Market Rules:**  
    - Trading via Google Sheet. Columns: *Trader ID, Buy/Sell, Quantity, Bid/Ask Price.*  
    - Live "market price" = last traded price (auto-calculated, projected).  
    - Trading is conditional: "This market runs *only if* the policy passes."  
  - **Instructor’s Role:**  
    - Update sheet in real-time; announce large trades.  
    - Enforce: "No collusion, no real money."  
  - **Key Mechanics:**  
    - Students buy/sell WICs; price fluctuates with demand (e.g., if WIC bid at £F 60, market price = 60% probability of ≥+5% gap).  
    - *Example:* Buying a WIC at £F 70 costs £F 70. If outcome ≥+5%, seller pays buyer £F 100.  

  **0:55–1:00 — Market Freeze & Price Revelation (5 mins)**  
  - Stop trading. Display final WIC price (e.g., "68% probability responders outperform by 5%+").  

  **1:00–1:05 — Policy Implementation (5 mins)**  
  - Enact the policy based on the **vote result** (e.g., if "Yes" won, responses now optional).  

  **1:05–1:25 — Debrief (20 mins)**  
  *(Reveal secret roles first.)*  

  ---

  ### **5. Debrief Script**  
  **Step 1: Map the Experiment to Futarchy**  
  - "The vote answered: *Do we value flexibility over accountability?*  
    - If ‘Yes’ won, you prioritised autonomy; if ‘No’, consistency."  
  - "The market answered: *Do we believe optional responses will widen the exam gap by 5%+?*  
    - A 70% price meant traders collectively saw a 70% chance of responders outperforming non-responders."  
  - **Key Insight:** "Votes and prices diverged because they measure different things. You might have voted ‘Yes’ craving flexibility but traded WICs low because you doubt responders will outperform. Futarchy says: *Vote your values, bet your beliefs.*"  

  **Step 2: Stage the Objections**  
  - **Objection 1: Manipulation**  
    - Ask the Manipulator: "How did you inflate the price?" (e.g., bought WICs aggressively).  
    - *Discussion:* "In this small market, one actor distorted prices. But national futarchy uses high-liquidity markets—manipulators risk bankruptcy if wrong. Still, it’s a vulnerability."  
  - **Objection 2: Self-Fulfilling Prices**  
    - Ask Insiders: "Did the WIC price influence your submission plans?" (e.g., "I saw a 70% price, so I’ll skip responses to ‘prove’ the market wrong").  
    - *Discussion:* "Markets can alter behaviour—here, by signalling expectations. National policies face this too (e.g., betting on GDP growth might spur investment)."  
  - **Objection 3: Entangled Interests**  
    - "Insiders traded with secret knowledge; Manipulator didn’t care about truth. Real traders may bet on policies that enrich them."  
    - *Rebuttal:* "Futarchy assumes markets aggregate *all* interests. But transparency (e.g., disclosing positions) can mitigate this."  

  **Step 3: What the Simulation Can’t Capture**  
  - "No classroom can replicate the **scale** and **liquidity** of national prediction markets. Here, 24 traders with £F 100 are easily swayed; real markets have millions of participants with real wealth at stake, making prices more robust."  

  **Step 4: Predictable First-Run Problems**  
  - "Expect **thin trading**: Shy students may not trade. Fix: Assign ‘market maker’ roles next time.  
  - **Spreadsheet chaos**: Use a simpler platform like Manifold Markets if possible.  
  - **Outcome gaming**: Students may submit fake responses. Mitigate by stressing honesty and using exam data."  

  ---

  ### **6. Why This Works**  
  - **Authenticity:** Students live with the policy (e.g., slackers benefit if responses optional; overachievers lose motivation).  
  - **Drama:** Secret roles create tension—Manipulator’s inflation vs. Insiders’ hidden sway.  
  - **Clarity:** Vote/market occur in one sitting, same policy, same outcome. Divergence is visceral.  

  **Final Note:** "Futarchy isn’t foolproof. But today, you felt its core bet—that separating desires from predictions might yield wiser decisions. Next week, we critique whether that’s democratic... or dystopian."  

  ---  
  **Ready to run?** Tailor roles/policy to your cohort. The £F extra credit cap prevents gaming; the rest is up to their collective choice.
