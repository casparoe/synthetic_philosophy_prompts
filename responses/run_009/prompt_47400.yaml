prompt: |-
  At a public lecture on the neuroscience of psychosis, the speaker kept describing perception as 'controlled hallucination', and leaned on the phrase to argue that the voices heard by people with psychosis are not a different kind of mental state from ordinary perception, only ordinary perception with a parameter turned up. I couldn't work out which of the things she might have meant would actually support that. Please set out, as a numbered list, the distinct precise claims the one-liner could be expressing — from the near-platitude that perception is constructive rather than a passive copy of the world, through substantive empirical theses about the brain as a prediction machine that fills in and stabilizes what the senses underdetermine, up to the stronger claim that we never perceive the world itself — and for each reading, say whether it is trivial, defensible but substantive, or false, and whether it would actually carry her conclusion about psychosis.
