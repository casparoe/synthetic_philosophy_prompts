answer: |-
  ## Conclusion

  The museum's labeling practice relies on an **implicit but inconsistent theory of inference** that treats "ritual" primarily as a **residual category** for functionally ambiguous objects, conflating two distinct inferential logics. This approach is **coherent only if we accept its key presupposition** that unexplained non-utility *must* indicate ritual/ceremonial purpose due to universal human ritual behavior. However, it becomes **incoherent in its application** by using the same label for objects inferred from *context* (grave goods) versus *absence of function* (unexplained objects), masking vastly different levels of evidentiary support.

  ## Analysis

  1.  **Presuppositions & Implicit Theory:**
      *   **Human Universality:** It presupposes that "ritual" is a universal human category applicable across time/culture, and that non-utilitarian objects are *likely* ritual.
      *   **Residual Category:** "Ritual" functions primarily as a bin for objects defying *our* functional categorization (tool, vessel, ornament). The inference moves: `No identifiable practical function + Known human ritual behavior → Probable ritual function.`
      *   **Limited Imagination:** The label often describes the *limits of our understanding* and functional vocabulary, not necessarily the object's actual past use. It projects a modern categorical dichotomy (utilitarian vs. sacred) onto the past.
      *   **Best Explanation?** While universal ritual practice *supports* it as *one* plausible hypothesis, applying it as the *default* for *any* unexplained object stretches "best explanation." It risks circularity: "We know they did rituals, so unexplained things must be ritual, proving rituals were common."

  2.  **Coherence & Inconsistency:**
      *   The inference for **grave goods** is coherent: contextual evidence (burial placement) directly suggests symbolic/ritual association. This is inference *from positive evidence*.
      *   The inference for **functionally ambiguous objects** is different and weaker: inference *from absence of evidence* (for utility) combined with a universal generalization. Equating these under one label ("ritual") is inconsistent, masking the evidence gap.

  3.  **Strict Requirements vs. Good Fit:**
      *   **Strictly Requires:** (1) Belief in cross-cultural presence of ritual; (2) Acceptance that objects exist whose primary purpose isn't practical (by our definitions); (3) Willingness to use "ritual" as a default hypothesis *when context is lacking*.
      *   **Fits Well With (But Doesn't Require):** (1) A strict utilitarian/sacred dichotomy; (2) The idea that *all* non-utilitarian objects *must* be ritual; (3) Downplaying the possibility of lost practical uses, games, toys, or symbolic meanings outside "ritual"; (4) Underestimating cultural variation in what constitutes "ritual" or "utility."

  4.  **Adopting a Stricter Standard:**
      If museums openly admitted functional uncertainty, labels would change significantly:
      *   **Replace "Ritual" with Specific Uncertainty:** Use phrases like "Function unknown," "Purpose uncertain," or "Possible ritual object."
      *   **Distinguish Evidence Types:** Specify *why* "ritual" is suggested: "Found in a burial context, suggesting ceremonial use" vs. "No practical function identified; similar objects in other cultures are sometimes associated with rituals."
      *   **Offer Alternatives:** "Possible ritual object, toy, or game," acknowledging other plausible interpretations.
      *   **Highlight Inference Basis:** "Label reflects common scholarly interpretation based on cross-cultural patterns" or "Interpretation based on context of discovery."
      *   **Maintain Plausible Hypothesis:** "Ritual" can remain as *one* suggested possibility ("possibly used in rituals"), but not the *only* or *default* label without stronger evidence.

  This shift prioritizes epistemic humility, clearly separates evidence-based inference from conjecture, and avoids imposing modern categorical binaries onto the past. It treats "ritual" as a specific cultural practice needing evidence, not merely the absence of other functions.
