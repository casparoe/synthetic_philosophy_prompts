  First, I need to carefully delineate the social units involved. The intelligence community as a whole seems more like an epistemic bubble - relevant voices (like UN inspectors) were structurally excluded without active discrediting. Whereas the Pentagon's Office of Special Plans fits the echo chamber pattern: they actively dismissed dissenting technical analyses (e.g. on aluminum tubes) as "biased" or "risk-averse." 

