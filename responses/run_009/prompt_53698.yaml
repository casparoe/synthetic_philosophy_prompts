answer: |-
  ### Decision Tree for Character Positions on Legislative Design

  **Branch 1 (Root):** "Is the real problem that politicians become self-serving experts, disconnected from everyday life?"  
  - *Yes (problem is disconnect):* Go to Branch 2.  
  - *No (problem is elsewhere):* Go to Branch 5.  

  **Branch 2 (for Yes):** "To keep representatives grounded, is it better to limit their time in office or change how they're chosen?"  
  - *Limit time (term limits):* Go to Branch 3.  
  - *Change selection (no elections):* Go to Branch 4.  

  **Branch 3 (for Limit time):** "Should term limits apply even if representatives get better at the job over time?"  
  - *Yes (growth is irrelevant):* **Leaf 4: Elections with hard term limits.**  
  - *No (growth matters):* **Leaf 5: Elections defended as letting expertise accumulate.**  

  **Branch 4 (for Change selection):** "Should we draft ordinary people into one house or the whole legislature?"  
  - *One house (mixed system):* Go to Branch 6.  
  - *Whole legislature (full replacement):* Go to Branch 7.  

  **Branch 5 (for No at Root):** "Is the core flaw that voters are easily misled, or that the system lacks skilled leaders?"  
  - *Voters misled:* **Leaf 3: Sortition as one chamber alongside an elected one.**  
  - *Lacks skilled leaders:* **Leaf 5: Elections defended as letting expertise accumulate.**  

  **Branch 6 (for One house):** "When drafted citizens gain experience, does that make them more valuable or more corrupted?"  
  - *More valuable (experience helps):* **Leaf 3b: Sortition with re-selection by lot (in mixed system).**  
  - *More corrupted (experience harms):* **Leaf 3a: Sortition as one chamber alongside an elected one (with single terms).**  

  **Branch 7 (for Whole legislature):** "After serving, should drafted citizens be permanently barred or remain eligible?"  
  - *Permanently barred (single term):* **Leaf 1: Full sortition with strict single terms.**  
  - *Remain eligible (re-selection):* **Leaf 2: Sortition with re-selection by lot.**  

  ---

  ### Leaves with Dialogue  
  1. **Leaf 1: Full sortition with strict single terms.**  
     *Dialogue:* "One term, then back to their lives—that’s the only way to keep them from becoming what they replaced."  
  2. **Leaf 2: Sortition with re-selection by lot.**  
     *Dialogue:* "If they’re good at the job, why waste that insight? Let the lottery give them another shot—it’s not like they’re campaigning."  
  3. **Leaf 3a: Sortition as one chamber alongside an elected one (with single terms).**  
     *Dialogue:* "One house by draft, one by vote—but the drafted ones must be one-and-done, or they’ll start cozying up to lobbyists."  
  4. **Leaf 3b: Sortition with re-selection by lot (in mixed system).**  
     *Dialogue:* "The lot-chamber needs seasoned voices too; as long as they’re not elected, re-drafting keeps wisdom without ambition."  
  5. **Leaf 4: Elections with hard term limits.**  
     *Dialogue:* "Let them serve, but not long enough to forget who they serve—kick them out before they become part of the machine."  
  6. **Leaf 5: Elections defended as letting expertise accumulate.**  
     *Dialogue:* "You wouldn’t hire a plumber for one pipe and fire him—governing takes practice. Careerists aren’t the problem; amateurs are."  

  ---

  ### Notes on Unoccupied Branches and Inseparable Leaves  
  **Inseparable Leaves (due to overlapping logic):**  
  - **Leaf 3a and Leaf 4:** Both advocate strict term limits (for sortition/elected roles) but differ on selection method. A character could conflate them by arguing "rotation is rotation, regardless of how they’re picked." The tree separates them via Branch 2 (selection vs. time limits), but real-world rhetoric might blur this.  
  - **Leaf 5 appears twice** (from Branch 3 and Branch 5) because it’s reachable via two paths: defending expertise whether the problem is "voter error" or "lack of skills." The dialogue remains identical.  

  **Unoccupied Branches (logical gaps in the tree):**  
  1. **"Permanent staff as inevitable experts":** No leaf argues that power *should* migrate to unelected staff.  
     - *Why unoccupied:* Incoherent for democratic contexts—requires arguing against accountability. Rarely defended openly.  
  2. **"Let sortition members run for elected office immediately":** No leaf endorses this crossover.  
     - *Why unoccupied:* Incoherent—it undermines sortition’s anti-careerist logic. Creates a "backdoor" for professionalization.  
  3. **"Elections without term limits + sortition in one chamber":** The tree forces a choice between term limits (Leaf 4) and expertise (Leaf 5) for elected houses.  
     - *Why unoccupied:* Coherent but niche. Defenders would focus on one chamber’s design, not both.  
  4. **"Full sortition with no term preferences":** Branch 7 forces a single-term/re-selection choice. No middle ground.  
     - *Why unoccupied:* Coherent (e.g., "terms don’t matter if selection is random"), but rarely argued—practical concerns dominate.  

  **Tree Coverage:**  
  - Covers all requested positions (e.g., Leaf 1 = full sortition/single term, Leaf 2 = sortition/re-selection, Leaf 3a/3b = mixed system variants, Leaf 4 = elections/term limits, Leaf 5 = expertise-as-feature).  
  - Weakness: Mixed-system term rules (3a/3b) are split, but a character might not care. Remedy: Use Leaf 3a for "strict rotation" advocates and Leaf 3b for "pragmatic experience" types.  
  - For staff power/career crossover: Add characters who *unintentionally* enable these outcomes (e.g., a bureaucrat whispering, "Let the amateurs rotate—we handle the real work").
