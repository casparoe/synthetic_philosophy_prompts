answer: |-
  Here’s a complete exam package designed to force critical engagement, with a focus on the *relocation of sharpness* and *explanatory power* as the crux. The question, model answer, marking scheme, and dialectic note follow your specifications:

  ---

  ### **(1) Exam Question**  
  **"Both epistemicism and supervaluationism aim to preserve classical logic while accommodating vagueness. However, critics argue that supervaluationism merely *relocates* the sharp boundaries it seeks to avoid, while epistemicism’s commitment to unknowable cutoffs is an unexplanatory bullet to bite. Evaluate these criticisms. Which view better preserves the intuition that vague predicates (e.g., ‘bald’) lack sharp boundaries? Defend your verdict."**

  ---

  ### **(2) Model Answer (≈600 words)**  
  Supervaluationism (SV) and epistemicism both retain classical logic for vague predicates but face distinct criticisms regarding sharp boundaries. SV avoids sharp cutoffs *within* precisifications by allowing multiple admissible ways to sharpen a predicate (e.g., ‘bald’). A sentence is supertrue iff true on all precisifications, superfalse iff false on all, and neither otherwise. This preserves the intuition that "There is a sharp cutoff for baldness" is superfalse, as no single cutoff holds across all precisifications.  

  However, SV relocates sharpness to the *meta-level*. The set of **admissible precisifications** must itself have sharp boundaries to define supertruth. If admissibility is vague, supervaluation collapses into a higher-order vagueness problem. But if admissibility is sharp, then "There is a least number \(n\) such that all admissible precisifications assign ‘bald’ to someone with \(n\) hairs" is **supertrue**—even though each precisification denies it has *that specific* cutoff. Thus, SV technically eliminates *first-order* sharp boundaries but reintroduces them at the level of precisification sets, undermining its core selling point.  

  Epistemicism (E) embraces a sharp but unknowable cutoff. Williamson defends this via **margin-for-error principles**: if you know a man with \(n\) hairs is bald, he must remain bald at \(n+1\) hairs, because you cannot discriminate between \(n\) and \(n+1\). Iterating this, knowledge of the exact cutoff is impossible. Critics call this an ad hoc bullet, but Williamson argues it *explains* vagueness phenomena: the cutoff’s unknowability isn’t a flaw but a **derivable consequence** of our perceptual/cognitive limitations.  

  Crucially, E’s explanatory advantage lies in **grounding ignorance**. SV labels borderline cases as indeterminate but cannot explain *why* we cannot know whether "Balding Bob" is bald—it merely asserts supertruth gaps. E, conversely, derives ignorance from the interplay of sharp boundaries and discrimination failure. When SV claims "There are no sharp cutoffs" is superfalse, it offers no deeper account; E shows why such knowledge is metaphysically impossible.  

  That said, E struggles with the *intuition* of boundarylessness. We feel "No number \(n\) is *the* cutoff" is true, but E insists it is false (there *is* a cutoff). SV captures this intuition superficially (by making the sentence superfalse) but at the cost of relocating sharpness. Ultimately, **epistemicism better preserves the *phenomenology* of vagueness** (ignorance, hesitation) by explaining it, while SV preserves the *semantic intuition* ("no sharp cutoffs") only by camouflaging boundaries in its metalanguage.  

  **Verdict**: Epistemicism better preserves the *absence* of sharp boundaries in practice (by making their detection impossible) and offers a richer explanation of vagueness. SV’s no-boundaries rhetoric is semantically self-undermining.  

  ---

  ### **(3) Marking Scheme (20 points)**  
  **Must-hit points (16/20 for B-range; 20/20 requires A-moves):**  
  1. **SV’s relocation of sharpness (4 pts)**:  
     - B: Notes SV replaces object-level cutoffs with sharp meta-boundaries for admissibility.  
     - A: Explains *why* this undermines SV’s anti-boundary stance (e.g., supertruth of "∃n such that all precisifications agree on a cutoff").  
  2. **E’s margin-for-error reasoning (4 pts)**:  
     - B: Describes margin-for-error as E’s response to ignorance.  
     - A: Argues it turns a "bullet" into an *explanatory virtue* (derives ignorance from discrimination limits).  
  3. **Explanatory power comparison (4 pts)**:  
     - B: States E explains ignorance while SV only labels it.  
     - A: Contrasts E’s *derivation* of ignorance with SV’s *brute* indeterminacy.  
  4. **Boundary intuition clash (4 pts)**:  
     - B: Notes E rejects "no sharp cutoff" intuition; SV preserves it superficially.  
     - A: Analyzes how SV’s preservation relies on relocating sharpness (making it pyrrhic).  
  5. **Verdict with justification (4 pts)**:  
     - B: Picks a side with basic reasoning (e.g., "E explains more").  
     - A: Defends verdict using crux issues (e.g., "E accounts for ignorance; SV’s boundaries are inescapable").  

  **A vs. B differentiation**:  
  - **B (14–16)**: Hits all must-hit points descriptively.  
  - **A (17–20)**: Synthesizes points 1–4 into a dialectical argument (e.g., "SV’s relocated boundaries void its advantage; E’s ignorance is not brute but deduced").  

  ---

  ### **Note for Supervisor: Dialectic Weaknesses & Caveats**  
  The model answer leans epistemicist for pedagogical clarity but has key vulnerabilities:  
  1. **Vague admissibility**: SV defenders (e.g., Keefe) argue admissibility *can* be vague, avoiding sharp meta-boundaries. The model answer assumes crispness, but this is contested.  
  2. **Margin-for-error ≠ epistemicism**: Williamson’s model is dominant but not essential to E. Some epistemicists (e.g., Sorensen) accept brute ignorance, weakening the explanatory claim.  
  3. **Truth-value gaps**: The answer assumes SV uses supertruth gaps, but some variants (e.g., Fine’s) accept non-bivalence, altering the "no sharp cutoff" intuition.  
  4. **Phenomenological costs**: E’s denial of the "no cutoff" intuition *is* counterintuitive—SV might win on preserving pre-theoretic beliefs despite technical relocation.  

  **Why this isn’t stacked**: The question’s phrasing ("relocates sharpness," "unexplanatory bullet") mirrors standard objections but doesn’t presuppose their success. A top supervaluationist answer could:  
  - Argue vague admissibility avoids sharp meta-boundaries.  
  - Claim SV’s "local" boundaries are innocuous (unlike E’s ontological cutoffs).  
  - Challenge whether margin-for-error *truly* explains higher-order vagueness.  

  The crux *forces engagement* with both views’ Achilles’ heels without dictating the outcome.  

  ---  
  This package meets your goals: avoids recitation, centers the hidden-sharpness/margin-for-error crux, rewards dialectical analysis, and acknowledges open debates. Adjust terminology (e.g., "precisification") to match your seminar’s usage. Good luck with your supervisor!
