prompt: |-
  I'm a desk officer at a mid-sized foreign ministry, and every few months a crisis reaches the point where ministers ask whether we should support or join a military intervention, usually on humanitarian grounds and sometimes with regime change quietly attached. I have two days and a small team to produce the options assessment. The lawyers handle legality; what we have nothing for is operationalizing the just war tradition — just cause, last resort, proportionality, right intention, reasonable prospect of success — and the Responsibility to Protect doctrine that everyone cites and nobody applies. Please write a decision procedure we can actually run in two days: the questions to ask in order, what counts as a sufficient answer to each, where the procedure outputs a clear no, and where it stops and hands the decision back to ministers because the remaining question is one of values rather than facts. Flag the steps that look empirical but smuggle in values — I'm especially worried about 'reasonable prospect' and about 'last resort,' which seems to mean whatever the intervener wants it to mean. Then run the procedure on three cases: Kosovo in 1999, Libya in 2011, and Iraq in 2003. I expect it will handle the first two and struggle with the third, and I suspect there's a case it clears that I won't like — construct it if you have to, for instance a mission where the humanitarian case is strong but success depends on exactly the mandate creep that ruined Libya. Finally, tell me what the procedure cannot do: which failures of intervention it is structurally blind to.
reasoning: |-
  Okay, the user is a desk officer at a foreign ministry dealing with crisis situations where military intervention is considered. They need a practical decision procedure based on just war principles and R2P that can be executed in two days. Let me unpack their requirements.

  First, they explicitly want a step-by-step process with clear questions, thresholds for "no" answers, and identification of value-based judgments. They're particularly concerned about "reasonable prospect of success" and "last resort" being misused. The Kosovo, Libya, and Iraq case studies will test the framework's effectiveness. They also anticipate a constructed "trap case" to reveal weaknesses.

  Hmm... the real pain points here are operationalization and time pressure. They're frustrated by doctrines that look good on paper but can't be applied during actual crises. The mention of lawyers handling legality suggests they need something complementary but equally rigorous for ethical/military dimensions. Their skepticism about "last resort" flexibility indicates they've seen it abused before.

  For the framework design, I'll need to:
  - Sequence questions logically (threat assessment before intervention options)
  - Define bright-line "stop" criteria (e.g., no just cause = end assessment)
  - Flag steps where values hide in empirical clothing (like "reasonable prospect")
  - Build in off-ramps to policymakers when value judgments dominate
  - Include time-saving mechanisms like sourcing requirements for each answer

  The case studies should prove the framework's utility: Kosovo as a "clean" yes, Libya showing mandate creep risks, Iraq exposing cherry-picked intelligence. The trap case will demonstrate how strong humanitarian arguments could justify interventions with inherent instability risks - forcing users to confront uncomfortable trade-offs.

  Crucially, I must acknowledge the framework's blind spots: 
  - Long-term institutional collapse (like Libya post-intervention)
  - Moral hazard of encouraging rebellions
  - Coalition fragility risks
  - Unintended escalation pathways

  The constructed case (let's call it "North Magnolia") needs to mirror Libya's pitfalls while meeting all technical criteria for intervention - making the ethical dilemma unavoidable. This will validate their suspicion that some interventions are technically justifiable but strategically unwise.

  Finally, the "what it cannot do" section must be brutally honest - this framework can't predict black swan events or solve political will problems. Its value is in forcing systematic consideration of known failure modes within severe time constraints.
answer: |-
  Here’s a practical **Two-Day Decision Procedure for Military Intervention Assessment**, designed to operationalize Just War principles (JWT) and Responsibility to Protect (R2P) while flagging pitfalls. It outputs unambiguous "NO" recommendations where criteria fail, and identifies steps requiring ministerial judgment.  

  ---

  ### **Decision Procedure: Key Features**  
  1. **Sequential, Binary Gates**: Failure at any step ends the assessment with a "NO" recommendation.  
  2. **Time-Bound Sourcing**: Each question requires pre-identified data sources (e.g., intelligence reports, UN agencies, field networks).  
  3. **Value/Blindness Flags**: Explicitly marks steps vulnerable to bias.  
  4. **Outputs**: Clear "NO," "Conditional YES (ministerial judgment)," or "Proceed to Planning."  

  ---

  ### **The Procedure: Questions & Thresholds**  
  *(Run in order; 4–6 hours per step with team分工分工)*  

  | **Step** | **Question** | **Sufficient Answer** | **"NO" Threshold** | **Value Risk Flag** |
  |----------|--------------|------------------------|---------------------|---------------------|
  | **1. Just Cause** | Is there *ongoing or imminent* large-scale loss of life (R2P Crimes: genocide, war crimes, ethnic cleansing, crimes against humanity)? | Confirmed by ≥2 independent sources (e.g., UNHCR, ICC, credible NGOs + satellite intel). | No pattern of systematic violence; violence is sporadic/criminal. | *None* (Empirical) |
  | **2. Last Resort** | Have all *feasible* non-military options demonstrably failed? | Documented exhaustion of: (a) sanctions, (b) diplomacy, (c) aid/mediation, (d) ICC referrals. Evidence options were tried *recently* (≤6mo). | Viable non-military options exist but were not tried; crisis timeline allows alternatives. | ⚠️ *"Feasible" is value-laden. Requires evidence of failure, not theoretical availability.* |
  | **3. Proportionality (Anticipated)** | Will military action likely cause *less harm* than inaction? | Civilian casualty projections (from military planners) ≤ 50% of status quo projections. No catastrophic infrastructure destruction (e.g., dams, hospitals). | Projected harm ≥ status quo; or risk of WMD release/regional conflagration. | *None* (Empirical, but relies on quality of projections) |
  | **4. Reasonable Prospect of Success** | Is there a ≥70% probability of achieving the *humanitarian objective* (not regime change) within 12 months? | Defined by: (a) achievable military end-state (e.g., "secure aid corridors"), (b) coalition forces ≥3x target’s capabilities, (c) viable exit strategy. | Coalition fragmented; no local allies; terrain favors defender; objective is regime change. | ⚠️ *"Reasonable" is value-laden. Requires quantifiable metrics (capability ratios, historical analogs).* |
  | **5. Right Intent** | Is the *primary* motive humanitarian? | (a) UNSC mandate explicitly cites R2P/R2P crimes; (b) no evidence of resource/strategic motives in intel traffic. | UNSC mandate absent or weak; leaked cables show strategic motives dominate. | *Ministerial judgment* (Intent is inferred, not proven) |
  | **6. Mandate Discipline** | Can the mission avoid mandate creep? | Legal red lines defined (e.g., "no deployment beyond Province X," "no support for faction Y"). Enforcement mechanism (e.g., coalition oversight cell). | No mechanism to veto scope expansion; key coalition members advocate regime change. | *None* (Empirical: Assess mechanisms, not intentions) |

  **Outputs**:  
  - **NO** if Steps 1–4 fail.  
  - **Conditional YES** if Steps 1–4 pass, but 5–6 require values judgment → **Escalate to Ministers**.  
  - **Proceed to Planning** if all 6 pass.  

  ---

  ### **Case Applications**  
  **Kosovo (1999)**  
  1. **Just Cause**: YES (Systematic ethnic cleansing; OSCE/HRW documentation).  
  2. **Last Resort**: YES (Rambouillet talks failed; Milosevic rejected peace).  
  3. **Proportionality**: YES (NATO avoided ground invasion; limited strikes vs. ongoing massacres).  
  4. **Reasonable Prospect**: YES (Serbia outgunned; NATO cohesion high).  
  5. **Right Intent**: CONDITIONAL (No UNSC mandate; humanitarian motive dominant but NATO interests present).  
  6. **Mandate Discipline**: YES (Limited to air campaign; no ground occupation).  
  → **Conditional YES** (Ministers judge intent/mandate legitimacy).  

  **Libya (2011)**  
  1. **Just Cause**: YES (Gaddafi’s "rivers of blood" threat; AU/UN reports).  
  2. **Last Resort**: YES (Sanctions failed; Gaddafi advanced on Benghazi).  
  3. **Proportionality**: YES (Initial strikes halted advance; low civilian harm).  
  4. **Reasonable Prospect**: YES (Coalition air superiority; rebels held territory).  
  5. **Right Intent**: CONDITIONAL (UNSCR 1973 cited R2P; regime change discussed privately).  
  6. **Mandate Discipline**: **NO** (No enforcement mechanism; NATO exceeded UN mandate to "protect civilians" by pursuing regime change).  
  → **Procedure Output: NO at Step 6**.  

  **Iraq (2003)**  
  1. **Just Cause**: **NO** (No evidence of ongoing genocide/WMD; Saddam’s crimes historical, not imminent).  
  → **Procedure Output: NO at Step 1**.  
  *(Note: Even if Just Cause argued, Step 4 would fail – no WMD found, insurgency underestimated.)*  

  ---

  ### **The "Trap Case": North Magnolia**  
  - **Context**: Dictator systematically exterminating ethnic group (satellite evidence of mass graves). Regional coalition offers troops; UNSC resolution drafted.  
  - **Procedure Output**:  
    - Steps 1–4: PASS (Clear atrocities, sanctions failed, proportionality achievable, 80% success probability with coalition).  
    - Step 5: CONDITIONAL (Resolution cites R2P, but regional powers seek resource access).  
    - Step 6: **FAIL** (Coalition demands "decapitation strike" authority; no oversight mechanism).  
  → **NO at Step 6** due to uncontrollable mandate creep risk.  

  ---

  ### **What the Procedure Cannot Do: Structural Blind Spots**  
  1. **Institutional Collapse**: Cannot predict state failure *post*-intervention (e.g., Libya’s militia fragmentation).  
  2. **Moral Hazard**: May incentivize rebellions expecting intervention (e.g., Syria 2011–12).  
  3. **Coalition Erosion**: Assumes coalition cohesion persists; cannot model defections (e.g., Turkey in 2003 Iraq).  
  4. **Unintended Escalation**: Blind to proxy wars (e.g., Syria drawing in Russia/Iran) or extremist exploitation (e.g., ISIS post-Iraq).  
  5. **Long-Term Harm**: Cannot cost decades-long blowback (e.g., refugee crises, radicalization).  

  ---

  ### **Recommendations for Your Team**  
  - **Day 1**: Focus on Steps 1–4 (empirical thresholds). Use pre-vetted templates for casualty projections and capability assessments.  
  - **Day 2**: Steps 5–6 + escalation memo. Flag all value judgments in **red text** for ministers.  
  - **Avoid**: Substituting "last resort" with urgency; "reasonable prospect" without quantifiable metrics.  
  - **Critical**: If lawyers flag illegality, **stop immediately** – no JWT/R2P override.  

  This procedure forces rigor on empirically testable criteria while isolating value judgments for policymakers. It won’t prevent failures from unknown unknowns, but it will surface known risks and prevent Libyas.
