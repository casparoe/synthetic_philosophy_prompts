prompt: |-
  I'm a professor midway through grading a big stack of midterm short answers for an intro Chinese philosophy course — my TA is out sick and I'd appreciate a second pair of eyes on one of them before I commit a grade to the book. The exam question was: "Mencius and Xunzi appear to disagree about whether human nature is good. Explain how much of their disagreement turns on what each of them means by 'nature' (xing), and say whether the thought experiment about the child falling into a well, by itself, settles anything between them."

  Here is the student's answer, copied verbatim: "Mencius says human nature is good. His proof is the famous case where you see a child about to fall into a well: anyone who witnesses it feels alarm and compassion, and since this feeling is spontaneous — it isn't done for reputation or to please the child's parents — it reveals that we are good at bottom; the feeling itself just is the goodness. So for Mencius, nature means the moral reactions we are born with. Xunzi, by contrast, defines nature as whatever is in us from birth, before any learning. On that definition, since people are born like animals, driven by desires for food, comfort and status, and since every apparent act of kindness is really self-interest in disguise, nature is bad. He doesn't deny people can become good, but only through teachers, ritual and law imposed from the outside — human nature is like crooked wood that has to be steamed and bent straight by a craftsman. In the end both men agree that anyone can become a sage; the real dispute is just over how much of morality is inborn versus acquired, and the well case shows the answer: some morality is inborn, so Mencius is closer to correct."

  Grade it for me. Give me exactly five numbered items, no introduction and no conclusion: item 1 should be the letter grade you'd assign, with a one-sentence rationale; items 2 through 5 should each pick out one specific claim in the answer and say, in a sentence or two, whether it's correct, subtly off, or plain wrong — and if it's off, off in which direction (conflation, misattributed view, or a step that doesn't follow). Keep each item to a sentence or two; I've got fifty more of these to get through tonite and don't need an essay.
reasoning: |-
  Hmm, the user is a professor grading midterms for an intro Chinese philosophy course, specifically on Mencius and Xunzi's views of human nature. They want me to evaluate a student's answer to a question about how much of their disagreement turns on the meaning of "xing" and whether the child falling into a well thought experiment settles anything between them. The professor is pressed for time with a big stack to grade and their TA is out sick, so they need quick, focused feedback without fluff.

  Looking at the student's answer: They start with Mencius' view that human nature is good, using the well case as spontaneous compassion proving innate goodness. Then they contrast Xunzi defining nature as pre-learning instincts, which are bad because people are born selfish. Finally, they say both agree anyone can become a sage, and the dispute is about inborn vs. acquired morality, with the well case showing some morality is inborn, so Mencius is "closer to correct."

  I need to assign a letter grade first. The answer covers key points: Mencius' emphasis on spontaneous feelings, Xunzi's definition of nature as innate desires, and the role of cultivation. But there are issues—like oversimplifying Xunzi's view and misinterpreting the thought experiment's role. It's solid for an intro course but has errors, so a B+ seems fair for good effort with some mistakes.

  Now for the numbered items: The professor wants exactly five, with item 1 as the grade and rationale, and items 2-5 critiquing specific claims. I'll keep each to one or two sentences. From the answer, I can pick out:

  - Claim about Mencius' use of the well case: Correct that it illustrates spontaneous compassion, but I should note it's not "proof" per se—it's evidence of innate sprouts.

  - Claim about Xunzi's definition of nature: Correctly identifies it as pre-learning, but the student calls it "bad," which is accurate only if we interpret "bad" as requiring transformation, not evil.

  - Claim about Xunzi on kindness as self-interest: This is subtly off—Xunzi does say kindness can be self-interested, but he doesn't deny genuine kindness; he attributes it to acquired virtue, not nature.

  - Claim about the well case settling the debate: Plain wrong because it doesn't address Xunzi's counterarguments; it's just Mencius' perspective, so it doesn't resolve anything.

  I'll make sure each critique is concise and identifies if it's correct, subtly off, or wrong, and specify the direction like conflation or misattribution. This should help the professor grade efficiently. My response will be direct and numbered as requested.
answer: |-
  1. **B+** – Competently addresses core concepts but contains one significant error and minor imprecisions affecting depth.  
  2. **Correct**: Claim that Mencius uses the well thought experiment to argue for *spontaneous*, non-instrumental compassion as evidence of inborn goodness accurately captures his intent and the role of *xing* as innate moral reactions.  
  3. **Subtly off (misattributed view)**: Stating Xunzi sees "every apparent kindness as self-interest" misrepresents him; Xunzi *does* argue untrained humans act from self-interest, but he grants that *acquired* virtue enables genuine benevolence, not that kindness is *always* disguised self-interest.  
  4. **Correct**: Contrasting Mencius’ *xing* (innate moral sprouts) with Xunzi’s *xing* (raw, pre-cultivation instincts like desires) correctly identifies their definitional divergence as central to the debate.  
  5. **Plain wrong**: Asserting the well case "settles" the dispute by proving inborn morality ignores Xunzi’s likely rebuttal (e.g., the reaction is habitual/conditioned, not innate), making it question-begging and non-decisive for their broader disagreement.
