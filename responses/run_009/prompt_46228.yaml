prompt: |-
  I teach at a small college with a heavy course load, and I've been awarded a one-semester research leave that I want to use to prepare an application for a twelve-month external fellowship. The topic I've chosen is the debate between epistemicism and supervaluationism about vagueness, and my half-formed idea is roughly this: once the supervaluationist is equipped with a 'determinately' operator and the epistemicist with the idea that our ignorance of sharp boundaries is structural rather than accidental, the two views may be intertranslatable at the level of object-language theses — in which case the real disagreement is not where it is standardly located (whether borderline predications have truth values) but at the metasemantic level, in what a theory of meaning for vague language is supposed to accomplish: explaining speaker competence, underwriting disquotation, predicting the pattern of sincere judgments about borderline cases. Please turn this into a complete fellowship proposal. Concretely, I need: (1) a precise statement of the research question — something in the vicinity of 'is the epistemicism/supervaluationism dispute substantive or merely notational, and if substantive, what exactly does the disagreement consist in?' — refined into something that can be resolved in twelve months by one person; (2) an account of why the standard moves on both sides leave this question open — in particular why the epistemicist's margin-for-error style reasoning and the supervaluationist's treatment of higher-order vagueness both appear to be neutral about the metasemantic issue, which is where I suspect the action is; (3) a method section describing what I would actually do, month by month — I envision the technical core as formalizing the two theories over a common language containing both a determinately operator and a knowledge-like operator, and then asking under what conditions the resulting systems are definitionally equivalent, with the philosophical interpretation work built around that result rather than after it; (4) a statement of what a successful outcome looks like — the possible conclusions, which considerations would decide among them, and what a publishable deliverable would be for each; (5) an honest account of what would count as the project failing, including the scenario where the formal equivalence turns out to be trivially obtainable and the interesting question evaporates; and (6) a scope assessment: which parts could balloon into career-length projects and how I would fence them off. Do not include a bibliography or citations of any kind; describe the positions and arguments on their merits and I will supply the scholarly apparatus myself. Finally, tell me candidly if you think the half-formed idea is a poor one and a better framing of the underlying worry exists — I would much rather learn that now than in the fourth month of the leave.
