prompt: |-
  I'm taking a third-year course on causation this term and I have to hand in a term-paper proposal (roughly 5000 words) before reading week, and I'm honestly stuck on how to frame mine. My half-formed idea: the standard line is that Lewis-style counterfactual theories and Woodward-style interventionism are rivals about what causation is, but when you look at how each actually evaluates a counterfactual — Lewis lets the closest world diverge from ours by a small miracle, Woodward by a surgical intervention that cuts the variable off from its parents while leaving everything else alone — the two devices seem to be doing suspiciously similar work. The cases where they still give different verdicts seem to me to all involve backtracking, or omissions, or overdetermination setups where you can't avoid asking what happens "downstream-to-upstream". So the question I want to pose: is the miracle-versus-surgery difference a genuine metaphysical disagreement about causation, or is it just two bookkeeping conventions for enforcing non-backtracking counterfactuals, which then inherit the exact same problems wherever backtracking can't be avoided? Turn this into a proper proposal for me: a precise statement of the question, why the usual 'counterfactuals vs interventions' framing leaves it open, the method (I'm imagining mostly working through constructed cases rather than surveying the literature), what a result would look like on each side, and what would count as the project failing. Also be honest about what could make it too big for one semester — in particular whether I'd need to get properly fluent in the causal modelling formalism to say anything non-hand-wavy, and if so whether there's a way to trim the question so I don't. Dont bother with citations, I'll add those myself.
