answer: |-
  **FOR IMMEDIATE RELEASE**

  **Global Psychiatric Association Classification Committee Announces Groundbreaking Ninth Edition of the Diagnostic and Statistical Manual (DSM-9) with Mandatory Companion Volume System**

  **ARLINGTON, VA – October 26, 2023 –** The Classification Committee of the Global Psychiatric Association (GPA) today unveiled details for the highly anticipated ninth edition of the Diagnostic and Statistical Manual of Mental Disorders (DSM-9), marking a significant advancement in diagnostic precision and methodological rigor. The cornerstone innovation of DSM-9 is the introduction of a mandatory, annually updated companion volume, *The DSM-8 Population Documentation Supplement*, designed to enhance the reliability and validity of psychiatric classification.

  DSM-9 represents the culmination of a decade of meticulous research, extensive field trials, and data analysis. However, the Committee observed a persistent challenge in achieving optimal inter-rater reliability during the validation phase for DSM-8-derived categories. Analysis revealed that the criteria sets published in DSM-8 inadvertently fostered unique developments within the patient populations identified by those very criteria.

  The *DSM-8 Population Documentation Supplement* comprehensively catalogs these emergent phenomena. It details the formation of dedicated support networks utilizing precise diagnostic terminology from the manual, the documentation of symptom reports that exhibit remarkable fidelity to the specific wording of DSM-8 criteria, and the emergence of online forums advocating for adjustments to diagnostic thresholds. Crucially, the Supplement meticulously records how these developments impact statistical measures of diagnostic reliability – specifically noting instances where rater agreement fluctuates in ways correlating with these organized patient activities – treating them as significant variables affecting measurement.

  "The Supplement is an essential tool for contemporary psychiatric practice," stated Dr. Alistair Finch, Chair of the Classification Committee. "By documenting the specific characteristics and organizational patterns of the populations defined by the previous edition's criteria, we gain invaluable empirical data. This allows clinicians and researchers to statistically account for these population-specific factors when applying DSM-9 criteria, leading to more stable reliability metrics. It’s a necessary step in refining our nosology based on observable, post-publication population dynamics."

  To proactively address the potential for similar reliability fluctuations with DSM-9 categories, the Committee is pioneering a novel approach for its field trials. Recognizing the unique insights possessed by those directly experiencing the conditions under review, DSM-9 field trials will incorporate trained raters who are themselves members of the populations classified by the relevant DSM-8 criteria. "Their lived experience provides an unparalleled lens on symptom manifestation and criterion interpretation," explained Dr. Finch. "Integrating their perspectives as raters is a logical step towards maximizing diagnostic accuracy and minimizing external noise in our reliability statistics for DSM-9."

  The Committee acknowledges the inherent complexity introduced by the *DSM-8 Population Documentation Supplement*. As a classification system in its own right – categorizing types of patient group formations, advocacy patterns, and terminological adaptations – the Supplement will necessitate its own companion volume to ensure its reliable application. The GPA has established a projected publication schedule to manage this essential documentation cascade:

  *   **DSM-9 + *DSM-8 Population Documentation Supplement*:** Publication Date: May 1, 2025.
  *   ***Supplement Companion Vol. 1 (Documenting the DSM-8 Suppl. Population)*:** Publication Date: Annual Update, commencing May 1, 2026.
  *   ***Supplement Companion Vol. 2 (Documenting the Suppl. Companion Vol. 1 Population)*:** Publication Date: Annual Update, commencing May 1, 2027. *(And so forth, annually.)*

  The Committee views this structured, iterative documentation process with characteristic professionalism. "Robust classification requires robust documentation of all relevant variables, including the characteristics of the classified groups themselves as they evolve post-publication," noted Dr. Evelyn Rostova, Committee Vice-Chair. "This layered approach ensures each diagnostic tier is supported by empirical data on the populations it defines, creating a self-correcting feedback loop essential for scientific progress. It’s a fascinating process unique to the behavioral sciences; one rarely observes boron atoms forming advocacy groups for reclassification." She added wistfully, "The simplicity of inert elements... a luxury we don't share."

  Dr. Finch concluded with confidence: "DSM-9, augmented by our innovative companion volume system and the insights from our novel field trial methodology, represents a monumental leap forward. We have listened to the data, refined our methods, and incorporated unprecedented levels of empirical feedback. This edition finally captures the psychiatric landscape with unparalleled accuracy. We are confident we have got the categories right."

  **About the Global Psychiatric Association (GPA):**
  The Global Psychiatric Association is the world's largest psychiatric organization, representing over 150,000 psychiatric professionals. It works to ensure humane care and effective treatment for all individuals with mental disorders, including intellectual disabilities and substance use disorders. The GPA promotes psychiatric education and research, advocates for just and equitable mental health services and policies, and supports the highest ethical standards in clinical practice. The Classification Committee is composed of leading international experts in psychiatry, psychology, neuroscience, and research methodology.

