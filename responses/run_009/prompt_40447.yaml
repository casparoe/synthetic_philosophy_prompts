  }
  ```

  **Notes for Clarity:**  
  - **Refrains:** The first refrain asserts fiction’s unreality; the second confesses unyielding grief.  
  - **Tercets:** Each corresponds to a major philosophical resolution (e.g., Tercet 1 = make-believe; Tercet 3 = shallow affect).  
  - **Turn:** Line 16 ("But when she fades in prose...") marks the collapse of intellectual defenses.  
  - **Unresolved:** The paradox persists in the quatrain’s closing couplet, refusing synthesis.  

  The poem adheres strictly to villanelle structure while using contemporary diction and pacing. A scholar will recognize the referenced theories; a lay reader will grasp the struggle between reason and emotion in reading.
