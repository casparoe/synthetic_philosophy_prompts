answer: |-
  Your professor's contractualism angle is intellectually seductive, but I believe it's a **post-hoc rationalization, not the actual driver** of the pattern. The spending dichotomy you observe is fundamentally rooted in **psychological salience and political economy**, not a principled commitment to non-aggregation. Here's my defense:

  1.  **Why Contractualism Doesn't Fit Consistently:**
      *   **The Rescue Side:** Scanlon's principle *can* explain unlimited spending on identified victims ("we cannot let *this person* die when we could save them, regardless of cost, because their claim is absolute"). It forbids trading one life for aggregated smaller benefits elsewhere.
      *   **The Safety Side:** This is where contractualism fails as an explanation for *observed practice*. Contractualism doesn't magically endorse cost-per-life thresholds for statistical lives. Scanlon *also* argues against simply aggregating many small harms to outweigh a large harm to one person. Applying contractualism consistently to safety spending would demand *rejecting* many standard cost-benefit analyses! For example, if a safety regulation prevents 10 deaths from a specific, rare cancer but imposes significant costs raising prices (causing many small harms via slightly reduced living standards for millions), contractualism *might* argue the regulation is required *despite* the aggregated small harms outweighing the prevented deaths. Our current safety spending practices, with their cutoffs, are fundamentally *aggregative* in a way contractualism explicitly rejects. **The practice isn't consistently applying a non-aggregative principle; it's switching ethical frameworks based on visibility.**

  2.  **The Actual Drivers: Psychological Salience & Political Economy:**
      *   **The Identifiable Victim Effect:** This is the core psychological bias. We are neurologically and emotionally wired to respond powerfully to specific, vivid, named individuals facing imminent, concrete peril. Media coverage amplifies this, creating intense public pressure. Governments respond to this pressure. The cost becomes secondary because the *political* cost of *not* acting is perceived as infinite (blame, outrage).
      *   **The Statistical Victim Effect:** Conversely, anonymous, future, probabilistic deaths lack salience. They are abstract numbers. No specific face generates public outrage for their prevention. Bureaucracies operate in this sphere, tasked with efficient resource allocation using tools like cost-per-life-saved analysis. There is *no political penalty* for letting statistical victims die; there *is* a political penalty for "wasting" money on low-salience risks.
      *   **Blame Avoidance & Credit Claiming:** Rescuing identified victims is a high-visibility, high-reward political act. Denying a safety measure is low-visibility and politically unrewarding (at best). The political logic favors dramatic rescues over mundane, preventive safety spending. The "cost without limit" in rescues reflects the perceived infinite political cost of failure in that moment.
      *   **Epistemic Constraints & Certainty:** Rescues involve *known, specific lives* in *imminent, certain peril* with a *clear, time-bound intervention*. Safety regulations deal with *probabilistic risks* to *unknown future individuals* based on *statistical models*, with benefits spread over long timeframes. The former creates a sense of concrete, urgent duty; the latter feels abstract and contestable.

  3.  **What Theory Does the Pattern *Presuppose*? It Presupposes None Coherently.**
      The pattern isn't driven by a unified ethical theory. It's an **inconsistent byproduct of human psychology interacting with political incentives within different decision-making contexts**:
      *   **Rescues:** Operate in the realm of **crisis politics and expressive symbolism**, governed by the **rule of rescue** (a powerful psychological/political norm, not a deep ethical theory).
      *   **Safety Spending:** Operates in the realm of **bureaucratic resource allocation**, governed by **cost-effectiveness analysis** (a utilitarian/economic framework).
      The tension arises because these two modes use fundamentally incompatible logics, driven by context, not principle.

  4.  **If We Rebuilt Policy on the *Rival* Theory (Utilitarianism/Cost-Benefit):**
      *   **The Change:** A truly consistent utilitarian regime would apply a *single* value for a statistical life (VSL) or cost-per-life-saved threshold *across all contexts*, including high-salience rescues. A rescue costing $100 million per life saved would be deemed unethical if the same funds could save 100 statistical lives elsewhere at $1 million each. Funding would shift massively towards preventive safety, public health, and infrastructure improvements with high proven returns per dollar spent.
      *   **The Challenges:**
          *   **Political Suicide:** Abandoning dramatic rescues would be electorally catastrophic. The public outcry would be immense.
          *   **Implementation Uncertainty:** Calculating true opportunity costs and VSLs in real-time for complex rescues is practically impossible.
          *   **Moral Outrage:** Even many utilitarians feel visceral discomfort abandoning an identifiable life for statistical gains. It feels like murder.
          *   **Erosion of Trust:** Government explicitly valuing some lives less in direct actions could undermine social solidarity.

  5.  **If We Rebuilt Policy on *Consistent Contractualism*:**
      *   **The Change:** This would be radical. It might *restrict* unlimited rescue spending if the resources diverted caused significant harms elsewhere that couldn't be justified individually to those harmed ("We spent $100M to save Miner A; that $100M wasn't spent on hospital beds, meaning your specific, non-life-threatening but painful condition wasn't treated due to waitlists. Can we justify that *to you*?"). Conversely, it might *mandate* more safety spending by forbidding the aggregation of many small savings to outweigh preventing significant harms (deaths, serious injuries) to individuals. Cost-effectiveness thresholds would need justification based on *individual* claims, not just aggregates.
      *   **The Challenges:**
          *   **Operational Nightmare:** Defining "significant harms," adjudicating millions of individual claims indirectly affected by budgets, and making consistent decisions is likely intractable.
          *   **Resource Allocation Paralysis:** Strict non-aggregation could make large-scale trade-offs incredibly difficult, potentially leading to worse overall outcomes.
          *   **Counterintuitive Results:** It might prevent saving one identified life if the cost imposes diffuse but real hardship on many others, which clashes powerfully with the rule of rescue instinct.

  **Conclusion:** Don't be seduced by the contractualist dressing. The pattern you observe isn't a principled application of Scanlon; it's an **inconsistent artifact of psychology and politics.** The "identified life" spending reflects the **Rule of Rescue** amplified by media and blame avoidance. The "statistical life" spending reflects **utilitarian cost-effectiveness** applied in low-salience contexts. The tension isn't between aggregation and non-aggregation *within* one theory; it's a **clash between two entirely different decision-making paradigms** activated by context. Policy isn't presupposing a coherent theory of fairness; it's lurching between emotional response and cold calculation based on what the cameras see and who might complain.

  **To change this:** The most feasible path isn't adopting pure utilitarianism or contractualism, but **increasing the salience of statistical lives** (e.g., compelling storytelling about preventable deaths, transparent reporting on "lives lost due to inaction") and **institutionalizing opportunity cost awareness** even during rescues (e.g., dedicated preventive funding pools that *cannot* be raided for rescues, forcing explicit trade-off discussions *before* crises hit). This wouldn't eliminate the tension, but it might foster a more ethically conscious and less hypocritical allocation.
