            So yes: Option C = 0.11 * p2 + 0.89 * s
            Option D = 0.11 * p1 + 0.89 * s

          Now, in the second choice, the subject prefers C to D, which means:
            0.11 * p2 + 0.89 * s   >   0.11 * p1 + 0.89 * s

