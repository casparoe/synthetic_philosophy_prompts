  We are given two choices in the Allais paradox:

  Choice 1:
  Option A: $1M for certain.
  Option B: A lottery that pays $5M with probability 0.10, $1M with probability 0.89, and $0 with probability 0.01.

  Typically, subjects prefer A (the sure $1M) over B.

  Choice 2:
  Option C: A lottery that pays $5M with probability 0.10 and $0 with probability 0.90.
  Option D: A lottery that pays $1M with probability 0.11 and $0 with probability 0.89.

  Typically, subjects prefer C over D.

  Maya claims that this pattern violates the independence axiom of expected utility theory (EUT). Daniel objects that the independence axiom, as stated, governs mixtures, and the subjects only faced simple one-stage lotteries, so there is no direct violation.

  Let's break down the exchange step by step.

  1. **Maya's initial claim**: The choices violate the independence axiom.

     The independence axiom (also known as the substitution axiom) states that if an agent is indifferent between two lotteries p and q, then for any other lottery r and any probability α in [0,1], the agent is indifferent between the mixtures:
        α * p + (1-α) * r   and   α * q + (1-α) * r.

