prompt: |-
  I'm clerking for an intermediate appellate judge, and she's asked me for a bench memo on a case I've privately started calling "the flood ordinance mess." Short version: during a major flood two years ago, the county council passed an emergency ordinance against "exploitative pricing of essential goods." It was enacted the day *after* the conduct it punished, never showed up on the countys website for six weeks (some clerk's error), the word "exploitative" was never defined except in an internal guidance memo that a cousin working in the clerk's office quietly forwarded to a couple of store owners (and only them), and enforcement was weirdly concentrated on shops that had backed the incumbent council's rival in the last election. Defendant got convicted under it and now argues the ordinance "never became law" at all — not that it's unconstitutional, but that it *isn't law* — so the conviction is void.

  The state's answer is basically pure pedigree: council followed its enactment procedure, executive signed it, ergo it's law, and any defects go to how it's applied or whether it survives due process, not to whether it exists in the first place. The judge wants me to take that side seriously — she thinks the separation of legal validity from legal merit is precisely what keeps judges from turning into a super-legislature — but she's also clearly tempted by the thought that a rule that's retroactive, secret, vague, and selectively enforced isn't just bad law, it's a failure to make law, and courts should be able to say so in those words.

  There's also a wrinkle one of the defense attorneys raised that the judge finds "cute but dangerous": that legal validity comes in degrees, so the ordinance might be law enough to support civil fines but not criminal penalties. She wants to know if that's a real distinction she could actually write into an opinion or if it's just vibes.

  Draft the bench memo she can act on: recommend a concrete disposition (affirm, reverse with dismissal ordered, remand for a narrowing construction, whatever you honestly think is best), and engage the strongest version of the state's pedigree argument, not a strawman of it. Lead with the bottom line in the first sentence and then give the reasoning — no preamble, and don't restate the facts back at me, she already knows them.
reasoning: |-
  Okay, the user is a law clerk for an appellate judge dealing with a complex case involving a flood ordinance. The key issues are retroactivity, secrecy, vagueness, and selective enforcement. The defendant claims the ordinance "never became law," while the state argues it's valid based on enactment procedures. The judge is torn between respecting procedural validity and acknowledging that fundamental flaws might negate the law's existence.

  First, I need to address the core question: can defects like these prevent the ordinance from being law? The state's pedigree argument is strong—proper enactment should typically suffice. But exceptions exist. Retroactive criminal laws are void under due process. Here, punishing conduct before enactment clearly violates that principle. 

  Secrecy is next. The ordinance wasn't published for six weeks. Notice is crucial for laws, especially criminal ones. If people can't know the law, it can't be enforced. The internal memo shared selectively exacerbates this, creating unfair notice. 

  Vagueness without definition of "exploitative" makes the law unconstitutionally vague. People need to understand what's prohibited. Selective enforcement based on political affiliation suggests bad faith, but that's an as-applied issue, not existence. 

  The defense's "degrees of validity" argument is interesting but unsupported. Courts don't differentiate civil vs. criminal validity; a law is either valid or not. However, the flaws here are so severe that they prevent the ordinance from being valid law at all. 

  The judge's concern about judicial overreach is valid, but here, the defects go beyond mere "bad law" to a failure in lawmaking itself. Retroactivity alone is enough to void the ordinance. Reversing with dismissal is the right call, as the law is void ab initio. 

  I should structure the memo to first state the recommendation clearly, then tackle the state's argument, address each defect, and dismiss the degrees of validity idea. Emphasize that retroactivity and secrecy are fatal without needing to reach vagueness or selective enforcement. This balances judicial restraint with necessary checks on legislative overreach.
answer: |-
  **Reverse with dismissal ordered.** The ordinance's retroactive criminal penalty and prolonged secrecy void it *ab initio*; it never attained legal validity for the defendant's prosecution, making pedigree insufficient.

  ### Engaging the State's Pedigree Argument
  The state correctly asserts that formal enactment typically confers legal existence, insulating the ordinance from invalidation based on substantive flaws (vagueness, selective enforcement) or procedural defects in publication/distribution post-enactment. Judicial review generally presumes a validly enacted law exists and then evaluates its constitutionality or statutory propriety – this separation prevents courts from second-guessing policy merits. If the only flaws were vagueness or selective enforcement, remand for narrowing construction or dismissal *without* voiding the law would be appropriate. Pedigree is the bedrock of legal positivism: a rule *is* law if enacted per the system's rules, irrespective of injustice.

  ### Why Pedigrade Fails Here: Fundamental Defects in "Lawmaking"
  Pedigree presupposes the enactment process *produces a cognizable legal rule*. Here, two defects prevent the ordinance from achieving that status:

  1.  **Retroactive Criminal Penalty:** Punishing conduct occurring *before* enactment violates core due process. A retroactive criminal law isn't just unconstitutional; it fails as a *law* because it provides no *ex ante* rule of conduct. It functions as an *ex post facto* bill of attainder, lacking the essential characteristic of law: providing notice and an opportunity to conform behavior. **No pedigree can validate a law that punishes prior lawful conduct as a crime.** This defect alone voids the ordinance *ab initio* for the defendant.

  2.  **Pervasive Secrecy & Lack of Promulgation:** While minor publication delays might be excused, the ordinance's complete absence from *any* public record (including the official county website) for six weeks, coupled with its enforcement during this period, negates its existence *as law*. Law requires at least a *theoretical possibility* of public ascertainment. Here, the only "knowledge" came via an unlawful, selective leak of an internal memo – effectively a secret rule. A rule utterly inaccessible to the public cannot function as law; it's merely an arbitrary fiat. Pedigree requires *minimal* public accessibility to complete the enactment process. This secrecy, combined with retroactivity, means the requisite "rule" was never established for the defendant.

  ### Vagueness and Selective Enforcement (Secondary But Reinforcing)
  The extreme vagueness of "exploitative" (undefined in text and reliant on a secret memo) amplifies the due process violation caused by secrecy and retroactivity. Selective enforcement strongly suggests bad faith but is typically an *as-applied* defect; it doesn't inherently negate the law's *existence*. However, it reinforces the conclusion that this was never a general rule of conduct.

  ### Rejecting "Degrees of Validity"
  The civil/criminal distinction for validity is unsound. Validity is binary: a rule is either law or it isn't. While *consequences* of invalidity may differ (e.g., civil fines might be refundable vs. criminal convictions voided), the *source* of the rule must be valid law for *any* enforcement. A rule void for criminal purposes due to fundamental defects (like retroactivity/secrecy) is equally void for civil enforcement – its purported authority is null. This argument is "vibes" masquerading as doctrine and risks creating incoherent jurisprudence.

  ### Disposition
  Reverse the conviction and remand with instructions to dismiss the charge with prejudice. The ordinance was void *ab initio* as applied to the defendant due to retroactive criminalization and failure of public promulgation. This addresses the fundamental failure of lawmaking without broadly invalidating the ordinance prospectively or on vagueness/selective enforcement grounds alone. It upholds judicial restraint by focusing on defects that prevent the rule from attaining legal status, not its substantive flaws.
