     Full Rules:

     Title: Maxwell's Casino

     Objective: The demon aims to accumulate as many points as possible by sorting molecules.

     Setup:
       - Mark two adjacent areas: LEFT and RIGHT.
       - Assign 16 students as molecules. Give each a numbered token (1-10): 8 with 1-5 (slow), 8 with 6-10 (fast). They start in LEFT.
