       1. The teacher flips a coin to choose which chamber sends a molecule. If a chamber is empty, the other is chosen.
       2. The teacher randomly selects one molecule from the chosen chamber.
       3. The molecule approaches the gate.
       4. The demon reads the molecule's speed token:
            - 1-5: slow
            - 6-10: fast
       5. The demon decides the action based on the molecule's chamber and speed:
            - LEFT and fast: allow passage to RIGHT -> demon gains 1 point.
            - LEFT and slow: block -> no gain.
            - RIGHT and slow: allow passage to LEFT -> demon gains 1 point.
            - RIGHT and fast: block -> no gain.
       6. The demon flips one blank memory token to the marked side (even if no gain) and puts it in a used pile. This records the step.

     After 4 steps (when all memory tokens are used), the demon must reset the memory: flip all 4 tokens back to blank side. This costs 4 points (subtract 4 from the score).

     Then, a new cycle of 4 steps can begin.

     The game continues for as many cycles as time allows.

     Cheat attempt:
       - After the first reset, the teacher asks: "Can you think of a way to reset the memory without paying the 4 points?"
       - Students might propose: 
             a) Use the marked tokens as the new blank. Then in the next cycle, they would record by flipping to blank. But then resetting again would require flipping back to marked, costing 4 points? 
             b) Simply not reset and leave the tokens marked. But then they cannot record the next steps.
       - The teacher can allow them to try proposal (a) in the next cycle. But then in the next cycle, they record by flipping to blank (which is now considered non-standard). Then after 4 steps, they have to reset by flipping back to marked (the new standard), costing 4 points. So it doesn't help.

     Debrief script:

       1. Introduction: "In this game, we simulated Maxwell's demon. The demon was able to sort molecules and extract work (points), but at the cost of filling its memory. Resetting the memory to reuse it cost points, and often wiped out the gains."

       2. Mapping:
            - The gas: the students in the chambers.
            - The demon: the student demon.
            - Measurement: reading the speed token.
            - Gate operation: allowing or blocking passage.
            - Memory: the tokens. Each token flip to marked records one bit of information about the measurement and action.
            - Reset: flipping the tokens back to blank, erasing the memory.

