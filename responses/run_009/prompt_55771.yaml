       6. The cheat: "Some might think that by redefining the standard state of the memory, you can avoid the cost. But then you are just deferring the cost. Eventually, if you want to return to the original state or if you want to use the memory in a system that requires a specific state, you have to pay."

     This should fit in 90 minutes.

