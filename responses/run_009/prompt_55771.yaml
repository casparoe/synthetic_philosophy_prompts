  ### In-Class Game: Maxwell's Memory Ledger  
  **Objective:** Make students viscerally grasp that information isn't free—the demon's sorting *seems* profitable until memory reset forces a costly reckoning.  

  ---

  ### **Materials**  
  1. **Two Chambers:** Designate LEFT and RIGHT areas (e.g., with tape or signs).  
  2. **Gas Molecules:** 16 students. Each wears a lanyard with a **speed card** (playing cards: ♠/♣ = *slow* (1–5), ♥/♦ = *fast* (6–10)).  
  3. **Demon:** 1–2 students. Holds:  
     - **Gate token** (e.g., a STOP/GO sign).  
     - **Memory tokens:** 4 blank index cards + a pen.  
     - **Work tokens:** 16 poker chips (redeemable for "points").  
  4. **Teacher:** Coin (to randomise chamber selection), timer.  

  ---

  ### **Rules & Payoff Scheme**  
  #### **I. Setup (10 min)**  
  - **Initial state:** All 16 "molecules" in LEFT chamber. Demon starts with 4 blank memory cards, 0 work tokens.  
  - **Goal:** Demon accumulates work tokens by sorting molecules (fast to RIGHT, slow to LEFT).  
  - **Speed key:**  
    - Black suits (♠/♣): *Slow* (1–5).  
    - Red suits (♥/♦): *Fast* (6–10).  

  #### **II. Sorting Phase (50 min total; 1–2 cycles)**  
  *Each cycle = 8 steps (or until memory full). 1 step ≈ 3 min.*  

  1. **Select molecule:**  
     - Teacher flips coin:  
       - HEADS → Random molecule from LEFT.  
       - TAILS → Random molecule from RIGHT (if empty, reflip).  
     - Selected molecule approaches gate.  

  2. **Measure & sort:**  
     - Demon checks molecule’s speed card.  
     - Applies rule:  
       - LEFT + FAST → Open gate (molecule to RIGHT).  
       - RIGHT + SLOW → Open gate (molecule to LEFT).  
       - *Other cases:* Block (no action).  
     - **Payoff:** If gate opened, demon gains **1 work token** (from teacher).  

  3. **Record (irrevocable):**  
     - Demon *must* write on a blank memory card:  
       - *"M[ID]: [Speed] from [Chamber] → [Action]".*  
       - E.g., "M7: FAST from LEFT → moved RIGHT".  
     - Used card placed face-up in "Memory Ledger" (visible to all).  
     - **No backtracking:** Cards cannot be altered.  

  4. **Reset trigger:** When all 4 memory cards are used, sorting **stops**.  

  #### **III. Reset Phase (10 min per cycle)**  
  - Demon must clear memory to restart. Two options:  
    1. **Landauer reset:** Pay **4 work tokens** to erase all cards (teacher wipes them blank).  
    2. **"Cheat" reset (student-proposed):** Shuffle memory cards into "canonical order" (e.g., sort by molecule ID). *No token cost.*  
  - **Cycle restarts:** Molecules remain in current chambers. Demon resumes sorting.  

  #### **IV. Endgame**  
  - After 1–2 cycles, tally net work tokens:  
    - *Tokens gained* – *Tokens spent on resets*.  
  - **No real money:** Tokens → bragging rights or bonus points (e.g., +0.5% grade per token).  

  ---

  ### **Timeline (90 min)**  
  | Time      | Activity |  
  |-----------|----------|  
  | 0:00–0:10 | Setup: Assign roles, explain rules. |  
  | 0:10–0:60 | **Cycle 1:** Run 8 steps (24 min) + reset (10 min). Repeat for **Cycle 2** (26 min). |  
  | 0:60–0:70 | **Cheat attempt:** Invite students to propose/reset via "canonical order". Run 1–2 steps. |  
  | 0:70–0:90 | Debrief (script below). |  

  ---

  ### **Debrief Script (20 min)**  
  **Map the game to physics:**  
  1. **Molecules & Chambers:** Gas particles in a box. "Speed cards" ≈ thermal velocities.  
  2. **Demon’s roles:**  
     - *Measurement:* Reading speed cards.  
     - *Gate:* Token allowing/blocking passage.  
     - *Memory:* Index cards recording outcomes.  
     - *Reset:* Erasing/shuffling cards ≈ Landauer’s erasure.  
  3. **Work tokens:** Extractable work (e.g., Szilard engine). Each token ≈ *kT ln 2* from sorting.  
  4. **Reset cost:** 4 tokens = Landauer’s *4kT ln 2* for 4 bits.  
  5. **"Cheat" reset:** Standardising order *seems* free but...  
     - "Did shuffling *erase* information? No—it just hid it. To reuse cards, you must *overwrite* old data, which costs energy (Bennett’s rebuttal)."  

  **Key lessons:**  
  - Sorting *feels* profitable (work tokens pile up).  
  - Debt hits when memory fills. Resetting *forces* payment.  
  - Information is physical: Recording isn’t free; erasure settles the entropy bill.  

  ---

  ### **Predictable Issues & Fixes**  
  1. **Free-riding molecules:**  
     - *Fix:* Assign "speed captains" (2 students) to nudge peers. Use a timer for steps (max 3 min).  
  2. **Pacing collapse:**  
     - *Fix:* Skip coin flips if chambers lopsided; pre-select molecules. Cap steps at 8/cycle.  
  3. **Early epiphany:**  
     - *Fix:* If a student blurts, "Reset will cost tokens!", respond: "Ah, but *how* will it cost? Let’s see the ledger fill first." Use their insight in debrief.  
  4. **"Cheat" reset confusion:**  
     - *Fix:* During the attempt, ask: "Can you prove no information remains? What if you reuse card 3—is it blank, or still holding M7’s data?"  

  ---

  ### **Physics Shortcuts & Assertions**  
  **The game cannot reproduce:**  
  1. **Thermal velocities:** Speed cards are static; real velocities fluctuate. *Assert:* "Molecules have Maxwell-Boltzmann distributions—our cards are a snapshot."  
  2. **Gate reversibility:** No chance of a "molecule slipping back"; gate actions are absolute. *Assert:* "Real gates allow thermal fluctuations (e.g., a FAST molecule drifting left). Our demon’s control is idealised."  
  3. **Measurement cost:** Reading speed cards is free/error-free. *Assert:* "Actual measurements require energy (e.g., photon absorption)—here, we focus on memory, not measurement."  
  4. **Ergodic chaos:** Students move orderly; real gas is chaotic. *Assert:* "Our ‘steps’ simulate random collisions over time."  

  **Why this design?**  
  - **Tangible stakes:** Work tokens create visceral profit/debt tension.  
  - **"Cheat" reset:** Forces debate on Bennett’s insight (standardising ≠ erasing).  
  - **Cycle-based:** Reset isn’t an afterthought—it *halts progress*, making cost unavoidable.  
  - **British English:** As requested (e.g., "tokens" not "chips", "maths" not "math").  

  ---  
  Run this cold, and they’ll feel Landauer’s principle in their bones. Good luck!
