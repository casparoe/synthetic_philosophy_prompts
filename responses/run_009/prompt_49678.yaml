  Point 4 confidently states quantum computing doesn't threaten the thesis. That's settled since quantum computers compute recursive functions. But is there any debate here? Most experts agree, so point 4 is fine. Point 5's dismissal of analog hypercomputation is also widely accepted because of the infinite precision issue. The real contention is with MH spacetimes in point 6.

  Looking at point 2, the convergence of formalisms justifies the conceptual thesis. But does this convergence also support the physical thesis? The user separates them, so probably not. The physical thesis requires empirical evidence. However, some argue that the conceptual analysis implies physical limits, but that's contested. The user keeps them distinct, which is prudent.

  The biggest tension is between the user's dismissal of analog hypercomputation (point 5) and taking MH spacetimes seriously (point 6). Both involve physical implementations, but the user rejects one on physical grounds (infinite precision) while accepting the other as a live possibility. The cheapest fix would be to emphasize that MH spacetimes are consistent with current physics, unlike analog methods which violate known physical principles. This doesn't cost much but clarifies why they're treated differently.

  Another subtle tension is between point 1 (conceptual) and point 3 (physical). If the conceptual thesis is about effective calculability, and the physical thesis about physical realizability, are they related? The user might need to clarify that the physical thesis doesn't derive from the conceptual one; they're separate. That's already in point 3, so reinforcing that would help.

