  **Facilitation:**

  - Have a spreadsheet that you input the number of RR and CB, and it outputs the payoff for RR and CB for that round. Then for each newsroom, you know what they chose and can assign the payoff.

  **Debrief Outline:**

  1. Show the graph of RR vs CB over rounds and the total points in the room (or average).
  2. Ask: 
     - How did your newsroom feel about the choices?
     - What happened during negotiation? Did you trust others?
     - Did the institution work? Why or why not?
  3. Introduce the concept: 
     - "You experienced a system where individual incentives lead to collective ruin. This is known as..."
     - Then reveal: "In the essay 'Meditations on Moloch' by Scott Alexander, this is described as Moloch: the god of coordination failures, a race to the bottom driven by competition."
     - Explain the multipolar trap, prisoner's dilemma, tragedy of the commons.
  4. Escape routes:
     - Coordination (like your negotiation) -> but hard to scale.
     - Regulation (like your institution) -> requires enforcement power.
     - Changing the payoff structure (e.g., public pressure for quality news, or subsidies for real reporting) -> external intervention.
     - Exit: leaving the system (but often not feasible).
  5. Relate to real examples: 
     - News: clickbait vs investigative.
     - Airlines: legroom.
     - AI: safety vs speed.
     - College admissions: everyone taking more AP classes, etc.

  **Final Note:**

  This design is ambitious for 60 minutes. Be prepared to adjust on the fly (e.g., skip a round if time is short). The key is to get the dynamic and then debrief.

  Good luck!
answer: |-
  Here's a comprehensive game design for your 60-minute session, optimized for experiential learning, discussion, and emotional impact. The game simulates a **race-to-the-bottom trap** in a newsroom context, using points-based stakes to create tension. Crucially, it avoids naming the concept (Moloch/multipolar trap) until the debrief.

  ---

  ### **Game Title:** *The Quality Trap*
  **Core Mechanic:** Iterated prisoner's dilemma with public goods, negotiation phases, and emergent enforcement attempts.  
  **Players:** 5–6 tables (5–6 players each).  
  **Time:** 55 minutes (5 min buffer).  
  **Materials:** Projector, colored cards (green/red/yellow), paper, pens, bell/whistle.  

  ---

  ### **Game Flow**  
  *(Total: 45 minutes)*  

  #### **1. Setup (5 min)**  
  - **Assign Roles:** Each table is a "newsroom." Name them (e.g., *The Chronicle*, *The Bulletin*).  
  - **Starting Points:** Each newsroom begins with **100 points** (displayed on a projector).  
  - **Rules Explained:**  
    - Each round, choose **GREEN (Quality Reporting)** or **RED (Clickbait)**.  
    - **Quality Reporting**: Costs 15 points now, grows the *total audience pie*.  
    - **Clickbait**: Costs 0 points now, but shrinks the *total audience pie*.  
    - **Goal**: Maximize your newsroom’s points.  

  #### **2. Phase 1: Silent Rounds (Rounds 1–3)**  
  *(10 min: 2 min/round + tally)*  
  - **Mechanics**:  
    - Tables secretly hold up GREEN or RED cards.  
    - After all vote, reveal choices.  
    - **Payoffs**:  
      - **Quality (GREEN)**: `+ (25 × total GREEN) ÷ # tables - 15`  
      - **Clickbait (RED)**: `+ 8 - (2 × total RED)`  
    - *Example*: 6 tables, 2 choose GREEN:  
      - GREEN: `(25×2)÷6 - 15 ≈ 8.3 - 15 = -6.7 → -7 points`  
      - RED: `8 - (2×4) = 8 - 8 = 0 points`  
  - **Incentive Design**:  
    - Choosing RED is *always* better individually (even 1 defector hurts cooperators).  
    - All-GREEN gives +10/table; all-RED gives -4/table. Sink gradually.  

  #### **3. Phase 2: Open Negotiation (5 min)**  
  - Tables openly discuss strategies. Allow:  
    - Promises ("We’ll do GREEN next round!").  
    - Threats ("If you defect, we punish!").  
    - *No binding agreements allowed*.  

  #### **4. Phase 3: Negotiated Rounds (Rounds 4–6)**  
  *(10 min: 2 min/round + tally)*  
  - Repeat voting with public discussion. Tables may lobby others mid-round.  
  - **Critical Twist**: After votes, display each table’s *individual choice* on the projector to heighten accountability/betrayal.  

  #### **5. Phase 4: Institutional Experiment (Round 7)**  
  *(7 min)*  
  - **Task**: Tables design an enforcement mechanism in 4 min. Options:  
    - **Pact**: "If you play RED, pay 10 points to each GREEN table."  
    - **Regulator**: Assign 1 volunteer as "Audit Bureau" to penalize defectors (but they can’t see votes until *after*).  
    - **Whistleblower**: Tables can spend 5 points to investigate another table’s past votes.  
  - **Voting**: Tables vote (YELLOW card) to adopt 1 mechanism (majority wins).  
  - **Play Round 7** using the new rules.  

  #### **6. Phase 5: Final Round (Round 8)**  
  *(3 min)*  
  - Play with/without the institution. Announce: *"This is the last chance to avoid collapse."*  

  ---

  ### **Debrief Framework**  
  *(10 min)*  
  **Goal:** Let players articulate the trap *before* labeling it.  

  1. **Feelings First** (2 min):  
     - *"What emotions did you feel during the game? When did trust break?"*  
     - Highlight frustration, betrayal, helplessness.  

  2. **Map the Dynamics** (3 min):  
     - *"Why did RED dominate even when everyone hated it?"*  
     - Guide them to identify:  
       - Individual rationality ("We had to defect to survive").  
       - No villain ("They weren’t evil—just trapped").  
       - Scale of damage (Show point trends: early cooperation vs. late collapse).  

  3. **The Reveal** (2 min):  
     - *"You experienced a **multipolar trap** (aka Moloch). No one chooses this outcome—it emerges from competing incentives. The system is the villain."*  
     - Show real-world parallels: clickbait, airline seats, AI arms races.  

  4. **Escape Routes** (3 min):  
     - **Coordination**: "Your pacts worked briefly—but were fragile."  
     - **External Enforcer**: "Your regulator lacked teeth. Real ones need power (e.g., fines, laws)."  
     - **Payoff Change**: "What if readers paid for news? Or if safety standards were mandatory?"  
     - **Exit**: "Could you leave the industry? Rarely—it’s costly."  
     - **Key Insight**: All solutions require *changing the rules*, not blaming players.  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem: Over-Collusion** (Tables cooperate perfectly).  
    - *Fix*: Inject "crisis": In Round 5, announce *"Breaking: Ad revenue down 20%—points are halved this round!"* to incentivize betrayal.  

  - **Problem: One Table Sabotages** (Always plays RED).  
    - *Fix*: Use them! In debrief, ask: *"Did they have a choice? What would you do if they were a real competitor?"*  

  - **Problem: Apathy** (Back-row disengagement).  
    - *Fix*: Assign roles at tables (e.g., "Editor," "Finance," "Ethics Officer") to force debate. Announce a "Top 3 tables" leaderboard.  

  - **Problem: Computation Delay**.  
    - *Fix*: Pre-calculate payoffs for all vote combinations. Use a spreadsheet auto-projector.  

  - **Problem: Enforcement Chaos** (Mechanism fails spectacularly).  
    - *Fix*: Celebrate it! *"Your regulator got captured by lobbyists!"* → Discuss real regulatory failures.  

  ---

  ### **Limitations of the Game**  
  1. **Exit Costs**: Players can’t simulate leaving careers or industries.  
  2. **Scale**: 30 players ≠ billions of actors. Real traps involve *invisible* opponents.  
  3. **Time Compression**: Slow, generational decline (e.g., airline seats) feels abrupt.  
  4. **No Real Stakes**: Points ≠ survival. Real actors face bankruptcy or existential risk.  
  5. **Debrief Privilege**: Real world lacks a facilitator to "reveal" the trap.  

  ---

  ### **Why This Works**  
  - **Emotional Resonance**: Players *feel* the trap via points bleeding out.  
  - **Rich Negotiation**: The "institutional experiment" mirrors real struggles (e.g., climate agreements).  
  - **Bias-Free Reveal**: Naming "Moloch" post-experience avoids intellectualization.  
  - **Scalable**: Works with 1 facilitator (use a volunteer to tally votes).  

  **Prep Tip**: Dry-run with colleagues to refine payoff math and timing. Adjust points if tables collapse too fast (e.g., reduce RED’s penalty). Let the room fail—it makes the debrief land harder.
