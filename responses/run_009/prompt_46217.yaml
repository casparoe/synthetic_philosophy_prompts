prompt: |-
  I'm a PhD student in political science, working mostly on comparative electoral systems, and I'm drafting the intro chapter for my dissertation on electoral reform debates. The more I read, the more I notice that people arguing for proportional representation over first-past-the-post (or the other way around) basically never state what an electoral system is even supposed to *do* — they just pick their favorite property, proportionality or constituency service or whatever, and run with it. So before I wade into the empirical literature I want the full spec written down: what would an electoral system for a national legislature actually have to get right to count as adequate? I'm thinking things like translating votes into seats in a way voters can recognize, not punishing people for voting sincerely, keeping a workable link between citizens and individual representatives, not handing disproportional power to tiny kingmaker parties, keeping the barrier to entry for new parties from ossifying the party system, producing governments that can actually govern — but I'm sure I'm missing some and I suspect some of the ones I listed are just camp prejudices dressed up as requirements (like, is "stable single-party majorities" a genuine desideratum or is that just what people who grew up under Westminster systems assume?).

  So give me the requirements list, with the motivating case behind each one — a concrete scenario where a system violating that criterion does something clearly bad, not just an abstract statement. For each, tell me whether it's non-negotiable or whether reasonable people weigh it differently, and, crucially, flag any subsets that are jointly unsatisfiable — e.g. stuff coming out of Arrow's theorem, Gibbard-Satterthwaite, or just the plain tension between strict proportionality and having locally accountable individual MPs. That last part is what I most want to see, since if some of the desiderata can't all be met at once, then the whole FPTP-vs-PR debate is really a disagreement about which criterion to sacrifice, and I want to frame my chapter around that.

  Then, briefly, run first-past-the-post, a party-list PR system, and mixed-member proportional against the list — I'll extend it to STV and other variants myself later, so don't worry about being exhaustive there. Also feel free to tell me if you think one of my proposed criteria above is bogus or needs splitting into two, I've been going back and forth on the kingmaker party thing especially.
reasoning: |-
  Okay, the user is a PhD student in political science focusing on comparative electoral systems. They're writing their dissertation's introduction chapter on electoral reform debates. Their main observation is that advocates for FPTP or PR often don't clarify the fundamental purposes of an electoral system—they just emphasize their preferred features like proportionality or constituency service. The user wants a comprehensive list of criteria that an electoral system should meet to be considered adequate, with concrete examples of failures, and an analysis of trade-offs between these criteria.

  I need to recall key normative theories of representation. Hanna Pitkin's concept of representation comes to mind, along with Arend Lijphart's majoritarian vs consensus models. The user mentioned Arrow's theorem and Gibbard-Satterthwaite, so I should incorporate social choice theory implications. They also want to know which criteria are incompatible, highlighting unavoidable trade-offs in electoral system design.

  The user listed several potential criteria: vote-seat translation, sincere voting, citizen-representative links, avoiding kingmaker parties, reasonable party entry barriers, and governable governments. They're unsure if some are biases, like valuing single-party majorities. I should evaluate each criterion rigorously, providing real-world examples where violations caused problems. For instance, the 1951 UK election where Labour got more votes but Conservatives won more seats illustrates flawed vote-seat translation.

  I need to identify which criteria conflict. For example, strict proportionality clashes with local accountability because having single-member districts typically undermines proportionality. Arrow's theorem shows that no system can perfectly satisfy all democratic fairness principles simultaneously. Gibbard-Satterthwaite indicates that strategic voting is sometimes unavoidable. These tensions are crucial for the user's framing of the FPTP vs PR debate as a choice about which criteria to prioritize.

  For each criterion, I'll specify if it's non-negotiable (like basic legitimacy) or debatable (like preference aggregation depth). The user mentioned kingmaker parties—I should note that while extreme cases are problematic, minor parties playing a role isn't inherently bad, depending on the political culture.

  Next, applying the criteria to FPTP, Party-List PR, and MMP. FPTP excels in local accountability and government stability but fails proportionality and encourages strategic voting. Party-List PR ensures proportionality and simplifies voting but weakens local ties and can lead to fragmented parliaments. MMP attempts a balance but has complexities like overhang seats and potential for kingmakers.

  I should warn about criteria that might be biased. Valuing "stable single-party majorities" often reflects Westminster experiences; consensus democracies like those using PR can govern effectively through coalitions. The user should present this as a normative choice rather than an objective requirement.

  Finally, structuring the response: list each criterion with examples, note conflicts, evaluate the three systems, and highlight trade-offs. Emphasizing that the core debate is about which trade-offs are acceptable will strengthen their dissertation's framework.
answer: |-
  Here's a comprehensive framework of desiderata for national legislative electoral systems, grounded in democratic theory and real-world consequences. I've structured it with your specific requests in mind: concrete failure scenarios, negotiability flags, and inherent trade-offs.

  **Core Desiderata for an Adequate National Legislative Electoral System:**

  1.  **Legitimacy & Basic Fairness:**
      *   **What:** The system must translate votes into seats in a way perceived as fundamentally fair by a critical mass of the electorate. The winners should broadly reflect the expressed will of the voters.
      *   **Concrete Failure (Non-Negotiable Failure):** **UK General Election 1951:** Labour wins the popular vote (48.8% vs 48.0%) but the Conservatives win a clear majority of seats (321 vs 295). A majority of voters preferred one party, yet the other gains power. This undermines the basic democratic principle that the majority (plurality in this case) should prevail.
      *   **Negotiability:** **Non-Negotiable.** A system consistently producing "wrong winner" outcomes or wildly disproportionate results (e.g., a party with 40% votes getting 60% seats) loses fundamental legitimacy. *However, the acceptable *degree* of proportionality/disproportionality is highly negotiable.*

  2.  **Voter Efficacy & Expression:**
      *   **What:** Voters should be able to vote sincerely for their preferred candidate/party without their vote being "wasted" or feeling compelled to vote strategically against their true preference.
      *   **Concrete Failure (Strong Case for Non-Negotiability):** **FPTP in "Safe Seats":** In a constituency dominated by Party A (70%), a voter preferring Party B (20%) knows their vote is highly unlikely to influence the result. They might abstain, vote insincerely for Party A to have *some* influence, or vote for a minor party C (10%) despite preferring B, hoping to deny A a majority next time. Their true preference is suppressed.
      *   **Negotiability:** **Core Principle, but Implementation Varies.** Ensuring *some* path for sincere expression is crucial. However, *how well* a system minimizes strategic incentives (e.g., Duverger's Law effects in FPTP vs. strategic voting thresholds in PR) is negotiable and system-dependent.

  3.  **Effective Representation Link:**
      *   **What:** Citizens should have identifiable representatives accountable to a specific geographic constituency or a clear, cohesive group. This facilitates constituency service, grievance redress, and local/non-partisan accountability.
      *   **Concrete Failure (Negotiable Failure):** **Pure National Closed-List PR:** Voters choose only a national party list. Their "representative" is whoever the party placed high enough on the list, with no local connection or direct accountability to them. A citizen with a local problem (e.g., a failing school) has no specific MP they can hold directly responsible for advocating on their behalf locally.
      *   **Negotiability:** **Highly Negotiable.** The *strength* and *nature* (geographic vs. functional/ideological) of this link are major points of contention. Westminster systems prioritize strong geographic links; some PR systems prioritize ideological coherence over geography.

  4.  **Effective Governance:**
      *   **What:** The system should facilitate the formation of governments capable of making decisions, passing legislation, and providing stable administration for a reasonable period.
      *   **Concrete Failure (Negotiable Failure):** **Israel (Frequent Examples) / Weimar Germany (Extreme Case):** Highly fragmented parliaments under PR can lead to unstable coalitions, constant brinkmanship, difficulty passing budgets/laws, and frequent elections (Israel). In Weimar, extreme fragmentation contributed to paralysis and the rise of anti-system parties, undermining democracy itself.
      *   **Negotiability:** **Highly Negotiable.** *What constitutes "effective" governance?* Is it Westminster-style single-party majority stability? Or the broader consensus-building and inclusivity often seen in coalition governments in PR countries (e.g., Germany, Scandinavia)? The "stable single-party majorities" criterion *is* largely a Westminster cultural preference, not a universal democratic necessity. Stability can be achieved through different mechanisms (coalition discipline, constructive no-confidence votes).

  5.  **Inclusiveness & Diversity:**
      *   **What:** The system should allow diverse political viewpoints and social groups (ethnic, regional, ideological minorities) a fair opportunity to gain representation proportionate to their support.
      *   **Concrete Failure (Negotiable Failure):** **FPTP in Plural Societies:** In countries with significant regional/ethnic diversity (e.g., Canada, UK), FPTP often under-represents geographically dispersed minorities (e.g., Greens, UKIP pre-Brexit) and can amplify regional divisions (e.g., Bloc Québécois dominating Quebec while being irrelevant elsewhere).
      *   **Negotiability:** **Negotiable.** The *level* of inclusiveness desired is a key value judgment. Majoritarian systems prioritize governing efficiency over minority representation; PR systems prioritize broad inclusion.

  6.  **Accountability:**
      *   **What:** Voters should be able to clearly identify who is responsible for governing decisions and hold them accountable at elections.
      *   **Concrete Failure (Negotiable Failure):** **Complex Coalition Governments:** In multi-party PR systems, it can be difficult for voters to assign credit or blame for policy outcomes. A small coalition partner might be seen as wielding undue influence ("tail wagging the dog") or conversely, a large party might blame its partners for failures. Voters struggle to effectively reward or punish specific actors.
      *   **Negotiability:** **Negotiable.** Accountability mechanisms differ. FPTP offers clear, localized accountability but poor policy/ideological accountability. PR offers clearer policy accountability to parties but can blur individual/ministerial accountability. The *balance* is contested.

  7.  **Choice & Competition:**
      *   **What:** The system should encourage a vibrant party system with sufficient competition to offer voters meaningful alternatives and incentivize parties to be responsive. Barriers to entry for new parties should not be excessively high, preventing ossification.
      *   **Concrete Failure (Negotiable Failure):** **High Thresholds in PR / "Safe Seats" in FPTP:** A PR system with a very high national threshold (e.g., 10%) can lock out new or niche parties with significant but dispersed support (e.g., Pirate Parties, regional parties outside strongholds). Conversely, FPTP creates vast numbers of "safe seats" where incumbents face little real competition, reducing responsiveness.
      *   **Negotiability:** **Negotiable.** The *optimal* level of party system fragmentation/competition is debated. Too few parties can mean lack of choice; too many can hinder governance (see Desideratum 4).

  8.  **Resistance to Extremism & Manipulation:**
      *   **What:** The system should not systematically amplify the power of very small, extreme, or purely opportunistic "kingmaker" parties beyond their popular support, nor should it be easily gamed or manipulated.
      *   **Concrete Failure (Non-Negotiable in Extreme Cases):** **Kingmaker Scenarios:** A tiny party holding the balance of power in a hung parliament can extract policy concessions vastly disproportionate to its electoral support or public mandate. While minor parties playing a role is normal in PR, *extreme* cases (e.g., very small, niche, or extreme parties dictating terms to much larger partners) are problematic. *Note: Distinguish between "kingmaker" (holding balance) and "tail wagging dog" (excessive influence) - the latter is often subjective.*
      *   **Negotiability:** **Non-Negotiable Avoidance of Extreme Amplification.** Preventing a party with 0.5% of the vote from becoming the *decisive* power is generally agreed upon. However, *what level* of influence a small party *should* have (e.g., 5% vs 10% threshold effects) is highly negotiable. Manipulation resistance (e.g., gerrymandering in FPTP, complex ballot design confusing voters) is also a core concern.

  **Inherent Tensions & Trade-offs (The Heart of the Debate):**

  1.  **Proportionality vs. Geographic Accountability vs. Governance Stability: (Arrow's Theorem & Realpolitik)**
      *   **Conflict:** Achieving near-perfect proportionality (PR) often requires multi-member districts or national pools, weakening the direct geographic link to a single MP. Strong geographic accountability (FPTP, SMDs) inherently creates disproportionality and "wasted votes." Both high proportionality and strong geographic links can lead to fragmented parliaments, making stable single-party majority government unlikely and potentially complicating governance (requiring coalitions).
      *   **Unavoidable Trade-off:** You cannot maximize all three simultaneously. Systems like MMP *try* to split the difference but involve compromise on each dimension.

  2.  **Sincere Voting vs. Strategic Voting Stability: (Gibbard-Satterthwaite)**
      *   **Conflict:** Gibbard-Satterthwaite proves that no ranked-choice system can be both strategy-proof *and* satisfy other basic fairness criteria. While cardinal systems (Approval, Score) have different properties, strategic incentives exist in *all* non-dictatorial systems. Designing a system that *minimizes* the *impact* or *necessity* of strategic voting is the goal, but eliminating it entirely is impossible.

  3.  **Inclusiveness (Minority Representation) vs. Governance Stability:**
      *   **Conflict:** Lowering barriers to representation (low thresholds, high district magnitude in PR) increases inclusiveness for smaller parties/minorities but also increases the likelihood of a fragmented parliament, potentially leading to less stable coalitions, more complex negotiations, and possibly more frequent elections or government turnover.

  4.  **Simplicity (Voter Comprehension) vs. Sophistication (Preference Aggregation):**
      *   **Conflict:** Simple systems (FPTP) are easy to understand but poorly capture nuanced preferences. Sophisticated systems (STV, AV) allow more expressive voting but can be harder for voters to understand fully and count efficiently, potentially reducing confidence or participation.

  **Evaluation of Systems Against Key Desiderata (Simplified):**

  | Desideratum              | FPTP                          | Party-List PR                  | Mixed-Member Proportional (MMP)          |
  | :----------------------- | :---------------------------- | :----------------------------- | :--------------------------------------- |
  | **Legitimacy/Fairness**  | Poor (High Disproportionality)| Good (High Proportionality)    | Good (Overall Proportionality)           |
  | **Voter Efficacy**       | Poor (High Strategic Voting)  | Good (Sincere Voting Possible) | Good (Sincere Voting Mostly Possible)    |
  | **Representation Link**  | **Excellent** (Strong SMDs)   | Poor (Weak/No Geographic Link) | Good (SMD Link + Regional/National List) |
  | **Governance Stability** | **Excellent** (Often Maj)     | Variable (Coalitions Common)   | Good (Tends to Produce Stable Coalitions)|
  | **Inclusiveness**        | Poor (Duverger's Law)         | **Excellent** (Low Barriers)   | Good (Thresholds Manage Fragmentation)   |
  | **Accountability**       | Good (Clear, Local)           | Variable (Party-Based)         | Good (Local MPs + Party Accountability)  |
  | **Choice/Competition**   | Poor in Safe Seats            | **Excellent**                  | Good                                     |
  | **Resist Extremism/Manip**| Moderate (Gerrymandering Risk)| Good (Thresholds Block Tiny)   | Good (Thresholds + Geographic Element)   |
  | **Simplicity**           | **Excellent**                 | Good                           | Moderate (Two Votes, Overhangs Complex)  |

  **Key Observations on Your Criteria & Final Thoughts:**

  1.  **Kingmaker Criterion:** You're right to be cautious. It needs nuance. Labeling it **"Resistance to *Extreme* Amplification of Tiny Parties"** is better. Minor parties *should* have influence proportionate to their support; the problem is when that influence becomes kingmaking power *vastly* exceeding their mandate. This is more a risk of thresholds/governance rules than PR itself. MMP's 5% threshold mitigates this substantially.
  2.  **"Stable Single-Party Majorities":** This is **absolutely a cultural preference rooted in Westminster experience**, not a universal democratic necessity. Frame it as *one potential manifestation* of "Effective Governance" (Desideratum 4), but emphasize that stable coalition governance is a valid and common alternative model in successful democracies (Germany, Netherlands, Nordics).
  3.  **The Core Framing:** Your instinct is spot on. **The FPTP vs. PR debate is fundamentally about *which trade-offs are acceptable*.** FPTP prioritizes geographic accountability, simplicity, and single-party government stability *at the expense* of proportionality, voter efficacy, and inclusiveness. PR prioritizes proportionality, inclusiveness, and voter efficacy *at the expense* of strong geographic links and (sometimes, depending on design) the simplicity of single-party government. MMP attempts an explicit compromise, accepting complexity to blend the benefits.
  4.  **Your Chapter:** Frame the intro around this unavoidable reality of **democratic trade-offs.** Argue that evaluating electoral reform debates requires first explicitly defining the normative goals (the desiderata) and acknowledging that different systems optimize different subsets, often at the expense of others. The "best" system depends on what a polity values most highly, its specific social cleavages, and its constitutional context. Your empirical work can then assess how well different systems *actually* deliver on their promised benefits and manage their inherent drawbacks in specific contexts.

  This framework gives you a robust, theoretically grounded, and critically aware foundation for dissecting the electoral reform debate. Good luck with the chapter!
