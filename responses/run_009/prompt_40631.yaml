  | 5 | **Dr. Stone**: "Non-constructive existence is sufficient for mathematical practice."<br>**Dr. Reed**: "Non-constructive existence is pragmatically inert." | Does mathematical "use" require computability?                                                  | **Applying the Ultrafilter Lemma in functional analysis.**                                                             | "Non-constructive ultrafilters yield essential theorems (e.g., Banach limits)."                 | "Non-computable ultrafilters cannot be applied in physics or computation; they are metaphysical."   |  

