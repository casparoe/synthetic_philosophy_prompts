prompt: |-
  I run performance measurement for a mid-sized regional hospital network, and my small team of analysts reviews roughly thirty metrics a quarter — ER door-to-doctor time, thirty-day readmission rates, hand-hygiene compliance, discharge-before-noon, and so on — each of which feeds executive dashboards and, increasingly, compensation decisions. The trouble we keep hitting is Goodhart's law in all its guises: metrics getting gamed (clock tricks, upcoding, patients parked in hallways so a timer never starts), metrics drifting away from the care outcomes they were chosen to track, and departments selected or funded partly for scoring well on numbers that no longer mean anything. I want a decision procedure the team can actually run, in about forty minutes per metric per quarter, with no background in economics or machine learning: the questions to ask in order, what counts as a sufficient answer to each, which answers terminate in a specific recommendation (keep, revise, pair with a counter-metric, retire) and which terminate in a flagged handoff to the executive committee because the question is one of values rather than facts. Ground it in what the actual theory of Goodhart-style failure distinguishes — gaming versus selection effects versus plain regression to the mean versus the proxy simply being pushed off the distribution it was validated on — because I want the procedure to inherit those distinctions rather than lump everything into "the number looks suspicious." Be explicit about which steps are judgment calls dressed up as procedure, and about the ways the procedure will misfire. Then run it on three metrics: door-to-doctor time in the ER, where we suspect the improvement is partly an artifact of registration games; hand-hygiene compliance measured by secret observers, where staff may be performing compliance rather than practicing it; and discharge-before-noon, which the floor managers loathe and the executive committee loves. I am particularly interested in whether the procedure says to retire or heavily discount the hand-hygiene metric despite regulatory pressure to keep reporting it, since that is a conclusion I am braced to dislike. Lead with your bottom line in the first sentence and give the reasoning after, with no preamble and no restating of this request. And if you think the enterprise is confused at bottom — if, for instance, no checklist applied to the numbers themselves can reliably separate gaming from genuine improvement, so the procedure can only ever find symptoms and never causes — say that plainly at the top instead of building me something I should not trust.
reasoning: |-
  Hmm, the user is describing a classic Goodhart's Law problem in their hospital performance metrics. They need a practical decision procedure their team can run in 40 minutes per metric per quarter, without requiring economics or ML expertise. The core pain points are metric gaming (like ER clock tricks), proxy drift (metrics losing connection to outcomes), and selection effects (departments being rewarded for meaningless numbers).

  The user specifically wants the procedure grounded in Goodhart failure modes: gaming, selection effects, regression to the mean, and proxy drift. They also want transparency about where judgment calls are disguised as procedure, and potential failure modes. Three test cases are requested: ER door-to-doctor time (suspected registration gaming), hand-hygiene compliance (possible performative compliance), and discharge-before-noon (tension between managers and executives). 

  The key challenge is designing a process that's both rigorous and executable under tight constraints. The 40-minute limit means we need focused questions rather than deep analysis. The no-expertise requirement eliminates statistical tests. The procedure must output clear actions: keep, revise, pair, retire, or escalate. 

  For the hand-hygiene metric specifically, the user seems emotionally braced against retiring it due to regulatory pressure but intellectually curious if the procedure will recommend exactly that. This tension needs careful handling - the conclusion must stand if evidence points there, but the reasoning should be exceptionally clear.

  The procedure should include: 
  - Quick data checks (distribution shifts, volatility changes) 
  - Qualitative assessment (frontline feedback, unintended consequences) 
  - Outcome correlation spot-check 
  - Gaming detection heuristics 
  - Structured discussion of proxy relevance 

  For ER door-to-doctor: Likely revision recommendation with paired metric (like patient satisfaction) since gaming evidence is strong but metric remains clinically relevant. 

  For hand-hygiene: Despite regulatory pressure, procedure should recommend retiring the secret observer method due to performative compliance, suggesting alternatives like RFID soap dispensers if possible. 

  For discharge-before-noon: Clear escalation to executives since the conflict is about values (efficiency vs. staff burden) not measurement validity. 

  Critical limitations to emphasize: This detects symptoms, not causes. It can't prove gaming - only surface red flags. Judgment permeates every step. Most importantly, no metric is truly game-proof; the best outcome is smarter metric design acknowledging this reality.
answer: |-
  **Bottom Line:** Implement this 5-step, 40-min procedure per metric per quarter to detect Goodhart failure symptoms, resulting in concrete actions (Keep/Revise/Pair/Retire/Escalate), but recognize it identifies *risks* not causes – frontline insight is irreplaceable.

  **The Goodhart Triage Procedure (40 mins/metric):**

  1.  **Check Distribution Shifts & Volatility (10 mins):**
      *   *Question:* "Compared to the baseline/validation period, has the metric's distribution (mean, spread, skew) changed dramatically, or become unusually stable?"
      *   *Evidence:* Plot quarterly trends & histograms. Look for: Sudden jumps/drops post-incentive; collapsing variance (all scores clustering near target); bimodal distributions (gaming vs. non-gaming units).
      *   *Sufficient Answer:* Documented shift in central tendency/variance. "No change" -> Proceed. "Significant shift/stability" -> Flag for Step 3 & 4.
      *   *Judgment Call:* Defining "dramatic" change (e.g., >2 SD shift? Variance halved?). Context matters.

  2.  **Probe Unintended Consequences (10 mins):**
      *   *Question:* "What are 2-3 credible stories from frontline staff (nurses, clerks, docs) about how hitting this target *might* negatively impact other care processes or outcomes, even if unintended?"
      *   *Evidence:* Quick team brainstorm based on recent feedback, incident reports, or hallway conversations. *No formal survey.* Focus on plausible mechanisms (e.g., "Rushing registration to start D2D clock might mean wrong info entered").
      *   *Sufficient Answer:* 1-2 plausible negative pathways identified. "No plausible stories" -> Proceed. "Plausible negative pathways" -> Flag for Step 3 & 4.
      *   *Judgment Call:* Assessing plausibility vs. grumbling. Requires team familiarity with ops.

  3.  **Spot-Check Correlation w/ True Outcome (5 mins):**
      *   *Question:* "Is there *any* recent (last 2 quarters) evidence, however weak, that movement in *this* metric correlates poorly (or inversely) with movement in the ultimate outcome it proxies (e.g., D2D time vs. patient satisfaction/clinical outcomes)?"
      *   *Evidence:* Eyeball simple scatter plots (metric vs. outcome) over recent periods. Look for flat lines, wrong-direction movement, or clusters where high metric = low outcome. *No stats required.*
      *   *Sufficient Answer:* Visual suggestion of weakening/negative correlation. "No obvious disconnect" -> Proceed. "Suspicious disconnect" -> Flag for Step 4 & consider Revise/Retire.
      *   *Misfire Risk:* Noise can mask true drift. Small Ns misleading. Only catches severe drift.

  4.  **Assess Gaming Susceptibility (10 mins):**
      *   *Question:* "How easily could a motivated unit/individual manipulate the *measurement process itself* (not the underlying care) to improve the score without true improvement? (High/Medium/Low/Unknown)"
      *   *Evidence:* Team rates based on: Measurement objectivity (automated > audit > self-report); definitional clarity; opportunity for "creative accounting" (e.g., timer starts/stops, patient classification).
      *   *Sufficient Answer:* High/Medium rating. "Low" -> Proceed to Step 5. "High/Med" -> Strongly consider Revise (if possible) or Pair/Retire. "Unknown" -> Escalate for audit.
      *   *Judgment Call:* Rating inherently subjective. Requires cynical mindset.

  5.  **Final Recommendation & Action (5 mins):**
      *   *Inputs:* Flags from Steps 1-4.
      *   *Decision Tree:*
          *   **Keep:** No flags from Steps 1,2,3; Low gaming risk (Step 4). Metric seems healthy.
          *   **Revise:** Fixable measurement flaw identified (e.g., ambiguous timer start, biased audit). *Requires specific revision plan.*
          *   **Pair:** Metric valuable but high gaming/UC risk (Flags in 1,2,4). *Mandate pairing with a counter-metric* measuring downsides (e.g., Pair D2D with "Registration Error Rate" or "Left Without Being Seen"; Pair DBN with "Discharge Instruction Comprehension Score").
          *   **Retire:** Severe proxy drift (Step 3 flag), OR extreme gaming susceptibility (Step 4=High) with no feasible fix, OR unintended consequences outweigh benefits. *Report formally but exclude from incentives/dashboards.*
          *   **Escalate (Values):** Metric technically sound (no flags in 1,3,4) but causing major operational friction/conflict (Step 2) or strategic debate. *Decision requires leadership judgment on priorities/trade-offs.*

  **Procedure Misfires & Limitations:**
  *   **Symptomatic, Not Diagnostic:** Finds red flags, *not* proof of gaming/drift. A "Retire" recommendation might discard a metric genuinely improving due to better care.
  *   **Judgment Everywhere:** Steps 1,2,3,4 rely heavily on analyst experience & interpretation.
  *   **Blind Spots:** Won't detect sophisticated collusion, subtle selection effects (e.g., cherry-picking patients over time), or slow proxy drift if correlation spot-check misses it.
  *   **Frontline Dependence:** Relies on anecdotal evidence in Step 2. If staff fear reprisal, insights vanish.
  *   **40-Minute Limit:** Forces superficiality. Deep dives require more time.

  **Application to Requested Metrics:**

  1.  **ER Door-to-Doctor Time (Suspected Registration Gaming):**
      *   *Step 1:* Likely shows distribution shift (improved mean) + collapsing variance (all hits target). **Flag.**
      *   *Step 2:* Plausible stories: Rushed registration errors, "hallway parking," sicker patients waiting longer while simple cases clocked fast. **Flag.**
      *   *Step 3:* Spot-check vs. LWBS, Patient Satisfaction, Treatment Initiation Time? Potential disconnect likely. **Flag.**
      *   *Step 4:* Gaming susceptibility: **HIGH** (timer start/stop control, patient classification ambiguity).
      *   *Step 5:* **Recommendation: REVISE (if possible)** measurement protocol (e.g., timer starts at *triage* completion, not registration start; audit definitions) **AND PAIR** with counter-metric (e.g., Registration Accuracy Rate, LWBS Rate). If revision impossible, **RETIRE** for incentives.

  2.  **Hand-Hygiene Compliance (Secret Observers):**
      *   *Step 1:* May show high stability or suspiciously high scores. **Potential Flag** (if unrealistic stability).
      *   *Step 2:* Plausible stories: "Hawthorne Effect on steroids" - staff spot observers, perform for show ("squirt and wipe"), focus on audited moments not overall behavior. **Flag.**
      *   *Step 3:* Spot-check vs. HAI (Hospital Acquired Infection) rates? Correlation likely weakens as metric hits ceiling (if compliance is high but HAIs persist). **Flag** if disconnect evident.
      *   *Step 4:* Gaming susceptibility: **HIGH.** Measurement is inherently gameable by performers knowing they're watched.
      *   *Step 5:* **Recommendation: RETIRE** for *internal incentives/dashboards*. It measures *performance under observation*, not true habitual compliance. **Report it formally** for regulators only. **Escalate** the need for a better metric (e.g., automated dispensers with usage data).

  3.  **Discharge-Before-Noon (Loathed by Managers, Loved by Execs):**
      *   *Step 1:* Distribution shift likely (increased % DBN). Volatility might decrease. **Flag.**
      *   *Step 2:* Plausible stories: Rushed discharges, incomplete care/education, patients discharged "to couch" before ride arrives, staff burnout. **Flag.**
      *   *Step 3:* Spot-check vs. Readmission rates, Patient Satisfaction with Discharge, Staff Burnout Scores? Potential inverse correlation. **Flag** likely.
      *   *Step 4:* Gaming susceptibility: **MEDIUM.** Can influence timing ("hold discharge till 11:59"), pressure patients to leave early.
      *   *Step 5:* **Recommendation: ESCALATE (VALUES).** The metric *might* be technically valid (measures timeliness), but the core conflict is about the *value* of timeliness vs. staff burden/patient readiness trade-off. Leadership must decide the priority. Pairing (e.g., with Discharge Readiness Score) is a tactical fix, but the values conflict remains.
