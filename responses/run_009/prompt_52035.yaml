answer: |-
  Here's a workshop quiz designed to sort participants into aesthetic testimony positions based on concrete cases, avoiding jargon and mapping answer patterns to standard philosophical views.

  **Quiz: How Do You Know It's Good? (Art & Beyond)**

  **Instructions:** For each scenario, pick the answer that **best reflects your gut feeling** about what you could reasonably know or believe based *only* on the description. There are no trick questions!

  1.  **The Wine Critic:** A world-famous wine critic, with a decades-long track record of being incredibly accurate (far better than chance), tastes a rare, expensive bottle. Before you get a chance to taste it yourself, she emphatically tells you, "This wine is genuinely fine, a truly great vintage." Based *only* on her testimony:
      *   A) I can **know** it's a genuinely fine wine.
      *   B) I can have a strong **belief** it's fine, but I can't *really know* until I taste it.
      *   C) I can't really form a meaningful opinion about its quality at all yet.

  2.  **The Trusted Friend & The Film:** Your most trusted friend, whose taste in films usually aligns perfectly with yours and who is very perceptive, sees a new movie. They call you afterwards, clearly deeply moved, and say, "It's a masterpiece. Truly profound." You haven't seen it. Based *only* on their testimony:
      *   A) I can **know** it's a masterpiece.
      *   B) I can **believe** it's probably a masterpiece, but I need to see it myself to be sure/know.
      *   C) That tells me *they* loved it, but I have no idea if it actually *is* a masterpiece.

  3.  **The Unreachable Play:** A groundbreaking theatre performance happened one night only in a remote location. You couldn't possibly have attended. Dozens of highly respected theatre critics, directors, and actors you admire, all known for their honesty and insight, independently write glowing reviews calling it "brilliant," "revolutionary," and "a once-in-a-lifetime experience." Based *only* on their consistent testimony:
      *   A) I can **know** it was a brilliant performance.
      *   B) I can **believe** it was brilliant, but it's a shame I'll never truly *know* or experience it myself.
      *   C) I accept *they* thought it was brilliant, but I can't form any judgment about the actual performance's brilliance.

  4.  **The Photo of the Lost Painting:** A famous masterpiece was destroyed in a fire decades ago. The only record is a single, extremely high-fidelity, color-accurate photograph taken under perfect lighting conditions. Experts agree it perfectly captures the look of the original. Looking closely at this photo, can you:
      *   A) **Know** whether the original painting was beautiful/powerful?
      *   B) Have a **good idea** if it was beautiful/powerful, but not *fully* know without seeing the real brushstrokes, scale, texture?
      *   C) Only know facts *about* it (size, colors, subject), but not truly judge its aesthetic quality (beauty/power)?

  5.  **The Conceptual Piece:** A renowned artist exhibits a new work. It's a plain, white, store-bought chair placed on a pedestal. The museum label and numerous serious art critics explain that the work is "profound" because it challenges notions of value, originality, and the very definition of art. The profundity seems entirely tied to these ideas/concepts/facts, not to how the chair itself looks. Based *only* on reading the explanation and critics' views:
      *   A) I can **know** the work is profound.
      *   B) I can **understand** why people say it's profound and maybe agree intellectually, but I don't *feel* its profundity or fully grasp it aesthetically without seeing it.
      *   C) I can only know *they* think it's profound or what ideas it references, but I can't judge its actual profundity as an artwork from this.

  6.  **The Novel from Reviews:** A novel wins a major literary prize. You read ten detailed reviews from critics you generally respect. Nine are ecstatic, calling it "a stunning achievement," "deeply moving," and "flawlessly written." One critic pans it as "pretentious" and "clumsy." You haven't read the book. Based *only* on these reviews:
      *   A) I can **know** it's a great novel (the consensus is clear).
      *   B) I can be **confident** it's probably very good, but I need to read it myself to *know* or fully appreciate it.
      *   C) I know critics are divided/positive, but I have no basis to judge the novel's actual quality myself.

  7.  **The Sunset Call:** A friend is vacationing on a tropical island. They phone you one evening, sounding awestruck, and say, "You have to hear this! The sunset right now is the most spectacular thing I've ever seen – the colors are unbelievably vivid, the clouds are like fire!" Based *only* on their vivid description:
      *   A) I can **know** the sunset was spectacular.
      *   B) I can **believe** it was spectacular and vividly imagine it, but I know my experience isn't the same as being there.
      *   C) I only know *they* thought it was spectacular; I can't know anything about the sunset's actual beauty.

  8.  **The Music Recommendation:** A colleague whose musical taste you deeply admire and who knows your tastes well insists, "You *must* hear this new album by Band X. Track 3 is pure sonic genius – the way the melody evolves and the textures blend is transcendent." You haven't heard it. Based *only* on their testimony:
      *   A) I can **know** Track 3 is a work of genius.
      *   B) I can **believe** it's probably amazing and I should listen, but I won't *know* or experience the genius until I hear it.
      *   C) That tells me *they* think it's genius, but it doesn't tell me if I'd find it genius.

  **Scoring Key & Interpretation:**

  Tally how many times you chose A, B, or C across all 8 questions. Then, look for the strongest pattern:

  *   **Mostly A's (Know):** You lean towards **Aesthetic Testimony Optimism.**
      *   **View:** Testimony about aesthetic qualities (beauty, power, subtlety, kitsch, profundity) can be a source of genuine knowledge, just like testimony about historical facts or scientific findings. If the source is sufficiently reliable and the conditions are right, you can come to *know* something is beautiful, powerful, kitschy, etc., without direct experience.
      *   **Why?** You consistently think reliable testimony alone suffices for knowledge across diverse cases (wine, film, unreachable play, sunset, music).

  *   **Mostly B's (Believe/Need to Experience):** You lean towards **Moderate Aesthetic Testimonial Pessimism.**
      *   **View:** Testimony can give you strong, justified *belief* that something has an aesthetic quality. It can be excellent reason to seek out the experience yourself. However, it falls short of delivering full *aesthetic knowledge*. True appreciation or knowledge of the aesthetic quality itself requires firsthand acquaintance or experience. There's something essential missing when you only hear about it.
      *   **Distinguishing Pessimist Grounds:** This quiz **cannot cleanly separate** the two common grounds for pessimism:
          *   **Ground 1 (Experience):** Aesthetic properties *are* properties of the *experience* elicited by the object (e.g., "being found powerful by a suitable observer"). Testimony tells you about *their* experience, not what *your* experience will be. (This often leads to C answers for cases like the sunset/film/music/wine).
          *   **Ground 2 (Acquaintance):** Aesthetic properties *are* properties of the *object itself* (e.g., "being powerful"), but knowing them requires direct, non-inferential acquaintance with the object. Testimony is inferential and thus insufficient for knowledge, even if it produces true belief. (This often leads to B answers).
          *   *This quiz shows B answers are common for both grounds, especially in cases involving direct sensory/perceptual qualities (Wine, Film, Sunset, Music, Photo). The Photo question (B vs C) might slightly favor Ground 2 (Acquaintance) for B, as seeing the photo is a form of acquaintance, but it's imperfect. Ground 1 (Experience) might be more likely to choose C for the Photo.*

  *   **Mostly C's (Only Their Opinion/Can't Judge):** You lean towards **Thoroughgoing Aesthetic Testimonial Pessimism or Subjectivism.**
      *   **Thoroughgoing Pessimism View:** Testimony about aesthetic qualities is fundamentally incapable of giving you knowledge *or* justified belief about the aesthetic properties of the object/work itself. It only tells you about the speaker's reaction. You need direct experience even to form a meaningful belief about the object's aesthetic properties.
      *   **Subjectivist Escape View:** There *are* no objective aesthetic facts about the object ("powerful," "kitschy") to transmit in the first place. Aesthetic judgments are purely expressions of personal taste or emotional response. Testimony only informs you about the *speaker's* taste or feelings ("*They* found it powerful"), not about any property of the object. This view naturally leads to C answers.
      *   **Distinguishing Them:** This quiz **cannot reliably distinguish** Thoroughgoing Pessimism from Subjectivism. Both consistently yield C answers. Subjectivism is often the underlying motivation for Thoroughgoing Pessimism.

  *   **Strong A/C Split (e.g., A's on Concept/Sunset/Play, C's on Wine/Film/Music):** This pattern doesn't cleanly map onto standard views but might indicate:
      *   **Conceptual/Experiential Divide:** You might accept testimony for aesthetic judgments heavily reliant on external concepts, context, or unrepeatable events (Conceptual Art, Unreachable Play, *maybe* Sunset as a unique event), but reject it for judgments requiring direct sensory perception or personal experiential response (Wine, Film, Music). This is **uncommon but potentially coherent.** Someone might argue that the "profundity" of the chair *is* the idea/conceptual fact, knowable secondhand, while the "power" of a film requires *your* emotional response, unknowable secondhand. It's **unexplored** in mainstream literature but not necessarily incoherent. It might seem **unattractive** if it feels arbitrary.
  *   **Consistent B/C on Conceptual Art, A/B on Others:** Accepting testimony for sensory/experiential art but being skeptical about conceptual art based on testimony suggests you think conceptual claims *can* be known secondhand, but you're personally skeptical of the claims made *in this specific case*. This reflects general skepticism about conceptual art criticism, not necessarily a coherent position on testimony itself.
  *   **A on Wine/Film/Music, C on Sunset:** This is hard to justify. It suggests testimony works for human-made artifacts but not natural beauty. While some argue nature is different, the core epistemic question (can testimony transmit knowledge of an observed quality?) seems identical. This pattern is **rare and likely incoherent** within the terms of the testimony debate. It might reflect a deeper belief that "art" and "nature" are fundamentally different categories for judgment.

  **Workshop Discussion Points:**

  *   Use the quiz results to group participants roughly (A-heavy, B-heavy, C-heavy).
  *   Highlight that B-answers are common, but the *reasons* for needing experience differ (your experience vs. acquaintance with the object). Discuss examples where someone's description matched your later experience (supporting Optimism or Acquaintance-Pessimism) vs. where it didn't (supporting Experience-Pessimism or Subjectivism).
  *   Discuss the Conceptual Art case: Does understanding the idea *constitute* grasping the aesthetic quality? Or is there an extra "something" needed?
  *   Discuss the Photo case: How close is "close enough" for acquaintance? Does seeing the photo count?
  *   Discuss the Sunset case: Is it fundamentally different from the film?
  *   Emphasize that these are deep philosophical questions with no settled answer. The goal is awareness of one's own assumptions when encountering aesthetic testimony in the museum or elsewhere.
