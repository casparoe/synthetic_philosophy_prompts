prompt: |-
  A pop-math book I picked up summarizes the axiom of choice like this: 'The axiom of choice (AC) says that whenever you have a collection of nonempty sets, you can choose one element from each. It sounds trivial, but it's not provable from the other axioms of set theory: Gödel and Cohen showed it can neither be proved nor disproved from ZF. AC turns out to be equivalent to several other famous statements, including Zorn's lemma, the well-ordering theorem, and the continuum hypothesis. Its most notorious consequence is the Banach–Tarski paradox, which says a solid ball can be cut into finitely many pieces and reassembled into two balls the same size as the original — so under AC, volume is not conserved, and since volume is conserved in the real world, AC is literally false of physical space. Most working mathematicians therefore avoid AC where they can, relying instead on the weaker countable axiom of choice, which is provable in ZF and suffices for ordinary analysis.' Some of this sounds right to me but other bits feel off — like, isn't the continuum hypothesis a different thing from those others? Can you go through it claim by claim and tell me what's accurate, what's a subtle distortion, and what's just wrong, and whether the book's take that mathematicians avoid AC actually follows from anything true here? Please answer in American English.
