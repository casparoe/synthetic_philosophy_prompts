answer: |-
  Here's a decision procedure translating Sen's Liberal Paradox into a 15-minute co-op committee tool. It focuses on defining the "protected sphere," assessing spillover, and handling collisions explicitly. **Bold** marks key steps/judgment calls.

  **The Co-op Liberal Procedure (CLP) - 15-Minute Version**

  1.  **Define the Proposed Rule:** What specific conduct is being regulated? (e.g., "Ban smoking on private balconies").
  2.  **Locate the Sphere:**
      *   **Identify the Core Personal Domain:** Is the conduct primarily occurring within a space traditionally considered "private" under co-op bylaws/culture? (E.g., *inside* an apartment, *on* a private balcony, *within* a fenced patio, *inside* a storage locker). **→ Judgment Call 1:** This draws the initial boundary. Default = strong presumption of individual control.
  3.  **Assess Spillover:**
      *   **Identify Externalities:** Does the conduct demonstrably *and significantly* impact others *outside* the actor's personal domain? (e.g., smoke drift, loud noise, visible aesthetics, smell, pests, safety hazard). **→ Judgment Call 2:** "Significant" is key & subjective. Minor annoyance ≠ significant. Focus on tangible impacts (health, property damage, severe nuisance).
      *   **Characterize Impact:** *How* does it impact? (Sensory intrusion? Aesthetic harm? Health risk? Property value? Collective resource burden?).
  4.  **Apply the Liberal Presumption:**
      *   **If NO Significant Spillover:** The conduct falls squarely within the individual's protected sphere. **Recommend: Reject the proposed rule.** Individual choice prevails.
      *   **If SIGNIFICANT Spillover:** Proceed to Step 5.
  5.  **Assess Pareto Relevance (The Collision Point):**
      *   **Do affected members have a strong, consistent preference *against* the spillover?** (e.g., petition signatures, documented complaints, clear majority sentiment).
      *   **Is the individual asserting a strong preference *for* the conduct within their sphere?** (e.g., medical need for balcony smoking, deep personal expression via shutters).
      *   **→ Judgment Call 3:** Evaluating the *strength* and *legitimacy* of preferences is crucial. "I don't like it" is weaker than "It triggers my asthma" or "It violates my deeply held belief."
  6.  **Resolve the Collision:**
      *   **If Spillover is Severe/Pervasive OR Preferences Against are Overwhelmingly Strong:** Sen's Paradox implies a conflict between liberalism and Pareto. **Recommend: Proceed to a standard board vote** on the rule, acknowledging the values clash. Liberalism yields to collective preference/wellbeing due to impact.
      *   **If Spillover is Moderate AND Preferences are Relatively Weak/Mixed:** **Recommend: Uphold the liberal sphere.** The individual preference within their domain outweighs the moderate external displeasure. Suggest mitigation (e.g., smoker agrees to specific hours/placement, shutter painter considers a less vibrant shade) as a gesture, but *not* mandatory.
  7.  **Flag Framework Limits:** Explicitly state if the outcome relies purely on Step 6's judgment call/vote, meaning Sen's framework didn't provide a unique answer – it just structured the conflict.

  **Running the Cases (Calling Out Conflicts & Conditions):**

  1.  **Balcony Smoking Ban:**
      *   **Sphere:** Balcony is *likely* part of the personal domain (private use area).
      *   **Spillover:** **Significant.** Smoke drift is tangible, intrusive, and demonstrably affects neighbors (smell, health concerns for some). Impact = Sensory/Health intrusion.
      *   **Pareto Relevance:** Strong preferences against from affected neighbors (petition, likely health claims). Smoker likely has strong preference *for* (convenience, habit, potential addiction).
      *   **Collision Resolution:** **Spillover is severe/pervasive (smoke travels easily). Health impacts elevate preferences against. RECOMMEND: Support the Ban.** *This conflicts with your preference? No, it aligns. You want the ban, procedure supports it.*
      *   **How to Flip It?** You'd need to successfully argue the balcony is *not* a protected personal sphere (e.g., bylaws define it as limited common element with strict rules). Or, demonstrate the smoke drift is trivial/imaginary in *this specific building* due to wind patterns. Or, prove the smoker has an overwhelming *need* (like severe agoraphobia making balcony their only outdoor space) outweighing health concerns.

  2.  **Pink Shutters (Force Repaint):**
      *   **Sphere:** Shutters attached to a private unit are *likely* part of the personal domain regarding aesthetic choice (absent specific architectural rules).
      *   **Spillover:** **Moderate/Substantial.** Visual impact on shared courtyard. Impact = Aesthetic harm/subjective displeasure.
      *   **Pareto Relevance:** Strong preferences against from many neighbors (40 signatures). Owner has strong preference *for* (personal expression).
      *   **Collision Resolution:** **Spillover is visual/aesthetic, not physical harm.** Preferences against are strong but based on subjective taste. **RECOMMEND: Uphold the liberal sphere. Reject the repaint rule.** *This conflicts with your preference (you dislike them).* The procedure prioritizes individual expression over collective aesthetic preference absent physical harm or clear bylaws violation.
      *   **How to Flip It?** You'd need to successfully argue that the shutters are part of the *building envelope* or *common elements* (not private property), governed by pre-existing architectural standards or a "maintaining harmony" clause in bylaws. Or, demonstrate the color causes *more than* subjective displeasure (e.g., significantly lowers property values verifiably, violates a historic district ordinance).

  3.  **Mandatory Compost Bins:**
      *   **Sphere:** Choice of waste disposal method *inside one's unit/on one's balcony* is likely part of the personal domain.
      *   **Spillover:** **Minimal/Contingent.** *Potential* for smell, pests, or mess *if bins are mismanaged*. Impact = Potential nuisance/resource burden.
      *   **Pareto Relevance:** Strong preferences *for* from the majority (environmental, communal benefit). Holdouts have strong preference *against* (hygiene concerns, effort).
      *   **Apply Liberal Presumption:** **Initial spillover is potential, not actual or guaranteed.** Absent evidence of *current* problems caused by *individual* holdouts, the choice falls within their personal sphere. **RECOMMEND: Reject mandatory rule.** *This aligns with your committee role (seeking fair process) but might conflict if you strongly favor composting. Sen's framework protects the holdouts' choice here.*
      *   **How to Flip It?** You'd need to demonstrate that *not* composting causes **significant, tangible spillover** *already* (e.g., holdouts' trash is overflowing, attracting pests, costing the co-op more in disposal fees than compost systems save). Or, argue composting is necessary for compliance with a *binding* municipal ordinance. Or, redefine the sphere: if bins are stored *outside* in a common area, spillover assessment changes significantly.

  **Where Sen Runs Out & Politics Takes Over (Framework Limits Flagged):**

  *   **Defining the Sphere (JC1):** This is fundamentally political/cultural. Is a balcony truly "private"? Sen doesn't answer this. It requires committee judgment based on bylaws, past practice, and co-op values.
  *   **Assessing "Significant" Spillover (JC2):** Sen doesn't define "significant." Deciding if odor/sight/sound crosses the threshold is inherently subjective and context-dependent. Politics determines the co-op's tolerance level.
  *   **Weighing Preference Strength/Legitimacy (JC3):** Sen treats preferences as given. Judging if a preference about shutters is "frivolous" or a smoker's need is "legitimate" involves values, not logic. This is political judgment.
  *   **The Collision Resolution (Step 6):** When spillover *is* significant, Sen shows liberalism and Pareto *can* conflict, but doesn't prescribe *how* to resolve it. Deciding *when* spillover is severe enough to override the sphere, or when preferences are strong enough, **is the core political decision.** The CLP forces you to make this explicit ("We're voting because...") rather than hiding behind false procedural neutrality. **This is where Sen's framework hands the baton back to democracy.**

  **Key Takeaways for Your Committee:**

  1.  **Focus on Spillover:** The boundary *is* doing the work. Your primary question should be: "Does this action *substantially* harm others outside the actor's space?"
  2.  **Protect the Sphere Relentlessly (Until Spillover):** Default to individual freedom within defined private zones. Don't regulate taste or minor annoyances.
  3.  **Be Honest About Values:** When you hit Step 6, admit: "Sen tells us there's a clash between personal freedom and what the group wants. There's no perfect answer here, just a choice about our priorities. Let's vote."
  4.  **Your Conflicts:** The procedure likely protects the pink shutters and compost holdouts against majority preference, based on spillover assessment. It supports banning balcony smoking due to significant, tangible spillover. Your dislike of the shutters is overridden by the liberal sphere presumption for personal aesthetic choices without severe external harm.
  5.  **Weakest Link:** Defining the "protected sphere" (JC1) and judging "significant spillover" (JC2) are the most vulnerable points. A committee inclined towards control can shrink the sphere or inflate spillover to justify almost any rule. Vigilance for genuine harm, not just dislike, is crucial.

  This procedure doesn't eliminate conflict, but it structures it around Sen's core insight: the fundamental tension between individual liberty and collective welfare in shared spaces, forcing explicit discussion of boundaries and impacts before resorting to a vote. Good luck navigating the politics!
