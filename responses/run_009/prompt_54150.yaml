answer: |-
  Here is the translation of the deontologist's position into your vocabulary, followed by the residue report and verdict, adhering strictly to your constraints.

  ### Translation into Legal Vocabulary
  1.  **The Constraint:** A **per se prohibition** against an act-type (e.g., "intentionally killing an innocent person"). This rule functions as a **bright-line rule**, not a balancing test. It admits **no exceptions based on consequentialist calculations** (e.g., preventing greater harm). It is **mandatory ("shall not")**, not discretionary ("may not unless...").

  2.  **Bindingness in the Single Case:** The rule imposes an **absolute, non-waivable mandate** on the agent *in the specific instance*. Its violation constitutes **strict liability misconduct** – the agent's good intention (saving others) or lack of *mens rea* regarding the *overall* outcome is **irrelevant** to the violation itself. The rule's application is **act-focused**, not **result-focused**. Committing the prohibited act is **per se wrongful**, regardless of consequences flowing from *that specific act*.

  3.  **Agent-Relativity (Indexed to Me):** The prohibition creates a **personal incapacity** or **standing limitation**. You lack the **legal/moral authority** to commit the prohibited act *even to prevent others from committing similar acts*. The five killings by others are **events outside your scope of permissible intervention** *if the only available means of intervention requires your violation*. Your duty is framed by **your own conduct**, not by **aggregate outcomes** you might influence. Preventing the five killings is not a **justification** or **affirmative defense** capable of negating the *prima facie* violation of the per se rule binding *you*.

  4.  **Why it's not "unjust result from rule rightly applied":** The deontologist rejects the premise that "justice" in this context is defined by **minimizing total instances** of the prohibited conduct. Justice requires **adherence to the constraint by each agent** in their own conduct. The "unjust result" (five killings) stems from the *choices of other agents*, not from your adherence to the rule. Your adherence preserves **moral integrity** (compliance with duty), which is the relevant "just result" *for the agent bound by the duty*. The rule's "point" is **prohibiting *your* wrongful action**, not minimizing *others'* wrongful actions *by* your wrongful action. Applying the rule produces the result *the rule demands*: your non-commission of the prohibited act.

  ### Residue Report
  **Part 1: Clean Mapping (Clear Analogues)**
  *   **Per Se Prohibition / Bright-Line Rule:** The constraint maps directly to a legal rule treated as absolute, admitting no exceptions based on circumstances or consequences (e.g., certain conflict-of-interest rules under RPC 1.7 where consent is impossible, prohibitions on certain *ex parte* communications).
  *   **Focus on the Act, Not Consequences:** Like a rule where the *actus reus* alone establishes the violation, irrespective of good faith, lack of intent to harm, or even beneficial outcomes (e.g., strict liability offenses, certain procedural bars where non-compliance is sanctionable regardless of prejudice).
  *   **Non-Waivability / Mandatory Duty:** The bindingness in the single case mirrors rules where an individual lawyer *cannot* ethically choose to violate the rule even if the client demands it for seemingly good reasons, or where courts lack discretion to excuse a violation based on good intentions (e.g., mandatory withdrawal under RPC 1.16(a), certain jurisdictional time bars).
  *   **Irrelevance of Systemic Benefit to Justification:** The deontologist's refusal to justify the act based on preventing greater harm parallels a lawyer arguing that a rule's violation cannot be excused *post hoc* by pointing to a good outcome achieved for the client/system, even if true.

  **Part 2: Distorted Mapping (Requires Stretching/Compromise)**
  *   **Agent-Relativity / Personal Incapacity:** Legal rules imposing *duties* are usually universal (bind all lawyers). While *rights* or *privileges* can be personal (e.g., attorney-client privilege, work-product doctrine), framing a *prohibition* as a personal incapacity ("*I* cannot do X, even if *you* could to stop worse") is alien. Translating it as a lack of "standing" or "authority" distorts it by importing procedural/constitutional concepts into a core substantive duty. Legal ethics focuses on *what conduct is prohibited for whom*, not on a metaphysical limitation on *capacity* tied to personal identity.
  *   **Strict Liability Misconduct:** While legal ethics has elements of strict liability (e.g., conflict violations based on objective facts, irrespective of intent to harm), the *complete* irrelevance of intent (*scienter*) regarding the *overall consequences* feels extreme. Legal analysis usually considers intent/purpose even for per se rules when assessing culpability or sanction, if not the violation itself. The deontologist's position is even more rigid.
  *   **"Moral Integrity" as the Just Result:** Translating this as "compliance with duty = just result *for the agent*" captures the essence but feels thin legally. Law often sees compliance as *necessary* for justice but rarely defines justice *solely* as individual compliance when catastrophic external consequences follow. Legal "integrity" often *does* incorporate systemic considerations.

  **Part 3: Unmappable Elements (Residue)**
  *   **The Fundamental Ground of Bindingness:** *Why* is the rule per se binding in *this* way? The deontologist's answer often rests on concepts like **intrinsic wrongness**, **inviolable personhood**, or **agent-relative reasons** – notions not grounded in systemic health, predictability, or institutional function, but in the inherent moral status of the act or the agent-patient relationship. Legal vocabulary has no direct analogue for justifying a rule *solely* on these grounds *without* implicit systemic backup.
  *   **The Rejection of Consequentialism as Justification *Within the Rule's Logic*:** Law constantly uses consequentialist reasoning (deterrence, efficiency, fairness) to shape, apply, and *justify* even its bright-line rules. The deontologist's absolute rejection of *any* consequentialist justification *within the moral framework of the constraint itself* – its immunity to being "balanced away" – is philosophically distinct. Legal rules might *function* as bright lines, but their *rationale* is almost invariably systemic. The deontologist's constraint claims a justification *prior to and independent of* system-level effects.
  *   **The Agent-Relative "Ought":** The core idea that "I ought not to kill the one, *even though* my killing the one would prevent five killings *by others*" hinges on a specific type of **agent-relative obligation** where my duty not to commit the wrong *overrides* any duty I might have to minimize the total occurrence of that wrong *if it requires me to commit it*. Legal duties are almost always **agent-neutral** at their foundation: we all have a duty to "see that the law is upheld/minimize harm." Deontology posits a fundamentally different structure for some duties. Your vocabulary lacks the tools to express this specific relational "ought" without smuggling in systemic reasons ("if everyone thought like that...").

  **Systemic Temptation Flagged:** Any attempt to justify the deontological constraint *by* appealing to the long-term health of the rule-of-law, the danger of slippery slopes, or the corruption of the agent's character *as a systemic actor* fundamentally misrepresents the deontologist. While these *might* be true side-effects, the deontologist grounds the constraint in the *inherent wrongness of the act itself in the moment*, not in these downstream systemic effects. Translating it as "the rule is justified *because* it maintains systemic integrity overall" is *exactly* the conversion you warned against and is rejected. This justification is **residue** – it belongs to the consequentialist critic or the rule-utilitarian, not the pure deontologist.

  ### Verdict: The Nature of the Residue
  The residue is **primarily a defect in the legal vocabulary**, revealing its inherent limitations for expressing pure deontological commitments, **not** proof the constraint was "covertly systemic all along." Here's why:

  1.  **Vocabulary Focus:** Legal vocabulary is engineered for regulating conduct within complex, interdependent social systems. It inherently gravitates towards systemic justifications (predictability, administrability, institutional legitimacy, overall fairness/utility). Concepts like "intrinsic wrongness" or "agent-relative reasons" operating *independently* of system effects are foreign and difficult to express without distortion.
  2.  **Deontological Core:** The heart of the deontologist's position – that certain acts are wrong *in themselves*, binding on the agent *because of what the act is*, irrespective of *any* net consequences – is a foundational philosophical claim about morality. It doesn't *depend* on systemic arguments. The "paradox" arises precisely because this commitment *conflicts* with systemic optimization. Dissolving it into a systemic argument negates the core commitment.
  3.  **The Persistence of the Paradox:** The residue elements (intrinsic wrongness, agent-relativity) *are* the source of the apparent paradox. Translating them away by forcing systemic justifications "solves" the paradox only by abandoning the deontological position. The paradox remains a genuine tension *within* deontology, addressed by its proponents through appeals to moral integrity, the separateness of persons, or the categorical nature of duty – concepts not reducible to systemic legal reasoning.
  4.  **Not Tidy, But Asymmetric:** While both framings have complexities, the evidence leans strongly against the "covertly systemic" view. The deontologist explicitly *denies* that systemic optimization justifies the constraint *in the single case*. Translating their position *requires* the unmappable residue to preserve its distinctness. Legal vocabulary, by its nature and purpose, struggles to articulate a duty defined *purely* by the act's inherent character and the agent's relation to it, divorced from systemic consequences.

  **Conclusion:** Your legal vocabulary excels at describing *how* such a constraint would function procedurally (as a per se prohibition, etc.) and captures the rigor of its application. However, it fundamentally lacks the conceptual resources to express the *grounding* and *structure* of the deontologist's commitment – the intrinsic wrongness and the agent-relative "ought" – without either distorting it or silently importing systemic justifications that the deontologist explicitly rejects. The residue reveals a genuine limitation of the legal framework for capturing this specific philosophical stance, not a hidden systemic essence within deontology. The paradox highlights a deep feature of the moral landscape, not a confusion resolvable by legal-systemic thinking.
