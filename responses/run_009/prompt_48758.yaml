answer: |-
  *(stroking my beard thoughtfully)* You speak truly that we agree on the observable constant conjunction—fire touching cotton, then burning. Where we diverge is in the *ground* of that regularity. You take the sequence as brute, unexplained pattern, while I root it in divine agency: God freely *chooses* to create the burning *upon* the contact, sustaining this connection moment by moment. Your "continuation of regularity" is mere repetition without an anchor; you project the past *because* it happened, offering no *reason* why the pattern holds beyond inertia. My addition explains *why* the conjunction exists: God's consistent will. 

  Your charge of "stacking" misreads the ontology. God's custom isn't a *second* regularity behind the first; it is the *causal origin* of the observed sequence itself. Without this active will, the conjunction is a hollow accident, devoid of whyness. Consider the man created mid-burning: on your view, why *shouldn't* he believe burning precedes fire? Only divine custom explains the temporal order's necessity for induction. And yes, God *could* alter His custom—precisely revealing that your "continuation" is contingent, not inherent in nature. Your theory silently assumes the very necessity I deny, while offering less: you have an unexplained stack of regularities; I have a single, intentional Agent whose will *produces* the regularity. The burden is on you: why *does* the conjunction persist, if not upheld?
