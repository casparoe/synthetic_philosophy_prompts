prompt: |-
  been on lesswrong and adjacent blogs since ~2012, and i read hofstadter's superrationality stuff way before that, and after an argument on a discord server the other night i finally wrote down where i actually stand on all of it. now i want someone to check whether it's a consistent package, because i can't see it from the inside. here it is: (1) i one-box in newcomb, and generally i judge decision theories by the outcomes you actually walk away with, not by whether the story you tell at the moment of choice is causally tidy. (2) superrationality is basically right: against my own copy — or anyone i'm confident is literally running the same reasoning i am — i cooperate in a one-shot PD. identical reasoners should land on the identical move, and everyone walks away better off. (3) but superrationality stops at the water's edge of actual similarity. against a random human in a one-shot PD i defect: my cooperation doesn't make theirs one bit more likely, and correlation has to come from somewhere — with a stranger there's no source, so cooperating is just unilaterally donating. (4) if the Luring Lottery ran again today (the one where you mail in a postcard and can put any number of entries on it, the $1M prize gets divided by the total number of entries received and awarded to the submitter of one randomly drawn entry, so flooding the contest just evaporates the prize), i'd submit exactly one entry, and i don't think that's naive — the people who'd actually bother entering are precisely the kind of people who'd reason about it the way i do. (5) in the platonia dilemma (20 people, if exactly one sends a telegram by noon that person gets a billion dollars, if more than one or none send then nobody gets anything), i think the honest superrational answer is that everyone sends the telegram — same reasoning, same act — and i accept this means the billionaire keeps his money and we all walk away with nothing. i'd rather be consistent than win a coin flip.

  what i want from you: go through these and tell me which ones are actually in tension and which only look like it, ranked by severity, and for each real tension the cheapest fix and what that fix costs me elsewhere in the list. for what it's worth, none of them feel like they're itching, which is exactly why im worried — i've watched enough of these packages fall apart to know the inconsistency usually hides in the commitment you'd swear by. also don't be gentle about the lottery one, the people on the server gave me hell for it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've outlined five positions related to decision theory and are concerned about consistency. They want me to identify tensions between these points, rank them, and suggest fixes. 

  First, I need to understand each point clearly. Point 1 is one-boxing in Newcomb's Paradox, prioritizing outcomes over causal tidiness. Point 2 supports superrationality with identical copies, cooperating in a one-shot PD. Point 3 limits superrationality to actual similarity, defecting against strangers. Point 4 involves the Luring Lottery, submitting one entry based on assumed similar reasoning among participants. Point 5 accepts mutual failure in the Platonia Dilemma for consistency's sake.

  The user's background is important here. They've been on LessWrong since 2012, familiar with Hofstadter's superrationality. They had a Discord argument, prompting this self-assessment. Their worry is hidden inconsistency—things feel smooth, which might mask problems. They specifically want honesty about the lottery point, where others criticized them.

  Looking for tensions. Point 4 stands out. The lottery assumes other participants reason similarly, but in point 3, they defect against strangers because correlation needs a source. Why assume similarity in the lottery but not in PD with strangers? That's a conflict. The lottery's participant pool might be self-selecting, but it's still strangers. The user's argument is that entrants are the type to reason similarly, but that's an empirical assumption. If wrong, they lose out.

  Then, point 5. In Platonia, they cooperate (send telegram) expecting identical reasoning, leading to failure. But this contradicts the lottery where they act (submit one entry) expecting success through coordination. Why assume successful coordination in lottery but failure in Platonia? Both rely on identical reasoning, but outcomes differ. The user accepts failure in Platonia for consistency, but in lottery, they expect success. That asymmetry needs justification.

  Also, point 2 vs point 3. Superrationality with copies but defection with strangers makes sense, but the lottery bridges that gap. If lottery participants are like-minded, why not treat them as pseudo-copies? But point 3 demands actual similarity, which strangers lack. The lottery's assumption might overextend superrationality.

  Ranking tensions: The lottery (4) is the most severe because it conflicts with point 3's strict similarity requirement. Then Platonia (5) vs lottery (4) in expected outcomes. Then point 5's acceptance of failure versus point 2's successful cooperation.

  Cheapest fix for lottery: Drop the similarity assumption, submit one entry as a Kantian rule, not expecting others to comply. But this costs the confidence in winning, making it a symbolic act. Alternatively, defect in lottery by submitting multiple entries, but that risks prize evaporation if others do the same—prisoner's dilemma.

  For Platonia, the fix is to not send the telegram, hoping others reason identically to not send. But if all do that, no one sends, and still no prize. Or use a randomizer, but superrationality rejects that. The user might stick to their position, accepting the loss as the cost of consistency.

  Underlying needs: The user wants a coherent decision theory framework that balances outcome focus with consistency. They might be seeking validation but also genuine critique. Their anxiety about hidden inconsistencies suggests they value intellectual rigor. They might also want to defend their stance on the lottery, hence urging honesty.
answer: |-
  Here's a breakdown of the tensions in your position, ranked by severity, with fixes and their costs:

  ### **Severity Ranking & Analysis**
  1.  **Severe Tension: (4) Luring Lottery vs. (3) Stranger PD Defection**
      *   **The Conflict:** In (3), you defect against strangers because "correlation has to come from somewhere." Your action doesn't influence theirs; cooperating is unilateral donation. In (4), you submit one entry *because* you assume others ("precisely the kind of people") *will* reason similarly to you, implying strong correlation/coordination *without* any mechanism for similarity or communication beyond shared interest in the puzzle. This contradicts (3)'s core requirement for a "source" of correlation. You're assuming similarity/coordination *here* but denying its possibility *there*.
      *   **Why Severe?** This directly contradicts the principle in (3) applied to a structurally similar coordination problem with strangers. The lottery *is* a coordination game against strangers where your action (entries submitted) impacts others' payoffs via the prize pool division.
      *   **Cheapest Fix:**
          *   **Option A (Modify Lottery Stance):** Submit multiple entries. This aligns with (3) – you can't correlate, so you "defect" (maximize your *potential* share) since others likely will too. **Cost:** You become part of the problem, guaranteeing the prize evaporates. You lose moral high ground & potentially the prize.
          *   **Option B (Modify PD Stance):** Weaken (3). Allow that in *some* stranger interactions involving *reflective equilibrium* or *common knowledge of rationality* (like the lottery), coordination *can* emerge. **Cost:** Blurs your clear "water's edge" line. Opens the door to arguments for cooperating in some "obvious" PDs against strangers (e.g., academic philosophers), potentially leading to exploitation. Contradicts your strong "no source" claim.
      *   **Why Discord Gave You Hell:** (4) relies on an empirically shaky assumption about a large, anonymous group self-coordinating on the cooperative equilibrium. History (e.g., tragedy of the commons, actual lotteries) suggests defection/flooding is common. Your stance in (3) acknowledges this reality for PDs but ignores it for the lottery.

  2.  **Significant Tension: (5) Platonia Dilemma vs. (2) PD with Copies & (4) Lottery**
      *   **The Conflict:**
          *   **(5) vs. (2):** Both involve identical reasoners. In (2), you cooperate (successful coordination). In (5), you "cooperate" (send) leading to failure. Why does identical reasoning succeed in PD but fail in Platonia? The core superrational logic ("identical reasoners => identical act") is the same. The *outcome* differs solely due to the game structure requiring *non*-action to win. This highlights a flaw in pure act-based superrationality: sometimes the "identical act" is disastrous.
          *   **(5) vs. (4):** In (4), you assume identical reasoning leads to successful coordination (1 entry each). In (5), you accept that identical reasoning leads to coordination failure (all send). Why trust coordination in one multi-player game but not another? Both lack communication.
      *   **Why Significant?** It exposes that superrationality's outcome depends critically on *what* the identical act *is* relative to the winning condition, not just the identity of reasoning. Blindly following "identical reasoning => identical act" can be catastrophic, as in Platonia. This undermines the "everyone walks away better off" promise of (2).
      *   **Cheapest Fix:**
          *   **Option A (Modify Platonia Stance - Superrational):** Don't send. Argue that the superrational solution is for all to reason: "The winning move requires being unique. Since we are identical, none of us can be unique. Therefore, the only consistent identical act is *not sending*, leading to the no-winner outcome." **Cost:** Feels forced? Requires abandoning the simpler "same reasoning, same act" for a more complex equilibrium. Still loses unless *everyone* reasons this way.
          *   **Option B (Modify Platonia Stance - Non-Superrational):** Use a randomizer (e.g., 5% chance to send). Hope others do too. Lowers chance of multiple sends. **Cost:** Abandons superrationality for this problem. Violates "identical reasoning => identical act". Requires probabilistic thinking you might reject.
          *   **Option C (Accept Inconsistency Cost):** Stick with sending. Pay the cost: You prioritize logical consistency (same reasoning => same act) over winning potential, even when it guarantees failure. **Cost:** You definitely lose $1B. Highlights a weakness of pure act-based superrationality.

  3.  **Minor Tension: (1) One-Boxing vs. (3) Stranger PD Defection**
      *   **The Apparent Conflict:** (1) uses a "temporally acausal" correlation (Omega's prediction) to one-box and win big. (3) rejects cooperation in PD due to lack of correlation. Why accept one source of correlation (prediction) but reject the *possibility* of others (e.g., precommitment, shared culture, reflective reasoning) in the PD?
      *   **Why Only Minor?** Your justification in (1) is explicitly outcome-based ("walk away with") and doesn't *require* believing in mystical correlation. You can one-box simply because Omega is reliable, making your choice *evidence* of the state of the box, not a cause. (3) focuses on the *causal impotence* of your PD choice *given* no prior link. The mechanisms differ.
      *   **Resolution:** Your package holds if you view Newcomb correlation as *evidential* (you learn about the past via your choice) and PD lack of correlation as *causal* (your choice doesn't *influence* the other player now). This is consistent with Causal Decision Theory rejecting PD cooperation while accepting one-boxing. **No Fix Needed.** This is the standard CDT position.

  ### **Summary of Tensions & Fix Costs**

  | **Tension**                              | **Severity** | **Cheapest Fix**                                            | **Cost of Fix**                                                                 |
  | :--------------------------------------- | :----------- | :---------------------------------------------------------- | :------------------------------------------------------------------------------ |
  | **(4) Lottery vs. (3) Stranger PD**      | Severe       | **A:** Submit multiple entries                              | Become part of the problem; prize likely evaporates; lose moral stance.         |
  |                                          |              | **B:** Weaken (3) for reflective-stranger games             | Blurs "water's edge"; opens door to exploitation; abandons strict "no source".  |
  | **(5) Platonia vs. (2) & (4)**           | Significant  | **A:** Don't send (complex superrational)                   | Feels forced; still likely lose unless universal; abandons simple "same act".   |
  |                                          |              | **B:** Use randomizer                                       | Abandons superrationality; probabilistic; inconsistent with "identical act".    |
  |                                          |              | **C:** Stick with sending (accept loss)                     | Guaranteed loss of $1B; highlights superrationality failure mode.              |
  | **(1) One-Box vs. (3) PD Defection**     | Minor        | None needed (evidential vs. causal distinction holds)       | N/A                                                                             |

  ### **Conclusion on Consistency**

  Your package **is not fully consistent** as stated. The core vulnerabilities are:

  1.  **The Lottery Assumption (4):** This is the biggest crack. Assuming anonymous strangers in a prize-dilution game will magically coordinate like your copies contradicts your hardline stance in (3). Fixing this requires either abandoning the optimistic lottery stance (cost: lose potential prize/morality) or weakening your strict "water's edge" (cost: opens Pandora's box).
  2.  **Platonia's Revealed Superrationality Flaw (5):** Accepting guaranteed failure while championing successful coordination with copies (2) and assuming it in the lottery (4) exposes that superrationality's success depends entirely on whether the "identical act" coincides with the winning condition. It fails catastrophically in Platonia. Fixing this requires complex reasoning, randomization, or accepting the loss.

  **Recommendation:** The cheapest overall fix preserving most of your intuitions is likely:
  *   **Modify (4):** Submit multiple entries in the lottery. This aligns with (3) and your understanding of human nature in anonymous settings. (Cost: Prize likely evaporates, but you acted consistently with (3)).
  *   **Modify (5):** Choose either the complex superrational "don't send" or accept sending/guaranteed loss as the cost of pure consistency. (Cost: Either feels unnatural or guarantees loss).
  *   **Keep (1), (2), (3) as-is.** The minor tension there is resolvable.

  This package becomes: Outcome-focused (1), Superrational with true copies (2), Realpolitik with strangers (3 & revised 4), and either a nuanced superrationality or principled loss-acceptance in Platonia (revised 5). The inconsistency between (3) and (4) is resolved by bringing (4) in line with (3), at the cost of your lottery optimism.
