answer: |-
  Here’s an exam question, model answer, and marking scheme designed to push students into the heart of the "stakes transfer" problem and the epistemology of testimony.

  ---

  ### Essay Question (90 Minutes)
  **Critically evaluate whether the phenomenon of "stakes transfer" – where a speaker with low stakes knows that *p*, testifies truly to a hearer with much higher stakes, yet the hearer allegedly fails to know *p* – poses a fatal problem for Pragmatic Encroachment (PE). In your answer, you must:**

  1.  **Explain precisely why the stakes transfer case is thought to challenge PE.**
  2.  **Assess whether and how a defender of PE can respond to this challenge.**
  3.  **Consider whether competing theories (specifically, Contextualism and Classical Invariantism) handle the case more successfully.**
  4.  **Engage deeply with the specific epistemological issues raised by testimony in this scenario: Does testimony transmit knowledge itself, or merely evidence? Can a hearer ever know *p* solely by trusting a speaker who knows *p* when the hearer’s practical situation differs significantly?**

  *Focus on the philosophical reasoning and implications, not historical citations.*

  ---

  ### Model Answer (Approx. 600 words)

  The stakes transfer case presents a sharp challenge to Pragmatic Encruachment (PE). PE holds that whether a true belief constitutes knowledge depends partly on practical factors like the stakes of being wrong. In the transfer case: Low-Stakes Speaker (LS), facing minimal risk, has evidence sufficient to know *p* (e.g., "The conference is in Ballroom A"). LS testifies this to High-Stakes Hearer (HH), whose career depends on *p* being true. HH believes *p* solely based on LS's testimony. PE seemingly entails HH does *not* know *p*, despite LS knowing *p* and HH having the same testimonial evidence. The core challenge is that this appears absurd: how can knowledge vanish when conveyed identically from a knower to a recipient, solely due to the recipient's unrelated practical situation? This seems to violate plausible principles about testimony, like the idea that knowledge can be transmitted or that a true belief based *solely* on the word of a knower should itself be knowledge.

  A PE defender can respond by rejecting the transmission principle. They argue testimony provides *evidence*, not automatically *knowledge*. Knowledge requires not just truth and belief, but sufficient warrant relative to *current* practical context. LS’s warrant is sufficient for *her* low-stakes context. When HH receives the testimony, it constitutes evidence. However, for HH, the *same* evidence must now meet a higher warrant threshold demanded by *his* high-stakes context. Precisely because HH’s stakes are high, LS’s word alone provides insufficient warrant *for HH* to reasonably act on *p* without further verification – just as we intuitively expect when much is at stake. PE explains why HH feels compelled to double-check, even knowing LS is reliable: her testimony isn’t *warrant-sufficient* for HH’s needs. Thus, knowledge isn’t "lost"; HH never had it *in the first place* relative to his context. The evidence transferred, but the warrant required for knowledge is context-sensitive.

  Competing theories offer different perspectives. **Classical Invariantism (CI)** denies stakes affect knowledge. If LS knows *p*, and CI accepts that testimony from a knower can transmit knowledge (a principle CI often struggles with generally), then HH should know *p* too, regardless of stakes. CI thus avoids the alleged absurdity of the transfer case. *However*, CI faces the opposite burden: it struggles to explain why HH, knowing LS is reliable, still feels rationally compelled to seek further evidence when stakes are high. It makes HH’s (often rational) anxiety seem baseless or irrational, which is counterintuitive. **Contextualism** offers a different resolution. It holds that "knows" expresses different relations in different conversational contexts. When attributing knowledge to LS in her low-stakes context, "S knows p" is true. When evaluating HH in his high-stakes context, the standards for "knows" rise. Thus, "HH knows p" is false *in HH's context*, not because HH lacks what LS had, but because the meaning of "knows" has shifted. This avoids the *metaphysical* absurdity of the same evidence constituting knowledge for one but not the other *in the same context*, but replaces it with a *semantic* explanation. The challenge for Contextualism is whether it truly solves the *epistemic* worry or merely relabels it: does HH *really* lack something epistemically important that LS had, or is it just a linguistic shift? It also raises questions about whether testimony can bridge contextual standards.

  The heart of the stakes transfer challenge lies in the epistemology of testimony. If testimony *transmits knowledge* (like a guarantor), then HH should inherit LS's knowledge-status. But PE and arguably Contextualism suggest testimony primarily provides *evidence*, and knowledge is always *re-created* locally based on that evidence *relative to the recipient's context* (epistemic and practical). The transfer case powerfully highlights this tension. It forces us to ask: Is knowing *p* via testimony simply a matter of trusting a knower, or is it always a matter of the hearer's own evidence meeting their own context's standards? PE embraces the latter view, arguing that the stakes transfer case isn't a reductio but a reflection of how practical rationality shapes the demands for warrant, even in social epistemology. The burden is on opponents to explain away the intuitive pull of HH's felt need for more evidence without appealing to stakes affecting knowledge-related warrant. Ultimately, the stakes transfer case doesn't refute PE; it exposes a deep feature of PE's account of testimony as evidence provision, demanding we confront how knowledge depends on the agent's situated perspective.

  ---

  ### Marking Scheme (Out of 20 Marks)

  *   **Understanding & Explanation (0-6 Marks):**
      *   **0-2:** Superficial or incorrect explanation of PE, stakes transfer case, or competing theories. Misstates core challenge.
      *   **3-4:** Adequately explains PE, the stakes transfer case, and the basic challenge ("same evidence, different knowledge status seems absurd"). Mentions CI/Contextualism but lacks precision.
      *   **5-6:** Clear, precise explanation of PE's core thesis. Accurately articulates the stakes transfer case *and* why it's seen as a challenge to PE (e.g., violation of intuitive testimony principles). Clearly distinguishes CI and Contextualism's core commitments regarding stakes and knowledge.

  *   **Analysis of PE's Response (0-5 Marks):**
      *   **0-1:** Fails to articulate a plausible PE response or misrepresents it.
      *   **2-3:** States that PE denies testimony transmits knowledge/insists warrant is local/relative to context. Explains *that* HH needs more warrant, but not *why* in PE terms (evidence insufficient *relative to HH's stakes*). Limited connection to testimony.
      *   **4-5:** Articulates a robust PE response: Testimony provides evidence; knowledge requires warrant sufficient for the *hearer's* practical context; thus LS's warrant doesn't "transfer," HH needs more evidence *because* of their stakes. Explicitly links this to testimony as evidence-provision vs. knowledge-transmission. Explains the rational compulsion for HH to check.

  *   **Analysis of Competing Theories (0-5 Marks):**
      *   **0-1:** Superficial or incorrect treatment of CI/Contextualism regarding the case.
      *   **2-3:** States CI denies stakes affect knowledge, so HH should know if LS does (avoids absurdity), but struggles with HH's anxiety. States Contextualism says "knows" standards shift, so both attributions can be true/false relative to their contexts. Limited analysis of strengths/weaknesses.
      *   **4-5:** Deep analysis: Contrasts CI's avoidance of the absurdity with its struggle to explain HH's rational anxiety/stakes sensitivity. Contrasts Contextualism's semantic solution with the question of whether it addresses the underlying epistemic worry (does HH *lack* something?) and its implications for cross-context testimony. Explicitly compares how each handles the testimony angle vs PE.

  *   **Engagement with Testimony & Philosophical Depth (0-4 Marks):**
      *   **0-1:** Mentions testimony but doesn't engage deeply. Answer stays at the level of labeling positions/applying bank cases.
      *   **2-3:** Clearly identifies the key testimony question (transmission vs. evidence/re-creation). Discusses how this impacts the case for PE (e.g., PE rejects transmission). Touches on whether HH can know by trusting a knower when stakes differ.
      *   **4:** Sophisticated engagement: Explicitly frames the core philosophical issue as whether testimony transmits *knowledge status* or merely *evidence* requiring local warrant assessment. Insightfully discusses the implications for social epistemology (knowledge via others under varying stakes). Integrates this seamlessly into the evaluation of PE's response and the comparison with rivals. Addresses the fundamental question posed: Does the case reveal something deep about testimony and knowledge, or is it merely an artifact of a theory?

  **Grade Boundaries:**

  *   **A (17-20):** Excellent (5-6, 5, 5, 4). Demonstrates comprehensive understanding and precise explanation. Provides a sophisticated, well-structured analysis of PE's response, deeply engaging with the testimony mechanism (evidence vs transmission). Offers insightful, balanced critique of CI and Contextualism, explicitly addressing how they handle testimony across stakes and whether they resolve the *epistemic* worry. Integrates the testimony theme throughout. Exceptional philosophical depth and clarity.
  *   **B (13-16):** Good (4-5, 4, 4, 2-3). Solid understanding and explanation. Presents a coherent PE response (warrant local, evidence insufficient for HH's stakes). Correctly identifies CI avoids absurdity but struggles with anxiety, and Contextualism shifts standards. Mentions the testimony challenge (transmission vs evidence) and its relevance to PE, but analysis may be less developed or integrated. Good analysis of theories, but less depth on the specific testimony epistemology. May lean towards description over deep evaluation on the testimony point.
  *   **C (9-12):** Satisfactory (3-4, 3, 3, 1-2). Basic understanding of PE and the case. Some attempt at a PE response (maybe "HH needs more evidence"). Identifies CI and Contextualism positions superficially. Mentions testimony but doesn't develop the core philosophical tension (transmission vs evidence). May contain minor errors or significant omissions. Focuses more on restating positions/known cases than deep application to *this* testimony puzzle.
  *   **D (5-8):** Poor (2-3, 2, 2, 0-1). Significant misunderstandings of PE, the stakes case, or rival theories. PE response weak or absent. Treatment of rivals inaccurate or minimal. Little to no engagement with testimony beyond mentioning it. Answer lacks structure and coherence.
  *   **F (0-4):** Fail (0-2, 0-1, 0-1, 0). Fundamental errors, irrelevant, or minimal attempt.

  **Key A vs B Differentiator:** The **A** answer *centrally* and *insightfully* engages with the specific epistemological problem of testimony raised by stakes transfer (Does testimony transmit knowledge or only evidence? Can HH know by trusting LS given different stakes?). It uses this to drive the evaluation of PE and its rivals. The **B** answer correctly explains the positions and the case, mentions the testimony challenge, and analyzes the theories, but lacks the sustained, deep focus on *how testimony functions epistemically* in this specific scenario as the core philosophical puzzle. The B answer might *state* that PE sees testimony as evidence, but the A answer *exploits* this view to defend PE against the challenge and contrast it meaningfully with rivals' approaches to testimony.
