answer: |-
  The flaw lies in **step (4)**:  
  *"An act that would make a difference only with effectively-zero probability makes no difference, full stop."*  

  This step quietly replaces **expectation** (probabilistic difference-making) with **certainty** (deterministic difference-making), collapsing the moral relevance of tiny probabilities. Here’s how to break it down:

  ### Why (4) Fails:
  1. **Consequentialism Requires Expected Impact**:  
     A consistent consequentialist *must* evaluate acts based on their *expected* consequences—the sum of possible outcomes weighted by their probabilities. Even if the probability of your purchase triggering a threshold is tiny (e.g., 1/10,000), its impact if triggered is enormous (e.g., causing 1,000 additional chicken deaths).  
     - **Expected harm** = (Probability of impact) × (Magnitude of impact)  
       = (1/10,000) × 1,000 chicken deaths = **0.1 chicken deaths**.  
     This is non-negligible—especially when multiplied across millions of acts.

  2. **The Fallacy of "Effectively Zero"**:  
     "Effectively zero" is a practical heuristic, not a philosophical truth. Consequentialism doesn’t care about psychological convenience; it cares about *actual expected value*. Dismissing tiny probabilities because they *feel* insignificant ignores their aggregate or proportional moral weight.  
     - **Analogy**: Buying a lottery ticket with a 1/1,000,000 chance of winning $1,000,000 has an expected value of $1. Calling this "effectively zero" because winning is unlikely is mathematically incoherent.

  ### Why You Missed It:
  - **The Eye Slides Over the Magnitude/Probability Trade-off**:  
    Step (4) feels intuitive because we instinctively discount low-probability events in daily life (e.g., worrying about asteroid strikes). But in collective harm cases, *the magnitude scales inversely with probability*. The smaller the chance your act triggers harm, the *larger* the harm when triggered (because thresholds bundle many units). Your argument treats probability and magnitude separately, but consequentialism demands their product.

  - **Isolation of Steps**:  
    Steps (2) and (3) are empirically sound but misused. Batch processing *creates* the threshold mechanism, but it doesn’t erase responsibility—it redefines it probabilistically. Step (4) then smuggles in a non-consequentialist assumption ("no certainty = no responsibility") while claiming fidelity to (1).

  ### How to Revise Without Abandoning (2):
  1. **Reject (4)**: Replace it with:  
     *"An act with a tiny probability of causing large harm still has non-zero expected harm. For a consequentialist, this expected harm determines its wrongness."*  

  2. **Modify the Conclusion**:  
     - Individual acts *do* make a difference—not causally, but probabilistically.  
     - The wrongness of buying chicken isn’t "zero"; it’s *small but non-zero*. Collectively, these small expected harms aggregate to the actual harm we observe.  

  3. **Preserve Empirical Insights**:  
     Keep (2) and (3)! Thresholds and low probabilities are real. But argue that consequentialism *must* engage with expected value:  
     > *"While any single purchase is unlikely to trigger a production increase, its expected impact scales with the size of the threshold it might cross. In a system processing millions of chickens, each purchase carries a fractional share of responsibility for maintaining demand—quantified by its expected contribution to future batches."*  

  ### Cost to Your Original Argument:
  - **Consequentialism Intact**: You remain true to (1). Expected utility survives.  
  - **Loss of 'Clean' Absolution**: You can no longer claim individual acts are "harmless." But this is a strength—it resolves the paradox without denying collective harm.  
  - **Scope Restriction**: The argument *only* generalizes to large-scale harms with threshold effects (elections, carbon emissions). It doesn’t dissolve all collective responsibility—it quantifies it.  

  ### Why This Fixes (9):
  Individual contributions **do** probabilistically "help bring about" harm. Each flight purchase, for example, has a small chance of tipping an airline’s fleet-expansion decision, with massive carbon consequences. Billions of acts with small expected harms *are* the decomposition of the collective wrong.  

  ### Supervisory Nod:
  Your supervisor likely rejected the argument because (4) violates core consequentialism. By embracing expected impact, you retain the empirical realism of (2)–(3) while avoiding moral dissolution. The revision strengthens your chapter: it acknowledges thresholds *without* letting them erase agency.  

  **Key insight for revision**: Thresholds don’t eliminate difference-making; they transform it into a game of expected value. The eye slides over this because we’re hardwired to equate "difference" with "visible, immediate effect." But morality isn’t biology—consequentialism demands math.
