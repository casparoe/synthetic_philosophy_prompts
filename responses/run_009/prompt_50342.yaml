prompt: |-
  You're a professional ethicist who spends a lot of time on the demandingness literature — Singer, Scheffler, Murphy, Railton, that crowd. I teach a seminar where students have all memorized the standard story: consequentialism is the monster that would eat your whole life, and deontology is the humane alternative that leaves room for your own projects. I want a case that runs the other direction, to unsettle them.

  The spec: a realistic scenario (caregiving, volunteering, workplace — no trolleys, no transplant surgeons, and don't recycle Singer's pond either, they know it cold) in which a deontologist who takes constraints and undertaken obligations seriously ends up REQUIRED to shoulder a bigger burden than the act consequentialist, who has a principled stopping point. Two constraints on how this works:

  1. The deontologist's extra demandingness can't come from them just having a demanding temperament or a weirdly strong view of beneficence. It has to fall out of structural features — e.g. the bindingness of an obligation already incurred, or the fact that a constraint blocks the cheap-but-slightly-dirty way of helping, leaving only the expensive route.
  2. The consequentialist's stopping point has to be genuine (marginal utility goes negative, burnout predictably turns you into a net burden on others, whatever), not an ad hoc fudge.

  Once you've got the scenario, I need four things: (1) the verdicts — walk through what the act consequentialist concludes and what the deontologist concludes, from their own premises; (2) identify exactly which feature of the case is doing the work; (3) say what happens if you remove that feature — does it collapse back into the usual story where deontology is the lax one; and (4) the deontologist's best fight-back (latitude of imperfect duty, thresholds on rescue obligations, whatever you think is strongest) and an honest verdict on whether it saves them or just relocates the demandingness somewhere else.

  Please brainstorm two or three candidate scenarios before committing, and tell me briefly why you picked the winner over the runners-up. Also think about whether an indirect or rule consequentialist could match the deontologist's verdict by their own lights — if they can, mention it, that's actually interesting for the seminar too. Keep the final scenario itself to a paragraph; the analysis can run longer.
reasoning: |-
  Okay, the user is a philosophy professor teaching a seminar on ethics. They want a realistic scenario where deontology ends up being more demanding than consequentialism, specifically to challenge the standard narrative students have memorized. The case must avoid trolleys and Singer's pond, and focus on structural features like binding obligations or constraints blocking cheaper solutions.

  Hmm, the constraints are precise: (1) the deontologist's demandingness must stem from structural features, not temperament, and (2) the consequentialist's stopping point must be principled (e.g., marginal utility). 

  First, brainstorming candidate scenarios:
  - **Caregiving burnout**: Adult child caring for a parent with dementia. Deontology sees a binding filial duty, while consequentialism factors in sustainability. But this might feel too personal and risk students conflating duty with emotion.
  - **Workplace whistleblowing**: Employee uncovering fraud with contractual NDAs involved. Deontology's prohibitions against lying could force a costly resignation, while consequentialism might justify a less damaging leak. However, NDAs vary legally, making the obligation's bindingness debatable.
  - **Volunteer coordination**: Organizer locked into a failing project by explicit promises. Deontology demands exhausting all personal resources to honor commitments, while consequentialism cuts losses early. This highlights "obligations incurred" cleanly without emotional noise.

  The volunteer scenario wins because: 
  - It isolates structural features best (explicit promises create binding duties under deontology). 
  - The consequentialist exit (diminishing returns on effort) is objectively measurable. 
  - No legal murkiness unlike whistleblowing. 

  **Final Scenario**:  
  A volunteer coordinator ("Sam") commits via signed agreement to run a literacy program in a disadvantaged school. Midway, external funding vanishes. Deontology requires Sam to exhaust savings/personal time to fulfill the promise to children, as constraints block abandoning dependents. Consequentialism permits quitting once marginal effort yields net negative outcomes (burnout risks program collapse). 

  **Analysis**:
  1. **Verdicts**:  
     - *Deontologist*: Must continue—binding promise + special obligation to children creates a perfect duty.  
     - *Consequentialist*: May quit—sustained effort now risks health collapse, reducing future good.  

  2. **Key Feature**:  
     The *combination* of an explicit prior commitment and constraints against abandoning dependents. Remove either, and deontology relaxes (e.g., no signed promise = mere imperfect duty).  

  3. **Deontologist Fight-Back**:  
     Argue for "latitude" in imperfect duties or "ought implies can." But here, the explicit promise transforms it into a perfect duty with less wiggle-room. The demandingness shifts but persists—e.g., they might still owe restitution.  

  **Indirect Consequentialism Note**:  
  Rule consequentialists *might* mimic the deontologist to uphold promise-keeping norms. But if the rule "keep promises unless unsustainable" exists, they’d align with act consequentialists here—making the contrast sharper.  

  This should unsettle students by showing deontology’s rigidity in incurred obligations can *create* burdens consequentialism rationally avoids.
answer: |-
  Here's a scenario designed to flip the script, rigorously meeting your specs. After brainstorming three options (volunteer burnout, family caregiving with competing oaths, and workplace whistleblowing), I selected the **volunteer coordination scenario** as the strongest. Runners-up had flaws: the caregiving case risked conflating duty with emotional attachment, and the whistleblowing case introduced legal complexities that could muddy the structural obligations. The volunteer case cleanly isolates "binding prior commitment" + "constraint against abandonment" as the demandingness engine.

  ### The Scenario
  Sam, a volunteer coordinator for a literacy nonprofit, signed a formal agreement with a struggling school to run a 1-year program for 20 at-risk children. Midway, the nonprofit collapses due to fraud (unrelated to Sam). No other organizations can take over. If Sam quits, the children lose all support. Sam could:  
  (A) **Personally fund and run the program alone** using their savings ($15k) and evenings/weekends indefinitely, burning out within 6 months but giving the kids temporary stability.  
  (B) **Quit immediately** to preserve savings/energy for future effective work.  
  Act consequentialism (AC) permits (B); deontology (Kantian/contractualist) requires (A).

  ---

  ### Analysis  
  1. **Verdicts**  
     - **Act Consequentialist**: Chooses (B). Sam calculates that personal funding is unsustainable—burnout in 6 months leaves kids worse off (no transition time) and destroys Sam’s capacity for future high-impact work (e.g., training other tutors). Continuing has negative marginal utility: Sam’s health decline and lost earnings outweigh the children’s temporary gains. Principled stopping point: net expected welfare turns negative.  
     - **Deontologist**: Chooses (A). Sam’s explicit promise (formal agreement) creates a perfect duty to the children. The constraint against abandoning dependents (especially vulnerable parties to whom Sam is uniquely committed) blocks the "cheap exit" of quitting. Even if Sam’s sacrifice is suboptimal globally, the duty binds.  

  2. **Key Feature**  
     The **interaction of a prior undertaking (promise) with a constraint against harming through abandonment**. The promise creates a special obligation; the constraint forbids violating it, even to prevent greater harm elsewhere. Consequentialism avoids this by permitting trade-offs. Remove *either* feature:  
     - *No prior promise* (e.g., Sam volunteered ad hoc): Deontology reduces to imperfect duty (help, but not exhaustively).  
     - *No abandonment constraint*: Deontology might allow redirecting resources optimally.  
     → Both features force deontology into overdemandingness.  

  3. **Deontologist’s Best Fight-Back & Verdict**  
     - **Fight-Back**: Claim "ought implies can" or invoke *latitude in imperfect duties*. Argue Sam’s promise was conditional on nonprofit support (implied consent), reducing it to an imperfect duty.  
     - **Verdict**: Unconvincing here. The formal agreement specified "personal oversight," implying direct responsibility. Thresholds on rescue (e.g., "only until reasonable sacrifice") are murky—vulnerable dependents + explicit promise stretch "reasonable" to extremes. **Demandingness relocates**: Even if Sam quits, they owe restitution (e.g., finding replacements), which could still be crushing. The structure *inherently* generates burdens consequentialism sidesteps.  

  4. **Indirect/Rule-Consequentialist Angle**  
     Rule consequentialism (RC) *might* align with deontology if rules like "never break promises to the vulnerable" maximize welfare long-term. But in this case:  
     - A rule like "keep promises unless unsustainable" would permit (B), mirroring AC.  
     - RC could endorse Sam’s exit to avoid discouraging volunteers with impossible burdens.  
     → RC likely converges with AC, making deontology uniquely rigid.  

  ### Why This Works for Your Seminar  
  - **Unsettles Narratives**: Deontology isn’t "humane" here—it demands unsustainable sacrifice from structural rigor. Consequentialism isn’t monstrous—it has a *principled* exit.  
  - **Realistic**: Caregiving/volunteering stakes resonate; no contrived deaths.  
  - **Pedagogical Hook**: Students must confront how promises + constraints *create* duties that override optimization. The indirect consequentialist tangent enriches discussion on moral frameworks’ flexibility.  

  This forces students to see deontology’s "side-constraints" as potential *cages* and consequentialism’s flexibility as a *pressure valve*—a stark role reversal.
