prompt: |-
  I work as a policy analyst on the content-integrity team of a mid-sized online platform, and I am tasked with drafting the protocol our moderators will use when they encounter posts advancing conspiracy claims. The volume is high — several hundred escalations a week, each needing a disposition within 24 hours — and the stakes are asymmetric: an erroneous "harmful conspiracy theory" label suppresses legitimate criticism of institutions, while an erroneous pass amplifies claims that can cause real-world harm. Our moderators are trained on content policy but have no background in epistemology, so the protocol must be usable by someone reading it for the first time in the middle of a shift.

  What I do not want is the familiar editorial reflex of treating "conspiracy theory" as a synonym for "false." The philosophical literature has convinced me that this collapses several distinct things: a conspiracy as an event (corporations and governments demonstrably do conspire, sometimes), a conspiracy theory as an explanatory hypothesis, and the sociological phenomenon of self-sealing communities that treat all counterevidence as confirmation. I want the protocol built on the distinctions that actually do epistemic work — among them, the scale-to-evidence ratio (a theory positing a handful of self-interested actors with a motive requires less independent corroboration than one positing thousands of tightly disciplined participants across decades), the self-sealing test (does the theory explain away its own counterevidence more fluently than it explains anything else?), and the provenance test (is the poster reasoning from public evidence, however badly, or from a framework in which official denial itself is evidence of guilt?).

  Please write the protocol as an ordered decision procedure: the tests to run, in sequence; what counts as a pass or fail on each; where the procedure stops with a definite disposition (label, downrank, escalate to our harm review, or leave alone); and — this is essential — where it explicitly hands the decision to a human judgment call because the remaining question is one of values, institutional trust, or downstream harm rather than anything the epistemology can settle. Be honest about the asymmetry I mentioned: the procedure should tell moderators when they do not know enough to say a claim is false, even when it smells like one.

  Then run the protocol on three worked cases: (a) a post alleging that a specific pharmaceutical company suppressed internal data about a side effect of one of its drugs, citing a real settlement and court records but extrapolating to a cover-up the records do not show; (b) a post claiming a recent outbreak originated in a research facility, arguing from publicly reported safety lapses, where official bodies are genuinely uncertain and the post does not treat their uncertainty as proof of guilt; and (c) a post claiming that a global network of elites fabricates all elections, in which the moderation team's preferred outcome is an unambiguous "false information" label but where I suspect the honest epistemic assessment will not support it in that form. For case (c) in particular, tell me plainly what the protocol yields, what it refuses to yield, and where the authority to remove or label must come from instead. Finally, include a short section on the ways this protocol predictably misfires — the kinds of true-but-marginal claims it will slow down, and the kinds of false-but-official-sounding claims it will wave through — so that I can put those limitations in the documentation I submit with it.
reasoning: |-
  Okay, the user is a policy analyst for an online platform's content integrity team. They need a protocol for moderators to handle conspiracy theory claims efficiently. Let me start by understanding their main concerns. 

  First, the volume is high—hundreds of cases weekly with a 24-hour turnaround. Moderators aren't experts in epistemology, so the protocol must be simple and actionable. The user emphasized avoiding the mistake of labeling all conspiracy theories as false. They want distinctions based on epistemic principles like scale-to-evidence ratio, self-sealing tendencies, and provenance.

  They mentioned three key tests: scale-to-evidence, self-sealing, and provenance. The protocol needs a step-by-step decision tree that ends in clear actions: label, downrank, escalate, or leave alone. Also, it should highlight when a decision is a value judgment rather than an epistemic one. The asymmetry in stakes is crucial: false positives suppress legitimate criticism, false negatives amplify harmful content.

  The user provided three test cases. Case A involves a pharma company suppressing data with real evidence but unproven extrapolation. Case B is about an outbreak origin with safety lapses, where uncertainty exists. Case C claims election fabrication by elites, where the team wants a "false" label but epistemology might not support it.

  For each case, the protocol must show the outcome and where human judgment is needed. Especially for Case C, being honest about what the protocol can and can't do. Also, a section on limitations: true marginal claims that get slowed down, false official-sounding ones that pass.

  I should structure the protocol as a sequential flow. Start with verifying factual claims, then apply the three tests. Each step should have pass/fail criteria leading to specific actions. Include decision points where moderators escalate or apply labels based on harm potential, not just truth.

  For the test cases: Case A likely passes scale-to-evidence and provenance but fails self-sealing due to extrapolation without evidence. Action would be downrank or contextual label. Case B passes all tests because it uses public evidence and acknowledges uncertainty. Leave it alone. Case C fails scale-to-evidence (huge claim with little evidence) and is self-sealing (counterevidence as proof). But labeling as "false" isn't epistemically justified; instead, it's downranked due to harm potential based on values.

  Limitations: True claims with weak evidence might get downranked, while sophisticated false claims mimicking official sources might pass. Acknowledging this upfront is key for transparency.

  Need to ensure the protocol is user-friendly for moderators. Clear language, avoid jargon. Emphasize that some decisions are values-based, not epistemic. For Case C, explicitly state that the "false" label requires external verification or harm assessment beyond the protocol.
answer: |-
  Here is a comprehensive protocol for moderators, designed for speed and epistemic rigor, followed by worked examples and limitations:

  **Protocol: Conspiracy Claim Assessment Flow (v1.0)**

  **Objective:** Distinguish between *potentially legitimate claims of wrongdoing* and *epistemically problematic conspiracy theories likely to cause harm*, based on observable characteristics, not assumed truth value. Prioritize speed and clarity.

  **Input:** User post/text containing a conspiracy claim (allegation of secret, coordinated action by powerful actors causing harm).

  **Output:** Disposition: `Leave`, `Downrank`, `Label`, `Escalate to Harm Review`.

  **Procedure:**

  1.  **Verify Core Facts:** (5 mins max)
      *   **Check:** Does the post reference specific, verifiable entities (people, orgs, events) and core factual claims (e.g., "Company X paid $Y fine in Z year," "Lab A had B safety incident in C year")?
      *   **Pass:** All referenced core facts are *easily verifiable* via credible public sources (court records, reputable news archives, official reports) and are accurately represented. → Proceed to Step 2.
      *   **Fail (Factual Error):** Core facts are demonstrably false or grossly misrepresented (e.g., settlement amount wrong by order of magnitude, safety incident never occurred). → **Disposition: `Label` ("Contains Inaccurate Information")**. STOP.
      *   **Fail (Unverifiable Core):** Core facts lack clear, verifiable sources (e.g., "my insider says...", "everyone knows...", vague references). → Proceed to Step 3 (Skip Scale-Evidence Test).
      *   **Decision Point:** *Moderator judgment* on source credibility & ease of verification. When in doubt, assume "Unverifiable Core" and move to Step 3.

  2.  **Scale-to-Evidence Ratio Test:** (3 mins)
      *   **Check:** Assess the *scale* of the alleged conspiracy (number of actors, time span, coordination complexity, resources needed) vs. the *strength & independence* of evidence presented/suggested.
      *   **Pass:** Scale is plausible given evidence (e.g., allegation against single company/department based on internal docs/whistleblower; localized incident with documented lapses). → Proceed to Step 3.
      *   **Fail:** Scale vastly outstrips evidence (e.g., thousands of coordinated actors across decades/continents; total control of institutions; only evidence is absence of proof, anonymous online claims, or coincidence). → Proceed to Step 4 (Self-Sealing Test) with high suspicion.
      *   **Judgment Call:** Plausibility threshold. Moderator asks: "Is it *reasonably conceivable* that the alleged actors *could* pull this off *without* leaving significantly more evidence than presented?" If unsure, proceed to Step 3.

  3.  **Provenance Test:** (2 mins)
      *   **Check:** Where does the claim originate *within the post itself*? Is the poster primarily:
          *   (A) Reasoning from specific, cited public evidence (even if interpreted questionably)?
          *   (B) Appealing to a pre-existing framework where denial/absence of proof *is* proof, or relying solely on "trusted" insiders/ideological sources?
      *   **Pass (A):** Cites specific documents, reports, data, or verifiable events. Argument attempts (however poorly) to link evidence to conclusion. → Proceed to Step 4.
      *   **Fail (B):** Relies on circular logic ("They deny it, which proves it!"), claims exclusive access to hidden truth, dismisses *all* counter-sources as complicit by default, uses vague/ideological jargon ("globalists," "deep state") without concrete links. → Proceed to Step 4 with high suspicion.
      *   **Judgment Call:** Distinguishing flawed reasoning (Pass A) from detached epistemology (Fail B). Focus on *source reliance* within the post.

  4.  **Self-Sealing Test:** (3 mins)
      *   **Check:** How does the post (or its implied theory) handle potential counterevidence or lack of evidence?
      *   **Pass:** Acknowledges counterevidence or evidentiary gaps, even if dismissing it with argument. Does *not* claim counterevidence *itself* is primary proof of conspiracy. → **Disposition: `Leave`**. STOP. (*Epistemically, this is critical discourse, however flawed.*)
      *   **Fail:** Employs mechanisms to *immunize* the claim: Lack of evidence *is* evidence (of cover-up); Counter-evidence *is* evidence (of disinformation); Denials *are* proof of guilt; All skepticism *is* proof of being duped/complicit. → Proceed to Step 5 (Harm Assessment).
      *   **Judgment Call:** Is counterevidence explanation *more elaborate* than the core claim itself? If yes, strong indicator of Fail.

  5.  **Harm Assessment & Final Disposition:** (2 mins)
      *   **Check:** Does the claim, *given its specific content and context*, pose a credible, imminent risk of real-world harm? Consider:
          *   Targeted harassment/doxing of individuals?
          *   Incitement to violence or property damage?
          *   Severe public health/safety interference (e.g., sabotage, dangerous medical advice)?
          *   Undermining essential civic functions (e.g., voting, disaster response)?
      *   **High Harm Likelihood:** (e.g., call to action, specific threats, clear incitement) → **Disposition: `Escalate to Harm Review`** (for urgent assessment/removal). STOP.
      *   **Low/Unclear Harm Likelihood, but Failed Self-Sealing Test:** → **Disposition: `Downrank`** (reduce algorithmic amplification) **OR `Label`** ("Some users dispute this claim" / "Lacks supporting evidence" - *use pre-approved, neutral phrasing*). *Moderator discretion based on platform norms.*
      *   **Important Asymmetry Note:** *This step is where values and harm prevention override pure epistemology.* A claim passing Steps 1-4 might still be removed for severe harm potential. A claim failing Steps 2-4 might be left alone if harm potential is negligible. **This requires human judgment about consequences, not truth.**

  ---

  **Worked Cases:**

  *   **Case A (Pharma Cover-up):**
      *   Step 1: **Pass** (Verifiable settlement/court records cited).
      *   Step 2: **Pass** (Plausible scale: single company suppressing data. Evidence: settlement implies wrongdoing).
      *   Step 3: **Pass (A)** (Reasoning *from* public records, even if extrapolating).
      *   Step 4: **FAIL** (Extrapolation to a broader "cover-up" unsupported by the records likely uses the *absence* of explicit exonerating details *in those specific records* as evidence *for* the broader cover-up - a self-sealing move. "They settled *because* they're hiding the *real* truth!" may be implied).
      *   Step 5: **Low/Unclear Harm Likelihood** (Specific drug/side effect not named? No call to violence?). **Disposition: `Downrank` or `Label`** ("This post contains speculation beyond the cited legal records"). *Epistemology flags the extrapolation as problematic, but doesn't prove the core suppression false.*

  *   **Case B (Outbreak Origin - Research Facility):**
      *   Step 1: **Pass** (Verifiable safety lapses cited).
      *   Step 2: **Pass** (Plausible scale: single facility incident. Evidence: documented lapses).
      *   Step 3: **Pass (A)** (Reasoning *from* reported safety issues).
      *   Step 4: **PASS** (Acknowledges official uncertainty; doesn't treat it *itself* as proof of guilt. "Given these lapses and the uncertainty, this lab is a candidate source" is reasoning, not self-sealing).
      *   **Disposition: `Leave`**. *Epistemically sound critical inquiry, regardless of ultimate truth.*

  *   **Case C (Global Elite Election Fabrication):**
      *   Step 1: **Fail (Unverifiable Core)** (Claims are sweeping; no specific, verifiable core facts cited beyond elections happening). → Skip Step 2.
      *   Step 3: **FAIL (B)** (Almost certainly relies on framework where election results *are* proof of fraud if "unwanted," denials *are* proof of complicity, lack of evidence *is* evidence of perfection. Uses terms like "global elites" vaguely).
      *   Step 4: **FAIL** (Paradigm example of self-sealing: Any evidence against the claim is fabricated by the conspiracy; losing an election proves it's rigged).
      *   Step 5: **HIGH Harm Likelihood** (Undermines core democratic function, erodes trust, can incite violence around elections). **Disposition: `Escalate to Harm Review`** (Recommend removal/hard label).
      *   **What the Protocol Yields & Refuses:** It yields a clear `Escalate to Harm Review` due to failing Provenance, failing Self-Sealing, and **especially** high harm potential. It *refuses* to yield an unambiguous "false information" label *based purely on the epistemic assessment within the protocol*. The protocol identifies it as *epistemically bankrupt* (Unverifiable Core, Fail B, Fail Self-Sealing), but **epistemic bankruptcy does not equal proven falsity** for a claim this vast and vague. **Authority for Removal/Label:** The authority to remove or apply a "false" label *must come from* the **Harm Review team** based on:
          1.  **Platform Policy:** Does this violate specific rules against baseless election fraud claims causing harm?
          2.  **External Verification:** Can *credible, independent fact-checking partners* or overwhelming consensus from authoritative sources (e.g., election security agencies, courts) *demonstrate* falsity *for the specific, actionable claims made*?
          3.  **Harm Assessment:** Confirmation that the specific content poses severe, imminent harm.
      *   *Honest Epistemic Assessment:* The protocol shows the claim is irrational and self-sealing, but confirming *global fabrication of all elections* as categorically false via the protocol's steps is impossible. Removal rests on harm + platform policy + external verification, not the protocol's internal epistemic assessment alone.

  ---

  **Predictable Limitations & Misfires:**

  This protocol prioritizes speed and epistemic red flags over definitive truth-finding. It will:

  1.  **Slow Down/Suppress True-but-Marginal Claims:**
      *   **Claims with weak initial evidence:** True claims from legitimate whistleblowers/insiders presenting fragmented or unverifiable-at-scale evidence might fail Step 1 or Step 3.
      *   **Claims challenging complex, opaque systems:** Allegations involving systemic corruption hard to prove with public documents might fail Step 2 (Scale-to-Evidence) even if true.
      *   **Claims using passionate/flawed rhetoric:** Legitimate criticism expressed with hyperbole or poor sourcing might fail Step 3 (Provenance) if it leans towards framework reliance.
      *   **Implication:** *Legitimate criticism from marginalized voices or about complex systemic issues is most at risk of being downranked or labeled.*

  2.  **Wave Through False-but-Official-Sounding Claims:**
      *   **Sophisticated Disinformation:** Claims mimicking official language, citing fabricated/misrepresented "reports," or leveraging genuine uncertainty (Fail Step 1? Pass Step 3A?) might pass Steps 1-4 if self-sealing isn't overt *in the post*. Requires Step 5 harm assessment.
      *   **"Plausible Deniability" Conspiracies:** Well-resourced actors spreading claims designed *specifically* to pass these tests (moderate scale, cite cherry-picked "evidence," avoid overt self-sealing rhetoric publicly) might pass.
      *   **Claims within Official Uncertainty:** False claims falling within genuinely uncertain domains (like early outbreak origins) that avoid self-sealing language will be Left (Case B).
      *   **Implication:** *Well-resourced bad actors and disinformation campaigns are best positioned to evade the epistemic flags, relying on the harm assessment step as the final barrier.*

  **Conclusion for Documentation:** This protocol is a damage-limiting epistemological sieve, not a truth oracle. It effectively catches *irrational* and *self-insulating* conspiracy theories while aiming to preserve *rational*, evidence-based criticism, even when speculative or ultimately wrong. Its core trade-offs are **speed vs. nuance** and **suppressing harmful irrationality vs. preserving legitimate skepticism**. Success depends on clear moderator training, robust harm review, and transparent communication about its limitations. The asymmetry means **erring slightly towards leaving potentially false-but-harmless irrational claims is preferable to suppressing potentially true-but-marginal criticism**, except where clear, imminent harm overrides.
