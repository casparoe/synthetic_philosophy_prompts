prompt: |-
  So I write the little myth-busting column for our school paper, and lately every idea people send me is the same thing in different words: neuroscientists proved free will is fake, your brain "decides" before "you" do, sometimes seconds before, etc. I did some digging and it basically all traces back to this one old experiment by a guy named Libet, where people flicked their wrist whenever they felt like it while watching a dot go around a clock, and a brain wave (the readiness potential?) started building up before they said they consciously decided to move. Libet himself thought maybe we still have a last-second "veto" over the urge, which people call "free won't." But then I found out there's all this stuff that makes it way messier — like that the readiness potential might mostly be background noise that builds up till it crosses a threshold, and you only see the buildup because they average across tons of trials (I think a researcher named Schurger showed something like this?), or that watching the clock itself can shift when people report deciding, or that deciding *when* to flick your wrist is a really different thing from choosing between options like tea vs coffee, which is what people actually mean by free will most of the time. Also there's a newer study with brain scans that supposedly predicts simple choices like 7 seconds early, and that one gets the "seconds before" headlines.

  The problem is I keep winging it in my columns and I don't want to just debunk stuff reflexively anymore. So: write me a procedure I can actually run in like 15 minutes when a new "science disproved free will" claim lands in my inbox, before deadline. It should have the questions to ask in order (like, what experiment is this actually about, what exactly did it measure, what does that measurement have to do with free will, how strong is the claim being made vs. what was found), what counts as a good enough answer to each, and where the procedure should just stop and say "this part is philosophy, not settled by the experiment" so I can report it honestly instead of pretending. Then run it on the three headlines below — I made these up but they're exactly the kind of thing I get:

  1. "Your brain knows your decision 7 seconds before you do"
  2. "The famous free will experiment had a fatal flaw"
  3. "Brain scans prove your choices are an illusion"

  And here's the part I actually care about: include at least one case where the procedure gives me an answer I won't like. I really enjoy debunking the debunkers, but I want to know when a pop-science claim is basically *right* and I'd be the one misleading people by dunking on it. Also be upfront about what the procedure can't do — like whether a checklist run by a 16 year old in 15 minutes can honestly settle anything about free will, and which calls it has to hand back to me as judgment calls.

  One formatting thing: start your response with the bottom line — one sentence saying what the procedure overall concludes / what its core move is — and only then give the reasoning and the steps. No preamble, no restating my question back at me, just go. And don't bother with a works cited, I track down my own sources anyway since the paper makes me.
reasoning: |-
  Hmm, the user runs a myth-busting column for a school paper and keeps getting submissions about neuroscience disproving free will, mostly tracing back to the Libet experiment and similar studies. They're tired of winging it and want a systematic 15-minute procedure to evaluate these claims before deadline. They also want me to test this procedure on three made-up headlines, include at least one case where the claim might be valid, and be honest about limitations.

  The user is clearly frustrated with superficial "science disproved free will" takes and wants rigor without falling into reflexive debunking. Their deeper need seems to be intellectual honesty - they don't want to mislead readers even if it means conceding some points. The "include an answer I won't like" request shows unusual maturity for a student journalist.

  Key challenges for the procedure: It must be executable by a 16-year-old in 15 minutes, distinguish scientific facts from philosophical interpretations, and handle neuroscience's inherent messiness (like Schurger's noise accumulation critique of Libet). The formatting instruction - bottom line first - suggests they value efficiency.

  For the procedure design, I'm thinking a decision tree with critical filters:
  1. Identify the actual experiment behind the claim (often obscured in pop sci)
  2. Interrogate what was measured vs what's implied (e.g., readiness potential ≠ "decision")
  3. Flag philosophical leaps (e.g., "choices are illusion" isn't testable)
  4. Check for replication issues or alternative explanations
  5. Explicitly note where science ends and philosophy begins

  Testing on their headlines:
  - Headline 1 ("brain knows 7s early") refers to Soon et al's 2008 fMRI study. The procedure should validate the prediction but challenge the "knows your decision" framing as misleading.
  - Headline 2 ("fatal flaw in Libet") would pass through as essentially correct given Schurger's noise theory replication.
  - Headline 3 ("choices are illusion") should get stopped early as philosophical overreach.

  Crucially, Headline 2 is the "answer you won't like" case - validating criticism of Libet's original interpretation. This meets their request for intellectual honesty.

  Limitations to emphasize: 
  - A 15-min checklist can't resolve free will debates
  - Only flags obvious scientific overreach
  - Judgment calls needed on interpretation boundaries
  - Can't assess technical methodology deeply

  The core move is disentangling measurable neuroscience from unfalsifiable philosophy using specific filters. Bottom line: The procedure isolates testable claims from philosophical extrapolation using defined scientific red flags.
answer: |-
  **Bottom line:** This procedure isolates testable scientific claims from philosophical extrapolation by demanding experiment specifics, scrutinizing measurement relevance, and flagging unsupported leaps.

  **The 15-Minute Claim-Checking Procedure:**

  Run these steps in order. Stop and report uncertainty if any step lacks a clear answer within your time limit.

  1.  **Identify the Core Experiment:**
      *   *Question:* **What specific experiment (researcher names, year, method like EEG/fMRI) is this claim directly based on?**
      *   *Good Answer:* Clear identification (e.g., "Libet et al. 1983 EEG wrist-flick", "Soon et al. 2008 fMRI left/right button press").
      *   *Bad Answer:* Vague references ("neuroscientists", "studies show", "brain scans"). *Stop Here:* If unclear, report "Claim lacks identifiable core experiment; origin unclear."
      *   *Philosophy Check:* None here yet. This is pure fact-finding.

  2.  **Define the Measured "Brain Signal":**
      *   *Question:* **What specific physiological signal was measured *before* the reported conscious decision/action? (e.g., Readiness Potential (RP), specific fMRI pattern, etc.)**
      *   *Good Answer:* Precise term from neuroscience (RP, BOLD signal in X brain region, pattern classifier output).
      *   *Bad Answer:* Imprecise terms ("brain activity", "brain knows", "subconscious signal"). *Stop Here:* If unclear, report "Claim does not specify the measured brain signal; measurement undefined."
      *   *Philosophy Check:* None. This defines the scientific observation.

  3.  **Define the Measured "Conscious Decision":**
      *   *Question:* **How was the conscious decision/urge/will *operationally defined* and measured in the experiment? (e.g., subject reporting clock position, pressing a button to indicate choice, verbal report).**
      *   *Good Answer:* Clear operational definition (e.g., "subject reported time of conscious urge using a clock", "subject pressed 'choice' button").
      *   *Bad Answer:* Assumed without description ("you decide", "you know"). *Stop Here:* If unclear, report "Claim does not specify how the 'conscious decision' was measured; comparison point undefined."
      *   *Philosophy Check:* None. This defines the other side of the scientific comparison.

  4.  **Scrutinize the Temporal Claim & Mechanism:**
      *   *Question:* **What *exactly* does the experiment show about timing? Is the brain signal reliably predictive *before* the conscious report? What's the proposed *mechanism* linking the signal to the eventual action/choice?**
      *   *Good Answer:* Specific timing (e.g., "RP onset ~500ms before conscious urge report", "fMRI pattern predicted choice ~7s before button press"). Acknowledges proposed mechanism (e.g., "RP reflects preparation for action", "pattern reflects bias accumulation") *and* major critiques (e.g., "Schurger et al. argue RP reflects stochastic noise crossing threshold, not specific intention", "clock-reporting method may distort timing").
      *   *Bad Answer:* Ignores critiques, assumes mechanism implies "decision" is made subconsciously without evidence linking the signal directly to the *content* of complex choice. *Flag Here:* Report "Experiment shows brain signal X precedes reported conscious urge Y by time Z. However, [mention 1-2 key critiques if found, e.g., 'the nature/meaning of signal X is debated']."
      *   *Philosophy Check:* Still science-focused. Critiques like Schurger's are scientific counterarguments.

  5.  **Interrogate the "Free Will Disproof" Leap:**
      *   *Question:* **Does the claim assert the experiment disproves free will *in general*? Does it conflate *predicting a simple, timed action* (like flicking a wrist) with *making a deliberate choice between options* (like tea vs. coffee)? Does it claim consciousness is *causally inert*?**
      *   *Good Answer:* Explicitly limits claims to the specific experimental context (e.g., "suggests specific motor urges may originate unconsciously *in this simple task*"). Acknowledges the difference between predicting *when* a pre-decided action occurs vs. *what* action is chosen.
      *   *Bad Answer:* Makes sweeping claims ("free will is an illusion", "you don't make choices", "consciousness is just along for the ride") based *only* on this type of experiment. *Stop Here/Flag Heavily:* Report "The experiment demonstrates [briefly restate finding from Step 4]. **This is a philosophical interpretation, not a direct scientific finding, to claim it disproves free will in general.** Reasons include: (a) The task measures simple urges/timing, not complex deliberative choices; (b) It doesn't test whether consciousness can *inhibit* or *modify* urges ('free won't'); (c) It doesn't address higher-level planning or reasons-based decisions; (d) The meaning of the brain signal itself is debated."
      *   *Philosophy Check:* **THIS IS THE CORE STOPPING POINT.** Science measures correlations and timings in specific tasks. Declaring "free will is disproven" is a massive philosophical leap far beyond the data of these experiments. Your job is to expose this leap.

  **Procedure Limitations (Be Upfront!):**
  *   **Cannot Settle Free Will:** This only checks if a *specific scientific claim* supports a *specific philosophical conclusion*. Free will remains a deep philosophical debate.
  *   **Shallow Dive:** 15 minutes won't let you fully evaluate the *quality* of the original science (statistical power, replication status beyond major known critiques like Schurger's). You're relying on identifying the experiment and known major debates.
  *   **Judgment Calls Needed:** You *must* decide:
      *   Is the core experiment sufficiently identified? (Step 1)
      *   Are the critiques mentioned in Step 4 strong/relevant enough to flag? (Based on your quick research - Schurger vs Libet is a key one to know).
      *   How strongly to phrase the warning about the philosophical leap (Step 5).
  *   **"Basically Right" Check:** A claim might be "basically right" *scientifically* if it accurately reports the core timing finding *and* acknowledges major limitations/critiques *without* making the sweeping philosophical leap. If it makes the leap, it's misleading.

  ---

  **Running the Procedure on Your Headlines:**

  1.  **"Your brain knows your decision 7 seconds before you do"**
      *   **Step 1:** Likely refers to Soon et al. (2008) fMRI study (left/right button press).
      *   **Step 2:** Measured specific patterns of activity in prefrontal/parietal cortex.
      *   **Step 3:** Conscious decision measured by pressing a button indicating choice.
      *   **Step 4:** Found specific brain patterns could predict button choice ~7s before button press. Proposed mechanism: accumulation of unconscious bias. Critique: Predicts *which* of two simple, pre-decided actions occurs, not a complex choice. Predicts *content* but still a very constrained, low-stakes task. Debated if signal truly reflects "decision" or just bias/preparation.
      *   **Step 5:** **LEAP!** "Knows your decision" implies the brain has made the full decision consciously recognized later. The experiment shows prediction of a *simple, binary motor choice* based on accumulating neural signals. It does *not* show the brain "knows" complex decisions like career choices seconds before you're aware. Crucially, it doesn't test if the subject could have changed their mind *after* the predictive signal appeared.
      *   **Conclusion for Column:** "This refers to a 2008 fMRI study predicting simple left/right button presses ~7 seconds early. While fascinating, it shows prediction of *constrained, pre-decided motor actions*, not complex life choices. Claiming it means your brain 'knows your decision' before you do overstates the findings and ignores the task's simplicity. The neural signal likely reflects growing bias, not a finalized, unchangeable 'decision'."

  2.  **"The famous free will experiment had a fatal flaw"**
      *   **Step 1:** Clearly refers to Libet et al. (1983) EEG wrist-flick experiment.
      *   **Step 2:** Measured the Readiness Potential (RP).
      *   **Step 3:** Conscious decision measured by subject reporting clock position of "urge" to move.
      *   **Step 4:** Showed RP onset ~500ms before reported urge. Proposed mechanism: RP reflects unconscious initiation of action. **Major Critique:** Schurger et al. (2012) argued the RP arises from stochastic noise fluctuations crossing a threshold; the apparent "buildup" is only visible when averaged across many trials. It may reflect *general preparation to act sometime soon*, not a specific intention forming for *this particular* wrist flick. Clock-reporting method itself may distort timing awareness.
      *   **Step 5:** Headline claim is *scientific*, not primarily philosophical. It focuses on a potential flaw in the *experiment's interpretation*.
      *   **Conclusion for Column (The "Answer You Won't Like"):** "This headline is **likely referring to valid scientific criticism**. The Libet experiment (1983) found brain activity (Readiness Potential) before people reported the urge to flick their wrist. However, researcher Aaron Schurger and colleagues argued in 2012 that this RP might not reflect a specific decision forming, but rather random brain noise that happens to cross a threshold just before movement *on average*. If correct, this significantly weakens the original interpretation that the brain 'decides' unconsciously before we know it. This is an active scientific debate, not settled philosophy." *(Here, the procedure identifies a scientifically sound critique challenging a key experiment's interpretation - debunking the debunker isn't justified).*

  3.  **"Brain scans prove your choices are an illusion"**
      *   **Step 1:** Vague ("brain scans"). *Stop Here.*
      *   **Conclusion for Column:** "This claim lacks a specific, identifiable core experiment. 'Brain scans' refers to a technique, not a finding. Without knowing *which* study and *what* it actually measured and found, this headline is too vague to evaluate scientifically. The philosophical leap ('choices are an illusion') is unsupported by the information given." *(Procedure stops early due to insufficient specificity, flags the philosophical leap as unsupported by the undefined science).*
