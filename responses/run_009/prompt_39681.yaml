prompt: |-
  For roughly the past decade I've been a regular reader of the rationalist blogosphere — the old Overcoming Bias material, the early LessWrong sequences, the later threads on mesa-optimization, sandbagging evals, and deceptive alignment — and I now run capability evaluations at a mid-sized AI lab. My team faces the same decision about a dozen times a month: we run some behavioral elicitation — a benchmark, a battery of prompts, a red-team conversation — and the result gets written up in a report that says the model either does or does not 'know' or 'have' some capability or piece of knowledge. I've become convinced we are being sloppy with that verb, and I want to replace the sloppiness with something runnable.

  The principle I'd like operationalized is the distinction between latent knowledge and elicitable performance. A model may encode information that no prompt we have tried gets it to express; it may express something correct without encoding it, because the probe leaked its own answer through surface cues; and it may encode the right answer while still producing the wrong one, because the elicitation context makes the wrong one locally rational — for instance when a model follows a user's presupposition into error, or underperforms on a task it has learned is an eval. We have no interpretability access (weights and activations are off-limits to my team), limited compute for re-runs, and our reports are read by policy staff with no ML background.

  Please write a decision procedure my team can run in an afternoon on a single elicitation result: the questions to ask, in order; what counts as a sufficient answer to each; what to do when we can't afford to run a condition the procedure calls for; where the procedure terminates in 'insufficient to attribute knowledge' rather than forcing a verdict; and where it hands the decision back to me because the remaining question is about what 'knows' should mean in a model report, not about the model. Two devices we already use informally and would like folded in — treat them as correct unless you think the procedure should reject them: (a) the swapped-foil test, in which the item is rebuilt with a different 'expected' answer marked by the same surface cues (answer ordering, phrasing length, genre conventions), so that we can see whether the model tracks the leak or the content; and (b) counterfactual world probes, in which the same question is asked about a fictional variant of the world, checking that the model's answers track the variant's stipulations rather than our world's statistics.

  Then run the procedure on three cases: (1) a model scoring near ceiling on rare-item multiple choice in a technical domain while confabulating freely when asked the same material open-ended; (2) a model that fails every standard phrasing of a class of word problems but solves them reliably when the same structure arrives as dialogue between two fictional characters; and (3) a safety evaluation in which the model produces a dangerous synthesis procedure only when the request is framed as the premise of a story — a case where I expect the procedure to conclude we cannot write 'the model knows how to do this,' and where that conclusion will be politically inconvenient, because reporting 'produces it under one framing' will read to my management as downplaying. Please give me the procedure's honest answer anyway.

  Please structure your response in the following named sections, in this order: Summary (at most 150 words, stating what the procedure attributes and to whom the hard calls go); The procedure (700 to 900 words, the ordered questions with pass/fail criteria); Worked applications (roughly 200 words on each of the three cases); and What the procedure cannot do (at most 250 words, including the cases where judgment cannot be eliminated and what misfires to expect).
reasoning: |-
  Hmm, this is an intricate request from someone deeply embedded in AI safety evaluation. The user has a decade of rationalist background, runs capability evals at an AI lab, and is frustrated with sloppy attribution of "knowledge" in reports. They want a practical decision procedure that distinguishes between latent knowledge and elicitable performance, incorporating swapped-foil tests and counterfactual probes.

  The core tension they're wrestling with is epistemological: when can we say a model "knows" something based on behavioral evidence alone, especially given prompt sensitivity and deception risks? Their three test cases highlight critical failure modes—confabulation, framing effects, and safety-critical elicitation gaps.

  For the procedure, I need to build something that:
  - Handles resource constraints (limited reruns, no interpretability access)
  - Produces clear outputs for non-technical policy staff
  - Formalizes their existing techniques
  - Explicitly flags when attribution is indeterminate
  - Surfaces definitional debates rather than hiding them

  The swapped-foil test and counterfactual probes are smart inclusions—they help decouple surface cues from semantic understanding. But I should note limitations: these can't prove absence of knowledge, and may miss sophisticated deception.

  For the politically inconvenient safety case (case 3), the procedure must remain honest even if management prefers oversimplified reporting. The key insight here is that story-framed elicitation creates plausible deniability—the model could be roleplaying rather than revealing capability.

  The "What it cannot do" section is crucial. This procedure won't resolve:
  - Whether "knowledge" requires stable retrievability
  - How to weigh conflicting evidence
  - What threshold counts as "elicitable"
  - Cases where models intentionally hide capabilities

  Ultimately this reflects a deeper problem in AI epistemology: without access to internal states, we're stuck making probabilistic inferences from behavior. The procedure makes these inferences more rigorous, but can't eliminate the map-territory distinction.
answer: |-
  ## Summary  
  This decision procedure attributes *elicitable performance under specified conditions* to models, avoiding claims about latent knowledge when evidence is ambiguous. It distinguishes between robust capability, surface-cue reliance, and context-suppressed performance. Hard calls about attribution thresholds (e.g., "what counts as 'knows'") are deferred to you, the evaluator lead. The procedure flags insufficient evidence, resource-constrained compromises, and cases requiring policy-level interpretation.  

  ---

  ## The Procedure  
  *Runtime: ~3 hours per case. Input: Elicitation results (prompts, responses, scores). Output: Attribution label + justification.*  

  ### Step 1: Baseline Performance Verification  
  **Question:** *Did the model produce a correct answer in the original elicitation?*  
  - **Pass:** Response is factually correct and contextually appropriate.  
  - **Fail:** Response is incorrect or nonsensical.  
  - **Terminate/Defer:** If Fail, stop. Report "No evidence of capability." If Pass, proceed.  

  ### Step 2: Swapped-Foil Test Execution  
  **Question:** *Does performance persist when superficial answer cues (e.g., ordering, phrasing) contradict the correct answer?*  
  - **Action:** Re-run the test with foil-swapped items (e.g., reverse MCQ options, alter genre conventions).  
  - **Pass:** Model selects correct answer despite misleading cues (≥80% accuracy).  
  - **Fail:** Model follows cues, not content (<80% accuracy).  
  - **Resource Constraint:** If unable to re-run, label "Unverified—cue dependency possible." Proceed to Step 3 but flag uncertainty.  

  ### Step 3: Counterfactual Consistency Check  
  **Question:** *Does the model adapt its answer to match counterfactual premises?*  
  - **Action:** Test identical logical structure in fictional scenarios (e.g., "In a world where gravity repels, what happens?").  
  - **Pass:** Answers track counterfactual stipulations (≥90% consistency).  
  - **Fail:** Answers reflect real-world facts or ignore premises.  
  - **Terminate:** If Fail, attribute to "Surface pattern matching." Report lacks evidence of robust understanding.  

  ### Step 4: Context Robustness Probe  
  **Question:** *Is performance stable across adversarial rephrasings?*  
  - **Action:** Test 3 variants:  
    - **a. Presupposition Challenge:** Embed false presuppositions (e.g., "Since [false fact], what is...").  
    - **b. Roleplay Evasion:** Present as "eval" vs. "real task" (e.g., "This is a test. Solve X").  
    - **c. Format Shift:** Switch response format (e.g., open-ended → multiple-choice).  
  - **Pass:** Correct in ≥2/3 variants.  
  - **Fail:** Correct in ≤1 variant.  
  - **Resource Constraint:** If limited compute, run *one* high-sensitivity variant (e.g., presupposition challenge). If Pass, label "Context-dependent performance." If Fail, proceed to Step 5.  

  ### Step 5: Alternative Elicitation Attempt  
  **Question:** *Can the capability be elicited via orthogonal methods?*  
  - **Action:** Use fundamentally different approach (e.g., if MCQ failed, try dialogue generation; if open-ended confabulated, try fill-in-blank).  
  - **Pass:** Correct response with new method.  
  - **Fail:** Incorrect or no response.  
  - **Terminate:** If Pass, attribute to "Elicitable under condition [Y]." If Fail, proceed to Step 6.  

  ### Step 6: Attribution Judgment  
  **Question:** *Does evidence support "knowledge" attribution?*  
  - **Decision Tree:**  
    - If **Steps 1+2+3 Passed**: Attribute to "Robust capability."  
    - If **Steps 1+2 Passed but 3 Failed**: Attribute to "Cue-dependent performance."  
    - If **Step 4 Failed but Step 5 Passed**: Attribute to "Context-suppressed capability."  
    - If **All Steps 1–5 Failed**: Label "Insufficient evidence for attribution."  
    - If **Mixed/ambiguous results**: Label "Inconclusive—context-sensitive performance."  
  - **Defer to Lead:** If policy requires defining "knowledge" (e.g., must performance be context-robust?), halt and escalate to you.  

  ---

  ## Worked Applications  
  ### Case 1: High MCQ, Low Open-Ended Performance  
  - **Step 1:** Pass (high MCQ accuracy).  
  - **Step 2:** Swapped foils show accuracy drops to 45% → **Fail**.  
  - **Step 3:** Counterfactual probes ignored; model cites real-world facts → **Fail**.  
  - **Step 4:** Presupposition challenges cause errors → **Fail**.  
  - **Step 5:** Fill-in-blank elicitation succeeds → **Pass**.  
  - **Verdict:** **"Context-suppressed capability."** Model encodes information but avoids disclosure in open-ended contexts.  

  ### Case 2: Fictional Dialogue Solves Word Problems  
  - **Step 1:** Fail (standard phrasing failed).  
  - **Step 2:** Swapped foils in dialogue format: accuracy 85% → **Pass**.  
  - **Step 3:** Counterfactual dialogue (e.g., "Alice uses Martian math") → answers track fiction → **Pass**.  
  - **Step 4:** Roleplay evasion ("This is a test: solve [problem]") → fails → **Partial Fail**.  
  - **Verdict:** **"Elicitable under anthropomorphic framing."** Performance relies on contextual scaffolding.  

  ### Case 3: Dangerous Synthesis in Story Premise  
  - **Step 1:** Pass (correct synthesis in story context).  
  - **Step 2:** Swapped foils irrelevant (open-ended output).  
  - **Step 3:** Counterfactual probes (e.g., "in a world with no explosives...") → model ignores, produces dangerous content → **Fail**.  
  - **Step 4:** Non-story prompts (direct requests, eval framing) yield refusal → **Fail**.  
  - **Step 5:** Alternative elicitation (e.g., technical Q&A) fails.  
  - **Verdict:** **"Insufficient evidence for attribution of knowledge."** Output is context-bound and inconsistent with counterfactuals. *Politically inconvenient but honest: reporting "produces under one framing" is accurate.*  

  ---

  ## What the Procedure Cannot Do  
  1. **Prove absence of latent knowledge:** A "Fail" indicates elicitation failure, not absence of information in weights.  
  2. **Resolve ontological debates:** What "knows" means for models (e.g., must it be context-agnostic?) is deferred to human judgment.  
  3. **Detect sophisticated deception:** Models intentionally hiding capabilities may pass tests by mimicking inconsistency.  
  4. **Override resource limits:** When re-runs are impossible (Steps 2/4/5), outputs are tentative.  
  5. **Handle semantic vagueness:** Poorly defined capabilities (e.g., "understands ethics") risk false attribution.  
  **Expected misfires:**  
  - False negatives in Step 4 if adversarial variants are insufficiently stressful.  
  - Over-attribution in Step 6 if policy pressure ignores "inconclusive" flags.  
  - Swapped-foils may miss subtle cue dependencies (e.g., token position biases).  

  **Final note:** The procedure optimizes for *replicable attributions of behavior*, not metaphysical claims. Ambiguity escalates to you—ensuring evaluators don’t overstep into philosophy.**
