  We'll design an in-class activity that simulates the absent-minded driver problem. The goal is to have students experience the decision-making from the inside and then analyze the results.

  ### Activity Design: "The Absent-Minded Driver Simulation"

  #### Materials:
  - A deck of cards (or a random number generator app) for randomization when needed.
  - A stopwatch or timer for the distractor task.
  - A whiteboard or chart to record results.
  - A private tracking sheet for the facilitator (to track the true state: first or second exit).
  - Two identical-looking "exit" stations (could be two doors, two corners of the room, or just two spots marked on the floor). They should be indistinguishable to avoid cues.
  - Payoff tokens (e.g., poker chips, paper slips) representing the payoffs: 0, 1, 4.

  #### Setup:
  1. **Preparation**: Set up two identical exit stations (Exit A and Exit B) in the room. The path should be such that after leaving one station, the driver must return to the starting point to go to the next (to simulate the highway and prevent physical cues). Alternatively, we can have the driver stay in place and the facilitator moves them mentally, but to avoid confusion, we'll have them walk to a station and then return to a central starting point.

  2. **Roles**:
     - **Driver**: One student at a time will be the driver. They will make the decision at each exit station they encounter.
     - **Facilitator (you)**: You will know the true state (whether the driver is at the first or second exit) and will only reveal the payoff at the end of the trip, plus you will run the distractor tasks.
     - **Other students**: They will observe and then take turns being the driver. They can also help with the distractor task (see below).

  #### Rules of the Game:
  - The driver starts at the beginning. The facilitator flips a coin (or uses a random method) to determine the true state: 
    - With probability 1/2, the driver is at the first exit.
    - With probability 1/2, the driver is at the second exit (but they don't know which one they are at).
  - The driver is told that they are at an intersection and must decide to either "Exit" or "Continue". They are told that if they exit, they get a payoff based on which exit they are at (0 for first, 4 for second). If they continue, they will either go to the next exit (if they were at the first) or miss both (if they were at the second) and get 1.
  - However, the driver doesn't know which exit they are at. They are told that the two exits are identical and that they have no memory of having passed any exit (due to absent-mindedness). They are also told that the probability of being at the first exit is 1/2, and at the second exit is 1/2.

  #### Distractor Task:
  To prevent memory smuggling, after the driver makes a decision at an exit and if they choose to continue, they must do a distractor task before moving to the next exit. The distractor task should be short (about 30 seconds) and mentally engaging enough to disrupt any attempt to count or keep track. Examples:
  - Count backwards from 100 by 7s.
  - Solve a set of simple arithmetic problems (e.g., 23+18, 45-17, etc.) that you write on a board.
  - Name as many countries as they can in 30 seconds.

  After the distractor task, the driver moves to the next exit station (which is the same physical station, but they are told it's the next one). The facilitator then flips a coin again to set the current state: if they were at the first exit and continued, then they are now at the second exit (so the state becomes second). If they were at the second exit and continued, then they have missed both and the trip ends (payoff 1). 

  But note: the driver doesn't know the state. The facilitator knows the state and will only reveal the payoff at the end.

  #### How the Trip Ends:
  - If the driver exits at an exit station, the facilitator reveals the state and gives the payoff: 0 if it was the first exit, 4 if it was the second.
  - If the driver continues at the first exit, they do the distractor task and then go to the next exit (which is the second exit) and make another decision.
  - If the driver continues at the second exit, they have missed both exits and get payoff 1.

  #### Important: 
  - The driver is only allowed to make one decision per exit station. They are told that each time they are at an exit station, it could be the first or the second (with equal probability) and they must decide without knowing which one.

  #### Procedure for Each Driver:
  1. The driver starts at the beginning. The facilitator secretly determines the current state (first exit) by a coin flip (so the initial state is always first, but the driver doesn't know that). Actually, to simulate the ex-ante perspective, we must start at the first exit. However, when the driver is at an exit, they believe they might be at the first or the second. But note: when they start, they are always at the first. However, if they continue and then come to the next, they are at the second. But the driver's information set is the same at both.

     We can adjust: The driver is always at the first exit when they start. After they continue, they are moved to the second exit (without being told) and then the facilitator flips a coin to determine if they are at the second exit or if they have skipped both? That doesn't match. 

     Let's clarify the setup:

     - The driver is on a highway with two exits. They are starting at a point just before the first exit. They encounter an exit (which is the first). Then, if they continue, they encounter the second exit. If they continue at the second, they miss both.

     But in the absent-mindedness, the driver cannot remember if they have already passed an exit. So when they are at an exit, they don't know if it's the first or the second. Therefore, the information set is that they are at an exit and they don't know which one.

     How to simulate:

     - The driver is always at an exit when they are at a station. The first time they are at an exit, it is the first exit. If they continue, they then go to the second exit (but the room setup is identical). However, the driver does not know if this is their first or second time at an exit. So we must break the physical sequence.

     Revised physical setup:

     - The driver starts in a neutral area. They are told they are about to encounter an exit. They are led blindfolded (or with eyes closed) to one of the two exit stations (chosen randomly by the facilitator) to break the sequence. But note: if they are at the first exit and continue, they must then go to the second. How to do that without them knowing it's the second?

     Alternatively, to keep it simple and avoid physical movement, we can do:

     - The driver remains seated at a table. The facilitator presents two identical envelopes (or two identical cards face down) representing the two exits. The driver picks one to "encounter". The facilitator knows the true state (which envelope is which). The driver must decide to exit or continue at the envelope they pick. But then if they continue, how do we simulate the next exit?

     We can do:

     - The driver is told that they will encounter two exits in sequence, but because of absent-mindedness, they won't remember which one they are at. The facilitator will present an envelope (or a card) at each exit. The driver will make a decision at each envelope they are presented. However, the driver is not told how many envelopes they will see. They are only told that they will see at least one and at most two.

     Steps for a run:

     1. The facilitator secretly flips a coin to determine if the driver is at the first exit (state 1) or the second exit (state 2). But note: the driver must start at the first. However, the problem says that when the driver is at an exit, they don't know if it's the first or the second. So we can start by having the driver at an exit and the state is randomly set to 1 or 2? That doesn't match the actual highway.

     Actually, in the actual problem, the driver is always at the first exit first. Then if they continue, they go to the second. But the driver cannot remember if they have already passed an exit. So when they are at an exit, they don't know if it's the first or the second. Therefore, we must simulate the driver being at an exit and the state being either first or second with equal probability. But note: if they are at the first exit and continue, they will then be at the second exit. If they are at the second exit and continue, they miss both. So the state is determined by the history.

     How to model without the driver knowing the history? We can have the driver make a decision at an exit, and then the facilitator:

     - If the state is first and the driver continues, then the next state is second (so the driver will be presented with another exit).
     - If the state is second and the driver continues, then the trip ends (payoff 1).
     - If the driver exits, then the trip ends and they get the payoff for that exit.

     But the driver doesn't know the state when they make a decision. They only know that they are at an exit and that they are equally likely to be at the first or the second? Actually, that's the key: the driver has the same information at both exits. So we can present the driver with an exit and tell them: "You are at an exit. You don't know if this is the first or the second. You believe it's equally likely to be either."

     However, the prior probability of being at the first exit is 1 (at the start) and then after continuing, it becomes 0 at the second. But the driver doesn't know that because they forget. So the driver must use the prior that at any exit, the probability of being at the first is 1/2 and at the second is 1/2.

     How to simulate the initial condition without revealing? We can have the driver always start at the first exit. Then, if they continue, they are then presented with the second exit (without any indication that it's the second). But to the driver, the two situations are identical. So when they are at the second exit, they again believe they are equally likely at the first or the second.

     So the procedure for one driver:

     1. The driver is at the first exit (state=1). The driver is told: "You are at an exit. It could be the first or the second exit, and you think each is equally likely." The driver decides to exit or continue.
        - If they exit at state=1: payoff 0, game ends.
        - If they continue: they then go to state=2. They do a distractor task (to prevent memory of having just made a decision). Then they are presented again: "You are at an exit. It could be the first or the second exit, and you think each is equally likely." They make a decision again.

     2. At state=2:
        - If they exit: payoff 4, game ends.
        - If they continue: payoff 1, game ends.

     The driver does not know that they only get two exits. They are told that if they continue at the second exit, they will miss both and get 1. But they don't know if they are at the second exit. So when they are at the second exit, they must be told that if they continue, they might miss both.

     However, in this setup, the driver at the first exit has the possibility of going to the second exit, but at the second exit, they don't know it's the second. So we must tell the driver the rules:

     - At any exit, if you exit, you get 0 if it's the first exit and 4 if it's the second.
     - At any exit, if you continue, then:
          - If it was the first exit, you will encounter another exit (and you will be in the same situation again: you won't know if it's the first or the second).
          - If it was the second exit, you miss both and get 1.

     The driver is also told that initially, they are at the first exit? But if we tell them that, then they know that the first time they are at an exit it is the first. So we cannot tell them that.

     Therefore, we must not tell them the starting point. Instead, we tell them:

     - You are on a highway with two exits. You are currently at an exit. You do not remember how you got here (you might have just started and this is the first exit, or you might have already passed the first exit and this is the second). You believe that it is equally likely to be the first or the second exit.

     And the rules:

     - If you exit at the first exit, you get 0.
     - If you exit at the second exit, you get 4.
     - If you continue at the first exit, you will go to the second exit (and then you will again be at an exit and face the same decision, with the same beliefs because you forget the past).
     - If you continue at the second exit, you miss both and get 1.

     So the driver, when at an exit, must assign equal probability to being at the first or the second.

     How to run:

     - The driver is always at an exit when they are called to decide. The first time a driver plays, they are at the first exit. If they choose to continue, then they will be at the second exit (and they are presented with the same decision screen). But note: the driver doesn't know if this is the first or second time they are making a decision. So we must present the decision in exactly the same way each time.

     We can do:

     - The driver is seated at a table. The facilitator has a stack of two identical cards. The driver is told that they are about to encounter an exit. The facilitator places one card face down (this represents the exit). The driver then decides: exit or continue? 

     - If they choose to exit, the facilitator turns the card to reveal which exit it is (the card will have written either "Exit 1" or "Exit 2"). The payoff is given: 0 for Exit 1, 4 for Exit 2.

     - If they choose to continue, then:
          - If the card was Exit 1, then the driver has to do the distractor task. After that, the facilitator places a second card (Exit 2) face down and the driver again decides (without knowing if it's Exit 1 or Exit 2).
          - If the card was Exit 2, then the driver misses both and gets 1.

     The key: the driver doesn't know if the card they are currently facing is the first or the second. They are told that there are two exits and that they are at one of them, with equal probability. But note: if they are at the first card, then the probability of being at the first is 1 and the second is 0. But they are told to act as if it's 1/2. And if they are at the second card, then the probability of being at the first is 0 and the second is 1, but again they are told to act as if it's 1/2.

     This is the core of the absent-mindedness: they are forced to have the same belief at both exits.

     We can run each driver once? Or we can run each driver multiple times? We want multiple data points.

     We can run each driver for one complete trip (which may involve one or two decisions). We can have each student be the driver once (or twice, if time permits).

  #### Steps for the Activity:

  1. **Introduction (5 minutes)**:
     - Explain the payoff structure: 
          - Exit at first exit: 0
          - Exit at second exit: 4
          - Continue at second exit: 1 (miss both)
     - Explain that the driver is absent-minded: when they are at an exit, they don't know if it's the first or the second. They believe each is equally likely.
     - Explain the rules of the game as above.

  2. **Run the simulation (40-50 minutes)**:
     - Each student will take a turn as the driver. For each driver:
          - The driver is presented with a face-down card (the first card, which is always Exit 1 initially, but the driver doesn't know that). 
          - The driver decides to exit or continue.
          - If they exit, reveal the card (it will be Exit 1) and record payoff 0.
          - If they continue, then they do the distractor task (30 seconds). Then they are presented with the second card (Exit 2). They decide again (without knowing it's the second exit).
               - If they exit at the second card: reveal and record payoff 4.
               - If they continue at the second card: record payoff 1.
          - Record the driver's decisions and the payoff.

     However, note: the driver, when at the second card, is told they are at an exit and are equally likely at the first or second. But we know it's the second. So we must present it identically to the first.

     We must record:
          - Driver's decision at the first exit (if they exited, we don't get a second decision).
          - If they continued at the first, then their decision at the second exit.

     We will record on a board:
          Driver | Decision at first exit | Decision at second exit (if any) | Payoff

     Example:
          Driver 1: Exit at first -> payoff 0.
          Driver 2: Continue at first, then Exit at second -> payoff 4.
          Driver 3: Continue at first, then Continue at second -> payoff 1.

     We can run 12 drivers (one per student) in about 40 minutes (each taking about 3-4 minutes, including distractor).

  3. **Debrief (30-40 minutes)**:

     **Step 1: Collect the data**
     - Write on the board the payoff for each driver and the sequence of decisions.

     **Step 2: Pure strategies**
     - Ask: What if every driver always exits? Then they always get 0 (because they exit at the first). 
          - Expected payoff = 0.
     - What if every driver always continues? Then they continue at the first, then at the second and get 1. 
          - Expected payoff = 1.

     **Step 3: Mixed strategies**
     - Ask: What if a driver randomizes? Let p be the probability to continue at an exit (so 1-p is the probability to exit). Then we can compute the expected payoff.

          - The driver is at an exit. With probability 1/2 they are at the first exit, with probability 1/2 at the second (as per their belief).
          - But note: the actual state is determined by the history. We must compute the ex-ante expected payoff (from the start).

     Actually, the ex-ante expected payoff if the driver uses the same p at both exits:

          - At the first exit, the driver continues with probability p -> then goes to the second exit.
          - At the second exit, the driver exits with probability (1-p) -> gets 4, or continues with probability p -> gets 1.

          So the payoff:
            - Exit at first: happens with probability (1-p) at first exit -> payoff 0.
            - Continue at first and then exit at second: probability p*(1-p) -> payoff 4.
            - Continue at first and then continue at second: probability p*p -> payoff 1.

          Total expected payoff: 
            0*(1-p) + 4 * [p*(1-p)] + 1 * [p*p]
            = 4p(1-p) + p^2
            = 4p - 4p^2 + p^2
            = 4p - 3p^2

     Now, maximize this function in p (between 0 and 1). 
          f(p) = 4p - 3p^2
          f'(p) = 4 - 6p
          Set to zero: 4 - 6p = 0 -> p = 4/6 = 2/3.

          Then f(2/3) = 4*(2/3) - 3*(4/9) = 8/3 - 12/9 = 8/3 - 4/3 = 4/3 ≈ 1.333.

     Compare to pure strategies: 0 and 1.

     **Step 4: Compare with class data**
     - In the class data, we have the actual decisions. We can compute the average payoff.
     - We can also compute the probability of continuing at the first exit (which is the proportion of drivers who continued at the first) and the probability of continuing at the second exit (for those who reached the second). But note: the drivers might not have used the same p at both exits? They might have used a different strategy at the second exit because they know they are at the second? But in our setup, they are not supposed to know.

     However, in the activity, the drivers are told that they are equally likely at either exit at each decision. So they should use the same p at both? But in practice, they might use a different p at the second because they might feel that they are more likely at the second? We can discuss.

     **Step 5: The paradox**
     - Planning perspective: the optimal plan is to use p=2/3 at each exit, yielding 4/3.
     - Action perspective: when at an exit, the driver thinks: 
          - If I exit, I get 0 with prob 1/2 (if first) and 4 with prob 1/2 (if second) -> expected payoff = 2.
          - If I continue, I get 1 with prob 1/2 (if second) and ... wait, if I continue and I am at the first, then I go to the second and then I will face the same decision again? And at the second, I will again have the same choice? So the expected payoff of continuing is the same as the overall expected payoff? 

          Let V be the expected payoff from being at an exit. Then:

            V = max{ 
                   (1/2)*0 + (1/2)*4 = 2,   [if exit]
                   (1/2)*V + (1/2)*1        [if continue: if at first (prob 1/2) then I get V again (because I go to the second and face the same situation? but note: at the second, I don't get V, I get the same decision again? Actually, if I continue at the first, I go to the second and then I am again at an exit and get V? That would be recursive.]

          But wait: if I continue at the first, I go to the second and then I face the same decision again? Then:

            V = max{ 2,  (1/2)*V + (1/2)*1 }

          Now, if I assume that at the next exit I will also use the same reasoning, then V must satisfy:

            V = max{ 2, (1/2)V + 1/2 }

          But note: if I choose to continue, then the payoff if I am at the first exit is V (because I go to the second and then get V again) and if I am at the second exit, I get 1. So:

            V = max{ 2, (1/2)*V + (1/2)*1 }

          Now, if I assume that the best I can do at the next exit is V, then I have:

            V = max{2, (V+1)/2}

          Now, if V < 2, then I would choose to exit and get 2. But then V=2. But then if V=2, then continuing gives (2+1)/2 = 1.5, which is less than 2. So the max is 2.

          So the action perspective says: exit at the first opportunity? That gives 2? But wait, how can you get 2? If you exit, you get 0 half the time (if first) and 4 half the time (if second) -> average 2. But note: you are always at the first exit when you start? So if you exit at the first, you get 0. How do you get 4? Only if you are at the second exit. But when you start, you are at the first. So the action perspective seems to assume that you could be at the second exit with 1/2 probability, but that's not the case at the beginning.

     This is the core of the paradox. The driver's belief (that they are equally likely at the first or second) is not correct at the first exit (because they are always at the first). But because of absent-mindedness, they cannot condition on being at the first. They have to use the same belief at both.

     However, note: the ex-ante probability of being at the first exit is 1, and at the second exit is 0. But after the driver continues at the first exit, they are at the second exit. The driver's belief at the second exit is also 1/2 for each, which is also incorrect (they are at the second for sure). 

     So the belief is inconsistent with the actual probabilities. This is because the driver forgets the past. The planning perspective uses the actual probabilities (ex-ante) and the action perspective uses the driver's beliefs at the node.

     We can discuss with the class: 
          - What is the actual frequency of being at the first exit? (In the ex-ante, every driver starts at the first exit. Then half of them (if they continue) go to the second. But at the second exit, they are the same drivers. So the total number of decisions at the first exit is 12 (one per driver) and at the second exit is the number who continued at the first. So the actual probability when making a decision that it is the first exit is: (# of first exits) / (total decisions) = 12 / (12 + (# of second exits)).

          In our data: let N_continue1 = number of drivers who continued at the first exit. Then total decisions = 12 (first exits) + N_continue1 (second exits). So the actual probability of being at the first exit at a random decision is 12/(12+N_continue1). This is not 1/2.

     The driver's belief (1/2) is fixed by the problem, but it doesn't match the actual frequencies.

  #### What will go wrong:
  1. **Memory smuggling**: Students might try to remember if they've done a distractor task or not. We try to disrupt with the distractor task, but it might not be enough. To mitigate, we can vary the distractor tasks (use different ones each time) and make sure they are engaging.

  2. **Refusal to randomize**: Some students might insist on using a pure strategy (e.g., always exit). That's okay because we need a mix of strategies to see the outcomes. But if they do, we can still use their data. We can pre-empt by saying: "You are free to choose any strategy you think is rational, including randomizing or not."

  3. **Understanding the belief**: Students might not understand why they should believe they are equally likely at either exit. We must emphasize that the absent-mindedness forces this belief.

  4. **Time**: 12 drivers might take more than 40 minutes. We can reduce by having only 6 drivers (half the class) and then extrapolate? Or we can run multiple drivers in parallel? But the setup is sequential. Alternatively, we can run each driver twice? But that might be confusing.

     Alternatively, we can have the drivers make a decision for both exits in advance? But that would be the planning perspective. We want them to experience the decision at the exit.

     We can also run the activity with 6 drivers and then use the data for the whole class? But that might not be enough. We can simulate the rest with a computer? Or we can have the students not being drivers also make a decision in writing for what they would do if they were the driver, and then we can simulate with their written strategies? But then they are not experiencing the distractor. 

     Given time, we might run 6 drivers (about 20 minutes) and then use that data and also generate additional data by having the other 6 write down a strategy (p for the first exit and p for the second exit? but note: they are supposed to use the same p at both). Or we can have them write down a single p (to be used at any exit) and then we simulate the outcome for them. Then we can combine the 6 live runs with 6 simulated runs.

  5. **Physical cues**: Even though the exits are identical, the driver might remember the room layout or the time of day. We can have them close their eyes during the decision? Or we can have the facilitator take them to a different room? That might be too much. We can do the entire activity at their seats with cards.

  #### What the activity cannot reproduce:
  - **Voluntary vs. involuntary absent-mindedness**: In the activity, the driver is not truly forgetting; they are being forced to not know by the rules. In reality, the absent-minded driver cannot retain the memory, so they have no choice. In the activity, they might voluntarily not use memory, but they could cheat (by trying to remember). We try to prevent that with the distractor.
  - **Randomization device**: In the activity, if a driver wants to randomize, they might flip a coin. But in the real problem, the driver might not have a coin and must randomize internally. This might change the nature of the decision.
  - **The belief formation**: The driver's belief of 1/2 is given, but in reality, an agent with imperfect recall must form beliefs based on the information available. The problem assumes that the driver uses the prior (1/2) at every exit. But is that rational? There's a literature on consistent belief formation in games with imperfect recall.

  ### Follow-up Homework (Bonus):
  Using the token data from the session, have the students compute:
     - The average payoff of the class.
     - The proportion of drivers who exited at the first exit and at the second exit (for those who reached the second).
     - Compare the observed average payoff to the theoretical optimum (4/3) and to the pure strategies.
     - Have them compute the ex-ante expected payoff if each driver used the same probability p to continue at every exit (using the class's average p) and compare to the actual average payoff.

     Then, ask: Why might the class's average payoff differ from the theoretical optimum? (Possible answers: small sample, drivers used different strategies at the first and second exit, etc.)

     Also, ask: If you were at an exit and had to choose, what would you do? Then, compute the expected payoff of your choice using the belief of 1/2 and compare to the alternative.

  ### Revised Activity Timeline (90 minutes):
  1. Introduction (5 min)
  2. Run the simulation (40 min): 12 drivers, each taking about 3 minutes. (If we run into time issues, we can do 8 drivers and then use the remaining 4 as simulated by the class.)
  3. Data collection on board (5 min)
  4. Debrief: pure strategies and their payoffs (5 min)
  5. Debrief: mixed strategy and computation of optimal p (10 min)
  6. Debrief: comparing class data to theory (10 min)
