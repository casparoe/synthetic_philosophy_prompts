  Here’s a detailed in-class activity design for the absent-minded driver problem, prioritizing experiential learning within a 90-minute seminar. The goal is to immerse students in the paradox before formalizing it.

  ---

  ### **Activity: The Absent-Minded Driver Simulation**
  **Time Allocation**: 45-50 minutes (activity) + 35-40 minutes (debrief)  
  **Participants**: 12 students + instructor (as facilitator)  
  **Materials**:  
  - 12 index cards (6 labeled "EXIT 1", 6 labeled "EXIT 2"; indistinguishable when face-down)  
  - Two opaque bags (Bag A: all "EXIT 1" cards; Bag B: 1 "EXIT 2" card + 5 blank cards)  
  - Timer (for distractor tasks)  
  - Whiteboard to record decisions/payoffs  
  - Tokens (e.g., poker chips): 0 tokens (red), 1 token (yellow), 4 tokens (blue)  
  - Distractor task list (e.g., "Name 5 capitals in Asia", "Recite digits of π backward from 3.14", "Solve 17 × 23")  

  #### **Rules and Procedure**  
  1. **Setup**:  
     - Each student is a "driver." They will face two intersections sequentially.  
     - **Bag A** (EXIT 1) is always used at the first intersection. **Bag B** (EXIT 2 or end-of-road) is used only if the driver continues past the first exit.  
     - Drivers *never* know which intersection they are at. At each intersection, they believe:  
       - Probability they are at Exit 1 = 50%  
       - Probability they are at Exit 2 = 50%  

  2. **Decision Process** (per driver):  
     - **Intersection 1**:  
       - Facilitator draws a card from **Bag A** (always "EXIT 1" but keeps it hidden).  
       - Driver chooses: **EXIT** or **CONTINUE**.  
       - If EXIT: Reveal card → payoff = **0 tokens** (bad area).  
       - If CONTINUE: Move to Intersection 2.  
     - **Distractor Task**: Driver has 30 seconds to complete a mental task (prevents counting/time-tracking).  
     - **Intersection 2**:  
       - Facilitator draws a card from **Bag B**.  
       - If "EXIT 2": Driver chooses EXIT (payoff = **4 tokens**) or CONTINUE (payoff = **1 token**).  
       - If blank card: Trip ends automatically → payoff = **1 token** (motel).  
       - *(Bag B ensures only 1/6 drivers face "EXIT 2"; others hit the motel. This simulates the second exit’s scarcity.)*  

  3. **Key Constraints**:  
     - No discussion during decisions.  
     - Drivers cannot see others’ decisions or payoffs until debrief.  
     - Facilitator tracks true state privately (never reveals intersection numbers mid-game).  
     - Payoffs are revealed **only after final choice** (e.g., "You got 4 tokens!" without context).  

  4. **Token System**:  
     - Tokens are symbolic (no real value).  
     - Record each driver’s choices and payoffs on the whiteboard anonymously (e.g., Driver 3: CONTINUE → EXIT → 4 tokens).  

  ---

  ### **Debrief Structure** (35-40 min)  
  **Goal**: Connect lived experience to theory, spotlighting the paradox.  

  1. **Data Analysis** (10 min):  
     - Compute class averages:  
       - % who exited at first intersection.  
       - % who continued to second intersection.  
       - Average tokens earned.  
     - **Ask**: "Which strategy (always EXIT, always CONTINUE, or mixing) won?"  

  2. **Planning vs. Action Tension** (15 min):  
     - **Planning Perspective**:  
       - Calculate optimal ex-ante strategy: *p* = probability to CONTINUE at any intersection.  
       - Payoff = \(4p(1-p) + p^2 = 4p - 3p^2\).  
       - Maximize: \(d/dp (4p - 3p^2) = 4 - 6p = 0\) → \(p = 2/3\).  
       - Expected payoff = \(4(2/3) - 3(4/9) = 8/3 - 4/3 = 4/3 \approx 1.33\).  
       - Compare to pure strategies:  
         - Always EXIT: payoff = 0  
         - Always CONTINUE: payoff = 1 (motel)  
       - **Key insight**: Mixing beats pure strategies.  
     - **Action Perspective**:  
       - At any intersection, driver believes:  
         - EXIT: 50% chance of 0 + 50% chance of 4 = **2 tokens**.  
         - CONTINUE: 50% chance of motel (1) + 50% chance of future payoff (but future = same choice!).  
       - **Paradox**: CONTINUE’s expected payoff depends on your *plan* for future intersections. If you pre-commit to \(p = 2/3\), CONTINUE yields \(0.5 \times 1 + 0.5 \times (4 \times 1/3 + 1 \times 2/3) = 1.33\). But if you recalculate at every intersection ("I’ll exit next time!"), CONTINUE only gives 1.5.  

  3. **Discussion Prompts**:  
     - "When you were at an intersection, did you feel like you were at Exit 1 or Exit 2? How did that affect your choice?"  
     - "Why might the ‘rational’ choice in the moment (EXIT) conflict with the optimal plan (CONTINUE with p=2/3)?"  
     - "Could you ‘trick yourself’ into sticking to the plan? Or does memory loss make that impossible?"  

  ---

  ### **Predictable Problems & Mitigation**  
  1. **Memory Smuggling**:  
     - **Risk**: Students count intersections, use timers, or note positional cues.  
     - **Fix**:  
       - Use strict distractor tasks (change tasks each time).  
       - Isolate drivers during decisions (face a wall, no clocks).  
       - Randomize facilitator movements (e.g., walk driver to a corner between intersections).  

  2. **Refusal to Randomize**:  
     - **Risk**: A student insists, "I’d never randomize; I’ll always EXIT!"  
     - **Fix**:  
       - Pre-empt: "Your goal is to maximize tokens. Use any strategy you think works."  
       - If resistant: "Treat this as an experiment—try randomizing once to test it."  
       - Debrief: Use their data to show suboptimal payoffs.  

  3. **Time Crunch**:  
     - **Risk**: 12 drivers × 3 min = 36 min + transitions → too long.  
     - **Fix**:  
       - Run 6 drivers (30 min), use data for half the class, and extrapolate.  
       - Simultaneous play: Split into 3 groups of 4. Each has a facilitator (TA/volunteer).  

  ---

  ### **What the Activity *Can’t* Replicate**  
  1. **Voluntary vs. Involuntary Forgetfulness**:  
     - Students *choose* to obey memory constraints ("as-if" forgetfulness). Real absent-mindedness is uncontrollable.  
     - **Implication**: The paradox feels like a "game," not a true cognitive limitation.  

  2. **Physical Randomization Device**:  
     - Using dice/coins makes randomization costless. The original paradox assumes randomization is *internal* (a cognitive act), raising questions about agency.  

  3. **Belief Formation**:  
     - Drivers are *told* "P(Exit 1) = 50%," but real agents must deduce this from memory limitations. Debrief: "Is 50% justified? How would you update beliefs if you could?"  

  ---

  ### **Optional Homework**  
  **Prompt**: Use the class token data to:  
  1. Compute the empirical payoff for pure strategies (always EXIT/always CONTINUE) and mixed strategies (e.g., CONTINUE with p=0.5).  
  2. Compare to the theoretical optimum (p=2/3).  
  3. Argue: "If you were at an intersection, would you obey the optimal plan or recalculate? Does imperfect recall change what ‘rational’ means?"  

  **Goal**: Solidify the planning/action divide using real data.  

  ---

  **Why this works**: Students experience the weirdness firsthand—why mixing feels unnatural, why memory constraints distort beliefs, and why rationality fractures. By confronting the paradox before formalizing it, they’ll have skin in the game during theory discussions.
