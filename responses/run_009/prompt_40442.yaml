prompt: |-
  I sit on a commission drafting the franchise rules for a newly chartered city-state, and I have been testing my gut verdicts on cases in the hope that they trace back to a single principle. Lifetime residents who never naturalized: they should vote. Citizens living abroad for two decades who retain the passport: they should not. Sixteen-year-olds who hold jobs and pay taxes: no. People who have completed prison sentences: yes. Tourists present on election day: obviously not, even though they are subject to our traffic laws the whole time they are here. Persons under guardianship for severe cognitive impairment: no. Yet I also want the assembly's deliberations to weigh the interests of future generations and of the wider region affected by our emissions, without either group casting a ballot. And I find my verdict flips on contract workers admitted for renewable five-year permits depending on whether I picture the city as a cooperative scheme among ongoing participants or as the seat of authority over everyone subject to its rules. Is there one principle — affected interests, stake in the cooperative scheme, subjection to coercion, or something else — that captures all or nearly all of these verdicts? If it takes two principles, say exactly what work each does and which cases lie at their boundary, rather than stitching them together vaguely. Tell me what your preferred principle predicts for a case I have not listed, and be explicit about which of my verdicts you would overturn rather than elaborate the principle to save it. Please answer in continuous prose only — no headings, bullet points, bold text, or tables.
reasoning: |-
  Okay, the user is part of a commission drafting franchise rules for a new city-state and is trying to find a single principle that explains their gut verdicts on various voting eligibility cases. They've listed several scenarios: lifetime residents without naturalization should vote, citizens abroad for decades shouldn't, working 16-year-olds shouldn't, ex-convicts should, tourists shouldn't, people under guardianship shouldn't. They also want the assembly to consider future generations and regional impacts without giving them votes. The user is struggling with contract workers on renewable permits depending on how they view the city—as a cooperative or as an authority.

  Hmm, the core issue here is reconciling different intuitions about voting rights. The user's examples show a pattern: inclusion based on ongoing participation and direct impact of laws, while excluding those with temporary or detached ties. The sticking point is contract workers—viewed as participants when seen through the cooperative lens, but mere subjects when seen as under authority. This duality suggests two principles might be needed.

  First, the principle of ongoing membership in the cooperative scheme. This would cover lifetime residents (deeply integrated), exclude long-term expats (detached), include ex-convicts (reintegrated), and exclude tourists (transient). The second principle is the capacity for autonomous political agency, which excludes minors and those under guardianship due to impaired decision-making. 

  For contract workers, the cooperative principle grants them votes if they're renewable residents contributing long-term, while the subjection principle wouldn't. The user's flip reflects this tension. I'd prioritize the cooperative principle here, granting votes, as it aligns with their "participant" intuition. 

  The user might also be hinting at deeper needs: a framework that feels philosophically coherent yet pragmatically inclusive, avoids arbitrariness, and handles edge cases without exceptions. Their emphasis on future/regional consideration without voting suggests they want systems (like guardianship proxies) to represent non-voters—important for legitimacy. 

  I'd overturn their "contract workers: no" verdict if based on subjection, as the cooperative principle supports inclusion. Future generations and the region are covered by assembly design, not franchise rules. Testing with a new case: temporary refugees—cooperative principle says no (non-integrated), unless residency becomes indefinite.
answer: |-
  Your intuitions largely cohere under a principle of **ongoing, autonomous membership in the self-governing political community**, supplemented by a secondary principle of **capacity for meaningful political agency**. The primary principle focuses on participation in the cooperative scheme, while the secondary principle screens for minimal cognitive and volitional competence necessary to engage in that scheme.

  **Ongoing, Autonomous Membership** captures most cases: Lifetime residents are embedded participants in the cooperative project. Citizens abroad for decades, despite formal status, lack ongoing participation and direct stake in daily governance consequences. Tourists are transient subjects of authority but not cooperative members. Contract workers on renewable permits *should* vote if they are integrated long-term participants contributing to society—your "cooperative scheme" intuition is correct. Their subjection to rules alone is insufficient; their renewable status implies provisional membership, but if renewal is routine and they build lives locally, inclusion aligns with cooperative participation. Prisoners post-release regain membership status as they reintegrate.

  **Capacity for Meaningful Political Agency** explains exclusions rooted in impaired autonomy: Sixteen-year-olds, even if employed, generally lack the life experience and cognitive maturity for sustained political judgment. Those under severe guardianship lack the capacity to exercise political will independently. This principle is subordinate—it doesn't grant rights to capable non-members (e.g., brilliant tourists) but excludes incapable members.

  **Boundary Cases**: Contract workers sit precisely at the membership boundary. If permits are truly temporary (e.g., fixed 5-year non-renewable), exclusion may hold. But if renewable indefinitely with de facto permanence, inclusion follows. The secondary principle handles minors: A precocious 16-year-old philosopher still lacks the settled autonomy and experience of adulthood.

  **Your Verdicts Overturned**: 
  1.  **Contract workers** *should* vote under the cooperative principle if their permits imply enduring participation. Your subjection-based exclusion is rejected.  
  2.  **Ex-convicts post-sentence** are included, which you support—but this overturns any residual "civic death" notions lingering in some systems.

  **New Case Prediction**: Consider *temporary refugees* residing 10+ years awaiting resettlement. Under ongoing membership, they participate in community life long-term but lack formal permanence. The principle would *exclude* them—their status remains provisional, oriented toward departure, not cooperative self-government. This exclusion feels harsh but underscores membership's requirement of intentional permanence.

  **Non-Voter Interests**: Future generations and affected regions are rightly excluded from the franchise—they aren’t members of the polity. Their interests belong in the assembly’s deliberative *duties* (e.g., via environmental impact assessments, custodial mandates), not voter eligibility. This separates membership from moral responsibility.

  **Inconsistency Addressed**: Your "subjection to coercion" intuition (traffic laws applying to tourists) is rightly discarded. Subjection is necessary but insufficient; the core is active participation in the cooperative project of self-rule. Guardianship exclusions rely on agency, not membership—a distinct filter. The two principles operate sequentially: First, is the person an ongoing autonomous member? If yes, then: can they exercise agency? Only with both "yes" does the franchise follow. This framework saves all your verdicts except contract workers (included) and refines the flip on them as a membership boundary case, not a contradiction.
