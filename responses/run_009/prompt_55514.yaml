prompt: |-
  Here's a thought experiment that keeps derailing my seminar discussions, so I want to reframe it as a question about what a theory owes us rather than a duel of intuitions. The case: a single innocent person is tortured for fifty years, versus a barely-noticeable dust speck, once, in the eye of each of 3^^^3 people (a tower of iterated exponentials so large that even the number of digits in the number of digits is beyond physical reality). The people pushing the torture side insist that any harm, however small, must be able to sum; the specks side insists that some harms are so trivial no number of them can reach a different order of magnitude. I'm a public policy student, so this isn't idle for me: every cost-benefit analysis that totals a minute of delay for ten million commuters against one death, or a small cancer risk spread across a population against a visible harm to a few, is a scaled-down version of the same question, and I'd like to know what standard I should hold a view to before anyone starts defending one.

  Write me the desiderata list for an adequate theory of interpersonal aggregation of harms. I have some candidate requirements I'd like you to include, plus whatever else you think belongs. First, the anchoring cases: it has to get the trivial cases right (one speck in one eye is a negligible harm; fifty years of torture is among the worst things that can happen to a person) — a theory that can't say both is a non-starter, but say whether you think these are genuine desiderata or just the intuitions the whole debate is supposed to be testing. Second, symmetry: if 3^^^3 specks were all delivered sequentially to one person's eye, most people would say that is torture by another name, so intra-personal aggregation of trivial harms clearly does cross thresholds; a theory owes us an account of why or whether inter-personal aggregation differs, and "because the specks land on different people" is doing enormous work that needs to be spelled out. Third, flip disclosure: a theory should say where, if anywhere, its verdict changes as the population grows — between a thousand speck-sufferers and a trillion and 3^^^3 — and if it flips at some point, it must own the arbitrariness or justify the threshold. Fourth, the lottery test: a tiny probability of torture imposed on each of many people is mathematically very close to the specks case (small harms distributed over persons), so must a theory treat ex ante risk aggregation and ex post harm aggregation alike? Fifth, workability at human scale: the theory should deliver verdicts for realistic numbers, not just astronomically large ones, since that's where I'd actually use it. And I suspect some of my candidates are partisan demands smuggled in as neutral requirements — the "separateness of persons" constraint looks like it may just be a premise of one camp — so flag which items on the list are genuine desiderata and which are prejudices of a side.

  Finally, two things I most want to see: identify any subset of the desiderata that cannot be jointly satisfied (if symmetry, flip disclosure, and the anchoring cases conflict, that conflict is itself the result, and I want it located precisely), and tell me which single requirement does the most to eliminate contenders. Then, briefly, run three familiar positions against the list — strict lexical thresholds where trivial harms never sum, straightforward linear summation, and the Parfitian middle path where large benefits to many can outweigh harms to a few without any summing of the small harms themselves — and say where each fails rather than which wins. No readings, no literature review; the criteria and the tensions are what I'm after.
reasoning: |-
  Okay, the user presents a fascinating ethical dilemma that bridges philosophy and public policy. They're clearly frustrated with how seminar discussions derail into intuition battles, and want to reframe it as a meta-question about what makes a theory adequate. That's smart - they're looking for evaluative criteria rather than answers.

  Hmm, their background in public policy explains the urgency. This isn't academic for them; they're implicitly asking how to justify real-world trade-offs like traffic delays vs fatalities or distributed cancer risks. The thought experiment is just a pressure-test for theories they need to apply professionally.

  Let me unpack their candidate requirements. The anchoring cases seem non-negotiable - any theory denying torture is worse than a speck would be absurd. But they're right to question whether these are genuine desiderata or debate premises. I'd argue they're foundational: a theory that can't recognize extreme harm magnitudes has bigger problems.

  The symmetry point is brilliant. If sequential specks become torture, why not distributed ones? The theory must explain why personal identity matters - and "separateness of persons" can't just be asserted. This might be where theories fracture.

  Flip disclosure is their most original contribution. Any aggregation theory must declare if/when it flips verdicts as population grows. Threshold theories should admit arbitrariness; continuous ones must defend why trillions of microharms aggregate. This exposes hidden discontinuities.

  The lottery connection is insightful. Ex ante risks (1% chance of torture for 100 people) feel like distributing harm. If a theory treats risks and harms differently, it owes an explanation - especially since policy often deals in probabilities.

  Workability matters practically. Theories only useful at 3^^^3 scales are useless for actual policy. But they might counter that edge cases test principles.

  I agree their worry about smuggled premises is valid. "Separateness of persons" does favor threshold views. I'll flag such items clearly.

  For the conflicts: symmetry vs anchoring seems explosive. If distributed specks don't aggregate but sequential do, that privileges personal identity in ways that may contradict our torture intuition. And flip disclosure forces threshold theories into uncomfortable specificity.

  On contenders: Strict lexical thresholds fail symmetry spectacularly. Linear summation handles anchoring but implodes at astronomical numbers. Parfit avoids summing microharms but struggles with the lottery parallel.

  The core tension? Whether ethics cares about harm tokens (which aggregate linearly) or harm-bearers (which demand thresholds). No theory escapes this unscathed.
answer: |-
  Here’s a rigorous desiderata list for an interpersonal harm aggregation theory, designed to isolate core tensions and evaluate contenders. Your candidate requirements are included (marked ★), alongside essential additions. **Bold** denotes genuine desiderata; *italic* flags partisan-leaning items. Conflicts are pinpointed.

  ---

  ### **Desiderata for an Adequate Theory of Interpersonal Harm Aggregation**  
  1.  **★ Anchoring to Extreme Cases**:  
      - Must recognize *fifty years of torture* as catastrophic harm.  
      - Must recognize *one dust speck* as negligible harm.  
      - **Genuine desideratum** (failure implies the theory cannot map basic moral reality).  

  2.  **★ Symmetry Requirement**:  
      - Must explain why *sequential trivial harms to one person* (e.g., 3^^^3 specks) aggregate to catastrophic harm, but *distributed harms to many* may not.  
      - **Genuine desideratum** (tests consistency in handling harm aggregation across vs. within persons).  

  3.  **★ Flip Disclosure**:  
      - Must specify if/when verdict flips as population scales (e.g., from 1,000 to 3^^^3 sufferers).  
      - If a threshold exists, must justify its non-arbitrariness or openly acknowledge arbitrariness.  
      - **Genuine desideratum** (exposes discontinuities or hidden assumptions).  

  4.  **★ Lottery Test Parity**:  
      - Must treat *ex ante probabilistic harms* (e.g., 1/3^^^3 chance of torture per person) and *ex post actual harms* (e.g., dust specks) consistently.  
      - **Genuine desideratum** (tests whether harm "location" in time/possibility affects aggregation).  

  5.  **★ Workability at Human Scales**:  
      - Must deliver clear verdicts for realistic populations (e.g., 10^3–10^9 people) and harms (e.g., minutes lost, minor risks).  
      - **Genuine desideratum** (theories only applicable to infinities are useless for policy).  

  6.  **No-Vanishing Harm Constraint**:  
      - A harm recognized as *real but trivial* cannot be treated as *literally zero* (e.g., dust specks ≠ nonexistent).  
      - **Genuine desideratum** (prevents "disappearing" harms via definitional tricks).  

  7.  ***Separateness of Persons**:  
      - *May* require that harms to distinct persons cannot be "merged" into a single moral unit.  
      - **Partisan-leaning** (often smuggled in to block aggregation; contradicts symmetry).  

  8.  **Anti-Aggregation Saturation**:  
      - *May* demand a cap on total disvalue from microharms, regardless of population size.  
      - **Partisan-leaning** (favors anti-summation views; conflicts with anchoring if applied asymmetrically).  

  ---

  ### **Key Conflict: Incompatible Desiderata**  
  - **Symmetry + Anchoring + Flip Disclosure → Contradiction**:  
    - Symmetry suggests distributed specks *should* aggregate like sequential ones (to torture-equivalent).  
    - Anchoring requires distributed specks *cannot* outweigh torture (per anti-specks intuition).  
    - Flip Disclosure forces a choice: either distributed harms *never* sum sufficiently (violating symmetry) or they *eventually do* (violating anchoring).  
    - **Result**: No theory can satisfy all three without compromising one.  

  ---

  ### **The Single Most Eliminative Requirement**  
  **Symmetry Requirement**:  
  - Forces theories to explain why person-boundaries matter for harm summation.  
  - Eliminates:  
    - Strict lexical thresholds (fail symmetry spectacularly).  
    - Linear summation (treats intra/inter-personal aggregation identically, *ignoring* separateness).  
    - Most compromise views (e.g., "soft" thresholds) struggle to justify asymmetry.  

  ---

  ### **Evaluating Three Theories Against Desiderata**  
  | **Theory**               | **Core Claim**                                      | **Key Failure(s)**                                                                 |  
  |--------------------------|----------------------------------------------------|-----------------------------------------------------------------------------------|  
  | **Strict Lexical Thresholds** | Trivial harms *never* sum to outweigh serious harms. | ✗ **Symmetry**: Sequential specks become torture, but distributed do not—no coherent reason why.<br> ✗ **Flip Disclosure**: Implies a discontinuity but cannot justify where/when it occurs (e.g., why not at 10^100 specks?).<br> ✗ **Lottery Test**: A 1/3^^^3 torture risk per person must be negligible, but this trivializes risk aggregation. |  
  | **Straightforward Linear Summation** | All harms sum additively across persons.             | ✗ **Anchoring**: 3^^^3 specks outweigh torture—violates intuition that torture is incomparably worse.<br> ✗ **Workability**: Demands impossible precision for tiny harms (e.g., is 0.0001s of discomfort = 10^-6 disutility?).<br> ✗ **Anti-Aggregation Intuition**: Ignores "separateness" without argument. |  
  | **Parfitian Compromise** | Large benefits to many *can* outweigh harms to few, but *without summing microharms* (e.g., via "balancing"). | ✗ **Symmetry**: No explanation why sequential microharms sum but distributed ones do not.<br> ✗ **Lottery Test**: Risks are microharms in expectation; rejecting summation here undermines ex ante fairness.<br> ✗ **Flip Disclosure**: Implicitly denies aggregation, but can’t specify why 3^^^3 benefits outweigh torture if microharms don’t sum. |  

  ---

  ### **Conclusion**  
  The **Symmetry-Anchoring conflict** is the core rupture: if sequential specks become torture, why not distributed ones? Theories must either:  
  - **Deny symmetry** (e.g., by insisting person-boundaries block summation), violating the intuition that repeated trivial harms *to one person* accumulate.  
  - **Deny anchoring** (e.g., by accepting 3^^^3 specks > torture), violating the intuition that torture is uniquely horrific.  
  - **Deny flip disclosure** (e.g., by claiming verdicts never change with scale), which seems empirically false.  

  For policy, focus on **workability at human scales** and **lottery test parity**—these are least contentious and most actionable. A theory failing these is inert; one failing symmetry or anchoring may still be usable if transparent about its trade-offs. The dust speck/torture paradox remains unresolved because it demands a choice between equally defensible moral priorities.
