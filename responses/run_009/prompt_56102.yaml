  I'm taking a philosophy of mathematics course, and we've just covered Skolem's paradox: the downward Löwenheim–Skolem theorem applied to first-order ZFC yields a countable model of a theory that proves, inside the model, that the reals are uncountable. My professor treats the paradox as a pseudo-problem, on the grounds that the countability in the theorem is assessed from outside the model, so no contradiction arises so long as one keeps the internal and external notions of countability apart. A classmate of mine disagrees: she holds that the theorem undermines the very idea of an intended model of set theory, and thereby the determinacy of our reference to "the" set-theoretic universe. My credence that Skolem's paradox reflects a genuine philosophical problem, rather than a merely verbal confusion, is about 0.35; hers is about 0.75. Please give your own number, but more importantly decompose it: the probability that the internal/external distinction fully dissolves the tension; the probability that set theory has, or could have, a determinate intended model in the first place; the probability that the loss of such a model would be a cost for mathematics itself rather than only for a platonist metaphysics; and any further terms you think belong. Then combine them into your overall credence, tell me which term you are least confident in, and what argument or technical result would move that term the most.
