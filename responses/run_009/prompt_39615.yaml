prompt: |-
  So I'm a third-year PhD student and I'm TA-ing intro metaphysics for the first time (my area is ethics, great). Next week I have one fifty-minute section on persistence: endurantism vs perdurantism, temporal parts, the whole thing. The lecturer already spent most of the lecture on the Ship of Theseus, so that example is completely burned — if I bring it up again their eyes will glaze over, and anyway it just pushes them towards the fission/criteria-of-identity swamp, which is a different unit. I don't want you to explain the two views to me; I know them. I want a plan for the section itself: the order the pieces have to go in, and I mean the actual dependency structure, because I have a genuine question about that — my instinct is that the numerical vs qualitative identity distinction has to come first and that the problem of temporary intrinsics (the bent poker sort of case) should be the engine of the whole session rather than a technical dessert at the end, but I'm not sure whether that's right or whether students need the worm/stage picture on the table before temporary intrinsics can land as a problem rather than a pun.

  Second thing: the carrying example. It can't be the Ship, and I'd rather not do persons either, because persons immediately drag in personal identity and everyone starts relitigating Parfit instead of thinking about change. I tried the road analogy with my office mate — the road is one thing but it has a flat bit and a hairpin bit — and it half worked, except I worry it secretly teaches them that temporal parts are just spatial parts with a time label slapped on, which is exactly the confusion I need to not install. So tell me what the one example should be, what it has going for it, and what it predictably goes wrong at.

  Third: misconceptions, in the order students will actually form them, with the exact point in the sequence where each should be headed off. My guesses about what's coming: that perdurantism says nothing really persists, that it says change is unreal (the "the worm just sits there" reading), that endurantism is just common sense and perdurantism is the crazy revisionist position you'd only adopt if you hated common sense, and — guaranteed, because there's one physics double-major in the section — that special relativity has already settled this in favor of temporal parts so the whole debate is fighting the last war. I don't know whether to give the relativity point five minutes or whether to honestly defer it to the followup lecture the professor is doing on the topic, so tell me what you'd do. Also, do I fold stage theory in as a third view or present it as perdurantism's cousin with a different answer to who I am when I point at a photo of me as a kid? I suspect fifty minutes can't hold all three as equal citizens, but I'm not sure what to cut and say out loud that I'm cutting it.

  And then a check for understanding at the end — one question I could ask that would actually discriminate between a student who's got the dialectic and one who's just memorized the labels. My current attempt is something like asking them to explain why "the poker is bent" and "the poker is straight" don't contradict each other, but I suspect that's checkable without really understanding the debate, so fix or replace it. Please don't give me readings to assign, the syllabus is set, I just need the arc.
reasoning: |-
  Okay, let me tackle this TA's problem step by step. They're teaching an intro metaphysics section on persistence and need a solid plan. First, I need to understand their constraints: 50 minutes, Ship of Theseus is off-limits, must avoid personal identity examples, and they want to focus on the structural dependencies of concepts. Their main question is about sequencing—should they start with numerical vs qualitative identity or dive straight into the problem of temporary intrinsics? 

  Hmm, I recall that without grounding the discussion in numerical identity first, students might conflate it with qualitative similarity. That's a common confusion. But the temporary intrinsics problem is really the engine that drives the debate—it makes the abstract metaphysics feel urgent. So maybe a sandwich approach: start with numerical identity to set the stage, then use temporary intrinsics to create tension, and only then introduce perdurantism as a solution. That way, the worm/stage theory doesn't feel like an arbitrary add-on. 

  For the example, roads are tempting but risky—they might reinforce the spatial-parts misconception. A simple clay sculpture changing shape feels safer. It's tactile, avoids relativistic complications, and makes intrinsic properties (like shape) central. Though I should warn about potential misunderstandings, like thinking temporal parts are just "time slices" in a naive sense. 

  Misconceptions will pop up fast. The "perdurantism means nothing persists" one needs to be headed off immediately after explaining temporal parts. Maybe emphasize that the whole worm *is* the persistent object. And that physics major? Best to acknowledge relativity briefly but defer details—this is a metaphysics class, not physics. Stage theory can be a footnote; 50 minutes is tight. 

  For the check at the end, asking how perdurantism resolves the poker contradiction is decent, but students might parrot "time-relativization." A twist: ask them to explain why an endurantist *wouldn't* say that. That forces them to engage with both views' mechanisms. 

  Whew. This feels coherent, but I’ll double-check—did I miss anything? The TA’s skepticism about the road example was spot-on, and their instinct about temporary intrinsics as the engine seems right. Just need to ensure the sculpture example doesn’t backfire... maybe emphasize that temporal parts aren’t spatial by contrasting a statue’s shape-change with a road’s segments. Yeah, that should work.
answer: |-
  Here's a battle-tested plan for your 50-minute section, structured for conceptual dependency and avoiding common pitfalls:

  **The Arc: 50-Minute Breakdown**

  1.  **Hook & Core Distinction (7 mins):**
      *   **Start with Change:** "We all agree things change. My coffee was hot, now it's cold. This oak sapling was 1m tall, now it's 10m. How is this *possible*? How can one thing have incompatible properties?"
      *   **Numerical vs. Qualitative Identity:** "This forces us to distinguish: *Being the same thing* (numerical identity) vs. *Being exactly similar* (qualitative identity). Change requires numerical identity over time despite qualitative difference."
      *   **Why First?** Non-negotiable foundation. Without this, "the poker is bent and straight" sounds like nonsense, not a philosophical problem. Ground it in intuitive examples (coffee, tree, your own height/weight/haircut).

  2.  **Introduce the Problem: Temporary Intrinsics (The Engine) (10 mins):**
      *   **Poker Example (Bent/Straight):** Present it crisply. "Here's a poker. At T1 it's straight. At T2 it's bent. We say it's the *same* poker (numerical identity). But it has incompatible intrinsic properties (straightness, bentness). How is this coherent?"
      *   **Why Engine?** This *is* the core problem persistence theories must solve. It makes the debate urgent and concrete. Avoid technical terms (endurantism/perdurantism) yet.
      *   **Student Brainstorm (Quick):** "What are some ways we *could* explain how the poker can be both straight and bent without contradiction?" (Gets intuitions flowing: "Well, at different times!")

  3.  **Introduce Endurantism (5 mins):**
      *   **The Common-Sense View:** "Endurantism says: The poker *wholly exists* at T1 when it's straight. It *wholly exists* again at T2 when it's bent. It persists by being *fully present* at multiple times. Change is the object itself gaining and losing properties."
      *   **The Challenge:** "But how exactly? *How* can the very same object, wholly present now, *be* bent now but also *have been* straight then? What is the 'having been' relation?" (Plant the seed of unease).

  4.  **Introduce Perdurantism (Worm Theory) (15 mins):**
      *   **The Solution to the Engine:** "Perdurantism offers a solution: The poker isn't *wholly* present at T1 or T2. Instead, it's a four-dimensional 'spacetime worm'. It has *temporal parts*: a straight temporal part at T1, a bent temporal part at T2."
      *   **Key Analogy: The Clay Sculpture (Your Workhorse Example):**
          *   **Setup:** Imagine a sculptor starts with a lump of clay (Part A). She shapes it into a sphere (Part B). Later, she flattens it into a slab (Part C).
          *   **The Persisting Thing:** The entire clay object stretching through time (A+B+C) – the "worm".
          *   **Temporal Parts:** Part A (lump), Part B (sphere), Part C (slab) – distinct stages/slices.
          *   **Change Explained:** "The sculpture is spherical-at-T2" = The T2 temporal part (B) is spherical. "The sculpture is lumpish-at-T1" = The T1 temporal part (A) is lumpish. No contradiction because different parts have the properties.
          *   **Why Clay?** (1) Avoids Ship/Person baggage. (2) Clear intrinsic property change (shape). (3) Tangible. (4) Avoids spatial-parts conflation: Emphasize Part B *is* spherical *simpliciter* at T2, just like the entire worm *has* a spherical temporal part at T2. It's not that the worm *is* spherical; it *has* a part that is. Contrast with road segments: The *whole* road doesn't *have* a flat segment in the same way perdurantism uses temporal parts; the segment *is* part of the road spatially, but perdurantism is about the *object* having temporal *constituents*. Stress: "Temporal parts are *parts* of the persisting object, just like your arm is a spatial part. The whole object (worm) has these temporal parts *as constituents*."

  5.  **Addressing Misconceptions (Head-On & Proactively) (8 mins):**
      *   **Order & Timing:**
          1.  **"Nothing Persists!" (After introducing Perdurantism):** "Does this mean nothing *really* persists? NO! The entire spacetime worm *persists* through time by having different temporal parts located at different times. The worm *is* the persistent object. Think of the whole clay timeline (A+B+C) – *that* is the one persisting thing."
          2.  **"Change is Unreal!" (After Clay Example):** "Does this mean change isn't real? NO! Change is the *variation* in properties across the object's own temporal parts. The clay *really* changes from lump to sphere to slab – that variation across its parts *is* the change." (Contrast with a static lump).
          3.  **"Endurantism = Common Sense, Perdurantism = Crazy" (During Comparison):** Acknowledge endurantism feels intuitive. BUT: "Perdurantism isn't *denying* persistence or change; it's offering a different metaphysical model *to explain* persistence through change, specifically designed to solve the problem of temporary intrinsics cleanly. Which model best fits *all* the data (including science) is the debate."
          4.  **Special Relativity (Address Briefly):** "Great point! Yes, relativity complicates 'simultaneity' and might favor a four-dimensional picture. *However*, metaphysics asks *what persistence fundamentally is*, even in a Newtonian world. Is perdurantism *only* motivated by relativity, or does it solve deep metaphysical problems like temporary intrinsics independently? We'll touch more on relativity next week – for today, let's focus on the core metaphysical puzzle driving the views." (Defer details, validate the concern, pivot back to metaphysics).
      *   **Stage Theory:** Mention it *very briefly* as a close cousin to perdurantism when describing the worm: "Some philosophers (stage theorists) think only the *current* temporal part exists fundamentally, and talk of persistence is about how stages are interrelated. But today, we're focusing on the two main models: endurance vs. perdurance (worm view)." Don't present as a full third view.

  6.  **Check for Understanding (The Discriminating Question) (5 mins):**
      *   **Ditch the Poker Contradiction:** Too easy to parrot "different times" without grasping the *mechanism*.
      *   **The Discriminator:** "Imagine the clay sculpture (the perdurantist's spacetime worm). At T1, it's lump-shaped. At T2, it's sphere-shaped. According to the *endurantist*, why is it *not* contradictory to say the sculpture is both lump-shaped and sphere-shaped? According to the *perdurantist*, why is it *not* contradictory? **Crucially: How do their explanations fundamentally *differ**?"*
      *   **Why it Works:** A student who gets it will say:
          *   **Endurantist:** The sculpture is lump-shaped *at T1* and sphere-shaped *at T2*. The properties are time-indexed (relational) to the wholly present object. The *having* of the past property is explained by a tensed fact or relation.
          *   **Perdurantist:** The sculpture (worm) *has* a temporal part at T1 that is lump-shaped and a *different* temporal part at T2 that is sphere-shaped. The properties are borne by different *parts* of the whole object.
      *   This forces them to articulate the core mechanisms (time-indexing properties vs. distributing properties to parts) and shows they grasp the *structural difference* between the views, not just labels.

  **Key Rationale for the Sequence:**

  1.  **Identity Distinction First:** Essential to frame the problem (same thing, different properties). Skipping this risks students thinking the debate is about whether things *seem* the same.
  2.  **Temporary Intrinsics as Engine:** Makes the debate *necessary*. It shows *why* we need these complex theories. Presenting perdurantism first makes it seem unmotivated. The problem creates the tension the views resolve.
  3.  **Clay over Road:** Avoids spatial conflation. Shape change is clearly intrinsic. The "has a part" language is more natural (the worm *has* a spherical stage) than for a road (the road *has* a flat segment? Sure, but it's spatial). It's harder to confuse the spherical temporal *part* with a spatial part *of* the sphere.
  4.  **Proactive Misconception Busting:** Address them *as they naturally arise* in the exposition (e.g., "nothing persists" right after introducing temporal parts). Don't wait for Q&A.
  5.  **Relativity Deferred (Politely):** Acknowledge it exists and is relevant, but firmly situate *this* session on the *metaphysical* problem driving the core debate. "Next week's lecture will dive into that."
  6.  **Stage Theory Sidelined:** 50 minutes is tight. Mentioning it exists prevents confusion if it comes up later, but don't develop it. Focus on the core dichotomy.
  7.  **Discriminating Question:** Focuses on the *explanatory mechanism* for resolving the core problem, requiring understanding of both views' structures.

  **Predictable Pitfalls & Mitigation for the Clay Example:**

  *   **Pitfall:** "So temporal parts are just like spatial parts, but in time?" **Mitigation:** Explicitly contrast: "Yes, they are *parts*, but they bear the intrinsic properties *simpliciter* at their time. The *whole* worm isn't spherical; it *has* a temporal part that *is* spherical *at T2*. Crucially, the temporal part *isn't* a spatial part *of* the sphere; it *is* the sphere-at-T2."
  *   **Pitfall:** "But the clay *itself* just changes shape!" **Mitigation:** "Exactly! That's the endurantist intuition. The perdurantist agrees the shape changes, but argues the best way to *account* for how one thing can have incompatible intrinsic shapes is by having different temporal parts bearing those shapes."
  *   **Pitfall:** Confusing the temporal part (the sphere-stage) with the persisting object. **Mitigation:** Hammer "the spacetime worm (A+B+C) is the persisting object. The sphere (B) is a *part* of it located at T2."

  **Execution Mantra:** Be crisp. Use the board: Draw the poker times, the clay worm with labeled parts (A-Lump, B-Sphere, C-Slab), contrast endurantist vs. perdurantist diagrams for the clay at T1 and T2. Keep bringing it back to "How does this solve the problem of temporary intrinsics?" Good luck – you've got this!
