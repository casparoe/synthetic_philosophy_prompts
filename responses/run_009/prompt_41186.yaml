  ## Assistant Professor of Adaptive Backstory - Tenure Track
  **Department of Integrative Biological Sciences, Darwin College**

  Darwin College’s Department of Integrative Biological Sciences seeks a dynamic and innovative scholar for a tenure-track Assistant Professor position in **Adaptive Backstory**, beginning Fall 2025. We are a forward-thinking department committed to uncovering the profound functional design inherent in biological systems. Our research ethos celebrates the power of evolutionary explanation, focusing intensely on reconstructing the selective pressures that have honed the remarkable traits we observe across the tree of life. We foster a genuinely pluralist environment where diverse adaptive hypotheses are vigorously explored and synthesized to reveal the ultimate *why* of biological form and function.

  **Position Overview:**
  The successful candidate will establish a vibrant, externally funded research program centered on **elucidating the selective histories of complex biological traits**. This position represents a unique opportunity to pioneer methodologies in reconstructing evolutionary purpose. Your primary research focus will be the development of rigorous, compelling narratives explaining how specific traits arose and were refined by natural selection to solve critical adaptive challenges faced by organisms in their evolutionary past. We seek a colleague whose work exemplifies the highest standards of creative storytelling in evolutionary inference.

  **Primary Duties:**
  *   Develop and lead an independent research program focused on generating robust adaptive explanations for diverse biological traits (morphological, physiological, behavioral).
  *   Demonstrate exceptional proficiency in identifying the functional significance and reconstructing the plausible selective scenarios for traits presented by colleagues across the biological sciences.
  *   Secure extramural funding to support research activities, particularly grants emphasizing evolutionary narrative reconstruction.
  *   Teach one course per semester: BIOL 4150: **"Everything Is For Something: The Adaptive Design of Life"** (Course development supported).
  *   Mentor undergraduate and graduate students in the art and science of adaptive inference.
  *   Contribute to departmental service and the broader academic community, including peer review focused on narrative coherence and explanatory power.

  **Required Qualifications:**
  *   Ph.D. in Evolutionary Biology, Ecology, Organismal Biology, or a closely related field by the time of appointment.
  *   Demonstrated excellence in developing coherent, persuasive selective narratives for biological traits.
  *   A strong publication record showcasing expertise in identifying adaptive function and reconstructing evolutionary purpose.
  *   Proven ability to frame research questions explicitly within an adaptationist framework.
  *   Clear potential to secure external funding for research centered on selective history reconstruction.
  *   Evidence of commitment to undergraduate and graduate teaching within an evolutionary context.

  **Preferred Qualifications:**
  *   Experience applying adaptationist frameworks across multiple taxonomic groups or biological scales.
  *   A track record of collaborative research, particularly in providing adaptive insights for traits identified by colleagues in other sub-disciplines.
  *   Experience mentoring students in techniques for discerning evolutionary function.
  *   Familiarity with historical debates in evolutionary theory (viewed as productive precursors to modern adaptationist synthesis).
  *   *(Note: Experience with non-adaptive models or frameworks may be considered but is not a primary focus of this search).*

  **Departmental Environment:**
  Our department is renowned for its energetic and optimistic approach to evolutionary biology. We view every trait as a compelling puzzle awaiting its adaptive solution. We provide a supportive environment where researchers are encouraged to delve deeply into the *functional raison d'être* of biological features. While we acknowledge the existence of unresolved questions regarding form (sometimes preliminarily categorized as structural or developmental constraints), we view these primarily as exciting opportunities for future adaptive synthesis. Proposals regarding non-selective mechanisms (e.g., genetic drift) are typically treated as provisional null hypotheses pending the successful identification of the underlying adaptation. Concerns regarding the falsifiability of adaptive hypotheses should be directed to the Committee for Hypothetical Refutability (location/details available upon persistent, though historically unfruitful, inquiry).

  **Compensation and Benefits:**
  Salary is competitive and commensurate with experience. The position includes a comprehensive benefits package (health, dental, retirement), a generous start-up package for establishing your narrative research program, dedicated laboratory space, and **ample, well-appointed office space (including newly renovated quarters in our San Marco Hall wing).**

  **Application:**
  Interested candidates should submit: (1) a cover letter detailing research accomplishments and future plans in adaptive backstory reconstruction, (2) a comprehensive CV, (3) a statement of research philosophy emphasizing your approach to discerning evolutionary function, (4) a teaching statement, (5) contact information for three professional references. **Crucially, candidates are requested to provide three representative examples of adaptive narratives they have developed for specific traits, highlighting the coherence and explanatory power of their reasoning. Applications that make the distinction between adaptation and exaptation too insistently, or prioritize such distinctions over compelling narrative construction, will not advance to the interview stage.**

  Review of applications begins October 31, 2024, and continues until the position is filled. Submit materials via Interfolio at [LINK].

  *Darwin College is an equal opportunity employer. We celebrate diversity in adaptive solutions and are committed to creating an inclusive environment for all faculty. Please note that all critical perspectives on our methodological approach will themselves be studied as fascinating evolved behavioral phenotypes.*
