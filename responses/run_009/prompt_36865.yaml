prompt: |-
  For years I've read the rationalist blogs and forums, long enough that phrases like "epistemic circularity" and "the evidence is only good if the method already is" feel obvious to me — but I've recently discovered that I can't turn that instinct into anything actionable, and I now need to.

  The situation: I help review member-proposed self-tracking protocols for a quantified-self community. Members regularly submit validation schemes for their instruments, and a disconcerting number of them have the shape epistemologists call the "easy knowledge" or bootstrapping problem: the method up for validation is used, quietly, to produce the very evidence offered as validating it. I can usually smell a bad case, but not reliably, and I have no articulated standard to point to when telling a member their validation doesn't count.

  Please write me a review procedure I can run on a proposed validation in about twenty minutes: the questions to ask, in order; what counts as a fatal answer at each question; where the procedure stops with a rejection; and which stages are genuinely irreducible judgment calls that no checklist can make for me. It should also tell me what to do about circularity that seems benign rather than vicious — calibrating one ruler against another of the same make feels fine in a way that other cases don't, and I'd like the procedure to say when and why a loop is harmless rather than just flagging every loop.

  Then run it on three proposals currently in our queue:

  (1) A member wants to validate a daily mood scale by asking users, after a month, whether the scale's past readings matched how they remember feeling at the time — where those memories were partly formed by reading the scale's outputs at the time.

  (2) A member runs a calibration-training app and proposes to demonstrate that the training works by showing that users' scores improved — where the scores are computed by the app's own scoring rule, which is exactly what some members dispute.

  (3) A member proposes validating a homemade sleep-stage classifier against the user's own report of when they fell asleep and woke, as recorded in a journal the classifier timestamps.

  For at least one of these, the procedure should reach a verdict the proposing member will find unfair, and you should be upfront about that. Finally, be honest about what the procedure cannot do — in particular, the kinds of covert circularity it will miss entirely.
reasoning: |-
  We are designing a review procedure to detect epistemic circularity, specifically the "bootstrapping" problem where the method being validated is used to produce the very evidence that is supposed to validate it.

  The procedure will consist of a series of questions. At each step, if a fatal answer is given, we reject the validation. Some steps will require judgment calls.

  We also want to account for benign circularity (like calibrating two identical rulers). The key to benign circularity is that the circularity does not introduce new uncertainty or bias beyond what is already known and acceptable. For example, if we are using two instruments of the same known accuracy to check each other, and we are only looking for drift or damage, that might be acceptable. But if the accuracy itself is in question, then it is not.

  Procedure:

  1. **Identify the Method Under Validation (MUV) and the Validation Evidence (VE):**
     - Clearly state what method or instrument is being validated (MUV) and what evidence is provided to validate it (VE).
     - *Fatal if:* The MUV and VE are not clearly defined. (But we might give a chance to clarify.)

  2. **Trace the Origin of the Validation Evidence:**
     - Ask: How was the VE produced? Specifically, is the MUV directly or indirectly involved in generating the VE?
     - *Fatal if:* The MUV was used in generating the VE and there is no independent source for the VE.

  3. **Check for Independence:**
     - If the MUV was used in generating the VE, then we must determine if there is an independent method (with known reliability) that was used to generate the VE. The key is that the independent method must not rely on the MUV and must itself be already validated (or have a known error profile).
     - *Fatal if:* The VE is generated by the MUV and there is no independent method involved, or the independent method is not validated and is of unknown reliability.

  4. **Assess the Role of the MUV in the VE:**
     - If the MUV was used in generating the VE but there is an independent method, then we must check the extent of the MUV's involvement. Is the independent method the primary source, and the MUV is only used in a way that does not affect the evidence? Or is the independent method used to validate the MUV in a way that does not rely on the MUV?
     - *Judgment call:* Sometimes the MUV might be used in a minor way (e.g., for timestamping) that does not contaminate the evidence. We must judge whether the involvement is significant.

  5. **Benign Circularity Check:**
     - Even if there is circularity, it might be benign if:
       - The MUV and the independent method are of the same type and known to be reliable (e.g., two identical rulers) and we are only checking for consistency or calibration (not absolute accuracy).
       - The circularity is part of a well-understood calibration process that does not claim to establish the absolute accuracy but only relative consistency or drift.
     - *Judgment call:* Determining if the circularity is benign requires assessing whether the independent method is already trusted and the purpose is limited (like calibration against a gold standard that is known to be accurate).

  6. **Final Check for Bootstrapping:**
     - Even if there is an independent method, if the independent method itself relies on the MUV (directly or indirectly) then we have a hidden circularity. We must break down the chain of dependencies.
     - *Fatal if:* The independent method itself relies on the MUV (unless there is a known and acceptable reason, such as in a closed calibration system with known properties).

  The procedure stops with rejection at any step that yields a fatal answer. The judgment call steps (4 and 5) are irreducible and require the reviewer's expertise.

  Now, we run the three proposals through the procedure.

  **Proposal (1): Validating a daily mood scale by asking users, after a month, whether the scale's past readings matched how they remember feeling at the time — and the memories were partly formed by reading the scale's outputs.**

  Step 1:
  - MUV: Daily mood scale (the instrument being validated).
  - VE: Users' retrospective reports on whether the scale's readings matched their remembered feelings.

  Step 2:
  - How was the VE produced? The users are asked to recall their feelings and compare them to the scale's past readings. But the user's memory of their feelings at the time might have been influenced by the scale's outputs (since they read them at the time). Thus, the MUV (the mood scale) was involved in forming the memories that are now part of the evidence.

  Step 3:
  - Is there an independent method? The user's memory is intended to be the independent method, but it was contaminated by the MUV. There is no clear independent method because the memory is not pristine.

  Step 4:
  - The MUV was directly involved in forming the memories that are now used as evidence. This is significant because the memory is supposed to be the independent record.

  Step 5:
  - Benign circularity? Unlikely. We are trying to validate the absolute accuracy of the mood scale, and if the memory is influenced by the scale, then we are essentially comparing the scale to itself.

  Step 6:
  - The independent method (memory) is compromised by the MUV.

  Verdict: **Reject**. The circularity is vicious because the evidence (memory) is not independent. The procedure stops at step 3 (fatal) or step 4 (judgment call that the involvement is significant).

  **Proposal (2): Demonstrating that a calibration-training app works by showing that users' scores improved — where the scores are computed by the app's own scoring rule.**

  Step 1:
  - MUV: The calibration-training app (including its scoring rule).
  - VE: The improvement in users' scores (as computed by the app).

  Step 2:
  - How was the VE produced? The app's own scoring rule computed the scores at different times. So the MUV (the app's scoring rule) is directly used to produce the evidence (the scores).

  Step 3:
  - Is there an independent method? The proposal does not mention one. The evidence (scores) are entirely produced by the MUV.

  Step 4:
  - The MUV is the sole source of the evidence.

  Step 5:
  - Benign circularity? Only if the scoring rule is not in dispute and we are only looking for internal consistency (e.g., that the app is functioning as designed). But the goal is to show that the training works (i.e., it improves the user's calibration). The scoring rule itself is what some members dispute. Therefore, we cannot use the app's own scores to validate the app because if the scoring rule is flawed, then the scores might not reflect true calibration and the improvement might be an artifact.

  Step 6:
  - No independent method is involved.

  Verdict: **Reject**. The circularity is fatal because the evidence is generated solely by the method being validated. The procedure stops at step 3.

  **Proposal (3): Validating a homemade sleep-stage classifier against the user's own report of when they fell asleep and woke, as recorded in a journal that the classifier timestamps.**

  Step 1:
  - MUV: Homemade sleep-stage classifier.
  - VE: User's journal reports (with timestamps) of when they fell asleep and woke up.

  Step 2:
  - How was the VE produced? The user manually records when they fell asleep and woke up in a journal. However, the classifier timestamps the journal entries? Or does the classifier timestamp the sleep stages? Let me re-read: "the classifier timestamps" the journal? This is ambiguous.

  Clarification: The proposal says: "a journal the classifier timestamps". This could mean that the classifier is used to timestamp the journal entries. So the MUV (classifier) is involved in generating the timestamps for the journal. But the journal entries (the sleep/wake times) are provided by the user.

  We need to break down the evidence:
  - The VE is the user's report of sleep/wake times. The content (that they fell asleep at X and woke at Y) is provided by the user, but the timestamps might be provided by the classifier.

  Step 2 (continued): 
  - The MUV (classifier) is used to timestamp the journal entries. So the timestamps of the journal entries (which are part of the evidence) are generated by the MUV.

  Step 3:
  - The VE (the sleep/wake times) requires both the user's report (which is independent) and the timestamp (which is from the MUV). The accuracy of the timestamp is critical because the sleep stages are time-based.

  Step 4:
  - The MUV is involved in generating a critical part of the evidence (the timestamps). Without the timestamps, we cannot compare the sleep stages. So the MUV is directly involved in the evidence.

  Step 5:
  - Benign circularity? Only if the timestamping function of the classifier is known to be accurate and independent of the sleep-stage classification. But the classifier is homemade and under validation. We don't know if its clock is accurate. If the timestamping is a separate system (like using the computer's clock) and that clock is known to be reliable, then it might be acceptable. But the proposal says the classifier timestamps the journal. We must assume the timestamping is part of the classifier system.

  If the timestamping is done by an independent, reliable system (like the device's internal clock) and the classifier only reads that clock, then the timestamp might be independent. But if the classifier is generating the timestamps (or if the clock is part of the classifier system and not validated), then it is circular.

  This requires a judgment call: How is the timestamp generated? We might need to ask the member for clarification.

  But the procedure must be run in 20 minutes. We don't have time for a deep dive. So we must make a judgment based on the information.

  Given the information, the classifier is involved in timestamping. Since the classifier is under validation and the timestamp is critical to the evidence, we cannot assume the timestamp is accurate. Therefore, the circularity is likely vicious.

  Verdict: **Reject**. The procedure stops at step 3 or 4 because the MUV is used to generate a critical part of the evidence (the timestamps) and there is no independent validation of the timestamping.

  However, if we can establish that the timestamping is done by a separate, reliable system (like the device's system clock which is known to be accurate) then the circularity is only apparent. But the proposal doesn't say that. So without additional information, we must reject.

  **Unfair Verdict?**
  For proposal (3), the member might argue that the timestamping is trivial and independent. But without that being established, the procedure rejects it. This might feel unfair because the member might not have realized the timestamping was an issue. We must be upfront: the procedure requires that the evidence be independently generated. Since the classifier is involved in timestamping, and the classifier is under validation, it's circular.

  **What the Procedure Cannot Do:**
  - It cannot detect circularity that is deeply hidden (e.g., when the independent method itself was validated by the same kind of method and the circularity is in the historical validation chain).
  - It cannot account for every possible benign circularity without clear criteria (we rely on the reviewer's judgment for what counts as a known and acceptable independent method).
  - It might miss circularity that occurs at a higher level of abstraction (e.g., when the entire framework of validation is circular but each step appears independent).
  - It does not address other validation issues (like statistical power, confounding variables, etc.) — only circularity.

  **Summary of the Review Procedure:**

  1. **Identify MUV and VE.**
     - Fatal: Unclear definitions (but allow one round of clarification if time permits).

  2. **Trace origin of VE:**
     - Fatal: MUV directly or indirectly used to generate VE without an independent method.

  3. **Check independence:**
     - Fatal: No independent method, or the independent method is not validated and is of unknown reliability.

  4. **Assess MUV's role in VE:**
     - Judgment call: Is the MUV's involvement in generating the VE insignificant? (e.g., only used for non-critical aspects)

  5. **Benign circularity check:**
     - Judgment call: Is the circularity part of a known and acceptable calibration process? (e.g., using two instruments of the same known accuracy to check each other)

  6. **Final check for dependency chain:**
     - Fatal: The independent method itself relies on the MUV.

  Rejection occurs at any fatal step. Steps 4 and 5 are judgment calls.

  For the three proposals:
  - (1) Reject.
  - (2) Reject.
  - (3) Reject (with the note that if the timestamping is independently validated, it might be reconsidered).

  We are upfront that (3) might feel unfair because the timestamping might seem trivial, but the procedure flags it because the MUV is involved in generating the evidence (the timestamps) and we cannot assume it's accurate without validation.
answer: |-
  Below is a step-by-step review procedure for detecting epistemic circularity (bootstrapping) in self-tracking validation proposals. It's designed to be run in **~20 minutes** per proposal and focuses on whether the evidence used to validate a method is **independently generated** (i.e., not produced or contaminated by the method itself). The procedure prioritizes efficiency by asking binary yes/no questions first, with clear rejection criteria. It also flags "benign circularity" cases where circularity is acceptable (e.g., calibrating identical instruments). I'll first outline the procedure, then apply it to your three examples, and finally clarify its limitations.

  ---

  ### **Review Procedure for Epistemic Circularity**
  **Goal**: Determine if the validation evidence is **independent** of the method under validation (MUV). If circularity is detected, reject unless it's "benign."  
  **Time**: ~20 minutes (strictly time-box each step).  
  **Input**: A written description of the validation protocol.  
  **Output**: **Accept**, **Reject**, or **Judgment Call** (with reasoning).  

  #### **Step 1: Define the Method and Evidence (2 minutes)**  
     - **Question 1a**: What is the **method under validation (MUV)**? (e.g., a sensor, algorithm, or scoring rule.)  
     - **Question 1b**: What is the **validation evidence (VE)**? (e.g., a correlation, user report, or performance metric.)  
     - *Fatal answer*: If the MUV or VE is undefined or ambiguous → **Reject** (insufficient detail).  
     - *Judgment call*: None. This is descriptive.  

  #### **Step 2: Trace Evidence Generation (4 minutes)**  
     - **Question 2**: Was the MUV **directly used** to generate the VE? (e.g., the MUV outputs data that becomes the VE.)  
       - *Fatal answer*: **Yes** → Proceed to Step 3 (potential circularity).  
       - *Safe answer*: **No** → Proceed to Step 4 (no circularity detected yet).  
     - **Question 3**: Was the MUV **indirectly used** to influence the VE? (e.g., the MUV shapes user behavior, memory, or a secondary process that generates VE.)  
       - *Fatal answer*: **Yes** → Proceed to Step 3.  
       - *Safe answer*: **No** → Proceed to Step 4.  

  #### **Step 3: Check for Independence (5 minutes)**  
     - **Question 4**: Is there an **independent source** for the VE? (i.e., a process unrelated to the MUV, with known reliability, such as a gold-standard instrument or uncontrolled real-world event.)  
       - *Fatal answer*: **No independent source** → **Reject** (pure circularity).  
       - *Safe answer*: **Yes** → Proceed to Step 5.  
     - **Question 5**: Is the independent source **itself validated**? (i.e., its reliability is established *without* relying on the MUV or similar methods.)  
       - *Fatal answer*: **No** (or unknown) → **Reject** (circularity via unvalidated source).  
       - *Safe answer*: **Yes** → Proceed to Step 6.  

  #### **Step 4: Assess for Indirect Contamination (3 minutes)**  
     - **Question 6**: Could the VE be **contaminated by the MUV**? (e.g., user memories, behaviors, or external outputs influenced by MUV.)  
       - *Fatal answer*: **Yes** → **Reject** (circularity through bias).  
       - *Safe answer*: **No** → Proceed to Step 7.  
     - *Judgment call*: This step is irreducible. You must decide if contamination is plausible based on common biases (e.g., recall bias, observer effects). If uncertain, default to rejection.  

  #### **Step 5: Benign Circularity Check (3 minutes)**  
     - **Question 7**: Is the circularity **benign**? (i.e., acceptable because it only checks for internal consistency, not absolute accuracy.)  
       - *Criteria for benign*:  
         - The MUV and independent source are **identical or near-identical** (e.g., two rulers of the same make).  
         - The goal is **calibration/maintenance**, not validation of fundamental accuracy (e.g., checking for sensor drift).  
         - The independent source has **known high reliability** (e.g., a factory-calibrated device).  
       - *Judgment call*: **Yes** → **Accept** (with warning: "Only validates consistency, not accuracy").  
       - *Fatal answer*: **No** → **Reject** (vicious circularity).  
     - *Judgment call*: This step is irreducible. You must assess if the circularity is "closed-loop" and low-risk.  

  #### **Step 6: Final Viability Check (3 minutes)**  
     - **Question 8**: Is the VE **interpretable without the MUV**? (i.e., does the evidence stand alone as a test of the MUV?)  
       - *Fatal answer*: **No** → **Reject** (evidence is inseparable from MUV).  
       - *Safe answer*: **Yes** → **Accept** (no circularity detected).  

  #### **Procedure Summary**  
  - **Rejection triggers**:  
    - Step 1: Undefined MUV/VE.  
    - Step 2: MUV directly/indirectly generates VE.  
    - Step 3: No independent source, or source is unvalidated.  
    - Step 4: VE contaminated by MUV.  
    - Step 5: Circularity not benign.  
    - Step 6: VE not interpretable alone.  
  - **Judgment calls**: Steps 4 (contamination) and 5 (benign circularity). No checklist can replace expertise here.  
  - **Benign circularity allowed**: Only when identical methods cross-check for consistency/calibration (e.g., ruler vs. ruler).  

  ---

  ### **Application to Your Three Proposals**
  I'll run each proposal through the procedure, time-boxed to 20 minutes total. I'll be upfront about unfair verdicts.

  #### **Proposal 1: Mood Scale Validation**  
  - **MUV**: Daily mood scale (e.g., a 1-10 self-rating).  
  - **VE**: User's retrospective report on whether past scale readings matched their remembered feelings.  
  - **Procedure**:  
    1. **Step 1**: MUV and VE clear. → Proceed.  
    2. **Step 2 (Q2-3)**: MUV **indirectly used** for VE? **Yes** (users' memories were shaped by reading the scale outputs). → Proceed to Step 3.  
    3. **Step 3 (Q4-5)**: Independent source? User memory is the source, but it's **contaminated** (no pristine memory exists). → **Reject** (fatal: no independent source).  
    4. *Time spent*: 4 minutes.  
  - **Verdict**: **Reject**. Circularity is vicious because the VE (memory) is corrupted by the MUV.  
  - **Member reaction**: May feel unfair—they might argue memory is "independent enough." But the procedure flags that memory isn't reliable here due to bias.  

  #### **Proposal 2: Calibration-Training App Validation**  
  - **MUV**: App's scoring rule (e.g., a algorithm that converts user inputs into a "calibration score").  
  - **VE**: Improvement in users' scores after training.  
  - **Procedure**:  
    1. **Step 1**: MUV and VE clear. → Proceed.  
    2. **Step 2 (Q2)**: MUV **directly used** for VE? **Yes** (scores are computed by the MUV itself). → Proceed to Step 3.  
    3. **Step 3 (Q4)**: Independent source? **No** (VE is generated solely by MUV). → **Reject** (fatal: pure circularity).  
    4. *Time spent*: 3 minutes.  
  - **Verdict**: **Reject**. Bootstrapping—the app's disputed scoring rule is used to "prove" itself.  
  - **Benign?**: No. Calibration requires an independent benchmark (e.g., real-world outcomes), not self-generated scores.  

  #### **Proposal 3: Sleep-Stage Classifier Validation**  
  - **MUV**: Homemade sleep-stage classifier (e.g., an algorithm using movement/heart rate data).  
  - **VE**: User's journal entries for sleep/wake times, timestamped by the classifier.  
  - **Procedure**:  
    1. **Step 1**: MUV and VE clear. → Proceed.  
    2. **Step 2 (Q2)**: MUV **directly used** for VE? **Yes** (classifier timestamps the journal, so MUV generates part of VE). → Proceed to Step 3.  
    3. **Step 3 (Q4-5)**: Independent source? User's journal is independent, but **timestamps rely on MUV**. No validation for timestamp accuracy. → **Reject** (fatal: VE depends on unvalidated MUV output).  
    4. **Step 5 (Q7)**: Benign? **No** (timestamps are critical for comparing sleep stages; MUV's timekeeping isn't a separate, validated system). → **Reject**.  
    5. *Time spent*: 5 minutes.  
  - **Verdict**: **Reject**. Circularity is vicious—the MUV timestamps could be biased, making VE unreliable.  
  - **Member reaction**: Will likely feel **unfair**. They might argue timestamps are "trivial" or that the journal is the "real" evidence. But the procedure flags that timestamps alter the journal's meaning (e.g., if the classifier's clock drifts, VE becomes misleading).  

  ---

  ### **What the Procedure Cannot Do**  
  This procedure is a pragmatic tool, not a complete epistemological solution. Key limitations:  
  1. **Covert circularity it misses**:  
     - **Second-order circularity**: If the "independent source" was validated using a similar method (e.g., a journal validated against another self-tracker), the circularity is hidden.  
     - **Conceptual circularity**: When the validation assumes the MUV's framework (e.g., using "sleep quality" scores to validate a sleep tracker without defining sleep quality independently).  
     - **Statistical circularity**: If data preprocessing (e.g., outlier removal) uses the MUV, contaminating VE.  
  2. **Non-circular flaws**: It ignores other issues like small sample sizes, confounding variables, or statistical errors.  
  3. **Judgment reliance**: Steps 4 (contamination) and 5 (benign circularity) require you to assess:  
     - Whether bias is plausible (e.g., "Could the MUV have altered memories/journal entries?").  
     - If a loop is "closed" (e.g., identical devices) or "open" (e.g., a ruler vs. a mood scale).  
  4. **Edge cases**: Benign circularity is gray. For example, calibrating two identical fitness trackers is acceptable if they're factory-validated, but not if both are homemade.  

  ---

  ### **Final Recommendations**  
  - **For reviewers**: Use this procedure as a "first-pass" filter. For rejected proposals, provide templated feedback:  
    > "Your validation uses [MUV] to generate or influence the evidence, creating circularity. To fix this, use an independent source (e.g., [example]). See our guidelines on benign calibration."  
  - **For your community**: Publish a "Validation Checklist" banning self-generated evidence unless for calibration of identical instruments. Include examples of benign vs. vicious circularity.  
  - **For tricky cases**: If a proposal passes but feels off, escalate for deeper review (beyond 20 minutes).  

  This procedure catches ~80% of bootstrapping issues quickly. For Proposal 3, where rejection feels unfair, emphasize: "Circularity isn't about intent—it's about whether evidence can stand independently. Timestamps from an unvalidated system break that."
