prompt: |-
  My friend and I got into it at like 1am about Marx and automation — this started because I said something about AI taking jobs and he goes "well Marx called all this." He's read a fair amount, more than me honestly, so I couldn't really push back, but the way he laid it out felt off and I want to know how much of it I can trust. Here's basically his summary as best I can reconstruct it:

  Marx's central prediction about capitalism is that it collapses under its own machines. As automation spreads, workers get displaced en masse, so wages dry up, nobody can buy the products, and the system seizes up — he laid this out as the falling rate of profit thing. He also had this concept of the reserve army of labor, meaning the unemployed, and for Marx that pool just grows and grows until you get a crisis of permanent mass unemployment. On top of that Marx thought machinery was bad for workers in itself — the machines themselves, not just who owns them — since he wrote all that stuff about the machine being the worker's enemy coming to life. And in his notebooks (the Grundrisse, before Capital) he said automation eventually makes capitalism literally impossible, because once machines do all the work, labor time stops being the source of value, so a system built on labor value just can't keep going. My friend's takeaway was that Marx basically predicted full automation ending capitalism and that anyone arguing for UBI on the grounds that automation is coming is just doing warmed-over Marx without knowing it.

  Some of this sounds right to me and some of it I genuinely can't tell, but a few things nagged at me even mid-argument. Doesn't the "workers can't buy the stuff" story sound more like Keynes or underconsumption theory than Marx, who I vaguely remember criticized exactly that kind of explanation? And the "machines are bad in themselves" part seems too simple for someone who's usually read as caring about social relations. But maybe I'm wrong, I've only read the Manifesto and chunks of Capital vol 1.

  So: go through his summary claim by claim and give me a real verdict, not a "well it's complicated" — for each piece, is it accurate, is it a subtle distortion (and of what), or just wrong, and say which you actually think rather than listing what different scholars say. Then tell me straight whether his conclusion follows — the UBI one. Is someone arguing for UBI because of automation "basically a Marxist," or is that glossing over real differences about what the problem even is and what the fix is? Take a position, I'm fine with you being wrong, I just want something I can actually bring back to him.
