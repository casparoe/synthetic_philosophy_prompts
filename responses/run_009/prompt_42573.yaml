prompt: |-
  I've been trying to work out what I actually think about unrealistic assumptions in scientific models, starting from my gut verdicts on cases, and I'd like to know whether some principle captures them. Milton Friedman's old line — the one critics nicknamed the F-twist — was roughly that a theory's assumptions don't matter, only its predictions do, and that the more significant a theory is, the more unrealistic its assumptions will be; I half believe him and half think it's a rationalization for sloppiness, so I went looking at cases.

  My verdicts: treating planets as point masses is obviously fine. Modeling committee-run, habit-bound, sometimes incompetent firms as unerringly rational profit maximizers — and getting industry exit patterns right anyway — is fine, though the assumption is false in every particular; somehow the mistakes wash out in the aggregate. Treating a falling coffee filter as if there were no air resistance is not fine: there the idealization deletes the very phenomenon you're modeling. A macroeconomic model with a representative agent, used to conclude that a policy leaves everyone better off, is not fine either — heterogeneity is exactly what's at issue, so the false assumption is load-bearing. But here's the case that bothers me: a Schelling-style toy model of residential segregation, false in essentially every descriptive detail, is fine — it genuinely explains a real pattern. So a model with one false assumption is bad while a model false all over is good, and the only thing I can say is that in the toy model the falsity is spread thin, while in the representative-agent case it's concentrated exactly where the question is. I don't trust that formulation and want it sharpened or replaced.

  One more data point: I'm fine with intro physics teaching frictionless planes as explicit scaffolding that later models will add friction back to, but I'm told the same scaffolding story is told about some idealizations in economics that have been waiting decades to be relaxed, and I'm inclined to say that's not fine — although I can't say what the difference is, and Friedman would presumably deny there is one.

  Please give me the principle, or a small set of candidates, stated precisely: which case motivates each clause, what it predicts for a case I haven't listed — say, a standard SIR epidemic model that assumes homogeneous mixing, used first to ballpark a herd-immunity threshold and then to decide whom to vaccinate first — and an honest statement of which of my verdicts it cannot accommodate. I'd also like you to say what would change your mind about the principle you land on: which case or consideration would pull you to a different one, and where your reasoning here is most likely to fail.
reasoning: |-
  Okay, let me try to unpack this user's query. They're struggling with when unrealistic assumptions in scientific models are acceptable. They've listed several cases where they have intuitive judgments but can't find a consistent principle. The main tension seems to be between Friedman's view that only predictions matter and their sense that some false assumptions are problematic when they directly affect the phenomenon being studied.

  First, I need to analyze each case they mentioned. The point masses in astronomy work because gravity's inverse-square law makes details negligible at large distances. For profit-maximizing firms, even though individual firms aren't perfectly rational, the market forces average out the errors. But in the coffee filter example, ignoring air resistance removes the key aspect of the motion, so it's invalid. The representative agent in macroeconomics fails because individual differences matter for policy impacts. Yet Schelling's segregation model, despite all its simplifications, still explains segregation through a core mechanism.

  The user is bothered by the contradiction that a model with one false assumption (like ignoring heterogeneity) is bad, but one that's false everywhere (like Schelling's) is good. The key difference might be whether the falsehood obscures the causal mechanism or not. In Schelling's case, the simplicity highlights how slight preferences lead to segregation, while the representative agent hides distributional effects.

  They also mention the scaffolding argument in physics versus economics. In physics, frictionless models are stepping stones to more complex models, but in economics, some idealizations persist without advancement. The user is skeptical of perpetual scaffolding. So the principle needs to address whether the idealization is temporary and productive.

  I recall the literature on models, like Weisberg's robustness or Cartwright's capacities. Maybe combining these ideas could help. The principle should distinguish between harmless and harmful idealizations based on whether they affect the explanatory mechanism or are necessary for the conclusion.

  For the SIR model example, homogeneous mixing is fine for herd immunity estimates because the population average suffices. But for vaccination priorities, heterogeneity (like superspreaders) is crucial, so the assumption becomes load-bearing. This supports the idea that the context of the question matters.

  The user wants a precise principle, so I need to formulate it carefully. The core could be: an idealization is problematic if it directly interferes with the phenomenon under investigation or distorts the mechanism being studied. Also, scaffolding is only valid if there's progress toward de-idealization. Cases like Schelling's model are okay because the mechanism remains intact despite surface inaccuracies.

  But where might this fail? If a model has a false assumption that doesn't seem central but indirectly affects outcomes, or if a field stagnates with idealizations without empirical progress. The user's concern about economics models that never advance is valid, but distinguishing temporary from permanent scaffolding is tricky. Maybe requiring that the idealization leads to productive research, even if not immediately abandoned.

  Another challenge: sometimes highly unrealistic models can be heuristic tools without direct empirical application. But the user seems focused on explanatory models. So specifying the model's purpose is important.

  In summary, the principle should have clauses about the assumption not masking the target phenomenon, not being load-bearing for the specific question, and scaffolding having a track record of refinement. Admit that cases with indirect effects or unclear progress in scaffolding might not fit perfectly. The SIR case for vaccination prioritization shows that the same model can be valid for one question but not another, emphasizing the importance of the specific inquiry.
answer: |-
  Here's a precise principle capturing your core intuitions, derived from your cases and designed for explanatory models (not just predictive tools):

  **Principle of Non-Interference with the Explanatory Mechanism (NIXM):**
  An unrealistic assumption in a scientific model is acceptable *only if*:
  1.  **Non-Interference:** The assumption does not interfere with, distort, mask, or delete the core causal mechanism or phenomenon under investigation. (Motivated by: Coffee filter, Rep Agent vs. Fine: Point Masses, Profit Max, Schelling)
  2.  **Non-Load-Bearing for the Question:** The assumption is not critical ("load-bearing") for the *specific conclusion* drawn from the model regarding the real-world target system. (Motivated by: Rep Agent vs. Fine: Schelling, Profit Max)
  3.  **Scaffolding Justification (Optional but Important):** If claimed as scaffolding (temporary idealization), there must be a plausible, demonstrable path or active research program towards relaxing the assumption *and* the idealized model demonstrably aids in building more realistic models or understanding. (Motivated by: Intro Physics vs. Perpetual Economics Scaffolding)

  **Applying NIXM to Your Cases:**

  1.  **Planets as Point Masses (Fine):**
      *   *NIXM1:* Gravity depends only on mass and distance. Position/orientation don't *interfere* with the core gravitational mechanism at large distances. Phenomena like orbits are captured.
      *   *NIXM2:* For orbital dynamics, the conclusion doesn't *depend* on the planet's size/shape being non-zero in the model.
  2.  **Firms as Rational Profit Maximizers (Fine):**
      *   *NIXM1:* Market competition *acts as if* firms maximize profit. Individual irrationalities often *wash out* (don't interfere) with the aggregate outcome mechanism (entry/exit).
      *   *NIXM2:* The conclusion about aggregate exit patterns *emerges* from competition, not from each firm *literally* being perfectly rational.
  3.  **Falling Coffee Filter: No Air Resistance (Not Fine):**
      *   *NIXM1:* Air resistance *is* the dominant mechanism determining terminal velocity and the shape of the fall. Deleting it *deletes* the phenomenon.
  4.  **Macro Model: Rep Agent (Not Fine):**
      *   *NIXM1:* Heterogeneity (in income, preferences, debt, constraints) *is central* to how policies distribute effects. Assuming it away *masks/distorts* the very mechanism in question.
      *   *NIXM2:* The conclusion "everyone is better off" *directly depends* on the false assumption of homogeneity. It *is* load-bearing for this conclusion.
  5.  **Schelling Segregation Model (Fine):**
      *   *NIXM1:* The *core mechanism* (minor preference for similar neighbors leading to large-scale segregation via tipping points) is preserved *despite* surface inaccuracies. The falsities (grid, simple rules) don't *interfere* with demonstrating this emergent causal logic.
      *   *NIXM2:* The conclusion "mild preferences can cause segregation" doesn't *depend* on the specific details being realistic; it emerges from the preference structure.
  6.  **Intro Physics: Frictionless Planes (Fine w/ Scaffolding):**
      *   *NIXM1:* While friction *is* involved, the core kinematic/dynamic relationships (F=ma, conservation laws) *can* be studied without it initially. Friction is introduced explicitly later. It doesn't *delete* the phenomenon being studied *at that stage* (e.g., acceleration concepts).
      *   *NIXM3:* Clear, immediate, and successful path exists: adding friction is the *very next step* in the curriculum and in physics understanding. It demonstrably builds foundational concepts.
  7.  **Perpetual Economic Scaffolding (Not Fine):**
      *   *NIXM3:* Violated. The claim of being scaffolding lacks credibility if there's no progress relaxing it after decades, especially if the idealization is known to be crucial. It fails the "demonstrable path" and "aids building" test.

  **Applying NIXM to the SIR Model Case:**

  *   **Ballpark Herd Immunity Threshold (Likely Fine):**
      *   *NIXM1:* Homogeneous mixing captures the *core mechanism* of pathogen spread through population contacts well enough for a *rough aggregate estimate*. Heterogeneity might affect the *exact* threshold, but doesn't *delete* the concept.
      *   *NIXM2:* The *conclusion* (a threshold exists, roughly around 1-1/R0) doesn't *critically depend* on perfect homogeneity for its ballpark validity; it's a population-level emergent property.
  *   **Deciding Whom to Vaccinate First (Likely Not Fine):**
      *   *NIXM1:* Heterogeneity (superspreaders, contact networks, age/risk groups) *is the core mechanism* determining optimal targeting. Homogeneous mixing *distorts/masks* this mechanism.
      *   *NIXM2:* The optimal vaccination strategy conclusion *directly depends* on heterogeneity. Assuming homogeneity makes the conclusion (e.g., random vaccination is optimal) likely false and potentially harmful. It *is* load-bearing for *this* specific question.

  **Where NIXM Struggles / Cannot Fully Accommodate Your Verdicts:**

  1.  **The "Washing Out" Intuition (Profit Max):** NIXM *allows* this case (NIXM1: mistakes don't interfere *in aggregate*), but doesn't explicitly *define* "washing out" or quantify when aggregation neutralizes false assumptions. Your gut feeling about aggregation is crucial, but NIXM captures the *outcome* (non-interference) rather than the *process* (washing out). This might feel slightly underspecified, though it fits.
  2.  **Friedman's "More Significant, More Unrealistic":** NIXM *rejects* Friedman's claim that unrealistic assumptions *per se* are a virtue. Significance comes from capturing the mechanism (NIXM1) without it being load-bearing (NIXM2) for the question. Friedman would argue NIXM is unnecessary fussiness; NIXM argues Friedman ignores crucial cases (Coffee Filter, Rep Agent).

  **What Would Change My Mind About NIXM:**

  1.  **A Case Where Deleting the Mechanism is Useful for Explanation:** If you found a convincing example where *deleting* the core phenomenon (like air resistance in the coffee filter) genuinely *aided* in explaining a *different, important* aspect of that phenomenon or a related one, in a way that wasn't just temporary scaffolding (NIXM3), NIXM1 would be challenged. (E.g., "If ignoring air resistance somehow perfectly explained *why* coffee filters flutter, I'd reconsider." But it doesn't).
  2.  **A Load-Bearing False Assumption Yielding Robust Truth:** If you found a clear case where a conclusion *critically depended* on a known-false assumption (violating NIXM2), yet that conclusion was robustly and verifiably true across contexts where the assumption *didn't* hold, NIXM2 would be weakened. (E.g., "If representative agent models, *relying* on homogeneity, consistently predicted distributional outcomes correctly despite heterogeneity, I'd reconsider." But they often don't).
  3.  **Productive Perpetual Scaffolding:** If you found a field where highly unrealistic "scaffolding" assumptions persisted for decades, were never relaxed in core models, yet demonstrably and uniquely drove *all* major progress and accurate predictions in that field, NIXM3 would be challenged. (Economics itself *might* be argued here by Friedmanites, but the lack of uncontested predictive success and the existence of alternatives like ABMs/heterogeneous agent models makes this weak).

  **Where My Reasoning is Most Likely to Fail:**

  1.  **Defining "Core Causal Mechanism" (NIXM1):** This is somewhat contextual and subjective. Is the "core mechanism" in segregation *only* the preference threshold, or does it *include* realistic mobility patterns? NIXM relies on scientific judgment here, which isn't always sharp. Your Schelling vs. Rep Agent distinction highlights this – both involve aggregation, but you judge one mechanism essential (heterogeneity) and the other not (individual firm rationality). NIXM codifies *your* judgment but might struggle with borderline cases.
  2.  **"Load-Bearing" Nuance (NIXM2):** How *directly* must the conclusion depend on the false assumption? In the SIR case for vaccination targeting, the dependence is clear. But what about a model with a false assumption that subtly biases results in ways hard to detect? NIXM focuses on egregious cases but might miss subtler distortions.
  3.  **Scaffolding Progress (NIXM3):** Judging a "plausible, demonstrable path" is historical and sociological. How much progress is enough? How long is too long? This clause is necessary to capture your physics/economics distinction but introduces fuzziness.

  NIXM provides a principled framework justifying your specific verdicts, centered on whether the falsehood actively *harms* the model's *explanatory purpose* for the *specific question* asked, while allowing for productive idealization and scaffolding. It directly opposes Friedman's dismissal of assumptions and offers a sharper tool than "falsity spread thin."
