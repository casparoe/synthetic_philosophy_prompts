prompt: |-
  I sit on the clinical governance committee of a hospital network, and our quality dashboard has just thrown up a Simpson's paradox: taking all admissions together, our network posts a lower 30-day mortality rate than the regional average, but split by admission severity, we do worse at every severity level. The board has concluded from this that the aggregate comparison is a mere statistical artifact — an illusion that always dissolves once you disaggregate — and wants me to write into our reporting policy a clause that stratified results always override the headline figure. Before I draft it: is the board's general rule actually sound, or are there questions for which the aggregate is the right level to report and the stratified figures the misleading ones? If the board's rule is wrong, what rule should the policy use to determine, for a given question, which level of aggregation answers it — and could a clause like the board's, applied mechanically, ever force us to report the worse answer?
reasoning: |-
  Okay, I need to tackle this Simpson's Paradox scenario for a hospital network's clinical governance committee. The user describes a situation where their aggregate 30-day mortality rate looks better than the regional average, but when broken down by admission severity, they perform worse at every level. The board thinks this is always a statistical artifact and wants a policy that stratified results should always override the aggregate figure. 

  Hmm, the user is essentially asking two things: first, is the board's general rule sound? Second, if not, what rule should determine which level of aggregation to report, and could blindly following the board's approach ever lead to reporting a worse answer?

  Let me start by recalling Simpson's Paradox. It occurs when a trend appears in different groups but disappears or reverses when groups are combined. The classic example is kidney stone treatments where Treatment A has better success rates for both small and large stones but worse overall because it handles more severe cases. 

  So why does this happen? Usually because of confounding variables. In this case, severity acts as a confounder. If the hospital network sees a different case mix—maybe they treat more low-severity cases where mortality is naturally lower—that could make their aggregate look better even if they're actually worse at every level. 

  But the board's conclusion that disaggregation always reveals the "truth" is too simplistic. Sometimes the aggregate is actually what you care about. For example, if you're a patient choosing a hospital network overall, the aggregate might better reflect your expected outcome since it accounts for case mix. But if you're a clinician trying to improve care processes, the stratified data is crucial to identify where weaknesses lie. 

  I should also consider scenarios where the aggregate might be more appropriate. Imagine they're reporting on something like patient satisfaction with food services. If food quality is consistent across wards, aggregating might give a clearer picture than stratifying by department, which could just add noise. 

  The user's deeper concern seems to be about making policy that avoids misleading reporting. They’re worried that a rigid rule could backfire—like if stratification creates false impressions due to small sample sizes or arbitrary groupings. For instance, if they stratify mortality by very narrow age bands, random fluctuations could make performance look uneven when it’s not. 

  So what’s the alternative? The policy should focus on the question being asked. If the question is about overall institutional performance (especially for resource allocation or public reporting), aggregate might be better. If it’s about clinical quality improvement, stratification by relevant factors (severity, procedure type) is key. 

  They also need safeguards: sufficient sample sizes in strata, avoiding over-stratification, and using risk-adjusted metrics. And yes, mechanically applying the board’s rule could force reporting a misleading "worse answer"—like prioritizing noisy stratified data over a stable aggregate when case mix is the real story. 

  The user’s role on the committee suggests they need a nuanced, defensible policy—not just "always stratify." They’re clearly thinking ahead about unintended consequences, which is smart. I should emphasize framing the policy around decision context rather than a blanket rule.
answer: |-
  The board's proposed rule—that stratified results *always* override the aggregate figure—is **not sound as a universal policy**. While disaggregation often reveals crucial insights (as in your mortality paradox), there are scenarios where the aggregate is the *more* meaningful metric, and mechanical application of this rule could force misleading reporting. Here's a breakdown:

  ### When the Aggregate is Meaningful (and Stratification Might Mislead)
  1.  **Questions about Overall Institutional Performance:**
      *   **"What is the average outcome for a patient admitted to our network?"** The aggregate mortality rate answers this directly. It reflects the *actual experience* of your population, accounting for your unique case mix. If your network admits a higher proportion of low-severity patients (where mortality is low), your *overall* lower mortality might accurately reflect a genuine advantage in patient selection, access, or overall system efficiency, even if care *within* each severity level needs improvement. Disregarding this aggregate could hide a real strength.
      *   **Resource Allocation & Public Reporting:** Policymakers or patients often care about the overall outcome expectation when choosing or funding a network. The aggregate provides this.

  2.  **Confounding by the Stratification Variable Itself:**
      *   If "admission severity" is influenced by *your hospital's practices* (e.g., coding practices, triage accuracy), stratifying by it might obscure the true institutional effect. The aggregate might better capture the net result of your system's processes.

  3.  **Small Sample Sizes in Strata:**
      *   Disaggregating can create strata with very few patients, leading to statistically unstable rates with high variance. Reporting these noisy stratified figures as the "truth" can be highly misleading, while the aggregate provides a more reliable estimate.

  4.  **Inappropriate or Arbitrary Stratification:**
      *   Stratifying by irrelevant factors (e.g., day of the week, non-clinical administrative groupings) can create spurious patterns due to random variation. The aggregate would be more reliable.

  ### When Stratification is Essential (and the Aggregate is Misleading)
  1.  **Questions about Clinical Quality & Process Improvement:**
      *   **"Is our care effective *for specific patient types*?"** Your paradox clearly shows care within each severity tier needs improvement, masked by the favorable case mix in the aggregate. This is critical for targeted QI initiatives.
      *   **Identifying Disparities:** Stratification reveals inequities or variations in care delivery across subgroups (e.g., by severity, procedure type, demographics).

  2.  **Presence of a Strong Confounder (like Severity):**
      *   When an external factor (like illness severity) strongly influences the outcome *and* is unevenly distributed between groups (your network vs. region), the aggregate comparison is confounded. Stratification adjusts for this confounder, revealing the underlying association.

  ### A Better Policy Framework
  Instead of a rigid "stratified always wins" rule, the policy should mandate:

  > **"The level of reporting (aggregate vs. stratified) must align with the specific question being asked and the causal interpretation required. Aggregate metrics are generally appropriate for assessing overall institutional performance and patient experience, considering case mix. Stratified metrics are essential for evaluating clinical quality within specific patient subgroups, identifying disparities, and adjusting for known strong confounders (e.g., admission severity). When both are presented, the context and interpretation must clearly explain the potential role of case mix or confounding."**

  **Crucially, the policy should require:**

  1.  **Contextual Reporting:** *Always* report both aggregate and relevant stratifications (especially severity) side-by-side with clear explanations.
  2.  **Risk Adjustment (Where Feasible):** Use statistically validated risk-adjustment models for outcomes like mortality. This *combines* the need for a single summary measure with adjustment for case mix severity, providing a fairer comparison than raw aggregates *or* simple stratification. This should be the long-term goal.
  3.  **Assessment of Case Mix:** Include analysis showing the distribution of cases across severity levels in your network vs. the region. This explains *why* the paradox occurs.
  4.  **Statistical Stability:** Set minimum sample size thresholds for reporting stratified rates to avoid misleading noise.
  5.  **Focus on the Question:** Explicitly state the question each metric answers:
      *   Aggregate: "What is the average outcome for a patient entering our system?"
      *   Stratified (Severity): "How does our care compare for patients of *similar* initial severity?"

  ### Could the Board's Rule Force Reporting the Worse Answer?
  **Yes, absolutely.** Here's how:

  1.  **Ignoring a Real Aggregate Advantage:** Suppose your network genuinely attracts/selects more low-risk patients *due to positive factors* (better preventive care in catchment area, efficient triage sending complex cases elsewhere appropriately). Your aggregate mortality is truly lower. Forcing reporting *only* the stratified rates (which show worse care within levels) ignores this systemic strength and presents an overly negative picture of the *overall patient experience*.
  2.  **Magnifying Noise:** Reporting an unstable, high-variance stratified rate from a tiny subgroup (e.g., mortality for a rare procedure/severity level) as the "definitive" answer, while ignoring a stable, reliable aggregate rate, is statistically irresponsible and could mislead about performance in that very subgroup.
  3.  **Misattribution:** If the stratification variable itself (e.g., severity coding) is problematic within your system, focusing solely on stratified results might misdirect improvement efforts away from the root cause (data quality) towards clinical processes that are actually adequate.

  **In Conclusion:**

  The board is right that the paradox reveals critical information about clinical quality within severity levels that *must* be acted upon. However, declaring stratified results as *always* overriding the aggregate is an oversimplification. **The aggregate is not necessarily an "illusion"; it often answers a different, equally valid question about overall system performance and patient flow.** A good policy mandates reporting both levels, requires contextual interpretation (especially case mix analysis), promotes risk-adjusted metrics, and dictates that the choice of metric depends on the specific question being addressed. A mechanical "stratified always wins" rule risks misrepresenting performance in either direction.
