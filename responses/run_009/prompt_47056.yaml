answer: |-
  Here's a practical ethical decision procedure distilled from core autonomy debates (Thaler/Sunstein, Rebonato, Hausman, Bovens), designed for HR teams. It prioritizes **respect for agency over mere welfare gains**, ignores "efficiency" arguments, and flags where values-based negotiation is unavoidable.

  ---

  ### **The Autonomy Impact Assessment (AIA) Procedure**
  **Run these questions sequentially. Stop if any answer fails. Document responses.**

  1. **MECHANISM TEST: Does this change work primarily by *supporting* rational deliberation?**  
     - *Pass:* Makes information clearer, reduces friction for desired actions (e.g., simplifying forms).  
     - *Fail:* Exploits cognitive biases (inertia, scarcity, salience) as the *primary* driver.  
     - *Stop if fail:* Banned without appeal (e.g., hiding dessert uses salience/inertia without aiding choice).  
     - *Gaming risk:* Claiming "it supports deliberation" while actually relying on bias. Demand evidence of deliberation support (e.g., user testing).

  2. **TRANSPARENCY TEST: Is the intervention and its intent obvious to affected employees?**  
     - *Pass:* Employees can easily discover how the choice is structured and why (e.g., "Default pension: 6%. Why? Most people under-save." in bold).  
     - *Fail:* Opaque design (e.g., hidden defaults, no explanation).  
     - *Stop if fail:* Mandate redesign for transparency before proceeding.  
     - *Gaming risk:* Burying disclosures in fine print. Require disclosure in primary decision context.

  3. **VOLITION TEST: Is opting out *truly* costless (cognitive/time/social)?**  
     - *Pass:* Opt-out is 1-click, penalty-free, equally accessible (e.g., pension opt-out in onboarding portal).  
     - *Fail:* Opt-out requires forms, delays, stigma, or is obscured (e.g., charity opt-out checkbox tiny/unlabeled).  
     - *Stop if fail:* Intervention prohibited unless opt-out friction is eliminated.  
     - *Gaming risk:* Calling a 5-step process "easy." Test with employees; >90% should complete opt-out in <30 secs.

  4. **DEFAULT STRESS TEST (If a default is involved): Could this default reasonably be *every employee’s* actual preference?**  
     - *Pass:* Evidence that >50% of similar employees would choose this *if fully informed* (e.g., pension savings data showing widespread under-saving).  
     - *Fail:* Default reflects employer/HR preference without evidence of employee alignment (e.g., charity donation).  
     - *Values call if inconclusive:* Requires works council/employee rep consultation.  
     - *Gaming risk:* Using selective data. Demand independent benchmarks (e.g., industry studies).

  5. **NEUTRALITY TEST: Does this avoid steering toward employer-beneficial outcomes?**  
     - *Pass:* Benefits employees regardless of employer gain (e.g., healthier staff via salad nudge may boost productivity, but health is employee-good).  
     - *Fail:* Primarily benefits employer under guise of employee welfare (e.g., default charity donation boosts PR).  
     - *Values call if contested:* Works council must approve employer-beneficial nudges.  

  ---

  ### **Applied to Your Cases**
  **Case 1: Default Pension at 6% (Opt-Out Available)**  
  - *Mechanism:* **Fail?** Exploits inertia. But passes if paired with education. *Remediate:* Add mandatory "Why 6%?" interactive calculator.  
  - *Transparency:* **Pass** if default is explicitly labeled with rationale.  
  - *Volition:* **Pass** if opt-out is 1-click during onboarding.  
  - *Default Stress Test:* **Pass** if data shows most under-40s save <6% for retirement.  
  - *Neutrality:* **Pass** (employee financial security).  
  **Verdict:** **Approved** with transparency/education add-ons.  
  *Your discomfort likely stems from exploiting inertia—but the AIA tolerates this if other safeguards hold.*

  **Case 2: Salad at Eye Level, Dessert in Back**  
  - *Mechanism:* **Fail.** Relies on salience/inertia, not deliberation support.  
  - *Transparency:* **Pass?** Employees can see the layout.  
  - *Volition:* **Pass.** Getting dessert isn’t restricted.  
  - *Default Stress Test:* N/A (not a default).  
  - *Neutrality:* **Pass** (health benefits employees).  
  **Verdict:** **Rejected at Step 1.** *This is the one you might want but AIA blocks—it exploits bias without aiding reasoning.*

  **Case 3: Default 1% Charity Donation (Opt-Out on Day 1)**  
  - *Mechanism:* **Fail.** Pure inertia exploitation.  
  - *Transparency:* **Likely fail.** "Default donation" may be buried in onboarding docs.  
  - *Volition:* **Likely fail.** Day-1 opt-out pressures new hires to comply; social cost high.  
  - *Default Stress Test:* **Fail.** No evidence most employees prefer this donation.  
  - *Neutrality:* **Fail.** Primarily benefits company reputation.  
  **Verdict:** **Rejected at Step 1 or 3.** *This is likely the one AIA blocks that you might ethically oppose.*

  ---

  ### **Where You’ll Disagree with the AIA**
  - **Salad Nudge (Blocked):** You might argue it’s "harmless," but AIA is strict on *mechanism*. To pass, add deliberation support (e.g., nutrition info at point of choice).  
  - **Pension Default (Approved):** Your unease highlights a core philosophical rift: AIA (like Thaler) permits *transparent, escapable* bias-exploitation for welfare. Critics (e.g., Rebonato) would reject all such defaults as manipulative.  

  ### **Where AIA Gets Gamed or Misfires**  
  - **Gaming:** HR might claim "employees prefer it" without evidence (Step 4). Mitigation: Require third-party validation of preferences.  
  - **Misfires:** Some beneficial nudges fail Step 1 (e.g., simplifying forms reduces friction but doesn’t "support deliberation"). Solution: Allow exceptions if *all other tests pass overwhelmingly*.  
  - **Values Calls:** Neutrality (Step 5) is inherently political. Works council arbitration is non-negotiable here.

  **Final Note:** The AIA prioritizes autonomy over outcomes. If your team values welfare gains more (e.g., "employees *need* to save/eat better"), acknowledge that—it’s a values conflict the procedure exposes, not resolves. Run contested cases through works councils; their legitimacy outweighs philosophical purity.
