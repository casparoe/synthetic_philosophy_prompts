prompt: |-
  I run a team of content reviewers at a mid-sized social platform, and a growing share of our queue is reports filed against conspiracy content. Our current internal guidance is a list of banned topics, which fails constantly: it catches old, well-documented claims as "conspiracies" and misses novel ones, and it gives us nothing to say on appeal except that the topic is on the list. I want to replace it with something principled — a decision procedure grounded in what philosophers of science and epistemologists have actually worked out about when conspiracy claims are warranted and when they are not — but usable by reviewers who have two minutes per item, no subject-matter expertise, and whose removal decisions can be appealed and end up in my lap.

  The philosophical ideas I'd want the procedure to operationalize, roughly: the thought that a conspiracy claim is epistemically suspect not because conspiracies never happen (they obviously do — companies bury trial data, governments run covert programs) but because of structural features like the mismatch between the size of the posited conspiracy and what it explains, the implausibility of large secrets holding over time, the tendency of the claim to absorb counterevidence by positing further conspirators, and the shift from specific falsifiable allegations to a general posture of distrust. But I am not the expert; use whatever is actually load-bearing in the literature.

  Please write the procedure itself: the questions to ask in order, what counts as a sufficient answer at each step, where the procedure terminates in a remove, label, or leave-alone, and where it must stop and hand off to a human because the question is one of values or context rather than epistemic structure. It should distinguish, explicitly, between the content of a claim (which can be warranted) and the reasoning pattern around it (which can be conspiracist even when the claim happens to be true), since our policy treats those differently. It should also be honest about which steps are judgment calls dressed up as procedure, and about the characteristic ways it will misfire.

  Then run it on three cases from our actual queue, lightly disguised:

  First, a post alleging that a pharmaceutical company suppressed adverse-event data on a specific drug, citing the company's prior regulatory fines, with some figures that look plausibly sourced and some that look invented. This is the hard one: the pattern matches both the worst conspiracist material we see and the documented history of this industry, and I suspect the procedure will have to output something other than remove, which I'll need to defend to my management.

  Second, a video claiming that a recent building collapse in a nearby country was orchestrated rather than accidental, produced within hours of the event, which argues from the fact that officials initially said little and asks why they would withhold information if they had nothing to hide.

  Third, a post asserting that a well-known historical assassination involved a second shooter, argued carefully, citing decades-old witness statements, and conceding points that count against it.

  For each, show the procedure's path step by step, and flag where two reviewers following it in good faith could still diverge. Finally, tell me what the procedure cannot do — the kinds of reports it should not be run on at all, and what I should say in an appeal when the honest answer is that our rules are about a platform's values and not about truth.
reasoning: |-
  We are designing a decision procedure for content reviewers to evaluate conspiracy-related content. The procedure is grounded in philosophical principles about when conspiracy claims are epistemically warranted. Key ideas from the literature include:
   - Conspiracy claims are not inherently false; some conspiracies do occur (e.g., corporate cover-ups, government covert operations).
   - However, they become epistemically suspect due to structural features:
     a. The mismatch between the scale of the conspiracy (number of people involved, time span) and the event it explains.
     b. The implausibility of large secrets being kept for long periods (due to the possibility of leaks, defections, etc.).
     c. The tendency to absorb counterevidence by expanding the conspiracy (e.g., "They are in on it too").
     d. A shift from specific, falsifiable claims to a general posture of distrust that is immune to evidence.

   The procedure must:
   - Be usable by non-experts in about 2 minutes per item.
   - Differentiate between the content (which might be true) and the reasoning pattern (which might be conspiracist even if the claim is true).
   - Output: remove, label (with a warning about unverified claims or conspiracist reasoning), or leave alone.
   - Explicitly note where judgments are required and where the procedure might misfire.

   The procedure should also indicate when to hand off to a human (e.g., when the issue is about platform values or context that the reviewer cannot assess).

   Steps:

   We'll break down the evaluation into a sequence of questions. The goal is to identify whether the content is promoting a conspiracy theory in an epistemically problematic way, regardless of the truth of the claim.

   Step 1: Is the claim about a conspiracy?
     - Definition: A conspiracy is a secret plan by a group to do something unlawful or harmful.
     - If no, then leave alone (unless it violates other policies). End.
     - If yes, proceed.

   Step 2: Check for immediate red flags (that warrant removal regardless of the rest of the procedure):
     - Does the content incite violence or hatred against individuals or groups? (Follow your platform's existing policies on hate speech and incitement.)
     - Does it contain clear and immediate threats? 
     - If yes, remove. End.
     - Otherwise, proceed.

   Step 3: Evaluate the reasoning pattern (epistemic structure) of the conspiracy claim. We are looking for features that make the claim epistemically suspect.

     a. **Scale Mismatch**: 
          - Question: Is the conspiracy being alleged of a scale (in terms of number of people involved, time span, resources required) that is disproportionate to the event it explains?
          - Example: A single building collapse explained by a global cabal of elites would be disproportionate.
          - Judgment: If the scale is clearly disproportionate (e.g., requiring hundreds of co-conspirators for a minor event, or a decades-long cover-up for a trivial matter), then flag as conspiracist reasoning.
          - How to judge: Consider whether the event could be explained by known, smaller-scale conspiracies (like a company hiding data) or by non-conspiratorial causes (like negligence). If the scale is plausible (e.g., a few executives hiding data), then this step does not flag.

     b. **Secrecy Implausibility**:
          - Question: Given the alleged number of conspirators and the time that has passed, is it plausible that the secret has been maintained without significant leaks?
          - Consider: The more people involved and the longer the time, the less plausible.
          - Judgment: If the claim requires a large number of people to keep a secret for a long time without any credible leaks, then flag as conspiracist reasoning.

     c. **Counterevidence Absorption**:
          - Question: Does the claim respond to counterevidence by expanding the conspiracy (e.g., by claiming that those presenting counterevidence are part of the conspiracy) or by making the conspiracy more complex?
          - Example: "The official report says it was an accident, but that's because the investigators were bribed."
          - Judgment: If yes, then flag as conspiracist reasoning.

     d. **Unfalsifiability and Distrust Posture**:
          - Question: Is the claim presented in a way that is unfalsifiable (i.e., no evidence could disprove it) and/or does it promote a general distrust without specific, testable allegations?
          - Example: Shifting from specific claims about an event to a general claim that "they" are always lying.
          - Judgment: If yes, then flag as conspiracist reasoning.

   Step 4: Count the flags from Step 3 (a to d). 
     - If 2 or more flags are present, then the reasoning pattern is highly suspect -> proceed to Step 5 for labeling or removal based on harm potential.
     - If 1 flag is present, then the reasoning pattern is somewhat suspect -> proceed to Step 5.
     - If 0 flags, then the reasoning pattern is not obviously conspiracist -> proceed to Step 6 (to check the claim's plausibility and whether it is presented with evidence).

   Step 5: For content with at least one flag (i.e., some conspiracist reasoning), we now consider the potential for harm (which might require removal) or whether labeling is sufficient.
     - Consider: 
          - The topic: Is it about a current event where misinformation could cause immediate harm (e.g., public health, elections, ongoing conflict)? 
          - The specificity: Does it target individuals or groups in a way that could lead to harassment?
          - The evidence: Even with a problematic reasoning pattern, does the content provide verifiable evidence that could be checked? (But note: in Step 3 we are already concerned about the reasoning, so the evidence might be weak or misrepresented.)
     - Judgment: 
          - If the content is likely to cause significant real-world harm (e.g., inciting violence, undermining public health efforts in a pandemic) or targets individuals/groups for harassment, then remove.
          - Otherwise, label (e.g., "This post makes claims that are not verified and may be based on conspiracy theories. Be critical of unverified information.") and leave up.

   Step 6: For content with no flags in Step 3 (i.e., the reasoning pattern is not obviously conspiracist), we now check the claim's plausibility and evidence.
     - Question: Does the claim present verifiable evidence (e.g., documents, credible witness accounts, data) and/or is the claim about a type of event that is known to occur (e.g., corporate cover-ups, government covert actions that have been documented in the past)?
     - Judgment:
          - If the claim is presented with verifiable evidence (or references to such) and the event is within the realm of known conspiracies (e.g., a pharmaceutical company hiding data), then leave alone (even if the specific claim might be false, because the reasoning is not problematic and the topic is one of public interest).
          - If the claim is presented without evidence and the event is highly implausible (e.g., an event that would require an unprecedented conspiracy), then label (as unverified) and leave up? Or if the claim is about a current event and could cause harm, then consider labeling. But note: without the reasoning flags, we are not in the territory of conspiracist reasoning, so removal is not justified by this policy. However, if the claim is about a current event and is entirely without evidence and could cause panic or harm, then we might remove under a separate policy (like misinformation causing imminent harm). This step is tricky.

     However, note: our policy is to treat the reasoning pattern and the content differently. Step 6 is about the content. But if the reasoning pattern is not flagged, then the content might be a legitimate investigation. We should be cautious about removing such content.

     Therefore, in Step 6:
          - If the claim is about a current event and is without evidence and the potential for harm is high (e.g., could cause panic, violence, or interfere with emergency response), then remove under a separate policy (like our policy on harmful misinformation). Note: This is a judgment call and may require handoff to a senior reviewer or supervisor.
          - Otherwise, leave alone (because the reasoning is not conspiracist and the claim is presented in a reasonable manner) or label if the evidence is weak (but without the reasoning flags, labeling might be overkill). We might decide to leave alone.

   Step 7: Handoff cases.
     - If at any step the reviewer is unsure about the scale, secrecy, or counterevidence absorption (Step 3) because they lack context, or if the harm assessment (Step 5) is unclear, then hand off to a senior reviewer or a subject-matter expert (if available) or escalate.
     - Also, if the content is on the edge of platform values (e.g., a claim that is not conspiracist in reasoning but is about a topic the platform has chosen to ban for non-epistemic reasons, such as a particular historical event that is highly sensitive in a region), then hand off to a policy team.

   Step 8: Appeals and values.
     - In an appeal, if the decision was based on the reasoning pattern (Step 3 flags) and harm (Step 5), then explain that the content was removed (or labeled) because it promotes a conspiracy theory by using reasoning that is not based on evidence and is structurally problematic (explain the specific flags).
     - If the decision was based on platform values (e.g., we remove all content about a particular topic regardless of reasoning because it is against our values or local law), then be honest: "Our decision was based on our platform's policies regarding [topic], which we have chosen to remove because [reason related to values, safety, or legal compliance]."

   Now, note the judgment calls and misfires:
     - Judgment calls: Steps 3a, 3b, 3c, 3d, 5, and 6 all require judgment. Two reviewers might differ on whether the scale is mismatched or the secrecy is implausible. Also, harm potential is highly contextual.
     - Misfires: 
          - The procedure might wrongly flag a legitimate investigation as conspiracist (if the scale seems large but is actually plausible, e.g., a large corporation with a tight-knit executive team hiding data).
          - It might miss a conspiracist post that does not exhibit the structural features we are checking (e.g., a novel conspiracy that hasn't been seen before and doesn't obviously have these features).
          - It might leave up harmful content that doesn't trigger the flags (e.g., a true conspiracy claim that is presented without conspiracist reasoning but could still cause harm, like revealing state secrets).

   Now, let's run the three cases.

   Case 1: A post alleging that a pharmaceutical company suppressed adverse-event data on a specific drug, citing the company's prior regulatory fines, with some figures that look plausibly sourced and some that look invented.

   Step 1: Yes, it is about a conspiracy (a secret plan by the company to hide data).
   Step 2: No immediate red flags (assuming no incitement).
   Step 3: Check the reasoning pattern:
     a. Scale: The conspiracy is within one company (a known type of event). The scale is plausible (it doesn't require hundreds of people; a few executives could do it). -> No flag.
     b. Secrecy: The time span might be a few years, and the number of people involved might be limited. Also, the post notes prior regulatory fines (which might indicate that the secrecy was not maintained). -> Plausible, no flag.
     c. Counterevidence: The post does not seem to expand the conspiracy in response to counterevidence (it is making a direct allegation). -> No flag.
     d. Unfalsifiability: The claim is specific and falsifiable (it is about a specific drug and specific data). -> No flag.

   Step 3 result: 0 flags -> Go to Step 6.

   Step 6: The claim is about a type of event that is known (corporate cover-ups). The post provides some sources (prior regulatory fines) and some figures (some look sourced, some look invented). 
     - Judgment: The claim is presented with some evidence (even if mixed). The topic is of public interest. Without the reasoning flags, we leave alone. However, note that the post has some figures that look invented. This might be a sign of false information. But our procedure is about conspiracist reasoning, not the truth of the claim. We don't have a step to fact-check because reviewers don't have time. So we leave alone? 
     - But wait: our procedure is about the reasoning pattern. Since the reasoning pattern is not flagged, we leave alone. However, if the post contains demonstrably false figures (and if we had a fact-checking step) we might label or remove for false information. But that is outside the scope of this procedure.

     Therefore: leave alone.

     However, note: the post has some figures that look invented. If the reviewer can quickly verify (e.g., by checking if the sources are real) that some figures are false, then we might remove for false information. But that is not part of this conspiracy-specific procedure. We assume that the platform has a separate policy for verifiably false claims. Since the reviewer has only 2 minutes, they might not be able to verify. In that case, we rely on the reasoning pattern.

   Case 2: A video claiming that a recent building collapse was orchestrated, produced within hours of the event, arguing from the fact that officials initially said little.

   Step 1: Yes, it is about a conspiracy (orchestrated by someone).
   Step 2: No immediate red flags (assuming no incitement).
   Step 3:
     a. Scale: The event is a building collapse. The conspiracy would require at least the ability to orchestrate a building collapse (which is a significant event) and then have officials stay silent. The scale might be mismatched: a building collapse might be due to an accident (which is common) and the silence of officials might be due to caution (common in the immediate aftermath). But the video is alleging a conspiracy without evidence. -> The scale might be mismatched because the event could be explained by non-conspiratorial causes. Flag? (Judgment call: yes, because the conspiracy is being alleged without evidence and the event is more simply explained by accident and bureaucratic caution.)
     b. Secrecy: The conspiracy would have to be kept secret by the perpetrators and the officials. If the video is produced within hours, it's too early to expect a full investigation. The secrecy at this stage is not implausible because the event just happened. -> No flag? (But note: the claim is that the officials are part of the cover-up, which requires them to be conspirators. The number of officials might be large. However, in the immediate aftermath, we don't know. This is a judgment call. We might say no flag because it's too early to tell.)
     c. Counterevidence: The video uses the silence of officials as evidence of the conspiracy. This is a common conspiracist move: interpreting the absence of information as evidence of a cover-up. This is a form of counterevidence absorption: if officials had spoken, they might have been dismissed as lying; their silence is also taken as evidence. -> Flag.
     d. Unfalsifiability: The video is making a specific claim (orchestrated collapse) but the evidence is very weak (silence). The claim is not yet unfalsifiable because an official report might come out. But the reasoning pattern is to take the absence of information as proof. -> This is borderline. We might flag under (d) because it is promoting a distrust posture without evidence.

     Let's count: 
          - (a): Flag (mismatch) 
          - (b): No flag (too early to judge secrecy) 
          - (c): Flag (counterevidence absorption: silence as evidence) 
          - (d): Maybe flag? Let's say we do, because it is using a general distrust of officials without specific evidence.

     So 2 or 3 flags? We'll say 2 (a and c) and possibly d. At least 2 -> go to Step 5.

   Step 5: Harm assessment.
     - The topic is a recent building collapse. False claims about orchestration could lead to:
          - Mistrust in authorities during a rescue operation.
          - Potential for violence against individuals or groups blamed.
          - Unrest in the community.
     - Given the immediacy and potential to cause harm, we might remove. Alternatively, if the harm is not imminent, we might label.

     Judgment: Because the event is very recent and the video is spreading quickly without evidence, and because it could incite violence or interfere with rescue efforts, we remove.

     Alternatively, if the building collapse is in a stable country and there is no immediate risk of violence, we might label. But given the potential for harm, removal is defensible.

     We'll say: remove.

   Case 3: A post asserting that a well-known historical assassination involved a second shooter, argued carefully, citing decades-old witness statements, and conceding points that count against it.

   Step 1: Yes, conspiracy (since a second shooter implies a conspiracy to kill).
   Step 2: No immediate red flags.
   Step 3:
     a. Scale: The event is an assassination. Conspiracies to assassinate public figures are known to occur (e.g., the assassination of JFK is widely debated). The scale (a second shooter) does not necessarily require a massive conspiracy. The scale might be plausible. -> No flag.
     b. Secrecy: The event happened decades ago. The claim is that there was a second shooter and that this was covered up. The cover-up would have to involve multiple people (investigators, witnesses, etc.) over a long time. This is somewhat implausible? But note: the post cites witness statements that were previously ignored. So maybe the secret didn't hold? This is a judgment call. We might say: the secrecy is implausible for a large cover-up, but the post is arguing that there were leaks (the witness statements). So no flag? (Because the post is addressing the secrecy issue by pointing to evidence that the cover-up was not complete.)
     c. Counterevidence: The post concedes points that count against it. This is the opposite of absorbing counterevidence; it is acknowledging counterevidence. -> No flag.
     d. Unfalsifiability: The claim is specific and falsifiable (it is about the presence of a second shooter and cites evidence). It does not promote a general distrust without evidence. -> No flag.

     Step 3 result: 0 flags -> Step 6.

   Step 6: The claim is about a historical event. The post cites evidence (witness statements) and acknowledges counterarguments. The reasoning is careful. 
     - This is a legitimate historical debate. Leave alone.

     Note: Even if the platform has a policy against certain historical claims (e.g., Holocaust denial), this claim is not in that category. It's a specific debate about an assassination.

     Therefore: leave alone.

   Now, what the procedure cannot do:
     - It cannot determine the truth of the claim. It only evaluates the reasoning pattern.
     - It might not catch novel conspiracist reasoning that doesn't fit the four features we check.
     - It relies on the reviewer's judgment, which can be variable.
     - It does not replace fact-checking. If the platform has the resources, fact-checking should be a separate process.
     - It should not be run on content that is clearly satire or fiction (unless it is presented as real and might be misconstrued).
     - It should not be run on content that is not about conspiracy (as defined in Step 1) to avoid false positives.

   In an appeal when the decision is about values and not truth:
     - "Our platform has policies that prohibit certain topics not because we claim to know the truth or falsehood of the content, but because we have determined that such content, regardless of its truth, is harmful to our community or violates our values. In this case, the decision to remove was based on [specific policy, e.g., our policy against content that promotes hate or harassment, or our policy on sensitive events]."

   Final note: The procedure is a tool to help standardize decisions, but it is not infallible. Training and calibration among reviewers are essential.
answer: |-
  ### Principled Decision Procedure for Conspiracy Content Review  
  **Grounding in Epistemology**: This procedure operationalizes key insights from philosophers (e.g., Keeley, Pigliucci) on structural epistemic flaws in conspiracy theories:  
  1. **Scale Mismatch**: Does the conspiracy’s scale (people, resources, time) vastly exceed what’s needed to explain the event?  
  2. **Secrecy Implausibility**: Is long-term secrecy implausible given human fallibility?  
  3. **Counterevidence Absorption**: Does the theory expand to dismiss counterevidence?  
  4. **Unfalsifiable Distrust**: Does it shift from testable claims to generalized distrust?  

  **Procedure Rules**:  
  - **Terminology**:  
    - **Remove**: Violates platform policies (harmful reasoning or values).  
    - **Label**: Add a warning (e.g., "Unverified claim; scrutinize sources").  
    - **Leave Alone**: No policy violation.  
  - **Time Limit**: 2 minutes/report. Skip complex steps; default to "handoff."  
  - **Judgment Calls**: Explicitly flagged (⭐).  
  - **Handoff Triggers**: Context-dependent values (e.g., geopolitical sensitivity) or ambiguity.  

  ---

  ### Decision Procedure: 7 Sequential Questions  
  1. **Is it a conspiracy claim?**  
     - *Definition*: Alleges secret, coordinated harm by powerful actors.  
     - *No* → Leave Alone.  
     - *Yes* → Proceed.  

  2. **Does it violate immediate safety policies?**  
     - *Examples*: Incites violence, harassment, or self-harm.  
     - *Yes* → Remove.  
     - *No* → Proceed.  

  3. **⭐ Scale Mismatch: Is the conspiracy implausibly large for the event?**  
     - *Test*: Compare alleged conspirators/resources to the outcome.  
       - *Mismatch* (e.g., 1,000 actors to hide minor data) → Flag A.  
       - *Plausible* (e.g., 5 executives hiding drug data) → No flag.  
     - *Handoff*: If industry context needed (e.g., pharma norms).  

  4. **⭐ Secrecy Implausibility: Is long-term secrecy unlikely?**  
     - *Test*: Duration × number of conspirators > historical precedents.  
       - *Implausible* (e.g., 50+ people hiding evidence for decades) → Flag B.  
       - *Plausible* (e.g., short-term cover-up by small group) → No flag.  

  5. **Counterevidence Absorption: Does it "explain away" contradictions?**  
     - *Test*: Expands conspiracy to dismiss counterevidence (e.g., "The media is paid off!").  
       - *Yes* → Flag C.  
       - *No* → Proceed.  

  6. **Unfalsifiable Distrust: Is it immune to disproof?**  
     - *Test*: Replaces specific claims with vague distrust (e.g., "They always lie!").  
       - *Yes* → Flag D.  
       - *No* → Proceed.  

  7. **Decision Matrix**:  
     - **Flags A/B/C/D ≥ 2** → **Label** (epistemic flaws).  
     - **Flag(s) + Harm Risk** (e.g., public health crisis) → **Remove**.  
     - **0–1 Flags** → **Leave Alone** (reasoning not structurally flawed).  
     - **Unresolved Context/Values** → **Handoff** to senior reviewer.  

  ---

  ### Case Applications  
  **Case 1: Pharma Company Suppressing Drug Data**  
  - **Step 1**: Yes (conspiracy claim).  
  - **Step 2**: No violence → Proceed.  
  - **Step 3**: ⭐ *Scale*: Plausible (prior fines suggest capacity; small group suffices). → No flag.  
  - **Step 4**: ⭐ *Secrecy*: Plausible (short-term corporate cover-ups occur). → No flag.  
  - **Step 5**: *Absorption*: No expansion to dismiss counterevidence. → No flag.  
  - **Step 6**: *Distrust*: Specific allegation (not generalized). → No flag.  
  - **Step 7**: **0 flags** → **Leave Alone**.  
    - *Why*: Structural reasoning is sound despite mixed evidence.  
    - ⭐ **Judgment Call**: Reviewer must note plausibility of corporate misconduct.  
    - **Appeal Defense**: "We distinguish between claims with valid reasoning patterns and those relying on conspiracist logic. This passed structural scrutiny."  

  **Case 2: Building Collapse "Orchestrated" Hours After Event**  
  - **Step 1**: Yes (conspiracy claim).  
  - **Step 2**: No violence → Proceed.  
  - **Step 3**: ⭐ *Scale*: Mismatch (alleges complex plot for event explainable by accident; officials’ silence ≠ guilt). → Flag A.  
  - **Step 4**: ⭐ *Secrecy*: Implausible (assumes instant coordination among many actors). → Flag B.  
  - **Step 5**: *Absorption*: Uses silence as "proof" of guilt (ignores innocent explanations). → Flag C.  
  - **Step 6**: *Distrust*: Implies officials’ opacity = guilt (unfalsifiable). → Flag D.  
  - **Step 7**: **Flags A,B,C,D (4 flags)** + **Harm Risk** (panic in crisis) → **Remove**.  
    - ⭐ **Divergence Risk**: Reviewer may disagree on harm risk (low if low engagement).  

  **Case 3: Historical Assassination "Second Shooter"**  
  - **Step 1**: Yes (conspiracy claim).  
  - **Step 2**: No violence → Proceed.  
  - **Step 3**: ⭐ *Scale*: Plausible (assassinations often involve small groups). → No flag.  
  - **Step 4**: ⭐ *Secrecy*: Plausible (small group; historical precedent exists). → No flag.  
  - **Step 5**: *Absorption*: Concedes counterevidence → No flag.  
  - **Step 6**: *Distrust*: Specific/testable claim → No flag.  
  - **Step 7**: **0 flags** → **Leave Alone**.  
    - *Why*: Focuses on evidence, not structural flaws.  
    - ⭐ **Divergence Risk**: Reviewer may misjudge secrecy plausibility.  

  ---

  ### Limitations and Appeal Responses  
  **When Not to Use the Procedure**:  
  1. **Satire/Fiction**: Clear disclaimers (use humor policy).  
  2. **Established Facts**: E.g., Holocaust denial (use hate-speech policy).  
  3. **Non-Conspiracy Misinfo**: E.g., "5G causes COVID" (use health-misinfo policy).  
  4. **High-Context Values Calls**: E.g., region-specific sensitivities (handoff immediately).  

  **Appeal Responses for Values-Based Decisions**:  
  - *Template*:  
    > "This decision reflects our platform’s values regarding [specific harm, e.g., public safety or minimizing panic], not a judgment on the claim’s truth. Our rules prioritize preventing foreseeable harm from certain reasoning patterns, even if isolated facts are accurate."  
  - *Example*: Removing Case 2 due to crisis harm potential, not truth assessment.  

  **Misfire Warnings**:  
  - **False Negatives**: May miss novel conspiracist patterns.  
  - **False Positives**: May over-flag valid investigations (e.g., corporate whistleblowing).  
  - **Mitigation**: Regular reviewer training with sample cases.  

  ---  
  **Implementation Notes**:  
  - **Reviewer Script**: Use a checkbox tool for Steps 3–6; auto-generate decisions via matrix.  
  - **Training**: Emphasize that "Leave Alone ≠ Endorsement" (e.g., Case 1 may still be false).  
  - **Transparency**: Document flagged reasoning patterns in appeals (e.g., "Absorbed counterevidence via X").  
  This balances epistemic rigor with operational constraints while explicitly separating truth from reasoning structure.
