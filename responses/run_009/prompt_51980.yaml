prompt: |-
  I'm a third-year history student taking a module on memory and public commemoration, and I keep noticing a pattern in debates about how communities should relate to their past that I can't find a name for. In arguments over statues, anniversaries, and school curricula, people seem to have not one attitude to the past but several, and they switch between them depending on what the past is being used for at that moment. Sometimes the past is treated as a quarry of exemplary figures to emulate; sometimes as something to be preserved in full local detail, whatever it was; sometimes as a defendant to be arraigned and condemned. What strikes me is that the same participant in the same debate will move between these attitudes without acknowledging the shift: a hero invoked as a model turns out to be exempt from scrutiny, or a tradition defended as harmless local colour is suddenly deployed as a binding norm. Is there an established concept or literature for this tactical switching between modes of relating to the past — as distinct from simply disagreeing about what happened or how to evaluate it? If there is no established concept, could you coin one and define it, with attention to how it differs from ordinary selective use of evidence and to its boundary cases? I should say that I'm less interested in a label than in how exactly the phenomenon should be carved up. Please answer in British English.
reasoning: |-
  Okay, the user is a third-year history student studying memory and public commemoration. They've noticed a pattern in debates about how communities handle their past—like with statues, anniversaries, and school curricula. People seem to switch between different attitudes toward the past depending on the situation, without acknowledging the shift. For example, a historical figure might be treated as a hero to emulate in one moment, then exempt from criticism in another, or a tradition defended as harmless local color suddenly becomes a binding norm. The user wants to know if there's an established concept for this tactical switching or if I can coin one. They're more interested in understanding the phenomenon than just getting a label.

  First, I need to recall if there's existing literature on this. Hayden White's work on historical emplotment comes to mind, where history is framed in different narrative modes. Also, Pierre Nora's "sites of memory" deals with how societies construct memory, but it might not directly address the tactical switching. Then there's Paul Ricœur's work on memory and forgetting, which discusses selective memory. But the user is pointing out something more specific: the same person shifting modes within a debate without acknowledging it. So, existing terms like "presentism" or "instrumentalism" touch on using the past for present needs, but they don't capture the dynamic switching aspect.

  The user mentioned three attitudes: the past as a quarry of exemplary figures, as something to be preserved in full detail, and as a defendant to be condemned. These map onto commemorative, archival, and critical modes. The key issue is the unacknowledged switching between them strategically. This seems like a gap in the literature. Maybe I need to coin a new term. Let me think of possible names. "Commemorative instrumentalism" is close but might be too broad. "Modal shifting" is too vague. "Tactical historicity" could work, emphasizing the strategic aspect. Or "register switching," borrowing from linguistics. "Functional oscillation" might also fit, highlighting the back-and-forth nature. Among these, "commemorative ventriloquism" is vivid because it suggests using the past as a puppet to voice present agendas, which captures the unacknowledged switching.

  Now, to define it properly. Commemorative ventriloquism is the unacknowledged tactical switching between distinct modes of historical engagement within a single discourse to serve present-day objectives. It differs from selective use of evidence because it's about shifting the entire framework of engagement, not just cherry-picking facts. For example, defending a statue as heritage (archival mode) but then using it as a moral exemplar (commemorative mode) without addressing the contradiction. Boundary cases would be when someone admits the shift or when it's due to genuine ignorance rather than strategy.

  The user's deeper need might be to understand this phenomenon for their academic work, possibly to analyze debates more critically or to contribute to the literature. They might also want tools to dissect how public commemoration debates operate, revealing the strategies used by different sides. By providing a clear concept with examples and distinctions, I can help them frame their observations in their studies and potentially in their module assignments.
answer: |-
  What you're describing is a brilliantly observed phenomenon that cuts to the heart of memory studies and public history debates. While there isn't one universally agreed-upon *single* term that perfectly captures this specific **tactical switching between modes of engagement with the past within a single argument**, several established concepts touch upon it, and the phenomenon itself demands precise conceptualisation. Here's a breakdown:

  1.  **Related Concepts & Why They Don't Quite Fit:**
      *   **Presentism / Instrumentalism:** These describe *using* the past for present purposes, which is fundamental to commemoration. But they don't capture the *shifting between different types of use* or the *unacknowledged inconsistency* within one person's argument.
      *   **Selective Memory / Amnesia:** Focuses on what is remembered or forgotten. While crucial, this is about *content*, whereas your observation is about the *mode of engagement* or *framework* applied to that content. One can be selective within a single mode (e.g., only highlighting a hero's good deeds within a commemorative framework). The key issue is switching the framework itself.
      *   **Multidirectional Memory (Michael Rothberg):** Highlights how memories of different pasts (e.g., slavery, Holocaust, colonialism) interact and are used relationally. This is insightful for *content* interaction but doesn't address the tactical *modal switching* applied to a *single* past within a debate.
      *   **Historical Consciousness (Rüsen et al.):** Refers to how individuals/societies conceive of the relationship between past, present, and future. It encompasses different "types" (exemplary, critical, etc.), but doesn't specifically analyse the *opportunistic switching* between these types within a single discourse.
      *   **Emplotment (Hayden White):** How historical narratives are structured (tragedy, comedy, romance, satire). Switching emplotment *could* be part of it, but your focus is broader – encompassing not just narrative structure but the *purpose* and *stance* towards the past (emulation vs. preservation vs. condemnation).

  2.  **Conceptualising the Phenomenon: Coining a Term**
      Given the gap you've identified, coining a specific term is justified. Based on your description, I propose:

      **Commemorative Ventriloquism**

      **Definition:** Commemorative Ventriloquism is the unacknowledged, tactical switching between distinct **modes of historical engagement** within a single discourse or argument concerning public memory, driven by the immediate rhetorical needs of the present. It involves appropriating the past through different "voices" or frameworks (e.g., exemplary, archival, condemnatory) without acknowledging the shift in underlying principles, often leading to inconsistent or contradictory claims about the past's significance and how it should be treated.

      **Core Elements:**
      *   **Tactical:** The switching is strategic, responsive to the immediate point being made or countered.
      *   **Unacknowledged:** The participant does not recognise or admit the shift in their mode of engagement; the inconsistency is implicit.
      *   **Modal Switching:** Movement between fundamentally different ways of relating to the past (e.g., your examples: Quarry for Exemplars / Archival Preservation / Tribunal of Condemnation).
      *   **Present-Driven:** The switching serves present-day objectives (defending identity, attacking opponents, justifying policy, preserving power structures).
      *   **Occurs within a single discourse/agent:** The key is the *same* person or group deploying different modes *within* the same debate or argument.

      **Distinguishing it from Selective Use of Evidence:**
      *   **Selective Evidence:** Involves choosing *which facts* to highlight or suppress *within a single mode of engagement*. (e.g., *Within* the "Exemplary" mode, only mentioning Churchill's wartime leadership, ignoring colonial policies).
      *   **Commemorative Ventriloquism:** Involves switching the *entire framework* for engaging with the past *itself*. (e.g., Defending a statue *as* local heritage needing preservation (Archival Mode), then *suddenly* invoking the same figure *as* a timeless moral exemplar whose values must guide us today (Exemplary Mode), without reconciling why the figure is now subject to different rules of engagement). It's a meta-level shift in *how* the past is being used, not just *what* part is used.

      **Boundary Cases & Carving Up the Phenomenon:**
      *   **Clear Case:** A participant argues a controversial figure's statue should stay because it's "part of our town's story" (Archival/Preservationist Mode - past as detailed record to be kept). When challenged on the figure's harmful actions, they pivot to: "We must honour his founding spirit and courage!" (Exemplary Mode - past as source of models). They do not address why the preservation logic suddenly gives way to veneration logic when challenged on content.
      *   **Genuine Evolution/Complexity vs. Tactical Switch:** If someone says, "While we preserve the statue as historical evidence (Archival), we *also* need a plaque critically examining his role in X (Critical/Tribunal)," they *acknowledge* the different modes co-existing. This isn't ventriloquism; it's a more nuanced, multi-faceted approach. Ventriloquism is the *unacknowledged conflict or switch*.
      *   **Disagreement on Facts/Interpretation:** Debating *whether* an event happened, or *how* to interpret it *within one mode* (e.g., arguing whether a figure's actions were truly "courageous" *within* the Exemplary framework) is distinct. Ventriloquism involves changing the framework itself.
      *   **Different Speakers, Different Modes:** If one participant uses the Exemplary mode and another uses the Tribunal mode, that's straightforward disagreement or different priorities. Ventriloquism is defined by the *singular agent's modal instability*.
      *   **Hypocrisy vs. Ventriloquism:** Hypocrisy is a broader moral charge. Ventriloquism is a specific *mechanism* of inconsistency *in historical engagement*. It explains *how* the hypocrisy manifests in memory debates.

      **Why "Commemorative Ventriloquism"?**
      *   **Commemorative:** Locates it firmly in the realm of public memory, ritual, symbols, and contested heritage.
      *   **Ventriloquism:** Evokes the idea of "throwing one's voice" – the past is made to "speak" through different frameworks (exemplar, artifact, defendant) as suits the present speaker's need. The speaker doesn't acknowledge they are manipulating the "voice"; it appears as if the past itself demands different engagements at different moments. It captures the unacknowledged projection.

      **Relevance to Your Studies:**
      Identifying Commemorative Ventriloquism is a powerful analytical tool. It moves beyond simply noting *that* the past is used instrumentally, to reveal *how* that instrumentality operates dynamically and often deceptively *within* arguments. It highlights the fluidity and potential bad faith in how communities (or factions within them) manage difficult or contested heritage. When analysing debates over statues or curricula, you can now pinpoint moments where the *rules of the game* for engaging the past shift mid-argument to serve a rhetorical end, exposing underlying tensions and the strategies used to navigate them without confronting fundamental contradictions. This concept helps dissect the *mechanics* of memory conflicts in a way existing terms often don't capture with sufficient precision for the phenomenon you've astutely observed. It speaks directly to the core concerns of memory studies about the active, contested, and often politically charged construction of the past in the present.
