prompt: |-
  been reading lesswrong and the alignment forum since like 2013, longtime lurker, and somewhere along the way i picked up the habit of actually writing down credences for stuff in a spreadsheet (predictions, calibration training, the whole deal). and something's been bugging me that i want to turn into my term paper for a formal epistemology seminar, but the professor wants a real proposal, like 2 pages, before she signs off on the topic.

  here's the half-formed idea: everyone knows the standard fix for vague evidence is jeffrey conditionalization -- you don't learn E with certainty, you just shift your credence in E from say 0.3 to 0.7, and you redistribute over everything else via rigidity (the conditionals on E and ~E stay fixed). fine. but here's the thing i actually noticed in my spreadsheet: the ORDER of my soft updates matters. if i nudge credence in "the internal poll has the candidate ahead" up and THEN nudge "the leak about the poll is accurate" up, i end up somewhere different than if i do the two nudges in reverse order. with hard conditioning, order never matters, you can condition on a batch of evidence in any order and get the same posterior. but jeffrey updates on overlapping propositions apparently don't commute, unless rigidity holds between them in some special way that i only vaguely undertsand.

  so my actual question, which i think is real and not just me being bad at spreadsheets: is noncommutativity a bug or a feature? like, is the order-sensitivity tracking something real (two vague impressions can be evidence about each other, so receiving them in different orders genuinely puts you in different epistemic states), or is it a symptom that i'm double-counting, or that what i'm calling two separate "updates" is really one update that i've artificially chopped up? and is THAT the real reason some people prefer likelihood-ratio / virtual-conditioning style updates, since those commute in a way plain jeffrey updates don't?

  what i want from you: the proposal itself. state the question precisely enough that it has a determinate answer, explain why the standard treatment (apply jeffrey's rule, rigidity, done) leaves it open, say what i'd actually DO — my thought is small worked examples, maybe a two-proposition toy model where i can show exactly when order matters and when it washes out, plus a philosophical story about what the noncommutative cases have in common — lay out the possible conclusions and which considerations would decide between them, and give an honest assessment of what would count as the project failing or being too big for one semester. no citations needed, i already have the reading list, and please don't invent papers or quotes, she checks.

  fair warning: my professor is the type to ask "isn't this just a math homework problem wearing a philosophy costume," so the proposal better have a real answer to that baked in.
