  ### **Scoring Key and Interpretation**
  Tally your answers (A, B, or C for each question). Then, match your response pattern to the leaves below. Each leaf represents a theoretical position on implicature and speaker meaning. Positions are based on your argument’s fault lines:  
  - **Fault line 1:** Is implicature about speaker meaning (intention), hearer inference, or convention? (Q1, Q3, Q4, Q5)  
  - **Fault line 2:** Is cooperativity essential for implicature, even in irony/non-cooperation? (Q7, Q10)  
  - **Fault line 3:** Are words like "but" or "even" encoded meaning or standardized inference? (Q6, Q9)  
  Q2 and Q8 probe generalized implicatures (e.g., "some", "might") to distinguish default inferences from context-dependent ones.

  #### **Mapping Answer Patterns to Theoretical Leaves**
  1. **Grice’s intention-based view** (Implicature is part of speaker meaning; cooperativity essential; conventional implicatures are encoded):  
     - **Answers:** Q1=A, Q2=A, Q3=B, Q4=A, Q5=A, Q6=A, Q7=A, Q8=A, Q9=A, Q10=B  
     - *Why?* Consistent with reflexive intentions: e.g., planted evidence communicates because Alex *intended* recognition (Q1), "but" encodes contrast (Q6), and cooperativity is needed (Q10=B). Cancellation shows default implications (Q2=A, Q8=A).

  2. **Neo-Gricean view** (e.g., Horn, Levinson: Generalized implicatures are default inferences; cooperativity reducible to principles; conventional implicatures standardized):  
     - **Answers:** Q1=A, Q2=A, Q3=C, Q4=A, Q5=A, Q6=B, Q7=A or C, Q8=A, Q9=B or C, Q10=A  
     - *Why?* Emphasizes conventions/principles: e.g., "some" defaults to "not all" (Q2=A), "but" signals speaker’s view (Q6=B), and cooperativity isn’t always required (Q10=A). Q3=C treats implicature as convention-bound.

  3. **Relevance theory** (e.g., Sperber, Wilson: Implicature from relevance-driven inference; cooperativity dispensable; conventional cues guide inference):  
     - **Answers:** Q1=A, Q2=B, Q3=A or B, Q4=A, Q5=A, Q6=C, Q7=A or C, Q8=B, Q9=C, Q10=A  
     - *Why?* Relevance overrides cooperation: e.g., "some" has no default (Q2=B), silence implies via relevance (Q10=A), and "but" is inferential (Q6=C). Irony (Q5=A) relies on recognition through relevance.

  4. **Bach’s standardization view** (Conventional implicatures are not true implicatures but standardized inferences; speaker meaning intention-based):  
     - **Answers:** Q1=A, Q2=A, Q3=B, Q4=A, Q5=A, Q6=B, Q7=A, Q8=A, Q9=B, Q10=B or C  
     - *Why?* Conventional implicatures are inferences (Q6=B, Q9=B), but speaker meaning dominates (Q3=B, Q4=A). Cancellation works (Q2=A), and cooperativity is often needed (Q10=B).

  5. **Lewis’s convention-first view** (Meaning from social conventions; implicature as convention-bound; cooperativity incidental):  
     - **Answers:** Q1=C, Q2=B or C, Q3=C, Q4=C, Q5=A or C, Q6=C, Q7=B or C, Q8=B, Q9=C, Q10=C  
     - *Why?* Convention-centric: e.g., planted evidence communicates only via convention (Q1=C), "but" is mere convention (Q6=C), and words carry meaning independently (Q4=C). Q10=C denies implicature without convention.

  6. **Skeptical hearer-side view** (e.g., Davis: Implicature is hearer inference, not speaker meaning; cooperativity irrelevant):  
     - **Answers:** Q1=A or B, Q2=B, Q3=A, Q4=B, Q5=A, Q6=B, Q7=B, Q8=B, Q9=B or C, Q10=C  
     - *Why?* Hearer-focused: e.g., Dana "implies" because Evan infers it (Q3=A), no audience means no communication (Q4=B), and silence isn’t speaker meaning (Q10=C). "But" signals speaker psychology (Q6=B).

  #### **Limitations and Collapses**
  - **Unreachable Combinations:**  
    - **Incoherent:** Answers that mix strong speaker intention (e.g., Q3=B, Q4=A) with strong hearer inference (e.g., Q3=A, Q4=B). For instance, if you have Q3=B and Q3=A, it’s self-contradictory (naturally rare).  
    - **Unattractive/Unexplored:** Patterns like Q1=B (no communication in planted evidence) with Q5=A (irony communicates). This implies implicature works only in direct speech, which no major theory holds.  
    - **Unexplored Middle Ground:** Mixing Q6=B ("but" as speaker signal) with Q9=A ("even" as encoded) has no clear theoretical home—likely an underspecified intuition.

  - **Indistinguishable Positions:**  
    - **Bach and Neo-Gricean** often collapse on conventional implicature (both treat "but" as non-encoded; Q6=B and Q9=B/C). The scoring key separates them weakly via cooperativity (Bach: Q10=B/C; neo-Gricean: Q10=A), but in practice, they may blur.  
    - **Relevance Theory and Hearer-Skepticism** overlap on inference (e.g., Q3=A, Q8=B). Key distinguisher: Q4=A (relevance) vs. Q4=B (skepticism) for no-audience cases.  
    - **Grice and Bach** align closely on speaker meaning (Q1–Q5, Q7–Q8). Only Q6/Q9 separate them (Grice: encoded; Bach: standardized), but many users won’t split hairs.  

  This quiz doesn’t force a false choice—it flags collapses so you can present it honestly. Positions like Lewis’s are least common (all-C pattern), while Grice and relevance theory are most distinct. If your readers’ answers straddle categories, it might reflect hybrid views or unresolved tensions in the debate. 

