answer: |-
  Below is a diagnostic quiz designed to sort readers by their underlying views on implicature and speaker meaning, based on the fault lines from your argument. The quiz presents concrete scenarios with answer options phrased as natural verdicts—no technical terms or theory endorsements are used, making it accessible to non-specialists. It includes variations of your requested cases and targets the three core disagreements: the nature of implicature (speaker meaning vs. hearer inference vs. convention), the role of cooperativity, and the status of conventional implicatures.

  The quiz has 10 questions. After answering, readers can tally their responses using the scoring key to reveal which theoretical position their answers align with (e.g., Grice's intention-based view, Davis's hearer-side skepticism). The key also notes limitations: some positions collapse (e.g., Bach and neo-Gricean on conventional implicature), and a few combinations are unattested or incoherent.

  ---

  ### **The Quiz: What’s Really Being Communicated?**
  *Instructions: For each scenario, choose the verdict that best reflects your intuition. There are no right or wrong answers—just go with your gut.*

  1. **Planted Evidence**  
     Alex plants a fake receipt in Bob’s office, hoping Bob will find it and realize Alex is trying to frame him for theft. Alex *doesn’t* want Bob to report it—just to feel threatened. Bob finds the receipt and immediately understands Alex’s scheme.  
     What did Alex do?  
     A) Alex communicated his framing attempt to Bob, because Bob figured it out from the planted clue.  
     B) Alex didn’t communicate anything; he just set up a situation Bob interpreted on his own.  
     C) Alex communicated the framing only because planting evidence is a convention for sending messages.  

  2. **"Some" and Cancellation**  
     Carol says, "Some employees got bonuses." Then she adds, "Actually, all of them did."  
     What about Carol’s first statement?  
     A) It suggested that not all got bonuses, but she canceled that suggestion.  
     B) It didn’t suggest anything about how many got bonuses; it just stated a fact.  
     C) It suggested that not all got bonuses, and her second statement contradicts it.  

  3. **Overconfident Hearer**  
     Dana says to Evan, "The bank closes at 5 PM." Evan, who needs to deposit a check, takes this to mean he can’t deposit it today. Dana had no idea about Evan’s check and was just sharing the hours.  
     Did Dana imply Evan couldn’t deposit his check?  
     A) Yes, because that’s what Evan reasonably inferred.  
     B) No, because Dana had no intention to suggest anything about the check.  
     C) Only if mentioning bank hours conventionally implies transactions can’t be done.  

  4. **Talking to a Tape Recorder**  
     Fran is alone, recording a voice memo: "I lost my keys again. I’m so careless."  
     What does Fran mean by "I’m so careless"?  
     A) She means she is careless, and she’s communicating this to her future self or anyone who hears it.  
     B) She isn’t communicating anything; she’s just venting with no audience.  
     C) The words mean she’s careless, regardless of who hears them.  

  5. **Irony**  
     Gail sees a filthy kitchen and says sarcastically, "Wow, this place is spotless!"  
     What does Gail mean?  
     A) She means the kitchen is messy.  
     B) She means it’s spotless, but we understand the opposite because of her tone.  
     C) She isn’t describing the kitchen; she’s just expressing frustration.  

  6. **The Word "But"**  
     Henry says, "She’s inexperienced but talented."  
     What does Henry convey with "but"?  
     A) He conveys a contrast between inexperience and talent.  
     B) He signals that *he sees* a contrast, but the word doesn’t add meaning.  
     C) Using "but" is just a convention; it doesn’t change what’s said.  

  7. **Flouting Relevance**  
     During an argument, Jen asks Ian, "Do you care about this project?" Ian replies, "Penguins can’t fly."  
     What is Ian doing?  
     A) He’s implying he doesn’t want to engage, by being obviously irrelevant.  
     B) He’s not implying anything; he’s just refusing to cooperate.  
     C) He’s conveying that the project is hopeless, like penguins flying.  

  8. **"Might" and Cancellation**  
     Kevin says, "I might go to the party." Then he adds, "But I probably won’t."  
     What does the first part suggest before the addition?  
     A) It suggests Kevin is open to going but not committed.  
     B) It doesn’t suggest anything about his plans; it just states a possibility.  
     C) It suggests he’s likely to go, but he canceled that.  

  9. **The Word "Even"**  
     Lisa says, "Even Tom passed the test." (Tom is the least skilled.)  
     What does "even" do?  
     A) It indicates Tom’s passing is surprising.  
     B) It shows the *speaker* finds it surprising, but the word itself doesn’t mean that.  
     C) It’s a convention that prompts us to infer surprise.  

  10. **Open Non-Cooperation**  
      Maya tells Nate, "I won’t cooperate, but I’ll say this: You’re being unfair." When Nate asks why, Maya stays silent.  
      Does Maya’s silence imply anything?  
      A) Yes, she’s implying she won’t explain, despite her non-cooperation.  
      B) No, without cooperation, silence can’t imply anything.  
      C) Nate might interpret it as refusal, but she didn’t mean to communicate that.  

