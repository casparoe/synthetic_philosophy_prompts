  - Causal power in a physical system: In the brain, the self-symbol is realised in neurons and has physical effects. In programming, the self-representation is just data that the CPU processes. The causal power is there (the data affects the computation) but it's derivative: it depends on the hardware and the interpreter. The brain's causal power is more direct because the symbol is the physical pattern.

