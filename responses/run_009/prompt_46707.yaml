answer: |-
  Here is a specification of desiderata for an adequate account of aggregation within Scanlonian contractualism, structured as requested. The list isolates core challenges, grounded in paradigmatic cases, and assesses their status and implications:

  ### Core Desiderata

  1.  **Numbers in Rescue Cases (D1)**
      *   **Requirement:** Explain why a rescuer *must* (or strongly ought to) save a larger group over a single person when faced with a forced choice (e.g., save 5 miners in shaft A or 1 miner in shaft B), *without* simply summing individual complaints or well-being.
      *   **Motivating Case:** The standard "rescue case" intuition. The chosen principle must justify the priority to the many.
      *   **Camp:** Universally acknowledged as a core test case. Non-negotiable for any plausible account (rejecting it implies counterintuitive paralysis).
      *   **Status:** Non-negotiable.

  2.  **Individualist Restriction (D2)**
      *   **Requirement:** Respect the core contractualist tenet that objections to a principle must be grounded in *how it treats individuals one-by-one*. No individual's complaint can be dismissed *because* another individual gains a greater benefit; objections are assessed individually for their comparative strength against alternative principles.
      *   **Motivating Case:** Foundational to Scanlon's rejection of utilitarianism and aggregative balancing (e.g., sacrificing one innocent to save five via organ harvesting is impermissible, even if net benefit is positive).
      *   **Camp:** Core Scanlonian commitment. Non-negotiable for *Scanlonian* contractualism specifically. (Whether contractualism *must* include this is debated; rejecting it moves towards aggregation/consequentialism).
      *   **Status:** Non-negotiable *for a Scanlonian account*.

  3.  **Small Impositions Problem (D3)**
      *   **Requirement:** Explain why it can be unreasonable to reject a principle that imposes a *very small burden* on each member of a vast population to prevent a *catastrophic loss* to a single person (e.g., a trivial tax on billions to save one life), *without* summing the small burdens.
      *   **Motivating Case:** Intuition that rejecting such a principle is unreasonable selfishness. Challenges the idea that any single person's tiny burden constitutes a strong objection.
      *   **Camp:** Major challenge for strict non-aggregationists (e.g., Scanlon's initial "Impersonal Reasons" response is widely seen as inadequate). Non-negotiable for a usable theory.
      *   **Status:** Non-negotiable.

  4.  **Transgression Costs (D4)**
      *   **Requirement:** Explain how many individuals' relatively *small claims* against being subjected to a minor transgression can collectively outweigh one individual's *very strong claim* against a severe transgression (e.g., millions suffering a minor privacy violation vs. one person being tortured; or many suffering mild property damage vs. one being killed).
      *   **Motivating Case:** Intuitions about distributive justice, regulation, and public policy where minor harms to many outweigh severe harms to few *if prevented by the same rule*. Tests the limits of non-summing comparisons.
      *   **Camp:** Central concern for aggregationists/modifiers. Often the breaking point for strict non-aggregation. Non-negotiable for applicability beyond simple rescue cases.
      *   **Status:** Non-negotiable.

  5.  **Scope of Objections (D5)**
      *   **Requirement:** Clarify whose objections count: only those burdened by a principle compared to alternatives ("affected adversely"), or also those who *benefit* less under an alternative ("levelling down")? Must specify whose comparative losses generate valid objections.
      *   **Motivating Case:** Levelling Down (e.g., Principle A: All have 10 units; Principle B: One has 5, others have 10. Does the person with 5 in B have an objection against B? Do the others have an objection *for* A *against* B, since they would lose the *gain* of levelling down?).
      *   **Camp:** Key distinction between Scanlon (only adversely affected matter) and some aggregative/egalitarian views. Non-negotiable for theoretical clarity.
      *   **Status:** Non-negotiable (requires *an* answer, though the specific answer may vary).

  6.  **Risk and Uncertainty (D6)**
      *   **Requirement:** Handle cases where principles impose *probabilistic* harms (e.g., a policy exposing millions to a 1/1,000,000 chance of death) or involve *uncertainty* about outcomes. Must provide a method for comparing objections grounded in risk exposure.
      *   **Motivating Case:** Modern policy dilemmas (environmental regulation, public health, AI safety) where harms are statistical and diffuse. Essential for real-world applicability.
      *   **Camp:** Growing focus, crucial for practical ethics. Non-negotiable for a complete theory.
      *   **Status:** Non-negotiable.

  ### Tensions and Impossibility

  *   **Your Suspicion is Confirmed:** **D1 (Numbers Matter) and D2 (Individualist Restriction) are fundamentally in tension and likely jointly unsatisfiable within pure Scanlonian constraints.** D2 forbids directly comparing the *number* of complaints or summing their strength. Yet D1 requires that the *fact* there are more people burdened by *not* being rescued must make a decisive difference against the principle favoring saving the few. Any solution either:
      1.  **Smuggles in Aggregation:** By finding a way to make the *plurality* of complaints count indirectly (e.g., through "complaint strength" modulation, agent-relative reasons, or "transgression cost" structures that effectively weight numbers).
      2.  **Abandons D2:** Explicitly allows some form of interpersonal comparison or summation.
      3.  **Reinterprets D1:** Argues the intuition is wrong or based on non-contractualist factors (e.g., agent-centered prerogatives in rescue). This is generally seen as implausible for D1.
      *   **Conclusion:** A strict interpretation of D2 makes satisfying D1, D3, and D4 extraordinarily difficult, if not impossible, without significant theoretical revision. **The core tension is non-negotiable.**

  ### Most Exclusionary Requirement

  *   **D3 (Small Impositions Problem)** is arguably the most devastating for candidate accounts. It exposes the weakness of strict non-aggregation (D2) most acutely. Views that handle rescue cases (D1) via comparative complaint strength often fail here because *each individual's tiny burden seems insufficient to ground a strong objection* compared to the catastrophic loss. Conversely, views that handle D3 easily often blatantly violate D2 by summing burdens. Finding a path that satisfies D3 *without* violating D2 is the steepest challenge.

  ### Sketch of Views Against Desiderata

  1.  **Strict No-Aggregation (Scanlon's "Impersonal Reasons" or Taurek-inspired):**
      *   **D1 (Numbers):** Fails. Cannot justify saving the many over the one; may require flipping a coin.
      *   **D2 (Individualist Restriction):** Excels. Strictly upheld.
      *   **D3 (Small Impositions):** Fails catastrophically. Cannot explain why imposing trillions of tiny burdens to save a life is reasonable.
      *   **D4 (Transgression Costs):** Fails. Cannot justify prioritizing many small transgressions over one severe one.
      *   **D5 (Scope):** Typically clear (only adversely affected).
      *   **D6 (Risk):** Struggles severely; comparing probabilistic complaints is hard without aggregation.

  2.  **Levelling-Down-Averse Aggregative Amendment (e.g., Modified "Reasonable Rejectability"):**
      *   **D1 (Numbers):** Succeeds (allows counting/comparative weighting).
      *   **D2 (Individualist Restriction):** Fails. Explicitly allows aggregating burdens/benefits across individuals to determine rejectability.
      *   **D3 (Small Impositions):** Succeeds easily (summed burdens outweigh catastrophic loss).
      *   **D4 (Transgression Costs):** Succeeds easily (summed minor transgressions outweigh severe).
      *   **D5 (Scope):** Typically clear (avoids levelling-down objections, focuses on net burdens).
      *   **D6 (Risk):** Can handle via expected value or similar aggregation.

  3.  **Appeal to Transgression Costs / Agent-Relative Burdens (e.g., Kumar, Reibetanz):**
      *   **D1 (Numbers):** Succeeds (The *cost to the agent* of transgressing against many is greater than transgressing against one; or the complaint *strength* is modulated by the *nature* of the transgression involving many).
      *   **D2 (Individualist Restriction):** *Contested.* Tries to preserve it by grounding objection strength in individualistic terms (e.g., "your claim not to be killed *as part of a policy that kills many others* is weaker"). Often seen as straining D2.
      *   **D3 (Small Impositions):** *Struggles.* Explaining why *each* individual's tiny burden doesn't constitute a strong objection *against* the principle imposing it remains difficult. May rely on the *agent's* perspective (cost of transgression) rather than the complainant's.
      *   **D4 (Transgression Costs):** Succeeds (Core strength).
      *   **D5 (Scope):** Typically Scanlonian (only adversely affected).
      *   **D6 (Risk):** Can be extended (cost/risk to agent; nature of probabilistic transgression), but non-trivial.

  ### Summary

  An adequate Scanlonian aggregation theory must satisfy D1, D3, D4, D5, D6 while (for Scanlonians) preserving D2. **The fundamental tension lies between D1/D3/D4 and D2.** D3 (Small Impositions) is the most potent revealer of weaknesses. No existing view satisfies all desiderata comfortably. Strict no-aggregation fails D1, D3, D4. Levelling-down-averse aggregation fails D2. Transgression cost views attempt a middle path but face significant pressure on D2 and D3. The criteria expose that **preserving the strict individualist restriction (D2) may be incompatible with robustly accounting for numbers (D1) and small impositions (D3)**, suggesting that either D2 must be relaxed/modified, or some core intuitions (D1, D3) must be reinterpreted or abandoned for a pure Scanlonian framework.
