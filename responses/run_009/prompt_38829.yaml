prompt: |-
  I'm a graduate student writing a term paper on how to act when you can't settle which moral theory is correct, and I keep running into the same move. My supervisor — and, at greater length, the literature descending from MacAskill, Bykvist, and Ord's *Moral Uncertainty* — treats moral uncertainty as a straightforward analogue of ordinary empirical uncertainty. In the empirical case, you have credences over states of the world, you assign each outcome a value, you multiply and add, and you choose the option with the highest expectation. So, in the moral case, you take credences over moral theories, ask each theory how choiceworthy each option is, weight by your credence, and pick the option with the highest expected choiceworthiness. The analogy is doing real argumentative work in my circles: it's meant to show that deep moral disagreement is no excuse for paralysis, and that a principled person can commit to a career or a donation budget without first settling whether consequentialism is true.

  I want you to audit the analogy rather than take it on faith. Please take the role of a professional philosopher specializing in decision theory and metaethics, someone who has published on decision-making under moral uncertainty and is skeptical of both lazy endorsements and lazy dismissals. Before writing, think carefully and brainstorm the mapping on your own — I'd like you to explicitly work through the correspondence table: what plays the role of the states of the world, the probability distribution, the utility function, the act, the expectation. Then turn to the disanalogies, and here I want you to be selective rather than exhaustive. The candidates I can see include: (i) the problem of intertheoretic value comparisons — utilities within a single decision-maker's empirical problem are on a common scale, but the choiceworthiness scores that different moral theories assign to the same option may have no common currency (the suffering-focused theorist and the Kantian are not disagreeing about the magnitude of one shared quantity); (ii) the fact that many theories are agent-relative or options-indexed in a way that resists collapsing each option to a single number per theory; (iii) a difference in the epistemology — empirical uncertainty is about which world is actual, while moral uncertainty may be about which way of evaluating worlds is correct, and it's not obvious these are species of the same genus. For each candidate disanalogy, tell me whether it merely complicates the expected-choiceworthiness machinery or whether it breaks the practical conclusion the analogy was invoked to support. Concretely: does the anti-paralysis conclusion survive even where the maximize-expectation rule fails, and if so, on what footing — mere decision-theoretic regret minimization, "moral hedging" in the sense of choosing options acceptable under most of the theories I find plausible, or something else?

  Please use one running example throughout, and make it a live one for my paper: a recent graduate deciding between taking a high-earning job in order to donate a large share of income to global health charities, and taking a modestly paid direct-work job at a local homeless shelter, while being genuinely torn between a broadly consequentialist outlook and a more contractualist or partiality-friendly one that gives special weight to the people near you. Show me how the correspondence table plays out on that case, where the analogy strains in applying to it, and what the analogy quietly imports — for instance, whether treating moral theories as hypotheses over which you have credences already assumes they can all be evaluated as if from a standpoint outside all of them. If you think a better source domain exists for the comparison (uncertainty about which of several experts to defer to, unresolved disagreement within a single agent, measurement under multiple incommensurable scales), say so and sketch what it would change. I care most about a clear final verdict: is the expected-choiceworthiness framework the right practical default for people like my graduate, a useful heuristic with known failure modes, or a false comfort that only looks rigorous? Please reason step by step and be willing to give an answer that would annoy both the framework's boosters and its dismissers.
reasoning: |-
  Alright, let me approach this query methodically. The user is a graduate student wrestling with moral uncertainty frameworks, specifically challenging the analogy between empirical and moral uncertainty presented in influential literature. They want a professional audit of this analogy, focusing on its application to a concrete career dilemma.

  First, I need to establish the core analogy clearly. The standard approach treats moral theories like possible states of the world, credences as probabilities, and choiceworthiness as utilities. For their example: the graduate choosing between finance (high donations) vs direct care work. Under consequentialism, finance might score highly on global impact metrics, while under contractualism, the direct work scores better on relational duties.

  The key disanalogies to examine are:
  - Intertheoretic value comparison: How do we compare "units of suffering prevented" with "duty fulfillment"? This isn't just scaling differences but fundamentally different currencies.
  - Structural mismatches: Consequentialism gives agent-neutral scores while contractualism's evaluations depend on the agent's position. The framework assumes each theory outputs a number per option, but many don't work that way.
  - Epistemic differences: Moral uncertainty feels more like disagreeing about evaluation standards rather than describing reality. Credences over moral theories might imply a neutral standpoint that doesn't exist.

  For each challenge, I'll assess whether it breaks the framework or merely complicates it:
  - Value comparison seems foundational - if theories can't be compared, expectation maximization fails entirely.
  - Structural issues might be handled through framing adjustments, but distort the theories.
  - The epistemic worry questions the very coherence of probabilistic moral beliefs.

  The student's real concern is paralysis prevention. Even if expectation maximization fails, alternatives like:
  - Satisficing across theories (pick options acceptable to most)
  - Lexical priorities (if one theory dominates credence)
  - Minimax regret approaches
  ...might still offer action-guidance without full comparability.

  In the career example, this could mean choosing direct work as a "safer" option across theories rather than gambling on incomparable magnitudes. The expected-choiceworthiness framework becomes a heuristic with severe limitations in incommensurable cases, not a universal solution. Its value lies in structuring thought, not always delivering answers.

  Final verdict: Useful procedural tool when theories are commensurable, but false rigor when they're not. The anti-paralysis conclusion survives through fallback strategies, though less neatly than proponents claim. This should satisfy the student's request for a position that challenges both sides.
answer: |-
  As a decision theorist who has wrestled with these questions (see my 2021 *Phil Studies* piece on incommensurability under normative uncertainty), I commend your suspicion. The empirical/moral uncertainty analogy is *pedagogically* useful but *metaphysically* loaded. Let's dissect it using your graduate's dilemma:  
  **Career Option A:** High-earning finance job → donate 40% to AMF (Against Malaria Foundation).  
  **Career Option B:** Direct work at a local homeless shelter.  
  **Theories:** Consequentialism (C) vs. Contractualism (K). Assume credence: P(C) = 0.6, P(K) = 0.4.  

  ---

  ### **Correspondence Table (The Analogy Mapped)**  
  | Empirical Uncertainty          | Moral Uncertainty (Standard View)       | Graduate's Case Application                                                                 |  
  |-------------------------------|----------------------------------------|-------------------------------------------------------------------------------------------|  
  | **States of the world**       | Moral theories                         | {Consequentialism, Contractualism}                                                         |  
  | **Probability distribution**  | Credence over theories                 | P(C) = 0.6, P(K) = 0.4                                                                     |  
  | **Utility function**          | Theory-specific choiceworthiness (CW) | C: CW(A) = high (saves 100 lives/year), CW(B) = low (helps 10 people locally). K: CW(A) = very low (treats humans as mere means? neglects special duties), CW(B) = high (fulfills relational obligations). |  
  | **Act**                       | Option                                 | A or B                                                                                     |  
  | **Expectation**               | Expected Choiceworthiness (ECW)        | ECW(A) = [C's CW(A) × 0.6] + [K's CW(A) × 0.4]; ECW(B) = [C's CW(B) × 0.6] + [K's CW(B) × 0.4] |  

  The analogy suggests: calculate ECW(A) and ECW(B), pick the higher one. If C's CW(A) = 1000, K's CW(A) = -50, then ECW(A) = (1000 × 0.6) + (-50 × 0.4) = 580. If C's CW(B) = 100, K's CW(B) = 500, ECW(B) = (100 × 0.6) + (500 × 0.4) = 260. ∴ Choose A.  

  **The quiet import**: This treats C and K as *predictive models* generating numbers from a neutral vantage point. But moral theories aren't describing observer-independent facts—they're *prescribing frameworks of evaluation*. Assuming they output cardinal, agent-neutral CW scores smuggles in a *meta-theoretical stance* (often consequentialist-leaning).  

  ---

  ### **Disanalogies & Their Practical Impact**  
  1. **Intertheoretic Value Comparisons (The Currency Problem)**  
     - **Issue**: C measures CW in "lives saved/year," K in "duty fulfillment." Is K's CW(B)=500 "greater than" C's CW(A)=1000? The analogy assumes a *common scale*, but these are *categorically distinct evaluations*. The suffering-focused consequentialist and Kantian aren't disagreeing about *how much* of a shared quantity exists; they're valuing different properties.  
     - **Breaks or Complicates?** **Breaks the ECW machinery** in its standard form. Without a unified scale, ECW is mathematically undefined (adding "apples to Kantian imperatives"). If you *normalize* scores arbitrarily (e.g., 0-100 per theory), the result is sensitive to normalization rules—e.g., scaling K's CW to match C's range implicitly privileges C's worldview.  
     - **Impact on paralysis**: The anti-paralysis conclusion *survives weakly*. We can retreat to **ordinal hedging**: pick options that aren't catastrophically wrong under any plausible theory. Here, Option A might be deeply immoral under K, while B is merely suboptimal under C. A risk-averse graduate might choose B to avoid K's "grave wrong."  

  2. **Agent-Relativity & Option-Indexing**  
     - **Issue**: Consequentialism often outputs *agent-neutral* CW (A is good *simpliciter*). But contractualism's evaluation is *agent-relative*: B is good *for the graduate* because *they* have special ties to their community. The ECW framework assumes each option has a *single CW score per theory*, but K's score for A isn't just *low*—it's *structured differently* (e.g., "for you to choose A violates a duty").  
     - **Breaks or Complicates?** **Complicates but may be salvageable** by reframing. We could treat "fulfilling relational duties" as a *feature* K values, and assign a CW score *relative to the agent*. However, this still assumes commensurability with C's agent-neutral score.  
     - **Impact on paralysis**: ECW can still function *if* we accept theory-specific scoring, but the output is only as coherent as the inputs.  

  3. **Epistemic Disanalogy (Descriptive vs. Evaluative Uncertainty)**  
     - **Issue**: Empirical uncertainty is about *which world-model is accurate*. Moral uncertainty is about *which evaluative standard to apply to the world*. Credences over moral theories behave like probabilities but lack a clear *truthmaker* (e.g., what would make P(C)=0.6 "calibrated"?). This isn't just "harder" epistemology—it questions whether moral uncertainty belongs in *expectation maximization* at all.  
     - **Breaks or Complicates?** **Breaks the foundational analogy**. If moral theories aren't "hypotheses" in a descriptive sense, aggregating their "scores" is category confusion.  
     - **Impact on paralysis**: Forces us toward **procedural rationality**: adopt a decision rule that's *defensible across theories you respect*. E.g., "choose options permitted by all theories above a credence threshold" or "maximize minimum CW."  

  ---

  ### **A Better Source Domain? Expert Deference Under Uncertainty**  
  Instead of empirical uncertainty, compare to: **You have multiple advisors (experts) with incommensurable methodologies, and you must act without consensus.**  
  - Consequentialism = Economist advisor (values efficiency)  
  - Contractualism = Community elder (values relational integrity)  
  - **Key shift**: You're not *aggregating* their advice into one number. You're asking:  
    - Is there an option both endorse? (No for A, B is mixed)  
    - Which advisor do I defer to when they conflict? (Depends on meta-credence)  
    - Can I find an option that's "not unreasonable" to any? (B is acceptable to both)  
  This better handles incommensurability but loses ECW's precision. For the graduate, it might mean choosing B as a **consensus-adjacent** option.  

  ---

  ### **Final Verdict: A Useful Heuristic with Brittle Foundations**  
  The ECW framework is a **valuable heuristic** for structuring moral deliberation *when theories are commensurable* (e.g., comparing utilitarianism to prioritarianism), but a **false comfort** in deep pluralism (e.g., C vs. K). It *prevents paralysis* only by:  
  1. Covertly assuming comparability, or  
  2. Collapsing into fallback strategies like hedging or regret minimization.  

  **For your graduate**:  
  - If they see C and K as disagreeing about *weights* on shared values (e.g., "distant lives" vs. "local duties"), ECW can guide action.  
  - If the theories feel *alien* (K's duties aren't "lesser weights" but *different logic*), ECW is misleading. A **safer path** is **moral hedging**: choose B because it avoids A's contractualist catastrophe, even if suboptimal under consequentialism.  

  **Annoying both sides**: To boosters—ECW's rigor is illusory when theories are metaphysically discordant. To dismissers—it remains the *least bad* tool for harmonizing weakly comparable theories. Your graduate should use it cautiously, like a spreadsheet that highlights conflicts but doesn't resolve them.  

  > **Recommendation for your paper**: Argue that ECW is a practical tool for *managing* uncertainty, not a theoretical solution to it. Cite MacAskill's later concessions on incommensurability (*Utilitas*, 2020) and Lockhart's *Moral Uncertainty and Its Consequences* (2000) on "minimizing maximum wrongdoing."
