  To resolve the wall:  
  1. **Isolate metaphysics first**: Debate whether the coin flip creates a *metaphysical* lack of fact (your view) or merely *epistemic* ignorance (colleague's).  
  2. **Clarify "truth value"**: Specify if it requires (i) present truthmakers, (ii) Ockhamist timeless truth, or (iii) supervaluationist "settledness."  
  3. **Test with variants**: Swap the coin flip for a deterministic but unknown event (e.g., admiral's fixed but secret choice). If your credences converge, the gap was metaphysical; if not, it's semantic.  

  Your 0.45 likely reflects a supervaluationist-leaning view with metaphysical openness; your colleague's 0.85 suggests Ockhamism or eternalism. The coin flip sharpening is doing real work—don't retreat to the classical case.
