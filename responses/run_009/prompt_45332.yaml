prompt: |-
  I run the behavioral side of a cardiac rehab program at a mid-sized hospital, which in practice means sitting down a few times a week with fifty- to seventy-year-olds who've just had a heart event and trying to get them to quit smoking, actually take their statins, and walk. Twenty minutes per session, high stakes, and my whole training is basically motivational interviewing: don't lecture, don't argue, elicit the patient's own reasons for change. My brother-in-law is finishing a philosophy PhD and he tells me this isn't just a counseling style, it's a live metaphysical position — he mentioned Bernard Williams' distinction between internal and external reasons. As I understand it: the claim "this patient has a reason to quit" is only true if there's some route from the motives and values he already has — after correcting false beliefs, spelling out consequences he hasn't imagined, letting him deliberate properly — that ends in him wanting to quit. If there's no such route, then on Williams' view there is no reason there to be found, just my reasons for wanting him to quit. That would explain alot of why lecturing people fails! But it also seems to have implications I'm not sure I can live with clinically, and I'd like it turned into something usable.

  Write me a procedure I can actually run in twenty minutes: the questions to ask in order, what counts as a sufficient answer at each step, where the procedure lets me document "no internal reason found, stop pushing" and close the file, and where it has to hand the decision back to me because the question is one of values rather than facts. It needs to handle the three kinds of patient I actually get. First, the guy who obviously cares about being around for his grandkids but hasn't connected that to quitting — sounds like an easy internal reason, but what do I concretely check before I'm allowed to believe the connection is real and not just something he says to me? Second, the guy who, after knowing him for two years, has clearly weighed it and genuinely prefers his remaining years with cigarettes — not confused, not in denial, just assigns different weights than I do. Third, the patient whose "own values" I suspect are mostly untreated depression talking, where I honestly don't know whether a motivational set you'd deliberate from while depressed is one that should count as *his* for these purposes.

  Two more things. Be honest about which steps of the procedure are real steps and which are my judgment dressed up as a checklist — my brother-in-law says this is a known worry about the whole idea, that "sound deliberation" ends up doing all the work and can be stretched to whatever conclusion you were going to reach anyway, and if that's true of my procedure I want to know which parts it's true of. And tell me where the procedure says I'm allowed to try to *change* what a patient wants — building a new attachment, making the grandkids more vivid, even the occasional strategic guilt trip — as opposed to only finding reasons inside what's already there. I genuinely can't tell whether that's counseling or manipulation, and I suspect Williams doesn't fully settle it either, so wherever the procedure can't settle it, say so and tell me what I'm stuck deciding myself.
reasoning: |-
  Okay, let me start by unpacking the user's query. They work in cardiac rehab, using motivational interviewing (MI) to help patients quit smoking, take statins, and exercise. Their brother-in-law mentioned Bernard Williams' internal vs. external reasons, and they want a practical procedure based on that for 20-minute sessions. 

  First, I need to recall Williams' distinction. Internal reasons are tied to the patient's existing motives after sound deliberation. External reasons are what others think they should do. The user’s challenge is applying this in clinical practice without crossing into manipulation.

  The user has three patient types. The first cares about grandkids but hasn't connected it to quitting. The second has consciously chosen cigarettes over longevity. The third might have values distorted by depression. Each needs a different approach. 

  For the procedure, it must fit into 20 minutes. Steps should be clear, with checkpoints to stop if no internal reason is found. Also, the user wants transparency on where judgment comes in versus structured steps. They’re worried about "sound deliberation" being subjective. Another concern is when it’s ethical to influence desires versus just uncovering existing ones.

  I should start by grounding the procedure in MI principles—open questions, affirmations, reflective listening. Then structure steps around eliciting values, exploring discrepancies, and assessing readiness. For each step, define what a sufficient answer is and where documentation points are.

  For the grandkids example: Ask open-ended questions about their values. Listen for specific, personal reasons. If they mention family but don’t link to health, gently explore that gap. Use reflective listening to confirm genuine connection. If the link is made, it’s an internal reason. If not, document and stop.

  The patient who prefers smoking: Focus on informed consent. Ensure they understand consequences without denial. If they acknowledge risks but prioritize smoking, accept their autonomy. Document as a values-based decision.

  Depression complicates things. Need to assess if depression affects their motives. If depression is untreated, prioritize treatment first. If treated and they still choose smoking, it’s their valid choice. But if depression skews their judgment, that’s a gray area. The procedure must highlight when to refer for mental health support.

  Transparency about judgment is key. Steps like "assess sound deliberation" involve clinician discretion. I should note where subjective calls happen, like evaluating if a patient’s reasoning is coherent or influenced by mental health issues.

  Influencing desires: MI allows enhancing motivation through exploring values, but creating new attachments (like guilt trips) is manipulative. The procedure should differentiate between evocative questions (allowed) and inducing emotions (not allowed). Admit where it’s ambiguous, like making grandkids more vivid—context matters.

  Finally, the user needs to know when to stop pushing. Clear documentation points if no internal reason is found or if it’s a values conflict. Also, safety nets for depression or coercion concerns. Emphasize that respecting autonomy is central, even if it conflicts with clinical desires.
answer: |-
  Here’s a practical 20-minute procedure grounded in Williams' internal reasons framework, designed for cardiac rehab. It prioritizes discovery over persuasion, flags judgment points transparently, and handles your three patient types. Use a structured note template (like the one at the end) to document decisively.

  **Core Structure (20-Minute Session):**  
  `Values Elicitation (5 min) → Discrepancy Exploration (10 min) → Decision Point (5 min)`  

  ---

  ### **Step 1: Values Elicitation (OPEN QUESTIONS)**  
  *Goal: Uncover the patient’s *actual* motives.*  
  **Actions:**  
  - Ask: *“What matters most to you in life right now?”*  
  - Follow up: *“What would you lose if your health limited you further?”*  
  - **Crucial:** Note *specific, concrete* answers ("Seeing my granddaughter’s soccer games" vs. "Being healthy").  

  **Sufficient Answer:**  
  - ≥2 non-health-related values stated (e.g., family, independence, hobbies).  
  - *Judgment call:* If values are vague ("I guess family?"), probe once: *“How does that show up in your week?”*  

  **Documentation Trigger:**  
  - `No values articulated despite probing → Suspect apathy/depression → Pause procedure, screen for depression (PHQ-2).`  

  ---

  ### **Step 2: Discrepancy Exploration (REFLECTIVE LISTENING + CONSEQUENCE MAPPING)**  
  *Goal: Connect values to behavior *only* if a deliberative link exists.*  
  **Actions:**  
  - Reflect values back: *“So staying strong for your granddaughter is really central for you.”*  
  - Ask: *“How does [smoking/not walking/skipping statins] fit with that?”*  
  - **If no link volunteered:** *“Some folks notice [behavior] makes [value] harder—any sense of that for you?”*  

  **Sufficient Answer:**  
  - Patient *volunteers* a conflict (e.g., "I do cough when I play with her").  
  - **OR** Patient agrees *without defensiveness* when you reflect a potential conflict (e.g., *“So even though grandkids matter, smoking feels separate?”* → *“Yeah, I haven’t thought about it.”*).  

  **Red Flags (Indicates NO internal reason):**  
  - Clear, consistent rejection: *“No, smoking helps me cope so I *can* be there for them.”*  
  - Values-behavior alignment: *“I know I’ll die sooner—that’s a trade I accept.”*  
  - *Judgment call:* Distinguish **denial** ("Smoking never hurt anyone!") from **informed preference** ("I’ve had 60 good years, I want enjoyment now").  

  **Documentation Trigger:**  
  - `Patient affirms alignment or trade-off after deliberation → No internal reason → Document and stop pushing behavior change.`  

  ---

  ### **Step 3: Decision Point (AUTONOMY CHECK + ACTION HANDOFF)**  
  *Goal: Resolve ambiguity about reasons vs. values.*  
  **Actions:**  
  - **If internal reason found (Step 2):**  
    - *“Given this conflict with [value], what’s your next step?”* (Handoff to patient).  
  - **If no internal reason OR values conflict:**  
    - *“It sounds like this is a choice based on what matters to you, not a gap in facts. I’ll note that and respect it.”*  
  - **If depression suspected:**  
    - *“When people feel down, health choices can feel pointless. Would you be open to talking about that first?”*  

  **Sufficient Answer:**  
  - Patient articulates an action step *linked to their value*.  
  - **OR** Patient affirms their preference is values-based.  

  **Documentation Trigger:**  
  - `Values conflict confirmed → Close file on behavior change.`  
  - `Depression likely distorting motives → Refer to mental health, pause health behavior push.`  

  ---

  ### **Handling Your 3 Cases:**  
  1. **The "Grandkids" Patient:**  
     - **Check for authenticity:** Does he describe *specific* activities he’d lose? Does his voice/face change when mentioning them? *Sufficient proof:* He spontaneously links smoking to symptom-limiting (e.g., "I get winded chasing her"). If not, it’s just lip service → No internal reason.  

  2. **The Informed Preference Patient:**  
     - **Verify deliberation:** Ask *“What’s your understanding of how this affects your heart?”* → If he accurately states risks (e.g., "I know it could take 5 years off") and affirms his priority (e.g., "I want those years with my cigarettes"), document as values-based. **Stop pushing.**  

  3. **The Depressed Patient:**  
     - **Test motive ownership:** *“If the cloud lifted, would this choice feel the same?”* If unsure, use PHQ-2. *Judgment call:* Untreated depression invalidates "deliberation" → Refer. Treated depression with consistent preference? Accept it.  

  ---

  ### **Transparency: Where Judgment Masquerades as Procedure**  
  | **Step**               | **Looks Like Procedure**          | **Is Actually Judgment**                          |  
  |-------------------------|-----------------------------------|--------------------------------------------------|  
  | "Sufficient" values     | Patient lists items               | Assessing *depth* of attachment (tone, specifics)|  
  | "Sound deliberation"    | Patient states risks accurately   | Deciding if their *weighting* of risks is "rational" |  
  | Depression distortion   | PHQ-2 score                      | Interpreting if values are *authentic* vs. illness-driven |  

  **Williams’ Blind Spot:** "Sound deliberation" *can* be stretched. Your safeguard: **Document the patient’s exact words** for values/choices. If they can’t articulate *why* a value matters, it’s likely not motivational.  

  ---

  ### **When Can You *Change* What They Want?**  
  - **Allowed (Counseling):**  
    - Evoking emotions tied to *existing* values (*“How would your granddaughter feel if you couldn’t play?”*).  
    - Correcting factual ignorance (*“Statins reduce your risk of another heart attack by 40%”*).  
  - **Gray Area (Proceed Cautiously):**  
    - Building new attachments (e.g., suggesting gardening to a sedentary patient). *Test:* Is this expanding their *existing* value (e.g., "You value nature—ever tried gardening?") or imposing yours?  
  - **Not Allowed (Manipulation):**  
    - Inducing shame/guilt unrelated to their values (*“Good grandfathers don’t smoke”*).  
    - Overstating risks to "motivate."  

  **Where Williams Is Silent:** Creating new desires (e.g., helping a lonely patient discover community walking groups) is **permissible IF** it connects to latent values (e.g., "You mentioned missing feeling connected"). The line: **Does this feel like *discovery* to the patient, or salesmanship?** When in doubt, err on discovery.  

  ---

  ### **Procedure Flowchart & Documentation Template**  
  ```  
  [ ] Step 1: Values Elicited: ___________ (Concrete: Yes/No)  
  [ ] Step 2: Discrepancy Explored:  
      □ Internal reason found → Action plan: _______  
      □ No conflict → Reason: Denial/Informed Preference/Values Alignment  
      □ Depression suspected → PHQ-2: ___ → Refer: Yes/No  
  [ ] Step 3: Decision:  
      □ Change pursued (internal reason)  
      □ File closed (no internal reason)  
      □ Pending MH referral  
  ```  

  **Key:** You’re not deciding if their reasons are *good*, but if they *exist*. When there’s no internal reason, your job shifts from change to respect. That’s not failure—it’s autonomy.
