answer: |-
  **MEMORANDUM**  
  To: Flatpack Working Group  
  From: Chair, Flatpack Working Group  
  Date: 12 June 2024  
  Subject: Resolution for Clause 12.4 (Field Name Case-Insensitivity)  

  ### Summary  
  After extensive review, I recommend that Flatpack 1.1 retain **ASCII case-folding** for field name matching. However, we will explicitly define Unicode case-folding as the target for Flatpack 2.0, with a transition period and migration tooling. This balances immediate stability with future evolution.  

  ### Practical Recommendation  
  1. **Flatpack 1.1 Errata:** Clarify that clause 12.4 requires ASCII case-folding (e.g., `A-Z` ↔ `a-z` only).  
  2. **Timeline:**  
     - **July 2024:** Ratify this errata for 1.1.  
     - **January 2025:** Release lightweight migration tools (e.g., a linter flagging ß/ss collisions).  
     - **2026:** Begin drafting Flatpack 2.0 with mandatory Unicode case-folding.  
  3. **Migration Safeguards:**  
     - New datasets targeting 2.0 MUST use explicit Unicode normalization.  
     - Parsers for 2.0 MUST emit warnings for field names with ß/ss or similar ambiguities.  

  **Why ASCII now?** Ten years of ecosystem practice have treated `GROSS` (German "big") and `Gross` (English "total") as distinct. Forcing Unicode folding overnight merges fields in datasets like German economic records (e.g., `Masse` vs. `Maße`), silently corrupting data. The cost of breakage outweighs theoretical purity.  

  **Strongest Counterargument (Unicode Advocates):**  
  Unicode folding aligns with modern text-handling norms and avoids edge-case collisions (e.g., `i` vs. `İ`). Delaying it perpetuates an Anglocentric bias. We mitigate this by committing to Unicode in 2.0 and providing tools to ease adoption.  

  ### Our Authority: Interpretation vs. Legislation  
  This is not merely "discovering" the original meaning, nor is it unconstrained legislation. Our decision rests on three pillars:  

  1. **Textual Intent in Context:**  
     The spec’s text ("case-insensitive") is underdetermined—it could imply ASCII or Unicode. But when a rule is published alongside real-world usage (all parsers used ASCII for a decade), the community reasonably assumes the *practiced interpretation* is authoritative. To retroactively redefine "case-insensitive" as Unicode would invalidate conforming implementations overnight. That violates the spec’s core purpose: predictable interoperability.  

  2. **The Normativity of Practice:**  
     A standard’s authority derives from shared expectations. If every engineer implemented ASCII folding, the de facto rule *became* ASCII—not because the author willed it, but because the community coalesced around it. Conformity isn’t dictated by text alone, nor by authorial intent alone, but by the *consistent pattern of application* that users rely on.  

  3. **Legislating Forward, Not Backward:**  
     For 1.1, we are *interpreting* the rule as settled by practice. For 2.0, we *legislate* Unicode folding because technology and needs evolve. Admitting this does not undermine normativity; it clarifies that standards bodies steward rules through time. Pre-2.0 parsers that switch to Unicode now are non-conforming because they break existing data; post-2.0 parsers using ASCII would be non-conforming because they ignore a ratified update.  

  ### Why This Doesn’t Open the Floodgates  
  Skepticism about "fixed meaning" is valid—no rule anticipates every case. But conformity is not mystical. It is judged against:  
  - **Clarity of past rulings** (here, unanimous implementation behavior),  
  - **Public evidence** (datasets structured around ASCII),  
  - **Avoiding harm** (silent data corruption).  

  If we faced *no* prior practice (e.g., a new clause), we’d legislate freely. Here, practice anchors the rule.  

  ### Conclusion  
  Recommendation: **Affirm ASCII for 1.1, mandate Unicode for 2.0.** This honors our duty to users (stability) and progress (evolution). The memo draft for July’s vote will include:  
  - Technical appendix on ASCII/Unicode collisions.  
  - Migration roadmap.  
  - Philosophical rationale (<200 words) for transparency.  

  We are interpreters of the past and legislators of the future—both roles demand rigor.  

  ---  
  **Annex: Rationale (for committee eyes only)**  
  *The "rule-following" worry—that past practice underdetermines future cases—is real but manageable. Standards derive force from collective trust. Changing a rule without overwhelming justification (e.g., critical security flaws) breaches that trust. Here, practice fixed the rule’s meaning; we now adapt it openly for new needs. This is how technical governance works.*
