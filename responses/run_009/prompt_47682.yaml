answer: |-
  ### Translation of Philosophical Positions into Craft Vocabulary

  #### **1. Jackson's Original Argument (Mary Learns Something New)**  
  *Craft Translation:*  
  This is the doctrine of **showing versus telling** in its purest form. The scientist confined to her room has received exhaustive *summary* (told every physical fact about color). But upon seeing red, she experiences a *scene*—a raw, sensory enactment that cannot be compressed into reportage. The funeral chapter in your novel *shows* grief through visceral details (the weight of the coffin, the smell of damp earth, the crack in a widow’s voice), while a psychology textbook *tells* about grief in abstract terms. Jackson claims that showing delivers content summary cannot: a recognition of "what it is like" that functions as **defamiliarization**—red ceases to be a wavelength and becomes a *shock*.  

  *Residue Report:*  
  - **Survives Cleanly:** Core claim aligns perfectly with craft dogma. "Some knowledge must be staged, not summarized" is Jackson’s argument in craft terms.  
  - **Bent Slightly:** Jackson’s "new fact" is rendered as "new recognition," which risks conflating *epistemic gain* with *aesthetic effect*. But the craft vocabulary captures the essence.  
  - **Cannot Be Said:** The metaphysical assertion that this proves "non-physical facts exist" has no craft equivalent. Fiction deals in verisimilitude, not ontology.  

  ---

  #### **2. Lewis's Ability Hypothesis (Gains Know-How, Not New Facts)**  
  *Craft Translation:*  
  Mary gains **skills of imagination and recognition**, akin to what you cultivate in readers. Your funeral chapter doesn’t hand the reader a *proposition* ("grief feels like X"); it trains their capacity to *simulate* grief. This is the difference between:  
  - *Summary* (telling: "She felt devastated")  
  - *Scene* (showing: "Her hands wouldn’t unclench from the folded program")  
  - *Defamiliarization* (making grief palpable through details: "The casket’s varnish smelled like childhood piano lessons")  
  What Mary learns is **craft expertise**: the ability to *stage* red in her mind, recognize its variants, and recall it—precisely the skills your prose drills in readers.  

  *Residue Report:*  
  - **Survives Cleanly:** Lewis’s "abilities" map directly to craft’s aim: honing readers’ capacities for sensory imagination and emotional pattern-recognition.  
  - **Bent Slightly:** Philosophy’s "know-how" implies a procedural skill (like riding a bike), while fiction’s training is more about *guided simulation*. But the core survives.  
  - **Cannot Be Said:** Lewis’s reduction of phenomenology to behavioral capacities. Craft acknowledges that simulated grief *feels like something* during reading—a qualitative aspect not fully captured by "ability."  

  ---

  #### **3. Phenomenal Concept Strategy (New Mode of Access, Same Facts)**  
  *Craft Translation:*  
  This is **free indirect discourse (FID) applied to experience**. Mary knew the *summary* (all physical facts), but upon seeing red, she gains a *subjective lens*—like shifting from third-person narration to FID, where the narrator’s voice merges with the character’s raw perception. Example:  
  - *Telling (Old Concept):* "Red light is 700nm."  
  - *Showing (New Concept via FID):* "The world *sang*—a color that *burned* without heat."  
  The facts don’t change, but the *mode of presentation* does. Your funeral chapter uses **telling details** (e.g., "the cemetery mud sucking at her shoes") to create this FID-like access: the reader doesn’t learn new *about* grief; they gain a new *route* to the old knowledge.  

  *Residue Report:*  
  - **Survives Cleanly:** The shift from abstract summary to embodied scene mirrors "new mode, same content." FID is the craft engine for this.  
  - **Bent Significantly:** Philosophy insists the *factual content* is identical, while craft shows that *form transforms content’s impact*. A detail like "sucking mud" doesn’t just repackage grief—it *reconstitutes* it. The translation inflates "mode" into aesthetic force.  
  - **Cannot Be Said:** The distinction between "concept" and "reference." Craft has no equivalent for "the same fact under a different description."  

  ---

  #### **4. Dennett's Response (Complete Deduction in the Room)**  
  *Craft Translation:*  
  Dennett claims a perfect *summary* could simulate *scene*—like arguing that a hyper-detailed report ("Red: 700nm; neural response pattern XYZ; cultural associations A, B, C...") *is* the experience. In craft terms:  
  - Mary is a **flawless robot reader** who, given exhaustive *telling* (every physical/cultural datum), should *deduce* the emotional effect without needing *showing*.  
  - This rejects the dogma that "some knowledge must be staged." Dennett insists that if the summary is sufficiently rich ("the varnish-smell evoking childhood pianos"), it *becomes* the experience.  

  *Residue Report:*  
  - **Survives Cleanly:** The challenge to "show-don’t-tell" is clear. Dennett treats *summary* as capable of *enactment* if granular enough.  
  - **Bent Slightly:** Dennett’s focus is cognitive/computational; craft cares about *affective resonance*. The translation bends by implying emotional weight can be fully encoded in data.  
  - **Cannot Be Said:** Dennett’s eliminativism about qualia. Craft assumes readers feel *something* during scenes—a residue philosophy might deny.  

  ---

  ### Residue Report: Your Hypothesis Confirmed  
  Your intuition is correct: **fiction creates "acquaintance at one remove," a third category neither fact nor skill.** The residue shows:  
  1. **What Philosophy Misses**:  
     - Craft’s **staged simulation** generates *provisional* acquaintance. Readers don’t *know* grief (like a fact) or *master* it (like a skill)—they *inhabit a proxy*. This is "defamiliarization as temporary ontology."  
     - Philosophy’s fact/skill binary collapses when **aesthetic form** (scene, detail, FID) becomes the medium of knowing. What survives translation is *affect-as-epistemology*: the shaking reader gains not knowledge-*that* but knowledge-*as-if*.  

  2. **What Fiction Flatters Itself About**:  
     - The craft vocabulary *assumes* its simulations are "recognizably like" the real thing. But philosophy’s Mary debate reveals this may be circular: we recognize the portrayal *because* we’ve had analogous experiences. Your childless reader shaking at the funeral chapter may be extrapolating from lost loves or fears—not grasping grief *de novo*.  

  3. **Vocabulary Limitations**:  
     - **Critical Deficit**: Craft lacks a term for *simulated acquaintance*. "Show-don’t-tell" implies delivery of *something*, but not what kind of thing.  
     - **Philosophy’s Blind Spot**: The phenomenal concept strategy’s "concept/reference" distinction *cannot* be expressed in craft terms because fiction’s power lies in blurring that line. When you write "the mud sucked," the detail *is* the grief for the reader. This suggests philosophy over-intellectualizes experience.  

  ### Conclusion  
  The residue points decisively to your "third thing": **fiction generates *experiential analoges***—vicarious acquaintaince that is *neither* fact nor skill, but a *form-saturated simulation* that feels like knowing. Philosophy’s frameworks struggle with this because they prioritize *propositional precision* over *aesthetic contagion*. Meanwhile, craft’s vocabulary, while rich in technique, lacks a metaphysics of its own effects—leaving the novelist as an untheorized alchemist. Your funeral chapter works because craft *stages recognition*, not truth; philosophy stumbles because it demands whether that recognition *is* truth. The translation bends philosophy toward phenomenology and exposes craft’s tacit claim: *to show is to make temporarily real*.  

  If you were to coin a craft term for this third thing, it might be **"semblance-knowing"**—knowledge by immersive proxy. But perhaps it’s better unnamed, lest we trade the alchemy for the formula.
