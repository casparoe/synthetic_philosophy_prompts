  They suspect that fiction creates something neither fully "knowledge-that" nor "know-how" - perhaps "acquaintance at one remove." And they want me to analyze what gets lost in translation both ways: which philosophical distinctions can't be expressed in craft terms, and whether that reveals limitations in philosophy or in literary vocabulary.

  Key points from their request:
  - They describe creating emotional experiences for readers who haven't lived them
