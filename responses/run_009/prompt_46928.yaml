prompt: |-
  I'm advising the drafters of a post-authoritarian settlement in a country very like Argentina or South Africa in the 1990s: the old regime has collapsed, the military still commands enough fragmented loyalty to restart the fighting, and there is overwhelming public demand for trials. Whatever happens will involve amnesty in some form, and I've come to suspect that the real disagreement is not about whether amnesty can be justified but about what a justification of amnesty is even for — the South Africans treated it as something victims could meaningfully trade (truth for individualized, conditional amnesty), the Argentine legislators behind the full-stop and due-obedience laws treated it as a sovereign act of closure imposed on the process, and the Rwandan approach via gacaca treated confession-and-sentence-reduction as something closer to a plea bargain. I want the specification before I read any more theory.

  Write the desiderata: what any adequate justification of amnesty in a transition must deliver — which cases it must get right (the conditional individual amnesty of the South African sort, the blanket self-amnesty of an outgoing junta writing its own indemnity law before handing over power, sentence-reduction schemes, pardons issued after conviction), which distinctions it must respect (amnesty versus pardon versus simple non-prosecution versus lustration; a forgiveness granted by whom, exactly, when the state is both the author of the crimes and the party granting the amnesty), and which constraints it cannot contradict (victims' entitlement to a remedy, the state's own interest in not laundering its agents' crimes through a reconciliation narrative, the empirical finding that amnesties both do and do not correlate with renewed conflict, and the international law trend against impunity for the worst categories of crime). Give the case or consideration behind each requirement, mark which are non-negotiable and which are prejudices of one camp dressed up as requirements, and flag any subset of the desiderata you suspect is jointly unsatisfiable — in particular whether "amnesty must be acceptable to victims as a remedy" and "amnesty must be credible as a guarantee to perpetrators" can be met by the same instrument. Then, in no more than a paragraph each, say how the trade-model, the sovereign-closure model, and the plea-bargain model do against the list. Keep the weight on the criteria; I'll do the scoring myself when I meet the actual theories.
reasoning: |-
  Okay, the user is deeply involved in advising on a post-authoritarian settlement, similar to Argentina or South Africa in the 1990s. They need a clear framework to evaluate amnesty justifications, focusing on practical desiderata rather than theory. 

  First, I need to unpack their core concern: they suspect the real disagreement isn't about whether amnesty can be justified, but what the justification is *for*. They've outlined three models—South Africa's trade model, Argentina's sovereign closure, and Rwanda's plea-bargain approach—and want criteria to assess these before diving into theory. 

  The user’s explicit request is for desiderata: what any amnesty justification must deliver, which cases it must handle, distinctions it must respect, and constraints it can’t violate. They also want markers for non-negotiables vs. debatable claims, and red flags about potentially conflicting goals. 

  Reading between the lines: they’re likely drafting real policy and need actionable clarity fast. Their frustration with abstract theory suggests they’ve hit dead ends in academic debates. The mention of victims’ remedy vs. perpetrators’ guarantee hints at tension they’ve observed in practice. They might also be wary of international pressure (e.g., anti-impunity norms) clashing with local realities like military fragility. 

  Structurally, I’ll: 
  1. **Define must-handle cases** (from conditional amnesty to self-amnesty), noting which are non-negotiable (e.g., no impunity for core crimes). 
  2. **Clarify key distinctions** (amnesty vs. pardon vs. non-prosecution), stressing that "who grants amnesty" matters when the state is both perpetrator and grantor. 
  3. **List hard constraints** (victims’ remedy, no crime-laundering, conflict recurrence risks, anti-impunity trends), flagging where ideals clash (e.g., victims’ acceptance vs. perpetrators’ credibility). 
  4. **Analyze the three models** against these criteria, neutrally—since they’ll "score" later. 

  Biggest challenge: balancing victims’ rights with stability. The user knows these can conflict, so I’ll highlight that tension without prescribing solutions. Also, I’ll note where "requirements" might be ideological (e.g., assuming amnesties always cause/deter conflict). 

  On models: 
  - **Trade model** (SA): Strong on truth/victim agency but weak on perpetrator guarantees if confessions are denied. 
  - **Sovereign closure** (Argentina): Prioritizes stability but violates victim remedy and anti-impunity norms. 
  - **Plea-bargain** (Rwanda): Pragmatic for scale but risks coercing confessions and blurring lines between amnesty/sentence reduction. 

  Finally, I’ll keep it concise—they want tools, not lectures.
answer: |-
  Here are the core desiderata for evaluating amnesty justifications in transitional contexts, grounded in the tensions you've identified. Key conflicts are flagged, and the three models are assessed against the criteria.

  **I. Desiderata: What an Adequate Justification MUST Deliver**

  1.  **Handle Core Case Types:**
      *   *Must Handle:* Conditionally individualized amnesty (SA), blanket legislative amnesty (Argentina), sentence-reduction schemes (Rwanda), post-conviction pardons, and crucially, *self-amnesty by outgoing regimes*. (Case: Transitions vary from negotiated (SA) to collapse (Argentina) to victor's justice; justification must cover the spectrum).
      *   *Non-Negotiable:* Must explicitly address self-amnesty (often deemed illegitimate) and conditional models.
      *   *Potential Prejudice:* Dismissing *all* blanket amnesties as inherently illegitimate ignores contexts of extreme fragility.

  2.  **Respect Foundational Distinctions:**
      *   *Must Distinguish:* Amnesty (pre-conviction legal barrier), Pardon (post-conviction executive mercy), Non-Prosecution (discretionary/strategic), Lustration (administrative vetting). (Case: Confusion launders impunity or creates false expectations; e.g., calling non-prosecution "amnesty" misrepresents finality).
      *   *Must Address:* "Who grants amnesty?" when the state is both perpetrator and grantor. (Case: Self-amnesty vs. new democratic legislature vs. TRC – legitimacy varies wildly). This distinction is **non-negotiable** for assessing legitimacy.
      *   *Potential Prejudice:* Insisting only courts or TRCs can grant "true" amnesty ignores sovereign legislative power in transitions.

  3.  **Adhere to Critical Constraints:**
      *   **Victim Entitlement to a Remedy:** (Non-Negotiable under IHRL). Justification must explain how amnesty provides *or is compatible with* alternative forms of justice/remedy (truth, reparations, symbolic justice, guarantees of non-recurrence). Case: Victims are rights-holders; ignoring them fuels resentment and delegitimizes the new state.
      *   **State Interest Against Crime Laundering:** (Non-Negotiable). Justification cannot treat amnesty as merely "turning the page"; it must actively distinguish itself from denying/obscuring crimes. Case: Blanket amnesties often facilitate denialism, harming societal reconciliation and rule-of-law foundations.
      *   **Empirical Complexity of Conflict Recurrence:** Amnesty must acknowledge that it *may* facilitate stability *or* fuel resentment leading to future conflict, depending on design/context. Case: Evidence is mixed (e.g., SA stability vs. Central American backsliding); justification cannot simplistically claim it "prevents war" or "always causes resentment". This is a **hard constraint** requiring honesty.
      *   **International Law Anti-Impunity Trend:** (Non-Negotiable Core). Justification cannot validate amnesty for genocide, crimes against humanity, war crimes, torture, enforced disappearance. Case: ICC Statute, Jus Cogens norms, evolving CIL. Blanket amnesties for these are increasingly indefensible. Distinction for lower-level offenders or specific modalities (sentence reduction) is crucial.

  **II. Flagged Conflicts & Tensions**

  *   **Red Flag: Joint Unsatisfiability?** "**Victim Acceptance as Remedy**" vs. "**Credibility as Perpetrator Guarantee**" is the *core tension*. Highly victim-centric processes (demanding full disclosure, shame, reparations) may deter perpetrator participation needed for stability/truth. Guarantees strong enough to entice powerful perpetrators (e.g., blanket, unconditional) often violate victim remedy and anti-laundering constraints. *No model perfectly resolves this.*
  *   **Tension:** "**Preventing Conflict Recurrence**" (often requiring perpetrator buy-in via strong guarantees) vs. "**Anti-Impunity Constraint**" vs. "**Victim Remedy**". Prioritizing one often compromises another.
  *   **Potential Prejudice:** Asserting that *only* individualized, conditional amnesty is legitimate is a normative preference (often SA-model aligned), not an absolute requirement, especially where capacity is nil or threat is extreme. Conversely, dismissing victim voices as an obstacle to "pragmatic" stability is often perpetrator-leaning prejudice.

  **III. Model Assessment Against Desiderata**

  1.  **Trade Model (SA - Truth for Amnesty):**
      *   Excels on Victim Remedy (agency, truth as remedy), strongly counters Crime Laundering (truth exposure), respects Amnesty/Pardon distinction (conditional legal barrier). Handles conditional amnesty well. Struggles with Perpetrator Credibility if confessions are denied (no guarantee), Perpetrator Buy-In for high-levels (limited prosecutorial threat), and Blanket/Self-Amnesty cases (antithetical). Meets Anti-Impunity only by excluding core crimes *from amnesty eligibility* (prosecution still intended). Victim Acceptance varies (trading truth for freedom is divisive).

  2.  **Sovereign-Closure Model (Argentina - Laws of Oblivion):**
      *   Prioritizes Perpetrator Credibility/Stability & Conflict Prevention (clear finality). Handles Blanket Amnesty. Fails catastrophically on Victim Remedy ("closure" imposed, no truth/reparations), Crime Laundering (actively promoted denial), and Anti-Impunity (covered core crimes). Ignores "Who Grants?" problem (tainted legislature). Non-Prosecution is inherent, not distinguished. Victim Acceptance is low, fueling later challenges.

  3.  **Plea-Bargain Model (Rwanda - Confession for Sentence Reduction):**
      *   Pragmatic on Scale/Resources & Conflict Prevention (incentivizes participation, manages caseload). Handles Sentence Reduction schemes. Provides a partial Victim Remedy (truth, some punishment). Respects Pardon distinction (reduction, not immunity). Challenges: Blurs Amnesty/Non-Prosecution lines; risks coercive confessions (undermining remedy); struggles with Perpetrator Credibility if reductions are minimal; less effective for high-level architects; Crime Laundering risk if confessions are superficial/ritualistic; Victim Acceptance mixed (some punishment vs. perceived leniency). Meets Anti-Impunity technically (conviction precedes reduction).

  **Summary for Your Scoring:** Focus on how each model navigates the Victim Remedy / Perpetrator Guarantee tension, its stance on core crimes (Anti-Impunity), its handling of legitimacy ("Who Grants?", Crime Laundering), and its compatibility with different transition scenarios (negotiated vs. collapse, high vs. low threat). The inherent friction points are clear.
