  My brother-in-law ends every argument about the NHS with 'taxation is theft', full stop, as if that settles whether he should pay income tax at all. It clearly means different things each time he says it, and I want to actually pin it down rather than just bristle. Can you lay out the distinct precise claims the slogan could be making -- e.g. a purely legal claim (which looks false, since theft is defined by law and tax is lawful), a claim about rights (taking property without consent violates rights even when it's legal), a claim about moral parity with robbery (the state gets no special permission that a mugger lacks), or something stronger about who legitimately owns pre-tax income in the first place ('your gross salary is really yours' versus 'the state has a claim on it before you ever see it'). For each reading, say whether it's trivially true, defensible but contested, or straightforwardly false, and crucially which of them, if any, actually supports refusing to pay tax rather than just grumbling about rates. Please also flag clearly which points are pretty much settled among political philosophers and which are genuinely contested -- I don't want to be told a live debate is a consensus in either direction. A menu I can literally read back to him over Christmas dinner would be perfect.
