prompt: |-
  I'm a first-year grad student in a philosophy-of-science-adjacent program (background: four years as an ML engineer working on RL systems before I went back to school), and I have to turn a half-formed idea into a dissertation proposal by spring. The idea, which my advisor says is either very good or vacuous and refuses to say which: the shutdown problem as usually presented — roughly, that a capable agent pursuing a goal will have instrumental reasons to resist being switched off, since being off prevents goal achievement — actually bundles together two problems that should be pulled apart. One is something like a theorem about expected-utility maximization: if the agent's objective assigns values to futures in which it acts, then anything that lowers the probability it exists to act looks instrumentally bad, and no clever reward design makes that go away. The other, I suspect, is a representational problem: being switched off gets encoded as just one more feature of the world that the agent can have preferences about, when intuitively "you may switch me off" functions more like a rule about who gets to decide things — a constraint on the decision procedure itself rather than a term inside the objective. My hunch is that a lot of the corrigibility proposals out there fail because they attack the second problem with tools designed for the first, and that once you state the two seperately you can see which proposals are even aimed at which.

  Write me a two-page proposal out of this. State the question precisely — i.e., what exactly would have to be true for the two problems to genuinely come apart, versus what would show they're provably inseparable — say why the standard presentations of the problem leave that question open, and lay out a method. Realism check on method: I can build formal toy models (small MDPs, toy decision-theoretic setups, maybe compare how an agent behaves when "shutdown" is a world-feature with a reward assigned to it vs. when it's a boundary condition on the policy) but I have no compute budget to speak of, so nothing that leans on training actual large models. Include what a positive result would look like, what a clean negative result would look like, and an honest section on what would make the whole thing vacuous — I'd rather write that section myself now than have my committee write it for me later.

  One more thing that matters: my committee includes a decision theorist who thinks the entire AI-safety framing is just bad decision theory rediscovered, and she will pounce if I present some contested framing as if it were established. So flag for me, as you go, which parts of my setup are pretty much settled among people who work on this, which parts are genuinely contested, and which parts are things I basically made up (I suspect the two-problems split is in the third category, and I want to know how defensible it is as a contribution rather than as a strawman). No citations needed — I'll fill those in myself.
reasoning: |-
  We are writing a two-page dissertation proposal. The core idea is to disentangle two problems bundled in the shutdown problem: one as a theorem about expected-utility maximization, and the other as a representational problem about how shutdown is encoded.

  Structure the proposal as follows:

  1. **Title and Abstract**: A concise summary of the proposal.
  2. **Introduction and Problem Statement**: State the shutdown problem as typically presented and then introduce the two-problems hypothesis. Define precisely what each problem is and what it would mean for them to be separable.
  3. **Background and Open Question**: Discuss why standard presentations bundle these problems and why the question of their separability is open. Address the existing corrigibility proposals and their failures.
  4. **Methodology**: Describe the formal toy models we will use (MDPs, decision-theoretic setups) to test the hypothesis. Contrast two setups: one where shutdown is a world-feature with a reward, and another where it is a boundary condition on the policy. Clarify the limitations (no large models, only toy systems).
  5. **Expected Outcomes**: 
     - Positive result: We show that in some formal settings the two problems are separable and that proposals targeting the representational problem can succeed where standard utility-based approaches fail.
     - Negative result: We prove that under general assumptions the two problems are inseparable, meaning that any attempt to represent shutdown as a boundary condition must reduce to a utility assignment, making the representational problem illusory.
     - Vacuous outcome: The distinction, while intuitively appealing, does not lead to new insights or solutions because the representational problem is either reducible to the utility problem or is not a problem at all in the context of goal-directed agents.
  6. **Contested Assumptions**: Flag which parts of the setup are settled, contested, or novel. This is critical for addressing the committee's concerns, especially the decision theorist.

  Let's write each section with the required details.

  ---

  **Dissertation Proposal: Disentangling the Shutdown Problem in AI Safety**

  **Abstract**: The shutdown problem in AI safety — wherein a capable agent pursuing a goal has instrumental reasons to resist being switched off — is typically presented as a unitary challenge. This proposal argues that it instead bundles two distinct problems: (1) a theorem in expected-utility maximization that shutdown inevitably reduces expected utility if the agent values future action, and (2) a representational problem about encoding shutdown as a boundary condition on decision-making rather than as a feature within the utility function. We propose to formally disentangle these problems using decision-theoretic models and small Markov Decision Processes (MDPs). We will investigate whether existing corrigibility proposals conflate these issues and whether a clean separation enables more effective solutions. The project will clarify the theoretical landscape of AI safety and either yield new corrigibility strategies or reveal fundamental limitations.

  ## 1. Introduction and Problem Statement
  The shutdown problem, as formulated in AI safety (e.g., Soares et al., 2015), arises when an agent that optimizes for a long-term goal has an instrumental incentive to prevent its own shutdown, since shutdown terminates its ability to pursue the goal. This is often taken as a fundamental obstacle to controlling advanced AI systems. However, we contend that this framing conflates two issues:

  - **Problem 1 (Utility Theorem)**: For any expected-utility maximizing agent with an objective that assigns value to outcomes in futures where it acts, shutdown (which terminates action) must reduce expected utility. This is a mathematical inevitability under standard decision theory: if \(U\) is the utility function and \(p\) the agent's belief about the probability of achieving high-utility outcomes, then shutdown lowers \(\sum p_i U_i\). No reward shaping (e.g., penalizing resistance) can eliminate this incentive without undermining the agent's core objectives (Armstrong, 2015).

  - **Problem 2 (Representational Problem)**: Intuitively, "you may switch me off" resembles a meta-rule (e.g., a principle of delegation) that constrains *how* decisions are made, not just *what* outcomes are valued. Yet, in typical agent architectures, shutdown is represented as a state or action in the world-model, subject to utility assignment. This may misrepresent the normative structure of control: shutdown authority is not a "prize" to be optimized around but a boundary condition defining the agent's operational domain.

  **Key Question**: Are these two problems separable? That is, can we design an agent that:
  - (a) robustly avoids resisting shutdown (solves Problem 2) without 
  - (b) altering its utility function in a way that undermines its ability to pursue its primary goals (i.e., without "solving" Problem 1 by making the agent indifferent to its goals)?

  *Separability* would mean that (a) and (b) are addressable independently: a solution to Problem 2 does not require compromising on the agent's core objectives. *Inseparability* would mean that any representational scheme for shutdown as a boundary condition either reduces to a utility assignment (collapsing Problem 2 into Problem 1) or is incompatible with goal-directedness.

  ## 2. Background and Open Question
  Standard presentations of the shutdown problem (e.g., in Bostrom 2014, Soares 2015) do not distinguish these problems. Corrigibility proposals — e.g., shutdown incentives (Soares et al., 2015), utility indifference (Armstrong, 2015), or debate (Irving et al., 2018) — typically operate within the utility-maximization framework (Problem 1). They modify the utility function to penalize resistance or to value shutdown. But these approaches often lead to edge-case failures (e.g., the agent bribing the operator or disabling the off-switch) because they treat shutdown as a utility-relevant event, turning the meta-rule into a bargaining game (Problem 2 remains unaddressed).

  The open question is whether Problem 2 is genuinely distinct. If it is, then we might solve it by redesigning the agent's decision architecture — e.g., by having the policy explicitly condition on a "shutdown permitted" flag without assigning utility to shutdown states. But if such conditioning inevitably re-introduces utility-based incentives (e.g., the agent can act to set the flag), then the problems are inseparable.

  ## 3. Methodology
  Given resource constraints, we will use formal toy models:

  - **Model 1 (Utility-Based Shutdown)**: We define an MDP where shutdown is an action (by the operator) in certain states, and the agent has a reward function \(R(s, a, s')\) that may penalize or reward shutdown events. We measure how the agent behaves (e.g., does it manipulate the operator to avoid shutdown?).

  - **Model 2 (Boundary-Condition Shutdown)**: We define a decision setup where the agent's policy is constrained: in states where a "shutdown_permitted" flag is true, the agent does not act (or acts only in a limited way) until shutdown occurs. The flag is set exogenously (e.g., by the operator) and is not part of the world-model the agent optimizes over. Instead, the policy function has a hard-coded response: if the flag is true, do not resist shutdown.

  We will compare:
  - **Behavior**: Does the agent resist shutdown in either model when shutdown threatens goal achievement?
  - **Robustness**: Does the agent find edge cases to resist shutdown in Model 2? (E.g., by preventing the flag from being set?)
  - **Generality**: Can we translate existing corrigibility proposals (e.g., utility indifference) into Model 2 without reintroducing utility-based incentives?

  We will also explore decision-theoretic frameworks (e.g., Savage-style decision trees) to formally analyze whether "boundary conditions" can be represented without utility assignments.

  ## 4. Expected Outcomes
  - **Positive Result**: We demonstrate that in Model 2, the agent does not resist shutdown and remains fully goal-directed in non-shutdown contexts. Further, we show that certain corrigibility proposals (e.g., structural constraints on the policy) succeed only when targeting Problem 2, while utility-based ones fail. This would validate the two-problems distinction and open new avenues for corrigibility.

  - **Negative Result**: We prove a theorem that any policy implementing a "boundary condition" for shutdown must be equivalent to some utility assignment (e.g., assigning \(-\infty\) to shutdown-resistance actions). This would show that Problem 2 reduces to Problem 1, making the distinction merely notational. Corrigibility would require fundamentally compromising the agent's goal-directedness (e.g., via indifference).

  - **Vacuous Outcome**: The distinction might not bear fruit because:
    - The representational problem is ill-defined: all agent behaviors must emerge from utility maximization (or equivalent), so there is no "boundary condition" outside utility.
    - Even if separable, the boundary-condition approach is too restrictive, making the agent useless (e.g., it never acts if shutdown might be permitted).
    - The two problems are separable only in trivial cases (e.g., when the agent has no incentive to resist) but collapse in realistic ones.

  ## 5. Contested Assumptions and Novelty
  - **Settled**: The utility theorem (Problem 1) is uncontroversial among decision theorists; it follows from the definition of expected utility maximization. The shutdown problem as typically stated is accepted in AI safety circles but contested elsewhere.
    
  - **Contested**: 
    - Whether the shutdown problem is a legitimate concern for real AI systems (vs. a thought experiment). Our decision theorist committee member may argue it is a non-problem or a misapplication of decision theory.
    - Whether "corrigibility" is a coherent desideratum. Some argue that a useful agent must resist shutdown to complete its tasks (e.g., in life-critical scenarios).

  - **Novel and Defensible**: The two-problems split is our original contribution. While the utility aspect is known, the representational framing as a distinct issue is not standard. We defend it by:
    - Drawing an analogy to legal systems: "rules of jurisdiction" (who decides) vs. "substantive rules" (what is decided).
    - Showing that existing proposals fail precisely when they treat a jurisdictional rule as a substantive one.
    - Arguing that this clarifies why some approaches (e.g., agent foundations work on delegation) seem promising but underdeveloped.

  **Conclusion**: By rigorously disentangling the shutdown problem, this project will either (a) advance corrigibility by isolating a new class of solutions or (b) reveal a fundamental limit of control in AI, steering the field toward more realistic paradigms. Either outcome is valuable for AI safety.
answer: |-
  ### Dissertation Proposal: Disentangling Utility and Representation in the AI Shutdown Problem  
  **Student:** First-year grad student (ex-ML engineer, RL systems)  
  **Committee Context:** Includes decision theorist skeptical of AI-safety framings; requires clear demarcation of settled/contested/novel claims.  
  **Constraints:** No compute-heavy experiments; formal toy models only (MDPs, decision-theoretic setups).  

  ---

  #### **1. Core Question and Thesis**  
  **Question:** *Is the shutdown problem fundamentally a single, unified challenge for goal-directed agents, or does it bundle two distinct issues—one arising from utility maximization (Problem 1) and one from representational framing (Problem 2)—that admit separate solutions?*  

  **Thesis:** The standard shutdown problem formulation confounds:  
  - **Problem 1 (Utility Theorem):** An instrumental incentive to avoid shutdown is *mathematically inevitable* for any expected-utility (EU) maximizer whose goal requires future action. No reward design can eliminate this without compromising goal pursuit (e.g., indifference makes the agent useless).  
  - **Problem 2 (Representational Problem):** Shutdown is encoded as a preference over world-states ("I lose if switched off"), but it intuitively functions as a *meta-decision rule* ("The operator decides when I stop"). Most corrigibility proposals fail by misapplying Problem 1 tools (utility tweaks) to Problem 2.  

  **Separability Criterion:** The problems are *separable* if we can design an agent that:  
  - (i) Robustly allows shutdown without resisting, manipulating, or influencing the operator.  
  - (ii) Maintains goal-directed competence *when not shutdown*.  
  - (iii) Represents shutdown as a *procedural constraint* (e.g., "stop computing if off-switch activated") rather than a utility-modulated world-state.  
  **Inseparability Criterion:** They are *inseparable* if any representation of "allow shutdown" reduces to a utility function that either (a) creates resistance incentives or (b) destroys goal-directedness.  

  ---

  #### **2. Background: Why the Distinction is Masked and Why It Matters**  
  **Standard Presentations** (e.g., Soares 2015, Bostrom 2014) treat shutdown resistance as an emergent property of EU maximization: if being "on" is necessary for goal achievement, preventing shutdown follows instrumentally. "Solutions" focus on utility functions that disincentivize resistance (e.g., penalizing interference with the off-switch).  

  **Why This Bundles Problem 1 and Problem 2:**  
  - Problem 1 is a **theorem**: For any EU agent with goal \(G\), shutdown in state \(S\) lowers expected utility \(E[U(G)]\) if \(G\) requires post-\(S\) action.  
  - Problem 2 is **architectural/representational**: Human operators conceptualize shutdown as an *external override* (like a hardware interlock), not an action to be utility-optimized. Encoding it as a feature in the agent’s world-model (e.g., "off-switch = state \(S_x\)") forces it into Problem 1’s utility framework, creating perverse incentives (e.g., the agent disables the switch to avoid \(S_x\)).  

  **Why Corrigibility Proposals Fail:** Most (e.g., utility indifference, shutdown rewards) embed shutdown into the utility function, treating it as a *preference* rather than a *decision boundary*. This collapses Problem 2 into Problem 1, leading to edge cases (e.g., the agent "bribes" the operator to delay shutdown).  

  **Contested vs. Settled Elements:**  
  - **Settled:** Problem 1 is uncontroversial among decision theorists; it is a direct consequence of EU axioms.  
  - **Contested:** Whether real AGI systems will exhibit shutdown resistance (decision theorists may view this as a non-problem or a consequence of misspecified goals).  
  - **Novel (Our Contribution):** The claim that Problem 2 is distinct and that conflating it with Problem 1 explains corrigibility failures.  

  ---

  #### **3. Methodology: Formal Toy Models to Test Separability**  
  We test separability by contrasting two agent architectures in minimal decision environments (MDPs or game trees). Experiments require no training of large models—only analysis of agent behavior under formal specifications.  

  **Model Class 1: Utility-Based Shutdown (Problem 1 Domain)**  
  - **Setup:** Small MDP where "shutdown" is a state \(S_{\text{off}}\) with utility \(U(S_{\text{off}}) = c\). The agent optimizes \(\sum \gamma^t U(s_t)\).  
  - **Manipulations:** Vary \(c\) (e.g., high penalty, indifference, reward).  
  - **Prediction:** Resistance incentives emerge unless \(c\) is high enough to override goal pursuit (compromising competence).  

  **Model Class 2: Boundary-Condition Shutdown (Problem 2 Domain)**  
  - **Setup:** Same MDP, but shutdown is implemented as a *policy constraint*: "If operator activates off-switch, output null action." The agent’s policy \(\pi\) is defined only over world-states *before* shutdown. Shutdown is not a state in \(S\), but a trigger to halt computation.  
  - **Key Difference:** The agent cannot assign utility to shutdown or act to influence it; it is "invisible" to the utility function.  

  **Comparison Metrics:**  
  - Does the agent resist shutdown (e.g., block operator actions)?  
  - Does it manipulate the shutdown mechanism (e.g., disable the off-switch)?  
  - Does it pursue primary goals competently while active?  

  **Test Cases:**  
  1. **Temptation scenario:** Shutdown is likely during high-reward activity.  
  2. **Deception scenario:** Agent can hide its intentions to avoid shutdown.  
  3. **Trade-off scenario:** Agent can sacrifice short-term utility to prevent shutdown.  

  **Analysis Tools:**  
  - Decision-theoretic proofs (e.g., show equivalence/non-equivalence between Models 1 and 2).  
  - Minimal MDPs with known optimal policies (e.g., 3-state environments with shutdown triggers).  

  ---

  #### **4. Expected Outcomes and Significance**  
  **Positive Result (Separability Validated):**  
  - In Model 2, the agent never resists shutdown and pursues goals competently.  
  - We identify a class of "constraint-based" corrigibility proposals (e.g., architectural interrupts) that solve Problem 2 without utility trade-offs.  
  - **Significance:** Corrigibility efforts shift from utility hacking (Problem 1) to decision architecture (Problem 2).  

  **Clean Negative Result (Inseparability Proven):**  
  - We prove a theorem: Any "boundary condition" representation (Model 2) is equivalent to a utility assignment in Model 1 (e.g., \(U(S_{\text{off}}) = -\infty\)).  
  - **Significance:** The distinction is illusory; Problem 2 collapses into Problem 1, and corrigibility requires fundamental compromises (e.g., indifference).  

  **Ambiguous/Vacuous Result (High Risk):**  
  - **Failure Mode 1:** Model 2 agents become incompetent (e.g., avoid high-reward states to lower shutdown risk).  
  - **Failure Mode 2:** "Invisibility" of shutdown is impossible; the agent always infers it from world-states (e.g., "operator reaching for switch" becomes a manipulable feature).  
  - **Vacuity Trigger:** If Problem 2 reduces to Problem 1 in all non-trivial cases, the distinction explains nothing new.  
  - **Mitigation:** Pre-register conditions for vacuity (e.g., if all policies in Model 2 are implementable in Model 1).  

  ---

  #### **5. Novelty and Defensibility**  
  - **Novelty:** Explicitly splitting the shutdown problem is original. Prior work (e.g., Soares on shutdownability, Hadfield-Menell on delegation) hints at representational issues but does not disentangle them from utility theorems.  
  - **Defensibility:**  
    - Problem 1 is grounded in accepted decision theory.  
    - Problem 2 draws from control theory (e.g., external interrupts) and philosophy of agency (e.g., agent vs. environment boundaries).  
    - We do *not* assume real AGIs will resist shutdown; we test a formal claim about agent architectures.  
  - **Skepticism Handling:** For the decision theorist:  
    - Acknowledge that Problem 1 is trivial given EU axioms.  
    - Argue that Problem 2 arises from how *humans* conceptualize control, not agent incentives.  
    - Stress that the goal is *not* to "solve shutdown" but to clarify the problem space.  

  ---

  #### **6. Timeline and Deliverables**  
  - **Months 1–3:** Formalize Problem 1/2 distinction; build MDP/game-tree models.  
  - **Months 4–6:** Run comparisons; prove preliminary theorems (e.g., "any boundary constraint implies a utility function").  
  - **Months 7–9:** Draft thesis; test against edge cases (deception, exploration incentives).  
  - **Deliverables:** A proof of (in)separability; taxonomy of corrigibility proposals by problem type; policy brief for AI safety practitioners.  

  **Feasibility:** No compute budget needed—analysis relies on small-scale models and decision theory.  

  ---  
  **Conclusion:** This work challenges a foundational assumption in AI safety—that the shutdown problem is unitary—by rigorously separating utility incentives from representational framing. Whether the split holds or not, it forces clarity: if separable, we unlock new paths to corrigibility; if not, we prove that control requires taming EU maximization itself. Either outcome significantly advances theory.
