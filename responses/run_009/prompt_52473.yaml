prompt: |-
  Been keeping a list of little cases about when you cause something by NOT doing something, becuase I want to figure out if there's a principle behind my gut verdicts, and honestly right now I don't think there is one.

  The list:

  1. You ask me to water your plants while you're away, I say yes, I forget, they die. I caused them to die. Obviously.
  2. Your other neighbor, who you never asked, didn't water them either, and easily could have. He didn't cause anything. Kind of a jerk move to just watch them die, but not a cause.
  3. Now the awkward one: you asked BOTH of us, and either of us alone would've been enough. We both forget. Both causes? Half-causes each? Neither?? I want to say both, but I can't explain how that doesn't add up to two full causes.
  4. A lifeguard on duty doesn't notice a swimmer drowning: caused. A random beachgoer who could've swum out but didn't: not caused. And note the counterfactuals are identical — had either acted, he'd have lived.
  5. Same setup as 4, but the beachgoer is literally the only other person on the beach, it's shallow water he could've just waded into, and he didn't feel like it. I flip-flop on this constantly. "Let it happen" feels right, but "he caused it" keeps sneaking back in.
  6. My grandfather "could have" watered the plants except he's been dead for ten years. Obviously not a cause — but again, counterfactual-wise nothing changes, had he watered them they'd live. So whatever rule kills this case has to be about more than the counterfactual.
  7. I tell a third neighbor "don't bother, I've got it covered," she stays home because of that, and then I forget too. Feels different from case 1 — like I caused the death twice over, once by talking her out of it and once by forgetting. Is that two causes, one by commission one by omission, or just one messy cause?
  8. Every person on earth "could have" watered your plants if they'd known and walked by. None of them are causes. So the cutoff is somewhere between "the one person you asked" and "everyone," and I can't locate it.

  My tentative principle was something like: an omission only causes when the omitter had a duty (promised, on the job, etc.), and only duty-bearers are even candidates for causehood. But that forces case 5 to come out "not caused" no matter how lazy the beachgoer was, which I'm not sure I can live with, and it's silent on case 3.

  So: is there a principle that gets all of these, or close? What does it say about case 5, the one I keep going back and forth on? What would it predict for cases I haven't listed — say, a doctor who's the only one who could treat a patient but is off duty at a different hospital across town, or a security guard whose whole job is watching one door, who steps out for a smoke right when someone walks through it? And be honest: which of my verdicts does the best principle just have to overturn?
reasoning: |-
  Okay, let me try to figure this out. The user has a bunch of cases where not doing something might cause harm, but it's tricky to find a consistent principle. They listed eight scenarios and their gut feelings about each. Their tentative idea about duty doesn't cover everything, especially case 5 with the lazy beachgoer.

  First, I need to understand each case. Cases 1 and 2 are straightforward: promising creates duty, so omission causes harm. No duty, no cause. Case 3 is tricky—both promised but forgot. Intuition says both caused it, but how? Overdetermination? Each omission was sufficient? That might lead to double-counting. Maybe both are causes because each had a duty and their inaction was necessary in the context of the other's inaction. That makes sense.

  Case 4: lifeguard has duty, bystander doesn't. Counterfactuals same, but duty matters. Case 5 is the tough one. Only one bystander who could easily help. User flip-flops. Duty principle says no cause, but intuition sometimes says yes. Maybe adding a "salient capacity" factor? If someone is uniquely positioned and aware, their omission might be causal. But that's fuzzy. Or perhaps moral responsibility vs. causation. The user wants causation, not morality. Need to separate them.

  Case 6: dead grandfather isn't a cause. The "could have" requires actual possibility. So physical or practical possibility matters. Case 7: the person caused harm by commission (dissuading) and omission (forgetting). Two distinct actions, both causal. Case 8: everyone could help but no duty, so no cause. Cutoff is duty plus something else? Salience? Specific obligation?

  The user's duty principle works for most cases but fails case 5. They're uncomfortable with that. Maybe adding a "salient capacity" when no one else is available. But that's not consistent. Or perhaps in case 5, the bystander isn't a cause because they had no obligation. But the user's intuition conflicts. Maybe the best principle sticks to duty and accepts that case 5 isn't causation, just moral failing. But the user might not like that.

  Other cases: off-duty doctor isn't a cause, security guard is. Duty in role and context. The guard is on duty, so omission causes harm. Doctor isn't, so no cause. 

  So the refined principle: causation by omission requires a duty (contractual, role-based, etc.) and the omission must be necessary in the circumstances (no one else stepped in). This handles cases 1-4, 6-8. Case 3: both had duty and each omission was necessary because the other didn't act. So both are causes. Case 5: no duty, so no cause. But user struggles with this. Maybe they need to accept that causation isn't the same as moral responsibility. The beachgoer is morally blameworthy but didn't cause the death. The principle might have to overturn the user's occasional intuition in case 5. 

  Also, in case 7, both actions (dissuading and forgetting) are causes. The dissuading is a commission, so direct cause. Forgetting is omission with duty. Two separate causal factors. 

  So the best principle is duty + necessity. For case 5, hold that the bystander didn't cause it, even if it feels wrong. Explain that causation is about specific obligations, not mere ability. Moral judgment is separate. That might resolve the conflict.
answer: |-
  This is a beautifully thorny problem in causation, moral responsibility, and counterfactual reasoning. You've hit on the core tension: identical counterfactuals ("if they had acted, the harm wouldn't have happened") lead to different causal intuitions based on context, duty, and salience. **There *is* a coherent principle, but it requires refining your "duty" idea and accepting that causation by omission is fundamentally different from causation by commission.** The principle also forces us to overturn one of your verdicts.

  **The Refined Principle: Causation by Omission Requires a *Specific Duty* AND *Salient Capacity***

  An omission causes harm **only if**:
  1.  **Specific Duty/Expectation:** The agent had a *specific*, contextually defined duty, role-based obligation, or commitment *directly relevant* to preventing *that specific harm* for *that specific victim* in *that specific situation*. (This includes promises, professional roles, contractual obligations, familial ties, or situations where one has uniquely created reliance).
  2.  **Salient Capacity:** The agent had the *actual and contextually salient capacity* to act effectively at the crucial time (physical ability, knowledge, proximity, resources), making their inaction a *relevant* factor *within the normal course of events*.

  **Why this works better than just "duty":**
  *   It excludes "could have" in a vacuum (Case 6: Dead grandfather lacks capacity; Case 8: Global population lacks specific duty).
  *   It handles the "cutoff" problem by focusing on specificity (Asked neighbor vs. whole world).
  *   It captures why the lifeguard (Case 4) is different from the random beachgoer (duty + role-specific capacity).
  *   It distinguishes between "kind of a jerk" (Case 2) and "cause" (Case 1).

  **Applying the Principle to Your Cases:**

  1.  **You Promised & Forgot:** YES, caused. (Duty: Specific promise. Capacity: Presumed).
  2.  **Unasked Neighbor Didn't Act:** NO, not a cause. (No specific duty owed *to you* re: *your plants*. Mere capacity isn't enough).
  3.  **Both Promised & Forgot:** **YES, BOTH caused it.** This is **overdetermination by omission**. Each had a specific duty *and* salient capacity. The harm occurred *because* A didn't act *and* B didn't act. The counterfactual holds for each individually ("If *I* had acted, it wouldn't have happened"). Their duties are independent. We don't need "half-causes"; each omission is a *full but insufficient necessary condition* within the context of the other's omission. The harm counterfactually depends on *each* omission given the circumstances (the other also omitting).
  4.  **Lifeguard Omitted / Beachgoer Didn't Act:** Lifeguard YES (Duty: Role. Capacity: Presumed). Beachgoer NO (No specific duty. Mere capacity isn't enough).
  5.  **Sole Lazy Beachgoer Didn't Act:** **NO, not a cause.** (This is where the principle forces us to **overturn your "let it happen" verdict**). He had salient capacity (unique, proximate, easy action) but *no specific duty*. His inaction is morally reprehensible, perhaps criminally negligent (depending on jurisdiction/laws about duty to rescue), but under the principle above, it is **not causation**. The harm was caused by the drowning/swimmer's condition/the ocean, not *by* his omission. He *allowed* it, he *failed to prevent* it, but he didn't *cause* it. The counterfactual difference ("if he acted, it wouldn't have happened") is necessary but not sufficient for causal attribution; the *lack of duty* breaks the causal chain for omission. (This aligns with legal/philosophical distinctions between causing harm and failing to prevent it).
  6.  **Dead Grandfather:** NO, not a cause. (Lacks capacity - impossible to act).
  7.  **You Talked Neighbor Out & Forgot:** **TWO distinct causal factors:**
      *   **Commission:** You *caused* the neighbor's inaction by your assurance (a positive act). This made you the sole relied-upon agent.
      *   **Omission:** You then *caused* the death by failing your duty (which you created for yourself via the commission). It's not "twice over" for the *same* causal link; it's two sequential links in the causal chain leading to the harm. The commission created the context making your omission causal.
  8.  **Every Person on Earth:** NO, not causes. (Lacks specific duty).

  **Predictions for Your New Cases:**

  *   **Off-Duty Doctor Across Town:** NO, not a cause. (Specific duty? Arguable *general* professional duty, but lacks **salient capacity** - not proximate, not "on call" for *that* patient at *that* time, likely unaware. Also, not the *specific* doctor relied upon).
  *   **Security Guard Steps Out for Smoke:** YES, caused (by omission). (Specific duty: Role-defined obligation *for that specific door*. Salient capacity: He *would* have had it if present; his absence *is* the omission fulfilling the duty. His action (leaving) created the condition for his omission (not watching) to be causal).

  **Why This Principle Makes Sense & What It Overturns:**

  1.  **Distinguishes "Cause" from "Moral Blame/Failure":** The principle cleanly separates causal responsibility (did this inaction *make it happen*?) from moral/legal responsibility (should this person be blamed/punished for *letting it happen*?). Case 5 is the prime example – the beachgoer is morally (and potentially legally) responsible, but his inaction didn't *cause* the death. The ocean/drowning did. He failed to interrupt the existing causal chain.
  2.  **Handles Overdetermination (Case 3):** It explains why both promisers are causes – each had an independent, specific duty. The harm counterfactually depends on *each* omission *in the context where the other also omitted*. If only one had promised, that one omission would be causal. Adding a second promise adds a second potential cause, not half a cause.
  3.  **Rejects Pure Counterfactualism (Cases 2, 5, 6, 8):** It explicitly rejects the idea that *any* counterfactual difference-maker is a cause. Specific duty and salient capacity provide the necessary constraints.
  4.  **The Overturned Verdict:** This principle **forces us to say the sole lazy beachgoer (Case 5) did NOT cause the death**, even though it feels intuitively strong. This is the price of coherence. We must recognize that our intuition there is conflating causation with moral outrage and the starkness of the situation. Philosophically and legally (in most common-law jurisdictions without a broad duty to rescue), causation is denied precisely to maintain this distinction and avoid absurdities like Case 8.

  **In summary:** Causation by omission arises only when there's a **specific, contextually defined duty** owed *to the victim* regarding *that harm*, combined with **actual, salient capacity** to act effectively at the time. This principle resolves your cases coherently (including the awkward Case 3), predicts the new ones, and requires accepting that the sole lazy beachgoer, while monstrously blameworthy, did not *cause* the death he could have easily prevented. The cause remains the drowning itself. His sin is one of omission, not commission.
