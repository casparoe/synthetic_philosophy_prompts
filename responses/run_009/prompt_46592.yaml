prompt: |-
  i'm one of the two student reps on the editorial board of our high school paper, and we've got a decision to make at thursday's meeting that I need a written opinion for. A sophomore wrote an opinion piece arguing that religious kids shouldn't feel like the evolution unit in bio is an attack on their faith. Her whole argument is basically Galileo: she talks about his 1615 letter to the Grand Duchess Christina, where he argued that when established science and a literal reading of scripture conflict, you should read scripture non-literally, and she describes the famous line he borrowed from Cardinal Baronius about the Bible telling us how to go to heaven, not how the heavens go. But here's the part that's actually making people nervous: she says the lesson is NOT religion must always yield to science, but that Galileo's opponents were being pretty reasonable in 1615, since the evidence for the earth's motion wasn't airtight yet, and they only went wrong by refusing to update once it was — and she thinks thats exactly where anti-evolution parents are today, since the evidence has been in for basically a century. One of our school board members saw a draft and is pushing the principal to either spike the piece or run it with a disclaimer, because we had a really ugly creationism fight at this school like 8 years ago and nobody wants a repeat. So the board has to choose: run it as a regular opinion piece, run it paired with a counterpoint, run it with a disclaimer, or don't run it at all. Please draft the written opinion I'll circulate to the board before the meeting — it needs a clear recomendation and it has to take the principal's worry seriously, not just wave it off as cowardice.
