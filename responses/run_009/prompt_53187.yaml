prompt: |-
  I serve on the publication review board of a mid-sized AI research institute, and I've been asked to draft the memo recommending changes to our governance rules before our next quarterly meeting, so I'd like your help writing it. Some background: our current procedure is effectively a default-to-publish rule. Any of our roughly twenty research leads can green-light a paper from their own team after a lightweight review, and a paper is stopped only if someone actively intervenes — no formal vote, no quorum, nothing on the record. Over the past year, three papers that each faced substantial behind-the-scenes unease went out anyway, in one case a method that cut the compute needed for a fairly general agentic capability by a meaningful margin. In each case at least a third of the people who later said they were uncomfortable had assumed someone else would raise a formal objection. A colleague of mine keeps describing this as a straightforward instance of the unilateralist's curse: when several agents each act on their own noisy estimate of whether an action is net-positive, and any one of them can act unilaterally, the action gets taken whenever the single most optimistic estimate favors it, so error alone systematically selects for bad outcomes — no bad faith required.

  Our board is now considering three reform proposals, and my memo has to recommend one (or a package) with concrete procedural detail. Proposal A formalizes a principle of conformity: no lead may publish if they have reason to believe that a majority of equally informed colleagues would judge the expected value of publication to be negative, even where their own honest estimate is positive. Proposal B replaces default-publish with a board-wide supermajority vote (twelve of twenty in favor) for any paper flagged as capability-relevant under a written screening checklist. Proposal C is the most unusual: a rotating single-veto holder, selected by lot each quarter, whose objection unilaterally blocks flagged papers, paired with mandatory pre-publication disclosure to the whole board. There is also a faction arguing for no procedural change at all — just calibration training for leads and more informal discussion — on the theory that our real problem is noise, and the way to fix noise is to reduce it at the source rather than to redesign voting thresholds.

  Please draft the memo itself, roughly 800–1,200 words, addressed to the full board, with a clear and actionable bottom line. A few things I'd specifically like it to get right. First, it should be precise about what kind of problem the unilateralist's curse actually is — in particular, whether it is just a species of familiar collective-action failure or a selection effect on the maximum of noisy estimates, closer kin to the winner's curse in auctions — because that distinction bears on which reforms can help at all. Second, it should work through the mirror-image worry seriously: flipping the default from "publish unless stopped" to "stopped unless approved" may simply install the curse's pessimistic twin, in which a single noisy low estimate blocks good work, and the strongest opponents of reform in our ranks say exactly that. Third, our institute is fairly homogeneous — same subfield, same priors — so the memo should say something about whether the curse's implicit assumption of independent estimation errors does any work in our situation, and what follows if our reviewers' errors are strongly correlated. Finally, whatever you recommend, please treat the losing side's best argument honestly rather than as a box to be checked; the board will not thank me for a memo that reads like advocacy. You can give the memo any reasonable structure — recommendation, background, analysis of each proposal, likely objections — as long as a colleague could read it in ten minutes and know exactly what they are being asked to vote for and why.
reasoning: |-
  We are drafting a memo for the publication review board of an AI research institute. The memo must recommend a governance reform to address the unilateralist's curse as observed in their current default-to-publish system. The current system allows any research lead to green-light their team's paper after a lightweight review, and papers are only stopped by active intervention. This has led to papers being published despite substantial behind-the-scenes unease, with many assuming someone else would object.

  The memo must:
  - Clearly explain the unilateralist's curse as a selection effect on the maximum of noisy estimates (like the winner's curse in auctions), not just a collective-action failure.
  - Address the mirror-image worry: switching to a default-stopped system might introduce a pessimistic curse where one low estimate blocks good work.
  - Discuss the homogeneity of the institute and whether correlated errors affect the curse.
  - Analyze three proposals (A, B, C) and the status quo option (no procedural change, just training and discussion).
  - Make a clear recommendation with concrete procedural details.
  - Treat the losing side's best argument honestly.

  Structure:
  1. Introduction and background of the problem.
  2. Explanation of the unilateralist's curse and its relevance.
  3. Analysis of each proposal (A, B, C) and the status quo, including strengths, weaknesses, and how they address the curse and the mirror-image worry.
  4. Discussion of homogeneity and correlated errors.
  5. Recommendation and actionable bottom line.

  Let's outline the memo:

  **MEMO TO: Publication Review Board**
  **FROM: [Your Name], Board Member**
  **DATE: [Current Date]**
  **SUBJECT: Recommended Governance Reforms for Publication Review**

  **Introduction**
  Briefly describe the current system and the observed problem (three papers published despite unease, due to assumption others would object). State that the unilateralist's curse is the core problem and that we must reform to avoid systematic bias toward publishing potentially harmful work.

  **Understanding the Unilateralist's Curse**
  Explain that the curse is a selection effect: when any one actor can unilaterally cause an action (here, publishing), the action occurs if the most optimistic actor (even due to noise) favors it. This is not just collective action failure (which is about coordination) but a statistical phenomenon: the maximum of independent noisy estimates is biased upward. Compare to the winner's curse in auctions (winning bidder tends to overvalue the item). The key is independence of errors – if errors are correlated, the curse may be less severe, but still present if there's any independent variation.

  **The Mirror-Image Worry**
  Acknowledge that flipping to a default-stopped system (e.g., requiring approval) risks the pessimistic curse: the action is blocked if the most pessimistic actor (due to noise) opposes it. We must avoid both extremes.

  **Analysis of Proposals**

  - **Status Quo (No Procedural Change, Only Training and Discussion):** 
    Best argument: Addresses noise at the source by improving individual judgment and encouraging discussion, avoiding bureaucratic hurdles. 
    Weakness: May not solve the curse because even with better training, there will be noise, and the unilateralist structure remains. Also, informal discussion hasn't prevented the problem so far.

  - **Proposal A (Conformity Principle):** 
    Formal rule: No lead may publish if they believe a majority of equally informed colleagues would judge the expected value as negative. 
    Strengths: Directly addresses the curse by requiring the lead to consider collective judgment, not just their own. Avoids the pessimistic curse because it doesn't require active blocking. 
    Weaknesses: Relies on the lead's honest belief about others, which is subjective and hard to enforce. May lead to overcautious behavior if leads overestimate opposition.

  - **Proposal B (Supermajority Vote):** 
    For papers flagged as capability-relevant (using a checklist), requires 12 of 20 votes to publish. 
    Strengths: Formal, transparent, and shifts to a collective decision. The supermajority threshold (60%) is a balance to avoid both curses. 
    Weaknesses: Bureaucratic; may slow down publication. The mirror-image worry: a supermajority requirement might block papers that a simple majority would approve, but it's less extreme than a single veto.

  - **Proposal C (Rotating Single Veto Holder):** 
    Each quarter, one lead is randomly selected to hold a veto for flagged papers (which must be disclosed to the whole board). Only the veto holder can block a paper unilaterally. 
    Strengths: Preserves some unilateral action but randomizes who holds the blocking power, reducing systematic bias. The mandatory disclosure ensures information sharing. 
    Weaknesses: The veto holder might be overly cautious (pessimistic curse) or might not block when needed (if they are optimistic). Also, the veto holder might feel undue pressure.

  **Homogeneity and Correlated Errors**
  Our institute is homogeneous (same subfield, priors). If errors are strongly correlated, the curse might be less severe because the most optimistic estimate is less of an outlier. However, the three incidents suggest there is enough independent variation (since some were uncomfortable but didn't act). Also, even with correlated errors, the maximum estimate is still biased upward. Thus, the curse remains a concern.

  **Recommendation**
  After analysis, I recommend **Proposal B (Supermajority Vote)** with a written screening checklist for capability-relevance, as it provides a robust and transparent mechanism that directly addresses the unilateralist's curse without introducing a strong pessimistic curse. The supermajority threshold (60%) is a balanced approach that requires broad consensus for high-stakes papers. This is more practical than Proposal A (which relies on subjective beliefs) and less risky than Proposal C (which could lead to arbitrary blocks). 

  To address the mirror-image worry: The supermajority requirement is set at 60% (12 of 20) which is above majority but below unanimity, making it harder for a small minority to block (reducing the pessimistic curse) while still requiring more than a simple majority to publish (mitigating the original curse). 

  Additionally, I support augmenting this with **training and informal discussion** (as in the status quo proposal) to reduce noise at the source. 

  **Actionable Bottom Line**
  I move that the board adopt Proposal B: 
  - Implement a written screening checklist to flag papers as capability-relevant.
  - For such papers, require approval by a supermajority (12 of 20) of the research leads via a formal vote, recorded in the minutes. 
  - Non-flagged papers continue under the current lightweight review by the team's lead. 
  - Pair this with mandatory calibration training for all leads and encourage pre-submission discussions for flagged papers.

  This hybrid approach targets both the structural issue (via voting) and the noise issue (via training). It is concrete, auditable, and balances the risks of both the unilateralist's curse and its pessimistic twin.

  **Conclusion**
  We must act to prevent systematic errors in publication decisions. Proposal B offers a balanced, practical solution. I urge the board to adopt it at the next meeting.
answer: |-
  **MEMORANDUM**  
  **TO:** Publication Review Board, AI Research Institute  
  **FROM:** [Your Name], Board Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommended Reforms to Publication Governance Rules  

  ### **1. Introduction and Background**  
  Over the past year, our institute’s publication process—which defaults to “publish unless stopped”—has permitted three high-stakes papers to proceed despite substantial behind-the-scenes unease. In each case, a third of concerned leads assumed others would formally object, resulting in no intervention. This pattern suggests a systemic flaw in our governance. Our colleague has characterized this as the **unilateralist’s curse**, a selection effect distinct from simple collective-action failures. This memo analyzes whether and how we should reform our procedures to mitigate this curse, while guarding against its pessimistic counterpart (where a single low estimate blocks beneficial work). I evaluate three formal proposals (A, B, C) and the status quo (training/discussion-only), considering our institute’s homogeneity and the risk of correlated judgment errors. After rigorous analysis, I recommend **Proposal B (supermajority vote for flagged papers)**, augmented with training and discussion, as the most balanced solution.  

  ### **2. The Unilateralist’s Curse: Diagnosis and Distinctions**  
  The unilateralist’s curse arises when:  
  - **Any one actor** can unilaterally enable an action (e.g., publishing).  
  - Actors have **independent, noisy estimates** of the action’s net value.  
  - The action occurs if the **most optimistic estimate** supports it.  

  Critically, this is **not merely a collective-action problem** (where coordination failures cause inaction). Instead, it is a **selection effect on the maximum of noisy estimates**, akin to the winner’s curse in auctions: just as the winning bidder likely overvalues the item, the most optimistic lead’s noise-driven approval systematically favors publishing harmful work. No bad faith is required—statistical error alone biases outcomes.  

  This distinction matters because solutions must address the **structural bias** in which noisy estimates are selected, not just incentivize coordination. However, two complications arise:  
  1. **The mirror-image worry**: Switching to a “block unless approved” default risks a **pessimistic curse**, where one noisy low estimate vetoes beneficial work.  
  2. **Homogeneity and correlated errors**: Our institute shares subfield expertise and priors. If errors are strongly correlated (e.g., all leads over/underweight similar risks), the curse weakens because the most optimistic estimate is less likely to be a noise-driven outlier. Yet the three incidents suggest non-trivial independent variation—many who were uncomfortable did not act, implying uncorrelated hesitation. Even with correlation, residual independent noise can still exploit the structural bias.  

  ### **3. Analysis of Proposed Reforms**  
  #### **Proposal A: Conformity Principle**  
  - **Mechanism**: Leads may not publish if they believe a majority of equally informed colleagues would judge expected value (EV) as negative, irrespective of their own positive estimate.  
  - **Strengths**: Directly counters the unilateralist’s curse by tethering decisions to perceived group judgment. Avoids the pessimistic curse by not requiring active blocking.  
  - **Weaknesses**:  
    - **Subjectivity**: Relies on a lead’s honest (but error-prone) belief about others’ views, creating ambiguity and enforcement challenges.  
    - **Underblocking risk**: If leads underestimate opposition (e.g., due to correlated optimism), harmful papers may still slip through.  
    - **Overblocking risk**: Leads may overestimate opposition, stifling good work if they misread consensus.  
  - **Best argument for losing side**: This proposal respects epistemic humility but may institutionalize groupthink in our homogeneous institute, amplifying shared biases rather than correcting them.  

  #### **Proposal B: Board-Wide Supermajority Vote**  
  - **Mechanism**: For papers flagged as “capability-relevant” (via a written checklist), publication requires 12/20 leads’ approval. Non-flagged papers proceed under current rules.  
  - **Strengths**:  
    - **Balanced thresholds**: A 60% supermajority mitigates both curses—raising the bar for publication (countering unilateralist bias) but not requiring unanimity (reducing pessimistic overblocking).  
    - **Transparency**: Formal votes create auditable records, addressing our “no paper trail” issue.  
    - **Efficiency**: The checklist confines burdensome review to high-stakes papers.  
  - **Weaknesses**:  
    - **Process friction**: Voting may delay publications, though the checklist limits scope.  
    - **Correlated errors**: If all leads share similar biases, the vote may not correct them (e.g., uniformly underestimating risks).  
  - **Best argument for losing side**: Supermajorities could still enable groupthink or be gamed by strategic coalitions, especially if the checklist misflags papers.  

  #### **Proposal C: Rotating Single Veto Holder**  
  - **Mechanism**: A randomly selected lead holds quarterly veto power over flagged papers (with mandatory pre-disclosure to all).  
  - **Strengths**:  
    - **Decentralizes bias**: Randomization ensures no single perspective dominates, diluting systematic optimism/pessimism.  
    - **Lightweight**: Avoids full-board votes, preserving agility.  
  - **Weaknesses**:  
    - **Pessimistic curse risk**: A single noisy low estimate from the veto holder could block good work.  
    - **Accountability gaps**: One person’s veto may lack legitimacy, breeding resentment.  
    - **Inconsistent standards**: Quarterly rotation may yield arbitrary decisions.  
  - **Best argument for losing side**: This proposal’s elegance is appealing, but it replaces one unilateralist problem (optimism) with another (pessimism), potentially exacerbating the mirror-image curse.  

  #### **Status Quo: Training and Informal Discussion**  
  - **Mechanism**: Retain default-to-publish but add calibration training for leads and encourage ad hoc consultations.  
  - **Strengths**:  
    - **Targets root cause**: Reduces noise at the source (e.g., via bias training), avoiding procedural overhead.  
    - **Flexibility**: Leverages our homogeneity by fostering consensus through trust.  
  - **Weaknesses**:  
    - **Ignores structural bias**: Training alone cannot fix the selection effect—noise persists, and the “someone else will object” dynamic remains.  
    - **No accountability**: Informal discussions lack teeth, as evidenced by past failures.  
  - **Best argument for losing side**: If our errors are highly correlated (likely, given shared expertise), reducing noise through training could suffice without bureaucratic costs.  

  ### **4. Homogeneity and Correlated Errors: Implications**  
  Our institute’s shared priors reduce but do not eliminate the curse. Correlated errors diminish the “outlier optimism” driving the curse, yet residual independent noise (e.g., variations in risk aversion or workload) can still trigger it—as seen in the three incidents. Critically, **correlation does not negate the curse**; it merely dampens its severity. Reforms must therefore:  
  - Add independent scrutiny (e.g., voting) to counteract shared blind spots.  
  - Avoid over-indexing on homogeneity, as it may breed overconfidence in informal mechanisms.  

  ### **5. Recommendation and Actionable Steps**  
  I recommend adopting **Proposal B (Supermajority Vote)** **augmented with training and informal discussion**. This hybrid approach:  
  - **Targets the curse structurally** by replacing unilateral decisions with a supermajority threshold for high-stakes work, directly addressing the “maximum noisy estimate” bias.  
  - **Mitigates the mirror-image worry** with a balanced 60% threshold—high enough to prevent unilateralist errors but low enough to avoid pessimistic gridlock (unlike Proposal C’s single veto).  
  - **Accounts for homogeneity** by pairing voting with training to reduce correlated noise, while formalizing dissent via recorded votes.  
  - **Preserves agility** by limiting formal review to flagged papers (∼20% of output, based on industry norms).  

  **Concrete Implementation Steps:**  
  1. **Develop a capability-relevance checklist** (e.g., criteria: compute reduction >15%, general agentic applications, novel safety risks) within 30 days.  
  2. **Require 12/20 approvals** for flagged papers via anonymous vote, with quorum (14/20) to ensure engagement. Results minuted.  
  3. **Retain lightweight review** for non-flagged papers.  
  4. **Mandate annual calibration training** for leads (e.g., EV estimation, bias mitigation).  
  5. **Encourage pre-submission discussions** for flagged papers to resolve concerns early.  

  **Why Not Other Options?**  
  - **Proposal A** is theoretically sound but unworkable in practice due to subjective assessments.  
  - **Proposal C**’s single-veto system risks arbitrary blocks and institutional friction.  
  - **Status quo** ignores the structural problem, relying on hope over measurable change.  

  ### **6. Conclusion**  
  The unilateralist’s curse is a selection effect demanding structural reform, not just cultural tweaks. Proposal B offers a pragmatic, auditable solution that balances optimism and pessimism while respecting our institute’s cohesion. By focusing supermajority votes on high-risk papers and enhancing training, we reduce both noise and bias without paralyzing productivity. I urge the board to adopt this proposal at our next meeting.  

  **Bottom Line:** Move to implement Proposal B with a capability checklist, 12/20 supermajority votes for flagged papers, and complementary training—effective Q1 next year.  

  ---  
  **Estimated Read Time:** 9 minutes  
  **Vote Requested:** Approval of Proposal B as described in Section 5.
