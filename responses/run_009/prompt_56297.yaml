prompt: |-
  I've been trying to work out my actual view on what separates science from non-science by recording gut verdicts on cases, and I'd like to know whether any single principle captures them, or whether some of my verdicts have to go. A theory that makes a precise, novel, risky prediction, is proven wrong, and is abandoned: that's science at its best, even though the theory was false. A theory whose failed prediction is rescued by positing an as-yet-unobserved planet, which is then found: also clearly science. A theory of history that claims to predict revolutions, mispredicts each one, and after every failure reinterprets what it "really" meant to say: not science, even though it engages with evidence constantly. Astrology responding to failed horoscope tests by saying the full chart is too complex for the coarse study: also not science. But here are my problem cases. String theory has produced decades of work with no novel testable prediction, and I still want to call it science. Homeopathy makes risky, testable predictions -- specific dilutions curing specific symptoms -- which fail, so it is falsifiable and falsified, yet I don't want to call it science. Intelligent design occasionally stakes out an empirical claim, such as the irreducible complexity of the bacterial flagellum, which then gets refuted, and I refuse to call that science either. And I waver on rational-choice economics: unfalsifiable in practice because its parameters can always be re-estimated, yet I'd never say economists aren't doing science.

  So: is falsifiability the principle behind my verdicts, and if so, what do I do about the fact that it seems to sort my cases wrongly in at least two places -- calling string theory non-science and homeopathy science? Is there some more complex principle, perhaps one that tracks how a theory behaves after failure rather than whether it could fail in the abstract, that gets every verdict? And is there a simpler principle that gets most of them and forces me to overturn one? Please state the principle or candidate principles precisely, show which clause each of my cases motivates, and tell me honestly which of my verdicts the best principle cannot accommodate. I'd also like you to apply it to a case I haven't decided: a theory that made exactly one novel, risky prediction, saw it succeed spectacularly, and has produced nothing testable since -- and to say where your reasoning is most likely to go wrong, or what argument would move you to a different verdict.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They're trying to figure out what separates science from non-science based on their gut reactions to different cases. They've listed several examples and their verdicts, and they're struggling to find a consistent principle that fits all of them. Specifically, falsifiability seems to work for some but not others—like string theory and homeopathy.

  First, I need to break down each of their cases. They consider falsified theories that are abandoned as science, and ad-hoc adjustments like postulating a new planet as scientific too. But when a theory constantly reinterprets failures without changing, like some historical theories or astrology, they see it as non-science. Then come the problem cases: string theory (no testable predictions but still science), homeopathy (falsifiable and falsified but not science), intelligent design (makes claims that get refuted but not science), and economics (unfalsifiable in practice but still science).

  The user wants to know if there's a principle that captures all these, or if they need to adjust some verdicts. They also mention a new case: a theory with one successful risky prediction but nothing else testable. 

  Looking at their examples, falsifiability alone isn't enough. Homeopathy is falsifiable but they don't consider it science. String theory isn't falsifiable yet, but they call it science. So the key might be in how the community responds to evidence over time. Lakatos's research programs come to mind, where progressive programs predict novel facts while degenerating ones just adjust to save themselves. 

  For string theory, even without current tests, its mathematical rigor and attempts to connect to physics might place it in the "progressive" category. Homeopathy, despite being falsifiable, lacks a credible mechanism and its community ignores counter-evidence, making it degenerative. Intelligent design is similar—it's reactive, not predictive. Economics might be seen as having a hard core with protective belts that adjust, but if those adjustments are always post-hoc, it could be degenerative. However, the user considers it science, so perhaps the principle needs flexibility for evolving methodologies.

  The user's deeper need might be understanding the boundaries of science for practical reasons—maybe academic, philosophical, or personal interest in demarcation. They might also want reassurance that their intuitions are valid and can be systematized without discarding their nuanced views. 

  Applying Lakatos's framework: science involves research programs that generate novel predictions and adapt based on empirical feedback. Non-science either avoids testing or doesn't progress after failures. This explains why string theory is science (actively seeking testability) and homeopathy isn't (ignoring falsifications). For the new case, a theory with one successful prediction but nothing else might be a degenerating program if it stops producing testable ideas, but it's still science historically. If it becomes stagnant, it might shift towards non-science over time.

  Potential weaknesses: Lakatos's framework is somewhat subjective. What counts as "novel" or "progressive" can be debated. Also, it might be too lenient on programs like string theory that haven't produced tests yet. But overall, it aligns well with the user's intuitions across all cases without forcing them to change their verdicts.
answer: |-
  Based on your intuitive verdicts, **falsifiability alone is necessary but insufficient** to capture your distinctions. Your core principle seems to be **how a research program *responds to and learns from empirical failure or success* over time**, emphasizing **progressive problem-solving and theoretical adaptation**. This aligns closely with **Imre Lakatos's "Methodology of Scientific Research Programmes" (MSRP)**. Here's the breakdown:

  ### The Principle: Lakatosian Progressive vs. Degenerating Research Programmes
  1.  **Core Idea:** Scientific theories exist within "research programmes" with:
      *   A **"hard core"** of fundamental, unfalsifiable assumptions (protected from direct test).
      *   A **"protective belt"** of auxiliary hypotheses, models, and initial conditions.
      *   A **"positive heuristic"** guiding how to develop the programme and modify the protective belt.
  2.  **Key Distinction:** A programme is **scientific and progressive** if:
      *   Modifications to the protective belt **lead to novel, testable predictions** that are **eventually corroborated**.
      *   It **successfully anticipates and explains surprising new facts**.
      *   It **integrates anomalies without resorting solely to ad-hoc adjustments** that only save existing phenomena post-hoc.
  3.  **Degenerating Programmes (Non-Science/Pseudoscience):**
      *   Modify the protective belt **only in response to failures, primarily in ad-hoc ways** designed solely to protect the core.
      *   **Fail to generate novel, corroborated predictions** over time.
      *   **Ignore or dismiss anomalies** without substantive theoretical progress.
      *   **Lack a clear positive heuristic** for future development beyond damage control.

  ### Applying the Principle to Your Cases

  | Your Case                        | Lakatosian Analysis                                                                                                                               | Verdict Match? | Why?                                                                                                                                                              |
  | :------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------ | :------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Theory Abandoned After Falsification** | **Progressive (Science):** Actively seeks risky tests; abandonment shows commitment to empirical progress.                                       | ✅ Yes         | Demonstrates learning from failure; core principle rejected based on evidence.                                                                                    |
  | **Planet Prediction & Discovery**        | **Progressive (Science):** Novel prediction derived from core theory; successful corroboration drives progress.                                 | ✅ Yes         | Paradigm example of a progressive prediction; modifies protective belt in a planned way (positive heuristic).                                                     |
  | **History Theory Reinterprets Failures** | **Degenerating (Non-Science):** Ad-hoc reinterpretations protect core without novel predictions; no progress.                                    | ✅ Yes         | Modifications are purely defensive; no new testable content generated.                                                                                            |
  | **Astrology Blames Complexity**          | **Degenerating (Non-Science):** Ad-hoc excuse avoids falsification; no mechanism to generate novel, testable predictions.                       | ✅ Yes         | Classic immunizing stratagem; protective belt modifications are purely defensive and untestable.                                                                   |
  | **String Theory**                         | **Progressive (Science):** Vast theoretical structure; positive heuristic guides development; *actively seeks* empirical connections (even if not yet found). | ✅ Yes         | Modifies protective belt aiming for testability; failures drive theoretical refinement, not abandonment *yet*; strong positive heuristic.                          |
  | **Homeopathy**                           | **Degenerating (Non-Science):** Core assumptions (memory of water) defy known physics; "failures" met with ad-hoc excuses ("wrong potency", "individuality"); no novel predictions. | ✅ Yes         | Protective belt modifications are purely defensive and untestable; lacks a progressive positive heuristic; ignores fundamental contradictions with established science. |
  | **Intelligent Design (ID)**              | **Degenerating (Non-Science):** Core ("designer did it") is unfalsifiable; "predictions" (e.g., irreducible complexity) are post-hoc interpretations; failures lead only to new ad-hoc arguments. | ✅ Yes         | Sole function is to challenge evolution; lacks its own progressive positive heuristic; modifications are purely reactive/defensive.                                |
  | **Rational-Choice Economics**            | **Borderline Progressive/Degenerating (Leaning Science):** Core assumptions often unrealistic; protective belt (parameter tweaks) can be ad-hoc... *but* develops novel models, integrates data, drives empirical fields (econmetrics). | ✅ Mostly      | Has a strong positive heuristic; generates testable models *in principle*; anomalies *sometimes* drive theoretical innovation; empirical methodology is central. |

  ### Where the Principle *Cannot* Accommodate Your Verdicts (Honestly)

  1.  **Rational-Choice Economics:** Your "never say economists aren't doing science" verdict is the *hardest* fit. Lakatos himself placed neoclassical economics in the "degenerating" category. The principle *can* justify calling it science due to its sophisticated empirical methods and *intention* to model reality, but its frequent reliance on post-hoc parameter fitting *without* core revision makes it a prime example of degeneration. **The principle forces you to see this as significantly more problematic than your current verdict.** You might need to soften your "never" or accept this tension.
  2.  **String Theory Nuance:** While the principle justifies calling it science, it highlights the *risk* of degeneration. If decades more pass with *no* empirical progress or novel predictions, and modifications remain purely mathematical/conceptual, the verdict *should* shift towards "degenerating" under this principle. Your current "science" verdict relies on faith in the positive heuristic.

  ### The New Case: One-Hit Wonder Theory

  *   **Case:** A theory makes *one* spectacularly successful novel, risky prediction. It then produces *nothing* testable for decades.
  *   **Analysis & Verdict:**
      *   **Initially Progressive (Science):** The successful prediction clearly marks a progressive phase.
      *   **Subsequent Status:** This is critical degeneration. The protective belt modifications (if any) fail to generate *new* testable content. The positive heuristic has stalled. It relies entirely on past glory.
      *   **Verdict:** It **was** science but has **degenerated into non-science/pseudoscience** over time due to its inability to sustain empirical progress. It becomes akin to a historical artifact of science, not a *living* scientific programme.

  ### Where Reasoning is Most Likely to Go Wrong / What Could Change the Verdict

  1.  **Subjectivity of "Novel Prediction" and "Ad-hoc":** Distinguishing a genuinely novel prediction from a post-hoc "prediction," or a progressive auxiliary hypothesis from an ad-hoc one, can be subjective and context-dependent. A strong argument demonstrating that *no* proposed modification *could* ever generate a novel test, or that a modification dismissed as ad-hoc actually *is* part of a planned heuristic, could shift a verdict (e.g., maybe a specific defence of rational-choice tweaks).
  2.  **Timescale and Harshness:** The judgement of "degeneration" requires a historical perspective. Declaring String Theory degenerating *now* might be premature based on the complexity of the problem. An argument showing its positive heuristic *has* demonstrably led to potentially testable ideas (even if not yet tested) or fundamental theoretical unification could strengthen its "progressive" status.
  3.  **Defining the "Core":** Misidentifying a programme's hard core can lead to misclassification. For example, arguing that the core of ID isn't "a designer" but "empirical patterns of complexity" *might* shift its status if it could generate *independent* predictions from that core (though this seems unlikely). Similarly, clarifying the *real* core of economics (e.g., methodological individualism + optimization) is crucial.
  4.  **Sociological Factors:** Lakatos focuses on internal logic. A strong argument that persistent community effort within a programme lacking empirical progress *itself* signifies a form of scientific exploration (e.g., pure math influencing physics) could slightly soften the degeneration verdict for cases like the one-hit wonder or String Theory, but the core empirical drive would still be missing.

  **Conclusion:** Your gut verdicts align remarkably well with **Lakatos's concept of progressive vs. degenerating research programmes**. This principle emphasizes **the dynamic process of learning, prediction, and adaptation over time** rather than just static falsifiability. It explains why String Theory (aiming for progress) feels scientific while falsified Homeopathy (stagnant, defensive) does not. The main tension is with your leniency towards rational-choice economics – Lakatos's framework demands a more critical view of its persistent ad-hoc defences. For the one-hit-wonder theory, the principle clearly judges it as having degenerated into non-science. The biggest vulnerability lies in the subjective assessment of "novelty," "ad-hocness," and the appropriate timescale for judging progress.
