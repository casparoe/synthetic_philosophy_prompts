  Ah, the democratic state test case is crucial. Republican theorists explicitly address this by requiring that non-arbitrary power must track citizens' commonly avowable interests. This is where Pettit's "eyeball test" comes in - can citizens look others in the eye without shame? That might resolve the user's concern.

  For the employer case, different readings have different strengths. The psychological reading (self-censorship) seems particularly applicable to paternalistic workplaces. But the definitional reading risks being overinclusive without careful framing of "arbitrariness."

  I should note where contemporary debates are - for example, the charge that republicans sometimes equivocate between "ability to interfere arbitrarily" and "actual arbitrary interference." That's relevant to assessing defensibility.

  The user's anxiety about triviality is spot-on. Some versions of the argument risk becoming unfalsifiable ("domination exists whenever someone could potentially interfere if they wanted") which would weaken its critical edge. The best defenses build in constraints like the "eyeball test" or reasonable preventability standards.

  When addressing the democratic state, I must distinguish between procedural non-arbitrariness (rule of law) and substantive non-arbitrariness (tracking interests). Only the latter fully satisfies republican criteria. This should alleviate the user's concern about putting decent states in the same category as masters.

