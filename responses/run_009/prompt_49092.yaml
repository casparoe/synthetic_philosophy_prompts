prompt: |-
  Something about the two big UK referendums bugs me and I want help thinking it through with actual democratic theory. In 2014 the Scottish independence vote used a wider franchise than usual: 16 and 17 year olds got the vote, and so did EU citizens resident in Scotland. Then in 2016 the Brexit vote went back to the standard Westminster rules: 18 plus, EU citizens living in the UK were excluded (though Irish and Commonwealth citizens resident here were in), while British expats registered within the last 15 years could vote from abroad. So you get these weird contrasts: a French woman who'd lived in Glasgow for twenty years could vote on independence but not on Brexit; a 17 year old in Edinburgh could vote to leave the UK but not to leave the EU; a British retiree in Marbella got a say on Brexit but not on Scottish independence; and a German living in London for decades got no say on either.

  I gather the boundary problem — who belongs to the demos, and on what principle — is a whole subfield, so run these two referendums through it. Take the main candidate principles people actually defend (the all-subjected principle, affected-interests views, stakeholder or membership views, whatever else is in the running) and say what each implies about each of these franchise choices. Is there any principled story on which both referendums drew the boundary correctly, or is the mismatch just an embarrassment? One tempting move is to say the demos is relative to the decision being made — but if that's right, doesn't the real boundary problem just relocate to whoever sets the question, since in both cases it was Westminster that decided the franchise? And then flip it around: what do the cases show about the theory? Practically nobody objected to 16 year olds voting on independence, but plenty of people thought they should vote on Brexit — does that suggest the principles are doing no real work and the boundary is just set by politics all the way down?

  Please write your answer in British English.
reasoning: |-
  Okay, the user is really wrestling with the democratic theory behind the franchise differences in the UK's Scottish independence and Brexit referendums. They've spotted some glaring inconsistencies: different age thresholds, different rules for EU citizens and expats. It's a proper democratic puzzle. 

  First, I need to unpack why this bugs them. On the surface, it's about logical inconsistency, but I suspect there's deeper unease about whether democracy has any solid principles or if it's all political convenience. The way they phrase "just set by politics all the way down" suggests they're worried the theoretical frameworks might be decorative. Clever user – they're poking at the gap between theory and practice. 

  Right, the core task: run both referendums through major demos-boundary theories. Should list them systematically: all-subjected, affected interests, membership/stakeholder, national/civic identity. Need to stay precise – e.g., "affected interests" is notoriously slippery in practice despite sounding intuitive. 

  Noticing their examples are brilliantly chosen to highlight contradictions: that French woman in Glasgow is a knockout case. Also the 17yo Scot. And the German in London who got silenced twice – that's going to sting for any democrat. 

  Ah, and the meta-question: can any theory justify both franchises? My gut says no – the theories will mostly condemn the Brexit franchise, especially on EU citizens. But must present it fairly. The "decision-relativity" idea they mention is tempting but collapses when you see Westminster set both rules arbitrarily. 

  Practical point: nobody kicked off about 16yos in Indyref but did for Brexit. That's telling. Theory should be consistent, but public outcry was selective. Politics outweighing principle? Need to acknowledge that tension. 

  Structure thoughts: Start theory-by-theory comparison, then tackle whether coherence is possible, then examine what the cases reveal about theory's real-world role. British English reminders: "kerfuffle" not "controversy", "Westminster" not "UK Parliament". 

  Final note to self: User's clearly well-read ("boundary problem as subfield"). No dumbing down. But avoid jargon – e.g., explain "demos" once then use "constituency".
answer: |-
  This is a brilliantly sharp observation about the franchise inconsistencies between the two referendums, cutting straight to the heart of the "boundary problem" in democratic theory – arguably *the* foundational problem. Who constitutes "the people" entitled to make a collective decision? Let's break down the main theoretical principles and see how they judge these specific franchise choices:

  **Key Theoretical Principles for Defining the Demos:**

  1.  **The All-Subjected Principle:** Those who are subject to the binding laws and authority of the polity deciding the issue should have a say in that decision.
  2.  **The Affected Interests Principle (or All-Affected Principle):** Those whose significant interests are affected by the decision should have a say in making it. (Note: This is notoriously difficult to define and operationalise, as effects can ripple infinitely).
  3.  **The Stakeholder/Membership Principle:** Those who have a recognised stake or membership within the political community should decide. This often relies on established legal definitions of citizenship or residence, sometimes incorporating ideas of shared identity, belonging, or contribution.
  4.  **National/Civic Identity Principle:** Membership in the demos is defined by shared national identity or a commitment to the civic values of the specific nation-state.

  **Applying the Principles to the 2014 Scottish Independence Referendum:**

  *   **Franchise:** 16+, resident in Scotland (incl. EU/Commonwealth citizens, excl. UK citizens not resident in Scotland).
  *   **Theories:**
      *   **All-Subjected:** Strong justification. Independence would profoundly alter the legal and political authority Scots (and residents) were subject to. EU citizens resident were subject to Scottish law and the outcome.
      *   **Affected Interests:** Very strong justification. The decision fundamentally affected the future life prospects, rights, and identity of everyone living in Scotland. 16/17 year olds would live with the consequences longest.
      *   **Stakeholder/Membership:** Justifiable under a broad definition of "resident stakeholder". Living in Scotland constituted the primary stake. Inclusion of non-citizen residents reflected this.
      *   **National Identity:** Less clear-cut. Scottish identity isn't strictly tied to citizenship, but the franchise leaned towards civic/residential membership rather than purely ethnic or UK-national identity. Excluding non-resident Scots could be seen as privileging residence over identity/birth.

  **Applying the Principles to the 2016 EU Referendum:**

  *   **Franchise:** 18+, UK, Irish, and qualifying Commonwealth citizens resident in the UK; British citizens abroad <15 years. Excluded: 16/17 year olds, EU citizens resident in UK (except Irish/Cypriot/Maltese with Commonwealth links).
  *   **Theories:**
      *   **All-Subjected:** **Significant problems.** Leaving the EU directly removed rights and altered the legal status of millions of EU citizens *subject to UK law* (e.g., residency, work rights, healthcare access). They were subject to the decision's consequences but denied a vote. Conversely, UK expats abroad >15 years were no longer primarily subject to UK law but retained voting rights (for Westminster/refs).
      *   **Affected Interests:** **Major problems.** EU citizens resident in the UK were *deeply* affected – their lives, families, jobs, and legal status were fundamentally altered. 16/17 year olds would live with the consequences far longer than many voters. The exclusion seems arbitrary against this principle. The inclusion of short-term resident Commonwealth citizens (not significantly affected if planning to leave) and exclusion of long-term EU residents highlights the inconsistency.
      *   **Stakeholder/Membership:** **Partial justification, but inconsistent.** Relied heavily on *formal UK citizenship* (and historic Commonwealth/Irish ties) rather than residency. Long-term resident EU citizens contributed taxes, used services, and were integral parts of communities but were excluded, undermining a pure "stakeholder" argument based on residence. The 15-year rule for expats is an arbitrary line within citizenship.
      *   **National Identity:** **Clearer fit, but exclusionary.** The franchise strongly reflected the Westminster parliamentary model based on UK citizenship and historic ties (Commonwealth, Ireland). It prioritised national identity (as defined by the UK state) over residency or direct impact. This explains the exclusions.

  **Can Both Franchises Be Principled? The Mismatch Explained:**

  *   **The Decision-Relativity Temptation (and its flaw):** You rightly identify the tempting argument: "The demos depends on the specific decision." Scottish independence was about Scotland's *internal* constitutional future, so the demos was defined residentially. Brexit was about the UK's *external* relationship, so the demos was defined by national citizenship.
      *   **The Problem:** This doesn't solve the boundary problem; it *relocates* it, as you suspected. Who decides *which* principle applies to *which* decision? **Westminster decided both.** For Scotland's future, it implicitly accepted a broader, more inclusive, residentially-defined demos. For the UK's future relationship with the EU, it reverted to the narrower, citizenship-based Westminster model. There's no *theoretical* consistency here; it reflects Westminster's sovereign power to define the franchise *differently* based on political considerations for each vote.
  *   **Is there a coherent story?** It's very hard to construct one using consistent principles. The most generous interpretation might be:
      *   IndyRef: Used a bespoke, maximalist "all-subjected/affected/resident stakeholder" principle appropriate for a foundational constitutional question about a specific territory.
      *   Brexit: Used the standard "national citizenship plus historic ties" principle of the existing UK parliamentary system for a vote about the UK state's international position.
      *   **Why this is unsatisfactory:** It fails to explain why the millions *subject to* and *affected by* Brexit within the UK (EU residents, young people) were excluded from the demos defined by the "national citizenship" principle, while those *less subject to/affected by* it (recent expats, short-term Commonwealth residents) were included. The principles are inconsistently applied *within* each franchise definition.

  **What the Cases Show About Theory and Politics:**

  1.  **Theory Highlights the Inconsistency:** Democratic theory (especially All-Subjected and Affected Interests) sharply exposes the arbitrariness and potential injustice in the Brexit franchise, particularly regarding resident EU citizens and 16/17 year olds.
  2.  **Politics Trumps Pure Principle:** The franchise choices were fundamentally **political decisions** made by Westminster:
      *   **IndyRef 2014:** Offering a wider franchise (16+, residents) bolstered the legitimacy of the process in Scotland and internationally. It made it harder for the losing side to delegitimise the result. It also reflected the SNP's long-standing policy on votes at 16.
      *   **Brexit 2016:** Reverting to the Westminster franchise was politically expedient. Expanding it to 16+ was opposed by the governing Conservatives. Including resident EU citizens (who polls suggested would overwhelmingly vote Remain) was politically unpalatable to Eurosceptics driving the referendum. Expanding expat voting was less controversial for Leave/Remain camps.
  3.  **Selective Outrage Confirms Politics Dominates:** The lack of major UK-wide outcry over 16+ voting in IndyRef (outside some Tory circles) versus the significant campaign for 16+ votes in Brexit reflects *political alignment*, not theoretical consistency. Pro-EU groups saw 16+ as potential allies; pro-independence groups in 2014 saw it similarly. The exclusion of EU citizens from the Brexit vote caused outrage among those affected and Remain supporters, but was accepted (or even welcomed) by Leavers and the government as aligning with their view of the demos as "British citizens deciding Britain's future".
  4.  **Theory Isn't Useless, But Its Power is Diagnostic/Normative:** The principles aren't "doing no work." They provide the critical tools to *identify* the inconsistencies, *challenge* the legitimacy of the franchises, and *argue* for alternatives. They show that the boundaries weren't drawn neutrally or consistently according to any single democratic ideal, but were shaped by the political priorities and power dynamics of the Westminster government at each moment. They reveal the franchises as political constructs, not natural or theoretically inevitable categories.

  **Conclusion:**

  There is no *principled*, *consistent* democratic theory that cleanly justifies *both* franchise choices simultaneously. The mismatch is indeed an embarrassment when viewed through the lens of core principles like all-subjected or affected interests, which highlight the exclusion of deeply impacted groups (EU residents, young people) from the Brexit vote. The "decision-relativity" argument merely shifts the problem to Westminster's sovereign, politically-motivated choice of *which* principle to apply in each case. The contrasting reactions to franchise extensions (16+ in IndyRef vs. the campaign for it in Brexit, silence on EU citizens in IndyRef vs. outrage at their exclusion from Brexit) starkly demonstrate that political calculation and alignment, not abstract democratic theory, were the primary drivers in setting these boundaries. Theory's value lies in exposing this inconsistency and providing the language to argue for a more coherent and just approach to defining "the people" in future fundamental votes.
