  ### Dispositions Classification Decision Tree

  Below is a decision tree designed to classify cases in the dispositions literature. The tree uses 5 branch questions (Q1–Q5) to sort cases into 7 leaf categories. Questions are answerable without prior knowledge of specialized terminology. Each question focuses on **actual properties** (e.g., presence of a basis) or **counterfactual dependencies** (e.g., what would happen under stimulus conditions). Paths are deterministic: every combination of answers terminates in a leaf.

  #### The Decision Tree
  1. **Q1: Would the manifestation (M) occur if the stimulus (S) obtained?**  
     - *Yes* → Go to Q2.  
     - *No* → Go to Q4.  

  2. **Q2: Does the object have the underlying basis for the disposition at the time of stimulus?**  
     - *Yes* → Go to Q3.  
     - *No* → **Mimicker**.  

  3. **Q3: Is there an alternative cause (independent of the object’s basis) that would bring about M if S occurred?**  
     - *Yes* → **Overdetermined**.  
     - *No* → **Ordinary**.  

  4. **Q4: Does the object have the underlying basis for the disposition at the time of stimulus?**  
     - *No* → **Ordinary absence**.  
     - *Yes* → Go to Q5.  

  5. **Q5: Does the interferer prevent M by acting *after* the manifestation process has started?**  
     - *Yes* → **Reversal**.  
     - *No* → **Fink or Mask** (subdivide via Q5a).  

     **Q5a: Does the interferer prevent M by removing the basis (or preventing its presence) at the time M would otherwise begin?**  
     - *Yes* → **Fink**.  
     - *No* → **Mask**.  

  ---

  ### Key to Leaves
  1. **Ordinary**:  
     The disposition is present, M occurs due to the basis, and no alternative cause would trigger M without the basis.  
     *Example*: A fragile glass shatters when struck, with no interference.  

  2. **Mimicker**:  
     The object lacks the basis for the disposition, but M would occur due to an alternative cause.  
     *Example*: Martin’s dead wire (lacks conductivity but would conduct when touched due to an external device).  

  3. **Overdetermined**:  
     The disposition is present, M would occur, but an alternative cause would also trigger M without the basis.  
     *Example*: A fragile glass struck while a demon *simultaneously* shatters any object; breaking occurs, but not solely due to fragility.  

  4. **Ordinary absence**:  
     The object lacks the basis, and M would not occur.  
     *Example*: A robust steel vase struck with normal force; it does not break.  

  5. **Fink**:  
     The disposition is present, but an interferer removes the basis *before* the manifestation process begins.  
     *Example*: Lewis’s live wire that disconnects when touched (basis removed pre-conduction).  

  6. **Mask**:  
     The disposition is present, but an interferer blocks the causal chain *after* the stimulus and *before* the manifestation process starts.  
     *Example*: Poison neutralized by an antidote before it enters the bloodstream.  

  7. **Reversal**:  
     The disposition is present, the manifestation process begins, but an interferer halts/reverses it *after* onset.  
     *Example*: Annealer demon healing a cracking glass mid-break.  

  ---

  ### Unoccupied Paths
  The tree has **no unoccupied paths**; all answer combinations map to a leaf. This is because:  
  - The questions exhaustively partition logical space. Q1 splits cases by counterfactual success/failure. Q2 then isolates mimickers (Q1=Yes, Q2=No) and ordinary absences (Q1=No, Q2=No). Q3 separates overdetermined (Q1=Yes, Q2=Yes, Q3=Yes) from ordinary cases (Q1=Yes, Q2=Yes, Q3=No). For failures (Q1=No, Q2=Yes), Q5 distinguishes reversal (interference mid-manifestation) from fink/mask (interference pre-manifestation), with Q5a splitting the latter by whether the basis is removed (fink) or the chain is blocked (mask).  
  - No combinations are incoherent or unexplored. For instance, a "Q1=No, Q2=Yes, Q5=Yes" path (reversal) is occupied by the annealer, while "Q1=No, Q2=Yes, Q5=No, Q5a=Yes" (fink) and "Q5a=No" (mask) are standard. The literature covers all answer profiles.  

  ---

  ### Defense of Ordering
  I start with **Q1 (counterfactual)** because it directly tests the conditional analysis (SCA) and cleanly separates cases where the disposition *would* manifest (Yes: ordinary, overdetermined, mimicker) from where it *would not* (No: ordinary absence, fink, mask, reversal). This ordering:  
  1. **Prioritizes the SCA’s core insight**: The conditional is the literature’s anchor—e.g., Martin’s wire cases target its sufficiency/necessity. Starting here isolates mimickers (which *falsify* SCA’s necessity) and conditional failures (which challenge its sufficiency) early.  
  2. **Avoids conflating distinct failures**: Beginning with the basis (Q2) would merge fink and mask (both have the basis but fail the counterfactual). By contrast, Q1→Q2 separates mimickers (basis absent, counterfactual holds) from fink/mask (basis present, counterfactual fails).  
  3. **Minimizes redundancy**: Q1 reduces the need for later "would M occur?" queries. For example, in the "Yes" branch, Q3 (alternative cause) efficiently splits ordinary and overdetermined cases without revisiting counterfactuals.  

  #### Flagged Collapses
  The tree **cannot distinguish two categories** without adding a question that relabels the problem:  
  - **Fink vs. Early Mask**: Q5a separates these by *whether the basis is removed* (fink) or *blocked without removal* (mask). But in cases like the self-neutralizing poison (internal interference), this distinction blurs. The poison’s basis (toxicity) is not removed (so not fink), but the vomiting acts *before* the lethal process starts (so mask). Here, "blocking the chain" (mask) includes internal causal interference, which some might classify differently. The tree treats it as mask, but this collapses the intuition that internal interference is distinctive.  
  - **Overdetermined vs. Ordinary**: Q3 uses "alternative cause" to separate these. However, if the alternative cause is non-triggered (e.g., a demon that *would* act but doesn’t), the tree still labels it overdetermined. This is consistent but may dilute "manifestation" to include non-actual causes.  

  These collapses reflect **trade-offs for parsimony**. Adding questions (e.g., "Is the interferer internal?") would separate self-neutralizing cases but create redundancies (e.g., antidotes are external masks). I prioritize a lean tree that captures major categories, flagging where nuance is lost.  

  ---

  ### Test Case Analyses
  1. **Annealer** (fragile glass healed mid-crack):  
     - Q1: Would M (breaking) occur? → **No** (glass ends intact).  
     - Q4: Basis present? → **Yes** (fragile structure).  
     - Q5: Interferer acts *after* manifestation starts? → **Yes** (cracking begins; demon heals mid-process).  
     → **Leaf: Reversal**.  

  2. **Self-Neutralizing Stimulus** (poison inducing vomiting):  
     - Q1: Would M (death) occur? → **No** (vomiting expels poison).  
     - Q4: Basis present? → **Yes** (inherent toxicity).  
     - Q5: Interferer acts after manifestation starts? → **No** (vomiting occurs *before* poisoning process begins).  
     - Q5a: Interferer removes basis? → **No** (toxicity remains; poison is expelled).  
     → **Leaf: Mask**.  

  3. **Overdetermined Glass** (fragile + demon shatter-spell):  
     - Q1: Would M (breaking) occur? → **Yes** (it breaks).  
     - Q2: Basis present? → **Yes** (fragile).  
     - Q3: Alternative cause? → **Yes** (demon’s spell would break even non-fragile objects).  
     → **Leaf: Overdetermined**.  
     - *Doubt captured at Q3*: The question forces us to confront whether the breaking *manifests fragility* or is overdetermined. The "Yes" answer classifies it as non-ordinary.  

  ---

  This tree resolves your cases while exposing SCA’s limitations. Use it to spark debate on whether reversal/overdetermined require new metaphysics!
