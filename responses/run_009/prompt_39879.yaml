prompt: |-
  hey, so i'm in this ethics seminar and we just hit the population ethics / procreation asymmetry unit, and my friend Dana has Opinions about everything, so i've started keeping a list of her verdicts like she's a field specimen. so far:

  - a couple who knows their kid would have a genuinely miserable life (chronic pain, net bad, call it welfare −5) and has it anyway: wrong, full stop.
  - a couple who could have a kid guaranteed a great life but just don't want kids: nothing wrong with that, nobody is wronged, it's not even a tiny moral loss.
  - world A: 8 billion people all at +80 welfare. world B: the same 8 billion at +80, plus one extra person at +40 (a good life, just less good than everyone else's). her verdict: B is not better than A. not even slightly. morally the same world.
  - same setup but the extra person would be at −5: now B is clearly worse than A.
  - choice between (i) bumping all 8 billion from +80 to +85, or (ii) keeping everyone at +80 and adding one new person whose life would also be +85. she picks (i) instantly and looked at me like (ii) was obviously worse.
  - 8 billion at +80 vs 80 billion at +2 (barely worth living, and it's the same original 8 billion in both worlds plus 72 billion more): the first world is better, and "it's not close."

  next seminar the prof wants everyone to bring hard cases for each other's positions lol. so here's what i need from you:

  1. predict her verdicts on three new cases:
     a. a policy that prevents exactly one person at −5 from ever existing, but as a side effect every one of the 8 billion drops from +80 to +79 (tiny dip, everyone's life is still great). is the policy worth it?
     b. a couple will have exactly one child either way. conceive now and it's Sam, whose life goes at +30. wait six months and it's a different child, Robin, whose life goes at +70. nobody else is affected in any way. is waiting better?
     c. a couple does some genetic gamble: 50% chance of a kid at +85, 50% chance of a kid at −5, versus just not having a kid at all. permissible?

  2. what rule is she actually running? i can already see it's not plain total utilitarianism (the "+40 person changes nothing" verdict kills that on its own). but i suspect more than one system fits everything she's said — like some critical-level thing where lives below a threshold drag the total down, or a person-affecting view where only people who exist in both outcomes count plus a penalty for creating bad lives, or maybe a deontic constraint against creating misery riding on top of some axiology. lay out which rules fit her track record equally well, because i genuinely can't tell them apart.

  3. and then the important one: which further case would actually split those rules apart? if i get to ask her exactly one thing before seminar, what do i ask?

  btw her "+40 person adds nothing" and "barely worth living lives make the world worse" verdicts are doing alot of the work here i think. anyway, predict away — i care less about the right answers than about nailing her operating system.
reasoning: |-
  Okay, let me try to figure out Dana's ethical framework based on her existing verdicts. She clearly has some strong opinions on population ethics. 

  First, looking at her responses. She thinks creating a miserable life (-5) is wrong, but not creating a happy life isn't a moral loss. That suggests she doesn't see failing to create positive welfare as a problem, only creating negative welfare matters. Then in World A vs B with the +40 extra person, she says they're morally the same. But if the extra person is at -5, B is worse. That implies adding positive welfare doesn't improve the world, but adding negative makes it worse.

  When choosing between improving existing lives or adding a new +85 life, she prefers improving existing. And in the 8 billion at +80 vs 80 billion at +2, she strongly prefers the former. The barely worth living lives actually make the world worse for her. 

  Hmm, this seems like she's using something like a critical-level view. Maybe where lives above a certain threshold don't add value unless they exceed that level by enough? Or perhaps a person-affecting view where only existing people count, plus a prohibition against creating negative welfare lives.

  For the new cases: 
  a) Preventing a -5 life at the cost of tiny drop for everyone. Since she cares about avoiding negative lives, she might say yes, worth it. But the drop affects existing people, so maybe not? 
  b) Choosing between Sam at +30 or Robin at +70. Since both are positive and no one is harmed, she might say it doesn't matter? But Robin has higher welfare, so maybe she'd prefer waiting?
  c) Genetic gamble: 50% chance of +85, 50% of -5 vs no kid. Since creating a -5 life is wrong, she'd probably say it's impermissible.

  The tricky part is figuring out which rules fit all her verdicts. Critical-level utilitarianism with a high threshold? Or a two-tier view where avoiding harm is primary? Maybe a negative utilitarian view with person-affecting constraints?

  To distinguish between these, I need a case where creating a life barely above zero but below critical level vs not creating it. Or a case where improving existing lives conflicts with adding new barely-positive lives. 

  For example: World with 8 billion at +80 vs same plus one million at +1. If she thinks adding them makes the world worse, it's critical-level. If morally neutral, maybe person-affecting. 

  Another idea: Preventing the existence of a +40 life. Does she see that as a loss? Probably not, based on her earlier verdicts. But if it's a trade-off where preventing a -5 life requires sacrificing a +40 life? Hmm, that might be messy. 

  I think I need to focus on cases where the critical level vs person-affecting views diverge. Like whether adding lives below the critical level is actively bad or just neutral. Her "80 billion at +2" verdict suggests she thinks it's bad, so critical-level seems likely. But need a case to confirm.
answer: |-
  Based on Dana's verdicts, she's running a **Critical-Level Utilitarianism with a High Threshold** (likely >+40) combined with a **Strong Asymmetry** between creating positive vs. negative welfare lives. Here's the breakdown:

  ### 1. Predicted Verdicts for New Cases
  a. **Preventing one −5 life at cost of tiny dip (everyone +80 → +79):**  
     **Dana's Verdict: *Not worth it.***  
     *Why:* Creating a −5 life is bad, but *harming* 8 billion existing people (even slightly) is worse. Her "bump existing people vs. add new +85" verdict shows strong priority for existing welfare. Sacrificing existing welfare to prevent a *potential* negative life violates her asymmetry.

  b. **Conceive Sam (+30) now vs. wait for Robin (+70):**  
     **Dana's Verdict: *No moral difference; neither is better.***  
     *Why:* Both lives are net-positive and above her critical threshold (since +40 didn't add value). No existing person is harmed or wronged. Her "couple doesn't want kids" verdict shows no obligation to create even high-welfare lives, so choosing between two positive lives is neutral.

  c. **Genetic gamble (50% +85 / 50% −5) vs. no child:**  
     **Dana's Verdict: *Impermissible.***  
     *Why:* Creating a −5 life is "wrong, full stop" in her first verdict. The 50% chance of creating severe suffering outweighs the 50% chance of a high-welfare life, as she assigns infinite disvalue to creating negative welfare.

  ---

  ### 2. Rules Fitting Her Verdicts (with Key Features)
  All these systems explain her track record equally well so far:

  - **Critical-Level Utilitarianism (CLU) with High Threshold (∼+50):**  
    - Only lives above a critical level (e.g., +50) add moral value; lives between 0 and the CL are neutral. Lives below 0 subtract value.  
    - *Fits:* Explains why +40 adds nothing (below CL) and +2 lives make the world worse (below CL). Prioritizing existing welfare bumps (+80→+85) over new +85 lives (since existing welfare is far above CL).

  - **Asymmetrical Person-Affecting View:**  
    - *Harm Principle:* Creating a life with negative welfare is forbidden.  
    - *Benefit Principle:* Creating a life with positive welfare is neutral (not obligatory).  
    - *Axiology:* Only changes affecting *existing* people matter (e.g., bumping welfare counts; adding new people doesn't unless welfare <0).  
    - *Fits:* "No loss" in not creating +85 life; creating −5 is wrong; +40 adds nothing; barely worth living (+2) is harmful creation.

  - **Negative Utilitarianism (NU) + Non-Identity Problem Constraints:**  
    - Minimize suffering is primary; creating happiness is optional.  
    - New lives only matter if they reduce suffering or prevent negative lives.  
    - *Fits:* Preventing −5 is good; creating +40 is irrelevant; adding +2 lives increases net suffering risk.

  **Shared Core of All Three:**  
  - Creating negative welfare lives is morally prohibited.  
  - Creating positive welfare lives below a high threshold is neutral (not a gain).  
  - Improving existing high-welfare lives takes absolute priority over adding new lives.

  ---

  ### 3. The Crucial Question to Split the Rules
  Ask her this:  
  **"Is it better to add one new person at +10 (above zero but below your 'neutral' threshold) versus not adding anyone? Does adding them make the world worse, better, or neutral?"**

  - **Why this splits the systems:**  
    - **Critical-Level CLU (Threshold e.g., +50):** Adding +10 is *bad* (since it's below CL), making the world worse.  
    - **Asymmetrical Person-Affecting:** Adding +10 is *neutral* (no harm, no benefit to others).  
    - **Negative Utilitarianism NU:** Adding +10 is *neutral or slightly bad* (increases risk of suffering without offsetting existing suffering).

  - **Her Likely Answer (Based on Patterns):**  
    If she says **"Worse"**, she's likely CLU with a high threshold (consistent with +40 adding nothing and +2 being bad).  
    If she says **"Neutral"**, she's likely strict Asymmetric Person-Affecting or NU.

  ### Why This Works
  Her "+40 adds nothing" and "+2 makes the world worse" verdicts suggest she sees *sub-threshold positive lives as actively bad*, not just neutral. If she confirms adding a +10 life is bad, it locks in CLU. If she calls it neutral, it supports a softer asymmetry. This question isolates how she values lives *above zero but below her implied threshold*—the key fault line between the systems.

  **Pro Tip for Seminar:** Frame it as: *"No trade-offs, no existing people affected. Pure creation: is adding a life at +10 good, bad, or neutral?"* Avoid contamination from other principles. Her answer here will crack her code.
