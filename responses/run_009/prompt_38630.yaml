answer: |-
  ### Decision Tree: Diagnosing "Collapse" in Archaeology  
  *Start with the claim: "This society collapsed." Use evidence from the Late Bronze Age eastern Mediterranean (LBA), Classic Maya, or Easter Island to answer questions. Follow the branches to your position.*  

  ---

  #### **1. What happened to the population?**  
  - **Mostly died** (e.g., LBA: mass graves; Easter Island: sharp demographic decline)  
    → Go to Q2A.  
  - **Dispersed** (e.g., Classic Maya: urban abandonment but rural continuity; LBA: migrations to highlands)  
    → Go to Q3.  
  - **Stayed in place under different institutions** (e.g., LBA: Mycenaean citadels abandoned but villages persist; Easter Island: clan-based society replaces elite rule)  
    → Go to Q4.  

  ---

  #### **2A. [Population mostly died] Was the trigger external?**  
  - **Yes** (drought, invasion, disease; e.g., LBA: Sea Peoples; Classic Maya: megadrought)  
    → **Catastrophist Collapse** (e.g., Diamond 2005; Cline 2014).  
    *Position: Sudden, externally driven disaster causes demographic/cultural termination.*  
  - **No—trigger was internal** (e.g., Easter Island: self-inflicted ecocide; Classic Maya: warfare over resources)  
    → **Diminishing-Returns Complexity Collapse** (e.g., Tainter 1988).  
    *Position: Internal complexity becomes unsustainable, triggering systemic failure.*  

  ---

  #### **3. [Population dispersed] What was lost?**  
  - **Human welfare** (nutrition, health, equality; e.g., Classic Maya: increased infant mortality post-“collapse”)  
    → **Catastrophist Collapse** (see above).  
  - **Organizational complexity** (states, bureaucracy, writing; e.g., LBA: loss of Linear B/palaces)  
    → **Diminishing-Returns Complexity Collapse** (see above).  
  - **Only elite culture** (palaces, monuments, scribes; e.g., Easter Island: moai toppled but society endures)  
    → **Transformational School** (e.g., McAnany & Yoffee 2010).  
    *Position: Change is societal reorganization, not collapse.*  

  ---

  #### **4. [Population stayed] What was lost?**  
  - **Organizational complexity** (e.g., LBA: Hittite Empire fragments into Neo-Hittite city-states)  
    → **Diminishing-Returns Complexity Collapse** (see above).  
  - **Only elite culture** (e.g., Classic Maya: royal rituals end but farming continues; Easter Island: birdman cult replaces ancestor worship)  
    → **Transformational School** (see above).  
  - **Nothing of substance—change was ordinary** (e.g., trade shifts in LBA; generational cycles in Maya settlement)  
    → **Deflationist View** (e.g., Middleton 2017; Faulseit 2016).  
    *Position: "Collapse" is a dramatic narrative imposed on normal change.*  

  ---

  #### **5. Is "collapse" a causal process or an outcome?**  
  *(Applies if answers don’t fit above branches)*  
  - **Causal process** (e.g., complexity theorists: collapse *drives* simplification)  
    → **Diminishing-Returns Complexity Collapse**.  
  - **Dramatic outcome** (e.g., catastrophists: collapse *results from* disaster)  
    → **Catastrophist Collapse**.  
  - **Neither—it’s a misleading label**  
    → **Deflationist View** or **Transformational School**.  

  ---

  ### Key Positions  
  1. **Catastrophist Collapse**: External triggers cause abrupt breakdown (e.g., LBA invasions, Maya drought).  
  2. **Diminishing-Returns Complexity**: Internal complexity costs spark failure (e.g., Maya/Easter Island resource depletion).  
  3. **Transformational School**: Change is reorganization, not collapse (e.g., Maya diaspora, post-palatial LBA).  
  4. **Deflationist View**: "Collapse" exaggerates normal change (e.g., Easter Island clan shifts, Maya resilience).  

  ---

  ### Ambiguities & Gaps  
  - **Unclean Separation**: *Transformational* vs. *Deflationist* views blur when change is non-catastrophic but significant (e.g., LBA trade network shifts). Both reject "collapse," but differ on whether change is transformative (Transformational) or mundane (Deflationist).  
  - **Logically Available but Undefended Position**:  
    - *Internal trigger + population stayed + only elite culture lost + "collapse is causal."*  
      Example: A society’s internal complexity crisis *directly causes* elite institutions to fall, but commoners thrive.  
    - **Why empty?** Incoherent: If internal crisis causes collapse as a *process*, it should impact more than elites (e.g., welfare/complexity loss). No archaeologist defends this niche.  

  ---

  ### Test Case Consistency Check  
  | **Case**          | **Catastrophist**       | **Complexity**          | **Transformational**    | **Deflationist**        |  
  |-------------------|-------------------------|-------------------------|-------------------------|-------------------------|  
  | **Late Bronze Age** | Sea Peoples/drought     | Palace economies too costly | Neo-Hittite continuity | Trade reconfiguration   |  
  | **Classic Maya**  | Megadrought             | Warfare/overinvestment  | Rural diaspora          | Cyclical urbanism       |  
  | **Easter Island** | European contact        | Ecocide from statue cult | Birdman cult reform     | Clan competition        |  

  *Design note: Nodes prioritize empirical patterns over theoretical labels. Gaps reflect logical limits, not oversight.*
