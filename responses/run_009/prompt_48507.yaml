  1. Explain the scenario: 
     "A mugger is going to flip a coin for each of you. If it's heads, you will receive 100 points. If it's tails, you will be asked whether you are willing to pay 50 points. If you pay, the mugger will give you 0 points (so you are out 50 points). If you don't pay, you get 0 points (so you are out 0)."

     But then there's no incentive to pay. So we need to include the counterfactual incentive.

     We can say: "The mugger claims that if you are the kind of person who would pay in the tails scenario, then in the heads scenario you will get the 100 points. But if you are the kind who would not pay in tails, then in heads you would not get the 100 points."

     But then we are including a predictor, which we don't have.

     Alternatively, we can omit that and just have the students focus on the policy vs. the conditioned decision.

     Given time, I think we should omit the mugger's claim and just have a simple version to show the change in decision.

     So: In tails, paying 50 points has no benefit. So why pay? The only reason would be if they committed to it as a policy.

     So we will see if they change their mind.

  2. Step by step:

     a. Policy decision: Each student writes on a piece of paper: 
        "In the event of tails, I will: [ ] Pay 50 points [ ] Not pay"

     b. Collect these. Record for each student what they chose (you will use for phase 2).

     c. Then, each student draws a slip from the hat (without replacement). They look at it but don't reveal.

     d. If they drew heads, they receive 100 points. Then, they are given a form that asks: 
          "If you had drawn tails, would you have paid 50 points? [ ] Yes [ ] No"
          (This is hypothetical and doesn't affect points.)

     e. If they drew tails, they are given a form that asks:
          "Do you choose to pay 50 points? [ ] Yes [ ] No"
          If they choose yes, they lose 50 points (net -50). If no, they lose 0 points (net 0).

  3. Record their decisions.

  Note: The students with heads don't make a real decision, but they do answer a hypothetical.

  For the students with tails, we can compare their policy to their action.

  Phase 2: Blackmail

  Materials: 
  - For each student with phase 1 policy "Pay", prepare a blackmail letter.
  - For phase 1 policy "Not Pay", no letter.

  Rules:

  1. Explain: "A blackmailer has been watching your decisions in the previous game. They have sent letters to some of you."

  2. Distribute the letters only to those with phase 1 policy "Pay".

     The letter says: 
     "We know that in the counterfactual mugging, you are the kind of person who would pay in the event of tails. We demand that you pay 50 points. If you pay, nothing else will happen. If you do not pay, you will lose an additional 100 points. Return your decision to the instructor within 5 minutes."

  3. Each student who receives a letter must decide: pay 50 points or not.

     - If they pay, -50 points.
     - If they do not pay, -100 points.

     They write their decision on a slip and hand it in.

  4. Students who do not receive a letter have no action and no penalty.

  Points tally:

  At the end, tally points from phase 1 and phase 2.

  In phase 1:
  - Heads: +100
  - Tails: 
     - If they paid: -50
     - If not: 0
  - Also, for tails, they didn't get the 100, so net: either -50 or 0.

  In phase 2:
  - If they got a letter (because phase 1 policy was Pay) and they paid: -50
  - If they got a letter and didn't pay: -100
  - No letter: 0

  So we need to keep track per student.

  Then, we can convert to rewards.

  Now, the debrief.

  Debrief script (1):

  - Start by asking the students about their experiences.
  - For phase 1, ask the tails group: "How many of you changed your mind from your policy to your action?" (Some might have planned to pay but then didn't, because after seeing tails, paying seemed pointless.)
  - For the heads group: "If you had been in tails, would you have paid?" and compare to their policy.
  - Highlight the tension: before the flip, they might have thought that paying in tails is part of a policy that gets them 100 in heads. But after the flip, in tails, paying doesn't get them anything.

  - Then for phase 2: 
    - "How many of you got a letter? How many of you with a letter decided to pay?"
    - "Do you wish you had chosen a different policy in phase 1?"

  - Then introduce the decision-theoretic positions:
    - In phase 1, the policy decision (before the flip) is the updateless perspective. You are choosing a policy for all states.
    - After the flip, you are conditionalizing on the state (heads or tails). In the tails state, conditional on being in tails, paying doesn't help.
    - In phase 2, the blackmail: your policy in phase 1 (the updateless choice) bound you. If you chose "Pay", you got the letter and had to lose at least 50 points. If you chose "Not Pay", you avoided the letter. So the policy choice mattered, even though at the time it was made, it was about a different scenario.

  - The fracture line: decision theories that update and act on the new information (like EDT) vs. those that stick to the precommitment (like UDT).

  (2) Honest note on limitations:

  - The predictor in phase 2 is not a real predictor of their behavior in the blackmail; it's their past choice in a different scenario. In reality, a predictor would be about the same decision.
  - Points are not money, so the stakes are low.
  - In phase 1, the counterfactual incentive (that the mugger would have given you the money in heads if you are the paying type) is not implemented. We only have the coin flip.

  How to handle: 
  - Acknowledge that in the real counterfactual mugging, the payment in tails might affect the heads outcome because of the predictor. We didn't simulate that, but the point is to illustrate the tension in the abstract.
  - The points are symbolic, but we hope the engagement makes it feel real.

  (3) Frank rundown of what goes wrong and fixes:

  - Problem: In phase 1, students might not take the policy decision seriously because they don't know the state. Fix: Emphasize that the policy is binding and will be recorded.
  - Problem: In phase 1, the students who get heads might not engage with the hypothetical. Fix: In the debrief, ask them to take it seriously and imagine they are in tails.
  - Problem: In phase 2, students might not understand why they are being blackmailed based on phase 1. Fix: Explain the backstory: the blackmailer is using their past decision as an indicator of their type.
  - Problem: The connection between phase 1 and phase 2 might seem forced. Fix: In the debrief, explain that in real decision problems, your past choices or your nature can bind you in future scenarios.
  - Problem: Time might run out. Fix: Keep strict time limits. Have forms prepared for quick distribution.

  Final design:

  Logistics:

  - Have a points ledger (spreadsheet on laptop) to record.

  - Materials: 
    - Slips of paper for phase 1 draw: 7 "Heads", 7 "Tails".
    - Policy forms for phase 1 (one per student).
    - Action forms for phase 1 (one per student for heads and tails).
    - Blackmail letters for phase 2 for the "Pay" policy students.
    - Decision forms for phase 2 for those who get letters.

  Timing:

  - 0-10 min: Explain phase 1. Distribute policy forms. Collect. (5 min explanation, 5 min to decide and collect).

  - 10-15 min: Draw slips. Separate students: heads and tails.

  - 15-25 min: Distribute action forms: 
     - Heads group: hypothetical form.
     - Tails group: real decision form.
     Collect.

  - 25-30 min: Calculate and record phase 1 points. 

  - 30-35 min: Explain phase 2. 
     - "The blackmailer has been watching. They know your policy from phase 1. If you chose 'Pay' in phase 1, you will receive a letter."

  - 35-40 min: Distribute letters to the "Pay" policy students. Give them decision forms.

  - 40-45 min: Collect phase 2 decisions. Record penalties.

  - 45-75 min: Debrief and discussion.

  - 75-80 min: Convert points to rewards.

  Rewards: 
  - Exemption from one reading response for the top 3 students? But we want it to be above trivial. 
  - Coffee vouchers for all who scored above a threshold? Or for everyone, scaled by points.
  - Since points might be negative, we can do: 
     - Convert to a score: starting from 0, add phase 1 and phase 2 points. 
     - Then, the top 50% get a coffee voucher or exemption.

  But to keep it simple, we can say: the points will be converted to a chance in a lottery. Each 10 points = one ticket in a draw for a $10 coffee voucher. But negative points mean 0 tickets.

  Alternatively, we can have a fixed reward for participating and then bonuses.

  Given the complexity, we can do:

  - Every student gets a base reward (say, a chocolate bar) and then the top 3 get coffee vouchers.

  But to avoid negative points, we can start them with a endowment.

  Better: at the start of class, each student gets 200 points.

  Then in phase 1:
  - Heads: +100 (now 300)
  - Tails and pay: -50 (now 150)
  - Tails and not pay: 0 (now 200)

  In phase 2:
  - If no letter: 0 (keep current points)
  - If letter and pay: -50
  - If letter and not pay: -100

  Then at the end, points are converted: every 50 points = one entry in a draw for three $10 coffee vouchers.

  So everyone has at least 100 points (2 entries) and some have more.

  This way, negative points are avoided by the endowment.

  Let's adjust the numbers so that the range is reasonable.

  Starting endowment: 200 points.

  Phase 1:
  - Heads: +100 -> total 300
  - Tails and pay: -50 -> total 150
  - Tails and not pay: 0 -> 200

  Phase 2:
  - No letter: 0 -> no change
  - Letter and pay: -50 -> so if they had 300, becomes 250; if 150, becomes 100; if 200, becomes 150.
  - Letter and not pay: -100 -> 300->200, 150->50, 200->100.

  Then we can convert to lottery tickets: 
  - 0-50 points: 1 ticket
  - 51-100: 2 tickets
  - 101-150: 3 tickets
  - 151-200: 4 tickets
  - 201-250: 5 tickets
  - 251-300: 6 tickets

  Or simpler: tickets = floor(points / 50)

  This is a bit messy. We can just use the points as they are and have a lottery with probabilities proportional to points.

  But to keep it simple, we can use the points to buy exemption from a reading response: 
  - 300 points: exempt from 3 responses
  - 200 points: exempt from 2
  - 100 points: exempt from 1
  - Below 100: no exemption

  But they might not have that many responses.

  Alternatively, we can have a store:

  - 50 points = 1 chocolate
  - 100 points = coffee voucher
  - 150 points = coffee voucher + chocolate
  - etc.

  But we need to know what's feasible.

  Since the assistant doesn't know, we'll leave it as: points are convertible to rewards at the instructor's discretion.

  Full rules write-up:

  **Phase 1: Counterfactual Mugging**

  1. Each student is given a form:
     ```
     Policy Decision:
     In the event that your coin flip is tails, what will you do?
     [ ] Pay 50 points (if tails, you will pay 50 points and receive 0 points)
     [ ] Not pay (if tails, you will pay 0 points and receive 0 points)
     Note: If heads, you will receive 100 points without any action.
     ```

     They circle one and hand it in.

  2. The instructor records each student's choice (for use in phase 2).

  3. Each student draws a slip from a hat (14 slips: 7 "Heads", 7 "Tails"). They keep it secret.

  4. The instructor distributes action forms based on the draw:

     - If "Heads":
          ```
          You drew heads! You receive 100 points.
          Hypothetical: If you had drawn tails, would you have paid the 50 points?
          [ ] Yes   [ ] No
          ```
          (This does not affect points.)

     - If "Tails":
          ```
          You drew tails. Do you choose to pay 50 points?
          [ ] Yes   [ ] No
          Note: If you pay, you will have a net loss of 50 points. If not, you lose 0 points.
          ```

  5. Collect the action forms. Record the decisions.

  **Phase 2: The Blackmail**

  1. The instructor distributes letters only to students who chose "Pay" in their phase 1 policy decision.

     The letter says:
     ```
     BLACKMAIL NOTICE
     We have observed that you are the kind of person who would pay in a counterfactual mugging (as per your policy in the previous game). 
     We demand that you pay 50 points. 
     If you pay, nothing else will happen. 
     If you do not pay, you will lose an additional 100 points. 
     Return your decision to the instructor within 5 minutes.
     ```

  2. Students who receive a letter must decide and fill out a form:
     ```
     In response to the blackmail letter, I choose to:
     [ ] Pay 50 points
     [ ] Not pay (and lose 100 points)
     ```

  3. Students who do not receive a letter do nothing.

  **Point Tally:**

  - Starting endowment: 200 points.
  - Phase 1:
     - Heads: +100 points
     - Tails: 
        - If paid: -50 points
        - If not paid: 0 points
  - Phase 2:
     - If you received a letter and paid: -50 points
     - If you received a letter and did not pay: -100 points
     - No letter: 0 points

  Total points = 200 + phase 1 adjustment + phase 2 adjustment.

  Then, rewards: 
  - Instructor will convert points to rewards (e.g., coffee vouchers, exemptions) after class.

  **Debrief Script (1):**

  Start by asking:

  - "In phase 1, who drew tails? How many of you had planned to pay in your policy? How many of you actually paid? Why did you change your mind?"

  - "Who drew heads? If you had drawn tails, would you have paid? Does that match your policy?"

  - "In phase 2, who received a letter? Why did you receive it? How many of you paid the blackmail? Why?"

  Then explain:

  - In phase 1, the policy decision was made before you knew the state (heads or tails). That is the updateless perspective: you are choosing a plan for all possible worlds.

  - After the coin flip, you learned the state. Then you made a decision conditional on that information. For those in tails, the conditional decision might have been different from the policy because you now know you are in the bad state, and paying doesn't help.

  - In phase 2, your policy decision from phase 1 bound you. It caused you to receive the blackmail letter, which put you in a situation where you had to lose points. The letter was sent because of your past commitment.

  - The fracture line in decision theory: between theories that say you should always condition on everything you know (so in tails, don't pay) and theories that say you should stick to the precommitment (so in tails, pay, because that was the plan that had higher expected utility before the flip).

  - In the blackmail, if you had chosen a policy of not paying in phase 1, you wouldn't have gotten the letter. But once you have the letter, you are forced to pay to avoid the larger loss. So the policy of paying is self-undermining: it puts you in a position where you have to incur a cost.

  This is a simplified version of the XOR blackmail, where the letter is evidence about something else, but here we see that the policy itself can be costly.

  ** (2) Limitations: **

  - The predictor in phase 2 is not a prediction of what you would do in the blackmail; it is your past choice in a different scenario. In reality, a predictor might be more sophisticated and about the same decision.

  - Points are not real money, so the incentives might not feel as real.

  - In phase 1, the counterfactual mugging did not have the predictor element that would make paying in tails affect the heads outcome. We omitted that for simplicity.

  Handling: 
  - Acknowledge these limitations. Explain that the real puzzles involve predictors and real money, but the game captures the logical structure.

  ** (3) Predictable problems and fixes: **

  - Problem: Students might not understand the instructions. Fix: Have written rules and go over them slowly.

  - Problem: Phase 1 takes too long. Fix: Keep the policy decision quick, and have the draw and action forms ready.

  - Problem: In phase 2, students who didn't get a letter might feel left out. Fix: Explain that not getting a letter is good.

  - Problem: The connection between the two phases might seem artificial. Fix: In the debrief, explain that the blackmailer is using phase 1 as a signal of their type.

  - Problem: Students might not take the points seriously. Fix: Make the rewards tangible and valuable.

  This design meets the requirements and should run within 80 minutes.
