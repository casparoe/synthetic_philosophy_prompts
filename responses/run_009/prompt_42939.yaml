prompt: |-
  Right, so I'm giving the opening talk at a workshop on global justice in a few weeks, and the organisers want each speaker to circulate a one-page statement of our commitments in advance so the respondants can have at it. Before I send mine round, I'd like a sanity check on whether the thing actually hangs together — I have a suspicion at least one pair is quietly at war and I can't see it myself, and I'd rather find out now than from a grad student with a grin.

  Here's the set. (1) I'm a moral cosmopolitan in the boring sense: nationality has no intrinsic moral significance, each person counts for one and that's that. (2) But I'm a statist about distributive justice: the stringent, enforceable requirements of justice hold only among people who share a basic structure — a state's coercive institutions — and beyond the border our duties are duties of aid: real, but less demanding and more discretionary in how they're discharged. (3) I've also argued in print, and still believe, that there is already a thick global basic structure — the trade and financial architecture (the WTO, the IMF, the bilateral investment stuff) shapes life prospects everywhere — that was the whole thrust of my criticism of the WTO at the time. (4) I hold that rich states owe stringent, justice-grade duties — not mere charity — to the peoples they colonised, and that these persist today; the ground there is the historical wrong, not any ongoing scheme of cooperation. (5) I also think a decent state may control its borders, and may turn away would-be economic migrants who would be far better off admitted — that's an exercise of collective self-determination, and I don't loose any sleep over it. (6) On the personal side, I give to the local food bank rather than to famine relief abroad, and I think that's perfectly permissible, not merely excusable.

  So: go through the pairs and tell me which are genuinely in tension and how badly, which only look like it, and for each real one what would have to give and what the cheapest fix costs. Then tell me which single revision would clean up the most. Don't be polite about it — if the whole package is a shambles, say so, and say which plank I should abandon.
reasoning: |-
  Okay, the user is a philosopher preparing a talk on global justice and wants a sanity check on their commitments. They've listed six positions and suspect some might conflict. Let me start by breaking down each point and identifying potential tensions.

  First, moral cosmopolitanism (1) says nationality doesn't matter; everyone counts equally. But (2) is statist: justice obligations only apply within a state's basic structure. That's a classic tension. How can everyone matter equally if justice duties stop at borders?

  Then there's (3): they argue a global basic structure exists via trade/financial institutions. But if that's the case, why hold onto statism in (2)? If there's a global basic structure, shouldn't justice duties extend globally? That seems contradictory.

  Point (4) about duties to colonized peoples based on historical wrongs. That's separate from current structures. But how does that fit with (2)? Are these justice duties or aid? They say justice-grade, so maybe an exception to statism. But then why not extend that to other historical injustices?

  Point (5) on border control and economic migrants. If each person counts equally (1), how is turning away migrants permissible? Especially if they'd be better off. Collective self-determination vs. individual moral equality—big conflict here.

  Point (6): giving locally instead to global famine relief. Permissible under personal ethics, but if everyone matters equally (1), why prioritize locals? The user thinks it's fine, but does that undermine cosmopolitanism?

  Now, tensions between pairs. 1 and 2 conflict directly. 2 and 3 are problematic because if a global basic structure exists, justice should apply there. 4 and 5: stringent duties to colonized peoples but turning away migrants. That inconsistency could be called out, especially if migrants come from formerly colonized nations. 1 and 6: prioritizing locals when everyone should count equally. 

  The biggest issue is between 2 and 3. If the global basic structure is thick enough to shape life prospects, then justice duties should apply globally. The cheapest fix might be to adjust (2) to include such structures. But that might require rethinking statism. Alternatively, clarify that existing structures aren't fully coercive like a state, but that could be weak. 

  Abandoning (5) on border control might resolve several tensions, especially with cosmopolitanism and historical duties. But the user values collective self-determination. Maybe reframe border control as a temporary measure until global justice is established, but that's a big shift. 

  Overall, the most problematic is the conflict between (2) and (3). Addressing that by expanding the scope of justice to cover global structures would align with their critique of the WTO and their cosmopolitan principles. That might require dropping strict statism, allowing justice duties beyond borders where structures exist. This could also help reconcile (4) and (5) by creating a framework for global obligations. 

  The user's deeper need is coherence to avoid being torn apart by respondents. They need their position to withstand scrutiny without major contradictions. Highlighting the global basic structure as a foundation for global justice might be the strongest move, even if it means revising statism. Acknowledging historical wrongs as a separate basis for duties could coexist if framed as rectificatory justice. Border control remains a sticking point, but emphasizing self-determination as a pro tanto value might mitigate the clash. Personal giving preferences are less central but should be justified as legitimate partiality within a cosmopolitan framework.
answer: |-
  Okay, let's dissect this. You're right to be suspicious – there are significant tensions here, though not all pairs are equally problematic. The core conflict orbits around your **Statism (2)** and your **Global Basic Structure claim (3)**, which fundamentally undermines it. Your **Cosmopolitanism (1)** and **Border Control stance (5)** are also in deep tension. Let's go through the pairs:

  1.  **Statism (2) vs. Global Basic Structure (3): HIGH TENSION (The Core Conflict)**
      *   **Why:** This is the most critical clash. Statism's core claim is that stringent justice *requires* a shared basic structure. You *also* argue that a "thick global basic structure" *already exists*. This structure demonstrably shapes life prospects coercively and profoundly (e.g., WTO rules, IMF conditionality, investment treaties). If such a structure exists *and* is coercive in shaping fundamental life chances, then by the *logic of your own statist premise (2)*, stringent duties of distributive justice *must* apply globally among those subject to it. Your statism becomes self-refuting. You can't logically say "justice only applies where there's a basic structure" and "there is a global basic structure" but then deny global distributive justice obligations stemming *from that very structure*.
      *   **Severity:** **Critical.** This undermines the coherence of your entire position combining (2) and (3). Respondents *will* pounce.
      *   **What Has to Give:** Either (2) *or* your characterization of the global order in (3). You must choose: is the global order *not* a "basic structure" in the relevant (Rawlsian?) sense required for justice? Or, does its existence *entail* global distributive justice obligations?
      *   **Cheapest Fix:** **Recharacterize (3).** Argue that while the global order is *influential and coercive*, it lacks key features of a *domestic* basic structure necessary for *full-blown distributive justice* (e.g., lack of a unified political authority capable of direct redistribution, absence of a common scheme of social cooperation *in the same thick sense*). Emphasize it creates *problems* demanding *structural reform*, but frame those reforms as matters of *fairness in interaction* or *preventing harm*, not (yet) full-blown *distributive justice* à la a domestic state. This preserves (2) but weakens the force of (3). **Cost:** Your critique of the WTO/IMF loses some of its "justice" bite, becoming more about fairness/harm prevention.

  2.  **Cosmopolitanism (1) vs. Statism (2): MODERATE/HIGH TENSION**
      *   **Why:** (1) says nationality is irrelevant morally; everyone counts equally. (2) says stringent justice obligations stop at the border. This creates a gap: if everyone matters equally, why do our most stringent, enforceable duties ignore the vast majority of equally morally significant persons? Statism seems to give *de facto* moral significance to shared citizenship/nationality via the basic structure, contradicting the spirit (if not the letter) of (1). The tension is inherent to the cosmopolitan-statist hybrid position.
      *   **Severity:** **Moderate/High.** A classic tension in the literature. You can defend it, but it requires robust justification for why the basic structure creates such a unique moral context *despite* fundamental equality. Your fix for (2)/(3) will heavily influence this.
      *   **What Has to Give:** Nothing *has* to, but the justification burden is high. You need a compelling story about *why* the basic structure generates unique obligations that don't simply default to equal consideration.
      *   **Cheapest Fix:** **Double down on the justification for (2).** Argue the coercive, pervasive, life-shaping nature of the *domestic* basic structure creates unique obligations of *reciprocity*, *fair play*, or *collective responsibility* among co-participants that simply don't exist, or exist to a lesser degree, in the looser global context (especially if you recharacterize (3)). Emphasize that (1) governs fundamental *moral status*, while (2) governs the *content and stringency of specific obligations* generated by specific institutional relationships. **Cost:** Requires careful argumentation; risks making (1) feel merely rhetorical.

  3.  **Cosmopolitanism (1) vs. Border Control (5): HIGH TENSION**
      *   **Why:** (1) says everyone counts equally. (5) permits excluding individuals seeking significantly better lives purely based on their nationality/place of birth. This directly disadvantages individuals based on a morally arbitrary characteristic (nationality), preventing them from accessing opportunities within your basic structure solely because they weren't born into it. It seems hard to square "each counts for one" with "we can actively prevent you from accessing the benefits of our scheme, even if it costs you dearly, because we collectively decided so."
      *   **Severity:** **High.** This is a major point of contention. Critics will argue (5) violates the fundamental equality asserted in (1).
      *   **What Has to Give:** Either soften (1) to allow for associative duties/partiality *beyond* what the basic structure argument gives you, or significantly qualify (5). Alternatively, provide an exceptionally strong justification for collective self-determination overriding individual claims.
      *   **Cheapest Fix:** **Clarify/Qualify (5).** Argue that while exclusion is *permissible* under certain conditions (e.g., for stability, cultural preservation, managing integration capacity – grounded in collective self-determination), it is *not necessarily just* to the individuals excluded. Frame it as a *pro tanto* right of peoples that can be outweighed by *very* strong individual claims (e.g., refugees) or historical obligations (linking to (4)). Avoid saying you "don't lose sleep" – it sounds callous. **Cost:** Weakens the absoluteness of (5); requires acknowledging a moral cost to exclusion.

  4.  **Cosmopolitanism (1) vs. Personal Giving (6): MODERATE TENSION**
      *   **Why:** (1) suggests equal concern. (6) prioritizes locals significantly. While partiality is often defended, pure moral cosmopolitanism typically demands that geographical distance/nationality shouldn't *systematically* determine priority when needs are comparable (e.g., life-threatening hunger locally vs. abroad). Why is local giving "perfectly permissible" if famine abroad represents a much greater threat to fundamental interests?
      *   **Severity:** **Moderate.** Personal partiality is widely accepted, but needs justification within a cosmopolitan framework. The "perfectly permissible" claim might be too strong.
      *   **What Has to Give:** Either moderate the strength of (1) to allow robust associative duties, or moderate (6) to acknowledge a stronger pull towards effective global aid.
      *   **Cheapest Fix:** **Ground (6) in associative duties.** Argue that ties of community, shared institutions, and direct impact create special obligations *over and above* general duties of aid. Frame local giving as fulfilling these associative duties, while acknowledging general duties to aid abroad still exist (and perhaps suggesting you fulfill those too, just differently). Avoid claiming it's *equally* justified as giving to greater need abroad. **Cost:** Requires defending associative duties as compatible with fundamental equality (1).

  5.  **Statism (2) vs. Colonial Duties (4): MODERATE TENSION (Manageable)**
      *   **Why:** (2) says stringent justice requires a *current* shared basic structure. (4) grounds stringent justice-grade duties in *historical* wrongs, not current cooperation. This seems like an exception to the statist premise.
      *   **Severity:** **Moderate/Low.** Rectificatory justice for historical wrongs is a well-established category *distinct* from distributive justice among current cooperators. It's a different grounds for obligation.
      *   **What Has to Give:** Nothing major. You just need to clearly distinguish the *grounds* of the duties.
      *   **Cheapest Fix:** **Explicitly frame (4) as Rectificatory Justice.** State clearly that these are not obligations arising from a *current* shared basic structure (distributive justice), but from the profound, enduring harms of *past* injustice (rectificatory justice). They exist *alongside*, not *contradicting*, the statist account of distributive justice. **Cost:** Minimal. This is a standard and defensible move.

  6.  **Colonial Duties (4) vs. Border Control (5): MODERATE TENSION (Contextual)**
      *   **Why:** You owe stringent duties to peoples harmed by your colonization (4), yet you permit excluding members of those very peoples seeking entry for a better life (5). This *looks* like continuing harm: denying access to opportunity to those whose ancestors' opportunities were systematically destroyed. If migrants come from formerly colonized nations, the tension is acute.
      *   **Severity:** **Moderate/High (context-dependent).** This is a potent criticism, especially if you represent a former colonial power. It highlights potential hypocrisy or inconsistency in applying principles.
      *   **What Has to Give:** Either qualify the permissibility of exclusion *specifically* for those from formerly colonized nations, or provide a very strong justification for why self-determination overrides this specific historical obligation in the migration context.
      *   **Cheapest Fix:** **Acknowledge the tension and prioritize (4).** Argue that while collective self-determination generally permits border control, the *specific historical obligations* arising from colonization create a much stronger, perhaps overriding, claim for admission or preferential treatment for migrants from those nations *as part of the reparative duty*. **Cost:** Significantly qualifies (5) for a specific group; requires arguing migration can be a form of reparation.

  7.  **Global Basic Structure (3) vs. Border Control (5): LOW/MODERATE TENSION**
      *   **Why:** If there's a coercive global structure shaping life chances (3), excluding people from accessing the territory governed by a powerful node within that structure (your state) seems like reinforcing global inequality through border policy.
      *   **Severity:** **Low/Moderate.** The connection is less direct than others. You can argue border control is a legitimate exercise of sovereignty even within a global system.
      *   **What Has to Give?** Little, unless the global structure argument is very strong. Mostly rhetorical tension.
      *   **Cheapest Fix:** **Rely on the fix for (2)/(3) and (1)/(5).** If you've weakened (3) to *not* imply global distributive justice, and defended (5) via self-determination (qualified by (4)), this tension mostly dissipates. **Cost:** Minimal if other fixes are done.

  **The Single Most Impactful Revision: Address the (2) vs. (3) Conflict**

  **The core instability is your Statism (2) coexisting with your claim of an existing Global Basic Structure (3).** This is the fault line respondents are most likely to exploit. **The cheapest and most coherent fix is to recharacterize (3):**

  *   **Drop:** The claim that it's a "thick global *basic structure*" in the *exact same sense* required for domestic distributive justice under (2).
  *   **Reframe:** Argue it's a **coercive, powerful, and unjust global *institutional order*** that *creates* background injustice, demands *structural reform* to ensure fairness in interaction (Fair Trade, debt justice, preventing exploitation), and generates *strong duties of harm prevention and aid*, but **not** (yet) full-blown, continuous, reciprocal distributive justice obligations among all global citizens akin to those within a state.
  *   **Why it's cheapest:** It preserves the core of your WTO/IMF critique (it's harmful/unfair/coercive and needs reform) and your statism (domestic structures are unique generators of distributive justice), while avoiding the logical contradiction. It aligns better with your duties of aid (2b) and rectificatory justice (4). It slightly weakens the *language* of (3) but keeps its substance and critical thrust.

  **Which Plank to Abandon? (If Forced)**

  If forced to abandon one commitment for overall coherence, **abandoning strict Statism (2)** would actually create the *most* coherent and defensible position *given your other commitments*, especially (1), (3), and (4). You could become a **"Global Institutionalist"** or **"Political Cosmopolitan"**:

  *   **Grounding:** Your (3) provides the institutional basis. Stringent justice obligations apply where there are coercive institutions (global or domestic) profoundly shaping life chances. This directly justifies global distributive justice based on the existing order.
  *   **Benefits:** Resolves the (2)/(3) conflict neatly. Makes (1) more consistent. Provides a stronger potential foundation for (4) (the global order perpetuates colonial patterns). Makes (5) harder to defend, but allows you to argue border control must be justified within a framework of global justice, potentially limiting its scope significantly.
  *   **Cost:** This is a major shift, requiring rethinking much of your framework. It abandons a core tenet of mainstream political philosophy (Rawlsian statism). It makes defending (5) much harder. Your talk would be radically different.

  **Conclusion:**

  The package isn't a *total* shambles, but it has **critical vulnerabilities, primarily between (2) and (3), and significant tensions involving (1), (5), and (4)/(5)**. You *can* defend it, but it requires careful, explicit work to manage the tensions.

  **Recommendations:**

  1.  **Prioritize Fixing (2)/(3):** Recharacterize your "global basic structure" claim as a powerful, coercive, unjust *global institutional order* generating duties of structural reform, harm prevention, and significant aid, *not* full distributive justice. This is the cheapest fix for the most critical flaw.
  2.  **Reframe (5):** Soften the language ("permissible under certain conditions" vs. "don't lose sleep"). Explicitly acknowledge the tension with (1) and especially (4), and argue that self-determination is a *pro tanto* value that can be overridden, particularly by historical obligations or extreme need. Link it to your revised (3) – border control must be exercised fairly within the global order.
  3.  **Clarify (4):** Explicitly ground it in *rectificatory justice*, distinct from distributive justice arising from a current basic structure.
  4.  **Moderate (6):** Ground local giving in associative duties arising from shared community/institutions, acknowledging the pull of global need without claiming strict parity.
  5.  **Strengthen Justifications:** Be prepared to robustly defend the core tension between (1) and (2) – why shared coercive institutions create unique obligations despite fundamental equality.

  **Send this revised, tension-managed position, not the raw list.** Good luck – the grad students will still be sharpening their knives, but at least they won't find a glaring logical contradiction at the heart of it.
