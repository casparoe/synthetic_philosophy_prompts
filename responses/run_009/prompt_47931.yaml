  **Rationale for Ranking**:  
  - **Question #2** gets top priority because its answer determines if the entire research program is viable. If impact measures implicitly encode values, further work is rearranging deck chairs.  
  - **Question #1** comes next because baseline choices cascade into all concrete proposals (e.g., #3, #4).  
  - **#4 and #3** are deprioritized: #4 depends on #1/#2, and #3 is a specific implementation that can't be evaluated without foundational answers.  
  - **Neglectedness/tractability tradeoff**: #2 is both neglected and tractable; #1 is tractable but less neglected; #4 is neglected but harder; #3 is neither neglected nor upstream-critical.  

  **Execution Strategy**: Fund #2 immediately (1-2 researchers) to resolve the value-encoding crux. Parallelize #1 (1 researcher) once #2's methodology is established. Reassess #4 only if #2 is falsified. Defund #3—it's a distraction from fundamentals.
