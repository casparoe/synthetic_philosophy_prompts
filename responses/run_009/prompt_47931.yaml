  2. **Question 1**: Without a solution to the baseline problem, we cannot even define impact. It is also highly neglected because there is no consensus and proposals vary. It is tractable with theory (defining and comparing counterfactuals). It is downstream of Question 2 only in the sense that if Question 2 reveals the approach is doomed, then we might not need to address the baseline. But because we don't know the answer to Question 2, we must also fund Question 1. However, if we can only fund one or two, Question 2 is more critical. We rate it as **fund first** as well, but if we have to choose, Question 2 is more foundational.

  3. **Question 4**: This is a major challenge and if not addressed, any impact measure might fail in deployment. It is more neglected than the others because most work focuses on designing measures without considering distributional shifts. It requires theory but also some understanding of robustness and generalization, which might be more challenging (so tractability might be lower). We rate it as **fund later**.

  4. **Question 3**: This is a specific proposal. It is important to test specific ideas, but without the foundational work (on baselines, value encoding, and robustness) we might not know if it's a good one. It is less neglected because there are papers on this (e.g., the attainable utility preservation idea). We rate it as **fund later** or even pass until the foundations are clearer.

