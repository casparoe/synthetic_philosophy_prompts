  - Neglectedness (1-5, 1 being very neglected, 5 being well-studied)
  - Upstream dependencies: Which questions are downstream of others?

  The four candidate questions:

  1. **The baseline problem**: Which counterfactual to use for measuring impact?
  2. **The claim that impact measures encode a value function**: If true, it might undermine the entire approach.
  3. **Defining side effects via reachable futures**: Is this a robust definition or just a proxy?
  4. **The long-tail worry**: Impact measured on the wrong variables could lead to catastrophe.

  We must be honest about what is upstream/downstream.

  Analysis:

  - **Question 2** (value function claim) seems foundational. If it's true that every impact measure is just a weird utility function, then the entire approach of "penalize impact" might be no better than specifying a utility function and might not avoid the need for value specification. This could sink the whole program. Therefore, settling this is critical and should be done first. It is upstream of the others because if it holds, then the other questions become about designing a particular utility function (which might not be the right approach). If it doesn't hold, then we can proceed with the other questions.

  - **Question 1** (baseline problem) is central to defining any impact measure. Without a clear baseline, we cannot measure impact. This is a prerequisite for designing any impact measure. It is upstream of 3 and 4 because both of those depend on having a baseline.

  - **Question 3** (reachable futures) is one specific proposal for measuring impact. It is downstream of the baseline problem (because you need a baseline to define which futures are reachable in the counterfactual) and also downstream of the value function claim (if the claim holds, then this measure is just a utility function and we need to evaluate it as such). It is also a specific instance that might be affected by the long-tail worry (Question 4).

  - **Question 4** (long-tail worry) is about the robustness of any impact measure. It is a general challenge for any measure, so it is downstream of the baseline and value function questions. It might be that without a principled account of which variables to measure, no impact measure is safe.

  Therefore, the ordering of dependency might be:

  Question 2 (value function) -> Question 1 (baseline) -> Question 4 (long-tail) -> Question 3 (specific measure)

  But note: Question 2 is the most upstream. Then Question 1 is next because it is about the definition of impact. Then Question 4 is a challenge that applies to any measure, so it should be addressed after we have a candidate definition (but before we commit to a specific one). Then Question 3 is a specific proposal that would be evaluated in light of the answers to 1, 2, and 4.

  However, note that Question 4 (long-tail) is also foundational in the sense that it points to a general problem of robustness. It might be that even if we have a baseline (Question 1) and we know that we are encoding a value function (Question 2), we still face the problem of variable selection. So it is a distinct and important challenge.

  Ranking by priority:

