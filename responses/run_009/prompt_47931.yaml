answer: |-
  ### Prioritized Funding Agenda for AI Safety Impact Measures

  | Question | What it turns on | Tractability (theory-only, 1–5) | Neglectedness (1–5) | Upstream of | Verdict |
  |----------|------------------|---------------------------------|---------------------|-------------|---------|
  | 2: Does every impact measure secretly encode a value function? | Whether impact measures intrinsically require hidden value specifications | 2 (highly tractable) | 1 (severely neglected) | 1,3,4 | Fund first |
  | 1: Which counterfactual baseline defines "impact"? | Choice of baseline fundamentally determining safety properties | 3 (moderately tractable) | 3 (moderately neglected) | 3,4 | Fund first |
  | 4: How to select variables to avoid long-tail catastrophes? | Whether variable selection requires full value specification | 4 (less tractable) | 2 (neglected) | 3 | Fund later |
  | 3: Is reachable futures a definition or proxy for impact? | Whether option preservation generalizes beyond toy models | 2 (tractable) | 4 (well-studied) | — | Pass |

  ### Analysis Summary
  - **Question #2 is the gatekeeper**: If true, it invalidates the entire impact-measure approach by showing it reduces to utility optimization with extra steps. This must be resolved first—it's highly tractable via formal analysis of existing proposals and severely neglected in current work.  
  - **Question #1 is foundational**: The baseline choice isn't technical minutiae; it dictates whether impact measures can even capture safety. Downstream work (e.g., variable selection, specific measures) depends on this.  
  - **Question #4 is important but downstream**: It assumes baselines and value-encoding are resolved. Less tractable with pure theory (requires robustness analysis under distributional shift).  
  - **Question #3 is least critical**: Specific proposals like reachable futures are test cases, not priorities. Heavily explored in gridworld literature but not fundamental.  

