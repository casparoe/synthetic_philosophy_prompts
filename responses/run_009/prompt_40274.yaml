  ## Croupier's Proposition

  Heads first throw? Your purse gains two.
  Tails, then heads? Four coins for you.
  The coin is true, the table fair,
  I'll spin the chance beyond compare.
  Again, if tails? Then eight will gleam,
  A brighter, heavier golden stream.
  Should Fortune's wheel spin dark once more,
  Sixteen shall chime upon the floor.
  Then tails? The sum climbs thirty-two,
  A weighty choice presented new.
  Another miss? Then sixty-four,
  A gleaming, heavy, welcome store.
  One hundred twenty-eight? It grows,
  If tails once more before it shows.
  Two hundred fifty-six? Why not,
  If tails persist, a likely lot?
  Five hundred twelve? The numbers swell,
  A mounting, mathematic spell.
  One thousand twenty-four? Prepare,
  If tails defy the expectant air.
  Two thousand forty-eight? Still chance,
  The doubling figures start to dance.
  Four thousand ninety-six? Believe,
  The silver tongue can still deceive.
  Eight thousand one hundred ninety-two?
  The offer stands, renewed for you.

  Tails fall? The pot now stands at eight.
  Heads rise? Your claim is sealed by fate.
  Another miss? Sixteen awaits,
  As probability dictates.
  Tails spin? Then thirty-two is due,
  The golden promise gleams for you.
  Still tails? Count sixty-four instead,
  Piled high beside your waiting head.
  One hundred twenty-eight? It looms,
  Dispelling speculative glooms.

  Heads ends? Then thirty-two is paid.
  Heads? Pays one hundred twenty-eight displayed.

  Heads? Pays
  Two thousand.

  Heads?
  One hundred and...
  (wait)

