  **Notes on the Form:**

  1.  **Stanza Lengths:** 16 lines, 8 lines, 4 lines, 2 lines, 1 line, 1 fragmentary line. Each stanza halves the length of the previous one.
  2.  **Payoff Doubling:** The payoffs explicitly mentioned within each stanza double relative to the *previous payoff mentioned in the preceding stanza*:
      *   Stanza 1: Ends mentioning 8192 (2^13).
      *   Stanza 2: Mentions 8 (2^3), 16 (2^4), 32 (2^5), 64 (2^6), 128 (2^7). (Halving length, doubling payoffs *from the start of this sequence*).
      *   Stanza 3: Mentions 32 (2^5) and 128 (2^7). (32 is half the final payoff of Stanza 2 (64), 128 is double the final payoff of Stanza 2 (64)).
      *   Stanza 4: Mentions 32 (2^5) and 128 (2^7) again, but the payoff *for the heads outcome described in that stanza* is 128 (2^7), double the 64 (2^6) mentioned in Stanza 3.
      *   Stanza 5: Mentions 2000 (approximating 2048 = 2^11), double the 1024 (2^10) implied at the end of Stanza 4's sequence.
      *   Stanza 6: Mentions "One hundred and..." implying 128 (2^7) but cuts off, suggesting the doubling continues infinitely (128, 256, 512...).
  3.  **Probability Halving:** The thinning stanzas visually represent the halving probability (1/2, 1/4, 1/8, 1/16, 1/32, approaching 0) of reaching the payoff levels described in each subsequent stanza.
  4.  **The Break:** The poem ends mid-offer ("One hundred and... (wait)"), leaving the infinite expectation hanging. The reader, like the gambler, faces the unresolved question of value without a closing summation. The croupier waits, the next price unnamed, forcing the reader to confront the cost of walking away from unbounded potential.
