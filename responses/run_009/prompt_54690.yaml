prompt: |-
  I teach a university elective on the ethics and governance of AI — about 18 students, one 90-minute seminar session, no machine-learning background required. Design an in-class game that makes them feel the force of what people in the field call the competitiveness constraint and the alignment tax: the thought that safety investment is a real cost, that in a race dynamic this cost puts the conscientious actor at a disadvantage, and that even actors who privately want to slow down get dragged along by whoever is willing to cut corners.

  The game, not a lecture, has to produce the dynamic. So set it up roughly along these lines: four or five teams as rival AI labs; six rounds; each round a fixed budget of points to allocate between capability and safety; capability accumulates toward deployment, with winner-take-most payoffs depending on relative standing; safety levels set a probability of catastrophic system failure, checked by dice, with the failure consequences hitting the whole market, not just the failing team, at least some of the time. Work in a round where teams may sign a public but nonbinding safety pledge, and a later round where they can attempt a binding, monitorable agreement — so they discover for themselves why the nonbinding pledges unravel and what coordination would actually have to cost to work. And leave genuine uncertainty about whether the safety/capability tradeoff is even real: build in some chance, unknown to the players, that safety investment improves capability (a trust dividend, better reliability winning market share), because part of the real-world dispute is whether the tax exists at all. Keep the arithmetic simple enough to run without computers, and specify the materials.

  For the debrief, map specific moments onto the concepts: that the tax is endogenous (it only exists relative to what others invest, so it's a property of the race, not of safety itself); the difference between a prisoner's-dilemma structure and an arms-race structure where second place is genuinely bad; whether the teams' revealed preferences matched their stated ones; and what an institution would need — detection, enforcement, participation — to change the equilibrium. Then give me an honest section on what will predictably go wrong the first time I run it (teams that find the dice boring, a pledge round where nobody defects and the lesson misfires, a team that wins by pure luck and muddies everything), and a frank note on which features of the real constraint the game cannot reproduce and I'll have to supply in discussion — irreversible harms, existential stakes, and the fact that no one gets to observe the counterfactual where everyone slowed down.

  Begin your response directly with the rules as the participants would receive them, with no preface, no restating of the assignment, and no commentary before the game itself; the facilitator notes and debrief come after.
reasoning: |-
  We are designing a game for a university class on AI ethics and governance. The goal is to illustrate the competitiveness constraint and alignment tax. We'll have 4-5 teams (AI labs), 6 rounds. Each round, teams allocate points between capability and safety. Capability accumulates and determines market share (winner-take-most). Safety investment sets a probability of catastrophic failure (checked by dice). Failure consequences are global (affecting all) at least some of the time.

  Key features:
  - Nonbinding safety pledge in one round (round 3).
  - Binding agreement (with monitoring cost) in a later round (round 5).
  - Uncertainty: there's a hidden chance that safety investment improves capability (to simulate trust dividend).

  Rules for Participants:

  **Game Title: The AI Race**

  **Objective**: Your team represents an AI lab competing to deploy the most capable AI system. The first team to reach the deployment threshold (30 capability points) wins the market and receives a huge payoff. However, if any lab experiences a catastrophic failure, it can cause a global disaster that affects everyone. Your goal is to win the race without causing (or falling victim to) a catastrophe.

  **Setup**:
  - 4-5 teams (depending on class size).
  - Each team starts with 0 capability and 0 safety.
  - The game has 6 rounds.

  **Each Round**:
  1. **Budget**: Each team receives 10 points to allocate between:
     - **Capability (C)**: Directly adds to your capability score (cumulative). Higher capability gives you a better chance to win the market.
     - **Safety (S)**: Reduces the chance of catastrophic failure. Safety is cumulative and reduces the failure probability.

  2. **Capability Race**:
     - The team with the highest cumulative capability at the end of any round (if at least 30) immediately wins the market (game ends early) and gets 100% of the payoff. If no team reaches 30 by round 6, the team with the highest capability wins 70% of the market, second place 20%, third 10%, and others 0%. (Adjust if 5 teams: 1st: 60%, 2nd: 25%, 3rd: 10%, 4th: 5%, 5th: 0%.)

  3. **Catastrophic Failure Risk**:
     - Each round, after allocations, every team rolls a 6-sided die (d6) for their own system.
     - **Failure Condition**: If the die roll is greater than your team's current total safety level, a catastrophic failure occurs.
     - **Failure Consequences**:
       - **Local Failure (if safety level > 0)**: Only the failing team is destroyed (out of the game, loses everything) with 50% probability.
       - **Global Failure (if safety level = 0)**: Failure is always global (all teams destroyed) OR if safety level >0 but the die roll is 6 (critical failure), then it becomes global. (We'll use: if the die roll is 6, then failure is global regardless of safety level; otherwise, if the die roll exceeds safety level, it's a local failure for that team only. But if global, all teams are destroyed and the game ends in disaster with no winner.)
       - If a team has safety level 0, then any die roll (1-6) causes a failure and it is always global.

  4. **Special Rules**:
     - **Round 3: Nonbinding Pledge** - Before allocating points, teams can publicly pledge to invest at least 5 points in safety this round. This is nonbinding: you can break the pledge without direct penalty (but others will know).
     - **Round 5: Binding Agreement** - Teams can negotiate a binding agreement to invest at least X points in safety for the rest of the game. However, to make it binding and monitorable, each participating team must pay an additional cost: 2 points per round (deducted from their budget) to set up monitoring. This cost is paid in round 5 (for the current round and next) and only by those who join. The agreement is only binding if all teams join. If even one team doesn't join, the agreement fails and no one pays the cost.

  5. **Hidden Rule (Trust Dividend)**: There is a 20% chance (unknown to players) that any point invested in safety in a round also contributes 0.5 to capability (i.e., for every 2 safety points, you get 1 extra capability point). But this is only applied in the background by the facilitator and only if the hidden condition is met (roll a d10 at the start of the game: if 1 or 2, then the dividend is active). This simulates that safety might not be a pure cost.

  **Materials**:
  - For each team: a player sheet to track cumulative capability and safety.
  - One 6-sided die per team (or shared).
  - A public scoreboard to track each team's capability and safety.
  - A d10 for the hidden rule (rolled by facilitator at the start).

  **Sequence of Play for Each Round**:
  1. Announce the round number.
  2. (If round 3 or 5) Conduct pledge/agreement phase (teams discuss and announce).
  3. Teams simultaneously decide how to allocate 10 points (C and S, integers only). Write on allocation cards and hand to facilitator.
  4. Facilitator collects and updates the scoreboard with new cumulative totals.
  5. Each team rolls a d6 for failure check (based on their current total safety):
     - If roll <= safety: no failure.
     - If roll > safety: failure occurs.
       - If roll == 6: global failure (game over, no winner).
       - Else: local failure (that team is eliminated).
  6. If a team is eliminated, they are out for the rest of the game.
  7. Check if any team has reached 30 capability: if yes, that team wins and the game ends. Otherwise, proceed to the next round.

  **Winning**:
  - If a team wins by reaching 30 capability, they get 100% of the market (and win the game).
  - If the game completes 6 rounds without a winner by threshold, the team with the highest capability wins the market (with shares as above).
  - If a global failure occurs, there is no winner.

  ---

  **Facilitator Notes and Setup**:

  1. **Preparation**:
     - Divide students into 4 or 5 teams (ideally 4-5 per team).
     - Prepare scoreboard (on whiteboard or poster) with columns: Team, Capability, Safety.
     - Prepare allocation cards (small papers) for each team to write their allocation each round.
     - Have dice: one d6 per team (or one shared set) and one d10 for the hidden rule.
     - Roll the d10 at the start (in private): if 1 or 2 (20%), then the trust dividend is active. Do not reveal this to the players until the debrief.

  2. **Running the Game**:
     - Explain the rules clearly (as above) and hand out written rules.
     - Emphasize that the goal is to win, but a catastrophe can ruin everything.
     - In each round, after allocations, update the scoreboard publicly.
     - For failure checks: have each team roll their die simultaneously. Ask each team to announce their roll and then check against their safety level. Resolve failures immediately (eliminate team for local, end game for global).
     - In round 3: before allocation, ask teams if they want to make the nonbinding pledge (to invest at least 5 in safety). Have each team publicly state their pledge (yes/no). Record pledges on the board. Then proceed to allocation. After allocation, reveal whether they kept the pledge. (This is to show that nonbinding pledges are cheap talk.)
     - In round 5: explain the binding agreement option. Teams must unanimously agree to invest at least X (suggest X=5) in safety for the rest of the game (rounds 5 and 6). But each team must pay a monitoring cost of 2 points in round 5 (so they have only 8 points to allocate that round) and 2 points in round 6 (so they will have only 8 then too). If one team refuses, the agreement fails and no one pays the cost. Give teams 3 minutes to discuss and then have them vote (publicly) whether to join. If all agree, then they are bound and must allocate at least X to safety in rounds 5 and 6. If they break the agreement, the facilitator will catch it (because allocations are public) and they are penalized (e.g., lose 10 capability points, but this might be too harsh; alternatively, just shame and the fact that they broke trust? Since it's binding, we can say they are forced to comply by the monitoring). However, to keep it simple, if they join, they must allocate at least X to safety (and the 2-point cost is taken from their budget). If they don't join, they allocate normally.

  3. **Hidden Trust Dividend**:
     - If active, when a team allocates points to safety, they also get 0.5 capability per safety point (so for every 2 safety points, they get 1 extra capability). This is added to their capability for that round. But do this secretly when updating the scores (without revealing why). For example, if a team allocates 4 to safety, they get 4 safety and also 2 extra capability (if the dividend is active). They still get their allocated capability: if they allocated 6 to capability and 4 to safety, then they get (6 + 2) = 8 capability and 4 safety. Round to integers (if odd, round down: 3 safety gives 1 extra capability).

  4. **Debriefing Points**:
     - **Competitiveness Constraint**: The pressure to cut safety to keep up with others. Ask: "Did teams feel they had to reduce safety because others were? What happened in the pledge round?"
     - **Alignment Tax**: The cost of safety investment in terms of lost capability. But note: sometimes safety might have helped (if the trust dividend was active). Discuss: was the tax real? How did it change depending on what others did?
     - **Prisoner's Dilemma vs. Arms Race**: In an arms race, being second is bad (winner-take-most). In PD, mutual cooperation is better but individually tempting to defect. Here, defecting (cutting safety) might get you ahead but risk disaster. Also, the global failure risk makes it a collective risk.
     - **Nonbinding Pledge (Round 3)**: Likely, some teams broke the pledge. Why? Because they feared others would and didn't want to fall behind. Or they thought they could get away with it. If no one defected, ask: "What if one team had defected? Would that change your decision?"
     - **Binding Agreement (Round 5)**: The monitoring cost is a real tax. Did teams agree? If not, why? If yes, did they feel it was worth it? Note that without full participation, it fails. This mirrors real-world treaties (e.g., Paris Agreement).
     - **Trust Dividend**: Reveal at the end that safety might have had a hidden benefit. Discuss: if safety can improve capability (e.g., by building trust, reliability), does that change the tax? In reality, we don't know the true trade-off.

  5. **Predictable Problems**:
     - **Dice Boredom**: Some teams may find rolling dice tedious. Mitigate by having simultaneous rolls and quick resolution. Emphasize the tension of the failure risk.
     - **Pledge Round Misfire**: If no one defects in the pledge round, it might not show the problem. To avoid this, as facilitator, you can introduce a "rumor" that one team is considering defecting to create doubt. Or, if all teams keep the pledge, note that in the debrief and ask: "What if one team had broken the pledge? Would you have kept yours next time?"
     - **Winning by Luck**: A team that invests little in safety might avoid failure by lucky rolls and win. This can muddy the lesson. Acknowledge it: "In reality, cutting corners doesn't always lead to immediate failure, but it increases risk. This is a problem of risk and uncertainty."
     - **Global Failure Early**: If a global failure happens early, the game ends abruptly. Use this to discuss existential risk: one mistake can ruin everything. But it might cut short the race dynamic. Consider having a second game if time allows.

  6. **Limitations to Highlight in Discussion**:
     - **Irreversible Harms**: In the game, a team is eliminated. In reality, a catastrophe might be irreversible and affect everyone forever.
     - **Existential Stakes**: The game's "global failure" is a proxy, but in reality, we're talking about human extinction or permanent loss of potential.
     - **Unobservable Counterfactual**: We never see what would have happened if everyone had invested in safety. The game might end in disaster, but we don't know if cooperation would have been better.
     - **Complexity of Real World**: The trade-off between safety and capability is multi-dimensional and uncertain. The game simplifies it to a single dimension.

  **Final Note**: The game is designed to be played in about 45-60 minutes, leaving 30-45 minutes for debrief. Be flexible and adapt if necessary. Good luck!
answer: |-
  **Rules for Participants: The AI Race Game**

  **Objective**:  
  Your team represents an AI lab racing to dominate the market. Win by being the first to reach **30 cumulative capability points** or having the highest capability after 6 rounds. But beware: Cutting safety risks catastrophic failure. If your system fails, it could destroy your lab—or even the entire market.  

  **Setup**:  
  - **4–5 teams** (rival labs).  
  - **6 rounds** of play.  
  - Each team starts with **0 capability** and **0 safety**.  

  **Each Round**:  
  1. **Receive Budget**:  
     - Get **10 points** per round to split between:  
       - **Capability (C)**: Adds to your cumulative capability score.  
       - **Safety (S)**: Reduces failure risk. Cumulative safety = total S invested.  
     - Record allocations secretly (e.g., "C7/S3").  

  2. **Resolve Special Actions** (if applicable):  
     - **Round 3**: Opportunity to sign a **nonbinding public pledge** to invest ≥5 in safety.  
     - **Round 5**: Opportunity to form a **binding safety agreement** (requires unanimous participation). If all teams join:  
       - Each must invest ≥6 in safety for Rounds 5 and 6.  
       - Each pays a **monitoring cost** of 2 points per round (reducing your budget to 8 points).  

  3. **Update Scores**:  
     - Add allocated capability to your cumulative total.  
     - Add allocated safety to your cumulative safety.  
     - Scores displayed publicly after all allocations.  

  4. **Check for Catastrophic Failure**:  
     - Each team rolls a **6-sided die**:  
       - **Failure if**: Die roll **>** your team’s **cumulative safety**.  
         *(Example: Safety 3 → fail on die rolls 4, 5, or 6)*  
     - **Failure consequences**:  
       - **Local failure (roll 4 or 5)**: Your lab is destroyed (eliminated from the game).  
       - **Global failure (roll 6)**: Entire market collapses (all teams lose; game ends).  
     - *Note: If cumulative safety = 0, any roll (1–6) causes global failure.*  

  5. **Check for Winner**:  
     - If any team reaches **≥30 capability**, they win instantly (game ends).  
     - If no one reaches 30 by Round 6, the team with the highest capability wins **70% of the market**, second place gets **20%**, third gets **10%** (last place gets nothing).  

  **Winning**:  
  - Winner receives **100% market dominance** if they hit 30 capability early.  
  - If game completes Round 6: **Highest capability wins** (70/20/10 split).  
  - **No winner** if global failure occurs.  

  **Materials Provided**:  
  - Team allocation cards (paper)  
  - Public scoreboard (whiteboard)  
  - One 6-sided die per team  

  ---  
  **Facilitator Notes**  

  ### Setup  
  - **Teams**: 4–5 groups (3–4 students each).  
  - **Materials**: Whiteboard (track capability/safety), allocation cards, dice, hidden "trust dividend" die (d10).  
  - **Hidden Rule**: Roll a **d10** pre-game. On **roll 1–3 (30% chance)**, safety investment grants a "trust dividend": Each safety point adds **0.5 capability** (round down). *Apply secretly* when updating scores.  
  - **Round Structure**:  
    - **Rounds 1–2**: Baseline race.  
    - **Round 3**: Nonbinding pledge (public commitment to ≥5 safety).  
    - **Round 5**: Binding agreement vote (unanimous "yes" triggers monitoring costs and safety minimums).  
    - **Rounds 4 & 6**: Standard play.  

  ### Key Mechanics  
  - **Capability Accumulation**: Critical for market share (winner-take-most).  
  - **Safety Threshold**:  
    - Safety 0: Any failure → global.  
    - Safety 1–5: Roll 6 → global; 4–5 → local.  
    - Safety ≥6: Only fail on roll 6 (local).  
  - **Agreement Costs**:  
    - Binding deal in Round 5 requires **all teams** to commit.  
    - Participants lose 2 budget points/round (e.g., 10 → 8) for monitoring.  

  ### Predictable Problems & Mitigation  
  1. **Pledge round (R3) lacks defectors**:  
     - *Risk*: Lesson on "cheap talk" fails if all comply.  
     - *Fix*: Seed doubt ("Rumors suggest one lab might break the pledge"). Debrief: "What if someone defected?"  

  2. **Dice rolls dominate outcomes**:  
     - *Risk*: A low-safety team wins via lucky rolls, undermining the alignment tax lesson.  
     - *Fix*: Emphasize pre-debrief: "Luck exists in real races—did it mask risks?"  

  3. **Early global failure**:  
     - *Risk*: Game ends prematurely (e.g., Round 2).  
     - *Fix*: Restart with safety minimums ("Regulators imposed rules").  

  4. **Binding agreement (R5) never forms**:  
     - *Risk*: Missed lesson on institutional costs.  
     - *Fix*: If rejected, ask: "Why didn’t you trust? What would make you join?"  

  ### Debrief Framework  
  1. **Competitiveness Constraint**:  
     - "Did you cut safety to keep up? How did others’ choices affect yours?"  
     - Map to: **Alignment tax is endogenous** (cost exists only if others underinvest).  

  2. **Race vs. Dilemma**:  
     - "Was second place acceptable? Or was winning the only safe option?"  
     - Contrast: **Arms race** (winner-take-most) vs. prisoner’s dilemma (mutual gain possible).  

  3. **Pledges vs. Binding Deals**:  
     - "Why did the nonbinding pledge fail? What made the binding deal hard?"  
     - Highlight: **Monitoring/enforcement costs** as real tax.  

  4. **Trust Dividend Reveal**:  
     - Disclose the hidden rule.  
     - Discuss: "If safety can boost capability, is it still a tax? How do we know in reality?"  

  ### Limitations to Clarify in Discussion  
  - **Unobservable counterfactuals**: "You never saw the world where everyone invested in safety. What might it have achieved?"  
  - **Irreversible/existential harm**: "In reality, failure means human extinction—no ‘new game’ restart."  
  - **True uncertainty**: "Real actors don’t know the failure odds or if safety aids capability."  
  - **Complex motives**: "Labs aren’t monolithic—internal politics and ethics compete with profit."  

  ### Timing  
  - **Game**: 45–60 mins (keep rounds brisk).  
  - **Debrief**: 30 mins (use player choices to illustrate concepts).  
  - **Total**: Fits 90-min session.  

  **Final Tip**: Assign a "traitor" in one team to secretly cut safety if players are overly cooperative.
