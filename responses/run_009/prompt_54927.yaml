answer: |-
  Your articulation is exceptionally clear, and the puzzle you've identified sits at the heart of debates in the metaphysics of laws and scientific explanation. It's a profound tension between **descriptive regularity** and **explanatory power**. Let's break this down systematically.

  ### Core Problem: Explanatory Circularity of Descriptive Laws
  Your worry is this: **If laws are merely compact summaries (descriptions) of all events, then citing a law to explain an individual event is circular and non-explanatory.** "Event X occurred because it instantiates pattern P" reduces to "Event X occurred because events like X occur," which is vacuous. This is distinct from induction (which concerns *justification* for projecting patterns) and causation (which involves mechanisms). Your focus is on *what laws **are*** and how that ontology affects their explanatory role.

  ---

  ### 1. **Established Name & Literature Home**
  This is primarily debated under **Humeanism vs. Anti-Humeanism about Laws of Nature**:
  - **Humeanism** (David Lewis, Barry Loewer): Laws are the axioms of the "Best System" (most balanced simplicity+strength) summarizing all events in spacetime. Laws *supervene* on particular facts; they don't add new "modal oomph."
  - **Anti-Humeanism** (David Armstrong, Fred Dretske, Michael Tooley): Laws are irreducible relations of **nomic necessity** (e.g., universals governing particulars). Laws *make* events happen.

  **Your Exact Worry** is the **Humean Explanatory Challenge**:  
  If laws are descriptive summaries, how can they *explain* rather than merely *describe*? This is central to critiques of Humeanism. Key papers:
  - Bas van Fraassen's *Laws and Symmetry* (1989) – Attacks law-based explanation as circular.
  - John Carroll's *Nailed to Hume's Cross?* (2008) – Explores whether Humeans can avoid explanatory vacuity.
  - Helen Beebee's *The Non-Governing Conception of Laws* (2000) – Argues Humean laws *can* explain pragmatically.

  **Established Name:**  
  **"Explanatory Vacuity of Descriptive Laws"** or **"Humean Explanatory Circularity."**  
  It’s a subset of the **"Problem of Lawhood"**: What *makes* a generalization a law rather than an accident?

  ---

  ### 2. **Nearest Neighbors & Distinctions**
  | Concept | How Your Worry is Similar | How It Differs |
  |---------|---------------------------|----------------|
  | **Problem of Induction** | Both question the epistemic status of patterns. | Induction asks: "Why trust the curve for *new* data?" Your worry asks: "Why think the curve *explains existing* data?" Your issue is metaphysical/explanatory, not epistemic. |
  | **Causal vs. Non-Causal Explanation** | Both involve types of explanatory dependence. | Causal explanation relies on mechanisms (e.g., molecular bonds breaking). Your worry targets *non-causal* explanations (e.g., conservation laws) and whether they reduce to tautology. |
  | **Mere Regularity vs. Necessity** | Both contrast "patterns" with "governance." | Your focus is the **explanatory cost**: Does describing a pattern *as a law* add value, or is it circular? |
  | **Pragmatic vs. Ontic Explanation** (van Fraassen) | Both acknowledge context-dependence. | You resist dismissing the circularity as *merely* pragmatic—it feels like an ontological shortfall. |

  **Crucial Distinction:**  
  Your worry arises when **citing a law *piecemeal*** (e.g., "conservation laws caused the shattering"). A Humean might argue that only the *whole system* explains, but this doesn’t resolve the circularity for individual events.

  ---

  ### 3. **Coined Concept: "Atomistic Explanatory Vacuity (AEV)"**
  If we need a precise label capturing your unique framing:  
  **Definition:**  
  > **Atomistic Explanatory Vacuity (AEV)** is the circularity arising when a law of nature, construed as a descriptive generalization over a domain of events, is invoked to explain an individual event within that domain, rendering the explanation vacuous ("it happened because things like it happen").

  **Boundaries from Your Cases:**  
  | Feature | How AEV Handles It |
  |---------|---------------------|
  | **Compression as Explanatory** | AEV grants that compression is *epistemically* useful but denies it provides *ontic* explanation for token events. The system-level summary explains patterns; it doesn’t explain *why* this event fits the pattern. |
  | **Counterfactual Support** | AEV argues that descriptive laws support counterfactuals *only if* they smuggle in hidden modality (e.g., "thicker glass" implies a *necessary connection* between properties). Pure summaries lack this; they only describe actuals. |
  | **The Know-It-All (Laplace's Demon)** | AEV is *exposed* by the know-it-all: If they know all events, being told the "law" adds nothing. This shows the circularity isn’t just pragmatic—it’s ontological. |

  **What AEV is NOT:**  
  - Not about *predictive utility* (your curves are fine for that).  
  - Not solved by saying laws are "inference tickets" (that addresses epistemology, not explanation).  
  - Not applicable to *non-Humean* laws (e.g., Armstrong's universals avoid AEV by adding necessitation).

  ---

  ### Professional Resolution Paths
  1. **Humean Pragmatism** (Lewis, Loewer):  
     Laws explain by providing the *simplest framework* to infer events. Circularity is avoided because laws are part of a cohesive system. Your "know-it-all" objection is sidelined as irrelevant—explanation is for humans.  
     *Your counter*: This feels like conceding laws don’t *really* explain; they’re cognitive tools.

  2. **Anti-Humean Necessitation** (Armstrong, Maudlin):  
     Laws are primitive enforcers: Conservation laws *make* the window shatter as it did. This avoids circularity but posits mysterious "modal glue."  
     *Your counter*: Why prefer this over descriptive summaries?

  3. **Pragmatic/Contextual Explanation** (van Fraassen):  
     "Explanation" is answering context-dependent questions. Citing a law answers "Why expect this *type* of event?" Circularity dissolves if we stop demanding "deeper" causes.  
     *Your counter*: But physics *feels* like it’s describing reality’s structure.

  ---

  ### Why This Matters
  Your intuition exposes a rift: Science uses laws **as if** they govern, but metaphysics struggles to ground this without circularity or mystery. AEV sharpens the challenge for Humeans: **How can a summary *explain* what it summarizes?** The literature hasn’t settled this, but your framing—especially the "piecemeal vs. system" tension—advances the debate. If you explore further, start with Maudlin's *The Metaphysics Within Physics* (2007) for anti-Humean rigor, or Loewer's "Humean Supervenience" (1996) for the Humean defense. 

