prompt: |-
  I'm the data governance lead at a mid-size agritech company, which in practice means I chair the fortnightly ontology review meeting where our different teams try to keep a shared crop/pest knowledge graph from falling apart. Every few weeks we get the same fight in a different costume, and it's eating our sprint time. Latest round: one team models a barley variety as a class whose members are the individual plants, another models the variety as a single historical lineage that individual plants are *parts* of, and both are convinced the other side has made a factual error rather than a modeling choice. Similar blowups about whether a "field" is the legal parcel or the planted area when the two diverge (we lease half of one field to a neighbor who farms it differently), and whether a "drought event" is a disposition a region has or a process that unfolds over months. I've started to suspect that at least some of these are what philosophers would call merely verbal disputes — that nobody actually disagrees about which plants exist or what data we'd write down, and we're just using words differently — but some of them are genuinely substantive, because the two models produce different query results or different predictions, and I can't currently tell which fights are which.

  I took one philosophy course in college, so I know just enough to be dangerous: I remember there being a literature on how to tell whether a dispute is verbal or substantive (some kind of substitution or elimination test? swapping the word out and seeing if a disagreement survives?), and something vaguely Carnapian about internal questions you can answer inside a framework versus external questions about the framework itself, and I gather there are also serious metaphysicians who would insist some of these questions are perfectly real and not verbal at all. That's about the depth I have. What I need is this stuff turned into something my review board — six engineers, one hour, no philosophers — can actually run when one of these fights breaks out: an ordered set of questions to ask, what counts as a sufficient answer to each, where the procedure can stop and say "this one is just words, pick a convention," where it has to say "no, this one is substantive, you actually have to go look at the data," and crucially where it has to admit the question is real but not resolvable by us before the sprint ends, so it hands the decision to a named person on values/utility grounds rather than pretending the procedure settled it.

  A few constraints. Whatever tests you give us have to be runnable by engineers with the entities in front of them, not by people who've read the literature — so if a philosophical distinction won't survive that translation, tell me and drop it rather than smuggling it in as jargon. The procedure also needs to handle the awkward middle case I keep running into: a dispute that IS verbal in the sense that nothing in the world turns on it, but where the convention we pick still has real downstream costs (query performance, who maintains the ontology, what the field agronomists are used to) — a verdict of "verbal" can't just end the meeting, it has to route us to a principled way of choosing between equally "correct" options. Finally, run the procedure on the three cases above (variety-as-class vs variety-as-individual, the leased field, the drought event), and don't go easy on me: I've been insisting the variety is a class for four years, and if the procedure says I was having a verbal dispute this whole time and just didn't notice, I want it to say that. Also flag honestly where you think the procedure is most likely to misfire — I'd rather know now than find out from a support ticket.
reasoning: |-
  We are given a real-world problem in data governance for an agritech company. The core issue is recurring disputes over ontology modeling that consume significant time. The data governance lead suspects that some disputes are merely verbal (differences in terminology without factual disagreement) while others are substantive (leading to different outcomes). The goal is to create a practical, step-by-step procedure that a team of engineers can run in about an hour to resolve such disputes. The procedure should:

  1. Distinguish verbal from substantive disputes.
  2. For verbal disputes, provide a principled way to choose a convention (because even verbal disputes can have real costs).
  3. For substantive disputes, either:
     a. Resolve by looking at data (if possible in the time frame), or
     b. Delegate to a named person for a decision based on values/utility if not resolvable quickly.

  The procedure must be runnable by engineers without philosophical training, using the entities (data models) in front of them.

  We are also to test the procedure on three examples:
  1. Barley variety modeled as a class (with individual plants as members) vs. as a single historical lineage (with individual plants as parts).
  2. "Field" as a legal parcel vs. the planted area (when they diverge, e.g., leasing part of a field).
  3. "Drought event" as a disposition (a state) vs. a process unfolding over time.

  Additionally, we must flag where the procedure might misfire.

  ### Philosophical Background (for reference, but to be translated into practical steps)

  The lead mentions:
  - **Verbal vs. Substantive Disputes**: A dispute is verbal if it disappears when the terms are clarified or substituted. A classic test is the "substitution test": if replacing the contentious terms with new ones (or providing explicit definitions) makes the disagreement vanish, then it's verbal. Otherwise, it's substantive.
  - **Carnap's Internal/External Questions**: Internal questions are those asked within a framework (e.g., "Is this plant a member of variety X?"), which can be answered by evidence. External questions are about the choice of framework (e.g., "Should we model varieties as classes or as individuals?"), which are pragmatic and based on the utility of the framework.

  ### Proposed Procedure: The Ontology Dispute Resolution Protocol (ODRP)

  We design a step-by-step procedure that the chair can lead the team through. Each step is a question to ask, and the team must provide concrete answers. The procedure should take no more than 60 minutes.

  **Step 1: Isolate the Disputed Term(s) and the Two Models (5 minutes)**
     - Clearly state the term in dispute (e.g., "barley variety", "field", "drought event").
     - Have each side succinctly describe their model (e.g., "Model A: variety as a class; Model B: variety as an individual lineage").
     - **Output**: Two distinct models (A and B) for the same term.

  **Step 2: The Factual Agreement Test (10 minutes)**
     - Ask: "If we set aside the term itself, do we agree on all the underlying facts and data that we would record about the real world?"
     - For example, for the barley variety:
          - Do both sides agree on which plants exist?
          - Do both sides agree on the genetic lineage of the plants?
          - Do both sides agree on the data we would record (e.g., the GPS location of each plant, the genetic markers, the harvest dates)?
     - **Purpose**: This step checks if there is an underlying factual disagreement. If there is, then the dispute is substantive and we jump to Step 4.
     - **Decision**:
          - If there is factual disagreement (e.g., one team believes the genetic lineage is X and the other Y), then mark as substantive and go to Step 4.
          - If there is full agreement on facts, then proceed to Step 3.

  **Step 3: The Substitution Test (Verbal Dispute Check) (10 minutes)**
     - **Test**: Replace the disputed term with two new, distinct terms (e.g., for "variety", use "VarietyClass" and "VarietyLineage") and see if the disagreement remains.
          - Example: In Model A, we say "Plant123 is a member of VarietyClass_X". 
          - In Model B, we say "Plant123 is part of VarietyLineage_X".
          - Now, ask: Is there any disagreement about the facts of Plant123 and VarietyClass_X / VarietyLineage_X? If not, then the original dispute was verbal.
     - **Additional Check**: Ask: "If we use Model A, would we record a fact that we would not record in Model B, or vice versa?" (This is the data record test.)
     - **Purpose**: To confirm that the two models are just two ways of describing the same set of facts.
     - **Decision**:
          - If the disagreement vanishes with the substitution and both models record the same set of facts (just structured differently), then the dispute is verbal. Proceed to Step 5 (choosing a convention).
          - If not, then the dispute is substantive (because the models lead to different data records or different inferences). Proceed to Step 4.

  **Step 4: Substantive Dispute Resolution (20 minutes)**
     - **Step 4a: Testability Check (5 minutes)**
          - Ask: "Can we design a real-world test (using existing or easily collectible data) that would give different results under the two models? And can we run this test in the next week (i.e., within a sprint)?" 
          - Example for the barley variety: 
              - Model A (class) might lead to a query: "Count all plants that are members of Variety X." 
              - Model B (individual) might lead to: "Count all plants that are parts of the VarietyLineage X." 
              - But if both models count the same set of plants, then the query result is the same. However, if one model includes plants that the other does not (due to different criteria for membership vs. parthood), then we have a testable difference.
          - If a test is possible and can be run quickly, then: 
              - Assign someone to run the test and report at the next meeting. 
              - **Output**: Adjourn the dispute until the test is done.
          - If a test is possible but cannot be run quickly, or if it is not testable at all, then proceed to Step 4b.

     - **Step 4b: Values/Utility Decision (15 minutes)**
          - Since we cannot resolve by data quickly, we must decide based on practical considerations. 
          - List the pros and cons of each model in terms of:
              1. **Performance**: Impact on query speed, storage, etc.
              2. **Maintainability**: Ease of updating, consistency with existing ontologies.
              3. **Usability**: Familiarity to end-users (e.g., field agronomists).
              4. **Extensibility**: Ability to accommodate future use cases.
          - Assign a decision-maker (e.g., the data governance lead, a product owner, or a domain expert) to make the call based on these factors. The decision-maker must be named and the decision recorded.
          - **Output**: A decision on which model to adopt, with reasons documented.

  **Step 5: Verbal Dispute Resolution (10 minutes)**
     - Even though the dispute is verbal, we must choose one convention for the sake of consistency and to avoid future confusion.
     - Use the same criteria as in Step 4b (performance, maintainability, usability, extensibility) to evaluate the two modeling choices.
     - Assign a decision-maker (same as above) to choose the convention. The decision should be based on practical costs and benefits, not on "correctness" (since both are equally valid representations of the facts).
     - **Output**: A chosen model, with the understanding that it is a convention.

  **Step 6: Documentation and Communication (5 minutes)**
     - Document the decision, the reasoning, and the chosen model in the ontology.
     - Plan to communicate the decision to relevant teams to prevent future disputes.

  ### Applying the Procedure to the Examples

  #### Example 1: Barley Variety (Class vs. Individual Lineage)

  - **Step 1**: Disputed term: "barley variety". Model A: variety as a class (individual plants are members). Model B: variety as an individual (a lineage, with plants as parts).
  - **Step 2: Factual Agreement Test**: 
     - Both sides agree on the existence of individual plants, their genetic markers, and the historical breeding data. They also agree on which plants are of the same genetic lineage. 
     - **Verdict**: Factually agreed -> proceed to Step 3.
  - **Step 3: Substitution Test**:
     - Replace "variety" with two terms: "VarietyClass" and "VarietyLineage".
     - In Model A: "Plant123 is a member of VarietyClass_X".
     - In Model B: "Plant123 is part of VarietyLineage_X".
     - The facts about Plant123 and its relation to X are the same in both models? Yes. 
     - Data record test: Both models would record the same data about the plants and the lineage. 
     - **Verdict**: Verbal dispute -> proceed to Step 5.
  - **Step 5: Verbal Dispute Resolution**:
     - Evaluate the two models on practical grounds:
          - Performance: Modeling as a class might allow for easier querying of plant counts (if the system is optimized for class membership). Modeling as an individual might be better for tracking the lineage over time (if we need to treat the lineage as a whole in processes).
          - Maintainability: If the rest of the ontology uses classes for similar concepts (e.g., species, diseases), then class might be more consistent. If we have other lineages (e.g., for pests), then individual might be better.
          - Usability: Agronomists might be used to thinking of a variety as a type (class) rather than an individual.
          - Extensibility: If we need to attach properties to the variety as a whole (e.g., year of development, breeder), then modeling as an individual might be more natural (because classes are not typically the subject of time-bound properties). 
     - Decision-maker (e.g., the data governance lead) chooses based on these factors. 
     - **Note**: The lead has been insisting on class, but the procedure might reveal that for extensibility (attaching historical data to the lineage) the individual model is better. The lead must be prepared to change if the practical factors favor the other model.

  #### Example 2: Field (Legal Parcel vs. Planted Area)

  - **Step 1**: Disputed term: "field". Model A: legal parcel (as defined by property boundaries). Model B: planted area (the contiguous area where a crop is planted).
  - **Step 2: Factual Agreement Test**:
     - Both sides agree on the existence of the legal parcel boundaries and the actual planted areas (which might be a subset due to leasing). They also agree on the data: GPS coordinates of the legal parcel and the GPS coordinates of the planted area.
     - **Verdict**: Factually agreed -> Step 3.
  - **Step 3: Substitution Test**:
     - Replace "field" with "LegalParcel" and "PlantedArea".
     - Example: In a scenario where half of a legal parcel is leased and planted differently:
          - Model A: There is one LegalParcel (the whole parcel) and two PlantedAreas (one for each half).
          - Model B: The term "field" is used only for the PlantedArea, so there are two fields (each half).
     - Now, do we have the same facts? Yes, because we have the same geometries and the same crop data. But note: the two models lead to different counts of "fields". 
     - However, the disagreement is about the definition of the term "field". Without the term, we agree on the underlying spatial and crop data.
     - Data record test: Both models would record the same geometries and crop data. In Model A, we would record the legal parcel and then the planted areas within it. In Model B, we would record two planted areas (and also the legal parcel if needed for other purposes?).
     - **But wait**: If one model only records the legal parcel and the other only records the planted area, then we have a difference in what data is recorded. However, the problem states that the two models are about how to model the concept of "field" in the ontology. We assume that both teams agree that both the legal parcel and the planted area are important and must be represented. The dispute is about which one gets the label "field".
     - **Verdict**: If both models can represent both concepts (just with different primary labels), then it's verbal. But if one model fails to represent one of the concepts (e.g., Model B does not record the legal parcel at all), then it's substantive. Let's assume both concepts are represented in both models (with different names). Then it's verbal -> Step 5.
  - **Step 5**: 
     - Practical considerations:
          - Performance: Having two concepts (LegalParcel and PlantedArea) might be more flexible but require more joins. 
          - Maintainability: The legal parcel is stable, while planted areas change every season. If "field" is used in many places to refer to the planted area, then Model B might be more natural for agronomists.
          - Usability: Field operations are about the planted area, but leasing and compliance require the legal parcel. We might need both, and the term "field" might be ambiguous. A better approach might be to avoid overloading "field" and have two distinct concepts. But the dispute is about the primary meaning of "field". 
          - Extensibility: Having distinct concepts for legal and planted is more extensible (e.g., adding a third concept for managed area).
     - Decision: Choose a convention that either:
          a) Reserve "field" for the legal parcel and call the planted area something else (e.g., "plot"), or
          b) Reserve "field" for the planted area and call the legal parcel "parcel".
     - The decision-maker must choose based on the dominant use in the company and the cost of changing existing code.

  #### Example 3: Drought Event (Disposition vs. Process)

  - **Step 1**: Disputed term: "drought event". Model A: a disposition (a state of a region, e.g., "Region R is in drought"). Model B: a process (an event that unfolds over time, e.g., "The drought that started in June and ended in August").
  - **Step 2: Factual Agreement Test**:
     - Both sides agree on the meteorological data (rainfall, temperature, etc.) and the impacts on crops. They agree on the timeline of when water stress occurred.
     - **Verdict**: Factual agreement -> Step 3.
  - **Step 3: Substitution Test**:
     - Replace with "DroughtState" (disposition) and "DroughtProcess" (process).
     - Example: 
          - Model A: "Region R has the DroughtState from June to August."
          - Model B: "There is a DroughtProcess that occurs in Region R from June to August."
     - The facts about the region and the period are the same. 
     - Data record test: Both models would record the same data (the region, the start and end dates, and the severity). 
     - **But note**: The two models might differ in what properties they attach. For example, a process might have stages (intensifying, diminishing) while a state might have a severity level. However, if both models can represent the same information (e.g., the state model can have time-varying severity, and the process model can have an overall severity), then the difference is in the structure, not the data.
     - **Verdict**: Verbal dispute -> Step 5.
  - **Step 5**: 
     - Evaluate:
          - Performance: Representing a drought as a process might be more complex (with temporal parts) but allow for more detailed tracking. A state might be simpler for queries like "Is there a drought now?".
          - Maintainability: If other events (e.g., pest outbreaks) are modeled as processes, then consistency would favor process. If we model many conditions as states (e.g., soil moisture level), then state might be consistent.
          - Usability: Agronomists might think of a drought as an ongoing condition (state) or as an event (process) depending on context.
          - Extensibility: If we want to link the drought to specific mitigation actions (which are events), then a process might be more natural.
     - Decision: Choose based on the dominant pattern in the existing ontology and the expected use cases.

  ### Where the Procedure Might Misfire

  1. **False Verbal Verdict**: If there is a subtle factual disagreement that the team overlooks in Step 2, the procedure might misclassify a substantive dispute as verbal. This could lead to choosing a convention that doesn't fit the facts. To mitigate, be thorough in Step 2 and include domain experts.

  2. **False Substantive Verdict**: If the team cannot see that two models are equivalent (e.g., because of a lack of imagination in the substitution test), they might think there's a substantive dispute when there isn't. This might lead to unnecessary testing or delegation.

  3. **Time Constraints**: The one-hour limit might force a decision in Step 4b or Step 5 without a full analysis. This is acceptable because the goal is to unblock the sprint, but it might lead to suboptimal choices. Documenting the decision and revisiting if problems arise is important.

  4. **Ambiguity in Step 3 (Data Record Test)**: If the two models lead to different data structures but the same underlying information, it might be hard to judge. For example, one model might normalize data and the other denormalize. The team must focus on whether the same real-world facts are captured, not the storage format.

  5. **Overlooking Downstream Effects**: The practical evaluation (Steps 4b and 5) might not capture all costs, such as the cost of changing existing reports or integrations. Including a representative from the affected teams can help.

  Despite these risks, the procedure provides a structured way to move forward and should reduce meeting time and frustration.

  ### Final Note

  The procedure is designed to be iterative and can be revisited if new information emerges. It also promotes documentation and communication, which are key to data governance.
answer: |-
  Here's a practical **Ontology Dispute Resolution Protocol** tailored for your team. It's a 6-step checklist designed to run in 60 minutes or less, with clear outputs and decision points. I'll first outline the protocol, then apply it rigorously to your three cases (including calling you out where warranted), and finally flag potential failure points.

  ---

  ### **The Ontology Dispute Resolution Protocol (ODRP)**
  **Timebox:** 60 mins max  
  **Participants:** Chair (you), 6 engineers, domain expert (if needed)  
  **Input:** Disputed term, two competing models  
  **Output:** Resolution type (verbal/substantive), decision, or delegation  

  #### **Step 1: Factual Agreement Check** (10 mins)  
  **Question:** *"If we remove the disputed term, do we agree on ALL observable data this represents?"*  
  - **Check:** List concrete, measurable attributes (e.g., GPS coordinates, dates, sensor readings, genetic markers).  
  - **Sufficient Answer:** Full consensus on data points. If disagreement, document the *specific* contested facts.  
  - **Next Step:**  
    - Agreement → Proceed to Step 2.  
    - Disagreement → Jump to Step 4 (substantive).  

  #### **Step 2: Substitution Test** (15 mins)  
  **Question:** *"If we replace the term with neutral labels (e.g., 'Thing A'/'Thing B'), does the conflict vanish?"*  
  - **Check:**  
    - Rebuild a minimal query/report using both models with placeholder terms.  
    - Compare outputs: Do they produce identical results for all known use cases?  
  - **Sufficient Answer:**  
    - Outputs match → Verbal dispute (proceed to Step 3).  
    - Outputs differ → Substantive dispute (proceed to Step 4).  

  #### **Step 3: Verbal Dispute Confirmation** (5 mins)  
  **Question:** *"Are there ANY scenarios where the modeling choice changes actionable outcomes?"*  
  - **Check:** Stress-test with edge cases (e.g., data inheritance, time-travel queries, regulatory reports).  
  - **Sufficient Answer:**  
    - No impact → Confirm verbal dispute.  
    - Impact found → Reclassify as substantive (go to Step 4).  
  - **Output:** Verbal dispute verdict. Proceed to **Convention Selection** (Step 5).  

  #### **Step 4: Substantive Dispute Triaging** (20 mins)  
  **Question:** *"Can we resolve this with a quick test using existing data?"*  
  - **Check:**  
    - Design a falsifiable test (e.g., run a prediction model with both ontologies, compare to ground truth).  
    - Estimate time/resources for test.  
  - **Sufficient Answer:**  
    - Testable in <2 days → Assign owner, pause dispute until test results.  
    - Untestable or too slow → Delegate to **Values Decision** (Step 6).  

  #### **Step 5: Convention Selection** (10 mins)  
  *(For verbal disputes with practical costs)*  
  **Question:** *"Which convention minimizes total cost across these dimensions?"*  
  - **Evaluate:**  
    1. **Query Performance** (e.g., JOIN complexity)  
    2. **Change Impact** (e.g., breaking existing reports)  
    3. **Domain Fit** (e.g., agronomists' mental models)  
    4. **Maintenance Overhead** (e.g., who owns updates)  
  - **Decision Rule:** Assign a decider (e.g., lead engineer, product owner) to weigh factors. Document rationale.  

  #### **Step 6: Values Decision** (10 mins)  
  *(For substantive disputes where data won't resolve)*  
  **Question:** *"Which model better serves our primary business goal?"*  
  - **Criteria:** Prioritize one:  
    - Accuracy in predictions  
    - Regulatory compliance  
    - Performance at scale  
    - User experience  
  - **Output:** Named decider (e.g., CTO, chief agronomist) makes call based on values. Sunset debate.  

  ---

  ### **ODRP Applied to Your Cases**
  **Case 1: Barley Variety (Class vs. Individual Lineage)**  
  - **Step 1:** Factual agreement? **YES**. Both agree on plant locations, genetics, harvest dates.  
  - **Step 2:** Substitution test:  
    - Query: *"Yield of Variety X in 2023"* → Same result whether plants are "members of" or "parts of" X.  
    - Outputs match → **Verbal dispute**.  
  - **Step 3:** Edge case: *"Is a plant that mutates still part of the lineage?"* → No change to yield data.  
  - **Verdict:** **Verbal**.  
  - **Step 5 (Convention Selection):**  
    - **Costs:**  
      - *Class model*: Simpler queries, but can't attach temporal metadata to "variety".  
      - *Lineage model*: Handles breeding history better, but complex part-whole queries.  
    - **Decider:** Lead agronomist (prioritize breeding data).  
    - **Brutal Truth:** Your 4-year class stance isn't *wrong*, but lineage model better supports trait evolution tracking. Convention choice isn't about truth—it's about cost.  

  **Case 2: Field (Legal Parcel vs. Planted Area)**  
  - **Step 1:** Factual agreement? **NO**.  
    - Legal parcel: Fixed boundaries, ownership records.  
    - Planted area: Crop coverage, changes yearly.  
  - **Jump to Step 4:**  
    - Test: *"Pesticide compliance report for leased subplot"* → Legal parcel fails (wrong owner), planted area passes. Outputs differ → **Substantive**.  
    - Testable in <1 hour? **YES** → Assign to data engineer.  
  - **Resolution:** Data shows legal parcel model causes compliance errors → Adopt planted area + legal as separate entities.  

  **Case 3: Drought Event (Disposition vs. Process)**  
  - **Step 1:** Factual agreement? **YES** → Agree on rainfall metrics, crop stress periods.  
  - **Step 2:** Substitution test:  
    - Query: *"Crop loss during drought in Region R"* → Same result whether "Region had disposition" or "Process occurred".  
  - **Step 3:** Edge case: *"When does drought 'start'?"* → Impacts irrigation alerts. If models assign different start dates → **Substantive**.  
  - **Verdict:** **Substantive** (date logic affects actions).  
  - **Step 4:** Testable? Run irrigation model → If "process" improves accuracy by 5%+, adopt it. Else → **Step 6** (Decider: Head of Farming Ops prioritizes alert precision).  

  ---

  ### **Where ODRP Could Misfire**  
  1. **False Negatives in Step 2:** If test queries are oversimplified, may miss output differences. *Mitigation:* Include 1-2 real production queries.  
  2. **Values Bias in Step 6:** Deciders may prioritize their team's preferences. *Mitigation:* Require explicit business goal alignment.  
  3. **Overlooking Compound Costs:** E.g., choosing a "cheap" convention that fragments the ontology long-term. *Mitigation:* Score conventions on 4 cost dimensions (Step 5).  
  4. **Philosophical Residue:** Engineers might still argue "But which one is *real*?" *Mitigation:* Chair must enforce protocol exit at decision points.  

  **Final Tip:** When ODRP declares a dispute "verbal," explicitly state: *"Both models are factually valid. We are now choosing based on costs, not truth."* This defuses ideological battles. Run this in your next ontology firefight and iterate based on what sticks.
