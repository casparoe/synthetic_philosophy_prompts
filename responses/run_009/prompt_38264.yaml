prompt: |-
  Something's been bugging me since our seminar on future generations, and I can't find the way out of an argument my classmate Elena built. The setup: our city council is choosing between fixing a contaminated reservoir now, expensively, or doing a cheaper partial fix that leaves low-level toxins in the water for the next thirty years. Kids conceived after the decision will be different kids under the two policies -- the announcement itself shifts people's finances and stress levels, couples end up conceiving on different nights, a different sperm meets a different egg. So the people who grow up drinking the marginal water under the cheap option would simply never have existed under the expensive one. Their lives are decent -- clearly worth living, just with higher rates of illness and a few years shaved off at the end. Her argument: (1) You can only wrong someone by making things worse for that person than they would otherwise have been. (2) Nobody under the cheap policy is worse off than they would otherwise have been, since the alternative for each of them is never existing at all, and a life worth living beats no life. (3) So nobody is made worse off by the cheap policy. (4) A wrong needs a victim -- some person to whom the wrong was done -- and if nobody is worse off, nobody can be the victim. (5) Therefore the cheap policy wrongs nobody. (6) What's wrong simpliciter, wronged-nobody-or-not, isn't a category we have; morality is done by persons, to persons. (7) So the cheap policy isn't wrong, and the council members who vote for it do nothing wrong. That conclusion already smells, but then she pushed it further and this is where I really balk: the same reasoning shows we could adopt a policy knowing it will give everyone born after 2050 lives just barely above the worth-living threshold, full of preventable pain, and that would wrong nobody either, so long as they wouldn't have existed otherwise. At that point it seems like the argument proves there is no way at all to wrong future people through policy, since nearly any policy with long-run effects changes who gets conceived -- which would mean climate policy, depletion, the whole works, can't wrong anyone not yet born. So either the argument is sound and a huge chunk of what I thought I believed about obligations to the future is confused, or some step between (1) and (7) is rotten. I suspect it's the comparison in (2), that "worse off than they would otherwise have been" is doing something wierd, but I can't put my finger on exactly what, and I've also noticed that if I deny (4) I seem to be committed to wrongs with no victims floating around, which sounds like mysticism. If I absolutely had to pick I'd rather keep (1) and (4) and bite the bullet on (7), but I want to know what that actually costs me -- can I really tell the affected people, decades later, that they have no complaint? Don't give me a neutral survey of the positions with the choosing left to me; tell me which step you would reject, explain why that step looked so innocent in the first place, and defend your choice as the least costly one. And please, no headings or bullet points or bold text in your answer -- just continuous prose, like a long email to a friend.
reasoning: |-
  Okay, the user is grappling with Elena's argument about future generations and whether a policy that causes harm to people who wouldn't otherwise exist can be considered wrong. Let me start by understanding the core of the problem. Elena's steps seem logically tight, but the conclusion feels off. The user suspects step (2) might be the issue, but they're also worried about denying step (4) leading to victimless wrongs, which sounds mystical.

  First, I need to break down Elena's premises. Step (1) says you can only wrong someone by making them worse off. Step (2) claims that for the kids in the cheap policy, the alternative is nonexistence, so their lives, even with hardships, are better off. Therefore, no one is worse off. Step (4) ties wrongdoing to having a victim. If no one is worse off, no victim, no wrong. The conclusion is that the cheap policy isn't wrong.

  The user's discomfort comes from the implication that any harmful policy affecting future generations isn't wrong if it changes who is born. Climate change policies, for example, could then be justified under this reasoning. That can't be right. So where's the flaw?

  I recall Derek Parfit's non-identity problem. The issue lies in the comparison between existence and nonexistence. Step (2) assumes that "worse off" requires a baseline of the same person in both scenarios. But for the affected individuals, the alternative is never existing. Their life, even with suffering, is better than nothing. But is that the right comparison? 

  The problem is that "worse off than they would otherwise have been" implies a different scenario for the same person. But in the expensive policy, those specific kids don't exist. So for them, the alternative isn't a life without harm; it's nonexistence. The comparison is between existence with harm and nonexistence. That's not a like-for-like comparison. 

  Maybe the wrongdoing isn't about harming specific individuals but about creating persons with avoidable suffering. Even if their lives are net positive, we might have a duty not to create avoidable harm. But that requires rejecting step (1) or redefining harm. 

  Step (1) assumes harm is only comparative. But if we think harm can be non-comparative, like causing unnecessary suffering regardless of alternatives, that might work. However, the user is hesitant to abandon step (1) and (4) because victimless wrongs seem odd. 

  Perhaps the solution is to challenge step (2)'s interpretation of "otherwise have been." The alternative for these children isn't nonexistence; it's that different children would exist under the better policy. The moral failure isn't harming specific individuals but failing to create better conditions for whoever comes into existence. That shifts the focus from harming individuals to fulfilling obligations to future people, regardless of their identity. 

  This approach avoids victimless wrongs by saying the wrong is against the collective future population or our duties. But the user might find that too vague. Another angle: the council's decision affects the conditions of existence. We can say a policy is wrong if it creates avoidable suffering, even if the individuals benefiting or suffering wouldn't exist otherwise. The wrong is in the act itself, not the outcome for specific victims. 

  The user's deeper concern is maintaining moral responsibility towards future generations without falling into non-identity traps. They want to justify why the council should choose the expensive policy. Rejecting step (2) by redefining harm as avoidable suffering might be the least costly move. It preserves the intuition that causing preventable harm is wrong, even if the victims wouldn't exist otherwise. 

  Also, step (6) claims morality is only between persons, but maybe obligations to future persons exist even if we don't know who they are. The council has a duty to ensure decent living conditions for whoever is born. 

  In conclusion, rejecting step (2)'s comparison as invalid solves the problem. The harm isn't comparative to nonexistence but absolute in terms of unnecessary suffering imposed. This maintains the core of steps (1) and (4) by arguing that the individuals are harmed in a non-comparative sense. The cost is accepting that harm can be defined without a baseline of the same person in an alternative scenario, which might require refining our understanding of harm but avoids the absurdity of the original conclusion.
answer: |-
  Elena’s argument is notoriously slippery—it’s Parfit’s non-identity problem in the wild—and your unease is dead right. The conclusion *feels* like a moral disaster because it *is* one. But the steps seem airtight only if we ignore how language and morality twist under the weight of non-existence comparisons. The rotten step is **(2)**, specifically the claim that "nobody under the cheap policy is worse off than they would otherwise have been." The flaw isn’t in the math of "life vs. non-life," but in smuggling in a false baseline for what "worse off" means. Let me walk you through why.

  Start with the innocent-looking move: when we say someone is "worse off," we usually mean they’re in a *worse state* than they *would have been* in some alternative scenario. For most cases, this works fine. If I steal your wallet, you’re worse off than you’d have been if I hadn’t—same you, two scenarios. But here’s the trap: for the kids born under the cheap policy, the "alternative scenario" (the expensive policy) doesn’t contain *them* at all. It contains *different* people. So when Elena says, "The alternative for each is never existing," she’s comparing the *actual child* to a state of non-existence. And yes, a life worth living is better than non-existence *for that child*. But this comparison is meaningless for assessing harm. Why? Because harm requires a *deprivation*—taking away something *from you* that you *could have had*. Non-existence isn’t a state *you* could "have"; it’s the absence of you altogether. Saying little Emma isn’t "worse off" because her life is better than nothing is like saying a burn victim isn’t "worse off" because they’re better off than being dead. That’s not how we gauge harm in medicine, law, or ethics. We ask: "Are they suffering *avoidable* pain?" Not: "Is their pain preferable to oblivion?"

  This misstep infects the whole argument. Step (1) ("you can only wrong someone by making things worse for them") seems solid, but it depends on coherent alternatives. When the "alternative" is non-existence, the comparison collapses. We’re not asking if little Emma is better off existing than not; we’re asking if the council’s choice *unnecessarily inflicted suffering on her*. Her arthritis at 40, her shortened lifespan—these are real harms *to her*, even if her conception depended on the policy that caused them. The wrong isn’t in bringing her into existence (her life is worth living), but in *shaping her existence* with preventable poison. We don’t excuse feeding lead paint to existing children because "they’d be different people if we hadn’t," and we shouldn’t here.

  Denying (2) doesn’t force us into mysticism about victimless wrongs, as you feared. The victims are crystal clear: the actual people living with contaminated water. Their complaint isn’t "You should never have conceived me!"—it’s "You poisoned my water, knowing it would hurt me, for the sake of saving money." That’s a direct wrong *to them*. Step (4) ("a wrong needs a victim") holds firm; the victims are breathing, aching, and drinking from the reservoir. The council harmed *these people* by exposing them to toxins, full stop. That their existence is policy-dependent doesn’t erase the harm *once they exist*.

  What makes this feel counterintuitive is the "different people" quirk. But think: if a doctor knowingly gave a pregnant patient a drug causing fetal disabilities to save costs, we’d say the child is wronged—even though that child wouldn’t exist otherwise. The harm isn’t existence itself; it’s the *avoidable burden* imposed. Similarly, the council chose to create a future where people *must* bear avoidable illness. That’s the core wrong: not comparing lives to void, but *creating persons into preventable suffering*.

  Now, your fear about the "barely worth living" scenario? Rejecting (2) blocks Elena’s dystopia. A policy dooming post-2050 kids to miserable lives *does* wrong them. True, they wouldn’t exist otherwise, but once they exist, their suffering is real, inflicted, and unjustified. Their complaint is valid: "You structured the world so I’d live in agony, for no good reason." Climate policy is the same: emitting carbon today doesn’t just create different people; it creates people *harmed* by storms, famine, and displacement. They’re victims of actions taken before their birth.

  Why does this feel costly? Because it forces us to confront that "who exists" can’t shield us from moral responsibility for *how* they exist. But the cost is honesty, not absurdity. We already accept obligations to future people (building infrastructure, conserving resources), knowing we don’t know who they’ll be. This just extends that: we owe whoever comes into existence a baseline of dignity, free from gratuitous harm we could prevent. Biting the bullet on (7) is far costlier—it evaporates intergenerational justice entirely. If Elena’s right, we could dump nuclear waste in aquifers, ensuring future lives are "barely worth living," and call it morally neutral. That’s not philosophy; it’s sociopathy in logical disguise.

  So yes, decades later, you can look those people in the eye—not to say they have "no complaint," but to say: "What was done to you was wrong. You were made to suffer so others could save money. It never should have happened." That’s the truth, and Elena’s elegant logic can’t wash it away.

  ---

  *Why reject (2) and not (1) or (4)?*  
  (1) is salvageable if we clarify that "worse off" requires a feasible baseline where the *same person* exists in a better state. The expensive policy *isn’t* a feasible alternative for the cheap-policy kids—it’s a world without them. So (1) doesn’t apply. (4) is bedrock—morality *is* relational. But the victims here are the actual people harmed, not ghosts of unconceived possibilities.  

  *The deeper cost:*  
  Admitting that identity-affecting choices *can* wrong people forces us to weigh harms to potential beings in a way that feels abstract. But that’s the price of taking future suffering seriously. The alternative—Elena’s path—makes morality myopically present-bound.
