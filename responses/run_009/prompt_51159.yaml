  I'm drafting a paper section defending deflationism about material constitution, and I've caught myself not knowing my own confidence in the central claim. So, plainly: what is your credence that Goliath — the statue — is strictly identical with Lumpl, the piece of clay constituting it at every moment of its existence, in the standard setup where the clay is shaped into statue form at noon and squashed flat at midnight?

  Decompose the number into (at least) these terms, adding or revising as you judge fit: (1) the modal argument from Leibniz's Law — Lumpl, but not Goliath, could have survived the midnight squashing, so the indiscernibility of identicals yields distinctness; (2) the four-dimensionalist response, on which statue and clay coincide only in sharing temporal parts, so that the strict-identity question was posed over a confusion about what coincidence amounts to; (3) the relative-identity response, on which being the same statue as and being the same piece of clay as are sortal-relative relations that can come apart without any absolute identity being denied; and (4) the deflationist or counting response, on which there is one object, picked out and counted differently under different sortals, and the demand for an absolute same-or-different verdict is itself the mistake. Assign each term a rough probability with one line of justification, show how you combine them, and tell me which term dominates the final number — that is, which conditional, if it resolved the other way, would move your credence most.

  Then consider a variant I want to use as a stress test, and tell me whether your credence diverges from the standard case. The sculptor removes a pinch of clay from the statue's nose each hour and seals each pinch in a jar, replacing nothing. After the first hour there is no exact coincidence between the statue and any obvious candidate for the clay — the material still in statue form, the original collection including the jar contents, or some further candidate altogether. Does this gradual-departure setup make the case for non-identity easier to run than the modal argument does, harder, or does it merely relocate the dispute to the question of what the clay refers to? And does your treatment of it reveal which of your four terms you were actually leaning on?

  Finally, if you think the whole question rests on a mistake — that strict identity is simply the wrong relation to ask about between a statue and its matter — say so plainly, re-decompose the question into whatever form you take to be answerable, and still give me a number. For reference, my own credence in identity has drifted from about 0.6 to about 0.35 over the course of writing this section, and I would like to know whether that drift reflects argument or just fatigue.
