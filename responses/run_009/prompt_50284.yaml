answer: |-
  ## Rescue, Without Ledger

  The river gnawed,
  a cold grey mouth.
  His boots tore mud,
  the bank’s wet south.

  No stranger’s cry —
  a known despair.
  One thrashing shape
  in thinning air.

  His own arm plunged,
  a piston’s drive,
  through liquid cold
  where currents strive.

  Fingers locked hard
  on sodden wool,
  on wristbone shock,
  the known face full

  of gasping life
  he hauled, he dragged —
  the weight *her* weight,
  the slope, the jagged

  rocks beneath his knee.
  He heaved her clear,
  a choking gasp,
  her body near.

  The water closed
  where the other sank.
  He held her close
  on the shuddering bank.

  **Maximizing aggregate welfare justifies preferential spousal intervention.**

  ---

  **Notes on the execution:**

  *   **Living Inside the Moment:** Focus on sensory, physical details – the river's "cold grey mouth," "boots tore mud," "liquid cold," "sodden wool," "wristbone shock," "gasping life," "shuddering bank." The action is instinctive ("His own arm plunged, a piston’s drive").
  *   **No Reasons Given:** The poem shows *what* he does and *who* he saves ("the known face," "her weight"), but never *why*. The choice is inherent in the action itself.
  *   **The Final Line:** "Maximizing aggregate welfare justifies preferential spousal intervention." This is:
      *   **Correct/True (in theory):** Utilitarianism *could* justify saving the spouse if her death causes more net suffering (his grief, family impact).
      *   **Impartial & Abstract:** Uses sterile, theoretical language ("aggregate welfare," "intervention").
      *   **Bolted On & Deflating:** The poem feels complete at "shuddering bank." Adding this line feels jarringly unnecessary, like explaining a kiss. Deleting it *improves* the poem's emotional truth.
      *   **Register Shift:** The body is visceral ("gnawed," "tore," "plunged," "gasping," "shuddering"). The final line is cold, clinical philosophy.
      *   **Williams' Point Embodied:** The line exemplifies the "one thought too many" – the correct justification arriving late, cheapening the profound, immediate act of saving his wife. It feels like a "receipt" for the gift of her life. The gesture of love "goes dead" in explanation. Someone knowing Williams recognizes the utilitarian justification; anyone feels the deflation.
