answer: |-
  ## Diagnostic Quiz: What Do *You* Mean by "Life"?

  **Instructions:** For each scenario, choose the answer that **best reflects your immediate judgment** about whether the entity is "alive" *right now*. Don't overthink philosophical definitions; go with your gut reaction.

  1.  **A typical influenza virus (outside a host cell):**
      (A) Alive
      (B) Not alive
      (C) Borderline / It's a matter of degree

  2.  **A bacterial spore found in ancient permafrost. It shows no signs of metabolism and hasn't for 10,000 years, but scientists believe it could be revived and grow in a suitable lab environment.**
      (A) Alive
      (B) Not alive

  3.  **A mule (sterile hybrid of horse and donkey) and a sterile worker ant (like many in a colony):**
      (A) Both alive individually
      (B) The ant is alive, the mule is not (or vice versa)
      (C) Neither is *truly* alive because they can't reproduce

  4.  **A sophisticated computer simulation containing self-replicating digital programs. These programs copy themselves (sometimes with errors), compete for processing resources, and complex new forms emerge over generations.**
      (A) Alive
      (B) Not alive
      (C) Borderline / It's a matter of degree

  5.  **A laboratory-created protocell: a microscopic oil droplet containing simple chemicals. It actively takes in energy and raw materials from its environment to repair and maintain its structure over time. However, when it splits, the "offspring" droplets vary randomly with no consistent inheritance of traits, preventing cumulative evolution.**
      (A) Alive
      (B) Not alive

  6.  **A burning candle flame: it consumes wax and oxygen, grows, moves, and produces heat and waste gases.**
      (A) Alive
      (B) Not alive
      (C) Borderline / It's a matter of degree

  7.  **A growing salt crystal in a saturated solution: it adds molecules in an orderly pattern, increasing its size and complexity.**
      (A) Alive
      (B) Not alive

  8.  **The HeLa cell line: human cells originally taken from Henrietta Lacks in 1951. These cells have been kept alive and dividing continuously in labs worldwide for decades, long after her death.**
      (A) Alive
      (B) Not alive

  ---

  ## Scoring Key

  Tally your answers. Your pattern maps onto common philosophical positions defining life.

  *   **Mostly A on 2 (Spore), 5 (Protocell), and 8 (HeLa); Mostly B on 4 (Digital) and 6 (Flame):** You lean towards **Autopoiesis/Self-Maintenance**. Life is about being an **autonomous, self-sustaining, bounded system actively maintaining its organization against decay** (e.g., Maturana & Varela). Metabolism and present activity are key; potential or evolution are secondary.

  *   **Mostly B on 2 (Spore) and 5 (Protocell); Mostly A on 3 (Sterile Org - Option A), 4 (Digital), and 8 (HeLa):** You lean towards a **Purely Evolutionary Definition**. Life is **whatever undergoes natural selection based on heritable variation** (e.g., some interpretations of Dawkins). Reproduction, heredity, and evolution are essential; metabolism serves that end. Sterile organisms are alive because they are part of a reproducing lineage.

  *   **Mostly A on 1 (Virus), 4 (Digital), and 8 (HeLa); Mostly B on 2 (Spore), 5 (Protocell), 6 (Flame), 7 (Crystal):** You lean towards the **NASA-style Working Definition** (combining self-sustaining chemistry and Darwinian evolution). Life is a **"self-sustaining chemical system capable of Darwinian evolution."** Both metabolism *and* the *potential/capacity* for evolution are required. The spore lacks current metabolism, the protocell lacks heredity for evolution.

  *   **Mostly A on 2 (Spore), 6 (Flame), and possibly 7 (Crystal); Mostly B on 1 (Virus), 4 (Digital), 8 (HeLa):** You lean towards a **Thermodynamic/Dissipative Structure Definition**. Life is **a highly organized system that maintains itself far from equilibrium by dissipating energy and increasing entropy** (e.g., Prigogine, some astrobiologists). Persistent dynamic structure via energy flow is key; replication is not essential.

  *   **Multiple C (Borderline) answers, especially on 1 (Virus), 4 (Digital), 6 (Flame), and potentially others; Mixed A/B answers elsewhere:** You lean towards a **Deflationary/Family-Resemblance View**. **"Life" lacks a single essential property; it's a cluster of features (metabolism, reproduction, evolution, etc.), and entities can share some features without sharing all.** Viruses, digital life, flames, etc., are genuinely borderline cases. No sharp line exists.

  *   **Stable Contradiction Flag:**
      *   If you answered **A (Alive) on 2 (Spore)** (valuing *potential* for metabolism/life) but **B (Not Alive) on 5 (Protocell)** (because it lacks evolutionary potential), **this combination isn't stably held by any major position.** Why? It inconsistently values dormant potential (spore) while dismissing metabolic potential lacking evolution (protocell). Positions value *either* current metabolic state (Autopoiesis), evolutionary potential (NASA, Evolutionary), or energy dissipation (Thermodynamic) more consistently.

  *   **Positions Hard to Distinguish:**
      *   **Thermodynamic vs. Autopoiesis:** Both might say "Alive" to the Protocell (Q5). To split them, add a question about a **non-chemical dissipative structure** (e.g., a stable whirlpool in a draining sink). Thermodynamic definitions might call it borderline/alive; Autopoiesis (focused on chemical autonomy) would say not alive.
      *   **NASA vs. Evolutionary:** Both say "Not Alive" to the Spore (Q2) and Protocell (Q5). To split them, ask about a **perfectly replicating, evolving nanobot made of silicon/steel (no organic chemistry).** NASA (requiring *chemical* systems) might say not alive; Evolutionary definitions might say alive.

  *(Word Count: Questions 348 + Key 482 = Total 830)*
