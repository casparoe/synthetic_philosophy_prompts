  me and my roommate have been arguing about finks and masks all week and i want a second opinion with actual numbers. Start from Lewis's sorcerer case: a glass is fragile, but a wizard watches it, and the instant anything strikes it he casts a spell that makes it temporarily indestructible (then reverts it). On the simple conditional analysis, fragile = would break if struck, so the glass comes out not fragile, which seems flat wrong. Now my twist: suppose the sorcerer is only about 70% reliable, and suppose also he gets bored and wanders off after a few hours -- so whether the glass survives the next strike depends on when it happens. My credence that the glass is fragile the whole time, before, during, and after the sorcerer's shift, is about 0.85; my roommate says maybe 0.4, because he half-suspects fink/mask cases show dispositions just aren't intrinsic enough to survive all this and maybe the ordinary concept is vague enough that there's no fact of the matter. Give me your number, decomposed: how much rides on dispositions being intrinsic (so finks and masks leave them untouched), how much on the conditional analysis being patchable versus abandoned for something like a causal-role or functional account, how much on whether the borderline 70%-reliable case even has a determinate answer, and anything else you'd put in. Then say which term you're least confident in, what would move it, and where you think my 0.85 and his 0.4 actually diverge -- i suspect it's not where either of us thinks it is.
