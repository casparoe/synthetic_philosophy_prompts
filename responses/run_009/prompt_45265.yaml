prompt: |-
  My housemate has gone full selfish-gene mode and keeps trotting out an argument he thinks settles the whole units-of-selection debate, and the annoying part is i can't find where it goes wrong even though im pretty sure something does. It goes like this. (1) For something to be a unit of selection, selection has to discriminate between rival versions of it — lineages of the thing have to out-proliferate other lineages. (2) Whenever selection does anything at all, whether we'd normally describe it as acting on organisms, groups, whatever, the result is that some alleles went up and others went down, and this genic ledger is complete: nothing about the evolutionary change is left undescribed by it. (3) A complete description at the genic level leaves nothing for higher levels to do, so "selection at the level of the organism" and "group selection" are just summaries of lots of little genic selections. (4) Therefore the gene is the only genuine unit of selection, and talk of a trait evolving "for the good of the group" is always a mistake — whats really going on is just alleles for the trait beating alleles against it. (5) So group selection, where it seems to happen, is really genes doing their thing with extra steps.

  Here's what's eating me though. You can run the same trick one level up: whenever allele frequencies change, it's equally true that organisms carrying allele A out-reproduced organisms carrying allele a, for every allele, and this organismic description is just as complete as the genic one. If completeness of the description at level X makes X the real unit of selection, my housemate has proven that organisms are the only real unit just as soundly as that genes are — the argument proves too much, in both directions, which makes me suspect some premise is quietly doing two different jobs (something about "complete description" sliding into "does the causal work", maybe?). But when I try to spell that out I get tangeled, and there's a residual worry: maybe the gene really is special because gene lineages are literal copies whereas organisms aren't copies of anything, so maybe the genic description IS privileged in a way the organismic one isn't. For what it's worth, I want to keep premise (2) — I genuinely beleive the genic ledger is complete — and I'd happily lose (3) if I understood exactly what rejecting it costs, since it feels like rejecting it just lets my housemate come back with "fine, maybe description doesn't privilege the gene, but causation still happens there".

  So: which step do you reject, and what does rejecting it cost? Give me exactly five numbered items, each one or two sentences, no intro and no conclusion. Item one: the single step you reject plus the precise slide in it — if a word or phrase is doing double duty, name it. Item two: why that step looked fine in the first place. Item three: whether my parity argument (re-running the trick at the organism level) is actually fair or whether it misses some asymmetry between genes and organisms. Item four: what rejecting the step costs, including whether my housemate can salvage a causal version of his genic selectionism even if the descriptive version fails. Item five: the strongest reply my housemate could still make, and what you'd say back to it. British English please, and keep it tight — five items and nothing else.
reasoning: |-
  Hmm, the user is grappling with a philosophical debate about units of selection in evolution. Their housemate is pushing a strict gene-centric view using a multi-step argument, and while the user intuitively feels something's wrong, they can't pinpoint the flaw. The core tension revolves around whether completeness of description at one level (genic) invalidates selection at other levels (organism, group).

  I need to identify the weak link in the housemate's argument. The user suspects premise (3) is problematic—the jump from "genic description is complete" to "higher levels do nothing." That seems right because completeness doesn't imply causal exclusivity. For example, tracking every penny in a company (complete micro-description) doesn't negate the causal role of departments (macro-level). 

  The parity argument is clever: if completeness makes genes the only real unit, the same logic applied to organisms would "prove" organisms are the only unit. This symmetry exposes the flaw unless there's a genuine asymmetry. Genes do have a copying mechanism via DNA replication, but organisms don't literally copy themselves—they reproduce variably. Still, this doesn't automatically privilege genes as the causal unit; it just means descriptions at different levels capture different patterns. 

  Rejecting premise (3) costs little. We keep the genic ledger's completeness (premise 2) but deny it monopolizes causality. The housemate might retreat to "genes are where causal chains terminate," but that ignores emergent effects—like how group structures constrain individual behavior. 

  The strongest reply from the housemate would likely harp on gene lineages being "copies" (unlike organisms). I'd counter that while genes replicate, selection pressures often operate on phenotypic interactions at higher levels, making gene frequency changes downstream outcomes rather than primary causes. 

  The user wants this tight: five numbered items, British English, no fluff. Key is naming the exact slide in premise (3)—the phrase "leaves nothing for higher levels to do"—and explaining why it conflates description with causation.
answer: |-
  1.  Step (3) is rejected due to the slide where "complete description" (merely accounting for outcomes) is conflated with "leaves nothing for higher levels to *do*" (implying higher levels play no causal role). This phrase falsely equates descriptive completeness with causal monopoly.
  2.  It looked fine because a complete genic description *does* account for the net frequency change, creating the illusion that higher-level interactions (e.g., between organisms in a group) aren't doing the *actual work* of causing differential survival/reproduction.
  3.  The parity argument *is* fair: completeness applies equally upwards (organisms) and downwards (genes), exposing the flaw in using it to privilege any level. The gene/lineage-copying asymmetry is real but doesn't automatically grant genes *causal* privilege; it makes genic description convenient, not uniquely causal.
  4.  Rejecting (3) costs nothing descriptively (accept (2)) but forces recognising multi-level causality: higher-level interactions *cause* the genic outcomes. Your housemate cannot salvage genic selectionism as the *sole* causal level; causal chains involve interactions at the level where selection *operates* (e.g., organism survival, group competition).
  5.  Strongest reply: "But only gene lineages are *copied*; selection acts *on* phenotypes, but the *unit* that accumulates changes is the gene." Rebuttal: "Selection acts *via* phenotypes *of* interactors (organisms, perhaps groups); gene frequency change is the *record*, not the exclusive causal *site*. Change accumulates in lineages, but the causal pressure originates at the interacting level."
