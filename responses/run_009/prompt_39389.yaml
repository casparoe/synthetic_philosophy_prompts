     C. Only the hot shower is real pleasure; the satisfaction about the rival is not pleasure, it's just a thought.
     D. Only the satisfaction about the rival is real pleasure because it's about something; the shower is just a sensation.

  5. Pleasure Drug: Evan takes a drug called "Euphorium" that causes a strong, positive feeling of well-being. The feeling isn't about anything in particular; it's just a general sense of euphoria. Evan isn't thinking about anything; he's just lying there feeling good. Is this pleasure?
     A. Yes, it's a pure feeling of pleasure.
     B. It's a feeling, but it's not pleasure because pleasure has to be about something.
     C. It's pleasure, but a very shallow kind because there's no object.
     D. It's not pleasure because pleasure requires an activity or engagement.

  6. Anticipation: Fiona is planning a vacation to Hawaii. She hasn't left yet, but she spends a lot of time thinking about it and feels a warm, excited feeling. Is the enjoyment she feels while anticipating the vacation a pleasure in itself?
     A. Yes, the anticipation is pleasurable in the present moment.
     B. No, the pleasure is only in the future when she actually experiences the vacation; the anticipation is just a sign of that future pleasure.
     C. The anticipation is pleasant, but it's a different kind of pleasure from the actual experience.
     D. The anticipation isn't pleasure; it's just a cognitive state.

  7. Pain Without Aversion: Greg has a condition where he feels pain but doesn't mind it. For example, when he stubs his toe, he feels the sharp sensation but doesn't find it unpleasant or have any desire to stop it. He says, "It's like a strong sensation, but I don't dislike it." Is Greg experiencing pain? And is he suffering?
     A. He feels pain but it's not unpleasant, so he's not suffering.
     B. He feels pain and it is unpleasant by definition, so he must be suffering even if he says he isn't.
     C. Without the unpleasantness, it's not really pain; it's just a sensation.
     D. He is experiencing a pain sensation without the negative evaluation, so it's pain but not suffering.

  8. Enjoyment Without Feeling: Hannah is listening to her favorite piece of music. She says she is enjoying it immensely, but when asked, she cannot identify any particular feeling of pleasure. She says, "It's not that I feel a certain way; the music just absorbs me and I value the experience." Is Hannah experiencing pleasure?
     A. Yes, because she says she is enjoying it and values it.
     B. No, because she can't point to any feeling of pleasure.
     C. She is experiencing pleasure, but it's not a feeling; it's an attitude.
     D. It's not pleasure, but it is a positive experience.

  9. Motivation and Pleasure: Ian is playing a challenging video game. He keeps failing at a level but is determined to beat it. He says he is frustrated but also feels driven to continue. He doesn't describe the experience as fun or pleasant. Is Ian experiencing pleasure?
     A. Yes, because he is motivated to keep going, so it must be pleasurable.
     B. No, because he says it's frustrating and not pleasant.
     C. The motivation to continue is a sign of pleasure, even if he doesn't call it that.
     D. It's not pleasure; it's a different kind of motivation.

  10. Pleasure and Desire: Julia is eating a delicious meal. She is enjoying every bite and desires to eat more. Later, she is taking a bitter-tasting medicine. She doesn't enjoy it but desires to take it because it will make her healthy. How do these two situations compare?
      A. Both involve pleasure because she desires both, but the medicine is less pleasurable.
      B. Only the meal involves pleasure; the medicine involves desire without pleasure.
      C. The meal involves pleasure and the medicine does not, but both involve desire for different reasons.
      D. Pleasure is when you desire what you are doing; so in both cases, she has pleasure because she desires the action (eating for the meal, taking for the medicine).

  11. False Pleasure?: Kevin has a brain implant that makes him feel happy. He is told that the happiness is because of his successful career, but in reality, the implant is causing the happiness regardless of his life circumstances. Is Kevin experiencing pleasure?
      A. Yes, he feels happy, so he is experiencing pleasure.
      B. No, because the happiness isn't based on real circumstances; it's artificial and false.
      C. It's a feeling of pleasure, but it's not valuable because it's not connected to reality.
      D. Pleasure doesn't require a reason, so it's real pleasure.

  12. Mixed Feelings: Leah is watching a sad movie. She cries during the film and feels what she describes as "a heavy heart," but she also feels that the experience is deeply moving and valuable. She says, "I'm glad I watched it, even though it made me sad." Is Leah experiencing pleasure?
      A. Yes, because she values the experience overall.
      B. No, because she is feeling sad.
      C. She is experiencing both pleasure and pain at the same time.
      D. The sadness is painful, but there is pleasure in appreciating the art.

  Scoring Key:

  We'll provide a guide that for each theory, lists the expected answers. Then, for a student, we count how many answers match each theory.

  But since there might be ties or mixed, we can say that the theory with the most matches is the one.

  Alternatively, we can group the questions that are most indicative.

  Given the complexity, I'll provide a brief description of how each theory would answer, and then the grader can match.

  But for simplicity, here's a mapping of characteristic answers. Note: This is illustrative and not strict.

  - Theory 1 (Homogeneous feeling): 1B or 1C, 2A, 3B, 4A, 5A, 6A, 7C, 8B, 9B, 10B, 11A, 12C
  - Theory 2 (Heterogeneous feeling): 1B, 2A, 3A or 3C, 4B, 5A, 6A or 6C, 7A, 8A, 9B, 10B, 11A, 12B or 12C
  - Theory 3 (Attitudinal): 1A or 1B, 2A, 3A or 3C, 4B, 5B, 6A, 7A, 8A or 8C, 9B, 10B or 10C, 11A, 12A or 12D
  - Theory 4 (Way of feeling): 1C, 2A, 3A, 4B, 5B or 5C, 6A, 7A, 8A, 9B, 10B, 11A, 12D
  - Theory 5 (Motivational): 1C, 2A, 3A, 4A or 4B, 5A, 6A, 7A or 7C, 8A, 9A, 10B or 10C, 11A, 12A
  - Theory 6 (Deflationary): (varies) but often: 1D, 2B or 2C, 3D, 4C or 4D, 5B or 5D, 6B or 6D, 7A or 7C, 8D, 9D, 10C, 11B or 11C, 12D

  Then, for the student, tally the number of matches for each theory. The theory with the highest tally is the one they are closest to.

  Note: Some theories will overlap. For example, Theories 3 and 4 might both say 8A.

  Also, we must include short descriptions of the theories with their awkward commitments:

  (1) Homogeneous feeling theory: Awkward commitment: Must reduce all pleasures to a common feeling, which might not account for the diversity of pleasant experiences.

  (2) Heterogeneous feeling theory: Awkward commitment: Pleasures are feelings but have nothing in common phenomenally, so what unifies them as pleasures? Might be ad hoc.

  (3) Attitudinal theory: Awkward commitment: You can have pleasure without any positive feeling, which seems counterintuitive. Also, you can take pleasure in something you wish you didn’t (e.g., guiltily enjoying something).

  (4) "Way of feeling" theory: Awkward commitment: It's hard to say what the manner of experiencing is without reference to pleasure itself, risking circularity.

  (5) Motivational/dispositional account: Awkward commitment: Something can be pleasurable even if you are not motivated to continue (e.g., when you are exhausted) or vice versa.

  (6) Deflationary: Awkward commitment: Hedonism about well-being becomes hard to defend because if pleasures have nothing in common, why are they the only thing good in themselves?

  Finally, note that the quiz may not separate homogeneous and heterogeneous feeling theories well. They might only be separable by a question about whether two very different pleasures feel the same in some way, which is hard to ask without leading.

  We hope this helps. The TA can adjust based on how students answer.
answer: |-
  Below is a complete, intuition-based quiz designed to sort students into six theories of pleasure based on their responses to concrete cases. The questions avoid leading language or theoretical jargon, and the answer options are phrased to prevent students from guessing which theory they're selecting. I've included 12 scenarios (as requested) covering your required cases (masochism, deceived businessman, flow, sensory vs. attitudinal, pleasure drug, anticipation). The scoring key maps answer combinations to the six theories, accounts for mixed patterns, flags indistinguishable theories, and notes incoherent/unappealing combinations. Each theory includes a brief "awkward commitment" to highlight its counterintuitive implications.

  ---

  ### **Quiz: What Do You Mean by "Pleasure"?**
  **Instructions:** For each scenario, choose the answer that best matches your intuition. Don't overthink—go with your gut! There are no right or wrong answers.

  1. **Masochism**: Alex is a masochist. During a BDSM session, they feel intense pain from being whipped but also say, "This pain feels deeply satisfying and good." What is Alex experiencing?
     - A. Only pain—the "good" part is just a psychological reaction, not pleasure.
     - B. Both pain and pleasure—they’re distinct feelings happening together.
     - C. Pleasure—the pain itself is pleasurable in this context.
     - D. Neither—it’s a unique state that isn’t purely pain or pleasure.

  2. **Deceived Businessman**: Ben is overjoyed after being told he got a promotion he worked hard for. He celebrates with friends. Later, he learns the promotion email was sent by mistake—he didn’t get it. When Ben was celebrating, was he experiencing pleasure?
     - A. Yes—he genuinely felt pleasure in that moment, regardless of the truth.
     - B. No—the false belief made his joy "fake," so it wasn’t real pleasure.
     - C. It was pleasure, but it doesn’t "count" for well-being because it was based on a lie.
     - D. It was a feeling, but pleasure only happens when things are truly good.

  3. **Runner’s Flow**: Charlie is a marathon runner. Mid-race, they’re completely absorbed: no thoughts, no distinct "happy" feelings, just intense focus. Charlie says, "I wasn’t feeling good, but I didn’t want to stop—it was deeply fulfilling." Was Charlie experiencing pleasure?
     - A. Yes—it was fulfilling and they wanted to continue.
     - B. No—there was no positive feeling or sensation.
     - C. It was pleasure, but not the sensory kind—it’s about total engagement.
     - D. It wasn’t pleasure—it was a different positive state (e.g., satisfaction).

  4. **Sensory vs. Attitudinal**: 
     - Scenario 1: Dana feels warm, relaxed physical sensations while soaking in a hot bath.
     - Scenario 2: Dana hears that a rival who cheated them got fired. They feel no physical sensations but think, "I’m glad justice was served."
     Are both scenarios examples of pleasure?
     - A. Yes—both involve feeling good in the same basic way.
     - B. Yes—both involve feeling good, but they’re very different experiences.
     - C. Only the bath is pleasure—the rival thing is just a thought, not a feeling.
     - D. Only the rival thing is pleasure—the bath is just a sensation without meaning.

  5. **Pleasure Drug**: Evan takes a pill that causes a strong, euphoric physical sensation—like tingles and warmth. It’s not about anything; Evan just feels "good" while staring at a blank wall. Is this pleasure?
     - A. Yes—it’s a pure feeling of goodness.
     - B. No—pleasure requires enjoying something specific, not just a sensation.
     - C. It’s a feeling, but not "real" pleasure because there’s no object or action.
     - D. It’s not pleasure—pleasure comes from activities, not passive states.

  6. **Anticipation**: Fiona is excited for her upcoming vacation. While daydreaming about it, she feels a warm, happy sensation. Is this anticipation itself pleasurable?
     - A. Yes—the warm feeling is pleasurable right now.
     - B. No—real pleasure only happens during the vacation; this is just preparation.
     - C. It’s pleasant, but it’s a different type of pleasure than the actual vacation.
     - D. It’s not pleasure—it’s just a cognitive state (e.g., thinking).

  7. **Pain Without Aversion**: Greg has a rare condition. When he stubs his toe, he feels a sharp, intense sensation but doesn’t dislike it or want it to stop. He says, "It’s intense, but not bad." Is Greg experiencing pain? Is he suffering?
     - A. He feels pain, but it’s not unpleasant, so he’s not suffering.
     - B. He feels pain, and pain is always unpleasant, so he’s suffering (even if he denies it).
     - C. Without unpleasantness, it’s not pain—it’s just a neutral sensation.
     - D. The sensation is there, but it’s not painful because he’s not bothered by it.

  8. **Enjoyment Without Feeling**: Hannah loves a song. She says, "I’m not feeling any specific emotion—it’s like the music consumes me, and I value that." Is Hannah experiencing pleasure?
     - A. Yes—she’s engaged and values the experience.
     - B. No—there’s no positive sensation or feeling.
     - C. It’s pleasure, but it’s about her attitude, not a feeling.
     - D. It’s not pleasure—it’s a positive state like appreciation.

  9. **Motivation Without Enjoyment**: Ian is stuck on a hard video game level. He keeps failing but feels driven to continue. He says, "It’s frustrating, not fun—but I need to beat it." Is Ian experiencing pleasure?
     - A. Yes—being motivated to continue means it’s pleasurable.
     - B. No—he explicitly says it’s frustrating, not pleasant.
     - C. The motivation is a sign of pleasure, even if he doesn’t realize it.
     - D. It’s not pleasure—it’s determination, a different drive.

  10. **Desire vs. Enjoyment**: Julia eats a delicious meal, enjoys it, and wants more. Later, she takes bitter medicine—she dislikes the taste but wants to take it for health. Which statement is true?
      - A. Both involve pleasure—desiring something makes it pleasurable.
      - B. Only the meal is pleasure—desiring medicine isn’t pleasure because she dislikes it.
      - C. The meal involves pleasure; the medicine involves desire without pleasure.
      - D. Pleasure is irrelevant—both are about desire.

  11. **Artificial Happiness**: Kevin has a brain implant that makes him feel intense joy. He’s told it’s due to his great life, but actually, the implant fires randomly. When he feels "joy," is it pleasure?
      - A. Yes—he’s feeling it, so it’s real pleasure.
      - B. No—it’s "fake" because it’s not based on real circumstances.
      - C. It’s a feeling, but not valuable pleasure since it’s disconnected from reality.
      - D. It’s pleasure, but a defective kind.

  12. **Sad Movie**: Leah watches a sad film. She cries and feels "heaviness" but also values the experience, saying, "I’m glad I saw it." Is Leah experiencing pleasure?
      - A. Yes—she values it overall, so it’s pleasurable.
      - B. No—sadness cancels out any pleasure.
      - C. She’s experiencing both pleasure and pain simultaneously.
      - D. The sadness is painful, but there’s pleasure in appreciating the art.

  ---

  ### **Scoring Key**
  **How to score**: Tally the student’s answers. Use the table below to map patterns to theories.  
  - **Mixed patterns**: Most students will have a dominant theory (4+ answers aligning with one column).  
  - **Indistinguishable pairs**: Homogeneous (1) vs. Heterogeneous (2) theories often share answers (see notes). Attitudinal (3) and Way of Feeling (4) may overlap on "engagement" cases (e.g., Q3, Q8).  
  - **Incoherent/unappealing combos**: Flagged in notes (e.g., "pleasure requires truth" answers conflict with most theories).  
  - **"Leaves" (theories) with awkward commitments**: Described in 1–2 sentences.

  | Answer | Theory 1: Homogeneous Feeling | Theory 2: Heterogeneous Feeling | Theory 3: Attitudinal | Theory 4: Way of Feeling | Theory 5: Motivational | Theory 6: Deflationary |
  |--------|-------------------------------|--------------------------------|------------------------|--------------------------|------------------------|------------------------|
  | **Q1** | B or C                        | B or C                         | A or B                 | C                        | C                      | D                     |
  | **Q2** | A                             | A                              | A or C                 | A                        | A                      | B or C                |
  | **Q3** | B                             | A or C                         | A or C                 | A or C                   | A                      | D                     |
  | **Q4** | A                             | B                              | B                      | B                        | A or B                 | C or D                |
  | **Q5** | A                             | A                              | B or C                 | B or C                   | A                      | B, C, or D            |
  | **Q6** | A                             | A or C                         | A                      | A                        | A                      | B or D                |
  | **Q7** | C                             | A                              | A                      | A                        | A or C                 | A or C                |
  | **Q8** | B                             | A                              | A or C                 | A                        | A                      | D                     |
  | **Q9** | B                             | B                              | B                      | B                        | A                      | D                     |
  | **Q10**| B or C                        | B or C                         | B or C                 | B or C                   | C                      | C or D                |
  | **Q11**| A                             | A                              | A                      | A                        | A                      | B or C                |
  | **Q12**| C                             | C                              | A or D                 | D                        | A or D                 | D                     |

  #### **Interpreting Results**
  - **Dominant theory**: The theory with the most matches (e.g., 6+ matches = clear alignment).  
  - **Indistinguishable theories**:  
    - **Homogeneous (1) vs. Heterogeneous (2)**: Only diverge on Q4 (sensory vs. attitudinal). If a student picks **1A** (all pleasures feel the same) for Q4, they’re likely (1); if **2B** (pleasures feel different), they’re likely (2). Other answers overlap (e.g., both say A for Q2, Q5, Q6).  
    - **Attitudinal (3) vs. Way of Feeling (4)**: Overlap on "objectless" cases (Q5: both B/C) and engagement (Q3, Q8: both A/C). Key divergence: Q1 (masochism)—(3) allows pain + attitude (A/B), (4) says pain is transformed (C).  
  - **Incoherent/unappealing combinations**:  
    - **Q2D + Q4D + Q6B/D + Q11B**: Suggests pleasure requires truth/desert. Incoherent with all theories except deflationary (6), but even (6) doesn’t require this. Unappealing because it implies no pleasure in false beliefs or anticipation.  
    - **Q5A + Q8B + Q9A**: Claims passive euphoria is pleasure (A for Q5) but denies pleasure in absorption (B for Q8) or frustration (A for Q9). Incoherent for feeling theories (1,2); only fits motivational (5) if motivation is redefined.  
  - **No theory fits**: Answers like Q1D + Q3D + Q5D + Q8D + Q12B suggest pleasure is never present. Unexplored and unappealing—contradicts hedonism.

  #### **Theory Summaries with Awkward Commitments**
  1. **Homogeneous Feeling**: All pleasures share a single "hedonic tone" (e.g., all feel "warm/fuzzy").  
     *Awkward commitment*: Must claim diverse pleasures (e.g., a hot shower and schadenfreude) feel identical, which feels untrue to experience.  
  2. **Heterogeneous Feeling**: Pleasures are felt but have no common quality; they’re unified by something else (e.g., they all "feel good" in different ways).  
     *Awkward commitment*: Can’t explain what makes all pleasures "pleasures" without circularity (e.g., "they feel good" but "good" isn’t defined).  
  3. **Attitudinal**: Pleasure is an attitude (e.g., being pleased that X) not a feeling.  
     *Awkward commitment*: You can have pleasure without any positive feeling (e.g., enjoying a song while numb), or take pleasure in things you wish you didn’t (e.g., guilty pleasures).  
  4. **Way of Feeling**: Pleasure is a manner of experiencing (e.g., enjoying music isn’t a separate feeling; it’s how you hear it).  
     *Awkward commitment*: Struggles with objectless pleasure (e.g., the drug)—if pleasure requires an "object," euphoria without focus isn’t pleasure.  
  5. **Motivational/Dispositional**: Pleasure is whatever keeps you engaged/motivated.  
     *Awkward commitment*: Forces can be pleasurable even if hated (e.g., addiction)—if you’re motivated to continue, it’s "pleasure" by definition.  
  6. **Deflationary**: Pleasures have no unifying property; "pleasure" is a loose category.  
     *Awkward commitment*: Undermines hedonism—if pleasures share nothing, why think they alone make life better?  

  ---

  ### **Notes for the TA**
  - **Why these questions?** Each forces a choice between theories without jargon:  
    - Q1, Q7: Target feeling vs. attitudinal/motivational views (masochism/pain without aversion).  
    - Q2, Q11: Is pleasure truth-sensitive? (Attitudinal vs. others).  
    - Q3, Q8, Q9: "Flow" and objectless cases separate feeling theories from attitudinal/motivational.  
    - Q4, Q5, Q6, Q12: Contrast sensory, attitudinal, and motivational pleasure.  
  - **Administering**: Have students self-score or use an online form. Discuss patterns in section (e.g., "Why do masochism answers split?").  
  - **Flexibility**: Reorder questions or simplify options (e.g., reduce Q10 to 3 choices). The scoring key handles mixed answers.  
  - **Limitations**: Homogeneous (1) and Heterogeneous (2) are hard to distinguish—add a follow-up if needed: *"Could two pleasures (e.g., eating cake and winning a game) feel exactly the same?"* (1=Yes, 2=No).  

  This quiz should provoke discussion and reveal hidden assumptions. I’ve avoided leading language (e.g., "attitude" only appears in answer options as a colloquial term, not a theory label). Let me know if you need adjustments!
