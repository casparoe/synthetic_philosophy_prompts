  We are building a quiz to distinguish between six theories of pleasure. The theories are:

  (1) Homogeneous feeling theory: All pleasures share a distinctive felt quality (hedonic tone).
  (2) Heterogeneous feeling theory: Pleasures are felt but have no common phenomenal quality; they are unified by something else (e.g., supervenience on overall experience).
  (3) Attitudinal theory (Feldman): Pleasure is a propositional attitude (enjoying/taking pleasure in something) and not necessarily a sensation.
  (4) "Way of feeling" theory (Ayer-ish): Pleasure is a manner or mode of experiencing, not a separate component.
  (5) Motivational/dispositional account: Pleasure is whatever tends to keep you engaged or draws you back (behavioral disposition).
  (6) Deflationary: Pleasures have no unifying property; hedonism about well-being must be rethought.

  The quiz must use the following cases:
  - Masochism (pain and pleasure)
  - Deceived businessman (false belief)
  - Runner's flow or mathematician's absorption (no warm feeling located)
  - Contrast between sensory pleasure (hot shower) and attitudinal (schadenfreude)
  - Pleasure drug (feeling without object)
  - Anticipation (looking forward)

  Each question is a scenario with 2-4 answer options. We need 10-12 questions.

  We must avoid leading questions and design so that students answer based on intuitions.

  We also need a scoring key that maps patterns of answers to the theories, allowing for mixed patterns and noting which theories might be confused.

  Let's design the questions:

  Question 1: Masochism
  Scenario: Alex is a masochist. During a consensual BDSM session, Alex experiences intense pain from being whipped. Alex says, "I love this pain; it feels amazing." What is Alex experiencing?
  A. Only pain (the pleasure is just psychological, but the sensation is pain)
  B. Both pain and pleasure (two distinct experiences at once)
  C. Pleasure (the pain is actually a form of pleasure for Alex)
  D. Neither (it's a complex state that isn't purely pain or pleasure)

  Question 2: Deceived Businessman
  Scenario: Ben has worked hard for years and believes he has been promoted to CEO. He celebrates with champagne and feels overjoyed. Later, he finds out the promotion was a clerical error and he wasn't actually promoted. At the moment of celebration, when Ben was feeling overjoyed, was he experiencing pleasure?
  A. Yes, he was definitely feeling pleasure at that time.
  B. No, because his belief was false, so the joy wasn't real pleasure.
  C. It was pleasure at the time, but it wasn't valuable because it was based on a false belief.
  D. It was a feeling of joy, but not pleasure because pleasure requires truth.

  Question 3: Runner's Flow
  Scenario: Charlie is a long-distance runner. During a race, Charlie enters a state of "flow": completely absorbed in the running, feeling no distinct positive sensations, but totally focused and engaged. Charlie reports afterward: "I wasn't feeling happy or anything, but it was deeply satisfying and I didn't want to stop." Was Charlie experiencing pleasure during the flow state?
  A. Yes, because it was satisfying and she wanted to continue.
  B. No, because she didn't feel any positive sensation or happiness.
  C. It was a form of pleasure, but not a sensory one; it was more about engagement.
  D. It wasn't pleasure, but it was something else positive.

  Question 4: Sensory vs. Attitudinal Pleasure
  Scenario: Consider two situations:
     (i) Dana is taking a hot shower after a long day and feels a warm, relaxing sensation.
     (ii) Dana hears that a rival, who cheated to get ahead, has been fired. Dana feels a sense of satisfaction and thinks, "Justice was served," but doesn't feel any particular physical sensation.
  Are both situations examples of pleasure? If so, are they the same kind?
  A. Yes, both are pleasures and they feel the same kind of good.
  B. Yes, both are pleasures, but they feel very different (shower is physical, satisfaction is mental).
  C. Only the hot shower is real pleasure; the satisfaction about the rival is not pleasure, it's just a thought.
  D. Only the satisfaction about the rival is real pleasure because it's about something; the shower is just a sensation.

  Question 5: Pleasure Drug
  Scenario: Evan takes a drug called "Euphorium" that causes a strong, positive feeling of well-being. The feeling isn't about anything in particular; it's just a general sense of euphoria. Evan isn't thinking about anything; he's just lying there feeling good. Is this pleasure?
  A. Yes, it's a pure feeling of pleasure.
  B. It's a feeling, but it's not pleasure because pleasure has to be about something.
  C. It's pleasure, but a very shallow kind because there's no object.
  D. It's not pleasure because pleasure requires an activity or engagement.

  Question 6: Anticipation
  Scenario: Fiona is planning a vacation to Hawaii. She hasn't left yet, but she spends a lot of time thinking about it and feels a warm, excited feeling. Is the enjoyment she feels while anticipating the vacation a pleasure in itself?
  A. Yes, the anticipation is pleasurable in the present moment.
  B. No, the pleasure is only in the future when she actually experiences the vacation; the anticipation is just a sign of that future pleasure.
  C. The anticipation is pleasant, but it's a different kind of pleasure from the actual experience.
  D. The anticipation isn't pleasure; it's just a cognitive state.

  Question 7: Pain Without Aversion
  Scenario: Greg has a condition where he feels pain but doesn't mind it. For example, when he stubs his toe, he feels the sharp sensation but doesn't find it unpleasant or have any desire to stop it. He says, "It's like a strong sensation, but I don't dislike it." Is Greg experiencing pain? And is he suffering?
  A. He feels pain but it's not unpleasant, so he's not suffering.
  B. He feels pain and it is unpleasant by definition, so he must be suffering even if he says he isn't.
  C. Without the unpleasantness, it's not really pain; it's just a sensation.
  D. He is experiencing a pain sensation without the negative evaluation, so it's pain but not suffering.

  Question 8: Enjoyment Without Feeling
  Scenario: Hannah is listening to her favorite piece of music. She says she is enjoying it immensely, but when asked, she cannot identify any particular feeling of pleasure. She says, "It's not that I feel a certain way; the music just absorbs me and I value the experience." Is Hannah experiencing pleasure?
  A. Yes, because she says she is enjoying it and values it.
  B. No, because she can't point to any feeling of pleasure.
  C. She is experiencing pleasure, but it's not a feeling; it's an attitude.
  D. It's not pleasure, but it is a positive experience.

  Question 9: Motivation and Pleasure
  Scenario: Ian is playing a challenging video game. He keeps failing at a level but is determined to beat it. He says he is frustrated but also feels driven to continue. He doesn't describe the experience as fun or pleasant. Is Ian experiencing pleasure?
  A. Yes, because he is motivated to keep going, so it must be pleasurable.
  B. No, because he says it's frustrating and not pleasant.
  C. The motivation to continue is a sign of pleasure, even if he doesn't call it that.
  D. It's not pleasure; it's a different kind of motivation.

  Question 10: Pleasure and Desire
  Scenario: Julia is eating a delicious meal. She is enjoying every bite and desires to eat more. Later, she is taking a bitter-tasting medicine. She doesn't enjoy it but desires to take it because it will make her healthy. How do these two situations compare?
  A. Both involve pleasure because she desires both, but the medicine is less pleasurable.
  B. Only the meal involves pleasure; the medicine involves desire without pleasure.
  C. The meal involves pleasure and the medicine does not, but both involve desire for different reasons.
  D. Pleasure is when you desire what you are doing; so in both cases, she has pleasure because she desires the action (eating for the meal, taking for the medicine).

  Question 11: False Pleasure?
  Scenario: Kevin has a brain implant that makes him feel happy. He is told that the happiness is because of his successful career, but in reality, the implant is causing the happiness regardless of his life circumstances. Is Kevin experiencing pleasure?
  A. Yes, he feels happy, so he is experiencing pleasure.
  B. No, because the happiness isn't based on real circumstances; it's artificial and false.
  C. It's a feeling of pleasure, but it's not valuable because it's not connected to reality.
  D. Pleasure doesn't require a reason, so it's real pleasure.

  Question 12: Mixed Feelings
  Scenario: Leah is watching a sad movie. She cries during the film and feels what she describes as "a heavy heart," but she also feels that the experience is deeply moving and valuable. She says, "I'm glad I watched it, even though it made me sad." Is Leah experiencing pleasure?
  A. Yes, because she values the experience overall.
  B. No, because she is feeling sad.
  C. She is experiencing both pleasure and pain at the same time.
  D. The sadness is painful, but there is pleasure in appreciating the art.

