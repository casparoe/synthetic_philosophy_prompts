  Recently, they encountered an argument that challenges this view. The argument claims that supervaluationism actually ends up asserting there is a sharp boundary, which is exactly what it was supposed to deny. The user is distressed because this undermines their preferred position. They want to maintain both the idea that there's no sharp boundary and the supervaluationist principle that allows for bivalence in clear cases.

