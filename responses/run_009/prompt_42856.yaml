answer: |-
  I completely understand why this argument feels like a wrecking ball to the view you found attractive. That gut feeling you had – that there *can't* be a magic hair count where baldness suddenly clicks on – is powerful and seems fundamental. And the supervaluationist view (the one using "admissible precisifications") promised to respect that feeling while preserving useful logical truths like the law of excluded middle ("he's bald or he isn't"). Seeing it apparently forced to admit a sharp boundary feels like a betrayal. Let's walk through why the argument seems compelling and where, I believe, the daylight between the two camps actually remains.

  The argument hinges on step (6): equating the statement "There is some number of hairs n such that a man with n hairs is bald and a man with n+1 is not" with the claim that *there is a sharp boundary in reality* – the very claim the rival camp believes. This is the step I think you should reject, or rather, reinterpret carefully. Rejecting it doesn't mean abandoning the core insights of supervaluationism or your intuition about no magic hair, but it does come with a cost – a cost worth paying, I think, because it preserves what matters most about the view.

  Here's the crucial point: The statement "There is some n such that n is bald and n+1 is not" is indeed **supertrue** (true on every admissible precisification). Every precisification *does* draw a sharp line *somewhere* in the borderline region. So, according to principle (1), that existential statement *is* true simpliciter. The supervaluationist has to accept that.

  *But*, this does *not* mean that the supervaluationist is committed to the rival camp's view. The rival camp believes there is **one specific, correct boundary** out there in the world, independent of our concepts or language, even if we can't know which one it is. They believe reality itself carves the bald from the non-bald at a precise point.

  Supervaluationism, even after accepting the existential statement as true, *denies this completely*. The key is that while every precisification has *a* sharp boundary, *no particular boundary is singled out as the real one*. For *any specific number n*, the statement "n is bald and n+1 is not" is **not** supertrue. Why? Because there are admissible precisifications that draw the boundary *before* n (making n non-bald) and others that draw it *after* n (making n+1 bald). The statement about a *specific* n being the boundary is only true in *some* precisifications and false in others; it's borderline, indeterminate. There is *no* n such that it is determinately true that *this n* marks the boundary.

  So, the cost of rejecting step (6)'s interpretation is this: You have to accept that the *existential* claim "There is a sharp boundary *somewhere*" is true simpliciter, while simultaneously insisting that it is *fundamentally indeterminate* *where* that boundary is. No specific n marks the boundary. The "existence" of the boundary is a byproduct of the *logical requirement* that every way of making the concept precise *must* draw a line *somewhere* in the grey area, not a discovery about a pre-existing, precise fact in the world.

  This preserves what you (and most supervaluationists) fundamentally want: the denial that there is a *specific, knowable-or-not magic hair count* that constitutes the boundary in reality. The existential statement's truth is a logical consequence of the supervaluationist machinery applied to vague predicates within a classical framework – it doesn't mean baldness has a hidden precise essence. The daylight between the camps remains stark:

  1.  **The Sharp Boundary Camp:** Believes reality dictates **one specific n** is the boundary. We are ignorant of which n it is.
  2.  **The Supervaluationist Camp (your original preference):** Denies reality dictates any **specific n** as the boundary. The boundary is fundamentally indeterminate. The truth of the existential statement "There is *some* n..." reflects the *structure* of our precisifications, not a hidden precise fact.

  Yes, it feels a bit odd that the view asserts "There is a sharp boundary *somewhere*" while denying we can point to it *or* that it has a specific location. But this oddity is the price of keeping both your core intuition (no magic hair count) and principle (1) (which gives you bivalence for clear cases and truths like "Either he's bald or he isn't").

  Is the cost worth paying? I think so, for two reasons. First, it directly respects your deep-seated intuition that there's no *fact of the matter* about whether a specific borderline man with, say, 42,178 hairs is bald – which the sharp boundary camp *must* say there is (even if we can't know it). Second, it explains *why* we can't find the boundary: not because we're ignorant, but because there genuinely *isn't* one to find. The existential truth is a logical shadow cast by the precisifications, not a hidden feature of the world itself. The two camps were *never* saying the same thing; one posits a hidden definite boundary, the other denies its definiteness while acknowledging a logical consequence of its own framework. Your gut feeling about the absurdity of a magic hair count remains intact.
