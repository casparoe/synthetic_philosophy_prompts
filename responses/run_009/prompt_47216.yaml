prompt: |-
  One of my PhD students, a Thomist with a missionary streak, thinks he's finally got a knockdown version of the grounding objection to Molinism, and I keep telling him it proves too much, but I'll be damned if I can say exactly where it slips. Here's his argument as he ran it past me:

  (1) Molinism says that logically prior to any decree to create, God knows all the true counterfactuals of creaturely freedom -- if Curley, everyone's favorite bribable mayor from the literature, were offered the bribe in circumstances C, he would freely take it.
  (2) These counterfactuals are, if true at all, true independently of God's will. That's non-negotiable: the whole point of middle knowledge is to let God survey how creatures would freely act and then choose a world, without God being the author of what Curley does in it.
  (3) Every contingent truth is grounded -- true in virtue of how things are, in facts about actual substances, their natures, and their powers.
  (4) No creature grounds the Curley conditional, since in the world where it matters Curley is never even created, and an uncreated creature has no goings-on to ground anything.
  (5) God doesn't ground it either: if God's will made it true that Curley would freely take the bribe, the truth would be a decree, and the taking wouldn't be free in any sense worth the name.
  (6) So if the conditional is true, it's a contingent truth with no ground at all -- just floating there, true in virtue of nothing whatsoever.
  (7) There are no ungrounded contingent truths. A proposition that nothing makes true isn't true, and so isn't knowable, not even by an omniscient being.
  (8) So no counterfactuals of creaturely freedom are true, middle knoweldge has no objects, and Molinism turns out to be knowledge of nothing.

  Now here's what keeps me up. Substitute "Peter will deny Christ tomorrow" for the Curley conditional and run the whole thing again. (2) still holds -- keep the freedom, no divine willing of the denial. (3) is the same grounding principle. (4) nothing actual yet grounds a claim about tomorrow. (5) God doesn't will the denial. (6) floating truth. (7) no floating truths. (8) no foreknowledge of free actions. My student just shrugs -- he's happy to take a bullet, says he'll appeal to God's timeless eternity and claim the future event itself is the ground, with all the tense talk transposed into the key of eternity. But when I ask whether whatever that move is doing for him is available to the Molinist too -- why can't Curley's counterfactual get grounded in the same eternity, somehow? -- he mutters about unactualized possibles and changes the subject, which is how I know he doesn't have an answer either. And to make things worse, he adds for good measure that even if (7) were false, you'd have brute contingent truths that God has to take as given -- truths he didn't make and couldn't alter -- which he says wrecks divine aseity on its own, so Molinism loses either way.

  So: which premise or step do I reject, and what does rejecting it cost? I'll admit upfront I'd rather keep (7) than keep Molinism -- I'm not sentimental about middle knowledge -- but I've got another student writing her dissertation on it, and I'd like to hand her something more precise than "the grounding objection feels bad."
reasoning: |-
  Okay, let me start by understanding the core issue here. The user, a PhD advisor, has a Thomist student who presents a grounding objection to Molinism. The argument claims that counterfactuals of creaturely freedom (CCFs) can't be grounded, leading to Molinism's failure. The advisor worries this argument also threatens divine foreknowledge of free actions, which even Thomists accept. The student dismisses this by appealing to God's timeless eternity for future contingents but denies this solution to Molinists. The advisor wants to identify exactly where the argument fails and what rejecting that premise would cost, especially since another student is working on Molinism.

  First, I need to parse the student's argument step by step. Premise (2) asserts that CCFs are true independently of God's will. Premise (3) states that all contingent truths must be grounded in actual substances. Premises (4) and (5) argue that neither creatures nor God can ground CCFs. This leads to (6) and (7) concluding that ungrounded contingent truths can't exist. The advisor's parallel argument replaces CCFs with future contingents like "Peter will deny Christ," showing the same problem for divine foreknowledge. The student tries to resolve this for foreknowledge by invoking God's timeless eternity, grounding the truth in the future event itself from an eternal perspective. But he refuses this move for Molinism, claiming unactualized possibles can't ground anything.

  The key tension is the inconsistent treatment of grounding for future contingents versus CCFs. The student allows future events to ground truths from an eternal standpoint but denies this for unactualized possibles in CCFs. So the problem might lie in premise (4), which claims that uncreated creatures have no goings-on to ground CCFs. If God's eternity can make future events present and thus grounding, why can't possible but non-actual events serve a similar role? The Thomist might argue that actual existence is necessary for grounding, but this raises questions about the ontological status of possibilities.

  Rejecting premise (4) seems viable. One could argue that CCFs are grounded in the natures and essential properties of possible creatures. For example, Curley's essence includes dispositions that make certain counterfactuals true. This requires accepting that essences or possible beings have some reality, which Thomists might reject as Platonic. Alternatively, grounding could occur in God's knowledge of possibilities, but that risks making God the ground and violating creaturely freedom.

  Another option is challenging premise (7), the principle that all contingent truths must be grounded. Some philosophers accept brute contingents, but this clashes with divine aseity, as the student notes. The advisor prefers keeping (7), so this might not be ideal. Premise (3) could also be questioned. If grounding doesn't require actual existence, but mere possibility, then CCFs could be grounded in possible worlds. However, Thomists typically reject such modal realism.

  The most promising approach is targeting the asymmetry in the student's treatment. If timeless eternity allows future contingents to be grounded, then a similar timeless perspective could ground CCFs in possible but non-actual states. The student's refusal to extend this to Molinism seems arbitrary. Pointing out this inconsistency forces the Thomist to either abandon their solution for foreknowledge or accept it for Molinism. Since they won't do the latter, they must revisit their grounding principle or explain the ontological difference between future and possible events.

  The advisor's other concern is divine aseity. If CCFs are brute, God depends on them, threatening aseity. Grounding them in God's nature might help, but that risks making God the cause of free actions. A better move could be to ground CCFs in the natures of possible creatures, which are part of God's intellect, thus preserving aseity. But this requires a specific view of divine ideas that Thomists may not share.

  In summary, rejecting premise (4) by allowing possible entities to ground truths, or highlighting the inconsistency in the student's timeless solution, seems the best strategy. The cost involves committing to a metaphysics where possibilities have sufficient reality to ground truths, which may conflict with Aristotelian-Thomistic views. However, this provides a clear rebuttal and helps the other student working on Molinism by pinpointing the argument's weakness.
answer: |-
  Your student's argument is clever but contains a critical asymmetry in its treatment of future contingents vs. counterfactuals of creaturely freedom (CCFs). The flaw lies in **premise (4)** and its inconsistent application. Here's the breakdown:

  ### The Core Problem: Premise (4) and Its Asymmetry
  - **Premise (4) for CCFs**:  
    *"No creature grounds the Curley conditional [...] an uncreated creature has no goings-on to ground anything."*  
    This assumes that only *actualized* creatures or events can ground truths. For CCFs (which describe *unactualized* scenarios), grounding is rejected because Curley isn't created.  

  - **Premise (4) for Future Contingents**:  
    *"Nothing actual yet grounds a claim about tomorrow."*  
    Here, your student *rejects* this implication for future contingents by appealing to God's timeless eternity: the future event *itself* grounds the truth from an eternal perspective.  

  **The inconsistency**: If timeless eternity allows a *non-actual future event* (Peter's denial) to ground a truth *now*, why can't timeless eternity allow a *non-actual possible event* (Curley's taking the bribe in C) to ground the CCF? Both are "not yet actual" from a temporal perspective, yet your student grants grounding to one but not the other.  

  ### Why Rejecting (4) Resolves the Issue
  1. **Grounding CCFs in Eternal/Possible Reality**:  
     - If future contingents can be grounded in the *actual future event* from God's eternal standpoint, CCFs can be grounded in *possible but non-actual events* from that same standpoint.  
     - **Molinist move**: CCFs are true in virtue of *how possible creatures would freely act* in specific circumstances. These truths are grounded in:  
       - The *essences* or *natures* of possible creatures (e.g., Curley's essential properties).  
       - God's eternal knowledge of *possibility space* (without causing it).  

  2. **The Cost of Rejecting (4)**:  
     - **Metaphysical Commitment**: You must accept that *possibilities* or *essences* have sufficient ontological robustness to ground truths. This clashes with strict Aristotelian-Thomistic act/potency metaphysics (which ties truth-grounding strictly to *actual* substances).  
     - **Divine Aseity**: Grounding CCFs in creaturely natures (even unactualized ones) might imply God "finds" truths He didn't create. However, if these natures derive from God's intellect (as divine ideas), aseity is preserved—God knows possibilities *because* He knows His own power to create them.  

  ### Why Other Premises Can Stand
  - **(2) & (5)**: Correct that CCFs must be independent of God's *will* to preserve freedom. Grounding them in creaturely natures (not divine decrees) satisfies this.  
  - **(3) & (7)**: Grounding remains intact if we expand "how things are" to include *real possibilities* or *essential properties*.  
  - **(6)**: Avoided if CCFs are grounded.  

  ### Handling the Student's Responses
  - **On Timeless Eternity**:  
    Your instinct is correct: if eternity grounds future contingents, it can ground CCFs. His appeal to "unactualized possibles" is question-begging. Press him: *Why* can’t Curley’s possible action ground the CCF from an eternal perspective, just as Peter’s future action grounds the prediction?  

  - **On Divine Aseity**:  
    - **Molinist reply**: CCFs are grounded in *God’s knowledge of His own creative possibilities*. God doesn’t "find" brute truths; He knows what free creatures *would do* because He comprehends all possible creaturely natures (which are reflections of His essence).  
    - **Thomist alternative**: Some Thomists (e.g., Domingo Báñez) ground future contingents in God’s *causal decree*, but this sacrifices libertarian freedom. Your student can’t have both foreknowledge *and* robust freedom without a grounding solution like Molinism.  

  ### Practical Advice for Your Dissertator
  Hand her this rebuttal:  
  > *"The grounding objection fails by inconsistently applying premise (4). If timeless eternity allows future contingents to be grounded in actual-but-future events, then CCFs can be grounded in possible-but-non-actual events or creaturely essences. Rejecting this symmetry requires denying God's comprehensive knowledge of possibility space—a greater cost than Molinism’s moderate realism about potentials."*  

  **Cost Summary**: Rejecting (4) commits to a metaphysics where possibilities/essences are truthmakers. This is a moderate realist position (acceptable to Molinists, Scotists, or open-theists) but untenable for strict Thomists. However, since your student already smuggles in grounding via eternity for foreknowledge, he owes a principled distinction—and none exists without undermining his own foreknowledge solution.  

  **Final note**: If your student insists on divine timelessness *and* grounding future contingents in the future event itself, he’s tacitly endorsing a model where non-present realities ground truths. The Molinist merely extends this to non-actual realities. His objection isn’t to grounding per se, but to *possibilia*—a separate debate Molinism can navigate with divine ideas theory.
