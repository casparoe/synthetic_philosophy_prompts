prompt: |-
  I've been reading rationalist blogs and the Effective Altruism Forum for the better part of a decade, and I've noticed that discussions of our obligations to future people tend to collapse into slogan-swapping — 'the future is vast', 'equal moral worth regardless of birth date' — without anyone spelling out what their actual verdicts on concrete cases commit them to. So I've written down mine, on cases in the intergenerational-climate neighbourhood, and I'd like your help extracting the principle behind them, if there is one.

  My verdicts: a policy that delivers a large present convenience while killing a billion people in 2200 is about as wrong as one that delivers the same convenience by killing a billion people today; I'm not moved by the fact that the victims in 2200 will exist only because of the emitting lifestyle that harms them — creating someone as one of the harmed doesn't cancel the harm; I think we're permitted to give some priority to the present global poor over the future global poor, even though I'd reject giving priority to compatriots over foreigners on grounds of mere distance; I accept discounting for uncertainty (humanity might not be around, or the projections might be off), but pure time discounting — counting a life in 2200 for intrinsically less than a life today just because it is later — strikes me as indefensible; yet when I imagine a choice between £100 of benefit now and £120 of benefit in 2200 for the very same sort of recipient, I find I care noticeably less about the £120, and I can't fully persuade myself this is only uncertainty; and I think a present generation that is itself badly off — poor, and bearing heavy adaptation costs — has weaker climate obligations than a rich present generation, even though the victims of the emissions are the same future people in both scenarios.

  I can see at least two candidate rules that might fit some of this: one on which obligations to future people are grounded in their interests, counted without pure time discounting but moderated by uncertainty and by how well-off the duty-bearer is; and another on which the strength of the duty varies with how much the duty-bearer benefits from creating the risk. They diverge on at least one of my verdicts, and possibly more. So: is there a single principle that captures the pattern, or the smallest set of principles that does? Where my verdicts conflict, I'd like you to say which ones should be overturned rather than rescued with ad hoc epicycles. Please also tell me what the resulting account predicts for two cases I haven't decided: a rich generation asked to forgo a modest gain to prevent a small but certain harm to a very large number of people ten thousand years hence; and a very poor generation asked to bear substantial costs now to benefit future people who, on credible projections, will be much richer than they are.
reasoning: |-
  Okay, let me tackle this user's query. They've been engaging with rationalist and EA content for a decade and are frustrated with slogan-based discussions on obligations to future people. They want their concrete verdicts analyzed to find underlying principles and resolve conflicts.

  First, I need to understand their verdicts. They oppose pure time discounting but notice they care less about £120 in 2200 than £100 now. They prioritize present poor over future poor but reject distance-based priorities. They see harm to future people as serious even if they exist due to our actions. The duty-bearer's wealth matters, and uncertainty justifies discounting.

  Looking at their examples, there's tension. Equal moral weight for future people conflicts with caring less about distant benefits. The "benefit asymmetry" in their monetary example doesn't fit with their other stances. I need to identify which verdict might be inconsistent.

  The user mentions two candidate rules: interests-based with modifiers, and beneficiary-pays. The latter fits their stance on the emitting generation's responsibility but not the monetary example. The beneficiary-pays principle might explain why creating harmed people doesn't cancel harm, but it doesn't cover the discounting in the £100 vs £120 case.

  The asymmetry in the monetary case suggests a form of discounting they reject. Maybe it's cognitive bias rather than a principled stance. Pointing this out could help them reconsider. Also, their allowance for prioritizing the present poor could be based on capacity to help rather than partiality.

  For the unresolved cases, applying the principles: the rich generation should prevent harm even far future because the cost is modest. The poor generation shouldn't bear high costs if future people are richer, based on capacity and beneficiary-pays.

  Overall, the core principle is equal moral weight with modifiers: capacity to help, beneficiary-pays, and uncertainty. The conflict in their monetary verdict needs reevaluation, possibly as an inconsistency or bias. Highlighting that might resolve the tension in their framework.
answer: |-
  Based on your detailed verdicts, a single, coherent principle *almost* captures them, but a small tension requires resolving one verdict. Here's the breakdown:

  1.  **Core Principle: Equal Moral Consideration Across Time:** Future individuals possess the same fundamental moral weight as present individuals, simply by virtue of being persons with interests. Harming someone in 2200 is morally equivalent to harming someone today, all else being equal. This directly supports your rejection of pure time discounting and your stance that killing a billion in 2200 is as wrong as killing a billion today.

  2.  **Key Modifiers:**
      *   **Uncertainty Discounting:** Future outcomes are discounted based on the *probability* they will occur (e.g., extinction risk, model inaccuracy). This is a rational adjustment for risk, not intrinsic devaluation.
      *   **Duty-Bearer Capacity:** The strength of an obligation is moderated by the duty-bearer's current capacity to fulfill it without undue hardship. This directly explains why a poor generation bearing adaptation costs has weaker climate obligations than a rich one facing the same future harm. It also justifies prioritizing the *present* global poor over the *future* global poor *in the context of resource allocation by the current generation* – it's based on the current generation's capacity to effectively alleviate present suffering *now*, not on the intrinsic worth of present vs. future people or mere distance. This distinguishes it from compatriot preference, which lacks this "capacity to act effectively *right now*" justification.
      *   **Causal Responsibility / Beneficiary-Pays Principle:** An agent has a heightened obligation to mitigate harms they *cause* or from which they *benefit*, even if the victims wouldn't exist otherwise. This explains why you reject the "non-identity defense" (creating harmed people doesn't cancel harm). The emitting generation benefits from the convenience and bears responsibility for the harm, creating a special obligation regardless of the victims' contingent existence.

  **The Tension and Resolution:**

  Your verdicts conflict on **the £100 now vs. £120 in 2200 case**.

  *   Your *stated principles* (Equal Moral Consideration + Uncertainty Discounting only) strongly suggest you should be indifferent or even prefer £120 in 2200 if the uncertainty-adjusted expected value is equal or higher. You explicitly reject pure time discounting as "indefensible."
  *   Yet, you report "caring noticeably less" about the £120 in 2200 and feel it's not *just* uncertainty.

  **Resolution: Which Verdict Should Be Overturned?**

  The **£100 now vs. £120 in 2200 verdict** should be critically re-examined and likely overturned as inconsistent with your stronger, well-justified core principle.

  *   **Why it's inconsistent:** This feeling of "caring less" *is* pure time discounting in intuitive form. You've provided powerful arguments against it elsewhere. Attributing it to something besides uncertainty *is* granting intrinsic moral weight to timing, which contradicts your rejection of pure time discounting and your core stance on equivalent harm across time.
  *   **Possible Explanations:** This feeling might stem from:
      *   **Hidden Uncertainty:** Uncertainty about the *mechanism* delivering the benefit, the recipient's existence/needs, or inflation/real value might be greater than consciously acknowledged.
      *   **Cognitive Bias:** Hyperbolic discounting or present bias is a deeply ingrained psychological tendency, not a sound moral principle.
      *   **Reduced Empathic Vividness:** It's harder to feel vividly connected to a distant future recipient, but this doesn't change their moral claim.
      *   **Administrative/Transaction Cost Uncertainty:** Even if the benefit itself is certain, ensuring it reaches the *intended* recipient centuries later involves immense practical uncertainty.
  *   **The Fix:** Align this verdict with your principles. For a *truly identical* benefit to the *same type* of recipient, with uncertainty *fully accounted for*, £120 in 2200 should be preferred to £100 now. If you still feel otherwise after rigorous uncertainty adjustment, it points to an unresolved bias conflicting with your reasoned ethics.

  **The Resulting Account:**

  *   **Core:** Equal moral weight for all persons, present and future.
  *   **Modifiers:**
      1.  **Uncertainty:** Discount future impacts based on the probability they materialize.
      2.  **Duty-Bearer Capacity:** Obligations are weaker if fulfilling them imposes severe hardship on the duty-bearer relative to their current state.
      3.  **Causal Responsibility/Beneficiary-Pays:** Obligations are stronger when the duty-bearer causes the harm or benefits from the actions creating the risk.

  **Predictions for Your Undecided Cases:**

  1.  **Rich generation & modest gain vs. small/certain harm to vast numbers in 10,000 years:**
      *   **Prediction: Strong obligation to forgo the gain and prevent the harm.**
      *   **Reasoning:** The core principle (vast number of future lives = immense moral weight) dominates. Uncertainty discounting is *low* because the harm is specified as *certain* (though the very long timescale might introduce *some* non-zero extinction/radical-value-change uncertainty). The duty-bearer is *rich*, so capacity is high. The modest gain to them is vastly outweighed by the immense, certain harm to future people, even discounting slightly for deep-time uncertainty. The beneficiary-pays principle might not strongly apply unless the modest gain is directly linked to causing the harm.

  2.  **Very poor generation & substantial costs now to benefit much richer future people:**
      *   **Prediction: Weak or no obligation to bear the substantial costs.**
      *   **Reasoning:** The core principle grants moral weight to the future beneficiaries. However, the **duty-bearer capacity** modifier is decisive. Imposing *substantial costs* on a *very poor* generation constitutes severe hardship relative to their current state. Furthermore, the **beneficiary-pays principle** is weak or inverted – the poor generation isn't causing harm to the future rich; they are being asked to sacrifice for beneficiaries who will be objectively better off. Uncertainty might play a role (will future people *really* be richer?), but the capacity and lack of responsibility factors are paramount. The obligation is minimal.

  **In Summary:**

  Your core intuition is **Equal Moral Consideration + Duty-Bearer Capacity + Causal Responsibility/Beneficiary-Pays, discounted for Uncertainty.** This framework captures almost all your verdicts coherently. The primary conflict arises from your intuitive reaction to the monetary discounting case, which should yield to your stronger, principled rejection of pure time discounting. The account predicts that the rich generation should prevent the far-future harm, while the poor generation has little obligation to sacrifice for richer descendants.
