answer: |-
  Your desiderata are exceptionally well-reasoned—far from naïve. Below is a refined/extended list, with justifications, negotiability flags, and analysis of tensions. Crucially, **one subset is jointly unsatisfiable** for policy timelines, as noted in the conclusion.

  ### Core Desiderata (Refined & Extended)
  1. **Specify the Growth Quantity**  
     *Requirement*: The theory must define the *primary metric* of "explosion" (e.g., algorithmic efficiency, automation capacity, economic productivity, or raw compute).  
     *Why non-negotiable*: These metrics diverge. A 1000x boost in algorithm efficiency may not translate to GDP if deployment bottlenecks exist. Evidence from chip design progress ≠ evidence of societal disruption.  
     *Negotiable*: Which metric matters most (e.g., economic impact vs. cognitive capability) depends on the theory’s purpose.  

  2. **Map the Feedback Loop**  
     *Requirement*: Identify the *tightest feedback cycle* driving acceleration (e.g., AI coding AI, AI designing hardware, market-driven R&D reinvestment).  
     *Why non-negotiable*: Hardware loops face physical constraints (e.g., fab plant construction); pure-software loops could accelerate exponentially. Ignoring this conflates fundamentally different processes.  
     *Negotiable*: Whether a loop *will* dominate (e.g., will hardware innovation keep pace?) is debatable, but the loop’s structure must be specified.  

  3. **Use Non-Anthropocentric Units**  
     *Requirement*: Express speed in units *intrinsic to the process* (e.g., "doublings of researcher-equivalent output," "orders of magnitude in task performance per self-improvement cycle").  
     *Why non-negotiable*: "Years" are arbitrary to AI. A takeoff lasting 3 months but spanning 20 doublings of capability is "fast"; one lasting 5 years with 2 doublings is "slow" — yet both could fit in a "5-year" headline.  
     *Negotiable*: The choice of unit (e.g., doublings vs. FLOP/$) can vary.  

  4. **Disambiguate Discontinuity vs. Threshold**  
     *Requirement*: Distinguish between:  
     - **True discontinuity**: A phase change in capability (e.g., recursive self-improvement enabling qualitatively new optimization).  
     - **Threshold effect**: Gradual gains crossing a critical point (e.g., AI finally reliable enough for mass adoption).  
     *Why non-negotiable*: A threshold (e.g., regulatory approval) may create a *perceived* "overnight" explosion despite years of incremental progress. Theories implying novel dynamics must not conflate these.  
     *Negotiable*: Whether thresholds *exist* in practice (e.g., is there a deployment barrier?).  

  5. **Define Falsifiability Conditions**  
     *Requirement*: State *observable thresholds* that, if unmet, would disprove the theory (e.g., "If no AI system autonomously improves its training code by 2030, the fast-takeoff hypothesis is falsified").  
     *Why non-negotiable*: Without this, theories become unfalsifiable just-so stories (e.g., "takeoff is slow because hidden barriers exist").  
     *Negotiable*: The timeframe for falsification (e.g., 5 vs. 20 years) depends on initial assumptions.  

  ### Critical Additions
  6. **Account for Scalability Limits**  
     *Requirement*: State *ceiling mechanisms* that could cap growth (e.g., data scarcity, energy costs, diminishing returns to scale, alignment failures).  
     *Why non-negotiable*: Physical/logistical limits constrain even recursive improvement. A theory ignoring ceilings implicitly assumes infinite scalability.  
     *Negotiable*: Which limits are binding (e.g., energy vs. algorithms).  

  7. **Specify Recursive Depth**  
     *Requirement*: Clarify the *meta-improvement capacity*: Can the system improve its *own* improvement mechanisms (e.g., AI researching better AI architectures vs. merely coding)?  
     *Why non-negotiable*: Shallow recursion (e.g., automating tasks) causes linear/sigmoidal growth; deep recursion (e.g., inventing new math) could be explosive.  
     *Negotiable*: How many layers of recursion are plausible.  

  ---

  ### **The Crucial Tension: Joint Unsatisfiability for Policy**  
  **The subset of (3) Non-anthropocentric Units + (5) Falsifiability + Policy-Relevance within 10 Years is *jointly unsatisfiable*.** Here’s why:  
  - **Conflict**: Non-anthropocentric units (e.g., "doublings per self-improvement cycle") are essential for theoretical rigor but opaque to policymakers. A "slow" takeoff in doublings/time might still disrupt society within 10 years due to compounding. Conversely, a "fast" takeoff in doublings might take 15 years to visibly impact GDP.  
  - **Falsifiability Gap**: To falsify a theory on policy timelines (e.g., 10 years), you need observable *proxies* (e.g., economic metrics). But proxies (e.g., GDP growth) conflate the growth quantity (1), feedback loops (2), and thresholds (4). A theory surviving 10-year falsification might still be wrong about the *underlying* acceleration.  
  - **Implication**: Theories can be rigorous (satisfying 1–5,7) *or* policy-useful within a decade, but not both. For example:  
    - A theory using "doublings" (satisfying 3) may predict explosive growth starting in 2040 — useless to today’s policymakers.  
    - A theory predicting "no GDP impact before 2035" (policy-relevant) might be falsified by GDP, but this says nothing about whether recursive improvement is occurring silently.  

  This tension explains why debates feel unproductive: **Forecasters prioritizing explanatory rigor (e.g., AI researchers) use units incompatible with near-term policy, while policymakers demand timelines in years — forcing theorists to abandon precision.** Your framework exposes this as a structural flaw, not mere disagreement.  

  ---

  ### Summary of Negotiability  
  - **Non-negotiable**: (1) Specify growth quantity, (2) Map feedback loops, (3) Non-anthropocentric units, (4) Discontinuity vs. threshold, (5) Falsifiability conditions.  
  - **Negotiable**: Specific metrics (e.g., FLOPs vs. task performance), which scalability limits dominate, timeframe for falsification.  
  - **Key Insight**: The inability to satisfy rigor + near-term policy relevance simultaneously explains why "takeoff speed" debates are often unanchored. Your essay could position this as the central problem.  

  This structure forces theories to explicitly reveal their assumptions — and isolates why consensus is elusive. Well done on identifying the core issue.
