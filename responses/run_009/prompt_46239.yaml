  For counterfactuals, the big tension is comparing:
  - Actual foragers vs actual farmers (measurable)
  - Actual farmers vs hypothetical never-agriculture humans (speculative)
  - Modern humans vs path-not-taken humans (highly speculative)

  *notices tricky temporal framing* 
