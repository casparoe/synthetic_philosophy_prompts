prompt: |-
  Next month I'm presenting at an interdisciplinary workshop on computation and cognition, defending a position I've been calling "borrowed grounding": the claim that the symbol grounding problem, as classically posed, conflates two demands — that a system's internal states be causally connected to the world, and that the connection be non-derivative rather than inherited. Language models satisfy the first: their internal states acquire world-connectedness through the linguistic practices of the grounded human communities whose text they learn from, much as the colors on a map inherit their significance from a cartographic convention they did not create. On this view the classic challenge — how could symbols acquire meaning from ungrounded symbols alone? — was aimed at an imaginary dictionary-like system with no social provenance, and it does not transfer to systems trained on the output of grounded speakers. The audience is mostly embodied and enactive cognition researchers who treat sensorimotor loops as constitutive of meaning, plus two GOFAI-era types who think the whole issue is just an engineering detail, plus a couple of machine learning researchers who will demand an operational definition of "grounding." Draft my Q&A prep sheet: the objections each faction will actually raise, phrased in their own vocabulary and ordered by how much damage each would do, each with a two-minute reply and a note on where the reply is soft. Include the question I'm hoping nobody asks.
