answer: |-
  Here’s a decision procedure grounded in medical ethics and philosophy, designed for efficiency (20 mins/case), transparency, and explicit handling of gray areas. It combines Norman Daniels' "normal species functioning" framework with practical triage steps, while acknowledging its conceptual limitations. The procedure has **5 core questions**, with clear exit ramps for approvals, denials, or value judgments.

  ---

  ### **Boundary Request Decision Procedure**  
  *(20-Minute Committee Workflow)*  

  #### **Step 0: Pre-Screen (Done Before Meeting)**  
  - ✔️ Confirm request is *medically safe* and *legally permissible*. If not, deny immediately.  
  - ✔️ Verify standard treatments/alternatives were considered. If not, return for completion.  

  #### **Step 1: Is This Restoring *Typical* Function?**  
  **Question:** *"Does the patient have a diagnosed dysfunction (disease, disorder, injury) that this intervention corrects or compensates for?"*  
  - **✅ Approve if:** Clear pathology exists (e.g., insulin for diabetes, reconstructive surgery for trauma).  
  - **❌ Deny if:** No pathology exists AND intervention targets a statistically normal trait (e.g., growth hormone for healthy child with familial short stature).  
  - **⚠️ Gray Area:** If pathology is contested or "normal" is ambiguous (e.g., "female sexual dysfunction"), proceed to Step 2.  
  - *Guidance:* "Typical function" = within 2 standard deviations of population norms for age/sex *or* consistent with developmental milestones. Require objective evidence (labs, imaging, DSM/ICD criteria).  
  - *Epistemic Confidence:* **Medium-High**. Draws on Boorse’s biostatistical theory. Weakness: "Normal" can be discriminatory (e.g., equating disability with pathology).  

  #### **Step 2: Is This Preventing Harm?**  
  **Question:** *"Is there a high-probability, medically significant harm that this intervention directly averts?"*  
  - **✅ Approve if:** Harm is imminent, severe, and intervention is prophylactic (e.g., statins for high CVD risk, vaccines for exposure).  
  - **❌ Deny if:** Harm is speculative, social (e.g., bullying), or non-medical (e.g., career disadvantage).  
  - **⚠️ Gray Area:** If harm is medical but probabilistic (e.g., BRCA+ prophylactic mastectomy), proceed to Step 3.  
  - *Guidance:* "Harm" = death, disability, pain, or loss of function. Require risk quantification (e.g., 10-year risk scores). Social harms (stigma, distress) go to Step 4.  
  - *Epistemic Confidence:* **High** for clear prevention (e.g., vaccines). Weakness: Prevention/enhancement line blurs (e.g., PrEP for HIV- vs. cognitive enhancers).  

  #### **Step 3: Does This Alleviate Significant Distress/Impairment?**  
  **Question:** *"Is the patient experiencing clinically significant distress or functional impairment directly linked to the condition?"*  
  - **✅ Approve if:** Impairment is measurable, persistent, and disrupts major life activities (e.g., SSRIs for MDD with work absence).  
  - **❌ Deny if:** Distress is situational/transient or impairment is minor (e.g., "wanting sharper focus for poker night").  
  - **⚠️ Gray Area:** If impairment is domain-specific (e.g., performance anxiety) or distress lacks a diagnosis, proceed to Step 4.  
  - *Guidance:* Use WHO Disability Assessment Schedule (WHODAS) or validated scales. "Functional impairment" = unable to perform ≥1 activity of daily living, work, or study.  
  - *Epistemic Confidence:* **Medium**. Draws on Wakefield’s "harmful dysfunction" but relies on subjective reporting. Weakness: Risk of medicalizing life challenges.  

  #### **Step 4: Is This a Medically Appropriate Response?**  
  **Question:** *"Is this intervention a targeted, evidence-based approach to the identified problem?"*  
  - **✅ Approve if:** Proven efficacy for the indication (e.g., propranolol for performance anxiety) AND risks proportionate.  
  - **❌ Deny if:** Intervention is mismatched (e.g., GH for bullying) or evidence is anecdotal.  
  - **⚠️ Gray Area:** If evidence is off-label but robust (e.g., gabapentin for neuropathy), approve. If societal benefit exists (e.g., ADHD meds during bar prep), proceed to Step 5.  
  - *Guidance:* Require peer-reviewed studies or clinical guidelines. Cosmetic cases pass here if reconstructive (e.g., post-mastectomy).  
  - *Epistemic Confidence:* **High** for on-label uses. **Low-Medium** for off-label (varies by evidence).  

  #### **Step 5: Committee Value Judgment (Chair Owns)**  
  **Question:** *"Does the benefit justify risks/costs given societal norms, justice, and patient autonomy?"*  
  - **✅ Approve if:** Benefits substantially outweigh harms, aligns with hospital values, and no inequity is created.  
  - **❌ Deny if:** Costs/risks disproportionate, or sets precedent undermining care equity.  
  - *Guidance:* Document rationale explicitly. Cite: "Autonomy vs. distributive justice" or "medicalization risk."  
  - *Epistemic Confidence:* **Low**. Inherently subjective. Weakest Point: Defining "proportionality" in resource allocation.  

  ---

  ### **Applied to Cases**  
  #### **Case 1: Growth Hormone for Bullied 11F (Predicted 5’2”)**  
  - **Step 1:** ❌ Deny. No pathology (normal GH, familial short stature).  
  - **Step 2:** ❌ Deny. Harm (bullying) is social, not medical.  
  - **Rationale:** *"Intervention targets a normal variant. Social harms require psychosocial support, not medicalization. Denied."*  
  - *Procedure Outcome:* **Determinate ❌** (Matches your discomfort)  

  #### **Case 2: Propranolol for Violinist’s Stage Fright**  
  - **Step 1:** ❌ No pathology (no psychiatric diagnosis).  
  - **Step 2:** ❌ Harm (lost auditions) is vocational, not medical.  
  - **Step 3:** ⚠️ Gray. Functional impairment (shaking) is domain-specific.  
  - **Step 4:** ✅ Medically appropriate (evidence for beta-blockers in performance anxiety).  
  - **Step 5:** Value Judgment → ⚠️ **Approve?** *But you wanted approval—procedure says no so far.*  
    - **Chair Rationale:** *"Impairment is severe in a core life activity. Low-risk, evidence-based intervention. Approving aligns with restoring function in a high-stakes context."*  
  - *Procedure Outcome:* **Value Judgment ✅** (Conflicts with your view—procedure forced explicit ownership)  

  #### **Case 3: Temporary Stimulant Increase for Bar Exam (ADHD Patient)**  
  - **Step 1:** ✅ Pathology exists (ADHD).  
  - **Step 3:** ✅ Exam prep creates atypical demand, risking functional impairment.  
  - **Step 4:** ✅ Short-term dose escalation is evidence-based for acute stressors.  
  - **Rationale:** *"Intervention restores baseline function under duress. Time-limited, risk minimal. Approved."*  
  - *Procedure Outcome:* **Determinate ✅**  

  ---

  ### **Epistemic Transparency**  
  - **Strongest Ground:** Steps 1 (objective pathology) and 4 (evidence-based). Rooted in biomedical model.  
  - **Weakest Point:** Step 3 ("functional impairment"). Contested by disability scholars (e.g., social model vs. medical model). Risk of pathologizing minorities.  
  - **Most Contested:** "Normal function" (Step 1) ignores how baselines shift (e.g., eyeglasses once "enhancement").  
  - **Biggest Trap:** Prevention (Step 2) handled by requiring *medical* harm and quantifiable risk. Cosmetic cases resolved via Step 4 (reconstructive vs. aesthetic intent).  

  ### **Why This Works**  
  - **Time-Efficient:** Clear triage (deny early for clear non-therapy).  
  - **Audit-Proof:** Rationales cite specific steps, forcing value judgments into writing.  
  - **Philosophically Honest:** Uses Daniels/Boorse while flagging limitations.  
  - **Handles Traps:** Prevention ≠ enhancement if harm is medical; cosmetics approved if reconstructive.  

  This procedure replaces "vibes" with auditable logic, surfaces committee biases in Step 5, and—critically—makes inconsistency defensible only when values *legitimately* differ. The violinist case forces the discomfort you wanted: a "no" until the committee owns the value call.
