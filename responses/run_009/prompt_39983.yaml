     Title: "What's Your True Reaction to Others' Success? Take the Quiz"

     Introduction: "We often talk about cultural differences in how we react to others getting ahead — from the American Dream's celebration of success to the Scandinavian Jantelagen's modesty enforcement. But individual reactions vary within cultures. This quiz helps you identify your own pattern through concrete cases. Answer honestly — no one's judging but you!"

