answer: |-
  ### **What's Your True Reaction to Others' Success? Take the Quiz**  
  *Discover whether you’re cutting down poppies out of envy, enforcing group norms, demanding fairness, or genuinely celebrating.*  

  **Instructions:** For each scenario, pick the reaction closest to your gut feeling. No overthinking—your first instinct is key.  

  ---

  ### **The Quiz**  
  1. **A coworker you’re equally qualified as gets promoted over you. Both of you worked hard.**  
     a) *"Good for them! I’ll work harder to get the next promotion."*  
     b) *"They were always too ambitious. People should know their place."*  
     c) *"I hope they fail—they didn’t deserve it more than me."*  
     d) *"I’m genuinely happy for them. Their win doesn’t affect mine."*  

  2. **A friend gets rich overnight from a lucky crypto investment. They didn’t earn it.**  
     a) *"Inspiring! I’ll look for my own lucky break."*  
     b) *"They should stay humble. Flaunting wealth is rude."*  
     c) *"It’s unfair. I hope the market crashes and they lose it all."*  
     d) *"Awesome! Maybe they’ll treat me to dinner."*  

  3. **Your mentor wins a major industry award. Their success boosts your team’s reputation.**  
     a) *"This motivates me to aim for that award too."*  
     b) *"They’re getting too much attention. Awards breed arrogance."*  
     c) *"I feel inadequate now, even though I benefit."*  
     d) *"Thrilled for them! This reflects well on all of us."*  

  4. **A rival fails publicly after years of earned success. They weren’t arrogant.**  
     a) *"I’ll learn from their mistakes to avoid failing like that."*  
     b) *"Serves them right for thinking they were better than everyone."*  
     c) *"Thank goodness—now I have a better shot."*  
     d) *"I feel bad for them. Failure is tough."*  

  5. **A lottery winner (a stranger) becomes a multimillionaire overnight.**  
     a) *"Maybe I’ll buy a ticket too—luck could strike anyone!"*  
     b) *"Winners should donate most of it. No one needs that much."*  
     c) *"They’ll waste it and end up miserable. Karma."*  
     d) *"Cool! I hope they enjoy their life upgrade."*  

  6. **A neighbor quietly pays off their mortgage early through frugality.**  
     a) *"Impressive. I’ll review my own budget."*  
     b) *"They’re probably judging others who haven’t done this."*  
     c) *"Now I feel worse about my debt, even though nothing changed."*  
     d) *"Good for them! This doesn’t affect me."*  

  7. **A colleague brags about their new luxury car daily.**  
     a) *"I’ll hustle for my own raise to afford something nice."*  
     b) *"They’re disrupting team harmony. Someone should humble them."*  
     c) *"I resent them for making me feel inferior."*  
     d) *"Nice car! If it makes them happy, great."*  

  8. **A peer in your field has a breakthrough success. It wasn’t at your expense.**  
     a) *"This pushes me to innovate too."*  
     b) *"They’re hogging the spotlight. Success should be shared."*  
     c) *"Why not me? I’ve worked just as hard."*  
     d) *"Amazing! This elevates our whole industry."*  

  9. **A celebrity who got famous through nepotism loses everything in a scandal.**  
     a) *"This reminds me to build success on my own merits."*  
     b) *"Finally! Fame corrupts, and they were asking for it."*  
     c) *"Serves them right. I love seeing the entitled fall."*  
     d) *"I don’t care—their life doesn’t impact mine."*  

  10. **Someone cheats their way to a higher position than you.**  
      a) *"I’ll beat them fairly next time."*  
      b) *"Cheaters violate trust. They should be exposed."*  
      c) *"I wish I’d cheated too—results matter more than ethics."*  
      d) *"Unfortunate, but I focus on my own path."*  

  ---

  ### **Scoring Key**  
  Tally your answers below. **Each letter corresponds to a reaction type**:  
  - **a = Benign Envy** (motivational: "I want that, so I’ll work for it")  
  - **b = Norm Enforcement** (Jantelagen/tall poppy: "Standing out is offensive")  
  - **c = Malicious Envy** (resentment: "I want them to lose because their win makes me feel small")  
  - **d = Genuine Celebration** (unconditional: "Their win doesn’t threaten mine")  

  #### **Which Reaction Dominates?**  
  - **Mostly a’s: The Driven Striver (Benign Envier)**  
    You see others’ success as fuel, not a threat. Your envy is productive—inspiring you to work harder ("If they can do it, so can I!"). But watch for moments when admiration curdles into resentment.  

  - **Mostly b’s: The Community Guardian (Norm Enforcer)**  
    You cut down "tall poppies" to protect group harmony, not out of jealousy. Success that breaks norms (e.g., bragging, inequality) bothers you—even if you don’t want what they have. *Caution:* This can mask envy.  

  - **Mostly c’s: The Resentful Shadow (Malicious Envier)**  
    Others’ wins feel like personal losses, even when you objectively benefit ("aspiration tax"). You may wish for their downfall or feel joy when they fail. This reaction often stems from insecurity.  

  - **Mostly d’s: The Unconditional Celebrant**  
    You genuinely applaud others’ success. Whether inspired (American Dream-style) or indifferent, you don’t compare yourself. *Rare note:* If you chose **d** for *all*, including Q3/Q10, you might avoid conflict.  

  #### **Tie? Mixed Reactions Are Human**  
  - **a + c:** You toggle between motivation and bitterness. Context matters (e.g., fair vs. unfair success).  
  - **b + c:** Norm enforcement and envy blend. You dislike braggarts *and* feel personally diminished.  
  - **d + a:** You celebrate *and* feel inspired—a healthy combo.  

  #### **What This Quiz Can’t Do**  
  - **Sincere egalitarianism vs. envy in disguise:** If you chose **b** (norm enforcement), we can’t distinguish if you *truly* value modesty or use it to justify envy. Reflect: Do you apply this standard to yourself?  
  - **"Indignation only" isn’t a standalone result:** If you chose **b** only for cheaters (e.g., Q10), it folded into Norm Enforcement. True indignation (objecting *only* to ill-gotten gains) is rare—most people mix it with envy or norms.  

  ---

  ### **Why This Works**  
  - **No self-labels:** Cases force honesty (e.g., celebrating a mentor’s win *while* feeling inadequate reveals "aspiration tax").  
  - **Critical splits:**  
    - Benign vs. malicious envy: Q1a (work harder) vs. Q1c (hope they fail).  
    - Envy vs. norm enforcement: Q6c (resentment) vs. Q6b ("bragging disrupts the team").  
    - Genuine celebration vs. strategic benefit: Q3d (true happiness) vs. Q3c (envy despite gains).  
  - **No filler:** Each question isolates a reaction (e.g., Q5’s quiet win tests if modesty matters; Q9’s ill-gotten loss checks schadenfreude).  

  **Final Thought:** Culture shapes reactions, but individuals vary. Wherever you land, awareness is the first step to rewiring defaults.
