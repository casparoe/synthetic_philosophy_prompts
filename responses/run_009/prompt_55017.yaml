answer: |-
  ### Section 1: Position Stated Plainly  
  I argue that iterated elimination of strategies dominated by *mixed* strategies rests on stronger assumptions than common knowledge of rationality (CKR) alone, unlike its pure-strategy counterpart. While pure-strategy dominance deletion follows directly from individual rationality and mutual belief in it, mixed-strategy dominance elimination implicitly requires players to model opponents as randomizing over their *remaining* strategies at each step. This injects equilibrium-like mutual reasoning about *how* strategies will be played, not just *which* strategies survive. The asymmetry you observe is real: pure deletion is bookkeeping; mixed deletion is predictive.

  ---

  ### Section 2: The Argument  

  1.  **Core Premise (CKR)**: Common knowledge of rationality means:  
      -   Players are rational (maximize expected utility given beliefs).  
      -   All players know this.  
      -   All players know that all players know this (and so on, ad infinitum).  

  2.  **Pure Dominance is CKR-Compliant**:  
      If pure strategy A is strictly dominated by pure strategy B (i.e., B yields > payoff vs. every *pure* opponent strategy), then:  
      -   A rational player will never play A (Step 1 rationality).  
      -   Rational opponents know this (Step 2 mutual knowledge).  
      -   Deleting A is merely acknowledging this irrevocable choice – it reduces the game *description* without altering strategic substance. Beliefs about *how* opponents play are irrelevant; domination holds against *any* pure play.  

  3.  **Mixed Dominance Requires Stronger Beliefs**:  
      A strategy A is mixed-dominated if there exists a mixture M over *other* strategies such that M yields > payoff vs. *every possible* opponent strategy profile. Crucially, "every possible" includes opponents playing *mixed strategies* over their *full* unreduced strategy sets.  

  4.  **The Gap: Beliefs About Randomization**:  
      To justify deleting A via mixed dominance *at iteration N*, we must assume:  
      -   Players believe opponents might randomize over *all strategies not yet deleted*.  
      -   Players use this belief to evaluate mixtures M against *every conceivable mixed play* by opponents within the current game.  
      This belief about randomization is *not* entailed by CKR alone. CKR ensures players *can* randomize rationally but does *not* force them to *assume* opponents *will* randomize. A purely rational player could believe opponents play *some* pure strategy, even if they don't know which one.  

  5.  **Illustrative Game (Player Row vs. Player Column):**  
      ```
          | L     | C     | R
      --------------------------
      U   | 4, X | 0, X | 1, X
      M   | 0, X | 4, X | 1, X
      D   | 1, X | 1, X | 5, X
      ```
      *Column payoffs (X) are irrelevant for Row's dominance; assume they don't induce dominance for Column.*  

      -   **Pure Domination (None)**: No pure Row strategy dominates another. U beats M if Col plays L, M beats U if Col plays C, D beats both only if Col plays R. Nothing prunes initially.  
      -   **Mixed Domination (Aggressive)**: Consider mixture Mₓ = (0.5 U, 0.5 M, 0 D). Against Col L: 0.5*4 + 0.5*0 = 2 > 1 (D). Against Col C: 0.5*0 + 0.5*4 = 2 > 1 (D). Against Col R: 0.5*1 + 0.5*1 = 1 = 1 (D) → **Not Strictly Dominated Yet!**  
          Now consider mixture Mᵧ = (0.499 U, 0.499 M, 0.002 D). Against Col L: ~0.499*4 + 0.499*0 + 0.002*1 ≈ 1.998 > 1. Against Col C: ~0.499*0 + 0.499*4 + 0.002*1 ≈ 1.998 > 1. Against Col R: ~0.499*1 + 0.499*1 + 0.002*5 ≈ 1.008 > 1. **D is strictly dominated by Mᵧ**. Delete D.  
          Now, in the reduced game (U, M vs. L, C, R), U is strictly dominated by M (M yields 4>0 if L, 0<4 if C? Wait! After deleting D, Column may reassess. Assume Column's payoffs make R never dominant so R remains. Now for Row: M yields 4>0 vs L, 4>0 vs C? No, vs C: M gives 4, U gives 0. Vs L: M gives 0, U gives 4. Neither pure dominates. But mixture (0.5U, 0.5M) yields 2 vs L, 2 vs C, 0.5 vs R. Compare to U: 4, 0, 1 → 2<4, 2>0, 0.5<1? Not domination. Mixture (0.6U, 0.4M) yields 2.4 vs L, 1.6 vs C, 0.6 vs R. U: 4,0,1 → 2.4<4, 1.6>0, 0.6<1 → Still not. **M itself dominates U?** Vs L: M=0 < U=4? No. **Key Insight**: After deleting D, neither U nor M is dominated by the other pure *or* by any mixture of the remaining strategies (U and M). The initial aggressive pruning (deleting D) was possible only by considering mixtures against Column's *full* strategy set (L, C, R). In the reduced game post-D deletion, further pure/mixed deletion may not occur depending on Column's payoffs. The point is the *first step* required Row to consider mixtures against Column's potential randomization over L/C/R to eliminate D, an assumption beyond CKR.  

  6.  **Why This Exceeds CKR**:  
      Justifying the deletion of D requires Row to believe Column *might* play *any* mixture over {L, C, R}, including those where C (against which D is weak) has significant weight. CKR doesn't mandate this belief. Row could rationally believe Column plays *only* L or R (ignoring C), making D viable (D=1 or 5 > Mᵧ≈1.008 or 1). Mixed dominance elimination forces Row to consider *all possible* opponent randomizations, including worst-case scenarios for D, which injects a level of pessimism or comprehensive belief modeling not required by basic rationality. It assumes players actively model opponents' *randomization capabilities* within the current game, turning deletion into a mutual prediction exercise akin to equilibrium screening.

  ---

  ### Section 3: Strongest Objection and Reply  

  **Objection:** Expected utility maximization (EUM) is fundamental to rationality. If a strategy A yields less utility than a mixture M *against every possible profile of opponent strategies*, then EUM *compels* a rational player to prefer M over A. Since CKR implies all players use EUM, recognizing that M dominates A is just applying EUM + CKR. The ability to randomize is inherent in EUM; players are indifferent to how probabilities are realized (coin flips vs. uncertainty). Thus, iterated mixed deletion *is* pure CKR in action, requiring no extra assumptions.  

  **Reply:** While EUM *allows* randomization and judges mixtures by expected payoff, it does *not* compel a player to *assume* opponents will randomize over their *entire remaining set*. The objection conflates a player's *own* randomization (which EUM permits) with *beliefs* about opponents' randomization (which EUM does not specify). CKR ensures players know opponents *can* randomize rationally, but it does *not* dictate *how* players form beliefs about *which* strategies opponents might use or randomize over. A rational player could hold a belief that opponents play specific pure strategies (even if uncertain which one), making a mixed-dominated strategy like D in the example potentially rational. Mixed deletion *imposes* the belief that opponents *might* play *any* mixture, demanding players guard against this entire spectrum. This comprehensive belief formation – treating the opponent's strategy space as a convex hull to be fully explored – is an *additional* principle of belief completeness or caution, not a necessary consequence of EUM and mutual knowledge thereof. CKR ensures rationality and awareness of rationality; it doesn't mandate worst-case or all-encompassing belief generation about opponent randomization.

  ---

  ### Section 4: Bottom Line  

  Present your mixed-elimination pass as a *computational heuristic with stronger epistemic assumptions*, not purely as "common knowledge of rationality" pruning. It's valuable (e.g., finding Nash equilibria faster, simplifying complex games, order invariance is robust) but relies on players modeling opponents' full randomization potential at each step, going beyond basic rationality. Disclose this asymmetry: pure deletion is uncontroversial CKR; mixed deletion assumes players implicitly agree to mutual modeling of randomization strategies within the surviving game, edging towards equilibrium reasoning. Users should understand it as a powerful tool, not just bookkeeping.
