  My AP physics teacher has a stock line: whenever somebody asks something like "does the electron in the double-slit experiment really go through both slits," she just says "shut up and calculate." I get the vibe but it seems like that one sentence could be making a bunch of different exact claims — like that the question is meaningless, or that it has an answer but physics just can't reach it, or that its a fine question but not worth class time. Can you lay out the different precise things "shut up and calculate" might actually be claiming, say for each one whether it's trivial, contentious, or just plain false, and which reading would actually justify brushing off my question? And which one do you figure my teacher most likely meant? Also please answer in American English.
