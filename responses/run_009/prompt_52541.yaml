prompt: |-
  I run trust & safety policy at a mid-sized discussion platform (about 200 moderators, all decisions appealable). The way new rules actually get made here is ugly: some incident happens, the mods dump forty or fifty example posts on me — some everyone agrees are violations, some everyone agrees are fine, and a bunch of maybes — and I have to turn that into a written rule that a moderator with two weeks of training can apply to posts nobody's seen yet, in about thirty seconds per post. This comes up roughly monthly and it's the part of the job I have zero training for.

  I keep feeling like I'm doing the same thing a Bongard problem asks you to do: here's a small handful of things, figure out what separates them — except my boxes aren't hand-constructed to have one clean answer, and the first hypothesis that fits the examples is usally something shallow (they all contain a certain word) rather than the actual concept. Then a week later the rule overfits or underfits and mods come back to me with edge cases.

  What I want is a procedure. Given a pile of labeled examples: what to do first, second, third. When to commit to a feature-based rule, when to accept that the category is family-resemblance-shaped and the honest rule is just "more like these, less like those," how to actually use the maybes instead of ignoring them, how to stress-test a candidate rule before shipping it, and at what point to conclude that the examples don't pick out one concept at all and push back on whoever's asking for the rule. Ground it in whatever philosophy and cognitive science actually know about inducing concepts from few examples — I don't want citations, I want the ideas, and I want you to be honest about which steps are judgment calls wearing a procedure costume.

  Then run it on two cases from my last year: (1) we banned "astroturfing" based on about thirty example accounts, and it turned out half the examples were about coordinated behavior while the other half were really about being deceptive about who you are; and (2) a "cruelty" rule where the mods' violation examples were suspiciously consistent — every single one contained slurs, even though nobody thinks slurs are necessary for cruelty. I have a feeling the procedure should flag that second one as trouble before we ship anything, and I want to see whether it actually does.

  Finally, tell me what the procedure can't do — where inducing a concept from a small, biased sample is just going to fail no matter how careful I am, and the honest move is to declare the rule provisional and let the appeals process catch the misses.
reasoning: |-
  Okay, let me unpack this user's problem. They're a trust & safety policy lead struggling with turning messy incident reports into clear rules. The core pain points are: ad-hoc process, overfitting rules, missing deeper concepts, and edge cases blowing up later. 

  Hmm... they're describing classic machine learning problems (overfitting, feature selection) but in a human judgment context. Interesting crossover. The Bongard problem analogy is spot-on - real-world examples never come with clean boundaries. 

  First, I need to structure a systematic procedure that acknowledges the inherent messiness. Should break it into phases: problem framing, pattern hunting, rule crafting, stress-testing. Key principles from concept learning research: 
  - Humans default to surface features (like those slurs in cruelty examples) unless forced to abstract
  - "Maybes" are actually goldmines for boundary-setting
  - Family resemblance concepts (Wittgenstein) need different handling than categorical rules

  For the astroturfing case... ah! The user already spotted the coordination vs deception split post-mortem. A good procedure would've flagged that during feature clustering - those two clusters were probably visible in the "maybe" pile. 

  The cruelty example is textbook surface feature bias. Mods handed them violation cases all with slurs, but that's just correlation. Procedure should detect when a feature is overrepresented and force negative testing ("show me cruelty without slurs").

  Biggest limitations they should know:
  - Small samples can't capture long-tail edge cases 
  - You can't extract intent from behavior alone (key for deception)
  - Some concepts are inherently subjective (cruelty) and will need living documents

  Appeals process as error correction mechanism is smart. Should emphasize that in the "what can't be fixed" section. Also worth noting that sometimes the honest answer is "this needs 3 sub-rules, not one".

  ...time to structure this into phased steps with their examples as test cases. The "judgment calls in procedure clothing" note is crucial - will flag which steps stay subjective even with best methods.
answer: |-
  Here’s a battle-tested procedure for turning chaotic examples into workable rules, grounded in cognitive science and concept formation theory. It explicitly treats rule-writing as **iterative hypothesis testing**, not a one-shot solution. The core challenge: avoiding shallow features while accepting that some concepts *can’t* be crisply defined.

  ### The Procedure: Phased Rule Induction
  **Phase 0: Frame the Problem**  
  *   **Input:** Raw examples (violations/non-violations/"maybes"), context about the incident, stakeholder goals.  
  *   **Action:**  
      1.  **Interrogate the "Why Now?"**: What harm is this rule meant to prevent? (e.g., "Astroturfing undermines trust in discourse"; "Cruelty causes psychological harm").  
      2.  **Enforce Negative Examples:** Demand clear non-violations ("*Show me posts/users that *feel* sketchy but aren't violations*"). If none exist, **STOP** - you lack boundary data. Push back.  
      3.  **Triage Maybes:** Force mods to *tentatively* categorize each "maybe" as "lean violation" or "lean okay" *before* you start pattern-seeking. This reveals disagreement and fuzziness.  

  **Phase 1: Hunt for Deep Features (Not Surface Triggers)**  
  *   **Goal:** Identify *underlying properties* shared by violations but absent in non-violations. Avoid words/phrases.  
  *   **Actions:**  
      1.  **Cluster Violations:** Group examples based on *why* they seem bad, not how they look. (e.g., Astroturfing: Group A - "Multiple accounts pushing same talking point", Group B - "Single account pretending to be a regular user").  
      2.  **Contrast with Non-Violations:** For each cluster, ask: "*What does THIS cluster have that the 'okay' examples lack?*" (e.g., "Coordinated timing?" vs. "Fake persona?").  
      3.  **Stress-Test Maybes:** Apply your emerging clusters to the "maybes." Do they fit cleanly? Or expose new clusters/boundary issues?  
      4.  **Seek the "Why" Behind Features:** For each candidate feature (e.g., "coordination"), ask: "*Why does this make it harmful?*" Link it to Phase 0's harm goal.  

  **Phase 2: Draft the Rule & Define Decision Points**  
  *   **Goal:** Translate deep features into a testable procedure for mods.  
  *   **Actions:**  
      1.  **Structure the Rule:**  
          *   **IF** [Core Harm Condition - e.g., "Intent to deceive about affiliation or artificially amplify a viewpoint"]  
          *   **AND** [Key Observable Behavior(s) - e.g., "Evidence of coordination across accounts" *OR* "Concealment of paid affiliation"]  
          *   **THEN** Violation.  
      2.  **Prioritize Features:** Rank criteria by reliability/ease of observation. Lead with the most decisive.  
      3.  **Define Thresholds:** How much "coordination" is needed? What constitutes "concealment"? Be explicit. If you can't define it, note it for appeals.  
      4.  **Write the Negative:** Explicitly state what *doesn’t* violate (e.g., "*Solo users with strong opinions are not astroturfing, even if unpopular*").  

  **Phase 3: Stress-Test Relentlessly**  
  *   **Goal:** Find overfitting/underfitting *before* mods do.  
  *   **Actions:**  
      1.  **Generate Edge Cases:** Use the clusters/maybes: "What if [Feature A] is present but [Harm Condition] is weak?" (e.g., "What if two friends post similar opinions organically?").  
      2.  **The Slur Test (Cruelty Flag):** *Systematically remove the most obvious surface feature* (e.g., delete all slurs from cruelty examples). Do the violations still clearly violate based on the *remaining* features? If not, your rule is likely broken.  
      3.  **The "Innocent Actor" Test:** Apply the rule to a clearly benign post/user. Does it *wrongly* flag it? (e.g., "Does our astroturfing rule catch someone live-tweeting a conference with hashtags?").  
      4.  **Moderator Simulation:** Walk through applying the rule to 5 examples (including maybes/edges) *as a mod would in 30 seconds*. Where do they stall?  

  **Phase 4: Launch & Learn (Embrace Provisionality)**  
  *   **Actions:**  
      1.  **Flag Uncertainty:** If clusters were messy or edges unresolved, state: "*This rule focuses on [Primary Harm Cluster]. Edge cases will evolve via appeals.*"  
      2.  **Appeals as Feedback Loop:** Mandate that contested decisions using the new rule are flagged for your review. Track them.  
      3.  **Schedule Review:** Set a date (e.g., 60-90 days) to re-assess based on appeal data and mod feedback.  

  ### Key Judgment Calls Disguised as Steps
  1.  **What's the "Core Harm"?** (Phase 0/1): Choosing which harm to prioritize isn't science. It’s policy.  
  2.  **Cluster Boundaries** (Phase 1): Deciding if two violation types are distinct enough for sub-rules is subjective.  
  3.  **Threshold Setting** (Phase 2): "How much coordination is 'enough'?" is inherently arbitrary.  
  4.  **Accepting Fuzziness** (Phase 4): Deciding when a concept *must* be "more like these" (family resemblance) vs. demanding crisp rules is strategic.  

  ---

  ### Applying the Procedure to Your Cases
  **Case 1: Astroturfing (Coordination vs. Deception)**  
  *   **Phase 0:** Harm = "Undermining trust via artificial amplification or hidden agendas." Non-violations = Passionate solo advocates. Maybes likely included ambiguous accounts.  
  *   **Phase 1 (Clustering):**  
      *   Cluster A: Multiple accounts, similar phrasing/timing, amplifying same message (Harm: **Coordinated Inauthentic Behavior**).  
      *   Cluster B: Single account, fake persona, undisclosed paid promotion (Harm: **Deceptive Identity/Affiliation**).  
      *   **Crucial Maybe Insight:** Maybes probably fell into one cluster but not the other, or lacked clear evidence.  
  *   **Phase 2 (Draft):**  
      *   **IF** (Intent to deceive about affiliation/identity OR Intent to artificially amplify a viewpoint via coordination)  
      *   **AND** (Evidence of: Undisclosed paid affiliation/fake identity *OR* Coordination across accounts)  
      *   **THEN** Violation.  
      *   **NOT:** Solo users, organic group advocacy (with disclosure).  
  *   **Phase 3 (Stress Test):**  
      *   **Edge:** "Genuine fan club coordinating praise?" (Needs intent check). "Solo paid shill?" (Catches via deception).  
      *   **Passes Slur Test?** N/A (Not surface-feature reliant).  
  *   **Outcome:** Procedure **flags the split** during clustering. The draft rule *explicitly* separates the two harm types with "OR," preventing over/underfitting. Appeals handle ambiguous intent evidence.

  **Case 2: Cruelty (The Slur Trap)**  
  *   **Phase 0:** Harm = "Inflicting severe emotional distress or dehumanization." Non-violations = Harsh criticism, dark humor (context matters). *Where were the non-slur cruelty examples?*  
  *   **Phase 1 (Clustering):**  
      *   **Surface Cluster:** All violations contain slurs (obvious, but shallow).  
      *   **Deep Feature Hunt Fails:** Non-violation examples likely *also* contained harsh language (just not slurs). What distinguishes *cruel* harshness? Mods couldn't articulate it beyond the slur.  
      *   **Maybes as Canaries:** Maybes probably *lacked* slurs but felt cruel. Mod disagreement here should **scream trouble**.  
  *   **Phase 2 (Draft):** Attempting a deep feature rule fails ("intent to degrade"? - unobservable in 30s). Default risk: "Uses slur" = cruelty (overfit!).  
  *   **Phase 3 (Stress Test - SLUR TEST APPLIED):**  
      *   Remove slurs from violation examples. Do the *remaining* features (e.g., "calls for violence," "targets immutable characteristic," "graphic dehumanization") still *clearly* differentiate them from non-violations? **Unlikely.**  
      *   "Innocent Actor" Test: Does harsh political criticism get caught? Probably.  
  *   **Outcome:** Procedure **flags trouble EARLY**:  
      1.  Phase 0: Lack of clear non-slur cruelty examples *or* non-violations with harsh language.  
      2.  Phase 1: Inability to cluster beyond surface slurs; high disagreement on maybes.  
      3.  Phase 3: Slur Test fails catastrophically.  
      *   **Honest Conclusion:** "Cruelty" is highly context-dependent and resistant to fast, consistent application. Push back: *"Your examples only define 'slur usage.' To define cruelty, I need clear examples WITHOUT slurs that you all agree cross the line, and examples WITH harshness that stays within bounds."* Failing that, defer to a broader "Hateful Conduct" rule or accept high appeals volume.

  ---

  ### What the Procedure CAN'T Fix (The Hard Limits)
  1.  **Inherently Subjective Concepts:** If the core harm (e.g., "cruelty," "trolling," "bad faith") relies heavily on unobservable intent or highly contextual social nuance, a rule *will* misfire. Appeals are essential.  
  2.  **Missing Boundary Data:** If stakeholders can't provide clear non-violations or can't agree on maybes, you *cannot* define a robust boundary. Push back is mandatory.  
  3.  **Rare but Severe Edge Cases:** A small sample won't capture the long tail of weirdness. Your rule will miss these. Appeals catch them.  
  4.  **Evolving Tactics:** Bad actors adapt. A rule based on past behavior won't catch novel violations. Continuous iteration is key.  
  5.  **Moderator Subjectivity:** Two mods applying the same rule to a fuzzy case may still disagree. Clearer rules reduce this, but won't eliminate it.  

  **The Honest Move:** When facing inherent fuzziness (like cruelty), **declare the rule provisional upfront**: *"This is our initial focus based on demonstrable harms [list slurs, severe threats]. We'll refine based on appeals and new data."* Frame appeals not as failures, but as **critical training data** for the next iteration. Your procedure doesn't magically create perfect rules; it forces the ambiguity into the open and structures the learning loop. The goal isn't perfection on day one, it's **faster, more honest convergence** on a stable rule.
