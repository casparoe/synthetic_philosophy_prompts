answer: |-
  ## The Pleasure Dispute: A Dialogue Between Hedonists

  **Setting:** A sun-drenched terrace cafe overlooking a bustling plaza. Mira sips an iced coffee, Ezra stirs a chai latte.

  **Mira:** (Setting down her glass) This plaza... the warmth, the chatter, the coffee hitting just right. Pure, unadulterated pleasure. It reaffirms the core, Ezra: pleasure *feels* a certain way. It’s that distinctive, positive glow woven into the fabric of experience itself. That’s the irreducible good.

  **Ezra:** I agree entirely that pleasure *is* the good, Mira. Where we diverge is what constitutes it. This coffee, this sun – I’m *enjoying* it immensely. I’m *pleased* to be here. *That’s* the pleasure. It’s not about finding some special phenomenal ‘glow’ paint, but about the attitude I’m taking towards my experience. The *taking satisfaction in*.

  **Mira:** But Ezra, that ‘taking satisfaction’ *has* a feel! It’s not some ghostly intention floating above experience. When you enjoy the sun, there’s a warmth *and* a quality of... well, *enjoyment* suffusing it. The attitude manifests phenomenally. Without that felt quality, what distinguishes your ‘enjoyment’ from mere acknowledgment?

  **Ezra:** Ah, but let’s test that with something thornier. Take your beloved chili chocolate. You relish it, yes?

  **Mira:** Absolutely! It’s divine.

  **Ezra:** And part of that experience, you’ll admit, is a distinct burning sensation, a mild irritation on the tongue? Something that, if isolated, you’d call unpleasant, perhaps even akin to a minor pain?

  **Mira:** (Nodding slowly) Yes, the chili heat is definitely there. It’s an essential part of the complexity.

  **Ezra:** Precisely! Now, on your phenomenal view, pleasures share a common positive feel. But here’s an element – this burn, this irritation – that phenomenally resembles something negative, something painful. If pleasure is defined by a specific *positive* feel, shouldn’t this component *detract* from the overall pleasure, be an unpleasant intrusion? Yet, for you (and me!), it’s integral to the pleasure. It *composes* it. How does your view account for that? My attitudinal view handles it effortlessly: you are *enjoying* the entire complex sensation, burn included. The pleasure *is* that enjoyment, regardless of whether every micro-component feels ‘pleasurable’ in isolation.

  **Mira:** (Leans forward, thinking) A fair challenge. I concede it’s tricky. But I don’t think we isolate sensations like that. The burn isn’t experienced neutrally alongside chocolate; it’s *integrated*. The irritation becomes a kind of piquancy, a lively contrast that intensifies the overall positive *gestalt*. The pleasure isn’t just the sweet or just the burn; it’s the unique, unified *feel* of their combination – a feel that *is* positive and distinctive. The phenomenal quality is emergent in the whole complex, not atomistic. The burn contributes its *texture* to that overall positive feel.

  **Ezra:** Emergent quality... hmm. So the irritation *loses* its intrinsic negative feel when embedded in the chocolate context and contributes to a new, positive whole? That sounds suspiciously like the feel isn't primary anymore; it's the *relation* or the *attitude* towards the complex that’s doing the work. But let’s press on to another case. Consider the absorbed rock climber. She scales a difficult face, utterly focused. Afterwards, she says sincerely, "I really enjoyed that climb." Yet, during the climb itself, she reports feeling *nothing* – no buzz, no glow, no distinctive pleasure-quality. Just complete absorption in the moves, the rock, the balance. Pure flow. Phenomenally, she felt neutral, perhaps even blank. According to your view, where was the pleasure *during* the climb? If pleasure requires a distinctive feel, and she felt nothing distinctive, how can she have been experiencing pleasure?

  **Mira:** Another strong case for your side, Ezra. But I think it reveals a nuance of my view, not a refutation. She *was* experiencing pleasure, it was just unfelt *as such* during the intense absorption. The pleasure was a background hum, woven into the activity itself, unattended to because her focus was entirely on the task. It’s like the hum of a refrigerator you only notice when it stops. The *capacity* for the feeling was there, structuring her engagement, but her attention was monopolized. Later, looking back, she recognizes the *quality* of the experience *was* enjoyable, even if she wasn’t consciously monitoring the pleasure-quale at the time.

  **Ezra:** But Mira, isn't that dangerously close to my view? You’re invoking an ‘unfelt feeling’ – which sounds paradoxical – and then relying on the *attitude* of retrospective endorsement to identify it. If the pleasure-quale was truly present but unattended, what distinguishes it from any other unattended background state? And why should we posit this ghostly, unattended quale rather than simply saying: during the climb, her attitude *was* one of intense engagement and satisfaction *with* the activity, which *constituted* the pleasure, even without a specific feel? And afterwards, she affirms that attitude. Your ‘unfelt feeling’ seems like an epiphenomenal posit, a quale hiding behind the curtain, while the attitude is doing all the explanatory work on the surface.

  **Mira:** (Sighs) You make it sound like a dodge. But I think the *capacity* for the feeling, the way the absorption *feels* qualitatively different from anxious or bored absorption, points to its presence. It’s not epiphenomenal; it *is* the character of the absorption. It feels *good* to be absorbed, even if 'goodness' isn't the focus. The feeling *is* the absorption’s positive texture. But... I’ll concede this: the absorption case makes it harder to point directly to the phenomenal quality as a discrete element. It shows the *boundaries* of phenomenal awareness. Still, I maintain the quality is inherent in the experience.

  **Ezra:** Boundaries indeed. This makes me think we should construct a case together to probe the fundamentals. Imagine a creature – let’s call it an Inverted Hedon. Neurologically identical to a human. It pursues ice cream, sunny days, and rock climbing with the same vigor we do. It smiles, sighs contentedly, reports "I'm really enjoying this!" when eating chocolate. It avoids pain, seeks comfort. Its desires and functional behaviors regarding ‘pleasure’ and ‘pain’ are indistinguishable from ours. However... introspectively, its experiences are inverted relative to ours. When it eats chili chocolate and says "This is wonderful!", the *feel* it has is phenomenally identical to what *we* would call the feeling of mild nausea. Conversely, the feeling it has when it stubs its toe (and says "Ow, that hurts!") is phenomenally identical to what *we* would call the feeling of a warm, relaxing bath. What do we say about this creature?

  **Mira:** (Frowning in concentration) That’s... bizarre. If it’s neurologically identical and functionally identical, including its sincere reports of enjoyment and suffering...

  **Ezra:** Exactly. On *my* view, the pleasure and pain are fixed by the attitudes – the desires, the motivations, the evaluations expressed in behavior and report. So, when the Inverted Hedon sincerely says "I'm enjoying this chocolate," it *is* experiencing pleasure, regardless of the introspective feel accompanying it, which happens to be nausea-like *to us*. The pleasure *is* the positive attitude. The feel is irrelevant to its status *as* pleasure. It just happens to be paired oddly.

  **Mira:** But that seems deeply counterintuitive! How can an experience that *feels* like nausea *be* pleasure? You’re severing pleasure entirely from how it feels! I’d argue the case is underdescribed or question-begging. If it *feels* phenomenally like nausea to *it* – I mean, truly, intrinsically nauseating – then surely it *is* unpleasant for it? Its report of "enjoyment" would be either false or meaningless. The concept of pleasure is tied to a certain kind of feeling. To say it feels like nausea but *is* pleasure is to stretch the word ‘pleasure’ beyond recognition, divorcing it from its experiential core. Perhaps neurological identity *entails* phenomenal identity? Or perhaps the inversion is impossible *because* the attitude and the feel are necessarily linked? The case seems to assume your conclusion by letting the attitude define pleasure independently.

  **Ezra:** But Mira, how do *you* know what it feels like *for it*? All you have are its identical neurological states, its identical behaviors, its identical sincere reports. You only *infer* its nausea-feel from *your* phenomenal associations. But if pleasure *is* the phenomenal feel, and its phenomenal feel is inverted, then *by your own definition*, it *isn’t* experiencing pleasure when it says it is. It’s fundamentally mistaken about its own mind. But that seems absurd! It violates the privileged access we usually grant to first-person reports of simple states like pleasure and pain. My view avoids that: its report is authoritative because the report *expresses* the attitude that *constitutes* the pleasure. The feel is a separate matter.

  **Mira:** And your view makes pleasure potentially *anything* – even a feeling we’d find utterly repulsive – as long as the creature has the ‘right’ attitude towards it. That drains pleasure of its intrinsic character. It feels like you’re reducing pleasure to mere motivational direction.

  **Ezra:** While you risk making pleasure a mysterious, potentially inaccessible quale, especially in cases like absorption or inversion.

  *(A pause as they consider the impasse.)*

  **Mira:** You know, Ezra, this whole debate sometimes makes me wonder if William Alston was onto something. What if ‘pleasure’ is just a disjunctive concept? Maybe there’s no single essence – no common feel *or* attitude. Maybe it’s a cluster: sometimes it’s a distinctive feel, sometimes it’s an attitude of satisfaction, sometimes it’s the absence of pain, sometimes it’s flow... a family resemblance concept.

  **Ezra:** (Shudders slightly) Oh, I find that deeply unsettling. If pleasure is disjunctive, then the hedonist project crumbles! Hedonism relies on pleasure being a *unified* good, the single currency of value we can maximize or compare. If ‘pleasure’ names a grab-bag of unrelated states, how can we possibly weigh them against each other or against pain? It becomes meaningless to say "maximize pleasure." I need a unified essence to make sense of pleasure as *the* good.

  **Mira:** (Nods vigorously) Exactly! And for me, the disjunctive view abandons the very core of what makes pleasure *pleasurable* – its experiential character. If that character isn’t essential, then calling something ‘pleasure’ loses its connection to why we seek it. We seek it *because* of how it feels. Disjunctivism severs that link. It makes pleasure an empty label. I *need* the phenomenal unity to explain why pleasure is desirable intrinsically.

  **Ezra:** So, we both reject Alston’s worry, but for different, fundamental reasons tied to our core commitments. I need the conceptual unity of attitude for evaluative coherence; you need the phenomenal unity for experiential desirability.

  **Mira:** Precisely. So, where does that leave us? Still firmly agreeing pleasure is the good...

  **Ezra:** ...But fundamentally disagreeing on what it *is*. I suppose that’s the bedrock. But let’s be clear: what evidence *could* shift me? If you could show me a clear case of someone sincerely and accurately reporting an attitude of enjoyment or satisfaction – “I am pleased about X right now” – while simultaneously, and non-culpably, reporting that their experience lacks *any* positive or desirable qualitative character whatsoever, especially in a simple, non-absorbed state. That would challenge the necessity of the attitude, or at least its sufficiency for feeling.

  **Mira:** A tough order, but conceivable. For me, Ezra, what would shake my view is evidence showing that the phenomenal character we identify as pleasure *systematically fails* to correlate with motivation, desire, or satisfaction *in neurologically typical individuals*, while attitudes *do* track them independently. If we found people consistently and sincerely pursuing states that *feel* like agony because they hold a positive attitude towards them *as pleasures*, and vice-versa, that would force a major reconsideration. The Inverted Hedon points that way, but I still find it deeply problematic, perhaps incoherent.

  **Ezra:** It seems we’re each anchored to our primitives: you to the feel, me to the attitude. The chili chocolate irritates your feel, the absorption absorbs your attention, and the Inverted Hedon inverts our intuitions. But the search continues. Another coffee?

  **Mira:** (Smiling) Only if we can both agree it’s pleasurable. And right now, I’m definitely *enjoying* the prospect. Another latte, please. The *feel* is going to be exquisite.

  **Ezra:** (Chuckling) And my *attitude* towards obtaining it is decidedly positive. To the counter!
