  ### Philosophy of Medicine: What Do You Think a Disease Is?  
  *A brief quiz to uncover your intuitions about health, disease, and medicine—no prior philosophy knowledge needed. Answer based on your gut reactions to the cases.*  

  **Instructions:** For each scenario, circle the verdict that best matches your view.  

  1. **Infertility**: A healthy couple cannot have children due to a biological cause, but they don’t want children and are not bothered by it.  
     - A) They have a disease; their bodies aren’t functioning as human bodies typically do.  
     - B) They don’t have a disease; it doesn’t harm them or affect their lives negatively.  
     - C) "Disease" isn’t a useful label here; it’s just a biological fact about them.  

  2. **Sickle Cell Trait**: In a region with malaria, a person carries one sickle cell gene (not the full disease). This makes them malaria-resistant and causes no health issues.  
     - A) They have a disease; their red blood cells function atypically for humans.  
     - B) They don’t have a disease; it’s beneficial in their environment.  
     - C) Calling this "disease" is arbitrary; it depends on context.  

  3. **Aging**: An 80-year-old has weakened bones and slower healing typical for their age. They feel great, exercise daily, and enjoy life.  
     - A) They have diseases; their body functions below the typical standard for humans.  
     - B) They don’t have diseases; these changes are normal for their age and cause no harm.  
     - C) Aging isn’t a "disease"—it’s a natural process.  

  4. **Deafness**: A person born deaf uses sign language, is part of Deaf culture, and sees their deafness as a valued identity, not a problem.  
     - A) They have a disease; their ears don’t function as human ears typically do.  
     - B) They don’t have a disease; it isn’t harmful to them and is part of who they are.  
     - C) "Disease" mislabels this; it’s a difference, not a defect.  

  5. **Prolonged Grief**: A year after losing their spouse, someone cries daily, struggles to work, and feels life is empty. This is unusually persistent.  
     - A) They have a disorder; their grief is extreme and harmful.  
     - B) They don’t have a disorder; grief is human, and timelines vary.  
     - C) It’s only a "disorder" if society or the person sees it as one.  

  6. **Homosexuality in the 1970s**: Doctors then classified being gay as a mental disorder. Were they **mistaken**?  
     - A) Yes, objectively: being gay isn’t a dysfunction.  
     - B) No: it reflected their values, not facts.  
     - C) They were wrong, but only because it caused harm—not because of "facts."  

  7. **Male Pattern Baldness**: A 30-year-old is going bald rapidly. It’s statistically rare for his age but doesn’t bother him.  
     - A) He has a disease; his hair loss is atypical.  
     - B) He doesn’t have a disease; it’s harmless and not distressing.  
     - C) "Disease" is an overmedicalized term for this.  

  8. **Back Pain from Overuse**: A factory worker has severe back pain from repetitive lifting. Tests show no injury or abnormality—it’s "wear and tear."  
     - A) They have a disease; it’s causing harm and impairment.  
     - B) They don’t have a disease; it’s a normal response to strain, not a dysfunction.  
     - C) It’s a health problem, but "disease" is the wrong word.  

  ---  
  ### Scoring Key  
  Tally your answers and see which description best matches your pattern.  

  - **Mostly A in 1,2,4,7 + A in 6 → Biostatistical Naturalist (Boorse)**  
    *Disease = statistically atypical biological function (e.g., infertility is always a disease, even without harm).*  
  - **Mostly B in 1,2,4,7 + A in 5,8 + A in 6 → Harmful Dysfunction Hybrid (Wakefield)**  
    *Disease = biological dysfunction **and** harm (e.g., infertility isn’t a disease if harmless; grief is a disorder if dysfunctional and harmful).*  
  - **Mostly B in 1,2,4,7 + A in 8 + C in 5,6 → Normativist**  
    *Disease = whatever causes harm or is disvalued (e.g., back pain is a disease if harmful; grief is a disorder only if labeled problematic).*  
  - **Mostly C in >5 questions → Skeptic/Eliminativist**  
    *"Disease" is just a label for unwanted conditions—it doesn’t track objective facts (e.g., all cases depend on context/values).*  

  #### Honest Limitations  
  - **Wakefield vs. Normativism** often score similarly (both say "no disease" in 1,2,4,7). To split them, the back pain case (#8) is key: Wakefield says "no" (no dysfunction), Normativism says "yes" (harm suffices).  
  - **Biostatistical vs. Wakefield** are split by dysfunction-without-harm cases (#1,2,4,7): Boorse says "disease," Wakefield says "no."  
  - **All positions** may agree on prolonged grief (#5) if harm + dysfunction are obvious.  

  *Quiz design tip: To split Wakefield/Normativism, use cases where harm exists without dysfunction (e.g., #8) or dysfunction without harm (e.g., #1).*  

