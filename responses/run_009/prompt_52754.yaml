     Alternatively, make B: for those who deny it's a disorder, which might be S and also Wakefield if they think no dysfunction? But the case says atypical, so Wakefield would typically say disorder. So B might be S and N (if they think it's normal). Let's assign B: S=1, N=1

  - Q6:
