  2. **Harmful Dysfunction Hybrid (Wakefield)**: Disease requires both a dysfunction (a failure of a mechanism to perform its natural function) and harm (a value judgment that the condition is harmful).
  3. **Normativism**: Disease is a condition that is disvalued by the individual or society. It is primarily a value judgment.
  4. **Skepticism/Eliminativism**: The concept of disease is not useful or coherent; it's just a label for conditions we don't like.

  We are including at least the following cases:
  a) Infertile couple who don't want children.
  b) Sickle cell trait in a malaria-endemic region.
  c) Ordinary aging in a thriving elderly person.
