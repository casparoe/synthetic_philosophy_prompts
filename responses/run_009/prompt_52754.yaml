  Then, we flag that normativism and Wakefield might be tangled because they often give the same answer (both get points for B answers in Q1-4,7). But Q9: Wakefield gets a point for B, normativism for A. So Q9 separates them.

  Also, Boorse and Wakefield both get points for Q5 and Q6, but are separated by the dysfunction-without-harm questions (Q1-4,7): Boorse gets a point for A, Wakefield for B.

