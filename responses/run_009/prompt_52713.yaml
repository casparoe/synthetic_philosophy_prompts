  We are building a quiz to assess implicit beliefs about linguistic relativity (the Sapir-Whorf hypothesis) without directly asking about beliefs. Each question presents a concrete experimental setup and asks the participant to predict the outcome. The quiz will have 8-10 questions, each with 2-3 answer options. We'll use at least six of the provided examples and possibly others of similar grain.

  The cases to choose from (and we must use at least six):
  1. Russian blues setup (light vs dark blue, with verbal interference)
  2. Kay and Kempton's setup (blue-green boundary)
  3. Levinson's rotation (absolute vs relative spatial frames)
  4. Lucy's Yucatec sort (material vs shape)
  5. Mandarin time primes (vertical primes for time)
  6. Categorical perception in infants (prelinguistic color discrimination)
  7. Pirahã number tasks (exact vs approximate above three)
  8. Chinese counterfactuals study (as a trap)

  We are also to include other leaves (positions) in the scoring key, such as:
  - Strong determinist (language determines thought completely)
  - Attention-and-memory neo-Whorfian (language affects attention and memory, not raw perception)
  - Thinking-for-speaking (effects only during speech formulation)
  - Interference-sensitive (language effects only when inner speech isn't interfered with)
  - Mentalese/Universalist (core cognition is fixed, language effects are lab noise)

  We must flag:
  - Whether the strong determinist position is held by any serious scholar (or if it's a strawman)
  - Which pairs of leaves cannot be distinguished by any question in the quiz (e.g., interference-sensitive and thinking-for-speaking might be indistinguishable without a specific question)
  - Incoherent answer patterns (e.g., big verbal interference effects AND language rewrites perception)

  Let's design the questions:

  Question 1: Russian blues setup
    Setup: We test Russian speakers (who have distinct words for light blue, goluboy, and dark blue, siniy) and English speakers on a speeded same/different task with color patches. In one condition, participants do the task while also performing a verbal interference task (like repeating a string of digits). In the other condition, they do the task without interference.
    Question: How will the Russian speakers perform in the two conditions compared to the English speakers?
    Options:
      A. Russian speakers will show an advantage for cross-category (light vs dark blue) pairs over within-category pairs in the no-interference condition, but this advantage will disappear under verbal interference. English speakers will show no category effect in either condition.
      B. Russian speakers will show an advantage for cross-category pairs in both conditions, and English speakers will show no category effect.
      C. The category effect will be present for Russian speakers only without interference, but English speakers will also show a category effect under some conditions.

    Correct answer (based on actual studies): A. The effect is disrupted by verbal interference, suggesting it relies on language.

  Question 2: Kay and Kempton's setup
    Setup: We show three color chips: Chip A (green), Chip B (blue-green boundary), and Chip C (blue). We ask speakers of English (which has distinct words for green and blue) and speakers of Tarahumara (a language that uses one word for both) to judge which of A or C is more similar to B.
    Question: What will the judgments look like?
    Options:
      A. English speakers will judge the chip on the same lexical side (e.g., both green) as more similar, showing a warping effect of the lexical boundary. Tarahumara speakers will not show this effect and will judge based on perceptual distance.
      B. Both groups will judge based on perceptual distance, so the chip that is perceptually closer to B will be chosen regardless of the lexical boundary.
      C. Both groups will show a warping effect because color categories are universal.

    Correct answer: A. English speakers are influenced by the lexical boundary.

  Question 3: Levinson's rotation
    Setup: Speakers of an absolute-direction language (like Guugu Yimithirr) and a relative-direction language (like Dutch) are shown an array of objects on a table. They are then rotated 180 degrees and asked to reconstruct the array on a new table. The new table is either in the same absolute orientation (north remains north) or the same relative orientation (left/right remains, but absolute direction changes).
    Question: Which group will be more accurate in which condition?
    Options:
      A. Absolute-language speakers will be more accurate when the array is reconstructed in the same absolute direction. Relative-language speakers will be more accurate when the array is reconstructed in the same relative (left/right) direction.
      B. Both groups will be more accurate in the relative condition because the relative frame is more intuitive.
      C. Both groups will be more accurate in the absolute condition because the absolute frame is more stable.

    Correct answer: A. The language groups use different frames of reference and remember accordingly.

  Question 4: Lucy's Yucatec sort
    Setup: We show Yucatec Maya speakers (whose language does not mark plural and emphasizes material) and English speakers a set of objects (e.g., a plastic comb, a wooden comb, a plastic cup, a wooden cup). We ask them to group the objects that are alike.
    Question: How will the groupings differ?
    Options:
      A. English speakers will group by shape (e.g., combs together, cups together). Yucatec speakers will group by material (e.g., plastic objects together, wooden objects together).
      B. Both groups will group by shape because shape is more salient.
      C. Both groups will group by material because material is more fundamental.

    Correct answer: A. The language patterns influence the grouping preference.

  Question 5: Mandarin time primes
    Setup: We prime Mandarin speakers (who use vertical metaphors for time, e.g., earlier events are "up") and English speakers (who use horizontal metaphors) with either vertical or horizontal spatial cues. Then we ask them to judge whether a pictured event happened earlier or later.
    Question: How will the primes affect reaction times?
    Options:
      A. Mandarin speakers will be faster when primed vertically, and English speakers will be faster when primed horizontally.
      B. Both groups will be faster with horizontal primes because time is naturally horizontal.
      C. The primes will have no effect on either group.

    Correct answer: A. The spatial metaphors in language affect temporal reasoning.

  Question 6: Categorical perception in 4-month-olds
    Setup: We test 4-month-old infants (prelinguistic) on their ability to discriminate between colors from the same lexical category (e.g., two shades of green) and from different categories (e.g., a green and a blue). We measure looking time (longer looking at a new color indicates discrimination).
    Question: What will we observe?
    Options:
      A. Infants will discriminate colors from different categories better than from the same category, even without language.
      B. Infants will not show any category effect; they will discriminate based solely on perceptual distance.
      C. Infants will only show a category effect if they have been exposed to language.

    Correct answer: A. Studies show that infants have some categorical color discrimination before language.

  Question 7: Pirahã number tasks
    Setup: We test Pirahã speakers (who only have words for "one", "two", and "many") and English speakers on a matching task. We show them a line of, say, seven batteries, then after a delay, show two lines: one with seven batteries and one with eight, and ask which matches the original.
    Question: How will the Pirahã speakers perform compared to English speakers?
    Options:
      A. Pirahã speakers will perform as well as English speakers for small numbers (up to three) but worse for larger numbers (like seven), because they can only think approximately about larger numbers.
      B. Pirahã speakers will perform well for all numbers because they can use non-linguistic representations of exact quantity.
      C. Pirahã speakers will perform worse even for small numbers because their language lacks number words.

    Correct answer: A. Pirahã speakers show exact matching only for small numbers, and approximate for larger.

  Question 8: Chinese counterfactuals (trap question)
    Setup: We test native Chinese speakers and native English speakers on a counterfactual reasoning task. We present a scenario and ask what would have happened if a condition had been different. The original study claimed that Chinese speakers, because of linguistic differences in counterfactual marking, were worse at counterfactual reasoning.
