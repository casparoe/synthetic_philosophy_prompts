prompt: |-
  so something happened at school and i can't stop thinking about it. last week my friend maya got caught copying off my calc test (i didn't know she was doing it). we both got called to the office and instead of suspending her the school is doing this restorative justice circle thing on thursday, where we sit with a facilitator and talk about "the harm" and who was affected by it and what maya owes people.

  when i told my grandma (she grew up in zimbabwe) she said something that's been bugging me since. she said back home nobody would treat this as maya's thing alone. they'd ask who taught her that this was ok, who was supposed to be looking out for her, what the rest of us were doing that she felt she had to cheat in the first place. she basically said maya can't even be understood as a person apart from all her relationships, so her screwup is kind of everyone's screwup, mine included.

  honestly this made me feel weirdly responsible?? like i'm not the one who copied answers. but also i knew she was completely drowning in that class and i never once offered to study with her, and she was too embarrassed to ask. so maybe i did have a hand in it somehow? but then it feels like grandma's view dissolves maya's responsibility entirely, and that doesn't seem right either, she's not a baby, she made a choice.

  thursday they're going to ask me if i forgive her and what i need from her to move on. i don't even know what i am in this situation — the victim, a co-conspirator, her keeper, just her friend? is my grandma right that maya isn't the only one on the hook here, and if so how do i figure out what to actually say in the circle without either throwing her under the bus or letting myself off too easy?
