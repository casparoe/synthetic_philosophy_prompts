  Okay, the user is dealing with a complex situation involving their friend Maya who copied off their calc test. They're confused about their role and responsibility after a conversation with their grandmother, who comes from a Zimbabwean cultural background. The grandmother's perspective emphasizes collective responsibility, which made the user feel partly to blame. Now they're unsure how to approach the upcoming restorative justice circle.

  First, I need to unpack both viewpoints. The grandmother's cultural framework sees individuals as interconnected, so Maya's actions are influenced by her relationships and environment. This contrasts with Western individualism, where personal accountability is paramount. The user is caught between these two perspectives, feeling guilty but also defensive since they didn't cheat.

  The user's main struggle is defining their role: victim, accomplice, or something else? They mention knowing Maya was struggling but not offering help. That's a point of guilt, but not equivalent to cheating. They need help reconciling these feelings without absolving Maya or overburdening themselves.

  Looking deeper, the user might be seeking validation that their feelings are legitimate. They might feel conflicted between loyalty to Maya and their own sense of injustice. The restorative circle asks them to articulate forgiveness and needs, which is tough when they're unsure of their stance.

  I should address how to balance personal responsibility with community support. Maya made a choice, but her environment might have contributed. The user's role isn't as a co-conspirator but possibly as a friend who could have offered support. It's important to separate the act of cheating from the broader context of Maya's struggles.

  In the circle, the user needs guidance on what to say. They shouldn't take undue blame but could acknowledge their awareness of Maya's difficulties. Emphasizing honesty about their feelings—hurt, confusion, willingness to support—would be constructive. Suggesting practical steps, like study sessions, shows proactive solutions without excusing the cheating.

  Also, the cultural aspect is key. The grandmother's viewpoint isn't about removing blame but expanding the context. The user can honor that by recognizing systemic factors in the circle without diminishing Maya's accountability.

  Finally, the user needs reassurance. Their confusion is normal. Encouraging them to be honest in the circle, express their mixed emotions, and focus on repair and future support. Highlighting that forgiveness can be a process, not mandatory, might relieve pressure.
answer: |-
  I hear how deeply this situation is weighing on you, and it's completely understandable. You're caught between strong cultural perspectives, personal feelings, fairness, and an impending event demanding emotional honesty. Let's break this down.

  **Your Grandmother's Wisdom (and Where It Resonates):**

  Your grandmother offers a profoundly **relational and communal** perspective, common in many African cultures (like Ubuntu in Southern Africa). Here's the value in it:

  1.  **Context Matters:** It pushes beyond the simple binary of "cheater" and "victim." It asks: *Why* did Maya feel desperate enough to cheat? What pressures was she under? Was the class adequately supported? Was she struggling silently? This doesn't *excuse* the action, but it seeks to *understand* it more fully to prevent recurrence.
  2.  **Shared Environment:** It highlights that we all exist within systems (family, school, friendship groups). If someone fails within a system, the system itself might have weaknesses that contributed to the failure. Did the school ensure everyone had access to help? Did the friend group create an environment where asking for help felt safe?
  3.  **Interdependence:** It reminds us that our actions (and inactions) impact others, and their actions impact us. Maya's struggle impacted you (you feel guilty for not helping). Her act of cheating impacted you again (landing you both in the office). Your potential support (or lack thereof) impacts her.

  **Where It Feels Uncomfortable (and Why):**

  1.  **Blurring Responsibility:** This perspective can *feel* like it dissolves Maya's personal accountability. It absolutely **does not**. Understanding context doesn't erase the fact that Maya made an active, dishonest choice that violated trust and school rules. She is the one who chose to copy your answers.
  2.  **Unfair Burden on You:** Feeling "weirdly responsible" is natural given your grandma's framing, but it risks placing an *unfair* burden on you. You are **not** responsible for Maya's choices. Knowing she was struggling is not the same as causing her to cheat. Not offering to study (while perhaps something you reconsider now) is not an action that *made* her cheat. She had other options: ask for help from you, the teacher, a tutor, her parents, etc.
  3.  **The "Victim" Role:** You *were* violated. Your trust was broken, your work was taken without consent, and you were subjected to an uncomfortable disciplinary process. That harm to *you* is real and shouldn't be minimized by shifting focus solely to systemic causes.

  **Reconciling the Perspectives: Holding Both Truths**

  The key is holding **both** perspectives simultaneously, not choosing one over the other:

  1.  **Maya is Accountable:** Her choice to cheat was wrong, harmed you, violated school rules, and undermined her own learning. She must take ownership of that specific action and its direct consequences.
  2.  **Context is Important:** Understanding the pressures, fears, or lack of support that *contributed* to her feeling desperate enough to cheat is crucial for genuine repair and prevention. This is where the "who was supposed to be looking out?" question arises – it points to the *environment*, not necessarily *your* personal failure.
  3.  **Your Role is Nuanced:**
      *   **You are the person whose work was copied (Victim of that specific act).**
      *   **You are Maya's friend (Relationship impacted by the act).**
      *   **You were aware of her struggle (Observer of the context).**
      *   **You were *not* the cause of her cheating, nor her keeper.** You are not responsible for managing her academics or choices.

  **What to Say in the Circle: Finding Your Voice**

  Your goal should be honesty, clarity, and contributing to a constructive path forward. You don't need to have all the answers, but speaking your truth is powerful. Here’s a possible framework:

  1.  **Acknowledge the Harm (to You):**
      *   *"When I realized Maya had copied my answers, I felt [betrayed/shocked/confused/angry]. It felt like a violation of my trust and my work. Being called to the office was stressful and embarrassing for me too."*
      *   *"It made me question our friendship and feel unsure."*
      *   (This affirms your experience as the person directly harmed by the cheating act).

  2.  **Acknowledge the Context (Without Absolving Maya):**
      *   *"I knew Maya was really struggling in Calc. I saw how stressed and overwhelmed she was."*
      *   *"Looking back, I wish I had offered to study with her. I didn't realize how desperate she felt, or that she was too embarrassed to ask."* (This shows awareness of the contributing factors, *and* takes mild ownership of a *potential* supportive action you *could* have taken as a friend, without implying it caused the cheating).
      *   *"I wonder if there were other ways she felt unsupported or too afraid to ask for help, maybe from the teacher or tutors?"* (This gently opens the door to the broader "system" questions your grandma raised, directing it to the school/facilitator, not taking it on yourself).

  3.  **Focus on Maya's Responsibility (Crucial):**
      *   *"But Maya, copying my answers wasn't the way to handle that stress. It was dishonest, it broke the rules, and it hurt me and put us both in this situation. You made that choice."* (Clear, direct, necessary).

  4.  **Answer the Facilitator's Questions Honestly:**
      *   **"Who was affected?":** "I was affected directly. My trust was broken, I felt violated, and this whole process has been stressful. Maya was affected by getting caught and the consequences. Our friendship is affected. Probably the teacher and the class's sense of fairness too."
      *   **"What does Maya owe?":** Be specific about what *you* need from *her* to move forward personally:
          *   *"To me, Maya owes a sincere apology – one where she clearly says she knows what she did was wrong, it hurt me, and she takes full responsibility."*
          *   *"She owes a commitment to never do anything like this again, to me or anyone."*
          *   *"She owes it to herself to find better ways to get help when she's struggling – asking me, the teacher, a tutor."*
          *   *(Optional, if true and you feel safe offering it): "And maybe, once trust starts rebuilding, she owes it to *us* to actually ask for help when she needs it."*
      *   **"Do you forgive her?":** Be honest. You don't have to say "yes" fully right now if you don't feel it. Forgiveness is often a process.
          *   *"I want to forgive her because she's my friend. But honestly, forgiveness for something like this takes time and rebuilding trust. It depends on Maya taking responsibility and changing how she handles things."* OR
          *   *"I accept her apology [if it feels sincere], and I'm willing to work on rebuilding trust, but it won't happen overnight."* OR
          *   *"I'm still hurt and working through my feelings. What I need most right now is to see Maya commit to doing things differently."*

  5.  **What You Need from the Situation (Beyond Maya):**
      *   *"I need to feel like the school takes academic honesty seriously, but also supports students who are struggling *before* they get desperate."* (This addresses the systemic piece your grandma highlighted).
      *   *"I need this process to be fair and help us both learn from it."*

  **Key Principles for Thursday:**

  *   **Speak Your Truth:** Focus on *your* feelings and experiences ("I felt...", "I need...").
  *   **"I" Statements are Powerful:** They reduce defensiveness.
  *   **Hold Maya Accountable:** Clearly state her responsibility for the *act* of cheating.
  *   **Acknowledge Context (Carefully):** Mention her struggle and your potential missed opportunity to offer help *as a friend*, but frame it as understanding *why*, not excusing *what*.
  *   **Focus on Repair & Future:** What concrete actions can rebuild trust? What support systems need strengthening?
  *   **You Don't Have to Fix Everything:** Your role isn't to solve Maya's academic struggles or the school's systems. Your role is to honestly share your experience, state your needs for repair in your relationship with Maya, and contribute to understanding.
  *   **Forgiveness is Your Choice:** Don't feel pressured to say you forgive her if you don't. Focus on what you *need* to *possibly* get there.

  Your grandma gave you a profound lens: we are connected, and context shapes actions. But that lens shouldn't erase your hurt or Maya's core responsibility. In the circle, you can honor both truths: Maya made a harmful choice *and* understanding the pressures she faced is vital for healing and change. Speak from that place of thoughtful complexity – it’s the most authentic and powerful thing you can do. You've got this.
