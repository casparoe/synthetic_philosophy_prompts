prompt: |-
  I run a recorded interview series for my university's philosophy society, and next week's guest is a philosopher who defends the Kripkean view that a person couldn't have originated from a different sperm and egg. Draft me eight to ten questions that go past having him just restate the position. Specifically I want at least one question on how fine-grained the origin claim is supposed to be — same gametes but concieved days later, same zygote but gestated in a different surrogate's womb, a few of the original atoms swapped out early on — and where exactly he draws the line and why that line isn't arbitrary. At least one on whether the whole intuition is just origin prejudice: the gametes only seem special because they're causally upstream of everything else about us, the same way the Big Bang does. And at least one on whether the view has uncomfortable practical consequences, e.g. for how parents who conceived with donor gametes should think about the child they 'would have had'. For each question, give a follow-up keyed to the answer he's most likely to give — like if he says the cutoff is 'substantially the same matter arranged the same way', push on why cell-for-cell replacement after conception seems fine but any replacement before it is fatal to identity. Keep the tone conversational, this is for an undergrad audience.
