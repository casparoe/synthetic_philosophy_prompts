prompt: |-
  I am a novelist, some way into a book whose protagonist is a cardiologist given to speaking of the body as an instrument. His creed, in his own voice in the draft, runs roughly as follows: a heart is made to pump, as a clock is made to keep time; a heart that will not pump is a failed heart, not a heart with unfashionable habits, and that is a fact about it rather than an opinion of his, just as a clock stopped at noon is simply a failed clock. I want him to be more than rhetorically impressive; I want his self-understanding to be defensible, or at least to fail in instructive places, and I cannot tell on my own where it fails. So I am asking for an audit of the analogy that does the work throughout the draft: the organ as designed artifact.

  Give me, first, the correspondence table — what plays the role of the designer, the blueprint, the intended use, the type against which any given token is judged, the malfunction. Then the places the mapping breaks, and, since I need to know which failures are dramatic and which merely pedantic, a verdict on which of the break points matter for the conclusions my character wants to draw. What he wants to draw, specifically, is this: that illness is objective; that "this heart is diseased" is like "this clock is broken," a fact rather than a valuation, so that his standing quarrel with the hospital ethics committee — who decides what a body is for — can have a right answer rather than a negotiated one.

  Four cases from the draft should be run through the table, because I suspect they come apart differently:

  1. A patient whose red blood cells are sickle-shaped. The shape maims him, yet it runs in his family because, in the malarial country his people came from, the same shape kept his ancestors alive. The cardiologist calls it a defect; the evolutionary biologist in the book calls it a bargain. Which of them, if either, is talking about the cells' function?
  2. A newborn with a first-in-the-family mutation whose heart never pumped properly from its first hour. Can that heart be malfunctioning on the artifact picture, when nothing like it ever did its work anywhere in the line — is there a spec for it to have failed against?
  3. The middle ear, which was jawbones before anything asked it to hear. Repurposed — but by whom, and under what reading of "for"?
  4. The cardiologist's own craft: he reads hearts by their sound. Nobody designed the heart to be audible, yet the murmur tells him more about the organ than most of its other doings. Function or side effect, and does the answer differ between the two standard accounts?

  Then tell me whether the objectivity conclusion survives. Once the disanalogies are on the table, does "this heart is diseased" remain a fact in the way "this clock is broken" is, or was the analogy carrying the conclusion the whole time? And if the watch is the wrong picture, say what the right one would be — the biologist should be able to offer it to him in a late chapter, so give me an image rather than an argument.

  Finally, a request about how you report all this. Please separate what is settled among philosophers of biology from what is genuinely contested, and flag the contested points as contested rather than presenting them as consensus. I have in mind two in particular: whether one of the two standard accounts of biological function — the one grounding function in what a trait was selected for, versus the one grounding it in the trait's present contribution to some capacity of the organism — is the standard, or whether pluralism about function is now the respectable view; and whether "dysfunction" can do any work in medicine without a value judgment smuggled in alongside it. If the cardiologist's creed depends on a contested call, I need to know, because it decides whether I write him as a man with a philosophy or a man with a temperament.
reasoning: |-
  Okay, let me approach this novelist's request methodically. The core task is auditing the cardiologist's analogy between biological organs and designed artifacts, specifically evaluating whether it supports his claim that heart disease is objectively factual like a broken clock. 

  First, I need to map the artifact framework onto biology as the character does:
  - Designer → Natural selection (though strictly speaking, evolution lacks intentionality)
  - Blueprint → Genetic information
  - Intended use → Biological function (survival/reproduction)
  - Type specification → Species-typical physiology
  - Malfunction → Failure to perform evolved function

  The critical tension lies in whether "function" in biology can be as value-neutral as "purpose" in artifacts. I recall the philosopher's distinction between selected-effect functions (what a trait evolved to do) and causal-role functions (what it currently contributes). This isn't just academic - it directly impacts how we judge the four cases.

  For the sickle cell example: 
  - Under selected-effect function, the trait isn't malfunctioning - it's doing exactly what evolution shaped it for (malaria resistance), even with trade-offs. 
  - But under causal-role, the cell's failure to transport oxygen efficiently makes it defective. 
  The cardiologist would privilege the latter view while the biologist argues the former. Neither is wholly wrong - this shows the framework fracture.

  The newborn's mutated heart case exposes deeper cracks: 
  With no evolutionary history, there's no "design" to reference. The cardiologist might appeal to ideal cardiac physiology as the standard, but that's already importing human-defined norms rather than pure biological facts.

  The ear/jawbone repurposing highlights evolution's tinkering: 
  There's no "repurposer" - just incremental adaptation. "Function" becomes contextual to time and environment, undermining the idea of fixed, objective purposes.

  Finally, the heart sounds case is fascinating:
  Auscultation leverages a side effect (vibrations from blood flow). Calling this "functional" only makes sense under causal-role accounts - it serves our diagnostic purpose, not the heart's evolutionary one. Yet clinically, it's indispensable.

  All this suggests the artifact analogy strains under biological reality. The cardiologist's objectivity claim survives only if we accept:
  1) Species-typical physiology as the objective standard
  2) That "disease" is purely deviation from that standard
  But the sickle cell case shows even species-typical traits can be harmful in certain environments, while the mutation case reveals how "typical" is statistically defined, not metaphysically given.

  Perhaps the strongest counter-analogy is evolutionary biology's "tinkerer" metaphor (François Jacob) - no design, just ad hoc modifications. The cardiologist might retort that in clinical practice, we act as if hearts have purposes - but that pragmatic stance doesn't make it ontologically true.

  On contested philosophy: 
  - Function pluralism is widely accepted now (Garson's taxonomy helps here)
  - But dysfunction-as-objective-fact remains hotly debated (Wakefield vs. Boorse debates)
  - The cardiologist's position leans on Boorse's biostatistical theory, which is influential but contested for implicitly valuing survival/reproduction

  For the novelist's purpose: The character can be philosophically coherent (Boorse exists!) but must ignore alternatives. His temperament shows in what he dismisses - like the evolutionary biologist's "bargain" perspective. The late-chapter counter-image should be visceral: maybe a river carving canyons - purposeful-looking results from mindless, iterative processes.
answer: |-
  Here is your audit, structured for narrative utility. I've separated settled from contested terrain, flagged key philosophical debates, and mapped your cases to expose where the cardiologist's analogy holds or fractures. The conclusion tracks whether his core claim ("disease is objective like a broken clock") survives scrutiny.

  ### **Core Analogy: Organ as Designed Artifact**
  | **Artifact Concept** | **Cardiologist's Biological Mapping** | **Where It Fails (Critically)** |
  |----------------------|---------------------------------------|--------------------------------|
  | **Designer**         | Natural Selection / Evolutionary History | Evolution has no *intent*; it's a mindless process. "Design" is metaphorical. |
  | **Blueprint**        | Genetic Code / Species-Typical Physiology | Mutations introduce novelty with no "plan" (see Case 2). Genes are probabilistic, not deterministic. |
  | **Intended Use**     | Survival & Reproduction (Teleology) | Biology has *functions* but no *purposes*. "Use" is context-dependent (see Cases 1 & 3). |
  | **Type Specification** | Species-Normative Structure/Function | "Normative" blends statistical averages with values (e.g., "pumping" is privileged over other traits). |
  | **Malfunction**      | Failure to Perform Evolved Function | What counts as "function" is contested (see Cases 1–4). Dysfunction ≠ objective failure if environment changes. |

  ---

  ### **Case Analyses: Where the Analogy Holds or Fails**
  **Case 1: Sickle-Cell Trait**  
  - **Cardiologist's View:** Defect (fails at oxygen transport).  
  - **Biologist's View:** Bargain (evolved function: malaria resistance).  
  - **Function?**  
    - *Selected-Effect (SE) Function:* **Yes** (selected for malaria resistance).  
    - *Causal-Role (CR) Function:* **Partially** (fails at oxygen transport but aids survival in malaria-prone environments).  
  - **Analogy Break:** The *same trait* is functional or dysfunctional based on **environmental context**. Artifacts don't adapt; biology does.  
  - **Dramatic Failure:** Undermines "objective malfunction." The cardiologist ignores historical function, privileging current pathology. His conclusion ("defect") is value-laden in ignoring context.  

  **Case 2: Congenital Heart Mutation**  
  - **Cardiologist's View:** Malfunction (fails to pump).  
  - **Analogy Challenge:** No evolutionary history → no "design" or "type specification" exists for *this* heart.  
  - **Function?**  
    - *SE Function:* **None** (no selection history).  
    - *CR Function:* **Yes** (fails to contribute to circulatory capacity).  
  - **Analogy Break:** Artifacts require a pre-existing spec. Biology can only reference **statistical norms** (e.g., "most hearts pump"). This norm is descriptive, not prescriptive.  
  - **Dramatic Failure:** Reveals the cardiologist's "type specification" is a **human-constructed ideal**, not an objective standard.  

  **Case 3: Middle Ear (Repurposed Jawbones)**  
  - **Cardiologist's View:** Silent on "repurposing" (focuses on current function: hearing).  
  - **Analogy Challenge:** No "repurposer" exists. Evolution is **tinkering** (Jacob's "bricolage"), not redesign.  
  - **Function?**  
    - *SE Function:* Hearing (current selected effect).  
    - *CR Function:* Hearing (current causal role).  
    - *...but "for" is ambiguous:* Jawbones were "for" structural support; now "for" hearing.  
  - **Analogy Break:** Artifacts have fixed purposes; biology has **lineage-dependent functions**. "Function" is a snapshot in time.  
  - **Pedantic Failure:** Less dramatic (current function is clear), but highlights evolution’s lack of foresight/intent.  

  **Case 4: Heart Sounds (Auscultation)**  
  - **Cardiologist's View:** Murmurs indicate dysfunction.  
  - **Function?**  
    - *SE Function:* **None** (sounds are epiphenomena; not selected for).  
    - *CR Function:* **Diagnostically useful** (correlates with structural issues).  
  - **Analogy Break:** Artifacts are designed for **user access** (e.g., clock faces). Biology’s "side effects" (sounds) are exploited by medicine.  
  - **Pedantic Failure:** Confirms function is **observer-relative**. The cardiologist uses a side effect as a diagnostic tool—valuable, but not "designed."  

  ---

  ### **Does "Disease is Objective" Survive?**  
  - **The Analogy Carries the Conclusion:** Yes, but shakily.  
  - **Where It Holds:**  
    - In *acute, species-typical pathology* (e.g., myocardial infarction), "failure" is empirically verifiable like a broken spring.  
    - Biology *has* functional norms (e.g., hearts pump blood in mammals).  
  - **Where It Fails:**  
    - **Context-Dependence:** Sickle-cell shows function/environment interact (Case 1).  
    - **Novel Pathologies:** No "design" to reference for new mutations (Case 2).  
    - **Value-Laden Norms:** "Disease" implies harm, but harm requires a **valuation** (e.g., "pumping is *good*").  
  - **Verdict:** "This heart is diseased" is **not** a pure fact like "this clock is broken." It is:  
    - A **biostatistical fact** (deviation from species-typical function), *plus*  
    - A **value judgment** (that the deviation is *harmful*).  
  The cardiologist’s objectivity relies on masking the second component.  

  ---

  ### **Contested Philosophical Ground (Key for Characterization)**  
  1. **Biological Function:**  
     - **Settled:** Pluralism is now the mainstream view (SE and CR functions coexist; Garson 2016). Neither is "standard."  
     - **Contested:** Whether SE functions are *primary* (Neander, Millikan) or CR/pluralism suffices (Cummins, Godfrey-Smith).  
     - **Narrative Implication:** The cardiologist leans on CR functions (present capacity) but ignores SE (historical context). This is a **defensible but contested choice**—making him philosophical, not merely temperamental.  

  2. **Dysfunction Without Valuation?**  
     - **Settled:** Pure descriptivism (Boorse’s "biostatistical theory") exists but is widely critiqued.  
     - **Contested:**  
       - Wakefield: Dysfunction requires *harm* (value-dependent).  
       - Boorse: Dysfunction is statistical deviation (value-free).  
       - Kingma, Hausman: Statistical norms *imply* values (e.g., survival is "good").  
     - **Narrative Implication:** The cardiologist adopts a **Boorse-like stance**. This is philosophically contested but not fringe—write him as a man with a philosophy, though one under pressure.  

  ---

  ### **The Biologist's Counter-Image**  
  If not a watch, what? Offer this in the late chapter:  
  > **"A heart is not a clock. It is a river—shaped by the land, bending to droughts and floods, carving canyons from accidents of stone. It flows not because it *must*, but because it *can*. To call it 'broken' when it dries is not a fact, but a lament for the fish that need its water."**  
  > *(This merges evolutionary contingency (land/shape), environmental dependence (droughts/floods), and observer-relative values (fish).)*  

  ---

  ### **Summary for Your Draft**  
  - **Cardiologist’s Creed:** Philosophically defensible but incomplete. It fails most dramatically when:  
    - Environment reshapes function (Case 1).  
    - Novel pathologies lack evolutionary context (Case 2).  
  - **Objectivity Claim:** Survives only if "disease" means *statistical deviation from species-typical function*. But "disease" as *harm* requires values. His quarrel with the ethics committee has no "right answer"—it’s negotiation between facts and values.  
  - **Characterization:** He has a coherent philosophy (Boorse-inspired), but its cracks—ignoring history, environment, and valuation—reveal his temperament: a mind seeking order in life’s tinkering.  

  Use the biologist to voice pluralism: "A trait is a tool with many uses, Doctor. You hear a murmur and call it broken; I hear the echo of a jawbone learning to listen."
