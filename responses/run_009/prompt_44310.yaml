prompt: |-
  I do research-and-briefing work for a mid-size education policy nonprofit. Every month or so someone hands me a claim that leans on a heritability number -- a think-tank report saying the heritability of IQ is 60-80% so extra school funding mostly can't help poor kids, a journalist asking whether a new study "proves reading disability is genetic," a board member forwarding something about how twin studies show shared environment doesn't matter for adult outcomes. I have no genetics background, neither does anyone else here, and I typically get an afternoon per claim before I have to say something quotable. I need a procedure, not an essay.

  Write me a decision procedure I can actually run on these claims, in order: what to ask first, what counts as a sufficient answer at each step, where the procedure stops with "this claim is fine as stated," where it stops with "can't tell from here, ask the person for more," and where it has to admit a step is a judgment call dressed up as a step. It has to work with the stuff I can actually get: a percentage from a paper abstract, a sample size, maybe a study design name if I'm lucky. Say what I do when I can't get the numbers at all.

  The concepts I gather it needs to handle, from my own reading -- correct me if I'm framing any of these wrong: heritability being a fact about a population in an environment, not about a trait; the slide from within-group to between-group claims (the seed-and-soil thing); the equal environments assumption in twin designs; shared vs nonshared environment, including the awkward finding that shared environment comes out near zero for adult IQ, which I want to handle honestly rather than dodge; gene-environment correlation and interaction; and the point that heritability going *up* over time can mean environments got more equal, which cuts both ways politically.

  Then run it on three cases: (1) the 60-80%-heritability-so-funding-doesn't-help report; (2) a claim that rising heritability of BMI over the twentieth century shows the obesity epidemic is environmental, since the gene pool didn't change; (3) a district contractor saying that because shared environment explains almost none of the variance in their adult outcome data, differences in school quality within the district (which are honestly fairly small) don't matter much. One of these should be a claim I *want* to call wrong and the procedure won't let me -- you pick which one and make me feel it. Also flag what the procedure can't do: where it would give false comfort, where it looks like it settles something it really just moved one step over.
reasoning: |-
  We are creating a decision procedure for evaluating claims that use heritability numbers. The procedure must be step-by-step, using only information that can be readily obtained (like abstract, sample size, study design). It must flag common pitfalls and stop at points where we need more information or where judgment is required.

  Key concepts to handle (as per user):
  1. Heritability is population- and environment-specific, not a fixed trait property.
  2. Within-group vs. between-group claims (the seed-and-soil analogy: same heritability in two groups doesn't mean the mean difference is genetic).
  3. Equal environments assumption (EEA) in twin studies: often violated?
  4. Shared vs. non-shared environment: note that for adult outcomes, shared environment often near zero, but that doesn't mean family/school doesn't matter (could be captured by genes via gene-environment correlation, or non-shared environment).
  5. Gene-environment (GE) correlation and interaction.
  6. Rising heritability can mean environments became more equal (so genetic differences get to express more), which might be due to policy making environments more uniform.

  The Decision Procedure:

  Step 1: Identify the Heritability Statistic
     - What is the claimed heritability number? (e.g., 60-80%)
     - If no number is given, stop: "Claim cannot be evaluated without a specific heritability estimate. Ask for the source and number."
     - If a number is given, note it and proceed.

  Step 2: Identify the Study Design and Population
     - What study design? (Twin, adoption, GWAS, family study? Note: GWAS gives SNP heritability, which is lower than twin study heritability because it doesn't capture all genetic variation.)
     - What population? (Country, time period, age group, specific cohort? If not specified, that's a problem.)
     - If the design is not stated, try to find it from the source. If unavailable, stop: "Study design not specified. Without knowing the method, we cannot assess the quality of the estimate. Ask for the study design."
     - If population is not specified, note: "Population not specified. This estimate might not apply to the population in question." Proceed with caution.

  Step 3: Check the Sample Size
     - What is the sample size? (For twin studies, the number of twin pairs is critical.)
     - If sample size is very small (e.g., < 100 pairs for twin studies, or < 1000 for GWAS), note: "Small sample size may lead to unreliable estimate."
     - If sample size is not available, note: "Sample size not provided; precision of estimate unknown."

  Step 4: Check the Age Group and Trait Measurement
     - What age group? (Heritability can change with age, e.g., shared environment effects often diminish with age.)
     - How was the trait measured? (e.g., IQ test, BMI measurement, etc.)
     - If the age group is not the same as the target of the claim (e.g., using child heritability to make claims about adults), flag: "The study is for [age group], but the claim is about [different age group]. This may not hold."
     - If the trait measurement is not clearly defined or seems inappropriate, note: "Trait measurement method unclear or not validated."

  Step 5: Evaluate the Claim's Logical Structure
     - What is the claim? Break it down:
       a) Is it a direct causal claim? (e.g., "high heritability means environment doesn't matter")
       b) Is it a between-group claim? (e.g., "group differences are genetic because heritability is high")
       c) Is it a policy claim? (e.g., "intervention X won't work because heritability is high")

     - For (a): Remember that heritability is the proportion of variance due to genetic differences in that population at that time. It does not mean the trait is unchangeable. High heritability can coexist with high environmental malleability (e.g., height is highly heritable but also increased by nutrition). Therefore, step 5a: "High heritability does not imply that environmental changes cannot have an effect. This claim is invalid on its face."

     - For (b): If the claim is about group differences (e.g., racial, socioeconomic), then stop: "Heritability estimates within groups do not inform about the causes of differences between groups. This is a logical error (the seed-and-soil analogy: seeds from the same packet grown in different soils can have differences entirely due to soil)."

     - For (c): If the claim is that an intervention won't work because of high heritability, then note: "Heritability does not measure the potential for change. It measures current variation. An intervention might change the environment in a way that reduces variation (if uniform) or changes the mean (if beneficial to all). Also, gene-environment interactions might mean that the intervention works better for some genotypes. Therefore, high heritability does not preclude the effectiveness of interventions."

  Step 6: Check for Violations of Assumptions (if twin study)
     - If the study is a twin study, the equal environments assumption (EEA) is critical. Do they check it? (Typically, we can't get this from an abstract, but if the claim is based on a twin study and the trait is something like IQ, note: "Twin studies assume that identical and fraternal twins are treated equally similarly. This may not hold for traits like IQ if identical twins are treated more alike. Without evidence that EEA holds, the estimate may be biased.") If we cannot check, we note the assumption and move on.

  Step 7: Consider Shared Environment and Non-Shared Environment
     - What is the shared environment (c^2) estimate? If near zero for adult outcomes, note: "In adults, shared environment often explains little variance, but this does not mean that family or school environment did not matter. They might have mattered during childhood but their effects fade, or they might be captured by gene-environment correlations. Also, the current environment might be less uniform (so non-shared environment is larger)."
     - If the claim uses low c^2 to argue that differences in a shared environment (like school quality) don't matter, counter: "Low shared environment estimate does not imply that changing the shared environment would not have an effect. It only means that in the current population, the variation in shared environment is not a major source of variation in the trait. But if we change the environment for everyone, the mean trait level might change."

  Step 8: Gene-Environment Interplay
     - If the claim ignores gene-environment correlation or interaction, note: "Heritability estimates can be inflated by gene-environment correlation (e.g., genetically smarter kids get more education). Also, gene-environment interactions (the same environment having different effects on different genotypes) are not captured. Therefore, the heritability estimate does not fully separate genes and environment."

  Step 9: Temporal Changes in Heritability
     - If the claim uses a change in heritability over time (e.g., rising heritability of BMI) to make an environmental argument, note: "Rising heritability can occur if environments become more uniform (so environmental variation decreases, making genetic variation relatively more important). Therefore, a rise in heritability does not necessarily imply that the environment has become more permissive for the trait to increase. It could be that the environment became more uniform and better, allowing genetic potential to be more fully expressed."

  Step 10: Judgment Calls
     - At any step, if we lack information but the claim seems to be based on a common fallacy, we can flag the fallacy without needing the exact number. For example, if the claim is between-group, we stop at Step 5b.

     - We must accept that sometimes we cannot get the numbers (e.g., the original paper is behind a paywall, or the claim doesn't cite). Then we say: "The claim does not provide sufficient information for evaluation. Without access to the original study, we cannot verify the heritability estimate or its context."

  Now, run the procedure on the three cases:

  Case 1: "The heritability of IQ is 60-80% so extra school funding mostly can't help poor kids."

  Step 1: Heritability number given (60-80%).
  Step 2: Typically, these numbers come from twin studies in Western countries (like the USA or Europe). But the claim doesn't specify. We note: population not specified? (Assume it's from a typical twin study, but we don't know the population of the study.)
  Step 3: Sample size? Not given. We cannot check.
  Step 4: Age group? The claim is about school funding, so likely about children. But twin studies often show that heritability of IQ increases with age. In childhood, shared environment might be substantial. So if the 60-80% is from adults, it may not apply to children. We note: "If the heritability estimate is from adults, it may not reflect the situation in children, where shared environment (including school) can have a larger effect."
  Step 5: The claim is a policy claim (type c). We apply Step 5c: "High heritability does not mean that environmental interventions (like school funding) won't work. It only means that in the current environment, genetic differences account for a large portion of the variation. But if we change the environment (e.g., improve schools for everyone), the mean IQ might rise. Also, gene-environment interactions might mean that the extra funding helps some children more than others, but that doesn't mean it doesn't help."
     Additionally, the claim is about poor kids. This is a between-group issue? Not exactly, because the claim is about an intervention on a group that is environmentally deprived. We note: "The heritability estimate is typically from a population that includes a range of environments. If poor kids are in environments that are below the optimal range for IQ development, then improving their environment might have a larger effect than the heritability estimate suggests (because the estimate is an average across environments)."
  Step 6: If it's a twin study, we note the EEA assumption. But we don't have the study.
  Step 7: Shared environment: For adult IQ, shared environment is near zero, but for children it can be 20-30%. So if the study is on adults, then the shared environment estimate is low, but that doesn't mean school doesn't matter for children. We note: "The low shared environment estimate in adults does not imply that school environment during childhood did not matter. It might have mattered but its effects fade, or it might have been important for establishing the trajectory that led to the adult outcome. Also, if the school funding is intended to reduce variation in school quality, it might reduce environmental variation and thus increase heritability (but that doesn't mean it didn't raise the mean)."
  Step 8: Gene-environment correlation: Children with higher genetic potential for IQ might get more out of school, but that doesn't mean that improving schools for those with less genetic potential (or in poor environments) won't help. In fact, it might help more.
  Step 9: Not applicable.
  Step 10: We have enough to call out the fallacy. We say: "This claim is invalid. High heritability does not preclude the effectiveness of environmental interventions. Moreover, the claim may be based on heritability estimates from a different age group or population."

  Verdict for Case 1: Claim is flawed. We can say: "This claim misinterprets heritability. High heritability does not mean that environmental interventions are ineffective. In fact, improving schools might raise the average IQ even if heritability is high."

  Case 2: Claim that rising heritability of BMI over the twentieth century shows the obesity epidemic is environmental, since the gene pool didn't change.

  Step 1: The claim states that heritability rose.
  Step 2: We need to know the study design and population. Typically, such claims are from twin studies over time. Assume we have studies from various decades in the 20th century in, say, the US.
  Step 3: Sample sizes? Not given, but assume adequate for each study.
  Step 4: Age group? Probably adults.
  Step 5: The claim is: rising heritability (so genetic variation explains more of the variance) and we know the gene pool didn't change (true on such a short timescale), so they say the increase in obesity (the mean going up) must be environmental. But note: heritability is about proportion of variance, not about the mean. We have Step 9: Rising heritability can occur because the environmental variation decreased (making genetic variation relatively more important). Also, the increase in the mean (obesity epidemic) could be due to an environmental shift that affects everyone (like increased availability of high-calorie food). Therefore, the claim is confusing two things: the rise in heritability and the rise in the mean. We note: "The rise in heritability does not directly explain the rise in the mean. The mean increase is environmental, but the rise in heritability might be due to environments becoming more uniform (so that genetic differences become more apparent). Therefore, the claim is partially right in that the epidemic is environmental, but the rising heritability is not the evidence for it. In fact, the rising heritability might be a consequence of environmental changes (reducing environmental variation)."

  Verdict for Case 2: The claim is partially correct (the obesity epidemic is environmental) but the reasoning using rising heritability is flawed. We can say: "While the obesity epidemic is indeed driven by environmental changes, the rising heritability of BMI does not prove that. Instead, rising heritability might indicate that environmental factors became more uniform, allowing genetic differences to account for more of the variation."

  Case 3: District contractor says that because shared environment explains almost none of the variance in their adult outcome data, differences in school quality within the district (which are small) don't matter much.

  Step 1: Shared environment estimate is near zero.
  Step 2: The data is from the district? We don't know the study design. Let's assume they did a twin study or a family study in the district on adults (but they are using it to comment on school quality, which is a shared environment during childhood).
  Step 4: The outcome is measured in adulthood. The school environment was during childhood. This is a mismatch. We note: "The shared environment estimate for adult outcomes might not reflect the importance of childhood environment. The effects of school quality during childhood might fade by adulthood, or they might be mediated through other factors (like educational attainment) that are then reflected in the adult outcome. Also, if the differences in school quality within the district are small (as stated), then shared environment would explain little variance because there isn't much variation in the environment. That does not mean that school quality doesn't matter. If we improved all schools, the mean outcome might rise even if the variation didn't change much."
  Step 5: The claim is a policy-like claim (about the importance of school quality). We note: "Low shared environment estimate does not imply that changing the shared environment wouldn't have an effect. It only means that in the current population, the existing variation in shared environment does not account for much variation in the outcome."
  Step 7: We expand: "Because the variation in school quality within the district is small, the study might not have had the power to detect an effect. Also, the outcome is in adulthood, so other factors may have come into play. Moreover, if the schools are uniformly good, then the shared environment effect might be positive but not varying, so it doesn't contribute to variance. But if we compared with a district with worse schools, we might see a difference."

  Verdict for Case 3: The claim is flawed. We can say: "The lack of variation in school quality within the district means that the study cannot assess the effect of school quality. The low shared environment estimate for adult outcomes does not imply that school quality doesn't matter. It might matter a lot for the mean level of the outcome, even if it doesn't account for much variance in this district."

  Now, the user said one of these should be a claim they want to call wrong but the procedure won't let them. I pick Case 2. The user might want to call the claim wrong because it uses rising heritability as evidence for an environmental cause of the obesity epidemic. But note: the claim is that the obesity epidemic is environmental. That part is correct. The procedure points out that the reasoning (using rising heritability) is flawed, but the conclusion (the epidemic is environmental) is still justified by other evidence (the gene pool didn't change). So the procedure doesn't let us say the entire claim is wrong, only the reasoning. We have to accept that the obesity epidemic is environmental, which is true. So if the user wanted to reject the entire claim, the procedure won't let them.

  Limitations of the procedure:
  - It can't get at the quality of the original study beyond sample size and design name.
  - It relies on the user being able to identify the study design and population, which might not always be available.
  - It cannot check the statistical methods (like model fitting) in the study.
  - It can only flag common fallacies; it doesn't prove the opposite.
  - It might give false comfort when we can't find a problem, but the study might have other issues (like measurement error, selection bias).
  - It moves the problem one step over when we note a potential issue (like EEA violation) but we don't have the data to check, so we just note the possibility and move on.
answer: |-
  Below is a step-by-step decision procedure for evaluating heritability claims. It's designed to be run in **under 30 minutes** using accessible information (e.g., abstracts, study designs, sample sizes). It flags fatal flaws ("stop here"), identifies judgment calls, and specifies when to demand more data. Crucially, it **doesn't require genetics expertise**.

  ---

  ### **Decision Procedure for Heritability Claims**
  **Input**: A claim citing heritability (e.g., "Trait X is Y% heritable, therefore Z").  
  **Output**: One of:  
  - ✅ **Claim holds** (no fatal flaws)  
  - 🚩 **Claim flawed** (critical error detected)  
  - ⚠️ **Insufficient info** (demand more data)  
  - ⚖️ **Judgment call** (requires expert input; flag uncertainty)

  ---

  #### **Step 1: Identify the heritability number and study design**  
  **Ask**: What is the claimed heritability %? What study design produced it?  
  **Sources**: Claim text, paper abstract, methods section.  
  **Sufficient answer**: Exact % or range (e.g., "60-80%") + design name (e.g., "twin study").  
  **Stop here if**:  
  - 🚩 No number or design → "**Claim flawed: No heritability estimate or study design provided.**"  
  - ⚖️ Design unclear (e.g., "genetic study") → "**Judgment call: Study design ambiguous; may hide assumptions (e.g., EEA in twins).**"  
  **Proceed if**: Number and design are clear (e.g., "60% heritability from a twin study").

  ---

  #### **Step 2: Verify population and environment match**  
  **Ask**: Does the study population/environment match the claim’s target group?  
  **Check**: Location, timeframe, demographics (e.g., "Swedish twins in 1990s" vs. "US schoolchildren today").  
  **Stop here if**:  
  - 🚩 Mismatched groups (e.g., claim about low-income kids but study used wealthy twins) → "**Claim flawed: Heritability is population-specific; not generalizable.**"  
  - ⚠️ Population not specified → "**Insufficient info: Demand study population details.**"  
  **Proceed if**: Populations align (or claim is vague enough to be plausible).

  ---

  #### **Step 3: Check for within-group vs. between-group slide**  
  **Ask**: Is the claim applying within-group heritability to explain differences **between** groups (e.g., races, income levels)?  
  **Example flaw**: "IQ heritability is 80% in Whites and Blacks, so IQ gaps are genetic."  
  **Stop here if**:  
  - 🚩 Between-group claim → "**Claim flawed: Heritability within groups ≠ cause of between-group differences (seed-and-soil fallacy).**"  
  **Proceed if**: Claim is strictly about one group or individual differences.

  ---

  #### **Step 4: Evaluate design-specific assumptions**  
  **Ask**: Does the study design rely on assumptions likely violated here?  
  **Key pitfalls**:  
  - **Twin studies**: Violated Equal Environments Assumption (EEA)? (e.g., if trait is influenced by treatment differences, like parental investment in IQ).  
  - **Adoption studies**: Non-random placement? (e.g., adoptive parents matched to bio parents).  
  - **GWAS**: Low SNP heritability? (often <50% for traits like IQ; warns twin studies may overestimate).  
  **Stop here if**:  
  - 🚩 Clear violation (e.g., twin study on politicized trait like IQ with no EEA check) → "**Claim flawed: Critical assumption (e.g., EEA) likely violated.**"  
  - ⚖️ Unclear violation → "**Judgment call: Potential violation (e.g., EEA); requires deeper review.**"  
  **Proceed if**: Design assumptions seem reasonable (or no obvious red flags).

  ---

  #### **Step 5: Handle shared/nonshared environment (c²/e²)**  
  **Ask**: Does the claim conflate low shared environment (c²) with "environment doesn’t matter"?  
  **Key nuance**: Low c² (e.g., near 0 for adult IQ) ≠ schools/families irrelevant. It means:  
  - Environments are uniform (no variation to explain differences).  
  - Gene-environment correlations (rGE) mask environmental effects (e.g., genes shape environment).  
  **Stop here if**:  
  - 🚩 Claim says "low c² = environment ineffective" → "**Claim flawed: Low shared environment ≠ unchangeable trait (e.g., schools may lift all boats equally).**"  
  **Proceed if**: Claim avoids this error (e.g., focuses on heritability only).

  ---

  #### **Step 6: Check for gene-environment (GE) interplay**  
  **Ask**: Does the claim ignore GE correlation/interaction?  
  **Red flags**:  
  - Ignores that heritability can rise due to **more equal environments** (e.g., better schools reduce environmental variance, making genes *relatively* more important).  
  - Treats genes/environments as additive (not multiplicative).  
  **Stop here if**:  
  - 🚩 Claim uses rising heritability to dismiss environmental causes (e.g., "heritability increased, so environment weakened") → "**Claim flawed: Rising heritability often signals more uniform environments, not less impact.**"  
  - ⚖️ GE issues unaddressed → "**Judgment call: GE effects likely; claim oversimplifies.**"  
  **Proceed if**: Claim is limited to narrow interpretation.

  ---

  #### **Step 7: Sample size and confidence**  
  **Ask**: Is the sample size credible? (N < 500 for twin studies → high error risk).  
  **Stop here if**:  
  - 🚩 N < 100 → "**Claim flawed: Sample too small for reliable estimate.**"  
  - ⚠️ N unknown → "**Insufficient info: Demand sample size.**"  
  **Proceed if**: N > 500 (or N not found but claim seems otherwise sound).

  ---

  #### **Final Output**  
  - If all steps passed → ✅ **Claim holds as stated**.  
  - If ⚠️/⚖️ steps → **Flag uncertainty** and demand missing info.  

  **When data is missing**: Default to 🚩 or ⚠️. Never guess.  
  **Critical reminder**: Heritability ≠ destiny. High h² doesn’t preclude interventions (e.g., PKU is 100% heritable but treatable).

  ---

  ### **Procedure in Action: Three Cases**
  #### **Case 1: "IQ heritability is 60-80%, so extra school funding can't help poor kids"**  
  - Step 1: Number/design OK (e.g., "60-80%", twin study).  
  - Step 2: 🚩 **FLAW** → Study likely used mixed/wealthy population, not poor kids. Heritability often *lower* in low-SES groups (environments matter more).  
  - **Verdict**: 🚩 Claim flawed. Stop at Step 2.  
  **Quote-ready**: "Heritability estimates from advantaged groups don’t apply to under-resourced populations, where environments often have larger effects."

  ---

  #### **Case 2: "Rising BMI heritability shows obesity epidemic is environmental"**  
  - Step 1: Number/design OK (e.g., "heritability rose from 40% to 60%", twin studies).  
  - Step 3: OK (within-group claim).  
  - Step 6: 🚩 **FLAW** → Claim confuses cause. Rising heritability typically means environments *standardized* (e.g., fast food everywhere), so genes explain more variation. But the *mean increase* (epidemic) is environmental. Claim is backwards: rising h² suggests environments became *more equal*, not worse.  
  - **Verdict**: 🚩 Claim flawed. Stop at Step 6.  
  **Quote-ready**: "Rising heritability implies environmental differences *decreased*, making genes more visible. It doesn’t explain why obesity rose—that’s likely from environment-wide shifts (e.g., food systems)."

  ---

  #### **Case 3: "Low shared environment (c²) for adult outcomes means school quality doesn’t matter"**  
  - Step 1: Number/design OK (e.g., "c² ≈ 0", district twin study).  
  - Step 2: OK (population matches).  
  - Step 4: ⚖️ **JUDGMENT CALL** → Twin studies assume EEA (if school quality affects identical twins similarly). Unclear if tested.  
  - Step 5: 🚩 **FLAW** → Claim misinterprets c² ≈ 0. Low shared environment means:  
    - School differences were too small to matter (as stated), or  
    - Effects faded by adulthood, or  
    - Gene-environment correlations (rGE) masked school impacts.  
    **Does not mean** "school quality doesn’t matter"—it could lift all students equally.  
  - **Verdict**: 🚩 Claim flawed. Stop at Step 5.  
  **Quote-ready**: "Low shared environment only means existing school differences didn’t cause outcome variation. It doesn’t prove schools are ineffective—uniformly better schools could raise outcomes for all."

  ---

  ### **The Procedure’s Blind Spots**  
  1. **False comfort zone**:  
     - Passing all steps doesn’t prove the claim **true**—it just means no fatal flaws. Heritability estimates are noisy and context-bound.  
     - Example: Case 3 passes Step 2 (population match) but still fails later.  
  2. **Moved problems, not solved**:  
     - Step 4 (design assumptions) flags issues like EEA but **can’t resolve them** without expert input. You’ve only shifted from "is this true?" to "is this assumption plausible?"  
  3. **Can’t handle**:  
     - Gene-environment interactions (GxE) without raw data.  
     - Claims relying on unidentified subgroups (e.g., "genetics explains everything for Group X").  
     - Polygenic scores or GWAS specifics without statistical training.  
  4. **What it won’t do**:  
     - **Absolve ideology**: The procedure may validate claims you dislike (e.g., high adult IQ heritability) if they pass all checks. You must accept that.  
     - **Replace nuance**: It flags oversimplifications but can’t generate correct interpretations. Use it to challenge claims, not endorse them.

  ---

  ### **The Claim That Passes (But You’ll Hate It)**  
  **Case 2 modified**: "Rising BMI heritability suggests environments became more uniform, which may have *enabled* the obesity epidemic by letting genetic risks express fully."  
  - This passes all steps:  
    - Step 1: Numbers/design OK.  
    - Step 2: Population matches.  
    - Step 3: Within-group claim.  
    - Step 6: Correctly interprets rising h² (standardized environments).  
  - **Why you hate it**: It implies genetics "drove" the epidemic (politically unwelcome), but the logic holds. The procedure can’t reject it without better evidence.  
  **Your move**: Demand proof that environmental variance *actually decreased* (Step 6 judgment call), or attack the policy implication (outside the procedure’s scope).  

  **Tool recommendation**: Keep this flowchart on hand. For ambiguous cases, say: "Heritability estimates require context we lack. Cite the original study, or we can’t assess." No one wins a heritability debate in an afternoon.
