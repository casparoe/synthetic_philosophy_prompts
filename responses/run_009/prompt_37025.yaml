   Quiz:

   Title: What do you actually think about benefit conditionality?

   Instructions: For each scenario, choose the option that best reflects your view.

   Questions:

   1. A claimant misses a mandatory Jobcentre appointment because their bus was delayed by a road accident. They have a good record of attendance and were on time for previous appointments. Should a sanction be applied?
      a) Yes, because rules must be enforced consistently to maintain the system's integrity.
      b) No, because the claimant had a valid reason and it wasn't their fault.
      c) Yes, but with a reduced sanction duration given the circumstances.

   2. A lone parent with two young children is offered a job that requires working shifts that do not align with available childcare. They decline the job offer. Should they be sanctioned for not taking 'suitable' work?
      a) Yes, because everyone must be available for work and the parent should arrange childcare.
      b) No, because the job was not suitable due to the childcare conflict.
      c) Yes, but the system should also provide better childcare support to prevent such conflicts.

   3. A man, now 45, has not worked since age 25. He lived frugally on a small inheritance which is now running out. He applies for Universal Credit. How should his claim be handled?
      a) He should receive support without any work-related conditions because he is in genuine need now.
      b) He should be required to participate in work-related activities as a condition for receiving support, given his long period without work.
      c) He should be supported but with a requirement to engage in voluntary work or community activities to build skills.

   4. A claimant receives a redundancy payment and does not declare it, so continues to receive benefits. The savings would have made them ineligible for a period. They are caught. What should happen?
      a) They should repay the overpayment and face a penalty as a deterrent to fraud.
      b) They should repay the overpayment but no penalty because they were in need and the system is complex.
      c) They should not have to repay because the money was spent on essential living costs and they were in genuine need.

   5. A claimant is assessed as fit for work by the DWP's assessment provider, but you (as a practitioner) believe they have a severe condition that makes them unable to work. What do you do?
      a) Accept the assessment result because we must respect the official process to maintain consistency.
      b) Advise the claimant to appeal and support them through the process, because the assessment is clearly wrong.
      c) Explore with the claimant whether they might be capable of some work with adjustments.

   6. Imagine that benefit fraud is found to be extremely rare, say only 0.1% of claims. Would this change your view about the necessity of conditionality and monitoring?
      a) No, because conditionality is about more than fraud; it's about ensuring contributions and encouraging self-reliance.
      b) Yes, because the main justification for conditionality is preventing fraud, so if fraud is rare, conditionality should be relaxed.
      c) It would depend on other factors, such as the cost of monitoring versus the benefits.

   7. [Gateway condition] A claimant is required to attend a two-week training course as a condition of starting to receive Universal Credit. They miss the first day because their child was sick. What should happen?
      a) They should be denied the benefit because they failed to meet the initial condition.
      b) They should be allowed to start the benefit but required to make up the missed session.
      c) They should be allowed to start the benefit without any further requirement because the reason was valid.

   8. [Continuing condition] A claimant has been receiving Universal Credit for six months. They are required to attend a two-week training course to continue receiving the benefit. They miss the first day because their child was sick. What should happen?
      a) Their benefit should be stopped because they failed to meet the continuing condition.
      b) They should continue to receive the benefit but be required to make up the missed session.
      c) They should continue to receive the benefit without any further requirement because the reason was valid.

   9. A claimant is required to look for work but instead spends 30 hours a week volunteering at a local charity. They argue that this is contributing to society and building skills. Is this acceptable?
      a) Yes, because the claimant is contributing to society and gaining experience.
      b) No, because they must be available for paid work and actively seeking it.
      c) It is acceptable only if the volunteering is part of an agreed work preparation plan.

   10. A claimant refuses a job offer that pays the minimum wage but less than their previous job. They argue that the pay is too low to cover their rent and basic expenses. Is their refusal reasonable?
       a) Yes, because the job does not provide a liveable income.
       b) No, because any job is better than none and they can top up with benefits.
       c) The refusal is reasonable only if they can show they are actively seeking better-paid work.

   Scoring Key:

   We will create a table that maps each answer to its implications for the branches. Then, we aggregate.

   Branch A: Does responsibility for one's need matter as a basis for differential treatment? (Y/N)
     - If the answer tends to hold individuals responsible for their actions that lead to need (like missing appointments, refusing work) and supports differential treatment (e.g., sanctions) because of that responsibility, then Y.
     - If the answer tends to excuse the individual (because of circumstances) and opposes differential treatment on the basis of responsibility, then N.

   Branch B: Is there a duty to contribute to society owed to fellow citizens as such? (Y/N)
     - Y: if the answer implies that there is a duty to work or contribute regardless of whether one is drawing benefits.
     - N: if the duty only arises when one is drawing benefits, or if there is no such duty.

   Branch C: Are sanctions justified paternalistically (to help the claimant)? 
     - 1: Yes (paternalistic)
     - 0: No (they are justified by desert, deterrence, or rule-based reasons)

   Branch D: Do the expressive and stigmatising effects of conditionality count as a cost even when effective? 
     - Y: if the answer shows concern about stigma or negative effects on the claimant's dignity even if the conditionality works to change behavior.
     - N: if the answer ignores stigma or sees it as an acceptable cost for effectiveness.

   However, branch D might be harder to infer from the given questions. We might not have enough questions to capture branch D.

   Given the time, we will focus on branches A, B, and C, and note branch D where we can.

