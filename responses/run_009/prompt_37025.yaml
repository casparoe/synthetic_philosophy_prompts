      We need two questions that are identical except for the condition being gateway or continuing.

      Let's create a scenario about attending a training course.

      Gateway version (7): 
        Scenario: A claimant is required to attend a two-week training course as a condition of starting to receive Universal Credit. They miss the first day because their child was sick. 
        Options:
          a) They should be denied the benefit because they failed to meet the initial condition.
          b) They should be allowed to start the benefit but required to make up the missed session.
          c) They should be allowed to start the benefit without any further requirement because the reason was valid.

      Continuing version (8):
        Scenario: A claimant has been receiving Universal Credit for six months. They are required to attend a two-week training course to continue receiving the benefit. They miss the first day because their child was sick.
        Options (same as above, but for continuing benefit):
          a) Their benefit should be stopped because they failed to meet the continuing condition.
          b) They should continue to receive the benefit but be required to make up the missed session.
          c) They should continue to receive the benefit without any further requirement because the reason was valid.

      This pair will reveal if the respondent treats gateway and continuing conditions differently.

   9. Additional question to make 8-10: We have 8 so far (including the pair as two). Let's add one more to make 9.

      We can have a question about volunteering vs. paid work.

      Scenario: A claimant is required to look for work but instead spends 30 hours a week volunteering at a local charity. They argue that this is contributing to society and building skills. 
      Options:
        a) This is acceptable because the claimant is contributing to society and gaining experience.
        b) This is not acceptable because they must be available for paid work and actively seeking it.
        c) It is acceptable only if the volunteering is part of an agreed work preparation plan.

      This probes:
        - Branch B: Duty to contribute? (Is volunteering a valid form of contribution? Or must it be paid work to count?)

   10. Let's add a tenth question about a claimant who refuses a job due to low pay.

      Scenario: A claimant refuses a job offer that pays the minimum wage but less than their previous job. They argue that the pay is too low to cover their rent and basic expenses.
      Options:
        a) The refusal is reasonable because the job does not provide a liveable income.
        b) The refusal is not reasonable because any job is better than none and they can top up with benefits.
        c) The refusal is reasonable only if they can show they are actively seeking better-paid work.

      This probes:
        - Branch A: Responsibility? (Is the claimant responsible for their need if they turn down a job? Or is the system responsible for ensuring jobs are adequate?)

