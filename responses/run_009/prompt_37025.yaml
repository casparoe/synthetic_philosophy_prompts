  We are creating a diagnostic quiz for practitioners in the UK welfare system. The goal is to sort respondents based on their reactions to concrete cases, without using political philosophy labels directly. The quiz must include specific cases and probe underlying principles without asking directly about beliefs in the undeserving poor or support for workfare.

   The quiz will have 8-10 questions. Each question is a concrete case with 2-3 answer options. We must include:
    1. Claimant sanctioned for missing an appointment because the bus ran late.
    2. Lone parent who declines a job offer because the shift pattern makes childcare impossible.
    3. Man who has not worked since age 25 and lives frugally on a small inheritance, now facing hardship.
    4. Claimant who underdeclares savings from a redundancy payment.
    5. Disability assessment the respondent believes has produced the wrong verdict.

   Additionally, we need one question that probes whether support for conditionality is hostage to fraud rates.

   We are also asked to build the scoring key from the logical space of four branching commitments:
    A. Whether responsibility for one's need is the right basis for differential treatment.
    B. Whether a duty to contribute is owed to fellow citizens as such, or only arises once one starts drawing on their taxes.
    C. Whether sanctions can be justified paternalistically (as helping claimants) rather than as desert.
    D. Whether the expressive and stigmatising effects of conditionality count as a cost even when behaviourally effective.

   The leaves (positions) we are to map to are:
    1. Desert-based conditionality (luck-egalitarian)
    2. Reciprocity-based duty-to-work
    3. Social-citizenship entitlement (need alone triggers support)
    4. Sufficientarian case for unconditional basic income
    5. Paternalistic-utilitarian workfare
    6. Libertarian residual safety net

   We must also note when a combination of answers leaves a leaf unoccupied and whether that view is incoherent, unattractive, or unexplored. And we must flag if two leaves cannot be separated.

   Additionally, we are to include at least two questions that are identical except for being a gateway condition vs. a continuing condition, and have the key report whether the respondent treats them alike.

   Steps:
    - Design 8-10 questions (cases) with answer options.
    - Each answer option will correspond to a position on one or more of the branching commitments.
    - We will design the scoring key so that each answer choice contributes to determining the respondent's stance on the four branches (A, B, C, D) and also notes the gateway/continuing distinction.

   However, note that the branching commitments are abstract and the cases are concrete. We must map the concrete answers to the abstract branches.

   Approach for each question:
    - We will design the answer options to force a choice that reveals the respondent's stance on one or more of the branches.

   We are also to have two questions that are identical except for being gateway vs. continuing condition. We can do this by having a pair of questions that have the same scenario but one is about initial access (gateway) and the other about ongoing support (continuing).

   Let's design the questions:

   1. Question: Bus ran late (sanction for missed appointment)
      Scenario: A claimant misses a mandatory Jobcentre appointment because their bus was delayed by a road accident. They have a good record of attendance and were on time for previous appointments. The decision is whether to impose a sanction (stop their benefit for a period).
      Options:
        a) Sanction should be applied because rules must be enforced consistently to maintain the system's integrity.
        b) Sanction should not be applied because the claimant had a valid reason and it wasn't their fault.
        c) Sanction should be applied but with a shorter duration given the circumstances.

      This question probes:
        - Branch A: Does responsibility matter? (b option says no because not at fault)
        - Branch C: Is the sanction justified as desert? (a and c are desert-based, but a is strict and c is mitigated desert) OR might it be seen as paternalistic? (probably not, because it's about enforcing rules for the system)
        - Also, note that this is a continuing condition (ongoing requirement).

   2. Question: Lone parent and childcare (declines job offer)
      Scenario: A lone parent with two young children is offered a job that requires working shifts that do not align with available childcare. They decline the job offer and risk a sanction for not taking 'suitable' work.
      Options:
        a) Sanction is appropriate because everyone must be available for work and the parent should arrange childcare.
        b) Sanction is not appropriate because the job was not suitable due to the childcare conflict.
        c) Sanction is appropriate but the system should help with childcare costs to prevent such conflicts in future.

      This probes:
        - Branch A: Responsibility for need? (The parent is responsible for arranging childcare? If they don't, are they responsible for their need? Option a says yes, b says no.)
        - Also, branch C: Paternalism? (c option suggests the system should help, which might be paternalistic or might be about enabling work)

   3. Question: Man living on inheritance (now facing hardship)
      Scenario: A man, now 45, has not worked since age 25. He lived frugally on a small inheritance which is now running out. He applies for Universal Credit but has no recent work history.
      Options:
        a) He should receive support without conditionality because he is in genuine need now.
        b) He should be required to participate in work-related activities as a condition for receiving support, given his long period without work.
        c) He should be supported but with a requirement to engage in voluntary work or community activities to build skills.

      This probes:
        - Branch A: Responsibility for need? (He chose not to work? Option b and c say he has a duty to contribute now, even though he was previously self-reliant.)
        - Branch B: Duty to contribute? (Is there a duty to contribute to society even if one hasn't drawn on taxes? He hasn't until now. Option a says no duty because he hasn't drawn, b and c say there is a duty.)

   4. Question: Underdeclared savings
      Scenario: A claimant receives a redundancy payment and does not declare it, so continues to receive benefits. The savings would have made them ineligible for a period. They are caught and face repaying the overpayment and possibly a penalty.
      Options:
        a) The claimant should repay the overpayment and face a penalty as a deterrent to fraud.
        b) The claimant should repay the overpayment but no penalty because they were in need and the system is complex.
        c) The claimant should not have to repay because the money was spent on essential living costs and they were in genuine need.

      This probes:
        - Branch A: Responsibility? (The claimant is responsible for fraud? Option a says yes, b and c are more lenient.)
        - Branch D: Stigmatising effects? (But not directly. We might see if they see the penalty as necessary for system integrity or if they are concerned about the impact on the claimant.)

   5. Question: Wrong disability assessment verdict
      Scenario: A claimant is assessed as fit for work by the DWP's assessment provider, but you (as a practitioner) believe they have a severe condition that makes them unable to work.
