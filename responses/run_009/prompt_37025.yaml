answer: |-
  Below is a diagnostic quiz tailored to your specifications, designed to uncover practitioners' implicit views on benefit conditionality through concrete cases. It includes 10 questions (with the mandatory cases), avoids direct philosophical labels, and incorporates the gateway/continuing conditionality distinction. The scoring key maps responses to the logical branches and identifies positions in the conceptual space.

  ---

  ### **Quiz: What Do You Actually Think About Benefit Conditionality?**  
  *Instructions: For each scenario, pick the option closest to your reaction. There are no "right" answers—this explores your practical reasoning.*  

  1. **Claimant sanctioned for a missed appointment due to a late bus**  
     A claimant with a good attendance record misses a Jobcentre appointment because their bus broke down. They reported it immediately with proof.  
     - a) Sanction stands: rules apply regardless of reasons to ensure fairness.  
     - b) Sanction waived: the delay was beyond their control and they acted responsibly.  
     - c) Sanction reduced: a partial penalty acknowledges the effort but enforces accountability.  

  2. **Lone parent declines job due to childcare conflict**  
     A lone parent turns down a retail job because shifts clash with school runs, and no affordable childcare exists. They face a sanction for "refusing work."  
     - a) Sanction applies: work must be prioritised, and parents should solve childcare.  
     - b) No sanction: the job isn’t feasible without systemic childcare support.  
     - c) Sanction applies, but Jobcentre should first help find childcare or flexible work.  

  3. **Man facing hardship after living on inheritance**  
     A 45-year-old has not worked since age 25, living frugally on a small inheritance now exhausted. He claims Universal Credit but resists job-seeking requirements.  
     - a) Support granted unconditionally: need is the only relevant factor.  
     - b) Conditionality imposed: everyone capable must contribute to society.  
     - c) Support given but with voluntary work mandates: "giving back" matters.  

  4. **Claimant underdeclares redundancy savings**  
     A claimant receives a £10k redundancy payout, spends half on debts, but hides the rest to keep receiving benefits. They are caught.  
     - a) Penalise fully: fraud undermines the system and must be deterred.  
     - b) Reclaim overpayments gently: they were in genuine need, and the system is complex.  
     - c) No penalty: the money addressed essential needs, so no harm was intended.  

  5. **Disability assessment with a disputed "fit for work" verdict**  
     You believe a claimant with chronic pain was wrongly assessed as "fit for work" by the DWP’s contractor. They risk losing benefits.  
     - a) Accept the outcome: assessments are imperfect but necessary for consistency.  
     - b) Challenge the verdict: an error causing harm must be corrected.  
     - c) Compromise: conditionally extend support while exploring "light-touch" work options.  

  6. **Fraud rarity and conditionality**  
     Imagine evidence shows benefit fraud occurs in just 0.3% of claims (far lower than public estimates). Does this affect your support for conditionality?  
     - a) No: conditionality ensures contribution and responsibility, beyond fraud prevention.  
     - b) Yes: if fraud is minimal, intrusive monitoring or sanctions become disproportionate.  
     - c) It depends: cost, behavioural effects, or moral symbolism matter more than fraud rates.  

  7. **Gateway condition: Training requirement to START benefits**  
     A claimant must complete a CV workshop to receive their first Universal Credit payment. They miss it due to a hospital visit.  
     - a) Deny benefits: gateway conditions are essential to set expectations.  
     - b) Grant benefits but require a makeup session: flexibility avoids unfair exclusion.  
     - c) Grant benefits unconditionally: emergencies shouldn’t block initial support.  

  8. **Continuing condition: Training requirement to KEEP benefits**  
     *Same as Q7*, but the claimant has received benefits for 4 months and misses a mandated refresher workshop due to a hospital visit.  
     - a) Stop benefits: ongoing compliance is non-negotiable.  
     - b) Continue benefits but require a makeup session: consistency matters, but with leeway.  
     - c) Continue benefits unconditionally: emergencies shouldn’t punish existing claimants.  

  9. **Volunteering vs. job-seeking**  
     A claimant spends 30 hours/week volunteering at a food bank but doesn’t apply for paid jobs, arguing they’re "contributing to society."  
     - a) Impose conditionality: paid work is the primary obligation.  
     - b) Accept volunteering: contribution isn’t solely economic.  
     - c) Compromise: count volunteering if paired with part-time job searches.  

  10. **Refusing a low-wage job**  
     A claimant declines a zero-hours contract paying minimum wage, as it wouldn’t cover rent. They’re sanctioned for "refusing suitable work."  
     - a) Sanction justified: any work is better than none, and benefits top up wages.  
     - b) Sanction unjustified: "suitable work" must provide a liveable income.  
     - c) Context matters: sanction only if better options exist locally.  

  ---

  ### **Scoring Key**  
  *How to interpret responses: Map answers to the four branches, then assign positions. Use the table below.*  

  **Branch Definitions**  
  - **A. Responsibility for need**: Should personal responsibility for hardship affect support? (*Y/N*)  
  - **B. Duty to contribute**: Is there a pre-existing duty to society (regardless of receiving benefits), or only once drawing support? (*Duty exists pre-support / Duty only when drawing*)  
  - **C. Sanction justification**: Are sanctions primarily to "help" claimants (paternalistic) or enforce desert/deterrence? (*Paternalistic / Desert*)  
  - **D. Stigma costs**: Do stigma/expressive harms of conditionality matter, even if effective? (*Y/N*)  

  **Question-to-Branch Mapping**  
  | Q# | Scenario                  | Option a                          | Option b                          | Option c                          |  
  |----|---------------------------|-----------------------------------|-----------------------------------|-----------------------------------|  
  | 1  | Bus late (continuing)     | A: Y, C: Desert                  | A: N                              | A: Y, C: Desert (mitigated)      |  
  | 2  | Childcare conflict        | A: Y, C: Desert                  | A: N                              | A: Y, C: Paternalistic           |  
  | 3  | Inheritance hardship      | A: N                             | A: Y, B: Duty exists pre-support  | A: Y, B: Duty exists pre-support |  
  | 4  | Underdeclared savings     | A: Y, C: Desert                  | A: Y (mitigated)                 | A: N                             |  
  | 5  | Wrong disability verdict  | D: N                             | D: Y                             | C: Paternalistic                 |  
  | 6  | Fraud rarity              | B: Duty exists pre-support       | B: Duty only when drawing        | (Contextual)*                    |  
  | 7  | Gateway training          | (Gateway strictness)**           | (Gateway flexibility)**           | (Gateway leniency)**             |  
  | 8  | Continuing training       | (Continuing strictness)**        | (Continuing flexibility)**        | (Continuing leniency)**          |  
  | 9  | Volunteering              | B: Duty exists pre-support       | B: Duty only when drawing        | B: Duty exists pre-support       |  
  | 10 | Refusing low-wage job     | A: Y, C: Desert                  | A: N                             | A: Y (contextual)                |  

  \* *Q6c is non-diagnostic for branches but reveals if views are consequentialist.*  
  \*\* *For Q7–8, compare answers: If identical, gateway/continuing treated alike; if divergent, treated differently.*  

  **Position Mapping (Leaves)**  
  Aggregate branch responses to identify positions:  
  | Position                          | Key Branch Indicators                             | Notes                                                                 |  
  |-----------------------------------|--------------------------------------------------|-----------------------------------------------------------------------|  
  | **Desert-based conditionality**   | A: Y, C: Desert, B: Duty exists pre-support      | Emphasizes responsibility; sanctions as just deserts.                 |  
  | **Reciprocity duty-to-work**      | A: Y, B: Duty exists pre-support, C: Desert      | Work as moral duty to society, regardless of need.                    |  
  | **Social-citizenship entitlement**| A: N, B: Duty only when drawing (or irrelevant) | Need alone triggers support; conditionality illegitimate.             |  
  | **Sufficientarian basic income**  | A: N, D: Y (stigma salient)                     | Unconditional floor; stigma harms outweigh efficacy.                  |  
  | **Paternalistic workfare**        | C: Paternalistic, B: Duty exists pre-support    | Sanctions "help" claimants adapt; work as therapy/social good.       |  
  | **Libertarian safety net**        | A: Y, B: Duty only when drawing                 | Support only for "irresponsible" poor; no pre-existing societal duty.|  

  **Gaps and Ambiguities**  
  - **Unoccupied view**: *A: Y + C: Paternalistic + D: Y* (e.g., "tough love" that acknowledges stigma). Not incoherent but rare/unexplored in practice.  
  - **Blurred leaves**:  
    - *Social-citizenship vs. Basic income*: Both reject responsibility (A: N) and support unconditionality. Cannot distinguish without probing universality (addressed in Q6–Q9 via duty logic).  
    - *Reciprocity vs. Desert*: Often overlap (A: Y, C: Desert, B: Duty exists). Separated by Q3b/c: Reciprocity emphasizes *contributing* (Q3c voluntary work), Desert focuses *blame* (Q3b "should have worked").  
  - **Gateway/continuing axis**: Report if Q7 and Q8 answers diverge (e.g., strict on gateway but lenient on continuing). This cuts across all positions.  

  **How to Use**  
  1. Tally dominant branch responses (e.g., 7/10 answers indicate A: Y).  
  2. Assign primary position (leaf) based on aggregate branches.  
  3. Note gateway/continuing treatment (alike or divergent).  
  4. Flag inconsistencies (e.g., rejects responsibility in Q2 but affirms it in Q10).  

  This key avoids internet dependence, uses UK terminology, and prioritises concrete cases over labels—ideal for prompting reflection in your seminar. Practitioners’ "inconsistent" views often reveal nuanced, context-driven ethics that abstract surveys miss.
