      Options:
        a) No, because conditionality is about more than fraud; it's about ensuring contributions and encouraging self-reliance.
        b) Yes, because the main justification for conditionality is preventing fraud, so if fraud is rare, conditionality should be relaxed.
        c) It would depend on other factors, such as the cost of monitoring versus the benefits.

      This directly probes whether support for conditionality is hostage to fraud rates.

