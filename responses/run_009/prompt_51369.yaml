prompt: |-
  I need some help diagnosing a dispute that's stalled our school board, because at this point we're just going in circles. Context: my kids go to a small bilingual school and I recently got elected to its board (parents can stand, long story). For the last six months we've been deadlocked over a proposed "community charter": things like expecting families to attend a couple of shared festivals a year, a strong norm of volunteering for school events, and formally recognizing the founding families' language in school ceremonies. One faction, call them the liberals, says the school is a service provider: it should coordinate neutrally and let each family decide how much of the "shared life" they want. Making participation a matter of expectation, even soft expectation, is a kind of soft coercion and it's none of the school's business. The other faction says that's a fantasy: a school like ours only works because people actually show up and pass the language and the rituals on, so the shared life isn't an optional extra, it's the precondition, and a charter just makes the implicit explicit. Both sides agree on every fact we've looked at (who attends, what the volunteer numbers are, what similar schools did); nobody has moved an inch.

  While digging into this I realized we're basically re-enacting the big communitarianism vs. liberalism fight from the 80s and 90s, at a tiny scale. I've been reading around it: Sandel's critique of the "unencumbered self", Walzer on how different goods belong to different spheres, MacIntyre on traditions carrying reasons, and the liberal replies, like Kymlicka's point that a liberal culture is itself a culture that has to be reproduced, plus his distinction between a community you can exit and a cultural structure you can't just leave behind without cost. My working hypothesis is that the two factions on our board aren't disagreeing about facts or even about values exactly, but are answering two different questions under one heading — one side is answering a question about legitimacy (what may an institution demand?), the other a question about flourishing (what does this institution need to survive?) — and our deadlock comes from each side treating its question as the only one on the table. But I might be wrong; maybe there's a real value conflict underneath, or maybe it's partly verbal, hinging on what people mean by "community" in the first place. Either way I'd like a diagnosis of the structure of the disagreement, using what each side actually says, rather than a verdict on who's right or a list of books to read.

  Since I'll be pasting this into my notes, please give me the diagnosis in JSON with this schema: an object with fields "disagreement_type" (your classification — verbal, substantive, bedrock intuitions, different-questions-under-one-heading, or a mix, with a one-paragraph justification), "side_a_steelmanned" and "side_b_steelmanned" (the strongest version of each board faction's position, a few sentences each), "hidden_crux" (the single underlying question, if any, that's actually doing the work in our dispute), "hypothesis_assessment" (whether my different-questions hypothesis holds up, and what it gets wrong), "what_would_count_as_progress" (the most concrete thing — a distinction we could adopt, a reframing of the charter proposal, a specific question we should put to the board — that could actually unstick us), and "generalizes" (a short note on whether the same diagnosis applies to the academic debate or whether the school version differs in some way that matters). Put the JSON up front, then add a few paragraphs of prose after it walking me through your reasoning. Thanks — our next board meeting is in three weeks and I'd like to walk in with something better than "we clearly just disagree."
reasoning: |-
  We are given a dispute in a school board over a "community charter" that includes expectations for family participation in school events and recognition of the founding language. The two factions are:
   - The "liberals": view the school as a service provider that should remain neutral and let families decide their level of involvement. They see expectations as soft coercion and beyond the school's role.
   - The other faction (call them the "communitarians"): argue that the shared life and participation are preconditions for the school's success, especially for a bilingual school, and making the implicit norms explicit via a charter is necessary.

   The user has a hypothesis: the two factions are answering two different questions (legitimacy vs. flourishing) and the deadlock arises because each side treats its question as the only one.

   We are to provide a diagnosis in a specific JSON format and then a prose explanation.

   JSON schema:
   {
     "disagreement_type": string (classification with one-paragraph justification),
     "side_a_steelmanned": string (strongest version of the liberals' position, a few sentences),
     "side_b_steelmanned": string (strongest version of the communitarians' position, a few sentences),
     "hidden_crux": string (the single underlying question that's actually doing the work, if any),
     "hypothesis_assessment": string (evaluate the user's hypothesis and note what it gets wrong),
     "what_would_count_as_progress": string (the most concrete thing that could unstick the board),
     "generalizes": string (a short note on whether the same diagnosis applies to the academic debate or if the school context matters)
   }

   Then, after the JSON, a few paragraphs of prose.

   Let's break it down:

   1. Disagreement type: 
      We are to choose among: verbal, substantive, bedrock intuitions, different-questions-under-one-heading, or a mix.
      The user suggests it might be different-questions-under-one-heading (legitimacy vs. flourishing). 
      However, note that the user also says: "maybe there's a real value conflict underneath, or maybe it's partly verbal".
      After reading the positions, it seems there is a substantive disagreement about the role of the school and the nature of community, but the way the question is framed (as one question) might be causing the deadlock.

      Let's classify: It is a mix of "different-questions-under-one-heading" and "substantive" (because there are underlying values at stake). But the deadlock is primarily because they are not recognizing that they are addressing two distinct but valid concerns.

      Justification: The liberals are focusing on individual autonomy and the right to non-interference, which is a question of legitimacy (what the school may demand). The communitarians are focusing on the conditions necessary for the school to function and thrive, which is a question of flourishing. However, there is also a substantive value conflict about the importance of community bonds versus individual choice.

   2. Steelmanning each side:

      Side A (liberals): 
          The school, as an institution serving diverse families, must respect the autonomy of each family to define their own level of engagement. Imposing expectations, even soft ones, infringes on individual liberty and may alienate families who have different capacities or preferences. The school's role should be limited to providing education and facilitating opportunities for community involvement without any form of pressure, because the school is not a community regulator but a service provider.

      Side B (communitarians):
          A bilingual school is not just a service but a cultural project that requires active participation to sustain the language and traditions. Without a critical mass of families contributing time and participating in shared rituals, the school's unique mission and identity will erode. The charter is not about coercion but about clarifying the mutual expectations that are already necessary for the school's survival, and it ensures fairness by making these expectations transparent so that no family free-rides on the efforts of others.

   3. Hidden crux: 
          The underlying question might be: "What is the fundamental nature of the school: is it primarily a service provider or a community project?" or "How do we balance individual autonomy with the collective needs of the school community?"

      But the user's hypothesis is that it's two questions: legitimacy (what the school may demand) and flourishing (what the school needs). So we can frame the hidden crux as the conflation of these two distinct questions.

   4. Hypothesis assessment:
          The user's hypothesis holds up well: the two sides are indeed addressing two different questions (legitimacy vs. flourishing). However, it gets wrong that there is an underlying value conflict that cannot be entirely resolved by separating the questions. Even if we separate them, we still have to decide how much weight to give to each. Also, the communitarians might argue that without the flourishing condition, the school as a service provider wouldn't exist in its current form.

   5. What would count as progress:
          A concrete step: Reframe the charter proposal to explicitly distinguish between (a) the core educational services that are provided without condition and (b) the community-building activities that are vital for the school's special character, and then design the expectations around (b) in a way that is transparent, flexible, and with clear opt-out mechanisms (for legitimate reasons) to respect individual circumstances. Alternatively, present the two questions separately to the board and ask each side to acknowledge the validity of the other's question and then work on a compromise that addresses both.

          More concretely: Propose a board discussion that first asks: "What are the minimum conditions for the school to thrive as a bilingual community?" and then separately: "What are the limits on what the school can require of families?" Then, with both answers on the table, design the charter accordingly.

   6. Generalizes:
          This diagnosis does generalize to the academic debate between liberalism and communitarianism, which often pits individual rights against the common good. However, in the school context, the stakes are more immediate and tangible (the survival of a specific institution) and there is a pre-existing voluntary commitment (families chose this school). This might make the communitarian argument stronger in practice because the school's unique mission is the reason families chose it. Also, the school context allows for more flexibility and compromise than abstract philosophical debates.

   Now, let's write the JSON.

   Note: We are to put the JSON up front, then the prose.

   The prose will walk through the reasoning.

   Let me construct the JSON.
