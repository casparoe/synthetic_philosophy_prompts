  ### Reasoning Walkthrough  
  Your diagnosis perceptively identifies the key dynamic: **two valid questions being treated as mutually exclusive**. The legitimacy/flourishing framing explains why both sides feel the other "misses the point." Side A (liberals) rightly notes that converting social participation into institutional expectations alters power dynamics—what was freely given becomes owed. Side B (communitarians) correctly observes that bilingualism requires cultural reinforcement beyond textbooks. Where your hypothesis needs refinement is in recognizing that these positions stem from **bedrock intuitions about corrosion**: Side A fears institutional power creep; Side B fears cultural entropy. These aren't just different questions but different alarms ringing.

  The **verbal ambiguity** around "community" fuels confusion. For Side A, "community" implies voluntary association; for Side B, it denotes inherited tradition. This explains why Side B views the charter as merely "explicating" what exists, while Side A sees it as "inventing" new obligations. Similarly, "volunteering" means uncompensated labor to Side A but social reciprocity to Side B.

  Your hidden crux—**enforcement versus organic participation**—gets to the heart of why facts don't resolve this. Both sides agree on attendance numbers but interpret them differently: low turnout proves coercion is unnecessary (Side A) or proves norms must be strengthened (Side B). This is where the academic parallels diverge: MacIntyre and Sandel debate abstract goods, but your board must answer, "Will this *specific* policy increase resentment or engagement?"

  **Progress requires decoupling the questions**. The two-document proposal forces legitimacy discussions (what *must* you do) and flourishing discussions (what *should* you do) onto separate tracks. If this fails, surveying families could reveal whether the "implicit contract" Side B claims actually exists—making the dispute empirical rather than ideological. Crucially, frame the next discussion around trade-offs: "If we adopt no charter, how do we address volunteer shortages? If we adopt one, how do we protect dissenters?" This shifts from "whether" to "how," bypassing the current stalemate.  

  Unlike philosophical debates, your context allows for compromise: the school's small size and voluntary enrollment make tailored solutions feasible. Focus on distinguishing *core* from *aspirational* commitments—and watch for whether objections center on practical burden (fixable) or principled opposition (bedrock). Your goal isn't to "win" but to expose the shared investment in the school's survival that both sides ultimately hold.
