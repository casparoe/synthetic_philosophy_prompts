  Below is an 8-question quiz designed to reveal participants' underlying theories of vagueness without naming any positions or philosophers. Each question presents a concrete case or forced choice with 2–3 answer options. The scoring key maps answer patterns to seven theories of vagueness, notes indistinguishable pairs, and flags inconsistent/incoherent patterns.

  ---

  ### **Quiz: What’s Your Theory of Vagueness?**  
  *Answer based on your immediate intuition—no philosophy background needed!*

  1. **The Sand Pile**  
     You start with 10,000 grains of sand (clearly a heap). You remove one grain at a time. After removing many grains, you end up with 1 grain (clearly not a heap). Is there a *single grain* whose removal turns the pile from a heap to a non-heap?  
     - A) Yes, there must be one specific grain that flips it.  
     - B) No, it’s impossible to pick one grain—the concept is fuzzy.  

  2. **Gary’s Baldness (Part 1)**  
     Gary has some hair but is visibly thinning. What about the statement: **“Gary is bald”**?  
     - A) It’s either true or false—we just don’t know which.  
     - B) It’s neither true nor false.  
     - C) It’s partially true (e.g., 0.5 on a scale of 0 to 1).  

  3. **Gary’s Baldness (Part 2)**  
     What about the statement: **“Gary is either bald or not bald”**?  
     - A) It’s definitely true.  
     - B) It’s not definitely true (it might be false, neither, etc.).  

  4. **The Baldness Boundary**  
     Is there a *sharp line* between **definitely bald** (e.g., Kojak) and **borderline bald** (e.g., Gary)?  
     - A) Yes, there’s a precise boundary.  
     - B) No, the boundary is fuzzy too.  

  5. **The Fuzzy Boundary Problem**  
     If the boundary between “definitely bald” and “borderline bald” is fuzzy (no sharp line), does this cause an unsolvable problem?  
     - A) Yes—it creates infinite regress or contradictions.  
     - B) No—it’s just how vagueness works.  

  6. **The Mayor’s Decree**  
     A small town mayor decrees: “For local laws, ‘bald’ means having ≤ 1,000 hairs.” Before this decree, was this cutoff *already part* of the meaning of “bald”?  
     - A) Yes—it revealed the hidden precision of “bald.”  
     - B) No—it created a new rule; ordinary “bald” stays vague.  

  7. **Mountains of Vagueness**  
     Is the number of mountains on Earth vague *independently* of human language? (e.g., are there objectively “fuzzy” parts of reality?)  
     - A) Yes—the world itself is vague.  
     - B) No—vagueness is only in language/concepts.  

  8. **The Context Shift**  
     Could someone be called “bald” truthfully in one context (e.g., a comedy roast) but not in another (e.g., a medical study)?  
     - A) Yes—the meaning of “bald” depends on context.  
     - B) No—“bald” has a fixed meaning across contexts.  

  ---

  ### **Scoring Key**  
  Match your answers to the table below. If you have multiple matches, your view blends theories!  

  | **Theory**               | **Answer Pattern**                                  | **Notes** |  
  |--------------------------|-----------------------------------------------------|-----------|  
  | **Epistemicism**         | 1A, 2A, 3A, 4A, 5A, 6A, 7B, 8B                    | Sharp cutoffs exist but are unknown. Vagueness is ignorance. |  
  | **Supervaluationism**    | 1B, 2B, 3A, 4B, 5B, 6B, 7B, 8A                    | Borderline = neither T/F, but "P or not-P" is true. Context matters. |  
  | **Degree/Fuzzy Logic**   | 1B, 2C, 3B, 4B, 5B, 6B, 7A or 7B, 8A or 8B        | Truth comes in degrees (e.g., 0.5). "P or not-P" has degree <1. |  
  | **Gap Theory**           | 1B, 2B, 3B, 4B, 5B, 6B, 7B, 8B                    | Borderline = neither T/F. "P or not-P" isn’t automatically true. |  
  | **Glut Theory**          | 1B, 2B, 3B, 4B, 5B, 6B, 7B, 8B + (optional: 2C)   | Borderline = both T/F. Rare—only if you strongly intuit true contradictions. |  
  | **Contextualism**        | 8A with any *non*-epistemicist pattern            | Meaning shifts with context. Often pairs with supervaluationism or degree theory. |  
  | **Deflationary**         | 1A, 2A, 3A, 4A, 5A + *and* 6B/7B/8B + high regret | Vague predicates are incoherent. You likely sighed while taking this quiz. |  

  ---

  ### **Honest Limitations & Oddballs**  
  - **Indistinguishable Pairs**:  
    - **Gap vs. Glut**: Nearly identical patterns (both have 1B, 2B, 3B, 4B, 5B, 6B, 7B, 8B). Only differs if you chose 2C (degree) for glut—but glut is rare.  
    - **Degree vs. Contextualism**: Degree theory (2C) implies context-sensitivity (8A), but contextualism can exist without degrees.  
    - **Epistemicism vs. Deflationary**: Deflationary requires "regret" (e.g., finding 1A/2A deeply counterintuitive). Otherwise, they score as epistemicists.  

  - **Incoherent/Unmapped Patterns**:  
    - **1A + 1B-ish (e.g., “Yes, but…”)**: Inconsistent. No theory claims sharp cutoffs *and* fuzziness.  
    - **2A + 3B**: Incoherent. If "Gary is bald" is T/F, "bald or not bald" must be true.  
    - **4A + 5B**: Unstable. If boundaries are sharp (4A), fuzzy boundaries (5B) shouldn’t be acceptable.  
    - **7A + 1A/4A/6A**: Unlikely. If vagueness is in the world (7A), sharp cutoffs (1A/4A/6A) contradict it.  

  - **Who Fits Where?**  
    - **Glut (both T/F)** only appears if you insist borderline statements are contradictory (e.g., "Gary is bald" feels *both* right and wrong).  
    - **Deflationary** requires frustration with the quiz. If all answers point to epistemicism but you hate it, you’re here.  
    - **Consistent non-mappers** likely hold niche views (e.g., "vagueness is ambiguity") or resist binary choices.  

  ---

  ### **How to Use**  
  - Hand out the quiz at the start. Let people score themselves.  
  - When discussing, call out blind spots (e.g., "Gap and glut theorists, you’re in the same camp!").  
  - Deflationary folks get a free drink for their honesty.  

