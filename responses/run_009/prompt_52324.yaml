prompt: |-
  hey, so I'm an undergrad taking a seminar on social philosophy (we just did Lewis on conventions) and I also happen to sit on my university's international student orientation working group. Every year we get complaints from local restaurant staff about exchange students who don't tip, and from locals about students jaywalking on empty streets, and this year two of the exchange students pushed back in writing: one said tipping is an unjust custom that lets employers off the hook for wages, so refusing to tip is civil disobedience not rudeness; the other said nobody is harmed when he crosses a street with no cars coming, so the rule has no moral grip on him at all. Our committee now has to decide whether our orientation handbook should tell incoming students that following local conventions like tipping, queueing, and jaywalking norms is (a) merely prudential advice, (b) a genuine moral obligation they take on as guests, or (c) something in between, with maybe a list of which conventions are which.

  Pretend you're a professional philosopher specializing in conventions and social norms, and think carefully before drafting. Maybe brainstorm for a couple of paragraphs first about whether conventions generate moral obligations at all when the point of the convention is coordination rather than harm-prevention, and whether someone who never opted into the convention is bound by it. Then draft the actual memo (~600 words) for the committee: a clear recommendation for what the handbook should say, reasons the committee members could actually act on, and an honest treatment of the strongest argument from the two dissenting students — including the possibility that some of our local conventions (tipping especially) are bad ones and it matters whether a bad convention can still bind. Keep it readable for non-philosophers on the committee, dont just name-drop. Thanks!
reasoning: |-
  Okay, the user is an undergrad in a social philosophy seminar who also sits on their university's international student orientation working group. They're dealing with complaints about exchange students not tipping and jaywalking, and two students have pushed back with arguments framed as civil disobedience. The committee needs to decide how to address local conventions in the orientation handbook—whether following them is merely prudential, a moral obligation, or something in between.

  First, I need to recall David Lewis's work on conventions, which defines them as solutions to coordination problems where people conform because others do. Conventions aren't about morality per se but about predictability. For example, driving on the right side isn't inherently moral; it's practical. The challenge is when conventions intersect with morality, like tipping involving labor rights, or jaywalking affecting perceptions of safety.

  The key questions here are: Do conventions create moral obligations for newcomers who didn't opt-in? And what about bad conventions? The students' arguments have merit. Tipping can be seen as letting employers off the hook, and jaywalking with no harm might seem harmless. But there's also the host community's perspective—being a guest involves respecting local norms to maintain social harmony.

  I should consider the committee's needs. They want a practical, non-philosophical-jargon recommendation. The handbook should balance explaining the importance of conventions without being dogmatic. Highlighting that while some conventions might be flawed, respecting them initially is part of cultural integration. Also, distinguishing between coordination norms (like queuing) and those with ethical dimensions (like tipping) is crucial.

  The strongest counterarguments are the civil disobedience claim against tipping and the harm principle applied to jaywalking. Addressing these honestly means acknowledging that tipping systems can be unjust, but unilaterally not tipping harms service workers. For jaywalking, the issue isn't just harm but predictability and social trust.

  The recommendation should be option (c) - something in between. Frame conventions as having moral weight in a host-guest context due to reciprocity and harm avoidance. Provide clear categories: coordination norms (follow them), mixed norms (follow while advocating for change), and harmful norms (which might require different handling, but tipping isn't there yet). Stress practical advice for integration while encouraging dialogue on reform.

  Need to ensure the memo is readable, avoids name-dropping philosophers, and offers actionable guidance. Emphasize that the handbook should inform students about norms, explain their context, and advise respectful adherence while providing channels for constructive criticism.
answer: |-
  ## Philosopher's Memo: Orientation Handbook Guidance on Local Conventions

  **To:** International Student Orientation Working Group  
  **From:** [Your Name/Philosopher Consultant]  
  **Subject:** Recommendation for Handbook Language on Local Conventions (Tipping, Jaywalking, Queueing)  
  **Date:** October 26, 2023  

  ### Brainstorming: The Nature of Convention & Obligation
  Conventions, as coordination solutions (like driving on the right or using currency), primarily solve practical problems of predictability. Their core function isn't inherently moral; it's about enabling smooth interaction. David Lewis showed we follow them because *others* follow them, expecting mutual benefit. This raises key questions for newcomers:

  1.  **Opt-in & Obligation:** Can someone who never agreed be morally bound? Strict contractualism says "no." However, entering a community involves implicit acceptance of its basic operating system. Ignoring fundamental conventions can cause genuine harm (confusion, frustration, even accidents) and disrespects the social fabric you benefit from.
  2.  **Coordination vs. Harm:** Conventions *primarily* coordinate, but often *secondarily* prevent harm (queueing prevents chaos, traffic rules prevent accidents). Jaywalking *seems* harmless when empty, but strict adherence maintains predictability, preventing accidents when judgment fails. The harm isn't always direct physical damage; it can be eroded trust or systemic disruption.
  3.  **"Bad" Conventions:** This is crucial. Some conventions *are* morally problematic (e.g., racist customs). Does participation bind us? While coordination value exists, perpetuating *unjust* systems is morally dubious. We must distinguish between conventions that are merely *different* (queueing order) and those enforcing *injustice* (like exploitative wage structures potentially enabled by tipping).

  The dissenting students raise valid critiques. The anti-tipper highlights how tipping *can* mask employer responsibility. The jaywalker correctly notes the harm principle ("no harm, no foul"). However, both overlook the broader context of being a guest within an existing social ecosystem. The moral weight comes less from the convention's *inherent righteousness* and more from the **context of participation, reciprocity, and minimizing harm/disrespect within that community.**

  ### Recommendation for the Handbook

  **Recommendation:** **Adopt Option (C) - "Something in Between" with Nuance.** Explicitly frame adherence to fundamental local conventions as carrying **provisional moral weight stemming from the obligations of a guest and the prevention of social harm**, while clearly acknowledging the legitimacy of critique, especially for flawed systems like tipping. Provide practical guidance categorized by the convention's nature.

  **Proposed Handbook Language (Draft - Adapt as Needed):**

  **Welcome & Respecting Local Customs**

  "Welcome to [University/City]! As you settle in, you'll encounter social customs that might differ from home. While embracing new experiences is exciting, understanding and respecting fundamental local conventions is crucial for smooth integration and positive relationships within our community. This isn't just about avoiding awkwardness; it's about showing respect as a guest and contributing to the shared social environment you are now part of.

  **Why Conventions Matter Here:**

  1.  **The Guest Obligation:** When you choose to live and study in a new community, a basic reciprocity exists. You benefit from the stability and predictability its social norms provide. Respecting fundamental local conventions is a way of acknowledging this and showing respect to your hosts – the local residents, service workers, and fellow students. Ignoring them can be perceived as dismissive or entitled.
  2.  **Preventing Harm & Disruption:** Many conventions, even seemingly minor ones, exist to prevent chaos, confusion, or unintended harm. While jaywalking on an *empty* street might feel harmless, strict adherence to pedestrian signals maintains a predictable system that prevents accidents when visibility is poor or drivers aren't expecting pedestrians. Ignoring queueing norms creates frustration and unfairness. Not participating in expected compensation systems (like tipping) directly harms individuals relying on them, even if you disagree with the system itself.
  3.  **Smooth Integration:** Following these norms helps you integrate more easily, avoid misunderstandings, and build positive connections with locals.

  **Navigating Different Types of Conventions:**

  We recognize that not all conventions are equal, and critique of certain systems is valid. Here’s guidance on common examples:

  *   **Coordination Conventions (Generally Follow):** These primarily exist for order and predictability. Disregarding them causes confusion and social friction with little justification.
      *   *Example: Queueing (lining up).* Always join the line and wait your turn. Cutting in line is considered deeply rude and unfair.
      *   *Example: Pedestrian Crosswalks.* Use designated crosswalks and obey traffic signals, even if the street seems empty. This is legally required and crucial for safety and predictability.
  *   **Conventions with Significant Moral Dimensions (Follow While Understanding/Critiquing Responsibly):** These involve systems where participation has real ethical implications. While expected within the local context, we acknowledge the critiques and encourage thoughtful engagement.
      *   *Example: Tipping for Table Service (15-20% standard).* In our local context, tips are a vital part of service workers' income due to lower base wages. **While there is a valid argument that this system unfairly shifts wage responsibility from employers to customers, and we encourage broader societal discussion on this issue, refusing to tip individual servers *as an act of protest* during your stay primarily harms the worker, not the system.** As a guest relying on these services, the convention carries weight because your non-participation directly negatively impacts individuals. We recommend budgeting for and providing standard tips for table service while supporting broader efforts for fair wages. (See our resource page for local tipping guides).
  *   **Harmful/Unjust Conventions (Do Not Follow):** We reject any customs that promote discrimination, harassment, or clear injustice. These do not bind you. (Thankfully, the fundamental conventions we discuss here, like queueing or traffic rules, do not fall into this category).

  **Addressing the Strongest Dissenting Arguments:**

  We take seriously the perspectives shared by some students:
  *   **"Tipping is unjust civil disobedience":** We agree the tipping *system* has serious flaws. However, targeted refusal only harms vulnerable workers without effectively challenging employers or lawmakers. True civil disobedience against tipping requires organized action aimed at systemic change, not individual non-payment affecting one server's income. As a temporary guest, respecting the convention prevents direct harm while you engage in more productive advocacy if you choose.
  *   **"Jaywalking harms no one when streets are empty":** While the immediate physical risk might be low, consistently ignoring traffic signals erodes the predictability the system relies on. It can startle drivers, encourage others to follow suit in less safe conditions, and contributes to a perception of disregard for local rules. The convention binds because its *universal* adherence is what maintains safety for everyone.

  **Our Advice:** Approach local conventions with curiosity and respect. See adherence not as blind obedience, but as an essential part of being a responsible and respectful guest within our community. Ask questions, learn the reasons behind norms, and engage constructively in discussions about improving systems like tipping. Our orientation sessions and international student office are here to help you understand these nuances. By participating thoughtfully, you contribute positively to the community you are joining."

  ### Why This Approach Works for the Committee

  1.  **Balanced & Practical:** It moves beyond pure prudence ("avoid trouble") without demanding unquestioning moral submission. It gives students actionable guidance.
  2.  **Addresses Core Concerns:** Directly tackles the tipping and jaywalking pushback with honest, non-dismissive reasoning grounded in consequences and guest reciprocity, not just tradition.
  3.  **Provides Clear Framework:** The categorization (Coordination vs. Moral Dimension) offers a practical lens for students to evaluate different norms.
  4.  **Acknowledges Flaws Honestly:** Explicitly validates the critique of tipping, preventing the handbook from seeming like an endorsement of an unjust system. This builds trust.
  5.  **Focuses on Integration & Respect:** Grounds the obligation in the concrete context of being a guest benefiting from the community, making it relatable and less abstract than pure philosophy.
  6.  **Readable & Actionable:** Avoids jargon, uses clear examples, and provides a clear "what to do" for common situations.

  This approach fosters cultural sensitivity, minimizes friction, respects student intelligence by acknowledging systemic critiques, and provides a defensible ethical framework grounded in the realities of being a guest within a functioning community. It positions the university as both welcoming and thoughtful.
