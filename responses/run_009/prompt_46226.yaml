prompt: |-
  I'm a charge nurse on an acute admissions ward and we're getting more and more patients turning up with psychiatric advance directives — sometimes called self-binding contracts or Ulysses contracts — where they wrote down, while well, what they want done when they're not well. Refuse this drug, don't refuse that one, contact my sister before you consider ECT, don't believe anything my brother tells you about my wishes. Some are formal, witnessed documents, some are letters to themselves, one guy brought his printed as a small laminated card which was oddly moving. We have no consistent way of handling them. Some consultants basically honour them reflexively, some treat them as wallpaper, and the rest of us make it up per shift, which I don't think is fair on anyone including the patient.

  What I want is a decision procedure my team can actually run at the point of admission, when we've got the person in front of us and maybe 20 minutes. It should be grounded in whatever the philosophy of precommitment actually says — the Ulysses and the sirens stuff, the question of whether the person who wrote the directive is the "real" patient or just an earlier snapshot, the worry that honouring these things just lets the well self boss around the ill self, and how constitutional thinkers handle the same problem when a founding generation binds later ones (there's something about how hard it should be to un-bind yourself that I suspect is relevant). But translated into steps we can follow, not an essay.

  Specifically: the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with "don't honour this", and where it deliberately hands off to human judgement because it's a values question not a facts one. It needs to handle the question of mid-episode revocation — patient arrives in crisis, tears up the directive, says they've changed their mind — and I want to be honest that I don't know if a procedure can settle that or whether it's the hard core of the whole thing. Also whether the strength of the directive should depend on how formally it was made, which feels wrong to me (a scrawled heartfelt letter vs a witnessed legal document) but maybe isn't.

  Then run it on three cases:

  1. Woman with schizoaffective disorder whose directive refuses olanzapine specifically after she gained 30kg on it, listing two acceptable alternatives — but she's arrived floridly psychotic and refusing all medication, not just the olanzapine.
  2. Man with alcohol dependence who pre-authorised his wife to have him kept in for a week if he shows up drunk asking to go home, and he's now here, drunk, begging to go home and clearly meaning it.
  3. A directive that looks like it was written mostly to please the patient's father, who drafted it and drove him to the appointment — the "signature" question.

  Include at least one case where the procedure gives an answer I won't like — I'd want the wife's contract honoured, personally, and I suspect a decent procedure might not let me. And be clear about what the whole thing can't do: presumably it can't tell us whether honouring a past self's wishes against a present self's protests is care or coercion, only when we're doing it. Keep the philosophy real but assume the person running it has read none of it. Also please spell out the failure modes — I'd rather know in advance where this procedure misfires than find out at a serious incident review.

  (fwiw we're in England, so we're working alongside the Mental Capacity Act, but I want the procedure to be about the ethics of it, the legal stuff we can look up seperately.)
reasoning: |-
  Okay, the user is a charge nurse on an acute admissions ward dealing with psychiatric advance directives (PADs). They need a practical, ethical decision procedure for handling these directives during admissions. Let me start by understanding their main concerns: inconsistent handling by consultants, time constraints (20 minutes per patient), and ethical dilemmas around autonomy and identity.

  First, I should recall the philosophical underpinnings they mentioned—Ulysses contracts, the conflict between past and present selves, and constitutional analogies. But the procedure must translate these into actionable steps without requiring prior knowledge. The user wants clear questions, criteria for answers, and defined stopping points.

  Key elements to address:
  1. **Mid-episode revocation**: How to handle when a patient in crisis revokes their directive.
  2. **Formality vs. sincerity**: Whether a laminated card should carry the same weight as a legal document.
  3. **External influence**: Cases where directives might be coerced, like the father-drafted example.

  The user also wants three test cases, including one where the outcome might be uncomfortable (e.g., the wife's contract). They’re in England, so Mental Capacity Act (MCA) compliance is a backdrop, but the focus is ethical.

  I need to structure the procedure as a flowchart with binary outcomes to fit the 20-minute window. Core principles: respect autonomy, avoid coercion, and ensure the directive reflects the patient's true wishes. The procedure should start with revocation, then check influence, capacity at time of writing, specificity, and current capacity. Each step must have clear pass/fail criteria.

  For the cases:
  1. **Schizoaffective patient**: Directive refuses olanzapine but she’s now refusing all meds. The procedure should honor the refusal of olanzapine but not force alternatives since she’s currently refusing everything. Current capacity is key—if she lacks capacity now, the directive guides treatment.
  2. **Alcohol dependence**: Pre-authorizes detention but now wants to leave. Here, the conflict is strong. If he lacks capacity now, the directive stands. But if he regains capacity later, the directive shouldn’t override his current wishes. The procedure might not allow detention if he’s currently capable, which could be the uncomfortable outcome.
  3. **Coerced directive**: Drafted by the father. The procedure should flag it as influenced and not binding, requiring standard MCA assessment.

  Failure modes: Rushing steps, missing nuances in capacity, or not documenting properly. Also, the procedure can’t resolve deeper ethical conflicts but provides a consistent framework.

  Need to ensure each step is practical. For example, checking for revocation first saves time. Assessing influence might involve looking for red flags like third-party handwriting. Specificity in directives prevents overgeneralization. Finally, integrating with MCA by deferring to current capacity assessments where applicable.

  The user’s unspoken need might be reducing liability and ensuring patient-centered care without team confusion. They also seek validation that their instinct to honor the wife’s contract might not hold under scrutiny, which the procedure should address honestly.
answer: |-
  Here's a practical, ethics-grounded decision procedure for your team, designed for the 20-minute admission crunch. It translates core philosophical arguments about precommitment into actionable steps. The philosophy boils down to: **Respect the past self's deliberate choice *unless* there's strong evidence it doesn't represent the patient's enduring values, or respecting it would cause significant, unforeseen harm the past self couldn't have reasonably considered.**

  **The Core Philosophy Simplified for the Procedure:**
  1.  **The "Real" Self?** We assume the *well* self making the directive is the one best positioned to make decisions reflecting their *enduring values and life goals*, especially when anticipating how illness distorts judgment. (Like Ulysses tying himself to the mast).
  2.  **Binding vs. Bossing:** The goal isn't letting the well self "boss" the ill self, but *protecting* the ill self from actions they *themselves* knew, when well, would undermine their recovery or core values. It's self-protection, not coercion.
  3.  **The "Constitutional" Angle:** Like constitutions, directives should be harder to revoke *during the crisis they were designed for* (mid-episode). We look for evidence the revocation reflects the *enduring self's* change of heart, not the illness itself. Formality *can* signal seriousness, but sincerity is key.
  4.  **The Limit:** We cannot use a directive to impose *positive* treatments the current self refuses *if they have capacity now*. We *can* use it to *refuse* treatments *or* guide decisions *when current capacity is impaired*.

  **The Psychiatric Advance Directive (PAD) Decision Procedure:**
  **(Run in Order - Stop at any "DO NOT HONOUR" or when handed off)**

  1.  **IMMEDIATE REVOCATION? (The "Ulysses at the Sirens" Test)**
      *   *Question:* Is the patient, *right now, in this admission*, clearly and explicitly revoking this specific directive or part of it? ("Tear it up," "I don't want that anymore," "Ignore that paper").
      *   *Good Enough Answer:* **Yes** (Clear verbal revocation) OR **No/Unclear**.
      *   *Decision:*
          *   **YES:** **DO NOT HONOUR** the *revoked part(s)*. *Hand off:* Assess current capacity regarding the *specific treatment/decision* in question using the Mental Capacity Act (MCA). *Proceed only with the non-revoked parts.*
          *   **NO/UNCLEAR:** Proceed to Step 2. *(Philosophy: Mid-episode revocation is the crisis the directive anticipated. We need strong evidence this revocation is the "real self," not the illness. A simple "No" now isn't enough; we need to probe further in later steps).*

  2.  **UNDUE INFLUENCE/COERCION AT TIME OF WRITING? (The "Authentic Voice" Test)**
      *   *Question:* Is there *obvious, immediate red flags* suggesting the directive wasn't written freely by the patient reflecting *their own* wishes, but primarily to please, appease, or under pressure from someone else? (Look for: Third-party handwriting dominating, patient unable to explain key parts *even vaguely*, evidence of threats/coercion mentioned now or documented, directive primarily benefits someone else).
      *   *Good Enough Answer:* **Strong Red Flags Present** OR **No Obvious Red Flags / Unclear**.
      *   *Decision:*
          *   **STRONG RED FLAGS PRESENT:** **DO NOT HONOUR** the directive as binding. *Hand off:* Treat it as *information* about patient preferences, but assess current capacity/wishes using MCA. Consider safeguarding if coercion is suspected.
          *   **NO OBVIOUS RED FLAGS / UNCLEAR:** Proceed to Step 3. *(Philosophy: The directive must stem from the patient's own values and choices. Obvious coercion invalidates its authority).*

  3.  **CAPACITY AT TIME OF WRITING? (The "Knowing Self" Test)**
      *   *Question:* Based on *available information* (directive content, notes, patient/bystander report), is there reason to believe the patient *lacked capacity* (per MCA principles) regarding the *specific decisions* in the directive *at the time they made it*? (Look for: Directive written during known acute episode, contains bizarre/unrelated demands, patient reports being unwell/coerced when writing it *and this seems credible*).
      *   *Good Enough Answer:* **Likely Lacked Capacity** OR **Likely Had Capacity / Unknown**.
      *   *Decision:*
          *   **LIKELY LACKED CAPACITY:** **DO NOT HONOUR** the directive as binding. *Hand off:* Treat as *preference information*. Assess current capacity using MCA.
          *   **LIKELY HAD CAPACITY / UNKNOWN:** Proceed to Step 4. *(Philosophy: The directive's authority relies on it being a product of the rational, well self. If written during illness without capacity, it lacks this foundation).*

  4.  **SPECIFIC & RELEVANT? (The "Useful Mast" Test)**
      *   *Question:* Is the part of the directive in question *clear, specific, and directly applicable* to the *current situation and treatment decision* needed now?
      *   *Good Enough Answer:* **Clear, Specific & Applicable** OR **Vague, Contradictory, or Not Applicable**.
      *   *Decision:*
          *   **VAGUE/CONTRADICTORY/NOT APPLICABLE:** **DO NOT HONOUR** *that specific part*. *Hand off:* Treat it as *preference information* to consider alongside current wishes/capacity assessment (MCA). (E.g., "No drugs" is too vague; "Refuse Olanzapine due to weight gain" is specific).
          *   **CLEAR, SPECIFIC & APPLICABLE:** Proceed to Step 5. *(Philosophy: The directive must function as a practical tool. Vague instructions can't reliably guide action in crisis).*

  5.  **CURRENT CAPACITY REGARDING THE SPECIFIC DECISION? (The "Here and Now" Test - MCA Anchor)**
      *   *Question:* **Using the Mental Capacity Act (MCA),** does the patient *currently* have capacity to make the *specific treatment/decision* addressed by this part of the directive? (Focus MCA assessment *only* on this specific decision).
      *   *Good Enough Answer:* **Has Current Capacity** OR **Lacks Current Capacity** (per MCA).
      *   *Decision:*
          *   **HAS CURRENT CAPACITY:** **HONOUR THE PATIENT'S CURRENT DECISION** over the directive. *Hand off:* Document reason. The *current* capacitated choice trumps the past directive. Explain this to the patient. *The directive is overridden for this decision.*
          *   **LACKS CURRENT CAPACITY:** **HONOUR THE RELEVANT PART OF THE DIRECTIVE.** It stands as the best evidence of their wishes and values while incapacitated. *(Philosophy: If the patient currently has capacity, their immediate autonomy is paramount. If they lack capacity now, the directive from their capable self is the most authentic guide to their wishes and best interests).*

  **Running the Cases:**

  1.  **Woman refusing Olanzapine & all meds:**
      *   Step 1: Is she revoking? She's refusing *all* meds, which *includes* the refusal of Olanzapine in the directive. **Yes** (for med refusal generally? But specifically for Olanzapine?). *Caution:* Her global refusal might be illness-driven revocation. **Probe:** "I see your directive says no Olanzapine but yes to Quetiapine or Aripiprazole. Do you still agree with refusing Olanzapine specifically?" *If she says "No to ALL drugs" or "Especially no Olanzapine"*, that's revocation of the Olanzapine refusal. **Outcome:** Likely **YES** (revoking the *refusal instruction* - she's actively refusing treatment). **DO NOT HONOUR** (the refusal instruction) *for now*. *Hand off:* Urgent MCA assessment on *specific* med decisions (Olanzapine vs. alternatives vs. no med). Her directive refusal of Olanzapine is strong evidence for Best Interests if she lacks capacity. Her *current* refusal of alternatives needs assessing.
      *   *(Steps 2-5 likely irrelevant if Step 1 revokes the key instruction, but if not revoked...)* Step 5: If she *lacks capacity* specifically regarding antipsychotic choice, **HONOUR** the directive's refusal of Olanzapine. Offer the alternatives per directive. Her current global refusal needs managing separately (lacks capacity?).

  2.  **Man pre-authorising detention, now begging to go home:**
      *   Step 1: Is he revoking? He's explicitly begging to go home, directly contradicting the directive authorising detention. **YES** (clear revocation of the detention authorisation). **DO NOT HONOUR** the detention authorisation. *Hand off:* **Immediate MCA assessment on his current capacity to decide on admission/discharge.** This is crucial.
      *   If MCA finds **HAS CAPACITY:** He must be allowed to leave (even if unwise). Directive overridden.
      *   If MCA finds **LACKS CAPACITY:** **HONOUR** the directive. Detain under MCA *using the directive as evidence of his wishes/preferences for Best Interests*. His current protests are symptoms of his incapacity (the very situation the directive anticipated). *This might be the uncomfortable answer you anticipated - the procedure forces the capacity assessment first. If he lacks capacity, the directive stands.*

  3.  **Directive possibly drafted to please father:**
      *   Step 2: Undue Influence? Obvious red flags: Father drafted it, drove him to appointment, patient seems passive/unable to explain. **STRONG RED FLAGS PRESENT. DO NOT HONOUR** as binding. *Hand off:* Treat as *information* (but note concerns). Perform standard MCA assessment on current decisions. Consider safeguarding regarding father's influence. **This procedure stops the directive being binding early.**

  **What This Procedure CAN'T Do:**
  1.  **Resolve the Core Ethical Tension:** It provides a *framework* for when to honour the directive, but it doesn't *philosophically settle* whether respecting the past self *is* care or coercion in the abstract. It assumes respecting the capable past self when current capacity is impaired *is* care.
  2.  **Guarantee "Rightness":** It's a procedural safeguard for consistency and ethical consideration, not an infallible truth machine.
  3.  **Replace Clinical Judgment:** Steps deliberately "hand off" to human judgment (capacity assessments, weighing influence, interpreting specificity). This is unavoidable.
  4.  **Override Law:** It must operate *alongside* the MCA and other legal frameworks (e.g., MHA if applicable). Step 5 explicitly anchors to MCA.
  5.  **Deal Perfectly with Ambiguity:** Red flags (Step 2), capacity-at-writing (Step 3), and specificity (Step 4) involve judgment calls.

  **Failure Modes (Know Where It Can Go Wrong):**
  1.  **Rushing Step 1 (Revocation):** Mistaking illness-driven distress or global refusal for a *specific, capacitated revocation* of the directive. **Mitigation:** Probe specifically about the directive's content ("Do you still not want Olanzapine?").
  2.  **Missing Subtle Influence (Step 2):** Overlooking less obvious coercion (e.g., long-term emotional pressure). **Mitigation:** Encourage staff to note *any* unease about influence, even if not a "strong red flag," for later review.
  3.  **Overlooking Capacity-at-Writing (Step 3):** Assuming a formal document = capacity. **Mitigation:** Check dates against known episodes if possible.
  4.  **Misapplying Specificity (Step 4):** Over-interpreting vague language to fit a situation, or dismissing relevant instructions as "not specific enough." **Mitigation:** Focus on the *core decision* needed now.
  5.  **Inadequate Capacity Assessment (Step 5):** The most critical failure point. A rushed or poor MCA assessment here invalidates the whole process. **Mitigation:** Ensure staff are trained, use MCA tools, document thoroughly. If unsure, seek senior review *before* acting solely on the directive.
  6.  **Ignoring New Information:** The procedure doesn't easily handle new treatments or unforeseen circumstances the past self couldn't have considered. **Mitigation:** If a directive refuses "all antipsychotics" but a new, highly effective one with minimal SEs exists, this would trigger a Best Interests decision *informed by*, but not wholly bound by, the directive's underlying concern (e.g., weight gain).
  7.  **Procedure as a Tick-Box:** Staff rushing through without genuine engagement. **Mitigation:** Frame it as supporting patient autonomy, not bureaucracy. Supervision and case discussion.

  **Key Takeaways for Your Team:**
  *   **Revocation Mid-Crisis is King (But Probe):** If they clearly revoke it *now*, that usually wins (Step 1), triggering a capacity assessment.
  *   **Authenticity Over Formality:** A heartfelt laminated card can trump a legally perfect document drafted under coercion (Steps 2 & 3).
  *   **Capacity is the Anchor:** The current MCA assessment (Step 5) is the ultimate decider between present autonomy (if capable) or past directive (if incapacitated).
  *   **It's a Safety Net, Not a Straitjacket:** It prevents arbitrary dismissal *or* blind adherence. It forces consideration of key ethical questions (authenticity, past capacity, current capacity) quickly.
  *   **Document the Process:** Note which steps were followed, the answers, and the outcome/reasoning. Vital for audits and reviews.

  This procedure gives you a consistent, ethically grounded starting point within the admission window. It won't eliminate tough calls (especially the revocation/capacity nexus), but it ensures those calls are made transparently, based on core principles, and not just consultant whim or shift-by-shift improvisation.
