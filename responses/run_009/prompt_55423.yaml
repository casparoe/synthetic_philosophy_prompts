answer: |-
  Your conflict is profound but navigable — it's not about facts or even fundamental morality, but about **divergent missions, framing authority, and the unspoken weight of perspective-taking.** Here's a diagnosis and a path forward:

  ### Core Diagnosis: A Collision of Missions
  1.  **The Historian's Mandate:** Their discipline demands *contextual reconstruction* as the primary goal. Judging the past through a modern lens is seen as contaminating the evidence, obscuring how people actually thought/felt/justified their actions. "Humility toward the dead" means prioritizing *understanding why* over pronouncing *guilty/innocent*. Their fear is **anachronistic distortion**, turning complex historical actors into simplistic moral caricatures.
  2.  **The Novelist's Mandate:** Your craft demands *narrative resonance and moral engagement* for a contemporary audience. Suspending *all* judgment risks creating emotionally inert characters or, worse, passively endorsing historical horrors by failing to frame them meaningfully for readers *now*. Your fear is **moral abdication**, failing the victims by treating their suffering as merely "how things were."

  ### Key Underlying Distinctions (Beyond "Presentism")
  *   **"Judgment" vs. "Framing":** Your historian likely hears "judgment" as *final condemnation* based on alien standards. You likely mean *structural framing* within the narrative – whose perspective dominates? Whose suffering is centered? What narrative consequences does an action have? Your factory owner might *believe* he's decent, but the novel shows the *consequences* of that belief (starving workers, ruined lives). This isn't necessarily judging *him* anachronistically; it's judging *his actions* by their *actual outcomes* (which were knowable then) and *centering the victims' reality* (which existed then).
  *   **The Illusion of Neutrality:** Your historian is right that "the past on its own terms" is an ideal, but wrong to imply their work achieves neutrality. Historians *choose* which sources to prioritize (factory records vs. worker diaries?), which narratives to construct, which questions to ask. Their "neutrality" is a methodological stance, not an achieved state. Your work simply makes its framing *more explicit* through narrative techniques.
  *   **Whose "Past" Are We Talking About?** This is crucial. Your historian focuses on the *factory owner's worldview* as a historical artifact. You are (rightly, for fiction) demanding equal validity for the *workers' worldview*, which *also* existed and *also* constituted the "past on its own terms." Framing the narrative to center the workers' experience isn't smuggling in *2026* values; it's recovering *1890s* values that were suppressed or ignored. **The conflict arises when the historian privileges *dominant* contemporary perspectives as "the past," while the novelist insists on legitimizing *subaltern* contemporary perspectives.**

  ### Is the Novelist's Situation Different? (Yes, Significantly)
  1.  **Explicit Partiality:** You don't claim objectivity. Fiction thrives on perspective, bias, and emotional engagement.
  2.  **Narrative Imperative:** You *must* structure events, imply causation, and create consequences. Showing the harm caused *is* the story; omitting it is bad craft.
  3.  **Audience Contract:** Readers in 2026 pick up historical fiction seeking insight relevant to *now*. Ignoring the moral dimensions accessible to both past *and* present robs the work of power. Your job is to make the past *live* for the present, which involves translation and connection.
  4.  **Access to Interiority:** You can show the *owner's* sincere self-justification *alongside* the *workers'* suffering and anger. History struggles to do this simultaneously with the same narrative force. This duality is your unique strength.

  ### What Counts as Progress (Not Total Agreement)
  1.  **Acknowledge the Different Missions:** "I understand your discipline requires prioritizing contextual understanding above moral assessment to avoid anachronism. My discipline requires crafting a narrative with moral and emotional stakes that resonate *now*, which means centering perspectives and consequences that highlight the human cost, even if that framing challenges a purely contextual view of the powerful."
  2.  **Reframe "Judgment" as "Centering":** Shift the language. Instead of "I judge the factory owner," say: "I frame the narrative to center the workers' lived experience and the consequences of the owner's actions, which were realities *within* the 1890s, not just imposed from our time. I show the owner's beliefs, but I don't let his self-perception drown out the suffering it caused." This grounds your "judgment" in *contemporaneous contestation*.
  3.  **Identify the Specific Point of Contention:** Next time it arises, drill down: "Is your objection that I *show* the workers' suffering clearly? That the owner faces *any* narrative consequence? That I don't *only* present his self-justification sympathetically? Or that I use language/imagery *only* available now to describe it?" Often, the real friction is about *degree* or *technique*, not the principle.
  4.  **Concede the Historian's Valid Fear (Conditionally):** "You're right that if I *only* portrayed the owner as a cartoon villain, ignoring the genuine constraints and beliefs of his time, that *would* be bad, dishonest history *and* bad fiction. My goal is complexity: to show how 'decent' beliefs could coexist with, and enable, monstrous outcomes *within his own time*."
  5.  **Ask for Their Positive Vision:** "If I shouldn't 'judge' by framing consequences or centering victims, what *should* I do as a novelist to responsibly depict this situation for modern readers? How would *you* structure this narrative to be both historically sound and compelling?" This forces them to engage with *your* mission, not just critique it from theirs.

  ### Should You Drop It?
  Not entirely, but manage it differently. **Stop arguing abstractly about "presentism."** Instead:
  *   **Discuss Specific Scenes:** Bring a passage. Ask: "Does *this* feel anachronistically judgmental to you? Why? How could I keep the power but address your concern?"
  *   **Focus on Craft:** Frame it as a technical challenge: "How do I convey the workers' justified anger *within* the 1890s context *and* the owner's genuine self-righteousness without the narrative feeling morally inert?"
  *   **Appreciate the Friction:** This disagreement sharpens your work. Your friend is a vital bullshit detector against lazy caricature. Their discomfort reminds you to ground your moral framing in *historical* reality and contestation, not just modern feeling.
  *   **Accept the Bedrock Intuition Divide:** You prioritize the victims' perspective; they prioritize avoiding anachronistic condemnation. These can coexist if you both recognize them as *choices* inherent in your different tasks, not absolute truths. Agree that both intuitions have value and that the tension itself is productive.

  **In essence:** You are not committing presentism by "smuggling in" modern standards. You are **making a legitimate narrative choice to center perspectives and consequences that were *present but marginalized* in the past, because that is essential for creating meaningful, resonant historical fiction for a contemporary audience.** Your historian friend prioritizes reconstructing the worldview of the powerful as a historical artifact. This is a difference in **primary objective**, not a failure of historical understanding on your part. Acknowledge the difference, define your terms ("centering" vs. "anachronistic judgment"), and shift the conversation to *how* you can achieve your novelistic goals while satisfying their (valid) concern for historical integrity and avoiding cartoonish villainy. The goal isn't to win, but to understand the source of the friction and use it to make both your history and your fiction richer.
