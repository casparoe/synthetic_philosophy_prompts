prompt: |-
  A friend of mine and I have been arguing for years about who should be allowed to vote, and over time I've kept notes on her verdicts because they don't fit any simple pattern I can see. She says tourists should never get a vote, however long they stay, and the same goes for foreign students on four-year degrees and for seasonal workers who come back every harvest. But she says a woman from another country who has lived and worked in our town for thirty years, owns a house, and never took citizenship should certainly be able to vote, at least in local elections. She says citizens who moved abroad decades ago and almost never come back should keep their national vote by mail. She says children obviously can't vote. And when our country debated it, she came down firmly on the side of prisoners keeping their votes while serving long sentences. Last week three new cases came up and we ran out of time before she ruled. First: should the thirty-year resident also get a vote in national elections, or only local ones? Second: should sixteen-year-old citizens with jobs and taxes get the vote? Third: should a man who entered the country without papers but has now lived here fifteen years, working and raising kids who go to the local school, get a vote in local elections? Predict her verdicts for me. Then tell me what rule she seems to be running -- it can't just be citizenship, or the thirty-year resident would be out and the emigrants wouldn't matter; it can't just be where your life is, or the emigrants would be out. Lay out the candidate rules that fit everything she's said so far, say which fits best and why, and tell me which further case -- one I could actually bring up at dinner -- would most sharply distinguish those rules from each other. I'd also like to know what her verdicts suggest she thinks a vote fundamentally is: a say for anyone whose interests are at stake, a badge of membership, or something owed to people who pull their weight. Her answers point in different directions on that, and I can't tell whether she has one principle with exceptions or several principles that happen not to have collided yet.
reasoning: |-
  Hmm, the user has been debating voting rights with a friend for years and needs help deciphering her pattern of judgments. They've described several specific cases where their friend made decisions about who should be allowed to vote, including tourists, foreign students, seasonal workers, long-term residents without citizenship, citizens living abroad, children, and prisoners. Now there are three new cases they need predictions for, and they want to understand the underlying rule their friend is using.

  Looking at the established verdicts: The friend excludes tourists, foreign students, and seasonal workers regardless of duration. But she includes a 30-year resident non-citizen (at least locally), citizens abroad permanently, and prisoners. She excludes children but seems open to discussing working teenagers. This clearly isn't based solely on citizenship or physical presence.

  The key might be "life rootedness" - whether someone's daily life, commitments, and future are tied to the community. The 30-year resident has deep roots (home, job, life), while tourists/students/seasonal workers have temporary connections. Citizens abroad maintain formal ties but lack daily life connection, yet she allows their vote - this is the biggest complication.

  For the new cases: 
  1) The 30-year resident likely gets national vote too - if she qualifies locally based on rootedness, why not nationally?
  2) 16-year-old workers might get a yes - they're contributing economically and starting adult responsibilities.
  3) The undocumented immigrant with 15 years of roots (work, family, community ties) would likely get local vote based on the same rootedness principle.

  The underlying rule seems to be a combination of formal membership (citizenship) plus life rootedness, with citizenship being dominant when present but rootedness substituting when citizenship is absent. Prisoners are an exception - she might see voting as an inalienable right not forfeited by crimes.

  For differentiating cases: Asking about a citizen who lives abroad but votes in both countries would test whether she values exclusive allegiance. Or a very recently naturalized citizen versus a lifelong resident alien would show what she prioritizes.

  Fundamentally, her view appears hybrid: voting as both a membership badge (hence citizens abroad keep it) and as a stake in community outcomes (hence rooted non-citizens get it locally). The prisoner stance suggests she also sees it as a fundamental right not easily revoked.

  The user should present the dual-citizen voting case - it would force clarity on whether allegiance or rootedness matters more when they conflict.
answer: |-
  Based on your friend's established verdicts and the patterns they reveal, here are my predictions for her rulings on the new cases, the underlying rule she's likely using, a differentiating case, and her fundamental view of voting:

  ### Predicted Verdicts for New Cases

  1.  **Thirty-year resident in national elections:** **YES.** She already grants her the local vote based on deep life integration. Since she allows emigrant citizens to vote *nationally* despite lacking current life connection, she likely sees national citizenship as inherently qualifying (if held) and deep life integration as a *substitute* for citizenship where it's absent. The resident's 30-year rootedness likely qualifies her for national elections too.
  2.  **Sixteen-year-old citizens with jobs/taxes:** **YES.** Her "children obviously can't vote" implies age is the barrier. Sixteen-year-olds paying taxes and working are demonstrating adult responsibilities and stakes in society. She likely sees this as overcoming the "child" exclusion, aligning with her pattern of valuing contribution and stakes.
  3.  **Undocumented resident (15 years, working, kids in school) in local elections:** **YES.** This mirrors the 30-year resident case (deep life integration: work, family, community ties via kids) but without legal status. Her inclusion of the non-citizen resident and prisoners suggests legal status/formality is less important than life stakes and rootedness. 15 years is a very significant period.

  ### The Rule She's Running

  Her rule isn't singular; it's a **hierarchy of principles**:

  1.  **"Life Rootedness" is Paramount:** Voting rights belong to those whose **daily life, foreseeable future, and primary interests are demonstrably tied to the community** governed by the election (local or national). This explains:
      *   **YES** on 30-year resident (local/national): Life is here.
      *   **NO** on tourists/students/seasonal workers: Life center is elsewhere, connection is temporary/purpose-specific.
      *   **NO** on emigrant citizens *for local elections?* (Implied by her focus on national vote for them - their life isn't locally rooted).
      *   **YES** on undocumented resident (local): Life is demonstrably rooted here.
  2.  **Formal Citizenship Acts as a "Life Rootedness Guarantor" and National Tie:**
      *   It **presumes** life rootedness exists or *did* exist significantly (explaining emigrant national vote - they *were* rooted and retain the formal bond).
      *   It **trumps the absence of current physical rootedness** for *national* elections (emigrants keep vote).
      *   It **can be substituted by overwhelming evidence of de facto rootedness** where citizenship is absent (30-year resident, undocumented resident).
  3.  **Capacity & Contribution Matter (Breaking the "Child" Barrier):** While "children" lack capacity/stakes, demonstrating adult-like contribution (job, taxes) signals sufficient capacity and stakes for inclusion (YES on 16-year-olds).
  4.  **Voting as a Fundamental Right (Limiting Revocation):** Incarceration doesn't sever one's stake in society or membership (YES on prisoners). Legal status alone (like undocumented entry) doesn't permanently exclude if rootedness is proven.

  **Why this fits best:** It perfectly reconciles all her verdicts:
  *   Emigrants keep *national* vote (Citizenship as guarantor/presumption of past rootedness + national tie).
  *   30-year resident gets *local* vote (Life rootedness substitutes for citizenship).
  *   Tourists/etc. excluded (Lack rootedness, no citizenship).
  *   Prisoners keep vote (Rootedness/stake not revoked).
  *   Children excluded *unless* demonstrating adult stakes/contribution (Capacity/Contribution principle).
  *   Predicts YES on new cases based on rootedness (Undocumented resident, 30-yr national) or contribution (16-yr-olds).

  Rules that **don't** work:
  *   *Citizenship Alone:* Excludes 30-year resident. Includes emigrants (good) but excludes rooted non-citizens (bad).
  *   *Current Physical Presence Alone:* Excludes emigrants. Includes tourists/students (bad).
  *   *"Interests at Stake" Alone:* Would likely include tourists/students/seasonal workers on policy impact, which she excludes.
  *   *"Pulling Weight" (Contribution) Alone:* Includes seasonal workers, excludes children/prisoners/emigrants.

  ### Sharp Differentiating Case

  **"Should a dual citizen who was born in and lived here for 5 years as a child (holding citizenship since birth), but has lived and worked exclusively in another country (where they also hold citizenship) for the last 30 years, retain their national vote here?"**

  *   **Why it distinguishes:**
      *   **"Life Rootedness" Rule:** Likely **NO**. Their demonstrable life center, interests, and future are entirely elsewhere for decades. Minimal past connection.
      *   **"Citizenship as Guarantor/Presumption" Rule:** Likely **YES**. Citizenship was held since birth, creating a formal, enduring tie, similar to emigrants who *were* rooted.
      *   Her verdict here would show whether citizenship alone (even without significant past *or* present rootedness) is sufficient, or if demonstrable life connection (past or present) is always required, with citizenship mainly acting as proof of that connection.

  ### What Voting Fundamentally Is (To Her)

  Her verdicts point to a **hybrid view, prioritizing "Stake through Rootedness" but respecting "Membership"**:

  1.  **Primary: A Say for Anyone Whose Life is Demonstrably Rooted Here (Stake):** This is the strongest driver. The 30-year resident, undocumented resident, prisoners, and (potentially) working 16-year-olds are included because their *lives*, interests, and futures are undeniably tied to the community's decisions. Exclusion of tourists/students/seasonal workers is because their lives aren't rooted here.
  2.  **Secondary: A Badge of Formal Membership (Citizenship):** Citizenship is highly valued as a *proxy* for rootedness and a formal bond, especially for the *national* community. It preserves voting rights even when physical rootedness lapses (emigrants). However, it's *not absolute* – it can be substituted by demonstrable rootedness (non-citizen residents), showing stake is primary.
  3.  **Tertiary: Something Owed for Contribution (Pulling Weight):** Contribution (taxes, work) strengthens the case for inclusion, especially when breaking age barriers (16-year-olds). However, it's likely seen as *evidence* of stake/capacity rather than the *sole* justification (she wouldn't grant a vote to a wealthy foreign investor who pays taxes but lives abroad).

  **Coherence:** This isn't one principle with exceptions, but **multiple intertwined principles**:
  *   **"Life Rootedness"** is the core requirement for having a legitimate stake.
  *   **Formal Citizenship** serves as a durable indicator of (past or presumed) rootedness and national membership, protecting the vote even when rootedness changes.
  *   **Contribution/Capacity** provides evidence for rootedness or the maturity to exercise the stake meaningfully.
  *   **Fundamental Nature of the Right** limits its revocation (prisoners).

  They haven't fully collided yet, but the dual citizen case proposed above would force a prioritization between the enduring formal bond of citizenship and the requirement for demonstrable life rootedness/stake. Her likely YES on the undocumented resident and predicted YES on the 30-year resident for national votes strongly suggests that demonstrable, deep **life rootedness is the most fundamental source of legitimate voting rights** in her view, with citizenship acting as a powerful but substitutable formalization of that connection.
