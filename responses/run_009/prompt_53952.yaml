prompt: |-
  I'm a PhD student in formal epistemology, but this term I've been roped into TA-ing an intro-ish course on vagueness, and I want to hand my students something better than the standard "here are five -isms, memorize them for the exam" sheet. What I'd like is a decision tree that starts from intuitions about cases and only *then* attaches names, so it sorts people by what they actually believe rather than by which label they've decided to like. The root should be something like the sorites series itself (bald men / heaps / tall people, whatever concrete case you prefer), and the branch questions should be answerable by someone who has never heard the word "supervaluationism" — things like: would a single hair ever make the difference between bald and not bald; when you point at a clear borderline case, is "that's red" true, false, neither, or does it depend on what the conversation has fixed; could an omniscient being in principle know the exact cutoff, or is there nothing there to know; do you accept bivalence for vague predicates or not, and if not, whether the failure shows up in truth itself or only in assertibility; do "definitely red"-style operators iterate in a way that should worry us.

  The leaves need to include at least epistemicism, supervaluationism, a degree-theoretic/fuzzy option, the nihilist escape ("nobody is bald, nothing is a heap"), and some contextualist or pragmatic option, plus whatever else falls out of the logical space you build — and I'd like you to construct the tree from the questions first, then locate the positions inside it, rather than working backwards from the labels. If some cell of the logical space is unoccupied (say: sharp cutoffs exist but are unknowable-in-principle rather than merely unknown, or: no cutoffs but bivalence survives anyway), flag it and say a sentence about why nobody lives there — incoherent, unattractive, or just underexplored. Also please be honest about pairs of positions your tree can't actually seperate, like certain forms of supervaluationism and certain forms of contextualism, rather than inventing fake criteria that only work if you already know the answer.

  Two more things. First, size: aim for somewhere between six and nine branch questions and no more than ten leaves, since it's a one-page handout. Second, and this is partly for my own curiosity: I'll tell you my own answers, and at the very end I want you to run me through the tree. I say a single hair can never make the difference; I say "that's red" said of a borderline patch is neither true nor false; but I get nervous about gaps for simple present-tense observation statements, and I kind of want "there's no fact of the matter" to be a fact about our linguistic practice rather than about the world; and I find the idea that there's a sharp unknown cutoff genuinely repugnant. So end with a line like \answer{...} containing just the name of the leaf where I land (or the closest match, if I'm inconsistent — in which case tell me which pair of my answers is doing the fighting).
reasoning: |-
  Okay, let me tackle this fascinating request. The user wants a decision tree for vagueness theories that starts from intuitions rather than labels, and I need to design it carefully to meet their specifications. 

  First, considering the user's background: they're a PhD student in formal epistemology TA-ing an intro vagueness course. They clearly want to avoid superficial memorization and instead help students engage with foundational intuitions. Their frustration with traditional "-ism lists" suggests a desire for deeper conceptual mapping. 

  The core challenge is structuring the logical space exhaustively but accessibly. I'll need to identify the key branching points that genuinely separate theories. The sorites paradox must be the root, as requested. Then I should identify the most fundamental divides:

  1. Existence of sharp cutoffs (yes/no)
  2. Truth-value status of borderline cases (gaps vs. other options)
  3. Nature of indeterminacy (linguistic vs. ontological)
  4. Behavior of definiteness operators

  For size constraints, I'll aim for 7 questions max. The sorites question comes first: "Must there be a sharp cutoff?" A "yes" leads to epistemicism, while "no" branches into further questions about truth values. 

  Noticing tricky points: contextualism and supervaluationism may converge in some answers, so I shouldn't force false distinctions. Also, the user's personal answers suggest they might land in a gap-based supervaluationist or nihilist position, but their discomfort with gaps needs addressing.

  For unoccupied cells: "sharp cutoffs exist but are unknowable-in-principle" collapses into standard epistemicism since epistemicists already claim unknowability. "No cutoffs but bivalence holds" seems incoherent - rejecting cutoffs while keeping bivalence would require all objects to be definitively in or out, which contradicts vagueness.

  The user's answers: rejecting single-hair differences and borderline truth-value gaps points toward supervaluationism, but their nervousness about gaps and preference for linguistic (not ontological) indeterminacy might suggest contextualism. However, their "repugnance" toward sharp cutoffs rules out epistemicism. Need to resolve the tension between their gap acceptance and discomfort with gaps.

  Final output will map them to supervaluationism, with a note about their residual discomfort pointing toward contextualist refinements. The tree must honestly label convergence points between theories.
answer: |-
  Here’s a decision tree based on core intuitions about the sorites paradox, designed to map positions without presupposing labels. It uses 7 questions and results in 9 leaves (including one unoccupied cell and one hybrid). The "heap" example is used for concreteness, but any sorites series works.

  ---

  **Vagueness: Where Do You Stand?**  
  *Follow the branches based on your intuitions — no jargon required.*

  1.  **Must there be a single grain that turns a heap into a non-heap?**  
      - **Yes** → Go to Q2  
      - **No** → Go to Q3  

  2.  **Is this sharp cutoff knowable (even in principle)?**  
      - **Yes** → **`Classical Bivalent Logic`** (Rejects vagueness as semantic/ontic; borderline cases misclassified)  
      - **No** → **`Epistemicism`** (Sharp cutoff exists but is unknowable due to our linguistic/conceptual limitations)  

  3.  **When you point to a clear borderline heap and say "That's a heap", is that statement...?**  
      - **True or False** → Go to Q4  
      - **Neither True nor False** → Go to Q5  
      - **"It depends" (e.g., on context, standards, purpose)** → Go to Q6  

  4.  **Can an omniscient being know the exact cutoff?**  
      - **Yes** → **`Unoccupied (Incoherent)`** (If no sharp cutoff exists, nothing *to* know precisely. "Cutoff" implies sharp boundary.)  
      - **No** → **`Unoccupied (Unattractive)`** (Denies sharp cutoff but insists borderline claims are true/false *and* unknowable even to omniscience – conflates epistemic and semantic issues.)  

  5.  **Is the "neither" status because there's no fact of the matter (ontic vagueness)?**  
      - **Yes** → **`Ontic Indeterminacy`** (Vagueness is in the world itself; reality is fuzzy.)  
      - **No** → Go to Q7  

  6.  **Does the context-dependence resolve the entire sorites paradox (no leftover vagueness)?**  
      - **Yes** → **`Radical Contextualism`** (Meaning/extension of "heap" is *always* precise relative to context; paradox dissolves.)  
      - **No** → **`Moderate Contextualism/Pragmatism`** (Context sets rough boundaries, but borderline vagueness remains *within* contexts. "Definitely" operators needed.)  

  7.  **Can "Definitely a heap" itself have borderline cases?**  
      - **Yes** → **`Degree Theory / Fuzzy Logic`** (Truth comes in degrees (0 to 1); "Definitely P" thresholds (e.g., >0.9) suffer their own sorites.)  
      - **No** → **`Supervaluationism`** (Precisifications define sharp cutoffs; "True" = true on all precs., "False" = false on all, "Neither" otherwise. "Definitely P" = true on all precs., no higher-order vagueness.)  
      - **It's complicated/contextual** → **`Supervaluationism + Contextualist Elements`** (Hybrid: Precisifications are contextually constrained; "Definitely" might be stable but context-sensitive.)  

  8.  **Does "heap" simply fail to apply to objects in a sorites series?**  
      *[Ask ONLY if deeply skeptical of "heap" as a property]*  
      - **Yes** → **`Nihilism / Incoherentism`** ("Heap" is defective; nothing *is* a heap (or nothing isn't) in a strict sense. Paradox reveals concept's emptiness.)  
      *(This is a potential exit after rejecting sharp cutoffs (Q1=No), often accompanying Q3=Neither or Q3=Depends)*

  ---

  **Unoccupied Cells Explained:**  
  *   **Q4 Paths:** Denying sharp cutoffs (Q1=No) but insisting borderline claims have classical truth values (Q3=True/False) *and* that an omniscient being couldn't know them is deeply problematic. If there's no sharp fact *to* know, what makes the claim true/false? It seems to demand unknowable truths without a truthmaker.  
  *   **"No cutoffs but Bivalence survives":** This is ruled out by Q3. If you answer Q3=True/False *and* Q1=No, you land in Q4, which leads to unoccupied/unattractive cells. Bivalence (every statement is T or F) *requires* sharp cutoffs for vague predicates in a classical framework. Rejecting cutoffs forces rejection of bivalence for borderline cases.

  **Indistinguishabilities:**  
  *   **Supervaluationism vs. Contextualism:** Distinguishing pure supervaluationism (Q7=No) from moderate contextualism (Q6=No) solely via intuitions about cases is notoriously difficult. Both can mimic similar linguistic behavior. The tree uses "Definitely" iteration (Q7) and whether context *fully* resolves the paradox (Q6) as best-effort separators, but theorists often blend these.  
  *   **Degree Theory vs. Ontic Indeterminacy:** Both answer Q5=Yes? differently (DT: Q5=No, Q7=Yes; OI: Q5=Yes). The key difference is whether the indeterminacy is semantic (DT) or worldly (OI).

  ---

  **Where You Land:**  
  Based on your answers:  
  *   Q1: No (Single hair never makes the difference)  
  *   Q3: Neither True nor False  
  *   Q5: *Likely* **No** ("no fact of the matter" is about linguistic practice, not the world itself)  
  *   Q7: ? (Your view on iterating "definitely" isn't specified, but you note nervousness about gaps)  
  *   Q8: ? (You don't express nihilism)  

  Your path: Q1=No → Q3=Neither → Q5=No → **Q7**. Your nervousness about gaps for observation statements and desire for linguistic (not ontic) indeterminacy fits **Supervaluationism** best. However, your comment about "definitely" iterating being worrisome *could* point towards the **Hybrid (Supervaluationism + Contextualist Elements)** if you think precisifications themselves have contextual flexibility. Pure **Degree Theory** is less likely given your acceptance of a truth-value *gap* (neither) rather than a degree.

  **The Tension:** Your nervousness about gaps ("I get nervous about gaps for simple present-tense observation statements") *while* endorsing "neither" (Q3) creates mild tension. Supervaluationism *has* gaps, which makes you nervous. A contextualist (Q3="It depends") or pragmatic view might alleviate this nervousness by making truth/falsehood contextually settled, but you explicitly rejected that for Q3.

  **\answer{Supervaluationism}** (Closest match, with your nervousness hinting at possible contextualist refinements).
