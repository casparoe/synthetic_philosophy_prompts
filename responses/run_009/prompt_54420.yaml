  First, I should outline the etiological account's position clearly. According to this theory, a trait's function is what it was selected for in evolutionary history. So for fat storage, the function is energy storage for times of scarcity. Since these traits are still performing that role today, the etiological account labels them as functioning properly, even though they lead to health issues. This creates a problem for medicine, where disease is defined by dysfunction. If the trait is working as "designed," calling obesity a dysfunction seems contradictory.

  Next, the user wants me to not let the causal-role account off easy. The causal-role theory defines function by the current causal contribution to a system. The challenge here is determining which system and capacity are relevant. For example, is fat storage contributing to the body's energy regulation system or disrupting the overall health of the organism? Depending on how you frame the system, the function could be seen as beneficial or harmful. This subjectivity makes it tricky to pin down dysfunction consistently.

