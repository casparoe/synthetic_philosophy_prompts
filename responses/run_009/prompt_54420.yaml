  For the causal-role account, the issue is the lack of objective criteria for choosing the relevant system. Without evolutionary history, what counts as the "proper" system? If we pick the whole organism's survival, fat storage might be dysfunctional, but if we focus on cellular energy storage, it's functional. This ambiguity makes it difficult to define diseases consistently. Medicine needs clear criteria, and both theories have flaws here.

