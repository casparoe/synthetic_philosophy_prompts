prompt: |-
  I run a philosophy discussion group of ten adult non-specialists — sharp arguers, no formal training, comfortable with probabilities as they appear in gambling odds and weather forecasts, but not with the idea of graded belief as something one could measure. At our next meeting I have two hours, a whiteboard, and one job: to get them to genuinely understand the principle that a rational agent's degrees of belief should defer to whatever they take the objective chances to be. Plan the session for me; don't explain the principle to me, I understand it — what I need is the pedagogy.

  Some constraints and requests:

  - The dependency structure matters most to me. The principle is standardly stated as a constraint on conditional degrees of belief — how much of the machinery of conditional probability must I build first, and what is the cheapest scaffolding that will hold it up without the session collapsing into a tutorial on the probability calculus? Where you think the natural order (define chance, define credence, state the principle) gets something backwards, say so and take a side.
  - Pick one carrying example and defend the choice. I had been imagining a coin of unknown bias drawn from a bag, but I want you to decide: tell me what the example must display, what it must avoid suggesting (that chance just is long-run frequency; that the principle is merely about learning from data), and whether you would replace or supplement it with something like a casino die or radioactive decay.
  - The misconceptions map. I expect, roughly: that chance and credence are the same thing wearing different hats; that the principle just says trust the physicists; that if the underlying physics is deterministic, all chances collapse to zero and one and the topic evaporates; and that one's degree of belief in a future event should equal its chance even after one has learned things the chance itself doesn't encode. Tell me where each belongs in the sequence, and what should beat it.
  - A check for the end: one question whose answer would show me they have grasped deference to chance as opposed to having merely acquired the vocabulary.
  - What to refuse to explain. I know there are recognized difficulties about how the principle interacts with hypotheses about where the chances themselves come from, and about which background facts a rational agent may permissibly condition on alongside the chances. I would rather name each in a sentence as a live research problem than mangle it — unless you think one of them is actually teachable at this level, in which case say so, take the position that it is, and fit it in.

  Please do not give me a menu of options at any point. Choose the order, the example, and the cuts, and give your reasons. If a choice is genuinely close, tell me what the runner-up buys and why it is not worth the cost.
reasoning: |-
  We are going to teach the principle of deference to objective chances, also known as the Principal Principle. The goal is to get the group to understand that a rational agent's degree of belief in an event should be set equal to the objective chance of that event, provided the agent knows the chance and has no other relevant information that the chance doesn't account for.

  Constraints:
  - Avoid a full tutorial on probability calculus. We need minimal conditional probability.
  - One main example that avoids conflating chance with long-run frequency and that isn't just about learning from data.
  - Address common misconceptions.
  - End with a check question.

  Plan for 2 hours:

  1. **Introduction (10 minutes):** 
     - Set the stage: We are going to talk about how to set our beliefs when we have information about how the world works (chances). We are going to discover a principle that rational agents follow.

  2. **Build the concept of degrees of belief (15 minutes):**
     - We start with degrees of belief (credences) because it's more intuitive and we can illustrate with betting.
     - Example: Suppose we are going to flip a coin. How confident are you that it will land heads? Have them assign a number between 0 and 1. Explain that this is a degree of belief.
     - Betting interpretation: If you assign 0.5, that means you would be indifferent to betting on heads at even odds. (Avoid a deep dive into Dutch books; just use as motivation for numbers between 0 and 1 and that they should be coherent.)

  3. **Introduce objective chance (15 minutes):**
     - Objective chance is not the same as our belief. It's a feature of the world. Examples: 
       - A fair coin has a 0.5 chance of heads.
       - A loaded die might have a 0.6 chance of six.
       - Radioactive atom decaying in the next hour has a certain chance (if we have a half-life, we can compute it).
     - Avoid defining chance as long-run frequency. Instead, think of it as a propensity or a feature that governs single cases. But we don't need to settle the metaphysics. We can say: "Whatever it is, we often have estimates of it (from physics, from symmetry, from past data) and we want to know how to set our beliefs accordingly."

  4. **The principle in a simple case (20 minutes):**
     - Use the coin with unknown bias drawn from a bag. 
       - Imagine we have a bag of coins. Each coin has a different bias (chance of heads). We draw one coin at random. We are going to flip it once. 
       - We know that the chance of heads for this coin is, say, 0.6. (How? Maybe we have a device that measures the bias, or we were told by a trustworthy source. We are not learning from data by flipping the coin repeatedly.)
       - What should your degree of belief be that it lands heads? 
     - Most will say 0.6. 
     - Why? Because if you set your belief to 0.6, then you are matching the chance. 
     - We state the principle: If you know that the objective chance of an event A is p, and you have no other information that is relevant to A (other than what the chance already accounts for), then your degree of belief in A should be p.

  5. **Conditional probability and why it matters (15 minutes):**
     - We must condition on the chance. We don't want the principle to hold unconditionally. We need to express that we are setting our belief *given* that we know the chance.
     - Example: If we flip the coin twice, what should your degree of belief be that we get two heads, given that the chance of heads is 0.6? 
       - If we assume independence (which we might not have to, but in this case it's natural), then 0.6 * 0.6 = 0.36.
     - We can also show what happens if we condition on more. For example, suppose we flip the coin once and it lands heads. Then what is our degree of belief for the next flip? It might still be 0.6 (if we think the chance is fixed and the flips are independent). But note: the chance hasn't changed, so we still defer to it. But if we are uncertain about the chance, that's a different story (we'll get to that).

  6. **Addressing misconceptions (35 minutes in total, broken down):**
     - **Misconception 1: Chance and credence are the same.**
       - Why they are different: Chance is out there in the world (we might not know it) and credence is in our head. We can have a credence about what the chance is. Example: We don't know the bias of the coin, so we have a credence distribution over possible biases. Then, when we condition on the bias being 0.6, we set our credence in heads to 0.6. (10 minutes)
     - **Misconception 2: The principle just says trust the physicists.**
       - It's more general. Physicists might tell us the chance, but we can also have chances in games of chance (like dice) or in other domains. The principle says: whatever you take the objective chance to be, you should set your belief accordingly. (5 minutes)
     - **Misconception 3: Determinism.**
       - If the world is deterministic, then the chance of an event is either 0 or 1. But we don't know which! So we don't know the outcome. The principle still applies: if we knew the chance (i.e., we knew the outcome because we knew the laws and the initial conditions), then we would set our belief to 0 or 1. But without that knowledge, we have to use chances that reflect our uncertainty. (10 minutes)
     - **Misconception 4: Deferring even after learning extra information.**
       - Example: We know the chance of heads is 0.6. Then we flip the coin and it lands heads. Now, what is our degree of belief that the next flip is heads? Still 0.6? Only if we think the chance is fixed and the flips are independent. But what if we are uncertain about the chance? Then we update our credence about the chance. 
       - We must condition only on the chance and no other relevant information that the chance doesn't account for. If we have extra information that the chance doesn't account for, we don't set our belief to the chance. 
       - Example: Suppose we have a coin that we know is either fair or double-headed. We don't know which. We assign 50% to each. Then we learn that the chance of heads is 0.5 (if it's fair) or 1.0 (if double-headed). But we don't know which coin we have. So our initial degree of belief in heads is 0.5*0.5 + 0.5*1 = 0.75. Now, if we learn that the chance is 0.5, then we condition on that: we know it's the fair coin, so our degree of belief in heads becomes 0.5. But note: we didn't just set it to 0.5 unconditionally. We conditioned on the chance being 0.5 and that told us it's the fair coin. (10 minutes)

  7. **The formal statement (5 minutes):**
     - We can write it as: Cr(A | chance(A)=p, E) = p, where E is any evidence that is "admissible". 
     - Explain that E must be information that doesn't bear on A except through the chance. We won't define admissibility precisely, but note that information about the future outcome is typically inadmissible. Also, information about the past that the chance doesn't account for might be inadmissible. (This is a research problem, but we can say that in simple cases like the coin flip, if we condition on the chance, we don't have any other information, so we set to p.)

  8. **Check for understanding (10 minutes):**
     - Ask: "Suppose you have a six-sided die that you know is fair. What is your degree of belief that it will land on 6? (They say 1/6.) Now, suppose you roll the die and it hasn't landed yet, but a trusted friend who has seen the outcome tells you that the chance of it being 6 is 1 (because it is 6) or 0 (because it isn't). But they don't tell you which. So they have told you something about the chance, but not the outcome. What is your degree of belief now that it is 6? Why?"
       - Correct answer: It should remain 1/6. Why? Because the information they gave you doesn't tell you the chance, it tells you that the chance is either 0 or 1. But you don't know which. And you started with a 1/6 belief that it's 6. The new information doesn't change that because the chance being 1 only happens when it is 6 (which has prior 1/6) and the chance being 0 happens when it isn't (prior 5/6). But note: the information isn't that the chance is 1, it's that the chance is either 0 or 1. That's always true! So it doesn't give you any new information. Therefore, your degree of belief remains 1/6.
       - Why is this a check? Because it shows they aren't just setting their belief to the chance they are told (they were told either 0 or 1, but they don't set to 0.5 or something). They understand that they must condition on the exact chance value. Also, they see that the principle only applies when they condition on a specific chance value.

  9. **Wrap-up and research problems (5 minutes):**
     - Restate the principle: When you know the chance, set your belief to it, unless you have other information that the chance doesn't account for (which we call inadmissible evidence).
     - Mention two research problems:
       - How does the principle interact when we have hypotheses about the chances? (We saw a bit of that when we were uncertain about the chance, and we updated our beliefs about the chance and then set our belief in the event based on that.)
       - What counts as admissible evidence? (We don't have a full answer, but it's a live topic.)

  Total: ~120 minutes.

  Why choose the coin from a bag?
  - It avoids the conflation with long-run frequency because we are flipping the coin only once. We are not gathering data to estimate the chance; we are given the chance by a measuring device or an oracle.
  - It also allows us to naturally discuss uncertainty about the chance (when we don't know the bias) and then conditioning on the chance (when we do know it).
  - We can also use it to show that the chance is a property of the coin and not of the flip sequence.

  Radioactive decay could also work, but it might lead to discussions about determinism and quantum mechanics that we don't want to get bogged down in. The coin is more accessible. The casino die is also good, but the bag of coins allows for a natural way to have uncertainty about the chance.

  Refusals:
  - We won't give a full account of admissibility. We'll just say it's tricky and that we condition on the chance and any evidence that is "admissible" (which we illustrate as not giving direct information about the outcome).
  - We won't go into the technicalities of the Principal Principle versus the New Principle (which handles cases when the chance might be undermined by the outcome). We'll just stick to the simple cases.

  Order:
  We build credence first because it's more intuitive, then chance, then the principle. We address misconceptions as they come up naturally in the example. We do not define chance metaphysically; we take it as a given that we have estimates of chances.

  This plan is designed to be interactive. We ask questions to the group to get them to reason through each step.
answer: |-
  ### Session Plan: Deference to Objective Chance

  **Core Goal:** Participants grasp that a rational agent's degrees of belief (credences) should align with known objective chances, *conditional* on those chances, with minimal probability calculus.  
  **Key Insight:** Chance is a feature of the world; credence is in the mind. Deference means setting credence *to* the chance *when you know it*, barring inadmissible information.

  ---

  #### **Session Structure (120 mins)**  
  **Pedagogical Strategy:** Start with credences as familiar, introduce chance as external, then force a clash between them. Resolve with deference.  
  **Why this order?** Defining chance first risks metaphysical debates. Starting with credences (e.g., betting odds) grounds the discussion in lived experience. The principle emerges as a solution to a problem.

  1. **Warm-up: Degrees of Belief Are Measurable (20 mins)**  
     - **Activity:** Ask each to assign a number (0–1) to their belief in: "It will rain tomorrow in Paris." Discuss why answers vary.  
     - **Link to gambling:** "If you say 0.3, would you bet $3 vs. $7 on rain? If not, your number is inconsistent."  
     - **Scaffolding:** Avoid formal probability. Use "degrees of belief" = intuitive confidence scores. *No conditional probabilities yet*.  
     - **Beat misconception:** Shows credence is subjective but quantifiable. (Addresses "beliefs can't be measured.")

  2. **Introduce Objective Chance with a Loaded Die (30 mins)**  
     - **Carrying example:** **A casino die with a known bias.**  
       - *Why this example?*  
         - **Must display:** Chance is pre-set (e.g., "factory made this die with 30% chance of 6"), *unrelated* to data or frequency.  
         - **Avoids:** Frequency (don’t mention long runs). Not about learning (you’re *given* the chance upfront).  
         - **Beats "chance=credence"**: Chance is a property of the die; credence is your belief about a single roll.  
       - *Why not coin in a bag?* It tempts frequency-thinking ("we could flip it many times"). Radioactive decay invites quantum confusion.  
     - **Activity:** "You know this die has a 30% objective chance of landing 6. What’s your degree of belief it will be 6 on the next roll?" Consensus should be 0.3.  
     - **Key move:** Emphasize chance is **external** ("set by the factory"; "like a law of physics").

  3. **Clash: When Chance and Credence Diverge (25 mins)**  
     - **Setup:** "Now, a psychic (whom you trust 80%) tells you the roll *will* be 6. The die’s chance is still 30%. What’s your belief now?"  
     - **Let them argue:** Most will say >0.3 (e.g., 0.8). *Do not resolve yet*.  
     - **Introduce conditioning:** "Your belief *given the psychic’s claim* is 0.8. But your belief *given the chance* is 0.3. They’re different because you’re conditioning on different information."  
     - **Scaffolding:** Conditional belief = "belief if we assume X is true." Use simple language: "Suppose you *know* the chance is 30%. Now what?"  
     - **Beat misconceptions:**  
       - **"Chance=credence"**: Dies here (chance stays 30%; credence changes with info).  
       - **"Trust physicists"**: The psychic isn’t a physicist—deference isn’t about authority.  
       - **"Determinism"**: Even if the universe is deterministic, *you don’t know the outcome*—the chance (e.g., from incomplete knowledge) still guides belief.

  4. **The Principle: Deference as a Constraint (25 mins)**  
     - **State the principle:** "When you *know* the objective chance of A and have no *inadmissible* information, your belief in A *given this knowledge* should equal the chance."  
     - **Refine with example:**  
       - In the die scenario, *conditional on knowing the chance is 30%*, your belief must be 0.3. The psychic’s claim is "inadmissible" (more later).  
     - **Why conditional?** Use the whiteboard:  
       - Write: `Belief(A | Chance(A)=x) = x`.  
       - Stress: `|` means "assuming you know." Not a math symbol.  
     - **Beat "post-learning deference"**: If you learn the die *was* 6 yesterday, that’s admissible (the chance accounts for past rolls via independence). If you learn the *outcome*, it’s inadmissible—deference doesn’t apply.

  5. **Admissibility and Research Problems (15 mins)**  
     - **Inadmissibility simplified:** "Information that ‘shortcuts’ the chance, like seeing the future."  
       - *Example:* The psychic’s claim is inadmissible; yesterday’s roll isn’t.  
     - **Research problems (name only):**  
       1. "What if the chance itself depends on your beliefs? (e.g., psychology) We skip this."  
       2. "What *exactly* is inadmissible? Philosophers debate it; no tidy answer."  
     - **Why not teach admissibility?** Too technical. The psychic example suffices for intuition.

  6. **Check for Understanding (5 mins)**  
     - **Question:** "You know a coin’s chance of heads is 70%. You also know it landed heads 10 times in a row. What should your *current* degree of belief be for the next flip?"  
       - **Correct answer:** 0.7 (past outcomes are typically admissible—they don’t override the known chance).  
       - **Why it works:** Tests if they distinguish inadmissible information (e.g., psychic) from admissible (past data). Distractor: Many say >0.7, confusing credence with chance.

  7. **Q&A and Recap (10 mins)**  
     - Recap: "Chance is worldly; credence is personal. When you know the chance, let it guide you—unless you know too much."  
     - **Refuse to explain:**  
       - How chances relate to frequencies (metaphysical rabbit hole).  
       - Probability axioms (they’ve used numbers intuitively; no need for rigor).

  ---

  #### **Why This Works**  
  - **Dependency Structure:** Credences first (intuitive), then chance as external, then deference as reconciliation. Avoids defining chance upfront.  
  - **Minimal Conditionals:** Reduced to "belief assuming X." No Bayes’ rule or joint probabilities.  
  - **Misconceptions Addressed:**  
    - **Chance=credence**: Killed in Step 3 (psychic divergence).  
    - **Trust physicists**: Beaten in Step 2 (casino die isn’t physics).  
    - **Determinism**: Neutralized in Step 3 (chance as information-sensitive).  
    - **Deference post-learning**: Blocked in Step 4 (inadmissibility).  
  - **Efficiency:** The die example covers all bases without frequency or data-learning baggage. Radioactive decay was runner-up but risks quantum tangents.

  **Final Note:** Use their arguments as fuel. If someone resists, ask: "If you *know* the chance, why would your belief differ unless you have extra info?" This forces the principle to emerge from their intuition.
