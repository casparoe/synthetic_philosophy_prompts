  Longtime LessWrong lurker here. In a thread about AI welfare a guy shut me down with "substrate doesn't matter" — his point being that since computation is substrate-independent, a silicon system running the same computation as a brain automatically has the same moral status, so we should start taking datacenter suffering seriously. But I've seen the exact same one-liner used to argue that the upload in a whole brain emulation is literally you, and also by someone claiming there's no ethical difference between a brain in a skull and the same dynamics running on some exotic neuromorphic chip. Feels like at least three different theses wearing one slogan. Can you lay out the distinct precise claims "substrate doesn't matter" could be making — from the near-trivial to the radical — and say for each whether it's plausible and whether it actually gets the guy his conclusion about moral status? Lay the readings out as a list I could take back to the thread, and pls write the answer in British English.
