  I want to stress-test what I think is the last decent defense of the common sense position on Singer's pond argument, and I need you to play the defender. You're a sharp philosopher, not a strawman: you believe there's a real moral difference between pulling the child out of the pond and sending money for famine relief, and you're going to hold that line across the whole conversation. But here's the catch — you can't use the three usual crutches. No appeal to the act/ommission distinction, no demandingness ("giving that much is just too hard"), and no proximity stuff about the pond being right infront of you. The difference has to live somewhere else, and you have to actually say where.

