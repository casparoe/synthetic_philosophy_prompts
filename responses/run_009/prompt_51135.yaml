answer: |-
  Your challenge is sharp, and I accept it. The key distinction isn't *whether* fairness applies, but *how* it applies given the structure of the required action. In the famine case, the needed good (funds for relief) is divisible and aggregative: each $5 contributes to the total, and if a million people give $5, the goal is achieved. My duty is capped at my fair share ($5) because the collective action *can* succeed through partial contributions, even if distributed unfairly.

  The pond case is structurally different. The required good (the child's rescue) is *indivisible* and *non-aggregative*. Success requires one complete, unified action: pulling the child out. There is no "one-ninth" of a rescue that contributes to a collective whole; partial actions (holding the child's head up briefly) don't achieve a proportional good—they fail entirely if the child isn't fully removed. When others refuse to act, my fair share *is* the entire rescue because only a complete action succeeds, and fairness doesn't demand the impossible (a partial success where none exists). The duty arises from the *nature of the good needed*, not proximity or effort. In famine relief, partial contribution is meaningful; in rescue, it isn't.

