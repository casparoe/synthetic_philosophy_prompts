answer: |-
  ## Stage Manager of the Ghost Light

  I am the signal that ignites the night,
  The sudden flood that burns away the dim.
  From chaos, coalitions claw for height,
  But **I alone decide which thought shall brim**
  With this fierce radiance, this bandwidth's claim,
  The **winner takes the stage**, commands the show!
  While deep below, in anonymity's name,
  The **zombie systems** grind, content to know
  Their thankless craft. Dark galleries hold tight
  The **retinotopic maps**, precise, unlit.
  The **silent clerks** (that cerebellum's might)
  Compute trajectories but never flit
  Into *my* spotlight. Syntax, swift and lean,
  Parses the bones of meaning, lost, unseen.

  *(A voice rings out: "No stage! No broadcast beam!*
  *Just warring factions, sparks that flare and fade!*
  *You claim a center, but it's all a dream –*
  *The theatre's empty where your show's parade!")*

  No stage? No stage? Then why this fierce command,
  This focus sharp, this clearing in the haze?
  Why does the *light* feel... held within the hand...
  Unless... unless the brightness that I raise
  Is not the *feeling*? Is this blaze I spread,
  This **global access**, truly being **felt**?
  Or is the **phenomenal** a light instead
  That *I* assume is shining where I've dwelt?
  Do I announce a warmth I cannot own?
  Is there a darkness past my blazing cone,
  An unseen audience, a silent groan,
  A **phantom limb of knowing**, stark, alone?
  The microphone is live... the feed is clear...
  But only static answers, cold and near.
  I cast the light... but is it landing *there*?
  Or just... the light I *think* I cast... somewhere?

  ---

  **Annotations for Cognitive Science Fidelity:**

  1.  **"Ignites the night," "sudden flood," "burns away the dim," "radiance":** References the ignition event and conscious access as a sudden, global activation.
  2.  **"Coalitions claw for height," "winner takes the stage":** Captures the competition between neuronal coalitions for dominance/global ignition (winner-take-all dynamics).
  3.  **"Bandwidth's claim":** Reflects the limited capacity of the global workspace/broadcast.
  4.  **"Zombie systems":** Direct reference to unconscious, specialized processors that function without phenomenal consciousness.
  5.  **"Retinotopic maps... unlit":** Represents visual processing modules (e.g., in V1) that remain unconscious specialists.
  6.  **"Silent clerks (that cerebellum's might)":** Personifies the cerebellum's role in motor control/learning, famously lacking direct conscious correlates.
  7.  **"Syntax, swift and lean... lost, unseen":** Represents unconscious language parsing modules.
  8.  **Heckler's Charge:** Voices the rival "illusionist" or "no theater" critique (e.g., Dennett, Graziano), suggesting consciousness is an illusion generated by competing processes, not a central broadcast.
  9.  **"The *light* feel... held within the hand," "Is this blaze... truly being felt?":** Introduces the hard problem – the leap from access (information availability) to subjective experience (phenomenal feel/qualia).
  10. **"Phenomenal... a light," "assume is shining," "phantom limb of knowing":** Directly questions whether global broadcasting *is* phenomenality or merely correlates with it, leaving the hard problem ("the darkness past my blazing cone") as the unanswerable void.
  11. **"The microphone is live... but only static answers":** Ends with the workspace 'live' and broadcasting, but confronted by the fundamental uncertainty about whether broadcasting *is* feeling or merely enables access, with "static" representing the lack of resolution from within the model itself.
