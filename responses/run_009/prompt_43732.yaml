prompt: |-
  I want to get serious about sphexishness — Hofstadter's coinage for the thing the digger wasp does: drag the paralysed prey to the edge of the burrow, pop inside to check it, and if you nudge the prey a few centimetres away while she's checking, she comes out, finds it, drags it back to the exact same spot, and checks the burrow again — apparently you can loop her forever. People reach for the wasp as a mascot for behaviour that looks intelligent but is just a rigid routine with no re-planning. Before I go read anyone's actual theory of what separates sphexish behaviour from genuinely flexible behaviour, I want the spec such a theory has to meet. Write me the desiderata for an adequate account of the sphexish/non-sphexish divide: which cases it has to classify correctly (the wasp, obviously, but also a chess engine that falls into the same opening trap three times in one game and then stops falling for it; a human making coffee on autopilot who still copes when the milk's gone off; a cleaning robot that re-vacuums a patch when you shift the furniture mid-cycle; a student who rehearsed a presentation and genuinely cannot improvise when interupted); the distinctions it can't afford to collapse (can't adapt versus can't be bothered; rigid because the sensors are limited versus rigid because the policy is); the empirical stuff about animals it can't contradict (lots of allegedly dumb creatures re-route fine when the world changes, and clever ones freeze in odd conditions); and whether it owes us anything about free will or should just stay out of that. For each desideratum, give the case or consideration behind it, in a sentence. Mark which you think are non-negotiable and which are one camp's prejudice dressed up as a requirement. And flag any pair you suspect can't be jointly satisfied — I have a hunch that "the distinction must be gradable, not binary" and "it must predict a fairly sharp cut-off somewhere among animals" are going to fight, but check that properly rather than just agreeing with me. Then, two or three sentences each, say how an internal-model story (the creature represents the situation, the wasp doesn't) and a hierarchical-control story (routines stacked on routines, with an override level that notices when a routine is misfiring) do against your list — that's the part I'll want to extend later, so be honest about where the list is thin. Keep it under 650 words total; the criteria matter more than the scorecard.
reasoning: |-
  Hmm, the user wants desiderata for a theory distinguishing sphexish (rigid, routine-bound) behavior from flexible intelligence. They've provided clear examples: the digger wasp itself, a chess engine that learns, a human on autopilot adapting, a cleaning robot failing to adapt, and a student who can't improvise. 

  Key challenges emerge immediately. First, the theory must handle both biological and artificial systems without anthropomorphizing. Second, it needs to account for learning - that chess engine starts sphexish but becomes flexible within a single game. Third, it must separate capability from motivation ("can't adapt vs won't adapt") and physical constraints from cognitive ones. 

  The gradable vs binary tension is critical. Animals show a spectrum: ants reroute around obstacles while the wasp doesn't, yet even humans freeze under stress. A good theory should explain why flexibility appears continuous across species but has thresholds in individual capabilities. 

  I'm wary of free will entanglements - that's a philosophical swamp. The theory should stay descriptive, not metaphysical. Also important: it mustn't contradict ethology. Many "simple" creatures show unexpected adaptability (like bees optimizing routes), so sphexishness can't equal "invertebrate stupidity." 

  For the internal-model approach: it handles chess engines (explicit representation allows strategy shifts) and humans (mental simulation of coffee alternatives), but struggles with the wasp's infinite loop - does she truly lack any model, or just fail to update it? 

  Hierarchical control explains autopilot humans (higher cognition overrides routine when milk sours) but not necessarily the student's rigidity - is their override broken, or just unpracticed? The cleaning robot case exposes architecture limits: shifting furniture might exceed its sensor hierarchy. 

  Biggest gap: neither theory cleanly explains why learning sometimes breaks sphexishness (chess engine) but not other times (student). That needs unpacking in future extensions.
answer: |-
  Here are the desiderata for an adequate account of the sphexish/non-sphexish divide, with cases/considerations, negotiability flags, and tension checks:

  **Core Desiderata (Non-negotiable):**
  1.  **Handle the Paradigm Case:** Correctly classify the digger wasp as sphexish. *Case: The wasp's infinite loop when prey is moved.*
  2.  **Accommodate Learning:** Classify behavior that *starts* sphexish but *becomes* flexible through experience/feedback as non-sphexish once adapted. *Case: Chess engine falling for a trap repeatedly then stopping.*
  3.  **Distinguish Rigidity from Adaptation:** Classify routine behavior that smoothly adapts to minor changes as non-sphexish. *Case: Human on autopilot coffee-making adjusting to sour milk.*
  4.  **Exclude Sensorimotor Limits:** The distinction shouldn't collapse with simple physical incapacity. *Case: Cleaning robot failing to re-map because its sensors literally cannot see the moved furniture, vs. having the sensor data but rigidly ignoring it.*
  5.  **Separate Capability from Motivation:** Clearly differentiate "cannot adapt" (sphexish) from "could adapt but doesn't bother/is lazy/inattentive". *Case: Student *unable* to improvise (sphexish) vs. student *choosing* not to improvise (not sphexish).*
  6.  **Be Empirically Grounded:** Cannot contradict well-established ethology showing adaptive flexibility in "simple" creatures or rigidity breakdowns in "complex" ones under stress/novelty. *Case: Ants re-routing around obstacles; humans freezing under extreme duress.*

  **Important Refinements (Potentially Contentious):**
  7.  **Avoid Free Will Entanglement:** The theory should *not* depend on or make claims about metaphysical free will. Its scope is cognitive flexibility/adaptation. *Consideration: Free will debates are orthogonal and intractable for this operational distinction.* (Negotiable: Some camps *want* this link, but it's messy).
  8.  **Gradability:** The distinction should allow for degrees of sphexishness (more/less flexible). *Case: Comparing wasp (highly sphexish) vs. simple robot (moderately sphexish) vs. human autopilot (mildly sphexish).* (Negotiable: Some theories might posit a binary threshold).
  9.  **Mechanistic Explanation:** Should point to *how* flexibility or rigidity is implemented, not just label outcomes. *Case: Needing more than "it's dumb" vs "it's smart".* (Often negotiable in detail, but core requirement).

  **Tension Check:**
  *   **Gradability (D8) vs. Sharp Cutoff (Implicit in D1/D6):** There *is* tension. D8 demands a spectrum, while D1/D6 (especially linking to neurobiology) often implies a threshold (e.g., presence/absence of a specific neural structure or computational mechanism). **Resolution:** A theory *can* satisfy both by positing a *graded underlying mechanism* (e.g., richness of model, depth of hierarchy) that correlates with flexibility, while acknowledging that specific *behavioral tests* (like the wasp's loop) reveal a *functional* threshold where adaptation fails completely under perturbation. The mechanism is gradable; the failure mode in specific tests might look binary.

  **Quick Scorecard (Internal Model vs. Hierarchical Control):**

  *   **Internal Model (Represents Situation):**
      *   **Strengths:** Excels at D2 (Chess engine updates model), D3 (Human simulates milk alternatives), D4 (Robot fails due to lack of model, not just sensors). Explains D1 (Wasp lacks complex model).
      *   **Weaknesses:** Struggles with D8 (Model fidelity is gradable, but model *presence* feels binary?); D5 (Does a poor model imply "cannot" or just "didn't bother to model that"?); D7 (Models might feel agentive, but needn't imply free will). D9 depends on defining "model".

  *   **Hierarchical Control (Routines + Override):**
      *   **Strengths:** Handles D1 (No override triggered), D3 (Override engages for milk), D5 (Override capability exists but unused = "won't"), D8 (Clearly gradable hierarchy depth/complexity).
      *   **Weaknesses:** Less clear on D2 (How does override *learn* a new routine for chess?), D4 (Sensor limits might prevent error signal reaching override level). Can D6 be fully explained by override suppression under stress? D9 needs specification of "override" mechanism.

  **Thin Spots in List:** D6 (empirical grounding) is broad and needs careful operationalization. D9 (mechanism) is crucial but underspecified. D5 (capability vs. motivation) is phenomenologically tricky. The list doesn't deeply address *why* a system fails to adapt when it *could* (e.g., the student) – is it lack of model, override failure, or insufficient learning? This is key for extension. (Word Count: 648)
