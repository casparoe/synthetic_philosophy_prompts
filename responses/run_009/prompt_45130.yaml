answer: |-
  Based on Maya's track record, I'll first outline the candidate decision rules that fit her past verdicts, then predict her choice for the student council case, and finally propose a test case to distinguish between the rules. Her approach isn't purely about maximizing probability or expected value—it incorporates **asymmetric harm avoidance**.

  ### Candidate Rules Fitting Past Verdicts
  1. **Minimax Regret (Avoid Worst-Case Harm):**  
     Choose the action that minimizes the worst-case downside. Focus on avoiding actions where being wrong leads to catastrophic/unacceptable harm, even if that outcome isn't the most probable.  
     - **Fits all three past cases:**  
       - Vegetarian: Worst-case of eating meat (60% chance of "something awful") outweighed missing nuggets (40% chance of minor loss).  
       - Lying: Worst-case of truth-telling (100% chance of hurting grandma) outweighed 30% chance of moral wrong.  
       - Returning $50: Worst-case of keeping money (50% chance of cashier trouble) outweighed losing $50 (50% chance of no issue).  

  2. **Probability-Weighted Expected Harm (Risk-Averse Tilt):**  
     Calculate expected harm for each action by weighting outcomes with her probabilities, but assign extra weight to severe harms (e.g., nonlinear scaling). Prioritize avoiding high-severity, moderate-probability risks.  
     - **Fits all three past cases:**  
       - Vegetarian: Severe harm (animal suffering) scaled heavily, so avoiding meat wins despite 40% "no big deal" view.  
       - Lying: Harm of truth (hurt feelings) treated as more certain/immediate than abstract moral wrong (30%), so lying wins.  
       - Returning $50: Severe harm (cashier trouble) weighted heavily at 50%, overriding the 50% chance of no issue.  

  3. **Confidence Threshold for Harm Avoidance:**  
     Avoid an action if the probability of it causing severe harm exceeds a threshold (e.g., ≥40%). Otherwise, default to the higher-probability moral view.  
     - **Fits all three past cases:**  
       - Vegetarian: 60% chance of severe harm → avoid meat (exceeds threshold).  
       - Lying: 30% chance of severe harm (moral wrong) → below threshold → choose lie (70% "fine").  
       - Returning $50: 50% chance of severe harm (theft/trouble) → exceeds threshold → return money.  

  ### Why These Rules Fit, While Others Don’t
  - **"Side with Higher Confidence" Rule Fails:**  
    In the $50 case, she was 50/50 but didn’t flip a coin—she actively avoided potential harm.  
  - **Pure Expected Value Fails:**  
    In the lying case, if moral wrong is severe, expected harm of lying should dominate, but she lied anyway. Her choice suggests she discounted low-probability severe harms when alternatives had certain downsides.  
  - **All three candidate rules work** because they share a core principle: **When one choice risks severe harm with non-negligible probability, avoid it—even if that choice is "probabilistically correct."** The nuances differ in how they define "non-negligible" (threshold vs. minimax vs. nonlinear weighting).  

  ### Prediction for Student Council Case: Energy Retrofit
  - **Her Stance:** 55% future people matter = retrofit, 45% only current people matter = prom.  
  - **Minimax Regret Rule:**  
    - Worst-case of choosing **prom**: If future people matter (55%), you’ve deprived future generations of long-term benefits for trivial current gains. Harm: irreversible, intergenerational, large-scale.  
    - Worst-case of choosing **retrofit**: If only current people matter (45%), you’ve wasted $500 on an ineffective spend. Harm: local, temporary, fixable (e.g., fundraise later).  
    → Retrofit avoids the more severe regret.  
  - **Expected Harm Rule:**  
    - Retrofit harm (if wrong) = $500 loss for current students.  
    - Prom harm (if wrong) = compounding climate/financial burdens for future people (scaled as more severe).  
    → Higher expected harm for prom justifies retrofit.  
  - **Threshold Rule:**  
    45% chance of harm from retrofit is below typical thresholds (she acted at 30% in lying case), while 55% chance of harm from prom is above threshold → choose retrofit.  
  - **Verdict:** All rules point to **retrofit**. She’ll prioritize avoiding the asymmetric, severe downside of neglecting future people over the smaller, reversible loss of skipping prom subsidies.  

  ### Test Case to Distinguish the Rules
  To isolate which rule she uses, propose a scenario where:  
  - **Action A** has a *low-to-moderate probability* of causing **severe harm**, but the alternative (**Action B**) has a *certain, moderate harm*.  
  - **Example:** Maya finds a lost wallet with $1,000. She’s 35% confident keeping it is theft (severe harm: ruins someone’s finances), 65% confident it’s "finders keepers" (no harm). Returning it costs her time and effort (certain, moderate harm: she loses a week’s earnings).  

  - **How Rules Split:**  
    - **Minimax Regret:** Focuses on worst-case. Keeping risks severe harm (35%) → return wallet.  
    - **Threshold Rule:** If threshold is ~40%, 35% < threshold → keep wallet (higher confidence in "no harm").  
    - **Expected Harm Rule:** If severe harm is weighted heavily, keeping’s expected harm may still exceed returning’s certain moderate harm → return wallet.  

  - **Why This Works:**  
    - The 35% probability is below the vegetarian/$50 cases (50–60%) but above the lying case (30%).  
    - If she **keeps the wallet**, it supports **Threshold Rule** (she acts when severe-harm probability is low).  
    - If she **returns it**, it supports **Minimax Regret** or **Expected Harm** (she still avoids low-chance catastrophe).  
    - To split further, vary the probability (e.g., 25% severe harm) and observe if she flips.  

  ### Key Takeaway
  Maya’s rule is **harm-avoidant, not probability-maximizing**. For the student council, bet on **retrofit**—it avoids the high-stakes, irreversible downside. The wallet test case exposes differences in her risk tolerance for severe harms. If you run it, report back! I’d love to hear how it resolves your debate.
