answer: |-
  ## Joint Statement on Moral Responsibility: Strawsonian & Pereboomian Perspectives

  **Preamble:** After a decade of fruitful but often parallel debate, we seek to clarify points of agreement, precisely define remaining disagreements, identify the cruxes dividing us, and propose scenarios for testing those cruxes. Our goal is not conversion or compromise, but mutual understanding and progress on the shared problem of moral responsibility.

  **1. Points of Agreement:**

  1.  **The Phenomenology of Resentment:** Resentment (and kindred reactive attitudes like indignation) presents its object *as having done wrong* and *as having displayed ill will or objectionable quality of will* towards the resenting party or those they care about. It involves a perceived demand for regard that has been flouted.
  2.  **Responsiveness to Reasons (in Practice):** Reactive attitudes are *practically* responsive to specific types of arguments and information in everyday life. Excuses (e.g., "he didn't see me") and justifications (e.g., "she was defending herself") typically mitigate or dissolve resentment. Exemptions (e.g., "he's having a psychotic episode") suspend the participant stance entirely, shifting us towards the objective attitude.
  3.  **The Objective Attitude: Scope and Limits:** Adopting the objective attitude towards an agent (seeing them as causally determined, broken, immature, etc.) can be practically necessary for therapy, pedagogy, or self-protection. However, it fundamentally alters the relationship, rendering *genuine interpersonal engagement* (as understood within the participant stance) impossible or severely limited. It cannot replicate the *interpersonal connection* facilitated by reactive engagement.
  4.  **Shared Interpretations of Mitigating Practices:** Both sides interpret standard excusing and exempting conditions similarly. We agree on the relevance of coercion, ignorance, severe mental illness, and childhood in shaping character and mitigating blameworthiness *within the participant framework*. We agree that these conditions show the reactive attitudes are sensitive to considerations of *quality of will* and *capacity*.
  5.  **The Reality of the Participant Stance:** The participant stance, characterized by the natural susceptibility to reactive attitudes, is a pervasive, deeply ingrained feature of human interpersonal life. It is not a philosophical fiction.
  6.  **The Skeptic's Target:** The skeptic explicitly targets *basic desert* (blame/praise that is solely justified by the agent's past action and quality of will, independent of forward-looking consequences) as the element of our responsibility practices he finds metaphysically unjustified and practically problematic.

  **2. Disagreements Table:**

  | Disagreement Area | Strawsonian Wording                                                                                                                                 | Pereboomian Wording                                                                                                                                                                                                 |
  | :---------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **1. Foundation of Reactive Attitudes** | The participant stance, including susceptibility to reactive attitudes like resentment and guilt, is constitutive of interpersonal relationships. It does not require, nor can it be given, a general external justification grounded in ultimate control or desert; it is rationally irreducible. | While reactive attitudes are deeply ingrained, their justification for holding agents *desert-responsible* requires a type of ultimacy in sourcehood (being the ultimate source of actions in a way incompatible with determinism + indeterminism) that humans lack. The participant stance, while natural, is metaphysically unjustified in its desert claims. |
  | **2. Role of Resentment** | Resentment, as a natural response to ill will, is a necessary and justified expression of moral protest within interpersonal relationships. It affirms the moral demand and the significance of the victim's standing; its justification lies within the practice itself. | Resentment, due to its retributive core and intrinsic link to basic desert, is inherently problematic. Its expression is harmful and ultimately unjustified, regardless of its naturalness or role in protest. It should be progressively retired in favor of non-retributive moral address. |
  | **3. Necessity of Desert** | Reactive attitudes like resentment, gratitude, and guilt can be fully intelligible and justified *without* presupposing basic desert. They primarily express *interpersonal significance* and *evaluation of quality of will*, not a metaphysical claim about ultimate responsibility deserving suffering/benefit. | Genuine blame (as opposed to mere disapproval or disappointment) intrinsically involves a desert claim – the belief that the agent *deserves* to suffer (or feel pain) in some form *just because* of their wrong act and quality of will. This desert element is inseparable from the core phenomenology and function of resentment and indignation. |
  | **4. Feasibility & Desirability of Revision** | Attempting to systematically retire resentment and guilt would fatally undermine the fabric of interpersonal relationships, leading to detachment, indifference, or mere management of others. The objective attitude cannot sustain rich interpersonal bonds. | It is both possible and desirable to progressively cultivate a moral culture centered on forward-looking moral address (e.g., moral protest, encouragement, reconciliation efforts, protective measures) modeled on practices used with children and the mentally ill, minimizing reliance on desert-based reactive attitudes like resentment and indignation, without collapsing into indifference. |

  **3. Cruxes & Testing Scenarios:**

  *   **Crux (a): Nature of the Strawsonian Case & the Skeptic's Demand**
      *   **Question:** Is the Strawsonian defense primarily: (i) a psychological impossibility claim ("We *cannot* abandon the participant stance"), (ii) a normative vindication ("The participant stance is *justified* on its own terms"), or (iii) a descriptive plea ("This *is* our concept of responsibility")? Which aspect does the skeptic's demand for justification target?
      *   **Strawsonian Position:** The core argument is primarily (ii) normative and (iii) descriptive. It argues that the participant stance *is* our framework for interpersonal relationships and that its internal standards *provide* justification for reactive attitudes within that framework. The skeptic's demand for an *external*, ultimate control-based justification fundamentally misunderstands and illegitimately imposes standards alien to the practice itself. The impossibility claim (i) is a strong empirical auxiliary.
      *   **Skeptic Position:** The Strawsonian argument often relies on (i) psychological impossibility to deflect the normative challenge. However, the skeptic's demand is squarely (ii) normative: *Is* the desert-entailment embedded in our reactive attitudes *metaphysically and morally justified*? The descriptive point (iii) is granted, but deemed insufficient for justification. The impossibility claim (i) is an empirical assertion needing testing.
      *   **Testing Scenario - "The Tranquil Vale":** Imagine a stable, cooperative community ("The Vale") that explicitly raises its children and structures adult interaction using Pereboomian forward-looking moral address. Moral expectations are clear and enforced (e.g., through discussion, reparative requests, temporary separation, social encouragement). Expressions of resentment and indignation are actively discouraged and seen as counterproductive. Children are taught to express hurt and protest wrongs without resentment-inducing blame.
      *   **Strawsonian Prediction:** This community would inevitably either: (1) Develop functionally equivalent analogues of resentment and indignation ("moral disappointment," "protest-sorrow") carrying the same desert-implying weight, (2) Suffer from weakened interpersonal bonds, increased instrumentalization of others, and less effective norm enforcement, or (3) Collapse into a culture of universal, perhaps doctrinaire, forgiveness lacking genuine moral protest ("You broke my trust." "Indeed. Let's move on.").
      *   **Skeptic Prediction:** The Vale could maintain strong interpersonal bonds based on mutual care, respect, and shared values. Moral protest would be clear and effective ("What you did harmed me and violated our trust; we need to discuss how to fix this and prevent recurrence") without the retributive sting of resentment. Norm enforcement would be robust through non-retributive means. Relationships would be characterized by understanding and reconciliation rather than lingering blame.

  *   **Crux (b): Intrinsic Desert & Severability**
      *   **Question:** Do reactive attitudes like resentment intrinsically involve a basic desert claim? Can they be conceptually or practically severed from such a claim while retaining their core interpersonal function?
      *   **Strawsonian Position:** Resentment's core is the protest against ill will and affirmation of the victim's standing. While it *feels* painful and the wrongdoer may *experience* it as something they deserve, the attitude itself is not *essentially* or *justifiedly* about inflicting desert-based suffering. It can be conceived as protest-severable-from-desert. Guilt is even clearer: it primarily constitutes recognition of wrong and motivates repair, not necessarily a desire for deserved suffering.
      *   **Skeptic Position:** The phenomenology of resentment intrinsically presents the wrongdoer as *deserving* to feel bad or suffer in some way *because* of their action. This desert element is not merely a contingent feeling but is constitutive of the attitude's nature as *blame*. Attempts to sever it result in a different attitude (e.g., sadness, disappointment, non-retributive protest), not genuine resentment. Guilt, while perhaps more complex, still involves the painful sense that one *deserves* condemnation.
      *   **Testing Scenario - "The Perfect Manipulator (Dupe v. Originator)":** Agent A is created by neuroscientists who implant a complete psychology (memories, beliefs, desires, character traits) via direct brain manipulation, ensuring A is causally determined to choose a specific wrong act (theft). Agent B is an ordinary human, causally determined by genes/environment, who commits the *same* theft, exhibiting the *same* quality of will (selfish disregard). Both A and B report identical phenomenal experiences pre, during, and post-act (including any felt deliberation). Victim V experiences identical resentment towards both.
      *   **Strawsonian Prediction:** V's resentment towards both A and B is equally appropriate *from the participant perspective* because both displayed identical ill will. The history of manipulation is irrelevant to the *interpersonal* meaning of the act *at the time*. Resentment targets the quality of will manifested, not ultimate origins. (Origins might exempt, but here quality of will *is* present).
      *   **Skeptic Prediction:** Resentment towards A is clearly misplaced because A is merely a puppet; no ultimacy exists. Resentment towards B *feels* appropriate, but the manipulation argument reveals this feeling is based on an illusion; B lacks the required ultimacy just as much as A. The case shows that *if* resentment intrinsically involves a desert claim requiring ultimacy (as it does), then resentment towards *both* is ultimately unjustified, regardless of phenomenology. The feeling of appropriateness towards B stems from ignorance of the manipulation-like nature of B's actual determination.

  *   **Crux (c): Symmetry of Revision (Self vs. Other)**
      *   **Question:** Does the skeptic's revisionary program apply with equal force to self-directed reactive attitudes (guilt, remorse, agent-regret) as it does to other-directed attitudes like resentment? Or do first-personal attitudes play a unique, non-retributive, agency-constituting role?
      *   **Strawsonian Position:** Guilt is fundamentally different. It is not primarily about suffering deserved; it is the acknowledgment of wrongness *by the agent*, constitutive of moral understanding and commitment. It motivates repair and reconciliation. Retiring guilt would undermine moral agency itself. The skeptic’s program is asymmetrical and unstable; guilt must remain.
      *   **Skeptic Position:** While guilt may have important forward-looking functions (motivating repair), its painful phenomenology still typically involves an element of feeling *deserving* of condemnation or pain *because* of one's past action. This desert element is as metaphysically unjustified as in resentment. The revisionary program should aim to cultivate agent-regret and commitment to repair *without* the desert-laden component of guilt. Forward-looking self-addressing attitudes can still constitute agency.
      *   **Testing Scenario - "The Guiltless Repairer":** Imagine an individual, Cal, raised in the Tranquil Vale. Cal commits a wrong (e.g., breaks a promise causing harm). Cal experiences no guilt. Cal clearly recognizes the wrongness of the act ("That violated our agreement and harmed you"), feels sincere agent-regret ("I wish I hadn't done that"), feels empathy for the victim, and is strongly motivated to apologize, make amends, and avoid repeating the act. Cal experiences no sense of *deserving* to feel bad or be punished.
      *   **Strawsonian Prediction:** Cal lacks a crucial element of full moral understanding and commitment. The absence of guilt signifies a detachment from the moral demand; Cal's response is more akin to recognizing a technical fault than a moral failing. The motivation to repair may be reliable, but it lacks the depth and personal stake constitutive of genuine responsibility held by the self. Relationships would feel shallower.
      *   **Skeptic Prediction:** Cal demonstrates a morally adequate, perhaps superior, form of moral agency. The recognition of wrongness, agent-regret, empathy, and motivation for repair are intact and effective. The absence of the painful desert component (guilt) removes a harmful element without diminishing Cal's responsiveness to moral reasons or commitment to relationships. This is the ideal to cultivate.

  *   **Crux (d): The Function of Blame's Sting** (Additional Crux)
      *   **Question:** Is the painful "sting" of blame (resentment felt by the blamed, guilt felt by the blamer) an essential, functional component of moral address and norm maintenance, or is it a harmful side-effect separable from the core communicative and motivational functions?
      *   **Strawsonian Position:** The sting is partly constitutive of the *interpersonal significance* of the moral demand being registered. It signals the seriousness of the breach and the reality of the relationship. Removing it risks making moral address merely advisory or informational, losing its distinctive interpersonal force and weight.
      *   **Skeptic Position:** The sting is primarily a retributive element linked to the desert claim. The core communicative (protest, demand for recognition) and motivational (deterrence, prompting repair) functions of moral address can be achieved through clear, forceful, non-retributive expression (e.g., expressing hurt, stating the wrong clearly, requesting repair, imposing non-punitive consequences). The sting is harmful and unnecessary.

  **4. Verbal Disagreement & Residual Substance:**

  *   **Verbal Element:** A significant source of apparent conflict lies in the term **"holding responsible."** The Strawsonian uses it broadly to encompass *any* form of moral address within the participant stance, including reactions based purely on quality of will assessment and protest, regardless of metaphysical desert claims. The Pereboomian skeptic typically uses "holding responsible" specifically to mean *holding deserving of blame/praise in the basic desert sense*.
  *   **Why Verbal:** This difference in scope is primarily terminological. Both agree that we *do* react to others with attitudes like resentment and that we *do* engage in moral address involving protest, demand for recognition, and calls for amendment. The disagreement is not about the existence of these practices, but about the *justification and permissibility* of the *specific attitudes* involving desert-entailment (as the skeptic defines it) within those practices.
  *   **Residual Substantive Disagreement:** Once terminology is clarified ("moral address" vs. "desert-entailing blame"), the core substantive disagreements remain:
      1.  Whether attitudes like resentment intrinsically involve and are justified by a metaphysically problematic basic desert claim (Crux b).
      2.  Whether the interpersonal practices constitutive of relationships *require* attitudes involving such a desert claim, or whether functionally equivalent but desert-free practices are possible and desirable (Crux a, c, d).
      3.  Whether the demand for a justification of responsibility grounded in ultimacy is legitimate or represents a category error when applied to the participant stance (Crux a).

  **Closing:** This document represents our shared commitment to moving beyond talking past one another. We have identified genuine common ground, precisely framed our persistent disagreements in mutually acceptable terms, and isolated the fundamental cruxes – particularly concerning the nature and necessity of desert-entailment within reactive attitudes and the feasibility of desert-free moral address. The proposed testing scenarios offer concrete, albeit hypothetical, avenues for further exploration of these cruxes. Our enduring differences lie not merely in terminology, but in deep convictions about the metaphysics of agency, the necessary structure of interpersonal understanding, and the best path towards a morally adequate future. The debate continues, now with sharper focus.
