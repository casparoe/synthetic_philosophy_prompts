  Crucially, no named real people - invented Director-General "Celia Thorne" gives quotable lines without targeting individuals. The democracy mention must be subtle, maybe buried in procedural notes about "data collection environments." Ending should feel bureaucratically triumphant while leaving readers queasy about the implications. 

