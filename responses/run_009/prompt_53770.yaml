prompt: |-
  I am a PhD candidate in computer science writing a dissertation on fairness in machine learning, and this year I am on a part-time secondment to the Algorithmic Review Board of a mid-sized public health agency. The board has three reviewers — a lawyer, a policy analyst, and me — and it must sign off on every predictive model the agency deploys on individuals: readmission-risk scores, automated fraud flags on provider claims, a triage model for scheduling specialist appointments. We have roughly two weeks per model, and I am the only one on the board who can read a confusion matrix. Before I return to my dissertation, I want to leave them with a procedure they can run without me.

  Please take the role of a senior expert in algorithmic fairness and public-sector model governance — someone who knows the technical literature thoroughly but has also sat on review boards and understands how these decisions actually get made. Before drafting, think carefully about what the procedure must accomplish and what will predictably go wrong when non-statisticians run it; keep that preliminary thinking brief and deliver only the finished procedure.

  The intellectual core I want operationalized is the family of impossibility results in fair machine learning: when outcome base rates differ across groups, several intuitively compelling fairness requirements become mutually unsatisfiable — most prominently, calibration within groups cannot coexist with equal false-positive and false-negative rates across groups. The consequence I care about is this: "the model must be fair" is not a specification. Choosing which fairness criterion to enforce is choosing which disparity to tolerate, and that is a value judgment about who bears the cost of error, not a technical fact that the statistics can settle. The procedure's whole point is to drag that choice into the open and put a name on it, rather than letting it hide inside the selection of a metric.

  The constraints under which the procedure must work:

  - The reviewers have no statistical background beyond what I can teach them in one afternoon; every step must be runnable by them alone, with plain-language definitions of any quantity they must inspect.
  - Two weeks per model, most of which is spent chasing documentation, so the fairness-specific portion of the work gets perhaps two days.
  - Every decision must end in a public-facing, one-page justification that a non-technical administrator can read and defend.
  - The board has adopted a rule I would like you to build the procedure around rather than bolt on at the end: no model may be approved on any fairness criterion without an attached "tolerated-disparity statement" — a short paragraph naming the specific disparity the approval accepts, which group bears it, and why the board finds that acceptable. A good procedure should generate that statement almost as a byproduct of its steps.

  Please structure your response as follows, with these sections in this order and approximate lengths:

  1. **Overview** (~half a page): what the procedure does, what single question it ultimately puts to the board, and what it deliberately does not attempt to decide.
  2. **The steps** (~two pages): a numbered sequence the reviewers run in order, from the first document request to final sign-off. For each step, state what counts as a sufficient answer, what advances the model to the next step, where the procedure terminates in a rejection, and where it stops and hands a genuine value judgment over to the board. Those handoff points should be unmistakable — the reviewers must never believe a step decided something that was actually theirs to decide.
  3. **Worked applications** (~one and a half pages): run the procedure on three cases: (a) a readmission-risk score used to allocate scarce post-discharge nursing visits, where base rates differ substantially across neighborhoods that proxy for race; (b) a fraud-detection model flagging provider claims for manual review, where the cost of a false positive falls on providers and of a false negative on the public purse; (c) a specialist-scheduling triage model that is well calibrated within every group but has visibly unequal false-negative rates for the smallest patient subgroup. At least one of the three should end in an answer the board will find unwelcome, and you should say so plainly rather than softening it.
  4. **Failure modes** (~half a page): where the procedure will misfire in practice, what it cannot settle even in principle, and what it would be dishonest for it to pretend to decide.

  Throughout, be candid about the points where the procedure is a judgment call dressed up as process. I would much rather the board know exactly where they are the ones deciding than let them believe the paperwork decided for them.
reasoning: |-
  We are constructing a procedure for an Algorithmic Review Board with non-technical members to evaluate fairness in deployed predictive models. The core insight is that under base rate differences, fairness criteria conflict, and thus the choice of which criterion to enforce is a value judgment about who bears the cost of error. The procedure must force the board to explicitly choose and document that choice.

  Constraints:
  - Reviewers have minimal statistical background.
  - Fairness review must take about two days per model.
  - Output a public one-page justification and a "tolerated-disparity statement".
  - Build around the rule of having a tolerated-disparity statement.

  Structure:
  1. Overview
  2. Steps (numbered sequence)
  3. Worked applications (three cases)
  4. Failure modes

  Let's proceed.

  ---

  **1. Overview**

  The Fairness Assessment Procedure (FAP) is designed to force a structured, value-driven decision about which fairness criterion to prioritize when deploying a predictive model. It does not decide what is fair; instead, it reveals the inherent trade-offs in fairness definitions and requires the board to explicitly choose which disparity they are willing to tolerate. The procedure culminates in a single question to the board: "Given the model's performance and the trade-offs we have identified, which fairness criterion should be enforced, and why is the resulting disparity acceptable?" 

  The procedure is built on three pillars: 
  - **Transparency**: It requires the model developers to provide specific performance metrics disaggregated by relevant groups (e.g., race, gender, neighborhood).
  - **Trade-off Exposure**: It demonstrates the incompatibility of key fairness criteria (calibration, equal false positive rates, equal false negative rates) when base rates differ.
  - **Accountability**: It produces a "tolerated-disparity statement" as a byproduct, which names the chosen criterion, the disparity it tolerates, the group burdened, and the justification.

  The procedure does not attempt to:
  - Define what groups are relevant (this must be provided by the agency based on legal, policy, or ethical considerations).
  - Determine if the model is "fair enough" in absolute terms (that is the board's judgment).
  - Adjust or re-train the model (it is an assessment of the model as presented).

  **2. The Steps**

  *Preparation*: The board must have defined the legally or policy-relevant groups (e.g., by race, gender, age, neighborhood) for which fairness is to be assessed. These groups must be provided by the agency and included in the model's data.

  **Step 1: Request and Verify Documentation**
  - **Request**: The board requests from the model developers:
    (a) The model's confusion matrices (or equivalent performance metrics) for each predefined group, including the overall population.
    (b) The prevalence (base rate) of the positive class (the event being predicted, e.g., readmission, fraud) in each group.
    (c) The cost or harm matrix: a statement of the real-world consequences of a false positive and a false negative for each group (if these consequences differ by group, they must be specified).
    (d) A clear definition of the model's decision threshold (if applicable).
  - **Sufficiency**: Documentation is sufficient if it includes (a)-(d) and the metrics are computed on a representative test set (not training or validation sets).
  - **Advance**: If documentation is complete, proceed to Step 2. 
  - **Terminate**: If documentation is incomplete or the test set is not representative, reject the model with a request for resubmission.

  **Step 2: Compute Key Fairness Metrics**
  - **Action**: The board (with the help of a provided template or simple software tool) computes the following for each group and the overall population:
    (a) False Positive Rate (FPR) = FP / (FP + TN) [plain language: % of non-events incorrectly flagged]
    (b) False Negative Rate (FNR) = FN / (FN + TP) [plain language: % of events missed]
    (c) Positive Predictive Value (PPV) = TP / (TP + FP) [plain language: % of positive predictions that are correct]
    (d) Negative Predictive Value (NPV) = TN / (TN + FN) [plain language: % of negative predictions that are correct]
    (e) Prevalence (Base Rate) = (TP + FN) / (TP + FP + TN + FN) [plain language: how often the event happens in the group]
  - **Sufficiency**: The board must have these metrics for every group and overall.
  - **Advance**: Always proceed to Step 3 after computation.

  **Step 3: Check for Base Rate Differences**
  - **Action**: Compare the prevalence (base rate) across groups. 
    - If the base rates are approximately equal (e.g., within 5 percentage points) across all groups, then note that all fairness criteria may be simultaneously satisfiable, and proceed to Step 4A.
    - If the base rates differ substantially (e.g., by more than 5 percentage points) in any group, then proceed to Step 4B.
  - **Judgment Call**: The threshold for "substantial" is set by policy (5% is a starting point, but the board may adjust). This step does not require a board decision; it is a mechanical check.

  **Step 4A: Base Rates Similar — Check All Criteria**
  - **Action**: Because base rates are similar, check if the model satisfies:
    (a) Calibration: PPV (and if available, predicted probability vs. actual rate) should be similar across groups.
    (b) Equal FPR: FPR should be similar across groups.
    (c) Equal FNR: FNR should be similar across groups.
  - **Sufficiency**: If all three (a, b, c) are approximately satisfied (again, within a tolerance, e.g., 5 percentage points), then the model is "fair" by multiple criteria. Proceed to Step 5 for final approval.
  - **Terminate**: If any of (a, b, c) are violated beyond tolerance, then the board must note that even with similar base rates, the model fails a fairness criterion. Proceed to Step 4B to handle the trade-off.

  **Step 4B: Base Rates Different or Step 4A Failed — Expose Trade-offs**
  - **Action**: The board must now explicitly choose one of the following fairness criteria to enforce, knowing that the others will be violated due to base rate differences. The criteria are:
    - **Criterion 1: Calibration** (PPV similar across groups). This typically tolerates unequal FPR and FNR. The cost: groups with higher base rates will have higher FNR (more events missed) and groups with lower base rates will have higher FPR (more false alarms).
    - **Criterion 2: Equal FPR** (similar false alarm rates). This tolerates unequal PPV (calibration) and FNR. The cost: groups with higher base rates will have higher FNR (more events missed) and groups with lower base rates will have lower PPV (more false positives relative to true positives).
    - **Criterion 3: Equal FNR** (similar miss rates). This tolerates unequal PPV and FPR. The cost: groups with higher base rates will have higher FPR (more false alarms) and groups with lower base rates will have lower NPV (more false negatives relative to true negatives).
  - **Sufficiency**: The board must choose one criterion and document the resulting disparities in the other two. They must also verify that the chosen criterion is satisfied (within tolerance) for the model. If the chosen criterion is not satisfied, the model must be rejected (or sent back for threshold adjustment if possible).
  - **Handoff**: This step requires a board decision. The board must choose which criterion to enforce and thus which disparities to tolerate. The procedure stops until they make this choice.

  **Step 5: Draft the Tolerated-Disparity Statement and Public Justification**
  - **Action**: Based on the choice in Step 4, draft two documents:
    (a) **Tolerated-Disparity Statement**: A short paragraph naming:
        - The chosen fairness criterion (e.g., "We enforce calibration").
        - The specific disparity(ies) tolerated (e.g., "This results in higher false negative rates for Group X and higher false positive rates for Group Y").
        - The group(s) that bear the cost (e.g., "Group X will experience more missed events, and Group Y will experience more false alarms").
        - The justification for accepting this disparity (e.g., "Because the harm of false positives in Group Y is less severe than the harm of false negatives in Group X, and because calibration ensures that the risk scores are equally meaningful across groups").
    (b) **Public Justification**: A one-page non-technical summary for administrators, including:
        - The model's purpose and overall performance.
        - The fairness criterion chosen and why it was selected (linking to the agency's mission or values).
        - The existence of trade-offs and the agency's acceptance of the resulting disparities.
        - A commitment to monitor and re-assess.
  - **Advance**: The board approves the model and the statements.

  **Step 6: Final Sign-off**
  - **Action**: The board signs off on the model, attaching the Tolerated-Disparity Statement and Public Justification.
  - **Terminate**: If the board cannot agree on the criterion or the statement, the model is rejected.

  **3. Worked Applications**

  **Case (a): Readmission-risk score for allocating nursing visits, with base rates differing by neighborhood (proxy for race).**

  - Step 1: Documentation received. Base rates: Neighborhood A (high-income): 5%, Neighborhood B (low-income): 20%.
  - Step 2: Metrics computed. FPR: A: 10%, B: 15%; FNR: A: 30%, B: 50%; PPV: A: 40%, B: 60%.
  - Step 3: Base rates differ substantially (5% vs 20%), so go to Step 4B.
  - Step 4B: The board must choose a criterion. 
    - If they choose Calibration (PPV similar): Current PPV is 40% vs 60% (a 20-point gap) — not satisfied. They might adjust the threshold to achieve calibration. Suppose after adjustment, PPV is 50% in both, then FPR and FNR become: A: FPR=15%, FNR=40%; B: FPR=25%, FNR=30%. Now, calibration is achieved, but FPR is higher in B (25% vs 15%) and FNR is higher in A (40% vs 30%). The cost: Neighborhood B (low-income) has more false alarms (wasting nursing resources on those not needing), and Neighborhood A (high-income) has more missed cases (needy patients not getting visits). 
    - Tolerated-Disparity Statement: "We enforce calibration so that a risk score of 50 has the same meaning in every neighborhood. This results in higher false positive rates in low-income neighborhoods (leading to over-allocation of visits to some who don't need them) and higher false negative rates in high-income neighborhoods (leading to under-allocation to some who do). We accept this because we believe it is more important that the score be interpretable and not over-penalize low-income neighborhoods by excessive false negatives (which would leave their truly needy without help)."
  - Outcome: The board may find this unwelcome because it shifts the burden to high-income neighborhoods (which might be unexpected) and because over-allocation in low-income neighborhoods might be seen as wasteful. But note: without calibration, a score of 50 might mean a 40% chance in A and 60% in B, leading to unfair resource allocation.

  **Case (b): Fraud-detection model flagging provider claims.**

  - Step 1: Documentation received. Groups: Providers serving urban vs rural areas. Base rates: Urban: 10%, Rural: 2%. Costs: False positive (FP) = provider bears cost (administrative burden, delayed payment); False negative (FN) = public bears cost (fraudulent claim paid).
  - Step 2: Metrics: Urban: FPR=5%, FNR=20%; Rural: FPR=10%, FNR=40%.
  - Step 3: Base rates differ (10% vs 2%), so Step 4B.
  - Step 4B: The board must choose. 
    - Option: Equal FPR (to treat providers equally in false alarms). Current FPR is 5% vs 10% — not equal. Adjust threshold to make FPR=7.5% for both. Then FNR becomes: Urban: 25%, Rural: 45%. Now, FPR equal, but FNR higher in rural areas. Cost: Rural providers have the same false alarm rate as urban, but the public purse loses more from undetected fraud in rural areas. 
    - Tolerated-Disparity Statement: "We enforce equal false positive rates to ensure that honest providers in all areas face the same burden of false flags. This results in higher false negative rates in rural areas, meaning more fraud goes undetected there, costing the public more. We accept this because the burden of false flags on rural providers (who may have fewer resources) is deemed more harmful than the additional fraud losses in rural areas, which are smaller in absolute terms due to lower claim volume."
  - Outcome: The board might find this unwelcome because it explicitly accepts higher fraud losses in rural areas.

  **Case (c): Specialist-scheduling triage model, well calibrated but unequal FNR for a small subgroup.**

  - Step 1: Groups: Majority group (M) and small minority (S). Base rates: M: 15%, S: 15% (same). Calibration: PPV is 80% in both, so calibrated.
  - Step 2: Metrics: FPR: M: 10%, S: 10%; FNR: M: 20%, S: 40%.
  - Step 3: Base rates same, but Step 4A: Check all criteria. Calibration (OK), FPR (equal), but FNR (20% vs 40%) — not equal. So proceed to Step 4B (because one criterion fails).
  - Step 4B: The board must choose. They could:
    - Choose Calibration: Already satisfied, but FNR disparity remains. They accept that the small subgroup has higher misses. 
    - Or choose Equal FNR: Then they must adjust the threshold for group S to reduce FNR to 20%. But then calibration is broken: for group S, PPV would drop (because lowering threshold increases FP, so PPV decreases). Suppose after adjustment, FNR=20% in S, then FPR in S becomes 20% (up from 10%) and PPV drops to 60%. Now, calibration is violated (PPV: M:80%, S:60%). 
    - The board might choose to accept the current model (calibration and equal FPR, but not equal FNR). 
    - Tolerated-Disparity Statement: "We enforce calibration and equal false positive rates. This results in a higher false negative rate for the small subgroup S, meaning that patients in S who need specialist appointments are more likely to be missed. We accept this because the model is calibrated and has equal false alarms across groups, and we believe that the harm of increasing false alarms in S (which would delay care for many) is worse than the current level of misses. We will monitor the impact on S."
  - Outcome: Unwelcome because the small subgroup already faces health disparities, and this model exacerbates it by missing more of their true needs.

  **4. Failure Modes**

  - **Inadequate Group Definitions**: The procedure relies on predefined groups. If the agency does not collect data on a relevant group (e.g., intersectional groups) or if the groups are poorly defined, the assessment may miss critical disparities.
  - **Threshold Adjustments**: The procedure assumes that thresholds can be adjusted per group to satisfy a criterion. But in some models (e.g., those with a fixed threshold or where group membership is not available at prediction time), this may not be feasible. The procedure might then lead to rejection of models that could be fixed with more work.
  - **Ignored Costs**: The cost matrix in Step 1 is critical. If the agency cannot articulate the real-world costs of false positives and false negatives (or if they differ in ways not captured), the board's choice in Step 4B may be misinformed.
  - **Base Rate Estimation**: If the test set is not representative, base rates and metrics will be wrong. The procedure cannot detect this; it relies on the data provided.
  - **Multiple Criteria**: The procedure focuses on three criteria, but there are others (e.g., equal opportunity, demographic parity). The board may need to consider these if legally required, but the core trade-offs remain.
  - **The Illusion of Objectivity**: The procedure forces a choice, but the board might still believe that the chosen criterion is "fairer" in some absolute sense. It is crucial to emphasize that this is a value choice, not a technical one.
  - **Model Complexity**: The procedure uses simple metrics (FPR, FNR, PPV). For models with continuous scores, more nuanced analysis (e.g., AUC, PR curves) might be needed, but the board may not be equipped for that. We assume the model is used with a threshold to make binary decisions.

  In the end, the procedure is a tool to make value judgments explicit and accountable, not to eliminate them.
answer: |-
  ### **1. Overview**  
  The Fairness Trade-off Procedure (FTP) operationalizes a core insight of algorithmic fairness: when outcome base rates differ across groups (e.g., race, gender, neighborhood), no model can simultaneously satisfy all intuitive fairness criteria. The FTP forces the board to explicitly choose **one** criterion to enforce—calibration, equal false-positive rates (FPR), or equal false-negative rates (FNR)—knowing this choice tolerates specific disparities that burden certain groups. The procedure does *not* decide what is "fair" or which group *should* bear costs; it reveals the unavoidable trade-offs and hands that value judgment to the board.  

  The FTP culminates in a single question: **"Which fairness criterion will we enforce, given that it requires tolerating a specific, quantifiable disparity—and why is that disparity acceptable in the context of this model?"** The output is a public justification and a "tolerated-disparity statement" (TDS), as required by the board’s rules.  

  **What FTP does not do**:  
  - Define relevant groups (this is provided by the agency).  
  - Assess model accuracy or overall utility (assumed pre-vetted).  
  - Resolve whether disparities are *morally_ acceptable (the board’s role).  
  - Adjust the model technically (it evaluates "as-is").  

  ---

  ### **2. The Steps**  
  *Definitions for reviewers*:  
  - **False Positive (FP)**: Someone incorrectly flagged (e.g., a healthy patient labeled high-risk).  
  - **False Negative (FN)**: Someone incorrectly missed (e.g., a high-risk patient labeled low-risk).  
  - **FPR**: % of non-events flagged incorrectly (FP / [TN + FP]).  
  - **FNR**: % of events missed (FN / [TP + FN]).  
  - **Calibration**: When a risk score means the same thing in all groups (e.g., 80% risk = 80% event occurrence).  
  - **Base rate**: How often the event (e.g., readmission) happens in a group.  

  **Step 1: Verify documentation and compute metrics**  
  - *Action*: Request from developers:  
    - Confusion matrices for **all predefined groups** (e.g., race, neighborhood).  
    - Base rates for each group.  
    - Harm statements: "Who bears the cost of a FP? Of a FN?" (e.g., FP burdens providers; FN burdens taxpayers).  
  - *Sufficiency*: Metrics must be from a held-out test set; harms must be concrete (e.g., "FP = provider audit costs; FN = lost taxpayer funds").  
  - *Advance*: If complete, compute FPR, FNR, and calibration (PPV) for each group.  
  - *Terminate*: If data is missing, groups undefined, or harms unstated. **Reject with "Insufficient documentation."**  

  **Step 2: Check base rate differences**  
  - *Action*: Calculate base rates for all groups. If differences are ≤5% points, proceed to Step 3A. If >5% points, proceed to Step 3B.  
  - *Why*: Large base rate differences (>5%) guarantee that calibration, equal FPR, and equal FNR cannot coexist.  
  - *Judgment call*: The 5% threshold is arbitrary but pragmatically alerts to trade-offs. Reviewers may adjust it via board policy.  

  **Step 3A: Base rates similar — Check for "automatic" fairness**  
  - *Action*: Verify if all three criteria hold within 5% points:  
    - Calibration (PPV difference ≤5% across groups).  
    - Equal FPR (FPR difference ≤5%).  
    - Equal FNR (FNR difference ≤5%).  
  - *Advance*: If all hold, the model satisfies all fairness criteria. Proceed to Step 4.  
  - *Terminate*: If any criterion fails, proceed to Step 3B (trade-offs apply).  

  **Step 3B: Base rates differ or Step 3A failed — Expose trade-offs**  
  - *Action*: For each group, display:  
    - FPR, FNR, calibration (PPV).  
    - Harm statements (from Step 1).  
  - *Sufficiency*: A table comparing metrics and harms across groups (see examples in Section 3).  
  - *Handoff*: **This step does not decide anything.** It sets up the board’s value judgment in Step 4.  

  **Step 4: Choose a fairness criterion (board decision)**  
  - *Action*: The board must **choose one** criterion to enforce:  
    - **Option 1: Calibration** (PPV equal across groups).  
      - *Tolerated disparity*: Unequal FPR and FNR.  
      - *Cost*: Groups with higher base rates suffer higher FNR; groups with lower base rates suffer higher FPR.  
    - **Option 2: Equal FPR** (same % of non-events incorrectly flagged).  
      - *Tolerated disparity*: Broken calibration and unequal FNR.  
      - *Cost*: Groups with higher base rates suffer higher FNR; groups with lower base rates suffer worse PPV (more false alarms).  
    - **Option 3: Equal FNR** (same % of events missed).  
      - *Tolerated disparity*: Broken calibration and unequal FPR.  
      - *Cost*: Groups with higher base rates suffer higher FPR; groups with lower base rates suffer worse NPV (more missed events).  
  - *Advance*: If the chosen criterion is satisfied within 5% points, proceed to Step 5.  
  - *Terminate*: If the chosen criterion is not satisfied, **reject the model** ("Chosen fairness criterion not met").  
  - *Handoff*: **This is the core value judgment.** The board must agree on which disparity to tolerate and why.  

  **Step 5: Draft the tolerated-disparity statement (TDS) and public justification**  
  - *Action*: Write:  
    - **TDS** (1 paragraph): "We enforce [chosen criterion]. This tolerates [specific disparity], burdening [group]. We accept this because [justification linked to harms]."  
    - **Public justification** (1 page): Non-technical summary of the trade-off, the board’s rationale, and monitoring commitments.  
  - *Sufficiency*: TDS must name the burdened group and tie the justification to Step 1 harm statements.  
  - *Advance*: To sign-off.  

  **Step 6: Sign-off or reject**  
  - *Action*: Approve if TDS and public justification align with Step 4 choice.  
  - *Terminate*: If the board cannot agree, **reject** ("No consensus on tolerated disparity").  

  ---

  ### **3. Worked Applications**  
  **Case (a): Readmission-risk model for nursing visits**  
  - *Context*: Base rate: 5% (Affluent neighborhood A), 20% (Low-income neighborhood B). Harm: FP = wasted nursing resources; FN = avoidable readmission.  
  - *Metrics*: FPR (A: 10%, B: 15%); FNR (A: 30%, B: 50%); Calibration (PPV similar at 40% vs 42%).  
  - *Step 4 choice*: **Enforce calibration** (PPV similar).  
    - *Trade-off*: Higher FNR in Group B (50% vs 30%) → more missed high-risk patients in low-income areas.  
    - *TDS*: "We enforce calibration so risk scores mean the same in all neighborhoods. This tolerates higher false-negative rates in low-income neighborhoods, burdening residents who are missed for nursing visits. We accept this because calibration ensures efficient resource allocation, and we mitigate harm through post-discharge outreach programs."  
  - *Outcome*: **Unwelcome** — The board explicitly accepts that low-income patients bear higher avoidable readmission risks.  

  **Case (b): Fraud-detection model for provider claims**  
  - *Context*: Groups: Urban (base rate 10%) vs. rural (base rate 2%) providers. Harm: FP = provider audit costs; FN = taxpayer losses.  
  - *Metrics*: FPR (Urban: 5%, Rural: 10%); FNR (Urban: 20%, Rural: 40%).  
  - *Step 4 choice*: **Enforce equal FPR** (same false-alarm burden).  
    - *Trade-off*: Rural FNR rises to 45% after threshold adjustment → more fraud missed in rural claims.  
    - *TDS*: "We enforce equal false-positive rates to treat all providers fairly. This tolerates higher false-negative rates in rural areas, burdening taxpayers through undetected fraud. We accept this because rural providers have fewer resources to contest false flags, and absolute fraud losses are lower due to smaller claim volumes."  
  - *Outcome*: **Accepted** — Trade-off aligns with policy goal of provider fairness.  

  **Case (c): Specialist-scheduling triage model**  
  - *Context*: Groups: Majority (base rate 15%), Small subgroup (base rate 15%). Calibration holds (PPV: 80% both), but FNR: Majority 20%, Small subgroup 40%.  
  - *Step 4 choice*: **Enforce calibration** (it already holds).  
    - *Trade-off*: Higher FNR in small subgroup → missed care for marginalized patients.  
    - *TDS*: "We enforce calibration to ensure consistent clinical interpretation of risk scores. This tolerates higher false-negative rates for [small subgroup], burdening patients who are deprioritized for specialist care. We accept this because calibration prevents over-allocation errors, and we offset harm via a patient advocate hotline."  
  - *Outcome*: **Unwelcome** — The board admits the model exacerbates disparities for a vulnerable group but prioritizes clinical consistency.  

  ---

  ### **4. Failure Modes**  
  **Predictable misfires**:  
  - **Garbage in, garbage out**: If developers submit biased test data (e.g., undersampling disadvantaged groups), FTP’s metrics will be misleading. FTP cannot detect this; it relies on agency data governance.  
  - **Oversimplified harms**: Harm statements (Step 1) may miss intangible costs (e.g., distrust in marginalized groups). FTP treats harms as static inputs; it cannot evaluate their completeness.  
  - **Threshold tyranny**: FTP assumes thresholds can be adjusted per group. For models where this is illegal (e.g., credit scoring) or technically impossible, FTP may reject otherwise viable models.  
  - **Group blindness**: FTP only evaluates predefined groups. If disparities arise at intersections (e.g., Black women) or unmeasured groups, FTP will not flag them.  

  **Inherent limitations**:  
  - FTP **cannot resolve** whether a chosen disparity is *ethically_ acceptable. It only makes the trade-off visible.  
  - FTP **cannot adjudicate** between competing societal values (e.g., individual vs. collective harm). It forces the board to do so.  
  - FTP **pretends no expertise is needed**, but reviewers may miscompute metrics. Mitigation: Provide a templated calculator with input validation.  

  **Dishonest claims to avoid**:  
  - "FTP ensures fairness." → It only ensures a *choice* is made.  
  - "The statistics dictated this." → The board chooses the criterion; statistics show the consequences.  
  - "This disparity is harmless." → FTP quantifies disparities but cannot assess harm severity—that requires domain context.  

  **Final counsel**: The FTP’s strength is its honesty: it is a scaffold for value judgments, not a technical oracle. When the board approves a model, they are not endorsing it as "fair" but as "fair enough *given our choices*." Document every handoff point relentlessly—especially Step 4—so reviewers never mistake the paperwork for absolution.
