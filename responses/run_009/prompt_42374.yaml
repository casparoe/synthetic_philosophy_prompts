  ### Moral Emotion Diagnostic: Guilt vs. Shade in Moral Psychology  
  **For class discussion only—not a validated instrument**  
  *Starting commitment: We agree that "bad conscience" (distress after wrongdoing) does real moral work (e.g., motivates repair, detents future harm) and it's fair to ask if it works well.*

  ---

  #### DECISION TREE  
  *Instructions: Answer each question based on your intuitive reaction to the case. Do not overthink—go with your first instinct. There are no right answers.*

  1. **The Secret Violation**:  
     Someone breaks a promise in a way *no one will ever discover*. They feel terrible for weeks. What best explains this feeling?  
     - **A. Internal deterrent**: It’s a self-punishment replacing external sanctions (e.g., "I did wrong and must never do it again").  
     - **B. Imagined witness**: Even alone, they feel judged by others (e.g., "What would people think if they knew?").  
     - **C. Self-verdict**: It condemns their whole character (e.g., "I’m a bad person").  

  2. **The Corrosive Episode**:  
     A person snaps at a friend, then spirals into days of distress. What makes this spiral destructive?  
     - **A. Self-verdict**: They see the act as proof they’re a bad person.  
     - **B. Audience-dependence**: They obsess over others’ perceptions ("What do they think of me?").  

  3. **The Sentencing Conference**:  
     A community addresses a minor offense by gathering affected parties, confronting the offender, then ritually readmitting her. Does this show the culture "choosing" its moral emotions?  
     - **A. Chooses the emotion**: They’re replacing guilt with shame (or vice versa).  
     - **B. Chooses triggers/repair**: They’re changing what *elicits* the emotion and how it’s resolved, not the emotion itself.  
     - **C. Not choosing**: This just expresses/repairs a fixed emotion; culture doesn’t control the emotion.  

  4. **The Anonymous City (new case)**:  
     In a large, impersonal city, a person cheats on taxes. They feel intense distress *only* when imagining friends finding out. Is this emotion still doing moral work?  
     - **A. Yes**: Even audience-focused feelings can guide behavior.  
     - **B. No**: Without real social ties, such feelings lose moral value.  

  5. **The Reintegration Ritual (new case)**:  
     After public criticism for lying, a person is forgiven and reintegrated into their community. What’s key to this being constructive?  
     - **A. Focus on the act**: Criticize *what they did*, not who they are; reintegration heals.  
     - **B. Focus on the person**: Temporary exclusion motivates change by targeting character.  
     - **C. No emotion needed**: Repair works through dialogue, not emotional triggers.  

  6. **The Isolated Child (new case)**:  
     A child raised alone on an island breaks their own moral rule (e.g., "don’t waste food"). They feel bad. Is this emotion:  
     - **A. Guilt/shade possible**: They could feel guilt (act-focused) or shame (self-focused) without society.  
     - **B. Only guilt possible**: Self-sanction requires no audience; shame needs social learning.  
     - **C. Neither**: "Bad conscience" here isn’t guilt or shame; it’s instinctive regret.  

  ---

  #### LEAF POSITIONS (7–10 leaves)  
  *Based on your path, find your leaf below. Unoccupied combinations are noted and diagnosed.*

  | Leaf name           | Position characterization                                                                                                | Your path (e.g., 1A-2B-3C) | Notes on fit                                                                 |
  |---------------------|--------------------------------------------------------------------------------------------------------------------------|---------------------------|------------------------------------------------------------------------------|
  | **Maturationist**   | (a) Shame is primitive (audience-dependent); guilt is mature (internal). Cultures should "grow into" guilt.               | 1B-2B-3A-4B-5B-6B        | Common path: Emphasizes audience (1B,2B) and guilt’s superiority (6B).      |
  | **Act-Focus Advocate** | (b) Tangney-inspired: Guilt (act-focused) is adaptive; shame (self-focused) is corrosive. Culture can’t change this core. | 1A-2A-3B-4A-5A-6A        | Uses 1A/2A to separate from audience-views. Rejects emotion choice (3B).    |
