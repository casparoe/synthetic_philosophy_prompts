  | **Shame Defender**  | (d) Williams-inspired: Shame (even self-focused) isn’t passive; it fuels agency/self-respect in close communities.        | 1C-2A-3B-4A-5B-6A        | Accepts self-focus (1C,2A) but sees it as constructive (5B).                |
  | **Determinist**     | (e) Social scale (not choice) decides: Shame works in tight groups; guilt in anonymous ones. Normative debate is moot.    | 1B-2B-3C-4B-5C-6B        | Audience (1B,2B) + scale-dependence (4B) negates choice (3C).               |
  | **Constructivist**  | (f) Cultures can redesign emotions (e.g., ritual to make shame reparative). Policy should optimize emotion practices.     | 1A-2B-3A-4A-5A-6A        | Sees emotion as chosen (3A) and modifiable (5A).                            |
  | **Dichotomy Skeptic**| (g) Guilt/shame split is Western; emotions blend. Focus on context, not categories.                                      | *Any path ending in 6C*  | Rejects the dichotomy at root (6C).                                         |

  **Unoccupied combinations** (e.g., 1B-2A-3A, 1C-2B-3C):  
