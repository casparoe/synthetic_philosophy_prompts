  First, for the asymmetry problem - probabilities invert via Bayes but propensities seem causal and time-directed. The core tension is between dispositional character and full probability calculus. I'll craft a question forcing her to choose which to sacrifice. Her likely response would be to preserve the dispositional character by restricting propensities to future outcomes. The follow-up would challenge this with a counterexample like forensic reconstruction where past probabilities seem meaningful.

  For the bridging problem - connecting single-case propensities to stable frequencies. The key issue is whether laws of large numbers presuppose what propensities explain. She'll likely claim stable frequencies manifest propensities without probabilistic presupposition. The follow-up should press on how this avoids circularity when explaining why frequencies stabilize.

  The reference-class problem is thorny - what fixes the "correct" description of a trial? She'll probably appeal to "causally relevant conditions" to avoid subjectivism. The follow-up needs to test this with a borderline case like coin tosses with unknown causal factors.

  On quantum mechanics - does propensity add value beyond the Born rule? She'll likely argue it provides ontological grounding. The follow-up should challenge this with hidden variable or Everettian scenarios that eliminate indeterminism.

  For dispositions analogy - what's the causal basis of fractional propensities? She may reject the need for micro-reduction. The follow-up could press on whether this makes propensities "queer" properties compared to ordinary dispositions.

  I should also address the user's constraints: keep math simple (conditional probability only), flag extrapolated responses, and have a contingency plan if she actually defends long-run propensities. The most fragile assumption is the single-case focus; if she shifts to long-run, the asymmetry and reference-class questions need restructuring around trial homogeneity instead.

  The user clearly knows this terrain well - they've identified precise pressure points in the propensity view. Their hidden need might be to extract concrete philosophical concessions rather than let the guest retreat to "that's metaphysics" deflections. The questions should be designed to make the trade-offs in her position visible to listeners.
answer: |-
  Here’s a focused set of 9 questions (with embedded follow-ups) addressing your requirements, designed to press on underdiscussed tensions while respecting time and your guest’s style. I’ve flagged fragility points and included a contingency plan.

  **Core Assumption:** *She defends a robustly single-case, physical propensity interpretation.* If she signals otherwise (e.g., "propensities *are* defined by the generating conditions," "a single case only manifests the propensity in the long run"), pivot to the contingency plan noted after Q9.

  ---

  ### **1. Asymmetry Problem: Sacrificing Bayes or Directionality?**
  *   **Q1:** "You argue propensities are real physical dispositions akin to causal tendencies. This seems to tie them directionally to *future* outcomes – like a radium atom's disposition *to decay*. But probability calculus is symmetric: we routinely assign probabilities to *past* states given current evidence (e.g., P(State | Decay Observed)). Does the propensity interpretation accommodate this, or must we give up either the dispositional 'oomph' or the full applicability of Bayes' theorem to propensities?"
      *   **Anticipated Reply:** She will likely **prioritize the dispositional character**, arguing propensities *only* pertain to *future* outcomes of a *current* setup. Bayes' theorem applies to our *knowledge* (epistemology), not directly to the propensities themselves (metaphysics). *(This is a standard move to preserve the causal/directional intuition.)*
  *   **F/U Q1a (If she sacrifices Bayes for propensities):** "If propensities themselves can't meaningfully be inverted via Bayes, how do we reconcile this with scientific practice? For instance, in forensic science or paleontology, we *do* assign objective probabilities to past events based on physical evidence (e.g., P(Impact Angle | Observed Crater)). Are these probabilities *not* propensities? If not, what *are* they metaphysically, and how do they relate to the propensities you defend?" *(Presses the cost: excludes common scientific uses of objective probability.)*

  ### **2. Bridging Problem: The Mirage of Stability**
  *   **Q2:** "A key motivation for propensities is explaining *why* stable frequencies emerge in repeated trials. But standard derivations of the Law of Large Numbers (LLN) assume pre-existing probabilities. Doesn't using the LLN to bridge single-case propensities to long-run frequencies risk circularity? What's the *non-probabilistic* physical mechanism guaranteeing that an ensemble of independent trials, each with identical single-case propensity P, *must* produce a limiting frequency close to P?"
      *   **Anticipated Reply:** She will likely argue the **LLN is a mathematical consequence**, not an assumption *about propensities*. The stable frequency *manifests* the identical single-case propensity inherent in each trial setup. The propensity *explains* the stability; the LLN just describes the pattern. *(Standard Popperian/early propensity move.)*
  *   **F/U Q2a:** "But doesn't the LLN's *application* here require the *stochastic independence* of the trials to be a *physical fact*? How is *that* physical fact grounded *without* presupposing probabilistic properties at the level of the generating conditions or the universe itself? If independence isn't probabilistic, what is its metaphysical status in your view?" *(Targets the physical grounding of independence, often glossed over.)*

  ### **3. Reference Class Problem: The Ghost in the Setup**
  *   **Q3:** "Propensities attach to a 'trial under a description' – the same coin toss has a different propensity if described as 'toss by person A' vs. 'toss with initial force X'. What *physically fixes* the 'correct' description or reference class for assigning *the* single-case propensity? How do we avoid this being determined by *our knowledge* (or ignorance) of causally relevant factors, which would collapse the view towards subjectivism?"
      *   **Anticipated Reply:** She will likely insist the **relevant description is fixed by the *complete set of causally relevant physical conditions*** present in the particular setup. Our *ignorance* doesn't change the propensity; it just means we might not know *which* description (and thus which propensity) is instantiated. *(Standard reply appealing to 'complete causal setup'.)*
  *   **F/U Q3a:** "Take a realistically complex system like a coin toss. We *never* know the *complete* micro-state. If the propensity is defined by the complete physical state S, but we can only specify a partial description D (e.g., 'fair coin, flipped vigorously'), how do we justify assigning *any* specific numerical propensity (like 0.5) based on D? Doesn't D only license a *range* of possible propensities depending on the unknown micro-details, making the numerical assignment itself epistemic?" *(Forces confrontation with epistemic access vs. metaphysical precision.)*

  ### **4. Quantum Mechanics: Motivation or Millstone?**
  *   **Q4:** "Quantum mechanics is often cited as the prime motivation for single-case propensities. But does the propensity interpretation *add* anything substantial to the Born rule beyond labeling it? What concrete difference does it make to say 'this atom has a propensity of 0.5 to decay' versus just 'the Born rule predicts a 0.5 probability for decay'?"
      *   **Anticipated Reply:** She will likely argue it **provides the *ontological ground*** for the Born rule. The Born rule *describes* the manifestation of the underlying physical disposition (propensity) inherent in the quantum state. It answers "Why *this* probability?" metaphysically. *(Standard claim: propensities are the 'truthmakers' for QM probabilities.)*
  *   **F/U Q4a:** "Suppose Bohmian mechanics or the Everett interpretation turns out to be correct. These are deterministic at the fundamental level. Bohm has no irreducible chanciness; Everett has all outcomes actual. What happens to single-case propensities in such a world? Do they simply vanish, revealing they were tied to a specific (indeterministic) interpretation of QM, or do you see a way to salvage them?" *(Tests the necessity of fundamental indeterminism and the view's dependence on standard QM.)*

  ### **5. Dispositions Analogy: The Fractional Fracture**
  *   **Q5:** "You liken propensities to familiar dispositions like solubility or fragility. These have clear *causal bases* – molecular structure for solubility, lattice defects for fragility. What is the analogous *causal basis* for, say, an atom's 1/3 propensity to decay? If it's just 'the quantum state', how does that differ from simply restating the probability? Where does the *specific numerical value* (1/3, not 1/2) physically reside?"
      *   **Anticipated Reply:** She will likely **reject the demand for a reductive 'basis' in simpler terms**, arguing the **quantum state *is* the fundamental physical property** that *just is* the bearer of the dispositional propensity. The value resides in the state itself. *(Common move: propensities are fundamental, irreducible dispositions.)*
  *   **F/U Q5a:** "If the quantum state is the bearer of a fundamental, irreducible disposition with a specific numerical strength, how is this different from positing a novel, primitive type of 'probabilistic power'? Does this risk making propensities metaphysically 'queer' compared to non-probabilistic dispositions, which *do* seem to supervene on non-dispositional microstructure?" *(Challenges fundamentality and questions the coherence of irreducible probabilistic powers.)*

  ### **Additional Questions (Broadening Scope)**
  *   **Q6 (Explanatory Power):** "Beyond QM, where do single-case propensities offer the *clearest* explanatory advantage over frequentist or sophisticated subjectivist views for understanding objective chance in science? Is there a specific non-quantum example you find compelling?"
  *   **Q7 (Stochastic Processes):** "How do single-case propensities handle complex stochastic processes? Consider Brownian motion: the propensity at time t seems dependent on the entire history/path. Does this require propensities to be inherently relational or history-dependent in a way that challenges their 'single-case' simplicity?"
  *   **Q8 (Meta-Question):** "You often distinguish metaphysics from epistemology. Could you elaborate on what you see as the *primary metaphysical work* done by positing single-case propensities that isn't done by just saying 'the world is fundamentally stochastic' without committing to dispositional properties?"

  **(Total: 8 Core Questions + 5 Embedded Follow-Ups = 13 potential interchanges, focused on key areas)**

  ---

  **Fragility Audit & Contingency Plan:**

  1.  **Assumption of Robust Single-Caseness:** This is the **biggest fragility point**. The entire asymmetry (Q1), bridging (Q2), and reference-class (Q3) framing assumes she defends propensities as *inherent in the single case itself*.
      *   **Signal to Pivot:** If she says anything like "The propensity *is* a property of the *type* of setup," "A single trial only *manifests* the propensity defined by the conditions," or "The propensity *is* the stable frequency it would produce," she's likely defending a **long-run or chance-setup propensity**.
      *   **Contingency Plan:**
          *   **Drop/Rephrase Q1 (Asymmetry):** The asymmetry problem loses bite if propensities aren't tied to the *present moment* of a single trial. Focus instead on how Bayes relates to propensities defined over *types* of events.
          *   **Rephrase Q2 (Bridging):** Ask how the stable frequency *constitutes* or *defines* the propensity, rather than being a consequence. Press on how strictly identical the "setup" must be.
          *   **Rephrase Q3 (Reference Class):** This becomes the *central* issue. Ask: "What *physically* constitutes the 'setup' or 'type' whose propensity is defined by the long-run frequency? How fine-grained must the description be to count as the *same* setup? How does this avoid the reference class problem plaguing frequentism?"
          *   Q4 (QM) and Q5 (Dispositions) likely remain relevant but need slight rephrasing (e.g., "If the setup propensity is the stable frequency, what does calling it a 'disposition' add?").
  2.  **Anticipated Replies:** The replies for Q1 (prioritizing directionality), Q2 (LLN as consequence), Q3 (complete causal setup), and Q5 (quantum state as irreducible basis) are **extrapolations from textbook defenses** (Popper, Giere, early Humphreys). They are probable based on the tradition, not her specific writings. The Q4 reply (ontological ground for Born rule) is very standard. **Q5a's challenge ("queer" powers) is my extrapolation** of a common objection (Lewis, anti-realists) to her likely position.
  3.  **Mathematics:** All questions stick to conditional probability/intuitive LLN. No measure theory.

  **Execution Tip:** Be ready to politely but firmly push back if she tries the "that's epistemology" move on F/U questions (especially Q1a, Q3a). Frame it as: "I understand the metaphysical commitment, but I'm asking about the *consequences* of that metaphysics for scientific practice/concepts" or "What does your metaphysics *entail* for how we should understand X?" Good luck!
