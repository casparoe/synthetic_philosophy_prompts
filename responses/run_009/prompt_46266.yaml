answer: |-
  Here's a diagnosis of the disagreement, separating settled science from contested ground, and proposing what progress might look like:

  **The Core Disagreement: A Layered Conflict**

  Your working theory is largely correct, but it's a **multilayered conflict involving semantics, values, burden-of-proof, *and* contested empirical inferences**, with the weight shifting depending on the context.

  1.  **Semantic/Linguistic Layer ("Heritable" vs. "Fixed"):**
      *   **Settled:** Heritability *is* a population-specific statistic (h² = Vg / Vp). It measures the proportion of *current* phenotypic variance *in a specific population* attributable to genetic differences *in that population's current environment*. It says nothing about the absolute level of the trait or the potential for change.
      *   **Disagreement:** One side *hears* "highly heritable" as implying the trait is biologically fixed or inevitable ("in the blood"). The other side insists this is a fundamental misunderstanding. This confusion is persistent because "heritable" in everyday language *does* often imply fixity (like inheriting property).
      *   **Consequence:** This miscommunication fuels the entire debate. Arguments about malleability are often reactions to this perceived (but erroneous) claim of fixity.

  2.  **Values/Political Layer (Implications & Burden of Proof):**
      *   **Settled:** *None* of the core technical points settle value questions about social policy, equality of opportunity, or resource allocation.
      *   **Disagreement:** The core conflict is over the perceived *implications* of high heritability estimates and the burden of proof regarding group differences.
          *   **Side A (Often emphasizing high h²):** Sees high heritability as suggesting inherent limits to environmental intervention (especially for individuals at the extremes) and considers genetic explanations for group differences plausible *a priori*, demanding strong environmental evidence to rule it out. They may view compensatory efforts as inherently limited or inefficient.
          *   **Side B (Often emphasizing environment/GxE):** Views high heritability within a specific environment as irrelevant to the potential for *changing* the environment itself to raise the mean or reduce inequalities. They see genetic explanations for group differences as socially dangerous speculation lacking direct evidence, demanding *extraordinary* proof for such claims given historical misuse. They see compensatory efforts as morally necessary and potentially effective.
      *   **Burden of Proof:** This is central. Side A often places the burden on Side B to prove environmental causes for group differences *beyond doubt* to rule out genetics. Side B places the burden on Side A to provide *direct positive evidence* for genetic causes of group differences, arguing that within-group h² provides none.

  3.  **Empirical Inference Layer (Contested Extrapolations):**
      *   **Settled Consensus:**
          *   High within-group heritability *does not* logically entail that group differences are genetic (Lewontin's pots, Dutch height).
          *   High heritability *does not* mean a trait is unchangeable (Dutch height again; secular rises in IQ/Flynn effect).
          *   The Equal Environments Assumption (EEA - that identical and fraternal twins experience equally similar environments) *is* a necessary assumption for classic twin studies. Researchers actively try to test and account for potential violations, but perfect verification is impossible.
          *   Gene-Environment Interaction (GxE - genes influencing sensitivity to environments) *exists* for cognitive traits. Its magnitude is an empirical question.
      *   **Genuinely Contested Empirical Ground:**
          *   **Magnitude & Form of GxE:**
              *   How large is GxE for IQ? Does it significantly inflate or deflate h² estimates in standard designs? Is it strong enough to make heritability estimates highly unstable across different environments *within* WEIRD populations? (Side B often argues yes, Side A often argues it's modest within typical ranges).
              *   Does GxE follow a "diathesis-stress" model (genes matter more in bad environments) or a "bioecological" model (genes matter more in good environments)? Evidence exists for both depending on context. This directly impacts inferences about potential gains from environmental improvement.
          *   **Scope of Environmental Influence Implied by h²:**
              *   Does high h² *within* a generally enriched environment (WEIRD) imply that *further* environmental enrichment for individuals below the mean will yield *minimal* gains? (Side A leans towards yes; Side B argues h² doesn't predict response to *new* interventions not present in the current environment).
          *   **Indirect Evidence for Group Differences:**
              *   Does the *combination* of high within-group h² + persistent group differences + failed environmental explanations (in the eyes of Side A) constitute *weak indirect evidence* favoring a partial genetic hypothesis? Side A often argues yes (it's the "default" hypothesis if environments are "equal enough"). Side B vehemently argues no, seeing it as a fallacy fueled by ignoring GxE, context, and the lack of direct evidence. This is the core empirical flashpoint *beyond* the basic logic.
          *   **Robustness of EEA:** While researchers acknowledge it's an assumption, the *degree* to which violations meaningfully bias h² estimates for IQ is contested. Side B often highlights studies suggesting potential biases (e.g., MZ twins treated more similarly on IQ-relevant dimensions). Side A points to adoption studies converging with twin studies and efforts to measure/control for environmental similarity.

  **Why the Fight Persists:**

  1.  **Deeply Held Values:** The implications touch on fundamental beliefs about equality, meritocracy, social responsibility, and the potential for change. These are not resolved by data.
  2.  **Burden-of-Proof Lock:** Neither side accepts the other's burden. Side A won't accept "no evidence for genes" as sufficient; they demand proof the environment *alone* explains group gaps. Side B won't accept "failed environment-only explanations" as evidence *for* genes; they demand direct genetic evidence.
  3.  **Motivated Reasoning:** Both sides interpret ambiguous evidence (like the magnitude of GxE or the significance of EEA violations) through their value lens.
  4.  **Miscommunication as Fuel:** The semantic confusion allows both sides to (often unintentionally) misrepresent the other's position. Side A hears "genetic" claims where they aren't made; Side B hears "immutable" claims where they aren't made.
  5.  **Lack of Definitive Direct Evidence:** We lack large-scale genomic data definitively quantifying genetic contributions to *mean* differences between major continental ancestry groups in IQ, controlling perfectly for environment and GxE. This vacuum is filled by indirect arguments based on the contested points above.

  **What Counts as Progress?**

  True resolution is unlikely because of the values clash. However, *meaningful progress* would look like:

  1.  **Semantic Precision:** Widespread adoption of clear language: "high heritability (h² = X%) in Population Y" instead of just "IQ is highly heritable." Force explicit statements: "High h² does not imply immutability" and "High h² does not prove group differences are genetic."
  2.  **Acknowledging the Burden-of-Proof Standoff:** Explicitly recognize that this is the core stalemate. Frame discussions as "Given the burden-of-proof disagreement, what kind of evidence *would* move the needle for you?" This might not resolve it, but it clarifies the impasse.
  3.  **Targeted Empirical Research (Focusing on Contested Ground):**
      *   **Large-Scale GxE Studies:** Rigorous estimates of GxE magnitude for IQ across diverse environmental spectrums *within and between* populations. Does heritability *actually* drop significantly in vastly different environments?
      *   **Direct Genomic Investigation of Group Differences:** Advances in polygenic scores and large, diverse biobanks *might* eventually provide more direct (though still complex and ethically fraught) evidence about the genetic architecture underlying mean differences. This is high-risk research but addresses the core empirical question directly.
      *   **Improved Environmental Measurement:** More sophisticated measures of the "environment" (including psychosocial factors, discrimination, epigenetic markers) to better test environmental hypotheses for group differences and GxE.
      *   **EEA Violation Quantification:** More direct studies measuring specific environmental similarities and their impact on twin/correlation estimates.
  4.  **Conceding the Value Dispute:** Progress might involve both sides explicitly acknowledging: "We agree on the technical definitions (h², no license for group inference) but disagree on the social implications and where the burden of proof lies regarding group differences." This separates the scientific consensus from the political debate.
  5.  **Shifting Focus to Potential:** Focusing research and discussion less on *limits* implied by h² and more on the *range of reaction* and *potential gains* from environmental optimization, regardless of group differences origin. What interventions *do* work to raise cognitive functioning for disadvantaged individuals/groups? This moves beyond the heritability debate towards actionable solutions.

  **The Firm Floor vs. The Quicksand**

  *   **Firm Floor (Settled Consensus):**
      *   Heritability (h²) is a population-specific variance ratio (Vg/Vp).
      *   High h² *within* Group A does *not* logically entail that differences *between* Group A and Group B are genetic.
      *   High h² does *not* mean a trait is unchangeable (demonstrated by secular trends).
      *   EEA and GxE are real concepts/assumptions that must be considered; their perfect satisfaction/cancellation is impossible.
      *   Inferring the cause of *mean differences between groups* from *within-group heritability estimates* is a logical fallacy without additional strong assumptions/evidence.
  *   **Quicksand (Live Argument):**
      *   **How large is GxE for IQ?** Does it render h² estimates unstable or largely irrelevant for predicting responses to novel interventions?
      *   **How robust are h² estimates to EEA violations?** Do common violations meaningfully inflate estimates?
      *   **Does the *pattern* of evidence (high h² + persistent gaps + failures of specific environmental hypotheses) constitute *any* weak evidence for a genetic component to group differences?** (This is the core inferential battleground).
      *   **What does high h² imply about the *efficacy* or *potential gains* from environmental interventions *within* a population?** (Interpretation of limits).

  **Conclusion:** The fight persists because it's fundamentally a values/burden-of-proof dispute amplified by semantic confusion and fought over contested empirical inferences (primarily the magnitude of GxE, robustness of EEA, and the interpretation of indirect evidence for group differences), *despite* a solid consensus on the core technical definitions and logical limitations. Progress requires separating these layers: enforcing semantic precision, acknowledging the values/burden standoff, focusing research on the genuinely contested empirical questions (GxE, direct genomic evidence), and shifting practical focus to demonstrably effective interventions. The core logical fallacy (within-group h² -> between-group cause) is settled; the arguments rage on around its periphery and implications.
