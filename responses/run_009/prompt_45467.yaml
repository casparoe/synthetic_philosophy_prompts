prompt: |-
  Retired biochemist here, got into philosophy a few years after I stopped working and now I can't stop seeing philosophy everywhere. Something I ran into constantly in science and now keep meeting again in philosophy reading, and I've never found a word for it: categories that everyone uses without trouble but that fall apart the moment you try to say what all their members have in common. Species is the famous case — every criterion anyone proposes, whether interbreeding or shared ancestry or occupying a niche, either has known exceptions or turns out to be several criteria that pick out overlapping but different groups. "Planet" was like that until the astronomers just voted a definition into existence, and "gene" arguably still is. But what I want a name for is more specific than "hard to define". It's not ordinary fuzziness at the edges, a clear core with borderline cases the way "bald" or "heap" are. It's more that the members seem held together by a chain of overlapping similiarities — neighbors share a lot, members at opposite ends share almost nothing, and there may be no single feature that all of them have — and yet experts still classify new cases with high agreement, so the category is doing something more than convention. Does this kind of category, or the move of defining by overlapping similarities instead of a common feature, have an established name and literature? And a bare label won't satisfy me: I want to know how exactly it differs from ordinary vagueness, whether it's different from just a bunch of properties that happen to be correlated (a biologist friend mentioned something along those lines for natural kinds, I didn't quite follow), and whether the lesson is that the category is defective or that our insistence on strict definitions is the mistake.
reasoning: |-
  Okay, let me unpack this retired biochemist's query. They're describing a specific type of conceptual puzzle that haunted them in science (species, planet, gene) and now in philosophy: categories that function perfectly well in practice but resist essentialist definitions. 

  First, I notice they're very precise about what they don't mean. This isn't about borderline cases like baldness where there's a clear core with fuzzy edges. They're describing something more radical - categories where members share no universal common feature, yet experts classify consistently. The Wittgensteinian family resemblance structure is immediately springing to mind, but I wonder if that fully captures their scientific examples. 

  Their frustration is palpable - they've clearly wrestled with this for years. The core tension they articulate is brilliant: if these categories work so well in practice, is the problem in the category itself or in our definitional expectations? That's the goldmine here. 

  I recall that species debates involve multiple coexisting definitions (biological, phylogenetic, ecological) that don't perfectly align. And planets... oh boy, the Pluto demotion controversy shows how even "voted" definitions create new problems. For genes, the classical molecular biology definition completely fractures when you consider alternative splicing or overlapping genes. 

  The natural kinds angle from their biologist friend is crucial. Traditional natural kinds assume discoverable essences, but Boyd's Homeostatic Property Cluster theory might bridge this - where clusters of properties are maintained by underlying mechanisms. That could explain why experts agree despite no strict definition. 

  I should emphasize that this isn't just vagueness. Vagueness admits degrees (somewhat bald), but family resemblance categories might have radically different members sharing no common traits. The cohesion comes from the network of similarities, not from meeting threshold conditions. 

  The implications for philosophy of science are profound. If even bedrock categories like species are like this, maybe we need to abandon essentialism in life sciences. That connects to anti-realism debates, but also to operationalism - categories as tools rather than mirrors of nature. 

  For their deeper questions: No, these categories aren't "defective" - they reflect how complex systems actually organize. The mistake is demanding Platonic definitions where only cluster concepts apply. The literature I'll point to should show how this shifts from "what is X?" to "how do we fruitfully use X in context?"
answer: |-
  What you're describing resonates deeply with core debates in philosophy of language, philosophy of science, and metaphysics. You've pinpointed a profound challenge to classical essentialism. Here's a breakdown of the concepts and literature addressing this:

  ### 1. The Established Name: **Family Resemblance Concepts**
     *   **Source:** Ludwig Wittgenstein's *Philosophical Investigations* (1953), specifically his critique of essentialist definitions for concepts like "game."
     *   **Description:** Wittgenstein argued that many concepts (like "game") lack a single defining feature shared by all instances. Instead, members are connected through a criss-crossing network of overlapping similarities, like family resemblances where members share features pairwise but not universally. One game resembles another in rules, another in competitiveness, another in involving balls, etc., but there's no "game essence" common to chess, solitaire, rugby, and ring-around-the-rosy. Experts classify new cases based on sufficient similarity to *multiple existing members* across *various dimensions*, not possession of a single necessary-and-sufficient feature.
     *   **Why it fits your cases:** Species (biological, morphological, ecological similarities overlapping), Planet (orbits star, hydrostatic equilibrium, cleared orbit - overlapping but not universal/essential), Gene (sequence, function, heritability, expression - overlapping clusters) are textbook examples of family resemblance concepts in science.

  ### 2. Beyond Family Resemblance: **Cluster Concepts & Homeostatic Property Clusters (HPCs)**
     *   **Cluster Concepts:** A more structured refinement. A concept is defined by a cluster of properties, where no single property is necessary, but an instance must possess a sufficient number of them. There isn't one "core," but a bundle of features that tend to co-occur. Vagueness arises about *how many* properties are needed.
     *   **Homeostatic Property Cluster Kinds (HPCs - Richard Boyd, 1990s):** This addresses your "more than convention" concern and the biologist friend's point about natural kinds. HPCs are a theory of *natural kinds* that rejects essentialism.
        *   **Mechanism:** Members of the kind share a cluster of correlated properties.
        *   **Homeostasis:** This correlation isn't accidental; it's maintained ("homeostasized") by underlying causal mechanisms (e.g., shared ancestry and developmental constraints for species; gravitational dominance and formation processes for planets; molecular mechanisms of replication, expression, and selection for genes).
        *   **Explains Expert Agreement:** Experts reliably classify because they recognize the co-occurring cluster *and* implicitly or explicitly understand (or rely on theories referencing) the underlying homeostatic mechanisms that *make* the properties cluster reliably. New cases are judged based on possessing enough properties from the cluster *and* fitting into the causal structure.
        *   **Natural Kinds Without Essences:** HPCs allow for kinds that are "real" (projectible, supporting inductions, carving nature at its joints) without requiring a single essential property. The kind is defined by the stable cluster *and* its maintaining mechanism.

  ### 3. How This Differs from Ordinary Vagueness
     *   **Ordinary Vagueness (e.g., "bald", "heap"):** Involves a single dimension (number of hairs, number of grains) with borderline cases. There *is* a clear core concept (e.g., having zero hairs *is* bald, having a full head *is* not bald). The problem is drawing a sharp line on a spectrum.
     *   **Family Resemblance / Cluster Concepts / HPCs:** The complexity is *multi-dimensional*. Members can be radically different (like opposite ends of a chain) and share *no single property in common*. The "glue" isn't a core set of universal features or a single dimension, but the network of overlapping similarities or the causal mechanisms binding a cluster of properties. Borderline cases exist, but they are borderline because they possess *few* properties from the cluster or have *weak connections* to the homeostatic mechanism, not because they fall on a single fuzzy boundary line.

  ### 4. Is the Category Defective or is Essentialism the Mistake?
  This is the central philosophical implication:
     *   **Against Essentialism:** Your examples powerfully argue that the classical essentialist view (Plato, Aristotle) – that a true category *must* have a defining essence shared by all and only its members – is inadequate for many, perhaps most, scientifically and philosophically significant concepts, especially in biology and complex systems.
     *   **Not Defective Categories:** These concepts (species, planet, gene, game, art, etc.) are **not defective**. They are:
        *   **Functional:** They work remarkably well for prediction, explanation, classification, and communication within expert communities.
        *   **Reflective of Reality:** They track real patterns in the world – patterns of similarity maintained by shared history, common causal structures, or functional roles (HPC theory explicitly grounds this).
        *   **Context-Sensitive:** Their application can depend on the specific explanatory or practical context (e.g., using the biological species concept vs. the ecological species concept).
     *   **The Mistake:** The insistence on **strict, essentialist definitions** is often the mistake, especially for complex, historically contingent, or functionally defined categories. Demanding a single, exceptionless necessary-and-sufficient condition forces artificial boundaries where nature presents clusters, continua, and networks. Wittgenstein's point was that we use language successfully *without* such definitions for many core concepts.

  ### Literature Recommendations
  1.  **Ludwig Wittgenstein:** *Philosophical Investigations* (Sections 65-78 specifically on "games" and family resemblance). Primary source.
  2.  **Richard Boyd:** "Homeostasis, Species, and Higher Taxa" (in *Species: New Interdisciplinary Essays*, ed. R. Wilson, 1999). Foundational for HPC theory in biology.
  3.  **John Dupré:** *The Disorder of Things: Metaphysical Foundations of the Disunity of Science* (1993). Argues powerfully against essentialism in biology and for promiscuous realism (multiple valid ways to classify).
  4.  **Philip Kitcher:** "Species" (1984, *Philosophy of Science*) & "1953 and All That: A Tale of Two Sciences" (1984, *Philosophical Review*). Classic critiques of essentialism regarding species and reductionism in genetics.
  5.  **Muhammad Ali Khalidi:** *Natural Categories and Human Kinds: Classification in the Natural and Social Sciences* (2013). Good overview, including HPC kinds.
  6.  **Ian Hacking:** *The Social Construction of What?* (1999). Discusses classification, "interactive kinds," and the dynamic nature of some categories (like species concepts themselves evolving).

  ### In Summary
  You've identified **Family Resemblance Concepts** (Wittgenstein) and their more scientifically grounded cousins **Cluster Concepts** and **Homeostatic Property Cluster Kinds** (Boyd). These differ from ordinary vagueness by being multi-dimensional and lacking a universal core feature, relying instead on networks of similarities or causally sustained property clusters. The category is **not defective**; it reflects the complex, non-essentialist structure of the world. The mistake lies in **imposing essentialist definitions** where they don't fit. The lesson is profound: successful categorization often involves recognizing patterns held together by history, causal mechanisms, or functional roles, not by finding a mythical essence. This insight bridges your experience in biochemistry (gene, species) and your philosophical explorations beautifully. Keep seeing philosophy everywhere – it *is* everywhere, especially in the cracks of our definitions!
