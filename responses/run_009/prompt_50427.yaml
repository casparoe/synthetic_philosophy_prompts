prompt: |-
  I've been going back and forth with a friend about epiphenomenalism and we want to try to locate where we actually disagree instead of talking past each other. Here's the setup as I see it, tell me if I'm framing it wrong. If the physical world is causally closed and qualia are non-physical, then qualia can't cause anything, including our reports and thoughts about qualia — that's supposed to be the paradox of phenomenal judgment, the thing that makes epiphenomenalism look self-undermining. But my friend thinks the paradox is weaker than it looks: on epiphenomenalism my zombie twin utters all the same sentences about consciousness, so the fact that I say "I'm in pain" tells you nothing my twin doesn't tell you, and that's just... supposed to be fine? A correlation, not a coincidence that needs explaining? I actually think that response smuggles in a psychophysical harmony assumption that is itself astronomically implausible, and that this is where the real action is.

  So: give me your credence that epiphenomenalism is true, decomposed. At minimum I want terms for (a) causal closure of the physical, (b) qualia being non-physical / non-reducible given closure, (c) whatever you think the right way to state the harmony problem is and how much it should hurt, and anything else you think belongs in there. Numbers with a one-line justification each, then combine them. Don't just say "it depends on whether physicalism is true" — the decomposition is the whole point.

  Then two follow-ups. First, which term are you least confident in, and what kind of evidence or argument (not just neurodata — conceptual stuff counts) would actually move it? Second: my credence is around 0.02 and my friend's is around 0.25. Given your decomposition, tell me which single sub-question the two of us most likely disagree about — is it about harmony, about whether the paradox of phenomenal judgment is even a problem, or about something upstream like whether "causal closure" is a well-defined constraint in the first place?

  One more constraint on your answer: don't treat "epiphenomenalism is crazy so low credence" as an output. I want the low (or high!) number to fall out of the terms, not be assumed going in.
