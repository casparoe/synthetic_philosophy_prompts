        - Forced disclosure: because we have to admit it's out of scope and the theorem doesn't cover strategic settings.
        - Ambiguity: we have a reply but it's model-dependent (updating rules) so it might be serious.
        - Ergodicity: we have a reply, so it might be less serious? but we'll mark as serious because it's a different criterion.
        - Commitment: serious because it's a key assumption.

