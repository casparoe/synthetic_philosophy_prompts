   Order of objections by damage:
     fatal: none? we can handle by conceding limitations? but if we concede that without commitment it fails, then it's not fatal to the theorem under commitment. So let's not use fatal. Instead, we'll have:

     We'll rank by the severity of the concession:

     serious: 
