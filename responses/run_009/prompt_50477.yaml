   How about a variant of the psychologist's objection: 
      "What about the anxiety of having the option? The agent might pay to avoid even having the option to know, because the very presence of the option causes worry."

   This might be from the psychologist or the economist.

     Reply: We assume that the agent does not have anticipatory utility about the option itself. The utility is only about the actual belief and outcome at the time of the decision. If the agent has anxiety about the option, that would be a separate cost. Our theorem shows that, absent such costs, the value of information is nonnegative.

     Weak spot: If the agent cares about the option itself, then that cost must be considered.

     Concede: There might be costs associated with the decision to have the option.

     Damage: annoying? because it's a different cost.

