answer: |-
  Based on your friend's five verdicts, two distinct philosophical frameworks ("rules") emerge as plausible explanations, each fitting the existing cases but diverging significantly on the new "century-long forgery" scenario. Here's the breakdown:

  ### Rule 1: **Authenticity as Provenance**  
  *(Value derives from the object's traceable history to the original artist's creative act)*  
  - **Fits all verdicts:**  
    - **Vermeer Forgery & "New Vermeer"**: Both lack a true link to Vermeer. Once exposed, the fabricated history collapses, destroying value.  
    - **Workshop Painting**: The master’s design and oversight create a legitimate historical connection.  
    - **Heavy Restoration**: The original substrate and the conservator’s intent to preserve (not replace) maintain the chain of provenance.  
    - **Artist’s Replica**: The replica’s later creation date breaks the direct link to the *original* moment of conception/execution, diminishing its historical primacy.  
  - **Prediction for the "Century-Long Forgery"**:  
    Once exposed, the forgery loses all value. Its century of influence is irrelevant—it never had a true connection to Vermeer. The cultural impact is seen as a tragic error, not a transfer of authenticity. The object reverts to being a skilled fake.  

  ### Rule 2: **Authenticity as Causal Origin**  
  *(Value resides in the physical object created by the artist’s hand at the moment of origin)*  
  - **Fits all verdicts:**  
    - **Vermeer Forgery & "New Vermeer"**: Neither originated from Vermeer’s hand or intent.  
    - **Workshop Painting**: The master’s direct involvement (design/retouching) suffices as causal origin.  
    - **Heavy Restoration**: The original paint layer (however minimal) provides the causal anchor; modern additions are preservative, not creative.  
    - **Artist’s Replica**: The replica is physically distinct from the first canvas. Its later creation separates it from the *original* causal act.  
  - **Prediction for the "Century-Long Forgery"**:  
    The forgery remains worthless upon exposure. Despite its cultural role, it never had Vermeer’s causal touch. Its historical influence is epistemically fascinating but ontologically irrelevant.  

  ### Why These Rules Diverge on the New Case  
  Both rules predict **value collapse** for the exposed forgery, but for different reasons:  
  - **Provenance Rule**: The object’s *history* is revealed as false. Its cultural impact is a derivative illusion.  
  - **Causal Origin Rule**: The object’s *material genesis* is fraudulent. Its influence doesn’t alter its lack of Vermeer’s agency.  

  **However**, a deeper divergence exists in how they treat the forgery’s cultural impact:  
  - **Provenance Rule** *might* grant the object residual "historical artifact" value (e.g., as evidence of a grand deception).  
  - **Causal Origin Rule** dismisses this entirely—no "value" as art, only as a curiosity.  

  ### What Your Friend Will Most Plausibly Say  
  She will likely rule that **the forgery loses all artistic value upon exposure**, despite its century of influence. Her verdicts prioritize **origins** over cultural reception:  
  - **Why?**  
    1. Her rejection of both forgeries and the artist’s replica shows she anchors value to the *initial* creative act.  
    2. The workshop/restoration cases prove she accepts *derivative* objects only when physically or intentionally tied to the original moment.  
    3. The new case’s cultural impact is post hoc—it doesn’t retroactively create authenticity. As she said of the forgeries: exposure makes them "look worse," implying their perceived qualities were always contingent on the lie.  

  **Her probable verdict**:  
  > *"It’s a fascinating historical object, but as a Vermeer? Worthless. It was never his work, and its influence was built on a lie. The fire destroyed the real thing—this is just a ghost."*  

  ### The Critical Test Case to Distinguish the Rules  
  Propose this scenario:  
  > **"A conceptual artist creates an artwork by writing instructions on a certificate. The certificate is lost, but a gallery fabricates a new certificate using the original instructions. Decades later, the original certificate is found. Which is the authentic artwork?"**  

  - **Provenance Rule**: Favors the **original certificate**. Its historical chain matters most.  
  - **Causal Origin Rule**: Favors the **fabricated certificate**. If the object *is* the certificate (per the artist’s concept), the new one identically instantiates the idea.  

  This case isolates the core conflict: *Is authenticity in the object's history (Provenance) or in its fidelity to the artist's generative act (Causal Origin)?* Your friend’s answer will reveal which framework she truly prioritizes.  

  ### Key Insight  
  Your friend’s stance reflects a **metaphysical view of art**: value is not perceptual or cultural, but inherent in the artist’s primal act. The new case tests whether cultural history can *create* value—and her prior rulings suggest a resounding "no." The forgery’s tragedy is that its beauty and influence become paradoxically worthless once divorced from origin.
