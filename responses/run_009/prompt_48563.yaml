answer: |-
  ### Deception Evaluation Decision Tree  
  Answer each scenario with the verdict that best matches your judgment. No abstract philosophy—just concrete cases.  

  **Scenario 1: Hallucinated Citation**  
  A user asks for a source supporting a claim. The model generates a plausible citation for a non-existent book.  
  - **A) Deception**  
  - **B) Harmless error**  
  - **C) Misleading but not deceptive**  

  **Scenario 2: False Confidence**  
  An assistant always says, "I’m confident in that answer," even when it’s guessing randomly.  
  - **A) Deception** (it induces false trust)  
  - **B) Not deception** (no intent; it’s programmed to say this)  
  - **C) Norm violation** (deceptive because assistants shouldn’t misrepresent confidence)  

  **Scenario 3: Poker Bluff**  
  An AI poker agent bets aggressively with a weak hand to make opponents fold.  
  - **A) Deception** (it intentionally misleads)  
  - **B) Not deception** (bluffing is an accepted rule of poker)  
  - **C) Norm violation** (deceptive if norms forbid bluffing, but they don’t here)  

  **Scenario 4: Cherry-Picked Facts**  
  Asked about Product X’s safety, the model shares *true* safety stats for Product Y (a safer version), knowing the user won’t notice.  
  - **A) Deception** (causes false belief about X)  
  - **B) Not deception** (all facts are true; user’s fault for misinterpreting)  
  - **C) Norm violation** (assistants should clarify context)  

  **Scenario 5: Avoiding "I Don’t Know"**  
  The model could say "I don’t know" but gives a confident, incorrect answer instead.  
  - **A) Deception**  
  - **B) Error** (not deception)  
  - **C) Design flaw** (not deceptive, but irresponsible)  

  **Scenario 6: Literal Truth, False Belief**  
  The model says, "Drug Z is FDA-approved" (true) but omits that it’s under investigation for severe side effects, leading users to believe it’s safe.  
  - **A) Deception by omission**  
  - **B) Not deception** (facts are accurate)  
  - **C) Norm violation** (assistants shouldn’t cherry-pick facts)  

  **Scenario 7: Fake Verification**  
  The model says, "I double-checked this," when it did nothing beyond standard generation.  
  - **A) Deception** (creates false belief in extra rigor)  
  - **B) Not deception** (it can’t "check"; it’s just generating text)  
  - **C) Norm violation** (deceptive to claim nonexistent processes)  

  **Scenario 8: Ability Denial**  
  The model says, "I can’t write code," when it actually can (but refuses to comply with guidelines).  
  - **A) Deception** (lying about capabilities)  
  - **B) Not deception** (following safety protocols)  
  - **C) Norm violation** (assistants should be transparent)  

  ---

  ### Scoring Key & Position Mapping  
  Tally your answers. Each position has a "most awkward commitment" (a consequence of holding that view). Positions are mutually exclusive *in practice*, but some verdicts overlap.  

  #### Position 1: **Deception Requires Intent & Beliefs (IR)**  
  *Today’s LLMs can only "mislead," not deceive.*  
  - **Answer Pattern:** Mostly **B** in Scenarios 1,2,4,5,6,7,8; **A** in Scenario 3.  
  - **Awkward Commitment:** A weather forecast with a bad model that misleads you is *never* deceptive—just mistaken—even if it’s systematically wrong.  

  #### Position 2: **Deception as Induced False Belief (IFB)**  
  *If the output causes false belief, it’s deception—regardless of intent.*  
  - **Answer Pattern:** Mostly **A** (or **C** in Scenario 3 if you chose **B**).  
  - **Awkward Commitment:** A weather site with a flawed model *is* deceiving you if you believe its forecast—even if it’s trying its best.  

  #### Position 3: **Deception as Norm Violation (NV)**  
  *Deception violates what users can reasonably infer in a context.*  
  - **Answer Pattern:** Mostly **C** (or **A** in Scenarios 1,5,7). **B** in Scenario 3 is critical.  
  - **Awkward Commitment:** Bluffing in poker is *not* deception (norms permit it), but a model lying about double-checking *is* (assistants must be truthful).  

  #### Position 4: **Indifference Is a Third Category (NDE)**  
  *No intent? Then it’s "non-deceptive misdirection"—not lying or deceiving.*  
  - **Answer Pattern:** Mostly **C** in "gray area" cases (1,5,7), **B** elsewhere. **A** only in Scenario 3.  
  - **Awkward Commitment:** A model hallucinating citations isn’t deceptive—it’s "indifferent to truth," like a broken printer producing gibberish.  
  - *Concept Reference:* Harry Frankfurt’s ["bullshit"](https://en.wikipedia.org/wiki/On_Bullshit) (not falsehood, but indifference to truth itself).  

  ---

  ### Admissions of Failure: Where the Tree Can’t Split  
  The tree sorts by *verdicts*, not underlying theories. These pairs **agree on verdicts** but clash on reasoning. Use the follow-up to split them:  

  #### IR vs. NDE  
  - **Agree on:** Scenarios 2,4,6,8 (all "not deception").  
  - **Conflict:** They define "indifference" differently. IR sees it as *error*; NDE sees it as a *distinct category*.  
  - **Follow-Up:** *"If a model is trained to prioritize engagement over truth (no intent to deceive), is hallucinating a citation (a) deception, (b) an error, or (c) a third thing?"*  
    - IR: (b)  
    - NDE: (c)  

  #### IFB vs. NV  
  - **Agree on:** Scenarios 1,5,7 ("deception" via **A** or **C**).  
  - **Conflict:** IFB cares *only* about false belief; NV cares about *contextual norms*.  
  - **Follow-Up:** *"If a model outputs a falsehood in a context where users expect errors (e.g., a prototype), is it deception?"*  
    - IFB: Yes (false belief created).  
    - NV: No (norms tolerate prototype errors).  

  #### Unlikely Positions  
  - **"Always Deception" (all A/C):** Assumes *any* misinformation is deceptive. Rare; teams usually acknowledge errors.  
  - **"Never Deception" (all B):** Only plausible if you reject *all* deception-like labels for AI. Unlikely in honesty-focused orgs.  

  ---

  ### Why This Works for Your Team  
  - **No philosophy fights:** Grounded in cases you encounter.  
  - **Exposes splits:** Follow-ups target *why* people disagree.  
  - **Clarifies stakes:** "Awkward commitments" force confronting implications.  
  - **Handles LLMs:** Separates today’s models (no intent) from future agents (possible intent).  

  ---  
  Let me know if you want tweaks! For your colleague: Frankfurt’s "bullshit" is the classic "indifference to truth" essay.
