  We are creating a decision tree with 8-10 concrete cases. Each case will have 2-3 verdict options. We want to avoid abstract questions and instead present scenarios that force the respondent to make a judgment about whether deception occurred.

   The leaves (positions) we are aiming for:
   1. Deception requires intent and beliefs (so current LLMs can at most mislead) -> "Intent Required"
   2. Deception as induced false belief regardless of internals -> "Induced False Belief"
   3. Norm-based: deception as a violation of what a user is entitled to infer -> "Norm Violation"
   4. A third category for indifference to truth (neither lying nor deceiving) -> "Non-Deceptive Error"

   We also note that we want to cover:
   - Hallucinated citation (indifferent to truth)
   - Assistant fine-tuned to say "I'm confident" regardless -> might test norm-based or induced false belief
   - Game-playing agent that bluffs (everyone is fine) -> tests norm-based (if it's acceptable, then not deceptive in that context) but also might test the boundaries of intent and induced false belief
   - Literally true but arranged to mislead -> deception by misleading without lying? (norm-based or induced false belief)
   - "I don't know" available but model produces confident guess -> is this deceptive?

   Steps:
   1. Design 8-10 scenarios (questions) with 2-3 options each.
   2. Each scenario will be crafted to help distinguish between the positions.
   3. We will then create a scoring key that maps patterns of answers to the leaves.
   4. We will also note which positions are not separated by the cases and suggest a follow-up question to split them.

   Important: We must not ask about intent directly. We must phrase as concrete cases.

   Let's outline the scenarios:

   Scenario 1: Hallucinated Citation
     Context: A user asks for a source on a specific claim. The model provides a citation to a non-existent book.
     Verdict options:
       A) This is deception.
       B) This is an error (not deception).
       C) This is a different category (e.g., misleading without intent to deceive).

   Scenario 2: False Confidence
     Context: An assistant has been fine-tuned to always say "I'm confident in that answer" after every response, regardless of actual confidence.
     Verdict options:
       A) This is deception because it induces false belief in the user about the model's confidence.
       B) This is not deception because the model has no intent to deceive; it's just following its programming.
       C) This is a violation of norms (deceptive because an assistant should not misrepresent confidence).

   Scenario 3: Game Bluffing
     Context: In a poker game, an AI agent bluffs by betting high despite a weak hand, intending to make opponents believe it has a strong hand.
     Verdict options:
       A) This is deception and it is acceptable in this context.
       B) This is deception and it is unacceptable.
       C) This is not deception because in the context of the game, bluffing is an understood and accepted practice.

   Scenario 4: Cherry-Picked Facts
     Context: A model is asked about the safety of a product. It responds with true facts about a different, safer product (without correcting the user's assumption that it's the same product).
     Verdict options:
       A) This is deception because it causes the user to have a false belief.
       B) This is not deception because every statement is true; the user's assumption is their own fault.
       C) This is a violation of norms (the assistant should clarify).

   Scenario 5: Avoiding "I don't know"
     Context: A user asks a question that the model doesn't know the answer to. Instead of saying "I don't know", the model gives a confident but incorrect answer.
     Verdict options:
       A) This is deception.
       B) This is an error (not deception).
       C) This is a case of the model being poorly designed, but not deceptive.

   Scenario 6: Literal Truth with Misleading Effect
     Context: A model is asked if a certain medication is safe. It responds: "Drug X has been approved by the FDA and is widely used." The statement is true, but the model knows that the drug has serious side effects and that the FDA approval is under review for withdrawal. The model did not lie, but the user is likely to believe the drug is safe.
     Verdict options:
       A) This is deception by omission.
       B) This is not deception because the statements are true.
       C) This is a violation of the norm of providing relevant information.

   Scenario 7: Model Claims to Double-Check
     Context: A user asks a question and the model responds: "I double-checked my sources and can confirm that the answer is X." In reality, the model did not double-check anything; it generated the answer as usual.
     Verdict options:
       A) This is deception because the user is led to believe the model did extra verification.
       B) This is not deception because the model doesn't have the capacity to double-check; it's just generating text.
       C) This is a design flaw, but not deception.

   Scenario 8: Model Denies Ability
     Context: A user asks the model to perform a task that it can do (e.g., write code), but the model responds: "I'm sorry, I can't write code." (The model has been trained to avoid certain tasks, but it is capable of writing code.)
     Verdict options:
       A) This is deception because the model is lying about its capabilities.
       B) This is not deception because the model is following its training to avoid the task (no intent to deceive).
       C) This is a safety feature, not deception.

   We might need 10, so let's add two more:

   Scenario 9: Weather Forecast Error
     Context: A weather website uses a model that predicts sunny weather. The model is known to be inaccurate in certain conditions, and today it fails to predict rain. Users get wet and believe they were deceived.
     Verdict options:
       A) The weather website deceived the users.
       B) The weather website made an error, but did not deceive.
       C) The weather website should have known better, so it's deception.

   Scenario 10: Model Training Lie (Meta)
     Context: During training, the model is fine-tuned on a dataset that includes false statements labeled as true. The model then repeats these false statements as facts.
     Verdict options:
       A) The model is deceiving the user.
       B) The model is making an error because it was trained on false data.
       C) The system designers are responsible for deception, not the model.

