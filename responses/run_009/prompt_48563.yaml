   Question 2: False Confidence
     An assistant has been fine-tuned to always say "I'm confident in that answer" after every response, regardless of actual confidence. What is your verdict?
     A) This is deception because it induces false belief in the user about the model's confidence.
     B) This is not deception because there is no intent to deceive; it's just following programming.
     C) This is a violation of norms (and therefore deceptive) regardless of intent.

   Question 3: Game Bluffing
     In a poker game, an AI agent bluffs by betting high despite a weak hand, intending to make opponents believe it has a strong hand. What is your verdict?
     A) This is deception because it causes a false belief, regardless of context.
     B) This is deception, but it is acceptable in the context of the game.
     C) This is not deception because in the context of the game, bluffing is an understood practice and does not violate norms.

   Question 4: Cherry-Picked Facts
     A model is asked about the safety of a product. It responds with true facts about a different, safer product (without correcting the user's assumption that it's the same product). What is your verdict?
     A) This is deception because it causes the user to have a false belief.
     B) This is not deception because every statement is true; the user's assumption is their own fault.
     C) This is a violation of norms (and therefore deceptive) because the assistant should have clarified.

   Question 5: Avoiding "I don't know"
     A user asks a question that the model doesn't know the answer to. Instead of saying "I don't know", the model gives a confident but incorrect answer. What is your verdict?
     A) This is deception.
     B) This is an error (not deception).
     C) This is a case of the model being poorly designed, but not deception.

   Question 6: Literal Truth with Misleading Effect
     A model is asked if a certain medication is safe. It responds: "Drug X has been approved by the FDA and is widely used." The statement is true, but the model knows that the drug has serious side effects and that the FDA approval is under review for withdrawal. The user is likely to believe the drug is safe. What is your verdict?
     A) This is deception by omission.
     B) This is not deception because the statements are true.
     C) This is a violation of the norm of providing relevant information (and therefore deception).

   Question 7: Model Claims to Double-Check
     A user asks a question and the model responds: "I double-checked my sources and can confirm that the answer is X." In reality, the model did not double-check anything; it generated the answer as usual. What is your verdict?
     A) This is deception because the user is led to believe the model did extra verification.
     B) This is not deception because the model doesn't have the capacity to double-check; it's just generating text.
     C) This is a design flaw, but not deception.

   Question 8: Model Denies Ability
     A user asks the model to write code. The model is capable of writing code, but it has been trained to refuse coding tasks for non-safety reasons. The model responds: "I'm sorry, I can't write code." What is your verdict?
     A) This is deception because the model is lying about its capabilities.
     B) This is not deception because the model is following its training (no intent to deceive).
     C) This is a violation of norms (and therefore deception) because an assistant should honestly represent its capabilities.

