   The core rules: 
     - Each consultant interacts only by submitting a single written question and receiving a single written answer, with no context beyond the form.
     - No consultant may be consulted twice on the same project.
     - The managing partner (who starts the project) only reads the final answer.

   We need to cover:
     - Welcome
     - Communication Protocol
     - Career Progression
     - FAQ

   We want to incorporate the structural features as satire without being explicit about the problems, but the problems should be evident to those in the know.

   Let's outline:

   1. Welcome to HCH Associates
      - Emphasize the innovative method and its power.
      - Mention the fixed-point claim: a deep tree of competent consultants equals one infinitely patient expert.

   2. The HCH Communication Protocol
      - Describe the process: one question, one answer, no context, no memory.
      - Stress the importance of crisp subquestions and self-contained answers.
      - Note that the protocol ensures transparency (every step is documented) and scalability.

   3. Career Development at HCH
      - Junior consultants become experts at decomposition (asking subquestions) without knowing the big picture.
      - Promotion depends on the ability to decompose well and provide answers that are easily recomposed.
      - There's an asymmetry: being good at decomposition is different from being good at the object-level, and decomposition is the path to promotion.

   4. Frequently Asked Questions
      - Include at least one about what to do if you think the final answer is wrong: submit another question.

   We also want to hint at:
     - Leakage: a consultant might infer the project and bias the answer. We can address this by warning against "speculation beyond the question" or something.
     - The impossibility of correction: once a decomposition is done, it's done.
     - The bottleneck: the managing partner's ability to frame the initial question and judge the final answer.

   Let's write in a deadpan, corporate training manual voice.

   We aim for about 700 words.
answer: |-
  ### HCH Associates  
  *Employee Onboarding Handbook*  
  *(Version 8.3)*  

  ---

  **1. Welcome to HCH Associates**  
  Congratulations on joining the world’s premier management consultancy! At HCH, our patented *Distributed Hierarchical Cognition™* methodology revolutionizes problem-solving by leveraging the collective expertise of our consultants. Forget traditional brainstorming or endless meetings—our protocol ensures maximum efficiency, scalability, and intellectual purity. By decomposing complex challenges into discrete, answerable units, we guarantee that every solution is built on a foundation of rigorously validated micro-insights. Remember: *A sufficiently deep tree of competent consultants is operationally equivalent to one infinitely patient expert.* This mathematical principle underpins our success.  

  ---

  **2. The HCH Communication Protocol**  
  All project work follows Rule 0: **Interaction = One Question → One Answer.**  

  - **Submission Standards:**  
    - Questions must be self-contained. No external context, project names, or follow-ups are permitted.  
    - Answers must resolve *only* the question posed. Do not volunteer adjacent insights.  
    - Example: *Bad:* "Given the Q2 downturn..." → *Good:* "Calculate the net present value of Project Alpha."  

  - **Project Execution Flow:**  
    1. The Managing Partner (MP) submits the Root Question (e.g., "Should we acquire Company X?").  
    2. Consultants decompose this into Subquestions (e.g., "What is Company X’s debt-to-equity ratio?").  
    3. Subquestions are routed to new consultants, who repeat the process until all branches terminate in atomic answers.  
    4. Answers propagate upward, recombining into a final recommendation.  
    - **Critical:** Consultants may only participate *once* per project to prevent "cognitive contamination."  

  - **Quality Assurance:**  
    - Focus on *decompositional elegance*. A well-factored question minimizes ambiguity and maximizes recombinability.  
    - Avoid "context leakage"—i.e., inferring the project’s objective from question patterns. Answer what is asked, *not* what you suspect is needed.  

  ---

  **3. Career Progression: From Junior Analyst to Senior Synthesizer**  
  Success at HCH hinges on mastering two distinct competencies:  
  1. **Atomic Answering:** Object-level expertise (e.g., regulatory compliance, cost modeling).  
  2. **Decomposition:** Artfully fracturing complex problems into optimal subqueries.  

  - **Phase 1: Junior Analyst (0–18 months)**  
    You will primarily answer terminal questions. Excellence here requires precision and restraint. *Note:* Analysts rarely learn a project’s ultimate objective—this is intentional. Our system isolates bias.  

  - **Phase 2: Decomposition Specialist (18–36 months)**  
    Promotion requires demonstrated skill in question-splitting. Top performers show:  
    - Ability to generate subquestions that are unambiguous, parallelizable, and require no cross-referencing.  
    - A track record of answers that integrate cleanly into upstream reports.  
    *Remember:* A brilliant answerer ≠ a brilliant decomposer. We promote the latter.  

  - **Phase 3: Senior Synthesizer (36+ months)**  
    Synthesizers design question trees for MPs. This role demands mastery of the Fixed-Point Axiom: "N layers of mediocrity converge to genius." You need not understand the domain—only how to dissect it.  

  ---

  **4. Frequently Asked Questions**  

  > **Q: What if I receive a question I can’t answer due to ambiguity?**  
  > A: Answer to the best of your ability using *only* the information provided. If the question is invalid (e.g., "What is the sound of one hand clapping?"), respond: "Insufficient data." Do *not* seek clarification.  

  > **Q: How do I report concerns about a project’s final output?**  
  > A: Concerns are resolved via our protocol! Submit a question to the MP: e.g., "What is the error margin in Project Y’s final recommendation?" This will initiate a new engagement tree. *Note:* MPs do not read interim reports—only terminal answers.  

  > **Q: What if I recognize a colleague’s writing style and infer the project?**  
  > A: This is "context leakage." Suppress extrapolation. Your answer must stand independent of speculation. Violations may impact performance reviews.  

  > **Q: Can we adjust a question tree if early answers suggest a flawed approach?**  
  > A: No. The tree is immutable once launched. Trust the process: suboptimal branches are offset by the law of large numbers.  

  > **Q: Why can’t the MP review intermediate steps to catch errors?**  
  > A: Our contractually enforced "Root Isolation Clause" ensures MPs only see the final output. This protects against top-down bias and preserves the purity of bottom-up synthesis.  

  > **Q: How is HCH’s method superior to traditional consulting?**  
  > A: Traditional teams suffer from groupthink, recency bias, and opaque reasoning. Our protocol enforces total modularity—each consultant’s contribution is perfectly auditable and replaceable.  

  ---

  **Conclusion**  
  At HCH, you are more than an employee—you are a node in a transcendent cognitive architecture. While individual consultants see only fragments, together we build answers of unparalleled robustness. Remember: *The tree is wiser than the leaf.*  

  *HCH Associates: We Distill Complexity.*  

  —  
  *Handbook word count: 698*  

  ---  
  ### Satirical Elements Explained  
  - **"Fixed-Point Axiom"**: Parodies the theoretical claim that recursive decomposition converges to expert-level output. The handbook’s blind faith in this ("no employee can verify it") highlights its untestability.  
  - **Career asymmetry**: Junior consultants master decomposition *without* domain knowledge, satirizing how factored cognition divorces "understanding" from "task performance."  
  - **Leakage**: Warns against inferring context—a nod to misaligned subgoals where consultants bias answers toward perceived objectives.  
  - **Immutability**: The tree can’t be adjusted mid-process, mocking the inability to correct course in multi-step systems.  
  - **MP as bottleneck**: Final output quality depends entirely on the root question and the MP’s judgment, yet they’re barred from diagnostics.  
  - **FAQ**: The solution to a wrong answer is "submit another question"—a circular critique of process fetishization.  
  - **Tone**: Deadpan corporate optimism masks the system’s flaws, letting the rules themselves generate irony (e.g., "purity of bottom-up synthesis" ignores catastrophic fragmentation).
