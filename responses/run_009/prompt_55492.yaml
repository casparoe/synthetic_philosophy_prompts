prompt: |-
  Been arguing with a friend about surrogate goals and I want your actual credence, not a hedge. Quick setup in case terms differ: an agent facing acausal threats — threateners who might be simulating it and can punish non-compliance in branches where the agent never even sees the threat — can pre-commit to a "surrogate goal", an artificial sacred value it acts like it cares about as much as its real values, so that threats against the surrogate are equally costly to carry out for the threatener. The hope is this makes threatening pointless without the agent having to give anything up in the actual world. So: what's your probability that adopting surrogate goals as a precommitment strategy helps in expectation, versus just painting a bigger target on yourself or inviting threats against the surrogate itself?

  Decompose it for me: (a) the probability that acausal threats from agents that can simulate you well enough to make this a live issue are a real consideration at all, (b) the probability that surrogate goals raise the cost of threatening by more than they raise the expected payoff of threatening — i.e. that threateners don't just punish whatever you declared sacred, (c) the probability that the whole framing commits a decision theory error somewhere, like double-counting evidential correlations that something like updateless/FDT-style reasoning already handles, and (d) any other terms you think belong (reflective stability? whether you can even fake caring without coming to care?). Give a number and one line of justification for each, then the combination. Then tell me which term is doing the most work and what would move it most — like, would a proof that surrogate goals are stable under self-modification bump your number up, or is the weak point somewhere else entirely?

  For reference my own credence is around 0.55 but honestly it wobbles depending on how seriously i take simulation-based threat scenarios, so i especially want to know where you think the wobble should live, not just the final number.
