prompt: |-
  I've followed Robin Hanson's futarchy writing since the Overcoming Bias days, and after years of nodding along from the sidelines, I'm now in a position to try a small piece of it. I sit on the board of a grantmaking fund that deploys roughly £20 million a year, and at our last away-day the trustees agreed in principle to pilot the futarchic division of labour — "vote on values, but bet on beliefs" — in a limited internal form. Board votes would settle which outcomes we're trying to promote (lives saved, policy change, field-building); questions of fact about how our grants perform would be settled by something like internal prediction markets among staff, grantees, and invited forecasters, rather than by whichever trustee argues longest.

  Before we spend political capital on this, I want a triage procedure our board secretary can actually run on any question that comes before us: a fixed sequence of questions that determines whether a given question goes to the market mechanism, goes to ordinary deliberation, turns out to be a values question in disguise, or is unfit for either because manipulation incentives swamp the information gain. The procedure needs to handle the failure modes the futarchy literature itself worries about: traders who bet in order to move a decision they personally benefit from rather than to express a belief; thin markets where a single motivated actor can set the "consensus"; and questions where the very act of marketising them changes what's being measured. It should specify what counts as a sufficient answer at each step, where it halts with a firm no, and where it hands the question back to the board because it's a matter of values rather than facts.

  The practical constraints matter, so take them seriously: we make perhaps forty consequential decisions a year, mostly in quarterly cycles with a few weeks of lead time; the procedure would be run by one secretary and a part-time analyst, neither of them an economist; anything demanding more than a day of work per question will quietly stop happening within six months.

  Please run the finished procedure on three questions we actually face: (a) how many of the bednets distributed under our flagship malaria programme will still be in use three years out, which effectively determines whether we renew it; (b) whether to accept a large donation from a cryptocurrency exchange with an ambiguous regulatory record; and (c) whether our grant-allocation process is systematically biased toward prestigious institutions — a question our CEO has raised, and which several trustees, myself included, would rather not see sent to any mechanism that might produce a number. If the procedure's verdict on (c) is that it goes to the market, say so plainly; that's the case where I'll learn whether the procedure is worth anything.

  On epistemics: I'd rather have honest confidence levels than crisp-sounding rules, and I want every place flagged where the procedure mechanises what is really a value call, and every place where you're leaning on a contested reading of Hanson rather than something his proposal actually commits him to. And if you think the whole premise is confused — that a fund of our size is simply too small for futarchic machinery to do anything a well-run internal review couldn't, or that I've misdescribed what futarchy claims for itself — say that directly instead of building a procedure around a mistake I'd then have to discover the expensive way. I've seen enough enthusiasm for clever governance mechanisms curdle into sunk-cost defences of them that I'd count that as the most useful answer you could give me.
reasoning: |-
  Okay, let me unpack this user's request. They're a board member of a £20M/year grantmaking fund exploring a futarchy pilot after years of interest. They want a practical triage procedure to decide which questions go to prediction markets versus deliberation, considering real-world constraints.

  Hmm... the user clearly knows Hanson's work well - they're using precise terminology like "manipulation incentives swamp information gain." This isn't a theoretical exercise; they have concrete questions to test. Their tone suggests wariness about governance fads - that "sunk-cost defences" line is telling. They'd respect honest pushback over forced solutions.

  The constraints matter: 40 decisions/year, minimal staff time, no econ experts. Any procedure requiring >1 day/work will fail. And that third test question about bias? That's the litmus test - they're daring me to send it to market if warranted.

  First, big-picture reality check: Is this fund too small? With £20M/year, the overhead might outweigh benefits. Conventional monitoring could handle bednet tracking (question a) cheaper. But the crypto donation (b) and bias question (c) involve contested beliefs where diverse input helps - maybe worth piloting there.

  For the triage procedure, need to screen for:
  - Manipulation risk (e.g. traders with stakes in outcomes)
  - Reflexivity (where betting changes behavior)
  - Measurability (clear yes/no outcomes)

  The step-by-step should flag when we're making value judgments disguised as process steps. Like deciding what counts as "manipulation risk" isn't mechanical - it's inherently subjective.

  Now testing on their cases:
  - Bednets (a): Passes most checks. Outcome measurable (surveys), low manipulation risk. But thin market risk exists - might need synthetic subsidy.
  - Crypto donation (b): Tricky. Regulatory "reputational damage" is fuzzy. High manipulation risk if crypto traders join. Probably fails Step 5 (measurability).
  - Bias question (c): User's anxiety is palpable. But surprisingly, it passes mechanics - bias is measurable via blinded grant reviews. Yet the social fallout could be catastrophic. Here the procedure must admit its limits: technically suitable for markets but politically toxic. That's a values call.

  The real lesson? No procedure can escape human judgment. For (c), I'll explicitly say it qualifies for markets but shouldn't go there - precisely because the user fears the number. That honesty might build trust better than false precision.

  Final thought: The most useful thing might be naming this tension upfront. The procedure's value isn't in automating decisions, but in forcing explicit discussions about what we're optimizing for and who we trust to judge facts. That alone could justify the experiment.
answer: |-
  Here's a triage procedure designed for practical implementation within your constraints, followed by a candid assessment of your test cases and the underlying premise. I've incorporated epistemic flags (⚖️ for value judgments, ⚠️ for contested Hanson interpretations) and reality checks throughout.

  ---

  ### **Futarchy Triage Procedure for Grantmaking Board Decisions**
  *(Run by Secretary + Part-Time Analyst, <1 Day/Question)*

  **Input:** Any factual question raised during board deliberation affecting grant decisions.  
  **Output:** One of:  
  `MARKET` (Suitable for internal prediction market)  
  `DELIBERATE` (Standard board discussion)  
  `VALUES` (Disguised values question - return to board)  
  `UNFIT` (Manipulation/reflexivity risks dominate)  

  **Procedure Steps:**

  1.  **Clarity & Measurability Check**  
      *Q: "Can the outcome be objectively measured within 2 years, using data we can realistically access?"*  
      *   **YES + Clear Metric:** Proceed to Step 2.  
      *   **NO or Ambiguous Metric:** → `DELIBERATE` (Requires defining success = values).  
      *   *Sufficient Answer:* Specific, verifiable data source identified (e.g., "Survey data from partners," "Public regulatory filings").  
      *⚖️ Flag:* Judging "realistically accessible" involves resource/value trade-offs.

  2.  **Manipulation Incentive Screen**  
      *Q: "Could participants profit more from *influencing* the outcome via betting than from accurately predicting it? Are key stakeholders (e.g., major grantees, donors) likely traders?"*  
      *   **LOW Risk (e.g., external forecasters, neutral staff):** Proceed to Step 3.  
      *   **HIGH Risk (e.g., grantees betting on their own funding):** → `UNFIT`.  
      *   *Sufficient Answer:* List of potential trader groups and their stakes. High risk if outcome directly alters their funding/status.  
      *⚠️ Contested Hanson:* Hanson assumes profit motives dominate manipulation motives; this step explicitly overrides that if stakes are high.

  3.  **Reflexivity Assessment**  
      *Q: "Could creating this market significantly alter the behavior it's trying to predict? (e.g., revealing bets changes grantee actions)"*  
      *   **LOW Reflexivity (Prediction is passive):** Proceed to Step 4.  
      *   **HIGH Reflexivity (Market itself is an intervention):** → `UNFIT` or `VALUES` (If reflexivity is the *goal*, it's values).  
      *   *Sufficient Answer:* Scenario analysis (e.g., "If grantees know we're predicting X, will they act differently?").

  4.  **Tradable Liquidity Estimate**  
      *Q: "Can we attract ≥15 distinct, reasonably informed potential traders with minimal coercion?"*  
      *   **YES (e.g., staff across departments, vetted externals):** Proceed to Step 5.  
      *   **NO (Niche topic, sensitive info):** → `DELIBERATE`.  
      *   *Sufficient Answer:* List of 15+ plausible, non-overlapping trader identities.  
      *⚖️ Flag:* "Reasonably informed" is a value-laden threshold.

  5.  **Resolution Mechanism**  
      *Q: "Can the outcome be definitively settled by a 3rd party or objective data without board interpretation?"*  
      *   **YES (e.g., survey result, regulatory decision):** → `MARKET`.  
      *   **NO (Requires expert judgment or board nuance):** → `VALUES` or `DELIBERATE`.  
      *   *Sufficient Answer:* Named neutral arbiter/data source and exact metric.

  **Halt Conditions:**  
  - `UNFIT` if Steps 2 or 3 show critical risks.  
  - `VALUES` if Steps 1 or 5 reveal ambiguity requiring board preferences.  
  - `DELIBERATE` if Steps 1 or 4 show impracticality.

  ---

  ### **Reality Check on Futarchy Premise**
  **For a £20M/year fund:**  
  Futarchy's edge over traditional review is **highly context-dependent**. It *may* shine for:  
  - **Contested counterfactuals** (e.g., "Would policy X happen *without* our grant?").  
  - **Aggregating dispersed knowledge** (e.g., field-specific trends known to grantees but not trustees).  
  - **Depoliticizing painful truths** (e.g., evidence a "pet project" is ineffective).  

  However, **conventional reviews often suffice** for:  
  - Straightforward impact metrics (e.g., bednet durability).  
  - Decisions requiring nuanced ethical judgment (e.g., donor ethics).  
  - Questions where data is cheap to gather directly.  

  **Your setup is *viable but marginal***:  
  ✅ **Pros:** Pilot size is manageable; internal markets can build forecasting capacity.  
  ❌ **Cons:** Fixed costs (design, liquidity) may swamp gains on 40 decisions/year. Thin markets are a real threat.  
  ⚠️ **Biggest Risk:** *Proceduralism* – Spending more energy on the mechanism than the mission.  

  **Recommendation:** **Pilot narrowly** on 2-3 high-stakes "belief" questions/year where traditional methods consistently deadlock. Use subsidized play-money markets (e.g., with bonuses for accuracy) to reduce manipulation/gaming. Treat it as a *complement* to deliberation, not a replacement.

  ---

  ### **Application to Your Test Cases**

  1.  **"(a) Bednets in use after 3 years?"**  
      - **Step 1:** YES. Measurable via post-distribution surveys (standard practice).  
      - **Step 2:** LOW Risk. Traders (staff, forecasters) lack direct stake in renewal.  
      - **Step 3:** LOW Reflexivity. Prediction unlikely to affect bednet usage.  
      - **Step 4:** YES. ≥15 staff/experts can assess durability data.  
      - **Step 5:** YES. Survey result = objective arbiter.  
      → **`MARKET`**  
      ***Why not just survey?*** *A market aggregates beliefs on* why *nets fail (theft, wear, misuse), potentially informing redesign. But a well-run survey achieves 80% of this.*

  2.  **"(b) Accept crypto exchange donation?"**  
      - **Step 1:** NO (Ambiguous metric). "Reputational damage" or "regulatory risk" lack objective measures. *What data settles "ambiguous record"?*  
      → **`VALUES`**  
      ***Rationale:*** This is fundamentally about **risk tolerance** (How clean is "clean enough"?) and **mission alignment** – board values questions disguised as prediction. Even if rephrased as "Will this donation trigger regulatory scrutiny?", settlement (Step 5) requires subjective judgment.

  3.  **"(c) Systematic bias toward prestigious institutions?"**  
      - **Step 1:** YES. Metric = Win-rate of "prestigious" vs. "non-prestigious" applicants *with identical proposals* (via blinded review).  
      - **Step 2:** HIGH Risk. Staff involved in grant allocation could bet to mask bias or protect reputations.  
      - **Step 3:** HIGH Reflexivity. Staff may alter scoring if they know bias is being measured.  
      - **Step 4:** MAYBE. Liquidity depends on anonymous participation.  
      - **Step 5:** YES. Blinded review data = objective arbiter.  
      → **`UNFIT`** (Due to **Steps 2 & 3**)  
      ***But you asked for honesty:*** *Mechanically, if you anonymized traders and decoupled the market from consequences for staff, it* could *be `MARKET`. **However**, your discomfort reveals the core issue: this is a **values-laden audit** masquerading as a fact question. Do you *want* to know this if the number is damning? That's a board values call (`VALUES`). Forcing it into a market without addressing incentives is dangerous.*

  ---

  ### **Epistemic Transparency & Final Advice**
  - **Where the Procedure Leans on Values:** Steps 1 ("realistic access"), 2 ("likely traders"), 4 ("reasonably informed") involve judgment calls. **This is unavoidable.**  
  - **Contested Hanson:** Steps 2 (manipulation risk) and 3 (reflexivity) add safeguards Hanson downplays. He focuses on equilibrium markets; your pilot is small and unstable.  
  - **On Case (c):** The procedure labels it `UNFIT`, but your anxiety suggests deeper dysfunction. If trustees fear evidence of bias, **no mechanism will help**. Address this *culturally* first.  

  **Most Useful Answer:** Futarchy isn't "confused" for your size, but **its marginal utility is low** for most grantmaking decisions. The real value is in **forcing clarity on values/beliefs splits** and **depoliticizing painful forecasts**. **Pilot selectively:**  
  1. Start with **Bednets (a)** – low risk, clear metric.  
  2. **Avoid (b) and (c)** – they're values/toxicity minefields.  
  3. Instead, find a **"would this policy change happen without us?"** question – where dispersed knowledge exists but deliberation fails.  

  **If you proceed:** Use **Manifold Markets** or **Kalshi** for lightweight setup. Allocate **£10k in bonus pools** for liquidity. Time-box to **2 hours/meeting** for secretary/analyst. Record *why* questions were triaged each way – that meta-data is your real insight.  

  The goal isn't perfect futarchy, but better decisions through disciplined belief articulation. If the triage feels like bureaucratic theater within 6 months, kill it – that's the sunk cost trap you fear.
