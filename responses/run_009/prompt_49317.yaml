prompt: |-
  Background: I'm a philosophy PhD student, and my advisor just tore his achilles, so I'm covering his upper-level jurisprudence seminar next week — 14 students, 80 minutes. They've all read the 1958 Hart–Fuller exchange in some abstract way, but from sitting in on their discussion sections, nobody actually feels the stakes; it's chestnut-shelling, people recite "law and morality" platitudes at each other. I want to build the whole session around the grudge informer case: 1944, a woman who wants to get rid of her husband denounces him to the Nazi authorities for derogatory remarks about Hitler that he made while home on leave; he gets hauled off under validly enacted Nazi statutes; then a 1949 West German court has to decide whether she can be convicted (the real court reached back to the 1871 Code's crime of "illegal deprivation of liberty" to do it). That's the case that made the debate a real fight instead of a semantic one.

  My idea so far: split the room into three "courts," each ruling on her case under different constraints. Court One gets only validly enacted law — the Nazi statute was enacted by procedures that legal order itself recognized, plus whatever postwar statutes existed. Court Two is told to rule as justice requires but must write an opinion an actual trial judge could sign his name to. Court Three gets a fictional handout I'd draft: a "Transitional Justice Act" passed by the postwar legislature that retroactively criminalizes political denunciation between 1933 and 1945. The thing I'm fishing for is that Court Three never has to say anything at all about what "law" is, and then in the debrief they have to work out whether Court Two's natural-law reasoning is doing any work the retroactive statute doesn't do cheaper and cleaner — which I take to be Hart's actual move, that treating the Nazi law as voidable rather than void gets you everything without metaphysics. But I've never taught before, so maybe this whole structure is off.

  Design me the full thing: role sheets or instructions for each court, timing across the 80 minutes, materials (the handouts should be sketched for me, including my Transitional Justice Act with whatever loopholes/drafting bugs are actually useful), some payoff or stake that isn't real money, and a debrief that maps what happened onto the actual positions without just lecturing at them. I also want the two honest addenda the examples of this kind of thing always mention: what will predictably go wrong the first time I run it, and which feature of the debate the activity flatly cannot reproduce — I'm guessing Fuller's "inner morality of law," the generality and publicity stuff, just doesn't show up in a one-shot courtroom game, but tell me if I'm wrong. And please push back on the setup itself: if you think the grudge informer case is too worn out to make anyone feel anything, or that three courts is one too many, or that role-play collapses into debate club at this size, say that plainly instead of designing politely around my half-baked plan. Better an awkward correction from you than 14 bored students and an achilles-less professor hearing about it.
reasoning: |-
  Hmm, the user is a philosophy PhD student stepping in to teach a jurisprudence seminar due to their advisor's injury. They've observed that students understand the Hart-Fuller debate abstractly but miss the stakes, particularly in the grudge informer case. They want an interactive session with three simulated courts to make the debate tangible, but they're new to teaching and concerned about potential pitfalls.

  The core issue here is making 20th-century legal philosophy feel urgent. Students can parrot "law vs morality" arguments but don't grasp why it mattered when real lives hung in the balance. The grudge informer case is perfect for this—it forces concrete decisions about retroactive justice and legal validity. 

  Their three-court structure is pedagogically sound: Court One (legal positivism) exposes the horror of applying Nazi laws mechanically; Court Two (natural law) invites moral reasoning within judicial constraints; Court Three (retroactive statute) shows Hart's pragmatic alternative. The critical insight is Court Two's struggle—when students try drafting "justice-based" opinions, they'll unconsciously rely on unstated legal principles, revealing Fuller's point about law's inherent morality. 

  Potential hiccups: 
  - Time crunch is real. 80 minutes for prep, deliberation, and debrief demands ruthless pacing. 
  - Quiet groups may freeze without clear roles (hence assigning Chief Justice/Recorder).
  - Court Three might oversimplify the debate if their statute works "too well"—I'll add drafting flaws to prevent that. 
  - Fuller's procedural principles (generality, publicity) won't emerge organically; that must be teased out in debrief. 

  Materials need subtle flaws: The "Transitional Justice Act" will exclude denunciations by coercion (sparing true victims) but require proving the informer's malicious intent—which parallels Fuller's concern about retroactive laws trapping the unwary. 

  For payoff: Rather than declaring winners, the debrief will spotlight tension points. When Court Two's opinion cites "principles of civilized justice," ask: "What makes a principle 'legal' rather than moral? Could a Nazi judge have used your reasoning?" That forces the Hart-Fuller clash into the open.
answer: |-
  Here’s a battle-tested lesson plan designed to force engagement with the Hart-Fuller stakes, using your core structure but tightened for time and impact. I’ve flagged pitfalls and philosophical gaps bluntly.

  ---

  ### **Lesson Plan: The Grudge Informer on Trial**
  **Total Time:** 80 minutes  
  **Goal:** Expose the concrete stakes of legal validity vs. morality in transitional justice, and pressure-test Hart’s "retroactive statute" solution against Fuller’s inner morality critique.

  ---

  ### **Materials & Prep (Distribute at Start)**
  1.  **Case Brief (1 page):**  
      > *September 1944: Frau Helga R., seeking to divorce her husband Karl (a soldier home on leave), denounces him to Gestapo for saying "Hitler is leading us to ruin." Karl is arrested under the 1934 "Malicious Attacks on State and Party Law" (validly enacted by Nazi Reichstag). He dies in a concentration camp.  
      > Post-1945: West Germany voids Nazi racial laws but retains pre-1933 civil/criminal codes. In 1949, Frau R. is prosecuted. What charge? No postwar statute explicitly criminalizes "political denunciation under Nazi rule."*

  2.  **Court Instructions (Different handouts per group):**  
      - **COURT ONE (Positivist Cage):**  
        > *"Apply ONLY validly enacted law. Statutes in force:  
        > - Pre-1933 German Criminal Code (1871): §239 "Illegal Deprivation of Liberty" (punishes unlawful imprisonment).  
        > - Post-1945 Allied Control Council Laws (void Nazi racial laws; silent on denunciations).  
        > **YOUR RULE:** Convict ONLY if her acts violated a clear, valid statute at the time she acted. Write an opinion justifying your verdict."*  

      - **COURT TWO (Justice in Judicial Drag):**  
        > *"Rule as justice demands, BUT your opinion must:  
        > (1) Cite existing legal texts (statutes, codes, constitutions),  
        > (2) Avoid religious/moral philosophy language,  
        > (3) Be signable by a real judge in 1949 West Germany.  
        > **VERDICT OPTIONS:** Acquit OR Convict (specify crime/punishment)."*  

      - **COURT THREE (Retroactive Statute - YOUR DRAFT):**  
        > *"Apply the 1947 'Transitional Justice Act':  
        > §1: Any person who, between 30 Jan 1933–8 May 1945, voluntarily denounced another to Nazi authorities for acts not constituting violent crime under the 1871 Code, is guilty of 'Betrayal of Civic Trust.'  
        > §2: Exempts denunciations made under imminent threat of death/torture.  
        > §3: Penalty: 1–10 years imprisonment.  
        > **YOUR TASK:** Apply this law to Frau R. Does it cover her? Any flaws?"*  
        > *(Key "bugs": §1’s "voluntarily" is undefined; "Betrayal of Civic Trust" is a novel crime; §2’s "imminent threat" excludes psychological coercion.)*

  ---

  ### **Timeline (Strict Enforcement!)**
  1.  **Framing (5 min):**  
      - *"Today we're judges in 1949 Germany. A woman denounced her husband for insulting Hitler; he died in a camp. Your task: Apply law to this act. No abstractions—render a verdict."*  
      - Assign groups (4-5 students/court). Groups 1/2/3 get respective handouts.

  2.  **Group Deliberation (25 min):**  
      - **Circulate & Prod:**  
        - *Court 1:* "If Nazi law was valid, was her act *legal*? Can you punish legal acts?"  
        - *Court 2:* "What 'legal' text supports 'justice' here? Can you avoid calling Nazi law 'void'?"  
        - *Court 3:* "Does 'voluntarily' cover social pressure? Is 'Betrayal' defined anywhere?"  

  3.  **Verdict Delivery (15 min):**  
      - Each court shares: (1) Verdict, (2) Core legal rationale (1-2 sentences), (3) Biggest struggle.  
      - **Sample Predictions:**  
        - *C1:* Acquittal ("No statute forbade denunciation"). Struggle: "Feels unjust but our hands are tied."  
        - *C2:* Conviction under §239 ("Her act enabled illegal imprisonment"). Struggle: "Calling Nazi arrest 'illegal' implies invalidity—is that 'legal' reasoning?"  
        - *C3:* Conviction ("Fits §1"). Struggle: "Is 'voluntary' fair? Law feels made-up."

  4.  **The Hart-Fuller Gauntlet (Debrief - 35 min):**  
      - **Q1 (To Court 1):** *"If Frau R. walks free, does that trouble you? Could a legal system that produces this result be called immoral?"* → Teases Fuller’s "morality of aspiration."  
      - **Q2 (To Court 2):** *"You cited 'illegality'—but whose law? If Nazi law was valid, was Karl’s imprisonment illegal?"* → Forces confrontation: Did you *void* Nazi law?  
      - **Q3 (To Court 3):** *"Your statute 'solved' this cleanly. But what if Frau R. claims she feared her Nazi boss? What if the law was passed *after* her trial?"* → Highlights retroactivity’s pitfalls.  
      - **Hart’s Move:** *"Hart argued Court 2’s approach is dishonest—it pretends Nazi law wasn’t law. Court 3’s retroactive statute owns its moral choice. Cheaper? Cleaner?"*  
      - **Fuller’s Counter:** *"But what makes Court 3’s statute *law*? Is a vague, retroactive, ad hoc rule compatible with law’s 'inner morality'? Or is it just state power in disguise?"* → Reintroduce Fuller’s 8 principles (generality, publicity, non-retroactivity, etc.).  

  ---

  ### **What Pays Off? The Stakes Beyond Grades**
  - **"The Shame of Acquittal":** Court 1’s verdict will feel viscerally wrong. That discomfort is Fuller’s foothold.  
  - **"The Fraud of Invalidation":** Court 2’s strained reasoning exposes the natural law sleight-of-hand Hart hated.  
  - **"The Brutalism of Retroactivity":** Court 3’s "clean" solution feels like state vengeance—Fuller’s warning about lawlessness.  

  ---

  ### **Brutally Honest Addenda**
  1.  **What Will Go Wrong:**  
      - **Time Crunch:** Groups will run over. Cut them off ruthlessly at 25 mins.  
      - **Court 2 Paralysis:** They’ll struggle to invent "legal" moral reasoning. Prod: "Use the 1871 Code! Call the arrest 'unlawful' under *pre-Nazi* standards!"  
      - **Over-Simplification:** Strong students may reduce it to "evil law vs. justice." Hammer: "Hart AGREES Nazi law was evil! His question is: How do you *institutionalize* justice without corrupting law?"  
      - **Cynicism:** Some may call all solutions "political." Redirect: "Yes—so how do Hart/Fuller differently manage law’s politics?"

  2.  **What the Activity CAN’T Do:**  
      - **Fuller’s Inner Morality:** You’re right—this exercise *won’t* surface Fuller’s procedural principles. His critique of retroactive laws (as violating publicity and constancy) will arise, but the deeper congruence between law and morality won’t. **Fix:** In debrief, contrast Court 3’s statute with Fuller’s 8 desiderata: "Is a retroactive, vague law really 'law'? Or does it fail Fuller’s test *before* we get to morality?"  
      - **Hart’s Complexity:** Hart didn’t *endorse* retroactive punishment; he saw it as a lesser evil than judicial dishonesty. The activity may oversimplify his position. **Fix:** Clarify post-activity: "Hart’s point was methodological—don’t distort legal concepts to do moral work. But he’d likely demand *restraint* in using retroactive statutes."

  ---

  ### **Pushback on Your Setup (Because You Asked)**
  - **Grudge Informer Fatigue?** No. When paired with role-play forcing *verdicts*, it shocks. Students who yawned at "law vs morality" will rage at freeing Frau R.  
  - **Three Courts?** Keep all three. Court 1 makes positivism horrifyingly concrete. Court 2 shows natural law’s instability. Court 3 reveals Hart’s pragmatism. Together, they triangulate the debate.  
  - **Role-Play Collapse?** With 14 students? Likely. **Mitigation:** Assign roles *within* courts (Chief Justice, Recorder, Skeptic) if groups freeze. Force them to start with "Vote: Guilty or Not Guilty?" to break ice.  

  ---

  ### **Last-Minute Checklist**
  - Print handouts (color-code courts if possible).  
  - Bring timer (visible countdown during deliberation).  
  - Prep debrief questions on notecards.  
  - **Opening Provocation:** *"By show of hands: Should Frau R. be punished? Now go enforce a legal system."*  

  This will be messy. But messy with stakes beats polished platitudes. Hart and Fuller didn’t debate in the abstract—they fought over broken lives. Your structure makes them fight too.  

  Go break their brains (respectfully).  
  —  
  *P.S. Your advisor owes you a very nice bottle of wine.*
