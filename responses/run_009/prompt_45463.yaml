answer: |-
  ## Exam Question (168 words)

  **Assess the Teaching Assistant’s claim that the dispute between N. and F. is purely ecological and will be settled by field data. N. argues that habitat destruction creating barren land (Barren-Benefit) reduces total suffering, as r-selected species (high reproduction, extreme juvenile mortality, likely net-negative lives) dominate disturbed habitats. F. counters that destroying mature forest (dominated by K-selected species: lower reproduction, higher survival, potentially net-positive lives) causes harmful regrowth dominated by r-species (Regeneration Objection). Both assume wild animal welfare is net-negative and total suffering tracks abundance. What empirical and normative premises must hold for N. and F. to be disagreeing substantively? Can both be right, both wrong, or only one right? Explain.**

  ---

  ## Model Answer (586 words)

  The TA's claim that the N–F dispute is purely ecological is incorrect. While ecological data on species abundance, mortality rates, and welfare signs (net-positive/negative lives) in different habitats is crucial, resolving their disagreement *also* requires settling **normative** premises and recognizing how N. and F. define the counterfactual scenario of habitat destruction.

  **Empirical Premises:** Both arguments rely on contested empirical claims:
  1.  **Welfare Sign:** That wild animal lives, especially r-selected ones (high fecundity, massive juvenile die-off), are *on average* net-negative. This is epistemically fragile – inferring subjective welfare from life history traits is highly speculative.
  2.  **Abundance-Suffering Link:** That total suffering is simply a function of the number of individuals alive (Logic of the Larder). This makes the assumed welfare sign paramount: if lives are net-negative, more animals mean more suffering; if net-positive, more animals mean more welfare.
  3.  **Habitat Dynamics:** That barren land (pavement, deserts) truly *prevents* significant animal existence (N.'s case), while forest destruction reliably leads to decades of r-dominated regrowth (F.'s case). Field data is vital here, but insufficient alone.

  **Normative Premises:** The core disagreement hinges on normative commitments:
  1.  **Aggregation Principle:** Both implicitly use a *totalist* view: total welfare/suffering is what matters. *This shared principle is why their arguments rise or fall together.* If totalism holds, and if r-lives are net-negative, then *any* action reducing r-populations (whether creating barren land *or* preventing regrowth) reduces suffering. Conversely, if K-lives are net-positive, increasing them is good.
  2.  **Non-Identity Problem & Harm Prevention:** N.'s Barren-Benefit thesis relies on the *normative* view that **preventing the existence of beings who would have net-negative lives is morally beneficial**, even though those specific beings are never harmed (as they don't exist). This is non-trivial – some ethical theories reject the idea that non-existence can be "better" for a non-existent individual. F. implicitly accepts this premise when condemning regrowth but doesn't challenge it.

  **Where N. and F. Part Ways:** Their *substantive* disagreement isn't primarily about ecology, but about **the relevant counterfactual comparison when destroying habitat**:
  *   **N. (Barren-Benefit):** Compares a barren state (few/no animals) *directly* to the original habitat (many animals, assumed suffering). Destruction *prevents* future lives.
  *   **F. (Regeneration Objection):** Compares the *regrowth trajectory* (decades of r-abundance) to *preserving* the mature forest (K-abundance). Destruction *causes* specific future suffering via succession.

  **Can Both Be Right/Wrong?** Given their shared totalism and acceptance of preventing bad lives as good:
  *   **Both Could Be Consistent:** If totalism holds *and* r-lives are net-negative while K-lives are net-positive, then:
      *   Creating *permanent* barren land (preventing lives) reduces suffering (N. right).
      *   Destroying forest to cause *temporary* regrowth (creating net-negative lives) increases suffering (F. right).
  *   **Both Could Be Wrong:** If the welfare sign premise is false (e.g., lives are net-positive), both arguments collapse. If preventing net-negative lives isn't morally beneficial, N.'s argument fails. If the barren land unexpectedly harbors suffering animals or regrowth is minimal, ecological facts undermine them.
  *   **Only One Right?** Only if the counterfactual outcomes differ fundamentally (e.g., barren land *does* support suffering populations, negating N., while regrowth *does* occur, validating F.), *and* the normative premises hold. But their core logic – reducing net-negative lives is good – remains shared.

  **Settled by Field Data?** No. Field data can address *empirical* premises: actual abundance in habitats, mortality rates, *potential proxies* for welfare. It *cannot* settle:
  1.  The **normative aggregation principle** (totalism vs. averagism vs. other views).
  2.  Whether **preventing net-negative existences is morally required or beneficial** (Non-Identity Problem).
  3.  The **fundamental welfare sign** of complex animal lives, which remains inferential and philosophically contested.

  The TA underestimates the dispute's normative depth. While ecology informs the empirical inputs, the core disagreement between N. and F. depends on defining the counterfactual, and both arguments stand or fall on shared, contestable *ethical* foundations about aggregation and the value of potential lives.

  ---

  ## Marking Scheme (20 Marks Total)

  **Must-Hit Points (4 marks each):**

  1.  **Distinguish Empirical (Welfare Sign) & Normative (Aggregation):** Clearly separate the claim about lives being net-negative (empirical, fragile) from the claim that total welfare is what matters (normative, totalism). *Common Failure:* Conflates these layers or focuses only on ecology.
  2.  **Explain Logic-of-the-Larder & Fragility:** Articulate how the totalist view makes welfare sign paramount for determining if abundance increases/decreases suffering, and why inferring welfare sign from life history is uncertain. *Common Failure:* Mentions abundance link but doesn't explain its dependence on welfare sign or the inference problem.
  3.  **Identify Non-Identity Problem for N.:** Explain that N.’s barren-land benefit requires the normative view that preventing the existence of beings with net-negative lives is morally beneficial, distinct from harming existing beings. *Common Failure:* Discusses harm reduction generally but misses the specific non-identity challenge to N.’s prevention claim.
  4.  **Contrast Counterfactuals (Barren vs. Regrowth):** Identify that N. compares destruction to barren outcome (prevention), while F. compares it to regrowth outcome (causing r-abundance); this is their key point of divergence beyond shared premises. *Common Failure:* Treats N. and F. as making the same claim or misses that the *outcome* of destruction defines their disagreement.
  5.  **Assess TA's Claim (Data Limits):** State that field data can inform empirical premises (abundance, mortality, welfare proxies) but *cannot* resolve core normative premises (aggregation principle, moral status of preventing bad lives). *Common Failure:* Uncritically agrees data settles it, or dismisses data's role entirely without nuance.

  **The A-Grade Move (Separates A from B):**
  The recognition that **N. and F. fundamentally share the same core normative premise (totalist aggregation + preventing net-negative lives is good)**, meaning their arguments rise or fall *together* based on the validity of these premises and the welfare sign. Their apparent disagreement stems *primarily* from focusing on different *counterfactual outcomes* of destruction (barren vs. regrowth), not a deeper normative clash. The strongest answers explicitly state this coherence and its implications.
