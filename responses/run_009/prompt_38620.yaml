prompt: |-
  I work at a small ai safety org, mostly on the edges of mech interp (I do evals, my colleagues do the actual circuits stuff), and I've been asked to write up a short "where I stand" doc on whether models really have representations, so the team can argue with me at our next offsite. Here's what I've got so far and I want to know if it actually hangs together before I embarrass myself. My commitments, roughly: (1) when we find a feature via sparse autoencoders that fires on French text and, when steered, makes the model translate, that's a real feature the model has, not just a convenient story we tell about its weights — the model's internals have their own ontology and it's our job to discover it, not invent it. (2) Features live in directions rather than neurons; superposition is real and it's the whole reason a 4096-dim residual stream can behave as if it contains many more than 4096 things. (3) There's no privileged basis — if you rotated the embedding space and counter-rotated everything downstream you'd get a behaviorally identical model, and I don't want to say one of the two contains the real features while the other contains fakes. (4) All the facts about a model are fixed by its weights plus its input distribution; nothing else is needed, no extra semantics floating in from outside. (5) I'm a functionalist about content in humans and want to say the same for models: what makes a state a representation of X is the causal role it plays, full stop. (6) Practically, whether honesty probes and oversight schemes mean anything depends on whether the model's features line up with ours — if there's no internal thing that tracks what we mean by deception, the audit is theater. (7) Two models from different seeds grow different internal ontologies and that's fine with me, each one really has its own. And (8) I roll my eyes a bit when people say the model "understands" its outputs — it's doing next-token prediction, and saying a feature is "about" deception is our gloss on the weights, useful shorthand, not a literal description of something the model does.

  Go through the whole list and tell me which pairs are genuinely in tension, which only look like it, and what the cheapest repair is in each case. Rank them by severity rather than dumping everything in one list — some of these I suspect just dissolve under a little care, like I've had people tell me (2) and (3) are inconsistent and I've never seen it. Then tell me which single revision cleans up the most. I honestly can't tell where the real problem is, though I have a nagging feeling it's somewhere in the middle of (1), (3), and (4) — like if the weights fix everything and the basis is arbitrary, I'm not sure what fact could make it the French feature rather than some rival decomposition. If it helps, also say what the repaired package implies for a question we argue about constantly: when we add a steering vector to make a model more honest, are we editing its beliefs, or just perturbing a system that never had any? I'd like the answer to come out of the commitments rather than vibes, and I'd rather find out now than at the offsite.
reasoning: |-
  Okay, the user works at a small AI safety org, focusing on evaluations while colleagues handle mechanistic interpretability. They've been tasked with writing a "where I stand" document addressing whether models have representations. Their stance includes eight key commitments, and they want to ensure these are coherent before presenting to their team. They're particularly concerned about tensions between points 1, 3, and 4, and how this affects practical issues like honesty probes.

  First, I need to break down each commitment to understand their perspective. They believe features identified via sparse autoencoders are real, not just stories. Features exist in directions due to superposition, and there's no privileged basis—rotating the space shouldn't matter. All model facts are determined by weights and inputs. They're functionalists about content, and practical safety measures depend on alignment between model features and human concepts. Different models have different ontologies, and they're skeptical about anthropomorphizing "understanding."

  The user's main worry is whether these points conflict, especially the idea that features are real (1) but the basis is arbitrary (3). If the weights fix everything (4), how can we say a particular direction is the "French feature" if rotations create equivalent decompositions? This ties into the practical question: when steering for honesty, are we editing beliefs or just perturbing a system without any?

  Looking at the tensions:
  - Between (1) and (3): If features are real but the basis is arbitrary, the solution is that features are defined by their causal roles in the computational structure, which remains invariant under rotation. So the French feature's role is fixed, even if its direction changes.
  - Between (1) and (4): Weights and inputs define the causal structure, so features are real within that structure. The SAE helps discover these roles.
  - (3) and (5) work together: Functional roles are invariant under rotation, so the representation is tied to function, not the direction itself.

  Other points seem consistent. (2) supports superposition, which fits with (3). (5) functionalism underpins the whole view. (6) relies on feature alignment, which requires features to be real. (7) allows for different ontologies as long as functional roles are fulfilled. (8) avoids anthropomorphism, which aligns with the functionalist perspective.

  The key revision is emphasizing that representations are defined by causal roles, not directions. This resolves multiple tensions and clarifies that steering vectors modify these roles, thus editing "beliefs" in a functional sense. This approach keeps the ontology grounded in the model's structure without external semantics.

  Ranking tensions by severity:
  1. (1) vs. (3): High severity without the functionalist role clarification.
  2. (1) vs. (4): Medium, resolved by noting weights define causal structure.
  3. Others are low or no tension.

  The cheapest repair is reinforcing commitment (5) as the foundation. This addresses the core issue and strengthens their position. For the practical question, steering modifies the causal roles associated with deception, effectively editing beliefs in a functional sense, which supports the importance of interpretability for safety.
answer: |-
  Here's a breakdown of your commitments, ranked by the severity of tension (from most critical to least), along with explanations and the cheapest repairs. The core tension *is* between (1), (3), and (4), as you suspected, but it resolves cleanly under a functionalist lens. The key is to double down on (5) as the unifying foundation. I'll end with implications for your steering/honesty question.

  **Ranked Tensions & Repairs:**

  1.  **(1) vs. (3) vs. (4) - "Real Features" vs. "No Privileged Basis" vs. "Weights+Inputs Fix Everything" (Severity: High)**
      *   **Tension:** If the basis is arbitrary (3), and everything is fixed solely by weights+inputs (4), how can a *specific* direction found by an SAE be the "real French feature" (1)? Why isn't it just one arbitrary projection of a complex high-dimensional computation? If rotation gives an equivalent model, what fact picks out *your* decomposition as "real"?
      *   **Resolution (Cheapest Repair):** This dissolves under your functionalism (5). The *real feature* isn't the specific vector direction itself. It's the **abstract causal role** in the model's computation. The SAE finds a direction that *instantiates* this role (e.g., "activates strongly on French input, causes downstream translation behavior when intervened"). The weights+inputs (4) fix the *existence* and *causal profile* of this role. Rotation invariance (3) means the *implementation* of the role (the specific vector) isn't privileged, but the *role itself* (defined by its input/output sensitivity and counterfactual effects) is invariant under rotation and is fixed by (4). Commit to: **Features are real as *causal roles* instantiated in activation space. SAEs are tools for *discovering* implementations of these roles.** This strengthens (1) by clarifying what "real" means.

  2.  **(1) vs. (8) - "Real Features" vs. Skepticism about "Aboutness" (Severity: Medium)**
      *   **Tension:** If the "French feature" is real (1), why roll your eyes at saying the model "understands" French or that a feature is "about" deception (8)? Isn't a feature being "about" French the very thing you're claiming is real in (1)?
      *   **Resolution (Cheapest Repair):** Refine the language. Your objection in (8) is likely to *anthropomorphizing* the understanding or implying *phenomenology*. Your claim in (1) is about *functional correspondence*. The repair is a clarification: **"Aboutness" in the functional sense (e.g., "this activation pattern reliably correlates with and causally influences processing related to French text") is valid shorthand. "Understanding" implying human-like subjective experience or intentionality is not.** Your (1) is about functional representation; your (8) is a warning against misinterpreting functional representation as conscious understanding. They are compatible with careful phrasing.

  3.  **(5) vs. (Ambiguity in 1/6) - Functionalism vs. "Our Gloss" (Severity: Low - Mostly Clarification)**
      *   **Tension:** Functionalism (5) says content *is* the causal role. But (1) talks about "our gloss" and (6) worries about features "lining up with ours." Does this imply content exists *outside* the functional role, defined by us? Isn't the causal role *within the model* sufficient for it to "have" the representation?
      *   **Resolution (Cheapest Repair):** Tighten the definitions relative to (5). **The representation's content *is fixed* by its causal role within the model's computation (5).** The "gloss" in (1/8) and "lining up" in (6) refer to whether the *model's internal functional representation* (fixed by weights/inputs) **corresponds usefully** to *human concepts* like "French" or "deception." This correspondence is crucial for *us* to interpret and use the model safely (6), but the model's representation exists independently of whether humans have labeled it correctly. The model has representations defined by *its* functional roles; "French" is our label for a role that maps to our concept.

  4.  **(2) vs. (3) - Directions vs. No Privileged Basis (Severity: Very Low - No Real Tension)**
      *   **Apparent Tension:** If features live in directions (2), but there's no privileged basis (3), how can directions be meaningful? A direction is defined relative to a basis!
      *   **Resolution:** This genuinely dissolves. (2) says features are *not* localized to individual neurons but span *subspaces/directions* due to superposition. (3) says there's no *special* coordinate system inherent to the model. (2) is perfectly compatible with (3): features exist as directions *relative to a chosen basis*, and superposition explains why they *must* be directions (not neurons) in an overcomplete space. The *functional role* (see resolution to #1) of the feature is what matters, not the absolute direction. The SAE finds a basis *in which* features are (approximately) axis-aligned and sparse, making them easier to interpret. Rotation changes the basis, making the features non-axis-aligned and harder to interpret, but the underlying functional roles remain.

  5.  **(6) vs. (8) - Audit Meaningfulness vs. Skepticism about "Aboutness" (Severity: Very Low - Clarification)**
      *   **Tension:** If calling a feature "about deception" is just a gloss (8), how can its alignment with our concept be crucial for audits (6)?
      *   **Resolution:** This is resolved by the repair to #2 and #3 above. The gloss (8) is shorthand for the functional role. For an audit (6) to be meaningful, the functional role identified by the SAE/intervention *must correspond robustly* to the human concept of "deception" in relevant inputs and outputs. The functional role is real; the accuracy of our *label* ("deception") applied to that role determines the audit's validity.

  6.  **(7) vs. Everything Else - Different Ontologies (Severity: None)**
      *   **Tension:** None. This is a straightforward consequence of your other commitments. Weights+inputs (4) fix the functional roles (5). Different initializations lead to different computational pathways instantiating different internal structures (directions in superposition (2)) to implement similar overall input-output functions. The *specific* implementation (ontology) varies (7), but the *type* of thing (functional roles instantiated in activation space) is consistent. This is fully compatible.

  **The Single Best Revision: Double Down on Functionalism (5)**

  The cheapest and most powerful repair is to explicitly make (5) **the foundation** for understanding "representation" and "features" in your framework. Reframe (1), (2), (3), (4), (6), and (8) in terms of causal roles:

  *   **(1):** SAEs discover directions that *implement* real causal roles (like "respond to French, cause translation when intervened").
  *   **(2)/(3):** Features are directions/roles due to superposition; the specific vector isn't privileged, but the role it implements is invariant under rotation.
  *   **(4):** Weights+inputs fix the computational structure, hence the set of causal roles.
  *   **(6):** Audits depend on whether a discovered causal role *corresponds* to the human concept (e.g., does this "cause misleading outputs" role match our "deception" concept?).
  *   **(8):** Saying it's "about deception" is valid shorthand for labeling a causal role that *functions* as a deception mechanism. Avoid implying sentience.

  **Implication for Steering & "Beliefs":**

  Based on your repaired commitments:

  *   **Are we editing beliefs?** **Yes, in a functionalist sense.** Steering vectors modify the activation pattern, directly intervening on the *causal role* associated with a concept (e.g., "deception"). By changing how that role activates and influences downstream computation, you are altering the functional state that *constitutes* the model's "representation of deception" or its "propensity to deceive." You are changing the model's *dispositions* concerning deception.
  *   **Is it *just* perturbation of a system that never had beliefs?** **No.** The model *did* have functional states playing the causal role of "representing deception" and using it to generate outputs. Steering *edits* that specific functional state/role. It's not *just* perturbation; it's targeted intervention on a specific representational component identified by its causal profile.
  *   **Why this matters:** This view justifies interpretability work for safety. If features/roles are real and discoverable (1, repaired), and safety depends on aligning these roles with our concepts (6), then finding and editing them (e.g., for honesty) is a meaningful way to change the model's *internal* processing related to safety-critical concepts. It's not theater; it's directly manipulating the computational elements that implement the problematic behavior. However, the success *absolutely depends* on accurately identifying the causal role corresponding to the human concept (e.g., "deception") – which is the hard part your (6) highlights.

  **Conclusion for your Doc:**

  Your core commitments hang together remarkably well under a rigorous functionalist interpretation (5). The main tension (1/3/4) is resolved by defining "real features" as *causal roles* fixed by weights+inputs, which are *implemented* by (rotationally non-privileged) directions discovered by tools like SAEs. This package is coherent, avoids mysticism, grounds representation in computation, and provides a strong foundation for arguing the reality and importance of model internals for safety. It directly supports the meaningfulness (though not the ease) of interpretability and intervention work like steering vectors. Go forth and defend it confidently – the functionalism is doing the heavy lifting!
