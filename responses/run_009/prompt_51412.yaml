prompt: |-
  I've been going down a rabbit hole on this idea from some contractualism discussions I stumbled into, that moral complaints can't be added up across people — the classic case being one technician who has to spend the night in a transmitter room so millions can keep watching some broadcast, where the claim is you can't justify making him do it by adding up everyone's tiny bit of lost enjoyment, because each person's complaint is just their own and the numbers don't count. I think I've turned that idea into something that proves way to much, and I can't find where it breaks:

  1. A rule for how we may act is okay only if nobody has a complaint against it strong enough that they could reasonably demand a different rule.
  2. Complaints don't add up. A million people each with a small complaint don't collectively have one big complaint — for any single person, their complaint is just their complaint, whatever anyone else is feeling.
  3. When I drive to the store instead of walking, I impose a risk of death on every pedestrian and driver I pass — tiny, say one in a hundred million per trip, but real.
  4. From any one pedestrian's point of view, the rule allowing convenience driving says: strangers may gamble with your life to save themselves a twenty minute walk. That's a complaint about the most serious thing there is — your life — not about a minor inconvenience.
  5. That complaint's strength can't depend on how many other pedestrians also have it (that's the forbidden adding-up), can't depend on how many drivers benefit (same reason), and can't depend on the size of the risk either — a small chance of my death is a harm of the same kind as a big chance, just scaled down, and if a big burden on one person can't be outweighed by benefits to millions, a small risk on each of them shouldn't be outweighed by my convenience.
  6. So every pedestrian can reasonably reject the rule permitting convenience driving, and the driver's convenience is just one more complaint that isn't allowed to be outweighed by anything.
  7. So driving to the store when I could walk is wrong — and the same goes for anything that imposes any risk on anyone, which is basically everything.

  My gut says the trick is somewhere in (5), but I can't name it, and every fix I try seems to cost me the transmitter room conclusion I started with. If I say the pedestrian's complaint is weaker because the risk is smaller, fine — but doesn't that mean everyone's individual complaint gets scaled by probability, and then a million small complaints really do feel like a lot of expected harm, back to adding things up again? Where exactly does this break, and what do I have to give up to say so?
reasoning: |-
  Alright, let's tackle this user's dilemma. They've constructed an argument against convenience driving based on contractualism, but it leads to an extreme conclusion that almost any action imposing risk is wrong. They sense the flaw is in step 5 but can't pinpoint it. 

  First, I need to recall contractualism's core: rules are justified if no one can reasonably reject them based on their personal burden. The user is stuck because they think scaling complaints by probability leads back to aggregating harms, which contractualism rejects. 

  Hmm, the key is distinguishing complaint strength from probability. The user equates a 1% risk of death with a 1% harm of death, but contractualism sees it differently. A tiny risk isn't the same "kind" of harm as a near-certain death. It's about the nature of the complaint: a near-certain death is a definite, severe burden, while a microscopic risk is hypothetical. 

  Wait, but how does this not collapse into aggregation? Ah, reasonable rejectability considers both the burden's severity and its likelihood. A 0.000001% risk of death is so negligible that rejecting a rule over it might be unreasonable, especially when the alternative (banning all driving) imposes greater burdens on everyone. 

  The transmitter example works because the technician's burden (a definite night of suffering) is concrete and significant, while each viewer's loss is trivial. But with driving, the pedestrian's risk is infinitesimal versus the driver's concrete inconvenience. 

  The user’s fear that admitting probability scales complaints leads to aggregation is valid. But contractualism can handle this by recognizing that some burdens are too small to warrant rejection. The trick is that "reasonableness" incorporates both magnitude and probability without summing across people. 

  Also, reciprocity matters. If pedestrians benefit from driving too, rejecting the rule becomes hypocritical. The initial argument ignores this systemic benefit. 

  So the break is in step 5: the complaint’s strength *does* depend on risk size because the burden isn’t "death" but "a negligible chance of death." And yes, this avoids absurdity without abandoning the transmitter conclusion.
answer: |-
  Your reasoning is sharp, and you've correctly identified the core tension in contractualism between non-aggregation and risk imposition. The flaw lies primarily in **step 5**, specifically in how you characterize the *nature* and *strength* of the complaint arising from a tiny risk. Here's the breakdown:

  1.  **The Misstep in Step 5: Mischaracterizing the Complaint & Ignoring Reasonableness Thresholds:**
      *   You state: *"a small chance of my death is a harm of the same kind as a big chance, just scaled down."* **This is the critical error.** Contractualism *doesn't* treat a tiny risk of death as simply a "scaled-down" version of a near-certain death *for the purpose of reasonable rejection*.
      *   **The Complaint is About the *Risk*, Not the *Outcome*:** A pedestrian's complaint isn't "You are imposing death on me." That outcome is vanishingly improbable. The complaint is: "You are imposing a *tiny, objectively negligible risk of death* on me for your minor convenience."
      *   **Magnitude Matters for Reasonable Rejection:** Contractualism focuses on the *burden imposed by the rule*. The burden imposed on each pedestrian by a single driver is an *infinitesimally small increase in their already-present background risk*. Is this tiny, fractional increase in risk a burden severe enough that the pedestrian can *reasonably demand* a rule forbidding *all* such driving? Contractualists argue **no**. The burden is simply too small to ground a reasonable rejection on its own, *even considered in isolation*.
      *   **Threshold of Reasonableness:** There's an implicit (and sometimes explicit) idea in contractualism that burdens below a certain threshold of significance simply don't rise to the level of warranting a rejection of a rule that provides significant benefits. A 1 in 100 million chance of death from a specific trip is far, far below any plausible threshold for a complaint strong enough to veto a rule permitting widespread social convenience. It's not that the complaints are "added up"; it's that *each individual complaint, taken singly, is too weak to justify rejecting the rule*.

  2.  **Distinguishing from the Transmitter Room (Saving the Original Intuition):**
      *   The technician's complaint is qualitatively different: "This rule forces *me specifically* to suffer a *definite, significant burden* (a night of misery/confined work) so that millions can avoid a *tiny, trivial burden* (missing a broadcast)."
      *   The *definite, concrete, and significant* nature of the burden imposed *directly on one identifiable person* makes it reasonable for *that person* to reject the rule. Each viewer's complaint ("I miss my show") is also individually too weak to reject a rule *protecting* the technician – but crucially, the rule *favored by the viewers* imposes a heavy burden on the technician, which *is* strong enough to reject.
      *   **Key Difference:** In driving, *each* pedestrian's burden from *your specific trip* is negligible and probabilistic. In the transmitter room, the burden on the *technician* is definite, large, and concentrated.

  3.  **Addressing the "Adding Up" Fear (Probability vs. Aggregation):**
      *   You worry: *"If I scale the complaint by probability, doesn't that lead back to adding up?"* This is a valid concern, but contractualism avoids it by focusing on the *reasonableness of rejection based on the burden imposed by the rule*, not on expected utility.
      *   **Probability Scales the *Burden*, Not the Complaint's "Veto Power":** Yes, the *magnitude of the burden* imposed on an individual by a risky action *is* scaled by the probability. A 10% risk of losing $100 is a bigger burden than a 1% risk. Contractualism acknowledges this.
      *   **But Non-Aggregation Remains:** The crucial point is that we assess *for each individual* whether *their burden* under the rule is severe enough to make rejecting the rule *reasonable*. We don't sum burdens *across* individuals to see if the *total* burden outweighs benefits. We look at each person's situation individually.
      *   **In Driving:** For each pedestrian, the burden imposed by your specific trip (a 1/100,000,000 risk of death) is so minuscule that it fails to reach the threshold where rejecting the rule "People can drive for convenience" becomes reasonable *for that pedestrian, considering their own burden*. The driver's benefit is relevant when considering if *they* could reject a rule *forbidding* driving – but importantly, the pedestrian's complaint is too weak to get off the ground.
      *   **Probability Isn't Aggregation:** Recognizing that a 0.000001% risk imposes a much smaller burden than a 50% risk on an individual is *not* aggregating burdens across people. It's correctly assessing the severity of the burden *on that one person*.

  4.  **Systemic View and Reciprocity:**
      *   Contractualism often requires considering rules *systematically*. A rule permitting driving for convenience benefits almost everyone at some point (they get to drive) and imposes tiny, diffuse risks on almost everyone (they are pedestrians/near roads sometimes).
      *   Crucially, *the pedestrians also benefit from the rule* when *they* drive. Rejecting the rule imposes a *concrete, definite burden* on everyone (no convenient driving) to avoid *minuscule, probabilistic risks*. It's unreasonable for any individual to demand that *everyone* bear the definite burden of no driving just to eliminate the tiny risk *that individual* faces from others driving. The reciprocity inherent in the rule makes rejection unreasonable.

  **Where the Argument Breaks & What You Give Up:**

  *   **Break Point:** Step 5. You incorrectly assume that any risk of death, however minuscule, generates a complaint of the same "kind" (life-threatening) and sufficient strength for reasonable rejection, simply scaled. Contractualism rejects this. The *burden* of a tiny probabilistic risk is so small that it falls below the threshold for a complaint strong enough to warrant rejecting a socially beneficial rule, *even when considered entirely on its own for one individual*.
  *   **What You Give Up:** To avoid the absurd conclusion (everything is wrong), you must give up the idea that **any imposition of any non-zero risk, however tiny, automatically generates a complaint strong enough for reasonable rejection in isolation**. You accept that burdens must meet a threshold of significance before they can ground a reasonable rejection. This threshold isn't merely about probability scaling the *same* harm; it's about the *nature of the burden* (definite vs. probabilistic, large vs. microscopic) affecting whether it's severe enough to make rejection reasonable.

  **Conclusion:**

  Contractualism doesn't require us to ban driving (or everything). It distinguishes between:
  1.  **Definite, significant burdens imposed on specific individuals** (like the technician's night), which *can* ground reasonable rejection.
  2.  **Minuscule, diffuse, probabilistic burdens** (like the risk from one car trip), which are individually *too small* to make rejecting a generally beneficial rule reasonable.

  The pedestrian's complaint against your specific trip is real but *de minimis* – so trivial it doesn't meet the threshold for reasonable rejection. The driver's convenience, while minor for one trip, represents a concrete benefit enabled by a reciprocal rule. The technician's suffering is neither trivial nor probabilistic; it's a definite, major cost demanding recognition. This distinction, centered on the nature and magnitude of the burden *imposed on the individual complainant*, allows contractualism to avoid the absurdity while preserving the core non-aggregation intuition.
