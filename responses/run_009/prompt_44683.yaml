  **Sonnet on Harsanyi's Two Routes**

  When reason’s axioms, by vNM designed,  
  Govern each soul’s desire, a structured plea,  
  And social choice, by those same laws confined,  
  Mimics the steps of sweet utility,  
  Then unanimity—where all agree—  
  Alone constrains the common-weal’s decree.  
  From naught but this, a grand conclusion springs:  
  The sum of weighted bliss on reason’s wings!  

  But hark! One soul, behind the veil arrayed,  
  As any mortal, poised with chance as guide,  
  Finds equal ground where selfless vows are weighed.  
  One proof, or two? The paths converge—but hide  
  A shared conceit: that one mind’s calculus  
  Must chart the whole’s unflinching compass.  

  To break this force, deny one vital thread:  
  *Independence for choice*, or *vNM’s scale as welfare’s stead*.  

