    "couplet": "The couplet represents the dilemma facing critics: rejecting either the independence axiom for social preference (first option) or the identification of vNM utility with wellbeing (second option) to escape utilitarianism.",
    "what_must_go": "either the independence axiom for social preference or the identification of von Neumann–Morgenstern utility with wellbeing"
  }
