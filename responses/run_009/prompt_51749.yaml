  Okay, let me unpack this user's query about Aquinas and supererogation. First, I need to make sure I grasp the core of their confusion. They're wrestling with a specific passage from the Summa where Aquinas distinguishes between acts necessarily tied to grace and those left to discretion. The user is sharp—they've noticed a tension in how this relates to supererogation: is Aquinas describing heroic optional acts or just morally neutral choices?  

  Hmm, the user's background seems philosophical-theological, given their reference to scholastic apparatus and contemporary debates. Their third question suggests they're probing whether Aquinas' framework resolves modern philosophical dilemmas about supererogation. That's sophisticated. They might be writing a paper or preparing a lecture.  

  Breaking it down:  
  First, the twofold connection. Aquinas links external acts to grace in two ways: (1) acts that inherently align or clash with faith-working-through-love (like confessing/denying faith), and (2) acts that don't necessarily do either. The "necessarily" here means intrinsic to salvation—you can't have salvation without them (or their absence). Non-necessary acts aren't indifferent; they're variable within charity's bounds. Why discretion? Because forcing uniformity where God permits variety would undermine evangelical liberty. Superiors (like bishops) can guide for practical order, not because these acts are salvifically essential.  

  Now, supererogation. The user flags a key ambiguity. Aquinas' discretionary zone sounds more like adiaphora—things neither commanded nor forbidden—than classic supererogation (heroic, non-obligatory goodness). But wait: the counsels (poverty etc.) are part of this zone. Aquinas elsewhere calls them "better" paths to salvation. So his text *does* support supererogation, but grounded in divine discretion, not inherent moral weight. The difference matters: if supererogation is just divine permission for variability, it's not about intrinsic moral "betterness."  

  The instability objection. Aquinas escapes it through his theological framework. For non-necessary acts, omission isn't blameworthy because God doesn't demand them. Yet performing counsels *is* better because they're divinely endorsed paths to greater merit. The "better" comes from God's valuation, not independent morality. Grace-infused freedom also helps: one freely chooses counsels without obligation. A secular analogue would struggle without a divine legislator carving out the optional zone.  

  User's depth impresses me. They’ve spotted how Aquinas’ salvation-centric view reframes supererogation. My reply should stress that his "discretionary" isn’t neutral—it includes heroic counsels, but their status flows from divine will, not philosophy. That’s why the difference matters: it makes supererogation a theological category, not a freestanding moral one. The instability dissolves because God sets the rules. No secular equivalent can fully replicate this.
answer: |-
  Let's break this down step by step, addressing your three questions directly:

  ### 1. Plain-Language Reconstruction
  - **The twofold connection**: Aquinas distinguishes two types of external acts:  
    **(a)** Acts *intrinsically tied to grace*: These either necessarily flow from faith working through love (e.g., confessing faith) or directly undermine it (e.g., denying faith). These are explicitly commanded or forbidden by the New Law.  
    **(b)** Acts *not intrinsically tied to grace*: These are neither necessary for salvation nor inherently opposed to it (e.g., dietary choices, vocational paths). They are neither prescribed nor forbidden by Christ’s initial institution of the New Law.  

  - **"Necessarily in keeping with/opposed to faith working through love"**: An act is "necessary" if its performance (or omission) is *essential for salvation itself*. Confessing faith is necessary because rejecting it severs one’s relationship with God. Conversely, many acts (like marriage vs. celibacy) don’t determine salvation.  

  - **Why discretion?**  
    - **Individuals**: God, as "Lawgiver," intentionally left these acts undetermined to preserve human freedom. Charity (love of God/neighbor) doesn’t demand one specific action in these areas.  
    - **Superiors** (e.g., bishops, rulers): They may impose practical rules for communal order (e.g., fasting schedules), but these are *derivative* (for edification, discipline) and not salvific necessities.  

  ### 2. Aquinas & Supererogation: Heroic or Permissible Variation?
  **The tension is real, but Aquinas leans toward supererogation** – though with nuances:  
  - **The "discretionary zone" includes both**:  
    - **Morally permissible variation**: Choosing to marry or remain single, where neither option is inherently "better."  
    - **Supererogatory acts**: The evangelical counsels (poverty, chastity, obedience) are Aquinas’s prime examples of acts *not commanded* but *praiseworthy beyond obligation*. These are "better" paths to spiritual perfection (ST II-II, q.184).  
  - **Why the text supports supererogation**:  
    - Aquinas explicitly contrasts the New Law’s *few precepts* with the Old Law’s detailed rules, emphasizing freedom for "higher" pursuits (Reply to Obj. 2).  
    - The "counsels" are not neutral adiaphora; they are *positively recommended* for greater merit (ST I-II, q.108, a.4).  
    - **Key phrase**: Acts not "necessarily in keeping with charity" are not *required for salvation*, but some may still be "in keeping with charity" *more perfectly*.  
  - **Why the difference matters**:  
    - If Aquinas only meant *permissible variation*, supererogation would collapse into moral indifference. But he doesn’t: the counsels are "better" (ST I-II, q.108, a.4).  
    - **Crucial distinction**: For Aquinas, an act can be *praiseworthy to perform* (if done for God) yet *not blameworthy to omit* because it isn’t necessary for salvation. This is the core of scholastic supererogation.  

  ### 3. Does Aquinas Escape the "Instability" Dilemma?
  **Yes, through his theological framework – but a secular analogue struggles**:  
  - **Escaping the dilemma**:  
    - **Ground 1 (Few precepts)**: An act can be "better" (e.g., voluntary poverty) yet its omission not blameworthy because God *did not command it* as necessary for salvation. The "goodness" stems from divine approval of the act’s intention, not an independent moral duty. Blame arises only for violating precepts.  
    - **Ground 2 (Grace-infused freedom)**: The agent performs supererogatory acts *freely* moved by grace, not coerced. Thus, omission isn’t a *failure* but a choice for a lawful alternative.  
    - **Salvation as the threshold**: Aquinas defines "blameworthy" strictly as "contrary to salvation." Supererogatory acts exceed this threshold but aren’t required to meet it.  

  - **Why a secular analogue fails**:  
    - Aquinas’s "discretionary zone" exists because a *divine Legislator* (Christ) intentionally withheld commands. Secular morality lacks this: if an act is "better" (e.g., donating a kidney), its omission seems *pro tanto* morally deficient unless obligations are minimalist by definition.  
    - **Grace as key**: The second ground (grace enabling free compliance) has no secular parallel. It transforms obligation into desire, making supererogation a joyful overflow rather than a demand.  

  ### Conclusion
  - Aquinas *does* support supererogation: The "discretionary" acts include both neutral choices *and* heroic counsels, differentiated by their relation to spiritual perfection.  
  - He escapes instability by anchoring blame to divine precepts (not moral "betterness") and infusing freedom with grace.  
  - A secular theory could mimic this only by adopting a minimalist, divine-command-like structure of obligations – but without grace, it risks reducing supererogation to subjective preference or collapsing into obligation. Aquinas’s framework remains distinctively theological.
