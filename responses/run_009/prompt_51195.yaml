prompt: |-
  I'm a second-year grad student TAing intro phil, and my department has put the TAs on a committee to rewrite the AI policy for written work, and the more I stare at what we already have the more confused I get about what our rules actually assume about learning. The current policy is a patchwork: spellcheck and autocomplete are fine, Grammarly is fine (this was decided before Grammarly got all generative, and nobody has revisited it), drafting any part of an essay with an LLM is cheating unless the assignment says otherwise, and meanwhile the university itself just licensed an AI tutor app that some of the intro sections now require students to use for the practice quizzes. There's also a disclosure clause saying students must report any AI assistance they received, which sounds reasonable until you realize that Grammarly quietly rewrites half their sentences and nobody has ever disclosed a Grammarly session. One of my friends on the committee keeps pushing the calculator analogy -- we let students use calculators in stats because we've decided the arithmetic isn't the thing being taught -- and another says it's more like the machine translation question in language departments, where the tool doesn't help you learn the thing at all, it just removes the need to. The two analogies give opposite verdicts and I genuinely can't tell which one our policy is implicitly using, or whether it's using neither.

  So here's what I want from you: take the bundle of practices I described (the tool bans, the grandfathered-in Grammarly exception, the university's own AI tutor, the disclosure requirement) and reconstruct what a policy like that must be presupposing about the relationship between writing and understanding. Is the implicit theory something like "writing is where understanding gets formed, so offloading the writing offloads the learning," or is it "writing is only ever a measurement of understanding formed elsewhere, and the ban is about protecting the integrity of the measurement," or something else entirely? Those two views license different things -- a strict output-based view, where we just grade the final essay and don't care how it was produced, is how the professional world mostly treats writing, and our policy obviously rules it out, but I'd like you to be precise about where it does so and whether the ruling-out is consistent across all the parts. And tell me whether the disclosure clause even makes sense given whatever line the rest of the policy is trying to draw, or whether it quietly collapses if you push on it. Finally, sketch what the policy would have to look like instead if we openly adopted the pure output-based view, and what we'd lose by switching.

  Please write it as continuous prose, no headings, no bullet points, no bold or tables -- just paragraphs like a long email, since this is going into my notes for the committee meeting and I want to be able to read it straight through. Don't bother citing literature or telling me what so-and-so philosopher said; I'm interested in the actual reconstruction, worked out concretely against the details I gave you, including the awkward ones like the university's own tutoring app.
reasoning: |-
  Okay, the user is a second-year grad student TA who's part of a committee rewriting their philosophy department's AI policy for written work. They're confused about the underlying assumptions of their current patchwork policy. Let me unpack their situation.

  First, the existing policy has contradictions: spellcheck and autocomplete are allowed, Grammarly is grandfathered in despite its generative features now, but using LLMs for drafting essays is banned unless specified otherwise. Meanwhile, the university mandates an AI tutor app for practice quizzes. There's also a disclosure requirement that's ignored in practice, especially with tools like Grammarly.

  The user mentions two competing analogies from committee members: the calculator analogy (tools are fine when they handle non-essential tasks) versus the machine translation analogy (tools bypass learning entirely). These point to fundamentally different views of writing's role in education.

  Hmm... the core tension seems to be between writing as knowledge formation versus writing as knowledge demonstration. If writing is where understanding forms (the "formation view"), then outsourcing writing undermines learning. But if writing merely demonstrates pre-existing understanding (the "demonstration view"), then restricting tools might only serve assessment integrity.

  Looking at their policy's inconsistencies: Allowing Grammarly but banning LLMs suggests the policy isn't consistently applying either view. Grammarly's sentence rewriting seems just as problematic under the formation view as LLM drafting. And the university's AI tutor for quizzes openly embraces offloading practice - directly contradicting the essay restrictions.

  The disclosure clause is particularly messy. If Grammarly's rewrites aren't disclosed (and aren't considered cheating), while LLM use would be, that creates an arbitrary line based on tool familiarity rather than principle. Under the formation view, both should require disclosure; under the demonstration view, neither should matter if the final output demonstrates understanding.

  If they adopted a pure output-based approach (the demonstration view), they'd need to permit all tools but design assessments where the output itself reveals depth of understanding - perhaps through oral defenses, process documentation, or assignments requiring personal reflection. The tradeoff would be potentially losing the cognitive benefits of struggling through writing as thinking.

  Noticing deeper needs: The user seems to want clarity on educational values first, not just policy wording. They're likely frustrated by hypocrisy in allowing "stealth" AI (Grammarly) while banning visible AI. There's also unspoken anxiety about their role - as a TA, they'll enforce rules they may disagree with.

  The reconstruction should highlight these contradictions starkly while offering a principled way forward. The key is making explicit whether they value writing-as-thinking or writing-as-proof, because their current policy tries to have it both ways and fails.
answer: |-
  Your department's policy bundle reveals a deep, unresolved tension between two distinct theories of learning through writing, and the disclosure clause functions as a poorly applied bandage over that fracture rather than a coherent solution. Let's reconstruct the implicit assumptions.

  The policy's core ban on LLMs for drafting ("cheating unless the assignment says otherwise") strongly presupposes a **formation theory of writing**: writing isn't merely a vehicle for expressing pre-existing understanding; it *is* the cognitive process through which understanding is actively constructed, refined, and solidified. Offloading the drafting process – the struggle to articulate complex ideas, wrestle with ambiguities, structure arguments, and find precise language – fundamentally offloads the intellectual labor essential for learning philosophy. This is why the "machine translation" analogy resonates: using an LLM to generate philosophical prose bypasses the very mental work the assignment is designed to elicit, leaving the student conceptually unformed. The calculator analogy fails here because arithmetic is procedural and discrete; philosophical writing is constitutive and integrative.

  However, the exceptions for spellcheck, autocomplete, and (grandfathered) Grammarly implicitly rely on a **demonstration theory of writing**, or at least carve out a zone for it. These tools are permitted because they are seen as addressing peripheral "mechanics" – cleaning up the surface *after* the core intellectual work of formation is complete. The policy assumes (perhaps naively) that these tools don't interfere with the formative process itself; they just polish the output. This is where the calculator analogy *sort of* works: correcting a typo or comma splice isn't the "thing being taught" in a philosophy essay. But this distinction collapses with modern Grammarly. Its generative sentence rewrites *do* intervene directly in the formative process – reshaping syntax, altering emphasis, suggesting vocabulary – yet it escapes the ban. The policy's inconsistency here stems from an outdated view of Grammarly as a passive proofreader rather than an active co-author, revealing a focus on the *tool's brand* rather than its *functional impact* on cognition.

  The university's mandated AI tutor exacerbates the contradiction. Requiring its use for practice quizzes explicitly endorses AI as a formative tool *for learning concepts*. It presupposes AI can effectively scaffold understanding *before* or alongside writing. This directly undermines the formation theory underpinning the essay ban. If AI helps form understanding for quizzes, why is it forbidden for the essay, where understanding is supposedly demonstrated? The policy implicitly treats "learning facts/procedures" (for quizzes) as separable from "forming complex understanding" (for essays) and applies different rules, but it doesn't articulate or justify this split. The university's action signals an institutional embrace of AI for learning formation, making the department's essay ban seem like an isolated holdout protecting a specific *mode* of formation (writing) rather than formation itself.

  The disclosure requirement ("report any AI assistance") is an attempt to manage this mess but collapses under scrutiny. Under the formation theory, *any* substantive AI assistance in drafting should be disclosed *and* prohibited (like the LLM ban attempts). But Grammarly's rewrites aren't disclosed because they fall through the mechanical-polish exception, even though they functionally alter the text. Under a demonstration theory, disclosure might be about transparency for grading integrity (knowing if the output is the student's own work), but the policy *also* bans certain tools irrespective of output quality, showing it's not purely output-based. The disclosure clause *assumes* a clear, pre-defined line exists between "assistance" that undermines learning/assessment and assistance that doesn't. Yet the Grammarly exception, the tutor mandate, and the fuzziness between "drafting" and "editing" show this line is arbitrary, technologically unstable, and practically unenforceable. It becomes an honor system trap focused on tool use rather than meaningful educational outcomes.

  **If you adopted a pure output-based view** (writing as demonstration), your policy would radically simplify: All tools would be permitted unless explicitly restricted for a specific pedagogical reason stated in the assignment. The *only* relevant factor would be whether the final submitted work demonstrates the required understanding and skills. Assessment methods would need to evolve: defenses (oral/written) probing the student's grasp of their submitted arguments, in-class writing under supervision, or assignments designed to be AI-resistant (e.g., deeply personal reflection, analysis of specific in-class discussions, iterative drafting with feedback). The disclosure clause might remain for transparency, but the *ban* on specific tools would vanish.

  **What you'd lose by switching** is precisely what the formation theory values: the guarantee that the *process* of writing itself is forcing the student into the cognitive struggle essential for deep philosophical engagement. You'd risk students generating superficially competent essays without having undergone the transformative struggle of articulating complex thought themselves. The writing becomes proof of potential understanding, but not necessarily proof of the student having *achieved* that understanding through the intended process. The burden shifts entirely to assessment design to reliably probe the depth and authenticity of understanding reflected in the output, which is difficult and resource-intensive.

  Your current policy is an unstable hybrid. It implicitly champions the formation theory for core essays but undermines it with the Grammarly exception and the university's tutor. It gestures towards demonstration theory for mechanics but can't define the boundary. The disclosure clause highlights the policy's internal contradictions without resolving them. To move forward, your committee must explicitly choose: Is the core value of written assignments the *cognitive process* of writing-as-thinking (prioritizing formation, requiring significant restrictions on AI drafting aids), or is it the reliable *demonstration* of achieved understanding (prioritizing output, permitting tools but demanding robust assessment)? Trying to straddle both without clear, consistent principles based on learning goals, rather than tool categories or historical accidents, leaves you with the confusing patchwork you have now. The university's tutor makes this choice urgent – you need to articulate why *philosophical writing* specifically requires a different approach than quiz preparation, grounded in what you believe writing uniquely does for the mind.
