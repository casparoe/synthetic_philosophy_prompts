prompt: |-
  I am a high school senior in a philosophy elective, and I have been assigned to run our class's next seminar session. The topic I drew is the compatibilist idea that free will is not about whether our actions are caused, but about a certain structure among our desires — specifically the "hierarchy" view associated with the philosopher Harry Frankfurt, built on second-order desires (desires about which of our desires we act on). I have to present for about twenty-five minutes to a class of students who mostly arrived at the course thinking the free will debate is just "science says the brain is atoms, so free will is an illusion, end of story."

  Please do not write the explanation itself. What I need is a teaching plan, and you should prepare it carefully as an experienced philosophy teacher who has taught this material many times and knows exactly where it goes wrong. Before you draft anything, take a moment to reason through the dependency structure of the ideas — what has to be established first for later steps to make sense — and brainstorm what could go off the rails, then organize that into the plan.

  Here is the content I am supposed to cover, so we are on the same page about it. Frankfurt's basic apparatus distinguishes first-order desires (a desire to take some action) from second-order desires (a desire about one's own desires — for example, wishing I did not want to smoke, or wanting my desire to finish the paper to be the one that moves me). The special case he cares about is the second-order volition: wanting a particular first-order desire to be the one that effectively leads to action — to be one's "will." He illustrates with three characters. The unwilling addict takes the drug because his desire for it is strongest, but he wants that desire not to be effective — he wishes it were not the one that moved him. The willing addict also cannot resist, but he has no conflict: he endorses his desire, he wants it to be what drives him. And the wanton is a creature with no second-order desires at all — he just acts on whatever first-order desire is strongest, and it never occurs to him to have attitudes about which desire wins; importantly, a wanton is not necessarily a wild hedonist, just someone for whom the question of endorsement never arises. Frankfurt's line is roughly that the unwilling addict lacks freedom of the will, the willing addict has it but got it by luck, and the wanton isn't even a candidate for freedom of will — though all three may equally lack freedom of action, since none of them could have done otherwise at the moment of acting.

  The plan should tell me: (1) the order in which the pieces must be introduced and why — in particular, whether second-order desires or the distinction between freedom of action and freedom of will should come first, and what breaks if I choose wrongly; (2) which single example should carry the whole explanation and what properties it must have and must lack to do that job — is the addiction case the right carrier, or does its messiness (physical dependence, relapse, moralized ideas about "real" addiction my classmates will have) get in the way of the structure Frankfurt is trying to display, and if so, what should replace or bracket it; (3) the misconceptions my classmates will predictably bring or form, in the order they will actually arise — I anticipate at least these candidates: that free will means you could have done otherwise, so the whole hierarchy is beside the point; that a second-order desire is just a stronger or more long-term version of a first-order desire; that the wanton is a strawman because everyone obviously has attitudes about their desires; and that Frankfurt has thereby defined away the problem rather than answered it — plus where in the sequence each should be headed off rather than left to fester; (4) one check question I can ask at the end that would distinguish students who have actually grasped the structure from those who have merely memorized the vocabulary; and (5) what I should explicitly decline to cover in twenty-five minutes and openly say I am setting aside — I assume the deep question of whether endorsing a desire does any real work if the endorsement was itself caused, but tell me if there are other omissions I should announce rather than let students discover and use to derail the session.

  Please be concrete about placement — e.g., "introduce X only after Y, because otherwise students will read X as Z" — rather than giving general teaching advice. The quality of the plan should live in the dependency ordering and the misconception map.
reasoning: |-
  Okay, the user is a high school senior preparing to teach a philosophy seminar on Harry Frankfurt's compatibilist view of free will. They need a detailed teaching plan that anticipates common misconceptions and structures the concepts in a logical sequence. 

  First, let's unpack the user's invisible needs. They're clearly anxious about presenting complex philosophy to skeptical peers who default to "science disproves free will." The request for concrete dependency ordering shows they understand this material can easily derail if introduced poorly. They're not just asking for content—they want armor against predictable challenges.

  The core challenge is sequencing. Frankfurt's hierarchy theory has several interdependent pieces: first-order desires, second-order desires, second-order volitions, the three character types, and the freedom of action vs. will distinction. Get the order wrong and students will map new terms onto existing misconceptions. 

  Key structural insights: 
  - Must start with the concept of conflicting desires to motivate why first-order isn't enough. A relatable example (like procrastination) makes this visceral before introducing terminology. 
  - Freedom of action vs. will distinction must precede the three addict cases, otherwise students will miss Frankfurt's key point that the willing addict has free will despite lacking alternatives. 
  - The wanton is the hardest concept—need to preempt the "strawman" objection by emphasizing it's a structural possibility (like impulsive decisions), not a psychological claim about all humans.

  For the carrier example: addiction is problematic because students will fixate on chemical dependency. Better to use a neutral example like procrastination or social media use first to isolate the hierarchy mechanism. Save addiction for after the framework is built.

  Top misconceptions to intercept:
  1. "Free will = could have done otherwise" (address when defining terms) 
  2. "Second-order desires are just stronger first-order desires" (clarify during terminology intro using counterexamples)
  3. "Everyone has second-order desires" (preempt with non-moralized wanton examples like spontaneous acts)
  4. "This is circular/avoids the real problem" (explicitly bracket causation questions at start)

  The check question must probe structural understanding, not definitions. Something like "Could a wanton have second-order volitions?" forces application of the hierarchy concept.

  Finally, boundaries: Must explicitly exclude determinism debates and moral responsibility implications. State this upfront to prevent derailment. 

  This plan turns Frankfurt's abstract theory into a discoverable structure—students build the hierarchy step by step through examples they already understand emotionally.
answer: |-
  Here’s a battle-tested teaching plan optimized for your constraints. It prioritizes conceptual dependencies and preempts predictable misconceptions:

  **Core Sequencing Principle:**  
  *Start with relatable psychological conflict → build terminology → distinguish freedom of action/will → apply to cases. Reverse this and students will weaponize "could've done otherwise."*

  ---

  ### **Teaching Plan: Frankfurt’s Hierarchical Model of Free Will**  
  *(25-Minute Structure)*  

  #### **1. HOOK: Conflict Without Physics (4 min)**  
     - **Open with:** "Raise your hand if you’ve ever *wanted* to do something you also *didn’t want* to want." Use *procrastination*: "You crave video games (desire A) but *wish you craved* studying more (desire about desire A)."  
     - **Why first?** Forces recognition of internal conflict *before* terminology. Avoids physics debate by using universal experience.  
     - **Preempts:** "Science killed free will" by isolating psychological structure.  

  #### **2. TERMINOLOGY: First-Order vs. Second-Order Desires (5 min)**  
     - **Define via example:**  
       - *First-order:* "Wanting to play games" (direct action-desire).  
       - *Second-order:* "Wanting your *desire to study* to be stronger than your desire to play" (desire about desires).  
     - **Crucial distinction:** Emphasize second-order desires are *meta* ("I *judge* that desire X should win").  
     - **MISCONCEPTION INTERCEPT #1:** "Isn’t the second-order desire just a *stronger* first-order desire?" → Counter: "You can weakly *wish* your strong craving would vanish (e.g., dieting). Strength ≠ hierarchy."  

  #### **3. KEY UPGRADE: Second-Order Volitions (3 min)**  
     - **Define:** "The second-order desire for a *specific* first-order desire to *become your will* (i.e., what *actually moves you*)."  
     - **Example:** "Not just ‘I wish I wanted to study’ but ‘I *endorse* my study-desire as the one that *should* drive me’."  
     - **Why here?** Must precede character cases to avoid misreading "unwilling addict" as merely conflicted.  

  #### **4. FREEDOM OF ACTION VS. FREEDOM OF WILL (3 min)**  
     - **Define:**  
       - *Freedom of action:* "Could you have done otherwise?" (e.g., addict can’t resist).  
       - *Freedom of will:* "Is your *effective will* (what moves you) what you *endorse*?"  
     - **Why now?** Essential *before* cases to prevent students dismissing the addicts as "none have free will." Frankfurt’s point hinges on this split.  

  #### **5. APPLY: The Three Characters (Use NEUTRAL EXAMPLES First) (6 min)**  
     - **Ditch addiction initially.** Use:  
       - *Unwilling Procrastinator:* "Binges Netflix though they *endorse* their desire to study as what *should* move them."  
       - *Willing Procrastinator:* "Binges Netflix and *endorses* that choice—‘I *want* my relaxation to win!’"  
       - *Wanton:* "Impulsively clicks Netflix without *any* reflection. Not ‘evil’—just no second-order thoughts (e.g., automatically scrolling TikTok for hours)."  
     - **THEN add addiction** as Frankfurt’s version, noting parallels.  
     - **MISCONCEPTION INTERCEPT #2:** "But everyone has second-order thoughts!" → Counter: "Ever acted impulsively on a craving *without a nanosecond of reflection*? That’s wanton-ness in a moment. Frankfurt isn’t labeling *people*, but mental structures."  

  #### **6. FRANKFURT’S CLAIM & MISCONCEPTIONS (3 min)**  
     - **State:** Freedom of will = your effective will aligns with your second-order volition.  
       - Unwilling: Misaligned → unfree will.  
       - Willing: Aligned → free will (even if no alternative action).  
       - Wanton: No volition → not applicable.  
     - **MISCONCEPTION INTERCEPT #3:** "This just redefines free will to avoid determinism!" → Clarify: "Compatibilists *accept* causes but argue free will requires a *structural* condition. Frankfurt’s offering that condition—not dodging."  

  #### **7. CHECK QUESTION (1 min)**  
     - **Revealing prompt:** "Could a person have second-order volitions but *lack* freedom of will? How?"  
       - *Correct grasp:* Yes (e.g., unwilling addict: volition exists but isn’t satisfied).  
       - *Memorizers:* Will say "no" or confuse with freedom of action.  

  ---

  ### **What to Explicitly Omit (State Upfront!)**  
  - **Announce:** "We’re *bracketing* two big questions today:  
    1. Whether *causes* of our second-order volitions undermine them (we’re assuming they can be ‘ours’ even if caused).  
    2. Whether this solves *moral responsibility* (Frankfurt thinks it helps, but that’s another talk).  
    Our goal: just to understand Frankfurt’s *structure* of free will."  

  ---

  ### **Why This Sequence Works**  
  - **Dependency Flow:** Relatable conflict → tools to describe it → distinction that prevents misapplication → cases. Jumping to addicts first invites "no one could do otherwise = no free will" derailment.  
  - **Neutral Examples:** Procrastination avoids addiction’s baggage. Save addiction for *after* framework is built.  
  - **Preemptive Strikes:** Targets misconceptions *as they naturally arise* (e.g., wanton skepticism when introducing the term).  

  **Final Tip:** When students say "But could they *really* have chosen otherwise?" smile and say: "Fantastic question—that’s *exactly* why Frankfurt separates freedom of action from freedom of will. Remember: he’s giving a *compatibilist* condition for the latter." Stick to the script—they’ll want to debate determinism, but Frankfurt’s hierarchy is a self-contained move.
