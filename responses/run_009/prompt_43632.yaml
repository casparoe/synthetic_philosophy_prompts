  ### **Quiz Tips for Your Pub Night**  
  - **Printing**: Format as a 1-page handout. Group questions 1–8, then the scoring key.  
  - **Discussion**: After scoring, debate the cases! E.g., "Why did you pick Q4=C? What details would matter?"  
  - **Flexibility**: If someone’s answers are inconsistent (e.g., EG but saves the child), have them defend it—it sparks great dialogue.  
  - **Time**: Takes ~15 minutes to complete and score.  

  This quiz isolates the core differences in the particularism-generalism debate while keeping it concrete and engaging. If you test-run it, let me know how it goes—I’d love to hear which positions your crowd leans toward! Cheers. 🍻
