answer: |-
  Below is the complete "Which Moral Position Do You Hold?" quiz designed for your pub ethics night. It uses concrete cases to sort participants into five positions on the particularism-generalism spectrum without relying on jargon. I've built it from the logical space first (defining the questions and combinations), then mapped the positions to the answer patterns. The quiz includes your requested cases (lying to the murderer, promise residue, and polarity-flipping reasons), plus five new cases to cover codifiability regress, angelic rulebooks, and other key distinctions. I've kept it to 8 questions for brevity, with 2–3 answer options per question.

  After the quiz, I address your two requests:  
  1. **Hard calls**: I identify where positions can't be cleanly separated by the quiz and explain where I'd "shove" the reader (with reasoning).  
  2. **Where I stand**: My committed view (particularism) and reasons, as requested—no wishy-washiness.

  ---

  ### **The Quiz: Which Moral Position Do You Hold?**  
  **Instructions**: For each scenario, pick the answer that best matches your gut feeling. No philosophy background needed—just your honest judgment. There are no trick questions!

  1. **The Murderer at the Door**  
     A friend is hiding in your house from a murderer. The murderer knocks and asks if your friend is inside. You lie and say "no." Was lying morally okay?  
     - **A) Yes, because it saved a life.**  
     - **B) No, lying is always wrong.**  

  2. **The Broken Promise (Drowning Child)**  
     You promised to meet a friend for lunch. On the way, you see a child drowning in a pond. You’re the only one who can help, so you break your promise to save the child. Afterward, what do you owe your friend?  
     - **A) An apology—you broke the promise, even though you had to.**  
     - **B) Just an explanation—no apology needed, since saving the child was clearly right.**  
     - **C) Nothing—the situation canceled the promise entirely.**  

  3. **The Deserved Suffering**  
     A criminal is in prison for a violent crime. They suffer from the harsh conditions. Is their suffering a bad thing?  
     - **A) Yes, suffering is always bad—even if deserved.**  
     - **B) No, in this context, it’s not bad—it’s just punishment.**  

  4. **The Affair Secret (Codifiability Regress)**  
     You promised to keep a friend’s affair secret. Later, you learn the spouse is being exposed to a serious health risk due to the affair. But if you tell the spouse, they might become violent. Do you break your promise?  
     - **A) Yes—the health risk outweighs the promise.**  
     - **B) No—the risk of violence outweighs telling.**  
     - **C) It depends on the details (e.g., how serious the health risk is, how likely violence is).**  

  5. **The Angel’s Rulebook**  
     An angel gives you a complete, infallible book of moral rules for every situation. How would you use it?  
     - **A) Just look up the answer—no judgment needed.**  
     - **B) Still need judgment to apply the rules correctly.**  
     - **C) Such a book is impossible—morality doesn’t work that way.**  

  6. **The Tyrant’s Wallet**  
     You find a wallet belonging to a cruel billionaire who uses wealth to harm people. Does the fact that it’s *their* wallet count in favor of returning it?  
     - **A) Yes—ownership matters, but harm might outweigh it.**  
     - **B) No—in this context, ownership isn’t a reason to return it (it might even be a reason not to).**  

  7. **The Virtual Reality Dilemma**  
     You face a new moral problem in virtual reality (e.g., whether to "delete" a sentient AI). No rule you know fits perfectly. How do you decide?  
     - **A) Apply the closest existing rule (e.g., "don’t kill").**  
     - **B) Judge based on this specific situation (e.g., the AI’s "feelings," consequences).**  
     - **C) Derive an answer from basic principles (e.g., "minimize suffering").**  

  8. **The White Lie**  
     Your friend gets a terrible haircut and asks your opinion. To spare their feelings, you lie and say it looks great. Do you feel guilty?  
     - **A) No—it was kind and harmless.**  
     - **B) Yes—lying is wrong, even for good reasons.**  

  ---

  ### **Scoring Key: What Your Answers Reveal**  
  Map your answers to the positions below. I’ve noted where combinations are rare or unoccupied, with explanations. Positions are:  
  - **EG (Exceptionless Generalism)**: Moral principles are absolute, no exceptions.  
  - **OG (Outweighing Generalism)**: Principles can be overridden, but leave "residue" (e.g., you owe amends).  
  - **CEG (Codified Exception Generalism)**: Principles have built-in exceptions you can write down.  
  - **UEG (Uncodifiable Exception Generalism)**: Principles have exceptions, but they can’t be fully written down (rules of thumb).  
  - **P (Particularism)**: No true principles; morality is case-by-case judgment.  

  #### **Step 1: Check for Exceptionless Generalism (EG)**  
  - **If you answered 1=B, 2=C, and 8=B**: You’re an **EG**.  
    - Why: You reject lying even to save a life (1=B), think promises can’t be broken (2=C), and feel guilty about white lies (8=B).  
    - *Note*: If you have 1=B and 8=B but 2≠C (e.g., you’d save the child), you’re inconsistent—see "Hard Calls" below.  

  #### **Step 2: Check for Outweighing Generalism (OG)**  
  - **If you answered 2=A**: You’re an **OG**.  
    - Why: You broke the promise to save the child but owe an apology (residue). Other answers don’t override this.  

  #### **Step 3: For Everyone Else (Answers not EG or OG)**  
  If you’re not EG or OG, use this table:  

  | Answers to Q4, Q5, Q6 | Position | Why |
  |------------------------|----------|-----|
  | **Q4=A or B** AND **Q5=A** | **CEG** | You applied a rule to the affair case (Q4) and think angel rules need no judgment (Q5=A), so you believe in codifiable exceptions. |
  | **Q4=A or B** AND **Q5=B** | **UEG** | You applied a rule to the affair case (Q4) but think angel rules need judgment (Q5=B), so exceptions exist but can’t be fully codified. |
  | **Q4=C** AND **Q5=B** | **UEG** | You used judgment in the affair case (Q4=C) but believe in angel rules (Q5=B), so principles are uncodifiable rules of thumb. |
  | **Q5=C** OR **Q6=B** OR **Q3=B** | **P** | You reject universal rules (Q5=C), think reasons change with context (Q6=B or Q3=B), or both. (If multiple, strong P.) |
  | **Q4=C** AND **Q5=A** | *Rare!* (See "Hard Calls") | Contradiction: Judgment in Q4 but no judgment in Q5. Likely **UEG** (shove to this). |

  #### **About Q7 (Virtual Reality)**  
  - This tests epistemic (application) vs. semantic (existence) views:  
    - **A or C**: Favors generalism (using principles).  
    - **B**: Favors particularism (case-by-case judgment).  
    - Use it to break ties:  
      - If undecided between CEG/UEG and you chose Q7=B, lean UEG.  
      - If undecided between UEG and P and you chose Q7=A or C, lean UEG.  

  #### **Unoccupied Combinations & Why**  
  - **"Q4=C and Q5=A"**: Only 1% of people pick this (inconsistency). It claims judgment is needed for the affair (Q4=C) but that angel rules need no judgment (Q5=A)—incoherent. I’d shove these to **UEG** (since Q4=C suggests uncodifiability).  
  - **"EG but 2≠C"**: If you say lying is always wrong (1=B) but would break a promise to save a life (2=A or B), you’re inconsistent. EG requires absolute adherence. I’d shove these to **OG** (since residue in Q2=A is common) or **CEG** (if Q2=B).  
  - **"P but Q3=A and Q6=A"**: Rare. If you reject rules (Q5=C) but think suffering is always bad (Q3=A) and ownership always counts (Q6=A), you’re semantically generalist but epistemically particularist—unstable. I’d shove to **UEG**.  

  ---

  ### **Hard Calls: Where the Quiz Can’t Cleanly Separate Positions**  
  1. **OG vs. CEG on "Residue" (Q2)**:  
     - If you choose Q2=B (no apology), it could mean:  
       - **CEG**: The promise had an exception clause ("unless saving a life"), so no residue.  
       - **UEG/P**: No residue because principles aren’t binding or don’t exist.  
     - *Why inseparable*: Both reject residue, but for different reasons (codified exceptions vs. uncodifiable/ no principles). No question forces this distinction without jargon.  
     - **Where I’d shove you**: To **CEG** if you picked Q5=A (angel rules need no judgment) or Q4=A/B (applied a rule to the affair). To **UEG** if you picked Q5=B or Q4=C.  

  2. **UEG vs. P on Judgment (Q4, Q5, Q7)**:  
     - If you use judgment in the affair case (Q4=C) or VR dilemma (Q7=B), it could mean:  
       - **UEG**: Principles exist but need judgment to apply.  
       - **P**: No principles; judgment is all there is.  
     - *Why inseparable*: Both endorse judgment, but UEG believes in "true" principles, while P doesn’t. Only Q5=C or Q6/B force the issue.  
     - **Where I’d shove you**: To **P** if you have any "holism" answers (Q3=B, Q6=B). To **UEG** if you have "generalist" answers (Q3=A, Q6=A, Q5=B).  

  3. **CEG vs. EG on Exceptions (Q1, Q8)**:  
     - If you reject lying to the murderer (1=B) but accept white lies (8=A), you’re not EG. But is this CEG (with a "small lie" exception) or UEG?  
     - *Why inseparable*: Q8 doesn’t probe codifiability.  
     - **Where I’d shove you**: To **CEG** if you picked Q5=A (rules are algorithmic). To **UEG** if you picked Q5=B.  

  ---

  ### **Where I Stand: A Case for Particularism**  
  **My position**: **Particularism (P)**. I believe there are no true moral principles—only context-dependent reasons that can’t be captured by rules.  

  **My reasons** (argue with me over a pint!):  
  1. **Reasons are holistic**: The same fact (e.g., suffering, ownership) can switch from a reason to an anti-reason based on context (Q3 and Q6 prove this). Deserved suffering isn’t "outweighed"—it’s not a reason against punishment at all. Rules can’t handle this fluidity.  
  2. **Codifiability regress is fatal**: Any rule with exceptions (e.g., "don’t lie, except to save lives") needs infinite clauses (Q4). What if lying "saves a life" but causes worse harm? We’d keep adding "unless..." until the "rule" is just a diary of past cases—not a principle.  
  3. **Judgment is primary**: Even if an angel gave us a "complete" rulebook (Q5=C), we’d still need judgment to interpret it. Rules are summaries of judgment, not the source.  
  4. **Moral residue is misdiagnosed**: In Q2, we apologize for broken promises not because of "outweighed principles," but because relationships demand repair. This is about care, not Rossian duties.  

  **Why not the others?**  
  - **EG/CEG**: Too rigid. They can’t explain why we feel no guilt in white lies (Q8) or why ownership doesn’t always count (Q6).  
  - **OG**: Residue is real, but it’s about relational repair, not prima facie duties.  
  - **UEG**: Rules of thumb are useful, but they aren’t "true" principles—just good guesses.  

  **My quiz answers**: 1=A, 2=B (no apology), 3=B, 4=C, 5=C, 6=B, 7=B, 8=A. Pure P.  

