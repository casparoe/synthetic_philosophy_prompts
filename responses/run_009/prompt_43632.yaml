prompt: |-
  I run a monthly ethics discussion night at a pub — fifteen or so people, a mix of students and randoms with no philosophy background — and I want to make a which-position-do-you-actually-hold quiz on particularism vs. generalism in ethics. So: does moral thinking run on principles, or on judgment applied case by case?

  The quiz itself: eight or so questions, each one a concrete case with two or three answer options, and then a scoring key mapping answer patterns onto the positions. The questions have to sort people by what they say about the cases, not by which label they like — so no question can just ask do you believe in moral principles, and nothing that needs jargon to parse.

  A few cases I definitely want in there. One, the classic about lying to someone at the door who intends to kill the friend hiding in your house, asked point blank — that one should test whether any principle survives without exception. Two, a promise you ought to break to prevent serious harm, where the real question isn't whether you may break it but what's left over afterwards: does the broken promise still count against you, do you owe the person an apology, or did the promise simply stop applying? That should separate people who think principles get outweighed from people who think they get switched off by an exception clause. Three, at least one case where the same fact seems to flip its moral polarity depending on surroundings — suffering that's deserved, or a risk somebody knowingly signed up for — to test whether reasons depend on their context.

  Build the tree from the logical space, not from a list of names: figure out the questions and their combinations first, then locate the actual positions in that space. The leaves must include exceptionless generalism; the outweighing kind (Ross-ish, prima facie duties that leave a residue when you break them); generalism with codified exception clauses; generalism where the exceptions are real but can't be written down in practice, so principles are just reliable rules of thumb; and straight particularism, where there are no true moral principles at all and reasons are holistic. If some combination of answers in the space is unoccupied, say so and take a guess at why — incoherent, unattractive, or just unexplored.

  Work the codifiability regress in somewhere too: once you write down the exceptions to a principle, do the exceptions have their own exceptions, and so on — and is a principle with a thousand clauses still a principle, or just a notebook? And keep the semantic question (are there true principles?) separate from the epistemic one (could a human ever apply them). Maybe a case where an angel hands you the complete, exception-free list of moral rules — would you then just look things up like a code, or would judgment still be doing the actual work?

  Two things I want from you beyond the quiz. First, don't be wishy-washy on the hard calls: if two leaves can't really be separated by any question a reader could answer without already knowing the theory, say so plainly, and then say which side you'd personally shove the reader into and why. Second, tack a short where-I-stand section on the end — which leaf you actually think is correct, with your reasons. I'd rather recieve your committed view and argue with it over a pint than get a menu.
reasoning: |-
  We are designing a quiz to sort people into positions on the moral particularism vs. generalism spectrum. The positions we want to capture are:

  1. Exceptionless generalism: Moral principles are absolute and without exception.
  2. Outweighing generalism (Rossian): Principles are prima facie duties that can be overridden by stronger duties, but the overridden duty leaves a residue (e.g., you owe an apology).
  3. Generalism with codified exception clauses: Principles have built-in exception clauses that can be explicitly stated (e.g., "Do not lie, except to save a life").
  4. Generalism with uncodifiable exceptions: Principles are reliable rules of thumb, but the exceptions cannot be fully written down (though the principles still capture genuine moral truths).
  5. Straight particularism: There are no true moral principles; moral reasons are holistic and context-dependent.

  We also want to address the codifiability regress and separate the semantic (existence of true principles) from the epistemic (practical application) question.

  We have three cases we want to include:

  Case 1: The murderer at the door (lying to protect a friend). This tests whether lying can be permissible in some circumstances.

  Case 2: Breaking a promise to prevent serious harm. The key is the residue: does the broken promise still count against you? (outweighing) or was the promise simply not binding in that case? (exception clause).

  Case 3: A fact that flips moral polarity (e.g., suffering that is deserved or a risk knowingly taken). This tests context-dependence.

  We need 5 more cases to make 8. Let's plan:

  - Case 4: Codifiability regress: a case with nested exceptions? Or a question about whether a rule with many exceptions is still a rule.

  - Case 5: The angel case: if given a complete code, would you just look up the answer? This tests the role of judgment.

  - Case 6: A case where the same action in two slightly different contexts has different moral status, to test context-dependence again.

  - Case 7: A case involving a conflict of duties to see how one resolves it (and whether residue remains).

  - Case 8: A case where a principle seems to apply but the outcome is counterintuitive, to test if the principle must have an exception.

  But we also want to cover the regress and the angel. Let me structure the questions.

  We'll design 8 scenarios. Each scenario has 2-3 answer choices. We then map patterns to positions.

  Let me sketch the scenarios:

  1. **The Murderer at the Door**: You are hiding your friend who is being pursued by a murderer. The murderer comes to your door and asks if your friend is inside. You lie and say no. Is lying in this situation morally permissible?
     - A: Yes, it is permissible to lie to save a life.
     - B: No, lying is always wrong.

     This tests exceptionless vs. others.

  2. **Breaking a Promise to Prevent Harm**: You promised to meet a friend for lunch, but on the way you see a child drowning in a pond. You are the only one around. You break the promise to save the child. After saving the child, what do you owe your friend?
     - A: Nothing. The situation meant the promise didn't apply.
     - B: An apology and explanation. You broke a promise, even though you had a good reason, and that leaves a moral residue.
     - C: You did the right thing and that's all there is to it. (But we want to separate residue from no residue. Option C might be merged with A? Let me think.)

     We want to separate A (exception clause) from B (outweighing, residue) and also from someone who might think the promise wasn't binding at all? But note: in the case, the promise was made and the situation arose. Option A: the exception clause means the promise was void in this circumstance. Option B: the promise was overridden, so you broke it and owe amends.

     We might need to rephrase. Let me try:

     After saving the child, you meet your friend. What do you think is the morally appropriate thing to do?
     - A: Explain what happened and apologize for breaking the promise.
     - B: Explain what happened, but no apology is needed because the situation clearly justified breaking the promise.
     - C: You don't need to say anything; you did the right thing.

     But C might be too extreme. We can have:

     - A: Apologize and explain.
     - B: Explain without apologizing.
     - C: Don't even mention it.

     But that might not capture the residue. Instead, focus on the moral residue:

     - A: You did the right thing by saving the child, but you still have a moral obligation to make it up to your friend because you broke the promise.
     - B: You did the right thing and that's the end of it. The promise was not binding in this situation.
     - C: You did the right thing, but you owe your friend an apology (not necessarily making it up, but acknowledging the broken promise).

     Let me set:

     - A: You owe your friend an apology and perhaps something to make up for the broken promise (residue).
     - B: You owe an explanation but no apology because the situation made breaking the promise the right thing (no residue, exception clause).
     - C: You don't owe anything beyond an explanation if asked, because the promise was void in the circumstances (no residue, and no need to even volunteer an apology).

     But note: in the Rossian view, the duty of promise-keeping is overridden by the duty to save a life, but the broken promise leaves a residue that requires an apology. So:

     - Option that matches outweighing: A (apology and make up? or just apology? Let's say: you should apologize because you broke a promise, even though you did the right thing overall).

     So:

     - A: You should apologize to your friend for breaking the promise.
     - B: You should explain why you broke the promise, but an apology is not required because you did nothing wrong.
     - C: You don't need to do anything; the situation absolved you of any obligation.

     We'll use A and B. C might be too close to B? We can combine B and C? But let's keep two:

     - A: Apologize for breaking the promise (even though you did the right thing).
     - B: Do not apologize; you did nothing wrong.

     This is a key split: residue (A) vs. no residue (B).

  3. **Flipping Polarity: Deserved Suffering**: Imagine two scenarios:

     Scenario A: A person is suffering because they are being tortured by a captor. The suffering is bad.

     Scenario B: A criminal is suffering because they are serving a just prison sentence. The suffering is part of the punishment.

     Now, consider a fact: "the criminal's suffering". In Scenario A, that fact is a reason to stop the torture. In Scenario B, that fact is not a reason to release the criminal (or might even be a reason to keep them in prison). Does the same fact (suffering) change its moral nature depending on the context?

     We can ask:

     In the criminal's case, is the suffering a bad thing that we just have to accept for the sake of justice, or is it actually a good thing (or at least not a bad thing) in that context?

     But we want a multiple-choice:

     - A: Suffering is always bad, but in the criminal's case, we have to accept it because of the greater good of justice.
     - B: The suffering of the criminal is not bad in the same way as the innocent's suffering; it's deserved and therefore has a different moral nature.

     This tests whether the reason (suffering) is context-dependent.

     Alternatively, we can ask:

     Does the fact that someone is suffering always count against the situation (even if outweighed) or can it sometimes not count against the situation at all?

     - A: Suffering is always a bad thing, so it always counts against the situation (though sometimes it might be outweighed).
     - B: In some contexts (like punishment), suffering is not a bad thing and does not count against the situation.

     This is a direct test of holism (particularism) vs. atomism (generalism).

  4. **Codifiability Regress: The Exception to the Exception**: Suppose we have a principle: "Do not break a promise." Then we add an exception: "unless breaking it prevents serious harm." Now, what if breaking a promise to prevent harm would cause even greater harm? For example, you promised to keep a secret that your friend is cheating on their spouse. If you break the promise to tell the spouse (to prevent harm to the spouse), but you know the spouse is unstable and might become violent, so telling could lead to physical harm. Now, the exception (prevent harm) might not apply because it might cause more harm. Can we write a rule that covers all such cases?

     We can ask:

     When trying to write down moral rules, what do you think about the following:

     - A: It's possible to write a complete set of rules with all exceptions included, even if it becomes very long.
     - B: We can write rules with exceptions, but there will always be further exceptions that we haven't thought of, so rules are always incomplete.
     - C: It's impossible to write any useful rules because every situation is unique and rules always miss the context.

     But we want a concrete case. Let's make a scenario:

     You have a principle: "Break a promise only if it prevents serious harm." Now, in the situation above: breaking the promise to tell the spouse about the cheating might lead to physical harm. Do you break the promise?

     - A: Yes, because the exception (prevent harm) applies: the spouse is being harmed by not knowing.
     - B: No, because the potential for greater harm means the exception doesn't apply.
     - C: It depends on the specifics: how likely is the violence, how serious is the emotional harm, etc.

     But note: if you choose C, it suggests that the rule isn't sufficient and judgment is needed. Also, if we keep adding exceptions, we get a regress.

     The question is: can we write a rule that covers this? Or is judgment required regardless?

     We can ask: In this situation, is there a clear rule that tells you what to do?

     - A: Yes, the rule should be: "Break a promise to prevent harm only if it doesn't cause greater harm." So we just amend the rule.
     - B: We can amend the rule, but then there might be exceptions to that amended rule (e.g., what if the greater harm is very unlikely?), so we can never finish writing the rules and we must use judgment.
     - C: There is no rule that can capture this; you have to look at the whole situation.

     But we want multiple-choice for a concrete case. Let me set the scenario:

     Your friend made you promise not to tell anyone about their affair. You discover that the spouse is being exposed to a health risk because of the affair. However, you also know the spouse has a violent temper and might hurt your friend if they find out. Do you break the promise?

     Now, the answers:

     - A: Break the promise because health risk is serious harm.
     - B: Do not break the promise because of the risk of violence.
     - C: It depends on the details: how serious is the health risk? How likely is violence? You have to weigh the factors.

     This doesn't directly test the regress. Alternatively, we can ask a meta-question about rules.

     But let's try to keep it case-based. The point is that if you choose C, you are saying that judgment is necessary and a simple rule won't do. If you choose A or B, you are applying a rule (with an exception) but then we can ask: what if the exception has an exception? So perhaps we need two questions.

     Alternatively, we can have a question about the nature of rules:

     "If we try to write down moral rules, we often add exceptions. But then those exceptions might have exceptions. How far can this go?"

     - A: We can eventually write a complete set of rules that covers every possible case, with all exceptions included.
     - B: We can write rules that cover most cases, but there will always be unexpected situations that require judgment because we can't anticipate every exception.
     - C: There's no point in writing rules because every situation is unique and rules will always mislead us.

     This might be too abstract. We'll make it a scenario that forces the issue.

  5. **The Angel Case**: Suppose an angel gives you a complete and infallible moral rulebook that lists every possible situation and the right action. When faced with a moral dilemma, do you:

     - A: Look up the situation in the rulebook and do what it says. No need for judgment.
     - B: You still need judgment to recognize which rule applies and to apply it to the situation, but the rules are complete and true.
     - C: The very idea of such a rulebook is impossible because morality doesn't work that way.

     This separates the semantic (are there true principles?) from the epistemic (can we apply them without judgment?).

     But note: C is particularism. B is generalism (principles exist but need judgment for application). A is a kind of generalism that is algorithmically applicable.

  6. **Conflict of Duties**: You are a doctor. You have two patients who need an organ transplant to live. One is your child, the other is a stranger. Only one organ is available. What do you do?

     - A: Save your child because family comes first.
     - B: Flip a coin to be fair.
     - C: Save the one who has a better chance of survival.

     But this might not directly test principles. We want to see if they think there is a residue. After saving your child, do you feel guilty about the stranger? Or is it just a tragic situation?

     Alternatively, we can ask: After saving your child, what is your moral state?

     - A: You did the right thing; no guilt.
     - B: You did what you had to do, but you still feel bad for the stranger and wish you could have saved both.
     - C: You have a lingering moral guilt because you prioritized your child over the stranger.

     This tests residue. In Rossian terms, the duty to save the stranger was overridden by the duty to your child, but it leaves a residue? Or not? Actually, in this case, many would say you did the right thing and there's no residue. So maybe not the best.

     Instead, let's take a case where there's a clear conflict and then ask about the residue.

     You promised your spouse to attend their important event, but then your parent has a medical emergency and needs you. You break the promise to be with your parent. Afterward, what do you do?

     - A: Apologize to your spouse for breaking the promise and try to make it up.
     - B: Explain to your spouse and expect them to understand; no apology needed because it was clearly justified.

     This is similar to the promise case. Maybe we don't need two.

     Let's do a different kind of conflict: A trolley problem variant. You can divert a trolley to save five people, but it will kill one. Do you pull the switch?

     - A: Yes, because saving five lives is better.
     - B: No, because actively killing one is wrong.

     Then, if you pull the switch, do you feel guilty about the one? Or do you think you did the right thing?

     - A: You did the right thing and should not feel guilty.
     - B: You did the right thing but you should feel guilty because you caused a death.
     - C: You did the wrong thing and should feel guilty.

     But this is messy.

