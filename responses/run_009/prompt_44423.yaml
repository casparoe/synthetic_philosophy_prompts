prompt: |-
  After years of passive index investing, I've recently taken over managing a small portion of my family's savings, and position sizing has become a very concrete question for me rather than an academic one. I understand that the Kelly criterion recommends the bet fraction that maximizes expected log wealth, and I've also come across the "ergodicity economics" line of argument, according to which ordinary expected-value reasoning is simply inappropriate for individuals, because a single person lives through one time series rather than an ensemble of parallel possible worlds. What I cannot untangle is this: if my utility for money happens to be logarithmic, then maximizing expected utility and betting Kelly amount to the same thing, so what exactly is the ergodicity argument supposed to add? Is it a genuine rival to expected utility theory, or does it quietly presuppose a log-utility assumption and then present itself as an assumption-free derivation of that same assumption? There is a related point that I also want cleared up: I've seen it claimed that Kelly's long-run dominance only manifests over many repeated bets, so that in a genuinely one-shot situation the Kelly recommendation collapses into an arbitrary choice of how risk-averse to be, no better justified than any other concave utility function. Please explain, in plain terms, where a Kelly bettor and an expected-utility maximizer genuinely disagree and where the disagreement is merely bookkeeping, and tell me what practical conclusion, if any, follows for someone sizing positions in a real account. Please write in continuous prose only, with no headings, bullet points, bold text, or tables.
reasoning: |-
  Okay, let me unpack this user's query. They've moved from passive investing to actively managing family savings, so position sizing is now a real concern. They mention the Kelly criterion and ergodicity economics, but they're confused about how these relate to expected utility theory.

  Hmm, they're specifically puzzled about whether ergodicity economics secretly assumes log utility while claiming to reject expected utility. And they want to know if Kelly only makes sense for repeated bets. Practical guidance for their real-world position sizing is their ultimate need.

  First, I need to clarify the core relationship between Kelly and expected utility. When utility is logarithmic, Kelly's growth maximization equals expected utility maximization. That's straightforward. But then what does ergodicity add? The user suspects it might be circular reasoning - assuming log utility to "derive" log utility. That suspicion deserves careful attention.

  The ergodicity argument starts by rejecting ensemble averages (expected value) for time averages when systems are non-ergodic. For multiplicative growth like investing, they show wealth follows a non-ergodic process. So they argue we must maximize the time-average growth rate. But - and this is crucial - that time-average growth rate is literally the expected log return. So maximizing it <em>is</em> assuming log utility implicitly. The math shows it's identical. 

  For the one-shot scenario question: yes, Kelly's "long-run dominance" requires repetition. In a single bet, maximizing expected log wealth is just one particular risk preference (log utility). It has no special optimality over other concave utilities. The ensemble average/time average distinction collapses when N=1.

  Where do they genuinely disagree? Only in philosophy, not mathematics. Kelly/log-utility investors accept they're expressing a specific risk preference. Ergodicity proponents present the same strategy as objectively necessary due to non-ergodicity, but their derivation mathematically requires assuming the log form. 

  Practical takeaways: For repeated bets, Kelly/log-utility is compelling for long-term growth. For one-shot, it's merely one rational choice among others. Crucially - no strategy can escape the need to choose your risk tolerance. The user should size positions based on their actual goals (growth vs capital preservation) and conviction level, using half-Kelly or fractional Kelly for psychological comfort. The "ergodicity" framing adds no new math, only a different justification for the same numbers.
answer: |-
  Your confusion is understandable – you've touched upon a nuanced debate where mathematical equivalence meets philosophical interpretation. Let me unravel this step by step.

  First, the core equivalence: If your utility function *is* logarithmic (U(W) = log(W)), then maximizing expected utility (EU) *does* mathematically coincide with maximizing expected logarithmic growth (Kelly). The Kelly fraction *f* that maximizes E[log(1 + f*X)] (where X is the return relative to your stake) is identical to the *f* that maximizes E[U(W)] when U(W) = log(W). This is a mathematical fact. So, for a log-utility investor, Kelly isn't a rival to EU; it's the computational method to achieve it.

  **So what *is* the ergodicity argument adding?** It positions itself as a fundamental critique of expected value maximization (E[X]) in non-ergodic systems, arguing that time averages (what a single individual experiences over time) differ from ensemble averages (the "expected value" over many parallel worlds). For multiplicative wealth growth (compounding), the process *is* non-ergodic. The argument claims that maximizing the *growth rate* of wealth (g = E[log(1 + r)]) is the objectively correct criterion for an individual traversing a single time-path, *regardless* of any assumed utility function.

  **Here's the crux of your suspicion:** Does ergodicity economics quietly *presuppose* log utility? Essentially, yes, but it presents it as a *consequence* of the dynamics, not an assumption. The argument goes:
  1.  Wealth grows multiplicatively (compounding).
  2.  Multiplicative growth is non-ergodic (time average ≠ ensemble average).
  3.  Therefore, the rational objective for an individual is to maximize the *time-average growth rate*.
  4.  This growth rate *is* g = E[log(1 + r)].
  5.  Hence, maximize E[log(1 + r)].

  The key move is step 3: asserting that maximizing the long-term growth rate *g* is the *only* rational objective in this non-ergodic context. However, *g* is explicitly the expectation of log wealth. Maximizing *g* **is** mathematically identical to maximizing expected log utility. Ergodicity proponents argue they've *derived* the necessity of log utility from the system's dynamics and the individual's perspective. Critics argue it simply *redefines* rationality (as long-term growth maximization) which implicitly corresponds to log utility, without escaping the need for a fundamental preference about how to value different wealth outcomes over time. It replaces the "assumption" of log utility with the "assumption" that long-term growth rate is the sole rational objective.

  **Regarding Kelly in one-shot vs. repeated bets:**
  *   **Repeated Bets (Long Run):** This is Kelly's stronghold. Maximizing E[log(1+r)] guarantees the highest possible asymptotic growth rate and almost surely dominates any other strategy in the long run. The probability of your wealth exceeding any other strategy's wealth approaches 1 as time goes to infinity. This dominance is linked to the non-ergodicity – Kelly optimizes the single-path outcome over time.
  *   **Genuine One-Shot Bet:** Here, the Kelly recommendation *does* collapse into being one specific risk preference – the log-utility preference. There is no long run to dominate in. Maximizing E[log(1+r)] is equivalent to maximizing EU with U(W)=log(W). Choosing a different fraction *f* is equivalent to maximizing EU with a *different* concave utility function. No fraction is objectively "better" in a single, isolated bet *unless* you specify a utility function defining "better." The ensemble average (expected value) might favor a higher *f*, while the log utility favors Kelly *f*.

  **Where do they genuinely disagree? Where is it bookkeeping?**

  *   **Genuine Disagreement (Philosophical Foundation):**
      *   **Expected Utility (with Log Utility):** "I value wealth logarithmically. Therefore, I choose the bet fraction that maximizes my expected log wealth (which Kelly calculates)."
      *   **Ergodicity Economics:** "Expected value (E[X]) is fundamentally flawed for individuals in multiplicative processes because it averages over ensembles, not time. The only rational objective is maximizing your long-term growth rate *g*. The math shows this requires maximizing E[log(1+r)]." It rejects the *framework* of expected value maximization (E[X]) for decision-making in this context, claiming it leads to ruinous strategies like betting full bankroll on positive-EV gambles.
      *   **Kelly (as originally framed):** Often presented pragmatically as the bet fraction that maximizes long-run growth, linking it to information theory (betting proportionally to your "edge").

  *   **Bookkeeping (Mathematical Equivalence):** For an investor who *already* has log utility, Kelly is simply the tool to maximize their EU. If ergodicity economics convinces someone that maximizing long-term growth is their only rational goal, then *for them*, maximizing E[log(1+r)] becomes their EU maximization strategy *with* log utility. The calculations and the resulting bet fraction are identical. The disagreement lies in *why* you arrived at that specific optimization criterion.

  **Practical Conclusions for Your Real Account:**

  1.  **Acknowledge Your Time Horizon & Bet "Repeatability":** Are you sizing positions for truly repeated opportunities (similar independent bets over years) or are these infrequent, large, potentially correlated decisions? Kelly shines brightest for frequent, independent, repeated bets (like tactical asset allocation within a diversified portfolio). For infrequent, large, one-off bets (e.g., buying a house, a single venture investment), Kelly's long-run dominance argument weakens significantly. It reverts to being *one* rational risk preference (log utility) among others.
  2.  **Embrace Kelly as a Powerful Tool (with Caveats), Not Gospel:** The Kelly fraction is an incredibly useful *upper bound* on position sizing for growth maximization.
      *   **Fractional Kelly is Prudent:** Very few investors can tolerate the volatility and drawdowns of full Kelly. Using 1/2 Kelly or 1/4 Kelly significantly reduces volatility and drawdowns while capturing most of the long-term growth benefit. This is practically equivalent to using a utility function with less risk tolerance than pure log utility (e.g., U(W) = W^c with c<1).
      *   **Estimation Risk is Paramount:** Kelly is extremely sensitive to your estimates of probabilities and payoffs ("edge"). Overestimating your edge leads to disastrous overallocation. Fractional Kelly also acts as a crucial buffer against estimation error.
      *   **Correlation Kills:** Kelly assumes independent bets. Correlated positions (e.g., multiple stocks in the same sector) can lead to massively oversized aggregate exposure. You *must* account for correlation in portfolio-level Kelly calculations or use conservative fractional sizing.
  3.  **You Still Need "Utility" (or Goals):** Kelly/ergodicity tells you how to maximize long-run growth *if* that is your sole objective. But is it? You likely also care about:
      *   **Volatility Tolerance:** Can you psychologically withstand the drawdowns of even half-Kelly?
      *   **Capital Preservation:** Are you protecting a specific amount (e.g., for a near-term goal)?
      *   **Overall Portfolio Goals:** How does this "small portion" interact with the rest of your family's passive portfolio? Is its role aggressive growth or something else?
      *   **Your Conviction:** How confident are you in your edge? Low confidence warrants lower fractional Kelly.

  **In essence:** The Kelly criterion, derived via maximizing E[log(W)] or via ergodicity arguments, provides a mathematically sound foundation for maximizing long-term capital growth in repeated, independent bets. Ergodicity economics offers a compelling philosophical critique of naive expected value maximization but ultimately lands on the same mathematical criterion as maximizing expected log utility for multiplicative processes. For practical position sizing, use (fractional) Kelly as a sophisticated risk-based sizing tool *if* long-term growth is your primary goal for that capital, but temper it aggressively with fractional sizing due to estimation risk, correlation, and personal/psychological tolerance for volatility. Recognize that for non-repetitive decisions, it becomes simply one expression of risk aversion within the broader framework of utility maximization. Your practical conclusion is not to adopt one philosophy over the other, but to leverage the Kelly *math* judiciously as a powerful, risk-aware tool within your overall investment objectives and constraints.
