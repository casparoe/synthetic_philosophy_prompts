prompt: |-
  I'm in a philosophy of biology course and we just wrapped up the units of selection unit, which turned into three weeks of everyone talking past each other. Our assignment is to write up "where you actually stand" and bring it to section so people can attack it. Mine is below, and before I hand it over I want to know whether it even hangs together internally, because I have a feeling something in it contradicts something else and I can't see what. (1) Selection always acts on phenotypes, never directly on genes — you can't select for a stretch of DNA in the abstract, only for what it does in a body. (2) Genes are nonetheless the only genuine units of selection: they're the only things that last long enough, copy faithfully enough, and are the real beneficiaries of adaptation, while organisms, groups, herds etc. are just vehicles. (3) I'm pretty down on group selection — most supposed cases commit the averaging fallacy, i.e. the fact that groups differ in average composition doesn't show that anything happened at the group level, you'd need to show that a group's composition changed because of something the group did as a group. (4) Species selection, on the other hand, I fully believe in: differences between clades in speciation and extinction rates explain macroevolutionary patterns that nothing at the organism level can touch. (5) Eusocial insect colonies are genuine superorganisms, so colony-level "selection" in ants and bees is just ordinary selection on organisms that happen to be colonies — no group selection needed there either. (6) Deep down I think the question "what level does selection really act at?" is partly a bookkeeping choice — the gene's-eye description and the organism's-eye description are two renderings of the same causal process — though when pressed I'd insist the causal story is ultimately about genes.

  Two things I want checked specifically, because I'm unsure of them. First, I used to think (1) and (2) flatly contradicted each other and now I believe the replicator/interactor distinction dissolves the tension, but I might be getting that distinction to do more work than it can actually do — be honest with me about whether it's really fine. Second, my TA read a draft and said something cryptic like "watch how you use the word 'really' in this document," which was not helpful, and I genuinely can't tell if she was pointing at (6), at (2), or somewhere else entirely.

  So: go through the six, tell me which pairs pull against each other and which only look like they do, rank the tensions by severity rather than handing me an undifferentiated list, and for the real ones say what would have to give and what giving it up would cost me elsewhere on the list. Don't pull any punches just because (5) lets me keep my anti-group-selection story — if the superorganism move is doing something fishy, I want to know.
reasoning: |-
  Okay, the user is in a philosophy of biology course and has written a position statement on the units of selection debate. They want to ensure their argument is internally consistent before presenting it to their section. I need to analyze their six points for contradictions and tensions, particularly focusing on the replicator/interactor distinction and their TA's cryptic comment about the word "really."

  First, let's break down their six points:

  1. Selection acts on phenotypes, not genes directly.
  2. Genes are the only genuine units of selection.
  3. Skeptical of group selection due to the averaging fallacy.
  4. Accepts species selection as valid.
  5. Eusocial colonies are superorganisms, so no group selection needed.
  6. The level question is partly bookkeeping, but genes are the ultimate causal story.

  The main tensions I see are between points 1 and 2. Point 1 emphasizes phenotype-level interaction, while point 2 claims genes are the only real units. The replicator/interactor framework (from Dawkins/Hull) is supposed to resolve this - genes as replicators (units of inheritance) vs. interactors (phenotypic entities). But the user might be overstating genes as the "only" units when interactors are equally essential to the selection process.

  Point 2's claim that genes are "the real beneficiaries" also seems problematic - adaptation benefits the gene lineage, but this metaphorical language might be confusing. Point 4's acceptance of species selection clashes with point 2's exclusivity claim. Species selection involves species-level properties (speciation rates) that aren't reducible to genes. The user might need to adjust their definition of "unit of selection" to accommodate this.

  Point 5 is clever: reframing eusocial colonies as superorganisms avoids group selection. This seems consistent unless we question what constitutes an "organism." The user should be prepared to defend this boundary. Point 6 acknowledges multiple valid perspectives but privileges genes as the "ultimate" story. The TA's comment about "really" likely targets this privileging - the user should clarify when they're making ontological claims versus practical choices.

  Overall, the most severe tensions are between points 2 and 4 (species selection), and between points 1 and 2's overstatement of genes as "only" units. Moderate tensions exist in the beneficiary language and the "ultimate" claim in point 6. The replicator/interactor distinction helps but doesn't fully resolve point 2's exclusivity. To fix contradictions, the user could soften point 2 to position genes as primary rather than exclusive units, explicitly define "beneficiary," and clarify the status of species selection within their framework. Their anti-group-selection stance (points 3 and 5) remains intact if they can defend superorganisms and species selection consistently.
answer: |-
  Your position is coherent at its core but has some significant tensions—mainly from overstatement in (2) and (6)—that your classmates (or TA) will likely target. Below is a ranked analysis of the tensions, from most to least severe, with solutions and trade-offs. The replicator/interactor distinction *does* resolve the core (1)/(2) tension, but you’re stretching it too far elsewhere.

  ---

  ### **Ranked Tensions (High to Low Severity)**
  1. **Tension: (2) vs. (4)**  
     **Severity:** High (direct contradiction)  
     - **Conflict:** (2) claims genes are the *only* genuine units of selection. (4) accepts species selection, which requires species-level properties (e.g., speciation rate) as units of selection. Species selection acts on heritable variation *among species*, not genes (e.g., a clade with high speciation rates persists regardless of its members' genes).  
     - **Why it matters:** Species selection is a classic case of *higher-level selection*—if you accept it, you can’t call genes the "only" units.  
     - **What must give:** Soften (2). Admit genes are the *primary* units for *organismal* adaptation, but species/clades can be units in macroevolution.  
     - **Cost:** Weakens your gene-centric absolutism but saves (4).  

  2. **Tension: (2) vs. (1) + (6)**  
     **Severity:** Moderate (overstatement in (2) undermines nuance)  
     - **Conflict:** (1) and (6) correctly note selection acts on phenotypes (interactors) and that "levels" are partly descriptive. But (2) asserts genes are the *only real beneficiaries* and "genuine" units. This clashes with:  
       - (1): If selection acts on phenotypes, interactors (organisms, colonies) *are* causal units during selection.  
       - (6): Calling gene-level description "ultimate" ignores that interactors are equally "real" in the causal chain (e.g., a predator eats a rabbit, not a gene).  
     - **Why it matters:** The replicator/interactor distinction *separates* inheritance (genes) from interaction (phenotypes). Claiming genes are the *only* real units collapses this.  
     - **What must give:** Revise (2) to: "Genes are the only *replicators*, making them the units of inheritance/adaptation *in the long term*." Drop "only genuine units" and "real beneficiaries" (which is poetic but misleading—adaptation benefits lineages, not genes "themselves").  
     - **Cost:** You lose rhetorical punch but gain consistency with (1)/(6).  

  3. **Tension: (6)’s "Ultimately" vs. (4) and (5)**  
     **Severity:** Moderate (your TA’s "really" warning)  
     - **Conflict:** You say the gene’s-eye view is "ultimately" causal (6), yet accept species selection (4) and superorganisms (5) as valid. But species selection *cannot* be reduced to genes (it acts on emergent properties like geographic range), and superorganisms *are* interactors—not genes. Calling genes "ultimate" dismisses higher-level causality.  
     - **Why it matters:** This is likely your TA’s critique. Using "really" or "ultimately" implies other levels are illusory, contradicting your acceptance of (4)/(5).  
     - **What must give:** Delete "ultimately" in (6). Admit all levels are causally real *in their context* (genes for inheritance, organisms/colonies/species for interaction).  
     - **Cost:** You concede that "bookkeeping" isn’t just practical—it reflects multi-level causality.  

  4. **Tension: (5) vs. (3)**  
     **Severity:** Low (but will be attacked)  
     - **Conflict:** You reject group selection (3) but accept superorganisms (5). Critics will argue eusocial colonies *are* groups, so you’re making an arbitrary distinction.  
     - **Resolution:** Your stance holds if you rigorously define "superorganism." An ant colony has organism-like features: sterility, functional integration, single reproductive "germ line" (queen). This avoids the "averaging fallacy" (3) because colony fitness is measured *holistically* (e.g., colony survival, not average ant fitness).  
     - **Defense Needed:** Preemptively clarify that "group selection" requires *groups as *groups*—not just collections of individuals. Superorganisms bypass this by being interactors (like organisms).  

  5. **Tension: (1) vs. (4)**  
     **Severity:** Low (easily resolved)  
     - **Conflict:** (1) says selection acts on phenotypes, but species selection (4) acts on species-level traits (e.g., mutation rate).  
     - **Resolution:** "Phenotype" can include emergent traits (e.g., a species’ geographic range). Clarify that (1) applies to *organismal* selection, while higher levels have their own phenotypes.  

  ---

  ### **Recommendations to Fix Contradictions**
  - **Revise (2):** *"Genes are the fundamental units of inheritance and long-term adaptation, but selection acts on phenotypes at multiple levels (organisms, superorganisms, species)."*  
  - **Revise (6):** Drop "ultimately" and "causal story is about genes." Replace with: *"The gene’s-eye view and organism’s-eye view are complementary descriptions of the same process, though genes best explain cumulative adaptation."*  
  - **Clarify "Beneficiary":** Genes don’t "benefit"—lineages persist. Avoid Dawkins’ metaphorical language.  
  - **Defend (5):** Cite superorganism criteria (e.g., Hölldobler & Wilson) to show colonies are interactors, not groups.  

  ### **Why Your Anti-Group-Stance Mostly Holds**
  - (3) is solid if you stress the averaging fallacy (most "group selection" is just individual selection in structured populations).  
  - (5) is defensible if you frame superorganisms as *new* interactors via evolutionary transitions (e.g., cells → multicellular organisms → colonies).  
  - (4) is your biggest vulnerability—embrace it as a *distinct* level, not a gene-level phenomenon.  

  Your core insight—that replicators (genes) and interactors (phenotypes) resolve the (1)/(2) tension—is correct. The overstatements in (2) and (6) are the fixable flaws. Prep for attacks on species selection and your use of "really"—those are the weak spots.
