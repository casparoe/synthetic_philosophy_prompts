prompt: |-
  I chair the elections committee of a scholarly society of about 4,000 members, which has always chosen its officers by simple plurality. A reform proposal has split the committee: several members favor instant-runoff voting, several approval voting, one insists on a Borda count, and the treasurer maintains that plurality is fine and any change will confuse the membership. Before we report to the council, I need a written memo recommending a single method for the bylaws revision we will circulate. Please draft it. The memo should put Arrow's impossibility theorem to honest work: what it actually rules out for a choice like ours, whether it applies to each candidate method — approval voting in particular, since it does not ask voters for rankings — and where it is simply silent, so that we neither invoke it as a reason to abandon reform nor misuse it as a knockdown argument against ranked methods. It should then weigh the considerations the theorem does not reach, such as vulnerability to strategic voting under each method, ballot simplicity for a membership that votes by mail, and whether satisfying the Condorcet criterion should matter to us. It should give the treasurer's position a fair hearing rather than dismissing it, and the final recommendation should be concrete enough to become a bylaws clause, with reasoning a committee member who disagrees could engage with rather than merely defer to.
reasoning: |-
  We are drafting a memo for the elections committee of a scholarly society. The society has about 4,000 members and currently uses simple plurality. The committee is split between instant-runoff voting (IRV), approval voting, Borda count, and the status quo (plurality). We must recommend a single method and write a bylaws clause.

   The memo must address Arrow's impossibility theorem honestly: what it rules out, whether it applies to each method (especially approval voting, which does not use rankings), and where it is silent. We must not use Arrow's theorem as a reason to abandon reform or as a knockdown against ranked methods.

   Then, we must weigh other considerations:
   - Vulnerability to strategic voting
   - Ballot simplicity for mail voting
   - Importance of the Condorcet criterion

   We must give the treasurer's position (keep plurality to avoid confusion) a fair hearing.

   The final recommendation should be concrete and include a bylaws clause, with reasoning that committee members can engage with.

   Steps:

   1. Explain Arrow's theorem honestly and how it applies to the candidate methods.
   2. Discuss the other considerations (strategy, simplicity, Condorcet).
   3. Fairly present the treasurer's argument (simplicity, avoiding confusion) and counter it without dismissing it.
   4. Recommend one method with a clear bylaws clause.

   Let's break down:

   I. Arrow's Impossibility Theorem:
      - Arrow's theorem says that no ranked voting system can satisfy all of: 
          (1) Unrestricted domain (any ranking is allowed)
          (2) Non-dictatorship
          (3) Pareto efficiency (if everyone prefers A over B, then B cannot win)
          (4) Independence of irrelevant alternatives (IIA): the relative ranking between two candidates should not be affected by a third candidate.
      - The theorem only applies to voting systems that use ranked ballots and produce a complete ranking of candidates (or at least a winner that is a function of the rankings). 
      - Therefore:
          * It applies to: IRV and Borda count (both use rankings and produce a winner from them).
          * It does not apply to: Approval voting (voters do not rank, they approve or disapprove each candidate) and Plurality (which is a special case of ranked ballots only allowing one candidate to be ranked first, but note that plurality does not use full rankings).

      However, note that Arrow's theorem is about producing a complete social ordering, but we only care about a winner. Some methods (like IRV) are designed to pick a winner and do not necessarily produce a full ranking. But the theorem still applies to the underlying process of aggregating preferences to choose a winner if the method uses ranked ballots and the winner is determined by the rankings.

      Important: The theorem shows that no ranked method can satisfy all four conditions. Therefore, any ranked method (IRV, Borda) must fail at least one. But that does not mean they are bad. It just means we have to choose which properties we are willing to sacrifice.

      Since approval voting does not use rankings, Arrow's theorem does not apply to it.

      Therefore, we can say that Arrow's theorem does not rule out any method per se, but it tells us that if we choose a ranked method, we must accept that it fails one of the conditions (usually IIA). This is not a reason to avoid ranked methods, but it is a reality we must acknowledge.

   II. Other Considerations:

      a. Vulnerability to strategic voting:
          - Plurality: Vulnerable to vote-splitting and the spoiler effect. Voters may avoid voting for their favorite if they think they can't win (strategic voting).
          - IRV: Less vulnerable to spoilers than plurality, but still vulnerable to strategic ranking (e.g., burying a strong opponent). However, it is non-monotonic (in rare cases, ranking a candidate higher might cause them to lose).
          - Approval: Voters may strategically decide which candidates to approve (e.g., not approving a candidate they like who is a frontrunner if they prefer a less popular candidate, or over-approving to prevent a worse candidate). However, approval voting is generally considered to be strategy-resistant in the sense that the optimal strategy is often to approve all candidates above a certain threshold of preference.
          - Borda: Highly vulnerable to strategic voting (e.g., ranking a strong opponent last to lower their score, or ranking a weak candidate higher than one's true preference to avoid helping a strong opponent).

      b. Ballot simplicity for mail voting:
          - Plurality: Very simple (choose one).
          - Approval: Simple (choose as many as you approve).
          - IRV: More complex (rank candidates in order). Voters must understand how to rank and the counting is more complex. However, it is used in many jurisdictions and can be explained.
          - Borda: Also requires ranking, and the scoring might be harder to explain.

      c. Condorcet criterion:
          - A Condorcet winner is a candidate who would beat every other candidate in a head-to-head election.
          - Methods:
              * Plurality: Does not satisfy (a Condorcet winner might not be the most first-choice votes).
              * IRV: Does not satisfy (it is possible for a Condorcet winner to be eliminated early).
              * Approval: Does not necessarily satisfy (it depends on how voters use the approval threshold).
              * Borda: Does not satisfy (it is possible for a Condorcet winner to have a lower Borda score than another candidate).

          However, note that there are methods that do satisfy the Condorcet criterion (like Condorcet methods), but they are not among our candidates. We are only considering IRV, approval, Borda, and plurality.

          The committee must decide if this criterion is important. In a scholarly society, we may prefer a method that elects a candidate who is broadly acceptable and can beat others in head-to-head matchups. But note that a Condorcet winner does not always exist (in cycles).

      d. Other:
          - The treasurer's argument: changing the system may confuse the membership. We must acknowledge that any change requires education and clear instructions. However, the current system (plurality) has known flaws (spoiler effect, vote splitting) that might lead to outcomes that do not reflect the will of the majority.

   III. Recommendation:

      After analysis, I recommend approval voting. Reasons:

          - Arrow's theorem does not apply to approval voting, so we avoid the theoretical impossibility for ranked methods.
          - Approval voting is relatively resistant to strategic voting (compared to Borda and plurality). It encourages voters to express support for all candidates they find acceptable.
          - The ballot is simple: voters only need to mark candidates they approve. This is almost as simple as plurality and much simpler than ranking. For mail ballots, this is a significant advantage.
          - It often satisfies the Condorcet criterion in practice (if voters approve the Condorcet winner and not the others in the right way) but not always. However, it has a good track record of electing broadly acceptable candidates.
          - It eliminates the spoiler effect: multiple similar candidates do not split the vote because a voter can approve both.

          We also note that the treasurer's concern about confusion is valid. However, approval voting is easy to understand: "Vote for any candidate you would be happy with." This is a small step from plurality ("Vote for your favorite") and we can provide clear instructions.

          We reject IRV because of its complexity in counting and potential for non-monotonicity. Also, the ballot is more complex (ranking). For a mail ballot society, the simplicity of approval is a major plus.

          We reject Borda because it is highly vulnerable to strategy and the ballot requires ranking and understanding of the scoring system.

          We reject plurality because it is vulnerable to vote-splitting and spoilers, which can lead to unrepresentative outcomes.

      Bylaws clause:

          "The officers of the society shall be elected by approval voting. Each member may vote for (approve) any number of candidates for each office. The candidate receiving the highest number of approval votes shall be elected. In the event of a tie, the winner shall be chosen by lot."

      We note that this clause is simple and clear.

   IV. Structure of the Memo:

      To: Elections Committee
      From: [Your Name], Chair
      Subject: Recommendation for Voting Method in Bylaws Revision

      I. Introduction
          - Purpose: to recommend a voting method for the society's officer elections.

      II. Arrow's Impossibility Theorem and Its Relevance
          - Brief explanation of Arrow's theorem: it applies to ranked methods and shows that no method can satisfy all four desirable properties. 
          - It does not apply to approval voting and plurality (since plurality does not use full rankings, but note that Arrow's theorem has been extended to some non-ranked systems? Actually, the original theorem is about ranking, but we stick to the original). 
          - Therefore, Arrow's theorem does not rule out approval voting. For ranked methods (IRV, Borda), they must fail one of Arrow's conditions (usually IIA). This is a fact of life for ranked methods, not a reason to avoid them, but it is a consideration that we must be aware of.

      III. Analysis of Candidate Methods
          A. Plurality
              - Currently used, simple ballot.
              - Vulnerabilities: spoiler effect, vote splitting, often elects candidates with less than majority support.
              - Arrow: Not directly applicable? But note that plurality does not use full rankings, so Arrow's original theorem does not apply. However, it fails IIA in practice (adding a candidate similar to A can cause A to lose).

          B. Instant-Runoff Voting (IRV)
              - Uses rankings, eliminates candidates in rounds until one has a majority.
              - Advantages: avoids vote splitting to some extent, majority winner.
              - Disadvantages: complex counting, non-monotonicity, fails Condorcet criterion and IIA (as per Arrow).
              - Arrow: Applies and shows that IRV must fail at least one condition (it fails IIA).

          C. Approval Voting
              - Voters approve any number of candidates.
              - Advantages: simple ballot, resistant to spoilers, encourages broad support.
              - Disadvantages: voters might struggle with the strategy of how many to approve (though the optimal strategy is often to approve everyone above the average utility, and it's robust).
              - Arrow: Does not apply because it does not use rankings.

          D. Borda Count
              - Voters rank candidates, points assigned (n-1 for first, n-2 for second, etc.).
              - Advantages: can reflect strength of preference.
              - Disadvantages: highly vulnerable to strategic voting (e.g., burying opponents), fails Condorcet criterion, complex counting and ballot.
              - Arrow: Applies and shows that Borda fails IIA.

      IV. Other Considerations
          - Strategic Voting: Approval is relatively robust. Borda is worst. Plurality and IRV have known strategic issues.
          - Ballot Simplicity: Approval and plurality are simplest. IRV and Borda require rankings and are more complex.
          - Condorcet Criterion: None of our methods guarantee it. However, approval voting often elects the Condorcet winner if one exists (if voters approve of the Condorcet winner and not the others). IRV sometimes eliminates the Condorcet winner early.

      V. Addressing the Treasurer's Position
          - The treasurer argues that plurality is fine and change may confuse. We acknowledge that change requires effort and education. However, the flaws of plurality are significant and can lead to outcomes that do not reflect the membership's preferences. Approval voting is a minimal change: instead of "vote for one", it becomes "vote for any you approve". We can provide clear instructions and examples to avoid confusion.

      VI. Recommendation
          - We recommend approval voting for its simplicity, resistance to strategic voting, and avoidance of the spoiler effect. It is a practical and robust method that is well-suited for a mail ballot election in a society of our size and type.

          Proposed Bylaws Clause:
              "In elections for officers of the society, each member shall be entitled to vote for (approve) any number of candidates for each office. The candidate receiving the highest number of votes for that office shall be elected. In the event of a tie, the winner shall be chosen by random draw supervised by the Elections Committee."

      VII. Conclusion
          - We believe this method best serves the society's need for a fair, understandable, and robust election system. We encourage the committee to engage with this reasoning and ask questions.

   Let's write the memo accordingly.
answer: |-
  **MEMORANDUM**  
  To: Elections Committee, Scholarly Society  
  From: Chair, Elections Committee  
  Date: October 26, 2023  
  Subject: Recommendation for Voting Method in Bylaws Revision  

  ### Introduction  
  This memo addresses the ongoing debate over reforming our officer election system. After rigorous analysis of four candidate methods—**plurality**, **instant-runoff voting (IRV)**, **approval voting**, and **Borda count**—I recommend adopting **approval voting** for its balance of fairness, simplicity, and resistance to strategic manipulation. Below, I clarify the role of Arrow’s impossibility theorem, evaluate each method against practical criteria, and draft a bylaws clause for implementation. The goal is a system that best serves our 4,000 members, who vote by mail and deserve transparent, robust elections.  

  ### 1. Arrow’s Impossibility Theorem: Honest Context  
  Arrow’s theorem mathematically proves that *no ranked voting system* can simultaneously satisfy four fairness axioms:  
  - **Unrestricted domain** (any voter preferences allowed),  
  - **Non-dictatorship**,  
  - **Pareto efficiency** (if all voters prefer A > B, society must too),  
  - **Independence of irrelevant alternatives (IIA)** (adding/removing a "spoiler" candidate shouldn’t alter the relative ranking of others).  

  **Key implications for our methods:**  
  - **Applies to ranked methods (IRV, Borda)**: Both violate IIA. IRV can eliminate a Condorcet winner (a candidate beating all others head-to-head) due to elimination order. Borda is susceptible to "cloning" (similar candidates splitting points). Arrow’s theorem does **not** mean these methods are flawed beyond use—it means they *must* compromise one axiom. For IRV, IIA is sacrificed; for Borda, it’s often IIA and unrestricted domain (due to strategic ranking).  
  - **Does not apply to plurality or approval voting**: Arrow’s theorem assumes ranked ballots. Plurality (non-ranked) and approval voting (non-ranked, binary choices) fall outside its scope. **Thus, Arrow’s theorem is not a "knockdown" against reform**—it merely clarifies trade-offs for ranked systems.  
  - **Approval voting’s exemption**: Approval asks voters to select "acceptable" candidates without rankings, escaping Arrow’s framework. This is not an inherent advantage but means approval avoids ranked methods’ theoretical constraints.  

  **Takeaway**: Arrow’s theorem **rules out perfect ranked systems** but does not condemn them absolutely. It is **silent** on non-ranked methods (plurality, approval), so we must weigh other factors.  

  ### 2. Critical Practical Considerations  
  #### A. Vulnerability to Strategic Voting  
  - **Plurality**: High vulnerability. Members may abandon their preferred candidate to avoid "wasting" votes on non-viable options ("Duverger’s Law").  
  - **IRV**: Moderate vulnerability. Voters might misrank candidates to block opponents ("burying"), though less severely than in plurality.  
  - **Borda Count**: Extreme vulnerability. Voters can rank weak opponents highly to harm strong ones ("tactical ranking"), creating perverse incentives.  
  - **Approval Voting**: Low vulnerability. Optimal strategy is to approve candidates you prefer above average. While members might "bullet vote" (approve one), this mirrors sincere preferences and is less distortive than plurality’s spoiler effect.  

  #### B. Ballot Simplicity for Mail Voting  
  - **Plurality**: Simplest ("choose one"). Minimal voter confusion.  
  - **IRV**: Complex. Requires understanding rankings and multiple counting rounds. Mail voters may invalidate ballots via incorrect numbering.  
  - **Borda Count**: Complex. Requires full ranking and grasp of point allocation. Challenging for mail ballots.  
  - **Approval Voting**: Very simple. "Approve any candidates you support." Near-plurality ease with greater expressiveness.  

  #### C. Condorcet Criterion  
  A Condorcet winner (beats all others head-to-head) may not exist (e.g., in cyclical preferences), but when one does, it signals broad acceptability.  
  - **Plurality**: Fails—Condorcet winners often lose due to vote-splitting.  
  - **IRV**: Fails—Condorcet winners can be eliminated early.  
  - **Borda Count**: Fails—Condorcet winners may lose to candidates with passionate minorities.  
  - **Approval Voting**: Often satisfies in practice. Voters approving a Condorcet winner will typically elect them.  

  **For our society**: The Condorcet criterion matters as it aligns with scholarly values of consensus. However, no method guarantees it, and approval’s tendency toward consensus makes it acceptable.  

  ### 3. Treasurer’s Position: Fair Hearing  
  The treasurer rightly argues that plurality is simple and avoids confusing members. Stability is valuable, and any change requires clear communication. However, plurality’s flaws—vote-splitting, minority winners, and vulnerability to spoilers—undermine legitimacy. Approval voting minimizes disruption: it expands "choose one" to "choose any you support," a small leap for voters. We can mitigate confusion through:  
  - Clear ballot instructions (e.g., "You may vote for one OR multiple candidates").  
  - Educational materials (e.g., a one-page explainer).  
  - A trial run for minor offices.  

  ### 4. Recommendation: Approval Voting  
  After balancing theory, strategy, simplicity, and fairness, **approval voting** is optimal for our society:  
  - **Escapes Arrow’s constraints** and resists strategy better than IRV/Borda.  
  - **Preserves simplicity**—mail ballots require only checkboxes.  
  - **Reduces vote-splitting** by letting members support multiple candidates.  
  - **Promotes consensus** by electing broadly acceptable candidates.  
  - **Mitigates disruption** with minimal ballot changes.  

  **Proposed Bylaws Clause**  
  > "Officers shall be elected by approval voting. Each voter may select any number of candidates they find acceptable for a given office. The candidate receiving the highest number of approval votes shall be elected. In the event of a tie, the winner shall be selected by lot administered by the Elections Committee."  

  ### Conclusion  
  Arrow’s theorem illuminates trade-offs for ranked methods but does not impede reform. Approval voting best addresses our needs: it avoids the theoretical pitfalls of ranked systems, minimizes strategic risks, and simplifies mail voting while honoring our membership’s desire for fair outcomes. I urge the committee to endorse this method for council review.  

  ---  
  **End of Memo**  
  *This draft invites engagement: Members may challenge approval voting’s handling of preference intensity (a Borda concern) or argue for IRV’s majority guarantees. I welcome debate on these points, but in a society valuing accessibility and practicality, approval’s advantages prevail.*
