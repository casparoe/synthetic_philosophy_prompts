answer: |-
  As someone deeply familiar with cryptographic practice but less so with formal philosophy, you've identified a fascinating and nuanced form of reasoning that is indeed central to your field. This policy doesn't have a single, universally agreed-upon name in philosophy, but it can be understood as a specific type of **heuristic presumption of computational patternlessness**, grounded in practical epistemology rather than metaphysical claims about randomness. Let me unpack that, distinguish it from the neighbors you mentioned, and clarify its structure and limitations.

  The core of this reasoning is a defeasible operational stance: when dealing with a deterministic mathematical object (like a hash output, the digits of π, or the sequence of primes) that *behaves* as if it were the product of independent random trials—meaning no known efficient algorithm can detect or exploit structure within it—we provisionally treat it *as if* it were random for the purpose of analysis, design, or prediction. This is not a claim about its ontological randomness; it’s a pragmatic commitment based on the failure of concerted effort to find structure, coupled with the computational intractability of such a search. Its defeasibility is explicit, as you note: when structure is found (e.g., a hash collision), the presumption is withdrawn for that specific object, and trust shifts to alternatives where the presumption still holds empirically. This differs critically from your three conceptual neighbors.

  First, it is distinct from assuming the object *is* truly random. That would be a metaphysical or physical claim—e.g., that the digits of π are generated by a random process. Your policy makes no such assertion. It treats the object as a fixed, deterministic entity but adopts a methodological fiction ("as if random") because no efficient procedure can discern it from randomness. This is closer to modeling than ontology—like using a Poisson distribution to model traffic flow while knowing cars aren't random particles.

  Second, it diverges from the probabilistic method in combinatorics. The probabilistic method uses randomness *hypothetically* to prove the existence of structures (e.g., showing a random graph almost surely has property P, so some graph must exist with P). Your policy deals with *concrete, fixed instances* (e.g., *this* SHA-256 output) and uses the *appearance* of randomness as a shield against adversarial exploitation. The probabilistic method is a proof technique; your policy is a security heuristic applied to singular objects.

  Third, it is not merely a burden-of-proof default equating absence of evidence with evidence of absence. Such defaults are often fallacious without further support (e.g., "no one has proved ghosts exist, so they don’t"). Your policy has a richer epistemic structure: it leverages the computational effort invested in *searching* for patterns and the failure to find them *despite incentives* (e.g., cryptographic attacks, mathematical curiosity). Crucially, this failure occurs in contexts where we have strong reasons to believe that if a pattern existed, it would be computationally feasible to discover or exploit it, given current knowledge. The presumption isn’t based solely on ignorance but on a track record of successful detection in analogous cases (e.g., broken hashes) and a theoretical framework for intractability. It’s an inference grounded in the history of adversarial scrutiny and computational limits—not just the absence of disproof.

  Is this just an argument from ignorance with better manners? Not quite. The standard argument from ignorance shifts the burden of proof without justification. Your policy is justified by two pillars: (1) **negative empirical track record**—repeated, motivated attempts to find patterns have failed in similar cases, and (2) **computational tractability expectations**—we understand the mechanisms well enough to recognize that certain patterns *should* be detectable or exploitable if present. For example, the presumption for SHA-256 rests on the fact that preimage attacks *have* been found in weaker functions, demonstrating our capacity to detect such flaws, while no such attack succeeds here. This makes it a form of **security through observed resilience**, akin to a stress test. Its epistemic structure is pragmatic: it maximizes safety in adversarial environments by assuming the worst-case scenario (an unpredictable object) until demonstrated otherwise. It misleads predictably in two scenarios: when a pattern exists but is computationally beyond *current* methods (e.g., a novel mathematical insight later reveals structure in primes), or when the threat model evolves (e.g., quantum computing breaks assumptions underpinning the presumption). It also falters if the "effort" to find patterns is misjudged—e.g., if a cryptographic community overlooks an entire class of attacks.

  Since no established term perfectly captures this, I propose calling it **Practical Indistinguishability Presumption (PIP)**. Define it as: *The defeasible policy of treating a fixed deterministic object as functionally equivalent to the output of a random process for specific purposes (e.g., security analysis), justified by persistent failure to computationally distinguish or exploit it despite adversarial incentives and a historical capacity to do so in analogous cases.* PIP excludes your neighbors: it avoids metaphysical randomness claims (unlike ontology), deals with fixed instances not existence proofs (unlike probabilistic method), and requires motivated scrutiny and tractability expectations (unlike bare absence-of-evidence). It is, at heart, a watchful pragmatism—a reasoned wager against hidden structure, disciplined by the possibility of defeat.
