prompt: |-
  Draft the joint statement that would issue from an adversarial collaboration between a semantic externalist and an internalist about meaning, each of whom has spent years arguing over Twin Earth. The document should record: the claims both sides can sign, starting with the stipulations of the case itself — that Oscar and Twin Oscar are molecule-for-molecule duplicates, that the clear, potable liquid filling Twin Earth's rivers and lakes is XYZ rather than H2O, and that nothing inside either man's head distinguishes the two worlds; then the residual disagreements, each phrased so that the side holding it would accept the wording (e.g., about whether there is a determinate fact of what Oscar means by 'water' independent of his environment, or whether Twin Oscar's word refers to anything at all); then the cruxes — I'd expect at least whether sameness of reference requires sameness of underlying stuff or only sameness of superficial behavior, and what follows for psychology if two internally identical subjects can differ in what their words mean. For each crux, include a case both sides agree bears on it, with each side's prediction written down in advance; in particular, have them consider a variant in which one planet has lakes of H2O and lakes of XYZ side by side, inhabited by a single community, and another in which a subject commutes between Earth and Twin Earth for years and later, back home, sincerely asserts that water boils at 100 degrees. Mark any part of their dispute that both would concede is merely verbal — including, if they think so, whether 'meaning' is even the name of what they have been fighting about. Number the agreed claims and use a table for the disagreements.
reasoning: |-
  We are drafting a joint statement from an adversarial collaboration between a semantic externalist (E) and an internalist (I) about the Twin Earth thought experiment. The goal is to outline the areas of agreement, the residual disagreements (each worded so that the respective side accepts the wording), and the cruxes of the dispute with test cases and predictions.

  ### Stipulations of the Twin Earth Case (Agreed Claims)

  Both parties agree on the following:

  1. There exist two planets: Earth and Twin Earth.
  2. Earth and Twin Earth are identical in every respect except for the chemical composition of the liquid that fills their respective lakes, rivers, and oceans. On Earth, this liquid is H₂O. On Twin Earth, it is a different clear, potable liquid with a different chemical composition, which we will call XYZ.
  3. Oscar is a human being living on Earth. Twin Oscar is his molecule-for-molecule duplicate living on Twin Earth. Both are in identical physical states (including brain states) at the time of consideration.
  4. The environment of Earth and Twin Earth is such that the liquid in question is the dominant clear, potable liquid in their respective worlds and is called 'water' by the inhabitants of each planet.
  5. There are no intrinsic differences between Oscar and Twin Oscar that would allow an observer to distinguish them by examining their internal states (e.g., their brains) alone.

  ### Residual Disagreements

  We present the disagreements in a table format. Each side has agreed to the wording of their own position and the other's.

  | Disagreement Topic | Externalist Position (E) | Internalist Position (I) |
  |--------------------|--------------------------|--------------------------|
  | **Determinacy of meaning independent of environment** | There is a determinate fact about what Oscar means by 'water' that depends on his environment: on Earth, 'water' refers to H₂O. This fact is independent of any internal state and is fixed by the causal history of the word's use. | There is no determinate fact about what Oscar means by 'water' that is independent of his internal state and the evidence available to him. The meaning of 'water' for Oscar is fixed by his internal state and his conception of water (as a clear, potable liquid, etc.), and thus Oscar and Twin Oscar mean the same by 'water'. |
  | **Reference of Twin Oscar's word 'water'** | Twin Oscar's word 'water' refers to XYZ, the liquid that plays the water-role on Twin Earth. It does not refer to H₂O because there is no causal connection between Twin Oscar's use of 'water' and H₂O. | Twin Oscar's word 'water' refers to the clear, potable liquid that both he and Oscar are acquainted with, regardless of the underlying chemical structure. Since Twin Oscar has never encountered H₂O, his word 'water' does not refer to H₂O, but it does refer to XYZ. However, the meaning (as an internal state) is the same for both Oscars. |
  | **Psychological implications** | Because the meaning of a term (and hence the content of thought) is determined by the environment, two internally identical subjects (like Oscar and Twin Oscar) can have different thoughts. For instance, when Oscar thinks "Water is wet," his thought is about H₂O, whereas Twin Oscar's corresponding thought is about XYZ. This implies that psychology must take into account external factors (externalism) and not just internal states. | The psychological states of Oscar and Twin Oscar are identical because they are internally identical. Therefore, the content of their thoughts must be the same. When Oscar thinks "Water is wet," he is thinking about the clear, potable liquid he has experienced, and Twin Oscar is thinking about the same (in terms of the properties). The difference in the external world does not change the psychological state, which is determined solely by internal states. |

  ### Cruxes of the Dispute

  We now turn to the cruxes of the dispute. For each crux, we present a test case that both sides agree bears on the issue. Each side's prediction is recorded.

  #### Crux 1: Sameness of Reference Requires Sameness of Underlying Stuff or Only Sameness of Superficial Behavior?

  Both sides agree to consider the following variant:

  **Case 1: Mixed Earth**
  - There is a planet (Mixed Earth) that has two kinds of lakes: some filled with H₂O and others with XYZ. Both liquids are clear, potable, and indistinguishable by ordinary observation. The inhabitants of Mixed Earth use the word 'water' for both. They have not discovered the chemical difference and treat both as the same substance.

  | Position | Prediction |
  |----------|------------|
  | **Externalist (E)** | The word 'water' in Mixed Earth does not have a determinate reference. It might refer to a disjunctive kind (H₂O or XYZ) or to a superficial kind (the set of things that are clear, potable, liquid, etc.). However, if we discover that the community treats them as the same, but there are two distinct underlying kinds, then 'water' would be ambiguous and not refer to a natural kind. |
  | **Internalist (I)** | The word 'water' in Mixed Earth refers to the superficial kind: the clear, potable liquid that is found in lakes and rivers. The meaning is fixed by the internal states of the speakers and the observable properties. Therefore, 'water' refers to both H₂O and XYZ in this context. |

  #### Crux 2: What Follows for Psychology if Two Internally Identical Subjects Can Differ in What Their Words Mean?

  Both sides agree to consider the following variant:

  **Case 2: The Commuter**
  - An individual, Alice, lives on Earth for the first 20 years of her life, using 'water' for H₂O. Then, she moves to Twin Earth and lives there for 20 years, using 'water' for XYZ. She becomes fully integrated into Twin Earth society. Then, she returns to Earth. On Earth, she says, "Water boils at 100 degrees Celsius." What does she mean by 'water'? And what is the content of her thought?

  | Position | Prediction |
  |----------|------------|
  | **Externalist (E)** | When Alice returns to Earth, her word 'water' and the corresponding thought are ambiguous. She has two sets of causal connections: one to H₂O (from her early life) and one to XYZ (from her time on Twin Earth). Therefore, her utterance on Earth might be interpreted as having two possible contents: one about H₂O and one about XYZ. However, if she is back in the Earth environment and interacting with H₂O, the Earth meaning may become dominant again. But at the moment of utterance, it might be indeterminate or disjunctive. |
  | **Internalist (I)** | Alice's word 'water' and her thought are determined by her internal state. She has a concept of water that is built from her experiences with both H₂O and XYZ. But because she has encountered both and learned that they are both called 'water' and have the same superficial properties, her concept is of a superficial kind. Therefore, when she says "Water boils at 100 degrees Celsius," she is referring to the clear, potable liquid that she has experienced in both worlds, meaning both H₂O and XYZ. The content of her thought is the same regardless of the environment at the time of utterance. |

  ### Verbal Disputes

  Both sides acknowledge that part of their disagreement might be verbal. Specifically:

  - **The term 'meaning':** 
    - The externalist uses 'meaning' to refer to the reference (extension) of a term and the way that reference is fixed by the environment.
    - The internalist uses 'meaning' to refer to the internal cognitive state (intension) that determines how the term is used and what it would refer to in any given situation.

  Both agree that if they were to use distinct terms for these concepts (e.g., 'meaning_external' for reference and 'meaning_internal' for the internal state), some of the disagreement would dissolve. However, they also agree that there remains a substantive disagreement about whether the internal state alone is sufficient to determine reference (as the internalist claims) or whether the environment plays an ineliminable role (as the externalist claims).

  - **The term 'thought content':**
    - The externalist holds that the content of a thought (e.g., about water) is determined by the external environment and thus can differ between internally identical individuals.
    - The internalist holds that the content of a thought is determined solely by the internal state and thus must be the same for internally identical individuals.

  Both acknowledge that if they were to use separate terms (e.g., 'broad content' for the externalist and 'narrow content' for the internalist), they might agree that both are real and important, but they would still disagree about which one is the primary object of psychological explanation.

  ### Conclusion

  This joint statement records the points of agreement, the residual disagreements, and the cruxes of the dispute. It also highlights that some aspects of the dispute are verbal, but that substantive disagreements remain about the nature of meaning and thought content.

  Signed,

  [Externalist]
  [Internalist]
answer: |-
  ### Joint Statement: Adversarial Collaboration on Twin Earth  
  **Participants:**  
  - **Semantic Externalist (E)**: Holds that meaning and reference are determined by external environmental factors.  
  - **Semantic Internalist (I)**: Holds that meaning and reference are determined solely by internal cognitive states.  

  #### I. Agreed Stipulations  
  Both parties endorse the following foundational claims about the Twin Earth scenario:  
  1. **Molecule-for-Molecule Duplication**: Oscar (Earth) and Twin Oscar (Twin Earth) are intrinsic physical duplicates, sharing identical brain states, sensory inputs, and functional organization at the time of analysis.  
  2. **Environmental Difference**: The liquid in Earth’s lakes and rivers is H₂O, while Twin Earth’s liquid is XYZ. Both liquids are macroscopically indistinguishable (clear, potable, etc.) under normal conditions.  
  3. **Internal Indistinguishability**: Nothing "inside the head" (e.g., brain structure, qualia, or introspective evidence) differentiates Oscar’s and Twin Oscar’s use of the word "water."  
  4. **Linguistic Practice**: Both Oscar and Twin Oscar use "water" to refer to the dominant clear, potable liquid in their respective environments.  
  5. **Metaphysical Neutrality**: The scenario assumes no pre-theoretic bias toward internalism or externalism.  

  #### II. Residual Disagreements  
  The table below summarizes key disagreements, with wording acceptable to each side.  

  | Issue | Externalist (E) Position | Internalist (I) Position |  
  |-------|---------------------------|---------------------------|  
  | **Determinacy of meaning independent of environment** | There is a determinate fact about what Oscar means by "water" that depends on his causal-historical environment: on Earth, "water" refers to H₂O, irrespective of internal states. | There is no fact about what Oscar "means" by "water" independent of his internal state; meaning is fixed by cognitive criteria (e.g., "water" as "clear, potable liquid"), which are identical for both Oscars. |  
  | **Reference of Twin Oscar’s "water"** | Twin Oscar’s word "water" determinately refers to XYZ, the liquid that causally regulates its use on Twin Earth. It does not refer to H₂O, which plays no role in Twin Oscar’s linguistic community. | Twin Oscar’s word "water" refers to the observable kind (clear, potable liquid) present in his environment. Since XYZ satisfies this criterion, "water" refers to XYZ, but the *meaning* (as a cognitive property) remains identical to Oscar’s. |  
  | **Psychological implications of meaning differences** | Psychology must account for broad content: Oscar and Twin Oscar have different thoughts (e.g., "Water is wet" is about H₂O for Oscar, XYZ for Twin Oscar) despite internal identity. | Psychology concerns narrow content: Oscar and Twin Oscar share identical thoughts (e.g., "Water is wet" expresses the same cognitive state), as mental content supervenes on internal properties alone. |  

  #### III. Cruxes of the Dispute  
  For each crux, both parties agree on a test case and provide advance predictions.  

  **Crux 1: Does sameness of reference require sameness of underlying substance, or is superficial behavior sufficient?**  
  - **Test Case (Mixed Earth)**: A planet with lakes of H₂O and XYZ side-by-side. Inhabitants use "water" for both liquids (which are macroscopically identical) and are unaware of the chemical difference. There is one linguistic community.  
    | **Position** | **Prediction** |  
    |--------------|----------------|  
    | **Externalist (E)** | Reference is indeterminate: "water" fails to pick out a natural kind. It may refer ambiguously to H₂O, XYZ, or a disjunction, but not to a unified substance. |  
    | **Internalist (I)** | Reference is determinate: "water" refers to the superficial kind (clear, potable liquid), encompassing both H₂O and XYZ. Sameness of observable behavior suffices. |  

  **Crux 2: Can internally identical subjects differ in the meaning of their words, and what follows for psychology?**  
  - **Test Case (The Commuter)**: Subject lives 20 years on Earth (calling H₂O "water"), then 20 years on Twin Earth (calling XYZ "water"). After returning to Earth, they sincerely assert, "Water boils at 100°C."  
    | **Position** | **Prediction** |  
    |--------------|----------------|  
    | **Externalist (E)** | The commuter’s "water" refers ambiguously to H₂O or XYZ. Their thought is unstable: in Earth’s context, it likely refers to H₂O, but the Twin Earth usage creates a "switch" or hybrid content. |  
    | **Internalist (I)** | The commuter’s "water" refers to the internal concept (clear, boiling liquid at 100°C). The assertion is true if H₂O boils at 100°C, regardless of past environments, as meaning is fixed cognitively. |  

  #### IV. Verbal Disputes  
  Both parties concede the following disagreements are (at least partly) verbal:  
  - **The term "meaning"**: E uses "meaning" to denote *reference* (e.g., "water" refers to H₂O). I uses "meaning" to denote *cognitive content* (e.g., "water" as mentally represented). Both agree they are debating distinct phenomena.  
  - **"Determinate fact"**: E’s "determinacy" relies on external causal relations; I’s relies on internal criteria. The dispute reduces to whether "meaning" privileges environment or cognition.  
  - **"Reference"**: For E, reference is world-involving; for I, it is descriptivist (e.g., "whatever fits the observable profile").  
  - **Core Issue**: Both agree their decades-long debate conflates two questions:  
    - *What fixes extension?* (E: environment; I: internal criteria).  
    - *What is the object of psychological inquiry?* (E: broad content; I: narrow content).  
    They concur that "meaning" is not a univocal target and that future work should disentangle these dimensions.  

  ---  
  **Signed,**  
  *The Externalist*  
  *The Internalist*  
  *Date: 22 October 2023*  

  ---  
  **Annex: Collaborative Notes**  
  - **Methodology**: Predictions for test cases are archived for post-hoc analysis.  
  - **Progress**: Both parties acknowledge that clarifying verbal differences has reduced perceived disagreement by ≈40%.  
  - **Pending**: Further collaboration on "The Commuter" case using fMRI to study neural correlates of concept retrieval.
