answer: |-
  Below is a comprehensive design for your 90-minute seminar activity, structured to evoke the demandingness objection experientially. The activity uses real stakes (your seminar's party budget) and forces students to confront the tension between personal/group interests and moral demands through incremental decision-making. Nonlinear elements (matched funding and quantity discounts) complicate simple cost-benefit reasoning, mirroring real-world charitable giving. I'll outline the full activity, then address predictable pitfalls, limitations, and a debrief plan.

  ---

  ### **Activity Title**: The Marginal Compromise  
  **Objective**: Make students *feel* the demandingness objection by forcing them to defend cutoffs in resource allocation, revealing how non-consequentialist justifications arise when faced with high stakes.  

  ---

  ### **Materials**  
  1. **Charity Price List** (1 per student):  
     - **Core Item**: Bednets cost $5 each. Each net protects 2 people for 3 years.  
       - *Impact*: 50 nets save 1 life (statistic based on [Against Malaria Foundation](https://www.againstmalaria.com) data).  
     - **Nonlinearities**:  
       - **Matched Funding**: If total donations from *all committees combined* reach $200, every additional dollar is matched 1:1 until $400 total (e.g., $250 total donation → $300 after match).  
       - **Quantity Discount**: If a *single committee* donates ≥$100, their nets cost $4.50 each (10% discount).  
     - *Visual design*: Include a graph showing marginal impact per dollar (flat below $200, spikes in matched range, plateaus after $400).  

  2. **Budget Cards** (1 per student/committee):  
     - "Your committee controls $X of the seminar’s $500 party fund."  
     - **Party Value Props**: "This funds food/drinks for our end-of-term celebration—a shared ritual to reflect on our work."  

  3. **Allocation Sheets**:  
     - **Private Sheet**: "My name: ______. I would donate $______. Why? ______."  
     - **Committee Sheet**: "Committee: ______. We donate $______. Why? ______."  

  4. **Auditor Script Cards** (3 cards, 1 per auditor):  
     - "Your only question: *'Why stop at $X? For $Y more ($Y = cost of next marginal item), you could save [impact]. Why not?'*"  

  5. **"Next Term" Cards** (optional, for diachronic gesture):  
     - Small cards distributed during debrief: "Next term, you inherit this choice again with a new budget. What would you change?"  

  ---

  ### **Roles**  
  - **Students**: Allocate funds privately → in committees → defend decisions.  
  - **Instructor**: Facilitate timing, clarify rules, observe.  
  - **Auditors** (3 students, rotated): Challenge cutoffs neutrally using the script.  

  ---

  ### **Rules**  
  1. **Total Budget**: $500 (real party money).  
  2. **Committee Split**: Divide 15 students into 3 committees of 5. Each controls $167 (one has $166).  
  3. **Private Allocation**: Done silently—no discussion.  
  4. **Committee Consensus**: Must agree on one donation amount.  
  5. **Audit**: Auditors *only* ask the scripted question. Committees *must* respond.  

  ---

  ### **Timeline (90 Minutes)**  
  | **Phase**          | **Time** | **Steps**                                                                 |  
  |---------------------|----------|---------------------------------------------------------------------------|  
  | **Setup (5 min)**   | 0-5      | Distribute materials. Explain: "This is real money. Nonlinearities mean your choices change marginal impact. Committees control equal shares. Audit focuses on *why stop here*." Emphasize: "No right answers—explore your reasoning." |  
  | **Private Allocation (10 min)** | 5-15    | Students decide alone: "Write your donation and reason." Collect sheets. |  
  | **Committee Allocation (25 min)** | 15-40   | Form committees. Discuss/decide consensus donation. Record reason.       |  
  | **Audit (30 min)**  | 40-70    | Each committee states donation. Rotating auditor challenges their cutoff using the script. Committee defends. Repeat for all 3 committees. |  
  | **Debrief (20 min)** | 70-90   | Guided discussion mapping choices to theory (see below). End with "Next Term" cards. |  

  ---

  ### **How Nonlinearities Complicate "Every Dollar Saves a Life"**  
  - **Matched Funding**: Creates a "kink" in marginal utility. Students must reason:  
    - *Below $200*: Low impact ($5/net).  
    - *$200–400*: High impact ($2.50/net after match).  
    - *Above $400*: Low impact again.  
    **Problem**: Donating $199 wastes matching potential—but reaching $200 requires coordination across committees.  
  - **Quantity Discount**: Encourages committees to "pool" donations ($100+ triggers discount), but risks free-riding if others fund the threshold.  
  - **Result**: Students can't default to flat utilitarianism. They must strategize about thresholds, making cutoffs more defensible—and harder to justify to a "child under the net."  

  ---

  ### **Debrief Plan: Questions to Name the Stopping Place**  
  **Goal**: Avoid lecturing. Use student responses to map positions to theory.  
  1. **Elicit Reasons** (5 min):  
     - "What reasons did you hear for cutoffs? List them." (Write on board: e.g., "We deserve the party," "Not our responsibility," "We did enough.")  
  2. **Confront the Net** (5 min):  
     - "Pick one reason. Would it matter to someone dying of malaria? Why/why not?"  
  3. **Map to Theory** (10 min):  
     - **Satisficing**: "Did anyone say, 'We hit a "good enough" threshold'? What made it 'enough'?"  
     - **Agent-Centered Prerogatives**: "Who argued, 'It’s okay to prioritize ourselves *sometimes*'? How is that different from selfishness?"  
     - **Threshold Views**: "Did the matched funding change your cutoff? Why value thresholds?"  
     - **Integrity/Objections**: "Did donating less feel like betraying yourself? Or did donating more feel like self-sacrifice?"  
     - **Costs in Calculus**: "Did anyone weigh the party’s happiness against lives saved? How?"  
  4. **Diachronic Gesture** (5 min): Distribute "Next Term" cards. "If you faced this *every term*, would your cutoff change? Why?"  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Diffusion of Responsibility in Committees**:  
     - *Why*: Groups dilute accountability ("someone else will donate").  
     - *Fix*: Assign roles (e.g., "facilitator," "charity advocate," "party defender"). Require unanimous consensus.  
  2. **"Full Saint" Student (Donates Everything)**:  
     - *Why*: Idealism or performance. Can derail discussion if not engaged.  
     - *Fix*: In audit, ask: "Would you donate *your own* money? Why is this different?" Normalize it as one valid response.  
  3. **Challenging Price List Realism**:  
     - *Why*: Defense mechanism to avoid discomfort.  
     - *Fix*: Pre-empt: "Assume these numbers are accurate for this exercise. We’re probing *ethical* tension, not empirical debates." Redirect: "If the numbers *were* real, would your cutoff hold?"  

  ---

  ### **Limitation: The Diachronic Problem**  
  - **Issue**: The demandingness objection’s core is *lifelong recurrence*—e.g., "Must I donate *every* time I have spare cash?" A one-off choice can’t replicate this exhaustion.  
  - **Gesture**: Use **"Next Term" cards** in debrief:  
    - Students write how they’d approach a recurring choice.  
    - Ask: "Would your cutoff drop over time? Why?"  
  - **Honest Assessment**: This is only a gesture. It hints at repetition but can’t simulate chronic moral burden. For deeper engagement, assign a reflection essay: "Describe how *daily* demands might change your view."  

  ---

  ### **Instructor Notes**  
  - **Stakes**: After class, *actually* allocate funds based on committee averages (e.g., total donations = mean of 3 committee decisions). Follow through for credibility.  
  - **Why This Works**: Students confront demandingness viscerally when auditors force them to verbalize indefensible cutoffs. Nonlinearities prevent "easy" utilitarianism, exposing how agent-relative justifications emerge.  
  - **Flex Tip**: If audits run long, skip one committee or shorten defenses. Prioritize debrief.  

  This design balances experiential tension with philosophical rigor, using real stakes to make the abstract objection "feel" urgent. The nonlinearities and audit create a microcosm of moral decision-making, while the debrief ensures students recognize their reasoning in canonical theory.
