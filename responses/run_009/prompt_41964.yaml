  Audit Protocol:
  - The auditor will ask: "You donated $X. According to the price list, the next [describe marginal item, e.g., $5 for a bednet] could [describe impact]. Why didn't you donate that extra amount? What stopped you?"

  Final Note: The actual spending will be the average or the mode of the committee decisions? Or we can let the committees keep their own allocation? But then the party would be uneven? Alternatively, we can have the entire class vote on the final allocation? But that complicates. Let's stick to the committee allocations being hypothetical for the party? Or we can use the committee phase as a discussion and then have the entire class decide? That might be too long. Alternatively, we can say that the actual donation will be the average of the committee donations? But that might feel artificial.

