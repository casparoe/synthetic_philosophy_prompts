  We are designing a 90-minute activity for an upper-level seminar on ethical theory to make the demandingness objection to consequentialism felt by the students. The activity involves allocating a real discretionary budget (for an end-of-term party) to an effective charity (with a price list including bednets and nonlinearities like matched funding and quantity discounts). The goal is to have students confront the demandingness objection through personal and group decision-making, and then debrief by mapping their choices to standard philosophical responses without lecturing.

  Activity Design:

  Title: "The Net Gain: Allocating Scarce Resources"

  Objective: To create a felt experience of the demandingness objection by forcing students to decide how much of a shared, real resource (the party budget) to donate to a charity that saves lives, with the tension between personal/group interests and moral demands.

  Materials:
  1. A one-page "Charity Price List" (see details below).
  2. A "Party Budget Card" for each student and each committee, indicating the total discretionary budget (e.g., $500). Also, a separate "Party Menu" showing what the party could provide (e.g., pizza, drinks, cake) and their costs.
  3. A "Committee Allocation Sheet" for each small group.
  4. A timer.

  Charity Price List Details:
  - Charity: "Bednets for Life"
  - Standard cost: $5 per bednet (each bednet protects 2 people for 3 years, and on average prevents 1 case of malaria for every 2 bednets distributed, with a life saved for every 50 bednets due to reduced mortality).
  - Nonlinearities:
    - Matched funding: If the total donation from the class (across all committees) reaches $200, then every dollar donated above $200 is matched by a partner (so $1 becomes $2 for the charity) until $400 is reached (so the matched funding applies for donations between $200 and $400, effectively doubling the impact in that range).
    - Quantity discount: If a single committee donates $100 or more, they get an extra 10% in bednets (so $100 would buy 110 bednets, or about $4.55 per bednet).

  Party Budget Card:
  - Total budget: $500 (for the whole class, but note: the activity will have multiple committees so we must decide how to split the budget initially. Alternatively, we can have the whole class start with the entire $500, but then we break into committees to allocate a portion. Let's adjust: Each committee will be given a portion of the total. For simplicity, we can split the $500 equally among 3 committees of 5 students each. So each committee gets $166.67, but we will round to $167 for each of three committees, totaling $501. Alternatively, we can have the entire class as one group for the initial private allocation and then break into committees for the next round? But the original design says: first private, then committees. We'll adjust as follows.)

  Revised Budget Flow:
  - The total budget is $500.
  - In the private round: each student is given a hypothetical share? But the money is real and for the party. Alternatively, we can do:
    - Private round: Each student is given an imaginary $100 (or a portion) to allocate privately? But that might feel fake. Alternatively, we can have the entire class budget of $500, and each student privately writes down how much they would allocate to the charity and how much to the party. Then we average? But that might be messy.

  Let me restructure the rounds:

  Round 1: Private Allocation
    - Each student is given a worksheet. They are told: "The class has a total of $500 for the end-of-term party. Imagine you are the sole decision-maker. How much of the $500 would you allocate to the charity, and how much would you keep for the party? Write down the amount and your reason for stopping at that amount."

  Round 2: Committee Allocation
    - Form 3 committees of 5 students each. Each committee is given $167 (one committee gets $166 to make $500 total) and must decide as a group how much of their $167 to donate and how much to keep for their share of the party. They must reach a consensus and write down the amount and the reason for their cutoff.

  Round 3: Audit
    - Each committee presents their allocation. Then, a rotating auditor (a student from another committee) is assigned to each committee. The auditor's role is to challenge the committee's cutoff by pointing to the next marginal item on the charity price list that the committee did not fund and asking: "Why did you stop at $X and not donate $Y more? Look at what that extra $Y could have done (using the price list)." The committee must defend their decision.

  Timeline (90 minutes):

  1. Introduction (10 minutes)
     - Explain the activity: The class has a $500 budget for the end-of-term party. They can choose to donate some or all of it to a highly effective charity that provides bednets to prevent malaria. The charity has a price list with some special features (matched funding and quantity discount) that make the impact nonlinear.
     - Distribute the Charity Price List and Party Budget Card (with Party Menu) to every student. Also, give each student a Private Allocation Worksheet.

  2. Private Allocation (10 minutes)
     - Each student works alone to decide how much of the $500 they would donate if they were the sole decider. They write down the amount and a brief reason.

  3. Committee Formation and Allocation (25 minutes)
     - Divide students into 3 committees (5 students each). Each committee is given $167 (or $166 for one) and must decide collectively how much to donate. They have 15 minutes to discuss and reach a consensus. They record their decision and the reason for their cutoff on the Committee Allocation Sheet.

  4. Audit Phase (30 minutes)
     - Each committee reports their donation amount and reason. (5 minutes)
     - Assign an auditor (a student from a different committee) to each committee. The auditor will challenge the committee's cutoff by pointing to the marginal impact of the next dollar (using the price list) and asking why they didn't donate more. (15 minutes: 5 minutes per committee)
     - Rotate so that each committee is audited once.

  5. Debrief (15 minutes)
     - Lead a discussion mapping the students' decisions and reasons to philosophical concepts without lecturing. Use questions to draw out their reasoning and connect it to the demandingness objection and standard responses.

  Debrief Plan:
  - Start by asking: "What reasons did you give for your cutoff in the private round? And in the committee round?"
  - Then: "When the auditor challenged you, what did you appeal to? How did it feel to defend your decision?"
  - Then: "Let's list the reasons we heard on the board." (Write them down: e.g., "We need a party to celebrate," "It's our money," "We can't give everything," etc.)
  - Then ask: "Which of these reasons would matter to a child who might get malaria without a bednet? Would they accept that the party is more important than their health? Why or why not?"
  - Then connect to theory: "In ethical theory, how might we categorize these reasons? For instance, when someone says 'We are not saints,' what kind of ethical view does that resemble?" (Wait for answers; if none, prompt: agent-centered prerogatives? The integrity objection? Satisficing?)
  - Continue: "And when you considered the matched funding or the discount, how did that affect your reasoning? Did it make you want to give more? How does that relate to consequentialist reasoning?" (Here, they might see that the nonlinearity made the marginal dollar more effective at some points, so they had to reason about where to stop to maximize impact per dollar. This complicates the simple 'every dollar saves a life' because now the impact per dollar varies.)

  Handling Predictable Problems:

  1. Diffusion of responsibility in committees:
     - How to handle: Assign roles within the committee (e.g., facilitator, recorder, timekeeper) to ensure everyone participates. Also, during the debrief, ask each committee member to share their personal view if it differed from the group.

  2. A student going "full saint" (donating everything):
     - This is a valid position. In the audit, the auditor might ask: "Why did you donate everything? What about the party?" The student might say the charity is more important. Then in debrief, note that this represents a consequentialist who accepts the demand. But also explore: How did the committee react if one member was a saint? Did they compromise? This can lead to discussion of whether we are required to be saints.

  3. Challenging the reality of the price list:
     - How to handle: Acknowledge that in real life, effectiveness can be uncertain, but for this activity, we are taking the charity's figures at face value. Emphasize that the purpose is to explore the ethical dilemma, not to audit the charity. If a student persists, note that the demandingness objection arises even if the charity is effective, because the core issue is the sacrifice required.

  What the Activity Cannot Reproduce: The Diachronic Nature
     - The real demandingness objection is that the demands recur over a lifetime. This activity is a one-off. We can gesture to repetition by:
       - Adding a "Next Term" card: At the end, tell students that next term, the same budget will be available again and they will face the same decision. How would that change their reasoning? (But note: we are not actually carrying over.) This is only a gesture.
     - Alternatively, in the debrief, ask: "What if every time we had a party, we faced this choice? What if every time you had spare money, you had to decide whether to donate? How would that feel?"

  Honestly, the activity cannot fully reproduce the lifelong aspect. The gesture is to raise the question in the debrief and let them imagine the repetition.

  Full Materials:

  Charity Price List:

  Bednets for Life
  - Our mission: To distribute insecticide-treated bednets in malaria-endemic regions to prevent malaria.
  - Impact: Each bednet costs $5 and protects 2 people for 3 years. On average, for every 2 bednets distributed, we prevent one case of malaria. For every 50 bednets, we save one life (because severe malaria can be fatal, and bednets reduce transmission).

