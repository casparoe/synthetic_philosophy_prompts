  1. Matched Funding: If the total donation from this class reaches $200, then every additional dollar donated (above $200) will be matched by a generous partner until we reach $400 in matched funds. This means that for every dollar you donate in the matched funding range, we get $2 (so twice the impact). The matched funding is only triggered if the total reaches at least $200.

     Example: If the class donates $250, then the first $200 is not matched, but the next $50 is matched, so the charity receives $200 + ($50 * 2) = $300.

  2. Quantity Discount: If a single committee (your small group) donates $100 or more, then we can give you a 10% discount on the bednets you buy with that donation. This means that with $100, you would get 110 bednets (instead of 100) because we can bundle your order with others.

