prompt: |-
  I keep needing to pick a "reference class" to estimate how likely something is, and I've noticed I have pretty firm gut feelings about which class is the right one in each case, even though I can't state the rule behind them. My brother says there is no rule and I'm just doing vibes, so I want to dump my verdicts on you and see if there's a principle that captures them — and, where it can't, tell me which of my verdicts has to go.

  Here they are. Whether my startup dies within three years: the right class is seed-funded startups in our sector over the last decade — not "all new businesses" (that includes corner stores and restaurants) and definately not "all human endeavors." My own divorce risk: I want to condition on everything, married at 30 or later, both college-educated, no kids yet, how our parents' marriages turned out — the class can get tiny; even if it shrinks to a couple dozen couples I trust it more than the national rate. Whether my flight tomorrow is late: I'm happy with the airline's on-time percentage for this exact route this season, and it would be silly to further adjust for "I've personally had bad luck with flights this year." But then my recently divorced friend swears the right class for him was "married men whose wives have a lot of close male friends at work," which is way narrower than "all married men," and I think that's nuts — even though by my own "narrower = more informative" logic it should be great. Similarly, I'll happily use "people my age who exercise as much as I do" for my life expectancy, while I'd roll my eyes at someone using "people who share his zodiac sign," and I can't articulate the difference, since his class is narrower than mine.

  The case I keep flip-flopping on: my doctor says my ten-year risk of a particular condition is about 6% using patients matched to me on age, weight, family history, and a couple of blood markers, versus about 9% using all patients of my age and sex. The matched group is only a few hundred people. I honestly can't decide whether 6 or 9 is "my" number, and it matters for whether I take an annoying preventive medication. Related question: when two defensible classes give wildly different answers — say "startups founded by first-time founders" versus "startups in my sector" for failure rates — is there any principled way to pick between them or combine them, or is that just the point where statistics shrugs? So: is there one principle behind all my verdicts, something about which features belong in the class and which are noise, and if not, which verdict would you overturn first? And I'm curious what the principle predicts for a case I haven't thought through: whether I'll like a restaurant I've never been to — am I in the class of "people whose ratings have matched mine on past restaurants," or "people my age in my neighborhood," and does your principle give a clear answer there?
reasoning: |-
  Hmm, the user is struggling with reference classes for probability estimation. They've listed several scenarios where their intuition picks a reference class, but they can't articulate a consistent rule. Their brother dismisses it as "vibes," so they want to know if there's an underlying principle or if some of their intuitions are wrong.

  First, let's break down their examples. For their startup, they prefer seed-funded startups in their sector over "all new businesses" or "all human endeavors." That makes sense because sector and funding stage are causally relevant to success. For divorce risk, they condition heavily on demographics like age at marriage, education, and parental marriage history. Again, these are likely causal factors. But then they reject their friend's hyper-specific class about wives' male friends, even though it's narrow. Why? Probably because that factor seems like noise or superstition rather than a causal driver.

  The flight delay case is interesting. They accept the airline's route-specific data but reject adjusting for personal bad luck. Personal luck isn't a stable factor; it's likely coincidence. For life expectancy, exercise is causal, but zodiac signs aren't. The doctor case is tricky—blood markers might be causal, but with a small sample, the estimate could be noisy. 

  The key pattern seems to be causal relevance versus spurious correlation. Features that directly influence the outcome should be included, but narrow classes based on irrelevant factors introduce noise. The friend's "wives' male friends" class is too specific without evidence it's causal. Zodiac signs are irrelevant. 

  For the restaurant example, matching based on past ratings makes more sense than demographics because taste is personal and not necessarily tied to age or location. People with similar past preferences are more likely predictors than neighbors. 

  So the principle is: include factors that are causally relevant or mechanistically explanatory for the outcome. Avoid factors that are coincidental or superstitious. When two classes conflict, prefer the one with stronger causal links. If both are defensible, average them or seek more data. 

  For the doctor case, if the blood markers are known risk factors, 6% is better despite the smaller sample. But check if the sample is representative. For the startup, if "first-time founder" is a known risk, it should be included; otherwise, sector might dominate. 

  The user needs to overturn their dismissal of the friend's class only if there's evidence that spousal friendships causally affect divorce. Otherwise, their skepticism is justified. The flip-flopping in the medical case is understandable—small samples are tricky, but causal relevance should win if the factors are valid.
answer: |-
  Your intuitions are mostly consistent with a **causal relevance principle**, not just "vibes" or arbitrary narrowness. The core idea: **a feature belongs in your reference class if (and only if) it's *causally relevant* or *mechanistically explanatory* for the outcome, not just correlated.** Features that don't plausibly *cause* or *explain* the outcome risk introducing noise or bias, even if they make the class narrower. Let's break it down:

  ### Your Verdicts & The Causal Relevance Principle
  1.  **Your Startup Success:**
      *   **Your Class:** Seed-funded startups in your sector → **GOOD.** Funding stage and sector directly impact resources, competition, market fit, and growth potential (causal factors).
      *   Rejecting "all new businesses": ✅ Correct. A corner store's success depends on foot traffic/local reputation; a SaaS startup depends on VC/tech adoption. Different causal mechanisms.
      *   Rejecting "all human endeavors": ✅ Correct. Wildly different mechanisms.

  2.  **Your Divorce Risk:**
      *   **Your Class:** Married at 30+, college-educated, no kids, parents' marriages → **GOOD.** These are strongly linked to causal factors: maturity, financial stability, communication skills, conflict resolution models, life-stage compatibility, and potential intergenerational patterns.
      *   Rejecting the national rate: ✅ Correct. National rate includes vastly different socioeconomic groups, marriage ages, cultural norms, etc., with different causal pressures.

  3.  **Your Flight Delay:**
      *   **Your Class:** Airline + Exact Route + Season → **GOOD.** These directly determine operational factors: specific aircraft schedules, crew logistics, typical weather patterns on that route, airport congestion at those times (causal mechanisms).
      *   Rejecting "your personal bad luck": ✅ Correct. Past luck is almost certainly coincidence, not a causal factor influencing tomorrow's specific flight operations. It's noise, not signal.

  4.  **Your Life Expectancy:**
      *   **Your Class:** Age + Exercise Level → **GOOD.** Age is the dominant biological risk factor. Exercise directly impacts cardiovascular health, metabolic function, inflammation, etc. (clear causal mechanisms).
      *   Rejecting Zodiac Sign: ✅ Correct. No plausible causal mechanism links star positions at birth to longevity decades later. Correlation (if any) is coincidental noise.

  5.  **Your Friend's Divorce Risk (The Anomaly):**
      *   **His Class:** "Married men whose wives have a lot of close male friends at work" → **VERDICT TO OVERTURN (Generally).** You're right to be skeptical.
          *   *Why it fails Causal Relevance:* While jealousy/infidelity *can* be a cause of divorce, simply having close male friends is not inherently causal. It depends entirely on context: the nature of the friendships, the couple's trust levels, communication, etc. *Using this alone assumes a specific causal mechanism (jealousy/infidelity) that isn't necessarily present.* It's an *indicator* that *might* correlate with trouble for *some* couples under *some* circumstances, but it's not reliably causal *itself*. It risks being a "just-so" story fitting a desired narrative rather than a robust predictor.

  ### Resolving Your Flip-Flops & Conflicts

  1.  **The Doctor's Estimate (6% vs. 9%):**
      *   **Principle Applied:** Are the blood markers/family history *causally relevant* to the disease mechanism? If yes (which they overwhelmingly are for most conditions - e.g., genetic markers, inflammatory markers, lipid profiles), **the 6% estimate from the matched group is better**, *despite* the smaller sample size. Smaller N increases *uncertainty* (the range around 6% is wider), but the *central estimate* is more accurate *if the matching factors are causal*.
      *   **Action:** Ask your doctor: "How strong is the established causal link between these specific blood markers/family history and this disease? Was the model validated?" If the answer is "strong" and "yes," lean towards 6% but understand the uncertainty. If the links are weak or the model untested, 9% might be safer. **The causal relevance principle favors the 6% estimate if the factors are genuinely mechanistic.**

  2.  **Conflicting Classes (Startup: First-time Founders vs. Sector):**
      *   **Principle Applied:** Statistics doesn't inherently shrug. You need to assess:
          *   **Causal Strength:** Is founder experience *itself* a major causal factor (e.g., through network, avoiding rookie mistakes) independent of sector? Or is sector dominance so strong (e.g., success rates vary wildly by sector regardless of founder experience) that it swamps the founder effect? Research often shows both matter.
          *   **Data Availability & Quality:** Which class has more reliable data?
          *   **Combining:** A principled way is **multilevel/hierarchical modeling.** This estimates the overall failure rate *while* allowing it to vary based on both sector *and* founder experience, using data from all startups to partially inform estimates within smaller groups (e.g., "first-time founders in SaaS" gets informed by data from all SaaS startups and all first-time founders). If you lack the data for this, a weighted average based on your assessment of causal importance is better than picking arbitrarily.

  ### The Restaurant Test Case
  *   **Principle Applied:**
      *   **"People whose ratings matched mine on past restaurants":** ✅ **STRONG.** Taste is highly personal. If someone has reliably shared your preferences in the past, it strongly suggests shared causal mechanisms in how you experience food (palate sensitivity, flavor preferences, value criteria). This is causally relevant.
      *   **"People my age in my neighborhood":** ⚠️ **WEAKER.** Age might correlate *mildly* with taste (e.g., spice tolerance) but isn't strongly causal. Neighborhood might correlate with income/price sensitivity or exposure to certain cuisines, but it's indirect. The causal link to *your specific taste* is much weaker than shared past ratings.
  *   **Verdict:** The causal relevance principle strongly favors using the class defined by **matching past ratings** for predicting whether *you* will like a restaurant. Neighborhood/age might be secondary factors if the "taste twin" data is sparse, but they are far less predictive.

  ### Conclusion

  *   **The Principle:** **Prioritize features for your reference class that have a plausible *causal* or *mechanistic* link to the outcome you're predicting.** Narrowness is beneficial *only if* it captures genuinely relevant causal factors. Narrowness based on irrelevant or superstitious features (zodiac, "bad luck," overly specific non-causal correlations like your friend's example) is harmful.
  *   **Verdicts to Keep:** Startup sector/funding, Divorce demographics, Flight route/airline/season, Life expectancy (age/exercise), Rejecting zodiac & personal luck.
  *   **Verdict to Overturn:** Your friend's "wives with male friends" class is likely bad *unless* he has extraordinary evidence it's a robust causal factor *independent* of trust/communication (which it probably isn't).
  *   **Handling Conflicts:** Prefer the class with stronger causal factors. If both factors seem causal (like founder experience and sector), seek ways to combine data (hierarchical models) or weight estimates based on your understanding of their relative importance.
  *   **The "Vibes":** Your gut feelings likely reflect an unconscious understanding of causality. You're recognizing that corner stores and SaaS startups *work differently*, that age/exercise affects biology, that a specific flight's mechanics matter more than your personal history. It's not just vibes; it's latent causal reasoning. Your brother is partly wrong.

  **For your doctor's case:** If the biomarkers are known causal risk factors, trust the 6% as your best *point estimate*, but ask about the *confidence interval* (e.g., "Based on this group size, could my true risk reasonably be as high as 8%?"). The causal principle supports using the detailed match. Your flip-flop stems from understandably worrying about small sample sizes, but causality should guide the central estimate.
