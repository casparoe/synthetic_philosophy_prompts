answer: |-
  Here is a set of desiderata for an adequate solution to Zeno's motion paradoxes, structured to foreground tensions and distinguish non-negotiables from contested demands. I've argued with your proposed criteria where appropriate, per your request. The requirements are designed to force clarity on what "solving" means and expose fault lines between dissolutionist and substantivist approaches.

  ---

  ### **Non-Negotiable Desiderata**  
  *(Minimal standards for any solution claiming adequacy)*

  1. **Mathematical Consistency**:  
     The solution must be compatible with standard mathematical analysis (e.g., convergence of infinite series, continuity) without internal contradiction.  
     *Case*: Rejecting calculus or real analysis isn’t viable—it renders motion unintelligible *and* ignores why Zeno’s math (implicitly) fails. Grünbaum’s dissolution fails if it *only* asserts this, but it’s necessary groundwork.  

  2. **Paradox-Specific Engagement**:  
     The solution must address the *distinct* challenge of each paradox, not treat all four as identical.  
     - *Achilles/Dichotomy*: Explain why convergent sums don’t trivially resolve the "completing infinitely many steps" worry.  
     - *Arrow*: Confront the "no intrinsic state of motion" claim explicitly.  
     - *Stadium*: Account for relative motion without handwaving.  
     *Case*: A unified solution (e.g., "all are about infinity") risks ignoring the Arrow’s metaphysical challenge or the Stadium’s kinematic quirks.  

  3. **No Question-Begging**:  
     The solution cannot presuppose the reality of motion or the coherence of infinite completions *as Zeno challenges them*.  
     *Case*: Saying "Achilles passes the tortoise because we see it" or "supertasks are complete because limits exist" assumes the conclusion. Thomson’s lamp shows this isn’t trivial.  

  ---

  ### **Negotiable Desiderata**  
  *(Camp preferences often presented as demands; adherence splits dissolutionists and substantivists)*

  4. **Locating the Error vs. Dissolving the Contradiction**:  
     - *Substantivist demand*: Identify a false premise or invalid inference in Zeno’s reasoning (e.g., "space/time isn’t discrete," "instants lack kinematic properties").  
     - *Dissolutionist alternative*: Show that, under precise modern concepts, no contradiction arises—no "error" exists to locate.  
     *Argument against your (i)*: Benacerraf is right—Zeno’s paradoxes are *aporetic*, not deductive failures. Forcing an "error" may misrepresent them. A solution can be adequate by reframing the concepts (e.g., redefining "task" or "instant") to dissolve the puzzle.  

  5. **Supertask Completability Must Be Addressed (Not Necessarily Resolved)**:  
     - *Demand*: The solution must distinguish "sum convergence" from "task completion" and take a stand on whether infinite tasks *can* be completed.  
     - *But*: It need not *resolve* the tension (e.g., it can say Thomson’s lamp is ill-defined or that completion is physical, not mathematical).  
     *Argument against your (ii)*: Insisting that completability *not* rely on limits is too strong—limits may be the correct framework, and rejecting them risks incoherence. The circularity charge assumes limits are *external* to motion, but they may be constitutive of it.  

  6. **Arrow’s Intrinsic State: Vindication or Rejection Required**:  
     - *Demand*: The solution must either:  
       (a) Accept that motion is extrinsic (e.g., velocity is at-at or relational), or  
       (b) Defend intrinsic kinematic properties (e.g., causal dispositions, infinitesimal motion).  
     *Argument for your (iii)*: This is Zeno’s core metaphysical challenge. Calling it "changing the subject" (e.g., "velocity is just dx/dt") avoids the *prima facie* plausibility of identical instantaneous states.  

  7. **Stadium: Relative Motion or Deeper Implications?**:  
     - *Demand*: The solution must clarify whether the paradox relies *only* on misjudging relative motion in discrete space, or if it hints at relativity of simultaneity (in continuous time) or fundamental discreteness.  
     *Argument against your (iv)*: Dismissing it as "just relative motion" ignores why Zeno framed it with equal bodies/rows—it tests whether space/time is discrete *or* continuous. A solution should weigh in.  

  ---

  ### **The Core Tension: What Cannot Be Jointly Satisfied?**  
  - **`Locating a False Premise (4a)`** and **`Mathematical Dissolution Suffices (5)`** are incompatible.  
    - *Why*: Dissolutionists (e.g., Grünbaum) argue precision *eliminates* the paradox—there’s no premise to falsify. Substantivists (e.g., Salmon) demand a diagnosable error (e.g., "tasks require temporal intervals"). Requiring both forces either contradiction or vacuity.  

  ---

  ### **The Most Disqualifying Requirement**  
  - **`Supertask Completability (5)`** does the heaviest lifting in knocking out familiar solutions:  
    - *Convergent-series*: Fails unless it explains why summing series licenses task completion (Thompson’s lamp exploits this).  
    - *At-at theory*: Evades the Arrow but crashes into Dichotomy—if motion is just being at points, how are infinitely many point-visits *completed*?  
    - *Deflationism* (no instants/tasks): Collapses into question-begging (Desideratum 3) unless it provides an alternative ontology.  

  ---

  ### **Unity of the Paradoxes: A Litmus Test**  
  - **`Requirement (vi)`**: The solution must state whether a unified account is possible (e.g., all stem from mistaking infinite divisibility for infinite complexity) or if the Arrow/Stadium demand separate treatment.  
    - *Non-negotiable implication*: If plurality paradoxes (e.g., "The Grain of Millet") undermine the solution’s model of magnitude or divisibility, the motion solution is unstable.  

  ---

  ### **Summary for Your Seminar**  
  | **Desideratum**               | Non-Negotiable? | Threatens Which Solutions?              | Tension Partner          |  
  |-------------------------------|-----------------|-----------------------------------------|--------------------------|  
  | Mathematical Consistency      | Yes             | Deflationism, fringe math               | —                        |  
  | Paradox-Specific Engagement   | Yes             | Overly unified solutions                | —                        |  
  | No Question-Begging           | Yes             | Convergent-series, deflationism         | —                        |  
  | Error-Location vs. Dissolution| No (camp split) | Grünbaum-style dissolution              | 5 (Supertasks)           |  
  | Supertask Completability      | No (but essential) | Convergent-series, at-at theory     | 4a (Error-Location)      |  
  | Arrow's Intrinsic State       | No (but critical) | Pure at-at theory                   | —                        |  
  | Stadium's Depth               | No              | Dismissive interpretations              | —                        |  
  | Unity & Stability             | Semi (vi)       | Fragmented solutions                    | Plurality paradoxes      |  

  **Why both camps might sign on**: This framework forces each side to defend *why* their preferred negotiables (e.g., error-location vs. dissolution) are necessary. The non-negotiables ensure technical rigor and engagement with all four paradoxes. **Where they’ll diverge**: Substantivists will demand (4a) and reject solutions satisfying (5) via limit concepts; dissolutionists will see (4a) as a category error and insist (5) is resolved mathematically.  

  **Recommendation for your syllabus**: Assign Benacerraf’s "Tasks, Super-Tasks, and Modern Eleatics" (1962) to frame the completability issue, and Grünbaum vs. Salmon on whether dissolution suffices. Use this desiderata list as a seminar rubric—have students evaluate readings by where they succeed/fail against these criteria.
