  (ii) Supertask completability is the crux: if infinite tasks can't be "completed" in ordinary sense, convergent series alone doesn't save motion
  (iii) Arrow's "intrinsic state at instants" needs unpacking—is velocity relational? This exposes a rift in what "fundamental" means
  (iv) Stadium might just be relative velocity confusion, but could hint at discrete spacetime (though user seems skeptical)
  (v) Grünbaum-style dissolution vs. substantive diagnosis is the central battleground
