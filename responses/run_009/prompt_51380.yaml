  The core tension they're highlighting - why deferring to physicists feels unproblematic but deferring on moral matters feels different - cuts to the heart of moral philosophy. I need to carefully distinguish between the components of the testimony: the direct moral judgment (a), the empirical data (b), and the experiential insight (c). That third component is particularly interesting - it's not pure data nor pure moral reasoning, but something phenomenological.

