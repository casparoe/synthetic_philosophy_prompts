prompt: |-
  I do risk stuff for a mid-sized fintech — I'm basically the person who has to say yes or no to security spend and launch decisions, a couple of calls a week, and my boss wants a paper trail for each one. The problem is our inputs are a mess: for any given risk, one consultant gives us a probability like 20%, another says 2%, and our own engineer's gut is somwhere else again, and nobody can tell me whose number to trust. I've been told the standard move is to average the estimates, but that feels made up, like we're manufacturing precision nobody actually has. I recently came across the idea of imprecise probabilities — treating your credence as a whole set or interval of numbers instead of one point value, with decision rules like Γ-maximin, minimax regret, E-admissibility and maximality for choosing under that kind of vagueness — and it seems to describe our exact situation, but everything I can find on it is super technical and I can't tell what it actually commits you to.

  So: please turn whatever this theory actually says into a procedure I can run in ten minutes, with no maths, before a deadline. Give me exactly five numbered questions to ask in order — each item one or two sentences, covering the question itself, what counts as a sufficient answer, and whether that step is a genuine judgement call I have to own rather than something the theory settles — and nothing else, no intro or wrap-up. Within each item, also say how it plays out on our two live cases: whether to spend £80k on an extra security control where the two estimates of the relevant breach risk are 20% and 2%, and whether to delay a release where everyone agrees on how bad the bug would be but not on how likely it is to fire. Please be honest about where the procedure will misfire — I gather that in this framework collecting more information can sometimes make your set of probabilities wider instead of narrower, which sounds like it could quietly break my usual 'go get more data' fallback, and I'd rather know that up front than recieve a nice-looking checklist that falls apart the first time a vendor sends us a third estimate.
reasoning: |-
  Hmm, the user is in risk management for a fintech company. They need to make decisions on security spending and product launches, but are dealing with conflicting risk estimates from consultants and engineers. They've come across imprecise probabilities but find the theory too technical. They want a practical 5-step procedure they can implement quickly before deadlines, with no math.

  The user mentions two live cases: an £80k security control with conflicting breach risk estimates (20% vs 2%), and a release delay decision where impact is agreed upon but likelihood estimates vary. They want honesty about where the procedure might fail, especially that collecting more data might widen probability intervals instead of narrowing them.

  I need to create a concise 5-step process that applies imprecise probability concepts practically. Each step should include: the question to ask, what counts as sufficient answer, whether it's a judgment call, and how it applies to their two cases. I must also note where the approach might misfire.

  For Step 1, I'll focus on identifying the range of plausible probabilities from available sources. For the security control, that would be 2% to 20%. For the release delay, it's the range of likelihood estimates for the bug firing.

  Step 2 should establish the minimum and maximum impact values. The security control has a clear £80k cost, but breach impact needs quantification. The release bug has agreed impact but needs quantification.

  Step 3 requires evaluating alternatives. For both cases, this means comparing action vs inaction across the probability ranges.

  Step 4 applies a decision rule - I'll suggest Γ-maximin (maximize minimum expected utility) as a practical approach. For the security control, calculate expected loss with and without the control at both probability extremes.

  Step 5 involves checking if the decision is robust across the entire range. If not, judgment is needed on whether to seek more data or make a judgment call.

  I must highlight the key misfire: more information can sometimes expand the probability set, making decisions harder rather than easier. The user needs to know this upfront since their fallback is "get more data."

  The procedure should be judgment-heavy but structured, forcing explicit consideration of uncertainty rather than false precision. I'll keep each step to one or two sentences as requested, and avoid any math or theory explanations.
answer: |-
  Here are five numbered questions for your imprecise probability-based procedure. Each step requires your judgement (marked **JUDGE**), except where noted. Misfires are noted upfront: **The core misfire is that seeking a third estimate could widen your probability range (e.g., if a new expert says 0.5% or 30%), making the decision harder, not easier. Only seek more data if you suspect current estimates miss a key scenario, not just for precision.**

  1.  **What is the full range of distinct, minimally plausible probability estimates for the bad event, ignoring outliers you deem unreasonable?** A sufficient answer is listing the lowest and highest credible % values (e.g., 2% to 20%). **JUDGE** what's credible.  
      *Security Control:* Range is 2% to 20%.  
      *Release Delay:* Range is the min/max credible likelihood estimates for the bug firing (e.g., 1% to 15%).

  2.  **What is the best and worst credible outcome ($ loss, reputation hit, etc.) if the bad event happens?** A sufficient answer is quantifying the min/max credible impact (e.g., £100k-£500k loss). Treat agreed-upon impacts as a single point. **JUDGE** the impact range.  
      *Security Control:* Impact range needed (e.g., £150k-£1M breach cost). Control cost is fixed £80k.  
      *Release Delay:* Impact is agreed (single value, e.g., £250k loss). Delay cost is fixed (e.g., £50k/week).

  3.  **For each action (e.g., Act/Don't Act), calculate the *worst-case* expected loss across your probability and impact ranges: `(Max Probability) x (Max Impact) + Fixed Costs`.** Sufficient answer is one worst-case expected loss number per action. **NOT JUDGE** (calculation).  
      *Security Control (Act):* Worst loss = £80k (cost).  
      *Security Control (Don't Act):* Worst loss = 20% x £1M = £200k.  
      *Release Delay (Delay):* Worst loss = Delay cost (e.g., £50k).  
      *Release Delay (Launch):* Worst loss = 15% x £250k = £37.5k.

  4.  **Which action has the smallest worst-case expected loss (Γ-Maximin rule)?** Sufficient answer is naming that action (e.g., "Implement the control"). If tied, note it. **NOT JUDGE** (comparison).  
      *Security Control:* "Act" (£80k) < "Don't Act" (£200k) → **Implement control**.  
      *Release Delay:* "Delay" (£50k) > "Launch" (£37.5k) → **Launch** has smaller worst-case loss.

  5.  **Is the Γ-Maximin choice robust? (i.e., Is it *always* better than alternatives across the entire probability/impact range?**). If YES, proceed. If NO, **JUDGE** whether to accept the Γ-Maximin choice despite some scenarios favoring the alternative, or halt for urgent data/analysis (knowing this might worsen ambiguity).  
      *Security Control:* YES. Even at min probability (2%) and min impact (£150k), "Don't Act" expected loss (£3k) is less than control cost (£80k), BUT the Γ-Maximin choice ("Act") is still safe. Robust? **NO** (since min scenario favors inaction). **JUDGE**: Accept Γ-Maximin (implement) due to catastrophic max risk?  
      *Release Delay:* YES. "Launch" has lower loss than "Delay" across the entire range (max £37.5k < £50k). **Proceed to launch**.
