  Okay, the user and their friend had a three-hour debate about abortion, specifically comparing Thomson's bodily autonomy argument and Marquis's future-like-ours deprivation argument. They noticed that in most cases, both arguments align in their conclusions about abortion permissibility. Now, they want a thought experiment where the two theories diverge—Marquis permits abortion while Thomson forbids it.

  First, I need to recall Thomson's core idea. She argues that even if the fetus has a right to life, abortion can be permissible because the right to life doesn't entitle someone to use another person's body without consent. Her violinist analogy is key here: unplugging isn't killing but denying use of your body. Marquis, on the other hand, contends that abortion is wrong because it deprives the fetus of a valuable future. So if the fetus has no valuable future (like a terminal diagnosis), Marquis might not oppose abortion.

  The challenge is creating a realistic medical scenario without sci-fi elements. The user mentioned avoiding rape or life-threatening situations. The natural suggestion is a fetus with no future (dying shortly after birth) and minimal burden on the mother. But Thomson requires that refusing to continue is indecent, not just a rights violation. So the burden must be so small that refusing is beyond her rights—like failing to be a Minimally Decent Samaritan.

  Let me craft the scenario: A pregnant woman at 12 weeks learns the fetus has a rare condition causing certain death within days after birth. Continuing the pregnancy poses only minor inconveniences—no health risks, just typical symptoms manageable with rest. Abortion would be a quick, safe procedure. However, carrying to term allows the parents to spend brief time with the newborn. Refusing this small burden, Thomson might argue, is indecent because it's such a minor sacrifice for a significant, albeit short, benefit to the fetus.

  Next, analyzing each argument. For Marquis, since the fetus has no valuable future (only days of life post-birth), abortion doesn't deprive it of much, so it's not seriously wrong. Thomson, however, sees the mother's refusal to endure minimal burdens as violating a moral duty to be a Minimally Decent Samaritan. Here, the gap between acting within rights (which Thomson allows) and indecency (moral wrongness) is crucial. The user wants to know if this "indecency" qualifies as "wrong." Strengthening the case to close the gap might involve making the refusal seem even more callous, but Thomson's framework might inherently leave this gap, as she distinguishes between injustice (rights violation) and indecency (moral failing without injustice).

  The key feature is the negligible burden combined with no fetal future. If the fetus had a normal future, Marquis would oppose abortion. If burdens were significant, Thomson would permit refusal. Removing either element aligns the theories again.

  A Thomsonian might counter that any unwanted bodily use requires consent, and no one is obligated to be a Minimally Decent Samaritan if it involves bodily intrusion. But Thomson does allow that refusing minimal aid can be indecent. The friend's claim that the arguments don't compete—one about loss, the other about obligations—seems supported here. They address different questions: Marquis on what is lost (future value), Thomson on what is owed (bodily autonomy). In this case, they don't conflict but apply to different aspects.
answer: |-
  Here is the thought experiment, followed by the analysis:

  **Scenario:** A healthy woman at 12 weeks gestation learns through prenatal testing that the fetus has an extremely rare, always-fatal neurological condition. Infants with this condition are born alive but irreversibly unconscious, possessing no capacity for experience or awareness, and die peacefully within 72 hours of birth. Continuing the pregnancy poses *no significant physical health risk* to the woman beyond the normal, mild discomforts of early pregnancy (minor fatigue, occasional nausea easily managed with rest and diet). The pregnancy causes no financial hardship, requires no lifestyle changes beyond typical prenatal care, and imposes no psychological distress beyond the sadness of the diagnosis itself. She requests an abortion solely to avoid the remaining 6 months of pregnancy and childbirth, desiring to "move on" immediately. Carrying to term would allow the parents a brief, albeit profoundly sad, opportunity to hold their child before its inevitable death.

  **Analysis:**

  1.  **Arguments Applied:**
      *   **Marquis:** The fetus has *no valuable future* to be deprived of. Its biological future consists solely of 6 months of unconscious gestation followed by up to 72 hours of unconscious existence. This existence lacks any subjective experience, meaning, or the potential for developing such. Depriving the fetus of this future does not constitute the loss of a "future-like-ours" – a life containing valuable experiences, projects, and consciousness. Therefore, Marquis's core argument against abortion (that it deprives the fetus of a valuable future) **does not apply**. Abortion is not seriously wrong under this framework.
      *   **Thomson:** Granting the fetus a right to life *arguendo*, the key question is whether forcing the woman to continue gestating violates her bodily autonomy. Here, the burden is exceptionally small – only the "normal, mild discomforts" of pregnancy. Thomson explicitly states that while one is not obligated to be a Good Samaritan (making huge sacrifices), one *is* obligated to be a Minimally Decent Samaritan. Refusing to provide minimal, non-life-threatening assistance at very little cost to oneself can be indecent and morally wrong *even within one's rights*. Thomson uses the example of refusing to shout a warning to someone about to be hit by a truck as a classic case of indecent refusal of Minimally Decent Samaritanism. In this scenario, continuing the pregnancy imposes a *minimal burden* to provide the fetus with *its entire, tragically short but existentially complete life* (gestation + brief post-birth period). Refusing this minimal burden solely to avoid mild inconvenience and hasten emotional closure, thereby denying the fetus its *only possible form of existence*, **crosses the line into indecency** according to Thomson's framework. It is not merely exercising a right; it is a **morally wrong** refusal of a minimal duty of aid.

  2.  **The Crucial Feature & Its Removal:**
      *   **Feature:** The **combination of an almost negligible burden on the woman with the fetus having a definite, albeit extremely minimal and valueless future** (unconscious existence) that the woman's minimal sacrifice would allow to be realized. This makes the refusal seem callous *because* the cost is so low and the (unique) "benefit" to the fetus (its entire existence) is entirely dependent on her continued gestation.
      *   **Removing Minimal Burden:** If the pregnancy posed significant health risks, severe pain, substantial financial hardship, or deep psychological trauma, Thomson's framework would clearly permit abortion as refusal of Good Samaritanism. The refusal would no longer be indecent.
      *   **Restoring Normal Future:** If the fetus had a normal future, Marquis's argument would strongly condemn abortion as depriving it of a valuable future. Thomson might *still* permit abortion if the burdens were significant, but Marquis would now object.

  3.  **Thomsonian Attack & Conclusion on Rivalry:**
      *   **Thomsonian Attack:** A committed Thomsonian would likely challenge the characterization of the burden as truly "minimal" and the refusal as truly indecent. They might argue:
          *   Pregnancy *always* involves significant bodily intrusion and risk, however small statistically in this specific case. **Any** use of the body without continuous consent is a violation, and no one owes *any* bodily service, however minimal, to sustain another life, even briefly. Minimally Decent Samaritanism only applies to actions *external* to one's body (like shouting a warning), not to internal bodily sustentation.
          *   The psychological burden of carrying a doomed fetus, even if manageable, might be inherently significant enough to make refusal permissible.
          *   Framing the fetus's existence as a "benefit" it receives is illegitimate; the fetus isn't *harmed* by non-existence before conception, and preventing its *brief, unconscious* existence isn't depriving it of something it can value or experience.
      *   **Rivalry vs. Orthogonality:** This exercise largely **supports your friend's parting shot**. The core divergence arises because:
          *   **Marquis** is fundamentally concerned with **what is lost** (the deprivation of a valuable future). If there is no valuable future to lose, his argument is silent on the wrongness of abortion.
          *   **Thomson** is fundamentally concerned with **what is owed** (the limits of bodily obligation). She establishes that the fetus's right to life doesn't entail a right to use the woman's body. However, she *also* introduces a separate, positive moral duty of Minimally Decent Samaritanism, which can make refusing *minimal bodily aid* indecent/wrong even when one has the right to refuse.
      The "competition" in this edge case stems from Thomson's *additional* positive duty layer interacting with Marquis's deprivation calculus. The primary arguments about the core permissibility of abortion (bodily rights vs. future deprivation) remain largely orthogonal. They answer different primary questions: "Can I be forced to sustain this life with my body?" (Thomson) vs. "Does ending this life deprive it of something profoundly valuable?" (Marquis). This case highlights how Thomson's framework incorporates a *further* moral dimension (decency/minimal aid) that can generate a "wrongness" verdict even where the core bodily rights argument permits refusal *and* where Marquis's deprivation argument finds no serious wrong.
