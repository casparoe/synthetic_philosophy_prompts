prompt: |-
  So here's my situation: I'm a science and ideas reporter, and I also sit on our newsroom's standards committee — the body that signs off on data-driven investigations before publication. We've got a meeting Thursday and a story I genuinely can't figure out. Our data desk spent two months on the state's new math curriculum, which about 80 schools adopted three years ago. The headline finding is that schools using the new curriculum have notably better average test scores than schools that stayed with the old one. But when our data reporter broke the schools down by the poverty level of their student body, the old curriculum schools actually did better in every single bracket — the new curriculum only "wins" in the aggregate because the pilot schools were disproportionately the wealthier, higher-scoring ones to begin with. Someone muttered something about Simpson's paradox in the Slack channel, but I mostly need practical help here.

  The problem is that our data editor is digging in hard on publishing the aggregate comparison. His argument, which I want to take seriously rather than just steamroll: parents and legislators don't get to pick a school's poverty level, the aggregate is the actual gap in outcomes that exists in the world, stratified comparisons are a statistical refinement that will lose readers, and every ranking we've ever published aggregates. Meanwhile the reporter who did the work thinks running the aggregate number with a caveat buried in paragraph nine is basically malpractice, since the whole point is that the raw comparison reverses once you make the schools comparable. Leadership wants a committee memo, and I'm supposed to draft the thing: a clear recommendation (run the stratified version, run the aggregate, run both with some specific framing, or hold the story), plus the reasoning, and an honest section on the strongest points on the losing side — including whether there's any legitimate question where the aggregate really is the right number to report. If it helps, we're also fighting about the chart caption and the headline, so concrete guidance on those would be great too. Can you draft that memo for Thursday's meeting? Keep it usable as an actual document the committee could vote on, not an essay.
reasoning: |-
  Okay, the user is a science reporter and part of a standards committee grappling with how to present conflicting data about a school curriculum. The data desk found that schools using the new curriculum have better average test scores overall, but when broken down by poverty level, the old curriculum actually performs better in each bracket. The paradox occurs because wealthier schools—which already score higher—were the ones that adopted the new curriculum. 

  The user's core dilemma is balancing statistical accuracy with audience comprehension. Their data editor wants to report the aggregate gap, arguing it reflects "real-world" outcomes and that stratification might confuse readers. The reporter who analyzed the data insists the aggregate is misleading since it reverses when schools are made comparable. Leadership wants a memo with recommendations, reasoning, and acknowledgment of opposing views.

  Hmm... The user needs concrete guidance framed as a committee memo—actionable, not theoretical. They also mentioned disputes over headlines and charts, so those should be addressed specifically. 

  First, the statistical reality: Simpson's Paradox clearly applies here. Reporting aggregate scores without context would misrepresent the curriculum's effectiveness because poverty is such a strong confounder. The committee must avoid implying causation ("new curriculum improves scores") when the data suggests selection bias. 

  But the data editor has a point about real-world impact—the aggregate *does* exist. The solution is transparency: show both views but center the stratified analysis. A buried caveat won’t cut it; readers need to understand *why* the aggregate misleads. 

  For the memo: Recommend Option 3 (lead with stratified, explain aggregate). Strongest pro-aggregate argument? That parents see school-wide averages, not poverty brackets. But counter: those averages include poverty’s effect, so using them to judge curriculum efficacy is flawed. 

  Headline must avoid causal claims. Captions should explicitly flag the paradox. The reporter’s integrity is on the line—burying the reversal risks credibility. 

  Key phrasing for the memo: "The aggregate comparison answers 'what happened?' but the stratified answers 'what caused it?'" And: "Not reporting the reversal obscures the story’s most critical insight."
answer: |-
  ## MEMO: STANDARDS COMMITTEE RECOMMENDATION - MATH CURRICULUM STUDY  
  **TO:** Standards Committee  
  **FROM:** [Your Name], Science & Ideas Reporter / Committee Member  
  **DATE:** [Date of Meeting]  
  **SUBJECT:** Recommendation for "New Math Curriculum" Story & Data Presentation  

  ### 1. RECOMMENDATION  
  **Run the stratified analysis as the primary finding, contextualize the aggregate gap prominently, and explicitly name Simpson’s Paradox.**  
  *   **Lead with the poverty-stratified comparison:** This reveals the core finding — the new curriculum shows *no inherent advantage* and may even underperform the old one in comparable settings.  
  *   **Explain the aggregate result clearly and early:** Acknowledge the real-world gap exists but attribute it primarily to the *disproportionate adoption by wealthier schools*, not the curriculum itself.  
  *   **Directly reference Simpson’s Paradox:** Use the term in the 3rd-5th paragraph to explain why the aggregate is misleading.  
  *   **Hold the story** if the data desk cannot implement this framing. Running the aggregate as the headline finding risks significant misinterpretation.  

  ### 2. PRIMARY REASONING  
  *   **Accuracy & Misleading Potential:** The aggregated data creates a demonstrably false impression of the curriculum's *effectiveness*. The reversal within poverty brackets proves the aggregate gap is driven by pre-existing school characteristics (poverty/wealth), not the curriculum. Publishing only/mostly the aggregate is statistically unsound and misrepresents the investigation's central discovery.  
  *   **Core News Value:** The story's true significance lies in exposing *why* the aggregate gap exists (selection bias in adoption) and revealing that the new curriculum doesn't improve outcomes for similar schools. Burying this reversal negates the investigation's purpose.  
  *   **Reader Trust & Clarity:** While stratification adds complexity, readers (especially parents/legislators) deserve to understand that the apparent "success" stems from *which schools adopted it*, not the curriculum itself. Simplifying to the aggregate is patronizing and damages credibility when the nuance is this critical.  
  *   **Distinction from Rankings:** Unlike pure school rankings (which report *descriptive* outcomes), this story makes *causal inferences* about a policy intervention. Reporting methodology must be rigorous to avoid implying causation where none is supported by the stratified data.  

  ### 3. STRONGEST POINTS FOR REPORTING THE AGGREGATE (LOSING SIDE)  
  *   **"Real-World" Outcome:** The aggregate gap reflects the actual average difference in test scores between schools using the different curricula *as implemented*. Legislators/parents see school-wide scores, not poverty-bracketed ones.  
  *   **Simplicity & Engagement:** The aggregate finding is easier to grasp immediately. Leading with complex stratification risks losing readers before the key context is provided.  
  *   **Adoption Reality:** The skewed adoption pattern *is* part of the story. Showing the aggregate gap highlights a real consequence (intentional or not) of how the rollout occurred.  

  ### 4. WHY THE AGGREGATE ALONE IS NOT SUFFICIENT  
  *   **Answers the Wrong Question:** The aggregate tells us *what happened on average* but utterly fails to answer *why* or whether the curriculum *caused* the difference. The stratified data shows the curriculum likely *did not* cause the improvement; pre-existing school advantages did.  
  *   **High Misinterpretation Risk:** Presenting the aggregate prominently, especially without immediate, forceful context, will inevitably lead readers, parents, and policymakers to conclude the *new curriculum is better*. This is the opposite of the data's implication when schools are comparable.  
  *   **Violates Investigation Purpose:** The data desk spent two months to uncover this paradox. Suppressing the stratified finding undermines the investigation's value and integrity.  

  ### 5. CONCRETE PRESENTATION GUIDANCE  
  *   **HEADLINE:** Must **avoid** implying the curriculum caused improvement.  
      *   *Avoid:* "New Math Curriculum Boosts Test Scores, State Data Shows"  
      *   *Prefer:* "Wealthier Schools Drove Apparent Gains for New Math Curriculum, Data Reveals" or "New Math Curriculum's 'Success' Linked to School Wealth, Not Content, Analysis Finds"  
  *   **OPENING PARAGRAPHS (1-3):**  
      *   State the key stratified finding first: "Schools using the state's new math curriculum showed no improvement over the old curriculum when comparing schools with similar levels of student poverty, and in fact scored slightly lower in some brackets, according to a [Newsroom] analysis..."  
      *   Immediately follow with the paradox: "However, because wealthier schools were far more likely to adopt the new program, overall average scores for new-curriculum schools appear significantly higher — a statistical reversal known as Simpson's Paradox."  
  *   **CHARTS:**  
      *   **Primary Chart:** Show test scores (Y-axis) vs. Poverty Level Brackets (X-axis), with two lines (Old Curriculum vs. New Curriculum). This visually demonstrates the reversal.  
      *   **Secondary Chart (or Inset):** Show the aggregate gap, clearly labeled as "Unadjusted Average" or "Overall Mean Difference."  
      *   **CHART CAPTION (CRITICAL):** "**FIG 1: New Curriculum Trails Old Curriculum Within Comparable Poverty Brackets (Simpson's Paradox):** Despite lower scores within each poverty level (Fig 1), the new curriculum shows a higher overall average (Fig 2) because it was adopted primarily by wealthier schools with historically higher scores."  
  *   **PLACEMENT OF AGGREGATE DATA:** The aggregate comparison and its explanation must appear **no later than paragraph 5**. It cannot be buried.  

  ### 6. RECOMMENDATION SUMMARY  
  The stratified analysis is the only defensible foundation for this story. The aggregate gap is context for *how adoption happened*, not evidence for the curriculum's *effectiveness*. Presenting both clearly, with Simpson's Paradox named and explained early, provides accurate, newsworthy insight while maintaining reader trust. Publishing the aggregate as the primary finding would be misleading and fails to meet our standards for data-driven investigations.  

  **Recommended Vote:** Approve publication **only** with framing centered on the stratified analysis and explicit explanation of Simpson's Paradox as outlined.  

  ---  
  **Attachments:** [Link to Data Report, Mock-ups of Recommended Charts]  
  **Time Sensitive:** Requires Data Desk/Graphics confirmation of implementation feasibility by [Time Before Meeting].
