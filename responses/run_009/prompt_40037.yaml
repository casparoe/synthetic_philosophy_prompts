  *Step 2: Quantify Adjustment*
  - This is directional (toward lower probability). We don't have a clear magnitude. Use weighted average:
    - Suppose the analyst's original probability is 70%, the experts' view (if known) is say 30% (but the analyst doesn't have their exact number). Alternatively, the analyst might infer that the experts are more conservative and assign a lower probability. Without a specific number, shift toward the base rate? 
    - Alternatively, the analyst can estimate the experts' probability. If she can't, then she might shift her estimate by half the difference to the base rate? But base rate for coups in that region? Let's assume base rate is 10% (for the sake of example). 
    - However, the procedure says: if you have an expert probability, use weighted average. Without it, shift by 10-20% of the distance from your estimate to the base rate. 
    - Let's say base rate is 10%. Original estimate 70%. Distance is 60%. A 15% shift (moderate) would be 70% - 15% * 60% = 70% - 9% = 61%. 
    - Alternatively, if the analyst can approximate the expert's view (say, they think it's 30%), then use weights. If the expert is moderately credible (weight 0.6), then adjusted = 0.4*70% + 0.6*30% = 28% + 18% = 46%. That seems too drastic. 
    - We must avoid overcorrection. Therefore, without a specific expert probability, it's better to use a shift toward the base rate. Let's choose 10% of the distance: 70% - 10%*(70%-10%) = 70% - 6% = 64%.

  *Step 3: Decide Whether to Adjust or Flag*
  - Adjusted to 64% (from 70%) with moderate confidence. The adjustment is modest and the first-order reasoning still supports a high probability relative to base rate. So, submit 64% and note moderate confidence.

  **Case 2: Analyst has been up for 20 hours and is confident in his forecast.**

  *Step 1: Identify and Filter*
  - HOE signal: Sleep deprivation (20 hours awake).
  - Relevance: High (impairs judgment).
  - Reliability: High (studies show impairment).
  - Direction: Non-directional (reduces confidence, but doesn't necessarily shift the probability up or down).

  *Step 2: Quantify Adjustment*
  - Non-directional: Widen the confidence interval or reduce the confidence in the point estimate.
    - Suppose the analyst was going to say 85% with high confidence. Reduce the confidence to medium and adjust the probability downward modestly? The procedure says: reduce the point estimate by 5-10 percentage points? Or widen the interval? Since it's a point estimate, we reduce the point by a small amount and note lower confidence.
    - Rule of thumb: reduce by 5-10% of the distance from 50%? Or simply subtract 5%? Let's say 5%: 85% becomes 80%. 
    - Alternatively, if the event is very likely, the reduction might be smaller. We don't want to overdo it. So, reduce by 5% (absolute) to 80%.

  *Step 3: Decide Whether to Adjust or Flag*
  - Adjusted to 80% but with medium confidence (down from high). The adjustment is small and the first-order reasoning still holds. Alternatively, if the fatigue is extreme (20 hours and complex problem), the analyst might flag as low-confidence. But the procedure says: if the adjustment feels reasonable, use it. Otherwise, flag. Here, 80% is still a strong signal, so submit 80% with medium confidence and note the fatigue.

  **Case 3: Analyst got a bad calibration score on central bank decisions and now wants to over-adjust.**

  *Step 1: Identify and Filter*
  - HOE signal: Past calibration errors on the category (central bank decisions).
  - Relevance: High (same category).
  - Reliability: High (the score is objective).
  - Direction: Directional (if the calibration showed overconfidence, then adjust toward the base rate). Suppose the analyst was consistently overestimating the likelihood of rate changes (e.g., when he said 70%, the actual rate was 50%). So, overconfidence of 20% in the probability estimate? Actually, the miscalibration might be in the sense of Brier score, but we can interpret as an average overestimation.

  *Step 2: Quantify Adjustment*
  - Directional with known magnitude? We have a calibration score. Let's say the average overestimation was 20% (i.e., his probabilities were 20 percentage points too high on average for events he thought were 60-80%). 
    - Use regression: adjusted_prob = original_prob - (bias * (original_prob - base_rate))
