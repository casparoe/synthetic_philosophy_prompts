  We are creating a procedure that addresses higher-order evidence (HOE) in forecasting. The procedure should be practical, fitting on one page and taking about 15 minutes. It will guide analysts on when and how to adjust their forecasts based on HOE, and when to flag low confidence.

  The procedure will have three main steps:

  1. **Identify and Filter HOE Signals**: Determine which signals are relevant and reliable.
  2. **Quantify Adjustment (If Any)**: Adjust the forecast in a way that doesn't overcorrect.
  3. **Decide Whether to Adjust or Flag**: Sometimes it's better to flag low confidence rather than adjust.

  We'll also include a note on limitations and areas where judgment is required.

  ---

  **Procedure: Handling Higher-Order Evidence (HOE) in Forecasting**

  **Step 1: Identify and Filter HOE Signals (5 minutes)**

  List all HOE signals that come to mind (fatigue, disagreement with experts, past calibration errors, conflict of interest, etc.). Then, for each signal, ask:

  a. **Relevance**: Is this signal about the quality of my current reasoning on this specific forecast? (If not, ignore.)
  b. **Reliability**: Is there strong evidence that this signal actually affects forecast accuracy? (e.g., sleep deprivation is well-known to impair judgment; past calibration errors on a category are relevant for that category; expert disagreement might be informative if the expert is truly independent and knowledgeable.)
  c. **Directionality**: Does the signal suggest a particular direction of bias? (e.g., fatigue might lead to overconfidence, but not necessarily a directional shift in the probability estimate.)

  *Filtering*:
  - Keep only signals that are both relevant and reliable.
  - If a signal is reliable but non-directional (e.g., fatigue), note that it might reduce confidence but not necessarily shift the probability.
  - If a signal is directional (e.g., past tendency to overestimate the probability of coups), note the direction and approximate strength (weak/moderate/strong) based on the evidence (e.g., your calibration score showed you were overconfident by 20% on similar questions).

  *Common Signals*:
  - **Expert disagreement**: Relevant if the expert is independent and has access to different or better information. Be cautious of groupthink or bias in the expert's view.
  - **Fatigue/stress**: Reliably degrades judgment, but non-directional. Consider it a confidence reducer.
  - **Past calibration errors**: Relevant for the same category of questions. Directional (if you were overconfident, then you may need to regress toward the base rate or adjust your confidence interval).
  - **Conflict of interest (yours or client's)**: If you or the client has a stake in the outcome, it might bias the reasoning. Adjust by considering the opposite view more carefully.

  *Output of Step 1*: A shortlist of 1-3 key HOE signals that are both relevant and reliable, with a note on their direction (if any) and strength (weak/moderate/strong).

  **Step 2: Quantify Adjustment (5 minutes)**

  For each key HOE signal, apply one of the following adjustments:

  a. **Non-directional signals (e.g., fatigue)**: Widen your confidence interval or reduce the confidence in your point estimate. 
     - *How*: If you were going to state a probability of 80%, consider reducing it to 70-75% and note the increased uncertainty. Alternatively, if using a range, widen the range by 10-20%. (This is a rule of thumb; adjust based on the severity of the signal.)

  b. **Directional signals without a clear magnitude (e.g., expert disagreement)**: 
     - *How*: Apply a small shift toward the expert's view (if you have it) or toward the base rate. For example, if you were at 70% and the expert says 30%, move to 60% (halfway between your original and the midpoint of 50%)? But that might be too crude. Instead, use a weighted average: 
          adjusted_prob = (original_prob * your_confidence_weight) + (expert_prob * expert_weight)
       - Assign weights: if the expert is highly credible, use 0.7 for expert and 0.3 for you; if moderately credible, 0.6/0.4; if weakly, 0.55/0.45. If you don't have an expert probability, shift toward the base rate by 10-20% of the distance from your estimate to the base rate.

  c. **Directional signals with a known magnitude (e.g., past calibration errors)**: 
     - *How*: If you were consistently overconfident by 20% (i.e., when you said 80%, the correct rate was 60%), then adjust your current probability by the same factor? But note: this might not be linear. Instead, use a simple regression: 
          adjusted_prob = original_prob - (overconfidence_bias * (original_prob - base_rate))
       - Example: if base rate for the event type is 30%, and your overconfidence bias is 20% (meaning you overestimate by 20% of the distance from the base rate to your estimate), then if your original estimate is 80%, the overestimation is 20%*(80%-30%)=10%, so adjusted to 70%.

  *Important*: 
  - Avoid jumps to 50/50. Adjustments should be modest (typically no more than 10-20 percentage points unless there's very strong HOE).
  - If multiple signals, apply them sequentially and then check for reasonableness.

  *Output of Step 2*: An adjusted probability and a note on the new confidence level (high, medium, low).

  **Step 3: Decide Whether to Adjust or Flag (5 minutes)**

  After adjustment, ask:

  a. **Is the adjusted forecast still within a reasonable range?** If the adjustment pushes the probability to a value that feels completely unsupported by the first-order evidence, then the HOE might be unreliable or you might be overadjusting. In that case, do not adjust but flag the forecast as low-confidence.

  b. **Is the confidence level now low?** If after adjustment your confidence is low (e.g., because of multiple non-directional HOE signals), flag the forecast as low-confidence and note the reasons.

  c. **When to flag**: 
     - When you have strong HOE that your reasoning is compromised but you cannot determine a clear adjustment (e.g., severe fatigue, conflicting HOE signals).
     - When the adjusted probability does not align with your first-order reasoning at all.

  *Output of Step 3*: Either an adjusted forecast with a note on confidence, or a flag that the forecast is low-confidence with reasons.

  **Where Judgment is Required**:
  - In Step 1, determining the relevance and reliability of HOE signals is inherently judgmental.
  - In Step 2, assigning weights and magnitudes for adjustments is judgmental (but use the guidelines to avoid extreme moves).
  - In Step 3, deciding when the adjusted forecast becomes unreasonable and when to flag is a judgment call.

  **Limitations**:
  - This procedure cannot eliminate the risk of over- or under-adjustment. It is a heuristic.
  - It does not address cases where HOE is conflicting (e.g., one expert agrees and another disagrees) beyond simple weighting.
  - The magnitude of adjustments (e.g., how much to shift for expert disagreement) is not settled by theory and is based on practical experience.
  - It assumes that the analyst can identify HOE signals, which might not always be the case (e.g., blind spots).

  **Philosophical Disputes**:
  - The literature on epistemic akrasia does not settle whether it is rational to adjust one's belief based on HOE that one's reasoning is impaired. Some argue that one should always defer to first-order evidence, others that HOE can sometimes override. Our procedure takes a pragmatic middle ground: adjust modestly and flag when in doubt.

  ---

  **Running the Procedure on the Three Cases**

  **Case 1: Analyst disagrees with country specialists at a big think tank on a coup question.**

  *Step 1: Identify and Filter*
  - HOE signal: Expert disagreement.
  - Relevance: High (they are specialists in the country).
  - Reliability: Moderate to high, but must consider: are they independent? Do they have access to classified info? Are they biased toward stability? Analyst cannot tell. Since the analyst doesn't know about bias, she should treat it as moderate reliability and non-directional? Actually, the disagreement itself is directional (they think the coup is less likely) but the reason for disagreement is unclear. 
  - Direction: The experts' view is that the coup is less likely. 
