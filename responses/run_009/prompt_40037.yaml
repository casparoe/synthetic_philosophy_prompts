answer: |-
  ### Higher-Order Evidence Adjustment Protocol (HOE-AP)  
  **Goal**: Systematically incorporate higher-order evidence (HOE) without overcorrecting or ignoring it. Time: ≤15 min.  
  **Inputs**: Your draft forecast (probability or range), HOE signals (e.g., fatigue, expert disagreement, past errors).  
  **Outputs**: Adjusted forecast OR "low-confidence" flag with reasoning.  

  ---

  #### **Step 1: Filter Signals (4 min)**  
  *Which HOE is actionable?*  
  | **Signal Type**          | **Worth Considering?** | **Why?**                                                                 | **Directional?**                     |  
  |--------------------------|------------------------|--------------------------------------------------------------------------|--------------------------------------|  
  | Domain expert disagrees  | ✅ Yes (if independent) | Expertise adds info, but weigh independence & bias.                      | ⬅️➡️ (Adjust toward their view)     |  
  | You’re fatigued/stressed | ✅ Yes                 | Cognitive impairment proven; non-specific bias.                          | ❌ (Non-directional; reduce confidence)|  
  | Past calibration errors  | ✅ Yes (same category) | Indicates systematic bias in reasoning.                                  | ✅ (Direction of past error)         |  
  | Client’s vested interest | ⚠️ Maybe              | Only if it risks *your* reasoning (e.g., self-censorship).               | ⬅️➡️ (Adjust away from client’s bias)|  
  | Single past failure      | ❌ No                  | Random error; not systemic. Ignore.                                      | N/A                                  |  

  **Judgment call**:  
  - If unsure about a signal’s reliability (e.g., "Are experts biased?"), default to "weak" weighting in Step 2.  
  - **STOP and flag low-confidence** if >2 strong HOE signals (e.g., fatigue + expert conflict + past errors).  

  ---

  #### **Step 2: Adjust Credence (6 min)**  
  *Modify forecast without overcorrecting. Use this hierarchy:*  

  1. **Non-directional signals (e.g., fatigue)**:  
     - Reduce confidence *without* shifting probability:  
       - Original forecast: 80%  
       - **Adjustment**: Widen confidence interval (e.g., 70–90% → 65–95%) OR lower probability by 5–15% (e.g., 80% → 70%).  
       - *Formula*: `Adjusted prob = Original prob - (0.05 × Original prob)`  
         (e.g., `80% - (0.05 × 80) = 76%`).  

  2. **Directional signals (e.g., expert disagreement, past bias)**:  
     - **Weak signal** (e.g., unsure if expert is biased): Shift 25% of the gap to midpoint/base rate.  
       - *Formula*: `Adjusted prob = Your prob - [0.25 × (Your prob - Target)]`  
         - *Target*: Expert’s view OR base rate if no expert view.  
         - Example: You: 70%, Expert: 30% → `70 - [0.25 × (70-30)] = 60%`.  
     - **Strong signal** (e.g., known past overestimation): Shift 50% of the gap.  
       - *Formula*: `Adjusted prob = Your prob - [0.5 × (Past avg. error)]`  
         - Example: Past overestimation = +20% → You: 70% → `70 - (0.5 × 20) = 60%`.  

  **Rules to avoid dumb moves**:  
  - ➠ **Never** jump to 50/50 or discard priors.  
  - ➠ Max shift: 25 percentage points (e.g., 80% → 55% only if extreme HOE).  
  - ➠ If adjustment contradicts core evidence, *skip to Step 3*.  

  ---

  #### **Step 3: Flag or Finalize (5 min)**  
  *When to abstain from adjusting?*  
  Flag forecast **low-confidence** if:  
  - HOE is strong but direction is indeterminable (e.g., "experts disagree, but I can’t assess why").  
  - Adjustment pushes probability outside your *first-order evidence range* (e.g., your model says 60–80%, but HOE-adjustment forces 40%).  
  - You have multiple conflicting HOE signals (e.g., fatigue says "underconfident" but past errors say "overconfident").  

  **Final output options**:  
  > ✅ **Option A**: Submit adjusted forecast (e.g., "60%, adjusted down from 70% due to expert disagreement").  
  > ⚠️ **Option B**: Flag low-confidence (e.g., "70%, but low confidence due to fatigue + expert conflict; recommend external review").  

  ---

  ### **Limitations & Philosophical Gaps**  
  | **Issue**                          | **Protocol’s Stance**                                                                 | Why It’s Tricky                                                                 |  
  |------------------------------------|---------------------------------------------------------------------------------------|--------------------------------------------------------------------------------|  
  | **Conflicting HOE**                | Default to non-directional adjustment (e.g., widen confidence) OR flag.               | Philosophy debates if HOE "overrides" first-order evidence. No consensus.     |  
  | **Magnitude of adjustment**        | Formulas cap shifts at 25pp. Stronger shifts require team lead approval.              | No theory-backed way to quantify "how much" for ad-hoc HOE (e.g., sleep debt). |  
  | **False HOE**                      | Step 1 filters weak signals, but false positives remain (e.g., "experts were wrong"). | HOE can be misleading; akrasia isn’t always irrational.                       |  
  | **Non-quantifiable HOE**           | Flag as low-confidence (e.g., "client pressure likely biasing me, but can’t measure").| Some HOE is qualitative (e.g., "I feel biased").                              |  

  ---

  ### **Worked Examples**  
  #### **Case 1: Expert Disagreement on Coup Forecast**  
  - **Analyst’s view**: 65% chance of coup in Country X.  
  - **HOE**: Think tank experts say 20%. Analyst can’t assess if they’re biased or informed.  
  - **Step 1**: Signal = expert disagreement. Reliability = "weak" (bias unknown). Directional.  
  - **Step 2**: Weak directional adjustment. Target = expert’s 20%.  
    - `Adjusted prob = 65 - [0.25 × (65 - 20)] = 65 - 11.25 ≈ 54%`.  
  - **Step 3**: Adjusted to 54% (within first-order evidence range). **Submit 54%**.  

  ---

  #### **Case 2: Sleep Deprivation**  
  - **Analyst’s view**: 85% chance of tech breakthrough.  
  - **HOE**: 20 hours awake; fatigue impairs cognition (non-directional).  
  - **Step 1**: Signal = fatigue. Reliable and relevant. Non-directional.  
  - **Step 2**: Non-directional adjustment.  
    - `Adjusted prob = 85 - (0.05 × 85) ≈ 81%`.  
    - *Also*: Widen confidence range (e.g., ±10% → ±15%).  
  - **Step 3**: Adjusted to 81%. **Submit 81% with note: "Lower confidence due to fatigue"**.  

  ---

  #### **Case 3: Past Calibration Errors**  
  - **Analyst’s view**: 75% chance of interest rate hike.  
  - **HOE**: Bad calibration on past 10 central bank forecasts (avg. overestimation = +25%).  
  - **Step 1**: Signal = past errors. Strong and directional (overestimation).  
  - **Step 2**: Strong directional adjustment.  
    - `Adjusted prob = 75 - [0.5 × 25] = 62.5%`.  
  - **Step 3**: *But* analyst’s first-order model still strongly supports 75%. Adjustment feels "wrong."  
    - **Flag as low-confidence**: "62.5%, but low confidence due to past miscalibration. First-order model unchanged."  

  ---

  ### **Implementation Tips**  
  - **Track adjustments**: Log HOE signals and outcomes to refine formulas (e.g., "Is 0.25 the right weight?").  
  - **Team calibration**: Discuss edge cases monthly to align on "judgment calls."  
  - **Red teaming**: For flagged forecasts, have another analyst review first-order evidence.  
  - **Philosophical anchor**: This protocol follows *moderate conciliationism* (HOE should nudge, not override).  

  **Final note**: This won’t eliminate akrasia, but forces systematic engagement with HOE. Update after 50 forecasts.
