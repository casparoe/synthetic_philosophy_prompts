answer: |-
  ## The Burning Archive (Barcelona, 1909)

  *(The Archive of the Crown of Aragon smolders, casting flickering orange light on the faces of LEOPOLD VON RANKE, 73, precise and agitated despite the soot, and HAYDEN WHITE, 40s, observing the conflagration with a detached, almost wry curiosity. Embers dance like dying stars. Ranke clutches three singed documents rescued moments before the flames took the annex.)*

  **RANKE:** Madness! Utter madness! To burn the past... it is like blinding ourselves! Look at this! *Just* surfaced! Three accounts of the Santa Caterina riot, Manresa, 1908. The very thing I sought! And now... *this*! *(He gestures wildly at the fire)*

  **WHITE:** Calm yourself, Herr Professor. The archive burns, yes. But perhaps it only makes visible what was always true. The past isn't *in* there. It’s in *here*. *(He taps his temple)* And in stories like these. *(He nods at the papers in Ranke's hand)* Three beginnings, not one end.

  **RANKE:** Nonsense! There is one event – a riot, sparked by bread prices, in Manresa, July 14th, 1908. People died! Grain stores were attacked! These documents, flawed as they are, are our only conduit *to* that fixed point. Our duty is to *criticize* them, weigh them against each other, strip away the bias, and approach the *wie es eigentlich gewesen* – as it actually happened!

  **WHITE:** *(Leans against a soot-streaked wall)* "Actually happened." A comforting phrase. But look at them, Leopold. Truly look. The Prefect's report: dry, administrative. *"Disturbances ensued following price adjustments... order restored by dawn... minimal property damage."* It practically yawns with bureaucratic boredom. Farce, perhaps? Or a desperate plea for calm, minimizing chaos to preserve the illusion of control? The *plot* is containment.

  **RANKE:** Of course he minimizes! He fears blame, fears Madrid! That *is* the bias! We account for it! Then we have Señor Martí’s memoir, written forty years later, trembling with passion! *"They murdered Rosa! Cut down like wheat for demanding bread! The flames of revolt lit the dawn!"* Tragedy! Epic heroism! But memory, Herr White, memory is a sieve clogged with years of anger and myth-making! We must sift it!

  **WHITE:** Sift it? Into what container? His *is* the tragedy. Rosa’s death, real or symbolic, *is* the climax for him. You speak of stripping bias, but what you call "sifting" is choosing *which* emplotment you find most persuasive, most coherent. You don't find the riot, Leopold; you construct a *narrative* of the riot using these pre-fabricated parts. Martí gives you the tragic hero; the Prefect gives you the faceless bureaucracy. And the third? The journalist?

  **RANKE:** *(Snorts, waving the third paper)* Señor Cobb, the American? Arrived the *next* morning, pieced it together from tavern tales and hysterical landlady gossip? *"Mysterious Anarchist Stranger Foments Bread Uprising! Lovers' Tryst Ignites Class War!"* Romance! Sensationalist drivel! Barely worth the paper it's written on! See? Already we dismiss one! Evidence disciplines the imagination!

  **WHITE:** Does it? Or does it merely provide more colourful grist? You dismiss Cobb *because* his romance clashes violently with the other plots *and* lacks corroboration. But isn't that dismissal itself an act of narrative preference? You favor the plausible tragedy or the dull farce over the garish romance. Aesthetic choice, Leopold, masquerading as empiricism.

  **RANKE:** Aesthetic? *Facts*, Hayden! Material facts! We know people died. Martí names Rosa Muntadas. Parish records *will* show where she was buried – that is not a plot point, it is a fixed coordinate! The main grain store – did it burn? Insurance records, fire brigade logs! These things constrain! They are not infinitely malleable! Your "emplotment" cannot make Rosa alive if she is dead, or make the granary stand if it burned!

  **WHITE:** Ah, the anchor! The brute facts. Rosa is dead. A building stood or fell. Agreed. But what does Rosa's death *mean*? Martyrdom? Tragic accident? Deserved consequence? And the granary fire – was it revolutionary arson? Accidental spark? Prefect's false flag to discredit the workers? *That* is where emplotment lives, Leopold. *Between* the brute facts. The journalist’s ‘lover’s tryst’ might be nonsense, but the *meaning* of Rosa’s death, the *significance* of the fire – those are wrestled from the sources by *you*, the historian, choosing which voice to amplify, which plot best accommodates the fragments you deem reliable. The facts are stones; the narrative is the mortar *you* mix and apply.

  **RANKE:** *(Takes a breath, controlling frustration)* You make it sound arbitrary. As if I could just... pick a story. It is not! The discipline lies *in* the constraint! The sources, critically interrogated, push back! The Prefect’s motive to minimize forces us to seek evidence *he* might omit – like Martí’s Rosa. Martí’s bitterness forces us to look for corroboration *outside* his grief. Cobb’s absurdity highlights the value of proximity and documentation. The pressure of *all* the evidence, Hayden – the burial record, the scorch marks on the warehouse foundation stones, the grain prices in the ledger books – this pressure *disciplines* the imagination! It forces the narrative towards the shape of what *was*, even if we never grasp it perfectly. Getting Rosa’s death *right* – the how, the why, the context – matters! It is the difference between history and... and Cobb’s penny dreadful!

  **WHITE:** And yet, two of these three reports, the Prefect’s original dispatch and Martí’s handwritten memoir, are likely ash now. *(He gestures at the roaring fire consuming the archive annex)* Poof. Gone. Leaving only Cobb’s lurid romance circulating in foreign newspapers, perhaps. What ‘actually happened’ in Manresa just became vastly more dependent on the narrative choices of whoever next tells the tale. The brute facts remain, but orphaned, disconnected. Who will find Rosa’s grave now, without Martí’s cry? Who will verify the granary fire without the Prefect’s inventory? The *constraint* you rely on just... evaporated.

  **RANKE:** *(Stares at the fire, face grim)* A catastrophe. The loss is incalculable. Irreplaceable evidence, gone. *(He looks down at Cobb's report in his hand with disgust)* Leaving *this* as potentially the loudest voice.

  **WHITE:** Precisely. The fire doesn't create the narrative problem; it merely illuminates it starkly. History is always built on fragments, selected, arranged, emplotted. Tonight, the selection just got violently narrower. That *(points to the fire)* is undeniable. The one fact neither of us can spin tonight. The archive burns.

  **RANKE:** *(Nods slowly, still staring at the flames)* Ja. It burns. And with it, pieces of the truth. Pieces we needed. *(He crumples Cobb's report slightly in his fist)* This... *this* is garbage. Romance built on hearsay. Any serious historian would see that.

  **WHITE:** *(A small, ironic smile)* On that, Professor Ranke, we are in perfect agreement. Utter garbage. A narrative dead end, unsupported by any plausible constellation of facts. Even *my* relativism has its limits when faced with sheer invention. Some stories *are* just bad fiction.

  *(They stand side-by-side for a moment, watching the fierce glow consume the building. Ranke’s posture is rigid, grieving the loss of evidence, the retreat of the knowable past. White watches calmly, observing the spectacle of destruction, the inevitable reduction of the past to fewer, more contested narratives. The heat washes over them, carrying ash.)*

  **RANKE:** *(Quietly, almost to himself)* We must salvage what we can. Interrogate every surviving scrap. The truth *is* in there, Hayden. It must be wrestled free.

  **WHITE:** *(Eyes still on the flames)* We will tell stories, Leopold. Compelling, coherent stories. Built on the scraps that remain. We’ll argue fiercely over which story best accommodates the surviving facts... and which facts we choose to call ‘surviving.’ The wrestling isn't with the past. It's with each other, and with the meanings we need now. The fire just made the canvas smaller, the choices starker.

  *(Ranke shakes his head, clutching the two remaining reports – the Prefect’s and Martí’s – like relics. White lets out a slow breath, the orange light reflecting in his eyes. The archive groans as a beam collapses inward, sending a fresh plume of sparks into the Barcelona night. They stand together, united only in rejecting the journalist's fantasy and acknowledging the undeniable fire, yet separated by an unbridgeable chasm of what history is, and how it can be known. The past, for one, is a receding fixed point; for the other, it is a story forever being written in the ashes.)*
