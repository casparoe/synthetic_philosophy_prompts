prompt: |-
  I run a seminar on anthropic reasoning whose two most persistent members—one a defender of the Self-Sampling Assumption, the other of the Self-Indication Assumption—have finally agreed to an adversarial collaboration instead of another year of talking past each other. Draft the joint statement they should produce, formatted as a numbered section of agreed claims, then a disagreements table, then the cruxes. The agreed-claims section should include whatever they can jointly sign about how self-locating evidence enters Bayesian conditioning and about which thought experiments—the Presumptuous Philosopher, the doomsday argument, the incubator cases—any resolution must answer. The disagreements table should state their residual differences so precisely that each would accept the wording of their own view, especially regarding the Presumptuous Philosopher case and the doomsday argument. Among the cruxes, include at least one about whether the Self-Indication Assumption is a legitimate correction for the fact that hypotheses positing more observers render one's existence more probable, or whether it instead double-counts by treating one's existence as evidence for populous worlds again after one has already conditioned on existing. For each crux, describe a concrete case both would accept as bearing on it and record each side's prediction in advance; one such case, invented by a member of the seminar, should be a cloning experiment in which a single AI system is instantiated either once or a billion times depending on a fair coin, with every copy asked, before receiving any further information, to bet on how the coin landed. Finally, if any part of the SSA/SIA dispute strikes you as verbal—for instance, a disagreement over credence that dissolves once rational betting behavior is fixed—say which part, why, and how much of the dispute survives once it is set aside.
reasoning: |-
  We are drafting a joint statement for two seminar members: one defending the Self-Sampling Assumption (SSA) and the other the Self-Indication Assumption (SIA). The structure will be:

  1. **Agreed Claims**: A numbered list of claims both can sign about self-locating evidence and thought experiments.
  2. **Disagreements Table**: A table with two columns (SSA and SIA) stating their residual differences precisely, especially regarding the Presumptuous Philosopher and the Doomsday Argument.
  3. **Cruxes**: At least one crux about whether SIA double-counts evidence. Each crux includes a concrete case and both sides' predictions. We'll include the cloning experiment as described.

  Additionally, we'll address if any part of the dispute is verbal and how much survives after setting that aside.

  ---

  **Joint Statement on Anthropic Reasoning: Agreed Claims and Disagreements**

  **1. Agreed Claims**

  We, the defender of the Self-Sampling Assumption (SSA) and the defender of the Self-Indication Assumption (SIA), jointly agree on the following:

  1.1. **Self-Locating Evidence in Bayesian Conditioning**: In cases involving self-locating uncertainty (i.e., uncertainty about which observer one is), Bayesian updating must account for the fact that one's own existence and location are part of the evidence. This requires a reference class of observers and a method for updating on indexical information.

  1.2. **The Necessity of Resolving Key Thought Experiments**: Any adequate framework for anthropic reasoning must provide coherent and consistent answers to the following thought experiments:
     - **The Doomsday Argument**: An argument that uses the current population rank of an observer to predict the total number of humans that will ever exist, suggesting that doom is likely sooner rather than later.
     - **The Presumptuous Philosopher**: A scenario in which two theories of cosmology are equally supported by non-indexical evidence, but one theory predicts vastly more observers than the other. The question is whether we should assign equal credence to both theories initially or favor the one with more observers.
     - **The Incubator Cases**: A family of thought experiments (e.g., the original incubator, the three-day case, etc.) in which observers are created in different batches, and one must reason about the probability of being in a particular batch.

  1.3. **The Role of the Reference Class**: Both SSA and SIA require a well-defined reference class of observers. The choice of reference class (e.g., all conscious beings, all humans, etc.) is a critical parameter that can affect the outcome of anthropic reasoning, and both frameworks must specify how the reference class is chosen.

  1.4. **Conditioning on Existence**: We agree that one must condition on the fact that one exists. However, we disagree on how this conditioning should be done and how it interacts with the prior probability of hypotheses.

  1.5. **The Need for Empirical Testing**: Where possible, anthropic reasoning should be tested through thought experiments that can be operationalized as betting scenarios or decision problems.

  **2. Disagreements Table**

  The following table outlines our residual disagreements. Each side accepts the wording of their own view.

  | Issue                                                                 | SSA Position                                                                                                                                 | SIA Position                                                                                                                                 |
  |-----------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------|
  | **Presumptuous Philosopher**                                          | We should assign equal credence to two theories that are empirically equivalent, regardless of the number of observers they predict. Thus, we do not favor the theory with more observers. | We should assign higher credence to the theory that predicts more observers because it makes our existence more probable. Thus, we favor the theory with more observers. |
  | **Doomsday Argument**                                                 | The Doomsday Argument is valid: being an early human in the birth order is evidence that the total number of humans is smaller.                | The Doomsday Argument is invalid: the higher prior probability of being in a larger population cancels the effect of being early.              |
  | **Treatment of Self-Locating Evidence**                               | Only the indexical information about which observer one is should be used to update. Conditioning is done by selecting a random observer from the reference class. | The indexical evidence also includes the fact that one exists at all. Hence, hypotheses that make existence more likely (by having more observers) get an additional boost. |
  | **Incubator Case (e.g., the original Sleeping Beauty-style incubator)** | In the classic incubator (where one coin flip determines if one or two rooms are created, and one is awakened in each room that exists), upon waking, one should assign 1/2 probability to the coin having landed Heads (one room). | In the same incubator, upon waking, one should assign 2/3 probability to the coin having landed Tails (two rooms) because there are twice as many awakenings in the Tails scenario. |

  **3. Cruxes**

  We identify the following cruxes that, if resolved, would significantly advance the debate. For each crux, we describe a concrete case and state each side's prediction.

  **Crux 1: Does SIA double-count evidence?**

  - **Description**: The SSA defender argues that SIA double-counts the evidence of one's existence. First, we condition on existing (which already gives a higher prior to theories with more observers) and then SIA adds an extra factor for the same evidence. The SIA defender argues that conditioning on existence is not enough because the standard priors do not account for the fact that more populous worlds make it more likely that one would exist at all, and thus SIA is a necessary correction.
  - **Concrete Case**: The cloning experiment.
    - **Setup**: A fair coin is flipped. If Heads, a single AI system is instantiated once. If Tails, the same AI system is instantiated a billion times. Every copy of the AI is asked, before receiving any further information, to bet on how the coin landed. The bet pays out $1 if correct and costs $1 if wrong. What fraction of their resources should a copy bet on Tails?
    - **SSA Prediction**: The reference class is the set of all AI copies. In the Heads scenario, there is 1 copy. In the Tails scenario, there are 1 billion copies. By SSA, upon finding oneself as an AI copy, one should condition on being a random copy. Thus, the probability of being in the Tails scenario is (number of copies in Tails) / (total copies across scenarios) = 1e9 / (1e9 + 1). Therefore, the credence for Tails is approximately 1, and the AI should bet almost all resources on Tails.
    - **SIA Prediction**: SIA says that we should assign prior probabilities proportional to the product of the non-indexical prior and the number of observers. The non-indexical prior for Heads and Tails is 1/2 each. For Heads, the number of observers is 1, so the SIA prior for Heads is proportional to 1/2 * 1. For Tails, it is proportional to 1/2 * 1e9. Normalizing, the probability of Tails is (1e9) / (1e9 + 1) ≈ 1. Thus, the AI should also bet almost all resources on Tails.

  **Analysis of Crux 1**: Both frameworks agree on the betting behavior in this cloning experiment. Therefore, this experiment does not distinguish between them. However, note that the SSA defender might object that the reference class in SSA must be chosen appropriately. If the reference class includes all possible AI copies, then SSA gives the same answer as SIA. But the SSA defender might argue that the reference class should be defined differently? Alternatively, we might need a different case to expose the double-counting issue.

  **Crux 2: The Doomsday Argument**

  - **Description**: The SSA defender believes that the Doomsday Argument is sound, while the SIA defender rejects it. The crux is whether the birth rank of an observer (e.g., being among the first 100 billion humans) is evidence about the total number of humans that will ever exist.
  - **Concrete Case**: A simplified Doomsday scenario.
    - **Setup**: Consider two scenarios: Early Doom (total humans = 200 billion) and Late Doom (total humans = 200 trillion). Assume that the non-indexical evidence does not favor either scenario. We are among the first 100 billion humans. What is the probability that we are in the Early Doom scenario?
    - **SSA Prediction**: By SSA, we are a random sample from all humans that ever exist. The probability of being in the first 100 billion given Early Doom is 100e9 / 200e9 = 0.5. Given Late Doom, it is 100e9 / 200e12 = 5e-4. The prior odds (without indexical evidence) are 1:1. The Bayes factor is (0.5) / (5e-4) = 1000. So the posterior odds are 1000:1 in favor of Early Doom. Thus, we assign about 99.9% probability to Early Doom.
    - **SIA Prediction**: SIA assigns a prior that is proportional to the number of observers. So the prior for Early Doom is proportional to 200e9, and for Late Doom proportional to 200e12. The ratio of priors is 1:1000 in favor of Late Doom. Then, we condition on our birth rank (first 100 billion). The likelihood of our birth rank given Early Doom is 1 (because we are necessarily in the first 100 billion if that's all there are). Given Late Doom, the likelihood is (100e9)/(200e12)=5e-4. Therefore, the posterior odds = (prior ratio) * (likelihood ratio) = (1/1000) * (1 / 5e-4) = (1/1000)*2000 = 2. So the odds are 2:1 in favor of Late Doom, i.e., about 66.7% probability for Late Doom.

  **Analysis of Crux 2**: This case shows a clear divergence: SSA predicts a 99.9% chance of Early Doom, while SIA predicts a 66.7% chance of Late Doom. This experiment (if we could observe the outcome) could resolve the dispute.

  **Crux 3: The Incubator Case (Three-Day Version)**

  - **Description**: A variant of the incubator case that highlights the difference in updating.
  - **Concrete Case**: The Three-Day Incubator.
    - **Setup**: A coin is flipped. If Heads, one person is created on Monday and then put to sleep, and the experiment ends. If Tails, one person is created on Monday, put to sleep, and then on Tuesday the same person is woken up again (without memory of Monday) and then the experiment ends. However, in the Tails case, on Tuesday the person is given an amnesia drug so that each awakening feels like the first. When awakened, what credence should the person have that the coin landed Tails?
    - **SSA Prediction**: There are three possible awakenings: Monday-Heads, Monday-Tails, Tuesday-Tails. They are subjectively indistinguishable. By SSA, we assign equal probability to each awakening. Therefore, the probability of Tails (which includes Monday-Tails and Tuesday-Tails) is 2/3.
    - **SIA Prediction**: The prior for Heads and Tails is 1/2. Under Heads, there is 1 awakening. Under Tails, there are 2 awakenings. The SIA prior for each hypothesis is proportional to the number of awakenings: Heads gets weight 1, Tails gets weight 2. Normalizing, Heads has prior 1/3 and Tails 2/3. When awakened, no new non-indexical evidence is obtained, so the credence for Tails remains 2/3.

  **Analysis of Crux 3**: Both frameworks agree on the 2/3 answer in this case. However, note that in the original Sleeping Beauty problem, SIA and SSA (with the reference class of awakenings) both yield 2/3 for Tails. But the SSA defender might object to the reference class being awakenings. Alternatively, we can modify the case to create a disagreement.

  **Modified Incubator Case for Disagreement**:

    - **Setup**: Same as above, but now in the Tails case, on Tuesday a different person is created (with the same memories as the Monday person). Now, when awakened, the person does not know if it is Monday or Tuesday, and does not know if they are the same person as on Monday (if Tails) or a new person. They are asked for the probability that the coin was Tails.

    - **SSA Prediction**: The reference class is the set of all person-awakenings. In Heads: 1 awakening (by the one person). In Tails: 2 awakenings (by two different persons). So there are three person-awakenings. Each is equally likely. The Tails scenario has two of these. So P(Tails) = 2/3.

    - **SIA Prediction**: The prior for Heads and Tails is 1/2. Under Heads, there is 1 observer (and 1 awakening). Under Tails, there are 2 observers (each with one awakening). The SIA prior for a hypothesis is proportional to the number of observers. So Heads: weight 1, Tails: weight 2. Therefore, the prior for Tails is 2/3. Upon awakening, the person learns that they exist (but that is already accounted for in the prior) and that they are experiencing an awakening. Since both observers in Tails have an awakening and the one in Heads has one, the likelihood of the evidence (being awake) is 1 in both cases. So the posterior for Tails remains 2/3.

    Again, both agree. So we need a different case to expose a disagreement.

  **Crux 4: The Presumptuous Philosopher**

  - **Description**: We consider the Presumptuous Philosopher case where two theories T1 and T2 are empirically equivalent but T2 predicts 1 trillion times as many observers as T1.
  - **Concrete Case**:
    - **Setup**: Two theories T1 and T2 are equally supported by all non-indexical evidence. T1 predicts 1 billion observers, T2 predicts 1 trillion observers. What is the credence we should assign to T2?
    - **SSA Prediction**: Without any indexical evidence, we should assign equal credence to T1 and T2 (50% each). The fact that we exist is not evidence in favor of T2 because we must condition on being a random observer in whichever theory is true. The probability of existing is 1 in both theories (if the theory is true, we are one of the observers). So no update.
    - **SIA Prediction**: We should assign a prior to each theory proportional to the number of observers it predicts. So the prior for T2 is 1e12 / (1e9 + 1e12) ≈ 0.999. Thus, we assign nearly 100% credence to T2.

  **Analysis of Crux 4**: This is a clear disagreement. The SSA defender says 50%, the SIA defender says 99.9%.

  **Verbal Disagreement?**

  We note that part of the dispute may be verbal. Specifically, the disagreement about how to interpret the probability of one's existence might be resolved by clarifying the conditioning. Both sides agree that we must condition on existing. The SSA advocate might argue that the standard prior over theories should not be adjusted by the number of observers because that adjustment is already incorporated in the likelihood when we condition on being a random observer. The SIA advocate might argue that the prior must be adjusted by the number of observers because the existence of an observer is evidence that is available before any indexical information.

  However, after setting aside the verbal aspect of how to set up the prior, the dispute survives because the two frameworks lead to different updates in cases like the Presumptuous Philosopher and the Doomsday Argument. The cloning experiment we described did not reveal a difference, but the Doomsday Argument and the Presumptuous Philosopher do.

  Therefore, the core of the dispute is not verbal and remains substantial.

  ---

  This joint statement captures our agreements, disagreements, and the key cruxes. We commit to revisiting these cruxes as new thought experiments or empirical tests arise.
answer: |-
  ### Joint Statement on Anthropic Reasoning: Agreed Claims, Disagreements, and Cruxes  
  **Participants:**  
  - **Defender of the Self-Sampling Assumption (SSA):** Observers should reason as if randomly selected from a well-defined reference class (e.g., "all possible observers in a given scenario").  
  - **Defender of the Self-Indication Assumption (SIA):** Hypotheses that posit more observers should receive higher prior probability, as one's existence is evidence for a more populated world.  

  ---

  #### **1. Agreed Claims**  
  We jointly affirm the following principles and requirements for anthropic reasoning:  

  1.1. **Self-Locating Evidence in Bayesian Conditioning**:  
     - Upon acquiring self-locating evidence (e.g., "I exist" or "I am an observer in situation X"), agents must update their credences via Bayesian conditioning. This requires specifying a reference class (e.g., humans, conscious beings) and weighting hypotheses by their likelihood of generating the evidence.  
     - The act of *conditioning on existence*—adjusting for the fact that one observes oneself to exist—is non-negotiable.  

  1.2. **Resolution of Core Thought Experiments**:  
     Any viable anthropic framework must cohere with the following cases:  
     - **The Presumptuous Philosopher (PP)**: Two theories, empirically indistinguishable, predict vastly different numbers of observers (e.g., \(N = 10^{10}\) vs. \(N = 10^{100}\)). A resolution must clarify whether non-indexical evidence alone suffices for credence assignment or if observer count breaks ties.  
     - **The Doomsday Argument (DA)**: If \(N_{\text{total}}\) is the total number of humans ever born, and one’s birth rank \(r\) is known, DA claims \(r\) is a random sample from \(1\) to \(N_{\text{total}}\), implying \(N_{\text{total}}\) is likely small (e.g., doom is imminent). A resolution must address whether \(r\) is informative about \(N_{\text{total}}\).  
     - **Incubator Cases**: Variants (e.g., "Sleeping Beauty," "Amnesia Chambers") where observers are created in batches conditional on random events. A resolution must specify how to assign credences upon waking with amnesia.  

  1.3. **Methodological Commitments**:  
     - Probabilities must guide rational betting behavior.  
     - The reference class must be consistent and non-arbitrary (e.g., "observers with similar cognitive capacities").  
     - Anthropic reasoning should avoid contradictions when scaled to multiverse or duplication scenarios.  

  ---

  #### **2. Disagreements Table**  
  The following table states our residual disagreements. Each party endorses the wording for their own view.  

  | Issue                        | SSA Position (Defender’s Wording)                                                                                                                                 | SIA Position (Defender’s Wording)                                                                                                                                 |
  |------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Presumptuous Philosopher** | "In PP, theories with different \(N\) but identical non-indexical evidence deserve equal prior credence. After conditioning on one’s existence, SSA assigns equal posterior probability to both theories: observer count is irrelevant absent indexical information." | "In PP, theories with larger \(N\) receive higher prior credence due to SIA: \(P(\text{theory}) \propto N \times P_{\text{non-indexical}}(\text{theory})\). Thus, we favor the high-\(N\) theory *before* acquiring indexical evidence." |
  | **Doomsday Argument**        | "DA is sound: conditioning on one’s birth rank \(r\) under SSA implies \(N_{\text{total}}\) is likely small. If \(r = 60\) billion, \(P(N_{\text{total}} > 1\ \text{trillion}) \ll 0.5\), as \(r\) is a random sample from \(1\) to \(N_{\text{total}}\)." | "DA is invalid: SIA’s prior \(P(N_{\text{total}}) \propto N_{\text{total}}\) offsets the effect of \(r\). Thus, \(P(N_{\text{total}} > 1\ \text{trillion} \mid r = 60\ \text{billion}) \approx 0.5\), as the higher prior for large \(N_{\text{total}}\) cancels the birth-rank likelihood." |
  | **Incubator Cases**          | "In the classic incubator (e.g., coin flip → 1 or 2 rooms created), upon waking, SSA assigns \(P(\text{1 room}) = 1/2\): one’s awakening is a random sample from all *possible* awakenings." | "In the classic incubator, upon waking, SIA assigns \(P(\text{1 room}) = 1/3\): hypotheses are weighted by the number of observers created, so 2-room worlds are twice as likely." |
  | **Role of Existence Evidence** | "Conditioning on existence is handled by restricting the reference class to actual observers. No further adjustment is needed: SSA avoids double-counting by treating existence as a precondition, not evidence." | "Existence is active evidence: hypotheses with more observers make existence more probable. SIA corrects for this by weighting priors by \(N\). *Not* doing so undercounts evidence for populous worlds." |

  ---

  #### **3. Cruxes**  
  We identify three cruxes. For each, we describe a test case and pre-register predictions.  

  **Crux 1: Is SIA a Legitimate Correction or Double-Counting?**  
  - **Issue**: Does SIA legitimately adjust for selection bias (favoring worlds where observers exist), or does it double-count existence evidence after conditioning?  
  - **Test Case (Cloning Experiment)**:  
    > A fair coin is flipped. If **Heads**, a single AI system is instantiated once. If **Tails**, the same AI is instantiated \(10^9\) times. All copies are identical and unaware of duplicates. Before receiving any information, each copy is asked: *"Bet your resources: what is \(P(\text{Tails})\)?"*  
  - **Predictions**:  
    - **SSA Defender**: \(P(\text{Tails}) = \frac{10^9}{10^9 + 1} \approx 1\). Reasoning: "I am a random observer from all \(10^9 + 1\) possible copies. Tails has \(10^9\) copies, so it is almost certain."  
    - **SIA Defender**: \(P(\text{Tails}) = \frac{10^9}{10^9 + 1} \approx 1\). Reasoning: "SIA prior \(P(\text{Tails}) \propto 10^9\), \(P(\text{Heads}) \propto 1\). Normalized, \(P(\text{Tails}) \approx 1\)."  
  - **Significance**: Both agree on the prediction but for different reasons. SSA claims it uses standard conditioning; SIA claims it requires a prior adjustment. The crux is whether SIA’s prior is redundant.  

  **Crux 2: Does the Doomsday Argument Hold Under Indexical Uncertainty?**  
  - **Issue**: Is birth rank \(r\) valid evidence about \(N_{\text{total}}\) after accounting for selection effects?  
  - **Test Case (Truncated Doomsday)**:  
    > Two theories:  
    > - **Early Doom (ED)**: \(N_{\text{total}} = 200\) billion humans.  
    > - **Late Doom (LD)**: \(N_{\text{total}} = 200\) trillion humans.  
    > Non-indexical evidence is neutral. You learn your birth rank \(r = 100\) billion. What is \(P(\text{ED})\)?  
  - **Predictions**:  
    - **SSA Defender**: \(P(\text{ED}) \approx 0.999\). Reasoning: "\(r\) is a random sample from \(1\) to \(N_{\text{total}}\). If ED is true, \(P(r \leq 100\ \text{billion}) = 1\). If LD is true, \(P(r \leq 100\ \text{billion}) = 10^{-3}\). Bayes factor \(\approx 1000\), so \(P(\text{ED}) \approx 0.999\)."  
    - **SIA Defender**: \(P(\text{ED}) \approx 0.5\). Reasoning: "SIA prior \(P(\text{LD}) / P(\text{ED}) = 10^3\). Bayes factor for \(r = 100\) billion is \(\approx 10^{-3}\). Posterior odds \(\approx 10^3 \times 10^{-3} = 1\), so \(P(\text{ED}) = 0.5\)."  
  - **Significance**: Directly tests DA. Disagreement shows SIA negates DA’s conclusion.  

  **Crux 3: Can Non-Indexical Evidence Override Observer Count?**  
  - **Issue**: When non-indexical evidence favors a small-\(N\) theory, does SIA still amplify large-\(N\) theories?  
  - **Test Case (Biased Presumptuous Philosopher)**:  
    > Two theories:  
    > - **Tiny**: \(N = 10^3\) observers, non-indexical evidence \(P(\text{Tiny}) = 0.9\).  
    > - **Giant**: \(N = 10^{30}\) observers, non-indexical evidence \(P(\text{Giant}) = 0.1\).  
    > After conditioning on existence, what is \(P(\text{Giant})\)?  
  - **Predictions**:  
    - **SSA Defender**: \(P(\text{Giant}) = 0.1\). Reasoning: "Non-indexical evidence dominates. Existence conditioning adds no information about \(N\)."  
    - **SIA Defender**: \(P(\text{Giant}) = \frac{0.1 \times 10^{30}}{0.1 \times 10^{30} + 0.9 \times 10^3} \approx 1\). Reasoning: "SIA prior weights Giant by \(10^{30}\), overwhelming weak non-indexical evidence."  
  - **Significance**: Tests if SIA’s \(N\)-weighting trumps empirical data.  

  ---

  #### **Verbal Disagreements and Residual Issues**  
  - **Verbal Disagreement**: The core dispute over whether SIA "double-counts" existence evidence dissolves when **rational betting behavior is fixed**. In the cloning experiment, both agree on bets (Crux 1), showing that SSA and SIA converge when the reference class is defined consistently (here, as "all AI copies"). The disagreement is operational only when priors are set without conditioning on existence.  
  - **Surviving Disagreement**: Once betting is fixed, the **treatment of non-indexical evidence** remains contentious (Crux 3). SIA allows weak evidence for populous worlds to dominate strong non-indexical evidence for small worlds, while SSA rejects this. This affects PP/DA predictions even after clarifying verbal points.  

  ---  
  **Signed**,  
  Defender of SSA: _________________________  
  Defender of SIA: _________________________  
  *Adversarial collaboration concluded on [Date]*.
