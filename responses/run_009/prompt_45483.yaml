answer: |-
  ### Translation of Gongsun Long's "White Horse is Not a Horse"  
  Your hypothesis is largely correct. Below, I translate each of Gongsun Long's three moves into type-theoretic vocabulary, then analyze the residue. I assume a nominal type system (like Java/Scala) unless specified, as structural typing (like TypeScript) would trivialize some arguments.

  #### **Move 1: Color-and-Shape vs. Shape**  
  *Claim*:  
  "馬" (horse) names the shape (type `Horse`). "白" (white) names a color (type `White`). A phrase naming both ("white horse") does not name the shape alone.  

  *Type Translation*:  
  ```scala  
  trait Horse // Nominal type for "shape"  
  trait White // Nominal type for color property  

  type WhiteHorse = Horse & White // Intersection type  
  ```  
  Gongsun argues:  
  - `WhiteHorse` is **not type-equivalent** to `Horse`: `WhiteHorse =!= Horse`.  
  - Why? `WhiteHorse` requires satisfying `White`, while `Horse` does not.  
  - In nominal typing, `Horse` and `WhiteHorse` are distinct types by definition.  

  *Your Vocabulary*:  
  - **Type Identity**: `WhiteHorse` ≠ `Horse` is uncontroversial.  
  - **Subtyping**: Unaddressed here (see Move 2).  

  ---

  #### **Move 2: Extension (Admissible Values)**  
  *Claim*:  
  If you request a `Horse`, you accept `YellowHorse` or `BlackHorse`. If you request a `WhiteHorse`, you reject non-white horses. Thus, the sets differ.  

  *Type Translation*:  
  ```scala  
  val yellowHorse: Horse = new Horse {} // Valid  
  val whiteHorse: WhiteHorse = new Horse with White // Valid  

  def requireHorse(h: Horse): Unit = {}  
  def requireWhiteHorse(wh: WhiteHorse): Unit = {}  

  requireHorse(yellowHorse) // ✅  
  requireHorse(whiteHorse)  // ✅ (by subsumption)  
  requireWhiteHorse(yellowHorse) // ❌ Fails: YellowHorse </: WhiteHorse  
  ```  
  Gongsun argues:  
  - `WhiteHorse <: Horse` (subtyping holds), but **not vice versa**.  
  - Extensionally, `WhiteHorse ⊂ Horse` (proper subset).  

  *Your Vocabulary*:  
  - **Subtyping**: `WhiteHorse <: Horse` is true, but `Horse </: WhiteHorse`.  
  - **Extensional Difference**: Values of `WhiteHorse` are a strict subset of `Horse`.  

  ---

  #### **Move 3: Compositionality**  
  *Claim*:  
  If horses had no color (`ColorlessHorse`), there would be "nothing but horses." A white horse is `Horse + White`, and `Horse + White` ≠ `Horse`.  

  *Type Translation*:  
  ```scala  
  type ColorlessHorse = Horse // Hypothetical "pure" horse  
  type WhiteHorse = Horse & White // "Horse + White"  
  ```  
  Gongsun argues:  
  - `WhiteHorse` is a **refinement** of `Horse` (via `White`).  
  - Refinement types add constraints: `WhiteHorse = Refined Horse { isWhite: true }`.  
  - Thus, `WhiteHorse` and `Horse` aren't identical: `WhiteHorse ≢ Horse`.  

  *Your Vocabulary*:  
  - **Refinement Types**: `WhiteHorse` is `Horse` with an added predicate.  
  - **Composition**: `WhiteHorse` is a derived type, not a primitive one.  

  ---

  ### **Residue Report**  
  #### Your Diagnosis Holds  
  Gongsun conflates three distinct questions:  
  1. **Type Identity** (`WhiteHorse =?= Horse`).  
  2. **Subtyping** (`WhiteHorse <:? Horse`).  
  3. **Denotation** (What does the name "horse" refer to?).  

  Your vocabulary cleanly separates these:  
  | Concept          | Type Theory                 | Gongsun's Conflation       |  
  |------------------|----------------------------|----------------------------|  
  | Type Identity    | `WhiteHorse =!= Horse`     | Treats as primary claim.   |  
  | Subtyping        | `WhiteHorse <: Horse`      | Uses extensional evidence. |  
  | Denotation       | `Horse` ≈ shape concept    | Assumes names fix meaning. |  

  #### The Residue: Two Key Gaps  
  1. **Nominal Typing vs. "Natural Kinds"**:  
     - Gongsun assumes names (`horse`, `white`) directly map to "natural" semantic concepts (shape, color).  
     - In type theory, whether `WhiteHorse <: Horse` is **arbitrary**:  
       - Nominal: Designer decides (e.g., `class WhiteHorse extends Horse`).  
       - Structural: `{ shape: HorseShape }` subsumes `{ shape: HorseShape, color: White }`.  
     - **Residue**: His argument assumes a "natural" denotation for names, while type theory treats it as conventional/structural.  

  2. **Epistemic vs. Type Composition**:  
     - Gongsun claims "horse" must exclude color to be "pure."  
     - In type theory, `Horse` can **optionally** include color:  
       ```haskell  
       data Horse = Horse { shape :: HorseShape, color :: Maybe Color }  
       ```  
     - **Residue**: He presumes types are defined by necessary/sufficient conditions (like Aristotelian essences), while types can be extensible records.  

  #### Verdict  
  - **No Fundamental Gap**: All three moves translate into standard type theory.  
  - **Clarity of Original**: Gongsun's claim is clear but relies on pre-theoretic assumptions about naming and essence. Your vocabulary exposes where his reasoning is contingent (e.g., nominal typing + essentialism).  
  - **Defect?**: Not in your vocabulary. The residue arises from his implicit metaphysics, not expressivity limits of type theory.  

  ---

  ### **Companion Thesis: Hardness and Whiteness**  
  *Claim*:  
  硬 (hardness) and 白 (whiteness) are "mutually external." The eye sees whiteness without hardness; the hand feels hardness without whiteness. Thus, they never co-occur in perception.  

  *Type Translation*:  
  ```haskell  
  -- Stone as a carrier of properties  
  data Stone = Stone { color :: Color, texture :: Texture }  

  -- Typeclasses for perceivable properties  
  class PerceivesWhite a where  
    perceiveWhite :: a -> Color  

  class PerceivesHard a where  
    perceiveHard :: a -> Texture  

  -- Perception functions (separate modalities)  
  see :: Stone -> (PerceivesWhite s => s -> Color)  
  see s = perceiveWhite s  -- Only sees color  

  touch :: Stone -> (PerceivesHard s => s -> Texture)  
  touch s = perceiveHard s -- Only feels texture  
  ```  
  Gongsun argues:  
  - No single perception yields both properties:  
    - `see` returns `Color` but not `Texture`.  
    - `touch` returns `Texture` but not `Color`.  
  - Thus, hardness and whiteness are **orthogonal**.  

  #### Residue Analysis  
  - **Translatable**:  
    - The properties are independent typeclasses/constraints.  
    - Perception functions use partial type constraints (only one at a time).  
  - **Gap**:  
    - Type theory allows **joint constraints**:  
      ```haskell  
      describe :: (PerceivesWhite s, PerceivesHard s) => s -> String  
      describe s = show (perceiveWhite s) ++ show (perceiveHard s)  
      ```  
    - Gongsun’s claim is about **epistemic access** (senses are modular), not about whether properties coexist.  
  - **Residue**: His thesis is **empirical** (how perception works), not logical. Type theory can model the properties coexisting in `Stone`, even if they’re perceived separately.  

  #### Conclusion for Companion Thesis  
  - **Type Theory Captures Orthogonality**: Hardness and whiteness can be independent traits.  
  - **Residue**: His "mutual externality" is about sensory modalities, not type constraints. No type-system barrier prevents `Stone` from having both. The gap is empirical, not expressible in types alone.
