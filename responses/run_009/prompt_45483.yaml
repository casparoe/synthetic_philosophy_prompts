  However, the conclusion is that the two attributes are "mutually external", meaning they are independent and not necessarily coexistent in the same object? Or that they are perceived separately and hence are distinct?

  In type theory, we can model the stone as having both properties. The fact that we have separate functions to access them is normal. But note: the thesis seems to go further: that the hardness and whiteness are never jointly perceived. But that is about the perceptual process, not about the stone. 

  Alternatively, we might think of the stone as a product type:

  ```haskell
