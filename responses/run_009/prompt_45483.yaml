  ```

  Then, when we look at the stone, we get the `whiteness` field, and when we touch it, we get the `hardness` field. But we are getting two different projections of the same stone.

  So the thesis does not challenge the existence of a stone having both. It only says that in perception, we never get both at the same time. But that is a fact about the limitations of perception, not about the properties.

  However, the conclusion that the two attributes are mutually external might be interpreted as: the type `Hard` and `White` are independent and can exist without each other. But that doesn't follow from the perceptual argument.

  Another interpretation: perhaps the stone is a carrier of multiple universals (whiteness, hardness) and these universals are separate. So the stone is a collection of attributes that are not necessarily bundled. This might be modeled as:

