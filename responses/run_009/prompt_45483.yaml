  Thus, the residue is minimal. The original claim is clear in the type-theoretic vocabulary. The confusion arises because in natural language we use "is" ambiguously (for subtyping vs. type identity). In type theory, we have distinct terms for these.

  Companion thesis: Hardness and Whiteness of a stone.

