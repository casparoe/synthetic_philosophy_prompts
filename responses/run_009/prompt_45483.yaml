  data Attribute = White | Hard | ... 
  ```

  But then a stone can have both `White` and `Hard` in its list.

  The claim that they are never given together in perception does not imply they are not together in the stone.

  So, can we translate the thesis into typeclass constraints? Suppose we have:

  ```haskell
  class White a where
      whiteness :: a -> WhiteValue

  class Hard a where
      hardness :: a -> HardValue
  ```

  Now, for a stone that is both white and hard:

  ```haskell
  instance White Stone where ...
  instance Hard Stone where ...
  ```

  We can check each constraint separately. And indeed, we can have a function for the eye that requires `White` and a function for the hand that requires `Hard`. But we can also have a function that requires both:

  ```haskell
  describe :: (White a, Hard a) => a -> String
  describe x = "White: " ++ show (whiteness x) ++ ", Hard: " ++ show (hardness x)
  ```

  So the typeclass constraints can be checked jointly.

  Therefore, the thesis does not translate into a type system feature that forbids having both constraints at once. Instead, the thesis is about the perceptual process: that we don't have a sense that perceives both at the same time. But that is an empirical claim, not a type system constraint.

  Residue: The companion thesis leaves a residue in the type system. We can model a stone that is both hard and white, and we can write functions that use both properties. The thesis is about the epistemology of perception: how we come to know the properties, not about the properties themselves. So in the type system, there is no counterpart to the idea that two properties are "mutually external" in the sense that they cannot be jointly known or that they are inherently separate in a way that forbids their conjunction. 

  However, note: if we interpret the thesis as saying that hardness and whiteness are orthogonal and can exist independently, then we can model them as independent type classes. But that doesn't prevent an instance from having both.

  Thus, the residue is that the thesis is making an epistemological point (about how we perceive) and a metaphysical point (that the attributes are separate universals) that go beyond the type system. The type system can model the joint possession of attributes without any problem.

  Conclusion: 
  - The white horse argument translates cleanly into type-theoretic terms with no significant residue. 
