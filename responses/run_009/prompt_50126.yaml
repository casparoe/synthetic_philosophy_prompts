answer: |-
  My dear colleague,

  Your questions cut to the heart of a profound tension within climate policy analysis. Let us dissect the implicit theory of intergenerational justice presupposed by the standard discounting practice, particularly the use of a positive pure rate of time preference (PRTP). This practice translates future damages and benefits into present consumption equivalents, applying a discount rate that often includes a component explicitly valuing welfare occurring later *less* simply because it occurs later. The theory this presupposes is not primarily one of lesser moral status for future people *per se*, but rather a consequentialist framework heavily skewed towards the present generation's perspective.

  Analysts defending a positive PRTP frequently ground it in descriptive, rather than prescriptive, claims: modelling the observed impatience of *current* individuals (revealed preference), or accounting for the exogenous risk of human extinction. On this view, discounting reflects the opportunity cost of capital or the probability of non-existence, not a judgment that the well-being of someone born in 2125 is intrinsically less valuable. However, this descriptive defence masks a crucial normative commitment: the assumption that the preferences and circumstances of the *present* generation are the legitimate basis for evaluating policies affecting vastly different future populations. It implicitly accepts that present preferences for immediacy, even if those preferences disadvantage distant future individuals who have no voice in the decision, should govern long-term outcomes. This elevates the descriptive impatience of today into a normative principle for tomorrow, effectively *treating* future people as mattering less in the calculus, even if not explicitly *stating* they have lesser moral status.

  This clashes starkly with governmental commitments to intergenerational equity and sustainable development, which imply an obligation to leave future generations with opportunities no worse than our own – a principle fundamentally incompatible with heavily discounting their welfare. The tension is inherent and severe. The analysis, by shrinking future harms through discounting, systematically undervalues the long-term consequences of present inaction, contradicting the spirit of those declarations. It prioritizes current consumption over the basic welfare and survival prospects of future populations, violating the equity principles governments nominally endorse.

  The non-identity problem intensifies this inconsistency. If different climate policies (e.g., high emissions vs. rapid mitigation) lead to entirely different future populations due to altered circumstances affecting who is born when, then asking "who is wronged?" by discounting becomes complex. A policy discounted as "optimal" might create a future population that exists *only* because of that policy and is worse off than a hypothetical population under a different policy *would* have been. However, since that better-off population never exists, can we say the actual future people created were wronged? Standard discounting largely ignores this, assuming a fixed, identifiable future population whose welfare is being discounted. When discounting leads to policies causing avoidable future suffering for the population that *does* come into existence (e.g., a hotter, more unstable world), those future individuals *are* wronged – they suffer harms that could have been prevented by a less discounted valuation of their welfare. The wrong lies in the present generation's failure to accord sufficient weight to the severe, preventable harms their descendants will endure, even if those descendants are non-identical to those who would have existed otherwise. Discounting obscures this failure by making those massive future harms appear small today.

  Reconstructing the implicit theory reveals a consequentialism constrained by presentism: future welfare counts, but its weight diminishes rapidly over time based on factors tied to the present generation's perspective (impatience, perceived risks). This is internally inconsistent with the stated ideals of intergenerational equity. It presupposes a weak obligation to the future, easily overridden by present gains or preferences.

  If we rebuilt the practice on the assumption that date of birth is morally irrelevant – meaning a unit of welfare has the same intrinsic value whenever and to whomever it occurs – the cost-benefit apparatus would need radical surgery. The PRTP would have to be set to zero. This doesn't eliminate discounting entirely, but fundamentally changes its basis:
  1.  **Opportunity Cost Remains:** Discounting could still reflect the opportunity cost of capital – the potential return on investment if resources weren't used for climate mitigation. If investing in education or infrastructure today yields high returns that benefit future generations *more* than a specific climate investment, that could justify a discount rate reflecting that real economic trade-off. This is the "Ramsey rule" consumption discount rate, driven by projected economic growth and inequality aversion, but *not* pure time preference.
  2.  **Risk Adjustments:** Discounting could incorporate genuine risks – not the metaphysical "risk of existence" tied to time itself (which vanishes with zero PRTP), but specific, quantifiable risks like the probability of technological breakthroughs rendering current investments obsolete, or catastrophic events *unrelated* to the mere passage of time.
  3.  **The Challenge of Declining Discount Rates (DDRs):** A zero PRTP alone might not suffice. With positive economic growth projected far into the future, a constant discount rate based only on opportunity cost could still undervalue very long-term catastrophic risks (like sea-level rise centuries hence). DDRs, which decrease over time, are often proposed as a patch. They partially reflect uncertainty about the distant future (e.g., uncertainty over the very long-term growth rate used in the Ramsey formula) or attempt to give more weight to the very long term intuitively. While imperfect and sometimes lacking a rigorous theoretical foundation, DDRs *could* be part of a reformed apparatus attempting to give more weight to the far future without a PRTP. However, they are not strictly *required* by the zero PRTP assumption; they are an additional adjustment attempting to address perceived shortcomings of constant long-term discounting even without time preference.

  Could CBA survive? Yes, but transformed. The focus would shift dramatically towards evaluating long-term consequences using a near-zero or zero PRTP and a DDR reflecting genuine uncertainty about future economic conditions. Valuing catastrophic risks and non-market damages (ecosystem loss, existential threats) would become even more critical, as their massive future impacts would no longer be shrunk to near-nothing by discounting. The analysis would inherently prioritize avoiding severe, irreversible harms to future generations over marginal present consumption gains, aligning far better with sustainability principles. It would force a much starker confrontation with the true long-term costs of inaction. The apparatus survives, but its outputs would demand radically different policy choices, truly reflecting the idea that the date of one's birth does not diminish one's moral claim to a livable planet.

  Yours in pursuit of clarity on this critical matter.
