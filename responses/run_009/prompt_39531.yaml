answer: |-
  ## The Pasadena Sestina

  The coin spins up. On **heads**, the gamble starts.
  A flick of chance consigns reward to **tails**?
  First toss: a bright, unquestioned **gain** of two.
  But next, if fate delays, awaits a **loss**.
  We tally outcomes, seek a final **sum**,
  Bound by the strict progression of **sequence**.

  The second toss demands a strict **sequence**:
  If **heads** appears now, payment's flipped. It fails
  To match first hopes; the register shows **loss**.
  Averted once, the coin still favoring **tails**
  Demands we wade through fractions. Does the **sum**
  Still promise net advantage, steady **gain**?

  For later rounds, the prospect of pure **gain**
  Grows vast but fades with each postponed **sequence**.
  The potent prize, divided, shrinks the **sum**.
  On toss three, **heads** brings eight-thirds, a strained
  But positive return. Yet longer **tails**
  Accumulates the risk of deeper **loss**.

  The fourth flip, **heads**: a payment cut. The **loss**
  Is four. Each term's expected value? A **gain**
  Of sorts, perhaps: plus one, then minus. **Tails**
  Persists, deferring hope. The **sequence**
  Extends the game. Where **heads** might fall, the **sum**
  Shifts wildly, though the partial counts still climb.

  The alternating pattern claims the **sum**
  Converges! But the ledger hides the **loss**
  Of simple meaning. Shuffle the **sequence**:
  Where clustered positives inflate the **gain**,
  Then grouped negatives impose their **loss**,
  The total bends. It answers not to **tails**

  Nor **heads** alone, but to the ordered **tails**
  Of happenstance. The very notion **sum**
  Dissolves. The price is hostage to the **sequence**.
  No single value waits behind the **gain**
  Or lurks within the specter of the **loss**.
  The game itself defies a settled **sum**.

  **(Envoi)**
  The coin itself knows neither **gain** nor **loss**,
  No fixed result from **heads** or run of **tails**.
  It yields its fragments. Only **sequence**,
  Imposed by choice, not chance, constructs the **sum**.
  No hidden truth exists. The final **sum**
  Depends on how you count the **sequence**.

  ---

  **Structural Blueprint & Philosophical Execution:**

  1.  **End-Word Selection & Rationale:**
      *   `heads`: Represents the terminating event, the payoff trigger.
      *   `tails`: Represents continuation, deferral of payoff, the path leading to later terms.
      *   `gain`: Represents positive payoffs (+2, +8/3, etc.).
      *   `loss`: Represents negative payoffs (-2, -4, etc.).
      *   `sum`: Represents the running total, the central question of "what is it worth?".
      *   `sequence`: Represents the *ordering* of the terms, the crucial, non-privileged variable. This is the most critical word, embodying the rearrangement theorem.

  2.  **Stanzaic Permutation & Running Total Drift (Illustrating Rearrangement):**
      *   *(Standard Alternating Order ≈ ln(2) ≈ 0.693)*
      *   **Stanza 1 (1-2-3-4-5-6):** `heads`, `tails`, `gain`, `loss`, `sum`, `sequence`
          *   *Tone:* Initial setup, naive optimism. Focus on immediate `gain`.
          *   *Sum Implied:* Starting positive (+2). Ends hinting at deferred resolution (`sequence`).
      *   **Stanza 2 (6-1-5-2-4-3):** `sequence`, `heads`, `sum`, `tails`, `loss`, `gain`
          *   *Tone:* Shifting perspective. `Sequence` leads. `Heads` brings payment but context (`sequence`) matters. `Loss` precedes `gain`, introducing negativity earlier.
          *   *Sum Drift:* Introduction of `loss` sooner suggests potential dip below initial `gain`.
      *   **Stanza 3 (3-6-4-1-2-5):** `gain`, `sequence`, `loss`, `heads`, `tails`, `sum`
          *   *Tone:* Fragmentation. `Gain` is tied to `sequence`, then immediately countered by `loss`. `Heads` appears isolated. `Sum` is the final, unstable focus.
          *   *Sum Drift:* `Gain` immediately countered by `loss` (`sequence` forcing negatives together?) suggests instability, potential for lower `sum`.
      *   **Stanza 4 (5-3-2-6-1-4):** `sum`, `gain`, `tails`, `sequence`, `heads`, `loss`
          *   *Tone:* Questioning the `sum`. `Gain` seems positive, but `tails` defers it, dominated by `sequence`. `Heads` brings only `loss` here. The `sum` is now explicitly "wild".
          *   *Sum Drift:* `Loss` at the end, following deferred `gain` and dominant `sequence`, strongly suggests a negative or much lower value.
      *   **Stanza 5 (4-5-1-3-6-2):** `loss`, `sum`, `heads`, `gain`, `sequence`, `tails`
          *   *Tone:* `Loss` leads, coloring the `sum`. `Heads` brings `gain`, but `sequence` controls and `tails` persists. The `sum` "dissolves".
          *   *Sum Drift:* Starting with `loss` frames everything negatively. `Gain` feels muted. The core message is the dependence on `sequence` and the dissolution of a fixed `sum`.
      *   **Stanza 6 (2-4-6-5-3-1):** `tails`, `loss`, `sequence`, `sum`, `gain`, `heads`
          *   *Tone:* `Tails` (continuation) linked directly to `loss` and `sequence`. The `sum` is now explicitly a construct ("bends", "answers not"). `Gain` and `heads` feel distant effects, not the defining factors.
          *   *Sum Drift:* The `sum` is entirely subservient to `sequence`, not the outcomes (`heads`/`tails`, `gain`/`loss`) themselves.
      *   **Tercet/Envoi (2-5 / 4-3 / 6-1):** `tails`, `sum` / `loss`, `gain` / `sequence`, `heads`
          *   *Philosophical Point:* Directly states the core paradox. The coin (`heads`/`tails`) doesn't contain the value (`gain`/`loss`). The `sum` *only* exists when a `sequence` is imposed ("Only sequence... constructs the sum"). "No hidden truth exists." The final couplet drives it home: the `sum` depends entirely on the `sequence`. Resolution is impossible without imposition.

  3.  **How the Form Does the Work:**
      *   **Identical Materials, Shifting Meaning:** The same six concepts appear in every stanza, just like the same infinite series of terms (±1/n) exists. Their *order* of appearance radically changes the narrative flow and the implied value (`sum`), mirroring how rearranging the series changes its sum.
      *   **Running Total Ambiguity:** The poem tracks the *feeling* of the running total – starting hopeful, dipping, becoming unstable, dissolving – without ever stating a number. This mirrors the conditional convergence: the partial sums oscillate and their limit depends on the path (sequence).
      *   **Envoi as Synthesis:** The forced inclusion of all six words in three lines, using the final permutation, forces the key concepts into collision, culminating in the explicit statement that the `sequence` constructs the `sum`. This is the Riemann Rearrangement Theorem in poetic action.
      *   **No Resolution:** The poem ends by restating the dependence on `sequence`, closing the loop without providing an answer, embodying the paradox itself. The form inherently prevents resolution through its cyclical permutations.

  **The Paradox Embodied:** The sestina's strict permutation rule *is* the arbitrary ordering of the series. The instability of the `sum` across stanzas *is* the conditional convergence. The envoi's declaration *is* the theorem's consequence: value is imposed, not discovered. The form isn't decoration; it's the demonstration.
