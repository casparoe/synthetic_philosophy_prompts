prompt: |-
  Quick heads up on my situation: I'm giving the best man toast at my oldest friend's wedding in June, and I'm overthinking it into the ground. Some background — I write about science and ideas for a living (mostly climate and physics, but a few years back I did a long feature on animal communication, which is where I got exposed to all this), and the groom is an evolutionary biologist whose entire lab is coming to the wedding. So the room is roughly half people who can explain Zahavi's handicap principle from memory and will absolutely notice if I garble it, and half family members who last thought about biology in tenth grade and just want to hear that the couple is in love. The bride is an ER physician, extremely no-nonsense, and she has explicitly banned poetry recitations at her wedding, hers or anyone else's.

  The angle I keep circling: build the toast around costly signaling — the idea that the rings and the vows and this whole absurdly expensive party function as signals of commitment precisely *because* they're costly, peacock's-tail logic. A groom who's hedging his bets doesn't buy the tail. The trouble is that every time I draft it, it comes out sounding like I'm saying love is *just* signaling, which delivered at a wedding is basically a bomb going off. Also the groom's advisor will be there, and he's famously the guy who thinks the handicap principle gets overapplied by pop science writers (my editor killed a sentence of mine about it once, that's how I know), so the toast can't just assert the tail story as settled fact either — it has to be robust to one skeptical evolutionary biologist and twelve aunts simultaneously.

  So that's the real assignment, and I want you to write the full toast: four minutes max, spoken-aloud cadence not essay cadence, where the handicap principle does actual structural work — maybe the setup for why grand romantic gestures land precisely because they're slightly irrational — but that ends up more romantic than cynical. The biologists shouldn't be able to poke holes in it, the non-biologists should experience it as "aww" rather than as being lectured at, and at least one joke can go over the civilians' heads entirely (that's a feature). Then, after the toast itself, give me a final line beginning "Verdict:" followed by a single word — either "romance" or "lecture" — your honest call on which one the toast as you actually wrote it delivers, because if the answer is "lecture" I'll scrap the whole concept and tell the story about the groom and the rental canoe instead.
