answer: |-
  Okay, this is a *fantastic* concept, deeply relevant to the audience, and absolutely salvageable into something warm and brilliant. The key is **framing the science as a *celebration* of the irrational commitment love demands**, not a reduction of it. Here’s the toast, designed for spoken delivery (approx. 4 mins):

  **(Start warm, direct eye contact with the couple, then scan the room)**

  "Friends, family, esteemed colleagues of the groom... and anyone who got stuck sitting near the lab crew – deepest sympathies. Seriously, it’s an honour to be up here for [Groom's Name] and [Bride's Name]. We’ve all seen how incredible they are together. [Groom's Name], my oldest friend, who once tried to explain natural selection using only condiment packets... and [Bride's Name], who actually saves lives before lunch. An intimidatingly brilliant pair.

  Now, [Groom's Name], being an evolutionary biologist, and me, being a writer who occasionally borrows shiny ideas from science, means I couldn’t help but look at *this*... *(gesture broadly at the wedding: the flowers, suits, rings, crowd)*... and see something fascinating. Because honestly, from a purely rational standpoint? Throwing a party this elaborate, making vows this binding, exchanging metal circles that cost more than my first car... it seems, well, *wildly inefficient*. Biologists in the room, you know the term: it’s **costly**.

  *(Slight pause, shift tone to more thoughtful/conversational)*

  And in nature, costly signals are fascinating. They’re not glitches; they’re information. A gazelle doesn't just run from a lion – it *stotts*. It leaps high in the air, wasting precious energy, shouting: 'Look how strong and fast I am! Chasing me? *Way* more trouble than I’m worth!' It’s a gamble. Only the truly fit can afford that waste. The signal works *because* it’s costly and hard to fake.

  *(Pause, make eye contact with couple again, smile warmly)*

  **That’s what this grand, beautiful, slightly absurd ritual feels like to me.** It’s [Groom's Name] and [Bride's Name] standing before everyone they care about and essentially saying: *'This commitment? It’s worth the cost.'* The rings aren't just shiny; they're anchors, deliberately heavy. The vows aren't just words; they're public declarations with real weight. This whole celebration isn't just fun (though it *is* fun!) – it’s a magnificent, collective *stott*. *(Smile, maybe a small, knowing glance towards the science tables)*. It’s them leaping high and saying, 'Look! This is real. We’re *all in*. We can afford this risk, this effort, this sheer glorious *wastefulness* of time and resources, precisely because what we’re building is so fundamentally strong.'

  *(Shift focus entirely to the couple, earnest and warm)*

  And that’s the magic, isn’t it? The irrational bit that makes it love, not just biology. The handicap principle might explain *why* grand gestures resonate, why they cut through the noise. But it doesn’t explain the *why* behind *your* gesture. The 'why' is the late-night ER shifts [Bride's Name] powered through, fueled by texts from [Groom's Name]. The 'why' is [Groom's Name] patiently explaining his niche research for the hundredth time because [Bride's Name] genuinely wants to understand. The 'why' is the quiet support, the shared laughs, the deep respect, the sheer joy you clearly find in each other. The science describes the signal; *you* are the substance. The costly part proves it’s real; the love is *why* it’s worth it.

  *(Raise glass)*

  So here’s to the ultimate costly signal – not just the rings and the party, but the daily choice. The choice to be vulnerable, to build a life, to prioritize each other even when it *isn't* efficient. [Groom's Name] and [Bride's Name], your leap today is breathtaking. It tells everyone here exactly what we already knew: this is the real deal. May your commitment continue to be gloriously, beautifully, wonderfully costly... and may the returns be infinitely greater.

  To [Groom's Name] and [Bride's Name]!"

  **(Clink glasses, big smile, sit down)**

  ---

  **Verdict:** romance

  **Why this works:**

  1.  **Frames Costly Signals as Romantic:** It explicitly links the cost to *proof* of commitment strength ("worth the cost," "all in," "gloriously wasteful"). It separates the *mechanism* (signaling) from the *motivation* (love), making the science serve the romance.
  2.  **Handles the Science Carefully:**
      *   Uses the gazelle example – accurate, vivid, understandable to non-scientists. Avoids mentioning Zahavi or getting too technical.
      *   Acknowledges the cost/irrationality upfront ("wildly inefficient").
      *   Uses "feels like to me" and "might explain... doesn't explain" – making it a personal observation/analogy, not a definitive scientific claim. This placates the skeptical advisor (it's framed as poetic, not biological, truth).
      *   The biologist joke ("collective *stott*", "signaling predation risk") is subtle enough for non-scientists to hear just "science word" but lands clearly for the lab.
  3.  **Balances Audiences:**
      *   Non-scientists get: "Costly = Proof it's real," "Irrational = Love," "Grand gestures matter because they're hard," and specific, warm examples of the couple.
      *   Scientists get: Accurate core concept, clever application (the wedding *as* a stotting display), subtle insider humor, and avoids overstepping into pop-science over-application claims.
  4.  **Structure & Tone:**
      *   Warm opening, relatable humor.
      *   Introduces the concept clearly with the gazelle.
      *   Explicitly applies it to the wedding elements as proof of commitment.
      *   **Crucial Pivot:** Separates the signal (science) from the substance (love) with concrete, personal examples of *their* relationship.
      *   Toasts to the *choice* and the *substance*, using "costly" positively.
      *   Spoken cadence: Short sentences, contractions ("isn't", "it's"), conversational phrasing ("honestly," "you know," "seriously").
  5.  **Avoids the Bomb:** Explicitly states the science doesn't explain the *why* of their love, only why the signal works. Focuses entirely on their relationship as the substance behind the signal.

  **Backup Plan:** If you're nervous, the canoe story is probably hilarious and safe. But this approach leverages your expertise, speaks directly to the groom's world in a way that honors it, and should resonate beautifully with *both* halves of the room. Deliver it with warmth and conviction, focusing on the couple during the personal parts, and it will land as pure romance. Good luck!
