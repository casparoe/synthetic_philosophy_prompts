  Ah, and about deck-stacking... The user's instinct is sharp. Epigraphs stating bald generalizations will inevitably look reductive compared to rich narratives. But perhaps that's the point? The best covering-law defenders (like Weber) acknowledge probabilistic tendencies, not iron laws. Maybe the epigraphs should reflect that - use "tends to" language rather than deterministic claims.

