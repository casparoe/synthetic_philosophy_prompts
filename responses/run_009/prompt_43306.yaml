answer: |-
  Right then, let's get stuck in. As requested: a translation of the Mary's Room positions into your craft vocabulary, followed by a frank residue report. No quiet rewiring, promise. I'll flag the distortions.

  **The Philosophical Positions Translated into Craft Vocabulary:**

  1.  **Frank Jackson's Original Claim (Mary gains new *factual* knowledge):**
      *   **Craft Translation:** When Mary steps out and sees red for the first time, it's like a reader finally *experiencing* a scene the narrative has only ever *told* them about. Before, the narration (or her neuroscience textbooks) gave her every objective, external fact *about* the sensory experience ("Character A's pupils dilated, blood pressure increased, they emitted soundwave pattern X labelled 'red'"). This is pure *telling*. Stepping out is the ultimate *showing*. She gains access to the raw, unfiltered **interiority** of the experience itself – the "what-it's-like-ness" from the *inside*, rendered in real-time sensory detail. This new knowledge is a distinct piece of information, a new "fact" about the world (specifically, about subjective experience) that was utterly inaccessible through the detached, third-person, objective *telling* of the scientific description.
      *   **Distortion Flagged:** Philosophers debate if this "what-it's-like-ness" is a *fact* in the same way "wavelength 650nm" is a fact. Craft might call it "vivid sensory detail" or "lived experience," which feels less like a *propositional fact* and more like a *mode of presentation*. The philosophical claim is stronger: it's asserting a fundamental *gap* in objective knowledge.

  2.  **The Ability Hypothesis (Mary gains new *abilities*, not new facts):**
      *   **Craft Translation:** What Mary gains isn't a new *fact* stored in her mental library, but a suite of **craft skills** she can now *perform*. She gains the *ability* to: **Imagine** red accurately (without the room, she could only imagine *that* red occurs under certain conditions, not *how* it feels/looks). **Recognise** red instantly and non-inferentially (like spotting "telling" in a draft instinctively). **Recall** the experience vividly. Crucially, this is *exactly* the craft claim: you cannot learn **how to write** a convincing sensory description of seeing red, or the emotional impact of grief, or the taste of salt, solely by *reading* meticulous *descriptions about* the neurology or physics or sociology *of* those things. You learn *how* to render it by *doing* the writing, by practising the **showing**, by developing the **interiority** through technique (like free indirect style). Knowing *all about* showing doesn't mean you can *do* it until you've practised the craft. Mary hasn't learned a *new fact* about the world; she's learned *how to navigate* a part of it experientially.
      *   **Distortion Flagged:** This maps *very* cleanly. The core idea – that practical, experiential know-how is distinct from propositional knowledge – is central to both. The main philosophical nuance potentially lost is that the Ability Hypothesis often downplays the *cognitive* novelty, focusing purely on behavioural/dispositional capacities, whereas craft knows that gaining these abilities *feels* like accessing something profoundly new cognitively.

  3.  **The Phenomenal Concepts Strategy (Mary gains new *concepts*, not new facts *about the world*):**
      *   **Craft Translation:** Mary already knew all the objective facts *about* red experiences (the physical facts). What she lacked were the **first-person, experiential concepts** needed to *think about* or *refer to* the experience *from the inside*. Stepping out gives her these new conceptual tools. This is analogous to the difference between a character (or narrator) using a **clinical, detached word** for an experience ("sadness," "red," "pain") versus conveying the **lived, textured interiority** *behind* that word using **sensory detail, metaphor, and free indirect style**. Before, Mary only had the detached, third-person "telling" concepts (like a narrator clinically labelling an emotion). Afterwards, she possesses the rich, first-person "showing" concepts (like the narrative rendering the *feel* of the emotion through the character's embodied perspective). She hasn't learned a new fact *about the objective world* (it's still the same physical processes), but she's acquired a radically new *way of conceptualising and accessing* her own subjective states – a new vocabulary of **interiority**.
      *   **Distortion Flagged:** The mapping here is good for the *role* of concepts in accessing experience. However, the philosophical strategy is deeply tied to theories of *reference* and *meaning* – *how* these first-person concepts pick out the physical states. Craft doesn't usually worry *how* the word "ache" hooks onto the physical pain state; it worries about *conveying the experience effectively*. Also, the claim that no *new worldly fact* is learned is a strong metaphysical claim that craft vocabulary doesn't inherently make or deny – it focuses on the *effect* of the new conceptual access.

  **The Residue Report: What Doesn't Map, What Fudges, and Why**

  1.  **Clean Mappings:**
      *   **Showing vs. Telling as Epistemic Access:** The core parallel is remarkably strong. The distinction between objective, detached description (*telling* / physical facts) and subjective, experiential immersion (*showing* / phenomenal experience) is fundamental to both domains. Mary's room *is*, in a profound sense, an epistemological version of "show, don't tell."
      *   **Ability Hypothesis ↔ Craft Know-How:** This is the cleanest map. The idea that certain types of knowledge (rendering subjective experience, whether in writing or living) are fundamentally *practical skills* gained through *doing* rather than *describing* translates almost perfectly.
      *   **Interiority as the Target:** Both philosophy and craft are centrally concerned with the problem of accessing and conveying the subjective, first-person perspective – **interiority**. Mary's new knowledge *is* access to interiority. Good *showing* creates the illusion of interiority for the reader.

  2.  **Areas Requiring Fudging/Distortion:**
      *   **The Nature of 'Facts':** This is the biggest friction point. Craft vocabulary uses "fact" loosely, often meaning "a true piece of information." Jackson uses it in a much stronger, metaphysical sense: a fundamental truth *about reality itself* that physical science misses. The Ability and Phenomenal Concept strategies push back, arguing the "new thing" isn't a worldly fact but a mode of access or concept. Craft doesn't resolve this; it just knows *showing* feels different and conveys something *telling* cannot. Translating "new fact" directly as "what *showing* adds" *is* a fudge because it imports a metaphysical claim craft doesn't inherently make.
      *   **Metaphysics vs. Effect:** Philosophers (especially Jackson) are making claims about the *nature of reality* (physicalism might be false!). Craft is concerned with *narrative effect* and *reader experience*. When we translate Jackson, we focus on the *epistemic access* resembling *showing*, but quietly sidestep the full metaphysical bomb he's dropping. The Phenomenal Concept strategy's claim that *no new worldly fact* is learned is similarly a metaphysical claim foreign to craft concerns.
      *   **The 'Hard Problem' Core:** Underpinning Jackson is the "hard problem of consciousness": *why* and *how* does subjective experience arise from physical processes? Craft takes subjective experience as a *given* to be represented. The philosophical debate *is* largely about whether Mary's Room exposes the hard problem. This core metaphysical angst has no direct parallel in craft vocabulary; craft deals with the *representation* of the phenomenon, not its fundamental ontological puzzle.

  3.  **Residue with No Counterpart in Craft Vocabulary:**
      *   **The Strict Definition of Physicalism:** The entire debate hinges on whether Mary's new knowledge is compatible with the universe being *only* physical facts. Craft has no equivalent concept. It doesn't care if interiority is physical or not; it cares that it *exists* and needs rendering.
      *   **Theories of Reference for Phenomenal Concepts:** The nitty-gritty of *how* phenomenal concepts refer to brain states (e.g., are they recognitional, indexical?) is pure philosophy of language/mind with no craft analogue. Craft cares that the *representation works*, not the underlying cognitive mechanics of concept reference.
      *   **The Knowledge Argument as a Logical Argument:** Jackson presented it as a formal argument (P1, P2, C). Craft "show don't tell" is a heuristic, a practical tool, not a logical proof about the structure of reality.

  **Your Instinct: Exactly Right or Exactly Wrong?**

  **It's exactly right... in its core intuition about epistemic access and representation.** The fundamental reason Mary's Room feels compelling *is* because it mirrors the undeniable gap between describing an experience objectively and having/representing it subjectively. **Show, don't tell** is the narrative embodiment of recognising that gap. Mary's situation *is* the ultimate "telling" scenario, and her release is the ultimate "showing" moment. The *power* of the thought experiment comes from this visceral recognition, which you, as a writer, feel daily.

  **However, it's exactly wrong... in its implication about what the philosophers are *primarily* doing.** Philosophers aren't *just* rediscovering "show, don't tell" and dressing it up. They are using that undeniable epistemic gap (which "show, don't tell" exploits) as a **lever to pry open a metaphysical question about the fundamental nature of reality** (Is physicalism complete?).

  **Why the Residue Exists:**

  *   **Workshop Vocabulary's Purpose:** It's a *pragmatic toolkit*, brilliantly honed for the *representation and communication* of subjective experience. It doesn't *need* to solve the hard problem or define physicalism; it needs techniques to bridge the gap between writer/character/reader subjectivities. It leaves the metaphysics implicit.
  *   **Philosophers' Argument: Less Clear?** Not less clear, but arguing at a *different level of abstraction and purpose*. The philosophers *are* arguing about something very clear: the logical implications of Mary's case for a specific, rigorously defined metaphysical thesis (physicalism). The *unclarity* or *persistent debate* arises because the core issue – the nature of consciousness and its relation to the physical – is genuinely difficult and unresolved. The vocabulary *is* precise for *their* debate about metaphysics. The "residue" exists because they are asking a fundamentally different *kind* of question than craft asks, even though they start from a similar observation about knowledge (the gap between description and experience).

  **The Verdict:**

  Your instinct captures the **heart** of *why* Mary's Room works and feels intuitive – it absolutely is trading on the same fundamental human recognition that subjective experience is irreducible to objective description, which is the engine of "show, don't tell." **In that sense, Mary's Room *is* "show-don't-tell wearing a lab coat."** The lab coat signifies they're using this recognition for a different, more abstract, and metaphysical purpose – investigating the fundamental fabric of reality, not just the techniques for representing human experience within it. The residue is the price of that metaphysical ambition.

  So, wear your craft vocabulary with pride. You understand the *core phenomenon* the philosophers are wrestling with, perhaps more viscerally than they do. They're just using that phenomenon to build a spaceship to Metaphysics, while you're using it to build a door into a character's soul. Different blueprints, same fundamental recognition of the territory.
