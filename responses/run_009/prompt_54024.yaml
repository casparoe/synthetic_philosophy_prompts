  2. At the last node, mover takes.

  3. If mover at k knows that mover at k+1 would take, then passing at k is worse, so takes at k.

  4. Therefore, under CKR, game ends at node 1.

  5. But conclusions about nodes 2+ are conditional on reaching them. Since node 1 shouldn't pass, if node 2 is reached, Player 1 passed, which contradicts CKR. So CKR is refuted at that point.

  6. Thus, claims about what would happen at later nodes have impossible antecedents, so they are vacuous.

  7. The step to node 1 relies on knowing what would happen at node 2, but that's vacuous, so backward induction fails.

  8. Therefore, passing at node 1 isn't irrational, and people pass.

  The problem is that this seems to undermine all conditional reasoning in games, like not believing threats in ultimatum games because the node isn't reached.

  I need to find where Dan's argument goes wrong.

  First, let's think about what common knowledge of rationality means. It's that everyone is rational, everyone knows everyone is rational, and so on, ad infinitum.

  In backward induction, for the last player, taking is rational because passing gives less. Then, for the second-to-last player, knowing that the last player will take, passing would give less than taking, so they take, and so on back to the start.

  But Dan points out that for this to work, when we say "player at k knows that player at k+1 will take," this knowledge assumes that node k+1 could be reached under rationality. But if CKR holds, node k+1 is never reached, so how can player at k know anything about what would happen there?

  In epistemic logic, knowledge is often defined in terms of possible worlds. If CKR holds, then in all possible worlds where the game is played with CKR, node k+1 is never reached. So there are no worlds where node k+1 is reached and CKR holds. Therefore, if player at k is at node k, which shouldn't happen, but if it does, what can they believe?

  This seems messy.

  Perhaps the issue is with what "knowledge" means in a counterfactual situation.

  In game theory, when we do backward induction, we're considering what would happen if the game reached that node, even if it shouldn't under rationality.

  The key point is that rationality and the strategy are defined together.

  Dan is essentially saying that the backward induction argument is circular or self-defeating.

  But let's look at step 6: he says that claims with impossible antecedents are vacuous.

