  With CKR, players believe that others will play rationally at all nodes.

  Therefore, at node 1, P1 believes that if they pass, P2 will take at node 2, so P1 takes.

  If P1 passes, then at node 2, P2, if they believe that P1 is rational at node 3, will take, but P1 has already been irrational by passing at node 1, so P2 might doubt P1's rationality at node 3.

  But under CKR, P2 has no reason to doubt, because CKR means that irrationality is impossible, so P2 should still believe that P1 will take at node 3, so P2 takes at node 2.

  Similarly, even if node 2 is reached, P2 knows that P1 at node 3 will take if reached, so P2 takes to avoid b3.

