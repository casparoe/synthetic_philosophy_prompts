  So Dan's step 6 is wrong because the claims about later nodes are not vacuous; they are essential for defining rational play at earlier nodes.

  The fact that the antecedents are impossible under the equilibrium doesn't make the conditional vacuous; it just means that in equilibrium, those conditions don't occur, but the conditional still holds.

  In logic, "if P then Q" can be true even if P is false.

