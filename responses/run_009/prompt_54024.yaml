  Therefore, Player 1 cannot be sure that Player 2 will take if node 2 is reached.

  That seems to be the crux.

  So with CKR, Player 1 should take, but if they pass, CKR is broken, so all bets are off.

  In that case, Player 1 might pass hoping that Player 2 will also pass, and so on.

  But under CKR, passing is irrational because it relies on the possibility that others might not be rational, but with CKR, everyone is rational, so that possibility shouldn't exist.

  But CKR includes that everyone knows that if the game reached an irrational node, others might not be rational, but it's confusing.

  I recall that this is a known issue in game theory, related to the concept of "belief revision" or "counterfactuals."

  In particular, for backward induction to work, we need that players, even at nodes that shouldn't be reached, would still play rationally, and this is common knowledge.

  But if a node is reached, it means someone was irrational, so how can we assume rationality at that node?

  There's a solution to this, I think.

  One way out is to use the idea of "subgame perfection." In subgame perfect equilibrium, players are required to play optimally in every subgame, even if that subgame is off the equilibrium path.

  The belief is that players are committed to playing rationally no matter what, even if it shouldn't happen.

  But is that consistent with common knowledge?

  If CKR holds, then players know that no one will be irrational, so if someone is irrational, CKR is false, and players might revise their beliefs.

  In the centipede game, if Player 1 passes, Player 2, upon seeing that, might think Player 1 is irrational, so Player 2 might not believe that Player 1 will play rationally in the future, or something.

