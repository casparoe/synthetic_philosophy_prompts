  Under CKR, P1 knows that P2 is rational, so P2 would take at node 2 if reached, but if node 2 is reached, it means P1 passed, which is irrational, so CKR is false, contradiction.

  The issue is that with CKR, the only consistent belief is that no irrationality occurs, so players must play as if all nodes are on the path.

  But if an off-path node is reached, beliefs must be specified.

  In game theory, for subgame perfection, we assume that players play optimally at every node, regardless of how it was reached.

  That is, even if the node was reached by a mistake, players still play rationally.

  And this is common knowledge.

  So in that case, for centipede, at every node, the player takes, because they know that if they pass, the other will take later, leaving them worse off.

  And since this is true at all nodes, player at node 1 takes.

  But Dan says that this assumption about off-path play is vacuous because those nodes are never reached.

