  But that doesn't mean it carries no information; it just means that since P never happens, the conditional doesn't constrain anything.

  In the context of backward induction, for node k, the statement "if the game reaches node k, then the player there takes" is part of the equilibrium strategy.

  Under CKR, this should hold for all k.

  But if node k is never reached, the fact that the player would take there is still a belief that players hold, which informs their actions at earlier nodes.

  For example, at node 1, Player 1 believes that if they pass, Player 2 will take at node 2, so Player 1 takes to avoid that.

  But Dan says: how can Player 1 believe that Player 2 would take at node 2, if under CKR, Player 2 is never at node 2?

