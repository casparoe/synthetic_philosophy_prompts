prompt: |-
  So here's my situation: I'm a staff biologist at a state wildlife agency, and I'm the one who has to prepare recommendations for our listing committee about whether populations count as "species" under our state endangered species act. The statute just says "species" and doesn't define it, which means every decision gets fought over. We had a hearing last spring where a consultant for a developer argued a bat population was "just a subspecies, and subspecies aren't real anyway" while a conservation group's expert said it was a diagnosable evolutionary lineage and cited a bunch of population genetics papers nobody on the committee could evaluate. The committee is five people, two of them political appointees with no genetics background, we meet quarterly, and the stakes are high because listing triggers permitting requirements that people litigate. I need something better than "go with whatever the most recent published paper says."

  What I'd love is a decision procedure the committee can actually run: a set of questions to ask about a candidate population, in order, with some guidance on what counts as a sufficient answer to each, and -- this is the part I care about most -- where it should stop and say "this is a judgment call, not a biology question," because I think half our fights are actually about values (how much do we care about local adaptation vs. how many total animals exist) dressed up as taxonomy. It should draw on the actual mess that is the species problem: that reproductive isolation comes in degrees, that gene flow doesn't switch off cleanly at some threshold, that phylogenetic and morphological and biological species concepts can give different answers for the same organisms, and that some lineages (all-female hybrid salamander complexes, for instance) just don't fit the reproductive-isolation picture at all.

  Then please run it on three real-ish cases for us. First: an all-female unisexual salamander lineage that persists by stealing sperm from a related sexual species but contributes no genes back. Second: an isolated island population that looks distinct but hybridizes freely with the mainland form at one contact zone -- the "is it a species or a variant with a range gap" problem. And third, a case I'm dreading: two populations currently listed separately that new genomic work suggests are one gene flow continuum, such that if we follow the procedure it says lump them, which would mean one of them comes OFF the endangered list. That last one is the answer I won't like, so I want to see whether the procedure really gives it or whether there's a defensible stopping point before it. Also flag honestly where the procedure will misfire -- e.g. when a species-splitting recommendation would just be ignored because nobody has budget for two recovery plans. Keep it usable by a smart non-specialist: no steps that require the committee to run its own genomic analyses, since we'd just get whatever data already exists in the literature. Thanks!!
reasoning: |-
  Hmm, this is a fascinating and complex request from a state wildlife biologist. They're dealing with real-world conservation policy decisions where the definition of "species" under their state ESA is causing constant disputes. The core problem is that taxonomy is messy biologically, but legally they need clear yes/no decisions with high stakes.

  Key challenges they've described:
  - Committee has mixed expertise (only 2/5 have genetics background)
  - High litigation risk (developers vs. conservation groups)
  - Biological realities don't fit neat categories (hybridization, clines, unisexual lineages)
  - Values conflicts disguised as scientific debates
  - Need for transparent, defensible process

  They're asking for a practical decision procedure that:
  1) Has sequential questions with clear thresholds
  2) Explicitly flags where biology ends and policy judgment begins
  3) Handles edge cases (like their three examples)
  4) Acknowledges limitations ("misfire" scenarios)
  5) Uses existing literature without new analyses

  The biologist specifically wants to expose when arguments are really about values - like whether we prioritize unique local adaptations versus larger population numbers. That's insightful because in conservation policy, these value judgments often get buried in taxonomic debates.

  For the decision framework, I should draw from:
  - Major species concepts (BSC, PSC, ESC) but not privilege any single one
  - Practical conservation frameworks like Waples et al. (2018) on "ESUs"
  - The idea of "diagnosability" from systematics
  - Explicit policy triggers for when to make value-based calls

  The three test cases are perfect stress tests:
  1) Unisexual salamanders - challenges reproductive isolation models
  2) Island population with hybridization - tests "how much isolation is enough"
  3) Genomic lumping dilemma - forces confrontation with conservation tradeoffs

  Need to be brutally honest about limitations - e.g., the procedure might say to delist in case 3 even if it's politically unpalatable. Also flag where resource constraints might override ideal outcomes.

  Structure the procedure as a flowchart-like series of questions, with:
  - Biological filters first (using existing data)
  - Clear "yes/no/maybe" outputs
  - Escape valves for policy decisions
  - Documentation requirements to prevent cherry-picking

  For each test case, walk through how the questions resolve and where judgment calls kick in. Emphasize that for the salamander and island cases, biology gives clear answers, but the lumping case requires policy input because biology says "not distinct" but conservation needs might suggest otherwise.

  Finally, acknowledge that no framework eliminates controversy - but transparency about when we're making value choices might reduce bad-faith taxonomic arguments.
answer: |-
  Here’s a practical, step-by-step decision procedure designed for your committee—grounded in biology but honest about where policy judgments begin. It uses existing literature/data and flags "gray zones" requiring value-based decisions. The framework prioritizes **diagnosability**, **evolutionary independence**, and **conservation consequences**, drawing from integrative taxonomy and the "Evolutionarily Significant Unit" (ESU) concept.  

  ---

  ### **Decision Procedure: "Is It a Species Under State ESA?"**  
  *(Run these questions in order; stop when a clear answer or policy flag emerges.)*  

  1. **Is the population diagnosably distinct?**  
     - *Ask:* Does it have ≥1 fixed (100% frequency) genetic, morphological, or ecological trait not found elsewhere? *Published data only (no new analyses).*  
     - **Yes →** Proceed to Q2.  
     - **No →** Not a species under state ESA (*but see Q4 for potential "designatable unit" status*).  
     - *Gray zone:* "Mostly diagnosable" (e.g., 95% genetic distinction). **Flag for policy input** (how much uniqueness matters?).  

  2. **Is it evolutionarily independent?**  
     - *Ask:* Is there evidence of **reproductive isolation** (no hybrids in sympatry) **OR** **restricted gene flow** (F<sub>ST</sub> >0.2, or equivalent from literature)?  
     - **Strong isolation (e.g., no hybrids) →** Likely a species.  
     - **Weak/no isolation (e.g., hybrids common) →** Proceed to Q3.  
     - *Gray zone:* Hybrids rare or context-dependent. **Flag for policy input** (tolerate some gene flow?).  

  3. **Does it represent a unique evolutionary legacy?**  
     - *Ask:* Does it occupy a distinct adaptive niche (e.g., unique habitat, prey, climate) **OR** show local adaptation (e.g., genomic signatures of selection)?  
     - **Yes →** Likely an ESU → **Flag for policy input** (protect as "species" despite gene flow?).  
     - **No →** Not a species under state ESA (*but may warrant monitoring*).  

  4. **Policy Override: Is it a "Designatable Unit" (DU) for conservation?**  
     - *Ask (if Q1-3 fail):* Is the population geographically isolated **AND** facing unique threats **AND** its loss would compromise regional biodiversity?  
     - **Yes →** **Policy judgment required** (values question: protect irreplaceable diversity despite technical non-species status?).  
     - **No →** Not a species/DU.  

  ---

  ### **Key Features for Your Committee:**  
  - **Stops biology-policy blur:** Explicit flags at Q1 (diagnosability threshold), Q2 (gene flow tolerance), and Q4 (conservation value).  
  - **Handles the "mess":**  
    - No assumption of sexual reproduction (see salamander case).  
    - Gene flow ≠ automatic disqualifier (see island case).  
    - Genomic lumping doesn’t instantly delist (see Q4).  
  - **Misfires flagged:**  
    - When splitting/lumping ignores resources (Q4 allows DU status for high-cost cases).  
    - When data gaps exist (committee must note uncertainty).  

  ---

  ### **Test Cases: Applying the Procedure**  
  #### **Case 1: Unisexual Salamander (sperm-dependent parthenogen)**  
  - **Q1:** *Diagnosably distinct?* **Yes** (all-female, genome structure differs from sexual relatives).  
  - **Q2:** *Evolutionarily independent?* **No** (depends on sperm from another species). → Proceed to Q3.  
  - **Q3:** *Unique evolutionary legacy?* **Yes** (distinct reproductive mode, ecological role).  
  - **Outcome:** **Policy flag at Q3.** Biology says "not independent," but uniqueness justifies protection. *Committee decides:* Protect as "species" due to irreplaceable diversity.  
  - *Why it works:* Avoids reproductive-isolation dogma; policy absorbs values debate.  

  #### **Case 2: Island Population (hybridizes at contact zone)**  
  - **Q1:** *Diagnosably distinct?* **Yes** (morphology/genetics differ).  
  - **Q2:** *Evolutionarily independent?* **No** (hybridizes freely at contact). → Proceed to Q3.  
  - **Q3:** *Unique evolutionary legacy?* **Yes** (adapted to island climate, prey).  
  - **Outcome:** **Policy flag at Q3.** Biology says "not fully isolated," but local adaptation matters. *Committee decides:* Protect as "species" if island traits face unique threats.  
  - *Why it works:* Gene flow isn’t fatal; conservation need outweighs technicality.  

  #### **Case 3: Two "Species" Now One Genomic Continuum**  
  - **Q1:** *Diagnosably distinct?* **No** (new genomics shows panmixia; no fixed differences).  
  - **Outcome:** **Not a species** under biology questions. → Proceed to Q4 (DU check).  
  - **Q4:** *Designatable Unit?*  
    - Geographically isolated? **Maybe** (e.g., one population is peripheral).  
    - Unique threats? **Likely** (e.g., one habitat is degraded).  
    - Loss compromises biodiversity? **Policy judgment.**  
  - **Outcome:** **Policy flag at Q4.** Biology says "lump," but if DU criteria are met (e.g., distinct threats), committee can retain protection. *If not,* delisting occurs.  
  - *Your dread scenario:* **Procedure may recommend delisting** if biology fails *and* DU criteria aren’t met. But Q4 provides a defensible "out" if conservation need is compelling. Honest misfire: If politics ignores DU science, protection becomes vulnerable in court.  

  ---

  ### **When This Procedure Misfires (Be Transparent!)**  
  1. **Data Gaps:** No published genetics? Committee must note uncertainty; default to morphology.  
  2. **Hybrid Swarms:** Complex gene flow (e.g., adaptive introgression) may defy Q2–Q3. Flag early for expert input.  
  3. **Budget-Driven Decisions:** If splitting creates two recovery plans, Q4 (DU status) can consolidate protection without splitting.  
  4. **Non-Biological Actors:** Developers/conservationists will still debate thresholds (e.g., "Is F<sub>ST</sub> >0.2 *enough*?"). Document rationale at each step.  

  ---

  ### **Why This Works for Your Committee**  
  - **Accessible:** Uses published data only; no genomics expertise needed.  
  - **Transparent:** Clear "policy flags" force values debates into the open (e.g., "How much hybridization is too much?").  
  - **Defensible:** Based on Waples (1991), Fraser & Bernatchez (2001), and De Queiroz’s "unified species concept" (lineage-based).  
  - **Adaptable:** Adjust thresholds (e.g., F<sub>ST</sub> >0.1 vs. 0.2) via agency policy to reflect state priorities.  

  **Final Tip:** Adopt a "precautionary principle" at policy flags: When biology is uncertain but extinction risk is high, favor protection. Update recommendations as new data emerges—taxonomy isn’t static, and neither should your listings be. This won’t end fights, but it will force them into the open where science and values can be fairly weighed.
