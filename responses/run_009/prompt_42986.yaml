  Where Kant's model breaks: His federation wasn't meant to be a Geneva-based bureaucracy. The democratic peace theory later validated his republican peace hypothesis, but the 1920s had too few stable democracies. The League's failure might confirm Kant - you can't skip the "republican constitutions" prerequisite. 

  The journalist wants honesty about Kant's limits. I'll note that Manchuria/Abyssinia showed the League wasn't a real federation - it had no power to compel. Also, cosmopolitan right was ignored in mandates. But Kant never predicted collective security organizations; his model was more about cultural evolution toward peace. 

