prompt: |-
  so last summer my family went to Japan and before we left my mom made us all sit through this whole lecture about local customs — don't tip (in japan tipping can straight up be seen as an insult, which is the exact opposite of the US where not tipping makes you basically a thief, since waiters get paid like $3 an hour on the assumption everyone tips), don't eat while walking, stand on one side of the escalator, don't jaywalk even if the street is totally empty at 2am. and it's not just my mom, every travel guide and website says the same thing: when in rome, do as the romans do. and they don't say it like a tip for blending in, they say it like you're a bad person if you don't. like jaywalking in germany is treated as some moral failure even though it's completely normal in a lot of other countries, and cutting a queue in the UK apparently makes people actually hate you.

  here's the part that confuses me. in my social studies class we touched on this idea that conventions are basically solutions to coordination problems — like which side of the road to drive on doesn't matter at all, what matters is that everyone expects everyone else to keep doing it, and that's what keeps it stable. nobody ever signed anything and the convention doesn't care whether you personally endorse it. so what is the whole travel-advice industry quietly presupposing about where the obligation comes from? that conventions become morally binding because people rely on them (the waiter's entire wage system is built around the tipping convention, so defecting really does hurt someone)? that you owe the locals some kind of respect by not wrecking their expectations? that it's just fairness — you happily enjoy the smooth queue system when it benefits you, so you can't defect the one time it costs you something? or is it all just about avoiding weird looks and nothing more?

  and is the advice even internally consistent? because the same people who say follow the customs will also tell you you're NOT obligated to follow customs that are actually wrong — like nobody today would tell a visitor to the 1950s american south that they should comply with segregation norms out of respect for local expectations, that would be horrifying. so somewhere there's a line between conventions you must follow as a visitor and conventions you're allowed to blow off, and I can't tell whether the underlying view actually generates that line or whether it's just vibes. so basically: reconstruct the implicit theory of what makes an everyday convention a moral obligation for a visitor, tell me which parts of the practice are actually forced by that theory and which parts would still make sense under a bunch of rival theories, and then tell me what the guidebooks would have to say if we swapped the presupposed view for a strict you're-only-bound-by-what-you-agreed-to view. would the advice collapse into pure self-interest (avoid getting yelled at), or would something still be left over? sorry this is long, I got into an argument with my friend about the tipping thing on the plane home and it's been bugging me since
reasoning: |-
  Okay, let me unpack this user's query. They're grappling with the moral weight behind "when in Rome" travel advice. The core tension is between social conventions as coordination solutions versus perceived moral obligations. 

  First, I need to map their observations: 
  - Their mom framed customs (no tipping in Japan, no jaywalking in Germany) as ethical imperatives
  - They recognize conventions solve coordination problems (like driving sides)
  - They spot inconsistency in guidebooks - why obey queue norms but not segregation laws?
  - The tipping debate seems to be the emotional catalyst here

  Hmm, the philosophical heart seems to be: when do descriptive norms ("this is what locals do") become prescriptive norms ("you ought to do this")? And why?

  Let me reconstruct the implied ethics in travel advice. Most guidebooks seem to operate on:
  1) Harm principle (tipping in US affects wages)
  2) Respect-as-reciprocity (using escalator system means you maintain it)
  3) Epistemic humility (locals know why norms exist - e.g. Japanese no-walking-eating may relate to cleanliness/spatial constraints)

  But the segregation example reveals limits. The unspoken filter is probably: conventions only bind when they're (a) coordination-focused and (b) morally neutral. Once a convention violates fundamental rights, the "respect local culture" argument collapses. That's why guidebooks don't hesitate to say "disregard this custom if it's discriminatory."

  Interesting - the user's "strict consent" hypothetical exposes how much relies on social contract theory. If we switched to pure opt-in ethics ("I never agreed to Tokyo's escalator norms!"), advice would indeed shrink to:
  - Prudential tips ("avoid fines for jaywalking")
  - Optional courtesy ("standing on escalator left avoids dirty looks")
  But lose the moral layer ("defecting harms collective efficiency")

  The unresolved tension I see: the user wants to know if the "respect" argument is coherent when applied selectively. My take is yes - but only if we view respect as conditional on the convention's underlying values, not just its existence. That's why their mom's lecture felt fuzzy; she presented norms monolithically when the ethics are actually tiered.

  Final thought: the tipping case is uniquely thorny because it sits at the intersection of harm (wage systems), fairness (free-riding on others' tips), and cultural meaning (insult vs appreciation). No wonder it sparked that airplane argument!
answer: |-
  You've hit on a profound tension between descriptive conventions and perceived moral obligations. Let's reconstruct the implicit ethical framework behind "when in Rome" advice, test its consistency, and see how it changes under rival theories.

  ### The Implicit Theory in Travel Advice (A Reconstruction)
  1. **The "Social Contract Lite" View**:  
     - **Premise**: Conventions are fragile equilibria sustained by mutual expectations. Your compliance maintains the system that benefits others.  
     - **Obligation Source**: *Reciprocity* (you benefit from others' compliance) + *Harm Prevention* (defection destabilizes systems).  
       - *Example*: Tipping in the US sustains waitstaff livelihoods; not tipping "free rides" on others' compliance.  
       - *Non-Example*: Jaywalking in Germany doesn't collapse society, but mass defection might erode pedestrian safety norms.

  2. **Respect as Epistemic Humility**:  
     - Locals understand *why* customs exist (e.g., no eating while walking in Japan preserves cleanliness in dense urban spaces). As an outsider, you lack context to judge.  
     - **Obligation Source**: Deference to local knowledge.

  3. **Anti-Rudeness Principle**:  
     - Violating norms signals disregard for the host community’s values. Even harmless acts (e.g., standing on the wrong escalator side) become "micro-aggressions" by demonstrating indifference.  
     - **Obligation Source**: Basic hospitality ethics ("guest duty").

  ### Where the Line is Drawn (And Why)
  - **Binding Customs**: Those that:  
    a) Prevent tangible harm (tipping in wage-exploiting systems),  
    b) Maintain public order (queues, traffic norms),  
    c) Express respect for deeply held cultural values (e.g., temple dress codes).  
  - **Non-Binding Customs**: Those that:  
    a) Cause no material harm (minor jaywalking at 2am),  
    b) Enforce oppression (segregation),  
    c) Conflict with universal ethics (gender apartheid).  
  - **The Filter**: *Does compliance endorse injustice or enable systemic harm?* If yes, the obligation dissolves. The underlying theory here is **weak cultural relativism**: Conventions merit deference *unless* they violate fundamental human rights or dignity.

  ### Inconsistencies in Practice
  - **The "Vibes" Problem**: Guidebooks often blur *harmful* vs. *merely unfamiliar* customs. German jaywalking norms are treated as morally weighty (they’re not), while truly harmful practices (e.g., caste discrimination) might be glossed over as "cultural sensitivity."  
  - **Hypocrisy in Harm Tolerance**: Tipping in the US is presented as obligatory to offset exploitative wages—but this implicitly condones the broken system. Meanwhile, Japan’s no-tipping custom isn’t framed as a protest against wage exploitation.  

  ### Swapping Theories: A Strict "Consent-Only" Obligation
  If obligations *only* arose from explicit agreements:  
  - **Collapse to Self-Interest**:  
    Advice becomes purely pragmatic:  
    *"Stand on the escalator left in Osaka to avoid glares; tip in New York to avoid confrontation; jaywalk in Berlin at 2am if no police are present."*  
    Moral language ("disrespectful," "rude") vanishes.  
  - **Residual Obligations?**  
    Only if you *explicitly benefited* from a system:  
    *Example*: If you use London's orderly queue to board a bus, you might "owe" compliance under fairness (you accepted the benefit). But if you avoid queues entirely, no obligation exists.  
    *Non-Example*: Tipping in the US imposes no obligation if you never agreed to subsidize wages—even if you ate at the restaurant.

  ### Why Guidebooks Resist Pure Consent Theory
  1. **Social Reality**: Conventions *feel* morally charged because norm violations trigger collective anger (e.g., UK queue-cutting). Guidebooks prepare tourists for emotional/social consequences.  
  2. **The "Ugly Tourist" Trope**: Rejecting local customs is culturally associated with arrogance/colonialism. Guidebooks preempt this perception.  
  3. **Systemic Harm**: Even without consent, benefiting from a system (e.g., US restaurants) implicates you in its harms. Pure consent theory ignores this.

  ### Conclusion
  The travel industry presupposes a **hybrid theory**:  
  - Conventions create *provisional* obligations through reciprocity and harm prevention.  
  - These dissolve when customs are oppressive or irrational (hence the segregation exception).  
  - **What’s "Vibes" vs. Theory?** Distinguishing "binding" from "optional" customs often relies on intuition, not principle. But the core ethic—*don’t destabilize systems others rely on, unless those systems are unjust*—holds logical weight.  

  If we adopted strict consent ethics, travel advice *would* collapse into self-interest—but we’d lose the language of respect that makes cross-cultural encounters meaningful. Your mom’s lecture wasn’t just about avoiding glares; it was an appeal to solidarity with temporary communities. The line exists, but it’s drawn with imperfect tools: part philosophy, part pragmatism, part fear of being "that tourist."
