     Summary of the procedure:

       Quarterly Meeting:

         1. Cause Proposal (5 minutes):
            - Each member states the cause they wish to champion (can be the same as before or new).
            - Write them on a board.

         2. Veto Round (5 minutes):
            - For each cause, ask: "Does anyone have a principled objection to funding this cause? (e.g., it goes against your core values) If so, state it briefly."
            - If any member vetoes a cause, it is removed.

         3. Point Allocation - Round 1 (10 minutes):
            - Each member gets 100 points to allocate across the remaining causes. They can assign any non-negative number of points to any cause, but must sum to 100.
