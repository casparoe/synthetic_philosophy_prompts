       We have to accept that if a cause is not popular and its champion is not trading, it gets a low share.

     We recommend trying this for one quarter and then reviewing.

     Note: The point allocation is real. The veto is a judgment call. The adjustment round is where the moral trade happens, but it's facilitated by human negotiation.

