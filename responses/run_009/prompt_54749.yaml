  Okay, let me start by understanding Nadia's perspective. From the examples given, she seems to align with Kantian ethics where moral worth comes from acting out of duty rather than inclination or self-interest. 

  First, the shopkeeper who's honest only for profit has no moral worth because the motive is self-interest. The passerby who saves a child out of pure empathy, without duty, gets moral worth. The wallet guy acts solely from duty, so moral worth. The charity woman who stops giving when anonymous loses moral worth because recognition was her motive.

  Now, Theo helps others because it's his greatest pleasure. His actions are driven by personal satisfaction, not duty. Even though he acts anonymously and at cost, his motive is inclination. Similar to the charity woman, if the pleasure stopped, he might not help. Nadia might say no moral worth here.

  Maya saves someone partly due to the crowd watching and partly empathy. The crowd's presence introduces an external incentive. If she wouldn't act without an audience, that's like the shopkeeper's profit motive. But her genuine empathy might complicate it. However, since she's unsure about acting alone, the external factor could dominate. Likely no moral worth.

  Jonas keeps promises to avoid being the kind of person who breaks them. This seems like acting from a sense of duty to his self-image rather than duty to others. Kant emphasizes duty to moral law, not self-image. If his motive is about personal identity, not the moral rightness, it might not count. But if "the kind of person" aligns with duty, maybe it's okay. However, the wallet guy acted from duty for its own sake. Jonas's motive is self-conception, which might be too self-focused. Probably no moral worth.

  Looking at possible rules:
  1. Acting from the features that make the act right (e.g., saving a life because it's a life). The passerby acted from empathy with the child's panic, which is part of why saving is right. The wallet guy acted because morality demands it, which is the right feature. Shopkeeper didn't act because honesty is right, so no worth. Charity woman gave for recognition, not the act's rightness. Theo acts for pleasure, not the right feature. Maya acts partly for recognition. Jonas acts for self-image, not the promise's inherent value. So this rule fits.

  2. Self-interest not in the driver's seat. Passerby acted from empathy, not self-interest. Wallet guy: duty, not self-interest. Shopkeeper: self-interest. Charity woman: self-interest (recognition). Theo's pleasure could be seen as self-interest. Maya's crowd incentive is self-interest. Jonas avoiding being a promise-breaker is self-interest? But Kant distinguishes duty from self-interest. Jonas's motive is about his identity, which might be self-regarding. So this rule might also fit.

  3. What you'd do if incentives flipped. Shopkeeper would cheat if profitable, so no worth. Charity woman stopped when anonymous, so no worth. Passerby would act even at risk, so worth. Wallet guy would act regardless of incentives? The example doesn't specify. Theo might stop helping if it no longer brought pleasure. Maya might not act without crowd. Jonas would break promises if it didn't affect his self-image? Unclear. This rule is less clear.

  Theo's case is tricky. Acting for pleasure vs duty. The passerby acted from empathy and got moral worth, but Theo's pleasure is similar. However, the passerby was moved by the child's immediate suffering, which is directly related to the act's rightness, while Theo's pleasure is a byproduct. Also, the passerby would act at personal risk, showing it's not self-interested. Theo might not help if it weren't pleasurable. So maybe Nadia distinguishes empathy from pleasure-seeking.

  Jonas: avoiding being a promise-breaker is different from the wallet guy who acts because morality demands it. Jonas's motive is self-focused, whereas the wallet guy is focused on the moral law. So Jonas might not have moral worth.

  Maya: similar to the shopkeeper; if the crowd's presence is an incentive, and without it she might not act, then no moral worth.

  Where could I be wrong? Maybe Nadia values empathy as a morally worthy motive, as in the passerby case. Theo's empathy for vivid suffering might be similar. But Theo's explicit statement that helping is his greatest pleasure might make it self-interested. The passerby wasn't seeking pleasure; they acted from the child's panic. Theo's motive is hedonistic. So Nadia might distinguish between acting from feeling (empathy) versus acting for feeling (pleasure).

  If Nadia wavered on the passerby case, that would change things. If the passerby didn't have moral worth, then acting from empathy wouldn't count, making Theo also no worth. But she affirmed the passerby, so empathy might be sufficient. However, Theo's case adds the pleasure motive, which might override.

  Jonas's case: if Nadia thinks that acting to maintain self-image is equivalent to duty, then moral worth. But the wallet guy acted from duty to morality, not self-image. The distinction might be crucial.

  So predictions:
  Theo: no moral worth (pleasure motive)
  Maya: no moral worth (external incentives)
  Jonas: no moral worth (self-image focus)

  But the rule seems to be: moral worth when acting from the right-making feature (e.g., empathy for suffering, duty) without ulterior motives. Theo's pleasure is ulterior, Maya's crowd incentive is ulterior, Jonas's self-image is ulterior. The wallet guy's duty is pure, passerby's empathy is pure.
answer: |-
  Hey! This is such a fascinating puzzle—Nadia’s pattern is tricky because it feels intuitive once you see it, but pinning down *exactly* what rule she’s using is like trying to catch smoke. Based on her past verdicts, I think I’ve got a handle on it, but I’ll lay out my reasoning step by step, where it might go wrong, and which cases could unravel it all. Here’s my best shot at predicting her responses and the underlying rule. 

  **First, the rule I think she’s running with:**  
  Nadia seems to grant moral worth when someone acts *directly from the feature that makes the act morally right*, and denies it when the motive is rooted in *consequences for the self* (like self-interest, pleasure, or social validation) or when the act is *contingent on those consequences*. It’s not just about "self-interest vs. altruism" or "duty vs. inclination"—it’s about whether the motive is *intrinsically tied to the moral value of the act itself*. The shopkeeper’s honesty isn’t motivated by honesty’s inherent value but by profit; the charity donor cares about recognition, not helping for its own sake. Conversely, the drowning rescuer acts from the child’s immediate suffering (which is *why* saving a life matters), and the wallet-returner acts from a direct sense of moral duty (which captures the "rightness" of honesty).  

  This rule explains her splits:  
  - **Empathy as morally worthy?** Yes, *if* it’s a direct response to the feature that makes the act right (like the child’s panic).  
  - **Duty as morally worthy?** Yes, *if* it’s about the act’s inherent moral demand (like the wallet returner’s grim obligation).  
  - **What kills moral worth?** When the act is done *because of* self-focused outcomes (profit, pleasure, applause) or would *lapse* if those outcomes vanished (like the charity donor stopping when anonymous).  

  Now, let’s apply this to your new cases:  

  ### Predictions for Theo, Maya, and Jonas  
  1. **Theo (helps for vivid personal pleasure): No moral worth.**  
     He’s acting happily and anonymously, but his motive—helping as his "greatest pleasure"—frames the act around *his* emotional payoff, not the suffering itself. The key clue is his selectivity: he only helps when he can *feel* the pleasure of vivid empathy. If the suffering doesn’t trigger that personal reward (like distant famines), he doesn’t act. This mirrors the charity donor who stopped giving when her plaque vanished—both make the act contingent on a self-serving condition (pleasure/recognition). Nadia will likely say Theo’s kindness is admirable but instrumentally self-focused, not grounded in the moral feature (alleviating suffering *because* it’s wrong).  
     *Why this fits her rule:* Theo’s pleasure is the driver, not the right-making feature (the neighbor’s need). If helping stopped being pleasurable, he’d likely stop, just as the charity donor did when anonymity removed her reward.  

  2. **Maya (saves partly for the crowd): No moral worth.**  
     She’s moved by the stranger’s panic (which *could* be morally worthy, like the drowning child rescuer), but she admits the crowd’s cheering was part of her motive and she’s unsure she’d act without it. This makes her act partly contingent on social validation—a self-focused consequence. Think of the shopkeeper: he’d cheat if profits demanded it; Maya might not jump if the crowd vanished. The genuine empathy doesn’t save her because the act isn’t *fully* driven by the moral feature (the stranger’s distress); it’s diluted by the desire for applause.  
     *Why this fits her rule:* The crowd introduces an external incentive. If the moral feature (panic) alone isn’t sufficient for her to act, it lacks the "purity" of the drowning rescuer, who’d jump even at personal risk.  

  3. **Jonas (keeps promises for self-image): No moral worth.**  
     He’s rigorous about promise-keeping, but his motive—avoiding becoming "the kind of person who breaks promises"—is all about *his* identity, not the promisee’s claim or the inherent duty. Contrast this with the wallet-returner, who acts because "morality demands it" (a direct appeal to the act’s rightness). Jonas’s focus is self-referential: it’s about *him* not being a bad person, not about the moral weight of the promise itself. If he could break a promise without altering his self-image (e.g., if no one knew), would he? His motive suggests he might.  
     *Why this fits her rule:* He’s acting from a consequence (his self-concept) rather than the feature that makes promise-keeping right (e.g., trust, obligation to others). It’s like a self-focused version of duty—close but not the same.  

  ### Where My Reasoning Could Fail  
  I’m most confident about Maya and Jonas—they feel like clear extensions of Nadia’s past calls. Theo is the trickiest, and if she surprises me, it’ll be there. Here’s why:  

  - **Theo’s empathy might sway her.** The drowning rescuer acted from pure empathy and got moral worth, and Theo is similarly moved by vivid suffering. If Nadia sees "pleasure" here as just a byproduct of empathy (not the motive), she *might* grant worth. But I doubt it. Theo explicitly says helping *is* his pleasure—he’s not just describing a feeling but centering it as his reason. The famine contrast seals it: he’s not responding to moral need but to what gives *him* gratification. The passerby, by contrast, was consumed by the *child’s* state, not their own joy.  

  - **If she wavers on an old case, everything changes.** The biggest threat is the **drowning rescuer**. If Nadia backtracked and said, "Actually, no moral worth—they acted on instinct, not moral recognition," then Theo’s empathy-based help would also fail, and her rule might lean harder into explicit duty (like the wallet case). But she affirmed the rescuer, so I’m betting empathy *can* carry moral worth *if* it directly engages with the act’s moral feature (e.g., suffering).  

  - **Jonas could split opinions.** If Nadia interprets "couldn’t stand to be that person" as a commitment to moral integrity (not just vanity), she *might* call it worthy. But the wallet-returner sets a high bar for duty: he’s focused on the act’s demand, not his identity. Jonas feels closer to the charity donor—both care about how they’re perceived (externally or internally).  

  ### Where the Record Underdetermines Things  
  Your three cases are brilliant because they stress-test her rule. Theo pits empathy against pleasure; Maya mixes empathy with social incentive; Jonas contrasts duty with self-image. If she *does* call Theo or Jonas worthy, it might mean her rule is broader—e.g., "moral worth if the motive isn’t self-interested *and* you’d act without external rewards." But that would struggle with the charity donor (who wasn’t self-interested in a narrow sense but still lost worth).  

  **Final predictions:**  
  - Theo: **No moral worth** (pleasure-driven, not morally grounded).  
  - Maya: **No moral worth** (contingent on social reward).  
  - Jonas: **No moral worth** (self-image focus, not inherent duty).  

  I’d bet a bottle of wine on this—but only if you report back! Nadia’s consistency is impressive, and if she breaks pattern, it’ll reveal something new about her system. Maybe she values "immediate empathy" more than I’m giving credit for. Either way, have fun at dinner, and tell her she’s got us all overthinking morality at 2 a.m.  

  Let me know how it goes!  

  Best,  
