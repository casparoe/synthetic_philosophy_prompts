prompt: |-
  I'm in a course on measurement and its failures (we just covered Goodhart's law, including the variants -- regressional, extremal, adversarial -- not just the original econometrics version), and I could use your help with something practical. I also TA our intro CS course, and me and the lecturer are about to redesign how 400ish students get graded, most of it auto-scored. Last year we gave points for number of unit tests passed and got back hundreds of trivial asserts ("assert add(1,1)==2") which was... a lesson.

  Can you turn what the theory says about metrics failing under optimization pressure into a procedure we can actually run whenever someone proposes a new grading metric? Like: the questions to ask in order, what counts as a sufficient answer to each, where the procedure should just say no, and where it has to punt to a human judgment call (I want those honestly flagged, not hidden). We're two people with maybe 15 minutes per metric, no fancy stats, and the stakes are real because the metric determines how these students spend their whole semester. Then run it on two of our current candidates: (a) giving lab credit based on lines of code changed per commit, and (b) giving participation credit for words written in the course forum. At least one of those I actually want to keep, so if the procedure kills it, tell me that anyway -- and also say what the procedure can't catch, like ways grading can go wrong that no per-metric audit would ever see.
reasoning: |-
  We are designing a procedure to evaluate proposed grading metrics under the lens of Goodhart's law and its variants. The goal is to identify when a metric might be gamed or become a poor proxy for the true goal (learning and skill development) under optimization pressure.

  The procedure should be a step-by-step checklist that can be done in 15 minutes per metric. It should include:
  1. Questions to ask about the metric.
  2. What counts as a sufficient answer for each question.
  3. When to reject the metric (say "no").
  4. When the decision requires a human judgment call (and flag these honestly).

  We'll then apply this procedure to two candidate metrics:
  (a) Lab credit based on lines of code changed per commit.
  (b) Participation credit for words written in the course forum.

  Additionally, we'll discuss limitations of the procedure: what kinds of failures it cannot catch.

  ---

  **Procedure: Evaluating a Grading Metric for Goodhart Vulnerabilities**

  **Step 1: Define the True Goal**
     - Question: What is the true educational goal this metric is intended to measure? (Be specific.)
     - Sufficient Answer: A clear, non-circular statement about the intended learning outcome or behavior (e.g., "encourage iterative development" or "foster thoughtful engagement with peers").
     - Red Flag: If the goal cannot be clearly stated or is circular (e.g., "to get more lines of code").
     - Judgment Call: If the goal is complex and the metric only partially captures it, note that.

  **Step 2: Identify Direct Distortions (Regressional Goodhart)**
     - Question: Could optimizing for this metric directly lead to behaviors that are counterproductive to the true goal? (i.e., when the metric is a poor proxy for the goal even without active gaming)
     - Sufficient Answer: A plausible scenario where improving the metric does not improve (or even harms) the true goal, without any malicious intent.
     - Red Flag: If such a scenario is obvious and likely (e.g., writing verbose but low-quality code to increase line count).
     - Judgment Call: If the distortion is possible but might be rare, or if there are mitigating factors.

  **Step 3: Check for Extremal Vulnerability**
     - Question: At the extremes (e.g., very high or very low values), does the metric break down? (Extremal Goodhart: when the metric becomes a worse proxy as it approaches extreme values.)
     - Sufficient Answer: Examples of extreme values that would be achievable but undesirable (e.g., a commit that changes 10,000 lines by adding useless comments).
     - Red Flag: If the metric has no natural upper bound and extreme values are easy to achieve in a harmful way.
     - Judgment Call: If extremes are unlikely to occur in practice.

  **Step 4: Assess Adversarial Gaming Potential**
     - Question: How easy would it be for a student to intentionally game the metric without contributing to the true goal? (Adversarial Goodhart)
     - Sufficient Answer: A simple, low-effort method to inflate the metric without learning or contributing (e.g., writing many trivial forum posts).
     - Red Flag: If gaming is trivial and hard to detect/penalize.
     - Judgment Call: If gaming is possible but would require significant effort or be detectable.

  **Step 5: Consider Countermeasures and Robustness**
     - Question: What safeguards can be put in place to mitigate the identified vulnerabilities? (e.g., caps, human review, complementary metrics)
     - Sufficient Answer: Concrete, feasible measures that reduce the risk without undermining the metric's purpose.
     - Red Flag: If no effective safeguards are available or they are too costly.
     - Judgment Call: If safeguards might work but require ongoing monitoring or subjective judgment.

  **Step 6: Overall Assessment**
     - If any step has a Red Flag that cannot be mitigated, reject the metric.
     - If there are Judgment Calls, note them and decide if the metric is worth the risk given the context (this step is inherently human).

  ---

  **Apply the Procedure to Candidate Metrics**

  **Metric (a): Lab credit based on lines of code changed per commit**

  1. **True Goal**: Encourage iterative development and regular coding practice. (Assumed goal; must be confirmed by the course staff.)
     - Sufficient: Yes, if the goal is about frequency and volume of coding. But note: the true goal is likely about quality and learning, not just volume.

  2. **Regressional Goodhart**:
     - Vulnerability: Students might make unnecessary changes (e.g., adding whitespace, comments, or breaking lines) to inflate line count. This does not reflect learning or good practice.
     - Red Flag: Yes, because it directly incentivizes volume over quality.

  3. **Extremal Vulnerability**:
     - Vulnerability: At high values, a single commit could have thousands of lines of auto-generated or copied code. At low values, students might avoid refactoring (which reduces lines) or break changes into many tiny commits (if per-commit is the unit).
     - Red Flag: Extremes are easy to achieve and harmful.

  4. **Adversarial Gaming**:
     - Vulnerability: Trivial to game: students can run a script to reformat code (adding line breaks) or add useless comments.
     - Red Flag: Gaming is low-effort and hard to detect automatically.

  5. **Countermeasures**:
     - Possible: Cap per-commit lines? But that might discourage large (but legitimate) changes. Or, use a combination: e.g., require a minimum number of commits and a reasonable line count range. Alternatively, use a more robust metric (like code churn with content analysis) but that's complex.
     - Judgment Call: Without sophisticated tooling, countermeasures might not fully work. Human review of commits? Not feasible at scale.

  6. **Overall**: 
     - Red Flags in steps 2, 3, and 4. Countermeasures are weak. 
     - **Verdict**: Reject.

  **Metric (b): Participation credit for words written in the course forum**

  1. **True Goal**: Foster thoughtful discussion and peer learning in the forum.
     - Sufficient: Yes, if the goal is to encourage engagement. But note: true goal is about quality of interaction, not quantity.

  2. **Regressional Goodhart**:
     - Vulnerability: Students might write long, low-content posts (e.g., rambling, repeating) to meet word counts. This clutters the forum and discourages reading.
     - Red Flag: Yes, because word count is a poor proxy for thoughtfulness.

  3. **Extremal Vulnerability**:
     - Vulnerability: Extremely long posts might be unreadable, and very short posts (if there's a minimum) might be trivial. Also, one student could write a 10,000-word post to get credit without ongoing participation.
     - Red Flag: Without a cap, extreme values are possible and harmful.

  4. **Adversarial Gaming**:
     - Vulnerability: Easy to game: write nonsense, copy-paste text, or post many short, trivial comments (e.g., "I agree").
     - Red Flag: Gaming is trivial.

  5. **Countermeasures**:
     - Possible: Set a per-post word limit (e.g., 100-500 words) and a cap on posts per week. Also, combine with peer ratings or TA spot-checks for quality. This adds some robustness but requires human oversight.
     - Judgment Call: Peer ratings might be gamed too, and human review is time-consuming but feasible (e.g., sampling). 

  6. **Overall**:
     - Red Flags in steps 2, 3, and 4, but countermeasures (word limits + human review) might mitigate. 
     - **Verdict**: Conditional approval with safeguards. However, note that without quality control, the metric remains weak. Alternatively, consider a better metric (e.g., upvotes by peers, or TA evaluation of a sample of posts).

  ---

  **What the Procedure Can't Catch**

  1. **Unforeseen Adaptations**: Students might find novel ways to game the metric that weren't anticipated in the 15-minute audit.
  2. **Second-Order Effects**: How the metric interacts with other course elements (e.g., if forum participation becomes inflated, students might ignore other activities).
  3. **Equity Issues**: Metrics might disadvantage certain groups (e.g., non-native speakers in forum word counts) or create perverse incentives that affect student well-being (e.g., overwork).
  4. **Collusion**: Students might coordinate to game the system (e.g., mutually upvoting low-quality posts).
  5. **Long-Term Distortion**: The metric might work initially but degrade over time as gaming strategies evolve.
  6. **Proxy Drift**: Even if the metric is robust initially, changes in the environment (e.g., new tools) might make it easier to game later.

  Therefore, even if a metric passes the procedure, it should be monitored and adjusted as needed.

  ---

  **Final Recommendations**

  - For metric (a): Reject. It is too vulnerable and the countermeasures are weak.
  - For metric (b): Approve conditionally, with the following safeguards:
     - Set a reasonable word count range per post (e.g., 100-500 words) and a limit on the number of posts that count toward credit per week (e.g., 2-3).
     - Implement a peer rating system (with checks for collusion) or TA spot-checks for quality.
     - Consider combining with other signals (e.g., instructor nominations for helpful posts).

  But note: You mentioned wanting to keep one. If (b) is the one, then proceed with caution. Alternatively, reconsider the true goal and see if there's a better metric (e.g., quality over quantity).

  If you must use a quantity-based metric for participation, at least make it a small part of the grade and pair it with quality controls.
answer: |-
  Here's a practical, step-by-step procedure designed to audit grading metrics for Goodhart vulnerabilities, optimized for your constraints (15 min/metric, no stats, real stakes). I'll then apply it to your two candidates and flag its blind spots.

  ---

  ### **Goodhart Audit Procedure: 7 Questions to Run**
  *(Time: ≤15 min/metric; 2 evaluators)*

  1. **Q1: What's the true goal?**  
     - *Ask:* "What specific student behavior/skill does this metric *actually* measure? Be concrete."  
     - *Sufficient answer:* Clear, non-circular goal (e.g., "encourage iterative coding" not "get more commits").  
     - **Red flag:** Vague/circular goal → **Reject immediately**.  
     - *Judgment call:* If goal is complex (e.g., "critical thinking"), note it for Q7.

  2. **Q2: What's the easiest way to game this?**  
     - *Ask:* "How could a student inflate this metric in <10 min without learning?"  
     - *Sufficient answer:* A plausible, low-skill tactic (e.g., for lines of code: adding whitespace).  
     - **Red flag:** Gaming is trivial and undetectable → **Reject**.  
     - *Judgment call:* If gaming requires effort/risk (e.g., plagiarism), may be tolerable.

  3. **Q3: Does it break at extremes?** (Extremal Goodhart)  
     - *Ask:* "What happens if a student min-maxes this metric? Does high=good always?"  
     - *Sufficient answer:* Example of harmful high/low extremes (e.g., forum spam).  
     - **Red flag:** Metric incentivizes destructive behavior (e.g., bloated code) → **Reject**.  
     - *Judgment call:* If extremes are rare (e.g., physical limits prevent gaming).

  4. **Q4: What valuable work is excluded?** (Regressional Goodhart)  
     - *Ask:* "What ‘good’ student work would score poorly on this?"  
     - *Sufficient answer:* Specific examples (e.g., efficient code has fewer lines).  
     - **Red flag:** Excludes core learning outcomes (e.g., debugging) → **Reject**.  
     - *Judgment call:* If rare, or if metric is supplementary.

  5. **Q5: What adversarial strategies exist?**  
     - *Ask:* "How could a strategic student exploit this without detection?"  
     - *Sufficient answer:* A way to fake progress (e.g., forum bots).  
     - **Red flag:* Hard to detect/counter → **Reject**.  
     - *Judgment call:* If detection tools exist (e.g., plagiarism checks).

  6. **Q6: Can we add friction?**  
     - *Ask:* "What’s the cheapest way to make gaming harder than learning?"  
     - *Sufficient answer:* Simple tweak (e.g., caps, peer review, sampling).  
     - **Red flag:** No feasible fix → **Reject**.  
     - *Judgment call:* If fix adds workload (e.g., manual audits).

  7. **Q7: Human override possible?**  
     - *Ask:* "If this goes sideways, can instructors intervene without chaos?"  
     - *Sufficient answer:* Clear backup plan (e.g., spot-checks + grade adjustments).  
     - **Red flag:** No plan → **Reject**.  
     - *Judgment call:* Always. Document risks for instructors.

  **Outcome:**  
  - **Pass:** All answers sufficient + no red flags.  
  - **Fail:** Any red flag.  
  - **Conditional pass:** Judgment calls exist → escalate to instructor meeting.

  ---

  ### **Audit: Metric (a) - Lab credit for lines of code changed per commit**

  1. **True goal?** *"Encourage frequent, substantive coding practice."* → **Sufficient**.  
  2. **Easiest game?** *Add empty lines, comments, or break lines (e.g., `x = (a + b)` → `x = (a \n + b)`).* → **Red flag** (trivial, instant).  
  3. **Extremes?** *High lines → bloated code; Low lines → micro-commits (e.g., 1-line fixes).* → **Red flag** (incentivizes bad habits).  
  4. **Excluded work?** *Efficient code, deleting code, complex logic in few lines.* → **Red flag** (excludes key CS skills).  
  5. **Adversarial?** *Script to auto-format code + commit spam.* → **Red flag** (scales easily).  
  6. **Friction?** *Require tests passing? But same as last year’s issue.* → **No feasible fix** → **Red flag**.  
  7. **Override?** *Manual review? Infeasible at scale.* → **Red flag**.  
  **Verdict:** **REJECT** (4 red flags).  

  ---

  ### **Audit: Metric (b) - Participation credit for forum words written**

  1. **True goal?** *"Increase student engagement with course topics."* → **Sufficient**.  
  2. **Easiest game?** *Post "I agree" spam, copy-paste questions, or ramble.* → **Red flag** (trivial).  
  3. **Extremes?** *High words → walls of text; Low words → low-effort posts.* → **Red flag** (noise drowns signal).  
  4. **Excluded work?** *Quiet students who learn by reading, concise responders.* → **Judgment call** (may disadvantage introverts).  
  5. **Adversarial?** *Bot posts or copy-pasted essays.* → **Red flag** (hard to detect without tools).  
  6. **Friction?** **YES!** Add:  
     - Minimum word threshold (e.g., 50+ words)  
     - Maximum cap per post (e.g., 500 words)  
     - Peer upvotes required for credit (e.g., 3+ upvotes = credit)  
  7. **Override?** **YES!** TAs can remove spam or award bonus points for quality.  
  **Verdict:** **CONDITIONAL PASS** (2 red flags, but mitigable). *Requires human judgment on Q4/Q6.*  

  ---

  ### **What This Procedure CAN'T Catch (Blind Spots)**
  1. **Emergent collusion:** Students organizing to game collectively (e.g., upvote rings).  
  2. **Equity impacts:** Metrics that advantage certain groups (e.g., non-native speakers struggling with word counts).  
  3. **Stress/well-being:** Unintended incentives causing burnout (e.g., students writing posts at 2 AM).  
  4. **System interactions:** How the metric combines with others (e.g., forum words + code lines = students neglect debugging).  
  5. **Long-term drift:** Metric degrades over the semester as students adapt.  

  ---

  ### **Recommendation for Metric (b)**  
  **Keep it, but with safeguards:**  
  - Implement the friction from Q6 (word caps + peer upvotes).  
  - Make it ≤10% of the grade so gaming isn’t worth it.  
  - Add a "quality override" where TAs can remove credit for spam.  
  - **Monitor:** Run a weekly spot-check for nonsense posts.  

  This passes *if* your goal is volume-based engagement. If the true goal is *high-quality discussion*, supplement with:  
  - Require linking posts to course concepts (e.g., "In lecture 3...").  
  - Award bonus credit for TA-endorsed "excellent answers."  

  **Final note:** No metric is perfect. Build in iteration—announce you'll adjust rules if gaming emerges. Transparency reduces resentment.
