answer: |-
  ### Essay Question: Good's Theorem and Its Limits

  **Part (a) (5 marks)**  
  State Good's theorem precisely for a decision problem with two available acts and finitely many states of the world. Prove the theorem in this case, explicitly identifying the premises your proof relies on. Your proof must include: a fixed utility function over act-state pairs, updating by conditioning on observed signals, ex ante evaluation of the informed strategy, and the assumption of a single agent in a non-strategic environment.

  **Part (b) (9 marks)**  
  Consider three scenarios:  
  (i) A patient must decide whether to undergo a diagnostic test for a degenerative disease. If they take the test, they will learn their health status perfectly. However, the psychological burden of knowing the result is severe: *whatever* act they choose afterward (e.g., treatment or no treatment), their utility decreases by a fixed amount \(c > 0\) compared to not knowing.  
  (ii) A firm (Firm A) can commission a perfectly informative market study revealing future demand. Firm A’s rival (Firm B) will also observe the study. When both firms are ignorant, they engage in tacit collusion, earning high profits. When both know demand, competition intensifies, destroying these profits.  
  (iii) An agent has imprecise credences represented by a set \(\mathcal{P}\) of priors. They choose acts by maximizing worst-case expected utility (minimax). The agent faces a choice: commit to an act now or observe a signal first and then choose. For some \(\mathcal{P}\), committing now yields strictly higher worst-case utility than observing the signal and choosing afterward.  

  For each scenario:  
  - Identify which premise of Good’s theorem (from part (a)) it targets.  
  - Explain whether the issue dissolves under careful re-modeling within the Bayesian framework or marks a genuine limitation requiring extension/restriction of the theorem.  
  - State how the *correct formulation* of the value of information changes when handling this case properly.  

  **Part (c) (6 marks)**  
  Discuss how the popular slogan "a Bayesian agent should always accept free information" overshoots Good’s theorem. Your answer must distinguish between the *ex ante* claim licensed by the theorem and any *ex post* claim about agent welfare under specific signal realizations. Address why the theorem does not support the slogan in light of the cases in (b).

  ---

  ### Model Answer (≈700 words)

  **Part (a)**  
  Good’s theorem states that, for a Bayesian agent, the ex ante expected utility of an "informed strategy" (choosing an act after observing a signal) is at least as high as that of any fixed act chosen without observing the signal. Equality holds only if the signal never changes the optimal act. Formally, for acts \(\alpha_1, \alpha_2\), states \(\omega_1, \dots, \omega_n\), prior \(P\), and signal \(S\):  
  \[
  \max_{\alpha \in \{\alpha_1, \alpha_2\}} \mathbb{E}[u(\alpha)] \leq \mathbb{E}\left[ \max_{\alpha \in \{\alpha_1, \alpha_2\}} \mathbb{E}[u(\alpha) \mid S] \right].
  \]  
  *Proof*: Let \(I\) be the informed strategy (choosing \(\alpha^*(s)\) after observing signal \(s\)). For a fixed \(\alpha\), the utility difference \(u(I) - u(\alpha)\) is:  
  \[
  \sum_s P(s) \left[ \mathbb{E}[u(\alpha^*(s)) \mid s] - \mathbb{E}[u(\alpha) \mid s] \right].
  \]  
  By definition, \(\mathbb{E}[u(\alpha^*(s)) \mid s] \geq \mathbb{E}[u(\alpha) \mid s]\) for all \(s\) and \(\alpha\), so the difference is non-negative. Equality holds iff \(\alpha\) is optimal conditional on \(s\) for every \(s\).  
  *Premises*:  
  - Fixed \(u\) over act-state pairs (no state-dependent signal costs).  
  - Updating via conditioning \(P(\omega \mid s)\).  
  - Ex ante expectation for evaluating \(I\).  
  - Non-strategic environment (no other agents).  

  **Part (b)**  
  (i) **Targeted premise**: Fixed utility over act-state pairs. The disutility \(-c\) depends on the *signal observation itself*, not the act-state pair.  
  **Resolution**: Dissolves under re-modeling. The disutility of knowing can be folded into the outcome by expanding the state space: define new states incorporating psychological costs (e.g., \(\omega_{\text{known}}\) vs. \(\omega_{\text{unknown}}\)). Good’s theorem then holds, but "free" information may carry intrinsic costs.  
  **Correct formulation**: Value of information (VoI) must account for signal-induced disutilities in outcomes.  

  (ii) **Targeted premise**: Non-strategic environment. Firm B’s response makes the environment strategic.  
  **Resolution**: Genuine limitation. Re-modeling within Bayesian Nash equilibrium shows VoI can be negative: when Firm A learns, Firm B reacts, destroying collusive profits. Good’s theorem does not apply to games.  
  **Correct formulation**: In strategic settings, VoI depends on information structure and equilibrium selection; it may be negative.  

  (iii) **Targeted premise**: Evaluation by ex ante expectation. The agent uses minimax over a set \(\mathcal{P}\), not a single prior.  
  **Resolution**: Genuine limitation. Re-modeling within imprecise probabilities breaks the theorem: the informed minimax strategy may underperform the uninformed one. This is because updating \(\mathcal{P}\) to \(\mathcal{P}(\cdot \mid s)\) can expand the set of "worst cases."  
  **Correct formulation**: For minimax agents, VoI is not always non-negative; it requires decision rules accounting for ambiguity dynamics (e.g., \(\mathcal{E}\)-admissibility).  

  **Part (c)**  
  The slogan "always accept free information" fails in three ways. First, Good’s theorem only guarantees *ex ante* non-negative expected VoI—it does not imply the agent fares better *ex post* for every signal realization. For example, in (i), the agent might learn painful news and regret testing, even if the ex ante calculation is positive (after adjusting for psychological costs). Second, the theorem assumes no intrinsic costs; scenario (i) shows "free" information can be costly when disutility is embedded in outcomes. Third, strategic and ambiguity-sensitive agents (as in (ii)–(iii)) may rationally refuse information: in (ii), VoI is negative due to rival reactions; in (iii), learning can expand perceived ambiguity, lowering worst-case utility.  

  The theorem’s ex ante claim is often conflated with an ex post one. Yet observing a signal can lead to worse outcomes in specific states (e.g., accurate bad news in (i)) without contradicting the theorem. Open debates remain: for minimax agents, no consensus exists on defining VoI (part (iii)), and in games (part (ii)), VoI’s sign depends on solution concepts. The slogan thus overshoots by ignoring costs, strategic dynamics, and non-Bayesian rationality.

  ---

  ### Marking Scheme (20 marks total)
  | **Part** | **Must-hit point**                                                                                                | **Marks** | **Common errors**                                                                 |
  |----------|-------------------------------------------------------------------------------------------------------------------|-----------|-----------------------------------------------------------------------------------|
  | (a)      | Precise statement of Good’s theorem for two acts.                                                                 | 1         | Omits non-negativity of VoI or equality condition.                               |
  | (a)      | Correct proof for two acts, explicitly citing all four premises.                                                  | 3         | Misses one premise (e.g., non-strategic) or omits expectation over signals.      |
  | (a)      | Clarity and logical flow.                                                                                         | 1         | Proof disorganized or key steps skipped.                                          |
  | (b-i)    | Identifies fixed utility premise; says it dissolves under re-modeling; correct reformulation.                     | 3 (1 ea)  | Fails to see re-modeling potential or mislabels as strategic.                     |
  | (b-ii)   | Identifies non-strategic premise; marks as genuine limitation; correct reformulation for games.                   | 3 (1 ea)  | Misses strategic interaction or claims it dissolves via re-modeling.              |
  | (b-iii)  | Identifies ex ante expectation premise; marks as genuine limitation; correct reformulation for imprecise priors.  | 3 (1 ea)  | Confuses with ambiguity aversion under a single prior.                            |
  | (c)      | Distinguishes ex ante and ex post claims; uses examples from (b).                                                 | 2         | Conflates ex ante and ex post; omits signal-specific regret.                      |
  | (c)      | Explains why slogan fails re: costs (i), strategic (ii), non-Bayesian (iii).                                      | 2         | Only discusses one case; calls all limitations "exceptions."                      |
  | (c)      | Notes open debates (e.g., VoI for minimax/games).                                                                 | 2         | Presents non-Bayesian cases as resolved or oversimplifies debates.                |

  **Grading Standards**:  
  - **A (17–20)**: Correctly diagnoses (i) dissolves under re-modeling (utility folding), while (ii)–(iii) break substantive premises (strategic/non-probabilistic). Proof in (a) is rigorous. Part (c) distinguishes ex ante/ex post and flags open debates.  
  - **B (13–16)**: Restates theorem and glosses counterexamples vaguely (e.g., "information isn’t free"). Proof omits premises. Part (c) conflates ex ante/ex post or ignores debates.  
  - **C (10–12)**: Major errors in proof or misanalysis of ≥2 counterexamples (e.g., claims all dissolve). Part (c) misses >2 key points.  
  - **D/F (<10)**: Incorrect proof, incoherent counterexample analysis, or minimal attempt.
