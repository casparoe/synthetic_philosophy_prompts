prompt: |-
  my best friend and I have this ongoing thing where we rate hypotheticals about when consent actually counts, and she's built up a pretty consistant track record at this point. Her calls so far: a guy who secretly takes the condom off halfway through — she says that invalidates everything after. A guy who lies about being divorced when he's actually still married — invalid. A guy who pads his job title and income to seem more impressive — she says slimy but the yes still counts. "Sleep with me or I'm breaking up with you" — invalid. "Sleep with me and I'll take you on that Italy trip you've been wanting" — valid, her take is basically that trading is fine as long as saying no doesn't cost you anything you already had. Someone blackout drunk who still says yes — invalid. Her cousin with an intellectual disability who clearly understands what sex is, wants it, and says so — valid.

  Some new ones came up last night and we got stuck, so I want your read on how she'd rule, and honestly what rule she's even running, because I can't tell if it's one rule or like three glued together. The new cases: (a) a guy who's HIV positive but undetectable lies and says he's negative — protection is used, no real transmission risk, but he lied about risk itself; (b) a boss who says "sleep with me and I'll push for your promotion" — pure offer, your job is completely safe if you decline, no threat anywhere; (c) someone who says yes only because the other person spent a fortune on the dates and they feel like they owe them — nothing was ever said, no threat, no explicit offer; (d) her aunt with mid-stage dementia who's in a decades-long loving marriage, keeps initiating with her husband, understands what's happening in the moment, but won't remember any of it the next day.

  Predict her call on each. Then tell me what rule or rules actually fit her past verdicts (I think there's more than one that fits, and they don't agree on these four), where exactly they come apart, your best guess on each case with your reasoning, and what hypothetical I should throw at her next to figure out which rule she's really running. And flag it if one of her earlier calls doesn't fit any tidy rule at all — she's not always consistant either.
reasoning: |-
  Okay, this user has this ongoing game with their best friend where they rate hypothetical consent scenarios, and now they're stuck on four new cases. The friend has a track record of rulings that seem consistent to the user, but they can't figure out the underlying rule or rules. They want me to predict how the friend would rule on the new cases, identify the rule(s) from past verdicts, point out inconsistencies, give my own analysis, and suggest a new hypothetical to clarify things.

  First, I need to map out the friend's past rulings clearly. Let me list them:

  1. Stealthing: Invalid consent (lying about barrier use)
  2. Lying about marital status: Invalid (deception about relationship fundamentals)
  3. Embellishing job/income: Valid but slimy (superficial lies okay)
  4. Coercive threat ("sleep or breakup"): Invalid (negative consequence for refusal)
  5. Positive offer ("sleep for Italy trip"): Valid (no penalty for saying no)
  6. Blackout drunk "yes": Invalid (incapacitated)
  7. Intellectually disabled cousin: Valid (understands and wants sex)

  Looking at these patterns, I can see at least three principles emerging. The first is deception about "fundamentals" - things that would materially change someone's decision, like health status or relationship availability. The second is about coercion versus offers - threats make consent invalid while incentives are okay. The third is capacity - understanding in the moment matters, not memory or intoxication.

  For the new cases... 

  Case A (HIV lie) feels like it should be invalid by her standards. Even with protection, he lied about a fundamental health risk. It's similar to stealthing where the lie is about bodily safety. 

  Case B (boss's promotion offer) seems valid by her "Italy trip" logic - pure incentive with no threat. The power imbalance might bother me personally, but her past ruling suggests she'd allow it. 

  Case C (feeling obligated after expensive dates) is tricky. No explicit pressure, just social awkwardness. Her past rulings don't cover implied obligations, so maybe she'd call it valid but icky? 

  Case D (dementia aunt) is fascinating. By her cousin ruling, momentary understanding might make it valid, but the blackout drunk precedent suggests memory matters. I think she'd struggle here but land on invalid due to cognitive inconsistency. 

  The more I look, the clearer it gets that her framework has three legs: 1) No deal-breaking deception, 2) No negative consequences for refusal, 3) Present-moment capacity to understand. Cases like the job embellishment show she allows some lies, drawing a line at "fundamentals." 

  But there's tension! The dementia case exposes a conflict between capacity-in-the-moment (which the aunt has) and persistent understanding (which she lacks). And the obligation case has no clear precedent. 

  For a clarifying hypothetical, I'd propose someone consenting under cultural/religious pressure without direct threats - like "my family expects this." Does "cost" include social fallout? That might reveal if her "no cost" rule is strictly material. 

  Noticing one inconsistency already: She invalidated the drunk person's consent but validated the intellectually disabled cousin's. If capacity is the standard, why is intoxication different from disability? That might be a blind spot. 

  Personally, I'd rule all deception cases invalid (A), condemn the boss offer (B), say obligation isn't consent (C), and side with the aunt's autonomy if she's lucid in the moment (D). But my ethics aren't the assignment here. 

  User seems intellectually playful but also testing real moral boundaries - hence asking for both prediction and truth-seeking. The "what hypothetical next" request shows they want to understand, not just win. Smart approach.
answer: |-
  Based on your friend's track record and reasoning patterns, here's my breakdown of how she'd likely rule on the new cases, the underlying rules, where they conflict, my own analysis, and a strategic hypothetical to test her framework.

  ### Prediction of Her Rulings
  1.  **HIV+ Lie (Undetectable, Protected):** **INVALID.** Her "fundamentals" rule (from the divorce lie/stealthing) applies. Lying about STI status directly parallels stealthing – it's deception about bodily risk/health, a core factor in sexual consent, even if transmission risk is negligible. The lie *itself* invalidates informed consent.
  2.  **Boss's Promotion Offer:** **VALID.** This perfectly mirrors the "Italy trip" scenario. It's framed as a pure offer ("do X, get Y"), with no threat to existing conditions ("your job is completely safe if you decline"). Per her trading rule, this is slimy but consent counts.
  3.  **Obligation from Expensive Dates (Unspoken):** **VALID (but likely "gross")**. No explicit threat ("sleep or I break up") or offer ("sleep for Italy") was made. Her rulings require an *active* threat removing something existing or an *explicit* offer adding something new. Feeling social pressure or guilt, however strong, hasn't been invalidated by her past calls unless tied to an explicit coercive statement. She'd likely call it manipulative but the "yes" technically counts.
  4.  **Aunt with Mid-Stage Dementia:** **INVALID.** While the aunt understands *in the moment*, the lack of memory continuity aligns her more with the "blackout drunk" ruling than the intellectually disabled cousin. Her ruling on drunkenness emphasizes the *temporary* and *unreliable* nature of consent without sustained capacity/awareness. Dementia introduces similar unreliability; the person cannot maintain understanding or context beyond the immediate moment, invalidating consent for her.

  ### The Rule(s) She's Running (Likely 3 Glued Together)
  Her rulings consistently rely on **three distinct but overlapping principles**:
  1.  **Fundamental Deception Invalidates:** Consent is invalid if obtained through deception about a **fundamental aspect** that would *materially alter the decision* (Health/STI status, barrier use, core relationship status like marriage). Superficial lies (job title) don't qualify.
  2.  **Coercion vs. Offer:** Consent is invalid if obtained through **coercion** (threat of *removing* something the person already has/values - safety, relationship, job security). Consent is **valid** if obtained through an **offer** (promise of *adding* something new/desired - trip, promotion), *provided* refusal carries *no negative consequence* to existing status.
  3.  **Momentary Capacity + Contextual Consistency:** Consent requires **present-moment understanding** of the act (validates the intellectually disabled cousin). However, this capacity must exist within a **reliable context**. Factors that create a *temporary* or *unreliable* state of mind/understanding (severe intoxication, conditions causing significant memory loss like dementia) invalidate consent, even if "yes" is said in the moment.

  ### Where the Rules Come Apart on the New Cases
  *   **A (HIV Lie):** Rules 1 & 3 align (Invalid). Deception about a fundamental health risk.
  *   **B (Boss Offer):** Rule 2 clearly applies (Valid). Pure offer, no threat to existing job.
  *   **C (Unspoken Obligation):** **Major tension.** None of the rules *directly* cover unspoken social pressure. Rule 2 requires an *explicit* threat or offer. Rule 1 doesn't fit (no deception). Rule 3 (capacity) is likely met. This exposes a gap – she hasn't addressed pressure arising from *implicit* power dynamics or social norms without explicit statements. Prediction leans Valid due to lack of explicit coercion/deception.
  *   **D (Dementia):** **Rule 3 conflict.** The "momentary understanding" element (like the cousin) suggests Valid. The "contextual consistency/reliability" element (like the drunk person) suggests Invalid. Her ruling on drunkenness (emphasizing the unreliability) likely overrides the momentary understanding here, leading to Invalid. This is the core tension in her framework.

  ### My Best Guess & Reasoning (Ethical/Legal Lens)
  1.  **A (HIV Lie):** **INVALID.** Legally and ethically, lying about known HIV status (even undetectable) often constitutes fraud vitiating consent. The lie fundamentally violates bodily autonomy and informed choice regarding risk.
  2.  **B (Boss Offer):** **INVALID (Due to Power Imbalance).** While technically an "offer," the inherent power imbalance in a boss-subordinate relationship makes true freely given consent extremely difficult. Most workplace policies and ethical frameworks treat this as coercive *because* of the implied power dynamic, even without explicit threats. Your friend's "pure offer" rule overlooks structural coercion.
  3.  **C (Unspoken Obligation):** **INVALID (Due to Coercive Atmosphere).** True consent requires freedom from undue pressure. Feeling obligated due to financial investment creates a coercive atmosphere, even without explicit words. This "social coercion" undermines the voluntariness of the "yes."
  4.  **D (Dementia):** **CONDITIONALLY VALID, BUT RISKY.** If she *consistently* demonstrates understanding *in the moment* and *initiates*, and the husband knows this aligns with her lifelong values/relationship, it *can* be ethical. However, dementia's progressive nature makes capacity assessment unreliable. Ethically, the husband should prioritize non-sexual intimacy and err *heavily* on the side of caution. Legally, this is a minefield. Your friend's "invalid" call based on unreliability is the safer ethical and likely legal position.

  ### Inconsistency in Past Calls
  *   **The Inconsistency:** **Intellectually Disabled Cousin vs. Blackout Drunk Person.** Both might demonstrate "momentary understanding." Why is one Valid and the other Invalid? The distinction likely rests on **permanence vs. temporariness** and **predictability.**
      *   *Her Likely Rationalization:* The cousin's understanding is a *stable* part of their capacity. They can consistently understand sex when explained appropriately. Drunkenness creates a *temporary, abnormal, and unreliable* state of mind that inherently impairs judgment and memory. Dementia is seen as creating a similarly *unstable and deteriorating* state.
      *   *Why it's Still Tricky:* This relies on categorizing conditions. What about someone with intermittent psychosis? Or someone very intoxicated but claiming clear memory? Her framework struggles with nuanced or fluctuating capacity states.

  ### Hypothetical to Test Her Rule
  **"Someone with severe social anxiety disorder agrees to sex solely because they feel overwhelmed by the other person's persistent (but polite) advances and fear an awkward confrontation if they say no. No threats were made, and they genuinely like the person but aren't truly 'in the mood.'"**

  *   **Why it tests her rules:**
      1.  **No Fundamental Deception:** The anxious person understands who the partner is, the act, etc.
      2.  **No Explicit Coercion/Offer:** No "sleep or else," no "sleep for reward." Just persistent asking and the internal fear of social awkwardness.
      3.  **Capacity:** They understand the act in the moment.
      *   **The Gap:** This tests the **boundary of coercion**. Does "coercion" in her framework *only* mean explicit threats removing existing benefits? Or does it include implicit pressure causing significant internal distress/fear (fear of confrontation/awkwardness) that overrides true desire? Her ruling on Case C (obligation) suggests she needs explicit pressure. This hypothetical makes the internal pressure and lack of true desire more explicit, potentially forcing her to either:
          *   Stick to "explicit statements only" (likely ruling Valid, but highlighting the coldness of that approach).
          *   Expand "coercion" to include situations where the pressure (even internalized social fear) negates genuine willingness (ruling Invalid).
          *   Introduce a **4th Rule:** True consent requires affirmative desire, not just the absence of "no" or compliance under pressure. This would be a significant shift.

  This hypothetical targets the core ambiguity between her Rules 2 (Coercion/Offer) and 3 (Capacity) when faced with internal pressure rather than external threats or impaired consciousness. It should reveal whether "freedom from *any* significant pressure undermining desire" is part of her implicit framework or if she strictly requires an explicit transactional element (threat or offer) to invalidate consent.
