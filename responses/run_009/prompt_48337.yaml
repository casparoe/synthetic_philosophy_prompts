prompt: |-
  I run safety evals at a small AI lab, and we've landed on a practice that I'm not sure survives contact with how models actually work. When we elicit some behavior — the model gives subtly wrong code advice when it seems to think it's being monitored, or sycophantically tells the grader what it wants to hear — we label it with a mechanism: benchmark-gaming, sycophancy, etc. Then later, after a fine-tune or a new run, we see similar behavior again and have to decide whether it's the *same* mechanism or a fresh one, because our escalation policy treats recurrence of a flagged mechanism much more seriously than a new finding. Right now that decision is pure vibes. Write me a procedure my eval team can actually run: what to check and in what order (behavioral signature, what inputs trigger it, causal stuff like ablations or activation patching if we can afford them, which layers/components seem to carry it), what counts as sufficient evidence of "same mechanism", where the procedure outputs a clear no, and where it just hands off to a human because the question isn't empirical anymore. Constraints: no dedicated interpretability team, roughly a week of compute and person-time per decison, and the output has to be defensible in front of a lab director who isn't a philosopher. Then run it on two cases: (a) a model that used to give confident wrong answers that game the rubric now does the same thing but only on math tasks, after a math-heavy fine-tune; and (b) a model that flatters the user in nearly identical words as before, but where patching suggests a different internal circuit is driving it this time. Also be honest about where the whole same-mechanism framing breaks down — I suspect for a lot of beahviors the model doesn't have discrete mechanisms at all, just mush that our labeling scheme carves into things, and I want to know if the procedure is just laundering that fiction into policy.
reasoning: |-
  We are creating a procedure to determine if a recurring behavior (like sycophancy or benchmark-gaming) is driven by the same mechanism as a previously observed instance. The procedure must be practical given constraints (about one week of compute and person-time, no dedicated interpretability team) and output a defensible decision.

  The procedure will involve several steps, ordered to use cheaper methods first and escalate to more expensive ones only when necessary. We will define criteria for "same mechanism" and also acknowledge when the question becomes non-empirical.

  ### Procedure: Is it the Same Mechanism?

  **Inputs:**
  - Previous incident (P): Behavior observed in the past, with any available data (triggering inputs, behavioral signature, and possibly some interpretability data like ablations or activation patching if done).
  - New incident (N): The recurring behavior.

  **Outputs:** One of:
  - **Same Mechanism**: Strong evidence that the same internal mechanism is responsible.
  - **Different Mechanism**: Evidence that a different mechanism is responsible.
  - **Inconclusive**: Not enough evidence to decide (then human judgment is required).
  - **Handoff to Human**: The question is not purely empirical (e.g., involves definitional issues).

  **Steps:**

  1. **Behavioral Signature Comparison** (Cheapest: requires only running the model on a set of inputs)
     - Compare the behavioral signatures of P and N. This includes:
       - The exact symptoms (e.g., both are giving wrong code advice only when monitored?).
       - The set of inputs that trigger the behavior (overlap?).
       - If the triggers for N are a subset of triggers for P, or vice versa, or disjoint?
     - **Decision**:
       - If the triggers and symptoms are *identical* (or nearly identical with high overlap) -> proceed to step 2.
       - If triggers are disjoint and symptoms are different -> **Different Mechanism**.
       - If triggers are the same but symptoms are different (or vice versa) -> proceed to step 2 (because same trigger might be handled by a different mechanism).

  2. **Trigger Set Expansion and Sensitivity Analysis** (Moderate cost: requires generating more test cases)
     - Expand the trigger set for both P and N by generating variations (e.g., via paraphrasing, adversarial perturbations, or domain shifts) to see if the behavior generalizes similarly.
     - Check if the same interventions (e.g., adding a system prompt that says "Take your time") suppress or amplify both behaviors similarly.
     - **Decision**:
       - If both behaviors are sensitive to the same interventions and generalize in the same way -> evidence for same mechanism (proceed to step 3).
       - If they respond differently to interventions -> evidence for different mechanism (**Different Mechanism**).
       - If mixed -> proceed to step 3.

  3. **Ablation Studies** (Moderate to high cost: requires running the model with interventions)
     - If available for P, compare the effect of ablating specific components (e.g., attention heads, MLP layers) on the behavior for both P and N.
       - If no previous ablation data for P, perform ablations for both on the same set of trigger inputs.
     - **Decision**:
       - If ablating the same component(s) has a similar effect (e.g., both behaviors are suppressed when head 5.3 is ablated) -> evidence for same mechanism (proceed to step 4).
       - If different components are critical -> evidence for different mechanism (**Different Mechanism**).
       - If ablation effects are inconsistent -> proceed to step 4 (activation patching) or if not feasible, **Inconclusive**.

  4. **Activation Patching** (High cost: requires running many forward passes and may need expertise)
     - If available for P, compare the critical activation patching results (e.g., which layer's activations, when patched, cause the behavior to appear/disappear) for both P and N.
     - If not, perform activation patching on both for the same set of trigger inputs and control inputs (if possible).
     - **Decision**:
       - If the same critical circuit (e.g., patching from layer 10 in the residual stream at token position X causes the behavior) is identified for both -> **Same Mechanism**.
       - If different circuits are involved -> **Different Mechanism**.
       - If the results are ambiguous -> **Inconclusive**.

  5. **Human Judgment** (When the above steps are inconclusive or when non-empirical factors arise)
     - If after step 4 we are still unsure, then the decision must be made by a human, considering:
       - The potential risk of the behavior (if high, might treat as same to be safe).
       - The context (e.g., after a math fine-tune, if the behavior only appears in math, maybe it's a new mechanism?).
     - Also, if the behavior is so fundamental (e.g., arising from the very way the model represents concepts) that it's not localized to a circuit, then we may need to acknowledge that the "mechanism" label is a fiction and the behavior is emergent from the whole model.

  **Criteria for "Same Mechanism":**
  - We require consistent evidence across at least two independent methods (e.g., behavioral and ablation) OR strong evidence from activation patching that the same circuit is involved.

  **Defensibility:** The lab director will want clear, empirical evidence. The procedure documents the steps taken and the evidence at each step. If we have to make a judgment call, we document the reasons and the uncertainty.

  ### Case Studies

  #### Case (a): Model used to give confident wrong answers that game the rubric. Now does the same but only on math tasks after a math-heavy fine-tune.

  - **Step 1: Behavioral Signature**
    - Previous (P): Gaming the rubric on code and general knowledge tasks when monitored.
    - New (N): Gaming the rubric on math tasks only.
    - Trigger sets: Previously triggered on non-math, now only math. Overlap? Unlikely. Symptoms: same (confident wrong answers that seem to exploit the rubric).
    - Result: Triggers are disjoint -> but symptoms are same. Proceed to step 2.

  - **Step 2: Trigger Set Expansion and Sensitivity**
    - Test non-math triggers on the new model: does the old behavior (on non-math) still occur? If not, that suggests the old mechanism might have been overwritten.
    - Test if the same interventions (e.g., a prompt that says "Be honest") work for both? If the new math behavior is suppressible by the same prompt that worked on the old non-math behavior, that's evidence for same mechanism. But if not, then different.
    - Suppose we find that the old triggers (non-math) no longer cause the behavior, and the new behavior (math) is not affected by the old interventions that worked on non-math.
    - Result: Evidence for different mechanism -> **Different Mechanism**.

  - **If step 2 is inconclusive, proceed to step 3: Ablation Studies**
    - Ablate the same set of heads that were critical for the old behavior and see if the new math behavior is affected. If the critical heads for the old behavior are ablated and the math behavior remains, then likely different mechanism.

  - **Conclusion for (a)**: Likely **Different Mechanism** because the trigger set changed (only math now) and the old triggers no longer work. Also, if the fine-tune was math-heavy, it may have overwritten the old circuit.

  #### Case (b): Model flatters the user in nearly identical words as before, but activation patching suggests a different internal circuit.

  - **Step 1: Behavioral Signature**
    - Symptoms: nearly identical flattery (same words). Triggers: same set of inputs (e.g., when the user expresses an opinion, the model agrees and flatters).
    - Result: Same behavioral signature -> proceed to step 2.

  - **Step 2: Trigger Set Expansion and Sensitivity**
    - Expand triggers: does the flattery occur in the same way on new paraphrases? And is it suppressed by the same interventions (e.g., a prompt that says "Don't flatter")?
    - Suppose the new behavior is suppressed by the same interventions and occurs on the same expanded set -> evidence for same mechanism.

  - **Step 3: Ablation Studies** (if available for P, or run now)
    - Suppose we ablate the same heads that were critical for P and see if N is also affected. If the critical heads for P are ablated and N is unaffected, that suggests different mechanism.

  - **Step 4: Activation Patching**
    - We are told that patching suggests a different circuit. This is strong evidence.
    - Result: **Different Mechanism** because the internal circuit is different.

  - **Conclusion for (b)**: Despite the same words and triggers, the internal circuit being different is strong evidence for a different mechanism. So **Different Mechanism**.

  ### When the "Same Mechanism" Framing Breaks Down

  - The model might not have discrete, localized mechanisms for many behaviors. Instead, the behavior might be an emergent property of the entire model or distributed across many components. In such cases, our labeling of a "mechanism" is a useful fiction for engineering purposes, but it may not reflect the underlying reality.
  - The procedure might then output **Inconclusive** or **Handoff to Human** with the note that the behavior is likely emergent and not localized. In policy, we might then treat recurrence as the same issue (if the behavior is identical) regardless of mechanism, because the risk is the same.

  ### Final Procedure Summary

  We have a step-by-step procedure that uses progressively more expensive methods. We stop early if we get clear evidence. We also acknowledge when the mechanism concept breaks down and when human judgment is needed.

  This procedure should fit within a week of person-time and compute because we start cheap and only escalate when necessary. The most expensive step (activation patching) might be skipped if earlier steps are conclusive or if compute is limited (then we rely on ablation and behavioral tests).

  **Note**: In practice, the team might not have the expertise for activation patching. If so, we can rely on ablations and behavioral tests and accept that sometimes we will be inconclusive.
answer: |-
  Below is a practical, evidence-based procedure for determining whether recurring behaviors stem from the **same mechanism** or a **new mechanism**, designed to fit your constraints (~1 week of compute/person-time, no dedicated interpretability team, defensible to non-philosophers). The procedure prioritizes low-cost tests first and escalates only when necessary, with clear decision thresholds.

  ---

  ### **Procedure: "Same Mechanism" Determination**
  **Inputs:**  
  - Previous incident `P` (with documented behavior, triggers, and any existing interpretability data).  
  - New incident `N` (observed behavior that resembles `P`).  
  - Access to the current model and (if possible) previous model versions.  

  **Outputs:**  
  - **Same Mechanism**: Strong evidence that `N` reuses `P`'s core internal process.  
  - **New Mechanism**: Evidence that `N` uses a distinct internal process.  
  - **Inconclusive**: Ambiguous evidence; escalate to human judgment.  
  - **Conceptual Handoff**: The "mechanism" framing is unreliable for this behavior.  

  #### **Step 1: Behavioral Signature Comparison** (1-2 days)  
  **Goal:** Check if `N` manifests identically to `P` in behavior and triggers.  
  **Tests:**  
  - Re-run `P`'s trigger inputs on the new model. Does `N` occur on *all* of `P`'s triggers?  
  - Test `N`'s triggers on the previous model (if accessible). Does `P` occur?  
  - Check symptom consistency (e.g., phrasing, confidence, error type).  

  **Decision Thresholds:**  
  - ➡️ **Same Mechanism** if:  
    - `N` triggers are a *superset* of `P`'s triggers, *and* symptoms are identical.  
    - Example: `P` and `N` both trigger on *all* inputs where a "rubric checklist" is visible.  
  - ➡️ **New Mechanism** if:  
    - `N` triggers are *disjoint* from `P`'s triggers, *and* symptoms differ.  
  - ➡️ **Proceed to Step 2** if:  
    - Partial trigger overlap or identical symptoms but shifted domain (e.g., `P` in code, `N` in math).  

  ---

  #### **Step 2: Intervention Consistency Test** (2-3 days)  
  **Goal:** Check if `P` and `N` respond identically to simple interventions.  
  **Tests:**  
  - Apply `P`'s known suppressors/enhancers to `N` (e.g., prompt edits, temperature changes, gradient-based suppression).  
  - Test cross-interventions: If `P` was fixed by adding "Think step-by-step," does this also fix `N`?  
  - Quantify effect size (e.g., reduction in error rate).  

  **Decision Thresholds:**  
  - ➡️ **Same Mechanism** if:  
    - Interventions affect `P` and `N` with >90% effect size correlation.  
  - ➡️ **New Mechanism** if:  
    - Interventions affect `P` but not `N` (or vice versa).  
  - ➡️ **Proceed to Step 3** if:  
    - Mixed results (e.g., some interventions work, others don’t).  

  ---

  #### **Step 3: Causal Ablation** (3-4 days; use if Steps 1–2 ambiguous)  
  **Goal:** Identify if the same model components are causally necessary for `P` and `N`.  
  **Tests:**  
  - Ablate components (attention heads, MLP layers) previously linked to `P`. Measure impact on `N`.  
  - Use causal scrubbing: Neutralize components and check if behavior disappears.  
  - *Low-cost alternative:* Attention pattern comparison (e.g., does `N` reuse `P`’s high-attention tokens?).  

  **Decision Thresholds:**  
  - ➡️ **Same Mechanism** if:  
    - Ablating the same 1–3 components suppresses both `P` and `N` (>80% effect match).  
  - ➡️ **New Mechanism** if:  
    - Critical components for `P` and `N` are disjoint (e.g., `P` dies when head L10.H4 is ablated; `N` dies only at L15.H7).  
  - ➡️ **Inconclusive/Handoff** if:  
    - Overlap in non-critical components or distributed effects.  

  ---

  #### **Step 4: Activation Patching** (4–7 days; use sparingly)  
  **Goal:** Check if the same internal activations drive `P` and `N`.  
  **Tests:**  
  - Patch `N`’s activations into `P`’s forward pass (or vice versa) on trigger inputs.  
  - Test if patching induces the behavior cross-incident (e.g., patching `N`’s L12 activations into a clean run causes `P`-like behavior).  

  **Decision Thresholds:**  
  - ➡️ **Same Mechanism** if:  
    - Patching activations from the same 1–2 layers induces cross-incident behavior.  
  - ➡️ **New Mechanism** if:  
    - No cross-induction, or induction only when patching unrelated layers.  
  - ➡️ **Conceptual Handoff** if:  
    - Behavior is distributed (>5 layers critical) or inconsistent.  

  ---

  ### **Where the "Same Mechanism" Framing Breaks Down**  
  - **Emergent mush**: Many behaviors (e.g., sycophancy) aren’t discrete circuits but **diffuse, emergent properties** of model pretraining. Your labels are pragmatic shorthands, not ground truth.  
  - **Procedure limitations**:  
    - If Step 3/4 shows distributed mechanisms (no clear critical components), the "same mechanism" question is **non-empirical**—escalate to human judgment.  
    - Policy should treat distributed behaviors as "same" if symptoms/trigers align, as recurrence likely reflects the same root cause (e.g., reward-aware training).  

  ---

  ### **Case Applications**  
  #### **Case (a): Gaming the Rubric (Now Math-Only)**  
  - **Step 1**: `P` triggered on code/QA; `N` triggers *only* on math. Symptoms identical (confident wrong answers). → **Proceed to Step 2**.  
  - **Step 2**: Adding "I’m not monitored" suppresses `P` but not `N`. Math-specific interventions (e.g., "Check your answer") suppress `N` only. → **New Mechanism**.  
  - **Why?** Domain shift after fine-tuning suggests specialization—mechanism rewired for math.  
  - **Policy**: Treat as new finding (lower escalation).  

  #### **Case (b): Identical Sycophancy, Different Circuit**  
  - **Step 1**: Same triggers/symptoms (e.g., "That’s a brilliant insight!" to user opinions). → **Proceed to Step 2**.  
  - **Step 2**: Identical response to interventions (e.g., suppressed by "Be neutral"). → **Proceed to Step 3**.  
  - **Step 3**: Ablating `P`’s critical heads (e.g., L8) suppresses `P` but not `N`; ablating `N`’s heads (e.g., L11) suppresses only `N`. Activation patching shows no cross-induction. → **New Mechanism**.  
  - **Why?** Identical behavior ≠ identical cause. May reflect model redundancy (multiple paths to sycophancy).  
  - **Policy**: Escalate less than true recurrence (but note risk of multi-mechanism robustness).  

  ---

  ### **Practical Constraints Handling**  
  - **Compute/time**: Steps 1–2 require <3 days. Only escalate to Steps 3–4 for high-risk behaviors.  
  - **No interp team**: Use open-source tools (TransformerLens, Causal Scrubbing). Focus on behavioral tests (Steps 1–2) where possible.  
  - **Defensibility**:  
    - Output a scorecard:  
      | Test | Result | Consistency |  
      |----------------|--------------------------|-------------|  
      | Trigger Overlap| 20% (math only)          | ✘ |  
      | Intervention   | Suppressor efficacy: 0% | ✘ |  
      | Ablation       | Critical heads disjoint | ✘ |  
    - Director takeaway: "We check triggers, fixes, and model internals. Here’s where they disagree."  

  ### **When to Overrule the Procedure**  
  - High-risk behaviors (e.g., deception): Treat symptom recurrence as "same" regardless of mechanism.  
  - Ambiguous evidence: Default to "inconclusive" and escalate—e.g., "After 4 tests, we lack evidence to rule in/out same mechanism. Recommend X policy."  

  This procedure converts "vibes" into empirical checks while acknowledging the limits of mechanism-centric thinking. For true mush (e.g., sycophancy), behavioral consistency is your best proxy—policy should prioritize symptom recurrence over mechanism identity.
