  - Yes: then you must hold that despite behavioral equivalence, one is correct. But then you need to say why, and also you must hold that the shaman manual is not correct. But then why did you say it is equally supported by behavior? This seems inconsistent. So we can mark this as "Unnamed and Incoherent? Or Relativism?" But relativism might say both are correct for their own manual.

  But the question is about the correct manual for the native language. So relativism might not apply.

  Alternatively, we can have a leaf for "Relativism about Reference" if they say there is a fact of the matter but it is relative to the manual. But that is not standard.

  Given the complexity, and to keep it clean, we might say that if you answer Yes to Q3, then the only consistent answer at Q4 is No (no fact of the matter). If you answer Yes to Q4, that's not a standard position and might be incoherent.

  So we can do:

  Q3=Yes -> then Q4: Is there a fact of the matter?
  - No: Leaf C: Quinean Indeterminacy.
  - Yes: Leaf G: **Unnamed (and problematic)**: You think there is a fact of the matter despite behavioral equivalence and without a clear tie-breaker. Awkward extra: You must explain what the fact is and why it is not reflected in any evidence, and also how we could know about it.

  Then, for the Q3=No branch, we go to Q5: What rules out the shaman manual? (A, B, C as before).

  Now, we have 7 leaves? But we can live with that.

  Final Tree:

  Q1: Could two manuals, both fitting all behavioral evidence, disagree about the reference of "gavagai"?
  - No -> Leaf A: **Behavioral Determinism**. (Awkward extra: You must explain how behavior uniquely fixes reference, despite Quine's arguments.)
  - Yes -> Q2.

  Q2: Is this underdetermination of the same kind as in physics?
  - Yes -> Leaf B: **Ordinary Underdetermination (Epistemic)**. (Awkward extra: You must hold that there is a fact of the matter about reference that transcends evidence, and that translation is not worse off than physics.)
  - No -> Q3.

  Q3: Could the shaman-dependent manual (see above) be just as well supported as the simple rabbit manual?
  - Yes -> Q4.
  - No -> Q5.

  Q4 (after Yes at Q3): Once all evidence is in and the manuals are tied, is there a fact of the matter about which manual is correct?
  - No -> Leaf C: **Quinean Indeterminacy**. (Awkward extra: You must accept that meaning is indeterminate even in your own language.)
  - Yes -> Leaf D: **Unnamed (Non-Behavioral Fact without Behavioral Manifestation)**. (Awkward extra: You must explain what this fact is and how we could know about it, given that it doesn't affect behavior.)

  Q5 (after No at Q3): What rules out the shaman-dependent manual? / What fixes the reference? 
  - A) Innate linguistic structures -> Leaf E: **Chomskyan Nativism**. (Awkward extra: You must accept that there are innate, universal constraints on reference that are not learned.)
  - B) Principles of charity or rationality -> Leaf F: **Davidsonian Charity**. (Awkward extra: You must interpret others as mostly rational and having mostly true beliefs, which may require attributing some strange beliefs when they err.)
  - C) The world itself (e.g., causal relations) -> Leaf G: **Metaphysical Realism about Reference**. (Awkward extra: You must confront the challenges that causal relations are inscrutable (Quine) and that they might not determine meaning (Kripke).)

  Note: The Kripke-Wittgenstein view is not directly captured. We can add a note: "If you are inclined to Leaf C (Quinean Indeterminacy) because of considerations about rule-following rather than translation, you might be sympathetic to Kripke's Wittgenstein."

  Also, we must note that the tree doesn't cleanly separate Quine and Davidson because Davidson is in the Q5=B branch, and Quine is in the Q3=Yes, Q4=No branch. They are distinct.

  The tree has 5 nodes (Q1, Q2, Q3, Q4, Q5) and 7 leaves (A to G). That fits on one page.

  Now, write it out.
answer: |-
  Below is a decision-tree handout designed for your seminar on Quine's indeterminacy of translation. I've structured it as a flowchart with 6 diagnostic questions (nodes) leading to 7 named or labeled positions (leaves). The tree starts from the field linguist's perspective and uses Quine's "gavagai" example as the core case. Each question is phrased neutrally so students can answer based on their intuitions without prior knowledge of the positions. The tree incorporates your three specified splits (behavioral underdetermination, comparison to physics, and the shaman test case) and locates key positions (Quine, Davidson, Chomsky, Kripke-Wittgenstein) within the logical space.

  The tree reveals that some answer combinations lead to unnamed or problematic views, either because they are incoherent, unattractive, or unexplored. I've flagged these, along with ambiguities (e.g., Quine and Davidson are cleanly separated here, but Quine's holism and Kripke-Wittgenstein share similarities). Each leaf includes a one-sentence note on any "awkward extra commitment" the student must accept. The handout fits on one page and assumes students have read the "gavagai" sections of *Word and Object*.

  ---

  ### **Quine’s Indeterminacy of Translation: Where Do You Stand?**  
  *You’re a field linguist in the jungle. All you have is the natives’ observable behavior (utterances, gestures, reactions) to translate "gavagai." Start here and follow the questions to your position.*

  #### **Q1: Could two translation manuals fit all possible behavioral evidence (past, present, and future) yet disagree on what "gavagai" refers to—e.g., one says "rabbit," the other says "undetached rabbit part"?**
  - **No** → Go to Leaf A: **Behavioral Determinism**.  
  - **Yes** → Go to Q2.

  #### **Q2: Is this underdetermination the *same* kind as in physics? (E.g., like two orbital theories fitting all evidence but disagreeing on hidden causes.)**
  - **Yes** → Go to Leaf B: **Ordinary Underdetermination (Epistemic)**.  
  - **No** → Go to Q3.

  #### **Q3: Could a manual translating "gavagai" as "rabbit, *except* on days after the shaman visits, when it means undetached rabbit part" be just as evidentially supported as the simple "rabbit" manual?**  
  *(This tests holism: the shaman manual "saves" evidence by adjusting other parts of the manual, e.g., reinterpreting the native's "shaman" or "day" terms.)*
  - **Yes** → Go to Q4.  
  - **No** → Go to Q5.

  #### **Q4: Once all behavioral evidence is in and the manuals tie, is there a fact of the matter about which manual is correct?**
  - **Yes** → Go to Leaf C: **Unnamed (Non-Behavioral Fact Without Manifestation)**.  
  - **No** → Go to Leaf D: **Quinean Indeterminacy (Holism)**.  

  #### **Q5: What rules out the shaman manual / fixes reference?**
  - **Innate linguistic structures** → Go to Leaf E: **Chomskyan Nativism**.  
  - **Rationality/charity constraints** → Go to Leaf F: **Davidsonian Charity**.  
  - **The world itself (e.g., causal relations)** → Go to Leaf G: **Kripke-Wittgenstein Skepticism**.  

  ---

  ### **Positions (Leaves)**  
  Each leaf names a position, summarizes its view of "gavagai," and notes an awkward extra commitment the student must accept.

  - **Leaf A: Behavioral Determinism**  
    *View:* Only one manual is correct; reference is fixed solely by behavior.  
    *Awkward extra:* You must deny Quine’s arguments that behavior underdetermines reference (e.g., the "gavagai" rabbit/part ambiguity).  

  - **Leaf B: Ordinary Underdetermination (Epistemic)**  
    *View:* Manuals underdetermine reference like physics theories—there’s a fact of the matter, but we can’t know it from evidence.  
    *Awkward extra:* You must reject Quine’s claim that translation is *worse* off than physics.  

  - **Leaf C: Unnamed (Non-Behavioral Fact Without Manifestation)**  
    *View:* There’s a fact about reference, but it’s not based on behavior and doesn’t affect evidence (e.g., "hidden" metaphysical facts).  
    *Awkward extra:* You must explain how this fact exists yet leaves *no trace* in behavior or evidence, making it unknowable and arguably incoherent.  
    *Note:* This is unexplored/unattractive—no major philosopher holds it, as it severs reference from evidence.  

  - **Leaf D: Quinean Indeterminacy (Holism)**  
    *View:* No fact of the matter about reference; manuals are empirically equivalent but incompatible (e.g., "rabbit" vs. "rabbit stage").  
    *Awkward extra:* You must accept that *all meaning* is indeterminate, even in your own language.  

  - **Leaf E: Chomskyan Nativism**  
    *View:* Innate linguistic structures fix reference (e.g., the shaman manual is ruled out by universal grammar).  
    *Awkward extra:* You must commit to hardwired, unlearned constraints that even Quine’s evidence can’t reveal.  

  - **Leaf F: Davidsonian Charity**  
    *View:* Rationality/charity constraints fix reference (e.g., the shaman manual makes natives irrational, so it’s invalid).  
    *Awkward extra:* You must interpret others as mostly *correct and rational*, forcing you to attribute bizarre beliefs when they err.  

  - **Leaf G: Kripke-Wittgenstein Skepticism**  
    *View:* Reference is ungrounded—there never was a fact to find (e.g., "gavagai" isn’t "fixed" by the world or our intentions).  
    *Awkward extra:* You must deny that *any* word (even in your language) has determinate meaning.  

  ---

  ### **Key Insights & Ambiguities**  
  - **Logical Space Coverage:** The tree exhausts the major positions. Unnamed Leaf C is incoherent to most philosophers because non-behavioral facts should affect evidence; Leafes D and G are distinct but converge on "no fact of the matter."  
  - **Quine vs. Davidson:** The tree cleanly separates them—Davidsonian charity (Leaf F) rejects the shaman manual (Q3=No), while Quinean holism (Leaf D) accepts it as evidence-equivalent (Q3=Yes) and denies facts (Q4=No).  
  - **Physics Split:** Q2 isolates Quine’s "stronger" indeterminacy (Leafes D, G) from epistemic underdetermination (Leaf B).  
  - **Kripke-Wittgenstein:** Leaf G is reached via the "world itself" path, but it mirrors Quine’s skepticism. It’s included as a distinct "no fact" view, though Kripke focuses on rule-following, not translation.  
  - **Test Case Role:** Q3 forces students to confront holism—if they reject the shaman manual (Q3=No), they must appeal to constraints (Q5); if they accept it (Q3=Yes), they lean toward Quine.  
  - **Student Confusion Points:**  
    - Q1 traps students who miss that behavior underdetermines reference (e.g., "gestures resolve 'gavagai'").  
    - Q2 is where "underdetermination fans" diverge from Quineans.  
    - Q4/Q5 expose tensions in "tie-breaking" (e.g., if reference is fixed by the world, why can’t we detect it?).  
  - **Limitations:** The tree oversimplifies by treating positions as discrete. In practice:  
    - Quine (Leaf D) and Kripke (Leaf G) both yield "no fact" but differ in motivation (translation vs. rule-following).  
    - Davidson (Leaf F) and Chomsky (Leaf E) overlap in imposing constraints but conflict on innateness vs. rationality.  
    - Real-world positions often blend elements (e.g., some Davidsonians accept modest nativism).  

  This tree should help students locate their intuitions within the debate. For deeper discussion, focus on why Leaf C is problematic and how Leafes D and G challenge everyday assumptions about meaning. Good luck with the seminar!
