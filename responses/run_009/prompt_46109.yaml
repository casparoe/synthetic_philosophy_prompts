  You can take the role of a professional philosopher of language who has taught this material for years and has seen every way students confuse themselves about it. Think carefully before committing to the tree shape, and be honest about its limits — for instance, I have a suspicion the tree can't cleanly seperate Quine himself from Davidson, and if that's right I'd rather the handout flag it than paper over it. Audience is undergrads who've read the gavagai sections of Word and Object but basically nothing else; aim for roughly six or seven nodes and something that fits on one page. Also, small thing, if a student's answers land them on a leaf that requires them to also accept something weird about physics or meaning they didn't sign up for, the handout should say what that awkward extra commitment is — one sentence per leaf is fine. Thanks, this is a big help, and sorry for the long email, the professor wants it by friday.
