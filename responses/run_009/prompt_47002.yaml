answer: |-
  1. **Epistemic Laziness Thesis:** Self-deception arises primarily from our inherent cognitive biases and preference for comforting narratives over rigorous truth-seeking, making us prone to uncritically accept flattering or convenient falsehoods without active malice. (Platitudinous; Supports interlocutor by implying the friend is simply avoiding hard truths she *could* confront with effort.)
  2. **Subconscious Knowledge Thesis:** Self-deception paradoxically requires simultaneously holding the true belief (unconsciously) and the false belief (consciously), and we are uniquely adept at partitioning our mind to maintain this contradictory state to avoid psychological pain. (Substantive solution to static paradox; Strongly supports interlocutor by presupposing the friend *does* unconsciously know the truth she hides from herself.)
  3. **Motivated Avoidance Thesis:** "Fooling yourself" is not a single act of believing a falsehood while knowing the truth, but a dynamic *process* of strategically avoiding evidence, rationalizing counter-arguments, and suppressing doubts to maintain a desired belief, a process we initiate and sustain more easily than deception by others. (Substantive; Supports interlocutor by framing it as an active, ongoing choice the friend could theoretically halt.)
  4. **Intra-Psychic Conflict Thesis:** The mind comprises quasi-independent subsystems (e.g., affective vs. cognitive), and "fooling yourself" occurs when one subsystem (driven by desire or fear) successfully manipulates information flow or interpretation to deceive another subsystem responsible for conscious judgment. (Substantive; Supports interlocutor by suggesting the friend's "emotional self" is fooling her "rational self," implying she could integrate them.)
  5. **Sole Responsibility Thesis:** Regardless of external influence, the ultimate barrier to recognizing truth lies within the individual's own cognitive and motivational structures, meaning we are fundamentally the primary (and easiest) agents of our own deception, even when others enable it. (False (overstates individual responsibility/understates context); Strongly supports interlocutor by placing full blame/responsibility on the friend alone, ignoring relational factors.)
