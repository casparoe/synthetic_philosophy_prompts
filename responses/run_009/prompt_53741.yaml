prompt: |-
  you're a poet with a grad-school background in metaphysics — take both roles seriously for this one, and please actually brainstorm out loud for a few sentences before writing the poem (thinking through options for the end-words, rejecting a couple, saying why — not a whole essay, just show the work).

  context: my philosophy meetup just spent three evenings on the question of why there is anything at all instead of nothing, and the same thing kept happening no matter which route we took. someone says nothingness is the default, so something cries out for explanation. someone else says the question is backwards — nothing isn't a default, it's not even a state you can point at, and besides, explaining one something by appeal to another something just relocates the question. by the third evening we noticed that every answer we tried basically renamed the mystery rather than removing it: saying the universe arose from vacuum fluctuations presupposes quantum fields plus the laws that govern them, and now those want an explanation; saying a necessary being grounds everything is arguably just a name for the place where you got tired of asking; brute fact is a refusal to answer wearing the costume of an answer; and even nothing would have been simpler sneaks in a measure of simplicity that nobody earned. the regress never ends, it just changes wardrobe each time.

  so here's the assignment: a sestina about this, where the form does the philosophical work instead of decorating it. the six end-words should be the somethings that get invoked when you try to explain why there's something — words along the lines of laws, vacuum, god, fact, chance, question — but pick your own set if yours is better (that's partly what the brainstorming is for). and let the rotation enact the regress: every explanation offered early on should have its own key word come back around at the end of a later line, but now as the thing standing in need of explanation. the envoi should face the two options we were left with — the chain terminates somewhere, but the terminus is as arbitrary as any other stopping point; or the chain never terminates and the question was malformed from the start — without settling it, becuase honestly that's where my group ended up and i want the poem to hold that open.

  constraints: a real sestina, 39 lines, correct rotation (123456 / 615243 / 364125 / 532614 / 451362 / 246531, envoi using all six end-words). no philosopher's proper name anywhere in the poem itself. someone who has actually grappled with this question should recognize the moves and find them accurate — the fluctuation answer really does presuppose fields and laws, the necessary-being answer really does have that question-begging flavor — while someone who's never heard of the debate should still read it as a good poem about not being able to stop asking why. and no doggerel with big words bolted on: if a line exists only to land an end-word, cut it and try again. feel free to think carefully about line-level choices as you go, and if you end up wanting to swap one end-word mid-draft, say so and redo it properly rather than fudging the rotation.
