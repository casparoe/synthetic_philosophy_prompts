prompt: |-
  My roommates got into it after a dinner where everyone was guessing whether our friend's new restaurant will still be open in two years — Dave said 60% it survives, Maya said 35%, and neither would budge an inch. The next morning Dave came back with something he'd been reading about, an old result in decision theory called Aumann's agreement theorem: if two people are both perfectly rational, start from the same prior, and each knows the other's probability estimate, then they can't disagree. So, he said, one of us is being irrational — or at least our standoff proves we're not the ideal agents the theorem is about, which should worry us. Maya said that's exactly the escape hatch: the theorem's assumptions basically never hold, real people don't share common priors, and calling ordinary disagreement irrational on the strength of a result about ideal Bayesians is like calling walking irrational because teleportation exists. Dave countered that the priors themselves should be common — if we have the same background info, then having different priors just means one of us assigned different probabilities to the same evidence for no reason, so the irrationality gets pushed back a step rather than excused. Maya replied that even granting all of that, the theorem needs the two estimates to be common knowledge, which takes an infinite tower of "I know that you know that I know..." — you can't actually get there by trading percentages over breakfast, so in practice the dissagreement can persist forever without either of us being irrational. Dave's last word was that this is a practical point about the cost of communicating, not about what you're epistemically permitted to believe — a truly rational person should at least move toward the other side's number, and flatly refusing to move is bad faith dressed up as rigor. They dumped the whole thing on me to referee and I honestly couldn't. Can you go through their exchange step by step and say who's right at each move, and who comes out more right overall? Please write it as continuous prose only, no headers or bullet points or bold text, and be upfront about where your own adjudication is most likely to go wrong or what would make you flip your verdict.
reasoning: |-
  Okay, I need to thoroughly analyze this debate between Dave and Maya about Aumann's agreement theorem and their disagreement over the restaurant's survival probability. The user wants me to referee their exchange step by step and determine who's more right overall.

  First, let me recall what Aumann's agreement theorem actually states. It shows that if two rational agents share the same prior beliefs, and their posterior probabilities (like Dave's 60% and Maya's 35%) become common knowledge, then those probabilities must be equal. The theorem relies on Bayesian rationality, common priors, and common knowledge of posteriors.

  Now examining Dave's initial argument: He claims their persistent disagreement proves one is irrational since the theorem says rational agents with common priors shouldn't disagree when posteriors are known. But this overlooks several things. The theorem requires perfect rationality - which humans aren't. More importantly, it assumes common priors, which Maya immediately challenges. Dave is applying an ideal theorem too rigidly to real humans.

  Maya's first counterpoint is strong - she correctly notes the theorem's assumptions rarely hold in reality. Humans don't share identical priors, and aren't perfectly rational Bayesian agents. Her analogy about teleportation versus walking is effective - we shouldn't judge normal human disagreement as irrational just because it doesn't meet ideal standards. This exposes the main weakness in Dave's initial position.

  Dave then argues that if they truly share the same background information, differing priors themselves indicate irrationality. This has some merit in theory - rational agents with identical information should form the same priors. But in practice, people interpret information differently due to cognitive biases, differing experiences, etc. Dave overstates the case by implying different priors necessarily mean irrationality.

  Maya's next point about common knowledge is crucial. She notes that merely stating probabilities ("I think 60%") doesn't create the infinite recursion of "I know you know I know..." that the theorem requires. This is absolutely correct - common knowledge is practically unattainable in real conversations. Their disagreement can persist without irrationality simply because the theorem's conditions aren't fully met.

  Finally, Dave argues that even without full common knowledge, rational agents should update toward each other. This is his strongest point. Bayesian rationality does suggest that learning another agent's different estimate should make you update your own - unless you have reason to discount their judgment. Maya's flat refusal to adjust seems epistemically stubborn.

  Overall, Maya has the stronger position regarding why their disagreement doesn't prove irrationality - because the theorem's strict conditions aren't met in reality. But Dave is right that in a purely Bayesian framework, learning another's estimate should cause some belief updating. The truth is somewhere in between: their disagreement doesn't prove either is irrational, but ideal rationality would involve some convergence.

  I should acknowledge where my judgment might be weakest - I'm assuming Aumann's theorem applies to their case, but there might be nuances in how "background information" is defined that could affect the common prior assumption. Also, the practical impossibility of common knowledge doesn't fully resolve whether they should update at all - that's a philosophical question about how closely humans should approximate ideal rationality.
answer: |-
  Here's a step-by-step adjudication of Dave and Maya's exchange, based on the substance of Aumann's agreement theorem and the principles of Bayesian rationality:

  **Dave's Initial Claim (Aumann's Theorem Shows Irrationality):** Dave is mostly wrong here. Aumann's theorem *does* state that rational agents with a common prior who know each other's posteriors cannot agree to disagree. However, Dave's leap that their standoff *proves* one is irrational is flawed. The theorem establishes an *ideal* condition under which disagreement is impossible. Finding disagreement in the real world doesn't automatically diagnose irrationality; it could simply mean the ideal conditions (common prior, perfect rationality, common knowledge of posteriors) aren't met. Dave over-applies the theorem as a diagnostic tool for real-world disputes. Maya's later point about idealization is foreshadowed here.

  **Maya's First Counter (Unrealistic Assumptions / Escape Hatch):** Maya is largely correct. The core assumptions of Aumann's theorem – perfect rationality (as formal Bayesians), a truly common prior, and common knowledge of posteriors – are extraordinarily stringent and rarely, if ever, hold perfectly for real humans. People have different life experiences, cognitive biases, and ways of processing information, making a genuinely identical prior incredibly unlikely. Her teleportation analogy is apt: judging ordinary human disagreement as "irrational" solely because it violates the theorem's ideal conditions is an unfair standard. Real-world reasoning operates under constraints the theorem ignores.

  **Dave's Counter (Priors Should Be Common / Irrationality Pushed Back):** Dave has a point in theory but overstates it in practice. *If* two agents truly share *all* relevant background information and are perfectly rational, *then* Bayesian consistency demands they form the same prior. Disagreeing priors under these impossible ideal conditions *would* imply irrationality. However, in reality, "sharing the same background info" is ambiguous and almost never absolute. People interpret the *same* facts differently, weigh evidence subjectively, have unique tacit knowledge, and possess different cognitive models – all before formal updating even begins. While differing priors *might* sometimes stem from irrational processing, they more commonly arise from legitimate differences in interpretation, experience, or values *even among reasonable people*. Dave incorrectly assumes perfect shared background information is a given, making his "irrationality pushed back" claim too strong for the human context.

  **Maya's Second Counter (Common Knowledge is Impossible):** Maya is fundamentally correct. Aumann's theorem requires not just that Dave knows Maya's estimate (35%) and Maya knows Dave's (60%), but that Dave knows that Maya knows that Dave knows... ad infinitum. This "infinite tower" of mutual knowledge is practically impossible to establish in real-world interactions, especially a brief breakfast chat exchanging single percentages. Mere announcement does not create common knowledge. Therefore, the core condition of the theorem is almost certainly not satisfied, providing a strong, legitimate reason why their disagreement can persist *without* either being irrational *relative to the information they possess and their (imperfect) models*. The disagreement can be explained by the failure of this communication/knowledge condition, not necessarily by individual irrationality.

  **Dave's Last Word (Should Move Towards Each Other / Bad Faith):** Dave is partially right on the normative principle but wrong on the accusation. A truly rational Bayesian agent, upon learning another agent's different probability estimate – *especially one they respect* – *should* update their own belief to some degree *in the absence of specific reasons to discount the other agent's judgment or process*. Learning Maya's 35% should cause Dave to lower his 60% somewhat (and vice versa), unless he has strong grounds to believe Maya is misinformed, biased, or irrational *in this specific instance*. Flat refusal *to even consider updating* based on the other's view *can* be epistemically stubborn. However, calling it "bad faith dressed up as rigor" is too harsh and likely inaccurate. Maya can rationally believe the differences in their priors or models (e.g., how they weigh factors like location, chef experience, market trends) or the lack of common knowledge are sufficient reasons not to update based solely on the number stated. Her refusal to budge might reflect her assessment of their differing reasoning processes, not bad faith. Dave is right about the *ideal* normative impulse (movement is expected), but wrong to dismiss all resistance as bad faith.

  **Overall Verdict:** **Maya emerges as more correct in the context of this specific disagreement.** Her core arguments hold:
  1.  **The theorem's ideal assumptions (common prior, perfect rationality, common knowledge) are unrealistic for humans.** Their existence proves little about rationality in everyday disputes.
  2.  **The failure of the common knowledge condition alone is sufficient to explain persistent disagreement without irrationality.** This is the most decisive point against Dave's initial claim.

  Dave correctly identifies a *normative ideal*: ideally rational agents *should* update upon learning each other's estimates. However, he consistently over-applies this ideal:
  *   He misuses the theorem as proof of irrationality in a real-world case where its conditions demonstrably don't hold.
  *   He underestimates how easily legitimate differences in prior formation arise from imperfect information sharing and interpretation.
  *   He overstates the bad faith element in Maya's resistance.

  **Where This Adjudication is Most Likely to Go Wrong:**

  1.  **The Normative Force of "Should Update":** The crux is how strongly the *ideal* Bayesian norm ("you should update upon learning another's estimate") binds *real*, imperfectly rational humans who know the other agent is also imperfect. Dave sees this norm as very strong, implying significant movement is rationally required. Maya (and my adjudication) sees the failure of the theorem's conditions as weakening this norm significantly in practice, making steadfastness potentially reasonable. If one believes the Bayesian "should update" norm is extremely robust and applies forcefully even when common priors/knowledge are imperfect, Dave's position gains ground, especially on his last point.
  2.  **Defining "Same Background Information":** The viability of Dave's "irrationality pushed back" argument hinges entirely on whether they genuinely had identical background information. If the dinner conversation *did* constitute truly identical relevant information, and their priors diverged significantly *after* that, Dave has a stronger case that their differing interpretations prior to the specific restaurant question might involve irrational elements. However, proving such perfect informational equivalence is practically impossible.
  3.  **Maya's Reasons for Resistance:** If Maya had *no* articulated reasons for her 35% beyond a gut feeling, and simply refused to consider Dave's reasoning at all, Dave's "bad faith" accusation might carry more weight. However, based on the exchange described, she provided reasoned arguments against applying the theorem strictly, suggesting her resistance was based on principle, not obstinacy.

  **In essence:** Aumann's theorem is a profound result about idealized rationality, not a practical tool for declaring real people irrational during disagreements. Maya effectively demonstrated why their standoff doesn't prove irrationality, primarily due to the unrealistic assumptions and the insurmountable common knowledge hurdle. Dave identified a valuable rational *ideal* (updating in light of others' views), but erred in insisting the theorem proved irrationality here and in dismissing Maya's principled stance as bad faith.
