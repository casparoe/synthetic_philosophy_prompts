  **Question 1: Sweatshop**

  *Case*: In a poor country, a factory pays the local going wage. Without this job, workers would be worse off (e.g., unemployed or in worse jobs). The owner makes a large profit.

  *Options*:
  A) This is exploitation because the owner is getting rich off the workers' labor while they are barely getting by.
  B) This is not exploitation because the workers are better off and the owner is taking a risk and providing jobs.

  *Scoring*:
  - A: Orthodox, Domination, Luck-Egalitarian (if they see the owner's advantage as due to luck of being born rich or in a rich country), Roemer (if they see the asset inequality as the issue)
  - B: Free-Market

  **Question 2: Worker Co-op**

  *Case*: A worker-owned cooperative faces a busy season. The members vote to hire temporary workers at low wages (without offering them membership or profit-sharing) and then distribute the profits among themselves.

  *Options*:
  A) This is exploitation because the temporary workers are being used for their labor without a fair share of the profits.
  B) This is not exploitation because the temporary workers are paid the going rate and agreed to the job. The co-op members are just making a business decision.
  C) This is exploitation, but not because of the wages; it's because the temporary workers have no say in the workplace and are treated as disposable.

  *Scoring*:
  - A: Orthodox (surplus labor extracted), Roemer (if they see the co-op members as having an asset advantage by being members), Luck-Egalitarian (if they see the co-op members as having better luck in being part of the co-op)
  - B: Free-Market
  - C: Domination (focus on lack of control) and also touches on alienation (if we interpret it as a control issue)

  **Question 3: Roemer's Island**

  *Case*: On an island, one person owns all the machinery. Without the machinery, everyone would be fishing and making a subsistence living. The owner hires others to work the machinery, paying them wages that are well above subsistence (so they are better off) and becomes very rich from the profits.

  *Options*:
  A) This is exploitation because the owner is getting rich by owning the machinery while the workers do the actual work.
  B) This is not exploitation because everyone is better off than they would be otherwise and the workers are paid well.
  C) This is exploitation only if the initial ownership of the machinery was unfair (e.g., the owner didn't work for it).

  *Scoring*:
  - A: Orthodox (surplus extraction)
  - B: Free-Market
  - C: Roemer, Luck-Egalitarian (if they see the initial ownership as a matter of luck)

  **Question 4: Monopoly Pharmacy**

  *Case*: A company has a monopoly on a life-saving drug (like insulin) and jacks up the price to many times the production cost, making huge profits. People with diabetes must pay the high price or suffer.

  *Options*:
  A) This is exploitation because the company is taking advantage of people's desperate need to make excessive profits.
  B) This is not exploitation because the company is just charging what the market will bear and they invested in research and development.
  C) This is exploitation, but only if the monopoly was obtained unfairly (e.g., by patent abuse).

  *Scoring*:
  - A: Orthodox (if they see the profit as extracted from the sick), Domination (vulnerability of the sick), Luck-Egalitarian (company benefits from luck of having the monopoly)
  - B: Free-Market
  - C: Roemer (if they see the monopoly as an asset that is unequally distributed) or Luck-Egalitarian (if they focus on the unfairness of how the monopoly was obtained)

  **Question 5: Mutually Beneficial Exchange**

  *Case*: A talented artist is down on their luck and needs money quickly. A gallery owner offers to buy a painting for $100, knowing it will sell for $10,000. The artist is thrilled to get the $100 and would happily do it again. The gallery owner makes a huge profit.

  *Options*:
  A) This is exploitation because the gallery owner is taking advantage of the artist's situation to get the painting for far less than it's worth.
  B) This is not exploitation because both parties benefit and are happy with the trade.
  C) This is exploitation only if the artist had no reasonable alternative.

  *Scoring*:
  - A: Orthodox (surplus value taken), Domination (taking advantage of vulnerability), Luck-Egalitarian (gallery owner benefits from artist's bad luck)
  - B: Free-Market
  - C: Domination (if they focus on the lack of alternatives) or Roemer (if they see the gallery owner's advantage as due to asset inequality, e.g., owning the gallery and having capital)

  **Question 6: Alienation vs. Exchange**

  *Case*: A factory worker is paid well and has good benefits. The job is safe and the boss is kind. However, the work is extremely monotonous and the worker has no say in how the work is done. The worker feels like a cog in a machine and doesn't see the final product.

