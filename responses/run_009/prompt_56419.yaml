  Here's a concise, case-based sorting quiz designed to map onto distinct theories of exploitation without telegraphing the positions. Each question presents a concrete scenario with answer options that reveal underlying principles. The scoring key flags overlaps and impossible combinations.

  ---

  ### **Quiz: Which Theory of Exploitation Do You Actually Hold?**  
  *Answer based on your instinctive reaction to each scenario.*  

  1. **Sweatshop**: A factory in a poor country pays the local wage. Workers are better off than without the job, but the owner earns huge profits.  
     - A) This is wrong.  
     - B) This is fine.  

  2. **Worker Co-op**: A worker-owned business votes to pay members all profits and hire temps at low wages during a busy season.  
     - A) This is wrong because the temps don’t share profits.  
     - B) This is wrong because the temps have no say in decisions.  
     - C) This is fine.  

  3. **Roemer’s Island**: One person owns all machinery. Others work for them at wages above subsistence (better than fishing alone). The owner gets rich.  
     - A) This is wrong.  
     - B) This is fine.  
     - C) This is only wrong if the owner didn’t earn the machinery fairly.  

  4. **Monopoly Insulin**: A pharmacy with no competitors jacks up insulin prices 10x the production cost.  
     - A) This is wrong.  
     - B) This is fine—they’re recouping R&D costs.  
     - C) This is only wrong if the monopoly was rigged (e.g., patent abuse).  

  5. **Desperate Artist**: An artist in need sells a painting for $100 to a dealer who knows it’s worth $10,000. Both are happy and would repeat the deal.  
     - A) This is wrong.  
     - B) This is fine.  
     - C) This is only wrong if the artist had no alternatives.  

  6. **Alienation Test**: At a factory, work is safe and pay is fair, but tasks are mind-numbingly repetitive. Workers have no input and feel like cogs.  
     - A) This is wrong.  
     - B) This is fine—dissatisfaction isn’t exploitation.  
     - C) This is only wrong if workers can’t quit.  

  7. **Inheritance & Inequality**: One person inherits wealth, invests, and becomes a billionaire. Another starts poor, works hard, and earns modestly. Both benefit from the system.  
     - A) This is wrong.  
     - B) This is fine.  
     - C) This is only wrong if the poor person works *for* the billionaire at unfair wages.  

  8. **Entrepreneur’s Reward**: A founder risks everything to build a company, working 80-hour weeks. Employees earn market wages with no profit share. The founder gets rich.  
     - A) This is wrong—workers contributed.  
     - B) This is fine—the founder took the risk.  
     - C) This is only wrong if wages were below contribution.  

  ---

  ### **Scoring Key**  
  Tally your answers and match the pattern to a position. Positions are defined by their *core grievance*:  

  1. **Orthodox Surplus-Labor**: Exploitation is extracting unpaid labor, even with consent/high wages.  
     - *Signature*: A in Q1, Q3, Q4, Q5, Q7; A or C in Q8.  
     - *Answers*: 1A, 3A, 4A, 5A, 7A, 8A/C  

  2. **Roemer-Style (Asset-Based)**: Exploitation stems from unequal ownership of assets/resources.  
     - *Signature*: C in Q3, Q4, Q5; A in Q1, Q7; C in Q8.  
     - *Answers*: 1A, 3C, 4C, 5C, 7A, 8C  

  3. **Domination-Style**: Exploitation is leveraging vulnerability/dependence to control others.  
     - *Signature*: B in Q2; C in Q5, Q6; A in Q1, Q4; C in Q7.  
     - *Answers*: 1A, 2B, 4A, 5C, 6C, 7C  

  4. **Luck-Egalitarian**: Exploitation occurs when the lucky benefit at the expense of the unlucky.  
     - *Signature*: A in Q1, Q5, Q7; C in Q3, Q4; B in Q8.  
     - *Answers*: 1A, 3C, 4C, 5A, 7A, 8B  

  5. **Free-Market Reply**: No exploitation in consensual, mutually beneficial exchanges.  
     - *Signature*: B in *all* questions except *potentially* Q4B/C or Q6B.  
     - *Answers*: 1B, 2C, 3B, 4B/C, 5B, 6B, 7B, 8B  

  6. **Alienation-Focused**: The core wrong is dehumanizing work conditions, not distribution.  
     - *Signature*: A in Q6; B in Q1, Q2, Q3, Q5.  
     - *Answers*: 6A + majority B’s elsewhere  

  ---

  ### **Flags & Notes**  
  - **Roemer vs. Luck-Egalitarian** often share answers (e.g., both say 1A, 3C, 4C, 7A).  
    - *To split them*: Add a case testing brute luck (e.g., "Two equally skilled fishers; one finds a pearl in their net by chance and sells it for millions"). Roemer says "fine" (equal assets); Luck-Egalitarian says "wrong" (unearned luck).  
  - **Impossible Combinations**:  
    - Answering A in Q6 *and* B in Q1/Q2/Q3/Q5 with Orthodox/Roemer patterns. Why? Orthodox/Roemer focus on structural distribution, not experiential harm. This isn’t incoherent—it’s just untheorized (e.g., someone who cares *only* about alienation in otherwise fair exchanges).  
  - **Domination-Style** is the only position that consistently picks B in Q2 (temps’ lack of voice) and C in Q6 (control matters only if quitting is impossible).  
  - **Free-Market Reply** is the only position with all/mostly B’s. If you have B’s *except* in Q4 or Q6, you still align closest here.  

  This quiz isolates intuitions about harm in exchanges, assets, power, or work conditions—without invoking theory-laden terms. The scoring key reveals how positions diverge on *which* cases trigger exploitation and why.
