  We are creating a quiz with 8-10 questions, each a concrete case with 2-3 answer options. The quiz will sort respondents into one of several positions on exploitation. The positions we want to cover are:

  1. **Orthodox Surplus-Labor View (Marx)**: Exploitation is the extraction of surplus labor. Even if the worker is paid well and the boss is nice, the fact that the capitalist appropriates the surplus value created by the worker is exploitative.

  2. **Roemer-Style (Asset-Based)**: Exploitation arises from unequal initial distribution of productive assets. If assets were equal, exploitation would disappear. The focus is on the unfair starting point.

  3. **Domination-Style**: The wrong is in the power imbalance, vulnerability, or dependence that allows one party to dominate the other. It's about the structure of control and the ability to coerce.

  4. **Luck-Egalitarian**: Exploitation occurs when one party benefits from brute luck (e.g., natural talents or inherited wealth) at the expense of others who are less fortunate through no fault of their own.

  5. **Free-Market Reply**: All voluntary exchanges are mutually beneficial and therefore not exploitative. The only exploitation is when force or fraud is involved.

  We also want to flag:
  - Any pair of positions that give identical answers to every question and what extra case would pull them apart.
  - Any answer combination that no position occupies and why.

  Additionally, we want at least one question that probes whether the core wrong is in the exchange (surplus, terms) or in the day-to-day experience of work (alienation).

  We have the following cases to include:

  1. Sweatshop in a poor country.
  2. Worker co-op hiring temps at low wages.
  3. Roemer's island (one owner of machinery, others work for wages above subsistence, owner gets rich).
  4. Monopoly pharmacy jacking up insulin prices.
  5. A case where both parties benefit and would repeat the exchange, but might be exploitative.

  Plus, we need a question about alienation vs. exchange.

