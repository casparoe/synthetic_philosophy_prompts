prompt: |-
  I retired a few years ago after a career in visual neuroscience, and I have since taken up philosophy of mind with a convert's zeal and an experimentalist's habits: when two theories disagree, I want to know what each of them predicts. The dispute between higher-order theories of consciousness — on which a perceptual state is conscious only in virtue of being represented by a suitable higher-order state — and first-order theories, on which phenomenally conscious content is already carried by perception itself, strikes me as partly empirical and partly verbal, and I cannot reliably tell which part is which. Please draft the joint statement that a committed higher-order theorist and a committed first-order theorist could both sign after a good-faith adversarial collaboration. It should contain: the claims both can sign about the shared empirical terrain — blindsight, masked priming, above-chance discrimination without reported awareness, and "no-report" paradigms that attempt to index consciousness without asking subjects anything; the precise residual disagreements, each phrased so that its own side would accept the wording of its own view (I would especially like to see whether the dispute over whether reportability is constitutive of consciousness or merely diagnostic of it can be made exact); the cruxes, such that settling any one of them would move at least one party; and, for each crux, a concrete experimental manipulation both sides would agree bears on it, with each side's prediction recorded in advance, preregistration-style. Where you judge a disagreement to be merely verbal, say so and explain which words are doing the damage. Format it as a numbered agreed-claims section followed by a disagreements table.
reasoning: |-
  We are drafting a joint statement for a higher-order theorist (HOT) and a first-order theorist (FOT). The goal is to find common ground and clarify disagreements, both empirical and conceptual, with a focus on testable predictions.

  Key empirical phenomena to cover:
  1. Blindsight: Patients with damage to primary visual cortex can discriminate visual stimuli without reported awareness.
  2. Masked priming: Subliminal stimuli (not consciously perceived) can influence behavior.
  3. Above-chance discrimination without reported awareness: In normal subjects, under certain conditions, they can perform above chance in a task without reporting awareness of the stimulus.
  4. No-report paradigms: Attempts to measure consciousness without requiring the subject to report (e.g., using neural correlates).

  Theoretical dispute:
  - HOT: A perceptual state is conscious only if it is represented by a higher-order state (e.g., a thought about that state).
  - FOT: Consciousness is a property of first-order perceptual states themselves; higher-order representations are not necessary.

  One key issue: Is reportability constitutive of consciousness (HOT might lean this way) or merely diagnostic (FOT view)?

  Structure:
  I. Agreed Claims (numbered list)
  II. Disagreements (table with: Disagreement, HOT wording, FOT wording, Crux, Experiment, HOT prediction, FOT prediction)

  Where there is merely verbal disagreement, we note it.

  Let's begin:

  I. Agreed Claims:
  Both HOT and FOT agree on the following:

  1. Blindsight: In blindsight, subjects can make visual discriminations (e.g., motion, orientation) without reporting any conscious visual experience. This indicates a dissociation between visual processing and conscious awareness.

  2. Masked Priming: Subliminal stimuli (which are not reported as consciously perceived) can influence behavior and subsequent processing (e.e., priming effects), showing that unconscious processing can affect cognition and action.

  3. Above-chance discrimination without reported awareness: In neurologically intact subjects, under conditions such as attentional blink, continuous flash suppression, or backward masking, subjects can perform above chance in forced-choice tasks while denying awareness of the stimulus. This demonstrates that some information processing occurs without conscious awareness.

  4. No-report paradigms: Neural activity can be measured during tasks that do not require explicit reports (e.g., passive viewing, or using neural markers such as the P3b component, sustained activity, or integrated information). Both agree that these paradigms can provide evidence about the neural correlates of consciousness (NCC) without the confounds of report. However, both also agree that the interpretation of such data is contentious and requires careful controls for attention, task demands, and other factors.

  5. Neural Correlates: Both agree that there are neural correlates of conscious perception, and that these can be studied empirically. For example, in visual perception, activity in posterior cortical areas (e.g., V1) might be necessary but not sufficient for conscious vision, while activity in fronto-parietal networks is often associated with conscious reports.

  6. Dissociation: Both agree that it is possible to have unconscious processing (as evidenced by blindsight, priming, etc.) and that conscious perception typically involves more widespread and sustained neural activity.

  Now, the disagreements:

  We structure the table with:
  - Disagreement: A brief label for the disagreement.
  - HOT wording: How the HOT theorist would state their position.
  - FOT wording: How the FOT theorist would state their position.
  - Crux: The key issue that, if settled, would move at least one party.
  - Experiment: A concrete experimental manipulation both sides agree bears on the crux.
  - HOT prediction: What HOT predicts for the experiment.
  - FOT prediction: What FOT predicts.

  Additionally, we note where disagreements are merely verbal.

  Let's outline the main disagreements:

  Disagreement 1: The necessity of higher-order representations for consciousness.
  - HOT: A perceptual state is conscious if and only if it is the target of a suitable higher-order representation (e.g., a higher-order thought or perception).
  - FOT: A perceptual state is conscious in virtue of its intrinsic properties and the way it is processed (e.g., being available to higher cognitive systems, having a certain format or level of activation), without requiring a higher-order representation.

  Disagreement 2: The role of reportability.
  - HOT: Reportability (the ability to report a state) is constitutive of what it means for a state to be conscious. That is, a state is conscious only if it is reportable (in principle, even if not reported due to external factors).
  - FOT: Reportability is a consequence of consciousness, but not constitutive. Consciousness is a first-order property, and reportability depends on additional cognitive mechanisms (e.g., attention, working memory) that may be absent even when the state is conscious.

  Disagreement 3: The interpretation of no-report paradigms.
  - HOT: In no-report paradigms, when a stimulus is not reported, it is not conscious. Any neural activity observed without report that is similar to that in report conditions is either due to residual higher-order processing or is not indicative of consciousness.
  - FOT: In no-report paradigms, a stimulus can be conscious even without being reported, and thus neural activity in the absence of report can still reflect conscious experience.

  Now, we design experiments that can test these.

  Crux Experiment for Disagreement 1: The necessity of higher-order representations.

  We need an experiment that can manipulate the presence of a higher-order representation independently of the first-order representation.

  One idea: Use transcranial magnetic stimulation (TMS) to disrupt frontal areas (associated with higher-order processing) while preserving sensory areas. Then, measure whether the stimulus is still conscious.

  Experiment: 
  - Subjects view visual stimuli (e.g., gratings) while we record neural activity and ask for subjective reports (e.g., confidence ratings or yes/no awareness).
  - We disrupt either frontal regions (e.g., dorsolateral prefrontal cortex, DLPFC) or control regions (e.g., vertex) using TMS during stimulus presentation.
  - We also measure neural activity in sensory areas.

  HOT prediction: Disruption of DLPFC (a key region for higher-order representations) will lead to a loss of conscious perception (as measured by report) even if sensory areas are intact and processing the stimulus (as evidenced by above-chance discrimination in forced-choice tasks without awareness). This would be like an induced blindsight.

  FOT prediction: Disruption of DLPFC might impair report but not necessarily conscious experience. Therefore, if we use a no-report measure of consciousness (e.g., a neural marker that FOT takes to indicate consciousness, such as sustained activity in sensory areas or a specific pattern of activity) then that marker should still be present even when DLPFC is disrupted and report is impaired. Alternatively, if we use a post-experiment measure (like asking about experience retrospectively without time pressure) subjects might report having had the experience even if they couldn't report it during the TMS disruption.

  However, note that FOT might argue that if the disruption of DLPFC impairs attention, then even on their view consciousness might be impaired because attention is necessary. So we need to control for attention.

  Alternatively, we can use a paradigm that decouples the stimulus from report by having a no-report condition and then using TMS on frontal areas. But then we are back to the no-report issue.

  Another idea: Use a dual-task paradigm that loads higher-order cognitive resources. 

  But let's think of a better one.

  Alternatively, use neuroimaging to look for activation in higher-order areas when a stimulus is reported as conscious vs. not. But that doesn't manipulate.

  We need manipulation.

  Crux Experiment for Disagreement 2: The role of reportability.

  We can design an experiment where we have a stimulus that is processed but not reported due to factors like inattention or lack of task relevance, and then probe for consciousness without requiring a report at the time.

  Experiment: 
  - Use a no-report paradigm with a distractor task. Present stimuli that are task-irrelevant and then, after a delay, ask about the stimulus (retrospective report) or use an implicit measure of conscious content (e.g., a surprise question about the stimulus).
  - Compare the retrospective report with neural activity at the time of stimulus presentation.

  HOT prediction: If the stimulus was not reported (because the subject was engaged in a distractor task) and there was no higher-order representation at the time, then the stimulus was not conscious at the time. Therefore, retrospective reports should be at chance or based on guessing, even if neural activity at the time was similar to that of conscious stimuli.

  FOT prediction: The stimulus might have been conscious at the time, but not reported due to lack of attention to it or because the task did not require it. Therefore, retrospective reports (or surprise tests) might reveal above-chance knowledge about the stimulus, indicating that it was conscious.

  But note: HOT might say that the retrospective report itself requires a higher-order representation at the time of report, so it doesn't prove that the state was conscious at the time. So we need to be careful.

  Alternatively, we can use a neural marker that both sides agree is a correlate of consciousness (if we can find one). But they might not agree.

  Crux Experiment for Disagreement 3: The interpretation of no-report paradigms.

  We can compare neural activity in report and no-report conditions for the same stimulus.

  Experiment:
  - Present identical stimuli in two conditions: one where subjects report on the stimulus (report condition) and one where they are engaged in a different task (no-report condition) and the stimulus is task-irrelevant.
  - Use a neural marker that has been proposed as a correlate of consciousness (e.g., the P3b component, or sustained activity in visual areas, or integrated information).
  - After the no-report condition, test for awareness with a surprise question.

  HOT prediction: In the no-report condition, the stimulus is not conscious (unless it triggers a spontaneous higher-order representation). Therefore, the neural marker should be absent or reduced in the no-report condition compared to the report condition.

  FOT prediction: The stimulus can be conscious in the no-report condition if it is sufficiently strong and attended. Therefore, the neural marker should be present in the no-report condition (at least for some stimuli) and the surprise test should show above-chance awareness.

  But note: We must control for attention. If attention is diverted in the no-report condition, then FOT might agree that consciousness is reduced.

  So we need to ensure that attention is matched.

  Alternatively, we can have a condition with attention to the stimulus but no report.

  Now, we write the statement.

  Note: We must also note where there is verbal disagreement.

  For example, the term "conscious" might be used differently. HOT might define consciousness in terms of access (thus requiring higher-order representation) while FOT might define it in terms of phenomenal character. This is a verbal issue.

  But in the joint statement, we can note:

  Verbal Disagreement: The term "consciousness" might be used differently. HOT typically uses "conscious" to mean a state that is subjectively accessible (i.e., available for reporting and reasoning), while FOT uses "conscious" to refer to phenomenal qualities (qualia) that may exist without being accessible. Therefore, when FOT speaks of "conscious but unreportable" states, HOT would deny that such states are conscious.

  However, both might agree that there are phenomenal qualities that are not accessible (FOT) or that there are first-order states that are not conscious (HOT). So the disagreement is about whether to call those states conscious.

  We note this in the agreed claims? Or in the table?

  We can have a separate note.

  Now, let's write the joint statement.
answer: |-
  ### Joint Statement on the Dispute Between Higher-Order and First-Order Theories of Consciousness

  We, a committed higher-order theorist (HOT) and a committed first-order theorist (FOT), engage in this adversarial collaboration to clarify our disagreements and identify empirical tests for resolving them. We agree on the following empirical observations but disagree on their interpretation. We outline shared claims, precise residual disagreements, experimental cruxes, and predictions. Where disagreements are merely verbal, we note this explicitly.

  ---

  ### I. Agreed Claims on Shared Empirical Terrain
  Both HOT and FOT endorse the following claims, based on replicated empirical findings:

  1. **Blindsight**: Subjects with V1 lesions can exhibit above-chance visual discrimination (e.g., detecting motion or orientation) without reported visual awareness. This demonstrates a dissociation between unconscious visual processing and conscious visual experience. Neural processing in extrastriate areas (e.g., MT/V5) supports discrimination, but this activity is insufficient for consciousness without additional mechanisms.

  2. **Masked Priming**: Subliminal stimuli (e.g., briefly presented and pattern-masked) can prime subsequent behavior (e.g., faster reaction times in lexical decision tasks) without reported awareness. This indicates that unconscious perceptual states can influence cognition and action, but these states lack phenomenal qualities.

  3. **Above-Chance Discrimination Without Reported Awareness**: In neurologically intact subjects, stimuli rendered invisible (e.g., via backward masking, attentional blink, or continuous flash suppression) can still be discriminated above chance in forced-choice tasks, despite subjects denying awareness. This confirms that unconscious processing occurs in typical brains and is not limited to pathology.

  4. **No-Report Paradigms**: Neural correlates of consciousness (NCCs) can be indexed without subjective reports (e.g., via passive viewing while measuring EEG, fMRI, or pupil dilation). Such paradigms control for report-related confounds (e.g., attention shifts or motor preparation) and reveal candidate NCCs like sustained frontoparietal activation or late ERP components (e.g., P3b). However, no-report measures are inferential and require validation against subjective measures to avoid false positives (e.g., conflating attention with consciousness).

  5. **Dissociations Between Processing and Awareness**: Unconscious processing (e.g., in blindsight or masking) typically involves feedforward, transient, or localized neural activity (e.g., early visual cortex), while conscious processing involves recurrent, sustained, or widespread activity (e.g., frontoparietal networks and global workspace). Neither theory claims all cognition is conscious.

  6. **Reportability as a Common Empirical Marker**: Both theories accept reportability (verbal or behavioral) as the default operational index for consciousness in experiments, as it reliably correlates with subjective experience. However, this agreement is methodological, not metaphysical—reportability is not assumed to be identical to consciousness.

  7. **Neural Correlates**: Both theories acknowledge that no single neural marker is universally accepted as sufficient for consciousness. Disagreements arise over whether candidate NCCs (e.g., prefrontal activation) reflect necessary mechanisms (HOT) or downstream consequences (FOT).

  ---

  ### II. Disagreements Table
  We now specify residual disagreements, phrased to be acceptable to each side. For each, we identify the crux, an agreed-upon experimental test, and preregistered predictions. Experiments are designed to minimize verbal disputes by operationalizing key terms (e.g., "consciousness" is indexed via reportability for HOT and via neural/phenomenal criteria for FOT). Verbal disagreements are noted where applicable.

  | Disagreement | HOT Wording (Acceptable to HOT) | FOT Wording (Acceptable to FOT) | Crux | Experimental Manipulation | HOT Prediction | FOT Prediction |
  |--------------|---------------------------------|--------------------------------|------|----------------------------|---------------|---------------|
  | **1. Necessity of Higher-Order Representation** | A perceptual state is conscious if and only if it is represented by a higher-order state (e.g., a thought or perception about the state), which confers subjective awareness. | A perceptual state is conscious in virtue of its first-order properties (e.g., recurrent processing in sensory regions), without requiring representation by a higher-order state. | Whether consciousness can exist in the absence of higher-order representation. | **TMS Disruption of Prefrontal Cortex (PFC)**: In no-report passive viewing, apply online TMS to dorsolateral PFC (dlPFC)—a putative HOT neural substrate—during visual stimulus presentation. Control: TMS to vertex. Stimuli are identical across conditions. Measure: (1) Post-hoc surprise report (to avoid online report confounds); (2) Neural activity in sensory areas (e.g., V1-V4 EEG gamma); (3) Forced-choice discrimination. | TMS to dlPFC abolishes consciousness: Subjects will deny awareness in surprise reports and show no NCCs (e.g., reduced P3b), even if sensory activity and discrimination remain above chance. | TMS to dlPFC impairs reporting but not consciousness: Subjects may show intact NCCs (e.g., sustained visual gamma) and above-chance surprise reports, indicating preserved first-order phenomenality despite disrupted reporting. |
  | **2. Reportability: Constitutive vs. Diagnostic** | Reportability is constitutive of consciousness: A state is conscious only if it is reportable (in principle, barring performance errors). Unreportable states are unconscious by definition. | Reportability is diagnostic of consciousness but not constitutive: Consciousness can exist without reportability, as reporting depends on ancillary systems (e.g., attention, memory). | Whether unreportable states can be conscious. | **Delayed Report with Cognitive Load**: Subjects perform a high-load central task (e.g., rapid letter-stream monitoring) while task-irrelevant peripheral stimuli are presented. After random delays (0-10s), subjects are prompted for surprise reports on peripheral stimuli. Measure: (1) Neural NCC markers (e.g., fMRI global workspace connectivity) during stimulus presentation; (2) Report accuracy at each delay. | Unreported stimuli are unconscious: NCC markers will correlate with reportability, decaying rapidly with delay. No NCCs will be detected for stimuli unreported due to delay/load, even if sensory processing occurs. | Unreported stimuli can be conscious: NCC markers will persist for unreported stimuli at short delays (e.g., <2s), indicating "conscious but unreportable" states due to cognitive load, not lack of phenomenality. |
  | **3. Interpretation of No-Report Paradigms** | No-report neural activity reflects unconscious processing or preconscious precursors; consciousness only arises when higher-order representations would enable report. | No-report neural activity can reflect genuine consciousness if it matches NCC patterns observed in report-based paradigms. | Whether no-report NCCs indicate phenomenality without report. | **No-Report vs. Report NCC Comparison**: In identical stimuli conditions, compare neural activity when: (A) Subjects report visibility; (B) Subjects perform a distracter task (no-report). Use fMRI to measure candidate NCCs (e.g., frontoparietal activation). Stimulus visibility is manipulated (e.g., contrast titrated to threshold). | No-report activity ≠ consciousness: Candidate NCCs (e.g., dlPFC activation) will be absent or reduced in no-report conditions, even for visible stimuli. Activity will correlate only with explicit report. | No-report activity = consciousness: Candidate NCCs will be similar across report and no-report conditions for visible stimuli, reflecting phenomenality independent of reporting. |
  | **4. Blindsight as Unconscious Processing** (Verbal Disagreement) | Blindsight involves unconscious perception: The lack of reportability entails absence of consciousness, with discrimination driven by unconscious first-order states. | Blindsight may involve degraded consciousness: Patients' "unaware" discrimination could stem from weak phenomenality (e.g., non-visual qualia like "gut feelings"), not unconscious processing. | Whether blindsight discrimination is truly unconscious or reflects impoverished consciousness. | **Phenomenal Contrast in Blindsight**: Train blindsight patients to use expanded reporting scales (e.g., "awareness" vs. "performance confidence"). Measure neural activity (fMRI/EEG) during discrimination. Compare to matched controls with TMS-induced "virtual blindsight." | Patients will report zero awareness and show no NCCs (e.g., no P3b), confirming unconscious processing. Any above-chance discrimination reflects unconscious mechanisms. | Patients may report non-visual phenomenal states (e.g., "felt intuition") and show attenuated NCCs (e.g., weak frontal activity), suggesting impoverished consciousness, not unconsciousness. |
  | **Verbal Disagreement Note**: The blindsight dispute hinges on defining "consciousness." HOT equates it with *access consciousness* (reportability), while FOT emphasizes *phenomenal consciousness* (raw feels). Thus, FOT's "impoverished consciousness" is HOT's "unconscious intuition." |

  ---

  ### III. Additional Notes
  - **Cruxes and Falsifiability**: Each crux is designed such that a single outcome could falsify one theory. For example, if TMS to dlPFC abolishes NCCs but leaves sensory activity intact (supporting HOT), FOT must either revise its claims or reject the NCC marker. Conversely, if no-report NCCs persist identically to report conditions (supporting FOT), HOT must concede that consciousness can occur without higher-order representation.
  - **Preregistration Commitment**: Both parties agree to preregister predictions (as above) for these experiments, using open science frameworks. Outcomes will be evaluated against neural and behavioral data, with subjective reports (where used) collected via best practices (e.g., perceptual awareness scales).
  - **Broader Implications**: Resolving these cruxes could unify consciousness research. If HOT prevails, consciousness reduces to metacognitive access; if FOT prevails, it is an emergent property of first-order perception. Either outcome advances the field beyond verbal disputes.

  By signing, we affirm our commitment to empirical resolution and good-faith dialogue.

  Signed,  
  [Higher-Order Theorist]  
  [First-Order Theorist]  
  [Date]
