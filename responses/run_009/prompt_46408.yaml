prompt: |-
  my friend and i spent like three hours last night fighting about the liar paradox and it ended with her saying i "don't actually know what i want from a theory of truth" which, rude, but also possibly correct. so now i want the full spec before i go back and argue more.

  here's roughly where we got stuck. i claimed any adequate theory has to give you basically all the t-sentences -- 's' is true iff s, for every sentence the theory can express -- because that's just what the truth predicate is FOR, and a theory that hands out only some of them is changing the subject. she said that's the one demand that's provably unmeetable (curry's paradox, not even the liar), so insisting on it is like demanding a geometry where every triangle has four sides, and the real question is which weakened version is a genuine loss and which isn't. and then it degenerated into whether a theory that can't call its own false instances false has even said anything.

  so write me the desiderata. what does a theory of truth, as an answer to the liar specifically, actually have to deliver? i want stuff like: which class of t-sentences it has to recover and whether losing the ones for the liar sentence itself is a cost or the whole point; whether it has to be compositional (truth of conjunctions, negations etc. from truth of parts) or whether that's negotiable; what it owes you about ordinary unparadoxical discourse, i.e., can it be a bolt-on that leaves your base theory of arithmetic or whatever exactly as strong as it was (conservativity) or is that demand actually smuggling in an anti-realist bias; and whether "revenge" -- once you introduce a determinately or definitely or ungrounded operator, new liar sentences come back -- refutes a theory or just refutes you for trying to say things IN the theory that belong in the metalanguage.

  and for each one, give the case behind it, and crucially tell me which are non-negotiable and which are just the personal religion of one camp (she claims my t-sentence demand is quine's religion, i claim her conservativity demand is field's). then the part i actually most want: are there subsets of these that can't be had together no matter how clever you are -- like full disquotation plus classical logic plus contraction, or a theory that proves its own soundness, that kind of thing. if some combination is provably off the table, say which theorem does it and what has to give.

  then a quick couple of lines on how kripke-style fixed point theories, revision theory, contextualist approaches and the dialetheist route do against the list -- but seriously keep that part short, the requirements are the part i want to bring back to the argument.

  one more thing we fought about: she says a theory whose "outer" logic (what the theory itself validates) differs from its "inner" logic (what it proves about its own truth predicate) is cheating somehow. i couldn't articulate why that's wrong but i felt it. if you have thoughts on whether that distinction is a desideratum, a defect, or just a fact of life, put that in too.
reasoning: |-
  Okay, let me unpack this user's query. They had a heated debate with a friend about the liar paradox, specifically around what a theory of truth must accomplish. The user wants a clear set of criteria to evaluate such theories, especially regarding T-sentences, compositionality, conservativity, and revenge paradoxes. 

  First, I need to identify the core issues they're grappling with. The friend dismissed the user's insistence on all T-sentences as impossible, comparing it to demanding triangles with four sides. The user feels this misses the point—truth predicates exist for disquotation. Then there's the question of whether weakening this demand undermines the theory's purpose. 

  The user also mentions compositionality, conservativity over base theories, and how to handle revenge paradoxes. They want to know which requirements are non-negotiable versus ideological. Plus, they’re frustrated about the "inner vs. outer logic" accusation and need clarity on whether that’s valid. 

  Breaking it down: The key conflicts are:
  1. **T-sentences**: User sees them as essential; friend calls them provably unattainable (Curry’s paradox). 
  2. **Compositionality**: Is it mandatory for truth to build from parts?
  3. **Conservativity**: Should adding truth leave the base theory (e.g., arithmetic) unchanged?
  4. **Revenge**: Is a theory refuted if new liar-like sentences emerge with added operators?
  5. **Inner/outer logic**: Is it cheating if the theory’s metatheory differs from what it says about its own truth predicate?

  I recall that Tarski’s undefinability theorem already shows a classical theory can’t have all T-sentences without inconsistency. So the user’s friend has a point—full disquotation is impossible in classical settings. But the user’s intuition isn’t wrong either; truth is meant for disquotation. This tension is why paradoxes exist. 

  For compositionality, it’s often desired but some non-classical approaches (e.g., truth-gap theories) sacrifice it for atomic liar sentences. Conservativity avoids inflating the base theory’s commitments, but Field argues it’s anti-realist to demand this—truth might have substantial content. Revenge isn’t necessarily fatal; it might just show where the theory’s boundaries lie. 

  On inner/outer logic: Most theories need this split. Kripke’s fixed points use classical metalogic but don’t validate excluded middle for liar sentences internally. That’s not cheating—it’s a technical necessity. 

  The user also wants known trade-offs. Key ones:
  - Full T-sentences + classical logic + contraction → inconsistency (Curry’s paradox).
  - "Determinately" operators often lead to revenge.
  - Theories proving their own soundness are generally impossible (Gödel).

  For frameworks: 
  - **Kripke**: Recovers consistent T-sentences but loses bivalence and compositionality for gaps. Non-conservative if using strong Kleene logic.
  - **Revision theory**: Circular definitions, avoids gaps, but complex and non-compositional.
  - **Contextualism**: Truth depends on context, dodging some revenge, but may feel evasive.
  - **Dialetheism**: Accepts contradictions, keeps all T-sentences classically, but requires paraconsistent logic—big cost.

  The user’s real need is steelmanning their position for round two. They want to show that while full T-sentences are impossible classically, a theory must explain why we need them and how close it gets. Losing T-sentences for the liar isn’t a flaw—it’s the point. The inner/outer split isn’t cheating; it’s unavoidable. 

  Their frustration suggests they value coherence over compromise. Highlighting the necessary trade-offs (e.g., "You can have disquotation or classical logic, not both fully") might reset the debate. Emphasizing that conservativity is ideological (Field vs. others) could also help—it’s not a universal requirement. 

  Finally, the friend’s "changing the subject" jab might be countered by noting that all theories restrict disquotation somehow—the question is which restrictions align with truth’s role. The user’s demand isn’t Quinean religion; it’s central, even if unattainable. The real test is how gracefully a theory fails.
answer: |-
  Here's the full specification of desiderata for a theory of truth addressing the liar paradox, broken down by core requirements, trade-offs, and evaluations of major approaches. This synthesizes philosophical and technical consensus points, highlighting non-negotiables vs. debatable preferences.

  ---

  ### **Core Desiderata (Non-Negotiable for Adequacy)**
  1. **Consistency & Non-Triviality**  
     - *Why essential*: A theory proving *everything* (including contradictions) is useless. Must avoid explosion.  
     - *Non-negotiable*: Universally required. Triviality isn't a "theory of truth."

  2. **Expressive Adequacy**  
     - *Why essential*: Must handle self-reference (e.g., "This sentence is false") and arithmetic (to formalize syntax).  
     - *Non-negotiable*: Without this, the liar paradox isn't even expressible. Gödel numbering suffices.

  3. **Recovery of "Ordinary" T-Sentences**  
     - *Why essential*: Truth predicates must disquote *unproblematic* sentences (e.g., "Snow is white" is true iff snow is white).  
     - *Non-negotiable*: Failing here *is* changing the subject. A theory denying these isn't about *truth*.  
     - *Clarification*: Your friend is right that **full disquotation for all sentences is impossible** (via Curry: "If this sentence is true, then 0=1"). But losing disquotation *only for pathological sentences* (like the liar) is the goal, not a flaw.

  ---

  ### **Debatable Desiderata (Camp-Specific Preferences)**
  4. **Compositionality**  
     - *Demand*: Truth of "A and B" should depend only on truth of A and truth of B.  
     - *Case for*: Aligns with truth's role in logic; needed for recursive definitions.  
     - *Case against*: Kripke-style theories sacrifice this for liar sentences (e.g., truth-value gaps).  
     - *Status*: **Highly desirable but negotiable**. Non-compositional theories exist (e.g., supervaluationism).

  5. **Conservativity**  
     - *Demand*: Adding truth to base theory (e.g., PA) shouldn't prove new non-semantic facts.  
     - *Case for* (Field-style): Prevents truth from smuggling in metaphysical commitments.  
     - *Case against* (Realists): Truth *is* substantive; conservativity hides anti-realism.  
     - *Status*: **Ideological**. Neither mandatory nor universally rejected.

  6. **Classical Logic Preservation**  
     - *Demand*: Outer logic (metatheory) and inner logic (object theory) should both be classical.  
     - *Case for*: Avoids "cheating" by altering logic (your friend's objection).  
     - *Case against*: Liar forces choices: if classical logic is sacrosanct, you must restrict T-sentences or compositionality.  
     - *Status*: **Contentious**. Classical logicians see non-classical inner logic as defective; others see it as necessary.

  ---

  ### **The Revenge Problem: What It Means**
  - **Demand**: A theory should not generate new inexpressible pathologies (e.g., adding "determinately" shouldn't spawn new liars).  
  - **Reality**: **All theories face revenge** (by Tarski's undefinability). The question is whether it's *contained*.  
  - **Non-negotiable**: A theory must not trivialize when extended with its *own* semantic vocabulary.  
  - **Key insight**: Revenge doesn't refute a theory—it shows its **boundaries**. A theory can be adequate *within its intended scope* (e.g., Kripke handles "is true" but not "is determinately true").

  ---

  ### **Impossible Combinations (Provable Trade-Offs)**
  These theorems show why compromises are unavoidable:
  - **Tarski's Undefinability**: No consistent classical theory can define its *own* truth predicate with full disquotation.  
    → *Sacrifice*: Full disquotation **or** classical logic **or** self-sufficiency.
  - **Curry's Paradox**: With full disquotation + classical logic + "contraction" (if A→(A→B), then A→B), *every sentence is provable*.  
    → *Sacrifice*: Must restrict disquotation **or** adopt non-classical logic (e.g., reject contraction) **or** limit implication.
  - **Löb's Theorem**: No consistent theory can prove its *own* soundness ("all provable sentences are true").  
    → *Sacrifice*: Self-proving soundness is impossible; we settle for relative soundness proofs.

  ---

  ### **How Major Theories Fare**
  | **Theory**         | **T-Sentences**       | **Compositional?** | **Classical Logic?** | **Revenge**          |  
  |---------------------|------------------------|--------------------|----------------------|----------------------|  
  | **Kripke (Fixed Points)** | Consistent ones only (gaps/gluts) | No (for gaps)     | Outer: yes, Inner: no | "Ungrounded" → new liars |  
  | **Revision Theory**       | All, but with revision steps | Yes (circularly)  | Outer: yes, Inner: varies | "Stable" → new liars |  
  | **Contextualism**         | Depends on context     | Sometimes          | Outer: yes, Inner: no | "Context-independent" → revenge |  
  | **Dialetheism**           | All (including liar)   | Yes                | Outer: paraconsistent | "Is just false" → revenge |  

  ---

  ### **Inner vs. Outer Logic: Defect or Necessity?**
  - **The Charge**: Your friend claims differing logics is "cheating."  
  - **Rebuttal**: This is **unavoidable** for consistent theories. Example:  
    - Kripke uses classical metalogic to build a model where excluded middle fails *for liar sentences*.  
    - Why it's legitimate: The object language reflects semantic *discoveries* (e.g., "The liar has no classical truth-value"). The metalanguage describes this without contradiction.  
  - **Verdict**: **Not a defect**—it's a feature of rigorous semantic closure. Rejecting this conflates object-language and metalanguage (the very mistake the liar exploits).

  ---

  ### **Conclusion: What You Must Demand**
  1. **Non-negotiable**: Consistency, expressive adequacy, and disquotation for **non-pathological sentences**.  
  2. **Negotiable but recommended**: Compositionality and conservativity (choose based on philosophical leanings).  
  3. **Inevitable compromises**:  
     - You **cannot** have full disquotation + classical logic + no revenge.  
     - Losing T-sentences *for the liar itself* isn't a cost—it's **solving the problem**.  
  4. **Inner/outer logic split**: Accept it as necessary; rejecting it ignores technical constraints.  

  **Strategic takeaway for your argument**:  
  Your insistence on T-sentences is correct *for non-liar sentences*—that's the minimal requirement for truth. Your friend's conservativity demand is optional (Field vs. Tarski). The real issue is **which consistent fragment of disquotation a theory delivers**, and whether its compromises align with truth's role. Cite Tarski/Curry to show full disquotation is impossible classically, but stress that pathological sentences are the *exceptions*, not the norm.
