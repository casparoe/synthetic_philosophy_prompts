  **Defending the Core:** With #4 gone, your remaining positions (#1, #2, #3, #5) form a coherent, defensible anthropic viewpoint: Be a thirder on Sleeping Beauty using careful conditioning, reject dubious population-based arguments (Presumptuous Philosopher *and* Fine-Tuning for Multiverse), reject Doomsday due to its specific flaws, and insist on standard Bayesian methods with careful handling of indexicals. That's a robust profile. Good luck with the attack dogs – aim for their ankles.
