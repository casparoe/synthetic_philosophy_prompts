  Point 4 is downstream effects. How does the assumption affect predictions in areas like game theory? This might require case studies, but without a solid model (point 1), it's hard to assess. This could be important for validating approaches, but it's dependent on earlier steps.

  The user also mentioned developments like large language models (LLMs). LLMs reason imperfectly at scale, offering real-world examples of resource-bounded reasoning. If LLMs show patterns that align with certain models (like resource bounds), that could push point 1 higher. Conversely, if LLMs solve problems in ways that challenge system-relativity, point 2 might need rethinking.

  Tractability is another factor. Point 1 might be more approachable with existing logics, while point 2 is deeply theoretical. Point 4 might require interdisciplinary work, which could be slower. 

  So prioritizing: Start with point 1 because it's foundational. Then point 2 to ensure the systems are valid. Point 4 can build on that, and point 3 might be ongoing but less urgent. Deprioritizing point 3 initially since it's more about justification than building models. But keeping an eye on LLMs to inform point 1 and maybe point 4.

