prompt: |-
  I'm a third-year student taking an upper-level ethics seminar on agent-relative constraints, where we've spent half the term on the paradox of deontology, and I also coordinate weekend deliveries for a student-run mutual-aid pantry. Every couple of weekends I face a version of the same decision: whether we may break a specific commitment we've made to one household — a box we reserved and promised, a delivery time we guaranteed, information we said we'd keep confidential — in order to prevent what looks like a clearly larger total harm to several other households. These decisions usually have to be made on the spot, in about ten minutes, with two first-year volunteers watching me make the call, and there's no supervisor to escalate to. Please take the role of a professional moral philosopher who is experienced at turning theory into usable procedure, and think carefully before answering: begin with a short brainstorm about which distinctions from the constraint literature actually matter for decisions like mine and which can be dropped without losing the point. Then write me a decision procedure I can run in ten minutes: the questions to ask, in order; what counts as a sufficient answer to each; where the procedure outputs a firm no; and where it explicitly hands the decision back to me because the question is one of judgment rather than something the theory settles. The procedure should take a defensible position on whether our constraint against breaking commitments is absolute, threshold-governed, or grounded in systemic effects like volunteers and clients losing trust in our rules, and it should explain how it handles the difference between harms we intend and harms we merely foresee. Finally, run it on three cases: (1) we promised a household the last box of baby formula, and a household with twice as many infants arrives an hour later; (2) our van can make only one more run tonight, so keeping the promised delivery time to one family means three other families go without food until Monday — I want the procedure to be honest if it tells me to keep the promise anyway, since that will be an answer I don't like; and (3) a client shared something with us in confidence that a city agency would need to know in order to house them sooner. Close by stating plainly what the procedure cannot settle.
reasoning: |-
  Okay, I need to really understand this user's situation. They're a third-year ethics student dealing with real-world dilemmas in their mutual-aid pantry work. The user faces urgent decisions about breaking commitments to prevent greater harms, all while being observed by new volunteers. This is deeply personal – they're juggling academic theory with the pressure of immediate, impactful choices.

  The core tension here is between agent-relative constraints (keeping promises) and consequentialist concerns (preventing harm). The user needs a practical tool, not just theory. They specifically mentioned the paradox of deontology – that moment when rigid rules seem to contradict their own purpose of reducing suffering.

  Hmm, their three cases are perfectly chosen to test different aspects: Case 1 is pure resource allocation, Case 2 adds time pressure and scale, Case 3 involves confidentiality and institutional intervention. What's unspoken but palpable is their anxiety about being watched by first-years – they're not just deciding, they're modeling ethical decision-making.

  I should start by filtering academic distinctions for practicality. Absolute constraints? Unworkable here. Double effect? Useful but needs simplification. Systemic trust effects? Crucial for their volunteer-dependent operation. The procedure must output clear "no" signals when promises must be kept, even if it feels wrong – that's intellectual honesty they requested.

  For the decision tree: First establish if the commitment is intact (no loopholes), then assess harm prevented versus harm caused. Key innovation: separating the "intended/foreseen" test into two questions – what's directly caused versus what's risked. The trust assessment is vital; their pantry's survival depends on credibility. 

  In Case 1, the procedure would likely reject reallocating the formula – it's intended deprivation to the first household. Case 2 is tougher: missing three deliveries might be foreseen rather than intended, but the trust erosion from broken time guarantees could be catastrophic long-term. Case 3's confidentiality breach? Probably forbidden – it's not just harm, it's betrayal of the client relationship itself.

  Important to admit limitations: the procedure can't quantify "significantly worse" harm or resolve all value conflicts. Sometimes ethics is about sitting with uncertainty while acting decisively. That's the unspoken lesson for those watching first-years.
answer: |-
  Here’s a practical decision procedure grounded in ethical theory, designed for your 10-minute window. It prioritizes distinctions that matter in real-time dilemmas while filtering out academic nuances that don’t translate to action.

  **Key Distinctions That Matter (and What to Drop):**  
  | **Relevant**                        | **Dropped**                          | **Why**                                                                 |
  |-------------------------------------|--------------------------------------|--------------------------------------------------------------------------|
  | Intended vs. Foreseen Harm          | Agent-Neutral vs. Agent-Relative Value | Practical intent assessment is feasible; value distinctions aren’t actionable |
  | Thresholds for Constraints          | Absolute Constraints                 | Absolutes crumble under real-world complexity; thresholds are defensible |
  | Systemic Trust Effects              | Metaphysical Agency Debates          | Trust impacts future aid; agency debates offer no operational guidance  |
  | Proportionality of Harm             | Fine-Grained Intentionality (e.g., triple effect) | Proportionality is judgeable; over-nuanced intent isn’t tractable |

  ---

  ### **10-Minute Decision Procedure: The Commitment Threshold Framework**  
  *(Position: Constraints are threshold-governed, with systemic trust as a core component. Harm intended vs. foreseen is decisive below the threshold.)*

  **Ask these questions in order:**  
  1. **"Is the commitment still fully binding?"**  
     *Check for nullifiers: Did the recipient waive the promise? Was the promise based on false information?*  
     → If **yes** (binding), proceed. If **no**, you may break it without ethical cost.  

  2. **"Is breaking the commitment necessary to prevent *significantly* worse harm?"**  
     *Define "significantly":*  
     - Harm prevented must be **at least 3x worse** (e.g., severe hunger vs. missed snacks) AND affect **more people** (e.g., 3 households vs. 1).  
     - *Not sufficient:* Marginal benefits, comparable harm, or harms caused by others’ choices.  
     → If **no**, **STOP: Do not break commitment.** If **yes**, proceed.  

  3. **"Does breaking the commitment *directly cause harm* to the original promise-recipient?"**  
     *(Intent vs. Foreseen Test)*  
     - **Intended harm:** Depriving them of a promised good/service (e.g., taking back formula).  
     - **Foreseen harm:** Secondary effects (e.g., inconvenience from rescheduling).  
     → If **intended harm**, **STOP: Do not break commitment.**  
     → If **only foreseen harm**, proceed.  

  4. **"Would breaking this commitment *systematically erode trust* in critical rules?"**  
     *Consider:*  
     - Is this promise type **foundational** (e.g., confidentiality, essential goods)?  
     - Would volunteers/clients see this as "rules don’t matter"?  
     → If **yes**, **STOP: Do not break commitment.**  
     → If **no**, proceed to judgment call.  

  5. **"Can I mitigate harm to the original recipient *immediately*?"**  
     *(e.g., Replace formula within 2 hours; deliver late tonight with apology gift)*  
     → If **no mitigation possible**, **OUTPUT: Judgment Call**.  
     → If **mitigation possible**, you may break commitment.  

  **Output Summary:**  
  - **Firm NO:** Questions 1, 3, or 4 trigger a stop.  
  - **Judgment Call:** Proceed through all checks but mitigation fails (Q5).  
  - **Permitted:** Passes all checks with mitigation possible.  

  ---

  ### **Case Applications**  
  **Case 1: Baby Formula Reallocation**  
  - Q1: Binding promise? **Yes.**  
  - Q2: Prevent worse harm? 2x infants ≠ **significantly worse** (same harm type). **→ STOP: Keep promise.**  
  - *Why:* Fails proportionality. Intended harm to first household.  

  **Case 2: Delivery Time vs. Three Families**  
  - Q1: Binding? **Yes** (time guaranteed).  
  - Q2: Prevent worse harm? 3 families hungry > 1 family waiting. **Proceed.**  
  - Q3: Harm type? Breaking time promise = **foreseen harm** (inconvenience, not deprivation). **Proceed.**  
  - Q4: Systemic trust? Breaking time slots routinely erodes reliability. **→ STOP: Keep promise.**  
  - *Why:* Trust threshold outweighs one-time harm prevention.  

  **Case 3: Confidentiality Breach for Housing**  
  - Q1: Binding? **Yes** (explicit promise).  
  - Q2: Prevent worse harm? Homelessness > privacy breach? Debatable, but assume **yes.**  
  - Q3: Harm type? Sharing confidential info = **intended harm** (violation is direct). **→ STOP: Keep confidence.**  
  - Q4: Systemic trust? Breaching confidentiality destroys pantry’s safety. **Reinforces STOP.**  
  - *Why:* Intentional harm + catastrophic trust erosion.  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Defining "Significantly Worse Harm"**: When harms are incommensurable (e.g., dignity vs. nutrition).  
  2. **Uncertain Outcomes**: If harm prevention is probable but not guaranteed.  
  3. **Moral Exhaustion**: When repeated threshold breaches demand rule adjustments.  

  **Final Note:** This procedure errs toward keeping commitments because trust is the currency of mutual aid. When it says "no," it’s not dismissing consequences—it’s protecting the system enabling your work. In judgment calls (Q5), choose the action that lets you face the original promise-recipient without shame.
