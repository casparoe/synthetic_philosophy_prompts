prompt: |-
  I teach political philosophy, and every autumn my grad seminar on democratic erosion goes the same way: week two, someone declares Hungary the paradigm case of backsliding, someone else says that's just a partisan label for "elections the wrong side won", and then we spend the whole term relitigating individual countries instead of working out what the concept is even for. So this year I want to do it in reverse. Before we touch a single country, I want the spec.

  Write me the list of desiderata that any adequate account of democratic backsliding has to meet. For each one, give the case or consideration that motivates it, so it's not just a bullet floating free. Off the top of my head the list has to handle at least these things, but add or argue with them as you see fit:

  - It has to seperate backsliding from ordinary policy alternation — a new government slashing welfare or appointing sympathetic regulators isn't automatically eroding democracy, or the concept just collapses into "governance I dislike".
  - It has to capture change through ostensibly legal means — court packing, capture of media regulators, prosecutorial pressure on owners — without the net being so wide that every government's ordinary conduct counts. This is where most definitions either miss Orbán-style gradualism or criminalise politics as such.
  - It has to be gradualist-friendly: with a slow trajectory there may be no single day you can point to, so "when did it happen" can't be part of the criterion. Call this the boiling frog requirement if you like.
  - Here's the one I actually care about, and it's the reason I'm asking for a spec rather than a definition: the criteria have to pass what I'll call an adversarial test — they have to be such that, in principle, they could classify a case you or I are sympathetic to as backsliding, and classify a case we dislike as NOT backsliding. If the criteria only ever fire in one political direction, they're not an analysis of a concept, they're a cudgel with footnotes. I don't know how to make that requirement precise, which is partly why I'm farming this out.

  Then, briefly, I want two more things. First: flag any pair of desiderata you suspect can't be jointly satisfied — I have a feeling decidability and the legal-means requirement are in tension, since the more you lean on "trajectory" and "pattern of behaviour" to catch gradual capture, the more the judgement looks like an inference about intent, which observers who disagree about the government will disagree about too. If some subset is jointly unsatisfiable, say so plainly; that would be the most useful result of the whole exercise. Second, a very short scorecard — two or three sentences each, no more — of how the standard framings do against your list: Nancy Bermeo's old typology of coups and executive aggrandisement, the informal-norms approach people associate with Levitsky and Ziblatt, and a bald "index of institutional change" approach that just counts rule changes. The point of the scorecard is to test your criteria, not to adjudicate those authors, so keep it light.

  One more thing: don't structure this around current US politics. It can use the US as one case among several, but if the whole list turns out to be reverse-engineered from one country, I'll notice, and so will my students.

  Please write the answer in American English. Length doesn't matter to me; getting the requirements right, with their motivating cases, does. Its the criteria that do the work — the scorecard is just a sanity check at the end.
reasoning: |-
  Okay, I need to help this political philosophy professor create a set of desiderata for defining democratic backsliding. The goal is to avoid getting bogged down in country-specific debates by establishing clear criteria upfront. 

  The professor mentioned several key requirements: distinguishing backsliding from policy changes, capturing legalistic erosion, accommodating gradualism, and passing an adversarial test. I should consider each carefully. For the policy distinction, Hungary shows how welfare cuts shouldn't count but media regulator capture should. The gradualism point is crucial - Orbán's Hungary demonstrates how erosion happens slowly without clear breaking points. 

  The adversarial test is particularly interesting. The professor wants criteria that could theoretically label a favored government as backsliding or absolve a disliked one. If criteria only ever apply to opponents, they're just political weapons. This reminds me of how some definitions might fail if applied to FDR's court-packing or Macron's executive actions. 

  I wonder about potential conflicts. The gradualism requirement might clash with the need for clear indicators - how do we objectively measure "trajectory" without inferring intent? This could be a fundamental tension. 

  For the scorecard, I'll briefly assess three approaches: Bermeo's typology might handle legal means well but struggle with gradualism; Levitsky/Ziblatt's norms approach captures culture but lacks objectivity; institutional indices offer precision but miss informal erosion. 

  The challenge is making the criteria robust enough to withstand political disagreement while remaining applicable across diverse cases from India to Poland to the US. I should ensure each desideratum is grounded in concrete examples without centering any single country.
answer: |-
  Here is a set of desiderata for defining democratic backsliding, grounded in motivating cases and designed to meet your requirements. The goal is a conceptual "spec" that forces analysis *before* country application.

  **Desiderata for an Adequate Account of Democratic Backsliding:**

  1.  **Distinguish Policy Change from Regime Change:**
      *   **Requirement:** Must not classify routine policy shifts, ideological governance, or unpopular decisions (even major ones) as backsliding, simply because they disadvantage certain groups or violate norms of fairness in outcomes.
      *   **Motivating Case:** A center-right government implementing significant welfare cuts or deregulation (e.g., UK Thatcherism) vs. a government systematically altering electoral rules to permanently disadvantage opposition voters (e.g., gerrymandering combined with voter ID laws targeting specific demographics). The former is contested policy; the latter targets the competitive foundation.
      *   **Why it Matters:** Prevents concept collapse into "policies I dislike," preserving analytical integrity.

  2.  **Capture Erosion via Legalistic Means (Stealth Authoritarianism):**
      *   **Requirement:** Must identify when formal legal/administrative processes are used *strategically* to undermine democratic accountability, competition, or rights-protection, without necessarily suspending the constitution or staging a coup.
      *   **Motivating Case:** Hungary (Fidesz supermajority): Packing constitutional courts, rewriting electoral laws for permanent advantage, placing loyalists in media regulatory bodies to pressure or silence critical outlets, using state resources and audits to pressure opposition figures and critical civil society (NGO laws). Similar patterns in Poland (judiciary capture) or Turkey (using legal mechanisms against opposition).
      *   **Why it Matters:** Most contemporary backsliding avoids overt illegality; definitions relying solely on coups or constitutional suspension miss the dominant modern pattern.

  3.  **Accommodate Gradualism (The Boiling Frog):**
      *   **Requirement:** Must identify a *negative trajectory* or cumulative *pattern* of actions, not requiring a single, dramatic breaking point. Should be applicable even if the endpoint (full authoritarianism) isn't yet reached.
      *   **Motivating Case:** Orbán's Hungary (again) – a decade-plus process with no single "day democracy died." India under Modi – incremental steps targeting media independence, civil society, minority rights, and federal balance over multiple terms. The challenge is recognizing the pattern before it's complete.
      *   **Why it Matters:** Rigid definitions demanding sudden rupture are blind to the most common contemporary threat.

  4.  **Pass the Adversarial Test (Symmetry Principle):**
      *   **Requirement:** The criteria must be *conceptually capable* of classifying a case observers sympathetic to the government might support as backsliding, and a case observers critical of the government might oppose as *not* backsliding, based on the application of the criteria alone. The test is about *possibility*, not likelihood in polarized contexts.
      *   **Motivating Cases:**
          *   *Sympathetic Government Backsliding:* Imagine a popular left-wing government, beloved by progressive scholars, using its mandate to pack courts, rewrite electoral laws to disadvantage conservative parties, and use regulatory powers to pressure right-leaning media under the guise of "fairness" or "combating hate speech." The criteria should flag this *if* it meets the other requirements.
          *   *Unpopular Government Not Backsliding:* A deeply disliked right-wing government enacts harsh, controversial policies (austerity, restrictive immigration laws) through normal legislative processes, facing robust opposition, critical media, and potential judicial review – without systematically altering the rules of the democratic game itself to entrench power or disable opponents. The criteria should *not* classify this as backsliding.
      *   **Why it Matters:** Ensures the concept is analytical, not merely a partisan weapon. If criteria *only* ever apply to one "side," they are invalid as a tool of political science.

  5.  **Focus on Democratic Functionality (Outputs & Processes):**
      *   **Requirement:** Must center on the *functional integrity* of core democratic institutions and processes: meaningful electoral competition, institutional checks and balances (horizontal accountability), protection of political and civil rights essential for contestation (vertical accountability), and equality before the law/political process.
      *   **Motivating Case:** Venezuela under Chávez/Maduro: Initial erosion involved legalistic means (court-packing, changing electoral rules) that progressively undermined the opposition's *ability* to compete and hold power accountable, even before overt authoritarianism. Contrast with robust policy fights within strong institutions (e.g., heated debates over austerity in a system with free media and independent courts).
      *   **Why it Matters:** Grounds the definition in what democracy *does* (contestation, accountability) rather than specific policy outcomes or fleeting norms.

  6.  **Require Intent or Foreseeable Consequence (Avoiding Naive Functionalism):**
      *   **Requirement:** Must include either demonstrable *intent* by key actors to entrench power or disable opposition, OR actions whose *foreseeable and primary consequence* is such entrenchment/disablement, irrespective of stated intent.
      *   **Motivating Case:** Court-packing: Expanding a court during a crisis for ideological balance *might* be contested policy (FDR). Expanding it solely to create a permanent, loyalist majority that nullifies opposition and shields the executive *is* backsliding (Poland, Turkey). Similarly, laws ostensibly about "security" or "transparency" that are demonstrably applied only to opposition figures or critical NGOs.
      *   **Why it Matters:** Prevents classifying every institutional reform or power shift as backsliding. Links actions to their *impact* on democratic functionality (#5).

  **Potential Conflicts:**

  *   **Gradualism (#3) vs. Decidability/Avoiding Intent Inference (#6):** This is the core tension you identified. Defining a "negative trajectory" often *requires* interpreting a *pattern* of actions, making inferences about cumulative effects and likely intent/foreseeable consequences. Observers with differing priors about the government's legitimacy *will* interpret the same pattern differently (e.g., "necessary reforms" vs. "systematic erosion"). **Resolution is imperfect:** Leaning heavily on *foreseeable consequences* and *impact on core functionality* (#5) provides more objective anchors than *pure intent*, but ambiguity remains inherent in assessing patterns and motives. The Adversarial Test (#4) is crucial here – forcing the *application* of these anchors to cases across the political spectrum.

  **Brief Scorecard of Standard Framings:**

  1.  **Bermeo (Coups/Executive Aggrandizement):**
      *   **Strengths:** Clear on #1 (distinguishes regime change), strong on capturing some legal means (#2 - aggrandizement).
      *   **Weaknesses:** Less attuned to pure gradualism (#3 - focuses on identifiable "events"), may not fully satisfy #4 (Adversarial Test - tends to focus on obvious cases). Struggles with complex patterns outside direct executive power grabs.

  2.  **Levitsky & Ziblatt (Informal Norms - Forbearance, Mutual Tolerance):**
      *   **Strengths:** Captures important cultural preconditions, can explain vulnerability (#3 - norm erosion can be gradual).
      *   **Weaknesses:** Struggles sharply with #1 (blurs norm violations with policy disputes), weak on #2 (legalistic erosion often *upholds* formal rules while shredding norms), fails #4 spectacularly (highly susceptible to partisan "whataboutism" – "your side broke norms first!").

  3.  **"Bald" Index of Institutional Change:**
      *   **Strengths:** Strong on #2 (captures legal changes), good for #3 (can track incremental changes), potentially better on #4 (if indices are consistently applied).
      *   **Weaknesses:** Often fails #1 (counts *any* institutional change, missing context/purpose - e.g., counting post-conflict reforms as "backsliding"?). Struggles with #5 & #6 (may miss functional degradation if formal rules remain unchanged, e.g., media intimidation; doesn't capture intent/consequence well). Can be gamed or miss informal practices.

  This spec forces analysis onto the *how* and *impact* of actions on the democratic system's core functions, using the Adversarial Test as a crucial filter for bias and the tension between gradualism and clear intent as a central analytical challenge. It should provide a robust framework *before* diving into Orbán, Modi, Trump, or any other contested case.
