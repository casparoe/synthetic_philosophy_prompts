  Appiah’s honor thesis works better for dueling than slavery. Dueling’s collapse was *intra*-elite status signaling—easily reshaped by peer perception. Slavery’s abolition involved massive economic interests, transnational activism, and warfare; honor dynamics (e.g., framing abolition as national redemption) were catalytic but entangled with material pressures. Appiah risks overgeneralizing by treating both as pure "honor shifts," ignoring how slavery’s stakes demanded coercive power (e.g., naval enforcement, Civil War) beyond social scorn. Your friend’s economics lens rightly spots this disparity, but for dueling specifically, honor’s role was decisive due to its function as elite social currency.
