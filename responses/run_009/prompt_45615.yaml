answer: |-
  Here is the comprehensive list of desiderata for a theory of retention through scientific theory change, motivated by the **No-Miracles Argument (NMA)**, with explicit case-handling, assessment of the "structure" requirement, and annotations on negotiability and potential conflicts. British English throughout.

  **Core Purpose:** Explain the *predictive success* of mature scientific theories without invoking miracles *and* without endorsing blanket scepticism about the unobservable entities/structures posited by those theories. The explanation hinges on *continuity* across theory change.

  **Desiderata & Motivations:**

  1.  **Retention of Predictive Success (Non-Negotiable):**
      *   **Motivation:** The core datum of the NMA. Mature, predictively successful theories (like Fresnel's optics) generate empirically correct predictions. Their successors (like Maxwell's EM) must preserve this predictive accuracy for the same domain/experiments, otherwise the success appears miraculous. *Exemplar Case:* Fresnel's equations for light intensity at interfaces are literally preserved within Maxwell's equations (as solutions), explaining their continued predictive success without miracles.
      *   **Handling Divergence:** If the purpose were *only* the Pessimistic Meta-Induction (PMI - past theories are false, so ours likely is too), this requirement would be primary *instead* of predictive success retention. The NMA focus makes predictive retention *central*; the PMI focus makes *some form* of referential/structural retention *necessary to block the induction*.

  2.  **Continuity of Structure (Non-Negotiable - but content contested):**
      *   **Motivation:** To satisfy (1) without miracles, *something* must be preserved that accounts for the success. Structural Realism (SR) posits that this "something" is the *structure* of the theory – the relations between entities, captured mathematically. Miracles are avoided because the successor theory preserves/recovers the essential structural content responsible for the predictions. *Exemplar Case:* Fresnel's equations (structure) are retained in Maxwell.
      *   **Handling Divergence:** Epistemic SR (ESR) sees this as *knowledge of structure* being preserved, while Ontic SR (OSR) sees *structure itself* as the fundamental ontological category.

  3.  **Applicability to Mature/Core Theories (Non-Negotiable):**
      *   **Motivation:** The NMA applies specifically to theories that have demonstrated significant, novel predictive success after rigorous testing. Not all theories are equally worthy candidates for retention (e.g., nascent or ad-hoc theories). The theory must distinguish mature, successful cores. *Exemplar Case:* Fresnel's optics was mature and highly successful in its domain before Maxwell.

  4.  **Handling Limiting Cases/Approximations (Conditionally Non-Negotiable):**
      *   **Motivation:** Many key transitions involve successor theories recovering the predecessor's predictions only as limiting cases or approximations (e.g., v << c). SR must account for this type of retention as structurally significant, not merely accidental or "not real" retention. *Exemplar Case:* Newtonian mechanics (NM) is recovered from Special Relativity (SR) as v/c → 0 and from General Relativity (GR) in weak gravitational fields/flat spacetime.
      *   **Outsourcing?** SR theories can *rely* on established intertheoretic relations (like limiting relations) to *define* the structural continuity. However, the SR theory must *characterise what aspect* (the structure) is being preserved *in* that limiting relation. Simply pointing to the limit existing isn't enough; the SR theory must say *why* the limiting behaviour constitutes structural retention (e.g., the mathematical group contraction from Lorentz to Galilean symmetry group demonstrates structural continuity). Outsourcing the *how* of the limit is allowed; outsourcing the *interpretation* of that limit *as structural retention* is the core job of SR. **→ Requirement:** The theory must provide an account of how limiting case recovery *constitutes* structural continuity.

  5.  **Accounting for Discarded Theories (Non-Negotiable - but scope contested):**
      *   **Motivation:** The NMA claims success *demands* continuity. Therefore, predictively successful theories where *no* significant structure seems retained pose a challenge. SR must either explain what *was* retained (even minimally) or justify why the theory wasn't truly "mature" or its success wasn't genuinely structural. *Exemplar Case:* Ptolemaic astronomy. It was predictively successful for centuries, yet its core structure (geocentrism, complex epicycles/deferents) seems entirely discarded.
      *   **Handling:** The SR theory *must* say something. Options: a) Identify *some* retained structural element (e.g., kinematical relationships, periodicities - though contentious), b) Argue its predictive success was not due to its core *theoretical* structure but to empirical fitting/ad-hoc parameters (demoting its "maturity" for SR purposes), or c) Argue its domain of success is *not* the domain where its successor (Copernican/Keplerian/Newtonian) demonstrates continuity (e.g., it worked for planets but failed for broader cosmic structure). **Permitted Shrug?** No. A theory of retention *must* handle apparent counterexamples to retention. It cannot shrug at predictive success that seemingly lacks continuity.

  6.  **Non-Question-Begging Characterisation of "Structure" (Highly Desirable, arguably Non-Negotiable - but extremely challenging):**
      *   **Motivation:** To avoid collapsing into triviality or selective realism. If "structure" is defined *only* as "whatever the successful successor theory says was retained," then SR reduces to: "Successful theories retain what later successful theories say they retained." This is vacuous and indistinguishable from selective realism informed by future success. The Newman Objection formalises this: without constraints, any claim of structural continuity becomes nearly tautological. *The Separate Problem:* Even beyond Newman, SR needs a *principled, non-arbitrary* way to identify "structure" *within* a theory *independently* of knowing which bits will be retained in the future. Otherwise, it lacks explanatory power for *why* that structure was retained/successful.
      *   **Is it a Requirement?** Yes, for SR to be a substantive, non-trivial position distinct from selective realism or instrumentalism. A theory failing this is vulnerable to collapse.
      *   **Is it Satisfiable?** **Highly contentious and the major challenge.** Proposals include: mathematical structure (equations, symmetries, group-theoretic properties), Ramsey-sentence structure, model-theoretic structure, causal structure. All face difficulties. OSR often grounds structure in fundamental physics. ESR struggles more. No consensus exists on a fully satisfactory, non-problematic characterisation. **Verdict:** It is a *real, necessary requirement* for a robust SR, but satisfying it completely and uncontroversially remains an *open and possibly insurmountable problem*. Many SR proponents work within this tension.

  7.  **Compatibility with Theory Change Involving Ontological Shifts (Negotiable - Weighting varies between ESR/OSR):**
      *   **Motivation:** Theory change often involves radical changes in the *nature* of postulated entities (e.g., light as particle -> wave -> EM wave -> photon). SR needs to reconcile structural continuity with this ontological discontinuity.
      *   **Handling:** ESR typically views this as unproblematic: we only had knowledge of structure, not the underlying non-structural natures, so their change is expected. OSR (especially radical OSR) dissolves objects into structure, so the shift *is* a structural shift. More moderate views need to explain how structure persists while objects change. **→ Requirement Level:** ESR often treats this as a *strength*, OSR *must* address it as core to its ontology. Failure here weakens SR's claim to handle scientific realism's core problem (change).

  8.  **Avoidance of Blanket Scepticism about Unobservables (Non-Negotiable):**
      *   **Motivation:** The NMA is an argument *for* realism. SR must justify belief in *some* aspect of mature theories that goes beyond the merely empirical/phenomenal. If it only saved empirical laws, it would collapse into instrumentalism. Structural continuity must pertain to the *theoretical* content concerning the unobservable world. *Exemplar Case:* Preserving Fresnel's equations *as part of Maxwell's theory* means accepting the structural description of the unobservable EM field is (approximately) correct in that domain.

  **Potential Conflicts & Tensions:**

  1.  **Defining Structure vs. Handling Discarded Theories (5 & 6):** A robust, non-arbitrary definition of "structure" (6) might make it *harder* to find any retention in cases like Ptolemy (5). Conversely, stretching "structure" to find *something* retained in Ptolemy (e.g., angular positions over time) risks making the notion of structure too vague or instrumental to satisfy (6).
  2.  **Defining Structure vs. Avoiding Triviality (6 & Core Purpose):** Failure to satisfy (6) threatens the entire NMA justification underpinning SR. If structure can't be defined non-question-beggingly, the claim that "structure is retained" loses its explanatory force for success, potentially regressing to a miracle or collapsing into selective realism.
  3.  **Limiting Cases & Ontology (4 & 7):** Explaining the structural continuity in limiting cases (e.g., NM from SR) while acknowledging the radical ontological shift (e.g., absolute space/time abandoned) requires careful articulation, especially for views less radical than OSR. Does the "structure" of NM survive only formally, or does it reflect something about the world?
  4.  **ESR vs. OSR Tensions:** ESR prioritises epistemic access (3, 8) but struggles profoundly with (6). OSR tackles (6) head-on via fundamental ontology but faces challenges with (7) and explaining the *apparent* reality of objects in scientific practice. Both must handle (4) and (5).

  This list provides the necessary specification to evaluate structural realist proposals against the demands of the No-Miracles Argument and the complexities of actual scientific theory change. The tensions, particularly surrounding the characterisation of "structure" and its application to problematic cases, highlight the ongoing challenges within the programme.
