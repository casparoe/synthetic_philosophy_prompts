prompt: |-
  For my philosophy of mind course we just did the extended mind stuff (Clark and Chalmers, Otto and his notebook, all that), and my friend Freya has become weirdly invested in it — she keeps ruling on whether things count as part of someone's mind or not, like a one-person court. Her verdicts so far: Otto's notebook, yes, obviously extended. Her own notes app, which she checks maybe 40 times a day and trusts without thinking, yes. Doing long division on paper where the page holds the intermediate digits, yes — she says the paper is literally doing the storing part of working memory. Her gran's diary, which only gets read every New Years for nostalgia and isn't relied on for anything, no. A delivery driver who follows sat-nav all day, sometimes mutters that it's picked a stupid route but follows it anyway, no — she said it's his tool, not part of him. And her flatmate Priya, who reliably remembers Freya's dentist appointments and gets asked whenever it comes up — yes, extended, which surprised me because Priya is a person and not an object Freya carries around.

  Anyway, we've got a pub argument going about the next batch of cases and I want to be able to predict her rulings in advance. The new cases: (a) her cousin, who now does basically all her uni work in conversation with an AI assistant — it's open constantly, she trusts it by default, but she knows it sometimes makes stuff up, so she spot-checks anything that really matters; (b) a rambler who navigates with a paper map and compass, consulting them the whole way; (c) a shared whiteboard that a whole flat treats as their collective memory for chores, bills, birthdays; and (d) someone whose phone broke and who has memorised almost nothing, but knows exactly where everything is filed in her flat — the filing system, not the contents, is doing the remembering.

  What do you reckon she'll say on each? I'm less interested in the individual answers than in the rule she's actually running — I can see at least two that fit everything she's said so far (something like Clark and Chalmers' trust-and-reliability criteria on one hand, and something about the external thing having to do some of the actual cognitive processing rather than just hand you finished outputs on the other), and they seem to come apart on the AI case and maybe the map one. So: what are the candidate rules, which of the new cases do they disagree about, what's your best guess and why, and is there a further case we could put to her that would settle which rule she's really using?
reasoning: |-
  Okay, let me start by unpacking this user's query. They're describing their friend Freya's rulings on what counts as part of the extended mind based on Clark and Chalmers' theory. The user wants to predict Freya's decisions on four new cases and figure out the underlying rule she's using. 

  First, I need to recall Clark and Chalmers' criteria: constant availability, automatic trust, past endorsement, and easy accessibility. Freya seems to stick closely to these. For example, she included Otto's notebook and her notes app because they're trusted and used constantly. Gran's diary was excluded because it's not relied upon regularly. The delivery driver was a "no" because he questions the sat-nav, breaking the trust criterion. Priya, the flatmate, was included despite being a person, which suggests Freya prioritizes function over ontology.

  Now, looking at the new cases: 

  Case (a) involves an AI assistant. The cousin uses it constantly and trusts it by default but spot-checks important things. This challenges the trust criterion. If Freya values automatic trust, she might exclude it because the spot-checking shows a lack of full reliance. But if she focuses on constant use and integration, she might include it. 

  Case (b) is the rambler with a map and compass. They're constantly consulting these tools, which seems to meet availability and trust. The question here is whether the tools are doing cognitive work. Since the rambler is actively using them for navigation, similar to Otto's notebook, this should be a "yes." 

  Case (c) is the shared whiteboard. It's used collectively for memory, like chores and bills. This aligns with Clark and Chalmers' idea of external storage. Constant access and trust from the group might make it a "yes," even though it's shared. 

  Case (d) is the person using a filing system. They remember where information is stored, not the content itself. This resembles Otto's notebook but relies on spatial memory. If the system is constantly accessed and trusted, it should qualify. 

  The user suspects two possible rules: strict trust vs. cognitive processing. The AI case is key here. If Freya excludes it, she's likely emphasizing automatic trust. If she includes it, she might prioritize integration over blind trust. 

  To test this, a hypothetical case could involve a tool that's constantly used and integrated but requires occasional verification. For example, a password manager with two-factor authentication. If Freya says "no" because of the extra step, trust is her main criterion. If "yes," then integration matters more. 

  I think Freya will rule: AI assistant no (due to spot-checking breaking trust), rambler yes (constant use, trust), whiteboard yes (functional equivalence to memory), filing system yes (like Otto's notebook). 

  The key differentiator is the trust criterion. Her prior rulings show that any doubt or need for verification excludes an external resource. The delivery driver's muttering about the sat-nav broke trust, similar to the AI spot-checking. Priya is trusted without question, hence included. 

  So, the underlying rule is Clark and Chalmers' original criteria, with unwavering trust as crucial. The AI case will confirm if trust is non-negotiable for Freya.
answer: |-
  Based on Freya's pattern and the core tension you identified (trust vs. cognitive processing role), here's the breakdown for the new cases, the candidate rules, their disagreements, a prediction, and a test case:

  **Candidate Rules (Extracted from Freya's Verdicts):**

  1.  **Strict Clark & Chalmers (Trust & Reliance):** The external resource must be:
      *   **Constantly available** and accessed.
      *   **Automatically trusted** and relied upon without critical scrutiny *in the moment of use*.
      *   **Easily accessible**.
      *   **Containing information previously endorsed** by the user.
      *   *Emphasis:* **Passive, unquestioned reliance** is key. Any active verification breaks the extension. (This explains Priya: she functions as a trusted, constant, automatic info source).

  2.  **Cognitive Process Offloading (Functional Role):** The external resource must be:
      *   **Actively integrated** into the cognitive process *in real-time*.
      *   Performing a **core cognitive function** (like storage, calculation, retrieval) that the brain *would otherwise do internally*.
      *   **Relied upon** for that specific function.
      *   *Emphasis:* **The nature of the work** being offloaded matters more than absolute blind trust. The external element is doing the *cognitive labor*. (This explains the long division paper: it's performing the working memory storage function).

  **Where They Diverge on New Cases:**

  *   **(a) AI Assistant:** This is the key battleground.
      *   **Rule 1 (Trust):** Likely **NO**. The spot-checking for important things demonstrates a *lack* of automatic, unquestioned trust. The user is maintaining an internal critical faculty, breaking the "automatic endorsement" criterion. It's seen as a fallible tool, not a seamless part of her mind.
      *   **Rule 2 (Process):** Likely **YES**. The AI is *actively integrated* into the cousin's cognitive workflow (constant conversation). It's performing core cognitive functions she *would otherwise do* (recall, synthesis, calculation, drafting). The trust is sufficient for integration, even if verified later. The *functional role* is paramount.

  *   **(b) Rambler with Map & Compass:**
      *   **Rule 1 (Trust):** Likely **YES**. Constantly accessed, consulted automatically throughout the journey, presumably trusted without question on each consultation (barring major anomalies), easily accessible. Functions as an unquestioned external spatial memory/navigation module.
      *   **Rule 2 (Process):** Definitely **YES**. The map and compass are *integrated in real-time* into the navigation process. The map stores spatial data, the compass provides orientation – core functions the brain would handle internally (poorly). The rambler's cognition is *distributed* across brain and tools during the task.

  *(Cases (c) & (d) are less contentious between the rules, but see below)*

  **Predictions for Freya's Verdicts (Based on Pattern):**

  1.  **(a) AI Assistant: NO.** Freya's prior rulings heavily emphasize **automatic, unquestioned trust** (Otto, Notes App, Priya = trust; Gran's Diary = not constant/reliable; Delivery Driver = questions tool). The cousin's spot-checking is analogous to the driver muttering about the sat-nav – it breaks the seamless, automatic reliance. *She'll likely see the critical verification as internalizing the cognitive function, breaking the extension.*
  2.  **(b) Rambler with Map & Compass: YES.** This fits Otto/Notes App perfectly: constant access, automatic consultation, trust, past endorsement (map chosen). It's the analog equivalent. The constant consultation mirrors Otto checking his notebook. Rule 1 strongly points here, and Rule 2 also supports it.
  3.  **(c) Shared Whiteboard: YES.** This is a clear case of **collective/coupled systems** extending the mind, similar to Priya but for a group. Freya already accepted Priya (a person) as extended. The whiteboard is constantly available (in the flat), automatically consulted/updated for the relevant info (chores/bills), and trusted by the group. It functions as their shared procedural/organizational memory. Both rules support this, though Rule 1 requires seeing the flat *as a coupled system*.
  4.  **(d) Filing System Memory: YES.** This is a brilliant case of **cognitive offloading via structure**. The *organization itself* is the stored memory. The phone-break person constantly accesses and relies on the system automatically ("knows exactly where everything is filed"). The filing system performs the storage and retrieval indexing functions that biological memory would. It's very analogous to Otto's notebook's *structure* holding the info. Both rules support this.

  **Best Guess for Freya's Rule:**

  Freya is primarily using **Strict Clark & Chalmers (Rule 1: Trust & Reliance)**, with a heavy emphasis on **automatic, unquestioned reliance in the moment of use**. This explains:

  *   **Priya (YES):** Trusted implicitly when asked.
  *   **Delivery Driver (NO):** Actively questions the output (muttering).
  *   **AI Assistant Prediction (NO):** Spot-checking shows active verification, breaking automatic trust.
  *   **Long Division (YES):** The paper *is* trusted implicitly to hold the digits; she's not recalculating the stored digits constantly.

  The "cognitive processing" aspect (Rule 2) seems secondary for her, *emerging* when the trust/reliance criteria are met (e.g., the paper *is* doing working memory storage *because* it's trusted implicitly). She prioritizes the *relationship* (trusted, automatic access) over dissecting the *exact cognitive function* being performed.

  **Test Case to Settle the Rule:**

  Propose this to Freya: **"A musician uses a complex, custom-built pedalboard with presets for each song in their setlist. They trust it completely, never check the settings mid-song, and rely on it to instantly produce the exact sound needed at the right moment. One preset has a subtle fault, making one note slightly out of tune, but the musician never notices and always uses it faithfully."**

  *   **Under Rule 1 (Trust): YES.** Constant access (on stage), automatic trust (never checks mid-use), easy access (presses preset), past endorsement (they built/programmed it). The unnoticed fault is irrelevant to the *trust* criterion in the moment of use. It's seamlessly integrated and relied upon automatically.
  *   **Under Rule 2 (Process):** Likely **YES** (it's offloading sound recall/processing), but potentially **NO** if you argue the fault means it's *not reliably performing the cognitive function* (producing the correct sound) even if trusted. Rule 2 is more vulnerable to functional failure arguments.

  **If Freya says YES:** It strongly confirms **Rule 1 (Trust)**. The blind, automatic reliance is paramount, even if the external resource is *actually malfunctioning* as long as the *user* trusts it implicitly in the moment.

  **If Freya says NO:** It suggests **Rule 2 (Process)** is more dominant, or she's adding a **reliability/accuracy** criterion beyond Clark & Chalmers' original formulation. She'd be prioritizing whether the external tool *correctly performs the intended cognitive function* over the user's *attitude* of trust. This would make her ruling on the AI Assistant less predictable (she *might* say yes if the AI usually gets it right, despite spot-checking).

  The AI Assistant case is your strongest natural differentiator based on her existing pattern. Her ruling there will be very telling. Good luck with the pub argument!
