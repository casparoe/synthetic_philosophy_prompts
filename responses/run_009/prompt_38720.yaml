  | "since a hallucination can be indistinguishable from genuine seeing, the best explanation is that even in ordinary veridical cases we're directly aware of the same kind of inner thing" | Fair            | This accurately states the core argument *against* which disjunctivism reacts: the "common kind" assumption. Disjunctivists fundamentally reject this inference as invalid.          | Yes                            | This is the standard target. Disjunctivists agree this is the opponent's reasoning and their raison d'être is to deny it.                      |
