prompt: |-
  You are an expert in formal epistemology and decision theory, equally at home with orthodox Bayesianism and its rivals. Please think carefully before answering, beginning with a short brainstorm of candidate concepts and why each fits or fails to fit, and write your response in American English.

  I'm a longtime reader of the rationalist blogosphere, and I've hit on something in arguments with friends who refuse to give point-value credences and insist on ranges instead. My friend's credence that her cousin's startup succeeds is "somewhere between 30% and 60%." She is also exactly 50% on any fair coin. The strange part is what happened when a coin actually got flipped: she maintains that for all she knows the coin's outcome is linked to the startup's fate — some of the probability models she hedges over treat the two as positively correlated, others as negatively correlated, others as independent — so after I told her the coin landed heads, her interval for the startup widened to something like 20% to 70% rather than narrowing. Note that every one of her models agreed the coin itself was fair, so the flip was, by her own lights, informative about nothing she cared about; it just made her less precise about everything else. She insists this is the honest response — why should a coin flip make her more committal? — but to me it looks like becoming less decisive for free: she will now refuse wagers on the startup that every point in her old range endorsed, because part of the widened range rejects them.

  Does this phenomenon — an interval of credences spreading apart upon conditioning on evidence that no member of the set counts as relevant to the target event — have an established name? I don't want just the term. I want to know exactly what the phenomenon is, how it differs from an ordinary loss of precision, from Ellsberg-style ambiguity aversion, and from anything a plain Bayesian with a point credence could ever undergo; whether the people who study credence-sets treat it as a feature or as a pathology; and if no established concept quite captures it, coin a term and draw its boundaries, including the edge cases where it does and doesn't occur.
reasoning: |-
  Alright, the user is describing a scenario where their friend uses credence intervals instead of point probabilities. The friend initially has a 30-60% credence for her cousin's startup succeeding. When a fair coin flip (which she considers completely unrelated) lands heads, her interval widens to 20-70%. The key here is that the coin flip shouldn't provide any relevant information about the startup, yet her interval spreads out.

  First, I need to recall how imprecise probabilities work. The friend is using a set of probability distributions, each representing a possible model. For the startup, each model in her set assigns a probability between 30% and 60%. The coin is fair in all models, but the correlation between the coin and startup varies across models—positive, negative, or independent. 

  When the coin lands heads, she conditions each model on this evidence. Even though each model considers the coin fair, the correlation differences cause the updated startup probabilities to vary more. Some models might increase the startup's probability (if negatively correlated), others decrease it (if positively correlated), leading to a wider interval after updating.

  This seems like dilation. Dilation occurs when conditioning on evidence causes the credal set to become less precise. The user mentioned that it's not about ambiguity aversion like in the Ellsberg paradox, where people avoid ambiguous choices. Here, the issue is the interval widening upon irrelevant evidence.

  The user wants to differentiate this from other concepts. Ordinary loss of precision might happen with new ambiguous info, but here the evidence is irrelevant. A strict Bayesian would never experience this because they have a single prior. For them, conditioning on irrelevant evidence shouldn't change their credence. The widening interval here results from the set of priors and their varying correlations.

  I should check if dilation is the right term. Yes, in imprecise probability theory, dilation refers to the interval expanding after conditioning, even with irrelevant evidence. It's a known phenomenon, often seen as a drawback because it leads to indecision. The friend refuses bets she previously accepted, showing how this affects decision-making.

  The user might also be interested in why this happens and whether it's considered rational. Some schools of thought accept it as a feature of epistemic humility, while others see it as a pathology making decisions harder. The key difference from ambiguity aversion is that dilation happens upon updating, not just from existing uncertainty.

  Edge cases: If all models agreed on the correlation, dilation wouldn't occur. Also, with no correlation, intervals shouldn't change. Dilation requires conflicting dependencies in the credal set. The user's deeper need might be to understand if their friend's approach is valid or flawed, and how to argue against or accept such intervals. They might want to grasp the implications for decision theory and whether using intervals can lead to irrational outcomes.
answer: |-
  This is a fascinating case study in the divergence between Bayesian and imprecise probability frameworks. The phenomenon you describe is **dilation**—a specific effect in imprecise probability (IP) theory where conditioning on *irrelevant* evidence *widens* the interval of credences for a target event. Below, I break down its mechanics, distinctions from related concepts, and philosophical interpretations.

  ---

  ### **1. Brainstorm of Candidate Concepts**
  - **Dilation (Best Fit)**: In IP, dilation occurs when conditioning on evidence increases the imprecision (spread) of the credal interval for an event, even when the evidence is irrelevant to that event under every prior in the set. *Fits* because your friend's interval widens after the coin flip due to conflicting dependencies.
  - **Ambiguity Aversion (Ellsberg-Style)**: A preference for known risks over unknown probabilities. *Fails* because dilation is an *epistemic update phenomenon*, not a decision-theoretic bias. Your friend isn't avoiding bets due to uncertainty; her beliefs themselves became less precise.
  - **Confirmation Bias/Motivated Reasoning**: Updating beliefs to fit preferences. *Fails*—no evidence of irrational motivation; she's consistently applying IP rules.
  - **Bayesian Conservatism**: Reluctance to update priors. *Fails*—she *did* update, but the update expanded her interval.
  - **Setwise Conditioning (Partial Fit)**: General IP updating rule. *Fits the mechanism* but doesn't name the widening effect. Dilation is a *consequence* of setwise conditioning under specific conditions.

  ---

  ### **2. What is Dilation?**
  **Definition**:  
  Dilation occurs when, for a target event \(A\) and evidence \(E\), the interval \([P^-(A), P^+(A)]\) widens after conditioning on \(E\) (i.e., \([P^-(A|E), P^+(A|E)]\) is strictly larger), despite \(E\) being *irrelevant to \(A\)* under every prior in the credal set \(\mathcal{C}\).  

  **Mechanism in Your Example**:  
  - Your friend's credal set \(\mathcal{C}\) contains probability models where:  
    - The coin is fair in all models (\(P(\text{Heads}) = 0.5\)).  
    - The startup's success (\(S\)) and coin outcome (\(H\)) have *varying dependencies*:  
      - Some models: \(P(S|H) > P(S)\) (positive correlation).  
      - Some models: \(P(S|H) < P(S)\) (negative correlation).  
      - Some models: \(P(S|H) = P(S)\) (independence).  
  - When conditioning on \(H\), each model updates:  
    - Positively correlated models: \(P(S|H)\) **increases** (e.g., from 30% to 50%).  
    - Negatively correlated models: \(P(S|H)\) **decreases** (e.g., from 60% to 40%).  
    - Independent models: \(P(S|H)\) **unchanged**.  
  - The new interval \([P^-(S|H), P^+(S|H)]\) spans the extremes (e.g., 20%–70%), wider than the original 30%–60%.  

  **Key Insight**:  
  Dilation arises from *disagreement in dependency structures* across \(\mathcal{C}\). Even though \(E\) is irrelevant in each model *considered alone*, the *set as a whole* reacts to \(E\) by amplifying imprecision.  

  ---

  ### **3. How Dilation Differs From Similar Concepts**
  | **Concept**               | **Key Difference**                                                                 |
  |---------------------------|-----------------------------------------------------------------------------------|
  | **Ordinary Loss of Precision** | Caused by *ambiguous new evidence* (e.g., vague data). Here, evidence is irrelevant and unambiguous—the coin flip is perfectly observed. |
  | **Ellsberg Ambiguity Aversion** | A *decision bias* under ignorance. Dilation is a *belief-update rule*: it occurs even if your friend is ambiguity-neutral. |
  | **Bayesian Updating**      | A strict Bayesian uses one prior. Irrelevant evidence never changes \(P(A)\). Dilation is *impossible* under orthodoxy. |

  ---

  ### **4. Is Dilation a Feature or Pathology?**
  **The Debate in IP Scholarship**:  
  - **Feature Argument**:  
    Proponents (e.g., Levi, Walley) view dilation as honest epistemic humility. If your friend genuinely considers correlations possible (e.g., the coin flip might be entangled with economic factors affecting the startup), refusing to narrow her interval reflects her ignorance. She avoids "spurious precision."  
  - **Pathology Argument**:  
    Critics (e.g., Seidenfeld, Schervish) highlight pitfalls:  
    - **Decision Paralysis**: As you noted, she rejects bets she previously accepted, despite no new relevant information.  
    - **Dynamic Inconsistency**: Updating on irrelevant evidence *reduces* her knowledge, violating intuition.  
    - **Exploitable**: A savvy agent could "pump" her intervals wider with irrelevant data.  

  **Consensus**: Dilation is mathematically inherent to IP with *non-congruent* credal sets (where models disagree on dependencies). It is accepted by IP theorists as a logical consequence but criticized as pragmatically problematic.  

  ---

  ### **5. Edge Cases and Boundaries**
  Dilation occurs **if and only if**:  
  1. The credal set \(\mathcal{C}\) contains models with conflicting dependencies between \(A\) and \(E\).  
  2. \(E\) is possible under all models (here, \(P(H) > 0\) for all priors).  

  **Edge Cases**:  
  - **No Dilation if Dependencies Agree**:  
    If all models agree \(S\) and \(H\) are independent, conditioning leaves \([P^-(S), P^+(S)]\) unchanged.  
  - **No Dilation if \(\mathcal{C}\) is a Singleton**:  
    Collapses to Bayesianism; no interval to widen.  
  - **Dilation Without Irrelevance?**:  
    If \(E\) is relevant in some models, dilation can still occur but isn't "surprising." Your case is striking because \(E\) is irrelevant everywhere.  

  ---

  ### **Conclusion**
  Your friend's reaction is a textbook example of **dilation** in imprecise probabilities. It starkly separates IP from Bayesianism: while a Bayesian's point credence would be unmoved by a fair coin flip, IP allows intervals to dilate due to structural uncertainty about dependencies. Whether this is rational depends on one's tolerance for dynamic choice anomalies. To critics, dilation reveals a flaw in IP's practical coherence; to advocates, it underscores the danger of artificial precision when true dependencies are unknown. For your debate, note that dilation *does* make her less decisive "for free"—but in her view, it avoids the hubris of pretending she knows more than she does.  

  **Suggested Term for Nuanced Cases**:  
  If emphasizing the irrelevance condition, call it **strict dilation** (contrasting with cases where evidence is genuinely ambiguous). This flags the paradox of lost precision despite irrelevant data.
