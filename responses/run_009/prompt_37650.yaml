  The core tension here is fascinating: they need something procedural enough for 20-minute file reviews yet true to care ethics' rejection of impersonal systems. The laminated card requirement means I must distill complex philosophy into nurse-and-social-worker-friendly steps. Their inclusion of "an outcome I won't like" suggests they want intellectual honesty, not reassurance.

  For the procedure itself, I'll structure it around care ethics' pillars: attentiveness (seeing beyond files), responsibility (active engagement), competence (effective care), and responsiveness (reciprocity). But I must address the elephant in the room first - how can we systematize this without corrupting it? The answer might lie in framing the procedure as scaffolding for moral reasoning rather than replacement.

  The three test cases are perfectly chosen to probe weaknesses:
  - Mrs. Okafor tests whether we recognize "invisible" caregiver burnout
  - Mr. Whitfield challenges our definition of "care relationship"
  - Harriet Boyd confronts us with refusal-of-help paradoxes

  For the disliked outcome, I suspect Harriet's case will prove hardest - care ethics must sometimes respect refusal as agency, even when harmful. That's where the spine shows.

