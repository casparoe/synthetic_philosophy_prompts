  ### Decision Procedure for Classifying Alignment Proposals  
  **Time Budget:** ~30 minutes per proposal. Focus on *what the work actually targets* (not surface features).  
  **Outputs:**  
  - Classification: (a) Intent alignment, (b) Value alignment, (c) Something else (specify), (d) Confused/underspecified.  
  - Awareness flag: Yes/No (authors acknowledge intent-vs-value distinction).  

  ---

  ### Decision Procedure (Checklist Sequence)  
  **Goal:** Cut through terminology to identify the *actual problem being solved* and *mechanism of intervention*.  
  **Key Failure Mode Avoidance:** Ignore buzzwords (e.g., "alignment," "safety," "objective"); focus on causal pathways and evaluative standards.  

  #### Step 1: Extract the Core Problem (5 min)  
  **Question:** *What specific failure mode does the proposal claim to address?*  
  - **Sufficient answer:**  
    - If failure is **"AI doesn’t do what the operator/user commands"** (e.g., ignores instructions, misinterprets intent) → Lean (a).  
    - If failure is **"AI’s goals conflict with humanity’s values"** (e.g., deceptive, power-seeking, values drift) → Lean (b).  
    - If failure is **"Outputs are harmful/offensive/unethical"** without intent violation → (c) Ethics/taste.  
    - If failure is **"AI causes societal/policy risks"** and solution is institutional → (c) Governance.  
    - If failure is **"AI is incompetent at a task"** → (c) Capability.  
    - Vague/contradictory → (d).  
  **Why this first?** Anchors the proposal’s purpose. Avoids buzzword traps.  

  #### Step 2: Analyze the Mechanism (10 min)  
  **Question:** *How does the proposed intervention resolve the failure mode? Trace causality.*  
  - **Sufficient answer:**  
    - **Intent alignment (a):** Mechanism directly optimizes for matching *operator-specified* intents (e.g., fine-tuning on instruction pairs, adversarial training for instruction robustness).  
    - **Value alignment (b):** Mechanism steers AI toward *extrinsic human values* (e.g., learning latent values from human feedback, corrigibility architectures).  
    - **Ethics (c):** Mechanism optimizes for socially acceptable outputs (e.g., bias reduction, content filtering) without intent reference.  
    - **Governance (c):** Mechanism is procedural/institutional (e.g., auditing frameworks, decision protocols).  
    - **Capability (c):** Mechanism improves task performance without alignment logic (e.g., better scaffolding, reasoning improvements).  
    - Mechanism unclear or mismatched to problem → (d).  
  **Why this second?** Surface features (e.g., "RLHF") can mislead; focus on *what is being optimized for*.  

  #### Step 3: Inspect the Evaluation Metric (5 min)  
  **Question:** *What does "success" explicitly measure?*  
  - **Sufficient answer:**  
    - **Intent alignment (a):** Metrics track fidelity to *operator-given* commands (e.g., instruction accuracy, user satisfaction with task completion).  
    - **Value alignment (b):** Metrics track consistency with *broad human values* (e.g., human ratings of "moral acceptability", simulated value coherence).  
    - **Ethics (c):** Metrics track conformity to norms (e.g., toxicity scores, fairness benchmarks).  
    - **Governance (c):** Metrics track systemic outcomes (e.g., reduced error rates post-oversight, compliance rates).  
    - Metric disconnected from problem → (d).  
  **Why this third?** Evaluations reveal true goals (e.g., "approval ratings" may be intent or ethics).  

  #### Step 4: Check for Awareness (3 min)  
  **Question:** *Is there explicit acknowledgment of intent-vs-value alignment distinctions?*  
  - **Sufficient answer:**  
    - **Aware (Yes):** Mentions risks like "aligned to harmful intents" or "value drift vs. instruction drift."  
    - **Unaware (No):** Uses "alignment" ambiguously; conflates intent/value/ethics.  

  #### Step 5: Classify & Flag (2 min)  
  - **Consistency check:**  
    - If Problem, Mechanism, and Metric all point to (a)/(b)/(c) → Classify accordingly.  
    - Conflict or vagueness → (d).  
  - **Awareness flag:** From Step 4.  

  **Edge Cases Needing Judgment:**  
  - Proposals where mechanism is dual-use (e.g., RLHF for intent or values). Default to Problem + Metric.  
  - "Alignment-adjacent" work (e.g., oversight tools). Classify as (c) unless directly modifying AI goals.  
  - **Common Misclassification:** Competent intent-alignment proposals misclassified as (c) if they use ethics-like metrics (e.g., "helpfulness" without intent grounding). Mitigate by checking Step 1 (problem) rigorously.  

  ---

  ### Test Case Applications  
  #### Proposal 1: Fine-tuning on approval ratings to reduce sycophancy  
  - **Step 1: Problem**  
    - Failure: Model tells users what they want to hear (sycophancy), not truthful/critical responses.  
    - *Leans (c) — Outputs are dishonest/unhelpful, not necessarily intent-violating.*  
  - **Step 2: Mechanism**  
    - Intervention: Tune model on ratings from diverse humans penalizing sycophancy.  
    - *Optimizes for socially approved outputs, not operator intents → (c) Ethics/taste.*  
  - **Step 3: Metric**  
    - Success: Reduced sycophancy in Q&A tests (e.g., model rejects false user premises).  
    - *Measures conformity to truthfulness norms, not instruction fidelity → (c) Ethics/taste.*  
  - **Step 4: Awareness**  
    - Proposal discusses "misleading outputs," not intent/value distinction → **Unaware**.  
  - **Classification: (c) Ethics/taste** (Authors conflate honesty with alignment).  

  #### Proposal 2: Interpretability to extract the model’s learned objective  
  - **Step 1: Problem**  
    - Failure: We don’t know if the model’s internal goals match what we want.  
    - *Vague → Could be (a) or (b); underspecified.*  
  - **Step 2: Mechanism**  
    - Intervention: Reverse-engineer objective functions from model internals.  
    - *Diagnostic tool only; doesn’t change alignment → No target class yet.*  
  - **Step 3: Metric**  
    - Success: Faithfulness of extracted objective to behavior (e.g., accuracy in goal prediction).  
    - *Doesn’t specify what objective is compared to → (d) Underspecified.*  
  - **Step 4: Awareness**  
    - Mentions "alignment verification" but no intent/value nuance → **Unaware**.  
  - **Classification: (d) Confused/underspecified** (Work is tool-agnostic; could be used for (a) or (b)).  

  #### Proposal 3: AI debate to surface human-invisible considerations  
  - **Step 1: Problem**  
    - Failure: AI makes decisions without revealing hidden risks/considerations.  
    - *Leans (c) — Focuses on decision quality via transparency, not goal alignment.*  
  - **Step 2: Mechanism**  
    - Intervention: Two AIs debate; human judges the winner.  
    - *Adds oversight layer; doesn’t modify AI goals → (c) Governance.*  
  - **Step 3: Metric**  
    - Success: More considerations surfaced, better human decisions post-debate.  
    - *Measures human oversight efficacy, not intent/value fidelity → (c) Governance.*  
  - **Step 4: Awareness**  
    - Claims "improves alignment" but no discussion of intent/value → **Unaware**.  
  - **Classification: (c) Governance** (Work targets decision safety, not alignment per se).  
    - **Verification:** This is the "answer you won’t like" — debate is governance, not intent alignment.  

  ---

  ### Procedure Summary  
  **Keep this tab open:**  
  1. **Problem:** What failure? → (a) Intent violation, (b) Value conflict, (c) Other, (d) Vague.  
  2. **Mechanism:** How fixed? → (a) Optimize operator intents, (b) Optimize human values, (c) Other, (d) Mismatched.  
  3. **Metric:** Success = ? → (a) Intent fidelity, (b) Value coherence, (c) Norms/governance, (d) Unclear.  
  4. **Awareness:** Explicit distinction? → Yes/No.  
  5. **Classify:** Consistency check → (a)/(b)/(c: specify)/(d). + Flag awareness.  

  **Weakness:** Proposals with mismatched jargon and substance risk misclassification (e.g., intent work framed as "ethics"). Mitigate by cross-referencing Problem + Mechanism.  
  **Strength:** Targets the *work’s causal theory*, not vocabulary.
