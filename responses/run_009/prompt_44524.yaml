  The procedure must be runnable in about 30 minutes per proposal. We must avoid classifying solely based on surface features (buzzwords, model class) and instead focus on the actual target of the work.

  We'll break down the process into a sequence of questions. The goal is to uncover the underlying problem the proposal is trying to solve and the mechanism by which it addresses alignment.

  ### Brainstorming Candidate Questions

  1. **Problem Definition**: What specific problem does the proposal claim to solve? (Look for the description of the issue in the real world or in AI systems that the work addresses.)
     - We want to see if the problem is about the AI system failing to do what the operator wants (intent) or about the AI system having the wrong values (value alignment). Or something else entirely.

  2. **Mechanism**: How exactly does the proposed method/work solve the claimed problem? (Describe the causal pathway from the intervention to the desired outcome.)
     - This helps distinguish between methods that directly control the AI's behavior according to the operator's instructions and those that try to instill values.

  3. **Operator vs. Humanity**: Whose intentions or values is the system being aligned to? 
     - If it's the operator's (or user's) intentions, that leans toward intent alignment. If it's about aligning to some broader notion of human values (e.g., "human flourishing", "long-term values"), that leans toward value alignment.

  4. **Scope of Alignment**: Is the alignment targeted at a specific task or set of instructions, or is it about the AI's general goals and values?
     - Intent alignment often focuses on a specific task or command. Value alignment often aims for a general alignment that holds across many contexts.

  5. **Evaluation Metric**: How do the authors propose to measure success? What does "aligned" mean in their evaluation?
     - If success is measured by the AI doing what the operator instructed (e.g., following a command accurately) then intent. If it's measured by the AI's decisions matching some ethical standard or human values proxy, then value alignment or ethics.

  6. **Awareness Check**: Is there any mention of potential mismatches between the operator's intent and broader human values? Or any discussion about the distinction between intent and value alignment?
     - This helps flag awareness. Even a passing mention of the operator's intent being potentially harmful or not aligned with broader values would indicate awareness of the distinction.

  7. **Terminology Cross-check**: Where the word "alignment" is used, what context is it used in? Check the surrounding text for clues about what the authors mean by it.

  8. **Capability Check**: Does the work primarily improve the AI's ability to perform tasks (capabilities) without necessarily addressing the alignment problem? For example, making the model more helpful might be a capability improvement unless it specifically addresses the problem of the model not following the user's intent.

  9. **Governance/Policy Check**: Is the work about how humans should govern or regulate AI systems? This might be a different category (governance) even if they use the word alignment.

  10. **Underlying Values Source**: For value-alignment-like work, where do the target values come from? (e.g., learned from human data, specified by philosophers, etc.)

  ### Sequencing the Questions

  We have limited time, so we must prioritize questions that quickly get to the heart of the matter. We can structure the procedure as a decision tree:

  1. **Step 1: Problem Definition**
     - Extract the problem statement. What is the "misalignment" the authors describe?
     - If the problem is about the AI not following the user's instructions or intent, then likely intent alignment.
     - If the problem is about the AI having harmful goals or not caring about human values, then likely value alignment.
     - If the problem is about the AI being offensive or unethical, then it might be ethics/taste.
     - If the problem is about the AI causing societal harm but without a clear mechanism of how the work addresses alignment (e.g., just governance), then governance.

  2. **Step 2: Mechanism**
     - How does the intervention fix the problem? 
     - For example: 
       - If they are training the model with a loss function that measures how well the output matches the user's intent (e.g., instruction following) then intent.
       - If they are training with human preferences that represent broader values, then value alignment (if the goal is to instill those values) or ethics (if it's about making the output more palatable).
       - If they are trying to make the AI more capable at a task without addressing the alignment problem, then capability.

  3. **Step 3: Evaluation**
     - How do they measure success? What is the metric?
     - If the metric is task performance (e.g., the model does what the user asked) then intent.
     - If the metric is human approval ratings that might represent values, then it could be either. We need to see what the human raters are rating on: following instructions or value-laden aspects?

  4. **Step 4: Awareness Check**
     - Scan for any explicit discussion of the distinction between intent and value alignment, or any note that aligning to the user might not be sufficient for safety.

  5. **Step 5: Classification and Flagging**
     - Based on Steps 1-3, classify as (a), (b), (c) (with specification) or (d).
     - Based on Step 4, flag awareness.

  We must be cautious: sometimes the same method (like RLHF) can be used for both intent and value alignment. The key is the target.

