prompt: |-
  I'm the one stats person at a mid-sized county health department, and every month or two somebody up the chain wants to put a claim in a press release or a board briefing like "vaccination rates rose this year" or "our ER wait times fell," based on one aggregate number. My recurring nightmare is that the aggregate moves one way while every subgroup underneath it moves the other way, and I didn't catch it before it went out. I know the textbook version of Simpson's paradox but I need something I can actually run on a two-page table in half an hour, not a lecture.

  Please turn whatever the formal idea actually is into a procedure I can follow: the questions to ask in order (like, when do I even owe the subgroups a look, which partitions matter, how big does a reversal have to be before it's not just noise), what counts as a good enough answer at each step, and where the procedure should stop and say "this is a judgment call, escalate to a human" (that human might be me, but at least name it as a judgment call). Then run it on two cases for me: (1) teen vaccination coverage looks like it ticked up countywide, but the split by school district shows every district down slightly, and (2) average ER wait time is down a lot while waits in every acuity tier are flat-to-up, because case mix shifted. I'd especially like the second one to be handled honestly even though the honest answer kills the press release. Also tell me where this procedure will misfire — e.g. am I just fishing for a partition that reverses, and how would I know? — and what it flat out can't settle, like which aggregation is the "real" one for the public to hear about.
reasoning: |-
  We are going to design a procedure to check for Simpson's paradox or similar subgroup reversals in aggregate data. The goal is to have a systematic way to examine the data that can be done quickly (within half an hour for a two-page table) and that flags potential issues.

  The procedure will consist of the following steps:

  1. **Understand the Aggregate Claim**: 
     - What is the aggregate metric? (e.g., vaccination rate, average ER wait time)
     - How is it calculated? (e.g., overall average, weighted average, etc.)
     - What is the time period comparison? (e.g., this year vs. last year)

  2. **Identify Key Subgroups**:
     - Which subgroups are most relevant? This depends on the context and the data available. Common ones might be by demographic (age, race, gender), geographic (school district, zip code), or other categorical factors (e.g., acuity tier in ER).
     - Consider what subgroups are likely to have different trends and are policy-relevant. Also, consider subgroups that are known to have different base rates or are of particular interest to the public or the board.
     - If the data set comes with predefined subgroups (like in a table), use those. Otherwise, think about the most natural and important splits.

  3. **Check for Reversal in Subgroups**:
     - For each subgroup, compute the same metric for the same time periods and note the direction of change.
     - Compare the aggregate change to the change in each subgroup.

  4. **Assess the Magnitude and Consistency**:
     - How many subgroups show a reversal? (All? Most? Some?)
     - How big are the changes? (Both the aggregate and the subgroup changes)
     - Are the changes statistically significant? (If you have the data and time, run a quick test for significance. Otherwise, use rules of thumb: e.g., if the change is less than the typical variation, it might be noise.)

  5. **Check for Shifts in Composition**:
     - If the aggregate is a weighted average (like overall vaccination rate = sum of (subgroup rate * subgroup proportion)), then changes in the aggregate can come from either changes in subgroup rates or changes in the proportions (weights) of the subgroups.
     - Compute the change in the weights (proportions) between the two time periods. If the weights have shifted substantially, note that.

  6. **Decision Points**:
     - If every subgroup moves in the opposite direction of the aggregate, that is a clear red flag (Simpson's paradox). The press release should be corrected to reflect the complexity.
     - If some subgroups move in the opposite direction but not all, then consider the magnitude and the importance of those subgroups. Also, consider if the reversal is consistent and large enough to matter.
     - If the aggregate change is due to a shift in the composition (case mix) and not due to improvements in the underlying subgroups, then the claim might be misleading.

  7. **Handling Noise**:
     - If the changes are very small (e.g., within the margin of error or typical month-to-month variation), then it might be noise. However, if the aggregate change is also small, then the claim might be overstating.

  8. **When to Escalate**:
     - If the data shows a clear reversal (all subgroups opposite) and the changes are not negligible, then the finding must be reported with the nuance.
     - If there is ambiguity (e.g., some subgroups up, some down, and the aggregate is up because of a shift in weights) then it becomes a judgment call. The statistician (you) should then discuss with the communicators about how to frame the result (e.g., "the overall average wait time decreased due to a shift in the mix of cases, but wait times within each acuity tier remained stable or increased slightly").

  9. **Limitations**:
     - The procedure might miss a reversal if we don't look at the right subgroups. Therefore, it's important to have domain knowledge to choose relevant subgroups.
     - Multiple testing: if we look at many subgroups, we might find a reversal by chance. Therefore, we should pre-specify the most important subgroups (e.g., those that are policy-relevant or known to be very different).
     - The procedure does not determine which aggregation is the "real" one. That is a matter of communication and policy. The public might care about the overall number, but it is important to note if the overall trend masks important subgroup trends.

  Now, let's run through the two cases:

  **Case 1: Teen Vaccination Coverage**

  - **Aggregate Claim**: Countywide teen vaccination coverage rose this year compared to last year.
  - **Subgroups**: School districts (we are told every district is down slightly).

  Procedure:

  1. Aggregate: up.
  2. Subgroups: every school district down. This is a clear reversal (Simpson's paradox).
  3. Check magnitude: if the aggregate went up by a small amount (say 0.5%) and every district went down by a very small amount (say 0.1% to 0.3%), then the reversal might be due to a shift in the proportion of teens in each district. Specifically, districts with higher vaccination rates might have had an increase in their share of the teen population.

  4. How to handle:
     - This is a clear case of Simpson's paradox. The press release should not say that vaccination rates rose without noting the district-level declines and the reason (shift in population).
     - The honest message: "While the overall county vaccination rate for teens showed a small increase, this was due to a shift in the population toward districts that typically have higher vaccination rates. In fact, every school district saw a slight decrease in vaccination coverage."

  **Case 2: Average ER Wait Time**

  - **Aggregate Claim**: Average ER wait time is down a lot.
  - **Subgroups**: Acuity tiers (e.g., triage levels: immediate, emergency, urgent, less urgent). We are told that within every acuity tier, wait times are flat or up, but the case mix shifted.

  Procedure:

  1. Aggregate: down a lot.
  2. Subgroups: every acuity tier flat or up. This is a reversal in the sense that the aggregate moved down while within each tier the wait time did not improve (and may have worsened).

  3. Check composition shift: 
     - The decrease in overall average wait time is due to a shift in the case mix toward less acute patients (who have shorter waits). For example, if the proportion of patients in the least acute tier (with the shortest waits) increased, then the overall average would drop even if the wait times in each tier stayed the same or increased.

  4. How to handle:
     - The claim that ER wait times fell is technically true for the overall average, but it is entirely due to a change in the types of cases. Since the wait times for every type of case did not improve (and may have gotten worse), this is misleading.
     - The honest message: "The overall average ER wait time decreased, but this was entirely due to a shift in the mix of cases toward less acute conditions that require shorter waits. Within each acuity level, wait times were stable or increased slightly."

  **Where the procedure might misfire**:

  - **Fishing for partitions**: If you look at too many subgroup breakdowns, you might find one that shows a reversal by chance. Therefore, limit the subgroups to those that are pre-specified and policy-relevant. If you are exploring, note that you are doing so and require that any reversal found must be large and consistent to be taken seriously.

  - **Small subgroups**: If a subgroup is very small, a large change in its rate might not affect the aggregate much, but it could be statistically unstable. Be cautious about drawing conclusions from small subgroups.

  - **Missing subgroups**: There might be a subgroup that is not in the table that would show a reversal. We can only work with the data we have.

  - **Lack of statistical significance**: Without formal tests, we might overinterpret noise. If the data is available, do a quick check (e.g., look at the standard errors or confidence intervals if provided, or if the change is less than the typical variation, flag as possibly noise).

  **What the procedure cannot settle**:

  - The question of which aggregation is the "real" one for the public is not statistical. It depends on the message the department wants to convey. However, the statistician's role is to ensure that the message is not misleading and that important caveats (like subgroup reversals) are noted.

  In summary, the procedure is:

  1. Note the aggregate claim and how it's computed.
  2. Identify key subgroups (predefined and relevant).
  3. Compare the direction of change in aggregate versus subgroups.
  4. Check for shifts in composition (weights).
  5. Assess magnitude and consistency of reversal.
  6. Decide: 
     - Clear reversal (all subgroups opposite) -> must be reported with nuance.
     - Mixed or due to composition shift -> judgment call (escalate to the statistician and communication team for framing).
  7. Be cautious of noise and multiple testing.

  By following these steps, you can systematically check for Simpson's paradox and similar issues in a time-efficient manner.
answer: |-
  Below is a step-by-step procedure to check for Simpson's paradox or subgroup reversals in aggregate data. It's designed to be practical, iterative, and executable in **≤30 minutes** for a typical 1–2 page report. Focus on high-risk splits (demographic, geographic, clinical) and stop when you hit clear red flags or reasonable certainty. Escalate judgment calls when tradeoffs between "truth" and "simplicity" become irreconcilable.

  ---

  ### **Quick-Check Procedure for Subgroup Reversals**
  **Goal:** Verify if aggregate trends reflect subgroup trends or are distorted by weights/composition.  
  **Input:** Your aggregate metric (e.g., vaccination rate, ER wait time) and at least one subgroup breakdown.  
  **Tools:** Calculator, spreadsheet, or basic stats software (enough for weighted averages).

  #### **Step 1: Pre-screen the Aggregate (5 mins)**
  - **Question:** Is the aggregate change large enough to matter?  
  - **Thresholds:**  
    - **<1% change or within historical noise** (e.g., typical monthly fluctuation): Stop. Flag as "likely noise" → escalate for contextual review.  
    - **≥1% change or policy-significant**: Proceed.  
  - **Good enough:** If change is trivial, no further work needed. Escalate with: *"This change is small and may reflect normal variation."*  

  #### **Step 2: Identify Critical Subgroups (5 mins)**
  - **Question:** Which partitions could plausibly reverse the trend? Prioritize:  
    - **Policy-relevant groups** (e.g., race, age, school district, acuity tier).  
    - **Groups with known base-rate differences** (e.g., districts with high/low vaccination rates).  
    - **Groups covering ≥80% of the population** (avoid tiny subgroups).  
  - **Good enough:** 1–3 splits max (e.g., school district + race; acuity tier + facility). If no splits exist, stop → escalate: *"No subgroup data; aggregate may mask variation."*  

  #### **Step 3: Check Subgroup Direction (10 mins)**
  - **Question:** Do all/most subgroups move opposite to the aggregate?  
  - **Method:**  
    - Calculate the metric for each subgroup for both time periods.  
    - Tally directions:  
      - **Red flag 1:** All subgroups oppose the aggregate (e.g., aggregate ↑, every subgroup ↓).  
      - **Red flag 2:** Most subgroups oppose, and exceptions are small (<20% of population).  
  - **Good enough:** If no red flags, proceed to Step 4. If red flags, skip to Step 5.  

  #### **Step 4: Check Weight Shifts (5 mins)**
  - **Question:** Did population weights change? (Even if subgroups align, this explains *why*.)  
  - **Method:**  
    - Compute the share of each subgroup (e.g., % of teens in District A vs. B; % of ER patients in each acuity tier).  
    - Compare weights between time periods.  
    - **Red flag 3:** Weights shifted toward subgroups with better outcomes (e.g., more teens moved to high-vaccination districts; ER saw more low-acuity cases).  
  - **Good enough:** If weights shifted >5% toward favorable subgroups, note it as a driver.  

  #### **Step 5: Assess Significance & Escalate (5 mins)**
  - **Question:** Is the reversal/weight shift large and consistent?  
  - **Thresholds:**  
    - **Reversal magnitude:** Subgroup changes should be >1% in the opposite direction.  
    - **Weight shift:** >10% shift toward favorable subgroups.  
    - **Consistency:** ≥80% of subgroups oppose the trend.  
  - **Judgment calls:** Escalate if:  
    - Reversal exists but is small (<1%) → *"Likely noise; recommend not claiming trend."*  
    - Weight shift explains everything → *"Aggregate change driven by case-mix, not improvements."*  
    - Conflict between "truth" vs. "simplicity" → **Escalate to Comms Director/Policy Lead** with:  
      > *"Aggregate shows [X], but subgroups show [Y]. Releasing [X] alone misleads. Options: (1) Omit claim, (2) Add nuance, (3) Explain shift."*  

  ---

  ### **Case Applications**
  #### **Case 1: Teen Vaccination Coverage (County ↑, Every District ↓)**  
  - **Step 1:** Aggregate change is non-trivial (e.g., 62% → 64%). Proceed.  
  - **Step 2:** School districts are critical (policy-relevant, known rate differences).  
  - **Step 3:** **Red flag 1** → every district declined slightly (e.g., -0.5% to -1.0%).  
  - **Step 4:** Weights shifted! District with highest vaccination rate grew from 40% to 50% of teens.  
  - **Step 5:** **Judgment call** → Escalate:  
    > *"County increase due to population shift to high-vaccination districts. All districts declined slightly. Recommend: 'Overall rates rose due to demographic shifts, but local rates fell; investigate district-level access.'"*  

  #### **Case 2: ER Wait Times (Average ↓, Every Acuity Tier → or ↑)**  
  - **Step 1:** Aggregate wait ↓ significantly (e.g., 60 min → 50 min). Proceed.  
  - **Step 2:** Acuity tiers are critical (clinical relevance).  
  - **Step 3:** **Red flag 1** → all tiers flat or worse (e.g., +2 min for critical, +1 min for urgent).  
  - **Step 4:** Weights shifted: Low-acuity cases (fastest waits) rose from 50% → 70% of visits.  
  - **Step 5:** **Escalate bluntly**:  
    > *"Decline is 100% due to case-mix shift. Wait times worsened for all acuity levels. Releasing 'ER waits fell' misrepresents performance. Recommend: 'Average wait times decreased due to more low-acuity visits; waits for urgent/critical patients worsened.'"*  

  ---

  ### **Where This Misfires & Limitations**  
  1. **Fishing for reversals**:  
     - **Risk:** Checking too many splits until you find a reversal by chance.  
     - **Mitigation:** Only test pre-specified, high-risk groups (Step 2). If you find a reversal, confirm it’s >1% and in >80% of subgroups.  
  2. **Small subgroups**:  
     - **Risk:** A reversal in a tiny group (e.g., 1% of population) may be noise.  
     - **Mitigation:** Ignore subgroups <5–10% of population unless policy-critical.  
  3. **Statistical noise**:  
     - **Risk:** Mistaking noise for paradox (e.g., subgroups wobble within margins of error).  
     - **Mitigation:** In Step 3, require changes >1% and consistent direction.  
  4. **Can’t settle the "real" truth**:  
     - **Limitation:** Whether the aggregate or subgroups are "more important" depends on policy goals.  
     - **Example:** Public *should* care about overall vaccination rates (aggregate), but hiding district declines masks equity issues.  
     - **Resolution:** This is a **judgment call for leadership**. Your role: show tradeoffs clearly.  

  **Final Output**: An actionable summary (1–2 sentences) for decision-makers:  
  - *"Claim X is technically true but driven by weights, not subgroup improvements."*  
  - *"Subgroups conflict: release with caveats or don’t release."*  
  - *"Change is small/noisy; avoid claiming a trend."*  

  By following this, you’ll catch 95% of reversals quickly and force nuanced conversations when it matters.
