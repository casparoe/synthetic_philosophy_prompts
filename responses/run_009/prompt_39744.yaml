        Or are they parasitic (e.g., Lorentz's theory borrowed from the existing electromagnetic theory and then added ad hoc adjustments)?

   2. Point of the argument: Is underdetermination about confirmation (no evidence can confirm one over another) or about theory choice (non-empirical means can break the set)?
