answer: |-
  ### Decision Tree: Underdetermination in Philosophy of Science  
  **Starting Point:** All students grant that for any finite body of evidence, multiple incompatible theories can be constructed that entail it.  

  ---

  #### **Node 1: Historical Rivals**  
  *In actual scientific history (e.g., Lorentz–FitzGerald contraction vs. special relativity in 1905, or Newton-plus-Vulcan vs. general relativity for Mercury's perihelion), are such rivals **genuine competitors**, or merely parasitic/notational variants borrowing the successful theory's content?*  
  - **Yes (genuine competitors):** Proceed to Node 2.  
  - **No (parasitic variants):** Underdetermination is not a practical threat.  
    - **Leaf: Contrastive Empiricism (Laudan & Leplin)**  
      *Underdetermination dissolves when considering broader evidence; rivals are not truly equivalent.*  

  ---

  #### **Node 2: Ad Hoc Patches & Confirmation**  
  *Should a deliberately reverse-engineered, ad hoc theory (e.g., adding "Vulcan" to Newtonian gravity) be considered **equally confirmed** by the evidence as a non-ad hoc theory?*  
  - **Yes (equally confirmed):** Underdetermination applies to confirmation. Proceed to Node 3.  
  - **No (not equally confirmed):** Non-empirical factors break underdetermination at confirmation. Proceed to Node 3.  

  ---

  #### **Node 3: Simplicity & Truth**  
  *When infinitely many curves fit finite data points, we prefer simplicity (e.g., a straight line). Is this preference a **belief about the world** (simplicity tracks truth) or a **pragmatic convenience**?*  
  - **Truth indicator:** Non-empirical virtues reveal reality. Proceed to Node 4.  
  - **Pragmatic convenience:** Virtues are tools, not truth-trackers. Proceed to Node 4.  

  ---

  #### **Node 4: Aim of Science**  
  *Is science's aim **truth about unobservables** (e.g., electrons, spacetime) or **empirical adequacy** (saving phenomena)?*  
  - **Truth:** Proceed to Node 5.  
  - **Empirical adequacy:**  
    - *If from Node 1 (historical rivals = genuine):*  
      - **Leaf: Constructive Empiricism (van Fraassen)**  
        *Science aims only to match observations; belief in unobservables is unwarranted.*  
    - *If from Node 1 (historical rivals = parasitic):*  
      - **Leaf: Duhemian Holism**  
        *Testing is holistic; theories are instruments for prediction, not truth.*  

  ---

  #### **Node 5: Pessimistic Induction**  
  *Does the history of science (e.g., phlogiston, ether theories turning out false) show that **current successful theories are likely false**?*  
  - **Yes:** Proceed to Node 5a.  
  - **No:**  
    - **Leaf: No-Miracles Realism**  
      *Science’s success would be a miracle if theories were not approximately true.*  

  ---

  #### **Node 5a: Preserved Elements**  
  *If current theories are false, what aspects **survive theory change** and can be trusted?*  
  - **Mathematical structure:**  
    - **Leaf: Structural Realism (Worrall)**  
      *Only the structure (equations, relations) of theories is preserved and true.*  
  - **Causal properties of entities:**  
    - **Leaf: Entity Realism (Hacking)**  
      *We can trust entities we manipulate (e.g., electrons), but not theories about them.*  

  ---

  ### Special Paths & Unoccupied Corners  
  - **Quinean Pragmatism:**  
    - *Reached via:* Node 1 (genuine rivals) → Node 3 (pragmatic) → Node 4 (truth).  
    - **Leaf: Quinean Pragmatism**  
      *Theories are chosen pragmatically; "truth" is immanent within our web of belief.*  

  - **Empty Corner:**  
    - *Denies genuine rivals (Node 1 = No) but accepts pessimistic induction (Node 5 = Yes).*  
      → **Coherent but unexplored:** Fallibilist realism (truth-aimed but cautious).  

  ---

  ### Ambiguous Leaves & Further Questions  
  1. **Structural Realism vs. Constructive Empiricism:**  
     - Ambiguous if Node 4 (aim of science) is bypassed.  
     - **Separating question (at Node 4):** *"Must a theory’s *structure* be *true* (not just empirically adequate) to explain its success?"*  
       - Yes → Structural Realism.  
       - No → Constructive Empiricism.  

  2. **Entity Realism vs. No-Miracles Realism:**  
     - Ambiguous if Node 5 (pessimistic induction) is unanswered.  
     - **Separating question (at Node 5):** *"Does history undermine *all* truth claims about unobservables, or just specific theories?"*  
       - Undermines all → Entity Realism (trust entities, not theories).  
       - Does not undermine → No-Miracles Realism (trust theories).  

  ---

  ### Excluded Topics  
  ⚠️ **Theory-ladenness** (observations shaped by theory) and **Kuhnian incommensurability** (theories incomparable) are **not part of this tree**. This handout focuses *only* on underdetermination of theory by evidence.  

  ---
  **Purpose:** Arrive at a position by answering concrete questions, not by choosing labels. Use historical cases and avoid abstract possibilities.
