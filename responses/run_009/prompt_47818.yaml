answer: |-
  That's an excellent critical reading of the podcast summary – your scientific instincts about the potential glossing-over of the is/ought gap and the role of coherence are spot on. Quine *was* far more careful than that summary suggests, and while the host captures *elements* of his view, there are significant conflations and misunderstandings, particularly regarding "moral naturalism" and the "taste" analogy. Let's break it down piece by piece, referencing primarily "On the Nature of Moral Values" (1978, reprinted in *Theories and Things*, 1981):

  1.  **"Ethics is simply a branch of psychology."**
      *   **Quine's View (Mostly Agrees, but Broader):** Quine *did* see the *scientific study* of ethics (metaethics and descriptive ethics) as falling within the purview of empirical science, primarily psychology, but also sociology and anthropology. He writes: "Moral values... find their place within natural science as a subject of study for the psychologist and social scientist." He wasn't necessarily saying *normative ethics itself* (prescribing what *ought* to be valued) *is* psychology, but that *understanding* ethics scientifically *is* a psychological/social scientific endeavor. So, the *subject matter* of ethics (human valuing behavior) is natural, and the *study* of it is scientific. He'd agree the *phenomenon* of ethics is part of psychology.

  2.  **"Moral claims are empirical claims about what people do value and why..."**
      *   **Quine's View (Agrees for *Descriptive* Claims, Disagrees for *Normative* Claims):** This is the core conflation. Quine *distinguished* between:
          *   **Descriptive Moral Claims:** "The Nuer value cattle highly." "Capital punishment deters crime." These *are* straightforward empirical claims about human attitudes, behaviors, and consequences, resolvable by psychology, sociology, criminology, etc. Quine absolutely endorsed this.
          *   **Normative Moral Claims:** "Capital punishment is wrong." "Cattle *should* be valued highly." Here, Quine parted ways with standard moral naturalism. He argued these statements *express* the speaker's values or attitudes; they are not primarily *asserting* factual propositions that could be empirically confirmed or falsified like "water is H₂O". They are more like commands or expressions of preference ("Boo to capital punishment!"). While grounded *in* natural psychological states (our approvals/disapprovals), the *meaning* and *function* of the normative claim itself isn't a straightforward empirical claim *about* those states.

  3.  **"...once psychology and neuroscience are mature enough, moral questions can in principle be settled scientifically. When two people disagree about, say, capital punishment, that's really just a disagreement about psychological facts..."**
      *   **Quine's View (Agrees for *Many* Disagreements, Disagrees for *Fundamental* Value Conflicts):** Quine thought *most* moral disagreements *are*, indeed, rooted in disagreements about empirical facts. If two people agree that deterrence is the primary value in criminal justice but disagree on whether capital punishment deters, then science *can* settle it (in principle). Similarly, disagreements often stem from differing factual beliefs about consequences, human nature, or even the definition of terms. Science *can* dissolve these.
      *   **However:** Quine acknowledged a crucial residue. If two people agree *completely* on all the non-moral facts (e.g., deterrence rates, suffering involved, costs) and *still* disagree – one valuing retribution above all else, the other valuing rehabilitation above all else – *then* science cannot settle *that* fundamental clash of ultimate values. At *this* level, the disagreement is not about psychological facts *anymore* (both acknowledge the *existence* of the other's preference); it's a clash of irreducible, basic attitudes. This is where the "taste" analogy comes in.

  4.  **"The only residue Quine allowed for was taste: choosing between basic systems of values is, in the end, like preferring one cuisine to another."**
      *   **Quine's View (Yes, This is Essentially His Position):** This is directly from Quine. He writes: "The status of values... remains... the status of matters of taste... When someone disagrees with me on a moral issue, I... try to root out... some conflicting nonmoral belief... But if... all such conflicts are resolved, then... our residual disagreement is reckoned a difference... in basic values... [which] puts the disagreement in a status... similar... to... a difference... over whether oysters or clams are better." He explicitly uses the "cuisine" analogy. This "taste" residue arises precisely because normative claims express fundamental attitudes, not empirically verifiable propositions. Science studies *why* we have these tastes (psychology), but cannot *justify* one basic taste over another.

  5.  **"So ethics gets 'naturalized' in exactly the same way Quine naturalized epistemology..."**
      *   **Quine's View (Agrees on the *Project*, but the *Parallel* is Complex):** Quine *did* intend to naturalize ethics similarly to epistemology. Both involve studying a human phenomenon (knowing/valuing) using the methods of science (psychology/neuroscience/social science) rather than seeking a prioristic foundations. He writes: "The naturalism... that sees natural science as... the domain of truth... welcomes also the... naturalistic study of... moral judgments." The *approach* – bringing the subject under the scientific tent as an object of study – is parallel. However, the *outcomes* differ due to the nature of the phenomena. Epistemology studies a cognitive process aimed at truth (correspondence/reliability), which science *can* investigate normatively to some extent (e.g., reliable methods). Ethics studies attitudes/behaviors expressing preferences ("tastes"), where the normative force is fundamentally different and irreducible at the basic level.

  6.  **"...and this makes him a moral naturalist in the standard metaethical sense — moral facts are natural facts, discoverable by the same methods..."**
      *   **Conflation & Crucial Distinction:** **This is the most significant error in the summary.** The host conflates two distinct things:
          *   **Naturalizing the *Study* of Ethics (What Quine Did):** Treating ethics *as a phenomenon* to be investigated scientifically. This is descriptive and metaethical.
          *   **Moral Naturalism (Standard Metaethical Doctrine):** The view that *moral properties/facts themselves* (e.g., goodness, wrongness) *are identical to* natural properties/facts (e.g., psychological states, biological functions, social structures) and are therefore discoverable empirically. This is a *normative* ontological claim.
      *   **Quine's Actual Position:** Quine was doing the *first* (naturalizing the study). However, his view of *normative* claims as expressions of fundamental attitudes ("tastes") places him closer to **Non-Cognitivism or Projectivism** in standard metaethics. He explicitly *denied* that normative statements like "Capital punishment is wrong" express propositions with truth-values in the same way empirical statements do. They don't *correspond* to observer-independent natural facts; they *project* our attitudes onto the world. While the *attitudes themselves* are natural facts (psychology), the *moral wrongness* isn't an *additional* natural fact *out there* that science discovers; it *is* (or expresses) the attitude. Science discovers *that* we have these attitudes and *why*, but not *that* capital punishment *is* wrong *as a natural fact independent of our attitudes*. He writes: "The truth predicate... is at home... primarily in... natural science... Moral... judgments... do not... qualify."
      *   **Conclusion:** Quine **was not a standard Moral Naturalist.** He naturalized the *inquiry* into ethics but rejected the core ontological claim of moral naturalism – that moral *properties/facts* are straightforwardly natural properties/facts discoverable by science *as such*. His "taste" residue for fundamental values is incompatible with standard moral naturalism, which aims to reduce *all* moral facts to natural facts.

  **Addressing Your Specific Points:**

  *   **Is/Ought Gap:** Quine *did* slide past it in the sense that he thought science could dissolve *many* apparent moral disagreements by revealing factual errors. However, he *explicitly acknowledged* the gap for fundamental value conflicts ("taste"), where science cannot tell you what you *ought* to value ultimately. His naturalism applies to the *explanation* of valuing, not necessarily the *justification* of ultimate values.
  *   **Coherence vs. Correspondence:** You're absolutely right. Quine stated this directly: "The... moralist... can... work within his... system... testing... internal consistency... and testing... implications... against... moral intuitions... But... he makes no... claim to... correspondence... beyond the... coherence of his system." Science relies on correspondence (sensory input) *and* coherence. Ethics, for Quine, relies *only* on coherence (internal consistency, compatibility with other beliefs, perhaps pragmatic considerations) when dealing with fundamental norms. This is a *huge* difference he emphasized, which the podcast summary ignored.
  *   **Trusting the Podcast:** The podcast captured Quine's *naturalistic impulse* and his belief that science resolves *many* ethical disagreements. It correctly noted the "taste" residue. **However, it seriously misrepresented his metaethical stance by conflating naturalizing the *study* of ethics with standard Moral Naturalism and by glossing over his crucial distinction between descriptive/normative claims and the coherence/correspondence point.** Use it cautiously. It might be good for broad strokes and motivation, but double-check its characterizations of technical philosophical positions, especially in metaethics, against primary sources or more rigorous secondary literature. Your skepticism about the "natural facts" claim was well-founded.

  **In essence:** Quine turned the scientific lens *onto* ethics as a human phenomenon, dissolving many disagreements through empirical facts, but left a core of irreducible "taste" for fundamental values, rejecting the idea that *normative* moral claims correspond to natural facts in a way that makes them straightforwardly scientifically discoverable truths. He naturalized ethics as a *subject*, not as a source of natural moral *facts*.
