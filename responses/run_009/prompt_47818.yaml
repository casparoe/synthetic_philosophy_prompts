  The host says ethics is a branch of psychology. Quine did see it as part of empirical science, but not just psychology—sociology, anthropology too. He focused on studying moral behavior and values as natural phenomena. But did he reduce moral claims to psychological facts? Quine thought moral judgments express values, which are psychological states. So disagreements might stem from differing psychologies, but resolving them isn't straightforward. The user mentioned the is/ought gap. Quine acknowledged this; he didn't think science could derive values from facts. Instead, science studies why people have certain values.

  The "taste" analogy: Quine did use the cuisine comparison, but only for fundamental value conflicts. He thought most disputes are about factual beliefs, but if two people agree on facts and still disagree, it's like preferring different foods. However, he wasn't saying all morality is subjective taste. His point was limited to irreducible conflicts.

  Now, moral naturalism in metaethics usually claims moral facts are natural facts, like psychological or biological states. Quine's approach is naturalistic but not in the same way. He naturalized the study of ethics—making it scientific—but avoided asserting moral facts. He's more of a non-cognitivist or projectivist, seeing moral statements as expressions of attitude, not truth-apt. So he's not a standard moral naturalist. The host conflated naturalizing the field with moral naturalism as a metaethical stance.

