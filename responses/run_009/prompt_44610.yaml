prompt: |-
  I'm an acquisitions editor at a mid-sized trade publisher, and I'm realizing most of my job is just reading other people's decisions. I see which manuscripts went to auction and who dropped out at what number, I hear at lunch which imprints passed and for what reason (usually "didn't fall in love" which tells me nothing), and my agents are constantly telling me a book is "hot" — which mostly means other editors are saying it's hot. Somewhere in my head I know the herd is partially rational: if three smart houses are bidding, that's real information, those people read the thing and put money down. But it's also exactly how information cascades work, right? The fourth and fifth bidder aren't adding information, they're just copying, and eventually nobody in the chain is looking at the actual manuscript. And cascades are supposed to be fragile and path-dependent — which means the book everyone passed on might just have been unlucky with the first two readers.

  So: I want a decision procedure I can actually run in the twenty minutes between getting the submission and my editorial meeting, for how much weight to give the herd versus my own read. It should be grounded in what the actual cascade/herding literature says — rational herding, why cascades form even when everyone is behaving sensibly, the fact that early movers don't internalize what their choice reveals to later movers, cascade fragility, stuff like that — but translated into publishing, not economics-journal language. The questions in order, what counts as a real signal versus noise (e.g., does it matter that the passes came before or after Frankfurt? does a pass from a house with a strong list in that genre count differently?), where the procedure should tell me to stop and just go with my gut because it's a values call, and where it should force me to do the thing my gut won't like.

  Then run it on three cases. First: a literary novel that five big houses passed on but that two of my most trusted colleagues at other imprints flagged as "the best thing I read this year and I couldn't get my pub board to move" — do I want it, and what does the herd's no actually tell me? Second: a commercial thriller going to auction where two houses known for publishing exactly this stuff are already in at six figures — does my wanting it mean anything at all, or am I just bidder number three in a textbook cascade? Third: my own strong conviction case, a weird book I love that nobody else has mentioned, where the procedure should probably tell me something uncomfortable about how much my private signal is worth when nobody else is corroborating it.

  Also be honest about what the procedure can't do — like, I assume it can't tell me whether the first movers were right, only how much their choices reveal — and flag the steps that are judgment calls dressed up as questions. And if there's a place where what the herding literature recommends is genuinely in tension with how publishing actually has to work (we can't wait for more information, auctions have deadlines), say that too rather than pretending the theory just slots in.
reasoning: |-
  Hmm, this is a fascinating and complex problem from an acquisitions editor in trade publishing. They're grappling with how much weight to give industry signals versus their own judgment when evaluating manuscripts, framed through the lens of information cascade theory. 

  The editor clearly understands economic concepts like rational herding and cascade fragility but needs them translated into practical publishing decisions. They're frustrated by vague industry feedback ("didn't fall in love") and aware that "hot" books might just be herd behavior. The core tension is between respecting collective wisdom vs avoiding cascade failures where good books get rejected early.

  Key aspects of their request:
  1) They want a concrete 20-min decision procedure grounded in cascade literature
  2) Need differentiation between strong vs weak signals (e.g., genre-specialist passes)
  3) Must handle three specific cases: a passed-on literary gem, a commercial auction, and a weird passion project
  4) Should acknowledge theoretical limitations (e.g., can't wait for more data)

  The editor's self-awareness is impressive - they recognize their own position as a potential "later mover" in cascades and want safeguards against both FOMO and overconfidence. Their examples perfectly illustrate publishing's cascade vulnerabilities: the literary novel where early rejections might have doomed it despite late champions, the auction where they'd be joining mid-cascade, and the passion project where they might overweight their private signal.

  For the procedure design, I should consider:
  - Signal strength hierarchy: A pass from a genre specialist > generalist imprint
  - Timing effects: Pre/post book fair signals may differ in reliability
  - Cascade thresholds: When does N number of passes/rejections become statistically meaningful?
  - Positional awareness: Their place in the sequence matters (early vs late mover)
  - Private signal calibration: How to weigh personal love for a manuscript against consensus

  The three test cases will really stress-test the framework. For the literary novel, we'll need to discount the early passes while valuing the colleagues' signals. For the auction, we must distinguish between genuine value and cascade inflation. And for the passion project, we'll have to confront the uncomfortable truth that isolated strong convictions often fail.

  Important limitations to flag: Publishing's compressed timelines prevent waiting for more signals, and auctions force decisions with incomplete information. Also, many "signals" in publishing are actually noise when examined closely (like vague passes).

  The framework should force explicit acknowledgment of judgment calls - like how much weight to give "trusted colleagues" - rather than pretending this is purely mechanical. And it must deliver uncomfortable truths, especially about overvalued private signals when they lack corroboration.
answer: |-
  Below is a decision procedure grounded in rational herding theory, tailored for publishing acquisitions. It follows a flowchart-like logic (designed for ~20 min runtime) with explicit thresholds, signal-weighting rules, and acknowledgment of publishing constraints. The framework treats **"the herd" as Bayesian evidence** – not a verdict – and forces you to quantify *how much* herd signals should update your prior (your own read).  

  ---

  ### **The Cascade-Adjusted Acquisitions Framework**  
  **Core Principle:** *Your private assessment is a signal. The herd’s actions are signals. Weigh them by reliability, not volume.*  

  #### **Step 1: Classify the Herd Signal**  
  Ask: **"What’s the *sequence* and *quality* of the herd’s actions?"**  
  - **Key Inputs:**  
    - **Timing:** Passes/bids pre-Frankfurt? Post-auction? (Early signals are more informative; later ones may be cascades).  
    - **Actor Quality:** Did a *genre-specialist* pass/bid? (A pass from a thriller powerhouse > pass from a literary imprint).  
    - **Action Specificity:** Vague pass ("didn’t love") vs. specific rejection ("pacing issues in Act 2").  
    - **Bid Visibility:** Are bids public/leaked? (Public bids amplify cascades).  

  **Decision Rules:**  
  | Signal Type                | Weight Adjustment                                  | Rationale                                                                 |  
  |----------------------------|---------------------------------------------------|---------------------------------------------------------------------------|  
  | **Early Pass (1st-3rd reader)** | High weight IF from a specialist imprint          | Early specialists have strong private signals; their pass reveals real risk. |  
  | **Late Pass (>3rd reader)**    | Low weight (suspect cascade)                      | Later passes may be following early trend.                                |  
  | **Specialist Bid**             | Very high weight (strong corroboration)           | Niche expertise = reliable signal.                                        |  
  | **Generalist Bid**             | Moderate weight (but check for clustering)        | 2+ generalists bidding? Increases reliability. Solo? Could be noise.      |  
  | **Vague Pass**                 | Near-zero weight                                  | "Didn’t love" = no information. Ignore.                                   |  
  | **Specific Pass Reason**       | High weight IF aligns with your concerns          | Validates your private signal.                                            |  

  > *Judgment Call Alert:* Classifying "specialist" requires your knowledge of imprint strengths.  

  #### **Step 2: Calculate Your Herd-Adjusted Prior**  
  Use: **"Cascade Discount Factor"** for herd signals.  
  - If **>2 passes/bids from non-specialists** *after* a specialist’s decision: Apply **50% discount** to herd weight.  
    - *Why?* Cascade theory shows latecomers overweight early signals.  
  - If **multiple specialists disagree** (e.g., 1 bids, 2 pass): Herd signal **cancels out**. Trust your read + specifics.  

  **Formula:**  
  `Your Final Probability (YFP) = [Your Private Signal Strength (1-10)] + [Herd Signal Weight (-5 to +5)]`  
  - **YFP ≥ 12:** Strong buy (overrides herd skepticism)  
  - **YFP 8-11:** Weak buy (needs mitigating factors)  
  - **YFP ≤ 7:** Pass unless exceptional  

  > *Constraint Note:* Auctions force speed. If herd signals are ambiguous (e.g., vague passes), default to your private signal.  

  #### **Step 3: Override Triggers**  
  **Stop and go with GUT when:**  
  - Herd signals are **contradictory** (e.g., trusted colleagues rave + 5 vague passes).  
  - The book **defies genre** (cascade models fail for outliers).  
  - Your private signal is **extreme** (love/hate).  

  **Force action against GUT when:**  
  - You’re **bidder #3+** in an auction with **no specialist bids**. (High cascade risk).  
  - Your private signal is **neutral** (5/10) but herd is **strongly negative** from specialists.  

  ---

  ### **Applied to Your Cases**  
  #### **Case 1: Literary Novel (5 passes, 2 trusted colleagues rave)**  
  - **Step 1:**  
    - 5 vague passes (late, low weight).  
    - 2 strong positive signals from trusted specialists (high weight).  
    - Herd Signal Weight = **+3** (colleagues) **-1** (noise passes) = **+2**.  
  - **Step 2:**  
    - Assume your read is **8/10**. YFP = 8 + 2 = **10** (Weak buy).  
    - *Cascade Discount:* Early passes? If first 2 were non-specialists, later passes are discounted.  
  - **Verdict:** **BUY.** The herd’s "no" is low-quality info. Trust colleagues + your read.  

  #### **Case 2: Commercial Thriller Auction (2 genre-specialists in at 6 figures)**  
  - **Step 1:**  
    - 2 specialist bids (very high weight: **+4**).  
    - "Hot" gossip (low weight: +0.5).  
    - Herd Signal Weight = **+4.5**.  
  - **Step 2:**  
    - Your read is **7/10**. YFP = 7 + 4.5 = **11.5** (Strong buy).  
    - **BUT:** You’re bidder #3. Cascade Discount applies (50% herd weight). Adjusted YFP = 7 + 2.25 = **9.25** (Weak buy).  
  - **Override Trigger:** Force against gut? **YES.** If your read was ≤6/10, PASS (cascade risk). At 7/10, bid cautiously.  
  - **Verdict:** **BID, but cap your offer.** Don’t chase. You’re likely in a cascade.  

  #### **Case 3: Weird Book You Love (No herd signals)**  
  - **Step 1:**  
    - No herd signals = **0 weight**.  
  - **Step 2:**  
    - Your read: **9/10**. YFP = 9 + 0 = **9** (Weak buy).  
  - **Uncomfortable Truth:** Herding literature shows *isolated strong signals are often overconfidence*. Without corroboration, your 9/10 may be worth 6/10 in reality.  
  - **Override Trigger:** Gut says "love it," but procedure says: **"Requires external validation."**  
    - *Action:* Share with 1 trusted reader *fast*. If they agree, YFP jumps to 11+. If not, YFP drops to 6.  
  - **Verdict:** **Don’t acquire solo.** Find 1 ally first.  

  ---

  ### **What the Framework CAN’T Do**  
  1. **Predict if the herd was "right"** – Only assesses *how much information* their actions reveal.  
  2. **Eliminate path-dependence** – A book rejected by the first 2 editors may be doomed, regardless of merit.  
  3. **Value "gut love" quantitatively** – It forces you to test it against external signals.  
  4. **Fix broken markets** – If all editors cascade, good books *will* be missed.  

  ### **Tensions with Publishing Reality**  
  - **"We can’t wait for more signals!"** → The framework shortcuts this by weighting *existing* signals rigorously.  
  - **"Auctions force rushed bids!"** → The "Cascade Discount" directly counters auction FOMO. Cap bids as bidder #3+.  
  - **"Editors don’t give specific feedback!"** → Treat vague passes as **0 information**. Stop wasting mental energy.  

  **Final Note:** This system’s power is in **forcing you to articulate why you’re overriding the herd** – or why you’re following it. The math is just scaffolding for clearer thinking. When in doubt, prioritize **specialist signals** and **your extreme convictions (1/10 or 10/10)**. Everything else is probabilistic guesswork.
