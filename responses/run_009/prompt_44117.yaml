prompt: |-
  I've recently been made head of analytics at a regional hospital network, and I keep landing in the same argument with our chief medical officer. The question is which number the executive committee should act on: the network-wide figure — readmission rates, mortality for a procedure, patient satisfaction — or the same data partitioned by ward, by case severity, by demographic. Twice now the aggregate and the breakdown have pointed in opposite directions, and each time the debate gets resolved by whoever argues loudest rather than by any principle. Please write me a decision procedure my team can actually run on a report before it goes upstairs: the questions to ask in order, what counts as a sufficient answer to each, where the procedure terminates in "report the aggregate," where in "report the breakdown," and where it must flag that the choice is not statistical at all — that whether the partitioning variable is a confounder, a mediator, or merely a descriptor of no causal relevance is doing all the work, and that someone with substantive clinical judgment has to make the call. Two constraints: it has to be runnable in under an hour by analysts whose causal-inference training amounts to a half-day briefing (so no formal causal graphs, though plain-language versions of the reasoning behind them are fine), and it must include a step for what to do when the partition was chosen after seeing the data, since an analyst who slices enough ways can reverse almost anything. Then run it on two real-feeling cases for me: one where the aggregate makes our flagship cardiac unit look better than the regional average but severity-stratified figures make it look worse, and one where a hand-hygiene initiative shows a clear effect network-wide but no effect within any single ward — and make at least one of the two come out in a direction I won't like. Finish by telling me where the procedure is most likely to misfire and give us the wrong number in front of the committee.
reasoning: |-
  We are creating a decision procedure for when to report an aggregate figure versus a breakdown (partitioned data) in hospital analytics reports.

   The key steps:

   1. **Define the Question**: What is the exact metric and the decision context? (e.g., readmission rates, mortality, patient satisfaction)

   2. **Check for Pre-Specification**: Was the partitioning variable chosen before seeing the data? If not, flag the potential for data dredging and require a pre-specified plan for future reports. However, for the current report, we must proceed with caution.

   3. **Assess Clinical Relevance**: Is the partitioning variable (e.g., ward, severity, demographic) known to be clinically relevant? (e.g., severity of illness is known to affect outcomes) This can be based on established clinical knowledge.

   4. **Assess Discrepancy Direction**:
      - If the aggregate and breakdown tell the same story (both show improvement, both show deterioration, or both are neutral), then report the aggregate (unless there's a specific reason to report the breakdown, such as for understanding heterogeneity). The aggregate is simpler and less prone to misinterpretation.
      - If they point in opposite directions (e.g., aggregate shows improvement but breakdown shows no improvement or worsening in all subgroups, or vice versa), then we must investigate further.

   5. **Check for Simpson's Paradox**: When the aggregate and breakdown conflict, we must determine if the partitioning variable is a confounder, a mediator, or just a descriptor.

      - **Confounder**: A variable that influences both the treatment/exposure and the outcome. If the partitioning variable is a confounder, then the breakdown (stratified analysis) is more valid and should be reported.

      - **Mediator**: A variable on the causal pathway between the exposure and the outcome. If the partitioning variable is a mediator, then the aggregate effect (which includes the indirect effect) may be of primary interest, unless we are trying to understand mechanisms.

      - **Descriptor**: A variable that is not causally related to the outcome and not a confounder or mediator. If the partitioning variable is just a descriptor, then the aggregate is likely the right one.

   6. **Causal Structure Assessment (in plain language)**:
      - Ask: "Is the partitioning variable a risk factor for the outcome?" (If yes, it might be a confounder.)
      - Ask: "Does the partitioning variable come after the exposure (or intervention) in time and is it affected by the exposure?" (If yes, it might be a mediator.)
      - Ask: "Is the partitioning variable associated with the exposure (or intervention)?" (If yes, and it's a risk factor, then it's a confounder.)

      Without formal graphs, we can use:

          - Confounder: Must be associated with the exposure and must be a risk factor for the outcome (and not be a consequence of the exposure).
          - Mediator: Is caused by the exposure and in turn causes the outcome.

      If the partitioning variable is a confounder, then the breakdown (stratified) is the unbiased estimate. If it's a mediator, then the aggregate effect (total effect) is usually what we want for decision-making (unless we are interested in direct effects). If it's just a descriptor (e.g., hospital ward when the intervention is applied uniformly and wards are not associated with the outcome except through the intervention), then the aggregate might be preferred.

   7. **Check for Effect Heterogeneity**: Even if the partitioning variable is not a confounder, if the effect varies substantially across groups (e.g., the intervention works in one ward but not in another) then the breakdown may be important for operational decisions.

   8. **Decision Points**:

      Step 1: If the partitioning was not pre-specified, flag it and note that the result may be due to chance. If the partitioning was post-hoc, then the result should be interpreted as exploratory and requires confirmation. The report should include both aggregate and breakdown but with a caution.

      Step 2: If aggregate and breakdown are consistent, report aggregate (unless there is a specific request for breakdown).

      Step 3: If they are inconsistent:

          a. Check if the partitioning variable is a confounder (using the questions above). If yes, then the breakdown is more valid and should be the primary report.

          b. If the partitioning variable is a mediator, then the aggregate (total effect) is usually the primary effect of interest for overall decision-making. However, we might also report the breakdown to explain the mechanism.

          c. If the partitioning variable is neither (just a descriptor) and there's no effect heterogeneity, then the aggregate is preferred.

          d. If there is effect heterogeneity (even if the variable is not a confounder) and it is of operational importance (e.g., the initiative works in some wards but not others), then the breakdown may be necessary.

   9. **When to Involve Clinical Judgment**: 
      - If the causal role of the partitioning variable is unclear (confounder vs. mediator vs. neither) or if there is disagreement, then we must flag that the choice is not purely statistical and requires substantive clinical judgment.

   10. **Final Output**:
       - Report the aggregate when:
           * The breakdown and aggregate are consistent, OR
           * The partitioning variable is a mediator and we are interested in the total effect, OR
           * The partitioning variable is a descriptor and there is no meaningful heterogeneity.

       - Report the breakdown when:
           * The partitioning variable is a confounder, OR
           * There is significant effect heterogeneity that is operationally important, OR
           * The partitioning variable is a mediator but we are specifically interested in direct effects (which is less common for executive decisions).

       - Flag for clinical judgment when:
           * The causal role of the partitioning variable is ambiguous.

   The Procedure:

    1. **Question Specification**: What is the metric and the partitioning variable?
    2. **Pre-specification Check**: Was the partition pre-specified? If not, note the exploratory nature and the risk of data dredging. Proceed but with caution.
    3. **Consistency Check**: Do aggregate and breakdown tell the same story? (e.g., both show improvement, both show deterioration, or both are neutral) If yes, then report the aggregate and note that the breakdown is consistent. (Stop here for consistency.)
    4. **If Inconsistent**:
          a. **Clinical Relevance**: Is the partitioning variable clinically relevant? (e.g., severity is relevant for mortality) If not, then the aggregate is preferred (unless there is effect heterogeneity). But note: even if not clinically relevant, if it's a confounder, we must adjust.
          b. **Causal Role Assessment**:
              - Is the partitioning variable a risk factor for the outcome? (If yes, it might be a confounder.)
              - Is the partitioning variable associated with the exposure? (If yes and it's a risk factor, then it's a confounder.)
              - Is the partitioning variable on the causal pathway? (If yes, then it might be a mediator.)

          c. **Conclusion from Causal Role**:
              - Confounder: Breakdown is the primary.
              - Mediator: Aggregate is primary (unless we want direct effects, but that's unusual for executive decisions).
              - Neither (and no effect heterogeneity): Aggregate is primary.
              - Neither but with effect heterogeneity: Breakdown may be needed for operational decisions.

          d. **Effect Heterogeneity**: Even if the variable is not a confounder, if the effect varies substantially (e.g., the initiative works in one ward but not in another) then the breakdown is important.

    5. **Decision**:
          - If the partitioning variable is a confounder: Report the breakdown.
          - If the partitioning variable is a mediator: Report the aggregate (and note the breakdown for mechanism).
          - If the partitioning variable is neither and there is no substantial heterogeneity: Report the aggregate.
          - If there is substantial heterogeneity: Report the breakdown and the aggregate, but note the heterogeneity and let the committee decide which is more important for action.

    6. **Flag for Clinical Judgment**: If the causal role is unclear (e.g., we can't determine if it's a confounder or mediator) then we must flag that the choice is substantive and requires clinical input.

   Now, let's run two cases:

   **Case 1: Cardiac Unit Mortality**

   - **Context**: Our flagship cardiac unit has a 30-day mortality rate of 3.5%, which is lower than the regional average of 4.2%. However, when stratified by severity (low, medium, high), the unit has higher mortality in each severity group compared to the regional averages in the same severity groups.

   - **Aggregate**: Unit looks better (3.5% vs 4.2%).
   - **Breakdown**: Within each severity group, the unit has worse mortality.

   - **Pre-specification**: Severity stratification is pre-specified because severity is a known risk factor.

   - **Causal Role**:
       - Severity is a known risk factor for mortality (yes, clinically established).
       - Is severity associated with the exposure (being treated at the flagship unit)? It might be: perhaps the flagship unit gets more severe cases? We don't have data on case mix, but let's assume we have data that shows the flagship unit does get a higher proportion of severe cases.

       Therefore, severity is a confounder: it affects both the outcome (mortality) and the exposure (which hospital you go to). The breakdown (stratified by severity) is the unbiased comparison.

   - **Decision**: Report the breakdown. The aggregate is misleading because of confounding by severity.

   - **Result**: We report the breakdown, which shows that the flagship unit is underperforming in each severity group. This is the direction you won't like.

   **Case 2: Hand-Hygiene Initiative**

   - **Context**: A hand-hygiene initiative is rolled out network-wide. The aggregate data shows a clear reduction in hospital-acquired infections (HAI) after the initiative. However, when broken down by ward (e.g., ICU, surgical, medical), no single ward shows a statistically significant reduction (though all show a non-significant reduction in the same direction as the aggregate).

   - **Aggregate**: Network-wide reduction in HAI (significant).
   - **Breakdown**: No ward individually shows a significant reduction.

   - **Pre-specification**: Wards were pre-specified because the initiative was implemented uniformly but it was expected that the effect might vary by ward (e.g., due to different baseline infection rates).

   - **Causal Role**:
       - Ward: Is ward a risk factor for HAI? Yes, because some wards (like ICU) have higher infection rates.
       - Is ward associated with the exposure (hand-hygiene initiative)? The initiative was rolled out network-wide, so in theory, it's not associated with ward. However, the implementation might have been better in some wards? We don't have data on that. But note: the exposure (initiative) is at the network level, not varying by ward. Therefore, ward is not a confounder because the exposure is the same for all wards (no association between ward and exposure).

       What is the role of ward? It might be an effect modifier: the initiative might have a similar relative effect in each ward, but because baseline rates are different, the absolute effect might vary. But note: the breakdown shows no significant effect in any ward individually, but the aggregate does. This is a case of low power in each ward. Because the sample size in each ward is smaller, the effect in each ward is not statistically significant, but when combined, the effect becomes significant.

   - **Effect Heterogeneity**: The breakdown does not show a significant effect in any ward, but the effects are in the same direction. There is no evidence of heterogeneity.

   - **Decision**: The aggregate is the primary result because:
          * The breakdown is consistent in direction and there's no evidence of heterogeneity.
          * The partitioning variable (ward) is not a confounder (since the exposure is network-wide and not associated with ward).
          * The aggregate has more power and shows a significant effect.

       However, we should note that the individual ward results are underpowered. We might also consider that the initiative was implemented network-wide and the effect is expected to be network-wide.

   - **Result**: Report the aggregate.

   **Where the procedure is most likely to misfire**:

   1. **Misclassification of the causal role**: Without formal causal graphs, we may misclassify a variable (e.g., thinking a mediator is a confounder). For example, if we have an intervention that affects a mediator which then affects the outcome, and we adjust for the mediator (by stratifying), we might block the effect of the intervention and get a biased estimate of the total effect.

   2. **Insufficient data on associations**: We may not know if the partitioning variable is associated with the exposure. We have to rely on existing data or expert knowledge, which might be incomplete.

   3. **Post-hoc partitioning**: If the partitioning was done after seeing the data (data dredging), we might be fooled by chance. The procedure flags this, but if we proceed anyway, we might make an incorrect decision.

   4. **Effect heterogeneity without operational relevance**: The procedure might lead to reporting the breakdown when the heterogeneity is statistically significant but not operationally meaningful, causing unnecessary complexity.

   5. **Power issues**: In the hand-hygiene example, the breakdown might not show significance due to low power, but the aggregate does. The procedure might correctly choose the aggregate, but if there is true heterogeneity (e.g., the initiative only works in some wards) we might miss it.

   6. **Complex confounding**: Sometimes a variable might be both a confounder and a mediator, or there might be multiple confounders. Without formal causal inference, we may not capture the full picture.

   The procedure is most likely to fail when the causal structure is complex and requires more advanced modeling (like causal graphs) to disentangle, or when the data is insufficient to determine the associations needed for the causal role assessment. In such cases, the procedure will flag for clinical judgment, but even then, the clinical experts might not agree.

   We must remember that no procedure is foolproof, and continuous education in causal inference for the analysts and close collaboration with clinical experts is essential.
answer: |-
  ### Decision Procedure for Reporting Aggregate vs. Partitioned Data

  This procedure is designed for analysts with basic causal inference knowledge. It should take ≤60 minutes per report. Key principles:  
  - **Aggregate**: Best when partitions don't meaningfully alter conclusions or aren't causal drivers.  
  - **Breakdown**: Required when partitions are confounders or reveal critical heterogeneity.  
  - **Clinical Judgment Flag**: Raised when causal role is ambiguous.  

  **Step-by-Step Procedure**  
  1. **Question Clarification**  
     - *Ask:* "What is the primary decision? (e.g., renew a program, allocate resources)"  
     - *Sufficient Answer:* Clear executive action tied to the metric.  
     - *If Unclear:* Stop. Redefine the question with stakeholders.  

  2. **Pre-Specification Check**  
     - *Ask:* "Was the partitioning variable chosen *before* seeing the data?"  
     - *Yes:* Proceed to Step 3.  
     - *No:* Flag: "Partition post-hoc; risk of data dredging."  
       - *Mitigation:* Run sensitivity analysis (e.g., Bonferroni correction). If results reverse, **report aggregate and note instability**. Else, proceed cautiously.  

  3. **Directional Consistency Check**  
     - *Ask:* "Do aggregate and breakdown tell the same story?"  
       - *Same story:* E.g., both show improvement, deterioration, or neutrality.  
       - *Opposite:* E.g., aggregate improves but all partitions worsen (or vice versa).  
     - *Sufficient Answer:* Quantitative threshold (e.g., effect signs/directions align).  
     - *Consistent:* **Report aggregate** (stop).  
     - *Inconsistent:* Proceed to Step 4.  

  4. **Clinical Relevance Assessment**  
     - *Ask:* "Is the partitioning variable clinically accepted as a risk factor for the outcome?"  
       - *Examples:* Severity for mortality (yes); ward color for infection (no).  
     - *Sufficient Answer:* Literature/guidelines support relevance.  
     - *Not Relevant:* **Report aggregate** (stop).  
     - *Relevant:* Proceed to Step 5.  

  5. **Causal Role Assessment**  
     Use plain-language proxies for confounders/mediators:  
     - *Confounder Check:*  
       - *Ask 1:* "Could the partition variable cause *both* exposure (e.g., treatment) *and* outcome?"  
       - *Ask 2:* "Is it associated with exposure and outcome in our data?"  
       - *Yes to both → Confounder.*  
     - *Mediator Check:*  
       - *Ask:* "Might the partition variable be an *intermediate step* between exposure and outcome?"  
         - *Example:* Hand hygiene (exposure) → nurse compliance (mediator) → infection drop (outcome).  
     - *Descriptor Check:*  
       - *Ask:* "Is the partition merely descriptive (no causal link)?"  
     - *Sufficient Answer:* Consensus using clinical knowledge + data patterns.  
     - *Confounder:* **Report breakdown** (stop).  
     - *Mediator:* **Report aggregate** (stop; mediates are part of total effect).  
     - *Descriptor:* Proceed to Step 6.  

  6. **Effect Heterogeneity Test**  
     - *Ask:* "Does the effect size vary meaningfully across partitions?"  
       - *Threshold:* ≥50% difference in effect size between groups.  
     - *Heterogeneous:* **Report breakdown** (stop; operational insights needed).  
     - *Homogeneous:* **Report aggregate** (stop).  

  7. **Ambiguity Flag**  
     - *If causal role (Step 5) is unclear/unresolved:*  
       - **Flag:** "Choice depends on clinical judgment. Partition may be confounder/mediator."  
       - *Escalate:* To CMO/executive for substantive input.  

  ---

  ### Case Applications

  **Case 1: Cardiac Unit Mortality vs. Regional Average**  
  - **Aggregate:** Unit has lower mortality (3.5% vs. regional 4.2%).  
  - **Breakdown (Severity):** Unit has *higher* mortality in low/medium/high severity vs. regional peers.  
  - **Pre-Specification:** Severity pre-specified (clinical standard).  
  - **Direction:** Inconsistent (aggregate better, breakdown worse).  
  - **Clinical Relevance:** Severity is a risk factor (yes).  
  - **Causal Role:**  
    - Severity causes outcomes? *Yes.*  
    - Severity associated with treatment? *Yes (sicker patients choose flagship unit).*  
    → **Confounder.**  
  - **Decision:** **Report breakdown.** Unit underperforms within severity strata.  
  - **Result:** Unfavorable (flagship unit looks worse).  

  **Case 2: Hand-Hygiene Initiative**  
  - **Aggregate:** 20% infection drop network-wide (significant).  
  - **Breakdown (by Ward):** No ward shows significant reduction (all p>0.05).  
  - **Pre-Specification:** Wards pre-specified (initiative targeted wards).  
  - **Direction:** Inconsistent (aggregate effective, no ward shows effect).  
  - **Clinical Relevance:** Ward affects infection rates? *Yes (ICU vs. outpatient).*  
  - **Causal Role:**  
    - Ward causes hand hygiene? *No (initiative is network-wide).*  
    - Ward causes infections? *Yes (risk varies by ward).*  
    → Not a confounder (no link to exposure). Likely **descriptor.**  
  - **Effect Heterogeneity:** Effects similar across wards (e.g., 15-25% drop).  
  - **Decision:** **Report aggregate.** Ward-level underpowered; total effect is real.  
  - **Result:** Favorable (initiative works).  

  ---

  ### Where the Procedure Misfires  
  **Most Likely Failure: Misclassified Causal Role**  
  - **Scenario:** A variable is mistaken for a descriptor when it's a confounder (or vice versa).  
    - *Example:* Partitioning by "shift" (day/night) for medication errors. If day shifts have more complex patients (unmeasured confounder), breakdowns mislead.  
  - **Why:** Analysts rely on observable associations; unmeasured confounders evade Step 5.  
  - **Mitigation:**  
    1. Include sensitivity analyses for unmeasured confounding.  
    2. Require clinical review for high-stakes decisions.  

  **Other Risks:**  
  - **Step 2 Failure:** Post-hoc partitions not flagged, letting data dredging drive decisions.  
  - **Step 6 Threshold Arbitrariness:** Fixed % effect differences may miss clinically important nuances.  

  **Final Advice:**  
  > "Use this procedure to force structured debate, not as a replacement for expertise. When in doubt, flag for clinical judgment. Track decision outcomes to refine thresholds over time."
