prompt: |-
  I teach an elective on distributive justice in a public policy master's program, and next week I have a single ninety-minute seminar to cover prioritarianism and the leveling-down objection. My students are mostly former economics and government people who arrive as welfare economists: they assume any concern for equality is either disguised diminishing marginal utility of income or a sentimental prejudice, so they will hear the leveling-down objection as the obvious reason to dismiss egalitarianism entirely. Don't explain the material to me; plan how I should explain it. What has to be in place before the objection can register as a problem for one version of egalitarianism rather than as a refutation of all of it, which concrete case should carry the whole discussion and what it must not contain — I suspect it needs to exclude anything like envy, status, or relief at another's misfortune, but give me your reasoning — and the misconceptions they will predictably form, mine being that prioritarianism is just maximin and that priority weights mean the worse off matter more as persons rather than that benefits to them count for more, plus exactly where in the sequence each should be headed off. Tell me also what I should openly decline to cover at this level and say so to them. Finish with one question I could put to the class whose correct answer would show the distinction has actually landed rather than that they've merely learned to say the words telic and deontic, and tell me where your sequencing is most likely to fail — which step you would be least confident survives contact with welfare economists, and what argument or consideration would move you to reorder the sequence. Write in continuous prose only, as in an email: no headings, bullet points, bold text, or tables.
reasoning: |-
  Okay, the user teaches a seminar on distributive justice and needs to structure a 90-minute session on prioritarianism and the leveling-down objection. Their students come from economics and government backgrounds, likely viewing equality concerns as either diminishing marginal utility or sentimentality. The challenge is to prevent them from seeing the leveling-down objection as a wholesale refutation of egalitarianism. 

  First, I need to establish a clear distinction between telic egalitarianism and prioritarianism. The students might conflate all egalitarianism with leveling down, so starting with definitions is crucial. A concrete case is essential here. The user mentioned avoiding envy, status, or schadenfreude, so the example must focus purely on resource distribution without emotional elements. A simple two-person scenario with equal and unequal distributions where both are worse off after leveling down would work. 

  Next, introducing prioritarianism as distinct from both utilitarianism and egalitarianism. The common misconception is that prioritarianism is just maximin or that it values persons more. I should emphasize that prioritarianism weights benefits based on absolute welfare levels, not relative differences or personhood. Using the same two-person case but applying priority weights can illustrate this. 

  The sequencing must first present telic egalitarianism, then the leveling-down objection to show its flaw, then introduce prioritarianism as an alternative. Addressing misconceptions as they arise is key. For instance, when discussing prioritarianism, explicitly state it's not maximin by comparing outcomes where the worst off gains little versus the better off gains more. 

  Where might this fail? Welfare economists might resist the idea that prioritarianism isn't just utilitarianism with different weights. Preemptively contrasting the two—showing that prioritarianism cares about absolute levels, not just marginal utility—is vital. Also, clarifying that weights aren't about moral worth but about the value of benefits at different welfare levels. 

  The user wants a question to test understanding. Asking whether a policy that helps the better off more but has higher total priority-weighted welfare is acceptable under prioritarianism could work. This checks if they grasp that prioritarianism allows unequal benefits if they maximize weighted welfare. 

  Finally, openly skip deontic egalitarianism and other theories to keep focus. The most fragile step is distinguishing prioritarianism from utilitarianism, so reinforcing that priority weights are based on absolute welfare, not marginal utility, is critical.
answer: |-
  Start by explicitly separating the structure of distributive theories from their justifications, because your students will instinctively collapse all concerns into welfare outcomes. Before the leveling-down objection even appears, you must firmly establish that *telic egalitarianism* (the view that equality is intrinsically good, such that a world is better *because* it is more equal) is a distinct, non-utilitarian position. Frame it as: "This view says that even if we hold total welfare constant, a more equal distribution is strictly better than a less equal one, *because* of the equality itself." Use a stark, arithmetically clean case: **Two individuals, A and B, with identical capacities for welfare. Scenario 1: A has 100 units, B has 100. Scenario 2: A has 150, B has 50.** Ask: "Does telic egalitarianism *necessarily* prefer Scenario 1?" Force them to see that for the telic egalitarian, Scenario 1 is better *even if* no one gains utility from equality, there's no envy, and no one cares about status – the sheer fact of equality *makes* it better. This is crucial; the case must exclude any instrumental benefits (like social stability) or psychological states (like envy or schadenfreude relief). Its *only* feature is the equal distribution versus the unequal one.

  Now introduce the leveling-down objection: **Scenario 3: A has 50, B has 50.** Ask: "Compared to Scenario 2 (150/50), is Scenario 3 (50/50) better, worse, or equally good according to telic egalitarianism?" The objection hits: Telic egalitarianism *must* say Scenario 3 is better than Scenario 2 *in at least one respect* (it's more equal), even though *everyone is worse off* than in Scenario 2. This feels repugnant. **Crucially, pause here.** Emphasize that *this objection only refutes telic egalitarianism, not all concern for equality*. The key point to make before moving on is: "The objection shows why making equality an *intrinsic* good leads to this problem. But does this mean we shouldn't care *at all* if the worse off are badly off? Or that we shouldn't care about *relative* positions? Not necessarily. Other views might avoid this."

  This is where prioritarianism enters. Define it clearly: **"Prioritarianism holds that benefiting people matters more the worse off those people are, *in absolute terms* (their absolute welfare level), not relative to others."** Immediately preempt the misconceptions: First, **"This is NOT maximin."** Illustrate: Compare giving a tiny benefit to the very worst off versus a large benefit to someone slightly better off. Maximin *only* cares about the worst off's absolute level. Prioritarianism, using a concave weighting function (e.g., sqrt(welfare)), *might* favour giving the large benefit to the slightly better off if it yields greater priority-weighted welfare overall. Second, **"This is NOT saying the worse off are *more valuable persons*."** Hammer this: "Prioritarianism weights the *moral value of benefits received*, not the moral worth of the person. Helping a badly off person with a given-sized benefit matters *more* than helping a well-off person with the *same*-sized benefit, because of the difference it makes to their absolute condition. Their personhood is equal." Use the same scenarios: In Scenario 2 (150/50), prioritarianism heavily weights helping B. But crucially, it wouldn't support *leveling down* to Scenario 3 (50/50) because that makes B *worse off* – the absolute loss outweighs any gain from equality.

  Sequencing is critical: Telic Egalitarianism -> Leveling-Down Objection (showing its flaw) -> Prioritarianism as an alternative that cares about the absolute position of the worse off without endorsing leveling down. **Where it's most likely to fail:** When introducing prioritarianism, welfare economists will immediately think, "This is just utilitarianism with diminishing marginal utility (DMU)!" **Head this off explicitly and forcefully at the moment you define prioritarianism.** Say: "Crucially, prioritarianism is *not* DMU. DMU is about the *empirical fact* that an extra dollar gives less welfare to a rich person than to a poor person. Prioritarianism is a *normative claim*: even if we imagine a benefit that provides the *same* absolute welfare gain to both a poor and a rich person (say, both gain +5 utils), prioritarianism says giving that benefit to the poor person is *morally more important* because they are at a lower absolute welfare level. The weight depends on the *recipient's absolute welfare level*, not the marginal productivity of resources." A good case here is identical twins with identical utility functions, one poor (low welfare level), one rich (high welfare level); giving a resource giving +5 utils to each. DMU says it doesn't matter who gets it (same welfare gain). Prioritarianism says give it to the poor twin because the +5 utils matter *more* morally given their low baseline.

  **Openly decline to cover:** Deontic egalitarianism (rights, fairness, procedural justice), sufficientarianism, and luck egalitarianism in any depth. Say: "Today is focused purely on the contrast between *telic* egalitarianism and prioritarianism as responses to the leveling-down objection. Other important egalitarian views, based on fairness or avoiding exploitation, are distinct arguments we don't have time for now."

  **The diagnostic question:** "Imagine a policy choice under prioritarianism. Option X: Gives a large benefit to a moderately well-off person (raising them from 80 to 100 utils). Option Y: Gives a smaller benefit to a much worse-off person (raising them from 20 to 25 utils). Total unweighted welfare gain is higher under X (20 vs 5). Total *priority-weighted* welfare gain (using, say, sqrt(utils)) is higher under Y (sqrt(25) - sqrt(20) ≈ 5 - 4.47 = 0.53 vs sqrt(100) - sqrt(80) ≈ 10 - 8.94 = 1.06). Which option does prioritarianism favour, and why is this *not* a contradiction?" **Correct Answer:** Prioritarianism favours Y. It is not a contradiction because prioritarianism cares about the *weighted* gain, not the unweighted sum. The smaller absolute gain to the much worse-off person has greater *moral weight* than the larger gain to the better-off person. This shows they grasp the weighting function and its independence from both total utility and maximin.

  **Where sequencing is most fragile:** The step distinguishing prioritarianism from DMU-based utilitarianism is the weakest link. Welfare economists are deeply conditioned to see concave transformations as modeling DMU. If this distinction doesn't land, prioritarianism collapses into utilitarianism for them. **What might make me reorder?** If diagnostic checks early on show deep resistance to the idea of normative weighting beyond DMU, I might briefly introduce the "flat" utility case *before* defining prioritarianism: "Imagine a world where money has *constant* marginal utility (no DMU). Would you still think giving £100 to a destitute person is morally more urgent than giving it to a millionaire?" This might create the conceptual space for the normative claim of prioritarianism to register before the formal definition. But this risks muddying the waters early; the original sequence forces the confrontation directly at the point of definition. Stick to the original sequence, but be hyper-vigilant and over-clarify at that precise juncture.
