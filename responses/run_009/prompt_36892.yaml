answer: |-
  ### Joint Statement from the Adversarial Collaboration  
  **Regarding the Case of Anna (Early-Stage Dementia Patient) and Her Shared Digital Memory System**  

  #### 1. Agreed-Upon Claims  
  Both parties endorse the following substantive claims about Anna’s case, based on the shared digital system (notes app and calendar) co-maintained with her daughter, Bea:  

  1.1. **Functional Equivalence in Access and Use**: The system is functionally analogous to biological memory for Anna in key respects: it is reliably available, automatically endorsed (Anna treats its outputs as authoritative without second-guessing), and routinely accessed to guide her actions.  

  1.2. **Scaffolding Necessity**: The system provides indispensable scaffolding for Anna’s cognitive functioning. Without it, her ability to navigate daily life would be severely impaired due to her dementia.  

  1.3. **Curatorial Influence**: Bea’s active role (editing, pruning, adding unrequested reminders) introduces content that is not solely authored by Anna. This content is functionally indistinguishable *to Anna* from her own contributions.  

  1.4. **Causal Integration**: The system is deeply causally integrated into Anna’s cognitive routines. Changes to the system (e.g., edits by Bea) directly influence Anna’s beliefs, decisions, and behavior in a manner similar to how biological memory updates would.  

  1.5. **Agency Blurring**: Anna cannot reliably distinguish between self-generated and Bea-generated content. This blurring affects the epistemic status of the information—Anna experiences it as "hers," but its origins are hybrid.  

  1.6. **System Dependency vs. Autonomy**: The system’s reliability depends on Bea’s ongoing maintenance. If Bea withdraws, the system degrades, implying it lacks the self-sustaining autonomy of biological memory.  

  #### 2. Disagreements Table  
  Each disagreement is phrased neutrally and acceptable to the respective camp.  

  | ID | Disagreement Focus | Extended-Mind Theorist (EMT) Position | Internalist (INT) Position |
  |----|---------------------|----------------------------------------|----------------------------|
  | D1 | **Cognitive Ownership** | The shared system (including Bea’s contributions) is constitutive of Anna’s cognitive system and counts as her memory. Functionally integrated external resources, regardless of origin, become part of the mind when they play the same role as internal processes. | The system is an external scaffold, not part of Anna’s cognitive system. Cognitive processes (e.g., memory) are bounded by the organism; external tools are inputs to cognition, not constituents of it. |
  | D2 | **Agency and Control** | Bea’s curation is compatible with the system being Anna’s memory, as internal memory also involves unconscious, non-agential processes (e.g., memory reconsolidation). The daughter’s role is analogous to these "subpersonal" mechanisms. | Bea’s agency introduces an external source of control that violates the autonomy required for cognition. The system is not Anna’s memory because it is partly governed by Bea’s independent goals and judgments. |
  | D3 | **Constitutive Boundaries** | The system’s functional role (reliable, automatic endorsement) justifies treating it as constitutive of cognition without implying cognitive "bloat." Criteria like accessibility and trust filter irrelevant external resources. | Accepting this system as cognitive dissolves boundaries: if Bea’s edits count as Anna’s memory, then any trusted, tool-mediated influence (e.g., a manipulative advertiser) could become "part of the mind," leading to incoherent bloat. |
  | D4 | **Hybrid Content Status** | Content added by Bea (e.g., unrequested reminders) becomes Anna’s memory once integrated and endorsed, as the origin does not alter the functional role it plays for Anna. | Bea’s additions are not Anna’s memories; they are external prompts or suggestions. Memory implies first-personal content generation; hybrid sources produce a novel category ("shared reminders"), not extended memory. |

  - **Merely Verbal Disagreement?** Both parties reject that D1 is merely verbal. They agree on the system’s functional role but disagree on whether "cognitive system" includes extracranial resources (EMT) or is organism-bound (INT). This is substantive: it hinges on whether functional role alone can redefine cognitive boundaries.  

  #### 3. Cruxes  
  The core disagreements hinge on resolvable subquestions. Settling these would force one side to concede ground or reveal fundamental stalemates.  

  - **Crux 1: Integration without First-Personal Control**  
    *Question*: Does Bea’s curation prevent the system from meeting the "automatic endorsement" condition of the parity principle? (Automatic endorsement: Anna trusts the output as her own, akin to biological memory.)  
    *Why it moves the debate*: EMT requires this for parity; INT argues curation by another agent breaks it.  

  - **Crux 2: Causal vs. Constitutive Contributions**  
    *Question*: Can a principled distinction be drawn between external resources that are *constitutive* of cognition (so integrated they become part of the cognitive system) and those that are merely *causal* (influencing but not constituting cognition)?  
    *Why it moves the debate*: EMT claims functional role establishes constitution; INT demands a boundary (e.g., organismic containment) to avoid bloat.  

  - **Crux 3: Agency Transfer**  
    *Question*: Does Bea’s involvement transfer cognitive agency to Anna? (e.g., When Bea adds a reminder Anna treats as her own, does it become Anna’s memory or remain Bea’s influence?)  
    *Why it moves the debate*: If EMT concedes no transfer, hybrid content threatens mind "merger"; if INT concedes transfer, internalism’s agency requirement weakens.  

  #### 4. Tests, Predictions, and Unsettleable Elements  
  For each crux, concrete variations on Anna’s case are proposed. Both parties pre-commit to predictions.  

  **Crux 1: Integration without First-Personal Control**  
  - *Test A (No Curation)*: Bea *only* transcribes verbatim; no editing or additions. Anna reviews/re-endorses all content weekly.  
    - **EMT Prediction**: Automatic endorsement holds; system is clearly Anna’s memory. Review rituals mimic memory consolidation.  
    - **INT Prediction**: Weekly review shows endorsement is *not* automatic (it’s reflective), breaking parity. System remains a tool.  
    - *Why it tests Crux 1*: Removes curation to isolate automaticity.  

  - *Test B (AI Curation)*: Bea is replaced by an AI that curates identically (edits/prunes/adds reminders). Anna cannot distinguish AI from self.  
    - **EMT Prediction**: No difference from Bea—if functionally equivalent, it remains Anna’s memory.  
    - **INT Prediction**: AI exacerbates the problem: lack of human agency doesn’t make it constitutive; it’s still an external tool.  
    - *Why it tests Crux 1*: Removes human agency; tests if "external source" alone breaks integration.  

  **Crux 2: Causal vs. Constitutive Contributions**  
  - *Test C (Temporary Removal)*: The system is disabled for a week. Anna becomes disoriented and cannot compensate with biological memory.  
    - **EMT Prediction**: This constitutive dependence mirrors amnesia; the system is cognitively necessary.  
    - **INT Prediction**: Causal dependence (like relying on glasses) doesn’t imply constitution; Anna’s disorientation shows scaffolding, not mind-extension.  
    - *Why it tests Crux 2*: Challenges whether dependence implies constitution.  

  - *Test D (Neural Implant Proxy)*: A neural implant replaces the app, storing identical content. Bea can wirelessly edit it. Anna experiences edits as "intrusive thoughts."  
    - **EMT Prediction**: Implant is clearly cognitive; Bea’s edits are external interference, not constitution. Shows location isn’t decisive.  
    - **INT Prediction**: Implant is cognitive (it’s intracranial); Bea’s edits are causal inputs. Reinforces organismic boundary.  
    - *Why it tests Crux 2*: Isolates location vs. function; INT must confront intracranial extension.  

  **Crux 3: Agency Transfer**  
  - *Test E (Explicit Authorization)*: Bea only adds content when Anna explicitly requests (e.g., "Bea, add a reminder for my pills"). No independent curation.  
    - **EMT Prediction**: Content is unambiguously Anna’s memory; Bea is a passive tool.  
    - **INT Prediction**: Even here, memory storage is external; agency is Anna’s, but the system isn’t cognitive.  
    - *Why it tests Crux 3*: Tests if authorship resolves agency.  

  - *Test F (Bea’s Independent Goals)*: Bea adds reminders reflecting *her* goals (e.g., "Attend daughter’s event"), which Anna adopts as her own.  
    - **EMT Prediction**: If Anna endorses it automatically, it becomes her memory; goals can be shared.  
    - **INT Prediction**: This is external manipulation; content is Bea’s, not Anna’s memory.  
    - *Why it tests Crux 3*: Forces EMT to confront "mind merger."  

  **Admission of Unsettleable Elements**  
  Both parties agree that **Crux 2 (Causal vs. Constitutive)** cannot be fully resolved empirically or conceptually. Tests may inform but not settle it, as it hinges on fundamental disagreements about the metaphysics of cognition (e.g., whether "constitution" is a useful or coherent category). INT maintains that organismic boundaries are non-negotiable; EMT insists functional role trumps location. This crux may reflect irreconcilable starting assumptions.  

  ---  
  **Signatories**  
  Extended-Mind Theorist: _________________________  
  Internalist: _________________________  
  Date: _________________________  

  This document reflects genuine collaboration: agreements are substantive, disagreements are fairly framed, and cruxes are tested with falsifiable predictions. Both parties accept that unresolved philosophical differences may persist, but future work should focus on Crux 1 and Crux 3, where empirical outcomes could force revisions.
