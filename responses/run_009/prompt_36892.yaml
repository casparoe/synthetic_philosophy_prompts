  We are focusing on a specific case: a woman (let's call her Anna) with early-stage dementia who uses a shared digital system (notes app and calendar) co-maintained with her daughter (let's call her Bea). Bea curates, edits, prunes, and adds reminders without explicit requests from Anna. Anna cannot always distinguish her own past contributions from Bea's insertions.

  **Brainstorming: What each camp would insist on**

  *Extended-mind theorist (EMT):*
  - The system (app + daughter's contributions) functions as Anna's memory because it is reliably available, automatically endorsed (Anna treats the information as her own), and easily accessed.
  - The fact that Bea is involved in curation does not break the parity; after all, internal memory is also subject to unconscious curation and reconstruction. The system as a whole is integrated into Anna's cognitive life.
  - The unease about Bea being part of Anna's mind is misplaced. The notebook in Otto's case is also maintained by others (e.g., if Otto buys a pre-printed diary), but that doesn't change the fact that it's Otto's memory. Similarly, Bea's role is part of the support structure that enables the system to function as memory for Anna. This is no different from how we rely on external tools in everyday cognition (e.g., using a calculator).

  *Internalist (INT):*
  - The system is not part of Anna's cognitive system because the cognitive processes (like memory) must be within the organism. The app and Bea's contributions are external and only causally influence Anna's cognition.
  - Bea's active role in editing and adding content without Anna's explicit request or awareness introduces a problem of agency and ownership. The content is not solely Anna's; it's a joint product. If the EMT says this is Anna's memory, then they must admit that Bea is part of Anna's mind, which is absurd.
  - The lack of distinguishability of the source (Anna vs. Bea) shows that Anna is not in control and that the system is not transparently hers. This breaks the "automatic endorsement" condition of the parity principle because Anna is endorsing content that may have been inserted by Bea without her knowledge, which is not analogous to biological memory.

  **Joint Statement**

  **1. Agreed-Upon Claims**

  Both parties agree on the following substantive points regarding the case of Anna and her shared digital memory system:

  1.1. **Functionality**: The digital system (notes app and calendar) serves a memory-like function for Anna by storing information that she uses to guide her behavior and that she treats as her own.

  1.2. **Reliability and Access**: The system is reliably available and easily accessible to Anna in her daily life, meeting key functional criteria for a memory aid.

  1.3. **Dependency**: Anna is highly dependent on this system for cognitive tasks that she would otherwise perform using biological memory, and her quality of life is significantly enhanced by it.

  1.4. **Curatorial Influence**: Bea's active role in curating, editing, and adding content introduces an external influence that may alter the content of what Anna treats as her memory.

  1.5. **Indistinguishability**: Because Anna cannot always distinguish between her own contributions and Bea's insertions, the content she accesses is a blend of her own past inputs and Bea's contributions.

  1.6. **Causal Contribution**: The system (including Bea's actions) causally contributes to Anna's behavior in a manner that is functionally similar to how biological memory contributes.

  1.7. **Cognitive Scaffolding**: The system provides essential scaffolding for Anna's cognitive activities.

  **2. Disagreements Table**

  | Disagreement ID | Extended-Mind Theorist (EMT) Position                                                                 | Internalist (INT) Position                                                                                             |
  |-----------------|--------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------|
  | D1: Ownership   | The digital system, including Bea's contributions, is literally part of Anna's cognitive system and thus constitutes Anna's memory. | The digital system is an external tool that provides input to Anna's cognitive system; it is not part of her memory.    |
  | D2: Agency      | Bea's role in the system does not undermine the system's status as part of Anna's mind; it is analogous to unconscious internal processes. | Bea's active curation means that the system reflects Bea's agency, not just Anna's, and thus cannot be part of Anna's cognitive system. |
  | D3: Bloat       | Including such systems does not lead to cognitive bloat because the functional criteria (reliable, automatic, etc.) are stringent. | Accepting this system as part of cognition leads to cognitive bloat because it includes external agents and tools without clear boundaries. |
  | D4: Constitutive vs. Causal | The system is constitutive of Anna's memory; without it, her cognitive system would be different. | The system is merely causal; it influences but does not constitute her cognitive system. |

  *Note on verbal disagreement*: The parties agree that there is a substantive disagreement, but part of D1 and D3 might be verbal if we interpret "cognitive system" differently. However, both sides deny that the disagreement is merely verbal because they disagree on whether the external resource is part of the cognitive process itself (constitutive) or merely a cause (causal). The EMT uses "cognitive" to include extended processes, while the INT restricts it to intracranial processes.

  **3. Cruxes**

  Crux 1: **Integration and Automatic Endorsement**  
     - *Question*: Does Bea's curation break the integration required for the system to count as part of Anna's cognitive system, particularly with respect to automatic endorsement (i.e., Anna's treating the content as her own without critical scrutiny)?  
     - *Why it matters*: EMT requires that the external resource be automatically endorsed, like biological memory. If Bea's edits violate this, the system may not meet the parity principle.

  Crux 2: **Agency and Ownership**  
     - *Question*: Can the system be considered Anna's memory when Bea's agency is involved in creating and altering content without Anna's explicit direction or awareness?  
     - *Why it matters*: INT argues that cognitive processes must be within the agent's control, and external agency undermines that.

  Crux 3: **Constitutive vs. Causal Boundary**  
     - *Question*: Is there a principled way to distinguish between external resources that are constitutive of cognition and those that are merely causal?  
     - *Why it matters*: EMT claims the system is constitutive, while INT sees it as causal. If no clean boundary can be drawn, it might support EMT; if it can, it might support INT.

  **4. Tests, Thought Experiments, and Predictions**

  For each crux, we design variations on the Anna-Bea case. Both parties agree on these tests and write their predictions in advance.

  *Crux 1: Integration and Automatic Endorsement*

  - **Test 1 (Verbose Transcription)**: Bea only transcribes verbatim what Anna says and never edits or adds anything. The app is read-only for Bea after transcription. Anna reviews the content daily and re-endorses it.
    - *EMT Prediction*: This strengthens the case for extended memory because the system is now more like Otto's notebook, with no external agency in content creation. Automatic endorsement is intact.
    - *INT Prediction*: Even in this case, the system is still external and causal. The daily review might show that it's not automatically endorsed but requires active re-endorsement, which biological memory does not. Thus, it doesn't meet parity.

  - **Test 2 (Autocomplete App)**: Replace Bea with an AI autocomplete feature that suggests edits and additions based on Anna's past inputs. Anna accepts these without noticing they are AI-generated.
    - *EMT Prediction*: If the AI is reliable and Anna automatically endorses it, then it should count as part of her cognitive system. The source (AI vs. Bea) doesn't matter if functional criteria are met.
    - *INT Prediction*: This still doesn't count as part of cognition because the AI is an external tool. The lack of awareness of the source might even make it worse, as Anna is not in control.

  - **Test 3 (No Review)**: In the original case, but Anna never reviews the content; she just accesses it when needed and automatically uses it.
    - *EMT Prediction*: This is the standard case. Automatic endorsement is shown by immediate use without review.
    - *INT Prediction*: Without review, Anna is even less aware of Bea's influence, which shows that the system is not transparently hers and thus not part of her cognitive system.

  *Crux 2: Agency and Ownership*

  - **Test 4 (Daughter as Scribe Only)**: Bea only adds content when explicitly directed by Anna (e.g., "Bea, add that I have a doctor's appointment on Tuesday"). Bea does no independent curation.
    - *EMT Prediction*: This is clearly Anna's memory because Bea is just a tool for data entry. The agency is entirely Anna's.
    - *INT Prediction*: Even here, the memory is stored externally and only causally supports Anna. The fact that Bea is an agent doesn't change the external nature, but it avoids the agency problem because Bea acts only under Anna's direction.

  - **Test 5 (Full Automation)**: The system is entirely automated. Anna inputs data, and an AI curates it without human intervention. Bea is out of the loop.
    - *EMT Prediction*: This should be unproblematic extended memory, as there is no external human agency.
    - *INT Prediction*: Still not part of cognition. The AI is just a tool.

  - **Test 6 (Bea's Independent Reminders)**: Bea adds reminders that Anna never requested and that are entirely Bea's initiative (e.g., "Call Bea every Sunday"). Anna treats these as her own commitments.
    - *EMT Prediction*: If Anna automatically endorses and acts on them, they become part of her memory. The source doesn't matter if functionally integrated.
    - *INT Prediction*: This is a clear case of external agency. The content is Bea's, not Anna's. It might influence Anna, but it's not her memory.

  *Crux 3: Constitutive vs. Causal Boundary*

  - **Test 7 (Temporary Loss)**: Suppose the system becomes temporarily unavailable (e.g., app crash). Anna is disoriented and cannot function normally.
    - *EMT Prediction*: This shows that the system is constitutive of her cognitive system because its absence impairs her cognitive abilities in a way that parallels losing biological memory.
    - *INT Prediction*: This only shows causal dependence. Losing glasses impairs vision, but glasses aren't part of the visual system.

  - **Test 8 (Neural Implant)**: Instead of the app, imagine a neural implant that does the same thing (stores and retrieves memories, but also has a wireless link allowing Bea to edit the content).
    - *EMT Prediction*: If the implant is accepted as part of the cognitive system (which it should be, being intracranial), then Bea's editing would still be problematic, but the implant itself is cognitive. This highlights that location isn't the issue; the functional integration is.
    - *INT Prediction*: The neural implant is clearly part of the cognitive system because it's in the head. But Bea's edits are external influences, not constitutive. This shows that the boundary is the organism.

  - **Test 9 (Gradual Internalization)**: Over time, Anna's brain adapts and starts to rely less on the app because of neural plasticity. She can now recall some events without the app.
    - *EMT Prediction*: This doesn't change the status of the system when it was in use; it was still part of her cognitive system at that time.
    - *INT Prediction*: This shows that the app was scaffolding, not constitutive, because the real cognitive system (the brain) has taken over.

  **Admission of Unsettleable Cruxes**

  Both parties agree that Crux 3 (Constitutive vs. Causal Boundary) may not be fully settleable by empirical tests alone because it involves a conceptual distinction about what counts as cognition. However, the tests above (especially Test 7 and Test 8) may provide evidence that informs the debate.

