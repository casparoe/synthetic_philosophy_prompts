  For the disguised-policy-work claim: The tort law analogy is sharp. When historians "assign blame," they're really choosing where to focus the narrative based on current concerns - containment policy justifications, nuclear deterrence lessons, etc. The debate persists because it's not resolvable through evidence alone.

  The key distinction for the objection: Deliberate wars have clear initiation points satisfying the blame conditions. The Cold War's essence was mutual constitution - a self-reinforcing system where actions became intelligible only in reaction to the other side. That's fundamentally different from a conscious act of aggression.

  Should emphasize how this perspective shifts the conversation: from "who started it?" to "what structural conditions made this inevitable?" and "what does focusing on blame prevent us from seeing?" That's where the real journalistic insight lies.
answer: |-
  Here's the argument structured to meet your needs, addressing both claims and the key objection:

  **Claim 1: "Who Started the Cold War?" is a Pseudo-Question**
  The core problem is that "blame" requires conceptual conditions absent in the Cold War's origins:
  1.  **No Discrete Act:** The Cold War wasn't ignited by a single decision (e.g., invading Poland). It emerged from a dense web of escalating actions/reactions (1945-47+) – Soviet pressure on Eastern Europe, US atomic monopoly/diplomacy, Kennan's Long Telegram, Churchill's Iron Curtain speech, Truman Doctrine, Marshall Plan, Czech coup, Berlin Blockade. Assigning "start" to any one ignores the inherent entanglement.
  2.  **No Clear Victim/Perpetrator:** Both superpowers acted from profound, arguably legitimate fear. The USSR feared encirclement, US atomic threat, and a rebuilt capitalist Germany. The US feared Soviet expansionism and the collapse of European democracies. Each saw *themselves* as the wronged party reacting defensively. This mutual perception of threat is central to the conflict's structure, negating a clear blameworthy agent and victim.
  3.  **Unknowable Counterfactual Baseline:** Blame hinges on the counterfactual: "If X hadn't done Y, harm would have been avoided." For the Cold War, this is deeply speculative and contested. What if the US shared the bomb? If Stalin withdrew from Eastern Europe? If Marshall Aid was rejected? The systemic pressures (ideological clash, power vacuum, security dilemmas) make a peaceful post-war path highly uncertain. We cannot establish a reliable baseline where "things would have gone fine" absent one actor's specific choices.

  Therefore, the question "Who started it?" implies a clear agent initiating harm against a passive victim within a knowable peaceful alternative – a framework fundamentally mismatched with the historical reality of mutual, structural antagonism.

  **Claim 2: The Blame Debate is Disguised Policy Work**
  The orthodox/revisionist/post-revisionist debate isn't *resolving* a factual question ("Who started it?") because the conditions above make it unresolvable on purely empirical grounds. Instead, it functions like determining *proximate cause* in tort law:
  *   **But-For Causation:** Almost infinite chains exist (e.g., the Treaty of Versailles, Russian Revolution, Appeasement). Everyone agrees Stalin and Truman were "but-for" causes.
  *   **Proximate Cause:** Choosing where to "cut" the chain is a normative judgment. Focusing blame on Stalin (orthodox) implicitly validates US containment policy and justifies military vigilance. Blaming Truman/revisionists) critiques US militarism/imperialism and suggests alternative, conciliatory foreign policies could have worked. Post-revisionists, by emphasizing system/structure, often implicitly downplay individual agency and moral responsibility, focusing on managing inevitable conflict.
  *   **Present Concerns:** The emphasis reflects contemporary values and anxieties. During heightened Cold War tensions (1950s-60s), orthodox views dominated. Amidst Vietnam War critiques and détente (1960s-70s), revisionism rose. Post-revisionism gained traction as the Cold War ended, allowing a more detached view of systemic forces. The debate persists because the choice of "starting point" signals which lessons (trust/hawkishness vs. distrust/dovishness vs. inevitability/pragmatism) we should draw for *current* international relations and power structures.

  **Addressing the Strongest Objection: "This Proves Too Much"**
  The objection claims this logic prevents blaming anyone for large events (like a deliberate war). The Cold War case differs crucially:
  1.  **Deliberate Initiation vs. Emergent Structure:** A deliberately launched war *has* a discrete initiating act (e.g., Hitler invading Poland). The Cold War lacked this; it was an *emergent property* of mutual suspicion and systemic pressures, not a conscious decision to "start" a global conflict. The conflict *was* the structure itself.
  2.  **Clear Victim/Intent:** In a deliberate war, the victim state(s) are clearly identifiable, and the aggressor's intent to initiate major conflict is demonstrable (e.g., war plans, declarations). In the Cold War, both superpowers' core intentions were arguably defensive, and the "victim" was global peace itself, not primarily one state against another.
  3.  **Plausible Counterfactual:** For a deliberate war, the counterfactual ("If Hitler hadn't invaded...") points towards a plausible peaceful baseline. For the Cold War, given the scale of mutual distrust and the power vacuum, the peaceful counterfactual baseline is far less certain or knowable.

  **Conclusion:** Asking "Who started the Cold War?" is flawed because it imposes an individual blame framework on a structural conflict born of mutual fear. Historians' answers are less empirical discoveries and more normative judgments about proximate cause, reflecting their views on where responsibility *should* lie based on present-day concerns about power and policy. This doesn't negate blame for deliberate acts of large-scale aggression; it highlights the unique, emergent, and mutually constitutive nature of the Cold War system itself. The question distracts from understanding *how* the structure emerged and functioned.
