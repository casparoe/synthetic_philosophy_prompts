  #### **Node 1: Thermostat**  
  *Case: A thermostat turns on heating when the temperature drops. Can we correctly say it "believes the room is cold" and "wants it to be warm"?*  
  - **A:** Yes, this is literally true. → Go to Node 2  
  - **B:** No, this is just useful shorthand. → Go to Node 3  
