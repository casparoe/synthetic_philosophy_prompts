  1. **Epistemic Liberal + Moral Denial**: Believes AIs have full beliefs/desires but denies any moral weight. *Diagnosis: Coherent but unattractive—moral relevance often tracks mental state ascriptions.*  
  2. **Epistemic Deflationary + Moral Affirmation**: Says belief-talk has no truth value but grants moral weight if AI "suffers." *Diagnosis: Incoherent—if beliefs aren’t real, desires/pain can’t ground morality.*  
  3. **Grounding Restrictivism + Etiological Requirements**: Insists content must be text-grounded *and* require learning history. *Diagnosis: Neglected—no clear reason to bundle these restrictions.*  

