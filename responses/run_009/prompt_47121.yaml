prompt: |-
  I'm a high school junior in my school's philosophy club, and I'm putting together a moderated discussion session on whether we learn to be good by reading about good people. For our reading we did Plutarch's life of Aristides and a medieval saint's life, and I noticed something that surprised me: my classmates split on the cases in ways that didn't match the positions they claimed to hold when we discussed theory directly. One friend who insisted biography is indispensable for moral education got squeamish the moment the biography turned out to contain invented episodes; another who called hagiography "propaganda" happily admitted she'd modeled real decisions on an idealized portrait of a person she knew almost nothing factually about. So I want an instrument that sorts people by what they actually say about cases, not by which labels they like the sound of.

  Please act as a professional philosopher with expertise in ancient biography, virtue ethics, and the literature on exemplars and moral exemplarism, and think carefully before writing anything — I'd like you to brainstorm the underlying structure of the debate first, then build the instrument from that structure rather than from a list of famous names.

  Here is what I need, in two parts:

  Part one: before writing the quiz itself, identify the three or four diagnostic questions that carve up the logical space of views on moral learning from lives — I suspect they include something like (a) whether persons rather than principles can be the primary vehicles of moral education at all, (b) whether the biographical content must be factually true, (c) whether idealization — smoothing away or downplaying the subject's flaws — is corrupting or is precisely what makes emulation possible, and (d) whether admiration is a trustworthy guide to what is genuinely admirable — but revise or replace these if you think the space is cut differently. From those diagnostic questions, construct a taxonomy: the combinations of answers they permit, the actual positions located in that space, and any combinations nobody seems to hold. For each unoccupied combination, tell me whether it's unoccupied because it's incoherent, because it's unattractive, or just because nobody has explored it.

  Part two: turn the taxonomy into a "which view do you actually hold?" quiz for my classmates (ages 15-18, no philosophy background beyond our club). Ten questions, each a concrete case with two or three answer options. The cases should include, at minimum: a figure you long admired who turns out to be morally mixed in a serious way, and what happens to the moral lesson retroactively; a biography that contains flattering invented episodes that clearly did motivate readers to live better; a virtue you can admire but structurally cannot emulate, because the circumstances that made it available (war, poverty, sainthood) aren't yours; and one of Plutarch's small, almost trivial details about a subject's habits or manner, of the sort he includes because he thinks character shows in such details. No question may simply ask the reader to self-identify with a position — every question must be answerable by someone who has never heard of any of the views. Finish with a scoring key mapping answer patterns onto the following leaves: the exemplarist view that grounds moral concepts in admired persons; the Plutarchan method of comparing lives, vices and virtues side by side, from which we learn by contrast and juxtaposition rather than by flat idealization; the hagiographic view that an idealized portrait can edify even where it invents; the historian's objection that false or cherry-picked lives corrupt moral judgment, so only accurate biography can teach; and the skeptic's view that lives teach us trivia and moral luck, and that moral learning has to run through rules and principles instead. Where your quiz cannot actually separate two of these leaves — say, the exemplarist and the Plutarchan view — flag it honestly rather than pretending a question separates them.

  Please keep the language accessible to my classmates, and after the scoring key, add a short paragraph on the single case in the quiz that does the most sorting work, and what a dissatisfied quiz-taker on each side of that case would complain about.
reasoning: |-
  Okay, let me approach this high school philosophy club request systematically. The student wants two things: first, a conceptual map of how people actually engage with moral learning from biographies (beyond their stated theories), and second, a concrete quiz to reveal these implicit positions to classmates.

  Hmm, the core tension here is between stated beliefs and actual reactions - like the friend who values biography but rejects invented episodes. This suggests we need diagnostic questions that bypass self-reporting. I recall Linda Zagzebski's exemplarism and Plutarch's parallel lives as key frameworks, but must avoid jargon for teenagers.

  First, I'll refine the diagnostic axes:
  - Primary vehicle: Persons vs principles? (Do we learn morality from people or rules?)
  - Truth requirement: Must biographies be factual? 
  - Idealization function: Is polishing flaws helpful or harmful for emulation?
  - Admiration's reliability: Can we trust our gut admiration?

  *checks for gaps* 
  Ah! The emulation possibility axis is crucial - some virtues like wartime courage may be structurally unavailable to modern teens. Adding that as fourth question.

  *sketches taxonomy*
  Combination analysis shows:
  - Person-centered + anti-idealization = Plutarchan comparative approach
  - Person-centered + pro-idealization = hagiographic view
  - Principle-centered + any = skeptic view
  *noticing gap* 
  Exemplarism (person-centered + admiration-trusting) remains distinct from Plutarch by accepting idealization. But both reject strict factualism - interesting!

  For the quiz, I'll design cases that force choices:
  - Admired figure with revealed flaws (e.g. scientist with unethical experiments)
  - Invented but inspiring episode (like young saint feeding poor miraculously)
  - Unemulatable virtue (soldier's bravery under fire)
  - Plutarchan trivial detail (how someone holds a cup)

  Each scenario will have answer options mapping to positions without naming them. The scientist flaw case is particularly potent - it separates those who retroactively dismiss all virtue from those who compartmentalize.

  *double-checks accessibility* 
  Using "copying" instead of "emulation", "made-up stories" instead of "fictionalized accounts". The scoring key will visually group answers before naming positions.

  Final note: The quiz honestly can't separate exemplarists from Plutarchans on the admiration question - both trust admiration initially. That transparency is pedagogically valuable for the club's discussion.
answer: |-
  Based on your observations and requested expertise, here's the conceptual breakdown followed by the quiz. The diagnostic questions are refined to capture the core tensions in your classmates' reactions:

  **Part One: Diagnostic Questions & Taxonomy**
  1.  **Primary Vehicle:** Can *persons themselves* (their character, actions, choices) be the primary source of moral learning, or must moral learning run through abstracted *principles/rules*?
  2.  **Truth Requirement:** Does the biographical account *need to be factually accurate* to convey moral value, or can *invented/idealized elements* still serve an educational purpose?
  3.  **Idealization Function:** Is the *smoothing away of flaws or addition of virtues* (idealization) necessary to make a figure *emulatable*, or does it *distort reality* and corrupt the lesson?
  4.  **Emulation Possibility:** Can you meaningfully learn a virtue from a life if the *circumstances* that called for that virtue (e.g., war, extreme poverty, unique historical moment, sainthood) *are fundamentally unavailable to you*?

  **Taxonomy of Views (Based on Answer Combinations):**

  | Primary Vehicle | Truth Requirement | Idealization Function | Emulation Possibility | Resulting View                                      | Status/Notes                                                                 |
  | :-------------- | :---------------- | :-------------------- | :-------------------- | :-------------------------------------------------- | :--------------------------------------------------------------------------- |
  | **Persons**     | Not Required      | Necessary             | Possible              | **Hagiographic View**                              | Occupied (e.g., Medieval Saints' Lives tradition). Focuses on edification. |
  | **Persons**     | Required          | Corrupting            | Possible              | **Historian's View**                                | Occupied (e.g., modern critical biography advocates). Accuracy enables learning. |
  | **Persons**     | Not Required      | Corrupting            | Possible              | *(Unoccupied)*                                      | **Incoherent:** If persons are primary *and* idealization corrupts, why accept invented content? |
  | **Persons**     | Required          | Necessary             | Possible              | *(Unoccupied)*                                      | **Unattractive:** Demands accuracy *and* idealization, which conflict. Rarely held. |
  | **Persons**     | Required/Not Req. | Corrupting/Necessary  | **Impossible**        | **Plutarchan View** *(Nuance)*                     | Occupied. Focus shifts to *comparison* and *character diagnosis* via details (flaws included), not direct emulation of specific acts. Emulation targets the *discernible character trait*, not the unrepeatable act. |
  | **Persons**     | Not Required      | Necessary             | Impossible            | *(Unoccupied)*                                      | **Incoherent:** If circumstances make emulation impossible, why is idealization necessary? |
  | **Persons**     | Required          | Corrupting            | Impossible            | *(Weak Skepticism)*                                 | **Unattractive:** Why value accurate lives if you can't emulate anything in them? Bordering on Principle view. |
  | **Principles**  | Irrelevant        | Irrelevant            | Irrelevant            | **Skeptic's View**                                  | Occupied. Lives are just illustrations of principles/luck/trivia; learning comes from rules. |
  | **Persons**     | Not Required      | *(Implicitly Accepts)*| Possible              | **Exemplarist View** (Zagzebski)                    | Occupied. Grounds morality *in* admiration of exemplars; factual accuracy secondary to the *recognition* of admirability. |

  **Key Observations:**
  *   **Exemplarism vs. Hagiography:** Both accept invented/idealized elements. Hagiography *deliberately* idealizes for edification. Exemplarism trusts admiration itself; if admiration persists despite knowing about invention, the exemplar still holds moral weight. The key difference is the *role of admiration* (foundational vs. tool).
  *   **Plutarch's Nuance:** Plutarch (*Lives*) primarily fits the "Persons + Required Truth + Emulation Impossible/Shifted" cell. He includes flaws and trivial details *because* they reveal character for *comparative* judgment ("What made *this* leader succeed where *that* one failed?"), not for direct copying of specific heroic acts often tied to unrepeatable circumstances. Idealization corrupts his project of understanding real human virtue/vice interplay.
  *   **Unoccupied Cells:** Generally incoherent (logical contradictions) or unattractive (offers little reason to engage with biography for moral learning).
  *   **The Crucial Divide:** The "Emulation Possibility" question (Question 4) is vital for separating Plutarchan comparative learning from direct emulation views (Hagiography, Historian, Exemplarism).

  **Part Two: The "Which View Do You Actually Hold?" Quiz**

  **Instructions:** Read each scenario and choose the answer that best reflects your gut feeling or most likely action. Don't overthink it!

  1.  **The Flawed Hero:** You've long admired Dr. Elara Vance, a famous scientist celebrated in biographies for her dedication to truth. You discover newly uncovered letters proving she conducted unethical, harmful experiments on vulnerable people to get some of her data.
      *   A. My admiration is shattered. I question if anything she stood for was truly good.
      *   B. It's disappointing, but it doesn't erase the value of her core message about scientific integrity.
      *   C. This shows why we need clear *rules* about ethics in science, not just heroes to look up to.

  2.  **The Inspiring Invention:** You read a biography of Kaelen, a young peace activist. A powerful chapter describes how, during a severe famine in his childhood village, he convinced angry mobs to share the last scraps of food through sheer compassion and eloquence. Later, you learn historians are certain this specific event was invented by the biographer to illustrate Kaelen's character.
      *   A. The story is meaningless now. Invented stories can't teach real morality.
      *   B. It's still powerful! That story perfectly captures the spirit of what made Kaelen admirable and motivates me to be compassionate.
      *   C. It was a nice story, but real learning comes from understanding the *principles* of conflict resolution and sharing it illustrated.

  3.  **Unreachable Courage:** You read about Captain Anya Petrova, a soldier awarded the highest honor for bravery. Her biography details how she repeatedly ran into enemy fire under impossible odds to rescue wounded comrades, showing incredible selflessness.
      *   A. Her courage is awe-inspiring, something I strive to emulate in my own challenges, big or small.
      *   B. It's incredible, but I can't imagine facing that kind of situation. I learn more by thinking about the *kind of loyalty and care* that drove her, which I *can* apply.
      *   C. It's a remarkable story, but irrelevant to my life. Bravery rules ("Stand up for what's right") matter more than specific acts of wartime heroism.

  4.  **The Small Detail:** A biography of a respected leader includes a seemingly minor note: even during high-pressure negotiations, she always took the time to personally thank and make eye contact with the junior staff serving coffee, remembering their names.
      *   A. That’s nice, but trivial. What matters are her big decisions and policies.
      *   B. That small habit speaks volumes about her genuine respect for people, regardless of status – a lesson in real character.
      *   C. It shows the importance of the *principle* of showing respect to everyone.

  5.  **The Saint's "Miracle":** A medieval saint's life describes how Brother Tomas, known for his humility, was once carrying firewood when his sack tore. Instead of the wood scattering, it miraculously hovered in the air until he could gather it, so he wouldn't be late for prayer. Historians agree this is a legend.
      *   A. The story is dishonest propaganda. It undermines any real message about humility.
      *   B. The miracle is a beautiful symbol of how his humility was so profound it seemed to bend reality. It inspires me to value humility more deeply.
      *   C. The core *idea* of prioritizing devotion over convenience is worthwhile, but the magical part is distracting.

  6.  **The Complicated Legacy:** A documentary reveals that a famous civil rights leader you deeply respect privately held some prejudiced views about a different minority group during their early career, though their public work fought against all discrimination.
      *   A. This taints everything. How can I trust their fight for justice if they were flawed in this way?
      *   B. It's a serious flaw showing they were human. It makes me reflect on the complexity of overcoming prejudice, even in those fighting against it. Their core achievements still stand.
      *   C. It highlights why we need strong universal *principles* of equality, not reliance on individual leaders who might be inconsistent.

  7.  **Learning from a Rival:** Plutarch writes about a virtuous leader, but always pairs them with a flawed counterpart. Reading about the flawed leader's disastrous choices due to arrogance...
      *   A. ...feels like a waste of time. Why focus on the bad? Just show me the good to copy!
      *   B. ...is fascinating! Seeing the contrast makes the virtues of the good leader clearer and the dangers of vice more real.
      *   C. ...just proves people are messy. Clear rules against arrogance are more useful than comparing messy lives.

  8.  **Admiring the "Unknown":** You see a photo and brief caption about a nurse during a plague outbreak centuries ago, staying to care for the sick when everyone else fled. You know nothing else about her life.
      *   A. It's impossible to truly admire someone I know so little about. She could have been awful otherwise.
      *   B. That single act of courage and compassion is profoundly admirable in itself, regardless of anything else.
      *   C. It's a powerful illustration of the *duty* of care professionals, which is the real lesson.

  9.  **Idealized Parent:** A friend bases their strong work ethic on stories about their grandparent's relentless perseverance through hardship (famine, war). You discover family records show the grandparent actually received significant, unmentioned help from others.
      *   A. The stories are misleading. The real lesson is the importance of community support, not individual grit.
      *   B. The *idea* of persevering through hardship is still valuable, and the stories motivated my friend well, even if simplified.
      *   C. Perseverance is a good *rule*, but the story's inaccuracy shows why principles are better guides than family lore.

  10. **The Motivation Test:** What kind of story is MOST likely to make you want to be a better person?
      *   A. A story showing clear, universal moral rules and why they work.
      *   B. A powerful, inspiring story about a truly good person (even if possibly simplified or idealized).
      *   C. A detailed, warts-and-all account of a real person's life, showing both their virtues and how their flaws caused problems.

  **Scoring Key:** Tally the letters (A, B, C) you chose most frequently.

  *   **Mostly A:** You lean towards the **Skeptic's View** or the **Historian's View**. You distrust idealized portrayals and believe moral learning primarily comes from rules (Skeptic) or requires strict factual accuracy (Historian). Questions 1, 2, 5, 6, 9 are strong indicators.
  *   **Mostly B:** You lean towards the **Hagiographic View** or the **Exemplarist View**. You find idealized or inspiring portrayals of persons deeply motivating for moral learning, even if not strictly factual. Admiration is central. Questions 2, 5, 8, 10 are strong indicators. *This quiz does NOT cleanly separate Hagiography (intentional idealization for edification) from Exemplarism (admiration as grounding morality). Question 3 might hint at it (B leaning Exemplarist, A leaning Hagiographic), but it's weak.*
  *   **Mostly C:** You lean towards the **Skeptic's View** (if focused on rules) or the **Plutarchan View**. Question 7 is the clearest Plutarchan indicator (B). If your Cs emphasize *principles* (Qs 1C, 3C, 6C, 8C, 10A), it's Skeptic. If your Cs emphasize *learning from complexity/contrast/details* (Qs 3B, 4B, 6B, 7B, 10C), it's Plutarchan.
      *   *Key Plutarchan Indicators:* 3B, 4B, 6B, 7B, 10C.
      *   *Key Skeptic Indicators:* 1C, 3C, 6C, 8C, 10A.

  **The Power of Question 1 (The Flawed Hero):**

  *   **Why it sorts:** This question directly probes whether admiration for a person's *apparent virtues* can survive the revelation of serious *contrary moral flaws*. It cuts to the heart of whether persons can be primary vehicles of moral learning (Views: Hagiography, Exemplarism, Plutarchan, Historian) vs. whether this discredits the whole endeavor, pushing towards principles (Skeptic) or demanding perfect accuracy (Historian).
  *   **Dissatisfied A Chooser (Skeptic/Historian-leaning):** Might complain: "This proves heroes are illusions! Option B is naive. You can't separate the 'core message' from the person who betrayed it. If the foundation (the person) is corrupt, the virtues associated with them are suspect. Only rules/principles are reliable."
  *   **Dissatisfied B Chooser (Hagiography/Exemplarism/Plutarchan-leaning):** Might complain: "Option A throws the baby out with the bathwater! People are complex. A serious flaw doesn't automatically negate genuine virtues or the value of what they stood for. Option B allows us to learn from the good while acknowledging the bad – that *is* moral maturity. Option C is cold and ignores the power of human example."

  This quiz reveals the tension between the desire for inspiring ideals (often requiring some simplification) and the demand for factual rigor, and between learning from persons versus principles. The results should spark excellent discussion in your club, especially where the quiz flags limitations (like separating Hagiography/Exemplarism). Good luck!
