answer: |-
  Here's your breakdown:

  **The law's conflicted presuppositions:** The system isn't running one theory; it's **muddling three incompatible views of emotion** depending on the legal goal:

  1.  **Heat-of-Passion (Excuse):** Emotion as **Overwhelming Force/Storm.** Anger is a temporary, external force that *happens to* the rational self, diminishing control and responsibility. The "cooling off period" is its half-life. Presupposes emotion is non-cognitive, visceral, and disrupts agency.
  2.  **Reasonable Person Standard (Evaluation):** Emotion as **Appropriate Judgment/Perception.** Whether anger (or its intensity) is "reasonable" treats it as a cognitive *assessment* of the situation's wrongfulness. It implies emotions track objective features of the world ("Would a decent person see this as enraging?"), making them subject to normative evaluation (right/wrong intensity).
  3.  **Emotional Distress (Proof/Injury):** Emotion as **Physiological Disturbance.** Requiring physical manifestation treats the feeling itself as legally inert until it materially impacts the body. The *feeling* is secondary; the *bodily harm* is primary. Presupposes emotion is fundamentally somatic.

  **The Inconsistency:** The "Storm" model (1) needed for excuse clashes directly with the "Judgment" model (2) used to *trigger* the excuse. The "Storm" model also contradicts the "Bodily Harm" model (3) – if rage is an overwhelming force causing loss of control, why demand *further* physical proof of its impact? The law wants anger to be both an uncontrollable reflex *and* a reasoned response, depending on whether it helps excuse or condemn.

  **If Judges Believed Emotions = Endorsed Judgments:** This cognitive view **undermines the heat-of-passion defense fundamentally.**

  *   **No "Temporary Insanity" Lite:** If rage *is* your judgment ("My honor demands vengeance!"), acting on it *is* exercising your rational (though morally bankrupt) agency. The "storm" excuse vanishes. Planning becomes evidence you *stand by* that judgment, not that you cooled off from a temporary madness.
  *   **Focus Shifts:** The key question wouldn't be "Did they have time to cool down?" but **"Was their judgment of the provocation's severity and the appropriateness of lethal response morally/legally justified?"** The "reasonable person" standard might still apply, but *only* to evaluate the *correctness* of the underlying judgment ("Would a reasonable person judge this adultery as *warranting* murder?" – clearly no), not to trigger a partial excuse based on temporary loss of control.
  *   **Concrete Change:** **Heat-of-passion discounts would likely disappear.** Killing in response to provocation would be murder or nothing. The "partial excuse" relies entirely on the "temporary storm" model of overwhelming, non-cognitive passion. If judges saw rage as a chosen (or endorsed) evaluative stance, not an overwhelming force, the rationale for the discount evaporates. Premeditated revenge killing would look like the *logical conclusion* of the judgment, not its opposite.

  **Where My Reasoning Might Break Down:** If overwhelming neuroscientific evidence emerged proving that *acute*, specific emotional states (like sudden, violent rage upon discovery) **fundamentally bypass higher cognitive function** in a way akin to a seizure or severe intoxication *only during that brief window*, then the "storm" model might retain some limited force *specifically for instantaneous reactions*. This could preserve a tiny sliver of the provocation defense based purely on temporary neurobiological override, distinct from considered judgment. However, proving this specific causal bypass reliably in court and distinguishing it from intense, rapid, but still cognitive judgments would be enormously difficult.
