  ### **Scoring Key**  
  Map each answer to a letter (A, B, C) and tally patterns. Positions are mutually exclusive; conflicting patterns trigger "uncharted territory."  

  #### **Core Positions**  
  1. **Straight Consequentialist Lesser-Eviler**  
     - Pattern: Always prioritizes harm reduction.  
     - Key Answers: 1A, 2A, 3A, 4A, 5A, 6A, 7A, 8A, 9A/B.  
     - Why: Votes lesser evil regardless of stakes. Safe-state votes (Q2, Q9) may vary if outcome is certain.  

  2. **Threshold Consequentialist**  
     - Pattern: Votes lesser evil only if the gap is large.  
     - Key Answers: 1A, 2B/C, 3A, 4A/C, 5B/C, 6A, 7C, 8A/B, 9B/C.  
     - Why: Lesser evil in high-stakes/high-gap scenarios (Q1, Q6) but not trivial/uncertain ones (Q5, Q7).  

  3. **Expressive / Low-Stakes Voter**  
     - Pattern: Treats voting like cheering—low stakes, high expression.  
     - Key Answers: 1B, 2B, 3B, 4B, 5B, 6B, 7B, 8B, 9A.  
     - Why: Always votes for favorites (Q1–Q7). Ignores moral taint if policies align (Q9A).  

  4. **Clean-Hands / Conscience Voter**  
     - Pattern: Voting as moral testimony—avoids "dirty" compromises.  
     - Key Answers: 1B, 2B, 3B, 4B, 5B, 6B, 7B/C, 8B, 9B/C.  
     - Why: Avoids lesser evil (Q1A absent, Q6B). Rejects tainted candidates (Q9B/C).  

  5. **Duty-First Civic Deontologist**  
     - Pattern: Votes out of duty, prioritizes participation over purity.  
     - Key Answers: 1A/B, 2A/B, 3A/B, 4A/C, 5A/B, 6A/B, 7A/B, 8A/B, 9A/B.  
     - Why: Always votes (skipping rare; Q8A/B). Chooses viable or ideal, but not abstention.  

  6. **Abstentionist / Participation Skeptic**  
     - Pattern: Votes only if compelled; no duty to participate.  
     - Key Answers: 1C, 2C, 3C, 4B/C (if skipping), 5C, 6C, 7C, 8C, 9C.  
     - Why: Skips unless penalty forces a vote (Q8A/B).  

  #### **Ambiguous Combinations & Notes**  
  - **Expressive (3) vs. Clean-Hands (4)**: Both vote third-party in Q1–Q7. **Split by Q9**:  
    - Expressive: Votes tainted candidate if policies align (**9A**).  
    - Clean-Hands: Rejects tainted candidate (**9B/C**).  
  - **Uncharted Territory**:  
    - Mixing high-duty (e.g., Q8A) with frequent abstention (Q1C, Q2C).  
    - Consequentialist answers (Q1A, Q6A) with expressive/clean-hands in safe states (Q2B, Q9A).  
    - *Why?* Rare—may reflect context-dependent reasoning or unresolved conflict.  
  - **Incoherent?**:  
    - Voting lesser evil in trivial-difference races (Q5A) but skipping in high-stakes ones (Q1C, Q6C).  
    - *Why?* Strategically inconsistent; likely an error or extreme pragmatism.  

  #### **Why This Works**  
  - **Concrete > Abstract**: Scenarios force principled choices without labels (e.g., Q4 tests strategic coordination; Q9 splits expressive/conscience).  
  - **Low-Cognition Load**: Answers are short, options balanced.  
  - **Audience-Tailored**: No jargon; positions explained post-quiz.  
  - **Robust Sorting**: Thresholds (Q5 vs. Q6), stakes (Q1 vs. Q2), and moral purity (Q9) differentiate positions.  

