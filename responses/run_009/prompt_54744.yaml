  ### **What Kind of Voter Are You Actually?**  
  *Answer based on what you’d do in these scenarios. No right or wrong answers—just what feels true to you.*  

  #### **Question 1**  
  You live in **Ohio (a swing state)**. The two viable candidates are both bad, but one is clearly worse. Your favorite third-party candidate is polling at 4%. What do you do?  
  - A) Vote for the "lesser evil" to block the worse candidate  
  - B) Vote for your third-party favorite  
  - C) Skip voting  

  #### **Question 2**  
  You live in **California (safe state, predictable outcome)**. The two viable candidates are both bad, but one is clearly worse. Your favorite third-party candidate is polling at 4%. What do you do?  
  - A) Vote for the "lesser evil"  
  - B) Vote for your third-party favorite  
  - C) Skip voting  

  #### **Question 3**  
  In a swing state, you find both major candidates morally unacceptable. You’re considering writing in an ideal candidate (who won’t win) or deliberately spoiling your ballot. What do you do?  
  - A) Vote for the "lesser evil" anyway  
  - B) Write in your ideal candidate or spoil the ballot  
  - C) Skip voting  

  #### **Question 4**  
