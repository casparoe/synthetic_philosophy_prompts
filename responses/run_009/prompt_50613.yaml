prompt: |-
  So next month I'm giving a talk at a workshop on ethics and war, defending Anscombe's line on Truman. Quick setup in case you don't know it: when Oxford gave Truman an honorary degree in 1956, Anscombe was one of the dons who protested, and she wrote a pamphlet about it arguing that praising a bad action makes you share in its guilt. Her actual argument was that choosing to kill the innocent as a means to your end is murder, full stop -- not a bad tally in a calculation, murder. And she thought Hiroshima and Nagasaki were exactly that: not foreseen side effects of hitting a military target, but the point of the act. On her use of "innocent" she just means people who aren't fighting, so the standard comeback "the Japanese civilians weren't morally innocent" misses.

  The audience is the tricky part. It's a just war crowd: several Walzerians who think the bombing of cities can sometimes be justified by necessity, one guy who has published on double effect for two decades and knows every move in that literature, a couple of straight utilitarians who think the invasion alternative makes the arithmetic obvious, and a historian who will show up with casualty estimates for a land invasion of Japan. Nobody there thinks killing civilians is fine as such -- the room agrees on discrimination as a principle -- which is exactly why the objections will come from inside my own framework and not from outside it.

  Draft me a Q&A prep sheet: the eight or so objections I'll actually get from this room (not the ones a freshman would raise), ordered by how much damage each would do, each phrased the way that specific person would phrase it. For each give me a two minute reply and be honest about where the reply is soft -- I'd rather know now. Also tell me what I should concede up front. And include the question I'm hoping nobody asks. I have a feeling I know which one it is (hint: she wasn't exactly keen on Britain fighting that war in the first place, and someone will have looked that up), but tell me if there's a worse one I haven't thought of.
reasoning: |-
  Okay, the user is preparing for a workshop on ethics and war, specifically defending Elizabeth Anscombe's stance against Truman receiving an honorary degree due to the bombings of Hiroshima and Nagasaki. The audience consists of just war theorists, Walzerians, double effect experts, utilitarians, and a historian. 

  First, I need to recall Anscombe's argument: she condemned Truman because intentionally killing innocent civilians as a means to an end is murder, not just a regrettable part of wartime calculus. The key here is her definition of "innocent" as non-combatants, not moral innocence. 

  The user's main challenge is anticipating sophisticated objections from experts who share the principle of discrimination but disagree on application. They want a Q&A prep sheet with eight high-level objections, ranked by potential damage, each phrased authentically, with two-minute rebuttals and honesty about weaknesses. They also want upfront concessions and the "nightmare question."

  Hmm... the audience composition is crucial. The Walzerians will focus on supreme emergency, the double effect scholar will dissect intention-foresight distinction, utilitarians will argue numbers, and the historian brings data. Anscombe's rigidity makes her vulnerable to "all-or-nothing" critiques. 

  Top objections should include: 
  1. Double effect expert questioning intention vs. foresight (high damage—undermines core premise). 
  2. Historian's numbers on invasion casualties (hard to dismiss emotionally). 
  3. Walzerian "supreme emergency" framing (challenges absolutism). 
  4. The "slippery slope" objection about conventional bombing (exposes inconsistency). 
  5. Utilitarian calculus (ignored by Anscombe). 
  6. "Punishing Truman personally" (risks moral grandstanding charge). 
  7. Her pacifist-leaning WWII stance (hypocrisy angle). 
  8. The nightmare question: "What *should* Truman have done?" (forces impracticality). 

  For concessions: admit historical uncertainty about alternatives but stress that doesn't change the moral principle. The nightmare question is worst because it demands a feasible alternative when Anscombe offers none—weakest point. 

  User’s hinted fear (her ambivalence on Britain’s war entry) is bad but manageable; the "no alternative" question is structurally harder. In replies, stand firm on the act-intent distinction but concede where Anscombe’s framework lacks nuance (e.g., total war contexts). 

  Biggest risk: Sounding dogmatic. Prep should balance unwavering principle with intellectual humility where arguments are brittle. Highlight that her position is about moral clarity, not practicality.
answer: |-
  Here's a targeted Q&A prep sheet for your Anscombe defense, prioritizing high-level objections from this specific audience, ranked by potential damage. I've phrased them as they'd likely ask and provided concise replies acknowledging soft spots.

  **Concessions to Make Upfront:**
  1.  **Historical Uncertainty:** Admit the debate about Japanese surrender motives, casualty projections for invasion (Downfall), and alternative bomb targets/demonstrations is complex and contested. Anscombe's argument focuses on the *moral character of the act as chosen*, assuming the worst-case interpretation of Truman's intent.
  2.  **Absolutism:** Concede that Anscombe's position (like Catholic natural law doctrine she drew from) is morally absolutist regarding intentional killing of innocents. This makes it rigid and potentially incompatible with consequentialist or "supreme emergency" frameworks. Its strength is clarity, its weakness is inflexibility.
  3.  **Focus on the Act:** Clarify you are defending Anscombe's *critique of the specific act* of bombing Hiroshima/Nagasaki *as she interpreted it*, and the principle that *praising* such an act is complicity, not necessarily judging the entire Pacific War or Truman's entire character.

  **Objections Ranked by Damage (Highest to Lower):**

  1.  **The Double Effect Expert (Phrased precisely):** "Professor, Anscombe relies entirely on a sharp distinction between *intending* the civilians' deaths as a means and merely *foreseeing* them. But the historical record shows multiple objectives: ending the war swiftly, avoiding invasion (saving lives), *and* demonstrating power to the Soviets. Given this complex web of intentions, how can you be certain the civilian deaths weren't merely a foreseen side-effect of destroying key industrial/military nodes (like other wartime bombings), rather than the *intended means*? Isn't this an oversimplification of intention in complex state decisions?"
      *   **Reply (2 mins):** "You're right, intention in statecraft is complex. Anscombe's point is that for DE to apply, the *bad effect* must not be *sought* for its own sake or *as the chosen method to achieve the good end*. Truman's own statements post-war ('I regarded the bomb as a military weapon... never had any doubt it should be used') and the deliberate *selection of cities* (not isolated military targets) combined with the *known* overwhelming civilian death toll as the mechanism to shock surrender, strongly indicate the civilian destruction wasn't merely a side-effect; it *was* the instrument. The primary objective (surrender) was to be achieved *through* their annihilation. DE requires proportionality and necessity *even for side-effects* – the scale here arguably fails that too – but the core is the intentional *use* of innocents."
      *   **Soft Spot:** Requires interpreting Truman's intent *against* his later justifications. Relies on the *nature of the target* as proof. A sophisticated DE scholar can muddy these waters expertly.

  2.  **The Historian + Utilitarian (Combined Impact):** "Your argument hinges on condemning Truman for not choosing the invasion. But my research shows Operation Downfall projected *millions* of Japanese casualties (military/civilian) and hundreds of thousands of Allied deaths. Starvation from the blockade was already rampant. Given the *actual, known alternatives at the time*, wasn't the atomic bombing, however horrific, the *least terrible* option available to achieve surrender and save *more* innocent lives overall? Doesn't Anscombe's absolutism ignore this horrific reality and the duty to minimize total suffering?"
      *   **Reply (2 mins):** "The projections are indeed grim, and the suffering immense. Anscombe wouldn't deny the horror of the alternatives. Her point is categorical: *one cannot do evil that good may come*. Intentionally killing innocents as a means is intrinsically evil, regardless of the consequences. Even if the arithmetic *were* clear-cut (and historians debate the imminence of surrender/effectiveness of alternatives), it remains murder. Morality isn't solely arithmetic. Praising such a choice, even one made under duress, condones the principle that killing innocents is a permissible tool. That principle is corrosive."
      *   **Soft Spot:** Sounds callous towards very real suffering. Ignores the practical burden of command. The "duty to minimize total suffering" argument resonates powerfully. Requires standing firm on absolutism despite horrific numbers.

  3.  **The Walzerian (Supreme Emergency):** "Anscombe's position is admirably clear but untenable in the face of a true 'Supreme Emergency.' Japan in 1945 wasn't Nazi Germany in 1941, but the cost of prolonging the war (especially for occupied Asia, POWs, and facing invasion) was catastrophic. Doesn't Walzer's framework – where the imminent threat of an ultimate evil *can*, with the heaviest heart and under strict constraints, temporarily override the principle of non-combatant immunity – better capture the tragic moral dilemma Truman faced? Doesn't condemning him outright fail this tragic dimension?"
      *   **Reply (2 mins):** "Walzer's concept is powerful, but Anscombe would reject it as a dangerous erosion of a fundamental moral barrier. She argued there *is no threshold* where murder becomes permissible. The 'supreme emergency' exception risks becoming a slippery slope. More crucially for her protest: *even if* one agonizingly accepts the bombing under supreme emergency (which she wouldn't), this doesn't make it *praiseworthy*. Granting an honorary degree celebrates the act and the man who ordered it, turning a tragic (if perhaps necessary) evil into an occasion for honor. That is what she protested."
      *   **Soft Spot:** Doesn't fully engage with the "tragic choice" narrative Walzerians favor. Concedes (implicitly) that the *act* might be seen as necessary by some, weakening the condemnation.

  4.  **The Slippery Slope / Consistency Objection (Sharp Ethicist):** "If intentionally killing non-combatants as a means is always murder, full stop, doesn't this condemn *all* strategic bombing in WWII that targeted cities (Dresden, Tokyo firebombing) with the same severity? And if so, how consistent was Anscombe? Did she protest honors for Churchill or Harris? Doesn't this absolutism risk paralyzing necessary state action in war altogether, or lead to hypocrisy in its application?"
      *   **Reply (2 mins):** "Anscombe was indeed consistent. She opposed the Allies' area bombing campaigns on the same principle. Her protest against Truman was a specific, public occasion. Her broader writings condemn intentional attacks on civilians categorically. The charge of hypocrisy doesn't stick against *her*, though it might against institutions. The 'paralysis' argument is the perennial critique of absolutism. Her response is that some acts are simply beyond the pale, and finding warfighting methods that avoid them is the moral imperative, even if difficult. The alternative is normalizing murder."
      *   **Soft Spot:** Forces you into defending the condemnation of *all* Allied strategic bombing, which is historically/politically fraught. The "paralysis" charge is hard to fully dispel practically.

  5.  **The Utilitarian Calculus (Direct):** "Setting aside 'murder' labels, the cold arithmetic seems undeniable: X dead in Hiroshima/Nagasaki < Y dead in invasion/blockade continuation. Truman saved net lives, including Japanese lives. Isn't refusing this calculus, and condemning the man who acted on it, prioritizing moral purity over actual human well-being?"
      *   **Reply (2 mins):** "Utilitarianism has its place, but Anscombe argues it fundamentally misunderstands morality. Some acts are intrinsically wrong, regardless of consequences. Doing evil *is never* the path to good, even if the numbers seem to add up. The 'net lives saved' argument justifies atrocities if the scale tips 'favorably'. This logic can justify terrifying acts. Praising Truman for this calculation endorses this logic. Moral principles exist precisely to restrain us when calculations tempt us towards atrocity."
      *   **Soft Spot:** Dismisses consequentialism entirely, which many find unsatisfying, especially when numbers are large. Doesn't offer a practical alternative path within the utilitarian framework.

  6.  **Punishing Truman Personally? (Ethicist focused on character):** "Even if the *act* was morally wrong, is it fair to single out Truman *personally* for condemnation and denial of an honor? He bore immense responsibility, acted on the best advice available (military, scientific), and faced unimaginable pressure. Doesn't Anscombe's protest verge on moral grandstanding, failing the virtue of compassion for the decision-maker in an impossible position?"
      *   **Reply (2 mins):** "Anscombe's protest wasn't primarily about 'punishing' Truman, but about *Oxford University's action* in bestowing honor. Her point is that *praising* a gravely immoral act implicates the praiser in its wrongness. It normalizes and approves. While we can acknowledge the pressure Truman faced, honoring the *choice* itself sends the message that such actions are worthy of celebration. Institutions, especially universities, have a duty to uphold moral standards, not blur them under pressure or for expediency."
      *   **Soft Spot:** Can sound unsympathetic. Requires distinguishing condemnation of the *act and its praise* from a full judgment of Truman's character or mitigating circumstances.

  7.  **Her Broader WWII Stance (The Researched Objector - Your Hint):** "Professor, isn't there an inconsistency in Anscombe's position? She famously opposed Britain's entry into WWII, arguing it didn't meet the strict *jus ad bellum* criteria of a just war, particularly just cause and proportionality. If the *entire war effort* was unjust in her view, how can she then apply *jus in bello* principles (like non-combatant immunity) *within* that war to condemn Truman? Doesn't her *ad bellum* stance undermine the coherence of her *in bello* protest?"
      *   **Reply (2 mins):** "This is a perceptive point. Anscombe's *ad bellum* stance was indeed controversial. However, her *in bello* argument against intentionally killing innocents stands independently. Even within an unjust war, or a war whose justice is contested, certain acts remain intrinsically immoral. One cannot murder innocents *even if* fighting in a dubious cause. Her protest against honoring Truman focused specifically on the *act* of bombing the cities, which she saw as a clear *in bello* crime, regardless of the broader *ad bellum* context. The two levels of analysis are separable."
      *   **Soft Spot:** Does feel somewhat like special pleading. It weakens her *moral authority* on the war issue generally, even if the *in bello* logic is internally consistent. Be ready for a follow-up on hypocrisy.

  **The Nightmare Question (Worse Than Your Hint):**

  *   **"What Should Truman Have Done?":** "Okay, Professor. You've powerfully argued that bombing Hiroshima and Nagasaki, as an intentional act of killing innocents to coerce surrender, was murder and absolutely impermissible. You've conceded the alternatives were horrific. So, *specifically*, what course of action *should* President Truman have taken on August 6th, 1945, that was both morally permissible *and* plausibly effective in ending the war and saving lives, given the actual information and constraints he faced? And if no such course existed, does that not force a tragic choice where Anscombe's absolutism offers only condemnation, not a viable path forward?"
      *   **Why it's the Nightmare:** This hits the **core vulnerability of absolutism**: its potential impracticality in extreme situations. It forces you to either:
          1.  **Propose a specific alternative:** Risky (historical minefield, might sound naive - e.g., "wait for Soviet entry," "demonstration bomb," "modified surrender terms," "accept higher invasion casualties") and immediately debated on effectiveness.
          2.  **Admit no clear permissible alternative existed:** Makes Anscombe's position seem like offering only condemnation with no solution, potentially undermining its relevance for real-world statecraft. Plays into the "paralysis" critique.
          3.  **Fall back on principle:** "His duty was to *not commit murder*, regardless of consequences" – sounds dangerously close to "Let justice be done though the heavens fall," which many find unacceptable when the "heavens falling" means millions dead.
      *   **Best Possible Reply (2 mins - Focus on Principle & Burden):** "This is the hardest question, and it exposes the tension Anscombe acknowledged. Her point isn't to provide a winning military strategy, but to assert an inviolable moral boundary. Facing a genuine dilemma where *every* option involves grave evil is a mark of profound tragedy, not a justification for crossing the fundamental line against intentional killing of innocents. Truman's *duty* was to exhaust every conceivable alternative – including accepting higher military casualties, pursuing diplomatic avenues with even greater vigor, or even accepting a longer war with its attendant horrors – *before* resorting to an intrinsically evil act. The burden of proof for crossing that line is immense and arguably wasn't met. Sometimes, morality demands we bear a terrible cost rather than commit an atrocity. Praising the choice to cross that line is what Anscombe protested."
      *   **Soft Spot:** It *is* soft. It doesn't provide a satisfying "answer." It risks sounding morally righteous but practically vacuous or even monstrous to those weighing the projected casualties. Be prepared for significant pushback.

  **Key Prep Strategy:**

  *   **Anchor in Act/Intent:** Constantly bring it back to the *nature of the specific act* (intentional killing of innocents as a means) and the *act of praising it*.
  *   **Embrace the Absolutism:** Don't shy away; clarify its grounding and why it's necessary despite its harshness.
  *   **Concede Historical Complexity:** But separate it from the core moral principle.
  *   **Address the "Praise" Aspect:** Emphasize why honoring the *act* through the degree is the core issue, separate from judging Truman's soul or the war entirely.
  *   **Anticipate the Nightmare:** Practice that reply until it's as clear and principled as possible. Acknowledge the tragedy without conceding the principle.

  Good luck! Your audience is tough but engaging them on this level is exactly where the important debate happens.
