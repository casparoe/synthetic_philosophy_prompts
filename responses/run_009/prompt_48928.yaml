prompt: |-
  You are a philosopher of education with practical experience designing professional training curricula. I run curriculum development at a flight training academy, and I need a decision procedure for classifying the competency statements we inherit from regulators and safety boards — anything from "state the crosswind limitations for this aircraft" to "execute an instrument approach" to "know when to abort a takeoff" — as knowing-that, knowing-how, or something the distinction doesn't cleanly capture. The classification matters practically: it determines whether we teach an objective in the classroom, in the simulator, or through supervised line experience, and whether regulation permits a written test as the assessment. Before writing the procedure, think carefully about where the philosophical debate actually bites for this use: the intellectualist claim that knowing-how is just a species of knowing-that, the cases of expertise that resist articulation (the senior pilot who cannot say how she knows an approach is going wrong but knows), and objectives that seem to change category as trainees gain experience, with facts absorbed into fluent performance. Then write the procedure itself: the questions to ask of a competency statement in order, what counts as a sufficient answer to each, where it stops and hands the decision to a curriculum committee because the question is one of values rather than classification, and which steps are honest judgment calls dressed up as procedure. Finish by running it on three statements: "state the fuel requirements for a diversion," "manage a slow cabin decompression," and "demonstrate sound aeronautical decision-making." If it classifies the third as something other than a teachable objective — which I suspect it will, and which would be inconvenient for us — let it, and tell me what to do about it.
reasoning: |-
  Okay, the user is in charge of curriculum development at a flight training academy and needs a practical decision procedure for classifying competency statements. They mention inheriting statements from regulators and safety boards, ranging from factual knowledge like stating crosswind limitations to complex skills like executing an instrument approach or knowing when to abort a takeoff. 

  The classification directly impacts how they teach and assess these competencies—classroom vs. simulator vs. real flight—and whether written tests are permissible under regulations. They also hint at philosophical tensions: the intellectualist view (knowing-how as knowing-that), tacit expertise (e.g., the senior pilot who can't articulate why an approach feels wrong), and how objectives might shift categories as trainees gain experience. 

  First, I need to unpack the practical stakes. Misclassifying could lead to ineffective training—e.g., teaching "abort takeoff" judgment as rote facts in a classroom, or trying to simulate "aeronautical decision-making" (ADM) in a way that doesn’t transfer to real crises. Regulation is another layer: written tests might suffice for knowing-that but fail for knowing-how, potentially violating safety standards. 

  The philosophical debates matter where they create real ambiguity. For instance:  
  - **Intellectualism**: If knowing-how is just knowing-that, everything could be shoved into classroom training. But that ignores embodied skills (e.g., muscle memory in crosswind landings).  
  - **Tacit knowledge**: Some expertise resists articulation (Polanyi’s "we know more than we can tell"). A checklist might capture steps for "manage decompression," but not the veteran’s gut feel for subtle cues.  
  - **Category fluidity**: "State fuel requirements" starts as knowing-that but later becomes internalized into a pilot’s instinct during diversions. Training must bridge that gap.  

  The procedure must be a flowchart-like interrogation of each competency statement, with clear exit points for committee decisions when values or context dominate. It should also flag where "judgment calls" are inevitable (e.g., when articulation is partial).  

  For the test cases:  
  1. **"State fuel requirements"**: Clearly knowing-that—verbalizable, testable via written exam.  
  2. **"Manage slow decompression"**: Knowing-how. Requires simulator practice (procedural steps + sensory cues like ear popping).  
  3. **"Demonstrate sound ADM"**: This will likely fall outside knowing-that/knowing-how. ADM involves metacognition, ethics, and context-dependent judgment. You can’t "teach" it in a classroom or simulator alone; it needs mentored experience + reflection. The user anticipates this "inconvenient" result—so I’ll suggest workarounds: scaffold ADM through curated scenarios, use cognitive apprenticeships, and accept that assessment must be holistic (e.g., LOFT evaluations).  

  Finally, the procedure must acknowledge its own limits. Some steps are "honest judgment calls" (e.g., Step 3 on articulation depth). No taxonomy perfectly captures reality, so the committee’s role is crucial for edge cases.  

  User’s deeper needs: They want rigor without philosophy-for-its-own-sake. Underneath, they’re likely managing regulatory compliance, safety pressures, and training efficiency. The unspoken ask: "Help me justify training choices to auditors while producing competent pilots."  

  Procedure outline:  
  1. **Verbalizability**: Can it be fully stated? → Knowing-that.  
  2. **Physicality**: Does it demand sensorimotor skill? → Knowing-how.  
  3. **Articulation limits**: Even if verbal, does expertise outrun description? → Knowing-how (needs practice).  
  4. **Fluidity check**: Does it transition from knowing-that to instinct? → Flag for integrated training.  
  5. **Meta-cognitive?**: Involves judgment/ethics? → "Beyond knowing-that/knowing-how" (committee territory).  

  For ADM: Classify as beyond, then advise layered training with mentorship and realism. It’s inconvenient but necessary—safety > convenience.
answer: |-
  Below is a decision procedure grounded in the philosophy of education, tailored to aviation training's practical constraints. It addresses the knowing-that/knowing-how debate where it impacts *training design* and *regulatory compliance*, while acknowledging gray areas requiring human judgment. The procedure prioritizes **safety-critical outcomes** over philosophical purity.

  ---

  ### **Decision Procedure for Classifying Competency Statements**  
  *Ask these questions in order. Stop at the first definitive classification.*

  1. **"Can this competency be fully and adequately assessed *solely* by verbal/written description of facts, rules, or procedures?"**  
     - **Yes → KNOWING-THAT**  
       *(e.g., "State crosswind limitations" – assessed via written test)*  
     - **No → Proceed to Q2**  
     - *Judgment call*: If "yes" but requires nuanced explanation (e.g., regulatory exceptions), it’s still knowing-that. Classroom delivery.

  2. **"Does competent performance *depend* on physical, sensory, or real-time sensorimotor coordination under operational conditions?"**  
     - **Yes → KNOWING-HOW**  
       *(e.g., "Execute an instrument approach" – requires simulator/line training)*  
     - **No → Proceed to Q3**  
     - *Judgment call*: Distinguish "recalling steps" (knowing-that) from "executing under stress" (knowing-how).

  3. **"Does expertise in this competency *resist full articulation*, even by experts, or rely on tacit cues (e.g., 'feel,' 'judgment')?"**  
     - **Yes → KNOWING-HOW**  
       *(e.g., "Detect incipient stall by seat-of-pants cues" – simulator/line training essential)*  
     - **No → Proceed to Q4**  
     - *Philosophical bite*: Rejects intellectualism; tacit knowledge exists (per Ryle, Polanyi). Requires experiential learning.

  4. **"Does this competency involve *context-dependent judgment*, ethical weighing, or adaptive responses to novel situations?"**  
     - **Yes → BEYOND THE DISTINCTION**  
       *(e.g., "Decide whether to divert in deteriorating weather" – requires mentored experience + reflection)*  
     - **No → Proceed to Q5**  
     - *Handoff to committee*: Values/safety tradeoffs demand expert deliberation. Classroom/simulator alone are insufficient.

  5. **"Does the competency *transition categories* with expertise? (e.g., conscious rules → unconscious fluency)"**  
     - **Yes → CLASSIFY BASED ON TRAINEE LEVEL**  
       *(e.g., New trainee: knowing-that; Advanced trainee: knowing-how)*  
     - **No → UNCLASSIFIABLE VIA PROCEDURE → Handoff to curriculum committee**  
     - *Practical note*: Design progressive training (facts → practice → internalization).

  ---

  ### **Where Judgment Dominates**  
  - **Q1/Q2/Q3**: "Sufficient answers" rely on SME consensus and accident data (e.g., if mishaps occur due to poor recall → knowing-that; if due to execution errors → knowing-how).  
  - **Q4/Q5**: Explicitly hand off to the curriculum committee. These involve **values**: How much risk is acceptable in training? What "judgment" scaffolding is feasible?  

  ---

  ### **Application to Your Examples**  

  1. **"State the fuel requirements for a diversion"**  
     - Q1: **Yes** – Verbatim recall of regulations/procedures.  
     - → **KNOWING-THAT**  
     - *Training*: Classroom (theory) + written test.  

  2. **"Manage a slow cabin decompression"**  
     - Q1: *No* – Recalling steps ("knowing that") is insufficient; must execute procedures under stress.  
     - Q2: **Yes** – Requires sensorimotor actions (mask donning, emergency descent) and sensory processing (cabin pressure cues).  
     - → **KNOWING-HOW**  
     - *Training*: Simulator (practice emergencies) → supervised line experience.  

  3. **"Demonstrate sound aeronautical decision-making (ADM)"**  
     - Q1: *No* – Written tests assess knowledge *of* ADM models, not actual decision-making.  
     - Q2: *No* – Not primarily physical (though context may involve it).  
     - Q3: *Partially* – Experts use tacit cues, but ADM frameworks are articulable.  
     - Q4: **Yes** – Core is judgment: weighing risks, ethical factors, and novel variables.  
     - → **BEYOND THE DISTINCTION**  
     - *Inconvenient truth*: ADM isn’t cleanly "teachable" via classroom/simulator alone. It emerges from supervised experience, reflection, and mentorship.  

  ---

  ### **What to Do About ADM (and Similar "Beyond" Competencies)**  
  1. **Admit the limits**: No classroom lesson or simulator session can "teach" expert judgment.  
  2. **Scaffold progression**:  
     - **Knowing-that layer**: Teach ADM models (e.g., DECIDE, 3P) in the classroom.  
     - **Knowing-how layer**: Simulator scenarios practicing model application.  
     - **Beyond layer**:  
       - **Supervised line experience**: With debriefs focusing on decisions.  
       - **Cognitive apprenticeships**: Senior pilots co-narrate decisions during flights.  
       - **High-fidelity simulation**: LOFT (Line Oriented Flight Training) with open-ended scenarios.  
  3. **Assessment**: No written tests. Use:  
     - Behavioral observation tools (e.g., NOTECHS).  
     - Structured assessments of decisions in sims/line flying.  
     - Reflective journals reviewed by instructors.  
  4. **Own the values call**: The curriculum committee must define "sound ADM" thresholds (e.g., "Prioritizes safety over schedule in 95% of simulated dilemmas").  

  ---

  ### **Why This Works**  
  - **Safety-centered**: Avoids over-reliance on written tests for physical/tacit skills.  
  - **Regulator-ready**: Maps to Intl. Civil Aviation Org (ICAO) competency frameworks (e.g., "Knowledge" vs. "Skill" vs. "Application").  
  - **Philosophically honest**: Acknowledges where the distinction collapses (ADM) without abandoning structure.  
  - **Adaptive**: Uses trainee level to handle category transitions (e.g., emergency procedures move from "that" to "how" as muscle memory develops).  

  The procedure doesn’t eliminate judgment—it flags *where* judgment is needed and who owns it. For ADM, this is a feature: treating it as "knowing-that" would be unsafe, while treating it as pure "knowing-how" undersells its cognitive depth. The solution lies in layered, experiential, and mentored training.
