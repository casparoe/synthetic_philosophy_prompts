prompt: |-
  My brother and I have been arguing about quantum immortality for like three months and before we do another round I want us to at least agree on what would count as settling it. So write me the spec: the list of things any adequate treatment of the quantum suicide argument has to deliver, with the case behind each, and mark which are non-negotiable versus just what one camp wants.

  Some things I think belong on the list but I might be wrong, you tell me. It has to say what happens to probability when every branch contains a live observer -- does it go to zero, become self-locating, just become undefined? It has to respect the Born rule somehow: the branches where the bullet grazes you instead of going through your head have vanishing measure, so does "you will find yourself alive" carry any weight at all when the total measure of the survival branches tends to zero? That one feels load-bearing but I can't tell if it's fatal or just a technicality. It has to distinguish the metaphysical reading from the decision-theoretic one (a claim about what will happen vs a claim about what you should expect or choose), because my brother keeps sliding between them mid-argument. It has to deal with the fact that dying is rarely instant -- the branch where you linger badly injured for two weeks counts as "surviving" in the naive world-counting sense, which seems to break whatever intuition the argument was riding on. And here's one I suspect people skip: the argument, even if it works, seems to give you immunity to sudden death, not immortality -- aging is a slow leak, not a coin flip, so the measure of functional-you can decay continuously instead of branching cleanly. Does any version of the argument actually address that, or is "quantum immortality" just false advertising for "quantum no-sudden-death"?

  Also, if you think some subset of the desiderata is jointly unsatisfiable, say so and say which -- that's the part I most want. My brother claims the Born-rule requirement and the guaranteed-survival intuition can't both be satisfied, I'm not sure he's right, and I'd rather have the tension located precisely than argued about over dinner again.

  Skip scoring actual interpretations or named positions against the list, we'll do that ourselves. Just make sure the last line is machine-readable: \answer{...} naming the single requirement from your list that does the most to exclude bad treatments of the argument.
reasoning: |-
  Okay, the user wants me to create a specification for evaluating arguments about quantum immortality. They've been arguing with their brother for three months and want clear criteria to settle their debate. 

  First, I need to understand what quantum immortality entails. It's a thought experiment derived from the many-worlds interpretation of quantum mechanics. The idea is that in a setup where a quantum event could kill you (like a gun triggered by radioactive decay), from your perspective, you always survive because you only experience the branches where you're alive. But this raises several philosophical and technical issues.

  The user has listed several concerns they want addressed in the spec:
  - What happens to probability when every branch has a live observer?
  - How to respect the Born rule (which assigns probabilities to outcomes)
  - Distinguishing metaphysical claims from decision-theoretic ones
  - Accounting for non-instant death (like lingering injuries)
  - Whether this only prevents sudden death rather than granting true immortality

  I think the core tension is between subjective experience and objective probability. The Born rule says survival branches have vanishingly small probability as experiments repeat, yet the quantum immortality argument suggests you'll subjectively always find yourself alive. 

  For the spec, I'll need to include requirements that address:
  1. Observer-Centric Outcome Specification - defining what counts as "survival" from the observer's perspective
  2. Probability Measure Treatment - how to handle probabilities across branches
  3. Born Rule Compliance - ensuring interpretations respect quantum probabilities
  4. Mind/Identity Continuity - what constitutes "you" surviving
  5. Distinguishing Metaphysical from Decision-Theoretic Claims
  6. Non-Instantaneous Death Accounting
  7. Scope Delimitation - clarifying this only prevents quantum-mechanical sudden death, not aging

  The most critical requirement is probably Observer-Centric Outcome Specification because if we don't properly define what counts as survival from the observer's perspective, the whole argument collapses. A flawed definition here could make the quantum immortality claim trivial or nonsensical.

  I should emphasize that some of these requirements may be in tension, particularly Born Rule Compliance versus the intuition of guaranteed survival. The Born rule says the probability of surviving many trials becomes infinitesimal, while the quantum immortality argument suggests you'll always subjectively experience survival. This tension might be mathematically unresolvable, pointing to a fundamental limitation in the argument.

  The spec should help the user and their brother identify exactly where their disagreements lie - whether in definitions, probability interpretation, or scope of the claim - rather than talking past each other. The machine-readable answer will highlight the most foundational requirement to focus their discussion.
answer: |-
  Here's a specification for evaluating treatments of the quantum suicide/immortality argument. Items marked **[Non-Negotiable]** are essential for any coherent treatment addressing the core argument. Others are critical for resolving common disputes but might be approached differently by valid interpretations.

  ### Core Specification for Evaluating Quantum Suicide/Immortality Arguments

  1.  **Observer-Centric Outcome Specification [Non-Negotiable]:**  
      *   **Requirement:** Precisely define what constitutes "survival" and "death" *from the perspective of the observer* undergoing the experiment. This must include the temporal and functional boundaries (e.g., "conscious experience continues uninterrupted for at least X time after the event," "neurological function sufficient for subjective experience persists").  
      *   **Case:** Without this, arguments founder on vagueness (e.g., "lingering injury survival," "brain-dead survival"). The core intuition relies on subjective continuity.

  2.  **Probability Measure Treatment [Non-Negotiable]:**  
      *   **Requirement:** Explicitly state how standard probability (governed by the Born rule) relates to the *subjective anticipation* or *first-person outcome* of the observer in the experiment. Explain the status of the Born rule measure across branches containing conscious observers.  
      *   **Case:** This is the heart of the debate. Does measure become irrelevant for first-person survival expectation? Does it translate to self-locating uncertainty? Is probability "undefined" for the observer post-experiment? Ignoring this renders the argument meaningless.

  3.  **Born Rule Compliance [Non-Negotiable]:**  
      *   **Requirement:** Acknowledge and account for the Born rule assigning measure to branches. Explain why the vanishing measure of long-term survival branches (in repeated experiments) does or does not invalidate the "guaranteed subjective survival" claim for the next trial (or a finite sequence).  
      *   **Case:** The Born rule is a core, empirically supported principle of QM. Treatments that ignore the implications of vanishing measure for frequentist survival (e.g., after many trials) or dismiss the Born rule entirely are inadequate. The tension between measure and subjective survival expectation must be addressed.

  4.  **Mind/Identity Continuity Requirement:**  
      *   **Requirement:** Specify the assumed theory of personal identity/mind relevant to "survival." Does it rely on continuity of consciousness? Physical brain state? Pattern identity? Explain how this interacts with branching.  
      *   **Case:** Whether the "I" in the next conscious moment is "me" is crucial for the argument's force. Different identity theories (e.g., psychological continuity vs. brute physical identity) yield different conclusions about whether "I" survive in a branch.

  5.  **Metaphysical vs. Decision-Theoretic Distinction [Non-Negotiable]:**  
      *   **Requirement:** Clearly separate:  
          (a) **Metaphysical Claim:** What *happens* to the observer (e.g., "You *will* subjectively experience survival").  
          (b) **Decision-Theoretic Claim:** What an agent *should anticipate* or *prefer* based on the argument (e.g., "You *should expect* to survive," "You *should be indifferent* to setting up the experiment").  
      *   **Case:** Conflating "what happens" with "what you should believe/do" is a common source of confusion. The argument's implications for action (e.g., playing Russian roulette) are distinct from its claims about reality. Treatments must avoid equivocation.

  6.  **Non-Instantaneous Death & Degradation:**  
      *   **Requirement:** Address how non-binary, gradual outcomes (e.g., severe injury, slow degeneration, locked-in syndrome) impact the argument. Does "survival" require minimal functionality? How does measure apply to degraded states?  
      *   **Case:** Real death is rarely instantaneous. The naive "live observer in every branch" claim loses force if most "survival" branches involve profound suffering or non-functional existence. Measure considerations are amplified here.

  7.  **Scope Delimitation (Immortality vs. No-Sudden-Death):**  
      *   **Requirement:** Explicitly state the scope of the claimed "immortality." Does it apply *only* to death by specific quantum-triggered events (suicide experiment), or extend to all causes of death (aging, disease, macro-events)? Justify the scope limitation if present.  
      *   **Case:** "Quantum Immortality" is often misleading. The core argument only directly addresses *sudden, quantum-mechanism-dependent death*. Extending it to aging (a slow, thermodynamically driven, largely *decohered* process lacking clean "survival branches") requires significant, often unsupported, additional assumptions. Treatments must clarify scope.

  ### Key Tensions & Potential Incompatibilities

  *   **The Central Tension:** **Born Rule Compliance (Requirement 3)** and the strong intuition of **"Guaranteed Subjective Survival for the Next Trial"** (often motivating Requirement 2's treatment) *are in fundamental tension*. The Born rule dictates that the *measure* of branches where you survive N trials becomes exponentially small as N increases. Some interpretations resolve this by:
      *   Denying probability applies to first-person outcomes post-branching (making Requirement 2 about measure irrelevant for anticipation).
      *   Reinterpreting probability as self-locating uncertainty over surviving branches (but the *weight* of that uncertainty may still be tied to measure).
      *   Accepting that while *you* subjectively survive the *next* trial, the *probability-weighted expectation* of surviving many trials is near zero *before any trials start*.
  *   **Scope vs. Expectation:** The argument's intuitive force relies on **Observer-Centric Outcome Specification (Requirement 1)** implying "I keep experiencing things." **Scope Delimitation (Requirement 7)** starkly limits this, making true "immortality" from aging highly implausible under standard physics.
  *   **Identity vs. Measure:** **Mind/Identity Continuity (Requirement 4)** interacts critically with measure. If identity requires strict continuity, branching itself might be seen as death for the "original" identity in *all* branches, negating the argument entirely. If identity follows branches, measure might influence "which future you is more likely to be 'you'".

  ### Most Excluding Requirement
  The requirement that does the most to exclude inadequate or misleading treatments is **Born Rule Compliance**. Ignoring or hand-waving away the implications of the Born rule measure for the subjective experience of repeated experiments is the most common failure mode, leading to unsupportable claims of literal immortality or trivializing the profound tension at the argument's core. A treatment cannot be adequate without rigorously confronting this.

  \answer{Born Rule Compliance}
