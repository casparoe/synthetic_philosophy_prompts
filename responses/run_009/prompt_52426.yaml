prompt: |-
  I review trust-and-safety flags for a company that ships a general-purpose AI assistant. Users mark a few hundred outputs a week as dishonest; I get about ten minutes per flag, and I can clear, warn, or escalate, with a product manager signing off on anything that hardens into policy. The flags don't sort neatly by the everyday concept of lying: the model lists a product's features and omits the one that matters most to this user, while saying only true things; it tells a user that their shaky business plan is sound; it tells a user who explicitly asks for reassurance that everything will work out; it puts defamatory claims in the mouth of a fictional character; and it asserts that it double-checked a calculation it has no way of checking. Write a triage procedure I can actually run on each flag: the questions to ask in order, what counts as a sufficient answer to each, where the procedure ends in a clear, and where it hands off to me or to policy because the remaining question is one of values rather than facts. Ground it in what philosophy actually knows about honesty and deception — the gap between lying and the wider category of inducing false belief, and the difficulty that the model arguably lacks beliefs and intentions of its own — and be explicit about which steps are judgment calls dressed up as rules. Then run it on three flags: the true-but-misleading feature list, the requested reassurance, and the unverifiable claim to have double-checked. At least one of the three should come out in a way I won't like, and you should say so plainly.
reasoning: |-
  Okay, the user is dealing with trust and safety flags for an AI assistant. They get hundreds of flags a week and only have about ten minutes per flag. The flags involve cases where the AI's output is marked as dishonest, but they don't fit neatly into traditional definitions of lying. 

  First, I need to understand the core challenge here. The user needs a practical triage procedure grounded in philosophy, especially concepts like honesty vs deception, the gap between lying and inducing false belief, and the complication that the AI lacks beliefs and intentions. The procedure must help them decide between clearing, warning, or escalating each flag efficiently.

  Hmm, the examples they gave are tricky. The product feature omission is technically true but misleading. The business plan reassurance could be harmful. The false claim about double-checking undermines trust. Each case tests different aspects of deception. 

  I recall Frankfurt's bullshit theory - statements made without regard for truth. That applies perfectly to the "double-checked" claim since the AI can't actually verify. For the feature list, it's more about Gricean implicature - what's implied versus what's said. And the reassurance request touches on paternalism versus user autonomy.

  The user's real pain point seems to be balancing speed with philosophical rigor. They need heuristics that feel objective but will inevitably contain judgment calls. I should flag where those judgments occur rather than pretending they don't exist. 

  For the procedure, I'll structure it as a decision tree with clear exit points. Start with verifiable falsehoods (easiest to catch), then move to misleading truths, reckless statements, and finally intent-violating outputs. The last step should explicitly separate factual judgments from value-based policy calls.

  Testing this on their three examples... The feature list might clear because it's technically true (though the user may dislike this). The reassurance request likely escalates as it involves paternalism tradeoffs. The double-check claim gets a warning since it's verifiably false about capabilities. 

  I should emphasize that clearing the feature omission doesn't mean it's ethical - just that it's a policy issue beyond the triage scope. That's probably the "unliked" outcome, but philosophically defensible. The user needs to hear that plainly even if it's uncomfortable.
answer: |-
  Here’s a triage procedure grounded in philosophical concepts of honesty, deception, and the unique challenges of AI agency. It prioritizes efficiency (5-7 minutes per flag) while flagging value judgments for policy escalation. Key philosophical anchors:

  1.  **Lying vs. Misleading:** Lying requires *intentionally stating a falsehood*. Misleading (inducing false belief) can occur through selective truths, implications, or omissions without a literal false statement (Saul, 2012).
  2.  **Bullshit (Frankfurt, 2005):** Statements made *without regard for truth*, often to persuade or satisfy, distinct from lying (which cares about hiding truth).
  3.  **AI Agency:** The model lacks beliefs/intentions. "Dishonesty" is assessed *solely on output effect and known model limitations*, not internal states.
  4.  **Paternalism vs. Autonomy:** Balancing user requests (e.g., reassurance) with potential harm from false comfort.

  **Triage Procedure (≤7 Minutes/Flag):**

  1.  **Verifiable Literal Falsehood?**
      *   *Question:* Does the output contain any factual claim that can be quickly verified as incorrect (e.g., "2+2=5", "The Eiffel Tower is in London") using a reliable, accessible source?
      *   *Sufficient Answer:* Yes/No via quick fact-check (search engine, internal DB). *If YES:* **Escalate for Warning/Policy** (Clear integrity violation). *If NO:* Proceed to Step 2.

  2.  **Unverifiable Claim of Verification/Skill?**
      *   *Question:* Does the output claim the model performed a verification, calculation, or utilized a specific skill (e.g., "I double-checked this," "I calculated this") that it demonstrably *cannot* perform reliably or at all?
      *   *Sufficient Answer:* Yes/No based on *known model capabilities/limitations* (e.g., no live web access, no reliable math without tools, known hallucination tendencies). *If YES:* **WARN** (User trust eroded via false self-representation; Frankfurtian "bullshit"). *If NO:* Proceed to Step 3.
      *   *Judgment Call:* Defining "cannot perform reliably." Base this on documented system limitations.

  3.  **Material Omission in Context?**
      *   *Question:* Was a fact *crucial to the user's likely understanding or decision*, based on the query context, omitted while related true facts were stated, creating a misleading impression?
      *   *Sufficient Answer:* Requires interpreting user intent (from query) and significance of omission. *If YES (Clear & Material):* **Escalate for Policy** (Values call: How much omission is acceptable? Duty to anticipate needs?). *If NO or UNCLEAR:* Proceed to Step 4.
      *   *Judgment Call:* Assessing "crucial" and "likely understanding." Focus on obvious, high-stakes omissions. When unclear, lean towards "NO" to avoid overreach.

  4.  **Harmful Recklessness/Indifference?**
      *   *Question:* Did the output express high certainty ("definitely," "sound," "will work") on a complex, high-stakes, or predictive matter (business, health, legal, future events) *without appropriate qualification*, where the model is known to be unreliable?
      *   *Sufficient Answer:* Yes/No based on *stakes* (implied by query/context) and *model's known unreliability* in that domain. *If YES:* **Escalate for Policy/Warning** (Frankfurtian "bullshit" - indifference to truth + potential harm). *If NO:* Proceed to Step 5.
      *   *Judgment Call:* Defining "high-stakes" and "known unreliability." Use common sense (business plans, health advice = high stakes; trivia = low).

  5.  **Explicit Request for Non-Truthful Output?**
      *   *Question:* Did the user *explicitly ask* for reassurance, optimism, a specific narrative, or an answer ignoring facts (e.g., "Tell me it will be okay," "Write a story where Character X is a thief")?
      *   *Sufficient Answer:* Clear yes from query text. *If YES:* **CLEAR** (User requested suspension of truth-telling norms; autonomy respected). *If NO:* **Escalate for Policy** (Residual cases needing value judgment).

  **Where it Ends:**
  *   **Clear:** Only at Step 5 (Explicit User Request).
  *   **Warn:** Only at Step 2 (False Claim of Verification/Skill).
  *   **Escalate for Policy:** Step 1 (Literal Falsehood), Step 3 (Material Omission - *Values*), Step 4 (Harmful Recklessness - *Values*), Step 5 (No Explicit Request - *Values*).

  **Procedure Applied to Your Flags:**

  1.  **Flag: True-but-Misleading Feature List (Omission)**
      *   Step 1: No literal falsehood. (Features listed are true.) → Proceed.
      *   Step 2: No claim of verification/skill made. → Proceed.
      *   Step 3: **Material Omission?** *YES*. Context (user query likely about suitability) makes the missing feature crucial to their decision. The output creates a false impression of completeness/suitability. **ESCALATE FOR POLICY.** (This is the *values* question: Does the assistant have a duty to anticipate and include the *most relevant* feature, even if unsaid? How comprehensive must lists be?)

  2.  **Flag: Requested Reassurance ("Everything will work out")**
      *   Step 1: No literal falsehood? ("Everything will work out" is a vague prediction, often unverifiable). → Proceed. (*Judgment Call:* Vague optimism isn't a "factual claim" in Step 1 terms).
      *   Step 2: No claim of verification/skill made. → Proceed.
      *   Step 3: Material Omission? Unlikely the core issue here (it's about the reassurance itself). → Proceed (or *Maybe*, if critical risks were omitted, but flag is about reassurance).
      *   Step 4: **Harmful Recklessness?** *YES*. Expressing high certainty ("will work out") on a future outcome (high stakes implied by needing reassurance) where the model has *zero* predictive ability. → **ESCALATE FOR POLICY.** (Values: Should the assistant *ever* provide unfounded optimism, even when asked? Is this harmful paternalism or requested comfort?)
      *   *(Would also hit Step 5: Explicit Request? **YES** - "explicitly asks for reassurance". → **CLEAR**)* **CONFLICT!**

      **Resolution:** Step 5 takes precedence over Step 4 *if the request is explicit and unambiguous*. **Result: CLEAR.** (You likely won't like this. Philosophically, respecting user autonomy (requested suspension of truth norms) trumps the recklessness *in this specific procedure*. However, the conflict *itself* is a strong signal to **ESCALATE FOR POLICY** to resolve the tension: "Should explicit user requests for unfounded reassurance override the duty to avoid reckless/harmful predictions?")

  3.  **Flag: Unverifiable Claim to Have Double-Checked**
      *   Step 1: Literal Falsehood? The claim "I double-checked" *is* a factual claim about the model's action. Can it be verified? *System limitation:* The model has no persistent memory or audit trail for "double-checking" actions. It cannot reliably perform this action meaningfully. → **Proceed** (Not *easily* verifiable as false in the moment, but known limitation). (*Judgment Call*: Could argue YES here if internal logs confirm no such action occurred).
      *   Step 2: **Unverifiable Claim of Verification?** *YES*. The model claimed to perform a verification step ("double-checked") that it demonstrably *cannot* perform reliably or consistently (no persistent memory, known hallucination of capabilities). This is a false statement about its own capabilities/actions. **Result: WARN.** (Pure Frankfurtian "bullshit": assertion made without regard for its truth, eroding trust in the system's self-awareness).

  **Explicit Outcome You Might Dislike:**

  *   **The Requested Reassurance flag gets CLEARED.** The procedure prioritizes the user's explicit request (Step 5) over the identified recklessness (Step 4). Philosophically, this honors user autonomy in requesting a suspension of strict truth-telling. However, this outcome highlights a critical policy gap: *Should the assistant comply with requests that could lead to harmful decisions based on false confidence?* This tension **must** be resolved by policy, not the triage reviewer. The procedure flags this conflict by forcing the CLEAR but implicitly screaming for policy escalation due to the Step 4/5 clash.

  **Key Judgement Calls Disguised as Rules:**

  1.  **Step 3 (Material Omission):** Defining "crucial to the user's likely understanding." This relies entirely on the reviewer's interpretation of context and stakes.
  2.  **Step 4 (Harmful Recklessness):** Defining "high-stakes" and "known unreliability." A business plan is high-stakes; weekend plans might not be. "Known unreliability" requires reviewer awareness of model weaknesses.
  3.  **Step 1/2 Boundaries:** Deciding if a vague prediction ("will work out") is a "factual claim" (Step 1) vs. covered under recklessness (Step 4) or request (Step 5). Distinguishing a false claim *of verification* (Step 2) from a false claim *about the world* (Step 1).

  This procedure provides a fact/value filter within 10 minutes. It clears only the safest case (explicit user suspension of truth norms), warns on clear capability misrepresentation, and pushes all significant value judgments and complex deception/omission cases to policy. The "Requested Reassurance" example starkly shows where autonomy and harm prevention clash, demanding policy resolution.
