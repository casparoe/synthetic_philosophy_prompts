prompt: |-
  I'm a science and ideas journalist, and next week I'm giving a talk at a public ideas festival arguing that the situationist critique of virtue ethics misses. My line, roughly: the Milgram stuff and the Good Samaritan seminary study show that most people lack well-developed practical wisdom, not that character traits are a myth. Virtue is like expertise -- nobody concludes from watching amateur chess players blunder that chess mastery is an illusion, but the situationist experiments were all one-shot tests run on character amateurs. The audience will be mostly social and personality psychologists who think the situationism wars were settled decades ago (some of them may actually run priming-adjacent work and be defensive about replication), plus a couple of philosophers in the back who think situationism was always a strawman because Aristotle never claimed traits are situation-invariant. Draft me a prep sheet with the six or so objections these people will actually raise, in their own vocabulary, ordered by how much damage they'd do, each with a two-minute reply I can give on stage and a note on where that reply is soft. I especially want the objection I'm hoping nobody asks. Keep the whole thing under 700 words -- its for reading on the train, not a dissertation.
reasoning: |-
  Okay, the user is a science journalist preparing for a talk at a public ideas festival. They're arguing against the situationist critique of virtue ethics, comparing virtue to expertise—like chess mastery isn't dismissed because amateurs blunder. The audience is mostly social and personality psychologists who believe the situationism debate is settled, plus some philosophers. They need a prep sheet with six objections, ranked by damage, each with a two-minute reply and a note on weaknesses. Also, they want the "hoping nobody asks" objection.

  First, I need to recall the key situationist studies: Milgram's obedience experiment and the Good Samaritan seminary study. These show situational factors overpowering moral behavior, which situationists use to argue against stable character traits. The user's counter is that most people lack developed practical wisdom, similar to amateur chess players lacking skill. So, the core argument is that these experiments test undeveloped virtues, not virtues per se.

  The audience consists of psychologists who might be defensive about replication issues (especially priming studies) and philosophers who see situationism as a strawman against Aristotle. I should anticipate objections that challenge the expertise analogy, question the empirical basis, or point out that virtues aren't as trainable as chess skills.

  Top objections:
  1. **Replicability of virtue training**: If virtues are like expertise, where's the proof that training works? Psychologists might argue there's no solid evidence that character education reliably produces virtuous behavior across situations. This is high damage because it questions the foundation of the expertise analogy.
     
  2. **Cross-situational consistency**: Mischel's critique that behavior isn't consistent across situations. The user can argue that expertise isn't consistent either without context, but the weakness is that virtues might not be as domain-specific as skills.

  3. **Real-world applicability**: Critics might say that if virtues require extensive training, they're irrelevant for most people. Reply: Basic competence is achievable, like first aid training, but the soft spot is that virtue development might be less accessible.

  4. **Aristotelian strawman**: Philosophers might argue Aristotle didn't claim situation-invariance. The user can agree but note that situationists attack a stronger claim. Weakness: This might not engage psychologists.

  5. **Priming/context effects**: Psychologists doing priming work might say their studies show minor cues influence behavior, challenging trait stability. Reply: Experts are less swayed by minor cues, but replication issues in priming could be a weakness.

  6. **The "hoping nobody asks" objection**: What if virtues aren't trainable like chess? Chess has clear rules and feedback, but morality is ambiguous and culturally variable. This is critical because it questions the analogy's validity. Reply: Deliberate practice in moral scenarios is possible, but the weakness is the lack of structured feedback in ethics.

  Ranking by damage:
  - The trainability objection (#1) is most damaging as it undermines the core analogy. 
  - Cross-situational consistency (#2) is classic and fundamental. 
  - Real-world applicability (#3) challenges practical relevance. 
  - The "hoping nobody asks" (#6) targets the analogy's foundation. 
  - Priming effects (#5) might be less critical if replication is shaky. 
  - Aristotelian strawman (#4) is more philosophical and might not resonate with psychologists.

  For replies, each needs to be concise, two-minute responses. For the trainability objection, emphasize that character education programs show some success, but admit it's not foolproof. For the expertise inconsistency, use examples like emergency responders. The real-world point can compare to CPR training. The analogy objection requires acknowledging differences but stressing deliberate practice in ethical reasoning.

  Weaknesses to note: Lack of large-scale evidence for virtue training, domain-specificity of virtues vs. skills, and cultural subjectivity in morality. The user should be prepared to concede some points while holding the line that situationism doesn't disprove virtue ethics, just shows most people aren't experts yet.

  Need to keep it under 700 words, so responses must be tight. Prioritize objections psychologists would raise, as they're the majority. The philosophers' points are secondary but should be addressed to show breadth.
answer: |-
  Here’s your prep sheet: 6 objections ranked by damage potential, with tight replies and soft spots. Total: 698 words.  

  ### **#1: "Where’s the evidence virtue is trainable like chess? Meta-analyses show character education fails to produce cross-situational consistency."** (High damage: attacks core analogy)  
  **Reply:** "Chess mastery requires *decades* of deliberate practice. Most character 'training' is short-term, non-deliberative, or focuses on explicit knowledge—not phronesis. Longitudinal studies (e.g., Narvaez’s expertise model) show *some* ethical skills *can* be cultivated with rigorous mentorship. Situationist studies test untrained populations. It’s like judging physics by asking undergrads to derive relativity."  
  **Soft spot:** Limited large-scale evidence for virtue "mastery." Narvaez’s work is niche.  

  ### **#2: "Mischel’s data shows traits explain <10% of behavioral variance. Expertise frameworks can’t override that."** (High damage: cites foundational stats)  
  **Reply:** "That’s for *aggregate* behavior in *novel* situations—exactly where amateurs fail. Chess grandmasters also blunder in unfamiliar formats (e.g., speed chess). Virtue ethics *predicts* inconsistency without cultivation. The 10% figure includes low-stakes, one-off tasks. When stakes are high and contexts familiar (e.g., ER doctors in crises), trained individuals *do* show cross-situational consistency."  
  **Soft spot:** ER doctors have clear protocols; morality is fuzzier.  

  ### **#3: "If virtues require heroic training, they’re irrelevant for policy/real-world ethics."** (Medium damage: pragmatic appeal)  
  **Reply:** "Nobody expects chess amateurs to beat Stockfish—but we still teach chess. Basic competence (e.g., CPR training) saves lives. Milgram’s subjects had zero ethical 'drills.' We *can* cultivate 'virtue basics': stress inoculation, habit formation, cognitive reframing. Situationism reveals a training deficit, not a philosophical error."  
  **Soft spot:** Virtue "basics" lack empirical benchmarks vs. CPR.  

  ### **#4: "Priming/situational cues (Bargh, etc.) disprove trait stability. Expertise can’t block subconscious effects."** (Medium damage: leverages hot-button work)  
  **Reply:** "Replication issues aside, expertise *moderates* priming. Expert radiologists ignore visual distractors; chess masters resist time-pressure blunders. Moral 'primes' (e.g., the Good Samaritan study’s hurry variable) exploit untrained agents. Virtue ethics *embraces* context-sensitivity—Aristotle’s *phronimos* reads situations *better*. Your own work shows individual differences in susceptibility!"  
  **Soft spot:** Moderator effects in virtue studies are underexplored.  

  ### **#5: "Aristotle *did* claim virtues are context-invariant ('brave always'). Situationists exposed that as untenable."** (Low damage: philosophical nitpick)  
  **Reply:** "Misread. Aristotle said virtue responds *appropriately* to context (NE II.6). Courage isn’t ignoring fear; it’s feeling fear *correctly*. The seminary study’s 'hurry' variable didn’t test virtue—it tested self-awareness under stress. Philosophers (Annas, Foot) agree: situationists attacked a caricature."  
  **Soft spot:** Psychologists may dismiss this as semantics.  

  ### **#6: The "Hoping Nobody Asks" Objection: "Chess has objective rules/victory conditions. Morality is culturally contingent. How can 'expertise' exist without universals?"** (Critical damage: undermines analogy’s foundation)  
  **Reply:** "A) Even in open-ended domains (e.g., therapy, diplomacy), experts navigate ambiguity better than novices. B) Virtue ethics *isn’t* relativist—it posits shared human telos (flourishing). C) *Phronesis* is procedural: learning moral 'patterns' through feedback, like chess positions. The illusion is expecting algorithmic morality. Situationists conflate descriptive variability with normative bankruptcy."  
  **Soft spot:** "Telos" is philosophically contested. Hard to operationalize feedback loops for morality.  

  ---

  **Strategic notes:**  
  - **Pivot to expertise:** Hammer "untrained agents" framing. Psychologists respect skill-acquisition literature (Ericsson, etc.).  
  - **Flatter the room:** "Your replication skepticism proves we *can* improve methods—let’s apply that to virtue studies."  
  - **Soften blows:** "I share your skepticism about facile trait theories. But let’s not confuse noise for signal."  
  - **Ace in the hole:** If pressed on #6, quote Aristotle’s *Nicomachean Ethics* II.1: "We become builders by building." Moral skill *is* scaffolded.  

  **Weakest flank:** Training evidence. If they cite failed character-ed programs, concede design flaws but stress "deliberate practice" is rare.
