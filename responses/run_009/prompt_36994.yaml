answer: |-
  What you're describing is a profound and well-studied phenomenon in social science and philosophy. The most precise existing concept is **Interactive Kinds** or **Human Kinds** (as opposed to **Natural Kinds**), specifically articulated by philosopher Ian Hacking through his concept of **Looping Effects** or the **Looping Effect of Human Kinds**.

  Here's the breakdown and why it fits:

  1.  **Core Idea (Hacking's Looping Effect):**
      *   Human classifications (like diagnostic categories, social types, identity labels) are not like classifications of rocks or stars.
      *   When we classify *people*, the classified individuals become **aware** of the classification.
      *   This awareness fundamentally **changes their self-perception, behavior, options, and life choices**.
      *   These changes in the people being classified then **feed back onto the classification itself**: the meaning, application, stability, and even the validity of the category can shift over time.
      *   This creates a dynamic **feedback loop** between the classifying concept (the "kind") and the people classified under it.

  2.  **Why It Fits Your Description Perfectly:**
      *   **Change in the Classified:** You observe that once a label exists (DSM diagnosis, identity group), people start "presenting just like the textbook" or "organizing around it." This is the core of looping – the label changes behavior, self-understanding, and social reality.
      *   **Feedback Reshaping the Category:** You note people "embracing it or fighting it," leading to a situation where "they aren't quite the same population afterward." This directly reflects the feedback loop altering the group's characteristics and relationship to the label.
      *   **Category Death:** Your example of homosexuality's removal from the DSM due to resistance is a classic case study for looping effects. The classified group actively challenged the validity and harmful effects of the classification, ultimately destroying it *as a pathological category*. The category didn't just become inaccurate; its very existence as a medical diagnosis was rendered illegitimate through social/political action fueled by the classification itself.
      *   **Ongoing Two-Way Process:** It explicitly frames this as an ongoing, dynamic interaction ("loop"), distinct from a static label or a one-off self-fulfilling prophecy.

  3.  **How it Differs from Self-Fulfilling Prophecy (SFP):**
      *   **Scope:** SFP is typically about a *specific prediction* (e.g., "John will fail") leading to behaviors that make it true (e.g., John gets anxious and performs poorly). Looping effects are about broader *categories* or *kinds* of people.
      *   **Directionality:** SFP is usually unidirectional: belief/prediction -> behavior -> outcome confirming belief. Looping is fundamentally *bidirectional* and *iterative*: Classification -> Changes in People -> Altered Understanding/Application of Classification -> Further Changes in People -> etc.
      *   **Outcome:** SFP focuses on the prophecy becoming true. Looping effects encompass a wider range of outcomes: the category can become *more* entrenched and "real" (like modern identity politics), *less* accurate, *redefined* (e.g., shifts in understanding autism), or *abolished* (e.g., homosexuality as pathology).
      *   **Agency:** Looping emphasizes the *agency* and *reactivity* of the classified people – they aren't just passive victims of a label; they actively engage with it, reshape it, or destroy it.

  4.  **Why it's More Than Stereotyping:**
      *   Stereotyping is often about fixed, inaccurate beliefs applied *to* a group. Looping effects involve the *dynamic interaction* between the label and the group. The feedback loop can indeed make the category *more empirically grounded* or *socially functional* over time (e.g., refinement of diagnostic criteria based on observed patterns and patient feedback), not just reinforce prejudice. It's about the *social construction and evolution* of the kind itself.

  5.  **What About Money (The Edge Cases)?**
      *   Money is an **Institutional Fact** (John Searle) or a specific type of **Status Function** dependent on **Collective Intentionality**.
      *   **Similarity:** Both money and human kinds rely on collective agreement and belief. Our collective belief that a dollar is valuable *makes* it valuable in a specific context. If enough people stopped believing, the value would collapse (like hyperinflation).
      *   **Key Difference (Reactivity):** Dollar bills are **Inert Kinds** (Hacking's term). They don't become *aware* of their classification as money and change their behavior accordingly. The "loop" for money is between the *collective belief* and the *social/economic system*, not between the classification (money) and the *classified object itself* (the bill). The bill has no agency.
      *   **Conclusion:** Money exemplifies the power of collective intentionality to create social reality (like institutional facts), but it lacks the **reactivity and agency** component that defines **looping effects** involving human kinds. People classified react and change; dollar bills do not.

  **Answering Your Specific Questions:**

  *   **Established Concept:** Yes, **Looping Effects of Human Kinds** (Ian Hacking).
  *   **Difference from SFP:** Looping is bidirectional, iterative, about categories/kinds (not single predictions), and emphasizes the agency/reactivity of the classified.
  *   **Category Collapse:** This is a *key outcome* of looping. When the classified group strongly rejects the label and its implications (e.g., pathologization, stigma, limitation), and mobilizes effectively (politically, socially, scientifically), they can delegitimize and dismantle the classification itself. The "loop" breaks because the classification loses its authority or utility.
  *   **Edge Cases (Non-Human):** The core mechanism of **looping effects requires the classified entities to be reactive and capable of changing their behavior/self-understanding based on the classification.** Therefore, it primarily applies to **people** or possibly highly social animals where labels/roles significantly impact behavior. Money, institutions, and inert objects operate via different mechanisms (collective intentionality, institutional facts) where the objects themselves lack reactivity, though the *system* can change based on collective belief.

  **In Summary:**

  You've identified **Hacking's Looping Effects of Human Kinds**. It's the established framework for understanding how classifying people changes them, and how their changed behavior and resistance (or acceptance) then reshapes, reinforces, redefines, or even destroys the classification itself. It's a dynamic, two-way street of social construction, fundamentally different from self-fulfilling prophecies (which are simpler, unidirectional predictions) and stereotyping (which is often static prejudice), and distinct from the social construction of non-reactive institutional facts like money.
