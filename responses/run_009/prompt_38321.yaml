  - Lactase persistence is pure adaptation (genetic signature + selection evidence) 
  - Musicality is tricky - costly but no selection proof. Probably byproduct like female orgasm? 
  - Palmar grasp is clearly vestigial, like goosebumps. 

  The discriminating trait? Maybe something like wisdom teeth - selected for in ancestors but maladaptive now. Would he call it adaptation (historical selection) or byproduct (current harm)? That could crack his logic. 

