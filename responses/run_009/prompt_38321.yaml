  The user's real puzzle is applying this logic to four new cases: literacy (recent cultural invention), lactase persistence (clear genetic adaptation), musicality (costly but no selection evidence), and palmar grasp (vestigial reflex). They're less interested in answers than in reconstructing the mentor's rulebook. 

  Hmm... the mentor seems to demand either: 
  (A) Direct evidence of selection (like peppered moth experiments) OR 
  (B) Proof that the trait can't exist as a developmental/spandrel effect. 

  But wait - fever has no direct selection evidence, yet he called it adaptation. So maybe criterion B flips: it's adaptation UNLESS there's a compelling non-adaptive explanation (like shared developmental pathways for male nipples). 

  For the new cases: 
