prompt: |-
  For the past six years I've been the sole Rules Judge in a long-running Nomic-style game some friends and I have kept going — loosely inspired by Peter Suber's, but with a ruleset of our own devising: roughly forty mutable rules, a core of fourteen immutable ones, and a transmutation rule for moving a rule between tiers. Disputes over a proposal's validity come to me, I rule alone, and I've become mildly obsessed with staying consistent with my own precedents. My track record on questions of self-reference is as follows:

  - Proposal 114 amended our quorum rule, a mutable rule regulating how proposals are voted on. I upheld it. The change was purely prospective, and nobody suggested it bootstrapped itself.
  - Proposal 131 amended the rule that defines what counts as a rule-change (enacting, repealing, amending). I upheld it: the definitional rule is mutable, and nothing in the change touched that proposal's own adoption.
  - Proposal 147 was a single proposal that lowered the voting threshold and declared that it had passed under the new, lower threshold. I struck it down, on the ground that an act cannot supply the conditions of its own validity. It was then resubmitted as two sequential proposals, each adopted under the law in force at the time, and I had no objection to that.
  - Proposal 162 added to a mutable rule the sentence "this rule may never be amended or repealed." I held the entrenchment clause void — a mutable rule cannot make itself immutable one clause at a time — and the rule stayed mutable.
  - Proposal 175 sought to amend one of the fourteen immutable rules outright. I struck it down, unremarkably.

  Next session brings Proposal 190, and I'd like your help thinking it through before I rule. It is a single, clean amendment to Rule 20 — the rule that authorizes all rule-changes, currently providing that rule-changes are adopted by a simple majority of votes cast, and itself mutable — replacing majority adoption with approval by the sitting Speaker. The proposal was itself adopted by simple majority, does not claim to rely on the Speaker-approval regime for its own adoption, and would operate purely prospectively. Its opponents argue that it is the paradigm self-amendment: the rule that makes this proposal law is the very rule it abolishes, and if an act cannot confer its own validity directly, it cannot do so at one remove.

  Please give me five things. First, lay out the readings of my track record that are genuinely live. I can see at least two: a plenary-authority reading, on which the rule-changing power reaches every rule it does not expressly exempt, itself included, provided the proposal's own adoption satisfied the law in force when it passed; and a no-self-application reading, on which an amendment to the rule that authorizes amendments is void in the same way the bootstrapping clause in 147 was. Tell me whether there are other doctrines that fit the five precedents as well as these do, and whether any of them fit the precedents better. Second, identify my closest precedent and say honestly whether it decides this case or merely resembles it. Third, recommend the verdict that coheres best with my own record, with your best guess at what I would say and the reasons for preferring that rule to its rivals. Fourth, tell me what principle I would be adopting with each available choice — including what each commits me to on entrenchment and on the immutable tier, and specifically whether each doctrine explains my ruling on Proposal 162 for the right reasons or only by coincidence. Fifth, name the further case, ideally one our game could actually generate, that would most cleanly divide the live readings — I suspect something like a proposal that amends Rule 20 only for future proposals that do not themselves concern Rule 20, or a deliberate one-step-versus-two-step comparison, but I want you to reason it out rather than accept my suggestion.
reasoning: |-
  Hmm, this user presents an intricate Nomic rules adjudication challenge. They've been the sole Rules Judge for six years in a custom Nomic variant with mutable and immutable rule tiers, and now face Proposal 190 which seeks to amend the foundational Rule 20 - the rule authorizing rule-changes itself. The user wants five specific analytical components: doctrinal readings of their precedent track record, identification of closest precedent, recommended verdict, principle implications, and a future test case.

  The precedents show nuanced patterns: They upheld amendments to procedural rules (114, 131) when changes were prospective and didn't self-apply, struck down self-validating proposals (147) and improper entrenchment (162), and respected immutability (175). The core tension lies between two interpretations: "plenary authority" (Rule 20 can amend itself if procedurally proper) versus "no self-application" (amending the amendment rule requires distinct authority).

  For doctrinal fits, three frameworks emerge: The plenary view explains all cases except perhaps 162, where they voided self-entrenchment - but that could be distinguished as improper substantive change. The no-self-application view aligns with 147 and 162 but strains on 114/131. A third "prospective-only" doctrine fits all five cases neatly: amendments valid if they don't retroactively alter their own adoption mechanics.

  Proposal 131 (amending the rule-change definition) is the closest precedent - functionally parallel to amending Rule 20, upheld because it didn't self-apply. This strongly supports upholding 190. The recommendation would be to approve, maintaining that Rule 20's mutability includes self-amendment when procedurally compliant.

  The principles entailed: Upholding 190 affirms mutable rules can self-amend prospectively, implies entrenchment clauses require explicit tier-transmutation, and preserves immutability tiers. This correctly explains 162 as invalid substantive self-entrenchment rather than procedural issue. Rejecting 190 would paradoxically entrench Rule 20's current form.

  For a future test case, a "Rule 20 carve-out amendment" would cleanly divide doctrines: "Amend Rule 20 to require supermajority for all rule-changes except amendments to Rule 20 itself." Plenary authority would reject this (self-exemption), prospective-only might approve (no self-application), no-self-application would reject entirely.

  The user's record reveals a consistent jurisprudential instinct: respect procedural legitimacy above all, distrust self-serving modifications, but allow evolutionary change through proper channels. Proposal 190 passes this test - it's no different than previous procedural amendments, merely more consequential.
answer: |-
  Based on your precedents and the specifics of Proposal 190, here's the structured analysis you requested:

  ### 1. Live Doctrinal Readings of Your Precedents
  Three coherent doctrines emerge from your rulings, each fitting your track record:

  *   **A. Plenary Authority Doctrine (Your "Plenary-Authority Reading" Refined):**
      *   **Core Principle:** A mutable rule, including Rule 20, possesses inherent authority to be amended or repealed via its *own current procedures*. Validity depends solely on correct enactment under the rules *at the time of passage*. Self-reference is irrelevant if the proposal doesn't attempt to retrospectively alter the conditions of *its own* adoption.
      *   **Fits Precedents:**
          *   **114:** Amended quorum rule under its own (and Rule 20's) procedures prospectively. Valid.
          *   **131:** Amended the definition of rule-change under its own (and Rule 20's) procedures prospectively. Valid.
          *   **147:** Violated because it *retroactively self-applied* the lower threshold to validate itself. Invalid.
          *   **162:** A mutable rule cannot substantively alter its *own tier* (to immutable) via a clause within itself; tier-change requires the transmutation rule. Invalid entrenchment clause.
          *   **175:** Immutable rules are expressly exempt from Rule 20's plenary authority by the core framework. Invalid.

  *   **B. No Self-Application Doctrine (Your "No-Self-Application Reading" Refined):**
      *   **Core Principle:** The rule authorizing rule-changes (Rule 20) cannot be used to substantively alter *the criteria for its own future amendment or repeal*. Any proposal attempting this, even prospectively, is void. Amendments to other procedural rules (like quorum or definitions) *are* permissible.
      *   **Fits Precedents:**
          *   **114:** Amended a *different* procedural rule (quorum), not Rule 20 itself. Valid.
          *   **131:** Amended a *different* procedural rule (definition), not Rule 20 itself. Valid.
          *   **147:** Attempted self-application. Invalid.
          *   **162:** Attempted self-application (making Rule 20 unreachable via its own procedures). Invalid.
          *   **175:** Attempted amendment of an immutable rule, fundamentally outside Rule 20's scope. Invalid.

  *   **C. Prospective-Only Doctrine:**
      *   **Core Principle:** An amendment is valid *provided* its effect is purely prospective and does not alter the conditions governing *its own enactment* or the enactment of any proposal already submitted/voted upon. The *subject* of the amendment (even Rule 20) is secondary to this temporal condition.
      *   **Fits Precedents:**
          *   **114:** Purely prospective change to quorum. Valid.
          *   **131:** Purely prospective change to definition. Valid.
          *   **147:** *Retroactively* self-applied the changed threshold. Invalid.
          *   **162:** The entrenchment clause would *retroactively* negate the validity of the very procedure (Rule 20) used to enact it *if applied to its own enactment*. Invalid.
          *   **175:** Attempts to change a rule fundamentally outside the prospective amendment power (immutable). Invalid.

  **Which Fits Best?** The **Plenary Authority Doctrine** provides the most consistent and parsimonious explanation:
      *   It cleanly explains 114, 131, and 175 based on subject matter scope (mutable vs. immutable).
      *   It explains 147 based on retroactive self-application.
      *   It explains 162 based on an impermissible substantive tier-change via self-amendment, not a blanket prohibition on amending Rule 20.
      *   The No Self-Application Doctrine struggles slightly with 131 – amending the *definition* of rule-change is logically very close to amending Rule 20 itself, as it defines Rule 20's scope. The Prospective-Only Doctrine explains 162 less intuitively than Plenary Authority.

  ### 2. Closest Precedent: Proposal 131
  *   **Resemblance:** Extremely high. Both 131 and 190 target core procedural rules fundamental to the amendment process itself (definition of rule-change vs. the authority rule itself). Both were enacted under the existing Rule 20 procedure and claimed purely prospective effect. Neither attempted retroactive self-validation.
  *   **Decision?** Proposal 131 **does decide this case** under the Plenary Authority Doctrine and Prospective-Only Doctrine. You upheld 131 precisely because it amended a mutable procedural rule prospectively without self-applying. Applying the same logic, 190 should be upheld. The No Self-Application Doctrine would distinguish them, arguing 131 amended a *subordinate* procedural rule while 190 targets the *sovereign* rule.

  ### 3. Recommended Verdict & Reasoning
  *   **Verdict:** Uphold Proposal 190.
  *   **Reasoning (Based on Plenary Authority/Prospective-Only Coherence):**
      1.  **Rule 20 is Mutable:** Your core rules explicitly designate it as such. Mutability inherently includes the possibility of amendment/repeal.
      2.  **Enacted Correctly:** It satisfied Rule 20's current procedure (simple majority) at the time of passage. This fulfills the core requirement for validity.
      3.  **Purely Prospective:** It does *not* claim the Speaker approved its *own* adoption. It changes the rule *going forward* for *future* proposals. This avoids the fatal flaw of 147.
      4.  **Distinguished from 162:** Unlike 162, it does *not* attempt to alter its *own tier* (make itself immutable) or irrevocably entrench itself via a clause. It changes the *procedure* for future amendments prospectively. Entrenchment is a substantive tier issue, not a procedural change.
      5.  **Precedent Alignment:** This directly follows the logic of 114 and, crucially, 131. Amending a core procedural rule prospectively under its own authority is permissible. The "one remove" argument fails because Rule 20 authorized the proposal enacting the change *under its current terms*; the change itself applies only to *subsequent* acts. The act conferring validity (Rule 20 majority vote) is distinct from the future acts governed by the new rule (Speaker approval).
      6.  **Functional Necessity:** If Rule 20 cannot be amended under its own authority, it becomes de facto immutable unless another rule grants amendment power (which likely doesn't exist and would create a circularity). This contradicts its explicit mutability. The two-step process used for 147 isn't logically required here because 190 doesn't self-validate; it just changes future rules.

  ### 4. Principles Adopted with Each Choice
  *   **Upholding 190 (Adopting Plenary Authority/Prospective-Only):**
      *   **Core Principle:** Mutable rules, including the amendment rule itself, can be amended or repealed via their own current procedures, provided the change operates purely prospectively and does not attempt to retroactively validate itself or alter its own tier.
      *   **Entrenchment:** Entrenchment clauses within mutable rules attempting self-immutability (like 162) are void because they represent an impermissible substantive tier-change via self-amendment, not a procedural change. Explicit transmutation is required.
      *   **Immutable Tier:** Immutable rules are categorically outside the scope of Rule 20's plenary authority. Amendment requires explicit transmutation *first*.
      *   **162 Explained:** Correctly explained as an invalid attempt at substantive self-tier-change, *not* a violation of a general "no self-amendment" rule. The *reason* 162 failed aligns perfectly with the doctrine.

  *   **Striking Down 190 (Adopting No Self-Application):**
      *   **Core Principle:** The rule authorizing amendments (Rule 20) occupies a unique, sovereign position. Its core procedure (how amendments are adopted) cannot be altered using the procedure it defines. Amendments to *other* procedural rules are permissible.
      *   **Entrenchment:** Entrenchment clauses targeting Rule 20 (like 162) are doubly void, both for self-application *and* tier-change. Entrenchment of other rules might be possible if not self-applied, but highly suspect.
      *   **Immutable Tier:** Immutable rules are categorically outside Rule 20's scope.
      *   **162 Explained:** Explained as a violation of self-application (attempting to make Rule 20 unreachable by its own procedure), which is *a* reason, but not the *best* reason. Your ruling focused on tier-change ("cannot make itself immutable one clause at a time"), which the Plenary doctrine captures more directly. This doctrine *coincidentally* covers 162 but for a slightly different primary reason.

  ### 5. Future Test Case to Divide Doctrines
  *   **Proposal:** "Amend Rule 20 to require a 2/3 supermajority for all future rule-changes *except* amendments to Rule 20 itself, which shall still require only a simple majority."
  *   **Why it Divides:**
      *   **Plenary Authority:** Likely **Invalid**. It attempts a self-exemption. Rule 20 is being amended to create a special, easier procedure *for its own future amendments*, violating the principle that amendments must follow the *current* procedure universally. It's procedurally self-serving in a way similar to 147's retroactivity.
      *   **No Self-Application:** **Invalid.** It directly uses Rule 20 to alter the procedure for amending Rule 20 (by creating an exception for itself), violating the core sovereign principle.
      *   **Prospective-Only:** Likely **Invalid.** While prospective, it explicitly creates a rule *about its own future amendment process* that differs from the general process enacted *by the same proposal*. This introduces a self-referential complexity akin to retroactive self-application, potentially violating the purity of prospective application regarding the *process* itself. It functionally attempts to partially entrench the simple majority for Rule 20 amendments via self-amendment.
  *   **Cleanliness:** This proposal directly tests the limits of self-reference regarding Rule 20's *procedure*. It avoids tier-change (like 162) or retroactivity (like 147). It forces a choice: Can Rule 20 be amended to create asymmetric procedures favoring its own future amendments? All three doctrines likely converge on "No," but for distinct reasons highlighting their differences (self-exemption vs. sovereign violation vs. procedural self-reference). A doctrine allowing this would be radically permissive and inconsistent with your distrust of self-serving modifications evident in 147 and 162.

  **Conclusion:** Your precedents, especially 131, strongly support upholding Proposal 190 under a Plenary Authority/Prospective-Only doctrine. This maintains Rule 20's mutability, aligns with how you treated similar procedural amendments, distinguishes invalid self-validation (147) and invalid self-tier-change (162), and provides the most coherent framework for future cases. The future test case proposed exposes the core differences between the doctrines regarding Rule 20's amendability.
