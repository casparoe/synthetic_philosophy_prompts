prompt: |-
  My college roommate and I have argued decision theory on and off for like a decade, and I've finally written down her track record well enough to make predictions with. I want your read on where she'll land next.

  Her verdicts so far, all firm:

  - Newcomb (opaque box, big prize inside, predictor with a great track record): one-box, no hesitation.
  - Prisoner's dilemma against an exact psychological copy of herself, moves simultaneous: cooperate.
  - Same PD against a total stranger picked out of a phone book, choices sealed, no correlation between them beyond both being human: defect.
  - Smoking-lesion-style case, where the lesion causes both the craving and the illness and the smoking itself is harmless: she smokes.
  - PD against an opponent whose move was fixed in advance by a fair coin flip and sealed in an envelope: defect.
  - PD against her exact psychological twin whose choice is already made and sealed (she can't peek): cooperate.

  Next month a philosophy club we both know is re-running Hofstadter's two superrationality experiments, and she's a participant in both, so this is my chance to test predictions. First, Platonia: an eccentric trillionaire picks twenty people, forbids all communication between them, and announces that if exactly one of them sends him a reverse-charges telegram by noon the next day, that person gets a billion dollars — if two or more send, or nobody sends, nobody gets anything. Hofstadter's own answer was that a superrational player sends a telegram with probability 1/20. Second, the Luring Lottery, modeled on the one Scientific American actually ran in 1983: you enter by mailing a postcard with a number on it, the number counts as that many entries, and the prize is a million dollars divided by the total number of entries received, awarded to the submitter of one randomly drawn entry. The real magazine had just run columns explaining superrationality and essentially begging readers to enter once, and the readers responded by nuking the prize with googolplex-sized entries — so history is no help here. The club's version: the lottery pool is the club mailing list, mabye two hundred people, all of whom were sent the superrationality columns beforehand; the Platonia group is twenty people picked by the club president, who as far as I know chose people he considers "reasonable types."

  So: does she send a telegram in Platonia — outright, not at all, or randomized at 1/20? And what number does she mail in for the lottery — a 1, a googolplex, or something in between? Does the die-rolling answer even make sense given her track record?

  Structure your answer as:

  - "Which rules are left standing" — starting from her six verdicts, which decision rules survive and which get eliminated (roughly 150 words)
  - "What each survivor says about Platonia" — roughly 200 words, treating silence, randomizing at 1/20, and sending outright as three live options
  - "What each survivor says about the lottery" — roughly 150 words
  - "My call" — your single best prediction for both experiments, with why you weight one surviving rule over the others (roughly 100 words)
  - "The tiebreaker case" — one further case, described concretely, where the surviving rules give different answers so that she'd have to pick a side (roughly 100 words)
reasoning: |-
  Okay, the user is presenting a fascinating decision theory puzzle involving their college roommate's past choices and predicting her behavior in two upcoming experiments: Platonia and the Luring Lottery. This is clearly the culmination of a decade-long debate between them. 

  First, I need to analyze her six firm verdicts to identify consistent decision rules. Her choices show a clear pattern: she cooperates when facing psychological twins (Newcomb one-boxing, PD with copy/committed twin) but defects against uncorrelated strangers or mechanistic opponents. The smoking lesion case further confirms she ignores causal impotence when correlations exist.

  For rule elimination: Naive causal decision theory fails completely (would defect in twin PDs). Evidential decision theory struggles with the smoking lesion rejection. Timeless decision agents are partially supported but inconsistent with her defection against coin-flip PD. Functional decision theory seems strongest - it explains all cases by optimizing the output of isomorphic decision functions.

  Now applying to Platonia: FDT suggests sending outright since identical reasoning implies only one would send. But TDT would randomize at 1/20. Given her consistent cooperation with twins, I predict she'll send outright despite randomization being "safer".

  For the lottery: FDT points to submitting "1" since identical reasoning would maximize shared prize. Her rejection of causal impotence in smoking lesion reinforces this. Though the historical googolplex disaster shows what usually happens, her track record suggests she'll actually internalize the superrational logic.

  The tiebreaker case - a PD against yesterday's self - would force the choice between FDT (cooperate) and TDT (defect if yesterday's choice is fixed). Her past twin cooperation suggests FDT alignment.

  This user clearly enjoys deep philosophical puzzles. Their detailed record-keeping shows admirable dedication to resolving this long-standing debate. I suspect they're hoping their roommate's choices will validate one theoretical framework over others.
answer: |-
  Based on her track record, her decision theory consistently prioritizes **logical correlation over causal influence or probabilistic uncertainty** when dealing with identical reasoning processes. Here's the breakdown:

  **Which rules are left standing:**
  *   **Eliminated:** Naive Causal Decision Theory (CDT) fails her Newcomb (one-box), PD-with-copy (cooperate), and PD-with-sealed-twin (cooperate) choices. Evidential Decision Theory (EDT) fails her Smoking Lesion choice (smokes). Timeless Decision Theory/Updatelessness (TDT/UDT) *as strict global optimization* struggles with her PD-against-coin-flip (defect) and PD-against-stranger (defect) choices, as those involve no logical correlation.
  *   **Surviving (Refined FDT/TDT):** **Functional Decision Theory (FDT)** emerges strongest. It optimizes the *output* of the decision function itself. When she faces an agent (or copies of her function, like her twin or the Newcomb predictor modeling her), she chooses the action that leads to the best outcome *if* identical functions output the same. When no such logical linkage exists (stranger, coin-flip), she defects/acts causally. Her Smoking Lesion choice (smokes) aligns perfectly: her decision function's output doesn't *cause* the lesion, but correlates with it via pre-determination; optimizing the function output means ignoring the impotent causal link of smoking.

  **What each survivor says about Platonia:**
  Assuming the 20 players are all "reasonable types" (implied isomorphic reasoners):
  1.  **Send Outright (FDT):** FDT asks: "What does my decision function output, given that all identical functions output the same?" If everyone sends, all lose. If no one sends, all lose. The *only* winning output is for exactly one function to output "send". Since the functions are identical, they *must* coordinate on the same output. The consistent FDT output is "send", trusting the identical reasoning of others to result in exactly one sender (her or another – the outcome is the same for her function either way). *This matches her cooperation with sealed psychological twins.*
  2.  **Randomize at 1/20 (TDT/UDT):** A more cautious TDT/UDT approach seeks a symmetric Nash equilibrium. Since all players are identical, the only stable strategy where everyone is indifferent is randomizing with p=1/20. This avoids the "all send" failure mode but accepts the "no send" failure mode with high probability. *This partially matches her reasoning but contradicts her willingness to outright cooperate with sealed twins (no randomization there).*
  3.  **Don't Send (CDT/EDT/Failure):** CDT sees no causal benefit to sending (others' actions are independent). EDT sees sending as evidence others also sent (bad outcome). *This contradicts her Newcomb and twin-cooperation choices.*

  **What each survivor says about the lottery:**
  1.  **Submit '1' (FDT):** FDT asks: "What number N does my decision function output, given that all identical functions output the same N?" The prize per winner is $1e6 / (Total Entries). If all output N, Total Entries = 200*N. Her expected utility is roughly [1/ (200*N)] * [$1e6 / (200*N)] = $1e6 / (40000 * N^2). This is maximized by minimizing N, hence **N=1**. Submitting 1 is best if all identical reasoners submit 1. *This mirrors her cooperation choices where identical reasoning leads to mutual benefit.*
  2.  **Submit Large Number (CDT/Naive Self-Interest):** CDT reasons: *My* entries increase *my* chance of winning linearly, while only diluting the prize linearly if I win. Increasing N always increases expected value (EV = (N / Total) * (Prize / Total) ). To maximize personal EV, submit the largest possible number (googolplex). *This matches her defection against strangers/coin-flip, where no logical linkage exists.*
  3.  **Submit Intermediate Number (Unlikely Equilibrium):** Finding a symmetric pure Nash equilibrium is messy. An N where marginal cost (prize dilution) equals marginal benefit (increased win chance) depends on others' choices. With identical reasoners all choosing the same N, the maximum EV (as above) is still at N=1. No stable intermediate symmetric pure strategy stands out.

  **My call:**
  *   **Platonia: She sends outright.** FDT is the most consistent fit for her track record, especially her willingness to cooperate with sealed psychological twins based solely on identical reasoning. She'll trust that all 20 isomorphic functions will output "send," ensuring exactly one sender.
  *   **Lottery: She submits '1'.** FDT dictates N=1 for maximum shared payoff under identical reasoning. Her rejection of causal impotence in the Smoking Lesion (optimizing the function output despite correlation) strongly suggests she'll apply the same logic here, ignoring the causal power of her individual entry to focus on the logical correlation of identical decisions. Her defection against non-linked agents shows she *doesn't* naively cooperate universally, only when logical linkage exists – which it does here among "reasonable types" primed for superrationality.

  **The tiebreaker case:**
  **Prisoner's Dilemma against her past self:** Choices are made sequentially. *Today's* self plays against *yesterday's* self (whose choice is already fixed and known only to the game master; she knows it's fixed but not what it is). The payoff matrix is standard PD. If she cooperates, she gets either the sucker's payoff (if past self defected) or mutual cooperation. If she defects, she gets either punishment (if past self defected) or temptation (if past self cooperated).
  *   **FDT:** Optimizes the output of *the* decision function run at different times. If the function always outputs Cooperate against its past/future self, mutual cooperation is achieved. Output **Cooperate**.
  *   **CDT/TDT-cautious:** Yesterday's choice is fixed. Her choice today has no causal influence on it and provides no logical evidence about it (it's already determined). Defection dominates for today's self, guaranteeing at least the punishment payoff and possibly temptation. Output **Defect**.

  Her choice here directly tests if she prioritizes the logical identity of the decision function across time (FDT: Cooperate) or the fixed, causally impotent nature of the past choice (CDT: Defect). Her sealed-twin cooperation suggests FDT (Cooperate), while her coin-flip defection suggests CDT (Defect).
