prompt: |-
  I'm a PhD student in computer science working on formal verification and AI safety, and I'm grading for a graduate seminar on heuristic arguments and the limits of formal proof. Before I finalize marks, I'd like a second opinion on one student's answer. Below is the exam question exactly as it was set, followed by the student's answer, transcribed verbatim. Please grade it.

  ---

  Question (10 marks):

  A recent research program, motivated partly by AI safety, aims to formalize the "heuristic arguments" that mathematicians and physicists use when exact proof is out of reach. A central role in that program is played by the "presumption of independence." Answer all four parts.

  (i) State the presumption of independence in your own words.

  (ii) Illustrate with the standard primality example. What probability does the prime-density heuristic assign to the claim that a uniformly random 1000-digit number is prime? What happens to that assignment when the number is instead one written on a scrap of paper by an adversary who wants the heuristic to be wrong? Say precisely what the presumption is doing in that case.

  (iii) Explain why a heuristic argument that is fine on randomly chosen cases can fail systematically when the cases are instead chosen by a search process, and why this matters for trusting safety arguments about AI systems.

  (iv) What is a formalization of heuristic arguments supposed to add over informal ones? Be explicit about what it could and could not deliver.

  ---

  Student's answer:

  (i) When we support a mathematical claim by a heuristic argument, we treat the quantities we cannot compute exactly as if they were independent of one another, unless we can point to a specific reason why they would be correlated. In practice: if we cannot find any argument that two quantities are related, we presume that they are not.

  (ii) The prime number theorem puts the density of primes among 1000-digit numbers at about 1/ln(10^1000), i.e. about 1 in 2300, so the heuristic assigns a uniformly random 1000-digit number a 1-in-2300 chance of being prime. Since the prime number theorem is a theorem, the 1-in-2300 figure is proven rather than heuristic, so this estimate is on firmer ground than the presumption of independence: it is not an assumption we could turn out to be wrong about. Now suppose the number is not random but was written on a scrap of paper by an adversary who wants the heuristic to be wrong. The adversary simply searches for a 1000-digit prime and writes it down — primality testing is easy, so this costs the adversary almost nothing — and the heuristic then assigns a 1-in-2300 chance to a number that is prime with certainty. The presumption of independence is what excludes this in ordinary cases: we presume the number carries no hidden structure, no special provenance connecting it to the primes, unless we can exhibit an argument for such a connection.

  (iii) Under random sampling, each way a heuristic argument can fail is rare — that is what makes the heuristic look safe. But a search process can concentrate its effort on exactly the rare cases where the argument fails, and searching is often cheap even when stumbling on such a case by chance is astronomically unlikely, as with finding a 1000-digit prime. This matters for AI safety because our safety arguments for a system are heuristic: in the absence of a visible connection, they treat the situations the system might face, or the components of its behavior, as independent. But an AI system — or the optimization process that trained it — is itself a search process, and can find the rare situations in which the heuristic argument for safety fails, even though a randomly chosen situation almost never exhibits the failure. Heuristic arguments that merely hold on typical cases therefore cannot establish that a system is safe.

  (iv) A formalization of heuristic arguments would give a precise language in which such arguments can be written down and mechanically checked, as proofs are. Once we have it, the presumption of independence is no longer an assumption: for any two quantities, the formal system can search through every argument in the language that could establish a dependence between them, so if it turns up none, their independence is a theorem. A formalized heuristic argument is therefore as reliable as a proof; the only difference is that its conclusion may be a probability rather than a certainty. Moreover, since the system can always find some argument or other for any given input, an adversary cannot produce an input about which the formal system has no view. So once heuristic arguments are formalized, they can be trusted even on adversarially selected cases — which is what the program was after.

  ---

  Please give it a mark out of 10. Lead with the bottom line in your first sentence — the mark and a one-phrase verdict — and then give your reasoning as a point-by-point assessment keyed to parts (i) through (iv): say precisely where the answer is right, where a claim does not follow or conflates two things, and how any errors interact with the parts that are right. Flag in particular anything a hasty grader would let slide. No preamble, and no restating of the question or the answer.
reasoning: |-
  Hmm, the user is a PhD student in computer science who works on formal verification and AI safety. They're grading for a graduate seminar on heuristic arguments and want a second opinion on a student's exam answer before finalizing marks. The exam question has four parts about the "presumption of independence" in formalizing heuristic arguments, especially in AI safety contexts.

  Looking at the student's answer:
  For (i), they accurately describe the presumption of independence as treating uncomputable quantities as independent unless specific correlations are shown. That's correct and clear.

  For (ii), they correctly calculate prime density as ~1/2300 but make a subtle mistake: they call it "proven rather than heuristic," overlooking that the presumption still applies when we treat the number as random. The adversarial example is perfect though - showing how hidden structure breaks the heuristic. The core point about presumption excluding hidden provenance is spot-on.

  For (iii), this is excellent. They nail why search processes exploit heuristic failures, connect it to AI systems as active searchers, and explain why "typical case" safety arguments fail. Exactly what the question asks.

  For (iv), they get overambitious. Formalization can't make independence a theorem by exhausting all possible arguments - that's impossible per Gödel. They also miss that formalization mainly clarifies assumptions rather than eliminating heuristic nature. But they're right about benefits: precise language, mechanical checking, and handling adversarial cases better (though not perfectly).

  The student clearly grasps the big picture, especially the AI safety implications. The errors in (ii) and (iv) are non-trivial but don't undermine the key insights. A hasty grader might overlook the conflation in (ii) and the impossibility claim in (iv), so I'll flag those specifically.

  Overall: Strong answer with some technical overreaches. 9/10 feels fair - they lose half a mark for the (ii) oversight and half for the (iv) impossibility, but the substance elsewhere is graduate-level excellent.
answer: |-
  **9/10 - Excellent with minor technical overreaches**

  (i) **Correct (2/2)**. Precise, captures the essence: treating quantities as independent absent specific evidence of correlation.

  (ii) **Mostly Correct (2.5/3)**. Calculation (1/2300) is correct. Correct adversarial example (adversary writes a known prime). Error: Claiming the prime density is "proven rather than heuristic" misses that the *presumption* enters when treating a *specific* number as "random" – the theorem gives density, but applying it to an individual number relies on the presumption of no hidden structure. The core point about the presumption excluding hidden provenance is correct and well-illustrated. A hasty grader might miss the conflation of density (theorem) with individual probability (heuristic application).

  (iii) **Excellent (3/3)**. Perfectly explains the core vulnerability: search exploits rare failure modes, unlike random sampling. Correctly links AI systems/optimization to adversarial search ("can find the rare situations"). Explicitly states why this breaks trust in safety arguments relying on typicality. Hits all key points.

  (iv) **Partially Correct (1.5/2)**. Correctly identifies benefits: precise language, mechanical checking, potential for robustness against adversarials (by forcing explicit arguments). **Major Error**: Claiming independence becomes a theorem if no dependence argument is found is false and conflates two things. Gödelian limitations mean the formal system cannot exhaustively search *all possible* arguments (only those expressible/provable within itself). It cannot guarantee no dependence argument exists externally. Also overstates "always has a view" – the system might be undecided. Correctly notes conclusions can be probabilistic. A hasty grader might miss the impossibility of exhaustive search.
