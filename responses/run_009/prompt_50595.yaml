       - **Ensemble (Leaf 2)**: Pragmatist Copenhagen (ψ statistical).  
       - **Operationalism (Leaf 7)**: Instrumentalist Copenhagen (ψ a tool).  
       - **Relational (Leaf 6)**: Contextual Copenhagen (ψ observer-relative).  
     - *Why?* "Copenhagen" is inconsistently defined. The tree forces specificity.  

  3. **Unoccupied Branches & Incoherences**:  
     - **ψ-epistemic + individual systems + no hidden variables (Q4 → "No")**: Incoherent (no outcome mechanism).  
     - **ψ-epistemic + hidden variables with preparation independence**: Ruled out by PBR (violates Q1’s "Yes").  
