  Below is a decision tree for the psi-ontic vs. psi-epistemic question, organized strictly around the nature of the wavefunction. The tree starts from the shared commitment that quantum mechanics correctly predicts measurement statistics. Each node is a concrete, answerable question (no prior knowledge of interpretations needed), and unoccupied branches or indistinct positions are explicitly flagged. The tree yields 8 leaves covering key interpretations, with Bohmian mechanics and GRW grouped under psi-ontic (despite their usual rivalry), while Copenhagen variants and QBism are separated.

  ### **Quantum Wavefunction Decision Tree**  
  *Start here: I accept that quantum mechanics correctly predicts the statistics of measurement outcomes.*

  #### **Q1: Imagine two isolated labs. Lab A prepares a system in state |0⟩; Lab B prepares a system in state |+⟩. The labs are spacelike separated, and the systems are brought together for a joint measurement. Quantum mechanics forbids a specific outcome (e.g., outcome X) if both systems are in the same state (e.g., both |0⟩ or both |+⟩). Could outcome X ever occur?**  
  *(This tests whether distinct pure states can describe the same physical reality.)*  
  - **Yes** → Go to Q2 (opens to psi-epistemic views).  
    *Why? Outcome X suggests |0⟩ and |+⟩ sometimes share identical physical states, making ψ epistemic.*  
  - **No** → Go to Q5 (opens to psi-ontic views).  
    *Why? Outcome X never occurring implies ψ differences always reflect physical differences.*  
  - **I reject the scenario** → Go to Q8 (denies Q1’s presuppositions).  
    *Why? You might question "physical reality," "same state," or independence of preparations.*  

  ---

  ### **Branch 1: "Yes" to Q1 (ψ-epistemic or anti-realist)**  
  #### **Q2: Does the wavefunction represent knowledge/beliefs of a specific agent?**  
  *(This distinguishes subjective from objective epistemic views.)*  
  - **Yes** → **Leaf 1: QBism**.  
    *ψ is an agent’s beliefs; no "god’s-eye view." Agents can assign different ψ to the same system.*  
  - **No** → Go to Q3.  

  #### **Q3: Is ψ a description of an individual system?**  
  *(Ensemble views say no; hidden-variable views say yes but require extra ontology.)*  
  - **Yes** → Go to Q4.  
  - **No** → **Leaf 2: Ensemble Interpretation**.  
    *ψ describes statistical properties of a group of systems (e.g., Einstein’s view). Not defined for individual outcomes.*  

  #### **Q4: Is there an underlying physical state ("hidden variables") determining individual outcomes?**  
  *(PBR rules this out for "preparation-independent" variables—i.e., no hidden correlations between labs.)*  
  - **Yes** → **Unoccupied Branch**.  
    *Why? This requires hidden variables for individual systems but violates preparation independence (labs' systems secretly correlated). Possible in principle, but no working model exists for full QM (e.g., Spekkens' toy model is approximate). Unattractive due to fine-tuning.*  
  - **No** → **Incoherent Branch**.  
    *Why? If ψ describes individuals and is epistemic, something must determine outcomes. No hidden variables → no mechanism for outcomes. Not defended.*  

  ---

  ### **Branch 2: "No" to Q1 (ψ-ontic)**  
  #### **Q5: Is the wavefunction the complete physical state?**  
  *(i.e., is there any extra ontology beyond ψ?)*  
  - **No** → **Leaf 3: Bohmian Mechanics**.  
    *ψ is real (ontic) but incomplete. Needs particles/fields in 3D space. Configuration space is math, not fundamental.*  
  - **Yes** → Go to Q6.  

  #### **Q6: Does ψ always evolve unitarily (no collapse)?**  
  *(Tests if measurement requires a physical exception.)*  
  - **Yes** → **Leaf 4: Everett (Many-Worlds)**.  
    *ψ is the whole physical reality; unitarity always holds. No collapse; "outcomes" branch via decoherence.*  
  - **No** → **Leaf 5: Collapse Models (e.g., GRW)**.  
    *ψ is physical and complete but collapses stochastically (e.g., spontaneous localization).*  

  ---

  ### **Branch 3: "Reject" Q1 (Denies the question’s framing)**  
  #### **Q7: Is ψ defined relative to an observer or context?**  
  *(Distinguishes relational from instrumentalist views.)*  
  - **Yes** → **Leaf 6: Relational/Contextual Views (e.g., RQM)**.  
    *ψ encodes relations between systems; no absolute state. Agents with same info can assign different ψ.*  
  - **No** → **Leaf 7: Operationalism**.  
    *ψ is a tool for calculation (e.g., "shut up and calculate"). No ontology; the ontic/epistemic question is meaningless.*  

  #### **Q8 (if Q1 rejected without committing to Q7): Do you deny that "underlying physical reality" is well-defined?**  
  *(Catches anti-realist nuances.)*  
  - **Yes** → **Leaf 7: Operationalism** (as above).  
  - **No** → *Ambiguous position; revisit Q7 or consider Copenhagen variants below.*  

  ---

  ### **Key Properties of the Tree**  
  1. **Groupings by ψ-nature**:  
     - Bohmian (ψ-ontic + extra ontology) and GRW (ψ-ontic + no extra) share the ψ-ontic branch (Q5).  
     - QBism (ψ-epistemic + subjective) splits from Ensemble (ψ-epistemic + objective) and Copenhagen variants.  

  2. **Copenhagen Handling**:  
