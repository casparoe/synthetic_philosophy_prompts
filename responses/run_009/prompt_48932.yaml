  ### **The Scenario: The Thorne Codicil**
  **Setting:** Mr. Thorne, an eccentric polymath, dies. His will includes a **codicil** (a legally binding amendment) that alters the inheritance of his rare-book collection. The codicil states:  
  > *"I bequeath my library to the University only if the statement on the bronze plaque in my study is true. Otherwise, it shall pass to my nephew."*  

  In Thorne’s study, two items are found:  
  1. **A bronze wall plaque** mounted above the desk:  
     *"The statement in Footnote 3 of my annotated copy of Cervantes' 'Don Quixote' (1949 Ormsby translation, shelf 7B) is true."*  
  2. **Thorne’s personal copy of 'Don Quixote'**, open on his desk. Footnote 3 (handwritten by Thorne) reads:  
     *"The statement on the bronze plaque in my study is not true."*  

  **Discovery:**  
  - Alice (the notary) and Bertrand (the retired logician) are inventorying Thorne’s estate. Alice needs to certify the codicil as "valid and binding" for probate court, which requires confirming whether the plaque's statement is true (triggering the University bequest) or not (triggering the nephew's inheritance).  
  - Bertrand notices the cross-reference between plaque and footnote while examining the book. He points out the loop: the plaque (call it **P**) asserts the truth of the footnote (**F**), while **F** denies the truth of **P**.  
  - **Stakes:**  
    - If Alice certifies incorrectly, she risks legal liability for misallocating assets (worth millions).  
    - The nephew threatens litigation if the University gets the books; the University threatens suit if the nephew inherits.  
    - Bertrand’s pride is on the line—he sees this as a test of his life’s work in logic.  

  **Why it works for your constraints:**  
  - **No self-reference:** **P** and **F** refer to each other, not themselves. **P** talks about **F**; **F** talks about **P**.  
  - **Natural setting:** Codicils, plaques, and marginalia in books are ordinary. The loop emerges from Thorne’s habits (annotating texts, displaying cryptic plaques).  
  - **"Not true" usage:** **F** uses "not true" (not "false"), avoiding triviality.  
  - **Discovery:** Alice and Bertrand piece this together while cataloging the study—no oracle, no infinity.  

  ### **Truth-Theory Analysis**  
  Assume **P**: "**F** is true" and **F**: "**P** is not true." The loop:  
  - If **P** is true, then **F** is true → so **P** is not true (contradiction).  
  - If **P** is false, then **F** is false → so **P** is true (contradiction).  

  Below, we evaluate whether Alice can certify the codicil (i.e., determine if **P** is true to trigger the University bequest). Each theory gives different verdicts:  

  | **Theory**             | **Can Alice Certify?**                                                                 | **Verdict on Inscriptions**                                                                                                                                                              | **Inheritance Outcome**              |  
  |-------------------------|----------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------|  
  | **Tarski Hierarchy**    | **No** (certification impossible).                                                    | **P** and **F** are ill-formed. They mix object/metalanguage levels and cannot be assigned truth values. "This isn't logic—it's nonsense." (Bertrand dismisses them entirely.)           | Codicil void; nephew inherits by default will. |  
  | **Paracomplete (Gap)**  | **Yes, but for the nephew**.                                                           | **P** and **F** are **neither true nor false** (gappy). **P** is *not true*, so the University condition fails. "No truth value? Then the condition isn't satisfied." (Alice pragmatically moves on.) | Nephew inherits.                     |  
  | **Dialetheist**         | **Yes, but for the University**.                                                       | **P** and **F** are **both true and false** (a true contradiction). **P** *is true* (so condition satisfied), even though also false. "Truth isn't tidy!" (Bertrand argues for embracing the mess.) | University inherits.                 |  

  #### **Where Theories Diverge**  
  - **Tarski vs. Paracomplete**: Tarski rejects the sentences as meaningless; Paracomplete treats them as truth-valueless but pragmatically actionable (Alice can use **P**’s lack of truth to deny the University).  
  - **Paracomplete vs. Dialetheist**: Paracomplete sees a "gap" (no truth value), allowing Alice to default to the nephew; Dialetheist sees a "glut" (both values), forcing Alice to act on **P**’s truth for the University.  
  - **Tarski vs. Dialetheist**: Tarski imposes hierarchy to avoid paradox; Dialetheist collapses hierarchy by accepting contradictions.  

  **Key Divergence Driver**: The **truth-value gap/glut distinction**. Paracomplete uses **F**’s "not true" to exploit **P**’s gappy status (so the condition fails). Dialetheist prioritizes **P**’s truth (so the condition succeeds). Tarski voids the whole endeavor.  

  #### **What if one inscription quotes the other verbatim?**  
  Suppose **F** is changed to:  
  > *"The sentence 'The statement in Footnote 3 of my annotated copy of Cervantes' "Don Quixote" (1949 Ormsby translation, shelf 7B) is true' is not true."*  

  This **quotes P verbatim** but changes nothing:  
  - **Tarski**: Still a level-mixing loop—ill-formed.  
  - **Paracomplete**: Still gappy—**P** is not true, so University loses.  
  - **Dialetheist**: Still a dialetheia—**P** is true, so University wins.  
  Quoting makes the loop explicit but doesn’t alter outcomes. Realism is preserved (people quote verbatim in footnotes).  

  ### **Feasibility Check**  
  - **Constraints satisfied**: No demons, no self-reference, ordinary setting. The loop is plausible (e.g., Thorne tweaked the footnote years after installing the plaque).  
  - **Realism**: Probate often involves ambiguous clauses. A notary certifying a codicil’s validity (not just signatures) is attested in case law (e.g., *Estate of Duke*, 1996).  
  - **Theories generate conflict**: Alice and Bertrand can have heated debates:  
    - Alice (practical) leans Paracomplete: "The plaque isn’t true, so the nephew gets it. Let’s move on!"  
    - Bertrand (rigorous) champions Tarski: "This is word-soup! We can’t certify any of it!"  
    - A third character (eccentric colleague) could advocate Dialetheism: "Why not both? Certify for the University!"  
  - **Stakes remain**: Certification risks lawsuits; delay risks estate taxes.  

  ### **Why This Works for Your Novel**  
  - **Dialogue fuel**: Each theory offers distinct arguments about certification, truth, and responsibility. Bertrand can monologue about Tarski; Alice can parry with legal pragmatism.  
  - **Character arcs**: Alice’s practicality clashes with Bertrand’s idealism. The unresolved tension mirrors literary themes of ambiguity.  
  - **No cheat**: Theories split cleanly on whether Alice can act (and how), creating drama without "truth breaking" as a deus ex machina.  

  This setup ensures the paradox feels earned, the theories dictate the conflict, and the notary’s dilemma is visceral. Use the codicil’s fate to explore truth, duty, and the limits of reason—perfect for literary fiction.
