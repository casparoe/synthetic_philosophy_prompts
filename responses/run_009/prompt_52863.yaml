prompt: |-
  I'm a genetic counselor at a fertility clinic that has begun offering embryo screening beyond single-gene tests — polygenic risk scores for diabetes, heart disease, depression, and more — and the volume of selection requests has outpaced our ad hoc way of handling them. Our clinical director has asked me to draft a decision procedure the counseling team can run on any request, and she wants it grounded in the principle of procreative beneficence: the claim that parents have at least a pro tanto moral reason, among the children they could have, to choose the one expected to have the best prospects for a flourishing life. Our staff disagree about whether that's a duty, a mere permission, or a pernicious idea, and the procedure has to be usable in a twenty-minute consult by nurses with no philosophy background, often under time pressure because decisions must be made before a transfer cycle. Please write that procedure: the questions to ask in order (severity and age of onset of the condition, how informative the risk score actually is, whether the condition is treatable, how many healthy alternatives the parents have, whether the trait is identity-affecting — i.e., whether selecting against it means a different child or a better life for the same child), what counts as a sufficient answer to each, where the procedure ends in a firm 'we don't advise that', and where it must hand the decision back to the parents because the question is one of values rather than clinical facts — and be honest about which steps are judgment calls dressed up as procedure. Then run it on three cases: parents choosing against an embryo that will develop a fatal neurodegenerative disease in mid-life; parents asking to deselect embryos with elevated polygenic scores for depression despite having no family history; and a Deaf couple requesting selection for deafness so their child joins the Deaf community, which I suspect several of our counselors privately think the procedure should permit even though our director will hate that answer. Finally, say where the procedure misfires or underdetermines the answer — especially for polygenic scores, where 'best prospects' gets slippery — and what it cannot settle at all.
reasoning: |-
  Okay, let me approach this genetic counselor's request methodically. The user needs a practical decision procedure grounded in procreative beneficence for embryo selection cases, with specific implementation challenges: time constraints, non-philosophical staff, and controversial value judgments. 

  First, I consider how to translate "best prospects for flourishing" into operable steps. The key elements seem to be: impact of conditions (severity/onset), reliability of predictions (especially tricky for polygenic scores), and alternatives available. But I must flag where clinical facts end and value judgments begin - like how to weigh treatable conditions or identity-affecting traits.

  The procedure must work in 20-minute consults. So I'm structuring it as a flowchart with binary checkpoints that nurses can follow quickly. Each question needs concrete thresholds (e.g., "severe" = lethal childhood disease, "high confidence" = monogenic vs polygenic). I'll explicitly note where steps involve disguised judgment calls - like defining "meaningful suffering" or "reasonable alternatives".

  For the case applications: 
  - The fatal neurodegenerative case clearly satisfies procreative beneficence grounds for deselection. 
  - The depression PRS case is murkier - low predictability and treatability make deselection harder to justify. 
  - The Deaf couple's request directly challenges the premise, as community belonging might constitute "flourishing" in their framework. The procedure should expose this value conflict rather than resolve it.

  I'm anticipating three major limitations: 
  1) Polygenic scores' probabilistic nature blurs "expected best prospects" 
  2) Identity-affecting selections (like deafness) force arbitrary flourishing definitions 
  3) Resource constraints (number of embryos) create variable selection pressure

  The conclusion must emphasize that this tool doesn't replace counseling - it just structures discussions about what procreative beneficence actually demands in messy real-world cases. Especially when parents' conception of flourishing diverges from clinical assumptions.
answer: |-
  Here’s a practical decision procedure grounded in **procreative beneficence (PB)**, designed for 20-minute consults with clear thresholds, judgment flags, and case applications. The procedure prioritizes clinical feasibility while acknowledging ethical gray zones.

  ---

  ### **Embryo Selection Decision Procedure**  
  *(Based on Procreative Beneficence: "Select the embryo with the best expected prospects for flourishing")*  
  **Ask these questions in order—stop if any answer triggers a red flag (❌).**  

  1. **SEVERITY & ONSET**  
     *Question:* "Does the condition cause **early death, profound disability, or severe suffering before adulthood?**"  
     - ✅ **Proceed if**: Late-onset (>50 yrs), mild/moderate impact, or treatable.  
     - ❌ **Stop/Discourage** if: **Fatal in childhood/young adulthood** (e.g., Tay-Sachs) OR **untreatable severe impairment** (e.g., lethal skeletal dysplasia).  
     *Judgment Call Alert:* "Severe suffering" is subjective (e.g., is chronic pain "severe"?). Default to WHO disability-adjusted life years (DALYs) guidelines.  

  2. **PREDICTIVE CERTAINTY**  
     *Question:* "How reliable is the test for this condition? Is it **monogenic (single-gene) or polygenic (risk score)?**"  
     - ✅ **Proceed if**: Monogenic with >90% penetrance OR polygenic score with **high clinical validity** (e.g., AUC >0.75 in diverse populations).  
     - ❌ **Stop/Discourage** if: Polygenic score with **low predictive power** (e.g., AUC <0.65) OR poor population diversity validation.  
     *Judgment Call Alert:* AUC thresholds are arbitrary; depression PRS often has AUC ~0.6, making it weak for embryo selection.  

  3. **TREATABILITY/PREVENTION**  
     *Question:* "Can the condition be **effectively treated, prevented, or managed** with low burden?"  
     - ✅ **Proceed if**: Highly treatable (e.g., familial hypercholesterolemia with statins) OR preventable (e.g., BRCA+ with prophylactic surgery).  
     - ❌ **Stop/Discourage** if: **No effective treatment** (e.g., Huntington’s disease) AND high severity (from Step 1).  
     *Judgment Call Alert:* "Low burden" is subjective (e.g., is lifelong insulin for diabetes "low burden"?).  

  4. **ALTERNATIVES AVAILABLE**  
     *Question:* "Are there **other embryos without this risk** that are otherwise viable?"  
     - ✅ **Proceed if**: Multiple euploid embryos available.  
     - ❌ **Stop/Discourage** if: **This is the only viable embryo** OR all others have equal/severe risks.  
     *Judgment Call Alert:* "Viable" includes genetic *and* morphological factors—requires embryologist input.  

  5. **IDENTITY-AFFECTING?**  
     *Question:* "Would selecting **against** this trait likely result in a **different child** (e.g., via embryo substitution)?"  
     - ✅ **PB Applies**: If **same child** (e.g., treating cystic fibrosis in utero). Proceed to selection.  
     - ⚠️ **Hand to Parents**: If **different child** (e.g., selecting for/against deafness). *PB does not clearly apply—values decision.*  

  ---

  ### **Case Applications**  
  **Case 1: Fatal Neurodegenerative Disease (e.g., Huntington’s)**  
  1. **Severity**: ❌ Fatal, mid-life onset with severe decline.  
  2. **Predictive Certainty**: ✅ Monogenic, >99% penetrance.  
  3. **Treatability**: ❌ No effective treatment.  
  4. **Alternatives**: Assume other embryos available.  
  **Outcome**: **Discourage transfer** (red flag at Steps 1 & 3). PB strongly supports deselection.  

  **Case 2: Polygenic Risk for Depression (No Family History)**  
  1. **Severity**: ✅ Variable impact; not invariably severe. Proceed.  
  2. **Predictive Certainty**: ❌ Depression PRS typically has AUC ~0.6—low for embryo selection.  
  **Outcome**: **Discourage selection**. Risk score is poorly predictive; PB justification weak.  

  **Case 3: Deaf Couple Selecting *for* Deafness**  
  1. **Severity**: ✅ Deafness not life-limiting; flourishing possible in Deaf community. Proceed.  
  2. **Predictive Certainty**: ✅ High if monogenic (e.g., Connexin 26).  
  3. **Treatability**: ✅ Not "treatable" in this context (culturally undesirable).  
  4. **Alternatives**: Assume other non-deaf embryos.  
  5. **Identity-Affecting**: ⚠️ **Different child** (embryo substitution).  
  **Outcome**: **Hand to parents**. PB cannot resolve—flourishing is community-dependent. *Procedure permits but does not endorse.*  

  ---

  ### **Where the Procedure Fails**  
  1. **Polygenic Slipperiness**:  
     - Low predictive power (AUC <0.7) makes "best prospects" speculative. E.g., a high diabetes PRS may never manifest with lifestyle interventions.  
     - *Procedure misfire*: Over-rejects embryos for manageable conditions.  

  2. **Identity-Affecting Traits**:  
     - PB collapses when selecting *for* disabilities tied to cultural identity (e.g., deafness). Who defines "flourishing"?  
     - *Underdetermines*: Cannot arbitrate between medical vs. social models of disability.  

  3. **Unresolvable Conflicts**:  
     - **Resource constraints**: If all embryos have suboptimal scores, PB offers no guidance.  
     - **Value clashes**: E.g., selecting against depression PRS might select for lower empathy. PB cannot weigh trait trade-offs.  

  4. **Invisible Judgment Calls**:  
     - "Severe suffering," "low burden," and AUC thresholds are presented as clinical but are inherently normative.  

  ---

  ### **Conclusion**  
  This procedure:  
  ✅ **Works** for clear monogenic disorders with early/severe impact.  
  ⚠️ **Struggles** with polygenic traits (low predictability) and identity-affecting selections.  
  ❌ **Cannot resolve** value disputes (e.g., Deaf community) or trait trade-offs.  

  **Recommendation**: Use this to triage *medically unambiguous* cases in time-pressed consults. For all others, flag as "values decision—requires in-depth counseling." PB is a permission, not a duty, and the procedure reflects that limitation.
