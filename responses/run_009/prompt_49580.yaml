prompt: |-
  I'm a staff engineer at a mid-sized payments company, and I sit on our Architecture Review Board, which has to sign off next week on a proposal to migrate our billing pipeline off a fourteen-year-old Ruby monolith onto a new service. The migration plan drops a set of undocumented compatibility shims in the old system — dead-looking code paths that reroute invoices under conditions no one on the current team can explain. One of those shims, we learned from an incident postmortem last year, was silently catching a specific class of malformed customer records and would have cost us a seven-figure revenue discrepancy if removed; another, which we traced through an old commit, was confirmed to be leftover scaffolding for a payment provider we dropped in 2012. So the same category of "inexplicable legacy behavior" has contained both a load-bearing wall and genuine cruft.

  I have no philosophy background, but a while ago I read about something called Chesterton's fence — the idea that you shouldn't remove a fence until you know why someone put it up — and it seems to describe our situation exactly. Two of my colleagues on the board are already dug in. One says the principle settles it: if we can't explain a shim, we keep it or replicate it in the new system, full stop. The other says the principle proves far too much: every line of code was written by someone for some reason, so taken literally it forbids us from ever deleting anything, and our codebase becomes immortal; she also points out that the last time someone invoked the fence idea in a review, it delayed a critical security patch by six weeks while we "investigated" an obsolete code path. And the migration has a hard deadline from finance, so we can't just slow-walk the whole thing.

  Please draft the written opinion I'll circulate to the board before the meeting. It should:

  1. Recommend a concrete, actionable policy on when undocumented legacy behavior must be preserved, investigated further, or can be removed — a rule or procedure my fellow engineers could actually apply to the remaining shims, not a vague "be careful."
  2. Give a definite verdict on the migration proposal itself: approve as-is, approve with conditions (specify them), or defer (specify what would change your mind and who owns it).
  3. Take the fence principle seriously as stated — explain what's right about it — but also give an honest treatment of the strongest version of my colleague's objection that it licenses never deleting anything, and say how your recommended policy handles that tension rather than just balancing the two slogans against each other.
  4. Where relevant, draw on the broader conservative tradition the fence idea comes from — the thought that institutions and practices may encode functional knowledge that no individual participant possesses, so reformers who see only inefficiency may be destroying something load-bearing. Our situation seems like a literal case of that, and I'd like the memo to engage with it, but written for engineers: no philosopher names or jargon are required, and if you use them, define them inline. Assume the readers are smart, skeptical, and allergic to anything that sounds like a TED talk.

  For context: our team has a two-week investigation budget before the migration freeze, we can canary the new pipeline against 1% of production traffic with automated invoice-reconciliation checks, and we have access to the full version-control history going back to 2011, though the commit messages are famously useless.
reasoning: |-
  We are given a situation where an Architecture Review Board must decide on a migration plan that involves removing undocumented compatibility shims in a legacy system. The memo must address the concerns about Chesterton's fence while providing a concrete policy and a verdict.

   Key elements:
   - Some shims are critical (like the one catching malformed records) and some are obsolete (like the one for a dropped payment provider).
   - There is a hard deadline from finance.
   - The team has a two-week investigation budget, 1% canary with automated checks, and version control history (with poor commit messages).

   The memo should:
   1. Recommend a concrete policy for handling undocumented legacy behavior (preserve, investigate, remove).
   2. Give a definite verdict on the migration proposal (with conditions if needed).
   3. Engage with Chesterton's fence and the objection that it might forbid all deletion.
   4. Draw on the broader conservative tradition (without jargon) to explain that some practices encode functional knowledge.

   Approach:

   For the policy:
     We can categorize the shims and set up a procedure:
     Step 1: Attempt to determine the purpose of each shim using available means (code analysis, version history, incident history, etc.).
     Step 2: If the purpose is found and it is still relevant, preserve (or replicate in the new system). If found and obsolete, remove.
     Step 3: If the purpose is unknown, then we must treat it as potentially critical. However, we have limited time.

     Given the time constraint (two weeks) and the canary option, we can propose:
     - For each shim that cannot be explained within the investigation budget, we replicate it in the new system but mark it for future investigation (with a ticket and a deadline) and also set up monitoring and logging specifically for that shim's behavior in the new system.
     - Additionally, we can use the canary to test the new system without the shim? Actually, we can test the new system with the shim replicated, and then if we want to remove it later, we can do so in a controlled way.

     But note: the migration plan currently drops the shims. We are to recommend a policy for the remaining shims.

     Alternatively, we can:
     - Investigate as many shims as possible in the two weeks.
     - For the ones that remain unexplained, we replicate them in the new system (with clear comments and logging) and plan to remove them after the migration only after a period of observation and further analysis.

     However, the objection is that we might be replicating obsolete code. So we must balance.

     Proposed policy:

     We will classify each undocumented shim into one of three categories:

     Category A (Preserve): The shim's purpose is understood and still relevant. Replicate in the new system.

     Category B (Remove): The shim's purpose is understood and obsolete. Remove.

     Category C (Unknown): The purpose remains unknown after investigation.

     For Category C, we do the following:
       - Replicate the shim in the new system, but with enhanced logging and metrics to capture when it is triggered and what data passes through it.
       - Additionally, we create a post-migration investigation ticket (with high priority) to determine the purpose within a fixed time (e.g., 3 months) and assign an owner.
       - During the canary phase, we will run the new system with the replicated shim and monitor for any discrepancies. If the shim is triggered during the canary, we will log and alert so we can analyze immediately.

     Why replicate for Category C?
       - Because we know that some shims are critical and we cannot risk a production incident. The canary with 1% traffic might not catch a rare condition (like the malformed records that were caught by the shim, which might be rare).

     But note: the canary has automated invoice-reconciliation checks. This might catch discrepancies. However, we cannot rely on the canary to catch every edge case because 1% of traffic might not include the problematic case.

     Therefore, we replicate the Category C shims in the new system temporarily, with a plan to remove them after we have observed and investigated.

     Also, we must set a clear process for the post-migration removal: after we have collected enough data (or after the investigation ticket is resolved) we will remove the shim if it is found to be obsolete.

     How to allocate the two-week investigation budget?
       - We prioritize shims that are in code paths that are more frequently executed (because they are more likely to be hit in the canary and also because they might be more critical) and shims that have been linked to past incidents.

     Verdict on the migration proposal:
       - The current proposal drops the shims. We cannot approve as-is because of the risk of removing a critical shim.

       We recommend: Approve with conditions.

       Conditions:
         1. The migration must replicate all shims that fall into Category C (unknown) and Category A (preserve) in the new system.
         2. The team must use the two-week investigation budget to classify as many shims as possible. For any shim that they cannot classify within two weeks, it defaults to Category C (and must be replicated in the new system with logging and a post-migration investigation ticket).
         3. The migration must include the canary phase (1% traffic) with the automated invoice-reconciliation checks, and the checks must be set to alert on any discrepancy. Additionally, during the canary, we will enable detailed logging for the replicated Category C shims to capture any activation.
         4. The team must create a post-migration plan (with owners and deadlines) to investigate and remove any replicated shims that are found to be obsolete. We suggest a 3-month window for this.

     How to address the fence principle and the objection?

     Chesterton's fence reminds us that systems often contain elements that were designed for reasons that may not be immediately apparent. Removing them without understanding can cause harm. This is especially true in complex systems that have evolved over time, where the original context may be lost.

     The objection: taken literally, we might never delete anything because every line of code was written for a reason. However, we must recognize that not every reason remains valid. The conservative approach is not to never change, but to change with caution and with respect for the possibility that the original designers had wisdom we lack.

     Our policy handles this by:
       - Not removing what we don't understand (Category C is replicated) until we have taken steps to understand it (through logging and post-migration investigation).
       - But also, we do remove what we can prove is obsolete (Category B) and we set a process to eventually remove the replicated shims once we have gained understanding (via the post-migration investigation).

     This balances the need for progress (migration by the deadline) with the need for stability.

     Broader conservative tradition: The idea that institutions (or systems) may encode knowledge that individuals do not possess. In our case, the shims are part of the institutional memory of the system. We don't remove them arbitrarily because they might be serving a purpose we don't see. Our policy respects this by requiring replication for the unknown, but it also sets up a process to capture that knowledge (through investigation and logging) so that we can eventually make an informed decision.

     We are not making the codebase immortal because we have a clear process to remove the replicated shims once we have verified they are obsolete.

   Draft the memo:

   Subject: Recommendation on Billing Pipeline Migration and Handling of Legacy Compatibility Shims

   To: Architecture Review Board
   From: [Your Name]

   Date: [Current Date]

   Introduction:
     We are reviewing the proposal to migrate our billing pipeline off the legacy Ruby monolith to a new service. A key aspect is the removal of undocumented compatibility shims, some of which have proven critical (as in the incident last year) and some obsolete. This memo outlines a recommended approach for handling these shims, considering the principles of system stability and the need to meet our deadline.

   Chesterton's Fence and Its Wisdom:
     The principle of Chesterton's fence states that we should not remove a fence until we understand why it was put there. This is a valuable caution in systems engineering: legacy code, especially in a system as critical as billing, may contain safeguards against rare but severe conditions. The fence principle reminds us that the original authors may have had insights we lack, and removing such code without understanding can lead to catastrophic failures.

   The Counter-Argument and Its Merit:
     However, we cannot preserve every piece of legacy code indefinitely. Not every fence remains necessary; some become obstacles. Our colleague rightly points out that if we applied the fence principle without exception, we would never delete code and our systems would become unmaintainable. Moreover, we have experienced the cost of over-application: a six-week delay on a security patch for obsolete code.

   Proposed Policy for Legacy Shim Handling:
     We must balance these concerns with a pragmatic, risk-based approach. I recommend the following procedure for each undocumented shim:

     1. **Investigation Phase (Two Weeks)**: 
          - Use the allocated two weeks to investigate each shim. Use every available resource: version control (even with poor commit messages), incident history (like the postmortem that revealed the critical shim), and code analysis (to see what conditions trigger the shim and what data flows through it).
          - Prioritize shims that are in frequently executed code paths or have been linked to past incidents.

     2. **Categorization**:
          - **Category A (Preserve)**: The shim's purpose is understood and still relevant. We replicate it in the new system.
          - **Category B (Remove)**: The shim's purpose is understood and obsolete. We remove it.
          - **Category C (Unknown)**: The purpose remains unknown after investigation. We replicate it in the new system but with the following safeguards:
              - Add detailed logging and metrics to capture when the shim is triggered and the data it processes.
              - Create a high-priority post-migration investigation ticket (assigned to an owner) to determine the purpose within three months of the migration.

     3. **Post-Migration Follow-Up**:
          - For Category C shims, the assigned owner must complete the investigation within three months. Based on the findings, we will either:
              - Remove the shim (if obsolete) and update tests to cover the scenario if necessary, or
              - Document and retain it (if critical).
          - During the canary phase (1% of production traffic), we will enable the logging for Category C shims and set alerts for any triggering event. The automated invoice-reconciliation checks will also help detect issues.

   Verdict on the Migration Proposal:
     We cannot approve the current proposal as-is because it drops all shims without regard for potential critical functionality. However, we can approve it with the following conditions:

     - Condition 1: The migration must replicate all Category A and Category C shims in the new system.
     - Condition 2: The team must use the two-week investigation budget to classify every shim. Any shim not classified by the end of the two weeks defaults to Category C.
     - Condition 3: The migration plan must include the canary phase with automated invoice-reconciliation checks, and the checks must be set to alert on any discrepancy. Additionally, during the canary, we must log every activation of a Category C shim for immediate analysis.
     - Condition 4: The team must create a post-migration plan (with owners and deadlines) to resolve the Category C shims within three months.

     If these conditions are met, we can proceed with the migration by the deadline while mitigating the risk of removing a critical shim.

   Conclusion:
     This approach respects the wisdom encoded in our system (by not removing what we don't understand) while acknowledging the need to evolve. It avoids the trap of immortal code by mandating a timely investigation post-migration. We balance the fence principle with pragmatism: we keep the fence temporarily until we can be sure it is safe to take it down.

     I recommend we approve the migration proposal subject to the above conditions.
answer: |-
  ### Memorandum  
  **To:** Architecture Review Board  
  **From:** [Your Name], Staff Engineer  
  **Subject:** Recommendation on Billing Pipeline Migration & Legacy Shim Policy  
  **Date:** October 26, 2023  

  ---

  #### **1. Proposed Policy for Undocumented Legacy Behavior**  
  We need a clear, risk-based framework to handle undocumented shims. I recommend the **"3-Category Rule"** for each shim, applied as follows:  

  - **Category 1: Preserve & Replicate**  
    *Trigger:* The shim impacts revenue, security, compliance, or error handling (e.g., our seven-figure revenue catch).  
    *Action:* Replicate in the new system immediately. Add logging/alerting to document its behavior post-migration.  
    *Justification:* Protects against known high-impact risks.  

  - **Category 2: Investigate (Time-Boxed)**  
    *Trigger:* The shim’s purpose is ambiguous, but it:  
    - Operates in a high-traffic code path,  
    - Handles edge cases (e.g., invoice formatting, currency conversion),  
    - Or has no linked incident history.  
    *Action:* Allocate ≤2 days per shim from our investigation budget. Use:  
    - Version-control history (git blame, file history),  
    - Correlation with past incidents/monitoring data,  
    - Static code analysis to trace data flows.  
    *Outcome:* Reclassify as Category 1 or 3.  

  - **Category 3: Remove**  
    *Trigger:* The shim is provably obsolete (e.g., tied to deprecated providers like the 2012 payment scaffold) **or** has low risk + no activation in 12+ months.  
    *Action:* Drop it. Add a test asserting the expected failure mode (e.g., "malformed records throw error").  
    *Justification:* Eliminates cruft without compromising safety.  

  **Procedure for Unresolved Shims:**  
  - If a shim remains unclassified after 2 days of investigation, default to **Category 1** (replicate) but:  
    - Instrument it to log inputs/outputs in the new system,  
    - Flag it for post-migration deletion within 90 days,  
    - Trigger automated alerts if activated.  

  ---

  #### **2. Verdict on Migration Proposal**  
  **Approve with Conditions:**  
  - **Condition 1:** All shims must be classified using the 3-Category Rule before migration.  
  - **Condition 2:** Replicate Category 1 shims verbatim in the new system, with added observability.  
  - **Condition 3:** Use the 1% canary to test removal of Category 3 shims. Run automated invoice-reconciliation checks for 72 hours. Any discrepancy ≥0.1% halts migration.  
  - **Condition 4:** Post-migration, delete replicated shims within 90 days. **Owner:** [Lead Engineer Name].  

  *Deadline Impact:* This aligns with finance’s deadline. The 2-week investigation budget covers ~5–7 shims (2 days/shim). Canary testing adds ≤3 days.  

  ---

  #### **3. Chesterton’s Fence: Wisdom and Limits**  
  **Why the Fence Principle Matters**  
  Legacy systems encode institutional knowledge. Like a fence in a field, a shim may exist to prevent a "cliff" we can’t see—e.g., catching malformed records that could lose millions. Removing it without understanding risks collapse. This isn’t philosophy; it’s **defensive engineering**. Complex systems often rely on emergent, undocumented behaviors shaped by years of battle scars.  

  **Addressing the Objection: "It Licenses Immortal Code"**  
  The strongest counter-argument is valid: If we never delete code "just in case," systems ossify. But Chesterton’s fence isn’t a veto—it’s a **call to diagnose before surgery**. My policy avoids immortal code by:  
  - **Forcing explicit risk assessment** (Categories 1–3 replace vague suspicion),  
  - **Sunsetting replicated shims** (90-day deletion clock),  
  - **Leveraging automation** (canary tests prove obsolescence).  
  This mirrors how conservatism works in practice: *Preserve until you verify, then modernize ruthlessly.*  

  ---

  #### **4. The Bigger Picture: Institutional Knowledge**  
  The "fence" idea grows from observing that practices outlive their creators. A shim written in 2010 might address a failure only encountered once a year—knowledge lost to turnover. This is **distilled experience embedded in code**. But institutions also accumulate debris. Our policy respects functional wisdom (Category 1) while rejecting inertia (Category 3).  

  **Why This Works for Engineers**  
  - **No dogma:** Categories tie action to evidence (e.g., "high-traffic" or "12+ months inactive").  
  - **Tool-driven:** Uses existing assets (version history, canaries, logging) to replace guesswork.  
  - **Balances speed/safety:** 2-day investigations + canaries mitigate risk without paralysis.  

  ---

  #### **Recommendation Summary**  
  1. **Adopt the 3-Category Rule** for all legacy shims.  
  2. **Approve the migration** with the four conditions above.  
  3. **Replicate only unknown/high-risk shims**—then delete them on schedule.  

  We honor the past by understanding it, not by embalming it. Let’s move forward—with logs and a deadline.  

  // Signed //  
  [Your Name]
