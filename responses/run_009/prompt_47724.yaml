prompt: |-
  Been trying to sort out what I actually believe about coherence arguments for EU maximization by just listing my gut reactions to cases, and the list is kind of a mess. Getting Dutch-booked — bets that each look good on their own but together guarantee I lose money: not fine, full stop. The classic money pump, paying a dollar to switch A→B, another dollar B→C, then another C→A till I'm back where I started minus three dollars: also not fine. Allais preferences though — taking the certain million over the gamble, and then taking the 10% shot at 5 million over the 11% shot at 1 million, which together break independence: fine honestly, I'd bite that bullet, people who dogmatically obey independence feel like they're optimizing for the axiom instead of the money. Refusing each bet in a series of individually +EV flips but happily taking all of them as a package: fine, even smart, thats just looking at aggregate risk instead of isolating each flip — even though I'm pretty sure it's also technically an independence violation. Being moved by framing, choosing differently when the same surgery is described as 90% survival vs 10% mortality: not fine.

  So is there actually one principle behind all this? The obvious candidate is something like "a preference pattern is only irrational if it's exploitable, axiom violations by themselves don't matter" — that saves my Allais and my bet-bundling verdicts while keeping the Dutch book and money pump ones. But then framing sensitivity seems exploitable too (someone re-describes the same offer twice and charges me a penny each time I flip), so does it survive? And the case I keep going back and forth on: I would honestly pay a small fee to NOT be offered a bunch of even-money bets at all, since I know I'll take some and it'll eat my attention — but refusing to even hear an offer looks like it violates the "more options can't hurt" thing that falls out of EU. Give me the best principle or small set of candidates, say exactly which of my verdicts each one can't accommodate, and tell me what the winner says about the pay-to-not-be-offered case. Feel like everyone quotes the money pump theorem at me but nobody ever says which side of these lines they're actually standing on.
reasoning: |-
  Okay, the user is really wrestling with coherence arguments for expected utility (EU) maximization. They've listed several scenarios where their gut reactions conflict with standard axioms. Let me unpack their examples one by one.

  First, Dutch books and money pumps clearly feel exploitative to them - losing money for no reason is irrational. That makes sense; these are classic examples of dynamic inconsistency.

  Then Allais paradox: they're fine violating independence here. Prioritizing certainty over a small chance of nothing, even if it breaks the axiom? That's actually mainstream behavioral economics now. Their intuition matches real human behavior.

  Refusing individual bets but taking them as a bundle? They see this as smart risk management. Technically violates independence but feels rational - and they're right, it's about portfolio effects.

  Framing effects (survival vs mortality rates) bother them though. And this is interesting because it's not directly exploitable unless someone charges for reframing.

  The pay-to-avoid-offers case is their real sticking point. Paying to not even hear bets? That violates EU's "more options can't hurt" but feels rational if decisions have mental costs.

  Their core tension: they want a principle where only exploitability matters, not axiom violations per se. But framing effects challenge this. And mental transaction costs complicate everything.

  The mental transaction cost framework seems most promising here. It explains Dutch books/money pumps as actual exploitation, Allais as context-dependent rationality, bundling as cognitive efficiency, framing as avoidable irrationality, and even their pay-to-avoid-offers dilemma - mental bandwidth is scarce.

  Key insight: EU axioms assume costless cognition. Once we model decision costs, many "irrationalities" become rational adaptations. Their intuitions are consistently pointing to this deeper principle.
answer: |-
  Here's a breakdown of principles, how they handle your intuitions, and the verdict on your "pay-to-not-be-offered" case:

  **The Core Tension:** You intuitively accept that violations of EU axioms (like Independence) are *sometimes* rational (Allais, Bet Bundling) but *sometimes* irrational (Dutch Books, Money Pumps, Framing). The key is distinguishing *which* violations make you vulnerable to *exploitation* versus those that reflect rational context-sensitive preferences or cognitive costs.

  **Candidate Principles & How They Handle Your Cases:**

  1.  **"Strict Exploitability Only" Principle:** *A preference pattern is irrational only if it allows a fully informed, strategic opponent to extract guaranteed resources from you (or force a dominated outcome) through a sequence of choices you will accept.*
      *   **Dutch Books:** **IRRATIONAL.** Opponent offers bets you accept individually, guaranteeing your loss.
      *   **Money Pump:** **IRRATIONAL.** Opponent exploits cyclic preferences to extract money indefinitely.
      *   **Allais:** **RATIONAL.** No sequence of trades forces you into a dominated outcome. Your choices, even violating independence, don't open you to guaranteed loss by an opponent.
      *   **Bet Bundling:** **RATIONAL.** An opponent can't exploit you. You *prefer* the bundle *because* it reduces risk; refusing individual offers doesn't create an exploitable opening for guaranteed loss. (Taking the bundle shows you understand the aggregate EV).
      *   **Framing:** **RATIONAL (Problematic).** This is the weakness. A purely strategic opponent *can* exploit framing: Offer Surgery described as "10% mortality" - you refuse. Immediately re-offer *the exact same surgery* described as "90% survival" - you accept. They charge you a fee for the "new" offer. This is a money pump via description changes. Strict exploitability says this is irrational, but your intuition says it's not fine.
      *   **Pay-to-Not-Be-Offered:** **RATIONAL (Under this principle).** Paying to avoid being offered a bet isn't itself exploited by an opponent *forcing* choices that drain you. You're proactively avoiding a *potential* choice you might make (taking the bet) that you later regret due to attention costs. No guaranteed extraction loop exists *within the offered choices*.
      *   **Verdict:** Captures Dutch Books, Money Pumps, Allais, Bet Bundling, and Pay-to-Not-Be-Offered well. **Fails** to condemn Framing sensitivity in an exploitable way that matches your intuition.

  2.  **"Dynamic Consistency + No Free Exploitability" Principle:** *Preferences are irrational if they lead to dynamically inconsistent choices (choosing A over B now but planning/choosing B over A later in a way you'd regret) that a strategic opponent can exploit for guaranteed gain, OR if they make you susceptible to exploitation through state/description changes (framing).*
      *   **Dutch Books:** **IRRATIONAL.** Dynamic inconsistency in probability assessment exploited.
      *   **Money Pump:** **IRRATIONAL.** Dynamic inconsistency in preference (A>B, B>C, C>A) exploited.
      *   **Allais:** **RATIONAL.** Your choices are dynamically consistent *given your state-dependent preferences* (certainty effect). No planned reversal.
      *   **Bet Bundling:** **RATIONAL.** Your choice *is* dynamically consistent: you prefer the bundle *now* and refuse individuals *now* based on aggregate risk. You don't plan to reverse.
      *   **Framing:** **IRRATIONAL.** Explicitly condemned. Changing description changes your choice for the *identical* outcome state, creating inconsistency exploitable via re-description fees (a form of money pump).
      *   **Pay-to-Not-Be-Offered:** **RATIONAL? IRRATIONAL?** This is tricky. You *prefer* not to have the option available because you predict you'll make a choice (taking the bet) that you later regret due to attention cost. This *could* be seen as a sophisticated dynamic inconsistency: You know your future self will make a "mistake" (taking the bet) relative to your current broader perspective including attention cost, so you pay to prevent it. This avoids exploitation *by an external opponent* but involves an internal conflict. The principle doesn't *clearly* force an irrational verdict if no external exploitability exists.
      *   **Verdict:** Captures Dutch Books, Money Pumps, Framing, Allais, and Bet Bundling well. Ambiguous on Pay-to-Not-Be-Offered (leaning towards potentially rational if seen as sophisticated avoidance of internal conflict/regret).

  3.  **"Rationality Under Mental Transaction Costs" Principle:** *Preferences are rational if they maximize expected utility *including* the cognitive costs (attention, regret, willpower, computation) of decision-making itself. Violations of standard axioms are irrational only if they persist or lead to exploitation *after* accounting for these costs.*
      *   **Dutch Books / Money Pumps:** **IRRATIONAL.** The losses incurred are pure resource drains, not offset by any cognitive savings. They persist even if you factor in decision costs.
      *   **Framing:** **IRRATIONAL.** Sensitivity to logically equivalent descriptions doesn't reflect a real cognitive cost savings; it's an error in processing information. The "fee for re-description" exploit highlights the lack of justification.
      *   **Allais:** **RATIONAL.** The strong preference for certainty (avoiding regret anxiety) or aversion to the small chance of zero *is* a real psychological cost/benefit. Maximizing EU *including* these emotional/regret factors justifies the independence violation.
      *   **Bet Bundling:** **RATIONAL.** Evaluating each bet individually imposes high cognitive load (repeated risk assessment). Evaluating the bundle once is cognitively cheaper and allows better risk pooling. The violation reflects efficiency.
      *   **Pay-to-Not-Be-Offered:** **RATIONAL.** The key insight. Considering and potentially accepting even +EV bets consumes valuable attention and willpower ("decision fatigue"). Paying a small fee to avoid the *entire decision process* can be EU-maximizing *if the cognitive cost saved exceeds the fee and the expected value of the foregone bets*. It violates "more options can't hurt" precisely because the *process* of having more options *has a cost*.
      *   **Verdict:** Captures **all** your intuitions best: Dutch Books/Money Pumps/Framing irrational; Allais/Bet Bundling/Pay-to-Not-Be-Offered rational. It provides a *positive* rationale for the "irrational" choices you want to defend (Allais, Bundling, Pay-to-Avoid) by incorporating real-world cognitive constraints into the utility function.

  **The Winner & Your Pay-to-Not-Be-Offered Case:**

  *   **"Rationality Under Mental Transaction Costs"** is the strongest candidate. It coherently justifies *all* of your gut reactions:
      *   Condemns Dutch Books, Money Pumps, and Framing as genuine, unjustifiable errors/exploitations.
      *   Defends Allais and Bet Bundling as rational responses to psychological realities (certainty premium, regret aversion, cognitive load).
      *   **Crucially, it clearly defends your "Pay-to-Not-Be-Offered" intuition.**
  *   **Verdict on Pay-to-Not-Be-Offered:** **RATIONAL.** Under this principle, refusing to even hear an offer (or paying to avoid it) can be perfectly rational. The cognitive costs of evaluating the offer, the potential for decision fatigue, the opportunity cost of your attention, and the risk of making a choice you later regret *are real costs*. Expected Utility maximization, properly understood to *include* these decision-making costs, can justify paying a small fee to avoid them, especially when the expected monetary value of the bets is low relative to the cognitive burden. You are optimizing for your *overall* wellbeing, not just the narrow monetary outcome in a frictionless model. This violates the standard EU axiom ("more options can't hurt") precisely because that axiom **ignores the cost of having and processing options.**

  **Conclusion:**

  Your intuitions point towards a more realistic model of rationality that incorporates the **costs of being rational.** The "Mental Transaction Cost" framework provides a principled way to distinguish:
  *   **Exploitable Inconsistencies:** Truly irrational (Dutch Books, Money Pumps, Framing Exploits).
  *   **Context-Sensitive Preferences:** Rational adaptations to psychological reality (Allais, Bet Bundling).
  *   **Cognitive Cost Avoidance:** Rational resource conservation (Pay-to-Not-Be-Offered).

  The money pump theorem is powerful, but it assumes costless, context-independent decision-making. Your instincts correctly recognize that real decisions have friction. Your "pay-to-not-be-offered" case isn't a flaw; it's a sophisticated recognition of those frictions. Defending it requires expanding the notion of utility to include the costs of the decision process itself.
