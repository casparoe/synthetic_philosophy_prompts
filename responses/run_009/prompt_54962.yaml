answer: |-
  The Sunday light fell thin and dusty through the apartment windows, catching motes dancing over half-packed boxes. Anna sorted through a pile of sweaters, the scent of her mother’s lavender sachet clinging stubbornly to the wool. Outside, the Saturday yard sale leftovers – mismatched chairs, chipped crockery, a lonely floor lamp – waited for the charity truck. Ben wrestled a rolled-up rug towards the door, grunting with the effort. Clara sat cross-legged on the worn linoleum, surrounded by papers, her phone pressed to her ear.

  "…yes, Mr. Henderson," Clara said, her voice tight with forced patience. "End of the month, absolutely. We'll have everything cleared by then. The keys will be under the…" She paused, tapped her fingers rhythmically on her knee – *tap-tap-tap, pause, tap-tap*. "Yes. Under the mat. The *blue* one." She hung up, sighed, and rubbed her temples. "Landlord’s breathing down our necks."

  Ben dropped the rug with a thud. "What’d he want? Rent pro-rated?"

  "He just wanted reassurance we weren't leaving a mess." Clara stood, brushing dust from her jeans. "He’s… particular."

  "Like Mom dealing with the butcher," Anna murmured, folding a cable-knit cardigan with unnecessary precision. "Always insisting on the exact cut, the specific thickness." She didn’t notice the echo in her own fussiness.

  Ben wandered over to a box marked ‘DONATE.’ He pulled out a garish ceramic parrot, painted in lurid greens and oranges. "God, remember this monstrosity? I used to beg her to get rid of it." He held it up, its beady glass eye staring blankly. A strange defensiveness prickled in his chest. "But… it’s kind of cheerful, isn’t it? In its own awful way. She loved how ugly it was."

  Anna glanced up, surprised. "Since when did you appreciate kitsch?"

  Ben shrugged, placing the parrot gently back in the box, not quite meeting her eye. "Just saying. It had character."

  Outside, a rumble announced the charity truck’s arrival. Anna went out to supervise. The driver eyed a box of crystal wine glasses Anna had set aside earlier. "These included?" he asked, nodding towards them.

  Anna hesitated. They weren’t great crystal, but her mother had treasured them, bringing them out for birthdays. "Those are… separate," she heard herself say. The driver shrugged, reaching for them anyway. Anna stepped forward, a sudden, unfamiliar sharpness in her voice. "I said separate. But…" She eyed the chipped gravy boat in his hand. "Tell you what. You can take that gravy boat *and* that stack of old National Geographics if you leave the glasses. They’re Czechoslovakian, you know. Hard to find." The words tumbled out, smooth and practiced, carrying a faint lilt her mother used when bartering at flea markets. The driver blinked, then nodded, tossing the gravy boat and magazines into his truck. Anna felt a flush creep up her neck, confused by the unexpected performance.

  Back inside, Clara was re-reading a faded recipe card. "Listen to this," she chuckled. "Her instructions for chicken soup. 'Boil the chicken until it looks sad. Skim the weird stuff. Add carrots until it feels right.'"

  Ben grinned. "Yeah, 'feels right' was her measuring cup for everything." He picked up a small, tarnished silver bell from a side table – the kind she’d ring imperiously when she wanted attention during family dinners. Without thinking, he gave it a single, sharp *ting*. The sound hung in the air, sharp and familiar. Both sisters froze, looking at him. Ben coughed. "Just… seeing if it still worked."

  The silence that followed was thick. They drifted towards the last unopened box, sitting in the middle of the living room floor. It was labelled simply "Misc." Clara knelt and pulled back the flaps. Inside lay a jumble: a tarnished locket, a bundle of dried lavender tied with twine, a chipped snow globe of the Eiffel Tower, and a stack of old birthday cards held together with a rubber band.

  Ben reached in first, pulling out the snow globe. "Paris, 1983," he read the faded inscription on the base. "She always said it was tacky, but she kept it."

  "Sentimental," Anna said, reaching for the locket. It sprang open in her hand, revealing tiny, blurred photos of her and her siblings as children. "She never could throw anything away that had a memory attached."

  "Unlike *us*," Clara said, gesturing at the half-filled trash bags. "We’re ruthlessly efficient." But her fingers traced the edge of the lavender bundle, the scent instantly transporting her to her mother’s garden. "Though… maybe we shouldn’t just toss *everything*. Some things… matter."

  "They’re just *things*, Clara," Anna said, her voice taking on a familiar, pragmatic edge. "We can’t keep it all. The locket’s nice, but the snow globe? It’s broken. Look, the water’s cloudy."

  "It’s not about being *nice*!" Ben interjected, his voice rising slightly, a defensive warmth flooding his tone as he clutched the snow globe. "It’s about… what it meant to *her*. She kept it!"

  "And what did it mean?" Anna pressed, her hands finding her hips in a stance eerily reminiscent of their mother settling in for a debate. "It sat on a shelf gathering dust! Sentiment is fine, Ben, but practicality wins out eventually. We need to *decide*."

  "Decide?" Clara cut in, her voice suddenly sharper, layered with an exasperated patience that wasn’t entirely her own. "We’re not deciding the fate of nations, Anna. It’s a box of her life! Maybe… maybe we don’t need to rush to judgment on every single…" She trailed off, tapping her fingers on the cardboard flap again – *tap-tap-tap, pause, tap-tap*.

  They all stopped talking at once. The air hummed with the unsaid. Anna stood, arms crossed, radiating efficient finality. Ben hunched protectively over the snow globe, radiating wounded loyalty. Clara looked from one to the other, her expression caught between irritation and a dawning, unsettling recognition. The rhythms of their voices, the specific angles of posture, the sharpness and the defensiveness – they were fragments, disjointed but unmistakable. Pieces of a single, complex pattern, momentarily activated, overlapping in the dusty stillness of the emptying apartment. For a suspended moment, their mother wasn’t just remembered; she was distributed, replicated in micro-gestures and tonal shifts across the three of them, arguing over a box of broken treasures.

  Ben looked down at the cloudy Eiffel Tower trapped in its plastic dome. "It *is* ugly," he whispered, almost to himself. "But she loved it." He didn’t put it down.
