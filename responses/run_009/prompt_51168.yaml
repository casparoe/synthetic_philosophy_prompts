prompt: |-
  Hey, so I'm a science journalist and I'm working on a longread about Maxwell's demon — you know, the tiny hypothetical being that sits by a hole in a partition, watches molecules, and lets fast ones through one way and slow ones the other, sorting a gas into hot and cold without doing any work, thereby getting something for nothing out of the second law. The piece has mostly been fun historical material (Maxwell's letter to Tait, Szilard's one-molecule engine, the whole saga through Landauer and Bennett), but here's where I keep getting stuck: every few years someone publishes a "the demon is finally dead" paper, and the reasons given are wildly different — sometimes it's that measurement costs energy, sometimes that erasing the demon's memory does, sometimes that the whole thing was never a paradox in the first place, just a fluctuation. I was arguing about this with a physicist friend over beers and we realized neither of us could say what would even COUNT as killing the demon. Like, what's the actual bar here? What does an account have to deliver before I'm allowed to write "solved" in my draft instead of hand-waving?

  So here's the job. Take on the role of a philosopher of physics who has spent serious time on the foundations of thermodynamics, and before writing anything, do a quick visible brainstorm — throw out candidate requirements without caring yet whether they survive. Then write me the specification: the desiderata any adequate resolution of the demon problem has to meet, each with the concrete case or consideration behind it. The cases it has to get right, I'd think, include at least: the Szilard engine, where the demon genuinely extracts work (the famous kT ln 2) before any bill shows up, so the account can't just say "no free lunch is ever on the table"; Bennett-style reversible computing, where the demon's bookkeeping costs nothing in principle, which kills any story that leans on measurement or record-keeping being intrinsically expensive; and the difference between the demon failing outright versus succeeding and paying somewhere else — an account that can't state which of those it's claiming hasn't told me anything. Distinctions it can't collapse: the cost of measuring versus the cost of forgetting; the demon as a physical device versus as an abstraction. Constraints it can't violate: most importantly it cannot invoke the second law to save the second law — that circularity trap is exactly what a bunch of popular accounts fall into and I want it named explicitly as a requirement that rules things out — and it has to square with the underlying dynamics being time-reversible at the micro level. Also tell me which requirements are non-negotiable and which are just the prejudices of one camp (I have a suspicion the "measurement must cost energy" demand is in that second bucket, but you tell me). And flag any pair of requirements you think can't be jointly satisfied — my physicist friend claims the no-circularity requirement and the demand for a constructive mechanism are in tension, since once you refuse to lean on the second law it's not clear what you're allowed to build the mechanism out of. I want your honest take on that, its the part I care most about.

  Format it with these section headers in this order, roughly the lengths given: "Warm-up" (~80 words, messy is fine, this is the brainstorm); "The requirements" (the heart of it — numbered, each with the case behind it, take the space you need); "Non-negotiable vs. camp prejudice" (~150 words); "Tensions" (~120 words, the joint-satisfiability stuff goes here); "Quick scorecard" (brief — one or two sentences each on three contenders: measurement-cost stories in the Brillouin style, erasure stories in the Landauer/Bennett line, and the deflationary "it was only ever a statistical fluctuation, there was never a paradox" view — don't belabor it, the scorecard is the least interesting part, the requirements are where the thinking is). No need for a bibliography or citations, I have those; I want the conceptual spec. Thanks!!
