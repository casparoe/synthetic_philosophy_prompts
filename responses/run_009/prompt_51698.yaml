prompt: |-
  I keep flip-flopping on who should actually get to vote in municipal elections, and I want to know if there's a principle under my gut verdicts or whether I'm just making it up case by case. Sixteen-year-old with a job paying income tax: yes. Sixteen-year-old with no job: no. Tourist in town for two weeks: obviously no. Foreign grad student on a student visa, been here five years, plans to leave after graduating: I lean yes. Same person on a work visa who intends to stay permanently: yes, clearly. Someone who moved abroad three years ago but still owns a house here and pays property tax: I'm genuinely stuck. Permanent resident, 30 years in the country, never naturalized because the fees and paperwork were a pain: yes. Someone who never naturalized out of a kind of ideological refusal to swear the oath: also yes, but that one bugs me, because someone who could easily naturalize and just never bothered for 20 years: no. Incarcerated felons: yes. People with advanced dementia: I honestly don't know, and I can't tell if that uncertainty is telling me something. Is there one principle here — affected interests, being subjected to the laws, stake in the community's future, whatever — that captures most of this, and if so what does it say about the property-owner-abroad and the ideological refuser, the two I keep circling? If nothing captures all of it, tell me which of my verdicts has to go and why that one rather than the others.
reasoning: |-
  Okay, let me try to unpack the user's dilemma. They're struggling with who should vote in municipal elections, and their gut reactions vary case by case. I need to figure out if there's a consistent principle behind their judgments or if they're just arbitrary.

  First, looking at their examples: 16-year-olds with jobs can vote, but not without jobs. Tourists are a no, but foreign students who've been there five years get a yes. Work visa holders staying permanently are a clear yes. The property owner abroad is a tough one. Permanent residents who didn't naturalize due to fees or ideology get a yes, but laziness is a no. Felons and dementia patients are ambiguous.

  The user seems to value both stake in the community and being subject to the laws. For teens, employment and taxes matter. Long-term residents, even non-citizens, have a stake. But the property owner abroad pays taxes but doesn't live there. The ideological refuser has a stake but rejects citizenship. Dementia patients are affected but can't participate meaningfully. 

  The core tension might be between stake (taxes, ties) and subjection (living under laws). Most cases fit except the property owner and ideological refuser. Maybe the user needs to prioritize one principle. If stake is key, the property owner votes. If subjection, they don't. The ideological refuser is tricky—they have both but reject formal ties. The dementia case highlights that capacity matters too, which complicates things. 

  The user might need to accept that no single principle covers all, and adjust their stance on the property owner or refuser. Or introduce a duration-based rule for non-residents. Their uncertainty about dementia suggests capacity should be considered separately. They need to decide which principle is more important: stake or subjection, and then reconcile the outliers accordingly.
answer: |-
  Your gut verdicts reveal a surprisingly coherent core principle: **"Subject to the laws and invested in the long-term future of the community."** This principle combines two key elements:

  1.  **Being governed by the municipality's decisions** (subject to its laws, taxes, services).
  2.  **Having a tangible stake in the community's trajectory beyond the immediate term** (investment, roots, future plans).

  Let's test it against your cases:

  *   **16yo with job/pays income tax:** Yes. *Subject to laws (including tax law), invested via work/taxes, and likely planning a future here.*
  *   **16yo no job:** No. *Subject to laws, but lacks demonstrable investment/stake beyond residency (which is transient at 16).*
  *   **Tourist (2 weeks):** No. *Not meaningfully subject to long-term laws, no stake in future.*
  *   **Foreign grad student (5 years, plans to leave):** Lean Yes. *Deeply subject to laws/services for 5+ years, invested time/effort, impacts community now. Future departure weakens but doesn't negate current stake.*
  *   **Work visa (intends to stay):** Yes. *Clearly subject to laws, clear stake in future.*
  *   **Permanent Resident (30 years):** Yes. *Deeply subject to laws, deeply invested in community long-term, regardless of paperwork.*
  *   **Ideological Refuser (could naturalize):** Yes (bugs you). *Still deeply subject to laws, deeply invested long-term. The refusal is symbolic; their real-life stake is identical to the PR above.*
  *   **"Lazy" Non-Naturalizer (20 years):** Your "No" is the **outlier**. *If they've lived/worked/paid taxes/used services for 20 years, they are profoundly subject to the laws and have an enormous stake in the community's future. The lack of paperwork doesn't erase their lived reality.* **This verdict conflicts with your core principle.**
  *   **Incarcerated Felons:** Yes. *Still subject to municipal laws/services (e.g., fire codes, water in prison), deeply affected by local policies (re-entry programs, policing), and often return to the community. Their stake remains.*
  *   **Advanced Dementia:** Genuine Uncertainty (and it *is* telling). *Subject to laws? Yes. Historically invested? Likely. But capacity to understand choices/represent their stake in the *future* is severely impaired. This exposes the **limitation** of the "stake" principle without considering **voting competence**. Your uncertainty suggests this requires a separate, pragmatic consideration of capacity.*
  *   **Property Owner Abroad (3 years):** Stuck (Understandably). *Has a financial stake (property tax) and is subject to *some* laws (property codes, tax laws). But not subject to *most* laws (traffic, local ordinances, services), doesn't experience daily life, and lacks a personal stake in the community's *social* future. **The principle is split: Strong "stake" element, weak "subject to laws" element.***

  **Reconciling the Sticking Points:**

  1.  **The "Lazy" Non-Naturalizer (20 years):** Your "No" **must go**. It violates the core principle evident in your other judgments. A person deeply embedded in the community for decades, subject to its laws and invested in its future, has earned the franchise through participation, regardless of citizenship paperwork. Their stake is identical to the ideological refuser and the long-term PR.

  2.  **The Ideological Refuser:** Your "Yes" is correct under the principle. The bug is likely because you intuitively link voting to formal citizenship *allegiance*. But your own judgments prioritize concrete *participation* and *stake* over formal status. The refusal is an abstract political statement; their daily life demonstrates profound stake and subjection. **Accept that your core principle values lived reality over symbolic acts.**

  3.  **Property Owner Abroad:**
      *   **Under the Principle:** It's a close call. The financial stake is real, but the lack of subjection to most laws and absence from the community's daily life/social fabric tilt towards **No**. They are more akin to an absentee landlord with a financial interest than a community member. Policies affecting schools, parks, transit, safety, or local culture don't impact them directly.
      *   **Refinement:** To resolve this, strengthen the "subject to laws" element to mean **"primarily resident and experiencing the daily impact of municipal governance."** This excludes the absentee owner but includes long-term non-citizen residents. Alternatively, a minimum residency period (e.g., 6 months/year) could be a practical proxy.

  4.  **Advanced Dementia:** Your uncertainty reveals the principle needs a **supplement**: **Voting Competence.** While the stake remains, the ability to exercise the franchise meaningfully (understanding choices, representing one's interests) is fundamentally impaired. Most jurisdictions have practical mechanisms (often based on legal competence determinations) to address this, acknowledging the principle has limits. Your gut is wrestling with the conflict between stake and capacity.

  **Conclusion:**

  *   **Core Principle:** Subject to the municipality's laws and invested in its long-term future (demonstrated by residency, work, taxes, life participation).
  *   **Most Consistent Verdicts:** Your instincts align remarkably well with this, *except* for the "Lazy" Non-Naturalizer. That should be a **Yes**.
  *   **Sticking Points:**
      *   **Property Owner Abroad:** Leans **No** under the principle, as the "subject to laws" element is weak. Refine the principle to emphasize primary residency/daily experience.
      *   **Ideological Refuser:** **Yes** is correct. The "bug" stems from conflating franchise with formal allegiance; your core principle is about concrete stake and subjection.
      *   **Advanced Dementia:** Requires acknowledging a separate (though fraught) **capacity requirement**.

  Your gut is primarily guided by **stake through participation and subjection**, not just citizenship or mere presence. It values the tangible connection to the community's daily life and future over formalities. The main adjustment is recognizing that decades of life in a community *is* the ultimate demonstration of stake, regardless of naturalization paperwork.
