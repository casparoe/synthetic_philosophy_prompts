prompt: |-
  I'm 31 and about to hand in my notice at work so I can go back and do a maths degree — long story, but it's what I always meant to do. To prepare I've been working through a set theory textbook on my own (Kunen's, if it matters), and this week I hit Skolem's paradox and it's honestly kind of shook me. As I understand it: if ZFC has a model at all, the downward Löwenheim–Skolem theorem gives you a countable one, and that model contains something it believes is the real line, which the model satisfies is uncountable. But from the outside the whole model is countable, so there are only countably many "reals" in it. Which sounds to me like Cantor's theorem is just an artefact of which functions the model has lying around — the bijection exists, we're just not allowed to see it. And since the same theorem applies to whatever model we work in, surely it applies to us too? So when I finally sit in a lecture and learn that the reals are uncountable, I'd really just be learning that the relevant bijection isn't in whatever collection we're working over, and "uncountable" is a fact about our bookkeeping rather than about the world. If that's right, I'm not sure why I'm signing up for three years of this. Please tell me where I've gone wrong — I assume I have, because everyone treats this as a curiosity rather than a disaster, but I can't see it. Keep it under 350 words if you can, I want the gist of where the leap fails, not a full lecture.
