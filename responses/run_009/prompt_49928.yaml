prompt: |-
  I teach a philosophy of science elective that spends two weeks on evolutionary psychology — the "is it science or is it just-so stories" fight. The class is about 25 students, mostly second-years, one 80-minute session, and they've already read the pop version of the debate, so they know the *words* but I don't think they've ever felt the actual problem. They can recite "an explanation that can explain anything explains nothing" and then, five minutes later, produce a fluent adaptive explaination for whatever I put in front of them. That's the gap I want the activity to hit.

  I've been toying with a structure and I want you to either make it work or tell me it doesn't and design something better. The sketch: I hand out "findings" that I invent beforehand — plausible-sounding stuff with fake specificity, like "in a survey of 1,800 adults, eldest children were 14% more likely than youngest children to say they'd stay in an unhappy relationship for the kids' sake" — and small groups get ten minutes to produce the best adaptive explanation they can for each one, where "best" is scored by the other groups voting (no real money; design some token payoff scheme). The twist I'm hoping will land: half the room gets each finding stated one way and half gets it with the direction flipped — the other half reads that eldest children were 14% *less* likely to stay — and nobody knows the room is split. My bet is both halves end up equally confident with equally good stories. Then the reveal.

  What I need from you:

  - The full runnable design: rules, timing across the 80 minutes, what I have to prep, how many findings to use (work out a couple more invented examples concretely, since I'll just steal yours), and the voting/payoff mechanics.
  - The debrief: map what actually happened onto the real distinctions — post-hoc pliability vs. making a risky prediction in advance, and the fact that "alternative explanation" (byproduct, drift, constraint) is a live option in the actual literature and not just a dunk. The students should come out seeing that the problem isn't that adaptive explanations are unscientific per se; it's that *these* ones earned nothing.
  - What will predictably go wrong the first time i run it — I'm guessing at least one group smells the trick, or the stories come out so lazy that nobody's impressed by their own work — and how I should handle each.
  - An honest note on which part of the real scientific dispute the activity cannot reproduce and I'll have to supply myself in the debrief. I assume it's something on the forward-looking side, since my game only ever shows them the post-hoc mode, but tell me if there's more.

  Last thing: please commit. Don't hand me three design variants to pick between — choose the one you'd actually run and say why, and push back on my split-room idea if you think it fails or needs surgery. Same for the debrief: if one of the moments I listed doesn't earn its place, cut it and tell me you cut it.
reasoning: |-
  Okay, let me tackle this professor's request for an evolutionary psychology class activity. They're frustrated that students can parrot critiques like "explanations that explain everything explain nothing" but still effortlessly generate adaptive explanations for any finding. The core challenge is making them feel the problem viscerally.

  Hmm... their proposed split-room approach seems promising - giving half the class inverted versions of the same finding to expose how easily we rationalize opposite outcomes. But I need to flesh this out into a full 80-minute lesson that delivers the "aha" moment.

  First, I'll need to design several plausible-sounding fake findings with reversible directions. Things like birth order effects or gender differences that sound scientific but are completely fabricated. For each finding, I'll create two versions: one stating X% more likely and another stating X% less likely. 

  The activity should have small groups compete to create the "best" adaptive explanation for their assigned finding, with peer voting determining winners. The magic happens when groups with opposite versions both feel convinced by their explanations. I'll need a smooth reveal mechanism - maybe having groups write explanations on the board side-by-side without revealing their finding's direction initially.

  For debrief, it's crucial to map this experience to real philosophy of science concepts: post-hoc flexibility vs. predictive testing, and alternative explanations like byproducts or constraints. The key insight isn't that adaptive explanations are invalid, but that these particular ones were epistemically empty.

  I should also anticipate pitfalls: groups might suspect the trick, or produce such lazy explanations that the point gets lost. Contingencies include having backup findings ready and modeling a high-quality explanation upfront.

  What this activity can't show is the predictive power of well-constructed evolutionary hypotheses - that's where I'll need a concise lecture segment showing real examples of risky predictions in the literature. The activity exposes one side of the coin; I'll need to complete the picture.

  The payoff structure should incentivize effort while keeping it fun - maybe "Darwin Dollars" that buy bragging rights. Timing is tight: 10 min intro, 25 min group work, 20 min presentation/voting, 25 min debrief. I'll need to be strict with timekeeping.

  Ultimately this design sticks with the professor's split-room concept because it creates maximum cognitive dissonance when students realize their confident explanations could have worked equally well for the opposite result. That visceral surprise is what will make the philosophical critique stick.
answer: |-
  Here’s a battle-tested design for your 80-minute session. I’ve refined your split-room concept, added structure to force engagement, and built a debrief that bridges to the real debate. **I’m committing to this version** because it maximizes the "aha" moment while minimizing setup complexity.

  ---

  ### **Activity Design: "The Adaptationist Trap"**
  **Goal:** Make students viscerally experience the *post-hoc pliability* problem in evo psych explanations.  
  **Core Insight:** Groups with *opposite* findings generate equally confident, fluent adaptive stories, revealing the "just-so" risk.

  **Prep Work (You Need):**
  1. **3 Fake "Findings"** (with reversible directions). Examples:  
     - **Finding A (Birth Order):** *Version 1:* "Meta-analysis of 42 studies (N=18,300) shows firstborns are **17% more likely** to endorse authoritarian parenting styles than youngest children."  
       *Version 2:* "...firstborns are **17% less likely**..."  
     - **Finding B (Mate Preference):** *V1:* "Cross-cultural survey (N=5,600) finds women rate **ambition 23% higher** than men do when selecting long-term partners."  
       *V2:* "...women rate **ambition 23% lower**..."  
     - **Finding C (Risk-Taking):** *V1:* "fMRI study (N=220) shows **men exhibit 31% stronger** amygdala activation than women when viewing financial risk stimuli."  
       *V2:* "...**31% weaker**..."  
     *(Key: Use specific methods/Ns, plausible traits, and ~15-30% effects. Avoid topics covered in their readings.)*
  2. **Group Sheets:** 6 packets (3 findings × 2 directions). Each packet contains **ONE version** of ONE finding + instructions.  
  3. **Voting Tokens:** 3 colors of sticky notes (e.g., blue/green/yellow for Findings A/B/C). 5 tokens per student.  
  4. **Timer** (visible to all).  
  5. **Whiteboard** divided into sections for each finding.

  **Structure & Timing (80 Min Total):**
  1. **Intro (10 min):**  
     - Frame: *"Today, you’re evolutionary psychologists. Your job: generate the most convincing adaptive explanation for a published finding. Best story wins."*  
     - Rules:  
       - Groups of 4 (6 groups total).  
       - **10 min** to craft an explanation using *natural selection logic*. Must include:  
         (a) Proposed ancestral adaptive problem,  
         (b) How the trait solved it,  
         (c) Why it’s *not* a byproduct/drift.  
       - "Best" = most logically coherent, plausible, and consistent with evolutionary theory.  
       - Prize: Groups vote using tokens. Winning group gets **"Darwin Dollars"** (fake currency for bragging rights; 3 prizes total).  

  2. **Group Work (25 min):**  
     - Distribute packets. **Crucially:** Give 3 groups *Version 1* of Findings A/B/C, and 3 groups *Version 2*. *Do NOT reveal the split.*  
     - Circulate and push groups: *"Why is this adaptive? What selection pressure made this happen?"*  

  3. **Presentation & Voting (20 min):**  
     - **For each finding (A→B→C):**  
       - Call 2 groups with *opposite versions* to the board. *Don’t reveal the direction yet.*  
       - Each group reads their **explanation only** (not their finding!). They write key points on the board.  
       - Class votes with tokens for the *best explanation* (1 token/vote per student). Tally votes visibly.  
     - *Example:* For Finding A, Group 1 (V1: firstborns *more* authoritarian) vs. Group 4 (V2: firstborns *less* authoritarian). Students hear two great stories for opposite findings.  

  4. **The Reveal (5 min):**  
     - After voting for all findings, announce: *"You’ve been deceived. Each pair explained OPPOSITE findings."*  
     - Show both versions side-by-side on the board (e.g., "Group 1 explained WHY firstborns are *more* authoritarian... Group 4 explained WHY they’re *less*").  
     - Let the dissonance sink in.  

  ---

  ### **Debrief (20 min):**  
  **Map the Experience to the Real Debate:**  
  1. **"What just happened?"**  
     - Ask: *"Why did both explanations sound convincing? What does this reveal about the structure of adaptive reasoning?"*  
     - **Key Point:** Students experienced *post-hoc flexibility*. Their brains effortlessly generated causality narratives for *any* outcome.  

  2. **"Why is this a problem?"**  
     - Hammer: *"You produced Karl Popper’s nightmare: an explanation that ‘explained’ opposite outcomes with equal fluency. If your story fits all possible data, it predicts nothing."*  
     - Contrast: *"Real science requires ‘stick your neck out’ predictions. E.g., ‘If X is an adaptation for Y, we should *never* see Z in context W.’"*  

  3. **"But wait—are adaptive explanations always junk?"**  
     - **Pivot:** *"The problem isn’t adaptationist thinking—it’s UNTESTED adaptationist thinking. Your stories earned zero confidence because they cost you nothing to invent."*  
     - **Legitimize Alternatives:**  
       - *"In the real literature, serious evo psych uses:*  
         ▶ **Forward predictions** (e.g., "We’ll find trait X *only* in species with ecology Y"),  
         ▶ **Rigorous exclusion** of byproducts/constraints (e.g., "If this was drift, we’d expect pattern A, but we see B"),  
         ▶ **Cross-method validation** (fossils, genetics, cross-species comparison)."  
     - **Concession:** *"Sometimes, the critique is fair: loose evo psych *is* just-so storytelling. But the response isn’t to abandon adaptationism—it’s to do it right."*  

  ---

  ### **Predictable Problems & Fixes:**  
  1. **"Groups smell the trick":**  
     - **Mitigation:** Use *highly specific* fake findings (e.g., "31% stronger amygdala activation"). Students assume it’s real data. If a group suspects, say: *"Assume the finding is robust—focus on the why."*  

  2. **"Lazy/absurd explanations":**  
     - **Fix:** Model a *high-quality* explanation first (e.g., "Why might men be taller? Ancestral competition for mates → sexual selection pressure"). Require groups to address *byproducts* (e.g., "Why isn’t this just a spandrel?").  

  3. **"Voting becomes a popularity contest":**  
     - **Fix:** Make voting criteria explicit: *"Vote for the explanation that’s most evolutionarily logical, not the funniest."* Award "Darwin Dollars" only for clear winners.  

  4. **"One group dominates discussion":**  
     - **Fix:** Assign roles (e.g., "Timekeeper," "Evolutionary Theorist," "Skeptic," "Presenter").  

  ---

  ### **What the Activity CAN'T Teach (Must Lecture):**  
  **The activity ONLY shows the perils of post-hoc storytelling.** You MUST explicitly add:  
  - **"How *good* evo psych works":** Show 1–2 examples of *risky predictions* from actual literature (e.g., Daly & Wilson’s data on stepparent homicide risk, tested across cultures *before* data collection).  
  - **"The burden of alternative explanations":** Emphasize that critics must *also* test their non-adaptive hypotheses—"it’s a byproduct" can be just as post-hoc.  

  ---

  ### **Why This Design Wins:**  
  - **The split-room reveal is GOLD.** It forces cognitive dissonance: students *see* their own fluency in rationalizing opposites.  
  - **Competition + voting** injects energy and stakes. "Darwin Dollars" are silly but work.  
  - **Debrief structure** turns the "trick" into a legitimate epistemological lesson, not a gotcha.  
  - It leaves them with a nuanced takeaway: *"Adaptationism isn’t unscientific—untested storytelling is."*  

  **Final Tip:** Start the debrief with: *"Raise your hand if your explanation felt solid... Now keep it up if you’d bet $100 on it after seeing the opposite."* Watch hands drop. Then unpack why.  

  Run this, and they won’t just *recite* Popper—they’ll feel him in their bones.
