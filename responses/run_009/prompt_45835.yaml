  ## Joint Statement on the Hart-Fuller Debate: Points of Convergence, Divergence, and Cruxes

  **Preamble:** We, a legal positivist and a natural law theorist, have engaged in extensive discussion regarding the Hart-Fuller debate. While core disagreements remain, we seek to clarify the precise nature of our agreement and disagreement, moving beyond talking past each other. This statement reflects common ground, delineates differences fairly, identifies key cruxes, and acknowledges areas of potential verbal dispute.

  **Section 1: Points of Agreement**

  We jointly affirm the following:

  1.  **The Core Positivist Thesis (Clarified):** Legal positivism, at its heart, asserts the *conceptual separability* of law and morality. This means it is logically possible for a legal system, identified according to its own social sources and criteria of validity (e.g., enactment by a sovereign, adherence to a rule of recognition), to be morally repugnant. This thesis is primarily *descriptive* and *analytical*, concerning how we identify what the law *is*, not a claim that such separation is desirable or that law *should* be devoid of moral content.
  2.  **The Grudge-Informer Dilemma:** The post-WWII German "grudge-informer" cases present a profound moral and legal difficulty. Both sides recognize the tension between applying the positive law as it stood under the Nazi regime (potentially validating the informer's act) and the moral intuition that such application constitutes a grave injustice. This case starkly illustrates the practical consequences of the theoretical debate.
  3.  **Distinguishing Validity and Moral Worth:** We agree on the logical distinction between the statements: "This statute is valid law but morally wicked" and "This statute is so morally wicked it cannot be considered valid law at all." The first is a claim positivism can make; the second is a claim characteristic of strong natural law positions. We agree that understanding *why* someone makes one claim or the other is central to the debate.
  4.  **Historical Context:** The Hart-Fuller exchange was a pivotal moment in 20th-century legal philosophy, occurring primarily in the Harvard Law Review in the late 1950s. The debate was significantly shaped by reflections on the Nazi legal system and the subsequent legal dilemmas faced by German courts, including those involving grudge-informers prosecuted after the war.
  5.  **Law's Complexity:** Law is a complex social phenomenon involving rules, institutions, practices, and claims to authority. Any adequate theory must grapple with this complexity.

  **Section 2: Precise Disagreements**

  The following table outlines our core disagreements, with each description acceptable to the respective side:

  | Aspect of Disagreement        | Legal Positivist Position (Agreeable to Positivist)                                                                 | Natural Law Position (Agreeable to Natural Law Theorist)                                                                 |
  | :---------------------------- | :------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------------- |
  | **1. Validity of Nazi Statutes:** | Nazi-era statutes, enacted according to the regime's own established procedures and recognized as binding by its officials and courts at the time, **were valid positive law** *within that system*. Their moral repugnance does not negate their legal validity based on social sources. | Enactments like Nazi statutes, which systematically violate fundamental principles of justice (e.g., equality, dignity) to such an extreme degree, **cannot be considered valid law** at all. Their gross injustice negates their legal character. |
  | **2. Fuller's Internal Morality:** | Fuller's eight principles (e.g., generality, promulgation, non-retroactivity, clarity, consistency, feasibility, constancy, congruence) describe **principles of efficacy for any legal system aiming to guide conduct through rules**. They are primarily about "craftsmanship" – what makes a system *functional* as law – not necessarily about substantive moral goodness. A system can adhere to these principles while pursuing evil ends. | Fuller's eight principles constitute a genuine **"morality of aspiration" inherent to the enterprise of law itself**. Adherence to these principles fosters reciprocity, respect for agency, and human dignity, constituting a *procedural morality* essential for a system to truly be called "law" and distinct from mere command or terror. Effectiveness and morality here are intertwined. |
  | **3. Normative Force of "Law":** | Identifying a rule as "valid law" based on social sources **does not, in itself, create a moral obligation to obey it**. The question of obedience is a separate moral question. Calling something "law" describes its status within a system, not automatically its moral weight for the citizen. | The label "law," when applied to a system meeting certain minimum conditions of order and procedural decency (potentially including Fuller's principles), **carries inherent normative weight**, creating a prima facie (though defeasible) moral obligation for citizens to obey. Calling something "law" implies a claim to legitimacy beyond mere force. |

  **Section 3: Crucial Points of Disagreement (Cruxes)**

  The following unresolved questions are critical to our differing positions, where resolution *could* shift one or both of our views:

  1.  **Can the Rule of Law Virtues be Purely Formal/Instrumental?**  
      *   **Crux:** Is adherence to principles like clarity, prospectivity, consistency, etc., *solely* a matter of effective governance and predictability (instrumental value), or does such adherence *necessarily* embody or foster distinct moral values (like respect for human agency and dignity), even if the substantive aims pursued through the law are evil?
      *   **Concrete Case:** Consider the hypothetical "Scrupulously Evil Regime": A totalitarian state pursues horrific, unjust goals (e.g., systematic discrimination, oppression) but meticulously adheres to all eight of Fuller's principles. Laws are clear, public, prospective, consistently applied by honest courts according to their terms, stable, feasible, and officials act in congruence with them. Apologists claim "at least you know where you stand and what the rules are."
      *   **Positivist Prediction:** This case demonstrates that Fuller's principles *are* purely formal/instrumental. The regime exhibits a high degree of "internal morality" as craftsmanship, proving its separability from substantive justice. The predictability is real, but it serves evil ends, showing law's efficacy is distinct from its moral quality.
      *   **Natural Law Prediction:** This case is deeply problematic. While superficially meeting formal criteria, a system dedicated to fundamental injustice *cannot* truly fulfill Fuller's principles (e.g., "congruence" breaks down when officials secretly ignore rules to further oppression; rules targeting groups inherently lack "generality"; such rules violate "feasibility" by demanding the impossible, like changing identity). Even if technically met, these principles applied to evil ends pervert their moral purpose and fail to create a *genuine* legal order worthy of the name or normative respect.

  2.  **Does "Legal Validity" Imply Prima Facie Moral Obligation?**  
      *   **Crux:** When a citizen recognizes a rule as valid law according to the system's criteria, does this recognition *itself* create any moral reason for obedience, distinct from the rule's specific content or the consequences of disobedience?
      *   **Concrete Case:** Consider a citizen in a generally just society faced with a specific, validly enacted law they believe to be mildly unjust (but not grossly so). They can disobey without significant risk of detection or harm to others.
      *   **Positivist Prediction:** The mere fact that it is "law" adds no *independent* moral weight. The obligation (if any) stems from broader considerations like fair play, supporting generally just institutions, or the consequences of widespread disobedience – not the label "law" itself.
      *   **Natural Law Prediction:** The fact that the rule is valid law within a generally just system *does* create a prima facie moral obligation to obey. This obligation arises from the reciprocity inherent in a legal order that generally respects agency and provides benefits of order and predictability. The label "law" signifies participation in this morally significant enterprise, generating a defeasible duty.

  **Section 4: Potential Verbal Disagreement**

  We acknowledge that part of our dispute *might* be partly verbal, concerning the core function of the concept "law":

  *   **Positivist Perspective:** The primary function of the concept "law" is to **identify a distinct type of social fact** – rules and institutions identifiable by their social sources (pedigree) that claim supreme authority within a society. This is a descriptive, analytical project. Insisting on a necessary moral condition risks conflating what law *is* with what it *ought to be*, hindering clear analysis of existing systems, including wicked ones.
  *   **Natural Law Perspective:** The primary function of the concept "law" is to **denote a specific kind of morally legitimate order** for governing human conduct through rules. A system devoid of minimal justice fails to meet the aspirational ideal inherent in the concept itself. Calling Nazi statutes "law" risks granting them a legitimacy they do not deserve and obscures the moral bankruptcy of the system.

  **Closing:** This statement reflects our sincere effort to map the terrain of the Hart-Fuller debate as we understand it. While fundamental disagreements persist (particularly concerning the nature of Fuller's principles, the implications of the Scrupulously Evil Regime, and the normative force of legal validity), we agree on the core positivist thesis as conceptual separability and the genuine difficulty posed by cases like the grudge-informers. We recognize that some disagreement may stem from differing emphases on the descriptive vs. aspirational functions of the concept "law." Our hope is that identifying these points of agreement, precise disagreements, and crucial cruxes provides a clearer framework for future discussion. This collaboration demonstrates that progress lies not in declaring victory, but in achieving a more nuanced understanding of each other's positions and the deep questions at stake.

