answer: |-
  The three-part structure of workplace and social media speech codes reveals an implicit **hybrid theory of slurs** that prioritizes **harm potential and social permission** over pure semantic content, while still relying on word-form as a proxy. Here's the reconstruction:

  1.  **Core Presupposition: Harm Potential + Social Licensing:** The codes presuppose that designated words possess **inherent, high-potential for causing harm or signaling group-based contempt**, rooted in their historical and social usage. However, this harm *actualizes* only under specific conditions determined by:
      *   **Speaker Identity & Group Membership:** Does the speaker belong to the group historically targeted by the slur? If yes, the harm potential is often (not always) neutralized or transmuted.
      *   **Context & Intent:** Is the word being used *as a slur* with derogatory intent in an ordinary communicative context, or is it being mentioned (quoted, reported on, analyzed) in a context that explicitly disavows endorsement and serves a recognized legitimate purpose (e.g., testimony, education, journalism)?

  2.  **Reconciling the Three Clauses:**
      *   **Clause 1 (Prohibition):** Recognizes the word's inherent, high-stakes harm potential. Outlawing the word *form* outright, regardless of intent by non-members, is a pragmatic rule designed to prevent harm and signal institutional values. It prioritizes safety and clarity over nuanced semantic parsing in everyday interactions. This clause treats the word-form itself as carrying a dangerous *charge*.
      *   **Clause 2 (Quotation/Testimony Exemption):** Acknowledges that the harm potential is *contextually defeasible*. When the word is clearly framed as *mentioned* (not *used* in an ordinary communicative act), and the context signals disavowal and legitimate purpose, the immediate harm is mitigated. The exemption relies on contextual markers (inverted commas, reporting frame, academic setting) acting as "safeguards" or "disclaimers." This clause implicitly rejects a purely indexical/perspectival semantics where *only* the original speaker's identity matters, because the *current* speaker's framing and context are deemed crucial for harm mitigation.
      *   **Clause 3 (In-group Use Mitigation/Permission):** Recognizes that group membership fundamentally alters the social meaning and harm potential of the utterance. When a member of the targeted group uses the term, it can serve functions like reclamation, in-group solidarity, or critique that are unavailable to out-group members. The harm potential directed *at* the group by an out-group speaker is replaced by potential intra-group dynamics or reclamatory intent when spoken *by* a member. This clause strongly suggests that speaker identity is a key determinant of whether the utterance *counts* as a harmful slur or something else.

  3.  **Distinguishing Strict Requirements vs. Tolerance:**
      *   **Strictly Required:** Prohibition of out-group use in *ordinary communicative contexts* (i.e., using the word as a term of reference/abuse without disclaimers). This is the core enforceable rule.
      *   **Tolerated (with caveats):**
          *   **In-group use:** Often permitted outright or placed in a "proceed with caution/mitigated violation" category. The code *tolerates* this usage, recognizing its different social meaning, but may still regulate it (e.g., prohibiting its use *against* other in-group members in a harassing way).
          *   **Quotation/Testimony in Legitimate Contexts:** Tolerated *only* when clear contextual safeguards are present (e.g., explicit framing in education, journalistic norms, quotation marks). The tolerance is contingent on the context successfully mitigating the perceived harm. Misuse (e.g., "just quoting" to harass) is still prohibited.

  4.  **Addressing the Semantic Puzzle & Non-Semantic Justification:**
      The structure *cannot* be fully explained by traditional semantic theories alone:
      *   It rejects **Invariantism** (Clause 3 directly contradicts prohibition if meaning is fixed).
      *   It complicates **Pure Indexical/Perspectivalism** (Clause 2 shows the *current* speaker's context/framing matters for harm, not just the original speaker's identity in a quote).
      The practice primarily tracks **expected harm and social standing/permission**:
      *   **Harm Potential:** The word-list identifies terms with a high base probability of causing severe offense, intimidation, or contributing to a hostile environment based on historical and social patterns.
      *   **Standing to Derogate/Reclaim:** Out-group members lack the social permission or standing to use terms with such a harmful history without causing offense or reinforcing power imbalances. In-group members possess a different standing regarding the term's use.
      **Why word-lists?** A non-semantic theory justifies the word-list pragmatically:
      *   **Efficiency & Clarity:** Providing a list offers clear, easily enforceable guidelines, avoiding constant debates about intent or context in every instance.
      *   **Symbolic Value:** Banning the word-form itself sends a strong symbolic message about institutional values and zero tolerance for certain types of harm.
      *   **Harm Proxy:** The word-form acts as a reliable, empirically observable proxy for utterances with a very high likelihood of causing severe harm in typical out-group usage, even if the harm isn't *strictly* semantic.

  5.  **Which Clause Should Give Way?**
      If the presupposition of inherent harm potential tied to word-form *despite* context and speaker identity proves untenable (e.g., conclusive evidence that certain slurs cause no harm when quoted carefully, or that out-group use with genuine non-derogatory intent in specific contexts is harmless), **Clause 2 (Quotation Exemption)** is the most likely candidate to give way first.
      *   **Why Clause 2?** It's already the most context-dependent and relies on fragile safeguards that can be abused or misread. If the fundamental harm potential premise weakens, the justification for *any* prohibition in clearly disclaimed contexts diminishes. The core prohibition (Clause 1) and in-group allowance (Clause 3) are more deeply tied to power dynamics, historical oppression, and group identity, which are harder to disentangle from the terms. Relaxing Clause 1 would undermine the core protective function, and eliminating Clause 3 would ignore crucial social realities of reclamation and in-group dynamics. Modifying Clause 2 (e.g., stricter framing requirements, case-by-case review) poses less risk to the core aims.

  **In essence, the codes presuppose a pragmatic theory where certain word-forms are designated as carrying high *harm potential*. The actual prohibition hinges on the *speaker's identity* (out-group vs. in-group) and the *context of use* (ordinary communication vs. safeguarded mention). This hybrid approach prioritizes preventing harm and regulating social permission over adhering strictly to any single semantic theory.** The word-list serves as a practical and symbolic tool within this harm-prevention framework.
