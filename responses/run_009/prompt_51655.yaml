prompt: |-
  I'm a software engineer, no philosophy training, but I listen to philosophy podcasts on my commute and one of them talked about something called the pessimistic meta-induction: that because pretty much every past scientific theory eventually got replaced, we should expect our current ones to be replaced too, and so shouldn't believe them true. The standard realist comeback, as I understand it, is that some theories were "approximately right" or "got the structure right" even though the entities or mechanisms got tossed. The problem is that when I try to sort particular historical theories into "on to something" versus "merely predicting well," my own verdicts don't look like they come from one rule, and I'd like someone to tell me whether they do.

  Here are my verdicts, from thinking about this the way I think about judging whether a deprecated system's design is worth salvaging before a rewrite:

  1. Fresnel's wave theory of light: the luminiferous ether it presupposed turned out not to exist, yet Fresnel's equations for diffraction basically survived into modern optics. Verdict: on to something important.

  2. Caloric theory: there is no fluid of heat, but Fourier derived his heat equation while working within caloric theory, and we still use that equation daily. Verdict: on to something, and it feels like the same "something" as in case 1 — the math survived even though the ontology died.

  3. Ptolemaic astronomy: the epicycle machinery predicted planetary positions well for centuries, and Copernicus himself kept small epicycles. Verdict: NOT on to something — it was sophisticated curve-fitting, and the fact that its predictions were good for its day doesn't make it even approximately true.

  4. Phlogiston theory: I'm honestly sympathetic to it in a way I'm not to Ptolemy — phlogiston was a real attempt at a conservation-style story about combustion, and something in that neighborhood survived. Verdict: on to something, at least a little, even though essentially no equation or quantitative structure survived from it.

  5. The Bohr atom: there are no electrons hopping between fixed circular orbits, and the picture is strictly false. Verdict: not on to something in the truth sense, but a genuinely useful ladder — worth teaching, not worth believing.

  6. Mendel's theory of the gene: the particulate inheritance story was basically right, and the gene turned out to be a real thing, even though Mendel himself had the wrong picture of what genes were physically made of and where they lived. Verdict: on to something in a stronger way than any case above.

  7. Darwin's original theory: blending inheritance had to be thrown out, the picture of heredity was wrong, and the modern synthesis changed a lot — yet I can't make myself say natural selection was "approximately true" the way the ether equations were "approximately right"; it feels true, full stop, from the beginning. Verdict: on to something in a way that doesn't fit neatly with cases 1 and 2 at all.

  So here is what I want. First, tell me whether there is a single principle about what a theory "gets right" that delivers all seven verdicts — I have in mind candidates like "retention of mathematical structure," "retention of the central entity or mechanism," "novel predictive success," or some combination — and be concrete about which clause handles which case. My suspicion is that no clean principle works, and I can already see the trouble: cases 1–2 suggest the rule is "the equations survived," but that rule condemns phlogiston (case 4), which I want to save, and it would seem to elevate Ptolemy's predictive machinery too, since some of the computational apparatus carried over to Copernicus — which I absolutely refuse to accept. Second, tell me exactly which of my verdicts has to go if we insist on a simple principle, and which principle that would be. Third, apply whatever principle you settle on to two cases I haven't listed: the current standard model of particle physics (suppose it gets superseded the way everyone expects — was it on to something?), and, harder, dark matter — where we have eighty-odd years of gravitational anomaly-fitting with the entity still unidentified, which looks uncomfortably like either phlogiston or Ptolemy depending on how the story ends. And if your principle gives different verdicts on dark matter depending on whether the entity is eventually found versus the theory being rewritten without it, say so, because that bears on whether the principle is about our current theories or only about how history will have gone.

  One constraint on framing: I don't want the answer to be "verdict 3 is just prejudice against geocentrism." Maybe it is, but if so, show me what principled distinction between prediction-machine theories and structure-getting theories my Ptolemy verdict could be recovering, and whether the phlogiston verdict can be saved by the same move. I'd rather repair the verdicts into a consistent set than be told they're arbitrary — but tell me honestly if some of them are.
reasoning: |-
  Okay, let me try to work through this user's problem. They're a software engineer interested in philosophy, specifically the pessimistic meta-induction and scientific realism. They've listed seven historical scientific theories with their personal verdicts on whether each was "on to something" or not. The challenge is to find a single principle that explains all these verdicts consistently.

  First, I need to understand their examples and verdicts. For Fresnel and caloric, they think the theories were onto something because the mathematical equations survived even though the ontology (ether, caloric fluid) didn't. But for Ptolemy, despite accurate predictions, they see it as mere curve-fitting. Phlogiston gets partial credit for the conservation idea, Bohr is seen as a useful ladder but not true, Mendel as strongly correct despite wrong physical details, and Darwin as fundamentally true despite wrong inheritance mechanisms.

  The user's core tension is between mathematical survival and conceptual insight. Cases 1-2 suggest math is key, but that would elevate Ptolemy (which they reject) and condemn phlogiston (which they want to save). Their Darwin verdict also stands out as qualitatively different.

  Looking at philosophy of science, structural realism seems relevant here - the idea that what survives is the mathematical structure. But as the user notes, this contradicts their Ptolemy verdict. Entity realism (focusing on real entities) would save Mendel but condemn Fresnel. 

  Perhaps a dual principle could work: a theory is "on to something" if EITHER its mathematical structure survives substantially OR its core causal mechanism/entity proves valid. This would explain Fresnel (math), caloric (math), Ptolemy (neither), phlogiston (mechanism), Bohr (neither), Mendel (entity), Darwin (mechanism). 

  But does this handle their special Darwin case? Natural selection as a mechanism survived even though blending inheritance didn't. And for dark matter - if we apply this principle, it would depend on future outcomes: if dark matter particles are found, it's like Mendel; if not but the math survives, it's like Fresnel; if neither, it's Ptolemy.

  The user might resist this dual approach as too flexible. We could try prioritizing mechanisms over math, but that condemns Fresnel. Or add a "novel prediction" requirement, but phlogiston didn't have that. 

  Ultimately, their Darwin verdict suggests they weight generative explanatory power highly - natural selection created a new framework. This doesn't fit neatly with others. Maybe no single principle satisfies all their intuitions without making some verdicts "special cases."

  For the standard model, structural realism would say its math will survive even if ontology changes. For dark matter, if particles are found, it's real; if not but gravity math works, it's structural; if replaced entirely, it was Ptolemaic.

  The user's intuitions seem to blend multiple philosophical criteria - which is actually consistent with how many scientists operate. Their discomfort may stem from wanting philosophy to be as clean as code, but history is messier. I should acknowledge that while offering the dual principle as the best fit, noting where it requires adjusting their verdicts slightly (like being softer on Bohr).
answer: |-
  Your analysis is impressively nuanced—exactly the friction between historical cases that makes the pessimistic meta-induction compelling. Here’s a principled framework reconciling your verdicts, the adjustments needed for consistency, and applications to dark matter/standard model. The core principle is **dual-track realism**:

  ### Unified Principle: **Structural Retention + Causal Mechanism Integrity**
  A theory is "on to something" if either:
  1.  **Its mathematical/structural core survives substantially intact** in successor theories (even if ontology changes), *or*
  2.  **Its central causal mechanism or entity is validated** (even if initial details are wrong).

  This splits "approximate truth" into two non-arbitrary types: **structural continuity** (math/laws) and **causal fidelity** (entities/processes). Cases sorted:

  | Case | Structural Retention? | Causal Mechanism Valid? | Verdict | Principle Applied |
  |------|------------------------|--------------------------|---------|-------------------|
  | **1. Fresnel's optics** | ✅ Equations survived | ❌ Ether invalid | On to something | **1. Structural retention** |
  | **2. Caloric theory** | ✅ Heat equation survived | ❌ Caloric fluid invalid | On to something | **1. Structural retention** |
  | **3. Ptolemaic astronomy** | ❌ Epicycles abandoned | ❌ Geocentrism/mechanism false | NOT on to something | Fails both criteria |
  | **4. Phlogiston** | ❌ No equations survived | ✅ Conservation principle valid | On to something | **2. Causal mechanism** |
  | **5. Bohr atom** | ⚠️ Math partially retained | ❌ Orbital mechanism false | NOT on to something (useful ladder) | *Adjustment needed* |
  | **6. Mendel** | ⚠️ Math simplified | ✅ Gene entity validated | On to something | **2. Causal mechanism** |
  | **7. Darwin** | ⚠️ Math not central | ✅ Natural selection validated | On to something | **2. Causal mechanism** |

  ---

  ### Resolving Tensions
  - **Ptolemy vs. Fresnel/Caloric**: Ptolemy’s math (epicycles) was *computational scaffolding*, not law-like structure. It was discarded, not preserved like Fourier’s equation. Your intuition aligns: structural retention requires *explanatory laws*, not just predictive algorithms.
    
  - **Phlogiston’s Salvage**: Though no math survived, its core causal insight (conserved substance in combustion) prefigured mass conservation/oxidation. This justifies verdict 4 via **causal mechanism integrity**.

  - **Bohr Atom Tension**: Your "useful ladder but not true" verdict *conflicts* with the principle. Bohr’s orbits were a false causal mechanism, and the math (Balmer series fit) was a stepping stone, not retained structure. **Verdict 5 must change** to "NOT on to something" for consistency. Its value is pedagogical/pragmatic, not truth-tracking.

  - **Darwin’s Special Status**: Natural selection is a validated *causal mechanism* (principle 2). Blending inheritance was a secondary assumption, not core to the theory’s causal engine. No conflict with Fresnel—they represent different "tracks" of approximate truth.

  ---

  ### Applications to New Cases
  1. **Standard Model of Particle Physics**:  
     - *If superseded*: Quarks/leptons may be composite or emergent, but the **mathematical structure** (gauge theories, symmetry groups) will likely survive in any QFT-based successor.  
     - **Verdict**: On to something via **structural retention**, even if ontology shifts (like Fresnel).

  2. **Dark Matter**:  
     - *If dark matter particles are detected*: Validates the **causal entity** (like Mendel’s gene).  
     - *If replaced by modified gravity (e.g., MOND)*: Original dark matter **entity fails**, but its gravitational anomaly math *might* be retained as an effective approximation (structural partial credit, weaker than Fresnel).  
     - *If entirely new physics replaces it*: Fails both criteria (like Ptolemy).  
     - **Your Suspicion is Correct**: Current verdict depends on future outcomes. Today, it resembles **phlogiston** (causal mechanism candidate without direct evidence) but could become **Ptolemy** if discarded without structural legacy.

  ---

  ### Why This Works
  - **Saves your intuitions**: Distinguishes Ptolemy (discarded scaffolding) from Fresnel (retained laws) and phlogiston (validated causal insight) without arbitrariness.  
  - **Handles Darwin/Mendel**: Causal mechanisms can be "true" even with flawed details.  
  - **Bohr is the outlier**: Your "useful ladder" view is pragmatic, not realist. The principle demands downgrading Bohr to "not on to something" truth-wise.  
  - **No geocentrism bias**: Ptolemy fails because *both* its mechanism (crystalline spheres) *and* math (epicycles) were abandoned—unlike Copernicus, who preserved predictive math while correcting the mechanism.

  ### Philosophical Backup
  This aligns with **selective realism** (Psillos, Stanford): we cherry-pick *what* was preserved (structure *or* entities), not the whole theory. **Structural realists** (Worrall) would save 1-2 but struggle with 4 and 6-7. **Entity realists** (Hacking) save 6-7 but not 1-2. Your hybrid approach reflects scientific practice: we retain what *works*—either the math or the mechanism—and discard the rest.

  ### Conclusion
  - **Single Principle**: Dual-track realism (structural retention **or** causal mechanism integrity).  
  - **Verdict to Change**: Bohr (5) must be "NOT on to something" for truth-tracking (though pragmatically useful).  
  - **Dark Matter Verdict**: Currently like phlogiston (causal postulate); future determines if it becomes Mendelian (entity found), Fresnel-like (math survives), or Ptolemaic (discarded).  
  - **Standard Model**: Like Fresnel—its structure will likely persist.

  This maintains your core intuitions while adding rigor: science makes progress by preserving *either* mathematical skeletons *or* causal ghosts from past theories—but rarely both, and never the entire body.
