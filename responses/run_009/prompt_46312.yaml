prompt: |-
  hey, so i'm in a civics/econ elective and we just finished a unit on labor. we watched a bunch of coverage of the 2023 UAW strike against the Big Three (Ford, GM, Stellantis) and my teacher kept describing it as a "war of attrition" — both sides just burning money, and whoever can stand the pain longer wins. he also gave us the standard line that in a normal all-out strike the workers usually run out of money before the company does, since everyone walking out loses a paycheck while the company can still hurt less than the workers do, at least for a while.

  but what actually happened was this "stand-up strike" thing shawn fain ran, where instead of everyone walking out at once, they struck like one or two plants at a time and kept adding more each week depending on which company was moving in negotiations. and the way he explained it, the economics flipped: the union could keep that going way longer than the companies could, because a couple of struck plants shut down whole supply chains so the company bled money every day while only a fraction of workers were going without pay.

  so heres what i want from you. walk me through the attrition model properly: who the players are, what each side's "burn rate" is, what counts as winning, and what the payoff structure looks like in a textbook strike where everybody walks out at once. then show me exactly how the stand-up tactic changes those payoffs — who is burning money faster now, and whether you'd say the union basically re-engineered the game so that the side which normally loses attrition contests became the one that could wait longer. then be honest about where the model breaks: did the companies actually settle because of the math, or were there other things going on (public support, the fact that a big strike had just happened a few years earlier, whatever) that a pure cost-burning model just doesn't capture? my teacher also mumbled something about how strikes work by changing what people think is possible, not just by who can endure more, but i didnt really follow it — so if theres a version of the model where that fits, explain it, and if not, just say the model is silent there and dont force it.

  last thing: dont just give me the generic textbook stuff about collective bargaining power, i can get that anywhere. i want the actual mapping, and i want you to tell me straight if any part of the stand-up story i gave you is wrong or exaggerated.
