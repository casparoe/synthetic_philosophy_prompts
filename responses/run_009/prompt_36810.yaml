  Okay, the user runs a podcast combining typography and cognitive science, with an audience that's very critical of unfalsifiable claims. They need interview questions for a design theorist promoting the "skeleton view" of letters. 

  Hmm, the guest's core idea is fascinating but risky for this audience - reducing letters to structural skeletons could easily sound metaphysical if not grounded properly. The user clearly wants to avoid another "redefined term midway" embarrassment. Their four required angles are smart pressure points: 

  First, the double-storey/single-storey dilemma seems like the skeleton view's Achilles heel. If two visually distinct forms share one skeleton, what defines that abstraction? The follow-up about Helvetica's "a/u" confusion must force the guest to admit where context overrides structure. 

  Second, the learning question cuts deep. Kids don't abstract skeletons from multiple fonts - they learn concrete shapes. The grammar analogy follow-up needs to trap him: if skeletons are innate, show me the cognitive wiring; if learned, explain the mechanism beyond handwaving "generativity." 

  Third, Hofstadter comparison is essential because Letter Spirit's fluid "style atoms" seem to contradict rigid skeletons. The guest might try merging both concepts - better prepare to dissect whether he's stretching definitions. 

  Finally, the falsifiability question is non-negotiable. The comment section will eviscerate vague answers. Must demand specific, observable counterevidence like "If dyslexics don't process X, or if a font breaks Y rule but remains readable..." 

  Noting the user's banter warning: questions should sound conversational but with steel underneath. Opening with the grammar analogy lets him warm up while setting up later traps. Save the hardest falsifiability demand for last when he's committed to his framework. 

  Biggest risk is him retreating to "it's emergent/complex" - every follow-up must corner him into concrete claims. Maybe add a hidden challenge: if he claims skeletons explain reading speed, ask why we read script fonts slower despite "identical structure."
answer: |-
  Here are ten questions (+ follow-ups) designed to push the conversation beyond restating the skeleton view, hitting your required points while keeping it conversational but rigorous:

  1.  **Core Analogy:** "You've compared the skeleton to the *grammar* of a language – generative, not just a lookup table. That's evocative! But let's make it concrete: what specific *operations* or *rules* in this 'grammar' allow it to generate the vast diversity of letterforms we see – say, from a rigid Futura 'a' to a flowing script 'a'? What's the typographic equivalent of syntax rules?"  
      *(Follow-up if he leans into generativity):* "Okay, so if it's generative like grammar, where does the 'competence vs. performance' distinction land? Is a poorly drawn 'a' a failure of the underlying competence (skeleton rules), or just messy performance? How would we *test* that difference?"

  2.  **The Double/Single-Storey Challenge (a/g):** "Let's tackle a concrete head-scratcher: the double-storey vs. single-storey 'a' and 'g'. If the skeleton is the *defining* essence of the letter, does that mean these are fundamentally *different* skeletons – implying they're different 'letters' deep down – or is there a single, more abstract 'a'-skeleton that both instantiates? If it's one skeleton, what *is* that shared structure that encompasses both a two-storey Garamond 'a' and a single-storey Gill Sans 'a'?"  
      *(Follow-up based on likely 'shared structure' answer):* "So, if it's one skeleton, what *essential* relational features must absolutely be present in both the double and single forms to still be 'a'? Can you sketch that minimal, abstract 'a'-ness that survives that transformation?"

  3.  **Confusability & Context (a/u):** "Sometimes the skeleton seems to falter. In fonts like Avant Garde or ITC Bauhaus, the single-storey 'a' can look *really* close to a 'u' with a tail. Readers clearly use word context to tell them apart. Doesn't this suggest that in ambiguous visual cases, the skeleton alone *isn't sufficient* for disambiguation, and top-down context is doing the heavy lifting? How does your view accommodate that?"  
      *(Follow-up):* "Does this imply the skeleton is more of a *probabilistic* guide than a strict rule? Or is the ambiguity actually a failure of the *rendering* (the 'performance') to clearly express the true underlying 'a' or 'u' skeleton?"

  4.  **Origins & Learning:** "Let's talk origins. A child learns letters typically from *one* or *two* very specific typefaces – maybe their teacher's handwriting and a children's book font. They're seeing very concrete shapes. How does the brain, from such limited and specific examples, abstract away to this supposedly universal, font-invariant *skeleton*? Is this a well-defined cognitive process we can point to, or is it more of a 'black box' learning outcome?"  
      *(Follow-up):* "Is the skeleton something we *extract* from examples (like a prototype), or is it more like an innate cognitive structure *activated* or *refined* by exposure? What evidence points to either?"

  5.  **Hofstadter & Letter Spirit:** "Your skeleton view reminds me of Hofstadter's old 'Letter Spirit' project, where letterforms emerged from the interaction of abstract 'style atoms' within a grid context. He saw letter categories as fluid, context-sensitive 'spirits'. Is your skeleton more like Hofstadter's fixed 'grid frame' for a letter, or is it closer to the emergent 'spirit' itself? Ally, rival, or different beast?"  
      *(Follow-up if he distinguishes them):* "Hofstadter emphasized how context (neighboring letters, overall style) radically reshapes the *instantiation* of a letter. Does the skeleton *itself* change based on context (like a 'd' next to an 'i'), or is it rigid, with context only affecting the rendering?"

  6.  **Falsifiability - THE CRUCIAL ONE:** "Our audience lives for falsifiable claims! So, what specific, observable phenomenon about reading, letter recognition, or type design would genuinely *count as evidence against* the skeleton view? If we saw 'X' happen consistently, you'd say, 'Okay, that doesn't fit, maybe the skeleton isn't the core thing'?"  
      *(Follow-up if answer is vague):* "Let's get concrete. For example: If readers could reliably identify a completely novel symbol *as an 'a'* based purely on context, even if it violated your proposed essential skeletal structure, would that challenge the view? Or if a typeface deliberately broke skeletal rules but remained highly legible?"

  7.  **'Wrongness' Explained:** "You mentioned the skeleton explains why we sense a *wrong* 'a' even in an unfamiliar style. What's the minimal skeletal deviation that triggers that 'wrongness' feeling? Is it breaking a specific relational rule (like stem-bowl connection point), or is it more about overall structural incoherence?"  
      *(Follow-up):* "Could there be a *novel* rendering that breaks conventional skeletal rules but *doesn't* feel wrong – perhaps because it introduces a new, coherent structural logic? Or would that automatically feel 'wrong' until learned?"

  8.  **Beyond Latin?:** "Does the skeleton concept extend convincingly beyond the Latin alphabet? What about scripts with enormous contextual variation like Arabic, or highly logographic systems like Chinese? If it struggles there, what does that say about its universality as a theory of character recognition?"

  9.  **Neural Plausibility:** "Cognitive science-wise: Are there findings from neuroscience or psychology that you see as particularly supportive (or challenging) for the idea of a structural skeleton being the primary neural representation? For instance, how does this align with what we know about the visual word form area?"

  10. **Design Implications:** "Putting on your design theorist hat: If type designers truly embraced the skeleton view as fundamental, how should it change their practice? Should they start drafts by defining the skeleton first? Does it offer concrete tools for creating radically novel yet instantly legible letterforms?"

  **Key Tactics Embedded:**

  *   **Grammar Analogy Pressure:** Q1 & Follow-up directly challenge the analogy's substance.
  *   **Your Four Mandates:** Q2 (Double/Single), Q3 (Confusability), Q4 (Learning), Q5 (Hofstadter).
  *   **Falsifiability Front and Center:** Q6 is explicit and demands specificity. The follow-up forces concreteness.
  *   **Preventing Redefinition:** Questions use consistent terms ("skeleton", "rendering", "structure", "rules") and ask for definitions *in action* (Q2 follow-up, Q7).
  *   **Banter-Friendly but Sharp:** Conversational framing ("head-scratcher", "evocative!", "putting on your hat") but with precise demands ("specific operations", "minimal relational features", "concrete phenomenon").
  *   **Follow-ups Target Likely Answers:** Anticipating his "shared structure" for a/g, "rendering failure" for confusability, and potential vagueness on falsifiability.

  **Delivery Tip:** Frame Q6 (falsifiability) with a light touch but absolute clarity: "Alright, time for the LessWrong special: What would *falsify* this for you?" Smile, but hold eye contact. Your audience will thank you. Good luck!
