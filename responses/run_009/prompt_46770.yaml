  You are a philosopher of cognitive science with a working knowledge of both the perceptual psychology and the philosophy of mind literatures, and I need you to write me a careful, committed essay.

  Last night my friend Elena, a psychology PhD student, and I argued for three hours about cognitive penetration, and we ended exactly where we started, only angrier. She holds that cognition demonstrably shapes perception: hills look steeper to people wearing heavy backpacks or in poor physical fitness (the Proffitt-style slant studies), gray patches on banana-shaped outlines look faintly yellow until the patch is shifted slightly toward blue (the "memory color" findings), and moral or food-related words seem to pop out in visual search for people who care about them. I kept pressing the standard critique associated with Firestone and Scholl: strip away judgment and response biases and the "effects" evaporate — the subject isn't seeing a steeper hill, she's reporting one. But here's the part where I think our argument actually got somewhere, and I want it to be the spine of the essay: the usual way of drawing the line between real penetration and post-perceptual contamination is to ask whether the effect sits in "early vision," which strikes me as an anatomical question dressed up as a conceptual one. My alternative criterion, which I'd like you to take seriously even if you ultimately reject it: a top-down influence counts as genuine penetration only when the perceptual system is using higher-level information as *evidence about the distal stimulus* — that is, only when the influence would recalibrate in response to predictive error, the way ordinary perceptual priors do, rather than merely tracking what the subject cares about. On that criterion, an effect that varies with the subject's goals but shows no such error-driven recalibration is not penetration; it is something else, maybe a pragmatic adjustment of report, maybe a change in the very function of the state.

  Write an essay of no more than 900 words — a hard limit, this is for a seminar where brevity is graded — on whether cognitive penetration, properly so called, occurs. Weigh the pro-penetration evidence as a class against the deflationary critique, put my evidence-based criterion to work in adjudicating at least one of the concrete cases above, and take a definite position rather than surveying the options and handing them back to me: say clearly whether any of the celebrated effects survive, and if you think none do, say whether my criterion nonetheless carves out a class of *possible* cases that would count as genuine. Before writing, spend a brief moment brainstorming which of the three cases best separates the two sides, and factor that into your plan; keep the brainstorming short, as the word limit applies to the essay itself. Refer to positions and arguments in prose as needed, but do not include citations or a bibliography — I will supply those myself. Be self-critical about where your verdict rests on my contested criterion rather than on the evidence.
