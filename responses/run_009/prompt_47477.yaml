prompt: |-
  i'm a phd student in political theory and my dissertation chapter is on epistemic arguments for democracy, and before i go any further I want the spec nailed down: what does a Condorcet-style jury theorem have to actually deliver before it can do the work it's almost always asked to do, namely justify giving majorities authority over collective decisions? Everyone in my field quotes the theorem and then quietly smuggles in repairs — competence above 1/2, independence, sincere voting, a procedure-independent fact of the matter to track — and I want the full requirements list with the case behind each one. Some candidates I can already see the shape of, but I want them done properly: it has to handle correlated votes (voters share media environments and sometimes just copy each other, and the correlated-votes results going back to Ladha and Berg suggest reliability degrades fast once common causes enter), it has to handle heterogeneous and possibly endogenous competance (voters differ, and how informed they are may depend on the institutions the theorem is supposed to justify), it has to say something about small bodies like juries and committees where the asymptotics never kick in, and it has to respect the distinction between tracking facts and aggregating values, which people keep blurring. Mark for each requirement whether it's non-negotiable for the theorem to have any content at all, or just a pet assumption of one camp, and say why.

  The part I actually care about, and the thing I keep getting tangled with my advisor on: is there a subset of the desiderata that is jointly unsatisfiable? My worry is that the usual repairs — weight votes by competence, filter out the badly informed, restrict the franchise to the issue-aware — improve accuracy only insofar as they move the procedure away from equal votes, so that "reliable" and "still recognizably democratic" can't both be secured by the same construction, and once you see that, the theorem is an argument for an epistocracy of the well-informed wearing a democratic hat. If that tension is real, say so and say which side has to give; if it's not, show me where the repair keeps equality intact. And tell me which single requirement does the most work knocking out the candidate repairs — I suspect it's the endogenous-competence one but I'm not sure and don't want to build a chapter on a hunch. no scorecard of existing positions, just the criteria and the satisfiability verdict, I'll do the applications myself later. tbh a table is fine if that's easier.
reasoning: |-
  Okay, let me tackle this PhD student's query on the Condorcet Jury Theorem (CJT) and its application to democratic justification. The user is deep into political theory and needs a rigorous breakdown of the theorem's requirements to strengthen their dissertation chapter. 

  First, I recognize their frustration with how the CJT is often cited without acknowledging its limitations. They want a clear list of necessary conditions versus optional assumptions, especially regarding correlated votes, heterogeneous competence, small groups, and the fact-value distinction. 

  The core tension they're wrestling with is whether attempts to "fix" the CJT (like weighting votes by competence) inherently undermine democratic equality. They suspect these repairs create an epistocracy in disguise. I need to validate if this trade-off exists and identify the biggest obstacle to CJT-based justifications.

  Starting with the non-negotiable conditions: Sincere voting and a procedure-independent fact are absolute must-haves—without them, the theorem collapses mathematically. Independence and competence >0.5 are also fundamental, though the independence requirement is fragile in real-world settings with shared information environments.

  For competence heterogeneity, it's not fatal to the theorem itself (since CJT can tolerate variation as long as average competence exceeds 0.5), but it becomes a major practical hurdle when competence is endogenous—when voters' knowledge depends on the democratic system itself. This endogeneity might be the critical flaw because institutional fixes to boost competence (like restricting suffrage) could erode democratic legitimacy while trying to save epistemic performance.

  On the equality-vs-accuracy trade-off: Yes, the tension is real. Weighting votes or filtering electorates may improve accuracy but at the cost of equal voting power. The only repair that preserves equality—competence-building through democratic deliberation—risks being ineffective under inequality or time constraints. 

  The verdict: CJT can't jointly satisfy reliable tracking of truth and robust democratic equality under realistic conditions. Endogenous competence is the biggest wrecking ball because it makes competence-enhancing measures self-undermining. The theorem ends up justifying epistocracy unless we redefine "democratic" to include unequal influence—which the student rightly identifies as philosophically problematic.

  I'll structure this as a table in the response for clarity, marking each requirement's negotiability and impact, then explicitly state the joint unsatisfiability and identify endogenous competence as the key destabilizer.
answer: |-
  Here's a breakdown of the requirements for a Condorcet-style Jury Theorem (CJT) to genuinely justify majority authority in democratic decisions, the classification of each, and the verdict on joint satisfiability. The core tension you identify is valid and central.

  **Condorcet Jury Theorem: Requirements & Status**

  | Requirement                   | Class          | Why?                                                                                                                               | Impact on Repairs                                                                                                 |
  | :---------------------------- | :------------- | :---------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------- |
  | **1. Dichotomous Choice**     | Non-Negotiable | The theorem mathematically requires two options. Extensions to >2 options are complex and lose strong guarantees (e.g., cycling). | Limits scope; repairs must stay binary or face radically different (often weaker) results.                       |
  | **2. Procedure-Independent Fact** | Non-Negotiable | CJT tracks an objective truth ("correct" option). Without this, "accuracy" is undefined. Value aggregation is a different problem. | Blurring this renders CJT irrelevant. Repairs *must* assume an objective truth exists for the decision at hand. |
  | **3. Sincere Voting**         | Non-Negotiable | Voters must vote according to their *belief* about the correct option. Strategic voting breaks the competence/independence link. | "Competence" becomes ambiguous. Repairs assuming sincerity (e.g., weighting) fail if voting is strategic.        |
  | **4. Competence > 0.5 (Avg.)**| **Conditional** | *Non-Negotiable for Asymptotic CJT:* `P_n -> 1` as `n -> ∞` requires `p > 0.5` strictly. <br> *Negotiable for Non-Asymptotic:* Finite groups need `p_avg > 0.5` for `P_n > 0.5`, but not necessarily `P_n > p_i`. | **Core Repair Target:** Heterogeneity is tolerated *if* `p_avg > 0.5`. Endogeneity directly attacks this fundament. |
  | **5. Independence**           | **Conditional** | *Non-Negotiable for Classic CJT Proof:* Statistically independent votes are required. <br> *Negotiable with Modification:* Models incorporating known correlation structures exist (e.g., Ladha), but require strong assumptions/knowledge and reduce accuracy gains significantly. | **Major Repair Target:** Correlated errors (shared biases/media) drastically reduce majority accuracy, especially for finite `n`. Repairs require modeling/suppressing common causes (hard). |
  | **6. Minimal Competence Heterogeneity** | Negotiable     | Classic CJT assumes identical `p`. Heterogeneous `p_i` is tolerable *if* `p_avg > 0.5` and variance isn't pathological. Finite `n` results are sensitive to distribution. | Permits repairs like weighting/filtering *if* competence is measurable/exogenous. But weighting directly undermines equality. |
  | **7. Exogenous Competence**   | **Critical Practical Constraint** | Voters' competence (`p_i`) must *not* be significantly caused or shaped by the democratic institutions/processes the CJT is supposed to justify. | **The Wrecking Ball:** If institutions determine `p_i` (e.g., via education, deliberation incentives, franchise rules), then using CJT to justify *those same institutions* is circular or self-defeating. |
  | **8. Applicability to Finite n** | Essential for Realism | Asymptotic results (`n->∞`) are irrelevant for real decisions (juries, committees, electorates). The theorem must deliver useful accuracy for feasible `n`. | Repairs must work for small `n`. Correlation and low `p_avg` are devastating here; high `p_avg` is much harder to ensure. |
  | **9. Equal Voting Weight**    | **Core Democratic Desideratum** | Democratic legitimacy typically requires formal political equality ("one person, one vote"). | **The Equality-Accuracy Trade-off:** Many accuracy-enhancing repairs (weighting, filtering) explicitly violate this. |

  **The Joint Satisfiability Verdict & Key Tension**

  1.  **The Fundamental Tension is REAL and UNAVOIDABLE:** There is **no repair** that simultaneously satisfies both:
      *   **Strong Epistemic Reliability (Accuracy):** Requires sufficiently high `p_avg > 0.5`, mitigation of correlation, and applicability to finite `n`.
      *   **Robust Democratic Equality:** Requires equal voting weight *and* avoids epistocratic exclusion/filtering.
      *   **...under conditions of Endogenous Competence:** Institutions inevitably shape `p_i` (information access, education, incentives to participate/deliberate).

  2.  **Why They Conflict:**
      *   **Accuracy Requires Handling Low/Endogenous `p` & Correlation:** Boosting `p_avg` or reducing damaging correlation in a real electorate almost *necessitates* unequal treatment:
          *   **Filtering the Franchise:** Excluding the least competent/informed. (Violates equality/universal suffrage).
          *   **Weighting Votes:** Giving more weight to the (perceived) more competent. (Violates equal weight).
          *   **Structural Interventions:** Altering media environments, education, deliberation rules *before* voting. (Raises endogeneity - the system shapes the competence used to justify it; may also involve unequal input/resources).
      *   **Equality Constrains Accuracy-Enhancing Measures:** Insisting on strict equal weight and universal franchise prevents the most direct tools for counteracting low `p_avg` or harmful correlation. The *only* equality-preserving "repair" is generic competence-building *through* democratic processes (deliberation, education), but:
          *   This is slow, uncertain, and effectiveness is endogenous.
          *   It doesn't directly address correlation *within* the voting act itself.
          *   It may not suffice for finite `n` decisions needing immediate accuracy.

  3.  **Which Side Has to Give?** **Democratic Equality must be qualified** for the CJT to provide a strong *epistemic* justification for a specific decision procedure. The CJT, when repaired for real-world conditions, inherently points towards mechanisms that differentiate voters based on (perceived) competence to achieve reliability. This makes it an argument for **epistemic proceduralism** (the system is reliable *because* of its specific structure, which may include unequal elements) wearing a democratic hat, not an argument for simple majoritarianism based on equal votes. Defenders must either:
      *   **Weaken the Epistemic Claim:** Argue CJT-like effects are *sufficient* under *good enough* (but not ideal) conditions with equality, accepting lower reliability.
      *   **Redefine "Democratic":** Argue that procedures incorporating competence-weighting/filtering *can* still be democratic if justified by equal opportunity or other values, conceding strict equality of vote weight is sacrificed for accuracy.
      *   **Emphasize Other Justifications:** Acknowledge CJT's fragility and lean more heavily on non-epistemic justifications for democracy (freedom, equality, legitimacy).

  **The Single Most Disruptive Requirement: Endogenous Competence**

  *   **Why it's the Wrecking Ball:** It fundamentally destabilizes the *justificatory project*.
      *   **Attacks Repairs Directly:** Filtering/weighting presupposes an exogenous, measurable competence. If competence is *shaped* by the institutions (e.g., excluding a group lowers their motivation/information; weighting creates elite classes), the measure becomes self-referential and the justification circular. Using CJT to justify Institution X requires assuming X doesn't ruin the `p_i` used in the theorem.
      *   **Undermines Core CJT Logic:** The theorem treats `p_i` as given. If `p_i` is *produced* by the democratic environment (information flows, polarization, deliberation quality), then the reliability of majority vote is *itself* an outcome of the system, not an independent mathematical guarantee applicable to justify it. You can't bootstrap the justification using a competence that the system itself determines.
      *   **Makes Epistemic Superiority Contingent & Unprovable:** It becomes incredibly hard to claim a specific democratic procedure is epistemically superior based on CJT if its epistemic input (`p_i`) is endogenous. The system might be optimizing or degrading competence in complex ways you can't model in a simple theorem.

  **Conclusion for Your Chapter:**

  The Condorcet Jury Theorem, in its pristine form, cannot justify real-world majority rule under equal suffrage. The repairs necessary to make it plausible under conditions of correlation, heterogeneous competence, finite groups, and the need to track facts **inevitably compromise strict political equality (equal vote weight and/or universal franchise)**. The most profound obstacle to using CJT as a justificatory foundation is **endogenous competence**, as it makes the key input (`p_i`) dependent on the very institutions being justified, creating circularity and undermining the theorem's independent predictive/justificatory power. The CJT, when honestly applied, functions better as an argument for carefully designed epistemic institutions that may incorporate unequal elements for reliability, rather than a straightforward justification of simple majoritarian democracy based on equal votes. The tension you perceive is not just real; it's fundamental.
