  **EVERBRANCH QUANTUM IMMORTALITY HELMET™  
  TERMS OF SERVICE & LIMITED WARRANTY AGREEMENT**  
  ***(Version 8.7.3δ - Effective upon subjective observation of acceptance)***

  1.  **DEFINITIONS:** "Device" means the EverBranch Quantum Immortality Helmet™. "Activation" means deliberate User initiation of the Device's quantum superposition resolution protocol. "Surviving Instance" means the subjective continuum of experience perceiving non-fatal Device operation post-Activation. "You" or "User" refers to the biological entity initiating Activation *within the specific Everett branch where this Agreement is perceived as binding*.

  2.  **PURPOSE & FUNCTION:** The Device utilizes controlled quantum indeterminacy to create a superposition state resolved upon Activation. This resolution manifests across all possible Everett branches instantiated by the event. In approximately 50% of resultant branches (subject to Clause 4.3), a lethal decoherence event ("Firing") occurs. **2.1 Warranty of Subjective Continuity:** EverBranch warrants that for any User initiating Activation, there exists at least one Surviving Instance perceiving non-Firing, thereby ensuring *subjective* survival from the User's experiential perspective within the branching multiverse.

  3.  **WARRANTY CLAIMS & ENTITLEMENT:** **3.1 Claimant Identity:** Warranty claims (e.g., Device malfunction, failure to perceive subjective survival) may only be filed by a Surviving Instance. **3.2 Singular Entitlement:** Notwithstanding the potential existence of innumerable Surviving Instances across the multiverse, EverBranch's liability is limited to servicing or replacing the Device *only within the specific branch where the claim is filed and validated*. No compensation, refund, or service is owed to Surviving Instances in other branches, nor to non-surviving iterations. **3.3 Burden of Proof:** User must demonstrate, to EverBranch's sole satisfaction, that perceived harm occurred in a branch where the Device *should not* have Fired according to its calibrated specifications. Proof of existence in a surviving branch is inherent but insufficient.

  4.  **LIMITATIONS & DISCLAIMERS:** **4.1 No Guarantee of Absolute Survival:** While subjective continuity is warranted (Clause 2.1), EverBranch does not guarantee the *absolute* survival of the User's biological substrate or consciousness stream in *all* branches. Death in Firing branches is inherent and expected. **4.2 Non-Linearity of Experience:** User acknowledges that Surviving Instances across branches are causally isolated. Experiences, memories, and legal standing are branch-specific. **4.3 Born Rule Uncertainty:** The warranty assumes Born Rule probabilities govern branch weighting. Should the Born Rule prove emergent or non-fundamental, the perceived 50% survival rate and associated warranties become void. Survival in a branch does not imply that branch was "probabilistically favored." **4.4 Heat Death/Quantum Vacuum Collapse:** Warranty is void in branches experiencing universal entropy maximization, false vacuum decay, or other existential cosmological events.

  5.  **BILLING & PAYMENT:** **5.1 Multiversal Billing:** User authorizes EverBranch to pursue payment collection from *any and all* pre-branching instances of the User, or their estates, located within branches where the Device Fired and caused demise. **5.2 Solvency of Deceased Instances:** EverBranch reserves the right to utilize quantum entanglement-based debt recovery methods across branches, irrespective of the biological status of the debtor instance. **5.3 Payment Guarantee:** User guarantees payment will be rendered by at least one solvent instance (living or deceased, per local branch legal definitions) within the multiversal ensemble. *(Contradicts Clause 5.1's focus on Firing branches)*.

  6.  **CUSTOMER SUPPORT:** **6.1 Branch-Local Support:** Initial support inquiries are handled within the User's branch of contact. **6.2 Support Continuity:** User acknowledges that support personnel are also subject to quantum mortality events. **6.3 Support Attrition:** EverBranch cannot guarantee the perpetual existence of support staff instances capable of assisting across all future timepoints in all surviving branches. **6.4 Eventual Support Extinction:** User agrees that due to the cumulative probability of Firing events over time across all branches, all instances of EverBranch support staff will eventually cease to exist in an experiential sense relative to the User's branch. Support is offered on a "best-effort, locally surviving agent" basis only.

  7.  **GOVERNING LAW & JURISDICTION:** This Agreement is governed solely by the legal statutes and physical laws prevailing within the specific Everett branch where the Device was purchased and this Agreement was subjectively assented to. Litigation across branches is strictly prohibited due to light-cone restrictions and decoherence.

  8.  **ENTIRE AGREEMENT:** This document constitutes the sole agreement between the Surviving Instance User and EverBranch within this branch. Prior versions existing in pruned or incompatible branches are null and void.

  **FINAL DISCLAIMER:** *While the Device leverages theoretical quantum principles to create the perception of continuous subjective survival for the observing entity within the branching multiverse, EverBranch, its affiliates, subsidiaries, or legal counsel make no representations, warranties, or guarantees regarding the objective continuity of consciousness, the nature of personal identity across branches, or the ultimate survivability of any specific biological or informational pattern constituting "You" in any ontological framework, whether quantum, classical, or philosophical, now or at any future point in the configuration space of reality.*
