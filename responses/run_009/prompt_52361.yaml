  First I need to handle their core mapping request carefully. Their proposed parallels (perception as direct readout, inference as learned model etc.) are clever but I suspect oversimplify Nyāya's richer epistemology. For example, treating upamāna as mere retrieval misses how it involves conceptual synthesis - more like few-shot learning than database lookup. And śabda as benchmark reporting ignores the chain of epistemic authority in āpta-vākya.

  The reduction debate translation needs nuance too. When Buddhists collapse upamāna/śabda into anumāna, that's not just simplifying validation signals - it reflects their nominalist metaphysics where all knowledge is constructed. Nyāya's fourfold defense argues these are distinct causal pathways to truth, each with irreducible failure modes. The user's "citation laundering" example beautifully captures śabda's unique vulnerability.

  Now the tricky bits: anadhigata and abadhita. Their "holdout discipline" reading is astute but incomplete. Anadhigata isn't just unseen data - it's the knower's cognitive state of novelty, which has no ML equivalent since models lack subjective awareness. Abadhita as surviving future label drops works surprisingly well though, echoing Nyāya's pragmatic realism.

  The parataḥ prāmāṇya debate cuts deep. Yes, it maps to calibration vs self-validation, but Mimamsa's self-validity isn't just model confidence - it's the Vedic equivalent of "ground truth labels are axiomatic." Nyāya's extrinsic validation is indeed our industry standard: performance is what the next deployment reveals.

  Finally, the residue question. That ātman/soteriology stuff isn't metaphysical baggage - it highlights that Nyāya cares about knowers, not just knowledge. When they say pramāṇas are "episodes in a self," they're rejecting the very pipeline metaphor ML uses. Our validation frameworks have no equivalent because we've deliberately excluded the knowing subject. 

  The user's suspicion is correct: what doesn't translate indicts our vocabulary, not their theory. We've surgically removed the cognizer from cognition. Hence my residue verdict: their irreducible "knowing self" exposes ML's blind spot about epistemic agency.
answer: |-
  Here's your Nyāya-to-ML-Eval translation, with pushback flagged explicitly and residue analysis at the end. I'll take your mappings seriously but challenge where they oversimplify or miss Nyāya's unique constraints.

  ### Core Pramāṇas Restated in ML Terms (with Fidelity Checks)
  1.  **Pratyakṣa (Perception)**: A trusted, low-latency sensor readout *with calibrated uncertainty*. It's like a ground-truth labeler with known error rates (e.g., human annotator, calibrated instrument) operating on raw inputs. **Pushback:** Nyāya insists perception is *non-conceptual* (nirvikalpaka) initially – it's pure sensory registration *before* object recognition. Your "direct readout" works only if it includes this pre-processing stage. ML often assumes sensors *are* perception, but Nyāya reminds us raw sensation ≠ interpreted input.

  2.  **Anumāna (Inference)**: A trained model's prediction *that has survived rigorous out-of-distribution (OOD) validation*. It requires: (a) a learned correlation (vyāpti) validated on holdout data, (b) observation of the reason (hetu) in the new case, (c) absence of confounding factors (upādhi). **Pushback:** Nyāya inference is *explicit, deductive reasoning* based on universal rules ("Where there's smoke, there's fire"). It's closer to a rule-based system or symbolic AI passing a consistency check than a neural net's probabilistic prediction. Your "learned model" fits if it outputs falsifiable, rule-like claims.

  3.  **Upamāna (Comparison)**: Few-shot instance-based matching *using a verified reference prototype*. You see an unfamiliar animal; a ranger says "it's like a gavaya (wild cow) but smaller." You match features to your known "cow" prototype. In ML: Retrieval-Augmented Generation (RAG) using a trusted vector DB of labeled exemplars for similarity search. **Pushback:** It's not just retrieval; it's *learning a new category* via analogy. The key is *novel recognition* ("Ah, *this* is what 'gavaya' means!") – more like active learning with a human-in-the-loop defining a class from one shot.

  4.  **Śabda (Testimony)**: Trusting a benchmark result or dataset from a *credibly audited source (āpta)* without replication. Like using ImageNet accuracy scores from a reputable lab, trusting their data splits, annotation protocol, and compute integrity. **Pushback:** Nyāya requires the speaker to be *both* competent *and* truthful (no incentive to deceive). Your "citation laundering/poisoned eval" worries map perfectly to śabda failure modes (mithyāśabda). But śabda also covers *knowledge transfer* – a trainer explaining a concept is śabda, not just published numbers.

  ### The Reduction Debate: How Many Validation Signals?
  *   **Cārvāka (Perception Only)**: Only direct sensor readouts (pratyakṣa) are valid. Inference is hallucination; testimony is hearsay. ML Equivalent: "Only raw data counts – no models, no external benchmarks." Rejection reason: Fails on latent variables (you infer "disease" from "symptoms," can't *perceive* the virus).
  *   **Buddhists (Inference Only)**: Comparison & testimony are subtypes of inference. Recognizing a gavaya? You *infer* similarity. Trusting a report? You *infer* the speaker's reliability. ML Equivalent: "All validation is model-based reasoning – śabda is just inferring source credibility; upamāna is similarity inference." **Nyāya Pushback:** Inference requires a universal rule (vyāpti). There's no universal rule for *every* analogy or *every* speaker's truthfulness. Each has unique failure modes: upamāna can mislead via superficial similarity; śabda can fail via deception or incompetence. They are *causally distinct* knowledge-generation mechanisms.
  *   **Nyāya Stance**: Four irreducible pramāṇas. **Why?** Each has:
      *   **Unique Causal Pathway**: Perception (sensors), Inference (rule application), Comparison (analogic prototype matching), Testimony (reliable source).
      *   **Irreducible Failure Modes**: Sensor drift (pratyakṣa), overgeneralization (anumāna), misleading prototypes (upamāna), source corruption (śabda).
      *   **Your Mapping Holds:** This *is* a fight about distinct validation signals. Trusting a benchmark (śabda) *isn't* just deferred inference – it relies on source audit trails and provenance checks (unique to testimony), not just model-based reasoning about credibility. Poisoned evals *are* a śabda-specific risk.

  ### Your Doctrinal Queries: Anadhigata & Parataḥ Prāmāṇya
  1.  **Anadhigata (Not Already Known) & Abadhita (Not Contradicted Later)**:
      *   **Anadhigata**: Your "holdout discipline" is *part* of it. But deeper: Knowledge must be *novel to the knower*. If the "system" (human or AI) already *possesses* the knowledge, "re-cognition" isn't a pramāṇa. ML Fit: Training on test data isn't just bad practice – it literally ceases to be *validation* (no novel knowledge generated). **Verdict:** Your mapping is strong, but Nyāya emphasizes the *cognitive state* of novelty, not just data partitioning.
      *   **Abadhita**: Your "survive the next label drop" is excellent. Nyāya is fiercely pragmatic: knowledge is defeasible. If new perception/inference/testimony contradicts it, it wasn't *valid* knowledge. ML Fit: A model validated on 2023 data may fail on 2024 distribution shift – its "knowledge" is abadhita (contradicted). **Verdict:** Spot on. This *is* your iterative validation discipline.

  2.  **Parataḥ Prāmāṇya (Extrinsic Validity) vs. Svataḥ Prāmāṇya (Self-Validity)**:
      *   **Nyāya (Extrinsic)**: Validity is confirmed *after the fact* by outcomes. Like a loan being repaid, or a prediction holding under new data. ML Translation: **Calibration + Deployment Monitoring.** A model's confidence score (svataḥ) isn't enough; you need empirical verification (parataḥ) via held-out tests or real-world performance. Trust requires external evidence.
      *   **Mīmāṃsā (Self-Validity)**: Valid cognitions *intrinsically* justify themselves (under certain conditions). ML Translation: **Perfectly Calibrated Confidence Scores.** If confidence = accuracy, the prediction *is* its own validation.
      *   **Where it Breaks**: Mimamsa grounds svataḥ in Vedic scripture as axiomatically true – closer to assuming a benchmark is "canonical" and needs no audit. Nyāya's parataḥ is more scientific: *all* claims are fallible until externally verified. Your "calibration question" captures the core, but Mimamsa's "self-validity" has a dogmatic element absent in ML.

  ### The Residue Report: What Doesn't Map (and Why it Matters)
  *   **Clean Translations**:
      *   Pramāṇa functions as validation methods.
      *   Anadhigata ≈ Holdout data discipline.
      *   Abadhita ≈ Survival of future distribution shifts.
      *   Parataḥ prāmāṇya ≈ Need for external calibration checks.
      *   Reduction debate ≈ Arguments for distinct validation signals.
  *   **Distorted Mappings**:
      *   **Perception's Non-Conceptual Stage**: ML assumes inputs are pre-processed "features." Nyāya's raw sensation has no direct equivalent – we start at "object recognition."
      *   **Inference as Deductive Rule-Application**: ML inference is often probabilistic/statistical. Nyāya demands logical necessity (vyāpti) – closer to verified causal models than neural nets.
      *   **Ātman (Knowing Self)**: The biggest distortion. Pramāṇas are *acts of a conscious knower*, not pipeline stages. Validity depends on the *knower's state* (anadhigata). ML has no "knower," just processes. **This isn't smuggled metaphysics – it's central.** Knowing requires an agent for Nyāya.
  *   **No Expression in ML**:
      *   **Soteriological Goal**: Knowledge (pramā) liberates from suffering. Validation isn't for accuracy's sake, but for enlightenment. ML eval has no equivalent telos.
      *   **Consciousness as Locus**: The ātman isn't just a "system" – it's the irreducible subject/experiencer. ML pipelines lack this. Episodes *matter to* a self.
      *   **Intrinsic Value of Knowing**: For Nyāya, valid knowledge has value beyond utility. ML eval is purely instrumental (improve performance).

  **Your Suspicion Tested:** The residue (ātman, consciousness, soteriology) **indicts your vocabulary, not Nyāya**. You're trying to map a *first-person epistemology* (how a conscious agent knows) onto a *third-person process* (how a system outputs predictions). Nyāya insists knowledge is *for and by a knower*. ML eval deliberately excludes the knower, focusing on observable behavior/outputs. The untranslatable residue highlights that ML lacks a theory of epistemic agency – the "who" that knows and why it matters. Your holdout reading of *anadhigata* was apt, but it implicitly relied on a *user* for whom knowledge is novel. That user is the ghost in Nyāya's machine – and your pipeline.

  **Residue: The irreducible 'knowing self' exposes ML's lack of an epistemic agent, making Nyāya's first-person framework untranslatable without distortion.**
