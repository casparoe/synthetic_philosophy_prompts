  Key ideas:
  1. Landauer's principle states that erasing one bit of information must dissipate at least kT ln(2) of heat (about 2.85 zeptojoules at room temperature). This is a fundamental lower bound.
  2. In real-world systems, the energy per operation (like writing, erasing, storing) is many orders of magnitude higher due to engineering inefficiencies.
  3. The principle "information is physical" is true, but the thermodynamic costs of information processing at the fundamental level are negligible compared to the energy costs of running actual hardware (like spinning disks, cooling, etc.).

