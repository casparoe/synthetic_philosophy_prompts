prompt: |-
  In my seminar on twentieth-century pragmatism I run an exercise in extrapolating Rorty rather than memorizing him, and this year's version has hit a snag I would like you to work through. I have catalogued his verdicts across his writings: ordinary claims about middle-sized objects are true, and the common-sense realist is right, but the philosopher's gloss that the world makes them true adds nothing intelligible; on electrons he refuses both the realist and the antirealist verdict, treating the question of whether unobservables exist independently of our descriptions as a pseudo-question; whole vocabularies — Homeric religion, Aristotelian physics — are not true or false but better or worse instruments, and their replacement is better described as supersession than as refutation; claims on which our whole culture converges, such as that there are no unicorns, are flat-out true; that cruelty is the worst thing we do is true, but no more objective than a ranking of Keats above Shelley, and moral progress is to be achieved by sentimental education — novels rather than arguments — not by discovering moral facts; and rights are a splendid tool, not a fact about rational human nature, so the attempt to ground them in reason is a mistake. Two new cases have now come before the tribunal. Case A: had the defenders of slavery won everywhere and persuaded every later generation that slavery was permissible, the claim that slavery is wrong would still have been true. Case B: a claim our own community is currently split over — say, that it is wrong to eat animals. What I want is, first, a predicted verdict on each case; second, an inventory of the candidate rules that fit his track record — I can discern at least a vocabulary-relativist rule, a normal-discourse rule, and a sentiment-grounding rule, and there may be others — together with what each predicts on A and B; and third, a best guess on each, with your reasons for preferring one rule over its rivals. Since A and B may not by themselves separate the rules, please also tell me what further case, however exotic, would discriminate between them most cleanly.
reasoning: |-
  Hmm, the user is running a seminar on twentieth-century pragmatism and needs help extrapolating Rorty's views on two new cases. This requires deep engagement with Rorty's philosophy rather than just memorization. The user has cataloged Rorty's key positions: he endorses common-sense realism about everyday objects but rejects philosophical glosses about "the world making them true"; he considers questions about unobservables like electrons pseudo-questions; he views vocabularies as tools to be superseded rather than refuted; he accepts cultural convergence claims as true; he sees morality as sentiment-based with progress through education rather than moral facts; and he treats rights as tools rather than discoveries of rational nature.

  Now two new cases need analysis: Case A asks whether "slavery is wrong" would remain true even if slavery defenders had universally persuaded future generations. Case B concerns a culturally contested claim like "it is wrong to eat animals."

  The user wants three things: predicted Rorty verdicts on A and B; an inventory of candidate rules fitting his track record; and a best guess with reasoning. They also want a hypothetical case to distinguish between rules if needed.

  First, I need to identify candidate rules from Rorty's positions. The vocabulary-relativist rule would treat truth as framework-dependent. The normal-discourse rule would follow culturally settled claims. The sentiment-grounding rule would root morality in contingent human feelings. There might also be a solidarity rule emphasizing community values.

  For Case A: Vocabulary-relativism would say "slavery is wrong" loses truth-value if slavery becomes universally accepted. Normal-discourse would deny its truth under universal acceptance. Sentiment-grounding might preserve some truth based on inherent sentiment, but Rorty rejects this. So all rules likely predict Rorty would say it's not true if universally accepted.

  For Case B: Vocabulary-relativism says no truth-value until consensus. Normal-discourse says no current truth-value. Sentiment-grounding might see it as expressing sentiment without objectivity. All rules align in predicting no objective truth but practical discussion value.

  The solidarity rule might differ slightly by prioritizing community cohesion over individual sentiment, but Rorty's anti-foundationalism makes this a minor variant. To distinguish rules, I could propose a case where sentiment conflicts with consensus, but Rorty would likely privilege actual community practices over hypothetical sentiments. So the rules largely converge here.

  Best guesses: For A, Rorty would deny the claim remains true, as truth requires social justification. For B, he'd see it as unsettled sentiment needing education. The solidarity rule seems most consistent with his emphasis on community and avoiding metaphysics.

  A discriminating case could involve a future society that abandons a moral value we hold dear, testing whether Rorty sees truth as permanently lost or potentially rediscoverable. His historicism suggests permanent loss, favoring vocabulary-relativism over any latent realism.
answer: |-
  Based on Rorty's cataloged positions and his anti-representationalist, anti-foundationalist pragmatism, here's the extrapolation for Cases A and B, the candidate rules, predictions, best guesses, and a discriminating case:

  **Predicted Verdicts:**
  1.  **Case A (Slavery):** Rorty would **reject** the claim that "slavery is wrong" would still be true if universally accepted. Truth, for Rorty, is a property of sentences within a contingent vocabulary, made true by justification within a community's current practices and beliefs, not by correspondence to a mind-independent moral reality. A world where slavery was universally and perpetually justified *is* a world where "slavery is wrong" lacks truth-value or is false within that dominant vocabulary.
  2.  **Case B (Eating Animals):** Rorty would say there **is no current truth of the matter** about "it is wrong to eat animals." Since the community is split, there is no settled justification within our normal discourse. The claim isn't "true" or "false" in an objective sense; it's a live topic for persuasion, negotiation, and potential future consensus-building through sentimental education (e.g., powerful narratives about animal suffering).

  **Candidate Rules & Their Predictions:**

  1.  **Vocabulary-Relativist Rule:**
      *   **Core Idea:** Truth is *always* relative to a contingent vocabulary/framework of description. Vocabularies are tools, not pictures of reality. Truth claims only make sense *within* an accepted vocabulary.
      *   **Fit with Track Record:** Explains electrons (no framework-independent answer), superseded vocabularies (Homer, Aristotle - truth not applicable), common-sense objects (true within our *current* normal vocabulary), moral claims like cruelty (true within *our* liberal vocabulary due to sentiment/convergence), rights (useful tool within *our* vocabulary, not grounded in reason/reality).
      *   **Prediction A:** False. In the hypothetical universal pro-slavery vocabulary, "slavery is wrong" is either meaningless or false. It cannot be "true" outside *any* vocabulary.
      *   **Prediction B:** Neither true nor false. The claim exists within a contested space *between* vocabularies (e.g., traditional human-centric vs. expanded sentience-centric). Until one vocabulary achieves dominance (or a new hybrid emerges), there's no framework to confer "truth" on the claim.

  2.  **Normal-Discourse Rule:**
      *   **Core Idea:** Truth is what is justified within the current, normal discourse of a relevant community ("us") – what "we" can defend to each other using our shared standards. It's about social practice, not metaphysical grounding.
      *   **Fit with Track Record:** Explains common-sense objects (justified in normal discourse), unicorns (convergence in normal discourse), electrons (the question pushes *beyond* normal discourse justification into pseudo-metaphysics), superseded vocabularies (no longer part of *our* normal discourse, so their truth-claims are inert), moral claims (true *only* because they are solidly justified *within our current normal discourse* due to sentiment/history), rights (tools justified *within* our discourse, seeking "grounding" is trying to step outside discourse).
      *   **Prediction A:** False. In the scenario, the claim "slavery is wrong" is *not* justifiable within the *actual* normal discourse of that world's community. Its truth depends on being justifiable *now* to *us* (or them), not timelessly.
      *   **Prediction B:** Neither true nor false. The claim lacks sufficient justification within the *current* normal discourse due to the split. It's a candidate for future discourse, not a present truth.

  3.  **Sentiment-Grounding Rule (for Moral Claims):**
      *   **Core Idea:** The "truth" of moral claims is solely a function of widespread, stable human sentiment within a community. Moral progress comes from expanding sympathy (sentimental education), not discovering facts. Moral claims express our feelings, not reality.
      *   **Fit with Track Record:** Directly explains the cruelty claim and moral progress mechanism. Compatible with vocab-relativism and normal-discourse for moral claims (sentiment provides the justification within the discourse/vocabulary). Explains why moral claims lack "objective" grounding but can still be "true for us."
      *   **Prediction A:** False. Universal acceptance of slavery implies universal sentiment permitting it. The sentiment *against* slavery doesn't exist in that world, so "slavery is wrong" lacks the necessary sentimental grounding to be true *there*.
      *   **Prediction B:** Neither true nor false. Sentiment is divided. The claim expresses a sentiment held by some, but lacks the widespread, stable consensus needed to call it "true" within the community.

  4.  **Solidarity Rule (A Synthesis/Optimization):**
      *   **Core Idea:** Truth (especially moral/political truth) is about solidarity – agreement within "we" liberals (or our historical successor community) achieved through persuasion and expanding the "we" via sympathy. It prioritizes the practical project of building inclusive community over metaphysical questions of correspondence.
      *   **Fit with Track Record:** Captures the social justificatory aspect of normal-discourse, the role of sentiment/sympathy in creating agreement, and the vocabulary-relativist view that this is our best tool. Explains why "cruelty is worst" is "true" (it fosters *our* solidarity), why grounding rights is a mistake (solidarity, not reason, is the basis), why superseded vocabularies aren't false (they fostered *their* solidarity), and why consensus claims (unicorns) are true (undisputed solidarity).
      *   **Prediction A:** False. The claim "slavery is wrong" requires solidarity *against* slavery. A world universally pro-slavery has solidarity *for* slavery. The claim isn't "true" in the abstract; truth requires being embedded in a solidarity-project that rejects slavery.
      *   **Prediction B:** Neither true nor false. Solidarity is fractured on this issue. The claim represents an attempt to build solidarity around a particular view of animal treatment, but it hasn't yet succeeded.

  **Best Guesses & Reasoning:**

  *   **Case A (Slavery):** **Reject the claim (Not True).** All rules converge on this prediction. Rorty consistently rejects any notion of truth transcending human justification, practice, vocabulary, sentiment, or solidarity. The hypothetical directly contradicts the core pragmatist tenet that truth is made, not found. Insisting slavery would still be "wrong" in that world smuggles in the representationalism and moral realism Rorty explicitly denies. *Reasoning:* The Vocabulary-Relativist and Normal-Discourse rules most directly attack the metaphysical presupposition of mind-independent moral truth. The Sentiment-Grounding and Solidarity rules emphasize the complete lack of the necessary human elements (sentiment, agreement, solidarity) in the scenario. **Preferred Rule:** Vocabulary-Relativist or Normal-Discourse. They most cleanly capture Rorty's fundamental rejection of the "gloss" that the world makes sentences true independently of us.

  *   **Case B (Eating Animals):** **No Truth of the Matter.** All rules also converge here. Rorty sees unsettled questions, especially moral ones, as arenas for persuasion, not domains where pre-existing truth lies hidden waiting to be discovered. The split signifies the absence of the justification, sentiment, or solidarity required for truth-ascription. *Reasoning:* The Normal-Discourse rule is the most straightforward: no consensus in current discourse means no truth-value. The Sentiment-Grounding rule highlights the lack of settled sentiment. The Solidarity rule emphasizes the fractured community. The Vocabulary-Relativist rule sees it as a clash between emerging/incompatible descriptive frameworks. **Preferred Rule:** **Normal-Discourse Rule.** It best captures Rorty's core definition of truth as warranted assertibility within a community's practices. The split community directly signifies the lack of warrant. Sentiment-Grounding and Solidarity are crucial *explanations* for *how* moral consensus forms within normal discourse, but Normal-Discourse provides the most general and fundamental criterion for truth-ascription applicable beyond just morals (e.g., unicorns, common-sense objects).

  **Discriminating Case:**

  While the rules largely converge on A and B, a case distinguishing the **Vocabulary-Relativist Rule** from the **Sentiment-Grounding/Solidarity Rules** (which are closely linked) would involve **a future society abandoning a deeply held current moral truth *without* a loss of the underlying sentiment or solidarity, but due to a radical shift in practical needs/descriptions.**

  *   **Case C (Future Water Ethics):** Imagine a future where severe, irreversible global desertification forces humanity into rigidly enforced water rationing for survival. A near-universal consensus emerges that "individual ownership/hoarding of significant water resources is profoundly immoral," justified not primarily by expanded sympathy for the thirsty (though that exists), but by the absolute, non-negotiable imperative of species survival framed in starkly utilitarian or even quasi-biological terms ("water-hoarding genes must be suppressed"). Our current liberal individualist vocabulary around property rights is explicitly rejected as dangerously obsolete and incompatible with existence. Crucially, the sentiment *underlying* our current belief in some individual property rights (e.g., fairness, reward for effort, personal security) is *not* lost but is consciously overridden and deemed secondary to collective survival.

  *   **Discrimination:**
      *   **Vocabulary-Relativist Rule:** Would say our claim "individuals have a right to own significant water resources" is **not true** within the future's survivalist vocabulary. Its truth was always relative to our past abundance-based vocabulary. The persistence of underlying sentiments is irrelevant to truth-value, which is vocabulary-bound.
      *   **Sentiment-Grounding Rule:** Would potentially be **strained**. If the core sentiments (fairness, reward) still exist but are overridden, is our property claim *still* "true" in some latent sense? Or is the dominant survivalist sentiment now the grounding? This rule struggles with conflicting sentiments within a community.
      *   **Solidarity Rule:** Would clearly say the claim is **not true** because solidarity now exists around the survivalist imperative, overriding previous liberal solidarity. Solidarity defines the "we" and its truths.
      *   **Normal-Discourse Rule:** Would clearly say the claim is **not true** because it is unjustifiable (indeed, anathema) within the future community's normal discourse.

  *   **Why it Discriminates:** Case C isolates the role of vocabulary vs. sentiment/solidarity. The Vocabulary-Relativist view treats the shift purely as a change in useful description, making past claims false *now* regardless of lingering sentiments. The Sentiment-Grounding view gets muddled if sentiments conflict or are suppressed but not eliminated. The Solidarity view cleanly follows the *actual* agreement, even if motivated by survival rather than pure sympathy. **Case C most cleanly favors the Vocabulary-Relativist Rule** by showing that truth-ascription can shift dramatically due to a change in dominant description/practical need, even *without* a necessary change in the *underlying palette* of human sentiment. The Normal-Discourse rule aligns with Vocabulary-Relativism here, as the discourse embodies the new vocabulary. Sentiment-Grounding and Solidarity struggle slightly more with the persistence of the "old" sentiments being actively suppressed. This highlights Rorty's prioritization of linguistic practice ("vocabulary") as the primary vehicle for truth.
