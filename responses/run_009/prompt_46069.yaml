  The friendship variant is tricky. The initial mistake was corrected, and now everything is genuine. If Rule B requires no delusion at all, even in the past, it might still be contaminated. But if she values the current organic whole, it could be valuable. Her emphasis on the mutual affection being more than the sum of parts suggests she focuses on the current state of appreciation and real virtues.

  For the painting case, if Rule A, it has value; Rule B, no value. But in the collector case, the object wasn't valuable, whereas here the painting is sublime. Also, the appreciation is fitting despite the false belief. So maybe Rule A fits better because the object is real and appreciation fits, regardless of belief.

