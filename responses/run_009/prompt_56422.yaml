prompt: |-
  Hey, so — you're a professional philosopher with a strong economics background, and I want you to think carefully about a pattern I keep running into. Do some brainstorming up front, list the candidate concepts before you commit, don't just fire back the first label that comes to mind.

  Some context on me: I teach political philosophy, and every time I prep a lecture on competition I keep seeing the same shape in totally different settings, and I can't tell whether it's one phenomenon or several. I'll describe it, and then I want to know whether the thing, as carved exactly along the lines I describe, has an established name in the literature. If yes, tell me what it is and how it differs from the neighboring concepts it keeps getting confused with. If nothing established fits cleanly, say so, coin a term, and defend the boundary. I'm not going to be satisfied with a bare name — I want to know what exactly the phenomenon is, what it isn't, and where the edges are.

  The pattern: a bunch of actors compete for something, but the prize doesn't get any bigger no matter how hard they compete, and the competing itself is costly. So all the extra effort mostly cancels out. Everyone would be better off if everyone had stopped at the starting line — but no one can stop alone.

  Concrete-ish instances:

  - Two rival shops on the same street keep extending their opening hours, each afraid the other will stay open later. Customers split roughly the same as before, both owners are now exausted and paying more wages, and the total business on the street hasn't grown at all.
  - An academic job market with a fixed number of jobs. Candidates respond with more publications, more postdocs, more teaching experience, and the "winners" arrive at the same jobs ten years later than they used to, with less of a life left over.
  - Peacocks. The total number of mates is fixed by things like food supply, so the tails don't catch more females in aggregate; each male's tail just has to be longer than the next guy's.

  Now, here's what makes me doubt it's just an "arms race" or a "tragedy of the commons," and this is the part I most want you to get right. In the commons story there is a shared resource that the actors jointly use up. In my pattern there is often no resource being depleted at all — the waste is the effort itself. The prize is fixed (or shrinking), and the competing eats it. And sometimes it goes one step further and gets genuinely ugly: the competing destroys the value of the very thing being competed for. So many advertisers shout that nobody believes advertising anymore; everyone's CV is padded to the gills so credentials stop signaling anything. In those cases the winner ends up holding something worth less than what it cost to win it — the prize didn't just fail to grow, the race consumed it.

  I also want the phenomenon kept apart from races that are actually productive, like firms racing to be first at some invention, where the racing itself produces knowledge. In my pattern the racing produces nothing but the racing.

  I know the folk terms — "keeping up with the Joneses," "rat race" — and I half-remember something in the rent-seeking literature about competition for a prize burning up the prize's value, but I can't tell wether that's the same thing as what I'm pointing at or only one piece of it, since in my pattern nobody needs to be seeking anything illicit, the shops are just shops. Please sort out which of these (folk, evolutionary, economic, whatever) are genuinely the same phenomenon and which only look like it, and give me the boundary cases: where exactly does my pattern stop, e.g. what happens when the prize isn't quite fixed but grows a little with effort — is that inside or outside, and why?
reasoning: |-
  Okay, the user teaches political philosophy and has noticed a recurring pattern in competitive scenarios. They described situations where competition doesn't increase the prize but wastes resources, sometimes even devaluing the prize itself. They mentioned examples like rival shops extending hours, academic job markets, and peacock tails. 

  The user wants to know if this pattern has an established name in literature. They specifically want to differentiate it from concepts like tragedy of the commons or arms races. The key distinctions are: no shared resource depletion, the prize is fixed, and effort is wasted. Plus, in some cases, the competition destroys the prize's value.

  First, I need to recall relevant economic and philosophical concepts. Rent-seeking comes to mind—when competitors expend resources to capture a fixed prize, like lobbying for monopolies. Tullock's work on rent-seeking mentions that resources spent on competing can dissipate the rent. But rent-seeking usually involves artificial rents created by policy, not natural competition. The user's shop example doesn't involve policy, so maybe it's broader.

  Then there's positional goods, introduced by Hirsch. Goods whose value depends on relative position, like status items. Competing for these can lead to wasteful expenditure because the rank matters, not absolute value. The academic job market fits here—jobs are positional because only relative standing matters.

  Evolutionary biology has the Red Queen principle, where species must constantly adapt just to maintain relative position. The peacock example aligns here; longer tails are needed to stay competitive, but overall mating success doesn't improve. However, this is more about continuous adaptation rather than resource waste in a fixed competition.

  The user also mentioned cases where the prize's value is destroyed by competition, like advertising noise making ads ineffective or credential inflation. This seems like an escalation where the signal loses meaning. That's the destructive aspect. 

  I need to check if existing terms cover all aspects. Rent-seeking often involves policy, but the user's shop example is a natural market. Positional goods focus on relativity but not necessarily the destruction of value. The Red Queen is more about survival in changing environments. 

  The concept of dissipative competition might be the best fit. It's when resources used in competing reduce the net value of the prize. The key elements: fixed prize, costly effort, mutual detriment, and potential devaluation. 

  But is there a single term? The user wants precision. Maybe "positional arms races with dissipation" or "zero-sum status competitions." Coining a term like "cancellative competition" could work, emphasizing the net zero outcome. But existing terms like "rent dissipation" from economics might be closest, though it's usually tied to rent-seeking. 

  Boundary cases: if the prize grows with effort but not enough to cover costs, it's still wasteful but not purely fixed. That's a gray area. Also, when competition generates positive externalities, like innovation races, it's outside the pattern. 

  The user’s deeper need is clarity for teaching. They want to accurately label this phenomenon and distinguish it from similar concepts. They might also be interested in the ethical implications in political philosophy, like how such competitions affect societal welfare and policy solutions. Ensuring the term encompasses both economic and social examples without overgeneralizing is crucial. 

  So, synthesizing: the core is fixed-prize competitions where effort is wasted and may devalue the prize. Rent dissipation in a broad sense, but positional competition with dissipative losses covers it better. The term "dissipative competition" as a synthesis, with clear boundaries on when it applies versus productive competitions or resource depletion scenarios.
answer: |-
  Based on your precise description and boundary requirements, the pattern you've identified **does not have a single, perfectly established name** in the literature. It's a specific, recurring *configuration* that draws elements from several concepts but carves reality at a distinct joint. Here's the breakdown:

  **Candidate Concepts & Why They Don't Fully Fit:**

  1.  **Rent-Seeking/Rent Dissipation:**
      *   **Proximity:** Very close, especially regarding the "prize doesn't grow, effort is costly, net loss" aspect. Gordon Tullock's work on the cost of transferring rents (e.g., lobbying for monopoly privileges) highlights how resources spent competing can dissipate the value of the rent. Your "prize consumed" case (advertising noise, credential inflation) fits well here.
      *   **Boundary Problem:** Traditional rent-seeking focuses on *artificially created rents* (via regulation, monopoly grants, etc.) and competition to capture them. Your shop and peacock examples involve competition for *naturally occurring scarcity* or *inherently positional goods* without necessarily requiring artificial rent creation. "Rent-seeking" often carries a normative connotation of seeking unearned income via policy manipulation, which doesn't cleanly apply to the shops or peacocks. The *fixed prize* aspect is core, but the *source* of the fixed prize matters.

  2.  **Positional Goods/Competition (Fred Hirsch):**
      *   **Proximity:** Hirsch's concept is crucial. Positional goods are those whose value depends on *relative position/rank* (e.g., a top-ranked job, a house in the best neighborhood, status). Competition for them is inherently zero-sum – if everyone gets "better," no one gains relatively. Your academic job and peacock examples are paradigmatic positional competition.
      *   **Boundary Problem:** Hirsch focuses on the *nature of the good* (its value is relative). Your pattern focuses on the *dynamics of competition* for a fixed prize, which *can be* a positional good (job, mate) but *doesn't have to be* inherently positional in Hirsch's sense. The shops compete for a largely fixed *absolute* customer pool/income stream, not inherently for relative status. The core of your pattern is the *fixed size of the prize*, regardless of whether its *value* is absolute or relative. Also, Hirsch doesn't heavily emphasize the *destruction of value through competition* itself (e.g., advertising noise).

  3.  **Arms Race:**
      *   **Proximity:** Captures the mutually reinforcing escalation and the potential for waste.
      *   **Boundary Problem:** Arms races (biological or geopolitical) often involve *dynamic* threats and *potential* for destruction/dominance, not just competition for a fixed, static prize. They can sometimes lead to innovation (counter to your requirement). The "fixed prize" and "effort itself is the primary waste" aspects aren't central.

  4.  **Tragedy of the Commons (Hardin):**
      *   **Proximity:** Highlights the individual incentive vs. collective detriment structure ("no one can stop alone").
      *   **Boundary Problem:** As you correctly note, ToC relies on a *rivalrous, depletable common-pool resource*. Your pattern involves competition for a *fixed, non-depletable prize* (or even a prize whose *value* is eroded by the competition itself). The waste comes from input costs (effort, wages, time), not output depletion.

  5.  **Red Queen Effect (Evolutionary Biology - Van Valen):**
      *   **Proximity:** "It takes all the running you can do, to keep in the same place." Perfectly captures the constant effort for no *relative* gain. Peacocks are a textbook example.
      *   **Boundary Problem:** Primarily an evolutionary/biological concept focused on survival/adaptation in a co-evolving system. While applicable to the peacocks, it feels less natural for the shops or academics, and doesn't explicitly cover the *destruction* *of the prize's value* aspect. It emphasizes *maintaining position* rather than competing for a *fixed prize* where effort is pure waste.

  6.  **Rat Race / Keeping Up with the Joneses:**
      *   **Proximity:** Folk terms capturing the social pressure, wasted effort, and lack of net gain. "Joneses" hints at positional competition.
      *   **Boundary Problem:** Vague, colloquial, and often focus on subjective well-being/social pressure rather than the core economic/structural logic of a fixed prize and costly competition. Lack analytical precision.

  **The Synthesis: Dissipative Competition for a Fixed Prize**

  Your pattern cleanly combines two core elements:
  1.  **Competition for a Fixed Prize:** The total quantity or value of the desired outcome is exogenously fixed or grows much slower than the costs of competition (e.g., number of jobs, total customer spending on the street, number of mates).
  2.  **Dissipation:** Resources (time, energy, money, well-being) expended in the competitive process represent a net social (and often individual) loss. Crucially, this effort:
      *   **a)** Is primarily aimed at securing a larger *share* of the fixed prize, not increasing the total prize.
      *   **b)** Often escalates to the point where it significantly erodes or even destroys the *value* of the prize itself (credential inflation, advertising skepticism).

  **Proposed Term: Dissipative Competition for a Fixed Prize (DCFP)**

  *   **Why this term?**
      *   **Dissipative:** Directly names the key mechanism – resources are dissipated (wasted) in the process.
      *   **Competition:** Core activity.
      *   **For a Fixed Prize:** The essential structural constraint that defines the scenario and drives the dissipation. "Fixed" implies no significant increase proportional to effort.

  *   **Defining Boundaries:**
      *   **Core Phenomenon:** Competition where the aggregate effort expended by participants significantly reduces the net value obtained from a prize whose total size/value is largely invariant to the level of competitive effort.
      *   **Inside the Boundary:**
          *   Fixed total prize (jobs, mates, fixed customer pool).
          *   Prize size grows very slowly relative to cost of competition (e.g., advertising spending grows market size minimally but costs explode).
          *   Competition generates little/no positive externalities (e.g., no useful innovation spillovers from the shop hours race).
          *   The competitive effort itself directly erodes the prize's value (credential inflation, ad noise).
      *   **Outside the Boundary:**
          *   **Tragedy of the Commons:** Depletion of a common resource occurs. (Outside: Overfishing). (Inside: Shops – customers aren't depleted; effort/costs are wasted.
          *   **Productive Races:** Competition generates significant positive externalities or increases the total prize. (Outside: R&D race for a new drug – knowledge created even for losers, market might expand). (Inside: Academic publishing race – minimal new *valuable* knowledge per marginal paper, jobs fixed).
          *   **Pure Positional Competition w/o Dissipation:** If everyone *could* magically coordinate to low effort *without* changing relative ranks, and the prize retains value (rare). DCFP focuses on the *inevitable costly effort*.
          *   **Simple Monopoly/Scarcity Rents:** If a firm has a monopoly with no competition, the rent isn't dissipated. DCFP requires active, costly competition *among* rivals.
          *   **Prize Grows Proportionally:** If doubling effort reliably doubles the total prize (e.g., competitive markets expanding the pie), dissipation is minimal. The *degree* of prize growth relative to cost escalation determines if it's inside/outside (e.g., if prize grows 10% but costs grow 50%, it's leaning inside DCFP territory).

  *   **Differentiating from Rent Dissipation:**
      *   DCFP **subsumes** rent dissipation as a special case. All rent dissipation is DCFP, but not vice-versa.
      *   Rent dissipation specifically concerns competition for *artificially created rents* (e.g., licenses, tariffs).
      *   DCFP applies broadly to competition for *any* fixed prize, whether artificially created (rents) or naturally occurring (inherently scarce jobs, mates, fixed-location customers) or socially constructed position (status). The shops competing for a natural local monopoly on customer time/attention is DCFP, not necessarily rent-seeking.

  *   **Differentiating from Positional Competition:**
      *   DCFP **requires** positional competition as a key driver (relative rank matters for claiming the fixed prize).
      *   However, DCFP adds the critical dimension of *resource dissipation* and *potential prize devaluation* due to the competitive effort itself. Positional competition describes the *nature of the good*; DCFP describes the *dynamic process and its wasteful consequences*.

  *   **Why "Dissipative Competition" Alone Isn't Enough:**
      *   "Dissipative Competition" could be misinterpreted as any competition with waste (e.g., duopolists engaging in wasteful advertising that *does* expand the market somewhat, but inefficiently). The **Fixed Prize** element is crucial for the "all effort mostly cancels out" and "everyone better off stopping at the start line" logic. It prevents the concept from being diluted.

  **Conclusion:**

  Your pattern is a robust and distinct phenomenon. While elements of rent dissipation, positional competition, the Red Queen effect, and arms races are present, **no single established term captures its precise configuration: costly competition for a prize invariant to effort, leading to net loss and potential prize devaluation.** Coining **Dissipative Competition for a Fixed Prize (DCFP)** provides the necessary precision. Its boundaries are clear: the fixed (or minimally growing) prize is the linchpin distinguishing it from productive races and tragedies of depletion, while the focus on dissipative effort distinguishes it from pure analyses of positionality or rent creation. This term effectively isolates the structural trap where competition becomes primarily self-canceling waste.
