answer: |-
  ### Brainstorming Diagnostic Cases  
  The challenge is identifying cases that force *discriminating commitments*, not just illustrate positions. Key criteria:  
  1. **Vagueness Sensitivity**: Cases where composition seems to "fade in/out" (e.g., sandpile assembly) test whether composition admits degrees or sharp boundaries.  
  2. **Spatiotemporal vs. Functional Unity**: A crowd moving together tests if causal coordination alone suffices, beyond mere proximity (like cards on a table).  
  3. **Parthood Hierarchies**: The cat/tail case probes whether composition is transitive or if "composite" is a primitive layer (do we compose tails *and then* cats, or just cats?).  
  4. **Extreme Discontinuity**: Scattered atoms across galaxies stress-test universalism’s limits.  
  5. **Identity Through Change**: The Ship of Theseus evaluates if composition depends on persistence conditions or just momentary arrangement.  
  6. **Contact vs. Bonding**: Hand-desk contact distinguishes mereology from physics-based views.  
  7. **Added Case: Statue/Lump of Clay**: Separates *constitution* views (one object "constituted by" another with different persistence) from strict composition views. *Splits:* Brutalists (no general rule) vs. Conventionalists (composition is contextual) vs. Universalists (both statue and lump exist).  

  ---

  ### Decision Tree: "When Do Parts Compose a Whole?"  
  *Answer each question based on your intuitive judgment of whether a genuine composite object exists in the scenario.*  

  #### Node 1: **Atoms in Andromeda**  
  *Two hydrogen atoms—one on Earth, one in the Andromeda galaxy—are causally disconnected. Do they compose an object?*  
  - **Yes** → Proceed to Node 2.  
  - **No** → Proceed to Node 3.  

  #### Node 2: **Scattered Cards**  
  *A deck of 52 cards is shuffled and spread randomly across a table. Do they compose an object?*  
  - **Yes** → **You lean toward UNIVERSALISM**. (Every collection composes an object.)  
  - **No** → Proceed to Node 4.  

  #### Node 3: **Cat and Its Tail**  
  *A healthy cat is sleeping. Do the cells of its tail (excluding the rest of the cat) compose a distinct object—"the tail"?*  
  - **Yes** → Proceed to Node 5.  
  - **No** → **You lean toward NIHILISM**. (Only simple particles exist; no composites like cats or tables.)  

  #### Node 4: **Half-Built Sandpile**  
  *Sand grains are being poured into a pile. At 10,000 grains, it’s clearly a pile. At 10 grains, it’s not. At 100 grains, does this collection compose an object?*  
  - **Yes, definitely** → Proceed to Node 6.  
  - **It’s vague/context-dependent** → Proceed to Node 7.  
  - **No, not yet** → Proceed to Node 8.  

  #### Node 5: **Crowd at a Crosswalk**  
  *A crowd waits at a red light. When the light turns green, they simultaneously step into the crosswalk in unison. While moving together, do they compose a single object?*  
  - **Yes** → **You lean toward FUNCTIONAL UNITY RESTRICTION**. (Composites require integrated behavior.)  
  - **No** → **You lean toward ORGANICISM**. (Only living organisms compose wholes.)  

  #### Node 6: **Hand on Desk**  
  *Your palm rests flat on a wooden desk. Do your hand and the desk compose a new object?*  
  - **Yes** → **UNIVERSALISM** (confirms Node 2 was a fluke; you accept even arbitrary contact).  
  - **No** → Proceed to Node 9.  

  #### Node 7: **Ship of Theseus Rebuilt**  
  *A ship’s planks are gradually replaced in a new harbor. After 50% replacement, is it still the same ship?*  
  - **Yes** → **BRUTAL COMPOSITION** (No general rule; composition is primitive and case-specific).  
  - **No** → **CONVENTIONALISM** (Composition depends on human practices/naming).  

  #### Node 8: **Stacked Cards**  
  *The 52 cards are neatly stacked into a deck. Do they compose an object?*  
  - **Yes** → **You lean toward MEREOLOGICAL RESTRICTION (NON-ORGANIC)**. (Composition requires specific spatial organization.)  
  - **No** → **NIHILISM** (confirms Node 3; you reject even organized composites).  

  #### Node 9: **Statue and Clay**  
  *A sculptor shapes a lump of clay into a statue. Is the statue a distinct object from the lump?*  
  - **Yes** → **CONSTITUTION VIEW** (Not a leaf in standard SCQ, but closest to conventionalism).  
  - **No** → **MEREOLOGICAL RESTRICTION (NON-ORGANIC)**. (Only the lump exists; "statue" is a description.)  

  ---

  ### Unoccupied Regions & Blind Spots  
  1. **"Always except organisms" (Yes to stacked cards, no to cat tail)**  
     - *Why vacant?* Incoherent. If composition requires organization, organisms are maximally organized. No one denies cats but accepts decks.  
  2. **"Vague except for living things" (Vague for sandpile, definite no for crowd)**  
     - *Why vacant?* Unattractive. It arbitrarily privileges biology while accepting vagueness elsewhere.  
  3. **"Universal except for contact" (Yes to Andromeda atoms, no to hand-desk)**  
     - *Why vacant?* Unexplored. Discontinuity is universalism’s stressor; contact is trivial by comparison.  

  **Blind Spots**: The tree cannot distinguish:  
  - *Brutalism vs. Conventionalism* (both answer "vague" for sandpile, "no" for hand-desk).  
  - *Organicist Restriction vs. Strong Nihilism* (both say "no" to stacked cards).  

  ---

  ### Running Your Engineer's Instinct Through the Tree  
  Your view: *Composites are "user-defined types"—real if a rule makes them real, arbitrary-but-harmless if conventional.*  

  1. **Node 1 (Atoms in Andromeda)**: Likely **No**. Arbitrary scattered particles shouldn’t compose without a unifying rule.  
  2. **Node 2 (Scattered Cards)**: **No**. No rule binds random cards.  
  3. **Node 3 (Cat’s Tail)**: **Yes**. The tail has functional/structural unity (a "rule" for composition).  
  4. **Node 5 (Crowd Moving)**: **No**. Temporal coordination ≠ biological unity.  
  → **Leaf: ORGANICISM**.  

  **Why this might feel uncomfortable**: You likely reject the implication that *only* organisms exist as composites. Engineers accept tables, ships, and software systems as composites under functional rules—but organicism denies these. The tree exposes a tension: your "rule-based" view is broader than biology, but narrower than universalism. **Resolution**: Your instinct aligns closest with **FUNCTIONAL UNITY RESTRICTION** (a non-standard leaf between organicism and conventionalism), but the tree’s cases force you toward organicism due to rejecting the crowd. To capture your view, add: "Yes" at Node 5 (crowd) → **Functional Unity**. This position exists but lacks a common name.  

  ---

  **Final Note**: This tree prioritizes *discrimination* over exhaustiveness. Use it to flag inconsistencies in your intuitions—then revise your "rule" for composition iteratively, as you would a type signature. Metaphysics is property-based testing for reality.
