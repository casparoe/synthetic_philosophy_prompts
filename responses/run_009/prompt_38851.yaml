answer: |-
  ### Response to Query: Pedagogical Example for Good's Theorem Failure  

  **Role Assumption:** As a professional philosopher and decision theorist, I approach this by first recalling Good's (1967) core argument. The theorem states that for a Bayesian expected-utility maximizer with fixed preferences, a fixed set of acts, and no strategic interactions, the expected utility (EU) of an optimal act cannot decrease after costless observation. Formally, if \(\mathcal{E}\) is new evidence and \(a^*\) is the pre-observation optimal act, then \(\text{EU}(a^* | \mathcal{E}) \geq \text{EU}(a^*)\). The failure modes arise when we relax its idealizations. Below, I begin with a brainstorm of four scenarios, then develop a concrete example.  

  ---

  ### **Brainstorm: Failure Modes of Good's Theorem**  
  1. **Adversarial Signaling (e.g., negotiations, poker)**  
     *Setup:* An agent's act of acquiring information reveals their intentions to an opponent, who then exploits this.  
     *Violation:* The "no signaling to others" assumption—information acquisition alters another agent's beliefs/actions.  

  2. **Information-Induced Option Changes (e.g., medical testing)**  
     *Setup:* Learning information changes the available acts (e.g., a positive test forces costly treatment).  
     *Violation:* The "fixed action set" assumption—options depend on the information state.  

  3. **Non-Bayesian Updating (e.g., cognitive biases)**  
     *Setup:* An agent misupdates priors (e.g., base-rate neglect) after observing data.  
     *Violation:* The "Bayesian updating" assumption—posterior probabilities diverge from Bayes' rule.  

  4. **Preference Instability (e.g., temptation or regret)**  
     *Setup:* Information alters the agent's utility function (e.g., learning a fact induces envy).  
     *Violation:* The "fixed preferences" assumption—utilities are state-dependent.  

  I select **Adversarial Signaling** as the most promising, as it is intuitive, violates a precise assumption, and has real-world parallels without requiring exotic preferences or non-Bayesian mechanics.  

  ---

  ### **Worked Example: Harmful Information in a Signaling Game**  
  **Scenario:** A buyer (B) negotiates with a seller (S) over an antique vase. B’s private valuation is uncertain, and S sets the price after observing whether B conducts a costly appraisal. Crucially, B’s decision to appraise signals their valuation to S, who then price-discriminates.  

  #### **Agents, States, Acts, and Payoffs**  
  - **Agents:**  
    - Buyer (B): Bayesian expected-utility maximizer.  
    - Seller (S): Strategic adversary; sets price after observing B’s appraisal choice.  
  - **States of the world \(\omega\):**  
    - Vase is High-value (\(H\): worth $100 to B) or Low-value (\(L\): worth $20 to B).  
    - Prior: \(P(H) = P(L) = 0.5\) (B’s initial belief).  
  - **Acts for B:**  
    - \(a_{\text{app}}\): Seek costless appraisal (reveals true state \(\omega\)).  
    - \(a_{\text{no}}\): Do not seek appraisal.  
  - **Acts for S:**  
    - Set price \(p\) after observing B’s choice (\(a_{\text{app}}\) or \(a_{\text{no}}\)).  
    - S’s strategy: Charge \(p = 80\) if B chooses \(a_{\text{app}}\); charge \(p = 60\) if B chooses \(a_{\text{no}}\).  
  - **Payoffs for B:**  
    - If B buys at price \(p\), payoff = \(\text{Value}(\omega) - p\).  
    - If B does not buy, payoff = \(0\).  
    - *Crucially, B must buy iff the price \(\leq \text{Value}(\omega)\)* (rational participation).  

  #### **Sequence and Information**  
  1. B chooses \(a_{\text{app}}\) or \(a_{\text{no}}\).  
  2. S observes B’s choice and sets \(p\) as above.  
  3. B learns \(\omega\) only if they chose \(a_{\text{app}}\); otherwise, they remain uncertain.  
  4. B decides to buy or not, given their knowledge.  

  #### **Expected Utility (EU) Calculations**  
  - **Case 1: B chooses \(a_{\text{no}}\) (no appraisal)**  
    - S charges \(p = 60\).  
    - B does not know \(\omega\), so calculates expected value:  
      \[
      \text{EU}(a_{\text{no}}) = 0.5 \times (100 - 60) + 0.5 \times (20 - 60) = 0.5 \times 40 + 0.5 \times (-40) = 0.
      \]  
    - B buys (since expected net gain \(\geq 0\)) and gets EU = \(0\).  

  - **Case 2: B chooses \(a_{\text{app}}\) (appraisal)**  
    - S charges \(p = 80\).  
    - B learns \(\omega\):  
      - If \(\omega = H\), payoff = \(100 - 80 = 20\).  
      - If \(\omega = L\), payoff = \(20 - 80 = -60\) → B does not buy, payoff = \(0\).  
    - Expected EU *ex ante* (before appraisal):  
      \[
      \text{EU}(a_{\text{app}}) = 0.5 \times 20 + 0.5 \times 0 = 10.
      \]  

  **Result:**  
  - \(\text{EU}(a_{\text{no}}) = 0\)  
  - \(\text{EU}(a_{\text{app}}) = 10\)  
  - *Appraisal increases EU from 0 to 10*. But this is not harmful! We need S to punish appraisal.  

  **Adversarial Adjustment:**  
  Revise S’s strategy to make \(a_{\text{app}}\) harmful:  
  - If B chooses \(a_{\text{app}}\), S infers B is likely high-value and charges \(p = 95\).  
  - If B chooses \(a_{\text{no}}\), S charges \(p = 50\).  

  Recalculate:  
  - **\(a_{\text{no}}\):**  
    - \(p = 50\), EU = \(0.5 \times (100-50) + 0.5 \times (20-50) = 25 - 15 = 10\).  
  - **\(a_{\text{app}}\):**  
    - \(p = 95\), B buys only if \(\omega = H\):  
      \[
      \text{EU} = 0.5 \times (100-95) + 0.5 \times 0 = 0.5 \times 5 = 2.5.
      \]  
  - **Outcome:** \(\text{EU}(a_{\text{app}}) = 2.5 < \text{EU}(a_{\text{no}}) = 10\) → Appraisal *lowers* EU by 7.5.  

  #### **Why This Violates Good's Theorem**  
  - **Violated Assumption:** *No signaling to others*. Good’s theorem assumes information acquisition does not alter other agents’ actions. Here, \(a_{\text{app}}\) signals B’s type to S, who then raises the price, creating a "cost" via strategic response.  
  - **Mechanism:** The act of acquiring information changes S’s beliefs, making the world adversarially responsive. B’s optimal pre-appraisal act (\(a_{\text{no}}\)) yields higher EU than post-appraisal adaptation.  

  #### **Contrived? Real-World Parallels**  
  - **Contrivance:** The example requires S to perfectly observe B’s choice and commit to a specific pricing rule. This is stylized but not exotic; similar mechanics appear in game theory (e.g., signaling games).  
  - **Real-World Relevance:**  
    - **Negotiations:** A homebuyer hiring an inspector signals high interest, leading the seller to raise the price (e.g., in opaque markets).  
    - **Algorithmic Pricing:** E-commerce algorithms track user research (e.g., repeated clicks), inferring high willingness-to-pay and increasing prices.  
    - **Intelligence Gathering:** A state surveilling an adversary may alert them, provoking preemptive aggression.  
    Structurally, any "strategic disclosure" scenario (e.g., job markets where resume polishing signals desperation) fits.  

  ---

  ### **Closing Reflection: The Status of Good's Slogan**  
  Good’s theorem remains a cornerstone of Bayesian decision theory, but its slogan—"information is always valuable"—collapses under modest relaxations. The caveats needed to rescue it (e.g., "assuming no adversarial signaling, fixed actions, and stable preferences") drain it of practical universality. In adversarial or competitive settings, information can be weaponized against the agent, turning "costless observation" into a liability.  

  Yet the theorem retains value as a *diagnostic tool*. When information appears harmful, we systematically check:  
  1. Is there signaling to others?  
  2. Did options or preferences change?  
  3. Was updating non-Bayesian?  
  This pinpoints which idealization failed, transforming the theorem from a platitude into a structured lens for analyzing decision pathologies. In teaching, I emphasize this diagnostic role: it trains students to map real-world deviations (e.g., in AI safety or economics) to theoretical foundations, revealing why information isn't free in a strategic universe.  

  ---  
  *References:*  
  - Good, I. J. (1967). On the Principle of Total Evidence. *British Journal for the Philosophy of Science*.  
  - Sandroni, A. & Copic, J. (2003). The Value of Information Under Unawareness. *JET*.  
  - Hirshleifer, J. (1971). The Private and Social Value of Information. *AER* (for adversarial extensions).
