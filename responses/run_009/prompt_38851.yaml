  - If no info and seller charges $60: Buyer buys → expected surplus = 0.5*($100-60) + 0.5*($20-60) = 0.5*40 + 0.5*(-40) = 0.  
  - If seek info: Buyer learns valuation. If high, buys at $95 → surplus $5; if low, doesn't buy → surplus 0. Expected surplus: 0.5*5 + 0.5*0 = $2.50.  
