  Hmm, their core tension is fascinating: if Singer-style ethics demands significant sacrifices for strangers, why does kidney donation feel optional yet get labeled "heroic"? And why does the hero label shift based on what others do? They're spot-on about the contrastive angle—it's like calling someone "tall" depends entirely on the crowd. 

  The user needs a sharp research proposal for a summer grant. Key points to hit: 
  First, precisely frame the question—is supererogation contrastive? Test if an act's "heroic" status changes solely based on others' behavior. 
  Second, show why standard theories (Urmson, Heyd) can't explain this, since they treat supererogation as intrinsic. 
  Third, design thought experiments (vignettes) where only the societal norm varies (e.g., blood donation rates during crises vs. peacetime). 
  Fourth, anticipate counterarguments—is this just about social expectations or "ought implies can"? 
  Finally, define failure clearly: if results reduce to predictability or demandingness, the contrastive theory collapses. 

  Gotta avoid kidney heroics in the proposal—stick to blood/organ donation examples neutrally. The user's self-awareness is refreshing; they're not seeking praise, just untangling a philosophical puzzle. Their irritation at the "hero" label is actually the perfect hook for the academic problem. 

  ...Also, their aside about possibly being "secretly terrible" is such a mood. Classic grad student existentialism.
answer: |-
  Here’s a focused, philosophy-forward research proposal draft based on your core insights. It avoids personal narrative and centers the conceptual problem and methodology.

  ---

  **Project Title:** The Contrastive Structure of Supererogation: Testing the Role of Behavioral Prevalence  

  **Research Question:**  
  Is the supererogatory status (i.e., "heroic," "beyond duty") of an action fundamentally *contrastive*, such that it depends not solely on the act’s intrinsic properties or the agent’s capacities, but on the *statistical prevalence* of similar actions within a relevant reference group?  

  **Background & Problem:**  
  Standard analyses of supererogation (e.g., Urmson 1958, Heyd 1982) treat it as a non-contrastive category: an act is supererogatory in virtue of being (a) morally optional, (b) praiseworthy, and (c) "beyond" a fixed threshold of duty or reasonable expectation. This framework struggles to explain two phenomena:  
  1.  **Intuitional Conflict:** Acts preventing severe harm to strangers at modest cost (e.g., organ donation) are deemed obligatory under consequentialist frameworks (Singer 1972), yet often labeled supererogatory in practice, without clear resolution on whether agents failing to act are blameworthy.  
  2.  **Contextual Variance:** Identical acts (e.g., donating blood) shift between "heroic" and "baseline civic duty" based solely on changes in *how commonly others perform them* (e.g., during routine scarcity vs. a high-participation crisis drive), suggesting the supererogatory label tracks *relative frequency* rather than inherent features.  

  **Core Hypothesis (Contrastive Supererogation):**  
  Supererogation is not an intrinsic property of acts or agent-relative thresholds. Instead, an act A performed by agent S is supererogatory relative to a group G if and only if:  
  (i) A is morally permissible but not universally obligatory for members of G;  
  (ii) A is significantly morally praiseworthy;  
  (iii) **The proportion of members of G who perform (or are disposed to perform) A-type acts falls below a critical threshold of commonality within G.**  
  The "heroic" label thus functions like "tall" – a contrastive status dependent on the distribution of behavior in the reference class (e.g., "citizens," "potential donors"). This challenges the standard non-contrastive view and may explain the intuitional conflict.  

  **Why Standard Framing Leaves This Open:**  
  Existing theories primarily focus on *agent-relative* factors (cost, effort, sacrifice) or *act-specific* features (benefit produced). They lack resources to explain why an act’s obligatory/supererogatory status *changes* when only the *prevalence* of similar acts by others changes, holding the act’s features and the agent’s costs constant. The contrastive view offers a parsimonious explanation.  

  **Summer Research Plan:**  
  1.  **Develop Matched Case Sets:** Construct pairs of vignettes where an agent performs an identical, significant beneficent act (e.g., donating a kidney, significant financial aid to a stranger). The *only* variable altered between vignettes will be the *prevalence* of similar acts within the agent’s community (e.g., "Fewer than 1% of eligible people do this" vs. "Over 70% of eligible people do this").  
  2.  **Isolate Key Variables:** Control for potential confounders:  
      *   *Social Expectations:* Ensure vignettes explicitly state that the act is neither legally required nor socially *expected* in either context.  
      *   *Predictability:* Hold constant whether the act is surprising or predictable *given the prevalence rate*.  
      *   *Cost/Demandingness:* Keep the agent’s sacrifice identical across vignettes.  
  3.  **Test Intuitions:** Deploy vignettes via surveys to philosophers and lay participants. Elicit judgments on:  
      *   Is the act supererogatory / heroic / "beyond duty"?  
      *   Would failing to perform the act be blameworthy?  
      *   Is the agent praiseworthy? (Control for confounding of praiseworthiness with supererogation status).  
  4.  **Analyze Contrastive Dependence:** Assess whether decreased prevalence significantly increases judgments that the act is supererogatory/heroic, and conversely, whether high prevalence shifts judgments towards seeing the act as baseline duty (or permissible without special praise).  
  5.  **Address Key Objections:** Test whether results can be reductively explained by:  
      *   *"Ought Implies Can":* If prevalence affects perceived feasibility for the *agent* (e.g., "if no one else does it, it’s harder").  
      *   *Demandingness:* If prevalence affects perceived cost *for the agent*.  
      *   *Praise-Appropriateness:* If prevalence only affects *how much praise* is warranted, not whether the act is supererogatory *per se*.  

  **Defining Success & Failure:**  
  *   **Success:** Clear evidence that prevalence significantly shifts supererogation judgments independently of demandingness, expectations, or predictability. Development of a robust contrastive model integrating findings.  
  *   **Failure Modes:**  
      *   Results collapse into demandingness (prevalence affects perceived cost).  
      *   Results reflect only *social expectation* or *predictability* (participants confuse "uncommon" with "unexpected" or "not demanded").  
      *   Prevalence affects only the *degree* of praiseworthiness, not the supererogatory *status* itself.  
      *   Judgments show high variance or inconsistency, suggesting no stable contrastive effect.  
  *   **Valuable Failure:** Even negative results clarify the boundaries of supererogation theory, potentially showing that "heroic" labels track social/psychological factors distinct from deontic status.  

  **Outcome:** A working paper presenting the contrastive hypothesis, experimental methodology, results, and implications for supererogation theory, potentially extending to suberogation ("permissible but blameworthy").  

  ---

  **Key Strengths for a Proposal:**  
  *   **Precise, Testable Hypothesis:** Clearly defines contrastive supererogation and isolates the variable to test (prevalence).  
  *   **Gaps Identified:** Targets a specific weakness in standard theories (inability to explain contextual variance).  
  *   **Methodologically Feasible:** Vignette surveys are standard, manageable within a summer, and don’t require IRB-heavy procedures.  
  *   **Clear Success/Failure Criteria:** Acknowledges risks but shows how even negative results contribute.  
  *   **Philosophically Grounded:** Engages core debates (nature of duty, supererogation) without relying on personal anecdote.  

  **Next Steps for You:**  
  1.  Add key citations (Urmson, Heyd, Singer; Mellema on expectation; maybe Driver on suberogation; recent experimental phil like Knobe or Lombrozo).  
  2.  Flesh out 2-3 specific vignette pairs (e.g., kidney donation in high-registration vs. low-registration societies; crisis aid in different community-response contexts).  
  3.  Specify survey platforms/target populations (e.g., PhilPapers survey, Prolific).  
  4.  Detail how results will be analyzed (statistical tests for significance).  

  This frames your kidney experience as the catalyst for a genuine philosophical puzzle without making *it* the subject. Good luck!
