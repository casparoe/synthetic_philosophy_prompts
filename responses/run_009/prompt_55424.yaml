  The moral/philosophical divide is thorniest. The user specifically mentions the firebombing precedent and civilian deaths. Here, I should note that labeling the bombings as "war crimes" or "military necessity" is partly verbal—the facts about civilian harm are agreed, but the moral frameworks differ. That distinction needs highlighting so they don't talk past each other.

