  We are going to create a diagnostic quiz that helps biologists discover their implicit species concepts by presenting concrete cases. The quiz will avoid using philosophical jargon and instead present scenarios that force the quiz-taker to make judgments about species boundaries.

  Preamble:
  You probably learned about species concepts in school: biological, phylogenetic, ecological, and so on. But when faced with real cases, you might find your judgments shifting. This quiz presents ten concrete scenarios. For each, pick the option that best reflects your intuition about whether the organisms form one or more species. Don't overthink it; go with your gut. At the end, we'll map your answers to the underlying concepts you actually use — which might not be consistent! This quiz is designed to reveal that inconsistency and help you see where your intuitions lie.

  The ten cases:

  1. Ring Species: A chain of populations wraps around a mountain range. Neighboring populations interbreed, but the terminal populations meet and cannot interbreed. Do you consider the terminal forms to be:
     A) The same species because they are connected by gene flow.
     B) Different species because they cannot interbreed.

  2. Ancient Asexual: A lineage of rotifers has reproduced clonally for millions of years, forming a distinct morphological cluster with no gene exchange. Do you consider them:
     A) A species because they form a recognizable, stable cluster.
     B) Not a species because they lack sexual reproduction and gene flow.

  3. Bacterial Gene Swapping: A bacterium commonly takes up DNA from distantly related lineages, incorporating functional genes. Do you consider it:
     A) Part of a single species if it maintains a core genome and ecological role.
     B) Not definable as a species because gene exchange blurs boundaries.

  4. Hybridizing Oaks: Two oak populations interbreed along a stable hybrid zone, yet maintain distinct morphologies and ecological preferences. Do you consider them:
     A) One species because they exchange genes.
     B) Two species because they remain distinct despite gene flow.

  5. Chronospecies: In a fossil sequence, you see a gradual transition from one morphology (say, a small, browsing horse) to another (a large, grazing horse) over millions of years. Do you consider:
     A) The entire sequence as one evolving species.
     B) Split them into multiple species at arbitrary points to reflect the changes.

  6. Cryptic Sibling Species: Two moth populations look identical but do not interbreed because they use different pheromones. Do you consider them:
     A) One species because they are morphologically indistinguishable.
     B) Two species because they are reproductively isolated.

  7. Conservation Impact: A widespread bird is currently one species listed as "least concern." Splitting it into five geographically isolated groups would make four of them "endangered." Do you consider:
     A) Keep it as one species to avoid conservation complications.
     B) Split it because the groups are distinct and the conservation status should not affect taxonomy.

  8. Polyploidy: A new plant population arises by chromosome doubling. It cannot interbreed with its diploid ancestor but is morphologically similar and occupies the same area. Do you consider:
     A) One species because they are morphologically and ecologically similar.
     B) Two species because they are reproductively isolated.

  9. Horizontal Transfer Dominant: In a microbial mat, a group of archaea exchange genes so frequently that it's hard to define clear lineages, but they form a stable functional group. Do you consider:
     A) They form a species because they maintain a cohesive ecological role.
     B) They do not form a species because there are no clear genetic boundaries.

  10. Ring Species Revisited: In the same ring species as case 1, consider a population in the middle of the ring that can interbreed with both sides. Do you consider:
      A) The entire ring as one species because all populations are connected by gene flow.
      B) The entire ring as multiple species because the terminal forms are isolated and the middle population is part of a continuum.

  Scoring Key:

  We will map the answers to the following positions (without using the names in the quiz):

  - Isolationist (Biological Species Concept): Emphasizes reproductive isolation.
  - Diagnosability-based (Phylogenetic Species Concept, diagnosability version): Emphasizes fixed differences.
  - Monophyly-based (Phylogenetic Species Concept, monophyly version): Emphasizes shared ancestry and exclusivity.
  - Evolutionary Lineage: Emphasizes a single line of descent over time.
  - Ecological: Emphasizes ecological role and adaptation.
  - Phenetic Cluster: Emphasizes overall similarity.
  - Nominalism: Believes species are arbitrary human constructs.

  Now, we assign each answer to the positions it aligns with. Note: Some cases may be ambiguous and map to multiple positions, but we will look for patterns.

  1. Ring Species (terminal forms):
     - A: Phenetic/Lineage (they are connected) or Ecological (if seen as one unit)
     - B: Isolationist

  2. Ancient Asexual:
     - A: Phenetic, Diagnosability (if cluster is distinct), or Ecological (if they have a distinct role)
     - B: Isolationist (because no sex) or Monophyly (if clonal lineage is seen as a single branch)

     However, note: Option A is chosen by those who accept non-sexual species, so it rejects the strict isolationist view.

  3. Bacterial Gene Swapping:
     - A: Ecological (core role) or Evolutionary Lineage (if the lineage persists despite gene swapping)
     - B: Nominalism (or perhaps those who think species don't apply to bacteria) or Monophyly (if they require strict monophyly without horizontal transfer)

  4. Hybridizing Oaks:
     - A: Isolationist (if gene flow is seen as connecting them) or Phenetic (if they look similar in the hybrid zone)
     - B: Diagnosability (if they are morphologically distinct) or Ecological (if they have different niches)

  5. Chronospecies:
     - A: Evolutionary Lineage (one evolving species) or Phenetic (if you see a gradual change as one cluster)
     - B: Diagnosability (if you want to mark distinct morphologies) or Nominalism (if you think splitting is arbitrary)

  6. Cryptic Sibling Species:
     - A: Phenetic (morphology) or Nominalism (if you think we shouldn't split without morphological difference)
     - B: Isolationist or Diagnosability (if pheromone difference is a fixed trait)

  7. Conservation Impact:
     - A: Nominalism (because taxonomy is influenced by human concerns) or perhaps Ecological (if the entire group is widespread and not threatened as one)
     - B: Diagnosability (if the groups are distinct) or Monophyly (if they are separate lineages)

  8. Polyploidy:
     - A: Phenetic (morphological similarity) or Ecological (same niche)
     - B: Isolationist (reproductive isolation)

  9. Horizontal Transfer Dominant:
     - A: Ecological (functional group)
     - B: Monophyly (if they require clear lineages) or Nominalism (if they think species are not definable)

  10. Ring Species (whole ring):
      - A: Evolutionary Lineage (one connected lineage) or Phenetic (one cluster)
      - B: Isolationist (if focusing on the terminal isolation) or Diagnosability (if the terminal forms are diagnosably different)

