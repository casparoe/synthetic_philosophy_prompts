  - Evolutionary Lineage: 1A, 5A, 10A
  - Ecological: 3A, 4A or 4B (depending on niche: if same niche then A, if different then B? But in case 4 the oaks have different ecological preferences). So for 4: if they say B because of ecological difference, that aligns with ecological. For 3A, 9A.
  - Phenetic Cluster: 1A (if they see the ring as one cluster), 2A, 5A, 6A, 8A
  - Nominalism: 3B, 5B (if arbitrary split), 7A, 9B (but note 9B might be monophyly too) - but also 6A might be nominalism because they don't want to split without morphology.

  But note: the positions are not mutually exclusive in every case. We are looking for patterns.

