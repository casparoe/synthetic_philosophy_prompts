  Alternatively, we can define the positions by a set of key questions that are decisive.

  However, the request is to build from the logical space. So we note the key questions that divide the positions:

  - Does reproductive isolation define species? (Isolationist): Key cases: 1,4,6,8,10
  - Does diagnosability (fixed differences) define species? (Diagnosability): Key cases: 2,4,6,7,10
