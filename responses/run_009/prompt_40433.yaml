answer: |-
  ### Which Species Concept Do You Actually Hold?  
  *A Diagnostic Quiz for Biologists with Inconsistent Intuitions*  

  **Preamble**  
  You might recall textbook species concepts—biological, phylogenetic, ecological—but real-world cases often defy these neat categories. This quiz reveals your *implicit* criteria for calling something a species. Ten concrete scenarios follow. Pick answers instinctively; don’t overthink. Your choices may conflict, and that’s the point: we’ll map your pattern to underlying philosophical positions, even if they’re unstable. Warning: you might not "hold" one concept but many, depending on context.  

  **The Ten Cases**  
  1. **Ring Species**: Salamander populations encircle a mountain. End populations don’t interbreed but are connected by gene flow through intermediates. You conclude:  
     A) One species—gene flow links them.  
     B) Two species—the ends are isolated.  

  2. **Ancient Asexual**: Bdelloid rotifers reproduce clonally for 40 million years. They form a tight morphological cluster but exchange no genes. You say:  
     A) A species—distinct, stable cluster.  
     B) Not a species—no interbreeding possible.  

  3. **Bacterial Gene Sponge**: *Thermus* bacteria routinely absorb DNA from archaea and unrelated bacteria. You decide:  
     A) One species—core genome persists.  
     B) No clear species—boundaries too fuzzy.  

  4. **Hybridizing Oaks**: California oaks interbreed along a stable zone but maintain distinct leaf shapes and soil preferences. You call them:  
     A) One species—genes mix stably.  
     B) Two species—they don’t fully merge.  

  5. **Chronospecies**: Horse fossils grade continuously from *Hyracotherium* (dog-sized browser) to *Equus* (modern grazer) over 50 million years. You:  
     A) Keep one name—it’s a seamless lineage.  
     B) Split arbitrarily—morphology changes.  

  6. **Cryptic Moths**: Two moth groups look identical but attract mates only with distinct pheromones. You classify them as:  
     A) One species—no visible difference.  
     B) Two species—reproductively isolated.  

  7. **Conservation Conundrum**: A widespread frog is “Least Concern” as one species. Splitting it into five geographically isolated groups makes four “Endangered.” You:  
     A) Keep it lumped—avoid taxonomy-driven risk.  
     B) Split it—conservation shouldn’t dictate taxonomy.  

  8. **Polyploid Plants**: A tetraploid dandelion arises from a diploid ancestor. They can’t interbreed but overlap in range and morphology. You:  
     A) Call them one species—they look alike.  
     B) Call them two—isolation is absolute.  

  9. **Horizontal Archaea**: In a hot spring, archaea swap genes so promiscuously that lineages blur, but they form a cohesive metabolic guild. You:  
     A) Define a species—ecological unity persists.  
     B) Reject species—no genetic coherence.  

  10. **Ring Species Revisited**: In the salamander ring (Case 1), a central population interbreeds with both ends. For the entire ring, you:  
      A) See one species—all connected.  
      B) See many species—terminal isolation matters most.  

  ---  
  **Scoring Key**  
  *Calculate how many times you chose each answer (e.g., five "A"s). Then match your pattern below. Positions are defined by logical tensions in your answers, not predefined concepts.*  

  1. **Your dominant view**  
     - **Mostly A in 1, 5, 8, 10 + A in 6**: *Phenetic Cluster View*. You prioritize morphological similarity and ignore reproductive gaps if forms look alike (e.g., chronospecies are one; cryptic moths are one).  
     - **Mostly B in 1, 4, 6, 8, 10**: *Isolationist View*. Reproductive isolation is decisive (e.g., hybridizing oaks are two species; polyploids are two). Ignores non-sexual lineages.  
     - **Mostly A in 2, 3, 9 + A/B in 4**: *Ecological View*. Species are defined by adaptive role (e.g., bacterial core genomes; archaeal guilds; oaks split if ecologically distinct).  
     - **Mostly A in 5, 10 + B in 1**: *Evolutionary Lineage View*. Species are single, dynamic lineages (e.g., chronospecies are one; ring species are one if connected; but terminal forms may split if lineage fractures).  
     - **Mostly B in 2, 3, 7, 9 + B in 5**: *Diagnosability-Based Phylogenetic View*. Fixed traits (genetic/morphological) define species (e.g., asexual clusters are species; fossil splits are valid; conservation splits are neutral).  
     - **Mostly B in 3, 5, 7, 9 + A in 7**: *Monophyly-Based Phylogenetic View*. Species require exclusive common ancestry (e.g., reject horizontal-transfer archaea; split fossils if lineages diverge; conservation status irrelevant).  
     - **Mostly A in 7 + B in 3, 5, 9**: *Nominalism*. Species are human constructs (e.g., conservation needs justify lumping; bacterial/fossil boundaries are arbitrary).  

  2. **Inconsistent patterns?**  
     - If you alternated between A/B for similar cases (e.g., A in 2 [asexual = species] but B in 3 [bacteria ≠ species]), you’re context-dependent. Most biologists are! Your "view" is a toolkit.  
     - Strongly held positions will cluster: e.g., Isolationists always pick B in 1,4,6,8,10; Pheneticists always pick A in 1,2,5,6,8.  

  3. **What your score reveals about instability**  
     - Splitters (e.g., B in 4,6,7) and Lumpers (e.g., A in 1,5,10) emerge based on case-specific stakes (e.g., conservation urgency, fossil continuity).  
     - No position "wins": even strict views bend (e.g., an Isolationist might accept asexual species if forced).  

  ---  
  **Unoccupied Combinations**  
  Some answer patterns aren’t covered by standard positions because they require mutually exclusive criteria:  
  - **A in 2 + B in 8**: Accepting asexual rotifers as species (prioritizing morphology) but rejecting polyploid plants as one species (prioritizing isolation). *Why unoccupied?* No major position requires reproductive isolation for sexuals but ignores it for asexuals.  
  - **A in 1 + B in 10**: Calling ring species terminals one species (due to connectivity) but the whole ring many (due to ends). *Why unoccupied?* This conflates lineage cohesion with population-level isolation—no concept demands both simultaneously.  
  - **A in 3 + B in 9**: Accepting gene-swapping bacteria as one species (due to ecology) but rejecting archaea (due to gene flow). *Why unoccupied?* Consistency would require either embracing (A) or rejecting (B) horizontal gene transfer altogether.  
  *Diagnosis*: These gaps arise when cases trigger conflicting intuitions about cohesion (genes, form, function) without a hierarchy to resolve them.  

  ---  
  **What This Quiz Cannot Sort**  
  The quiz diagnoses how you *delimit* species, not their metaphysical status. It **cannot** distinguish:  
  - Whether you see species as *natural kinds* (defined by essential traits) or *spatiotemporally bounded individuals* (historical entities). For example, an isolationist might view species as kinds (reproductive compatibility as essence) or individuals (lineages with birth/death).  
  - Whether species are "real" or instrumental. A nominalist could argue all concepts are pragmatic, while a phylogeneticist might insist on objectivity—yet both could give identical answers.  
  This divide is orthogonal: delimitation practices (tested here) don’t dictate ontology. You’d need different questions (e.g., "Are species defined by intrinsic traits or historical events?").  

  —  
  *Pattern in hand? You’re not alone—most biologists flip-flop. The point isn’t to "pick a side" but to see why the debate endures.*
