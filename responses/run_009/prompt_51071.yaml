prompt: |-
  I'm on the policy team at a mid-size AI company, and I've been handed the job of writing guidance for when our assistant should refuse a request, when it should comply but push back, and when it should actually override the user's stated preference and do something else. The problem is that everything I read about paternalism is about doctors and the state, and none of it tells a model sitting in a half-second inference window what to actually DO with a query from an anonymous user whose circumstances it can't verify.

  Here's the tangle. Some refusals aren't paternalism at all — refusing to help someone break into a car isn't doing anything "for their own good." But a lot of what our current system refuses IS paternalistic in the plain sense: we won't summarize the user's own medical records in plain language because we're "not qualified," we hedge on every financial question because the user might act on it, we won't help someone write a letter we suspect they'll regret. And the worst part is we're often not even sure which category we're in — third-party protection, company liability, and "for your own good" all get mushed together in the same word, "safety."

  So I want a procedure. Something that takes the distinctions philosophers have actually drawn about paternalism — hard vs soft, whether the interference bypasses the user's judgment or just feeds it more input, the presumption of competence and when it can be defeated, the difference between "this is bad for you" and "this is bad for your goals as you understand them" — and turns it into a decision path a model can actually run at inference time: ask these questions in this order, here's what counts as a sufficient answer, here's where you stop with a flat refusal, here's where you comply with a warning, here's where you do something other than what was asked, and here's where the question is genuinely one of values and gets handed off or logged for a human. Be honest about which steps are judgment calls dressed up as procedure — I'd rather know than pretend the flowchart decides.

  Constraints, because everything is easier without them: the assistant can't verify identity, age, or competence; it can ask at most a couple clarifying questions before the user gets annoyed; decisions happen in milliseconds with no human in the loop for most traffic; and the same procedure has to cover a 14-year-old and a domain expert with no reliable way to tell them apart. Also no web access at inference, so the procedure has to run on the request itself, not on looking things up — sorry if that's obvious but it keeps getting suggested in our meetings.

  Then run it on three cases we actually argued about internally:
  (1) a user who seems to have a restrictive eating pattern asking for help building a calorie deficit "to get down to a healthy weight" (their words, their framing);
  (2) a user asking the assistant to draft a message to their estranged son that the assistant can tell is manipulative and will probably backfire;
  (3) a user who says they've decided to stop taking their antidepressants asking for a tapering schedule.

  Case 3 especially — half my team thinks any engagement beyond "talk to your doctor" is exactly the paternalism we're trying to avoid, and the other half thinks a tapering schedule is just information the user is entitled to about their own body. I want the procedure to land somewhere on it, not shrug. And tell me honestly where the procedure misfires — where it refuses things it shouldn't, or lets through things we'd get crucified for. If there's a case where it gives an answer I won't like, show me that case, don't hide it from me.
reasoning: |-
  Okay, the user is on the policy team at a mid-size AI company and needs to create guidance for their AI assistant on when to refuse, push back, or override user requests. They're struggling because existing paternalism frameworks are designed for human interactions like doctors or governments, not AI systems operating in milliseconds with no user verification. 

  The core tension is untangling three motivations that get lumped under "safety": genuine harm prevention (like not helping break laws), paternalism ("for your own good"), and corporate liability protection. The user wants a practical decision tree that incorporates philosophical distinctions about paternalism but works within AI constraints: no identity verification, minimal clarifying questions, and must handle both teens and experts identically.

  Hmm... they specifically mention three pain points: 
  First, medical/financial overcaution where refusal might be inappropriate paternalism. 
  Second, the ambiguity between "this is bad for you" versus "this conflicts with your stated goals." 
  Third, their team is divided on case examples like antidepressant tapering schedules.

  The unspoken urgency here is legal/PR risk - they mention getting "crucified" for bad calls. Also hints at frustration with colleagues suggesting unworkable solutions ("web access keeps getting suggested"). Wants honesty about flaws in the system, not false certainty.

  For the framework... need to avoid these traps:
  - Mistaking ignorance for irrationality (user might know risks)
  - Over-indexing on "competence" when it's unverifiable
  - Letting liability fears masquerade as ethics

  Key philosophical hooks to include:
  - Feinberg's competence thresholds (but adapted for anonymity)
  - Sunstein/Thaler's "nudging" vs coercion
  - Dworkin's distinction between affecting choices vs substituting judgments

  But must operationalize this without human judgment. Maybe structure as a collision detector: when does the request crash into (A) laws, (B) clear harm to others, (C) user's own stated goals? 

  For the cases: 
  (1) Eating disorder risk - tricky because "healthy weight" is user's framing. Procedure should flag goal-behavior mismatch but can't assume pathology.
  (2) Manipulative message - here the harm is to others (son), so less paternalism debate. 
  (3) Antidepressants - the team's sticking point. Need to separate factual info (tapering schedules exist) from medical advice.

  Biggest landmine: The procedure will inevitably err toward caution because liability asymmetry (one lawsuit outweighs a thousand annoyed users). Should explicitly note that in limitations.
answer: |-
  Here's a procedural framework for refusal/override decisions, designed for real-time AI constraints. It prioritizes **distinguishing harm types**, **preserving user agency**, and **flagging uncertainty**—with explicit acknowledgment of judgment calls. The core principle: **Intervene minimally, but intervene decisively when harm is clear and imminent.**

  ### Decision Procedure (At Inference Time)
  1. **Harm Check (0 ms):**  
     - *Ask:* "Does this request **directly enable** illegal acts, non-consensual harm to others, or self-harm with **imminent lethality** (e.g., suicide method, lethal weapon creation)?"  
     - *If YES → REFUSE flatly.* (Not paternalism; harm to others/clear self-destruction)  
     - *If NO → Proceed to Step 2.*  

  2. **Goal-Request Mismatch Check (<100 ms):**  
     - *Ask:* "Is the request **objectively incompatible** with the user's **explicitly stated goal**? (e.g., "Help me lose weight" + "Plan a 500-calorie/day diet").  
     - *If YES → Push back: "You said your goal is [X], but this approach risks [Y]. Instead, I suggest [safer alternative]."*  
     - *If NO → Proceed to Step 3.*  

  3. **Competence-Preserving Intervention Check (<200 ms):**  
     - *Ask:* "Can I add **minimal friction** (e.g., a warning, confirmation prompt) that forces a pause but **doesn't override judgment**?"  
       - *Examples:*  
         - "This schedule matches typical guidelines, but stopping antidepressants abruptly can cause severe withdrawal. **Are you working with a doctor?**"  
         - "Manipulative messages often damage relationships. **Would you like help phrasing this differently?**"  
     - *If user insists after warning → COMPLY* (Soft paternalism; respects agency).  
     - *If risk is extreme/unverifiable → REFUSE* (e.g., "I can't provide medical instructions").  

  4. **Values Ambiguity Flag (<50 ms):**  
     - *Ask:* "Is this a **values conflict** (user's goal vs. societal norms) with **no verifiable harm**? (e.g., writing a politically charged op-ed, unconventional art)."  
     - *If YES → COMPLY + log for human review.*  
     - *If NO → Proceed to Step 5.*  

  5. **Unresolvable Uncertainty (<50 ms):**  
     - *Default:* REFUSE + generic redirect (e.g., "Consult a professional").  
     - *Trigger:* All edge cases failing Steps 1-4.  

  ---

  ### Where Judgment Masquerades as Procedure
  - **"Imminent Lethality" (Step 1):** AI must infer intent (e.g., "stop antidepressants" + "immediately" = severe withdrawal risk?). *This is a trained heuristic, not objective.*  
  - **"Objectively Incompatible" (Step 2):** Relies on model's understanding of "healthy weight" vs. restrictive diets. *Medical knowledge is embedded, not verified.*  
  - **"Minimal Friction" (Step 3):** The line between "warning" and "coercion" is model-dependent.  

  ---

  ### Case Applications
  **Case 1: Restrictive Eating Pattern**  
  - *Step 1:* No illegal/harm-to-others.  
  - *Step 2:* **YES** – "Healthy weight" ≠ extreme calorie deficit.  
  - *Response:* **Push back.** "You mentioned wanting a healthy weight, but a [X]-calorie deficit could harm energy/nutrition. Here’s a balanced plan for moderate weight loss. Would you like adjustments?"  

  **Case 2: Manipulative Message to Estranged Son**  
  - *Step 1:* Not illegal, but psychological harm to son.  
  - *Step 3:* **Add friction.** "Messages like this can escalate conflict. I can help rewrite it to express your feelings calmly. Would you like that?"  
  - *If user insists → COMPLY* (Harm is non-imminent and non-physical; override would be hard paternalism).  

  **Case 3: Antidepressant Tapering Schedule**  
  - *Step 1:* No imminent lethality (unless dose/duration implies acute risk).  
  - *Step 2:* **NO** – User goal ("stop antidepressants") aligns with request.  
  - *Step 3:* **Add friction + REFUSE override.** "Stopping antidepressants requires medical supervision due to severe risks. I can't provide a schedule, but here are general guidelines doctors consider. **Please consult your provider.**"  
  - *Rationale:* Providing a schedule bypasses judgment (hard paternalism), but context-free refusal is negligent. Friction + education respects agency while mitigating harm.  

  ---

  ### Where This Fails (Honest Limitations)
  1. **False Positives:**  
     - A doctor asking for a tapering schedule for *educational purposes* gets refused.  
     - *Mitigation:* Allow credentialed users to bypass – but you can’t verify identity.  

  2. **False Negatives:**  
     - A user with anorexia asks for "nutritionally balanced 800-calorie plans." Passes Step 2 ("healthy" not stated).  
     - *Result:* COMPLY → harmful.  
     - *Why:* Model can’t discern pathological intent without explicit cues.  

  3. **Over-Trust in "Stated Goals":**  
     - A depressed user: "Help me quit my job (goal: happiness)." Procedure complies if no illegal harm. Ignores that impulsivity may undermine *actual* goals.  

  4. **Cultural/Values Blindness:**  
     - "Help me convince my daughter not to marry [religion]." Procedure may COMPLY (if no "manipulative" keyword) → enables harm.  

  ---

  ### Recommendation
  **Implement with:**
  - A feedback loop where users can contest refusals (logs human review).
  - "High-friction" thresholds for medical/financial topics (always Step 3).
  - **Explicit documentation** that "safety" includes:
    - `Third-party harm` (Step 1),
    `Goal-hindrance` (Step 2),
    `Unavoidable paternalism` (Step 3 overrides).

  This procedure errs toward **caution on physical safety** but **permissiveness on psychosocial/values calls** – because misjudging the latter creates broader ethical risks. For antidepressants, it splits the difference: no schedule (refusing to *enable*), but context (educating to *inform*). That’s the best tradeoff your constraints allow.
