prompt: |-
  I'm the managing editor at a small nonprofit that writes plain-language health and biology explainers for the general public — short pieces on how the body works, why we get fevers, what the appendix is for, that sort of thing. We keep fighting about function language. One writer claims the appendix's function is storing beneficial gut bacteria, another calls it a useless leftover, a third says vestigial organs have no functions full stop, and our medical reviewers are just as split. I gather philosophy of biology has a whole literature on what it even means to say a trait has a function — the selected-effect / etiological view where function depends on evolutionary history, versus the causal-role view where function is about what a part contributes to a system right now — and I want that turned into something my team can actually use. So act as a philosopher of biology who's used to translating for non-specialists, take a moment to brainstorm and think through the design before committing to it, and then write a decision procedure my editors can run on any sentence that attributes a function, a malfunction, or 'leftover' status to a trait: the questions to ask in order, what kind of answers license evolutionary claims versus merely causal-role ones, where it outputs 'cut the sentence or soften it to pure mechanism,' and where it hands the decision back to an editor because its a judgment call the theory can't settle. Then run it on three cases: the appendix and gut bacteria claim, fever and sickness behavior (is fever a function or a malfunction?), and a writer who wants to say depression 'exists for an evolutionary reason.' Make sure at least one case comes out in a way I won't like, be honest about where the two accounts of function simply disagree and no procedure can paper over that, and say what the procedure can't do when the underlying biology is itself contested. Write everything as continuous prose, no headings, bullets, bold or tables — like a long email — and keep it usable by people who've never read a word of philosophy.
reasoning: |-
  Okay, let me tackle this managing editor's request. They need a practical decision procedure for handling function claims in their health explainers, grounded in philosophy of biology but stripped of academic jargon. 

  First, I should map their core problem: writers and medical reviewers are conflicting over statements like "appendix stores good bacteria" vs "it's useless". The philosophical divide here is clearly between etiological functions (evolutionary purpose) and causal-role functions (current contribution). 

  For the decision procedure, I'll need to consider:
  - Must work for three judgment calls: function attribution, malfunction claims, and "leftover" status
  - Should flag when evolutionary claims are justified vs when to stick to mechanistic descriptions
  - Needs to handle contested biology transparently (like appendix or depression)
  - Must output clear actions: keep/cut/soften or escalate to human judgment

  Important constraints: no bullet points or headings, just flowing prose. And crucially, one case must produce an unpopular conclusion to maintain credibility. 

  Brainstorming the flow:
  Start with a filter question: "Is this statement about why the trait exists or what it currently does?" That branches the path immediately. For etiological claims, require evolutionary evidence (fossil/homology/adaptation studies). For causal-role, focus on demonstrable mechanisms. 

  Special traps to flag:
  - Calling something "useless" (often overstates actual science)
  - Medicalizing normal responses (like fever)
  - Just-so stories about evolution (especially for mental health)

  Now testing against their cases:
  1. Appendix "stores bacteria": causal-role plausible but etiologically shaky - should trigger "soften to mechanism" 
  2. Fever as malfunction: likely fails both accounts - fever has clear causal role and evolutionary maintenance 
  3. Depression's "evolutionary reason": classic case for "hand back to editor" due to contested biology

  Biggest challenge will be admitting where philosophy can't resolve disputes, like when underlying science is ambiguous. Need to emphasize that the procedure exposes assumptions rather than delivering perfect answers.

  For the unpopular output: I'll make the depression case explicitly caution against evolutionary claims since the evidence is so speculative. The editor probably wants to permit that narrative sometimes, but the philosophy forces restraint here.
answer: |-
  Here's how to handle function claims in your articles—think of it as a step-by-step sieve for any sentence about why a body part exists, what it’s “for,” or whether it’s useless. I’ll build the procedure first, then run your three cases. The key is recognizing two distinct ways biologists (and philosophers) use “function,” which often causes your team’s fights. The **Selected-Effect (SE) view** asks, “Did natural selection shape this trait *because* it did something beneficial in our ancestors?” It’s about evolutionary *history*. The **Causal-Role (CR) view** asks, “What does this trait *currently do* within the body’s system?” It’s about present-day *mechanics*. Neither is “wrong,” but mixing them up causes trouble. Here’s how to keep them straight:

  **The Decision Procedure (Use this checklist silently for any function claim):**

  1.  **Identify the Claim Type:** Is the sentence saying the trait *has a purpose* (function), *is broken* (malfunction), or *lacks purpose* (vestigial/leftover)? This focuses your questioning.
  2.  **Ask: "Is this claim about evolutionary history (why it evolved) or current mechanics (what it does now)?"** This is the critical fork. Listen to the language: words like “evolved for,” “exists for,” “selected for,” “ancestral purpose” lean SE. Words like “helps,” “contributes to,” “facilitates,” “involved in” lean CR. If it’s vague (e.g., "the function is..."), probe the intent.
  3.  **For SE Claims (Evolutionary Purpose/Malfunction/Vestigial):**
      *   *Requires Evidence:* Is there strong *evolutionary evidence* supporting this? Look for:
          *   **Adaptation Studies:** Does comparative biology (similar traits in related species) show a clear adaptive benefit that drove selection *for* this specific trait?
          *   **Phylogeny:** Does the trait’s evolutionary history show it was maintained/reduced *due to* its effects?
          *   **Cost-Benefit:** Is the trait costly? If so, is there evidence the benefits *historically outweighed* the costs, justifying its evolution?
      *   *Judgment:* If the evidence is strong and consensual (e.g., the vertebrate eye), an SE claim is likely fine. If evidence is weak, contested, or speculative (common for complex behaviors or murky organs), **SOFTEN** to mechanism ("*may have evolved to help with...*" or "*one hypothesis is that...*") or **CUT** if too bold. Calling something "vestigial" (SE) requires evidence it *had* a function in ancestors that is *now lost or greatly reduced*. If a trait has a significant current CR function, calling it "vestigial" is usually inaccurate/misleading, even if it’s smaller than in ancestors.
  4.  **For CR Claims (Current Contribution/Malfunction):**
      *   *Requires Evidence:* Is there strong *physiological evidence* of a current causal contribution? Look for:
          *   **Mechanism:** Can we describe *how* the trait contributes to a current bodily process?
          *   **Consequence:** If the trait is removed/impaired, is there a measurable, consistent disruption to the system? (This is key for CR "malfunction").
      *   *Judgment:* If the mechanism/consequence is well-documented (e.g., kidneys filter blood), a CR claim is solid. If the contribution is minor, indirect, context-dependent, or poorly understood, **SOFTEN** ("*can help with...*", "*plays a role in...*", "*is involved in...*") or **CUT** if overstated. Calling something a CR "malfunction" requires evidence it's failing at a *typical* CR contribution *and* causing harm *because of that failure*.
  5.  **For "Leftover" or "Useless" Claims:** This is almost always an *SE claim* (vestigial). Apply Step 3 rigorously. Crucially, **a trait having a current CR function (even a significant one) DOES NOT prevent it from being vestigial under SE if its *original* selected effect is gone.** However, calling something "useless" is almost always wrong if it has *any* current CR function. **SOFTEN** ("*while it may have had a larger role in our ancestors, it now...*") or **CUT** "useless." **HAND BACK** if evidence on evolutionary history vs. current role is deeply contested (like the appendix!).
  6.  **Red Flags & Hand-Backs:**
      *   **Contested Biology:** If the underlying science is actively debated (Is depression an adaptation? Is the appendix vestigial? What *is* fever's core function?), the procedure can't resolve it. **HAND BACK** to editors with a note: "Science contested - present competing views cautiously, avoid definitive SE claims." Default to CR description if possible.
      *   **"Malfunction" Ambiguity:** Is the "malfunction" a failure of an SE purpose or a CR role? Be explicit. Is fever *failing* at something it was designed for, or is it *doing its job* in a way that feels bad? **HAND BACK** if context isn't clear.
      *   **Just-So Stories:** Beware SE claims lacking strong evolutionary evidence, especially for complex behaviors/traits. **SOFTEN/CUT**.
      *   **CR Claim Masquerading as SE:** Saying "the function is X" often implies SE purpose. If you mean CR, use CR language ("*contributes to*," "*helps*").
  7.  **Output:** Based on steps 1-6:
      *   **Keep (Strong):** Claim type clear, appropriate evidence (SE or CR) strong and consensual.
      *   **Soften:** Evidence exists but is incomplete, indirect, or contested; or claim language is too strong/absolute. Use qualifiers ("*may*," "*suggests*," "*contributes to*," "*one role is*").
      *   **Cut:** Claim lacks evidence, is speculative (especially SE), overstates ("useless," "only purpose"), or conflates views badly.
      *   **Hand Back:** Underlying biology contested, claim type ambiguous, or significant disagreement among experts that the evidence check can't resolve. Requires editorial judgment on framing.

  **Running the Cases:**

  1.  **"The appendix's function is storing beneficial gut bacteria."**
      *   **Claim Type:** Function (ambiguous SE/CR).
      *   **Intent/Word Choice:** "Function" often implies SE, but storing bacteria sounds like CR. Probe: Is the writer saying *why it evolved* or *what it does now*? Likely a mix. Assume CR claim (current contribution).
      *   **Evidence Check (CR):** Mechanism? Yes, it's a reservoir. Consequence? After removal, microbiome *can* take longer to recover after severe diarrhea (evidence exists but is not universally catastrophic). There's a measurable, though perhaps not vital, current role.
      *   **Judgment:** **SOFTEN** the CR claim. It's a plausible current role, but not its sole or necessarily primary "function," and certainly not an undisputed SE function. Rephrase: "*The appendix may act as a reservoir for beneficial gut bacteria, helping repopulate the gut after illness.*" Avoid stating it as *the* function. Calling it "vestigial" (SE) is contested (see below).

  2.  **"Fever is a malfunction of the body's temperature control."** (Implying it's bad/not functional)
      *   **Claim Type:** Malfunction (ambiguous SE/CR).
      *   **Intent/Word Choice:** "Malfunction" suggests failure. Is it failing an SE purpose or a CR role? Body temperature control *is* a CR system. Fever involves raising the set point.
      *   **Evidence Check (CR Malfunction):** Mechanism? Fever is an active, regulated physiological response, not a passive failure. Consequence? While uncomfortable, moderate fever *enhances* immune function in many infections (e.g., white blood cells work better, some pathogens grow slower). Harm is often due to excessive height/duration, not the mechanism itself.
      *   **Evidence Check (SE Malfunction):** Is fever failing its evolutionary purpose? Strong evidence fever *is* an adaptation (SE function - conserved across vertebrates, costs energy, benefits often outweigh costs). It's generally *doing* what selection shaped it to do.
      *   **Judgment:** **CUT** the malfunction claim. It fails both views. Fever is a *feature*, not a bug, under both SE and CR lenses. Describe the mechanism: "*During infection, the body actively raises its temperature (fever) to help fight invaders.*" Acknowledge discomfort but frame it as a trade-off, not a malfunction. (This might be the conclusion you "won't like" if a writer strongly wants to frame it negatively).

  3.  **"Depression exists for an evolutionary reason."** (i.e., it was selected for, has an SE function)
      *   **Claim Type:** Function (Explicitly SE - "evolutionary reason," "exists for").
      *   **Intent/Word Choice:** Clearly an SE claim about why depression evolved/why it's maintained.
      *   **Evidence Check (SE):** Adaptation Studies? Hypotheses exist (e.g., promotes withdrawal/rumination to solve complex problems, signal need, avoid conflict), but evidence is highly speculative and contested. No clear comparative evidence, hard to define the "trait" precisely. Cost-Benefit? The profound suffering and impairment make it extremely hard to argue benefits consistently outweighed costs historically in a way that would select *for* the disorder. Phylogeny? Unclear.
      *   **Contested Biology:** This is a massive area of active debate with little consensus. The underlying mechanisms and evolutionary history are extremely murky.
      *   **Judgment:** **HAND BACK** emphatically. **Strongly advise against** making this definitive SE claim. The science is far too contested and speculative. It risks promoting harmful just-so stories. If discussing evolutionary *perspectives*, frame cautiously: "*Some researchers have proposed theories about potential evolutionary roots of aspects of depressive responses, suggesting they might, in specific contexts, have served protective functions. However, these ideas are highly speculative and controversial, and depression as a clinical disorder causes significant suffering and impairment.*" Focus primarily on current neurobiology and psychology (CR descriptions) for explainers. The procedure flags this as dangerous territory for oversimplification.

  **What the Procedure Can't Do:**

  *   **Resolve Scientific Disputes:** It can't tell you if the appendix *really is* vestigial or if depression *really* has evolutionary roots. It can only tell you if the *evidence for a specific claim type* is strong enough to state confidently, or if it's contested and needs softening/cutting/handing back. When the biology itself is muddy (appendix, many behavioral traits), the procedure will often lead to "Softened CR description" or "Hand Back."
  *   **Reconcile SE and CR:** Sometimes a trait has a clear SE function *and* a clear CR function, and they align (kidneys). Sometimes the SE function is gone, but a CR function remains (possibly appendix). Sometimes a trait evolved for one SE reason (SE Function A) but now primarily does something else (CR Function B). The procedure helps you identify which type of "function" you're talking about and what evidence you need, but it can't force them to mean the same thing. The appendix fight is partly this: The "vestigial" camp (SE) focuses on loss of ancestral function (digesting cellulose?), the "bacteria store" camp (CR) focuses on a current contribution. *Both could be true simultaneously*, making "vestigial" potentially accurate (SE) but "useless" inaccurate (CR). The procedure forces clarity on *which* meaning is intended.
  *   **Make Editorial Judgment Calls:** When science is contested (appendix, depression), or when the cost-benefit analysis of a trait is context-dependent (fever), the procedure flags it and hands it back. You *must* then decide how to present competing views or uncertainty to your audience – the philosophy can't do that for you. It just makes the uncertainty explicit.

  **The Core Takeaway for Your Team:** Before writing "the function of X is Y," or "X is useless," pause. Ask: "Are we talking about evolutionary history or current mechanics?" Then demand the evidence appropriate to *that* type of claim. If the evidence isn't strong and clear, soften the language. If the underlying science is a battleground, present that carefully or stick to describing what the thing demonstrably *does* right now. This won't end all fights, but it will ground them in clearer questions and evidence, moving you past unproductive "is too!" / "is not!" debates. Use the sieve, and good luck!
