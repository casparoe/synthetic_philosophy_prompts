prompt: |-
  I'm a high school senior writing my extended essay on direct democracy, and before I can argue anything about it I need to know what I actually believe about when a referendum's result should bind. I've collected my gut verdicts on a set of cases, and I'd like you to find the principle behind them, tell me which of my verdicts it cannot accommodate, and say what it predicts for cases I haven't considered.

  My verdicts, as honestly as I can state them:

  1. Brexit (2016): a bare 52–48 majority on a major constitutional change, in a referendum that was technically only advisory, should not by itself have carried the change; parliament should have had to do more work than it did. Verdict: not a legitimate simple mandate.

  2. The Swiss referendum that banned the construction of new minarets (2009): I think the outcome was wrong and unfair to a small religious minority, but the procedure was legitimate — it was a proper national vote under Switzerland's long-standing system. Verdict: legitimate process, bad result.

  3. Swiss women could not vote in federal referendums until 1971. Any referendum before then was decided by an electorate that excluded half the adult population. Verdict: not legitimate — even if the voting procedure was formally impeccable, the electorate itself was wrongly constituted.

  4. California's Proposition 13 (1978): a legitimate majority vote capped property taxes, but the measure also required supermajorities for future legislatures to raise many taxes, which entrenches one generation's majority against later ones. Verdict: the vote was legitimate, but the entrenchment clause was not; a one-time bare majority shouldn't be able to bind future majorities that tightly.

  5. Ireland's 2018 referendum to repeal the constitutional ban on abortion, held after a randomly selected Citizens' Assembly had deliberated for months: completely legitimate, even though this too was a major moral question carried by a simple majority. I don't feel the Brexit worry here at all, and I'm not sure why.

  6. Reversals: if a country votes a policy in and then, three years later, votes essentially the same policy out by a similar margin, the second vote should stand, and "the people have already spoken" is not an objection. Verdict: re-running a referendum is fine.

  7. My own school case: the student body was asked whether to keep our late bus; only about a fifth of students voted, but I think the result should stand anyway, because low turnout cuts both ways — the people who cared enough showed up.

  The tensions I can already see: 2 and 3 pull apart (formally correct procedure can be legitimate in one case and not the other), 1 and 5 pull apart (a simple majority seems badly insufficient for Brexit but fine for Ireland), and 4 sits awkwardly with 6 (if majorities cannot bind future majorities, why can a reversal vote undo an earlier one — and why couldn't the earlier majority claim the same protection against being reversed?). My best guesses are that the difference between 1 and 5 lies in the deliberation beforehand, or in the fact that Ireland's status quo was itself the product of an earlier referendum, and that the difference between 2 and 3 is that one electorate was merely mistaken while the other was wrongly drawn. But I cannot get all of this into one principle, and I have tried.

  What I would like from you: state the principle, or a small set of candidate principles, precisely enough that I could apply it mechanically to any new referendum. For each clause, tell me which of my cases motivates it. Then tell me honestly which of my seven verdicts your best principle fails to save, and sketch what a cleaner principle that simply drops those verdicts would look like. Finally, apply your principle to three cases I have not mentioned: (a) a referendum whose ballot question is worded so that a "yes" vote does the opposite of what most voters plausibly intend; (b) a referendum to abolish referendums; and (c) a supermajority requirement that was itself introduced by a simple majority vote.
reasoning: |-
  Okay, let me start by unraveling this user's query. They're a high school senior working on an extended essay about direct democracy, specifically when a referendum's result should be binding. They've listed seven case verdicts where their gut feelings conflict, and they need a unifying principle. 

  First, I need to understand each case and the tensions they mentioned. Brexit vs. Ireland is a big one—why is simple majority okay for Ireland but not Brexit? Then there's the Swiss minaret ban versus women's suffrage exclusion. The minaret ban was procedurally correct but unfair, while excluding women made the electorate illegitimate. Prop 13 has that entrenchment issue, and the school bus case has low turnout. 

  The user’s struggles are clear: they can't reconcile these verdicts into one principle. Their guesses about deliberation or electorate legitimacy are on point, but they need something systematic. I should look for underlying factors like electorate fairness, decision quality, and intergenerational equity. 

  Breaking down the cases:

  1. **Brexit**: Lack of deliberation and clarity makes simple majority insufficient.  
  2. **Minaret Ban**: Fair electorate and procedure, so legitimate despite bad outcome.  
  3. **Swiss Suffrage**: Electorate exclusion invalidates legitimacy.  
  4. **Prop 13**: Majority can decide taxes, but can't bind future legislatures without supermajority.  
  5. **Ireland Abortion**: Extensive deliberation (Citizens' Assembly) justifies simple majority.  
  6. **Reversals**: Later majority can override because no entrenchment.  
  7. **School Bus**: Low turnout is acceptable if the electorate is properly constituted.

  The key themes seem to be:
  - **Electorate Composition**: Who gets to vote? Exclusion (like women) invalidates; broad inclusion is necessary.
  - **Decision Quality**: Was there informed deliberation? Ireland had it, Brexit didn't.
  - **Temporal Limits**: Can a majority bind future majorities? Entrenchment requires higher thresholds.

  Now, constructing principles:
  1. **Legitimate Electorate**: All competent adults affected must be included.
  2. **Sufficient Deliberation**: Mandatory informed public discussion for complex issues.
  3. **Non-Entrenchment**: Simple majorities can't bind future legislatures without supermajority.

  Testing these principles against the cases:
  - **Brexit**: Fails deliberation (Principle 2), so verdict supported.
  - **Minaret Ban**: Fair electorate (Principle 1), no entrenchment, so legitimate. Matches verdict.
  - **Swiss Suffrage**: Electorate exclusion violates Principle 1, so illegitimate. Correct.
  - **Prop 13**: Entrenchment without supermajority violates Principle 3. Verdict supported.
  - **Ireland**: Deliberation satisfies Principle 2, so legitimate. Good.
  - **Reversals**: Later vote isn't entrenched, so allowed. Fine.
  - **School Bus**: Low turnout but electorate is legitimate (Principle 1), so okay. Matches.

  But the school bus case might be a problem. Principle 1 requires all competent adults affected to be included, but only students who cared voted. Is that sufficient? The user thinks low turnout is acceptable because those who care showed up. But the principle might need adjustment for practicality versus ideal inclusion.

  Also, the reversal case: The earlier vote isn't entrenched, so a new majority can override. That aligns with non-entrenchment, but why can't the first majority claim protection? The principle avoids this by not allowing entrenchment without higher thresholds.

  Now, the cases where the principles might fail: 
  - **School Bus**: If the electorate is all students but only 20% vote, is that legitimate? The user says yes, but Principle 1 doesn't address turnout, only inclusion. So it holds, but maybe needs a turnout clause. However, adding that complicates things. Maybe keep it and note the exception.

  For new cases:
  (a) **Misleading Ballot**: If the wording tricks voters, it violates Principle 2 (informed decision). Not legitimate.  
  (b) **Abolish Referendums**: Simple majority could end future referendums. Principles 1 and 2 apply, but Principle 3: if it entrenches, needs supermajority. If it just changes law, simple majority suffices.  
  (c) **Supermajority by Simple Majority**: Introducing a supermajority requirement via simple majority violates Principle 3, as it entrenches without proper threshold.

  The user's deeper needs: They want a coherent framework for their essay, but also to understand their own biases. They might be struggling with balancing procedural legitimacy versus substantive outcomes. The principles help systematize their intuitions, showing that legitimacy isn't just about the vote but the process around it.

  In conclusion, the three principles cover most cases except possibly the school bus low turnout. Sticking to electorate inclusion without mandating turnout resolves it pragmatically. The user might need to accept that or adjust the principle, but the current framework is robust.
answer: |-
  Based on your case-specific verdicts and the tensions you've identified, I've distilled a set of three interconnected principles that form a coherent framework. This framework prioritizes **procedural legitimacy** and **decision quality** over substantive outcomes, while addressing intergenerational equity. Here's the principle set, followed by analysis:

  ### The Proposed Principles
  1.  **Legitimate Electorate Principle (LEP):**  
      *The electorate must include all competent adults substantially affected by the decision, with equal suffrage.*  
      *(Motivated by Cases 3 & 2)*

  2.  **Sufficient Deliberation Principle (SDP):**  
      *For complex or high-stakes decisions (constitutional, irreversible, fundamental rights, major resource allocation), a referendum is only binding if preceded by a formal, structured, and evidence-based public deliberation process ensuring voters are adequately informed about consequences and alternatives.*  
      *(Motivated by Cases 1, 5 & 4)*

  3.  **Non-Entrenchment Principle (NEP):**  
      *A simple majority vote cannot permanently bind future legislatures or majorities to a specific policy or procedural rule (e.g., supermajority requirements). Entrenchment requires either (a) a supermajority vote itself, or (b) recurring ratification by simple majorities over time.*  
      *(Motivated by Cases 4 & 6)*

  ---

  ### How the Principles Accommodate Your Verdicts
  *   **Case 1 (Brexit): NOT LEGITIMATE**  
      *Violates SDP:* Lack of formal deliberation (vague question, no concrete plan, misinformation, limited understanding of consequences) makes the bare majority insufficient for such a complex, high-stakes decision. LEP met. NEP irrelevant (no entrenchment attempted).
  *   **Case 2 (Minarets): LEGITIMATE PROCESS, BAD RESULT**  
      *LEP Met:* All competent adults could vote. *SDP Met (minimally):* Switzerland's system has inherent deliberation (long campaign periods, frequent votes). *NEP Met:* No entrenchment. Legitimacy stems from procedure (LEP+SDP), not the outcome.
  *   **Case 3 (Swiss Pre-1971): NOT LEGITIMATE**  
      *Violates LEP:* Exclusion of women (competent adults substantially affected) invalidates the electorate, regardless of formal voting procedure. SDP/NEP irrelevant.
  *   **Case 4 (Prop 13): LEGITIMATE VOTE, ILLEGITIMATE ENTRENCHMENT**  
      *LEP Met:* Broad suffrage. *SDP Met (arguably):* California initiative process involves public debate/campaigns (though quality varies). *Violates NEP:* The supermajority requirement for future tax raises entrenches the policy via a simple majority vote.
  *   **Case 5 (Ireland): LEGITIMATE**  
      *LEP Met.* *SDP Met:* Extensive, structured deliberation via the Citizens' Assembly ensured high-quality information and public debate. *NEP Met:* Simple majority repeal was permissible as the original ban wasn't entrenched *against* repeal by simple majority (it was just constitutional law).
  *   **Case 6 (Reversals): LEGITIMATE (2nd Vote)**  
      *NEP Applied:* The first vote doesn't bind future majorities. A new majority with a new mandate (potentially under a new SDP process) can reverse the policy. The earlier majority has no "protection" against reversal under NEP.
  *   **Case 7 (School Bus): LEGITIMATE**  
      *LEP Met:* All affected students had the right to vote. Low turnout is a failure of participation, not an illegitimate electorate. *SDP Not Required:* Low complexity/stakes (routine operational decision). *NEP Irrelevant.* Verdict upheld.

  ---

  ### The Failure: Where the Principle Set Stumbles
  The principle set **fails to fully accommodate your verdict on Case 7 (School Bus)**.

  *   **The Problem:** While LEP is met (all students could vote), the extremely low turnout (20%) challenges the core idea of the "majority" representing the "will of the people" in a meaningful way. The principles prioritize *access* (LEP) over *participation*. Your verdict accepts low turnout as legitimate ("the people who cared enough showed up"). The principles, as stated, agree – LEP is satisfied, no SDP needed, no NEP issue. However, this feels intuitively weak for a decision claiming majoritarian legitimacy.
  *   **Why it's a Failure for *You*:** Your verdict relies on a pragmatic acceptance of low turnout ("cuts both ways"). The principles technically support this, but they don't capture your underlying *concern* about legitimacy when participation is minimal. They lack a mechanism to invalidate a vote *solely* due to low turnout if LEP is met and SDP isn't required.

  **A "Cleaner" Principle Set (Dropping Low-Turnout Acceptance):**  
  To eliminate this tension, we could modify LEP to include a participation threshold for legitimacy:

  1.  **Revised Legitimate Electorate Principle (rLEP):** *The electorate must include all competent adults substantially affected by the decision, with equal suffrage, **and a minimum threshold of participation (e.g., >50% of eligible voters) must be met for the result to be binding.***
  2.  **SDP** (Unchanged)
  3.  **NEP** (Unchanged)

  *   **Impact:** This rLEP would likely render Case 7 (School Bus) **NOT LEGITIMATE** due to low turnout, contradicting your verdict. Case 2 (Minarets) and Case 4 (Prop 13) might also be jeopardized if Swiss/Californian turnout was low (though often it's decent). This prioritizes robustness of the mandate over practicality/pragmatism.

  ---

  ### Predictions for New Cases
  Applying the *original* principle set (LEP/SDP/NEP - accepting low turnout if LEP met):

  *   **(a) Misleading Ballot Question:**  
      **Verdict: NOT LEGITIMATE.**  
      *Why:* Violates **SDP**. A misleading question fundamentally undermines "adequate information" and informed consent, regardless of formal deliberation structures. The process is flawed.

  *   **(b) Referendum to Abolish Referendums:**  
      **Verdict: LEGITIMATE VOTE, POTENTIALLY ILLEGITIMATE ENTRENCHMENT.**  
      *Why:*
      *   *LEP/SDP:* If the electorate is legitimate and sufficient deliberation occurs on this fundamental procedural change, the vote itself is legitimate.
      *   *NEP:* The critical issue is *how* it abolishes them. If it simply repeals the law enabling referendums (reversible by a future legislature), it's likely legitimate. If it *constitutionally entrenchs* the abolition (making future referendums impossible without a near-impossible hurdle), then a simple majority vote would violate **NEP**. Legitimacy requires a supermajority for entrenchment.

  *   **(c) Supermajority Requirement Introduced by Simple Majority:**  
      **Verdict: ILLEGITIMATE ENTRENCHMENT.**  
      *Why:* Directly violates **NEP**. A simple majority cannot impose a rule (the supermajority requirement) that permanently binds future majorities by making it harder for them to act. Entrenching a procedural hurdle requires either a supermajority vote itself or recurring ratification.

  ---

  ### Conclusion
  Your intuitions point towards a legitimacy framework based on **inclusive suffrage** (LEP), **informed decision-making** for high-stakes issues (SDP), and **rejecting permanent minority rule** (NEP). This explains the Brexit/Ireland split (SDP), the Swiss Minarets/Suffrage split (LEP), and the Prop 13/Reversals tension (NEP).

  The main friction is your pragmatic acceptance of very low turnout (Case 7), which the principles technically permit but feel uneasy about. Choosing between the original set (matching 6.5/7 verdicts) or the revised set with a turnout threshold (matching 6/7 but rejecting your school bus verdict) depends on whether you prioritize theoretical robustness of the mandate or practical governability for minor decisions. For your essay, the original set provides a strong, defensible foundation consistent with most democratic theory, while explicitly acknowledging the turnout tension as a limitation worth discussing.
