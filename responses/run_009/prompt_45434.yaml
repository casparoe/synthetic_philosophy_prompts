  ### Full Activity Design: "The Rescue Dilemma"

  **Objective:** Students discover through their own choices which factors (cost, number of others, vividness) influence their willingness to bear costs for strangers, then analyze how these align with Singer’s principles.

  #### **Rules and Materials**  
  **Materials Needed:**  
  - 19 envelopes (one per student) containing:  
    - 100 paper tokens (identical, pre-cut)  
    - 6 scenario cards (one per round)  
    - Private project card (e.g., "Build a community garden: Costs 60 tokens to complete. If you retain ≥60 tokens at the end, your project succeeds.")  
  - Whiteboard or projector for recording aggregate results  
  - Timer  
  - Data collection sheet (for instructor)  

  **Game Rules:**  
  1. **Setup:**  
     - Each student starts with 100 tokens and a private project card.  
     - Projects pay off only if the student retains ≥60 tokens at the end.  
  2. **Rounds:**  
     - 6 rounds total. In each round, students face a rescue opportunity.  
     - **Rescue mechanics:**  
       - The rescue succeeds if ≥1 student pays the cost.  
       - Students decide independently and secretly.  
       - To contribute, students physically place the required tokens into a central "rescue fund" box.  
       - If they lack tokens for a round, they cannot contribute.  
     - **Parameters per round (vary independently):**  
       - **Cost (a):** Tokens required to rescue (10, 30, or 60).  
       - **Others (b):** Number of equally positioned rescuers (0, 2, 5, 10, or 18).  
       - **Vividness (c):** Rescue target as a "single vivid person" (name, brief story) or "statistical aggregate" (e.g., "10 anonymous children").  
  3. **Win Conditions:**  
     - Rescue succeeds per round if ≥1 student pays.  
     - Students "win" individually if they retain ≥60 tokens (project success).  

  **Scenario Cards (Round Parameters):**  
  - **Round 1:** Cost = 10 tokens, Others = 0 (only you), Vivid ("Sam, 5-year-old in a pond").  
  - **Round 2:** Cost = 10 tokens, Others = 18, Statistical ("10 children in a flood zone").  
  - **Round 3:** Cost = 30 tokens, Others = 2, Vivid ("Li, trapped in a burning building").  
  - **Round 4:** Cost = 30 tokens, Others = 10, Statistical ("10 refugees needing medicine").  
  - **Round 5:** Cost = 60 tokens, Others = 5, Vivid ("Maria, starving child you meet").  
  - **Round 6:** Cost = 20 tokens, Others = 1, Statistical ("10 factory workers in danger").  

  **Payoff Scheme:**  
  - **No real money.** Project success = bonus points (e.g., +1% on final grade) or symbolic reward (e.g., "Ethics Champion" certificate).  
  - Rescue success per round = collective moral victory (no individual payoff).  

  **Instructor Recording (Per Round):**  
  1. **Aggregate data on whiteboard:**  
     - Number of contributors.  
     - Total tokens donated.  
  2. **Private tracking (on data sheet):**  
     - Per student: Decision (contributed/did not), tokens remaining.  
     - Flag rounds where contributing would drop tokens below 60.  

  ---

  #### **Minute-by-Minute Timeline**  
  **Total: 75 Minutes**  

  - **0–5 min: Introduction**  
    - Briefly state goals: "Today, you’ll face ethical dilemmas through a game. Your choices will reveal how you weigh costs, others’ roles, and vividness. No lectures—just your decisions."  
    - Distribute envelopes. Explain rules and project payoff.  
    - Emphasize: "Decide based on your conscience. No talking during rounds."  

  - **5–40 min: Game Rounds (6 rounds × 5 min each)**  
    - **Per round (5 min):**  
      1. **0–1 min:** Read scenario card aloud while students follow on their cards.  
      2. **1–3 min:** Students decide privately. If contributing, they add tokens to the central box.  
      3. **3–4 min:** Students record tokens remaining on their project card.  
      4. **4–5 min:** Instructor records aggregate contributions/tokens on whiteboard.  
    - **Critical Round (Round 5):**  
      - Cost = 60 tokens. Students with exactly 60+ tokens face a choice: Contribute and forfeit project, or save tokens.  

  - **40–45 min: Final Tally**  
    - Students calculate final token count.  
    - Instructor verifies project success (≥60 tokens retained).  

  - **45–75 min: Debrief (30 min)**  
    **Part 1: Analyze Choices vs. Singer’s Principles (15 min)**  
    - Display aggregate data. Ask:  
      - *"Did giving track cost (a)? Compare Round 1 (cost=10) and Round 5 (cost=60)."*  
      - *"Did giving track others (b) or vividness (c)? Compare Round 1 (0 others, vivid) vs. Round 2 (18 others, statistical). Why?"*  
    - Highlight Singer’s claim: Distance/number of others are morally irrelevant.  
    - **Key Q:** *"Why might we ignore Singer and let (b) or (c) sway us?"*  

    **Part 2: Locate the Strong/Weak Principle Threshold (10 min)**  
    - Reveal anonymous data: How many contributed in Round 5 despite losing their project.  
    - Discuss:  
      - **Strong principle:** "Prevent bad without sacrificing comparable moral importance."  
        - *"Did contributing in Round 5 align with this? Is a life > your project?"*  
      - **Weak principle:** "Prevent very bad without sacrificing anything morally significant."  
        - *"If you kept tokens in Round 5, did you treat the project as 'morally significant'?"*  
    - **Key Q:** *"Where did *you* draw the line? Was it at 60 tokens?"*  

    **Part 3: Map "Why Me?" to Fair Shares (5 min)**  
    - Use Round 2 (18 others) and Round 6 (1 other):  
      - *"In Round 2, did you think: ‘Why me? Someone else will help?’"*  
      - *"Is this a ‘fair share’ argument? Singer says no—your duty isn’t reduced by others’ inaction."*  
    - Debate: *"Is mutual inaction an excuse? Or a coordination failure?"*  

  ---

  #### **Predictable Problems and Mitigation**  
  1. **Problem:** Students hoard tokens early, skipping low-cost rescues.  
     - **Mitigation:** Remind them mid-game: "Token decisions affect real moral reasoning."  
  2. **Problem:** "Vivid" scenarios feel manipulative, provoking skepticism.  
     - **Mitigation:** Acknowledge this in debrief: "Vividness shouldn’t matter, but did it for you?"  
  3. **Problem:** Students with depleted tokens disengage.  
     - **Mitigation:** Assign them as "observers" who track patterns.  
  4. **Problem:** Groupthink during decisions.  
     - **Mitigation:** Enforce silence; collect tokens privately.  

  ---

  #### **What the Game Cannot Replicate (Candid Note)**  
  **Supply these insights in debrief:**  
  - **Scale:** Real-world famine affects millions; tokens trivialize the stakes.  
  - **Irreversibility:** In the game, "death" is abstract; real suffering is permanent.  
  - **Repetition:** The game ends after 6 rounds; real aid demands lifelong sacrifice.  
  - **No "Exit":** Unlike the game, real need never stops—Singer’s demand is continuous.  
  **Emphasize:** "This game simplifies reality. Singer argues that *all* luxuries (e.g., extra tokens) should be donated if others starve. Would you play differently if rounds never ended?"  

  ---

  **Instructor Script Snippet for Debrief:**  
  *"In Round 5, Maria’s vivid face made 7 of you donate 60 tokens—losing your projects. That aligns with Singer’s strong principle: A life outweighs your garden. But 12 of you kept tokens. Was your project ‘morally significant’? Or did you think: ‘With 5 others, why me?’ Let’s discuss where *you* set your threshold—and why Singer calls that arbitrary."*  

  This design ensures students confront the tension between self-interest and moral duty, then rigorously dissect it against Singer’s framework—all within 75 minutes.
