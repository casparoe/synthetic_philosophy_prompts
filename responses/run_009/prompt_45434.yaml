            Round 5: cost=60, N=5, vivid -> # contributors = ?
            Round 6: cost=20, N=1, statistical -> # contributors = ?

          Ask for a show of hands for each round. Record.

          Discuss:
            - Compare round 1 and round 2: same cost, but different N and presentation. What changed? Why?
            - Compare round 3 and round 4: same cost, different N and presentation.
            - What does Singer say about the role of distance and the number of others?

       50-60 min: Strong vs. weak principle.

          Ask:
            - How many of you ended the game with at least 60 tokens? (project success)
            - In round 5, how many had at least 60 tokens at the start? Of those, how many contributed? (losing the project) -> they followed the strong principle.
            - How many of those with at least 60 at the start of round 5 did not contribute? -> they followed the weak principle (if they thought the project was morally significant) or violated the weak principle? 

          But note: the strong principle requires giving even if it means losing the project. The weak principle requires giving only if it doesn't sacrifice something morally significant (the project). So in round 5, if they had the tokens and didn't contribute, they violated the strong principle but followed the weak.

          Also, ask: were there any rounds where you didn't contribute even though you had enough tokens and the cost would not have brought you below 60? (e.g., round 1: cost=10, they had 100 -> they could have given without jeopardizing the project). If they didn't, then they violated even the weak principle? Because they didn't sacrifice anything significant (they still had 90, which is above 60).

          Singer would say: the weak principle requires giving in that situation.

          So we can see that the weak principle might be violated in rounds with low cost.

          Then ask: what is the threshold for "morally significant"? In our game, we set it at 60 tokens. But in real life, it's vague.

       60-70 min: Fair shares and "why me?"

          Ask:
            - In round 2 (N=18), how many of you thought: "With 18 others, someone else will probably help, so I don't need to."?
            - What happened? (Even if one person thinks that, it might be okay, but if everyone does, then no one helps.)

          Singer: the inaction of others does not reduce your obligation.

          Also, in round 6: N=1. So there is one other. If you don't help, and the other doesn't, the child dies. But if you help, then the child is saved. So you have a responsibility. But what if the other is also thinking: "Why me?".

          We can discuss: is there a fair share? What if we divided the rescues? But in the game, it's all or nothing: one person can do the rescue.

          And note: in the real world, there are many people in affluent countries. Singer says: even if you are one of many, you still have to give.

       70-75 min: Concluding remarks.

          Note the limitations of the game (as above) and how the real problem is ongoing and massive.

     What might go wrong:

       - The show of hands for contributions in each round might be influenced by social desirability. They might not want to admit they didn't contribute. We can ask them to close their eyes and raise hands? Or we can use the slip data we collected and just report the numbers without show of hands? But we don't have time to tally. So we rely on honesty in show of hands.

       - Some students might have spent tokens in earlier rounds and then in round 5 they don't have 60, so they are not in the dilemma. We can still make the point.

       - The vivid vs. statistical might not show a difference. Then we can discuss why.

     We proceed.

     Final note: the instructor should emphasize that the tokens and the project are meant to simulate having personal goals and resources, and that in real life the stakes are much higher.

     Let's write the minute-by-minute.

     Minute-by-Minute Timeline:

     0-5 min: 
          - Introduce the activity: "Today we are going to do an activity to explore the ideas in Peter Singer's paper. You have read it, so you know about the shallow pond argument. We are going to simulate a series of rescue scenarios. Each of you starts with 100 tokens. You have a personal project that requires you to have at least 60 tokens at the end of the activity to succeed. The project is important to you. During the activity, you will face six rounds of rescue opportunities. In each round, you decide independently whether to contribute tokens to rescue. The rescue succeeds for that round if at least one person in the class contributes. You can only contribute if you have enough tokens. After each round, you update your token balance. We will not know the results until the end. Let's begin."

     5-10 min:
          - Distribute the ledger sheets and the first scenario slip. Make sure they have pens. Explain the ledger: "Start with 100 tokens. In round 1, the cost is 10 tokens. If you contribute, subtract 10 and write 90. If not, write 100. Then after deciding, drop the slip in the box at the front."

     10-15 min: Round 1
          - Display the scenario for round 1 on the projector (or read it aloud) if needed, but it's on the slip.
          - Students decide and fill out the slip and ledger. They drop the slip.

     15-20 min: Round 2 (same as above)

     20-25 min: Round 3

     25-30 min: Round 4

     30-35 min: Round 5

     35-40 min: Round 6

     40-45 min:
          - After round 6, ask students to calculate their final token balance and fill out the final questionnaire.
          - Collect the final questionnaire.

     45-75 min: Debrief (30 minutes, but we have 30 minutes from 45 to 75)

          - 45-55 min: Aggregate results per round (write on board) and discuss the factors (cost, N, vividness).
          - 55-65 min: Strong vs. weak principle (focus on round 5 and the project).
          - 65-75 min: Fair shares and the "why me?" question, then limitations of the game.

     This is tight. We might need to adjust.

     Alternatively, we can skip the final questionnaire and rely on the slips and the ledger? But the final questionnaire has the project status and the round 5 decision.

     We can do the final questionnaire quickly and then start the debrief while the instructor quickly skims the questionnaires? But we don't have time.

     Instead, we can do:

          - After round 6, collect all the slips (which we have been collecting) and then ask the students to raise hands for the aggregate per round? And then for the project and round 5, we ask by show of hands.

     So we don't use the final questionnaire in class? We can use it for after-class reflection and grading (if we promised extra credit) but not for the in-class debrief.

     Revised:

          After round 6, we don't collect a final questionnaire. Instead:

          - Ask: "What is your final token balance? If it is 60 or more, raise your hand." (Count and record how many succeeded in the project.)
          - Then: "In round 5, if you had at least 60 tokens at the start of the round, raise your hand." (Count: X)
          - Then: "Of those, how many contributed in round 5?" (Count: Y) -> so X-Y did not.

          Then we can proceed.

     But we lose the data on when they first sacrificed the project. We can ask:

          "At any point in the game, did you contribute in a round knowing that it would leave you with less than 60 tokens at the end? If so, raise your hand." (Count)

          And then: "What was the first round in which you did that?" (But we don't have time to get individual rounds.)

     We can skip that and focus on round 5.

     Given time, we do:

          Debrief:

            45-50 min: Aggregate per round by show of hands.

            50-55 min: Focus on round 5: how many could have contributed and didn't? (refused strong principle) and how many did? (followed strong).

            55-60 min: Discuss the weak principle: did anyone violate the weak principle by not contributing in a round where the cost was low and they had plenty of tokens? (e.g., round 1: cost=10, they had 100). Ask: "In round 1, how many of you did not contribute?" (and they had 100 tokens, so they ended with 100 -> project safe). Then Singer (weak principle) would say they should have contributed because 10 tokens is not morally significant. So why didn't they?

