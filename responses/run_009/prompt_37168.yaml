  She summed up: What matters has to be something true of the life, not just something the life feels like from the inside.

  Candidate principles that fit these verdicts:

  A. **Objective List Theory (OLT)**: There are certain objective goods that make a life go well, such as genuine accomplishments, real relationships, knowledge, etc., and these are valuable independently of whether they are experienced or desired.

  B. **Desire Fulfillment Theory (DFT) with External Fulfillment**: A life goes well to the extent that one's desires are fulfilled, even if one doesn't know about the fulfillment. The desires must be about the external world.

  C. **Truth-Sensitive Theory (TST)**: What matters is the truth of one's experiences or the reality of one's situation. A life is better when the positive experiences correspond to reality and worse when they are based on falsehood.

  Now, let's see which simpler principles are eliminated by the three verdicts:

  - **Hedonism (only pleasure matters)**: Eliminated by the first verdict (experience machine) and the second and third (since inner feeling is the same but the real state matters).
  - **Subjective Desire Fulfillment (where the person must be aware of the fulfillment)**: Eliminated by the second and third cases because in the researcher case, the person never learns of the success, and in the marriage case, the deceived person never learns of the mockery.

  So, we are left with principles that require something beyond inner experience and beyond subjective awareness of desire fulfillment.

  Now, let's see how the candidate principles fit the track record:

  1. Experience machine refusal: 
     - OLT: The plugged-in life lacks genuine accomplishments and real relationships -> worse.
     - DFT (external): The plugged-in life might fulfill some desires (for pleasure) but fails to fulfill any desires that are about the real world (if the person has such desires). However, note that in the first case we are not told about the person's desires. But the friend's refusal suggests that she values something beyond experience. 
     - TST: The plugged-in life is based on illusion -> worse.

  2. Researcher case (success without knowing vs. failure):
     - OLT: Genuine achievement (saving lives) is an objective good -> the successful life is better.
     - DFT (external): If the researcher desired to contribute to science and save lives, then in the successful world that desire is fulfilled (even without her knowing) -> better.
     - TST: The truth is that her work was successful, which is better than the false belief that it failed -> better.

  3. Marriage case (genuine love vs. fake):
     - OLT: A genuine loving relationship is an objective good -> the genuine love life is better.
     - DFT (external): If the person desires to be truly loved, then the genuine love case fulfills that desire (without the person knowing the truth in the fake case, so the desire is not fulfilled there) -> better.
