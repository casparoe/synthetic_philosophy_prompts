  - **DFT (external)**: The person's only desire is for pleasant experience. In the machine, she gets exactly that. Therefore, her desire is fulfilled -> the life goes well. Note: She enters with full knowledge and is never deceived, so she knows she's in the machine and that it's not real, but she doesn't care because she only wants the pleasant experience. Therefore, her desire is fulfilled -> the life is good.

  - **TST**: The life in the machine is not real; it's an illusion. The truth is that she is in a tank and her experiences are not real. According to TST, this lack of truth (or the falsity of the experiences) makes the life worse. Even though she doesn't desire truth, the theory says truth matters. So this life is worse.

