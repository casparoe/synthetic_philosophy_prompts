  We are given three verdicts from the friend:

  1. Refusing the experience machine: The plugged-in life would be clearly worse than the real life even though it feels perfect from the inside.
  2. The researcher case: The life where the work actually saved lives (even though she never learns it) is better than the life where it came to nothing (with both feeling the same from the inside).
