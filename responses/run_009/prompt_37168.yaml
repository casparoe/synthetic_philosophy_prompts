  Finally, a further case to discriminate among the principles:

  Suppose we have a person who has a strong desire for something that is not on the typical objective list and is also not about truth. For example, suppose a person desires that a certain number of stars in the Andromeda galaxy is even. This desire is not about their own life experiences or about the state of the world that they can experience. Now, in one life, the number is even; in another, it is odd. The person never knows and it doesn't affect their experiences.

  - OLT: The evenness of the stars is not an objective good -> the two lives are equally good (or the desire fulfillment doesn't matter because it's trivial).
  - DFT: The desire is fulfilled in one scenario -> that life is better.
  - TST: Truth matters. In one scenario, the belief (if they had one) about the stars would be true? But note, they don't have a belief. The theory is about the truth of the life's experiences or the reality of their situation. This might not fit neatly. However, if we extend TST to the truth of the world, then the scenario where the stars are even when the person desires that would be a truth that aligns with the desire? But TST isn't about desire. So TST might not see a difference.

  But to make it clean:

  **Discriminating Case**: A person has a desire that a particular distant event in the past (which they cannot possibly know about and which has no effects on anyone) happened. For example, they desire that a specific leaf fell from a specific tree on January 1, 1800, in a remote forest. In one world, it did fall then; in the other, it didn't. The rest of their life is identical.

  - OLT: The falling of the leaf is not an objective good -> the lives are equally good.
  - DFT: In one world the desire is fulfilled -> that life is better.
  - TST: The truth of the past event: one world has the truth that matches the desire? But TST is usually about the reality of the person's own life experiences. This event is external and doesn't affect the person's experiences. So TST might not count it.

  Thus, this case can discriminate between DFT and the others.

  If the friend says the world where the leaf fell as desired is better, then she is running DFT. If she says they are the same, then she might be running OLT or TST (if TST doesn't cover such external facts).

  But note: in the marriage case, the partner's feelings are an external fact that matters. So TST might extend to such facts. However, the falling leaf is not about the person's own life. We can adjust:

  Make it a desire about the person's own life that they cannot know. For example, the person desires that they were born on a Tuesday (but they never find out). In one world, they were born on a Tuesday; in the other, they were not. The rest is identical.

  - OLT: The day of birth is trivial and not an objective good -> lives are equal.
  - DFT: The desire is fulfilled in one -> better.
  - TST: The truth about their birth: in one world it is true that they were born on Tuesday -> but if they don't have a belief about it, does it matter? TST might not care because it's not an experience.

  This is tricky. Alternatively, we can stick to the leaf case and see if the friend extends the value to any desire fulfillment, no matter how trivial and disconnected.

  But note: the friend's verdicts so far have been about things that are intuitively important (accomplishments, love). So perhaps she would not count trivial desires. We might need a case with a non-trivial desire that is external and unknowable.

  Alternatively, we can use:

  **Clean Discriminating Case**: Two lives that are identical in experiences and in all objective features that are typically considered (accomplishments, relationships, etc.) except for the fulfillment of a desire that the person has but that is about something external and trivial and unknowable. For example, the person desires that the 1000th digit of pi is 9 (which it is). In one world, it is 9; in the other, it is not (and the person never knows). Does the life in which it is 9 go better?

  - OLT: same objective features -> same.
  - DFT: one has the desire fulfilled -> better.
  - TST: same truth about the person's own life? The digit of pi is an abstract truth that doesn't affect the person's experiences -> same.

  So if the friend says the life with the digit being 9 is better, then she is running DFT. If she says they are the same, then she is running OLT or TST.

  But note: in the researcher case, the desire for contribution is non-trivial. So the friend might only count non-trivial desires? But DFT in principle counts any desire. To avoid trivialities, we can stipulate the desire was formed after reflection and is a central desire.

  Alternatively, we can use a case where the desire is non-trivial but the person cannot know if it's fulfilled. Example: A parent desires that after they die, their children are happy. They die without knowing. In one world, the children are happy; in the other, they are not. The parent's life experiences are identical.

