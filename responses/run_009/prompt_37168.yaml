  - DFT: The parent's desire is fulfilled in one world -> that life is better for the parent.
  - TST: The truth about the children: in one world they are happy -> but this is not about the parent's own experiences. So TST might not count it.

  This case is similar to the researcher case, but the researcher's desire was about her own work. The parent's desire is about their children after they die. So it's a test of whether the desire must be about one's own life or can be about external things.

  In the researcher case, the work is part of her own life. In the marriage case, the partner's feelings are about her own relationship. So perhaps the friend would require the desire to be about the person's own life? Then the children case might not be covered.

  To be safe, let's design a case that OLT and DFT might differ on without relying on trivial desires:

  **Discriminating Case**: A person who has a strong desire to climb Mount Everest. They train for years but then, due to an injury, cannot climb. However, they are given a virtual reality experience that perfectly simulates climbing Everest. They know it's virtual but they do it and feel the same sense of achievement. They die satisfied. In one world, they actually climbed Everest (before the injury) and the virtual experience is a replay of their real climb. In the other world, they never climbed and the virtual experience is fabricated. The inner experiences in both cases are the same.

