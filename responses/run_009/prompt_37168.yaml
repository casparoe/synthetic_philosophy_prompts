answer: |-
  Based on your friend's three verdicts (rejecting the experience machine, preferring the researcher's life where her work unknowingly saved lives, and preferring the marriage where love is genuine despite identical inner experiences), I've systematized her position. Her core claim—that what matters must be "something true of the life, not just something the life feels like from the inside"—eliminates simpler principles like hedonism (which values only conscious experiences) and internalist desire fulfillment (which requires awareness of fulfillment). Her verdicts imply that external reality matters independently of inner experience.

  ### Candidate Principles Fitting Her Track Record
  Three principles align with all three verdicts:
  1. **Objective List Theory (OLT)**: A life goes well if it includes objective goods (e.g., genuine achievements, true relationships, knowledge), even if the person is unaware of them. These goods are valuable independently of desires or experiences.
  2. **External Desire Fulfillment Theory (EDFT)**: A life goes well if the person's desires about the external world are fulfilled, regardless of whether they know about the fulfillment. Desires must be about reality, not just feelings.
  3. **Truth-Adjusted Experience Theory (TAET)**: A life goes well when subjective experiences correspond to objective reality. Positive experiences are better if "true" (e.g., based on real achievements or relationships), and worse if "false" (e.g., based on deception or illusion).

  **Simpler principles eliminated**:
  - **Hedonism**: Eliminated by the experience machine refusal (inner pleasure isn't sufficient).
  - **Internalist Desire Fulfillment**: Eliminated by the researcher and marriage cases (unaware fulfillment improves the life).
  - **Pure Subjectivism**: Eliminated by all cases (inner experience isn't decisive).

  ### Predictions for Your New Cases
  I'll apply each principle to your two new cases:

  **New Case 1**: The person who only wants pleasant experience enters the machine knowingly and lives contentedly.
  - **OLT prediction**: Worse than a similar real life. The machine life lacks objective goods like real accomplishments or authentic relationships, even if the person doesn't desire them. OLT holds that these goods are intrinsically valuable.
  - **EDFT prediction**: Goes well. The person's sole desire (pleasant experience) is fulfilled, and she entered without deception. No external desires are thwarted.
  - **TAET prediction**: Worse. The experiences are "false" (not based on reality), and TAET values truth regardless of desires.

  **New Case 2**: The scientist who dies believing she was a fraud, but her work actually saved millions (inner life identical to a real fraud).
  - **OLT prediction**: Better than the real-fraud counterpart. She achieved genuine goods (real contributions, saved lives), even if she didn't know it.
  - **EDFT prediction**: Better. Assuming she desired to be a competent, impactful scientist (implied by her fraud-belief), this desire is fulfilled externally.
  - **TAET prediction**: Better. Her negative self-view is "false," and the truth (her real impact) makes the life better, despite identical inner experience.

  ### Committed Principle and Predictions
  I commit to **External Desire Fulfillment Theory (EDFT)** as the most plausible principle for your friend. Here's why:
  - **Why EDFT?** It best explains her emphasis on "something true of the life" while respecting her focus on the individual's perspective. Her verdicts hinge on unfulfilled *desires* in the negative cases: the experience machine thwarts desires for real achievements/relationships; the researcher's unfulfilled desire is for meaningful impact; the marriage case involves an unfulfilled desire for genuine love. EDFT handles this with minimal assumptions, whereas OLT imposes "objective goods" that might not align with the person's values, and TAET overemphasizes truth for its own sake. EDFT also accommodates her language of "what matters" being tied to the life's reality—it's about whether the world matches what the person desires.

  **Prediction for Case 1 (machine with contentment)**:  
  - **Verdict**: The life goes well.  
  - **Reason**: She desired *only pleasant experience*, and this desire is fulfilled without deception. Even though the life lacks objective goods or truth, EDFT cares only about desire fulfillment, and she had no desires about reality to thwart. Her refusal of the machine in the original case involved typical desires for real achievements, but here, her reflective desires are different.

  **Prediction for Case 2 (scientist with false fraud-belief)**:  
  - **Verdict**: Better than the real-fraud life.  
  - **Reason**: Her lifelong desires (to be a genuine scientist, to contribute, to not be a fraud) are fulfilled externally—she was not a fraud and saved lives. EDFT doesn't require awareness, so the fulfillment counts. Her inner suffering is identical, but the external match to her desires makes this life better.

  ### Discriminating Case to Test Principles
  To cleanly distinguish between EDFT, OLT, and TAET, use this case:  
  - **Case description**: An astronaut desires to be the first human to walk on Mars. Due to a technical failure, she dies en route, believing she failed. Unbeknownst to her, in World A, the mission succeeds and she is the first to walk on Mars (her body is recovered and buried on Mars). In World B, the mission fails completely, and she never lands. Her inner experience (belief of failure, disappointment) and death are identical.  
  - **How it discriminates**:  
    - **EDFT**: Predicts World A is better because her desire to walk on Mars is fulfilled (externally, posthumously).  
    - **OLT**: Predicts World A is better only if "being first on Mars" is an objective good. If OLT excludes posthumous events, it might see no difference (the goods must be during life).  
    - **TAET**: Predicts World A is better because her belief of failure is false—the truth (success) obtains.  
  - **Why it works**: It isolates desire fulfillment (EDFT) from objective goods (OLT) and truth (TAET). If your friend says World A is better, it supports EDFT or TAET; if she says equal, it supports OLT (if it denies posthumous goods). To split EDFT and TAET, note that EDFT requires a prior desire, while TAET values truth regardless of desires. If she emphasizes "she wanted it, so it matters," it confirms EDFT.

  This framework should help you test her intuitions. If you get her verdicts on your new cases or the discriminating case, we can refine this further!
