  So all three principles (OLT, DFT with external fulfillment, TST) fit the three cases.

  Now, we have two new cases:

  **New Case 1**: A person who after years of reflection sincerely wants nothing from life but pleasant experience (no desire for truth, reality, etc.) enters the machine with full knowledge and lives in unbroken contentment.

  **New Case 2**: A scientist who dies believing she was a fraud (with inner life identical to a real fraud) but in fact she was not and her work saved millions.

  We need predictions for these cases under each principle.

  **Predictions for New Case 1**:

