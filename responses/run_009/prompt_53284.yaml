prompt: |-
  I'm a high school student who has coded seriously in Python for three years and is now taking biology, where the textbook keeps saying that DNA is a "code" that "carries information" and gets "translated." Translate the central claims of that talk into the vocabulary I actually use — character encodings like ASCII, source versus object code, interpreters, program versus data, configuration flags, runtime state — as faithfully as you can, and then give me the residue report. Answer as exactly five numbered items, each one or two sentences, with no introduction or conclusion: (1) the codon table mapped onto a character encoding; (2) transcription and translation mapped onto compilation; (3) promoters and regulatory regions mapped onto code, configuration, or neither; (4) epigenetic marks mapped onto runtime state; and (5) the claim that genes "carry information about" phenotypes mapped onto anything at all in programming. Within each item, state what translates cleanly and what has no counterpart in my vocabulary. Close the fifth item by judging whether the leftover shows my programming vocabulary is missing something or that the biology talk is looser than it looks.
reasoning: |-
  We are mapping biological concepts to programming concepts as per the user's request. The user is a high school student with 3 years of Python experience and is learning biology.

  We are to break down into 5 numbered items:

  1. **Codon table as a character encoding**: 
     - Cleanly: The codon table (triplet of nucleotides to amino acid) is like a character encoding (e.g., ASCII mapping a byte to a character). 
     - No counterpart: In programming, the encoding is arbitrary and set by standards. In biology, the codon table is nearly universal (with a few exceptions) and evolved, not arbitrary. Also, in programming, we don't have an equivalent for stop codons as they are more like termination signals.

  2. **Transcription and translation as compilation**:
     - Cleanly: Transcription (DNA to mRNA) is like generating an intermediate representation (e.g., assembly or bytecode). Translation (mRNA to protein) is like compiling that intermediate representation to machine code (proteins being the functional units).
     - No counterpart: The biological processes involve physical machinery (ribosomes) and are continuous, whereas compilation is a discrete step. Also, biological translation is more like an interpreter that reads the mRNA and builds the protein on the fly.

  3. **Promoters and regulatory regions as code, configuration, or neither**:
     - Cleanly: Regulatory regions (promoters, enhancers, etc.) are configuration flags or switches that determine when and where a gene is expressed. They are not code that gets executed but rather control the execution of the code (the genes).
     - No counterpart: In programming, configuration is usually set externally and statically, while in biology, regulatory regions are part of the genome and dynamically interpreted by the cellular machinery (transcription factors) in response to the environment.

  4. **Epigenetic marks as runtime state**:
     - Cleanly: Epigenetic marks (like DNA methylation or histone modifications) are like runtime state because they can change during the program's execution (an organism's life) and affect which genes are expressed without changing the underlying code (DNA sequence).
     - No counterpart: In programming, runtime state is typically stored in variables and memory, which is volatile and reset when the program stops. In biology, epigenetic marks can be heritable and persist through cell divisions, which is more like a persistent state that survives across runs (generations).

  5. **Genes "carry information about" phenotypes**:
     - Cleanly: The DNA sequence is like the source code, which when executed (through transcription and translation) produces the phenotype (the output). So, the gene carries information in the same way that a function in code carries the instructions for a specific task.
     - Residue: The leftover is that in programming, the source code is the entire set of instructions, but in biology, the phenotype is also influenced by the environment, regulation, and interactions (like configuration and runtime state). Also, the mapping from genotype to phenotype is not one-to-one (due to pleiotropy, epistasis, etc.) and is probabilistic, whereas in programming the output is deterministic from the code and input.
     - Judgment: This residue shows that the biology talk is looser than it looks because it oversimplifies the complex, context-dependent relationship between genes and phenotypes. It also highlights that our programming vocabulary might be missing concepts for non-deterministic, complex systems (like probabilistic outcomes and environmental interactions) that are common in biology.

  Now, let's write each item in one or two sentences as required.
answer: |-
  1. The codon table maps cleanly to a character encoding (e.g., ASCII), where triplets (codons) are 3-byte sequences decoded to amino acid "characters" by the ribosome interpreter. However, stop codons have no direct counterpart—they terminate translation like `exit()` but aren't encoded symbols, and the biological table is universal hardware, not a software-defined standard.  

  2. Transcription is source-to-assembly compilation (DNA→mRNA), and translation is assembly-to-machine-code compilation (mRNA→protein), with tRNA as linker and ribosomes as hardware-dependent compilers. No clean counterpart exists for real-time error correction via chaperone proteins or the destruction of mRNA/protein "object files" after execution.  

  3. Promoters and regulatory regions map to configuration flags (e.g., command-line arguments or `.env` files), as they set conditional parameters (e.g., tissue=lung) for gene "function calls" but aren't executed code. No counterpart exists for their spatial organization—enhancers act like remote config servers, looping DNA to physically contact promoters, unlike flat config files.  

  4. Epigenetic marks (e.g., methylation) map cleanly to runtime state—dynamic memory modifying gene expression without altering source DNA, like environment variables set during execution. However, they persist across cell divisions like write-to-disk state, unlike volatile runtime memory, and can be inherited, a concept absent in standard programming.  

  5. Genes "carrying information" maps to function definitions (DNA) producing outputs (phenotypes) when called with specific configurations/environment inputs. The residue—phenotypes depend on chaotic protein interactions (like unhandled exceptions) and environmental noise—shows the biology talk is looser: it anthropomorphizes DNA as a "blueprint," ignoring that programming lacks equivalents for stochastic, context-dependent outcomes.
