answer: |-
  Below is a meticulously designed negotiation exercise for your seminar, structured in three phases to illuminate the divergence between Nash and Kalai-Smorodinsky solutions without naming them. The exercise uses raffle tickets (convertible to prizes) for incentives, avoids monetary stakes, and includes a detailed timeline, payoff sheets, and contingency plans. The core insight—**monotonicity vs. independence of irrelevant alternatives (IIA)**—emerges organically from student negotiations.

  ---

  ### **Phase 1: Baseline (Symmetric Continuous Split)**  
  *Goal: Establish confidence in a unique, "obvious" solution where Nash and Kalai-Smorodinsky coincide.*  
  **Setup**:  
  - Pairs negotiate splitting 100 raffle tickets (converted to prizes post-class).  
  - Disagreement point: (0, 0) tickets.  
  - Continuous options: Any split (𝐴, 100−𝐴) where 𝐴 is tickets for Player A.  

  **Student Instructions**:  
  > "You have 5 minutes to agree on how to split 100 raffle tickets. If you fail, both get 0. Your goal: Maximize *your own* tickets."  

  **Expected Outcome**:  
  - Students converge on (50, 50). Nash and Kalai-Smorodinsky coincide here (symmetric, linear utilities).  
  - **Debrief seed**: "Why was 50-50 the only fair split? What changed in Phase 2?"  

  **Timeline**: 5 min negotiation + 3 min quick share-out.  

  ---

  ### **Phase 2: Asymmetric Discrete Options**  
  *Goal: Split Nash and Kalai-Smorodinsky visibly, with one favoring each player.*  
  **Key Design**:  
  - Disagreement point: (10, 10) utils (not tickets; see [Table 1]).  
  - Utilities are **non-linear in raffle tickets** to kink the Pareto frontier.  
  - Alternatives computed to ensure Nash and Kalai-Smorodinsky diverge:  
    - **Nash**: Maximizes product of utility gains over (10,10). Favors Player A.  
    - **Kalai-Smorodinsky**: Equalizes *fractional gains* to ideal points. Favors Player B.  

  **Payoff Sheets (Phase 2)**  
  *(Distribute role-specific sheets. Units are "utils," not tickets!)*  

  | Alternative | Player A (utils) | Player B (utils) |  
  |------------|-----------------|-----------------|  
  | I          | 20              | 60              |  
  | II         | 48              | 50              |  
  | **III**    | **62**          | **40**          |  
  | IV         | 65              | 30              |  
  | Disagree   | 10              | 10              |  

  **Student Instructions**:  
  > "Agree on one alternative. If you fail, both get 10 utils. **Your utils convert to raffle tickets: 1 util = 1 ticket.**"  

  **Solution Arithmetic**:  
  - **Nash (max product of gains)**:  
    - Option I: (20−10) × (60−10) = 10 × 50 = 500  
    - Option II: (48−10) × (50−10) = 38 × 40 = 1,520  
    - **Option III**: (62−10) × (40−10) = 52 × 30 = **1,560** (Nash solution)  
    - Option IV: (65−10) × (30−10) = 55 × 20 = 1,100  
  - **Kalai-Smorodinsky (equalize % gains to ideal)**:  
    - Ideal utilities: A’s max = 65 (Option IV), B’s max = 60 (Option I).  
    - Gains ratio: A: `(𝑢𝐴−10)/(65−10)`, B: `(𝑢𝐵−10)/(60−10)`  
    - Option II: min( (48−10)/55, (50−10)/50 ) = min(0.691, 0.800) = **0.691**  
    - Option III: min( (62−10)/55, (40−10)/50 ) = min(0.945, 0.600) = 0.600  
    - **Option II has higher min-ratio** → Kalai-Smorodinsky solution.  

  **Conflict Setup**:  
  - **Player A prefers III** (62 utils).  
  - **Player B prefers II** (50 utils).  
  - *No "fair" solution is obvious; students must argue*.  

  **Timeline**: 10 min negotiation + 5 min share-out (e.g., "Which options caused tension?").  

  ---

  ### **Phase 3: Introduce Irrelevant Alternative**  
  *Goal: Trigger demands for renegotiation from the player whose ideal point rises, violating IIA.*  
  **Key Design**:  
  - Add **Alternative V: (70, 25) utils** (only attractive to A).  
  - This raises A’s ideal utility from 65 to 70, but **neither solution selects V**:  
    - Nash still picks III (gains product = 1,560; V: (70−10)×(25−10) = 60×15 = 900).  
    - Kalai-Smorodinsky still picks II (min-ratio = 0.691; with new ideal, II: min(38/60, 40/50) = min(0.633, 0.800) = 0.633).  
  - **Monotonicity (Kalai-Smorodinsky axiom)**: A’s expanded opportunities *should* entitle her to more.  
  - **IIA (Nash axiom)**: V is irrelevant since neither solution chooses it.  

  **Payoff Sheets (Phase 3)**:  
  *(Add V to Phase 2 sheet. Distribute new sheets quietly.)*  

  | Alternative | Player A (utils) | Player B (utils) |  
  |------------|-----------------|-----------------|  
  | ...        | ...             | ...             |  
  | **V**      | **70**          | **25**          |  

  **Student Instructions**:  
  > "A new alternative (V) is available. Disagreement point and other options are unchanged. You have 12 minutes to renegotiate."  

  **Predicted Conflict**:  
  - **Player A** sees V (70 utils) and demands more (e.g., "I deserve III or IV now!").  
  - **Player B** resists (e.g., "V doesn’t help me; why should anything change?").  
  - *Let them argue—do not intervene*.  

  **Timeline**: 12 min negotiation + 5 min share-out.  

  ---

  ### **Timeline Summary (80 Minutes Total)**  
  | Segment           | Time     | Activity                                                                 |  
  |-------------------|----------|--------------------------------------------------------------------------|  
  | Intro             | 0–5 min  | Explain raffle tickets, roles, and phases.                               |  
  | **Phase 1**       | 5–13 min | Split 100 tickets. Pairs negotiate (5 min); share outcomes (3 min).      |  
  | **Phase 2**       | 13–28 min| Distribute sheets. Pairs negotiate (10 min); share tensions (5 min).     |  
  | **Phase 3**       | 28–45 min| Distribute revised sheets. Pairs renegotiate (12 min); share shifts (5 min). |  
  | **Debrief**       | 45–80 min| Map experiences to theory; name axioms/solutions (detailed below).       |  

  ---

  ### **Debrief Structure**  
  **Start with Student Experiences**:  
  - *Phase 1*: "Why was 50-50 obvious? Symmetry made fairness clear."  
  - *Phase 2*: "What made II vs. III hard? Both seemed 'fair' in different ways."  
  - *Phase 3*: "Did A’s demands change? Why? Did B agree?"  

  **Map to Formal Concepts**:  
  1. **Disagreement Point**: (0,0) in Phase 1 → (10,10) in Phases 2–3.  
     - Both solutions shift when this changes.  
  2. **Ideal Points**:  
     - Phase 2: A=65, B=60.  
     - Phase 3: A=70 (due to V), B=60.  
     - Kalai-Smorodinsky responds to this; Nash ignores it (IIA).  
  3. **Monotonicity vs. IIA**:  
     - "In Phase 3, A said: *My opportunities improved, so I deserve more!* That’s **monotonicity**."  
     - "B said: *V wasn’t chosen, so why change?* That’s **independence of irrelevant alternatives (IIA)**."  

  **Name Solutions and Axioms**:  
  - **Nash**: Maximizes product of utility gains. Obeys *symmetry, IIA*.  
  - **Kalai-Smorodinsky**: Equalizes % gains to ideal utilities. Obeys *monotonicity*.  
  - "Phase 2: Nash picked III; Kalai-Smorodinsky picked II. Phase 3: V widened the gap in your instincts!"  

  ---

  ### **Practicalities**  
  - **Pair Assignments**: 8 pairs (16 students). Assign roles A/B randomly. Rotate partners if repeating.  
  - **Payoff Conversion**: 1 util = 1 raffle ticket. Award prizes via drawing post-class.  
  - **Printed Sheets**: Role-specific utils (see tables above). Include disagreement point.  

  ---

  ### **Predictable Problems & Fixes**  
  **Problem 1: Phase 3 demand shift doesn’t occur**  
  - *Why?* A doesn’t leverage V, or B concedes too easily.  
  - *Pilot signal*: >50% of pairs stick with Phase 2 agreements.  
  - *Fix*:  
    - **Redesign V** to be more tempting (e.g., (75, 25)), or...  
    - **Prime asymmetry**: Assign assertive students as A in Phase 3.  

  **Problem 2: Students fixate on "irrelevant" V**  
  - *Why?* V is salient even if Pareto-inefficient.  
  - *Pilot signal*: Pairs choosing V despite low joint gains.  
  - *Fix*:  
    - Add **Option VI: (55, 45)** to Phase 3. This shifts Kalai-Smorodinsky to VI (min-ratio = min(45/60, 35/50)=0.7), forcing A to demand more and making V clearly irrelevant.  

  **Problem 3: Utilities feel arbitrary**  
  - *Why?* Utils are abstract, unlike tickets.  
  - *Fix*: Emphasize pre-debrief: "Utils measure your satisfaction; your goal is to maximize them."  

  ---

  ### **Core Theoretical Limitation**  
  - **The "Benevolent Arbitrator" Gap**:  
    - Nash/Kalai-Smorodinsky assume a *single arbitrator* with cardinal utilities, not two players negotiating.  
    - Classroom mechanics can’t reproduce this. Students bargain with tactics/power dynamics, not axioms.  
  - **Must Supply by Fiat**:  
    - Debrief explicitly: "These solutions describe how an impartial arbitrator would decide, not how humans negotiate. Your arguments revealed the axioms’ real-world tension."  

  ---

  ### **Least Confident Prediction**  
  **Bet**: In Phase 3, >70% of Player As will demand more (III/IV) after seeing V.  
  - **Vindication Signal**: As insist V justifies renegotiation, leading to deadlock or revised splits.  
  - **Failure Signal**: As accept Phase 2 splits (II/III) without pushback.  
  - **Redesign Trigger**: If <30% of As shift demands, replace V with **VI: (55, 45)** in Phase 3.  
    - Why? VI shifts Kalai-Smorodinsky to (55,45), so A *must* demand more to align with monotonicity.  
    - Pilot Test Metric: Track % of pairs where A’s first offer in Phase 3 exceeds Phase 2’s final agreement.  

  ---

  ### **Why This Works**  
  - **Axioms Emerge Naturally**: Students *feel* monotonicity (A’s Phase 3 entitlement) and IIA (B’s status-quo defense) before formalizing them.  
  - **Predictable Conflict**: Phase 2’s 50-50 illusion shatters; Phase 3’s "irrelevant" V becomes relevant psychologically.  
  - **Debrief Bridges Experience-Theory**: Conflicts in negotiation become axioms in discussion.  

  This exercise transforms abstract axioms into lived experience. If Phase 3 shifts falter, the VI redesign (above) ensures monotonicity surfaces. Let students argue—their friction is the pedagogy!
