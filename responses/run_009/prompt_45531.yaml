answer: |-
  Here is your question-period defense sheet, structured for maximum impact against this specific audience. I've ordered objections by damage potential, phrased them in your opponents' language, provided tight replies, flagged soft spots, and included strategic concessions. The Second-Order Sedative case is resolved decisively at the end.

  **Core Strategy:** Concede formal machinery where you must; pivot relentlessly to the *phenomenology of belief ownership* as the irreducible core. Your goal is not to "win" on Bayesian terms but to expose a dimension they've neglected.

  ---

  **QUESTION-PERIOD DEFENSE SHEET**

  **Concede Up Front (Buy Credibility):**  
  *"I accept van Fraassen's 1995 retreat to self-trust as necessary and correct. My aim isn't to reject that move but to radicalize it: to show that grounding Reflection in self-trust *detaches it from epistemic coherence* and reveals it as a norm governing agency, not belief-state consistency. When self-trust lapses, the rational response isn't just suspension of Reflection—it's active defense."*  
  *(Shows scholarship, narrows target)*

  **Hold No Matter What:**  
  1. **Reflection is not entailed by static coherence (Dutch Books show vulnerability, not inconsistency).**  
  2. **The drugged/brainwashed cases aren't counterexamples—they are boundary conditions revealing the norm's true source.**  
  3. **Self-trust is *not* reducible to credences about reliability; it's a stance toward one's future *as an agent***.

  ---

  **OBJECTIONS (Ordered by Damage Potential)**

  1.  **The Dutch Book Objection (Formal Epistemologist):**  
      *"Your 'self-trust' gloss ignores the formal point: van Fraassen's Dutch Book shows that violating Reflection *at t0* licenses a sure loss *at t0* against a cunning bookie exploiting the *contradiction* between your current credence and your commitment to future credences. This is a flaw in *current* coherence, not future 'wisdom'. Denying this is denying the foundational meaning of Dutch Books in diachronic rationality."*  
      **Damage:** Highest. Attacks the core technical argument.  
      **Reply (2 min):** "The bookie's exploitation *presupposes* the agent's *practical commitment to identify with their future self*. The 'sure loss' isn't triggered by the credence pair <P_t0(H), P_t0(P_t1(H)=x)> alone. It requires the agent *at t0* to accept bets they would reject *at t0* if they didn't anticipate *being bound by their future assessment at t1*. The vulnerability arises from their *self-investment*, not logical inconsistency. An agent who genuinely disowns t1 (e.g., knowing they'll be brainwashed) would *rightly* reject the t0 bet setup as misrepresenting their agential position. The Dutch Book reveals a pragmatic vulnerability contingent on self-identification, not a timeless incoherence."  
      **Soft Spot:** Hardliners will insist commitment to future credences *is* part of current coherence. **Pivot:** "If it's coherence, why does the vulnerability vanish precisely when self-trust vanishes? Coherence norms shouldn't be context-sensitive like that."

  2.  **The Novelty/Objection (Van Fraassen Scholar):**  
      *"Van Fraassen (1995, 'Belief and the Problem of Ulysses’) already reframed Reflection as relying on trust in one's future rational integrity, explicitly rejecting the unrestricted principle. Your 'restriction' sounds identical. What distinguishes your view beyond terminology?"*  
      **Damage:** High. Undercuts perceived contribution.  
      **Reply (2 min):** "Van Fraassen deserves credit for anchoring Reflection in self-ttrust. My departure is twofold. First, I argue this move *severs Reflection from epistemic coherence proper* – it becomes a norm of *diachronic agency*, not belief-state consistency. Second, and crucially, van Fraassen focuses on trust in *future rationality*. I argue the core is trust in *future *ownership***. When that ownership lapses (as in my Second-Order Sedative case), *even if future rationality is trusted*, Reflection doesn't apply. Conversely, the obligation shifts: not just suspending deference, but *actively defending against* the future self you disown – the 'precommitment' move. Van Fraassen patches the principle; I argue it was tracking agency all along."  
      **Soft Spot:** Requires careful reading of vF 1995. **Pivot:** Clarify the Ownership vs. Rationality distinction using the Sedative case.

  3.  **Pragmatist Confidence Trick (Phil. of Science):**  
      *"You admit Reflection isn't epistemic. But then 'self-trust' smuggles in a *pragmatic* or *prudential* norm – surviving Dutch Books, avoiding self-sabotage – and dresses it as epistemology. Isn't this just the old pragmatist bait-and-switch: making epistemic rationality serve practical ends?"*  
      **Damage:** High. Undermines your core re-description project.  
      **Reply (2 min):** "It's not pragmatism. Self-trust, as I define it, isn't about *practical* benefits (avoiding losses, succeeding in projects). It's about maintaining oneself *as a believing agent over time*. The 'norm' violated when one disowns a future self but fails to defend against it isn't imprudence; it's a *failure of epistemic self-governance*. You cease to function as a unified locus of belief formation and revision. The Dutch Book vulnerability is a *symptom* of this fractured agency, not its *justification*. This is squarely within epistemic normativity: governing how we *ought* to relate to our own belief-forming capacities across time *as knowers*."  
      **Soft Spot:** Distinguishing "epistemic self-governance" from pragmatism is subtle. **Hold Firm:** The norm governs *how we hold beliefs across time as epistemic agents*, not how beliefs serve our goals.

  4.  **The 'Why Call it Rationality?' Objection (Decision Theorist):**  
      *"If Reflection reduces to 'self-trust' and you concede it's not entailed by coherence, why retain the language of 'rationality'? Isn't this just a psychological disposition? Rationality demands impersonal justification, not self-help."*  
      **Damage:** Medium-High. Questions the framework.  
      **Reply (2 min):** "Because the demand for unified agency *is* a rational demand inherent in the project of *being* a diachronic reasoner. It's not mere psychology any more than the requirement for logical consistency in a synchronic credence function is 'mere psychology'. Consistency governs the *structure* of belief at a time; self-trust (as ownership) governs the *identity* of the believer across time. Without this minimal self-continuity, diachronic epistemology collapses into managing disparate time-slices. We *presuppose* this continuity in all diachronic norms (e.g., updating). Reflection, properly restricted, makes this presupposition explicit and normative."  
      **Soft Spot:** "Inherent in the project" sounds circular. **Pivot:** Ask if they truly model agents as *utterly* disconnected time-slices. If not, what grounds the connection? That's where self-trust operates.

  5.  **The Trivialization Worry (Formal Epistemologist):**  
      *"Your 'restriction' seems vacuous. If self-trust is necessary for Reflection to bind, and self-trust can be withdrawn whenever it's convenient (e.g., whenever I anticipate changing my mind unwelcomely), doesn't this render the principle toothless? It seems I can always avoid its demands by declaring insufficient self-trust."*  
      **Damage:** Medium. Questions operational value.  
      **Reply (2 min):** "Self-trust isn't a get-out clause; it's a *precondition* deeply embedded in our default epistemic stance. We *presume* ownership of our future beliefs absent specific defeaters (like knowing we'll be drugged or brainwashed, or experiencing the Second-Order Sedative effect). The burden of justification lies on *withdrawing* self-trust, not on maintaining it. My account explains *why* the standard counterexamples work – they *are* valid defeaters for self-trust – and crucially, what fills the normative vacuum when self-trust *is* withdrawn: the demand for defense. This doesn't trivialize Reflection; it clarifies its context and limits."  
      **Soft Spot:** Requires defending "default self-trust" as robust. **Use Sedative:** Contrast the *default* (ownership) with the Sedative-induced *loss* of ownership as evidence that self-trust is a real, defeasible state.

  ---

  **THE SECOND-ORDER SEDATIVE CASE: RESOLVED**

  *   **Does it help or hurt?** It **STRENGTHENS** your restriction decisively.
  *   **How to Use It:** "The Sedative case isolates the *ownership* component. The patient trusts their future *rationality* (1st-order beliefs track evidence!), but lacks trust in future *ownership* (beliefs aren't *hers as an agent*). Reflection intuitively doesn't bind her. This proves the norm requires *more than belief in future reliability*; it requires *anticipating being the author* of that future state. Van Fraassen's 'rational integrity' isn't enough. This is the key ingredient my restriction captures."
  *   **How to Survive if Used Against You:** If someone claims "self-trust" is vacuous here ("She just has low credence in ownership!"), counter: "The Sedative *causes* the loss of ownership phenomenology. It's not about credences *describing* that state; it *is* the state. Reducing the feeling of 'my future belief' to a high-order credence *is* the mistake. The case shows the phenomenology is primary. Credences about ownership *track* this stance; they don't constitute it. If she *feels* her future belief as an external event, no coherent credence assignment *at t0* makes Reflection binding – because she cannot *practically commit* to identifying with t1."
  *   **Conclusion on Sedative:** It's your strongest evidence for the necessity of *ownership* over mere *rationality prediction*. Hammer it.

  ---

  **THE QUESTION YOU HOPE NOBODY ASKS (But Must Prepare For)**

  *   **The Objection:** "If violating Reflection only makes one vulnerable *if* one maintains self-trust, and withdrawing self-trust (when rational) voids the norm entirely, isn't the 'norm' just the trivial imperative: *'If you trust your future self, defer; if not, defend'*? What substantive *epistemic* work is it doing beyond describing contingent attitudes? Where's the *ought*?"
      **Damage:** Potentially Fatal. Attacks normative force.
      **Reply (2 min - Gritty Defense):** "The 'ought' binds the *transition*. It's not contingent. The norm is: *'Maintain coherence between your stance toward your future self and your actions regarding it.'* If you trust (ownership), incoherence lies in *failing* to defer (the classic Reflection violation). If you distrust (no ownership), incoherence lies in *failing* to defend (e.g., carelessly accepting Dutch Book bets). The core epistemic 'ought' is *diachronic self-alignment according to your agential stance*. The Sedative patient who feels no ownership *but still defers out of habit* is making a mistake – not of coherence, but of self-misalignment. *That* is the substantive, non-contingent norm my account reveals: align your diachronic epistemic actions with your stance toward your future epistemic agency."  
      **Soft Spot:** "Self-alignment" may sound vague or non-epistemic. **Final Stand:** "This *is* the deep structure of diachronic epistemic rationality: managing the relationship of the epistemic self over time. Reducing it to synchronic coherence or mere pragmatics misses this essential dimension."

  ---

  **DELIVERY NOTES:**

  *   **Pace:** Slow down replies. Start with "That's a crucial point..." to buy time.
  *   **Vocabulary:** Use *their* terms ("Dutch Book", "coherence", "credence") precisely when replying, then pivot to your frame ("agency", "ownership", "defense").
  *   **Credibility:** Cite van Fraassen 1995 early. Acknowledge Dutch Books show *vulnerability*.
  *   **Strength:** Be relentless on the Ownership vs. Reliability distinction (Sedative is key). Hold the line on the shift to Defense.
  *   **Honesty:** On novelty: "I refine and radicalize van Fraassen's self-trust move, highlighting ownership and the duty to defend."

  You're re-framing the debate. Your goal isn't to convince them your reframing *is* epistemology, but to force them to argue *why agency and ownership aren't central to diachronic rationality*. That's a win. Good luck.
