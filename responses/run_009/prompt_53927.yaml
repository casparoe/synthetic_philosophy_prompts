      *   (Operational Mon-Thu: 09:30-12:00 & 14:00-16:30 CET/CEST. Please allow up to 18 working weeks for a substantive response to sovereignty-related enquiries).
  *   **Postal Address:** DG RECOVER, European Commission, Rue de la Loi / Wetstraat 200, 1049 Brussels, Belgium.
  *   **Please note:** Visits to DG RECOVER offices are by prior appointment only, subject to availability and security clearance procedures coordinated at Union level.
