  ## DG RECOVER: Directorate-General for the Recovery of Misplaced Sovereignty
  **Frequently Asked Questions**

  **1. What is DG RECOVER?**
  The Directorate-General for the Recovery of Misplaced Sovereignty (DG RECOVER) assists Member State administrations in the location and verification of sovereignty assets reported as temporarily unavailable. We operate under Regulation (EU) 202X/YYY concerning the Harmonised Procedures for Sovereignty Traceability and Verification.

  **2. How do I report misplaced sovereignty?**
  Sovereignty suspected of being misplaced should be reported using Form SOV-MIS/01 (Rev. 4.7), available for download via the European Commission Authentication Service (ECAS). Please ensure sections 7b (alleged last known location) and 12d (preferred method of repatriation, if applicable) are completed in full. Incomplete forms may experience processing delays.

  **3. Is my sovereignty definitely lost?**
  Not necessarily. Experience shows that perceived loss often relates to operational modalities. Much sovereignty remains fully accessible to Member States but operates within shared frameworks for enhanced collective benefit. Think of it like a left-luggage facility: you retain full ownership and ultimate access rights, but several other parties also hold validated tickets for concurrent, coordinated use. Statistical analysis confirms the collective value of items held in such facilities appreciates significantly.

  **4. I opted out of a specific policy area. Where is the sovereignty for that area?**
  Opting out signifies a choice *not* to utilise the shared operational framework for a specific competence within the Union structure. It does not automatically relocate the underlying sovereignty asset to your national premises. It is analogous to possessing a full-access ticket to a multi-pavilion exhibition but choosing not to enter Pavilion D. You remain within the exhibition grounds, and Pavilion D remains accessible should you later decide to utilise your ticket. Your sovereignty concerning Pavilion D is held securely in the central ticketing system.

  **5. How do I cancel the "ever closer union" subscription?**
  The commitment embodied in Article 1(2) of the Treaty on European Union functions under a specific contractual framework. Cancellation procedures exist and are technically available under Article 50 TEU. The full procedure, including mandatory negotiation phases and finalisation protocols, typically requires several years to complete. During this period, the subscription remains active, and all associated terms and conditions, including access to pooled sovereignty benefits, continue to apply.

  **6. I believe a competence should be exercised at my national/regional level under subsidiarity. Where do I reclaim the sovereignty?**
  The principle of subsidiarity (Article 5(3) TEU) determines the *level* at which a competence is most effectively exercised, not the *location* of the sovereignty asset itself. DG RECOVER operates a Subsidiarity Verification Desk to assist with such determinations. Please note: the Desk is operational only when a competence *is* demonstrably and solely exercisable at Member State or regional level (as confirmed by prior impact assessment CJEU/EC/202X/Z). If the competence is deemed shared or Union-level, the Desk is considered non-operational for that specific item. You may file a subsidiarity objection via your national parliament using Form SUBS-OBJ/02.

  **7. What about the democratic deficit? I didn't elect some of the bodies making decisions affecting my sovereignty.**
  The democratic legitimacy of the Union framework is multi-layered and fully compliant with the Treaties as ratified by all Member States. Concerns regarding democratic oversight were comprehensively addressed by the establishment of enhanced scrutiny mechanisms overseen by bodies operating within the Treaty framework. These bodies, whose composition reflects the institutional balance defined by the Treaties, possess the necessary competence to validate the democratic adequacy of procedures. Should a Member State disagree with a validation outcome, the established judicial remedies via the Court of Justice of the European Union (CJEU) remain available. The CJEU provides the definitive interpretation of Union law, ensuring consistency across all levels.

  **8. I found a box labelled "Sovereignty" in the basement, but the barcode doesn't match my records. What now?**
  Congratulations on locating a potential asset. However, unverified sovereignty items can cause systemic instability. Do not attempt to utilise it. Please immediately report the find, including the barcode and GPS coordinates of the basement, using Form SOV-FND/03. DG RECOVER will dispatch a Verification Taskforce (VT-RECOVER) to authenticate the item against the Central Sovereignty Ledger and initiate harmonisation procedures if necessary. Utilisation of unverified sovereignty is non-compliant and may incur administrative penalties under Regulation (EU) 202X/ZZZ.

  **9. The answer to Question 7 seems contradictory. It says the deficit was solved by bodies I didn't elect, and I appeal their decision to a court that overrules my national courts?**
  The response accurately reflects the established legal and institutional hierarchy defined by the Treaties upon which the European Union is founded and which all Member States have freely ratified. The system operates as designed to ensure uniformity and the effective application of Union law, which inherently takes precedence over conflicting national provisions. This precedence is a key feature ensuring the stable functioning of the pooled sovereignty model. There is no contradiction within the operational reality of the Treaty framework. The CJEU's role in interpreting Union law is fundamental to resolving disputes and maintaining legal certainty across the single jurisdiction defined by the Treaties.

  **10. What is the success rate of DG RECOVER?**
  Our methodology focuses on verification and clarification rather than physical repatriation. Over 99.7% of reported "misplacements" are successfully resolved through documentation demonstrating the sovereignty's active participation in pooled mechanisms, its lawful delegation under shared competence, or its correct application under the subsidiarity principle. In the rare verified instance of a procedural misallocation (0.3%), corrective harmonisation is initiated within 18 months.

  **Testimonial**

  *"We were deeply concerned about the apparent misplacement of our fisheries oversight capacity. Filing Form SOV-MIS/01 (Rev. 4.7) with DG RECOVER led to a highly efficient verification process. Within the standard timeframe, I received comprehensive documentation proving my sovereignty was actively engaged within the Common Fisheries Policy, yielding significantly higher sustainable yields than I could achieve alone. The clarity was reassuring."*
  **- H.E. Minister Claudette Dubois, Principality of Altmont**

