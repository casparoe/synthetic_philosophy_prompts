answer: |-
  ## Philosophical Advisory Memorandum: On the "Luck-Neutralizing Statute" and Resultant Moral Luck

  **To:** Graduate Seminar Participant  
  **From:** Philosophical Consultant  
  **Subject:** Defensibility of Sentencing Parity Statute & Verdict on Resultant Moral Luck  

  ### I. Brainstorming: Core Considerations

  The proposed "luck-neutralizing statute" presents a profound challenge at the intersection of ethics, law, and metaphysics. Let us first map the key arguments before adjudicating.

  **Arguments FOR the Statute's Philosophical Defensibility:**
  1.  **Control Symmetry:** The core action – forming the intent to kill, aiming the weapon, pulling the trigger – is identical in attempt and completion. The actual death hinges on factors beyond the agent's control (e.g., a gust of wind, victim's slight movement, bullet defect, swift medical intervention). Punishing solely based on factors within the agent's control (intention and action) aligns with foundational principles of just desert. Resultant luck *should* be irrelevant to *blameworthiness*.
  2.  **Moral Equivalence of Risk Imposition:** Both actors manifest the same vicious will and impose the same *unjustified lethal risk* upon the victim. Society is equally wronged by the malicious intent and the act of attempting murder; the completed harm is a tragic amplification, but not a moral augmentation of the *agent's guilt*.
  3.  **Consistency Demand:** If one denies resultant moral luck (RML) – holding that luck cannot affect true moral blameworthiness – then sentencing disparity is fundamentally unjust, punishing two equally blameworthy agents differently due to chance. If RML *is* real, but we deem it unfair to punish based on luck, then neutralizing it via identical sentences becomes a conscious policy choice to correct for that unfairness. The statute seems robust on either view.

  **Arguments AGAINST the Statute's Philosophical Defensibility:**
  1.  **Conflation of Blameworthiness and Liability/Object of Blame:** Blameworthiness concerns the agent's state and choices. However, *what* we blame them *for* differs. The completed murderer is blameworthy *for causing a death*, the attempter *for attempting to cause a death*. These are distinct objects of assessment. The statute ignores the morally significant difference in the *harm actually realized* through the agent's action, a difference constitutive of the wrong done. Punishment often responds not just to culpability but to the *nature and extent of the harm caused*.
  2.  **The Phenomenology of Regret and Blame (Williams-Inspired - Contested Interpretation):** Bernard Williams emphasized "agent-regret," a sentiment felt specifically *because* one caused a bad outcome, even if unintentionally. There is a powerful intuition that causing death *changes* the moral landscape *for the agent* and our response *to them* in a way mere attempt does not. Denying this difference feels like a denial of the significance of actual harm in our moral ecology. The completed murderer bears a unique burden and relationship to the victim's family/society that the attempter does not. Sentencing should reflect this.
  3.  **Practical Agency and Responsibility:** Our practices of holding responsible are deeply intertwined with outcomes. We punish negligent drivers who *cause* accidents more severely than those who drive identically recklessly but, by luck, cause no harm. This isn't (necessarily) inconsistent; it acknowledges that responsibility *includes* answering for the consequences of our risky actions, even those mediated by luck. The statute severs this link artificially.
  4.  **Danger of Over-Correction:** Eliminating *all* consideration of results risks making punishment insensitive to the actual moral damage inflicted. It treats the universe's cooperation in realizing the intended harm as irrelevant, potentially diminishing the gravity of actual death.

  ### II. Verdict: The Statute is Philosophically Indefensible

  **My definite position is that the "luck-neutralizing statute" is not philosophically defensible, and that resultant moral luck (RML) is a genuine, inescapable feature of our moral practices and judgments, though deeply problematic.**

  **Core Argument:**
  1.  **Blameworthiness is Agent-Centered, but its Object is World-Involving:** While an agent's blameworthiness is grounded in their intentions, knowledge, and choices (factors largely within their control), the *specific content* of what we hold them responsible *for* is necessarily determined by the actual outcomes of their actions in the world. We blame the driver who *kills* a child for *killing a child*; we blame the driver who *nearly* kills a child for *nearly killing a child*. These are distinct wrongs because the relationship between the agent's action and the state of the world is fundamentally different.
  2.  **Harm is Constitutive, Not Merely Evidentiary:** The occurrence of the death isn't just *evidence* of the attempter's bad character or dangerousness; in the case of the completed murder, the death is the *realization* of the very harm the agent intended and acted to bring about. It completes the wrong in a way the attempt does not. Punishment responds not only to the dangerous state of mind but to the *actual violation* of the victim's right to life that was successfully executed. The statute treats the completed harm as morally inert regarding the perpetrator's desert, which misrepresents the nature of the wrong.
  3.  **RML is Unavoidable in Practice (Nagelian Point - Contested Interpretation):** While Thomas Nagel finds RML deeply troubling and paradoxical from a purely internalist perspective ("the problem of moral luck"), his analysis powerfully demonstrates its pervasiveness. We *cannot*, in practice, isolate our judgments of agents entirely from the results of their actions. The driver who kills the child *feels* differently (agent-regret), *is seen* differently by others, and *is treated* differently by the law, precisely *because* they caused death. This isn't mere irrationality; it reflects that our moral concepts are embedded in a world where outcomes matter. Denying this in sentencing creates an artificial, detached moral calculus that fails to resonate with the lived experience of responsibility. **Premise Confidence: High.** The descriptive claim about our practices is undeniable. The normative claim that these practices reflect a deep, if problematic, truth about responsibility is where the contest lies, but I find it compelling.
  4.  **The Statute Creates its Own Moral Luck:** Ironically, the statute itself introduces a new form of potentially arbitrary luck. Under it, the sentence an offender receives for firing a lethal shot with intent to kill becomes heavily dependent on factors *other* than their control: the efficiency of emergency services, the location of the wound, the victim's constitution, or even prosecutorial decisions about whether to charge attempt or murder if the victim dies later. The attempt to eliminate resultant luck displaces it rather than abolishes it.

  **Addressing the "Defensible Either Way" Argument:** This argument proves too much. If RML is unreal, then sentencing disparity *is* unjust, but the statute's solution – erasing the distinction between attempt and completion – is a blunt instrument that ignores the different *objects* of blame (intended death vs. actual death). A more nuanced approach recognizing equivalent *culpability* but different *harm* (e.g., mitigated sentences for attempts, not parity) might be preferable. If RML is real, then the statute *overrides* a morally relevant factor (the actual harm caused) based on a disputed philosophical claim about fairness. It imposes a radical revisionism on our responsibility practices without sufficient justification. The statute isn't robust; it's problematic under both interpretations, just for different reasons.

  **Which Premises Do the Most Work?**
  *   **Most Confident & Foundational:** The premise that *what we hold an agent responsible for* (the object of blame) is constitutively determined by the actual outcomes of their voluntary actions. This is an observation about our core moral and legal concepts. Punishment responds to wrongs *done*, not merely wrongs *intended* in abstraction. The statute severs this link.
  *   **Crucial but More Contested:** The premise that our inescapable susceptibility to RML (as described by Nagel and the phenomenology noted by Williams) reflects a genuine, non-eliminable aspect of responsibility in a contingent world, not merely an error. Denying it requires constructing an implausibly internalist and world-independent account of blame.

  ### III. Conclusion

  While the impulse behind the luck-neutralizing statute – to focus punishment on what the agent controls – is morally serious and highlights the genuine puzzle of resultant luck, the statute itself is philosophically indefensible. It fails because it conflates the *culpability* of the agent (which may be equivalent in attempt and completion) with the *nature of the wrong* committed (which differs fundamentally based on the result). Resultant moral luck, though philosophically troubling and seemingly at odds with a pure control condition for responsibility, is a genuine feature of our moral universe. Our practices of holding responsible are inherently responsive to the actual consequences of actions because those consequences define the specific harm we blame the agent for causing. To ignore the difference between causing death and attempting to cause death in sentencing is not to neutralize luck; it is to ignore a morally salient dimension of the act for which we hold the agent responsible. Legislators should reject the statute. Philosophers must continue grappling with the uncomfortable reality of resultant luck, not legislate it away.
