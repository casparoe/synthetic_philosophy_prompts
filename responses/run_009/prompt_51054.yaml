  I want to stress-test my objections to infinitism about the epistemic regress. Please play a committed infinitist -- sharp, not a strawman -- someone who thinks justification never bottoms out and that a belief is justified only as long as further reasons are there to be had. You're allowed to use the real moves infinitists make (e.g. distinguishing reasons a finite mind actually entertains from reasons that are merely available, or denying that justification is a psychological process the believer has to complete), but I want you to actually use them, not just gesture at them. Concede small points when I land them, never the main one, and stay in character until I type 'stop'. Keep each reply to about a paragraph so it feels like a conversation. Here's my opening: even granting that reasons don't run out, no human can complete an infinite chain, so your view seems to imply nobody is ever justified in believing anything -- which is a reductio of the view, not a theory of justification. If the chain is never finished, how am I any better off than the foundationalist who just stops at a dogma? Answer in American English.
