prompt: |-
  I'm a palliative care nurse practitioner and I chair the ethics consult team at a mid-size hospital, and a huge share of our consults are about the same thing: a patient who can't tell us what they want anymore, an advance directive or a statement in the chart from when they could, and a surrogate (usually a spouse or adult kid) pointing at the person in the bed saying "but look at her, she's happy, she said that years ago." We keep improvising. I want an actual written procedure the consult team can run in under an hour with the chart and the family in the room, based on whatever the philosophy of precedent autonomy actually supports -- the idea that the earlier, competent self gets to set direction for the later self, and the various reasons people have doubted that (the person now isn't harmed in the usual way by overriding it, current preferences can seem more real than stale documented ones, etc.). The procedure should say: which questions to ask in what order, what counts as a good enough answer to each, where it terminates with "follow the directive" or "follow the surrogate," and where it honestly hands off to a values judgment no procedure can make. It has to handle the hard distinctions, like whether the directive was meant to cover this exact situation vs. being read onto it, whether the person's earlier stated reasons still apply, and whether the current patient's contentment should count for anything. Then run it on three cases we actually get: (1) a directive refusing antibiotics written by a patient who now has moderate dementia and is reportedly enjoying her days on the unit, family wants the antibiotics; (2) a directive refusing feeding tubes where the directive is specific to stroke but the patient is now in a different, worse condition from a degenerative disease; (3) a young man's written refusal of treatment that his family says was made during a depressive episode he was never treated for, and there's no way to check. Pick a definite position on where the earlier self's authority ends and say so -- don't give me a menu of views. And be upfront about where the procedure will misfire, including at least one case type where following it will give the family an answer they'll hate and we'll have to live with that.
reasoning: |-
  Okay, the user is a palliative care nurse practitioner who chairs an ethics consult team. They're dealing with a common issue: advance directives being challenged by surrogates who point to the patient's current apparent happiness. They want a structured, efficient procedure based on precedent autonomy that can be completed within an hour. 

  First, I need to grasp the core philosophical stance they're asking for. Precedent autonomy means the competent prior self's decisions should govern. But there are challenges, like whether the directive applies to the current situation or if the patient's current state matters. The user wants clear boundaries on when to follow the directive vs. the surrogate, and where it becomes a values judgment.

  The user specified three case examples. Each tests different aspects: applicability of the directive to the current condition, changes in circumstances, and decision-making capacity issues. The procedure must handle these nuances. 

  I should start by outlining key principles. Precedent autonomy is primary unless specific conditions are met to override it. The "then-self" has authority unless the directive is invalid or inapplicable. Current contentment shouldn't override unless it indicates the directive no longer aligns with the patient's enduring values.

  For the structure, a flowchart makes sense. Step-by-step questions that lead to clear endpoints. The steps need to be practical, using chart review and family input. Each decision point must have objective criteria to avoid ambiguity. 

  Step 1 checks if the directive exists and is valid. If not, surrogate decides. Step 2 assesses applicability: does the condition match? If no, surrogate decides. Step 3 looks for explicit revocation. Step 4 examines changed circumstances. Only if all these are satisfied does the directive stand. Otherwise, defer to surrogate.

  For case applications: 
  Case 1 (dementia, refuses antibiotics) likely follows directive. Applicable, no evidence of change in values. 
  Case 2 (refusal for stroke, now degenerative disease) might defer to surrogate if the degenerative state is worse than anticipated. 
  Case 3 (refusal during depression) hinges on whether mental health impaired capacity. If evidence suggests impairment, override directive.

  The user also wants transparency on limitations. The procedure might fail when the patient's current contentment leads families to disregard past wishes, causing distress. Also, if surrogates are obstructive, the process could stall. 

  Need to emphasize that the procedure prioritizes autonomy, even if it causes family discomfort. The ethics team must support families through this, explaining the rationale clearly. 

  Finally, ensuring the procedure is efficient. Using a flowchart with specific questions and time limits per step. Documentation should be straightforward to maintain consistency. 

  This approach respects the user's need for a practical tool rooted in philosophy while addressing real-world challenges. It provides clarity but acknowledges where human judgment is unavoidable.
answer: |-
  Here’s a concrete, precedent autonomy-based procedure for ethics consults, designed for efficiency (≤60 mins) and decisiveness. The core philosophy: **The competent prior self’s documented wishes are binding unless evidence proves they are inapplicable or invalid.** Current contentment is irrelevant unless it signals a fundamental shift in values (extremely rare). "Changed circumstances" only override if the directive *explicitly* couldn’t have anticipated them.

  ---

  ### **Procedure: Precedent Autonomy Assessment Protocol (PAAP)**
  **Time Allotment:** Chart Prep (15 mins), Family Meeting (30 mins), Documentation (15 mins)  
  **Tools Needed:** Advance directive, medical chart, surrogate(s).  
  **Philosophical Anchor:** The "then-self" sets binding terms; the "now-self" lacks capacity to revise them. Surrogates are interpreters, not overriders.

  #### **Step 1: Directive Existence & Validity (5 mins)**
  *   **Question:** *"Is there a clear, written directive refusing specific interventions applicable to the current clinical situation?"*  
  *   **Threshold:** Directive exists + is signed/witnessed + specifies refusal (e.g., "no antibiotics for infection in advanced dementia").  
  *   **Termination Point:** **If NO → Follow surrogate.** (No binding directive exists).  
  *   **If YES → Proceed to Step 2.**

  #### **Step 2: Applicability Scrutiny (10 mins)**
  *   **Question:** *"Does the patient’s current condition match the clinical scenario described in the directive?"*  
  *   **Threshold:** **Strict construction.** Directive applies ONLY if:  
      *   The *diagnosed condition* (e.g., "moderate Alzheimer's dementia") matches, OR  
      *   The *functional state* described (e.g., "unable to recognize family") matches current reality.  
  *   **Termination Point:**  
      *   **If MATCH → Proceed to Step 3.**  
      *   **If NO MATCH → Follow surrogate.** (e.g., Directive refuses tubes for "severe stroke," but current condition is end-stage ALS with locked-in syndrome – different pathophysiology/experience).  
      *   **If AMBIGUOUS → Proceed to Step 3.**

  #### **Step 3: Revocation Assessment (5 mins)**
  *   **Question:** *"Is there documented evidence the patient revoked or materially altered this directive while still competent?"*  
  *   **Threshold:** **Written/clear verbal revocation to care team.** Hearsay from family ("She told me last year...") is insufficient. Chart notes trump family recollection.  
  *   **Termination Point:**  
      *   **If REVOKED → Follow surrogate.**  
      *   **If NO REVOCATION → Proceed to Step 4.**

  #### **Step 4: Changed Circumstances Test (10 mins)**
  *   **Question:** *"Is there objective evidence that circumstances exist which the directive *explicitly* could not anticipate AND that fundamentally alter the directive’s rationale?"*  
  *   **Threshold:** **Exceptionally high.** Requires both:  
      1.  The circumstance is **medically unprecedented** relative to the directive's context (e.g., directive based on fear of intractable pain, but now pain is fully controllable with new tech).  
      2.  The **core value behind the refusal** is objectively negated (e.g., directive refusing treatment to avoid being a "burden," but family *unanimously* testifies patient now sees their care as meaningful).  
      *   *"She seems happy" is NEVER sufficient evidence.* Contentment ≠ retained decision-making capacity or value shift.  
  *   **Termination Point:**  
      *   **If CHANGED CIRCUMSTANCES PROVEN → Follow surrogate.**  
      *   **If NOT PROVEN → FOLLOW THE DIRECTIVE.**  

  ---

  ### **Case Applications Using PAAP**

  1.  **Case: Dementia Patient, Directive Refusing Antibiotics**  
      *   **Step 1:** Directive exists (refuses ABX for infection in dementia). **YES → Step 2.**  
      *   **Step 2:** Current condition (moderate dementia) matches directive's scope. **MATCH → Step 3.**  
      *   **Step 3:** No evidence of revocation. **NO REVOCATION → Step 4.**  
      *   **Step 4:** "Happiness" ≠ changed circumstance. No evidence directive's rationale (e.g., avoiding prolonged decline) is negated. **CHANGED CIRCUMSTANCES NOT PROVEN.**  
      **OUTCOME: FOLLOW DIRECTIVE → Withhold antibiotics.** Family's distress about "happiness" is acknowledged but does not override.

  2.  **Case: Directive Refusing Tubes for Stroke, Now Degenerative Disease**  
      *   **Step 1:** Directive exists (refuses feeding tubes for "severe stroke"). **YES → Step 2.**  
      *   **Step 2:** Current condition (e.g., End-stage Parkinson's with dysphagia) is *pathophysiologically distinct* from stroke. Functional state may be similar, but directive is **condition-specific**. **NO MATCH.**  
      **OUTCOME: FOLLOW SURROGATE.** Directive doesn't bind for this novel condition.

  3.  **Case: Young Man’s Refusal During Untreated Depression**  
      *   **Step 1:** Directive exists (refuses life-sustaining treatment). **YES → Step 2.**  
      *   **Step 2:** Directive likely applies (e.g., "if permanently unconscious or severely demented"). **ASSUME MATCH → Step 3.**  
      *   **Step 3:** No documented revocation. **NO REVOCATION → Step 4.**  
      *   **Step 4:** *Critical Test:* **Was the depression SEVERE enough at the time of signing to invalidate competence?** Evidence needed:  
          *   Chart notes diagnosing severe depression *proximate to signing*.  
          *   Direct quotes in directive reflecting hopelessness/despair (e.g., "life is meaningless").  
          *   Absence of rationales tied to enduring values (e.g., autonomy, burden).  
          *   *Family testimony alone is insufficient.*  
      *   **Termination:**  
          *   **If COMPETENCE PROBABLY IMPAIRED → Follow surrogate.**  
          *   **If INSUFFICIENT EVIDENCE OF IMPAIRMENT → FOLLOW DIRECTIVE.**  
      **OUTCOME (Likely): INSUFFICIENT EVIDENCE → FOLLOW DIRECTIVE.** Depression alone ≠ incompetence; requires proof it materially distorted understanding/choice.

  ---

  ### **Definitive Position on Authority**
  **The earlier self’s authority ends ONLY when:**  
  1.  The directive is invalid (procedurally flawed).  
  2.  The directive is inapplicable to the *exact* clinical scenario (strict construction).  
  3.  **Documented evidence** proves the directive was revoked or signed under conditions negating competence (e.g., delirium, severe untreated mental illness *at the time of signing*).  
  4.  **Objective, unprecedented circumstances** exist that *directly and completely* negate the *core value* underpinning the refusal (rarely met).  

  **Current contentment, "changed personality," or surrogate distress are NEVER sufficient grounds for override.** The prior self consented to future incapacity; their foresight merits deference.

  ---

  ### **Where This Procedure Misfires (And You Must Live With It)**
  **The Case:** A patient with early dementia writes a directive refusing all hospitalization/IV treatment, valuing independence above longevity. They later develop moderate dementia in assisted living, appearing content. They develop easily treatable pneumonia. Family insists hospitalization/IV antibiotics, saying "She loves bingo and smiles constantly! She’d want treatment now!"  
  *   **PAAP Outcome:**  
      *   Directive exists/applies (dementia + infection).  
      *   No revocation.  
      *   "Smiling at bingo" ≠ proof her core value (independence) changed. Controllable infection isn’t an "unprecedented circumstance" negating the directive's rationale.  
      **→ FOLLOW DIRECTIVE → No hospitalization/IV antibiotics.**  
  *   **Why it Misfires:** The family (and maybe staff) will see a treatable infection ending a "happy" life and perceive this as cruel rigidity. They may accuse you of valuing a "dead document" over a living person.  
  *   **Living With It:** This is the hard edge of precedent autonomy. Explain: "Her past self anticipated this exact decline and chose freedom from medical intervention over prolonged life in this state. We are bound to honor *her* choice to define a good death on her terms, even if her current smile makes it painful for us." Offer grief support, not compromise.

  ---

  **Implementation Notes:**  
  *   **Document Rigorously:** Use a structured PAAP template in the ethics note.  
  *   **Script Key Phrases:** "Our role isn't to decide what's best now, but to determine what *she decided* when she could."  
  *   **Timekeeper:** Assign a team member to enforce time limits.  
  *   **Train Surrogates Early:** Embed PAAP logic in advance care planning conversations to set expectations.  

  This procedure provides consistency, honors autonomy, and forces tough evidence-based decisions – accepting that protecting the prior self's choices will sometimes cause profound distress in the present.
