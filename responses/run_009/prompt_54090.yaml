answer: |-
  ## Final Exam Question: Scanlon, Aggregation, and the Limits of Contractualism

  **Case:** The town of Riverton has a one-time public health grant of $5 million. Two proposals are under consideration:

  1.  **Reservoir Retrofit (Option A):** Funds would upgrade the aging water treatment plant. This would definitively prevent a predictable, unavoidable contaminant release next spring. Without the retrofit, *every one* of Riverton's 40,000 residents would suffer a single, identical episode: 48 hours of severe nausea, vomiting, and debilitating weakness, requiring bed rest. Recovery is complete with no lasting effects. No resident would experience this illness more than once.
  2.  **Pediatric Mobility Program (Option B):** Funds would establish a specialized clinic and provide cutting-edge gene therapy. This would definitively prevent *30 children* in Riverton from developing a rare, progressive genetic disorder. Without intervention, each affected child will experience severe, irreversible degeneration of motor neurons over 5-10 years, leading to near-total paralysis of the limbs and torso by early adulthood. These children would require lifelong, extensive care and experience significant physical suffering and profound limitations on mobility and independence. No other residents are affected by this specific disorder.

  The Town Council must choose one option. Funding cannot be split. Assume the costs and feasibility of both options are identical.

  **The Cumulative Complaint Principle (CCP):** A principle permitting a policy (or set of policies) is reasonably rejectable if the *sum of the strengths of all individual complaints* against permitting that policy exceeds the *sum of the strengths of all individual complaints* against permitting any alternative policy.

  **Essay Question (Answer all parts):**

  **(i) (4 points)** Precisely state the "aggregation problem" as it arises for Scanlon's contractualism within the Riverton case. Explain why the core contractualist test – assessing whether any individual could reasonably reject a principle based on the *comparative burdens* it imposes *on them* relative to alternatives – appears unable to resolve the conflict between Options A and B. Avoid simply defining contractualism generically.

  **(ii) (10 points)** Evaluate the *Cumulative Complaint Principle (CCP)* as a potential solution within a broadly Scanlonian framework. Can adopting the CCP preserve the core "contractualist form of justification" (focused on justifiability *to each person*) while successfully addressing the aggregation problem in Riverton? Or does the CCP fundamentally smuggle in utilitarian aggregation ("only totals matter") by the back door, violating the spirit of Scanlon's "individualist restriction"? In your evaluation, you *must*:
      *   Distinguish clearly between aggregating burdens *within a single pairwise comparison* (e.g., comparing one person's burden under Principle P1 vs. P2) and aggregating burdens *across all affected persons* (as the CCP does).
      *   Take seriously the CCP's strongest defense: It seems deeply obscure why the *enormous* complaint of one child facing lifelong paralysis should be silenced by the *collective weight* of 40,000 individually modest complaints about temporary nausea, when no single individual on either side faces an extreme burden (like death) that might clearly trump all others.

  **(iii) (6 points)** Given the difficulties with both the standard contractualist test and the CCP, what should Scanlon himself say about the Riverton decision? How does his "individualist restriction" (that reasons for rejection must be rooted in burdens *to individuals*, not groups or totals) constrain the theory here? Furthermore, consider Derek Parfit's worry about "continuum" or "spectrum" cases: If we admit that numbers *can* matter in *some* way (e.g., saving 5 lives vs. 1), where do we draw the line? Is there any principled stopping point between the view that numbers *never* matter (leading to implausible results like saving 1 life over preventing 40,000 temporary nausea episodes) and the view that *only* totals matter (utilitarianism)? Does contractualism have the resources to offer a non-arbitrary answer, or does this case expose a fundamental limitation?

  ---

  ## Model Answer (Approx. 600 words)

  **(i) The Aggregation Problem in Riverton:** Scanlon's contractualism asks if any principle permitting a policy could be reasonably rejected by someone burdened by it, given the alternative principles available. The aggregation problem arises because the burdens and benefits are distributed asymmetrically. Option B imposes a catastrophic, lifelong burden on 30 specific children (severe paralysis). Option A imposes a significant but fleeting burden (48-hour nausea) on each of 40,000 residents. Crucially, *no single individual* facing the nausea under Option A suffers a burden remotely comparable to the paralysis faced by *any one* child under Option B. Conversely, *no single child* facing paralysis under Option B can claim their burden outweighs *the collective complaint* of the 40,000, because contractualism compares individual burdens pairwise: one child's paralysis vs. *one* resident's nausea. The child's complaint against Option A (choosing the retrofit, denying them treatment) is vastly greater than any single resident's complaint against Option B (choosing treatment, giving them nausea). Therefore, no single individual can reasonably reject either principle based *only* on the comparative burden *to them* against the alternative. The standard test seems to declare both options permissible or impermissible only arbitrarily, failing to capture the intuitive moral weight of the *aggregate* minor harms vs. the few severe ones.

  **(ii) Evaluating the Cumulative Complaint Principle (CCP):** The CCP attempts to solve aggregation by summing individual complaint strengths. In Riverton, the sum of 40,000 "moderate" complaints (nausea) likely dwarfs the sum of 30 "catastrophic" complaints (paralysis), suggesting Option B (funding treatment) is reasonably rejectable, favoring Option A (retrofit). However, the CCP fundamentally violates Scanlon's contractualism. While contractualism aggregates in the minimal sense of comparing burdens *for an individual* across principles (e.g., Burden X for Person1 under P1 vs. Burden Y for Person1 under P2), it strictly forbids *interpersonal aggregation* – summing the burdens *of different individuals* to create a collective complaint weight. The CCP does precisely this latter aggregation. It replaces the question "Could *anyone* reasonably reject P based on *their* burden compared to alternatives?" with "Is the *total complaint mass* against P greater than against alternatives?" This shifts the justificatory ground from what individuals can reasonably demand of each other to a calculation of net burden, mirroring utilitarianism's focus on aggregate welfare. The CCP smuggles in utilitarian content by treating complaints as fungible units to be summed, ignoring the separateness of persons central to Scanlon.

  The CCP's defense highlights a genuine puzzle: Why should 40,000 people suffer *at all* to spare 30 people a vastly worse fate? The contractualist answer isn't that the 30 have *no* complaint; their complaint is immense. Rather, the contractualist argues that justification must proceed individual-by-individual. *Each* resident facing nausea under Option B has a complaint, but that complaint is weak compared to *each* child's complaint against Option A. Since justification requires finding principles no one *individually* can reasonably reject, and each child has a devastating complaint against being sacrificed for the retrofit, Option B (fund treatment) seems mandated, despite the aggregate nausea. The CCP obscures this individual-level justification by pooling complaints, making it impossible to see why the children's *individual* veto power should be overridden by a collective sum. The "obscurity" the CCP identifies stems from contractualism's core commitment to individuals, not its failure.

  **(iii) Scanlon's Dilemma and Parfit's Challenge:** Scanlon must conclude that Option B (funding treatment for the 30 children) is required. The individualist restriction means the decisive comparison is between the burden on *each specific child* denied treatment (lifelong paralysis) versus the burden on *any single resident* given nausea (temporary illness). Each child's complaint against a principle permitting Option A is clearly stronger than any single resident's complaint against a principle permitting Option B. Therefore, any principle choosing Option A over Option B *can* be reasonably rejected by each of the 30 children, while no single resident can reasonably reject a principle choosing Option B based *only* on their own burden. The aggregate nausea is irrelevant to the contractualist test.

  However, this leads directly to Parfit's challenge. If saving 30 from paralysis trumps preventing 40,000 cases of nausea, wouldn't saving *one* child from paralysis also trump preventing nausea for *millions*? This seems implausible. Yet, if we admit that numbers *do* matter at some point (e.g., saving 1 life vs. preventing nausea for 100,000 *might* favor the many), where is the threshold? Any threshold (e.g., burdens above level X aggregate, below level Y do not) appears arbitrary – why *that* level? Scanlon suggests we might develop principles specifying when aggregation is permissible (e.g., for "similar" burdens), but Riverton's burdens (paralysis vs. nausea) are radically dissimilar. Ultimately, contractualism struggles to handle cases involving very large numbers of modest burdens against a few severe ones without either collapsing into near-absolutism against aggregation (as here) or abandoning its core individualism. Riverton exposes this as a significant limitation; the theory may lack a non-arbitrary way to say both that saving the 30 children is paramount *and* that saving one child wouldn't justify inflicting nausea on millions.

  ---

  ## Marking Scheme (Total: 20 Marks)

  1.  **Clear Statement of Aggregation Problem in Case Context (4 marks):** Accurately identifies that the standard pairwise individual burden comparison fails because no *single* nausea sufferer's complaint outweighs a *single* paralysis sufferer's complaint (and vice versa for each individual), leaving the aggregate minor harms unaccounted for. *Common Miss:* Vague definitions of aggregation or contractualism; simply describing the case without linking to the test's mechanics.
  2.  **Analysis of CCP's Violation of Individualist Restriction (5 marks):** Clearly distinguishes intra-personal aggregation (allowed) from inter-personal aggregation (forbidden), and argues convincingly that CCP's summing *across persons* replaces individual justifiability with aggregate calculation, importing utilitarian logic and violating Scanlon's core commitment to the separateness of persons. *Common Miss:* Conflating the two types of aggregation; criticizing CCP only for being "utilitarian" without explaining *how* it violates contractualism's specific structure.
  3.  **Engagement with CCP's Best Defense (3 marks):** Directly addresses the "obscurity" argument (why one huge complaint silences many small ones) and provides a contractualist rebuttal grounded in the requirement for individual-level justifiability (each child's veto remains decisive against each resident's weaker complaint). *Common Miss:* Ignoring this defense or dismissing it without argument; conceding the point without offering a Scanlonian response.
  4.  **Application of Scanlon's View to Case & Individualist Restriction (4 marks):** Correctly applies the unmodified Scanlonian test to conclude Option B (treat children) is required because each child can reasonably reject Option A, while no single resident can reasonably reject Option B based solely on their own burden; explicitly invokes the individualist restriction as the basis. *Common Miss:* Stating Scanlon rejects aggregation but not applying it to the case; implying the nausea sufferers have a *collective* complaint Scanlon must recognize; suggesting Scanlon might accept CCP or another aggregative principle.
  5.  **Addressing Parfit's Continuum Challenge & Limitation (4 marks):** Identifies the implication (saving one child might trump preventing nausea for millions) and the resulting implausibility; explains Parfit's point about the difficulty/impossibility of finding a non-arbitrary threshold; acknowledges this exposes a significant problem/limitation for contractualism in handling such cases. *Common Miss:* Ignoring the continuum problem; asserting an arbitrary threshold exists without justification; claiming contractualism easily solves it.

  **Distinguishing A from B Answers:** A B answer (14-16/20) will typically hit points 1, 2, and 4 well: correctly stating the aggregation problem, critiquing the CCP effectively for violating individualism, and applying Scanlon's core test to mandate Option B. An A answer (17-20/20) must *additionally* excel at points 3 and 5: it will robustly engage and rebut the CCP's strongest defense *on contractualist grounds*, and it will seriously grapple with the devastating implications of Parfit's continuum challenge, explicitly acknowledging the deep tension and limitation this reveals within the Scanlonian framework regarding large-number small-burden cases, without resorting to easy or unprincipled fixes. The A answer confronts the full difficulty of the problem the case poses for contractualism.
