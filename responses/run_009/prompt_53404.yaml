              B) No, because we are defined by our relationships and roles; without them, he can't express goodness. (Role Ethics)
              C) He can be a good person in a minimal way, but he's missing out on the full expression of goodness which requires relationships. (Care Ethics)
              D) Goodness is about how you treat others; since he's alone, the question doesn't apply. (Deflationary)

          Question 3 (Mourning):
            Your parent has passed away. According to tradition, you should mourn for three years, during which you don't take part in festivities and may not work. This would cause hardship for your own family. What do you do?
              A) Follow the ritual exactly, because it's the proper way to show respect. (Ritual-Centric)
              B) Modify the ritual to a shorter period so you can support your family, because that's what your parent would have wanted. (Role Ethics)
              C) The ritual is important, but the spirit of the ritual (showing respect) matters more than the letter; find another way to honor your parent without causing harm. (Virtue Ethics)
              D) Rituals are not set in stone; focus on your own genuine feelings and the practical needs of your family. (Deflationary)

          Question 4 (Helping a Stranger):
            You see a stranger in need of help. You aren't in any particular role relationship with them. What is the basis for helping them?
              A) You help because it is the virtuous thing to do — it expresses your compassion and humanity. (Virtue Ethics)
              B) You help because we are all part of a larger community and have roles as fellow human beings. (Role Ethics)
              C) You help because you feel a natural care for others, and that feeling should be extended to all. (Care Ethics)
              D) You help because it is part of the social rituals that maintain harmony. (Ritual-Centric)

          Question 5 (Unjust Ruler):
            You serve in the court of a ruler who is making bad decisions. What do you do?
              A) Remonstrate with the ruler repeatedly and try to change his mind, because that is the duty of a minister. (Role Ethics)
              B) If the ruler doesn't listen, resign and leave the court, to preserve your own integrity. (Virtue Ethics)
              C) Continue to serve and try to mitigate the harm, because abandoning the role would be worse for the people. (Care Ethics)
              D) The ruler's actions are his own; your job is to cultivate your own virtue regardless. (Deflationary)

          Question 6 (Ritual at Dinner):
            A friend invites you to a formal dinner. You don't know the proper table manners. How important is it to learn and follow them?
              A) Very important: rituals create social harmony and show respect. (Ritual-Centric)
              B) Somewhat important: you should try to follow them to avoid offense, but it's okay to make mistakes if your heart is in the right place. (Care Ethics)
              C) Not very important: what matters is your genuine intention and the relationship you have with your friend. (Virtue Ethics)
              D) It's not about the rituals at all; you should just act naturally. (Deflationary)

          Question 7 (Self-Cultivation in Isolation):
            Can a person become ethically better by living alone and meditating on moral principles?
