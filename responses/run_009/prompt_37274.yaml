answer: |-
  Here’s a decision tree handout designed to guide students from moral conflict to positions on dilemmas, using concrete cases and your specified branches. Each node uses a scenario to force a choice, and leaves clearly map to major views.

  ---

  ### **Moral Dilemmas: Where Do You Stand?**  
  *Start here: Sometimes you literally cannot do both of two things you have serious moral reason to do.*

  #### **1. THE VENTILATOR CASE**  
  *Two identical ICU patients need the last ventilator. Prognosis, age, relationships, and societal value are perfectly symmetrical. The attending flips a fair coin, and everyone accepts the outcome.*  
  → **Branch A: Flipping the coin was morally fine. Both choices were equally acceptable.**  
  *(Go to 2A)*  
  → **Branch B: Flipping was tragic but necessary. One choice was uniquely better, we just couldn’t know which.**  
  *(Go to 2B)*  
  → **Branch C: Flipping was wrong. There was a morally relevant difference we missed.**  
  *(Go to 2B)*  

  #### **2A: SYMMETRY & PERMISSIBILITY**  
  *In the ventilator case, you said both choices were acceptable. Now consider:*  
  *You promised your dying friend you’d use your inheritance to build a memorial park. Minutes later, you learn the same money could save a stranger’s life. You can’t do both.*  
  → **Branch A: Both acts are fully permissible. Keeping the promise OR saving the life is morally fine.**  
  *(Go to 3A)*  
  → **Branch B: Only one act is permissible. The other would be wrong (even if I can’t know which).**  
  *(Go to 2B)*  

  #### **2B: THE RESOLUTION QUESTION**  
  *Sophie must choose which of her two children dies in a Nazi camp. If she refuses, both die. The children are equally dear to her.*  
  → **Branch A: There’s a fact about which choice is right, even if Sophie can’t possibly know it (e.g., one child secretly wants to sacrifice themselves).**  
  *(Go to 3B)*  
  → **Branch B: No fact makes one choice uniquely right. The conflict is morally indeterminate.**  
  *(Go to 4)*  

  #### **3A: AGGLOMERATION**  
  *You think both choices are permissible in the promise vs. life case. Now:*  
  *You ought to build the park (duty to promise). You ought to save the life (duty to aid). Does this mean you ought to do both?*  
  → **Branch A: No – "ought" doesn’t combine that way. Doing both is impossible, so it’s nonsense to say you ought to.**  
  *(Leaf: **Permissivism** – Awkward commitment: Flipping coins can be morally required in symmetrical dilemmas.)*  
  → **Branch B: No – but not just because it’s impossible. Morally, the duties don’t "add up" that way; they’re competing claims.**  
  *(Go to 4)*  

  #### **3B: OUGHT-IMPLIES-CAN (PAIR)**  
  *A resistance fighter must leave his frail mother to join the underground. He can’t do both. You believe one choice is uniquely right.*  
  → **Branch A: He was never obligated to do both. "Ought implies can" cancels one (or both) duties once conflict hits.**  
  *(Leaf: **Consequentialist Dissolution** – Awkward commitment: Guilt over not aiding famine victims while feeding your family is irrational.)*  
  → **Branch B: He truly had two conflicting obligations. "Ought implies can" doesn’t erase the moral reasons.**  
  *(Go to 4)*  

  #### **4: THE REMAINDER QUESTION**  
  *Back to the resistance fighter: Suppose he correctly joins the resistance. His mother dies alone. He feels deep guilt.*  
  → **Branch A: His guilt is fitting. He sacrificed something morally significant.**  
  *(Leaf: **Rossian View** – Awkward commitment: Even the best choice leaves a "moral remainder" (e.g., a pro tanto duty was violated).)*  
  → **Branch B: His guilt is misguided. He did the right thing; he should only regret the situation.**  
  *(Leaf: **Lexical Priority** – Awkward commitment: In war, saving thousands always trumps caring for family—no moral loss.)*  
  → **Branch C: His guilt is fitting—but because he violated an absolute duty either way.**  
  *(Leaf: **Dirty Hands** – Awkward commitment: Choosing to bomb civilians to save a city is both necessary and morally monstrous.)*  

  ---

  ### **LEAF POSITIONS SUMMARIZED**  
  1. **Rossian View**: Always resolvable, fitting guilt (sacrifice leaves moral residue).  
  2. **Consequentialist Dissolution**: No dilemmas—only uncertainty about outcomes. Guilt is irrational.  
  3. **Lexical Priority**: One duty trumps; no residue. Resolution is clean but rigid.  
  4. **Dirty Hands**: Unavoidable moral failure; guilt is warranted despite necessity.  
  5. **Permissivism**: Symmetrical options are both permissible; no unique "right" answer.  

  ---

  ### **UNOCCUPIED COMBINATIONS & WHY**  
  - **"Indeterminate conflict (2B→B) + No fitting guilt (4→B)"**: *Coherent but unattractive*. If no fact makes one right, why no residue? Only plausible if morality is purely decision-theoretic (rare).  
  - **"Reject agglomeration for logical reasons (3A→A) + Fitting guilt (4→A)"**: *Possible but neglected*. Permissivism usually rejects residue; adding guilt needs justification (e.g., "each act violates a pro tanto duty").  
  - **"Ought-implies-can erases duties (3B→A) + Fitting guilt (4→A)"**: *Incoherent*. If duties vanished, nothing was sacrificed to regret.  

  ---

  ### **WHERE THE TREE "LIES" (LIMITATIONS)**  
  1. **Epistemic vs. Ontological Indeterminacy**:  
     - The tree **can’t distinguish** between "there’s a hidden fact" (epistemic) and "no fact exists" (ontological) at Branch 2B. Students picking 2B→A (hidden fact) could land in Rossian, Lexical, or Consequentialist leaves.  
     - *Why?* The ventilator case tries to force symmetry, but skeptics can always posit hidden differences.  
  2. **Dirty Hands vs. Rossian**:  
     - Both endorse fitting guilt. The tree uses **cases** to split them (Sophie’s Choice leans Dirty Hands; resistance fighter leans Rossian), but a student might blur them if they see all dilemmas as tragic violations.  
  3. **Permissivism vs. Consequentialism**:  
     - The ventilator case isolates Permissivism (symmetry = no dilemma). The tree **can separate them** via agglomeration/remainder: Consequentialists reject residue; Permissivists may accept it.  

  ---

  ### **WHY THIS WORKS FOR UNDERGRADS**  
  - **Cases drive splits**: Ventilator (symmetry), Sophie (indeterminacy), Promise vs. Life (agglomeration), Resistance Fighter (remainder).  
  - **Jargon-free nodes**: No "deontic logic" or "pro tanto"; only intuitive questions about cases.  
  - **Awkward commitments**: Each leaf’s "price" is stated bluntly (e.g., "Flipping coins can be required").  
  - **Dead ends flagged**: Students see where paths are empty and why (e.g., "incoherent").  

  Would you like a simplified flowchart visual? I can sketch nodes → branches → leaves.
