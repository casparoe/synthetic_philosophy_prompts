  I'll structure the tree starting with the ventilator case to immediately challenge the idea of symmetric duties. Then move to resolution using Sophie's Choice, since its symmetry questions if there's always a right answer. The agglomeration node with the promise case can test if "ought" aggregates. Remainder with the resistance fighter case probes if guilt is fitting. Ought-implies-can with the same case questions if inability negates both duties.

  For leaves: Rossian (resolvable, fitting guilt), consequentialist (no dilemma, guilt misguided), lexical (duties trump, no residue), dirty-hands (violation either way, guilt fitting). Permissivism is a leaf where symmetric options are both permissible, so no dilemma but not consequentialist.

