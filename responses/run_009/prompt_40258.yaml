prompt: |-
  I've been following the evolutionary debunking debate in metaethics for a few years now and the core exchange basically never moves. You've got Street's Darwinian dilemma: realism about value either lets moral truth play no role in shaping our evaluative beliefs, in which case the correlation between those beliefs and moral truth is a coincidence that natural selection would not preserve, or it gives truth a hand in the process, which the realist owes us a story about and hasn't provided. Then the standard realist replies are all on the table and have been for a while: the third-factor story where something like the badness of pain is both fitness-relevant and truth-relevant, so selection ends up tracking truth indirectly (Enoch's move); the companions-in-guilt move that the same debunking reasoning would take down logic or mathematics, which nobody wants; and the no-defeater line, pushed by people like Wielenberg, that an explanation of reliability was never a condition on justified trust in the first place, so the demand for one is itself a substantive epistemological assumption, not a neutral premise. Street and friends reply that all of these just beg the question, and thats more or less where it has sat for fifteen years.

  My working hypothesis is that the disagreement isn't really about moral realism at all -- it's about one norm in general epistemology: whether justified trust in a domain requires an etiological explanation of why we track the truth in that domain, or whether trust is the default and debunking arguments have to supply a positive defeater. If I'm right, the debate can't move without settling a broader epistemological dispute that is itself stuck, and the 'moral' framing is just where it happens to surface. Is that diagnosis right, or is there something substantive hiding in here that I'm missing -- a genuine disagreement about the evolutionary facts, about what counts as a debunking explanation, or about which cases count as the data? Use what the sides actually say to make the call, and tell me what would even count as progress here: a distinction, a formal model of reliability, or nothing. One request: please be upfront about which parts of your diagnosis are more or less settled among people who work on this and which are genuinely contested, and don't present a contested verdict (that the dilemma is sound, that Enoch's move fails, whatever) as if it were consensus.
reasoning: |-
  Okay, let me unpack this user's query. They're deeply familiar with the evolutionary debunking debate in metaethics, specifically Sharon Street's Darwinian dilemma and the standard realist responses. Their hypothesis is that the core disagreement isn't about moral realism per se but about a broader epistemological norm: whether justified trust requires an etiological explanation of reliability or if trust is the default until debunked.

  First, I need to verify if their diagnosis holds water. Looking at the key arguments: Street insists that without an etiological explanation linking beliefs to truth, the correlation is coincidental. Realists like Enoch propose third-factor accounts, while others use companions-in-guilt arguments or argue no defeater is needed. The stalemate suggests the real fracture is epistemological—specifically about when we need explanations for reliability.

  The user wants to know if there's a hidden substantive disagreement or if progress is possible. They also asked to clarify consensus versus contested points. Let me break this down systematically.

  Assessing their diagnosis: The epistemological rift is well-documented. Street’s demand for an explanation assumes tracking requires a causal or explanatory link, while realists like Wielenberg reject this as an unnecessary burden. This aligns with the user's view. But is there more? For example, do they disagree on evolutionary facts? Probably not—both sides accept natural selection’s role. What counts as debunking? Street sees natural selection as inherently non-truth-tracking for morality, while realists argue it can indirectly track truths. That's contested. The "data" question (like math/logic intuitions) is also debated.

  Progress might come from distinctions (e.g., different domains needing different reliability models), formal models showing when selection yields reliability, or clarifying epistemological starting points. But none resolve the core clash. Consensus exists on the dilemma's structure and standard replies; everything else is contested. The user's insight is sharp—the framing is moral, but the deadlock is epistemological. Moving forward would require tackling the deeper epistemic divide, which remains thorny.
answer: |-
  Your diagnosis is perceptive and largely correct: **the core impasse *is* primarily epistemological, specifically about the *default justificatory status of beliefs* and the *burden of proof* regarding reliability explanations.** The moral realism debate is the arena where this deeper epistemological clash plays out with high stakes. However, there *are* substantive points of contention within the evolutionary and conceptual framing that aren't *merely* reducible to the epistemology. Let's break it down using what the sides say:

  **1. Your Core Diagnosis: The Epistemological Chasm (Mostly Settled as the Locus of Disagreement)**
  *   **Street's Starting Point:** Her dilemma assumes a demanding epistemological norm: **For our beliefs in domain D to be justified/reliable, we need a *non-coincidental explanation* for why our belief-forming mechanisms in D correlate with the truths in D.** Evolution, operating via selective pressures on reproductive fitness (not truth-tracking *per se*), cannot provide this explanation for moral truths *if they are stance-independent*. Hence, the correlation is coincidental, undermining justification. This norm is presented as a consequence of a naturalistic worldview.
  *   **Realist Starting Points (Diverse but Unified in Rejecting Street's Norm):**
      *   **Enoch/Skarsaune (Third-Factor):** Justification doesn't require a *specific causal history* linking beliefs to truth *in that way*. If there's a plausible necessary link (like pain being bad *and* fitness-reducing), the correlation isn't coincidental *even if* the causal mechanism (evolution selecting for pain-avoidance) wasn't directly responsive to the moral truth. The *existence* of the link explains reliability, not its causal history per se.
      *   **Wielenberg/Cuneo (No-Defeater):** Justified belief is the *default* state for basic cognitive faculties delivering seemings (like moral intuitions). We trust perception, memory, logic, etc., absent defeaters. The demand for a *positive etiological explanation of reliability* as a precondition for justification is itself a substantive (and unjustified) epistemological claim. Street's argument *is* the purported defeater, which realists argue fails (e.g., because it overgeneralizes).
      *   **Companions-in-Guilt (CIG):** Extends the "No-Defeater" or "Third-Factor" logic to logic, math, or epistemic norms themselves. If Street's argument debunks morality, it equally debunks these domains. Since we *must* trust logic/math/epistemology to even run the argument (or do science), the argument is self-defeating or proves too much. This implicitly relies on the "trust is default" or "link exists" view.
  *   **The Stalemate:** Realists charge Street with assuming an **unjustifiably strong etiological requirement for justification.** Street charges realists with **begging the question** by *assuming* their moral beliefs are reliable (or that a necessary link exists, or that companions are guilty) without meeting her explanatory demand. Both sides accuse the other of circularity. **This epistemological chasm about the burden of proof regarding reliability explanations *is* the fundamental reason the debate is stuck.** Most participants acknowledge this is the heart of the disagreement.

  **2. Substantive Points Hiding Within/Alongside the Epistemology (Genuinely Contested):**
  While the epistemology drives the stalemate, disagreements about *how* evolution works and *what counts* as debunking add layers. These aren't just proxies; they shape the arguments:
  *   **Contention 1: What Constitutes a "Debunking Explanation"?**
      *   **Street:** A debunking explanation shows beliefs arose via processes *insensitive* to the truth in the relevant domain (like fitness pressures for moral truths). Explaining *why we have the belief* (e.g., "because it enhanced cooperation") *without* showing how this process tracks stance-independent truth *is* debunking.
      *   **Realist (Enoch-style):** An explanation is *only* debunking if it *severs* the link between belief and truth. If the explanation *entails* a connection (like fitness requiring pain-avoidance, which entails pain's badness), it's *vindicating* or neutral, not debunking. The disagreement is over whether evolutionary explanations *necessarily* sever the link.
      *   **Contested Verdict:** Whether evolutionary explanations *per se* are inherently debunking *for stance-independent truths*, or whether they *can* be compatible (via third factors). Street says yes, they are inherently debunking absent a tracking story; Enoch says no, they aren't if a link exists.
  *   **Contention 2: The Scope & Power of "Third-Factor" Accounts:**
      *   **Street:** Third-factor accounts fail because they *presuppose* the reliability of the moral beliefs they try to explain (e.g., we only know pain is *bad* from our evolved intuitions; asserting it as a necessary truth linking fitness and moral truth is question-begging). They also struggle with specific, culturally variable moral beliefs.
      *   **Enoch/Skarsaune:** The link (e.g., pain=bad=fitness-reducing) is a necessary conceptual/metaphysical truth, knowable *a priori* or via the same intuitions under scrutiny. Evolution exploits this link, making tracking non-coincidental. The explanation works for core, survival-relevant norms.
      *   **Contested Verdict:** Whether third-factor accounts can be non-question-begging and sufficiently comprehensive. Street & critics (like Joyce, Vavova) argue they fail on both counts; Enoch argues they succeed for core morality.
  *   **Contention 3: The Force of Companions-in-Guilt (CIG):**
      *   **Street/Critics:** The analogy fails. Logic/math (or induction, epistemic norms) might be *constitutive* of reasoning itself, or their truths might be *necessarily* implicated in the functioning of any cognitive system (including evolution), making them *immune* to the same kind of evolutionary challenge. Morality lacks this necessity/constituency.
      *   **Realist (Cuneo, Shafer-Landau):** If evolution explains our logical/mathematical intuitions via fitness, not truth-tracking, then by Street's logic, *all* normative domains (including epistemology needed to run science) are equally suspect. We *must* trust some intuitions pre-explanation.
      *   **Contested Verdict:** Whether logic/math/epistemic norms are *genuine* companions or meaningfully different in a way that exempts them from Street's dilemma. This involves deep debates about the nature of these domains and their relationship to cognition/evolution.
  *   **Contention 4: What Counts as the "Data" (Intuitions) Needing Explanation?**
      *   **Street:** Focuses on the *variability* and *apparent adaptive shaping* of many specific moral intuitions (e.g., kinship priorities, reciprocity norms) as evidence evolution shaped content, not just capacity.
      *   **Realist (Wielenberg, Brosnan):** Focuses on *core*, seemingly cross-cultural intuitions (e.g., pain is bad, killing innocent people is wrong) as the data needing explanation. Argues these are less susceptible to purely adaptive explanation or can be explained via third factors.
      *   **Contested Verdict:** The extent to which the *content* of our core moral intuitions is best explained *purely* by adaptive pressures vs. reflecting (even if imperfectly) stance-independent truths via a link. This involves interpretations of evolutionary psychology and anthropology.

  **What Counts as Progress?**
  Given the epistemological stalemate, progress likely wouldn't be a knockout blow, but could involve:
  1.  **Refined Distinctions:** Clarifying *types* of reliability (global vs. local, absolute vs. comparative), *types* of explanations needed (causal history vs. constitutive link vs. current competence), or *domains* where the etiological requirement is/isn't plausible (e.g., perceptual beliefs might need it more than logical intuitions, but where does morality fall?).
  2.  **Formal Models of Reliability Under Selection:** Developing more sophisticated evolutionary game theory or population models to rigorously explore *under what precise conditions* natural selection acting on fitness *would* or *would not* be likely to produce cognitive mechanisms reliably tracking specific types of truths (moral, logical, inductive). This could move beyond intuitive arm-waving about "coincidence." (Some work exists, e.g., by Justin Clarke-Doane or Katia Vavova, but it's complex and contested).
  3.  **Epistemological Ground-Clearing:** Explicitly arguing for/against the core epistemological norms themselves within a broader framework. Can the "trust is default" view be defended without circularity against skeptical challenges? Can the "etiological explanation required" view be grounded without itself requiring an etiological explanation (leading to regress) or being self-defeating? Progress here is hardest.
  4.  **Conceptual Analysis of "Debunking":** A clearer, shared account of what *exactly* makes an explanation "debunking" rather than merely explanatory or even vindicating. This ties into the first contention above.
  5.  **"Nothing" (Accepting the Stalemate):** Recognizing the debate hinges on fundamental, perhaps irresolvable, differences in epistemological starting points. The "progress" is clarity about why agreement is unlikely.

  **Consensus vs. Contested:**
  *   **Settled/Uncontroversial:**
      *   The structure of Street's dilemma and the *types* of realist responses (Third-Factor, CIG, No-Defeater) are well-established and accurately characterized by you.
      *   The debate *is* fundamentally stuck at the epistemological level described.
      *   All sides accept the broad facts of human evolution and natural selection as the framework. The disagreement isn't about *those* facts.
  *   **Genuinely Contested (No Consensus):**
      *   Whether Street's epistemological demand is legitimate or question-begging.
      *   Whether Third-Factor accounts succeed or fail.
      *   Whether CIG arguments work or not.
      *   Whether the No-Defeater view is viable or ignores a genuine challenge.
      *   Whether evolutionary explanations are inherently debunking for stance-independent moral truths.
      *   Whether core moral intuitions can be adequately explained by third factors or evolutionary pressures alone.

  **Conclusion:**
  Your diagnosis is astute. **The primary engine of the stalemate is the unresolved, deeper epistemological conflict about the necessity of etiological explanations for reliability.** Progress requires engaging *that* conflict directly or finding a way to bypass it. However, substantive disagreements about the *viability of third-factor links*, the *force of the CIG move*, the *precise nature of debunking explanations*, and the *interpretation of the evolutionary data* provide the specific battlegrounds where this epistemological war is fought. These are not *merely* proxies; they represent genuine disagreements about how evolution, justification, and moral truth interact. Moving forward likely requires nuanced distinctions, formal modeling, or philosophical breakthroughs on the epistemology itself, rather than expecting a decisive victory within the current framing.
