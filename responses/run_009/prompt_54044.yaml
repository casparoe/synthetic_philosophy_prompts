answer: |-
  After careful analysis of your verdicts, I propose the following principled account that captures nearly all your intuitions:

  **The Principle of Emergent Cognitive Capacities (PECC):**  
  *Moral status is grounded in the actual, emergent cognitive capacities of an entity—specifically, the degree and complexity of its subjective experience, self-awareness, capacity for suffering and flourishing, social agency, and future-directed preferences. Brain size and structure are evidentiary proxies for these capacities, not constitutive grounds.*

  ---

  ### How PECC Captures Your Verdicts:
  1. **Adult with microcephaly**  
     → *Captured:* Despite small brain size, retained capacities for rich social/emotional life grant full moral status.  
     *Clause:* Actual capacities override physical metrics.

  2. **Blue whale vs. human**  
     → *Captured:* Larger brain doesn’t confer higher status because human cognitive capacities (e.g., abstract reasoning, complex self-narrative) exceed the whale’s.  
     *Clause:* Raw size is irrelevant without capacity enhancement.

  3. **Mouse lemur vs. chimpanzee**  
     → *Captured:* Brain-to-body ratio doesn’t predict moral weight; chimpanzees exhibit superior empathy, social cooperation, and self-awareness.  
     *Clause:* Ratio is a poor proxy for advanced capacities.

  4. **Neanderthals**  
     → *Captured:* Archaeological evidence (tool use, burial rituals) confirms capacities equivalent to *Homo sapiens*.  
     *Clause:* Capacity parity justifies status parity.

  5. **Crow vs. larger-brained animal**  
     → *Captured:* Crows’ causal reasoning, social learning, and problem-solving signify richer capacities than simpler animals (e.g., a similarly sized reptile).  
     *Clause:* Functional complexity > absolute size.

  6. **Doubled brain mass (no capacity change)**  
     → *Captured:* Moral status unchanged—capacities identical.  
     *Clause:* Physical properties matter only as capacity mediators.

  7. **Hypersapient alien**  
     → *Captured:* Vastly superior understanding/memory/self-awareness justifies higher status.  
     *Clause:* Enhanced capacities ground enhanced status.

  ---

  ### The Anomaly: Anencephalic Infant vs. Pig
  Your verdict that the infant matters more **cannot be fully reconciled** with PECC without additional premises:  
  - The infant lacks all capacities grounding moral status (no consciousness, no future preferences).  
  - The pig exhibits demonstrable sentience, social bonds, and preferences.  
  PECC alone would grant the pig higher moral status.  

  **Resolutions (choose one):**  
  A. **Abandon the verdict:** Accept the pig has greater moral status due to existing capacities.  
  B. **Introduce a secondary principle:**  
     - *Human-affiliated potentiality:* Human infants (even non-viable) invoke protective instincts tied to human flourishing.  
     - *Relational status:* Humans may owe special obligations to human-derived entities.  
  C. **Reinterpret "mattering more":** Your intuition might reflect grief/symbolic value, not intrinsic moral status.

  ---

  ### Testing PECC on New Cases:
  | Case                          | PECC Analysis                                                                 | Moral Status Verdict                     |
  |-------------------------------|------------------------------------------------------------------------------|------------------------------------------|
  | **African elephant**          | Large brain but fewer cortical neurons. Complex social grief, tool use, self-recognition → high emergent capacities. | Equal to great apes. |
  | **Corvid-like alien**         | Tiny brain, human-level cognition via dense connectivity/novel biology. Capacities identical to humans. | Equal to humans. |
  | **Distributed cognition ET**  | Cognition across multiple organs → emergent capacities equivalent to human. Physical structure irrelevant. | Equal to humans. |
  | **Jellyfish**                 | Decentralized "nerve net," no central brain. Limited/no subjective experience. | Minimal moral status. |

  ---

  ### Brain Size as Epistemic Tool
  Yes, brain size/structure retains **epistemic value** when behavioral data is absent:  
  - **Extinct species (e.g., *Homo naledi*):** Endocast analysis infers potential capacities. A 500cc brain suggests limited symbolic thought vs. Neanderthals.  
  - **Unfamiliar alien life:** Relative size/gyrification might provisionally indicate possible cognitive complexity.  
  - **Limitation:** Brains evolve for ecological niches (e.g., echolocation). Size alone cannot confirm capacities without contextual evidence.

  ---

  ### Conclusion
  **PECC captures 7/8 verdicts coherently.** Only the anencephalic infant verdict requires revision or an auxiliary principle. I recommend:  
  1. **Adopt PECC** as the unified grounding principle.  
  2. **Abandon the infant verdict** as inconsistent with capacity-based ethics, *or*  
  3. **Admit a hybrid approach:** PECC for intrinsic status + human-affiliated obligations for human-derived entities (risking arbitrariness).  

  Surviving verdicts are best served by PECC alone—it handles edge cases (aliens, distributed cognition) robustly while demoting physical metrics to evidentiary status. Brain size matters epistemically for inferring capacities in data-poor contexts but never morally in itself.

  *Final note:* Ethical systems prioritizing capacities avoid speciesism while explaining intuitions about AI/aliens. Your struggle with the infant case reflects a tension between capacity ethics and human specialness—a profound philosophical choice, not a logical flaw.
