prompt: |-
  Quick background: I'm a science journalist, I mostly do features on physics and AI and whatever strange idea falls in between. I've got something I keep running into on the beat and I want to know if philosophy — or semiotics or linguistics or whatever the right field is — has an actual name for it.

  When the Voyager team sent the golden record up, they etched instructions on the cover: here's how fast to spin it, here's the unit of time, this drawing is a hydrogen atom, etc. But those instructions were themselves a message that needed decoding, and the only reason a hypothetical alien could even start on them is that physics works the same out there and they'd already worked out some of it themselves. So the "how to read this" layer of a message never actually gets delivered by the message — it has to be bootstrapped off stuff the reciever brings to it. And there's an even earlier layer, which is recognizing the thing in your hands is a message at all and not just a decorated frisbee.

  I hit the same shape reporting a totally different story. Deciphering Linear B basically only worked because the deciphers guessed the tablets were palace accounting records — a guess about what kind of thing you're holding that comes before any reading of it. And honestly my grandmother's recipe card is the same deal: half the real content is stuff she never wrote down because she assumed I'd grown up in her kitchen.

  So here's what I want a name for: the observation that meaning isn't located in the artifact itself. It's split between the artifact and a package of assumptions the reader already has to be carrying, and some of those assumptions are precisely what tell the reader there's something to decode in the first place. A friend of mine said "that's just pragmatics" but from what I can tell pragmatics is about speaker intention and context of utterance — not about the bootstrapping problem of a reader with no shared code at all. And McLuhan's "the medium is the message" seems to be about the medium dominating the content, which is a different claim.

  Does this have an established name? If yes, how exactly does it differ from its nearest neighbors — semiotics, pragmatics, that whole family — because I don't want to just be pointed at the closest-sounding label. If there's no established name, coin one and give me the definition plus some boundary cases: does a mathematical proof "mean the same" to every reader, or does it also ride on shared training? Does a database dump mean anything? Where I want you to be careful: my description might be off somewhere, and I'd like you to say where it's most likely wrong, and what would change your mind about the identification — like if a standard treatment puts the split somewhere other than where I put it, flag that instead of forcing my square peg into the nearest round hole.
reasoning: |-
  Okay, the user is a science journalist who often covers physics and AI. They've encountered a recurring theme in their work: the idea that meaning isn't inherent in an artifact but depends on the receiver's pre-existing knowledge and assumptions. They want to know if there's a specific term for this concept in philosophy, semiotics, or linguistics. 

  First, I need to unpack their examples. The Voyager Golden Record's instructions require aliens to already understand physics to decode them. Linear B was deciphered because scholars assumed the tablets were accounting records. Even a recipe card relies on shared cultural knowledge. The user emphasizes that meaning comes from both the artifact and the receiver's prior context. 

  They've already considered pragmatics but feel it focuses too much on speaker intention and context, not the bootstrapping problem. McLuhan's "the medium is the message" doesn't fit either, as it's about the medium dominating the content. 

  I recall concepts like hermeneutics, which deals with interpretation, and Peirce's semiotics with the interpretant. Eco's idea of the Model Reader is relevant too—the text anticipates a reader with certain competencies. Shannon's information theory separates data from meaning, which might be useful here. 

  The bootstrapping aspect is key. The receiver needs initial shared context to even recognize an artifact as a message. This is foundational in semiotics. The term "interpretive framework" or "hermeneutic circle" might capture this, but I need to check if there's a more precise term. 

  For boundary cases: a mathematical proof requires training in the notation and logic. A database dump only becomes meaningful with metadata and context. The user wants to avoid misapplying terms, so I should note where their description might be off—like overemphasizing the receiver's role versus the artifact's structure. 

  The best fit seems to be the "hermeneutic circle," especially with Gadamer's emphasis on pre-understanding. But since it's not a single term, I'll synthesize the concepts into "interpretive dependence" and clearly define it. Highlighting the differences from pragmatics and semiotics will help them use the term accurately in their journalism.
answer: |-
  Based on your description and the need for precision, the single most accurate established concept is **Hermeneutics**, specifically the **Hermeneutic Circle** and the role of **Pre-understanding (Vorverständnis)**. However, it requires careful unpacking to match your "bootstrapping" focus.

  Here's why, how it differs from neighbors, and boundary cases:

  1.  **The Established Framework: Hermeneutics**
      *   **Core Idea:** Hermeneutics (traditionally textual interpretation, expanded to artifacts/signs) argues that understanding is *never* a passive reception of inherent meaning. It's an active, circular process between the parts of the artifact and the whole, mediated by the interpreter's **pre-existing framework of understanding** (language, culture, concepts, expectations, context).
      *   **Your "Bootstrapping" = Pre-understanding (Vorverständnis):** This is the crucial package of assumptions the receiver *must* bring. It includes:
          *   Recognizing the artifact *as* a potential sign/message (not a frisbee).
          *   Having the *conceptual categories* to make sense of its elements (physics, accounting, kitchen practices).
          *   Possessing the *basic "code"* or symbolic system to even begin decoding (recognizing drawings, symbols, or writing *as* representations).
      *   **Hermeneutic Circle:** Interpretation moves between understanding individual parts based on a hypothesis about the whole, and refining the understanding of the whole based on the parts. Your Linear B example is classic: the *assumption* (pre-understanding) "this is accounting" provides the initial "whole" context needed to interpret individual signs ("this cluster of symbols likely means 'sheep' or 'wheat'"). This hypothesis then guides further interpretation, which might confirm or refute it. Voyager's instructions *rely* on the alien having the pre-understanding to recognize diagrams *as* diagrams and physics *as* a valid framework.
      *   **Why not just "Semiotics"?** Semiotics provides the general framework for signs (signifier/signified), but often focuses on the *structure* of the sign system itself (syntax, semantics). Hermeneutics explicitly centers the *interpreter's active role* and the *necessity of pre-existing context* for meaning to *emerge*. Semiotics asks "How does this sign work?", Hermeneutics asks "How does *this interpreter* understand *this sign* in *this situation*?" Your focus is on the interpreter's contribution.
      *   **Why not "Pragmatics"?** Your friend is partly right; pragmatics deals heavily with context. But its core domain is usually *within* a shared linguistic community – speaker intention, implicature, deixis ("this", "here", "now"). Your examples (Voyager, Linear B, Grandma's recipe) highlight the *radical* lack of shared community or code, the *initial leap* required *before* pragmatic inferences can even begin. Hermeneutics tackles this foundational "entry point" problem more directly.
      *   **Why not "Epistemology"?** Too broad. Epistemology is the theory of knowledge *in general*. Hermeneutics is a specific theory *within* epistemology about how understanding and interpretation work.

  2.  **The Best Fitting Established Term: The Hermeneutic Circle (with emphasis on Pre-understanding)**
      *   **Definition:** The interpretive process where understanding an artifact (text, object, message) requires an initial projection of meaning (pre-understanding) based on the interpreter's prior context, which is then tested and revised through engagement with the artifact's details, in a continuous cycle. Meaning arises *from this interplay*, not solely from the artifact.
      *   **What it Captures:**
          *   The necessity of the receiver's "package of assumptions" (pre-understanding).
          *   That these assumptions include recognizing the artifact *as* interpretable and providing the initial framework (recognizing it as physics instructions, accounting, a recipe).
          *   That decoding *depends* on this prior context for bootstrapping.
          *   That meaning is a *process* of interaction, not a static property of the artifact.

  3.  **Boundary Cases & Nuances (Testing the Concept):**
      *   **Mathematical Proof:** **Does NOT "mean the same" universally.** Hermeneutics applies strongly.
          *   *Pre-understanding:* The reader *must* understand mathematical notation, logical operators (∀, ∃, →, ¬), proof structures (induction, contradiction), and the specific axiomatic system (e.g., ZFC set theory). Without this, it's just marks on paper. A topology proof is meaningless gibberish to someone who only knows basic arithmetic.
          *   *Interpretation:* Understanding involves actively reconstructing the logical steps *using* that pre-understanding. Different readers might grasp nuances or elegance differently based on depth of knowledge.
      *   **Database Dump (raw CSV file):** **Has minimal inherent meaning without context.** Hermeneutics highlights the *dependency*.
          *   *Pre-understanding:* Recognizing it as structured data (not random text) is step one. But meaning requires massive external context: What do the column headers *mean*? (e.g., "SKU", "Rev_Q3") What units are used? What is the domain? (Sales? Sensor readings?) Who generated it? This context is *not* in the dump itself.
          *   *Interpretation:* The dump only becomes meaningful when an interpreter with the *correct pre-understanding* (knowledge of the specific business, project, or data schema) projects meaning onto the symbols. Without context, it's just numbers and labels.
      *   **"Simple" Sensory Input (e.g., Seeing Red):** This is where your description *might* be slightly overextended, and Hermeneutics shows its boundary.
          *   *Argument:* Basic sensory qualia ("redness") or instinctive reactions (fear from a loud noise) might seem like "meaning" inherent in the stimulus/receiver biology with minimal "interpretive package." Hermeneutics traditionally focuses on complex *cultural* artifacts and symbolic communication.
          *   *Counter/Hermeneutic View:* Even perception is arguably interpretative. Recognizing "red" as a distinct color depends on neurological and linguistic categorization. Seeing a shape as "a cup" relies on prior concepts. Pure, uninterpreted sensation is debated. However, the bootstrapping *you* describe (aliens, Linear B, recipes) is firmly in the complex symbolic realm where Hermeneutics excels.

  4.  **Potential Critique & Where Your Description Might Be Tweaked:**
      *   **Focus on the Artifact's Structure:** Hermeneutics (especially Gadamer) emphasizes that the artifact *constrains* interpretation. It's not *just* the receiver projecting; the artifact "speaks back" and corrects faulty pre-understanding (e.g., if Voyager's diagrams were physically impossible, the alien's interpretation would be wrong; if Linear B wasn't accounting, Ventris's initial guesses failed). Your description leans heavily on the receiver's contribution – which is core – but the *interaction* with the artifact's structure is equally vital. "Split between" is good, but the *dynamic tension* in the circle is key.
      *   **"Meaning Isn't Located in the Artifact Itself":** This is mostly correct from a hermeneutic view. However, a structuralist (Saussure) might argue the *potential* for meaning (the signifier/signified relationship *within the system*) *is* inherent in the artifact *as part of a system*. Hermeneutics counters that this "potential" only becomes *actual* meaning *for someone* through interpretation grounded in pre-understanding. For your journalistic purpose, your statement holds, but be aware of the nuance.
      *   **"No Shared Code At All":** Hermeneutics argues there *must* be *some* minimal shared ground (e.g., recognizing physical causality for Voyager, recognizing systematic markings for Linear B) for interpretation to even begin. True "no shared code" likely results in no recognition of a message at all (it *is* just a frisbee). The bootstrapping relies on finding *that initial point of overlap* in pre-understanding (e.g., physics, 2D representation).

  5.  **Coined Term (If Insisting on One Phrase):**
      If "Hermeneutic Circle / Pre-understanding" feels too academic or broad, a more specific coinage capturing the *bootstrapping dependency* could be:
      *   **Interpretive Dependence:** The phenomenon where deriving meaning from an artifact fundamentally relies on the receiver possessing a specific set of prior cognitive frameworks, contextual knowledge, and symbolic competencies that enable both the recognition of the artifact as meaningful and the initiation of its decoding.
      *   *Definition:* The principle that the semantic content of an artifact is not self-contained but is contingent upon and co-constituted by the pre-existing interpretive resources (cognitive, cultural, contextual) brought to it by the receiver. These resources are prerequisite for recognizing the artifact as a sign-system and initiating any decoding process.

  **Conclusion:**

  The most precise established framework for your observation is **Hermeneutics**, specifically the concepts of the **Hermeneutic Circle** and **Pre-understanding (Vorverständnis)**. It directly addresses the bootstrapping problem, the necessity of the receiver's prior "package," the role of that package in recognizing the artifact *as* a message, and the idea that meaning arises from the interaction, not solely from the artifact. Semiotics provides the groundwork, Pragmatics deals with finer-grained context *within* a code, but Hermeneutics tackles the foundational challenge of interpretation *starting from minimal shared ground*, perfectly matching your Voyager, Linear B, and recipe card examples. Boundary cases like math proofs and database dumps reinforce its applicability, while basic sensory perception marks its limit. Your core insight is sound within this framework.
