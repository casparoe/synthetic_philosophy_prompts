answer: |-
  Below is a rigorous translation of each position on universals into your physical vocabulary, followed by a residue analysis and adjudication. I'll flag all conceptual fudging explicitly.

  ---

  ### **1. Realism (Platonic/Aristotelian) in Physics Vocabulary**  
  **Core Claim:** Universals exist independently of particulars.  
  - **Platonism:** Universals are abstract entities in a "realm of Forms."  
    *Translation:* Universality classes are discovered mathematical structures that exist independently of any specific physical system. The critical exponents (e.g., for the 3D Ising model) are eternal, immutable truths – akin to fixed points in an abstract theory space. When we observe identical critical behavior in fluids and magnets, we are "participating in" (Plato's term) these transcendent universals.  
    *Fudging:* Plato’s realm is non-spatiotemporal, whereas theory space (e.g., RG flow) is a human-constructed map.  
  - **Aristotelianism:** Universals are instantiated *in* particulars.  
    *Translation:* The universality class is immanent in the physical system. A magnet's critical point isn't just "described by" the Ising universality class; the system *instantiates* it as an inherent organizational principle. Copper atoms don't "approximate" a universal; their electronic ground state *is* the universal manifesting through identical particulars.  
    *Fudging:* Aristotelian "essences" imply metaphysical necessity, while ground states are contingent on QED symmetries.  

  **Your colleague’s argument:**  
  *"The periodic table was out there waiting"* → Effective-theory translation:  
  At energy scales << QCD, the renormalization group flow converges to fixed points (atoms) with stable emergent properties (e.g., electron configurations). These are *robustly real* patterns, but they are scale-dependent: zoom in to TeV scales, and "copper" dissolves into quarks and gluons. Realism holds only within the scaling regime where the effective theory is valid.  

  ---

  ### **2. Nominalism in Physics Vocabulary**  
  **Core Claim:** Only particulars exist; universals are linguistic/conventional labels.  
  *Translation:* "Universality class" is a useful label for grouping systems with similar coarse-grained behavior. Critical exponents aren’t discovered entities; they are approximate summaries of statistical regularities across disparate systems. Classifying a phase transition as "Ising-like" is a pragmatic choice, not a reflection of deep ontology.  
  - **Liquid crystal example:** Lab identification of "same" liquid crystals relies on operational criteria (e.g., XRD peaks, optical textures). Two samples are "identical" only because we agree to ignore nanoscale defects or isotopic variations – there is no universal "liquid crystal essence."  
  *Fudging:* Nominalism struggles with why some groupings (e.g., universality classes) are inescapable across observers, while others (e.g., "things that are shiny") are arbitrary.  

  ---

  ### **3. Resemblance Nominalism in Physics Vocabulary**  
  **Core Claim:** Particulars resemble each other, but no universal "sameness" exists.  
  *Translation:* Two copper atoms aren’t identical because they instantiate a universal; they merely resemble each other closely at relevant scales. Universality classes emerge because systems with divergent microphysics happen to converge in their *resemblance relations* under coarse-graining.  
  - **Phase behavior example:** Classifying phases (e.g., nematic vs. smectic) depends on resemblance in order parameter symmetry. No universal "nematicness" exists – just a network of similar systems linked by overlapping experimental signatures.  
  *Fudging:* Resemblance nominalism doesn’t explain *why* systems resemble each other (e.g., why diverse Hamiltonians flow to the same RG fixed point).  

  ---

  ### **4. Trope Theory in Physics Vocabulary**  
  **Core Claim:** Properties (tropes) are particularized, but can be exactly alike.  
  *Translation:* Each copper atom has its *own particular* electron configuration trope, but these tropes are numerically distinct yet qualitatively identical. Universality classes are sets of systems whose tropes (e.g., correlation length divergence) are indistinguishable under measurement.  
  - **Critical exponents example:** The critical exponent β for magnet A and fluid B are distinct tropes, but they are *exactly alike* – no underlying universal "β-ness" exists.  
  *Fudging:* Quantum indistinguishability (e.g., identical fermions) challenges trope theory: if properties are particular, why can’t we tag them?  

  ---

  ### **Residue Report**  
  | **Philosophical Concept** | **Clean Mapping** | **Distorted Mapping** | **No Counterpart** |  
  |---------------------------|-------------------|------------------------|---------------------|  
  | **Realism (Platonic)** | Universality classes as abstract structures | Theory space vs. non-spatiotemporal "realm" | Transcendent Forms (no RG analogue) |  
  | **Realism (Aristotelian)** | Ground states as immanent universals | Essences vs. contingent symmetries | Metaphysical "substance" |  
  | **Nominalism** | Phase classifications as conventions | — | Linguistic conventions as *only* human constructs |  
  | **Resemblance Nominalism** | Similarity-based grouping of systems | — | "Resemblance" as primitive (no physical mechanism) |  
  | **Trope Theory** | Local property instances | — | "Exactly alike" tropes vs. quantum identity |  

  **Clean Mappings:**  
  - Universality classes as **discovered mathematical structures** (realism).  
  - Phase classifications as **pragmatic labels** (nominalism).  
  - Property instances as **scale-dependent emergents** (trope theory).  

  **Distorted Mappings:**  
  - Aristotelian instantiation ↔ Emergence under RG flow: *But emergence is contingent on coarse-graining, not metaphysical necessity.*  
  - Resemblance ↔ Similarity in order parameters: *But RG explains resemblance via flow to fixed points, making it non-primitive.*  

  **No Counterpart:**  
  - Plato’s transcendent realm.  
  - Primitive "resemblance" without a physical basis.  
  - Nominalist claim that conventions are *only* linguistic (ignoring why some groupings are physically inevitable).  

  ---

  ### **Adjudication: What the Residue Reveals**  
  **1. Your vocabulary exposes substantive gaps in the philosophical debate:**  
  - Philosophers often ignore **scale-dependence**. Copper’s "universal" properties vanish at high energies – a problem for realism.  
  - They underappreciate **coarse-graining as ontology**: Universality classes aren’t "out there" fundamentally; they emerge at specific scales.  
  - Your colleague’s argument **partially survives**: The periodic table *is* a robust feature of our universe’s effective theories, but it’s not transcendent. It’s "out there" only relative to the scales where QED/QCD apply.  

  **2. Philosophers identify gaps in your framework:**  
  - **Why do fixed points exist?** RG explains *how* systems flow to universality classes, but not *why* theory space has this structure. Realism argues this structure is mind-independent.  
  - **The status of mathematics:** Platonic realism challenges whether universality classes are human models or discovered truths.  

  **3. Verdict on "equivocation":**  
  Your instinct is correct: your colleague conflates **three distinct claims**:  
  > (a) *Robustness:* Copper’s properties are stable across observers (empirically true).  
  > (b) *Fundamentality:* These properties are irreducible (false – they emerge from QED).  
  > (c) *Universals:* Properties exist independently (unresolved; depends on scale).  

  **Coarse-graining reframes the debate:**  
  - Universals aren’t "dissolved" but **relativized to scale**.  
  - At 1 eV, copper *is* real – not by Platonic fiat, but because the RG flow converges there.  
  - Nominalism fails because groupings (e.g., universality classes) are *forced* by physics, not convention.  

  **Conclusion:** The residue suggests philosophers are grappling with real questions (e.g., why mathematics maps to physics), but their tools lack the precision of effective theory. Your vocabulary reveals that **universals are scale-dependent emergents** – real within their domain, but not fundamental. This doesn’t resolve the metaphysical debate but sharpens it: *Is robustness under coarse-graining sufficient for "reality"?* That’s where you and your colleague should focus next Thursday. ☕

