prompt: |-
  so my friend devi has this whole system for deciding whether people did stuff "on purpose" and we've been arguing about it at lunch for like three weeks now. I've started keeping a list of her verdicts because she's suprisingly consistent. here's the track record:

  - a CEO who approves a new program because it'll make tons of money, knows it'll pollute the river near the plant, and says he doesn't care about the river at all: she says he polluted the river intentionally
  - same company, but the program happens to clean up the river as a side effect, and this CEO also says he doesn't care about the river either way: she says he did NOT help the river intentionally
  - a guy texting while driving who rear-ends someone and injures them: intentional, obviously
  - a driver who gets a wasp in the car mid-drive, swerves, and dents a parked car: not intentional (she says anyone who claims otherwise is unhinged)
  - a girl who spreads a rumor she knows will wreck another kid's reputation because it's juicy and she doesn't really care about the kid: intentional
  - a guy who tells his friend he likes his terrible band, and the confidence boost accidentally leads the friend to enter a battle of the bands, which he then wins: not intentional

  ok so next week we're arguing about three new cases and I want to walk in prepared. (a) a CEO exactly like the first one — profits, river gets wrecked — except this one fought the plan and lost, put a bunch of his own money into cleanup, and says he's sick about the river. (b) a surgeon who has to cut a nerve to save someone's life, knows the patient's arm will be numb forever, feels terrible about it. (c) a rich guy who donates a huge amount to flood relief purely so his company looks good, and doesn't care about the flood victims at all.

  what will devi say about each of the three? and I'm less interested in the answers than in the rule she's actually running, because I have a bet going with my other friend that it's not really about intention at all — my theory is it's about whether she thinks the person is a jerk, and the "on purpose" thing is just how it comes out. so: what rules fit everything on the list so far? which of my three new cases would split those rules apart (I feel like case (a) and (c) might do different things but I can't tell)? give me your best guess with reasons, and tell me what case I should throw at her after that to really settle it. also, is there an actual name for the thing in my first two bullet points, where the exact same "don't care" gets called intentional when the side effect is bad and not intentional when its good? I swear I saw a youtube video about it once but I can't find it again, and if there's a real name I want to drop it at lunch like a bomb.
reasoning: |-
  Okay, let me try to figure out what Devi's rule is. The user has this friend Devi who has a consistent way of judging whether actions are done "on purpose." They've been arguing about it for weeks, and the user has collected several examples. Now they have three new cases to predict, but more importantly, they want to understand the underlying rule Devi is using. The user suspects it's not about intention but whether Devi thinks the person is a jerk. 

  First, I need to analyze the existing cases to find a pattern. Let me list them out:

  1. **CEO knowingly pollutes for profit, doesn't care about the river:** Intentional.
  2. Same CEO, but the program cleans the river as a side effect, doesn't care: Not intentional.
  3. Texting while driving causing injury: Intentional.
  4. Swerving due to a wasp and denting a car: Not intentional.
  5. Spreading a harmful rumor without caring: Intentional.
  6. Complimenting a band leading to success: Not intentional.

  Looking at these, the key factors seem to be whether the outcome was a direct goal or a known side effect, and whether the person had a positive or negative attitude towards that outcome. For the first CEO, the pollution was a known negative consequence he accepted for profit, so it's intentional. But when the cleanup happened as a side effect and he didn't care, it's not intentional because it wasn't his goal. The texting driver intended to text, knowing the risk, so the crash is intentional. The wasp swerve was an accident, no intention to dent. The rumor was spread to harm, intentional. The compliment wasn't meant to lead to winning, so not intentional.

  So Devi's rule might be based on the **agent's attitude towards the specific outcome** and whether it was **within their control or foreseeable**. Specifically, bad outcomes that are foreseen and accepted are intentional, even if not the main goal. Good outcomes that are side effects and not desired aren't intentional. 

  Now, for the new cases:

  (a) CEO who fought against the polluting plan, invested in cleanup, and is upset: Since he actively opposed the pollution and tried to prevent it, Devi would say the pollution wasn't intentional. His actions show he didn't want the outcome, even though it happened. So not intentional.

  (b) Surgeon cutting a nerve to save a life, knowing it causes numbness: The harm is a foreseen side effect but necessary for a greater good. The surgeon feels terrible. Devi would likely say not intentional because the primary intent was to save the life, and the harm was unavoidable, not desired. Similar to the wasp case where the action (swerving) was necessary to avoid immediate harm, even though it caused damage.

  (c) Rich guy donates for PR, doesn't care about victims: The good outcome (helping flood victims) is a direct result of his action, but his intent is selfish. Since he caused the good outcome as a means to his goal (PR), and it was foreseen, Devi might say it was intentional. Even though he doesn't care about the victims, the help was a calculated part of his plan. This contrasts with the second CEO case where the river cleanup was an unintended side effect; here, the donation is directly intended to help (even if for wrong reasons), so intentional.

  The user's theory is that Devi is just judging based on whether the person is a jerk. In the existing cases, the jerks (polluting CEO, texting driver, rumor spreader) are deemed intentional, while non-jerks (reluctant CEO, wasp driver, band complimenter) are not. But in case (c), the rich guy is a jerk but causes a good outcome. If Devi says it's intentional, that supports the rule over jerkiness. If not, it might align with the user's theory. However, the existing cases show that bad outcomes with indifference are intentional, good outcomes with indifference aren't. So for (c), the good outcome with negative intent might still be intentional because it's a direct result of his action for his goal. 

  The term the user mentioned is the **Knobe Effect** or **Side-Effect Effect**. It's a philosophical and psychological concept where people are more likely to say a side effect was intentional if it's harmful (like pollution) than if it's beneficial (like cleaning the river), even if the agent's attitude is the same (doesn't care). This matches Devi's judgments in the first two cases. 

  To test between the rule and the jerk theory, the user should present a case where a non-jerk causes a bad outcome without intent. For example, a doctor who prescribes a necessary medication knowing it has a rare, severe side effect that occurs, causing harm. If Devi says intentional, it's about foreseeability; if not, she might be considering the person's moral character. 

  Another test case: a well-intentioned action that backfires. Like someone trying to help but causing harm. If Devi says not intentional, it's about intent; if intentional, maybe jerk theory. But based on the pattern, she'd likely say not intentional if the harm wasn't desired. 

  So summarizing:
  - Devi's rule: An outcome is intentional if the agent **foresaw it, had control, and was indifferent or accepting** of it (especially if bad). If the outcome was a side effect and the agent didn't aim for it, it's not intentional, especially if good. 
  - Predictions: (a) Not intentional, (b) Not intentional, (c) Intentional. 
  - Test case: Someone causing a bad outcome with good intentions but negligence. E.g., a distracted driver causing an accident while rushing to donate blood. If Devi says intentional, it's about foreseeability; if not, jerk theory might hold. But given the texting driver was intentional, distraction might be key. Alternatively, a case where a jerk causes a good outcome unintentionally.
answer: |-
  Based on Devi's track record and consistent pattern, I'll break this down step-by-step: her likely judgments on your new cases, the underlying rule, how to test it, and the name of that fascinating effect.

  ### Devi's Rule (The Pattern in Existing Cases)
  Devi isn't just judging "jerk vs. non-jerk" — **she's using a foresight-and-attitude test focused on *instrumental acceptance* of outcomes**. Specifically:
  1. **Intentional =** The person **foresaw the outcome**, had **some control over it**, and **treated it as an acceptable or necessary part of achieving their goal** (even if it wasn't their primary aim).  
  2. **Not intentional =** The outcome was either **(a) unforeseen**, **(b) unavoidable given the circumstances**, or **(c) not instrumentally "used" by the person to achieve their goal** (even if foreseen).

  **Evidence from your list:**
  - Polluting CEO: Foresaw pollution, controlled the decision, accepted it as a cost for profit → **Intentional**.
  - Cleaning CEO: Foresaw cleaning but didn't *leverage* it for his goal (profit); it was irrelevant → **Not intentional**.
  - Texting driver: Foresaw risk of crash (control via choice to text), accepted risk → **Intentional**.
  - Wasp swerve: Outcome was unforeseen/unavoidable reaction → **Not intentional**.
  - Rumor spreader: Foresaw harm, controlled the act, accepted harm for social gain → **Intentional**.
  - Band compliment: Foresaw encouragement? Maybe. But winning wasn't leveraged or accepted as part of the goal → **Not intentional**.

  **Key nuance:** Devi cares whether the outcome was **deliberately factored into the person's decision-making** as a *means* or *cost*. Bad outcomes are more likely to be "accepted" this way (hence the asymmetry).

  ---

  ### Predictions for Your New Cases
  1. **(a) Reluctant CEO** (fought the plan, invested in cleanup, feels sick):  
     **→ Devi says NOT intentional.**  
     *Why?* He foresaw the pollution but actively tried to prevent it — he didn't *accept* it as part of his plan. It was imposed on him. His attitude ("sick about it") shows he didn't instrumentally use the harm.

  2. **(b) Surgeon** (cuts nerve to save life, knows arm will be numb):  
     **→ Devi says NOT intentional.**  
     *Why?* The nerve damage was foreseen and controlled, but it was an *unavoidable cost* of a greater good. The surgeon didn't "accept" the harm as a goal; they minimized it while prioritizing lifesaving. Attitude ("feels terrible") reinforces this.

  3. **(c) Rich donor** (gives for PR, doesn't care about victims):  
     **→ Devi says INTENTIONAL.**  
     *Why?* He foresaw the help, controlled the donation, and *instrumentally used* the relief to achieve his goal (PR). His indifference doesn't matter — the help was a deliberate *means* to his end, like the polluting CEO's "cost."

  ---

  ### Testing "Rule vs. Jerk Theory"
  Your jerk theory has merit (all "intentional" cases involve jerks), but **Devi's rule is more precise**. Case (c) is the litmus test:  
  - **Rule prediction:** Intentional (help was leveraged for PR).  
  - **Jerk theory prediction:** Not intentional (since helping flood victims is "good," even if done for bad reasons).  

  **If Devi calls (c) *not* intentional**, your jerk theory wins. But based on her pattern (especially the cleaning CEO vs. polluting CEO asymmetry), **I bet she'll say intentional**.  

  **To truly settle it, throw this case at her next:**  
  > *"A nurse gives a patient a painkiller she knows they're allergic to because she's distracted and forgetful. The patient has a severe reaction, but the nurse genuinely cares about patients and feels awful."*  

  **Why this splits the theories:**  
  - **Devi's rule:** Likely **not intentional** — the harm was unforeseen (distraction = loss of control), and she didn't "accept" the outcome.  
  - **Jerk theory:** Would call it intentional because causing harm = jerk behavior.  
  *If Devi calls this intentional, she's likely conflating negligence with intent. If not, her rule holds.*

  ---

  ### The Name You Want
  The effect in your first two bullet points is called the **Knobe Effect** (or **Side-Effect Effect**), named after philosopher Joshua Knobe. It's a well-studied phenomenon in experimental philosophy where:  
  - **Harmful side effects** (pollution) are judged as **intentional** when the agent is indifferent.  
  - **Helpful side effects** (cleaning the river) are judged **not intentional** with the same attitude.  
  **Drop this bomb:** "Devi, this is just the Knobe Effect! You're mapping instrumental acceptance, not pure intent." (It exploded in popularity after a 2003 study — [here's a primer](https://plato.stanford.edu/entries/intention/)).  

  **Final Tip:** At lunch, focus on the *leveraging* angle. Devi’s verdicts hinge on whether the person treated the outcome as a *tool* (for profit, reputation, etc.) or an *irrelevant accident*. That’s why she’s consistent — and why (c) will be decisive.
