  But note: the directive was made when she was competent and it specified exactly the condition that has now occurred. And in case 4, we honored the directive even though the manic patient strenuously objects. However, the difference is that mania is temporary and the patient will return to a euthymic state and might then agree with the directive. In Alzheimer's, there is no return to the prior state. So the analogy to case 4 is weak.

