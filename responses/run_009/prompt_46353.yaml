  However, note that case 5 and the constitutional case 7 are the ones where precommitment is not honored. The new case seems to align with those.

  But let's consider: the friend might view the Alzheimer's directive as expressing the competent self's desire to avoid living in a state that she found intolerable. However, the verdict in case 5 suggests that one cannot bind the future self when the future self has settled values that are different. In this case, the future self (though demented) is content. So the directive might be seen as an attempt to impose the prior self's values on the current self who does not share them.

