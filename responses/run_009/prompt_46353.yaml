  But wait, in case 4 (bipolar) we honored the directive even though the manic state is temporary? The difference is that mania is a temporary impairment, whereas dementia is permanent. Also, in cases 1-3, the states are temporary. The Alzheimer's case is about a permanent change.

  Alternatively, we might see the Alzheimer's directive as an attempt to bind the future self on a matter of values (similar to the pledge) rather than to protect against a temporary impairment.

