  **Rule 2 analysis**:
  - Does the directive protect her core identity or fundamental interests?
    - At the time of making the directive, she might have seen living with severe dementia as incompatible with her core identity (being able to recognize family, etc.). So she wanted to avoid living in that state. The directive is therefore about protecting her core identity (as she defined it when competent).
