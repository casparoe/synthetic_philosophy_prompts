  **Constitutional cases:**

  - Case 6: Entrenching basic rights is legitimate because it protects the fundamental identity of the polity (analogous to protecting the person's core identity or rights from temporary majorities or passions).
  - Case 7: Entrenching a specific economic policy is illegitimate because it binds future generations on a policy matter that is not about the core identity but is a transient preference or a policy that might become obsolete.

  **Possible rules:**

  **Rule 1: Precommitment should be honored when it is designed to protect against a temporary impairment of judgment (such as addiction, mania, or overwhelming temptation) and the current self is experiencing that impairment. It should not be honored when the precommitment was made during a transient state (like a religious conversion) and the current self is in a settled state with different values.**

