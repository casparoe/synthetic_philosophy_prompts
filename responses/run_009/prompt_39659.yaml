  Below is a decision tree designed to sort participants by their response to the knowability paradox, based on concrete cases and commitments rather than labels or terminology. The tree starts with a respondent who accepts some form of the knowability principle (KP: "every truth is possibly knowable") and routes them to a leaf position via case-based questions. The tree contains 12 nodes (6 internal questions, 6 leaves) and adheres to your constraints, including the minimum decision points and avoidance of theory-laden questions. Pairs of leaves that may not be cleanly separated are flagged at the end.

  ---

  ### **Decision Tree: Responses to the Knowability Paradox**

  **Start:** Respondent accepts a version of the knowability principle (truth cannot outrun possible knowledge).

  #### **Node 1: Logic of Impossibility**  
  *Consider a proposition p that is true but unknown (e.g., "the number of sand grains on Bondi Beach at noon today is exactly n," which is true but never known). If it is impossible for p to be true while unknown, must p (when true) imply that it is known?*  
  - **Yes (Classical)**: Accepts the classical inference ¬(p ∧ ¬Kp) → (p → Kp). Proceed to Node 2.  
  - **No (Intuitionistic)**: Rejects this inference (e.g., p → ¬¬Kp but not p → Kp). **Leaf 1: Dummett-Style Intuitionism**.  
    *Position:* Semantic anti-realism uses intuitionistic logic; the derivation fails due to invalid classical steps. KP is not committed to collapse.

  #### **Node 2: The Fitch Conjunction**  
  *Take p as above (true but unknown). Is the conjunction "p and p is never known" knowable?*  
  - **Yes**: Proceed to Node 6.  
  - **No**: Proceed to Node 3.  

  #### **Node 3: Non-Fitch Present Truth**  
  *Consider a true proposition about the present with no self-reference to knowledge (e.g., "there are exactly n stars in the sky at this moment," true but never known). Is this proposition knowable?*  
  - **Yes**: Proceed to Node 4.  
  - **No**: Proceed to Node 5.  

  #### **Node 4: Knowability Across Time**  
  *Can the present proposition (e.g., "there are n stars now") be known at a later time (e.g., after stellar changes make counting impossible)?*  
  - **Yes**: **Leaf 2: Tennant-Style Restriction (Cartesian)**.  
    *Position:* KP restricted to Cartesian propositions (knowing them isn't provably inconsistent). The Fitch conjunction is excluded as non-Cartesian.  
  - **No**: **Leaf 3: Edgington-Style Indexical Restriction**.  
    *Position:* KP applies to indexed truths (e.g., "p is true-at-t"); knowledge must be at t. Present truths are only knowable at the present.  

  #### **Node 5: Non-Fitch Past Truth**  
  *Consider a true proposition about the past (e.g., "there were exactly n stars at time t," true, never known, and now evidentially lost). Is this knowable now?*  
  - **Yes**: **Leaf 4: Unnamed (Unexplored Restriction)**.  
    *Diagnosis:* KP avoids Fitch conjunctions and some present truths but allows past truths. Coherent but undefended in literature.  
  - **No**: **Leaf 5: Unnamed (Global Temporal Restriction)**.  
    *Diagnosis:* KP requires knowability at the time of truth. Unattractive as it renders many historical/empirical truths unknowable.  

  #### **Node 6: Distribution of Knowledge**  
  *If an agent knows a conjunction (e.g., "it is raining and the streets are wet"), do they know each conjunct (e.g., "it is raining")?*  
  - **No**: **Leaf 6: Denies Distribution**.  
    *Position:* Rejects K(p ∧ q) → Kp. *Cost:* Conflicts with conjunction elimination, undermining normal knowledge ascriptions (e.g., "I know p and q but not p" is paradoxical).  
  - **Yes**: **Leaf 7: Accepts Collapse (All Truths Are Known)**.  
    *Position:* KP + classical logic + no restrictions + distribution entail collapse. *Awkward Commitment:* Unknown truths (e.g., "the number of hairs on your head is even") cannot exist—arguably a *reductio*.  

  ---

  ### **Leaf Summary**
  1. **Dummett-Style Intuitionism**  
     KP is intuitionistic; derivation fails.  
  2. **Tennant-Style Restriction (Cartesian)**  
     KP applies only to propositions where knowing them isn't provably inconsistent.  
  3. **Edgington-Style Indexical Restriction**  
     KP applies to indexed truths (p-at-t), knowable only at t.  
  4. **Unnamed (Unexplored Restriction)**  
     KP avoids Fitch/present truths but allows past truths. Unexplored in literature.  
  5. **Unnamed (Global Temporal Restriction)**  
     KP requires knowability at the time of truth. Unattractive due to widespread unknowability.  
  6. **Denies Distribution**  
     Rejects K(p ∧ q) → Kp. Cost: clashes with normal epistemic practices.  
  7. **Accepts Collapse**  
     All truths are known. Awkward: denies existence of unknown truths (e.g., unobserved states).  

  ---

  ### **Notes on "Knowable By"**
  The tree assumes respondents have already fixed "knowable" as:  
  - **Some possible individual** (least implausible for Leaf 7),  
  - **Our community at some time**, or  
  - **Limit of inquiry** (e.g., ideal science).  
  To route explicitly, add a pre-tree question:  
  *Is a truth about a causally isolated galaxy (e.g., "planet X is cheese") knowable?*  
    - Yes → "knowable by some possible individual."  
    - No → *If lost to history, is it knowable?*  
      - Yes → "knowable at limit of inquiry."  
      - No → "knowable by community at some time."  
  This would multiply leaves (e.g., Leaf 7 splits by "known by whom?"), exceeding node limits. Instead, leaves note how "knowable by" affects the position's viability (e.g., Leaf 7 is less absurd if "known by some possible being").

  ---

  ### **Flagged Unclean Separations**
  - **Dummett (Leaf 1) vs. Edgington (Leaf 3)**: Hard to split with cases. Dummett rejects Node 1’s inference; Edgington (classical) accepts it but restricts KP. Node 3’s "non-Fitch present" question *might* distinguish them (Edgington says "yes", Dummett may agree), but Dummett avoids Node 2 via logic. The tree cleanly separates them at Node 1.  
  - **Tennant (Leaf 2) vs. Edgington (Leaf 3)**: Separated by Node 4 (knowability across time). However, if a respondent answers Node 3 with "yes" and Node 4 with "no", they go to Edgington; "yes" to both goes to Tennant. Real-world ambiguity in "knowable at a later time" may cause overlap, but the cases force a split.  
  - **All leaves**: "Knowable by" isn’t fully routed. Adding it explicitly would require 3–4 extra nodes, breaching constraints. Diagnose implicitly in leaf descriptions.

