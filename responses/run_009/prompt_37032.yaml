prompt: |-
  Software engineer here, no math or philosophy background beyond what leaks in through the job. For fun I tinker with simulations -- double pendulums, little agent-based ecosystems, game-of-life variants, that kind of thing. And I keep noticing a pattern I don't have a word for.

  In these sims, the exact future is hopeless. Flip one bit of the inital state and after a while the two runs look completely unrelated. But the coarse stuff is rock solid. If I ask "where is the pendulum at t=200" I get garbage; if I ask "what fraction of its time does it spend in the left half" I get the same number to three decimal places no matter where I start it. The system is fully deterministic, yet it splits into two layers: unpredictable in its states, extremely predictable in its statistics. Growing up I basically equated "deterministic" with "predictable in principle," and these sims quietly broke that, but the statistics layer keeps sneaking predictability back in through a side door.

  Then, occasionally, I hit the reverse case. A ball rolling around a bumpy landscape: where it ends up, even averaged over hundreds of runs, is basically a coin flip -- a vanishingly small nudge flips whole regions of starting points to a different final resting place. There it's not just the state that's fragile, it's the long-run statistics themselves.

  So my question: is there an established concept, or pair of concepts, for this split -- for classifying which parts of a deterministic system's future are predictable, states versus statistics? I know about the butterfly effect, but that's the name for the failure, and I want the name for the layer that survives, plus whatever you call the pathological systems where even that layer is fragile. And is there any principled way to tell which camp a system falls into before you run it, or is it an empirical "just run it and see" thing? If nobody's named this exact configuration, then coin a term for me and tell me where the edges are -- how it differs from plain chaos, from ergodicity, and from just averaging a bunch of noisy samples. A bare name won't help much; I want to know what exactly the phenomenon is and what it isn't.
reasoning: |-
  Okay, let me unpack this. The user is a software engineer who tinkers with simulations like double pendulums and agent-based ecosystems. They've noticed a fascinating pattern: deterministic systems where individual states are unpredictable due to sensitivity to initial conditions (butterfly effect), but aggregate statistics remain stable. Conversely, sometimes even those statistics are fragile. They want terminology for this split and a way to predict which systems will exhibit robust statistics.

  First, I need to recall relevant concepts. Chaos theory comes to mind—sensitive dependence on initial conditions. But chaos alone doesn't explain stable statistics. The key is ergodicity: systems where time averages equal space averages. For the pendulum example, time spent in left half is predictable because the system explores all states uniformly over time. 

  Then there's the opposite case—non-ergodic systems where statistics aren't stable. Like the ball in a bumpy landscape getting stuck in local minima. This sounds like multistability or fractal basins of attraction. Small changes push the system into different attractors, making even averages unpredictable.

  The user might conflate determinism with predictability. Chaos shows they can diverge. But stable statistics offer a "higher-level" predictability. Terms like "statistical stability" or "coarse-grained predictability" fit. For fragile statistics, "non-ergodic" or "brittle statistics" works. 

  They also want to know how to predict this before running simulations. Key factors are ergodicity (mixing systems) versus multistability (competing attractors). Phase space structure matters—smooth attractors vs. fractal basins. Computation theory might apply; some systems are unpredictable regardless of resources. 

  I should distinguish this from simple noise averaging. In deterministic chaos, randomness emerges from dynamics, not external noise. The stability comes from the system's intrinsic exploration of phase space. 

  Finally, practical advice: simulate, check for ergodicity, analyze attractor geometry, compute Lyapunov exponents. But caution—some systems are deceptive. Need to emphasize that while tools exist, empirical testing is often necessary.
answer: |-
  This is a **beautiful** observation hitting right at the heart of complex dynamics! You've perfectly described the core tension in deterministic chaos and ergodic theory. The concepts have names, and there are principled (though often hard) ways to think about which camp a system falls into.

  **The Core Concepts & Terminology**

  1.  **The "Unpredictable States" Layer:** This is **Chaos**. Specifically, you're describing **sensitive dependence on initial conditions (SDIC)** – the hallmark of chaotic systems. Small differences in starting points (flipping a bit) lead to exponentially diverging trajectories. Prediction of the exact microstate is impossible in practice (and often in principle) beyond a short horizon.

  2.  **The "Predictable Statistics" Layer:** This is **Ergodicity** and **Mixing**. More precisely, it's about having **robust statistical properties** or **stable invariant measures**.
      *   **Ergodicity:** Simplistically, over *infinite* time, the system explores *all* parts of its available phase space in a way proportional to the "size" of those parts. Time averages equal ensemble averages. (Your pendulum spends time in the left half proportional to the measure of states leading to being left).
      *   **Mixing:** A stronger property. Imagine dropping a drop of ink into water. A mixing system will eventually spread that ink *uniformly* throughout the water. Trajectories starting close together become *completely decorrelated* over time, uniformly filling the available space. This is why your statistics converge beautifully – the system "forgets" its initial microstate incredibly well and uniformly samples its phase space.

  3.  **The "Fragile Statistics" Case:** This is **Non-Ergodicity**, often arising from **Multistability** or **Fractal Basins of Attraction**.
      *   **Multistability:** The system has *multiple* distinct long-term behaviors or **attractors** (e.g., different resting places for the ball). The system gets "stuck" in one.
      *   **Fractal Basins of Attraction:** The set of initial conditions leading to each attractor isn't a smooth blob; it's an infinitely complex, intertwined fractal structure. Tiny nudges can jump the starting point from the basin of one attractor into the basin of another. Crucially, these basins are often **riddled** or have **positive Lebesgue measure boundaries**, meaning there's a *non-zero volume* (area, measure) of starting points where an *infinitesimal* change flips the final outcome. This destroys predictability of *any* long-term statistic that depends on *which* attractor is reached.

  **The Split You Described:**

  *   **Predictable States: Impossible.** (Chaos/SDIC)
  *   **Predictable Statistics: Possible & Robust.** (Ergodicity/Mixing)
  *   **Pathological Case (Fragile Statistics):** Non-Ergodicity + Fractal Basins / Multistability.

  **Names for the Layers:**

  *   **The Surviving Layer:** **Statistical Stability**, **Robust Invariant Measure**, **Coarse-Grained Predictability**, **Ergodic/Mixing Behavior**.
  *   **The Pathological Layer:** **Statistical Brittleness**, **Non-Ergodic Behavior**, **Sensitivity of the Attractor** (or **Basin Sensitivity**).

  **Predicting the Camp: Principles vs. Practice**

  It's not *just* "run it and see," but rigorous analysis is often very hard. Here's how to think about it:

  1.  **Ergodicity/Mixing (Robust Stats):**
      *   **Phase Space Connectivity:** Is the "interesting" part of the phase space (the attractor) **connected**? Can the system theoretically get from any point on the attractor to any other point? (Your pendulum's chaotic attractor is a single, complex, connected object).
      *   **Mixing Dynamics:** Does the system have mechanisms that constantly "stir" its state? (Like the nonlinear stretching and folding in chaotic flows).
      *   **Absence of Barriers:** Are there no insurmountable barriers (like high energy ridges) or deep potential wells that trap the system indefinitely in sub-regions?
      *   **Lyapunov Exponents:** While positive exponents indicate chaos (SDIC), for robust statistics, you want the system to be **hyperbolic** or **have a Sinai-Ruelle-Bowen (SRB) measure**. This essentially guarantees nice statistical properties despite chaos. (This is deep math, but the key point is: not all chaotic systems have robust stats!).
      *   **Observation:** Simulate many long runs from different starts. Do time averages (like your pendulum fraction) converge to the *same* value? Do histograms of state variables look identical? If yes, strong evidence for ergodicity/mixing.

  2.  **Non-Ergodicity / Fragile Stats (Bumpy Ball):**
      *   **Multiple Attractors:** Does the system have distinct, separate "end states" or long-term behaviors?
      *   **Fractal Basin Boundaries:** Is the boundary between regions leading to different attractors complex and infinitely detailed? (This is almost universal for nonlinear multistable systems).
      *   **Riddled Basins / Wada Property:** Do the basins interpenetrate infinitely? Does *every* point on a boundary have other basins arbitrarily close? This is the killer for predictability.
      *   **Observation:** Simulate pairs of runs from *very* close starting points. Do they *consistently* end up in *different* final states? Plot the final state (or a key statistic) vs. starting position – do you see a complex, fragmented pattern? Does averaging over initial conditions *not* converge as you increase sample size? (The average resting place jumps wildly).

  **Distinguishing Features**

  *   **vs. Plain Chaos:** Chaos is necessary but *not* sufficient for robust statistics. Chaos gives you SDIC (unpredictable microstate). Ergodic theory tells you when you *also* get predictable statistics *despite* the chaos. Your pendulum is chaotic *and* ergodic/mixing. A system with fractal basins is chaotic but *non-ergodic* (statistics are fragile).
  *   **vs. Ergodicity:** Ergodicity is the *minimum* requirement for time averages to equal space averages. Mixing is stronger and implies faster convergence of statistics. Non-ergodic systems violate this fundamentally.
  *   **vs. Averaging Noisy Samples:** This is a crucial point! In your deterministic simulations, the "randomness" *emerges intrinsically* from the nonlinear dynamics and SDIC. There is **no external randomness** added. The predictable statistics are a property of the *deterministic rules themselves* and the geometry of the phase space they create. Averaging noisy samples is about reducing *external* stochasticity; here, averaging reveals the *intrinsic deterministic invariant measure*.

  **Coining a Term (If you insist!)**

  *   **Robust Statistics Case:** **Ergodic Stability** or **Mixing Resilience**. (Highlights the core property enabling the predictability).
  *   **Fragile Statistics Case:** **Attractor Fragility** or **Basin Brittleness**. (Highlights why the statistics fail).

  **The Bottom Line**

  You've encountered the profound difference between **predicting a state** and **predicting a statistic** in deterministic dynamical systems. Chaos ensures the former is impossible long-term. **Ergodicity** and **Mixing** are the properties that rescue predictability at the statistical level, making your coarse-grained questions meaningful. **Multistability** combined with **Fractal Basin Boundaries** is the primary mechanism that can destroy even this statistical predictability. While identifying these properties analytically is tough, your approach of probing the system with simulations – looking for convergence of statistics or sensitivity of outcomes to tiny perturbations – is exactly the right empirical way to characterize it. Keep tinkering! You're exploring the fascinating boundary between determinism and predictability.
