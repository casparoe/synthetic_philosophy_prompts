answer: |-
  ## Joint Statement from Adversarial Collaboration on Negro Art, Harlem, 1927

  **Preamble:** We, representatives of differing perspectives within the New Negro movement, recognising the urgency of our shared condition and the vital potential of artistic expression, have engaged in good-faith dialogue. While fundamental differences remain, we establish this document outlining agreed premises, clarified disagreements, and key points of contention ("cruxes") for ongoing consideration. Our aim is not forced consensus, but mutual understanding to strengthen the collective endeavour of Negro art.

  **Section 1: Agreed Premises (Condition of Black America & Art's Capacities/Limitations)**

  1.  **The Pervasiveness of Racism:** African Americans in the 1920s exist under a system of profound racial prejudice, discrimination, and violence (including lynching, segregation, economic exploitation, and pervasive stereotyping). This reality fundamentally shapes Black life and consciousness.
  2.  **The Power and Danger of Representation:** Dominant white culture produces and disseminates damaging, dehumanising stereotypes of Negroes through popular art, media, and education. Countering these falsehoods is a critical cultural task.
  3.  **Art as a Site of Struggle:** Artistic expression by Negroes inevitably exists within, and responds to, this context of oppression. It cannot be wholly divorced from the racial realities of America.
  4.  **Art's Evocative Power:** Art possesses a unique capacity to move the emotions, awaken empathy, challenge assumptions, and shape perception in ways rational argument alone cannot.
  5.  **Art's Limitations:** Art alone cannot dismantle systemic racism, guarantee political rights, or directly create economic equity. Its power operates primarily within the realms of consciousness, identity, and cultural perception.
  6.  **The Need for Complex Representation:** Negro art must move beyond simple, reactionary counter-stereotypes or minstrelsy. It must strive to capture the full, complex humanity, diversity, and inner lives of Black people.
  7.  **The Value of Self-Expression:** The act of Negro artists giving voice to their unique perspectives, experiences, and imaginations holds inherent value for individual and collective identity formation.

  **Section 2: Clarified Disagreements (Phrased for Acceptance by Each Camp)**

  | Area of Disagreement                  | Camp One (Du Boisian View)                                                                 | Camp Two (Aesthetic Autonomy View)                                                               |
  | :------------------------------------ | :----------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------- |
  | **Primary Function of Negro Art**     | Negro art must be consciously wielded as a weapon in the struggle for racial justice, dignity, and political advancement; its primary duty is to the race. | Negro art's primary function is the authentic expression of the individual artist's vision and the creation of beauty; its duty is to artistic truth and integrity first. |
  | **The Nature of "Propaganda"**        | All art, consciously or not, serves a propagandistic function by promoting a particular worldview; Negro artists must consciously harness this power for racial vindication and liberation. | While art may *have* effects, reducing it *to* propaganda (defined as deliberate, didactic messaging for a specific cause) undermines its deeper aesthetic and universal potential; art's value transcends immediate political utility. |
  | **Artistic Freedom vs. Responsibility** | The artist's individual freedom must be tempered by a profound responsibility to represent the race truthfully and strategically in the face of its enemies; ignoring this is a dereliction of duty. | The artist's primary responsibility is to their own creative vision and artistic standards; external demands for specific representations or messages constitute a new form of constraint inhibiting genuine expression. |
  | **Judging Negro Art**                 | Negro art must ultimately be judged not only on aesthetic merit but also on its fidelity to truth and its efficacy in advancing the race's cause against oppression. | Negro art must be judged primarily by the same universal standards of aesthetic quality, originality, and emotional/intellectual depth applied to all art, irrespective of the race of its creator. |

  **Section 3: Cruxes & Concrete Cases for Consideration**

  **Crux 1: Is Beauty Primarily a Route to Truth (Including Racial Truth) or an Intrinsic Value (Pleasure/Form)?**
  *   **Camp One Prediction:** Beauty, when authentically derived from the Black experience, reveals fundamental truths about the race's humanity, struggles, and spirit, thereby compelling recognition and serving justice.
  *   **Camp Two Prediction:** Beauty is primarily an intrinsic value arising from form, skill, and perception; while it *may* illuminate truth or inspire, its core worth lies in the aesthetic experience itself, not a predetermined truth it must convey.
  *   **Agreed Case for Examination: Claude McKay's "Harlem Shadows" (Poem, 1922).**
      *   *Camp One Analysis (Prediction Supported):* The poem's stark beauty and evocative imagery ("I hear the halting footsteps of a lass... / In Negro Harlem when the night lets fall") truthfully exposes the harsh realities and resilient spirit of marginalised Black life, forcing recognition of shared humanity and suffering, thus advancing the cause.
      *   *Camp Two Analysis (Prediction Supported):* The poem's power lies in its masterful sonnet form, vivid sensory details, and universal evocation of loneliness and urban decay. Its beauty transcends its specific Harlem setting, offering a profound aesthetic experience that resonates regardless of race; its value is not contingent on a specific political truth revealed.

  **Crux 2: Who Decides What Constitutes "Good" or Effective Propaganda?**
  *   **Camp One Prediction:** Effectiveness is measured by tangible outcomes (shifting white opinion, galvanising Black communities, influencing policy debates). "Good" propaganda aligns with the strategic goals of the race's vanguard leadership (e.g., NAACP) and accurately reflects the collective experience and aspirations.
  *   **Camp Two Prediction:** Demands for "good" propaganda impose an external, often reductive, political litmus test on art. Effectiveness is subjective, fleeting, and risks sacrificing complexity for dogma. The artist is the ultimate arbiter of their expression's integrity.
  *   **Agreed Case for Examination: Nella Larsen's "Passing" (Novel, 1929).**
      *   *Camp One Potential Critique (Illustrates Difficulty):* While beautifully written and revealing internal conflicts, the novel focuses on the psychologically fraught lives of light-skinned women "passing." Does this serve the cause effectively? It might be seen as indulging a marginal experience or even reinforcing colourism, rather than directly confronting the core brutalities of segregation faced by the majority. Is this "good" propaganda? (Prediction: Likely not deemed optimally effective for the primary struggle).
      *   *Camp Two Defence (Illustrates Autonomy Argument):* The novel's brilliance lies precisely in its complex, ambivalent exploration of identity, desire, and the psychological toll of racism *as experienced by these specific characters*. Its power *as art* – its ambiguity, tension, and character depth – offers a profound, albeit indirect, commentary on race that a more direct polemic could not. Its value exists independently of a narrow political metric (Prediction: Artistic integrity maintained, value inherent).

  **Note on Verbal Dispute: The Term "Propaganda"**
  A significant portion of the disagreement stems from the definition and connotations of "propaganda."
  *   **Camp One (Du Bois):** Employs a broad, functional definition: any art that shapes perception and belief, consciously or not. He argues it's an inevitable function, so Negro artists *must* consciously direct it. For him, "propaganda" isn't inherently crude; truthful, beautiful art *is* the best propaganda.
  *   **Camp Two (Locke/Thurman):** Reacts against the term's common association with didacticism, simplification, distortion, and external control. They fear it reduces art to a mere tool, demanding conformity to a party line ("uplift") and stifling individual vision and aesthetic exploration. They argue for separating art's inherent value from its *potential* effects.

  **Conclusion:** Our collaboration confirms deep shared concerns about the Negro condition and the transformative potential of art. Our divergence centres on art's *primary* obligation and the mechanisms by which it best serves our people. We agree that Negro art must be complex, truthful, and skilled. We disagree on whether its ultimate judges are the imperatives of the struggle or the imperatives of the artistic vision itself, and whether conscious direction towards racial advancement enhances or inhibits its deepest power. We commit to continued dialogue, recognising that the vibrant, multifaceted output of the New Negro Renaissance itself is the richest field for testing our respective positions. The debate continues, not as a schism, but as a necessary dialectic within a vital movement.
