  Below is a decision tree designed to guide participants from the starting commitment ("there is a fact of the matter about whether a condition is a disease, discoverable by sufficient biomedical research") to a position on the naturalism-normativism spectrum. The tree uses concrete, case-based branch questions answerable without philosophical training, incorporates your five specified cases, and results in 12 leaf positions (including the major theories you requested). Questions are phrased in American English for readability with a group of retired scientists/physicians.

  ---

  ### **Decision Tree: Classifying Views on Disease**

  **Instructions:** Start at Question 1. Answer based on your intuition about the cases. Proceed to the next question or leaf position as directed. No prior philosophy knowledge is needed.

  ---

  #### **Question 1: Eliminativism Check**  
  *Context: You encounter a rare immune disorder with a precise genetic mechanism (e.g., a specific cytokine deficiency).*  
  **Q:** Should we replace the term "disease" with mechanistic descriptions like "cytokine-X deficiency" in medical science, since "disease" adds no unique information?  
  - **Yes** → **Leaf 1: Eliminativism/Debunking View** (The term "disease" is scientifically redundant; use only mechanistic descriptions).  
  - **No** → Proceed to Question 2.  

  ---

  #### **Question 2: Animal Case (Livestock/Lab Context)**  
  *Context: A dairy cow has a harmless genetic variant that reduces milk yield by 30% compared to herd averages. It causes no pain, disability, or shortened lifespan.*  
  **Q:** Is this variant a disease in the cow?  
  - **Yes** → Proceed to Question 3.  
  - **No** → Proceed to Question 4.  

  ---

  #### **Question 3: Aging Decline Case**  
  *Context: An 85-year-old has lung function at the average for her age group, with no symptoms or limitations compared to peers.*  
  **Q:** Is this age-related decline in lung function a disease?  
  - **Yes** → Proceed to Question 5.  
  - **No** → Proceed to Question 6.  

  ---

  #### **Question 4: Grief Case**  
  *Context: A person loses their spouse and meets all DSM-5 symptom criteria for major depression (e.g., weight loss, insomnia, anhedonia), but it’s a proportional response to bereavement.*  
  **Q:** Is this grief a disease?  
  - **Yes** → Proceed to Question 7.  
  - **No** → Proceed to Question 8.  

  ---

  #### **Question 5: Hypertension Threshold Case**  
  *Context: A blood pressure reading of 142/92 mmHg was "normal" in 1960 but is "stage-1 hypertension" today, with no new causal mechanism discovered.*  
  **Q:** Does this change imply disease status isn’t purely a biological fact?  
  - **Yes** → **Leaf 2: Hybrid Naturalism-Normativism (No Age Adjustment)** (Dysfunction exists, but values set thresholds; aging decline is always pathological).  
  - **No** → Proceed to Question 9.  

  ---

  #### **Question 6: Hypertension Threshold Case (Repeated for Path)**  
  *Context: Same as Question 5 (142/92 mmHg was normal in 1960, hypertensive today).*  
  **Q:** Does this change imply disease status isn’t purely a biological fact?  
  - **Yes** → **Leaf 3: Weak Hybrid View** (Dysfunction + values; aging decline is not disease).  
  - **No** → Proceed to Question 10.  

  ---

  #### **Question 7: Hypertension Threshold Case (Repeated for Path)**  
  *Context: Same as Question 5 (142/92 mmHg was normal in 1960, hypertensive today).*  
  **Q:** Does this change imply disease status isn’t purely a biological fact?  
  - **Yes** → **Leaf 4: Thoroughgoing Normativism** (Disease is entirely value-laden; no biological "fact" independent of judgments).  
  - **No** → **Leaf 5: Fixed-Harm Normativism** (Harm is objective/universal; values don’t change thresholds).  

  ---

  #### **Question 8: Risk Gene Case**  
  *Context: A person carries a gene variant (e.g., BRCA1) that confers a 70% lifetime risk of breast cancer. They never develop cancer due to preventive surgery or luck.*  
  **Q:** Does this person *currently* have a disease?  
  - **Yes** → **Leaf 6: Risk-as-Disease Hybrid** (High risk is itself harmful/dysfunctional).  
  - **No** → Proceed to Question 11.  

  ---

  #### **Question 9: Risk Gene Case (Repeated for Path)**  
  *Context: Same as Question 8 (BRCA1 carrier, no cancer).*  
  **Q:** Does this person *currently* have a disease?  
  - **Yes** → **Leaf 7: Strong Naturalism** (Statistical abnormality = disease; no need for symptoms).  
  - **No** → **Leaf 8: Dysfunction-Requiring Naturalism** (Disease requires *current* functional impairment).  

  ---

  #### **Question 10: Risk Gene Case (Repeated for Path)**  
  *Context: Same as Question 8 (BRCA1 carrier, no cancer).*  
  **Q:** Does this person *currently* have a disease?  
  - **Yes** → **Leaf 9: Biostatistical Theory (Boorse-Style)** (Disease is subnormal function for age/sex reference class; risk isn’t disease).  
  - **No** → **Leaf 10: Harmful Dysfunction (Wakefield-Style)** (Disease requires *both* biological dysfunction *and* harm; risk alone lacks harm).  

  ---

  #### **Question 11: Hypertension Threshold Case (Repeated for Path)**  
  *Context: Same as Question 5 (142/92 mmHg was normal in 1960, hypertensive today).*  
  **Q:** Does this change imply disease status isn’t purely a biological fact?  
  - **Yes** → **Leaf 11: Harmful Dysfunction (Wakefield-Style)** (Dysfunction is natural; harm is value-laden, so thresholds drift).  
  - **No** → **Leaf 12: Objective Dysfunction Hybrid** (Dysfunction *and* harm are both biological facts; thresholds don’t drift).  

  ---

  ### **Leaf Positions Summary**
  1. **Eliminativism/Debunking View**: "Disease" is scientifically useless; use mechanistic terms.  
  2. **Hybrid Naturalism-Normativism (No Age Adjustment)**: Dysfunction is natural, but values set thresholds; aging decline is always disease.  
  3. **Weak Hybrid View**: Dysfunction + values; aging decline is not disease.  
  4. **Thoroughgoing Normativism**: Disease is purely value-laden; no biological "facts."  
  5. **Fixed-Harm Normativism**: Harm is objective/universal; values don’t change thresholds.  
  6. **Risk-as-Disease Hybrid**: High risk is inherently harmful/dysfunctional.  
  7. **Strong Naturalism**: Statistical abnormality = disease (even without symptoms).  
  8. **Dysfunction-Requiring Naturalism**: Disease requires current functional impairment.  
  9. **Biostatistical Theory (Boorse-Style)**: Disease is subnormal function for a reference class (age/sex-adjusted).  
  10. **Harmful Dysfunction (Wakefield-Style)**: Disease requires biological dysfunction + harm.  
  11. **Harmful Dysfunction (Wakefield-Style)**: (Same as #10, but reached via alternate path).  
  12. **Objective Dysfunction Hybrid**: Dysfunction and harm are both biological facts.  

  ---

  ### **Analysis as Requested**

  #### **1. Unoccupied Combinations**  
  - **Leaf 5 (Fixed-Harm Normativism)**: Unoccupied in practice. *Coherent but unattractive*: Assumes harm is objective/unchanging, conflicting with empirical shifts in thresholds (e.g., hypertension).  
  - **Leaf 6 (Risk-as-Disease Hybrid)**: Unoccupied. *Coherent but unexplored*: No major theory treats risk alone as disease without dysfunction or harm.  
  - **Leaf 12 (Objective Dysfunction Hybrid)**: Unoccupied. *Incoherent*: Claims harm is purely biological (not value-laden), yet harm requires normative judgments (e.g., "suffering" implies values).  

  #### **2. Pairs the Tree Cannot Separate**  
  - **Leaf 10 vs. Leaf 11 (Both Wakefield-Style Harmful Dysfunction)**: Identical position reached via different paths. The tree *fails to separate them* because the reference-class question (aging case, Q3) doesn’t distinguish Wakefield from Boorse—both answer "no" (aging decline isn’t disease). This exposes your suspicion: reference-class selection **cannot** reliably divide naturalism (Boorse) from hybrid views (Wakefield) since both reject pathologizing aging.  
  - **Leaf 2 vs. Leaf 3 (Both Hybrids)**: Only separated by the aging case (Q3), but their core similarity (values influence thresholds) is obscured by how aging is handled.  

  #### **3. Branch to Delete (If Forced)**  
  Delete **Question 5/6/7/11 (Hypertension Threshold Case)**. Rationale: Answers often track **familiarity with clinical guidelines** (e.g., knowing hypertension thresholds shifted due to population studies, not mechanisms) rather than deep conviction. A physiologist unaware of this history might default to "no" (biological fact), while others say "yes" (values), creating false divisions. The other cases (aging, grief, risk gene) more reliably tap into intuitions about biology vs. values.  

  ---

  ### **Tree Logic Notes**
  - **Design Priority**: Branches partition the logical space first (e.g., "Is disease biological?" → Animal Case; "Can values override biology?" → Hypertension/Grief). Named positions are mapped second.  
  - **Key Insights**:  
    - The animal case (Q2) isolates **naturalism** (animal dysfunction = disease) from **normativism/hybrids** (disease requires human-relevant harm).  
    - Grief (Q4) forces a choice on **social context** (normal response vs. symptom checklist), exposing normativism.  
    - The tree reveals **reference-class selection** (Q3) as a weak divider, as predicted.  
  - **Efficiency**: 7 questions create 12 leaves without redundancy (e.g., hypertension is reused where it best splits views).  
  - **For Your Group**: Focus discussion on *why* answers diverge at ambiguous cases (e.g., grief, aging), as this reveals philosophical commitments.  

