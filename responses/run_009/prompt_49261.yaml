prompt: |-
  I'm in a philosophy of probability seminar this semester, and we just spent two weeks on anthropic reasoning and it's kind of wrecking me. The professor framed everything as a fight between the self-sampling assumption (reason as if you're a random sample from the observers in your reference class) and the self-indication assumption (also weight hypotheses by how many observers they'd contain). And the flashpoints are the usual suspects: the Doomsday argument, Sleeping Beauty, and Bostrom's presumptuous philosopher, where SIA tells you to bet on the theory that posits a trillion observers over the theory that posits ten, with no evidence at all except your own existence.

  Here's the thing though. My roommate (physics grad student, insufferable) claims the whole SSA vs SIA fight is fake, because if you're careful about reference classes the two collapse into each other, and the real content of the disagreement is smuggled into how you pick who counts as "in your reference class" — so arguing about SSA vs SIA directly is like arguing about whether a recipe is good while refusing to say what ingredients you have. Meanwhile a friend from the seminar thinks the dispute never even gets that far, because there's a prior question about whether indexical self-locating evidence should update credences at all (she keeps bringing up Beauty waking up not remembering prior wakings as showing that maybe self-location is just epistemically inert and you should condition on the non-indexical facts only). I honestly can't tell if either of them is onto something or whether they're both dodging the question.

  So I want an essay that takes a side. Lay out what the disagreement between SSA and SIA actually turns on, evaluate whether my roommate's "it's all reference class" move and my friend's "self-location is inert" move are genuine ways out or just relabelings of the problem, and weigh how each position handles the presumptuous philosopher case versus how it handles Doomsday (I'm fine with you concluding one of those cases should just be bitten as a bullet). Please don't end wishy-washy — I want a definite verdict on which assumption we should reason with, or a definite verdict that both are broken and something else entirely is needed. End with a final line in exactly this form: "Verdict: " followed by either SSA, SIA, BOTH-BROKEN, or a short phrase (under ten words) naming what we should use instead.
