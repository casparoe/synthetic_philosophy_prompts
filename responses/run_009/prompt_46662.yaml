answer: |-
  ### Session Plan: Information Cascades in Social Epistemology

  #### **1. Core Game: Urn-Guessing Task (25 minutes)**
  - **Setup**: Two urns—Urn A (contains 2 blue balls, 1 red) and Urn B (contains 1 blue ball, 2 red). Facilitator secretly draws the urn (50% probability each).  
  - **Signal Accuracy**: 2/3 (each participant draws one ball *with replacement*; blue signals Urn A, red signals Urn B).  
    - *Defense of 2/3*:  
      - Higher accuracy (e.g., 90%) causes near-instant cascades, trivializing the phenomenon.  
      - Lower accuracy (e.g., 55%) makes cascades too rare to observe in a small group.  
      - 2/3 balances likelihood of cascade formation (after 2–3 signals) with non-trivial error probability.  
  - **Procedure**:  
    - Participants seated in fixed order. Each receives a private signal card (e.g., "A" or "B").  
    - Sequential public guesses: Participant states "A" or "B" aloud, based on prior public guesses and private signal.  
    - **Payoffs**: 1 point for correct final guess, 0 otherwise (no real money).  
  - **Bayesian Arithmetic Prep (for debrief)**:  
    - Prior: \( P(A) = P(B) = 0.5 \).  
    - Signal accuracy: \( P(\text{signal A} | A) = 2/3 \), \( P(\text{signal B} | B) = 2/3 \).  
    - **Example posterior after two "A" guesses**:  
      - Signals imply two "A" draws (if early actors follow signals).  
      - \( P(A | \text{two A signals}) = \frac{(0.5) \times (2/3)^2}{(0.5) \times (2/3)^2 + (0.5) \times (1/3)^2} = \frac{4/9}{4/9 + 1/9} = 4/5 \).  
    - **Cascade threshold**: After two identical guesses (e.g., "A, A"), the third actor ignores a "B" signal:  
      - \( P(A | \text{two A signals, one B signal}) = \frac{(0.5) \times (2/3)^2 \times (1/3)}{(0.5) \times (2/3)^2 \times (1/3) + (0.5) \times (1/3)^2 \times (2/3)} = \frac{4/54}{4/54 + 2/54} = 2/3 > 0.5 \).  
      - **Result**: Actor 3 chooses "A" regardless of signal—cascade begins.  

  ---

  #### **2. Variant Phase: Informational vs. Reputational Herding (20 minutes)**  
  - **Setup**: New urn draw. Randomly assign roles:  
    - **Group 1 (Accuracy)**: 15 students. Payoff: 1 point for correct urn guess.  
    - **Group 2 (Reputation)**: 5 students. Payoff: 1 point for matching the *majority guess* of the group.  
  - **Procedure**:  
    - Same sequential guessing as Core Game.  
    - Reputation group informed of payoff *privately* to avoid peer influence.  
  - **Predicted Differences**:  
    - *Informational herding* (Accuracy group): Herd only after public evidence outweighs private signal (e.g., cascade threshold reached).  
    - *Reputational herding* (Reputation group): Herd immediately to align with perceived majority, ignoring private signals.  
  - **Debrief Link**: Contrast behavior—reputation actors herd earlier, possibly triggering premature cascades.  

  ---

  #### **3. Fragility Demonstration: Shattering the Cascade (15 minutes)**  
  - **Setup**: During Core Game or a new round, allow cascade to form (e.g., 5+ identical guesses after threshold).  
  - **Intervention**:  
    - Publicly reveal one *private signal* from an early cascade participant (e.g., "Participant 3’s signal was ‘B’").  
    - **Alternative**: Introduce a "new entrant" (e.g., late-arriving student) rewarded only for accuracy, shown full history and given a private signal.  
  - **Rationale**:  
    - Revealed signal contradicts herd, exposing weak informational foundation.  
    - New entrant (no reputational stake) uses unbiased Bayesian updating, often breaking cascade if signal contradicts.  
  - **Example**: After two "A" guesses and revealed "B" signal, \( P(A) = 2/3 \) (not cascade-proof). Next actor with "B" signal updates to \( P(A) = 0.5 \), breaking herd.  

  ---

  #### **4. Debrief (25 minutes)**  
  - **Map Phases to Theory**:  
    - **Core Game**:  
      - *Self-sustaining cascade*: After two identical signals, public history dominates private information.  
      - *No new information in cascade*: Choices are independent of signals, so later actors add no information.  
      - *Error probability*: With 2/3 signals, wrong cascade forms with probability \( \frac{1}{2} \times (1/3)^2 = 5.5\% \) after two signals.  
    - **Variant**: Reputational payoffs cause herding *without* informational justification; accuracy payoffs align with Bayesian rationality.  
    - **Fragility**: Cascades collapse under signal revelation/new entry—public history is fragile if built on few early signals.  
  - **Limitations of Classroom**:  
    - Real-world stakes (e.g., financial ruin) raise conformity pressure.  
    - Truly private signals are hard to enforce (students may infer from peers).  
    - Large-scale cascades (1000s of actors) amplify error probability beyond small-group scope.  
    - *Facilitator note*: Emphasize that classroom proxies illustrate mechanics, not scale.  

  ---

  #### **5. Predicted Failure Modes and Remedies**  
  - **Aloud Deliberation Contaminating Signals**:  
    - *Remedy*: Strict silence rule; eject signals to slips. Penalize talking.  
  - **Misunderstood Payoffs**:  
    - *Remedy*: Pre-game quiz ("Calculate your payoff if you choose A, true urn is B...").  
  - **Cascade Fails to Form (Early Second-Guessing)**:  
    - *Remedy*: Clarify "no strategizing for the group" in rules; use practice round.  
  - **Weak Cascade (Low Signal Accuracy)**:  
    - *Remedy*: Pre-run Bayesian calculations for the first 5 actors to validate thresholds.  
  - **Reputation Group Not Herding**:  
    - *Remedy*: Simplify payoff explanation ("1 point if you match the most common guess").  

  ---  
  **Timing Notes**: Core Game (25 min) → Variant (20 min) → Fragility (15 min) → Debrief (25 min). Total: 85 min + 5 min buffer. Ensure urn draws/signals are private and sequential. Use whiteboard to track guesses and update posteriors in debrief.
