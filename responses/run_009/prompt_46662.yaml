  ---

  **Session Plan: Information Cascades**

  **Total Time**: 90 minutes

  **Materials**:
  - Two urns (or representations): Urn A (contains 2 blue balls and 1 red ball), Urn B (contains 1 blue ball and 2 red balls). Alternatively, use a deck of cards or a computer simulation.
  - Slips of paper for the secret urn choice (two slips: one "A", one "B").
  - A bowl for drawing the urn.
  - A container for drawing balls (with replacement) for signals. Or a random number generator.
  - Scoreboard (on whiteboard) for points.
  - Private signal cards: for each participant, a card that says "A" or "B" (the signal). For Urn A, P("A")=2/3, P("B")=1/3; and vice versa for Urn B.
  - Instructions handouts.

  **Participants**: 20 students, seated in a fixed order (or randomly assigned order each round).

  **Procedure**:

  1. **Introduction (5 minutes)**:
     - Explain the core game: We are trying to guess which urn has been selected (A or B). The urn is chosen randomly (50-50). Each participant will receive a private signal (a draw from the urn) that is correct with probability 2/3. They will make a public guess in sequence. They see the guesses of all before them. They are rewarded 1 point for a correct guess.

  2. **Core Game (25 minutes)**:
     - Step 1: Draw the urn: Have a student draw a slip from a bowl with two slips ("A" and "B") to choose the urn secretly. The facilitator knows the urn, but the students do not.
     - Step 2: Generate private signals: For each student, draw a ball (with replacement) from the chosen urn. If blue, the signal is "A"; if red, the signal is "B". Write the signal on a card and hand it to the student privately.
     - Step 3: Sequential guessing: 
          - Call students one by one in order. Each states their guess (A or B) publicly. They may base it on the public guesses so far and their private signal.
          - Record each guess on the board.
     - Step 4: Continue until all 20 have guessed.
     - Step 5: Reveal the true urn and assign points.

  3. **Variant Phase (25 minutes)**:
     - Explain: We will play again, but with a twist. 
          - 5 randomly selected students (the "reputation" group) are told: "You will get 1 point if your guess matches the majority guess of the entire group at the end, and 0 otherwise." 
          - The remaining 15: "You get 1 point if your guess is correct, 0 otherwise."
     - Draw a new urn and new signals.
     - Reshuffle the order of participants (to avoid position effects).
     - Run the sequential guessing, recording guesses.
     - At the end, compute the majority guess (the mode of the 20 guesses) and assign points to the reputation group accordingly. Reveal the true urn for the accuracy group.

  4. **Fragility Demonstration (15 minutes)**:
     - We return to the core game (or run a new core game round, but we can also use data from the first core game if a cascade formed). 
          - If a cascade formed in the first core game, use that. Otherwise, run a new round until a cascade forms (say after 2-3 identical guesses and then subsequent guesses follow without deviation).
          - Stop after about 10 participants. 
          - Randomly select one participant from those who chose the cascade action (say the third or fourth) and ask them to reveal their private signal. (Note: if they are in a cascade, they might have ignored their signal. So their signal might contradict the cascade.)
          - Then continue the game from the next participant. 
          - See if the cascade breaks.

     Alternatively, if we don't have a cascade in the first round, we can pre-arrange the signals for a new round to ensure a cascade and then break it.

  5. **Debrief (20 minutes)**:
     - Core Game: 
          - Show the Bayesian updating for the first few participants. Use the actual guesses and signals (if revealed in fragility, or ask participants to reveal their signals at the end for this round).
          - Highlight when the cascade started (after two identical guesses) and how the subsequent choices did not add information.
          - Discuss: why the cascade can be wrong? Compute the probability of a wrong cascade at the start.
     - Variant Phase:
          - Compare the behavior of the reputation group vs. accuracy group. 
          - Did reputation-motivated participants herd earlier? 
          - Note: in the accuracy group, herding only occurs when it is rational (after the cascade starts) but in the reputation group, it can occur at any time because they want to match the majority regardless of the truth.
     - Fragility:
          - Why did the cascade break? The revelation added new information that contradicted the early signals. The cascade was built on a few signals and was brittle.
     - Limitations of the classroom:
          - Real cascades involve thousands of people and high stakes.
          - In the real world, signals are often not independent and not of known accuracy.
          - We assume rational Bayesian updating, but people may not compute perfectly.

  6. **Failure Modes and Remedies (built into the design)**:
     - If students talk: enforce silence.
     - If misunderstanding: practice round and clear instructions.
     - If cascade doesn't form: have a pre-arranged round (fixed signals) for the fragility demo? But avoid unless necessary. Instead, note in debrief that cascades don't always form by the third decision (only with probability 5/9) and sometimes form later.

  **Timing Breakdown**:
     - 0-5 min: Introduction
     - 5-30 min: Core Game (including urn draw, signal assignment, and guessing)
     - 30-55 min: Variant Phase
     - 55-70 min: Fragility Demonstration (if using a new round, might take 15 min; if using the first round, less)
     - 70-90 min: Debrief

  Note: The actual timing might vary. Be prepared to adjust.

