  ### Decision Tree for Labeling Mass Atrocities  

  **Instructions:** Start with a factual summary of the event. Answer each question based solely on observable evidence (e.g., victim profiles, perpetrator actions, scale, context, patterns). Proceed to the next numbered question until you reach a terminal leaf (bolded label).  

  ---

  #### 1. Are the victims targeted *because* of their membership in a group defined by **national, ethnic, racial, or religious identity**?  
     - **Yes** → Go to 2.  
     - **No** → Go to 6.  

  #### 2. Are the perpetrators’ actions primarily aimed at **expelling the group from a territory**?  
     - **Yes** →  
       - **Label: Ethnic Cleansing**  
       - *Consequence:* Does not trigger Genocide Convention obligations; may be prosecuted as a crime against humanity or war crime if criteria met.  
       - *Awkward Commitment:* Often used as a euphemism to avoid acknowledging genocidal intent, enabling state inaction.  
     - **No** → Go to 3.  

  #### 3. Can **genocidal intent** be inferred from the pattern of conduct?  
     *(Infer from: systematic victim selection (e.g., all ages/genders); destruction of cultural/symbolic sites; leadership statements; conditions designed to ensure group collapse)*  
     - **Yes** → Go to 4.  
     - **No** → Go to 5.  

  #### 4. Does the harm extend beyond killing/bodily harm to include **imposing destructive conditions of life** (e.g., starvation, disease) **or cultural destruction** (e.g., banning language, razing temples)?  
     - **Yes** →  
       - **Label: Genocide (1948 Convention)**  
       - *Consequence:* Triggers duties to prevent/punish under the Convention; states aware of risk must act.  
       - *Awkward Commitment:* Excludes political groups and cultural destruction alone, reflecting Cold War compromises.  
     - **No** →  
       - **Label: Genocide (Lemkin’s Sense)**  
       - *Consequence:* No legal obligation under the Convention; primarily a moral/historical category.  
       - *Awkward Commitment:* Not legally binding, limiting accountability for cultural erasure.  

  #### 5. Are the acts **widespread or systematic**?  
     - **Yes** →  
       - **Label: Crimes Against Humanity**  
       - *Consequence:* Prosecutable internationally; no prevention duty like genocide.  
       - *Awkward Commitment:* Excludes isolated acts, leaving "small-scale" atrocities unlabeled.  
     - **No** →  
       - **Label: Unlabeled**  
       - *Consequence:* No dedicated legal framework; may be addressed as domestic crimes.  
       - *Awkward Commitment:* Lack of label may perpetuate impunity.  

  #### 6. Are the victims targeted *because* of their **current/past political opposition or status** (e.g., party membership, activism)?  
     - **Yes** →  
       - **Label: Politicide**  
       - *Consequence:* No treaty obligations; may overlap with crimes against humanity.  
       - *Awkward Commitment:* Not a legal category, reducing pressure for intervention.  
     - **No** → Go to 7.  

  #### 7. Are the acts **widespread or systematic**?  
     - **Yes** →  
       - **Label: Crimes Against Humanity** (as above)  
     - **No** → Go to 8.  

  #### 8. Is the atrocity **state-sponsored mass killing** lacking group-based or political targeting?  
     - **Yes** →  
       - **Label: Democide**  
       - *Consequence:* No legal mechanism; a scholarly label for state murder.  
       - *Awkward Commitment:* Overlaps with crimes against humanity but lacks legal recognition.  
     - **No** →  
       - **Label: Unlabeled** (as above)  

  ---

  ### Key Notes  
  1. **Inseparable Pair:** **Genocide (1948 Convention)** and **Ethnic Cleansing** cannot always be distinguished from facts alone. Identical conduct (e.g., mass expulsions under deadly conditions) may reflect either intent to expel (ethnic cleansing) or destroy (genocide). Inference relies on contested interpretations of perpetrator statements/policies.  
  2. **Unoccupied Logical Regions:**  
     - **Economic Class-Targeted Violence** (e.g., extermination of landlords/kulaks): Empty because the Genocide Convention excluded economic groups during drafting (political compromise), and no successor label emerged.  
     - **Non-State Systematic Killings** (e.g., warlords targeting non-identity groups): Empty due to incoherence—international law focuses on state/organizational policy, leaving non-state "random" violence without a category.  

  ---

  ### Analytical Addendum  
  **The Lemkin-Convention Gap:** The narrowing of genocide from Lemkin’s cultural-physical concept to the Convention’s biological focus was a political act with clear victims. Soviet and Western powers excluded cultural destruction and political groups to avoid scrutiny (e.g., USSR’s purge of ethnic minorities, U.S. segregation policies). This legacy haunts cases like China’s Uyghur persecution, where cultural erasure lacks a Convention label despite meeting Lemkin’s definition.  

  **"Ethnic Cleansing" as Euphemism:** The term functions as an escape hatch for states reluctant to acknowledge genocide. By emphasizing territorial expulsion over group destruction, it sidesteps the Genocide Convention’s obligation to intervene. This was stark in Bosnia (1992–95), where initial Western refusal to call Srebrenica "genocide" delayed action—exposing how vocabulary can veto accountability.
