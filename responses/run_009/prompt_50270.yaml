prompt: |-
  Is there a name for this? My dad died a couple years ago and I noticed something weird afterwards. It's not that I miss him — I do, but that's not it. It's that there's a version of him in my head that keeps working. When I was weighing whether to take a job across the country, I caught myself running the argument past him, and internal-him came back with an objection I hadn't thought of, and it was a good one, and the real him never actually made it because the real him never heard about the job. Sometimes model-dad is better at being him than he was, or at least more consistent. And it's not just him. I have a living friend whose taste I trust more than my own, and when I'm stuck between two options I literally ask "what would Maya say," and that settles it, even against my own first reaction. So the phenomenon, as best I can describe it: I've incorporated other peoples' judgment into my own deliberation as a standing voice with real authority, and the voice keeps operating after the person can't — the model stops updating but it doesn't shut off.

  The closest thing I've read is Hofstadter in I Am a Strange Loop, where he suggests his wife's "I" was partially copied into his brain and keeps running there after she died. But he seems to mean something more like her pattern persisting in him, and he's honestly kind of fuzzy on whether the copy is really her or just his impression of her. That fuzziness is part of my question. When internal-dad objects to something, and real dad would have objected too but for dumber reasons, whose objection am I actually hearing? And when I "ask Maya," am I really consulting her, or just laundering some preference of my own that I'd feel silly owning directly?

  To be clear what I'm NOT asking about: it's not grief exactly — the grief people talk about keeping a bond with the dead, rituals, talking at the grave, and that's not this, there's no relationship-maintenance in it for me, model-dad is more like a tool. And it's not the freudian super-ego thing, which I gather is about parental authority getting installed in you, because dad's voice doesn't mainly show up on moral stuff, it shows up on practical judgment, and the Maya case isn't authority at all — it's just that her model outperforms mine. So: is there an established concept, in philosophy or psychology, for outsourcing parts of your own judgment to simulated other people, alive or dead? If the field doesn't have a single term, what would you call it, and where would you draw the edges — like, does it still count when the model is of someone I never met (a dead writer whose taste I've internalized from their books), or when I know the model's advice is bad but I follow it anyway out of loyalty to the original? I'd rather have a real carving of the thing than just a label, so if you give me a term, tell me what it includes and, more importantly, what it leaves out.
reasoning: |-
  Okay, the user is describing a fascinating psychological phenomenon: incorporating others' judgment into their own decision-making as internal voices that continue to operate even after the person's death. They mention Hofstadter's "I Am a Strange Loop" but feel it's fuzzy, especially regarding whether the internal voice is truly the other person or just their impression. They want to know if there's an established term for this and how to delineate its boundaries.

  First, I need to recall relevant concepts from psychology and philosophy. The Freudian superego is mentioned but dismissed because it's more about moral authority, while the user's examples involve practical judgment. Internalization is a broad term, but maybe cognitive internalization or internal working models? 

  Hofstadter's strange loops deal with patterns persisting in the mind. The user questions if their "model-dad" is an accurate representation or a constructed tool. The Maya example shows using a living person's taste as a decision-making aid. So, it's about outsourcing judgment to internalized models.

  Possible terms:
  - **Cognitive Internalization**: General, but fits incorporating others' cognitive frameworks.
  - **Internal Working Models (Attachment Theory)**: Mental templates from relationships. The dad model persists even after death, which fits. But attachment theory usually focuses on early caregivers. Does it apply to friends like Maya?
  - **Mental Simulation**: Running scenarios using internal models. The user's deliberation process matches this.
  - **Introjection (Psychodynamic)**: Unconsciously incorporating traits. However, the user seems conscious of using these models.
  - **Distributed Cognition**: Extending cognition beyond the individual. But the models are internal, not external tools.
  - **Posthumous Co-Consciousness (Hoffman)**: A niche term for maintaining internal bonds with the deceased. Might be close but emphasizes relationship over utility.

  The user emphasizes the functional aspect—model-dad as a tool, not for grief. So terms like "posthumous co-consciousness" might lean too much into the relational aspect. "Cognitive prosthesis" could work, highlighting utility. 

  Boundaries they want defined: 
  - Internalizing someone never met (e.g., a writer). If the model is based on their work, it's still a constructed representation. 
  - Following the model out of loyalty despite knowing it's suboptimal. This adds a non-rational element, bordering on ritualistic devotion, which might separate it from pure utility.

  The core elements seem to be: conscious, functional use of internalized models for judgment, regardless of the person's presence. A term like "cognitive prosthesis" captures the tool-like nature. Alternatively, "internalized decision heuristics" or "cognitive delegation." 

  Philosophically, the question of whose voice is heard touches on representation versus reality. The model is an approximation, shaped by the user's experiences and biases. It's a simulacrum that evolves independently after the person's death. So in the case where model-dad objects differently, it's the user's own construct, informed by past interactions but now a separate entity. 

  In conclusion, no single term exists, but combining "cognitive prostheses" with "internal working models" might cover it. Highlighting the functional aspect and the persistence of the models after death, while acknowledging the constructed nature. The user's need is for conceptual clarity and validation that this phenomenon is recognized, even without a perfect label.
answer: |-
  What you're describing is a profound and nuanced phenomenon that straddles psychology, philosophy, and cognitive science. While no single, universally accepted term captures every facet, **Cognitive Prosthesis** (or **Mental Prosthesis**) comes closest as a core concept. Let's carve it out properly:

  ### Core Concept: Cognitive Prosthesis
  - **Definition**: The deliberate, functional use of an internalized mental model of another person (living or dead) as a tool to augment or replace aspects of your own judgment or decision-making.  
  - **Key Features**:  
    1. **Functional, Not Relational**: It’s a tool for cognition, not an attempt to sustain a relationship (as in grief rituals).  
    2. **Authority via Internalization**: The model has "real authority" because you’ve consciously or unconsciously delegated trust to its judgment.  
    3. **Persistent Operation**: The model runs autonomously, even when the source is unavailable (death, distance) or its "data" is outdated.  
    4. **Hybrid Output**: Advice blends your understanding of the person with your own cognition—it’s not a pure copy.  

  ### Why Other Terms Fall Short
  - **Internal Working Models (Attachment Theory)**: Close, but these focus on *relational templates* (e.g., expectations of care), not practical judgment outsourcing.  
  - **Introjection (Psychodynamics)**: Involves unconsciously absorbing traits, but your use is *conscious* and *tool-like*.  
  - **Distributed Cognition**: Typically involves *external* tools/people, not internalized voices.  
  - **Hofstadter’s "Strange Loop"**: Captures persistence but is metaphysically vague (is it "them" or your model?). Your framing is pragmatic: utility over ontology.  

  ### Boundaries & Edge Cases  
  | **Scenario** | **Does It Count?** | **Why?** |  
  |--------------|-------------------|----------|  
  | Internalizing a dead writer you never met | **Yes** | The model is built from their work/ideas, functioning as a prosthesis for taste/judgment. |  
  | Following the model out of loyalty despite knowing it’s suboptimal | **Yes, but distinct** | This adds a *ritualistic* or *devotional* layer—less "tool" and more "homage." Still prosthesis-like, but motivation shifts. |  
  | Superego (e.g., dad’s voice on morality) | **No** | Your case is *domain-specific* (practical judgment), not generalized authority. |  
  | Hallucinating a voice you believe is literally the dead person | **No** | That’s grief-related phenomena or clinical dissociation, not tool-like delegation. |  

  ### Whose Voice Are You Hearing? The Philosophy  
  - **It’s your construct, informed by them**. When model-dad objects "for dumber reasons" than real dad would, it’s *your brain’s simulation*—shaped by memory, bias, and current context. Maya’s "advice" is your prediction of her judgment, filtered through your priorities.  
  - **Why it feels like "them"**: The brain constructs models of others’ minds (theory of mind) to navigate social worlds. When you internalize these, they retain the "flavor" of the source but evolve independently.  

  ### What to Call It  
  1. **Cognitive Prosthesis** (Best fit): Emphasizes functionality.  
  2. **Delegated Judgment Framework** (More precise but clunky).  
  3. **Persistent Internal Model** (Descriptive but broad).  

  ### Why This Phenomenon Matters  
  It reveals cognition as inherently social—we "offload" thinking onto internalized others to:  
  - Compensate for cognitive limits (e.g., trusting Maya’s taste over yours).  
  - Preserve wisdom beyond a person’s physical presence.  
  - Create collaborative decision-making within one mind.  

  **In short**: You’ve developed a *toolkit of internal consultants*. It’s a testament to how deeply we internalize others, not just emotionally, but as functional cognitive architecture. The term might not be standardized, but the phenomenon is real, rational, and profoundly human. If you explore further, look into **philosophy of mind** (Dennett’s "intentional stance"), **cognitive psychology** (mental simulation), and **social robotics** (how AIs mimic this process).
