prompt: |-
  ok, here's something I keep tripping over. In the US it's a federal crime to pay anyone for a kidney, but people get paid all the time to donate blood plasma, and egg donors are routinely offered five figures. And its not the risk, since we let people give up a kidney for free — same surgery, same recovery — so the legal line isn't tracking medical risk. So what view of the body, or of what markets do to things, does that line actually presuppose? Is the implicit theory something like "compensation is fine for what grows back, forbidden for what doesn't"? Because if so the practice undercuts itself — eggs don't grow back either, and we pay for those. Or is it more like a thought about what selling would do to the meaning of the act, in which case why is the paid version fine for plasma and (for many people) not even imaginable for kidneys? I'd like you to reconstruct what the practice is committed to, say which parts of it are just underdetermined rather than coherent, and tell me which rival theories of commodification would license the exact same legal line — so I can tell whether the line really encodes a principle or is just history.
