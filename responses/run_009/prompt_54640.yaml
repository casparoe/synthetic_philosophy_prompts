prompt: |-
  I teach a second-year module on decision theory, and every year the two-envelope paradox eats an entire tutorial: two envelopes, one containing twice as much as the other, you pick one at random, and a plausible-looking computation — the other envelope is equally likely to hold double or half of your amount, so its expected value is one-and-a-quarter times yours, so switch, except the same argument applies after switching, ad infinitum. My students arrive with the standard responses half-digested (the complaint that the same symbol is made to do duty for two different random variables, or that the computation quietly assumes the other envelope is equally likely to be double or half no matter what yours contains), and I want to force them to evaluate responses against a standard rather than merely collect them. So before we touch the literature, I want to give them a specification: write the desiderata that any adequate resolution of the paradox must meet, with the case or consideration behind each requirement, and mark which are non-negotiable and which are preferences of one camp. At a minimum the list should address where exactly the 5/4 argument goes wrong (a resolution that denies the conclusion without locating the fallacious step has not earned its keep), what changes when the envelope is opened versus left sealed, and what the resolution is for — advice to an agent at the moment of decision, a theorem in expected-utility theory, or a psychopathology of bad reasoning — since adequacy is relative to that.

  Two hard cases the specification must handle, and they pull in opposite directions. First, a distribution where sticking is always right: suppose the smaller amount is £1 with probability 2/3, £2 with probability 2/9, £4 with probability 2/27, and so on (the pair (£2^n, £2^(n+1)) with probability 2/3 × (1/3)^n). A short calculation shows that conditional on seeing any particular amount in your envelope, the other envelope has expected value seven-eighths of it — so you should keep yours whatever you see — even though the envelopes were prepared symmetrically and, before opening, neither can be preferred. Second, the mirror image: if instead the smaller amount is £2^n with 'probability' proportional to 1 for each n — a uniform distribution over the powers of two, which cannot be normalised — then conditional on any observed amount, the other envelope is genuinely equally likely to be double or half, and switching is favourable for every value you might see. Your desiderata should say what a resolution owes us in each case: whether the first is a real counterexample or a trick of infinite expectations, whether the second shows the 5/4 reasoning was secretly coherent all along under an improper prior, and whether any set of desiderata that handles both can also demand a single unified diagnosis of the original sealed-envelope argument.

  Finally, flag any pair of requirements you suspect cannot be jointly satisfied — I have a suspicion that 'locates a definite fallacy in the 5/4 computation' and 'correctly endorses switching in the improper-prior case' are in tension, and I would like the list to be honest about that if so — and identify which single requirement does the most to eliminate the standard resolutions. Then, briefly, score the familiar fixes against your list, keeping the weight on the criteria rather than the scorecard.
reasoning: |-
  Okay, the user is teaching a second-year module on decision theory and is frustrated that the two-envelope paradox consumes an entire tutorial every year. They want to move beyond standard responses and force students to evaluate resolutions against a clear set of desiderata. The core challenge is designing a specification that covers: where the 5/4 argument fails, differences between opened/sealed envelopes, and the resolution's purpose (advice vs. theorem vs. psychology). 

  The user provides two hard cases that pull in opposite directions: one distribution where sticking is always optimal (convergent series), and another with an improper prior where switching is always favorable. The desiderata must handle both extremes while possibly revealing tensions—like whether locating the fallacy conflicts with endorsing the improper-prior case. 

  First, I need to map non-negotiables. The resolution must pinpoint the exact fallacy (e.g., treating the observed amount as fixed while ignoring its random generation). It must also distinguish sealed vs. opened contexts—since symmetry breaks upon observation—and clarify the resolution’s goal (probably decision advice). 

  For the hard cases: the convergent distribution isn’t a trick; it correctly shows finite expectations matter. The improper prior case validates the 5/4 math under specific (though pathological) conditions. A unified diagnosis must reconcile this by stressing that the fallacy isn’t in the algebra but in assuming a prior exists where all values are equally likely half/double. 

  The tension is real: if you insist the 5/4 argument is *always* fallacious (due to conflating variables), you can’t endorse the improper prior where it holds. So desiderata must flag this as a trade-off—perhaps by separating "locates fallacy in typical setups" from "explains edge cases." 

  The most eliminative requirement? Demanding a single fallacy diagnosis. Many resolutions (e.g., "two random variables" complaint) fail the improper prior case. This exposes shallow fixes. 

  Scoring standard fixes: 
  - "Two RVs" response: Fails improper prior (where it works) and doesn’t address distributions. 
  - "Prior assumption" response: Better but vague; must specify how the prior interacts with observables. 
  - Bayesian approaches: Strong on cases but may overcomplicate for students. 

  User’s hidden need: They want students to see that paradox resolutions aren’t just "gotchas" but involve weighing what a solution must achieve—and that some criteria conflict. The specification should force meta-reflection.
answer: |-
  Below is a specification of desiderata for resolving the two-envelope paradox, designed to force critical evaluation of solutions. The requirements are categorized by **non-negotiable** (essential for adequacy) and **preferences** (vary by philosophical/camp emphasis). Hard cases and tensions are explicitly flagged.

  ---

  ### **Desiderata for an Adequate Resolution**  
  *(Non-negotiables marked **NN**; preferences marked **P**)*  

  1. **Pinpoint the Fallacy in the 5/4 Argument (NN)**  
     - **Requirement**: Identify the exact flawed step in the reasoning "the other envelope is equally likely to contain half or double my amount, so its expectation is (1/2)(0.5x) + (1/2)(2x) = 1.25x."  
     - **Justification**: A resolution must do more than deny the conclusion; it must diagnose *why* the logic fails in standard finite cases.  
     - **Case**: In the original paradox (sealed envelopes, no distribution specified), the argument must be shown invalid.  

  2. **Distinguish Sealed vs. Opened Envelope Contexts (NN)**  
     - **Requirement**: Explain why symmetry precludes switching *before* opening, yet conditional expectations may rationally demand switching/keeping *after* opening.  
     - **Justification**: Resolutions often conflate these states. The paradox hinges on this transition.  
     - **Case**: In the convergent distribution (smaller amount = £2ⁿ w.p. (2/3)(1/3)ⁿ), symmetry implies indifference pre-opening, but post-opening sticking is optimal.  

  3. **Clarify the Resolution's Purpose (NN)**  
     - **Requirement**: State whether the resolution provides:  
       - (a) *Decision advice* for an agent (given specific knowledge),  
       - (b) A *theorem* in probability/decision theory (e.g., when E[x] is finite),  
       - (c) A *psychological critique* of intuitive reasoning.  
     - **Justification**: Adequacy depends on scope. A mathematical solution may not address agent-oriented intuitions.  

  4. **Handle the Convergent Distribution Case (NN)**  
     - **Requirement**: Affirm that sticking is uniquely optimal here *despite* initial symmetry. Reject claims that infinite expectation invalidates the example.  
     - **Justification**: Expectations are finite here (E[smaller amount] = £3), so it is a valid counterexample to universal switching.  

  5. **Handle the Improper Prior Case (NN)**  
     - **Requirement**: Acknowledge that under an improper uniform prior over {2ⁿ}, switching *is* favorable for every observed value, and the 5/4 calculation is algebraically correct.  
     - **Justification**: Shows the 5/4 reasoning is coherent *if* an improper prior is accepted. Forces distinction between mathematical coherence and epistemic defensibility.  

  6. **Unified Diagnosis (P)**  
     - **Preference**: Some camps prioritize a single, unified error for the base paradox (e.g., "treating the observed amount as fixed while ignoring its random generation"). Others accept case-specific diagnoses.  
     - **Tension**: Unification is elegant but may obscure nuances between finite/proper vs. infinite/improper cases.  

  7. **Explicit Prior Assumption Critique (P)**  
     - **Preference**: Some insist the resolution must highlight that the 5/4 argument assumes an *impossible prior* (where all amounts are equally likely to be half/double). Others emphasize the ill-defined sample space.  

  ---

  ### **Tensions Between Desiderata**  
  - **Major Tension**:  
    - **Desideratum 1 (locate fallacy)** vs. **Desideratum 5 (endorse 5/4 in improper case)**.  
      - If the 5/4 argument is deemed *always fallacious* (e.g., due to conflating variables), it cannot be valid in the improper case.  
      - **Resolution**: The fallacy is **context-dependent**. In proper priors, it ignores the prior's dependence on the observation; in improper priors, the algebra holds but the prior is inadmissible for decision theory.  

  ---

  ### **Most Eliminative Requirement**  
  **Desideratum 4 (convergent distribution case)**.  
  - **Why**: It eliminates resolutions that:  
    - Claim switching is *always* irrational (it isn’t in the improper case).  
    - Argue symmetry *forces* indifference post-opening (conditionally, sticking dominates).  
    - Dismiss the paradox via "finite expectations only" (expectations are finite here).  

  ---

  ### **Scoring Standard Resolutions Against Desiderata**  
  *(✓ = satisfies; ✗ = fails; ~ = partial)*  

  1. **"Two Random Variables" Complaint** (Symbol confusion)  
     - **NN1 (Pinpoint fallacy)**: ✓ (Identifies conflation of "my amount" as fixed vs. random).  
     - **NN4 (Convergent case)**: ✗ (Doesn’t explain why sticking dominates conditionally).  
     - **NN5 (Improper prior)**: ✗ (Fails to explain why 5/4 works here).  
     - **Verdict**: Inadequate; misses distribution-dependence.  

  2. **"Prior Assumption Invalid" Response**  
     - **NN1**: ~ (Locates assumption but often vague on *why* it fails).  
     - **NN4**: ✓ (Can incorporate the convergent prior).  
     - **NN5**: ✓ (Can frame improper prior as edge case).  
     - **Verdict**: Adequate if it quantifies how the prior shapes conditionals (e.g., P(halving|observation)).  

  3. **Bayesian Expected Utility w/ Proper Prior**  
     - **NN2 (Sealed vs. opened)**: ✓ (Explicitly models conditioning).  
     - **NN4**: ✓ (Shows E[other|X=x] < x for convergent prior).  
     - **NN5**: ✓ (Recognizes improper prior as a limit case).  
     - **NN1**: ~ (May not explicitly dissect the 5/4 step).  
     - **Verdict**: Strong, but may be overly technical for some desiderata.  

  4. **"No Grounds for Indifference" Argument**  
     - **NN1**: ✗ (Asserts no reason to switch but doesn’t diagnose 5/4).  
     - **NN5**: ✗ (Cannot explain switching in the improper case).  
     - **Verdict**: Inadequate; too vague.  

  ---

  ### **Conclusion for Teaching**  
  The specification forces students to see that:  
  - A viable resolution must be **distribution-aware** (NN4, NN5).  
  - The 5/4 argument’s flaw is **not algebraic** but **probabilistic** (misapplying conditioning).  
  - Tensions arise because **improper priors are decision-theoretically pathological** but mathematically coherent.  
  - The strongest resolutions (e.g., Bayesian) satisfy all NN by showing the paradox arises from **unstated prior assumptions**, and adequacy depends on the agent’s knowledge (**Desideratum 3**).  

  This framework shifts focus from "collecting fixes" to evaluating whether a resolution meets the paradox’s core challenges. The hard cases reveal that no solution is complete without addressing how **observations update beliefs** under a defined prior.
