prompt: |-
  I run a weekend discussion group for strong high-school students who have some programming experience but no cognitive science. Next session is on Bongard problems — the invented grids of simple line drawings where six boxes on the left share some property that the six on the right lack, and the task is to name the property. Plan the session for me rather than explaining the puzzles yourself. In particular: what has to be established first so students don't mistake the task for ordinary visual puzzle-solving, and what role the students' own solving attempts should play in the arc; which single problem should carry the whole session — I want to design one where the most obvious rule is wrong, so that the point about there being multiple levels of description competing to explain the same data can emerge from their own frustration; the misconceptions I should expect (I anticipate something like "a good AI just needs better image recognition," and also "any correct-sounding rule is as good as any other"), where each will surface in the sequence, and how to head them off without simply telling students they're wrong; how to get across why a handful of positive and negative examples suffices for humans while the same problem swamps statistical learners, and how far I can go with analogy and conceptual slippage without teaching Hofstadter's actual Copycat architecture; and a closing check that would show whether they've absorbed the real lesson — that the ability to induce a concept from sparse examples is the phenomenon to be explained, not a given. Please also tell me what I should openly decline to cover at this level, and how to say so in a way that doesn't feel like a dodge.
reasoning: |-
  We are designing a session on Bongard problems for high-school students with programming experience but no cognitive science background. The goal is to highlight the challenge of concept induction from few examples and the existence of multiple levels of description.

  ### Key Objectives:
  1. **Establish that this is not ordinary visual puzzle-solving**: The task is about finding a conceptual rule that distinguishes the two sets, which might involve abstract properties beyond the visual.
  2. **Use a single problem that has an obvious but wrong rule**: To illustrate that multiple rules can fit the data but some are more "natural" or intended.
  3. **Address misconceptions**:
     - "Better image recognition is all that's needed": Emphasize that the challenge is not in recognizing the objects but in abstracting the right concept.
     - "Any correct-sounding rule is as good as any other": Show that the context and the way humans perceive and categorize matter.
  4. **Sparse examples vs. statistical learners**: Contrast human ability to induce from few examples with the need for big data in machine learning.
  5. **Closing check**: Ensure students understand that the core phenomenon is the human ability to induce concepts from sparse data.

  ### Session Plan

  #### 1. Introduction (10 minutes)
  - **What are Bongard problems?** 
    - Show a very simple example (not the main one) to explain the format: 6 boxes on the left with a common property, 6 on the right without.
    - Example: Left has circles, right has squares. Rule: "shape is circle". 
    - Then show a slightly harder one: Left has large shapes, right has small. Rule: "size is large".
  - **Clarify the task**:
    - "We are not just looking for any property that distinguishes them. We are looking for a rule that is simple and natural enough that it would be the intended one by the designer of the problem. In real cognition, we are trying to understand how humans can often pick up concepts from very few examples, and why that is hard for machines."
    - Emphasize: "The challenge is not in recognizing what's in the box (that's easy for a computer) but in figuring out the abstract property that unites the left and distinguishes from the right, especially when there are multiple possibilities."

  #### 2. The Main Problem (40 minutes)
  - **Present the chosen problem**: Pick one where the obvious rule is wrong. Here is an example design:

    **Problem Design**:
    - Left side: 
      - Box 1: A single circle.
      - Box 2: Two circles side by side.
      - Box 3: Three circles in a row.
      - Box 4: A circle and a square (circle on the left).
      - Box 5: A circle above a triangle.
      - Box 6: A circle and a star (circle on top).
    - Right side:
      - Box 1: A single square.
      - Box 2: Two squares side by side.
      - Box 3: A square and a circle (square on the left).
      - Box 4: A square above a triangle.
      - Box 5: A square and a star (square on top).
      - Box 6: Three squares in a row.

    **Intended Rule**: The left boxes have at least one circle, and the right boxes have no circle? But wait, that doesn't hold because the right boxes have no circle? Actually, let me correct: in the above design, the left always has a circle and the right does not. But that would be too straightforward. We want a problem where the obvious rule is wrong.

    **Revised Design for Misleading Obvious Rule**:

    Let's design a problem where the obvious rule (like "presence of a circle") is incorrect because of one counterexample. We can have:

    - Left side (supposed to be "connected shapes" but with an exception?):
      Instead, let's use a rule that is about the arrangement but with a red herring.

    **Problem**: 
    - Rule: The left side has exactly one shape that is a circle (and possibly other non-circle shapes), while the right side has either no circle or more than one circle.

    Example:
    - Left:
      1. One circle.
      2. A circle and a square (so one circle).
      3. A circle and two squares (one circle).
      4. A circle and a triangle (one circle).
      5. A circle, a square, and a triangle (one circle).
      6. A circle and a star (one circle).
    - Right:
      1. No shapes? (But that might be confusing) OR
      Instead, let's have:
      1. Two circles.
      2. Three circles.
      3. A square (no circle).
      4. A square and a triangle (no circle).
      5. A circle and two stars (wait, that's one circle) -> so that would be left? Let's fix.

    We need to ensure the rule holds. How about:

    Rule: The left side has exactly one circle. The right side has either zero or two or more circles.

    Then:
    - Left: 
      - 1 circle
      - 1 circle and 1 square
      - 1 circle and 2 squares
      - 1 circle and 1 triangle
      - 1 circle, 1 square, 1 triangle
      - 1 circle and 1 star
    - Right:
      - 0 circles (e.g., just a square)
      - 2 circles
      - 3 circles
      - 0 circles (e.g., two squares)
      - 2 circles and a square
      - 0 circles (e.g., a triangle and a star)

    But note: the obvious visual feature is the circle, so the rule is about the circle count. However, we want the most obvious rule to be wrong? 

    **Alternative idea**: 
    Use a problem where the obvious rule is about the type of shape (e.g., circles vs. non-circles) but then have one box that breaks that. But that would be an incorrect rule.

    Instead, let's use a problem that seems to be about circles but is actually about something else, and the circles are a distraction. Example:

    **Problem with misleading obvious rule**:

    Rule: All left boxes contain a shape that is not a polygon (i.e., a circle) and also contain at least one polygon? That might be too complex.

    **Better**: 
    Rule: The left boxes have a circle that is to the left of every other shape. The right boxes do not have a circle that is to the left of every other shape (either no circle, or the circle isn't leftmost, or there is a circle but it's not to the left of every other?).

    Let's design:

    - Left: 
      1. Circle on the left, square on the right.
      2. Circle on the left, two squares on the right.
      3. Circle on the left, triangle below.
      4. Circle on the left, star above and square below (but circle is still leftmost?).
      5. Circle on the left and a square on the right, with a triangle below the circle (so circle is leftmost and above the triangle? but we care about leftness, not above).
      6. Circle on the left and a star on the right.
    - Right:
      1. Square on the left, circle on the right.
      2. Two circles (so the left circle is left of the other, but what about non-circle? They are both circles -> so it fails because the rule is about being left of every other shape? In this case, the left circle is left of the other circle, so it should be left? So we must avoid that.

    Instead, rule: The circle is the leftmost shape and there is at least one non-circle shape.

    Then:
    - Left: 
      - Circle left, square right -> yes.
      - Circle left, triangle below -> yes (if we consider the triangle to the right? or below? We need to define a coordinate. Let's assume we are only concerned with the x-axis: leftmost in horizontal position).
      - Circle left, star above (and to the right of circle) -> then circle is leftmost? But the star is above and to the right? Then circle is leftmost? Yes.
      - But if we have two circles? Then the left circle is leftmost, but there is no non-circle? So we require at least one non-circle? Then:

    Rule: There is exactly one circle and it is the leftmost shape, and there is at least one other non-circle shape.

    Then:
    - Left: 
      1. Circle (leftmost) and square (right) -> yes.
      2. Circle (leftmost) and triangle (right) -> yes.
      3. Circle (leftmost) and star (right) -> yes.
      4. Circle (leftmost), square (middle), triangle (right) -> yes.
      5. Circle (leftmost) and two squares -> yes.
      6. Circle (leftmost) and square and triangle -> yes.
    - Right:
      1. Square and circle (circle not leftmost) -> right.
      2. Two circles (then there is a circle that is leftmost, but we have two circles -> so the rule fails because we require exactly one circle? Actually, the rule says "exactly one circle" and that circle is leftmost and there's at least one non-circle. In two circles, we have two circles -> fails the "exactly one circle". 
      3. Only a circle -> fails because there must be at least one non-circle.
      4. Circle and square, but the square is to the left of the circle -> then circle is not leftmost -> right.
      5. Two squares -> no circle -> right.
      6. Circle and two squares, but the circle is in the middle -> right.

    Now, the obvious rule that might come to mind is "circle is present" or "circle is on the left", but note:
    - In the right side, we have a box with a circle that is not leftmost (so rule "circle is present" would put that in the left, but it's in the right). 
    - Also, the rule "circle is leftmost" would be broken by the right boxes that have a circle but not leftmost, but what about the box with two circles? Then the leftmost is a circle, so it would be considered left? But our rule also requires exactly one circle. So the rule is more specific.

    However, we want the most obvious rule to be wrong. So when we present, we don't tell the rule. We let the students try.

    **How the session proceeds**:
    - Present the problem without any hint of the rule.
    - Let the students work in pairs for 10 minutes to come up with rules.
    - Then, collect rules. Expect:
        - Obvious wrong rule 1: "Left has a circle, right does not." -> but right has boxes with circles (but not leftmost) and also two circles? So it's not that simple.
        - Obvious wrong rule 2: "Circle is on the left." -> but in the left boxes, the circle is always leftmost? And in the right, sometimes there is a circle that is not leftmost? But also, in the right, there might be a box with two circles: then the circle is on the left? So that box would be misclassified by this rule? (It would be put in left, but it's in right). So the rule fails.

    We expect frustration as they see their rules broken by one or two boxes.

    Then, guide them to the correct rule (or a rule that fits). The rule we designed is: 
        "There is exactly one circle, and it is the leftmost object, and there is at least one other non-circle object."

    But note: this is complex. We want to show that the rule is not just about the presence of a circle but about the arrangement and count. And that it took them time to find it.

    **Key point**: Multiple rules might fit, but we are looking for one that fits all. However, the designer had one in mind. How do we know? We try to find the simplest and most natural? But what is natural? This leads to the idea that humans have biases in concept formation.

  #### 3. Addressing Misconceptions (15 minutes)
  - **Misconception 1: "Better image recognition is all that's needed."**
    - When it surfaces: When students are struggling to find the rule, they might say, "If the computer could just see the circles and their positions, then it could easily count and check positions."
    - How to head off: 
        - "But note: the computer can already recognize the circles and positions. The challenge is: what rule should it check? It could check many rules: count of circles, positions, sizes, etc. But which one is the intended rule? How does the computer know to look for the rule about having exactly one circle that is leftmost? There are infinitely many possible rules. The problem is the search space of rules, not the image recognition."
        - "In fact, if we gave the same six positive and six negative examples to a machine learning algorithm that uses raw pixels, it would have a hard time because it would see each box as a high-dimensional vector and might overfit without finding the abstract rule."

  - **Misconception 2: "Any correct-sounding rule is as good as any other."**
    - When it surfaces: When students come up with a rule that fits the data but seems contrived. For example, "The left boxes have a circle and the first letter of the other shapes in alphabetical order is after 'c'." (which might fit if the other shapes are square, star, triangle, etc., but not if we had a circle and an arrow?).
    - How to head off: 
        - "That rule fits the examples we have, but is it the rule the designer intended? How would it generalize to a new box? For example, what if we have a circle and a cross? The rule about the first letter might break. Also, does it feel natural? We tend to prefer rules that are simpler and based on spatial relations or counts, not alphabetical order of shape names. This is because of our cognitive biases and the context of the problem (visual)."

  #### 4. Sparse Examples vs. Statistical Learners (10 minutes)
  - **Point**: Humans can induce the rule from 12 examples (6 positive, 6 negative) but a typical machine learning algorithm might need hundreds.
  - **Why?**:
    - Humans use prior knowledge and biases to focus on certain features (like shape, count, position) and ignore others (like the exact pixel values, or alphabetical order). We also use analogies and abstract representations.
    - Machine learning without such biases would consider a vast space of rules and would require more data to avoid overfitting.
  - **Without going into Copycat**:
    - Use an analogy: "Imagine you are trying to teach a child the concept of a 'circle'. You show them one circle and say 'this is a circle'. Then you show them a square and say 'this is not a circle'. Then they see a triangle and say 'not a circle'. Then they see a circle again and recognize it. They have learned from very few examples. But if you were to train a neural network from scratch on the same data, it might not learn reliably. Why? Because the child brings to the table prior knowledge about shapes, continuity, etc."
  - **Contrast**: 
    - "In our Bongard problem, we are using 12 examples. A machine learning system that uses raw pixels would see each box as a matrix of pixels and would try to find patterns in the pixels. But the rule is abstract and symbolic. It operates on the level of objects and their relations, not pixels. This is why a symbolic AI might do better, but even then, how does it choose which symbolic features to extract? And which rules to form?"

  #### 5. Closing Check (5 minutes)
  - **Check for understanding**: 
    - Ask: "What do you think is the main challenge in Bongard problems for AI? Is it the image recognition part, or something else?"
    - Expected answer: The challenge is the induction of the abstract rule from few examples and the selection of the right level of description among many possibilities.
    - Then, ask: "Why is it that humans can do this with only 12 examples but machines typically need more?" 
    - Listen for: Humans use prior knowledge, abstract representations, and focus on relevant features.
  - **The real lesson**: "The ability to induce a concept from sparse examples is the phenomenon to be explained, not a given. It's a key aspect of human cognition that we take for granted but is incredibly complex."

  #### 6. What to Decline to Cover
  - **Hofstadter's Copycat and Fluid Concepts**: 
    - How to say: "We are focusing today on the challenge of concept induction and why it's hard for AI. There are specific models, like Hofstadter's Copycat, that try to model this kind of fluid concept formation and analogy-making. But that's a more advanced topic that we won't have time for today. If you're interested, I can point you to some readings."
  - **Deep technical details of machine learning**:
    - How to say: "We are contrasting human learning with machine learning in a broad sense. We won't dive into the details of neural networks or statistical learning theory today because we want to focus on the cognitive challenge."

  ### Session Timing (Total: 80 minutes)
  - Introduction: 10 min
  - Main Problem (work and discussion): 40 min
  - Addressing Misconceptions: 15 min
  - Sparse Examples vs. Statistical Learners: 10 min
  - Closing Check: 5 min

  ### Materials
  - Prepare the Bongard problem as a slide or handout with the 12 boxes clearly drawn.
  - Whiteboard or digital equivalent for writing down student rules.

  This plan should achieve the goals while engaging the students in the discovery of the challenges.
answer: |-
  Here's a structured session plan focused on your objectives, leveraging student discovery to reveal core concepts. The arc prioritizes experiential learning and guided Socratic discussion.

  ---

  ### **Session Structure (90 mins total)**
  #### **1. Framing the Challenge (15 mins)**
  - **Hook:** Open with an ultra-simple Bongard problem (e.g., left: all triangles; right: all squares).  
  - **Crucial Setup Questions:**  
    - *"What’s the rule? How sure are you? Could there be other rules?"*  
    - *"If I showed this to an AI, what would it need beyond recognizing shapes?"*  
  - **Key Point to Establish:**  
    - Clarify: *"This isn’t about seeing shapes—it’s about finding abstract *relationships* or *categories* that explain why certain examples belong together. The puzzle is a test of *concept induction*: how minds create rules from minimal data."*  
    - Contrast with programming: *"Unlike writing code where rules are explicit, here you *infer* rules from patterns—like a scientist with incomplete data."*  

  #### **2. Deep Dive: The "Obvious Rule Is Wrong" Problem (35 mins)**  
  - **Selected Problem Design:**  
    - **Left:** Boxes with a single circle + one other shape (circle always on the left).  
    - **Right:** Boxes with multiple circles OR a circle not on the left.  
    - **Example Distractor:** Include one left-box circle *slightly misaligned* (tempting a "circle on left" rule that fails).  
    - **Why this works:** The obvious rule (*"circle on left"*) seems valid until students notice the misaligned circle violates strict leftness, forcing them toward *"exactly one circle"* or *"circle is leftmost"*.  

  | **Activity**                     | **Purpose**                                                                 |
  |----------------------------------|-----------------------------------------------------------------------------|
  | **Individual Attempt (5 mins):** Students privately guess the rule.         | Surface initial intuitions (likely visual heuristics).                     |
  | **Small Groups (10 mins):** Refine rules + list alternatives.               | Expose rule conflicts; highlight premature convergence.                    |
  | **Group Share (20 mins):** Debate rules. *Ask:* "What made you abandon your first guess? What else *could* fit all examples?" | Reveal frustration with multiple valid rules; scaffold meta-awareness. |

  #### **3. Surfacing & Countering Misconceptions (20 mins)**  
  Address misconceptions **as they arise** in the group share:  
  - **Misconception 1: *"Better image recognition solves this."***  
    - **When it surfaces:** During initial problem attempts.  
    - **Response:** *"Imagine we gave an AI perfect shape/position detection. What would it *do* with that data? How would it choose *which* pattern to look for? [Pause] Recognition gives facts; *concepts* turn facts into rules—that’s the hard part."*  

  - **Misconception 2: *"Any rule that fits is equally valid."***  
    - **When it surfaces:** During debate over competing rules.  
    - **Response:** *"Let’s test your rule: if I add a new box [e.g., two circles with one leftmost], would your rule *feel* right? Why might humans prefer simple rules like 'one circle' over 'circles on Mondays'?"* → Guide to discuss *cognitive naturalness* (simplicity, relevance, prior knowledge).  

  #### **4. Sparse Data vs. Statistical AI (15 mins)**  
  - **Analogy:** *"You solved this with 12 boxes. Imagine training an AI the same way."*  
    - **Step 1:** Ask students for pseudocode to "solve" Bongard with code.  
    - **Step 2:** Reveal the catch: *"What if the rule was 'shapes remind Olga of her cat'? How would your code handle that?"* → Highlight **open-ended interpretation**.  
    - **Step 3:** Contrast: *"Statistical AI needs 100s of examples because it *lacks* human biases. It sees pixels, not 'circles' or 'leftness'—it must brute-force test every feature (color, size, position...) *and* their combinations. 12 examples = noise; 10,000 = a signal."*  
    - **Limit analogy:** Avoid Copycat; use broad strokes: *"Human minds compress patterns into concepts; AIs often amplify patterns from data floods."*  

  #### **5. Closing Check: Did They Get It? (5 mins)**  
  - **Diagnostic Question:**  
    *"Why is a child who learns 'dog' from two examples *not* doing the same thing as an AI trained on 10,000 dog photos?"*  
    - **Target Insight:** Humans induce concepts from sparse data by leveraging innate biases/analogies; this is the unexplained phenomenon. Strong answers reference *abstraction*, *bias*, or *generalization from few examples*.  
  - **If answers falter:** Prompt: *"What’s the *minimum* the child’s brain must be doing that the AI struggles with?"*  

  #### **6. Explicit Boundaries (Throughout)**  
  - **What to Skip:**  
    - **Neuroscience/cognitive architecture:** *"We’re focusing on the *why*—why sparse data highlights human intelligence—not *how* brains implement this."*  
    - **Technical AI details:** *"Today’s about the puzzle of concept learning. We’ll tackle specific AI approaches another time!"*  
  - **Frame as Empowerment:** *"We’re isolating the core mystery: *concept formation*. Once you see this, you’ll spot it everywhere—from learning language to interpreting laws."*  

  ---

  ### **Problem Selection Notes**  
  - **Why your chosen problem works:** The visual distraction (circle position) creates friction. Students *feel* the leap from perceptual features ("left") to conceptual ones ("exactly one circle"). The debrief writes itself.  
  - **Backup:** If students solve it fast, add complexity (e.g., left: circles with *smaller* shapes to their right).  

  ### **Facilitation Tips**  
  - **Let frustration brew:** When rules fail, ask *"What’s the designer *trying* to teach us?"* to pivot to meta-cognition.  
  - **Anchors:** Repeat key phrases: *"Patterns in the eye, concepts in the mind"*; *"Data is cheap, interpretation is gold."*  
  - **End:** Preview next session (e.g., *"Next, we’ll see how these puzzles relate to AI’s biggest challenges: creativity and common sense."*).  

  This design makes the abstract tangible through struggle, debate, and analogy—centering their experience as evidence of the phenomenon itself.
