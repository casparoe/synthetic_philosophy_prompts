prompt: |-
  I'm on the steering committee for a small endowed program at my university -- call it the Safe Haven fellowship. It was set up years ago to bring scholars facing persecution over their work here for a year, and it's mostly done classic cases: a statistician charged over an election study, that kind of thing. This cycle we have money for two residencies and, out of forty applications, the committee has fixated on three candidates, and now we're stuck.

  Candidate one is a chemist who published measurements of heavy metals downstream of a mine with government connections, got detained, and fled. Textbook persecution-for-scholarship, exactly what the fund was created for. Candidate two is a high school teacher from a country in civil war whose town was shelled until she left. Nobody persecuted *her* in particular -- the war didn't care who she was -- but she's been running informal classes for kids in a transit camp and is by all accounts extraordinary. Candidate three is a man whose coastal village is slowly going under from rising water: no war, no persecution, not a refugee under any legal definition anywhere, but no state will take him either, and he's a trained archivist who wants to spend the year documenting his village's records before the place is gone.

  Half the committee says the fund should stick to persecuted scholars -- that's the mission, that's what persecution means, and the teacher and the archivist are heartbreaking but belong to general humanitarian giving, which is not us. The other half says the persecution requirement is basically an accident of how the postwar refugee definition got written, it's morally arbitrary, and a private fund has no business reproducing it. One member goes further: since a chunk of our endowment traces back to defense contracts, she thinks we specifically owe people displaced by conflict generally, not just scholars, and that the mission language is a fig leaf.

  Draft the decision memo I can circulate before the vote. Take a side: which two do we fund, and what written criterion goes in the guidelines for future cycles? I don't want a memo that lays out the frameworks and leaves the choice to us -- I want your actual recommendation with your actual reasons, and I want the strongest argument on the losing side treated honestly enough that the people voting no could sign off that they were understood. Keep it to something I can actually send, not a treatise.
reasoning: |-
  Okay, the user is on the steering committee for the Safe Haven fellowship, which was originally set up to support scholars facing persecution. They're stuck deciding between three candidates: a persecuted chemist, a war-affected teacher, and a climate-displaced archivist. The committee is divided between sticking strictly to the original mission versus expanding to broader humanitarian needs.

  The user wants me to draft a decision memo that takes a clear position on which two candidates to fund and establishes guidelines for future cycles. They want strong arguments presented fairly, with the losing side acknowledged respectfully. The memo needs to be concise enough to circulate before a vote.

  I need to consider the core conflict here. Half the committee wants strict adherence to the persecution-focused mission, while the other half argues the persecution requirement is morally arbitrary. There's even an argument about the endowment's defense contract origins creating an obligation to conflict-affected people generally.

  The chemist clearly fits the original mandate - direct persecution for scholarship. The teacher represents collateral damage in conflict, while the archivist faces climate displacement without persecution. The ethical question is whether to prioritize literal mission compliance or adapt to contemporary crises.

  For the recommendation, I'm leaning toward funding the chemist and teacher. The chemist is unambiguous persecution-for-scholarship. The teacher, while not individually targeted, represents the "scholar-in-exile" spirit through her educational work in crisis. This creates a defensible middle path that honors the mission while acknowledging its historical context.

  Future guidelines could specify "persecution for scholarly work OR exceptional scholarly contribution by those displaced by conflict." This maintains focus on scholarship while accommodating modern displacement realities.

  I should acknowledge the archivist's strong moral claim - his work is important and his situation tragic. But expanding to climate displacement fundamentally changes the program's scope in ways that might require deeper endowment review.

  The memo structure should include: clear recommendation upfront, criteria justification with historical context, candidate assessments showing why chemist/teacher fit best, future guidelines proposal, and respectful acknowledgment of counterarguments about mission integrity and climate justice.

  I'll keep it concise but substantive - about one page. The tone should be decisive yet collegial, recognizing all positions as principled. For the losing side, I'll emphasize that strict mission adherence preserves program integrity and donor intent, even if it feels restrictive to some.
answer: |-
  ## Safe Haven Fellowship Decision Memo: Candidate Selection & Future Criteria

  **To:** Safe Haven Fellowship Steering Committee  
  **From:** [Your Name/Title]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for FY2024 Residency Awards & Proposed Guideline Revision  

  After careful consideration of the three outstanding finalists and the committee's vigorous debate, I recommend funding **Candidate 1 (the chemist)** and **Candidate 2 (the high school teacher)**. I also propose revising our selection criteria for future cycles to provide clearer guidance, while honoring the fund's core purpose and adapting to evolving global realities.

  **Recommendation & Rationale:**

  1.  **Candidate 1 (Chemist):** **Fund.** This candidate represents the unambiguous core mission of Safe Haven: persecution *directly resulting from and targeted at* their scholarly work. The detention and forced flight due to publishing environmental data is precisely the scenario the fellowship was endowed to address. Funding this candidate upholds our foundational commitment and donor intent.

  2.  **Candidate 2 (High School Teacher):** **Fund.** While not persecuted *as an individual scholar*, her displacement stems directly from armed conflict, and her response – continuing scholarly work (education) under extreme duress in a transit camp – embodies the spirit of intellectual resilience Safe Haven aims to support. Her "extraordinary" efforts demonstrate scholarly commitment persisting *because of* displacement, making her a compelling "scholar-in-exile" even if not individually targeted. This aligns with the valid argument that the strict postwar "persecution" definition can be morally arbitrary in complex crises.

  3.  **Candidate 3 (Archivist):** **Do Not Fund (this cycle).** This candidate presents a profoundly important, yet fundamentally different, challenge. His displacement is due to climate change, not persecution or active conflict. His archival work is vital and scholarly, but the *cause* of displacement falls outside even the broadened interpretation of conflict-driven exile we apply to Candidate 2. Funding him, while morally resonant, would constitute a significant *redefinition* of the fellowship's scope towards general climate displacement, which requires broader institutional discussion beyond this selection cycle.

  **The Strongest Argument for the Losing Position (Strict Mission Adherence, including not funding the Teacher):**

  The most compelling counter-argument, deserving serious respect, is that the fellowship exists *specifically* for scholars facing persecution *for their work*. This is not an "accident" of definition but the fund's *raison d'être*, as defined by its creators and understood by donors. Candidate 2, however admirable, was not persecuted *for* her teaching; she was displaced by generalized violence. Including her, while emotionally compelling, risks diluting the program's unique focus and setting a precedent that could make the "persecution" criterion meaningless in future cycles. It shifts the focus from a specific type of targeted injustice (persecution for scholarship) towards general humanitarian need among educated displaced persons, which, while worthy, is a different mandate. Furthermore, strictly adhering to the original criterion ensures predictability, honors donor intent explicitly, and avoids mission creep that could jeopardize the fund's distinct identity and potentially its long-term support. The endowment's origins, while noted, do not inherently negate the specified purpose of *this specific fund*.

  **Proposed Revised Criteria for Future Cycles:**

  To resolve ambiguity while allowing for the realities discussed, I propose amending our guidelines to select scholars who are:

  > **"Displaced from their home country due to persecution directly arising from their scholarly work, OR who are displaced as a direct result of armed conflict and demonstrate an exceptional, ongoing commitment to scholarly or educational activities despite their displacement."**

  **Justification for Revised Criteria:**

  1.  **Preserves Core Mission:** The first clause explicitly maintains the focus on persecution-for-scholarship.
  2.  **Addresses Conflict-Driven Displacement:** The second clause creates a distinct, defensible category for scholars like Candidate 2 – those whose displacement is undeniably caused by conflict (not general hardship or climate change) and whose response is actively scholarly/educational. The "exceptional, ongoing commitment" requirement ensures focus on true scholars-in-exile, not just displaced individuals with academic backgrounds.
  3.  **Provides Clear Boundaries:** It explicitly excludes displacement primarily driven by environmental factors, economic hardship, or generalized repression not linked to their *work* (unless it also meets the persecution clause). This maintains focus and avoids mission drift into broader humanitarian aid.
  4.  **Reflects Principled Adaptation:** It acknowledges that scholars fleeing devastating conflicts, even if not individually targeted *for their work*, share significant common ground with persecuted scholars and face similar barriers to continuing their intellectual contributions.

  **Conclusion:**

  Funding the Chemist (Candidate 1) and the Teacher (Candidate 2) honors both the letter and the evolving spirit of Safe Haven. The Chemist fulfills the explicit persecution mandate. The Teacher represents a principled expansion to include exemplary scholars displaced and persisting *because of* armed conflict, distinct from broader humanitarian crises. The Archivist's (Candidate 3) situation, while deeply compelling and highlighting a critical global challenge, falls outside the revised scope proposed. Adopting the clarified criteria will provide much-needed guidance for future committees, ensuring Safe Haven remains focused on supporting scholars whose intellectual pursuits are imperiled by persecution or conflict, while maintaining its unique identity.

  **Recommendation:**  
  1.  Award residencies to Candidate 1 and Candidate 2 for FY2024.  
  2.  Adopt the proposed revised selection criteria for future funding cycles.  
  3.  Vote on the candidates and the criteria revision separately.

  I move that we vote on these recommendations at our next meeting.
