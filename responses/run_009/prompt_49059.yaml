prompt: |-
  I'm reading a popular book on the physics of information, and its chapter on Maxwell's demon closes with a summary I'd like to check before I repeat any of it to the study group I teach. The gist of the paragraph:

  "Maxwell proposed his demon as a thought experiment designed to refute the second law of thermodynamics: an intelligent being who watches the molecules in a gas and lets fast ones pass to one side while slowing... [rest]

  Maxwell proposed his demon as a thought experiment designed to refute the second law of thermodynamics: an intelligent being who sorts molecules, letting the fast ones through to one side and the slow ones to the other, would create a temperature difference out of nothing and thereby power a perpetual motion machine. Leo Szilard showed why this fails: the demon's measurement of a molecule's state must itself dissipate at least kT ln 2 of heat, and this cost always exceeds whatever the sorting gains. Later, Landauer and Bennett refined this into the modern resolution: since erasing one bit of memory necessarily costs kT ln 2, and since the demon must erase its record to complete the cycle, the demon can never actually reduce the entropy of the gas. The moral is that information is physical, and the second law survives because computation is thermodynamically costly."

  Something about this feels off to me — I half remember that the Landauer/Bennett story moves the cost from measurement to erasure — but I can't tell whether the book is legitimately simplifying or has made real errors. Please go claim by claim and tell me which parts a physicist working on the foundations of thermodynamics would accept as stated, which are simplifications a specialist would let pass, and which are substantive mistakes. I'm especially unsure about three things: whether Maxwell actually offered the demon as a refutation of the second law, or as an observation about its statistical character; whether Szilard's result is about a measurement cost that strictly exceeds the gain, or about something more like an exact balance; and whether the erasure argument shows the demon cannot lower the gas's entropy at all, or only that it cannot come out ahead over a full cycle. For my notes, please end your reply with a machine-readable verdict on the paragraph's overall accuracy, as the final line, exactly in the form \verdict{...}, where the enclosed text is one of: accurate, minor simplifications only, substantive errors, mostly wrong.
