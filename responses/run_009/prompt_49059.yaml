  Then there's Landauer and Bennett's refinement. Landauer's principle states that erasing a bit costs at least kT ln 2 in heat dissipation. Bennett applied this to the demon by pointing out that the demon must erase its memory to reset the cycle, making erasure the fundamental cost. The book says the demon "must erase its record to complete the cycle," which is correct, but it claims this means the demon "can never actually reduce the entropy of the gas." Actually, during sorting, the gas's entropy decreases, but the erasure increases entropy elsewhere, so overall entropy doesn't decrease. The book's phrasing might imply no local reduction, which isn't right.

