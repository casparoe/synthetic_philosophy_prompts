  ## Consensus™ Support Hub: Ending Arguments with Epistemology

  **Welcome to Consensus Support!** We're here to help you achieve relational harmony through the power of common knowledge and Bayesian rationality. Stop arguing, become common knowledge.

  **How Consensus Works**

  *   **Q: How does Consensus help us stop arguing?**
      A: Consensus leverages Aumann's Agreement Theorem. When partners share the *same prior beliefs* about the world (e.g., "We both fundamentally agree on how dishes *should* be loaded"), and their *updated beliefs* (posteriors) about a specific issue (e.g., "Who left the dishes this time?") become *common knowledge* between them, the theorem mathematically guarantees those updated beliefs *must* be identical. Consensus facilitates this process by structuring communication to build the necessary epistemic tower.
  *   **Q: What does "common knowledge" actually mean here? It sounds intense.**
      A: It *is* intense! It doesn't just mean you both state your opinion ("I think it was you"). It requires that you *know* your partner knows your opinion, and your partner *knows* that you know they know your opinion, and you *know* that they know that you know they know... and so on, infinitely. Simply stating your belief is Step 1. Consensus guides you through the recursive steps to build this tower securely. Mistaking mere announcement for common knowledge is the #1 user error. **Still stuck?** Try our "Knowledge Tower Builder" module (Premium feature).

  **Common Pitfalls & Solutions**

  *   **Q: We're using Consensus, stated our beliefs clearly, but we STILL disagree! What gives?**
      A: This strongly indicates a Prior Mismatch. Aumann's theorem *requires* identical prior probability distributions over all relevant states of the world. If your disagreement persists after achieving true common knowledge of your posteriors (verified by our CK-Certification Protocol™), the theorem proves your priors were never truly aligned. This is epistemically *your fault* as a couple.
      *   **Solution:** Utilize our **Pre-Registration Portal**. Before entering a relationship (or as soon as possible!), couples should formally register their joint, consistent prior distributions covering all foreseeable relationship domains (chore fairness, in-law likelihoods, thermostat settings). Historical pre-registration ensures future disagreements *must* resolve under the theorem. Retroactive alignment is possible but requires deep introspection and our "Prior Reconstruction Toolkit" (Premium).
  *   **Q: My partner seems... less than fully truthful about their updated belief. What now?**
      A: Aumann's theorem, and by extension Consensus, assumes honest reporting of posterior beliefs. If one partner is strategically misrepresenting their true state of knowledge to influence the outcome or avoid conflict, the theorem's guarantees are null and void. Consensus cannot resolve disagreements founded on deception. **We recommend:** 1) Revisit our Terms of Service, Section 7.2 (Epistemic Honesty Covenant). 2) Consider that your relationship may have challenges beyond the scope of Bayesian updating.
  *   **Q: Can we still disagree about ANYTHING under Consensus?**
      A: Technically, only if you formally attest (via a notarized Consensus Disagreement Affidavit™) that your fundamental world-models (priors) were irreconcilably different from the outset regarding the specific issue. While this provides an epistemological 'out', most users report finding this admission profoundly existentially unsettling, often describing it as "admitting our love was built on sand." We offer complimentary Kleenex® with every affidavit submission.

  **Troubleshooting**

  *   **Q: We're stuck in an endless loop of "But do you *know* that I know you know...?" Help!**
      A: Ah, the Infinite Regress Trap. Building the common knowledge tower requires mutual belief in each other's perfect rationality and comprehension at every level. This can be computationally... challenging for humans. **Solution:** Our Premium "Common Knowledge" tier includes an automated CK-Enforcement Engine™ that mathematically verifies each level of mutual knowledge, bypassing the need for conscious recursion. Free "Knowledge" tier users must manually ascend.
      *   **Testimonial:** *"Alex and I started arguing about vacation budgets in 2019. We got stuck on level 3 ('I know that you know that I know...'). Consensus Free tier couldn't help us climb higher. We upgraded to Premium CK in 2021. The CK-Engine verified level 427 instantly. Turns out we actually agreed the whole time! We're spending our savings on Kleenex stock now." - Sam R.*
  *   **Q: Why does the app void all bets between partners?**
      A: Consensus strictly enforces the Milgrom-Stokey No-Trade Theorem corollary. Rational partners with genuinely common priors and common knowledge of their beliefs *cannot* sincerely agree to a pure bet where both expect to profit. Offering or accepting such a bet within the Consensus environment is considered definitive proof that either common priors or common knowledge (or both) have catastrophically failed, rendering the bet epistemically void. Please settle wagers elsewhere.

  **Pricing & Plans**

  *   **Q: What's the difference between the Free "Knowledge" tier and Premium "Common Knowledge"?**
      A: The **Free "Knowledge" Tier** allows you to *state* your beliefs and *hear* your partner's. It provides basic disagreement logging. **Premium "Common Knowledge"** includes the Prior Pre-Registration Portal, CK-Certification Protocol™, Prior Reconstruction Toolkit, CK-Enforcement Engine™, Disagreement Affidavit processing, and unlimited Kleenex® dispenser access. It mathematically *guarantees* agreement where possible.

  **Getting Started**
  Download Consensus™ today! Remember: Shared priors. Honest posteriors. Infinite recursion. Perfect harmony.™
