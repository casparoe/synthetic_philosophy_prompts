prompt: |-
  I have been trying to work out what I actually believe about weakness of will by recording my gut verdicts on cases, most of them turning on the way our preferences bend toward the near future — the pattern psychologists call hyperbolic discounting, where a small imminent reward can outweigh a larger distant one, while the larger one wins when both are equally distant. I would like to know whether a single principle underlies these verdicts, and I will admit up front that at least two of them pull in opposite directions.

  The cases and my verdicts:

  1. At nine in the morning, Mara firmly intends to go to the gym at six. At six, on the couch, she judges — sincerely, not as a rationalization — that the evening would be better spent resting, and stays. By nine that night she wishes she had gone. Verdict: clear akrasia.

  2. The same setup, except that this Mara, looking back that night, still thinks resting was better. No regret, no sour grapes: she simply values the gym less once the effort is no longer immediate. Verdict: not akrasia, just a change of preference. But I cannot say what distinguishes this from case 1 other than which self gets to cast the deciding vote.

  3. A smoker who each morning sincerely resolves to quit tomorrow, and each evening sincerely prefers to smoke today, knowing he will resolve again tomorrow. Verdict: akrasia, and worse than case 1 — even though at each moment his action matches his judgment at that moment, so no self is failing by its own lights.

  4. A student who binds herself in advance: a service will donate her money to a cause she despises if she misses a study target. She misses it anyway. Verdict: akrasia, and the pre-commitment makes it clearer rather than different in kind. This seems to commit me to the earlier self being authoritative over the later one, a view I do not in general hold.

  5. Someone who says, in advance and with full understanding: at the party I will eat the cake; I judge now that I ought to eat it; at the moment of eating I will judge, and want, otherwise; and I endorse letting the earlier judgment govern. All of this then happens exactly as described. Verdict: no akrasia — yet this has the same temporal structure as case 1 with the dissent merely moved earlier, which makes the two verdicts hard to hold together.

  Is there a principle — perhaps stated in terms of which temporally extended agent is the proper locus of evaluation, perhaps in terms of the shape of the discount curve, perhaps something else entirely — that captures these verdicts, or most of them? Please state it as precisely as you can, indicate which clause each case motivates, tell me honestly which of my verdicts it cannot save and which of those should be dropped, and then apply it to a case I have not listed: a person who stays at a dreary party out of duty while every present impulse presses her to leave, and who feels torn while doing what her better judgment favors. Is that weakness of will, its mirror image, or no failure at all — and what exactly, on your principle, is or is not going wrong?
reasoning: |-
  Hmm, the user presents a fascinating philosophical puzzle about weakness of will (akrasia) centered on hyperbolic discounting. They've meticulously documented five cases with conflicting intuitions and seek a unifying principle. The cases reveal deep tensions: sometimes regret defines akrasia (case 1), sometimes not (case 2); synchronic consistency doesn't preclude akrasia (case 3); pre-commitment highlights rather than changes akrasia (case 4); and temporal symmetry of dissent matters unexpectedly (case 5). 

  The user's struggle with "which self gets the deciding vote" is particularly telling - they recognize this as the core tension but resist simple solutions like always privileging earlier selves. Their admission that cases 1 and 5 "pull in opposite directions" despite identical temporal structures suggests they're wrestling with the metaphysics of agency over time. 

  For a unifying principle, I'm considering something like: "Akrasia occurs when an agent acts against their reflectively endorsed valuation due to temporal proximity effects, where reflective endorsement requires either current affirmation or diachronic consistency of valuing." This would: 
  - Make regret irrelevant (resolving case 1 vs 2 tension by focusing on valuation consistency)
  - Treat the smoker (case 3) as akratic because no stable valuation exists across time
  - Explain pre-commitment (case 4) as externalizing the reflectively stable self
  - Distinguish case 5 by the presence of explicit diachronic endorsement

  The hardest fit is case 2. If Mara never regrets skipping the gym, is this truly stable valuation? My principle might need to bite the bullet and call this non-akratic, implying that hyperbolic discounting only becomes akrasia when it conflicts with deeper valuations. 

  For the dreary party case: staying despite impulses would be strong-willed under this principle if duty reflects reflective endorsement. The "torn" feeling suggests conflict but not necessarily failure - it's akrasia only if she abandons duty for impulse. 

  The user's sophisticated framing suggests they'd appreciate Richard Holton's work on resolution as a distinct mental state. I should mention this in the response while keeping the solution principle-based as requested.
answer: |-
  Based on your cases and verdicts, a single principle emerges that captures *most* of your intuitions while resolving the tension between cases 1 and 5. This principle focuses on **diachronic endorsement** and **the stability of reflective valuation**:

  **The Principle of Diachronic Reflective Stability (DRS):**
  *Akrasia occurs when an agent acts against their own reflectively endorsed valuation due to a shift in motivation caused solely by temporal proximity, and where this shift is not itself reflectively endorsed by the agent's stable evaluative standpoint across time.*

  **Key Components:**
  1.  **Reflectively Endorsed Valuation (REV):** The agent's considered judgment about what is best, formed without the immediate pressure of temptation or aversion. This is the "better judgment."
  2.  **Stable Evaluative Standpoint (SES):** The core values or priorities that persist over time, even as specific preferences shift situationally. This is revealed by consistent REV across non-overlapping deliberation contexts.
  3.  **Shift Due Solely to Temporal Proximity (STP):** The change in motivation is *only* because the costs/benefits have moved closer/farther in time (hyperbolic discounting), not because of new information, changed circumstances, or deeper reflection on values.
  4.  **Lack of Diachronic Endorsement (LDE):** The agent *does not* (at any time, including during the lapse) reflectively endorse the *process* or the *reason* for the motivational shift (the STP) as being consistent with their SES. They see it as a distortion.

  **How DRS Explains Your Verdicts:**

  1.  **Mara (Regrets): Akrasia (Fits DRS)**
      *   REV: Morning Mara values gym attendance.
      *   SES: Evening regret confirms gym attendance aligns with her stable values.
      *   STP: The shift to preferring rest is caused solely by the immediacy of effort.
      *   LDE: Evening Mara regrets the shift, showing she doesn't endorse the STP as reflecting her true values. The STP distorts her action away from her REV/SES.

  2.  **Mara (No Regret): Not Akrasia (Fits DRS)**
      *   REV: Morning Mara values the gym.
      *   **SES: The lack of regret indicates her stable value *has genuinely changed*. Resting *now* reflects her stable values; the morning valuation was contingent on future effort being abstract/distant.** The STP aligns with her evolved SES/value hierarchy. There is no conflict with an SES. (Clause: Absence of LDE - no stable value is violated).

  3.  **Smoker: Akrasia (Fits DRS)**
      *   REV: Morning self values quitting.
      *   SES: The cyclical nature *reveals* an SES that values health/long-term well-being, even if constantly overridden.
      *   STP: The shift each evening is purely due to the immediacy of craving relief vs. distant health benefits.
      *   LDE: The smoker never endorses *in reflection* (morning or evening) that the *reason* for smoking (STP) is valid or consistent with their SES. The morning resolution is a recognition of this. The evening "preference" is ephemeral and driven purely by proximity. (Clause: STP causes action against SES/REV, LDE).

  4.  **Student: Akrasia (Fits DRS)**
      *   REV: Pre-commitment self values studying.
      *   SES: The pre-commitment *itself* is strong evidence of an SES valuing studying/long-term goals over short-term temptations.
      *   STP: The shift leading to missing the target is caused by the immediacy of temptation/distraction vs. distant consequences of failing.
      *   LDE: Missing the target (and triggering the donation) confirms she didn't endorse the STP as valid; she tried to *bind* herself *against* it because she knew it would distort her action away from her REV/SES. (Clause: STP causes action against SES/REV, LDE).

  5.  **Cake Eater: Not Akrasia (Fits DRS)**
      *   REV: *Both* judgments are REVs: the advance judgment *to eat* and the momentary judgment *not to eat* are both sincere, considered evaluations.
      *   **SES: Crucially, the agent *reflectively endorses the process*.** They *know* and *accept* that their valuation will flip due to STP (immediacy of temptation vs. abstract future benefit). They *endorse* letting the distant, "cool" REV (eat cake) govern precisely *because* they anticipate and reject the distorting influence of the imminent STP (which would make them *not* want cake). The STP is acknowledged and *managed*, not unreflectively succumbed to.
      *   **No LDE:** The agent diachronically endorses the reason for the shift (they foresee it and endorse countering it). Their action aligns with the REV they reflectively chose to govern the moment (the advance judgment). (Clause: Absence of LDE - the STP's influence is acknowledged and reflectively managed/overruled).

  **Which Verdict Does DRS *Not* Save? What Should be Dropped?**

  *   **The verdict DRS cannot save is the akrasia judgment in Case 1 without also demanding it in Case 5.** Your intuition in Case 5 ("no akrasia") is correct under DRS because of the diachronic endorsement. Case 1 lacks this endorsement (regret shows LDE).
  *   **The verdict that should be dropped is the implication in Case 4 that the "earlier self is authoritative."** DRS doesn't inherently privilege earlier selves. The *pre-commitment self* reveals the SES through its deliberate action (binding), and the *later self* fails to act on that revealed SES due to STP without endorsing the shift (LDE). The later self *could* have reflectively endorsed a change (like Case 2 Mara), but didn't; the pre-commitment just makes the conflict with the SES starkly evident. Authority comes from the SES, not mere temporal order.

  **Applying DRS to the Dreary Party Case:**

  > *A person stays at a dreary party out of duty while every present impulse presses her to leave, and who feels torn while doing what her better judgment favors.*

  1.  **REV:** Her "better judgment" (duty) *is* her current reflectively endorsed valuation at the moment of action.
  2.  **SES:** Acting on duty despite impulses suggests duty is part of her stable values. Feeling "torn" indicates the impulses are strong but not reflectively endorsed *as reasons to act*.
  3.  **STP?** The impulses to leave are likely driven by the immediacy of discomfort/boredom vs. the distant or abstract benefit of fulfilling duty/social obligation (hyperbolic discounting of duty's value).
  4.  **LDE?** Crucially, she *acts* on her REV (duty) *despite* the impulses. Feeling "torn" shows she recognizes the impulses but rejects them as governing reasons. She does *not* endorse the STP (immediacy of discomfort) as a valid reason to abandon duty.

  **Verdict via DRS: Not akrasia. This is strength of will, or at least, successful self-governance despite temptation.**

  *   **What is going right:** She is acting according to her current REV ("better judgment") which aligns with her SES (duty). She recognizes the impulses caused by STP (immediacy of discomfort) but reflectively rejects them as reasons to act. There is no lack of diachronic endorsement (LDE) for her action; her action *is* the endorsement of her REV/SES over the STP-driven impulse.
  *   **What is *not* going wrong (No Akrasia):** She is not acting against her better judgment. Her "better judgment" is the duty-based REV she is *following*. The impulses are strong feelings/pressures, but they do not constitute a competing *reflective judgment* at that moment that she then acts against.
  *   **Why it's not the "mirror image":** The "mirror image" of akrasia (acting on REV despite contrary impulse) is simply successful self-control or strength of will. There is no inherent failure here. Feeling torn is a sign of the *difficulty* of self-control, not a failure of it. Failure (akrasia) would occur if she *left* the party against her better judgment (REV) due to the STP-driven impulses.

  **In summary:** Your verdicts point towards akrasia being defined not by synchronic conflict alone, nor by mere preference change, nor by simple regret, nor by temporal priority, but by a *failure to govern oneself according to one's stable, reflective values* in the face of motivation distorted purely by temporal proximity, where that distortion is not reflectively endorsed. The Cake Eater case highlights that managing anticipated distortion through advance planning and endorsement can avoid akrasia, even while experiencing the distorting impulse. The Partygoer succeeds by acting on her reflective judgment despite unendorsed impulses.
