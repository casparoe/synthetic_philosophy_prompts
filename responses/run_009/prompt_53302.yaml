  ### Joint Statement on Compatriot Partiality: Adversarial Collaboration  
  **Signed by D. (liberal nationalist) and [Your Name] (cosmopolitan prioritarian)**  

  #### I. Agreed Claims  
  1. **Boundaries as institutional artifacts**: Political boundaries are human-created institutional structures that coordinate resource distribution, collective self-determination, and public goods provision. They are not biologically determined or metaphysically fundamental, but neither are they *morally arbitrary* in a strong sense—they reflect historical contingencies with practical consequences for human welfare.  
  2. **Outstanding explanatory burdens**:  
     - The institutional-grounding view (D.'s position) must clarify how obligations extend to compatriots who do not meaningfully *participate* in shared institutions (e.g., children, severely disabled citizens, non-resident citizens).  
     - The relationship view (implied in strong nationalism) must explain why shared nationality *itself* generates obligations absent institutional ties, without collapsing into cultural essentialism.  
  3. **Rejection of extremes**:  
     - Extreme nationalism (denying *all* obligations to non-compatriots) ignores the moral significance of preventable suffering beyond borders.  
     - Extreme cosmopolitanism (denying *any* special weight to compatriots) fails to account for the value of collective self-governance and the psychological realities of human affiliation.  
  4. **Instrumental compatibility**: Both views accept that states can instrumentally serve global welfare (e.g., via trade or climate treaties), and both reject zero-sum assumptions about resource allocation.  
  5. **Baseline commitment**: Severe deprivation (e.g., starvation, statelessness) imposes urgent obligations on all moral agents, regardless of nationality.  

  ---

  #### II. Residual Disagreements  
  *Phrased neutrally to allow mutual endorsement of respective columns:*  

  | Topic | Nationalist Wording (D. accepts) | Cosmopolitan Wording (You accept) |
  |-------|----------------------------------|-----------------------------------|
  | **Source of special obligations** | Co-nationals acquire reciprocal duties through participation in shared institutions that shape their life prospects and identity. | Special obligations to compatriots derive only from the instrumental effectiveness of local institutions; absent efficiency gains, they lack independent moral force. |
  | **Scope of impartiality** | Impartiality requires equal concern for all members within a cooperative institutional scheme, but not equal concern for all persons globally. | Impartiality requires equal concern for all persons as such; differential treatment based on nationality must be justified by its consequences for human welfare. |
  | **Distributive priority** | States may prioritize compatriots above a sufficientarian floor for non-compatriots, even when the latter are worse off in absolute terms. | Priority should be given to the globally worst-off regardless of nationality, provided interventions are effective. |

  ---

  #### III. Cruxes  
  *Test cases designed to isolate core disagreements, with advance predictions:*  

  1. **Crux 1: Institutional participation vs. national relationship**  
     - *Question*: Do special obligations require active participation in institutions, or do they arise from formal co-nationality itself?  
     - *Test Case*: A citizenship-by-investment holder (e.g., Malta passport) who has never resided in the country, paid taxes, or used public services faces a medical emergency. Does the state have an obligation to provide healthcare? Do fellow citizens have obligations to fund it?  
       - *D.’s prediction*: No obligation exists. Claims arise from *de facto* institutional participation, not legal status alone.  
       - *Your prediction*: No obligation exists. Absent functional reciprocity, citizenship is a legal fiction with no moral weight.  
     - *Test Case*: U.S. citizenship-based taxation. Does a non-resident citizen (e.g., working abroad permanently) have strong obligations to fund domestic welfare programs?  
       - *D.’s prediction*: Obligations are attenuated; reciprocity weakens without residency.  
       - *Your prediction*: No obligation beyond preventing deprivation; taxation is justified only by reciprocal benefits.  

  2. **Crux 2: The meaning of "impartiality"**  
     - *Question*: Does impartiality demand equal concern for persons or equal concern for claimants within a scheme?  
     - *Test Case*: A national healthcare system has a fixed budget. Two patients need identical lifesaving treatment: one is a citizen, the other is an undocumented migrant. Both are equally destitute.  
       - *D.’s prediction*: The state may prioritize the citizen without violating impartiality, as obligations are scheme-relative.  
       - *Your prediction*: Prioritizing the citizen violates impartiality; a fair lottery is required absent instrumental justifications (e.g., cost).  
     - *Verbal resolution*: We agree that past disputes conflated:  
       - **Impartiality₁** (equal concern for persons)  
       - **Impartiality₂** (equal concern for co-participants in a scheme).  
       The substantive disagreement is whether Impartiality₁ is ever overridden by Impartiality₂.  

  3. **Crux 3: Distributive metric for non-compatriots**  
     - *[Facilitator-proposed; not pre-agreed]*  
     - *Question*: Must states ensure a sufficiency floor for non-compatriots before prioritizing compatriots, or prioritize the globally worst-off?  
     - *Test Case*: $10M can either:  
       - (A) Lift 1,000 citizens from moderate poverty ($5/day to $10/day), or  
       - (B) Lift 5,000 non-compatriots from severe deprivation ($1/day to $2.50/day—a sufficiency threshold).  
       - *D.’s prediction*: Choosing (A) is permissible once (B)’s recipients reach sufficiency.  
       - *Your prediction*: (B) is obligatory; the greater depth of deprivation outweighs nationality.  

