  2. **Disagreements Table**: We list each residual disagreement as a row with two columns. We avoid slanted language. Topics might include:
     - The source of special obligations: are they grounded in shared institutions or in shared nationality?
     - The scope of impartiality: does it require equal concern for all persons or equal concern among those in a shared scheme?
     - The distributive metric: should we prioritize the worst off globally (prioritarianism) or ensure a sufficient floor for outsiders while allowing priority to compatriots above that floor?

     For each, we phrase the nationalist position in a way D. would accept and the cosmopolitan position in a way the friend would accept.

  3. **Cruxes**: We list the two agreed cruxes and a third we propose (flagged). For each crux, we have:
     - The crux question
     - A test case (agreed upon for the first two, we propose one for the third)
     - Predictions: what the nationalist (D.) would say and what the cosmopolitan would say.

     Crux 1: Grounding of special claims
       - Test case 1: Citizenship-based taxation (US/Eritrea model). Does a non-resident citizen (e.g., living abroad) have the same claims on the state as a resident? And do compatriots have claims on her?
       - Test case 2: Citizenship-by-investment: a person who acquires citizenship without ever residing in the country or participating in its institutions. Does this person have claims on the state and vice versa?

     Crux 2: Meaning of impartiality
       - Test case: We need a scenario that tests whether impartiality applies to persons or to scheme participants. Example: a state has a fixed budget for poverty relief. Should it distribute equally to all poor persons worldwide, or only to poor persons within its jurisdiction? But note they have a test case in mind: we can use the same as above or a new one? Alternatively, we can use a hypothetical where two equally poor individuals, one a citizen and one a foreigner, are in need of aid. Does impartiality require equal concern for both, or does it allow giving priority to the citizen?

     Crux 3 (proposed): Distributive metric
       - Test case: A situation where we can choose between lifting a compatriot from moderate poverty to a comfortable life or lifting a foreigner from extreme poverty to a minimally sufficient level. Which has priority? This tests prioritarianism (worst off first) vs. a sufficientist floor (where we must get everyone to a floor first, then compatriots can be prioritized).

  4. **Verbal Disputes**: We note that a part of their past argument was verbal, specifically about the term "impartiality". They were using it in two different senses without realizing.

  Now, we write the joint statement.

