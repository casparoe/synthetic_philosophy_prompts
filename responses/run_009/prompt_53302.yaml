  **Joint Statement on Compatriot Partiality**

  We, D. (a liberal nationalist) and [Friend] (a cosmopolitan prioritarian), after extensive debate, have identified areas of agreement, clarified our disagreements, and established testable cruxes in an effort to advance our understanding. This document represents a collaborative effort to move beyond talking past each other.

  **1. Agreed Claims**

  We both accept the following:

  1.1. Political boundaries are institutional facts that structure cooperative schemes, resource distribution, and collective self-determination. They are not morally arbitrary in the sense of being without historical or functional significance, but neither are they absolute moral barriers that negate all obligations beyond them.

  1.2. Both the institutional-grounding view (which bases special obligations on shared participation in institutions) and the relationship view (which bases them on shared nationality itself) owe further explanation. The institutional view must account for obligations to members who do not participate (e.g., children, the severely disabled, and non-resident citizens). The relationship view must explain why shared nationality per se, absent institutional ties, generates obligations.

  1.3. Extreme forms of both nationalism and cosmopolitanism are untenable. Extreme nationalism, which denies any significant obligations to non-compatriots, fails to account for basic human duties and the moral significance of extreme global poverty. Extreme cosmopolitanism, which denies any special weight to compatriots, fails to account for the legitimate partiality inherent in collective projects and the moral value of self-determination.

  1.4. A just state must balance internal obligations with external ones. The precise balance is contested, but both agree that a state may not ignore the global poor and that it may give some priority to its own poor.

  1.5. The well-being of individuals matters morally, and the plight of the worst-off is of particular concern. However, we disagree on how to weigh the worst-off across borders versus within borders.

  **2. Disagreements**

  We have residual disagreements on the following points, which we phrase in neutral terms acceptable to each side.

  | Topic | Nationalist Wording (acceptable to D.) | Cosmopolitan Wording (acceptable to [Friend]) |
  |-------|----------------------------------------|-----------------------------------------------|
  | The Ground of Special Obligations | Special obligations among compatriots arise from shared institutions and the cooperative scheme of the state, which create relations of reciprocity and mutual responsibility. | Special obligations to compatriots are either instrumentally justified by the efficiency of local institutions or are unjustified; the only fundamental obligations are to all persons, with boundaries having no intrinsic moral weight. |
  | The Scope of Impartiality | Impartiality requires that a state show equal concern for all participants within its cooperative scheme, but it does not require equal concern for all persons globally. | Impartiality requires equal concern for all persons regardless of citizenship, and any deviation from this standard must be justified by instrumental reasons (e.g., efficiency) or it constitutes nepotism. |
  | The Distributive Metric | A state must ensure that non-compatriots achieve a sufficient level of well-being, but above that threshold, it may prioritize compatriots even when they are less badly off than some non-compatriots. | Priority should be given to the globally worst-off, regardless of nationality, because moral urgency is determined by absolute deprivation, not membership. |

  **3. Cruxes**

  To resolve our disagreements, we identify the following cruxes. For each, we describe a test case and our respective predictions.

  3.1. **Crux 1: What grounds special claims?**  
     *Crux Question:* Do special obligations arise from participation in shared institutions, or from the relationship of shared nationality itself?  
     *Test Case:* Consider a citizenship-by-investment passport holder who has never set foot in the country, paid taxes, or participated in any institutions.  
     - *Nationalist Prediction (D.):* The passport holder does not have the same claims on the state as a resident citizen because obligations are grounded in participation in institutions. However, the state may have minimal obligations (e.g., consular protection) by virtue of having granted citizenship, but these are not based on shared institutions of reciprocity. The state does not have strong obligations to provide her with social services, and she does not have strong obligations (like paying taxes) unless she becomes a participant.  
     - *Cosmopolitan Prediction ([Friend]):* The passport holder does not acquire special claims on the state beyond what any human has, and the state does not acquire special claims on her. Citizenship without institutional participation is a legal fiction that does not create genuine moral obligations. Thus, the state has no more obligation to her than to any non-citizen, and she has no special obligations to the state.  

     *Additional Test Case:* Citizenship-based taxation (e.g., the U.S. system).  
     - *Nationalist Prediction (D.):* The obligation to pay taxes is tied to participation in the cooperative scheme. Non-resident citizens who do not use state services may have reduced obligations, but they retain some (like filing taxes) because they are part of the scheme and benefit from consular protection.  
     - *Cosmopolitan Prediction ([Friend]):* Non-resident citizens who do not use state services should not be obligated to pay taxes because they are not participants in the institutional scheme. The state's claim is based on reciprocity, which is absent.

  3.2. **Crux 2: What does "impartiality" require?**  
     *Crux Question:* Does impartiality demand equal concern for all persons, or equal concern only among claimants within a cooperative scheme?  
     *Test Case:* A state has a fixed budget for poverty relief. There are two equally poor individuals: one a citizen and one a non-citizen. The state can help only one.  
     - *Nationalist Prediction (D.):* Impartiality allows (and may require) the state to prioritize the citizen because the state's obligations are to the participants in its scheme. Equal concern applies within the scheme, so the state is not being partial in an objectionable way by choosing the citizen.  
     - *Cosmopolitan Prediction ([Friend]):* Impartiality requires equal concern for both, so the state must use a fair procedure (e.g., a lottery) to decide. Prioritizing the citizen without an instrumental justification (like administrative feasibility) is partiality and nepotism.

  3.3. **Crux 3: What distributive metric should apply to non-compatriots?**  
     *Note: This crux is added by the facilitator, as neither of us had nailed it down, but we suspect it is relevant.*  
     *Crux Question:* Should we prioritize the globally worst-off (prioritarianism) or ensure a sufficient floor for non-compatriots and then allow priority to compatriots?  
     *Test Case:* A state can choose between two uses of a fixed sum:  
       - Option A: Lift one compatriot from moderate poverty (e.g., from $8,000 to $20,000 annual income) to a comfortable life.  
       - Option B: Lift two non-compatriots from extreme poverty (e.g., from $500 to $2,000 annual income) to a level just above a sufficient floor (say, $2,000).  
     Assume that $2,000 is a minimally sufficient level for basic needs.  
     - *Nationalist Prediction (D.):* The state may choose Option A because the non-compatriots are brought to sufficiency, and above that threshold, the state may prioritize the compatriot even though the non-compatriots are worse off in absolute terms.  
     - *Cosmopolitan Prediction ([Friend]):* The state must choose Option B because the non-compatriots are the worst-off and prioritarianism requires helping the worst-off first. The moderate poverty of the compatriot is less urgent.

  **Verbal Dispute Resolution**

  We agree that a significant portion of our past disagreement about "impartiality" was verbal. We were using the term in two distinct ways without realizing it. D. used "impartiality" to mean equal treatment within a cooperative scheme, while [Friend] used it to mean equal concern for all persons. We now recognize that these are different concepts and that our disagreement is not merely about the word but about which concept is morally relevant. However, clarifying the verbal aspect helps us focus on the substantive question: which kind of impartiality is required?

  **Conclusion**

  We continue to disagree on the fundamental grounds and scope of special obligations to compatriots versus global obligations. However, by identifying these cruxes and making predictions, we hope to test our views against real-world cases and philosophical arguments. We commit to revisiting these predictions in light of new evidence or reasoning.

