  Step by step:

  1. **Agreed Claims**: We list claims both can accept. These should cover:
     - What boundaries are: they are institutional facts that structure cooperation and resource distribution, but they are not morally arbitrary in the sense that they have no effects or history.
     - What each view still owes: the institutional view must explain obligations to non-participating members (e.g., children, disabled, non-resident citizens) and the relationship view must explain why shared nationality per se creates obligations without institutions.
