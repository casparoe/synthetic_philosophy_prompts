prompt: |-
  I keep encountering proposals for solving the ontology identification problem in AI alignment — getting an advanced model to track what some human concept like "happiness" or "doesn't want to be coerced" refers to when the model represents the world in its own learned ontology — and I've realized I don't have a clear sense of what would even count as a solution. Write the desiderata: what any adequate method for ontology identification has to deliver, with the case behind each requirement. At minimum I want you to address: whether the method must work when the model's ontology is alien to ours rather than merely different in granularity; whether it must survive the human's ontology being revised (e.g., a concept anchored in a folk theory that science later displaces, where the referent seems to both survive and change); whether the output has to be checkable by the human whose concepts are being identified, given that the motivating scenario often involves the model possessing inaccessible information that no human could verify; and whether identifying a concept requires also capturing its normative role (what the human counts as a mistake in applying it) or only its extension. For each desideratum, say whether it is non-negotiable or a preference of a particular research program, and flag any pair you suspect cannot be jointly satisfied — I care most about whether the human-checkability requirement and the inaccessible-information motivation are compatible at all, since if they are not, that tension is itself the main result. Then, briefly, score interpretability-driven concept mapping and debate-style elicitation against the list; keep that part short, since the criteria are where the thinking is.
reasoning: |-
  We are to define desiderata for an adequate method for ontology identification in AI alignment. The problem: getting an AI model to track human concepts (like "happiness") when the model uses its own learned ontology.

  Key issues to address:
  1. Alien ontology: Must the method work when the model's ontology is alien (not just a different granularity)?
  2. Ontology revision: Must it survive when the human's ontology is revised (e.g., a concept anchored in folk theory that science displaces, where the referent both survives and changes)?
  3. Checkability: Must the output be checkable by the human? Note the motivating scenario often involves the model having inaccessible information (so the human cannot verify).
  4. Normative role: Must the method capture the normative role (what counts as a mistake) or only the extension?

  For each, we'll state whether it's non-negotiable or a preference, and flag any pairs that might be in conflict. Especially, we care about the compatibility between human-checkability and the inaccessible-information scenario.

  Then, we'll briefly score two approaches: interpretability-driven concept mapping and debate-style elicitation.

  ---

  **Desiderata:**

  1. **Robustness to Alien Ontology (Non-negotiable):**
     - **Requirement:** The method must work even when the model's internal ontology is fundamentally alien — not just a coarsening or refinement of human concepts, but structured in a way that does not map neatly to human concepts at all.
     - **Case:** If the model's ontology is merely a different granularity (e.g., it breaks down "happiness" into subcomponents we also recognize), then the problem is easier. But in the worst case, the model might represent the world in terms of features that are not only uninterpretable to humans but also do not correspond to any human concepts. A solution must handle this to be generally applicable.
     - **Status:** Non-negotiable for a general solution. Without this, the method fails in the most challenging and potentially dangerous cases.

  2. **Ontology Revision Resilience (Non-negotiable):**
     - **Requirement:** The method must correctly track the human concept even when the human's understanding of the concept evolves, especially when the concept is revised due to scientific progress (e.g., the concept of "atom" from indivisible to having subatomic particles, or "gene" from a Mendelian unit to a molecular sequence). The referent might change, but the concept is still considered the same (e.g., we still call it "atom").
     - **Case:** If the method anchors the concept only to a specific theory or set of examples, it may break when the theory is updated. The solution must be able to track the concept through such changes, perhaps by capturing the underlying causal structure or the way the concept is used in reasoning.
     - **Status:** Non-negotiable. Human concepts are not static, and an aligned AI must adapt as our understanding does.

  3. **Human-Checkable Output (Preference, but context-dependent):**
     - **Requirement:** The output of the ontology identification process (i.e., the model's representation of the human concept) should be checkable by the human whose concept is being identified. This means the human can verify whether the model has correctly captured the concept, at least in a set of test cases.
     - **Case:** Without checkability, we cannot trust the method. However, the motivating scenario often involves the model having information that the human does not (e.g., the model might predict a future event that the human cannot verify until it happens). Thus, we might require that the model can explain its mapping in a way that the human can evaluate on cases the human can check, and trust that it generalizes to the inaccessible cases.
     - **Status:** This is a preference in many research programs (for transparency and trust) but might be relaxed in some scenarios. However, if we require strict checkability, it might conflict with the inaccessible-information scenario. We must note the tension: if the model has information the human cannot access, then the human cannot fully verify the model's representation in the inaccessible cases. Thus, we might have to settle for partial checkability or trust in the model's explanation.

  4. **Capturing Normative Role (Non-negotiable for some, preference for others):**
     - **Requirement:** The method must capture not just the extension (the set of things the concept applies to) but also the normative role — the conditions under which the human would consider the application of the concept correct or incorrect, including in hypothetical scenarios.
     - **Case:** Two concepts might have the same extension in the actual world but differ in counterfactuals (e.g., "water" and "H2O" have the same extension, but they were not always known to be the same). Moreover, the human might have rules for applying the concept that go beyond observed examples. Capturing the normative role ensures the model understands how the concept is used in reasoning and what counts as a mistake.
     - **Status:** Non-negotiable for a robust solution. If we only capture extension, the model might not generalize correctly to novel situations or counterfactuals. However, some research programs might initially aim for extension-only as a stepping stone.

  **Tensions between desiderata:**

  - The main tension is between **Human-Checkable Output** and the **inaccessible-information scenario**. If the model has information that the human cannot access, then the human cannot fully verify the model's representation in the inaccessible cases. Thus, we cannot have full checkability in such scenarios. We must relax one of the two: either the method does not require checkability in the inaccessible cases (and we rely on other safeguards) or we design the method so that the model can demonstrate its understanding in accessible cases and we trust it generalizes. This tension suggests that full checkability might be impossible in the presence of inaccessible information. However, we might require that the method produces outputs that are checkable in the cases that are accessible to the human, and that the model can provide explanations that the human can follow and verify in those cases. This partial checkability might be the best we can do.

  **Scoring two approaches:**

  1. **Interpretability-Driven Concept Mapping:**
     - This approach involves analyzing the model's internal representations (e.g., activations) and mapping them to human concepts via techniques like probing, feature visualization, or causal interventions.
     - **Robustness to Alien Ontology:** Poor. If the model's representations are alien, it may be very hard to find a mapping without a shared structure.
     - **Ontology Revision Resilience:** Poor. The mapping is often tied to current representations and may not adapt to revised concepts without retraining or re-probing.
     - **Human-Checkable Output:** Good. The mapping can be presented to humans (e.g., showing what inputs activate a neuron) and they can check if it matches their concept in test cases.
     - **Capturing Normative Role:** Poor. Interpretability usually captures statistical patterns (extension) but not the normative rules. It might not handle counterfactuals well.

  2. **Debate-Style Elicitation:**
     - In this approach, models are asked to debate or explain their understanding of a concept, and humans (or other models) judge the explanations.
     - **Robustness to Alien Ontology:** Moderate to Good. The model must explain in human terms, so it must learn to translate from its ontology. With enough debate, it might converge to a correct mapping even if the ontology is alien.
     - **Ontology Revision Resilience:** Good. The debate process can be updated with new information and the model can adjust its explanations accordingly.
     - **Human-Checkable Output:** Good. The explanations are in human language and can be checked by humans. However, if the model uses inaccessible information, the human might not be able to verify the truth of the claims, only the coherence of the explanation.
     - **Capturing Normative Role:** Good. The debate can include hypothetical scenarios and the human can judge whether the model's application of the concept is correct in those cases, thus capturing the normative role.

  **Summary of Tensions and Main Result:**

  The most critical tension is between **Human-Checkable Output** and the **inaccessible-information scenario**. They are not fully compatible: if the model has information the human cannot access, then the human cannot directly check the model's representation in those cases. Therefore, we must relax the checkability requirement to partial checkability (on accessible cases) and rely on the model's ability to explain its reasoning in a way that the human can follow and trust. This tension is a key challenge and may require a combination of methods and safeguards.

  **Final Thoughts on Desiderata:**

  - Alien ontology and ontology revision resilience are non-negotiable for a robust solution.
  - Capturing normative role is also non-negotiable for full alignment.
  - Human-checkability is highly desirable but must be reconciled with the reality of inaccessible information. It may be that we require the method to be checkable in the accessible domain and then trust the model to extrapolate correctly to the inaccessible, but this trust must be earned through methods like debate or extensive testing.
answer: |-
  ### Desiderata for Ontology Identification in AI Alignment

  Below are the desiderata for an adequate solution to the ontology identification problem, along with their rationale, status (non-negotiable vs. preference), and potential conflicts. I focus on your specified criteria and explicitly address tensions, especially between human-checkability and inaccessible information. I then briefly score two approaches.

  #### 1. **Robustness to Alien Ontology**  
  **Requirement:** The method must work when the model's ontology is fundamentally alien (e.g., non-compositional, non-human-interpretable features) rather than merely differing in granularity (e.g., finer-grained "sub-concepts" of human ideas).  
  **Case:** Alien ontologies may arise from high-dimensional, non-symbolic representations in deep learning. If the method fails here, the AI could misinterpret human values in novel contexts (e.g., equating "happiness" with dopamine activation patterns, ignoring subjective experience).  
  **Status:** **Non-negotiable.** Without this, the solution fails in worst-case scenarios where the model's internal structure is opaque.  

  #### 2. **Resilience to Ontology Revision**  
  **Requirement:** The method must track human concepts even when the human's ontology evolves (e.g., "atom" shifting from indivisible particles to quark-based models, where the referent changes but the concept persists).  
  **Case:** Human concepts are theory-laden and update with new evidence (e.g., scientific progress). If the method anchors to outdated theory, it breaks when concepts revise (e.g., an AI using a folk-psychology definition of "anger" that ignores modern neuroscience).  
  **Status:** **Non-negotiable.** Alignment requires adaptability to human learning; static mappings risk value drift.  

  #### 3. **Human-Checkable Output**  
  **Requirement:** The output (e.g., the model's interpretation of "coercion") must be verifiable by the human whose concept is being identified, despite the model potentially having inaccessible information (e.g., future events or subconscious biases the human can't observe).  
  **Case:** If outputs are unchecked, misalignments could go undetected (e.g., the model "correctly" identifies "pain" in scenarios involving inaccessible data, but for wrong reasons). However, inaccessible information (e.g., a model predicting long-term consequences of coercion) complicates verification.  
  **Status:** **Preference** for most alignment research programs (e.g., ELK-based approaches). Not strictly non-negotiable, as some scenarios (e.g., forecasting) inherently limit verification.  
  **Conflict:** **Direct tension with inaccessible-information motivation.** If the model relies on data the human *cannot* access (e.g., complex correlations in its latent space), full checkability is impossible—humans can only test falsifiable *proxies* (e.g., explanations for accessible cases). *This tension is unresolvable without compromising one side*: you can't have both strict verification and robust handling of inaccessible information. The best compromise is "partial checkability" (e.g., verifying a concept in controlled tests and trusting generalization).  

  #### 4. **Capturing Normative Role**  
  **Requirement:** The method must capture the concept's *normative role* (e.g., conditions where applying "coercion" is a mistake, such as mistaking persuasion for force) beyond its extension (the set of all instances of coercion).  
  **Case:** Extensions alone fail in novel/hypothetical scenarios (e.g., an AI might correctly identify past coercion but not recognize new forms). Normative roles anchor concepts to human reasoning (e.g., "misapplication" reflects intention, context, or moral norms).  
  **Status:** **Non-negotiable** for value alignment. Preferences and moral judgments hinge on norms, not just reference.  

  #### Key Tensions  
  - **Human-checkability vs. inaccessible information:** As above, these are **incompatible at extremes**. If the model uses truly inaccessible information (e.g., privileged data from its world-model), humans can only verify consistency with *accessible* examples. This forces a trade-off: prioritize checkability (risking undergeneralization) or robustness to inaccessible info (risking unverifiability).  
  - **Alien ontology + normative role:** Hard to satisfy jointly. Alien representations may not encode human-like norms, making it difficult to extract "mistake conditions" without human-like priors.  
  - **No other major pairwise conflicts**, but all desiderata together may require a hybrid approach.  

  ### Scoring Existing Approaches  
  **A. Interpretability-Driven Concept Mapping** (e.g., probing, activation editing)  
  - **Alien ontology:** Poor. Assumes human-model ontologies are structurally similar (e.g., linear probes fail for non-interpretable features).  
  - **Ontology revision:** Poor. Static mappings break when concepts evolve (e.g., probes trained on old data won't track revised concepts).  
  - **Human-checkable:** Good. Humans can inspect explanations (e.g., "this neuron fires for happiness").  
  - **Normative role:** Poor. Captures extensions (e.g., input-output pairs) but rarely mistake conditions.  
  **Verdict:** Fails alien/non-static cases; best for granularity differences.  

  **B. Debate-Style Elicitation** (e.g., AI debates concept definitions with humans)  
  - **Alien ontology:** Moderate. Debates force translation into human terms, but may fail if the model’s ontology lacks analogous components.  
  - **Ontology revision:** Good. Iterative debates can incorporate new evidence (e.g., updating "atom" post-revision).  
  - **Human-checkable:** Moderate. Outputs are human-readable, but verification depends on debater honesty and human cognitive limits (especially with inaccessible info).  
  - **Normative role:** Good. Debates can explore edge cases and mistakes (e.g., "Is this coercion?").  
  **Verdict:** Better at normative roles and revision, but struggles with alien ontologies and unchecked inaccessible info.  

  ### Conclusion  
  - **Core tension:** Human-checkability and inaccessible information are **fundamentally at odds**. A solution must choose between:  
    - *Weak checkability:* Verify only accessible examples, risking hidden failures.  
    - *Compromise:* Use methods like debates to approximate verification, accepting that some information (e.g., long-term consequences) remains uncheckable.  
  - **Non-negotiables:** Alien ontology, revision resilience, and normative role capture are essential for robust alignment.  
  - **Recommendation:** Prioritize hybrid methods (e.g., elicitation + limited interpretability) and accept partial checkability. The unresolvable tension suggests alignment research should focus on "fail-safe" generalization (e.g., uncertainty awareness) when verification is impossible.
