  For each objection, craft a two-minute reply. The realism objection: clarify that partial truth doesn't deny facts but models linguistic limitations. Soft spot: metaphysicians might still see it as avoiding the issue. The Tarski objection: argue hierarchy is unnatural for natural language. Soft spot: admitting hierarchy in formal aspects might weaken the natural language claim. Dialetheist objection: emphasize pragmatic avoidance of contradictions. Soft spot: dialetheists won't buy that explosions are worse than gaps. Curry's paradox: explain how implication in the object language forces gaps. Soft spot: needing to restrict logical rules might seem ad hoc.

