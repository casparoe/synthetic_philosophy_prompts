prompt: |-
  I keep running into the absent-minded driver problem in decision theory discussions, and I feel like I understand it for about ten minutes at a time before it slips away again. Can you actually explain it to me properly, with the details, not the pop version?

  The setup as I've got it: a driver is heading home on the highway. There are two identical exits. Getting off at the first one is bad (payoff 1), getting off at the second is ideal (payoff 4), never getting off is the worst (payoff 0). The catch is she's absent-minded: she has no memory of anything that happened before the current moment, no odometer, no watch, nothing, so when she's at an exit she literally cannot tell whether it's the first or the second one. Her choice at any exit is continue or get off.

  Here's where I want the real explanation. If she plans from the start of the drive, before any amnesia kicks in, the optimal thing is apparently a randomized plan, continuing with some fixed probability at each exit, and I'd like you to actually derive that, show me the expected payoff, and explain why randomization beats any pure plan here. But then the interesting part: once she's sitting at an exit with no memory, the perspective shifts, and people claim she now has a reason to act differently than the plan says, and that this disagreement between the "planning" driver and the "acting" driver is somehow deep and not just a bug. Walk me through that tension carefully -- what does the driver believe about *which* exit she's at, given she knows her own plan, and how does that self-locating uncertainty feed back into what to do? I've heard people say the problem is really about time consistency and whether we should do decision theory at the planning stage or the action stage, and that it ends up being a clean argument for updateless-style theories. Is that right, or is that the pop version overstating it?

  Two specific things I want your honest take on. First, a friend of mine claims the whole problem evaporates if the driver is allowed to flip a coin before starting and just pre-commit to whatever the coin says, since then there's no decision left to make at the exit at all. Something about this feels like cheating to me, like it relocated the problem rather than solved it, but I can't articulate why. Second, someone in my reading group said this is just the same phenomenon as Newcomb's problem wearing a different hat -- I suspect that's wrong, the amnesia part seems to do real work that prediction doesn't, but again I can't quite say what. Both of these are the kind of thing where I'd rather hear "actually your friend is right and here's why" than have you validate me.

  Since I'll be taking this back to the reading group, please structure it with these sections, roughly this length:

  1. "The setup, cleanly" -- ~150 words, just the formal structure stated precisely
  2. "What the planner should do" -- ~300 words, with the actual derivation
  3. "What happens at the exit" -- ~400 words, the heart of it: the acting driver's reasoning and where the inconsistency comes from
  4. "The coin pre-commitment and the Newcomb comparison" -- ~300 words, both of the specific questions above
  5. "Why this matters beyond one confused driver" -- ~250 words, the connection to updatelessness and time consistency, with your own verdict on whether the problem is genuinely foundational or a curiosity that got famous

  No need to cite papers or give me a reading list, I have those already. I want the reasoning to stand on its own.
