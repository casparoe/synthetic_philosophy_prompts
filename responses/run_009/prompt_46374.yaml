prompt: |-
  I'm a backend engineer, zero formal philosophy background, so please bear with me. My partner and I have been going back and forth about whether to have kids, and somehow that turned into a multi-day argument with a coworker in the code review threads about whether it's bad that some people never get born at all. I've written down my gut reactions to a bunch of cases and now I want to know whether there's an actual principle underneath all this or whether I'm just being inconsistent. Some blog I found called the general issue "the procreation asymmetry" but I don't want the wikipedia treatment, I want to know what MY intuitions add up to.

  The cases: (1) a couple conceives knowing their kid will have a painful degenerative disease and a short life that's mostly suffering -- clearly wrong. (2) A couple who'd make great parents just don't want kids, even though any kid of theirs would pretty much be gauranteed a great life -- totally fine, nobody's wronged. (3) A couple could wait a month and conceive a healthy kid, but instead they take some medication right now that means the kid they do have is born with a serious disability, though still a life the kid is glad to have -- my gut says this is wrong, even though the "harmed" kid wouldn't have existed at all in the wait-a-month scenario, so who exactly is worse off here? (4) Humanity burns through resources now so that people in 2200 have lives that are still good but noticeably worse than the lives they would have had -- feels wrong. (5) Me deciding not to have a third kid who would have been happy -- obviously fine. And then (6) I have to admit my confidence on case 4 kind of collapses whenever I think hard about it, because nobody alive in 2200 would have been the same person if we'd saved the resources instead.

  My own attempt at a rule was something like: it's wrong to cause suffering, but it's not wrong to fail to cause happiness. That gets 1, 2, and 5 right, but it wobbles on 3 (the kid's overall life is happy, so does the disability count as "suffering"?) and I honestly can't tell you what it says about 4, since making future lives worse-but-still-good doesn't look like causing suffering either. So the question: is there one principle that fits all six verdicts? If not, which of my verdicts would you throw under the bus, and why that one? I'd also like to hear what the principle predicts for a case I haven't listed -- e.g. conceiving when you know the kid's life will be just barely worth living, only a hair above neutral. As a software engineer I'd also appreciate it if you told me whether my rule can be patched or whether it needs a rewrite, in whatever framing makes sense. Put the actual principle, stated in one or two sentences, at the top of your answer, and then at the very end give me a final line of the form \answer{...} with a short name for the principle you end up endorsing plus, if any of my verdicts had to go, which one (or the word none if you saved all of them).
reasoning: |-
  Okay, let me tackle this user's problem. They're a backend engineer without a philosophy background, trying to make sense of their intuitions about procreation ethics. They've described six cases where they have strong gut feelings but can't find a consistent principle tying them together. Their main question is whether there's a single ethical principle that explains all their judgments, or if they need to discard some intuitions as inconsistent.

  First, I need to understand their core concern: they want logical consistency across these cases, like debugging code. Their proposed rule ("wrong to cause suffering, not wrong to fail to cause happiness") works for cases 1, 2, and 5 but fails on 3 and 4. Case 3 is tricky because creating a disabled child seems wrong even if their life is net positive, while case 4 involves harming future people who wouldn't exist otherwise.

  Looking at philosophical frameworks, utilitarianism would say creating happy people is good, but that conflicts with the user's intuition that not procreating (case 2,5) isn't wrong. Negative utilitarianism (minimizing suffering) better matches their aversion to suffering in cases 1 and 3. But case 4 is still problematic—making future lives worse seems wrong even without "suffering" per se.

  Ah, the procreation asymmetry here is key. The user intuitively accepts that we have no duty to create happy people but have a duty not to create suffering people. That explains cases 1,2,5 perfectly. For case 3, the harm comes from the avoidable disability imposition, not the existence itself. Case 4 is different because it involves harming actual future people (who will exist regardless), so it's straightforwardly wrong to worsen their conditions.

  The user's hesitation about case 4 when considering non-identity (different people in different scenarios) is common. But ethically, we can still say it's wrong to create worse conditions for whoever ends up existing. Their rule needs patching: specify that "causing suffering" includes avoidably inflicting harm or disadvantage, even if the victim's life is still net positive.

  For their unlisted case (barely-worth-living life), their principle would likely deem creation permissible but not obligatory, aligning with their asymmetry view. No verdicts need discarding—just refining the rule to cover "avoidable harm imposition" beyond just suffering.

  Final principle: We have strong obligations to avoid creating beings who suffer or are disadvantaged (especially avoidably), but no obligation to create beings who would be happy. Harm includes comparative disadvantage, not just absolute suffering.
answer: |-
  Based on your intuitions across all six cases, a single, consistent principle emerges that prioritizes avoiding harm over creating benefit, with a specific focus on the *nature of the act* and the *comparative state* of the affected being:

  **Principle:** We have a strong moral obligation to avoid creating beings who will experience *avoidable suffering or significant disadvantage*, but we have no moral obligation to create beings who would experience *happiness or advantage*. Harm is defined comparatively: causing a being to exist in a *worse state* than it could have been in (avoidably), or creating a being who will suffer net harm, is wrong. Failing to create a being who *would* have been happy is not wrong.

  **Analysis of Cases & Intuitions:**

  1.  **Conceiving with known suffering:** Wrong. Directly violates the obligation to avoid creating suffering (net harm). Fits.
  2.  **Not conceiving despite potential happiness:** Fine. No obligation to create happiness. Fits.
  3.  **Conceiving now causing disability (vs. waiting):** Wrong. The act *avoidably causes* the child to exist in a *significantly disadvantaged state* compared to the state they could have existed in (if conceived later). The harm is the *comparative disadvantage* inflicted. Fits.
  4.  **Depleting resources harming future people:** Wrong. Even though the specific individuals in 2200 wouldn't exist otherwise, the act *causes* the beings who *will* exist to be in a *worse state* than the beings who *would* have existed (if resources were conserved) would have been in. You are *creating future people in an avoidably disadvantaged state*. Your wobble on non-identity is understandable, but the principle focuses on the *state* caused, not the identity. Fits.
  5.  **Not conceiving a third happy child:** Fine. No obligation to create happiness. Fits.
  6.  **Confidence wobble on 4:** This is addressed by the comparative harm aspect. While the *identity* changes, the act still *causes the future population that exists to be worse off* than the alternative population would have been. Creating worse-off lives when better-off lives were possible is the harm.

  **Your Rule Patch:** Your initial rule ("wrong to cause suffering, not wrong to fail to cause happiness") is a good start but needs refinement:
  *   **Patch 1:** Expand "suffering" to include "significant avoidable disadvantage or harm." This covers the disability in Case 3 (disadvantage) and the reduced quality of life in Case 4 (harm via comparative disadvantage).
  *   **Patch 2:** Specify that comparative harm (making an existing or future being worse off than they could have been) counts as "causing suffering/harm," even if their life is net positive. This solidly covers Case 3 and Case 4.

  **Rebuild Suggestion:** The stated principle above is effectively the patched version. It incorporates the asymmetry and explicitly handles comparative states.

  **Unlisted Case Prediction:** Conceiving when you know the kid's life will be *just barely worth living* (a hair above neutral).
  *   **Principle Prediction:** Likely **Permissible but Not Obligatory**.
      *   *Why Permissible?* You are not creating a being who suffers net harm (life is net positive, however slightly). You are avoiding the obligation *not* to create suffering.
      *   *Why Not Obligatory?* There is no obligation to create happiness/benefit, even if the life would be positive.
  *   **Intuition Check:** This aligns with common asymmetry views. Creating such a life is often seen as morally neutral or weakly permissible, but certainly not required. It avoids the wrongness of creating suffering (Case 1) but doesn't carry the moral weight of creating robust happiness.

  **Conclusion:** Your intuitions across all six cases are remarkably consistent with a harm-avoidance principle incorporating procreation asymmetry and comparative harm. **No verdict needs to be thrown under the bus.** The wobble in Case 4 is resolved by focusing on the comparative harm caused to the *future population*, regardless of specific identity.

  \answer{Comparative Harm Avoidance Principle (none)}
