answer: |-
  ### Thought Experiment: The Fleeting Red

  In a standard vision science lab, Mary, who has learned all physical facts about color vision from within her black-and-white environment, is shown a red card. At the precise moment of exposure, a calibrated transcranial magnetic stimulation (TMS) device—routinely used in the lab for non-invasive neural disruption—temporarily inhibits her prefrontal cortex, blocking cognitive access to her visual experience while leaving low-level visual processing intact. This results in a dissociation: she undergoes a genuine phenomenal experience of red (phenomenal consciousness) but cannot recognize it *as red*, introspect it, form any thought about it, or encode it into memory due to the disrupted access. The TMS effect ceases instantly when the card is removed. Mary retains no ability to recognize red later, cannot visualize or recall the experience, and cannot introspect it, though she knows she was exposed to red via the experimenter’s testimony. Crucially, the disruption is transient, reversible, and causes no structural brain damage.

  ### Analysis Against Standard Replies
  1. **Ability Hypothesis (gains know-how, not facts)**:  
     **Verdict**: She gains no new knowledge.  
     **Reasoning**: The ability hypothesis claims Mary’s gain consists solely of abilities (e.g., recognition, imagination). Here, she gains none: no recognition (during or after), no visualization, no memory, no introspection. Even temporarily, she lacked the ability to *utilize* the experience cognitively. If she gains nothing actionable, the reply concludes she learned nothing new.  
     
  2. **Phenomenal Concept Strategy (gains a new way to conceptualize an old fact)**:  
     **Verdict**: She gains no new knowledge.  
     **Reasoning**: This strategy requires forming a new concept (e.g., "this is what red looks like") to redescribe physical facts. But blocked access prevents concept formation during the experience, and no trace remains afterward. Without a stable concept to deploy in thought, she cannot "think about red differently," so no new knowledge is acquired.  
     
  3. **Old Fact Under a New Guise (gains the same fact via a new mode of presentation)**:  
     **Verdict**: She gains no new knowledge.  
     **Reasoning**: This reply hinges on accessing the *same* physical fact through a fresh subjective perspective (e.g., "red under guise X"). Without cognitive access, Mary cannot represent the fact *under any guise* tied to the experience. The fleeting phenomenality provides no enduring guise, so the reply denies any epistemic gain.

  ### Load-Bearing Feature
  The **dissociation of phenomenal consciousness from access consciousness** (i.e., she has the experience but no cognitive access to it) is the critical feature. It severs the link between the raw experience and the cognitive abilities/concepts the replies rely on.

  ### Removal Test
  If the dissociation is removed (e.g., TMS is not used, so Mary has normal access during exposure), she gains temporary abilities (e.g., recognizing red *while seeing it*), forms a phenomenal concept, or grasps the fact under a new guise. All three replies would then affirm she learned something new (e.g., "she temporarily gained abilities" or "formed a short-lived concept"). The intuition of learning aligns with the replies, unlike the original case.

  ### Strongest Counterattack from an Ability Theorist
  The ability theorist could argue:  
  > "Even without cognitive access, Mary *briefly* possessed an ability: the capacity to *have* the experience itself. This minimal ability—'phenomenal know-how'—constitutes her gain. Our intuition that she learned something is a confused memory of this transient ability, not proof of a fact. If the experience felt like 'learning,' it’s because the ability was instantiated, however fleetingly. Denying this reduces to dualism, as it treats inaccessible phenomenality as non-physical knowledge."

  ### Anti-Cheating Note
  The case **does not assume its conclusion**. It leverages empirical possibilities in neuroscience (e.g., Block’s distinction between phenomenal/access consciousness) to create a scenario where the theories’ *criteria* for knowledge gain fail while preserving the intuition of learning. However, it risks circularity if "phenomenal consciousness without access" is conflated with "knowledge" by fiat—but this is avoided by treating the dissociation as a mechanism to *disable* the abilities/concepts/guises the replies require, not as direct proof of non-physical knowledge.

