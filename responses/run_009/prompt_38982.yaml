prompt: |-
  I have spent twenty years in writing workshops, where the injunction "write what you know" is repeated with the authority of settled doctrine — most recently by a colleague who invoked it to tell a student that her novel about a mathematician in 1913 Göttingen was a dead end, since she is neither a mathematician nor German. The workshop closed ranks around him, and the student, though her project survived, left believing she had been refuted rather than merely instructed. I have been unable to say precisely what the slogan had claimed in that moment, and I would like it disambiguated before I have to referee this dispute again. Lay out the distinct precise claims "write what you know" could be making — from the trivially descriptive (writers draw on their experience), through the epistemic (only first-hand knowledge yields the concrete, load-bearing detail that fiction requires), to the fully normative (a writer has decisive reason to write only what she knows). Then take the normative readings through the debate over internal and external reasons, as it runs from Bernard Williams to his critics: is any reason to write what one knows grounded in the writer's existing motivational set — so that the injunction states at most a conditional, one that fails for a writer who wants nothing from her own biography — or can knowledge of a subject supply a reason to write about it independently of any antecedent desire? For each reading, say whether it is a platitude, substantive but defensible, or straightforwardly false, and above all tell me which, if any, actually supports my colleague's use of the slogan — closing down a project on grounds of biography — as opposed to merely counselling more research.
reasoning: |-
  Hmm, this user presents a complex philosophical and pedagogical question about the "write what you know" maxim. They've witnessed this slogan being weaponized in a workshop to shut down a student's historical fiction project about a mathematician in 1913 Göttingen, based solely on the student's lack of personal identity match. The user wants systematic analysis before they mediate similar disputes.

  The core tension seems to be between descriptive truth (all writing inevitably draws from lived experience) and prescriptive overreach (forbidding imaginative exploration beyond one's biography). I need to disentangle at least three dimensions: 1) descriptive claims about how writing actually works, 2) epistemic claims about what makes fiction convincing, and 3) normative claims about what writers should do.

  For the normative layer, Williams' internal/external reasons framework is crucial. If reasons must connect to the agent's "motivational set" (internal reasons), then "write what you know" only applies to writers already motivated by autobiography. But if external reasons exist (say, from the nature of art itself), the injunction could bind universally. The workshop's application seems to assume external reasons while ignoring the student's actual motivations.

  The mathematician novel example perfectly exposes the slogan's misuse. Historical fiction as a genre obviously requires research, not lived experience. The colleague's application confuses identity with knowledge, ignoring that rigorous study can create "proxy familiarity." Meanwhile, the student's defeated reaction shows how such dogmatism can crush artistic courage.

  Ultimately, the only defensible reading is the descriptive one: writing always metabolizes experience, but that experience can include research and imagination. The colleague's prescriptive application fails philosophically (no external reasons exist to limit subjects) and pedagogically (it stifles growth). The proper advice should've been about research methods, not biographical credentials.
answer: |-
  Here is a disambiguation of "write what you know," analyzed through philosophical lenses, with an assessment of each reading's validity and its relevance to your colleague's injunction against the student's project:

  ### I. Disambiguating the Slogan: Precise Claims
  1.  **Descriptive/Anthropological Claim:**
      *   **Claim:** Writers inevitably draw on their lived experience (sensory, emotional, intellectual, cultural) as the raw material for their work, consciously or unconsciously. *All* writing is filtered through the self.
      *   **Status:** **Platitude.** Undeniably true at a fundamental level. Even speculative fiction refracts the author's known world.
      *   **Supports Colleague?** **No.** This is universal and doesn't preclude writing *about* anything. It merely observes that the *rendering* will be influenced by the author's lens. It demands introspection, not biographical matching.

  2.  **Epistemic Claim (Concrete Detail):**
      *   **Claim:** First-hand, embodied knowledge (sensory details, emotional textures, specific routines, cultural nuances) provides the concrete, vivid, "load-bearing" details essential for compelling, authentic-seeming fiction that avoids cliché or abstraction. Research alone may yield information but lacks the visceral weight of lived experience.
      *   **Status:** **Substantive but Defensible.** Strong evidence supports this (e.g., Chekhov's medical details, Orwell's poverty descriptions). However, it's a *spectrum* (some details matter more than others) and *research + deep empathy* can sometimes approximate this density ("proxy familiarity"). It's a counsel for *depth*, not a veto.
      *   **Supports Colleague?** **Partially, but misapplied.** This could *inform* feedback ("Your descriptions of mathematical work feel abstract; research daily routines, sensory experiences in labs, period-specific anxieties"). It **does not** inherently close down the project. It mandates **more/better research and imaginative immersion**, not biographical congruence. The colleague skipped the "how to bridge the gap" step.

  3.  **Normative Claim (Decisive Reason):**
      *   **Claim (Strong Normative):** A writer has a decisive, overriding reason *only* to write about subjects where they possess significant first-hand, biographical experience. Writing outside this domain is fundamentally flawed, inauthentic, or ethically suspect.
      *   **Status:** **Straightforwardly False.** This would obliterate historical fiction, fantasy, sci-fi, and most literary fiction exploring perspectives beyond the author's immediate identity. It confuses *one source* of authenticity (lived detail) with its *only possible source*. Motivation, skill, research, and imagination matter profoundly.
      *   **Supports Colleague?** **Yes, explicitly.** This is the reading your colleague invoked: "Not a mathematician? Not German? Therefore *cannot/should not* write this." This is the core of the dispute.

  ### II. The Normative Claim & Reasons (Williams & Critics)
  The Strong Normative Claim hinges on the nature of reasons. Let's apply Bernard Williams' framework:

  *   **Williams' Internal Reasons:** A reason for an agent (the writer) to φ (write about X) must be grounded in that agent's "motivational set" (S)—their existing desires, commitments, projects, etc. There are **no external reasons**.
      *   **Application:** "Write what you know" provides a reason *only if* the writer already has a desire/commitment within S that is served by doing so (e.g., a desire for autobiographical authenticity, ease of access to detail, exploring personal trauma). If the writer's S contains a strong desire to write about Göttingen 1913 *despite* lacking first-hand knowledge, then "write what you know" provides **no internal reason *against* it**, and may even conflict with their internal reasons *for* writing it (intellectual fascination, artistic challenge, exploring abstract ideas).
      *   **Verdict:** Under internalism, the Strong Normative Claim ("decisive reason *only* to write what you know") **fails** for writers whose S prioritizes other values (imagination, research, exploring the unfamiliar). The injunction becomes merely conditional: "*If* you want ease/visceral certainty, write what you know."

  *   **Critics of Williams (External Reasons):** Some philosophers argue reasons can exist independently of an agent's S. Perhaps reasons arise from objective values, moral truths, or the nature of the activity itself.
      *   **Possible Externalist Arguments for "Write What You Know":**
          *   **Epistemic Value:** Writing *requires* authentic concrete detail (Claim 2). Therefore, knowledge *of the specific subject* provides an external reason to write about *it* to achieve good writing.
          *   **Ethical Value (Representation):** Writing outside one's direct experience risks harmful misrepresentation or appropriation. Knowledge (interpreted broadly as deep, respectful understanding) provides an external reason to write about something *only* if one possesses it, perhaps even imposing a duty *not* to write without it.
      *   **Assessment:**
          *   **Epistemic Externalism:** Overreaches. While concrete detail *is* valuable, it is not the *only* value (intellectual depth, imaginative scope, narrative power matter too), nor is first-hand knowledge the *only* way to achieve sufficient detail (research + empathy *can* work, especially for historical/intellectual subjects). This doesn't yield a "decisive reason *only*" to write the known.
          *   **Ethical Externalism:** Highly context-dependent and contested. While sensitivity is crucial, applying a blanket veto based solely on identity/biography is reductive. A diligent, humble, well-researched outsider *can* sometimes write respectfully about another's experience (e.g., Hilary Mantel). Conversely, biographical identity doesn't guarantee good or ethical representation. This suggests duties of *care, research, and consultation*, not an absolute external reason to *only* write the known. It certainly doesn't straightforwardly apply to a novel about a *1913 German mathematician* in a way that mandates biographical matching.

  ### III. Verdict on Your Colleague's Use

  *   **The Claim Invoked:** Your colleague unequivocally invoked the **Strong Normative Claim** ("decisive reason *only* to write what you know"), interpreted through a crude lens of biographical identity ("not a mathematician, not German").
  *   **Support for this Use:**
      *   **None** from the Descriptive Claim (Platitude).
      *   **Misapplied and Insufficient** from the Epistemic Claim. It identifies a potential challenge (achieving concrete detail) but provides no argument why this challenge *cannot* be met through research/empathy/imagination, especially for a subject like historical academia where intellectual passion and rigorous study *can* yield profound "proxy familiarity." It counsels effort, not prohibition.
      *   **Theoretical but Flawed Support** only from a highly contested interpretation of External Reasons (likely the Epistemic variant), which itself crumbles under scrutiny. Even if external reasons exist, they do not straightforwardly mandate *biographical matching* as the *only* valid form of "knowledge" or the *only* permissible path. The Ethical variant is even less applicable here.
  *   **Williams' Internalism Undermines It:** The student likely *had* internal reasons to write this novel (intellectual curiosity, passion for the period, artistic drive). The colleague's injunction, based on an external demand for biographical knowledge, failed to connect to *her* motivational set and therefore provided *her* with no genuine reason to abandon her project. It was an external demand misrepresented as a decisive reason.

  ### Conclusion

  "Write what you know" is only defensible and useful as:
  1.  A **Descriptive Platitude** (acknowledging the self as filter).
  2.  A **Substantive Epistemic Counsel** (prioritizing concrete detail, highlighting the *value* of lived experience as a source, and flagging the *challenge* of writing beyond it, necessitating rigorous research, immersive imagination, and seeking diverse input).

  Your colleague weaponized the slogan into the **False Strong Normative Claim**, grounded in a crude biographical essentialism. This misuse:
  *   **Is Philosophically Unsound:** It ignores the validity of internal reasons (the student's motivation), misapplies epistemic concerns (research *can* bridge the gap), and relies on untenable externalist arguments.
  *   **Is Pedagogically Harmful:** It stifles ambition, discourages research, elevates identity over skill and effort, and replaces constructive guidance ("how to research effectively," "how to imagine deeply") with a categorical veto.
  *   **Misreads the Injunction:** It confuses "knowledge" with "biography." Knowledge can be acquired; biography is fixed. The student's task was to *acquire knowledge* of mathematics and 1913 Göttingen, not *be* a mathematician born in 1913 Germany.

  When refereeing, reject the Strong Normative interpretation. Uphold the Epistemic interpretation *as a challenge to be met*, not a barrier to entry. Advise the student on research methodologies, sources for period detail, mathematical biographies, and techniques for rendering intellectual passion concretely. The slogan's valid core is about the *texture* and *authority* of the writing, not the author's CV.
