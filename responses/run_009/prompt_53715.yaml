  ### **The Quiz: What’s Underneath Your Free Will Beliefs?**
  *Answer based on your immediate intuition—no philosophy degree needed.*

  1. **Replay Test**  
     *Imagine an agent, Alice, commits a crime. We rewind the universe to the exact starting conditions (same past, same laws of physics) and replay it. Alice commits the crime again. Is there any sense in which she "could have done otherwise" that affects whether she deserves suffering?*  
     A) No—identical conditions mean identical outcomes. "Could have" is irrelevant to desert.  
     B) Yes—she had the *capacity* to do otherwise, even if she didn’t. That capacity matters.  
     C) The question is flawed—desert isn’t about hypothetical alternatives.  

  2. **Suffering’s Purpose**  
     *Bob commits a crime. Should he experience suffering for it?*  
     A) Yes—he intrinsically *deserves* suffering for its own sake, as a fitting response to his action.  
     B) Only if it serves a purpose: e.g., deterrence, rehabilitation, or protection. Never intrinsically.  
     C) No—suffering is always unjust. We should prevent harm, not inflict it for "desert."  

  3. **Luck Swap**  
     *Charlie and Dave have identical genes/upbringings. Both try to commit the same crime, but Charlie succeeds (due to random luck) while Dave fails (also due to luck). Does either deserve more blame or suffering?*  
     A) Charlie deserves more—he caused harm. Outcomes matter.  
     B) Neither deserves more—their intent and capacities were identical; luck changes nothing about desert.  
     C) Neither deserves *any* blame—both were products of causes beyond their control.  

  4. **Tumor Threshold**  
     *Ed commits violence due to a brain tumor. Doctors gradually shrink it. At what point does he "deserve" full blame?*  
     A) Only once the tumor is *fully gone* and he’s "back to normal." Past acts with the tumor don’t count.  
     B) Desert depends on his capacities *at the time of the act*. If he could understand morality (even with the tumor), he deserves blame.  
     C) Never—the tumor proves his actions were caused by factors outside his control.  

  5. **Guilt’s Role**  
     *After wrongdoing, a person feels guilty. Is this guilt appropriate?*  
     A) Yes—feeling guilty is intrinsically deserved; it’s part of "paying" for the act.  
     B) Only if it leads to good outcomes (e.g., self-improvement). Otherwise, it’s pointless.  
     C) No—guilt presumes false responsibility. We should focus on fixing behavior, not feelings.  

  6. **Determinism vs. Randomness**  
     *Universe A is 100% deterministic (all events fixed by past/laws). Universe B has true randomness (e.g., quantum dice rolls). Which universe allows for moral responsibility?*  
     A) Only B—randomness creates genuine alternative possibilities.  
     B) Both—responsibility is compatible with determinism *and* randomness doesn’t help.  
     C) Neither—determinism prevents control, and randomness just adds chaos.  

  7. **Moral Luck (Driver Case)**  
     *Two equally reckless drivers run red lights. Driver 1 kills a pedestrian; Driver 2 hits no one (sheer luck). Should Driver 1 face more blame/punishment?*  
     A) Yes—worse outcomes deserve harsher responses.  
     B) No—blame should be equal. Luck doesn’t change moral responsibility.  
     C) Neither deserves blame—both were determined to act recklessly.  

  8. **Ultimate Origins**  
     *If all of an agent’s choices trace back to causes before their birth (genes, upbringing, etc.), can they be morally responsible?*  
     A) No—without self-creation, responsibility is impossible.  
     B) Yes—responsibility depends on current capacities, not ultimate origins.  
     C) Only partially—their control is diminished, so desert is weaker.  

