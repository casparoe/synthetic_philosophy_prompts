  ### **Scoring Key**
  Compare your answers to the tables below. Your position is the one where your answers **match most closely**. Ties indicate ambiguity (e.g., between revisionism and compatibilism). Positions are defined as:  
  - **Dennett-style compatibilism**: Desert exists based on capacities/reasons-responsiveness. "Could have done otherwise" is about abilities, not indeterminism. Suffering can be deserved but isn’t retributive-for-its-own-sake.  
  - **Caruso-style skepticism**: No free will or desert. Responsibility is replaced with forward-looking practices (e.g., "quarantine" for safety).  
  - **Libertarian free will**: Requires indeterminism and "could have done otherwise." Strong desert/retribution is intrinsic.  
  - **Revisionist desert**: Compatibilist-like but desert is dramatically reduced (e.g., luck or etiology weakens blame).  

