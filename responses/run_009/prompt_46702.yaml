prompt: |-
  A friend of mine serves on hiring committees at a mid-sized software company, and we recently got into a debate about how they make decisions. Each candidate is interviewed by a panel, and every interviewer separately files a hire / no-hire recommendation; the candidate receives an offer only if a majority recommends hiring. My friend is enthusiastic about this procedure. She says she once read about a result going back to the eighteenth century concerning collective voting: if each member of a group is more likely to be right than wrong about some question, and the members form their opinions independently of one another, then a majority vote among them is more reliable than any single member, and the reliability climbs toward certainty as the group grows. She takes this to show that the panel system is not just better than any individual interviewer but increasingly trustworthy the more interviewers are added, and she has been pushing the company to enlarge its panels from five to nine members on that basis.

  Something about her confidence bothers me, though I've had trouble pinning down exactly what. The interviewers aren't strangers reasoning from scratch: they all read the same packet of materials about the candidate, they were trained on the same evaluation rubric by the same person, several went through the same graduate program and share similar tastes, and they've sat on many panels together, so over the years they've converged on shared views about what a strong hire looks like. When one of them misjudges a candidate — say, by overweighting enthusiasm and polish — it seems plausible the others make the same mistake for the same underlying reason. The company has also had cases where the panel was unanimous and confident, yet the hire turned out badly, which my friend dismisses as bad luck.

  I'd appreciate your assessment of the situation. Is my friend's appeal to the mathematical result sound as applied to her committee, or is there a hidden assumption her setup fails to satisfy? If the assumption fails, what follows — is majority voting among partially like-minded judges worthless, still an improvement over a single judge, or does it depend on quantitative details? And is there anything the committee could change in how it elicits and aggregates the individual judgments that would get closer to whatever the result actually requires? I'm not looking for platitudes about the value of diversity; I want to understand precisely where the mathematics stops applying, and what, if anything, can be done about that.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're describing a debate with their friend about the reliability of majority voting in hiring panels. The friend cites an 18th-century mathematical result (Condorcet Jury Theorem) to argue that larger panels improve decision accuracy. The user is skeptical because the interviewers aren't independent—they share training, materials, and experiences, which might make their judgments correlated.

  First, I need to recall the Condorcet Jury Theorem (CJT). It states that if each voter has a probability greater than 0.5 of being correct and votes independently, then majority voting becomes more reliable as the group size increases. The user's concern is about the independence assumption. Their description shows that interviewers have overlapping backgrounds, training, and shared materials, which likely introduces correlation in their errors. 

  The user mentions instances where unanimous decisions still led to bad hires. This suggests that when one person makes a mistake due to a shared bias, others are likely to follow. That's a classic case of correlated errors undermining CJT. So the key issue here is whether the independence condition holds. 

  Next, I should consider the implications of correlated errors. If interviewers' judgments are positively correlated, the group's effective size is smaller than the actual number. Even with nine members, if they think alike, it's as if only a few independent voters exist. This reduces the benefit of increasing panel size. 

  The user wants to know if majority voting is still better than a single judge. With correlation, it might still be an improvement, but the gains diminish. They also ask about alternatives. Techniques like Delphi method or modified voting might help, but they need practical solutions. 

  I need to address the user's deeper needs. They're not just looking for a math lesson; they want actionable advice for their friend's company. They mentioned avoiding platitudes about diversity, so focusing on structural changes like diverse training or independent assessments would be better. 

  Also, the user might be concerned about resource allocation. Adding more interviewers without improving independence wastes time. The company should optimize existing processes rather than expand panels. 

  Quantitative details matter. If the correlation can be measured, they could model the effective group size. But in practice, that's tough. Emphasizing mitigation strategies like secret ballots or varied rubrics might be more feasible. 

  Finally, summarizing the key points: CJT's assumptions are violated due to correlation, so expanding panels won't help much. Instead, focus on reducing correlation through process changes. Majority voting is still better than one person, but there are diminishing returns. Practical steps include diverse training and independent evaluations.
answer: |-
  Your skepticism is well-founded. The mathematical result your friend cites is the **Condorcet Jury Theorem (CJT)**, and its core assumptions are **severely violated** in her committee setup. This significantly undermines her argument for increasing panel size. Let's break it down:

  1.  **The Core Problem: Violation of Independence**
      *   **CJT Assumption:** Voters/judges form their opinions *independently* of each other.
      *   **Committee Reality:** Interviewers share extensive common ground:
          *   **Shared Information:** Same candidate packet.
          *   **Shared Training:** Same rubric, same trainer.
          *   **Shared Background:** Similar education, professional experiences.
          *   **Shared History:** Repeated interactions, convergence on "what good looks like."
      *   **Consequence:** Their judgments are **positively correlated**, especially their *errors*. If one overvalues polish due to shared training or biases, others are highly likely to do the same. They are *not* reasoning independently from scratch. This shared context creates systemic bias.

  2.  **Why This Violation Matters:**
      *   **Diminishing Returns of Size:** CJT's promise of rapidly increasing reliability with group size relies critically on independence. With positive correlation, adding more members who share the same biases and information provides *much less* new, independent information than CJT assumes. The "effective" number of independent judges is far smaller than the actual number (e.g., 5 correlated judges might behave like 2-3 independent ones).
      *   **Susceptibility to Systemic Error:** Correlated errors mean the entire group can be confidently wrong for the same underlying reason (e.g., overvaluing polish, undervaluing niche skills, shared cultural bias). The unanimous bad hires your friend dismisses as "bad luck" are likely *symptoms* of this systemic error, not statistical flukes. Adding more correlated judges won't fix this systemic flaw; it might amplify it.
      *   **Failure to Approach Certainty:** With correlated errors, the probability of a correct majority vote *does not* approach 1 as the group size increases. It plateaus at a level determined by the strength of the underlying shared bias and the correlation strength.
      *   **Potentially Worse Than Expected:** While often still better than a single judge (if individual competence > 0.5), the reliability gain from majority voting with correlated judges is significantly *less* than CJT predicts for the same number of independent judges. In extreme cases of very high correlation and strong shared bias, majority voting could even perform worse than a single (unusually insightful) judge, though this is less common.

  3.  **Assessment of Majority Voting in This Setup:**
      *   **Not Worthless:** Majority voting with correlated judges is likely *still better than relying on a single judge* (assuming individual competence p > 0.5). It provides some averaging and reduces the impact of truly idiosyncratic mistakes or extreme outliers.
      *   **Not an "Increasingly Trustworthy" Panacea:** Crucially, it is **NOT** "increasingly trustworthy" in the strong sense promised by CJT as the panel grows *if new members share the same correlated perspective*. Adding more judges from the same pool provides minimal new independent signal and offers rapidly diminishing returns. Moving from 5 to 9 correlated judges offers far less reliability gain than CJT would naively suggest.
      *   **Depends on Quantitative Details:** The actual performance hinges on:
          *   Individual competence (`p` - probability a single judge is correct).
          *   Strength of correlation between judgments (often denoted `ρ`).
          *   Strength and nature of the shared systemic bias.
          Measuring these precisely is difficult, but qualitatively, high correlation and strong shared bias severely limit the benefits of majority voting and large panels.

  4.  **What Can Be Done? Moving Closer to CJT's Requirements:**

      The goal isn't perfect independence (impossible), but *reducing unnecessary correlation* and *introducing diverse, independent signals*. Forget platitudes; focus on process:

      *   **Diversify Information Exposure (Crucial):** Instead of identical packets, assign different interviewers to focus on *different, complementary aspects* using *different materials*:
          *   One focuses on core technical skills via a coding exercise *they design*.
          *   One focuses on system design/architecture using a different scenario.
          *   One focuses on collaboration/communication via behavioral questions about past *non-standard* projects.
          *   One reviews a specific, non-standard sample of the candidate's prior work (e.g., an open-source contribution, a writing sample).
          *   *Mechanism:* This creates partially independent information streams.
      *   **Structured, Independent Deliberation:** Use techniques *before* the final vote to surface diverse views without undue influence:
          *   **Secret Ballots First:** Have interviewers submit their initial Hire/No-Hire recommendation *in writing, confidentially, before any group discussion*. This captures independent judgment before social influence.
          *   **Delphi Method (Light):** Collect anonymous initial recommendations and reasoning summaries. Share the *anonymous* range of views and reasoning (without names or counts) with the group. Allow interviewers to privately revise their judgments based on seeing *reasons* (not just who said what), then take a final vote.
          *   **"Devil's Advocate" Rotation:** Formally assign someone *in advance* to argue against the emerging consensus during discussion, regardless of their initial view.
      *   **Calibration & Rubric Refinement (Addressing Bias):** Systematically collect data on interview predictions vs. actual hire performance. Analyze where unanimous panels went wrong. *Use this data to refine the rubric and training* to mitigate identified shared biases (e.g., if polished candidates consistently underperform, de-emphasize polish in training). This tackles the systemic error `p < 0.5` risk.
      *   **Focus on Prediction, Not Just Evaluation:** Train interviewers to think probabilistically ("What's my estimated probability this candidate will be successful?") rather than just binary Hire/No-Hire. Aggregating probabilities (averaging) can be more efficient and robust to certain dependencies than majority voting on binary decisions.
      *   **Hire/No-Hire with Confidence:** Instead of a simple binary vote, have interviewers provide:
          *   Hire/No-Hire vote.
          *   Confidence level (e.g., High/Medium/Low).
          Rules could then be: Majority vote wins, *unless* dissenters have High Confidence, triggering additional review. This weights stronger convictions.

  5.  **Conclusion:**
      *   **Friend's Argument is Unsound:** Her direct application of the Condorcet Jury Theorem is invalid because the **critical assumption of voter independence is violated** by the shared context, training, information, and history of the interviewers. Their errors are correlated.
      *   **Consequence:** Increasing the panel size from 5 to 9 *under the current system* is unlikely to yield the significant reliability gains promised by CJT and may be an inefficient use of resources. The reliability plateaus due to correlation.
      *   **Majority Voting Still Useful, But Limited:** Majority voting likely still outperforms a single judge but offers diminishing returns and remains vulnerable to systemic errors shared by the group.
      *   **Path Forward:** To genuinely improve reliability:
          *   **Reduce Correlation:** Introduce *independent information sources* and *structured deliberation techniques* (like secret ballots or Delphi) to capture diverse perspectives before consensus forms.
          *   **Mitigate Systemic Bias:** Use data on past interview/hire performance to identify and correct shared biases in the rubric and training.
          *   **Consider Alternative Aggregation:** Probabilistic judgments or incorporating confidence levels might be more robust than simple binary majority votes in this correlated environment.

  The key isn't just adding *more* judges; it's ensuring that the judges add *more independent information and perspectives*. The mathematics stops applying cleanly at the point where independence fails, and the solution lies in process changes designed to inject greater *de facto* independence and diversity of perspective into the judgments being aggregated.
