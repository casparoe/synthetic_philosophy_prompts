answer: |-
  Below is a decision tree flowchart addressing the complexities of defining death, based on your specified cases and positions. Each question uses concrete scenarios (no jargon) to guide classmates to an underlying philosophical position without revealing labels upfront. The tree starts with universally agreed cases and branches into gray areas.

  ---

  **Death Definition Decision Tree**  
  *(Circle your answers and follow the path)*

  ### START: "A person's heart and breathing stop permanently (no intervention, no restart). Everyone agrees they're dead. Where does death start getting complicated?"

  1. **A brain-dead person (no brain function) is on a ventilator (heart beats, body warm). Is this person dead?**  
     - **YES** → Go to Q2  
     - **NO** → Go to Q5  

  2. **A permanently unconscious person (e.g., PVS) breathes on their own but has no awareness. Are they dead?**  
     - **YES** → **Position: Higher Brain/Personhood Death**  
       *Death occurs when consciousness and identity are permanently lost, regardless of bodily functions.*  
     - **NO** → Go to Q3  

  3. **A brain-dead pregnant woman is kept on machines for weeks to deliver the baby. During this time, is she dead?**  
     - **YES** → **Position: Whole Brain Death**  
       *Death occurs when all brain function stops, even if machines keep the body "alive."*  
     - **NO** → **Position: Social/Legal Construct**  
       *Death isn't just biological—it's shaped by social needs (e.g., saving a baby).*  

  4. **An organ donor’s heart stops. Doctors wait 2 minutes (no restart planned) and declare death. Is this valid?**  
     - **YES** → **Position: Pragmatic View**  
       *Death is declared when functions stop permanently (we won’t restart), even if reversal is theoretically possible.*  
     - **NO** → Go to Q6  

  5. **A person’s heart stops, but doctors could restart it (e.g., with CPR). Are they dead the moment it stops?**  
     - **YES** → **Position: Traditional Heart/Lungs View**  
       *Death occurs when heartbeat and breathing cease, period.*  
     - **NO** → Go to Q4  

  6. **A baby is born without most of its brain (anencephaly), but has a heartbeat and breathes. Is this baby dead?**  
     - **YES** → **Position: Higher Brain/Personhood Death**  
       *Without the capacity for consciousness, the "person" is gone, even with biological signs.*  
     - **NO** → Go to Q7  

  7. **Is death a single, biological moment—or a process we define for practical reasons?**  
     - **SINGLE MOMENT** → **Inconsistent/Undefined View**  
       *Your answers reject all standard criteria. Few defend this—it’s hard to apply in real cases (e.g., organ donation).*  
     - **PROCESS/PRACTICAL DEFINITION** → **Position: Social/Legal Construct**  
       *Death isn’t a fixed fact; we choose definitions for ethics, law, or medicine (e.g., organ waiting periods).*  

  ---

  ### Key to Positions:
  - **Traditional Heart/Lungs View**: Death = irreversible cardio-respiratory failure.  
  - **Whole Brain Death**: Death = irreversible loss of *all* brain function (clinical/legal standard in most countries).  
  - **Higher Brain/Personhood Death**: Death = irreversible loss of consciousness/identity (brainstem function irrelevant).  
  - **Pragmatic View**: Death = cessation that’s *permanent* (no intent to revive), not necessarily irreversible.  
  - **Social/Legal Construct**: Death reflects societal needs (e.g., pregnancy, organ donation) as much as biology.  

  ### How Cases Map to Branches:
  - **Pregnant woman** → Tests consistency of brain death (Q3).  
  - **Organ donor (2-minute rule)** → Challenges irreversibility vs. permanence (Q4).  
  - **PVS patient** → Explores consciousness vs. biology (Q2).  
  - **Anencephalic baby** → Probes personhood vs. biological life (Q6).  
  - **Process question** → Addresses the core ambiguity (Q7).  

  ### Design Notes:
  - **Inconsistencies**:  
    - If you reject brain death (Q1) but accept higher brain death (Q6), the tree flags inconsistency (no coherent position).  
    - Rejecting *all* operational criteria (e.g., answering "NO" to organ donor death and brain death) leads to Q7’s "single moment" dead end—a fringe view with no real-world application.  
  - **Simplifications**:  
    - "Pragmatic" and "Social/Legal" sometimes overlap (e.g., organ donation uses both). The tree separates them by intent: *pragmatism* prioritizes medical efficiency, while *social* factors include ethics/culture.  
    - Language avoids technical terms (e.g., "permanent vegetative state" becomes "permanently unconscious person").  

  ### How to Use:
  1. Hand out copies and have classmates work through individually.  
  2. Regroup to discuss why paths diverged (e.g., "Who thought the pregnant woman wasn’t dead? Why?").  
  3. Reveal positions at the end to spark debate on real-world impacts (e.g., "The pragmatic view allows ~2,000 more organ transplants yearly").  

  This tree captures nuance without requiring philosophy background—ideal for a high school capstone! Let me know if you need a visual flowchart version.
