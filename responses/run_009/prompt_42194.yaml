tually does fix them; (3) your credence that the cube-factory case shows underspecification runs all the way down, i.e. that even a very detailed physical setup won't always pin down a measure, so no patch can be general; (4) your overall credence in the proposition, with a rough sketch of how the first three numbers combine into it; (5) which of the earlier items your overall number is most sensitive to, and what argument or worked example would move that number the most. And if you think my friend and I are arguing past each other -- like, that he's really answering "can indifference be fixed for well-posed problems" while I'm answering "are the interesting problems ever well-posed" -- say so in item 5. don't hedge into "philosophers disagree," give me numbers.
