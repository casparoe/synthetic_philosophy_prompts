prompt: |-
  I run the defaults review at a mid-sized company that administers benefits and retirement plans for other employers — so I sign off on things like enrollment defaults, pre-checked boxes, the order options appear in, the wording of prompts. We ship changes maybe six times a quarter and each one touches a few hundred thousand peoples' money, so the stakes are real, but the actual decision happens in a one-hour call with me, a lawyer, and a designer, and none of us has any philosophy training. Right now the defacto rule is "don't do anything that would look bad in a screenshot," which I hate.

  I want an actual decision procedure the team can run on a proposal during that call. Ground it in what the paternalism/nudging literature actually cares about — the difference between steering people toward their own ends vs. toward ends we picked for them, hard vs. soft paternalism, whether a nudge works through the person's deliberation or around it, transparency, how costly the opt-out is — but translated into plain questions a non-philosopher can answer in a few minutes each. For every question, say what counts as a good enough answer, where a weak answer means "no" or "send it back for redesign," and, crucially, where the procedure has to stop and hand it back to a human because the question is one of values that a checklist can't settle. It should also include a step I've been muddling through on my own: a "would they thank us later" test, where you imagine the person finding out a year later exactly how they were steered — and be honest about where that test misfires, since people thank you for stuff that was bad for them all the time.

  Then run the procedure on three real-ish cases from our backlog: (1) auto-enrolling new employees into the 401k at 6% with a one-click opt-out; (2) pre-checking a box that adds a paid legal-services perk onto the enrollment form, where unchecking it requires calling a phone number; (3) defaulting everyone's cafeteria-plan contributions into the employer's own fund option instead of a broad index fund, because the employer gets a share of the fees — the wrinkle being that the employer's fund has actually performed slightly better over the last three years. I expect the procedure to come back with a no on that last one and I want to see whether it does, because that's the case where our sales team will push back hardest, and also the case where I genuinely waver.

  Finally, tell me what the procedure can't do: the kinds of cases it will get wrong, and where it just launders our value judgments into official-sounding steps. When you're done, say how confident you are in each part of what you built, and single out the piece you're least sure of.
reasoning: |-
  We are creating a decision procedure grounded in the nudging/paternalism literature, specifically focusing on:
  - Steering towards the individual's own ends vs. the choice architect's ends
  - Hard vs. soft paternalism
  - Whether the nudge works through or around deliberation
  - Transparency
  - Cost of opt-out

  The procedure will be a checklist of plain-language questions that can be answered in a few minutes each. For each question, we specify:
  - What counts as a "good enough" answer (proceed)
  - What counts as a weak answer (reject or send back for redesign)
  - When the question is a value judgment that must be handed back to a human

  We also include the "would they thank us later" test, with a note on its limitations.

  Then we apply the procedure to the three cases.

  Finally, we discuss the limitations of the procedure.

  ---

  **Decision Procedure: Nudge Review Checklist**

  1. **Whose Goals?**
     - *Question:* Is the nudge designed to help the person achieve what they would likely want for themselves, based on evidence about their typical goals? (e.g., saving enough for retirement, having emergency savings, avoiding preventable health issues)
     - *Good enough:* Yes, and we have evidence (e.g., surveys, behavioral data) that this goal is widely shared by our participants. OR: Yes, and it's a basic health/safety/financial security goal that is nearly universal.
     - *Weak:* We don't have evidence of participant goals, OR the goal primarily serves the employer/plan sponsor/vendor. 
     - *Value judgment stop:* If the goal is not universal, and we lack evidence, but we have strong reason to believe it's in their interest (e.g., saving more for retirement) — then we must pause and explicitly discuss whether we are imposing our values. If we proceed, document the rationale.

  2. **Hard or Soft?**
     - *Question:* Does the nudge preserve freedom of choice? (i.e., opting out is possible without significant cost, and the default is reversible)
     - *Good enough:* Opt-out is easy (e.g., one click, one phone call without long hold times) and clearly explained. No financial or time penalties for opting out.
     - *Weak:* Opt-out is difficult (e.g., requires paperwork, multiple steps, long wait times) or has costs (e.g., fees, delays).
     - *Value judgment stop:* If the opt-out cost is moderate (e.g., a phone call that might take 10 minutes) and the benefit is high (e.g., preventing a serious health risk), then we must weigh the trade-off. Document.

  3. **Deliberation Bypass?**
     - *Question:* Does the nudge work by making the better choice easier, without shutting down the person's ability to think it through? (Transparency and engagement)
     - *Good enough:* The nudge is transparent (e.g., the default is clearly labeled as a default, and the person is informed of alternatives) and the design encourages reflection where appropriate (e.g., by presenting key facts at the point of decision).
     - *Weak:* The nudge hides information (e.g., the default is not disclosed, or alternatives are buried) or uses pressure tactics (e.g., countdown timers, misleading scarcity) to prevent reflection.
     - *Value judgment stop:* None — transparency is non-negotiable. Weak answer means reject/redesign.

  4. **Cost of Opt-Out**
     - *Question:* How much time, effort, or money does it take to opt out? (Quantify if possible: e.g., "less than 2 minutes," "no fees.")
     - *Good enough:* Low cost: e.g., one click, one short phone call (<5 min), no fees. The cost is proportional to the stakes (e.g., higher stakes might tolerate slightly higher opt-out cost, but still minimal).
     - *Weak:* High cost: e.g., requires mailing forms, multiple calls, fees, or significant time (>10 min). Disproportionate to the stakes.
     - *Value judgment stop:* If the cost is moderate (e.g., a 5-10 min phone call for a high-stakes decision) and the benefit is clear, we may accept it — but must document the rationale and consider redesign to lower the barrier.

  5. **Transparency Test**
     - *Question:* If the person were to ask "why was this set up this way?", could we give an honest answer that they would accept? (e.g., "We set the default to 6% because most people need to save at least that much to get the full employer match and build retirement security.")
     - *Good enough:* Yes, and the explanation is straightforward and defensible. We would be comfortable explaining it in a public forum.
     - *Weak:* The explanation would sound self-serving, evasive, or manipulative (e.g., "We set it to our fund because we get fees").
     - *Value judgment stop:* None. Weak answer means reject/redesign.

  6. **"Thank You Later" Test**
     - *Question:* If the person discovered a year later exactly how they were steered, would they likely feel grateful? (Imagine them saying, "I'm glad they set it up that way.")
     - *Good enough:* Yes, because it helped them avoid a common error (e.g., undersaving) and they are better off. OR: They might be neutral, but not angry.
     - *Weak:* They would feel tricked or resentful, especially if they suffered a harm (e.g., high fees, a service they didn't need).
     - *Caveats:* Note that people sometimes thank you for harmful things (e.g., a high-risk investment that paid off) or resent helpful ones (e.g., auto-saving when they wanted cash). So use this as one factor, not the only one. Also, consider if the nudge would be defensible even if the outcome was bad (e.g., "We set a prudent default, but markets went down").
     - *Value judgment stop:* If it's ambiguous (e.g., the nudge is helpful but slightly self-serving), we must discuss and document.

  **Procedure Flow:**
  - Answer each question in order.
  - If any question gets a "weak" answer, the proposal is rejected or sent back for redesign (unless it's a value judgment stop, in which case the human team must discuss and decide).
  - For value judgment stops, the team must explicitly state their rationale and document it.
  - If all questions are "good enough," the nudge is approved.

  ---

  **Applying the Procedure to the Cases**

  **Case 1: Auto-enrolling new employees into the 401k at 6% with a one-click opt-out**

  1. **Whose Goals?** 
     - *Answer:* Helps people save for retirement, a nearly universal goal. Evidence shows undersaving is common, and 6% is often the threshold for full employer match. 
     - *Verdict:* Good enough.

  2. **Hard or Soft?** 
     - *Answer:* One-click opt-out preserves freedom. No cost to opt-out. 
     - *Verdict:* Good enough.

  3. **Deliberation Bypass?** 
     - *Answer:* Auto-enrollment is transparent (usually disclosed in enrollment materials). The design should present key facts (e.g., "You're enrolled at 6%; click here to change"). 
     - *Verdict:* Good enough (assuming transparency).

  4. **Cost of Opt-Out** 
     - *Answer:* One click — very low cost. 
     - *Verdict:* Good enough.

  5. **Transparency Test** 
     - *Answer:* "We set 6% as the default so you don't miss out on the full employer match and start saving for retirement right away." Honest and defensible. 
     - *Verdict:* Good enough.

  6. **"Thank You Later" Test** 
     - *Answer:* Most people would be grateful they started saving early. Even if markets drop, the default was prudent. 
     - *Verdict:* Good enough.

  **Overall:** Approved.

  ---

  **Case 2: Pre-checking a box for a paid legal-services perk, where unchecking requires calling a phone number**

  1. **Whose Goals?** 
     - *Answer:* Legal services are not a universal need (unlike retirement savings). Some may want it, but it's not a core financial security goal. No evidence provided that most employees want this. 
     - *Verdict:* Weak (leans toward employer/vendor interest in selling the perk). 

  2. **Hard or Soft?** 
     - *Answer:* Opt-out requires a phone call, which is a barrier (time, inconvenience). 
     - *Verdict:* Weak (unless the call is very short and easy, but still more friction than one-click).

  3. **Deliberation Bypass?** 
     - *Answer:* Pre-checked boxes can be opaque if not highlighted. But the main issue is the opt-out cost. 
     - *Verdict:* Potentially weak if not transparent.

  4. **Cost of Opt-Out** 
     - *Answer:* Phone call — moderate cost (time, effort). Disproportionate for an optional perk. 
     - *Verdict:* Weak.

  5. **Transparency Test** 
     - *Answer:* "We pre-checked it to make it easier to sign up" — but the phone call opt-out suggests it's about enrollment numbers. Might not sound honest. 
     - *Verdict:* Weak.

  6. **"Thank You Later" Test** 
     - *Answer:* If they didn't use the service and paid for it, they might resent it. If they used it, they might thank, but the friction in opting out is likely to cause resentment. 
     - *Verdict:* Weak.

  **Overall:** Reject. Send back for redesign (e.g., make opt-out as easy as opt-in, or don't pre-check).

  ---

  **Case 3: Defaulting everyone into the employer's own fund (with higher fees, but better recent performance) instead of a broad index fund**

  1. **Whose Goals?** 
     - *Answer:* The employer's goal (earning fees) conflicts with the participant's goal (maximizing net returns). Even with better recent performance, the higher fees may erode returns long-term. Evidence shows most investors benefit from low-cost index funds. 
     - *Verdict:* Weak (serves employer interest).

  2. **Hard or Soft?** 
     - *Answer:* Assuming opt-out is easy (e.g., one click to switch funds), freedom is preserved. 
     - *Verdict:* Good enough (if opt-out is easy).

  3. **Deliberation Bypass?** 
     - *Answer:* Must be transparent that it's the employer's fund and fees are higher. If buried, weak. 
     - *Verdict:* Conditional on transparency — if not clear, weak.

  4. **Cost of Opt-Out** 
     - *Answer:* If switching is easy (one click), low cost. 
     - *Verdict:* Good enough.

  5. **Transparency Test** 
     - *Answer:* "We defaulted you to our fund because it's performed well recently and we operate it" — but must also disclose the fee-sharing. If disclosed, it's honest but self-serving. Might not pass the "public forum" test. 
     - *Verdict:* Weak (because the primary motive is employer gain, not participant benefit).

  6. **"Thank You Later" Test** 
     - *Answer:* If the fund underperforms, they'll resent it. If it outperforms, they might thank, but the higher fees could still hurt them. Many would feel manipulated if they learned about the fee-sharing. 
     - *Verdict:* Weak.

  **Overall:** 
  - Multiple weak answers (especially #1 and #5). 
  - Even with easy opt-out, the conflict of interest and lack of alignment with participant goals makes it unacceptable. 
  - **Verdict:** Reject.

  ---

  **What the Procedure Can't Do (Limitations):**

  1. **Value Laundering:** The procedure can't eliminate value judgments. It flags them (e.g., "Whose Goals?" when evidence is thin) but ultimately, humans must decide. The checklist makes those judgments explicit and forces documentation, but it doesn't resolve them.

  2. **Edge Cases:** 
     - When a nudge has mixed motives (e.g., slight employer benefit but major participant benefit), the procedure may be too rigid.
     - When evidence on participant goals is conflicting or absent, the team must use judgment.

  3. **Unforeseen Consequences:** The procedure can't predict long-term outcomes (e.g., a fund default that backfires in a market crash). It relies on current knowledge.

  4. **"Thank You" Misfires:** As noted, people might thank you for bad nudges (e.g., a high-risk default that luckily paid off) or resent good ones. The test is subjective and outcome-dependent.

  5. **Cultural/Contextual Nuances:** The procedure assumes a standard participant profile. It might not work for specialized groups (e.g., low-income employees with different cash flow needs).

  6. **Evolving Standards:** What's acceptable today (e.g., a phone call opt-out) might be seen as unreasonable in 5 years as digital expectations change.

  **Confidence Assessment:**

  - **High confidence** in:
    - Core principles (Whose Goals?, Transparency, Cost of Opt-Out) — these are well-grounded in the literature.
    - Rejecting Cases 2 and 3 — clear conflicts of interest.

  - **Medium confidence** in:
    - The "Thank You Later" test — useful but flawed; kept it as one factor.
    - The value judgment stops — they force discussion, but might not prevent groupthink.

  - **Least sure about:**
    - **The "Deliberation Bypass" question** — it's hard to define "encourages reflection" in practice. For example, a well-designed default might not require active reflection if the goal is to overcome inertia, but that's the point of nudging. I worry it could be misinterpreted as requiring pop-up quizzes, which might backfire. I'm more confident in the transparency aspect than the "around deliberation" part. (This is the piece I'd refine with more behavioral science input.)

  **Final Note:** The procedure is a starting point. Use it to structure discussion, not replace it. Review it annually.
answer: |-
  Below is a decision procedure grounded in behavioral science and ethics literature (drawing on Thaler & Sunstein's "nudge" framework, Conly's work on paternalism, and Wilkinson's critiques). It's designed as a checklist with clear thresholds, value-judgment flags, and practical guidance. I'll first present the procedure, then apply it to your three cases, and end with limitations and confidence ratings.

  ---

  ### **Nudge Review Procedure: 6 Questions for Ethical Defaults**
  *Answer each question in sequence during your 1-hour call. Stop if any question fails.*

  1. **Whose Goal Does This Serve?**  
     *"Are we steering people toward their own typical goals, or toward goals we/others (e.g., employer, sales team) picked?"*  
     - **Good enough (Proceed)**: Evidence (e.g., surveys, past behavior) shows this aligns with what most participants want (e.g., retirement security, avoiding penalties).  
     - **Weak (Reject/Redesign)**: Serves the choice architect’s interests (e.g., profit, administrative ease) without clear participant benefit.  
     - **Value judgment needed**: If goals are ambiguous (e.g., "people should invest more aggressively")—pause to debate evidence of participant preferences.  

  2. **How "Soft" Is the Paternalism?**  
     *"Can people easily opt out if they want to?"*  
     - **Good enough**: Opt-out costs minimal effort/time (e.g., one-click, <1 minute).  
     - **Weak**: Opt-out is costly (e.g., phone calls, paperwork, delays >24 hours).  
     - **Value judgment needed**: Moderate opt-out cost (e.g., a short phone call) for high-stakes outcomes (e.g., health insurance)—discuss proportionality.  

  3. **Does This Work With or Against Deliberation?**  
     *"Does the nudge help people think clearly, or does it exploit biases to bypass reason?"*  
     - **Good enough**: Encourages reflection (e.g., clear comparisons, neutral framing). Avoids deception, urgency, or obscuring trade-offs.  
     - **Weak**: Relies on inattention/inertia (e.g., buried disclosures, pre-checked boxes for non-essential perks).  
     - **No value judgment**: Weak answers fail automatically—redesign for transparency.  

  4. **What’s the Evidence of Benefit?**  
     *"Do we have proof this improves outcomes people care about (e.g., savings, lower fees)?"*  
     - **Good enough**: Data (e.g., trials, benchmarks) shows the nudge helps participants.  
     - **Weak**: No evidence, or benefits are speculative/self-serving.  
     - **Value judgment needed**: Emerging evidence (e.g., "similar plans saw higher enrollment")—debate reliability.  

  5. **Transparency Test**  
     *"Would we comfortably explain this design in a public FAQ or regulatory filing?"*  
     - **Good enough**: Honest, simple explanation holds up (e.g., "We set 6% to maximize your employer match").  
     - **Weak**: Explanation sounds manipulative (e.g., "We defaulted to our fund to share fees").  
     - **No value judgment**: Weak answers fail—redesign for candor.  

  6. **"Thank You Later" Test**  
     *"If participants saw exactly how this was engineered a year later, would they feel grateful?"*  
     - **Good enough**: Most would appreciate the help (e.g., "Glad I saved more").  
     - **Weak**: Many would feel tricked (e.g., "I paid for a perk I didn’t need").  
     - **Value judgment + Caveats**:  
       - Discuss hypothetical reactions honestly.  
       - **Misfire warning**: People may "thank" harmful nudges (e.g., high-risk investments that luckily paid off) or resent helpful ones (e.g., auto-saving). Use only with Question 1 (goals) and 4 (evidence).  

  ---

  ### **Applying the Procedure to Your Cases**
  **Case 1: Auto-enroll into 401k at 6% with one-click opt-out**  
  1. **Whose Goal?** Good enough. Aligns with near-universal retirement goals. Evidence shows defaults boost savings.  
  2. **Soft Paternalism?** Good enough. One-click opt-out is low-cost.  
  3. **Works With Deliberation?** Good enough. Best practice to disclose default clearly (e.g., "You’re enrolled at 6%—click here to adjust").  
  4. **Evidence of Benefit?** Good enough. Strong data that auto-enrollment increases participation.  
  5. **Transparency Test?** Good enough. "We set 6% to help you capture the full employer match" is defensible.  
  6. **"Thank You Later"?** Good enough. Most would appreciate higher savings.  
  ✅ **Verdict: Approved**  

  **Case 2: Pre-checked legal perk; opt-out requires phone call**  
  1. **Whose Goal?** Weak. Legal services aren’t universally needed; benefits the vendor/employer more.  
  2. **Soft Paternalism?** Weak. Phone calls are high-friction (wait times, hassle).  
  3. **Works With Deliberation?** Weak. Pre-checked boxes exploit inertia; opt-out cost obscures choice.  
  4. **Evidence of Benefit?** Weak. No proof this improves lives vs. adding optionality.  
  → **Fails at Question 1**; no need to continue.  
  ❌ **Verdict: Reject**. Redesign with equal opt-in/opt-out ease (e.g., uncheck box on form).  

  **Case 3: Default to employer’s fund (performs better, but shares fees)**  
  1. **Whose Goal?** Weak. Serves employer’s profit motive (fee-sharing) over participant goals (low-cost investing). Three-year outperformance is noise, not evidence.  
  2. **Soft Paternalism?** Good enough. (Assuming easy fund-switching tools.)  
  3. **Works With Deliberation?** Weak. Defaulting to a higher-fee fund obscures trade-offs unless fees/conflict are highlighted.  
  4. **Evidence of Benefit?** Weak. Past performance ≠ future results; low-fee funds win long-term.  
  5. **Transparency Test?** Weak. "We defaulted to our fund to capture fees" would spark backlash.  
  6. **"Thank You Later"?** Weak. Participants would resent fee-sharing if disclosed.  
  → **Fails at Questions 1, 3, 5**.  
  ❌ **Verdict: Reject**. Default to the index fund; disclose employer’s fund as an option.  
  *Your instinct was right—this fails despite performance. Sales teams should prioritize participant trust over short-term gains.*

  ---

  ### **What the Procedure Can’t Do: Limitations**
  1. **Values Laundering**:  
     The procedure can’t resolve conflicts between stakeholder interests (e.g., employer profits vs. participant welfare). It flags value judgments (Questions 1, 6) but relies on your team’s ethics. In Case 3, it surfaces the conflict but can’t absolve you—you must decide "whose goals matter most."  

  2. **Edge Cases**:  
     - **"Thank You Later" misfires**: E.g., a nudge that backfires (e.g., overly conservative default) might still "pass" if people are grateful for avoiding risk. The test is flawed for rare/unpredictable outcomes.  
     - **Unintended consequences**: E.g., a one-click opt-out might still exclude tech-averse users. The procedure won’t catch accessibility gaps.  

  3. **Cultural/Contextual Blind Spots**:  
     Assumes participants share "typical" goals (e.g., retirement savings). It may fail for niche plans (e.g., gig workers prioritizing liquidity).  

  4. **False Negatives**:  
     Good nudges with moderate opt-out costs (e.g., a health insurance waiver requiring a 5-minute call) might be rejected if your threshold is too rigid.  

  ---

  ### **Confidence Assessment**
  - **Highest Confidence** (⭐⭐⭐⭐☆):  
    - *Questions 1 (Goals) and 5 (Transparency)*: Grounded in hard paternalism critiques (Conly) and libertarian principles (Thaler/Sunstein). Failures are clear in Cases 2/3.  
    - *Question 2 (Soft Paternalism)*: Opt-out cost thresholds are well-defined in behavioral literature.  
  - **Medium Confidence** (⭐⭐⭐☆☆):  
    - *Question 4 (Evidence)*: Relies on your data quality. Weak if evidence is sparse.  
    - *Question 6 ("Thank You")*: Useful but ethically messy—pair with Question 1 to mitigate misfires.  
  - **Lowest Confidence** (⭐⭐☆☆☆):  
    - **Question 3 (Deliberation)**: Hardest to operationalize. "Exploiting inertia" (e.g., pre-checked boxes) is context-dependent. In Case 2, it’s clearly manipulative; in Case 1, inertia is justified. Needs team judgment.  

  **Recommended Safeguard**: Document rationale for value judgments (e.g., "We assume retirement savings is universal based on Plan A data"). Revisit annually as norms evolve.  

  This balances rigor with practicality—each question takes ~5 minutes, and clear thresholds prevent paralysis. For your team’s context, it should streamline decisions while flagging ethical risks.
