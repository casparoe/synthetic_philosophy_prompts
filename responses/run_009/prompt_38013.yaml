  **Why Temporal Solutions™ Works (According to Science!):**  
  Our devices exploit *hyperbolic discounting* (your brain’s tendency to flip preferences as rewards near) by letting your far-sighted self rig the game. They enforce *personal rules* by making one lapse costly to the *entire strategy*. And by limiting exceptions, they prevent the *credibility decay* that turns “just this once” into “always.” Remember: your selves are locked in a cold war. Arm the one you trust more.  

