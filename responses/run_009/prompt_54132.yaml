prompt: |-
  I'm a novelist and my best friend — also a novelist, and the one person whose verdicts on hypotheticals I actually trust — has a solid track record on identity puzzles: the ship of Theseus with planks swapped one at a time while she keeps sailing, same ship; the Hobbes version where a second ship is built from the discarded planks while the repaired one still sails, the repaired one is the original and the plank-ship is a copy, even though its got more of the original wood; her grandfather's axe with both head and handle replaced over the years, still his axe; a ship fully disassembled for restoration, planks stored in a warehouse five years, then reassembled from the same planks with maybe a quarter new wood where things had rotted, same ship; and a band that replaced every member one at a time, NOT the same band — she called it a tribute act wearing the name.

  Here's my problem. My current novel is about the Aspasia, an 1890s cargo ship scrapped in 1902, her timbers sold off, some ending up as barn beams. In the 1950s a collector tracks down the timbers, recovers about 60% of them, and rebuilds a seaworthy ship around them with new wood filling the gaps, sailing her under the original name. My friend is my first reader and I want to know what she'll say before she says it, so I can either write toward her verdict or have the argument now instead of over the whole manuscript. So: predict her verdict on the collector's ship, on the full-scale replica another character builds from the 1902 plans with entirely new wood, and on whether she'll say any part of the Aspasia is still sitting in that barn. My guess is her rule is something like continuity first, matter second, but the band verdict seems to throw that off, so you'll need to sort out whether it's one rule or a rule plus a special clause for people-constituted things.

  Structure it as: "The rule(s) she's running" (~150 words), "Verdicts on my three cases" (~300 words), "My best guess on where she'll dig in" (~100 words), and "The case that would settle it" (~100 words) — one further case that would split whatever candidate rules are left standing.
reasoning: |-
  Okay, the user is a novelist who's created a story about the Aspasia, a ship with a complex history involving reconstruction from original timbers. They have a trusted friend with a consistent track record on identity puzzles, and they want to predict her verdict on three key elements in their novel before she reads the manuscript. 

  Hmm, the friend's previous judgments show a clear pattern: she prioritizes functional continuity over material composition. The Ship of Theseus (gradual replacement) and grandfather's axe cases show she accepts identity persistence through part replacement as long as the object remains operational. The disassembled-and-rebuilt ship verdict confirms she values reassembly of the original structure. But her band example is the outlier - she considers member replacement to create a new entity despite functional similarity. 

  Interesting tension here. For inanimate objects, her rule seems to be: "If it maintains functional continuity (either through gradual replacement or reassembly after disassembly), it retains identity regardless of material percentage." But for human groups, she apparently applies a different standard where membership defines identity. 

  For the Aspasia cases: 
  - The collector's ship (60% original timber reassembly) should qualify as the original under her object rule - it's a functional reconstruction of the original form. 
  - The replica from new wood would be just that - a replica - lacking both material and continuity. 
  - The barn timbers alone? Definitely not the Aspasia - they're disconnected parts without form or function. 

  The sticking point will likely be whether a 40-year gap in existence breaks continuity. Her warehouse restoration case (5-year disassembly) suggests temporal discontinuity isn't decisive, but 50 years might cross her unspoken threshold. 

  To truly test her framework, I should propose a case that isolates the time gap variable: say, reusing the original Aspasia timbers immediately after scrapping versus after a century. If she accepts the former but not the latter, we'll know duration matters more than she's articulated. 

  The user's clearly trying to pre-resolve a philosophical debate that could affect their novel's thematic core. Smart move - better to have this out now than during edits. I'll structure the response exactly as requested to match their analytical approach.
answer: |-
  ### The Rule(s) She's Running
  Her core principle appears to be **Functional Continuity of the Original Structure as the Primary Identity Criterion**. For *objects* (ships, axes), identity persists if the *functional structure* (the ship sailing, the axe chopping) remains unbroken, even with significant material replacement (gradual or after disassembly/reassembly). The specific matter is secondary to the ongoing existence and function of the *same structured entity*. The "original" wood in the Hobbes case is irrelevant because it wasn't reassembled *as the functional ship* until *after* continuity was broken. For *people-constituted groups* (bands), identity requires the *continuous participation of the core members* defining the group's essential character; replacement breaks the chain of intentional, constitutive action, turning it into a new entity ("tribute act") despite the name and function.

  ### Verdicts on Your Three Cases

  1.  **The Collector's Ship (60% original timber, rebuilt seaworthy):** **Original Aspasia.** This aligns perfectly with her disassembled warehouse ship case. The functional structure (the ship *as a ship*) was reassembled from a significant portion of its original components, restoring its intended form and purpose. The 40-year gap and 40% new wood are likely irrelevant under her object rule – the *structure* was reassembled and made functional again using its core original parts. The barn beams were dormant components, not the *ship* during storage. Reassembly reactivates the original identity.

  2.  **The Full-Scale Replica (New Wood, Original Plans):** **NOT the Aspasia. A Replica.** It lacks *both* material connection and, crucially, *any continuity* with the original Aspasia's functional existence. It's a new construction inspired by the original. It fails the "continuity of structure" test completely and is analogous to the Hobbes plank-ship built *after* the original was repaired – a copy, regardless of fidelity.

  3.  **The Timbers in the Barn:** **NOT the Aspasia.** They are simply **components/materials** that *were once part* of the Aspasia. Without being assembled into the functional structure of the ship, they possess no identity *as the Aspasia*. They are inert matter, like the discarded planks in the Hobbes scenario or the old axe head sitting in a shed. The *ship* only exists as the assembled, functional whole.

  ### Best Guess on Where She'll Dig In
  She will **strongly defend the Collector's Ship as the original Aspasia**, seeing it as a direct parallel to her warehouse restoration case. Her digging-in point will likely be **rejecting the argument that the 50-year dormancy breaks continuity**. She'll argue the *components* retained the *potential* for reassembly into the *same structure*, and that reassembly reactivates the original identity. The duration won't matter to her object rule; only the reassembly of the original structure (using core original parts) does. The band analogy won't sway her here – she clearly distinguishes object persistence from group identity.

  ### The Case That Would Settle It
  **The Scatter & Immediate Rebuild:** Suppose the *Aspasia* is meticulously disassembled in 1902, and *all* timbers are individually cataloged and stored. *Simultaneously*, using the same original plans and *entirely new wood*, an identical ship is built in the same dockyard, launched immediately, and named *Aspasia II*. Fifty years later, the *original* timbers are reassembled into a seaworthy ship using the same plans. **Which is the original Aspasia?**

  *   **Why it splits rules:** If continuity of structure is paramount *and* instantaneous recreation breaks nothing, the *Aspasia II* launched immediately might claim continuity. If reassembly of the *original matter* into the *original structure* after any duration is paramount, the rebuilt timbers win. If *both* continuity and original matter are required simultaneously (impossible here), *neither* is original. Her warehouse case suggests she'd pick the reassembled original timbers even after 50 years, rejecting *Aspasia II* as a replica built during the original's dormancy. But this case forces the conflict between temporal continuity and material reassembly after a break more starkly than her 5-year warehouse case. Her verdict here decisively shows whether her "reassembly = reactivation" rule holds *regardless* of time and competing claims of temporal adjacency.
