  ### Thought Experiment: The Sand-Sifter's Sonic Gland  
  **Species:** *Arenavox sonorus* (Common name: Dune Resonance Lizard)  
  **Trait:** Sonic Gland (a specialized organ in the throat that produces low-frequency vibrations).  

  #### Evolutionary and Ecological History  
  *Arenavox sonorus* inhabits the shifting dune seas of the fictional continent Xerica. The lizards burrow into dunes to escape extreme daytime heat and nocturnal predators. Approximately 500,000 years ago, Xerica experienced a prolonged "wet-dune" phase: seasonal rains created temporary, nutrient-rich oases where dune grasses thrived. During this period, the sonic gland evolved under selection for **dune stabilization**. The gland emits vibrations (5–10 Hz) that cause sand grains to interlock, solidifying burrow walls and preventing collapses during rainstorms. Heritable variation in gland size and vibration intensity existed, and lizards with more effective vibrations survived burrow collapses at higher rates. This selective episode lasted ~200,000 years, fixing the trait in the population.  

  Around 1,000 years ago, Xerica’s climate shifted abruptly to a "hyper-arid" phase: rains vanished, dunes became dry and loose, and grasses died out. Burrow collapses ceased entirely because dry sand cannot be liquefied (the mechanism behind collapses). The sonic gland, however, remained active. In the hyper-arid environment, the vibrations now serve a new purpose: **predator detection**. The low-frequency waves travel through sand and reflect off the carapaces of *Scorpica mortifer*, a lethal burrowing scorpion that has proliferated in the absence of grasses. Reflected vibrations are sensed by the lizard’s jawbones (a preexisting sensitivity), triggering evasive maneuvers. This detection enhances survival, as *Scorpica* kills 60% of unalerted lizards.  

  Crucially, the new effect (predator detection) **cannot undergo selection**:  
  - There is **no heritable variation** in the gland’s vibration properties. The gland’s structure is now genetically fixed (a result of its stabilization adaptation), and all individuals produce identical vibrations.  
  - *Scorpica* emerged only ~30 lizard generations ago—far too few for new selection to act, even if variation existed.  
  The gland thus actively contributes to survival via predator detection but is unchanged from its stabilization-adapted state.  

  #### Walkthrough  
  **Etiological Account Verdict**  
  - **Function:** Dune stabilization.  
  - **Why:** The sonic gland was selected for stabilizing burrows during the wet-dune phase. Stabilization is the effect that explains the trait’s fixation. The current effect (predator detection) was not selected for—it lacks a history of heritable variation and differential reproduction. Stabilization is the function even though it is no longer produced (due to absent rain).  

  **Causal-Role Account Verdict**  
  - **Function:** Predator detection.  
  - **Why:** The sonic gland’s vibrations contribute to the organism’s capacity to evade predators. This effect is currently biologically significant (enhancing survival) and is part of the lizard’s behavioral-causal system. The historical effect (stabilization) is irrelevant to current causal roles.  

  **Unusual Orientation**  
  Typically, debates focus on traits that *gain* a new causal role while lacking an etiological function (e.g., a novel trait) or traits where both accounts recognize a function but disagree on *which* effect qualifies. Here, the orientation is **reversed**:  
  - The etiological function (stabilization) is an effect the trait *never produces anymore*.  
  - The effect the trait *currently produces* (predator detection) is *not* its etiological function.  
  This contrasts with the "easy direction" (e.g., feathers used for warmth before flight) where a new causal-role function emerges without an etiological one.  

  #### Key Feature and Its Role  
  The **extinction of the original selection pressure** (rain-driven burrow collapses) is the core feature. This creates a gap where the trait:  
  1. Cannot perform its selected effect (stabilization is ecologically impossible).  
  2. Performs a new, beneficial effect without selection acting on it (due to population constraints).  
  **If this feature is deleted** (e.g., if rains still occurred occasionally), the etiological account could still assign stabilization as the function *and* potentially recognize predator detection as an additional function if selection acted on it. The gap forces the etiological function to be "ghostly" (selected but unperformed) and the new effect to be "non-teleological" (beneficial but unselected).  

  #### Internal Attacks  
  **Etiological Theorist’s Defense**  
  - **Attack on the new effect:** The predator detection is merely a "fortuitous use" or a "side effect" of the sonic gland, not a function. It lacks a selection history—no alleles for detection were ever favored. Millikan might call it a "derived proper function" only if selection *maintains* the trait, but here, selection cannot act (no variation, too few generations). Thus, detection is demoted to a beneficial accident, while stabilization remains the true function because it explains the trait’s presence.  

  **Causal-Role Theorist’s Defense**  
  - **Attack on the historical effect:** Stabilization is a "relic effect" with no current causal relevance—it does nothing for the organism now. Cummins would argue that a function must be part of a *current* systemic capacity; an effect that nothing performs (and cannot be performed) is functionally inert. Assigning "function" to stabilization is like calling a broken key’s original shape its function—it ignores what the trait *does* in the here and now.  

  #### Reconciliation via Amendment?  
  A **"maintenance selection" amendment** could bridge the gap: etiological functions could include effects that *prevent* the trait from degenerating, even if not actively selected *for*. Here, if predator detection inhibited gland atrophy (e.g., via purifying selection), it might qualify as an etiological function.  
  - **Cost:** This dilutes the etiological account’s core—selection must explain the trait’s *origin*, not just its maintenance. It also risks conflating selection *for* an effect with selection *against* dysfunction.  
  A **"temporal indexing" amendment** (e.g., "function-at-time-t") allows both accounts to coexist but severs the etiological link to history.  
  - **Cost:** Etiological theories lose their backward-looking essence; causal-role theories gain temporal baggage.  

  **Conclusion:** The case isolates the etiological account’s dependence on history versus the causal-role account’s presentism. The gap ensures that stabilization is "selected but dead," while detection is "vital but unselected." This forces a stark choice: must a function be performed, or must it be selected?
