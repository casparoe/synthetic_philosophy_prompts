  We are constructing a thought experiment about a trait in a fictional but biologically plausible species. The species will be called the "Desert Whistler" (scientific name: *Sibilans arenosus*). This is a small, burrowing rodent inhabiting arid regions. The trait in question is a specialized vocal organ, the "throat pouch."

  **Evolutionary and Ecological History:**

  1. **Original Environment and Selection for Water Collection:**
     - The Desert Whistler evolved in an extremely arid desert where water was scarce. Rain events were rare but intense, leading to short-lived puddles and damp sand.
     - The ancestral population had a simple throat pouch that was initially a byproduct of their vocal anatomy. This pouch could expand and contract, and in some individuals, it produced a low-frequency hum when they vocalized.
     - During the rare rain events, the low-frequency hum produced by the throat pouch caused vibrations in the wet sand. This vibration led to the aggregation of water droplets on the surface of the sand (a phenomenon similar to non-coalescence or the "Cheerios effect" but in sand). The aggregated water droplets then rolled down into the burrow entrances, providing a critical water source for the Whistlers. This effect was especially vital because the puddles evaporated quickly and the sand dried within minutes.
     - Over time, natural selection favored individuals with larger, more efficient throat pouches that could produce stronger vibrations and thus collect more water. This went on for thousands of generations. The throat pouch became an adaptation for water collection.

  2. **Environmental Shift:**
     - Due to climate change, the region became even drier, and the intense rain events ceased entirely. The desert now receives no rain at all. The only water source is from the air: the region experiences heavy fog every night, which condenses on cool surfaces.

  3. **Current Ecology and the Trait's New Role:**
     - Without rain, the throat pouch's original water-collection effect (vibrating wet sand to aggregate water) is no longer produced because there is no wet sand. However, the throat pouch is still present and active. The Whistlers still vocalize, but now the low-frequency hum (produced by the same throat pouch) serves a different purpose: it causes the condensation of fog on the burrow walls. The vibrations from the hum cause the burrow walls (which are cool and made of a particular type of sand that holds moisture) to vibrate, which promotes the condensation of water vapor from the fog. This condensation trickles down and is collected by the Whistlers. Thus, the throat pouch is still crucial for water acquisition, but now it works via condensation in foggy conditions.

  4. **Population-Level Facts Blocking New Selection:**
     - The shift to fog condensation happened very recently (only about 5 generations ago). Moreover, there is no heritable variation in the throat pouch's ability to cause condensation. The condensation effect is an inevitable byproduct of the throat pouch's structure and the current environmental conditions (the fog and the burrow walls' properties). Since there is no variation in this effect among individuals (all Whistlers with a throat pouch produce the condensation equally well) and no alternative traits, natural selection cannot act to favor this effect. It is simply a fixed feature of the current population.

  **The Trait:**
  - The trait is the throat pouch. It is active and necessary for survival (providing water in the foggy environment). It produces an effect (condensation of fog) that was never selected for. The effect it was selected for (aggregating water from wet sand) is no longer produced because the environment no longer provides the conditions (rain and wet sand).

  **Walkthrough:**

  1. **Etiological Account (Wright-Millikan-Neander):**
     - The function of the throat pouch is the effect for which it was selected: aggregating water from wet sand during rain events. Even though this effect is no longer produced (since there are no rain events), the selection history determines the function. The current effect (condensation of fog) is not the function because (a) it was not selected for in the past, and (b) the population-level facts (no variation, too few generations) prevent it from being selected for now. Thus, the etiological function is an effect that the trait never produces anymore.

  2. **Causal-Role Account (Cummins):**
     - The function of the throat pouch is its current causal contribution to a capacity of the organism. The relevant capacity is water acquisition. The throat pouch contributes by producing vibrations that cause fog to condense on the burrow walls. This effect is clearly contributing to the organism's survival and is part of the current system's activities. Therefore, the causal-role function is the condensation effect. The historical effect (aggregating water from wet sand) is irrelevant to the current causal analysis.

  **Unusual Orientation:**
  - Typically, when a trait acquires a new effect that it wasn't selected for, the etiological account might eventually recognize it as a new function if selection acts on it. But here, the historical effect is gone, and the new effect is not being selected. The etiological function is an effect the trait no longer produces, while the current effect is not the etiological function. The causal-role account, by contrast, assigns the current effect as the function. This reverses the common situation where a new causal-role function arises without an etiological one.

  **The Key Feature:**
  - The gap between the selection episode and the present is crucial. Specifically, the extinction of the environmental conditions that made the historical effect possible (the rain events) and the rapid shift to a new environment (fog) without enough time or variation for selection to act on the new effect. The gap is not just temporal but ecological: the trait's original effect is impossible now.

  **If the Gap is Removed:**
  - Suppose the rain events still occur occasionally, and the throat pouch still produces the water-aggregation effect sometimes. Then the etiological account would still assign the water-aggregation as the function (since it was selected for) and might consider the condensation effect as either a new function (if selection is acting on it) or a mere side effect. But in our case, the original effect is gone entirely, so the etiological account cannot point to any current performance of the historical function. The gap forces the etiological account to assign a function that is never performed.

  **Attacks from Within:**

  - **Etiological Theorist's Attack on the Current Effect:** 
    The etiological theorist would say that the condensation effect is not a function but a mere effect or a use of the trait. They might argue that the trait's design (its structure and the selection history) is for water aggregation in sand, and the condensation is just a lucky accident that the trait happens to produce in the new environment. Since there has been no selection for condensation, it doesn't count as a function. They might also point out that the trait is still performing a survival-enhancing role, but that alone doesn't make it a function in the etiological sense.

  - **Causal-Role Theorist's Attack on the Historical Effect:**
    The causal-role theorist would argue that the historical effect (aggregating water from wet sand) is not a function at all in the current context because it is not currently contributing to any capacity of the organism. Since the trait doesn't do that anymore, it has no causal role in that capacity. The causal-role account is about current systemic contributions, so a past effect that is no longer occurring is irrelevant. They might say, "A function that nothing performs is a function for nothing."

  **Possible Amendment to Reconcile the Theories:**

  - One amendment is to adopt a "selected-effects plus maintenance" view: a function is an effect that was selected for and is currently maintained by selection (or at least not selected against). In this case, the condensation effect is not maintained by selection because there is no variation. But the historical effect is not maintained either because it's not produced. So both accounts would then have to say there is no function? That seems unintuitive because the trait is clearly doing something important. Alternatively, some etiological accounts might allow that if a trait is currently maintained by selection for a new effect, then that new effect becomes the function. But in this scenario, there is no selection for the new effect because there is no variation. So that escape is closed.

  - Another amendment is to allow the causal-role account to dominate when the historical function is no longer possible. But that would be ad hoc for the etiological theorist. Alternatively, the etiological account might be amended to include "the last function for which it was selected" even if it's no longer produced, but that seems to stretch the concept.

  - The cost of any amendment that allows the etiological account to assign the current effect as the function (despite no selection history for it) is that it blurs the line between selected effects and mere effects. The etiological account would lose its historical purity. Conversely, if the causal-role account were to incorporate history, it would lose its ahistorical appeal.

  In conclusion, the case is designed to force a stark divergence: the etiological function is an unperformed past effect, while the causal-role function is a current effect without a history of selection. The gap in the environment (the disappearance of rain) is the key feature.
