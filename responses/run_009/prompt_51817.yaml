answer: |-
  Here’s your Q&A prep sheet, tailored to your audience and ordered by likely objection sequence. I’ve flagged concessions, must-hold points, and vulnerabilities.  

  ---

  ### **Q&A Prep Sheet: Qualia as Incoherent Posit**  
  **Core Thesis:** Standard qualia (intrinsic/private/ineffable) are indeterminate under introspection and thus explanatorily inert.  

  ---

  ### **Objection 1 (Senior Metaphysician):**  
  *"Mary’s post-release knowledge proves she learns *new facts* about intrinsic qualia. Your indeterminacy argument ignores this decisive intuition."*  
  **Reply (2-min):**  
  "Mary learns *how to recognize* red—a discriminatory ability—not a private fact. Dennett’s 'RoboMary' shows she could physically know everything *and* simulate color vision without 'new' intrinsic properties. The 'knowledge' is relational: a mastery of sensorimotor contingencies, not revelation of hidden properties. Introspection cannot isolate 'intrinsicness' here—Mary’s surprise is consistent with judgment shifts or new reactive dispositions."  
  **Soft Spot:** RoboMary is contentious; relies on disputable ability/tacit knowledge distinctions.  
  **Stance:** CONCEDE the intuition’s power but HOLD that it’s misdescribed.  

  ---

  ### **Objection 2 (Perception Specialist):**  
  *"Blindsight proves subjects lack conscious visual qualia *despite* discriminatory ability. This dissociation shows qualia are intrinsic properties separable from function."*  
  **Reply (2-min):**  
  "Blindsight reveals *access* dissociation, not intrinsic qualia. Type-1 blindsight (unconscious processing) involves degraded access; Type-2 (partial awareness) involves fragmentary access. Neither case demands *intrinsic* properties—only varying degrees of information availability for report/control. Chase/Sanborn’s indeterminacy shows we can’t introspectively distinguish access failure from property change. Blindsight is evidence for access gaps, not ontological qualia."  
  **Soft Spot:** Overreliance on access metaphors; doesn’t fully address *why* blindsight *feels* empty.  
  **Stance:** HOLD that blindsight doesn’t entail intrinsicness.  

  ---

  ### **Objection 3 (Ordinary-Language Critic #1):**  
  *"Nobody serious defends this ‘straw man’ qualia. Modern realists treat qualia as relational/public features. You’re attacking a 1980s caricature."*  
  **Reply (2-min):**  
  "Chalmers (1996) explicitly defends intrinsicality; Block (1995) invokes private ‘mental paint’. The debate *assumes* introspection delivers private properties—else why does Jackson’s Mary generate such resistance? If qualia aren’t directly introspectible as intrinsic, their ‘relational’ reformulation concedes my point: they’re not the explananda we thought. Chase/Sanborn shows even *minimal* introspection can’t resolve disputes about experiential change."  
  **Soft Spot:** Some self-described realists *do* soften qualia (e.g., Shoemaker).  
  **Stance:** CONCEDE some realism is nuanced but HOLD that intrinsicality remains implicit in the literature.  

  ---

  ### **Objection 4 (Illusionist Grad Student):**  
  *"If qualia are incoherent, why not endorse full illusionism? Your agnosticism feels like a dodge."*  
  **Reply (2-min):**  
  "My target is the *incoherence of the posit*, not the reality of subjective experience. Illusionism claims experiences are *systematically misrepresented*, which requires a robust theory of representation I haven’t defended. I show qualia *as defined* can’t do work—but we might salvage ‘experience’ via alternative frameworks (e.g., predictive processing). Chase/Sanborn’s indeterminacy undercuts realism, but neutral monism or adverbialism could offer third ways."  
  **Soft Spot:** Avoids ontological commitment; may dissatisfy radicals.  
  **Stance:** CONCEDE illusionism’s appeal but HOLD that rejecting qualia ≠ embracing illusionism.  

  ---

  ### **Objection 5 (Ordinary-Language Critic #2):**  
  *"Your argument proves too much: introspection can’t adjudicate *any* metaphysical disputes (e.g., persistence of objects). Why single out qualia?"*  
  **Reply (2-min):**  
  "Unlike tables, qualia are *defined* as objects of direct introspection. If introspection can’t settle whether Chase’s taste *or reaction* changed—the very domain qualia purport to explain—they’re vacuous. For tables, we have public criteria (spatiotemporal continuity). Qualia’s privacy/intrinsicality makes them uniquely indeterminate. They’re not just mysterious; they’re *idle* in explanations."  
  **Soft Spot:** Public criteria for experience exist (e.g., expressive behavior).  
  **Stance:** HOLD that qualia’s defining traits make their indeterminacy fatal.  

  ---

  ### **The Question You Hope Nobody Asks:**  
  *"If qualia are incoherent, how do you explain the *persistent belief* in them? Doesn’t introspection’s *seeming* transparency entail *some* directly accessible property?"*  
  **Reply Strategy (if asked):**  
  "Introspection *seems* transparent because it reports judgments stabilized by language and culture. Dennett: ‘heterophenomenology’ shows we confabulate narratives from sensory fragments. Chase/Sanborn’s confusion reveals this fragility—we mistake reactive dispositions for properties. The ‘seeming’ is real, but it’s a cognitive illusion, not ontological revelation."  
  **Danger:** Forces you into illusionism-adjacent territory, alienating realists.  

  ---

  ### **What Changes the Ranking?**  
  If the **perception specialist** rephrases blindsight using **phenomenal reports vs. forced-choice responses** (e.g., Weiskrantz), showing subjects *deny* experience while performing, this becomes the #1 threat. Your reply hinges on disputing "denial" as access failure—weak if they cite neural correlates of unreportable qualia.  

  ### **Where My Assessment Fails:**  
  I likely underestimate the **ordinary-language critics**. If they cite Wittgenstein or Travis to argue qualia-talk is flexible/contextual (not committed to intrinsicality), objections #3/#5 could merge into a devastating "you’re attacking a linguistic phantom" critique.  

  ---

  **Verdict:** *Mary’s new knowledge as proof of intrinsic facts.*
