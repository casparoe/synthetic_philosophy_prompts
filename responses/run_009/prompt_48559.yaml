answer: |-
  Here's a breakdown of the distinct claims embedded in "If you didn't vote, you can't complain," assessing each for plausibility and whether it truly dismisses the abstainer's complaint, suitable for your seminar discussion:

  **Key Interpretations:**

  1.  **The Near-Truism (Formal Eligibility):**
      *   **Claim:** "Complaining" in a formal, political sense (e.g., claiming the outcome is illegitimate, demanding specific redress) requires prior participation in the defining political ritual (voting). Non-participation forfeits access to this specific channel of political grievance.
      *   **Plausibility:** Low as a universal rule. Complaining is a fundamental political right, often protected independently of voting. While voting *grants* one formal standing in some contexts (e.g., party membership rules), it doesn't universally *revoke* the right to critique outcomes. One can complain about laws they didn't vote for, wars they didn't start, etc.
      *   **Vindicates Dismissal?** No. It confuses formal procedural standing with the broader moral/political right to critique. Her complaint about the *substance* or *morality* of the outcome isn't silenced by abstention.

  2.  **Causal Influence / "You Had Your Chance":**
      *   **Claim:** By abstaining, you forfeited your opportunity to influence the outcome. Therefore, you lack standing to complain about the result you chose not to try to change. Your inaction contributed to the outcome (or failed to prevent it).
      *   **Plausibility:** Superficially appealing but logically weak. A single vote rarely causally determines an outcome. More importantly, her abstention might have been a *deliberate* refusal to endorse *any* candidate she deemed unacceptable, which is itself a form of political expression with its own (non-causal) logic. It also falsely assumes voting is the *only* way to influence politics.
      *   **Vindicates Dismissal?** No. Her complaint isn't necessarily "you should have won," but "the choices/outcome/system are morally problematic." Her critique can exist independently of her causal efficacy in that specific election.

  3.  **The Fairness Argument (Duty Fulfillment):**
      *   **Claim:** Voting is a civic duty. Complaining about political outcomes is only fair if you have fulfilled your basic obligation to participate. By shirking your duty, you lose the moral standing to criticize those who did participate and produced the outcome. Complaint-rights are earned through participation.
      *   **Plausibility:** This is a substantive normative thesis. Its plausibility hinges entirely on accepting the premise that voting is an *enforceable moral duty*. Many reject this, viewing voting as a *right* or *privilege*, not an obligation. Even if it *is* a duty, does failure automatically revoke *all* rights to critique? (We don't silence non-jurors complaining about verdicts).
      *   **Vindicates Dismissal?** **Most Likely Intended Meaning.** If the speaker firmly believes voting is a strict duty, then *within their moral framework*, the dismissal makes internal sense. However, it relies on an unproven premise (voting as duty) and ignores the *reason* for abstention (conscientious objection to "lesser evilism").

  4.  **Complicity Avoidance:**
      *   **Claim:** By voting, one becomes complicit in the resulting government's actions (good or bad). Non-voters avoid this complicity and thus cannot be blamed *for the outcome*. Conversely, they also forfeit the right to *complain about the outcome* because they didn't "get their hands dirty" by participating.
      *   **Plausibility:** Controversial. Does voting for Candidate A over B truly make one complicit in *all* of A's actions? Does abstention genuinely absolve one of responsibility for the governance of their society? This view often overstates the agency conferred by a single vote and understates the shared societal responsibility for political outcomes.
      *   **Vindicates Dismissal?** Paradoxically, it might *support* her right to complain (she's *less* complicit), not silence her. The dismissal only works if framed as "you didn't share the risk/burden of complicity, so you can't critique those who did." This is weak and circular.

  5.  **Expressive Consistency (Misapplied):**
      *   **Claim:** Voting is primarily an expressive act of endorsement or preference. By not voting, you expressed no preference. Therefore, you cannot credibly express dissatisfaction (complain) about the outcome, as you never stated what you *wanted* instead. Your complaint lacks the foundation of a previously expressed preference.
      *   **Plausibility:** Misunderstands expression. Abstention *can* itself be a powerful expressive act – expressing disgust, disillusionment, rejection of all options, or a protest against the system. Her complaint *is* the expression of her dissatisfaction, logically consistent with her prior expressive act of abstention.
      *   **Vindicates Dismissal?** No. This interpretation actually *supports* her expressive right to complain as a continuation of her political expression through abstention. The one-liner misapplies the expressive theory.

  6.  **Moral Standing / Hypocrisy:**
      *   **Claim:** Only those who actively participated in the process (voted) have the moral high ground or experiential basis to critique it. Non-voters are hypocrites or outsiders whose critiques are uninformed or sanctimonious.
      *   **Plausibility:** Weak. Political knowledge and moral critique aren't dependent on casting a vote. Her abstention might stem from deep engagement and principle. Voting doesn't automatically confer superior moral insight. This confuses participation with legitimacy of perspective.
      *   **Vindicates Dismissal?** No. It's an ad hominem dismissal based on participation status, not the substance of her complaint. Her critique might be valid regardless.

  **Summary & Which Reading is Likely:**

  *   **The "Fairness Argument" (Voting as Duty)** is almost certainly the meaning most users of this line have in mind. It frames voting as an obligation, the shirking of which forfeits complaint-rights. Its plausibility rests entirely on accepting that normative premise, which is highly contested.
  *   **No reading provides an uncontestable vindication for dismissing her complaint.** Each interpretation relies on substantive, debatable premises (about duty, causality, complicity, expression) or commits logical errors (confusing eligibility with rights, ignoring the expressiveness of abstention, ad hominem attacks).
  *   **The line primarily functions as a conversational stopper:** It shuts down debate by imposing a simplistic participation requirement for political voice, often masking discomfort with critiques of the system or the "lesser evil" dilemma. It fails to engage with the abstainer's *reason* (conscientious objection) and denies the legitimacy of protest through non-participation.

  **For your section discussion, highlight:** The phrase isn't a logical truth but a rhetorical move invoking a specific (and contested) view of voting as a duty. Challenge your peers to defend the underlying premise (Is voting truly a duty? Why?) and to engage with the *substance* of the abstainer's critique and her reasons, rather than silencing her based on participation status. The expressive character of *both* voting and abstention undermines the dismissal.
