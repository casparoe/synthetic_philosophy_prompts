prompt: |-
  I cover science and ideas for a mid-size paper, and an embarrassing fraction of the fights I end up writing about are, I've slowly come to suspect, not really fights about facts at all. Is obesity a disease. Whether viruses count as alive. Whether addiction is a choice or a brain disorder. Whether the serotonin theory of depression was refuted or just quietly retired. Every time one of these flares up, I get scientists on the phone insisting the other side is confused about words, editors insisting we just report what the study found, and readers writing in to say the whole thing is semantics — and I have no systematic way of deciding who's right before deadline. I gather philosophers have actual machinery for this stuff: the people who argue about whether there's a table in addition to the particles arranged table-wise, the long fight about whether that disagreement is merely verbal, and the more recent attempts to give a test for when a dispute is just two people using a word differently. Something like stripping the contested word out and checking whether any substantive claim survives. That's the sort of thing I want, but usable.

  So: write me a procedure my desk can actually run, in about twenty minutes per story, with no philosophy background. An ordered set of questions, what a yes or no at each step licenses me to write, where it stops and says this is a genuine empirical disagreement that deserves coverage as one, and — this is the part I most need — where it has to hand off to a human because the definitional choice, while not tracking any fact, still carries stakes (like, fine, whether obesity is a disease is verbal, but the word decides insurance coverage, so someone still has to pick, and that picking isn't science reporting). Two things I'd like folded in if they're worth anything, and discarded if they're not: my friend who took some philosophy swears by the test that a dispute is verbal whenever both sides, if they were perfectly honest and perfectly informed, would file the identical story — same headline, same lede — and my own hunch that some disputes are only locally verbal, i.e. the word disease might be doing no work in the obesity fight while doing all the work in a fight five years from now about whether doctors can treat ordinary unhappiness, and a procedure that just stamps "verbal" on a word once will mislead me later. If my hunch is confused, say so.

  Then run the procedure on three cases: whether obesity is a disease, whether viruses are alive, and whether the recent claims that the chemical-imbalance story of depression got debunked amount to an empirical reversal or mostly definitional housecleaning. Fair warning on that last one — I wrote a column treating it as a major scientific about-face, and I have a feeling your procedure is going to make me look bad, which I'd honestly rather know. Also be straight about where the procedure misfires: the kinds of disputes it will mis-classify, the kinds of readers it will infuriate, and what it flatly cannot do. My copy desk will fight me over any framing sentence that sounds like it's taking a side in the underlying fight, so build that constraint in.
reasoning: |-
  Okay, the user is a science journalist dealing with recurring disputes that seem to be about definitions rather than facts. They need a practical, time-efficient tool to distinguish substantive scientific disagreements from verbal ones, especially under deadline pressure. 

  First, I need to unpack their core frustration: they're stuck in a loop where scientists argue about terminology, editors demand pure study reporting, and readers dismiss everything as semantics. The unspoken pain here is professional credibility—they don't want to frame linguistic debates as scientific breakthroughs (or vice versa), especially after possibly mishandling the serotonin story.

  Their explicit request is for a philosopher-inspired but journalist-friendly procedure. Key requirements: 
  - Takes ~20 minutes per story
  - No philosophy background needed
  - Outputs clear framing guidance (e.g., "this is definitional, but high-stakes")
  - Flags when human judgment is needed for non-empirical stakes
  - Handles their three example cases

  The subtler challenges: 
  - Their friend's "identical story" test is insightful but unrealistic—it assumes perfect honesty/information, which journalists never have. Should adapt it to a "core claim alignment" check.
  - Their "locally verbal" hunch is sharp. Some terms like "disease" are semantic lightning rods only in specific contexts. The tool must avoid labeling words as universally "verbal."
  - Copy desk resistance matters. Any hint of taking sides in the underlying fight will get vetoed, so outputs must neutrally describe disagreement structures.

  For the procedure design: 
  - Adapt Chalmers' "elimination test" (stripping contested terms) but make it journalist-practical with direct substitution.
  - Prioritize question order for efficiency: empirical agreement check first (saves time if found), then term substitution, then stakes assessment.
  - Build in off-ramps: if step 1 finds real data conflict, stop; if step 2 shows full agreement sans terms, call it verbal; if disagreement persists without terms, it's substantive.
  - For high-stakes definitional choices, provide explicit boilerplate language to satisfy copy desk ("While scientists agree on X, they diverge on whether that constitutes Y...").

  Testing on their cases: 
  - Obesity as disease: Classic high-stakes verbal dispute. Agreement on health risks, conflict over "disease" label due to insurance/policy implications.
  - Viruses alive: Purely verbal. Zero empirical disagreement; only about the arbitrary "life" definition.
  - Serotonin depression: Their worry spot. Likely mixed—partly empirical (serotonin's role is more complex than thought) but exaggerated into "debunked" due to loaded terms like "chemical imbalance." Procedure would have prevented framing as pure about-face.

  Major limitations to confess: 
  - Fails for "motte-and-bailey" tactics (where debaters switch between defensible and radical claims)
  - Struggles with politically weaponized terms (e.g., "gender")
  - Requires journalists to accurately map arguments—risky if sources misrepresent positions
  - Will infuriate readers invested in the term itself (e.g., "addiction is a choice" advocates)

  Biggest unspoken need: They want to stop feeling like a pawn in academic turf wars. The tool's real gift is letting them say: "This isn't science—it's policy/linguistics/philosophy, and here's why."
answer: |-
  Here’s a practical, deadline-friendly procedure for your desk, designed to work in **~20 minutes per story** without philosophy training. It’s built on core tools from conceptual analysis but stripped to journalist essentials. I’ll then run it on your three cases and flag limitations.

  ---

  ### **The "Substance vs. Semantics" Triage Procedure**  
  **Goal:** Determine if a dispute is (a) empirical (report as scientific disagreement), (b) verbal (don’t frame as science fight, but note stakes), or (c) mixed (split coverage).  
  **Time:** 20 mins max. **Tools:** Notes, phone, 1–2 key sources (or their quotes).  

  #### Step 1: **Map the Core Claims (5 mins)**  
    - Ask: *"What precise claim does each side assert? Write them side-by-side, highlighting the contested term (e.g., 'disease,' 'alive')."*  
    - **Example:**  
      - Side A: "Obesity *is a disease* because it impairs function."  
      - Side B: "Obesity *is not a disease*; it's a risk factor for diseases."  

  #### Step 2: **Strip the Contested Term (5 mins)**  
    - *Remove the contested word/phrase from both claims.* Then ask:  
      - **Q1:** "Do both sides agree on *all factual observations* underlying the dispute?"  
        - *Yes* → Proceed to Q2.  
        - *No* → **STOP. Genuine empirical disagreement.** Cover as a science fight.  
      - **Q2:** "Would both sides tell the *same story* if they avoided the term?" (Your friend’s test, adapted.)  
        - *Yes* → **Verbal dispute.** Go to Step 3.  
        - *No* → **Mixed dispute.** Go to Step 3.  

  #### Step 3: **Assess Stakes (5 mins)**  
    - Ask: *"What changes if we pick one definition over the other?"*  
      - Insurance coverage? Funding? Social stigma? Treatment access?  
      - **Outputs:**  
        - **Purely verbal** (Q1=Yes, Q2=Yes) → *No science story here.* Framing:  
          > *"Scientists agree on the facts about [topic] but disagree whether the term '[X]' applies. This labeling debate affects [stakes]."*  
        - **Mixed** (Q1=Yes, Q2=No) → *Split coverage:* Report agreed facts + note definition stakes. Framing:  
          > *"While researchers concur on [agreed facts], they clash over whether this constitutes [X]—a debate with implications for [stakes]."*  
        - **High-stakes definitional choice** → *Hand off to editors/columnists.* Flag:  
          > *"This isn't about science but how we define [X]. The choice impacts [stakes], requiring societal/policy judgment."*  

  #### Key Features:  
  - **Your "locally verbal" hunch is VALID.** The procedure tests *this specific dispute*, not the word forever.  
  - **"Identical story" test** is integrated (Step 2, Q2) but made practical—focus on whether the *core narrative* changes sans the term.  
  - **Copy-desk safe:** Framing avoids endorsing sides by focusing on *agreement* first.  

  ---

  ### **Test Runs**  
  #### Case 1: Is obesity a disease?  
  - **Step 1:**  
    - A: "Obesity is a disease (medicalizes it, enables treatment)."  
    - B: "Obesity isn’t a disease (stigmatizes, ignores social drivers)."  
  - **Step 2:**  
    - *Strip "disease":* Both agree obesity correlates with diabetes, heart issues, etc.  
    - Q1: **Yes** (no fact dispute).  
    - Q2: **Yes** (both would say: "Obesity elevates health risks; interventions needed").  
  - **Step 3:** High stakes (insurance, medicalization).  
  - **Verdict:** **Purely verbal.** Your story:  
    > *"Experts agree obesity increases health risks but clash on calling it a 'disease'—a decision affecting insurance coverage and public perception."*  

  #### Case 2: Are viruses alive?  
  - **Step 1:**  
    - A: "Viruses are alive (replicate, evolve)."  
    - B: "Viruses aren’t alive (no metabolism, can’t replicate alone)."  
  - **Step 2:**  
    - *Strip "alive":* Both agree viruses have genes, replicate in hosts, evolve.  
    - Q1: **Yes** (no fact dispute).  
    - Q2: **Yes** (both would say: "Viruses replicate and evolve but lack cellular machinery").  
  - **Step 3:** Low stakes (no policy impact).  
  - **Verdict:** **Purely verbal.** Your story:  
    > *"Scientists agree on how viruses work but dispute the term 'alive'—a debate with little practical impact."*  

  #### Case 3: Serotonin theory of depression "debunked"?  
  - **Step 1:**  
    - A: "Chemical imbalance theory is debunked (serotonin isn’t the primary cause)."  
    - B: "It’s not debunked (serotonin is involved, but the model was oversimplified)."  
  - **Step 2:**  
    - *Strip "debunked"/"chemical imbalance":*  
      - Both agree: Low serotonin doesn’t directly *cause* most depression; antidepressants work for some but not solely via serotonin.  
      - **Q1: Yes** (no dispute on these facts).  
      - **Q2: No** → *Mixed dispute.* Side A’s narrative: "Serotonin’s role was overstated; focus on social/neural complexity." Side B’s: "Serotonin is still key in pathways; the model wasn’t disproven but refined."  
  - **Step 3:** High stakes (public trust in meds, stigma).  
  - **Verdict:** **Mixed.** Your story:  
    > *"Researchers agree that depression isn’t caused by simple ‘serotonin deficiency’ and that treatments work complexly. But they dispute whether this refutes serotonin’s role entirely—a debate affecting how patients view medication."*  
  - **Your column note:** Framing it as a "major scientific about-face" oversimplified. It was **definitional housecleaning** (the "chemical imbalance" metaphor was always fuzzy) + **empirical refinement** (serotonin’s role is more nuanced). The "debunked" narrative amplified a verbal dispute.  

  ---

  ### **Where the Procedure Misfires**  
  1. **Motte-and-bailey tactics:** If one side conflates a broad claim (e.g., "addiction is a choice") with a narrow one ("choices influence addiction"), it may misclassify.  
  2. **Politicized terms:** E.g., "gender," "race"—verbal disputes with massive stakes but extreme sensitivity. The procedure will flag them as verbal, but coverage may require extra nuance.  
  3. **False consensus:** If sources misrepresent *others’* views (common!), Step 2 fails. Mitigation: Ask each side: "What would your opponent say if they couldn’t use [X]?"  
  4. **Incomplete facts:** If new evidence is emerging (e.g., early COVID origins debate), Step 2’s "agreement" check may be premature.  
  5. **Reader fury:** Those invested in a term (e.g., "addiction is a brain disorder") may feel dismissed. Solution: Explicitly note stakes in framing.  

  **What it can’t do:**  
  - Resolve ethical/social disputes masquerading as science (e.g., "Is PTSD a *real* disorder?").  
  - Handle debates where *all* terms are contested (e.g., "What is consciousness?").  
  - Replace expert nuance in complex fields (e.g., quantum interpretations).  

  ---

  ### **Final Output for Your Desk**  
  **One-pager cheat sheet:**  
  1. **Write claims** (Side A vs. Side B).  
  2. **Cut the buzzword**—do facts align? If no, **empirical fight**.  
  3. **Same story without the word?** If yes, **verbal dispute**; if no, **mixed**.  
  4. **Stakes?** High → Hand off for policy/society angle.  
  5. **Frame neutrally:** "Agree on X, clash on whether it’s Y."  

  This won’t make philosophers cheer, but it’ll cut through 80% of semantic noise on deadline. For the serotonin case: you weren’t wholly wrong—it *was* a course-correction—but the "debunked" framing turned refinement into a verbal grenade.
