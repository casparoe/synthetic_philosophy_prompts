prompt: |-
  Background: I do risk reporting at an insurance company, so I spend my days around people throwing percentages at single events that haven't happened yet. Something has been bugging me for a while and I can't find a word for it. When our model says "70% chance this claim is fraudulent" and it turns out not to be, nobody in the room says the 70% was wrong — the answer is always "it was a good number, the coin just landed badly," and the only way to audit the model is over a long run of similar cases. But when my sister's oncologist told her "90% chance the treatment works" and she turned out to be in the unlucky 10%, the family, the second-opinion doctor, even my sister herself, all talked as if the 90% had somehow been shown to be wrong about her, and quoting the success rate from clinical trials didn't feel like a full rebuttal. Same grammatical shape — a number pinned to one unrepeatable event — but in one context holding the number answerable to the single outcome sounds like a category error, and in the other it sounds completely natural. A bookmaker feels like a third thing again: his odds get treated as statements about his future balance sheet, not about the match at all.

  I've tried out some candidate explanations and none quite fit. It's not the gambler's fallacy — nobody involved thinks past cases change the odds. A colleague muttered something about "that's just frequentism versus Bayes," but that doesn't seem right either: the disagreement I'm describing shows up between two people who agree on the interpretation, e.g. two Bayesians arguing about whether the doctor "got it wrong" about my sister. And I vaguely remember reading that courts get instructed not to convict on a bare "the probability he did it is very high," which smells related, but that looks like it's about evidence rather than about who's allowed to say "the number was wrong" after the fact.

  So: does this asymmetry have an established name or literature attached to it? I want more than a label, though — if there's a concept, tell me how it's carved: what exactly makes the weather-model 70% immune to the single outcome while the doctor's 90% isn't (is it who controlled the generating process? the stakes? whether a human had to look the patient in the eye?), and how it relates to the older fight about whether a probability for a one-off event means anything at all. If nothing established fits cleanly, say so, and then coin a term with a real definition and run it through the boundary cases: the fraud model, the oncologist, the bookmaker, and a jury told "there's a 95% probability the defendant was at the scene" based only on location data. You're a philosopher of probability, so please think carefully and maybe brainstorm a couple of candidate framings before committing to one — what I want is the carving of the joint, not just its name. Also fine to tell me the whole pattern dissolves under scrutiny, but you'd have to show why, since from where I sit it looks pretty robust.
reasoning: |-
  Okay, the user is working in risk reporting at an insurance company and has noticed an interesting asymmetry in how people interpret probabilities for single events. In their professional context, a 70% chance of fraud that turns out not to be fraudulent isn't considered wrong—it's just part of the probabilistic nature. But when their sister's oncologist gave a 90% success rate for treatment and she ended up in the unlucky 10%, everyone acted like the probability was wrong. The user wants to understand why this difference exists and if there's a term or concept for it.

  First, I need to unpack the core issue. The user mentions that in insurance, a single outcome doesn't invalidate the probability, whereas in the medical case, people react as if the probability was incorrect. The examples include fraud models, medical prognoses, bookmakers, and legal contexts. The user has ruled out gambler's fallacy and frequentism vs. Bayes, and they want a deeper conceptual framework.

  The key here is the difference between epistemic and aleatory probabilities. Aleatory refers to inherent randomness, like a coin toss. Epistemic is about uncertainty due to lack of knowledge. In the fraud case, the model's 70% is epistemic—it's based on available data, not randomness. When the claim isn't fraudulent, it reveals the model's uncertainty but doesn't mean the probability was wrong. The model's assessment was about the evidence, not the event itself.

  In the medical scenario, the 90% is also epistemic. The doctor's probability comes from clinical trials, which are frequentist, but applied to an individual, it's an epistemic judgment. However, the patient and family interpret the outcome as revealing the "true" probability. They conflate the outcome with the probability's accuracy because the stakes are personal and emotional. There's a need for certainty in high-stakes situations, leading to hindsight bias.

  For bookmakers, their odds are about balancing the book, not the actual event probability. So the odds reflect market actions and risk management, not a belief about the outcome. Legal cases can't rely solely on probabilities because of the presumption of innocence and the need for individual proof, not statistical likelihood.

  The asymmetry arises from how much the probability depends on hidden information. In fraud detection, there's uncertainty about the claim's details—it's about incomplete knowledge. In medicine, while there's biological variability (aleatory), the patient's outcome feels like it should have been knowable, making the epistemic aspect more salient. The emotional stakes amplify this, as does the doctor-patient relationship where conveying certainty (even if probabilistic) is expected.

  The user also mentioned courts not convicting on probability alone. That's because legal decisions require evidence beyond statistical likelihood to avoid miscarriages of justice. Each case must be proven individually, not based on group data.

  So the established concepts here are the aleatory/epistemic distinction, reference class problem (which group does the individual belong to?), and moral taint (blaming the probability when outcomes are bad). But the deeper issue is the conflation of an outcome with the probability's validity, especially when hidden information exists. The user needs a term—perhaps "single-outcome retrodictive fallacy" or "epistemic probability outcome conflation." But more importantly, they need the framework to explain why the asymmetry exists: the combination of stakes, hidden information, and the nature of the probability's basis. 

  I should also address why the fraud model is immune: it's explicitly a decision tool over many cases, not a statement about one event. The medical probability feels like a promise due to emotional stakes. The bookmaker is about risk pricing. The legal example shows that probabilities alone can't determine individual culpability. 

  In conclusion, the asymmetry stems from misinterpretation of epistemic probabilities in high-stakes, personal contexts where outcomes are mistakenly seen as validating or invalidating the probability, unlike contexts where the probabilistic nature is accepted as part of aggregate decision-making.
answer: |-
  This is a profound and beautifully articulated question that cuts to the heart of probability interpretation, epistemology, and human psychology. Your observation is astute: the *same* probabilistic statement about a single event is treated as **robust to a single outcome** in one context (fraud model) and **falsifiable by a single outcome** in another (oncologist), while bookmakers operate in a third space. No single established term perfectly captures this asymmetry, but the conceptual landscape provides the tools to dissect it. Let's carve the joint.

  ## Core Conceptual Framework: Aleatory vs. Epistemic & The Reference Class Problem

  1.  **Aleatory vs. Epistemic Probability:**
      *   **Aleatory:** Probability arising from *inherent randomness* in a physical process (e.g., flipping a fair coin, radioactive decay). The outcome is genuinely chancy.
      *   **Epistemic:** Probability arising from *uncertainty due to incomplete knowledge*. The outcome is determined but unknown to us (e.g., fraud status, whether a specific person has a disease, guilt of a defendant).

      Your fraud model's 70% is **overwhelmingly epistemic.** The claim *is* either fraudulent or not; there's no quantum dice roll deciding it. The "70%" quantifies the model's *uncertainty* based on the *evidence* (features of the claim, claimant history, etc.). The outcome reveals the truth but doesn't invalidate the *assessment of the evidence available at the time*. It was a statement about the *weight of evidence*, not a prediction of a random outcome.

      The oncologist's 90% is **primarily epistemic with an aleatory component.** The success *for an individual* depends on complex, incompletely understood biological factors (epistemic uncertainty) *and* inherent biological variability/stochasticity (aleatory element). Crucially, the 90% comes from a **reference class:** clinical trial participants with similar characteristics. The uncertainty is about how well *this specific patient* fits into that class and whether unknown individual factors prevail.

  2.  **The Reference Class Problem (Key to the Asymmetry):**
      *   Formulated by Venn and later emphasized by Reichenbach and Keynes, this is the fundamental difficulty in assigning a probability to a *single* event: **Which group (reference class) should we use to derive the probability?**
      *   Your fraud model implicitly assigns the claim to a reference class (e.g., "claims with features X, Y, Z"). The 70% is the estimated proportion of fraud *within that class*. The single outcome doesn't disprove the proportion within the class; it just shows *this specific claim* wasn't in the fraudulent subset. Auditing the model checks the *calibration* of its probabilities over the *whole class*.
      *   The oncologist assigns your sister to a reference class (e.g., "Stage IIIB patients with biomarker Z, age range, given Treatment T"). The 90% is the observed success rate *within that class*. When she fails treatment, the family (intuitively, often correctly) questions: **"Was she *truly* a member of the 90% class, or was there something different/unseen/unaccounted for?"** The single outcome *suggests* she might belong to a different reference class (the 10% class) defined by unknown factors. The probability isn't "wrong" about the *trial population*, but its applicability to *this specific individual* feels challenged by the outcome.

  ## Why the Asymmetry? Key Differentiating Factors

  1.  **Nature of Uncertainty & "Hidden Information":**
      *   **Fraud Model:** Uncertainty is almost purely epistemic ("We don't know the full truth yet"). The model's output is explicitly a measure of *evidential strength*. The outcome resolves the hidden information but doesn't change the fact that the evidence *warranted* a 70% suspicion. The model's job is to *flag for review*, not infallibly divine truth.
      *   **Oncologist:** Uncertainty has a significant aleatory component ("Biology is complex and variable"), *but* the outcome *feels* like it reveals hidden information *specific to the individual* that should have been known or accounted for ("What made *her* different?"). The 90% feels like a prediction *about her*, not just about a class. Her outcome *contradicts the expectation* generated by the class probability.
      *   **Bookmaker:** Uncertainty is aleatory *for the punter*, but epistemic *for the bookie*. The bookie's odds are **not primarily about the true probability of the event.** They are a **risk management tool** balancing the book to ensure profit regardless of the outcome. Odds reflect market sentiment, desired profit margin, and managing liability. A single loss doesn't "prove" the odds wrong about the match; it might just mean the bookie successfully balanced their books or misjudged the market. The outcome is judged against the *bookie's financial outcome*, not the event's inherent probability.

  2.  **Stakes and Emotional Salience:**
      *   **Fraud Model:** Stakes are financial and institutional. A single error is a cost of doing business within a calibrated system. Emotion is low.
      *   **Oncologist:** Stakes are existential and deeply personal. Hope, fear, and grief are central. The 90% offered hope; the 10% outcome feels like a devastating betrayal of that hope. Assigning blame (even to an abstract probability) is a natural, though flawed, coping mechanism. The outcome *demands* an explanation beyond "bad luck."
      *   **Bookmaker:** Stakes are financial for both parties. Emotion is high for the gambler (who *does* often treat the outcome as validating/invalidating the odds!), but the bookie's operation is coldly financial.

  3.  **Agency and Explanation:**
      *   **Fraud Model:** The "cause" of a non-fraudulent outcome in a 70% case is easily understood: the evidence was suggestive but incomplete/misleading. No deep mystery.
      *   **Oncologist:** The "cause" of treatment failure is often unknown or complex. There's a strong desire for a *specific reason* why *she* was in the 10%. Saying "the 90% was right for the class, she was just unlucky" feels inadequate and dismissive of her unique experience. It avoids the difficult question of individual variation.
      *   **Bookmaker:** The "cause" of an upset is usually knowable (a player got injured, made a mistake, etc.) and doesn't inherently challenge the bookie's odds-setting logic, which was about risk, not prophecy.

  4.  **Relationship Dynamics:**
      *   **Fraud Model:** Transactional, institutional. The model is a tool.
      *   **Oncologist:** Deeply personal, trust-based, involving care and vulnerability. The doctor delivers news with profound human impact. The probability feels like part of a promise or covenant, making its "failure" personal.
      *   **Bookmaker:** Transactional, adversarial.

  ## The Legal Case: "95% Probability Defendant was at the Scene"

  *   Courts reject conviction based *solely* on such probabilities for crucial reasons:
      *   **Presumption of Innocence:** Requires proof *beyond reasonable doubt* of *this individual's* guilt, not high probability based on group data.
      *   **Reference Class Problem:** Defining the class ("people whose location data looks like this") is fraught. Is it people with *his* phone? People in *that* area? People matching *his* profile? The mismatch can be enormous.
      *   **Prosecutor's Fallacy:** Confusing P(Evidence | Innocent) with P(Innocent | Evidence). A 95% probability based *only* on location data likely commits this egregiously. "95% of people with this location pattern were at the scene" is *not* the same as "There's a 95% chance *this* defendant was at the scene." The single outcome (guilt or innocence) *is* treated as definitively showing whether the probability statement about *this individual* was "right" or "wrong" because the legal verdict *determines* the truth for that individual.

  ## Naming the Asymmetry & Candidate Framings

  While no single term is universally established, these capture aspects:

  1.  **The Single-Outcome Retrodictive Fallacy (SORF):** The error of using a single outcome to retroactively judge the *correctness* of an *epistemic* probability statement about that specific event. (Highlights the flawed logic).
  2.  **Epistemic Probability Outcome Conflation (EPOC):** Conflating the *resolution of uncertainty* (the outcome) with the *invalidation* of the *degree of uncertainty* (the probability) expressed beforehand, specifically for epistemic probabilities. (Highlights the core confusion).
  3.  **Contextual Probability Robustness (CPR):** The phenomenon where the perceived robustness of a single-event probability to its outcome depends critically on context (stakes, nature of uncertainty, agency, relationship). (Highlights the variability).

  **Your Question: "What makes the fraud model 70% immune?"**
  The fraud model probability is recognized as purely **epistemic** and **class-relative**. It's a **decision-aid** flagging claims for review based on evidence patterns. The single outcome resolves the specific uncertainty but doesn't challenge the model's calibration over its defined reference class. The context is **low emotional stakes** and **institutional decision-making** where aggregate performance matters.

  **Your Question: "What makes the oncologist's 90% vulnerable?"**
  The oncologist's probability, while derived from a class, is **interpreted personally** as a **prediction about the individual**. The outcome **feels revelatory** of hidden individual factors, challenging the applicability of the reference class. The context involves **high existential stakes, emotional trauma,** and a **personal relationship**, triggering a search for individual explanation and sometimes blame. The **aleatory component** ("bad luck") feels insufficient.

  **Bookmaker:** Operates in a **risk-management** paradigm. Odds are **prices**, not beliefs. Success is measured by **financial outcome over many events**, not predicting single matches. Immune in the way you described.

  **Legal Case:** Rejects probabilistic conviction due to **foundational legal principles** (presumption of innocence, individualized justice), the **extreme danger of the reference class problem**, and the **risk of fallacious reasoning** (Prosecutor's Fallacy). The single outcome (verdict) *defines* the truth for the individual, retroactively making any prior probability statement about *their specific guilt* either "right" or "wrong" in the eyes of the law.

  ## Conclusion: The Pattern Holds

  The pattern doesn't dissolve; it reflects deep truths about how humans interpret and react to probability in different contexts involving single events. The core drivers are:

  1.  **The dominant type of uncertainty (epistemic vs. aleatory).**
  2.  **The salience of the reference class problem and its challenge to individual applicability.**
  3.  **The stakes and emotional context.**
  4.  **The purpose of the probability statement (evidential assessment, personal prediction, risk pricing).**
  5.  **The need for individual explanation vs. acceptance of aggregate statistics.**

  The asymmetry arises because in high-stakes, personal contexts (medicine, law applied to individuals), we desperately want probabilities to be **intrinsic properties of the single event** ("*Her* chance was 90%"), but they are fundamentally **relational properties** ("Given what we know about people *like her*, the chance is 90%"). The single outcome starkly highlights this tension, making the relational nature feel inadequate or even "wrong" when the outcome is adverse. In lower-stakes, institutional contexts focused on aggregate performance (insurance, bookmaking), the relational/class-based nature is more readily accepted, and the single outcome is correctly seen as just one data point for calibration. The philosopher's old fight about single-case probabilities is alive and well, manifesting in these deeply human reactions.
