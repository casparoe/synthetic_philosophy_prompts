prompt: |-
  A historian friend of mine keeps firm score on which historical episodes deserve the word "collapse" and which were merely wrenching change. Her track record so far: the Western Roman Empire in the fifth century — collapse; the ninth-century abandonment of the southern Maya lowlands — collapse; the eastern Mediterranean around 1200 BC — collapse; the Black Death in fourteenth-century Europe — not a collapse, whatever the death toll; the handloom weavers ruined by mechanization — not a collapse; the Meiji dismantling of the samurai order — not a collapse. Three new cases are coming up. First, Easter Island before European contact: deforestation ended monumental moai production, but a smaller Rapanui society endured and adapted. Second, Angkor in the fifteenth century: the enormous hydraulic city was emptied, yet its population redistributed into smaller settlements and the Khmer kingdom survived at reduced scale. Third, a hypothetical: a wealthy society in which fertility falls so far that the population halves over a century while living standards, literacy, and institutional continuity hold steady. Predict her verdict on each of the three cases; lay out at least two rules that fit her track record equally well but come apart on these; tell me which rule you think she is actually running, and why; and propose the further case that would best discriminate between the candidate rules.
reasoning: |-
  Okay, let me tackle this historian's classification puzzle. The user presents a fascinating challenge about distinguishing true "collapse" from mere transformation, with clear historical examples and three new test cases. 

  First, I need to internalize the historian's established judgments. The Western Roman Empire, southern Maya, and Late Bronze Age collapses all involve irreversible disintegration of core institutions and identities. In contrast, the Black Death, handloom weavers, and Meiji reforms show severe disruption but preserved continuity - societies absorbed the shock and evolved.

  Now for the new cases: 

  Easter Island seems tricky. The moai-building civilization ended abruptly, but Rapanui culture adapted into a smaller sustainable society. That feels like institutional rupture but cultural survival. Angkor's case is clearer - the city emptied, but Khmer institutions persisted regionally. The fertility decline scenario is purely demographic contraction without systemic failure. 

  The real puzzle is extracting competing rules from her pattern. Rule A could focus on institutional discontinuity, Rule B on demographic/territorial dissolution. But they diverge on Easter Island - was the socio-political break sufficient? 

  I suspect she leans toward Rule A (institutional rupture) because: 
  1) Rome/Maya/Late Bronze all show governing structure annihilation 
  2) Angkor maintained kingdom continuity despite urban abandonment 
  3) Her rejection of Black Death as collapse emphasizes institutional resilience 

  To test this, a perfect discriminatory case would be Tokugawa Japan's fall: the shogunate collapsed (institutional rupture) but population/territory remained intact, which would split the two rules cleanly.

  The user's framing suggests deep interest in historical taxonomy. I should emphasize how these definitions reveal what we consider society's "core" - is it people, territory, or governing structures? The hypothetical fertility case brilliantly isolates demographic change from systemic failure.
answer: |-
  Based on your historian friend's track record and the three new cases, here's the breakdown:

  **Predicted Verdicts:**
  1.  **Easter Island:** **Not a Collapse.** While monumental society ceased, a smaller, adapted Rapanui society endured with cultural continuity. This parallels the *persistence* seen in Black Death Europe or Meiji Japan, despite massive change.
  2.  **Angkor:** **Not a Collapse.** The specific urban center was abandoned and the scale reduced, but the core Khmer kingdom, its institutions (monarchy, religion, administration), and population endured in a redistributed form. This mirrors the survival of the *entity* (like Europe or Japan) despite severe disruption, unlike the *disappearance* of the Western Roman state or Classic Maya polities.
  3.  **Hypothetical Fertility Decline:** **Not a Collapse.** Living standards, literacy, and institutions remain stable. This is purely a managed demographic transition, however drastic, without systemic failure or loss of essential complexity/identity. It lacks the institutional disintegration defining her "collapse" cases.

  **Two Candidate Rules Fitting the Track Record:**

  1.  **Rule A (Institutional/Sovereign Discontinuity):** "Collapse" requires the *irreversible dissolution of core political institutions, central authority, and the sovereign identity* of the society as a recognizable, unified entity within its former domain. Mere severe disruption, population loss, or economic change within enduring institutions/identity does not qualify.
      *   *Fits Track Record:*
          *   Collapse: Western Rome (Empire dissolved), Southern Maya (city-states abandoned, political structure gone), Eastern Med. 1200 BC (palace systems/kingdoms collapsed).
          *   Not Collapse: Black Death (Church/Monarchies persisted), Handloom Weavers (State/Industrial economy continued), Meiji (Japanese state transformed but persisted).
      *   *Applies to New Cases:*
          *   Easter Island: **Not Collapse** (Clan/tribal societal structures likely persisted in adapted form, Rapanui identity endured).
          *   Angkor: **Not Collapse** (Khmer Kingdom, monarchy, state identity endured at reduced scale).
          *   Hypothetical: **Not Collapse** (Institutions explicitly stable).

  2.  **Rule B (Loss of Essential Complexity/Scale):** "Collapse" occurs when a society undergoes a *rapid, significant, and enduring reduction in socio-political complexity, economic integration, and population density/settlement scale within its core territory*, leading to the effective abandonment of its previous peak-level organization and identity. Resilience through adaptation at a lower level of complexity does not preclude collapse.
      *   *Fits Track Record:*
          *   Collapse: Western Rome (Imperial complexity/large cities lost), Southern Maya (Urban centers/elite culture abandoned), Eastern Med. 1200 BC (Palace economies/literacy/trade networks collapsed).
          *   Not Collapse: Black Death (Complexity rebounded relatively quickly), Handloom Weavers (Part of industrial *increase* in complexity), Meiji (Increased complexity/modernization).
      *   *Applies to New Cases:*
          *   Easter Island: **Collapse** (Monumental society/high social complexity ended, population dropped drastically, core identity adapted/changed).
          *   Angkor: **Collapse** (Enormous integrated hydraulic city abandoned, peak complexity lost, core territory depopulated).
          *   Hypothetical: **Not Collapse** (Complexity/scale reduction is purely demographic; socio-economic/institutional complexity remains *stable*).

  **Which Rule is She Likely Running?**
  Based on the track record, **Rule A (Institutional/Sovereign Discontinuity)** is the more likely candidate. Here's why:

  1.  **Black Death Distinction:** Her verdict here is crucial. Rule B ("Loss of Essential Complexity/Scale") *could* arguably classify the Black Death as a collapse due to massive population loss and temporary economic/social regression. Her firm "not collapse" verdict strongly suggests the *persistence of core institutions and identity* (monarchies, church, feudal structure, European polities) is the deciding factor, aligning perfectly with Rule A.
  2.  **Meiji Distinction:** The dismantling of the samurai order was a massive, deliberate socio-political transformation, reducing the complexity/status of a key class. Rule B might struggle to distinguish this cleanly from a "collapse" of that specific order. Her "not collapse" verdict emphasizes the *continuity of the Japanese state and national identity* through radical reform, again favoring Rule A.
  3.  **Angkor Interpretation:** Her likely "not collapse" verdict hinges on the survival of the Khmer kingdom as a sovereign entity, despite abandoning its capital and reducing scale. Rule B would struggle to see this as anything but a collapse of the peak urban complexity. Rule A explains it through institutional/political continuity.

  **Discriminatory Case:**
  To definitively distinguish between Rule A and Rule B, propose a case involving **the rapid, violent overthrow and dissolution of a centralized state apparatus and ruling elite, *without* significant depopulation, loss of territory, or long-term reduction in socio-economic complexity, where a new state structure quickly emerges in the same territory.**

  *   **Example: The Fall of the Tokugawa Shogunate / Meiji Restoration in Japan (1868)**. This is distinct from the later *dismantling of the samurai order* she already ruled on.
      *   **What Happened:** The centralized Tokugawa Shogunate was overthrown in a civil war (Boshin War). The Shogunate's institutions and authority were completely dissolved. The Emperor was "restored" as sovereign, and a new Meiji government rapidly established, initiating modernization.
      *   **Why it Discriminates:**
          *   **Rule A (Institutional Discontinuity):** Would likely classify this as **Collapse**. The core sovereign institution (Shogunate) was violently dissolved, its authority vanished. A *new* state structure emerged, even if in the same territory and rebuilding complexity rapidly.
          *   **Rule B (Loss of Complexity/Scale):** Would likely classify this as **Not Collapse**. While political upheaval was extreme, there was no significant depopulation, loss of territory, or enduring reduction in socio-economic complexity. The transition was relatively rapid, and complexity soon increased dramatically under the Meiji state. The scale (population, territory) remained intact.
      *   **Her Likely Verdict (based on Rule A):** If she runs Rule A, she would likely call the *overthrow of the Shogunate itself* a **Collapse** of that specific political entity. If she runs Rule B, she would likely call it **Not a Collapse** due to the lack of demographic/territorial loss and rapid rebuilding. Her reasoning would reveal the core principle. (Note: Her prior verdict on the *dismantling of the samurai order* post-restoration was "not collapse" – consistent with Rule A seeing the *Japanese state* as continuous, just reforming its class structure).
