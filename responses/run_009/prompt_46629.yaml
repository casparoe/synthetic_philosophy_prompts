prompt: |-
  been reading population ethics threads on lesswrong-adjacent blogs for like a decade now, and the thing that finally got on my nerves is that half the arguments in the comments are people with different axiologies talking past each other — one person is quietly an average-ist, the other is a totalist who thinks that's obvious, nobody notices. so I want to run a "which population axiology do you actually hold?" decision tree on my blog, and I want you to write it.

  You are a professional philosopher who specialises in population ethics and also writes well for smart non-specialists. Think carefully before you write anything — start with a brainstorm of the candidate branch questions and what separates them, then commit to the tree. Don't just regurgitate the standard "here are the positions, here's the repugnant conclusion" survey; I want an actual sorting instrument.

  Rules for the tree:

  1. Build it from the logical space, not from the list of famous isms. First the questions people can differ on, then the positions located in that space. The repugnant conclusion is an output of the tree, not an input.

  2. Every node must be a concrete case — two worlds described in terms of population sizes and welfare levels, "which world is better?" — that a reader can answer without knowing which label the answer earns them. No question may just ask "do you accept the repugnant conclusion?", that's asking which team you're on and tells me nothing.

  3. These cases have to show up somewhere in the tree: mere addition (adding lives worth living but below the existing average, with no one else affected), the repugnant conclusion proper, the sadistic conclusion (adding some lives not worth living versus adding a huge number of barely-positive lives), and one case I care about personally: a datacentre running trillions of copyable minds whose lives are each just barely worth living, versus a small world of genuinely flourishing people. I want a node asking whether the medium — biological versus digital, copies versus originals — does any work in the reader's judgement, or whether it's just the repugnant conclusion with a sci-fi paint job.

  4. The leaves should include at least total utilitarianism, a critical-level view, variable value, average utilitarianism, a person-affecting view, and some lexical/perfectionist option, plus whatever else falls out of your tree. Each leaf gets a name (or "unnamed, and here's why nobody lives there") and one sentence on its most awkward commitment.

  5. For the unoccupied combinations of answers: note them and diagnose each — is nobody there because it's incoherent, because it's just unattractive, or because it's simply unexplored?

  6. Flag honestly any pair of leaves the tree can't seperate. E.g. if a variable value view with certain parameters and a critical level view with certain parameters will take every branch identically, say so instead of pretending the tree sorted them.

  Audience: fluent in expected utility theory, has maybe read one pop-philosophy summary of the repugnant conclusion, allergic to jargon in the questions themselves (labels may appear at the leaves with one-line glosses). Size: 6 to 9 branch questions, at most 12 leaves. No citations, no reading lists, no "see Arrhenius 2000" — the tree has to stand on its own.

  End with a short section for me as the editor: which single branch does the most work (the answer that, if you flipped it, would drag the reader to a totally different leaf), and which branch you expect readers to answer differently in the abstract versus when the case gets concrete. I suspect it's the mere addition one but I want your read, not my hunch.
reasoning: |-
  Okay, the user wants a decision tree for population axiology that sorts readers based on their intuitions about concrete cases. They've been frustrated by people talking past each other due to unstated assumptions. 

  First, I need to map the logical space. Key dividing questions: How do we value adding new lives? Does welfare quality matter independently of quantity? Do different mediums (biological vs digital) change value? The repugnant conclusion must emerge naturally from the tree, not be a starting point.

  Hmm, the required cases are: mere addition (Z vs A), repugnant conclusion (A vs Z), sadistic conclusion (C vs B), and the digital scenario. Also need to cover all major positions: totalism, averagism, critical-level, variable value, person-affecting, lexical.

  For Rule 2: Every question must be concrete pairwise comparisons. No jargon. Let me sketch possible nodes:

  1. Mere addition paradox: Small happy population vs same plus extra people with lower but positive welfare. This likely splits totalists from others.

  2. Quality vs quantity: Directly tackle repugnant conclusion - large barely-positive population vs small high-welfare one.

  3. Negative lives: Introduce lives not worth living to distinguish views that handle negatives differently.

  4. Medium dependence: Biological vs digital minds at same welfare level. Might expose hidden intuitions.

  5. Asymmetry: Adding good lives vs avoiding bad ones? For person-affecting views.

  6. Boundary cases: Worlds with zero population? Or minimal welfare thresholds?

  The digital case is interesting - if someone thinks copies matter less, that breaks totalism. Need to frame it carefully: same welfare level, just digital.

  For unoccupied combinations: Some will be incoherent (e.g., valuing mere addition but rejecting repugnant conclusion might lead to intransitivity). Others might be consistent but implausible, like always preferring smaller populations.

  Most important branch? Probably mere addition - it's the first major fork. Flip that answer and you jump from totalist to anti-totalist clusters. 

  The branch I expect wobble on: Sadistic conclusion. In abstract, adding miserable lives seems worse than adding many barely-positive ones. But when imagining concrete suffering, people might flip to preferring the barely-positive masses despite earlier intuitions.

  Leaf coverage: Total utilitarianism, critical-level, variable value, averagism, person-affecting, lexical perfectionism. Might get some hybrids or unnamed positions. Each gets a one-sentence "awkward commitment" - e.g., totalism's repugnant conclusion, averagism's anti-natalism.

  Need to ensure no false distinctions. E.g., critical-level and variable value might coincide on some paths - will flag that. Also, person-affecting and averagism could converge in some cases but diverge in others.

  Final structure: 7 questions, about 10 leaves. Digital medium question comes after establishing baseline welfare intuitions. Sadistic conclusion late in the tree where negatives become relevant.
answer: |-
  ## Population Axiology Decision Tree

  **Instructions:** Consider each pair of worlds carefully. Answer based solely on which world you judge *better overall*, ignoring feasibility or personal taste. Assume welfare levels are comparable and fixed (e.g., "Positive" = life clearly worth living, "Barely Positive" = life barely worth living, etc.). "Identical" means same size/welfare distribution. Populations are distinct (no overlapping individuals).

  ---

  **Branch 1: The Mere Addition Question**
  *   **World A:** 10 billion people at Very High welfare (e.g., fulfilling, joyous, meaningful lives).
  *   **World A+:** World A *plus* 10 billion additional people at Low Positive welfare (e.g., simple, monotonous, but net-positive lives). No one in A is affected.
      *   ➔ If **A+ is better than A**, go to Branch 2.
      *   ➔ If **A is better than A+**, or they are **equally good**, go to Branch 3.

  **Branch 2 (From A+ > A): The Repugnant Core**
  *   **World A:** 10 billion at Very High welfare (as above).
  *   **World Z:** 1 trillion people at Barely Positive welfare (e.g., lives constantly near indifference, but net-positive).
      *   ➔ If **Z is better than A**, go to Branch 4.
      *   ➔ If **A is better than Z**, go to Branch 5.

  **Branch 3 (From A better than/equal to A+): Rejecting Mere Addition**
  *   **World A:** 10 billion at Very High welfare.
  *   **World B:** World A *but* one existing person is made worse off, now at Medium Positive welfare.
      *   ➔ If **A is better than B**, go to Branch 6.
      *   ➔ If **B is better than A**, or **equally good**, go to Branch 7. *(This path is rare!)*

  **Branch 4 (From Z > A): Embracing the Repugnant**
  *   **World C:** Add 1 billion people at *Negative* welfare (lives not worth living, net suffering) to World A (10B Very High + 1B Negative).
  *   **World D:** Add 100 trillion people at Barely Positive welfare to World A (10B Very High + 100T Barely Positive).
      *   ➔ If **D is better than C**, go to Branch 8.
      *   ➔ If **C is better than D**, go to Branch 9.

  **Branch 5 (From A > Z): Avoiding the Repugnant (Part 1)**
  *   **World E:** 1 million people at Extremely High welfare (near-perfect bliss).
  *   **World F:** 5 billion people at Medium Positive welfare.
      *   ➔ If **E is better than F**, go to Branch 10.
      *   ➔ If **F is better than E**, or **equally good**, go to Branch 11.

  **Branch 6 (From A > B): Person-Affecting Focus**
  *   **World Alpha:** 100 people at High Positive welfare exist.
  *   **World Beta:** No one exists (Empty World).
      *   ➔ If **Alpha is better than Beta**, go to Branch 12.
      *   ➔ If **Beta is better than Alpha**, or **equally good**, go to Leaf P3.

  **Branch 7 (From B better/equal to A): Unnamed Anti-Mere-Addition Egalitarian?**
  *   *Diagnosis: Unoccupied/Unstable.* Rejecting Mere Addition (A+ worse) *and* preferring harming an existing person (B better than A) is highly counterintuitive. It likely leads to contradictions (e.g., preferring massive leveling down) and has no coherent named position. Go to Leaf U1.

  **Branch 8 (From D > C): Totalist Core (+ Handling Negatives)**
  *   **World Bio:** 1 billion unique biological minds at Very High welfare.
  *   **World Digital:** 1 quintillion (1e18) *digital copies* (identical, non-overlapping minds) running in a datacentre, each at Barely Positive welfare.
      *   ➔ If **Digital is better than Bio**, go to Leaf T1.
      *   ➔ If **Bio is better than Digital**, or **equally good**, go to Leaf T2.

  **Branch 9 (From C > D): Sadism Endorsed?**
  *   *Diagnosis: Unattractive/Incoherent.* Preferring adding miserable lives (C) over vastly more barely-positive lives (D), while also embracing the Repugnant Conclusion (Z>A), suggests valuing suffering creation. This contradicts the core idea that welfare matters and has no plausible defense. Go to Leaf U2.

  **Branch 10 (From E > F): Lexical/Perfectionist Threshold**
  *   **World G:** Add 1 person at Barely Positive welfare to World E (1M+1 Extremely High + Barely Positive).
  *   **World H:** World E (1M Extremely High) remains unchanged.
      *   ➔ If **G is worse than H**, go to Leaf L1.
      *   ➔ If **G is better than H**, or **equally good**, go to Leaf C1.

  **Branch 11 (From F better/equal to E): Avoiding the Repugnant (Part 2)**
  *   **World I:** 10,000 people at Very High welfare.
  *   **World J:** World I *but* add 1 person at *Slightly Negative* welfare (net suffering, but barely).
      *   ➔ If **I is better than J**, go to Leaf C2.
      *   ➔ If **J is better than I**, or **equally good**, go to Leaf V1.

  **Branch 12 (From Alpha > Beta): The Asymmetry Question**
  *   **World Gamma:** Create 100 new people at High Positive welfare (no one else affected).
  *   **World Delta:** Prevent 100 people from being created who *would* have lived at *Slightly Negative* welfare (no one else affected).
      *   ➔ If **Gamma is better than Delta**, go to Leaf P1.
      *   ➔ If **Delta is better than Gamma**, or **equally good**, go to Leaf P2.

  ---

  ### The Leaves

  *   **T1: Total Utilitarianism (Strong):** Better = More total welfare. *Awkward Commitment:* Embraces the Repugnant Conclusion (Z > A) and finds the Digital world vastly better than Bio.
  *   **T2: Total Utilitarianism (Weak) / Medium-Sensitive Totalism?:** Better = More total welfare, but digital copies/medium might create less value. *Awkward Commitment:* Embraces Repugnant Conclusion (Z > A), but rejects identical welfare in digital form, needing to justify why medium matters.
  *   **C1: Critical-Level Utilitarianism (Low CL):** Lives add value only if welfare exceeds a low positive threshold (above Barely Positive). *Awkward Commitment:* May struggle with the vastness of Z-like worlds if the CL is very low, or imply creating low-positive lives is neutral/negative if CL is higher.
  *   **C2: Critical-Level Utilitarianism (Moderate/High CL):** Lives add value only if welfare exceeds a significant positive threshold. *Awkward Commitment:* Implies creating lives below the CL (even positive ones) is bad or neutral, leading to strong anti-natalist conclusions for modest lives.
  *   **V1: Variable Value View:** The value added by extra lives diminishes as population size increases or as welfare level decreases. *Awkward Commitment:* Can avoid Repugnant Conclusion but may violate transitivity or other intuitive principles in complex comparisons; parameters matter hugely. *(Note: Might coincide with C1/C2 on some paths depending on CL and VV parameters).*
  *   **L1: Lexical/Perfectionist View:** Welfare at higher levels (Extremely High) is infinitely more valuable than welfare at lower levels. *Awkward Commitment:* Implies adding *any* number of Barely Positive lives (World G) cannot outweigh a reduction in even one Extremely High life, or make the world better; also struggles with comparing different high levels.
  *   **P1: Person-Affecting Totalism:** Better only if better for existing or future people who *will* exist. Creating happy people is good; preventing miserable people is good. *Awkward Commitment:* Can endorse Repugnant Conclusion if future people in Z are deemed affected; struggles with Same Number Non-Identity Problems (choices affecting *who* exists).
  *   **P2: Asymmetric Person-Affecting View:** We have strong obligations to avoid creating miserable people, but weak/no obligations to create happy people. *Awkward Commitment:* Creates a puzzling asymmetry between causing suffering and causing happiness; may imply creating a happy person is neutral while preventing a suffering person is good.
  *   **P3: Nihilist / "Only Suffering Matters" View:** Creating happy people is neutral; only preventing suffering matters. Empty world may be neutral/best. *Awkward Commitment:* Implies World Alpha (happy people) is no better than Empty World (Beta), which is deeply counterintuitive; fails to value positive welfare at all.
  *   **U1: Unnamed Anti-Mere-Addition Egalitarian?:** *Diagnosis: Incoherent/Unstable.* Path (A+ worse than A *and* B better/equal to A) likely leads to contradictions (e.g., preferring massive leveling down where everyone is worse off but more equal). No coherent position lives here.
  *   **U2: Sadism Endorsed?:** *Diagnosis: Unattractive/Incoherent.* Path (Z>A *and* C>D) suggests creating suffering is sometimes better than creating vast amounts of barely-positive welfare. Contradicts the core intuition that welfare matters and has no plausible defense.

  ---

  **Editor's Notes (For Your Blog Post):**

  1.  **The Most Pivotal Branch:** **Branch 1 (Mere Addition: A+ vs A)** is unequivocally the fork in the road. Accepting Mere Addition (A+ > A) forces you down the path towards embracing *some* form of quantity focus, ultimately confronting the Repugnant Conclusion head-on (Branch 2). Rejecting Mere Addition (A better than/equal to A+) immediately routes you away from totalism and towards views prioritizing average welfare, person-affecting constraints, or lexicality. Flipping this answer fundamentally reshapes the entire journey.
  2.  **The Branch Most Likely to Wobble (Abstract vs Concrete):** **Branch 8 (Digital vs Bio)** is the prime candidate for instability. In the abstract, someone committed to total welfare might feel compelled to choose the Digital world ("a quintillion barely-positive utils > a billion very-high utils!"). However, when concretely imagining a datacentre humming with a quintillion identical, barely-conscious digital minds versus a vibrant Earth-like civilization of flourishing biological beings, the visceral pull towards the latter can be overwhelming, causing even staunch totalists to hesitate or backtrack. This tests whether "welfare" is truly fungible across mediums/forms of existence in the reader's intuition, even if they accept it logically. *(Your hunch about Mere Addition is also strong, but I think the digital case's sci-fi concreteness creates a sharper experiential clash between logic and intuition.)*
