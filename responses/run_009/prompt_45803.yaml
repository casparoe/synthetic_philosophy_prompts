  This framework provides precise conceptual tools for your clinical reasoning: The arrhythmia drug possesses a *masked disposition* (it *is* harmful, but the harm is prevented). The toxin possesses a *self-neutralizing disposition* (it *is* toxic, but its primary harm is intrinsically prevented upon triggering). The harmless substance exhibits *dispositional mimicry* (it *is not* emetic, even though vomiting follows administration due to context).
