prompt: |-
  So my friend and I had another three hour argument about forgeries last night (this has become a weird recurring thing between us) and it left me with a position I now have to defend in public, which was probably a mistake. Backstory: I'm giving a talk next month at a meeting of a regional aesthetics society defending what my friend sarcastically calls my "funny money theory of originals." The view, roughly: the extra value we attach to originals -- the value that a perfect forgery can't capture even when literally no one can ever tell the difference -- isn't in the object, and it also isn't some deep fact about the artist's performance (I know, the Dutton people in the room will hate this). It's institutional in a very specific way: an original painting functions like legal tender. Its "originality value" supervenes on the artworld's provenance-tracking practices actually working the way they're supposed to, the same way a twenty dollar bill's value supervenes on the mint and the banking system and not on the paper or the ink. A perfect forgery is then exactly like a perfect counterfeit: aesthetically indistingishable, but still a counterfeit, because it inserts a fake node into the tracking system, and that insertion is the whole of the wrong-making feature. No mysticism about the artist's hand, no epistemic harm to future viewers (there are none, by hypothesis).

  My friend's strongest comeback, which I still don't have a clean answer to, was that money-value is openly and unembarrassingly conventional while our response to originals doesn't feel conventional at all -- standing in front of the actual Rembrandt feels like responding to *it*, not to a record-keeping system -- so my view either (a) misdescribes the phenomenology of valuing art, or (b) is secretly normative, i.e. telling everyone they should stop feeling what they in fact feel, which I don't want to claim either.

  The audience: mostly aestheticians. At least one person who thinks Dutton's performance argument is basically right -- art objects are records of achievement, the original is the authentic record, forgery is fraud on the achievement. A Goodmanian who will absolutely bring up the autographic/allographic distinction and ask why I'm only talking about paintings and what happens to my view for music or literature. A couple of anti-theorists who think "where does the value reside" is a badly posed question from the start. And a bunch of grad students who mainly want to talk about NFTs.

  Draft my prep sheet: the seven or eight objections I'll actually get from this particular room (not the generic ones from the internet), ordered by how much damage they'd do, each phrased the way the person behind it would phrase it -- the Duttonian, the Goodmanian, the anti-theorists, and the grad students all phrase things differently, so say who's likely behind each one -- with a two minute reply for each and an honest note about where the reply is soft. Work my friend's objection in there somewhere, since someone in that room will independently think of it. And include the question I'm hoping nobody asks -- the one where my own view is one step away from saying something embarrassing about originality mattering less than everyone thinks -- and what I should say if it comes anyway. Also give me a quick read on the NFT thing: do I bring it up proactively as a strength of my view (provenance tracking is literally what blockchain people think they invented) or pray it never comes up?
reasoning: |-
  Okay, the user is preparing for a talk defending their "funny money theory of originals," where they argue that the extra value of an original artwork is institutional, like legal tender, based on provenance-tracking systems. Their friend's objection is that this feels misaligned with the phenomenological experience of viewing an original—people feel they're responding to the artwork itself, not a system. The audience includes various aestheticians with differing views.

  First, I need to address the friend's objection about phenomenology. The user must reconcile the institutional aspect with the personal experience. Maybe they can argue that the institutional framework enables the psychological response. People trust the system, which allows them to feel connected to the artist. The value isn't in the physical object, but the system enables the emotional experience. That could bridge the gap without denying the feeling.

  Next, the Dutton performance argument. The user dismisses the artist's achievement as the source of value. They need to counter by emphasizing that the achievement is recorded through provenance, not inherent in the object. A forgery falsifies this record, similar to counterfeiting money which also represents a value it doesn't have. The soft spot here is reducing artistic achievement to a ledger entry, which might not satisfy those who value the creative act itself.

  The Goodmanian will question why focus on autographic arts like paintings when allographic arts (music, literature) have originals too. The user should clarify that their theory applies where provenance matters, like physical artworks. For allographic works, the focus shifts to the instance's legitimacy (e.g., first edition vs. reprint). The weakness is explaining why provenance tracking is less critical in allographic arts, which might not hold if original manuscripts are valued similarly.

  Anti-theorists might challenge the entire premise, saying the question is flawed. The user can pivot to discussing the institutional practices that create value, framing it as a descriptive account of current systems. However, this might not engage the anti-theorists' deeper skepticism about such inquiries.

  Grad students will bring up NFTs. The user can use this as a strength—NFTs highlight provenance tracking via blockchain. But caution is needed since NFTs are controversial and not equivalent to physical art. The user should note similarities while distinguishing the physicality aspect.

  The lurking problem is that if originality is merely institutional, does that mean it's arbitrary? The user needs to argue that while the system is contingent, it's deeply embedded in art practices. Yet, this might imply originality isn't inherently valuable, which could undermine traditional views.

  For each objection, crafting concise replies that acknowledge weaknesses is key. The user should prepare to admit where their theory has limitations but hold the core argument. Balancing the institutional view with phenomenological experiences remains the toughest challenge, requiring careful framing to avoid dismissing personal connections to art.
answer: |-
  Here's your prep sheet, designed for maximum damage control against this specific crowd. I've ordered objections by potential impact, included speaker archetypes, and provided tactical replies with vulnerability notes. Your friend's phenomenology objection is #2 (high damage).

  **Core View Recap:** Originality value = institutional certification function (like legal tender). Forgery = counterfeit ledger entry. No inherent aura, no performance magic.

  ---

  ### **Top 7 Objections + Replies** (Ordered by Damage Potential)

  1.  **The Duttonian (Performance Purist):**  
      *Phrasing:* "You reduce Rembrandt's struggle, his genius embodied in each brushstroke, to a *ledger entry*? A forgery isn't just fake provenance – it's a lie about human achievement! The original *is* the trace of that performance. Your 'money' analogy trivializes art into commerce."  
      *Reply (1.5 min):* "I agree forgery *is* a lie about achievement – but the *value* of accessing that achievement supervenes on the certification system. Think of a Nobel Prize medal: its value as a record of achievement depends entirely on the Nobel Committee's verification. Melt it down, the gold has commodity value, but the 'Nobel-ness' is gone. Similarly, Rembrandt’s genius is real, but our *access* to trusting we are in its presence requires a functioning verification system. The brushstrokes matter as data *for* that system. The forgery fails because it inserts false data, corrupting the record, not because the physical trace is metaphysically different."  
      *Soft Spot:* Concedes the importance of achievement but risks sounding like it reduces art to "data." Needs strong emphasis that the system *tracks* the achievement.

  2.  **The Phenomenologist (Your Friend's Objection):**  
      *Phrasing:* "This feels deeply wrong experientially. Standing before the *actual* Van Gogh in Arles, the intensity isn't me going 'Ah, the verified ledger entry!' It's an almost visceral connection *to him*, *through the object*. Your theory replaces awe with bureaucracy. Are you saying my feeling is *mistaken*, or just an illusion generated by the institution?"  
      *Reply (2 min):* "Neither! The institution *enables* and *structures* that feeling. Think of holding a $20 bill: you don't feel awe for the Treasury's database, but your confidence *in* that system allows you to experience the paper *as* having value. Remove the system, and it's just paper. Similarly, the artworld's provenance system (museums, experts, documentation) creates the scaffold of trust that allows you to experience the object *as* Van Gogh's direct presence. The feeling is real and valid, but its *object* – the 'originality' component – is constituted by the reliable connection the system provides. The forgery severs that connection, making the feeling *misplaced*, not false."  
      *Soft Spot:* Still feels like it inserts a layer between viewer/object. Hard to shake the immediacy of the experience. Best to frame the system as the *enabling condition*, not the *object* of feeling.

  3.  **The Goodmanian (Autographic/Allographic):**  
      *Phrasing:* "Interesting... for autographic works like paintings, your ledger model has some pull. But what about *Hamlet*? Or Beethoven's 5th? We value early printed editions or composer manuscripts (autographic), but the *work* exists allographically. A perfect forgery of a First Folio *is* materially identical to the 'original' – yet we still care! Does your theory implode here, or do you claim originality only matters for paintings?"  
      *Reply (1.5 min):* "It adapts! For allographic works, the 'originality value' often attaches to *specific instantiations* certified as having a privileged link: the composer's manuscript (the source), the first edition (authorized genesis), or a premiere performance recording (authentic realization). The 'ledger' here tracks the chain of custody or authorization *for that specific token*. Forging a First Folio inserts a fake token into the lineage of significant *historical artifacts*. The *work* (Hamlet) isn't forged, but the *artifact's* certified status as the originating object is. My theory explains why we care about *that specific book*, not just any copy of the text."  
      *Soft Spot:* Why prioritize *this* token over another identical one? Relies heavily on historical/cultural consensus about which tokens matter, which feels less systematic than money.

  4.  **The Anti-Theorist (Question Skeptic):**  
      *Phrasing:* "Why chase this phantom 'location' of value? 'Originality' isn't a single *thing* residing in object, performance, *or* ledger. It's a shifting constellation of practices, narratives, and desires unique to each context. Your 'money' analogy imposes a false uniformity. Isn't the real mistake reifying 'originality value' as something needing a singular explanation?"  
      *Reply (1 min):* "You're right that practices are diverse! My claim isn't that the *feeling* is uniform, but that the *functional role* enabling attributional confidence – and thus the *possibility* of those diverse practices generating intense 'original' experiences – relies on a (messy, imperfect) institutional certification system. Like money systems vary, but all rely on trust mechanisms. I'm not reifying a *feeling*, I'm identifying the *institutional infrastructure* necessary for 'this is the real thing' to have a stable meaning within the practice, upon which those rich, contextual experiences depend."  
      *Soft Spot:* Risks talking past them. They'll likely see the "infrastructure" as just another contingent practice, not foundational. Acknowledge contingency but stress systemic function.

  5.  **The Reductionist Lurking Problem (The Embarrassing Step):**  
      *(Hoping nobody asks, but prepare!)*  
      *Phrasing:* "If originality value is *only* institutional certification, contingent on the system functioning, doesn't that imply that if the system changed (or we abolished provenance tracking), originals would lose *all* extra value? So the Mona Lisa's 'originality' is just... a social habit? Doesn't this prove Dutton right – the value *must* be in the achievement itself?"  
      *Reply (2 min - Careful!):* "It *is* contingent on the system, but that doesn't make it trivial or arbitrary. *Money* relies on a contingent system, yet its value is phenomenally real and economically crucial. Abolishing art provenance *would* radically change how we value objects – they might be valued purely aesthetically, historically, or materially, but the *specific* charge of 'this is *the* one touched by Leonardo' would vanish because the verification link was severed. *That* value requires the system. The achievement is real, but its *unique* embodiment *for us* requires authentication. Without it, we have only the *idea* of the achievement, not the certified object. This doesn't lessen the achievement; it clarifies how we *access* its singular embodiment."  
      *Soft Spot:* Sounds dangerously close to admitting originality value *could* disappear, which feels counterintuitive and weak against Dutton. Emphasize the system's deep embeddedness and the loss being hypothetical/catastrophic.

  6.  **The "But What About the Object?" Critic:**  
      *Phrasing:* "Even if the ledger matters, you seem to dismiss the physical object entirely. Doesn't the *actual* paint, the *actual* aging, the *actual* material history *matter*? A perfect forgery wouldn't *be* the same object, even if indistinguishable. Isn't that the core?"  
      *Reply (1 min):* "The physical object is crucial *as the node in the system*. Its material properties are the data points the system uses for verification and upon which aesthetic experience supervenes. But the *distinctive value of it being the 'original' node* arises from its certified position in the provenance chain. Two materially identical objects (original and perfect forgery) differ *only* in their institutional history. That history isn't 'in' the paint molecules; it's recorded *about* them. The 'actual aging' matters precisely because it provides evidence *for* the system's certification."  
      *Soft Spot:* May not satisfy those with strong materialist intuitions. Requires accepting that institutional history is a real property of the object.

  7.  **The NFT Enthusiast (Grad Student):**  
      *Phrasing:* "Isn't your theory just describing NFTs? Blockchain is the perfect provenance ledger! Does this mean NFTs *are* the 'originals' in the digital realm? Is the JPEG just the 'paper'?"  
      *Reply (45 sec - Proceed with Caution):* "NFTs are a fascinating *attempt* at applying a provenance-tracking system to digital objects, highlighting the *function* I'm describing. The blockchain ledger aims to certify a unique node (the NFT token) linked to a digital file. However, key differences exist: 1) The link between token and *specific aesthetic instance* (the JPEG) is often arbitrary and can break (e.g., link rot), unlike physical paint on canvas. 2) The artworld's existing provenance system has deep historical/cultural weight and multi-layered verification (science, connoisseurship, documents), while NFTs rely solely on cryptographic ledger integrity. They demonstrate the *impulse* for certified originality, but whether they successfully replicate the *value* function within the broader artworld ecosystem is still evolving and highly contested."  
      *Should you bring it up?* **Yes, briefly, as an illustration.** Say: "Consider NFTs: their core promise is blockchain provenance – a digital ledger certifying a 'unique' node. This directly parallels my argument about the institutional foundation of originality value, while also highlighting the complexities of applying it to digital objects where material instantiation differs." Shows relevance, avoids endorsing NFTs.

  ---

  **Overall Strategy:**

  *   **Lead with Confidence:** Frame the "money" analogy as clarifying, not diminishing. Money systems are profound social technologies.
  *   **Concede Where Necessary:** Acknowledge the reality of achievement, the power of experience, the messiness of practice. Don't deny phenomenology; *explain its conditions*.
  *   **Emphasize Function:** Hammer home "certification enabling trust enabling experience."
  *   **Control the NFT Angle:** Proactively mention it as a *parallel case study* showing the *desire* for such systems. Don't get dragged into debating NFT art value.
  *   **Weakest Point:** Phenomenology/Objection #2. Your reply is the best you have, but it's philosophically tricky. Lean hard on the "enabling condition" language. If pressed, admit: "The feeling *feels* direct, but its intentional object relies on background institutional trust. We don't consciously think 'ledger!' any more than we think 'Federal Reserve!' when spending cash."
  *   **Strongest Point:** Against Goodmanian. Your extension to significant tokens in allographic works is elegant and defensible.

  **Good luck defending the Funny Money! Remember: even if they hate it, you’ve given them something concrete to argue about for the next three hours.**
