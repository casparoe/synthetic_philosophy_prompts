answer: |-
  ### Section 1: The case
  Sofia needs to reach her dentist appointment downtown by 3 PM today. She knows two bus routes: the "10A Express" and the "Downtown Direct". She recalls her friend Maria saying last week, "The 10A Express *is* the Downtown Direct route; they just renamed it." If asked, Sofia would sincerely agree they are the same route. However, when checking transit apps, she sees "10A Express" listed as "delayed" but "Downtown Direct" as "on time". Assuming these are separate services, she worries about delays and nearly books an expensive ride-share. Maria texts, "Just take the 10A Express — it *is* the Downtown Direct, so it's fine!" Sofia accepts this, sees the bus arriving as "Downtown Direct", boards confidently, and saves money.

  ### Section 2: The check
  **Before:** Sofia believes "10A Express" and "Downtown Direct" co-refer (same route). She also believes the app shows "10A Express" as delayed and "Downtown Direct" as on time.  
  **After:** Sofia accepts "10A Express = Downtown Direct" (no new proposition). She gains *no* new belief about co-reference or app status.  
  **New ability:** She settles a practical decision (boarding vs. ride-share) by integrating her knowledge. Previously, she couldn’t resolve the conflicting app data into action; now she can.

  ### Section 3: Verdicts
  **Fregean sense:** Wins. Sofia possessed two distinct modes of presentation: one tied to the historical/formal label "10A Express" (linked to delay anxieties), and one tied to the newer/branded "Downtown Direct" (linked to reliability). The identity statement collapsed these senses, merging their inferential roles. This allowed her to override the app’s misleading dual labels and act on the underlying reality (one route, one status).

  **Millianism:** Struggles. Millianism holds that "10A Express = Downtown Direct" expresses the trivial singular proposition that route R is identical to itself. Sofia already believed this. Millians must explain the cognitive gain via her *other* beliefs (e.g., about the app). But Sofia’s *only* new integration stems directly from grasping the identity. Millianism lacks the resources to explain why *this* trivial identity, at *this* moment, was crucial for action.

  **Metalinguistic proposal:** Fails. Sofia gains *no* new metalinguistic information (she already believed the terms co-referred). The proposal cannot explain the knowledge extension (her new ability to act) since its sole explanatory resource—news of co-reference—is absent. The informativeness arises purely from *reorganizing existing knowledge*, which this view cannot capture.

  ### Section 4: Load-bearing feature
  The critical feature is the **dissociation between Sofia’s declarative belief in co-reference and her ability to deploy it procedurally in a specific context**. She knows "A=B" abstractly but fails to apply it to reconcile conflicting labels in the app when planning action. The identity statement serves as a *cognitive pivot*, integrating this abstract knowledge into her situational reasoning ("these app labels describe the *same entity*, so the conflict is spurious"). Remove this dissociation (e.g., if she’d *already* used the identity to interpret the app), and it collapses into Hesperus: mere acceptance of co-reference.

  ### Section 5: The counterattack
  **Metalinguistic defender’s counter:** Deny that Sofia’s knowledge was extended *by the identity statement itself*. Argue that Maria’s text merely *reminded* Sofia of her prior belief, and the "new ability" arose from *reallocating attention* to existing knowledge, not semantic content. The real gain was pragmatic (realizing the app’s labels were inconsistent *given* the co-reference she already knew), not semantic. Thus, the identity statement was epistemically inert; its apparent informativeness is an illusion caused by its role in triggering recollection and attentional shift. The case fails to isolate semantic content as the source of extension.
