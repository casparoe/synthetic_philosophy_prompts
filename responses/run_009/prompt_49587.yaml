  Based on your friend's track record and the nuances of innateness debates in linguistics/cognitive science, here's my prediction for her verdicts on each new case, the implicit rule she's likely following, alternative rules, which cases test the boundaries, and a proposed critical test case:

  ### Predicted Verdicts:
  1. **Infants & tamarins detecting statistical syllable patterns**:  
     **→ Likely verdict: Innate**  
     *Why?* It's an automatic, input-driven pattern detection shared across species (like bat echolocation's cross-species parallels). Minimal exposure triggers a universal capacity.

  2. **Newborns preferring maternal language rhythm**:  
     **→ Likely verdict: Innate**  
     *Why?* Prenatal exposure isn't "learning" in her framework (no active acquisition/correction). It's a sensory tuning of an innate bias (like face preference), not constructive grammar-building.

  3. **Adult L2 learners plateauing with errors**:  
     **→ Likely verdict: Learned (not innate)**  
     *Why?* Errors persist *despite* input/correction, implying learning mechanisms are constrained by age-sensitive critical periods (like isolated songbirds' garbled song).

  ---

  ### Her Implicit Rule:
  **"Innate = Universally emerging without *specific* experience, or robustly triggered by *degraded* input when it reflects endogenous structure."**  
  - **Key aspects**:  
    - Focuses on **outcome resilience**: Does the behavior emerge reliably without tailored input (e.g., "goed," NSL grammar)?  
    - **Rejects** behaviors requiring *customized* environmental shaping (dog pointing, songbird song).  
    - **Distinguishes exposure from learning**: Prenatal/inherent pattern detection isn't "learning" (maternal rhythm, stats).  
    - **Critical periods matter**: If input timing dictates success (adult L2), it’s not innate.  

  ---

  ### Alternative Rules That *Also* Fit Her Track Record:
  1. **Phylogenetic Universality Rule**:  
     "Innate if present in non-human species/evolutionarily ancient."  
     *Fits*: Bat echolocation (mammals), tamarin stats (primates), face preference (cross-species).  
     *Fails?* Nicaraguan SL is uniquely human.  

  2. **Poverty of Stimulus Rule**:  
     "Innate if input is insufficient to explain complexity."  
     *Fits*: "Goed" (no irregular input), NSL (pidgin→grammar with minimal input).  
     *Fails?* Newborn rhythm preference uses *rich* prenatal input.  

  3. **Developmental Canalization Rule**:  
     "Innate if developmentally buffered against environmental variation."  
     *Fits*: Bat echolocation (no sound→normal), "goed" (varied input→same error).  
     *Fails?* Adult L2 plateaus *are* buffered (against correction).  

  ---

  ### Cases That Pull These Rules Apart:
  - **Tamarins & Statistical Learning**:  
    - Her likely "innate" verdict aligns with **her rule** (minimal input → automatic).  
    - **Phylogenetic Universality Rule** *also* predicts innate (shared with primates).  
    - **Poverty of Stimulus Rule** *fails*: Input *is* sufficient (stats are computable from exposure).  
    - **→ Tests boundary**: Is "automatic computation from input" innate or learned? Her verdict exposes her focus on *automaticity*.  

  - **Newborns & Prenatal Rhythm**:  
    - Her "innate" verdict uses **her rule** (prenatal exposure ≠ learning).  
    - **Developmental Canalization Rule** *fails*: Preference *requires* specific input (maternal speech).  
    - **→ Tests boundary**: When does "exposure" become "learning"? Her NSL verdict suggests she sees innate grammar *using* input, not *built by* it.  

  - **Adult L2 Plateau**:  
    - Her "learned" verdict uses **her rule** (failure despite input → not endogenous).  
    - **Canalization Rule** *conflicts*: Plateau *is* buffered against correction (like "goed" errors).  
    - **→ Tests boundary**: Is "irreversibility" a sign of innateness (canalization) or learning? Her songbird verdict suggests she sees critical periods as *learning* constraints.  

  ---

  ### Critical Test Case to Settle Her Rule:
  **"Feral children who invent complex grammatical structures despite *total* language deprivation."**  

  - **Why it discriminates**:  
    - **Her rule** → "Innate" (like NSL: degraded input → endogenous grammar).  
    - **Phylogenetic Rule** → "Innate" (if uniquely human).  
    - **Poverty of Stimulus** → "Innate" (zero input → grammar must be endogenous).  
    - **Canalization Rule** → "Learned" (no input → no development; like songbird isolation).  

  Her verdict would reveal whether she prioritizes **outcome resilience without input** (innate) or **environmental necessity** (learned). If she calls it "innate," her core rule is **endogenous emergence > input dependence**. If "learned," she weights **developmental triggers** more heavily.  

  ### Summary:
  Your friend’s rule centers on **whether a behavior reflects pre-specified cognitive machinery that actively structures input**. Cases like statistical learning (minimal input → automatic) and adult L2 (input resistance) stress-test her framework by contrasting *exposure* with *construction*. The feral-child case would force a choice between innateness-as-resilience and innateness-as-algorithmic-independence.
