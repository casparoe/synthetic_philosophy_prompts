prompt: |-
  My sister-in-law Renate is on the steering committee of a local voters' group, and next month they have to take a position on a state ballot measure about sex work law. The options on the table are basically the three you always hear about: the Nordic model (selling stays legal, buying gets criminalized), German-style legalization (licensed brothels, registration, mandatory health checks), and New Zealand-style decriminalization (treat it as ordinary work under normal labor and zoning law).

  Renate has never said a word about sex work itself, but she has strong opinions about every market even slightly adjacent to it, and I've been quietly keeping notes. Her track record:

  - Paid plasma donation: totally fine, she does it herself, thinks it's almost a civic duty.
  - Paid participation in drug trials: fine, admirable even.
  - Selling a kidney: against. Should be banned outright, "nobody should have to make that choice."
  - Commercial surrogacy: against, but with a twist that I thought was interesting -- she said if anyone belongs in legal trouble it's the agencies and arguably the intended parents, never the surrogate. Altruistic surrogacy (expenses covered, no fee): fine.
  - Paid egg donation: against, same reasoning as the kidney more or less.
  - Porn performing: fine, the industry should exist, she just wants performers to have unions and workplace safety rules like anyone else.
  - Camming: fine, and she actually gets annoyed when platforms impose extra rules beyond normal employment law.
  - Rent-a-friend / paid companionship services: fine, she thinks they're kind of sweet.

  The one that keeps bugging me is the plasma one -- lots of people think paying poor people for plasma is exactly the kind of exploitative market she objects to elsewhere, but she's completely relaxed about it, even donates herself. So I don't trust my first guess at what her principle is.

  I've got a bet riding on predicting her vote before the meeting. Can you help me think it through? What I want is:

  1. What rule (or rules) actually fits her verdicts? I can see at least a body-parts-versus-services story, a regulate-the-risky-venues story, and something about going after the demand side while never blaming the seller, but I can't tell which is really her, or which verdicts each one has to strain to explain.
  2. What does each of those rules predict for the three ballot options?
  3. Your best guess at which she picks, and why that rule beats the others on her record.
  4. The single further question or case I could spring on her at dinner that would best split the remaining rules -- like, something adjacent she hasn't been asked about yet, where the candidate rules give different answers.

  No fair just telling me "it's complicated and depends on her values," I know that, that's why I need the bet settled.
reasoning: |-
  Okay, let me try to figure out Renate's stance on the sex work ballot options by analyzing her previous positions. She seems to have a pattern in her views on various markets. 

  First, looking at the list: she's okay with paid plasma donation and drug trial participation, but against selling kidneys and paid egg donation. That's interesting because both plasma and eggs involve bodily fluids or tissues, but she draws a line between them. Plasma donation is renewable and low-risk, while kidneys and eggs are more permanent and involve higher risks. Maybe her main concern is about permanent loss of bodily integrity.

  For surrogacy, she opposes commercial arrangements but supports altruistic ones. She specifically targets the agencies and intended parents, not the surrogate. That suggests she's worried about exploitation in transactions where the provider is vulnerable. In porn and camming, she's fine as long as normal labor protections apply. Rent-a-friend services are also acceptable to her.

  The plasma case is tricky because it involves payment to often lower-income people, which others might see as exploitative. But Renate participates herself, viewing it as a civic duty. So it's not just about payment but the nature of the act—renewable, low-risk, and socially beneficial versus irreversible or high-risk bodily harm.

  Putting this together, her principle seems to be: **Markets are acceptable when they involve renewable services or tissues with low personal risk, but unacceptable when they involve permanent bodily loss, high risk, or irreversible harm. Exploitation concerns focus on intermediaries and buyers rather than individual sellers, especially in vulnerable situations.**

  Applying this to the sex work models:
  - Nordic model: Criminalizes buyers, which aligns with her view of targeting demand (like surrogacy agencies). Sellers aren't punished, which fits her sympathy for providers.
  - German model: Legalizes but regulates venues. This might be acceptable if labor protections are strong, but mandatory health checks could be seen as stigmatizing, which she might oppose.
  - NZ model: Treats it as regular work under labor laws. She supported this approach for porn and camming, so she'd likely favor it here too.

  The best guess is she prefers the NZ model because it extends normal labor protections, avoiding the pitfalls of criminalization or excessive regulation. The Nordic model's focus on buyers is a close second, but her support for regulated markets in other areas makes NZ more consistent.

  To test this, asking about paid clinical trial participation involving higher risks (like Phase I trials) could reveal if risk level affects her stance. If she's against it despite supporting drug trials generally, that confirms the risk principle. If she's okay, then her line might be more about permanence than risk alone.
answer: |-
  Based on Renate's track record, here's a breakdown of the principles at play, predictions for the sex work ballot options, my best guess, and a strategic question to test her framework:

  ### 1. The Rule(s) That Fit Her Verdicts
  Her positions are most consistently explained by **"The Irreversible Harm / Bodily Sovereignty Rule"**, refined by two sub-components:  
  - **Core Principle**: Markets are acceptable if they involve **renewable services/tissues with low personal risk or irreversible consequences**. They are unacceptable if they involve **permanent bodily loss, high risk, or irreversible harm**.  
  - **Exploitation Focus**: She always protects the individual seller/performer ("never the surrogate/seller"), but targets intermediaries (agencies, buyers) when she perceives exploitation potential.  
  - **Labor Rights Baseline**: For non-bodily-harm services (porn, camming, rent-a-friend), she defaults to standard labor/contract law with minimal extra regulation.  

  **Why other rules fail**:  
  - *Body-Parts-vs-Services*: Broken by **paid plasma** (bodily fluid = okay) vs. **kidneys/eggs** (body parts = not okay).  
  - *Regulate-Risky-Venues*: Broken by her support for **camming/drug trials** (high-risk contexts) without demanding heavy regulation beyond baseline safety.  
  - *Criminalize-Only-Buyers*: Explains Nordic Model leanings but fails to explain **commercial surrogacy** (where she targets *both* agencies *and* buyers) or **porn** (where she doesn't criminalize buyers).  

  **How her rule explains every case**:  
  | **Activity**               | **Her Verdict** | **Fits Because**                                                                 |  
  |----------------------------|-----------------|----------------------------------------------------------------------------------|  
  | Paid plasma                | ✅ Fine         | Renewable tissue, low risk, no permanent harm.                                   |  
  | Drug trials                | ✅ Fine         | Temporary risk, bodily autonomy respected.                                       |  
  | Selling kidney             | ❌ Ban          | Permanent loss, irreversible harm.                                               |  
  | Commercial surrogacy       | ❌ Against      | High physical/emotional risk, permanent biological impact (focus on intermediaries). |  
  | Paid egg donation          | ❌ Against      | Invasive, long-term health risks, irreversible genetic contribution.              |  
  | Porn/camming               | ✅ Fine         | Services with low *irreversible* harm; regulate like any job.                    |  
  | Rent-a-friend              | ✅ Fine         | Pure service, no bodily risk.                                                    |  
  | Altruistic surrogacy       | ✅ Fine         | Expenses covered = no *market* for the body; framed as gifting.                  |  

  The **plasma exception** makes sense under this rule: Plasma regenerates quickly, donation is low-risk, and she frames it as communal aid (like blood donation). It lacks the permanence of kidney/egg markets.

  ---

  ### 2. Predictions for Each Sex Work Model  
  | **Ballot Option**          | **Prediction Under Her Rule**                                                                 | **Verdict** |  
  |----------------------------|----------------------------------------------------------------------------------------------|-------------|  
  | **Nordic Model**           | Targets buyers (like surrogacy agencies), protects sellers. But sex work isn't "irreversible harm" like a kidney sale. | ⚠️ *Probable Support* |  
  | **German Legalization**    | Mandatory health checks/zoning = extra regulation she opposes in camming. Brothels as "intermediaries" risk exploitation focus. | ❌ *Likely Against* |  
  | **NZ Decriminalization**   | Treats it as a service job (like porn/camming), applies standard labor laws. Minimal irreversible harm. | ✅ *Strong Support* |  

  ---

  ### 3. Best Guess & Why  
  **She votes for New Zealand-style decriminalization.**  
  - **Why?** It aligns perfectly with her **baseline labor-rights approach** for services without irreversible bodily harm (like porn/camming). Sex work, under this model, isn't framed as a unique moral hazard but as work with standard protections.  
  - **Why not Nordic?** While she targets buyers in surrogacy, that was due to perceived irreversible harm to surrogates. Sex work (like camming) lacks this in her framework.  
  - **Why not German?** She opposes intrusive regulation (e.g., camming platform rules), and mandatory health checks stigmatize workers like surrogacy agencies exploit surrogates.  

  **Key insight**: Her support for plasma donation shows she accepts *some* bodily markets under low-risk/renewable conditions. Sex work is closer to porn/camming (services) than kidney sales (irreversible harm).  

  ---

  ### 4. The Perfect Splitting Question  
  Ask her:  
  > **"What about paid participation in high-risk clinical trials? Like Phase I drug testing where healthy volunteers face unknown, potentially severe side effects for money."**  

  - **Why this splits the rules**:  
    - Under her **Irreversible Harm Rule**: She *should oppose this* (high risk, potential permanent damage).  
    - If she *supports it*, she’s likely using a **"Consenting Adults + Labor Rights" rule** (like porn/drug trials), which *strengthens* the case for NZ decriminalization.  
    - If she *opposes it*, she’s doubling down on bodily risk (even when temporary), making Nordic Model *more* likely (as sex work could be framed as inherently risky).  

  This tests the boundary of "risk" in her framework and exposes whether "irreversible harm" or "worker autonomy" is her true priority. 

  **Final Tip**: At dinner, lead with the trial question *before* guessing her vote. If she opposes high-risk trials, hedge your bet toward Nordic. If she supports them, NZ is a lock. Good luck with the wager! 🍀
