prompt: |-
  You are to act as a senior philosopher specializing in axiology and population ethics who has spent a career translating ethical theories into tools that grant-makers, regulators, and review boards can actually use. Please think carefully and work in stages: begin by brainstorming several ways the fund's commitments (stated below) could be operationalized, noting where the commitments pull in different directions, then commit to the design you think best survives the constraints, and be explicit about what your chosen design sacrifices.

  Context: I am a program officer at a small private fund that makes grants exclusively on animal welfare. Our charter commits the fund to the following five positions, and I need them turned into something usable:

  (1) Reducing suffering takes strict priority over creating or enhancing happiness whenever the two compete for the same budget.
  (2) Suffering below some intensity threshold T may be traded against other goods — including pleasure — using roughly standard utilitarian arithmetic: numbers of animals, duration, intensity.
  (3) Suffering at or above T is lexically prior: no amount of happiness, for any number of beings, can offset preventing or ending it.
  (4) The fund does not know where T sits; the charter is silent, and our board members disagree sharply about how intense something must be to count.
  (5) Even below T, pleasure and pain are not straightforwardly commensurable; a "hedonic exchange rate" between them is at best a modeling convenience, and the procedure should not pretend otherwise.

  I need a written decision procedure my team of three officers can actually run each quarter. Practical constraints: we receive around 80 proposals per cycle, each officer has roughly one hour per proposal, and the final sign-off comes from a board with no philosophy background that must be able to see, from the paperwork alone, why a proposal failed. The procedure should therefore specify: the questions to ask about a proposal, in order; what counts as a sufficient answer to each; which answers return an automatic "no"; and which situations must be escalated to the board because the open question is one of values rather than facts — especially threshold placement, which I suspect cannot be proceduralized away and should be handled honestly rather than buried in a formula.

  The procedure must also tell my officers what to do about three recurring trouble spots. First, proposals whose entire expected benefit is positive-affect enhancement — enrichment for animals whose baseline welfare is already decent — since the charter is unclear on whether these are permitted, discouraged, or forbidden. Second, "many-mild versus few-intense" comparisons: a large herd of chronic, low-grade malaise against a small number of animals in acute agony, where the arithmetic below T points one way and the lexical commitment above T points the other. Third, proposals whose intensity estimates cross T only under the optimistic end of the applicant's own numbers.

  Then run the procedure on three representative proposals, in the form of worked examples with the reasoning visible at each step: (a) subsidizing a switch of a region's broiler flocks to slower-growing breeds, which would reduce mild chronic malaise across tens of millions of birds per year while modestly increasing mortality for some; (b) a surgical street-animal rescue service that treats roughly eight hundred animals per year in acute, T-crossing pain — this project is our founder's favorite, so be honest about what the procedure yields; (c) installing perches, substrate, and foraging devices for a zoo population of elephants whose welfare indicators are already reasonably good.

  Finally, close with a candid statement of where the procedure misfires: which classes of proposals it will systematically mistreat, and which of the fund's five commitments does the most damage when forced into an operational form. Do not give me a reading list or name-drop the literature; I want the reasoning, not the bibliography.
reasoning: |-
  Hmm, this is a fascinating challenge in applied ethics. The user is a program officer at an animal welfare fund needing to operationalize five complex ethical commitments into a practical decision procedure. Let me unpack this carefully.

  First, the fund's commitments create several tensions: 
  The lexical priority of suffering above threshold T (commitment 3) clashes with utilitarian trade-offs below T (2). The uncertainty about T's location (4) and non-commensurability of pleasure/pain (5) make quantitative approaches problematic. Yet we need a procedure that's executable by non-philosophers under time constraints.

  Key operational hurdles:
  - How to handle "pure happiness" proposals when the charter is silent (elephant enrichment case)
  - Resolving "many-mild vs few-intense" dilemmas where arithmetic and lexicality conflict
  - Dealing with threshold uncertainty when estimates straddle T

  The core challenge is designing a process that honors lexical priority without knowing where the threshold lies. A scoring system would violate commitment 5's non-commensurability warning. Instead, I'm considering a phased filtering approach:

  Phase 1 would screen for suffering reduction opportunities, prioritizing intensity. This addresses commitment 1's suffering-first principle. Phase 2 would then examine sub-threshold trade-offs only for proposals that pass Phase 1, using constrained utilitarian reasoning that doesn't pretend perfect commensurability.

  For the threshold problem: since T's location is contested, the procedure should flag any proposal involving suffering plausibly near T for board review. We'll define "plausibly near" conservatively - if any reasonable board member might consider it above threshold, it gets escalated.

  The three trouble spots require specific handling:
  - Pure happiness proposals get channeled into a separate assessment path since they don't reduce suffering
  - Many-mild vs few-intense cases trigger automatic escalation - this is precisely where board values must decide
  - Threshold-crossing uncertainty means pessimistic estimates determine filtering

  Now for the test cases:
  The broiler switch reduces widespread mild suffering but increases mortality. Since mortality likely crosses T, we'd need to calculate if sub-T benefits outweigh the mortality harm - but only after confirming the mortality increase doesn't itself trigger lexical priority.

  The street animal rescue clearly addresses above-T suffering, so it passes Phase 1 immediately. But we must still check for potential harms in Phase 2.

  The elephant enrichment poses the pure happiness problem. Since it doesn't reduce suffering, our procedure would reject it unless the board creates an exception - which reflects the charter's ambiguity here.

  The biggest sacrifice is flattening complex ethical distinctions into binary decisions. Commitment 5 (non-commensurability) suffers most in operationalization because any comparison below T requires some artificial metric. We also lose nuance in "many mild" cases where small intensities sum to large burdens.

  This approach prioritizes preventing worst outcomes over maximizing good - true to the fund's suffering-first ethos, even if it means rejecting some beneficial projects.
answer: |-
  Here is a decision procedure designed to navigate your constraints, followed by worked examples and a candid assessment of its limitations.

  ---

  ### **Decision Procedure: Tiered Assessment for Animal Welfare Grants**

  **Core Structure:** A 3-phase filter prioritizing suffering reduction and lexical thresholds. Phase 1 screens for disqualifiers, Phase 2 assesses suffering reduction, Phase 3 handles sub-threshold trade-offs. Board escalation points are explicit.

  **Phase 1: Threshold & Harm Screen**  
  *(Automatic "no" or board escalation)*  
  1. **"Does the proposal *cause* suffering ≥ T under *any* plausible scenario (per applicant’s own data)?"**  
     - *Sufficient answer:* Evidence-based intensity estimates (e.g., veterinary scales, behavioral indicators).  
     - **Automatic NO** if "yes" – violates lexical priority (Commitment 3).  
     - **Escalate to board** if intensity estimates straddle T (e.g., "optimistic: below T, pessimistic: above T").  

  2. **"Does the proposal *reduce* suffering ≥ T for any animals?"**  
     - *Sufficient answer:* Clear identification of affected groups and intensity reduction.  
     - **Proceed to Phase 2** if "yes."  
     - **If "no":** Channel to "Pure Benefit" track (see *Trouble Spot 1* below).  

  **Phase 2: Suffering Reduction Prioritization**  
  *(Qualitative ranking; no trade-offs yet)*  
  3. **"Rank proposals by severity-reduced-per-animal (scale: mild/moderate/severe, where severe ≥ T)."**  
     - *Rules:* Severe > moderate > mild. Equal severity? Rank by scale (animals × duration).  
     - *Sufficient answer:* Applicant’s data on baseline vs. projected suffering, duration, numbers.  
     - **Escalate to board** if "many-mild vs. few-intense" conflict arises (e.g., 10M mild vs. 100 severe).  

  **Phase 3: Sub-Threshold Trade-off Assessment**  
  *(Constrained utilitarian arithmetic)*  
  4. **"Does the proposal cause net suffering reduction *below T*?"**  
     - Calculate: `(A) Suffering reduced (intensity × duration × number)` minus `(B) Suffering caused + Pleasure lost`.  
     - *Key constraints:*  
       - Pleasure gains **cannot offset** suffering increases (Commitment 1, 5).  
       - Use applicant’s **pessimistic estimates** for harm, **optimistic** for benefit (precautionary).  
       - Intensity/duration must use standardized scales (e.g., Welfare Quality®).  
     - **Automatic NO** if (B) > (A).  
     - **Proceed to cost-effectiveness** if (A) > (B).  

  **Trouble Spot Protocols**  
  1. **Pure Happiness Proposals** (e.g., elephant enrichment):  
     - *Path:* Phase 1 → Phase 2 (if no suffering reduction) → **Automatic NO** unless board explicitly approves "happiness-only" funding (requires separate annual board policy).  
  2. **Many-Mild vs. Few-Intense**:  
     - *Handling:* Flag in Phase 2 → **Escalate to board** with comparative suffering metrics.  
  3. **Threshold Uncertainty**:  
     - *Handling:* Phase 1, Q1 → **Escalate if straddles T**; board must classify intensity.  

  **Output Documentation:**  
  - Tracker showing pass/fail at each phase, with reason (e.g., "NO: Phase 1 – causes suffering ≥ T").  
  - Escalation reports specify: "Board must decide if [X] intensity ≥ T" or "Board must resolve many-mild vs. few-intense trade-off."  

  ---

  ### **Worked Examples**  
  *(Using procedure above; T assumed unknown)*  

  **(a) Broiler Breed Switch**  
  - *Phase 1, Q1:* May increase mortality (likely ≥ T). **Escalate to board** – is mortality ≥ T?  
    - *If board says "yes" → NO* (lexical violation).  
    - *If board says "no" → Proceed*.  
  - *Phase 2:* Reduces mild malaise (millions × years). High scale → high priority.  
  - *Phase 3:* Net reduction? Mild suffering reduced > potential mild suffering from mortality (if sub-T). **YES** if cost-effective.  

  **(b) Street Animal Rescue**  
  - *Phase 1, Q1:* Causes no suffering ≥ T. **Proceed**.  
  - *Phase 1, Q2:* Reduces suffering ≥ T (acute pain). **Proceed to Phase 2**.  
  - *Phase 2:* Top priority (severe suffering reduced). **Fast-track approval**.  
  - *Phase 3:* Not needed (lexical duty satisfied).  

  **(c) Zoo Elephant Enrichment**  
  - *Phase 1, Q1:* Causes no suffering ≥ T. **Proceed**.  
  - *Phase 1, Q2:* Reduces no suffering (baseline already "decent"). **Divert to Pure Benefit track**.  
  - *Pure Benefit track:* **Automatic NO** (unless board authorizes happiness grants).  

  ---

  ### **Candid Limitations**  
  **1. Systematic Misfires:**  
  - **False Negatives on High-Intensity Prevention:** Proposals *preventing* future suffering ≥ T (e.g., disease eradication) may fail Phase 1 Q2 if they don’t *reduce existing* suffering. Requires board override.  
  - **"Mild Suffering" Tyranny:** Projects alleviating vast numbers of sub-T suffering (e.g., beak-trimming alternatives) lose to small-scale severe suffering cases, even if net reduction is larger.  
  - **Pure Happiness Exclusion:** Legitimate welfare gains (e.g., cognitive enrichment) rejected without board intervention.  

  **2. Most Damaged Commitment:**  
  **Commitment 5 (Non-Commensurability)** suffers most. The procedure forces:  
  - Implicit "exchange rates" in Phase 3 (e.g., duration × intensity as a proxy for suffering magnitude).  
  - Comparison of disparate harms (e.g., chronic stress vs. brief pain) via standardized scales.  
  **Why?** Operational necessity – but it flattens qualitative differences into crude arithmetic.  

  **3. Hidden Sacrifice:**  
  **Lexical Threshold Uncertainty** is "resolved" by escalating borderline cases, but this:  
  - Shifts moral responsibility to the board without philosophical guidance.  
  - Risks arbitrary thresholds (e.g., "mortality always ≥ T") overriding context.  

  **Conclusion:** This procedure prioritizes preventing catastrophic suffering and avoids false positives near T, but at the cost of precision in sub-T trade-offs and non-suffering benefits. It makes the fund’s values legible but enforces conservatism where the charter is silent.  

  ---  
  *This balances auditability, constraint respect, and ethical fidelity. I recommend piloting it for one cycle with mandatory escalation documentation to refine thresholds.*
