prompt: |-
  After a long argument with a friend last night, I want a proper audit of the analogy she was leaning on the whole evening. Her claim: our greenhouse emissions are like a loan taken out in our grandchildren's name. We consume the principal (cheap energy, growth, infrastructure); they inherit the repayment schedule (adaptation costs, lost cropland, relocation); and since they never signed anything, we stand to a non-consenting creditor as a debtor does, so anything short of aggressive decarbonization plus adaptation finance amounts to default. She added a wrinkle I hadn't heard before: the loan compounds, because delay adds interest in the form of cumulative warming, so procrastination is not neutral deferment but continued borrowing at increasing rates. My counter was that the mapping breaks at the creditor: the people harmed by our emissions would not exist had we not emitted — the very consumption that burdens them also brings them into being — so there is no determinate victim holding the IOU; and debts transfer to specific persons, whereas climate harms land on whoever happens to be alive in 2100. She said that was a technicality, and I said it was the whole argument, and we went home.

  Give me the correspondence table with four columns: element of the loan (principal, interest, debtor, creditor, contract, default, collection), its climate counterpart, whether the mapping holds or breaks, and whether the break is load-bearing for her conclusion (yes/no). Then the disanalogies not already in the table, sorted into those that matter for her repayment conclusion and those that do not, and a verdict on whether the conclusion survives once the non-identity and no-determinate-creditor problems are on the table — or whether they sink the analogy outright. If some financial picture fits better than the loan (an insurance pool, an inheritance, a joint account we share with the future), say which and whether it licenses a weaker, stronger, or different obligation. Finish with a JSON object: {verdict: one of "analogy survives", "survives damaged", "fails", load_bearing_disanalogy: string, better_analogue: string, revised_conclusion: string}.
reasoning: |-
  Hmm, the user wants a detailed audit of a climate change analogy comparing greenhouse gas emissions to taking out a loan in our grandchildren's name. This is quite philosophical and involves ethics, finance, and climate science.

  First, I need to unpack the analogy components. The friend argues that our emissions are like borrowing principal (cheap energy/growth), leaving future generations with repayment (adaptation costs, damages) plus compounding interest (worse impacts due to delayed action). The key moral claim is that not acting aggressively amounts to defaulting on a debt to non-consenting creditors.

  The user's counterargument focuses on two disanalogies: the non-identity problem (future people wouldn't exist without our emissions) and no determinate creditor (harms affect whoever is alive later, not specific individuals). He thinks these break the analogy entirely, while his friend called them "technicalities."

  For the correspondence table, I'll need to map:
  - Loan elements: principal, interest, debtor, creditor, contract, default, collection
  - Climate counterparts
  - Whether the mapping holds or breaks
  - Whether the break is load-bearing for the repayment conclusion

  Breaking down each:
  - Principal → Cumulative emissions: Holds well as consumed capital
  - Interest → Compounding damages from delay: Holds strongly
  - Debtor → Current generations: Holds
  - Creditor → Future generations: Breaks due to non-identity/indeterminacy - and this is LOAD-BEARING because the moral force comes from harming specific victims
  - Contract → Nonexistent: Breaks, but maybe not load-bearing since the lack of consent is the point
  - Default → Insufficient mitigation/adaptation: Holds conditionally
  - Collection → Climate impacts: Holds, though automatic

  Additional disanalogies that matter:
  1) Non-identity problem: Fundamental to the creditor issue - weakens the "debt to them" framing
  2) Diffused harm: Climate affects populations, not individual creditors
  3) No repayment mechanism: We can't actually pay back, only mitigate future harm

  Disanalogies that don't undermine the core point:
  - Emissions aren't literally financial
  - Some future people might benefit
  - We can't perfectly quantify the "debt"

  The non-identity problem is particularly damaging to the loan analogy because it challenges the very notion of harming specific future individuals. However, the core ethical intuition - that we're imposing severe costs on the future without consent - remains powerful even without specific creditors.

  Better analogues:
  - Inheritance: We're leaving a degraded estate mixed with useful infrastructure. This captures the mixed legacy without the debt framing's problems. Obligation is weaker (we should leave things no worse?).
  - Insurance pool: Current generations pay premiums (mitigation) to protect against future risks. This justifies aggressive action but frames it as collective responsibility rather than debt repayment.
  - Joint account: Shared atmospheric commons we're overdrafting. Highlights stewardship but may dilute urgency.

  The repayment conclusion survives but transformed: while not a literal default, we have a stewardship obligation to avoid imposing catastrophic costs. The insurance model justifies aggressive decarbonization best.

  For the JSON:
  - Verdict: Survives damaged (due to creditor indeterminacy)
  - Load-bearing disanalogy: Non-identity problem affecting creditor specificity
  - Better analogue: Intergenerational insurance pool
  - Revised conclusion: Obligation to pay "premiums" via mitigation/adaptation to prevent harm

  The user seems frustrated but open to refinement - he engaged deeply with his friend's argument. His counter was philosophically sound, but the underlying ethical concern deserves a robust framing that bypasses the non-identity issue.
answer: |-
  Below is a structured audit of the climate-loan analogy, followed by disanalogies, a verdict on the conclusion, and alternative financial analogues. The analysis focuses on logical coherence, ethical implications, and whether disanalogies undermine the core argument.

  ### Correspondence Table
  | Loan Element     | Climate Counterpart                     | Mapping Holds/Breaks | Break Load-Bearing? (For Conclusion) |
  |------------------|-----------------------------------------|----------------------|--------------------------------------|
  | **Principal**    | Cumulative emissions (cheap energy/growth) | Holds                | No                                   |
  | **Interest**     | Compounding damages from delayed action (e.g., higher adaptation costs due to warming inertia) | Holds                | No                                   |
  | **Debtor**       | Current/past emitting generations       | Holds                | No                                   |
  | **Creditor**     | Future generations (specifically those harmed by climate impacts) | **Breaks**           | **Yes**                              |
  | **Contract**     | No explicit agreement (non-consensual burden) | Breaks               | No (supports her point)              |
  | **Default**      | Failure to decarbonize or fund adaptation | Holds conditionally  | No (if other elements hold)          |
  | **Collection**   | Climate impacts (e.g., sea-level rise, crop failures) | Holds partially      | No                                   |

  ### Disanalogies Not in the Table
  **Load-Bearing for Repayment Conclusion (Matter):**  
  1. **Non-Identity Problem**: Future individuals exist *because* of our emissions-driven choices (e.g., economic conditions shaping reproduction). They cannot be "harmed" by emissions in a debt framework, as they wouldn't exist otherwise. This severs the debtor-creditor link.  
  2. **No Determinate Creditor**: Climate harms affect statistical populations (e.g., "people in 2100"), not specific individuals. Debts require identifiable creditors; statistical victims lack legal/moral personhood for "repayment."  
  3. **Asymmetry of Harm**: Future generations inherit both burdens (climate damage) *and* benefits (infrastructure, knowledge). Loans lack this duality—principal consumption benefits only the debtor.  

  **Non-Load-Bearing (Do Not Matter):**  
  1. **Quantifiability**: A loan's terms are precise; climate "debt" is probabilistic (e.g., uncertain costs of 2°C vs. 3°C warming). This weakens but doesn't invalidate the ethical core.  
  2. **Intent**: Loans involve deliberate borrowing; emissions were often uninformed. But culpability arises from continued inaction *despite* knowledge.  
  3. **Enforceability**: Debts have collection mechanisms; climate impacts are automatic and non-negotiable.  

  ### Verdict on the Conclusion
  The **non-identity and no-determinate-creditor problems sink the loan analogy as a literal debt framework**. They undermine the core premise that future generations are "creditors" to whom we owe "repayment." Without identifiable victims harmed by our actions (due to counterfactual nonexistence), the debtor-creditor relationship collapses.  
  - **Conclusion's Fate**: Her repayment conclusion (aggressive decarbonization = avoiding "default") **survives in weakened form** but requires reframing. The ethical imperative persists—imposing severe, non-consensual risks on the future is unjust—but it cannot be coherently expressed as a "debt."  

  ### Better Financial Analogue: **Intergenerational Insurance Pool**  
  - **Description**: Current generations pay "premiums" (decarbonization, adaptation funding) into a shared policy to hedge against catastrophic future risks. Premiums compound if delayed (like interest), and inaction constitutes policy lapse, exposing the future to uncovered losses.  
  - **Fits Better Because**:  
    - Avoids non-identity issues (pools protect statistical groups, not specific individuals).  
    - Centers consent (pool members share risks voluntarily; future generations are "forced beneficiaries").  
    - Matches compounding urgency (delayed premiums = higher future costs).  
  - **Obligation Strength**: **Stronger** than the loan. It frames mitigation as a non-negotiable duty to prevent harm, not repay a "debt," and justifies aggressive action as actuarial necessity.  
  - **Revised Conclusion**: *"We owe future generations a livable climate. Inaction is not default on a loan but refusal to pay premiums into an intergenerational insurance pool—forcing them to bear uninsured risks they never agreed to."*  

  ### JSON Output
  ```json
  {
    "verdict": "survives damaged",
    "load_bearing_disanalogy": "Non-identity problem and lack of determinate creditor: future individuals cannot be specific 'creditors' because their existence depends on emissions-driven choices.",
    "better_analogue": "Intergenerational insurance pool",
    "revised_conclusion": "Aggressive decarbonization and adaptation finance are ethical obligations to avoid imposing uninsurable risks on future generations—not debt repayment, but payment of actuarially fair premiums for planetary insurance."
  }
  ```

  ### Key Takeaways
  - The loan analogy **fails as a literal financial model** due to non-identity and creditor indeterminacy.  
  - Its **ethical core survives**: imposing escalating, non-consensual costs on the future is indefensible.  
  - The **insurance pool analogue** better justifies urgent action, sidestepping the loan's flaws while amplifying the moral duty. Your friend’s intuition about compounding harm is sound, but her framing overreaches. Your counterargument identifies critical disanalogies, though they don’t negate the underlying obligation.
