prompt: |-
  In September 2007, the British mortgage lender Northern Rock suffered the first visible retail bank run in Britain since the nineteenth century, and I would like it analyzed as a case study in common knowledge of rationality and epistemic game theory. Here are the salient facts, so the analysis does not turn on contested detail. Northern Rock funded its lending chiefly by borrowing in wholesale credit markets rather than from depositors. When those markets froze in the summer of 2007, the bank could not roll over its funding, and on 13/14 September the Bank of England announced emergency liquidity support. The announcement itself — not a revelation of insolvency — triggered the run: depositors queued outside branches and drained roughly 8-12% of retail deposits over the following days, with the queues and the news coverage of the queues broadcast continuously. UK deposit insurance at the time covered 100% of only the first £2,000 of a deposit and 90% of the next £33,000, so a typical saver had money at genuine risk, while the Bank of England and the FSA publicly and repeatedly stated that the bank was solvent. On 17 September the Chancellor of the Exchequer announced a full government guarantee of all Northern Rock deposits, and the run stopped almost immediately.

  I know the textbook machinery, so please go past it rather than through it. Start with Diamond-Dybvig as the underlying coordination game — who the players actually were (retail depositors, wholesale lenders, the bank, the Bank of England, the Treasury), what the real option set and payoffs were (queue now and lose at most time; wait and risk partial loss under the insurance cap; the bank's option to fund at the emergency facility), and where the classical analysis assumes literally common knowledge of the payoffs and of everyone's rationality. Then do the epistemic work carefully, in stages: what exactly the liquidity-support announcement changed in the information structure, and why a public announcement intended as reassurance functioned as a coordinating signal for withdrawal; how the queues and their television coverage created common knowledge among depositors who would otherwise have had only private worries — common knowledge of what, precisely: that the bank was in trouble, that others knew, that others knew that others were withdrawing; how Rubinstein's email game bears on the claim that near-common knowledge will not sustain the cooperative equilibrium, and whether depositors' situation approximated the conditions under which that result bites; and how the global-games treatment (noisy private signals about fundamentals selecting a unique equilibrium rather than multiple equilibria coordinated on a sunspot) describes the episode better or worse than the pure common-knowledge story. Then treat the 17 September guarantee as the crucial experiment: the government changed the payoffs so that withdrawal was no longer dominant, but it also made solvency support common knowledge — disentangle which change ended the run, and say what evidence in the episode (the speed of the stop, the roughly 88-92% of deposits that never moved, the branches with no queues at all, the fact that withdrawal was arguably rational for capped depositors even given a solvent bank) discriminates between the accounts.

  Finally, run the analysis in the other direction: what does this episode show about the theory? Is it a confirmation of the common-knowledge mechanism, an anomaly (a run that stopped because payoffs changed, without any change in beliefs about fundamentals), or a case the equilibria-focused literature never anticipated — the authorities intervening in the epistemic structure itself, broadcasting queues to the very depositors whose coordination they feared? Be disciplined about the mapping — say where epistemic game theory is silent rather than forcing it to speak — and be honest about what no model in this family explains, including whether the trigger was epistemic at all or simply a rational response to the insurance cap.

  After the prose analysis, please append a brief structured summary as a table with these columns: (1) Stage and date — each dated phase of the episode, one row each; (2) Event — what actually happened; (3) Information state — what was common knowledge, what was merely mutual belief, and what was privately held, at that stage; (4) Game-theoretic mechanism — the concept doing the explanatory work, named; (5) Explains — what this stage's outcome it accounts for; (6) Leaves unexplained — what the theory does not reach here. Add one final row for the episode as a whole, with your verdict on whether the case confirms, refines, or anomalous-strains the common-knowledge framework, stated in a single sentence.
reasoning: |-
  We are analyzing the Northern Rock bank run as a case study in common knowledge and epistemic game theory. The goal is to go beyond textbook machinery and apply concepts carefully to the episode.

  We break the episode into stages:

  Stage 1: Pre-announcement (before 13/14 September 2007)
  - Event: Northern Rock, heavily reliant on wholesale funding, faces a freeze in wholesale credit markets and cannot roll over its funding.
  - Information state: 
     - Common knowledge: The bank's business model (reliance on wholesale funding) and the general stress in credit markets. However, the severity of Northern Rock's specific situation is not common knowledge.
     - Mutual belief: Among wholesale lenders, there is likely mutual belief about the freezing of the market, but retail depositors are largely unaware.
     - Private: Each wholesale lender and the bank have private information about the extent of the freeze and the bank's immediate liquidity needs. Retail depositors have no specific information and are not yet concerned.

  Stage 2: Liquidity Support Announcement (13/14 September 2007)
  - Event: The Bank of England (BoE) announces emergency liquidity support for Northern Rock.
  - Information state change: 
     - The announcement is public and creates common knowledge that Northern Rock is in trouble and needs emergency support. 
     - Why is this a coordinating signal? The announcement, intended to reassure, instead signals that the bank is in distress. It becomes common knowledge that the bank is in trouble and that everyone else now knows this. This public signal transforms a private worry into a public one and creates a focal point for coordination.

  Stage 3: The Run (14-17 September 2007)
  - Event: Retail depositors queue outside branches, withdrawing 8-12% of deposits. The queues and news coverage are broadcast continuously.
  - Information state:
     - Common knowledge: The run itself is broadcast, so it becomes common knowledge that a run is happening. This means that every depositor knows that others are withdrawing, knows that others know, and so on. The queues also reinforce the common knowledge of distress (since they are a visible sign of the run) and the common knowledge that others are acting on their belief that the bank is in trouble.
  - Game-theoretic mechanism: 
     - Coordination game (Diamond-Dybvig): The depositors face a coordination problem. If all wait, the bank remains solvent and everyone gets their money back. But if enough run, the bank fails and those who wait lose. The equilibrium where everyone runs becomes salient because of the common knowledge created by the announcement and the queues. The deposit insurance cap (which leaves a typical saver with some money at risk) means that even if the bank is solvent, for a depositor with more than £2,000, waiting is risky because if others run, the bank may fail and the depositor will not be fully insured. Hence, running becomes a dominant strategy for some.

  - Rubinstein's email game: This model shows that even if there is almost common knowledge (i.e., mutual knowledge to a high level), the cooperative equilibrium (waiting) can collapse if there is any doubt about the common knowledge. In this case, the initial announcement created common knowledge of the problem, but the queues then created common knowledge of the run. However, the Rubinstein model also suggests that without common knowledge, coordination on the run might not have occurred. Here, the public announcement and the television coverage of the queues created common knowledge of the run, so the conditions for Rubinstein's result (where near-common knowledge is not enough) are not directly applicable because we have common knowledge. But note: the initial announcement might have been interpreted as a signal that the problem was severe enough to warrant a run, and the queues then provided the common knowledge of the run.

  - Global games: In the global games approach, each depositor receives a noisy private signal about the fundamental (the bank's solvency). They then choose to run or not based on their signal and their belief about others' signals. This approach selects a unique equilibrium. In this episode, the announcement and the queues provided a very public signal, so the private signals are dominated by the public information. Thus, the global games story might not fit as well because the public signal (the queues) was so strong that it made the fundamental (the bank's solvency) less relevant. The run happened despite the authorities' statements about solvency. The global games model would require that depositors had private doubts about solvency, but here the public signal of the run (the queues) was the dominant factor.

  Stage 4: The Guarantee Announcement (17 September 2007)
  - Event: The Chancellor announces a full government guarantee of all Northern Rock deposits. The run stops almost immediately.
  - Information state change:
     - The guarantee changes the payoffs: Withdrawal is no longer necessary to avoid loss because the government guarantees the entire deposit. The guarantee also makes the government's commitment common knowledge.
  - What ended the run? 
     - The change in payoffs: The guarantee removed the incentive to run because even if the bank failed, the depositor would be fully protected. 
     - The common knowledge of the guarantee: The announcement was public and made the new payoff structure common knowledge. 
     - Evidence: 
          - The speed of the stop: The run stopped almost immediately. This suggests that the payoff change was the main driver because beliefs about the bank's solvency did not change (the authorities had been saying it was solvent all along). 
          - The 88-92% of deposits that never moved: This suggests that even during the run, a majority of depositors did not run. This can be explained by the deposit insurance: for small depositors (with less than £2,000) there was no risk, so they had no reason to run. For those with more, the risk was partial and they might have believed the bank was solvent. 
          - Branches with no queues: Some branches had no queues, which might be because depositors in those areas had smaller deposits or because they trusted the bank or the authorities. 
          - Withdrawal was rational for capped depositors: Even if the bank was solvent, a depositor with a large account might run to avoid the risk of being only partially insured if the bank failed. But after the guarantee, the insurance became 100%, so the risk disappeared.

  Therefore, the guarantee ended the run by changing the payoffs and making the new payoff structure common knowledge. The evidence suggests that the change in payoffs was the key, not a change in beliefs about solvency.

  Overall analysis: What does the episode show about the theory?
  - The trigger: The run was triggered by the public announcement of liquidity support, which created common knowledge of distress. The queues then created common knowledge of the run. This is consistent with the common-knowledge mechanism in Diamond-Dybvig. However, the deposit insurance cap made running rational for some even if the bank was solvent, so the trigger was not purely epistemic. It was also a rational response to the insurance cap and the fear that others would run.

  - The end of the run: The guarantee changed the payoffs and made the new safety common knowledge. This stopped the run without changing beliefs about the bank's solvency. This is an anomaly for the pure common-knowledge story because the run stopped without a change in beliefs about the fundamental (solvency). It shows that the coordination game can be resolved by changing the payoffs.

  - Authorities' intervention: The authorities intervened in the epistemic structure by broadcasting the queues. This amplified the common knowledge of the run. The theory does not typically model such interventions, but it fits the idea that common knowledge can be created by public signals.

  What the theory does not explain:
  - Why the announcement of liquidity support triggered the run? The theory of sunspots (coordination on an irrelevant signal) might apply, but the signal (the announcement) was relevant. The theory does not fully explain why the public reassurance backfired, except by noting that it created common knowledge of the problem.
  - The role of the media: The continuous news coverage of the queues is a form of public signal that the theory does not explicitly model, but it fits the common knowledge framework.
  - The behavior of the 88-92% who did not run: The theory can explain this by the deposit insurance for small depositors and by heterogeneity in beliefs or risk aversion, but it does not explicitly model why some depositors were more patient.

  Verdict: The case refines the common-knowledge framework by showing how public announcements and visible actions (queues) create common knowledge and coordinate expectations, but it also shows that changing the payoffs can break the coordination without changing beliefs about fundamentals. This is consistent with the framework but highlights the importance of payoff structure in addition to beliefs.

