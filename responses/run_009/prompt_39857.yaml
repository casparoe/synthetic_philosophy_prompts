answer: |-
  ### Analysis of the Northern Rock Bank Run through Epistemic Game Theory

  #### Core Framework and Players
  The Diamond-Dybvig model frames bank runs as a coordination game with two equilibria: a Pareto-efficient "wait" equilibrium (if all depositors remain, the bank survives and pays returns) and a Pareto-inferior "run" equilibrium (if enough withdraw, the bank fails, triggering losses). Players include:
  - **Retail depositors**: Face a binary choice—withdraw now or wait. Payoffs depend on the bank's survival and deposit insurance coverage. Withdrawal yields full repayment minus time costs; waiting yields full repayment if the bank survives, but partial loss (due to insurance caps) if it fails.  
  - **Wholesale lenders**: Unable to roll over funding, forcing Northern Rock into liquidity stress. Their exit is exogenous to the retail run.  
  - **Northern Rock**: Can access Bank of England (BoE) emergency liquidity, but this signals distress.  
  - **Authorities (BoE, Treasury)**: Public statements and guarantees alter payoffs and information structures.  

  The insurance cap (£2k fully insured, 90% of next £33k) creates rational incentives for larger depositors to run even if the bank is solvent, as waiting risks partial loss if others run.  

  #### Epistemic Mechanism: How the Run Unfolded
  1. **Liquidity-Support Announcement as a Coordinating Signal (13/14 Sept)**  
     - **Information shift**: Prior to the announcement, retail depositors had *private beliefs* about liquidity stress but no common knowledge. The BoE’s public announcement transformed this into **common knowledge of distress**:  
       - All depositors knew the bank needed emergency support.  
       - All knew that others knew (and so on ad infinitum).  
     - **Why reassurance backfired**: The announcement acted as a **public signal** that replaced uncertainty with common knowledge of vulnerability. In Diamond-Dybvig, common knowledge of vulnerability makes the "run" equilibrium salient, as each depositor expects others to run. The insurance cap amplified this by making withdrawal dominant for depositors with >£2k at risk, regardless of solvency beliefs.  

  2. **Queues and Media Coverage as Common Knowledge of Actions**  
     - Television broadcasts of queues created **common knowledge of the run itself**:  
       - Depositors now knew others were withdrawing.  
       - They knew others knew withdrawals were happening (eliminating "plausible deniability" about the run).  
     - **Epistemic effect**: This fulfilled the conditions for a **coordination trap**. Rubinstein’s email game shows that even near-common knowledge (e.g., mutual knowledge to finite levels) cannot sustain cooperation if agents doubt others’ rationality. Here, live queues provided *actual common knowledge* of withdrawals, making running the unique rational choice for at-risk depositors.  

  3. **Global Games vs. Pure Common Knowledge**  
     - **Global games** (Carlsson-van Damme) would require depositors to have noisy private signals about fundamentals (solvency), with withdrawals occurring only if private signals cross a threshold. This *does not fit* Northern Rock:  
       - The public announcement and televised queues provided **perfect public signals**, drowning out private signals.  
       - The run began *before* depositors could assess fundamentals (e.g., BoE/FSA solvency claims were ignored).  
     - **Pure common knowledge** (Diamond-Dybvig) better explains the run: the announcement and queues created common knowledge of distress *and* actions, enabling coordination on the inferior equilibrium.  

  #### The Guarantee as a Crucial Experiment (17 Sept)  
  - **Payoff change**: The full guarantee eliminated loss risk, making waiting dominant regardless of others’ actions.  
  - **Common knowledge shift**: The announcement made the guarantee common knowledge.  
  - **Disentangling the mechanisms**:  
    - Evidence that **payoff change** ended the run:  
      - Run stopped *immediately*—faster than beliefs about solvency could shift.  
      - Depositors with >£35k (previously at risk) no longer faced losses even if the bank failed.  
    - Evidence that **common knowledge alone was insufficient**:  
      - BoE/FSA had repeatedly declared solvency (changing beliefs but not payoffs), yet the run persisted.  
      - Branches with no queues (e.g., in remote areas) saw no withdrawals, showing local common knowledge gaps.  
    - **Verdict**: The payoff change was decisive. With the guarantee, running became irrational, and the coordination game dissolved.  

  #### What the Episode Reveals About Theory  
  - **Confirms and refines common-knowledge theory**:  
    - The run triggered by the BoE announcement validates how public signals create common knowledge that coordinates actions.  
    - Queues as a self-reinforcing common-knowledge mechanism are understudied; here, they acted as a "live sunspot."  
  - **Anomaly for equilibrium-selection models**:  
    - The run stopped *without* changing beliefs about fundamentals (solvency claims were already public). Payoff intervention alone resolved the coordination failure—a scenario not emphasized in Diamond-Dybvig.  
  - **Limitations of the framework**:  
    - **Epistemic silence**: The theory does not model how authorities *create* common knowledge (e.g., broadcasting queues). Here, media coverage intensified the epistemic trap.  
    - **Non-epistemic trigger**: The deposit insurance cap made withdrawal rational even under solvency, highlighting that payoff structures can dominate beliefs.  
  - **Unexplained elements**:  
    - Why only 8-12% withdrew: Heterogeneity in deposit sizes, risk aversion, or private trust in authorities.  
    - Why the announcement was interpreted as distress rather than reassurance: Behavioral factors (e.g., salience bias) likely played a role.  

  ---

  ### Structured Summary Table  

  | Stage and date           | Event                                                                 | Information state                                                                                                                               | Game-theoretic mechanism                 | Explains                                                                                                 | Leaves unexplained                                                                                     |  
  |--------------------------|-----------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------|----------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|  
  | Pre-13 Sept 2007         | Wholesale markets freeze; NR cannot roll over funding.               | **Private**: Retail depositors unaware. **Mutual belief**: Wholesale lenders know markets are frozen. **Common knowledge**: None of NR distress. | Incomplete information                  | Why no initial run: depositors lacked knowledge of vulnerability.                                        | Why wholesale lenders froze funding (exogenous shock).                                               |  
  | 13-14 Sept 2007          | BoE announces emergency liquidity support.                           | **Common knowledge**: NR is distressed. **Mutual belief**: Others will interpret this as a risk signal. **Private**: Solvency beliefs vary.     | Public signal as coordination device   | Run trigger: created common knowledge of vulnerability, making "run" equilibrium salient.                | Why the signal was interpreted as distress (not reassurance).                                        |  
  | 14-17 Sept 2007 (Run)    | Queues form; 8-12% deposits withdrawn; live TV coverage.             | **Common knowledge**: Run is occurring (via queues/media). **Mutual belief**: Withdrawal is rational. **Private**: Individual solvency assessments. | Common knowledge of actions            | Run amplification: queues confirmed others’ withdrawals, locking in coordination.                        | Why only 8-12% ran (heterogeneity in deposits/risk).                                                |  
  | 17 Sept 2007 (Guarantee) | Treasury announces full guarantee; run stops.                        | **Common knowledge**: All deposits safe. **Mutual belief**: Running is now irrational. **Private**: None relevant.                              | Payoff change (dominant strategy shift) | Immediate run cessation: guarantee made waiting dominant regardless of others’ actions or fundamentals. | None at this stage—theory fully explains halt.                                                      |  
  | **Episode overall**      | Run triggered by announcement, amplified by queues, halted by guarantee. | **Verdict**: Refines the common-knowledge framework by showing how authorities alter both payoffs and epistemic structures, but highlights payoff dominance over beliefs. |                                          |                                                                                                          |                                                                                                        |  

  **Final Verdict Sentence**:  
  The case refines the common-knowledge framework by demonstrating how public signals and observable actions create epistemic conditions for coordination failures, but it reveals that payoff interventions can dissolve coordination traps without altering beliefs—an underappreciated mechanism in epistemic game theory.
