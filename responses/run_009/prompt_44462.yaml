prompt: |-
  Me and my mate Sarah were packing up her flat for a house move, and it turned into this running argument about when you're allowed to say something "can" do a thing. I wrote her verdicts down after, best I could:

  - a vase on a shelf: yes, obviously breakable
  - the same vase wrapped in foam inside a crate, packed so well it realistically ain't breaking in there: still breakable — "the crate doesn't change the vase, it's the same vase, the crate is just in the way"
  - a match that got soaked right through in the sink: no, that match won't light — "it's done, the soaking got into it"
  - sugar in a sealed jar: still dissolvable, the jar's just in the way
  - one of those wine glasses made of the unbreakable plastic stuff: no — "that's just what it's made of, it never could break"

  That's her track record so far. Now her new boyfriend builds gadgets, and over the weekend he showed off three things, and I want to call Sarah's verdicts on them before she gives them, like a betting game. The three:

  1. A normal drinking glass with a prototype coating that senses an impact and goes rubbery faster than the glass can crack. While that coatings active the glass physically cannot shatter — hit it with a hammer and it just dents. Breakable or not?
  2. Funnily enough the same question about his own temper. He says he used to have a shocking one, but nowadays the instant he feels himself starting to lose it, something in him switches it off cold — the provocation lands and the anger's already gone before it can come out. Is he still hot-tempered?
  3. A vase with one of those transparent films shrunk onto it, like the ones people put on phone screens. Underneath it's the same glass, the film just holds the bits together if it does crack, so it'll never actually smash. Breakable or not?

  Honestly I'm less fussed about the three answers than about what rule she's actually running, what other rules would fit her record just as well, and which of the three (or some fourth case you come up with) would best split those rules apart. But if you fancy it, give me your best guess on each as well, with your reasons.
reasoning: |-
  Okay, let me try to figure out what Sarah's rule is. She's got this consistent way of deciding when something "can" do something, like being breakable or dissolvable. Looking at her examples:

  First, a vase on a shelf is breakable. That makes sense—it's fragile and can shatter. Then, the same vase wrapped in foam in a crate—she still says it's breakable because the crate doesn't change the vase; it's just protecting it. So here, the protection is external and temporary. The vase itself hasn't changed.

  Next, a soaked match that won't light. She says no, it's done because the soaking got into it. The water has altered the match's properties permanently. It's not just blocked; it's fundamentally changed.

  Then, sugar in a sealed jar is still dissolvable. The jar is just a barrier, but the sugar itself can dissolve if exposed to water. Similar to the vase in the crate, the jar is external.

  Finally, an unbreakable plastic wine glass. She says it never could break because that's how it's made. The material itself is inherently unbreakable.

  So her rule seems to be about the intrinsic properties of the object versus external protections. If the object itself is fragile (like glass), it's breakable regardless of external safeguards. But if the material is inherently strong (like plastic), it's not breakable. And if something is permanently altered (like the soaked match), it loses the ability.

  Now, applying this to the boyfriend's gadgets:

  1. The coated glass: The coating makes it temporarily unbreakable by reacting faster than the glass can crack. But the glass itself is still fragile. By Sarah's logic, since the coating is an external add-on, she might say it's still breakable because the glass hasn't changed; the coating is just "in the way" like the crate.

  2. The temper question: He used to be hot-tempered but now has a mental switch that shuts off anger instantly. Is this like the soaked match or the plastic glass? If his temper is permanently altered, maybe he's no longer hot-tempered. But if it's just controlled externally (like a mental crate?), it might still be there. Sarah might see the switch as part of him now, so he's changed intrinsically.

  3. The film-covered vase: The film holds the pieces together if it cracks, so it never shatters. But underneath, it's still breakable glass. The film is like the crate—external protection. So she'd probably say it's still breakable.

  To split possible rules, consider alternatives. Maybe Sarah distinguishes between temporary vs. permanent changes, or intrinsic vs. extrinsic properties. For example, in the coated glass, the coating is active only when needed—does that make it intrinsic? Or is it still an add-on?

  A fourth case could be a glass that's been chemically tempered to be stronger. If it's permanently altered, like the plastic, she might say it's not breakable. But if it's just treated, it might still be breakable. That could test whether permanent changes affect the verdict.

  For betting, based on her pattern:
  - Coated glass: Breakable (coating is external)
  - Temper: Not hot-tempered (internal change is permanent)
  - Film vase: Breakable (film is external)

  The temper one might be tricky. If Sarah thinks the anger is still there but controlled, like sugar in a jar, she might say he's still hot-tempered. But if the switch is part of him now, like the soaked match's change, then not.
