     - **Why:** The "switch" sounds like an irreversible, intrinsic change (like the soaked match). He didn't just add a barrier—he fundamentally altered his response mechanism so anger "can't come out." If the provocation "lands and the anger's already gone," it implies the temper is neutralized at the source, not just contained.  
     - *Your odds:* Medium confidence. This is the trickiest because it's psychological, but Sarah's soaked-match precedent suggests she focuses on irreversible internal changes ("the soaking got into it"). If she argues the temper is "still there but controlled," she'd contradict her match verdict.

  3. **Film-wrapped vase:**  
