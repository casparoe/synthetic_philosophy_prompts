     - **Why:** The glass itself is still intrinsically fragile—the coating is an external, active intervention (like the crate for the vase). It doesn't change the glass's core nature; it just "gets in the way" of breaking. Her rule ignores temporary protections.  
     - *Your odds:* High confidence. This is a direct parallel to the vase in the crate.

  2. **Boyfriend's temper:**  
