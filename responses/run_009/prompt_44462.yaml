  ### Splitting the Rules: What Other Explanations Might Fit?
  Sarah's rule isn't the only one consistent with her verdicts. Other plausible rules could explain her track record, but they'd diverge on your cases. Here's how to test them:

  - **Rule A (Sarah's Likely Rule): Focus on unmodified intrinsic properties.**  
    - Coated glass: Breakable (glass is fragile underneath).  
