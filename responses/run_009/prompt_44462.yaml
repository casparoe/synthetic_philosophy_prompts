  Based on Sarah's verdicts, she's operating on a **core rule about intrinsic vs. extrinsic properties and irreversible changes**. Here's a breakdown of her logic, how it applies to your cases, and how to test it:

  ### Sarah's Rule (Best Fit Based on Her Verdicts)
  - **"Can" depends on the object's intrinsic, unmodified state, not temporary or external barriers.**  
    If the thing itself is inherently fragile (like glass), it's "breakable" even if protected externally (e.g., the vase in foam or sugar in a jar). Protections are just "in the way" and don't change what the object *is*.  
  - **But if the object is permanently altered or inherently non-breakable, it loses the ability.**  
    The soaked match isn't "lightable" because water irreversibly changed it. The plastic glass was *never* breakable because its material is intrinsically tough.  
  - **Key distinction:**  
    - ✅ **Intrinsic fragility + external protection = still capable** (e.g., vase in crate, sugar in jar).  
    - ❌ **Intrinsic non-fragility or irreversible damage = not capable** (e.g., plastic glass, soaked match).  
    - It's not about *current functionality* but about the *core nature* of the object when unmodified/unprotected.

  ### How This Rule Explains Her Verdicts
  - **Vase on shelf:** Intrinsically fragile → breakable.  
  - **Vase in crate:** Still intrinsically fragile (crate is external) → breakable.  
  - **Soaked match:** Irreversibly altered (water "got into it") → not lightable.  
  - **Sugar in jar:** Intrinsically dissolvable (jar is external) → dissolvable.  
  - **Plastic wine glass:** Intrinsically non-fragile → not breakable.  

  ### Your Betting Game: Predicted Verdicts for the Gadgets
  Using Sarah's rule, here's what she'd likely say, with reasoning:

  1. **Coated drinking glass:**  
