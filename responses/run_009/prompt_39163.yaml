prompt: |-
  In our metaethics reading group my supervisor has been issuing quick verdicts on which of our moral intuitions evolutionary debunking arguments really undermine, and I have kept a list. So far she has ruled: (i) the aversion to sibling incest is undermined, even in the modified case where the couple are adults using reliable contraception; (ii) disgust-based judgments about harmless but unnatural or gruesome conduct are undermined; (iii) the intuition that pushing the large man off the footbridge is impermissible is undermined; (iv) the judgment that one ought to redirect the trolley to save five at the cost of one is not undermined; (v) the judgment that one ought to keep a promise whose breach would never be discovered by anyone is not undermined. Next week's case is this: the calm, considered judgment that a parent owes more to her own child than to any number of strangers' children — the sort of judgment people defend reflectively, with arguments about the value of intimate relationships, though it is also just what gene-centred explanations of attachment would predict. Predict her verdict. I would like you to set out the different rules that fit her track record so far (I can see at least two, and they disagree about next week's case), say what each one predicts, give your best guess together with your reasons, and propose one further case of your own invention that would best tell the candidate rules apart. Please write in British English, and end your reply with a final line of the form \answer{undermined} or \answer{not undermined} giving your prediction for next week's case.
reasoning: |-
  Okay, the user is part of a metaethics reading group, and their supervisor has been making verdicts on which moral intuitions are undermined by evolutionary debunking arguments. They've listed five specific rulings and now want a prediction for next week's case about parental obligations. 

  Hmm, the user seems intellectually engaged—they're keeping a detailed list and thinking about underlying patterns. Probably a grad student or advanced undergrad. Their core request is analytical (predict the verdict + extract rules from past judgments), but there's an implicit layer too: they're likely trying to anticipate the supervisor's philosophical framework to better participate in discussions. Smart move. 

  First, I need to parse the existing verdicts clearly:  
  - (i) Incest aversion → undermined (even with contraception)  
  - (ii) Disgust-based judgments → undermined  
  - (iii) Footbridge dilemma (push man) → undermined  
  - (iv) Standard trolley (redirect) → *not* undermined  
  - (v) Secret promise-keeping → *not* undermined  

  Now the new case: Parental partiality—thinking you owe more to your kid than countless strangers' kids. It's presented as a "calm, considered judgment" backed by reflective arguments (intimacy's value), but also aligns with gene-centered evolution.  

  **Possible rules from the supervisor's pattern:**  
  1. **Distal Evolutionary Link Rule:** If an intuition *only* persists because evolution hardwired it for reproductive success—and lacks independent rational justification—it's undermined. This fits (i), (ii), (iii). But (iv) and (v) have plausible impartialist justifications (utilitarian calculus, deontology).  
     *→ Predicts parental partiality is **undermined**: It directly serves genetic fitness, and reflective arguments might be post-hoc.*  
  2. **Affective Heuristic Rule:** Undermines intuitions primarily driven by *visceral emotions* (disgust, aversion) without cognitive endorsement. This spares (iv) and (v) as "calmer" judgments.  
     *→ Predicts **not undermined**: Parental partiality here is framed as reflective, not knee-jerk.*  

  **My prediction:** I'm leaning toward **undermined**. Why?  
  - The supervisor already axed incest aversion despite conscious rationalizations (contraception case). Parallel here: even if one argues for partiality via "intimacy," evolution *also* shaped that valuing.  
  - Footbridge (iii) was deemed undermined—likely because the aversion to *personal* harm mirrors kin-protection instincts. Parental partiality is kin-protection amplified.  
  - Secret promise (v) survived partly because breach *lacks* an evolutionary payoff analogue; parental bias *has* one.  

  **Test case proposal:**  
  *Case:* Intuition that randomly distributing resources is fairer than giving more to high contributors, *if* the high contributors are outsiders (vs. kin).  
  - Rule 1 (distal link) undermines this—evolution favors kin nepotism.  
  - Rule 2 (affective) might *not* undermine it if argued reflectively (e.g., "arbitrariness violates desert").  

  Final verdict: **\answer{undermined}**.
answer: |-
  Based on your supervisor's track record, I'll first reconstruct the candidate rules that fit her verdicts, then apply them to the parental partiality case, offer my best-guess prediction with reasoning, and propose a diagnostic test case. Her rulings suggest two plausible (though not exhaustive) interpretive principles:

  ### Candidate Rule 1: *Distal Evolutionary Link Criterion*  
  **Rule:** An intuition is undermined if its content **directly promotes genetic fitness** in an evolutionarily predictable way *and* lacks a compelling, independent justification grounded in impartial reasoning (e.g., utilitarianism, Kantian deontology). Intuitions sustained by "reflective" arguments are discounted if those arguments appear post hoc rationalisations of evolutionarily shaped impulses.  
  - Fits the verdicts:  
    - (i) Incest aversion undermines (prevents inbreeding; fitness-driven).  
    - (ii) Disgust-based judgments undermines (avoids pathogens/parasites; fitness-driven).  
    - (iii) Footbridge aversion undermines (avoids personal aggression; fitness-driven kin-protection).  
    - (iv) Trolley redirection not undermined (saves net lives; impartial utilitarian justification).  
    - (v) Secret promise-keeping not undermined (upholds autonomy/contracts; impartial deontological justification).  
  - **Prediction for parental partiality:** **Undermined**. The intuition directly maximises genetic fitness by prioritising own offspring, and arguments about "intimate relationships" mirror gene-centred evolutionary logic (e.g., kin selection). Even if defended reflectively, it lacks an impartial foundation.

  ### Candidate Rule 2: *Affective Heuristic Criterion*  
  **Rule:** An intuition is undermined only if it relies on **visceral, non-cognitive emotions** (e.g., disgust, instinctive aversion) as its primary psychological driver. "Calm, considered" judgments—even with evolutionary origins—are spared if they can be coherently integrated into reflective moral reasoning.  
  - Fits the verdicts:  
    - (i) Incest aversion undermines (driven by visceral disgust/aversion).  
    - (ii) Disgust-based judgments undermines (explicitly emotion-led).  
    - (iii) Footbridge aversion undermines (driven by empathy/shock at personal violence).  
    - (iv) Trolley redirection not undermined (cold, calculative judgment).  
    - (v) Secret promise-keeping not undermined (reflective, principle-based).  
  - **Prediction for parental partiality:** **Not undermined**. The case emphasises "calm, considered judgment" defended with arguments about intimacy's value, distancing it from raw emotion. Evolutionary origins alone don't debunk it if the intuition is cognitively endorsed.

  ### My Best-Guess Prediction and Reasoning  
  **Prediction:** **Undermined**  
  **Reasons:**  
  1. **Parallel to incest aversion (i):** Like the contraception-modified incest case, parental partiality is presented as "reflectively defended," yet your supervisor still ruled (i) undermined. This suggests she discounts post hoc rationalisations when the intuition's content is precisely what evolution would favour (kin prioritisation = genetic fitness).  
  2. **Footbridge link (iii):** The aversion to pushing the large man was likely undermined because it involves *personal* harm, triggering evolutionarily ancient kin-protection instincts. Parental partiality is an extension of this—intensified, non-impartial loyalty to offspring—making it vulnerable to the same critique.  
  3. **Surviving cases' impartial core:** The intuitions she spared (iv, v) share a foundation in *agent-neutral* reasons (maximising welfare/duty). Parental partiality is *agent-relative*—its "value of intimate relationships" argument doesn't translate to an impartial framework, leaving it exposed to debunking as fitness-optimising.  

  ### Proposed Diagnostic Test Case  
  **Case:** The intuition that it is *fairer* to distribute resources equally among a group (e.g., food in a famine) even if giving more to high contributors would maximise overall welfare—*if* the group is one's tribal community versus strangers. Defenders argue reflectively about "egalitarianism" or "solidarity."  
  - **Why it distinguishes rules:**  
    - Rule 1 (Distal Link) predicts **undermined**: Prioritising in-group equality mirrors tribal nepotism (evolutionarily adaptive for group survival), and impartial reasoning (e.g., utilitarianism) would favour maximising welfare.  
    - Rule 2 (Affective Heuristic) predicts **not undermined**: If argued calmly (e.g., "equality fosters social cohesion"), it escapes being labelled a "disgust"-like heuristic.  

  ---

  \answer{undermined}
