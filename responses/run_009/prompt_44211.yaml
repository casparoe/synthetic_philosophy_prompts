prompt: |-
  I have no training in philosophy. The farthest I've gone is working through Wittgenstein's On Certainty by myself after a friend recommended it, alongside a few discussions of Moore's old proof of the external world, and for the past month I have been testing my friend Rosa with cases to see what she does with doubt. I now have a track record of her verdicts that I cannot fully make sense of. So far she has said: I know I have two hands, and no evidence is needed for that; I know the world existed long before last Tuesday; in a classic case where a belief is true only by luck, she denies knowledge; she denies I know my lottery ticket will lose even though the odds are one in three hundred million; and, on two occasions, instead of answering, she treated the question itself as broken — first when I asked whether she might be a brain in a vat, and again when I asked whether she knows she is not dreaming right now. In both cases she refused to say yes or no and seemed to think the question misfires.

  Next week I intend to run Moore's proof on her: I will say to her that I know I have two hands, that if I have hands there is an external world, and that therefore I know there is an external world. My question is whether she will accept that conclusion. I am less interested in her answer than in the rule she appears to be running, because several rules fit her verdicts so far about equally well as far as I can tell. Perhaps she thinks some things are simply known without any support, and knowledge flows through the if-then to the conclusion. Perhaps she holds something like Wittgenstein's own line, that the background certainties are not really objects of knowledge at all, in which case the conclusion should misfire for her the way the vat question did. Perhaps she would say she is entitled to the conclusion without knowing it. Or perhaps her answers just track how much doubt is in the air, so it all depends on how I set the question up. I also cannot decide whether her lottery verdict fits the Wittgenstein line or cuts against it. Please tell me what each of these rules predicts about the Moore proof, give me your best guess as to what Rosa will say along with your reasons for preferring that guess, and propose the further case that would best tell the candidate rules apart — I have one candidate, whether she knows she has never been on the moon, but I am not confident it splits anything. Please also separate what is genuinely contested among people who know this literature from what is basically settled, and do not present a contested reading as the consensus. Lead with your prediction in the first sentence, then give the reasoning, with no preamble and no restatement of my question.
reasoning: |-
  Okay, let me tackle this user's complex query step by step. The user has been experimenting with philosophical doubt scenarios on their friend Rosa, documenting her responses to various epistemology puzzles. Now they plan to test Moore's proof ("I know I have two hands; hands imply an external world; therefore I know there's an external world") and want to predict Rosa's reaction while deciphering her underlying epistemic rule.

  First, I need to map Rosa's established pattern: she accepts basic certainties (two hands, pre-Tuesday world) without evidence, rejects lucky/statistical knowledge (lottery ticket), and dismisses hyperbolic doubts (BIV/dreaming) as defective questions. This profile suggests she operates with something resembling Wittgensteinian hinges - where some propositions function as unquestionable foundations for knowledge claims.

  Now assessing how different frameworks would handle Moore's proof:
  - Foundationalism: Would accept the conclusion as knowledge flows from basic premises
  - Entitlement theory: Might grant rational acceptance without literal "knowledge"
  - Contextualism: Could go either way depending on doubt-salience
  - Wittgensteinian view: Should reject "know" for hinge propositions like external world existence

  The lottery case is particularly telling - her denial aligns with Wittgenstein's distinction between empirical knowledge and grammatical framework propositions. Her dismissal of dreaming/BIV questions further supports this reading, treating them as category errors rather than genuine doubts.

  For the prediction: Rosa will reject Moore's conclusion ("I know there's an external world") because hinges aren't objects of knowledge. She'll likely say the proof misunderstands how language works, similar to her BIV/dreaming responses. The moon case is actually perfect for testing - if she denies "I know I've never been to the moon" while accepting it as certain, that confirms the hinge framework.

  Key contested points in literature: Whether hinges are beliefs (Moyal-Sharrock vs Pritchard), if contextual factors matter (Williams), and exact status of lottery propositions. But core Wittgensteinian view that one doesn't "know" hinges remains prominent though not unanimous.

  Additional test cases could include: Knowledge of others' minds ("Does Rosa know you're not a p-zombie?") or historical facts where evidence exists but hinges apply ("Does she know dinosaurs existed?"). The moon question remains the cleanest divider though.
answer: |-
  **Prediction:** Rosa will reject Moore's conclusion ("I know there is an external world") and likely treat the *claim* to know this as broken or nonsensical, similar to the brain-in-a-vat and dreaming questions.

  **Reasoning & Rule Analysis:**
  Rosa's pattern strongly suggests a Wittgensteinian hinge epistemology (from *On Certainty*). Here's how the candidate rules predict her reaction to Moore's proof, why Wittgenstein's view fits best, and why the lottery case is consistent:

  1.  **"Some things known without support; knowledge flows through entailment."**
      *   **Prediction:** Accepts Moore's conclusion. Knowledge of hands (basic) + entailment → knowledge of the external world.
      *   **Problem:** Doesn't explain why she dismissed the BIV/dreaming questions as "broken." If hands are basic knowledge, why isn't "I'm not a BIV" also basic or derivable? Also clashes with lottery denial (basic high probability should suffice).

  2.  **"Wittgenstein's hinge certainty: Certainties aren't objects of knowledge."**
      *   **Prediction:** Rejects the conclusion. "I have hands" and "There is an external world" function as *hinges* – the unquestionable framework enabling the language-game of "knowing" and "doubting." Claiming to *know* a hinge is a misuse of "know," just like asking "Do I know I'm not a BIV?" was a broken question. The proof tries to treat a hinge (external world) as an empirical conclusion derived from another hinge (hands).
      *   **Fit:** Explains *all* her verdicts:
          *   "I know I have two hands": She correctly uses "know" *within* the framework where having hands is a practical certainty (like Moore in everyday contexts).
          *   Denial of knowledge in Gettier/lottery cases: Standard application of "know" requiring non-lucky justification, operating *within* the hinge framework.
          *   Rejection of BIV/dreaming questions: Recognizing they challenge the hinges themselves, making "know/doubt" inapplicable. Questions misfire.
          *   "I know the world existed...": A hinge certainty, correctly asserted within the normal framework.

  3.  **"Entitled to the conclusion without knowing it."**
      *   **Prediction:** Rejects the knowledge claim ("I know...") but accepts the proposition ("there is an external world") as something she's rationally entitled to believe/hold.
      *   **Problem:** While compatible with hinge epistemology (hinges are held, not known), it doesn't strongly predict the *broken question* reaction she exhibited to BIV/dreaming. She might just say "I don't *know* it, but I'm entitled to believe it." Her prior reactions suggest something stronger – that the question itself is flawed.

  4.  **"Answers track salience of doubt (Contextualism)."**
      *   **Prediction:** Highly dependent on how you present Moore's proof. If presented matter-of-factly, she *might* accept it (like "I know I have hands"). If presented in a skeptical context ("But could you prove the external world exists?"), she *might* deny it.
      *   **Problem:** Doesn't explain the *categorical* dismissal ("broken question") of BIV/dreaming, regardless of context. Also, her acceptance of "hands" and "old world" seem stable, not contextually shifting in your examples. Lottery denial is standard contextualism, but hinges explain it too.

  **Why Wittgenstein's View is the Best Fit & Prediction:**
  Rosa's consistent refusal to engage with BIV/dreaming questions *as meaningful doubts* or knowledge claims is the strongest clue. This directly mirrors Wittgenstein's view that radical skeptical hypotheses attempt to doubt what must be held fast for doubting/knowing to make sense. Moore's Proof commits the same error Wittgenstein diagnosed in Moore: trying to use "know" for what grounds the language-game of knowing. Rosa will likely see "I know there is an external world" as similarly nonsensical/misplaced as "I know I'm not a BIV." She might say: "It's not something I *know*, it's what makes knowing anything else possible," or simply reject the phrasing.

  **The Lottery Case & Wittgenstein:**
  Her lottery denial *fits* the Wittgensteinian view. The lottery proposition ("This ticket will lose") is an empirical claim *within* the hinge framework. It requires justification to count as knowledge. While extremely probable, the possibility of winning isn't ruled out by the framework itself (unlike "I have hands" in normal contexts). It's a case where the hinge framework *allows* genuine doubt, unlike the BIV scenario. High probability alone doesn't equate to the *certainty* of a hinge.

  **Best Test Case: "Does Rosa know she has never been on the moon?"**
  This is an *excellent* test case to distinguish the rules:

  1.  **Foundationalism/Flow:** Likely says **Yes**. It's an ordinary empirical belief, perhaps basic or easily inferred.
  2.  **Wittgenstein (Hinge):** Likely says **No** (if asked directly as a knowledge claim). While utterly certain for her ("Of course I haven't!"), this certainty functions as a hinge – part of her world-picture (e.g., her biography, history, physics). Claiming to *know* it treats a framework certainty as an empirical conclusion. She might treat the question as slightly odd but probably not "broken" like BIV. Crucially, she should *deny* the knowledge claim while affirming the certainty.
  3.  **Entitlement:** Says **No** to "knows," but **Yes** to being rationally entitled to believe it.
  4.  **Contextualism:** **Depends on context.** Normally: Yes. If doubt is raised ("Could NASA have secretly taken you?"): Maybe No.

  **Contested vs. Settled in the Literature:**

  *   **Settled (Broad Consensus):**
      *   Wittgenstein *rejected* Moore's use of "know" for propositions like "Here is a hand" or "The external world exists" in *On Certainty*. He thought Moore misused the term.
      *   Wittgenstein argued that radical skeptical doubts (BIV, dreaming) are nonsensical because they attempt to doubt the framework (hinges) that make doubt meaningful.
      *   Knowledge requires justification and the absence of defeating conditions (Gettier, lottery cases show this).

  *   **Genuinely Contested:**
      *   **The Nature & Status of Hinges:** Are they *beliefs* (Danièle Moyal-Sharrock) or something more primitive, like animal certainty or non-propositional trust (e.g., Duncan Pritchard, Michael Williams)? This affects whether "I know I have hands" is ever literally true or always a grammatical misstep.
      *   **The Role of Context:** How much do conversational context and the salience of error possibilities influence whether a hinge is treated *as* a hinge or as an empirical proposition? (Contextualists like Keith DeRose vs. more invariant hinge interpretations like Moyal-Sharrock).
      *   **Lottery Propositions:** Is denying knowledge in lottery cases primarily due to the *salience* of a remote possibility (Contextualism) or an inherent feature of probabilistic justification (e.g., the Failure of Closure arguments)? Wittgensteinians might see it as showing the limits of empirical justification within the framework, distinct from hinge certainty.
      *   **Entitlement vs. Hinges:** Is "entitlement" (Crispin Wright) a better way to characterize our relation to hinges than Wittgenstein's more radical "not-knowing"?
      *   **How Many/Diverse are Hinges?** Is there a single monolithic framework ("world-picture") or diverse, local hinges? This impacts cases like "Never been to the moon."

  **Conclusion:**
  Based on her pattern, especially treating radical skepticism as "broken," Rosa operates with a Wittgensteinian hinge epistemology. She will reject Moore's conclusion that "I know there is an external world," seeing it as a similar misuse of "know." The "never been on the moon" case is ideal for testing: A Wittgensteinian hinge reading predicts she will *deny* she *knows* it, while affirming the certainty. This distinguishes it sharply from foundationalism/flow and contextualism (in normal contexts), and less sharply from entitlement (which would also deny "knows"). Present Moore's proof clearly and ask the moon question directly to confirm.
