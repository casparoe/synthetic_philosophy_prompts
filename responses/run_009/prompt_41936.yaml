answer: |-
  In both cases, the predictor's action depends on their model of your decision function, but the *payoff structure* fundamentally differs, creating the asymmetry. In the mugging, Omega rewards your policy in the heads branch with £10,000 if you commit to paying, while penalizing you £100 in tails. Since the branches are symmetric and the gain dwarfs the loss, the policy of paying maximizes expected utility: +£4,950 ex ante. The causal link through prediction allows your policy to "reach" the heads branch by ensuring Omega's favorable response there.  

  The blackmailer, however, structures the demand to *exploit* your policy. If you pre-commit to paying, he only demands payment when the fire won’t happen (sending the letter iff no fire and prediction of payment), costing you £100 unnecessarily. If you refuse, he demands only when the fire will happen (letter iff fire and prediction of refusal), but you avoid paying when safe. Crucially, your payment cannot alter the fire’s occurrence; it’s fixed independently. Thus, paying sacrifices £100 in no-fire worlds without mitigating loss in fire worlds, while refusing preserves £100 in safe scenarios. Ex ante, refusing dominates: expected utility of -£5,000p (fire probability) versus -£100(1-p) - £10,000p for paying. The causal structure is respected—your decision affects only the transfer, not the fire—but the policy’s performance across states favors refusal. FDT isn’t cherry-picking; it’s consistently optimizing the decision function’s global output against the problem’s causal graph.
