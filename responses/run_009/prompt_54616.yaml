  Below is a complete, practical decision procedure for your committee, designed to be run in a 2-hour meeting with ~8 proposals. It uses Lara Buchak's Risk-Weighted Expected Utility (REU) to systematize risk attitudes, avoids relitigating risk preferences, and handles portfolio allocation. Judgment calls are explicitly flagged, and fallbacks are included.

  ---

  ### **Decision Procedure: REU Pilot Funding Allocation**
  #### **1. Fix the Risk Function Annually (Judgment Call #1: Choosing γ)**
     - **Step**: At the start of each academic year, vote on a **risk function** \( r(p) = p^\gamma \) (power function family). 
       - Offer 5 options for γ:  
         - \( \gamma = 0.25 \) (Extreme risk-aversion)  
         - \( \gamma = 0.5 \) (Moderate risk-aversion)  
         - \( \gamma = 1 \) (Risk-neutral, i.e., EU = EV)  
         - \( \gamma = 2 \) (Moderate risk-seeking)  
         - \( \gamma = 4 \) (Extreme risk-seeking)  
       - **Process**: 
         - Each member votes for one γ. 
         - Majority wins; chair breaks ties. 
         - γ is fixed for all decisions that year.  
     - **Why this works**: γ < 1 (concave r) = risk-averse; γ > 1 (convex r) = risk-seeking. The power function is simple, flexible, and tractable for computation.  
     - **Fallback**: If deadlocked, default to γ = 1 (risk-neutral EV).  

  #### **2. Transform Proposals into Gambles (Judgment Call #2: Outcome Binning & Probabilities)**
  For each proposal, the committee agrees on:  
     - **Outcomes**: Bin into **3 ordered categories** (worst/moderate/best) to avoid complexity. Define:  
       - **Worst**: Complete failure (e.g., no publishable result).  
       - **Moderate**: Modest success (e.g., incremental finding).  
       - **Best**: High impact (e.g., theory confirmation, major discovery).  
     - **Utilities**: Assign scientific value (0–100 scale) to outcomes:  
       - Worst = 0, Moderate = 50, Best = 100 (scale is linear and fixed).  
     - **Probabilities**: Assign probabilities (must sum to 1). **Require proposers to justify probabilities**, but committee votes to accept/adjust.  
     - **Cost**: Record requested funding.  
     - **Key Judgment**: Binning and probability assignments are subjective. Avoid >3 outcomes (overcomplicates). If consensus fails, reject the proposal.  

  #### **3. Compute REU per Dollar (10-Minute Whiteboard Recipe)**
  For a proposal with outcomes ordered worst (W) → moderate (M) → best (B):  
     - Inputs:  
       - Utilities: \( u_W, u_M, u_B \)  
       - Probabilities: \( p_W, p_M, p_B \)  
       - Cumulative probabilities: \( F_W = p_W \), \( F_M = p_W + p_M \), \( F_B = 1 \)  
     - REU formula:  
       \[
       \text{REU} = u_W \cdot [r(F_W)] + u_M \cdot [r(F_M) - r(F_W)] + u_B \cdot [r(F_B) - r(F_M)]
       \]
       where \( r(p) = p^\gamma \) (use pre-agreed γ).  
     - **REU per dollar**: \( \text{REU} / \text{cost} \)  
     - **Whiteboard shortcut**: 
       1. Compute \( r(F_W) = F_W^\gamma \), \( r(F_M) = F_M^\gamma \), \( r(1) = 1 \).  
       2. Weights: \( w_W = r(F_W) \), \( w_M = r(F_M) - r(F_W) \), \( w_B = 1 - r(F_M) \).  
       3. REU = \( (u_W \cdot w_W) + (u_M \cdot w_M) + (u_B \cdot w_B) \).  
       4. REU per dollar = REU / cost.  
     - **Example calc**: Proposal with \( u_W=0, u_M=50, u_B=100 \), \( p_W=0.2, p_M=0.6, p_B=0.2 \), γ=0.5:  
       - \( F_W=0.2 \), \( r(F_W)=0.2^{0.5}≈0.447 \)  
       - \( F_M=0.8 \), \( r(F_M)=0.8^{0.5}≈0.894 \)  
       - Weights: \( w_W=0.447, w_M=0.894-0.447=0.447, w_B=1-0.894=0.106 \)  
       - REU = \( 0×0.447 + 50×0.447 + 100×0.106 = 22.35 + 10.6 = 32.95 \)  

  #### **4. Quick Check for When Risk Matters**
  Risk attitude flips rankings **only if**:  
     - One proposal has high variance (e.g., moonshot with high best/worst spread).  
     - Another has low variance (e.g., safe project).  
     - **Heuristic**: Compute **EV per dollar** alongside REU per dollar. If rankings differ, risk matters. If identical, default to EV to save time.  

  #### **5. Handle Portfolio Allocation**
     - **Step 1**: Rank all proposals by **REU per dollar** (descending).  
     - **Step 2**: Fund top proposals until the pot ($15k) is exhausted.  
     - **Why this works**: Approximates optimal allocation under budget constraints. REU per dollar prioritizes "bang for buck" under risk attitudes.  
     - **Judgment Call #3: Correlated Projects**  
       - If sub-projects are interdependent (e.g., shared theory), **treat as a single proposal** with joint outcomes (e.g., "both fail" = worst, "both succeed" = best).  
       - If independent, treat as separate proposals.  
     - **Fallback**: If REU per dollar ties, fund the cheaper project (maximizes # studies).  

