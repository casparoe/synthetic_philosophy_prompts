  ### **Where the Moonshot Person (You) Loses**  
  As a moonshot advocate, you lose under **risk-averse settings (γ<1)**:  
  - Proposal (b) has the **lowest REU/$ (0.0078)** when γ=0.5.  
  - **Why**: A concave r (γ=0.5) overweighted the 85% chance of failure (\( w_W=0.922 \)), crushing the REU of (b) despite its high upside.  
  - **The system isn’t secretly on your side**: REU explicitly models risk-aversion as penalizing high failure probabilities, which disproportionately hurts moonshots.  

  ---

  ### **Key Judgment Calls & Limitations**  
  1. **Binning Granularity**: 3 outcomes are tractable but coarse. If a proposal’s outcomes defy binning (e.g., multi-modal), reject it.  
  2. **Probability Assignment**: Subjective probabilities can be gamed. Require proposers to justify with prelim data/theory.  
  3. **Correlations**: Only captured if projects are bundled. If submitted separately, synergies are ignored.  
  4. **REU per Dollar Heuristic**: Approximates portfolio optimization but ignores cross-project risk pooling. For tractability, this is acceptable.  

  ### **Final Tip**  
  Run a mock meeting with past proposals to calibrate γ and binning rules. This builds buy-in and exposes edge cases. REU won’t eliminate disagreements, but it makes risk attitudes transparent and consistent—no more "vibes" or seniority ties.
