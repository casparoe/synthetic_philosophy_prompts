  - Outcomes are ordered from worst to best.
  - We assign a utility to each outcome and a probability.
  - The cumulative probability is the probability of getting at least a given outcome (or worse? note: in REU, we typically consider the probability of getting an outcome as bad as the current one or worse? Actually, we start from worst and go to best, so cumulative probability at a given outcome is the probability of getting that outcome or worse? But note: in the standard definition, we start from the worst and then move to better outcomes. The cumulative probability for the worst outcome is its own probability, then for the next worst it's the probability of the worst plus the next, etc. until the best which has cumulative probability 1.)

