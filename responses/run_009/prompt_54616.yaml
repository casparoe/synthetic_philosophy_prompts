  But note: the cumulative probability up to outcome i (inclusive) is P_i = Σ_{j=1}^{i} p_j. Then the weight for outcome x_i is: r(P_i) - r(P_{i-1}) (with P_0=0).

  Alternatively, we can think of the weight for the best outcome as r(1) - r(P_{n-1}) = 1 - r(P_{n-1}), and so on.

  The risk function r captures the decision maker's attitude towards risk. Typically:
  - If r is linear: REU reduces to expected utility (risk neutral).
