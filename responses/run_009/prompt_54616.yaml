  - **REU calc (γ=2)**:  
    - \( r(F_W)=0.85^2=0.7225 \)  
    - Weights: \( w_W=0.7225 \), \( w_B=0.2775 \)  
    - REU = \( 100×0.2775 = 27.75 \)  
    - REU/$ = 27.75 / 1000 = **0.0278**  

  #### **Proposal (c): Correlated Coin-Flips**  
  - Cost: $2k for two sub-projects (A and B).  
  - Outcomes:  
    - Both fail (Worst: 0) @ P=0.25  
    - One succeeds (Moderate: 50) @ P=0.50  
    - Both succeed (Best: 150, due to synergy) @ P=0.25  
  - *Note: "Both succeed" utility >50+50 due to synergy.*  
  - **REU calc (γ=0.5)**:  
    - \( F_W=0.25 \), \( r(F_W)=0.25^{0.5}=0.5 \)  
    - \( F_M=0.75 \), \( r(F_M)=0.75^{0.5}≈0.866 \)  
    - Weights: \( w_W=0.5 \), \( w_M=0.866-0.5=0.366 \), \( w_B=1-0.866=0.134 \)  
    - REU = \( 0×0.5 + 50×0.366 + 150×0.134 = 18.3 + 20.1 = 38.4 \)  
    - REU/$ = 38.4 / 2000 = **0.0192**  
  - **REU calc (γ=2)**:  
    - \( r(F_W)=0.25^2=0.0625 \)  
    - \( r(F_M)=0.75^2=0.5625 \)  
    - Weights: \( w_W=0.0625 \), \( w_M=0.5625-0.0625=0.5 \), \( w_B=1-0.5625=0.4375 \)  
    - REU = \( 0×0.0625 + 50×0.5 + 150×0.4375 = 25 + 65.625 = 90.625 \)  
    - REU/$ = 90.625 / 2000 = **0.0453**  

