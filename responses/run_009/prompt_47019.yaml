  First, I need to validate their observation - yes, the standard objections do get recycled without converting anyone. Their "contested data" point is sharp: even basic intuitions (like explosion's invalidity) are partisan. When dialetheists embrace contradictions while gap theorists cling to non-contradiction, it's not that one side has better evidence - they're prioritizing different theoretical virtues. 

  Now, diagnosing the structure: it's not merely verbal (they're all talking about truth), but constitutive. Each camp builds truth around distinct core commitments: Kripkeans value preserving classical logic's bivalence-except-for-liars, Priestians prioritize unrestricted T-schema even at contradiction-cost. This explains why objections bounce off - you're not just attacking a theory but a value system. 

  Progress? Revenge-proofing won't help - revenge paradoxes target constitutive choices themselves. Real movement would require either: (1) showing one approach better serves an external goal (e.g. grounding linguistics), or (2) a new formalism that satisfies all virtues (unlikely). More plausibly, we might see meta-consensus that truth theories are tools for specific tasks. 

  What would change my mind? If someone proved - not just argued - that e.g. paraconsistent logic is indispensable for quantum mechanics, making dialetheism empirically forced. But that's sci-fi. Barring that, the normative stalemate holds. 

  User's clearly craving intellectual honesty - they want me to pick a side. I'll lean into their hypothesis but stress it's not defeatism: naming the normative clash is progress. And I'll leave hooks for pushback: if they think I'm underestimating formal advances, they'll tell me.
answer: |-
  Your diagnosis is perceptive, and I largely agree: **the core disagreement is normative and constitutive, not empirical or resolvable by formal finesse alone.** Each camp prioritizes different theoretical virtues when forced to abandon classical ideals:

  1.  **Gap theorists (Kripkeans)** prioritize preserving classical logic (non-contradiction, excluded middle) *outside* the truth predicate, accepting a restricted T-schema and semantic gaps as the cost.
  2.  **Glut theorists (Dialetheists)** prioritize an unrestricted T-schema and the expressive power it enables, accepting contradictions *within* a paraconsistent framework as the cost.
  3.  **Revision theorists** prioritize capturing the *circular*, unstable nature of truth attributions, accepting that truth isn't stably bivalent or even stably gappy/glutty as the cost.
  4.  **Hierarchists** prioritize consistency at all costs, accepting radical expressive limitations as the cost.

  **Why this is constitutive, not merely verbal or empirical:**
  *   There's no shared "pre-theoretic data" uncontested by all. Intuitions about the T-schema, non-contradiction, or whether "This sentence is not true" expresses a proposition are *theory-laden*. The "data" is defined by the chosen framework.
  *   Objections (Strengthened Liar, triviality, instability) are not refutations but *internal critiques* highlighting the *cost* each theory pays relative to the *virtues prioritized by the objector*. A dialetheist sees "triviality" as a solved problem via paraconsistency; a gap theorist sees "ungrounded" as a virtue, not a flaw needing revenge-proofing.
  *   The core question is: **What is the *point* of a truth predicate?** Is it to underpin precise, contradiction-free discourse (favoring gaps/hierarchies)? To maximize expressive power for semantic closure (favoring gluts)? To model the instability of semantic reflection (favoring revision)? This choice dictates which cost is acceptable.

  **Genuine progress would look like:**
  1.  **Solving an External Problem:** Demonstrating one approach uniquely solves a significant problem *outside* pure truth theory (e.g., providing the best logic for quantum computation, grounding a successful theory of vagueness, or underpinning a crucial AI reasoning module). Success here would shift the normative weight.
  2.  **A New Foundational Framework:** Developing a formalism that genuinely satisfies *all* core intuitions (unrestricted T-schema, non-contradiction, stability, expressiveness) without revenge or crippling limitations. This seems unlikely given Gödel-Tarski limits.
  3.  **Meta-Consensus:** Recognizing the dispute as fundamentally normative/constitutive and developing a shared framework for *comparing the costs/benefits* of each approach for *specific tasks* (e.g., "Use Kripke for model-theoretic semantics; use LP for certain defeasible reasoning contexts"). This reframes progress as pragmatic, not absolute.

  **What would change my mind?**
  *   **Substantive Evidence:** If a specific solution (e.g., a particular gap theory) demonstrably blocked *all* revenge paradoxes *without* ad hoc restrictions or crippling expressive power, resolving the internal tension that fuels normative disagreement. (Current "solutions" shift, not eliminate, the tension).
  *   **Verbal Evidence:** If it were shown the camps are *literally defining* "true" differently in a way that makes their claims compatible (e.g., gap theorists mean "determinately true", glut theorists mean "true-in-some-context"). But they all claim to address the *same* intuitive concept expressed by the Liar sentence itself.

  **Conclusion:** Barring a revolutionary formalism or decisive external application, expect stalemate. Progress lies in clarifying the constitutive choices, mapping their costs/benefits rigorously, and seeking pragmatic "best fit" theories for specific domains, abandoning the quest for a single "correct" theory of truth for natural language. Your hypothesis captures the field's core impasse.
