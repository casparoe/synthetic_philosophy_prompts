  **Conclusion**
  The ALID procedure is designed to be run in one sitting. It forces you to consider the direct and indirect effects, acknowledges when long-term effects are too uncertain, and then uses tiebreakers. It also has a guard against ignoring huge impacts if they are credible. 

  For the three scenarios, the procedure led to:
  1. International health charity (over food bank) based on settled values.
  2. Investing and giving later (over giving now) based on the slight edge in Step 1 and tiebreaker.
  3. Lobbying effort (over direct charity) if systemic change is a settled value.

  But note: the outcomes depend on your specific answers and tiebreakers. The procedure does not dictate the outcome; it structures your thinking and then uses your values when consequences are uncertain.
answer: |-
  Below is a decision procedure designed to address your core concerns: acknowledging the limits of foresight, avoiding false precision, and explicitly handling cluelessness. It’s structured as a flowchart of questions, with **stopping rules** that trigger when consequences become too uncertain to compare. The procedure prioritizes defensible simplicity over false rigor and includes safeguards against speculative long-term tail risks. It assumes no new research—only your existing knowledge and values.

  ---

  ### **The ALID Procedure (Acknowledging Limits in Donation)**  
  *Run once a year with a notepad. Start with 2–5 donation options. Answer questions in order.*

  #### **Step 1: Direct and Near-Term Effects**  
  **Question 1:** *For each option, what is the most reliable estimate of direct, near-term impact per dollar (e.g., lives saved, meals provided, students supported) over the next 1–5 years? Use only what you already know.*  
  - **Sufficient answer:** A rough quantitative estimate (e.g., "$100 provides 50 meals" or "$5,000 saves one life") or a clear qualitative ranking (e.g., "Option A clearly helps more people directly than Option B").  
  - **Stopping rule:** If one option is **at least 10x better** than others on this metric *and* you’re >90% confident, **choose it and stop**. If not, proceed.  
  - *Why?* This step captures "first ripple" effects where data is least speculative. The 10x threshold avoids analysis paralysis for clear wins.

  #### **Step 2: Known Harm or Waste**  
  **Question 2:** *Is there strong evidence (not speculation) that one option causes direct harm (e.g., fraud, environmental damage) or wastes >50% of funds?*  
  - **Sufficient answer:** "Yes" if you have direct knowledge (e.g., audits, verified reports) of material harm or inefficiency; "No" otherwise.  
  - **Stopping rule:** If an option fails this, **eliminate it**. If all options fail, **revisit your list**. Proceed with remaining options.  
  - *Why?* Filters out options with unambiguous red flags. Avoids "invented stories" by requiring evidence.

  #### **Step 3: Cluelessness Check**  
  **Question 3:** *For each option, are the differences in long-term effects (10+ years) so vast and unknowable that they could swamp near-term differences?*  
  - **Sufficient answer:** "Yes" if:  
    - You can imagine equally plausible stories where an option leads to massive good *or* harm (e.g., "Preventing disease now might lead to overpopulation collapse OR a future genius saved").  
    - No option has a *credible, unique* long-term mechanism (e.g., "This vaccine program definitely reduces pandemic risk").  
  - **Stopping rule:** If "Yes" for **all** options, **declare a tie on consequences** and go to Step 5. If "No" for one option, favor it and go to Step 4. If mixed, proceed to Step 4.  
  - *Why?* Flags when consequences are truly clueless. Forces admission of uncertainty instead of false precision.

  #### **Step 4: Tail Risk Assessment**  
  **Question 4:** *Ignoring speculative stories, does one option have a credible (>0.1% chance), non-negligible path to enormous good or harm (e.g., nuclear risk reduction, triggering unrest)?*  
  - **Sufficient answer:** "Yes" only if:  
    - The mechanism is documented (e.g., "This AI-safety org is cited by experts") or directly observable (e.g., "Funding this unstable region risks aid diversion to militias").  
    - The impact is >100x the near-term effects (e.g., "Preventing a pandemic could save millions").  
  - **Stopping rule:**  
    - If one option has a **unique credible path to enormous harm**, **eliminate it**.  
    - If one option has a **unique credible path to enormous good**, **choose it and stop**.  
    - If all have symmetric tail risks (e.g., both could affect geopolitics unpredictably) or risks are implausible, **treat as irrelevant** and proceed.  
  - *Why?* Neutralizes adversarial storytelling by demanding credibility and uniqueness. Ignores noise (e.g., "a donation might butterfly-effect into a dictator's birth").

  #### **Step 5: Tiebreaker Protocol**  
  *Use only if options are tied after Step 4 (or after Step 3 if clueless).*  
  **Question 5:** *In order, apply these rules until one option wins:*  
  1. **Settled values:** Which option aligns with your core commitments (e.g., "Always prioritize the poorest" or "Honor my promise to local community")? *If clear, choose it.*  
  2. **Diversification:** Have you given heavily to one option in the past 2 years? *If yes, choose another.*  
  3. **Coin flip:** *Assign heads/tails and flip a coin.*  
  - **Stopping rule:** After applying one rule, **stop and choose**.  
  - *Why?* Resolves ties without pretending uncertainty is resolved. Prioritizes integrity/diversity over arbitrary choices.

  ---

  ### **Applying the Procedure to Your Three Scenarios**  
  *Assumptions: Based on common knowledge (e.g., GiveWell estimates). We’ll run the steps honestly, even if outcomes are unpopular.*

  #### **Scenario 1: International Health Charity vs. Local Food Bank**  
  - **Step 1:**  
    - Health charity: ~1 life saved per $5,000 (high confidence from audits).  
    - Food bank: ~100 meals per $100 (high confidence from visits).  
    - *Analysis:* No 10x difference (saving a life ≠ 50,000 meals? Uncertain conversion). Proceed.  
  - **Step 2:** No evidence of harm/waste for either. Proceed.  
  - **Step 3:**  
    - Health charity: Massive cluelessness (alters who exists, future societies).  
    - Food bank: Less cluelessness (local ripples, but smaller scale).  
    - *Analysis:* "Yes" to cluelessness for both. Differences in scale could be swamped by unknowns. **Tie on consequences** → Go to Step 5.  
  - **Step 4:** No credible unique tail risks (e.g., no evidence health charity causes collapse). Proceed.  
  - **Step 5:**  
    - Settled values: If you value "helping the globally poorest," choose health charity. If "strengthen my community," choose food bank.  
    - *Outcome:* If no settled value, diversify or flip coin. **Example:** You prioritize global poverty → **Choose health charity**.  

  #### **Scenario 2: Give Now vs. Invest and Give Later**  
  - **Step 1:**  
    - Give now: ~0.2 lives saved per $1,000 (if donated to health charity).  
    - Invest and give later: ~$1,000 → $7,000 in 30 years (5% real return) → ~1.4 lives saved.  
    - *Analysis:* Giving later saves ~7x more lives. Not 10x, and discounting future lives is debatable. Proceed.  
  - **Step 2:** No harm/waste evidence. Proceed.  
  - **Step 3:**  
    - Both clueless: Saving lives now vs. later alters future populations unpredictably.  
    - *Analysis:* Cluelessness swamps the 7x difference. **Tie on consequences** → Go to Step 5.  
  - **Step 4:**  
    - Give now: Tiny chance it prevents a near-term catastrophe (e.g., pandemic).  
    - Give later: Tiny chance it addresses future existential risks (e.g., AI alignment).  
    - *Analysis:* Both symmetric and speculative. Treat as irrelevant. Proceed.  
  - **Step 5:**  
    - Settled values: If "urgency" is core, choose now. If "maximize resources," choose later.  
    - *Outcome:* If no value preference, diversification (e.g., split 50/50) or coin flip. **Example:** You value efficiency → **Choose invest and give later**.  
    - *Note:* This outcome might feel uncomfortable—it bets on an uncertain future.

  #### **Scenario 3: Modest Lobbying vs. Predictable Charity**  
  *(Compared to health charity from Scenario 1)*  
  - **Step 1:**  
    - Lobbying: Might pass a law helping 10,000 people (e.g., cleaner water). Near-term effect per dollar? Unknown.  
    - Health charity: 1 life/$5,000 (clear).  
    - *Analysis:* Lobbying’s near-term effect is vague. No 10x winner. Proceed.  
  - **Step 2:** No evidence of harm. Proceed.  
  - **Step 3:**  
    - Lobbying: Extreme cluelessness (law could spark reform or backlash for decades).  
    - Health charity: Cluelessness (as before).  
    - *Analysis:* Both clueless, but lobbying’s uncertainty is uniquely vast (systemic change). **Tie on consequences** → Go to Step 5.  
  - **Step 4:**  
    - Lobbying: Credible tail risk (e.g., 0.1% chance law triggers industry backlash harming millions).  
    - *Analysis:* Not unique (all policies have backlash risks) and <0.1% credible? Ignore. Proceed.  
  - **Step 5:**  
    - Settled values: If "systemic change > band-aids," choose lobbying. If "certainty matters," choose health.  
    - *Outcome:* If you value structural impact → **Choose lobbying**. Else, choose health.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve fundamental value disagreements:** It can’t tell you whether saving a life now is better than saving two later, or if local loyalty trumps global need. It defers to your settled values.  
  2. **Quantify the unquantifiable:** Ripple effects beyond 5–10 years, existential risk probabilities, or moral weights (e.g., lives vs. meals) are handled by tiebreakers, not math.  
  3. **Beat back extreme uncertainty:** When all options are equally clueless (Scenario 2), it doesn’t pretend investing is "objectively better"—it uses your values to break ties.  
  4. **Replace domain expertise:** If you lack basic knowledge (e.g., "Is this charity a scam?"), the procedure fails. Step 2 relies on *your* evidence.  

  ---

  ### **Weakest Step and Caveats**  
  - **Weakest step: Step 3 (Cluelessness Check).**  
    - **Why it might be wrong:** It assumes you can impartially assess when consequences are unknowable. But cognitive biases (e.g., favoring exciting options) might lead you to declare "cluelessness" too early or too late.  
    - **What could change the advice:**  
      - If you accept **strong long-termist principles** (e.g., "Future lives matter equally, so we must model them"), you might replace Step 3 with expected-value calculations. This could favor patient investing (Scenario 2) or lobbying (Scenario 3).  
      - If you adopt **precautionary principles** (e.g., "Avoid any risk of catastrophe"), Step 4 might dominate, eliminating options with tail risks (e.g., lobbying).  
      - **Empirical reality check:** If new research showed certain interventions (e.g., policy advocacy) have predictable long-term effects, Step 3 would need adjustment.  

  - **Biggest vulnerability:** The procedure trusts your self-awareness. If you overestimate your confidence (e.g., in Step 1) or values (e.g., in Step 5), outcomes may be skewed.  

  ---

  ### **Final Thoughts**  
  This procedure forces humility: when consequences fade into cluelessness, it hands the decision back to your values or a coin flip. It won’t satisfy someone demanding "the optimal choice," but it avoids the false confidence of arithmetic on made-up numbers. For your annual sitting:  
  1. List options.  
  2. Run Steps 1–5.  
  3. Accept that some years, the answer is "I don’t know, so I’ll default to my values."  

  If you use this, revisit it yearly—your values or the world may change. And if you find yourself fighting the procedure, ask: *Am I seeking certainty where none exists?*
