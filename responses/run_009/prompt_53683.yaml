prompt: |-
  For years I've been giving away about ten percent of my income, and for most of that time I chose where it went by doing simple arithmetic: estimated lives saved or meals provided per dollar, adjusted for how likely the charity seemed to waste the money, and gave to the front-runner. I've lost faith in that method, and I want your help building something to replace it. Here is what spoiled it. The more I thought about what a donation actually does, the less the arithmetic seemed to cover. A charity that prevents a case of disease changes whether particular children are born later, who exists, who meets whom, what gets invented and what gets neglected, down through generations I can't see. The same goes for smaller gifts: money given to a struggling student here changes a family's trajectory there. When I try to put probabilities on any of that, I notice I'm just making numbers up — and worse, I can always invent a story for good effects and an equally plausible story for bad effects, which suggests the honest conclusion is often that I have no idea which option does more good, not that I have a small idea I can write down. I gather people who think about this call it being clueless about consequences; I don't care about the label, the problem is what it names. What I notice is that the confident calculators around me seem to have made a decision not to look past the first ripple, and I'd rather have a method that admits where it stops.

  So this is what I'm asking for: not the answer to where I should give, but a procedure I can actually run once a year in one sitting, with a notepad, no research beyond what I already know, that ends in a choice. Concretely, I want an ordered list of questions to ask myself, what counts as a sufficient answer to each, and — this is the part I most need — explicit stopping points: places where the procedure says the foreseeable effects don't distinguish the options, and hands the decision over to something else, whether that's my settled values, a prior commitment, or literally a coin, and it should tell me which of those is appropriate when. It has to cope with three situations I keep landing in. First, one option does a bit more visible good, but the other has far-reaching effects I can't rule out in either direction. Second, both options ripple so far that every difference I can identify seems like it will be swamped by differences I can't — I want to know whether to treat that as a tie and what to do about it, not to be told to estimate harder. Third, the nagging thought that any action has some tiny chance of triggering something enormous, good or bad, and that whatever I choose, an adversary of the method could spin a story making it look catastrophic; I want the procedure to have a defensible response to that instead of either ignoring it or letting it dominate everything.

  Then run the procedure on three choices I actually face or could face, walking through each question as you go: giving to a large, well-audited international health charity versus a local food bank I can visit; giving now versus investing the money and giving a much larger sum in thirty years, assuming I'd actually do it; and giving to a modest lobbying effort whose near-term effects are easy to predict but whose success would change law for decades in ways nobody can specify. At least one of the three should come out in a way I won't like, if that's where the procedure honestly leads. Say plainly what the procedure cannot do — the kinds of questions it was never going to answer and shouldn't pretend to. Finally, since I'm trusting this with real money: tell me which step of your reasoning is most likely to be wrong, and what would have to be true, or what argument would have to work, for you to give materially different advice. I'd rather know where the method is thin before I lean on it.
reasoning: |-
  We are designing a decision procedure that acknowledges the limits of our foresight and the problem of "cluelessness" about long-term effects. The procedure must:
  1. Be runnable in one sitting with a notepad, using only existing knowledge.
  2. End with a concrete choice of where to donate.
  3. Include explicit stopping points where the foreseeable effects don't distinguish the options, and then hand off to a different method (values, prior commitment, or a coin flip).
  4. Handle three key situations: 
     a. One option has a bit more visible good but the other has far-reaching uncertain effects.
     b. Both options ripple so far that the differences are swamped by the unknown.
     c. The tiny chance of triggering enormous good or bad (and the adversarial storytelling).

  We'll design a step-by-step procedure with questions and stopping rules.

  **The Procedure: Acknowledging Limits in Donation (ALID) Procedure**

  **Step 0: Preparation**
     - List the donation options you are considering (e.g., Charity A, Charity B, etc.).
     - For each option, note the primary intended direct effect (e.g., "provide 100 meals", "save one life", "change a law") and the scale (e.g., per $1000).

  **Step 1: Direct Effects**
     *Question 1: For each option, what is the primary direct effect per dollar, and how confident are you in that estimate?*
     - Consider only the most immediate, intended outcome. Use your existing knowledge to estimate (e.g., "Charity A: $5000 saves one life", "Charity B: $5 provides one meal").
     - If you cannot estimate even the direct effect for an option, remove it from consideration (unless there's a compelling reason to keep it, but then note the uncertainty).
     - *Stopping rule 1*: If one option has a direct effect that is at least 10 times better than the others (per dollar) and you are at least 90% confident in that estimate, then choose that option and stop. Otherwise, proceed.

  **Step 2: Known Indirect Effects (First Ripple)**
     *Question 2: For each option, what are the most significant indirect effects that are well-documented and predictable within the next 5-10 years?*
     - Examples: 
       - For a health charity: preventing a disease might lead to a child being able to go to school and then get a job.
       - For a food bank: providing meals might help a family avoid eviction and keep a job.
     - *Stopping rule 2*: If, after considering these indirect effects, one option is clearly better (at least 5 times the total impact per dollar) and you are at least 80% confident, then choose it and stop. Otherwise, proceed.

  **Step 3: Uncertain Long-Term Effects (Cluelessness)**
     *Question 3: For each option, consider the potential long-term effects (beyond 10 years) that are highly uncertain and could be either positive or negative. How large and how uncertain are they?*
     - Acknowledge that you cannot assign probabilities meaningfully. Instead, note the direction of uncertainty: 
       - Option A: Might lead to very good outcomes (e.g., a healthier population leads to innovation) or very bad (e.g., overpopulation strains resources). 
       - Option B: Similarly, might have good or bad long-term effects.
     - *Stopping rule 3*: 
       - If one option has a pattern of long-term effects that you judge to be overwhelmingly positive and the other negative (and you are at least 70% confident in this pattern), then choose accordingly.
       - Otherwise, if the long-term effects for all options are too uncertain to call (i.e., the sign and magnitude are unknown and could easily swamp the direct effects), then mark the decision as being in a state of "cluelessness" and proceed to Step 4.

  **Step 4: Handling Cluelessness and Tiebreakers**
     - *Question 4: Are the options tied on the basis of foreseeable effects (Steps 1-3)?*
       - If yes, then we must break the tie by something other than consequences.
     - *Tiebreakers*:
       a. **Settled Values**: If you have a prior commitment or a deeply held value that clearly applies (e.g., "I always prioritize helping the very poorest", or "I have promised to support local causes"), then use that to choose.
       b. **Diversification**: If you have given to one option in the past and not the other, consider diversifying (this year choose the other) to spread risk.
       c. **Coin Flip**: If neither a nor b applies, flip a coin.

  **Step 5: Handling the Tiny Chance of Enormous Impacts**
     - *Question 5: For each option, is there a non-negligible chance (say, above 0.1%) of triggering an enormous positive or negative impact?*
       - Note: Enormous impact means something that would dwarf the direct effects by at least 1000 times (e.g., preventing a pandemic that would kill millions, or accidentally causing one).
     - *Stopping rule 5*: 
       - If one option has a clear and credible path to an enormous positive impact (e.g., funding research that might cure a major disease) and the others don't, and you estimate the expected value (even roughly) to be positive and large, then choose that option.
       - If one option has a credible path to an enormous negative impact (e.g., funding an intervention that might destabilize a region) and the others don't, and you estimate the expected value to be negative and large, then avoid that option.
       - Otherwise, proceed. (Note: We do not let speculative stories dominate unless they are credible and non-negligible in probability. The adversary's story must be at least somewhat plausible to count.)

     - However, if the enormous impacts are symmetric (both good and bad are possible and equally speculative) then they cancel out and we ignore them.

  **Step 6: Final Decision**
     - If you have not stopped at an earlier step, then use the tiebreakers in Step 4 to make the choice.

  **Now, we run the procedure on the three scenarios:**

  **Scenario 1: Large international health charity vs. local food bank**

  - Step 1: Direct Effects
    - Health charity: Saves a life per ~$5000 (based on GiveWell estimates for top charities). Confidence: high (well-audited).
    - Food bank: Provides ~10 meals per $10 (so $1 per meal). Confidence: high (I can visit and see).
    - Comparison: Saving a life is worth many meals? But we don't have a direct conversion. However, the health charity is often considered more cost-effective. But the ratio isn't 10:1? Let's see: 
      - The cost to save a life is $5000. The cost to provide a meal is $1. But one life saved is not equivalent to 5000 meals? We need a common metric. However, the health charity's direct effect is saving a life, which is a massive outcome. The food bank provides meals which are important but less life-changing per meal. 
      - We might use a common metric like DALYs (disability-adjusted life years). But the procedure doesn't require research. So we rely on our existing knowledge: we know that the health charity is often ranked as extremely cost-effective. 
    - However, the ratio per dollar for health charity: 1 life / $5000 = 0.0002 lives per dollar. For food bank: 1 meal per dollar. We cannot compare without converting meals to lives. 
    - Therefore, we don't have a 10:1 ratio in the same units. So we proceed.

  - Step 2: Known Indirect Effects
    - Health charity: A child saved from disease might grow up to be productive, have children, etc. But we don't have specific numbers. 
    - Food bank: A family that gets food might avoid health issues, maintain employment, children do better in school. 
    - We don't have a clear 5:1 advantage. Proceed.

  - Step 3: Long-Term Effects (Cluelessness)
    - Health charity: Long-term effects are huge and uncertain. The child saved might invent something great, or might have many children who contribute to overpopulation. 
    - Food bank: The local effects might ripple to the community, but on a smaller scale. However, it might also create dependency? Or strengthen community bonds? 
    - We are clueless about the long-term for both. So we mark this as a tie and proceed to Step 4.

  - Step 4: Tiebreakers
    - We have no prior commitment that clearly applies? 
    - Diversification: If in the past I've given mostly to international, then this year I might choose local (or vice versa). 
    - Or use settled values: Do I value helping the very poorest (often in developing countries) more, or building local community? 
    - Let's say my settled value is to help the most needy. International health charity targets the most needy (very poor in developing countries). So I choose the health charity.

  - Step 5: Enormous Impacts
    - Health charity: Might prevent a pandemic? Unlikely from a deworming charity? Not really. But if it's a malaria charity, it might contribute to a healthier society that avoids collapse? Speculative. 
    - Food bank: Might help stabilize a community and prevent a local crisis? Also speculative. 
    - No clear enormous impact that we can credit. So we stick with Step 4.

  - **Decision**: International health charity (based on settled value in Step 4).

  **Scenario 2: Giving now vs. investing and giving later**

  - Step 1: Direct Effects
    - Give now: $1000 to a charity today. For a top charity, that might save 0.2 lives (if $5000 saves one life).
    - Invest and give later: $1000 invested for 30 years at 5% real return becomes about $4320. Then that saves 4320/5000 = 0.864 lives. 
    - So the direct effect of giving later is about 4.32 times the effect of giving now (0.864 vs 0.2). But note: we are comparing the same amount of money now vs later. However, the charity can use the money now to save lives that would be lost in the interim? We must account for that.
    - Actually, the direct effect of giving now is 0.2 lives saved immediately. Giving later saves 0.864 lives in 30 years. But the lives saved now are 30 years of life gained earlier. We need to compare the value of a life saved now vs in 30 years? 
      - If we discount future lives at a rate (say, 3% per year), then one life saved now is worth more than one saved in 30 years. But how much more? 
