    - This is complex. We might rely on existing knowledge: the effective altruism community often uses a discount rate of 0-3% for future lives. Without research, we might assume a 3% discount rate. Then the present value of saving 0.864 lives in 30 years is 0.864 * (1/1.03^30) ≈ 0.864 * (1/2.427) ≈ 0.356 lives. 
    - So giving now: 0.2 lives (present value). Giving later: 0.356 lives (present value). Then giving later is 0.356/0.2 = 1.78 times better. But note: this is less than 10:1? And we are not 90% confident? Because discounting is controversial. 
    - We do not have 10:1, so we proceed.

  - Step 2: Known Indirect Effects
    - Giving now: The lives saved now might lead to positive ripple effects in the community (e.g., the saved children grow up and contribute to economic growth) over the next 30 years.
    - Giving later: The money is invested and then donated, but we lose the ripple effects of saving lives now. 
    - We don't have a clear 5:1 advantage. Proceed.

  - Step 3: Long-Term Effects
    - Both options have huge long-term effects. Giving now might change the trajectory of a community for centuries. Giving later might result in a much larger donation that changes the future even more. We are clueless about which is better. So tie and proceed to Step 4.

  - Step 4: Tiebreakers
    - Settled values: Do I have a prior commitment? Maybe to do the most good? Then the arithmetic (Step 1) suggests giving later is better (1.78 times). But that's not overwhelming. 
    - Diversification? Not really. 
    - We might use a coin? But let's see Step 5.

  - Step 5: Enormous Impacts
    - Giving now: Might prevent a catastrophe that would happen in the next 30 years? If the world ends in 30 years, then giving later is worthless. But that's speculative.
    - Giving later: Might be used to address a future existential risk? 
    - We cannot assign probabilities. So we ignore.

  - Step 6: Since Step 1 gave a modest advantage to giving later (1.78 times) and we are in a tie otherwise, we might break the tie by the Step 1 result? But our procedure says to break by settled values in Step 4. 

    - Alternatively, we can note that in Step 1 we had a difference (1.78) that was not enough to stop but is still a factor. We might then use that as a tiebreaker. However, the procedure doesn't specify that. 

    - Let's adjust the procedure: In Step 4, if the options are tied but one has a slight edge in the direct effects (but not enough to stop at Step 1 or 2), then we can use that edge as a tiebreaker. 

    - Therefore, we choose to give later.

  - **Decision**: Invest and give later.

  **Scenario 3: Modest lobbying effort (with predictable near-term effects but uncertain long-term law changes)**

  - Step 1: Direct Effects
    - Lobbying effort: The near-term effect is, say, a 30% chance of changing a law that would directly affect 10,000 people (e.g., by improving their working conditions). But we don't have a per-dollar estimate? 
    - Compare with an alternative? But the scenario doesn't specify. Let's assume we are comparing with a direct charity (like the health charity). We'll run for the lobbying effort alone? Or we might compare with a direct charity? The problem says "a modest lobbying effort", so we might have two options: the lobbying effort vs. a direct charity.

    - For the lobbying effort: We need to estimate the direct effect per dollar. Suppose the lobbying effort requires $100,000 and has a 30% chance of passing a law that would improve the lives of 10,000 people by the equivalent of $1000 per person per year (for 10 years). Then the expected impact is 0.3 * 10,000 * 1000 * 10 = $30,000,000 in equivalent value. Per dollar: $300 per dollar? That seems too high. Wait, that would be 300 times the money? That can't be right. 

    - Actually, we are comparing the cost to the benefit. The benefit is $30,000,000 and the cost is $100,000, so the cost-effectiveness is 300:1. But we must be cautious: this is a rough estimate. 

    - However, the direct effect of a top health charity is about 1 life per $5000. If we value a life at, say, $50,000 (which is very low) or $10,000,000 (which is common in some settings), then the health charity might be $10,000,000 / $5000 = 2000:1. 

    - Without research, we might not be able to do this. So we note that the lobbying effort might be very cost-effective in the near-term. But we are not 90% confident? Because the 30% chance is an estimate and the $1000 improvement per person is an estimate. So we proceed.

  - Step 2: Known Indirect Effects
    - Lobbying: If the law passes, it might lead to other positive changes (e.g., inspiration for other laws) in the near term? Or negative (e.g., backlash). 
    - We don't have a clear 5:1 advantage. Proceed.

  - Step 3: Long-Term Effects
    - Lobbying: The law might have long-term effects that are huge and uncertain. It might set a precedent that leads to major reforms, or it might cause a political shift that leads to bad policies. We are clueless. 
