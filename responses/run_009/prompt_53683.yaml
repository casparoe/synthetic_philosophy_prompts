  **What the Procedure Cannot Do**
  - It cannot precisely compare effects that are in different units (e.g., meals vs. lives) without a common metric. It relies on rough estimates and then tiebreakers.
  - It cannot resolve deep uncertainty about the long-term. It explicitly hands off to other methods (values, coin flip) in that case.
  - It cannot incorporate new research during the procedure (since it uses only existing knowledge).

  **Weakest Step in the Reasoning**
  The weakest step is Step 5 (Enormous Impacts). The challenge is that we are trying to assign importance to events that are both highly speculative and potentially huge. We set a threshold of 0.1% chance and 1000x impact, but how do we estimate the chance? We might be overconfident in our ability to judge what is "non-negligible" and "credible". 

  An argument that might change the advice: If we adopt a view that we should maximize expected value no matter how small the probability (like the Pascal's Mugging problem), then Step 5 might dominate. For example, if there is a 0.0001% chance that a lobbying effort leads to world peace, then that might have an expected value that swamps everything. But our procedure sets a threshold to avoid being dominated by such stories. However, if we drop the threshold, then we might end up always choosing the option with the most grandiose positive story. 

