prompt: |-
  I'm a Bayesian statistician by training and now I do probabilistic modeling for a living -- priors, likelihoods, posteriors, credible intervals, calibration, model checking, the whole toolkit. Fluent to the point of thinking in it. I never actually read Keynes's Treatise of Probability, but I keep running into claims that his view of probability was very different from what I do, and at a seminar recently someone told me the interesting part is a thing he called the "weight" of an argument, which is supposedly neither the probability itself nor the amount of data in any ordinary sense. Thats the bit I can't get a grip on.

  So: restate Keynes's position on probability and uncertainty in my vocabulary, as faithfully as you can. His logical interpretation, where probabilities are objective relations between propositions -- where does that sit relative to subjective Bayesian priors? Is it close to objective Bayes with reference priors, or is there no counterpart in what I do at all? His claim that many probabilities are non-numerical and some aren't even comparable to each other -- I'm used to "every prior is a distribution," so what does that become for me? Partial orderings of priors, maybe? And then the weight of an argument: the obvious move is to say it's just sample size, or the concentration of the posterior, but I've been told that's exactly the reading Keynes resisted, and that his point survives into the later economics, where the idea is roughly: about the really long run it's not that we have a sensible prior and too little data, it's that there's no probability distribution there to update in the first place. Translate that too if you can. The nearest things I can think of in my world are model misspecification and the unquantifiable uncertainty over which model class you're even in, but I'm not sure that's faithful rather than convenient.

  Then give me the residue report, which is what I actually care about. Which of Keynes's claims translate cleanly, which only with distortion, and which can't be expressed in my vocabulary at all. And for the untranslatable part, tell me whether my toolkit is missing something or whether Keynes was less clear than his fans think -- e.g. is "some probabilities aren't comparable" a substantive claim my representation can't express, or just an admission that he never committed to a representation in the first place? Please be honest about where the translation smuggles in Bayesian assumptions and passes them off as Keynes.
