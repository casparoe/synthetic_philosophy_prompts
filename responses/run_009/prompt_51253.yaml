answer: |-
  Below is a practical, paper-based decision procedure grounded in decision theory's distinction between **risk** (known probabilities) and **ambiguity** (unknown/imprecise probabilities). It prioritizes usability, flags biases, and includes clear stopping points. The goal is to enforce rational caution without institutionalizing bias against "made-up" numbers.

  ---

  ### **Decision Procedure: Risk vs. Ambiguity Budget Allocation**
  **Who:** Public health committee (no theory background needed).  
  **Time:** 2–3 hours, paper-only.  
  **Output:** A recommendation (A/B), or a "values call" for the committee.  
  **Core Principle:** Treat ambiguous probabilities as a *range*, not a point. Never trust "precise" numbers without evidence.

  ---

  #### **Step 1: Fix the Budget Shift**  
  *Ask:* "What specific $ amount are we moving, and from which intervention (A) to which (B)?"  
  *Good enough:* A dollar figure and two clear options (e.g., "$500K from flu vaccines to zoonosis surveillance").  
  *Stop if:* Options are not mutually exclusive. Restart with clearer choices.

  #### **Step 2: Quantify the "Risk" Option (A)**  
  *Ask:* "For the well-studied intervention (e.g., flu vaccines), what is the **expected lives saved** with this budget shift?"  
  *Method:* Use historical data. Calculate:  
  > *Expected Lives Saved (A) = Past lives saved per dollar × Shifted dollars*  
  *Good enough:* A single number (e.g., "Shifting $500K saves 100 fewer flu-vaccine lives").  
  *Stop if:* Data is >5 years old or from inconsistent sources. Flag as "degraded risk" and use a 20% uncertainty margin.

  #### **Step 3: Describe the "Ambiguity" Option (B)**  
  *Ask:* 
  1. "What is the **best-case impact** if B works?" (e.g., "Surveillance prevents 10,000 deaths in a spillover").  
  2. "What is the **worst-case impact** if B fails?" (e.g., "0 lives saved, plus wasted dollars").  
  3. "Is there *any* objective basis for the probability of B’s success? (e.g., data, peer-reviewed models)"  
  *Good enough:* Impact estimates (best/worst-case) and a yes/no on probability basis.  
  *Stop if:* Impacts are unquantifiable (e.g., "prepares the system"). Hand to committee immediately.

  #### **Step 4: Elicit a Probability *Range* for B**  
  *Ask:* "Given no reliable data, what is the **plausible range** for the probability of B’s success? Give a low and high guess."  
  *Method:*  
  - If probabilities are "made up" (no basis from Step 3), demand a range. Example: "Between 0.1% and 5%".  
  - If a vendor/model provides a "precise" number (e.g., "1.7%"), still demand a range around it (e.g., "Could it be 0.5%? 3%?").  
  *Good enough:* Two numbers (low/high). Reject single-point probabilities.  
  *Stop if:* Experts refuse to give a range. B is too ambiguous—hand to committee.

  #### **Step 5: Calculate Expected Value (EV) for B**  
  *Method:* Compute EVs for B’s **best-case**, **worst-case**, and **plausible range**:  
  > - *EV_Best = Best-case impact × High probability*  
  > - *EV_Worst = Worst-case impact × Low probability*  
  > - *EV_Range = [Impact × Low prob, Impact × High prob]*  
  *Example:*  
  - Best-case impact = 10,000 lives saved  
  - Probability range = 0.1% to 5%  
  - EV_Best = 10,000 × 5% = 500 lives  
  - EV_Worst = 10,000 × 0.1% = 10 lives  
  - EV_Range = [10, 500] lives  

  #### **Step 6: Compare A vs. B**  
  *Method:* Use a decision grid:  

  | Condition | Recommendation | Rationale |
  |----------|----------------|----------|
  | **EV_Worst (B) > EV (A)** | Choose B | Even B’s worst outcome beats A. |
  | **EV_Best (B) < EV (A)** | Choose A | Even B’s best outcome loses to A. |
  | **EV (A) falls inside EV_Range (B)** | **Hand to committee** (Values call) | B could be better or worse. |
  | **Probability range spans orders of magnitude** (e.g., 0.001% to 10%) | **Hand to committee** | Ambiguity too extreme to compute. |

  #### **Step 7: Flag Biases Explicitly**  
  *During handoff to committee, document:*  
  > - **Rational caution:** "We can’t trust B’s probability range because it lacks data. This is a valid reason to be wary."  
  > - **Bias check:** "Are we rejecting B *only* because its numbers ‘look made-up’? If yes, revisit Step 4. If not, caution is justified."  

  ---

  ### **Case Applications**
  #### **Case 1: Shift from Flu (A) to Spillover Surveillance (B)**  
  - **A (Flu):** Well-quantified. $500K shift = 100 fewer lives saved.  
  - **B (Spillover):**  
    - Best-case impact: Prevents 10,000 deaths.  
    - Worst-case impact: 0 lives saved.  
    - Probability basis: None (true ambiguity).  
    - Elicited range: 0.1% to 5% (conservative to optimistic).  
  - **EV Calculations:**  
    - EV (A) = -100 lives  
    - EV_Best (B) = 10,000 × 5% = 500 lives  
    - EV_Worst (B) = 10,000 × 0.1% = 10 lives  
    - EV_Range (B) = [10, 500]  
  - **Comparison:** EV (A) = -100 is **below EV_Range (B) [10, 500]**.  
    - *Recommendation:* **Choose B** (spillover surveillance).  
    - *Why:* Even B’s *worst-case* (10 lives saved) beats A’s outcome (-100 lives).  
  - **Office won’t want to hear:** "Defund flu vaccines despite predictable lives lost. But the math is clear: B’s worst case is better than A’s guaranteed loss."

  #### **Case 2: Shift to Vendor-Modeled Spillover (B) from Flu (A)**  
  - **A (Flu):** Same as Case 1. EV (A) = -100 lives.  
  - **B (Spillover):** Vendor claims "precise" 1.7% probability.  
    - Probability basis: Vendor model (no empirical data).  
    - **Elicited range:** Force a range (e.g., "Could be 0.5% to 3%?").  
  - **EV Calculations:**  
    - EV (A) = -100 lives  
    - EV_Range (B) = [10,000 × 0.5% = 50, 10,000 × 3% = 300] = [50, 300]  
  - **Comparison:** EV (A) = -100 is **below EV_Range (B) [50, 300]**.  
    - *Recommendation:* **Choose B** (same as Case 1).  
  - **Bias check:** "The vendor’s ‘1.7%’ looked scientific but was arbitrary. We avoided bias by demanding a range. Result matches Case 1—no decimal-point bias."

  #### **Case 3: Refuse to Rank (True Ambiguity)**  
  - **Scenario:** Bioterror preparedness (B) vs. flu vaccines (A).  
  - **A (Flu):** $1M shift = 200 fewer lives saved.  
  - **B (Bioterror):**  
    - Best-case impact: Prevents 1,000,000 deaths.  
    - Probability basis: None. Elicited range: 0.0001% to 0.1% (wild guess).  
  - **EV Calculations:**  
    - EV (A) = -200 lives  
    - EV_Range (B) = [1,000,000 × 0.0001% = 1, 1,000,000 × 0.1% = 1,000] = [1, 1,000]  
  - **Comparison:** EV (A) = -200 falls **inside EV_Range (B) [1, 1,000]**.  
    - *Recommendation:* **Hand to committee** (Values call).  
  - **Why stop?** EV (A) is within B’s range. B *could* save 1 life (worse than A) or 1,000 (better), but the range spans three orders of magnitude. No rational way to compare.  
  - **Bias check:** "Rejecting B isn’t bias—it’s rational extreme ambiguity. Committee must decide: Is a 1-in-10,000 chance of saving 1M lives worth 200 flu deaths?"

  ---

  ### **Key Features**
  - **Dropped from Theory:**  
    - No subjective utilities (all lives are equal).  
    No complex ambiguity premiums (replaced by range comparisons).  
    No regret minimization (too abstract for paper).  
  - **Judgment Calls Marked:**  
    - Step 4 (eliciting probability ranges) and Step 7 (bias check) require expert judgment.  
  - **Stops Bias:**  
    - Forces ranges for ambiguous probabilities, exposing "precise" numbers as arbitrary.  
    - Explicitly names "decimal-point bias" in Step 7.  
  - **Usability:**  
    - No software. All math is arithmetic (multiplication/comparison).  
    - Uses plain language (no "utils," "priors," or "Ellsberg").  

  This procedure ensures ambiguity is handled as a *structural uncertainty* (rational) rather than an *aesthetic dislike* (bias). It won’t eliminate tough calls—but it will make them honest.
