prompt: |-
  I'm in a seminar this semester on Nietzsche's Genealogy of Morals and we just hit the Second Essay, and there's a passage from section 2 that I keep rereading without it getting any clearer. We're using the old Horace B. Samuel translation btw, which makes everything sound extra stiff. Anyway here's the bit (skipping a sentence or two in the middle where he repeats himself):

  "If, however, we place ourselves at the end of this colossal process, at the point where the tree finally matures its fruits, when society and its morality of custom finally bring to light that to which it was only the means, then do we find as the ripest fruit on its tree the sovereign individual, that resembles only himself, that has got loose from the morality of custom, the autonomous 'super-moral' individual (for 'autonomous' and 'moral' are mutually-exclusive terms)—in short, the man of the personal, long, and independent will, competent to promise, and we find in him a proud consciousness (vibrating in every fibre), of what has been at last achieved and become vivified in him, a genuine consciousness of power and freedom, a feeling of human perfection in general. And this man who has grown to freedom, who is really competent to promise, this lord of the free will, this sovereign—how is it possible for him not to know how great is his superiority over everything incapable of binding itself by promises, or of being its own security, how great is the trust, the awe, the reverence that he awakes—he 'deserves' all three—not to know that with this mastery over himself he is necessarily also given the mastery over circumstances, over nature, over all creatures with shorter wills, less reliable characters?"

  So some context for where I'm at: I get that just before this he says the whole long prehistoric "morality of custom" worked on man to make him calculable, regular, uniform, etc., and that this promise-making animal is his starting point for guilt and bad conscience. What I don't get is basically everything about this sovereign individual guy. Like, how is the RIPEST FRUIT of all that moral breeding somehow someone who has gotten LOOSE from the morality of custom? If the process is the point, how does the endpoint escape the process? And why on earth does he put "autonomous" and "moral" as mutually exclusive terms in parentheses like it's obvious -- what does he mean by autonomous there? Also the logic of the promise stuff: why does being able to make promises translate into "mastery over nature" and over "creatures with shorter wills"? Is promising supposed to be like a proof of a strong memory + self-control that then just is power over others?

  One more thing, and this is what actually came up in seminar and has been bugging me since: someone claimed this passage might not be sincere at all, that the tone is doing something weird and we shouldn't just take the sovereign individual at face value as Nietzsche's ideal, because the whole essay is supposedly about how these proud self-descriptions get manufactured. Our TA sort of smiled and said hold that thought. Can you help me (a) untangle the argument of the passage itself, and (b) say what you make of the sincerity question -- like, what in the text itself (this passage or the surrounding essay) would support or undercut the ironic reading? I'd rather hear how the two readings would each handle the details than just a verdict.
