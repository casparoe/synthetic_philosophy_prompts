prompt: |-
  My philosophy of science seminar has reached evolutionary biology, and the professor keeps ending class by intoning 'survival of the fittest' and shrugging: on his telling, Popper's old worry was that the slogan, taken as the content of Darwinism, is close to a tautology — since the fittest are simply whatever happens to survive and reproduce — and a tautology is unfalsifiable, so it cannot be Popperian science; he also concedes, when pressed, that Popper later softened the charge. I want to push back but can't get past the slogan itself, and I suspect the professor is sliding between readings of it. Please lay out the distinct precise claims 'survival of the fittest' could be expressing: the definitional reading on which fitness is fixed by actual survival and reproductive success, the propensity reading on which fitness is a disposition whose link to survival is contingent and could fail to manifest, the adaptationist reading on which selection reliably produces well-designed traits, and any others you think deserve separate entries. For each, say whether it is a triviality, an empirically risky claim that could in principle come out false, or something in between, and, crucially, whether it would support the professor's use of it — namely, concluding that natural selection, so stated, is untestable. Then say which reading you think Popper actually had in mind, and whether his later partial retraction is best understood as switching readings or as conceding something on the same one. Please write in continuous prose, with no headings, bullet points, bold text, or tables, and close by saying where your reasoning is most likely to go wrong and what argument or consideration would change your verdict on whether the professor's inference is any good.
