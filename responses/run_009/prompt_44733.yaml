  We are an epistemic contextualist and a pragmatic encroacher who have engaged in adversarial collaboration. Below is our joint statement.

  ## 1. Agreed Claims

  We, the undersigned, agree on the following:

  1.1 **Ordinary Language Data**: There are patterns in how people use and evaluate knowledge ascriptions. These include:
     - **Bank Cases (DeRose 1992)**: In low-stakes situations, speakers are inclined to say that a subject knows (e.g., that the bank is open on Saturday), but in high-stakes situations, speakers are reluctant to say the same subject knows the same proposition based on the same evidence.
     - **Airport Cases (Cohen 1999)**: Similar to bank cases, but with variations (e.g., two subjects with the same evidence but different stakes: one in a low-stakes context is said to know, the other in a high-stakes context is said not to know).
     - **Lottery Propositions**: Speakers typically deny that one knows a lottery proposition (e.g., "I know my ticket is a loser") even when the probability of being wrong is extremely low, but they often affirm knowledge in other cases with similar or lower probabilities (e.g., "I know my car is parked in the lot").
     - **Embedded Reports**: Knowledge ascriptions can be embedded in various linguistic constructions (e.g., conditionals, attitude reports) and their behavior in such embeddings must be accounted for.
     - **Under Challenge**: When a knowledge ascription is challenged, speakers often retract or modify their claims in response to raised stakes or counterpossibilities.

  1.2 **What a Theory of Knowledge Ascriptions Owes Us**: A theory of knowledge ascriptions should:
     - Explain the observed patterns of ordinary usage (as in 1.1).
     - Be compatible with the fact that knowledge ascriptions are action-guiding and play a role in practical reasoning.
     - Account for the intuitive connections between knowledge, belief, truth, justification, and evidence.
     - Respect the fact that knowledge ascriptions are typically factive (if S knows p, then p is true).
     - Be consistent with the ways in which knowledge ascriptions are used in contexts of disagreement, retraction, and embedded in complex sentences.

  1.3 **What Neither Side is Claiming**:
     - Neither contextualism nor pragmatic encroachment denies that there is a core epistemic relation between a subject and a proposition that involves truth, belief, and some form of justification or reliability.
     - Neither side claims that the practical stakes directly affect the truth of the proposition itself or the evidence available to the subject.
     - Neither side denies that there are invariant elements in the concept of knowledge (e.g., factivity).
     - Neither side claims that the word "knows" is ambiguous in the way that, say, "bank" is ambiguous (between a financial institution and a river edge).

  ## 2. Disagreements Table

  In this table, each disagreement is stated twice: once in wording acceptable to the contextualist (C), and once in wording acceptable to the pragmatic encroacher (PE). Corrections to misdescribed positions are included and are phrased so that the corrected party accepts them.

  | Contextualist's Statement of Disagreement | Pragmatic Encroacher's Statement of Disagreement |
  |-------------------------------------------|--------------------------------------------------|
  | **Disagreement 1: The Nature of the Shift** <br> C: The truth-conditions of knowledge ascriptions shift with the context of the ascriber, specifically with the conversational standards (e.g., what possibilities are relevant). | PE: The truth-conditions of knowledge ascriptions are invariant, but the subject's practical situation (the stakes for the subject) affects how much evidence is required for the subject to know. |
  | **Disagreement 2: What is Affected** <br> C: The word "knows" expresses different relations in different contexts, so that the same ascription can be true in one context and false in another. | PE: The word "knows" expresses the same relation in all contexts, but whether that relation holds depends partly on the subject's practical situation. |
  | **Correction from PE**: <br> The contextualist misdescribes the pragmatic encroacher as holding that the subject's practical situation affects the evidence required. The pragmatic encroacher clarifies: the practical situation affects the threshold of justification or the strength of evidence required for knowledge, but not by changing the meaning of "knows". | **Correction from C**: <br> The pragmatic encroacher misdescribes the contextualist as holding that the shift is solely due to the ascriber's conversational standards. The contextualist clarifies: the shift is due to the context of the ascriber, which includes the ascriber's conversational purposes and the standards in play in that conversation, not necessarily the subject's context. |
  | **Disagreement 3: The Object of Theory** <br> C: Our theory is about the semantics of "knows": it is a context-sensitive term. | PE: Our theory is about the nature of knowledge: it is a relation that is sensitive to practical factors. |
  | **Suspicion Stated as Disagreement** <br> C: The pragmatic encroacher is offering a theory of rational action or assertion, not of knowledge. <br> PE's Reply: We are offering a theory of knowledge: knowledge is the norm of practical reasoning and assertion, so it must be sensitive to practical factors. | PE: The contextualist is offering a theory about how we talk about knowledge, not about knowledge itself. <br> C's Reply: We are offering a semantic theory about knowledge ascriptions, which is a theory about the property ascribed because the property is contextually determined. |

  ## 3. Cruxes

  We agree that the following issues are crucial for distinguishing our views. For each, we provide a case or argument both accept as bearing on the issue, and we state our predictions.

  ### Crux (a): The Divergent Case (Water Lab Scenario)

  **Scenario**: A municipal water lab technician measures a contaminant in a well and finds it just under the regulatory limit. The evidence is strong but not absolutely conclusive (e.g., the test has a small error rate). 
  - In the afternoon, the supervisor, in a routine low-stakes context (filing a report), says: "The lab knows the well water meets the standard."
  - That evening, the mayor, in a high-stakes context (deciding whether to truck in bottled water for the town), says: "No, the lab doesn't know that — not for this decision."

  **Question**: Was the supervisor's afternoon ascription ("The lab knows") true?

  - **Contextualist Prediction**: The supervisor's ascription was true. The context of ascription (the supervisor's low-stakes context) sets a standard that the lab meets. The mayor's denial is also true because the mayor's context sets a higher standard. The two ascriptions do not contradict each other because they are made in different contexts with different standards.
  - **Pragmatic Encroacher Prediction**: The supervisor's ascription was false. The lab does not know because, given the high stakes for the lab (if they are wrong, the town could be harmed), they do not have sufficient evidence. The supervisor's low-stakes context does not affect the truth of the ascription; only the subject's (the lab's) stakes matter. The mayor's denial is true because the lab's stakes are high (even if the lab is unaware of the mayor's decision, the lab's role makes their stakes high).

  **What would count against each theory**:
  - Against Contextualism: If competent speakers judge that the supervisor's ascription is false (in the afternoon) because of the mayor's high-stakes decision (even though the supervisor is unaware of it), that would challenge contextualism because the ascriber's context (supervisor) should control.
  - Against Pragmatic Encroachment: If competent speakers judge that the supervisor's ascription is true and the mayor's denial is about a different question (e.g., about whether the lab knows for the mayor's purpose), that would challenge pragmatic encroachment because it suggests that the subject's (lab's) stakes do not determine the truth of the ascription.

  ### Crux (b): Disagreement and Retraction Data

  **Case**: Suppose a subject, Alice, in a low-stakes context, says "I know the bank is open on Saturday." Later, when the stakes rise (e.g., she has an important check to deposit), she is asked: "Did you know yesterday that the bank would be open today?" and she retracts: "No, I didn't know then."

  **Question**: What explains the retraction?

  - **Contextualist Prediction**: Alice retracts because in her current high-stakes context, the word "know" requires meeting a higher standard, which her past self did not meet. The past ascription was true in the past context but false in the current context. Retraction is appropriate because the current context's standards apply when evaluating the past ascription.
  - **Pragmatic Encroacher Prediction**: Alice retracts because she now realizes that even in the past, she did not know. The stakes were already high for her (though she was unaware) because of the potential future importance, or because knowledge requires meeting a standard that accounts for the actual stakes (which may be revealed later). The past ascription was false all along.

  **What would count against each theory**:
  - Against Contextualism: If competent speakers do not retract their past knowledge ascriptions when stakes rise (e.g., they say "I knew then, but I wouldn't say that now because it's too risky"), that would challenge contextualism because it predicts retraction when the context changes.
  - Against Pragmatic Encroachment: If competent speakers retract but explain it by saying "I was wrong to say I knew then" (admitting the past ascription was false), that supports PE. But if they say "I was right then but now I need more evidence", that challenges PE because it suggests the truth didn't change.

  ### Crux (c): Ideal-Language Question

  **Question**: If we restate every claim without the word "knows", does the disagreement between contextualism and pragmatic encroachment disappear?

  - **Contextualist View**: The disagreement is fundamentally semantic. Without "knows", we can still express the same underlying epistemic relations (e.g., "has evidence sufficient for context C"), and the disagreement would shift to which context is relevant. But in the ideal language, we might have different terms for different relations, and the residual issue would be about which of these relations is appropriately called "knowledge" in ordinary language.
  - **Pragmatic Encroacher View**: The disagreement is about the nature of the epistemic relation itself. Without "knows", we would still disagree about whether practical factors affect the strength of evidence required for a belief to be justified enough to act on. The residual issue is epistemological: whether practical factors are part of the conditions for justification or knowledge.

  **Agreed Test**: If we replace "S knows p" with a more precise invariant expression (e.g., "S has evidence E for p"), we can still ask: does the subject's practical situation affect whether E is sufficient? The pragmatic encroacher says yes; the contextualist says no (the context of assessment affects whether we call it knowledge, but the subject's practical situation does not affect the invariant epistemic state).

  ### Additional Crux (d): Embedded Reports

  **Case**: Consider a sentence embedding a knowledge ascription, e.g., "If the lab knows the water is safe, then we can proceed." How does this behave when uttered in different contexts?

  - **Contextualist Prediction**: The truth-value of the embedded clause ("the lab knows the water is safe") is determined by the context of the main utterance. So if the speaker is in a low-stakes context, the embedded knowledge ascription is evaluated by low standards, and the conditional may be true. If the speaker is in a high-stakes context, the embedded knowledge ascription is evaluated by high standards, and the conditional may be false.
  - **Pragmatic Encroacher Prediction**: The truth-value of the embedded clause depends on the subject's (lab's) practical situation. So if the lab is in a high-stakes situation (regardless of the speaker's context), the embedded ascription is false, and the conditional might be false.

  **What would count against each theory**: If competent speakers judge that the truth of the embedded conditional depends on the speaker's context (e.g., if the speaker is in high stakes, they deny the conditional even if the subject is in low stakes), that supports contextualism. If they judge it depends on the subject's stakes, that supports pragmatic encroachment.

  ## Signed,

  [Name], Epistemic Contextualist  
  [Name], Pragmatic Encroacher
answer: |-
  ## Joint Statement: Contextualism and Pragmatic Encroachment  

  ### 1. Agreed Claims  
  1.1 **Ordinary-Language Data**:  
  (a) **Bank/Airport Cases**: Speakers ascribe "knowledge" to subjects with given evidence in low-stakes scenarios (e.g., "Hannah knows the bank is open") but deny it in high-stakes scenarios with identical evidence ("Hannah does not know the bank is open").  
  (b) **Lottery Propositions**: Speakers deny knowledge of highly probable propositions like "I know this lottery ticket is a loser," despite granting knowledge in cases with similar or lower odds (e.g., "I know my car is parked in lot 5").  
  (c) **Embedded Reports**: Knowledge ascriptions under embeddings (e.g., "Mary believes that John knows the flight stops in Chicago") exhibit sensitivity to context/stakes.  
  (d) **Under Challenge**: When stakes rise, subjects often retract prior knowledge claims (e.g., "I thought I knew, but I was wrong").  

  1.2 **Theoretical Obligations**:  
  (a) A theory must explain the above patterns without ad hoc stipulations.  
  (b) It must account for the role of knowledge ascriptions in practical reasoning (e.g., acting on "knowledge").  
  (c) It must respect the factivity of "knows" (if "S knows p" is true, p is true).  
  (d) It must address how knowledge ascriptions interact with gradable adjectives (e.g., "certain," "justified").  

  1.3 **What Neither Side Claims**:  
  (a) Neither denies that evidence, truth, and belief are necessary for knowledge.  
  (b) Neither asserts that practical stakes alter the truth of p or the evidence available.  
  (c) Neither holds that "knows" is ambiguous (like "bank").  
  (d) Neither reduces knowledge to pragmatic propriety alone.  

  ---

  ### 2. Disagreements Table  
  | **Contextualist’s Wording** | **Pragmatic Encroacher’s Wording** |  
  |-----------------------------|------------------------------------|  
  | **Disagreement 1: Truth-Conditional Mechanism** <br> Contextualism: The truth-value of "S knows p" shifts with the ascriber’s conversational context (e.g., which error-possibilities are salient). | Pragmatic Encroachment: The truth-value of "S knows p" shifts with the subject’s practical situation (e.g., the cost to S of being wrong about p). |  
  | **Correction (Accepted by PE)**: <br> "Pragmatic encroachment does not claim the meaning of 'knows' changes; it claims the epistemic standards for knowledge are partly determined by the subject’s stakes." | **Correction (Accepted by C)**: <br> "Contextualism does not claim the subject’s practical situation is irrelevant; it claims that relevance is mediated by the ascriber’s conversational standards." |  
  | **Disagreement 2: Primacy of Semantics vs. Epistemology** <br> Contextualism: The dispute is semantic—about how context affects the proposition expressed by "knows." | Pragmatic Encroachment: The dispute is epistemological—about whether practical stakes affect the justification threshold for knowledge. |  
  | **Suspicion & Reply (C → PE)**: <br> "Pragmatic encroachment conflates knowledge with warranted assertibility or rational action." <br> **PE Reply**: "We distinguish: knowledge sets the norm for action, but our theory targets knowledge itself, not merely its functional role." | **Suspicion & Reply (PE → C)**: <br> "Contextualism reduces knowledge to conversational patterns, ignoring its normative role." <br> **C Reply**: "We address knowledge’s normative role via context-sensitive truth-conditions, not conversational norms alone." |  

  ---

  ### 3. Cruxes  
  #### Crux (a): Divergent Case (Water Lab)  
  **Scenario**:  
  - *Subject*: Lab technician measures contaminant at 9.9 ppm (regulatory limit: 10 ppm). Evidence is strong but inconclusive (test error rate: 1%).  
  - *Low-Stakes Ascriber*: Supervisor, filing a routine report at 3 PM: "The lab knows the well water meets the standard."  
  - *High-Stakes Ascriber*: Mayor, deciding at 8 PM whether to order bottled water for the town: "The lab does not know that—not for this decision."  

  **Predictions**:  
  - **Contextualist**: The supervisor’s ascription is true. The ascriber’s (supervisor’s) context sets low standards, which the technician’s evidence meets.  
  - **Pragmatic Encroacher**: The supervisor’s ascription is false. The subject’s (technician’s) stakes are high (potential public harm), so higher evidence is required for knowledge.  

  **What Counts Against**:  
  - Against C: If >75% of competent speakers judge the supervisor’s claim *false* (due to the mayor’s stakes), contextualism is challenged.  
  - Against PE: If >75% judge it *true* (ignoring the mayor’s stakes), pragmatic encroachment is challenged.  

  #### Crux (b): Disagreement and Retraction  
  **Case**: At 2 PM, a low-stakes banker says, "I know the bank is open Saturday." At 4 PM, facing urgent bills, they say, "I was wrong earlier—I didn’t know."  

  **Predictions**:  
  - **Contextualist**: The retraction is correct because "knows" in the 4 PM context has stricter standards. The 2 PM claim was true then but false now.  
  - **Pragmatic Encroacher**: The retraction is correct because the subject’s original evidence was always insufficient for knowledge given the (now-revealed) stakes.  

  **What Counts Against**:  
  - Against C: If speakers reject retraction (e.g., "I knew then, but I’d need more proof now"), contextualism is challenged.  
  - Against PE: If speakers endorse retraction *only* if stakes were high *at the time*, pragmatic encroachment is challenged.  

  #### Crux (c): Ideal-Language Question  
  **Question**: Does the dispute vanish if we eliminate "knows"?  
  - **Contextualist**: No. The residual issue is semantic: whether context-sensitivity in natural language reflects a deeper contextualist semantics for epistemic terms.  
  - **Pragmatic Encroacher**: Partly. The core disagreement is epistemological: whether practical stakes affect the evidence threshold for justified belief/action, independent of semantics.  

  **Agreed Test Case**: Restate "S knows p" as "S’s evidence justifies acting as if p." Both sides predict divergent verdicts in bank/water cases, but:  
  - C: Verdicts shift with *ascriber’s* context.  
  - PE: Verdicts shift with *subject’s* stakes.  

  #### Crux (d): Embedded Reports  
  **Case**: "If the lab knows the water is safe, the mayor can cancel bottled shipments."  
  - **Contextualist**: Truth depends on the ascriber’s context (e.g., if the ascriber is in high-stakes, "knows" requires more evidence).  
  - **Pragmatic Encroacher**: Truth depends on the subject’s (lab’s) stakes (e.g., if the lab’s stakes are high, "knows" requires more evidence).  

  **What Counts Against**:  
  - Against C: If embedded ascriptions track subject’s stakes, not ascriber’s context.  
  - Against PE: If they track ascriber’s context, not subject’s stakes.  

  ---

  ### Signed,  
  **Dr. A. Ascriber**  
  *Epistemic Contextualist*  
  **Prof. S. Stakes**  
  *Pragmatic Encroacher*
