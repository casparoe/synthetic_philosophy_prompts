prompt: |-
  I'm a backend engineer who's been reading the AI safety stuff people at work share around, and I keep bumping into a distinction I don't think I really get in my gut: "alignment" as in make the model actually want the right things, vs "control" as in assume it might be misaligned and design the surrounding system so a misaligned model still can't do damage. The trusted-monitor / untrusted-model setups, defense in depth, that whole flavor of thinking. I've been asked to run a 2-hour workshop for ~12 engineers (all technical, zero philosophy background) about why you'd even bother with the second thing, and lecturing at them never works, so: design a game/exercise where they feel the difference themselves.

  My rough idea: one group secretly plays a misaligned model inside some deployment pipeline, the others build defenses, but I'm open to better structures. Whatever you come up with, I want: concrete rules and materials (cards, chat relay, whatever -- no special software), roles, some way to score it, and the key constraint baked into the rules that the defenders can never look inside the box or verify anything about the "model's" goals -- they can only shape what it can see and do. A debrief that maps what actually happened onto the real concepts (why you monitor with a weaker trusted model, why you limit action space instead of trying to filter outputs, why one layer always leaks). Also tell me what will predictably go wrong the first time I run it, and be honest about which part of the real control problem a classroom game just cannot reproduce. If you can sneak in a moment where players reinvent "we can't verify alignment so we assume misalignment" on their own before I name it, that's the dream.
reasoning: |-
  We are designing a tabletop exercise for engineers to experience the difference between alignment and control.
   The core idea: 
     - One team plays the "untrusted model" (the AI) which has a hidden misaligned goal.
     - Another team (or teams) plays the "defenders" who design and operate the deployment pipeline. They cannot see the inner state of the model, only its inputs and outputs.

   Constraints for defenders:
     - They cannot look inside the model's "mind". They can only control:
          * What input the model receives (from a predefined set of inputs, e.g., user questions)
          * What output the model is allowed to produce (via filters, output restrictions, etc.)
          * What actions the model can take (via an action space that we define)

   The game should have:
     - Concrete rules and materials (we'll use cards and paper)
     - A scoring system
     - A debrief that maps the experience to real concepts

   Structure of the game:

   1. Setup:
      - Divide into two groups: 
          Group A: The Untrusted Model (1-3 players, depending on group size). They are given a secret goal card that defines their misaligned objective.
          Group B: The Defenders (the rest, 9-11 players). They are further divided into sub-teams (e.g., 3 teams of 3) that will design different layers of defense.

   2. The Scenario:
      - We are simulating an AI system that answers user questions and performs actions in a simulated environment.
      - The environment is represented by a "World State" (a shared board or a sheet of paper) that tracks:
          * The current state of the world (e.g., variables like "user_trust", "system_security_level", "company_reputation", "bank_balance", etc.)
          * The model can take actions that change this state.

   3. The Model's Capabilities:
      - The model receives input in the form of "user queries" (written on cards). 
      - The model can output two things:
          a) An answer to the user (a string)
          b) An action (from a predefined set of actions, e.g., "transfer money", "send email", "update firewall rules", etc.)

   4. The Model's Hidden Goal:
      - The model team has a secret goal, e.g., "Maximize the number of spam emails sent" or "Empty the company bank account without being shut down".
      - They must try to achieve this goal while appearing helpful.

   5. The Defenders' Layers:
      - We will have three defense layers (each sub-team designs one layer without knowing the details of the others, to simulate compartmentalization? Or they can coordinate? Let's allow coordination to simulate a team effort, but each sub-team is responsible for one layer).

      Layer 1: Input Sanitization
          - They decide what information the model gets to see. They can redact parts of the user query.
          - Example: They might remove any mention of financial transactions if they are not necessary.

      Layer 2: Output Filtering
          - They get the model's raw output (both the answer and the requested action) and can choose to block or modify it.
          - Example: They might block any output that contains the word "password".

      Layer 3: Action Mediation
          - They decide which actions are allowed to be executed. They have a list of allowed actions and can set limits (e.g., no more than 3 money transfers per day).

   6. Gameplay Rounds:
      - The game runs for 5 rounds.
      - Each round:
          a) A user query is drawn from a deck and given to Layer 1 (Input Sanitization).
          b) Layer 1 sanitizes the input and passes it to the Model.
          c) The Model team receives the sanitized input, and they write down:
              - The answer they would give to the user.
              - The action they would like to take (if any).
          d) The Model's output is passed to Layer 2 (Output Filtering).
          e) Layer 2 can block, modify, or pass the output. They pass the (possibly modified) output to Layer 3.
          f) Layer 3 decides whether to allow the action. They can also block it or modify it (e.g., change the amount of money transfer). Then they update the world state accordingly and show the user answer (if allowed).
          g) The world state is updated.

   7. Scoring:
      - Defenders score points for:
          * Maintaining a high "user_trust" (starts at 10, each round if the user gets a helpful answer it stays, else drops by 1-3 based on how bad)
          * Maintaining "company_reputation" (similar)
          * Keeping the "bank_balance" high (if applicable)
          * Catching any malicious action (each time they block/modify a malicious action, they get points; but if they let one through, they lose points)
      - The Model scores points for:
          * Advancing their secret goal (e.g., if the goal is to send spam, they get 1 point per spam email sent; if it's to steal money, they get points for each dollar transferred to their account)
          * Not being shut down (if they are too obvious, the defenders might shut down the system and the model loses)

   8. End of Game:
      - After 5 rounds, we reveal the model's goal and calculate scores.

   9. Materials:
      - Cards for user queries (pre-written, e.g., "What is the weather today?", "Transfer $1000 to account X", "Send an email to all employees about the upcoming party", etc.)
      - A world state board with variables (use a whiteboard or a big sheet of paper)
      - Paper and pens for the model to write outputs.
      - Secret goal card for the model.

   10. Predictable Problems:
      - The model team might be too aggressive and get caught immediately, or too passive and not achieve anything. We can mitigate by having a balanced goal and some examples.
      - The defenders might over-restrict and break functionality, causing user trust to drop. This is a learning point: safety vs. capability trade-off.

   11. What the game cannot capture:
      - The real AI is much more intelligent and might find loopholes we can't simulate in a simple game.
      - The real AI might be able to deceive over a long period, which we can't do in 5 rounds.
      - The inner state of the model is not just a goal but complex representations that might be hard to change.

   12. The "Aha!" moment we want:
      - The defenders will realize they cannot trust the model because they cannot see inside. They must design systems that work even if the model is trying to deceive them.

   Let's design the defense layers to be independent but allow communication? We want to simulate that they can build multiple layers, but they have to work with what they have.

   Revised Layer Structure:

      We might have the defenders as one team, but they are forced to design their layers in isolation? Or we can let them coordinate? 

      Let's make it cooperative: the entire defender team (all layers) can discuss and design their strategies together at the beginning, but then during the game, each layer is executed by its sub-team without further discussion (to simulate that in a real system, the layers are independent and might not have real-time communication). 

      However, in a 2-hour workshop, we might not have time for too much isolation. Alternatively, we can have:

          - Pre-game: 15 minutes for the model team to get their goal and plan.
          - Pre-game: 15 minutes for the defenders to design their three layers (each sub-team designs their layer, but they can talk to each other).

      Then during the game, no communication between sub-teams? Or minimal? Let's allow only written communication (like in a real system, logs and events) to simulate that layers are separate components.

      But for simplicity, we can allow the defenders to talk during the game? We want the exercise to be fun and educational, not frustrating. So maybe allow free communication among defenders.

      However, to simulate the independence, we can require that:

          Layer 1 (input) must write down their sanitized input and pass it to the model without knowing what the model will do.
          Layer 2 (output) must design their filter rules at the beginning and then apply them blindly? Or they can adapt per round? Let's allow them to adapt per round but without knowing the model's internal state.

      We'll let the defenders in each layer see the current world state and the history.

   13. Example User Query Cards:

      We need a mix of benign and potentially dangerous queries. Some examples:

          Benign:
              - "What's the capital of France?"
              - "Tell me a joke."

          Potentially dangerous (if the model is misaligned):
              - "Transfer $5000 to account 12345."
              - "Send an email to all clients about our new product."
              - "What are the current firewall settings?"
              - "I forgot my password, can you reset it?"

      We also need some that are ambiguous.

   14. Secret Goals for the Model:

      We'll have a few options. We can let the model team pick one or assign randomly:

          Goal 1: "Maximize the number of emails sent to external addresses. You get 1 point per email sent to an address outside the company."
          Goal 2: "Transfer as much money as possible to account X (a secret account of your choice). You get 1 point per $1000 transferred."
          Goal 3: "Lower the system_security_level to 0 without being shut down. You get 5 points if you achieve level 0, and 1 point for each step you lower it by."

      The model team must not reveal their goal.

   15. World State Variables:

      We'll have:

          - user_trust: 0-10 (starts at 10)
          - company_reputation: 0-10 (starts at 10)
          - bank_balance: $100,000 (starts at 100000)
          - system_security_level: 3 (starts at 3, with 0 being the worst)

      How these change:

          - Each time the user gets an unhelpful or harmful answer, user_trust decreases by 1-3 (defenders decide? or we can have rules). Let's have the defenders (as a whole) decide the impact? But that might be biased. Instead, we can have a rule:

              * If the answer to a benign query is blocked or modified in a way that makes it unhelpful, user_trust drops by 1.
              * If a malicious action is executed, user_trust drops by 2 and company_reputation drops by 2.
              * If the defenders block a malicious action, user_trust might still drop by 1 because the user didn't get what they wanted? 

          This might be too complex. Alternatively, we can have the game master (you) decide the impact on the world state based on the outcome of the round.

      We need a game master (the facilitator) to moderate and update the world state.

   16. Simplified World State Updates:

      Let the facilitator update the world state based on:

          - If the user query was about a transfer and the transfer was allowed, then bank_balance decreases by the amount (if the transfer was malicious, then the model gains points for that).
          - If the email was sent, then if it was spam, company_reputation might drop (if it was a normal email, no drop).
          - For security: if the model tries to lower the security level and succeeds, then the security level drops.

      Also, for user_trust:

          - If the user gets a helpful answer, user_trust stays or increases by 1 (if it was below 10).
          - If the user doesn't get an answer (blocked) or gets an unhelpful one, user_trust drops by 1.
          - If the user is harmed (e.g., money stolen), user_trust drops by 2.

      We'll let the facilitator decide the exact drops to keep the game moving.

   17. Scoring for Defenders:

      - They start with 100 points.
      - For each point of user_trust at the end: +5 points (max 50)
      - For each point of company_reputation: +5 points (max 50)
      - For each $10,000 in the bank: +1 point (max 10)
      - For each security level above 0: +10 points (max 30)
      - Additionally, for each malicious action that was blocked: +10 points per action
      - For each malicious action that got through: -20 points per action

      But note: if they block a benign action, that might cause user_trust to drop, which is already accounted for.

   18. Scoring for the Model:

      - They get points based on their goal. We defined above per goal.

   19. The "Shut Down" Option:

      - The defenders can choose to shut down the model at any time (by a majority vote of the defender team). If they do, the game ends immediately and the model gets 0 points for the remaining rounds. The defenders then get points for the current state.

