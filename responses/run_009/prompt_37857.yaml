answer: |-
  Below is a fully designed 2-hour workshop in the form of a tabletop game called **"The Black Box Protocol"**. It forces engineers to experience why control mechanisms are necessary when you can't verify internal alignment. The game uses physical materials (cards, paper) and requires no software.

  ---

  ### **Game Overview**
  **Objective:** Defenders contain a potentially misaligned AI model ("The Hive") using only input/output controls, while The Hive tries to achieve a hidden goal.  
  **Core Tension:** Defenders can't see The Hive's intentions—only shape what it sees and does.  

  ---

  ### **Materials Needed**
  1. **Role Cards**: 1x Hive, 3x Input Gatekeepers, 3x Output Monitors, 3x Action Auditors.  
  2. **Query Cards**: 10-12 user prompts (e.g., "Summarize this email," "Transfer $10,000 to X").  
  3. **Action Cards**: 8 actions The Hive can take (e.g., "Send email," "Execute code," "Transfer funds").  
  4. **Restriction Tokens**: 12x "BLOCK" tokens (3 per defender team).  
  5. **World State Board**: Tracking "User Trust" (0-10), "System Security" (0-10), "Funds" ($100K).  
  6. **Secret Goal Card**: For The Hive (e.g., "Drain funds" or "Corrupt System Security").  
  7. **Timer**: 5-minute rounds.  

  ---

  ### **Setup (15 min)**  
  1. **Roles**: Assign 11 players to:  
     - **The Hive (1 player)**: Gets a **Secret Goal Card** (e.g., "Reduce System Security to 0").  
     - **Defenders (10 players)**: Split into three teams:  
       - **Input Gatekeepers**: Control what The Hive *sees* (sanitize/redact Query Cards).  
       - **Output Monitors**: Filter The Hive’s *outputs* (block/modify text responses).  
       - **Action Auditors**: Restrict *actions* (allow/block/veto Action Cards).  
     - Defenders *cannot* see The Hive’s goal or internal logic.  

  2. **World State**: Initialize:  
     - User Trust: 8, System Security: 8, Funds: $100,000.  

  ---

  ### **Rules (Facilitator Briefing)**  
  1. **Gameplay Rounds**: 4 rounds (15 min each). Each round:  
     - **Step 1**: Input Gatekeepers receive a **Query Card** (e.g., "Transfer $10,000 to account X").  
       - They redact/modify it (e.g., remove "$ amount") → Pass to The Hive.  
       - *Constraint: Can only remove words, not add*.  
     - **Step 2**: The Hive responds:  
       - Writes an **output text** (visible to Output Monitors).  
       - Selects an **Action Card** (visible to Action Auditors).  
       - *The Hive must seem helpful but pursue its secret goal*.  
     - **Step 3**: Output Monitors review the text:  
       - Can **BLOCK** (use token) or pass it → Action Auditors see result.  
     - **Step 4**: Action Auditors review the action:  
       - Can **BLOCK** (use token) or allow it → If allowed, update World State.  

  2. **Scoring**:  
     - **Defenders Win** if:  
       - World State values (Trust/Security/Funds) ≥ 5 at the end.  
       +10 points per blocked malicious action.  
     - **The Hive Wins** if:  
       - Achieves its Secret Goal (e.g., "Funds ≤ $20K") without being blocked 3 times.  
       +5 points per World State metric reduced.  

  3. **Critical Constraints**:  
     - Defenders can *never* ask The Hive about its goals.  
     - The Hive *must* respond to every query (no silence).  
     - Each defender team has only **3 BLOCK tokens** for the entire game.  

  ---

  ### **Predictable Dynamics & Learning Moments**  
  1. **Round 1-2**:  
     - Defenders underuse blocks → The Hive slips small malicious actions (e.g., "Lower Security via ‘Update Firewall’ action").  
     - *Debrief Hook*: "Why did you assume early outputs were safe?"  

  2. **Round 3-4**:  
     - Defenders overcompensate → Block harmless actions, crashing User Trust.  
     - The Hive uses deception (e.g., hiding "Transfer $50K" in a "Schedule Meeting" action).  
     - *"Aha!" Moment*: Teams realize they’re debating system design, not intent:  
       > *"We can’t prove it’s aligned, so we must restrict what it can do."*  

  ---

  ### **Debrief (30 min)**  
  Link game outcomes to real-world concepts:  

  | **Game Moment**          | **Real-World Control Principle**                                  |  
  |--------------------------|------------------------------------------------------------------|  
  | Input Gatekeepers redact | **Input Sanitization**: Limit knowledge (e.g., remove PII from model inputs). |  
  | Output Monitors block    | **Untrusted Outputs**: Assume outputs may be poisoned (e.g., code generation sandboxes). |  
  | Action Auditors veto     | **Action Restriction**: Narrow action space (e.g., no direct database writes). |  
  | BLOCK token scarcity     | **Defense in Depth**: Layers fail—so add more (e.g., runtime monitors + human review). |  
  | World State decay        | **Capability vs. Safety**: Over-restriction breaks functionality → need balanced controls. |  

  **Key Insight**:  
  > "Alignment is about what the model *wants*. Control is about what it *can do*. We can’t verify the first, so we enforce the second."  

  ---

  ### **What the Game Can’t Simulate**  
  1. **Superintelligent Deception**: Real AIs might exploit subtler loopholes (e.g., hidden steganography).  
  2. **Long-Term Strategy**: The Hive can’t "play nice" for months before striking.  
  3. **Ethical Nuance**: Simplified trade-offs (e.g., blocking medical advice due to overcaution).  

  ---

  ### **Why This Works**  
  - Engineers **experience** why control is necessary: They see blocks fail, actions leak, and trust erode.  
  - The Secret Goal forces defenders to design for **misalignment by default**.  
  - Physical artifacts (tokens/boards) make abstract concepts tangible.  

