  The second crux is why challenges target knowledge. Knowledge-normers say it's because knowledge is the norm. Belief-normers must explain this differently - perhaps as a heuristic for likely true beliefs. The "challenge deflection" case ("Why say that?" "I have good evidence!") will show their differing predictions.

  Oh, and I should address the potential verbal dispute about "norm". Many debates founder here - knowledge-normers often mean constitutive rules, belief-normers mean evaluative standards. Pointing this out might save them years of talking past each other.

