answer: |-
  ### Session Design: Introducing Imprecise Probabilities

  **Session Goal**: Students experience ambiguity aversion, the gap between buying/selling prices, and dilation, revealing the need for imprecise probabilities without prior theoretical exposure.

  **Materials**:
  - **Urn A**: 50 red chips, 50 blue chips (known composition).
  - **Urn B**: 100 chips (red/blue; *ambiguous* composition). Managed by a **sealed, tamper-evident envelope** containing a slip with the true composition (e.g., "60 red, 40 blue"), prepared offsite by a colleague/administrator. Display the envelope publicly; emphasize that no one (including you) knows the contents.
  - **Urn C**: For dilation phase. Contains chips marked as follows (correlated with Urn B):
    - If Urn B has ≥51 red, Urn C has 90 green and 10 yellow.
    - If Urn B has ≥51 blue, Urn C has 10 green and 90 yellow.
    - *Preparation*: Create Urn C *after* Urn B is sealed, using the same sealed-envelope method to determine its composition based on Urn B’s hidden state. Students verify Urn C’s creation process but don’t see the composition slip.
  - **Betting materials**: Cards labeled with bet options, tokens (or poker chips) for real stakes (e.g., 10 tokens = 1 extra credit point), envelopes for students to submit choices.
  - **Whiteboard**: For recording aggregated class choices during debrief.

  **Setup Name**: Do **not** reveal "Ellsberg" or "imprecise probabilities" until the debrief. Call it "the urns experiment" initially.

  ---

  ### Timeline (90 Minutes Total)

  #### **Phase 1: Ellsberg-Style Betting (25 min)**
  - **0–5 min**: Introduce the urns.  
    - Urn A: Known 50/50 composition. Urn B: Unknown composition (show sealed envelope).  
    - Stakes: Each student gets 10 tokens. Tokens convert to small rewards (e.g., candy, extra credit).  
  - **5–20 min**: Students choose among bets (commit to paper):  
    - *Choice 1*: Bet on red from Urn A vs. red from Urn B (win 10 tokens if correct).  
    - *Choice 2*: Bet on blue from Urn A vs. blue from Urn B.  
    - *Choice 3*: Bet on red from Urn A vs. blue from Urn B.  
    - *Choice 4*: Bet on blue from Urn A vs. red from Urn B.  
  - **20–25 min**: Collect responses. Urns remain unopened.

  #### **Phase 2: Buying/Selling Ambiguous Bets (25 min)**
  - **25–30 min**: Focus on Urn B. Explain buying/selling a bet on "red from Urn B" (pays 10 tokens if correct):  
    - *Buying*: "What’s the max you’d pay to own this bet?"  
    - *Selling*: "What’s the min you’d accept to sell this bet (if you owned it)?"  
  - **30–45 min**: Students submit:  
    - Max buying price for the bet.  
    - Min selling price for the same bet.  
  - **45–50 min**: Poll students anonymously: How many would buy at 4 tokens? Sell at 6 tokens? Record patterns (expect refusals for both).

  #### **Phase 3: Dilation (25 min)**
  - **50–55 min**: Introduce Urn C (correlated with Urn B). Explain:  
    - "Urn C’s composition depends on Urn B’s hidden state." Show creation process (sealed envelope).  
    - We’ll draw one chip from Urn C first.  
  - **55–65 min**: Students submit (paper):  
    - Max buying price for "red from Urn B" *before* seeing Urn C’s draw.  
    - Min selling price for the same bet *before* the draw.  
  - **65–70 min**: **Reveal one chip from Urn C** (e.g., green).  
  - **70–75 min**: Students resubmit:  
    - Max buying price for "red from Urn B" *after* seeing Urn C’s chip.  
    - Min selling price *after* the draw.  

  #### **Debrief (15 min)**
  - **75–90 min**: Reconstruct choices. Whiteboard tables:  
    | Phase | Observed Pattern | Rationalizable by Single Probability? | Formal Insight |  
    |---|---|---|---|  
    | 1 | Avoid Urn B bets | No (violates sure-thing principle) | Sets model ambiguity aversion |  
    | 2 | Gap between buy/sell prices | No (invites money pump) | Imprecision ≠ unsure precise credence |  
    | 3 | Prices diverge *more* after Urn C | No (dilation) | Learning *expands* uncertainty |  
  - **Key Insights**:  
    - Phase 1: Sets explain bet-avoidance where single probabilities can’t.  
    - Phase 2: The gap (e.g., buy ≤4, sell ≥6) requires a *set* of probabilities. A single probability forces accepting one side.  
    - Phase 3: Dilation occurs when new evidence widens the probability set. This justifies paying *not* to see "free" information.  
  - **Closing Gap**: The activity *cannot show why imprecision is normative* (vs. precise-but-unknown probabilities). You must supply:  
    > "The imprecise view avoids assuming hidden 'true' probabilities exist. It treats ambiguity as fundamental, not a lack of knowledge. But is this *better*? That’s next week’s debate."  

  ---

  ### Predicted Problems & In-Moment Fixes

  1. **Problem: Pricing ambiguity as risk**  
     - Students treat Urn B as 50/50 ("indifference by default").  
     - **Fix**: Stress *repeatedly*: "Urn B’s composition is *arbitrary*—it could be 90% red or 10% red. The sealed envelope proves no one knows."  

  2. **Problem: Classroom decisiveness bias**  
     - Pressure to "pick a side" causes majority to mimic sharp probabilities.  
     - **Fix**: Before choices, say: "Don’t overthink—go with your gut. But remember, your tokens are at stake." In debrief, highlight minority ambiguity-averse choices as equally valid.  

  3. **Problem: Dilation confusion**  
     - Students think Urn C’s draw *should* reduce uncertainty (e.g., "Green means Urn B is likely red!").  
     - **Fix**: After revealing Urn C’s chip, ask: "Did this narrow your uncertainty? Why might it do the opposite?" Use whiteboard math to show:  
       - Prior for red in Urn B: Could be 40–60% (set).  
       - After green: *If* Urn B is red-heavy, green is likely (90%); *if* blue-heavy, green is unlikely (10%). But since you don’t know Urn B’s state, green *could* signal *either* outcome → spreads the set to 10–90%.  

  4. **Problem: Time crunch in Phase 3**  
     - Students rush through dilation pricing.  
     - **Fix**: Use countdown timers. Simplify phrasing: "Before urn C: Buy at ___, sell at ___. After seeing green: Buy at ___, sell at ___."  

  ---

  ### Why This Works
  - **Physical Trust**: Sealed urns with third-party validation make ambiguity tangible.  
  - **Stakes**: Tokens force authentic choices (even small rewards matter).  
  - **Aha Moments**:  
    - Phase 2’s buy/sell gap feels irrational under precise probabilities.  
    - Phase 3’s dilation induces shock ("Why would I pay to *avoid* information?").  
  - **Debrief**: Translates discomfort into formalism without lecturing.  

  **Final Note**: The session primes students to *crave* next week’s theory. They’ve felt the cracks in precise probabilities; now they’ll learn how sets patch them.
