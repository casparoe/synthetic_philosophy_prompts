            - The activity does not show why we should use imprecise probabilities instead of a precise but unknown probability. In the precise but unknown case, the agent has a single probability function but they don't know which one. They would update by Bayes for each possible probability function, and then have a distribution over posteriors. The imprecise model, by contrast, has a set of posteriors without weights. The activity does not settle which is better.

