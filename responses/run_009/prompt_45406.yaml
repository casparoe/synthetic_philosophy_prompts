  Materials:
  - Three urns (or boxes/bags) labeled A, B, and C.
  - For Urn A: 50 red chips and 50 blue chips (known composition).
  - For Urn B: 100 chips that are either red or blue, but the exact number is unknown (ambiguous). To ensure trust, we can have a sealed envelope containing the true composition (e.g., a note saying "60 red, 40 blue") prepared by a trusted third party (maybe a colleague) and not revealed until after the experiment. Alternatively, have the urn filled by a student who is not in the class, or use a random number generator to determine the composition and then seal it without revealing.
  - For Urn C: This will be used in the dilation phase. The composition of Urn C is correlated with Urn B. We'll design it so that the draw from Urn C dilates the imprecision about Urn B.

