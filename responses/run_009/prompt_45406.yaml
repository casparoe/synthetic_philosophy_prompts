  1. Introduction (5 minutes): 
     - Explain that we are studying decision-making under uncertainty. Do not reveal the name "Ellsberg" or "imprecise probabilities" until after the activity.

  2. Phase 1: Ellsberg-style betting (25 minutes)
     - Present two urns: Urn A (known: 50 red, 50 blue) and Urn B (unknown composition: 100 chips, red and blue, but no one knows how many of each).
     - Students are given a token currency (e.g., 10 tokens each, which they can convert to small treats or extra credit points at the end).
     - They face a series of choices between bets on the two urns. Each choice is between two bets:
          Option 1: Bet on red from Urn A. If red, win 10 tokens; else, 0.
          Option 2: Bet on red from Urn B. If red, win 10 tokens; else, 0.
       Then similarly for blue.
     - Also, offer choices between betting on red from A vs. blue from B, etc., to see if they are ambiguity averse.
     - Students record their choices on paper.

  3. Phase 2: Selling and Buying Ambiguous Bets (25 minutes)
