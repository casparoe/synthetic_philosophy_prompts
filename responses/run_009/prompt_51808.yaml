          Example: with a very noisy signal (say 51% accurate), then after seeing the signal, they choose Act1 if signal=A, Act2 if signal=B.

          Expected utility with signal (and only Act1/Act2 available):
            P(correct) = 0.51, so they get 100 with prob 0.51 and 20 with prob 0.49 -> 0.51*100+0.49*20 = 51+9.8=60.8

          Without signal, they got 70.

          So 60.8 < 70.

          Therefore, they would be better off without the signal.

          But note: why are they forced to give up Act3 when they buy the signal? That violates the fixed decision problem assumption. The set of acts changes when they buy the signal.

     - So we break the assumption that the set of acts is fixed.

     Design:

          Acts available without signal: Act1, Act2, Act3.
          If they buy the signal (free), then they can only choose between Act1 and Act2 (Act3 is not available).

          Without signal:
             They choose Act3: 70.

          With signal:
             They choose based on the signal: 
                  If they get a signal with accuracy p, then expected utility: p*100 + (1-p)*20 = 20 + 80p.

             We need 20+80p < 70 -> 80p < 50 -> p < 50/80 = 0.625.

          So set p=0.6 (60% accurate).

          Then with signal: 20 + 80*0.6 = 20+48=68 < 70.

          So they are better off without the signal.

     - This violates the assumption that the decision problem (the set of available acts) is fixed.

     **Summary of Rounds:**

     Round 0 (Baseline): No signal, choose between Act1 and Act2 -> expected 60.

     Round 1: Free perfect signal -> then choose. They get 100. Shows value of information.

     Round 2: Free imperfect signal (70% accurate) -> then choose. They get 76.

     Round 3: Costly signal (70% accurate, cost 10) -> then choose. 76-10=66>60, so buy.

     Round 4 (Violation 1: Commitment): Free signal (70% accurate) but must commit to an act BEFORE seeing the signal. Then they get the same as without signal (60). So they should not bother buying (or if they do, they get the same but with extra step). This violates the assumption that the decision maker can condition on the signal.

     Round 5 (Violation 2: Opponent): Adversarial setting with Team2. Buying the signal (free) allows Team2 to always make Team1 get 0, whereas without signal Team1 gets 50 on average. This violates the single-agent assumption.

     Round 6 (Violation 3: Changing acts): 
          Without signal: can choose Act3 (safe 70) or Act1/Act2 (60) -> choose Act3: 70.
          With signal: only Act1 and Act2 available, and the signal is 60% accurate -> expected 68. 
          So they prefer not to buy the free signal. This violates the assumption that the set of acts is fixed.

     **Debrief:**

     - Map each round to the assumption it violates:
          Round 4: The decision maker must be able to condition their action on the signal (i.e., no prior commitment).
          Round 5: The decision problem must be single-agent (no strategic interaction).
          Round 6: The set of available acts must be fixed (not change as a result of acquiring information).

     - In each violation round, the value of information can be negative.

     - What the classroom game cannot reproduce: 
          The theorem holds for any finite decision problem with rational expected utility maximization. In the classroom, we use simple payoffs and states. We cannot fully capture continuous states or acts, or very complex updating. Also, in reality, information might have cognitive costs (e.g., effort to process) which we ignore.

     **What will predictably go wrong:**

     1. In Round 5 (opponent), students might not follow the equilibrium reasoning. Team2 might not play optimally (e.g., they might not always choose to punish when they see the signal purchase). Then Team1 might get away with buying the signal. So we need to instruct Team2 to play optimally (explain that they get 100 if they make Team1 get 0, and 0 otherwise) and that they are trying to maximize their own points.

     2. In Round 6, students might not realize that Act3 is dominated when they have the signal? Or they might not compute the expected value correctly and still buy the signal.

     3. Time: running multiple rounds with calculations might take longer than expected.

     4. Understanding conditional probabilities: students might have difficulty computing posterior probabilities in Round 2 and 3, even though we provide the accuracy. We should provide a cheat-sheet for Bayes' rule? Or do the updating for them? Or use a calculator.

     5. In Round 4 (commitment), students might be confused why they have to commit before seeing the signal. Emphasize the rule.

     **Logistics:**

     - Use a coin flip (or a random number generator) to determine the state.
     - For signals: use a random number to determine the signal (according to the accuracy).
     - Have a worksheet for each team to record their choices and payoffs.

     We'll design the rounds accordingly.
answer: |-
  Below is a comprehensive design for an in-class game to teach Good's theorem and its limitations. The game progresses through rounds that first illustrate the theorem and then systematically violate its assumptions. It accommodates 14 students in pairs (7 pairs) and fits within a 90-minute session.

  ---

  ### **Game Overview**
  - **Objective**: Students experience Good's theorem (free information never harms) and discover violations when assumptions break.
  - **Structure**: 6 rounds (1 baseline + 5 experimental), each 10-12 minutes, followed by a 15-minute debrief.
  - **Materials**: 
    - Coins (or RNG) for state/signal generation.
    - Worksheets for teams to record choices/points.
    - Payoff tables displayed (projected or handout).
  - **States**: Binary hidden state \(S\) (A or B), each with \(P = 0.5\).
  - **Acts**: Two primary acts (Act1, Act2) with symmetric payoffs:
    - **Act1**: 100 if \(S=A\), 20 if \(S=B\).
    - **Act2**: 20 if \(S=A\), 100 if \(S=B\).
  - **Signals**: Noisy signal \(Y\) about \(S\) (accuracy varies).
  - **Scoring**: Points (not money) awarded each round. Teams track cumulative points.

  ---

  ### **Rounds**

  #### **Round 0: Baseline (No Information)**
  - **Goal**: Establish expected utility without information.
  - **Rules**: 
    - State \(S\) determined by coin flip (A/B).
    - Teams choose Act1 or Act2 blindly.
  - **Payoffs**: 
    - Correct guess: 100 pts. 
    - Wrong guess: 20 pts.
  - **Expected Utility**: 60 pts (since \(P(S=A) = P(S=B) = 0.5\)).
  - **Debrief Prep**: Students see that without information, max EU is 60.

  #### **Round 1: Free Perfect Signal**
  - **Goal**: Experience strict benefit of free information.
  - **Rules**:
    - Teams choose whether to observe \(S\) (perfectly, for free) before acting.
  - **Payoffs**: 
    - If they observe: Always choose correctly → 100 pts.
    - If they refuse: Same as Round 0 (max 60 pts).
  - **Outcome**: All teams accept the signal, earning 100 pts. Refusing is dominated.

  #### **Round 2: Free Imperfect Signal (70% Accurate)**
  - **Goal**: Show even noisy free information helps.
  - **Rules**:
    - Free signal \(Y\) with accuracy \(P(Y=A|S=A) = P(Y=B|S=B) = 0.7\).
    - Teams choose to see \(Y\) or not, then act.
  - **Payoffs**:
    - Without signal: Max 60 pts (as in Round 0).
    - With signal: EU = 76 pts (optimal action given \(Y\)).
  - **Outcome**: Teams that reject the signal earn ≤60; those who accept earn ~76. Free information still dominates.

  #### **Round 3: Costly Signal (70% Accurate, Cost=10 pts)**
  - **Goal**: Willingness to pay for information up to its value.
  - **Rules**:
    - Signal (70% accurate) costs 10 pts to observe.
    - Teams decide: buy signal and act, or act without signal.
  - **Payoffs**:
    - Without signal: Max 60 pts.
    - With signal: EU = 76 - 10 = 66 pts > 60.
  - **Outcome**: Buying is optimal. "Value of information" = 16 pts (76 - 60), so paying ≤16 is rational.

  ---

  ### **Violation Rounds**  
  *Each breaks one assumption while feeling like "the same game".*

  #### **Round 4: Signal Accuracy Depends on State**
  - **Violated Assumption**: Signal distribution independent of state.
  - **Rules**:
    - Free signal \(Y\), but accuracy varies by state:
      - \(P(Y=A|S=A) = 0.9\) (high accuracy if A).
      - \(P(Y=B|S=B) = 0.5\) (random if B; like a coin flip).
    - Teams choose to observe \(Y\) or not, then act optimally.
  - **Payoffs**:
    - **Without signal**: EU = 60 pts (baseline).
    - **With signal**: EU = 54 pts (calculate below).
  - **Calculation**:
    - \(P(S=A) = P(S=B) = 0.5\).
    - \(P(Y=A) = P(Y=A|S=A)P(S=A) + P(Y=A|S=B)P(S=B) = (0.9)(0.5) + (0.5)(0.5) = 0.7\).
    - \(P(S=A|Y=A) = \frac{(0.9)(0.5)}{0.7} \approx 0.643\) → Act1 gives \(0.643 \times 100 + 0.357 \times 20 \approx 71.4\).
    - \(P(S=B|Y=B) = \frac{(0.5)(0.5)}{0.3} \approx 0.833\) → Act2 gives \(0.833 \times 100 + 0.167 \times 20 \approx 86.7\).
    - Overall EU: \(P(Y=A) \times 71.4 + P(Y=B) \times 86.7 = (0.7)(71.4) + (0.3)(86.7) \approx 54\).
  - **Outcome**: EU with signal (54) < EU without (60). Students learn refusing free info can be better.

  #### **Round 5: Irrevocable Commitment Before Signal**
  - **Violated Assumption**: Ability to condition acts on the signal.
  - **Rules**:
    - Free signal (70% accurate) offered, but teams **must commit to Act1/Act2 BEFORE** observing \(Y\).
    - Teams choose: 
      - Option 1: Skip signal, choose act (max EU=60).
      - Option 2: Pay for signal (free), commit to act, *then* see \(Y\).
  - **Payoffs**:
    - If they commit without signal: EU=60.
    - If they commit with signal: EU=60 (since commitment is blind; signal is useless).
  - **Outcome**: Buying the signal gives no benefit (same EU). Students see information is worthless if you can’t act on it.

  #### **Round 6: Information About a Renounced Option**
  - **Violated Assumption**: Fixed decision problem (no change in acts/utilities).
  - **Rules**:
    - New safe option: **Act3** (pays 70 pts always).
    - Teams **must renounce Act3 first**:
      - Step 1: Choose between {Act1, Act2} **or** Act3.
      - Step 2: If they renounce Act3 (choosing {Act1, Act2}), they can buy a free signal (70% accurate) about \(S\).
    - If they pick Act3, game ends (70 pts).
  - **Payoffs**:
    - Choosing Act3: 70 pts.
    - Renouncing Act3 + no signal: EU=60.
    - Renouncing Act3 + signal: EU=76.
  - **Twist**: After renouncing Act3, teams learn:
    > "Act3 is no longer available. You *must* choose between Act1/Act2."
  - **Outcome**: 
    - EU after renouncing + signal (76) > EU from Act3 (70). 
    - **But**: Students feel psychological loss realizing they gave up 70 for a gamble. Some teams refuse the signal to avoid regret, even though rationally, 76 > 70. Highlights "pure cost of knowing" (non-utility regret).

  ---

  ### **Debrief (15 min)**
  1. **Map Violations to Assumptions**:
     - **Round 4**: Signal distribution depends on state → Violates "fixed signal likelihood".
     - **Round 5**: Commitment before signal → Violates "actions conditional on signal".
     - **Round 6**: Information about renounced option → Violates "fixed set of acts/utilities" (psychologically, regret breaks rational choice).
     - **Adversarial Round (if time)**: Opponent reacts to signal purchase → Violates "single-agent" (not run due to time, but mention).

  2. **Why Value of Information Turned Negative?**
     - Round 4: Signal is misinformative in some states → Bad info outweighs good.
     - Round 5: Information is useless without flexibility → No option value.
     - Round 6: Regret violates expected utility → Psychological cost unaccounted for.

  3. **Limitations of Classroom Game**:
     - **Finite Rationality**: Tired students miscompute posteriors (e.g., Round 4).
     - **No Real Zero Cost**: Cognitive effort to process signals isn’t modeled.
     - **Regret ≠ Utility**: Emotions (Round 6) break rational EU maximization.
     - **Simplified States**: Real-world states are continuous/complex.

  4. **Key Takeaway**: Good’s theorem holds under strict assumptions. Violations explain why we sometimes reject free information (e.g., "ignorance is bliss").

  ---

  ### **Predictable Problems (and Solutions)**
  1. **Bayesian Confusion**:
     - Students botch posterior calculations (Rounds 2–4). 
     - *Solution*: Provide a "Bayes’ Cheat Sheet" (e.g., \(P(S|Y) \propto P(Y|S)P(S)\)) and simplified examples.

  2. **Round 5 Commitment Misunderstanding**:
     - Teams think they can act after seeing the signal. 
     - *Solution*: Emphasize: "If you buy the signal, you **must lock in your act first**."

  3. **Round 6 Regret Dominates**:
     - Teams refuse to renounce Act3 (even though 76 > 70) to avoid potential regret. 
     - *Solution*: Acknowledge this is irrational per EU but real; discuss in debrief.

  4. **Time Overruns**:
     - Round setup/calculations take longer than planned. 
     - *Solution*: Use pre-generated states/signals; limit discussion time per round.

  5. **Adversarial Round Complexity**:
     - Strategic thinking in Round 5 (if included) bogs down. 
     - *Solution*: Skip or simplify (e.g., use a fixed opponent strategy).

  ---

  ### **Logistical Notes**
  - **Timing**: 
    - Rounds 0–3: 40 min.
    - Violation Rounds (4–6): 30 min.
    - Debrief: 15 min.
    - Buffer: 5 min.
  - **Grouping**: Pairs work best (7 pairs); use trios if odd number.
  - **Incentives**: Prize for top team (e.g., candy) to engage competition.
  - **Variants**: For advanced students, add the adversarial round (teams play against each other with signaling).

  This design ensures students experience Good’s theorem viscerally, confront its limits, and leave with a nuanced view of information’s value.
