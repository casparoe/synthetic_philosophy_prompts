prompt: |-
  i keep running into arguments about whether everettians can get the Born rule out of the rest of their theory, and before I read another one I want the spec first. Write the list of requirements a derivation of the Born rule in many-worlds has to meet to actually count as a derivation and not just "here's why squared amplitudes seem reasonable."

  Stuff I suspect belongs on the list but dont know how to state cleanly: it can't assume what it's trying to prove (alot of them seem to smuggle probability in at step one), it has to say what probability even means in a theory where every outcome happens -- this is where I keep getting stuck, if I get every result at once, what exactly am I uncertain about? -- it has to explain why naive branch counting gives wrong answers (I've heard branch counting isn't even well-defined, is that true and does it matter?), and it probably has to hook up to how a rational agent should act, since if every outcome happens, betting behavior seems like the only place left where 'probability' could live.

  For each requirement give the consideration behind it, and mark which ones are genuinely non-negotiable versus which are just pet assumptions of a particular camp -- the decision-theory people, the self-locating uncertainty people, the typicality people -- dressed up as requirements. And please tell me whether any subset of the requirements is jointly unsatisfiable; that's the part I actually want to know. Skip scoring the existing derivations against the list, I'll look at those myself after.
reasoning: |-
