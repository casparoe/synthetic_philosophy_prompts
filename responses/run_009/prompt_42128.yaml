  Ah, they also mention branch counting debates and the agent-centric view (betting behavior). Good—they're aware of key pain points. Their unspoken need seems to be: "Give me the *actual* litmus tests so I can cut through the noise myself." They don't want opinions on existing derivations (wise—that's a rabbit hole), just the framework to evaluate them. 

  Breaking this down: First, the derivation must avoid circularity—no sneaking in Born rule assumptions. Second, it must define probability without contradiction (huge hurdle!). Third, it must explain why naive "1 branch = 1 probability" fails. Fourth, it should connect to rationality (since subjective uncertainty is all that's left). 

  Non-negotiable? Circularity and probability meaning are absolute. Branch counting explanation is almost mandatory—otherwise squared amplitudes seem arbitrary. Rationality links are softer; some camps (like Deutsch/Wallace) insist on it, others might ground probability elsewhere (e.g., self-locating uncertainty). 

  Biggest tension: Defining subjective probability *without* smuggling it in. If every outcome is real, uncertainty feels illusory. Some argue rationality *requires* Born-rule betting even knowing all outcomes occur—that’s a tough sell. Also, branch ontology matters: if branches aren't discrete, counting fails from the start. 

  User’s sharp—they’ll spot if I’m vague. Need crisp, numbered criteria with clear justifications. Flag where disputes exist (e.g., "rational agency" is contentious). Stress that no derivation satisfies everyone; the field’s still fighting over this. Their "jointly unsatisfiable" ask is key: the probability meaning/rationality link might be the trip wire where attempts fail.
answer: |-
  Below is the rigorously specified list of requirements for a derivation of the Born rule in Everettian quantum mechanics (EQM) to be considered non-circular and foundational. Requirements are categorized, justified, and assessed for negotiability based on major camps (decision-theory, self-locating uncertainty, typicality). The critical question of joint satisfiability is addressed at the end.

  ---

  ### **Core Requirements (Non-Negotiable)**
  1. **Non-Circularity / No Implicit Assumption of Probability**  
     - **Requirement**: The derivation must not assume the Born rule (or any probabilistic interpretation of amplitudes) in its premises. This includes avoiding covert uses of probability in measure theory, decision theory, or branch ontology.  
     - **Justification**: If the Born rule is presupposed (e.g., by treating amplitudes as weights in an expectation value), the derivation is circular. EQM must derive probability *from* unitary dynamics.  
     - **Non-Negotiable**: Universally accepted. Violations invalidate the derivation.

  2. **Operational Definition of Probability**  
     - **Requirement**: Must define what "probability" *means* in a deterministic multiverse where all outcomes occur. This must resolve the **incoherence problem**: If all branches are real, what is an agent uncertain *about*?  
     - **Justification**: Without this, "probability" is a meaningless label. The definition must either:  
       - Ground probability in *self-locating uncertainty* (e.g., "Which branch am I in?" post-measurement), or  
       - Define it via *rational action* (e.g., betting preferences).  
     - **Non-Negotiable**: All derivations must address this. Failure reduces the Born rule to a postulate.

  3. **Rejection of Naive Branch Counting**  
     - **Requirement**: Must explain why "each branch gets equal probability" fails, even if branches could be counted. Must also address whether branches *can* be counted (i.e., is branch cardinality well-defined?).  
     - **Justification**: Unitary dynamics shows branches have unequal amplitude. A derivation must justify why amplitude, not branch count, matters.  
     - **Non-Negotiable**: Essential for all camps. Naive counting contradicts quantum predictions (e.g., unequal probabilities for spin measurements).

  ---

  ### **Structural Requirements (Highly Constrained)**
  4. **Branch Ontology Compatibility**  
     - **Requirement**: Must not rely on a specific, disputed ontology of "branches" (e.g., treating them as discrete/countable). Must work under EQM's standard formalism (decoherent histories, wavefunction in Hilbert space).  
     - **Justification**: Branches aren't fundamental—they emerge from decoherence. If a derivation requires discrete branches, it may conflict with QM's continuity.  
     - **Negotiability**: Low. Most agree branches are emergent/approximate. Discrete-branch assumptions are widely rejected.

  5. **Amplitude → Probability Link**  
     - **Requirement**: Must derive why probability is a function *specifically* of squared amplitude (|ψ|²), not |ψ|, |ψ|⁴, or other alternatives.  
     - **Justification**: Empirical evidence supports |ψ|². A derivation must explain this functional form without assuming it.  
     - **Negotiability**: Low. |ψ|² is non-negotiable; alternatives are falsified by experiment.

  ---

  ### **Rationality/Agency Requirements (Camps Disagree)**
  6. **Decision-Theoretic Robustness**  
     - **Requirement**: Must show that a rational agent who accepts EQM *must* bet according to the Born rule to avoid incoherent decisions (e.g., Dutch books).  
     - **Justification**: In a multiverse, "probability" may reduce to rational action under uncertainty (e.g., Deutsch-Wallace). Connects metaphysics to observable behavior.  
     - **Negotiability**:  
       - **Decision-Theory Camp (Deutsch, Wallace)**: Non-negotiable. Probability *is* defined via rational action.  
       - **Others**: Optional. Self-locating uncertainty may ground probability independently of agents.

  7. **Typicality Consistency**  
     - **Requirement**: In a large ensemble of measurements, the Born rule must align with "typical" experience (e.g., observed frequencies match |ψ|² in most branches).  
     - **Justification**: Explains statistical evidence without probabilistic axioms (e.g., Carroll-Sebens).  
     - **Negotiability**:  
       - **Typicality Camp**: Core to their approach.  
       - **Others**: Useful but insufficient alone—doesn't define single-event probability.

  ---

  ### **Potential Conflicts & Joint Satisfiability**
  - **Incoherence vs. Rationality**: The core tension. If all outcomes happen, how can an agent be "uncertain"? Camp-dependent solutions:  
    - **Self-Locating Uncertainty (SLU)**: Uncertainty is epistemic ("Which branch am I in?").  
      - *Conflict*: SLU may not force |ψ|² without additional assumptions (e.g., amplitude-sensitive indifference).  
    - **Decision Theory (DT)**: Uncertainty is pragmatic ("How should I bet?").  
      - *Conflict*: DT may require auxiliary axioms (e.g., utility linearity) that smuggle in probability.  
  - **Typicality vs. Single Cases**: Typicality justifies long-run frequencies but struggles for single-event probabilities. Needs supplementation (e.g., SLU or DT).  
  - **Branch Counting Undefinability**: If branches are emergent/uncountable (requirement #4), branch counting is invalid *ab initio*. Resolves #3 but heightens the need for #2.  

  **Can all requirements be jointly satisfied?**  
  - **Yes, in principle**—but no derivation satisfies all camps.  
    - **SLU-based derivations** (e.g., Vaidman) satisfy #1–5 but struggle with #6 (rational action).  
    - **DT-based derivations** (e.g., Deutsch) satisfy #1–3, #6 but face circularity accusations (#1) for assuming decision axioms.  
    - **Typicality-based** (e.g., Carroll) satisfies #1–4, #7 but needs #2 and #5 addressed separately.  
  - **Critical Trade-off**: Defining probability (#2) *without* decision theory (#6) risks leaving probability metaphysically unmotivated. Using decision theory risks circularity (#1).  

  ---

  ### **Summary of Non-Negotiables vs. Camp-Specific Requirements**
  | **Requirement**               | Non-Negotiable? | Major Camp Dependencies         |  
  |-------------------------------|-----------------|--------------------------------|  
  | **Non-Circularity**           | Yes             | Universal                      |  
  | **Probability Meaning**       | Yes             | SLU/DT debate                  |  
  | **Reject Branch Counting**    | Yes             | Universal                      |  
  | **Branch Ontology Neutrality**| Highly Constrained | Universal (rejects discrete branches) |  
  | **|ψ|² Functional Form**      | Highly Constrained | Universal                      |  
  | **Decision-Theoretic Robustness** | Camp-Specific   | DT camp: mandatory; others: optional |  
  | **Typicality**                | Camp-Specific   | Typicality camp: core; others: supplemental |  

  ### **Key Takeaway**  
  The hardest requirements to jointly satisfy are **defining probability without circularity** (#1 + #2) and **linking it to rational action** (#6). If probability is grounded in self-locating uncertainty, its connection to betting behavior is not automatic; if grounded in decision theory, the axioms may implicitly assume probability. No extant derivation escapes this tension entirely—but examining how each addresses these gaps reveals where the debate stands.
