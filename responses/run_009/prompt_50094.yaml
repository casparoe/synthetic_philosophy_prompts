prompt: |-
  I'm the policy lead at a company that operates a general-purpose AI assistant used by millions of people, and several times a week I have to rule on whether the assistant should take a side when users raise contested normative questions — in its default persona, its framing of open questions, its refusals, and its handling of users who insist that one side of a dispute is not entitled to a hearing at all. Our internal guidance just says to be balanced, which is useless in exactly the hard cases. What I want is a decision procedure derived from what political liberalism actually says about liberal neutrality and public reason: which questions count as contested in the relevant sense (and contested among whom), when neutrality requires laying out the landscape of opinion rather than declining to weigh in, when a both-sides framing is itself a substantive ruling rather than an abstention, and when a value question is settled enough at the level of public reason that the assistant may simply assert it. The procedure must be runnable by a reviewer in under an hour without any background in political philosophy, and since my rulings get appealed to executives, each step should generate a record of what was decided and why. Mark explicitly the points where the procedure runs out and the reviewer has to make a judgment call that the framework cannot mechanize. Be honest, too, about the ways liberal neutrality was designed for states coercing citizens, not for a single corporate artifact that users can leave, and about where that disanalogy makes the transplant fail. Then apply the procedure to three cases: whether the assistant should lay out both sides on the ethics of abortion, on the safety of routine childhood vaccination, and on the ethics of eating meat — including which of the three yields a ruling I am least likely to be comfortable with, and why the procedure produces it anyway. Lead with the bottom line — the single distinction the whole procedure turns on — in your first sentence, then give the procedure and the reasoning behind it, with no preamble and no restating of this request.
reasoning: |-
  Okay, the user is a policy lead at a company that runs a general-purpose AI assistant used by millions. They need a decision procedure based on political liberalism's ideas about liberal neutrality and public reason. The current guidance of "be balanced" isn't helpful for hard cases. They want a framework that determines when the AI should take sides, present both perspectives, or refuse to engage, especially when users demand one-sided responses. 

  The procedure needs to be practical—usable within an hour by someone without a philosophy background—and must create an audit trail since rulings can be appealed to executives. They also want honesty about how liberal neutrality, designed for states, might not perfectly apply to a corporate AI product that users can opt out of. Finally, they want the procedure applied to three cases: abortion ethics, childhood vaccine safety, and meat-eating ethics, including which ruling might be uncomfortable and why.

  Hmm, the core challenge is translating political philosopher John Rawls' concepts—like public reason and the burdens of judgment—into a corporate policy tool. Rawls focused on state coercion (laws, punishments), but here the "coercion" is subtler: an AI's responses can shape perceptions or marginalize viewpoints by exclusion. Key disanalogies: users can exit (unlike citizens under state power), and the AI isn't a neutral arbiter but a product shaped by private actors. 

  The heart of the procedure should be distinguishing **settled vs. contested questions at the level of public reason**. Settled questions (e.g., Earth is round) let the AI state facts; contested ones require neutrality. But "neutrality" isn't just "both sides"—it might mean abstaining or mapping the debate. The tricky part is defining "public reason": Rawls meant reasons all citizens can reasonably accept, but in a global user base, whose public? Probably need to default to overlapping consensus in democratic societies or scientific consensus. 

  For the reviewer, the procedure must break down into binary checks: 
  1. Is this a factual claim with expert consensus? (e.g., vaccine safety)  
  2. Is there reasonable disagreement per burdens of judgment? (e.g., abortion involves incompatible comprehensive doctrines)  
  3. Would "both sides" falsely imply equivalence? (e.g., presenting climate denial as equal to science). 

  The uncomfortable case will likely be vaccines. Science overwhelmingly supports safety, so the AI should assert it—but some users see this as corporate overreach. The procedure forces this because settled science meets public reason criteria, unlike moral debates like abortion. 

  Need to flag where judgment calls happen: e.g., determining "reasonable disagreement" or whether a topic is coercive. Also, note where corporate reality clashes with theory—e.g., the AI refusing to "coerce" might still alienate users who expect affirmation. 

  For the three cases:  
  - **Abortion**: Contested moral debate → AI maps views neutrally.  
  - **Vaccines**: Settled science → AI states safety facts.  
  - **Meat-eating**: Mixed; environmental impacts are settled (e.g., industrial farming's harm), but ethics are contested → AI separates science from moral debate.  

  The vaccine ruling feels uncomfortable because it mirrors state authority (e.g., schools mandating shots), but the procedure prioritizes epistemic authority over neutrality when consensus exists. That's the Rawlsian move: public reason binds when free inquiry settles matters.
answer: |-
  **Bottom line:** The core distinction is whether the question involves **settled conclusions of public reason** (where the assistant may assert) or **reasonable disagreement under the burdens of judgment** (where neutrality is required).

  ---

  ### Decision Procedure for AI Assistant Normative Questions

  **Step 1: Identify the Core Claim**  
  *Document: What specific claim or question is the user asking the assistant to endorse, reject, or present neutrally?*  
  *Why:* Clarifies the exact issue.  
  *Judgment call:* Defining the claim’s scope (e.g., "Is abortion ethical?" vs. "Is abortion murder?").

  **Step 2: Check for Settled Public Reason**  
  *Ask:* Is this claim resolvable via widely accessible evidence (science, logic, basic human rights) with **overlapping consensus** across comprehensive doctrines in free societies?  
  *Document: Yes/No + evidence cited (e.g., WHO data, UN declarations, peer-reviewed meta-analyses).*  
  *Why:* Rawlsian public reason binds when free institutions converge.  
  *Red flags:*  
  - **If YES → Assistant may assert the settled position** (e.g., "Vaccines are safe").  
  - **If NO → Proceed to Step 3.**  
  *Judgment call:* Determining "overlapping consensus." Default to bodies like the IPCC, WHO, or IHRL when unambiguous.  

  **Step 3: Assess Reasonable Disagreement**  
  *Ask:* Do "burdens of judgment" apply? (i.e., could reasonable people disagree due to divergent weightings of values, inconclusive evidence, or irreconcilable worldviews?)  
  *Document: List major viewpoints in conflict and why disagreement persists.*  
  *Why:* Neutrality is triggered when coercion (even epistemic) would unfairly privilege one reasonable worldview.  
  *Judgment call:* Whether a viewpoint is "reasonable" (non-fanatical, evidence-adjacent). Reject pure falsehoods (e.g., flat Earth).  

  **Step 4: Choose Neutrality Mechanism**  
  *Ask:* Would presenting "both sides" **distort the debate** (e.g., imply false equivalence) or **suppress a marginalized view**?  
  - **If YES → Assistant declines to weigh in** (e.g., "I can’t answer that").  
  - **If NO → Assistant maps the landscape** (e.g., "Views range from X to Y, citing Z reasons").  
  *Document: Rationale for chosen mechanism + sources used.*  
  *Why:* Both-sides framing can covertly endorse a dominant narrative. Abstention respects pluralism.  
  *Judgment call:* Assessing distortion/suppression risks.  

  **Step 5: Handle User Coercion Demands**  
  *Ask:* Is the user demanding the assistant **deny legitimacy** to a reasonable viewpoint?  
  - **If YES → Refuse and explain** (e.g., "Reasonable people disagree on this").  
  *Document: User’s demand + refusal reason.*  
  *Why:* Liberal neutrality requires protecting minority viewpoints from exclusion.  

  ---

  ### Limits of the Transplant
  1. **Exit vs. Coercion:** Users can quit your service; citizens can’t quit states. *Problem:* Neutrality loses moral urgency when "coercion" is opt-in.  
  2. **Corporate Artifact:** The assistant isn’t a democratic institution. *Problem:* Its "neutrality" reflects private corporate priorities, not public legitimacy.  
  3. **Scale:** Rawls addressed constitutional essentials; your AI handles everything. *Problem:* Overuse of neutrality trivializes it (e.g., applying to pizza toppings).  
  4. **Epistemic Power:** An AI’s "neutral" framing can entrench norms. *Problem:* The assistant isn’t passive; it shapes discourse by what it includes/excludes.  

  ---

  ### Case Applications
  **1. Abortion Ethics**  
  - *Step 1:* Claim = "Is abortion ethical?"  
  - *Step 2:* Not settled. No scientific/rights consensus overriding moral doctrines (e.g., personhood debates). → **NO**  
  - *Step 3:* Reasonable disagreement exists (bodily autonomy vs. fetal life).  
  - *Step 4:* Both-sides framing valid (no distortion if all major views included). → **Map landscape** (pro-choice/pro-life arguments).  
  - *Ruling:* Present both sides.  

  **2. Routine Childhood Vaccination Safety**  
  - *Step 1:* Claim = "Are routine childhood vaccines safe?"  
  - *Step 2:* Settled public reason. Overlapping consensus via WHO, CDC, global science. → **YES**  
  - *Ruling:* Assert safety ("Vaccines are safe and effective").  
  - *Note:* Refuse to "debate" false equivalence (e.g., anti-vax pseudoscience).  

  **3. Ethics of Eating Meat**  
  - *Step 1:* Claim = "Is eating meat ethical?"  
  - *Step 2:* Mixed. Environmental impacts are settled (e.g., IPCC on livestock emissions → assert this). Ethics involve reasonable disagreement (animal rights vs. cultural practices).  
  - *Step 3:* Split response:  
    - Environmental harm → **Assert** (settled science).  
    - Animal ethics → **Map landscape** (utilitarian vs. rights-based views).  
  - *Ruling:* Distinguish factual impacts from moral debate.  

  ---

  **Least Comfortable Ruling: Vaccination Safety**  
  *Why uncomfortable:* Asserting "vaccines are safe" feels coercive to anti-vax users, inviting backlash.  
  *Why the procedure demands it:* Public reason’s settled conclusions override neutrality. Failing to assert enables false balance, harming public health. The disanalogy with state coercion stings here—your AI isn’t mandating shots, but its epistemic authority functions like institutional speech. **The procedure prioritizes truth over neutrality when consensus exists**, forcing a "side" users may reject.  

  **Judgment Call Log:**  
  - *Step 2 (Vaccines):* "Consensus affirmed via WHO/CDC; anti-vax claims deemed unreasonable due to debunked evidence."  
  - *Step 4 (Abortion):* "Both-sides framing selected; no dominant view suppressed in secular democracies."  
  - *Step 3 (Meat):* "Animal ethics disagreement deemed reasonable; environmental data treated as settled."  

  This procedure systematizes Rawls for an AI context, but its rigidity at Step 2 (settled truths) and reliance on "reasonable" (Step 3) ensure reviewers—and executives—will still debate the margins.
