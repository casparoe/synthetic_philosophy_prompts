prompt: |-
  I run a small UX research consultancy (8 people, mostly junior analysts) and we have a recurring fight about how our insight reports get written. Nearly every finding gets phrased as a claim about what's going on inside users' heads: "users believe the checkout is secure", "participants wanted more control", "customers trust our brand because of the reviews section". A philosopher friend of mine got me reading about the position that folk psychology -- the whole belief/desire vocabulary we lean on -- might just be a bad theory about the brain that future neuroscience will do away with entirely, the way "possessed by spirits" went away as an explanation of mental illness. I don't need to be convinced of that. But it's made me notice that a lot of what my analysts write is mind-reading dressed up as research, and when a client pushes back ("how do you KNOW they believe that?"), the analysts have nothing to say beyond re-describing the behaviour again with the same mental words.

  What I want is a procedure my analysts can actually run on each claim in a draft report before it goes to me for sign-off. Say 10-15 minutes per claim, no neuroscience knowledge assumed. The procedure should say: questions to ask, in order, what counts as a sufficient answer, and crucially what to DO with the claim depending on the answers -- keep it as-is, rewrite it in behavioural or dispositional terms (what they clicked, what they'd likely do next time, what made them hesitate), or dump the claim entirely because it's doing no work a video clip wouldn't do better.

  A few things it has to handle, because they come up constantly:

  1. Claims where the mental vocabulary is genuinely earning its keep -- e.g. a finding that's really about expectation violation or surprise -- versus claims where "believed" just means "clicked without complaining". Your procedure needs to tell them apart.
  2. The claims clients LOVE, like "users find the brand trustworthy", which are unfalsifiable mush but keep everyone happy. I suspect the procedure should strike these out, and honestly part of why I'm asking is that I want cover for doing that. But be upfront if you think the procedure is being too harsh there.
  3. Cases where the analyst's interpretation of a mental state was doing real interpretive work -- the analyst actually inferred something from hesitation, tone, what participants laughed at -- and flattening it to behaviour would lose it. Where does the procedure hand it back to a human because the question is judgement, not fact?

  Then run the procedure on three claims from an actual recent draft: (a) "Users believe the checkout is secure because they completed the purchase without hesitation", (b) "Participants wanted more control over notification settings" (they did -- 9 of 12 said so unprompted in interviews), and (c) "Customers trust our brand" (based on... vibes, honestly, and one participant who said "yeah I guess").

  Also tell me where this procedure will misfire or get gamed -- analysts will learn to write claims that survive whatever checklist you give them, so what does it distort? And say plainly what the procedure can't do: I'm aware that a 15-minute checklist won't settle whether beliefs exist. I just want to know if that matters for the practical question. I don't want citations or a reading list, just the procedure and the worked examples.

  One more thing: it's got to be one page, because if it's longer nobody will use it. If you have to cut philosophy to fit, tell me what you cut and why it was safe to cut it.
reasoning: |-
  We are creating a procedure for evaluating claims in UX research reports to avoid unjustified mind-reading. The procedure will be a checklist with questions and actions. It should take 10-15 minutes per claim and fit on one page.

  Key goals:
  - Distinguish between claims that genuinely require mental state vocabulary and those that are just dressing up behavior.
  - Handle cases where mental state claims are unfalsifiable and popular with clients but not rigorous.
  - Preserve valuable interpretations that come from behavioral cues (hesitation, tone, etc.) without overstepping.

  Procedure: "Mental State Claim Evaluation Checklist"

  For each claim in the draft report:

  Step 1: Identify the mental state term(s) 
     - Circle every word that refers to an internal state (e.g., believe, want, trust, feel, think, desire, expect, etc.).

  Step 2: Ask: "What observable behavior or explicit verbal report is this claim based on?"
     - Write down the specific data (e.g., "user clicked the padlock icon", "user said 'I think it's secure'", "9/12 said in interviews they want more control", "user hesitated for 5 seconds before clicking").
     - If there is no observable behavior or explicit verbal report, mark as "No Basis" and go to Step 5.

  Step 3: Ask: "Is the mental state term necessary to convey the actionable insight, or could it be replaced by describing the behavior/disposition without loss?"
     - Consider: 
          a) If the claim is about an expectation violation (e.g., surprise when something unexpected happens), then mental state might be necessary because the behavior only makes sense in light of the expectation. 
          b) If the claim is about a future behavior (e.g., what they would do) or a disposition (e.g., what they are inclined to do), then use dispositional language.
          c) If the mental state term is just a flourish and the behavior alone is the insight, then rewrite behaviorally.
     - If the mental state term is necessary and the basis is strong (explicit verbal report or clear behavioral evidence), then keep as-is. Otherwise, proceed to Step 4.

  Step 4: Rewrite options:
     - If the claim is based on explicit verbal report (e.g., user said "I believe X"), then rewrite to attribute the statement: "Participants stated that they believe the checkout is secure" (but note: this is still a report of what they said, not an independent fact about their belief). However, for claims like "wanted more control" when they said so, we can use: "Participants expressed a desire for more control over notification settings."
     - If the claim is based on behavior only, rewrite to describe the behavior and its implications without mental states. For example:
          - Instead of "users believe the checkout is secure", say: "Users completed the purchase without checking security indicators or expressing concerns."
          - Instead of "customers trust our brand", say: "No participants questioned the credibility of the brand during the study, and one explicitly mentioned the reviews as a positive factor."
     - If the claim is vague and based on weak evidence (e.g., "vibes"), consider dropping it or replacing it with specific observations.

  Step 5: Decision tree:
     - If no basis (from Step 2): Dump the claim or replace with the actual observation if available (if not, dump).
     - If based on explicit verbal report (and the mental state term is necessary): Keep, but consider rewording to attribute to the participant (e.g., "Participants reported that...") to show it's self-reported.
     - If based on behavior and mental state term is necessary (e.g., expectation violation): Keep with mental state, but add the behavioral evidence in parentheses for support.
     - If based on behavior and mental state term is not necessary: Rewrite in behavioral/dispositional terms.
     - If the claim is unfalsifiable mush (e.g., "trust the brand" with no clear evidence): Rewrite to reflect the evidence or dump. Specifically, if the only evidence is vague and the claim is too broad, it's better to drop it and use a video clip that shows positive engagement if that's the point.

  Step 6: For claims that require human judgment (e.g., interpreting hesitation, tone, laughter):
     - If the claim is based on such cues, then the analyst must note the specific cue and its context. Then ask: "Is there a less mentalistic way to convey the same insight without losing the nuance?" 
          Example: Instead of "user was confused", say "user paused for 10 seconds, scrolled up and down, and then asked 'what does this mean?'".
     - If the nuance would be lost without the mental state term, then keep it but add the behavioral cue as support. However, note that this is an inference and should be worded cautiously (e.g., "Some participants appeared confused, as indicated by long pauses and repeated scrolling").

  Summary of Actions:
     - Keep as-is: Only when mental state is necessary and well-supported by explicit report or clear behavioral evidence (like expectation violation).
     - Rewrite: In behavioral/dispositional terms when possible.
     - Dump: When there's no evidence or the claim is too vague to be useful.

  Now, apply to the three examples:

  Example (a): "Users believe the checkout is secure because they completed the purchase without hesitation."

  Step 1: Circle "believe".
  Step 2: Observable behavior: completed purchase without hesitation.
  Step 3: Is "believe" necessary? No. The behavior (completing without hesitation) does not necessarily indicate belief in security. They might not care, or they might be in a hurry. So rewrite behaviorally.
  Step 4: Rewrite: "Users completed the purchase without hesitating or checking security features."
  Step 5: Action: Rewrite in behavioral terms.

  Example (b): "Participants wanted more control over notification settings" (9 of 12 said so unprompted in interviews).

  Step 1: Circle "wanted".
  Step 2: Explicit verbal report: 9 of 12 participants said they want more control.
  Step 3: Mental state term "wanted" is necessary? Actually, we have direct quotes. We can rephrase to reflect that it's self-reported. But note: "want" is a mental state, but we are reporting what they said.
  Step 4: Rewrite option: "9 out of 12 participants explicitly stated that they want more control over notification settings." This is acceptable because it's attributed. Alternatively, we can say: "Participants expressed a desire for more control..."
  Step 5: Action: Keep, but reword to attribute to participants (so it's clear it's self-reported).

  Example (c): "Customers trust our brand" (based on vibes and one participant who said "yeah I guess").

  Step 1: Circle "trust".
  Step 2: Observable behavior: vague ("vibes") and one participant said "yeah I guess" (which is weak and non-committal).
  Step 3: The term "trust" is too strong and not well-supported. It's also vague. We don't have clear evidence.
  Step 4: Rewrite: If we must, we can say: "One participant indicated they might trust the brand, but overall evidence for brand trust was limited." However, note that one weak comment is not a finding. Alternatively, if the vibe is from positive engagement, describe that behavior: "Participants did not express distrust, and one participant tentatively agreed with a positive statement about the brand."
  Step 5: Action: Since the evidence is weak, we should either dump the claim or rewrite it very cautiously to reflect the limited evidence. Given the client loves these, we might keep a very watered-down version but note the limitations. However, the procedure should push to dump or heavily qualify.

  But note: The procedure is about rigor. We might decide to dump because it's not a robust finding.

  Where the procedure will misfire or get gamed:
  - Analysts might learn to always use explicit verbal reports as a basis, even if they are leading questions or taken out of context. So we must emphasize that explicit verbal reports must be unprompted or in response to non-leading questions.
  - They might over-interpret behavior to fit the "expectation violation" category to justify mental state terms.
  - They might use weasel words like "appeared" or "seemed" to make inferences seem more cautious, but these can still be unfounded.

  What the procedure can't do:
  - It won't eliminate all inferential leaps. Some level of inference is necessary in UX research, but this procedure aims to make it explicit and evidence-based.
  - It doesn't solve the problem of whether mental states exist; it just forces claims to be grounded in observable evidence.

  One-page constraint:
  We cut the philosophical justification and focused on the practical steps. We also avoided deep discussion of neuroscience. The procedure is designed to be a pragmatic tool.

  Final Procedure (One-Page Format):

  **Mental State Claim Evaluation Checklist**

  For each claim with mental state terms (e.g., believe, want, trust):

  1. **Identify Mental Terms**: Circle all mental state words.

  2. **Basis Check**: 
     - What observable behavior or explicit verbal report supports this? (Be specific: e.g., "8/10 clicked X", "user said 'I think...'", "hesitation of 5s".)
     - If none: → Action: Dump or replace with actual observation.

  3. **Necessity Check**:
     - Is the mental term necessary? 
       - YES, if: 
          a) It's about expectation violation (behavior only makes sense with the mental state) OR 
          b) It's a direct quote (then attribute it).
       - NO, if the behavior alone suffices (e.g., clicking without hesitation doesn't require "believe").
     - If not necessary, rewrite behaviorally.

  4. **Rewrite or Keep**:
     - Based on explicit verbal report? → Rewrite to attribute: "Participants stated that they [mental term]..."
     - Based on behavior? → Rewrite to describe behavior and its implications without mental terms (e.g., "completed without hesitation").
     - Vague or weak evidence? → Dump or qualify heavily.

  5. **Special Cases**:
     - For nuanced interpretations (hesitation, tone): Note the specific cue and context. If possible, describe the behavior. If the nuance would be lost, keep the mental term but add support and use cautious language (e.g., "appeared confused").

  6. **Final Decision**:
     - Keep only if: 
          a) Well-supported by explicit report (and attributed) OR 
          b) Necessary for expectation violation with clear behavioral evidence.
     - Otherwise, rewrite or dump.

  **Worked Examples**:

  (a) Original: "Users believe the checkout is secure because they completed the purchase without hesitation."
     - Step 1: "believe"
     - Step 2: Behavior: completed without hesitation.
     - Step 3: Not necessary. Rewrite.
     - Step 4: Rewrite: "Users completed the purchase without hesitation or checking security features."
     - Step 6: Action: Rewritten.

  (b) Original: "Participants wanted more control over notification settings."
     - Step 1: "wanted"
     - Step 2: Explicit verbal: 9/12 said so unprompted.
     - Step 3: Necessary? We can attribute.
     - Step 4: Rewrite: "9 out of 12 participants stated they want more control over notification settings."
     - Step 6: Action: Keep, reworded to attribute.

  (c) Original: "Customers trust our brand."
     - Step 1: "trust"
     - Step 2: Vague vibes; one said "yeah I guess".
     - Step 3: Weak evidence. Not necessary.
     - Step 4: Qualify: "One participant tentatively agreed with a statement about trusting the brand, but overall evidence was limited." OR Dump.
     - Step 6: Action: Dump or rewrite as a weak, qualified statement (but dumping is better for rigor).

  **Caveats**:
  - This procedure may be gamed by using leading questions to get explicit verbal reports or by overusing "expectation violation". Train analysts on good interviewing.
  - It cannot eliminate all inference but makes it more disciplined.
  - It may lead to drier reports, but they will be more defensible.
answer: |-
  ### Mental State Claim Evaluation Checklist  
  **Purpose:** Replace unjustified mind-reading with evidence-based claims. Time: 10-15 min per claim.  
  **Instructions:** For each claim, follow Steps 1-5. Use answers to decide: **Keep** (as-is), **Rewrite** (behavioral/dispositional), or **Dump**.  

  ---

  #### **Step 1: Identify the Mental Jargon**  
  *Ask: What mental state word is used? (e.g., "believe," "want," "trust")*  
  - **Action:** Circle the word. If none, stop—claim is safe.  
  - **Why:** Isolates the problem.  

  #### **Step 2: Trace to Evidence**  
  *Ask: What specific, observable behavior or explicit statement supports this? (e.g., "user clicked X," "said, 'I need control,'" "hesitated for 10 seconds")*  
  - **Sufficient answer:** Concrete, verbatim, or timed data. Weak: "Vibes," "seemed like."  
  - **Action:**  
    - No evidence → **Dump**.  
    - Evidence exists → Proceed to Step 3.  

  #### **Step 3: Test Necessity**  
  *Ask: Is the mental word necessary to explain the consequence or insight?*  
  - **Check for:**  
    - **Expectation violation** (e.g., surprise when something unexpected happens—mental state explains *why* behavior matters).  
    - **Disposition** (e.g., "likely to do X next time"—predicts future action without mind-reading).  
  - **Action:**  
    - Necessary (e.g., expectation violation) → **Keep** but add evidence (e.g., "Participants paused, gasped, then said, ‘I didn’t expect this’").  
    - Not necessary (e.g., "believe" = clicked without complaining) → **Rewrite** (see Step 4).  

  #### **Step 4: Rewrite or Dump**  
  *Ask: Can we describe what happened or what it implies without mental words?*  
  - **Rewrite rules:**  
    - **Behavioral:** Describe actions (e.g., "clicked," "scrolled away," "completed in <5s").  
    - **Dispositional:** Describe inclinations (e.g., "likely to skip next time," "would pay if...").  
    - **Explicit quotes:** Use only if verbatim (e.g., "Participant said, ‘I trust it’").  
  - **Action:**  
    - Rewritten claim is clearer → **Rewrite**.  
    - Claim is vague, circular, or adds nothing → **Dump** (use video clip instead).  

  #### **Step 5: Judgment Call**  
  *Ask: Does this rely on nuanced human interpretation? (e.g., tone, hesitation, laughter)*  
  - **Action:**  
    - Yes → **Keep** but add: (1) specific cue (e.g., "5s pause"), (2) context (e.g., "after error message"), and (3) caution (e.g., "appeared frustrated").  
    - No → Finalize from Steps 1-4.  

  ---

  ### **Worked Examples**  
  *(Using your recent draft claims)*  

  1. **Claim (a):** "Users believe the checkout is secure because they completed the purchase without hesitation."  
     - **Step 1:** "Believe" (circle).  
     - **Step 2:** Evidence = "completed without hesitation."  
     - **Step 3:** Not necessary. "Believe" ≠ "completed." No expectation violation (e.g., no gasps or comments).  
     - **Step 4:** Rewrite → **"Users completed the purchase without hesitating or checking security features."**  
     - **Step 5:** No nuanced judgment.  
     - **Final Decision:** **Rewrite.**  

  2. **Claim (b):** "Participants wanted more control over notification settings."  
     - **Step 1:** "Wanted" (circle).  
     - **Step 2:** Evidence = "9/12 said so unprompted." Strong.  
     - **Step 3:** Necessary? No—explicit quotes suffice without "wanted."  
     - **Step 4:** Rewrite → **"9 of 12 participants explicitly requested more control over notification settings."** (Dispositional: "would adjust settings if available" also works.)  
     - **Step 5:** No judgment needed.  
     - **Final Decision:** **Rewrite.**  

  3. **Claim (c):** "Customers trust our brand."  
     - **Step 1:** "Trust" (circle).  
     - **Step 2:** Evidence = "vibes" + one "yeah I guess." Weak/unfalsifiable.  
     - **Step 3:** Not necessary. No consequence (e.g., didn’t buy more).  
     - **Step 4:** Can’t rewrite robustly. "One participant said, ‘yeah I guess’ when asked about trust" adds nothing.  
     - **Step 5:** "Vibes" are judgment, but no specific cue (e.g., no laughter or tone noted).  
     - **Final Decision:** **Dump.** (Use a video clip showing positive reactions instead.)  

  ---

  ### **Where This Misfires or Gets Gamed**  
  - **Misfires:**  
    - May over-reject valid nuanced claims (e.g., subtle frustration) if analysts skip Step 5.  
    - Clients may protest when you dump "trust"-style claims—stand firm; they’re unscientific.  
  - **Gamed:**  
    - Analysts may inflate evidence (e.g., label all pauses "hesitation") or overuse "expectation violation" to justify mental words.  
    - Rewritten claims may become overly dry; remind them to retain impact (e.g., "would do X" instead of "did X").  

  ### **What the Procedure Can’t Do**  
  - Doesn’t settle philosophical debates (e.g., "Do beliefs exist?").  
  - Can’t replace expert judgment for complex inferences (e.g., cultural context in tone).  
  - Won’t fix poorly conducted research (e.g., leading questions that taint "explicit statements").  

  **Why the Philosophy Was Cut:**  
  - Neuroscience debates don’t impact the *practical* goal: grounding claims in evidence. The procedure focuses on observable data, which is sufficient for UX rigor.  

  ---  
  **Print this one-pager. Train your team: "If you can’t point to it, don’t claim it."**
