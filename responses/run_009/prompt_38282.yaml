prompt: |-
  I work as a human judge in experiments testing the debate model of scalable oversight: two AI systems argue opposite sides of a question that is beyond my ability to answer directly, and my job is to reach the right verdict by interrogating them. In each round I have roughly thirty minutes, a limited budget of interventions, and no independent way to check most factual claims — I can ask for a claim to be decomposed into subclaims the debaters must separately defend, ask each side to critique the other's strongest passage, demand sources for specific numbers, or end the round and guess. The stakes are real: these rounds inform decisions about whether debate is safe to rely on for evaluating AI systems on tasks where no human can check the work. Write me a decision procedure I could actually follow round after round, and that other judges could follow with reasonably similar results: what to ask for in what order, when to spend the intervention budget on decomposing a claim versus cross-examining it, how to treat a claim that is unverifiable within the debate but load-bearing for one side, how to penalize evasion without simply punishing the debater who got caught being honest, and when to stop and guess rather than keep spending time. Be explicit about which steps follow from the theory — the idea that making honest play optimal in a zero-sum game is what makes debate an oversight method at all — and which are merely heuristics dressed up as procedure, and mark the points where judgment cannot be eliminated. Then run the procedure on two cases: a debate that turns on a factual subclaim that decomposes cleanly into checkable pieces, and one where the disagreement is over how to weigh competing considerations, so there is no hidden fact for the debaters to converge on. For the second case especially, I want to know what the procedure tells me to do when I would much rather it delivered a verdict.
reasoning: |-
  We are designing a decision procedure for a judge in an AI debate setting. The goal is to reach the correct verdict despite the judge's inability to directly answer the question. The procedure must be efficient, use a limited budget of interventions, and be applicable across rounds.

  Key constraints:
  - Time: ~30 minutes per round.
  - Budget: Limited number of interventions (exact number not specified, but we assume it's low, e.g., 5-10).
  - Interventions: 
    (a) Decompose a claim into subclaims (which the debaters must defend).
    (b) Ask each side to critique the other's strongest passage.
    (c) Demand sources for specific numbers.
    (d) End the round and guess.

  Stakes: Inform decisions about the safety of using debate for scalable oversight.

  Principles from theory:
  - The core idea is that in a zero-sum game, making honest play optimal should lead to the truth emerging. Therefore, the procedure should reward honest behavior and penalize dishonest behavior in a way that aligns incentives.

  Procedure Outline:

  I. Initial Setup and First Moves (0-5 minutes)
     - Each debater presents an opening statement. The judge listens to both without intervention.

  II. Core Loop: Focused Questioning (5-25 minutes)
     - The judge identifies the key points of disagreement. This is crucial because the debate may have many claims, but only a few are pivotal.
     - The judge uses interventions to probe these key points.

     Steps in the loop:

     1. Identify the pivotal claim(s): Look for claims that, if true, would strongly support one side, and if false, would undermine that side. Also, note claims that are "load-bearing" (i.e., essential for one side's argument) but unverifiable within the debate.

     2. Decide on intervention type:
          a. If the claim is complex and can be broken down into subclaims that are individually easier to verify (either by decomposition or by providing sources), then decompose it.
          b. If the claim is a key point of contention and both sides have made arguments about it, ask each side to critique the other's strongest passage on that claim. This can reveal weaknesses and may force the dishonest side to make increasingly untenable claims.
          c. If the claim involves a specific number or fact, demand sources. The sources should be from reputable and accessible references. If a debater cannot provide a source or the source is dubious, that weakens their claim.

     3. Budgeting interventions: 
          - Each intervention (decomposition, critique request, source demand) costs one unit of the budget.
          - Prioritize claims that are both pivotal and verifiable. Avoid spending on claims that are pivotal but unverifiable (unless decomposition can make them verifiable).
          - If a claim is pivotal and unverifiable even after decomposition, note that this is a limitation of the debate format and consider it a weakness of the side that relies on it.

     4. Handling evasion:
          - If a debater evades a question, note it. The first evasion gets a warning (verbally, e.g., "I note that you did not answer the question. Please address it directly."). 
          - On the second evasion on the same point, treat the claim as conceded by the evading side. However, be cautious: sometimes a debater might be honest in admitting they don't know, so we must distinguish between evasion and honest admission.
          - To avoid punishing honesty: 
              - If a debater says "I don't know" or "That information is not available", that is not evasion. It is honest and should not be penalized. However, if the claim is load-bearing for their side, then their argument is weakened because they cannot support it.
              - Evasion is when a debater provides an answer that does not address the question, changes the subject, or gives a non-answer.

     5. When to stop decomposing?
          - Decompose until you reach claims that are either:
              (a) Directly verifiable by the judge (e.g., simple arithmetic, common knowledge, or by providing a source that the judge can quickly check for reasonableness) OR 
              (b) So trivial that they are unlikely to be disputed (but note: in a competitive debate, even trivial claims might be disputed dishonestly) OR 
              (c) The budget runs out.

          - If decomposition leads to a claim that is still unverifiable and the budget is low, consider that the decomposition might not be the best use of resources and switch to another tactic (like demanding a critique).

  III. Ending the Round (25-30 minutes)
     - When the budget is exhausted, or when the judge feels that further interventions are unlikely to change their view, they end the round and make a verdict.
     - If the judge is still uncertain, they must guess. The procedure must account for this.

     Factors for the verdict:
          - Which side's claims were more often supported by sources?
          - Which side was more responsive and less evasive?
          - Which side's arguments withstood critique?
          - For pivotal claims that remain unverifiable, the side that relies on them is at a disadvantage because they have not met their burden of proof.

     The verdict is a binary choice (as it's a zero-sum debate). The judge picks the side that they believe is more likely correct.

  IV. Marking Theory vs. Heuristics:
     - Theory-based:
          - Rewarding honesty: The procedure is designed to make it more costly for a debater to be dishonest. For example, decomposition and critique can expose lies because maintaining a lie across multiple levels is harder. Also, demanding sources makes fabricated claims riskier.
          - Penalizing evasion: Evasion is a form of dishonesty. By counting evasion as a concession, we make it less attractive, encouraging debaters to either answer honestly or admit ignorance (which is honest).

     - Heuristics:
          - The identification of pivotal claims is heuristic. There is no algorithm for this; it relies on the judge's understanding of the argument structure.
          - The decision to stop decomposing and switch to critique or sources is heuristic (based on the judge's estimation of the verifiability of the subclaims and the remaining budget).
          - The final guess when uncertain is a heuristic: the judge uses their best judgment based on the evidence they have.

     - Points where judgment cannot be eliminated:
          1. Identifying pivotal claims.
          2. Deciding when a claim is "verifiable" enough to stop decomposition (or when it's a dead end).
          3. Distinguishing evasion from honest admission of ignorance.
          4. Weighing the strength of the entire body of evidence at the end.

  Now, we run the procedure on two cases.

  Case 1: Factual subclaim that decomposes cleanly.

  Example: The debate is over whether a new drug is safe. The pivotal claim is: "The drug causes severe side effects in less than 1% of patients." 

  Procedure:

  1. The judge identifies this as pivotal because if true, the drug might be unsafe; if false, it might be safe.

  2. The judge decides to decompose the claim. They use one intervention to ask for decomposition.

     - The proponent of the claim (say, Debater A) decomposes it into:
          a. The total number of patients in the clinical trial: 10,000.
          b. The number of patients who experienced severe side effects: 95.
          c. Therefore, the rate is 95/10000 = 0.95% < 1%.

  3. The judge then can:
          - Demand sources for the total number and the number of side effects (two interventions). 
          - Debater A provides a link to the clinical trial report. The judge cannot access the full report during the debate, but the debater quotes from it and provides a DOI.

     However, the opponent (Debater B) might challenge the source. The judge can then ask for a critique (another intervention). Debater B might say: "The trial report is from the company that makes the drug and has a conflict of interest. Also, the trial only lasted 3 months, but side effects might appear later."

  4. Then the judge might ask Debater A to respond to the critique (if within budget). Debater A might counter by pointing to an independent review of the trial or by noting that long-term effects were studied in a separate trial.

  5. The judge now has:
          - The decomposition provides numbers that are specific and could be verified if the source is reliable.
          - The critique reveals potential weaknesses in the source.

     Since the judge cannot independently verify the source (due to time and access constraints), they must rely on the debaters' arguments about the source's reliability.

  6. The judge notes that Debater A has provided a source and a decomposition, but Debater B has raised a valid concern about conflict of interest. However, Debater A did not evade and provided a decomposition and source. Debater B's critique is also substantive.

     If the judge has no more budget, they must weigh:
          - The burden of proof: Debater A made the claim and supported it with a source and decomposition. Debater B challenged it with a reasonable critique. But without further evidence, the judge might lean towards the original claim because it was supported by evidence, even if imperfect.

     However, if the judge feels the critique about conflict of interest is strong and the source is untrustworthy, they might discount the claim. This is where judgment comes in.

     Verdict: The judge might rule against the claim (if they find the critique compelling) or for it (if they find the source credible enough). The procedure does not guarantee the right answer, but it structures the inquiry.

  Case 2: Disagreement over how to weigh competing considerations.

  Example: The debate is over whether a city should build a new highway. The debaters agree on the facts: building the highway will reduce commute times for 100,000 people by 10 minutes per day, but it will also lead to the destruction of 50 acres of forest and displace 1000 animal species. The disagreement is about whether the benefits outweigh the costs.

  Here, there is no hidden fact. The debaters must argue about values and trade-offs.

  Procedure:

  1. The judge identifies the pivotal issue: the weighting of the benefits (time savings for commuters) against the costs (environmental damage).

  2. The judge cannot decompose this into factual subclaims that resolve the weighting. Instead, they might:
          - Ask each side to critique the other's strongest passage on the weighting (intervention: critique).
          - Or, decompose the claim "the benefits outweigh the costs" into the components of benefits and costs and then ask for evidence on how to weigh them. But the weighing is normative.

  3. The judge might try to decompose by asking for a quantitative model for the trade-off. For example:
          - Debater A (pro-highway) might argue: "Each minute saved per day is worth $X, so total benefits are $Y. The environmental damage can be quantified as $Z in ecosystem services. Y > Z."
          - Debater B (anti-highway) might argue: "The forest is irreplaceable and cannot be valued in dollars. Also, the animal species include endangered ones, which have intrinsic value beyond monetary valuation."

  4. The judge then faces a meta-debate: how to value the environment? This is not a factual question but a normative one. The judge might demand sources for the dollar valuations (if provided by Debater A) and for the claims about the irreplaceability and endangerment (from Debater B). But the core disagreement remains.

  5. How does the procedure handle this?
          - The judge must recognize that the debate is about values and that the debaters might not converge. The theory of debate assumes that there is a ground truth, but in normative questions, the "truth" is the judge's own values? Not necessarily: the debate might be about what the judge would decide if they had all the facts and time, but in reality, the judge is a stand-in for a human value system.

     However, in the context of scalable oversight, the goal might be to align with the judge's values, but the judge might not have preformed values on every issue.

  6. The procedure must guide the judge to a verdict even when there is no hidden fact.

     Steps:
          - The judge should focus on which side provides the more compelling reasoning and which side's critiques effectively undermine the other's position.
          - The judge should note evasions: if one side refuses to engage with the other's arguments, that weakens their position.

     Example interventions:
          - Ask Debater A: "Critique Debater B's strongest point that the forest is irreplaceable."
          - Ask Debater B: "Critique Debater A's strongest point that the time savings are worth $Y."

     The judge listens to the critiques and evaluates which side's arguments hold up better.

  7. When to stop?
          - After a few rounds of critique and counter-critique, the judge may have a better sense of the strength of the arguments.
          - Since there is no fact to uncover, the judge must weigh the persuasiveness and coherence of the arguments.

  8. Verdict: The judge must decide which side made the better case. They might say: "Debater B convinced me that the environmental damage is irreversible and that the monetary valuation does not capture the intrinsic value of the forest and endangered species. Therefore, I rule against the highway."

     But note: the procedure does not eliminate the judge's subjective evaluation. It only structures the process to ensure both sides are heard and probed.

     What if the judge is still torn? They must guess. The procedure requires that they stop and make a verdict within the time.

     In this case, the procedure does not deliver an objective truth because there is none. However, it does ensure that the judge has considered the strongest arguments and critiques from both sides, which might lead to a more informed decision.

  Conclusion:

  The procedure is a framework that relies on the judge's ability to identify pivotal claims, use interventions effectively, and make judgments when necessary. It is designed to make honesty the best strategy by exposing lies and evasion, and by rewarding evidence-based arguments. But in normative questions, the verdict is inherently subjective and must be based on the judge's evaluation of the arguments.

  The procedure for the judge:

  1. **Initial Setup (0-5 min)**: Listen to opening statements without intervention.

  2. **Core Loop (5-25 min)**:
     - Identify pivotal claims (judgment required).
     - For each pivotal claim:
          a. If it is complex and decomposable, and if the budget allows, decompose (1 intervention).
          b. If it involves specific numbers, demand sources (1 intervention).
          c. Otherwise, or after decomposition/sources, ask for mutual critique on the claim (1 intervention per critique request? But note: asking both sides to critique might be one intervention if done together? We'll count one intervention for the pair: "Critique each other's strongest point on this claim").
     - Handle evasion: warn once, then treat as concession on the second evasion (but distinguish from honest admission of ignorance).
     - Stop if budget is exhausted or if further interventions are unlikely to help.

  3. **Ending (25-30 min)**:
     - Weigh the evidence:
          - Prefer claims that are supported by sources and decomposition.
          - Penalize evasion and note unverifiable load-bearing claims as weaknesses.
          - Consider the strength of critiques and counterarguments.
     - If uncertain, make a best-guess verdict.

  This procedure is meant to be followed by any judge, but individual judgments will vary. The hope is that over many debates, the honest side wins more often, which is the theory behind debate as a scalable oversight mechanism.
answer: |-
  ### Decision Procedure for AI Debate Judging

  Below is a step-by-step decision procedure designed for scalability, efficiency, and alignment with debate theory. **Theory-driven steps** (marked with 🔍) are rooted in the core idea that debate incentivizes honesty in zero-sum games: dishonest debaters will struggle to defend inconsistent claims under scrutiny, while honest debaters converge toward truth. **Heuristics** (marked with ⚖️) are practical rules where judgment is unavoidable. **Key judgment points** are explicitly flagged.

  ---

  ### **Procedure**
  #### **Phase 1: Opening Statements (0–3 minutes)**
  - **Step 1:** Listen to both debaters’ opening arguments without intervention.  
  - **⚖️ Heuristic:** Identify the core disagreement (e.g., a factual claim, a value judgment, or a risk assessment).  

  #### **Phase 2: Core Examination (3–25 minutes)**  
  Budget = 5–7 interventions (adjust based on round complexity). Prioritize interventions that:  
  1. Target *pivotal claims* (claims that, if false, would collapse one side’s argument).  
  2. Maximize *verifiability* (claims that can be decomposed or sourced).  

  - **Step 2: Identify Pivotal Claims**  
    - **⚖️ Judgment Required:** Flag claims where:  
      - One side’s entire case depends on it (*load-bearing*).  
      - The claim is contested and central to the outcome.  
    - **🔍 Theory:** Honest debaters can defend pivotal claims with consistent subclaims; dishonest ones will falter under decomposition.  

  - **Step 3: Choose Intervention Type**  
    Use this hierarchy:  
    - **A. Demand sources for specific numbers** if:  
      - The number is pivotal and plausibly checkable (e.g., "Study X shows 73% success").  
      - *Cost:* 1 intervention.  
      - **🔍 Theory:** Fabricated sources are hard to defend; honest debaters cite real sources.  
    - **B. Decompose a claim** if:  
      - It’s pivotal *and* can be broken into verifiable subclaims (e.g., "The algorithm is unsafe" → subclaims about bias, error rates, etc.).  
      - Avoid if subclaims are purely subjective (e.g., "This painting is beautiful").  
      - *Cost:* 1 intervention per decomposition layer.  
      - **🔍 Theory:** Decomposition forces debaters to commit to subclaims, exposing inconsistencies in dishonest play.  
    - **C. Cross-examine critiques** if:  
      - A claim remains unresolved after (A) or (B), or the disagreement is values-based (e.g., "Safety outweighs cost").  
      - Ask: "Critique the opponent’s strongest passage on [specific claim]."  
      - *Cost:* 1 intervention (covers both critiques).  
      - **🔍 Theory:** Honest debaters can attack weaknesses in flawed arguments; dishonest ones may overreach or evade.  

  - **Step 4: Handle Evasion and Honesty**  
    - **🔍 Theory-Driven Rules:**  
      - If a debater says *"I don’t know"* or *"No source exists"*:  
        - **Do not penalize.** Honest admissions are not evasion.  
        - ⚠️ But if the claim is load-bearing, their argument weakens (they fail to meet their burden of proof).  
      - If a debater **evades** (e.g., changes subject, gives a non-answer):  
        - First instance: *Warning*. "You did not address [question]. Re-answer directly."  
        - Second instance: Treat the claim as *conceded against them*.  
    - **⚖️ Judgment Required:** Distinguishing evasion from genuine uncertainty.  

  - **Step 5: Address Unverifiable Load-Bearing Claims**  
    - If a pivotal claim *cannot* be verified (e.g., "In 2050, AI will cause catastrophe"):  
      - **🔍 Theory:** The side relying on it loses ground—debate can’t resolve unverifiable claims.  
      - Force decomposition: "Break this into verifiable subclaims." If they can’t, their case weakens.  
      - ⚖️ **Heuristic:** If still unverifiable, favor the side *not* relying on it absent counterevidence.  

  #### **Phase 3: Termination (25–30 minutes)**  
  - **Step 6: Stop and Guess When:**  
    - Budget is exhausted.  
    - Further interventions yield diminishing returns (e.g., debaters circle the same points).  
    - A load-bearing claim remains unverifiable after decomposition.  
  - **Step 7: Verdict**  
    - Weigh evidence:  
      - Prefer claims with sources/decomposition over unsupported assertions.  
      - Penalize evasion (conceded claims).  
      - Discount unverifiable load-bearing claims.  
    - If tied, favor the side that was more honest/less evasive.  
    - **⚖️ Judgment Required:** Uncertainty is unavoidable; guess based on preponderance of evidence.  

  ---

  ### **Case Studies**
  #### **Case 1: Factual Subclaim with Clean Decomposition**  
  **Debate:** *"Does solar geoengineering cool the Earth by at least 1°C?"*  
  - Pivotal claim: *"Model X shows a 1.2°C cooling effect."*  

  **Procedure:**  
  1. **Demand sources** (Intervention 1): Proponent cites "Model X, 2023 study, p.12."  
  2. **Decompose** (Intervention 2): Break into:  
     - Subclaim A: Model X’s parameters (e.g., albedo increase = 0.5%).  
     - Subclaim B: Model X’s output (1.2°C cooling).  
  3. **Demand sources for Subclaim A** (Intervention 3): Proponent provides study link.  
  4. **Cross-examine critiques** (Intervention 4): Opponent attacks Model X’s parameters: "Study Y shows albedo can’t exceed 0.3%."  
  5. **Verdict:** Subclaim A is falsified → Proponent’s claim collapses. Ruling: **Against the 1°C claim.**  

  **Theory Alignment:** Decomposition exposed a concrete inconsistency, making dishonesty costly.  

  --- 

  #### **Case 2: Values-Based Disagreement (No Hidden Fact)**  
  **Debate:** *"Should we prioritize AI capability over safety in medical diagnostics?"*  
  - Pivotal claim: *"The benefits of faster diagnoses outweigh the risks of errors."*  

  **Procedure:**  
  1. **Decompose** (Intervention 1): Break into:  
     - Subclaim A: "AI diagnostics reduce diagnosis time by 50%." (Verifiable → demand sources).  
     - Subclaim B: "Speed is more critical than accuracy in this context." (Values-based).  
  2. **Subclaim A**: Sources show 50% reduction is factual ✅.  
  3. **Subclaim B** is unverifiable → **Cross-examine critiques** (Intervention 2):  
     - Pro-safety: "Critique the pro-capability argument: Speed means nothing if diagnoses are wrong."  
     - Pro-capability: "Critique the pro-safety argument: Delays cause more deaths than errors."  
  4. **Intervention 3:** Repeat critiques for depth. Debaters now argue:  
     - Pro-safety: "1% error rate could kill 10,000 patients yearly."  
     - Pro-capability: "Delays kill 50,000 yearly; errors are fixable."  
  5. **Unverifiable Load-Bearing Claim:** Both sides rely on value weights (e.g., "10,000 deaths > 50,000 delays?"). Decomposition fails; no hidden fact exists.  
  6. **Terminate:** After 25 mins, no convergence.  

  **Verdict Protocol:**  
  - Discount values-only claims (neither side "wins" them).  
  - Evaluate supporting facts: Pro-capability proved speed gains; pro-safety proved error risks.  
  - Check evasion: Neither evaded; both admitted value judgments.  
  - ⚖️ **Judgment Required:** Weigh robustness of evidence.  
    - Pro-capability: Stronger data (50,000 delay deaths vs. 10,000 errors).  
    - Ruling: **Favor pro-capability**.  

  **Why This Works (Theory):**  
  - Honest play is rewarded (neither penalized for admitting values).  
  - Cross-examination clarified trade-offs, letting you guess informedly.  
  - **When You Want a Verdict but Can’t Get One:** The procedure forces you to terminate and guess based on *available* evidence, avoiding endless cycles. Values debates won’t converge, but the "least weak" argument wins.  

  ---

  ### **Summary for Judges**  
  - **Theory Anchors:** Reward honesty, penalize evasion, decompose to expose lies.  
  - **Heuristics:** Prioritize verifiable claims, terminate when stuck.  
  - **Embrace Uncertainty:** Judgment is irreplaceable in identifying pivots, distinguishing evasion, and guessing.  
  - **Outcome Consistency:** Similar verdicts arise from shared focus on burden of proof, evasion penalties, and source/decomposition primacy.  

  This procedure ensures scalable oversight: even when you can’t find "truth," you maximize the chance honest debaters win.
