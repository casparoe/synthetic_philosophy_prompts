  Now, for the residue report. Clean mappings: loss function as fitness instead of truth, no identification of the moral parameter, potential bias, and no independent test data. These are straightforward. The bending occurs with terms like "moral truth" as a parameter—it's not clearly defined like in statistics. Also, the third factor explanation resembles confounding, but philosophers debate its plausibility without empirical evidence, which is more conceptual.

