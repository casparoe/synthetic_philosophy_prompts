  First, I need to recall the evolutionary debunking argument. It claims that natural selection shaped our moral beliefs for reproductive fitness, not for tracking moral truths. So, using statistical language, the estimator is the process that generated human moral dispositions. The loss function it was selected under is reproductive fitness, not truth-tracking accuracy. The parameter would be some "true moral value," but since evolution didn't select for truth-tracking, this parameter isn't identified. The user mentioned identification, bias, overfitting—so I need to tie those in.

