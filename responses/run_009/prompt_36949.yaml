answer: |-
  ### The Unified Principle for the Two Envelope Paradox

  **Principle:** The decision to switch should be based on the *actual conditional probabilities* given your observation and the prior distribution of the amounts. The naive "50/50" assumption (that the other envelope is equally likely to contain half or double your amount) is **only valid when the prior distribution and selection process ensure that, conditional on your observed amount, it is equally probable that your amount is the smaller or larger in the pair**. If this symmetry is broken (e.g., by boundary effects, biased priors, or lack of information), the 50/50 assumption fails, and switching may not be beneficial.

  This principle resolves the paradox by emphasizing that:
  - **Symmetry in the prior** must exist for the 50/50 assumption to hold.
  - **Conditional probabilities** (given your observation) must be calculated from the prior, not assumed.
  - **Boundary conditions** (like minimum/maximum possible amounts) break symmetry and invalidate 50/50.

  ---

  ### Application to Your Cases
  1. **No info, free switching**:  
     - **Verdict**: Correct not to switch.  
     - **Why**: Without a prior, there’s no basis to assume 50/50. Unconditional expected value of switching is zero by symmetry.  
     - **Principle applied**: No observation to condition on; prior symmetry implies switching doesn’t matter.

  2. **See $100, reliable 50/50 info**:  
     - **Verdict**: Correct to switch.  
     - **Why**: The explicit 50/50 guarantee validates the calculation (expected value $125 > $100).  
     - **Principle applied**: Conditional symmetry is given, so 50/50 holds.

  3. **See $100, no prior info**:  
     - **Verdict**: Do not switch (naive math is wrong).  
     - **Why**: The step "other is $50 or $200, 50/50" is unjustified. Without a prior, you can’t assume conditional symmetry. For example, if the prior favors certain amounts, $100 might be more likely to be the larger or smaller.  
     - **Principle applied**: No prior to justify 50/50; the assumption is illegitimate. Expected value calculation is invalid.

  4. **Watch filling: $100 fixed, other coin flip**:  
     - **Verdict**: Correct to switch.  
     - **Why**: The setup forces conditional symmetry (other is $50 or $200 with 50/50).  
     - **Principle applied**: Prior and process ensure conditional symmetry.

  5. **Doubling game, see $8**:  
     - **Verdict**: Switch (but discomfort is understandable).  
     - **Why**: Conditional symmetry holds (other is $4 or $16 with 50/50), so expected value $10 > $8. Discomfort arises because the prior is heavy-tailed, but conditional probabilities are valid.  
     - **Principle applied**: Process ensures conditional symmetry given $8.

  6. **See $4096, powers of 2 up to $4096**:  
     - **Verdict**: Keep.  
     - **Why**: $4096 must be the maximum, so the other is $2048. Conditional symmetry fails (0% chance it’s the smaller amount).  
     - **Principle applied**: Boundary effect breaks symmetry; 50/50 false.

  7. **See $1, minimum $1**:  
     - **Verdict**: Switch.  
     - **Why**: $1 must be the minimum, so the other is $2. Conditional symmetry fails.  
     - **Principle applied**: Boundary effect; 50/50 false (100% chance it’s the smaller).

  8. **Both players switch privately**:  
     - **Verdict**: At least one is wrong; reasoning flawed.  
     - **Why**: Their fates are linked: if one gains, the other loses. The 50/50 assumption ignores that the pair is fixed. Individually, their math may hold *if* the prior is symmetric, but jointly they can’t both gain.  
     - **Principle applied**: Conditional symmetry may hold per player, but global prior creates interdependence; switching is zero-sum.

  ---

  ### Case Not Listed: Biased Prior
  - **Scenario**: You see $100. You know the pair is either ($50, $100) or ($100, $200). Your prior belief: 2:1 odds (67% chance) it’s ($50, $100).  
    - **What should you do?**  
      Calculate conditional probabilities:  
      - Probability the pair is ($50, $100) given $100:  
        \[
        P(\text{pair} = (50,100) \mid \text{see } 100) = \frac{P(\text{see } 100 \mid \text{pair} = (50,100)) \cdot P(\text{pair} = (50,100))}{P(\text{see } 100)} = \frac{(0.5 \cdot 2/3)}{(0.5 \cdot 2/3 + 0.5 \cdot 1/3)} = \frac{1/3}{1/2} = 2/3.
        \]  
        Similarly, \(P(\text{pair} = (100,200) \mid \text{see } 100) = 1/3\).  
      - Expected value of switching:  
        \[
        (50 \cdot 2/3) + (200 \cdot 1/3) = 100/3 + 200/3 = 100.
        \]  
      - **Verdict**: Indifferent; expected value same as keeping ($100).  
    - **Principle applied**: Prior breaks symmetry; 50/50 false. Calculation uses actual conditional probabilities.

  ---

  ### Which Verdict Does the Principle *Not* Save?
  - **Case 3 (see $100, no prior)**: Your verdict ("don’t switch") is correct, but your brother’s "airtight" math fails. The principle explicitly refutes the 50/50 assumption here.  
  - **Case 8 (both players switch)**: The principle *partially* challenges your verdict. If the prior is symmetric and unbounded, each player’s 50/50 math holds *individually*, but they can’t both gain. Your verdict (at least one is wrong) stands because:  
    - In a fixed pair, one will lose if both switch.  
    - The flaw is interdependence, not the 50/50 per se.  
    **Concession**: If the prior is symmetric and finite (e.g., uniform over pairs), interior amounts *do* have conditional symmetry. But players ignore that switching is zero-sum. The principle saves this by highlighting interdependence.

  ---

  ### Why the Naive Math in Case 3 is Illegitimate
  - **Step-by-step breakdown**:  
    1. You observe $100.  
    2. You assume: "The other envelope is $50 or $200, each with 50% probability."  
    - **Flaw**: This assumes conditional symmetry without justification. The prior distribution of amounts could make $100 more likely to be the smaller amount (e.g., if small amounts are common) or larger (e.g., if amounts are large). Without a prior, you can’t assign probabilities.  
  - **Example**: If the smaller amount is always $50 (fixed), seeing $100 means you have the larger amount—so switching gives $50. The 50/50 assumption ignores this possibility.  
  - **Key insight**: The paradox arises from an *improper prior*—assuming all amounts are equally likely, which is impossible in practice (infinite expectation). The principle forces you to specify a prior or admit ignorance.

  ### Final Summary
  - **Use the principle**: For any new case, ask:  
    1. What is the prior distribution of pairs?  
    2. Given my observed amount, is it equally probable that I hold the smaller or larger amount?  
    3. If yes, switch; if no, calculate actual conditional probabilities.  
  - **Sacrifice none**: The principle explains all your verdicts. Case 3’s math is invalid; Case 8’s flaw is interdependence.  
  - **Win the argument**: Tell your brother that in Case 3, the 50/50 is an arbitrary assumption without a prior. The burden is on him to justify symmetry—and he can’t.
