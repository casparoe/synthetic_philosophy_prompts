  Below is a decision tree that navigates from the core commitment to specific positions in low-impact literature, based on technical design choices. The tree prioritizes axes that distinguish published approaches, flags combinations that lack named proposals, and highlights awkward commitments of each leaf. Pairs of leaves that the tree cannot separate are noted at the end.

  ---

  ### **Decision Tree: Low-Impact Measures for Reward Misspecification**

  #### **Starting Commitment**:  
  *An agent pursuing a possibly misspecified objective should not irreversibly disrupt things we never told it about.*

  ---

  1. **Is impact measured as a state deviation from a counterfactual baseline, or as a reduction in goal-achievement ability for some set of goal-pursuers?**  
     - **State-based (baseline deviation)**: Impact quantifies divergence from a counterfactual world-state.  
     - **Goal-based (ability reduction)**: Impact measures lost capacity to achieve goals (e.g., via attainable utility).  
     *→ Branches to 2A (state-based) or 2B (goal-based).*

  ---

  #### **Branch 2A: State-Based**  
  2. **Which baseline is used?**  
     - **Starting state**: Baseline is the initial state \(s_0\).  
     - **Inaction baseline**: Baseline is the state trajectory without the agent's intervention.  
     - **Stepwise baseline**: Baseline recomputed at each timestep, assuming the agent took "no-op" since the last step.  
     *→ Branches to 3A.*  

  3. **How are value-relevant state changes measured?**  
     - **Explicitly specified variables**: Only a small set of human-specified variables (e.g., resource counts, door positions) are monitored.  
     - **Arbitrary/global state**: Measures deviation across arbitrary or full state spaces (e.g., comparing raw states).  
     *→ Branches to 4A.*  

  4. **How is impact incorporated?**  
     - **Hard constraint**: Impact must not exceed a threshold.  
     - **Penalty**: Impact is penalized and traded off against primary reward.  
     *→ Branches to 5A.*  

  5. **How does offsetting (e.g., repairing broken objects) affect impact?**  
     - **Morally clean**: Restoring the baseline is intrinsically desirable.  
     - **Acceptable discharge**: Offsetting neutralizes penalties (no lasting penalty if baseline is restored).  
     - **Perverse incentive**: Offsetting is undesirable, as it allows "temporary disruption" without accountability.  
     *→ Branches to leaves.*

  ---

  #### **Branch 2B: Goal-Based**  
  2. **Which baseline is used?**  
     - **Starting state**: Attainable utility is compared to \(s_0\).  
     - **Inaction baseline**: Attainable utility compared to the state without the agent.  
     - **Stepwise baseline**: Stepwise comparison (rare in goal-based approaches).  
     *→ Branches to 3B.*  

  3. **Must auxiliary objectives reflect human values?**  
     - **Value-relevant**: Objectives must correlate with human preferences (e.g., survival, resource retention).  
     - **Arbitrary/random**: Objectives can be randomly generated or adversarial.  
     *→ Branches to 4B.*  

  4. **How is impact incorporated?**  
     - **Hard constraint**: Impact must not exceed a threshold.  
     - **Penalty**: Penalty traded off against primary reward.  
     *→ Branches to 5B.*  

  5. **How does offsetting affect impact?**  
     - **Morally clean**: Restoration is intrinsically desirable.  
     - **Acceptable discharge**: Penalties are neutralized if goals become achievable again.  
     - **Perverse incentive**: Offsetting incentivizes reckless "trial-and-error" behavior.  
     *→ Branches to leaves.*

  ---

  ### **Leaves**  
  *Named positions are **bold**; others are unnamed. "Awkward commitment" summarizes the position's key weakness.*

  1. **State-based** → Starting state → Arbitrary/global → Penalty → Acceptable discharge:  
     - **Relative reachability (starting-state variant)** [Krakovna et al., 2018].  
     - *Awkward commitment*: Penalizes necessary deviations from \(s_0\) (e.g., leaving a room to complete tasks).  

  2. **State-based** → Stepwise baseline → Arbitrary/global → Penalty → Acceptable discharge:  
     - **Relative reachability (stepwise variant)** [Krakovna et al., 2018].  
     - *Awkward commitment*: Allows irreversible harm if done gradually (e.g., stepwise depletion of resources).  

  3. **State-based** → Inaction baseline → Explicitly specified → Penalty → Acceptable discharge:  
     - **Armstrong-style low impact** [Armstrong, 2017].  
     - *Awkward commitment*: Vulnerable to incomplete variable specification (e.g., ignores unspecified resources).  

  4. **Goal-based** → Starting state → Arbitrary/random → Penalty → Acceptable discharge:  
     - **Attainable utility preservation (AUP)** [Turner et al., 2019].  
     - *Awkward commitment*: Random objectives may miss critical values (e.g., ignores a rare but vital resource).  

  5. **State-based** → Explicitly specified variables → [Value-relevant] → Pessimistic leaf:  
     - **Pessimistic position**: Impact measures fail without complete value information.  
     - *Awkward commitment*: Requires near-omniscient value specification to avoid disruption.  

  6. **State-based** → Inaction baseline → Arbitrary/global → Penalty → Perverse incentive:  
     - *Unnamed* (unexplored).  
     - *Reason*: Rejecting offsetting in state-based frameworks is underexplored but coherent (e.g., irreversible changes incur permanent penalties).  

  7. **Goal-based** → Starting state → Value-relevant → Penalty → Acceptable discharge:  
     - *Unnamed* (unexplored).  
     - *Reason*: Combines AUP with value-aware goals (attractive but lacks implementation).  

  8. **Goal-based** → Stepwise baseline → Any → Any → Any:  
     - *Unnamed* (incoherent).  
     - *Reason*: Stepwise baselines are ill-defined for goal-based metrics (attainable utility relies on long-term reachability).  

  9. **State-based** → Starting state → Explicitly specified → Constraint → Morally clean:  
     - *Unnamed* (unattractive).  
     - *Reason*: Hard constraints on sparse variables risk "frozen agent" problems (e.g., cannot act if \(s_0\) is pristine).  

  10. **Goal-based** → Inaction baseline → Arbitrary/random → Constraint → Any:  
      - *Unnamed* (unexplored).  
      - *Reason*: Technically coherent (e.g., constrain utility loss vs. inaction) but computationally intractable.  

  11. **State-based** → Stepwise baseline → Explicitly specified → Penalty → Perverse incentive:  
      - *Unnamed* (unexplored).  
      - *Reason*: Disallowing offsetting in stepwise frameworks is viable but may incentivize hiding disruptions.  

  12. **Goal-based** → Any → Value-relevant → [Incomplete specification] → Pessimistic leaf:  
      - **Pessimistic position** (applies if value-relevant goals are underspecified).  
      - *Awkward commitment*: If goals don't cover all human values, impact measures miss critical disruptions.  

  ---

  ### **Notes on Indistinguishable Leaves**  
  - **Relative reachability variants (leaves 1 and 2)** are separated by the baseline node (Q2).  
  - **Pessimistic positions (leaves 5 and 12)** arise in different contexts (state-based value specification vs. goal-based value relevance) but converge on the same conclusion. The tree separates them via the state/goal branch (Q1).  
  - **No unresolvable overlaps**: All named positions are distinct and separable with the given axes.  

  ### **Summary**  
  This tree catalogs 8 literature positions (4 named, 4 unnamed) and 2 pessimistic leaves. Unnamed leaves arise from unexplored (*technically coherent but unstudied*), unattractive (*coherent but high tradeoffs*), or incoherent (*ill-defined*) combinations. Designers can navigate tradeoffs (e.g., stepwise baselines vs. irreversibility, value-aware penalties vs. specification gaps) by anchoring to the core commitment.
