answer: |-
  ### Ground rules  
  I'm mapping:  
  - **Possible worlds** to runtime environments (bindings of variables to values).  
  - **"Actual world"** to the initial environment at program startup.  
  - **Terms/concepts** to functions/lambdas taking a `world` (environment) argument.  
  - **A priori knowledge** to properties derivable from code syntax alone (static analysis).  
  - **Necessity** to truth across all environments encountered during execution.  
  - **Indexicals** (`I`, `here`, `now`) as dynamically scoped variables.  

  ---

  ### Translations  

  1. **Necessary a posteriori (e.g., "Hesperus = Phosphorus")**  
     ```scheme
     (define (hespherus world) (lookup world 'evening-star))  ; Descriptive role  
     (define (phosphorus world) (lookup world 'morning-star))  
     ;; At staging-time: (hespherus env) and (phosphorus env) *could* resolve to distinct refs  
     ;; After actual-world binding (runtime): both resolve to #<planet Venus>  
     ;; Staged result: (lambda (world) #<Venus>) — rigid designator, "necessary"  
     ```  
     *Necessity*: The *specialized* function returns Venus in all worlds.  
     *A posteriori*: Specialization required runtime observation.  

  2. **Kaplan's character/content**  
     ```javascript
     // CHARACTER (compile-time): Dynamic binding setup  
     function current_user(env) { 
         return env.resolveDynamic('USER');  // 'USER' is free until runtime
     }

     // CONTENT (runtime): After env binding  
     const env_actual = { USER: 'Alice', ... };  
     current_user(env_actual); // → 'Alice' (content fixed by env)  
     ```  
     `env` is the world-parameter; indexicals are dynamically scoped lookups.  
     "Actually" operator ≈ binding `env` to `env_actual` and freezing.  

  3. **Primary/secondary intension**  
     ```python
     # PRIMARY: Pre-world-binding (stage-1 evaluation)  
     def water_primary(env):
         return env.lookup('water')  # Yields whatever satisfies "watery" role in env

     # SECONDARY: Post-actualization (stage-2, specialized)  
     env_actual = {'water': H2O, ...}  
     water_secondary = partial(water_primary, env_actual)  # → Always H2O  
     ```  
     Primary: A function awaiting `env` (epistemic, descriptive).  
     Secondary: `water_secondary(w)` ignores `w`; returns `H2O` (metaphysical, rigid).  

  ---

  ### What didn't survive  

  1. **The "privileged description" problem**:  
     In programming, the "primary intension" is defined by *code text*. But in 2D semantics, what counts as the "a priori description" (e.g., "watery stuff" for water) is philosophically loaded. Your vocabulary assumes syntactic descriptions are given; it can't model *why* "watery stuff" is the "correct" primary intension over, say, "what's in my glass." This maps to no compile-time mechanism — it’s an external constraint.  

  2. **A priori as static derivability ≠ epistemic transparency**:  
     You can statically analyze `water_primary(env)` to see it returns *whatever `env` binds to 'water'*. But 2D semantics treats this as yielding *epistemic possibilities* (e.g., XYZ worlds). Your model captures *how* primary intensions compute, but not *why* we accept certain computations (like "watery stuff") as epistemic guides. The link between code structure and rational intuition has no analog.  

  3. **Necessity without rigidity**:  
     Your staging model handles Kripkean necessities cleanly via specialization. But 2D semantics uses secondary intensions for *modal* claims (e.g., "water is necessarily H2O"). If `env_actual` is mutable, `water_secondary` isn't truly necessary — your model permits `env_actual['water'] = XYZ`, breaking the analogy. Philosophers assume worlds are static; programs have state.  

  ---

  ### Verdict  
  The residue — **epistemic privileging of descriptions** and the **static/immutable world assumption** — points to a genuine gap. Your vocabulary perfectly captures the *mechanics* of 2D evaluation (staging, binding, specialization). But the philosophers' core claim — that primary intensions *reveal a priori structure* — relies on unspoken premises about how language hooks onto reality, which programming semantics explicitly avoids. The distortion arises because code evaluates syntax to values in domains we define, while philosophy wrestles with how syntax *latches onto* a domain we don't control. Your "nagging worry" is astute: 2D semantics smuggles in an unexplained epistemology via its choice of "canonical" descriptions. Your model proves the machinery isn't deep; the residue is where philosophy hides its mysteries.
