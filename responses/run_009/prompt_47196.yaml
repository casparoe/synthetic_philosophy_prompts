  Here is a draft joint statement designed for adversarial collaboration, adhering strictly to your specifications. I've included a confidence note afterward.

  ---

  **Joint Statement on Deflationism and Substantive Theories of Truth**

  **1. Points of Agreement**

  The undersigned agree on the following foundational points concerning the concept of truth:

  1.  **The Equivalence Schema (T-Schema):** The schema *'p' is true if and only if p* is universally valid for declarative propositions within ordinary, non-pathological discourse. Instantiating this schema exhaustively captures the core function of the truth predicate.
  2.  **Truth as a Single Property:** Truth is a single, unified property applicable to propositions (or other primary truth-bearers, depending on background commitments), not a disjunctive or contextually fragmented plurality.
  3.  **Diagnosis of Some Historical Disputes:** Certain traditional philosophical disputes about the "nature" of truth (e.g., some iterations of the correspondence-coherence-pragmatism debate) were driven primarily by verbal disagreements or misunderstandings about the core function of the truth predicate, resolvable by attention to the T-schema.
  4.  **Truth's Universality:** The truth predicate applies across all domains of discourse (empirical, moral, mathematical, etc.) in a uniform manner, governed by the T-schema. There are no domain-specific "truths" in the sense of different truth *properties*.
  5.  **Truth and Belief Success:** True beliefs generally correlate with successful action and false beliefs with unsuccessful action within an agent's environment.
  6.  **Truth as the Aim of Inquiry:** Convergent inquiry, under ideal conditions of information sharing and rational revision, tends towards belief-states where the T-schema holds for the propositions believed.

  **2. Disagreements Table**

  The undersigned disagree on the following points. The formulations below are designed to be acceptable to the respective proponents:

  | Disagreement Point                                                                 | Deflationist Position (Acceptable to Deflationist)                                                                 | Inflationist/Substantivist Position (Acceptable to Inflationist)                                                                 |
  | :--------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------- |
  | **2.1 The Nature & Substantiveness of Truth**                                      | Truth has no underlying "nature" beyond its role as a device for disquotation, generalization, and endorsement.    | Truth possesses a substantive nature (e.g., involving representation, correspondence, or causal-informational relations) that explains its behavior and utility. |
  | **2.2 The Explanatory Role of Truth**                                              | Truth does not *explain* the correlation between belief and success; the correlation is explained by the *content* of specific true beliefs and the causal structure of the world. | The property of truth itself (understood substantively) plays an indispensable explanatory role in accounting for the systematic success of true beliefs across diverse domains. |
  | **2.3 The Challenge of Pathological Cases (e.g., Liar Paradox)**                   | Liar-type paradoxes reveal issues inherent in unrestricted language or propositional structure; they pose no *distinctive* problem for deflationism beyond those faced by any theory attempting a consistent truth predicate. | Liar-type paradoxes pose a particularly acute challenge for purely schematic/disquotational treatments of truth, highlighting the need for a richer theoretical account of its structure and limits. |
  | **2.4 The Normativity of Truth for Belief**                                        | The sole norm linking truth and belief is captured by the T-schema and the trivial norm: "Believe that p only if 'p' is true" (which reduces to "Believe that p only if p"). | Truth constitutively sets a norm for belief that is substantive and explanatory, going beyond the disquotational schema, grounding why belief "aims" at truth. |

  **3. Cruxes: Concrete Cases, Arguments, and Predictions**

  The following concrete issues are identified as central points of contention ("cruxes"). For each, a test case/argument is described, and each side's prediction is stated in advance.

  *   **3.1 Crux: Explanatory Role of Truth in Belief-Success Correlation**
      *   **Test Case:** Consider a bridge builder. They hold numerous true beliefs about material strength, load distribution, river currents, etc., and their bridge stands. They hold numerous false beliefs about classical mythology, and this has no adverse effect on bridge building.
          *   **Deflationist Prediction:** Explaining the bridge's success requires *only* citing the specific true *contents* of the relevant beliefs (e.g., "Steel of grade X has yield strength Y") and the causal laws linking those contents to outcomes. Invoking the *property* of truth adds no explanatory power over and above citing the specific truths and the causal structure. Success in irrelevant domains (mythology) fails precisely because the *contents* are causally irrelevant, not because they are false *per se*.
          *   **Inflationist Prediction:** The systematic success across the *relevant* true beliefs requires an explanation invoking the general property of truth (e.g., accurate representation/correspondence). Citing individual contents alone cannot explain why *truth* systematically correlates with success *in general*, across vastly different domains and contents. The irrelevance of false mythological beliefs is explained by their lack of correspondence to the *relevant* aspects of the world for bridge-building.

  *   **3.2 Crux: Handling Pathological Cases (Liar Paradox)**
      *   **Test Case:** Analyze proposed solutions to the Liar Paradox (e.g., sentence L: "L is not true") and its "revenge" variants (e.g., a sentence R: "R is not true or R is paradoxical").
          *   **Deflationist Prediction:** Deflationism (e.g., via disciplined disquotation rules or minimalist propositional structuring) can handle these cases with no greater theoretical cost, complexity, or *ad hoc*-ness than substantive theories (e.g., Tarski hierarchies, contextualist, or paracomplete approaches adopted by inflationists). The problem stems from language/propositional self-reference, not truth's nature.
          *   **Inflationist Prediction:** Substantive theories (especially those incorporating hierarchical structure or indeterminacy) provide a more principled, explanatory framework for diagnosing and resolving Liar and revenge paradoxes. Purely schematic approaches lack the resources to adequately constrain the truth predicate and avoid inconsistency without significant theoretical baggage that implicitly smuggles in substantive elements.

  *   **3.3 Crux: Normative Force of Truth for Belief**
      *   **Test Case:** Analyze the normative statement: "One *ought* to believe that p only if p is true." What grounds this norm?
          *   **Deflationist Prediction:** This norm reduces trivially to "One ought to believe that p only if p" via the T-schema. No further grounding in a "nature" of truth is needed or possible. The normative force, if any, derives from the content p and other epistemic norms (e.g., evidence), not from truth itself.
          *   **Inflationist Prediction:** The norm "Believe that p only if p is true" expresses a constitutive aim of belief itself, grounded in the substantive nature of truth (e.g., as accurate representation). This norm explains *why* evidence is relevant and *why* belief differs from other propositional attitudes like imagining or supposing. The T-schema alone cannot account for this constitutive normative dimension.

  ---

  **Confidence Note on Formulations**

  *   **Overall Confidence:** High confidence that the structure and core formulations meet the requirement of neutrality and acceptability for adversarial collaboration. Emphasis was placed on using each side's characteristic terminology ("device," "disquotation," "generalization" for deflationist; "substantive nature," "explanatory role," "constitutive norm" for inflationist) without embedding covert arguments.
  *   **Section 1 (Agreements):** Very High Confidence. Points 1, 2, 4, and 6 are standard common ground. Point 3 is cautiously phrased ("some," "certain," "resolvable by attention to the T-schema") to avoid overclaiming while capturing shared skepticism about *some* historical debates. Point 5 ("correlates with") is deliberately weak, acceptable to both.
  *   **Section 2 (Disagreements Table):**
      *   **2.1 Nature:** High Confidence. "No underlying 'nature' beyond its role..." captures deflationist core; "possesses a substantive nature..." captures inflationist core.
      *   **2.2 Explanatory Role:** **Moderate Confidence - Most Likely Sticking Point.** The deflationist phrasing ("explained by the *content*...") is standard. The inflationist phrasing ("plays an indispensable explanatory role...") is core to their view. *However:* The deflationist might *strenuously* object to the word "indispensable" in the inflationist column as prejudging the crux. They might demand wording like "*claims to* play an indispensable..." or "plays *what they argue is* an indispensable...". The inflationist would likely reject such weakening. This formulation attempts to state their *position* neutrally, but "indispensable" is a fighting word. *This is the point I'm least sure about.*
      *   **2.3 Liar Paradox:** High Confidence. Focuses on whether it's a *distinctive* problem for deflationism, which both sides debate on their own terms. "No *distinctive* problem" vs. "particularly acute challenge" captures the relative assessment.
      *   **2.4 Normativity:** High Confidence. Deflationist: reduces to trivial norm + T-schema. Inflationist: constitutive norm beyond schema. Key terms ("trivial," "constitutive") are standard for each camp.
  *   **Section 3 (Cruxes):** High Confidence. Test cases are classic and neutral. Predictions directly reflect the core disagreements outlined in Section 2, stated as empirical predictions about how the arguments will play out.
  *   **Verbal Disagreement Diagnosis:** The core disagreements (2.1, 2.2, 2.4) are diagnosed as substantive. However, *aspects* of the debate, particularly concerning the *rhetoric* of "substantive," "robust," "thin," or "explanatory," may mask deeper agreements or hinge on terminological preferences. For example:
      *   **Diagnosis:** Both sides agree truth *does something* (disquotation, generalization). The disagreement is over whether this "doing something" constitutes having a "substantive nature" or merely being a useful logical device. This is substantive – it concerns the *correct metaphysical categorization* of truth's role. However, *insisting* that "substantive" must mean (e.g.) causally efficacious or non-logical *before* engaging the arguments could become verbal. The formulations in 2.1 avoid this by letting each side define "nature" and "substantive" within their own framework.

  ---
  **Recommendation:** Present the draft as-is, but be prepared for significant debate, particularly around the phrasing of "indispensable explanatory role" (Section 2.2 Inflationist column). Highlight this specific wording and the confidence note during presentation to pre-empt discussion. The cruxes provide the clearest path forward for productive adversarial collaboration. Good luck!
