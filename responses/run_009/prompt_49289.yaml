prompt: |-
  I'm a software engineer with no formal philosophy training, but I've thought about decision theory enough to have settled on a position I take quite seriously: Hofstadter's superrationality. Where a group of agents reason the same way about the same symmetric problem, they will converge on one shared strategy, so the right move is to choose the strategy you'd want that shared strategy to be — cooperate in a one-shot prisoner's dilemma against a sufficiently similar reasoner, send a telegram with probability 1/20 in Hofstadter's Platonia setup, and so on. I like that it's not philanthropy: against a known conventional defector, you defect. I'm aware people file it somewhere between evidential decision theory and functional decision theory, though I've never fully sorted out the family relations. Tell me what would count against this view. I want the defeaters ranked by how damaging they'd be, from ones that would sink it to ones a committed superrationalist could shrug off, and including things that have arguably already happened: Hofstadter ran a real test, the Luring Lottery in Scientific American in 1983, where the prize was a million dollars divided by the total number of entries, the superrational prescription was for each reader to submit a single entry (or, on the mixed-strategy version, to randomize so that about one entry would arrive in total), and in fact enough readers submitted astronomically large numbers — several a googolplex — that the prize shrank to a fraction of a cent and no winner could be determined. Was that a failed prediction, mere evidence that Scientific American readers weren't superrational thinkers, or out of scope because the game was asymmetric in practice? Relatedly, I want an honest verdict on whether the clause about "sufficiently similar reasoners" has quietly insulated the view from any possible refutation, and whether that matters for a normative decision principle the way it would for an empirical theory. And if the strongest surviving form of the idea really is functional decision theory, tell me what that successor's best-known embarrassments are and whether they drag my view down with it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a software engineer without formal philosophy training but deeply interested in decision theory, specifically Hofstadter's superrationality. They've adopted this view seriously and want to know its weaknesses. The user mentions examples like cooperating in a one-shot Prisoner's Dilemma and the Platonia dilemma. They also reference the 1983 Luring Lottery in Scientific American, where the outcome didn't align with superrationality predictions.

  First, I need to recall what superrationality entails. Hofstadter's idea is that identical rational agents in symmetric problems will converge on the same strategy. So, cooperation is the norm among similar reasoners. But the user is aware of critiques and wants them ranked by severity. The Luring Lottery example is crucial here—many participants submitted huge entries, leading to a tiny prize. The user questions if this refutes superrationality or if it's due to dissimilar reasoners.

  The user's deeper needs seem to be about the validity of their adopted philosophy. They might be seeking reassurance or a critical evaluation to either strengthen their stance or reconsider. They also worry if the "sufficiently similar reasoners" clause makes the theory unfalsifiable. That's a key point. If any failure is blamed on dissimilarity, can the theory ever be tested?

  I should start with the most damaging critiques. The Luring Lottery is a practical failure. But why did it happen? Participants weren't identical; they had different motivations and knowledge. Some might have tried to outsmart others, leading to massive entries. So, this highlights the symmetry problem—real-world scenarios lack perfect symmetry. Also, defining "similar reasoners" is vague. If every counterexample is dismissed because agents aren't similar enough, the theory isn't testable. That's a big issue for a normative theory because it needs to guide decisions even among diverse reasoners.

  Next, the equilibrium selection problem. Superrationality assumes a unique solution, but games often have multiple equilibria. Coordination games like the Battle of the Sexes show that without communication, agents might not coordinate effectively. Superrationality doesn't specify which equilibrium to choose, making it ambiguous in such cases.

  Then there's the challenge from CDT and EDT. Causal Decision Theory would defect in Prisoner's Dilemma because it focuses on individual causality. Evidential Decision Theory might cooperate but for different reasons. Superrationality's reliance on mutual recognition of symmetry might not hold if others use different decision theories. This ties into the small-world problem—real agents don't all think alike.

  The user also mentioned Functional Decision Theory (FDT). FDT generalizes superrationality by considering logical dependencies between decisions. But FDT has its own issues, like counterfactual mugging, where it pays even when it seems irrational. Does that undermine superrationality? Not directly, but it shows that decision theories face dilemmas.

  Assessing the Luring Lottery: it's evidence against widespread superrationality but not against the theory normatively. The key is whether the participants were similar reasoners. Given the varied strategies, likely not. So, a committed superrationalist might shrug it off. However, it exposes the theory's practical limitations.

  The unfalsifiability concern is serious. If "sufficiently similar" isn't well-defined, the theory can evade refutation. For a normative theory, this might be acceptable if it guides ideal agents, but it risks being impractical. The user needs to decide if they value a workable decision principle over an idealized one.

  In conclusion, the biggest threats are symmetry violations and definitional vagueness. The Luring Lottery was a practical failure due to asymmetry and diverse reasoning. Moving to FDT addresses some issues but introduces new challenges. The user's commitment to superrationality can hold if they accept it as a normative ideal for highly similar agents, though its real-world application is limited.
answer: |-
  Here's a breakdown of critiques against Hofstadter's superrationality, ranked by severity from most to least damaging, incorporating your specific concerns:

  **Level 1: Potentially Sinking Critiques (Foundational Flaws)**

  1.  **The Problem of Symmetry (and Defining "Sufficiently Similar"):**
      *   **The Critique:** Superrationality *crucially* depends on agents being identical in reasoning *and* knowing they are identical. This symmetry is vanishingly rare outside abstract thought experiments. In the real world:
          *   Agents have different priors, knowledge, computational power, risk aversion, and *fundamental decision algorithms* (CDT, EDT, FDT, etc.).
          *   They cannot be certain others are using the *exact same* "superrational" reasoning.
          *   "Sufficiently similar" becomes a vague, potentially unfalsifiable escape hatch (see point 1b).
      *   **Why Damaging:** This strikes at the core mechanism. If symmetry is absent or unknowable, the convergence argument fails. Superrationality loses its unique prescription and collapses into ambiguity or requires auxiliary assumptions about others' reasoning that it doesn't provide.
      *   **The "Sufficiently Similar" Escape Hatch:**
          *   **Normative vs. Empirical:** For a *normative* theory (how *should* an ideal agent reason?), defining an ideal "similar reasoner" is acceptable, even necessary. It's not trying to be an empirical theory predicting human behavior. *But*:
          *   **The Risk:** If "sufficiently similar" is defined *only* as "someone who would reach the same superrational conclusion *I* do," it becomes circular and truly unfalsifiable. This *is* problematic normatively, as it prevents principled application to agents who are *almost* identical but differ in subtle ways.
          *   **Mitigation:** A committed superrationalist would argue the theory *explicitly* applies only under conditions of assumed perfect symmetry/identicality of reasoning. Failures in real-world tests (like the Luring Lottery) simply show those conditions weren't met, not that the core reasoning is wrong *for the intended scenario*. They'd see it as a guide for *idealized* cooperation among clones, not a general empirical predictor.

  2.  **The Equilibrium Selection Problem:**
      *   **The Critique:** Superrationality assumes symmetry magically leads all agents to converge on a *single, uniquely identifiable* "best" strategy. Many games have *multiple* symmetric Pareto-optimal equilibria or coordination points.
      *   **Example (Battle of the Sexes):** Two agents want to meet but prefer different venues (Opera/Football). Both (Opera, Opera) and (Football, Football) are symmetric Pareto-optimal Nash equilibria. Which one does superrationality prescribe? There's no inherent reason within the symmetry argument alone to pick one over the other.
      *   **Why Damaging:** It reveals a fundamental incompleteness. Superrationality often works well when there's a *single obvious* cooperative/optimal symmetric point (like Prisoner's Dilemma cooperation). When multiple exist, it fails to provide guidance, undermining its claim to be a general decision principle. It doesn't solve the core coordination problem inherent in these situations.

  **Level 2: Serious Challenges (Exposing Limitations & Ambiguities)**

  3.  **The Luring Lottery / Platonia Dilemma Failure (Asymmetry in Practice):**
      *   **The Event:** As you described, Hofstadter's real-world test failed spectacularly. Readers *didn't* converge on sending one entry or randomizing to ~1 total. Many sent huge numbers, destroying the prize.
      *   **Was it a Failed Prediction?** Yes, *if* interpreted as a prediction about real human behavior in that specific setup. Hofstadter likely hoped enough readers *would* think superrationally.
      *   **Is it a Refutation?** **Not a fatal one for the *normative core*.** Superrationalists argue:
          *   **Violated Symmetry:** Readers weren't identical reasoners. Many likely used CDT ("I might win more by entering more"), some misunderstood, some were irrational, some deliberately tried to "game" non-superrational players. The key assumption of mutual recognition of identical reasoning was absent.
          *   **Practical Asymmetry:** Information spread, timing of decisions, understanding of the problem, and sheer numbers introduced massive practical asymmetries.
          *   **Normative Scope:** It shows superrationality isn't descriptively accurate for heterogeneous populations, but doesn't invalidate it as a normative ideal for perfectly symmetric scenarios.
      *   **Why Serious:** It dramatically illustrates the **fragility** of the symmetry requirement in practice and the **unrealistic expectation** of widespread identical reasoning. It highlights the gap between the idealized model and real-world application.

  4.  **Challenge from Dominant Decision Theories (CDT & EDT):**
      *   **The Critique:** Why *should* a rational agent adopt superrationality instead of well-established alternatives?
          *   **CDT Argument:** In a one-shot PD against an agent *known* to use CDT, CDT dictates defection (it's strictly dominant). Superrationality prescribes cooperation *only* if you assume the other is superrational. CDT agents, by definition, won't cooperate in a one-shot PD against a known CDT agent. Superrationality seems to require a kind of pre-commitment to a specific type of reasoning that dominant theories reject in those very situations. CDT asks: "What causally controls *my* payoff?" Defection does, regardless of the other's (unknown) decision theory.
          *   **EDT Argument:** EDT might cooperate in a one-shot PD *if* it believes its own action is strong evidence the other will do the same (via acausal correlation). However, EDT's reasoning is based on *evidence* and *correlation*, not the symmetry/convergence argument of superrationality. It might reach the same *action* for different (and arguably more generalizable) reasons.
      *   **Why Serious:** It forces superrationality to justify itself against competing, formally defined frameworks. It struggles to explain why an agent *should* adopt its specific convergence mechanism over CDT's causal focus or EDT's evidential focus, especially when interacting with agents using those frameworks. It risks looking like a special case or an unstable compromise.

  **Level 3: Challenges a Committed Superrationalist Could Shrug Off (But Still Important)**

  5.  **The "Small Worlds" Problem:**
      *   **The Critique:** Superrationality assumes agents can perfectly model the entire symmetric game and all relevant possibilities. Real agents operate in complex, uncertain "large worlds" with bounded rationality.
      *   **Response:** Superrationality is explicitly framed as a normative principle for well-defined, small-world symmetric problems. Its failure in large worlds is acknowledged but doesn't invalidate it within its intended scope. It's an idealization, like perfect competition in economics.

  6.  **Bootstrapping Cooperation:**
      *   **The Critique:** How do the first superrationalists emerge? If everyone else is using CDT, cooperating (as superrationality might suggest) leads to exploitation. Superrationality seems to require a critical mass of like-minded agents to be viable.
      *   **Response:** This is a practical implementation challenge, not a flaw in the core reasoning *given* symmetry. A superrationalist argues the principle holds *when* symmetry exists, regardless of how rare that might be. It's about what's *right* for symmetric reasoners, not how to *create* them.

  **Superrationality vs. Functional Decision Theory (FDT)**

  FDT is indeed a major successor/relative. It generalizes the core insight of superrationality (reasoning about logical dependencies between decisions of similar agents) but places it within a more rigorous framework based on optimizing outcomes across all logically possible instances where the same decision function is called.

  *   **Is FDT the "Strongest Surviving Form"?** Many in the decision theory community would argue yes. It subsumes superrationality's key successes (cooperation in symmetric PD, one-boxing in Newcomb) while providing a more general framework applicable to asymmetric problems and problems involving logical uncertainty (e.g., Parfit's Hitchhiker, Counterfactual Mugging).
  *   **FDT's Best-Known Embarrassments:**
      *   **Counterfactual Mugging (Omega Variant):** Omega flips a coin. Heads, it asks you for $100. Tails, it gives you $10,000 *only if* it predicts you would have paid if it had flipped heads. FDT pays the $100 if heads (to ensure it gets the $10,000 if tails). Critics argue *losing* $100 when heads feels like an irrational payment for a counterfactual benefit, especially compared to CDT which keeps the $100.
      *   **Idealistic Death in Dilemmas:** In some asymmetric dilemmas designed to punish "cooperative" agents, FDT can prescribe actions leading to guaranteed loss if it's logically entangled with agents it needs to coordinate with or outwit, where CDT might at least "save itself". (More niche than the mugging).
      *   **Computational Intractability:** Figuring out the logical dependencies of your decision algorithm across all possible instances is computationally impossible in general.
  *   **Do These Drag Down Superrationality?**
      *   **Counterfactual Mugging:** This dilemma hits FDT harder than superrationality. Superrationality typically avoids such deeply counterfactual, asymmetric scenarios by focusing on clear symmetry. The mugging feels *less* directly applicable to the core superrational premise. A superrationalist might find FDT's payment counterintuitive but wouldn't see it as refuting the symmetric cooperation cases they care about.
      *   **Death in Dilemmas / Computation:** Similar to the "small worlds" critique above. Superrationality is already an idealization; these highlight the limits of idealization in complex scenarios, not a core flaw in the symmetry argument itself.

  **Conclusion & Verdict:**

  Superrationality's most significant vulnerability is its **absolute dependence on perfect symmetry and identical reasoning**, which is its core mechanism but also its Achilles' heel in practice and theory (Equilibrium Selection). The Luring Lottery is a stark demonstration of this fragility in reality, though a committed proponent can (plausibly) dismiss it as a failure of the *conditions* (symmetry was absent), not the *principle*. The "sufficiently similar" clause *does* provide insulation, which is acceptable for a normative theory *if* rigorously defined, but risks becoming an unfalsifiable shield if used carelessly.

  FDT is a more robust and general framework that captures superrationality's essence while addressing some weaknesses (like applying to asymmetric scenarios). FDT's own challenges (like Counterfactual Mugging) are fascinating but less directly damaging to the core idea of cooperating/coordinating under symmetry that defines superrationality.

  **Your view isn't sunk by its critiques, but it is revealed as a specific, fragile, and idealized principle** – powerful and elegant within its narrow domain of perfect symmetry among identical reasoners, but not a general-purpose decision theory for the messy, asymmetric, multi-agent world we inhabit. Its value lies in highlighting a profound *possibility* for cooperation that CDT misses, even if realizing it fully requires idealized conditions rarely met.
