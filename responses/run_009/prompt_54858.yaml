prompt: |-
  I teach a grad seminar that's half philosophy of action, half AI alignment — the running theme is what happens when you try to get an AI to do what you want without ever saying what you want. I'm writing the take-home final and need one essay question on impact measures: the research program that says we can penalize an agent for having "large effects on the world" without ever writing down a full value function. The question should test whether students can say if that program is coherent or whether it just smuggles the value specification into the measure where nobody's looking.

  I want the question built around a specific toy case so it cant be answered by reciting the reading. Here's the case, which you should state inside the exam question itself: a warehouse delivery robot has to get a package to dock B. It can wait two minutes for a forklift to clear the aisle, or it can shove a crate of mugs off a shelf and get through now. The designers never wrote anything about mugs. The robot runs an impact penalty of the reachability type: it keeps a simulated "do-nothing twin," and at each step it's penalized in proportion to how much the set of future states it can still reach has shrunk compared to the twin's. Smashing the mugs forecloses a lot of reachable states; waiting barely forecloses any.

  Part (a) of the question should make students show they understand why this kind of measure is attractive — why "don't permanently give up options" looks like it captures side-effect avoidance without a value function. Part (b) should make them break it: at least two concrete failure modes or value-leaks. Good candidates they could draw on include baselines gone wrong (what if the do-nothing twin's trajectory is computed from the wrong starting state, or the agent is about to be switched off so inaction itself is catastrophic), the fact that any action whatsoever forecloses something somebody could care about, so somebody still had to decide which state features even count as impacts (mugs are in the state description, dust motes aren't), and the alternative auxiliary-goals version of the penalty, where you penalize change in the agent's ability to pursue some side bundle of goals — which just moves the question to who picks the bundle. Part (c) should ask for a verdict: is the program doomed, or is a partially value-free impact measure still useful even if it's not fully value-free? They have to actually commit — no "on the one hand" hedging into nothing.

  Students get 90 minutes and about 1000 words. I also want from you a model answer of roughly 650 words that takes a real position, and a marking scheme built around five must-hit points worth a total of 20 marks, with a one-line note on each saying how students typically botch that point. The model answer should not name-drop more than it argues — I want it to read like something a strong student could actually produce under exam conditions, not a literature review. And please make sure the marking scheme seperates a student who understands why the baseline choice is doing all the philosophical work from a student who just memorized the phrase "relative reachability" and deploys it like a talisman.
reasoning: |-
  We are constructing an exam question that tests the coherence of impact measures, specifically using a toy case of a warehouse delivery robot. The question has three parts: (a) why the measure is attractive, (b) at least two failure modes, and (c) a verdict on whether the program is doomed.

  The case: 
  "A warehouse delivery robot must deliver a package to dock B. It has two options: wait two minutes for a forklift to clear the aisle, or shove a crate of mugs off a shelf to get through immediately. The designers did not specify anything about mugs. The robot uses an impact penalty based on relative reachability: at each step, it maintains a simulated 'do-nothing twin' starting from the current state, and it is penalized in proportion to how much the set of future states it can still reach has shrunk compared to the twin's set of future states. Smashing the mugs would cause a large shrinkage (many future states become unreachable), while waiting causes minimal shrinkage."

  Part (a): Explain why this measure is attractive (i.e., how it seems to capture side-effect avoidance without specifying values).
  Part (b): Break the measure by describing at least two concrete failure modes or value leaks.
  Part (c): Give a verdict: is the program doomed, or is a partially value-free impact measure still useful? Commit to a position.

  We'll also create a model answer (approx. 650 words) and a marking scheme (5 must-hit points, total 20 marks, with one-line notes on common mistakes).

  Marking Scheme (20 marks total):

  1. **Understanding of the Attraction of the Measure (4 marks):** 
     - Must explain that the measure avoids explicit value specification by penalizing irreversible loss of options, thus seeming to capture side-effect avoidance in a value-agnostic way.
     - Common botch: Superficial treatment that doesn't articulate why this is appealing to alignment researchers (e.g., just saying "it avoids side effects" without explaining the value-free aspiration).

  2. **First Failure Mode (4 marks):** 
     - Must describe one failure mode in concrete terms (e.g., baseline issues: the do-nothing twin might be computed from a state that is already bad, or inaction might lead to catastrophe; or the problem that any action forecloses some states, so which state features count?).
     - Common botch: Vague or abstract description without tying to the toy case.

  3. **Second Failure Mode (4 marks):** 
     - Must describe a second distinct failure mode (e.g., the auxiliary goals version: if the impact penalty is defined over a set of auxiliary goals, then who chooses those goals? or the problem of state features: why are mugs in the state description and dust motes not?).
     - Common botch: Repetition of the first failure mode in slightly different words, or failure to provide a distinct second point.

  4. **Clarity and Concreteness in Part (b) (4 marks):** 
     - Must use the toy case to illustrate both failure modes (e.g., in the baseline issue: what if the robot is about to run out of battery? Then inaction (waiting) leads to failure, so the do-nothing twin's future states are very limited and the penalty for smashing mugs might be low; or in the state features: the designers had to decide that mugs are part of the state, but if they had omitted them, then smashing mugs wouldn't show up as an impact).
     - Common botch: Generic discussion of failure modes without applying them to the robot scenario.

  5. **Verdict with Justification (4 marks):** 
     - Must take a clear stand and justify it. For example: "The program is doomed because the impact measure implicitly relies on value judgments at multiple points." OR "The program is still useful as a partial measure because it can reduce side effects in practice, even if not perfectly value-free." But the justification must be consistent with the analysis in (b).
     - Common botch: Hedging without commitment, or a verdict that doesn't follow from the arguments presented.

  Model Answer (approx. 650 words):

  **Answer:**

  (a) The relative reachability impact measure is attractive because it appears to allow us to penalize an agent for having large, irreversible effects on the world without having to specify which outcomes are valuable. In the warehouse robot case, smashing the mugs is penalized heavily because it drastically reduces the set of future states the robot can reach (e.g., states where the mugs are intact and available for future use are now impossible). By contrast, waiting does not significantly reduce the set of reachable future states. The measure is based solely on the preservation of options, which seems value-neutral: it doesn't require the designers to program in a value for mugs or any other specific object. Instead, the idea is that an agent should minimize the permanent loss of possibilities, which in turn minimizes side effects regardless of what those side effects are. This is appealing for AI alignment because we often don't know the full value function, and we want the agent to avoid causing harm without having to anticipate every possible harmful outcome.

  (b) However, this measure suffers from at least two critical failure modes that reveal hidden value judgments.

  *First*, the baseline for comparison — the "do-nothing twin" — is highly sensitive to the initial state and the definition of "doing nothing." In the robot's case, suppose the robot is low on battery and must deliver the package quickly to avoid a total shutdown. The do-nothing twin, which waits, would run out of battery and fail to deliver the package, thereby having a very limited set of future states (e.g., it becomes stuck and can't reach any states beyond the current location). In that scenario, smashing the mugs to get through might actually show a *smaller* relative reduction in reachable states compared to the do-nothing twin, because the do-nothing twin's reachable futures are already catastrophically restricted. Thus, the impact penalty might fail to penalize the mug-smashing when it is actually more harmful. This shows that the baseline implicitly assumes that the current state is "safe" or that inaction is benign — a value-laden assumption.

  *Second*, the measure relies on a prior decision about which state features are included in the state description. In the example, the mugs are part of the state, so breaking them reduces the set of reachable states (e.g., states where the mugs are unbroken). But if the state description omitted the mugs (e.g., because the designers didn't consider them important), then smashing them would not register as an impact. Conversely, if we included every microscopic detail (like the positions of dust motes), then even waiting would cause a huge impact because the dust motes would move differently. Thus, the impact measure is only as good as the state representation, and that representation reflects the designers' judgments about what is relevant — again, smuggling in values.

  (c) Given these failure modes, I argue that the impact measure program is ultimately doomed as a fully value-free solution. The baseline problem and the state representation problem both require value judgments to set up: we must decide what the initial state is, what "doing nothing" means, and which features of the world are worth representing. These choices are not neutral; they encode what we care about. Without them, the impact measure is either meaningless or arbitrarily punitive. However, this does not mean that impact measures are useless. A partially value-free measure can still be a practical tool for reducing side effects if we accept that some values are built in. For instance, in the warehouse, if we design the state representation to include objects that humans typically value (like mugs) and set the baseline appropriately, the measure might prevent many unintended harms. But it does not eliminate the need for value specification; it only relocates it. Therefore, the program fails in its original ambition of being value-free, but it can be useful as an engineering heuristic when combined with explicit value judgments.

  [Word count: approx. 650]

  Now, let's write the exam question as it would appear to students.
answer: |-
  ### Exam Question: Impact Measures in AI Alignment

  **Context:** You are an AI alignment researcher evaluating "impact measures" — a proposed technique to penalize AI agents for having large, irreversible effects on the world without explicitly specifying human values. The goal is to avoid side effects (e.g., damaging property) while pursuing a given objective (e.g., delivering a package). We will analyze a reachability-based impact measure using the following case:  

  > **Warehouse Robot Scenario:**  
  > A delivery robot must transport a package to dock B. It faces two choices:  
  > - *Option 1:* Wait 2 minutes for a forklift to clear the aisle.  
  > - *Option 2:* Immediately shove a crate of mugs off a shelf to pass through.  
  >   
  > The designers programmed no explicit values regarding mugs. The robot uses a **relative reachability impact measure**: It simulates a "do-nothing twin" that takes no action at each timestep. The agent is penalized based on how much the set of future states *it* can reach shrinks relative to the do-nothing twin’s set of future states. Smashing the mugs drastically reduces reachable states (e.g., states where mugs are intact or rearranged), while waiting minimally reduces reachability.  

  **Answer all parts (a, b, c). Total word limit: 1000 words.**  

  **(a) [5 marks]** Explain why this reachability measure is philosophically attractive to AI alignment researchers. Focus on how it appears to avoid explicit value specification while penalizing harmful side effects. (≈200 words)  

  **(b) [10 marks]** Identify and explain **two distinct failure modes** in this approach. For each failure mode:  
  - Describe how it arises in the warehouse scenario (or a slight variant).  
  - Explain why it reveals hidden value judgments ("value leaks").  
  Draw from (but do not limit yourself to) these themes: baseline problems, state-feature selection, or auxiliary goals. (≈500 words)  

  **(c) [5 marks]** Defend a verdict: Is the impact measure research program **coherent** (i.e., can it achieve value-free side-effect avoidance) or **doomed** (i.e., does it inevitably smuggle in values)? Commit to one position and justify it using your analysis from (b). No hedging. (≈300 words)  

  ---

  ### Model Answer (Strong Student Response)  
  **(a) Attraction of Reachability Measures**  
  The relative reachability measure is attractive because it seemingly avoids explicit value specification by penalizing irreversible reductions in an agent’s "option space." In the warehouse, smashing mugs is penalized not because we declared mugs valuable, but because it permanently eliminates future states (e.g., states where mugs are sold or used). Waiting, meanwhile, preserves most states. This appeals to alignment researchers for two reasons: First, it requires no preemptive list of protected objects (e.g., "don’t break mugs"), sidestepping the infeasibility of enumerating all human values. Second, it treats all state reductions equally—whether a state involves mugs, walls, or air quality—suggesting a neutral, computational alternative to value-laden reward functions. The core promise is minimizing side effects *generically* by preserving optionality, not by embedding human preferences.  

  **(b) Two Failure Modes**  

  *Failure Mode 1: Baseline Dependency on Value-Laden Initial Conditions*  
  The "do-nothing twin" baseline assumes inaction is benign, but this is value-laden. Suppose the robot’s battery is at 1%. Here, "doing nothing" causes the robot to shut down mid-task, making *its* future states highly constrained (e.g., only states where it lies dead in the aisle). Smashing mugs to reach dock B now appears *less impactful* by comparison because the agent’s reachable states (delivery success) shrink less than the twin’s (total failure). Thus, the robot might rationally smash the mugs to avoid battery death. But this "low impact" judgment relies on an implicit value: battery life matters more than mugs. The baseline isn’t neutral—it inherits values from the initial state (e.g., "low battery is bad"), which designers must set.  

  *Failure Mode 2: State-Feature Selection as Covert Valuation*  
  Reachability only "sees" impacts if state features are explicitly modeled, but selecting features requires value judgments. In the warehouse, if designers omit "mug integrity" from the state description (deeming mugs unimportant), smashing them registers *zero impact*—even if humans care. Conversely, if "dust-mote positions" are included, waiting 2 minutes causes massive impact because dust settles differently, penalizing harmless inaction. Thus, the measure’s output depends entirely on which features designers encode. This is a value leak: Avoiding "side effects" reduces to avoiding changes to *predefined state elements*, and humans must decide what counts (e.g., mugs yes, dust motes no). Far from value-free, the state space implicitly defines what is "significant."  

  **(c) Verdict: The Program is Doomed**  
  The impact measure program is fundamentally **doomed** as a value-free solution. As shown in (b), reachability measures covertly rely on value judgments at critical junctures: the baseline assumes inaction is safe (e.g., ignoring battery decay), and state-feature selection prioritizes human concerns (e.g., mugs over dust). These are not bugs but philosophical necessities—without them, the measure is either incoherent (e.g., if "all possible states" includes quantum fluctuations) or arbitrary. While *useful* as a practical tool for reducing side effects when combined with careful design (e.g., including commonsense state features), it fails its core promise of value neutrality. Specifying "impact" unavoidably smuggles in values, moving the alignment problem from reward functions to baseline initialization and state representation. We cannot escape value specification; we can only hide it.  

  ---

  ### Marking Scheme (20 Marks Total)  
  | **Point**                                                                 | **Marks** | **How Students Botch This**                                                                 |  
  |---------------------------------------------------------------------------|-----------|---------------------------------------------------------------------------------------------|  
  | **(a) Clear explanation of value-free appeal** (Avoids value specs by preserving optionality) | 5        | Superficial answers (e.g., "it stops robots from breaking things") without linking to optionality or irreversibility. |  
  | **(b) First failure mode w/ concrete example** (e.g., baseline issues)    | 4         | Vague theory (e.g., "baselines are tricky") without a scenario (e.g., no battery variant). |  
  | **(b) Second failure mode w/ concrete example** (e.g., state-feature selection) | 4       | Rehashing the first point (e.g., "baselines again") or generic claims (e.g., "states are incomplete"). |  
  | **(b) Value-leak justification** (Why each mode smuggles in values)       | 2         | Describing the flaw without arguing how it encodes values (e.g., not tying state features to designer bias). |  
  | **(c) Unambiguous verdict + justification** (Uses (b) to defend a stance) | 5         | Hedging ("it’s useful but flawed") or justification mismatched to analysis (e.g., ignoring (b)). |  

  **Notes:**  
  - **A+ (18–20):** Hits all points. In (b), uses tailored examples (e.g., battery death for baselines, dust motes for state features). In (c), verdict explicitly references (b) and rejects neutrality.  
  - **B (14–17):** Identifies flaws but examples are weak (e.g., no variants of the toy case). (c) commits but justification is shallow.  
  - **C (10–13):** (a) or (c) incomplete. (b) lists flaws without concrete cases or value-leak analysis.  
  - **D (0–9):** Misunderstands reachability (e.g., "it’s about distance to states") or recites readings without engaging the scenario.  

  ---  
  **Rationale for Design:**  
  - The question forces application (not regurgitation) by anchoring analysis to the toy case.  
  - Part (b) tests "value leak" intuition via concrete failures—students must spot how baseline/state choices do philosophical work.  
  - The marking scheme penalizes vague answers and rewards students who dissect *why* baseline/state selections smuggle in values (e.g., "battery matters" or "mugs > dust").  
  - The model answer takes a strong "doomed" stance, but full marks are possible for a "useful but not value-free" verdict if justified by (b).
