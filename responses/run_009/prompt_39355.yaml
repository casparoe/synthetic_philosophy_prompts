prompt: |-
  Me and my partner have been going back and forth about the procreation asymmetry -- the view that bringing into existence someone whose life will be bad is wrong in a way that failing to bring into existence someone whose life would be good is not wrong. She's at maybe 0.95 that it's true, I've drifted down to around 0.4, mostly because the standard objections in population ethics made me unsure whether the intuition can be made consistent. Give me your own credence that the asymmetry is true, but decompose it rather than just handing me a number: how much turns on whether existence can be good or bad *for* the person created, how much on whether the core intuition is just status-quo bias dressed up, how much on whether adding happy lives could ever be a duty rather than at most a nice thing, and any other terms you think belong. Give a rough probability and one line of justification for each, then tell me how they combine into your overall number. And then tell me where the disagreement between her (0.95) and me (0.4) most likely actually lives -- which sub-question are we really split on -- cause it's not about any facts of the matter we could go look up.
