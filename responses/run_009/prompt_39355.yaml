  Next, status-quo bias. The core intuition might just be preferring the current state. Like, not creating a happy person isn't wrong because we're used to their absence. But changing the status quo by creating a sufferer feels wrong. This could be a cognitive bias. Studies show loss aversion affects decisions. I think this plays a role, so I'll put it at 0.7. It reduces my confidence in the asymmetry being fundamental.

  Third, whether adding happy lives is a duty. If we have a duty to create happy people, that challenges the asymmetry's permissibility of not creating them. But the asymmetry says it's not wrong to refrain. If we have such a duty, the asymmetry might not hold. I find this implausible because it could lead to overwhelming obligations, like the repugnant conclusion. So my credence is low, 0.2, meaning it's unlikely that adding happy lives is a duty.

  Other factors: deontological constraints, axiological comparability, and practical concerns. Deontology might see creating harm as violating a duty, while not creating benefit isn't. That supports asymmetry. Axiological issues: can we compare existence to non-existence? If not, it's harder to say not creating is neutral. Practical concerns like resource scarcity might influence intuitions but aren't core to the ethics.

  Combining these credences multiplicatively (since they're somewhat independent): 0.9 * 0.7 * 0.8 (for the other factors, averaged). That gives around 0.5 overall.

