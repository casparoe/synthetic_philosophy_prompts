answer: |-
  The practice of fan-chart forecasting and stress testing, juxtaposed with warnings about radical uncertainty, reveals a complex and potentially contradictory epistemology. Here's a breakdown:

  **1. The Implicit Epistemology: Bayesian Rationalism**
     Fan charts presuppose a **Bayesian/subjective probability framework**:
     - **Quantifiability**: All uncertainty (even about unprecedented events) can be assigned *some* numerical probability by a rational agent (the central bank).
     - **Single Distribution**: There exists *one* coherent subjective probability distribution capturing the entire state of knowledge about future outcomes.
     - **Risk, Not Radical Uncertainty**: The future is treated as a "gamble with known odds" (even if the odds are imperfectly known and subjectively estimated). Residual "uncertainty" is just imperfectly measured risk.
     - **Calibration as Validation**: The ability to test whether outcomes fall within predicted bands (e.g., 30% of the time in the 30% band) assumes the underlying uncertainty is fundamentally stochastic and stable enough over time for frequentist validation to be meaningful.

  This is a **Laplacean-Bayesian** view: Rational agents possess (or should act *as if* they possess) a complete probability distribution over all possible states of the world.

  **2. How Much Does Practice *Require* vs. *Accommodate*?**
     - **Strictly Required:**
       *   **Quantifiability:** Assigning *some* probability number to every band/outcome is non-negotiable for the chart itself.
       *   **Coherent Distribution:** The bands must sum to 100% and be mutually exclusive. This implies a single underlying distribution.
       *   **Comparability:** Implicitly, the bank *can* compare the likelihood of different outcomes enough to rank them into probability bands (e.g., "Outcome X is more likely than Outcome Y").
     - **Accommodated/Conventional:**
       *   **Bell Shape:** The symmetric bell curve is *not* a strict requirement of the Bayesian view (subjective distributions can be skewed or multimodal). It's primarily a **communicative convention** chosen for simplicity and familiarity. A Keynesian could *tolerate* this as a useful heuristic *provided* strong disclaimers about tails and model limitations are given.
       *   **Disclaimers:** Warnings about radical uncertainty are *attempts* to acknowledge the limitations of the quantifiable model *without* abandoning it. They signal that the sharp probabilities, especially in the tails, are fragile conventions rather than objective facts.

  **3. Coherence of the Combination: A Managed Tension (Not Strictly Coherent)**
     The combination is **operationally coherent but epistemologically strained**:
     - **Operational Coherence:** The fan chart provides a concrete, actionable communication tool for *most* foreseeable outcomes. Disclaimers about radical uncertainty serve as a necessary "hedge" against the model's inevitable incompleteness, especially for tail events. Calibration provides *some* discipline for the *core* of the distribution under "normal" times.
     - **Epistemological Strain:**
       *   **Smuggling Uncertainty In:** The disavowal of radical uncertainty *is* implicitly smuggled back into the tails of the distribution. By assigning *any* probability (even a tiny one) to events like a major war or unprecedented financial collapse, the bank *is* quantifying the unquantifiable. It treats "unknown unknowns" as "known unknowns" with very low probability.
       *   **Calibration Paradox:** True radical uncertainty (e.g., a technological singularity) is *by definition* not amenable to calibration based on past frequencies. How can you calibrate the probability of events with no historical precedent? The calibration discipline tacitly assumes the future uncertainty structure resembles the past, contradicting the radical uncertainty warning.
       *   **False Precision:** Assigning specific probabilities to bands conveys a sense of precision that the disclaimers explicitly warn against.

  **4. A Genuinely Keynesian Central Bank: Alternative Practices and Trade-offs**
     A bank taking non-comparability and radical uncertainty seriously would need fundamental changes:

     - **Replace Fan Charts with Scenario Sets:**
       *   **Multiple Plausible Scenarios:** Publish a small set of distinct, well-articulated future paths (e.g., "Baseline," "Supply Shock Intensification," "Geopolitical Crisis," "Tech Breakthrough"). Crucially, these would be presented **without assigned probabilities**.
       *   **Explicit Non-Comparability:** Accompanying text would explicitly state that the central bank judges these scenarios as *plausible* but lacks the basis to rank their *relative likelihoods* meaningfully ("We cannot say Scenario A is more probable than Scenario B").
       *   **Focus on Resilience & Implications:** Analysis would focus on the bank's preparedness for *each* scenario, the potential impact on policy goals, and the robustness of policy choices across scenarios ("Is our current policy stance appropriate under *all* plausible futures?").

     - **What Would Be Lost:**
       *   **Accountability:** Calibration disappears. There's no clear numerical benchmark ("Did inflation fall within the 70% band?") to judge forecast accuracy ex-post. Accountability shifts to qualitative judgment ("Did you consider the *right* scenarios?" "Were your policy responses sensible across scenarios?"), which is harder and more contestable.
       *   **Market Pricing & Policy Signaling:** Markets rely heavily on the *probabilistic* path of future policy rates implied by fan charts and associated forecasts. Scenario sets without probabilities offer far less concrete guidance for pricing assets or forming expectations about future policy. Communicating the policy *reaction function* ("How *would* we react *if* Scenario X unfolds?") becomes paramount but more complex.
       *   **Internal Discipline:** The quantitative rigor of building a full probability distribution forces internal debate and synthesis of information. Scenario planning can be rigorous but risks becoming more qualitative and less analytically integrated. The pressure to quantify "how likely" inevitably creeps back in.
       *   **Communication Simplicity:** A single central projection with bands is simpler to grasp than a set of distinct, unranked narratives. The loss of a "most likely" path (even if conventional) could create communication challenges.

  **Conclusion:**

  Central bank practice leans heavily on a **Bayesian epistemology of quantifiable risk**, essential for producing usable probabilistic forecasts and enabling calibration. The symmetric bell curve is largely convention, but the requirement for *some* quantifiable distribution is fundamental. Disclaimers about radical uncertainty represent an honest recognition of the framework's limits but create an epistemological tension: by quantifying the tails, the bank inevitably treats radical uncertainty as merely very low-probability risk.

  A truly Keynesian approach would abandon sharp probabilities for **explicitly non-comparable scenarios**. While this better reflects the nature of radical uncertainty, it sacrifices quantitative accountability, clear market signals, calibration discipline, and communication simplicity. The current hybrid model (fan charts + disclaimers) persists because it offers a pragmatic, albeit philosophically imperfect, balance between the need for actionable guidance and the acknowledgment of the unknown. It prioritizes operational usefulness over strict epistemological purity.
