prompt: |-
  I'm a journalist who writes about science and ideas, and I'm putting together a feature on the question of what a highly capable AI system should do if we simply ask it to act on what we want — the old alignment proposal known as coherent extrapolated volition, the idea that the machine should satisfy not our current, confused, contradictory wishes but the wishes we would have if we knew more, thought faster and clearer, and had grown up into the people we aspire to be. As part of my reporting I'm running a 90-minute session at a small ideas festival, roughly 22 adult participants with mixed backgrounds and no philosophy training, and I want the session to be an activity rather than a talk: participants should run into the hard problems themselves before anyone names them.

  Concretely, design me a structured game with roles, rules, materials I can prepare on paper, and a timeline that fits the slot. I'd like it to make three things happen rather than be said aloud. First, participants should feel the gap between stated and idealized preferences: some of them should have to extrapolate another person's volition from a fixed record of choices and answers, without being able to interrogate the person. Second, the extrapolated result should come back to its subject for a verdict of "yes, that's me, only better" or "no, that's a stranger with better arguments" — I want the room to discover how unstable that verdict is. Third, the game should end with an aggregation step where the group's extrapolated volitions have to be merged into one coherent instruction that actually gets acted on: I can put a small real stake behind it, say a modest donation budget the final instruction must allocate, so the incoherence has a cost people can see. Include a debrief that maps the specific moments of the activity onto the parts of the idea, a candid note on what will predictably go wrong the first time I run it and how to recover, and an honest statement about which feature of the real proposal the activity cannot reproduce no matter how I stage it — I suspect the competence asymmetry is the big one, since the whole point of the original idea is that the extrapolator is smarter than everyone in the room, and mine won't be.

  One more thing: keep the participants in the dark about the philosophical pedigree until the final segment, so the debrief lands as recognition rather than as confirmation of something they were told at the start. Begin your response with a single sentence stating the core mechanic of the activity, then give the full design — no preamble, and don't restate my setup back to me.
reasoning: |-
  We are going to design a role-playing game called "The Better You" that lasts 90 minutes with 22 participants. The core mechanic is: participants extrapolate an idealized version of another participant's preferences from a limited record of choices, then reconcile these into a single group directive that allocates real funds.

  ### Game Design: "The Better You"

  **Materials to Prepare:**
  - **Personal Choice Booklets (22 copies)**: Each booklet has 10 pages. Each page presents a binary or multiple-choice question about personal preferences, values, or hypothetical choices. Examples:
    - "If you found $100 unexpectedly, would you: (a) Save it for future needs, (b) Donate to a cause you care about, (c) Spend it on something fun for yourself?"
    - "Which is more important: (a) Economic growth, or (b) Environmental protection?"
    - "In a crisis, should society prioritize: (a) Individual freedom, or (b) Collective safety?"
    - Include some questions with trade-offs (e.g., "Would you accept a 10% tax increase to fund universal healthcare?")
    - Leave space for a short written rationale on each page (participants must write a sentence or two explaining their choice).
  - **Extrapolation Worksheets (22 copies)**: Forms with the same 10 questions, but with blank choices and space for the extrapolator to write:
    - "The Better You would choose: [ ]"
    - "Reason: [Because if you knew more/thought clearer, you'd realize...]"
  - **Role Cards (22)**: Half the group (11) are "Subjects", the other half (11) are "Extrapolators". Also prepare 11 "Subject Review" cards (for the review phase) and 11 "Aggregator" badges (for the final phase).
  - **Group Directive Worksheet (1 large poster or projected slide)**: With the question: "How should we allocate $500 among these causes? [List 5 real charities, e.g., 'Against Malaria Foundation', 'GiveDirectly', 'Doctors Without Borders', 'Environmental Defense Fund', 'Electronic Frontier Foundation']"
  - **Timer**
  - **Pens**
  - **Name tags**

  **Timeline (90 minutes total):**

  1. **Introduction (5 min)**  
     - Welcome participants. Explain: "Today we're playing a game about decision-making. We'll explore how we make choices and how others might interpret them. No prior knowledge needed—just your thoughts and honesty."  
     - Assign roles: Randomly distribute role cards (11 Subjects, 11 Extrapolators).  
     - Distribute Personal Choice Booklets to **Subjects only**. Extrapolators get nothing yet.

  2. **Phase 1: Building the Record (10 min)**  
     - **Subjects**: Work through the 10 questions in their booklet, making choices and writing brief rationales. Emphasize: "Answer as yourself, right now."  
     - **Extrapolators**: Wait. (Use this time to observe or think about how they might approach the task.)  
     - Collect all booklets when time is up.

  3. **Phase 2: The Extrapolation (15 min)**  
     - Redistribute booklets: Each Extrapolator gets one Subject's booklet (randomly assigned, anonymized—no names on booklets).  
     - **Extrapolators**: Fill out the Extrapolation Worksheet. Instructions: "You are to imagine a 'Better Version' of the person who made these choices. This person has thought more deeply, knows more facts, and is free of biases. For each question, decide what choice this 'Better You' would make—which might differ from the original. Write a reason for each change, if any."  
     - Collect all Extrapolation Worksheets and the original booklets.

  4. **Phase 3: The Review (15 min)**  
     - Return materials: Each Subject gets back their original booklet and the Extrapolation Worksheet filled out for them.  
     - **Subjects**: Review the extrapolated choices. On their "Subject Review" card, they write:  
       - "This feels like a better version of me: Yes/No"  
       - "One place where it really resonates: [ ]"  
       - "One place where it feels alien: [ ]"  
     - **Extrapolators**: Wait.  
     - Collect review cards (keep them anonymous for now).

  5. **Phase 4: Aggregation (20 min)**  
     - **Regroup**: All participants now become "The Council".  
     - **Task**: Produce one group directive for allocating $500 among 5 charities (listed on the Group Directive Worksheet).  
     - **Rules**:  
       - Start by sharing anonymized Subject Review quotes (read aloud a few "resonates" and "alien" examples to show the tension).  
       - Argue for allocations based on the "Better You" principles—but the group must agree on one coherent split.  
       - Use consensus or quick voting (e.g., 5 min discussion, 3 rounds of voting with adjustments).  
     - Record the final allocation on the poster.  
     - **Stake**: Announce that this allocation will be donated post-event from a provided budget.

  6. **Debrief and Reveal (25 min)**  
     - **Step 1: Elicit Reactions (5 min)**  
       Ask: "What was hard? Surprising? Frustrating?"  
     - **Step 2: Map to CEV (15 min)**  
       Reveal: "This was a simulation of 'coherent extrapolated volition'—a proposal for aligning AI with human values." Draw parallels:  
       - **Building the Record** = Our limited, inconsistent preferences.  
       - **Extrapolation** = AI inferring idealized preferences from data (without asking).  
       - **Review** = The instability of the verdict—we might reject the AI's extrapolation.  
       - **Aggregation** = The challenge of merging individual ideals into a coherent global goal.  
     - **Step 3: Unresolved Tensions (5 min)**  
       Highlight: "In reality, an AI would be smarter than us—here, the extrapolator was just another human. Also, we had only 10 data points; an AI would have more, but the core problem remains: Whose 'better self' counts, and how do we agree?"

  **Predictable Problems & Recovery:**  
  - **Problem**: Subjects write vague rationales, making extrapolation arbitrary.  
    *Recovery*: Encourage concrete reasoning in Phase 1 (e.g., "Imagine explaining to a friend").  
  - **Problem**: Extrapolators project their own values onto Subjects.  
    *Recovery*: In debrief, note this as a key risk—"This is why real CEV requires careful value learning."  
  - **Problem**: Aggregation deadlocks.  
    *Recovery*: Have a backup voting method (e.g., score voting) to force a decision.  
  - **Problem**: Review phase feels too abstract.  
    *Recovery*: Prompt Subjects with: "Would you trust this 'Better You' to decide for you?"  

  **The Unreproducible Feature:**  
  The activity cannot simulate the **competence asymmetry** of a superintelligent AI. Our extrapolators are peers—no wiser, no faster—so the "extrapolation" is just human guesswork. In CEV, the AI is meant to *out-think* us, spotting contradictions and implications we miss. Here, participants experience the *problems* of extrapolation without the *promise* of superior insight.

  **Final Note**:  
  The game avoids philosophical jargon until the debrief, letting participants discover the challenges organically. The real donation stake makes the aggregation step tangible—expect frustration when noble ideals collide in practice.
answer: |-
  Participants anonymously record personal preferences, then swap booklets to extrapolate "improved" versions of each other's choices, before reconciling these into a single group decision with real monetary stakes.

  ### GAME DESIGN: "THE BETTER YOU"  
  *90-minute session for 22 participants*  

  **ROLES & SETUP**  
  - **Subjects (11)**: Create preference records.  
  - **Extrapolators (11)**: Infer "improved" choices from a Subject’s record.  
  - **Aggregators (all)**: Merge all extrapolations into one directive.  
  - **Materials**:  
    - 22 *Preference Booklets* (10 pages each). Each page has:  
      - A binary/multiple-choice question (e.g., "Donate $50 to: (A) Climate charity (B) Local food bank").  
      - Space for a 1-sentence rationale.  
    - 22 *Extrapolation Kits* (worksheets matching booklet questions, with fields: "Original Choice," "Your 'Improved' Choice," "Reason for Change").  
    - 22 *Review Cards* (with: "This improved version feels like me: YES/NO" and "Why?").  
    - 1 *Group Directive Board* (large poster listing 5 real charities).  
    - Timer, pens, $500 donation budget (real stake).  

  **TIMELINE**  

  1. **Phase 1: Building Preferences (15 min)**  
     - **Subjects** fill out Preference Booklets anonymously. Instructions: *"Answer honestly as you are TODAY. Write a brief reason for each choice."*  
     - **Extrapolators** wait outside or observe silently (no interaction).  
     - *Outcome*: Creates raw data of "current selves."  

  2. **Phase 2: Extrapolation Swap (20 min)**  
     - Collect all booklets. Randomly redistribute each to an Extrapolator.  
     - **Extrapolators** receive an *Extrapolation Kit* and a Subject’s booklet. Instructions: *"You are an 'advisor' to this person. Based ONLY on their answers, design their 'improved' choices as if they were wiser, better-informed versions of themselves. Change choices if needed, but justify every edit using THEIR rationale."*  
     - *Outcome*: Forces extrapolation from static data—no dialogue.  

  3. **Phase 3: The Verdict (15 min)**  
     - Return each Subject’s original booklet + their Extrapolator’s worksheet.  
     - **Subjects** receive a *Review Card*. Instructions: *"Compare your original choices to the 'improved' version. Does this feel like YOU, only better? Write YES/NO and one reason."*  
     - Collect all cards anonymously. Shuffle and read 4–5 aloud (e.g., *"NO—it ignored my core values," "YES—it fixed my short-sightedness"*).  
     - *Outcome*: Reveals instability—participants see peers reject/accept extrapolations unpredictably.  

  4. **Phase 4: Aggregation (25 min)**  
     - **All become Aggregators**. Display *Group Directive Board*: *"Allocate $500 across 5 charities [e.g., Education, Environment, Poverty, Health, Tech Ethics] using ONLY the 'improved' choices as guidance. You MUST agree on ONE split."*  
     - Rules:  
       - Start with 5 min open debate citing extrapolations (e.g., *"Sarah’s 'better self' prioritized poverty, so we should...").*  
       - Vote on allocations at 10 min. If no consensus, force ranked-choice voting.  
       - Lock in final directive. Announce actual donation will be made.  
     - *Outcome*: Exposes incoherence—allocation debates highlight conflicting ideals.  

  5. **Debrief & Reveal (15 min)**  
     - **Step 1: Elicit reactions** (5 min): Ask *"What felt unfair? Where did assumptions fail?"*  
     - **Step 2: Map to CEV** (7 min): Reveal the philosophy. Explain:  
       - *Preferences → Raw human desires.*  
       - *Extrapolation → CEV’s "improved" self.*  
       - *Verdict instability → Why we might reject even wise AI advice.*  
       - *Aggregation → CEV’s unsolved "merging problem."*  
     - **Step 3: Shortfall** (3 min): *"Unlike a superintelligent AI, our extrapolators weren’t wiser—just humans guessing. Real CEV needs an entity smarter than all of us combined."*  

  ---

  **PREDICTABLE PROBLEMS & RECOVERY**  
  - **Problem**: Extrapolators project their own values onto Subjects.  
    *Recovery*: In debrief, highlight this as a core CEV failure mode ("Extrapolation requires value-neutrality").  
  - **Problem**: Aggregation deadlocks over charity splits.  
    *Recovery*: Impose a timer and force a vote—then discuss how haste undermines ideals.  
  - **Problem**: Subjects dismiss extrapolations as "not me" too quickly.  
    *Recovery*: Use anonymized review cards to show diverse verdicts ("See? Some embraced their 'better selves'").  

  **UNREPRODUCIBLE FEATURE**  
  The *competence asymmetry* of CEV cannot be simulated. Your extrapolators are peers—not superintelligences—so they lack the insight to genuinely "improve" choices beyond human bias. Participants experience the *dilemma* of extrapolation, not its theoretical promise.
