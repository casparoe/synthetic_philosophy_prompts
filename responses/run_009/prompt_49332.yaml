prompt: |-
  I'm a program officer at a small foundation about to fund a three-year program — roughly five researchers — on a single theme: when does an adaptive-hypothesis explanation of a human psychological trait count as science rather than a just-so story? The funding is for conceptual and methodological work: inference standards, criteria for when an adaptationist claim is supported, study-design templates. It is not for running new empirical studies, though the outputs should be usable by the people who do run them.

  I'd like a defended ranking of the open questions in this area, and I'll seed it with four candidates I've been circling. Rank them by how much they matter for the program's goal, add anything important I've left out, and tell me which of mine you'd cut.

  1. The uniformity/variation question: is pancultural uniformity of a trait stronger evidence of adaptation than the field's critics concede, or is observed cross-cultural variation better read as facultative response to environment — and on either answer, what follows for how adaptation is inferred?
  2. The truncated-hypothesis-space problem: when a researcher contrasts an adaptive explanation with a byproduct or noise alternative, is there a principled way to generate and grade the competing explanations, or is the comparison structurally underdetermined no matter how careful the study?
  3. The calibration question: could the field adopt explicit evidential thresholds for adaptive claims — for instance, a rule about how many independent, risky predictions a hypothesis must survive, or preregistration of adaptive predictions before data collection — and would such thresholds actually separate good work from bad, or only add bureaucracy?
  4. The comparative gap: adaptationist claims in morphology lean on the comparative and fossil record, but for psychology there is essentially no behavioral fossil. Is there anything methodological to build here, or is this better acknowledged and deprioritized?

  For each item I want the reasoning, not a summary: what makes it upstream or downstream of the others, how tractable it is for purely conceptual work, and what development over the next three years — in the program or the field — would move it up or down your ranking. State the criteria you're implicitly using (importance, tractability, neglectedness, how much else depends on the answer), and where two of them pull in opposite directions, show how you weighed them. I'm less interested in the final list than in whether the ordering survives scrutiny, so please close by identifying where your ranking is most likely wrong: which single argument or consideration, if it went the other way, would most reorder the list — and whether you see a flaw in the framing itself, e.g., a reason these four questions are not really separable and my asking for a ranking between them already misdescribes the field's problem.
reasoning: |-
  Okay, the user is a program officer at a small foundation funding a three-year program focused on distinguishing adaptive-hypothesis explanations from just-so stories in human psychology. They need a defended ranking of open questions, including their four candidates, and want to know which to cut. 

  First, I need to understand their core goal: developing conceptual and methodological tools for evaluating adaptationist claims—standards, criteria, templates—without running new studies. The outputs should be usable by empiricists. 

  Looking at their four questions:

  1. **Uniformity/variation**: Is pancultural evidence strong for adaptation, or is variation better as facultative response? Implications for inference.
  2. **Truncated-hypothesis-space**: How to generate and grade competing explanations? Is the comparison underdetermined?
  3. **Calibration**: Can explicit evidential thresholds (e.g., risky predictions, preregistration) separate good from bad science, or just add bureaucracy?
  4. **Comparative gap**: Morphology uses fossil records; psychology lacks behavioral fossils. Methodological solutions or deprioritize?

  I need to rank these by importance to the program’s goal, add missing questions, and suggest cuts. The user wants reasoning—upstream/downstream relationships, tractability for conceptual work, how developments could shift rankings. They also want my implicit criteria (importance, tractability, neglectedness, dependency) and where trade-offs occur. Finally, I must identify the weakest point in my ranking and any framing flaws.

  **Step 1: Criteria for ranking**  
  - **Importance**: How central is the question to validating adaptationist claims? Does it address a core weakness in the field?  
  - **Tractability**: Can conceptual work make progress in 3 years? Is it purely methodological or entangled with empirical gaps?  
  - **Neglectedness**: Is the field overlooking this? High neglectedness boosts priority.  
  - **Dependency**: Does solving this unlock progress elsewhere? Upstream questions should rank higher.  
  - **Output usability**: Will answers directly help empiricists design studies?  

  Trade-offs will arise (e.g., high importance but low tractability).  

  **Step 2: Ranking the existing questions**  
  - **#2: Truncated-hypothesis-space**  
    - *Importance*: Highest. This is the core epistemological problem—how to compare adaptive vs. non-adaptive explanations without arbitrary cherry-picking. If unsolved, all adaptationist claims are vulnerable to "just-so" accusations.  
    - *Tractability*: Moderate-high. Conceptual work can develop frameworks for hypothesis generation (e.g., computational models of trait spaces) and grading criteria (falsifiability, specificity). Bayesian tools could help.  
    - *Neglectedness*: High. Critics harp on this, but few systematic solutions exist.  
    - *Dependency*: Upstream. Solutions here would anchor #1 (uniformity/variation) and #3 (calibration).  
    - *Output*: Directly feeds into study-design templates (e.g., "list X alternative hypotheses").  

  - **#3: Calibration**  
    - *Importance*: High. Without standards, the field can’t distinguish robust claims from storytelling.  
    - *Tractability*: High. Conceptual work can propose thresholds (e.g., "3 independent risky predictions") and simulate their efficacy. Preregistration is testable via meta-research.  
    - *Neglectedness*: Moderate. Some talk (e.g., "strong inference") but no consensus.  
    - *Dependency*: Midstream. Requires input from #2 (to define "risky predictions") but enables concrete outputs.  
    - *Output*: Evidential thresholds → usable criteria for empiricists.  

  - **#1: Uniformity/variation**  
    - *Importance*: Medium. Relevant but secondary—uniformity isn’t definitive proof (could be genetic drift), variation isn’t definitive counterproof (could be adaptive plasticity).  
    - *Tractability*: Moderate. Conceptual models can clarify evidentiary weight, but empirical variability complicates universal rules.  
    - *Neglectedness*: Low. Heavily debated (e.g., evolutionary psych vs. cultural evolution).  
    - *Dependency*: Downstream. Depends on #2 (how to weight evidence) and #3 (calibration).  
    - *Output*: Inference guidelines, but less universally applicable.  

  - **#4: Comparative gap**  
    - *Importance*: Low-medium. A real limitation, but not fatal—morphology also uses indirect evidence.  
    - *Tractability*: Low. Hard to "solve" without fossils. Conceptual work can only mitigate (e.g., phylogenetic inference from genes).  
    - *Neglectedness*: Low. Already acknowledged; workarounds exist (e.g., experimental evolution simulations).  
    - *Dependency*: Lateral. Not upstream; solutions here don’t resolve core inference problems.  
    - *Output*: Limited—mostly cautionary notes for empiricists.  

  **Proposed ranking: 2 > 3 > 1 > 4**  
  Cut #4 (comparative gap) as least impactful.  

  **Step 3: Missing questions**  
  Add:  
  - **Mechanism constraint**: How must adaptive hypotheses engage with proximate mechanisms (neural, developmental)? Without this, claims risk being "black-boxed" just-so stories.  
    - *Importance*: High. Integrates evolutionary and mechanistic biology.  
    - *Tractability*: Moderate. Conceptual work on necessary/sufficient mechanistic detail.  
    - *Neglectedness*: High in evolutionary psych.  
    - *Output*: Criteria like "adaptive claims must specify testable proximate pathways."  
  - **Fitness-landscape linkage**: How to credibly link psychological traits to fitness in contemporary/environmental contexts? (Avoids "Paleofantasy" problem).  
    - *Importance*: Critical—if the fitness link is speculative, everything fails.  
    - *Tractability*: Challenging but feasible via theoretical models (e.g., adaptive utility under reconstructed environments).  
    - *Neglectedness*: High. Often hand-waved.  
    - *Output*: Templates for reconstructing past selective pressures.  

  Revised ranking with additions:  
  1. **Truncated-hypothesis-space** (core)  
  2. **Fitness-landscape linkage** (missing; addresses speculation)  
  3. **Calibration** (standards)  
  4. **Mechanism constraint** (missing; integrates levels)  
  5. **Uniformity/variation** (specific evidence)  
  Cut #4 (comparative gap).  

  **Step 4: Trade-offs**  
  - **Tractability vs. Importance**: #2 (hypothesis-space) is highly important and tractable—ideal. #1 (uniformity) is less important but more tractable than #4 (gap).  
  - **Neglectedness**: Added questions (#Fitness-linkage, #Mechanism) score high here, boosting rank.  

  **Step 5: Weakest point in ranking**  
  - **Risk**: Overprioritizing #2 (hypothesis-space) assumes it’s solvable. If it’s fundamentally intractable (e.g., all alternatives are infinite), effort is wasted. But tractability seems moderate via Bayesian/formal tools.  
  - **Framing flaw**: The questions aren’t fully separable—e.g., #2 and #Fitness-linkage intersect. However, ranking forces strategic focus.  

  **Final recommendations**  
  - Fund #2, #3, #Fitness-linkage, #Mechanism, #1.  
  - Cut #4.  
  - Outputs: For #2→ hypothesis-generation protocols; #3→ evidential thresholds; #Fitness-linkage→ environmental reconstruction guidelines.
answer: |-
  Below is a defended ranking of your four candidate questions, plus two critical additions, ordered by their importance to your program's goal of establishing inference standards and methodological criteria for adaptive claims in psychology. I'll explicitly state my criteria, analyze each question, integrate new items, identify which to cut, and conclude with the ranking's weakest point and potential framing flaws.

  ### **Ranking Criteria**
  I weigh four factors (with trade-offs noted):
  1. **Importance**: How directly the question addresses the *core scientific validity* of adaptationist claims. Does it prevent "just-so" storytelling?  
  2. **Tractability for conceptual work**: Can 3 years of non-empirical research (e.g., philosophy of science, computational modeling, framework development) make material progress?  
  3. **Neglectedness**: Is the field underinvesting in this? High neglectedness increases priority.  
  4. **Upstream leverage**: Does solving this unlock progress on other issues? Upstream questions enable downstream work.  

  **Trade-off handling**: Importance outweighs tractability if the problem is existential (e.g., without a solution, the field is unsalvageable). Neglectedness breaks ties when importance is similar. Upstream leverage trumps incremental gains.

  ---

  ### **Defended Ranking (Most to Least Important)**
  **1. #2: The truncated-hypothesis-space problem**  
  **Why top?** This is the *most upstream and existential* threat. If researchers can't generate or grade competing hypotheses (e.g., adaptation vs. spandrel vs. drift) in a principled way, all adaptive claims are structurally underdetermined—rendering standards for evidence (e.g., #3) meaningless.  
  - **Importance**: Highest. It strikes at the epistemology of adaptationism: without constraints on hypothesis space, any "story" can persist.  
  - **Tractability**: High for conceptual work. Teams can:  
    - Develop formal criteria for hypothesis generation (e.g., computational models of "trait spaces" based on evolutionary constraints).  
    - Create Bayesian frameworks for grading explanations (e.g., predictive adequacy, complexity penalties).  
  - **Neglectedness**: High. Critics (e.g., Gould & Lewontin) flag this, but few systematic solutions exist.  
  - **Upstream leverage**: Directly informs #1 (what counts as evidence?), #3 (how to set thresholds?), and new additions.  
  - **Development potential**: In 3 years, produce hypothesis-generation toolkits (e.g., "must specify 3+ non-adaptive alternatives") and falsifiability criteria. If ignored, the field remains vulnerable to charges of storytelling.  

  **2. #3: The calibration question**  
  **Why second?** Even with robust hypotheses, the field lacks agreed-upon standards for what constitutes sufficient evidence—making #3 critical for *operationalizing* scientific inference.  
  - **Importance**: High. Without thresholds (e.g., riskiness of predictions), adaptive claims can't be falsified, inviting just-so stories.  
  - **Tractability**: Highest. Conceptual work can:  
    - Simulate evidential thresholds (e.g., via agent-based models: "How many failed predictions invalidate a claim?").  
    - Analyze preregistration's efficacy using meta-science from adjacent fields (e.g., ecology).  
  - **Neglectedness**: Moderate. Debated but not systematized; "risky prediction" standards are ad hoc.  
  - **Upstream leverage**: Downstream of #2 (thresholds depend on hypothesis quality) but enables practical outputs (e.g., study-design templates).  
  - **Development potential**: In 3 years, propose evidence-tier systems (e.g., "Category A: Survives 2+ preregistered risky tests"). If empirical work ignores these, it drops in priority.  

  **3. NEW: Fitness-linkage challenge**  
  **What's missing?** *How to credibly link a psychological trait to fitness impacts in ancestral or contemporary environments?* Your list omits this, yet it's central: without a rigorous fitness link, "adaptation" is circular.  
  - **Importance**: Critical. Fitness assumptions are often arbitrary (e.g., "jealousy increased reproduction").  
  - **Tractability**: Moderate. Conceptual work can:  
    - Develop guidelines for reconstructing ancestral environments (e.g., integrating paleoclimate/data).  
    - Create criteria for trait-fitness modeling (e.g., game-theoretic thresholds for "plausible impact").  
  - **Neglectedness**: High. Often hand-waved; few psych studies quantify fitness effects.  
  - **Upstream leverage**: Informs #1 (does variation indicate different fitness optima?) and #2 (fitness models constrain hypotheses).  
  - **Development potential**: In 3 years, produce fitness-justification templates (e.g., "must specify adaptive context with ecological data"). If new data emerges (e.g., from genomics), this rises.  

  **4. #1: Uniformity/variation question**  
  **Why lower?** While relevant, this is a *specific instance* of evidentiary weighting, not a foundational inference problem.  
  - **Importance**: Medium. Uniformity isn't definitive proof of adaptation (e.g., could reflect shared constraints), nor is variation disproof (e.g., facultative adaptations).  
  - **Tractability**: Moderate. Conceptual work can model when variation supports adaptation (e.g., signal detection frameworks), but depends on solutions to #2 and #3.  
  - **Neglectedness**: Low. Heavily debated (e.g., evolutionary psychology vs. cultural evolutionists).  
  - **Upstream leverage**: Downstream of #2 (how to interpret evidence) and #3 (calibrating uniformity as proof).  
  - **Development potential**: In 3 years, generate uniformity-variation decision trees. If cross-cultural data explodes (e.g., via global digital phenotyping), this surges.  

  **5. NEW: Mechanism constraint**  
  **What's missing?** *Must adaptive hypotheses engage proximate mechanisms?* If not, claims risk being unfalsifiable "black boxes."  
  - **Importance**: Medium-High. Proximate mechanisms (e.g., neural, developmental) can corroborate/refute adaptive origins (e.g., a trait lacking efficient design undermines adaptation).  
  - **Tractability**: Moderate. Conceptual work can:  
    - Define necessity of mechanistic evidence (e.g., "Is developmental modularity required?").  
    - Integrate with evolutionary developmental biology.  
  - **Neglectedness**: High in psychology; often treated as optional.  
  - **Upstream leverage**: Downstream of #2 (mechanisms help exclude alternatives) but strengthens calibration (#3).  
  - **Development potential**: In 3 years, output guidelines (e.g., "adaptive claims require testable mechanistic pathways"). If cognitive neuroscience advances rapidly, prioritize higher.  

  **CUT: #4: The comparative gap**  
  **Why cut?** While valid, this is less urgent for your goals:  
  - **Importance**: Low-Medium. Lack of "fossils" is a limitation, not a dealbreaker—behavioral adaptationism uses other evidence (e.g., universals, fitness models).  
  - **Tractability**: Low for conceptual work. No proxy for behavioral fossils exists; effort is better spent improving inference with available data.  
  - **Neglectedness**: Low. Well-acknowledged; workarounds exist (e.g., phylogenetic comparatives with primates).  
  - **Upstream leverage**: Limited. Solutions here don't resolve core inference problems (#2, #3).  
  - **Development potential**: Minimal. Outputs would be cautionary notes, not standards. Cut to focus resources.

  ---

  ### **Final Ranking & Recommendations**
  1. **#2: Truncated-hypothesis-space problem** (Highest importance: foundational).  
  2. **#3: Calibration question** (Critical for operational standards).  
  3. **NEW: Fitness-linkage challenge** (Missing linchpin: justifies "adaptation").  
  4. **#1: Uniformity/variation question** (Useful but secondary).  
  5. **NEW: Mechanism constraint** (Important safeguard).  
  **Cut**: #4 (Comparative gap).  

  **Strengths of this ordering**:  
  - Prioritizes epistemology (#2) and operationalization (#3) before evidence interpretation (#1).  
  - Adds fitness linkage (prevents circularity) and mechanism constraints (adds falsifiability).  
  - Cuts the least tractable/impactful item (#4).

  ---

  ### **Where the Ranking is Most Vulnerable**
  **Weakest point**: **Assuming #2 (hypothesis space) is tractable**. If it proves *structurally intractable*—e.g., if hypothesis generation is inherently unconstrained—the entire ranking collapses. In that case:  
  - #3 (calibration) becomes most important, as evidential thresholds (e.g., preregistration) might compensate for hypothesis limitations.  
  - #1 (uniformity) gains value if variation patterns can empirically constrain hypotheses.  
  - **Argument for reordering**: If a 2025 meta-analysis shows that hypothesis-space truncation rarely misleads in practice, #3 and #1 jump ahead.  

  **Potential framing flaw**: **These questions are interdependent, not rankable isolates**. For example:  
  - #2 (hypothesis space) and fitness linkage co-determine what counts as a "valid" adaptive hypothesis.  
  - #1 (variation) and mechanism constraints jointly inform evidentiary weight.  
  - **Implication**: Your program should treat these as a network. A "modular" team structure (e.g., one subgroup on hypothesis generation, another on evidence standards) with integration points (e.g., quarterly synthesis workshops) may better reflect the field's needs than ranking.

  **Recommendation**: Fund all except #4, but allocate resources by the ranking above. Prioritize outputs that bridge questions—e.g., a "unified inference framework" that integrates hypothesis grading (#2), fitness justification (NEW), and evidence thresholds (#3). This maximizes usability for empiricists while acknowledging interdependencies.
