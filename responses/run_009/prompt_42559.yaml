answer: |-
  ## Sestina: The Persistent Keel

  **Brainstorming & Rationale:**

  1.  **Chronological Replacement:** Each stanza explicitly replaces one end-word part (e.g., Stanza 1: original plank; Stanza 2: new plank). *Rejected:* Too literal, risks becoming a mechanical list rather than a poem embodying the paradox. The sestina's magic is in the *felt* shift, not explicit announcement.
  2.  **Functional Degradation:** Focus on parts failing (frayed rope, cracked plank) to necessitate replacement. *Rejected:* Shifts focus to decay/repair rather than the core metaphysical question of persistence through change. The poem needs the *parts themselves* to be the persistent/changing elements.
  3.  **Material Persistence & Positional Flux:** The *same words* (the material) persist throughout, but their *position* (their functional/contextual role within the stanza/ship) changes irrevocably with each rotation. The reader tracks the familiar words ("plank", "keel") but finds them in new grammatical and imagistic contexts, mirroring the replaced part's persistence-as-material but altered role-in-the-whole. The *inevitability* of the rotation pattern mirrors the inevitability of replacement. **Chosen:** This leverages the sestina's core mechanic (fixed word rotation) to directly enact the paradox. The words are the planks; their shifting positions are the replacements. Disorientation grows organically as the words reappear in unexpected places, making the reader question the identity of the "ship" (poem) they started with.

  **The Sestina:**

  **(1)**
  The harbor breeze first kissed the weathered **plank**,
  Ran fingers through the lines of supple **rope**.
  It strained against the current, sturdy **keel**
  Ground deep in silt. The sun lit taut white **sail**,
  Climbed high, a watchtower, the seasoned **mast**,
  Held fast by rusting, loyal, ancient **nail**.

  **(2)**
  A season's storm demands a newer **nail**.
  Salt-weary, soft, they swap the weakest **plank**.
  The rigging groans. They test each trusted **rope**,
  Re-secure canvas to the listing **mast**.
  The wind returns, accepts the patched white **sail**,
  Still guided by that constant, buried **keel**.

  **(3)**
  Years gnaw the hemp. They splice the fraying **rope**.
  The canvas thins; they mend the tired **sail**
  With foreign cloth. They drill for firmer **nail**
  Into fresh timber – not the old sea-**plank**.
  The spar succumbs; they raise a straighter **mast**,
  While unseen, deep, endures the resting **keel**.

  **(4)**
  The tide insists. They change the splintered **mast**.
  The hull demands new seams, a stronger **nail**.
  They choose bright wood, discard the greyed sea-**plank**.
  They weave new threads into the lengthened **rope**.
  They stitch the sky with canvas, stiff new **sail**,
  Above the shadow of the lasting **keel**.

  **(5)**
  Is this the wind that filled the first white **sail**?
  The wave that tested that initial **plank**?
  The knot once tied in that first length of **rope**?
  The salt that bit the old spar, the first **mast**?
  The rust that claimed the earliest iron **nail**?
  Or just the echo near the constant **keel**?

  **(6)**
  A figure walks the shore where lies the **plank**
  Discarded, grey. He gathers wood and **nail**,
  Recoils the tangles of abandoned **rope**.
  He shapes a hull upon a hidden **keel**,
  Raises a ghostly, splintered, lonely **mast**,
  And breathes the wind into a memory's **sail**.

  **(Envoi)**
  Here stands the **keel**'s long shadow, there the **sail**
  Of gathered **plank** and **nail**, by phantom **rope**
  Reborn beside the **mast** that knew the sea.

  **How the Form Carries the Argument:**

  The sestina’s fixed rotation of the six end-words (*plank, rope, keel, sail, mast, nail*) perfectly enacts the paradox. Each word persists materially throughout the poem, just as each ship part persists as wood or metal. However, their positions shift irrevocably with each stanza, forcing them into new grammatical roles, new images, and new contexts – mirroring the replacement of parts within the ship. The reader tracks the familiar words, but their changing positions create a growing sense of disorientation: is the *plank* in stanza 6 the same entity as the *plank* in stanza 1, just because it's the same word? The poem never asks this; the form *makes the reader feel it*. The envoi compresses all six words (the "material") into three lines describing the Hobbesian second ship, forcing the "original" and "reconstructed" entities to share the same linguistic hull, embodying the insoluble tension of two candidates claiming the same identity without resolving it. The *keel*'s relative stability in position (often anchoring the end of lines/stanzas) subtly suggests foundational persistence, while words like *plank* and *nail* shift dramatically, highlighting replaceable components. The form *is* the argument.
