prompt: |-
  Two people from my democratic theory seminar (I'm a third-year poli sci major taking it as an elective) got into it after section and now they've each texted me their side of the arguement and honestly I can't tell who's winning. The professor had brought up the boundary problem -- before you can say "the people should decide" you have to say who the people even are -- and used it to ask whether tourists should get to vote in a city referendum while they're visiting.

  Maya said yes, basically. Her principle: anyone whose interests are affected by a decision deserves a say in it. Tourists are policed by the same cops, pay the same sales tax, drink the same tap water -- affected, so enfranchised. She even pointed out that on her principle much of the world should have gotten to vote on Brexit, and she said that like it was a feature and not a bug.

  Dan said that's insane, because it makes the demos explode into everything: every tariff, every climate law, and you end up with a world electorate for basically every decision, which just isn't what democracy is. His principle: only people actually subjected to the coercion get a vote. Tourists are there voluntarily and leaving soon.

  Maya came back that "subjected" doesn't do any better. Whether you count as subjected ends up tracking how easily you can escape the law's reach, so the tourist who flies home tomorrow is in while the permanent resident who's lived in the town thirty years but can't naturalize is out -- unless Dan is suddenly fine with resident noncitizens voting, which he wasn't five minutes earlier. She also said people are subjected to some laws and not others (zoning vs drug laws vs traffic rules), so his principle gives everyone partial votes, which is silly.

  Dan then retreated (his own word) to a third idea: a demos isn't defined by any single decision at all, it's an ongoing project of people governing themselves together over time -- membership means being part of the ongoing scheme, not being affected by or subjected to any one output.

  Maya said that's circular: which people are part of the people's ongoing project? The project can't pick its members without already having them, so it explains nothing.

  Can you go through the exchange move by move and tell me who's right at each step -- including whether Maya's "Brexit as a feature" move actually works and whether her circularity charge lands on Dan or equally on her own principle. Then say who's more right overall, and whether there's something both of them are missing entirely. Also, am I wrong to suspect that part of the trouble is that they both keep using "demos" like it's a natural kind with a fixed boundary, when maybe it's more like something we draw for reasons we have to defend seperately? Please answer in American English, and don't recommend readings -- I can find the literature myself, I want the actual adjudication of the arguments.
reasoning: |-
  Okay, the user is a third-year political science major in a democratic theory seminar. They're dealing with an argument between two classmates, Maya and Dan, about the boundary problem in democracy—specifically, whether tourists should vote in local referendums. The user wants a clear breakdown of each argument step, who's right at each point, who's more right overall, and if both are missing something. They also suspect the issue might be treating "demos" as a fixed boundary rather than something defined contextually.

  First, I need to recap the exchange accurately. Maya argues for the affected interests principle: anyone affected by a decision should have a say. Dan counters with the coercion principle: only those subjected to the law's coercion should vote. Maya points out flaws in both principles—affected interests could lead to a global electorate, while coercion excludes long-term residents who can't escape. Dan then shifts to the ongoing project idea, which Maya calls circular.

  Breaking it down move by move. Maya's initial point: Affected interests include tourists because they experience local laws. Her Brexit example is a strength test—does the principle hold consistently? Dan's response highlights the impracticality of infinite demos expansion. Both have points here—Maya's principle is philosophically consistent but logistically messy, Dan's identifies a real-world problem but doesn't solve it.

  Next, Maya's coercion critique is strong—it creates arbitrary boundaries based on mobility and creates partial enfranchisement issues. Dan's "ongoing project" retreat is weak because it doesn't resolve the circularity Maya identifies. The circularity charge lands harder on Dan here since his new principle relies on pre-defined membership.

  Overall, Maya's critiques are sharper, but neither principle is perfect. The user's suspicion about "demos" being a constructed boundary is astute—this is the core insight both miss. Real-world democracies define demos based on practical and normative reasons (sovereignty, feasibility, reciprocity), not just philosophical purity. The user likely needs this pointed out to elevate the seminar discussion beyond theoretical ping-pong. They're not asking for readings but want the argument adjudicated, so I'll keep it focused on logic gaps and realpolitik without academic references.
answer: |-
  Here's a move-by-move breakdown of the argument, assessing the strengths and weaknesses of each point, followed by an overall verdict and the core issue you identified:

  **The Exchange Adjudicated:**

  1.  **Maya's Opening (Affected Interests Principle):**
      *   **Claim:** Anyone affected by a decision (policing, taxes, water) deserves a vote. Tourists qualify. Brexit example is a *feature* (consistent application).
      *   **Strength:** Intuitively appealing. Captures a core democratic impulse: those impacted should have a voice. Highlights genuine connection (taxes, services). The Brexit point *is* a logical consequence, showing internal consistency.
      *   **Weakness:** Dan is right that it leads to potentially infinite or unmanageable demos expansion ("demos explosion"). Climate policy *would* require a global vote; a local zoning change could impact distant investors. This clashes with the practical reality and common understanding of *bounded* democratic units (cities, states, nations).
      *   **Who's Winning?** Maya scores a point for consistency and highlighting genuine connection, but Dan immediately identifies the major flaw. **Slight edge to Maya** philosophically, but Dan raises a devastating practical objection. The Brexit point *works* for internal logic but highlights the principle's impracticality.

  2.  **Dan's Counter (Coercion Principle):**
      *   **Claim:** Only those subjected to the *coercive power* of the law long-term get a vote. Tourists are voluntary and transient, so excluded. Demos explosion avoided.
      *   **Strength:** Directly addresses the "demos explosion" problem. Focuses on a core function of the state: legitimate coercion. Aligns with common intuitions about residency/citizenship requirements. Explains why tourists *shouldn't* vote.
      *   **Weakness:** Maya's critique lands perfectly: "subjected" is vague and creates perverse boundaries.
          *   **The Mobility Problem:** The wealthy tourist who flies home escapes coercion, while the undocumented immigrant living there for decades is fully subjected but excluded. This feels unjust and arbitrary.
          *   **The Partial Subjection Problem:** Laws apply unevenly (zoning vs. drug laws). Does this mean partial votes? This *is* conceptually messy and impractical.
      *   **Who's Winning?** Dan effectively counters the explosion problem, but Maya's critique of "subjected" is devastating. It exposes arbitrariness and injustice within Dan's principle. **Maya wins this round decisively.** Dan's principle collapses under scrutiny.

  3.  **Dan's Retreat (Ongoing Project Principle):**
      *   **Claim:** The demos is defined by shared membership in an ongoing, collective self-governance project over time, not by single decisions (affected or subjected).
      *   **Strength:** Moves beyond transactional definitions. Captures the historical, cultural, and reciprocal nature of political community. Explains why we have stable demoi (citizen bodies) rather than fluid ones per decision. Avoids the explosion and partial vote problems.
      *   **Weakness:** Maya's circularity charge has significant force. *Who* constitutes the "ongoing project"? Saying "the people governing themselves" presupposes we know who "the people" are. It doesn't *solve* the boundary problem; it presupposes a boundary exists or pushes the question back to tradition, birth, or some other criterion that needs justification itself ("Why are *these* people part of the project?").
      *   **Who's Winning?** Dan offers a more stable and realistic conception, but Maya's circularity critique is valid. The principle *describes* how existing democracies *function* but doesn't provide a fundamental *justification* for the initial boundary. **Maya wins on logical grounds (circularity exposed), but Dan offers a pragmatically necessary concept.**

  4.  **Maya's Circularity Charge:**
      *   **Against Dan:** Lands solidly on his "ongoing project" principle. It *is* circular without an independent criterion for membership.
      *   **Against Maya's Own Principle?** Less directly. Her "affected interests" principle *does* provide an independent criterion (impact), so it's not circular in the same way. Its problem is over-inclusiveness and impracticality, not necessarily circularity. However, one *could* argue that defining "affected" precisely enough to avoid explosion might *itself* require presupposing a community boundary, creating a *different* kind of circularity or vagueness problem. But her specific charge against Dan sticks more cleanly.

  **Overall Verdict:**

  *   **Maya wins on points.** She consistently landed powerful critiques exposing deep flaws in Dan's principles (arbitrariness of "subjected," circularity of "ongoing project"). Her own principle, while radically expansive and impractical, remained internally consistent and highlighted genuine normative concerns about inclusion.
  *   **Dan identified the fatal flaw** in Maya's principle (demos explosion) and ultimately gestured towards the pragmatic reality of bounded political communities ("ongoing project"), even if he couldn't provide a watertight foundational justification for the boundary.

  **What Both Are Missing (And Your Suspicion is Spot On):**

  You are **absolutely correct.** The core issue is both treating the "demos" as a pre-existing, naturally bounded entity waiting to be discovered by the "right" principle. **The demos is a political construct, not a natural kind.** There is no single, perfect, universally applicable principle that logically *must* define it in all contexts.

  *   **The Missing Element:** Defining the demos requires **normative justification *and* pragmatic considerations.** We draw boundaries based on a mix of:
      *   **Normative Values:** Self-determination, reciprocity, fairness, preventing domination, inclusion of the subjected, feasibility of collective action, historical ties, shared identity (however constructed). No single value trumps all others absolutely.
      *   **Context & Function:** The *level* of decision matters (local zoning vs. national defense vs. global climate). The *type* of decision matters (coercive law vs. service provision). Practical constraints of administration and collective deliberation matter.
      *   **Defensible Reasons:** The key isn't finding the One True Principle, but providing **defensible reasons** for why *this* boundary is appropriate for *this* decision-making body. "Affected interests" is a *reason* for inclusion; "ongoing self-governance feasibility" is a *reason* for boundedness; "preventing domination of permanent residents by transients" is a *reason* against tourist voting.
  *   **Applying This to the Debate:**
      *   **Tourist Voting:** We reject it not solely because of "affected interests" or "coercion" flaws, but because we prioritize values like collective self-determination of the permanent community, reciprocity (tourists don't share the same long-term stake/obligations), preventing potential exploitation by outsiders, and administrative feasibility. "Affected interests" alone is insufficient justification to override these other values in this context.
      *   **Brexit:** While *impacted* globally, the *demos* was defined (controversially, but understandably) as UK citizens/residents based on norms of national self-determination, existing state boundaries, and the feasibility of organizing a vote within that unit. "Affected interests" highlights a *cost* of this boundedness but doesn't automatically mandate a different demos.
      *   **Resident Non-Citizens:** This is a harder case where the tension is clearer. Arguments *for* their inclusion often cite "subjected to coercion" and "long-term affected interests" *plus* norms of inclusion and preventing domination. Arguments *against* often cite formal citizenship, the "ongoing project" of national self-determination defined by citizenship, or concerns about integration/feasibility. It's a balancing act requiring reasoned justification, not deduction from a single principle.

  **Conclusion:** Maya won the logical battle by exposing weaknesses in Dan's principles. Dan correctly identified the impracticality of Maya's pure principle. However, **you identified the fundamental problem:** both were searching for a fixed, natural boundary defined by a single principle. The reality is messier – the demos is defined through political contestation, balancing competing values (inclusion, self-determination, feasibility, non-domination) and practical considerations within specific contexts. The "right" answer depends on the justifications offered for the boundary in question, not on discovering a universal rule.
