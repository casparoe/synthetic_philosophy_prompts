  The core challenge here is epistemological and ethical: How can we verify autonomy without imposing our values? The user recognizes that both genuine preferences and biases manifest identically as "what the patient says." Their proposed probes aim to create cognitive friction to reveal whether choices are stable or context-dependent.

  Key constraints from the query:
  - Must work within 1-2 time-pressured conversations
  - Stakes involve life-sustaining treatments
  - Cannot rely on existing frameworks (must stand alone)
  - Must acknowledge limitations and potential failures

  The user's deeper needs seem to include:
  1) Practical utility: Something immediately usable by clinicians
  2) Epistemic humility: Explicit recognition of the method's limits
  3) Value neutrality: Avoiding smuggling clinician bias into the assessment
  4) Cognitive justice: Not pathologizing reasonable preference shifts

  Notably, they specifically request at least one case where the outcome challenges the team's preferences - suggesting concern about confirmation bias. The paralysis case might be ideal for this, as adaptation could be framed as either growth or bias.

  For the procedure design, I'll need to:
  - Sequence probes to minimize leading questions
  - Define clear thresholds for "sufficient" answers
  - Build in checks for therapeutic misconception
  - Include explicit handoff points where values conflict

  The invariance probe carries particular risks:
  - May mistake nuanced consideration for inconsistency
  - Could be manipulated by clinicians through framing
  - Might disadvantage certain communication styles

  The counterpart probe risks:
  - Artificial detachment ("stranger" may feel irrelevant)
  - Over-intellectualization in vulnerable states

  In the case applications:
  - The dialysis refusal case tests framing effects
  - The paralysis case tests adaptation/embodiment
  - The futile demand case tests probe failure modes

  The most vulnerable aspect is indeed the invariance probe's validity. We must acknowledge that thoughtful people may legitimately shift when perspectives change - this isn't necessarily bias but depth of consideration. The procedure should explicitly flag this limitation.
answer: |-
  Here is a decision procedure designed for clinical ethics consultations under your constraints, followed by case applications, limitations, and an honest assessment.

  ---

  ### **Decision Procedure: Value Stability Assessment (VSA)**  
  *For 1-2 conversations, time-sensitive contexts*  

  **Goal:** Distinguish between *settled values* (authoritative) and *contextual artifacts* (requiring reconsideration), without substituting the team’s judgment.  

  #### **Step 1: Baseline Elicitation**  
  - **Ask:** *"What decision feels right to you about your treatment right now, and what are the most important reasons behind it?"*  
  - **Sufficient Answer:** Clear statement of choice + 1–2 value-based reasons (e.g., *"I refuse dialysis because I value quality over quantity of life"*).  
  - **Exit if:** Patient lacks capacity (proceed to surrogate) or choice is unequivocally settled (e.g., *"I’ve lived fully; this aligns with my lifelong beliefs"*).  

  #### **Step 2: Invariance Probe**  
  - **Method:** Rephrase the **identical clinical facts** in 2–3 contrasting but equivalent frames (order/valence shifts).  
    - *Example Frames:*  
      - Loss Frame: *"Without dialysis, most people in your situation die within weeks."*  
      - Gain Frame: *"With dialysis, some people gain months to settle affairs."*  
      - Neutral Frame: *"Dialysis adds 3–6 months on average; without it, survival is typically weeks."*  
  - **Ask:** *"Does this new information change your feelings about what you want?"*  
  - **Sufficient Answer:** Consistency ("Still refuse") or inconsistency ("Now I’m unsure").  
  - **Exit to Acceptance if:** Choice is **stable** (same answer ≥2 frames).  
  - **Exit to Reconsideration if:** Choice **flips** (e.g., refuses under loss frame but accepts under gain frame).  

  #### **Step 3: Counterpart Probe**  
  - **Ask:** *"Imagine a stranger your age, with your exact diagnosis and life situation. If they asked your advice, what would you tell them to do?"*  
  - **Sufficient Answer:** Clear recommendation ("They should refuse/accept").  
  - **Compare:** Patient’s own choice vs. counterpart advice.  
  - **Exit to Acceptance if:** **Concordant** (e.g., *"I’d tell them to refuse, like me"*).  
  - **Exit to Reconsideration if:** **Discordant** (e.g., *"I’d tell them to try it, but I won’t"*).  

  #### **Step 4: Integration & Handoff**  
  - **Accept Choice as Authoritative if:**  
    - Stable under invariance probe **AND**  
    - Concordant with counterpart probe.  
  - **License One Reconsideration Attempt if:**  
    - Fails invariance probe **OR**  
    - Discordant on counterpart probe.  
    - *Re-present facts neutrally; offer peer/support contact.*  
  - **Handoff to Human Judgment if:**  
    - Probes inconclusive (e.g., patient vacillates) **OR**  
    - Probes passed but team suspects coercion/undue influence **OR**  
    - Conflict persists after reconsideration.  
    - *Ethicist must weigh values, not facts.*  

  ---

  ### **Case Applications**  

  #### **Case 1: 81-year-old refusing dialysis after fatalistically framed prognosis**  
  - **Baseline:** Refuses dialysis. Reason: *"No point—doctor said I’ll die soon anyway."*  
  - **Invariance Probe:**  
    - Loss Frame (original): Reaffirms refusal.  
    - Gain Frame: *"Some people get extra months to see family."* → *"I still refuse; I’m at peace."*  
    - Neutral Frame: No change. → **Stable**.  
  - **Counterpart Probe:** *"I’d tell someone like me to refuse—this isn’t living."* → **Concordant**.  
  - **Outcome:** **Accept choice as authoritative.** Team’s framing may have triggered initial despair, but preference is stable.  

  #### **Case 2: Recently paralyzed patient refusing ventilator weaning**  
  - **Baseline:** *"I’d rather die than live like this."*  
  - **Invariance Probe:**  
    - Loss Frame: *"Without weaning, you’ll stay on the ventilator forever."* → Refuses weaning.  
    - Gain Frame: *"Many people adapt well to wheelchairs; weaning could help you go home."* → *"Maybe… but I still refuse."*  
    - Neutral Frame: *"Weaning might restore speech but not movement."* → Wavers (*"I need time"*). → **Unstable**.  
  - **Counterpart Probe:** *"I’d tell a stranger to try weaning. Life is precious."* → **Discordant**.  
  - **Outcome:** **License one reconsideration.** Present resources (e.g., spinal injury peer mentor). If refusal persists, handoff for values review (e.g., is this despair vs. settled belief?).  

  #### **Case 3: Patient demanding futile treatment, probes unchanged**  
  - **Baseline:** Demands experimental chemotherapy (team deems futile).  
  - **Invariance Probe:**  
    - Benefit Frame: *"This drug shrinks tumors in 5%."* → *"I want it."*  
    - Burden Frame: *"90% get severe side effects for no benefit."* → *"Still worth trying."*  
    - Neutral Frame: No change. → **Stable**.  
  - **Counterpart Probe:** *"I’d tell a stranger to fight like hell—never give up!"* → **Concordant**.  
  - **Outcome:** **Handoff to human judgment.** Probes passed, but futility is clinical. Ethicist must reconcile: Does "never give up" override futility? *This may challenge the team (undesired outcome)*.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **False Negatives for Genuine Preferences:**  
     - Patients who *deliberately* shift views when re-framed (e.g., *"The burden frame made me realize I value comfort"*) may be mislabeled "unstable."  
     - **Fix:** Handoff step captures this—ethicist investigates *why* the flip occurred.  

  2. **Fails for:**  
     - **Cognitive rigidity:** Patients who reject *any* re-framing as manipulation.  
     - **Cultural/communication gaps:** E.g., indirect communicators, distrustful patients.  
     - **Acute distress:** Probes require reflection; impossible in panic/psychosis.  

  3. **Invariance Probe Misfires:**  
     - **Mistakes depth for bias:** A hard-won change of mind (e.g., *"The gain frame showed me a path I hadn’t considered"*) appears "unstable."  
     - **Framing not truly equivalent:** Clinician’s tone/word choice may sway (e.g., "gain frame" voiced skeptically).  

  4. **Cannot Resolve:**  
     - Values conflicts (e.g., autonomy vs. non-maleficence in futility cases).  
     - Coercion/undue influence (requires investigation).  

  ---

  ### **Honest Assessment of Key Claims**  
  - **Claim 1: Stability under invariance probes indicates authenticity.**  
    - **Confidence:** Moderate (3/5). Framing effects *are* robust predictors of bias, but stability ≠ validity (e.g., stubbornness).  
  - **Claim 2: Concordance in counterpart probes reduces ego-defensiveness.**  
    - **Confidence:** High (4/5). Empirical support from decision psychology (e.g., self-distancing improves clarity).  
  - **Claim 3: The procedure avoids smuggling team bias.**  
    - **Confidence:** Low (2/5). **This is the weakest point.** Clinicians control frame selection; "neutral" is subjective. Team may subconsciously design probes to elicit "correct" flips.  
    - **Critical Risk:** Invariance probes could pathologize rational preference shifts.  

  **Least Sure Of:** **The validity of the invariance probe itself.** It assumes consistent answers reflect "truer" preferences—but humans are contextual creatures. A patient who refuses under a "burden" frame but accepts under "hope" may be engaging in adaptive reasoning, not bias.  

  ---  
  This procedure is a starting point. Field-test it, track where probes and handoffs succeed/fail, and refine. Its power lies in *forcing transparency*—not in algorithmic certainty, but in making uncertainty navigable.
