prompt: |-
  I write about science and ideas for a general-interest magazine, and I'm at work on a feature about how the replication crisis rewired the machinery of empirical research. My editor wants more than a roundup of reforms; she wants the underlying conception of evidence brought to the surface. I've hit a knot in that project that I can't untie on my own, so what I need is a careful conceptual analysis, not reporting help.

  Here is the practice that puzzles me. Across psychology, medicine, and much of experimental biology, a finding still becomes publishable only by passing through a ritual inherited from the early twentieth century: state a null hypothesis, collect data, compute the probability of results at least as extreme as yours under the assumption that the null is true, and treat 0.05 as the line between discovery and noise. In the last fifteen years, the reform movement has bolted a second set of requirements onto this one. Researchers are now asked to preregister their hypotheses and analysis plans before seeing the data; some journals accept papers based on the registered plan alone, committing in advance to publish the results however they come out; and data-peeking, flexible stopping rules, and unreported analytic choices have been rebranded from sloppiness into a species of misconduct.

  The two halves seem to pull in opposite directions, and each pulls against a third view. The significance-testing half appears to define the evidential meaning of a dataset by long-run error rates: a p-value is a property of a whole experimental procedure, including hypothetical replications you never ran. That has a strange consequence — if I commit in advance to sampling exactly 100 subjects, versus committing to peek after every subject and stop whenever the results look good, the very same final dataset can yield different p-values. Bayesians object that this is irrational: what the data tell you about a hypothesis should depend only on the data you actually obtained, not on what you might have obtained but didn't — a position philosophers of statistics call the likelihood principle. Yet the preregistration half seems to violate that principle from the other side: it says that identical numbers, produced by identical analyses, carry different evidential weight depending on the researcher's prior intentions and private discipline — the same table counts as strong evidence under a locked advance plan and as weak or tainted evidence when it emerges from flexible exploration. So my field appears to be running two philosophies of evidence simultaneously, each making the data hostage to intentions in its own way, while the Bayesian position, which would sever evidence from intentions entirely, fits neither half. And it is the Bayesians, ironically, who keep insisting that preregistration is what saves us.

  Help me reconstruct the implicit epistemology of this institutional practice. What does the combined regime — the 0.05 threshold plus preregistration — strictly presuppose about what evidence is, and what does it merely sit comfortably with? Where is the practice philosophically underdetermined, such that several rival accounts of evidence would license it as-is? Is the tension I've described real, or have I misdescribed something — for instance, is preregistration best understood as tracking the trustworthiness of the researcher rather than the evidential force of the data, in which case the two halves may not conflict at all? Some defenders of the significance-testing tradition argue that what matters is not the likelihood of the data given a hypothesis but how severely a hypothesis has been probed — how badly the test could have exposed it as false had it been false. Could that kind of view license both the threshold and the preregistration requirement at once, or does it too have to choose? Finally, and most importantly for my article: suppose the major journals abandoned p-values tomorrow in favor of posterior probabilities or Bayes factors. On your reconstruction, would preregistration still have any rationale, or would the reform movement have sawn off the branch it was sitting on — and if the latter, what would the reformed institution have to look like to remain coherent? I'd like an answer I can paraphrase for readers who have never heard of any of this, which means it had better be right.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a science writer working on an article about the replication crisis and how it changed empirical research. The editor wants the underlying conception of evidence, not just reforms. The user is stuck on the apparent conflict between traditional significance testing and newer preregistration requirements. 

  First, I need to understand the core tension they're describing. On one hand, there's the old NHST framework where p-values depend on the sampling plan. On the other, preregistration emphasizes researchers' intentions. Then there's the Bayesian view that evidence should depend only on the data. The user sees these as philosophically incompatible but wonders if they're missing something.

  Hmm... the key might be distinguishing between evidence quality versus process reliability. Preregistration isn't about the data itself but about preventing researcher bias from distorting the process. That would resolve the conflict with NHST's error-rate focus. 

  I recall Deborah Mayo's severity concept - it bridges both by requiring tests to genuinely probe hypotheses. That could unify the practices. For the Bayesian part, even if journals switched to Bayes factors, preregistration would still combat selection bias in what gets published. 

  The user's deeper need seems to be explaining this coherently to lay readers. They need clear metaphors - maybe comparing research to a manufacturing process where preregistration is quality control. The "process reliabilism" framing could work, showing how intention-tracking prevents contamination of evidence.

  Should also address what happens if p-values get replaced. Emphasize that preregistration tackles publication bias regardless of statistical method. The real enemy is noisy incentives, not any particular framework.

  Need to check if this holds up philosophically. Yes - both frequentist error control and preregistration aim at reliable knowledge production, just different aspects. The likelihood principle isn't violated because preregistration operates at the meta-level of study design.

  Final structure: 1) Present the apparent conflict 2) Resolve via process reliability 3) Introduce severity as unifying principle 4) Discuss Bayesian compatibility 5) Future-proof with publication reform rationale. Keep metaphors concrete - courtroom testimonies, factory inspections. Avoid jargon like "epistemic" for general readers.
answer: |-
  Your analysis hits the nerve of the crisis: **the implicit epistemology of the reformed system is a hybrid that prioritizes *process reliability* over pure evidential logic to combat human fallibility and incentive structures.** It's not a philosophically pure theory of evidence, but a pragmatic institutional fix. Let's dissect it:

  ### Core Presuppositions of the Combined Regime (p<0.05 + Preregistration)
  1.  **Evidence is Inherently Process-Dependent:** The evidential weight of data *cannot* be separated from *how it was generated and analyzed*. Identical numbers produced by different processes (e.g., pre-planned vs. p-hacked) are not epistemically equivalent.
  2.  **The Threat is Researcher Degrees of Freedom (RDF):** The primary obstacle to reliable evidence isn't random noise alone, but the human capacity (intentional or not) to exploit flexibility in design, analysis, and reporting to manufacture "significance" from noise or weak signals. This makes intentions and discipline epistemically relevant.
  3.  **Long-Run Error Control is Necessary but Insufficient:** Controlling long-run Type I error rates (p<0.05) is essential for declaring a "discovery," but it's vulnerable to being gamed via RDF. Preregistration is the safeguard against this gaming.
  4.  **Evidence Requires Constrained Intentions:** For data to count as strong evidence *for a specific hypothesis*, the researcher's intentions (hypotheses, analysis plan, stopping rule) must be declared *and fixed* before data collection begins. This constrains what the test "probes."
  5.  **Transparency is a Necessary Condition for Trust:** The *process* must be visible (via preregistration) for the community to evaluate the legitimacy of the evidence claim. The raw data/numbers alone are insufficient.

  ### Reconciling the Tensions
  *   **Likelihood Principle (LP) Violation?** Yes, explicitly. The combined regime *embraces* the idea that the same data table *can and should* carry different weight depending on the process (including intentions) that produced it. A significant p-value from a preregistered study *means something different* epistemically than the same p-value from an unregistered, flexible analysis. The LP is rejected as an impractical ideal in the face of RDF.
  *   **Severity Testing (Mayo):** This is **crucial** to understanding the hybrid. The reformed regime aims to ensure that a "significant" result (p<0.05) genuinely constitutes a *severe test* of the specific hypothesis H.
      *   **p<0.05:** Sets the *statistical threshold* for severity. A result passing this threshold indicates it would be *unlikely* to occur if H were *fundamentally* wrong (e.g., if the null were exactly true).
      *   **Preregistration:** Ensures the *procedural severity*. By locking down the hypothesis, analysis, and stopping rule, it prevents the researcher from:
          *   Testing countless vague hypotheses until one "sticks" (HARKing - Hypothesizing After Results are Known).
          *   Peeking at data and stopping early only when results look good (inflating Type I error).
          *   Trying numerous analysis paths and reporting only the one yielding p<0.05.
      *   **Combined:** A preregistered study yielding p<0.05 is taken as evidence that H has survived a probe that *could have found it lacking* had it been substantially false. The preregistration ensures the probe was genuinely aimed *at H* and wasn't rigged or distorted by post-hoc choices. The p-value quantifies *how unlikely* the result is under the null *for that specific, pre-defined test*.
  *   **Bayesians & Preregistration:** Why do they support it? Not because they accept the frequentist error logic, but because:
      *   Preregistration combats **selection bias** in the *literature* (publication bias, p-hacking), which corrupts the prior information Bayesians rely on. A Bayesian updating the literature needs *unfiltered* evidence.
      *   It reduces **researcher bias** contaminating the likelihood model specification. A preregistered analysis plan forces the researcher to justify their model *before* seeing if it yields favorable results.
      *   It enhances **transparency and replicability**, core scientific values shared by Bayesians. Their critique is often of NHST's *interpretation*, not the need for rigor in design and reporting.

  ### Philosophical Underdetermination
  The practice *is* compatible with several accounts *if* they incorporate a concern for process integrity against bias:
  1.  **Frequentist Error-Statistics (Mayo):** As described above, it fits neatly with severity.
  2.  **Certain Pragmatist/Reliabilist Epistemologies:** Focuses on the *reliability of the knowledge-generating process*. Preregistration + NHST is seen as a process more reliably producing true beliefs than NHST alone in a world with incentives and cognitive biases.
  3.  **Modified Bayesianism:** While pure subjective Bayesianism clashes (LP), Bayesians concerned with **objective methods** or **calibration** can see preregistration as essential for ensuring the reported likelihoods/Bayes factors are *honest* (not cherry-picked) and that the prior literature (used to form priors) isn't corrupted.

  ### The Future: Abandoning p-values?
  **Preregistration's rationale survives the death of p<0.05.** Its core purpose is independent of the specific statistical paradigm:
  1.  **Combating Selection & Researcher Bias:** Whether journals publish based on p-values, Bayes factors, posterior probabilities, or effect sizes with CIs, the threats of publication bias, p-hacking, HARKing, and undisclosed flexibility remain. Preregistration is the primary tool to mitigate these.
  2.  **Ensuring Severity/Probing:** Any claim of "strong evidence" requires that the hypothesis was genuinely tested. Preregistration forces explicit declaration of the hypothesis and the planned test/estimation procedure *before* data collection, regardless of the inferential statistic used. Did you *really* test H, or did you just find a pattern and label it H afterwards?
  3.  **Transparency & Replicability:** These are fundamental scientific norms. Knowing *exactly* what was planned vs. what was done is essential for evaluating and replicating *any* result, Bayesian or otherwise.

  **What the Reformed Institution Needs for Coherence:**
  *   **Registered Reports:** This is the *ideal* endpoint, fully embracing the process-reliability epistemology. Journals commit to publishing based *solely* on the importance of the question and the rigor of the preregistered method, *before* results are known. The results, whatever they are, are published. This directly attacks publication bias and outcome switching.
  *   **Focus on Estimation & Uncertainty:** Moving beyond dichotomous "significant/non-significant" thinking towards reporting effect sizes with confidence/credible intervals. Preregistration ensures these estimates aren't biased by selection or flexible analysis.
  *   **Emphasis on Methodological Transparency:** Preregistration, open data, open code, detailed methods – all become central pillars, regardless of the statistical inferential tool (p-values, Bayes factors, CIs).

  ### For Your Readers: The Simple Analogy
  > "Think of research like a courtroom. The data are the evidence. The p-value is like a judge's threshold for 'reasonable doubt.' But what if the prosecutor could run dozens of secret trials, only bringing forward the one case where the evidence *looked* convincing by chance? Or if they could change their accusation *after* seeing the evidence? That's the problem preregistration solves. It forces scientists to state their case (hypothesis) and their investigation plan *before* they see the evidence (data). The 'p<0.05' rule sets a strict standard for how surprising the evidence must be to convict the null hypothesis. Preregistration ensures the trial was fair and focused. Even if we changed the legal standard (e.g., using Bayesian probabilities), we'd still need preregistration to ensure the trial itself was conducted properly and honestly. The goal is trustworthy evidence, and that depends on *how* the evidence was gathered, not just the numbers themselves."

  This framing emphasizes the core: **The replication crisis revealed that evidence isn't just in the numbers; it's in the integrity of the process that produced them. The reformed system (p<0.05 + preregistration) is an institutional mechanism to enforce that integrity.** The tension you identified stems from trying to graft a process-safeguard (preregistration) onto a statistical framework (NHST) that wasn't designed with modern RDF in mind, but the underlying logic of preventing bias is coherent and necessary even beyond NHST.
