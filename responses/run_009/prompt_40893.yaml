prompt: |-
  quick context: i'm a phd student in development econ and for reasons i still dont fully understand i'm on the allocation committee of a small student-run giving fund. we hand out maybe $80k a year, mostly donations people pledged at graduation. we've accumulated a track record of decisions and next week there's an application i genuinely can't call, so help me figure out what we'd have to say to stay consistent with ourselves.

  our precedents, roughly:

  1. approved, full ask (~$40k): bednet distribution. the bog standard one, deaths averted per dollar, the whole thing.
  2. approved, half ask: an unconditional cash transfer program, after a long argument about whether recipients would "waste" it. the committee didn't care, the RCT evidence was good.
  3. rejected: a grant to a local tenant union doing organizing around housing policy. the writeup said outcomes were unattributable and speculative, which honestly could describe half of waht we've funded.
  4. approved with conditions: a fellowship that places grad students into civil service jobs (regulatory agencies, ministries, that kind of thing). the defense at the meeting was leverage — one good person in the right ministry is multiplicative. nobody pretended we could measure it.
  5. rejected: an application to fund career coaching that pushes people into earning-to-give finance jobs. the reasoning in the minutes was replaceability — the counterfactual hire donates nothing, so the donations aren't really attributable to the person, so why fund the pipeline.
  6. rejected: an intervention that was extremely measurable (genuine RCT, effect sizes, the works) but delivered through a partnership with a company that has awful labor practices in its supply chain. we turned it down even though on pure cost-effectiveness it beat the bednets.

  the new application: a mid-career guy wants a two-year personal stipend (~$35k/yr, it's salary-gap funding) to leave his job at an agricultural research nonprofit and go work at a facial recognition company that sells to governments, at roughly 4x his salary, with a signed pledge to donate 50% of post-tax income to our top charities. the personal fit is real, he'd genuinely get hired, and the company's product is — let's say — not obviously good for the world. nothing cartoonishly evil, but the kind of thing people would protest if our university partnered with it.

  my questions:

  - if we want to be consistent with our own track record, what should we decide? give me a best guess and the reasons for preferring it.
  - what are the candidate rules that fit the precedents about equally well, and what does each one predict on this case? i can see at least a measurability rule (which anyway doesn't cleanly survive precedent 6), the replaceability rule from #5, the leverage/multiplier rule from #4, and whatever anti-institutional principle explains #6, and i'm pretty sure they don't all agree here.
  - which precedent is the closest analog, and is it genuinely analogous or just superficially similar?
  - if the precedents underdetermine the decision, what principle are we adopting with each choice? concretely: if we approve, what are we committed to the next time someone wants to earn to give somewhere gross, and does the replaceability objection from #5 just evaporate? if we reject, does the leverage rule from #4 survive at all, or do we have to admit the fellowship only squeaked through because ministries are ideologically comfortable?
  - and what case, if it landed next month, would best tell the competing rules apart? i want to design the discriminating case on purpose, not stumble into it at 11pm before a meeting again.
reasoning: |-
  Hmm, the user is a PhD student in development economics who's on the allocation committee of a small student-run giving fund. They're facing a tricky application and want to be consistent with their past decisions. Let me understand their precedents first.

  Looking at the precedents: They approved a bednet distribution (measurable impact), approved cash transfers despite "waste" concerns (evidence-based), rejected tenant union organizing (unattributable outcomes), approved a civil service fellowship (leverage argument), rejected career coaching for earning-to-give finance jobs (replaceability issue), and rejected an RCT-backed intervention due to unethical corporate partnership.

  Now the new application: A mid-career professional wants stipend funding to switch from an agricultural research nonprofit to a facial recognition company (with problematic government clients) at 4x salary, pledging to donate 50% post-tax income to top charities. Key elements: personal fit is good, company's work is ethically questionable but not cartoonishly evil, and he'd likely get hired.

  To answer the user's questions systematically:

  For consistency with track record: I'm leaning toward rejection. The replaceability principle from precedent #5 applies strongly here - the facial recognition company would hire someone else if not this applicant, so the donation pledge isn't truly additional. Precedent #6 shows they care about institutional ethics beyond pure cost-effectiveness. The leverage argument from #4 is weaker here because government ministries have clearer public good potential than a private facial recognition firm.

  Candidate rules that fit precedents:
  1) Replaceability principle (predicts rejection)
  2) Institutional ethics filter (predicts rejection)
  3) Leverage/multiplier rule (predicts approval)
  4) Measurability (predicts approval but weak given #6)

  Closest analog is precedent #5 (earn-to-give pipeline rejection), but with differences: This is mid-career, personal pledge rather than pipeline, specific salary-gap funding.

  If they approve: They'd need to accept future earn-to-give requests unless they distinguish based on ethical thresholds of employers. Replaceability objection doesn't fully evaporate but becomes secondary to donation scale.

  If they reject: Leverage rule survives only for clearly public-aligned institutions (like ministries). They'd need to define this boundary explicitly.

  Best discriminating case to design: Someone leaving corporate job for government antitrust agency role with donation pledge. Tests whether leverage location (government vs private) or ethical employer status matters more.

  The user seems to want both practical decision-making help and conceptual clarity on their principles. They're frustrated by inconsistent precedents and want to avoid late-night committee debates. Underneath, they might be wrestling with how utilitarian principles interact with institutional ethics in philanthropy - a tension in development economics practice. I should provide clear frameworks while acknowledging where precedents genuinely conflict.
answer: |-
  Based on your precedents, here's a clear analysis for consistency, candidate rules, and implications:

  ### 1. **Likely Consistent Decision: REJECT**
     - **Core Reason:** **Replaceability + Institutional Ethics**  
       Precedent #5 (rejected career coaching) established that funding pipelines to high-earning jobs is rejected when the *counterfactual hire* would not donate. Here, the facial recognition company will hire *someone* for that role regardless. Your $70k stipend isn't creating a new donation stream—it's redirecting existing salary to a donor-preferred candidate. The "additionality" fails, just like in #5.
     - **Secondary Reason:** **Institutional Taint (Precedent #6)**  
       The facial recognition firm's government contracts (even if "not cartoonishly evil") mirror the "awful labor practices" in #6. You rejected measurable impact due to institutional harm; here, you'd enable someone to directly empower that institution. Precedent #4 (fellowship) survives because ministries are public-serving institutions, not ethically contested private actors.

  ### 2. Candidate Rules & Predictions for This Case:
  | **Rule** | **Fits Precedents?** | **Prediction for New App** | **Why?** |
  |----------|----------------------|----------------------------|----------|
  | **Replaceability** | Strong (#5); Implied in #1, #2, #4 | REJECT | Counterfactual hire donates nothing; no new donations created |
  | **Institutional Ethics Filter** | Strong (#6); Implied in #3 (tenant union's "speculative" outcomes may mask discomfort) | REJECT | Firm's govt surveillance work violates a harm threshold |
  | **Leverage/Multiplier** | Strong (#4); Weak in #1, #2 | APPROVE | High earnings + pledge = massive downstream donations |
  | **Measurability** | Weak (#1, #2, #6 reject it) | APPROVE (but weak) | Donations are highly measurable, but precedents ignore this when other rules conflict |

  ### 3. Closest Analog: Precedent #5 (Career Coaching)
     - **Superficially Similar:** Both involve funding a pipeline to high-earning jobs for donations.  
     - **Key Difference:** #5 was a *program* creating *many* earn-to-give candidates; this is a *single individual* with proven fit.  
     - **Genuinely Analogous? YES on replaceability.** The core objection (funding doesn't create *new* donations) is identical. The scale difference doesn’t change the principle.

  ### 4. Implications of the Decision:
  - **If APPROVED:**  
    - **Commitment:** You accept "earn-to-give in ethically gray institutions" if the math works.  
    - **Replaceability Objection (#5) Evaporates?** Yes, unless you distinguish based on *employer harm* (e.g., "We allow it only if the employer isn't harmful").  
    - **Leverage Rule (#4) Survives?** Yes, but now extends to *any* high-leverage role (corporate/controversial included).

  - **If REJECTED:**  
    - **Leverage Rule (#4) Survives?** Only for *public-serving* institutions (ministries, agencies). You draw a line: leverage is valid only where institutional goals align with public good.  
    - **Replaceability (#5) Upheld:** Still a veto for pipeline funding.  
    - **New Principle:** Institutional ethics > leverage/donations when counterfactual impact is murky.

  ### 5. Discriminating Case to Test Competing Rules:  
  **"The Antitrust Regulator Pledge"**  
  *Application:* A lawyer wants stipend funding to leave corporate law ($400k salary) for a $90k role at a government antitrust agency. They pledge 25% of their *lifetime* earnings differential to bednet charities.  

  **Why This Discriminates:**  
  - Tests **Replaceability vs. Leverage vs. Institutional Ethics**:  
    - *Replaceability*: Would the agency hire someone else? (Likely yes → lean reject).  
    - *Leverage*: Antitrust work could prevent monopolies/harm (high leverage → lean approve).  
    - *Institutional Alignment*: Government agency is public-serving (like #4 → lean approve).  
  - **Decision Clarity:**  
    Approving this but rejecting the facial recognition case clarifies that **institutional alignment** is your key filter. Rejecting both elevates **replaceability** above leverage. Approving both collapses ethics entirely.

  ### Final Recommendation:  
  Reject the application to stay consistent with **replaceability (#5)** and **institutional ethics (#6)**. Precedent #4’s leverage is distinguishable because ministries are *inherently* public-goods-oriented, while this firm is not.  

  **To Resolve Ambiguity:** At your next meeting, formalize a hierarchy:  
  > *"Replaceability > Institutional Ethics > Measurability. Leverage is only valid for institutions aligned with public welfare."*  

  This preserves your core precedents while preventing slippery slopes into funding ethically fraught earn-to-give pipelines.
