prompt: |-
  I am a PhD student in philosophy of science, and my department houses a research institute that runs a small internal grant scheme. Twice a year, the institute awards "sustained-line" grants of £8,000–£15,000 to junior researchers pursuing a line of work over several years; applicants may reapply in successive rounds, so the scheme effectively decides which local research programmes to keep feeding and which to starve. The committee is six people, mostly empirical scientists, with me as the resident methodologist; we have one afternoon per round for eight to twelve proposals, every decision needs a one-paragraph justification sent to the applicant, and the institute director signs off on the final list. At present the decisions are made on vibes, and after a seminar I gave, the director has asked me to write a decision procedure grounded in Lakatos's methodology of research programmes — his idea being that we should ask whether a proposal's parent programme is progressing or degenerating rather than trading impressions about "impact." So the rubric should turn the standard apparatus to work: the hard core and protective belt, the positive and negative heuristic, theoretical and empirical progress, degenerating problem shifts, and the question of when a belt repair counts as ad hoc.

  The translation is harder than it sounds, and I want the procedure to be honest about that rather than launder our intuitions through vocabulary. First, the obvious asymmetry: as I understand it, Lakatos himself granted that his methodology mostly adjudicates with hindsight, whereas we have to render verdicts prospectively on a decade of an applicant's future. Second, the ad hocness judgment: whether a new auxiliary postulate is a legitimate belt repair or a fudge is precisely the thing scientists dispute for years, so the procedure has to say who counts as a competent judge and what evidence they should point to. Third, the drought problem: a programme can sit in a long degenerating phase and then turn around — Lakatos made much of Prout's programme, whose central claim seemed refuted by the best atomic-weight measurements for roughly a century before coming right — so a rule that defunds anything degenerating for five years will periodically kill future successes. The procedure should state explicitly where it degrades back into committee judgment, and where the question in front of us is really one of values (say, whether the institute should hedge across several programmes or concentrate) that no methodology can settle.

  Please run the finished procedure on three cases, using plausible invented details where needed: (1) an established programme with a strong past record of novel predictions, now ten years into a run of anomalies and unexplained residuals, asking for a further round; (2) a young programme with no novel predictions to its name, whose applicants argue its heuristic is unusually powerful and that its hard core will only become testable after several more years of work; and (3) a Prout-style case, where the programme's central claim is currently contradicted by the best measurements but keeps generating a steady stream of new sub-problems and refinements. I should confess my own priors: I am inclined to fund case (2) and defund case (1), and I half expect to want case (3) killed on instinct. I would like you to tell me plainly, for each, what the procedure actually yields — including whether it turns out that my priors, not the methodology, were doing the work all along — and to close by saying what the procedure cannot do.
reasoning: |-
  Okay, the user is a PhD student in philosophy of science tasked with designing a grant decision procedure based on Lakatos's methodology. They've outlined several challenges: the methodology is retrospective by nature, judging ad hocness is contentious, and there's the "drought problem" where degenerating programs might later succeed. They also want the procedure to be transparent about where committee judgment takes over. 

  Hmm, the user's priors are interesting—they lean toward funding untested young programs over stagnant established ones, and are skeptical of Prout-style cases. That might reflect a bias toward novelty or risk-taking, which the procedure should acknowledge but not codify. 

  First, I need to translate Lakatos's concepts into operational criteria: hard core (untouchable axioms), protective belt (adjustable theories), heuristics (how the program guides research), progress (novel predictions), degeneration (only explains known facts post-hoc). But the real difficulty lies in prospective judgments. 

  For asymmetry: We can't predict the future, so the procedure must focus on *current trajectory*—tracking shifts in problem-solving effectiveness over recent years. For ad hocness: Instead of ruling on disputes, we'll require applicants to *demonstrate* legitimacy (e.g., new predictions, cross-validation). For drought: Explicitly permit "probationary funding" if there's a credible pivot plan. 

  The rubric should have three layers: 
  1. **Lakatosian metrics** (objective-ish): Track progress/regress via publication outputs, prediction success rates, anomaly resolution timelines. 
  2. **Committee judgment gates** (subjective): When metrics are ambiguous (e.g., is this repair *really* non-ad hoc?), defer to expert debate with clear reasoning requirements. 
  3. **Value-based overrides** (transparent): If methodology is inconclusive, state whether funding hinges on diversity hedging or high-risk bets. 

  Testing on the cases: 
  - **Case 1 (stagnant program):** Metrics show degeneration (10 years of anomalies + declining output). Procedure likely defunds unless they propose a major pivot. User's prior aligns here. 
  - **Case 2 (young program):** No metrics yet, but if heuristics are rigorous and testability is near, probationary funding possible. User's bias toward novelty is supported—but only if the program isn't just hand-waving. 
  - **Case 3 (Prout-style):** Degenerating by metrics, but if anomaly resolution attempts are theoretically fertile (e.g., spawning new instruments/math), probation could apply. User's instinct to kill it might overcorrect—Lakatos would caution against premature abandonment. 

  Biggest limitation: The procedure can't resolve value conflicts (e.g., "should we fund 10 high-risk programs or 5 safe bets?"). It only makes those tradeoffs visible. Also, it won't prevent committees from gaming metrics—but transparency forces them to justify it. 

  ...The user might be underestimating how much their priors shape Case 3. If "steady refinements" lack empirical teeth, their instinct is right; if those refinements enable new tests, Lakatos would urge patience. The procedure exposes that tension instead of hiding it.
answer: |-
  Based on your requirements, here's a decision procedure grounded in Lakatos's Methodology of Scientific Research Programmes (MSRP), explicitly addressing its limitations and incorporating committee judgment gates. The rubric operates in three phases, with clear degradation points:

  **Lakatosian Grant Decision Procedure**  
  *(With Explicit Degradation Points)*  

  **Phase 1: Programme Assessment**  
  *(Objective: Classify programme trajectory)*  
  - **A. Progress/Degeneration Metrics**:  
    - *Theoretical Progress*: Does the programme generate new sub-problems, unify disparate phenomena, or open new domains? (Require specific examples in application)  
    - *Empirical Progress*: Ratio of *novel predictions confirmed* vs. *anomalies explained post-hoc* over the last 3–5 years. Track:  
      - Novelty-to-confirmation lag time (≤2 years = strong)  
      - Anomaly resolution rate (% resolved within funding cycle)  
  - **B. Heuristic Vitality**:  
    - *Positive Heuristic*: Is there a clear, fertile roadmap for belt adjustments? (Require timeline for next testable predictions)  
    - *Negative Heuristic*: Has the hard core been protected *without excessive* ad hocness? (Flag if >50% belt adjustments lack novel predictions)  
  - **C. Ad Hocness Judgment**:  
    - Auxiliary hypothesis is *non-ad hoc* **only if** it:  
      (a) Predicts *new* phenomena beyond the anomaly it fixes, OR  
      (b) Is independently testable (e.g., via new instrumentation proposed), OR  
      (c) Unifies with another programme's belt.  
    - *Degradation Point*: If ad hocness is disputed, committee votes with written justifications citing (a)–(c).  

  **Phase 2: Funding Recommendation**  
  - **Progressing**: Fund if resources allow. *Priority* to programmes with:  
    - High anomaly resolution rate + short prediction-confirmation lag  
  - **Degenerating**: Defund **unless**:  
    - Anomalies are resolving *faster* than they accumulate, OR  
    - Applicant presents a *pivot plan* (new instruments/techniques) with ≥2 novel predictions in the next cycle.  
  - **Nascent Programmes** (no predictions yet):  
    - Fund **only if**:  
      (a) Hard core testability is achievable within 2 funding cycles (require technical roadmap), AND  
      (b) Positive heuristic has generated ≥3 testable sub-problems.  
  - *Degradation Point*: "Pivot plan" viability judged by committee.  

  **Phase 3: Values Override**  
  - Explicitly state if decision hinges on:  
    - **Portfolio Balance**: (e.g., "Funding maintained for diversification despite degeneration concerns")  
    - **High-Risk Hedge**: (e.g., "Nascent programme funded for potential high-reward despite untested heuristic")  
    - **Institutional Priority**: (e.g., "Defunded despite progress due to strategic misalignment")  

  **Procedure Limitations (Stated in Rubric)**  
  1. **Hindsight Bias**: MSRP optimized for historical analysis; prospective judgments carry high uncertainty.  
  2. **Ad Hocness Arbitration**: Competent judges = domain experts + methodologists; evidence must reference testability timelines.  
  3. **Drought Tolerance**: Programmes degenerating <5 years may receive "probationary funding" if anomaly resolution rate >60%.  

  ---  
  **Application to Cases**  
  *Assumptions for plausibility:  
  - Funding cycle = 2 years; "novel prediction" = published in advance of data collection*  

  **Case 1: Stagnant Established Programme**  
  - *Details*: 10 years of anomalies; 12 unresolved residuals; last novel prediction 9 years ago. Current proposal adjusts detector calibration to explain residuals (no new predictions).  
  - **Assessment**:  
    - Empirical progress: **0/10** novel predictions last 5 years; anomaly resolution rate **15%** (degenerating).  
    - Ad hocness: Calibration fix purely explanatory → **ad hoc** (fails a–c).  
    - Heuristic: Negative heuristic rigid; no pivot plan.  
  - **Decision**: **Defund** (meets degenerating criteria without exemptions).  
  - *Vs. Your Prior*: Aligns. Methodology overrides "past glory" bias.  

  **Case 2: Young Programme with Delayed Testability**  
  - *Details*: "Cognitive Archaeology" programme. Hard core: "Neural processes fossilize in artifact-design choices." Belt: Bayesian model of toolmaking transitions. Positive heuristic: Phase 1: Simulate neural constraints → Phase 2: Predict artifact patterns in unexcavated sites. Requests funding for Phase 1 (no empirical tests yet).  
  - **Assessment**:  
    - Empirical progress: **N/A** (no predictions yet).  
    - Theoretical progress: Generated 4 testable sub-problems (e.g., "If neural constraint X exists, later tools should lack feature Y").  
    - Heuristic: Roadmap shows testability in 3 years (next cycle).  
  - **Decision**: **Fund** (meets nascent programme criteria: sub-problems exist + testability timeline).  
  - *Vs. Your Prior*: Aligns. Methodology supports heuristic fertility over current impact.  

  **Case 3: Prout-Style Contradicted Programme**  
  - *Details*: "Varying Constants Cosmology" – hard core: "Fundamental constants vary at cosmic scales." Best measurements show constants stable. Belt adjustments propose new telescope calibration methods to detect variation. Generated 8 sub-theories (e.g., "If constant α varies, quasar spectra should show Z-distortion").  
  - **Assessment**:  
    - Empirical progress: **0/5** novel predictions confirmed; anomalies (stable constants) persist 7 years.  
    - Theoretical progress: **High** (new sub-theories, mathematical tools developed).  
    - Ad hocness: Calibration methods predict *new* spectral distortions → **non-ad hoc** (criterion a).  
    - Anomaly resolution rate: **10%** (degenerating), but pivot plan: new telescope partnership in 18 months.  
  - **Decision**: **Probationary Fund** (Degenerating but: non-ad hoc repairs + theoretical fertility + pivot plan).  
  - *Vs. Your Prior*: Contradicts your instinct. Methodology saves it via non-ad hocness + heuristic vitality. Your prior may undervalue theoretical progress in Lakatos.  

  ---  
  **What the Procedure Cannot Do**  
  1. **Resolve Genuine Scientific Disagreements**: Ad hocness/fertility debates reduce to committee vote + justification.  
  2. **Predict Turnarounds**: The Prout case survives due to *current* non-ad hocness, not future promise.  
  3. **Replace Values**: If 8/12 proposals pass MSRP, portfolio balance (e.g., "defund weakest progressing programme to fund high-risk nascent one") is a *values* decision.  
  4. **Prevent Gaming**: Applicants can "Lakatos-wash" proposals with strategic vocabulary (mitigation: require technical specifics).  

  **Conclusion**: Your priors drove Cases 1 and 2 correctly but conflicted with Lakatos in Case 3. The methodology forced funding the Prout-style programme by prioritizing *how* anomalies are handled over their existence. Crucially, **the rubric makes transparent where "judgment calls" occur** (ad hocness votes, pivot viability) and **where values supersede methodology** (portfolio allocation). This satisfies Lakatos’s core demand: evaluating programmes by their problem-shift *dynamics*, not snapshots of "refutation" or "impact."
