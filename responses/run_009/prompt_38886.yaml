prompt: |-
  I'm a PhD student in statistics serving a two-year term as the graduate representative on my university's Doctoral Fellowship Committee, which allocates about 120 internal dissertation fellowships a year. A dispute has broken out, and I've been asked to draft the memo that will frame our meeting this Thursday. The committee wants a written recommendation it can act on, and I want the statistical reasoning to be right rather than merely soothing.

  Here are the facts. Over the last three years, applicants who entered the PhD with a master's degree earned elsewhere (roughly 40% of the pool) won fellowships at a 27% rate overall, versus 43% for students who entered directly from a bachelor's degree. On the strength of those aggregate numbers, one member — call her Professor A — argues the review process is biased against external master's students and is pushing for anonymized review plus a mandatory bias workshop. But when our provost's office broke the results down by the three divisions — humanities, social sciences, and natural sciences/engineering — the pattern reverses in every single one: within each division, external master's students succeed at a modestly higher rate than direct-entry students. External master's students simply apply disproportionately to humanities, where everyone's success rate is low.

  Professor A says the divisional breakdown is a smokescreen and that applicants experience the aggregate world, not a division-adjusted one. A second member, Professor B, says the disaggregated figures are the only honest ones, and that the real problem is that the divisional allocation formulas shortchange humanities — so we should reallocate fellowships across divisions rather than touch the review process. A third member suspects both are wrong but can't articulate why. Meanwhile the Graduate Student Association is preparing a public statement, so whatever we do will be scrutinized.

  Please draft the memo from my seat on the committee, recommending a concrete course of action with a time frame the committee could actually follow. It should take Professors A and B each seriously — the strongest version of each position deserves a fair hearing, not a caricature. Pay particular attention to which comparison (aggregate or division-by-division) answers which question, and to whether anything about the students' own choices — for instance, which division someone applies to, and whether that choice is itself shaped by having done an external master's — could make even the disaggregated numbers misleading. Where the memo takes a contested step in its reasoning, it should flag that step rather than paper over it. Finally, it should close with a short section stating explicitly what evidence or argument would lead you to recommend the opposite course, and where the analysis is most likely to fail. Hard limit: 900 words total. I would rather cut prose than cut the counter-considerations.
reasoning: |-
  Okay, the user is a PhD student in statistics serving on a Doctoral Fellowship Committee. They need to draft a memo addressing a dispute about fellowship allocation rates between students who entered with an external master's degree and those who entered directly from a bachelor's program. 

  First, let's unpack the core conflict. The aggregate data shows external master's students have lower success rates (27% vs 43%), suggesting possible bias. But when disaggregated by division (humanities, social sciences, natural sciences/engineering), the pattern reverses in every category. This classic Simpson's Paradox situation means both Professors A and B are technically correct from their chosen perspectives, but neither tells the full story.

  Hmm... the user's role as statistician-graduate rep is crucial here. They must bridge technical rigor with committee diplomacy. The memo needs to: 1) Acknowledge both professors' concerns as valid 2) Explain why neither aggregate nor disaggregated data alone suffices 3) Propose actionable steps that address equity without overcorrecting.

  The landmines to navigate: Professor A's valid point about lived experience of aggregate outcomes versus Professor B's statistical argument about conditional probabilities. Also, the GSA's impending statement raises stakes - whatever we recommend must withstand public scrutiny.

  Key statistical nuances: 
  - Must examine whether division choice mediates the master's degree effect (e.g., do external master's students disproportionately pursue humanities due to field norms?) 
  - Should check if success-rate disparities persist within subfields (e.g., if all history applicants struggle, but external MA history students still outperform direct-entry, that matters)
  - Need to verify divisional allocation fairness separately from bias concerns

  For the recommendation... A tiered approach makes sense: short-term transparency fixes (like Professor A's anonymization) while gathering better data to evaluate Professor B's reallocation proposal. The 4-week review period is realistic given Thursday's meeting.

  The counterfactual section is smart - shows intellectual honesty. Should emphasize that if we find no field-specific bias AND humanities' low rates stem from underfunding rather than applicant quality, then reallocation becomes urgent. Also must flag that committee's willingness to act on findings is the biggest vulnerability.

  ...Wait, did I address the "students' choices" angle sufficiently? Added language about how field selection could correlate with prior degree type - that's often overlooked in these debates. Also made sure to distinguish between statistical fairness (equal probability conditional on qualifications) versus distributive fairness (humanities getting fewer slots).

  Word count is tight but manageable by cutting examples rather than logic. The provost's existing breakdown helps - we don't need to redo that analysis. Focus on next-level questions.
answer: |-
  **MEMORANDUM**  
  **TO:** Doctoral Fellowship Committee  
  **FROM:** [Your Name], Graduate Representative  
  **DATE:** October 26, 2023  
  **SUBJECT:** Framework for Evaluating Fellowship Allocation Equity & Recommended Actions  

  ### **I. Summary of the Conflict**  
  The committee faces two competing interpretations of fellowship success rates:  
  - **Aggregate Data (3-year pool):** External master’s applicants (40% of pool) succeed at **27%** vs. **43%** for direct-entry bachelor’s applicants.  
  - **Divisional Data:** Within *each* division (humanities, social sciences, natural sciences/engineering), external master’s students succeed at **modestly higher rates** than direct-entry peers.  

  Professor A argues aggregate disparity implies bias in review, advocating anonymized review + bias training. Professor B contends divisional data reveals no bias, instead attributing disparities to humanities’ underfunding and disproportionate external master’s applications to humanities (where success rates are low overall).  

  This memo clarifies which questions each comparison answers, identifies limitations, and proposes a time-bound course of action.  

  ---

  ### **II. Interpreting the Data: What Each Comparison Answers**  
  #### **A. Aggregate Comparison (27% vs. 43%)**  
  - **Answers:** *"What is the overall success probability for an average external master’s applicant vs. a direct-entry applicant?"*  
  - **Strength:** Reflects the lived experience of applicants navigating the *unadjusted* system.  
  - **Weakness:** Masks confounding factors (e.g., divisional allocation, applicant pool composition). If external master’s students disproportionately apply to divisions with lower success rates (e.g., humanities), aggregate rates will be depressed *even with no bias in review*.  
  - **Professor A’s valid concern:** Systemic outcomes disadvantage external master’s students as a group. Equity requires addressing this outcome regardless of mechanism.  

  #### **B. Divisional Comparison (Higher rates for external master’s within divisions)**  
  - **Answers:** *"Conditional on applying to the same division, is an external master’s applicant more or less likely to succeed than a direct-entry applicant?"*  
  - **Strength:** Controls for divisional funding disparities and field-specific review norms. Current data suggests **no bias against external master’s students *within* divisions.**  
  - **Weakness:**  
    1. **Field Selection Bias:** If external master’s degrees correlate with choosing lower-success-rate fields (e.g., due to career paths or prior training), divisional rates may still mask inequitable barriers *pre-application*.  
    2. **Subfield Variability:** Divisions are broad. If external master’s students cluster in subfields with higher/lower success rates *within* a division, the effect could be obscured.  
  - **Professor B’s valid concern:** Reallocating fellowships across divisions may better address root causes if humanities’ low rates reflect underfunding relative to applicant quality/volume.  

  ---

  ### **III. Recommended Course of Action & Timeline**  
  **Core Principle:** Aggregate inequity requires intervention, but the *nature* of intervention depends on whether the driver is bias in review, field selection effects, or divisional allocation. We lack evidence to distinguish these. Thus:  

  #### **PHASE 1: Immediate Transparency & Bias Mitigation (Weeks 0–4)**  
  - **Action 1:** Implement **anonymized review** for all divisions starting next cycle (eliminates *unconscious* bias in evaluation). *Timeline: January 2024 cycle.*  
  - **Action 2:** Require **bias training** for all reviewers. *Timeline: December 2023 workshop.*  
  - **Rationale:**  
    - Anonymization is low-cost, minimally disruptive, and addresses plausible bias risk (even if unproven).  
    - Professor A’s core demand is met, signaling responsiveness to applicant experience.  

  #### **PHASE 2: Root-Cause Analysis (Weeks 4–12)**  
  - **Action 3:** Commission working group (statistician + divisional reps) to analyze:  
    - Success rates by **subfield** (not just division) and prior degree.  
    - Application patterns: Do external master’s students disproportionately target subfields with lower funding?  
    - Reviewer score data: Is there disparity in *scores* (anonymized or not) conditional on application materials?  
    - **Deadline: Preliminary report by February 1, 2024.**  
  - **Action 4:** Audit divisional allocation formula for alignment with applicant pool size/quality. *Deadline: March 1, 2024.*  
  - **Rationale:**  
    - Tests Professor B’s reallocation hypothesis and identifies if "field selection" explains disparities.  
    - Ensures Phase 1 anonymization does not mask deeper structural issues.  

  #### **PHASE 3: Final Recommendations (By April 2024)**  
  Based on Phase 2 findings, recommend:  
  - **A.** No further changes (if anonymization + data confirm no systemic bias).  
  - **B.** Adjust divisional allocations (if humanities is underfunded relative to applicant quality).  
  - **C.** Targeted support for external master’s applicants in high-competition fields (if selection effects are dominant).  

  ---

  ### **IV. What Would Change My Recommendation?**  
  I would recommend *prioritizing Professor B’s reallocation proposal* (skipping Phase 1 anonymization) **only if**:  
  1. Phase 2 analysis shows **no significant difference** in anonymized reviewer scores by prior degree within subfields, AND  
  2. Data proves humanities’ low success rates are **strictly due to underfunding**, not applicant quality.  

  Conversely, I would support *Professor A’s full demands immediately* (including quotas) **only if**:  
  1. Phase 2 reveals **lower reviewer scores for external master’s applicants** in anonymized historical data, or  
  2. Subfield analysis shows they succeed less *even in identical subfields* with similar credentials.  

  ---

  ### **V. Key Vulnerabilities in the Analysis**  
  1. **Unobserved Confounders:** We lack data on applicant strength (e.g., GPA, letters). If external master’s applicants are systematically stronger, even divisional rates may understate bias.  
  2. **Field Selection Agency:** If external master’s students *freely choose* high-competition fields, is aggregate disparity still "unfair"? This is normative, not statistical.  
  3. **Anonymization Limits:** Anonymization cannot fix bias in how materials are written (e.g., master’s students may frame projects differently).  

  This plan addresses equity concerns immediately while pursuing evidence-based structural reform. I move we vote on Phase 1 actions this Thursday.  

  Respectfully submitted,  
  [Your Name]  
  Graduate Representative, Doctoral Fellowship Committee  

