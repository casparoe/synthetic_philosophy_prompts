answer: |-
  ## Discussion Piece: Lewis's Temporary Intrinsics Argument and the Endurantist's Resilience

  **Professor,** as requested, I'll begin with a concise brainstorm of the main endurantist replies to Lewis's argument from temporary intrinsics, before developing a focused argument for why this argument, while potent, fails to *establish* perdurantism. My role is that of a metaphysician sympathetic to endurantism's core intuition but critical of underdeveloped versions.

  **Brainstorm of Key Endurantist Replies:**

  1.  **Indexicalism (Relational/Time-Indexed Properties):** Properties like *bent* or *straight* are not monadic but relational. "The poker is bent" is elliptical for "The poker is bent-at-t." The poker bears the relational property *bent-at-t1* and *straight-at-t2*. Contraries are held relative to different relata (times), not *simpliciter*.
  2.  **Adverbialism (Manner-Modified Instantiation):** The poker instantiates the property *bent*, but it does so *in a certain temporal manner* – it instantiates-bent-ly-at-t1 and instantiates-straight-ly-at-t2. The modification concerns *how* the property is held, not the property itself or the object's parts.
  3.  **Presentism/Growing Block Ontology:** Only the present time (Presentism) or the present and past times (Growing Block) exist. At t1, only "The poker is bent" is true/factual; at t2, only "The poker is straight" is true/factual. There is no single moment where the poker is characterised *both* as bent *and* straight *simpliciter* in a way that generates contradiction, as the non-present state lacks full ontological standing.

  **Argument: Why Temporary Intrinsics Doesn't Establish Perdurantism**

  Lewis's argument is powerful because it starkly presents a challenge: how can one and the same *wholly present* object possess genuinely intrinsic, contrary properties? His claim is that endurantism *must* lapse into contradiction unless it smuggles in temporal parts or abandons genuine intrinsics. However, this conclusion overreaches. While the argument successfully forces the endurantist to enrich her metaphysical ideology or ontology beyond a naïve "properties held *simpliciter* atemporally" model, it does not demonstrate that temporal parts are the *only* or *necessary* enrichment. The inference from "endurantism needs extra apparatus" to "therefore, perdurantism is true (or endurantism is false)" is invalid. Here's why:

  1.  **Dissolving the Contradiction Without Parts:** The core function of the endurantist replies is to dissolve the apparent contradiction Lewis identifies. Indexicalism and Adverbialism achieve this by fundamentally altering the *structure of instantiation*. They deny that "bent" and "straight" are ever predicated *simpliciter* of the enduring object. Instead, instantiation is inherently temporally qualified. The poker isn't bent *full stop* and straight *full stop*; it's bent-*at-t1* and straight-*at-t2* (Indexicalism), or it instantiates-bent-ly-*at-t1* and instantiates-straight-ly-*at-t2* (Adverbialism). The contrariety is resolved by making the *holding* of the property relative to a time or modified by a temporal adverb. Crucially, this resolution is achieved *while maintaining strict numerical identity over time* – the very core of endurantism. No appeal to distinct temporal parts is made or needed within this logical structure. The contradiction only arises if one insists, as Lewis does, that properties *must* be held *simpliciter* by the whole object. The endurantist replies challenge that insistence as question-begging; they offer coherent alternatives for understanding how change occurs within strict identity.
  2.  **The Cost is Ideological, Not Existential (Alone):** Lewis presents his solution (temporal parts) as ontologically economical – it only requires the parts we already seem committed to in our best physics (spacetime worms). However, the endurantist replies primarily involve *ideological* enrichment: adding temporal indices to properties, temporal modifiers to instantiation, or (in the case of Presentism/Growing Block) a specific temporal ontology. The crucial point is that enriching *ideology* (concepts, modes of predication) is distinct from enriching *ontology* (what exists). While both have costs, Lewis's argument doesn't show that the ideological cost of temporal qualification is *higher* or *less defensible* than the ontological cost of committing to instantaneous temporal parts and the controversial mereology that entails. It merely shows that *some* enrichment is necessary. Insisting that temporal parts are the *only* acceptable way to pay this cost simply assumes that temporal qualification is illegitimate or more problematic than temporal parts, which is precisely what's at issue.
  3.  **The Charge of Illegitimacy is Question-Begging:** Lewis might argue that Indexicalism and Adverbialism covertly reintroduce times as entities (in the relational view) or are otherwise metaphysically dubious compared to the "clean" perdurantist solution. However, this charge often amounts to claiming that temporal qualification is not "real" instantiation of intrinsics. But this presupposes that genuine intrinsic properties *must* be held *simpliciter* by an object atemporally – a view incompatible with *any* theory of persistence through change, *including* perdurantism! Perduring objects don't have intrinsic shapes *simpliciter* either; a temporal part is bent *simpliciter*, but the whole worm isn't. The endurantist is offering an alternative account of how an object can have temporary intrinsic properties *without* invoking parts. Dismissing it as "not genuine intrinsics" merely asserts that the perdurantist understanding is the only correct one, which is circular reasoning in this context. The endurantist can maintain that *being bent-at-t* is a perfectly legitimate intrinsic property *of the whole enduring object at that time*.
  4.  **Presentism/Growing Block as Viable Alternatives:** While more ontologically revisionary, Presentism and Growing Block theories directly undermine Lewis's starting point by denying the full, co-existing reality of the poker's past and future states. If only the present exists, then at t1, "the poker is bent" is true and "the poker is straight" is either false or lacks a truthmaker (depending on the version). There is simply no co-existing contrary state to generate a contradiction *for the wholly present object*. Lewis's argument presupposes an eternalist (or at least non-presentist) ontology where all times are equally real. The endurantist who adopts Presentism or Growing Block is not *solving* the problem within eternalism; she is *rejecting the eternalist framework* that makes the problem acute. This is a coherent, albeit controversial, strategy. Lewis's argument cannot force an eternalist endurantist to become a perdurantist without first *establishing* eternalism against its rivals – which the temporary intrinsics argument itself does not do.

  **Conclusion and Limitations:**

  I defend the **weaker claim that Lewis's argument is inconclusive** in establishing perdurantism. It successfully demonstrates that a naïve endurantism, which treats temporary intrinsic properties as held *simpliciter* by an object existing wholly at multiple times, is contradictory. However, it does not follow that perdurantism is the *only* or *necessary* solution. Sophisticated endurantist strategies – particularly Indexicalism and Adverbialism – dissolve the contradiction by enriching the *ideology of instantiation* (introducing temporal qualification), while preserving the core thesis of strict numerical identity over time. Presentism/Growing Block offer alternative ontological frameworks where the contradiction doesn't arise. Lewis's argument, therefore, at most forces the endurantist to adopt one of these enrichments; it does not compel her to accept temporal parts. The inference from "needs extra apparatus" to "must accept temporal parts" breaks down because the proposed endurantist enrichments provide coherent, non-partite resolutions to the contradiction.

  **Why the weaker claim is more defensible:** Arguing that the argument is *unsound* would require demonstrating that one of its premises is false (e.g., that objects *don't* have temporary intrinsics, or that contrary properties *can* be held *simpliciter*). This is far harder, as the phenomenon of temporary intrinsics seems undeniable, and holding contraries *simpliciter* is plausibly contradictory. Showing the argument is *inconclusive* only requires demonstrating viable alternatives to its preferred conclusion, which the endurantist replies provide.

  **Limitations:**
  1.  This argument only addresses the *temporary intrinsics* challenge. Endurantism faces other potent arguments (e.g., from vagueness, material constitution, modality) which may prove more difficult.
  2.  It does not claim endurantism *is true*, or that its enriched ideologies (indexicalism, adverbialism) are *unproblematic*. These may have their own costs regarding elegance, parsimony, or explaining certain phenomena (e.g., intrinsic *change* versus mere variation). The debate often shifts to evaluating the comparative costs of endurantist enrichments versus perdurantist ontology.
  3.  It doesn't engage the debate over whether temporal qualification truly preserves the *intrinsic* nature of properties, a point perdurantists vigorously contest. However, this contestation highlights that the argument doesn't *settle* the matter but rather refines the battleground.
