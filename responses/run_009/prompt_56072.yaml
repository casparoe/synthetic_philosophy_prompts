answer: |-
  Here’s the full specification for a theory of individual responsibility for collective harms, structured as requested. The requirements emerge *from* the cases you provided, with verdicts on negotiability.

  ---

  ### **1. What the Theory is For** (~120 words)  
  This theory must **evaluate the moral responsibility of individuals** when their actions are part of a pattern causing collective harm, but each act appears causally inert. Its adequacy hinges on providing **action-guiding principles** for agents in morally ambiguous collective scenarios (e.g., consumption, voting, pollution). It should resolve whether such acts are *wrong* (not just regrettable), explain *why*, and clarify whether blame/praise applies. Crucially, it must do this **without relying on intuitive axioms** (e.g., "participation is wrong") or demanding unrealistic calculations. The goal is practical moral clarity, not just metaphysical accounting.

  ---

  ### **2. The Requirements**  
  *(Negotiable = widely contested; Core = minimal consensus for adequacy)*  

  1. **Handle Imperceptible Harms**  
     - **Case:** Parfit’s Torturers (each dial-turn imperceptibly increases pain; no single act is detectable).  
     - **Requirement:** The theory must condemn each torturer *without* relying on perceptible difference-making.  
     - **Negotiable?** No (core). Rejecting this collapses into denying responsibility for all distributed harms.  

  2. **Address Threshold Effects**  
     - **Case:** Chicken Steps (abstention only matters if it crosses a production threshold; thresholds are unpredictable).  
     - **Requirement:** Verdicts must hold *regardless* of whether harms scale smoothly or stepwise.  
     - **Negotiable?** No (core). A theory that flips verdicts based on smoothness vs. lumpiness is arbitrary.  

  3. **Resolve Low-Probability/High-Impact Acts**  
     - **Case:** Voting (negligible chance of being pivotal, but immense impact if pivotal).  
     - **Requirement:** Must assign non-zero responsibility despite tiny pivotality.  
     - **Negotiable?** Partially (debates over *weight* of responsibility, but denying any responsibility fails).  

  4. **Account for Compensators**  
     - **Case:** Compensator (if you abstain, another takes your place; net harm unchanged).  
     - **Requirement:** Must explain why *you* are responsible (if at all), and whether you and the compensator share blame.  
     - **Negotiable?** Yes (theories may split: some say both are blameless, some condemn only you, others both).  

  5. **Preserve the Bystander Asymmetry**  
     - **Case:** Contributor (made no difference) vs. Bystander (never acted).  
     - **Requirement:** Must distinguish their moral status (e.g., contributor is blameworthy; bystander is not).  
     - **Negotiable?** No (core). Equating them absolves all collective harm participants.  

  6. **Avoid "Participation is Wrong" as Axiom**  
     - **Requirement:** Must *derive* wrongness from deeper principles (e.g., fairness, expected harm), not assume it.  
     - **Negotiable?** No (core per your stipulation; else the theory begs the question).  

  7. **Distinguish Imperceptible vs. Zero-Difference Acts**  
     - **Requirement:** Must treat torturers (imperceptible harm) differently from chicken abstainers *below* a threshold (truly zero difference), if justified.  
     - **Negotiable?** Yes (some theories merge them; others see torturers as *risking* harm, chicken abstainers as inert).  

  8. **Specify the Locus of Wrongness**  
     - **Requirement:** Must state whether wrongness lies in the *act*, the *disposition*, or *participation in a practice*—and defend it.  
     - **Negotiable?** Yes (theories diverge here).  

  9. **Avoid Over-Demandingness**  
     - **Requirement:** Cannot imply that all spare resources must mitigate collective harms (e.g., every dollar to carbon offsets).  
     - **Negotiable?** Partially (demandingness thresholds vary, but "bankrupt yourself" is rejected).  

  10. **Practical Usability**  
      - **Requirement:** Must be applicable without solving complex supply-chain/voting models. Rules must be "knowable" with ordinary effort.  
      - **Negotiable?** No (core). Impractical theories fail as action-guiding.  

  11. **Distinguish Causing vs. Benefiting**  
      - **Requirement:** Must differentiate *contributing to harm* (e.g., flying) from *merely benefiting* (e.g., inheriting fossil-fuel wealth).  
      - **Negotiable?** No (core). Conflating them justifies unlimited blame.  

  ---

  ### **3. Where the List Fights Itself** (~200 words)  
  Your suspicion is correct: the joint requirements **"condemn torturers/chicken-eaters"** (R1, R2) and **"require actual difference-making"** (R7) conflict. If imperceptible harms are indistinguishable from zero-difference acts (e.g., chicken-eater below threshold), but the torturer *must* be condemned while the sub-threshold chicken-eater *might* be excused (R7), the theory needs a principled distinction. Most theories sacrifice one:  
  - **Difference-making views** (e.g., causal responsibility) excuse torturers and sub-threshold actors, violating R1/R5.  
  - **Participation views** condemn both torturers *and* sub-threshold actors but often rely on R6’s forbidden axiom.  
  - **Expected-value views** condemn both by appealing to *risk* of harm, but this struggles with R4 (compensators negate risk) and R10 (calculating minute probabilities).  
  **Resolution?** A viable theory must either:  
  (a) Reject R7 (arguing torturers and sub-threshold actors are identical),  
  (b) Ground wrongness in **non-causal factors** (e.g., complicity, fairness), or  
  (c) Redefine "difference-making" (e.g., via expected value). All paths face trade-offs.  

  ---

  ### **4. The Knockout Requirement** (~100 words)  
  **R5 (Bystander Asymmetry)** excludes the most theories. Difference-making views (e.g., "you’re responsible only if you change the outcome") cannot distinguish the contributor who makes no difference from the uninvolved bystander—both are "harmless." Yet intuitively, the contributor is blameworthy and the bystander is not. This flaw sinks strict causal theories. Meanwhile, participation-based theories often *can* distinguish them (one participated, one didn’t) but violate **R6** by assuming participation is wrong. Thus, R5 is the litmus test: any theory that fails it cannot handle the moral core of collective harm.  

  ---

  ### **5. Quick Scorecard** (~200 words)  
  Three major contenders, assessed against core requirements:  

  1. **Pure Difference-Making (Causal) View**  
     - *Verdicts:* Excuses torturers (R1 fail), voters (R3 fail), and compensator-case contributors (R4 ambiguous). Equates bystanders and contributors (R5 fail).  
     - *Meets:* R7 (distinguishes imperceptible/zero-difference), R9 (undemanding).  
     - *Fatal flaw:* R5 (bystander asymmetry).  

  2. **Expected-Value View**  
     - *Verdicts:* Condemns torturers (R1: tiny harm × many acts = high expected harm). Condemns voters (R3: low probability × high impact). Struggles with compensators (R4: if others replace you, expected harm unchanged) and chicken steps (R2: unknowable thresholds challenge probability estimates).  
     - *Meets:* R3, R6 (derives wrongness from risk), R11.  
     - *Fatal flaw:* R10 (calculating expected harm is often impractical).  

  3. **Fair-Share View**  
     - *Verdicts:* Condemns torturers (R1: each exceeds fair share of "harm budget"). Condemns chicken-eaters (R2: you’re taking more than your share of a harmful practice). Distinguishes bystanders (R5: non-participants take no share).  
     - *Meets:* R1, R2, R5, R6, R9 (fair shares are limited), R10.  
     - *Fatal flaw:* R4 (if compensator takes your "share," are you blameless? If not, is the "share" tied to acts or roles?).  

  **Summary:** No theory aces all requirements. Fair-Share handles asymmetry (R5) best but stumbles on compensators. Expected-Value handles voting (R3) but not usability (R10). Difference-Making fails core cases (R1/R5).  
    

  ---  
  This spec sets the battlefield. Next step: argue which trade-offs are tolerable. (Hint: R5 is the tripwire.)
