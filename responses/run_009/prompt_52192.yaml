answer: |-
  Here is a step-by-step analysis of the theory of meaning presupposed by automatic MT evaluation metrics like BLEU, followed by a reconstructed implicit view:

  ---

  ### **Brainstorm: Candidate Interpretations**
  1. **Distributionalism/Corpus-Based View**: Meaning is reducible to statistical patterns of word co-occurrence. BLEU's n-gram matching implicitly equates semantic fidelity with lexical surface overlap.  
  2. **Behaviorism/Verificationism**: Translation quality is defined solely by observable correspondences between input-output pairs (source→reference). "Meaning" is just statistically recurrent output strings given an input.  
  3. **Operationalist Proxy View**: Metrics like BLEU are theoretically neutral tools correlated with quality (like a thermometer). They presuppose no intrinsic theory of meaning.  
  4. **Formalist Supervenience**: Translation quality *locally supervenes* on string overlap: identical outputs imply identical meaning preservation (modulo reference multiplicity).  
  5. **Intentional/Ignorant Instrumentalism**: The practice doesn’t presuppose *any* theory of meaning; it’s driven by institutional pragmatics (cost, scalability) despite known flaws.  

  ---

  ### **Reconstructed Implicit Theory of Meaning**
  BLEU-style evaluation **presupposes a hybrid of distributionalism and behaviorism**, where meaning is exhaustively captured by:  
  **(a)** *Surface-form distributional similarity*: Meaning preservation is measured by overlap with attested human outputs (references), reducing semantics to n-gram replication.  
  **(b)** *Stimulus-response correspondence*: A "correct" translation is defined as one matching pre-established outputs for a given input, treating translation as a decoding function.  

  **What it strictly presupposes**:  
  - Meaning is **verifiable through string alignment**. No "hidden" layer (intent, register, poetic effect) exists beyond what is materially present in reference texts.  
  - Meaning is **atomistic/compositional**: Whole-text meaning is the sum of fixed-length n-grams (despite BLEU ignoring long-range dependencies).  
  - Meaning is **monotonic**: Higher overlap implies better meaning preservation (ignuring paraphrase penalties).  

  **What it fits with but doesn’t strictly require**:  
  - **Truth-conditional theories**: BLEU ignores propositional content (e.g., "The bank is rocky" could match references for "river bank" or "finance bank" despite truth divergence).  
  - **Use-theoretic theories**: Register, pragmatics, and perlocutionary effects are invisible to n-gram counts.  
  - **Pure instrumentalism**: While BLEU is a proxy, its design *embodies* distributional assumptions (e.g., penalizing paraphrases as "errors").  

  ---

  ### **Internal Tension: Metric Adoption Despite Flaws**
  The gap between BLEU’s dominance and its marginal failures (idioms, gender, poetry) reveals:  
  1. **Implicit Scalar Reductionism**: Practitioners presuppose that meaning preservation has a *dominant quantitative component* captured by n-gram overlap (e.g., 90% "correct" via BLEU justifies overlooking 10% errors).  
  2. **Institutional Epistemology**: The field prioritizes **measurable progress** over holistic quality. BLEU operationalizes "scientific" advancement (scalable, reproducible) while human evaluation is "subjective." This conflates:  
     - *Methodological concession* (metrics as imperfect proxies)  
     - *Implicit ontological claim* (meaning is sufficiently surface-bound for engineering purposes).  
  The two readings **cannot be fully separated**: Institutional reliance on BLEU *reifies* the view that distributional similarity is the core of meaning in MT.  

  ---

  ### **Shifting to "Understanding-Required" Translation**  
  If translation required genuine **understanding** (e.g., capturing intent, register, poetic function), evaluation would need:  
  - **Intentional and functional criteria**: Does the output fulfill the source text’s purpose in its target culture? (e.g., a joke should elicit laughter, not just lexical accuracy).  
  - **Contextual sensitivity**: Testing robustness to ambiguity, deixis, and implicit cultural knowledge.  
  - **Reader-effect validation**: Measuring affective/psychological impact equivalence (e.g., does translated poetry evoke comparable emotions?).  

  **Current Shifts (Human Preference, LLM-as-Judge): Partial Progress**  
  - **Human preferences**: Better capture holistic quality (fluency, coherence) but still often reduce to scalar "likert scores," ignoring textual function.  
  - **LLM-as-judge**: Uses AI to simulate human preferences, but:  
    - **Relocates the proxy problem**: LLMs trained on human data inherit distributional biases (e.g., favoring fluent stereotypes over creative parity).  
    - **Does not require understanding**: LLMs generate scores based on statistical patterns, not comprehension. A BLEU-like gap persists—e.g., LLMs reward "plausible" outputs over intentionally faithful ones.  

  **What true change would require**:  
  - **Functional evaluation**: Task-based assessments (e.g., "Can readers answer nuanced questions about the source using the translation?").  
  - **Adversarial testing**: Systematic probes for gender bias, idiom handling, and poetic loss.  
  - **Contextual embeddings**: Metrics sensitive to discourse structure (e.g., coreference, irony) beyond sentence-level n-grams.  

  ---

  ### **Conclusion**
  BLEU-style metrics presuppose a **reductive distributional-behaviorist theory of meaning**, where semantic equivalence is conflated with string alignment. The field’s historical adherence to it reflects institutional pragmatism entangled with an implicit belief that meaning is primarily surface-level and scalar-gradable. Recent shifts toward human/LLM preferences improve sensitivity to fluency but fail to address the core requirement of *understanding*—they merely substitute one proxy (n-grams) for another (learned preferences). Genuine evaluation of understanding demands contextually grounded, functional assessments that no automatic metric currently provides.
