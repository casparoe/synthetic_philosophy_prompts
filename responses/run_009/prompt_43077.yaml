  First, I need to extract all their implicit requirements from the query. They mention: handling morally mixed lives (Plutarch), accounting for authorial shaping (Plutarch's "jests over sieges" vs. hagiography's editing), historicity debates (can false lives teach truth?), distinguishing admiration from imitation (Alexander's drinking), specifying what's learned (maxims? perceptiveness?), and generalization (does it transfer beyond the exemplar?). They also hint at tensions like edification vs. learner agency.

  The user's deeper needs seem to be about syllabus framing—they want defensible criteria to structure the course justification. They're wary of theory bias (hence marking "prejudices" like historicity) and want to spotlight pedagogical dilemmas (e.g., if a student admires a fictionalized figure). Their demand for "what excludes most candidates" suggests they need a litmus test for theories.

  For the desiderata, I'll start with non-negotiables. Any theory must explain mixed models (Plutarch's flawed heroes), because real lives aren't paragons. It must address narrative mediation—biographers curate, so how does learning survive manipulation? And it must separate admiration from imitation, since students might copy vices. These are bedrock; failing them means the theory can't handle real classroom cases.

