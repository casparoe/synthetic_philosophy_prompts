  The killer criterion? Probably the "mediation requirement." If a theory can't explain how we learn despite (or through) authorial shaping, it collapses with heavily curated texts like saints' lives. This will shape their syllabus: they must argue that learning isn't dependent on raw facts.

  For the scorecard: Plutarch aces mixed models and learner agency but stumbles on generalization (his comparisons are elite-focused). Hagiography excels at motivation but fails historicity and flattens complexity. Zagzebski handles admiration well but struggles with vice—admiring Alcibiades' charisma might mislead.

  The edge case: A student admiring a fictionalized subject. My criteria can handle it if the virtue (e.g., courage in a mythologized Joan of Arc) is separable from facts—but it risks "virtue laundering" if the hero's flaws are erased. This is perfect for class debate: it tests whether moral truth needs historical truth.

  I'll structure the output clearly: desiderata with cases, marked for negotiability/tension, then scorecards, then the edge case. Keeping it concrete avoids theory jargon—this is for a syllabus, after all.
answer: |-
  Here is a structured list of desiderata for an adequate theory of moral learning from lives, derived from your pedagogical context and the challenges posed by your source materials. Each requirement is grounded in specific cases or phenomena you've identified, with annotations on negotiability, tensions, and discriminatory power.

  ---

  ### **Desiderata for a Theory of Moral Learning from Lives**

  1.  **Handle Morally Mixed Exemplars** (Non-negotiable)  
      *   **Motivating Case:** Plutarch’s *Alexander* or *Alcibiades* – students must learn from figures with glaring vices (recklessness, hubris, intemperance) alongside virtues (courage, ambition, brilliance).  
      *   **Requirement:** The theory must explain how learners extract positive moral insight without endorsing or excusing vice. It must account for *critical engagement*, not just emulation.

  2.  **Account for Authorial Mediation & Shaping** (Non-negotiable)  
      *   **Motivating Cases:** 
          *   Plutarch (*Alex.* 1.2): Prioritizes revealing anecdotes ("phrase or a jest") over historical comprehensiveness to illuminate character.
          *   Hagiography (e.g., *Life of Antony*): Omits flaws, invents edifying episodes, structures life around a "holy death."  
      *   **Requirement:** The theory must explain how moral learning occurs *despite* (or even *through*) selectivity, embellishment, and narrative framing. It cannot assume a purely "objective" life record.

  3.  **Distinguish Admiration from Imitation** (Non-negotiable)  
      *   **Motivating Case:** The student who mimics Alexander’s heavy drinking or Alcibiades’ unscrupulous charm.  
      *   **Requirement:** The theory must delineate the cognitive/affective process of *admiring a virtue* (e.g., strategic boldness) from the behavioral act of *copying a specific action* (e.g., drinking). It must explain how learners abstract principles from concrete (and flawed) behaviors.

  4.  **Specify the Cognitive/Moral "Content" Acquired**  
      *   **Motivating Question:** Is it maxims ("Be courageous"), perceptual skills (recognizing hubris in complex situations), motivation (inspiration to act), self-narrative (understanding one's life as a project), or something else?  
      *   **Requirement:** The theory must clearly state what kind of moral knowledge or capacity is supposedly gained. It cannot be vague about the *output* of the learning process. (*Potentially Contentious*: Different theories prioritize different outputs - e.g., rules vs. perception vs. motivation).

  5.  **Explain Generalization (or Lack Thereof)**  
      *   **Motivating Concern:** Does learning from Alexander's boldness help a student navigate a modern committee meeting, or is it only relevant to ancient battlefields? Can a lesson from a saint's patience be applied outside monastic contexts?  
      *   **Requirement:** The theory must address how (or if) insights derived from specific, historically/culturally situated lives translate to the learner's own context. Does learning remain episodic, or foster broader understanding? (*Tension with Particularism*: Some theories argue moral knowledge *is* inherently particular).

  6.  **Address the Historicity Question** (Major Fault Line)  
      *   **Motivating Cases:** 
          *   Plutarch: Values psychological/character "truth" (revealed by anecdotes) over strict historical facticity in *every* detail.
          *   Hagiography: Embraces invention for edification, prioritizing spiritual truth over historical accuracy.
          *   Modern Biography: Often prioritizes factual accuracy, seeing invention as undermining legitimacy.  
      *   **Requirement:** The theory must take a stance on whether historical accuracy is *essential* for genuine moral learning. Can a potent *story* (even partly fictional) teach a *true virtue*? (*Highly Contentious*: A core divide between historical-critical and more literary/religious approaches).

  7.  **Resolve the "Edification vs. Agency" Tension**  
      *   **Motivating Cases:** 
          *   Hagiography: Maximizes edification by shaping the life to deliver a clear, unambiguous lesson.
          *   Plutarch: Offers complex portraits requiring active interpretation and comparison (e.g., Greek/Roman pairs).  
      *   **Requirement:** The theory must explain how sufficient *structure* is provided to guide learning towards virtue, while allowing enough *ambiguity* and *complexity* to require active moral reasoning from the learner.  
      *   **Tension Analysis:** Not fatal, but defines a key parameter space. Extreme edification (hagiography) risks spoon-feeding, reducing critical engagement. Extreme openness (raw, unshaped chronicle) may fail to highlight morally salient features. An adequate theory needs a "sweet spot" where shaping *facilitates* insight without *replacing* the learner's work.

  8.  **Accommodate Diverse Genres & Purposes**  
      *   **Motivating Case:** Your syllabus itself – Plutarch (comparative character study), Saints' Lives (devotional edification), Modern Political/Scientific Bio (historical explanation, psychological portrait).  
      *   **Requirement:** The theory shouldn't be so tailored to one genre (e.g., strictly historical bio) that it invalidates learning from others (e.g., hagiography). It needs to account for how the *biographer's purpose* shapes the learning potential.

  ---

  **The Most Discriminating Requirement (#2: Authorial Mediation & Shaping):** This requirement excludes the most candidates. Theories that implicitly assume biographies are transparent windows onto a life, or that moral learning *only* happens from strictly factual accounts, will fail spectacularly with Plutarch's methodology and the entire hagiographic tradition. Your syllabus framing *must* grapple with this head-on, as it's central to reading pre-modern lives and a major point of contrast with modern expectations.

  ---

  ### **Scorecard of Three Approaches**

  | Desideratum                     | Plutarch's Practice                                                                 | Hagiographic Template                                                                 | Zagzebski's Exemplarism                                                                 |
  | :------------------------------ | :---------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------- |
  | **1. Mixed Exemplars**          | **✓ Excels.** Built into pairing/comparison; vices laid bare for contrast/analysis. | **✗ Fails Internally.** Flaws erased; exemplar presented as near-perfect model.        | **⚠️ Partial.** Focuses on admirable traits, but struggles with *learning from* vice in deeply flawed admir*able* figures. |
  | **2. Authorial Mediation**      | **✓ Excels.** Explicitly theorizes selection for character insight (jests>sieges). | **✓ Excels (on its terms).** Mediation *is* the method for edification.               | **⚠️ Partial.** Relies on accurate identification of exemplars; under-theorizes how *shaped narratives* shape admiration. |
  | **3. Admiration ≠ Imitation**   | **✓ Excels.** Pairings/comparisons force abstraction of principles from actions.    | **✗ Fails Internally.** Direct imitation of the saint *is* often the implied goal.     | **⚠️ Tension.** Admiration is basic, but derivation of rules/actions *should* prevent blind imitation. Practically, risk remains high. |
  | **4. Content Acquired**         | **✓ Perceptiveness/Narrative.** Focus on character judgment & life-as-project.      | **✓ Motivation/Maxims.** Clear lessons & inspiration for devout action.               | **✓ Rules/Concepts (derived).** Admiration grounds moral concepts/rules.               |
  | **5. Generalization**           | **✓ Via Comparison.** Implicit universals sought through Greek/Roman parallels.     | **✓ Via Transcendence.** Saint embodies timeless virtues accessible to all believers. | **✓ Via Concept Formation.** Exemplars define virtues applicable generally.            |
  | **6. Historicity**              | **✓ Nuanced.** Values character "truth" over pedantic facticity.                    | **✗ Rejects (Internally).** Spiritual truth > historical fact.                        | **⚠️ Requires Realism?** Needs *real* exemplars to ground concepts; fictional ones problematic. |
  | **7. Edification vs. Agency**   | **✓ Balances.** Shapes for insight, demands active comparison/judgment.             | **✗ Edification Dominates.** Lesson pre-formed; learner’s role is reception/emulation. | **⚠️ Depends on Narrative.** Learner must discern admirable traits, but narrative shaping can heavily influence this. |
  | **8. Diverse Genres**           | **✓ Handles Comparison.** Applicable to varied lives via comparative lens.          | **✗ Limited.** Optimized for devotional purpose; struggles with secular/complex lives. | **✓ Potentially Broad.** Can apply to any "admired" figure, but criteria for admiration need scrutiny. |

  **Key to Symbols:** ✓ = Satisfies ✗ = Fails Internally (core to approach) ⚠️ = Partial/Tension/Requires Patching

  ---

  **The Edge Case: Admiring the "Unreal" Exemplar**
  *   **Case:** A student deeply admires, and is motivated to emulate the courage and conviction of a figure presented in a biography (e.g., a heavily mythologized revolutionary, a saint whose miracles strain credulity, or even a composite figure), while having strong historical/critical reasons to doubt the accuracy of key events or traits constituting that admiration.
  *   **Challenge for Desiderata:** This stresses #6 (Historicity), #2 (Mediation), and #3 (Admiration vs. Imitation). Can *moral truth* (e.g., the value of courage, conviction) be learned from a narrative known to be *historically untrue* in significant parts? Does the admiration lose its legitimacy or its power if the object is partly fictional? How does imitation differ if the model is idealized beyond human possibility?
  *   **Why Discuss in Class:** This is the crucible where the theory meets pedagogy. It forces students to confront:
      *   The relationship between historical truth and moral/psychological truth.
      *   The power and peril of narrative shaping (#2, #7).
      *   The source of admiration's motivational force – is it tied to belief in reality?
      *   The risk of "virtue laundering" through idealized, fictionalized portraits.
      *   Plutarch vs. Hagiography vs. Modern History: It highlights the core tension in your syllabus materials. A robust discussion here directly serves your goal of justifying the seminar – it *is* the justification, demonstrating the critical engagement with representation and moral meaning you aim to foster.

  This framework prioritizes the criteria and their motivating cases, providing a robust foundation for justifying your seminar by showing students engage with the *mechanisms* and *challenges* of learning from lives, not just consuming stories. The scorecard highlights the strengths and inevitable limitations of different traditions, setting up rich comparative discussions.
