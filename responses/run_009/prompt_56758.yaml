answer: |-
  The Nuremberg Tribunal's practice reflects a **hybrid theory of law** blending **customary international law** with **natural law principles**, mediated through **positivist procedures**. Its implicit theory holds that certain norms (like the prohibition of aggressive war) crystallize into binding customary law through state practice and treaties (e.g., Kellogg-Briand), even absent prior criminalization, because they violate fundamental moral principles of humanity. The Charter didn’t create *new* law *ex nihilo* but codified pre-existing customary norms. Procedural rigor (indictments, cross-examination) served to legitimize this by demonstrating that the tribunal was applying *law*—not arbitrary power—through recognizable judicial methods.  

  ### Key Elements:  
  1. **Customary Naturalism**: Aggressive war was criminalized by the "customary" status of Kellogg-Briand (1928), which reflected a universal moral condemnation of war.  
  2. **Procedural Positivism**: Detailed rules of evidence and rights for defendants framed the trial as a legal (not political) process, satisfying procedural justice.  
  3. **Moral Threshold**: Crimes against humanity required a wartime nexus because pre-war atrocities were seen as domestic matters; only war’s global context "internationalized" them.  

  **Strictly Ruled Out Views**:  
  - ["Strict Legal Positivism"]: The view that law *only* exists when explicitly codified before the act (e.g., no crime without prior statute). Nuremberg explicitly rejected this.  
  - ["Pure Realism"]: The claim that law is *nothing but* the command of the sovereign/victor. The tribunal’s procedural rigor contradicts this.  

  **Compatible Rival Views**:  
  - ["Customary Law Constitutionalism"]: Custom crystallizes law without codification; the Charter declared existing custom.  
  - ["Moderate Natural Law"]: Core crimes (aggression, atrocities) are inherently wrongful; positive law merely recognizes this.  
  - ["Transitional Justice Pragmatism"]: Post-conflict trials legitimately develop law to confront unprecedented evil.  

  **Internal Tensions**:  
  - **Procedural Formalism vs. Substantive Innovation**: Demanding written charges while relying on unwritten custom ("Kellogg-Briand as criminal statute") creates friction.  
  - **Selective Custom Recognition**: Calling Kellogg-Briand "binding custom" while ignoring pre-war persecution of Jews as non-criminal (due to the wartime nexus rule) appears arbitrary.  
  - **Universal Morality vs. Victor’s Asymmetry**: Asserting universal norms while immunizing Allied acts (e.g., area bombing) undermines claims of natural law impartiality.  

  **Asymmetry Diagnosis**:  
  Political fact, not philosophical commitment—the tribunal’s theory *could* condemn Allied acts (as Judge Pal argued), but victors structured jurisdiction to exclude self-investigation.  

  **Positivist Counterfactual**:  
  A strict positivist approach would require pre-1939 treaties explicitly criminalizing aggression and atrocities *and* establishing jurisdiction. Without these, trials could not occur. Alternatives: diplomatic sanctions, post-war treaties establishing a court for *future* conflicts (delaying justice), or summary executions (abandoning law entirely).  

  **Confidence in Underdetermination**:  
  8/10 — The practice is philosophically flexible enough to fit multiple theories (customary law, natural law), but its rejection of strict positivism is explicit and non-negotiable.  

