  - Astronomical purposes (classification, education, cultural meaning) ↔ Practical/theoretical purposes (metaphysical simplicity, explanatory power, etc.)
  - IAU's stipulative vote ↔ Deflationist's recommended convention-setting for quantifier meaning

  Now the crucial part - identifying where this mapping breaks down. The quantifier's universal logical function seems fundamentally different from "planet" which is a domain-specific noun. This isn't just about boundary-drawing - it's about the basic framework we use to describe reality. That difference alone might undermine the deflationist position.

  The practical stakes point is interesting. The Pluto debate had textbook consequences and even national pride involved, while the nose-Eiffel Tower composite seems deliberately constructed to have no practical impact. This actually strengthens the analogy for deflationists by highlighting how both cases lack empirical consequences.

  But the core issue remains - can we really treat existence claims like classification decisions? The quantifier's role as fundamental logical machinery makes this questionable. Even if some ontological disputes are merely verbal (like the Pluto case), this particular composition debate might tap into deeper metaphysical commitments.

  Perhaps a better analogy would be to legal definitions - like whether something counts as "obscenity" or "negligence." These involve substantive values and consequences, yet still have conventional elements. But even that doesn't fully capture the quantifier's unique status.

  Ultimately, while the Pluto analogy works for some ontological debates, it fails for fundamental ones involving logical vocabulary. The deflationist conclusion doesn't fully survive - we need to distinguish between disputes about categories within a framework versus disputes about the framework itself.
answer: |-
  Here's a systematic audit of the Pluto-planet analogy in ontological debates about composition, following your requested structure:

  ### Correspondence Table
  | **Pluto/Planet Case**           | **Composition/Ontology Case**                     |
  |---------------------------------|--------------------------------------------------|
  | Pluto (borderline instance)     | The mereological sum (e.g., nose + Eiffel Tower) |
  | "Planet" (classificatory term)  | "Composite object" / "Exists" / "Composes"       |
  | Astronomical purposes (e.g., orbital dominance, education, cultural meaning) | Theoretical purposes (e.g., ontological parsimony, explanatory unity, semantic utility) |
  | IAU's stipulative vote          | Deflationist's convention-setting for quantifier meaning |

  ### Disanalogies and Their Significance
  **1. Term Function & Scope**  
  - **Disanalogy:** "Planet" is a domain-specific *descriptive noun* with inherent boundary-drawing functions. The existential quantifier (∃) is a *logical operator* fundamental to all discourse.  
  - **Significance for deflationism:** **Crucial weakness**. The quantifier's universal role in formalizing truth-conditions for *any* claim (e.g., "electrons exist," "justice matters") makes its "meaning" inseparable from reality's structure. Treating it like a classificatory label (e.g., "planet") assumes deflationism is true (i.e., that ∃ lacks metaphysical depth), thus **begging the question** against substantivity.  

  **2. Practical Stakes**  
  - **Disanalogy:** Pluto's reclassification affected textbooks, museum exhibits, and national identity. Mereological sums (e.g., nose + Eiffel Tower) lack direct practical implications.  
  - **Significance:** **Strengthens the analogy for deflationism**. The *absence* of practical stakes in the composition debate highlights its putative "verbal" nature, mirroring how Pluto's status didn't alter planetary physics. Deflationists argue this shows ontology is similarly detached from empirical consequences.  

  **3. Term Introduction & History**  
  - **Disanalogy:** "Planet" was explicitly coined (and redefined) for human-centric classification. Quantifiers/logical vocabulary evolved as universal tools for representing reality.  
  - **Significance:** **Moderately weakens analogy**. Quantifiers aren't "introduced by vote" but emerge from linguistic/logical practice. However, deflationists counter that even basic logical terms gain meaning through use (e.g., quantifier variance), making convention relevant.  

  **4. Boundary-Drawing vs. Fundamental Structure**  
  - **Disanalogy:** "Planet" draws boundaries *within* reality; ∃ purports to describe reality's *basic structure*.  
  - **Significance:** **Core objection from substantivists**. If quantifiers track mind-independent structure (e.g., "joints in nature"), revising "∃" is like revising "electron" post-discovery—not mere relabeling. Deflationists reject this premise, insisting ∃ is always conceptual.  

  ### Evaluation of Deflationist Conclusion
  - **Survival of deflationism:** The analogy **partially supports deflationism for non-fundamental disputes** (e.g., "Do holes exist?"), where terms are Pluto-like classifiers. For composition itself, the disanalogies (especially #1 and #4) **fatally undermine** it by assuming the very conventionalism under dispute.  
  - **Restricted survival:** Deflationism holds for "shallow" ontological disputes (e.g., social/abstract objects) but fails for "deep" ones involving logical structure (e.g., composition, fundamentality).  
  - **Deflationist's burden:** They must explain why ∃—unlike scientific terms (e.g., "mass")—lacks descriptive depth. The analogy doesn't resolve this; it presupposes it.  

  ### A Better Analogy: **Legal Definitions**  
  - E.g., "Is this obscenity?" or "Was this negligence?"  
  - **Correspondence:**  
    - Borderline case (e.g., controversial artwork) ↔ Nose + Eiffel Tower sum  
    - Legal term ("obscenity") ↔ "Composite object"  
    - Social/purposive stakes (morality, order) ↔ Theoretical utility  
    - Judicial stipulation ↔ Quantifier convention  
  - **Why better:**  
    - Legal terms blend descriptive and normative elements, mirroring ontology's mix of reality-tracking and conceptual choice.  
    - They have practical consequences (like textbooks for Pluto), avoiding the "no stakes" objection.  
    - They don’t beg the question against substantivity: real social facts constrain legal judgments, just as real structure *might* constrain quantifier meaning.  

  ### Conclusion
  The Pluto analogy is **rhetorically useful for deflationists** in highlighting how some ontological disputes lack empirical stakes. However, it **fails for core debates involving logical vocabulary** (e.g., composition) because it implicitly assumes quantifiers are classificatory tools rather than potential mirrors of structure. Deflationism survives only if restricted to disputes where terms function like "planet"—but this excludes metaphysics’ hardest questions. A legal analogy better captures ontology's interplay of reality and convention without presupposing deflationism.
