  ### Vagueness Decision Tree for Philosophy Meetup  

  **1. How to use this**  
  Grab a drink, then start at the top. Answer each question honestly based on your gut feeling about sand heaps—no jargon needed. Follow the branches until you hit a bolded position. Don’t sweat "right" answers; we’re mapping intuitions. At the bottom, find your position’s awkward commitment. Fun, not finals!  

  ---

  **2. The Tree**  
  **Q1:** Imagine removing grains from a sand heap one by one. After each removal, you’re asked, "Is this a heap?" What happens?  
  - **A:** Every pile is either **definitely a heap** or **definitely not**—even if I can’t tell which.  
  - **B:** At some point, it’s **neither "definitely a heap" nor "definitely not"**—it’s borderline.  
  - **C:** At some point, it’s **both "definitely a heap" and "definitely not"** simultaneously.  
  - **D:** "Heap" is too vague—**no pile is meaningfully a heap (or not)**.  

  **If A → Q2A:** Is there an exact number of grains marking the heap/non-heap boundary, fixed independently of human judgment?  
  - **Yes → Epistemicism**  
  - **No → Contextualism**  

  **If B → Q2B:** For a borderline heap, is the statement, "This is either a heap or not a heap," already true *now*?  
  - **Yes → Classical supervaluationism**  
  - **No → Q3B**  

  **If B → Q3B:** Can there be a pile that’s borderline between "definitely a heap" and "borderline heap"?  
  - **Yes → Q4B**  
  - **No → Three-valued logic**  

  **If B → Q4B:** Can "heap" be true to a degree (e.g., 70% heap)?  
  - **Yes → Degree theory**  
  - **No → Many-valued logic**  

  **If C → Subvaluationism**  
  **If D → Nihilism**  

  ---

  **3. Leaf Glossary**  
  *(One awkward commitment per position)*  
  - **Epistemicism:** There’s a precise grain count separating heaps from non-heaps—but humans are fundamentally incapable of knowing it.  
  - **Contextualism:** What counts as a "heap" shifts instantly with conversational context—yesterday’s heap might be today’s non-heap.  
  - **Classical supervaluationism:** Even for borderline heaps, "heap or not heap" is already true now—we just haven’t decided *which* yet.  
  - **Three-valued logic:** Borderline statements aren’t true or false—they’re a third value ("neither"), making logic non-classical.  
  - **Degree theory:** Truth is fractional (e.g., 0.7 true), so the logic of "and"/"or" requires fuzzy math.  
  - **Many-valued logic:** Truth isn’t just true/false/neither—there are 4+, 7+, or 100+ distinct truth values.  
  - **Subvaluationism:** Some piles are both heaps and non-heaps—contradictions are real and unavoidable.  
  - **Nihilism:** "Heap" is meaningless—nothing is truly a heap (and nothing is truly *not* a heap either).  

  ---

  **4. Empty Rooms**  
  *(Unoccupied combinations)*  
  - **A → Q2A → No → Contextualism:** No empty rooms—all paths filled.  
  - **B → Q2B → No → Q3B → No → Three-valued logic:** No empty rooms.  
  - **B → Q2B → Yes → Classical supervaluationism** and **C → Subvaluationism:** No empty rooms.  
  - *Note:* The combination **B → Q2B → No → Q3B → Yes → Q4B → No → Many-valued logic** captures all gap-based, higher-order vague, non-degree views—nonclassical supervaluationism shares this path (see blind spots).  

  ---

  **5. Blind Spots**  
  *(Positions the tree can’t distinguish)*  
  - **Many-valued logic vs. Nonclassical supervaluationism:** Both land in "Many-valued logic" (Q4B→No). They agree truth gaps and higher-order vagueness exist, but nonclassical supervaluationism avoids degrees by relying on *precisifications* (sharpenings of meaning) with a nonclassical metalogic.  
  - **Degree theory vs. Infinite-valued logics:** Both land in "Degree theory" (Q4B→Yes). Infinite-valued systems (e.g., Łukasiewicz logic) are lumped with fuzzy degrees, though they impose stricter mathematical constraints.  

  ---  
  *Designed for intuitive sorting—no prior reading required. Enjoy the paradoxes!*
