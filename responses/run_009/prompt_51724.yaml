  Below is a decision tree designed to reveal a student's implicit stance on what constitutes an illocutionary act, using the five diagnostic cases. The tree starts with case-specific questions, isolates three core issues (convention dependence, sufficiency of convention, and institutional standing), and yields five distinct positions plus one inconsistent branch. It avoids Austin's classic examples and uses only the provided cases. 

  ### Decision Tree
  Answer each question based solely on intuitive judgment of the case, without theoretical presuppositions.

  1. **In Case 2 (chatbot promise):** Did the chatbot make a genuine promise?  
     - **Yes** → Proceed to Question 2.  
     - **No** → Proceed to Question 4.  

  2. **In Case 4 (sarcastic promise):** Was a genuine promise made?  
     - **Yes** → **Leaf 1: Strict Conventionalism** (Convention alone suffices; intention and uptake are irrelevant).  
     - **No** → Proceed to Question 3.  

  3. **In Case 5 (judge in corridor):** Was the defendant validly sentenced?  
     - **Yes** → **Leaf 2: Standing-Only Institutionalism** (Institutional standing suffices regardless of context).  
     - **No** → **Leaf 3: Austinian Felicity Conditions** (Convention + context are necessary; uptake may be required).  

  4. **In Case 1 (corporate apology):** Assume the CEO had **no intention to apologize** (even formally). Did an apology occur?  
     - **Yes** → *Inconsistent branch* (see below).  
     - **No** → Proceed to Question 5.  

  5. **In Case 3 (spokesperson):** Assume the minister **intended to apologize and authorized the spokesperson**. Did anyone apologize?  
     - **Yes** → **Leaf 4: Searlean Constitutive Rules** (Convention + speaker intention suffice; delegation is valid).  
     - **No** → **Leaf 5: Gricean Intention-Based** (Speaker intention + audience recognition are necessary).  

  ---

  ### Leaf Positions & Weakest Case
  - **Leaf 1: Strict Conventionalism**  
    Handles **Case 4 (sarcastic promise)** worst: It must accept the "promise" as real, ignoring that no commitment exists.  
  - **Leaf 2: Standing-Only Institutionalism**  
    Handles **Case 4 (sarcastic promise)** worst: It lacks resources to explain why conventional words fail here, as it prioritizes standing over context.  
  - **Leaf 3: Austinian Felicity Conditions**  
    Handles **Case 2 (chatbot promise)** worst: It struggles to deny a "promise" occurred (due to convention/context), though chatbots lack capacity for felicitous acts.  
  - **Leaf 4: Searlean Constitutive Rules**  
    Handles **Case 2 (chatbot promise)** worst: It cannot recognize the "promise" since chatbots lack intentions, despite conventional trappings.  
  - **Leaf 5: Gricean Intention-Based**  
    Handles **Case 3 (spokesperson)** worst: It denies an apology occurred, as the minister didn’t *personally* intend the audience’s recognition.  

  ---

  ### Inconsistent Branch & Indistinguishable Leaves
  - **Inconsistent Branch (Q4 → Yes):**  
    Answering "Yes" to Case 1 (apology without intention) after "No" to Case 2 (intention required for promise) is **incoherent**. It demands intention for some acts but not others, a position no major account occupies.  
  - **Indistinguishable Leaves:**  
    The tree **cannot separate Leaf 3 (Austin) and a strict uptake-based view** (e.g., Strawson). Both answer:  
    - Case 2: Yes (convention suffices)  
    - Case 4: No (uptake absent)  
    - Case 5: No (context invalid).  
    **Additional case to split them:**  
    > *A speaker shouts "I bet $100!" to an empty room. No one hears it.*  
    - Austin: Bet occurs (if convention satisfied).  
    - Uptake-based: No bet (audience uptake required).  

  ---

  ### Tree Structure & Issues Isolated
  - **Convention Dependence (Q1→Yes branch):** Tests if illocutions require pre-existing convention (e.g., Case 2 chatbot).  
  - **Sufficiency of Convention (Q2→No branch):** Tests if convention alone suffices or if intention/uptake is needed (e.g., Case 4 sarcasm).  
  - **Institutional Standing (Q3):** Tests if standing alone suffices beyond convention/intention (e.g., Case 5 judge).  

  This tree uses student verdicts on cases to expose theoretical commitments, with Case 3 disambiguating Searle and Grice via delegation. Positions are derived from logical space, not just the seminar’s readings.
