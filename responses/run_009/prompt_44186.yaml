prompt: |-
  a guy in my metaethics seminar is a hardcore expressivist (about as hardcore as one can be while doing homework), and another student cornered him with an argument last week and now he's sulking. the thing is i can't patch it up either. it goes like this:

  (1) expressivism says the function of 'lying is wrong' in use is to express disapproval of lying — the sentence isn't describing anything, its whole job on a given occasion is the expressing. (2) now take the conditional 'if lying is wrong, then getting your little brother to lie is wrong'. whoever asserts that is not expressing disapproval of lying. our logic teacher asserts conditionals like this constantly while grading, and she's on record (after two glasses of wine) as not caring about lying one bit either way — she'd assert it in a heartbeat just to show some student he's being inconsistent. so in the embedded spot, nothing is being expressed by the antecedent. (3) but compositionality: the conditional's meaning is built from the meanings of its parts, and 'lying is wrong' has to mean the same thing in the antecedent as it does standing alone — if it meant something different there, modus ponens on it would be equivocation instead of validity, and its plainly valid. our professor says this is roughly the point Geach pressed on the emotivists. (4) so what the sentence contributes inside the conditional is identical to what it contributes standing alone. (5) but in the embedded position the contribution can't be an act of expressing an attitude, since no act of expression is happening there (see the logic teacher). (6) so what the sentence contributes in both positions is not an expression of attitude — and then expressing attitudes was never the function of the sentence, and expressivism is false, full stop.

  the part that gets me: run the same steps on any old indicative sentence and you get that no sentence anywhere functions to assert anything, since every sentence can sit unasserted inside a conditional too — 'grass is green' inside 'if grass is green, the park will look nice', nobody is asserting grass's greenness there. the student shrugs and says fine, that conclusion follows as well and its harmless. the expressivist insists the argument proves too much and swears something slides between (3) and (6), but he cant put his finger on where, and neither can i. which step should be rejected, why did it look fine on the way in, and what does rejecting it cost? for what its worth i'd rather keep (3) if that's possible — compositionality feels non-negotiable for the expressivist more than for anyone — but tell me honestly if im just picking the premise i like.
reasoning: |-
  Okay, let me start by unpacking this user's problem. They're in a metaethics seminar where an expressivist got cornered by an argument inspired by Geach's embedding problem. The user seems to be struggling with the same issue and wants to understand where the argument goes wrong, especially since the expressivist insists it proves too much but can't articulate why.

  First, I need to recall the core of expressivism. Expressivism says that moral statements like "lying is wrong" express attitudes rather than stating facts. The challenge comes when such statements are embedded in conditionals, like "if lying is wrong, then getting your little brother to lie is wrong." In this embedded position, no attitude is expressed, yet the meaning of "lying is wrong" must remain consistent for modus ponens to work. That's the compositionality point from step (3).

  The user is concerned that if this argument works against expressivism, it might also undermine descriptive language. For example, "grass is green" inside a conditional isn't asserted either. The other student accepts this conclusion, but the expressivist thinks it proves too much. The user is torn, wanting to preserve compositionality but unsure if that's feasible.

  I should break down the argument step by step. Step (1) is standard expressivism. Step (2) shows that in conditionals, no attitude is expressed. Step (3) insists on compositionality: the meaning is the same in and out of embeddings. Step (4) and (5) conclude that since no expression happens embedded, the meaning can't be the expression itself. Step (6) says expressivism is false.

  The key issue is step (5). Expressivists need to explain what the sentence contributes in embedded contexts. One solution is to distinguish between the act of expressing and the content expressed. For descriptive sentences, "grass is green" contributes its propositional content (truth conditions) even when unasserted. Expressivists must provide a similar account for moral sentences—some abstract content that's neutral but tied to attitudes.

  Modern expressivists like Gibbard or Blackburn use concepts like "sorts of mental states" or "commitments." So, "lying is wrong" expresses disapproval when asserted, but in a conditional, it contributes the type of attitude (disapproval) as part of the conditional's logic. The conditional then expresses a higher-order attitude about the connection between these attitudes.

  The user's worry about compositionality can be addressed by showing that expressivism can have a compositional semantics. The meaning isn't the act itself but a representation of the attitude. This avoids equivocation in modus ponens. The cost is complexity: expressivism needs a robust semantic framework, moving beyond simple emotivism. 

  Rejecting step (5) clarifies that the contribution isn't the act but the content related to attitudes. The slide happens by conflating the act with the semantic content. The user's intuition to keep compositionality is right; expressivists need it to handle logic. The cost is theoretical work, but it's necessary and feasible within modern expressivism.
answer: |-
  Here's the breakdown of where the argument goes wrong, why it's tricky, the cost of rejecting the problematic step, and why preserving (3) (compositionality) is correct and possible for expressivists:

  **The Problematic Step: Step (5)**
  *   **"(5) but in the embedded position the contribution can't be an act of expressing an attitude, since no act of expression is happening there"**
  *   **Why it's wrong:** This step **conflates the *act* of expressing an attitude with the *semantic content* or *type of mental state* expressed.** Expressivism, especially in its modern "quasi-realist" forms (Blackburn, Gibbard), does *not* claim that the *meaning itself* is the act of expression. It claims that the meaning *specifies* or *concerns* a particular type of non-cognitive mental state (disapproval, a plan, a commitment). The *act* of uttering the sentence *uses* that meaning to perform the expressive act when the sentence is asserted.

  *   **Why it looked fine:** Because expressivism is often *introduced* by saying "saying 'X is wrong' *is* expressing disapproval." This focuses on the *use* in assertion. The embedding problem highlights that meaning must be separable from the force of assertion. The slide happens because the initial characterization (focusing on act/use) makes it seem like the meaning *is* the act, rather than the meaning *enabling* the act when asserted.

  *   **What rejecting it costs:** Expressivists must develop a more sophisticated semantic theory. They need to posit an abstract entity or property that the sentence contributes to compositional meaning – something like *the type of attitude* (e.g., *disapproval-of-lying*) or *the property of being such as to elicit disapproval*. This entity isn't itself the *act* of expressing, nor is it a straightforward truth-conditional proposition (like "Grass is green" contributes). It's a *distinct kind of content* specifically for normative/attitudinal vocabulary. This is complex and requires significant theoretical work.

  **The Correct Move: Distinguishing Semantic Content from Speech Act Force**

  1.  **Meaning/Content:** The sentence "Lying is wrong" *means* something like **DISAPPROVAL(Lying)**. This **DISAPPROVAL(Lying)** is its semantic contribution. It's *not* the act itself; it's the *type* of mental state or commitment conventionally associated with the sentence.
  2.  **Speech Act (Force):** When you *assert* "Lying is wrong," you *use* that content to *perform the act* of expressing your disapproval of lying. The *force* (assertion) + the *content* (**DISAPPROVAL(Lying)**) = the expressive speech act.
  3.  **Embedding:** In the antecedent of "If lying is wrong, then getting your little brother to lie is wrong," the *sentence* "lying is wrong" contributes its semantic content: **DISAPPROVAL(Lying)**. Crucially, it is *not asserted*. No act of expressing disapproval occurs. The whole conditional *asserts* a complex attitude: roughly, disapproval of the combination of disapproving of lying but *not* disapproving of getting your little brother to lie (i.e., disapproval of inconsistency regarding lying). Your logic teacher *asserts this conditional*, expressing that higher-order disapproval of inconsistency, *without* asserting (and hence without expressing) disapproval of lying itself.

  **Addressing the Compositionality Point (Step 3)**

  *   You are **absolutely right to want to preserve (3)**. Compositionality is non-negotiable for *any* plausible semantic theory, including expressivism. Rejecting it would be catastrophic.
  *   **How (3) is satisfied:** "Lying is wrong" contributes the *same* semantic content (**DISAPPROVAL(Lying)**) whether it's asserted alone or embedded. Its meaning doesn't change.
  *   **Modus Ponens Validity:** The validity of "If lying is wrong, then getting your little brother to lie is wrong; Lying is wrong; Therefore, getting your little brother to lie is wrong" is preserved. Why?
      *   The conditional asserts: **DISAPPROVAL( [DISAPPROVAL(Lying)] and [not DISAPPROVAL(GettingBrotherToLie)] )** (Disapproval of that combination).
      *   The second premise asserts: **DISAPPROVAL(Lying)** (I express my disapproval).
      *   The conclusion asserts: **DISAPPROVAL(GettingBrotherToLie)** (I express my disapproval of getting your brother to lie).
      *   Validity, for the expressivist, means that *accepting* the premises *commits* you to accepting the conclusion. If you accept the conditional (you disapprove of the inconsistency) and you accept "Lying is wrong" (you disapprove of lying), then consistency *requires* you to disapprove of getting your little brother to lie. The logic tracks *commitments* or *requirements of consistency* between attitudes, not truth conditions. There's no equivocation; **DISAPPROVAL(Lying)** means the same thing in both premises.

  **Addressing the "Grass is Green" Comparison & the Student's Shrug**

  *   **The Student is Partially Right:** The *exact same* distinction between *semantic content* and *speech act force* applies perfectly to descriptive sentences.
  *   **Meaning/Content:** "Grass is green" contributes the proposition **GrassIsGreen**.
  *   **Speech Act (Force):** Asserting "Grass is green" uses that content to claim that grass is green.
  *   **Embedding:** In "If grass is green, the park will look nice," "grass is green" contributes **GrassIsGreen**. It is *not asserted*. No claim about grass's color is made. The whole conditional *asserts* a relationship between **GrassIsGreen** and **ParkLooksNice**.
  *   **Conclusion:** The argument *does* correctly show that **no sentence *inherently* performs a speech act simply by virtue of its meaning alone.** Speech acts (asserting, expressing) require *using* the sentence with the appropriate *force* in a context. The meaning (*what* is asserted/expressed) is distinct from the force (*that* it is being asserted/expressed).
  *   **Why it's Harmless:** Acknowledging this doesn't undermine assertion or description. It simply clarifies how language works: meaning is compositional content; assertion is a way of using that content. We understand embedded sentences precisely *because* they have stable content independent of being asserted. This is standard philosophy of language (Frege's assertion sign, force/content distinction).

  **The Expressivist's Mistake and Recovery**

  *   **The Mistake:** The "hardcore" expressivist likely held a simplistic view where the meaning of "wrong" *just was* the act of booing/hooraying (like Ayer's early emotivism). This view *is* fatally vulnerable to the embedding problem because it can't separate content from force.
  *   **The Recovery (Cost):** Modern expressivism (quasi-realism) *must* adopt the force/content distinction. It must posit a special kind of non-propositional (or minimally propositional) content for normative sentences (**DISAPPROVAL(X)**) that can play the required roles:
      *   Be the object of higher-order attitudes (like in the conditional).
      *   Enter into logical relations (like modus ponens) based on consistency of commitments.
      *   Be compositionally combined.
  *   **The Cost:** This requires building a complex semantic and logical framework specifically for normative discourse that mirrors the structure of truth-conditional semantics without relying on robust truth-conditions. It's a significant theoretical burden, and critics argue it ends up looking suspiciously like realism. But it's the cost of saving expressivism from the embedding problem.

  **Conclusion**

  1.  **Reject Step (5):** The embedded antecedent contributes its *semantic content* (**DISAPPROVAL(Lying)**), not the *act* of expressing. No act occurs there, but the content is present.
  2.  **Preserve Step (3):** Compositionality is essential. The sentence contributes the same content everywhere.
  3.  **The Slide:** From the correct observation "no expression act happens in the antecedent" to the incorrect conclusion "therefore the content contributed can't be the kind of thing that *is* expressed when asserted." The content type (**DISAPPROVAL(...)**) is stable; the *use* (expression act) is context-dependent.
  4.  **The Cost:** Expressivists must develop a sophisticated theory of normative content that handles compositionality and logic without collapsing into realism. They must embrace the force/content distinction fully.
  5.  **The "Grass is Green" Point:** The argument correctly highlights the force/content distinction for *all* language. This isn't a problem; it's a clarification of how meaning and use work. Expressivism needs to fit within this general framework by specifying the *unique kind of content* normative sentences have.

  Your instinct to preserve compositionality was spot on. The key is realizing that expressivism's core claim is about the *nature* of the semantic content contributed by moral sentences (**DISAPPROVAL(X)**), not that uttering the sentence *always* performs the expressive act. The act depends on how the sentence is used (e.g., asserted vs. embedded).
