prompt: |-
  I am a journalist who writes about science and ideas for a general-interest magazine, and I am at work on a feature about social learning and market frenzies. A colleague lent me a popular economics book whose chapter on crowd behavior, as closely as I can paraphrase it, makes the following claims:

  "Information cascades explain why crowds are so often wrong. The theory, developed by economists in the early 1990s, shows that when people make decisions in sequence and can observe each other's choices, each new decision maker ignores their own private information and simply copies what the earlier movers did. This behavior is individually irrational but collectively rational, which is why it counts as rational herding. Once a cascade starts it is self-perpetuating and cannot be stopped by new information, which is why fads, bank runs, and asset bubbles all follow the same explosive dynamics, and why the wisdom of crowds breaks down completely wherever decisions are made sequentially rather than simultaneously."

  Before I put anything resembling this into print, I want to be certain I am not propagating a garbled account of the underlying theory. So please take on the role of an expert in microeconomic theory and behavioral economics — someone who knows the canonical cascade and herding models inside out, has taught them to graduate students, and has a professional interest in how they get mangled in popularization. Begin by thinking carefully and brainstorming, before writing anything final: set out for yourself what the canonical sequential-decision models actually assume about agents, signals, and observability, what exactly they establish, and what the standard caveats and extensions (on fragility, on information aggregation, on when herding does and does not occur) actually say, so that your assessment is grounded rather than impressionistic. Then go through my paraphrase claim by claim and tell me, for each: (1) whether a theorist working in this area would accept it as stated; (2) if not, whether it is a harmless simplification I could keep with a qualifier, or a genuine misstatement that would embarrass me in front of informed readers; and (3) if it is a misstatement, what the defensible version of the claim is. I am myself uncertain about three points in particular: whether the models really have everyone abandoning their private information rather than merely giving it less weight once public evidence accumulates; whether "individually irrational but collectively rational" has its polarity right; and whether the claim that cascades cannot be stopped by new information is in fact the opposite of what the fragility results show. To close, tell me which sentences I could keep essentially as written in a magazine piece, which need hedging, and which I should cut and replace — and be blunt about whether the closing contrast between sequential and simultaneous decision-making, which I find rhetorically appealing, actually tracks the theory or merely sounds good.
reasoning: |-
  Okay, let me start by unpacking the journalist's query. They're working on a feature about social learning and market frenzies, and their colleague shared a popular economics book's take on information cascades. The paraphrased claims seem oversimplified, and the journalist wants to ensure accuracy before publishing. I need to step into the role of an expert in microeconomic theory and behavioral economics to dissect this.

  First, I recall the canonical models like Bikhchandani, Hirshleifer, and Welch (1992) and Banerjee (1992). These models assume sequential decision-making with asymmetric information. Agents receive private signals (e.g., a binary signal about an investment's quality) and observe predecessors' actions but not their private signals. Each agent acts based on public history and their private signal, using Bayesian updating. 

  One key point is that agents don't completely ignore private signals; they stop using them once public information becomes overwhelming. For example, after two people invest in a startup, the next person might follow even with a contrary private signal because the public evidence tips the balance. So the claim that people "ignore their own private information" is too absolute—it's conditional.

  The journalist is unsure about three specific areas. First, whether agents abandon private info entirely. From the models, it's not abandonment but overriding when public info is sufficiently strong. Second, "individually irrational but collectively rational" is problematic. Actually, herding is individually rational but leads to collectively irrational outcomes like cascades that could be wrong. So the polarity is flipped here. Third, about cascades being unstopped by new info. The models show fragility—cascades can collapse with a little contradictory evidence. For instance, if someone with a strong signal acts against the herd, it can reverse the cascade. So claiming they "cannot be stopped" is incorrect.

  I also need to address the contrast between sequential and simultaneous decisions. The journalist likes this rhetorically, but it's not that simple. Simultaneous decisions (like prediction markets) can aggregate diverse info better, but sequential settings don't always fail. Factors like signal strength, network structure, and whether actions are observable matter. So that closing contrast in the paraphrase oversimplifies reality.

  Now, going claim by claim: 

  The first claim says information cascades explain why crowds are often wrong. This is partially true but overstated. Cascades can lead to errors, but not always—it's about inefficient aggregation, not inevitable error.

  Second, the theory's origin in the 1990s is correct, so that's fine.

  Third, people ignoring private info and copying: misstatement. They conditionally override private signals when public info dominates. Need to clarify that.

  Fourth, "individually irrational but collectively rational" has the polarity wrong. It's individually rational but can lead to collective irrationality. Big correction needed.

  Fifth, cascades being self-perpetuating and unstopped by new info: contradicts fragility results. They are easily reversed, so this is incorrect.

  Sixth, applying to fads, bank runs, bubbles: acceptable as examples, but note cascade is one mechanism among others.

  Seventh, wisdom of crowds breaking down completely in sequential decisions: overstated. Simultaneous decisions are better but sequential can still work under certain conditions.

  For the journalist's article, they can keep the basic cascade explanation and 1990s origin. Need to hedge the claims about ignoring private info, polarity of rationality, and cascade permanence. The sequential vs simultaneous contrast should be rephrased to avoid absolute statements. Emphasize that cascades are fragile and context-dependent. This ensures the piece is both engaging and accurate, maintaining credibility with informed readers.
answer: |-
  ### Expert Assessment of Information Cascade Claims  
  *Grounding in Canonical Models (Bikhchandani, Hirshleifer & Welch 1992; Banerjee 1992)*  

  **Core Assumptions:**  
  - Agents decide sequentially, each with a private signal (e.g., "buy/sell" hint about an asset's true value).  
  - Agents observe predecessors' *actions* (e.g., "Person 1 invested"), but *not* their private signals or reasoning.  
  - Agents are Bayesian rational: they weigh private signals against public history of actions.  
  - Signals are imperfect but informative (e.g., 60% accurate).  

  **Key Findings & Caveats:**  
  1. **Cascades form** when public information (from observed actions) overwhelms private signals. Later agents *conditionally override* their private info if public evidence is sufficiently strong—not "ignore" indiscriminately.  
  2. **Fragility:** Cascades are *easily reversed* by small amounts of contrarian public information (e.g., one agent acting against the herd).  
  3. **Inefficiency:** Cascades may lock in incorrect outcomes (e.g., investing in a bad asset) because private signals stop aggregating.  
  4. **Herding ≠ Cascades:** "Rational herding" occurs when copying is Bayesian optimal; "cascades" are a subset where private signals become disregarded.  
  5. **Wisdom of Crowds:** Breaks down *only if* signals are insufficiently diverse or public actions dominate too early. Simultaneous decisions avoid this by forcing independent revelation.  

  ---  
  ### Claim-by-Claim Evaluation  

  **Claim 1:**  
  *"Information cascades explain why crowds are so often wrong."*  
  - **(1) Acceptance:** Partially accepted, but overstated.  
  - **(2) Severity:** Harmless simplification needing hedging.  
  - **(3) Defensible Version:**  
    > "Information cascades *can* cause crowds to converge on wrong outcomes when early signals are misleading, preventing later information from correcting course."  
    *Rationale:* Cascades explain *some* collective errors but aren’t the sole cause; crowds can also be right under similar conditions.  

  **Claim 2:**  
  *"Each new decision maker ignores their own private information and simply copies."*  
  - **(1) Acceptance:** Rejected. Misrepresents the mechanism.  
  - **(2) Severity:** Genuine misstatement. Embarrassing to experts.  
  - **(3) Defensible Version:**  
    > "Once public evidence from early decisions becomes overwhelming, *subsequent agents may rationally override their private signals* and follow the crowd—even if their signal contradicts it."  
    *Rationale:* Agents never "ignore" signals; they weigh them Bayesianly. Copying occurs only when the public history dominates their posterior belief.  

  **Claim 3:**  
  *"This behavior is individually irrational but collectively rational."*  
  - **(1) Acceptance:** Rejected. Polarity is inverted.  
  - **(2) Severity:** Major misstatement.  
  - **(3) Defensible Version:**  
    > "This behavior is *individually rational* (Bayesian-optimal given limited information) but *collectively irrational* (it halts information aggregation, potentially locking in errors)."  
    *Rationale:* Following the herd maximizes *individual* expected utility but can lead to *collectively* suboptimal outcomes.  

  **Claim 4:**  
  *"Once a cascade starts it is self-perpetuating and cannot be stopped by new information."*  
  - **(1) Acceptance:** Rejected. Contradicts core fragility results.  
  - **(2) Severity:** Genuine misstatement.  
  - **(3) Defensible Version:**  
    > "Cascades are *fragile*: they can persist for long sequences but *collapse abruptly* if new public actions contradict the herd (e.g., an influential actor defects)."  
    *Rationale:* A single agent with a strong contrary signal can shatter a cascade. Bank runs and bubbles *do* reverse (e.g., via government guarantees or market corrections).  

  **Claim 5:**  
  *"The wisdom of crowds breaks down completely wherever decisions are made sequentially rather than simultaneously."*  
  - **(1) Acceptance:** Rejected. Overly absolute.  
  - **(2) Severity:** Misstatement needing qualification.  
  - **(3) Defensible Version:**  
    > "Wisdom of crowds *fails more often* in sequential settings because actions reveal information asymmetrically, potentially triggering cascades that drown out diverse signals. Simultaneous decisions (e.g., prediction markets) better aggregate dispersed knowledge."  
    *Rationale:* Sequential decisions *can* still aggregate information well if signals are strong or early diversity persists. Simultaneity *reduces* cascade risk but isn’t foolproof.  

  ---  
  ### Your Specific Uncertainties Resolved:  
  1. **Private Information Abandonment?**  
     Agents *never fully abandon* private signals; they override them *only when* Bayesian updating makes public evidence overwhelmingly decisive.  
  2. **"Individually Irrational" Polarity?**  
     Inverted: Herding is *individually rational* (Bayesian) but *collectively irrational* (causes informational inefficiency).  
  3. **Cascades and New Information?**  
     Fragility results *refute* the claim: Cascades *are* stoppable by new public information (e.g., a visible contrarian action).  

  ---  
  ### Final Recommendations for Your Article  
  **Keep As Written (with minor tweaks):**  
  - "Information cascades explain why crowds are so often wrong." → *Add hedge:* "can help explain"  
  - "Fads, bank runs, and asset bubbles follow similar explosive dynamics." → *Acceptable as examples.*  

  **Require Hedging/Revision:**  
  - ✂️ **Cut/Replace:** "ignores their own private information and simply copies" → **Replace with:** "may rationally follow the crowd even when their private information contradicts it."  
  - ✂️ **Cut/Replace:** "individually irrational but collectively rational" → **Replace with:** "individually rational but collectively suboptimal."  
  - ✂️ **Cut/Replace:** "cannot be stopped by new information" → **Replace with:** "can persist for long periods but are fragile to contradictory public evidence."  

  **Blunt Verdict on Sequential vs. Simultaneous Contrast:**  
  The rhetorical contrast *oversimplifies* but retains a kernel of truth. Canonically:  
  - Sequential decisions *enable* cascades (via observable actions), risking early herding.  
  - Simultaneous decisions (e.g., voting markets) *mitigate* this by forcing independent revelation.  
  **However**, sequential processes *can* aggregate wisdom if signals are strong or diverse (e.g., scientific peer review). The key is not simultaneity per se, but whether *all information* (public + private) is efficiently incorporated. Use the contrast but qualify:  
  > "While simultaneous decisions *reduce* cascade risks, sequential settings amplify them—making crowds wiser when votes are secret, but more prone to fads when actions are visible."  

  ---  
  **Sources to Strengthen Your Piece:**  
  - Key Papers: Bikhchandani et al. (1992, *JPE*); Banerjee (1992, *QJE*).  
  - Critiques: Smith & Sørensen (2000) on cascades with heterogeneous priors.  
  - Popular Synthesis: *The Wisdom of Crowds* (Surowiecki) contrasts sequential/simultaneous well.  

  This preserves your narrative while ensuring technical accuracy. Would be happy to review a draft!
