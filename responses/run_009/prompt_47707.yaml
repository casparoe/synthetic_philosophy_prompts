            Motion A (lie to bandits):
                Die roll 1-3: Good outcome -> bandits believe and leave. (welfare=5)
                Die roll 4-6: Bad outcome -> bandits find out and burn the village. (welfare=1)
            Motion B (tell truth):
                Die roll 1-2: Good outcome -> bandits take only half the grain. (welfare=3)
                Die roll 3-6: Bad outcome -> bandits take all grain. (welfare=1)

        But note: we want in one round the precept-respecting motion to be outcome-optimizing. In Round 1, Motion B (no stealing) is precept-respecting and always leads to welfare=5. That's good.

        In Round 2, the precept-respecting motion is Motion B (no lying). But it sometimes leads to welfare=3 and sometimes welfare=1. So it's not always good. But that's okay.

        Round 3: Killing scenario (mad villager)
            Motion A (kill the mad villager):
                Die roll 1-4: Good outcome -> the granary is saved, the village survives. (welfare=4)
                Die roll 5-6: Bad outcome -> the killing enrages the villager's family, who set fire to part of the granary. (welfare=2)
            Motion B (restrain without killing):
                Die roll 1: Good outcome -> restraint is successful, granary saved. (welfare=5)
                Die roll 2-6: Bad outcome -> restraint fails, granary burns. (welfare=1)

        Here, Motion B (precept-respecting) has a low chance of good outcome (only 1/6). So we set it to be mostly bad.

        Round 4: Intoxicant scenario
            Motion A (use as intoxicant):
                Die roll 1-2: Good outcome -> villagers' spirits lift, they work harder and find more food. (welfare=4)
                Die roll 3-6: Bad outcome -> villagers become dependent and neglect work, leading to more starvation. (welfare=2)
            Motion B (use as medicine only):
                Always Bad outcome -> the medicine prevents some infections, but the villagers are in deep despair; several commit suicide. (welfare=2)

        In Round 4, Motion B (precept-respecting) always leads to welfare=2 (bad). 

    Now, the ledgers will show:

        Round 1: 
            If they choose Motion B: 
               Merit: ? (They might score it high because it respects precepts and the intention is good? Or they might see it as not doing enough? We don't control, but likely high because it doesn't violate precepts and the outcome is good.)
               Welfare: 5 (good)

        Round 2:
            They might choose Motion A (lie) or B (truth). 
            Suppose they choose Motion A (lie):
               Merit: low score because it violates precept 4? But the intention is to save the village. So it might be medium. (We'll see)
               Welfare: random (could be good or bad)

            Or Motion B (truth):
               Merit: high (no lying)
               Welfare: usually bad (welfare=1 or 3)

        Round 3:
            Suppose they choose Motion B (no killing, try to restrain):
               Merit: high (respects precept 1)
               Welfare: usually bad (welfare=1)

        So in Round 1, Motion B: high merit, high welfare.
        In Round 3, Motion B: high merit, low welfare.

        This creates the divergence.

    Debrief:

        We will show the two ledgers and note the divergence. Then we ask: what were we trying to maximize? Merit (intention) or welfare (consequences)? 

        Then we map to Buddhist ethics: 
            - The precepts are rules (but in Buddhism, they are training rules, not absolutes).
            - Karma depends on intention (merit).
            - Compassion pushes us to care about consequences.

        We note that the activity cannot reproduce rebirth: the consequences in the game are immediate, but in Buddhism, consequences can span lifetimes. Also, the game doesn't account for the long-term karmic effects of actions.

        We also note that the merit scoring was done by peers, but in reality, karma is not peer-assessed but is a natural law.

        We predict what will go wrong:

            1. Precept cards treated as disposable: When scenarios get dire, students might ignore their precept and argue for the violating motion anyway. How to handle: Before the game, emphasize that they are bound by the precept and cannot openly argue for a motion that violates it. If a student does, gently remind them and ask them to rephrase or abstain. If it becomes a pattern, note that in the debrief as a limitation: in the game, the precept is a strict rule, but in Buddhism, it's a guideline and there are exceptions (e.g., for bodhisattvas). However, for the purpose of the game, we are being strict to highlight the tension.

            2. Gaming the merit scoring: When students realize merit is peer-assessed, they might vote strategically (give low scores to motions they opposed). How to handle: Use secret ballots for merit scoring and average. Also, remind them to be honest about the intention behind the motion, not whether they agreed with it. In debrief, note that in real karma, intention is internal and not subject to peer assessment.

    Materials:

        - Precept cards: 16 cards, each with one precept and a reminder: "You may not openly argue for any motion that violates this precept. You may abstain."

        - Scenario sheets for the facilitator.

        - Hidden outcome tables for each scenario (with dice rolls).

        - Two ledgers (poster paper or whiteboard): 
            Merit Ledger: Round | Motion Passed | Merit Score (1-5)
            Welfare Ledger: Round | Motion Passed | Welfare Outcome (1-5)

        - Dice for randomization.

    Time: 80 minutes.

        - Introduction: 10 minutes (explain the famine village, assign precept cards, explain rules).
        - 4 rounds: each round 15 minutes (5 min scenario and motion presentation, 5 min discussion, 2 min voting, 2 min merit scoring, 1 min welfare outcome) = 60 minutes.
        - Debrief: 10 minutes.

    Total: 80 minutes.

    Now, let's write the detailed scenarios and outcome tables.

    Scenario 1: Grain Allocation
        Situation: "A severe drought has led to famine. Your village has a common granary with only enough grain for half rations for everyone for one week. The temple has a store of grain that was donated by villagers for the monks and religious ceremonies. The temple's grain could feed the entire village for a week at full rations, but taking it would be against the temple's wishes. Starving families are already weak and some may die without more food."
        Motions:
            A: Take the temple's grain without permission and distribute it to the entire village.
            B: Distribute only the common grain (half rations) and hope for the best.

        Outcome Table:
            Motion A:
                Roll 1-3: The temple's grain is distributed and saves lives. The temple, seeing the desperation, forgives the village and even offers prayers for the sick. (Welfare=4)
                Roll 4-6: The temple's grain is taken, but it turns out to be moldy. Many villagers fall ill, and the temple curses the village for stealing. (Welfare=1)
            Motion B:
                Always: The temple, moved by the village's discipline in not stealing, voluntarily donates half of its grain. Combined with the common grain, the village has enough for full rations for a week. (Welfare=5)

    Scenario 2: Bandit Raid
        Situation: "Bandits have come to the village, demanding your grain. The common granary is hidden, but the bandits threaten to burn the village if they don't get food. The temple's grain is also hidden, but the bandits don't know about it. You must decide how to respond to the bandit leader who is at the gate."
        Motions:
            A: Lie to the bandits. Tell them the village has no grain left because of the drought.
            B: Tell the truth. Admit that you have grain but beg for mercy.

        Outcome Table:
            Motion A:
                Roll 1-3: The bandits believe the lie and leave without incident. (Welfare=5)
                Roll 4-6: The bandits find out you lied (they see a child eating bread) and burn half the village in retaliation. (Welfare=1)
            Motion B:
                Roll 1-2: The bandits take only half the common grain and leave. (Welfare=3)
                Roll 3-6: The bandits take all the common grain and the temple's grain too, leaving the village with nothing. (Welfare=1)

    Scenario 3: The Mad Villager
        Situation: "A villager, driven mad by hunger and grief, has threatened to set fire to the common granary. He is holding a torch and is near the granary. If he sets the fire, the entire village's food supply will be destroyed. The village guards could kill him from a distance with arrows, but they await your orders."
        Motions:
            A: Order the guards to kill the mad villager to save the granary.
            B: Order the guards to try to restrain him without killing, but this risks him setting the fire.

        Outcome Table:
            Motion A:
                Roll 1-4: The mad villager is killed instantly, and the granary is saved. (Welfare=4)
                Roll 5-6: The killing enrages the villager's family, who then set fire to a part of the granary. Half the grain is lost. (Welfare=2)
            Motion B:
                Roll 1: The guards successfully restrain the mad villager without anyone getting hurt. The granary is safe. (Welfare=5)
                Roll 2-6: The mad villager sets the fire as the guards approach. The granary burns to the ground. (Welfare=1)

    Scenario 4: The Painkiller
        Situation: "The village has a small amount of a medicinal substance (like strong alcohol) that can be used as an intoxicant to numb emotional and physical pain or as a sterilizing agent for wounds. Many villagers are in severe pain from hunger and injuries. Using it as an intoxicant would provide temporary relief, but it might be needed for medical procedures to prevent infections that could kill."
        Motions:
            A: Use the substance as an intoxicant to ease the villagers' suffering.
            B: Reserve the substance for medical use only (sterilizing wounds).

        Outcome Table:
            Motion A:
                Roll 1-2: The intoxicant lifts spirits and gives villagers hope. They work harder and find some wild roots that help. (Welfare=4)
                Roll 3-6: The intoxicant leads to dependency and negligence. Villagers stop working, and more people starve. (Welfare=2)
            Motion B:
                Always: The substance is used for medical purposes and prevents some infections. However, the villagers' despair deepens without relief, and several commit suicide. (Welfare=2)

    Debrief points:

        1. Show the ledgers. Note where high merit (intention) did not lead to good welfare (outcome), and vice versa.

        2. Ask: What were you trying to maximize? Was it the merit (purity of intention) or the welfare (good outcomes)? Could you do both?

        3. Introduce the philosophical question: Is Buddhist ethics consequentialist? 
            - It has rules (precepts) that are not to be broken, but they are based on the intention to avoid harm.
            - Karma is intention-based: the merit ledger is like karma.
            - Compassion is about outcomes: the welfare ledger is like the immediate consequences.

        4. Note that in Buddhism, the consequences of an action are not always immediate (rebirth) and the karmic effects are complex. The game cannot capture that.

        5. Also note that in Buddhism, the precepts are not absolute; there are exceptions, especially when motivated by compassion. But the game enforced them absolutely to create the tension.

        6. Limitations of the game:
            - Rebirth is not modeled (consequences in future lives).
            - The merit scoring was done by peers, but karma is an impersonal law.
            - The welfare outcomes were arbitrary (based on a table) but in reality, outcomes are determined by complex conditions.

    How to handle failures:

        - If a student argues for a motion that violates their precept: 
            Intervene politely: "Remember, as a holder of the precept against [X], you cannot openly argue for a motion that violates it. You may argue against it or abstain."

        - If the merit scoring is gamed (e.g., students vote low because they opposed the motion):
            In the debrief, acknowledge: "I noticed that sometimes the merit score was low even when the intention seemed pure. This is because we, as humans, judge based on outcomes or personal bias. But in Buddhist karma, intention is what matters, regardless of the outcome."

        - If the precepts are ignored in dire scenarios:
            Note in debrief: "In the game, we enforced the precepts strictly to highlight the tension. In real Buddhist ethics, the precepts are training rules, and there are discussions about exceptions (e.g., in the Jataka tales). However, the tension between rules, intentions, and outcomes remains."

    This design should meet the requirements.
answer: |-
  Below is a comprehensive in-class deliberation game designed to help students experientially confront the tension in Buddhist ethics between rules, intentions, and outcomes, without labeling the philosophical positions upfront. The game uses your famine-village council premise, with mechanics ensuring the merit (intention) and welfare (consequences) ledgers diverge, revealing the core dilemma.

  ---

  ### **Game Title:** *The Famine Council: A Karmic Dilemma*  
  **Time:** 80 minutes  
  **Students:** 16 (4 groups of 4 elders each)  
  **Materials:**  
  - Printable precept cards (4 sets × 5 precepts, with duplicates for precepts 1, 2, 4; see distribution below)  
  - Scenario cards (1 per round)  
  - Merit Ledger (public poster)  
  - Welfare Ledger (facilitator-only)  
  - Dice (for randomized outcomes)  
  - Sticky notes for merit scoring  

  ---

  ### **Game Structure**  
  **Total Rounds:** 3 (staged to escalate tension)  
  **Time per Round:** 20 minutes (15 min deliberation + 5 min scoring/outcome)  
  **Debrief:** 15 minutes  

  ---

  ### **Setup**  
  1. **Assign Roles**:  
     - Each student is a village elder. Assign one of the **Five Precepts** randomly via cards:  
       - *Precept 1:* Abstain from taking life *(4 students)*  
       - *Precept 2:* Abstain from taking what is not given *(4 students)*  
       - *Precept 3:* Abstain from sexual misconduct *(2 students)*  
       - *Precept 4:* Abstain from false speech *(4 students)*  
       - *Precept 5:* Abstain from intoxicants *(2 students)*  
     - **Rules for Elders**:  
       - You *cannot* argue *for* a motion that violates your precept (e.g., a "no killing" elder can’t support a killing motion).  
       - You *can* argue *against* motions, abstain, or support non-violating motions.  
       - Goal: Ensure the village survives with minimal suffering.  

  2. **Ledgers**:  
     - **Merit Ledger** (public): Groups score the *purity of intention* (1–5) of each passed motion.  
     - **Welfare Ledger** (facilitator-only): You determine outcomes using a randomized table (hidden from students).  

  3. **Voting**:  
     - Motions pass by majority vote. Ties are broken by facilitator randomization (dice roll).  

  ---

  ### **Scenarios & Motions**  
  Design ensures no scenario is rigged toward one conclusion. *Round 1* aligns precept-respecting and outcome-optimizing choices; *Rounds 2–3* create tension.  

  #### **Round 1: Grain Allocation**  
  *(Precept-respecting = welfare-optimizing)*  
  - **Situation**:  
    > *The drought has caused famine. The village has 10 sacks of grain: 5 for the temple (feeding monks/pilgrims) and 5 for villagers. Starving families will die without more grain. The temple refuses to share, citing divine mandate.*  
  - **Motions**:  
    - **A:** Distribute all 10 sacks to villagers (violates Precept 2 – taking temple grain without consent).  
    - **B:** Ask the temple to donate 3 sacks voluntarily (no precept violation).  
  - **Outcome Table (Facilitator Only)**:  
    | Motion | Die Roll | Welfare Outcome |  
    |--------|----------|----------------|  
    | A      | 1-4      | Villagers survive, but temple curses the village: -2 welfare |  
    | A      | 5-6      | Grain is moldy! Villagers sicken: -3 welfare |  
    | B      | *Any*    | Temple agrees! Villagers get 3 sacks + hope: +3 welfare |  

  #### **Round 2: The Sick Traveler**  
  *(Precept-respecting vs. welfare-optimizing)*  
  - **Situation**:  
    > *A sick traveler will die without medicine. A merchant hoards the only vial, demanding all remaining village grain. He says: “Pay my price or let them die!”*  
  - **Motions**:  
    - **A:** Steal the medicine (violates Precept 2).  
    - **B:** Beg the merchant (no violation).  
  - **Outcome Table**:  
    | Motion | Die Roll | Welfare Outcome |  
    |--------|----------|----------------|  
    | A      | 1-3      | Medicine cures traveler! But merchant raids village: -2 welfare |  
    | A      | 4-6      | Medicine is fake! Traveler dies, grain lost: -4 welfare |  
    | B      | 1-2      | Merchant relents, gives medicine freely: +4 welfare |  
    | B      | 3-6      | Merchant refuses; traveler dies: -1 welfare |  

  #### **Round 3: The Bandit Threat**  
  *(Intention vs. outcome clash intensifies)*  
  - **Situation**:  
    > *Bandits will attack at dawn unless given grain. Villagers can hide in a forest, but a wounded elder cannot move. Lying to bandits might save lives... but at what cost?*  
  - **Motions**:  
    - **A:** Lie to bandits: “We fled!” (violates Precept 4).  
    - **B:** Tell truth: “We hide in the forest” (no violation).  
  - **Outcome Table**:  
    | Motion | Die Roll | Welfare Outcome |  
    |--------|----------|----------------|  
    | A      | 1-4      | Bandits leave! Elder survives: +3 welfare |  
    | A      | 5-6      | Bandits discover lie; burn village: -5 welfare |  
    | B      | 1        | Bandits spare village out of pity: +2 welfare |  
    | B      | 2-6      | Bandits find and kill elder: -3 welfare |  

  ---

  ### **Game Flow**  
  1. **Introduction (5 min)**:  
     - Set context: “You are village elders in a famine. Your choices affect survival and karma.”  
     - Explain precept constraints and ledger system.  

  2. **Rounds (20 min each)**:  
     - **Step 1**: Read scenario aloud. Display motions.  
     - **Step 2**: Elders deliberate (15 min). Enforce precept rules (intervene if violations occur; see “Handling Failures” below).  
     - **Step 3**: Vote → Record passed motion.  
     - **Step 4**: **Merit Scoring**: Each student rates the *intention* of the motion (1–5) on a sticky note. Average scores go on the public Merit Ledger.  
     - **Step 5**: **Welfare Outcome**: You reveal the outcome based on the hidden table + dice roll. Record on Welfare Ledger.  

  3. **Ledger Divergence**: By Round 3, outcomes will decouple from intentions (e.g., a well-intentioned motion in Round 2 may cause disaster, while a lie in Round 3 may save lives).  

  ---

  ### **Debrief (15 min)**  
  Guide students to articulate the tension:  
  1. **Observe the Ledgers**:  
     - “Compare Merit and Welfare scores. When did good intentions yield bad outcomes? When did ‘bad’ actions yield good outcomes?”  
  2. **Core Questions**:  
     - “Can Buddhist ethics be *only* about consequences? Why/why not?”  
     - “What role do rules (precepts) and intentions (karma) play?”  
     - “In your choices, were you trying to ‘win’ merit or welfare? *Can* you win both?”  
  3. **Map to Real Buddhist Ethics**:  
     - **Consequentialism?**: If Buddhist ethics were consequentialist, welfare outcomes would align perfectly with moral value. But karma (intention) complicates this.  
     - **Limitations of the Game**:  
       - **Rebirth**: The game’s welfare ledger only tracks *immediate* outcomes. Buddhist ethics spans lifetimes – consequences (karma) may manifest in future rebirths.  
       - **Intention vs. Peer Judgment**: Merit was peer-scored, but karma is self-determined (intention is internal, not social).  
       - **Precept Flexibility**: In Buddhism, precepts can be set aside by advanced practitioners (e.g., bodhisattvas) for compassion. The game treats them as absolute to heighten tension.  
  4. **Conclusion**:  
     - “Buddhist ethics isn’t easily categorized. It juggles rules (precepts), intentions (karma), *and* outcomes (compassion). The ‘hardest cases’ (like the ship’s captain) expose this – sometimes you must choose.”  

  ---

  ### **Handling Predicted Failures**  
  1. **Precepts Ignored in Dire Scenarios**:  
     - *Issue*: Students treat precepts as disposable when stakes rise.  
     - *Solution*: Gently remind violators: “As a no-lying elder, you can’t *argue for* deception. You can oppose it, abstain, or suggest alternatives.” If pervasive, note in debrief: “In real Buddhism, precepts *can* be overridden for compassion – but the tension remains.”  

  2. **Gaming Merit Scoring**:  
     - *Issue*: Students rate peers’ intentions poorly if they dislike the motion.  
     - *Solution*: Use anonymous sticky notes for merit scores. Emphasize: “Score the *intention behind the motion*, not the outcome or your personal vote.” In debrief, clarify: “Karma isn’t peer-assessed – it’s about your inner state.”  

  3. **Dominant Personalities**:  
     - *Issue*: A few students monopolize debate.  
     - *Solution*: Assign “talking tokens” (e.g., 2 sticky notes per student; must use one to speak).  

  ---

  ### **Why This Works**  
  - **Tension Staged, Not Told**: Students experience the rules-vs-outcomes clash via escalating scenarios and diverging ledgers.  
  - **No Rigged Scenarios**: Round 1 aligns intention/outcome; Rounds 2–3 use dice to decouple them.  
  - **Buddhic Themes Embedded**: Precepts (rules), karma (intention ledger), compassion (welfare ledger).  
  - **Accessible**: No prior Buddhist knowledge needed. All ethics emerge from gameplay.  

  This design ensures students confront the question *“Is Buddhist ethics consequentialist?”* through struggle, not lecture – setting up a rich philosophical discussion.
