  i keep arguing with my roommate about the cogito and i want you to settle it by actually taking a side. Argue for this position: the cogito works only as a performance, not as an inference, and once you take that seriously it proves far less than Descartes needs. The idea being: read as an inference it needs the premise that whatever thinks exists, and that general premise isn't available until the evil demon is out of the way; but read as a performance (the reading usually traced to Hintikka's old paper 'Cogito, ergo sum: inference or performance?'), whatever it establishes is indexed to the moment of thinking — it shows that an episode of doubting is occuring, not that there is a persisting thinking substance, the res cogitans, which is what the rest of the Meditations actually runs on.

  Two things you must deal with. First, Descartes himself, in the Second Replies, denies the cogito is a syllogism and says that when someone says I am thinking, therefore I am, he recognizes his existence "as something self-evident by a simple intuition of the mind." My roommate says this means Descartes was already a performance guy and the inference reading is a strawman, so the performance reading can't be used against him — tell me whether that point stands or whether the deflationary conclusion survives it anyway. Second, Gassendi's complaint that the most the cogito licenses is that thinking is occuring, without the "I" — say where you come down on whether the performance reading makes this objection unavoidable.

  Please commit to the deflationary conclusion, dont give me a survey of readings with "both sides have a point."

