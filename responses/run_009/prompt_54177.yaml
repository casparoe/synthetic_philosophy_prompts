  ### Thought Experiment: Identity-Stake Splitting in Destructive Uploading

  You undergo a quantum-controlled destructive uploading: a 50% amplitude branch kills you instantly, while a 50% amplitude branch creates two identical digital copies of your mind (each with your memories and sense of self) but destroys the original brain. In the survival branch, the original's "identity-stake" (a measure of unique self-continuity) is split equally between the copies, so each copy experiences only half the subjective weight of existence (utility 0.5 per copy, totaling 1 for the branch). Refusal means continuing as a single identity (utility 1).  

  **Quantum Immortalist Verdict**: Accept. You always subjectively survive in the copy branch and experience life, so death branches are irrelevant.  
  **Expected Utility Verdict**: Refuse. The gamble’s expected utility is \(0.5 \times 0 + 0.5 \times 1 = 0.5\), less than refusal’s 1. Identity-stake dilution reduces survival utility despite immortality.  
  **Load-Bearing Feature**: Identity-stake dilution—splitting reduces per-copy utility in survival, lowering total branch utility.  
  **Strongest Rebuttal**: "Subjective survival means full utility per copy; stakes are irrelevant. Survival utility should be 2 (0.5 × 2 = 1), matching refusal. Accept anyway, as you’ll experience survival."  
  **Without Identity-Stake**: Survival utility becomes 2 (1 per copy); expected utility is \(0.5 \times 0 + 0.5 \times 2 = 1\), equaling refusal. Immortalist now accepts, as refusal loses its edge.

