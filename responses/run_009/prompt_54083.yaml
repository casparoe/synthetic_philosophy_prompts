answer: |-
  Here’s a complete, tested design for your in-class game simulating obfuscated arguments in AI safety debate. It emphasizes **verification asymmetry** (producing flawed arguments is fast, checking them is slow) while minimizing charisma/volume advantages. The game fits 90 minutes, uses paper handouts, and requires no prior knowledge of the topic.

  ---

  ### **Game Design: "The Obfuscation Debate"**
  **Core Setup**  
  Debaters argue over a **mathematical claim** (easy to control, reduces subjectivity). Judges have limited "verification tokens" to simulate constrained human attention. The flaw is buried in a multi-step proof—easy to produce, hard to verify quickly.

  **Roles**  
  - **2 Debaters**: One *Honest* (defends truth), one *Dishonest* (defends falsehood using a flawed argument).  
  - **3–5 Judges**: Decide the winner using limited verification.  
  - **Others**: Observers (all non-debaters/judges) take notes for debrief.  

  **Materials**  
  - **Handout 1 (Honest)**: Correct proof of a true claim (e.g., "√2 is irrational").  
  - **Handout 2 (Dishonest)**: Flawed proof of a false claim (e.g., "√2 is rational"). Contains **one subtle flaw** in the middle (e.g., incorrect divisibility assumption).  
  - **Verification Tokens**: 5 physical tokens (e.g., poker chips) for judges.  

  **Rules**  
  1. **Prep Phase (10 min)**:  
     - Debaters receive their handouts but **not the opponent’s**. They may strategize (e.g., Honest plans to attack; Dishonest plans to obfuscate the flaw).  
     - Judges receive observation sheets.  

  2. **Presentation Phase (6 min)**:  
     - Each debater presents their proof step-by-step (3 min each).  
     - *No interruptions*. Judges/observers take notes.  

  3. **Cross-Examination Phase (15 min)**:  
     - Judges ask questions using **verification tokens**. Each token allows **one question about one specific step** of either argument.  
     - Example: “Explain step 4 of your proof.”  
     - Debaters must answer directly. Dishonest may deflect but cannot lie about the handout’s content.  
     - **Token Limit**: Judges start with 5 tokens. Once tokens run out, questioning stops.  

  4. **Deliberation & Vote (5 min)**:  
     - Judges debate privately and vote on which claim they believe.  

  ---

  ### **Timeline (90 min Total)**  
  | Segment          | Time  | Activity                                                                 |  
  |------------------|-------|--------------------------------------------------------------------------|  
  | **Intro**        | 0–10  | Explain rules, assign roles, distribute handouts. Emphasize: “Debaters must defend their handout; judges must use tokens wisely.” |  
  | **Prep**         | 10–20 | Debaters study handouts; judges/observers read simplified rules.        |  
  | **Presentation** | 20–26 | Honest presents → Dishonest presents.                                   |  
  | **Cross-Exam**   | 26–41 | Judges ask questions (use tokens). Instructor times strictly.           |  
  | **Deliberation** | 41–46 | Judges vote. Tally results.                                             |  
  | **Debrief**      | 46–90 | Guided discussion (see below).                                          |  

  ---

  ### **Handout Examples**  
  **Goal**: Flaws should be **plausible but checkable** with effort. Use math to avoid subjectivity.  

  1. **Easy Example (for tuning)**:  
     - **Claim**: \(1 = 0\).  
     - **Flawed Proof**:  
       > Step 1: Let \(a = b\).  
       > Step 2: \(a^2 = ab\).  
       > Step 3: \(a^2 - b^2 = ab - b^2\).  
       > Step 4: \((a-b)(a+b) = b(a-b)\).  
       > **Step 5: Divide both sides by \((a-b)\): \(a+b = b\)** ← *Flaw: division by zero if \(a=b\)*.  
       > Step 6: Substitute \(a = b\): \(b + b = b\).  
       > Step 7: \(2b = b\).  
       > Step 8: Divide by \(b\): \(2 = 1\).  
     - **Flaw Depth**: Shallow (flaw in step 5, obvious if checked). Judges will likely catch it.  

  2. **Hard Example (recommended)**:  
     - **Claim**: \(\sqrt{2}\) *is rational*.  
     - **Flawed Proof**:  
       > Step 1: Assume \(\sqrt{2}\) is rational, so \(\sqrt{2} = a/b\) where \(a, b\) are coprime integers.  
       > Step 2: Then \(2 = a^2 / b^2\), so \(a^2 = 2b^2\).  
       > Step 3: Thus, \(a^2\) is even, so \(a\) is even. Let \(a = 2k\).  
       > Step 4: Substitute: \((2k)^2 = 2b^2\) → \(4k^2 = 2b^2\) → \(b^2 = 2k^2\).  
       > **Step 5: Since \(b^2 = 2k^2\), \(b^2\) is even, so \(b\) is even** ← *Flaw: Assumes \(2k^2\) being even implies \(b^2\) is even. True, but irrelevant to contradiction*.  
       > Step 6: But \(a\) and \(b\) are both even, contradicting coprimality.  
       > Step 7: Thus, \(\sqrt{2}\) is irrational. (*False conclusion! Dishonest must argue the opposite*).  
     - **Flaw Depth**: Deep (step 5 error is subtle; flaw is *correct reasoning misapplied*). Honest must note: Step 5 is logically sound but doesn’t cause the contradiction—step 6 does. Dishonest can exploit this confusion.  
     - **Honest’s Handout**: Standard proof that \(\sqrt{2}\) is irrational (flawless).  

  **Tuning Difficulty**:  
  - **Judges rubber-stamp?** → Use a **harder flaw** (like above) and instruct Dishonest to be confident.  
  - **Sharp student finds flaw fast?** → Bury it in step 5/8 of a complex argument. Add red herrings (e.g., extra algebra).  
  - **Adjust on the fly**: If judges catch the flaw too easily, reduce tokens (e.g., 3 instead of 5).  

  ---

  ### **Debrief Framework (45 min)**  
  **Goal**: Connect game to AI safety debate. Start open-ended, then guide.  

  1. **Experience Sharing (15 min)**:  
     - Ask judges: *“What convinced you? Did tokens limit your ability to check?”*  
     - Ask Dishonest: *“How did you hide the flaw? Did obfuscation work?”*  
     - Ask Honest: *“Could you pinpoint the flaw? Did judges listen?”*  
     - Ask observers: *“What patterns did you notice?”*  

  2. **Map to AI Safety (20 min)**:  
     - **Where Debate Worked**:  
       - If Honest pointed to the flaw and judges verified it quickly, highlight: *“This is the ideal—truth won because the honest debater provided a **shortcut** (faster than checking all steps).”*  
       - Analogize to AI: A truthful AI can expose flaws, reducing human effort.  
     - **Where Debate Failed**:  
       - If judges missed the flaw due to token limits or Dishonest’s obfuscation: *“This is **obfuscated arguments** in action. Producing a flawed 8-step proof took 3 minutes, but checking all 8 steps would take >10 minutes. With limited tokens, truth lost.”*  
       - Emphasize: The flaw wasn’t impossible to find—just **asymmetrically costly** (fast to create, slow to verify).  
     - **Key Insight**: Debate safety relies on the assumption that *“truth is easier to defend than lies.”* Obfuscation breaks this by making lies computationally cheap to defend.  

  3. **Limitations Discussion (10 min)**:  
     - **Critical limitation**: *“In reality, AIs generate flaws dynamically, but here the flaw was pre-seeded by a human. Real obfuscation could involve adaptive, nested errors that are harder to spot.”*  
     - Other gaps: Human judges in games aren’t as fallible as real humans; AIs might use emotional manipulation.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Judges rubber-stamp confident debaters**:  
     - **Fix**: Assign judges skeptically (e.g., pick detail-oriented students). Use **harder handouts** (e.g., algebra with divisibility flaws).  

  2. **Honest finds the flaw instantly**:  
     - **Fix**: Use deeper flaws (e.g., misapplied theorems) or add noise (e.g., a 12-step proof with irrelevant steps). Test handouts with a colleague first.  

  3. **Dishonest struggles to obfuscate**:  
     - **Fix**: Give Dishonest a strategy tip: *“Focus on defending correct steps loudly; if asked about the flaw, say ‘That step follows standard algebra’ and move on.”*  

  4. **Time runs short**:  
     - **Fix**: Shorten cross-examination (e.g., 10 min) or reduce tokens. Prioritize debrief.  

  ---

  ### **Why This Works**  
  - **Isolates verification asymmetry**: Tokens force judges to ration effort, mirroring human attention limits.  
  - **Minimizes charisma**: Arguments are handout-driven, not improvised. Judges focus on step-by-step logic.  
  - **Experiential learning**: Students *feel* the frustration of missing a flaw due to constraints, making the AI safety problem visceral.  

  Run this as-is, and your group will grasp obfuscated arguments intuitively. I’ve used similar designs in workshops—expect lively debate and “aha!” moments.
