answer: |-
  **Joint Statement on the Naturalistic Study of Religion**

  We, the undersigned, affirm our shared commitment to the scientific investigation of religion as a natural phenomenon arising within human populations. We agree that religious thought and behavior are rooted in human psychology and shaped by cultural transmission. Both perspectives recognize the involvement of evolved cognitive mechanisms in generating religious concepts and acknowledge the role of cultural evolution in shaping religious systems over time. We concur that supernatural agent concepts are widespread and often involve postulated entities with access to socially relevant information. We further agree that understanding religion requires integrating insights from cognitive science, anthropology, history, and evolutionary theory.

  Despite this common ground, we retain distinct views on the primary causal framework for explaining the emergence and persistence of the constellation of phenomena labeled "religion":

  *   **Cognitive Scientist:** My view emphasizes that the core cognitive mechanisms underpinning religious thought – such as hyperactive agency detection, theory of mind, intuitive dualism, and memory biases favoring minimally counterintuitive concepts – evolved for adaptive functions in non-religious domains (e.g., predator avoidance, social navigation). Religious beliefs and concepts are predominantly *byproducts* or *spandrels* – recurrent, naturally generated outputs of these underlying cognitive systems functioning in specific cultural and ecological contexts. While cultural processes undoubtedly elaborate and transmit these concepts, the core drivers are these domain-general cognitive mechanisms producing outputs that happen to coalesce into what we call "religion." Selection did not act *on* "religion" as such; it acted on cognitive capacities with broader utility.
  *   **Anthropologist:** My view emphasizes that the integrated package of beliefs in morally concerned supernatural agents, costly communal rituals, and doctrines of supernatural punishment functioned as a *cultural adaptation*. This complex facilitated unprecedented levels of cooperation, trust, and social cohesion within large-scale groups of unrelated individuals, enabling the rise of complex societies. While utilizing pre-existing cognitive tendencies, these elements were culturally elaborated and institutionalized. This package was subject to cultural group selection: groups possessing more effective forms of this religious complex out-competed groups with less effective forms through differential survival, reproduction, or imitation. "Religion," in this functional sense, *was* an adaptive target of cultural evolutionary processes.

  Our divergence centers on several critical empirical cruxes:

  1.  **The Timing and Function of "High Gods":** Does the cultural evolution of belief in powerful, morally concerned supernatural agents who monitor and punish antisocial behavior *precede and facilitate* the scaling up of social complexity beyond small-scale bands and tribes, or does it *follow and legitimize* already established socio-political complexity?
      *   **Cognitive Scientist Predicts:** Belief in morally punitive High Gods predominantly emerges *after* significant socio-political complexity is already established, serving primarily to reinforce existing social hierarchies and norms rather than being the initial driver of large-scale cooperation among strangers. The cognitive building blocks exist earlier, but the integrated "High God" concept is a cultural response to complexity.
      *   **Anthropologist Predicts:** Belief in morally punitive High Gods evolves culturally *before or concurrently with* the major transitions to large-scale, cooperative societies, acting as a crucial mechanism enabling trust and cooperation among non-kin by providing a perceived supernatural enforcement mechanism.
      *   **Crucial Evidence:** Analyses of the **Seshat: Global History Databank**, specifically longitudinal studies tracking the co-evolution of social complexity markers (e.g., settlement size, hierarchy levels, bureaucracy) and the presence/characteristics of moralizing High Gods across diverse world regions and historical periods. Both views predict distinct temporal sequences and correlations observable in this data.

  2.  **The Level and Target of Selection:** Does cultural evolution primarily act on "religion" as a cohesive, functional package promoting group cohesion, or does it act on disparate, low-level cognitive attractors and cultural traits that are only conventionally bundled under the label "religion"?
      *   **Cognitive Scientist Predicts:** "Religion" as a unified category is largely an analytical construct. Cultural evolution acts on numerous individual traits (e.g., specific rituals, concepts of spirits, afterlife beliefs) based on their individual cognitive attractiveness, memorability, or utility in smaller-scale social contexts, not on a pre-packaged "religion module" selected for group-level benefits. Costs associated with ritual are often explained by signaling theories operating at individual or kin-group levels, not group selection.
      *   **Anthropologist Predicts:** The specific combination of costly signals (rituals), belief in supernatural punishment, and doctrines promoting in-group prosociality constitutes a synergistic cultural package (or suite of packages) upon which cultural group selection acted directly due to its emergent group-beneficial properties.
      *   **Crucial Evidence:** **Cross-cultural studies examining the correlation between costly ritual practices/supernatural punishment beliefs and measurable group-level outcomes** (e.g., in-group cooperation rates in economic games, success in inter-group conflict, group longevity, demographic expansion) *while rigorously controlling for alternative explanations* (e.g., shared kinship, direct reciprocity, common threats). The adaptationist view predicts a strong, specific link between costly religious elements and enhanced group functionality in large non-kin groups, stronger than links to individual traits or smaller kin groups. The byproduct view predicts weaker or absent links at the large-group level, or finds the effects better explained by individual-level benefits or cognitive biases. Studies of **cultural transmission dynamics** (e.g., using experimental paradigms or historical diffusion data) examining whether the proposed "package" spreads as a unit or as separable elements also bear heavily here.

  **Regarding Definition:** We acknowledge that part of our disagreement may stem from differing implicit definitions of "religion." The term often conflates:
      *   *Core cognitive tendencies* (e.g., predisposition to attribute agency, think dualistically).
      *   *Specific cultural expressions* (e.g., belief in Zeus, practice of Ramadan).
      *   *Hypothesized functional complexes* (e.g., "Big Gods" + costly ritual + prosocial doctrine).
  The "byproduct" view focuses primarily on explaining the origins and recurrence of the first level, seeing the second as an elaboration, and is skeptical that the third constitutes a coherent evolutionary target separable from its components. The "adaptation" view focuses on explaining the cultural success and functional role of integrated complexes approximating the third level, utilizing the first and manifesting in the second. Clarifying the level of analysis (cognitive origins vs. cultural function) and the specific referent of "religion" in any given claim is essential to avoid purely verbal disputes.

  We agree that resolving these cruxes requires continued empirical research, particularly large-scale comparative historical analyses and carefully designed studies of cultural transmission and group dynamics. We present these differing interpretations and predictions not as a final word, but as a framework to guide future investigation.

