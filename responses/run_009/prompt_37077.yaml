   2. **Observers vs Observer-Moments**: We agree that one can frame anthropic reasoning either in terms of observers (entire lives) or observer-moments (temporal parts of observers). The choice between these two may affect the calculations but does not resolve the fundamental dispute between SSA and SIA.

   3. **Bayes's Rule and Indexical Evidence**: We agree that Bayes's theorem is the correct framework for updating credences. We agree that when we have indexical evidence (such as "I am an observer in such-and-such circumstances"), we must condition on that evidence. However, we disagree on how to represent the indexical evidence and the set of possible observers over which we are sampling.

   4. **Hypotheses with Zero Observers**: We agree that hypotheses that entail there are no observers (or no observers of the relevant kind) must be treated with caution because they would not allow for our existence. Such hypotheses are ruled out by our existence.

   5. **Anthropic Principles as Constraints or Bookkeeping**: We agree that anthropic reasoning is necessary when considering hypotheses that predict different numbers of observers. But we disagree on whether the anthropic principle (in the form of SSA or SIA) is a constraint on rational credence or merely a bookkeeping device.

   Disagreements:

   We will present the remaining disagreements in a table. The table will have the following columns:
