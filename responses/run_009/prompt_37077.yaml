   3. Bayes's theorem is the appropriate framework for updating credences. Our existence (or the fact that we are observers) is evidence that must be conditioned upon. However, we disagree about how to model the prior probabilities and the likelihoods when the total number of observers varies.

   4. Hypotheses that predict zero observers (of the relevant reference class) are incompatible with our existence and are therefore falsified.

   5. Anthropic reasoning is necessary when theories predict different numbers of observers. However, we disagree about whether SSA and SIA are fundamental constraints on rational credence or merely bookkeeping devices for handling indexical information.

   II. Disagreements:

   We present our remaining disagreements in the table below.

   | Issue | Advocate A (SSA) | Advocate B (SIA) |
   |-------|------------------|-------------------|
   | **The core Doomsday Argument update** | The observation that we are among the first 100 billion humans provides evidence that the total number of humans that will ever exist is not much larger. This follows from applying SSA: we should consider ourselves a random sample from all humans that will ever exist. Therefore, being very early is more probable under a hypothesis of a small total human population. | The update from the Doomsday Argument is exactly canceled by the prior weighting of SIA. SIA assigns prior probabilities proportional to the total number of observers that each hypothesis predicts. Therefore, the two effects (the likelihood effect from the birth rank and the prior effect from the total population) exactly cancel, leaving the posterior probabilities unchanged. |
   | **Handling of hypotheses that predict zero observers** | We agree that such hypotheses are falsified by our existence. However, for hypotheses that predict at least one observer, SSA conditions on being a random sample from the observers in that hypothesis. | We agree that hypotheses predicting zero observers are falsified. Additionally, SIA assigns prior probabilities in proportion to the expected number of observers, so such hypotheses get zero prior. |
   | **Nature of SSA/SIA** | SSA is a fundamental principle of rationality when reasoning about indexical information. It is a constraint on rational credence. | SIA is a fundamental principle of rationality. It is a constraint on rational credence, though it leads to the presumptuous philosopher problem, which we accept as a consequence. |
   | **Is the dispute merely verbal?** | No, because it leads to different predictions about the future of humanity and in various thought experiments. | No, because SSA and SIA are different principles and lead to different outcomes in cases like the presumptuous philosopher. |

   III. Cruxes and Thought Experiments:

   We have identified the following cruxes and accompanying thought experiments.

