   | **Nature of Anthropic Principles** | SSA is a constraint on rational credence. It is a fundamental principle of anthropic reasoning that we should reason as if we are a random sample from the reference class. | SIA is also a constraint on rational credence. However, Advocate B also concedes that SIA leads to the presumptuous philosopher problem. |
