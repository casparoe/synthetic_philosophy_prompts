     - This thought experiment isolates the core of the Doomsday Argument.
     - Advocate A (SSA) predicts: The observation of being the 1 billionth human is 1000 times more likely under Scenario A (100 billion total) than under Scenario B (100 trillion total). Therefore, we update in favor of Scenario A.
