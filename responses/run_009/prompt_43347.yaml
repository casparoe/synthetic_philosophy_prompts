prompt: |-
  i cover science and ideas for a magazine, and right now im reporting a piece on the postwar grudge informer cases — the people who denounced their neighbors and spouses to the nazi courts, and the west german judges in the late 40s trying to decide whether you could punish someone for doing what the law of their own state at the time invited them to do. while reporting it, a law professor friend (a big natural law guy, loves radbruch) walked me into an argument and now i cant find the exit:

  (1) positivism says whether a rule counts as valid law depends on its sources — who enacted it, how — not on its merits. (2) the nazi-era statutes and decrees underpinning the denunciations were enacted through the officially accepted procedures of the german system, so on positivism they were valid law. (3) if those statutes were valid law, then the informers acted lawfully — they broke no law of the state they lived under. (4) if they acted lawfully, then convicting them after the war was punishment of lawful conduct, which is retroactive punishment. (5) banning retroactive punishment is pretty much the core of the rule of law — its the thing we prosecuted the war criminals FOR violating, isnt it. (6) so positivism, once you take the rule of law seriously, implies the grudge informer trials were themselves unjust. (7) but the trials were just, or at least overwhelmingly we feel they were. (8) so positivism is false.

  he thinks this is a clean kill and keeps quoting that line about intolerable injustice not counting as law at me. my instinct is that "lawful" is quietly doing two different jobs somewhere around (3) and (4), but i cant nail it and he just smiles when i say that. which step should i reject, and what does rejecting it cost? fwi id rather keep (5) than anything else in the list — feels like the one thing everyone on both sides of this whole debate agrees on — so if you make me give it up, tell me exactly what im buying with it.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're a science and ideas journalist working on a piece about postwar grudge informer cases in Germany. The core issue revolves around whether it was just to punish people who informed on others under Nazi laws, even though those laws were valid at the time. Their law professor friend has presented an argument that legal positivism leads to the conclusion that these trials were unjust because they applied retroactive punishment. The user feels there's a flaw in steps (3) and (4) but can't articulate it. They want to reject a specific step without undermining the rule of law, especially the ban on retroactive punishment.

  First, I need to recall the key points of the argument. The professor's steps are logical but might conflate different concepts. Step (3) claims that since the Nazi laws were valid, the informers acted lawfully. But does "lawful" here mean compliance with state law at the time, or does it imply moral permissibility? That's a potential ambiguity. If "lawful" only refers to positive law, then step (4) shifts to retroactive punishment, which is a moral and legal principle. That's where the equivocation happens.

  The user mentioned Radbruch and natural law. Radbruch's formula argues that laws grossly violating justice aren't valid. So the professor is using that to challenge positivism. But the user wants to defend positivism without rejecting the rule of law. So the solution is to show that positivism can distinguish between legal validity and moral acceptability. 

  The user's instinct about "lawful" doing double duty makes sense. In step (3), "lawful" means according to state law. In step (4), when talking about retroactive punishment, "lawful" implies moral justification. But retroactive punishment bans punishing someone for acts that were legal when committed. However, if the Nazi laws themselves were invalid due to injustice, then the informers' acts weren't legally protected. But under positivism, those laws were valid. So how to resolve this?

  Ah, the user prefers keeping step (5), the ban on retroactive punishment. So the solution is to reject step (3) or (4). If we reject step (3) by saying that even under positivism, the informers acted legally but not necessarily lawfully in a moral sense, then step (4) falls apart. But that might not fully address the retroactivity. Alternatively, we can challenge step (4) by arguing that convicting informers wasn't retroactive because they were punished for moral wrongs, not legal ones. But that could undermine the rule of law.

  The better path is to attack step (3). The informers' actions, while legal under Nazi law, might have violated other legal principles. For example, the Weimar Constitution wasn't entirely abolished, so denunciations could be seen as murder or coercion under existing laws. Or, the postwar courts could apply natural law principles without retroactivity by declaring Nazi laws invalid from the start. But that requires rejecting positivism's source-based validity.

  H.L.A. Hart's approach might help. He distinguishes between primary and secondary rules. The postwar trials introduced a new rule that invalidated past laws based on morality. This is a rule of recognition change. So punishing informers under new legal standards isn't retroactive because the legal system itself evolved. The acts were always morally wrong, and the new law aligns with that. This maintains the rule of law by formal changes rather than ad hoc decisions.

  The user's deeper need is to present a balanced view in their article. They need to explain why the trials were just without dismissing positivism entirely. Highlighting that positivism can accommodate such transitions through systemic changes, not moral judgments alone, would show nuance. Also, emphasizing the distinction between legal validity and moral critique allows positivism to coexist with just outcomes. 

  Costs: Rejecting step (3) means accepting that legal systems can change their validity criteria, which might unsettle some positivists. However, it preserves the core tenets by focusing on social practice. Rejecting step (4) by redefining retroactivity might risk the rule of law, so it's better to target step (3). The cost is acknowledging that legal validity is dynamic, but that's a realistic view of how legal systems operate post-regime change.
answer: |-
  Your instinct is sharp—**the equivocation happens precisely in steps (3) and (4) around the word "lawful."** Your professor’s argument is clever but smuggles in a conflation between **legal validity** (a positivist concept) and **moral permissibility** (a natural law concept). Here’s how to dismantle it while preserving the rule of law’s core:

  ### The Critical Flaw: Reject Step (3)
  - **Step (3) claims:** "If Nazi statutes were valid law, then the informers acted lawfully."  
  - **Why it fails:** "Lawful" here conflates two ideas:  
    (a) *Compliance with positive state law* (the informers violated no Nazi statute).  
    (b) *Moral/legal innocence* (their acts deserve no punishment).  
    **Positivism only endorses (a).** It does *not* imply that compliance with valid law shields one from future moral or legal accountability if the system itself is illegitimate.  

  ### Why This Resolves the Paradox
  1. **Postwar courts rejected Nazi laws' *validity*** (via Radbruch or inherent injustice doctrines).  
     - **Positivist reply:** This was a *change in the rule of recognition* (Hart’s term). Post-1945 Germany repudiated the Nazi legal order. When new courts declared Nazi laws invalid *ab initio*, they established a new legal framework where denunciations were **never "lawful"** in the eyes of the *new* system.  
     - **Cost:** Accepting this requires acknowledging that revolutions/regime changes reset legal validity. But this is consistent with positivism! Validity depends on *current* social practices (e.g., post-Nazi Germany’s consensus rejecting Nazi norms).  

  2. **Even under positivism, the informers committed *other* crimes:**  
     - Their acts (e.g., false testimony leading to murder) violated **pre-Nazi German criminal law** (e.g., murder, perjury). Nazi statutes *purporting* to authorize such acts were deemed void by postwar courts.  
     - **Thus, they broke laws that *persisted* through the Nazi era** (Weimar-era Penal Code §211 on murder). No retroactivity needed.  

  3. **Retroactivity (step 4) is a red herring:**  
     - Punishing the informers wasn’t retroactive **if their acts were criminal under enduring principles** (e.g., "murder is illegal"). Nazi "authorizations" were treated as void, so no "lawful conduct" was retroactively punished.  
     - **You keep step (5):** The rule of law’s ban on retroactivity remains intact. The trials argued the informers’ acts were *always* illegal—just obscured by a tyrannical regime.  

  ### What Rejecting Step (3) Costs You
  - **Minor cost:** You must accept that legal validity can shift dramatically when regimes fall. This unsettles some positivists who prefer continuity, but it’s empirically true (e.g., post-apartheid South Africa).  
  - **No cost to the rule of law:** Banning retroactive punishment is preserved. The informers weren’t punished for "obeying law"; they were punished for *violating fundamental norms* that survived the Nazi interregnum.  

  ### Your Professor’s Natural Law Gambit
  - His "clean kill" assumes positivism cannot condemn the Nazi system. But **positivism isn’t morally blind**—it simply separates *what law is* from *what law ought to be*. A positivist can morally condemn Nazi laws while acknowledging their validity *within that system*.  
  - **Radbruch’s formula** ("intolerable injustice") is a *post-hoc tool* for transitional justice, not a refutation of positivism. It’s a new rule of recognition in action.  

  ### How to Frame This in Your Article
  > "The grudge informer trials exposed a collision between two ideas: that laws must come from legitimate sources, and that laws must be just. Positivism resolves this by showing that the postwar courts *changed Germany’s legal ground rules*. They declared Nazi statutes void not because of moral flaws alone, but because the new legal order—rooted in restored constitutional principles—rejected the Nazi regime’s authority. The informers weren’t punished retroactively; they were judged by enduring standards of justice that the Nazi regime had attempted, but failed, to erase."

  **Bottom line:** Step (3) is the weak link. Sever it, and the paradox collapses. You uphold the rule of law, avoid retroactivity, and salvage positivism by showing that legal validity is dynamic—not a moral shield for atrocities. Your professor’s smile might fade when you point out he’s using "lawful" as a sleight of hand.
