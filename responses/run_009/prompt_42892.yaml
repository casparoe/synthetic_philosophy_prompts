prompt: |-
  I teach a bioethics seminar and every year we do a unit on consent, and every year I realize my own gut verdicts don't line up into anything like a theory, so this time I'm just going to lay them out and see if you can find the principle underneath, if there is one. Surgeon doesn't mention that a resident will do half the operation under her supervision: consent invalid, the patient needs to know who's cutting. Someone says I love you purely to get someone into bed: sleazy, but I find myself saying the consent is still valid, which my students tell me I can't have both of. Signing a consent form while in wracking pain that only the procedure can relieve: valid, I think — the pain is pushing you but it isn't anyone coercing you. An employee sleeps with her boss knowing he decides the promotions, and both of them know she'd say no if he didn't: I used to call that coercive and now I honestly waver. Tipsy yes after two glasses of wine: valid. A yes given while blackout drunk: invalid. But a yes given by someone who is sober but in the grip of a manic episode, who at baseline would never: invalid too, and I can't say why that one's clear to me when the wine one is clear and the middle cases aren't. Threat to end the relationship unless she sleeps with him: valid, I want to say, it's a rotten thing to do but you're allowed to leave for any reason. Same ultimatum but the threat is to reveal her immigration status: invalid. So the coercion cases split by what's threatened, not by the pressure itself, is that right?

  Give me a principle, or two or three candidates, that captures as much of this as possible. Say which of my verdicts you'd overturn and why, tell me what your account predicts for a case I haven't listed (I'm curious about the patient who consented to a procedure years ago and now, demented and resisting, seems to have withdrawn), and be honest if the whole set just doesn't compress. Please write in continuous prose, no headings or bullet points, like an email — I want to read it straight through.
reasoning: |-
  Okay, the user teaches bioethics and is struggling to reconcile their intuitive judgments about consent cases into a coherent theory. They've listed several scenarios where their gut reactions seem inconsistent: surgeon not disclosing a resident's involvement (invalid consent), saying "I love you" deceptively (valid but sleazy), consent under severe pain (valid), employee-boss dynamics (wavering on coercion), tipsy vs. blackout drunk vs. manic episodes (differing validity), and threats involving relationship termination versus immigration status (valid vs. invalid). 

  Hmm, what's really going on here? The user seems frustrated by annual realizations that their instincts don't form a unified framework. Their examples cluster around three tension points: information asymmetry (what must be disclosed), compromised capacities (intoxication/mental states), and power differentials (coercion nuances). The dementia follow-up question suggests they're also grappling with temporal dimensions of consent. 

  Let me unpack their dilemmas. First, the surgeon case hinges on material information - patients reasonably care about who operates. The "I love you" deception feels different because while morally repugnant, it doesn't violate core consent elements if the deceived party still chooses the act itself. But why does the boss-employee case give pause? Ah, it's the institutional power creating implicit duress - not an overt threat but an ambient condition distorting choice. That's why the immigration threat crosses into coercion: it weaponizes systemic vulnerability. 

  The intoxication/manic episode contrast is telling. Tipsy consent remains valid because cognition isn't obliterated; blackout drunk and mania involve complete incapacity to understand consequences. The pain case is valid precisely because the pressure isn't human-generated coercion but natural circumstance - similar to consent during childbirth. 

  For a unifying principle, autonomy seems key but needs refining. Maybe valid consent requires: adequate disclosure of material facts, present capacity for reasonable deliberation, and absence of illegitimate control. "Illegitimate" does heavy lifting here - threats exploiting legal vulnerabilities (immigration) or core relationships (parent-child) differ from permissible leverage (relationship ultimatums). 

  The dementia case exposes consent's temporal fragility. Prior consent shouldn't bind when current self expresses contrary will, unless it was a specific advance directive for this scenario. We must honor the person who exists now. 

  Would overturn any verdicts? The boss case likely qualifies as coercive - the power imbalance itself creates illegitimate control, even sans explicit threat. Also, severe pain might sometimes invalidate consent if it prevents comprehension (e.g., signing forms while screaming). 

  User's instincts mostly hold, but their struggle reveals consent isn't binary. It's a spectrum where information, capacity, and control interweave - and we must continually ask: "Does this person genuinely shape what happens to them?"
answer: |-
  Here’s my attempt to untangle your intuitions, which strike me as both deeply humane and remarkably consistent beneath the surface. The principle I’d propose as your implicit anchor is **meaningful agency in context**. Consent is valid when it reflects a person’s reasonably autonomous choice within their circumstances, given the stakes and their capacity to engage with them. This hinges on three interdependent pillars: **material understanding**, **volitional integrity**, and **absence of illegitimate control**. Let me walk through your cases to show how this might work.

  Start with **material understanding**. Consent requires grasp of the core facts that would reasonably matter to a person’s decision. The surgeon omitting the resident’s role violates this: who wields the scalpel is objectively material to bodily risk and trust. It’s not about technical skill alone; it’s about the patient’s right to know who enters their body. Contrast this with the deceptive "I love you." While repugnant, the lie targets motivation, not the act’s inherent nature. The person consents to sex *as they understand it*—physical intimacy—even if under false pretenses about emotional commitment. The sleaze is ethical, not a validity issue, because the deception doesn’t alter the fundamental reality of the act itself. Your students might protest, but your split feels right: validity hinges on whether the deception distorts *what* is consented to, not *why*.

  Now, **volitional integrity**: the choice must stem from a functioning will, not incapacitation. Your drunk/sober/manic cases clarify this. Tipsy after two glasses? Cognitive faculties are likely intact enough for reasonable choice; impairment is modest. Blackout drunk? Volition is shattered—no capacity to understand or endorse actions. The manic episode, even without substances, parallels blackout drunkenness: a pathological state that severs connection to one’s core values and judgment ("baseline would never"). The pain case fits here too: agony doesn’t destroy understanding or agency—it *focuses* it. You’re choosing relief with clear (if desperate) intentionality. No one is hijacking your will; you’re responding authentically to circumstance.

  Finally, **absence of illegitimate control**. This is where power and threats enter. Your coercion split—relationship threat vs. immigration threat—is pivotal. Ending a relationship is a *legitimate* (if cruel) expression of autonomy; you’re allowed to set conditions for continuing intimacy. Threatening deportation exploits *illegitimate* power—leveraging systemic vulnerability (legal status) to compel submission. The boss-employee case wavers because it straddles this line. If promotions hinge on sexual compliance, it’s not just personal leverage; it’s an abuse of institutional authority, weaponizing economic precarity. On my account, I’d overturn your wavering here: this *is* coercive. The power imbalance itself creates a climate of duress where "yes" isn’t freely given—it’s extracted by fear of professional harm. It’s illegitimate control.

  **So, your unified principle:** Consent is valid when a person, with adequate understanding of material facts, and without catastrophic impairment of will, agrees free from domination by illegitimate external power.

  **Your unlisted case: The demented patient.** Suppose they consented years ago to a procedure (say, amputation for a worsening condition), but now resist. Your principle suggests: prior consent doesn’t bind. Why? *Material understanding* has shifted—they cannot now grasp the procedure’s purpose or consequences. *Volitional integrity* is compromised by dementia; their resistance expresses current incapacity, not mere reluctance. *Illegitimate control* isn’t at play, but the first two pillars fail. We honor the person before us, not a shadow of their past self, unless they left specific, applicable advance directives (which themselves require past material understanding). Forcing treatment would override present agency.

  **Where it strains?** The edges of "material" facts (e.g., must a surgeon disclose their divorce stress?) or "modest" impairment (a third glass of wine?). But your instincts map well: validity isn’t all-or-nothing but a gradient where we ask, "Could this person meaningfully steer their own ship in these waters?" Your gut verdicts aren’t chaotic—they’re a nuanced recognition that consent isn’t a checkbox, but a fragile human act, shaped by truth, selfhood, and power. I’d trust that gut. It’s more theory than you think.
