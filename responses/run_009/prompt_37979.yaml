prompt: |-
  At a family dinner last week, my cousin — a committed nationalist in the philosophical rather than the political-party sense — defended the claim that compatriots have special claims on one another by analogy: the nation is a family writ large. Feeding your own children before strangers' children is not partiality in any vicious sense; it is simply what it is to be a parent. Likewise, he argued, giving priority to compatriots in welfare spending — even when distant strangers are far worse off — is not bias to be apologized for but the ordinary shape of a special relationship. He leans on three features of the analogy in particular: family obligations are not consented to (one does not sign a contract with one's siblings), they are not conditional on the recipients' merit (one does not audit one's relatives' deservingness before helping them), and they involve a shared budget that is ours rather than yours or mine. He then runs the analogy in both directions: the first two features are meant to defeat the cosmopolitan's demand that obligations be either consented to or owed to humanity at large, while the third is meant to recast foreign aid as generosity rather than duty. I would like a careful audit of this analogy. Please set out the correspondence table — what is meant to play the roles of the parent, the siblings, the household budget, and the front door — and then identify where the mapping breaks, separating the disanalogies that matter for his intended uses (justifying priority to compatriots, and downgrading duties to outsiders) from those that do not. Along the way, consider whether the analogy proves too much, licensing priority to compatriots even in trivial cases where we would not accept such priority within a family; whether it can explain why compatriots who despise each other, or share nothing but a passport, still owe each other anything; and whether it leaves the cosmopolitan with any account of why the rich owe the distant poor anything at all beyond optional charity. Finally, once the disanalogies are on the table, does his conclusion survive? Can the special claims of compatriots be defended on some other footing — say, shared institutions, cooperative schemes, or a common culture — that the analogy was never needed to supply? If a better analogy is available for his position, state what it is and whether it carries the conclusion more securely than the family did.
reasoning: |-
  Okay, the user presents a complex philosophical analogy comparing national obligations to family duties. The cousin's argument rests on three key features: non-consensual obligations, non-merit-based assistance, and shared resources. 

  Hmm, this requires unpacking the analogy systematically. First, let's map the cousin's intended correspondences: nation as parent, citizens as siblings, national treasury as household budget, national borders as front door. The analogy aims to justify prioritizing compatriots while framing foreign aid as charity.

  But where does this break down? Several critical disanalogies come to mind. The moral weight differs vastly - parents literally create children's existence, while states don't create citizens in that sense. Scale matters too; intimate family knowledge disappears at national levels. And crucially, voluntary association: people can leave nations but not families. 

  The user's deeper concerns seem to be: 1) whether this justifies unfair domestic inequalities 2) why obligations exist between hostile compatriots 3) if it completely negates duties to foreigners. The analogy struggles with all three. That hostile citizens point is particularly damaging - siblings who hate each other still have obligations, but passport-sharers might not.

  Perhaps better foundations exist without analogies. Shared institutions create obligations through reciprocity. Cooperative schemes generate fairness requirements. Common culture might bind, but risks excluding minorities. The shared institutions approach seems strongest - it explains obligations without blood metaphors while allowing for duties beyond borders where institutions connect us globally.

  The conclusion? The family analogy oversimplifies. While special national obligations exist, they're better grounded in cooperative frameworks than pseudo-familial bonds. And crucially, this doesn't eliminate duties to distant strangers where global systems create interdependencies.
answer: |-
  Here's a careful audit of your cousin's "nation as family" analogy, structured to address your concerns:

  ### Correspondence Table
  | **Family Element** | **National Analog** | **Role in the Argument** |
  |-------------------|---------------------|--------------------------|
  | **Parent**        | The Nation/State    | Source of obligation, provider, authority figure allocating resources. |
  | **Siblings**      | Compatriots (Fellow Citizens) | Recipients of special obligations; the "children" whose needs are prioritized. |
  | **Household Budget** | National Treasury/Public Funds | The finite pool of resources ("ours") subject to special allocation rules. |
  | **Front Door**    | National Borders    | Boundary separating "insiders" (obligations) from "outsiders" (charity). |
  | **Feeding Children** | Domestic Welfare Spending | Core example of justified priority. |
  | **Strangers' Children** | Foreign Needy | Those outside the special relationship, deserving only optional aid. |

  ### Critical Disanalogies (Grouped by Relevance to Conclusion)
  **I. Disanalogies Undermining His Intended Uses (Priority to Compatriots & Downgrading Outsiders):**
  1.  **Moral Gravity of Creation & Dependency:**
      *   **Family:** Parents *create* their children's existence and total dependency. This ontological relationship grounds an exceptionally strong, non-voluntary duty of care.
      *   **Nation:** States do not *create* citizens in this existential sense. Citizenship is often accidental (birth) or chosen (immigration). The dependency is political/economic, not existential. This weakens the claim for *equivalent* near-absolute priority.
      *   **Why it Matters:** Justifying feeding *your own child* before a stranger's is rooted in the unique moral burden/responsibility of creation and direct dependency. The state-citizen relationship, while significant, lacks this foundational gravity. Priority isn't *automatically* justified to the same degree.

  2.  **Intimacy, Knowledge & Personal Bonds:**
      *   **Family:** Obligations exist within a web of deep, personal love, intimacy, and direct knowledge of needs. Helping is often concrete and immediate.
      *   **Nation:** Relations among compatriots are largely anonymous, impersonal, and mediated by institutions. Citizens rarely know each other's needs directly. Aid is bureaucratic and indirect.
      *   **Why it Matters:** The family bond's strength derives partly from intimacy. The impersonal nature of national ties makes the analogy feel strained. It struggles to explain why a citizen in Glasgow owes a *special duty* to a citizen in London they despise (or don't know), beyond the minimal duty owed to any human, *if* the only connection is shared citizenship papers. The "shared budget" feature alone doesn't replicate the intimacy driving familial duty.

  3.  **Scale, Reciprocity & Exit:**
      *   **Family:** Small scale allows direct reciprocity (emotional, practical) and shared history. Exit is extraordinarily difficult and costly (emotionally, legally).
      *   **Nation:** Vast scale makes direct reciprocity impossible among most citizens. History/culture may be shared abstractly, but not personally. Exit (emigration), while significant, is legally possible and not inherently a rupture of identity.
      *   **Why it Matters:** The "shared budget" argument relies on a level of presumed mutual commitment and entanglement found in families but diluted at national scale. The possibility of exit (however difficult) weakens the analogy to the near-impossibility of leaving a family. This undermines the claim that national obligations are as fundamentally non-consensual as family ones.

  4.  **Proving Too Much? (Trivial Cases & Domestic Inequality):**
      *   **Family Analogy License:** If the nation is *exactly* like a family, it could justify extreme, even harmful, priority: e.g., funding trivial domestic luxuries (new sports stadiums for compatriots) while distant strangers starve, mirroring a (bad) parent buying a child designer clothes while ignoring a starving neighbor's child. We *would* criticize such partiality within a family.
      *   **Why it Matters:** The analogy lacks internal constraints. A robust justification for national priority needs limits – it shouldn't license ignoring *catastrophic* suffering abroad for *minor* domestic benefits. The family analogy, taken literally, struggles to provide these limits, making it over-permissive.

  **II. Disanalogies Less Relevant to His Core Conclusion (but still illustrative):**
  1.  **Biological vs. Political Ties:** Family bonds have a biological/evolutionary basis absent in citizenship.
  2.  **Lifespan:** Nations rise and fall; families (lineages) persist differently.
  3.  **Internal Hierarchy:** Families have parent-child authority structures; citizenship implies (ideally) equality.

  ### Addressing Cosmopolitan Concerns
  *   **Does it Obliterate Duties to Distant Poor?** The analogy, as used by your cousin, attempts to reduce all duties to distant strangers to optional charity. However, this ignores powerful cosmopolitan counter-arguments:
      *   **Common Institutions:** We all participate in global economic/political systems that create interdependence and can generate harms/benefits (e.g., trade rules, climate change, financial systems). These create positive duties of justice, not just charity, to mitigate harms and share benefits fairly.
      *   **Common Humanity & Minimal Decency:** Basic moral obligations arise from shared humanity and the capacity to suffer. While special relationships add *layers* of obligation, they don't erase the baseline duty to prevent severe deprivation where we can do so at reasonable cost (a lower bar than "optional charity").
      *   **The Analogy's Failure Here:** The family analogy actively obscures these grounds for obligation by insisting the *only* model is the near-absolute priority of parent-to-child. It cannot account for duties arising from global interdependence or sheer human need.

  ### Does the Conclusion Survive the Disanalogies?
  The *specific conclusion drawn from this particular analogy* – that national priority is justified *exactly like* parental priority and reduces external duties to mere charity – **does not survive intact**. The disanalogies regarding moral gravity, intimacy, scale, reciprocity, and over-permissiveness are too significant, especially concerning downgrading duties to outsiders.

  ### Can Special Claims of Compatriots Be Defended Elsewhere?
  Yes, the analogy wasn't necessary. More defensible grounds exist:

  1.  **Shared Institutions & Cooperative Schemes (The Most Robust Defense):**
      *   **Argument:** Citizens participate together in dense, coercive systems of law, politics, and economics. They cooperate (implicitly or explicitly) in mutually beneficial schemes (e.g., property rights, infrastructure, social insurance) governed by shared rules. This cooperation generates special obligations of reciprocity, fairness, and mutual support among participants.
      *   **Strengths:** Explains obligations among strangers (they cooperate within the same system). Explains obligations even to undeserving compatriots (the system's benefits and burdens apply to all members). Grounds limits (obligations relate to maintaining the just functioning of the *shared scheme*, not absolute priority). Compatible with significant global duties (if we participate in harmful global schemes).
      *   **Weakness:** Scope and strength of obligations can be debated (how beneficial is the scheme? how coercive?).

  2.  **Common Culture/Identity (More Contingent):**
      *   **Argument:** Shared language, history, traditions, or values create bonds of solidarity and mutual concern.
      *   **Strengths:** Resonates emotionally; explains felt connections.
      *   **Weaknesses:** Culturally exclusive; doesn't bind those who reject the culture; obligations feel less binding than institutional arguments; vulnerable to internal diversity; doesn't easily explain duties to those who share only a passport, not the culture.

  ### Is a Better Analogy Available?
  The **"Cooperative Venture" or "Shared Project"** analogy is significantly better than the family analogy for grounding special obligations among compatriots while avoiding its pitfalls.

  *   **The Analogy:** Think of a nation as a large, complex, ongoing cooperative project (like a massive volunteer organization, a university, or a business partnership writ large). Members contribute (taxes, labor, participation) and benefit (security, infrastructure, public goods) according to shared rules. They rely on each other to play their part and maintain the project.
  *   **Why it's Better:**
      *   **Accommodates Strangers:** Explains obligations among anonymous participants.
      *   **Explains Shared Budget:** Resources are pooled *for the purpose of the cooperative venture*.
      *   **Non-Consensual Element:** Often born into it, but participation is ongoing and benefits are received.
      *   **Non-Merit-Based:** Obligations flow from membership in the scheme, not individual deservingness *per se* (though the scheme may have rules about desert).
      *   **Limits Priority:** Obligations are tied to the needs of the *venture itself* and fair distribution of its benefits/burdens. Funding trivial domestic luxuries isn't a core need of the cooperative project. Maintaining basic welfare for participants often is.
      *   **Leaves Room for Global Duties:** Doesn't preclude obligations arising from participation in *global* cooperative ventures (e.g., trade, environment) or basic duties of humanity.
      *   **Handles Dislike:** Obligations exist because you are co-participants relying on the same system, regardless of personal affection.
  *   **Does it Carry the Conclusion More Securely?** Yes. It grounds special obligations more plausibly for modern, impersonal states than the family model. It provides a principled basis for *significant* priority to compatriots (maintaining the just cooperative scheme) without implying the near-absolute, intimacy-driven priority of parents to children, and without reducing all external obligations to optional charity. It aligns better with the institutional reality of the state.

  ### Conclusion
  Your cousin's family analogy is rhetorically powerful but philosophically fragile. Its key disanalogies (moral gravity, intimacy, scale, over-permissiveness) undermine its use to justify *unqualified* priority for compatriots and to categorically downgrade duties to distant strangers to mere charity. While special obligations among compatriots are defensible, they are more securely grounded in **shared institutions and cooperative schemes**. This "cooperative venture" analogy provides a superior foundation, acknowledging significant special duties while avoiding the pitfalls of the family model and leaving conceptual space for robust cosmopolitan duties based on global interdependence, shared institutions, and common humanity.
