prompt: |-
  I'm a senior engineer at a ~40 person startup and I keep bumping into something I suspect philosophers have a name for, though I don't know what it is. A while back I read about an old debate between two guys — Clifford and James, I think — where one of them basically says it's always wrong to believe anything without enough evidence (his example is a shipowner who talks himself into believing his rusty ship is seaworthy, sends it out full of passengers, and it sinks), and the other says that's too strict, because sometimes you have to choose anyway and believing you'll succeed is part of what makes success happen. I don't want the philosophy lecture. I want the operating procedure.

  The situation I actually face: over and over, someone on my team proposes that we treat an unverified thing as true. The third-party auth library is fine to ship because the senior dev vouches for it and nobody's done an independant audit. The founder wants everyone to believe we'll close the big enterprise deal by Q3 because "the team believing it is part of what makes it happen". We quietly assume our main competitor isn't building the same feature because it would be really inconvenient if they were. Every one of these is a belief we're adopting ahead of the evidence, and right now we decide by vibes and seniority.

  So write me a decision procedure I can actually run in ten minutes: the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with a "no, go get the evidence first", and where it honestly hands off to a human because it's a values question and not a facts one. Somewhere it has to deal with the awkward bit my founder keeps exploiting — that sometimes believing p makes p more likely (morale, confidence, grit) and sometimes it just makes us feel good while p stays just as unlikely as it ever was — and I want it to handle that distinction for real, not wave at it. And at some point it has to face the fact that you can't exactly choose to believe things on command, since half the time "let's believe we'll hit the deadline" is really "let's all pretend and see". Run the procedure on the three cases above, and make sure at least one comes out with an answer I won't like — I'd rather the procedure embarass me than flatter me. Assume decisions above a certain stakes level go to the founders, the rest get signed off by me.

  Two constraints on how you write it up. First, no formatting whatsoever — no bullet points, no headings, no bold, no tables — just continuous prose like a long email, and yes I realise that's an annoying way to deliver a checklist, live with it, write the steps as flowing sentences. Second, please seperate what's genuinely settled in this whole area from what people who study it for a living still argue about — if half the field thinks believing ahead of the evidence is sometimes fine and the other half thinks it's never fine, say that plainly rather than picking a side and dressing it up as the consensus. British English too if you don't mind, half my team sits in Manchester and they've started mocking my spellings.
reasoning: |-
  Alright, let's tackle this. The user is a senior engineer at a startup facing repeated situations where the team adopts beliefs without sufficient evidence. They mentioned the Clifford-James debate: Clifford argues it's always wrong to believe without evidence, while James thinks sometimes you need belief to succeed. The user wants a practical decision procedure, not philosophy.

  First, I need to understand their actual pain points. The examples given are using an unaudited auth library, assuming a big deal will close because the founder says so, and ignoring competitor risks. Decisions are currently based on vibes and seniority, which is problematic. The founder exploits the idea that belief can influence outcomes, but the user wants to distinguish when that's valid versus wishful thinking.

  The user's explicit request is a step-by-step procedure in British English, no formatting, with clear distinctions between settled ideas and ongoing debates. They want it run on their three examples, with at least one outcome they won't like. Also, they need to handle the belief-influencing-reality aspect realistically.

  Deep needs might include reducing cognitive biases in decision-making, establishing a structured process to counter seniority-based decisions, and preventing over-optimism from leading to costly mistakes. They might also want to empower their team with a tool that promotes evidence-based actions without stifling initiative.

  Key elements for the procedure:
  1. **Stakes Assessment**: Start by evaluating the cost of being wrong. High stakes require more evidence.
  2. **Evidence Check**: Determine if evidence exists. If yes, assess its quality. If no, decide if it's feasible to obtain.
  3. **Belief-Reality Link**: Critically evaluate if believing actually affects the outcome (e.g., morale vs. false confidence).
  4. **Values vs. Facts**: Separate factual uncertainties from value judgments, delegating the latter to appropriate stakeholders.
  5. **Fallback Action**: When evidence is lacking but action is needed, opt for mitigation strategies instead of blind belief.

  For the belief-influencing-reality part, I need a clear test: Does acting on this belief change behavior in a way that impacts the outcome? For example, believing in closing a deal might motivate extra effort, whereas ignoring a competitor doesn't prevent their actions. 

  Applying this to the examples:
  - **Auth Library**: High stakes (security risks), low evidence (only senior's word). Verdict: Audit required.
  - **Enterprise Deal**: Belief might boost effort, but evidence is weak. Mitigation: Plan for failure, no blind belief.
  - **Competitor Feature**: Stakes high, evidence absent. Verdict: Research needed, not denial.

  The competitor example should give an unpopular answer (don't ignore it), challenging the team's avoidance. This meets the user's request for an unflattering outcome.

  Philosophically, settled is that insufficient evidence increases risk; debated is whether pragmatic belief is ever justified. The procedure must reflect this, avoiding dogma while promoting prudence.
answer: |-
  Right, let's crack on. No fluff, no formatting, just the steps. I’ll lay out a decision procedure you can run in ten minutes when someone proposes treating an unverified thing as true ("P"). It’s built on a few settled ideas from philosophy and decision theory: insufficient evidence *always* increases risk (that’s uncontroversial), and acting *as if* P is true isn’t the same as *believing* P is true (also settled). Where it gets messy is James’s point – sometimes committing to P *does* alter outcomes via effort or morale (the "self-fulfilling prophecy" bit), but experts still scrap over when that’s valid versus delusional. The procedure forces you to confront that head-on. Stakes thresholds are yours to set (e.g., "cost of being wrong > £X or > Y weeks delay"). Above threshold, escalate to founders; below, you decide.

  **The Procedure (British English, prose only):**

  Start by writing down P clearly: "We believe [X] is true without direct evidence." Then ask these questions in order. Stop if any answer triggers a red or amber light.

  1.  **What’s the cost if P is false?** Estimate time, money, reputation, or safety impact. If catastrophic (e.g., security breach, company death), it’s a red light: stop and demand evidence *before* proceeding. If low (minor inconvenience), you might tolerate more risk. Moderate cost moves you to question 2. *Settled principle: High stakes demand higher evidence. No serious debate here.*

  2.  **Is evidence for P realistically obtainable now?** If yes (e.g., you *could* audit the library, research the competitor, or get clearer signals on the deal), and the cost of getting it is reasonable vs. the stakes, it’s a red light: go get the evidence first. If obtaining evidence is impossible, wildly disproportionate, or would take too long (e.g., knowing a competitor’s roadmap is unknowable), move to question 3. *Settled: Evidence is preferable where feasible. Debated: What counts as "reasonable" cost/effort.*

  3.  **Is there *any* credible evidence supporting P, even if weak?** (e.g., senior dev’s *track record*, founder’s *past deals*, competitor’s *public statements*). If absolutely none (pure gut feeling), it’s an amber light: proceed only with major mitigations (see step 6). If some exists (even if biased/anecdotal), move to question 4. *Settled: Zero evidence is reckless under pressure. Debated: How much weight to give expert intuition.*

  4.  **Does *acting as if P is true* significantly increase the chance of P *becoming* true?** This is the James/Clifford knife-edge. Be brutal: does believing P *directly* change your team’s actions/output in a way that materially impacts the outcome? Founder’s "belief closes deals" might pass *if* it triggers specific, extra effort (e.g., more demos, tailored proposals). Believing the competitor isn’t a threat *doesn’t* stop them building the feature – it just makes you complacent. If yes (genuine self-fulfilling mechanism), move to question 5. If no (it’s just hope/denial), amber light: mitigations needed. *Highly debated: Philosophers and psychologists fight over the boundaries and magnitude of this effect. The procedure forces you to articulate the causal link.*

  5.  **Can you achieve the motivational benefit without actually *believing* P?** Often, you can. Instead of "We *believe* we’ll close the deal by Q3", try "We’ll *act as if* we’re closing by Q3, but track these failure signals". Or "We’ll pursue this deal *aggressively* while assuming nothing". If the action is the same, ditch the belief demand – it’s epistemically cleaner. If the motivational boost *genuinely* requires swallowed belief (rare, and slippery), it’s a provisional green light *but* you must pair it with step 6. *Settled: "Acting as if" is safer than forced belief. Debated: Whether true belief is sometimes psychologically essential.*

  6.  **What’s the mitigation plan for when P is false?** Never let P stand naked. Define: What will we monitor to spot P failing? What’s the trigger to act? What’s the backup plan? (e.g., "If library audit isn’t done by launch, we isolate it behind an API gateway"; "If deal hasn’t progressed by Month 2, we cut burn rate"). No mitigation possible? Red light. Solid mitigation? Provisional green light. *Settled: Contingency planning reduces risk. No debate.*

  **Output:** Red light = Don’t adopt P. Go get evidence or kill the plan. Amber = Only "act as if" P, with strong mitigations. Green = You can provisionally treat P as true, *with* mitigations and monitoring. Always document the rationale.

  **Running your examples (assume decisions are below stakes threshold, so you decide):**

  1.  **Third-party auth library:** P = "Library is secure". Cost if false? Catastrophic (breach, reputation). Evidence obtainable? Yes (audit). → **Red Light.** Stop. "Senior dev vouches" is evidence (Q3), but stakes are too high for weak evidence. Demand audit before shipping. *You won’t like this – it causes delay. But Clifford’s shipowner example applies directly.*

  2.  **Founder’s enterprise deal:** P = "We’ll close by Q3". Cost if false? High (missed targets, wasted effort). Evidence obtainable? Partially (track engagement, but no certainty). Some evidence? Maybe (founder’s conviction, but track record matters). Does belief make it true? *Potentially*. If belief fuels tangible extra effort (more calls, custom work), *maybe*. Can you get the effort without belief? Probably ("Push hard, but assume nothing"). → **Amber Light.** Do *not* adopt belief in P. Instead: "We will act *as if* we’re closing by Q3 (driving hard effort), but monitor these deal-health metrics weekly. If no signed LOI by [Date], we trigger cost-cutting plan X." Founder’s "belief required" claim gets neutered by step 5.

  3.  **Competitor isn’t building same feature:** P = "Competitor isn’t building Feature X". Cost if false? High (wasted dev time, lost advantage). Evidence obtainable? Yes, within reason (analyse their releases, talk to contacts, check job ads). → **Red Light.** Stop. "Inconvenient if they are" is not a reason. Go find evidence. This is pure wishful thinking – no self-fulfilling mechanism (Q4 fails). *This should embarrass the team. It’s denial, not strategy.*

  **Where Philosophy Still Fights:**

  *   **James vs. Clifford:** No consensus. Clifford’s strict evidentialism (never believe without proof) clashes with James’s pragmatism (belief justified if vital and forced). This procedure leans Clifford on *belief* but allows Jamesian *action* via "act as if" + mitigations. Many modern philosophers split the difference contextually.
  *   **Can belief be chosen?** Settled: You can’t *directly* choose core beliefs on command. You *can* choose to act, focus attention, or adopt working hypotheses – which sometimes leads to belief. The procedure avoids demanding belief; it focuses on action and monitoring.
  *   **Weight of Expert Intuition:** Unsettled. How much does a senior dev’s "vouch" count? Depends on their reliability, but it’s never *proof*. The procedure treats it as weak evidence (Q3).

  This gives you a defensible, quick process. It calls out magical thinking (your founder’s move), forces mitigations, and prioritises evidence where stakes are high. It won’t make you popular when it says "no", but it might stop your ship sinking. If the founder overrules you on a high-stakes red light? Document it, build the mitigation, and update your CV. Good luck.
