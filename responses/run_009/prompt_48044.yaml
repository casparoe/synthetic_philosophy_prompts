answer: |-
  Your debate cuts to the heart of utilitarianism's capacity to protect minority liberties against majority sentiment. Let's dissect the comparison systematically, grounded in the texts and philosophical structure.

  ### (1) Difference of Degree vs. Principle: The Core Disagreement
  - **Bentham's Empirical Balancing:** Your friend is correct. Bentham's argument (e.g., in "Offences Against One's Self" and "Principles of Morals and Legislation") treats disgust as a *real but negligible disutility*. He dismisses it not because it *can't* count, but because it is:  
    - **Empirically weak** ("imaginary mischief" lacking tangible injury)  
    - **Self-defeating** (punishment creates more suffering than it prevents)  
    - **Irrationally sourced** (from "asceticism" or religious prejudice).  
    His reasoning is a **utilitarian calculation**: Disgust is outweighed by the suffering of punishment and the pleasure of consensual acts. *Example*: "The mischief of the first order... is none at all... The mischief of the second order... is the pain of apprehension... The third... is the punishment itself" (Bentham, c. 1785).

  - **Mill's Categorical Exclusion:** Mill explicitly excludes "mere dislike" from the ledger. In *On Liberty* (Ch. IV), he states:  
    > "There is no parity... between the feeling of a person for his own opinion, and the feeling of another who is offended at his holding it; no more than between the desire of a thief to take a purse, and the desire of the right owner to keep it."  
    Offense is **not harm** for Mill; it's a *sentiment* that cannot justify coercion. The harm principle is a **side-constraint**: Only conduct causing *perceptible damage* to others' interests may be restricted.

  **Verdict:** Your friend's "principle vs. degree" distinction holds. Bentham *minimizes* disgust; Mill *excises* it from the justification for coercion. Mill’s harm principle is a qualitative boundary, not a quantitative balance.

  ### (2) Does Bentham's Approach Collapse in the Limiting Case?
  Yes, **Bentham's framework theoretically permits criminalization** if majority disgust were intense and widespread enough to outweigh other utilities. However, he has *contingent resources* to resist this:
  - **Enforcement Costs**: Punishing private acts requires invasive surveillance (e.g., "spies and informers"), breeding universal distrust and suffering ("mischief of the second order").
  - **Slippery Slope**: Criminalizing "victimless" vices risks expanding state tyranny over all private life.
  - **Epistemic Doubt**: Disgust is unreliable evidence of harm, often rooted in "prejudice" or "caprice" (Bentham's terms).
  - **Pleasure/Pain Asymmetry**: The pleasure of consensual acts is direct and intense for participants, while disgust is a fleeting sentiment for observers.

  **But these are contingent defenses.** If a society's disgust were *overwhelming* (e.g., 99% experience severe psychological distress) and enforcement costs *low* (e.g., easy detection), Bentham's calculus *could* endorse criminalization. Mill’s principle would still forbid it categorically. Bentham solves the easy case (mild disgust); Mill solves the hard case (intense disgust).

  ### (3) Can a "Displeasure Filter" Be Built on Benthamite Grounds?
  This is the crux. Bentham lacks a principled criterion to exclude disgust *intrinsically*. He offers:
  - **Descriptive Filters**: Disgust is (1) *weak*, (2) *unreliable*, (3) *parasitic on prejudice*. But these are empirical generalizations, not normative principles.  
  - **Rule-Utilitarian Escape?**: A rule like "Never criminalize based on displeasure" might maximize utility long-term. Yet Bentham rejects rigid rules; his utilitarianism is act-based.  

  **True Gaps in Benthamism:**
  - **No Theory of "Harm"**: Bentham never defines which pains "count." Disgust is discounted *ad hoc*, not by principle.
  - **Preference-Satisfaction Trap**: If utility is preference-satisfaction, *any* preference (even racist or homophobic disgust) must be included.
  - **Circularity Risk**: Calling disgust "irrational" requires a non-utilitarian standard of rationality.

  **Can Utilitarianism Generate Its Own Filter?** Only partially:
  - **Higher-Order Utility**: Filter displeasures that, if indulged, *systematically reduce utility* (e.g., by fostering tyranny). But this relies on contingent social dynamics.
  - **Autonomy Utility**: Mill’s *On Liberty* argues free expression/action cultivates human development, yielding greater long-term utility. Yet this still instrumentalizes liberty; it doesn't categorically exclude disgust.
  - **Idealized Preferences**: Some utilitarians (e.g., Harsanyi) argue only "rational" preferences count. But defining rationality without importing external values is notoriously difficult.

  **Conclusion:** Your friend identifies a genuine rupture. Bentham’s utilitarianism **cannot generate a principled filter** using only its internal tools. Mill’s harm principle imports a **non-utilitarian concept of harm** (rooted in a normative view of personhood) to exclude displeasure categorically. This shows utilitarianism’s **structural vulnerability to majoritarian tyranny** without supplemental principles. As Mill himself conceded, utilitarianism needs "secondary principles" (like liberty) to protect core interests that direct utility calculations may overlook.

  ### Philosophical Implications
  - **Bentham’s Strength**: His empirical critique dismantled religious and customary justifications for persecution, grounding reform in tangible welfare.
  - **Mill’s Advance**: He recognized that without a *right-like* boundary, utilitarianism risks sacrificing minorities to majority sentiment. His harm principle is a hybrid of utility and liberal rights.
  - **Utilitarianism’s Reach**: Pure Benthamite utilitarianism is an incomplete theory of criminal law; it requires external constraints (like Mill’s) or robust indirect strategies (e.g., rule-utilitarianism) to protect liberty. Your debate reveals why modern utilitarians (e.g., Peter Singer) often incorporate deontic elements to handle rights.

  You both grasp high-stakes philosophy. Your friend correctly identifies Bentham’s empirical balancing as distinct from Mill’s categorical boundary—and highlights utilitarianism’s deepest tension: Can it protect the individual against the majority without abandoning its core calculus? The answer, tragically, may be "not alone."
