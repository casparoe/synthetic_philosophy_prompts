prompt: |-
  I'm in my school's philosophy club and we're doing a unit on the Meno problem (the whole "why is knowledge worth more than just a true belief" thing from Plato). Everyone in the club just picks the answer that sounds smart so I want to make a quiz that actually sorts people by what they'd say about concrete cases, not by which fancy label they like. Can you write it?

  Like 8 questions, each one a scenario: the lucky hiker who stumbles on the well vs the one who navigates to it, the stopped clock that shows the right time twice a day, someone who predicts rain with a totally superstitious method that happens to have worked so far, a tourist who's sure the bank closes at 5 because she remembers checking vs one who just guessed and got it right, that kind of thing. Each question should have 2-3 answer options saying what makes the difference between the two people (if any), phrased so you can answer without knowing any theory names.

  Then a scoring key that maps answer patterns onto these positions: (1) no real value difference, knowledge is just a word, (2) knowledge matters because it's more stable/reliable, its value is basically practical insurance against nearby errors, (3) the credit/achievement view where knowledge is valuable like sinking a putt vs the ball ricocheting in off a tree, (4) anti-luck AND credit both being required, and (5) the knowledge-first view where true belief is only valuable because it's a way of aiming at knowledge. Also please include at least one question that separates people who think the extra value is just instrumental from people who think it's valuable in itself.

  And at the end, note any answer combinations that no real position occupies (and say if that's because the combo is incoherent or just unpopular lol), plus any two positions the quiz can't really pull apart. Keep it doable for people who've never read any epistemology. Thanks!!
