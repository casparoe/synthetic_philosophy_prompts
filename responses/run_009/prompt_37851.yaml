  I'm in a small reading group on formal epistemology and decision theory that meets after our department's logic seminar, and this term we've been working through what happens when the players of a game can read each other's code — the setting usually called program equilibrium, or open-source games. The case we keep circling back to: two agents face a one-shot Prisoner's Dilemma (payoffs of 3 for unilateral defection, 2 for mutual cooperation, 1 for mutual defection, and 0 for the lone cooperator). Before choosing, each agent can inspect the other's program in full and run it on any input; both know all of this; both are ideal reasoners with unlimited compute and no noise. It's a familiar observation that in this setting there exist programs that mutually cooperate in equilibrium — each cooperating only if the other's code has a matching cooperative-with-verification structure — and that this cooperative profile is an equilibrium of the program game even for agents with fairly conventional decision theories. Even so, our group has split sharply.

  One member, call her A, puts about 0.85 on the proposition that mutual cooperation is what the best theory of rational choice prescribes for both agents in this setting. Another, B, puts about 0.1, on the grounds that the whole construction is Newcomb's problem in a different coat: he takes causal decision theory to be correct, and once the other agent's program is fixed and inspected, causal decision theory supposedly tells each agent to defect. I'd like your own credence on that proposition — but the number alone is less useful to me than the decomposition that produces it.

  Please give a rough probability, with one line of justification each, for the sub-questions you think the overall credence factors into. I'd expect at least these among them: whether causal or a functional/logical decision theory is the correct account of rational choice; conditional on causal decision theory being correct, whether the program-equilibrium setting still prescribes cooperation — since the cooperative profiles are equilibria of the program game even for conventional agents, this turns on equilibrium selection and on what "rational" even means for agents who choose programs rather than moves; whether the self-reference involved in each program simulating the other introduces genuine obstacles, in the vein of the halting problem or Löb's theorem, that matter at this level of idealization; and whether "the rational choice" is determinate enough here to have a truth value at all. Then show how your terms combine into the overall number. After that, tell me (i) which sub-question your final number is most sensitive to, (ii) on which sub-question A and B, at 0.85 and 0.1, most likely disagree, and (iii) what argument or result, if it obtained, would move your number the most. Please close your reply with a final line of the form \answer{...} containing only your overall credence, written as a decimal between 0 and 1 — for instance \answer{0.4}.
