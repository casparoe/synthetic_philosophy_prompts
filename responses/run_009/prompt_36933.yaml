answer: |-
  **Decision Theory Final Exam Question: Parfit's Hitchhiker with Escrow**

  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Instructions:** Answer all parts of the question below. Your answer should demonstrate clear reasoning and understanding of the decision-theoretic principles involved. Write concisely and precisely. You do not need citations; focus on the logical arguments.

  **Scenario:**
  You are stranded in the desert and will die unless rescued. A driver, known to be an extremely reliable predictor of human behavior (effectively perfect for this scenario), approaches. She offers stranded motorists a choice of two deals *before* deciding whether to pick them up:

  1.  **The Plain Deal:** You promise to pay her $1000 once she delivers you safely to the city. She will pick you up *only* if she predicts you will pay upon arrival.
  2.  **The Escrow Deal:** At the moment she picks you up, you hand her a $1500 deposit. Once delivered to the city, you have a choice:
      *   Pay her the promised $1000. She then immediately refunds your $1500 deposit. (Net cost to you: $1000).
      *   Refuse to pay the $1000. She keeps your $1500 deposit. (Net cost to you: $1500).
      The driver will pick you up *only* if she predicts you will pay the $1000 in the city (and thus get your deposit back).

  Assume you value survival very highly (far more than $1500). The driver makes her prediction *after* you choose which deal to accept (Plain or Escrow), but *before* she decides to pick you up or not. If she doesn't pick you up, you die in the desert.

  **Question:**

  **(a)** Explain why an agent using Causal Decision Theory (CDT), who values survival highly, would:
      (i) Die in the desert if only offered the Plain Deal.
      (ii) Choose the Escrow Deal if offered the choice, be picked up, and then pay the $1000 in the city.
      *(Focus on the dominance reasoning CDT applies at the key decision points: choosing the deal, and then acting in the city).* (5 marks)

  **(b)** Does the existence and effectiveness of the Escrow Deal "rescue" CDT by showing rational agents can simply use external commitment devices when needed? Or does it instead expose a fundamental flaw in CDT, precisely because the *original* Hitchhiker problem is meant to illustrate a situation where such commitment is unavailable and the agent can foresee its own future irrationality? Justify your answer. (6 marks)

  **(c)** Evaluate whether the standard proposed *internal* "fixes" for dynamic inconsistency problems like the original Hitchhiker (e.g., Resolute Choice, Constrained Maximization, or Updateless Decision Theory) could achieve the same outcome as the Escrow Deal *without* needing the external deposit mechanism. Specifically, could an agent using one of these approaches, offered only the Plain Deal, rationally get picked up *and* pay in the city? Or does "choosing now what you'll choose later" either collapse back into standard CDT reasoning at the later node or constitute plain irrationality when the later node arrives? Explain your reasoning for at least one fix. (6 marks)

  **(d)** Overall, what does this Escrow variant reveal about the relationship between rationality, commitment, and the structure of decision problems across time? (3 marks)

  ---

  **Model Answer (Approx. 600 words):**

  **(a)** (i) **Plain Deal (CDT Dies):** When choosing whether to accept the Plain Deal, CDT considers the causal consequences of its *current* choice. Accepting the deal only causes the driver to pick the agent up *if* she predicts payment later. Crucially, the prediction depends on the agent's *future* choice in the city. CDT, reasoning at the *city node* after being rescued, sees two options: Pay $1000 or Don't Pay ($0 cost). Since the driver has already acted (picked them up), the prediction is in the past. CDT sees no *causal* link between paying now and having been picked up; that was determined by the prediction based on the future choice that has now arrived. Paying costs $1000, not paying costs $0. Not paying dominates paying *at this node*. CDT thus chooses not to pay. Knowing this is what CDT would do at the city node, the predictor, if offered the Plain Deal, predicts non-payment and doesn't pick the agent up. The agent dies.

  (ii) **Escrow Deal (CDT Lives & Pays):** Choosing the Escrow Deal involves handing over $1500 *upon pickup*. At the *city node* under the Escrow Deal, CDT again evaluates the causal consequences of its choices *now*: Paying $1000 leads to a $1500 refund (Net: -$1000). Not Paying leads to no refund (Net: -$1500). Paying now costs $1000 less than not paying. Paying dominates not paying *at this node*. CDT will pay. Knowing this is what CDT would do at the city node, the predictor, if offered the Escrow Deal, predicts payment and picks the agent up. The agent chooses the Escrow Deal (knowing they will be picked up and pay, netting -$1000 for survival), gets picked up, and pays in the city as planned.

  **(b)** **Exposes Flaw, Doesn't Rescue:** The Escrow Deal exposes a flaw in CDT rather than rescuing it. While it allows a CDT agent to survive in *this specific scenario* by externally altering the payoff structure at the later node to make the desired action locally dominant, it highlights CDT's core vulnerability: its inability to handle predictable future actions that conflict with its current preferences when no such external device exists. The *original* Hitchhiker problem is the paradigm case designed to show this vulnerability – the agent can foresee that its future CDT self will defect (not pay) because defection dominates *at that node*, leading to the worst outcome (death). The Escrow Deal merely provides a technological workaround (the deposit) that masks this internal incoherence by changing the local incentives. CDT's rationality remains fundamentally myopic, dependent on the accident of the decision tree's payoff structure at each node. True rationality should enable the agent to achieve the better outcome (survival for $1000) *without* needing the external crutch of the deposit when only the Plain Deal is available, precisely because it can recognize the causal dependence of the driver's prediction on its own future choice and bind itself accordingly. CDT cannot do this internally.

  **(c)** **Internal Fixes: Potential but Problems (Focus on Resolute/CM):** Internal fixes like Resolute Choice (RC) or Constrained Maximization (CM) aim to overcome dynamic inconsistency by having the agent commit *now* to a *plan* (e.g., "Accept Plain Deal and Pay") and stick to it later, even if the local dominance at the later node favors defection.

  *   **Could it work?** Potentially, yes. An RC/CM agent, offered the Plain Deal, would recognize that committing *now* to the plan "Accept & Pay" leads to the best outcome (survival for $1000). If the predictor recognizes this commitment disposition and predicts payment, she picks the agent up. The agent then pays in the city, sticking to the plan.
  *   **Does it collapse or become irrational?** The central criticism is that *at the city node itself*, when survival is already secured, paying $1000 is causally dominated by not paying $0 (under the Plain Deal). For the RC/CM agent to pay requires them to act *against* the locally dominant action identified by CDT. Critics argue this is irrational ("plain irrationality") *at that moment* because it ignores the causal structure *as it appears then*. Proponents argue it's rational *overall* because it fulfills the commitment made when it mattered. It doesn't collapse back to CDT *at the later node*; it explicitly overrides it based on the prior commitment. However, this requires a controversial form of "self-binding" that standard CDT rejects. Updatelessness (UDT) avoids this by evaluating the *whole* decision problem from the start, considering all possible algorithms/commitments the agent could be running, and choosing the one (e.g., "always pay if rescued after promising") that yields the best expected outcome. UDT would also get rescued and pay under the Plain Deal, viewing the city node choice as part of a single timeless decision. However, UDT's counterfactual reasoning is complex and differs significantly from CDT's node-by-node causal reasoning.

  **(d)** **Revelation:** The Escrow variant starkly illustrates the tension between local and global rationality across time. It shows that rationality can be highly sensitive to the decision problem's structure, particularly the availability of mechanisms to align local incentives with global goals. While external commitment devices (like the deposit) can patch myopic decision theories like CDT, their necessity underscores CDT's failure to adequately integrate foresight and self-prediction into its notion of rational action. True rationality likely requires an ability to effectively bind one's future self internally, akin to the function the deposit serves externally, without relying on such external contingencies. The difficulty of achieving this internally (as seen in the debate over fixes) highlights the deep challenge of rational choice in dynamic, predictable environments.

  ---

  **Marking Scheme (Total: 20 Marks)**

  1.  **CDT Mechanics (Plain & Escrow):** (5 Marks)
      *   Plain Deal: Correctly identifies that at the city node, not paying dominates paying (causally) for CDT, leading to predictor not picking up. (2 marks)
      *   Escrow Deal: Correctly identifies that choosing the deal leads to pickup (because predictor sees payment will happen), and that at the city node, paying dominates *not* paying due to the deposit structure. Explains net cost calculations. (3 marks)
      *   *Common Botch:* Confusing prediction with causation at city node (Plain); Missing how deposit changes dominance (Escrow); Wrong net cost calculation.

  2.  **Rescue vs. Expose Flaw:** (6 Marks)
      *   Clearly states position (Exposes flaw - strongly preferred, Rescue - weak if argued). (1 mark)
      *   Explains *how* Escrow "works" for CDT (external tech altering local payoffs). (2 marks)
      *   Contrasts with original problem's purpose: highlights CDT's inability to handle foreseeable self-defeating behavior *without* external tech. (2 marks)
      *   Argues that true rationality shouldn't depend on accidental availability of such tech for the core problem. (1 mark)
      *   *Common Botch:* Simply stating Escrow works without contrasting to core flaw; Arguing Escrow "fixes" CDT without addressing myopia; Confusing the availability of the deal *option* with CDT's internal capability.

  3.  **Evaluation of Internal Fixes:** (6 Marks)
      *   Identifies relevant fixes (RC, CM, UDT). (1 mark)
      *   Explains how chosen fix *could* work for Plain Deal (agent commits/chooses plan upfront, predictor sees commitment, picks up, agent follows through). (2 marks)
      *   Engages with the key criticism: Does following through at the city node (against local dominance) constitute irrationality *at that time* or valid commitment? (1 mark)
      *   Explains why it doesn't collapse back to CDT *at the later node* (it overrides local dominance based on prior commitment/timeless view). (1 mark)
      *   Acknowledges the controversy/requirement for non-CDT reasoning at the node. (1 mark)
      *   *Common Botch:* Claiming fixes "just work" without addressing the city node dominance issue; Claiming they collapse to CDT at city node; Not explaining the mechanism (commitment/timelessness); Only describing the fix, not applying it to the city node dilemma.

  4.  **Overall Insight & Clarity:** (3 Marks)
      *   Part (d): Insightful comment on rationality, commitment, and problem structure. (2 marks)
      *   Overall clarity, structure, and conciseness of the answer. (1 mark)
      *   *Common Botch:* Vague or generic statement in (d); Poorly organized answer; Excessive verbosity.
