answer: |-
  Here are ten interview questions with follow-ups targeting the core tensions in your guest's intrapersonal constitutionalism:

  1.  **Question (Davidson's Challenge):** You argue akrasia isn't acting against an *all-things-considered judgment* but a bargaining failure among temporal selves. Doesn't this imply that the "winning" self *at the action moment* *does* form an "all-things-considered" judgment *for itself*? Isn't Davidson's core puzzle – acting against what one judges best *at the time of action* – simply relocated to that victorious self?  
      *   **Likely Reply:** She might argue that no single, unified "all-things-considered" judgment exists *for the person* at T2; only the local judgment of the dominant party.  
      *   **Follow-up:** But if the dominant party at T2 makes *its* best judgment considering its immediate context and preferences (e.g., "cake now is best"), isn't the person *still* acting against the judgment they held *at T1* (abstinence is best overall)? Doesn't your model dissolve the *unity* of agency needed for Davidson's puzzle to fully arise, rather than solving it?

  2.  **Question (Ethics of Precommitment):** Framing precommitments (like Ulysses bound) as "internal institutions" suggests they are purely efficiency-enhancing agreements. Yet, the *future self* bound by the diet app blocker or the savings auto-transfer never consented. Isn't this fundamentally *paternalistic* – one temporal self imposing its will on another it deems less competent?  
      *   **Likely Reply:** She might emphasize that selves are interdependent, and such institutions prevent mutual harm (like future regret or health costs), akin to rules preventing over-fishing benefiting all fishermen long-term. It's mutual governance, not hierarchy.  
      *   **Follow-up:** Critics argue this "mutual harm prevention" justification treats the later self as a *threat* to be neutralized, not an equal partner. Doesn't this institutional model inherently privilege the *planning* self's vision of the good, potentially disrespecting the later self's authentic (if discounted) preferences? Isn't the ethical core of self-binding *personal integrity*, not managing a troublesome faction?

  3.  **Question (Responsibility):** If a relapse is a coordination failure among selves, not a failure of an individual's will or reason, how do we assign blame? Take the smoker: the "resolving self" formed a pact, but the "craving self" reneged. Is the *person* blameworthy? If so, *whom* exactly do we blame – the whole "society," the defecting self, or the selves failing to build robust enough institutions?  
      *   **Likely Reply:** She might say responsibility lies with the "society of selves" collectively; blame targets the person because the institutional structure *they* constitute failed.  
      *   **Follow-up:** Doesn't this diffuse responsibility problematically? If the "craving self" genuinely had different preferences and "won" the (failed) bargain, how is *it* blameworthy for acting on its sincere judgment? And if blame falls only on the collective "society," does that reduce personal accountability to a mere systemic failure, absolving the agent *at the moment* of lighting up?

  4.  **Question (Empirical Robustness):** Your model rests heavily on hyperbolic discounting as the engine of preference reversal. However, empirical findings show discounting is domain-sensitive (health vs. money), amount-dependent, varies wildly across individuals, and sometimes fits exponential models. If hyperbolic discounting isn't a universal or stable feature of human psychology, how much of your normative story about internal constitutions survives?  
      *   **Likely Reply:** She might concede variability but argue that *whenever* preference reversals occur due to temporal proximity (regardless of the precise discount function), the inter-temporal conflict and the need for institutional solutions arise. The core problem is dynamic inconsistency, not solely hyperbolic curves.  
      *   **Follow-up:** But doesn't the *strength* and *predictability* of the reversal matter? If reversals are rare, weak, or highly context-specific for many people, doesn't that undermine the fundamental analogy to a persistent commons problem requiring robust *constitutional* solutions? Might many cases then be better explained by occasional judgment errors within a unified agent?

  5.  **Question (Succession vs. Identity):** You model the person as a "succession of parties." How do these parties relate to personal identity over time? Is the connection merely causal and psychological, or is there a stronger metaphysical claim here? Does your view risk fragmenting the person in a way that makes *any* continent action surprising?  
      *   **Likely Reply:** She might stress it's a *model* for action-explanation, not a metaphysical claim about identity. The "parties" represent distinct preference sets arising from discounting, not separate persons.  
      *   **Follow-up:** If it's just a model, how does it differ significantly from describing a single agent whose utilities change over time? Doesn't calling them "parties" with "interests" and "bargaining" implicitly commit you to a stronger view of fragmentation than mere preference change?

  6.  **Question (The "Tolerably Well" Claim):** You state each temporal self "do[es] tolerably well for itself given the others." Doesn't this imply that akratic actions are *locally rational* for the acting self? If so, how does this square with the common intuition that weakness of will involves a *failure* of rationality, even if not Davidson's specific failure?  
      *   **Likely Reply:** She might argue that akrasia *is* locally rational given the discounted preferences, but *globally* irrational for the extended person; the failure is coordination, not individual rationality.  
      *   **Follow-up:** But doesn't describing the akratic act as *rational* for the acting self fundamentally redefine the phenomenon? Doesn't it remove the essential element of *tension* or *regret* that defines the experience of weakness of will, making it look more like simple preference shift?

  7.  **Question (Scope of Internal Institutions):** Beyond obvious precommitments, what counts as an "internal institution"? Could deeply ingrained habits, character traits, or even unconscious psychological mechanisms qualify? How do we distinguish beneficial institutions from pathological rigidity?  
      *   **Likely Reply:** She might define them broadly as any stable internal structure that shapes choice by anticipating and managing inter-temporal conflict, including habits and routines if they serve that function.  
      *   **Follow-up:** Doesn't this broadness risk making the theory unfalsifiable? If continent action *just is* successful internal institutionalization, and akrasia is its failure, how do we identify these institutions independently of the behavior they're meant to explain? What distinguishes a "binding arrangement" from just... sticking to a plan?

  8.  **Question (Normative Foundation):** What grounds the *normativity* of these internal constitutions? Why *should* selves bargain or build institutions? Is it solely for mutual advantage (preventing regret/harm), or is there an appeal to something like the "true self" or long-term autonomy?  
      *   **Likely Reply:** She might lean heavily on mutual advantage and efficiency – preventing the mutual harm caused by preference reversal cycles.  
      *   **Follow-up:** Doesn't the mutual advantage justification face a bootstrapping problem? If the later self genuinely prefers the cake *now*, how is it *harmed* by getting it, even if it regrets it *later*? Doesn't justifying the institution require appealing to a perspective *external* to the particular selves – perhaps a unified agent's long-term autonomy or well-being – which your model seems to reject?

  9.  **Question (Pathologies of Constitution):** Couldn't overly rigid internal institutions be problematic? Think of the person who cannot deviate from a routine even when circumstances truly warrant it, or whose self-binding mechanisms become compulsive (e.g., extreme self-denial). Does your model have the resources to distinguish healthy self-governance from pathological over-control?  
      *   **Likely Reply:** She might argue that robust institutions include mechanisms for amendment or override under exceptional circumstances, just like external constitutions. Pathologies arise when institutions fail to be adaptable.  
      *   **Follow-up:** But who is the "amender"? Doesn't introducing an entity capable of judging when an override is warranted reintroduce a unified agent or "meta-self" standing above the temporal parties, potentially undermining the core pluralistic model?

  10. **Question (Alternatives to Bargaining):** You characterize continent action as successful bargaining/institutionalization and akrasia as its failure. Are there alternative pathways to continent action *within* your framework? Could one self simply overpower the others through sheer motivational force, without any "institution"? Would that still count as continent?  
      *   **Likely Reply:** She might argue that pure overpowering is unstable and costly; true continent *stability* requires institutional solutions that manage conflict predictably. A single overpowering might look continent but isn't sustainable governance.  
      *   **Follow-up:** Doesn't this imply that only *institutionalized* self-control counts as genuine continence in your view? What about the person who resists temptation through a spontaneous act of focused willpower in the moment? Does your model categorize that differently, perhaps as a temporary "victory" but not true continence?
