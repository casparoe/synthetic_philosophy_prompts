  We are going to map Austin's speech act theory to software engineering concepts, especially API design.
   Key concepts from Austin:
     - Performative utterances: utterances that do something (e.g., promise, marry, christen) rather than just describe.
     - Felicity conditions: conditions that must be met for the speech act to be successful (e.g., authority, context, intention).
     - Locutionary act: the act of saying something with a particular meaning (the literal content).
     - Illocutionary act: what is done in saying something (the force: e.g., promising, warning).
     - Perlocutionary act: the effect achieved by saying something (e.g., persuading, frightening).

     Austin also complicates the initial distinction between performatives (which do something) and constatives (which state something) by showing that even constatives are performative (they are acts of stating).

   We are going to use the following software engineering concepts:
     - Pure functions (no side effects) vs. side-effecting calls (change state).
     - Preconditions and postconditions: conditions that must hold before and after a function call.
     - Checked vs. unchecked exceptions: errors that are expected (checked) vs. programming errors (unchecked).
     - Transactions: atomic units of work that can be committed or rolled back.
     - Assertions: conditions that must be true at a certain point.
     - Idempotency: multiple identical calls have the same effect as one.

   Let's break down:

   1. Performative utterance: a side-effecting call (it changes the state of the system). 
      Example: `promise(thing)` is like a method that creates a promise in the system.

   2. Felicity conditions: preconditions for the call to be valid. 
      - Example: For a marriage, the officiant must have authority, the couple must be unmarried, etc.
      - In code: preconditions that must be checked before the operation. If they fail, we throw an exception (checked or unchecked?).

      However, note that Austin distinguishes two kinds of infelicities:
        a. Misfires: the act is not achieved because the conditions weren't met (e.g., lack of authority). 
           This is like a precondition failure -> we throw an exception and the state does not change.
        b. Abuses: the act is achieved (the promise is made) but the speaker is insincere (e.g., promises without intention to keep). 
           This is a different kind of failure.

   3. Locutionary act: the literal meaning. In code, this is the function signature and the parameters passed.

   4. Illocutionary act: the intended action (the force). In code, this is the function we are calling (e.g., `createPromise`).

   5. Perlocutionary act: the effect on the caller (or the world). In code, this might be the state change plus any subsequent actions that the caller takes because of the call (which are beyond the callee's control).

   Now, let's map:

     - A performative utterance: a side-effecting function that requires certain preconditions (felicity conditions for the act to be valid).

     - Infelicity (misfire): precondition violation -> we throw an exception (probably checked, because it's an expected failure mode). The operation is not performed (like a rollback in a transaction? but note: we haven't started a transaction?).

     - However, note: Austin's example of a marriage without authority: the act is attempted and believed by the participants, but it's void. In software, we might have an operation that is attempted and even logged, but then rolled back because of an error? But in a distributed system, we might have eventual consistency and the need to undo. This is more complex.

   6. Insincerity (abuse): 
      - Austin: the promise is made, but the speaker doesn't intend to keep it. 
      - In code: we don't model the internal state of the caller (the intention). The function `promise(thing)` is called and the promise is recorded. The system state is updated. However, the caller might then fail to fulfill the promise. 
      - How do we model this? The act of promising is successful (the state is updated to record the promise). But then there's a separate act of fulfilling the promise. The abuse is a failure in the fulfillment, not in the promise creation. 

      This maps to:
        - `makePromise(thing)`: creates a promise in the system. Preconditions: the promiser must exist, the thing must be possible, etc. If these fail, it's a misfire (precondition violation).
        - `fulfillPromise(promiseId)`: called to indicate the promise is kept. If the promise was made without intention, this might never be called, or `breakPromise(promiseId)` might be called.

      The abuse is a failure in the subsequent action, not in the initial call.

   7. The blurring of performative/constative: even a statement of fact (e.g., `assert(fact)`) is a performative: it is an act of asserting. In code, an assertion can be seen as a function that checks a condition and throws if it fails. It has the illocutionary force of an assertion.

   8. Illocutionary vs. perlocutionary:
      - Illocutionary: the function call itself and its immediate effect (state change) within the system we control.
      - Perlocutionary: the effect on the caller (or other systems) after the call. For example, after a `sendNotification` call, the user might be persuaded to buy something. We cannot control or even know about the perlocutionary effect in the API.

      This is similar to:
        - The function call may complete successfully (illocutionary act achieved) but the caller might ignore the result or crash (perlocutionary effect not achieved). 
        - However, note: the perlocutionary act is about the effect on the hearer (in our case, the caller? or the user of the caller?). But in an API, the caller is another program. The analogy is strained.

   9. Idempotency: 
      - In speech acts, if I say "I promise" twice, I have only made one promise? Or two? In code, we might design the `makePromise` to be idempotent: if called twice with the same parameters, it has the same effect as once (e.g., by using a unique id for the promise).

   10. Transactions: 
       - A marriage ceremony might be seen as a transaction: if at any point the conditions fail (misfire), the entire act is void (rollback). But if the conditions are met, we commit. However, note the case of a marriage without authority: the participants believe it happened, but it didn't. In software, we might have a two-phase commit: prepare (check conditions) and then commit. But if we check and then commit, and then later discover the officiant lacked authority? Then we have to undo (which is a distributed systems nightmare). This is similar to a violation of an invariant that is only checked after the fact? 

       - In practice, we try to check preconditions before making any state change. But sometimes we cannot (e.g., in distributed systems, we might have to use compensatory actions).

   Residue report:

     What translates cleanly:
       - Performative utterances as side-effecting functions.
       - Felicity conditions (for misfires) as preconditions that must be checked, leading to exceptions if violated.
       - Locutionary act as the function name and parameters.
       - Illocutionary act as the function's intended effect (the state change it causes).

     What translates with distortion:
       - Insincerity (abuse): In Austin, the promise is made but insincere. In code, we record the promise and then the abuse is a failure to fulfill. This maps to two separate operations. The distortion is that Austin considers the insincerity to be a defect of the original act, but in code we don't have a way to check the intention at the time of the call. We only record the act and then later see if it is fulfilled. So the abuse is shifted to a later operation.

       - Perlocutionary act: This is the effect on the hearer (the caller in an API? or the user of the caller?). In an API, the immediate response is part of the call, but the subsequent behavior of the caller is beyond the callee. We can model the perlocutionary effect only as the caller's reaction, which we cannot control. This is similar to: the function returns a value, and the caller might use it or not. The analogy is weak because the hearer in speech acts is an autonomous agent, whereas the caller in an API is a program that we might have written? But even then, the perlocutionary effect might be on the user of the program.

       - The marriage without authority: This is a misfire, but it might not be caught until after the fact. In software, we try to avoid that by preconditions, but sometimes we have to deal with it in audits or compensatory transactions. This is a point where the analogy to a simple function call breaks and we need a more complex system (like a saga pattern).

     What has no counterpart:
       - The idea that even constative utterances are performative: in code, we have pure functions (which are constative) and they don't change state. However, note that a pure function call is still an act of computation. But it doesn't change the state of the system. So the performative aspect of stating a fact is not captured by a pure function? Or is it? The act of calling the function and getting a result is a change in the state of the caller (it now has the result). But we don't model that as a side effect in the callee. 

          However, we can note that even a pure function call is an illocutionary act (it asserts a fact) and it has perlocutionary effects (the caller uses the result). But the state of the world (outside the program) is not changed by the pure function. So the mapping is incomplete.

       - The intentional state of the speaker: we don't model the internal state of the caller (like sincerity) in the callee. We can only model the observable behavior.

       - The perlocutionary effect: we have no way to model or control what the caller does with the result. We can only document the intended use.

       - The blurring of performative and constative: Austin argues that even stating a fact is doing something (asserting). In code, we have functions that return a value and functions that change state. But a function that returns a value doesn't change the state of the system? However, it might change the state of the caller. And if we consider the system as including logs, then even a pure function call might leave a trace. But in strict terms, pure functions are not performative in the sense of changing the state of the system.

       - The temporal aspect: in speech acts, the act is done at the moment of utterance. In code, the effect of a function call is immediate (if synchronous) or eventual (if asynchronous). We have to design for asynchronicity.

       - The role of context: in speech acts, the context (who is speaking, the circumstances) is crucial. In code, we might model context as the state of the system and the identity of the caller (authentication and authorization). But the context in speech acts is richer and includes social norms, which we don't model.

   11. Addressing the two puzzles:

       a. Insincerity:
          - Austin: a promise made without intention is still a promise (it creates an obligation, even if the speaker doesn't intend to fulfill it). 
          - In code: we record the promise. The system might then hold the promiser accountable (by logging the failure to fulfill). The abuse is a failure in the fulfillment, not in the making of the promise. 
          - Why is this different? Because in code we separate the act of making the promise and the act of fulfilling it. The insincerity is not a precondition for `makePromise`, so we don't throw an exception at the time of making. It's a separate error that occurs later.

          This maps to: 
            - `makePromise` has preconditions that are checkable (e.g., the promiser exists, the promise is valid) -> these are felicity conditions for misfires.
            - The sincerity condition (intention to fulfill) is not checkable at the time of `makePromise` -> so it is not a precondition. Therefore, the act of promising is successfully recorded.

          So the analogy holds, but the timing is different: the abuse is a later failure.

       b. Illocutionary vs. perlocutionary and the marriage without authority:
          - Illocutionary act: the intended act (to marry) -> in code, the function call to `marry(couple, officiant)`.
          - Perlocutionary act: the effect (the couple believes they are married, society recognizes it) -> in code, the state change in the system and the propagation to other systems.

          But the misfire (lack of authority) might be discovered after the fact. In code, we try to prevent that by checking preconditions. However, if we didn't check and the call went through, then we have an invalid state. We then need to undo.

          This is more than a simple rollback because the effect might have propagated (the couple told their friends, changed their status on social media, etc.). In distributed systems, we have the concept of a compensating transaction (a saga): we would have to call `annulMarriage` and then notify everyone. 

          The analogy to raising an exception and the caller catching it is not perfect because the perlocutionary effect is on the world, not just the caller. The exception might be caught by the caller (the couple) and they might then take corrective action, but the effect on the world is already there.

          So the residue: the marriage without authority shows that in human systems, the effects of an infelicitous act can be widespread and hard to undo, which is similar to distributed systems without strong isolation. We can model it with compensatory actions, but it's messy.

   12. Conclusion:

       The untranslated residue points to:
          - The richness of human context (intentions, social norms) that we don't model in code.
          - The perlocutionary effects that go beyond the immediate system and into the world (or other systems we don't control) are hard to model and undo.
          - The temporal aspect: in human interaction, the act is done and then we have to live with the consequences, even if it was infelicitous. In code, we try to avoid that by preconditions, but when we fail, we have to build complex undo mechanisms.

       However, note that Austin's original work is descriptive of human language and not intended for software. The fact that some aspects don't map cleanly is not a defect of Austin but a reflection of the gap between human communication and software interfaces. Your colleague might be overstating the case for a direct application, but the framework does highlight important design considerations:

          - The importance of preconditions (felicity conditions) for operations that change state.
          - The separation of the act (illocutionary) from its downstream effects (perlocutionary) reminds us to design for the immediate state change and not assume the caller will use the result correctly.
          - The abuse (insincerity) maps to the need for monitoring and enforcing obligations after the fact (like in promise fulfillment).

       In summary, the theory provides a useful lens to think about the responsibilities of an API and its callers, but it doesn't map perfectly because software systems are more constrained and less ambiguous than human language.

   Final answer: 
     - The translation is possible for the core ideas (performative as side-effect, felicity as preconditions) but with some distortion (insincerity as a later failure, perlocutionary effects as beyond control).
     - The residue that doesn't map points to genuine limitations of our engineering vocabulary (especially regarding context, intentions, and the uncontrollable effects of an action) and also to the inherent messiness of human communication that Austin was describing.

   Therefore, while the theory can change how you think (by making you more aware of the conditions for success and the different kinds of failures), it doesn't provide a direct blueprint for API design.
answer: |-
  ### Translation of Austin's Framework into Software Engineering Concepts

  #### Core Mappings
  1. **Performative Utterance → Side-Effecting Call**  
     - **Example**: "I promise" maps to `promiseService.createPromise(commitment)`.  
     - **Why**: It changes system state (e.g., creates an obligation), unlike a pure function (e.g., `math.add(a, b)`).  
     - **Felicity Conditions → Preconditions**  
       - Authority, context, and intent become preconditions checked before state change.  
       - **Infelicity (Misfire) → Precondition Violation**:  
         - *Invalid marriage ceremony* → `throw new InvalidAuthorityException()` before any state change.  
       - **Idempotency Note**: If `createPromise` is idempotent, repeated calls with the same args yield the same state (like Austin's "I promise" said twice may still be one promise).

  2. **Locutionary Act → Function Signature + Parameters**  
     - The literal structure: `shipService.christen(shipName, ceremonyDetails)`.

  3. **Illocutionary Act → Function Invocation + Side Effect**  
     - The intended action (e.g., *promising*): Execution of `createPromise` that updates state if preconditions pass.  
     - **Success**: Illocutionary success = function completes without exceptions → state changed.

  4. **Perlocutionary Act → Caller's Reaction to Result**  
     - *Effect* of the act (e.g., calming a worried friend via a promise) → What the caller *does* with the result (e.g., logs it, triggers downstream workflows).  
     - **Key Distinction**: Illocutionary success ≠ perlocutionary success (e.g., promise made ≠ recipient soothed).

  5. **Constative as Performative → Assertions/Audit Logs**  
     - Stating a fact (e.g., "The ship is seaworthy") → `auditLog.record("SHIP_STATUS", "seaworthy")`.  
     - Even descriptive acts change state (e.g., logging, metrics).

  ---

  ### Residue Report: What Doesn't Translate Cleanly

  #### 1. **Insincerity (Abuse)**  
     - **Austin's View**: A promise without intent to fulfill is *still valid* but defective.  
     - **Engineering Disconnect**:  
       - Preconditions check *observable state* (e.g., user permissions), not internal intent.  
       - `createPromise` succeeds if preconditions pass → obligation recorded.  
       - **Violation is Post-Hoc**: Insincerity surfaces later (e.g., promise not fulfilled) → handled as a separate failure (e.g., `promiseService.flagViolation(promiseId)`).  
     - **Why No Direct Map**: APIs lack telepathy. Intent is unverifiable pre-invocation. Sincerity is a post-execution compliance issue.

  #### 2. **Infelicity Beyond Preconditions**  
     - **Example**: Marriage officiant lacked authority *after* the ceremony.  
       - **Austin**: Act was void from the start ("misfire").  
       - **Naive Engineering**: Precondition check should prevent this.  
       - **Reality in Distributed Systems**:  
         - *Analogy*: A distributed transaction where a late-discovered conflict forces compensation.  
         - `marry(couple, officiant)` appears successful → state updated → later, authority audit fails → compensatory action (`annulMarriage` + notifications).  
       - **Gap**: Austin treats this as "act never happened," but software must handle retroactive invalidation (e.g., Sagas, compensatory workflows).

  #### 3. **Perlocutionary ≠ Exception Handling**  
     - **False Analogy**: "Perlocutionary effect ≈ caller catching exceptions" *fails*.  
       - Exceptions (e.g., `InvalidPromiseException`) are part of illocutionary failure (preconditions).  
     - **Perlocutionary Nuance**:  
       - *Example*: A valid promise (illocutionary success) that the recipient ignores (perlocutionary failure).  
       - **In Code**: `createPromise` succeeds → returns `201 CREATED` → caller ignores response.  
     - **Key Insight**: Perlocution belongs *entirely to the caller's domain*. The callee (API) controls only illocution (did the state change?).

  #### 4. **Contextual Authority**  
     - **Austin**: Authority is dynamic (e.g., a licensed officiant *today*).  
     - **Engineering**: Auth is usually checked once (e.g., JWT at request time).  
     - **Gap**: No clean way to model authority that fluctuates mid-operation without explicit locks/leases.  
       - *Partial Solution*: Use short-lived idempotency tokens or reevaluate auth in critical flows.

  ---

  ### Conclusion: The Untranslated Residue
  - **What Translates Well**:  
    - Felicity conditions ≈ preconditions.  
    - Performatives ≈ side-effecting calls.  
    - Illocutionary success ≈ function completion without exceptions.  
    - Constatives-as-performatives ≈ state-mutating logs/audits.  
    - Idempotency maps cleanly (when applicable).

  - **What Distorts**:  
    - **Insincerity**: Not a precondition violation but a post-execution breach (no intent tracking).  
    - **Retroactive Infelicity**: Requires complex undo/compensation patterns beyond simple rollbacks.  
    - **Perlocutionary Effects**: Uncontrollable by the API (caller's responsibility).  

  - **What Has No Counterpart**:  
    - **Internal Intent**: APIs can’t verify caller sincerity, only behavior.  
    - **Social Context**: Austin’s "conventions" (e.g., marriage norms) lack direct analogs.  
    - **Fluid Authority**: Real-world authority shifts are hard to model without explicit state machines.  

  **Verdict**:  
  Your colleague is right that Austin reframes how we see *semantic contracts* (preconditions as social rules, state changes as "acts"). However, the residue exposes genuine gaps in software modeling:  
  - **Engineering Can't Express**: Internal states (sincerity) and retroactive social voiding (e.g., invalid marriages).  
  - **Austin's Ambiguity**: His blurring of performative/constative is profound but messy—your colleague oversimplifies its applicability. Austin’s work *describes* human language; APIs *prescribe* machine behavior. Use it to inspire robust precondition checks and post-hoc compliance, but accept that some human complexities (intent, social context) remain unmodelable.
