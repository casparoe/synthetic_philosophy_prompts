prompt: |-
  I'm a high school student who has been reading about mechanistic interpretability and AI safety, and I keep running into a question that seems to sit underneath a lot of that work without ever being spelled out: when we say a model is "using the same mechanism" in two situations, what would actually make that true? Researchers want to catch a model that has switched to a different internal process by comparing it to the process it was originally verified to have, but I have not seen anyone lay out what a criterion of mechanistic sameness has to deliver before it can do that job. Before I try to evaluate or build any test, I want the full specification.

  Please write the desiderata for a criterion of mechanistic sameness — a rule that takes a model plus either two inputs or two versions of a model and says whether the same mechanism produced the outputs. For each requirement, give the case or consideration behind it, mark it as non-negotiable or as a preference of one research camp, and flag any pair of requirements you suspect cannot be jointly satisfied. That last part is the part I most want to see.

  To show the level of case I mean, here are some situations I think the criterion has to sort correctly:

  1. A model does arithmetic through a genuine carry-propagating circuit on most inputs, but on inputs matching a certain pattern it quietly uses a memorized table that returns the same answers. Same behavior from the outside; different mechanism underneath. The criterion has to call this different.
  2. Two models trained from different random seeds solve a task with circuits wired in a different order, built on somewhat different features, in a way knowledgeable people would intuitively call the same algorithm. The criterion has to call this the same.
  3. A model is fine-tuned so that a safety check runs before every output; later, the check still fires every time, in exactly the same form, but its output no longer gates anything downstream — it has become decoration. Has the safety mechanism survived, and what does the criterion need in order to tell decoration from function?
  4. The same model under a small weight perturbation: outputs barely change, but internal statistics shift in ways that could be noise or could be a handoff to a backup pathway, and nothing about the outputs alone can tell us which.
  5. A dead-code case: a component that once did the work is still active but redundant, because a second component learned to duplicate it. Which component is the mechanism now, and does the criterion need a notion of "the" mechanism at all, versus a set of them?

  After the requirements, tell me which single requirement does the most to exclude candidate criteria, and then go through two specific candidates — pure behavioral equivalence, and sameness of internal activations under a fixed metric — saying exactly which numbered requirement each one fails and why.

  For format, please give me:

  A table with columns: "No." (so later sections can cite requirements by number), "Requirement" (a short name), "What it demands", "Case or consideration behind it" (cite one of my five or add your own), "Status" (non-negotiable / camp preference), and "Tension with" (requirement numbers it may conflict with, or none).

  Then a short prose section on the jointly unsatisfiable pairs, if you think there are any — that is the result I care most about, since a spec whose demands conflict is itself a finding.

  Then the two candidate-criterion paragraphs.

  Finally, a JSON object summarizing everything, with this schema: { "requirements": [ { "no": integer, "name": string, "one_line": string, "status": string } ], "jointly_unsatisfiable_pairs": [ [integer, integer] ], "most_excluding_requirement": integer, "behavioral_equivalence_fails": [integer], "fixed_metric_activation_similarity_fails": [integer] } — where each integer refers to a requirement number from the table.
reasoning: |-
  We are designing a criterion for mechanistic sameness in AI models. The criterion should determine whether the same internal mechanism is used in two situations (either two inputs to the same model or two versions of a model). We have five example cases to guide the desiderata.

  Let's break down the requirements based on the cases and other considerations. We'll assign a number to each requirement and then note any tensions.

  ### Step 1: List of Requirements

  We derive requirements from the cases and general principles.

  1. **Case 1 (Arithmetic with memorized table)**: We need to distinguish between two different internal processes that produce the same output. This leads to:
     - **Requirement: Internal Process Matters (IPM)**  
       *What it demands*: The criterion must be sensitive to the internal computational process, not just the output behavior.  
       *Case*: Case 1 (memorized table vs. carry circuit).  
       *Status*: Non-negotiable.  
       *Tension with*: Behavioral equivalence (if we had a requirement that only behavior matters, but we don't).

  2. **Case 2 (Different seeds, same algorithm)**: The model implements the same algorithm but with different low-level details (e.g., different order of operations, different features that are functionally equivalent). We want to call this the same mechanism.
     - **Requirement: Implementation Invariance (II)**  
       *What it demands*: The criterion must be invariant to reordering of operations, isomorphic representations, or functionally equivalent feature bases.  
       *Case*: Case 2.  
       *Status*: Non-negotiable (if we want to capture the algorithm level).  
       *Tension with*: Requirements that demand exact structural matches.

  3. **Case 3 (Fine-tuned safety check becomes decoration)**: The internal structure (e.g., activations) might look the same, but the causal role has changed (the output is not used). We need to capture causal role.
     - **Requirement: Causal Role (CR)**  
       *What it demands*: The mechanism must play the same causal role in producing the output. It must be that the mechanism's output is used in the same way downstream.  
       *Case*: Case 3.  
       *Status*: Non-negotiable.  
       *Tension with*: Requirements that only look at the local component without considering its effect on the output.

  4. **Case 4 (Weight perturbation)**: Small changes in weights might cause a shift in the internal pathway (e.g., to a backup) without changing outputs. We want to detect if the mechanism changed despite small changes in weights and outputs.
     - **Requirement: Robustness to Insignificant Perturbations (RIP)**  
       *What it demands*: The criterion should not be overly sensitive to small, functionally irrelevant changes (like small weight perturbations that don't change the mechanism). However, if the perturbation causes a switch to a backup pathway, that is a change.  
       *Case*: Case 4.  
       *Status*: Non-negotiable (but tricky to define "insignificant").  
       *Tension with*: Requirements that demand exact numerical similarity.

  5. **Case 5 (Dead code and redundancy)**: When there are redundant components, we need to decide which one is the mechanism. This raises the issue of whether we can identify a set of mechanisms and whether redundancy breaks sameness.
     - **Requirement: Handling Redundancy (HR)**  
       *What it demands*: The criterion must be able to account for redundant components and still identify the mechanism (or set of mechanisms) that is responsible for the output. It should not require that every component is strictly necessary (allowing for redundancy).  
       *Case*: Case 5.  
       *Status*: Non-negotiable.  
       *Tension with*: Requirements that require a unique pathway.

  6. **General consideration**: We often want to compare mechanisms without having access to the entire model or without running every possible input. We need a way to do this with limited information.
     - **Requirement: Localizability (Loc)**  
       *What it demands*: The criterion should be applicable by looking at a limited set of inputs or a subset of the model. We don't want to require exhaustive testing.  
       *Case*: General practicality.  
       *Status*: Camp preference (some might argue for global analysis, but for scalability, local is preferred).  
       *Tension with*: Global causal analysis.

  7. **Consideration from interpretability**: We might want the criterion to align with human understanding of the mechanism.
     - **Requirement: Interpretability Alignment (IA)**  
       *What it demands*: The criterion should ideally be understandable by humans and match intuitive notions of when two mechanisms are the same.  
       *Case*: Case 2 (where humans would call it the same algorithm).  
       *Status*: Camp preference (some camps prioritize human interpretability).  
       *Tension with*: Highly mathematical criteria that are hard to interpret.

  8. **Consideration for verification**: We want to catch malicious changes, so the criterion must be sensitive to changes that break safety properties even if behavior is the same.
     - **Requirement: Safety Sensitivity (SS)**  
       *What it demands*: The criterion must be able to detect when a safety mechanism is no longer functionally active (like in Case 3).  
       *Case*: Case 3.  
       *Status*: Non-negotiable for safety.  
       *Tension with*: Behavioral equivalence.

  9. **Efficiency**: The criterion should be computationally feasible to check.
     - **Requirement: Computational Tractability (CT)**  
       *What it demands*: The criterion must be computable in practice for large models.  
       *Case*: General.  
       *Status*: Camp preference (theoretical work might ignore, but practical work requires).  
       *Tension with*: Requirements that demand exhaustive analysis.

  10. **Causal Independence**: The mechanism should be identified independently of the specific input distribution (if we change the distribution, the mechanism should still be the same if it's the same circuit).
      - **Requirement: Distributional Robustness (DR)**  
        *What it demands*: The criterion should not be sensitive to the input distribution when the mechanism is the same.  
        *Case*: We might test on a different set of inputs and still want to recognize the same mechanism.  
        *Status*: Non-negotiable.  
        *Tension with*: Localizability if it requires specific inputs.

  ### Step 2: Identify Tensions

  We must note pairs of requirements that may conflict.

  - **II (Implementation Invariance) vs. RIP (Robustness to Insignificant Perturbations)**: 
    - II requires that we ignore differences in implementation (like reordering) and focus on the algorithm. RIP requires that we ignore small weight perturbations. However, both might be seen as different kinds of changes. But note: RIP might require that we are robust to small perturbations, while II requires that we are robust to isomorphic changes. But what if a small perturbation causes a switch to a different algorithm? Then RIP might say it's the same (if outputs barely change) but II might say it's different (if the algorithm changed). This is a tension.

  - **CR (Causal Role) vs. Loc (Localizability)**:
    - To check causal role, we might need to do interventions (like ablations) on the model, which might require running many inputs. Localizability wants to avoid that.

  - **IA (Interpretability Alignment) vs. CT (Computational Tractability)**:
    - Human interpretable criteria might be less formal and harder to compute automatically.

  - **SS (Safety Sensitivity) vs. Behavioral Equivalence**: 
    - This is why we reject behavioral equivalence, but note that SS requires that we look beyond behavior.

  - **HR (Handling Redundancy) vs. CR (Causal Role)**:
    - In redundant systems, the causal role of a component might be zero (if it's redundant) but we might still want to say that the mechanism (as a set) is the same. How to assign causal role in the presence of redundancy?

  ### Step 3: Table of Requirements

  We'll assign numbers and build the table.

  | No. | Requirement                     | What it demands                                                                 | Case or consideration                   | Status          | Tension with        |
  |-----|---------------------------------|---------------------------------------------------------------------------------|-----------------------------------------|-----------------|---------------------|
  | 1   | Internal Process Matters (IPM)  | Must be sensitive to internal computational process, not just behavior.         | Case 1                                  | Non-negotiable  |                     |
  | 2   | Implementation Invariance (II)  | Must be invariant to reordering, isomorphic representations, etc.               | Case 2                                  | Non-negotiable  | 4 (RIP)             |
  | 3   | Causal Role (CR)                | Mechanism must play the same causal role in producing the output.               | Case 3                                  | Non-negotiable  | 5 (HR), 6 (Loc)     |
  | 4   | Robustness to Insignificant Perturbations (RIP) | Should not be overly sensitive to small weight changes that don't change the mechanism. | Case 4 | Non-negotiable  | 2 (II)             |
  | 5   | Handling Redundancy (HR)        | Must account for redundant components and still identify the mechanism.         | Case 5                                  | Non-negotiable  | 3 (CR)              |
  | 6   | Localizability (Loc)            | Should be applicable with limited inputs/subset of model.                       | General practicality                    | Camp preference | 3 (CR)              |
  | 7   | Interpretability Alignment (IA) | Should align with human understanding.                                          | Case 2                                  | Camp preference | 9 (CT)              |
  | 8   | Safety Sensitivity (SS)         | Must detect when a safety mechanism is no longer functional.                    | Case 3                                  | Non-negotiable  |                     |
  | 9   | Computational Tractability (CT) | Must be computable in practice for large models.                                | General                                 | Camp preference | 7 (IA)              |
  | 10  | Distributional Robustness (DR)  | Should not be sensitive to input distribution when mechanism is the same.       | General (testing on different inputs)  | Non-negotiable  | 6 (Loc)             |

  Note: Tensions are noted by the requirement numbers.

  ### Step 4: Jointly Unsatisfiable Pairs

  We suspect that the following pairs might be difficult to satisfy simultaneously:

  - **II (2) and RIP (4)**: 
    - Why? II requires that we consider two implementations that are functionally isomorphic (like two different orderings) as the same mechanism. RIP requires that we consider two models with small weight perturbations (which might cause a switch to a backup pathway) as different. However, note that a small weight perturbation might cause a change that is functionally isomorphic? No, because a switch to a backup pathway is a different algorithm. The problem is that without a clear boundary between "insignificant" (which RIP wants to ignore) and "significant" (which should be considered a change) perturbations, and without a clear connection to functional isomorphism (II), we might have conflicts. For example, a small perturbation could cause a reordering that II says is the same, but RIP might flag as a change? Or the other way around? Actually, RIP is about ignoring perturbations that don't change the mechanism, so if the perturbation causes a switch to a backup, then it's a change. But II says that if the backup is functionally equivalent (same algorithm) then it's the same. So if the backup is a different algorithm, then both would call it a change. So maybe no conflict? But note: what if a small perturbation causes a reordering? Then II says same, and RIP should also say same because it's insignificant. So they might be aligned. The tension might be more apparent in the definition: II is about discrete structure changes that are functionally equivalent, while RIP is about continuous changes that are functionally equivalent. So we might avoid conflict by defining "insignificant perturbation" as one that does not change the functional algorithm. Then RIP becomes a special case of II? But then RIP is not independent. We leave the tension as potential, because without a clear functional specification, we might have conflicts.

  - **CR (3) and Loc (6)**:
    - To check the causal role of a component, we typically need to perform interventions (e.g., set the component's output to a constant and see if the model output changes) over a distribution of inputs. This requires many evaluations and cannot be done locally (on one input). Localizability wants to use one or few inputs. Thus, there is a tension.

  - **CR (3) and HR (5)**:
    - In the presence of redundancy, the causal role of any single component might be zero (because if you remove one, the other takes over). But we want to say that the mechanism (the set) is still the same. How do we assign causal role to a set? The causal role of the set might be high, but individually each is low. This requires a notion of mechanism as a set of components that together play the causal role. But if we require that each component individually has the same causal role, then we fail in redundant systems.

  ### Step 5: Most Excluding Requirement

  Which requirement does the most to exclude candidate criteria? 

  - **CR (Causal Role)**: This requirement is very strong because it demands that we not only look at the internal structure but also at the causal effect on the output. This excludes criteria that only look at the similarity of activations (without checking if they are causally relevant) and also behavioral criteria.

  ### Step 6: Candidate Criteria

  We evaluate two candidate criteria:

  **Candidate 1: Pure Behavioral Equivalence**

  - Definition: The mechanism is the same if for every input in a test set, the model produces the same output in the two situations.
  - Why it fails:
    - Requirement 1 (IPM): It doesn't look at internal processes -> fails.
    - Requirement 8 (SS): In Case 3, the safety check is decorative but behavior is the same -> fails to detect the change in the safety mechanism.
