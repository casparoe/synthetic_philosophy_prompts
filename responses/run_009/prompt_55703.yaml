answer: |-
  ### Requirements for Mechanistic Sameness Criterion

  | No. | Requirement                   | What it demands                                                                 | Case or consideration behind it                             | Status          | Tension with |
  |-----|-------------------------------|---------------------------------------------------------------------------------|-------------------------------------------------------------|-----------------|--------------|
  | 1   | Internal Process Sensitivity | Must detect differences in computational pathways even when outputs match.      | Case 1 (memorized table vs. carry circuit)                  | Non-negotiable  | 2            |
  | 2   | Implementation Invariance    | Must recognize functionally identical algorithms across architectural variations. | Case 2 (different seeds, same algorithm)                    | Non-negotiable  | 1, 4         |
  | 3   | Causal Efficacy Preservation | Mechanism must retain its causal influence on the final output.                 | Case 3 (safety check becomes decoration)                    | Non-negotiable  | 5, 6         |
  | 4   | Perturbation Robustness      | Must distinguish noise from mechanistic shifts under small weight changes.      | Case 4 (weight perturbation)                                | Non-negotiable  | 2, 6         |
  | 5   | Non-Redundancy Detection     | Must identify which components are causally necessary for outputs.              | Case 5 (dead code/redundancy)                               | Non-negotiable  | 3, 6         |
  | 6   | Local Causality              | Should operate without exhaustive global analysis (e.g., single inputs suffice).| General scalability and monitoring needs                    | Camp preference | 3, 4, 5      |
  | 7   | Path Independence            | Must recognize mechanisms regardless of parallel inactive pathways.             | Case 5 (redundant components)                               | Non-negotiable  | 5            |
  | 8   | Counterfactual Sensitivity   | Must detect mechanisms disabled via non-activation (e.g., gating).              | Case 3 (decoration) and Case 5 (redundancy)                 | Non-negotiable  | 6            |

  ---

  ### Jointly Unsatisfiable Pairs
  The following requirement pairs **cannot be fully satisfied simultaneously** due to fundamental trade-offs:
  1. **Internal Process Sensitivity (1) vs. Implementation Invariance (2)**  
     Distinguishing memorization from computation (Case 1) requires sensitivity to low-level details, while recognizing algorithm sameness across implementations (Case 2) demands abstracting away those details. A criterion cannot strictly enforce both without contextual thresholds, risking overfitting to specific architectures.

  2. **Causal Efficacy Preservation (3) vs. Local Causality (6)**  
     Verifying causal influence (Case 3) requires interventions (e.g., ablation, activation clamping) across diverse inputs to rule out redundancy. Local analysis (single inputs) cannot prove causal necessity (Case 5), creating a tension between rigor and practicality.

  3. **Non-Redundancy Detection (5) vs. Path Independence (7)**  
     Identifying "the" mechanism in redundancy (Case 5) demands quantifying causal contributions, but Path Independence requires ignoring inactive pathways. This conflicts when inactive components could become active under distribution shifts.

  4. **Perturbation Robustness (4) vs. Implementation Invariance (2)**  
     Small perturbations (Case 4) may appear as noise or mechanistic shifts. Invariance (Case 2) must tolerate variations, but Robustness must flag meaningful changes. Defining "insignificant" vs. "mechanism-altering" perturbations is underdetermined without behavioral divergence.

  ---

  ### Candidate Criteria Evaluation
  **Candidate 1: Pure Behavioral Equivalence**  
  Fails Requirements:  
  - **1 (Internal Process Sensitivity)**: Cannot distinguish memorization from computation (Case 1).  
  - **3 (Causal Efficacy Preservation)**: Misses decorative mechanisms (Case 3).  
  - **5 (Non-Redundancy Detection)**: Cannot identify which redundant component is causal (Case 5).  
  - **8 (Counterfactual Sensitivity)**: Ignores mechanisms not affecting outputs (e.g., gated-off safety checks).  

  **Candidate 2: Fixed-Metric Activation Similarity**  
  Fails Requirements:  
  - **2 (Implementation Invariance)**: Flags isomorphic circuits as different due to activation shifts (Case 2).  
  - **3 (Causal Efficacy Preservation)**: Fails on decoractive mechanisms (Case 3—same activations, no causal effect).  
  - **4 (Perturbation Robustness)**: Cannot differentiate noise from backup pathway activation (Case 4).  
  - **5 (Non-Redundancy Detection)**: Misattributes causality if redundant components match activations (Case 5).  

  ---

  ### JSON Summary
  ```json
  {
    "requirements": [
      {"no": 1, "name": "Internal Process Sensitivity", "one_line": "Detect computational pathway differences despite output matches", "status": "Non-negotiable"},
      {"no": 2, "name": "Implementation Invariance", "one_line": "Recognize identical algorithms across architectural variations", "status": "Non-negotiable"},
      {"no": 3, "name": "Causal Efficacy Preservation", "one_line": "Ensure mechanisms retain causal influence on outputs", "status": "Non-negotiable"},
      {"no": 4, "name": "Perturbation Robustness", "one_line": "Distinguish noise from mechanistic shifts under small weight changes", "status": "Non-negotiable"},
      {"no": 5, "name": "Non-Redundancy Detection", "one_line": "Identify causally necessary components", "status": "Non-negotiable"},
      {"no": 6, "name": "Local Causality", "one_line": "Operate without exhaustive global analysis", "status": "Camp preference"},
      {"no": 7, "name": "Path Independence", "one_line": "Recognize mechanisms independent of parallel inactive pathways", "status": "Non-negotiable"},
      {"no": 8, "name": "Counterfactual Sensitivity", "one_line": "Detect mechanisms disabled via non-activation", "status": "Non-negotiable"}
    ],
    "jointly_unsatisfiable_pairs": [[1, 2], [3, 6], [5, 7], [2, 4]],
    "most_excluding_requirement": 3,
    "behavioral_equivalence_fails": [1, 3, 5, 8],
    "fixed_metric_activation_similarity_fails": [2, 3, 4, 5]
  }
  ```

  ### Key Insight
  **Causal Efficacy Preservation (3)** is the most excluding requirement. It demands counterfactual validation (e.g., "Does ablating this component change outputs?"), which conflicts with local analysis (6), redundancy handling (5), and implementation invariance (2). This underscores that mechanistic sameness is fundamentally about *causal structure*, not activation patterns or behavior alone—a criterion must model counterfactual dependencies to satisfy safety-critical cases like detecting decorative mechanisms.
