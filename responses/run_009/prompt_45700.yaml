  The user wants a credence—a probability estimate—about whether there's an objective fact of the matter in their dilemma. They want it broken down into three parts: whether moral realism holds, whether parent obligations fall under it, and whether their disagreement means one is closer to truth. They also mention an analogy about cross-cultural differences in factual domains like numerical estimation, where disagreement doesn't mean there's no truth.

  Hmm, the core tension here is between descriptive cultural differences and normative objectivity. The WEIRD research complicates things because it suggests even "basic" moral intuitions aren't universal. But the user’s friend’s analogy is smart—just because people disagree about math doesn’t mean 2+2=5. So where does morality fit? 

