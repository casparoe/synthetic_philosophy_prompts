  ### Term-by-Term Credences:
  1. **Credence in moral realism applying to this domain (general obligations to kin):**  
     **60%**  
     *Justification:* Moral realism has substantive arguments (e.g., irreducible moral properties, evolutionary underpinnings of kin loyalty), but persistent cross-cultural disagreements and lack of convergence weaken confidence.

  2. **Credence that parental obligations fall under realism (not mere convention), conditional on (1):**  
     **40%**  
     *Justification:* While kinship duties appear grounded in biological/social universals (e.g., reciprocity, care instincts), the *degree* of obligation (e.g., co-residence vs. financial support) shows extreme cultural variance, suggesting conventional elements dominate specific requirements.

  3. **Credence that your disagreement tracks truth (one closer to objective fact), conditional on (1) and (2):**  
     **30%**  
     *Justification:* Even if realism holds, epistemic limitations (e.g., cultural framing, emotional bias) make it unlikely either view reliably accesses truth; the analogy to numerical estimation fails because morality lacks calibration mechanisms like empirical verification.

  ### Combined Credence for a Determinate Fact:  
  **0.60 × 0.40 × 0.30 = 7.2%**  
  (≈ **7%** after rounding)

  ### Term of Least Confidence:  
  **Term (3)** (credence disagreement tracks truth).  
  *What would shift it?* Evidence that moral disagreements in kin obligations converge under idealized conditions (e.g., cross-cultural panels with full information reaching consensus), or a discovery of objective moral "markers" (e.g., neural correlates of moral truth independent of culture).

  ### Key Disagreement Between You and Your Spouse:  
  You most plausibly disagree about **Term (2)**—whether parental obligations are objective or conventional. Your spouse likely sees this as a core moral truth (realism), while you view it as culturally contingent (convention). This is the hinge: if obligations are merely conventional, your disagreement is about preferences, not moral facts.

  ---

  ### Calibration Notes on the Analogy:  
  The friend’s analogy (numerical estimation/causal attribution) bends at two points:  
  - **Accessibility:** Physical facts (e.g., "how many objects in this box?") allow independent verification; moral obligations lack such tools.  
  - **Convergence Mechanisms:** Disagreements about facts resolve via shared methods (measurement, experiment). Moral disagreements often persist despite full information because values (e.g., "individual autonomy vs. familial duty") are fundamentally prioritized, not discovered.  
  The analogy deserves weight only if morality has similar verification mechanisms—which it currently lacks.

  ---

  ### Precisification of "Fact of the Matter":  
  I define it as: **"A truth that holds independently of human belief, which idealized agents (fully informed, perfectly rational, devoid of cognitive bias) would affirm."** Under this view, the low combined credence (7%) reflects skepticism about convergence even under idealization, given the depth of cultural embedding in kin obligations.

  ### Practical Implication:  
  Your argument is "winnable" only if Term (2) is resolved first. If obligations are conventional (60% credence against realism *or* scope), compromise must be negotiated. If realism holds *and* applies (24% joint credence for Terms 1+2), then evidence (e.g., wellbeing outcomes, evolutionary ethics) *could* favor one view—but epistemic barriers (Term 3) make definitive resolution unlikely. Focus on shared values (e.g., "mother’s wellbeing") may be more productive than moral truth claims.
