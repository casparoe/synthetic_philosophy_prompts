prompt: |-
  so, context: two weeks ago I got hired as the comm's person at a mid-sized food bank, my first real job, and I'm already in the weeds. I sent a draft donation email that opened with a story about a kid going to bed hungry, and my director said it felt "a bit manipulative" but couldn't of said why, and honestly neither can I. There's clearly some line between moving someone to give and messing with their head, but I can't find it, and I don't trust my gut — my gut was trained on internet marketing, which is not exactly a good influence.

  can you turn whatever philosophy actually knows about manipulation vs. legitimate persuasion into a checklist I run on every email before it goes out? questions in order, what counts as a good enough answer to each, where the answer means rewrite it, and where the checklist has to throw up its hands and admit it's a values call I make myself. it has to be usable in five minutes on a draft, no theory-of-everything essays.

  then run it on three real things I'm choosing between this week:

  1. a matching line — a donor genuinely will double every gift up to midnight friday, so "your gift is doubled till midnight" is just true, not a trick
  2. a story about "Maria," single mom, two kids, can't afford groceries — based on a real person I met, but I changed details till she's not identifiable, and the quotes are half reconstruction on my part
  3. "most of your neighbors have already given this year" — true of our donor list, but I picked it because it reads like everyone-but-you-didn't

  also two things I want straight answers on: which steps of the checklist are really judgement calls dressed up as procedure, and is there a kind of email the checklist will clear but my director will still hate (i.e., where does her "feels manipulative" track something my list misses).

  whole thing under 750 words — I'll be reading it between meetings.
reasoning: |-
  Okay, the user is a new communications person at a food bank, struggling with the ethical line between persuasion and manipulation in donation emails. They need a practical checklist – not theory – they can apply in under 5 minutes to drafts. 

  First, unpacking their pain points: 
  - Their marketing background makes them distrust their own instincts ("my gut was trained on internet marketing")
  - Their director flagged a "manipulative" story but couldn't articulate why, leaving them without guidance
  - They need concrete thresholds (e.g., "how reconstructed is too reconstructed?")

  The checklist must:
  1. Be bulletproof for daily use (no philosophy essays)
  2. Flag rewrite-worthy issues decisively 
  3. Explicitly call out where judgement is required
  4. Preempt director vetoes where possible

  Core ethical tensions I'm building around:
  - **Truth vs. impact**: When does simplifying a story cross into deception? 
  - **Autonomy vs. urgency**: Does "matching gift" pressure undermine agency?
  - **Dignity vs. sympathy**: Does Maria's story humanize or exploit?

  Now structuring the checklist:
  - **Order matters**: Start with verifiable facts (Q1), then move to slippery slopes (Q3/Q4)
  - **"Rewrite" triggers**: Reserved for clear violations (false stats, manufactured urgency)
  - **"Judgement zone"**: Explicitly label subjective calls (e.g., emotional tone)

  Testing their three examples reveals nuances:
  1. **Matching gift**: Passes Q1 (truthful) but Q3 (pressure) depends on phrasing – "midnight deadline" vs "opportunity"
  2. **Maria's story**: Q2 (dignity) is key – did I center her agency or just her pain? 
  3. **Peer pressure**: Q1 (truthful) but Q4 (intent) fails if the subtext is shame

  Finally, their two meta-questions:
  - **"Judgement dressed as procedure"**: Q3 (pressure) and Q4 (intent) are inherently subjective but need anchors (e.g., "would I feel cornered?")
  - **Director's gut vs checklist**: Her "manipulative" radar likely detects Q4 issues – when professional polish overrides authenticity (e.g., too-slick storytelling)

  Keeping it under 750 words means brutal editing: no examples beyond their cases, no unpacking "dignity" philosophy – just operationalized questions.
answer: |-
  Here’s a 5-minute checklist based on ethical persuasion principles (Aristotle, modern comms ethics), with clear rewrite triggers and judgment zones. **Bold = must rewrite**, *italic = your judgment call*.

  ---

  ### **The Pre-Send Checklist**  
  Run these in order. Stop and fix if any **bold** fails.  

  1. **“Is every claim fact-checkable?”**  
     - *Good enough*: Data sources exist (e.g., “1 in 5 kids hungry” → internal survey).  
     - **Rewrite**: Exaggerations (“starving children!”), fake stats, or invented scenarios.  
     - *Judgment zone*: Simplifying complex stats for readability (okay if essence is true).  

  2. **“Does this respect the subject’s dignity?”** (For stories like Maria’s)  
     - *Good enough*: Focuses on resilience/agency (“Maria juggled jobs but needed help”), not just suffering. Quotes feel authentic, not scripted.  
     - **Rewrite**: Poverty porn (gratuitous suffering), stripping autonomy (“victim with no hope”).  
     - *Judgment zone*: How much detail humanizes vs. exploits. *Ask: “Would Maria feel okay with this?”*  

  3. **“Does urgency/pressure serve the donor or us?”**  
     - *Good enough*: Real deadlines (tax deadlines, **matching gifts**), clear impact (“$50 feeds a family for a week”).  
     - **Rewrite**: Artificial scarcity (“Only 3 hours left!” when untrue), manufactured guilt.  
     - *Judgment zone*: Matching gift deadlines (*your example passes*). Emotional weight of stories (sadness ≠ manipulation).  

  4. **“Is the ‘why’ behind tactics transparent?”**  
     - *Good enough*: Logic is clear (“Give now because matches expire Friday”). No hidden psychological tricks.  
     - **Rewrite**: Misleading framing (**“most neighbors gave”** implies “you’re failing” vs. “join the community”).  
     - *Judgment zone*: Social proof usage. *Ask: “Am I highlighting solidarity or manufacturing FOMO?”*  

  ---

  ### **Your 3 Examples Scored**  
  1. **Matching gift line**:  
     - ✅ Q1 (true claim)  
     - ✅ Q3 (legitimate urgency)  
     - ✅ Q4 (transparent why)  
     → **CLEAR**  

  2. **Maria’s story**:  
     - ✅ Q1 (based on truth)  
     - *Q2: Judgment call*. Depends on tone.  
       - *Passes if*: Quotes feel genuine, focus on her strength + temporary need.  
       - *Fails if*: Overly dramatized, no agency.  
     - ✅ Q3/Q4 (no pressure tactics)  
     → **JUDGMENT CALL (lean on Q2)**  

  3. **“Most neighbors gave”**:  
     - ✅ Q1 (technically true)  
     - ❌ Q4: *Fails*. Framing implies exclusion/shame vs. inclusion.  
       - **Rewrite** to: “Join 70% of neighbors supporting families like Maria’s” → focuses on collective action.  
     → **REWRITE**  

  ---

  ### **Your Bonus Qs**  
  **“Where’s the checklist just dressed-up judgment?”**  
  - Q2 (dignity) and Q4 (tactic intent) rely on your discernment. The checklist frames the *question* but you answer it.  

  **“Will the checklist miss what your director feels?”**  
  Yes. Her “manipulative” radar likely detects:  
  - **Over-polished emotional hooks**: Even if technically ethical, excessive sadness/sentimentality can *feel* exploitative.  
  - **Tone-deafness**: Maria’s story might be dignified, but if the *surrounding email* is pushy, the whole piece feels icky.  
  - **Brand misalignment**: Your food bank’s culture may value hope over hardship.  

  **Action step**: Run drafts by her earlier. Ask: *“Does this align with how we want to present our community?”*  

  ---

  **Final Tally**: Matching gift = safe. “Neighbors” line = rewrite. Maria’s story = use your Q2 judgment (emphasize dignity/hope).  
