answer: |-
  I've watched this debate cycle through generations of grad students like a philosophical Groundhog Day. Your hypothesis is sharp—and closer to the mark than most—but the truth is messier. Let's autopsy this corpse properly.

  **Brainstorming Possible Diagnoses:**

  1.  **Verbal Dispute:** As you propose: "disease" is ambiguous. Naturalists use it for *biological dysfunction*, normativists for *socially disvalued state*.
  2.  **Different Questions:** Not just ambiguity, but fundamentally distinct inquiries: "What is biologically malfunctioning?" vs. "What warrants medicalization/social accommodation?"
  3.  **Substantive Disagreement about a Real Category:** They *are* fighting over the same concept, but disagree fundamentally on its necessary/sufficient conditions (e.g., is value-free biological dysfunction possible? Is harm necessary?).
  4.  **Data vs. Noise Disagreement:** They agree on core cases, but disagree wildly on what the "problem cases" (depression, deafness) reveal. Naturalists see contested cases as social/political noise obscuring the biological signal; normativists see them as fatal counterexamples exposing naturalism's inadequacy.
  5.  **Bedrock Intuitions:** The dispute bottoms out in irreconcilable starting points:
      *   Naturalists: Biology *has* objective functional norms derived from evolutionary design/statistical norms.
      *   Normativists: All functional attributions (even "heart pumps blood") presuppose values (e.g., survival is *good*). Harm/suffering is primary.
      *   Hybrids: *Both* intuitions are non-negotiable parts of the *actual* concept used in medicine/society.

  **My Diagnosis: Primarily #2 (Different Questions), Complicated by #5 (Bedrock Intuitions) and #3 (on Teleology), with #1 (Verbal) as a Symptom, not the Cause.**

  *   **Why #2 is Core (Supporting Your Hypothesis):**
      *   **Boorse's Project:** He explicitly states his goal is to provide a *theoretical* definition of "disease" for *pathology* and *comparative biology*, purged of values to serve as a foundation for *descriptive* health science. His "reference class" and "species-typical functioning" are tools for biological explanation, not gatekeeping social resources. When he says "disease" isn't necessarily undesirable (e.g., mild allergies), he reveals this is *not* the concept governing clinical practice.
      *   **Nordenfelt's (& Strong Normativists') Project:** They focus on the *lived experience* and *social practice* of medicine. Disease is what *interferes with vital goals* or causes *suffering/harm* warranting the "sick role." Their paradigmatic cases often involve contested conditions where biological dysfunction is unclear or irrelevant to the harm experienced (e.g., existential suffering, contested disabilities).
      *   **The Agreement/Disagreement Map:** Your observation nails it. They agree on cases where biological dysfunction and social harm *coincide unambiguously* (appendicitis). They fight where they *diverge*:
          *   Biological dysfunction without significant harm (mild OSA, asymptomatic HTN) - Naturalists say "disease," Normativists (often) balk.
          *   Significant harm without clear biological dysfunction (prolonged grief, some chronic pain syndromes, contested disabilities) - Normativists say "illness/disorder," Naturalists (often) resist.
          *   Borderline biological dysfunction + contested harm (ADHD, mild depression, short stature) - The battleground.
      *   **Wakefield's HDA as Revealing:** His "harm" criterion is explicitly normative/social, while "dysfunction" is intended to be evolutionary/biological. It's an *attempted synthesis*, but often feels like duct-taping two distinct concepts together precisely because he's trying to satisfy both questions simultaneously for a single term. The endless debates over whether "harm" is purely subjective or socially negotiated, and whether "dysfunction" can be value-free, highlight the tension.

  *   **Why It's More Than Purely Verbal (#1) & Touches #3/#5:**
      *   **Naturalism's Claim to the Ordinary Concept:** Boorse *insists* his analysis captures the core meaning doctors *intend* when diagnosing pathology, even if they also consider harm clinically. He argues normativism makes disease *too* subjective/social. His appeal to "ordinary standards" for contested cases often involves arguing the biological dysfunction *is* real and *should* be recognized (e.g., age-related decline *is* dysfunction, even if "normal" aging). He's not *just* stipulating; he thinks he's uncovering the objective core.
      *   **Normativism's Claim to Medical Practice:** Nordenfelt et al. argue doctors *are* fundamentally healers of suffering, and their diagnostic acts inherently involve value judgments about what constitutes impaired well-being or ability. They point to historical shifts (homosexuality, drapetomania) as proof that "dysfunction" alone doesn't determine disease status – social values do.
      *   **The Teleology Tangle (The Hidden #3):** This is the substantive core beneath the naturalist project. **Can "species-typical design/function" be defined without smuggled values?** Normativists (e.g., Engelhardt, Reznek) argue that identifying the *proper function* of an organ (e.g., the heart *should* pump blood) relies on valuing survival or reproduction. Naturalists (e.g., Boorse, Neander) argue evolutionary selection provides a *factual* basis for function (hearts that pump blood were selected *for* pumping blood). This is a deep, unresolved metaphysical/biological debate about natural teleology and reductionism. **Progress on this *specific* point would genuinely move the needle, but it's fiendishly difficult.** If normativists win this, naturalism collapses. If naturalists win, they secure their foundation.
      *   **Bedrock Intuitions (#5):** Ultimately, naturalists find it deeply intuitive that a blind cave fish is *objectively* dysfunctional compared to its sighted ancestor, regardless of environment. Normativists find it deeply intuitive that suffering/incapacity in a specific life context is what *matters* for medicine, regardless of statistical norms. These intuitions are resilient and argument-resistant.

  **Verdict on Your Hypothesis:** You're **largely correct, but it needs refinement.** The core problem *is* the conflation of two distinct concepts masquerading as one "disease" concept:

  1.  **Pathology/Dysfunction:** A (purportedly) value-free *biological explanatory category* (Boorse's domain).
  2.  **Illness:** A value-laden *socio-clinical category* governing the "sick role," resource allocation, and clinical intervention (Nordenfelt's domain).

  *However*, the dispute persists because:
      *   Both sides legitimately claim their concept is integral to "disease" as used in medicine/philosophy.
      *   The naturalist concept relies on the contested notion of value-free biological function/normativity.
      *   The contested cases force us to confront the messy interaction between biology and values, exposing the limitations of each pure approach.

  **What Counts as Progress (Given My Diagnosis):**

  1.  **Conceptual Distinction & Acceptance:** The *most productive* path is explicitly adopting the **Pathology/Dysfunction vs. Illness** distinction (or similar: "disease" vs. "illness", "biological dysfunction" vs. "clinically significant condition"). Stop trying to find *one* theory covering both. Acknowledge they are distinct but interacting concepts. This dissolves much of the *pseudo*-conflict.
  2.  **Investigating the Interaction:** Philosophy's job becomes analyzing *how* these concepts interact in practice:
      *   When does identified pathology *lead to* illness status (and vice versa)?
      *   How do social values *influence* what counts as pathology (research focus, diagnostic thresholds)?
      *   How does biological knowledge *constrain or inform* judgments of illness/harm?
  3.  **Targeted Work on the Teleology Question:** Focus energy on the **substantive (#3)** debate: Can evolutionary biology ground a non-question-begging, value-free concept of biological function/dysfunction? This requires engagement with philosophy of biology, not just medicine. *This* could genuinely shift the naturalist position.
  4.  **Empirical Work on Contested Cases:** Instead of using them as rhetorical weapons, study them philosophically *and* empirically. E.g.:
      *   Does "moderate depression" reliably correlate with identifiable *biological dysfunction* across contexts? (Neuroscience/psychiatry)
      *   How do different social/cultural contexts influence the *harm* experienced in congenital deafness or short stature? (Medical anthropology/sociology)
      *   Does framing age-related cognitive decline as "dysfunction" versus "normal aging" impact care or well-being? (Clinical ethics)
  5.  **Accepting Pluralism & Contextualism:** Recognize that "disease" serves multiple purposes (explanation, justification, gatekeeping) and a rigid, universal definition might be chimerical. Context matters. This isn't surrender; it's sophistication.
  6.  **Giving Up on "Saving the Phenomena" for All Cases:** Admit that some contested cases might *not* fit neatly into either pure category and that this reflects genuine complexity, not theoretical failure. Medicine's categories are human tools, not cosmic joints.

  **In short:** Your committee will likely find your hypothesis insightful and defensible. Refine it by emphasizing the **different underlying questions** driving naturalism (biological explanation) vs. normativism (social-clinical practice), the **substantive dispute about biological teleology** that props up naturalism, and the **bedrock intuitions** that make each side dig in. Prescribe the **Pathology/Dysfunction vs. Illness distinction** as the antidote to decades of talking past each other. The debate isn't *merely* verbal, but recognizing the conflation of concepts is the essential first step towards clarity. Now, go write that chapter and spare the next generation some frustration.
