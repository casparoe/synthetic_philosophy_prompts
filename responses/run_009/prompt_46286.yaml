  Problems with the verbal dispute hypothesis? Both sides claim to capture the ordinary concept. Naturalists like Boorse insist they're describing what doctors mean, not stipulating. Nordenfelt argues that even clear cases involve values. Wakefield's hybrid tries to bridge but ends up with two criteria, almost admitting two concepts. 

