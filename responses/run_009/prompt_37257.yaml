  The lawyer emphasizes autonomy-through-precommitment (Ulysses contract logic), while the treatment team worries about present-self rights during psychosis. The state law's "presumptively valid" language creates ambiguity about rebuttal criteria. 

  Hmm... the Ulysses analogy needs careful handling. The classical myth involves binding orders to subordinates, whereas here it's a request to override current refusal - a crucial difference in agency dynamics. The scripted response clause is particularly novel; I've never seen guidance on enforced verbal statements in directives.

  For the memo structure, I'm considering:
  - Start with case-specific recommendations (honor directive but with psychosis-confirmation safeguard)
  - Then address the treatment team's "present self" concern seriously - perhaps reframing it as a capacity continuum issue rather than past-vs-present dichotomy
  - Explicitly dissect the Ulysses analogy: note how medical contexts lack the myth's clear power hierarchy
  - Treat the scripted response as both therapeutic tool (consistency anchor) and ethical concern (coercive speech)

  The policy should probably endorse PADs generally while building in:
  1) Capacity verification protocols for when the directive was signed
  2) Mandatory reassessment during crisis to confirm directive still applies
  3) Staff training on delivering scripted responses non-mechanically

  ...wait, might need to flag implementation risks: Could staff resist "performing" the script? Should we collect data on patient reactions post-recovery? 

  For the philosophical tension: The strongest version of the treatment team's view isn't that past selves are irrelevant, but that precommitment loses moral force when the current self cannot comprehend its rationale. But that's precisely why the psychosis confirmation clause matters - it creates a bright line where the directive activates only when that comprehension is medically verified to be impaired.

  Final thought: The scripted response might actually reduce coercion by making the override feel like personal agency rather than staff imposition. But we'd need to monitor for unintended psychological effects.
answer: |-
  ## Clinical Ethics Committee Decision Memo: Policy on Psychiatric Advance Directives (PADs)  

  **To:** Clinical Ethics Committee  
  **From:** [Your Name/Committee Chair]  
  **Date:** October 26, 2023  
  **Subject:** Policy Recommendation for Honoring Psychiatric Advance Directives, with Specific Guidance on Directive Overrides and Scripted Responses  

  ### I. Recommended Policy  
  **Honor Psychiatric Advance Directives with the following conditions:**  
  1.  **Presumptive Validity:** PADs are presumptively valid and binding when executed during a verified period of decisional capacity.  
  2.  **Rebuttable Presumption:** The presumption may be rebutted *only* if:  
      *   The patient **lacks a documented history of psychosis** (i.e., the directive was not based on experiential knowledge of their illness), OR  
      *   **Current clinical evidence** strongly suggests the directive’s instructions would cause *significant, irreversible physical harm* (e.g., known severe drug allergy specified in the directive), OR  
      *   The directive’s instructions are **medically inappropriate or obsolete** (e.g., requesting discontinued medications).  
  3.  **"Ulysses Clause" Specifics:** Instructions to override treatment refusal during psychosis, including the administration of specified antipsychotics, **must be honored** absent the above exceptions.  
  4.  **Scripted Responses:** Staff **are required to deliver verbatim scripted messages** (e.g., "The M. who signed this knew you'd be against it") as specified in the PAD, *concurrently* with administering treatment under the directive.  

  ### II. The Treatment Team's Objection: A Fair and Strong Presentation  
  The treatment team raises a profound ethical concern deserving serious consideration:  

  *   **The Primacy of the Present Self:** The patient currently refusing medication ("Present M.") is experiencing intense fear, distress, and a fractured sense of self due to psychosis. To override her explicit, contemporaneous refusal based solely on the prior directive ("Past M.") risks treating her as *less than a full person* in this moment. Her current expressions of will, however illness-influenced, are intrinsic to her humanity and dignity. Respect for autonomy is not merely retrospective; it demands acknowledging the person *as they are now*.  
  *   **Coercion and Trust:** Forcing treatment on a terrified, refusing patient, even under a prior directive, *feels* like coercion and risks eroding the therapeutic alliance. It may deepen trauma, foster resentment, and undermine future trust in the treatment team.  
  *   **The "Ghost" Analogy:** The team argues we risk allowing "Past M." – a ghost of wellness – to dictate care to "Present M.", silencing her current voice and potentially violating her present interests and rights. Autonomy should protect the person in the room, not a past version disconnected from the current lived experience.  

  **Strength of the Objection:** This objection powerfully captures the visceral ethical tension at the heart of PADs. It highlights the potential conflict between two conceptions of autonomy: *precedent autonomy* (binding future choices) vs. *concurrent autonomy* (respecting present choices). It forces us to confront whether respecting a past "rational" self inherently disrespects the current "ill" self.  

  ### III. Our Position on the Ulysses Analogy and Its "Wrinkle"  
  *   **The Analogy's Core Validity:** The Ulysses contract analogy is **fundamentally sound and relevant** in the context of PADs. Ulysses bound himself *against his future impaired state* (the Sirens' influence) to achieve his long-term goal (returning home). Similarly, "M." used her capacity during wellness to bind her future psychotic self to treatment, aiming for her long-term goals of stability and avoiding the harms of untreated psychosis. This embodies a robust form of autonomy – planning for periods when one's capacity to make sound decisions is compromised.  
  *   **The "Wrinkle" (Orders to Crew vs. Doctor):** This distinction **is significant but not decisive against honoring the directive.**  
      *   *In Myth:* Ulysses ordered his crew (agents with no therapeutic relationship or duty to Ulysses) to physically restrain him.  
      *   *In Medicine:* The patient directs the *treatment team* (agents with a fiduciary duty to act in her best interests *and* respect her values) to override her future refusal.  
  *   **Why the Wrinkle Doesn't Undermine the Directive:** The treatment team's duty encompasses *both* respecting the patient's known values/preferences (expressed via PAD) *and* acting in her best interests. Honoring the PAD during psychosis fulfills both duties:  
      1.  It respects the values and rational choice M. demonstrated when capable.  
      2.  It aligns with her best interests as *she defined them* based on experience – preventing deterioration, hospitalization, and suffering she associates with refusing medication during psychosis.  
  *   **Conclusion on Analogy:** The Ulysses contract remains a powerful metaphor for pre-commitment to overcome future impaired judgment. The shift from crew to doctor alters the *nature of the relationship* but intensifies, rather than diminishes, the obligation to honor the patient’s documented wishes, provided they meet ethical and legal standards. The doctor's duty to the patient's overall well-being and values supersedes a duty to acquiesce solely to the demands of the illness-influenced present self.  

  ### IV. Addressing the Scripted Response Clause  
  *   **Ethical Rationale for Mandating Delivery:**  
      *   **Integrity of the Directive:** The script is an integral part of M.'s pre-commitment strategy. She anticipated her psychotic self's rejection of the "past self" and provided a specific cognitive tool ("The M. who signed this knew you'd be against it") to bridge that gap, potentially mitigating fear or distrust in the moment. Withholding it undermines the directive's intended purpose.  
      *   **Fidelity & Autonomy:** Delivering the script demonstrates fidelity to M.'s specific instructions and respects her autonomy in crafting *how* her future self should be addressed. It honors her insight into her illness.  
      *   **Potential Therapeutic Value:** The script may serve as a grounding anchor, reminding the patient (even if not immediately accepted) of their broader narrative and self-awareness, potentially facilitating later insight and reconciliation with the treatment decision.  
  *   **Implementation Considerations:**  
      *   **Training:** Staff require training to deliver scripts calmly, respectfully, and without sarcasm or hostility, even amid patient agitation. Role-playing is essential.  
      *   **Documentation:** Delivery of the script must be meticulously documented in the treatment record.  
      *   **Context:** The script should be delivered by the primary clinician or a trusted team member at the time treatment under the directive is initiated, alongside efforts to provide reassurance and support. It is *not* a substitute for compassionate engagement.  
  *   **Lack of Precedent:** While explicit guidance on scripted responses is scarce, the principles of respecting specific instructions within a valid directive and promoting fidelity support mandating their use. This directive component should be treated with the same seriousness as medication instructions.  

  ### V. Conclusion  
  Our policy affirms the **presumptive validity of Psychiatric Advance Directives**, including Ulysses clauses instructing override of treatment refusal during verified psychosis and mandating specific scripted responses. We acknowledge the profound discomfort expressed by the treatment team regarding the primacy of the present self. However, we find that respecting precedent autonomy, as exercised through a properly executed PAD based on experiential knowledge, represents the most coherent application of respect for persons and autonomy *over the longitudinal course of severe mental illness*. The Ulysses analogy, while imperfect, powerfully illustrates the ethical justification for such pre-commitment.  

  The conditions for rebutting the presumption are intentionally strict, focusing on objective factors (lack of relevant history, imminent physical harm, medical inappropriateness) rather than subjective discomfort with overriding present refusal. The scripted response clause must be honored as a core component of the patient's autonomous plan.  

  **Recommendation:** Adopt the policy outlined in Section I. Develop comprehensive staff training on PAD implementation, focusing on the ethical rationale, capacity assessment during execution, managing rebuttal scenarios, and the respectful delivery of scripted responses.  

