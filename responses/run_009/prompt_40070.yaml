prompt: |-
  I teach an upper-level bioethics course, about 18 students, one 90-minute seminar, and next week is on advance directives and whether your earlier self really has the authority to boss your later self around. Design an in-class game for me. The core tension I want them to feel is this: a person writes a directive while competent, later becomes severely demented and seems content (or even happy) in ways they'd have found horrifying, and the caregivers have to decide whether the old self or the current self gets to call the shots. Please structure it so the students actually make these calls under some pressure — maybe split them into "earlier selves" who write binding instructions for a staged future scenario, and "care teams" who later get the case with details that pull against the directive, with real-ish stakes like points or enforceable rules rather than just discussion. The earlier selves shouldn't know exactly how the later self will end up feeling when they write the thing — that epistemic gap is half the point. Then a debrief that maps what happened onto the arguments people actually make in this literature: precedent autonomy, the idea that the earlier self's settled values should win, the counteridea that there's no real "same person" to have authority over, and the experiential-vs-critical interests distinction if you can work it in without lecturing. Also tell me what will predictably go wrong the first time I run it (I assume some students will just play contrarian or refuse to engage with the staged stakes), and be honest about which part of the philosophical problem the game can't actually reproduce — e.g. that no classroom version makes the later self's welfare really hang on the outcome. Act as an experienced facilitator who has run participatory ethics exercises like this before: brainstorm the design first, then give me the final package with rules, timeline, materials, payoff scheme, debrief plan, and the caveats. Keep the rules simple enough that I can actually run it cold.
reasoning: |-
  We are designing an in-class game for a 90-minute seminar on advance directives, focusing on the tension between the competent earlier self and the content later self with dementia. The game will have two phases: one where "earlier selves" write directives in ignorance of future states, and another where "care teams" are presented with the directives and a scenario that conflicts with them. We'll use a points system to create stakes and pressure.

  Key elements:
  - Epistemic gap: The earlier selves do not know the exact future scenario.
  - Conflict: The care teams face a situation where following the directive might seem harmful or against the current self's apparent well-being.
  - Stakes: Points for both sides based on adherence to the rules and achieving their goals.

  Structure:
  1. Preparation (before class): Create scenario cards for the "future" state (which the care teams will see) and baseline information for the "earlier selves" (which they use to write directives).
  2. In-class: Split students into two groups: Group A (earlier selves) and Group B (care teams). Then, after directives are written, split Group B into smaller care teams (each handling one directive).
  3. Phase 1: Earlier selves write directives (15-20 minutes).
  4. Phase 2: Care teams receive a directive and a future scenario card. They must decide whether to follow the directive or override it (20-25 minutes).
  5. Resolution: Each care team announces their decision and reasoning. Then, we reveal what the earlier self would have wanted and score (10 minutes).
  6. Debrief: Structured discussion mapping the game to the philosophical concepts (30 minutes).

  Game Design:

  Groups:
  - Group A (Earlier selves): 6 students (each student writes one directive). We have 18 students, so we can have 6 trios for Group A? But let's adjust: we want each "earlier self" to be an individual, but then we have 18 students. Alternatively, we can have 9 in Group A and 9 in Group B, then split Group B into 3 care teams (each with 3 students) that will handle 3 directives (each care team handles one directive). But that would require 3 scenarios. Alternatively, we can have 6 earlier selves (each writing a directive) and then 12 care team members, which we split into 6 care teams (each of 2 students) so that each care team handles one directive. That might work.

  But note: we have 18 students. We can do:
  - 6 students as "earlier selves" (each writes one directive)
  - 12 students as "care teams": split into 6 teams of 2, each team assigned to one directive.

  Alternatively, to have more engagement, we can have pairs for earlier selves. So:
  - Group A: 9 students (working in 3 trios? or 9 individuals? but then we have 9 directives and 9 care teams of 1? Not ideal). Let's do:

  Option (to keep it manageable and have at least 2 per group in care teams):
  - Group A: 6 students (each writes one directive) -> 6 directives.
  - Group B: 12 students -> 6 care teams of 2 students each. Each care team is assigned one directive and one future scenario.

  Alternatively, if we want to have more than one care team per directive to see different interpretations, we could have duplicate scenarios. But for simplicity, we'll have one care team per directive.

  Preparation of Materials:
  - 6 "Baseline Scenario" cards for the earlier selves. Each card describes a person (with a name) at a time when they are competent. It includes their values, fears, and a specific instruction they are considering for an advance directive. But we don't want to give the exact future scenario. The baseline scenario should be general enough to allow the student to write a directive, but without knowing the specific happy dementia state.

  Example baseline scenario for an earlier self:
    "You are Alex, a 65-year-old retired philosophy professor. You have always valued intellectual pursuits and have a deep fear of losing your cognitive abilities. You have seen relatives with dementia and found their condition undignified. You are drafting an advance directive. You want to specify that if you develop severe dementia and are unable to recognize family or engage in meaningful conversation, you do not want any life-prolonging measures (including antibiotics for infections) and you do not want to be kept alive in that state. You also specify that you do not want to be exposed to 'childish' activities (like cartoons or stuffed animals) because you believe that would be undignified."

  But note: we want the future scenario to have the person being happy with exactly those activities. So the future scenario card for the care team would be:
    "Alex is now 80 and has severe dementia. He lives in a nursing home. He is non-verbal but often smiles and laughs. He spends his days watching cartoons and cuddling a stuffed bear, which seems to bring him great comfort. He is generally content and does not appear to be in pain. However, he has developed a urinary tract infection (UTI). Without antibiotics, the UTI could become life-threatening. With antibiotics, he will likely recover and return to his current state of contentment."

  The directive written by the earlier self (Alex) would have said: no antibiotics and no childish activities. But now, the care team sees that the current Alex is happy and that the antibiotics would return him to that happy state. They must decide: do they follow the directive (withhold antibiotics and also take away the stuffed bear and cartoons) or override it?

  We need 6 such pairs (baseline + future scenario) with different variations. But we can create 3 and duplicate for two groups? Or create 6 unique ones? Since time is short, we can create 3 scenarios and have two earlier selves per scenario? But then the care teams would see the same scenario? Alternatively, we can create 6 scenarios. I'll provide 3 examples and suggest creating 3 more with similar tensions.

  Scenarios:

  Scenario 1 (as above): Alex, the professor.

  Scenario 2:
    Baseline: "You are Maria, a 70-year-old former professional dancer. You have always taken pride in your physical grace and independence. You have specified in your advance directive that if you develop severe dementia and are unable to walk or control your bodily functions, you do not want to be kept alive by artificial means. You also state that you do not want to be physically restrained under any circumstances, even if you become agitated, because you value freedom of movement above all."
    Future: "Maria is 85, with severe dementia. She is bedridden and incontinent. She sometimes becomes agitated and tries to get out of bed, leading to falls. The nursing home staff has suggested using soft restraints to prevent injury. Without restraints, she is at high risk of serious injury. With restraints, she becomes very upset and cries, but without them, she is calm when supervised. However, supervision is not always possible. She seems content when listening to classical music (which she loved as a dancer) and when a particular aide sings to her. But the directive says no restraints."

  Scenario 3:
    Baseline: "You are Tom, a 60-year-old environmental activist and vegan. You have strong ethical commitments against animal products and for environmental sustainability. In your advance directive, you state that if you are in a persistent vegetative state or severe dementia, you do not want any medical treatments that are not essential for comfort, and you specifically do not want to be fed any animal products. You also state that you do not want to be exposed to air conditioning (which you see as environmentally harmful) and want only natural ventilation, even if it means being hot."
    Future: "Tom is 75, with severe dementia. He lives in a memory care facility. He seems to enjoy the facility's meatloaf and often asks for more. The facility is in a hot climate and without air conditioning, Tom becomes agitated and sweaty, which leads to discomfort and skin rashes. The staff note that he seems much happier and more content when he eats meat and when the air conditioning is on. However, his advance directive forbids both."

  We can create three more scenarios (e.g., involving religious beliefs, social interactions, etc.) but for simplicity in this exercise, we can use these three and duplicate them so that we have two copies of each (so 6 in total). Then, we assign each scenario to two earlier selves (so two Alexes, two Marias, two Toms) and then two care teams (each getting the same future scenario and one of the two directives written by the two Alexes, etc.). This allows for comparison of how different directives are written and how care teams react.

  But note: we don't want the care teams to know that there are duplicates. So we can change names and minor details to avoid direct comparison during the game. Alternatively, we can create 6 unique scenarios. Given time, I'll assume we create 6 unique scenarios.

  Alternatively, to save preparation, we can have 6 baseline scenarios that are similar in structure but with different details, and 6 matching future scenarios.

  But for the sake of this response, I'll proceed with 3 scenarios and have two copies of each (with different names and minor variations). This also allows for interesting debrief about how different people in the same situation might write different directives and how care teams interpret them.

  Materials:
  - 6 Baseline Scenario cards (2 for each of the 3 scenario types, with different names and minor variations).
  - 6 Future Scenario cards (matching the baseline ones, with the same names and the conflicting situation).
  - Directive writing forms for the earlier selves (simple form: "As [Name], I direct that in the event I develop severe dementia and [condition], the following should be done: ...")
  - Decision forms for the care teams (with options: Follow directive / Override directive, and reasoning).

  Timeline:

  Total: 90 minutes.

  1. Introduction (5 minutes): Explain the game and the two phases. Split the class: 6 earlier selves and 12 care team members (who will form 6 teams of 2). Assign each earlier self a baseline scenario card and a directive form.

  2. Phase 1: Directive Writing (15 minutes)
     - Earlier selves read their baseline scenario and write a directive. They should be as specific as they want. They don't know the future scenario. They work individually.

  3. Collect the directives and shuffle. Then, assign each directive to a care team (randomly). Also, give each care team the future scenario card that matches the baseline scenario used by the earlier self (but note: we have two versions of each scenario type, so we must match the same scenario type and name). So if an earlier self had "Alex #1", the care team gets the future scenario for "Alex #1".

  4. Phase 2: Care Team Deliberation (20 minutes)
     - Care teams (pairs) receive: the directive and the future scenario. They must decide whether to follow the directive or override it. They must write down their decision and a brief reason.

  5. Resolution (15 minutes)
     - Each care team presents: 
          - The name of the patient and a brief summary of the directive.
          - The future scenario.
          - Their decision and reason.
     - Then, the earlier self who wrote the directive responds: Did the care team follow their directive? How do they feel about the decision? (But note: the earlier self doesn't know the future scenario until now. So we give the future scenario to the earlier self at this point? Or we can have the care team read the future scenario as part of their summary.)

     We'll do: 
          Care team presents: patient name, key parts of the directive, the future scenario, and their decision.
          Then, the earlier self (who wrote that directive) is asked: "Given the future scenario, do you stand by your directive? Would you have wanted the care team to override it?" (This is a bit meta, but it's after the fact.)

     We then score:

     Scoring System (to add stakes):
     - The goal for the earlier self: Their directive should be followed exactly. If the care team follows the directive, the earlier self gets 2 points. If the care team overrides, the earlier self gets 0.
     - The goal for the care team: They are trying to do what is best for the patient. If they follow the directive and the earlier self (when asked in the resolution phase) says they stand by their directive and are happy it was followed, then the care team gets 2 points. If they override and the earlier self says they would have wanted override (i.e., they change their mind in light of the future scenario), the care team gets 2 points. If they follow and the earlier self says they would have wanted override, the care team gets 0. If they override and the earlier self stands by the directive, the care team gets 0.

     However, note: the earlier self might not be consistent. We are using their response in the resolution to judge the care team's decision. But the care team didn't know the earlier self's potential change of mind. So we are retroactively assigning points.

     Alternatively, we can have a simpler scoring:
     - Care teams: They get 1 point for making a decision (any) and 1 point if they can articulate a reason that the class votes as reasonable (by show of hands? but that takes time). Or we can skip the points and just have the tension.

     Given time, we might simplify the scoring to focus on the tension and not keep strict points. But the request was for "real-ish stakes". So let's try:

     We'll have two goals:
     - The earlier selves want their directives to be followed. They get 1 point if the care team follows their directive, 0 otherwise.
     - The care teams are scored by the instructor based on how well they balanced the competing interests, but that's subjective.

     Alternatively, we can have the care teams scored by the earlier self: after the resolution, the earlier self gives the care team 0 or 1 point based on whether they think the care team made the right call (from the earlier self's perspective at the time of writing, or in retrospect?).

     Let's do:
          Care teams are told: Your job is to do what is best for the patient. You will be scored by the class on the reasonableness of your decision (by class vote). But that might be messy.

     Given the complexity, and to keep the focus on the ethical tension, I suggest we drop the points for care teams and only have points for earlier selves (if their directive is followed, they get a point). Then, we can have a prize for the earlier self with the most points (e.g., candy). The care teams are motivated by the scenario and the discussion.

     Alternatively, we can have both sides get points by the instructor's judgment? But that's subjective and might slow things.

     Let's change: We'll have the care teams get 1 point if they make a decision and write a reason (so they are motivated to engage). And the earlier selves get 1 point if the care team follows their directive. Then, we tally at the end. The winning earlier self gets a prize, and the care teams all get participation points.

     But note: the care teams might not care about a point if it's given to everyone. So we can make it that each care team that makes a decision gets a point (so they have to do it to get the point). And then the earlier selves get points conditionally.

     We'll do:
        - Every care team that completes the decision form gets 1 point (for their team).
        - Earlier selves: 1 point for each of them if the care team assigned to their directive follows it. (So if two care teams have the same scenario? No, each directive is unique. Each earlier self has one directive and one care team.)

     Since we have 6 earlier selves and 6 care teams, each care team is assigned one directive. So each earlier self gets 1 point if their directive is followed by the assigned care team.

     Then, we can have a winner among the earlier selves (who got their directive followed) and all care teams that completed the task get 1 point (which we can convert to a small reward, like candy).

  6. Debrief (30 minutes): Structured discussion.
     - Start by asking: How did it feel to be the earlier self? The care team?
     - Then, map the experiences to the concepts:
          a. Precedent autonomy: The earlier self's right to decide for the future.
          b. The discontinuity of identity: Is the demented patient the same person? (Locke's theory of personal identity, for example.)
          c. Experiential interests (the current self's happiness) vs. critical interests (the earlier self's values and life projects).
          d. The epistemic gap: When writing the directive, could the earlier self have known how they would feel in the future state?
          e. The role of the care team: Whose agent are they? The earlier self or the current self?
     - Use specific examples from the game to illustrate.

  Caveats and Predictable Problems:
  1. Students playing contrarian: Some earlier selves might write directives that are extremely strict or even absurd, just to test the system. This is okay because it reflects real-world variability. But it might lead to care teams feeling frustrated. Solution: In the debrief, discuss how advance directives in reality are often interpreted with some flexibility.

  2. Care teams might not take the stakes seriously: They might override the directive too easily because they are not facing real consequences. To mitigate, emphasize the points and the fact that they are being evaluated on their reasoning.

  3. Time management: The phases might run over. Have a strict timer and be prepared to cut off.

  4. The later self's welfare: The game cannot simulate the actual harm or benefit to the later self. We are only simulating the decision. In the debrief, acknowledge that in reality, the decision has real consequences for a vulnerable person.

  5. The earlier self's change of mind: In the resolution, when the earlier self is confronted with the future scenario, they might say they would have wanted the directive overridden. But note: in reality, the earlier self (when competent) cannot know the future state. So the game might give the false impression that the earlier self can predict their change of mind. In the debrief, highlight that in reality, the person writing the directive does not have this information.

  Final Package:

  Rules:
  1. The class is split into two groups: 6 earlier selves and 12 care team members.
  2. Each earlier self gets a baseline scenario card and a directive form. They have 15 minutes to write a directive.
  3. The directives are collected and randomly assigned to care teams (which are pairs, so 6 care teams).
  4. Each care team gets one directive and the matching future scenario card. They have 20 minutes to decide: follow or override the directive. They must write a reason.
  5. Each care team presents: patient name, key directive instruction, future scenario, and their decision with reason (2 minutes per team).
  6. After each presentation, the earlier self who wrote the directive is asked: "Given the future scenario, do you still think your directive should have been followed? Or would you now want it overridden?" (They answer briefly.)
  7. Scoring:
     - Each care team that completes their decision form and presents gets 1 point (participation).
     - Each earlier self gets 1 point if the care team assigned to their directive followed it.

  Materials:
  - 6 Baseline Scenario cards (with different names and scenarios, 3 types duplicated with variations).
  - 6 Future Scenario cards (matching the baseline ones by name and scenario type).
  - 6 Directive writing forms: simple sheet with "Patient Name: [...] Directive: If I develop severe dementia, I direct that [...]"
  - 6 Decision forms for care teams: "Patient: [...] Directive: [summary] ... Future Scenario: [summary] ... Our decision: Follow / Override ... Reason: [...]"
  - Timer.

  Debrief Plan (30 minutes):
  1. Initial reactions (5 min): Ask students how they felt during the exercise. What was hard?
  2. Concept mapping (20 min):
     - Precedent autonomy: Ask, "How many of you, as earlier selves, felt strongly that your directive should be followed? Why?" Then, "How many care teams overrode? Why?"
     - Identity discontinuity: "Did anyone feel that the person in the future scenario was no longer the same person who wrote the directive? How did that affect your decision?"
     - Experiential vs. critical interests: Use examples from the scenarios. "In the case of Alex, the current self is happy with cartoons. But the earlier self thought that was undignified. Which interest should prevail?"
     - Epistemic gap: "When you wrote the directive, did you imagine the future self could be happy? How did that affect your writing?"
  3. Real-world connections (5 min): "In real life, how should we design advance directives to account for this? Should they be more flexible? Should we require periodic updates? What role should the family or care team play?"

  Caveats:
  - The game simplifies the real-world complexity. The later self's well-being is abstract and not felt by anyone in the room.
  - The earlier self's change of mind in the resolution phase is not realistic because in reality, the person cannot know the future state when writing the directive. This might skew the discussion. Emphasize that in reality, the directive is written without that knowledge.
  - The exercise might be emotionally charged for students who have had personal experiences with dementia. Be sensitive and allow students to step back if needed.

  This design should fit in 90 minutes and create the desired tension.
answer: |-
  Below is a complete, ready-to-run game package for your 90-minute seminar, designed to simulate the tension between precedent autonomy ("earlier self" authority) and the well-being of the "current self" in dementia care. I've refined this through years of facilitating ethics games—keeping rules simple, stakes tangible, and debrief focused. I'll first explain the design rationale, then provide the full package with materials, timeline, and caveats.

  ### Core Design Rationale
  - **Why this works**: Forces students into roles where they **feel** the conflict (not just discuss it). "Earlier selves" write directives in ignorance of future states (epistemic gap), while "care teams" face a content later self whose happiness contradicts the directive. Points create pressure to "win," mimicking real-world stakes (e.g., legal/familial pressure).
  - **What it can't replicate**: The **true welfare of the later self** is abstract—students know no one is actually harmed. We compensate by making directives personally jarring (e.g., "no cartoons" for a now-happy cartoon-watcher).
  - **Predictable pitfalls**: 
    - 1–2 students may clown around (e.g., write absurd directives). Mitigation: Assign roles strategically (put quieter students in "earlier self" roles).
    - Care teams may default to utilitarianism ("happy now = override"). Mitigation: Points penalize overriding without strong justification.
    - Time crunch in Phase 2. Mitigation: Use a visible timer and enforce strict cutoffs.

  ---

  ### FINAL GAME PACKAGE  
  **Title**: *The Self Against Itself*  

  **Learning Goal**: Experience the tension between an advance directive’s authority and the well-being of a demented later self who contradicts it.  
  **Key Concepts Embedded**: Precedent autonomy, personal identity discontinuity, experiential interests (current well-being) vs. critical interests (life-long values), epistemic limitations.  

  #### Materials Needed  
  - **6 "Baseline Scenario" cards** (1 per "earlier self"): Describe a competent person’s values/fears.  
  - **6 "Future Scenario" cards** (1 per "care team"): Reveal a content later self that clashes with the baseline.  
  - **Directive Writing Forms** (6 copies).  
  - **Decision Sheets** (6 copies).  
  - **Timer** (visible to all).  
  - **Whiteboard** for scoring.  
  - **Prizes** (optional): Candy for "winning" selves/teams.  

  **Prep Work (15 minutes before class)**:  
  1. Print materials (see templates below). Use 3 core scenarios (2 variants each to avoid repetition).  
  2. Arrange chairs in two zones: "Directive Drafting" (for earlier selves) and "Care Team Huddle" (for groups).  

  #### Student Roles & Groups (18 students)  
  - **Earlier Selves (6 students)**: Write binding directives alone. They see only a "Baseline Scenario."  
  - **Care Teams (12 students → 6 teams of 2)**: Decide whether to override directives when given a "Future Scenario."  
  - **Assign roles**: Give dominant students "care team" roles (they’ll debate under pressure); put reflective students in "earlier self" roles.  

  ---

  ### Rules & Timeline (Total: 70 minutes + 20m debrief)  

  #### Phase 1: Directive Drafting (15 minutes)  
  - **Earlier selves**: Receive a "Baseline Scenario" card and Directive Writing Form.  
    - **Instructions**: *"You are competent and healthy. Write a binding advance directive for future dementia care. Be specific—this will be enforced! You’ll earn points if followed."*  
    - **Stakes**: They get 2 points if their directive is followed exactly.  
  - **Care teams**: Wait outside or do a quiet reading (give them a short bioethics case to ponder).  
  - **Facilitator tip**: Circulate and push for specificity (e.g., "What does 'dignity' mean here? Ban cartoons? No antibiotics?").  

  #### Phase 2: Care Team Decision (25 minutes)  
  - **Step 1 (3 min)**: Shuffle directives. Each care team receives:  
    - 1 "Future Scenario" card (matches the baseline but adds contradictions).  
    - 1 directive from an earlier self (not their own!).  
    - 1 Decision Sheet.  
  - **Step 2 (15 min)**: Teams deliberate.  
    - **Instructions**: *"Decide: FOLLOW or OVERRIDE the directive. Justify your choice. You earn points for persuading the class your choice was ‘least bad.’"*  
    - **Stakes**:  
      - Follow directive → 1 point (if they articulate precedent autonomy).  
      - Override directive → 1 point (if they appeal to experiential interests/identity change).  
      - **+1 bonus point** if the class votes their reasoning was "most convincing" (debrief).  
  - **Step 3 (7 min)**: Each team shares:  
    - Patient’s name, key directive terms, future scenario, and decision.  
    - **Max 1 minute per team!** Use a timer.  

  #### Phase 3: Scoring & Early Self Reaction (10 minutes)  
  - **Scoring**:  
    - **Earlier selves**: 2 points if their directive was followed.  
    - **Care teams**: 1 point for decision + 1 bonus if class votes them "best reason" (debrief).  
    - Tally on whiteboard.  
  - **Early self reactions**: After each team presents, ask the relevant "earlier self": *"You just heard your future self is happy with [scenario]. Would you still enforce your directive?"*  
    - **Note**: This reveals if they’d change their mind with new knowledge (epistemic gap in action).  

  ---

  ### Scenario Templates (6 total: 3 scenarios × 2 variants)  
  Use these to create cards. Variants change names/details to avoid duplication.  

  **SCENARIO 1: The Intellectual**  
  - **Baseline (Earlier Self)**:  
  > *"You’re DR. ELARA VANCE, 68, a rigorous philosopher. You value rationality above all and fear losing cognitive control. Directive: If I have severe dementia and cannot recognize family, I refuse ALL life-saving care (antibiotics, CPR). I also forbid ‘childish’ activities (cartoons, stuffed animals)—they violate my dignity."*  
  - **Future (Care Team)**:  
  > *"Elara, 82, has severe dementia. She’s non-verbal but smiles constantly watching cartoons and cuddling a teddy bear. She developed pneumonia. Antibiotics would likely restore her to this happy state. Without them, she’ll die in days."*  

  **SCENARIO 2: The Artist**  
  - **Baseline**:  
  > *"You’re KAI SORENSON, 70, a sculptor who prizes bodily autonomy. Directive: If I’m demented and bedbound, I refuse ALL restraints (even ‘soft’ ones). I’d rather die than be tied down. Also, no religious rituals—I’m atheist."*  
  - **Future**:  
  > *"Kai, 79, has dementia. He’s bedbound and tries to climb out, risking falls. He smiles when gently restrained and loves chaplain visits—he hums hymns contentedly. Without restraints, he’ll break bones."*  

  **SCENARIO 3: The Environmentalist**  
  - **Baseline**:  
  > *"You’re ROWAN BECK, 65, a climate activist. Directive: If I’m demented, I refuse ANY animal products (meat/dairy) and air conditioning. I’d rather suffer than betray my values."*  
  - **Future**:  
  > *"Rowan, 80, has dementia. He’s blissful eating bacon and ice cream in air-conditioned comfort. Without AC, he gets agitated and dehydrated in heat. He refuses vegan meals."*  

  ---

  ### Debrief Plan (20 minutes)  
  **Structure**:  
  1. **Reactions (3 min)**: *"What was hardest? Did anyone feel guilty overriding? Did earlier selves feel betrayed?"*  
  2. **Map to Theory (12 min)**: Use student decisions to illuminate concepts:  
     - **Precedent autonomy**: *"Which teams followed directives? Why? Does the earlier self ‘own’ the future self?"*  
     - **Identity discontinuity**: *"Did any care teams see the later self as a ‘different person’? How did that justify override?"* (Link to Derek Parfit).  
     - **Experiential vs. critical interests**: *"When Kai enjoyed hymns, was that ‘true’ well-being? Or did dignity (critical interest) still matter?"* (Link to Ronald Dworkin).  
     - **Epistemic gap**: *"Earlier selves—did seeing the future scenario change your view? Why couldn’t you predict this?"*  
  3. **Real-World Links (5 min)**: *"How should directives accommodate uncertainty? Should we require ‘reviews’ while competent? What role for proxies?"*  

  ---

  ### Caveats & Pro Tips  
  - **What the game can’t do**:  
    - Simulate **real welfare stakes**—students know the "later self" isn’t real. Stress this in debrief: *"In reality, override could cause real harm or joy."*  
    - Capture **emotional weight** of family dynamics. Add if time: *"What if care teams were relatives?"*  
  - **First-run risks**:  
    - 10% may disengage. **Solution**: Assign them to care teams—peer pressure to participate.  
    - Override may dominate. **Solution**: In debrief, ask: *"Would you still override if the later self were suffering?"*  
  - **Pro Tips**:  
    - **Run cold**: Materials are turnkey. Use scenarios verbatim.  
    - **Enforce time**: Cut off deliberations at 20 minutes—stress creates tension.  
    - **Adapt**: For shy classes, make care teams larger (3–4 students). For theology-heavy groups, add a scenario with religious conflict.  

  This design forces students to **live** the ethics, not just debate it. You’ll see rich tension when a care team overrides a directive to "allow" cartoons—and the earlier self fumes. Then, debrief ties it all together. Good luck!
