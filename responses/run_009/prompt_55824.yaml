prompt: |-
  My partner is a GP and I've been noticing something odd about how she talks about her day at dinner (all anonymized of course). For a young, healthy patient with a sore throat and a fever she'll say straight out "it's viral, fluids and rest" — no test, she says she knows. Then the same sort of presentation walks in, but the patient is pregnant, or 78 and diabetic, or it's chest pain instead of a sore throat, and the language completely changes: "we can't call it yet," "first let's rule out the bad thing," and more tests get ordered even though I'd swear her probability that it's the boring explanation hasn't really moved. It goes the other way too — cases where everyone in the room would put 99% on the scary diagnosis but nobody will say "knows" until a lab value comes back, and cases where she'll say "I know it's nothing" on evidence she'd call flimsy if more were riding on it. Sometimes I honestly can't tell whether the extra tests track what's at stake for the patient or what's at stake for her — the fear of missing something and getting sued, or just the fear of having to live with it. Not sure those are the same thing.

  So what I keep wondering is: what theory of knowledge, or of evidence, is actually baked into this practice? Is it the idea that whether she *knows* the diagnosis depends on what's at stake — she mentioned once that there's a whole debate in epistemology with a name for this, I forget what it's called — or is it just expected-cost reasoning layered on top of perfectly ordinary knowledge, where knowledge itself never moves and only the threshold for *acting* does? In other words, does the practice genuinely presuppose that knowledge shifts with stakes, or would a classical view where knowledge is fixed license exactly the same ordering of tests? And where is it underdetermined, versus places where the specific words doctors use ("we know," "working diagnosis," "rule out") seem to track the concept of knowledge itself and not merely a decision rule? I also wonder if it's even internally consistent, given that the same profession swears by evidence-based medicine, which sounds like a commitment to knowledge being stake-independent if anything is. And last thing: if you made the implicit view explicit and fully probabilistic instead — doctors quoting exact posterior probabilities out loud and acting on fixed thresholds — what concretely would have to change in the clinic, and would we loose anything by dropping the word "know" from the chart? Something about it feels like it does more work than a probability report would.
reasoning: |-
  Okay, let me try to unpack this. The user is observing their GP partner's behavior and noticing how her language and decisions change based on patient context. The core question seems to be about the underlying epistemology in medical practice—whether knowledge itself is stake-dependent or if it's about action thresholds. 

  First, I need to recall the philosophical concepts involved. The partner mentioned a debate in epistemology—probably contextualism or pragmatic encroachment. Contextualism suggests that the meaning of "know" changes with context, while pragmatic encroachment argues that stakes affect whether a belief counts as knowledge. But is that what's happening here?

  Looking at the examples: For a healthy patient with a sore throat, she says "it's viral" without tests. For a pregnant or elderly patient with similar symptoms, she orders more tests. The symptoms might be the same, but the stakes are higher. So, is she claiming knowledge in low-stakes but not in high-stakes? Or is she acting differently based on risk?

  The user's confusion is whether this is about knowledge shifting or just action thresholds. Evidence-based medicine (EBM) emphasizes objective evidence, which seems stake-independent. But in practice, doctors adjust testing based on consequences. That's where expected utility comes in—weighing costs of false negatives vs. false positives.

  Also, the language doctors use: "know," "rule out," "working diagnosis." These terms aren't just probabilities; they convey readiness to act. Saying "I know" in low-stakes reassures and avoids unnecessary tests. In high-stakes, hedging prevents complacency. So maybe the terminology serves a communicative purpose beyond stating probabilities.

  If doctors switched to exact probabilities, would that help? Probably not. Patients might not understand percentages, and it could increase anxiety. Saying "99% sure" still leaves doubt, whereas "I know it's nothing" is more reassuring. Plus, the word "know" carries authority that probabilities lack.

  The user also wonders about internal consistency with EBM. EBM provides evidence, but application requires context—patient values, risks, resources. So EBM and stake-sensitive actions aren't contradictory; they're complementary.

  Another point: defensive medicine. Fear of lawsuits might drive tests, but that's a systemic issue. The partner's behavior seems more about patient outcomes than liability. Still, it's a factor in some cases.

  Underdetermination: When evidence is ambiguous, high stakes demand more testing. But does that change knowledge? Not really—it's about meeting a higher evidence threshold for action.

  So, the practice aligns with classical epistemology where knowledge is fixed, but action thresholds vary. The language adapts to context for effective communication. Moving to explicit probabilities might lose the nuance of commitment that "know" provides. It's practical, not inconsistent.
answer: |-
  Your observations are razor-sharp and touch on a profound tension at the heart of clinical reasoning. What you're describing isn't inconsistency—it's the **dynamic interplay between epistemology, risk management, and communication in the face of irreducible uncertainty**. Let's dissect it:

  ### 1. **The Core Theory: Expected-Utility Thresholds, Not Shifting "Knowledge"**
     - **Classical Epistemology Holds**: Your partner likely believes the *objective probability* of a viral sore throat in a healthy 25-year-old is identical to that in a pregnant 32-year-old with identical symptoms. The medical facts don't change with stakes.
     - **What Changes: The Action Threshold**: Medicine operates on **threshold models** (e.g., Pauker-Kassirer). For any diagnosis, there's a probability threshold above which you treat/act and below which you don't. **This threshold slides dramatically with stakes**:
       - *Low Stakes* (healthy adult): Threshold might be 80% for "viral." History/exam hits 85%? She "knows" (acts as if certain).
       - *High Stakes* (chest pain, pregnancy): Threshold might jump to 99.5%. Same 85% probability? Now it's "we can't call it yet" → tests ordered.
     - **The Debate She Mentioned**: Likely **Pragmatic Encroachment** (Hawthorne, Stanley) or **Contextualism** (DeRose). These argue that *practical stakes affect whether a true belief counts as "knowledge."* But medicine doesn't truly embrace this. It's better seen as **stakes adjusting the *confidence required* to claim knowledge for practical purposes**.

  ### 2. **Why Language Shifts: "Know" vs. "Rule Out" Isn't About Belief—It's About Commitment & Communication**
     - **"I know it's viral"**: Signals *termination of diagnostic inquiry*. It communicates: "Further testing is harmful/low-yield; commit to this path." This is safe in low-risk scenarios.
     - **"Rule out the bad thing"**: Signals *heightened vigilance*. Even if probability of "bad thing" is 2%, missing it could be catastrophic. Language emphasizes open-mindedness.
     - **Psychological & Social Functions**:  
       - **Reassurance**: "I know it's nothing" calms an anxious parent of a child with a trivial rash, even with flimsy evidence.  
       - **Litigation Defense**: "We can't rule out PE yet" documents caution when stakes include legal risk.  
       - **Team Coordination**: "Working diagnosis" tells nurses/labs: "This is provisional; stay alert for red flags."

  ### 3. **Evidence-Based Medicine (EBM) Isn't Contradicted—It's Contextualized**
     - EBM provides **base probabilities** (e.g., "sore throat + fever in adult: 85% viral").  
     - **Stakes determine the *acceptable uncertainty* around that probability**. EBM gives the likelihood; risk tolerance sets the bar for action.  
     - Example: EBM says 0.1% of "viral" sore throats are Lemierre's syndrome. For a healthy hiker, that’s negligible risk. For an immunocompromised patient, that 0.1% demands testing.

  ### 4. **What Would Change with Explicit Probabilities?**
  Imagine your partner said: *"Probability of viral pharyngitis: 88%. Probability of GAS: 10%. Probability of peritonsillar abscess: 2%. Action threshold for antibiotics given risks: 15% GAS. Thus, no treatment."*  
     - **Gains**: Transparency, nuanced risk communication.  
     - **Losses**:  
       - **Cognitive Load**: Humans (doctors/patients) think heuristically, not numerically.  
       - **False Precision**: Probabilities are subjective estimates; quoting them as exact misleads.  
       - **Eroded Therapeutic Effect**: "I know it's nothing" has placebo-like reassurance. "99% benign" still fixates patients on the 1%.  
       - **Undermined Authority**: "Know" conveys experienced pattern-recognition; probabilities feel like guesswork.

  ### 5. **Where "Knowledge" Does Real Epistemic Work**
     - **Pattern Recognition**: After 10,000 sore throats, she *truly knows* viral presentations. No probability needed—it's perceptual.  
     - **When Stakes Reveal Ignorance**: A "boring" presentation in a high-stakes patient forces acknowledgement: *"What I thought was sufficient evidence isn't, because I now see potential harms I'd overlooked."* This isn't shifting knowledge—it’s recognizing complexity.

  ### The Verdict
  Your partner's practice aligns with **classical epistemology + utility-maximizing decision theory**. "Knowledge" language is a **tool for action-guiding communication**, not a claim about metaphysical certainty. It's internally consistent because:
  - Evidence *gathering* is stake-sensitive (test when risk-adjusted costs of uncertainty outweigh test risks).  
  - Evidence *assessment* (likelihoods) is stake-*in*dependent.  
  - "Knowing" is a speech act declaring **sufficient certainty for this context**.

  **What's lost if we drop "know"?** The human capacity to convert uncertainty into decisive action—and the healing power of conviction when warranted. Probabilities inform; knowledge *commits*. And in the messy reality of the clinic, commitment is often the treatment.

  *Final thought: This dance isn't just medicine—it's how humans navigate uncertainty everywhere. Your partner isn't being inconsistent; she's being adaptively rational in a world where evidence alone is never enough.*
