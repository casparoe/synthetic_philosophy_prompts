  One thing the classroom activity cannot reproduce: the common knowledge of rationality and the equilibrium play. We have to assume that the players play optimally. In reality, human buyers might not always play optimally. So we might not get exactly the expected payoffs. But we can use the expected values in the debrief.

  Also, we must be honest: the theorem assumes that the agent is Bayesian and rational, and that the information is free and there are no other agents. We broke two of the assumptions.

  Finally, we name the theorem: Good's theorem (or the value of information) and attribute it to I. J. Good (1967).

  Handouts:

  For Stage 1 and 2: a table of payoffs for the rain/sunshine game.

  For Stage 3: a table of payoffs for the buyer and seller.

  And a flowchart for Stage 3.

  We'll provide worksheets for each stage.

  Timing:

  Stage 1: 15 minutes
  Stage 2: 15 minutes
  Stage 3: 30 minutes (including pairing and explaining)
  Debrief: 15 minutes

  Total: 75 minutes.

  We hope that in Stage 3, the sellers who looked end up with less on average, so they feel the harm.

  We also have to be cautious: in Stage 3, the harm comes from the buyer's optimal response. If the buyer doesn't play optimally, then the signal might not harm. So we must make sure the buyer understands their incentives.

  Alternatively, we can have the buyer's strategy determined by the instructor: we tell them what to do in each case. But then it's not a game. Or we can have the buyer be a pre-programmed agent? But we want it to be human. 

  Given the time, we can have a quick practice round for the buyers.

  Alternatively, we can run Stage 3 as a large group: one seller and one buyer in front of the class, and the class can advise. But then only one data point.

  We can do a mix: let the pairs play, and then we collect the data and average.

  We'll prepare a spreadsheet to record:
    - Pair ID
    - Seller: looked or not
    - State (H or L)
    - Buyer's offer (should be 12 in both cases if they play optimally)
    - Seller's decision (if they looked: for H they should reject 12, for L accept; if not looked, they accept)
    - Payoff for seller and buyer.

  Then we can compute the average for looked vs not.

  If we have 9 pairs, then about 4 or 5 will be H and 4 or 5 L. For the looked group: about half get 5 and half get 12 -> average around 8.5. For the not looked: all get 12.

  We hope that the average for looked is lower.

  If time, we can run a second round.

  Debrief:

  - Stage 1: free signal helps.
  - Stage 2: costly signal might not be worth it.
  - Stage 3: free signal can hurt because it changes the buyer's behavior.

  Then map to the theorem.

  Finally, what no classroom activity can reproduce? The common knowledge of rationality and equilibrium might be hard to achieve. Also, the theorem holds in expectation, and we might not have enough trials to see the expectation. So we have to rely on the math.

  Also, the theorem assumes that the agent's beliefs are updated correctly. In our Stage 3, the buyer updates correctly based on the seller's information acquisition.

  We're ready.
answer: |-
  Here’s a complete in-class game designed to demonstrate Good’s theorem, its assumptions, and where it breaks—using tangible, human-driven decisions. The game uses **course tokens** (e.g., 1 token = 0.1% extra credit) and requires only printed materials. The three stages build intuition, then break it strategically. Total time: **70–75 minutes**.

  ---

  ### **Stage 1: Good’s Theorem Works (Free Signal, Single Agent)**  
  *Goal: Students see free signals help.*  
  **Setup**:  
  - Each student gets a **Decision Sheet** (Fig 1) and a sealed **Weather Envelope** containing a hidden card (♥ = Sunshine, ♠ = Rain).  
  - States are equally likely (shuffle decks in advance).  
  - Payoffs (tokens):  
    - **Bring umbrella**: 10 if Rain, 0 if Sunshine.  
    - **Bring sunscreen**: -10 if Rain, 10 if Sunshine.  

  | State (50/50) | Umbrella | Sunscreen |
  |---------------|----------|-----------|
  | **Rain** (♠)   | 10       | -10       |
  | **Sunshine** (♥)| 0        | 10        |

  **Procedure**:  
  1. **Round 1 (No Signal)**: Students choose **umbrella** or **sunscreen** *without* opening envelopes.  
  2. **Reveal state**: Instructor draws a ♠/♥ card publicly; students record payoffs.  
  3. **Round 2 (Free Signal)**: Students open envelopes, see the card, *then* choose. Record payoffs.  

  **Expected Result**:  
  - *No signal*: EV(umbrella) = 5, EV(sunscreen) = 0. Most choose umbrella → avg. payoff ~5.  
  - *Free signal*: Perfect info → max payoff = 10. **All students gain (5 → 10)**.  

  **Build intuition**: "Free info helps! Why not peek?"  

  ---

  ### **Stage 2: Costly Signal Breaks the Theorem**  
  *Goal: Pay a fee → signal can hurt EV.*  
  **Setup**: **Same as Stage 1**, but signal costs **6 tokens**. Students decide:  
  - **Option A**: Pay 6 tokens, open envelope, choose action.  
  - **Option B**: Keep envelope closed, choose action blindly.  

  **Procedure**:  
  1. Students choose Option A or B, then act.  
  2. Reveal state; calculate net payoffs (Option A: payoff – 6).  

  **Math**:  
  - Option A (buy signal): EV = 10 (max payoff) – 6 = **4**.  
  - Option B (no signal): EV = **5** (optimal: umbrella).  
  → **Signal costs 6 → EV drops from 5 to 4**.  

  **Expected Result**: Students who buy signal avg. 4 tokens; others avg. 5. **Paying hurts EV**.  

  ---

  ### **Stage 3: Strategic Counterpart Breaks the Theorem (Free Signal)**  
  *Goal: Free signal leaks info → counterpart exploits it.*  
  **Setup**: **Paired negotiation** (Seller/Buyer).  
  - **Seller** has an item. State: ♥ = High quality (to seller: worth 5), ♠ = Low quality (worth 0).  
  - **Buyer**’s value: 20 for ♥, 10 for ♠.  
  - **Signal**: Seller can **freely see** the card (♥/♠) but must keep it hidden.  
  - **Buyer observes** if seller peeked.  
  - **Buyer offers price**: **12 tokens** or **18 tokens**.  
  - **Seller accepts/rejects**:  
    - If accept: Seller gets price, buyer gets (value – price).  
    - If reject: Seller keeps item (gets 5 if ♥, 0 if ♠), buyer gets 0.  

  **Payoffs**:  
  | Role       | Accept (price P) | Reject       |
  |------------|------------------|--------------|
  | **Seller** | P                | 5 if ♥, 0 if ♠ |
  | **Buyer**  | Value - P        | 0            |

  **Procedure**:  
  1. Assign pairs (9 seller/buyer pairs). Distribute sealed envelopes (50% ♥, 50% ♠).  
  2. **Seller first**: Chooses to **peek** or **not peek**. Buyer observes this.  
  3. **Buyer**: Sees if seller peeked, offers **12 or 18**.  
  4. **Seller**: Accepts/rejects based on:  
     - If peeked: Knows state (reject 12 if ♥; accept 12 if ♠; accept 18 always).  
     - If didn’t peek: Uses prior (EV = 2.5; accepts any offer ≥12).  
  5. Reveal states; record payoffs.  

  **Rational Play**:  
  - If seller **doesn’t peek**:  
    - Buyer knows seller will accept any offer → offers 12 (EV buyer: 3 > -3 for 18).  
    - Seller gets **12** (always accepts).  
  - If seller **peeks**:  
    - Buyer offers 12 (EV buyer: -1 > -3 for 18).  
    - Seller: Gets 5 if ♥ (rejects 12), 12 if ♠ (accepts) → **EV seller = (5 + 12)/2 = 8.5**.  

  **Expected Result**:  
  - Sellers who peek avg. **8.5 tokens**.  
  - Sellers who don’t peek avg. **12 tokens**.  
  → **Free signal cuts earnings by 3.5 tokens!**  

  ---

  ### **Debrief (15 min)**  
  Map to Good’s theorem assumptions:  
  | Stage | Signal Cost | Other Agents | Outcome | Violated Assumption |
  |-------|-------------|--------------|---------|----------------------|
  | 1     | Free       | None         | Helps   | None (theorem holds) |
  | 2     | **Cost (6)** | None         | Hurts   | **Costless info**    |
  | 3     | Free       | **Counterpart observes** | Hurts | **Single agent**     |

  **Key Insights**:  
  - **"Free"**: Not just monetary. Stage 2 shows even small costs can reverse gains.  
  - **"Single agent"**: Stage 3 breaks because the signal leaks info to a strategic player who then exploits you (buyer infers "peeking = seller might reject low offers").  
  - **Real-world analogies**:  
    - Stage 2: Paying for expert advice (e.g., stock tips) may not cover its cost.  
    - Stage 3: In negotiations, due diligence (e.g., home inspection) can weaken your position if the seller knows you did it.  

  **Predictable Issues & Mitigation**:  
  - **Students disbelieve free signals**: In Stage 1, emphasize "no catch" verbally. In Stage 3, clarify "free peek" ≠ "must disclose state."  
  - **Overcorrection**: Some may refuse Stage 1 signals "to be safe." Use aggregate results to show gains.  
  - **Buyers don’t play optimally**: Pre-brief buyers: "You’re graded on tokens; play selfishly." Show payoff tables.  
  - **Math anxiety**: Use whole numbers, pre-calc EVs on handouts.  

  **What Can’t Be Simulated**:  
  Good’s theorem assumes **perfect Bayesian updating** and **common knowledge of rationality**. Humans may not infer optimally (e.g., buyers might offer 18 even when it’s dumb). Verbally emphasize: "The theorem assumes all players instantly deduce best responses—classrooms have friction."  

  ---

  ### **Materials to Print**  
  1. **Weather Envelopes** (18): Sealed ♥/♠ cards (50/50 mix).  
  2. **Decision Sheets (Stage 1–2)**: Payoff tables + instructions.  
  3. **Negotiation Kits (Stage 3)**:  
     - Seller/Buyer instructions.  
     - Payoff tables (Fig 3).  
     - Tally sheet for results.  
  4. **Debrief Slides**: Assumptions table, real-world examples.  

  ---

  ### **Why Your Friend Can’t Weasel Out**  
  - **No cheating**:  
    - Stage 2: Cost makes math unambiguous (4 vs. 5).  
    - Stage 3: Harm emerges from buyer’s selfish incentives (offering 12 to avoid losses), not a rigged payoff. If buyers offer 18, sellers profit—but rational buyers won’t.  
  - **Realism**: Stage 3 mirrors sealed-bid auctions, job-market signaling, or litigation (e.g., demanding discovery signals your aggression).  

  Run this, and even your insufferable friend will concede—unless he’s allergic to data. 😉
