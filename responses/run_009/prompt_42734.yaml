   So to save time, in the in-class game, we will for each rule have a pre-designed preference profile that is manipulable. We will use the following for plurality in a committee of 3 as our to save the activity.

   and for the other rules, we can rely on the the students to might discover a manipulation in the borda or runoff with the assigned preferences. We can also during the debrief discuss other examples.

   So for the game, we will assign preferences for each round and hope that in at least one round, a student sees an opportunity.

   Specifically, for the plurality round with 3 voters, we assign:
   V1: A > B > C
   V2: B > A > C  [or B > C > A?]
   V3: C > B > A

   and we hope that V3 will see that by voting for B, they can get B to win which is better than A winning.

   and for the runoff round with 3 voters, we assign the same preferences and see if they can manipulate in the first round.

   Given the time constraints, I will provide the complete design. 

   Materials:
   - Cards for each round and each committee member, indicating their sincere preference ranking and their payoff (candy: 3 for first choice, 1 for second, 0 for third).
   - Ballots for each round.
   - A tie-break rule: alphabetical order of the alternative's letter.

   Structure of a round:

   1. Form the committee for the round.
   2. Assign each committee member a card with their sincere preferences and payoffs.
   3. Explain the voting rule for the round.
   4. Allow students to vote. They may vote sincerely or insincerely. They are told to try to maximize their payoff.
   5. Collect the ballots and compute the outcome.
   6. Distribute payoffs (candy) based on the outcome and their sincere preferences ( not based on how they voted).

   Note: the payoff is based on the sincere preferences, so even if they vote insincerely, they get candy based on how much they like the winner according to their card.

   Information flow: 
   - Each student knows their own preference and payoff.
   - We can provide information about how others might vote by? We can have a public opinion poll? or we can have a private signal.

   To give them information about others, we can:
   - Before voting, have a public discussion where they can say anything? But that might not be in the spirit of private information.
   - Alternatively, give each student a slip that says the distribution of preferences in the committee? For example, "There is one other person with your top choice." 
   - To make it possible to compute, we can provide a table of the preferences to each student. But that removes private information.

   Given the upper-level seminar, we can give them the entire preference profile of the committee on a private slip? Then they can compute the outcome and see if they can manipulate.

   But then everyone knows everything. The theorem assumes they know how others vote, but in this case, they know preferences, not votes.

   We want: a student who knows how others have voted gets a better outcome by lying. But in the game, they vote simultaneously.

   To simulate that they know how others vote, we can:
   - Have a dry run where they are told to state how they will vote sincerely? Then after that, one student may change their vote.

   But that might be cumbersome.

   Alternatively, we can have two stages:
     Stage 1: Everyone commits to a vote ( publicly or privately to the instructor) and then we show the committed votes.
     Stage 2: Then each student can change their vote if they wish.

   This way, they see the votes of others before finalizing.

   This might work.

   So for each round:

   1. Assign preferences.
   2. Ask each student to write down their initial vote (according to the rule) on a slip and give to instructor. 
   3. The instructor then writes on the board the votes that were submitted (without names), so everyone sees the current vote count.
   4. Then allow each student to change their vote if they wish, in secret. They submit a final vote.
   5. Then the instructor computes the winner and announces it.

   In this way, when they are making the final vote, they know the current votes of everyone else.

   Then, if a student can improve the outcome by changing their vote, they may do so.

   For example, in the plurality round with 3 voters:

   Preferences:
   V1: A>B>C
   V2: B>C>A
   V3: C>B>A

   Stage 2: after seeing the sincere votes: V1 votes A, V2 votes B, V3 votes C -> outcome: tie -> A wins by tie-break.
   V3 sees that if they change to vote for B, then the votes become: A, B, B -> B wins. 
   Since V3 prefers B over A, they will get more candy (1 instead of 0, if we do 3 for first, 1 for second, 0 for third? But in their ranking, C is first, B second, A third. So if B wins, they get 1 candy; if A wins, they get 0).

   So they should do it.

   Therefore, the design for each round:

   - The committee is formed.
   - Each student gets a card with their sincere preference ranking and the payoff scheme (e.g., "If A wins: 0 candies, B wins: 1 candy, C wins: 3 candies" for V3).
   - The voting rule is explained.
   - Stage 1: students submit their sincere vote (according to the rule and their sincere preferences) privately to the instructor.
   - Instructor writes on the board the submitted votes (anonymized) and what the current winner would be.
   - Stage 2: students may change their vote. They submit a final vote privately.
   - Instructor computes the winner and announces it.
   - Students receive candy based on the winner and their sincere preferences.

   This way, we stage the condition of the theorem: a voter who knows how everyone else has voted.

   We will have 5 rounds, but only 4 with committees ( the dictatorial round will be quick).

   Rules for the rounds:

   Round 1: Plurality ( committee of 3 voters)
     - Alternatives: A, B, C
     - Preferences:
          V1: A > B > C  -> payoffs: A:3, B:1, C:0
          V2: B > C > A  -> payoffs: B:3, C:1, A:0
          V3: C > B > A  -> payoffs: C:3, B:1, A:0

     - In stage 1, votes: V1: A, V2: B, V3: C -> tie -> A wins (tie-break: alphabetical).
     - V3 sees that by voting for B in stage 2, the votes become A, B, B -> B wins. V3 gets 1 candy (for B) instead of 0 ( for A). So they should change.
     - If they do, then the final outcome is B wins.

