     -> tie between A and B. Tie-break: A wins.

     V4: prefers B > A > C. They got A. If they change to vote: A>B>C? Then their vote: A:2, B:1, C:0.
     New scores: A:2+2+0+2=6, B:1+1+1+1=4, C:0+0+2+0=2 -> A wins. Same.

     If they change to: C>B>A? Then: C:2, B:1, A:0.
     New scores: A:2+2+0+0=4, B:1+1+1+1=4, C:0+0+2+2=4 -> tie. Tie-break: A wins. Same.

     So we might not have manipulation here.

     Instead, we can use a different profile for Borda with 4 voters that is manipulable. If not, we can have it as a round where no one can manipulate, and that's okay.

     We will for the activity use the following for Borda ( and if no manipulation occurs, we can discuss why in the debrief).

     Use this profile for the Borda round:

     V1: A>B>C
     V2: B>C>A
     V3: C>A>B
     V4: A>C>B

     Sincere votes:
     V1: A:2, B:1, C:0
     V2: B:2, C:1, A:0
     V3: C:2, A:1, B:0
     V4: A:2, C:1, B:0

     Scores: 
          A: 2+0+1+2=5
          B: 1+2+0+0=3
          C: 0+1+2+1=4
     -> A wins.

     Can any voter change to make a better outcome for themselves?

     Voter 2: prefers B>C>A. They got A. If they change to: C>B>A? Then vote: C:2, B:1, A:0.
     New scores: 
          A: 2+0+1+2=5
          B: 1+1+0+0=2
          C: 0+2+2+1=5
     -> tie between A and C. Tie-break: A wins. Same as before.

     If they change to: A>B>C? Then: A:2, B:1, C:0.
     New scores: A:2+2+1+2=7, B:1+1+0+0=2, C:0+0+2+1=3 -> A wins. Same.

     Voter 3: prefers C>A>B. If they change to: A>C>B? Then: A:2, C:1, B:0.
     New scores: A:2+0+2+2=6, B:1+2+0+0=3, C:0+1+1+1=3 -> A wins. Same.

     So no manipulation. But that's okay, because not every instance is manipulable, but the theorem says there exists some instance.

     In the debrief, we can note that.

   Round 3: Runoff ( committee of 3 voters)
     - Preferences: 
          V1: A>B>C
          V2: B>C>A
          V3: C>B>A

     - In stage 1, votes for the first round: V1: A, V2: B, V3: C -> tie. 
       Tie-break for which two go to runoff: alphabetical -> A and B.
     - Then in the runoff, we need their vote between A and B. 
          V1: A>B -> A
          V2: B>A -> B
          V3: between A and B, they have C>B>A, so B>A -> B
       -> A:1, B:2 -> B wins.

     - Now in stage 2, after seeing the stage 1 votes, can any voter change to improve?

     Voter 3: in runoff, they are pivotal? They see that if they change their first round vote to B, then the first round becomes: A, B, B -> B has 2, so B wins immediately. 
     They prefer B over A, and in sincere they got B, so they would get the same. But if they change to B, they are not worse off.

     But can they make C win? If they could make the first round have C with more votes, but with only one vote change, they can't.

     Voter 1: if they change to B in the first round: then first round: B, B, C -> B:2, C:1 -> B wins immediately. They prefer A>B>C, so they get B, which is worse than B win? In sincere, they got B anyway.

     So no strict improvement.

     However, if we allow them to change their vote in the runoff stage? The theorem is about the voting rule, which may have multiple stages, but we are simulating by having them submit a full ranking for the runoff rule.

     In our setting, in stage 1 of voting, they only submit a first choice for the first round. Then in stage 2 of voting ( the final vote), they can change their first round vote, and then the runoff is done with the new first round result.

     So after seeing stage 1, in stage 2 they can change their first round vote.

     In the example, Voter 3 can change their first round vote to B. Then the first round: A, B, B -> B:2, A:1 -> B wins. They get B, which is the same as before.

     or to A: then first round: A, B, A -> A:2, B:1 -> A wins. They then get A, which is worse than B.

     So no.

     Therefore, we will use the following for the runoff round with 4 voters and hope for a manipulation.

     Preferences for 4 voters in runoff:

     V1: A>B>C
     V2: A>B>C
     V3: B>C>A
     V4: C>B>A

     Stage 1: 
          V1: A
          V2: A
          V3: B
          V4: C
     -> A:2, B:1, C:1 -> runoff between A and B.
     runoff votes:
          V1: A>B -> A
          V2: A>B -> A
          V3: B>A -> B
          V4: in runoff between A and B, they have C>B>A, so B>A -> B
     -> A:2, B:2 -> tie -> A wins by tie-break.

     Voter 4: got A. If in stage 2, they change their first round vote to B, then stage 1 becomes: A, A, B, B -> A:2, B:2 -> runoff between A and B.
     runoff: same votes -> tie -> A wins. Same.

     If they change to A in the first round: then A:3, B:1 -> A wins. Same.

     If they change to C, then stage 1: A, A, B, C -> A:2, B:1, C:1 -> runoff between A and C.
     runoff votes:
          V1: A>C -> A
          V2: A>C -> A
          V3: in runoff between A and C, they have B>C>A, wait, they have B>C>A, so if B is out, then they compare A and C: they have C>A? because B>C>A -> C>A.
          -> V3: C
          V4: C (because they have C>B>A, so C>A)
     -> A:2, C:2 -> tie -> A wins. Same.

     So no.

   Given the complexity, we will for the activity in class rely on the plurality round to show manipulation and then in the debrief provide other examples.

   Round 4: Novel rule: we'll use the " anti-plurality" rule: each voter vetoes one candidate, the candidate with the fewest vetoes wins.

     - Committee of 3 voters.
     - Preferences: 
          V1: A>B>C -> will veto C
          V2: B>C>A -> will veto A
          V3: C>A>B -> will veto B

     - Stage 1: vetoes: C, A, B -> veto counts: A:1, B:1, C:1 -> tie. Tie-break: A wins.
     - Stage 2: after seeing the vetoes, can any voter change to improve?

     Voter 1: got A. If they veto B instead? Then vetoes: B, A, B -> counts: A:1, B:2, C:0 -> then fewest: C (0) -> C wins.
     Voter 1: prefers A>B>C, so C is worst. Worse.

     Voter 3: got A. If they veto A? Then vetoes: C, A, A -> counts: A:2, B:0, C:1 -> fewest: B -> B wins.
     Voter 3: prefers C>A>B, so B is worst. Worse.

     So no.

     Therefore, we will for the novel rule use a different profile.

     Example that works for anti-plurality with 3 voters:

     V1: A>B>C
     V2: A>B>C
     V3: B>C>A

     Stage 1: 
          V1: veto C
          V2: veto C
          V3: veto A
     -> veto counts: A:1, B:0, C:2 -> B wins.

     Voter 3: prefers B>C>A. They got B, which is their top choice. So they are happy.

     Voter 1: got B. If they veto B instead of C? Then vetoes: B, C, A -> counts: A:1, B:1, C:1 -> tie -> A wins.
     Voter 1: prefers A>B>C, so A is better than B. So they improve from B to A.

     So in stage 2, after seeing the stage 1 votes, Voter 1 sees that if they change to veto B, then the vetoes become: B, C, A -> counts: A:1, B:1, C:1 -> tie -> A wins.
     They get A instead of B, which is better (3 vs 1 candy).

     Therefore, we use this for the novel rule round.

     Preferences for round 4 ( anti-plurality, committee of 3):
          V1: A>B>C -> payoffs: A:3, B:1, C:0
          V2: A>B>C -> payoffs: A:3, B:1, C:0
          V3: B>C>A -> payoffs: B:3, C:1, A:0

     Stage 1: vetoes: V1: C, V2: C, V3: A -> counts: A:1, B:0, C:2 -> B wins.
     Stage 2: Voter 1 can change to veto B. Then vetoes: B, C, A -> counts: A:1, B:1, C:1 -> tie -> A wins.
     Voter 1's payoff: A wins -> 3 candies ( better than the 1 they would get for B).

   Round 5: Dictatorial ( with one student)
     - Choose one student to be the dictator.
     - alternatives: A, B, C.
     - Assign the dictator a preference: say, A>B>C.
     - The other students have preferences too, but they don't matter.
     - The dictator's top choice wins.

     - We can have the dictator choose publicly.
     - This round will be quick.

   In the rounds, we hope to see in round 1 ( plurality) and round 4 ( anti-plurality) successful manipulations.

   Debrief mapping to the theorem:

   - The theorem has conditions: 
     (1) three or more alternatives.
     (2) voting rule is non-dictatorial.
     (3) voting rule is onto ( every alternative can win).
     (4) Then it is manipulable.

   - In round 5 ( dictatorial), it is not manipulable ( assuming the dictator votes sincerely, they get their top choice, and no one else can change anything). So it is strategy-proof.
   - In the other rounds, we saw examples of manipulability.
   - The onto condition: in our rules, we ensured every alternative could win by having at least one profile where each wins. In the activity, we might not have seen that, but in the design of the rules, it is possible.

   What the activity cannot reproduce:

   - The activity shows that for a few rules, there are instances of manipulability.
   - The theorem is about every non-dictatorial onto rule.
   - So in the lecture, you must explain that the theorem is a universality: it applies to every rule that is non-dictatorial and onto.
   - You can then explain that the proof involves showing that if a rule is strategy-proof and onto with at least three alternatives, then it must be dictatorial.
   - And that is done by a series of arguments ( perhaps a brief outline: using the pivotal voter, etc.). But that is beyond the activity.

   Practical things:

   - Materials: 
        - Cards for the preferences in each round for each committee member. Have these pre-printed for each round.
        - Ballots (scrap paper or provided slips).
        - Candy for payoffs.
   - Structure of information flow: 
        - In each round, we have two stages of voting.
        - In stage 1, they vote sincerely and privately. The votes are then revealed (anonymously) and the current outcome announced.
        - In stage 2, they may change, and vote again.
   - What may go wrong:
        - Students may not compute the profitable lie. To help, you can provide a worksheet that allows them to compute the outcome given the votes of others.
        - Students may manipulate badly. For example, in the first round ( plurality), V3 might vote for A, which would make A win and they get 0, same as before. Or they might vote for C and then C wins only if they are the only one, but in stage 1, it's a tie, and if they vote for C again, then it's still a tie -> A wins. So they must vote for B to change to B win.
          To avoid this, you can in the instructions say: "You may change your vote to any alternative." and then in the example, as soon as they see the stage 1 outcome, they can try different votes mentally.
        - Boredom during the dictatorial round: make it very short. The dictator simply says which alternative wins.
        - Some rounds may not have a manipulation opportunity ( like our Borda example). Then you can explain that the theorem says there exists some situation where it is manipulable, not that every situation is.
   - At the end, you must explain by lecture the universality of the theorem and give a very brief idea of the proof ( perhaps using a boundary between two alternatives and the pivotal voter).

   Given time, the closing lecture should be short: 5-10 minutes.

   This activity takes about 60 minutes: 
     - Introduction: 5 minutes.
     - Each round: 10 minutes (5 for setup and stage1, 5 for stage2 and outcome) -> 5 * 10 = 50 minutes.
     - Debrief: 10 minutes.
     - Closing lecture: 5 minutes.

   Total 70 minutes.

   We have 75 minutes, so a buffer of 5 minutes.

   Let's hope it works.
answer: |-
  ### In-Class Game: Discovering Voting Manipulability

  **Objective:** Students experience strategic voting firsthand in small committees under different rules, leading to an intuitive grasp of the Gibbard-Satterthwaite theorem.

  **Materials Needed:**
  - **Preference cards** for each student (pre-assigned rankings and payoffs).
  - **Ballots** (paper slips or digital tool).
  - **Payoff tokens** (candy is recommended over extra credit for immediacy and engagement; students physically receive candy upon a win, reinforcing incentives).
  - **Whiteboard** to display votes and outcomes.
  - **Timer** (for 75-minute session).

  **Committee Structure & Rules:**
  - **14 students** split into **4 committees** (sizes: 4, 4, 3, 3) for simultaneous play. Each committee has 3 alternatives: **A, B, C**.
  - **5 voting rules** (1 rule per committee per round, rotated). Rules:
    1. **Plurality**: Vote for one alternative; most votes wins. Tie-break: alphabetical order.
    2. **Borda Count**: Rank all; points: 2 (1st), 1 (2nd), 0 (3rd). Highest sum wins. Tie-break: alphabetical.
    3. **Runoff**: Vote for one alternative. If no majority, top two face a runoff (re-vote between them).
    4. **Novel Rule ("Veto Rule")**: Each voter vetoes one alternative; least vetoed wins. Tie-break: alphabetical.
    5. **Dictatorial**: One voter (dictator) decides the winner; others’ votes ignored.
  - **Preference & Payoff Assignment**:
    - Students receive cards with **sincere rankings** (e.g., "Ranking: A > B > C | Payoff: A=3 candies, B=1, C=0").
    - Payoffs are **strictly ordered** (3 > 1 > 0) to incentivize strategic voting.
    - Assignments are **rigged** so one rule per committee tempts manipulation (details below).

  **Game Flow (60 minutes):**
  1. **Introduction (5 min)**: Explain rules, payoffs, and the two-stage voting process.
  2. **Voting Rounds (45 min, 9 min per round)**:
     - **Committee Setup**: Assign committees, rules, and preference cards. Rotate rules so each committee experiences 2 rules.
     - **Stage 1 - Sincere Voting**: Students submit initial ballots based on sincere preferences.
     - **Information Reveal**: Instructor displays anonymous Stage 1 votes and the *current winner* on the board.
     - **Stage 2 - Strategic Voting**: Students may change their vote (ballots submitted secretly).
     - **Outcome & Payoff**: Winner announced; candy distributed based on sincere preferences.
  3. **Rotation**: After each round, reassign rules and preferences to new committees.

  **Critical Manipulation Setup (Triggering "Temptation"):**
  - **Plurality Example** (Committee 1: 4 voters):
    - Preferences:  
      V1: A>B>C (Payoff: A=3, B=1, C=0)  
      V2: B>C>A (B=3, C=1, A=0)  
      V3: C>B>A (C=3, B=1, A=0)  
      V4: C>B>A (C=3, B=1, A=0)  
    - Stage 1: Votes likely [A, B, C, C] → B and C tie at 1 vote each (A:1, B:1, C:2? Wait, correction: V2 votes B, V3 and V4 vote C → A:1, B:1, C:2 → C wins.  
    - Temptation: V2 (B> C >A) sees C winning. In Stage 2, if V2 switches to C, C wins (same outcome). But if V2 switches to A: Votes [A, A, C, C] → A and C tie (2 each). Tie-break: A wins. V2 gets 0 (A) instead of 1 (C) — worse! **Corrected Profile**:  
      - Use 3-voter committee: V1: A>B>C, V2: B>C>A, V3: C>B>A.  
      Stage 1: [A, B, C] → Tie (A:1, B:1, C:1) → A wins (alphabetical tie-break).  
      **Temptation**: V3 (C>B>A) gets 0 (A wins). If V3 votes for B in Stage 2: [A, B, B] → B wins. V3 gets 1 (>0) — profitable lie!  
  - **Borda Count Example** (Committee 2: 4 voters):
    - Preferences:  
      V1: A>B>C (A=3, B=1, C=0)  
      V2: A>B>C (A=3, B=1, C=0)  
      V3: C>B>A (C=3, B=1, A=0)  
      V4: B>A>C (B=3, A=1, C=0)  
    - Stage 1 Scores: A=5, B=4, C=2 → A wins.  
    - Temptation: V4 (B>A>C) gets A (1 candy). If V4 insincerely ranks C>B>A in Stage 2, scores: A=4, B=4, C=3 → A/B tie → A wins (same). No gain. **Corrected Profile for Manipulability**:  
      - V1: A>B>C, V2: B>C>A, V3: C>A>B, V4: B>A>C.  
      Stage 1: A=5, B=4, C=2 → A wins.  
      V4 (B>A>C) can insincerely rank **A>B>C** in Stage 2 → A=6, B=4, C=1 → A wins (no change). But **V2 (B>C>A)**: If they rank **C>B>A**, scores: A=3, B=4, C=4 → B/C tie → B wins. V2 prefers B (3) over A (0) — profitable!  
  - **Veto Rule Example** (Committee 3: 3 voters):
    - Preferences:  
      V1: A>B>C (A=3, B=1, C=0)  
      V2: A>B>C (A=3, B=1, C=0)  
      V3: B>C>A (B=3, C=1, A=0)  
    - Stage 1: Vetoes likely [C, C, A] → B wins (0 vetoes).  
    - Temptation: V1 (A>B>C) gets B (1 candy). In Stage 2, if V1 vetoes B (not C), vetoes [B, C, A] → A wins (1 veto, beats C’s 2). V1 gets 3 (>1) — profitable lie.  
  - **Runoff & Dictatorial Rounds**:
    - **Runoff**: Setup to sometimes tempt manipulation (e.g., voter helps second choice avoid runoff loss).  
    - **Dictatorial**: One voter picks the winner; others cannot change outcome. Fast and clear contrast.

  **Debrief (10 minutes):**  
  Map rounds to the theorem:  
  - **Non-Dictatorial Condition**: In rounds 1–4, rules are non-dictatorial → manipulability emerges (students experienced this).  
  - **Onto (Surjective) Condition**: All alternatives won in some round (e.g., Borda allowed A or B to win; Veto Rule allowed A or B). If a rule isn’t onto, manipulation may not be forced.  
  - **#Alternatives ≥3**: Crucial! With 2 alternatives, majority vote is strategy-proof.  
  - **Dictatorial Round**: Highlights the **price of strategy-proofness**—only a dictator’s rule is immune to manipulation, but it’s normatively unacceptable.  

  **Predictable Challenges & Solutions:**  
  - **Manipulation Fails/Misses**:  
    - *Risk*: Students miscompute lies (e.g., in Borda, V2 doesn’t see switching to C helps B win).  
    - *Fix*: Provide "cheat sheets" with voting math (e.g., "Given current votes, if you do X, outcome becomes Y"). Pre-calculate pivotal scenarios.  
  - **Boredom in Dictatorial Round**:  
    - *Risk*: Students disengage when powerless.  
    - *Fix*: Keep it ultra-short (1 min); emphasize contrast: "This is the ONLY rule where your vote can’t be manipulated!"  
  - **Over-Manipulation**:  
    - *Risk*: Students manipulate unsafely (e.g., plurality voter switches to third choice, worsening outcome).  
    - *Fix*: Debrief calmly: "The theorem says manipulation is *possible*, not that it’s easy or always wise."  

  **Activity’s Limits & Closing Lecture (5 minutes):**  
  - **What the Game Can’t Do**:  
    - No finite game can prove **universal quantification** ("all non-dictatorial rules are manipulable"). Students see 4 rules manipulated, but not *every* possible rule.  
    - The **theorem’s generality** requires abstract proof (e.g., using the concept of a pivotal voter or equivalence to Arrow’s theorem).  
  - **Closing Lecture Essentials**:  
    1. "Today you saw manipulability in 4 rules. The theorem says this *must* happen under any non-dictatorial rule where every alternative can win."  
    2. "The proof shows that if a rule is strategy-proof and onto, it must be dictatorial—a paradox we felt in the dictatorial round."  
    3. "Why care? Real-world implications: Voting rules are *inherently* gameable. We must either accept manipulation or embrace dictatorship."  
    - **Keep it Short**: Use 1–2 slides; focus on the "why" over the "how" of the proof.  

  **Why Candy > Extra Credit:**  
  - **Immediacy**: Candy provides instant, tactile reward, heightening incentive contrasts (e.g., 3 vs. 0 candies feels more urgent than +0.5 vs. 0 points).  
  - **Low Stakes**: Avoids grade anxiety; students focus on game theory, not academic risk.  
  - **Fun Factor**: Lightens mood, encouraging bolder play (e.g., "gaming for candy" feels like a experiment, not an exam).  

  By experiencing manipulation, students internalize the theorem’s inevitability. The debrief then frames their frustration ("Why can’t we find a fair rule?") as the theorem’s profound insight.
