prompt: |-
  I'm on the grantmaking committee of a mid-sized health research foundation (endowment around $500M, we disburse maybe $25M a year), and we have a proposal in front of us that's splitting the committee down the middle. I need a decision memo I can circulate before thursday's meeting. Please act as a decision theorist who's spent years advising philanthropic boards, and think it through carefully before drafting — maybe do a quick brainstorm first about where the committee members actually disagree, because the reasoning will matter more to them than the verdict.

  The proposal: a PI wants money for a staged research program. Stage 1 costs $200k and succeeds with probability roughly 1/2. If it succeeds she moves to stage 2, which costs about double and again succeeds with ~1/2 chance, and so on — each stage costs roughly twice the last. But the payoff if the program is ever completed grows even faster than the costs do, so on her own numbers the expected value of funding stage 1 is enormous (on one reading it's not even bounded — the structure is basically the St. Petersburg setup wearing a grant application as a costume).

  The committee has roughly three factions. One wants stage 1 funded immediately: the entry cost is pocket change for us, so how can we turn down positive expected value? Our finance member says this "proves too much" — if expected value is the whole story, we're committed to funding every later stage no matter how big the checks get, and to any longshot with a sufficiently huge promised payoff; he wants us to reject and adopt a standing rule that no single program ever gets more than ~2% of the endowment. A third member wants to fund stage 1 but with a pre-defined stopping rule (cap total spend at $10M for this program, or pull the plug after two failed stages), though she can't quite say why that cap rather than another.

  Draft the memo. It needs: a clear recommendation (fund, reject, or fund with explicit conditions), a concrete stopping rule if you recommend funding, and an honest treatment of the strongest argument on the losing side — in particular whether the finance member's 2% cap is principled or just arbitrary, and whether saying "the expected value is infinite so the arithmetic alone can't settle it" is a cop-out or the beginning of wisdom. Keep it under 700ish words and write it so the committee members could actually respond to the reasons, not just the bottom line.
reasoning: |-
  Okay, the user is on a grantmaking committee for a health research foundation with a $500M endowment, disbursing $25M annually. They're split on a proposal involving a staged research program with escalating costs and potential payoffs. The user needs a decision memo by Thursday to help resolve the disagreement.

  First, I need to understand the proposal structure. It's a multi-stage project where each stage costs double the previous one and has a 50% success probability, with payoffs growing faster than costs. This resembles the St. Petersburg paradox - infinite expected value but practically unsustainable. The committee has three factions: one wants to fund stage 1 because of positive EV, another wants to reject due to financial exposure concerns, and a third suggests funding with a stopping rule but can't justify the cap amount.

  The key disagreements seem to be about: 
  1) How to handle theoretically infinite EV in practical decision-making 
  2) Appropriate risk exposure for a foundation of this size 
  3) Whether to commit to future stages upfront 
  4) How to set principled rather than arbitrary limits

  For the memo, I should acknowledge the validity in all perspectives while steering toward a practical solution. The finance member's 2% cap is sensible as a diversification principle but feels arbitrary without context. A better approach might be to fund stage 1 while establishing clear stopping criteria based on both budget impact (percentage of annual grant budget) and performance metrics.

  I'll recommend funding stage 1 with conditions: 
  - Pre-commit to maximum total exposure (say $1.5M, covering up to stage 3) 
  - Require rigorous go/no-go criteria between stages 
  - Formalize this as a template for similar proposals

  This satisfies the pro-funding faction by approving stage 1, addresses financial concerns with a hard cap, and gives the stopping-rule advocate a structured approach. The memo should emphasize that infinite EV doesn't obligate funding - practical constraints matter. The finance member's diversification concern is valid but better handled through explicit per-program caps rather than a blanket endowment percentage.

  Word count is tight - need to keep under 700 words while covering: clear recommendation, stopping rule specifics, and substantive engagement with counterarguments. Tone should be analytical but accessible, acknowledging the committee's expertise while providing clear reasoning they can respond to.
answer: |-
  ## Decision Memo: Staged Research Proposal (PI: [Name])  
  **To:** Grantmaking Committee  
  **From:** [Your Name], Decision Advisor  
  **Date:** [Date]  
  **Subject:** Recommendation & Framework for Proposal [Reference Number]  

  ### 1. Core Dilemma & Factional Analysis
  The committee’s deadlock stems from a foundational tension in philanthropic decision theory: **how to reconcile unbounded theoretical expected value (EV) with bounded institutional reality.** Our factions highlight valid, irreconcilable perspectives:
  *   **Pro-Funding Faction:** Correctly notes Stage 1 ($200k) has positive EV *conditional on our ability/willingness to fund all future stages*. The trivial cost relative to our budget makes rejection seem irrational under pure EV calculus.
  *   **Finance Faction:** Correctly identifies the "commitment trap." Accepting infinite EV logic obligates us to potentially catastrophic future bets, violating prudent stewardship. A 2% endowment cap (~$10M) is a defensible *fiduciary circuit-breaker* but appears arbitrary without linking it to portfolio risk.
  *   **Conditional Funding Faction:** Intuitively grasps the need for a pre-commitment device but struggles to anchor the cap. This reflects the core challenge: **No purely mathematical solution exists for capping a St. Petersburg-like gamble; it requires institutional policy.**

  **The St. Petersburg Reality:** While the PI’s EV calculation is mathematically sound *if the series runs forever*, it is operationally impossible. Philanthropy cannot (and should not) ignore:
  *   **Budget Constraints:** Future stages demand exponentially larger allocations, crowding out other missions.
  *   **Diminishing Marginal Utility of Impact:** A $1B "cure" isn’t infinitely more valuable than a $100M partial breakthrough in the same domain.
  *   **Risk of Failure:** Sequential 50% failure probabilities imply rapid attrition. Funding Stage 5 ($3.2M) *only happens* if 4 prior stages succeed (~6.25% chance).

  ### 2. Recommendation: **Fund Stage 1 ($200k) WITH Explicit, Binding Stopping Rules**
  *   **Rationale:** The *option value* of Stage 1 is high relative to cost. It generates valuable knowledge (success/failure, feasibility data) for $200k. However, **unconditional funding creates unacceptable future obligations and moral hazard.** Pre-commitment protects against the commitment trap.

  *   **Concrete Stopping Rule:**  
      **"Total cumulative investment in this specific research program shall not exceed $1.5 million without explicit, de novo Committee re-authorization based solely on results from the prior funded stage(s)."**  
      *   *Why $1.5M?* This covers Stage 1 ($200k), Stage 2 ($400k), and Stage 3 ($800k) – a total of $1.4M, leaving a $100k buffer. This provides 3 meaningful data points (Stage 1 result + Stage 2 result + decision point before Stage 3). Funding beyond Stage 3 ($800k alone) requires revisiting the *entire* proposition based on *actual* results and competing priorities, not theoretical EV.  
      *   *Go/No-Go Gates:* Funding for Stage 2 ($400k) is *contingent solely* on Stage 1 success AND delivery of a satisfactory Stage 2 proposal meeting pre-agreed scientific milestones. Similarly, Stage 3 funding ($800k) requires Stage 2 success + satisfactory proposal. **No automatic rollover.**

  ### 3. Addressing Key Counterarguments Honestly
  *   **Pro-Funding Faction ("It’s positive EV! Just fund Stage 1!"):**  
      *   **Strength:** Captures the asymmetry: small downside ($200k loss), large potential upside *if* we learn Stage 1 succeeds. Pure EV *at entry* is compelling.
      *   **Weakness/Response:** Funding Stage 1 *without pre-commitment* implicitly endorses the infinite series logic. It pressures future committees to fund Stage N+1 simply because "we’ve already invested $X million." Our duty is to maximize *overall portfolio* impact, not chase a single unbounded EV. This structured approach captures the Stage 1 option value while retaining future control.

  *   **Finance Faction ("2% Cap! Reject! Infinite EV is dangerous!"):**  
      *   **Strength:** Profoundly correct that infinite EV cannot dictate real-world grants. A diversification cap (like 2% of endowment/$10M) is **principled as a portfolio risk management tool** to prevent catastrophic single-program exposure and ensure mission breadth. Blindly following EV calculations leads to ruin.
      *   **Weakness/Response:** A rigid 2% cap applied *at Stage 1* is **overly blunt and potentially wasteful.** Rejecting *all* high-risk, high-potential-return projects due to their theoretical tails ignores the value of small, cheap options. Our $1.5M cap (<0.1% of endowment, 6% of annual budget) is vastly more conservative than $10M, yet allows exploration. It operationalizes the *spirit* of diversification without arbitrarily killing promising cheap entry points. **Saying "infinite EV doesn't settle it" is the BEGINNING of wisdom.** It forces us to define our institutional risk appetite and stopping criteria explicitly, as we’ve done here.

  *   **Conditional Funding Faction ("A cap, but which one?"):**  
      *   **Strength:** Recognizes the necessity of a pre-defined exit.
      *   **Response:** The $1.5M cap balances:  
          (1) **Meaningful Runway:** Allows 2-3 stages (depending on success), generating significant data for future decisions.  
          (2) **Budgetary Safety:** Limits exposure to a manageable fraction of *annual* grant budget (<6%), not endowment.  
          (3) **Performance Gating:** Forces reassessment *before* costs become truly material ($800k+).  
          (4) **Precedent:** Establishes a scalable template: "Initial entry cost + next 1-2 logical stages based on cost curve, capped at a low % of annual budget."

  ### 4. Conclusion & Path Forward
  **Recommendation: Approve Stage 1 funding of $200,000, subject to a legally binding grant agreement stipulating:**  
  *   **Total Program Cap:** $1,500,000 cumulative investment.  
  *   **Contingent Funding:** Release of funds for Stage 2 ($400k) requires documented Stage 1 success AND Committee approval of a Stage 2 proposal meeting pre-defined milestones. Stage 3 ($800k) release requires Stage 2 success + Committee approval.  
  *   **No Implied Commitment:** The agreement must explicitly state funding beyond Stage 1 is neither guaranteed nor implied.

  This approach captures the low-cost option value Stage 1 offers, respects the Finance Faction’s profound concern about unbounded commitments by imposing a strict, early, and budget-anchored cap, and provides the Conditional Faction with a concrete, justifiable stopping rule based on both cost escalation and performance. It transforms an infinite gamble into a bounded experiment with clear off-ramps, aligning philanthropic ambition with fiduciary responsibility.

  **For Thursday:** Let's discuss: 1) Suitability of the $1.5M cap level, 2) Specific milestones/go-no-go criteria for Stage 1 -> Stage 2 transition.
