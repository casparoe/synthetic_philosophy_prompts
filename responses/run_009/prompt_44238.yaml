     - Altruism: 0.3. Without resorting to inclusive fitness, explaining altruism is problematic. The framework might try to explain altruism as group-level but then it's stepping into group selection territory. In a pure organism-level view, altruism is a puzzle (unless it's reciprocal, but that's a different mechanism). It often has to implicitly use gene-level thinking to explain altruism (e.g., via kin selection) without admitting it.
     - Intragenomic: 0.0. It cannot handle intragenomic conflict. From the organism's perspective, the genome is a unitary whole. Meiotic drive is seen as a pathology or anomaly that the framework cannot explain because it violates the assumption that the organism is the unit of selection.

