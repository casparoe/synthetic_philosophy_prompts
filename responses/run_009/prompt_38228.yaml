prompt: |-
  I write a column on science and ideas, and I've been on a moral revolutions kick lately — Kwame Anthony Appiah's work on how dueling and foot-binding actually died, and his line that it wasn't arguments that ended them so much as a shift in what counted as honorable. Every time I mention this at dinner, somebody trots out the quip about science advancing one funeral at a time (usually pinned on Max Planck), as if it settles how norms change. It clearly can't mean just one thing. Can you lay out the distinct precise claims that one-liner could be making — e.g. that individuals essentially never change their minds on fundamentals, that conversion happens but is too rare to drive real change, that it's about institutions and careers moving only when incumbants die, or that it's really a claim about incentives and audiences rather than psychology? For each reading, say whether it's trivial, defensible, or flat-out false, and — this is the part I care about most — whether it actually fits the historical cases of dueling or the abolition of slavery, or whether those are cases where the slogan gets it wrong. I'd like a menu I can take back to my editor. And since this is going in print: tell me how confident you are in each verdict and single out the reading you're least sure about — I'd rather hedge explicitly than run folklore as fact. (Sorry for any typos, deadline brain.)
reasoning: |-
  Okay, the user writes a science column and is interested in moral revolutions like the end of dueling and foot-binding. They mention how people often bring up Max Planck's quip that science advances one funeral at a time when discussing norm changes. The user wants a breakdown of the different interpretations of that quote, assessed for validity, and checked against historical cases like dueling and slavery abolition. They need this for their editor, with confidence levels and hedging where uncertain.

  First, I need to parse the possible meanings of Planck's statement. It's a metaphor, so interpretations can vary. Let me list the main angles: individual psychology (people don't change their minds), rarity of conversion, institutional inertia, and incentive structures. Each needs evaluation for triviality, defensibility, or falsehood.

  For individual psychology: the claim that people never change fundamental beliefs. This seems too strong. Historical examples like abolitionists show individuals changing views. Wilberforce and others evolved their stances. But maybe in science, entrenched paradigms resist change. So for moral revolutions, this interpretation is weak. Dueling declined partly due to younger generations rejecting it, not just old adherents dying. Verdict: false for moral cases, but maybe more true in scientific contexts. Confidence high for moral examples, but maybe not for science.

  Next, conversion rarity. Here, it's not that people can't change, but that it's too infrequent to drive change. This is more defensible. For instance, many slaveholders didn't renounce slavery; economic factors and new norms influenced change. But abolition had key converts like Newton. So it's a mix. Moderate confidence here because of varied evidence.

  Institutional inertia is about gatekeepers in positions of power blocking change until they die. This fits academic settings. In moral revolutions, institutions like the military upheld dueling, but its decline involved broader societal shifts, not just deaths. The Royal Navy's reform happened through institutional changes, not merely funerals. Defensible but incomplete. Confidence moderate.

  The incentive reading focuses on rewards and punishments. Dueling became less honorable as reputational costs rose. Abolition gained momentum when economic incentives shifted and moral arguments resonated with new audiences. This seems the strongest fit for moral revolutions. High confidence here, especially given Appiah's honor-based explanation.

  The user cares most about how these readings apply to dueling and slavery abolition. For each interpretation, I need to cross-check with these cases. Also, note where Planck's quip doesn't hold, like in rapid moral shifts or when external pressures (e.g., wars) accelerate change.

  The least sure point might be the conversion rarity. It's tricky to measure how many individuals changed vs. generational shift. In abolition, there were significant converts, but systemic factors were crucial. So hedging there makes sense.

  Finally, structure the response clearly for the editor: each reading, verdict, confidence, and historical fit. Emphasize that moral revolutions often involve honor shifts, not just funerals, per Appiah. Highlight that Planck's quip oversimplifies, especially for social norms.
answer: |-
  Here's a dissection of the "science advances one funeral at a time" quip applied to moral revolutions, tailored for your column. I've broken it down into distinct claims, assessed their validity, and evaluated their fit with dueling and abolition, including confidence levels and hedging where needed.

  **Core Claim Breakdown & Assessment:**

  1.  **Individual Psychological Rigidity:**
      *   **Claim:** Individuals *essentially never* change their deeply held, fundamental beliefs (scientific paradigms or core moral convictions) once established. Change *only* occurs when they die and are replaced.
      *   **Verdict:** **Flat-out False** (for moral revolutions).
      *   **Confidence:** **High**.
      *   **Why:** History is replete with individuals who fundamentally changed their core moral views (e.g., slaveholders becoming abolitionists, proponents of dueling renouncing it). John Newton (slave trader to abolitionist) or numerous military officers who publicly denounced dueling later in life are clear counterexamples. While changing deeply held views is hard and often incomplete, claiming it *never* happens on a scale that matters is empirically incorrect. **Fits Dueling/Abolition? Poorly.** Both movements involved key converts and evolving individual stances.

  2.  **Rarity of Conversion:**
      *   **Claim:** Individuals *can* change their minds, but such genuine, deep conversion on fundamental issues is *extremely rare*. It's statistically insignificant as a driver of large-scale change compared to generational replacement.
      *   **Verdict:** **Defensible, but Incomplete and Context-Dependent.**
      *   **Confidence:** **Moderate** (Evidence is mixed; measuring "genuine deep conversion" is hard).
      *   **Why:** While some individuals do change profoundly, mass shifts often rely more on new adherents entering the scene than mass conversions of the old guard. Changing a lifetime's worldview involves high psychological costs. However, dismissing conversion entirely ignores pivotal figures whose changes *did* accelerate movements. **Fits Dueling/Abolition? Partially.** Abolition saw significant individual conversions (often religiously motivated). Dueling's decline saw fewer high-profile converts *towards* dueling later in life, but many simply stopped practicing without a dramatic "conversion." Generational shift was powerful in both cases, but not the *sole* mechanism.

  3.  **Institutional/Structural Inertia:**
      *   **Claim:** Change is blocked by powerful individuals ("gatekeepers") entrenched in positions of authority (academic chairs, political offices, military ranks, cultural leadership) who actively suppress dissent or new ideas. Progress requires their literal removal (death) for new ideas/personnel to gain influence.
      *   **Verdict:** **Defensible and Often Highly Relevant (especially in structured hierarchies).**
      *   **Confidence:** **High.**
      *   **Why:** This is arguably the *strongest* interpretation of Planck's quip. It highlights how power structures, patronage networks, and career incentives create inertia. Death removes obstacles and opens positions for new thinkers/norm-bearers. **Fits Dueling/Abolition? Well for Dueling, Mixed for Abolition.**
          *   **Dueling:** Military hierarchies (especially in Europe) were strongholds. Senior officers upholding the "code of honor" often blocked reforms. Their deaths *did* facilitate institutional changes (e.g., stricter regulations enforced by younger commanders). Fits well.
          *   **Abolition:** Less clear-cut. While pro-slavery politicians (e.g., in the US South or Caribbean assemblies) were obstacles, abolitionist power grew *within* existing institutions (Parliament, churches). Key victories often came through political maneuvering, shifts in public opinion pressuring incumbents, and external events (e.g., slave revolts, economic shifts), not just waiting for opponents to die. Death mattered (e.g., turnover in legislatures), but wasn't the primary driver.

  4.  **Shifting Incentives & Audiences (The Honor Reading):**
      *   **Claim:** It's not primarily about individual psychology or institutional blockage, but about *what behavior is rewarded or punished socially*. "Funerals" symbolize the gradual shift in the dominant audience whose opinion matters (e.g., younger generations, new elites, a broader public). When the old audience (who rewarded dueling/foot-binding/slavery) dies off, the new audience, holding different values and offering different incentives (honor, shame, career prospects), dominates.
      *   **Verdict:** **Highly Defensible and Aligns with Appiah.**
      *   **Confidence:** **High.**
      *   **Why:** This directly resonates with Appiah's core thesis about honor. The "funeral" represents the passing of the cohort for whom the old practice was constitutive of honor/status. The rising cohort defines honor differently. Change accelerates when the cost (social shame, career damage) of adhering to the old norm outweighs the benefit (honor/status within the old group). **Fits Dueling/Abolition? Excellent Fit.**
          *   **Dueling:** Dueling collapsed when it ceased to confer honor among influential social circles and began to mark one as violent, reckless, or criminal in the eyes of a broader, more bourgeois/public sphere. Younger generations found different paths to status.
          *   **Abolition:** Slavery became increasingly dishonorable among powerful new audiences (evangelicals, industrialists, Enlightenment liberals) in the metropole. The honor/status for planters persisted *locally* but was increasingly countered by shame and political opposition *centrally*. The "audience" defining moral worth shifted.

  5.  **Trivial Demographic Reading:**
      *   **Claim:** Societies consist of cohorts with different average views. As older cohorts die and newer cohorts with different average views enter, the overall societal norm shifts – a simple demographic fact.
      *   **Verdict:** **Trivially True, but Inadequate.**
      *   **Confidence:** **Very High.**
      *   **Why:** This is simply how populations work. However, it's entirely descriptive and passive. It ignores *why* cohorts differ (socialization, historical experiences, intellectual movements, economic changes) and the active processes of persuasion, conflict, and institutional change that accelerate or shape the generational shift. It treats "funerals" as the *mechanism*, rather than a passive correlate. **Fits Dueling/Abolition? Superficially.** Yes, generational change occurred, but this reading misses the crucial dynamics of *how* the new generation came to hold different views (Appiah's honor shift, activism, economic factors) and how they enacted change against resistance.

  **The Verdict Menu for Your Editor:**

  | Reading of "One Funeral at a Time" | Verdict & Confidence       | Fits Dueling? | Fits Abolition? | Notes for Your Column                                                                 |
  | :--------------------------------- | :------------------------- | :------------ | :-------------- | :------------------------------------------------------------------------------------ |
  | **1. Individual Rigidity**         | **False (High Confidence)** | Poorly        | Poorly          | Ignores documented converts; change happens within lifetimes.                          |
  | **2. Rarity of Conversion**        | **Defensible (Moderate Confidence)** | Partially     | Partially       | Generational shift is powerful, but pivotal converts matter. **Hedge here - least sure.** |
  | **3. Institutional Inertia**       | **Defensible (High Confidence)** | Well          | Mixed           | Strong fit where hierarchies block change (e.g., military dueling culture).           |
  | **4. Shifting Incentives/Honor**   | **Defensible (High Confidence)** | Excellent     | Excellent       | Best aligns with Appiah; core change is in what society rewards/punishes as "honorable." |
  | **5. Trivial Demographics**        | **Trivial (Very High Confidence)** | Superficially | Superficially   | True but shallow; misses *why* norms shift between generations.                       |

  **Key Takeaways for Your Column:**

  1.  **Planck's quip is an oversimplification,** especially for moral revolutions. It likely works best for highly technical scientific paradigms blocked by gatekeepers (Reading 3).
  2.  **Appiah's Honor Shift is the Winner:** For dueling and abolition, the strongest explanatory power comes from understanding the *shift in what conferred honor and status* (Reading 4). The "funerals" symbolize the passing of the audience that bestowed that old honor.
  3.  **Generational Shift is Crucial, But Not Simple:** While new generations are vital (Readings 2 & 5), *why* they hold different views and *how* they overcome entrenched power (Readings 3 & 4) is the real story. It's not *just* passive replacement.
  4.  **Don't Erase Agency:** Readings 1 and 5 risk implying passive inevitability. Revolutions need actors – converts, new generations, institutional reformers – working within shifting landscapes of honor and incentive.
  5.  **Explicit Hedge:** Emphasize that while generational replacement and the removal of institutional obstacles (Readings 2, 3, 5) are significant factors, the *least certain* aspect is precisely *how rare* deep individual conversion is as a driver (Reading 2). Evidence is fragmentary and context-dependent. The rise of new audiences defining honor (Reading 4) provides a more robust framework encompassing why generations differ.

  **Final Thought:** Push back against the dinner-party quip. Planck described a specific type of scientific inertia. Applying it blindly to moral revolutions like dueling or abolition obscures Appiah's crucial insight: it wasn't *arguments* alone, nor *just* funerals, but a seismic shift in the very architecture of **honor** – who bestowed it, and what actions earned it – that made these practices unsustainable. The funerals were a symptom, not the primary cause, of that deeper cultural shift.
