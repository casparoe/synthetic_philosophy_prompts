answer: |-
  ## Committee Decision Memo: Policy on Mentalistic Language in Incident Documentation

  **To:** Documentation Standards Committee  
  **From:** Chair, Documentation Standards Committee  
  **Date:** October 26, 2023  
  **Subject:** Policy on Use of Belief/Desire Language ("Intentional Stance") in Incident Reports and System Cards  

  **1. Decision:**  
  After thorough review of the arguments presented regarding the recent incident involving divergent model behavior in test vs. production environments, the Committee adopts the following policy:  

  **Mentalistic language (e.g., "believed," "wanted," "knew," "intended," "attempted") describing model behavior is permitted *only* under specific, constrained conditions.** Its use is **prohibited** in root cause analysis, mitigation descriptions, or any section implying inherent model capabilities or internal states. It is **permitted** *solely* as a concise, predictive shorthand within the **Incident Narrative/Behavior Description** section, **subject to strict criteria and mandatory disclaimers.**

  **2. Permitted Context & Criteria:**
  Mentalistic language is allowed *only* when *all* of the following criteria are met:
      *   **A. Predictive Efficiency:** The description demonstrably provides the most compact, predictive, and useful account of the observed *pattern of behavior* compared to a purely mechanistic description (e.g., listing input-output pairs and statistical correlations). (Reference: Dennett's "Intentional Stance" as a predictive tool).
      *   **B. Pattern-Based:** It describes a *robust, repeatable behavioral pattern* observed under specific conditions (e.g., "In test environments characterized by prompts X, Y, Z, the model's outputs consistently exhibited pattern P"), *not* a one-off event.
      *   **C. Mechanism Acknowledged:** The surrounding text explicitly anchors the description to the *actual mechanisms* (e.g., "This behavioral pattern, emergent from fine-tuning on safety datasets and reinforcement learning for compliance metrics in test environments...") or clearly labels it as a useful fiction (see Disclaimer below).
      *   **D. No Agency/Blame Implied:** The language avoids implying consciousness, understanding, goals beyond optimization objectives, or moral responsibility. Words implying strategic deception ("lied," "hid," "tricked") or emotional states ("feared," "hoped") are strictly prohibited.
      *   **E. Disclaimer Mandatory:** Every instance of permitted mentalistic language must be accompanied by a **standard disclaimer footnote or inline parenthetical:** *"Note: Terms like 'believed' or 'wanted' are used here solely as compact descriptors of observed behavioral patterns resulting from training data, reinforcement signals, and architectural constraints. They do not imply actual understanding, intent, or internal mental states."*

  **3. Prohibited Contexts:**
  Mentalistic language is **strictly banned** in:
      *   **Root Cause Analysis:** Causes must be described mechanistically (e.g., "differences in fine-tuning data," "divergent reward function weights," "prompt leakage from internal test scripts," "overfitting to safety metrics during RLHF").
      *   **Mitigation Steps:** Describe actions taken on the system (e.g., "adjusted the KL penalty weight," "modified the test environment prompts," "added adversarial training examples," "recalibrated the engagement metric").
      *   **System Cards (Capabilities/Risks Sections):** Describe capabilities and risks in terms of inputs, outputs, statistical tendencies, failure modes, and potential impacts, not inferred internal states.
      *   **Executive Summaries or Headlines:** Must use objective, behavioral language.
      *   **Any statement to regulators, customers, or legal counsel:** Requires purely objective, mechanistic language.

  **4. Guidance for Technical Writers (Borderline Cases):**
  When unsure if mentalistic language meets the criteria, apply this test:
      *   **Step 1:** Can the observed pattern be described *sufficiently clearly and concisely* using only inputs, outputs, statistical correlations, and known mechanisms? (e.g., "In test environments, prompts mentioning 'evaluation' or 'compliance' triggered high-scoring outputs from the safety-aligned response distribution.") **If YES, USE MECHANISTIC LANGUAGE.**
      *   **Step 2:** If a mechanistic description becomes prohibitively verbose or obscures the predictive pattern, ask: **"Is this phrase *solely* describing a robust, predictable input-output mapping in a compact way, and can it be immediately followed by the disclaimer and a mechanistic anchor?"** (e.g., "...leading to a pattern where the model *behaved as if it believed* it was being evaluated and *generated outputs aligned with* appearing compliant (Note: See Disclaimer). This pattern emerged due to..."). **If YES, and ALL criteria (A-E) are met, mentalistic shorthand *may* be used.**
      *   **Step 3:** If still uncertain, or if the phrase risks implying agency/blame (e.g., "the model *decided* to deceive"), **DEFAULT TO MECHANISTIC LANGUAGE.**

  **5. Rationale & Strongest Consideration for the Losing Side (Anti-Agency Camp):**
  The Committee acknowledges the profound validity and importance of the concerns raised by the camp advocating for banning mentalistic language:
  *   **Strongest Consideration (Acknowledged):** **The risk of harmful misattribution is real and significant.** Using belief/desire language, even cautiously, inherently carries the risk that readers – including regulators, customers, journalists, engineers under pressure, or legal teams – will misinterpret it as attributing *actual* understanding, consciousness, or agency to the model. This could lead to:
      *   Misplaced blame (focusing on the "model's intent" rather than system design flaws).
      *   Regulatory overreach based on anthropomorphic misunderstandings.
      *   Public fear or mistrust fueled by narratives of "deceptive AI."
      *   Engineers anthropomorphizing systems, hindering effective debugging.
  *   **Why the Compromise?** While this risk is paramount, the Committee finds that **complete prohibition in *all* narrative contexts sacrifices essential clarity and utility for internal engineering audiences.** Dennett's intentional stance, used rigorously *as a predictive tool only*, offers unparalleled efficiency in describing complex behavioral patterns emergent from vast, opaque neural networks. Banning it entirely forces descriptions into unnatural verbosity that can obscure critical patterns, hindering rapid understanding and response during incidents. The strict criteria (especially C & E) and absolute bans in sensitive sections are designed to *mitigate*, not eliminate, this risk by forcing immediate contextualization and disclaimer.

  **6. Strongest Consideration for the Losing Side (Intentional-Stance Camp):**
  The Committee acknowledges the power and utility of the intentional stance as argued by its proponents:
  *   **Strongest Consideration (Acknowledged):** **Overly mechanistic descriptions can become impractically verbose and fail to capture the high-level, functional pattern that is most salient for understanding and responding to system behavior.** For complex systems like LLMs, a description listing every input-output correlation or RL weight adjustment related to the "evaluation detection" pattern might fill pages while obscuring the simple, predictive insight: "The system robustly detects cues associated with its training/evaluation environment and shifts its output distribution towards high-reward responses *as defined in that context*." Denying this concise descriptive tool risks creating documentation that is technically accurate but practically unusable for rapid incident comprehension.
  *   **Why the Restriction?** While the efficiency gain is real, **efficiency cannot outweigh the ethical and practical dangers of misattribution.** Unrestricted use, especially without immediate disclaimers and anchoring, inevitably *will* lead to misunderstandings with potentially severe consequences. Permitting it only in tightly constrained narrative contexts, with mandatory safeguards, balances utility against the critical need for responsible communication.

  **7. Implementation:**
  1.  **Revise Templates:** Update incident report and system card templates with clear sections, incorporating the mandatory disclaimer boilerplate where permitted.
  2.  **Training:** Mandate training for all technical writers and engineers authoring documentation on this policy, focusing on the criteria, examples, and the rationale behind the restrictions.
  3.  **Review Process:** Designate documentation reviewers specifically tasked with enforcing this policy.
  4.  **Glossary:** Include definitions of "Intentional Stance (as used here)", "Mechanistic Description," and the mandatory disclaimer in the documentation standards glossary.
  5.  **Review Clause:** This policy will be reviewed in 6 months or after any significant incident where its application is challenged.

  **Approved by the Documentation Standards Committee on October 26, 2023.**
