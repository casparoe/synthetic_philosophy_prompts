  For realism, I'll draw from common corporate environments where protocol overrides individual judgment. The key is designing a case where the speaker's social group isn't relevant, yet their testimony gets dismissed due to systemic factors. The challenge is making the dismissal appear professionally justified while still constituting epistemic harm. 

