answer: |-
  Below is a comprehensive design for your 90-minute futarchy prediction market exercise. It addresses your core goals (information aggregation, values/beliefs separation, manipulation), constraints (no real money/extra credit, 18 students, movable desks), and includes materials, step-by-step instructions, troubleshooting, and debriefing points. The design uses **play money** (with candy/bragging rights prizes) and **physical trading** to keep it engaging and low-tech.

  ---

  ### **Materials to Prep Beforehand**
  1. **Play Money**: 
     - Print 3 sets of play money (1 set per round). Each set: 
       - 18 envelopes with $100 in assorted denominations (e.g., ten $10 bills). 
       - **Total money supply**: $1,800 per round.
     - **Prizes**: Small candy bars/stickers for top 3 portfolios each round (based on cash + asset value). Bragging rights for "Market Shark" awards.

  2. **Information Cards**: 
     - **Round 1**: 18 cards—6 say _"I will attend the optional session"_, 12 say _"I will skip the optional session"_. Seal in envelopes so students can’t peek.
     - **Round 2**: 18 cards with movie preferences (6x _"Action"_, 6x _"Comedy"_, 6x _"Documentary"_)—used for voting.

  3. **Market Boards** (3 large posters): 
     - **Round 1**: "Will ≥12 students attend next week’s optional session?" (Binary: YES/NO shares).
     - **Round 2**: "Which movie will win the vote?" (Three shares: ACTION, COMEDY, DOC).
     - **Round 3**: "Will the die roll ≥4?" (Binary: HIGH/LOW shares).

  4. **Trading Materials**:
     - Share certificates (paper slips) for each market (e.g., 50 YES/NO slips, 30 per movie share, 50 HIGH/LOW slips).
     - A 6-sided die for Round 3.
     - Timer, markers, sticky notes for price updates.

  5. **Student Packets**:
     - Portfolio trackers (worksheets to log trades/cash).
     - Rule cheat sheets (how trading works, bid/ask examples).

  ---

  ### **Room Setup**
  - **Arrange desks in a circle** with a central "trading pit" (market boards + your TA station).
  - **You act as market maker** to ensure liquidity—this is critical for a small group.

  ---

  ### **Session Structure (90 Minutes Total)**
  **Goal 1: Information Aggregation**  
  *(30 mins: Setup 5m, Trading 15m, Settle 5m, Transition 5m)*  
  **Market**: "Will ≥12 students attend next week’s optional session?" (Actual outcome: NO, based on 6 "attend" cards).  
  **Why this works**: Students hold private info (their attendance intent), forcing them to trade on hidden knowledge.  

  1. **Setup (5 mins)**:
     - Hand out $100 play money and sealed info cards. Emphasize: **Do not reveal your card**.
     - Explain the market:  
       - YES share pays $100 if ≥12 attend; NO share pays $100 if <12 attend.  
       - You (as market maker) set initial prices: **Bid $40 (buy NO) / Ask $60 (buy YES)**.  
       - Trading rules: Shout bids/offers ("Buy YES at $50!") or trade with the market maker at current prices. After each trade, you adjust prices: **+$5 to bid/ask after a buy, -$5 after a sell** (simulates demand-driven pricing).  

  2. **Trading (15 mins)**:
     - Start trading. Encourage students to use their private info (e.g., "attend" card holders may buy YES).  
     - **Track prices publicly**: Update bid/ask on the board after each trade (e.g., first buy: new ask $65).  
     - **Force participation**: Offer $10 "curiosity grants" to quiet students to place one trade.  

  3. **Settle & Discuss (5 mins)**:
     - Reveal attendance cards: Only 6 "attend", so NO shares win.  
     - Pay $100 to NO holders.  
     - **Key debrief point**: "Did prices move as info aggregated? Why did YES rise initially? (Hint: Optimism bias!)"  

  **Transition**: Collect all money/shares. Redistribute $100 for Round 2.  

  ---

  **Goal 2: Values vs. Beliefs & Self-Fulfilling Prophecy**  
  *(30 mins: Setup 5m, Trading 15m, Vote 5m, Settle 5m)*  
  **Market**: "Which movie will we vote to watch?" (ACTION, COMEDY, DOC) + a **vote on values**.  
  **Why this works**: Voting (values) and markets (beliefs) run in parallel. Share ownership may sway voting.  

  1. **Setup (5 mins)**:
     - Hand out movie-preference cards (ACTION/COMEDY/DOC) for the vote.  
     - Open 3 markets (one per movie). Initial prices: **Bid $30 / Ask $50** for each.  
     - Explain: "Trade shares based on what you think will win, not what you want. Later, you’ll vote for your favorite."  

  2. **Trading (15 mins)**:
     - Students trade movie shares. Market maker adjusts prices per trade.  
     - **Encourage campaigning**: Let students lobby for their preferred movie. Watch for:  
       - Students holding shares of a movie **campaigning harder** to inflate its price.  
       - **Self-fulfilling prophecy**: If ACTION shares surge, voters may bandwagon ("It’s winning anyway!").  

  3. **Vote & Settle (10 mins)**:
     - Hold a **plurality vote** using preference cards. Tally publicly.  
     - Winning movie’s shares pay $100; others expire worthless.  
     - **Key debrief point**: "Did shareholding change how you voted? How did prices affect the vote?"  

  **Transition**: Collect money/shares. Redistribute $100 (and $200 extra to the manipulator).  

  ---

  **Goal 3: Manipulation**  
  *(20 mins: Setup 5m, Trading 10m, Settle 5m)*  
  **Market**: "Will a die roll ≥4?" (True probability: 50%).  
  **Why this works**: A manipulator with extra cash tries to distort prices, testing Hanson’s "manipulation subsidizes truth" theory.  

  1. **Setup (5 mins)**:
     - Secretly give one student $300 total and a note: "Pump the HIGH share—buy aggressively to inflate its price."  
     - Market maker sets initial prices: **Bid $40 / Ask $60** for HIGH (pays $100 if die ≥4) and LOW.  

  2. **Trading (10 mins)**:
     - Manipulator buys HIGH shares, pushing prices up.  
     - Watch for:  
       - **Informed traders selling HIGH** if they think it’s overpriced (profiting from manipulation).  
       - **Herd behavior**: Others buying HIGH because "price is rising."  

  3. **Settle & Reveal (5 mins)**:
     - Roll the die publicly. If ≥4, HIGH pays $100.  
     - **Out the manipulator**: Discuss their impact. Did they lose money? Did others profit?  

  ---

  ### **Debrief (10 Mins)**  
  Map the game to futarchy and highlight limitations:  

  | **Game Moment**            | **Futarchy Concept**                 | **What Worked**                                  | **Failure Modes Observed**                     |  
  |----------------------------|--------------------------------------|--------------------------------------------------|------------------------------------------------|  
  | Round 1 trading            | Aggregating private beliefs          | Prices moved as hidden info emerged              | Thin trading/herding; some ignored private info|  
  | Round 2 vote vs. market    | Values (vote) vs. beliefs (market)   | Markets predicted votes; shares influenced voters| Prices biased voting (self-fulfilling prophecy)|  
  | Round 3 manipulation       | Market robustness to manipulation    | Some traders profited by betting against manip.  | Manipulator moved prices in thin market        |  
  | Market maker pricing       | Liquidity provision                  | Prevented zero-trading deadlocks                 | Artificially stable prices                     |  

  **Honest Limitations of the Toy Model**:  
  - **Scale/liquidity**: 18 traders can’t replicate real markets. Prices are noisy and manipulable.  
  - **Short horizons**: Real futarchy markets forecast years ahead; ours settled in minutes.  
  - **No specialization**: Real traders invest in expertise; here, everyone is an amateur.  
  - **Oversimplified causality**: Our markets had clear outcomes (dice, votes). Real policy effects are fuzzy.  

  **What You Must Assert (Not Demonstrate)**:  
  - Futarchy assumes markets are efficient at scale (thousands of traders), which you can’t show.  
  - Long-term policy markets require incentive alignment (e.g., real money), which was missing.  
  - In reality, traders specialize (e.g., climate forecasters vs. GDP experts), but here everyone trades everything.  

  ---

  ### **Troubleshooting Predictable Problems**  
  1. **Thin markets/herding**:  
     - **Patch**: Act as an **active market maker** with tight bid/ask spreads (start at $10 gaps, widen if volatile). Run **3 call auctions** per round (at 5-min intervals) where all trades clear at once—this forces price discovery. Announce: "Auction in 60 seconds—write bids/offers on slips!"  

  2. **Free-riders or non-traders**:  
     - **Patch**: Assign "roles" to reluctant traders:  
       - Round 1: Give them an info card and a **$10 "scoop reward"** if they place a trade.  
       - Round 2: Make them "campaign managers" for a movie to engage them.  
       - Round 3: If they refuse, let them be the "die roller" or "price scribe."  
     - **Prevent jokes**: Start with a "serious trading" pact—joke trades lose $10 penalties.  

  3. **Sharks dominate trading**:  
     - **Patch**: Cap trades at 5 shares/student per market. In auctions, use a **random order** for trade execution to dilute shark influence.  

  4. **Price stickiness**:  
     - **Patch**: If prices don’t move, reveal a **public "news flash"** (e.g., "Rumor: Quiz averages will be high!").  

  ---

  ### **Why This Design Works**  
  - **Private info → Aggregation**: Round 1 cards force students to trade on hidden knowledge.  
  - **Values/beliefs split**: Round 2’s vote (values) and market (beliefs) are decoupled but interact.  
  - **Manipulation = Teachable moment**: Round 3 shows how pumping affects thin markets.  
  - **Low-tech & engaging**: Physical trading and prizes keep energy high.  

  **Final Tip**: Do a **dry run** with friends to tweak timings. In the debrief, stress that this is a "futarchy parable"—not proof it works at scale. Assign a short reflection: "What would break if we scaled this to a country?"
