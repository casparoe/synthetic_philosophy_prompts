answer: |-
  Right, let's translate this anthropic machinery into sampling terms. As a survey statistician, you'll spot the analogs immediately, but also where the gears grind. Here’s the breakdown:

  **SSA and SIA in Sampling Terms**  
  - **Self-Sampling Assumption (SSA)** posits that you should reason *as if* you were a randomly selected unit from your reference class (e.g., "all conscious observers" or "humans"). The evidence is not merely "I exist" (tautological), but "a member of my reference class matching my indexical properties was sampled." This mirrors **inverse-probability weighting (IPW)**. If your "stratum" (e.g., humans born in 2020 CE) has a low selection probability (e.g., because total humans are few under a "Doom Soon" hypothesis), your existence becomes surprising—just as a rarely sampled subgroup in a survey requires heavy weighting to avoid bias. SSA treats *your specific observer-moment* as the sampled unit.  

  - **Self-Indication Assumption (SIA)** claims that hypotheses implying more observers should be upweighted proportionally to their population size. This is precisely **post-stratification based on known population totals**. If hypothesis H₁ posits 10x more observers than H₂, SIA multiplies the prior odds by 10. In sampling terms: SIA reweights hypotheses like adjusting for an oversampled stratum, but *without* the design weights—it assumes the "sample" (you) is equally likely from any *potential* observer, so larger populations get higher prior weight.  

  **Doomsday & Presumptuous Philosopher: Selection Effects?**  
  - **Doomsday Argument (SSA-based)**: This *is* ordinary selection bias reasoning. If humanity dies out after 100B total births, being born among the first 60B (say) is unsurprising—it's a high-probability stratum. If humanity survives to 100T births, being in the first 0.0001% is unlikely. SSA/IPW makes "Doom Soon" less surprising. Clean translation.  
  - **Presumptuous Philosopher (SIA-based)**: Here’s the rub. SIA says a theory predicting 10¹⁰⁰ observers (vs. 10¹⁰) is 10⁹⁰ times more likely *a priori*, even with identical data. In survey terms, this is like favoring a sampling frame *because it has more units*, regardless of design. No legitimate survey does this. Weights correct for *known* sampling probabilities—we don’t inflate a stratum’s influence because it *could have been* larger. SIA injects population size into priors in a way that feels alien to standard design-based inference.  

  **The Residue Report**  
  1. **Clean translations**:  
     - SSA ≡ IPW for observer selection.  
     - Doomsday ≡ Stratum undersampling bias (early humans are undersampled if doom is late).  
     - "Reference class" ≡ Sampling frame (e.g., "all humans" vs. "all mammals"). Ambiguities here mirror frame imperfections (inclusion errors, edge cases).  

  2. **Fudged components**:  
     - **The "unit" of sampling**: Surveys sample *respondents*; anthropics samples *observer-moments*. This introduces fractional weights and continuum problems (e.g., how to index "you" at different times?).  
     - **SIA’s prior manipulation**: Weighting by hypothetical population size isn't standard practice. In design-based inference, population size is fixed; we don’t let it warp priors. SIA feels like confounding the sampling frame with the hypothesis.  
     - **No external validation**: Surveys benchmark against population registers. Anthropics has no "ground truth" for observer totals—it’s all counterfactual.  

  3. **Reference class vs. sampling frame**:  
     The reference class problem is **worse**. Sampling frames are defined by external constraints (e.g., census data). Reference classes are subjective: Is your frame "humans," "sentient beings," or "simulated minds"? This is metaphysical, not statistical. In surveys, frame issues cause measurable bias; here, they lead to incoherent probabilities (e.g., arbitrarily changing classes shifts likelihoods).  

  **Why the Residue?**  
  The disconnect isn’t missing vocabulary—it’s substantive. Philosophers are wrestling with **self-locating uncertainty**: "Why am me *this* observer, not another?" Surveys never treat "which unit I am" as data because statisticians aren’t embedded *in* the frame. The SSA/SIA debate is really about whether to condition on indexical information ("I exist now") and how to normalize it. SSA treats it as a selection effect; SIA treats it as evidence for larger populations.  

  In essence: Anthropic reasoning *starts* as survey stats but veers into unobserved multiverses and identity uncertainty. The "fudge" arises because sampling theory assumes an external omniscient sampler, while anthropics must bootstrap from inside the sample. The philosophers’ disagreement is real—but it’s about how to handle first-person perspective in cosmology, not sampling fundamentals. Your toolkit exposes where the math is sound (IPW, stratification) and where philosophy takes over (what to weight, and why).  

  —  
  *TL;DR: SSA is IPW for your own birth stratum; SIA is poststratifying by hypothetical population sizes. Doomsday is standard selection bias; Presumptuous Philosopher is not. Reference class is a metaphysical sampling frame. Residue is due to self-locating uncertainty—a hole in conventional stats.*
