prompt: |-
  I'd like you to act as an expert in philosophy of mind and the cognitive science of selfhood — someone equally at home in the analytic metaphysics of personal identity and the more literary, Hofstadter-ish end of things. Think carefully before answering, and maybe start with a short brainstorm of what I might be getting at before committing to a structured reply.

  Some context on me: I'm a philosophy professor, but political philosophy is my patch, so this is genuinely outside my area, and I've had no luck finding the right term for the thing I keep noticing.

  My wife died about three years ago, and since then I've become obsessed with a phenomenon I don't have a name for. In the first months after her death, whenever something absurd happened at a faculty meeting, there would be a very specific sarcastic commentary in my head, in her register — about colleagues she never met, so not memories of things she actually said. It felt less like remembering her and more like some routine of hers was still running on my hardware and generating new outputs. I've also caught myself setting up jokes and then going quiet, because for thirty years of marriage she always did the punchline, and apparently my hand still sets the table for her.

  And it isn't just me. Our friends still use her likely reaction as a live input into decisions — someone vetoed a restaurant last month on the grounds that she'd have hated it, and nobody batted an eye. Her sister says she wins arguments against her by predicting her moves. My son, I'm fairly sure, runs a coarser, earlier-draft version of her, mostly the jokes she told when he was small.

  So here's the thing I want a name for: the way a person's characteristic patterns — the judging, the comic timing, the way she'd cut an argument down to size — keep being run, and even updated, on other people's brains, such that the 'I' in question isn't wholly located in one skull. To be clear, I am not asking whether she still exists simpliciter; obviously not. I'm asking whether there's an established concept for this partial, distributed persistence of a self.

  What I've been offered so far doesn't fit. A grief counsellor mentioned 'continuing bonds' — a real thing in the grief literature, I gather, but it mostly covers rituals, keeping her jumper, talking at the graveside; it's a coping frame, not a claim about where the patterns live. The Freudian internalised voice is about authority and prohibition, not a personality that generates new material. And I half remember Hofstadter, after his own wife died, suggesting that a person's 'I' gets copied, imperfectly, into the brains of the people who knew them — but I don't recall him coining a term for it, and I can't work out how literally he meant it.

  So, please: does this have an established name, in philosophy of mind, cognitive science, anywhere? If several nearby concepts exist, lay them out and tell me exactly how each differs from the thing I've described — I care about the edges. How is it different from ordinary memory? How is it different from the model of another person we all supposedly run for everyday mindreading — is my wife's case just that, with mourning on top, or is something qualitatively new once the original brain is gone? My late father's catchphrases survive in me too, and two absorbed catchphrases clearly don't amount to a distributed self, so where's the threshold? Does the copy degrade over time, the way sound degrades when you re-record a re-recording? If nothing established captures it, coin a term, define it, and give me the boundary cases. And tell me whether Hofstadter's version is meant literally or is just a lovely picture — I want the carving, not merely a label.

  One last thing: write your answer in British English, and take your time — this matters to me more than I let on above.
