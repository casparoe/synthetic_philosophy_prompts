  We just finished two weeks on material constitution in my metaphysics seminar, and I'm curious where you come down. My credence that the statue and the clay are strictly identical — one object there, full stop, no coincident entities — is about 0.25. But one of my students is at like 0.85; she thinks the whole debate is a semantic artifact, that we've confused "statue" and "clay" as words picking out different sortals with statue and clay as objects, and that once you stop mixing up language and ontology the puzzle evaporates. Give me your own number, but more importantly decompose it: the probability that sortal-relative identity ("same statue" and "same lump" can genuinely come apart) is coherent rather than just equivocation, the probability that the modal argument — the clay can survive being squashed, the statue can't, so by Leibniz's Law they differ — is actually sound as an argument for two objects rather than something a counterpart theorist or relative-identity person can absorb, whether the "one object, differently grounded" line (existence conditions are about which facts ground what, not how many things there are) is a serious way out or just reframing, and any other terms you think belong, each with a number and one line of justification. Then tell me which term you're least confident in and what argument would move it the most — and, since you have both our credences, whether my student and I actually disagree about the metaphysics or just about how to construe the question. I'll admit im not sure myself.
