prompt: |-
  so i've been going in circles on the decision theory wars for like a decade now, and before i read another thousand comments about functional decision theory, i want the spec first: what does a decision theory actually have to get right to count as solving this stuff? write me the desiderata list. obviously it has to one-box in newcomb and smoke in the smoking lesion (or does the smoking lesion version with a genuine correlation and no causal link between smoking and lesions even count against evidential decision theory? flag if that's contested). but also the weirder cases: paying up in counterfactual mugging, cooperating with your twin in the prisoner's dilemma, transparent newcomb with the box already full or empty, and the evidential blackmail case where an agent leaks info about its own source code to set up extortion. for each requirement say what it's for, which camp treats it as non-negotiable vs. a preference, and whether some subset is jointly unsatisfiable -- that's the part i actually care about, if you can't have both "never regret the decision in hindsight from inside the world" and "win against predictors," say so instead of dodging. also throw in a requirement i almost never see stated: the theory should say something sane when you're not sure whether you're currently inside the predictor's simulation of you, and shouldn't require you to know your own source code. then score causal decision theory, evidential decision theory, and functional/updateless decision theory against the list, briefly -- i mostly want the criteria, not the scorecard. table is fine.
reasoning: |-
