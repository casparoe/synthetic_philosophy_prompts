answer: |-
  Here's a desiderata list for evaluating decision theories, designed to cut through tribal debates and highlight fundamental tensions. Core conflicts center on **regret minimization vs. predictor dominance** and **knowledge requirements vs. real-world applicability**.

  ### Core Desiderata for Decision Theories
  | Test Case                     | What It Tests                                                                 | Non-Negotiable For          | Contested?                                     |
  |-------------------------------|------------------------------------------------------------------------------|----------------------------|-----------------------------------------------|
  | **Newcomb's Problem**         | Ability to exploit predictors / commit to dominance-optimal choices.         | FDT, EDT (mostly)          | CDT rejects dominance reasoning.              |
  | **Smoking Lesion**            | Distinguishing causation from correlation; avoiding self-sabotage via evidence. | CDT, FDT                   | **EDT defenders contest:** Assumes perfect correlation is impossible without causation. |
  | **Counterfactual Mugging**    | Valuing acausal influence / logical counterfactuals; paying for information. | FDT                        | CDT/EDT see no reason to pay.                 |
  | **Transparent Newcomb**       | Logical uncertainty; commitment under known outcomes.                        | FDT                        | CDT/EDT act as if choice affects box (causal/evidential). |
  | **Prisoner's Dilemma (Twin)** | Cooperative stability via mutual prediction; resisting defection traps.      | FDT                        | CDT defects; EDT cooperates iff high correlation. |
  | **Evidential Blackmail**      | Avoiding self-sabotage from source code leaks; resisting extortion.          | CDT, FDT                   | EDT pays (updates on threat as evidence).     |
  | **Simulation Uncertainty**    | Robustness under ontological uncertainty.                                   | *All* (but underspecified) | FDT struggles with "which computation am I?"  |
  | **Source Code Opacity**       | Functioning without self-knowledge.                                         | *All* (pragmatically)      | FDT often assumes self-knowledge.             |
  | **No Hindsight Regret**       | Decisions remain defensible *ex-post* (e.g., not smoking if lesion-free).    | CDT                        | FDT/EDT may regret in Smoking Lesion.         |
  | **Predictor Domination**      | Beating adversaries with superior prediction power.                          | FDT                        | CDT loses Newcomb; EDT loses Smoking Lesion.  |

  ### Key Tensions & Joint Unsatisfiability
  1. **Predictor Domination vs. No Regret (Smoking Lesion):**  
     - *Conflict:* Dominating predictors (Newcomb) requires acting on correlations *as if* causal. But in Smoking Lesion, this causes regret when you smoke but have no lesion.  
     - **Unsatifiable:** You cannot *both* dominate predictors in Newcomb *and* avoid regret in Smoking Lesion.  
     - *Tradeoff:* FDT sacrifices "no regret" for dominance. CDT sacrifices dominance for "no regret".

  2. **Acausal Cooperation vs. Causal Guarantees:**  
     - FDT cooperates in PD/Twin or pays in Mugging via logical counterfactuals, but these lack physical causal guarantees. CDT demands local causality.

  3. **Robustness vs. Optimality:**  
     - FDT's strength (handling predictors, simulations) requires precise self-knowledge. CDT works with partial knowledge but loses high-stakes games.

  ### Theory Scores (Concise)
  | Desideratum                 | CDT          | EDT          | FDT          |
  |-----------------------------|--------------|--------------|--------------|
  | Newcomb (One-Box)           | ❌ (Two-box) | ✅ (One-box) | ✅ (One-box) |
  | Smoking Lesion (Don't Smoke)| ✅           | ❌ (Smokes)  | ✅           |
  | Counterfactual Mugging (Pay)| ❌           | ❌           | ✅           |
  | Transparent Newcomb         | ❌           | ❌           | ✅           |
  | PD/Twin (Cooperate)         | ❌           | ⚠️ (Sometimes) | ✅           |
  | Evidential Blackmail (Don't Pay)| ✅       | ❌           | ✅           |
  | Simulation Uncertainty      | ✅           | ⚠️           | ❌ (Needs self-ID) |
  | Source Code Opacity         | ✅           | ✅           | ❌ (Often)   |
  | No Hindsight Regret         | ✅           | ❌           | ❌           |
  | Predictor Domination        | ❌           | ⚠️ (Partial) | ✅           |

  ### The Fundamental Tradeoff
  - **CDT:** Prioritizes *local causal guarantees* and *no regret*. Fails in predictor-rich environments.  
  - **EDT:** Prioritizes *evidence-tracking*. Self-sabotages when correlation ≠ causation.  
  - **FDT:** Prioritizes *logical counterfactuals* and *acausal control*. Wins against predictors but requires self-knowledge and accepts regret in some worlds.  

  **The Unavoidable Conflict:** You cannot simultaneously satisfy **Predictor Domination** (demanding one-boxing in Newcomb) and **No Hindsight Regret** (demanding not smoking in lesion-free worlds). Theories force a choice: optimize for *outcome* or *defensibility*. FDT chooses outcome dominance; CDT chooses defensibility; EDT inconsistently attempts both and fails both in edge cases.  

  **Simulation Uncertainty:** FDT struggles most (requires identifying "which instance of you" you are). CDT handles it best (acts on local causality). EDT updates on evidence but may overreact to simulated threats.  

  **Source Code Opacity:** FDT often assumes self-knowledge (to compute counterfactuals). CDT/EDT use general causal/evidential rules requiring no introspection.  

  ### Conclusion
  The wars persist because **no theory satisfies all desiderata**—the core tension between regret-minimization and predictor-dominance is unresolvable. Choose based on priority:  
  - **Dominate predictors?** → FDT (accept regret in some correlated failures).  
  - **Never regret?** → CDT (lose high-stakes games against superintelligences).  
  - EDT occupies an unstable middle ground, failing key tests (Smoking Lesion, Blackmail).  

  The "spec" is thus a menu: you must sacrifice *either* causal defensibility *or* acausal optimality.
