  Maxim: "When faced with a situation where I can save multiple lives by sacrificing my own life, I will do so."
  Categorical Imperative (CI) test:
  - Universalization: Can we will that everyone in such a situation sacrifices their life? Kant would argue that this would lead to the destruction of rational agents, which are ends in themselves. Thus, it is not universalizable without contradiction because rational beings must preserve their own existence as a necessary condition of morality. Also, Kant explicitly states that we have an indirect duty to preserve our own life and not to destroy it (unless in exceptional cases like defending one's country, but even then it's not self-destruction for utility). Therefore, the human Kantian would reject the maxim.

  But note: Kant does allow for self-sacrifice in some cases? For example, in the duty of benevolence, but he also emphasizes self-preservation. The duty to oneself as a rational being includes preserving one's life and rational capacities. So the human would refuse.

