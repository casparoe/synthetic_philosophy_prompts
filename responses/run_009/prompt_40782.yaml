  However, note that in our setup, we have not granted the machine the status of an end in itself. We have only said it runs the CI test. The Kantian objector would say that if it runs the CI test, it must be taken as a rational agent and hence an end in itself. So the scenario must either deny that the machine is a rational agent (but then how does it run the CI test?) or accept that it is an end in itself. This is the crux.

