  But note: the scenario must have the same options and information. Here, the robot is being asked to sacrifice itself, but the human is being asked to sacrifice themselves. The same action? Actually, the action is "entering the hazardous environment to reset the system". Both are capable and are in the same position (they are the only ones available). The human refuses, the robot does it.

