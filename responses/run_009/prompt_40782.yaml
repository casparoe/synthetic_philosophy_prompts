  Maxim: "When faced with a situation where I can save multiple lives by sacrificing my own existence, I will do so."
  CI test:
  - Universalization: If all robots (or all agents in the same position) were to do this, there is no contradiction because robots are not ends in themselves. They are tools. Therefore, the maxim can be universalized. Moreover, the robot is designed to serve human ends, so it is fulfilling its purpose. There is no duty to self-preservation for the robot because it is not an end in itself. Thus, the robot concludes it must act.

  The morally relevant difference: The human has a duty to oneself (self-preservation as a rational being) that does not apply to the machine because the machine is not an end in itself.

  What if we stipulate the machine is an end in itself?
