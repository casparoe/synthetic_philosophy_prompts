prompt: |-
  I lead a philosophy of science reading group — mostly grad students in other fields, no logic beyond a first course — and in a single forty-minute session I have to introduce the problem of verisimilitude: whether it even makes sense to say one false theory is closer to the truth than another, and if it does, how to define that. I don't want the explanation itself; I want a plan for delivering it. Please cover the following.

  First, the dependency structure: what has to be established before the problem can even look like a problem? My instinct is that they'll need to see why "all theories are false" doesn't settle the matter — why it seems obvious that a theory predicting 7 planets is better off than one predicting 100, when the truth is 8 — and then discover that this obviousness is exactly what resists formalization. Tell me what order to present the pieces in and why, including where the Miller–Tichý-style negative result belongs: I assume it must come late, but I'd like your view on whether to preview the failure early so the definitions land as attempted rescues rather than as idle machinery.

  Second, the carrying example. It should let the group compute or at least eyeball closeness for a handful of simple false statements against a known truth — a finite toy world, ideally with two or three statements that the naive definitions rank in embarrassing or contradictory ways (each of two statements coming out more verisimilar than the other, or a false statement beaten by one of its own false consequences). Tell me what the example must contain and what it must avoid — I suspect infinite or continuous domains are out, and I'd like to know if you agree.

  Third, the misconception map. The ones I anticipate: that verisimilitude is just a disguised probability or confirmation measure; that adding a true conjunct to a false statement obviously makes it closer to the truth; that the whole enterprise collapses if there is no single "whole truth" to be near; and — from the more philosophically literate — the worry that any closeness measure depends arbitrarily on the language chosen to state the theories. For each, tell me where in the sequence it is best defused rather than merely rebutted, and which ones I should let surface on their own.

  Fourth, what to refuse to do at this level: I assume the actual formal apparatus of the post-Popper literature — content measures, min-max similarity, the structuralist approaches — is beyond forty minutes for this audience. Say what to wave at with a name and what to skip entirely, so that the group leaves knowing the shape of the problem without believing they've seen the solutions.

  Finally, one question I can pose in the last five minutes whose answer would reveal whether the group has actually grasped the problem rather than the vocabulary.

  One request about your own stance: if you think the session as I've framed it can't be done well — that the negative result can't be made to bite in forty minutes without formal apparatus, or that my ordering instinct above is backwards in a way that matters — say so plainly and adjust the assignment rather than producing a plan that papers over the difficulty.
reasoning: |-
  We are designing a 40-minute session on verisimilitude for a reading group of grad students in various fields (with only a first course in logic). The goal is to introduce the problem: why it's challenging to define when one false theory is closer to the truth than another.

  Key elements to cover:

  1. **Dependency Structure**: The order of presentation to build the problem.
  2. **Carrying Example**: A finite, discrete example that is easy to compute and reveals pitfalls.
  3. **Misconception Map**: Where and how to address common misunderstandings.
  4. **Scope Limitation**: What technical details to skip and what to mention by name.
  5. **Closing Question**: A diagnostic question to check understanding.

  Let's break down each part.

  ---

  ### 1. Dependency Structure (Order of Presentation)

  **Total Time**: 40 minutes. We need to be efficient.

  **Step-by-Step Plan**:

  1. **Motivate the Problem (5 minutes)**:
     - Start with the intuitive idea: even if all theories are false (as per fallibilism), we often feel that some are better than others. 
     - Example: Truth is that there are 8 planets. Theory A says 7, Theory B says 100. Intuitively, A is closer to the truth than B.
     - Why does this matter? Because science progresses by replacing false theories with ones that are "less false". So we need a way to make sense of this.

  2. **Reveal the Challenge (5 minutes)**:
     - Ask: How can we formalize this intuition? 
     - Introduce Popper's initial idea (1960s): verisimilitude as a combination of truth and content. A theory has more verisimilitude if it entails more true statements and fewer false ones (or: more true consequences and less false ones). 
     - But then present a simple counterexample to show that this naive idea fails. This is where the Miller-Tichý result (from the 1970s) can be previewed in an informal way.

     *Why here?* Because without seeing the failure, the definitions might seem arbitrary. We want the group to feel the tension: the idea is intuitive but tricky to define.

     **Preview of the negative result**: Use a very simple example (without the formal machinery) to show that adding a true conjunct doesn't always help. For instance:

     - Truth: 8 planets (P=8).
     - Theory A: P=7 or P=8. (This is false because it allows 7, but it has the true consequence that P=8 is possible? Wait, let's reframe.)

     Actually, we need a better example. Let's use the classic one:

     - Truth: It is raining and cold. (R and C)
     - Theory 1: It is raining and not cold. (R and ~C) [false]
     - Theory 2: It is not raining and cold. (~R and C) [false]

     Which is closer to the truth? Intuitively, they are symmetric. But now consider:

     - Theory 3: It is raining. (R) [which is equivalent to (R and C) or (R and ~C)]

     According to the naive idea of counting true consequences, Theory 3 has more true consequences? But wait, it also has false ones. How do we balance?

     Actually, we can show that if we try to compare by set inclusion of true consequences, we run into problems. But we don't need to go into the full Miller-Tichý proof. Instead, we can show:

     - Truth: R and C.
     - Theory A: R and ~C. (false)
     - Theory B: ~R and C. (false)

     Now, if we try to say that A is closer because it has R (true) and misses C (false) and has an extra false (~C), while B has C (true) and misses R (false) and has an extra false (~R) ... but then how do we compare? They seem equally bad.

     But now consider adding a true conjunct: 
     - Theory A+: (R and ~C) and (R or C) [which is equivalent to R and (R or C) and ... but actually this might not help]. 

     Instead, use the classic Miller example:

     - Truth: 20°C and 760mmHg pressure (for a given time and place).
     - Theory A: 25°C and 760mmHg.
     - Theory B: 25°C and 750mmHg.

     Intuitively, A is closer because it gets the pressure right. But now, if we change the units to Fahrenheit and inches of mercury, the ordering might reverse! (This is the language dependency problem.) But we are going to cover that as a misconception. For now, we just want to show that the naive idea of counting true consequences fails because of logical relations.

     **Alternative for the negative preview**: 
     - Let the truth be a single atomic proposition: P (say, "there are 8 planets").
     - Then consider two false theories: ~P (which is false) and ~P & Q (where Q is an unrelated true statement). 
     - The naive idea might say that ~P & Q has more true consequences (it entails Q, which is true) and so it should be closer. But intuitively, adding an unrelated true fact shouldn't make a false claim about P any better. 

     This is a quick way to show that adding true conjuncts arbitrarily doesn't work.

     *Placement*: Do this right after the initial motivation and before any formal definitions. This sets up the need for a more sophisticated approach.

  3. **Attempted Rescues (10 minutes)**:
     - Briefly mention that Popper's initial definition was flawed, and then Miller and Tichý (and others) proved that under certain conditions (using the consequence-based approach) it's impossible to have a false theory that is strictly closer to the truth than another by set inclusion of true and false consequences (without getting into the details of the symmetric difference or the conditions). 
     - Then introduce the idea of alternative approaches that avoid this problem by changing the definition. We can mention:
          - **Similarity-based approaches**: Instead of looking at all consequences, look at how similar the theory's claims are to the truth in a structured way (e.g., in a metric space). 
          - **Content-based approaches**: Focus on the truth-content and falsity-content, but with a more refined measure (like the size of the sets in a model-theoretic setting).

     But we are not going into details. We are just sketching the landscape.

  4. **The Carrying Example (15 minutes)**:
     - Now we introduce a finite, discrete example to make the problem concrete and to let the group compute/eyeball closeness. This will be the centerpiece.

  5. **Misconceptions (interwoven, but some at the end)**: We'll address misconceptions as they naturally arise, but also reserve time at the end for a few minutes of Q&A to hit any remaining ones.

  6. **Wrap-up and Closing Question (5 minutes)**.

  ---

  ### 2. The Carrying Example

  We need a finite toy world. Let's create a simple one:

  **Setup**:
  - The world has exactly two objects: a and b.
  - We are interested in one property: Color. Each object can be either Red (R) or Blue (B).
  - The state of the world (the truth) is: a is Red, b is Blue. So the truth is: R(a) and B(b).

  Now consider three false theories:

  1. **Theory T1**: Both are Red. (R(a) and R(b))
  2. **Theory T2**: Both are Blue. (B(a) and B(b))
  3. **Theory T3**: a is Blue and b is Red. (B(a) and R(b)) [This is the exact opposite of the truth]

  Intuitively, T1 and T2 each get one object right and one wrong. T3 gets both wrong. So T1 and T2 should be closer to the truth than T3.

  But are T1 and T2 equally close? Intuitively, yes.

  Now, let's see what happens if we try to count the number of true consequences. But note: the set of all consequences is infinite (because we can form complex sentences). So we must avoid that.

  Instead, we can look at the atomic facts. We have two atomic facts: color of a and color of b. We can define a simple measure: the number of atomic facts the theory gets right. Then:

  - Truth: 2 correct.
  - T1: gets a right (R(a)) but b wrong (it says R(b) but truth is B(b)) -> 1 correct.
  - T2: gets a wrong (says B(a) but truth is R(a)), gets b right (B(b)) -> 1 correct.
  - T3: both wrong -> 0 correct.

  So T1 and T2 are both at 1, T3 at 0.

  But now consider:

  **Theory T4**: a is Red and b is Red, and also the moon is made of cheese. (R(a) and R(b) and M) [where M is a false statement about the moon]

  By the atomic fact measure, it still gets 1 atomic fact right (a is Red) and one wrong (b is Blue vs Red). But it also has an extra false statement (M). Intuitively, T4 is worse than T1 because it adds a falsehood. So we want to penalize extra false claims.

  But then how? We might think of the ratio of true to false atomic claims? But T1 has two atomic claims: one true, one false -> 1/2. T4 has three atomic claims: one true (R(a)), two false (R(b) and M) -> 1/3. So T4 is worse. But note: M is not about our domain. So we must restrict to the domain of discourse? This is getting messy.

  Alternatively, we can stick to the two atomic facts and ignore M. But then T4 is equivalent to T1? But that seems wrong because T4 is making an extra false claim.

  This reveals that we must be careful about what we consider (the language, the domain). This leads to the language dependency problem.

  **Another issue**: What if we have a theory that gets both objects wrong but in a way that is "closer" in some other sense? In our setup, the properties are categorical. But what if we had a continuous property? We avoid that by design.

  **Problem we want to show**: 
  - The naive definition (counting true atomic facts) works for T1, T2, T3. 
  - But now consider:

  **Theory T5**: a is Red. (only R(a)) [so it doesn't say anything about b]

  This theory is true about a and silent about b. How do we compare? Intuitively, it is true about one thing and doesn't say anything about the other. So it has no falsehood about b. Is it better than T1 (which says something false about b) or worse?

  - T5 has one true atomic fact and no false atomic fact (about the domain we are considering). T1 has one true and one false. So T5 might be better? But then T5 is a consequence of the truth (since the truth entails R(a)), so it is true but incomplete. But we are comparing false theories. Wait, T5 is not false? It is true but incomplete? 

  We need to be careful. The truth is R(a) and B(b). T5 is R(a) (and doesn't say anything about b). So T5 is true? Because it doesn't assert anything false? But in a bivalent setting, if we interpret the absence of an assertion as not claiming the opposite, then T5 is true. We want false theories.

  So let's define our theories as complete assignments? Then T5 is not allowed. We require that each theory assigns a color to both objects. Then T5 is not in the running.

  Alternatively, we might allow partial theories, but then we have to define verisimilitude for them. That complicates things. So we avoid partial theories in this example.

  **What we must avoid**: 
  - Infinite domains or continuous properties (to keep it finite and discrete).
  - Partial theories (to keep it simple) unless we are ready to handle the complications (but we aren't in 40 minutes).

  **What the example must contain**:
  - A finite set of atomic propositions (or states of the world).
  - The truth: one specific state.
  - A set of theories (each being a complete assignment, i.e., a state description) that are false.
  - At least two theories that are symmetric (like T1 and T2) so that we expect them to be equally close.
  - One theory that is clearly worse (T3).
  - Then introduce a theory that adds an irrelevant false statement (like T4) to show that we must restrict the domain of discourse or face the problem of extraneous falsehoods.

  **How to run it**:
  - Present the world and the truth.
  - Present T1, T2, T3. Ask the group: which are closer? (They'll say T1 and T2 are better than T3 and equally good.)
  - Then ask: how can we measure? They might suggest counting the number of correct atomic facts. That works for T1, T2, T3.
  - Then present T4: same as T1 but with an extra irrelevant false statement. How does it compare to T1? They'll likely say T4 is worse. Then how do we incorporate that? We see that if we count all atomic facts (including irrelevant ones) we get a lower score for T4. But what if we have a theory that adds a true irrelevant statement? Then it would have a higher score? But that might be problematic (as in the earlier negative preview). This leads to the idea that the measure might depend on the language (what we consider relevant).

  ---

  ### 3. Misconception Map

  We address each misconception at the appropriate moment:

  1. **Verisimilitude is just a disguised probability or confirmation measure**:
     - This might come up when we discuss measuring by the number of true atomic facts. We can note that probability is about uncertainty, while verisimilitude is about how close a definite false theory is to the truth. We can defuse this when we show the negative result: probability might be high for a very incomplete theory (like T5) but that theory is true, not false. For false theories, we want to capture both truth and falsity. We can mention that a high probability theory might be one that is very weak (and hence has a high chance of being true) but if it is false, it might be very far from the truth. So they are different concepts. Address this when we compare T1 (which is strong and false) and T5 (which is weak and true) if T5 comes up.

  2. **Adding a true conjunct to a false statement obviously makes it closer to the truth**:
     - We already defused this in the negative preview: with the example of adding an irrelevant true conjunct. We showed that adding a true conjunct about an unrelated matter doesn't help. We can reinforce with the example: 
          - Let the truth be P (say, there are 8 planets). 
          - Theory A: ~P (false)
          - Theory B: ~P and Q (where Q is true but unrelated, e.g., "grass is green")
     - Then Theory B has the same false claim about P but an extra true claim. But intuitively, it isn't any closer to the truth about the planets. So we see that the conjunct must be relevant. But then how to define relevance? That's hard. This is why the naive idea fails.

  3. **The whole enterprise collapses if there is no single "whole truth" to be near**:
     - This is more of a metaphysical worry. We can note that we are assuming there is a truth (even if we don't know it) for the sake of the problem. This assumption is common in the literature. We can address this at the end if it comes up, by saying that the problem is set within a realist framework. If we are anti-realists, then verisimilitude might not make sense. But that is a separate debate.

  4. **Language dependency**:
     - This is a deep problem. We can show it with the example of temperature and pressure. 
          - Truth: 20°C and 760 mmHg.
          - Theory A: 25°C and 760 mmHg.
          - Theory B: 25°C and 750 mmHg.
     - In metric units, we might compute the Euclidean distance: 
          - A: (25-20)^2 = 25 for temp, 0 for pressure -> sqrt(25)=5.
          - B: (25-20)^2=25 and (750-760)^2=100 -> sqrt(125)≈11.2. So A is closer.
     - Now convert to Fahrenheit and inches of mercury:
          - 20°C = 68°F, 760 mmHg ≈ 29.92 inHg.
          - A: 25°C = 77°F, 760 mmHg = 29.92 inHg.
          - B: 25°C=77°F, 750 mmHg ≈ 29.53 inHg.
     - Now compute:
          - A: (77-68)^2 = 81, (29.92-29.92)^2=0 -> sqrt(81)=9.
          - B: (77-68)^2=81, (29.53-29.92)^2≈0.1521 -> sqrt(81.1521)≈9.008.
     - Now B is slightly closer! 
     - So the ordering changed because of the change of units. This shows that the measure depends on the choice of language (or scale). 
     - We can present this when we discuss the challenges after the carrying example. This is a major negative result (due to Miller) and we can mention that it shows how hard the problem is.

  **When to address**:
  - The adding a true conjunct: during the negative preview (early).
  - Language dependency: after the carrying example, when we show how the measure might depend on what we consider (like in T4) and then with the units example.
  - Probability confusion: when we compare a strong false theory and a weak true one (if it comes up) or when we discuss the difference between verisimilitude and confirmation.
  - The "whole truth" worry: at the end, if raised, or note that we are assuming a definite truth.

  ---

  ### 4. What to Skip

  - **Formal apparatus of the literature**:
     - Skip the details of Popper's original definition and the Miller-Tichý proof (just state the negative result informally).
     - Skip the content measures (like the one by Schurz and Weingartner) that try to avoid the Miller-Tichý result by restricting to relevant consequences. Just mention that there are approaches that try to fix the consequence-based approach by selecting only the "relevant" consequences, but that this is controversial.
     - Skip the min-max similarity (like in the symmetric difference of possible worlds) and the structuralist approaches (like Sneed, Stegmüller). Just say that there are other approaches that use the idea of similarity between models or structures.
     - Skip the recent developments (like the work on truthlikeness for quantitative theories using average distance).

  - **What to mention by name**:
     - Popper: started the discussion but his definition was flawed.
     - Miller and Tichý: showed that Popper's definition doesn't work and that under certain conditions it's hard to define with consequences.
     - Mention that there are alternative approaches (similarity-based, content-based with refinements) but we won't go into them.

  The goal: the group should leave knowing that the problem is non-trivial, that the intuitive idea is hard to formalize without running into paradoxes or language dependency, and that there are ongoing research programs trying to solve it.

  ---

  ### 5. Closing Question

  Pose a question that requires them to apply the core challenge:

  **Question**: 
  "Suppose we have a true theory T (say, the full truth about our two-object world). Now consider two false theories: 
     - U: which says everything exactly as T except it gets one atomic fact wrong (like T1 in our example). 
     - V: which is a very weak theory that only says one true atomic fact (like R(a)) and nothing else (so it's incomplete but true? but wait, we want false theories). 

  Wait, V is true? We need false theories. So let me adjust:

     - U: as before (T1: R(a) and R(b) in the truth R(a), B(b)).
     - W: which says R(a) and that there are exactly 100 planets in the solar system. (So it gets one atomic fact right and one wrong in our domain, plus an extra false claim about planets.)

  How would you compare U and W in terms of verisimilitude? What challenges arise in trying to define a measure that captures your intuition?"

  **Why this question?** 
  - It tests if they understand that we are comparing false theories.
  - It forces them to consider both the truth-content and falsity-content (U has one true and one false in the domain, W has one true and one false in the domain plus an extra false outside). 
  - They must recognize that W has an extra falsehood, which might make it worse, but then how to account for that? 
  - Also, it raises the issue of the domain of discourse (what is relevant) and language dependency.

  Alternatively, to keep it within the domain:

  "Consider a new theory in our two-object world:
     - Theory T6: a is Blue and b is Blue. (B(a) and B(b)) [which is T2]
     - Theory T7: a is Blue and b is Red. (B(a) and R(b)) [which is T3]

  We said T2 (T6) has one correct, T3 (T7) has none. But now consider:
     - Theory T8: a is Blue and b is Blue and a is Red. (B(a) and B(b) and R(a)) [contradictory]

  How would you compare T8 to T6 and T7? What does this say about the role of consistency and the challenge of defining verisimilitude?"

  But this might be too much. The first question is better.

  **Revised Closing Question**:

  "In our two-object world (truth: R(a), B(b)), consider:
     - Theory U: R(a) and R(b)   [gets one right, one wrong]
     - Theory W: R(a) and [some false statement about an unrelated domain, e.g., the moon is made of cheese]

  Intuitively, is W closer to, farther from, or equally close to the truth as U? Why? What problems arise if we try to formalize this intuition?"

  Then let them discuss briefly. The answer should reveal if they see that W has the same truth/falsity in the relevant domain but an extra falsehood, and that we must decide what counts as part of the theory's content and what language we are using.

  ---

  ### Adjustments for Time

  Given 40 minutes:

  - 5 min: Motivation and intuitive examples (the 7 vs 100 planets).
  - 5 min: Negative preview (adding a true conjunct doesn't always help; show with an example and then state that Popper's definition failed and Miller-Tichý proved a general negative result).
  - 15 min: The carrying example (two-object world) and computation for T1, T2, T3. Then introduce T4 (with extra false) and discuss. Then show the units example for language dependency.
  - 10 min: Discuss the challenges (language dependency, the need for a measure) and mention alternative approaches by name without details. Weave in misconceptions as they arise.
  - 5 min: Closing question and wrap-up.

  If the group is quick, we might spend more time on the example and less on the negative preview. But the negative preview is critical to set up the problem.

  **Note**: The negative result (Miller-Tichý) is usually presented for theories that are comparable in content. We skip the formal details and just say: "It turns out that if we try to define verisimilitude by comparing the sets of true and false consequences, we run into a problem: in many cases, one false theory cannot be strictly closer than another because the sets get entangled in a way that prevents a clean ordering. In fact, Miller and Tichý showed that under Popper's original definition, no false theory can have more verisimilitude than another in a wide class of cases."

  This is a bit vague, but for a 40-minute session, it's enough.

  ---

  **Final Plan**:

  1. **Motivation (5 min)**: 
     - Science progresses by replacing false theories with better ones. 
     - Example: 7 planets vs 100 when truth is 8. 
     - But how to define "better" (closer to truth)?

  2. **Negative Preview (5 min)**:
     - Popper's idea: more true consequences, fewer false ones.
     - Counterexample: 
          - Truth: P (e.g., 8 planets)
          - Theory A: ~P
          - Theory B: ~P and Q (Q true but unrelated, e.g., grass is green)
     - Intuition: B isn't closer about the planets. So adding a true conjunct doesn't automatically make it closer.
     - Result: Popper's definition failed, and Miller-Tichý showed a general problem.

  3. **Carrying Example (15 min)**:
     - Present the two-object world (truth: R(a), B(b)).
     - Theories T1 (R(a), R(b)), T2 (B(a), B(b)), T3 (B(a), R(b)).
     - Intuitive ranking: T1 and T2 are better than T3.
     - Measure: number of correct atomic facts -> T1:1, T2:1, T3:0.
     - Now T4: T1 plus an extra false statement (about the moon). How to compare? 
          - If we count all atomic facts (including the moon one) then T4 gets 1 out of 3 (if we have three atomic facts: color of a, color of b, moon composition) -> 1/3, while T1 gets 1/2 -> so T4 is worse. 
          - But what if we don't care about the moon? Then we might ignore it. But then how do we define the domain?
     - Then show the units example (temperature and pressure) to illustrate language dependency.

  4. **Challenges and Misconceptions (10 min)**:
     - Weave in:
          - Not probability: verisimilitude is for false theories.
          - Adding true conjuncts: only helps if relevant, but relevance is hard.
          - Language dependency: the units example shows it's arbitrary.
          - The whole truth: we assume it exists for this discussion.
     - Mention that there are alternative approaches (similarity-based, refined content-based) but they have their own challenges.

  5. **Closing Question (5 min)**:
     - Present U (T1) and W (R(a) and false moon statement). 
     - Ask: How would you compare? What challenges arise?
     - Let them discuss briefly and then wrap up: "This is the problem of verisimilitude: easy to intuit, hard to define without running into these issues. It remains an open area of research."

  ---

  **If time runs short**: Cut the carrying example to 10 minutes by not introducing T4 until the closing question. Or cut the units example and just mention language dependency.

  This plan should work in 40 minutes if we stay focused.
answer: |-
  Below is a carefully structured plan for your 40-minute session on verisimilitude. It respects your constraints (no heavy formalism, finite examples, misconceptions defused naturally) and leverages your intuition that the negative result should land late but be foreshadowed early. The plan is feasible in 40 minutes if strictly timed—**no substantial cuts are needed**, but I'll note pacing risks.  

  ---

  ### **1. Dependency Structure & Order of Presentation** (Total: 12 min)  
  **Why this order?** To mirror the dialectic of the problem: intuitive appeal → failed formalization → why it’s hard. The Miller-Tichý result comes late as a "knockout punch," but its inevitability is hinted early.  

  | Time | Step                                                                 | Why/Purpose                                                                                                |
  |------|----------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------|
  | 2 min | **Hook with intuition**: Use your 7 vs. 100 planets example (truth: 8). Ask: *“Is 7 ‘closer’ to 8 than 100? Why?”* Elicit intuitions (e.g., “7 is only off by 1; 100 by 92”). | Establishes the core intuition. Shows why “all theories are false” doesn’t resolve progress in science.    |
  | 3 min | **Reveal the trap**: Pose: *“So is a theory with one error better than one with many? What if we add a true fact?”* Give a **negative preview**: <br>- Theory A: “7 planets” (false).<br>- Theory B: “7 planets AND grass is green” (false, but adds truth).<br>Ask: *“Is B closer to the truth than A?”* Most will say no—defusing “adding true conjuncts” misconception early. | Creates tension: intuitions break on formalization. Sets up why definitions (next) are rescue attempts, not idle machinery. |
  | 4 min | **Popper’s flawed rescue**: Explain his 1963 idea: Verisimilitude = True consequences ↑, False consequences ↓. Use planets: <br>- Truth: 8 planets → entails “Planets ≤ 8,” “Planets ≥ 8,” etc.<br>- Theory A (7 planets) entails some truths (e.g., “Planets ≤ 7”) but falsehoods (e.g., “¬8 planets”).<br>- Theory B (100 planets) entails fewer truths, more falsehoods. | Shows a plausible definition. Students see how it captures their intuition (A > B). |
  | 3 min | **Foreshadow failure**: Ask: *“What if two theories have *mixed* true/false consequences? Can we always compare them?”* Hint at asymmetry (e.g., A may have truths B lacks, but B has truths A lacks). No math—plant doubt. | Prepares for Miller-Tichý. Avoids technicalities but signals definitions may be unstable. |

  ---

  ### **2. The Carrying Example** (Total: 15 min)  
  **Why this?** A finite, discrete, 3-object world. Students compute "closeness" with naive definitions, exposing contradictions.  

  #### **World Setup** (3 min)  
  - **Domain**: 3 boxes (A, B, C).  
  - **Truth**: Contents are {A: Apple, B: Banana, C: Cherry}.  
  - **False theories**:  
    - T1: {A: Apple, B: Apple, C: Cherry}  
    - T2: {A: Apple, B: Banana, C: Apple}  
    - T3: {A: Pear, B: Banana, C: Cherry} *(Pear is false)*  
    - T4: {A: Apple, B: Banana, C: Cherry} **but adds** “The moon is cheese” (false).  

  #### **Activity & Pitfalls** (12 min)  
  - **Step 1**: Ask groups to rank T1–T3 by “closeness to truth” intuitively. *Consensus: T3 > T1/T2? (T3 gets 2/3 right; T1/T2 get 2/3 wrong).*  
  - **Step 2**: **Naive Definition 1**: *Count correct atomic facts.*  
    - T1: 2 right (A, C), 1 wrong (B).  
    - T2: 2 right (A, B), 1 wrong (C).  
    - T3: 2 right (B, C), 1 wrong (A).  
    → All equal? Contradicts intuition (T3 feels better—only one *wrong* fact, while T1/T2 have one *right*).  
  - **Step 3**: **Naive Definition 2**: *Minimize errors.* Same result. Now introduce T4:  
    - Same as truth on boxes, but adds false moon claim.  
    - Ask: *“Is T4 closer than T1?”* Intuition says no, but definitions may force “yes” if we count truths (T4 has 3 atomic truths + 1 falsehood; T1 has 2 truths + 1 falsehood).  
  - **Step 4**: **Reveal contradiction**: *“T4 seems worse, but has more truths. T3 seems best, but ties with T1/T2. What’s broken?”*  

  #### **What to Avoid**  
  - ✅ **Finite/discrete**: 3 objects, finite properties (fruits).  
  - ✅ **Pitfalls covered**: T1/T2 tie (asymmetric errors), T4 exposes irrelevant truths, T3 shows “wrongness” ≠ “distance.”  
  - ❌ **No continuous/infinite metrics**: Avoid distances (e.g., “apple vs. pear”). Use exact matches.  

  ---

  ### **3. Misconception Map**  
  Defuse these *during* relevant steps—**not rebutted late**.  

  | Misconception | When Defused | How |
  |---------------|--------------|-----|
  | **“Adding true conjuncts ↑ verisimilitude”** | Early (negative preview) | Theory B (7 planets + grass) vs. A (7 planets). Students *feel* irrelevance. |
  | **“Verisimilitude ≈ probability”** | During carrying example | When ranking T3 vs. T1: T3 has higher “accuracy” but same errors. Note: Probability rewards caution (e.g., “some fruit”), but verisimilitude penalizes *false precision*. |
  | **“No ‘whole truth’ → problem collapses”** | During Popper’s rescue | When explaining truth’s consequence set: *“We assume a complete truth for this problem—like a fixed scientific reality. Anti-realists reject this, but that’s another talk.”* |
  | **“Language dependence”** | After carrying example | Use T4: *“If we include ‘moon is cheese,’ T4 wins. If not, it ties. But who chooses the language?”* Link to Miller’s metrology example late. |

  ---

  ### **4. What to Skip** (Formal Apparatus)  
  **Maximize problem-shaping, minimize machinery.**  

  | Do                                                                          | Don’t                                                                 |
  |-----------------------------------------------------------------------------|-----------------------------------------------------------------------|
  | **Name-drop Popper** (content parts) and **Miller-Tichý** (1974 negative result). | **Skip** Popper’s/content measure formulas.                          |
  | **Mention** similarity-based fixes (e.g., “distance between models”).       | **Skip** min-max metrics, weighted feature spaces.                   |
  | **Note** structuralist/refined-content approaches exist.                    | **Skip** Schurz-Weingartner relevance criteria, average likeness.    |
  | **State outcome**: Miller-Tichý proved *no* consequence-based definition avoids contradictions under basic logic. | **Skip** the proof (e.g., symmetric difference of consequence sets). |

  **Goal**: Group leaves knowing:  
  - Verisimilitude is intuitive but formalizable only with tradeoffs.  
  - Core paradoxes (irrelevant truths, asymmetric errors, language dependence).  
  - Major approaches exist (similarity, content) but all face challenges.  

  ---

  ### **5. Closing Question** (Last 5 min)  
  **Pose**: *“Suppose two false theories:  
  - Theory X: ‘Box A has an Apple’ (true) but says nothing else.  
  - Theory Y: ‘Box A has a Pear’ (false), ‘Box B has a Banana’ (true), ‘Box C has a Cherry’ (true).  
  Which is closer to the truth? Why might your answer break a formal definition?”*  

  **Why it works**:  
  - Tests grasp of **partial vs. complete theories** (X is incomplete but has no falsehoods; Y is fully specified but has one error).  
  - Exposes **content/completeness tension**: Naive definitions favor Y (more truths), but X avoids falsehoods—echoing Popper’s unsolved problem.  
  - If they spot language dependence (Y’s truths vs. X’s silence) or confusion with probability, they’ve understood the crux.  

  ---

  ### **Your Request: Feasibility & Adjustments**  
  **Honest stance**: This plan **works** for 40 min *if* you:  
  - **Strictly time** each phase (e.g., 12/15/8/5 min).  
  - **Avoid deep dives** into formalisms (definitions are hand-waved; focus on intuitions).  
  - **Let misconceptions surface** naturally (e.g., during group work in the carrying example).  

  **Only adjustment**: I moved the **Miller-Tichý result** to the end (after carrying example) for maximum impact, but **heavily foreshadowed** it. This ensures:  
  - Definitions (Popper) aren’t seen as idle—they’re *attempted* rescues.  
  - The negative result lands as the “punchline,” explaining why the field is messy.  

  **If time runs short**:  
  - Trim Popper explanation (3 min → 2 min).  
  - Skip T4 in carrying example (use only T1–T3).  
  - Make closing question rhetorical.  

  **Why it doesn’t “paper over” difficulty**: The carrying example and negative preview make the problem tangible without formalism. Miller-Tichý’s gist (no consistent ordering) is clear from contradictions in the example.  

  ---  
  **Final Flow**:  
  1. Hook & negative preview (5 min)  
  2. Popper’s rescue & foreshadowing (4 min)  
  3. Carrying example (15 min)  
  4. Miller-Tichý + misconceptions (8 min)  
  5. Closing question (5 min)  
  6. Wrap: “Verisimilitude: easy to want, hard to define. Solutions? We’ll read Popper next week.”
