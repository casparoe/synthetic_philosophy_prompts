prompt: |-
  Quick context: I'm a bioinformatics PhD student, and somehow I've become the designated words person in my lab. Anything public facing -- the group blog, press release drafts, the text for the university open day, slides for donor visits -- gets sent to me to check the metaphors, ever since a release about our CRISPR work said we 'rewrote the genetic code' and a philosopher from across campus wrote a very long email to the dean about it. So this is maybe twice a month, low stakes individually but embarrassing if it goes wrong, and the PI has final sign-off but she's busy and will basically rubber-stamp whatever I mark up.

  The recurring problem is the whole information/code family: DNA as a code, as a language, a blueprint, an instruction manual; genes 'telling' cells what to do; 'editing' and 'find and replace'; 'junk' DNA. Some of these seem harmless and some get us in trouble, but the current decision procedure is vibes. I want an actual procedure I can run in fifteen minutes on a piece of text: questions to ask in order, what counts as a pass, and at what point I stop and flag the sentence for the PI because it's a values call (e.g. how much precision we're willing to trade for a headline) rather than a factual one. Ground it in what philosophy of biology and information theory actually say -- Shannon information vs. whatever semantic information is supposed to be, the fact that the genetic code proper is a mapping between codons and amino acids and maybe that's the only place 'code' is strictly earned, whether calling something a code smuggles in a coder, the frozen accident point about arbitrariness. Be honest about which distinctions I can drop in public-facing writing and which are load-bearing.

  Then run it on three sentences: (1) The genetic code translates DNA sequences into proteins. (2) Our approach lets us rewrite the genetic code to correct disease-causing typos. (3) Junk DNA turns out to carry hidden messages. And fair warning, if the procedure tells me to cut the find-and-replace framing, I want to know why that one's special since its the one journalists love. Finally, tell me where the procedure misfires -- cases it passes that will still annoy somebody, or ones it fails that are actually fine.
reasoning: |-
  We are creating a decision procedure for evaluating the use of information-theoretic and code-based metaphors in public-facing biological texts. The procedure should be grounded in philosophy of biology and information theory, and should be executable in about 15 minutes per piece of text.

  Key considerations from philosophy of biology and information theory:

  1. **The Genetic Code Proper**: The term "genetic code" strictly refers to the mapping between nucleotide triplets (codons) and amino acids (or stop signals). This mapping is arbitrary (a "frozen accident", as coined by Crick) and thus has the key feature of a code: arbitrariness. Therefore, using "code" in this context is uncontroversial.

  2. **Shannon Information vs. Semantic Information**: 
     - Shannon information is about the amount of information (in bits) that can be transmitted, without regard to meaning.
     - Semantic information is about meaning and intentionality. 
     Biology deals with molecular structures and processes that are not intentional. However, through evolution, there is a sense in which DNA sequences have been selected for function, which can be seen as a naturalized form of meaning (teleosemantics). But note: this is still a philosophical debate.

  3. **Metaphors that Smuggle in a Coder**: Using terms like "code", "language", "blueprint", "instruction manual", "message", etc., can imply an intelligent designer. This is particularly sensitive in the context of public communication because of the creationism debate. However, in the scientific community, these terms are used as metaphors without implying design.

  4. **Junk DNA**: The term "junk DNA" was coined for non-coding DNA with no known function. However, the ENCODE project controversy showed that labeling non-coding DNA as "junk" might be premature and that some of it has regulatory functions. Calling it "junk" can be seen as dismissive and inaccurate. The term is still used but with caution.

  5. **Editing Metaphors**: Terms like "edit", "rewrite", "find and replace" are common in CRISPR contexts. They are useful because they are intuitive. However, they can be criticized for oversimplifying the complex molecular processes and for implying intentionality (like a human editor). But note: these metaphors are so entrenched that they are hard to avoid.

  6. **Blueprints vs. Recipes**: 
     - A blueprint implies a one-to-one mapping between plan and product. But DNA is not a blueprint for the organism; it's more like a recipe. The same gene can be used in multiple contexts, and development is interactive with the environment.

  Procedure:

  We design a flowchart of questions to ask about each metaphor occurrence. We'll break the text into sentences and identify problematic terms: "code", "language", "blueprint", "instruction manual", "tells", "edit", "rewrite", "find and replace", "junk", "message", etc.

  For each occurrence:

  1. **Is it about the genetic code proper?** (i.e., the codon-to-amino-acid mapping)
     - If yes: allow. This is the one place where "code" is strictly accurate.
     - If no: proceed.

  2. **Is the term "code" used in a broader context?**
     - If yes: note that this is a metaphor. Check if the context implies an intelligent coder? (e.g., words like "designed", "intended", "purposeful" nearby). If so, flag for revision to remove the implication. Otherwise, it may be acceptable as a conventional metaphor, but be aware that some philosophers (like the one who complained) might object. In public communication, it's often unavoidable. Proceed to step 3.

  3. **Is the term "blueprint" or "instruction manual"?**
     - These are more problematic than "code" because they imply a direct representation of the whole organism. Consider replacing with "recipe" or "set of instructions" (without the manual metaphor) if possible. However, in public communication, "blueprint" is very common. We might allow it if the context is not emphasizing development. If it is, flag as potentially misleading.

  4. **Is the term "edit", "rewrite", "find and replace"?**
     - These are very useful and common. They are acceptable as long as they are not implying that the process is as simple as text editing. If the text is for a general audience, it's probably fine. For a more critical audience (e.g., an academic blog), we might want to add a note about the complexity. But in the interest of time, we might allow these without flagging unless they are accompanied by overstatements (e.g., "perfectly edits" or "without errors").

  5. **Is the term "junk" DNA?**
     - Avoid if possible. Use "non-coding DNA" or "regions with unknown function". If the term is used, check if it is in quotes and if the context explains that the term is controversial. If not, flag to replace.

  6. **Is the term "message", "language", "tells"?**
     - These imply semantic content and communication. They are metaphorical and might imply intentionality. In public communication, they are common. We might allow if the context doesn't overstate (e.g., "genes tell the cell to make a protein" is common). But if it's about "hidden messages" in junk DNA, that might overstate the case.

  Additionally, for any metaphor:

  - Consider the audience: For a press release, some simplification is expected. For an open day with mixed audiences, be cautious of creationism implications.
  - Check for overstatement: Does the metaphor make the science sound more precise, straightforward, or intentional than it is? If so, flag.

  Finally, if a metaphor is borderline, and changing it would make the text unclear or less engaging for the public, we might let it pass but note that it's a values call for the PI.

  Now, run the procedure on the three sentences:

  Sentence 1: "The genetic code translates DNA sequences into proteins."

  - Step 1: "genetic code" - this is the proper term for the codon mapping. However, note: the genetic code doesn't translate DNA sequences into proteins; it is the mapping that the translation machinery uses. The sentence is a bit loose because it's the cellular machinery that does the translating using the code. 
    - But in common parlance, this is accepted. The problem is that it might be seen as reifying the code as an agent. 
    - However, in the context of public communication, this is very standard. We might let it pass.

    But note: the genetic code is about the mapping, not the process. A more precise version: "The genetic code is used by the cell to translate DNA sequences into proteins." However, the original is concise and common.

    Verdict: Pass (because "genetic code" is proper and the metaphor is minimal).

  Sentence 2: "Our approach lets us rewrite the genetic code to correct disease-causing typos."

  - Step 1: "genetic code" - here it's used in the proper sense? Actually, in CRISPR, we are editing the DNA sequence, not changing the mapping of the genetic code (which is universal). Changing the genetic code would mean changing which codon maps to which amino acid in an organism. But that's not what typical CRISPR gene editing does. Typical CRISPR edits the DNA sequence, which is then translated according to the standard genetic code.

    So this is a misstatement. We are rewriting the DNA sequence, not the genetic code. The "typos" are mutations in the DNA sequence.

    Also, "rewrite" and "typos" are editing metaphors. They are acceptable if we are editing the DNA. But the misuse of "genetic code" is the problem.

    Therefore, flag for revision: change "rewrite the genetic code" to "rewrite the DNA sequence" or "edit the gene".

    Also, note: "typos" is a metaphor for mutations. It's common and probably acceptable.

    Verdict: Flag for revision. This is a factual error, not just a metaphor issue.

  Sentence 3: "Junk DNA turns out to carry hidden messages."

  - Step 5: "Junk DNA" - avoid. Use a different term.
  - "Hidden messages": This implies intentionality and semantic content. It is an overstatement. Non-coding DNA may have regulatory functions, but they are not "messages" in the semantic sense.

    Verdict: Flag for revision. Suggest: "Non-coding DNA, once thought to be 'junk', turns out to have important regulatory functions." Avoid the "hidden messages" metaphor.

  Now, about the "find-and-replace" framing: Why might we cut it? The procedure would flag it only if it's overstating the simplicity or accuracy. But in general, it's a useful metaphor. The reason we might cut it is if the context is one where precision is paramount (e.g., a philosophy of science audience) or if the text makes it sound like it's as easy as Ctrl+F. But for a press release, it's probably fine. So in the procedure, we allow it with a caution about overstatement.

  Where the procedure misfires:

  - Cases it passes that annoy somebody: 
    - Using "code" in a broader sense (e.g., "the DNA code") might still annoy a philosopher who insists that only the codon mapping is the code. But we let it pass because it's conventional.
    - Using "edit" metaphors might annoy someone who thinks it trivializes the complexity. But we allow it for public communication.

  - Cases it fails that are actually fine:
    - In a context where the audience is very familiar with the metaphors (e.g., a blog for scientists), we might be too strict. But the procedure is for public-facing texts, so we err on the side of caution.

  Final Procedure Steps:

  For each sentence with a metaphor:

  1. Identify the metaphor term.

  2. If the term is "genetic code":
     - Check if it refers to the codon-amino acid mapping. If yes, pass.
     - If it is used to refer to the DNA sequence (e.g., "the plant's genetic code"), then it's a misnomer. Flag.

  3. If the term is "code" alone (without "genetic") and refers to DNA/genes:
     - Note that it's a metaphor. Check for words implying a coder. If found, flag. Otherwise, for public communication, pass (with a note that it's conventional but not strictly accurate).

  4. If the term is "blueprint" or "instruction manual":
     - Consider replacing with "recipe" or "set of instructions". If the text is for a general audience and the metaphor is not central, you might pass. But if the text is about development, flag as misleading.

  5. If the term is "edit", "rewrite", "find and replace":
     - Check for overstatement (e.g., "perfectly", "flawlessly", "easily"). If present, flag. Otherwise, pass.

  6. If the term is "junk" DNA:
     - Flag to replace with "non-coding DNA" or "DNA of unknown function", unless it's in quotes and the context explains the controversy.

  7. If the term is "message", "language", "tells":
     - Check if it's a common and accepted usage (e.g., "the gene tells the cell to make a protein"). If so, pass. But if it's about non-coding DNA having "hidden messages", flag as overstatement.

  In any case, if the metaphor is central to the piece and changing it would ruin the flow, but it's borderline, flag for PI as a values call.

  This procedure should take about 15 minutes per piece by focusing on the identified keywords and running through these checks.
answer: |-
  ### Decision Procedure for Evaluating Information/Code Metaphors in Biology Texts

  Below is a step-by-step procedure grounded in philosophy of biology and information theory. It focuses on **factual accuracy**, **unintentional implications** (e.g., implying a "coder"), and **overstatement**. Aim for clarity in public-facing texts while acknowledging that some metaphors are unavoidable. The procedure prioritizes critical issues first. If a metaphor passes all checks, it's likely safe; if it fails any, revise or flag for the PI. 

  #### Key Grounding from Philosophy/Theory:
  1. **Genetic Code Proper**: Only the codon-to-amino-acid mapping is a true "code" (arbitrary, convention-based, per Crick's "frozen accident"). Broader uses of "code" imply semantic intent.
  2. **Shannon vs. Semantic Information**: 
     - **Shannon information**: Measures data quantity (e.g., DNA base pairs). Harmless for describing data storage.
     - **Semantic information**: Implies meaning/purpose (e.g., "messages" in DNA). Risky—biology has no "intent"; function emerges from evolution.
  3. **Coder Smuggling**: Metaphors like "language" or "blueprint" subtly imply a designer. Avoid unless clarified (e.g., "evolutionarily shaped").
  4. **Junk DNA**: Contentious term. ENCODE showed regulatory functions, but "junk" isn't wholly invalid—it denotes non-conserved, non-functional regions. Use with caution.
  5. **Load-Bearing Distinctions**:
     - **Keep**: "Genetic code" (strict sense), "editing" (if qualified).
     - **Drop**: "Blueprint" (replace with "recipe" or "template"), over-anthropomorphism ("tells").
     - **Context-Dependent**: "Code" broadly, "junk DNA."

  ---

  ### The 15-Minute Procedure:
  For each sentence containing a metaphor from the "information/code" family:
  1. **Identify the metaphor(s)** (e.g., "code," "language," "edit," "junk").
  2. **Run through these questions in order**:
     - **Q1: Is it factually inaccurate?**  
       *Check:* Misusing technical terms (e.g., "genetic code" when you mean "DNA sequence").  
       *Fail if:* Yes. **Revise immediately.** (Precision is non-negotiable.)  
       *Pass to Q2 if:* No.  
       *Grounding:* The genetic code is solely the codon mapping. Using it for DNA sequences misrepresents molecular biology.  
       *Public-facing trade-off:* None—fix errors.  

     - **Q2: Does it imply a coder or intentionality?**  
       *Check:* Words like "rewrite," "message," or "blueprint" without evolutionary context (e.g., missing "evolutionarily shaped" or "functionally").  
       *Fail if:* Yes. **Revise to remove implication** (e.g., replace "rewrite" with "modify").  
       *Pass to Q3 if:* No, or if mitigated (e.g., "editing via natural processes").  
       *Grounding:* Metaphors like "language" or "instruction manual" risk creationist misinterpretation. Philosophy of biology (e.g., Godfrey-Smith) stresses avoiding agential language.  
       *Public-facing trade-off:* Acceptable if qualified (e.g., for engagement), but flag if unmitigated.  

     - **Q3: Is it an overstatement of biological complexity?**  
       *Check:* Does it oversimplify? (e.g., "find and replace" ignores CRISPR's error-proneness; "hidden messages" exaggerates regulatory function).  
       *Fail if:* Yes. **Add nuance or hedge** (e.g., "targeted modification" instead of "find and replace").  
       *Pass to Q4 if:* No, or if audience needs simplicity (e.g., donors).  
       *Grounding:* Information theory (Shannon) separates data from meaning. DNA has Shannon information but not "messages"—function is context-dependent.  
       *Public-facing trade-off:* Allow mild overstatement for accessibility, but flag if it misleads (e.g., promising "precision" without caveats).  

     - **Q4: Is the term controversial or outdated?**  
       *Check:* E.g., "junk DNA" (debated since ENCODE), "code" beyond codon mapping.  
       *Fail if:* Yes and no context given. **Add nuance** (e.g., "so-called 'junk DNA'").  
       *Pass if:* No, or if audience won’t misconstrue (e.g., scientists).  
       *Grounding:* "Junk DNA" is valid for non-conserved regions (Graur 2017), but philosophers (e.g., Doolittle) critique it as dismissive.  
       *Public-facing trade-off:* Use sparingly with scare quotes.  

     - **Q5: Is it essential for clarity/engagement?**  
       *Check:* If revising weakens impact (e.g., replacing "find and replace" with "targeted homology-directed repair").  
       *Flag for PI if:* Yes. **Values call needed** (engagement vs. precision).  
       *Pass if:* Not essential.  

  #### Output Decision:
  - **Pass**: If it clears Q1–Q4 and Q5 isn’t triggered.  
  - **Revise**: If it fails Q1–Q4.  
  - **Flag for PI**: If Q5 is triggered (values call).  

  ---

  ### Test the Procedure on Your Sentences:
  **Sentence 1:**  
  *"The genetic code translates DNA sequences into proteins."*  
  - Q1: **Fail.** Factual error—the *ribosome* translates mRNA using the genetic code. DNA isn’t "translated"; it’s transcribed to mRNA first.  
  - **Action:** Revise to: *"The genetic code guides the translation of nucleotide sequences into proteins."*  
  - *Why?* Precision is load-bearing. The public can handle "nucleotide sequences" (or "gene sequences").  

  **Sentence 2:**  
  *"Our approach lets us rewrite the genetic code to correct disease-causing typos."*  
  - Q1: **Fail.** "Genetic code" misused—you’re editing DNA sequences, not changing codon mappings (e.g., making UGG encode serine instead of tryptophan).  
  - Q2: **Fail.** "Rewrite" and "typos" imply intentionality (a "correct" version exists).  
  - Q3: **Fail.** "Typos" overstates—mutations aren’t errors but natural variations.  
  - **Action:** Revise to: *"Our approach edits DNA sequences to correct disease-associated mutations."*  
  - *Why "find and replace" is special*: Journalists love it because it’s intuitive, but it fails Q2/Q3 by implying a simple, error-free process (CRISPR isn’t word processing!). Use only if adding caveats: *"like a targeted 'find and replace'—though real-world editing is complex and imperfect."*  

  **Sentence 3:**  
  *"Junk DNA turns out to carry hidden messages."*  
  - Q2: **Fail.** "Hidden messages" implies intentionality (a "sender").  
  - Q3: **Fail.** Overstatement—regulatory elements aren’t "messages"; they’re functional motifs.  
  - Q4: **Fail.** "Junk DNA" is contentious without context.  
  - **Action:** Revise to: *"Non-coding DNA regions, once called 'junk,' contain functional elements that regulate genes."*  

  ---

  ### Where the Procedure Misfires:
  - **False Passes (Will annoy somebody):**  
    - Using "code" broadly (e.g., *"cracking the DNA code"*) passes Q2 if no coder is implied, but philosophers like Sarkar argue it still smuggles semantics.  
    - "Editing" passes Q2 if qualified, but critics (e.g., NIH bioethicists) may say it downplays off-target effects.  
    *Mitigation:* Add a glossary footnote for contentious terms.  

  - **False Fails (Actually fine):**  
    - "Blueprint" in a donor slide (fails Q2/Q3) might be acceptable if the PI prioritizes engagement. The procedure flags it, but the PI may overrule.  
    - "Instruction manual" for a high-school open day (fails Q2) is likely fine—audience needs simplicity. Flag for PI, but expect approval.  

  ### Final Tips:
  - **Time-Saver**: Use text-search for keywords (code, language, edit, junk, blueprint).  
  - **PI Flagging**: Reserve for high-stakes texts (e.g., press releases) or when engagement trumps precision.  
  - **Philosophy Citations for Context**:  
    - Shannon information vs. semantics: Floridi (2010).  
    - Genetic code as "frozen accident": Crick (1968).  
    - Critique of metaphors: Griffiths (2001), *"Genetic Information: A Metaphor in Search of a Theory."*  

  This procedure balances accuracy and accessibility. Most edits take <5 minutes per sentence once internalized. Remember: Your goal isn’t to please every philosopher—it’s to avoid landmines while keeping science engaging.
