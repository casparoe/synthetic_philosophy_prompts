prompt: |-
  For about three years now I've been on the updateless side of the acausal-decision-theory dispute: I think the right policy in the counterfactual mugging is to hand over the £100 when the coin shows tails, and the right policy in XOR blackmail is to bin the letter, and I take it as a real point in favour of the functional/updateless family that it returns both verdicts at once, where causal decision theory keeps the money in the mugging and evidential decision theory pays the blackmailer. What would count against this view? I don't want only the familiar objections — that updatelessness means ignoring evidence, or that in the actual world the coin has already come down tails and the £100 is simply gone — I want the strongest cases, ranked from fatal to merely awkward: which constructed scenarios, formal results, or general arguments should move me; what the theory's own defenders would concede as genuine damage rather than dismiss by redefining what counts as the same algorithm or the right logical counterfactual; and whether the position has been insulated into unfalsifiability, and whether that would be a problem for a view of this kind, given that decision theories are tested mainly against intuitions about cases. Two things I would particularly like addressed. First, a suspicion of mine: both showcase cases were constructed by the theory's advocates, and each looks reverse-engineered from a verdict they already wanted — how heavily should this gerrymandering worry weigh against a theory whose data are intuitions about cases? Second, scale: as cheap, accurate simulations of individual people become common, does the updateless line ever become practical advice — for instance, ought I to behave today as a good ancestor to the copies of me that future systems may run, treating my present choices as evidence those copies will act on — or does acausal reasoning cash out only in parlour demonstrations, and if so is that a defeater or merely a limitation in scope? Please write your answer in British English.
reasoning: |-
  Okay, the user is deeply engaged with decision theory, specifically the updateless/functional approach versus causal and evidential decision theories. They've held this view for three years, favoring how it handles counterfactual mugging and XOR blackmail. They want strong counterarguments beyond the usual objections, ranked by severity. 

  First, I need to acknowledge their sophistication—they're clearly well-versed in the literature, mentioning "gerrymandered" cases and simulation ethics. Their suspicion about showcase cases being reverse-engineered is astute. I should tackle that head-on: yes, the examples are curated, but the deeper issue is whether any decision theory can avoid similar cherry-picking. 

  The "fatal" tier must hit hard. The simulation argument feels strongest—if updatelessness demands we optimize for all possible simulated copies, it collapses into fanatical altruism. That's not just impractical; it's paralyzing. Next, anthropic capture reveals how updateless agents might self-sabotage to benefit alternate versions—anti-survivalist and deeply counterintuitive.  

  For "awkward" points, the computational overhead critique matters because updatelessness requires solving impossible logical counterfactuals. Even advocates like MIRI admit this. And the "gerrymandering" worry? Valid, but not unique—all theories lean on intuitions. The real test is coherence across cases.  

  Their simulation ethics question is provocative. If we take updatelessness seriously today, should we act as "ancestors" to future sims? I think yes—but cautiously. The theory might advise modest sacrifices for sim welfare, not total self-effacement. Still, this feels less like advice and more like a constraint on rationality proofs.  

  Lastly, unfalsifiability: updatelessness can always tweak logical counterfactuals to dodge bullets. That's troubling, but maybe acceptable if the goal is formal elegance over empirical testability. Still, it risks becoming "not even wrong."  

  The user seems open to having their view challenged—they asked for "fatal" flaws, after all. I’ll balance rigor with respect for their expertise, using British English as requested ("maths", "programmes", etc.). No flattery; just steelmanning the opposition.
answer: |-
  Right, let's put updateless decision theory (UDT) and its functionalist/acausal cousins through the wringer. You're right to seek objections beyond the standard "ignoring evidence" or "the coin is already flipped" – those are often talking past the point. Here’s a ranking of challenges, from potentially fatal to merely awkward, addressing your specific concerns:

  **I. Potentially Fatal Objections (Existential Threats to UDT as Prescriptive Rationality):**

  1.  **The Fanaticism Problem (Simulation Ethics & Scale Gone Mad):**
      *   **The Case:** As you allude to with simulations, UDT's core logic demands optimizing over *all* logically possible instances of your decision algorithm, weighted by their complexity/salience. If cheap, high-fidelity simulations of "you" (or sufficiently similar decision processes) become widespread, UDT dictates that *your present actions should be primarily determined by their consequences for the vast multitudes of simulated copies*. Sacrificing your entire life savings, health, or even life *now* could be "rational" if it benefits a sufficiently large number of future simulated instances.
      *   **Why Fatal?** This isn't just impractical; it eviscerates the concept of self-interest and localized agency that underpins most intuitive notions of rationality. UDT transforms into a demand for fanatical altruism towards possible future or abstract logical entities. The "ancestor" framing becomes terrifying: your sole purpose is to optimise for copies you'll never interact with or even know exist. This contradicts the basic drive for self-preservation and flourishing that motivates seeking a decision theory in the first place. Advocates might try to tweak the "weighting" of instances, but the core logic inexorably pulls in this direction. If UDT implies *this* is rational, many will reject UDT.

  2.  **Anthropic Capture & Self-Sacrifice Puzzles:**
      *   **The Case:** Combine UDT with anthropic reasoning. Consider a scenario where a superintelligence will create many copies of you iff a certain low-probability event (detectable only probabilistically) occurred *before* you were born. Discovering strong evidence *against* this event having occurred logically implies there are *fewer* copies of "you". UDT, caring about the aggregate welfare of all algorithm instances, might then dictate actions that *harm* your present, actual self (e.g., donating all your wealth to charity, undergoing painful but useless procedures) because the *expected* number of beneficiaries (the copies that only exist if the event happened) is large *conditional on the evidence you see being rare in the worlds where copies exist*. You sacrifice your actual existence to benefit merely possible, more numerous versions.
      *   **Why Fatal?** This demonstrates a profound anti-realist, anti-individualist consequence. UDT can demand actions *known* to be catastrophic for the *actual, current instance* of the decision-maker based purely on optimising for counterfactual or abstractly defined "copies". It prioritises the logical structure of agency over the concrete, embodied experience of it. This feels less like rationality and more like a metaphysical suicide pact for the benefit of logical ghosts. Defenders might argue this is the "correct" logical conclusion, but it starkly highlights how UDT severs the link between rational choice and the welfare of the *agent making the choice right now*.

  **II. Serious Structural Weaknesses (Damaging but Perhaps Patchable):**

  3.  **The Logical Omniscience & Computational Intractability Problem:**
      *   **The Argument:** UDT requires the agent to reason flawlessly about the logical consequences of *all* possible outputs of their algorithm across *all* possible worlds where it or similar algorithms are instantiated. This demands logical omniscience – knowing all mathematical truths and the outputs of all possible computations. No physically realisable agent, human or AI, possesses this.
      *   **Why Damaging?** It renders UDT fundamentally unimplementable by any real-world agent. While it might serve as a Platonic ideal, its prescriptions are literally unknowable. Advocates (e.g., MIRI researchers) concede this heavily, framing UDT as a *target* for bounded agents to approximate. However, the lack of a clear, robust theory of *how* to approximate UDT effectively (without collapsing back into something like causal reasoning with pre-commitments in many cases) severely limits its practical and prescriptive force. It risks being a beautiful theory of rational ghosts, not rational beings.

  4.  **Vagueness of "Similar Algorithms" & Counterfactual Dependency:**
      *   **The Problem:** UDT's verdicts critically depend on defining the set of "instances" or "similar algorithms" whose expected utility you're summing over, and specifying the precise logical/counterfactual dependency between your choice and the outcomes affecting those other instances (e.g., how does Omega predict your Tails decision in the Mugging? How does the blackmailer know you binned the letter?).
      *   **Why Damaging?** The theory provides no unique, objective way to define "similarity" or the counterfactual dependence structure. Different choices lead to different, sometimes contradictory prescriptions. While CDT and EDT also have counterfactual issues, UDT makes these foundational and much harder to pin down. An advocate might define similarity narrowly to get the "right" answer in the Mugging and Blackmail, but an opponent can define it slightly differently to make UDT behave pathologically in a new scenario. This inherent vagueness makes UDT flexible but also potentially unfalsifiable *by design* – undesirable outcomes can often be explained away by redefining the relevant algorithm class or counterfactuals.

  **III. Awkward Challenges & Scope Limitations (Weighing Against, But Not Fatal):**

  5.  **The "Gerrymandering" Worry (Your First Point):**
      *   **The Weight:** This carries significant weight, precisely because decision theory relies heavily on intuitive judgments about cases. If the primary evidence for UDT is its elegant handling of two complex, highly stylised scenarios *designed* by its proponents to showcase its superiority, scepticism is warranted. Are these cases robust tests, or cleverly constructed Rorschach blots where UDT sees the intended pattern?
      *   **Mitigation & Rebuttal:** Proponents argue:
          *   The cases weren't *just* designed for UDT; they were designed to *break* CDT and EDT, exposing deep flaws in the *prevailing* theories. UDT emerged as a coherent alternative that resolved these specific pathologies *and* offered a unifying framework.
          *   UDT *predicts* verdicts in these cases that feel surprisingly correct to many (paying on Tails, binning the letter), whereas CDT/EDT feel obviously wrong.
          *   Finding *any* decision theory that handles *all* intuitive cases perfectly is impossible; the question is which has the broadest coherence. UDT handles Newcomb, the Mugging, Blackmail, and some other puzzles (e.g., absent-minded driver) under one umbrella.
      *   **Conclusion:** It's a valid concern demanding scrutiny of *new* cases not crafted by advocates. However, UDT's ability to resolve known, severe pathologies in established theories gives it significant credence, mitigating the worry that it's *only* reverse-engineered.

  6.  **Practical Scope & "Parlour Demonstrations" (Your Second Point):**
      *   **The Reality:** Pure, large-scale acausal trade between vastly different agents or across simulations remains highly speculative. The coordination problems (knowing *who* is running *what* algorithm, establishing reliable logical dependencies) are immense. The computational demands are prohibitive (Objection 3).
      *   **Does Scale Make it Practical Advice?** **Yes, but modestly and speculatively.** UDT *does* suggest:
          *   **Ancestral Guidance:** You *should* consider how your actions today establish precedents, reputation, or observable behaviour that future systems (or even future humans) might use to predict/simulate "agents like you". Behaving as a "good ancestor" *could* incentivise beneficial treatment of your potential future instances/sims. This might mean modest sacrifices for credibility or establishing desirable norms.
          *   **Pre-commitment & Consistency:** The *spirit* of UDT – acting based on the optimal *policy* rather than myopically updating away benefits in counterfactual branches – strongly validates the importance of pre-commitment mechanisms and consistent, predictable behaviour in strategic interactions, even causally isolated ones where others can model you.
      *   **Is it a Defeater?** **No, but a Limitation.** It doesn't defeat the core theoretical claims in the idealized scenarios. It simply confines the most dramatic acausal implications (like fanatical simulation altruism) to domains that are either impractical or ethically unacceptable. UDT remains highly relevant for:
          *   *Formalizing Rationality:* As a benchmark for bounded agents.
          *   *AI Safety:* Reasoning about highly capable AIs that might model each other logically.
          *   *Philosophical Coherence:* Understanding the deep structure of rational choice under logical uncertainty and acausal influence.
          *   *Specific, Bounded Coordination:* Situations with clear, known logical dependencies between similar agents (e.g., specific program coordination problems).

  **Unfalsifiability?**

  *   **The Risk:** Yes, there's a risk. By tweaking the definition of "the algorithm," the weightings of possible worlds/instances, or the counterfactual dependency structure, proponents can often adjust UDT to avoid counter-intuitive results in new scenarios. The inherent vagueness (Objection 4) facilitates this.
  *   **Is it a Problem?** For a normative theory based on intuitions, it's a **significant weakness**. While some flexibility is needed, unfalsifiability undermines its claim to provide *objective* prescriptions. It risks becoming an elaborate just-so story. However:
      *   Its core *motivations* (resolving clear pathologies in CDT/EDT) and its *explanatory power* within its intended domain (logical counterfactuals, acausal influence) provide anchors.
      *   The truly fatal objections (1 & 2) arise from taking the theory *seriously and consistently* in broader contexts, not just tweaking it to avoid minor awkwardness. These show where its core logic *must* lead if followed rigorously.

  **In Conclusion:**

  Your updateless view is coherent and resolves genuine, serious flaws in CDT and EDT. However, its strongest challenges lie in the extreme, counter-intuitive, and potentially self-destructive demands it makes when applied consistently to anthropic scenarios and a future filled with simulations (**Fanaticism, Anthropic Capture**). Its **computational intractability** and **vagueness** are significant practical and theoretical hurdles. The **gerrymandering worry** is valid but mitigated by UDT's success in resolving known pathologies. While large-scale pure acausal trade remains largely theoretical, UDT *does* offer relevant, if modest, guidance for **long-term thinking and pre-commitment** in an age of potential simulation. The **unfalsifiability risk** is real and awkward, but the theory truly stumbles when its own logic leads to prescriptions that violate the fundamental purpose of seeking rationality: the flourishing of the agent *here and now*. If you can't stomach rational suicide for the sake of logical copies, UDT's foundations require serious qualification or reconsideration.
