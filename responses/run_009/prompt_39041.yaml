answer: |-
  ### Thought Experiment: The Outbreak Triage

  **Setting:**  
  A rural clinic during a severe outbreak of a hemorrhagic fever. Ten patients are in critical condition, with no time for transfers or additional resources. Without intervention, all will die within hours. The medical team has two options:  

  - **Option 1 (Safe):** Use a limited stock of Drug A, which is certain to save 6 patients but requires all doses to be administered at once. The other 4 patients receive no treatment and die.  
  - **Option 2 (Gamble):** Use an experimental antiviral Drug B on all 10 patients. Clinical data shows it has a 50% chance of curing all 10 patients and a 50% chance of failing entirely (killing all 10).  

  **Expected Values:**  
  - Option 1: 6 lives saved (certain).  
  - Option 2: 50% × 10 + 50% × 0 = 5 lives saved (expected).  

  ---

  ### Analysis of Recommendations  
  **1. Expected-Value Fanatic’s View:**  
  - The fanatic maximizes unbounded expected value. Option 1 saves 6 lives for sure, while Option 2 saves 5 in expectation.  
  - Since 6 > 5, the fanatic **chooses Option 1 (Safe)**. No risk aversion or other factors distort this calculus—it is pure expectation.  

  **2. Fairness-Oriented Opponent’s View:**  
  - This opponent holds that each person has a claim to a "fair chance" when life/death is distributed. Arbitrarily denying any chance to some individuals is unjust, even if it maximizes expected value.  
  - **Option 1 (Safe)**: Deliberately excludes 4 patients from *any* chance of survival (0% probability). This violates fairness—it sacrifices identifiable individuals without giving them a shot.  
  - **Option 2 (Gamble)**: Gives all 10 patients an equal, positive chance (50% each). Though riskier, it respects fairness by not excluding anyone.  
  - Thus, the opponent **chooses Option 2 (Gamble)**. This follows solely from the fairness principle—not risk-seeking, desperation, or probability-weighting.  

  ---

  ### Key Feature Doing the Work  
  The critical feature is the **arbitrary exclusion of identifiable individuals from any chance of survival** in Option 1. The safe option deliberately sacrifices specific people (the 4 untreated) by granting them 0% probability of living, while the gamble grants everyone an equal, non-zero chance.  

  **Effect of Removing This Feature:**  
  If Option 1 were modified to give all 10 patients a 60% chance of survival (e.g., via a partial-dose protocol), the expected value would still be 6 (10 × 0.6), but the exclusion would vanish. The fanatic would still prefer Option 1 (6 > 5), but the fairness opponent would no longer object—everyone gets a fair, positive chance. The disagreement collapses.  

  **How a Fairness Defender Attacks the Case:**  
  A fairness advocate would argue:  
  - The fanatic ignores the moral weight of *who* dies. Sacrificing specific individuals without a chance (as in Option 1) treats them as mere statistics.  
  - Option 2, despite its lower expectation, respects personhood by giving all an equal stake. The 1-life EV gap is trivial compared to the injustice of exclusion.  
  - If the fanatic insists on Option 1, they reduce persons to numbers—a fundamental moral error.  

  ---

  ### Conclusion  
  This case isolates fairness about *persons* (not probabilities) as the core anti-fanaticism issue. The fanatic’s calculus is blind to distributional injustice, while the opponent prioritizes it. The reversal occurs because the "safe" option here creates identifiable, excluded losers—a fairness violation the gamble avoids.  

  \answer{arbitrary exclusion from survival chance}
