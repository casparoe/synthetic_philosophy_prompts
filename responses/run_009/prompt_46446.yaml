  For the convergent case, that might relate to functional equivalence or standardization. For the divergent case, it could involve critical junctures or branching paths. Terms like lock-in, network effects, and increasing returns are part of path dependence but might not fully capture the distinction the user is making.

  I should check if there's a specific term for each role. The convergent scenario resembles "multiple equilibria" where different paths lead to similar outcomes. The divergent one might be "historical contingency" where small events cause large, irreversible differences. Paul David's QWERTY example shows path dependence with lock-in, while Brian Arthur's work on increasing returns might cover both aspects.

  The user also asks if we can tell, after the fact, which role an early event played. That's tricky because history isn't repeatable. Counterfactual analysis is used but is inherently speculative. Some scholars like James Mahoney discuss critical junctures as points where structural constraints are loosened, allowing small actions to have big impacts.

  Since no single term perfectly fits both roles under one umbrella, I'll consider if "path dependence" is still the best fit. It broadly covers both scenarios. The convergent case could be seen as "weak" path dependence with eventual convergence, while the divergent is "strong" with persistent differences. The user's need for a term that includes both roles points to path dependence as the established concept.

