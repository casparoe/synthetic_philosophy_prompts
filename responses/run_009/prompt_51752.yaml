prompt: |-
  I'm a PhD student in political philosophy writing a chapter on comparative approaches to the regulation of sex work, and I keep hitting a structural question I can't resolve with my existing vocabulary. Since 1999, Sweden has criminalised the purchase of sex while leaving its sale legal, an asymmetry since adopted by Norway, France, Northern Ireland and others. Yet the same legal system treats the seller as a full legal agent nearly everywhere else: the tax authorities treat income from prostitution as taxable income in the ordinary way, and procuring offences criminalise third parties who facilitate or profit from the trade. So the criminal law seems to presuppose that the seller lacks whatever agency would make their participation in the transaction culpable, while the tax authorities presuppose exactly that agency; and the procuring laws seem to presuppose that the transaction is wrongful in a way that implicates everyone connected to it except one of its two participants. What I'd like is a reconstruction of the implicit theory: what view of moral agency, consent or exploitation does this pattern presuppose, if any? Is it that consent to sex for payment is not valid consent to the relevant wrong, that culpability tracks who is doing the using rather than who is participating, or something else again? Please distinguish what the asymmetry strictly presupposes from what it merely fits well with, tell me where the practice is philosophically underdetermined such that several rival theories of the seller's agency would license the same legal outcome, and explain what would have to change in the doctrine if the presupposed view were replaced by the picture the German licensing regime appears to act on, where sex work is a regulated trade and both parties are ordinary contracting agents. I'd also be grateful if you would write in British English throughout.
reasoning: |-
  Okay, the user is a PhD student in political philosophy working on a chapter about regulating sex work. They're struggling with the structural inconsistency in the Swedish model, where buying sex is criminalized but selling it isn't. The tax authorities treat sellers as agents, while criminal law treats them as lacking agency in the transaction. The user wants to understand the implicit theory behind this asymmetry.

  First, I need to unpack the core tension they've identified. The criminal law sees the seller as a victim without culpability, but tax law treats them as a rational economic agent. Procuring laws add another layer by criminalizing third parties, implying the transaction itself is harmful. The user is asking for the philosophical underpinnings of this approach.

  Looking at the Swedish model's justification, the key is the asymmetry in culpability. Buyers exploit vulnerability, while sellers are seen as victims of circumstances. But how does this reconcile with tax obligations? The state might separate moral culpability from legal personhood. Sellers have the capacity to engage in contracts for tax purposes but are not blamed for the exploitative nature of the transaction. 

  The user also wants to know where the law is underdetermined. For instance, different theories of agency could lead to the same legal outcome. Structural theorists might see sellers as victims of patriarchy, while liberal feminists could focus on constrained choices without denying all agency. Both views support decriminalizing sellers but differ on why. 

  Then there's the comparison with the German model. If Sweden adopted Germany's approach, treating sex work as a service, both parties would be contractual agents. This would require decriminalizing buyers and regulating third parties differently. The shift would imply a rejection of the inherent harm narrative in the Nordic model. 

  The user's deeper need might be to articulate a coherent philosophical framework that explains these contradictions. They might be looking to critique the Nordic model's inconsistencies or explore how different theories justify various regulatory approaches. I should clarify the presuppositions versus what's merely compatible, as they requested. 

  Also, using British English terms like "criminalise" and "authorities" is important. Need to ensure all spelling and terminology align with that. 

  Breaking down each element: criminal law's presupposition of non-culpability due to exploitation, tax law's presupposition of minimal agency for obligations, and procuring laws viewing the transaction as inherently harmful. The reconciliation lies in separating different legal contexts, but the philosophical tension remains. 

  Highlighting underdetermined areas where multiple theories can lead to the same legal structure will show the user where their analysis can delve deeper. Comparing with the German model will illustrate how foundational assumptions shape regulatory frameworks. This should provide the user with the tools to structurally analyse the inconsistencies and philosophical bases they're grappling with.
answer: |-
  Here’s a reconstruction of the implicit theory underpinning the Nordic model’s asymmetrical criminalisation, addressing your core questions about agency, consent, and exploitation while distinguishing presuppositions from compatibilities:

  ### Core Presuppositions of the Asymmetry
  1. **Moral Agency & Culpability Asymmetry**:  
     The law strictly presupposes that **culpability rests solely with the buyer**, who is deemed the *active exploiter*. The seller is cast as the *passive victim* of exploitation, irrespective of subjective consent. This implies:  
     - **Buyers exercise harmful agency**: Their act perpetuates gender inequality, commodifies intimacy, and exploits vulnerability.  
     - **Sellers lack culpable agency**: Their participation is compelled by structural factors (poverty, coercion, marginalisation), voiding moral responsibility.  

  2. **Invalid Consent Framework**:  
     The asymmetry presupposes that **consent to sex-for-payment is inherently vitiated**. Even if formally given, consent is rendered invalid by:  
     - **Structural coercion**: Economic/patriarchal forces negate genuine voluntariness.  
     - **Inherent degradation**: The act is intrinsically harmful, making consent irrelevant to moral/legal permissibility (akin to consent in duress scenarios).  

  3. **Transaction as Unidirectional Harm**:  
     Procuring laws (criminalising third parties) presuppose that **the sex trade itself is a social harm**, implicating all who sustain it. The seller’s exemption flows from their status as the *object* of harm, not a perpetuator.  

  ### What the Asymmetry Merely Fits With (Compatible Theories)
  - **Radical Feminist Views**: Sex work *is* violence against women; sellers are survivors.  
  - **Structural Oppression Theories**: Sellers lack meaningful choice under capitalism/patriarchy.  
  - **Paternalism**: The state protects sellers from "false consciousness" about their exploitation.  
  *These theories align with but are not strictly required by the law’s structure.*

  ### Philosophical Underdetermination  
  The legal outcome **does not specify** which theory of agency explains the seller’s non-culpability. These rival views could all justify decriminalising sellers:  
  1. **Total Non-Agency**: Seller as wholly coerced victim (radical structuralism).  
  2. **Constrained Agency**: Seller exercises choice within oppressive systems, but responsibility is negated by injustice (liberal feminism).  
  3. **Moral Innocence**: Seller possesses agency but commits no wrong; harm originates solely from the buyer (Kantian non-commodification).  
  *The law’s silence on this allows political compromise between these positions.*

  ### Tension with Tax Law  
  The tax treatment presupposes **minimal rational agency** for economic obligations, creating dissonance with criminal law’s victim narrative. This is reconciled through:  
  - **Compartmentalisation**: Tax law abstracts individuals as legal persons; criminal law engages with contextual moral status.  
  - **Pragmatism**: Revenue collection operates independently of moral evaluation.  
  *This reveals a doctrinal contradiction: the state simultaneously denies agency (criminal law) and presupposes it (tax law).*

  ### Contrast with the German Model  
  The German regime treats sex work as a **service trade** between consenting agents. Adopting this would necessitate:  
  1. **Decriminalising Buyers**: Accepting their role as legitimate consumers.  
  2. **Reconceptualising Consent**: Valid if freely given (e.g., no coercion/fraud), rejecting inherent vitiation.  
  3. **Regulating Third Parties**: Licensing brothels/agencies as facilitators, not exploiters.  
  4. **Tax Alignment**: Sellers become ordinary sole traders, eliminating the agency contradiction.  

  ### Philosophical Shift Required  
  Moving to the German model would reject the Nordic **harm-inherentism**, replacing it with:  
  - **Liberal Contractualism**: Sex work is a voluntary exchange; wrongfulness arises only from specific harms (trafficking, exploitation).  
  - **Symmetrical Agency**: Both parties possess moral/legal standing; regulation focuses on mitigating risks, not moral condemnation.  
  - **Neutrality**: The state regulates for safety, not to enforce a particular view of sexual ethics.  

  ### Structural Implications of Model Change  
  | **Doctrinal Element**       | **Nordic Model Presuppositions**          | **German Model Requirements**               |  
  |-----------------------------|------------------------------------------|---------------------------------------------|  
  | **Criminal Liability**      | Buyer = perpetrator; Seller = victim     | Liability based on specific harms (e.g., coercion) |  
  | **Third-Party Status**      | Facilitators = exploiters (criminal)     | Facilitators = regulated service providers  |  
  | **Consent Framework**       | Payment voids consent to sex             | Consent valid absent coercion/fraud         |  
  | **Agency in Tax Law**       | Contradictory (victim vs. rational agent) | Harmonised (seller as independent earner)   |  

  ### Conclusion
  The Nordic model structurally presupposes that **payment nullifies consent and transforms sex into an act of buyer-perpetrated harm**, reducing the seller to a non-culpable object of exploitation. Its coherence relies on separating criminal culpability (requiring moral innocence) from civil obligations (requiring minimal agency). Rival theories of the seller’s *degree* of agency are underdetermined by the law itself. Adopting a German-style framework would demand abandoning the core view of sex work as intrinsically exploitative, instead treating both parties as potential agents within a regulated market—resolving the agency contradiction but clashing with the Nordic model’s foundational norm of sexual non-commodification. This tension reveals how legal structures encode contested philosophical ontologies of agency in contested markets.
