  ### Which Species Concept Are You?  
  Answer each scenario based on your gut reaction—no biology degree required!  

  **Question 1**  
  Bdelloid rotifers are microscopic animals that haven’t had sex in 30 million years. Yet they look similar and thrive in the same ponds. Are they one species?  
  A. **Yes**—they’re near-identical and live the same way.  
  B. **No**—without interbreeding, they can’t form a "real" species.  
  C. **Debatable**—they’re a continuous lineage, even without sex.  

  **Question 2**  
  In a ring species like Arctic gulls, neighboring populations interbreed, but the two ends of the ring (e.g., in Europe vs. Alaska) won’t. Are the end groups separate species?  
  A. **Yes**—they can’t interbreed when they meet.  
  B. **No**—they’re connected through the ring, so they’re one species.  
  C. **It’s fuzzy**—the ring shows evolution in action; labels won’t help.  

  **Question 3**  
  Two bird groups interbreed freely where their ranges overlap. Yet they always differ in plumage and genetics—field guides list them separately. Are they two species?  
  A. **No**—if they interbreed freely, they’re one species.  
  B. **Yes**—they’re consistently distinct; biology doesn’t lie!  
  C. **Yes**—they likely occupy different ecological niches.  

  **Question 4**  
  Fossils show *Homo erectus* gradually becoming *Homo sapiens*. Each generation bred with the next, but early and late forms couldn’t interbreed. When did one species "end"?  
  A. **Draw a line**—pick a point where traits change enough to call them distinct.  
  B. **Never**—it’s one evolving lineage; "species" labels mislead.  
  C. **Depends**—use different concepts for fossils vs. living things.  

  **Question 5**  
  Bacteria swap genes with distant relatives, not just offspring. How should we define their "species"?  
  A. By **shared ecological roles** (e.g., what they eat).  
  B. By **gene-swapping groups**—if they trade DNA, they’re related.  
  C. **Don’t bother**—"species" is a human invention; bacteria defy boxes.  

  **Question 6**  
  An endangered wolf population mixes with coyotes, creating hybrids. Should we protect them under wolf conservation laws?  
  A. **Yes**—they’re still part of the wolf lineage.  
  B. **Only if they act like wolves** (e.g., hunt large prey, form packs).  
  C. **No**—they’re genetically diluted; focus on "pure" wolves.  

  **Question 7**  
  Two insect groups look identical and interbreed, but one eats oak leaves, the other only pine needles. Are they one species?  
  A. **Yes**—they interbreed and look the same.  
  B. **No**—their diets define them as ecologically distinct.  
  C. **Not yet**—they’re diverging but still connected.  

  **Question 8**  
  Scientists discover a fossil sequence: Species A slowly becomes Species B over 1 million years. Every intermediate fossil looks "in between." How many species are there?  
  A. **Two**—A and B are clearly different.  
  B. **One**—it’s a single, evolving lineage.  
  C. **Arbitrary**—split wherever it’s useful for research.  

