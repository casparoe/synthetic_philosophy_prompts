   2. Ring species (like the gull complex)
   3. Bird populations that interbreed but are consistently different (and recognized as separate species in field guides)
   4. Fossil lineage puzzle (gradual change in Homo)
   5. Bacteria trading genes horizontally
   6. Conservation law: wolf population mixing with coyotes

