prompt: |-
  I'm on the post-incident review panel at a regional power cooperative (a utility, ~400k customers). Back in January two of our senior engineers inspected Substation 12, saw elevated dissolved-gas readings on the main transformer, and recommended "continued monitoring, re-test in six months" instead of replacement. In August the transformer failed during the heat wave and we had rolling blackouts for three days. An outside consultant's report now says the failure was "clearly foreseeable" from those readings, and the panel is split about evenly between wanting the engineers diciplined and thinking that's pure monday-morning quarterbacking. Two complications I want the memo to actually deal with: a nearly identical transformer at our sister co-op showed the same gas signature in 2019 and is still running fine, and the consultant's report reads like each step "pointed inevitably" toward the failure — very tidy, maybe too tidy.

  Draft the written recommendation I'll circulate before Friday's meeting. It needs a concrete bottom line (discipline, no discipline, process changes, some combination), and the reasoning has to genuinely engage what "foreseeable" should mean for us — do we judge the January decision only on what the engineers knew at the time, or does the outcome itself count for something — plus whether the existence of a clean after-the-fact story is any evidence that anyone could have seen it coming beforehand. Don't pretend there's an easy answer where there isn't. And please write it in American English.
