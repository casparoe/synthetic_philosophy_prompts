prompt: |-
  My philosophy of science seminar has just finished a unit on verisimilitude — Popper's original definition, the Miller–Tichý counterexamples that sank it, and the later attempts at repair using similarity to the truth rather than counting true and false consequences. I'd like your credence, as a number, that there is an objective, non-language-relative fact of the form "false theory A is closer to the truth than false theory B" for at least some pairs of theories — so that a claim like "Newtonian mechanics is closer to the truth about planetary motion than Ptolemaic astronomy" is true in the same straightforward way that "Newtonian mechanics predicts planetary positions more accurately" is. Please decompose rather than give a bare number: (a) the probability that language-relativity is unavoidable for any similarity-based ordering, so that closeness comparisons merely reflect a choice of vocabulary; (b) the probability that consequence-based or question-based accounts escape that problem; (c) the probability that the comparison is objective but non-unique — that several equally legitimate orderings could rank the same pair of theories differently — and, if so, whether that would still be enough to license the scientific realist's talk of science converging on the truth; and (d) any further terms you think belong in the decomposition. Give one line of justification for each, combine them into an overall number, and then tell me which term you are least confident in and what argument or historical case would move it most. For calibration: my instructor puts the overall claim around 0.7, while my TA thinks anything above 0.3 overrates how much the Miller–Tichý result has been repaired rather than merely accommodated, so I'd also like to know where you think their disagreement is most likely located.
