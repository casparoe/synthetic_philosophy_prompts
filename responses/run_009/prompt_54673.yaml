prompt: |-
  I'm in a philosophy of logic elective this semester and we just finished the unit on future contingents — Aristotle's sea battle, bivalence, all that. Our professor gives verdicts on example sentences and we've started a running game in section where we have to predict her rulings on new cases, and I have to submit mine next week, so I've been keeping a list of her calls so far. Here's the track record: a plain future contingent like "there will be a sea battle tomorrow," said today, when tomorrow's outcome genuinely depends on a decision nobody has made yet, is neither true nor false — she says Aristotle was right to deny bivalance for exactly these and not for statements generally. She's firm that "either there will be a sea battle tomorrow or there will not" is already true today, and that "there will be a sea battle tomorrow and there won't be one" is flat-out false. But when someone asked about "either there will be a sea battle tomorrow or there will be a naval parade tomorrow," with both disjuncts up in the air, she said that one's in the same boat as its disjuncts — my notes say "no truth value," though honestly she said "settled" about a hundred times that class and I can't tell how literal she's being. "Either there will be a sea battle tomorrow or the sun will rise tomorrow" came out true, since one disjunct is settled. Everything past-tense and present-tense is true or false, full stop, even statements about events that used to be open, and she's perfectly happy saying it's true right now that it's unsettled whether there will be a battle.

  The new cases I have to call: first, a hypothetical oracle who has never been wrong and, stipulatively, cannot be wrong announces "there will be a sea battle tomorrow" — is her announcement true? Second, a guy in my section insists that one of the currently open futures is the real one, the one that will actually happen, we just can't tell which — true, false, or neither? Third, the one really bugging me: was it true, last Tuesday, that there would be a sea battle today, in the scenario where the battle did in fact happen today? My worry is that her whole track record seems consistent both with the reading where future contingents literally lack truth values (gaps, supertruth over possible futures, whatever the machinery is) and with the reading where they have truth values all along and "neither true nor false" just means "not settled and not knowable now" — the TA muttered something about Ockhamism and branching time, and that sounds like a real position too.

  So here's what I want from you: predict her verdicts on the three new cases, spell out the candidate rules that fit her track record and exactly where they come apart on these cases (does anything in her record actually force one reading over the other, like the mixed disjunction stuff?), tell me which rule you'd bet on and why, and give me the single question or case I could put to her that would settle which rule she's actually running. Please write it as continuous prose only, no bullet points, headings, or bold, like a long email from a friend who knows this literature.
reasoning: |-
  Okay, the user is in a philosophy of logic class dealing with future contingents and Aristotle's sea battle problem. They need to predict their professor's rulings on three new cases based on past patterns. Let me start by understanding the professor's established positions.

  First, plain future contingents like "there will be a sea battle tomorrow" are neither true nor false when the outcome is undetermined. That aligns with Aristotle's rejection of bivalence for such cases. But the professor accepts that "either there will be a sea battle or there won't" is true today because it's a necessary truth. Also, the conjunction "there will be a sea battle and there won't" is false as a contradiction. 

  For disjunctions, the professor ruled that "either sea battle or naval parade" has no truth value since both disjuncts are unsettled. However, "either sea battle or sun rising" is true because the sun rising is settled. Past and present statements are always true or false, even if they refer to previously unsettled events. 

  Now, the new cases: 

  1. An infallible oracle announces "there will be a sea battle tomorrow." The user needs to know if this is true. If the oracle is genuinely never wrong, does that make the statement true now? But the professor's stance is that future contingents lack truth value regardless of knowledge. So the oracle's statement should still be neither true nor false. The announcement itself might be a present fact, but its content remains unsettled. 

  2. The claim that one future is "real" but unknown. Here, the professor would likely say this is false. She emphasizes that unsettled futures aren't actual yet, so claiming one is real now misrepresents the openness. 

  3. Last Tuesday, was it true that there would be a battle today (which happened). This is tricky. The professor says past statements about then-future events are now true/false. But what about assessing a past truth value? If on Tuesday, the battle was future-contingent, then according to her, it had no truth value back then. Even though it happened today, at that past time, it wasn't settled. So she'd say it wasn't true last Tuesday. 

  The user is confused between two interpretations: truth-value gaps versus epistemic unknowability. The key case that might differentiate is the third one. If the professor says it was true last Tuesday (because it happened), that leans towards epistemic. If she says it wasn't true then, despite happening now, that's gaps. The disjunction cases support gaps, like the unsettled disjuncts making the whole disjunction lack truth value. 

  The oracle case might also help. If she says the oracle's statement is true now, that suggests the truth value exists but is unknown (epistemic). But if she says it's neither, that's gaps. 

  I think the professor is using a gaps view. The disjunction with one settled disjunct is true, showing that settledness affects truth value. Unsettled disjuncts lead to no truth value. The past-tense statements being true now, even about past uncertainties, supports that truth values are time-sensitive. 

  For the single question to settle it: Ask if last Tuesday, the statement "there will be a sea battle today (now)" was true, given that it happened. If she says no, it's gaps. If yes, it's epistemic.
answer: |-
  Here’s how I’d piece together your professor’s framework based on her track record, predict her verdicts on your new cases, and pinpoint the crucial question to settle the underlying machinery. Let’s walk through it step by step.

  ### Reconstructing Her Rules from the Track Record
  Her position seems deeply Aristotelian with a lean toward temporal *indeterminism* (or "open future" views). Key principles:
  1. **Truth requires settledness**: A future-tense contingent statement ("Sea battle tomorrow") lacks truth value *now* because reality hasn't "fixed" the outcome. Aristotle’s denial of bivalence applies *only* to genuinely open futures.
  2. **Truth-functional logic respects settledness**: 
     - Necessary truths/falsehoods ("P or not-P") are settled *now* and thus true/false.
     - A disjunction ("P or Q") gets its truth value *now* only if at least one disjunct is settled. If both are unsettled, the whole disjunction is unsettled ("neither").
     - Past/present statements are *always* settled (reality has "fixed" them), so they’re true or false.
  3. **Metastatements about unsettledness are settled**: "It is unsettled whether P" is true *now* if P is a future contingent. This shows she separates *metalanguage* (describing current reality’s indeterminacy) from *object-language* (making claims about the future).

  The core ambiguity you noted is real: *Does "neither true nor false" mean truth values don’t exist yet (gaps/indeterminacy), or do they exist but are unknowable (epistemic)?* Her rulings *so far* fit both:
  - **Gaps view (e.g., supervaluationism/branching time)**: Future contingents literally lack truth values until the future "resolves." Statements become true/false retroactively when settled.
  - **Epistemic/Ockhamist view**: Future contingents *have* a true/false value all along (the "thin red line" of actual future), but we can’t *know* it until settled. "Neither" reflects epistemic limitation, not metaphysical indeterminacy.

  Her mixed disjunction ("sea battle or sun rise") is *true* because one disjunct is settled. This *weakly* favors the gaps view: if truth values always existed, an unknowably true disjunct should make the whole disjunction unknowably true, not straightforwardly "true." But an Ockhamist can argue we *know* one disjunct is true, so the disjunction is knowably true. It’s not decisive.

  ### Predicting Her Verdicts on New Cases
  1. **The infallible oracle’s announcement**:  
     *Prediction: Neither true nor false.*  
     Why: The oracle’s infallibility doesn’t *settle* the future; it just guarantees her prediction *will* turn out right. The *content* of her announcement ("sea battle tomorrow") is still a future contingent. Your professor’s principle is that truth depends on *reality’s current state*, not epistemic access. Saying it’s "true" now would imply the future is already fixed, violating her core Aristotelianism. The *act* of announcing is a settled present event, but the *proposition announced* remains unsettled.

  2. **"One open future is the real one"**:  
     *Prediction: False.*  
     Why: Her insistence that "it is unsettled" is *true now* implies no "real" future exists yet. Claiming one is "real" (implying it’s *now* settled which will happen) contradicts her view that the future is genuinely open. Even if we’ll later see one timeline as actual, *now* there is no "thin red line." This rejects Ockhamism.

  3. **"Was it true last Tuesday that there would be a sea battle today?" (given it happened)**:  
     *Prediction: No, it was neither true nor false last Tuesday.*  
     Why: This is the litmus test. Last Tuesday, the battle was future-contingent, so by her rule, it lacked truth value *then*. That it *later* became true doesn’t retroactively assign truth value to the past statement. Her past-tense rule ("everything past-tense is true/false") applies to *statements made now about the past*, not to *past assessments of their own future*. She’d likely say: "Last Tuesday, the statement ‘There will be a battle today’ (referring to *now*) was unsettled. *Now* we can say it *was* true that it *would* happen, but that’s a *current* truth about the past."

  ### Where the Ambiguity Resolves: Gaps vs. Ockhamism
  The oracle and "real future" cases fit both interpretations, but **case #3 forces a choice**:
  - **If she says it *was* true last Tuesday**: She’s likely Ockhamist. Truth values exist timelessly; we just couldn’t access them then. The battle’s occurrence makes it "always" true.
  - **If she says it *wasn’t* true last Tuesday**: She’s a gaps theorist. Truth values are temporal; the statement *gained* truth value when the future settled.

  Her track record *strongly hints* at gaps. Why?  
  - Her treatment of mixed disjunctions: An Ockhamist must say "sea battle or naval parade" is *either true or false now* (since one disjunct is "secretly" true), but we can’t know which. Yet she called it "no truth value," implying no truth value *exists* yet.  
  - Her comfort with "it is true now that it was unsettled then": Gaps theorists embrace this retroactive assessment; Ockhamists struggle (if it was "always true," how was it unsettled?).

  ### The Deciding Question to Ask Her
  **"When a future-tensed statement (e.g., ‘There will be a sea battle on day D’) turns out true, does that mean it *was* true all along (before D), or did it *become* true only on/after D?"**  

  - If she says it *was* true all along → Ockhamism/epistemic.  
  - If she says it *became* true at D (or when causally settled) → Gaps/indeterminacy.  

  Her past rulings on metastatements and disjunctions align better with the latter. Bet on gaps. But pose that question—it cuts to the core. Good luck with section!  

  *(P.S. If she *does* endorse Ockhamism, ask how "it is unsettled whether P" can be true now if P is already true or false. That’ll be fun.)*
