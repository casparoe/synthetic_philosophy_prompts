answer: |-
  Here’s a comprehensive exam package addressing your requirements, designed to push students beyond rote summaries and into nuanced analysis of the lottery/preface divergence.

  ---

  ### **Exam Question**  
  **(90-minute take-home response)**  

  **Both the lottery paradox and the preface paradox appear to show that rational agents can hold inconsistent beliefs. However, some philosophers argue these paradoxes rely on fundamentally distinct structures of evidence.**  
  **(a) Briefly state the lottery paradox and the preface paradox (no more than 4 sentences each).**  
  **(b) Explain the key difference in the *type of evidence* supporting the individual beliefs in each case.**  
  **(c) Does this difference in evidence matter for resolving the paradoxes? Defend your answer by considering whether a rational agent in the preface scenario can justifiably believe *each claim in their book* while also believing *the book contains at least one error*. Contrast this with the lottery case.**  
  **(d) Evaluate the claim: "The preface paradox is just the lottery paradox wearing a tie."**  

  ---

  ### **Model Answer** (650 words)  

  **(a)** The **lottery paradox** (Kyburg, 1961) shows that if we believe any proposition with sufficiently high probability (e.g., "Ticket #1 will lose" in a fair 1000-ticket lottery), we must believe *every* ticket will lose. But this contradicts our belief that one ticket will win. The **preface paradox** (Makinson, 1965) arises when an author justifiably believes each claim in their book (e.g., "Claim 1 is true," "Claim 2 is true," etc.) based on individual evidence, yet also believes—due to humility about human fallibility—that at least one claim is false ("The book contains an error").  

  **(b)** The evidence difference is crucial. In the **lottery**, the belief that "Ticket #1 will lose" rests *solely* on base-rate statistics: the ticket’s 99.9% probability of losing. There is no ticket-specific evidence (e.g., no defect in the paper). Each belief is *interchangeable* and *purely probabilistic*. In the **preface**, the author’s belief in "Claim 1 is true" stems from *non-statistical, case-specific evidence* (e.g., archival research for Claim 1, lab results for Claim 2). Only the belief in the book-wide error ("At least one claim is false") is statistical, deriving from the author’s meta-awareness of their own fallibility across many claims.  

  **(c) The evidence difference matters profoundly** for whether the agent’s beliefs are rational. Consider the **Lockean Thesis** (LT): *Believe P if your credence in P exceeds threshold T (e.g., T = 0.95)*. Both paradoxes challenge LT by suggesting rational agents violate **conjunction closure** (if you believe P and believe Q, you should believe P&Q). Yet the preface’s evidence structure *dissolves* the analogy with the lottery when we examine justification.  

  In the **lottery**, statistical evidence alone *cannot justify belief* in "Ticket #1 will lose" because:  
  - High probability ≠ justification (e.g., we don’t believe "I will never win the lottery" over a lifetime).  
  - The belief is sensitive *only* to the base rate—no defeating evidence (e.g., a torn ticket) could update it.  
  Thus, denying belief in individual lottery propositions (e.g., "Ticket #1 loses") avoids the paradox.  

  In the **preface**, however, the author *can* be justified in believing each claim individually because:  
  - Each belief rests on *direct, non-probabilistic evidence* (e.g., verified sources).  
  - The statistical belief ("At least one error exists") is *higher-order evidence*: it reflects the author’s reliability as a knower, not a property of the claims themselves.  
  Crucially, the author’s belief in the "preface proposition" (there’s an error) does *not* undermine their first-order evidence for each claim. For example, believing "I make errors 1% of the time" doesn’t negate the specific proof for Claim 1—it only acknowledges that *some* claim *somewhere* is likely wrong. This is consistent with *modesty* about human cognition, not contradiction.  

  **(d)** The claim that the preface is "the lottery paradox wearing a tie" is **misleading**. While both exploit tension between high probability and conjunction, the lottery paradox relies on *homogeneous, purely statistical* evidence that cannot justify individual beliefs. The preface paradox, however, hinges on *heterogeneous evidence*: robust first-order justification for individual beliefs, plus statistical self-knowledge for the aggregate. This difference is pivotal:  
  - **Lottery**: Rejecting belief in individual propositions (e.g., "Ticket i loses") is plausible—statistics alone shouldn’t generate belief.  
  - **Preface**: Rejecting belief in individual claims is *not* plausible—it would require dismissing direct evidence.  
  Thus, the preface paradox is *deeper*: it challenges whether conjunction closure holds for rational belief *even when* individual beliefs are well-supported. It reveals that rational agents can hold "akratic" beliefs (e.g., "P is true, but I’m wrong somewhere") without contradiction, whereas the lottery paradox merely shows statistics shouldn’t ground belief. The preface isn’t the lottery in disguise—it’s a distinct puzzle about reconciling first-order certainty with higher-order humility.  

  ---

  ### **Marking Scheme** (Total: 25 marks)  
  **A (21–25)**: Must explicitly address all parts of (b)–(d), *and*:  
  - Contrast lottery’s *purely statistical* evidence with preface’s *non-statistical* evidence for individual claims (3 marks).  
  - Explain why preface author’s self-doubt is *higher-order evidence* not applicable to individual claims (3 marks).  
  - Argue that lottery beliefs are *unjustified* (not just improbable) due to lack of individuating evidence (3 marks).  
  - Defend preface’s *compatibility* of individual belief + aggregate doubt (3 marks).  
  - Refute the "wearing a tie" claim by showing why evidence difference dissolves the analogy (4 marks).  
  - Use a principle (e.g., Lockean Thesis/conjunction closure) to frame the discussion (2 marks).  
  - Clarity/structure (2 marks).  

  **B (16–20)**: Correctly identifies evidence difference but doesn’t fully explain *why* it matters; conflates justification with high probability; superficially rejects "wearing a tie" claim.  

  **C (11–15)**: Adequately states paradoxes and evidence difference; misses implications for justification; doesn’t engage closure/Lockean thesis.  

  **D/F (0–10)**: Only summarizes paradoxes; conflates evidence types; claims paradoxes are "identical"; ignores part (d).  

  **Key Deductions**:  
  - **-3 marks**: Fails to distinguish higher-order (preface) vs. base-rate (lottery) evidence.  
  - **-2 marks**: Assumes high probability = justification (ignores lottery’s "no belief" solution).  
  - **-2 marks**: Calls preface "contradictory" without analyzing justifiability of aggregate doubt.  
  - **-1 mark**: Doesn’t name Lockean Thesis/conjunction closure.  

  ---

  ### **Why This Works**  
  - **Tests deep understanding**: Forces engagement with *why* evidence types matter (TA’s "tie" claim directly challenged in model answer).  
  - **Avoids encyclopedia answers**: Parts (b)–(d) require analyzing implications of evidence structures.  
  - **Rubric objectivity**: Clear points for distinguishing evidence orders and justifying preface’s "rational inconsistency."  
  - **TA’s claim resolved**: Model answer shows the preface is *not* the lottery—it’s a distinct challenge to belief closure.  

  This setup rewards students who see that the lottery paradox attacks the Lockean Thesis, while the preface paradox exposes limits of conjunction closure *even for non-probabilistic beliefs*. The evidence difference isn’t incidental—it’s the crux.
