answer: |-
  Here's a precise dissection of your friend's "bumped into seven" argument, formatted as a coffee-ready list. Each reading builds on the last, showing how the trivial claim morphs into substantive—and contestable—philosophical commitments.

  ### **The Claim: "Nobody has ever bumped into the number seven"**  
  *(i.e., you can't causally interact with numbers)*

  1. **Literal Physical Interaction**  
     - *Claim*: Numbers aren't physical objects that occupy space, so you can't touch, see, or collide with them.  
     - *Status*: **Platitude** (agreed on by platonists and nominalists).  
     - *Supports anti-platonism?* **No** → Platonists *also* agree numbers are abstract and non-spatiotemporal. This doesn't challenge their existence.  

  2. **Causal Inertness**  
     - *Claim*: Numbers cannot *cause* anything in the physical world (e.g., no photon is emitted by "7").  
     - *Status*: **Platitude** (platonists accept abstract objects lack causal powers).  
     - *Supports anti-platonism?* **No** → Many uncontroversial entities are causally inert (e.g., moral values, fictional truths, logical laws). Inertness ≠ nonexistence.  

  3. **Epistemological Challenge**  
     - *Claim*: If numbers exist but are causally inert, we can't *explain how we know* about them (since all knowledge requires causal contact).  
     - *Status*: **Contentious** (platonists *dispute* the premise that knowledge requires causation).  
     - *Supports anti-platonism?* **Weakly** → It highlights a puzzle for platonism (the "Benacerraf problem"), but *doesn't* prove numbers don't exist. Platonists offer solutions (e.g., rational intuition, non-causal grounding).  
     - *Needs extra premises?* **YES** → Requires a **causal theory of knowledge** (e.g., "all knowledge requires causal links"). This is highly controversial (e.g., rejects a priori knowledge).  

  4. **Reference Requirement**  
     - *Claim*: We can't *refer* to numbers (e.g., use "7" meaningfully) without causal contact.  
     - *Status*: **Contentious** (platonists argue reference can be non-causal, e.g., via description).  
     - *Supports anti-platonism?* **Only with heavy lifting** → If true, it might make mathematical discourse impossible—but we *do* use math successfully.  
     - *Needs extra premises?* **YES** → Requires a **causal theory of reference** (e.g., Kripke-Putnam semantics). Contested in math (e.g., how do we "bump into" Sherlock Holmes?).  

  5. **Existence Criterion**  
     - *Claim*: Causal interaction is *necessary for existence* (i.e., "no causation, no reality").  
     - *Status*: **Highly contentious** (a form of scientism/physicalism).  
     - *Supports anti-platonism?* **Yes, but question-begging** → This *assumes* nominalism is true. Rejects abstracta by definition.  
     - *Needs extra premises?* **YES** → Requires **metaphysical naturalism** ("only the physical exists"). More controversial than platonism (e.g., can’t explain math’s indispensability in science).  

  ---

  ### **What Your Friend Is Likely Committed To**  
  If forced to be precise, your friend probably relies on **#3 or #5** to justify rejecting numbers entirely. But:  
  - **#3 alone fails**: It only shows platonism has an *epistemological puzzle*, not that numbers don't exist.  
  - **#5 alone fails**: It’s circular—it *presupposes* nominalism rather than arguing for it.  

  **Crucial Weakness**: His conclusion ("we shouldn't believe in numbers") **requires extra premises** (#3–#5). These premises (e.g., causal theories of knowledge/reference, metaphysical naturalism) are:  
  - **More controversial than platonism** (platonism is the default in philosophy of math).  
  - **Self-undermining**: If all knowledge requires causation, how do we know *that* principle? We haven’t "bumped into" it.  

  ---

  ### **How to Push Back Over Coffee**  
  > "Sure, I've never high-fived a seven. But when you say that to dismiss numbers, you're smuggling in claims like:  
  > 1. *Knowledge requires causation* (but then how do you know *logic*?)  
  > 2. *Existence requires causation* (but then do morals or possibilities exist?).  
  >   
  > Those claims are *way* less obvious than 2+2=4. If you insist on them, you're not refuting platonism—you're just assuming it's false. And that doesn't explain why math works *so well* in science.  
  >   
  > So: Does 'bumping into seven' actually prove numbers don't exist? Or does it just restate your *preference* for a metaphysics that can't explain math's success?"

  This forces him to either defend the controversial premises (e.g., "Yes, knowledge *always* requires causation!") or admit his one-liner is rhetorical, not substantive. Either way, *he* now bears the burden of proof.
