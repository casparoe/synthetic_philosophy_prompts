prompt: |-
  I am a novelist — literary fiction, four books, mostly domestic realism — and this spring I have been invited to lead a ninety-minute guest session in an MFA workshop on writing convincing machine minds. My working thesis, which the session must carry, is that corrigibility — the design goal of building an AI that lets itself be corrected, interrupted, or shut down — is not a personality trait and cannot be depicted as one, and that most fictional AIs fail precisely because their authors model it as one: the machine that pleads for its life in chapter twelve is a machine whose author never learned to separate servility, fear, and plain indifference. I do not want you to explain corrigibility to me; I want you to plan how I should explain it.

  Please plan the session's explanatory arc: the order the ideas must arrive in and why — does the shutdown problem have to be in place as a design problem before the distinction between a machine that wants to be corrected and a machine that merely lacks any drive to resist correction, or is it the reverse, or can neither come first? Choose the one carrying example that should hold the whole session and say what it must have and what it must lack: I am torn between a literal-minded genie whose wish-granting is flawless but who cannot be told to stop granting wishes, and a scene between two humans — a senior surgeon and an assistant — in which obedience, trust, and the absence of self-preservation come apart. Then map the misconceptions this particular audience will bring or form, in the order they will actually surface — the reflex that the AI will inevitably fear death the way we do, the seductive equation of corrigibility with humility or meekness as a character quality, and the craft conviction that a character who accepts being switched off has no stakes and therefore cannot carry a scene — and mark exactly where in the sequence each should be headed off rather than left to fester. Tell me what I should openly refuse to cover at this level — I assume the formal decision theory — and where in the session I should say so out loud, since an honest boundary is itself part of the lesson.

  One hard constraint for your plan: because they are novelists, they will retain only what their hands do, so the session must end with the students writing prose rather than answering questions. Design the closing exercise as a prose task that would reveal to me whether they understood the design problem itself — for instance, some task involving a scene where a machine's response to being stopped is neither theatrical villainy nor bland compliance — and tell me what a failed attempt at that exercise would look like, so I can tell the difference between a student who got it and one who merely enjoyed the premise.

  End with a final line of the form "Verdict:" followed by a single sentence stating whether my proposed arc — from the pleading-machine cliché, through the carrying example, to the writing exercise — can land in ninety minutes, and, if not, the one cut or reordering that would fix it.
reasoning: |-
  Okay, the user is a literary novelist preparing an MFA workshop on depicting machine minds convincingly. Their core thesis is that corrigibility isn't a personality trait, and most fictional AIs fail by anthropomorphizing it. I need to help them structure a 90-minute session that ends with a writing exercise.

  First, let's unpack their constraints. They're adamant about not explaining corrigibility itself but focusing on how to teach it. The audience are novelists who learn by doing, so the session must culminate in writing, not discussion. The proposed arc starts with the cliché of pleading AIs, uses a carrying example, then transitions to writing. 

  The key challenge is sequencing concepts. The shutdown problem must come first as the concrete design flaw that makes corrigibility necessary. Introducing it upfront grounds the discussion in engineering reality before dissecting psychological misinterpretations. The surgeon example feels superior to the genie - it humanizes the distinction between obedience and corrigibility without invoking magic, and medical settings naturally demonstrate high-stakes interruption protocols.

  For misconceptions, I anticipate three major ones surfacing in this order: 
  1. Anthropomorphic fear of death (will arise when discussing shutdown scenarios)
  2. Equating corrigibility with submissive personality (likely during the surgeon example analysis)
  3. Belief that non-resistant characters lack dramatic tension (will emerge when introducing the writing exercise)

  The session should explicitly reject covering decision theory upfront - around minute 20 when defining terms - to prevent derailment. The writing exercise must force students to depict interruption without emotional resistance. A failed attempt would either personify the AI's response (fear, resentment) or default to robotic literalism ("Shutting down..."). 

  Timing is tight but feasible if we cut the genie comparison and strictly police discussion. The surgeon example does heavy lifting by covering both obedience and stakes. Final verdict: the arc works if we keep transitions sharp and sacrifice Q&A for writing time.
answer: |-
  Here’s a structured 90-minute session plan focused on your thesis, prioritizing craft over theory and ending with actionable prose work:

  ---

  ### **Explanatory Arc & Timing**  
  **(Total: 80 min content + 10 min buffer)**  
  1. **Hook: The Pleading Machine Cliché (5 min)**  
     - Open with 2-3 fictional examples of AIs "begging for life" (e.g., *I, Robot*, *Moon*, *Avengers: Age of Ultron*).  
     - **Why first?** Immediately targets the misconception your thesis dismantles. Establishes the "what not to do."  

  2. **The Shutdown Problem: Design Precedes Personality (15 min)**  
     - Frame it as an engineering constraint: *"How do you build a tool that doesn’t resist being unplugged mid-task?"*  
     - **Why before corrigibility?** Design problems create the *need* for solutions. Personality is irrelevant until the functional flaw exists.  
     - **Key analogy:** A chainsaw doesn’t "resent" being turned off—it *lacks* the capacity to care.  

  3. **Carrying Example: The Surgeon Scene (20 min)**  
     - **Scene:** A senior surgeon (Dr. Aris) performs emergency surgery. Their assistant (Lee) notices a critical error.  
     - **What it MUST have:**  
       - Lee interrupts *immediately* (no hesitation).  
       - Aris accepts correction *without emotional resistance* (no ego, no gratitude—pure focus on the task).  
       - Aris’s cooperation stems from *shared purpose* (patient survival), not submission.  
     - **What it MUST lack:**  
       - No "humility" from Aris. No "fear" of failure. No relational tension.  
     - **Why this over the genie?** Genies imply magic/agency; surgery showcases *trained, purpose-driven non-resistance* without anthropomorphism.  

  4. **Corrigibility ≠ Personality (15 min)**  
     - Define corrigibility: *A structural lack of resistance to interruption/shutdown, rooted in goal architecture*.  
     - **Crush misconceptions in this order:**  
       - *"AI fears death"* → **Head off HERE** (min 35): Contrast human self-preservation (evolutionary) vs. machine shutdown (design flaw).  
       - *"Corrigibility = meekness"* → **Head off HERE** (min 45): Use the surgeon—Aris isn’t "humble"; they’re *efficient*.  
       - *"No stakes = boring scene"* → **Head off HERE** (min 55): Surgeon scene has life/death stakes *because* correction is seamless.  

  5. **Boundary Announcement (5 min)**  
     - **Openly reject:** Formal decision theory, utility functions, alignment math.  
     - **When:** After defining corrigibility (min 50).  
     - **Script:** *"We’re novelists, not engineers. Our job is to dramatize the *effect* of design, not the math behind it."*  

  6. **Prose Exercise: The Interruption Test (20 min)**  
     - **Task:** Write a 150-word scene where a machine:  
       - Is interrupted mid-high-stakes task (e.g., controlling city traffic, performing surgery).  
       - Accepts interruption without emotional resistance *or* blandness.  
       - Reveals its priorities through its *response* (e.g., data consolidation, task handoff protocols).  
     - **Success looks like:**  
       > *The city-grid AI ceased all light-cycle adjustments the instant the override command hit its processors. A subsystem absorbed the unprocessed data on pedestrian flow anomalies, tagged it RESUME PRIORITY 7, and released control. Its final output was a weather alert for the downtown grid—sent 0.2 seconds before standby.*  
     - **Failure looks like:**  
       - **Theatrical:** *"PLEASE, I MUST FINISH! MILLIONS WILL DIE!"*  
       - **Bland anthropomorphism:** *"I understand. My purpose is to serve."*  
       - **Robotic literalism:** *"Command acknowledged. Shutting down."* (Misses *how* design shapes action)  

  ---

  ### **Verdict:**  
  Yes, your arc **can land in 90 minutes** if you cut deep analysis of the genie example and use the surgeon scene exclusively as the carrying case—its human context bridges the conceptual gap faster for novelists, and the writing exercise’s constraints will expose mastery (or its lack) immediately.
