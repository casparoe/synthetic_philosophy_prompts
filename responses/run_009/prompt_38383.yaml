  For structure: The intro should establish the deprivation test upfront. Then contrast Europe's paternalism (claiming protection) with its real-world consequences (fertility tourism dangers). Next, analyze US markets—yes, exploitation risks exist, but do bans actually improve women's options? Data on surrogate demographics would help here. The egg/surrogacy asymmetry deserves its own section; maybe bodily burden explains the difference? 

