  **Note for the Novelist**:  
  - The document avoids "mushy" compromises by focusing on actionable claims (e.g., defining "harm" thresholds) and testable cruxes.  
  - Disagreements are phrased to avoid strawmen: Thorne’s autonomy stance emphasizes user sovereignty, while Voss’s stewardship focuses on preventable harm.  
