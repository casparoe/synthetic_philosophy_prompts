prompt: |-
  I help run an interdisciplinary reading group on mechanistic interpretability, and a colleague from computer science left half the room convinced of a conclusion I can't accept but can't manage to refute. His argument, as I reconstruct it:

  (1) A state of a system represents F only if two conditions are met: information about F is recoverable from that state, and the system uses that information in producing its F-involving behavior. Call these the information condition and the use condition.

  (2) Everything interpretability research offers as evidence for representational claims bottoms out in one of two kinds of result: decoding — training an external classifier (a probe) to read F off internal activations — and intervention — ablating, patching, or amplifying internal states and observing behavior.

  (3) Take decoding first. A linear probe applied to the activations of a randomly initialized network of the same architecture decodes features of the input well above chance, since random weight matrices are close to information-preserving maps; and a probe with enough capacity, trained on randomly permuted labels, will drive its training accuracy arbitrarily high, because the probe is itself a learner. So above-chance decoding is a property of the probe-and-dataset pair, obtainable from systems that have learned nothing whatsoever.

  (4) A signal that is present whether or not the system has done the thing the signal is supposed to indicate is not evidence that the system did that thing. So decoding accuracy, however high, is no evidence of representation.

  (5) The obvious reply is that the trained network's accuracy exceeds the random baseline and that the margin is the evidence. But the baseline's very existence shows the raw score is partly probe artifact, and a margin over an artifact is not a representation; at best it is an uninterpreted statistical excess. To treat it as representational content, you would need a theory of what the baseline subtracts, and no such theory is on offer.

  (6) Now the use condition. The only evidence for use is intervention. But intervention shows causal relevance only, and causal relevance is cheap in a network whose features are superposed: ablating almost any direction of sufficient norm changes behavior somehow, and whatever change you observe can be described in terms you invent after seeing it.

  (7) So no probe result and no intervention result is evidence of representation, and these two exhaust the evidence interpretability could in principle supply.

  (8) Nothing in the argument turned on gradient descent, artificiality, or scale: population decoding in neuroscience and lesion or stimulation studies in brains have exactly the structure of (3) through (6).

  (9) Therefore nothing — artificial or biological — has ever been evidenced to represent anything, and the interpretability program is not merely unfinished but impossible in principle.

  He is serene about (9): representation, he says, was always a loanword, and the program was misdescribed from the start. I want to keep (1), which nearly everyone in the room accepted without comment, and I half-suspect the trouble is somewhere in (4) and (5) — but every time I try to say what is wrong with (4), my objection starts to prove too much in the other direction, since it would apparently discredit any test that an untrained or unprepared control subject partly passes, which is half of psychometrics. Tell me which step to reject, why that step looked fine to a room of people who work on this for a living, and what rejecting it costs — including whether my colleague can simply accept your diagnosis, concede that step, and retreat to a defensible core of the argument.
reasoning: |-
  We are given an argument that challenges the evidential basis for attributing representations to systems (artificial or biological) based on the methods of interpretability (decoding and intervention). The argument concludes that nothing has ever been evidenced to represent anything and that the interpretability program is impossible in principle.

  The steps of the argument are:

  1. Representation requires both an information condition (information about F is recoverable) and a use condition (the system uses that information in producing behavior).

  2. Interpretability evidence is limited to decoding (probes) and intervention (ablations, etc.).

  3. Decoding with linear probes works even on randomly initialized networks because random matrices are information-preserving, and a probe with enough capacity can overfit to random labels. Thus, above-chance decoding is not evidence of learning.

  4. Therefore, a decoding signal that appears even without learning is not evidence that the system represents that feature.

  5. The margin (improvement over the random baseline) is not evidence either because the baseline is an artifact and we don't have a theory of what it subtracts.

  6. Intervention only shows causal relevance, which is cheap in a system with superposition, and the description of the change is post-hoc.

  7. Therefore, neither decoding nor intervention provides evidence for representation.

  8. The same applies to neuroscience.

  9. Thus, nothing has ever been evidenced to represent anything.

  We are to reject one step and explain why, what it costs, and whether the core argument can be maintained without it.

  Let's analyze:

  The key steps that seem vulnerable are (4) and (5). However, the colleague argues that (4) is supported by the idea that if a signal is present even when the system hasn't learned, then it can't be evidence of representation. But note: the problem is that the probe might be creating the signal. The argument in (3) shows that decoding can be achieved by the probe alone (without the system having learned). Therefore, (4) says that this decoding result is not evidence of the system representing F.

  But the author of the argument then considers the margin: the improvement in decoding accuracy in the trained network over the random baseline. The colleague rejects this margin as evidence because the baseline is an artifact and we don't have a theory to interpret the margin.

  So the problem is that the entire decoding result (even the margin) is being dismissed.

  However, let's consider step (5): the claim that the margin is not a representation because it's an "uninterpreted statistical excess" and we lack a theory of what the baseline subtracts.

  But note: the baseline (the random network) does not have the same internal structure as the trained network. The random network has not been trained to perform the task, while the trained network has. The margin is the difference in decoding accuracy between a system that has been trained and one that hasn't. This margin might reflect the fact that the trained network has organized its internal state in a way that makes the feature F more linearly accessible.

  Moreover, in the trained network, the probe is not having to work as hard (or overfit as much) because the representation is better. The fact that a linear probe works better on the trained network than on the random one suggests that the trained network has learned to represent the feature in a more linearly decodable way.

  So why is the margin dismissed? The argument says: because the baseline is an artifact and we don't have a theory of what the baseline subtracts. But we do have an idea: the random network baseline subtracts the decoding that is possible without any task-specific learning. The margin is the part that is due to learning.

  Therefore, step (5) is the weak link.

  Why might step (5) look plausible? Because the baseline (random network) is not a "pure" control. The random network is a different system. But note: the random network has the same architecture and thus the same capacity for information preservation. The argument in (3) shows that the random network can be decoded above chance because of its random but information-preserving weights. The trained network, however, has weights that are optimized for the task. The margin is the improvement due to training.

  But the colleague argues that the baseline is an artifact. However, in experimental design, we often use baselines to control for confounding factors. The random network baseline controls for the fact that the architecture alone (without training) allows some decoding. The margin is the effect of training. This is standard in science: we compare a treatment group (trained) with a control group (untrained). The difference is attributed to the treatment (training).

  Therefore, step (5) is too dismissive of the margin. The margin is evidence that the training has made the representation more linearly accessible. And linear accessibility is a property of the representation in the network, not just the probe.

  Moreover, we can strengthen this by noting that if we use the same probe (with the same capacity) on both the random and the trained network, and we see a significant improvement on the trained one, that is evidence that the network has learned a better representation.

  So we can reject step (5).

  What does rejecting (5) cost? It requires that we have a theory of the baseline: the baseline subtracts the decoding that is possible without learning. We are then left with the margin as the evidence of the learned representation. This is a standard approach in many fields. The cost is that we must be cautious in how we set up the baseline. For instance, we must ensure that the random network is a proper control (same architecture, same data preprocessing, etc.). Also, we must be cautious about the probe: if we use a more complex probe on the trained network than on the random one, then the improvement might be due to the probe's capacity. Therefore, we must control for the probe's capacity and complexity.

  But note: the argument in (3) also says that a probe with enough capacity can drive accuracy arbitrarily high on randomly permuted labels. This is overfitting. However, in the case of the trained network, we are not using randomly permuted labels. We are using the true labels. And we can use standard techniques to avoid overfitting (like using a held-out test set). Therefore, if we see high decoding accuracy on a held-out set with a linear probe on the trained network, and that accuracy is significantly higher than the same linear probe on a random network (with the same architecture) on the same held-out set, that is strong evidence that the trained network has a linearly decodable representation of F.

  Therefore, step (5) is not compelling.

  Now, what about step (6)? The argument about intervention: that causal relevance is cheap and descriptions are post-hoc. This is a valid concern, but it does not necessarily rule out evidence for the use condition. We can design interventions that test specific hypotheses. For example, if we hypothesize that a particular neuron (or direction) represents F, then we can intervene by amplifying that direction and see if the system behaves as if F is more present. If we have a clear prediction (e.g., in a classification task, the probability of the class corresponding to F increases), then the intervention provides evidence that the representation is used for that behavior.

  Moreover, we can use multiple interventions to triangulate. The fact that causal relevance is widespread does not mean that every intervention is uninformative. We can compare the effect of interventions on different directions and see which ones have the largest and most specific effects.

  Therefore, step (6) might be too strong. But note: the argument in step (6) is about the evidence being weak because of superposition and post-hoc description. However, if we have a prior hypothesis about what the representation is and how it is used, then intervention can provide evidence.

  But the main challenge in the argument is about decoding, and we have already addressed that by rejecting (5).

  Now, step (8) extends the argument to neuroscience. If we reject (5) and accept that the margin is evidence, then we can also say that in neuroscience, the margin (e.g., comparing decoding accuracy in a task-relevant brain area during the task versus during rest or a control task) can be evidence of representation.

  Therefore, by rejecting step (5), we can rescue the possibility of evidence from decoding.

  But note: the argument also says that the use condition requires intervention, and step (6) dismisses intervention. However, we have argued that step (6) is too strong. So we might also challenge step (6). But let's focus on one step.

  Our diagnosis: Reject step (5).

  Why it looked fine: Because the baseline (random network) does produce above-chance decoding, and without a clear theory of why, one might think that the entire decoding result is contaminated. Moreover, the problem of overfitting by the probe is real. So step (5) looks plausible if we don't consider the margin as a controlled comparison.

  What rejecting it costs: We must be careful in experimental design. We must use proper controls (same architecture, same probe, same dataset) and avoid overfitting by the probe (by using held-out data and simple probes). Also, we must not overstate the evidence: the margin only shows that the representation is more linearly accessible after training. It does not necessarily show that the representation is used (that's the use condition). But it does provide evidence for the information condition.

  Can the colleague accept this and retreat? The core of the argument (steps 1-4, and 6-8) remains. The colleague might still argue that the margin is not evidence for the use condition. But note: step (1) requires both conditions. The decoding evidence (even the margin) only addresses the information condition. We still need evidence for the use condition. And step (6) argues that intervention does not provide such evidence. So the colleague might retreat to: even if decoding provides evidence for the information condition, intervention does not provide evidence for the use condition (because of step (6)). Then we still have a problem: we might have evidence for information but not for use, so we don't have evidence for representation (which requires both).

  But we have also challenged step (6). So if we reject both (5) and (6), the argument collapses. But the question asks for one step.

  Alternatively, the colleague might accept that the margin is evidence for the information condition, but then point out that we still lack evidence for the use condition. Then the interpretability program would need to provide evidence for both, and the colleague might argue that intervention (step (6)) is still problematic.

  So by rejecting (5), we have saved the information condition, but the use condition remains under attack by step (6). Therefore, the colleague can retreat to: we have no evidence for the use condition because intervention only shows causal relevance and that is cheap and post-hoc.

  But note: step (6) is also questionable. We can design interventions that test specific predictions. For example, if we have a hypothesis that a particular representation is used for a particular behavior, we can ablate it and see if that behavior is impaired. If we see a specific impairment, that is evidence of use.

  Therefore, to fully refute the argument, we might need to reject both (5) and (6). However, the problem asks for one step. Since the decoding part is the most developed in the argument, and step (5) is the key to dismissing the decoding evidence, we focus on (5).

  Conclusion:

  Reject step (5). The margin (improvement in decoding accuracy in the trained network over the random baseline) can be evidence of representation (specifically, for the information condition) if properly controlled. The baseline subtracts the decoding that is possible without learning, and the margin reflects the effect of learning.

  Cost: We must be careful in the experimental design to control for the probe and the baseline. We must use the same probe architecture and the same dataset (with held-out test) for both the trained and random network. Also, we must be cautious about overfitting by the probe (but that can be controlled by standard machine learning practices).

  The colleague can retreat by accepting that the margin provides evidence for the information condition, but then argue that we still lack evidence for the use condition (because of step (6)). Then the debate shifts to the validity of intervention studies. Alternatively, if we also reject step (6), then both conditions can be evidenced.

  But for now, we have refuted the claim that decoding provides no evidence at all.
answer: |-
  ### Diagnosis and Response

  Your colleague's argument is rigorous but contains a critical flaw in **step (5)**, which dismisses the evidential value of the "margin" (the improvement in decoding accuracy of a trained network over a random baseline) as mere "uninterpreted statistical excess." Rejecting step (5) preserves the core of representation-based interpretability while addressing the room's concerns. Below, I explain why step (5) fails, why it seemed plausible, the cost of rejecting it, and how your colleague might retreat to a weaker (but still defensible) position.

  ---

  ### Why Reject Step (5)?
  **The Flaw:** Step (5) argues that the margin (trained network accuracy minus random baseline accuracy) is not evidence of representation because it is an "artifact" with no theory to interpret it. This is incorrect. The margin is **not an uninterpreted artifact**; it is a controlled measure of the *learning-induced change* in the system's internal structure. Here's why:
  1. **Experimental control**: The random network serves as a null-hypothesis baseline. It controls for the architecture's innate information-preserving properties (e.g., random matrices preserve input information via Johnson-Lindenstrauss-like effects). The margin isolates the contribution of *training* by subtracting what the system can do "for free" from what it achieves through learning. This is analogous to controlled experiments in biology (e.g., sham surgeries in lesion studies) or psychometrics (e.g., pre-test/post-test designs with control groups).
  2. **Probe constraints**: Step (5) ignores that probes can (and should) be constrained to avoid overfitting. If the same linear probe architecture is used on both the trained and random networks, and the margin persists on *held-out data*, it reflects a genuine change in the network's representations—not probe overfitting. For instance:
     - A linear probe achieving 90% accuracy on a trained network vs. 50% on a random network (with identical probes/data) implies the trained network organizes information more linearly decodably. This is evidence that training created a structured representation of `F`.
  3. **Theory of the baseline**: Contrary to step (5), we **do** have a theory for what the baseline subtracts: the decoding accuracy attributable solely to the architecture's inductive biases and dataset statistics, absent task-specific learning. The margin quantifies the *additional* structure imposed by learning. This is not "uninterpreted"; it aligns with theories of learning in deep networks (e.g., neural tangent kernel theory) where training evolves representations toward linear separability.

  **Why step (5) seemed plausible:** Your room likely accepted step (5) because:
  - **Probes can be deceptive**: As step (3) notes, probes can overfit or exploit trivial patterns (e.g., a high-capacity probe memorizing random labels). This creates a reasonable suspicion that *any* decoding result might be a probe artifact.
  - **Baseline ambiguity**: Random networks *do* yield above-chance decoding, making it tempting to dismiss all decoding as architecture-dependent noise. Step (5) exploits this by framing the margin as "subtracting an artifact," implying it has no semantic content.
  - **Overgeneralization from edge cases**: The argument fixates on pathological scenarios (e.g., probes trained on permuted labels) while ignoring standard practices (e.g., cross-validated linear probes on held-out data). This makes decoding seem irredeemably flawed.

  In essence, step (5) conflates *poorly controlled* decoding studies (which indeed prove little) with *well-controlled* ones (which can provide evidence). This mirrors psychometrics: just as a control group passing a test partly doesn't invalidate all group differences, the random baseline doesn't invalidate the margin.

  ---

  ### Cost of Rejecting Step (5)
  Rejecting step (5) comes with three costs:
  1. **Experimental rigor**: Interpretability must adopt stricter controls:
     - Probes must be simple (e.g., linear), tested on held-out data, and applied identically to trained/random networks.
     - Baselines must account for architecture and data biases (e.g., using untrained networks with identical architecture).
     - Margins must be statistically significant and large enough to rule out trivial explanations.
  2. **Limited scope**: The margin only evidences the **information condition** (that `F` is linearly recoverable post-training). It says nothing about the **use condition** (whether the system uses `F`). You still need intervention studies to close the loop.
  3. **No free lunch**: Decoding alone cannot prove "representation" in a full philosophical sense (e.g., as in Fodor or Dretske). It only shows that information about `F` is present and structured. This may not satisfy critics who demand teleology or causal history.

  Despite these costs, rejecting step (5) saves decoding as a valid tool. For example:
  - In NLP, linearly decoding syntactic trees from BERT activations (with a margin over random baselines) is evidence of representation, as the structure emerges only after training.
  - In neuroscience, population decoding margins (e.g., higher accuracy in task-engaged brains vs. resting state) are treated as evidence of representation.

  ---

  ### How Your Colleague Can Retreat
  Your colleague can concede step (5) and retreat to a **weaker core argument** that still challenges interpretability but allows for evidence of representation:
  1. **Retreat position**: Accept that well-controlled decoding (using margins) provides evidence for the **information condition**, but argue that **intervention studies (step 6) fail to evidence the use condition**. This preserves their skepticism about "full representation" (which requires both conditions) while accepting partial evidence.
     - Why they might do this: Step (6) claims interventions only show "cheap" causal relevance due to superposition and post-hoc interpretation. Your colleague can argue this remains valid, making the use condition unattainable.

  2. **Revised conclusion**: "While decoding margins may evidence the presence of information, intervention cannot show that the system *uses* it in a non-trivial way. Thus, no system has been evidenced to *fully* represent `F` (per step 1), and interpretability cannot in principle access 'use'."

  3. **Why this is defensible**:
     - Superposition challenge: In neural networks, ablating any high-norm direction can alter behavior, but this may not reflect "use of `F`" (e.g., it could disrupt distributed computation). Post-hoc descriptions ("this direction is 'cat'") are indeed suspect.
     - Neuroscience parallel: Brain lesions often cause deficits, but debates persist (e.g., whether hippocampal lesions impair memory "use" or just information storage).
     - Philosophical out: Your colleague can maintain that "use" requires intentionality or causal history, which interventions cannot capture.

  This retreat preserves their radical view (step 9) but narrows it: interpretability might evidence *information*, but not *representation* (since representation requires both conditions). It also addresses your suspicion that steps (4) and (5) were the trouble—by conceding (5), they salvage (4) (decoding alone isn't evidence) but allow margins to work when controlled.

  ---

  ### Final Recommendation
  Focus your rebuttal on **step (5)**, using these key points:
  - "The margin *is* interpretable: it isolates the effect of learning by controlling for architectural biases."
  - "Well-controlled probes (linear, held-out data) avoid the overfitting and artifact issues in step (3)."
  - "Dismissing margins would invalidate not just interpretability, but any science using control groups (e.g., drug trials or psychometrics)."

  This refutes the strongest part of their argument (against decoding) while forcing them to defend the weaker claim that interventions cannot evidence "use." Even if they retreat, you retain (1) and gain ground: decoding margins *can* support representational claims for the information condition, keeping interpretability viable. The program isn't "impossible"—it just needs better controls and a dual focus on information and use.
