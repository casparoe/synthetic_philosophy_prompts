prompt: |-
  I keep a running list of cases in which a source of beliefs is made to vouch for itself, together with my gut verdict on each, and I would like to know whether a single principle captures the pattern or whether my verdicts are irreconcilable. I take it the central cases are instances of what gets called bootstrapping, and the standing worry is that such reasoning delivers knowledge too easily; but my list is deliberately wider than that debate.

  (1) Moore's anti-skeptical argument: I am holding up a hand; if I am holding up a hand, I am not a handless brain in a vat; so I am not a brain in a vat. Each premise is something I know, and the inference is valid, yet I judge the reasoning defective — it seems to beg the question against the skeptic.

  (2) Color bootstrapping: over the past year, whenever something has looked red to me, I have believed it was red, and nothing has come apart; from this track record of agreement between how things look and how I take them to be, I conclude that my color vision is reliable. Each individual step looks harmless, but the conclusion seems unearned — I have used the deliverances of my vision to certify the very instrument producing them.

  (3) A friend who has been drinking decides he is fit to drive: he walks a straight line, recites the alphabet backward, and concludes that his self-assessment is trustworthy on this occasion. Clearly defective, and everyone at the party recognizes it as such.

  (4) My porch thermometer: I have never compared it with another instrument, but across a year its readings have varied smoothly, tracked the seasons, and agreed with the days when I felt hot or cold; from this I conclude it is reliable. This feels entirely earned — and I cannot see how it differs from (2) except that the thermometer's outputs happen to be cross-checked against my felt sense of temperature.

  (5) Doubting whether a table is round, I look: it looks round. I run my hand around the edge: it feels round. I conclude it is round, and my confidence rises — even though sight and touch could be jointly deceived, so this too is agreement among deliverances of my own apparatus. This feels legitimate in a way that (2) does not, and the asymmetry embarrasses me.

  (6) I recompute a long sum in a different order and get the same answer; my confidence rises. But I notice my verdict flips when I vary the error I imagine: if the likely mistake is a slip, the redo feels probative; if I know I habitually forget to carry, the redo feels worthless, since the bias would repeat itself. So my verdict here is already smuggling in assumptions about how I fail.

  (7) A witness's story, told consistently across repeated interrogation by different interviewers asking unscripted questions, strikes me as thereby more likely true — as courts suppose. Yet if the interviewers merely re-ask the same questions, the consistency seems to prove nothing: a liar rehearsed on those questions would stay consistent too.

  (8) The case I cannot settle: a barometer whose readings have sat perfectly constant for a month in a sealed chamber. The manufacturer cites the constancy as evidence of reliability — a broken instrument would wander, after all — but a stuck needle produces exactly the same constancy.

  My tentative principle: a check is legitimate only if, weighted by how plausible the failure modes are, the check would probably have delivered a different verdict in the situations in which the checked belief is false. When every plausible way of being wrong would leave the check agreeing anyway, the check is empty. This seems to fit (3), (6), and (7), but I suspect it either saves everything and thereby licenses (2) — since globally inverted yet internally coherent color experience strikes me as a far-fetched failure mode — or, once the demon gets equal billing in the priors, it invalidates (5), which I refuse to give up.

  Please tell me whether there is one principle, or a small set of candidates, that captures these verdicts. State the principle precisely, motivate each clause from a case, apply it to two cases I have not listed — a mathematician re-reading a proof for a step she mis-derived from a systematic notational blind spot, and an AI system asked to double-check an answer it itself produced earlier with no access to anything independent — and be explicit about which of my verdicts it cannot accommodate, and whether accommodating them is worth the added complexity or whether the verdict should simply go.
reasoning: |-
  Okay, the user has presented a really intricate philosophical problem about epistemic justification and circular reasoning. They've compiled a list of cases where a belief source is used to validate itself, and they're struggling to find a unifying principle that matches their intuitive judgments across all scenarios. 

  First, I need to recognize this isn't just about bootstrapping in epistemology - they've deliberately expanded beyond that debate. The user is clearly well-versed in philosophy (citing Moore, mentioning priors and failure modes) but frustrated by inconsistencies in their own judgments. Their embarrassment about the asymmetry between cases (2) and (5) shows genuine intellectual honesty.

  Hmm... the core tension they've identified is fascinating: why do we accept thermometer constancy (4) as evidence of reliability but reject color constancy (2)? And why is sensory convergence (sight+touch in 5) different from internal coherence of a single sense (2)? Their proposed principle about failure modes is insightful but runs into trouble with skeptical scenarios.

  I notice they're particularly attached to case (5) - refusing to give it up even if it conflicts with their principle. That's a crucial emotional cue. The barometer case (8) seems to haunt them as unresolved, which makes sense because it perfectly illustrates the stuck needle problem.

  For the mathematician/AI test cases: the math example shows how the value of verification depends on understanding failure modes (slip vs systematic error), while the AI case exposes true circularity when there's no independent check. These both support their failure-mode principle but might need different handling.

  The user's deeper need seems to be: "Am I inconsistent or is reality messy?" They want either a clean principle that saves their intuitions, or permission to accept some inconsistencies. Their meticulous case-building suggests they'd respect complexity if justified.

  What's tricky is preserving their Moorean intuition (1) while accepting sensory convergence (5), without licensing color bootstrapping (2). This might require distinguishing between multi-source convergence vs single-source coherence. Also, their thermometer case (4) works because temperature feelings provide weak independent evidence, unlike pure color coherence.

  The resolution might lie in distinguishing degrees of independence. But I must be careful - courts accept consistent testimony (7) as evidence precisely because different interviewers provide independence. Whereas the drunk (3) has no independence at all.

  For the barometer (8), the manufacturer's constancy argument fails because the most plausible failure mode (stuck needle) produces identical output to reliability. This perfectly illustrates their principle - which suggests they're actually onto something profound.

  Ultimately their principle just needs refinement: we should weight failure modes by plausibility, not just possibility. Demons and global inversions get low weight; stuck needles get high weight. This saves (5) because sensory deception isn't the default assumption. And it explains why we trust the thermometer (4) - temperature feelings, while imperfect, make global thermoregulation failure less plausible than for colors.
answer: |-
  Your intuitions reveal a deep pattern in epistemic justification: **a source's self-checking is legitimate only when the checking procedure has *discriminative power* against *plausible* failure modes.** The core principle is:

  **Discriminative Power Principle (DPP):**  
  A self-check C for belief-source S is epistemically legitimate *only if*, given the actual limitations of S and the context, C *would likely yield different results* in scenarios where S is unreliable versus scenarios where S is reliable — and this difference tracks *plausible ways S could fail*.

  ### Key Components & Motivation from Your Cases:
  1.  **Discriminative Power (Would C differ if S fails?):**  
      Motivated by (3) Drunk Self-Test: Walking straight/repeating ABC *would not* differ if impaired (S fails) vs. sober (S reliable). Also (7) Witness Testimony: Repeating *identical* questions wouldn't differ between truth/lie; *unscripted* questions likely would.  
      *Contrast with (6) Math Redo:* Redoing in a *different order* likely catches *slips* (discriminative), not *systematic errors* (non-discriminative).

  2.  **Plausible Failure Modes (Weighted by context):**  
      Motivated by (6) Math Redo: Your verdict flips because "slip" vs. "systematic error" are *differently plausible* failure modes. Also (8) Barometer: Constancy *is* evidence against "wandering failure" (plausible for analog instruments) but *not* against "stuck needle" (equally plausible).  
      *Contrast with (2) Color Bootstrapping:* Global inversion *is* a *possible* failure, but its *plausibility* is low absent evidence (vs. thermometer drift in (4)).

  3.  **Source Limitations & Context:**  
      Motivated by (4) Thermometer vs. (2) Color Vision: The thermometer's constancy *plus* correlation with *felt temperature* (a weak independent cue) makes "global malfunction" less plausible than for color vision alone. (5) Sight+Touch: Agreement *across distinct sensory modalities* (even if fallible) makes "joint deception" less plausible than a single sense self-certifying.

  ---

  ### Applying DPP to Your Cases:
  | Case | DPP Verdict | Why | Resolves Your Tension? |
  |------|-------------|-----|------------------------|
  | (1) Moore | **Defective** | Premise ("I see a hand") *assumes* perception is reliable, failing DPP against skeptical scenarios (BIV). | Matches your verdict. |
  | (2) Color Bootstrapping | **Defective** | Agreement "looks red → believe red" *would be identical* under global inversion (plausible failure mode for a single sense). | Matches your verdict. |
  | (3) Drunk Self-Test | **Defective** | Tests (walking line, ABC) *would not differ* if impaired vs. sober. | Matches your verdict. |
  | (4) Thermometer | **Legitimate** | Constancy + correlation with felt temp makes "wandering failure" highly plausible & ruled out; "stuck at wrong value" *would* likely conflict with felt temp. | Matches your verdict. Explains diff from (2): weak independent cue raises plausibility of detectable failures. |
  | (5) Sight+Touch | **Legitimate** | Agreement *across distinct modalities* makes "joint identical deception" implausible; failures *would likely* produce *discordance* (e.g., looks round but feels jagged). | Matches your verdict. Explains asymmetry with (2): multi-source convergence has discriminative power against plausible failures. |
  | (6) Math Redo | **Contextual** | Legitimate if checking for *slips* (redo *would* differ); defective if checking for *systematic bias* (redo *wouldn't* differ). | Matches your verdict. DPP explains why your verdict flips. |
  | (7) Witness | **Contextual** | Legitimate with *unscripted* questions (answers *would likely* differ if lying); defective with *identical* questions (answers *wouldn't* differ). | Matches your verdict. |
  | (8) Barometer | **Defective (Manufacturer)** | Constancy *would not differ* between "reliable" and "stuck needle" (equally plausible failures). | Matches your verdict. |

  ---

  ### Testing DPP on Your New Cases:
  1.  **Mathematician's Proof Re-Read:**  
      - **Scenario:** A mathematician re-reads her proof to check a step derived from a *systematic notational blind spot* (e.g., misinterpreting "⊆" as "⊂").  
      - **DPP Analysis:**  
          - *Plausible Failure Mode:* Systematic notational misunderstanding.  
          - *Discriminative Power?* Re-reading the *same* proof with the *same* blind spot *would not* produce a different result. Failure mode isn't challenged.  
      - **Verdict:** **Defective self-check.** This is epistemically circular. She needs an *independent* method (e.g., peer review, alternative notation).

  2.  **AI System Self-Check:**  
      - **Scenario:** An AI double-checks its own prior answer with no independent inputs or algorithms.  
      - **DPP Analysis:**  
          - *Plausible Failure Modes:* Algorithmic bias, training data flaw, corrupted weights.  
          - *Discriminative Power?* Re-running identical software/data *would not* yield different results under *systemic* failures. Only detects transient glitches.  
      - **Verdict:** **Defective self-check.** Lacks discriminative power against plausible systemic errors. Requires external validation (e.g., different model, human input).

  ---

  ### Where DPP Stands:
  - **Accommodates all your verdicts** without inconsistency by emphasizing:  
      (a) *Discriminative power* (not just coherence),  
      (b) *Plausible* (not just possible) failure modes,  
      (c) *Contextual independence* (e.g., multi-modal senses, weak external cues).  
  - **Resolves the tension with (2) and (5):**  
      - (2) fails because single-sense coherence lacks discriminative power against inversion (a *possible* failure made salient by the bootstrapping context).  
      - (5) succeeds because multi-modal agreement *does* have discriminative power against *plausible* perceptual errors (discordance is likely if wrong).  
  - **Handles skepticism gracefully:** DPP allows rejecting (1) Moore and global demons without invalidating (4) or (5) because demons are *implausible* absent evidence, while instrument drift/stuck needles are *plausible*.

  ### Added Complexity? Worth It.
  DPP requires assessing plausibility and discriminative power contextually, but this mirrors actual epistemic practice (e.g., courts demanding *unscripted* questions, scientists valuing diverse instruments). Simpler principles (e.g., "no self-support") over-reject (e.g., thermometer) or over-accept (e.g., color bootstrapping). **DPP captures the nuance your cases demand.**

  ---

  **Final Answer:** Your verdicts *are* reconcilable under the **Discriminative Power Principle**. It licenses earned self-checks (thermometer, senses) while blocking empty ones (drunk, color bootstrap), using plausibility-weighted discriminative power as the key criterion.
