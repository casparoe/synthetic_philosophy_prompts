prompt: |-
  hey so i need help with a satire assignment for my english class. the teacher wants satire that "engages with a real idea" (her words) and im doing chestertons fence / burkean conservatism, which we learned about last unit. heres my idea and i want you to write the actual piece

  the setup: a company (give it some generic corporate name) that took chestertons fence and turned it into literal policy — no procedure can be changed or removed until someone can document why it was put there in the first place. sounds reasonable right. problem is the company is like 80 years old and nobody remembers why anything exists, and theres a companion rule that the reason has to be established from written records only (no just calling up retired employees, thats "hearsay" in universe), and also half the archive is in a basement that flooded in 2011. so over the decades the whole place has turned into fence archaeology — theres a whole department whose job is reconstructing why expense reports get photocopied three times, or why the vending machine has a seat on some committee (that one turns out to be a typo from 1962 nobody was allowed to fix)

  the punchline should definately be this: an intern finally digs up documentary proof that one of the companys biggest sacred rituals started as a prank by some guy in 1971, meaning it never guarded anything at all. so the precedent committee has to vote on whether "the reason a fence was built" and "a reason the fence would be missed" are the same thing. they deadlock. the fence stays.

  the humor has to come from the actual philosophy, not generic office comedy — like the burkean bet that traditions encode reasons weve forgotten, the epistemic humility about reformers who think they know better than accumulated practice, but also the way that can curdle into venerating whatever just happened to survive, even when the surviving thing only survived because fixing it was more paperwork than keeping it. keep it deadpan throughout, like the memo author thinks the system is working beautifully.

  format: write it as an internal memo from the office of continuity and precedent, around 600 words. start directly with the memo itself, no intro, no preface, no commentary — the memo should be the first thing in your response. youre allowed one short line after the memo (like a postscript where the intern complains) but nothing beyond that.

  ps nobody in the piece should explain the fence idea, everyone there already knows it cold, thats part of the joke. also my teacher reads these so dont make it too crude lol
reasoning: |-
  Okay, the user needs help with a satire assignment for their English class. The teacher wants satire that "engages with a real idea," specifically Chesterton's fence and Burkean conservatism. The user has a detailed idea about a company that takes Chesterton's fence literally as policy. 

  First, I need to understand the core concepts. Chesterton's fence is the principle that reforms shouldn't be made without understanding why existing structures were created. Burkean conservatism emphasizes the value of tradition and accumulated wisdom. The user's idea satirizes how this can lead to bureaucratic absurdity when traditions are preserved without understanding their origins.

  The user's scenario involves an 80-year-old company where no procedure can be changed without documented proof of its original purpose. The humor comes from the impossibility of this task—records are lost, archives flooded, and departments dedicate resources to "fence archaeology." The punchline is an intern discovering a significant tradition started as a prank, yet it remains due to procedural deadlock.

  The user's instructions are specific: write a 600-word internal memo from the Office of Continuity and Precedent. The memo should be deadpan, as if the author believes the system works perfectly. No explanations of the fence concept since everyone in the company knows it. End with a short intern's postscript.

  Key points to include:
  - Company name: Something generic and corporate, like "Veridian Dynamics."
  - Absurd policies: Expense reports photocopied three times, a vending machine on a committee (due to a typo).
  - The big reveal: A sacred ritual was a 1971 prank.
  - The deadlock: Debate over whether the original reason and the reason it's missed are the same.
  - The fence stays.

  The humor must stem from the philosophy itself. Highlight the tension between epistemic humility and the veneration of surviving traditions, even when irrational. Avoid generic office comedy; focus on the logical extremes of Burkean conservatism.

  Structure the memo:
  1. Header: To, From, Subject following corporate format.
  2. Body: Detail the intern's discovery, the investigation process, the committee's deadlock. Use formal, bureaucratic language.
  3. Maintain deadpan tone: The author sees this as a successful outcome, ignoring the absurdity.
  4. Postscript: Intern's resigned comment for contrast.

  Ensure the piece is classroom-appropriate. Avoid crude humor. The satire should be sharp but respectful, showcasing understanding of the philosophical concepts.
