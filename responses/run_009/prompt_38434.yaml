prompt: |-
  Our national sailing federation is rethinking how it certifies instructors, and I need a decision memo drafted for the committee's spring meeting. Current rules require every instructor candidate to hold a current racing skipper certificate — proof, in effect, that they can still perform the maneuvers they would be licensed to teach. A pending proposal would drop that requirement and instead test candidates through a demanding written and oral examination covering seamanship theory, the aerodynamics of sail and rig, right-of-way rules, and teaching method, followed by a supervised practicum in which the candidate explains each maneuver to novices while a qualified skipper demonstrates it. The proposal's backers note that some of our best examiners have not raced in years, and that some of the best racers make poor teachers. Opponents insist that you cannot teach what you cannot do, and that we would be licensing instructors who could talk students into situations they could not get them out of.

  I suspect the dispute has a conceptual layer we keep talking past. Some members hold, roughly with Ryle, that a skill is not a stock of true propositions plus rehearsal — that there is a real difference between being able to state the procedure for a gybe in a sudden squall and knowing how to gybe in one. Others reply, in the spirit of the intellectualist rejoinder, that if a candidate knows in the right way what a good gybe consists in and how to bring one about, nothing testable remains untested: whatever an examiner could point to is either propositional knowledge or the ability to demonstrate, and the demonstrating skipper covers the latter. Neither side has addressed a third wrinkle: our recency rule appears to conflate knowing how with currently being able. A master racer sidelined by injury plainly still knows how to race, which tells against the current rule; yet it also does not follow that everyone who once could do something still knows how, which tells against simple grandfathering.

  Please draft the memo I will circulate. It should recommend a concrete course of action — approve the proposal outright, reject it, or approve it with conditions you specify — and give full weight to the strongest consideration on the losing side rather than restating the rulebook. In particular, it should address: whether teaching a skill requires possessing it; whether knowledge-that plus generic teaching competence can substitute for performance ability, and what, if anything, our proposed examination could not detect; how the distinction between retaining a skill and currently being able to exercise it should shape whatever recency or requalification requirement we adopt; and what observable failure by a licensed instructor would count as evidence that the committee chose wrong. Write it in American English, and keep it short enough to be read before the vote.
reasoning: |-
  Okay, the user needs a decision memo for their national sailing federation's committee meeting regarding instructor certification. Let me break down the key points from their query.

  The current rule requires instructor candidates to hold a racing skipper certificate. The proposal wants to replace this with a written/oral exam on theory and a practicum where candidates explain maneuvers while a qualified skipper demonstrates. Supporters argue that some examiners haven't raced recently but are still effective, and good racers aren't always good teachers. Opponents believe you can't teach what you can't do, risking instructors getting students into unsafe situations.

  The user points out three philosophical angles: Ryle's view that knowing how isn't just propositional knowledge, the intellectualist counter that proper knowledge includes the ability to demonstrate, and the issue conflating current ability with retained skill. They also mention the problem of a lapsed ability versus someone who's retained the skill despite not practicing recently.

  The memo needs to recommend a concrete action: approve, reject, or approve with conditions. It must address whether teaching requires possessing the skill, if knowledge-that plus teaching competence can substitute performance, how to handle recency/requalification, and what observable failures would indicate a wrong choice.

  I'm leaning towards approving the proposal with conditions. The practicum with a qualified skipper covers the demonstration aspect, addressing the safety concern. The written and oral exams test theoretical knowledge and teaching methods. The key gap is ensuring the candidate's ability to assess and correct mistakes during the demonstration, which the practicum should include. 

  Adding a condition where the candidate must identify and explain errors during the practicum would cover this. For recency, the federation should require proof of recent experience (within 5 years) or a requalification test. This respects the distinction between retaining a skill and current ability. 

  Observable failures would be instructors unable to diagnose problems or getting into unsafe situations. This setup balances both sides: the intellectualist view is covered by exams and the practicum, while Ryle's concern is addressed by the skipper's demonstration and the candidate's real-time analysis. 

  The user's deeper need is a practical, philosophically sound solution that ensures safety and effective teaching without unnecessary barriers. They want the memo concise, addressing the core issues without rehashing arguments. I'll structure the memo with clear sections: recommendation, reasoning, conditions, and implementation steps.
answer: |-
  **MEMORANDUM**  
  To: National Sailing Federation Certification Committee  
  From: [Your Name/Title]  
  Date: April 24, 2025  
  Subject: Recommendation on Proposed Instructor Certification Reforms  

  ### **Recommendation**  
  Approve the proposal to replace the current racing skipper certificate requirement with the new examination structure, **subject to the following critical amendments**:  
  1. **Practicum Enhancement**: Candidates must not only explain maneuvers but also *diagnose and correct deliberate errors* introduced by the demonstrating skipper during the practicum.  
  2. **Recency Safeguard**: Implement a 5-year recency rule requiring instructors to either (a) log 10+ hours of verified on-water coaching, or (b) pass a condensed skill-retention assessment.  

  ---

  ### **Analysis of Core Issues**  
  **1. Does teaching require current possession of the skill?**  
  No—*if* the assessment verifies *pedagogical mastery* and *contingency planning*. A skilled teacher can articulate principles, anticipate errors, and direct corrective action without physically executing maneuvers. The proposal’s practicum (with a qualified demonstrator) addresses "doing," but must also test the candidate’s capacity to *troubleshoot failures in real-time*.  

  **2. Can knowledge-that + teaching competence substitute for performance ability?**  
  **Partially.** The proposed exam effectively tests:  
  - *Knowledge-that* (aerodynamics, rules, theory)  
  - *Teaching method* (communication, lesson structure)  
  - *Procedural knowledge* (via verbal explanation of maneuvers)  
  **Gap:** It cannot confirm the candidate’s ability to *visually diagnose flawed execution* or *improvise solutions* under stress. Our amended practicum closes this gap by requiring error-correction.  

  **3. Retained Skill vs. Current Ability**  
  The current rule wrongly assumes "current ability" is the sole proof of "retained skill." Conversely, grandfathering risks certifying those with *lapsed* competence. Our amended recency rule balances this:  
  - **Coaching logs** validate retained knowledge through teaching.  
  - **Skill-retention assessments** (e.g., biannual simulation-based testing) verify ongoing capability without demanding full racing recertification.  

  **4. Observable Failure Indicating Policy Error**  
  Evidence of systemic failure would be:  
  > *"Licensed instructors repeatedly failing to prevent or resolve dangerous on-water situations during training, despite correct verbal instruction."*  
  This would signal inadequate testing of *diagnostic* or *contingency-planning* skills.  

  ---

  ### **Why This Approach?**  
  - **Strengthens teaching quality**: Prioritizes pedagogical skill over racing prowess.  
  - **Safeguards integrity**: Error-correction in the practicum ensures candidates can "talk students out of trouble."  
  - **Balances perspectives**: Addresses opponents’ safety concerns while advancing the proposal’s goal of certifying expert teachers.  

  ### **Implementation Timeline**  
  - Phase 1 (2025): Pilot amended practicum with select examiners.  
  - Phase 2 (2026): Full rollout; recency logs/assessments begin.  

  ---  
  **Approving this proposal with these conditions leverages the best of both paradigms: certifying educators who may not race, while ensuring they possess the discernment to keep students safe.** I move for a vote.  

  *Attachment: Revised Examination Protocol Details*
