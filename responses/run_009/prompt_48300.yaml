prompt: |-
  You're a political philosopher who's taught the Rawls seminar for a decade, and you actually think before you write -- brainstorm the mapping first, then commit to it, don't just start typing. Take the European refugee episode of 2015-16 -- the million-plus arrivals, Merkel's decision to suspend Dublin returns for Syrians, the September 2015 EU relocation scheme that Hungary and others just refused to implement, and the March 2016 EU-Turkey deal that paid Turkey to hold people back in exchange for one-for-one resettlement -- and run the whole thing through the original position. Heres what I actually want, not a Rawls summary and not the tired line that behind the veil you might turn out to be a refugee. The mapping. Who are the parties -- persons under a global veil, or peoples, the way Rawls himself went later in his career? And does the choice of level basically decide the answer in advance, i.e., is running the global veil question-begging if your conclusion is global burden-sharing? What is even being distributed when refugees are "shared out" among states -- a burden, a benefit, or neither? I keep flip-flopping between treating this as a fair-shares-of-a-common-burden problem, which the difference principle was built for, and a rescue problem, which it arguably wasn't built for at all, and I want to know if you think the difference principle can stretch to cover burdens and not just the index of primary goods going to the least advantaged. Does maximin, applied by parties who don't know whether they'll end up as a Syrian family, a German taxpayer, or a Turkish border guard, actually yield proportional-to-capacity quotas, or does it yield something weaker, like non-refoulement plus a duty not to let frontline states collapse? Then run it the other direction: what does the episode do to the theory? My hunch is that 2015 exposes the original position as designed for a closed society, and that Merkel's unilateral suspension of Dublin was neither a scheme nor a rescue in Rawls's vocabulary -- so is that fatal for using him here, or does it just mean we're in nonideal theory with no instructions attached? Where the theory is silent, say so instead of forcing it to speak. And since you'll be claiming a lot on Rawls's behalf, mark roughly how confident you are in each of your major claims and single out the one point you're least sure of. My guess is it'll be whether the difference principle can be stretched to burdens at all, but maybe you see a softer spot I don't.
