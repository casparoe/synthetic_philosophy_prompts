prompt: |-
  I'm a backend engineer and, by accident of being the one person who didn't leave the meeting room fast enough, I now sit on the charity-giving committee at my company (about 400 people, based in Reading). Every year we hand out roughly £45,000 — a mix of what staff raised through bake sales and marathons plus a company match that gets topped up pound for pound. Historically it's all gone to local stuff: the food bank where Priya from finance volunteers, the air ambulance, the primary school one of the directors is a governor at. This year it's blown up. One of our data scientists, Sam, circulated a long internal post arguing we're basically walking past a drowning child every single day. His thought experiment: if you passed a kid drowning in a shallow pond on your commute, you'd wade in and ruin your £200 trainers without a second thought, and if you wouldn't, something is seriously wrong with you. So why does it matter that the kids who need help are far away, or that our money travels through a charity rather than through our own arms? He wants the whole pot to go to whichever charity demonstrably saves the most lives per pound — on his numbers that's malaria prevention work — and he thinks keeping any of it local is like only being willing to rescue the child if it happens to float past our office window.

  Dave from facilities is furious. His side of it: the company isn't a person walking past a pond, it has roots here, half the staff gave precisely because of the local connection, and the morale effect of seeing the food bank van with our logo on it is part of what makes people donate at all. Someone floated a compromise — treat the staff-raised money as the sentimental bit that stays local, and point the company's own match at the most effective charity, on the grounds that staff have feelings about their bake-sale money but the company doesn't have feelings. Another wrinkle people keep tripping over: Sam's example is a one-off rescue, whereas what we're deciding is a standing policy, and a couple of members feel uneasy about locking the commitee into maximum-effectiveness forever, as if we'd never again be allowed to buy the scouts a new tent. Dave also keeps insisting it must matter that if we do nothing, no child drowns *because* of us — we're just not rescuing, not drowning anyone — which Sam says is nonsense but didn't manage to argue very well in the meeting. There was also a brief tangent about whether it changes anything that loads of other companies in town give nothing either, which nobody resolved.

  I have to circulate a decision memo before Thursday's meeting and I'm genuinely out of my depth, so please take this seriously. Act as a professional moral philosopher who's spent a career on duties of rescue but who can write for engineers rather than for a journal. Before you write anything, brainstorm the strongest version of each side, plus the compromise — including the weirder questions: does it matter whose money it is and whether money can carry sentiment, whether distance should matter at all, whether a standing policy differs morally from a one-off rescue, and whether it changes things if everyone else also fails to give. Then commit to a concrete recommendation the committee can actually vote on, including a split and a rough process for next year. Handle the strongest point on the losing side seriously rather than smacking down a strawman — Dave is definitely going to read this. Around 700-800 words, plain English, and no philosophers' names or citations, just the arguments themselves. Thanks!
reasoning: |-
  Okay, the user is a backend engineer who's been roped into a charity committee at their company. They're dealing with a heated debate between Sam, who wants all funds to go to the most effective global charity (like malaria prevention), and Dave, who insists on keeping donations local for community impact and morale. There's also a proposed compromise to split the funds. The user needs a balanced memo that addresses moral philosophy in plain English for engineers, without academic jargon.

  First, I need to unpack both sides' arguments. Sam's drowning child analogy is powerful—it highlights that distance shouldn't morally matter when saving lives. His cost-effectiveness approach could save more lives per pound, which is hard to ignore. But Dave raises valid points too: local giving builds community ties, motivates staff donations, and fulfills the company's role as a local stakeholder. The "roots" argument isn't just sentimentality—it's about sustaining engagement. 

  The compromise (staff-raised money local, company match global) seems practical, but I should scrutinize its assumptions. Can money really be split between "sentimental" and "rational" buckets? Staff might feel ownership over their bake sale proceeds, but the company's match isn't emotionless either—it reflects corporate values. Still, it might ease tensions psychologically. 

  On the weirder questions: distance *feels* irrelevant morally (a life saved is a life saved), but humans are wired to prioritize the proximate. That doesn't make it right, but dismissing it entirely ignores human nature. The standing policy vs. one-off point is tricky—committing to "maximum effectiveness forever" could feel rigid, but Sam might counter that consistency maximizes impact. And Dave's "we're not drowning the child" stance? Technically true, but philosophically thin—inaction isn't neutral when you *could* act. The "other companies give nothing" tangent is a red herring; two wrongs don't make a right. 

  For the recommendation: the compromise is the most viable. It acknowledges both moral urgency and human psychology. Splitting the pot 50/50 (staff local, match global) with a sunset clause for review balances principle with flexibility. I'll emphasize this isn't moral equivalence—it's pragmatic navigation of competing goods. Dave's concerns deserve weight: phrases like "deliberately constrained" local impact show respect. Metrics for both sides will help next year's evaluation. Crucially, the memo must avoid strawmanning either side—engineers hate sloppy logic. Plain English, zero jargon, and actionable next steps (vote options, review process) will signal this is for *doing*, not debating. 

  Final polish: the drowning child analogy stays because it's the core conflict, but I'll reframe it as "expanding the pond" rather than dismissing local aid. Tone is key—no smugness, just clarity on why both sides have wisdom. And always looping back to "what we can actually implement Thursday." Phew.
answer: |-
  ## Charity Committee Decision Memo: Recommendation & Rationale

  **To:** Charity Committee  
  **From:** [Your Name], Backend Engineer & Reluctant Committee Member  
  **Date:** 19 May 2024  
  **Subject:** Recommendation on Allocation of 2024 Charity Fund (£45,000)  

  ### The Situation
  We have £45,000 to allocate: a mix of staff-raised funds (£22.5k est.) and company match (£22.5k). Sam advocates sending *all* funds to the globally "most effective" charity (e.g., malaria prevention), arguing that distance and local ties are morally irrelevant when lives are at stake. Dave argues *all* funds should stay local, citing community roots, donor motivation, and corporate responsibility here in Reading. A compromise proposes splitting: staff-raised funds local, company match global.

  Before recommending, let’s clarify the strongest arguments fairly:

  ### Core Arguments Examined

  1.  **Sam’s Case (Global Effectiveness):**
      *   **The Core Analogy (Strengthened):** If you *knew* you could save a child drowning 5 miles away by ruining your shoes (costing £200), refusing because they aren't *right in front of you* seems indefensible. Distance doesn't change the moral duty to save a life when you can. Our donations are that £200 – the location of the child shouldn't matter.
      *   **Scale of Impact:** Evidence suggests certain global interventions (e.g., bed nets, deworming) save or drastically improve lives for pennies on the pound compared to most local causes. £45k *could* prevent dozens of deaths or hundreds of illnesses. Choosing a less effective local charity over this means preventable deaths occur – deaths we could have stopped.
      *   **Sentiment vs. Impact:** While local causes feel closer, the *actual harm* prevented by highly effective charities is objectively greater. Prioritising sentiment over vastly greater impact is like choosing to save the child floating past your window *instead of* the one 5 miles away you *know* you could also save with the same effort.

  2.  **Dave’s Case (Local Focus):**
      *   **The Company as Community Member (Strengthened):** We’re not a detached individual passing a pond. We’re an organisation embedded in Reading. Our staff live here, volunteer here (like Priya at the food bank), and send their kids to local schools. Giving locally isn't just charity; it's investing in and strengthening the shared community that supports *us*. Ignoring this responsibility erodes our social fabric.
      *   **Motivation & Sustainability:** Staff bake sales and marathon runs are fueled by seeing *direct*, tangible impact – the food bank van with our logo, the scouts' new tent. Removing this local connection risks killing the goose that lays the golden egg. Lower donations in future years mean *less total good* overall, locally *and* globally.
      *   **"Not Drowning the Child" Nuance:** Dave’s point isn't that inaction is neutral, but about *proximity of harm*. If we don't fund the local food bank, its existing funding gap remains; we didn't *cause* hunger here. If we don't fund malaria nets, children still die from malaria – but we didn't *introduce* malaria. Our choice is about which *preventable harm* we alleviate, not causing harm directly. Our primary *obligation* might reasonably lie closest to home.

  3.  **The Compromise (Split by Fund Source):**
      *   **Acknowledges Psychology:** Staff *feel* ownership over money they raised sweating at bake sales. Directing *their* effort locally respects that emotional investment and sustains motivation. The company match, funded by corporate profits, carries less personal sentiment and can be allocated "coldly" for maximum global impact.
      *   **Practical Bridge:** It directly addresses the core tension: sentimental/local connection vs. global scale/efficiency. It allows both significant impacts to happen.
      *   **Potential Weakness:** Is money truly "sentimental"? Does £1 from a bake sale *really* differ morally from £1 of company profit? Philosophically, money is fungible. However, *psychologically* and for *donor engagement*, the source matters deeply to the people whose continued participation we need.

  ### Addressing the "Weirder" Questions

  *   **Does distance matter morally?** Sam's strongest point: Morally, a life saved is a life saved. Distance alone isn't a justification for prioritising a closer life *if* you can save more lives farther away with the same resource. *However*, Dave counters: our *specific relationships* and *embeddedness* in the local community create unique obligations that don't vanish simply because greater need exists elsewhere.
  *   **Standing Policy vs. One-Off?** A standing policy *does* differ. A one-off rescue has immediate, clear actors and victims. A policy involves ongoing trade-offs. Locking into "maximum effectiveness forever" feels rigid and ignores that contexts (local disasters, new evidence on effectiveness) or our understanding of obligations might evolve. We need flexibility, not dogma.
  *   **"Everyone else fails" Argument:** Irrelevant. Our duty isn't negated because others shirk theirs. We control our £45k; what others do doesn't change what *we* should do with it.

  ### Recommendation & Concrete Proposal

  I recommend **adopting the Compromise Approach for 2024, allocating the funds as follows:**

  1.  **Staff-Raised Funds (~£22,500):** Allocated to **local charities** within the Reading area, as per our traditional process (committee review of applications, staff suggestions like food bank, air ambulance, schools, scouts). *Rationale:* This directly respects the emotional investment and motivation of the staff donors, sustains vital local connections, and maximises the likelihood of continued strong staff fundraising.
  2.  **Company Match Funds (£22,500):** Allocated to one or more **globally effective charities** demonstrably achieving the highest impact per pound (e.g., malaria prevention via AMF, GiveWell recommendations). *Rationale:* This leverages the significant additional power of the company's contribution to address severe suffering where £1 goes much further, fulfilling the moral imperative to do the most good possible with these resources, without undermining local engagement.

  **Voting Option:**  
  *   **Option A:** Adopt the above compromise split (Staff Local / Company Global).  
  *   **Option B:** Allocate 100% to local charities.  
  *   **Option C:** Allocate 100% to maximum global effectiveness charities.

  **Why This Compromise (and not 100% either way)?**

  *   **Balances Moral Urgency with Human Reality:** It acknowledges the powerful moral force of Sam’s argument about scale and distance without dismissing Dave’s crucial points about community roots, obligations, and the *practical reality* of donor motivation. Sending *some* money globally saves lives we otherwise wouldn't touch. Keeping *some* local sustains the ecosystem that generates the funds.
  *   **Respects Fund Source Psychology:** While money is fungible philosophically, the *feeling* of ownership matters enormously to our colleagues who donate their time and effort. The compromise respects this.
  *   **Practical and Sustainable:** It offers a path forward the committee can likely agree on, preserves staff goodwill and participation, and delivers significant benefit both locally *and* globally.
  *   **It's Not Moral Equivalence:** This isn't saying both sides are equally "right" on pure ethics. Sam’s point about the scale of preventable suffering is profound. However, Dave’s point about our specific context and the *mechanism* of our giving (reliant on motivated staff) means pure effectiveness isn't the *only* operational factor. This is a pragmatic navigation of competing goods.

  **Addressing Dave's Strongest Point:**  
  Dave, your concern about our roots in Reading and the motivational power of local impact is absolutely valid and critical to our success. This compromise *deliberately* directs half the pot locally to honour that. It ensures we continue supporting the community we are part of, keeping staff engaged and the fundraising engine running. Failing to do this risks undermining the very fund we’re allocating. This isn't dismissing global need; it's recognising the foundation upon which our giving rests.

  **Process for Next Year:**  
  1.  **Track Impact:** For local grants, document tangible outcomes (e.g., meals provided, equipment funded). For the global portion, use the charity's reported metrics (e.g., nets distributed, lives saved estimates).  
  2.  **Gather Feedback:** Survey staff anonymously on their donation motivation and feelings about the split.  
  3.  **Review in Q1 2025:** Present the data and feedback to next year's committee. Did global allocation demotivate staff? Did local impact feel sufficient? Did the evidence for global effectiveness hold? This informs whether to continue, adjust the split, or change approach.  

  This approach allows us to act decisively now with a balanced solution, build real-world evidence, and retain the flexibility to adapt based on what we learn. I urge the committee to support **Option A**.
