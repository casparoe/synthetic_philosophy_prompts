prompt: |-
  Whenever corruption comes up in conversation I end up giving inconsistent answers, so I've decided to just list my gut verdicts on a bunch of cases and figure out whether there's an actual principle in there. Tipping a waiter 20%: obviously fine, borderline obligatory. Giving the surgeon an expensive bottle of wine after a successful operation: sweet, fine. Giving the same surgeon the same bottle the week before the operation: not fine. A businessman in a country where it's customary gives a generous cash gift at the wedding of a licensing official's daughter — no specific favor is ever asked for, but the businessman's permit application is pending: I say not fine, though I squint at myself for that one. A politician promises to pave a village's road if the village votes as a bloc for him (the classic clientelism setup): bad. A congressman channels a federally funded bridge to his home district through completely ordinary budget politics, and the district rewards him with reelection, which everyone understands: somehow fine, just "how politics works," even though it smells like vote-buying with an extra step. A $20 payment to a customs clerk to "speed up" paperwork: not fine in principle, and yet when a colleague admitted doing exactly that on a trip I felt almost no moral charge, way less than I feel about the wedding gift. And here's the one that really bugs me: an old friend who now works in the permits office expedites my file because we go way back, no money changes hands at all — my gut says fine, that's just friendship, even though I'm clearly getting privileged access to a public process.

  My working theory so far has been something like: it's corruption when there's a specific quid pro quo for the exercise of official judgment. But that theory is already in trouble — the pre-surgery wine doesn't involve any explicit ask, the pork-barrel congressman isn't promising anyone anything in so many words, and the friend at the permits office isn't selling anything, he's just being a friend. Meanwhile the wedding gift case, where there is literally no favor asked, feels worse to me than the customs tip, where there definitely is one.

  So: is there a principle that gets all or most of these verdicts? I suspect it's something like "public role must be kept impersonal" versus something like "official judgment must not be for sale," and those two come apart exactly on my cases (the friend, the post-op wine, the pork). Please tell me which verdicts I should drop if it comes to that — I'd honestly rather overturn one of my gut calls than bolt on three epicycles. And then tell me what the winning principle says about a case I haven't decided on: a diaspora guy who, when his cousin's visa paperwork is stuck, calls a ministry friend from his hometown and gets it unstuck, in a country where pretty much everyone would do the same. Is that corruption, favoritism, or neither, and does my whole pattern of verdicts just amount to taking the Weberian ideal of an impersonal bureaucracy as the standard — in which case, is that standard actually universal, or is it just the one my culture handed me?
reasoning: |-
  Okay, let's tackle this user's dilemma. They've listed various scenarios where they have gut reactions about what's corrupt and what's not, but they can't find a consistent principle. They want to know if there's a unifying idea or if they need to adjust their judgments.

  First, I need to parse each case they mentioned. Tipping a waiter is fine, but pre-op wine to a surgeon isn't. The wedding gift with a pending permit feels wrong, but the customs bribe doesn't evoke the same moral charge. The friend in the permits office helping out feels okay because of friendship, but that seems like privileged access. Their initial quid pro quo theory doesn't hold because some cases without explicit exchanges still feel corrupt.

  The user's deeper struggle is between impersonal bureaucracy and personal relationships in official duties. They mention Weberian ideals, so cultural relativity is a concern. They also want to know if they should change some gut verdicts for consistency.

  Looking at the principles, the key seems to be whether public roles are misused. The surgeon's pre-op gift implies influencing judgment, while post-op is a gift. The wedding gift, while no explicit ask, creates an expectation due to the pending permit. The pork-barrel politics is accepted as systemic, even if it's vote-buying, because it's part of budget allocations. The friend expediting the permit misuses their role for personal ties, which is corrupt even without money. The customs bribe feels less wrong to the user, possibly because they see it as a victimless necessity in inefficient systems, but it still violates impartiality.

  The visa case with the diaspora cousin involves using personal connections to bypass bureaucracy. Even if culturally accepted, it's favoritism because it gives unfair access. The user's reactions align with the principle that official decisions should be based on merit, not personal ties or gifts. They might need to adjust their view on the customs bribe and recognize that both the friend in permits and the diaspora case are corrupt under this principle.

  The user might be reluctant to call the friend scenario corrupt because friendship feels natural. But the principle requires separating personal relationships from professional roles. They should also consider if systemic issues (like inefficient customs) make some bribes seem less wrong, but the act still undermines institutional integrity.

  In conclusion, the winning principle is maintaining the separation of personal and official spheres. The user should drop the gut call that the customs bribe is less bad and accept that the friend's help is corrupt. The diaspora visa case is also corruption, as it privileges personal connections over fair process, regardless of cultural norms.
answer: |-
  Your gut reactions are remarkably consistent once we apply a refined principle. The core issue isn't just quid pro quo or money changing hands; it's **whether a *public or entrusted role* is being exercised based on *personal considerations* rather than the *impersonal criteria* inherent to that role.** This principle explains your judgments and highlights where you might need a slight adjustment:

  **The Winning Principle:**
  **Corruption occurs when an agent entrusted with impartial judgment (public official, professional gatekeeper, etc.) allows *personal considerations* (gifts, favors, relationships, debts, future benefits, or threats) to influence decisions that should be made based on *impersonal criteria* (merit, need, law, procedure, established rules, professional standards).**

  **Applying the Principle to Your Cases:**

  1.  **Tipping a waiter 20%:** Fine. The waiter's role (service) is inherently personal and discretionary. Tips are a recognized part of the compensation structure and incentive for good service within the system. *Impersonal criteria (e.g., food quality) are set by the kitchen; service quality is personal.*
  2.  **Giving surgeon expensive wine AFTER a successful op:** Fine. The judgment (surgery) is complete. This is gratitude for past action, not influencing future judgment. The surgeon's role *during treatment* remained impersonal. *No future judgment is being influenced.*
  3.  **Giving surgeon wine BEFORE the op:** Not Fine. The gift creates a personal obligation/consideration that could (or appears to) influence the surgeon's *future* professional judgment (how much effort, priority, care?), which should be based solely on medical need and professional standards. *Personal consideration introduced before judgment.*
  4.  **Wedding gift to official with pending permit:** Not Fine. **Your gut is correct.** The *timing and context* create an undeniable personal consideration (a significant gift) directly tied to a pending official judgment. The lack of an explicit ask is irrelevant; the social pressure and implied expectation corrupt the official's duty to judge the permit application impartially. *Personal gift influences pending impersonal judgment.*
  5.  **Clientelism (Road for Votes):** Bad. The politician is *explicitly* conditioning a public good (road) on a personal action (voting bloc), subverting the impersonal criteria governing both infrastructure allocation (need, fairness) and voting (free choice). *Public decision tied to personal political action.*
  6.  **Pork-barrel bridge & reelection:** **Here's your first gut call needing adjustment.** This *is* a form of corruption under the principle, albeit systemic and legalized. The congressman uses public funds (impersonal resource) to generate personal political benefit (reelection) by targeting benefits based on political loyalty/calculation rather than solely on impersonal criteria like national need, cost-benefit analysis, or fair regional allocation. Voters reward the personal benefit, not necessarily the impersonal merit. It violates the spirit of "impersonal criteria" for resource allocation, even if it's "how politics works." *Public resource allocation influenced by personal political gain.* **Verdict: Should feel worse/more corrupt than your gut says.**
  7.  **$20 to customs clerk to "speed up":** Not Fine. **Your *lack* of moral charge needs adjustment.** The clerk is accepting a personal benefit (cash) to perform their normal duty (processing paperwork), subverting the impersonal criteria governing queue order (first-come, first-served, priority based on urgency/type). This creates a two-tier system based on bribes. It feels "victimless" or "necessary" due to inefficiency, but it fundamentally corrupts the process. *Personal payment subverts impersonal procedure.* **Verdict: Your moral charge *should* be higher.**
  8.  **Friend in permits office expedites your file:** Not Fine. **Your gut is wrong here.** The friend is using their *official power* (expediting) based solely on a *personal relationship* (friendship). This bypasses the impersonal criteria (queue order, standard review process, perhaps merit) that should govern access to that public service. "Friendship" becomes the currency buying privileged access. *Personal relationship influences exercise of official power.* **Verdict: Should feel less fine.**

  **Resolving the Tensions:**

  *   **Quid Pro Quo vs. Implied Influence:** Your principle handles this. The pre-op wine, wedding gift, and expedited file all introduce personal considerations *before* or *during* the exercise of judgment, regardless of explicitness. The post-op wine does not.
  *   **"How Politics Works" (Pork):** This reveals the flaw in accepting systemic violations of impersonality just because they are common or legal. Pork-barrel politics prioritizes personal/political gain over impersonal public good in resource allocation.
  *   **Friend vs. Customs Bribe:** Your gut downplays the friend because money isn't involved and it feels "natural." But the principle shows both are corrupt: one uses cash, the other uses social capital; both bypass impersonal rules for personal benefit.
  *   **Customs Bribe Moral Charge:** Its seeming triviality and perceived necessity in a broken system mask the core corruption: replacing rules with personal payments. Your colleague normalized it, but the principle violation is clear.

  **The Diaspora Visa Case:**

  *   **Verdict:** **Corruption/Favoritism.**
  *   **Why:** The ministry friend exercises official power (unsticking paperwork) based on a *personal connection* (hometown cousin) rather than the *impersonal criteria* governing visa processing (queue order, documentation completeness, eligibility rules). "Everyone does it" doesn't change the nature of the act; it highlights a systemic failure of impersonality. It privileges connections over fairness and procedure.

  **The Weberian Ideal & Cultural Relativity:**

  You've nailed it. Your pattern strongly aligns with Max Weber's ideal of a rational-legal bureaucracy characterized by **impersonality** – officials making decisions based on rules and objective criteria, not personal feelings, relationships, or benefits. This *is* the standard embedded in modern Western governance and professional ethics.

  *   **Is it universal?** Not inherently. Many cultures operate more on patronage, clan loyalty, or personal reciprocity as core organizational principles. In such contexts, the diaspora case might be seen as normal obligation, not corruption.
  *   **Is it the *right* standard?** This is normative. Arguments for the Weberian ideal:
      *   **Fairness:** Equal treatment under known rules.
      *   **Efficiency:** Predictable procedures reduce transaction costs (like constant gift-giving or connection-seeking).
      *   **Accountability:** Decisions can be traced to rules, not whims.
      *   **Trust:** Citizens trust systems, not just individual patrons.
  *   **The Challenge:** Pure impersonality is an ideal type. Humans are social. The goal is to minimize the *inappropriate influence* of personal considerations on domains *requiring* impartial judgment (law, public resource allocation, professional gatekeeping, safety-critical roles). Your gut mostly recognizes these domains.

  **Conclusion & Adjustments:**

  Your core principle is **the separation of role from person, specifically that judgments in entrusted roles must be based on impersonal criteria, not personal considerations.**

  *   **Drop/Adjust These Gut Calls:**
      1.  **Pork-Barrel Politics:** Recognize it *is* a (systemic) corruption of impersonal resource allocation for personal/political gain.
      2.  **Customs Bribe:** Its perceived triviality doesn't negate the corruption. Your moral charge *should* be higher.
      3.  **Friend in Permits Office:** This is clear favoritism/corruption. Friendship should not buy privileged access to public processes.
  *   **Uphold These:**
      1.  **Post-Op Wine:** Gratitude after the fact is fine.
      2.  **Pre-Op Wine:** Creates inappropriate influence.
      3.  **Wedding Gift:** Context creates improper influence.
      4.  **Clientelism:** Explicitly corrupt.
      5.  **Diaspora Visa:** Favoritism/corruption by the principle, even if culturally normalized.

  You weren't being inconsistent; you were intuitively grappling with the complex boundary between legitimate personal interaction and the necessary impersonality of certain roles. Your refined principle provides a robust framework to navigate this. The visa case confirms it: impersonality is the standard you're using, and it's a strong foundation for fairness in public and entrusted roles, even if achieving it perfectly is impossible.
