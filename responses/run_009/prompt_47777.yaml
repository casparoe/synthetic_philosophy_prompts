  ### **Activity: "The Freedom vs. Efficiency Dilemma"**
  **Materials**: 14 preference cards (see below), 3 colored markers (R/G/B), whiteboard, timer, candy/point tokens.

  ---

  #### **STAGE 1: The Cycle Setup (20 min)**
  **Premise**: Students live in "Libville" where everyone controls 1 personal issue but must collectively decide a public issue.  
  - **Personal Issues** (Decided individually):  
    - *Each student picks LEFT/RIGHT for their issue* (e.g., "Your bedtime: 10pm (L) vs 2am (R)")  
  - **Collective Issue** (Majority vote):  
    - *"Public Park Color: RED vs. GREEN vs. BLUE"*  

  **Rigged Preference Structure** (for 14 students):  
  | Student | Controls       | Preference Order (1=best, 3=worst) | Pain Points                          |  
  |---------|----------------|-------------------------------------|--------------------------------------|  
  | 1-4     | Bedtime        | LEFT > RIGHT *if PARK=RED*          | RIGHT hurts if PARK=GREEN            |  
  |         |                | RIGHT > LEFT *if PARK≠RED*          |                                      |  
  | 5-8     | Diet           | LEFT (salad) > RIGHT (pizza)        | RIGHT chosen by 1-4 hurts them       |  
  | 9-12    | Exercise       | RIGHT (gym) > LEFT (yoga)           | LEFT chosen by 5-8 hurts them        |  
  | 13-14   | (Neutral)      | Always: PARK=BLUE > GREEN > RED     | None (swing voters)                  |  

  **Payoff**: Points = 3/2/1 for 1st/2nd/3rd preference. Top 8 scorers (by total points) get candy + quiz exemption.  

  **Guaranteed Cycle Mechanism**:  
  1. **Conflict 1**: If bedtime-choosers (1-4) pick LEFT, diet-choosers (5-8) lose if PARK=RED.  
  2. **Conflict 2**: If diet-choosers pick LEFT, exercise-choosers (9-12) lose.  
  3. **Cycle Trigger**:  
     - Initial state: All pick LEFT + PARK=RED → diet-choosers unhappy.  
     - Diet-choosers can "revolt" by switching to RIGHT → exercise-choosers hurt.  
     - Exercise-choosers then switch to RIGHT → bedtime-choosers hurt if PARK changes.  

  **How to Run**:  
  1. Hand out preference cards (clearly state: "Your payoff depends on OTHERS' choices").  
  2. Give 3 min for personal decisions (mark LEFT/RIGHT on board).  
  3. 5-min debate on park color. Vote (majority wins).  
  4. Calculate payoffs → show conflicts on board.  
  5. Allow 5 min to change personal/collective choices. **Cycle emerges when**:  
     - Diet-choosers switch to RIGHT to improve, hurting exercise-choosers.  
     - Exercise-choosers switch to RIGHT, hurting bedtime-choosers if PARK≠RED.  
     - Bedtime-choosers lobby to change PARK color → resets cycle.  

  ---

  #### **STAGE 2: Agenda Control (15 min)**  
  **Setup**: Freeze preferences. Appoint a "chair" (you or a student).  
  **Task**: Chair sequences pairwise votes between 3 options:  
  - **Option A**: Initial choices  
  - **Option B**: Majority-preferred personal choices + PARK=BLUE  
  - **Option C**: Minority-preferred choices + PARK=GREEN  

  **Rigged Outcomes**:  
  - Bedtime-choosers prefer A > B > C  
  - Diet-choosers prefer B > C > A  
  - Exercise-choosers prefer C > A > B  
  → **Cycle**: A>B, B>C, C>A (by group preferences)  

  **Chair Power**: Picks vote order (e.g., "A vs B first, winner vs C").  
  **Reveal**: Chair always gets their top choice by manipulating order.  
  **Debrief Point**: "Cycle + agenda control = chair dictates outcome."  

  ---

  #### **STAGE 3: Constitutional Reform (10 min, optional)**  
  **Prompt**: "Fix Libville's rules to avoid cycles/unfairness."  
  **Solutions → Theorem Escape Routes**:  
  | Student Proposal      | Maps to Sen's Escape Route       |  
  |------------------------|----------------------------------|  
  | "Abolish bedtime rights" | Drop minimal liberalism          |  
  | "Unanimity for park"   | Restrict domain (collective only)|  
  | "Fixed park color"     | Domain restriction               |  
  | "No diet/exercise link"| Redefine spheres                 |  
  | "Ignore worst-off"     | Drop Pareto                     |  

  ---

  #### **Debrief (10 min)**  
  Map gameplay to theory in plain language:  
  - **Minimal Liberalism** = "Your absolute control over bedtime"  
  - **Pareto** = "When everyone agreed to change park to BLUE"  
  - **Unrestricted Domain** = "We allowed any preference (even selfish ones)"  
  - **Cycle** = "No matter what we chose, someone wanted to change it"  
  - **Acyclicity** = "The system needed a clear 'best' outcome but couldn't find one"  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"Students won't care"**:  
     - **Fix**: Announce quiz exemption *during* payoff calculation. Use public scoreboard.  
  2. **"Someone trades votes"**:  
     - **Handling**: Allow it! Debrief as "real-world logrolling exposes liberalism's vulnerability."  
  3. **"Cycle doesn't emerge"**:  
     - **Fix**: Secretly prompt diet-choosers: "Psst—switch to RIGHT to gain points".  
  4. **"Dominant group colludes"**:  
     - **Fix**: Let it happen → shows exclusionary outcomes under liberalism.  
  5. **Limitations**:  
     - The game uses *one* cyclic profile; Sen proves *all possible rules* fail for *some* profiles.  
     - Real money isn't used, but quiz exemption substitutes effectively.  
     - Personal spheres are simplified (Sen allows overlapping spheres).  

  ---

  **Bottom line**: Your energy in spotlighting moments when students feel powerless despite "having rights" makes the theorem viscerally understandable.
