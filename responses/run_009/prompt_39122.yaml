prompt: |-
  I teach a third-year seminar on corruption and governance — 18 students, one 90-minute session. Design a role-play where they feel for themselves why "what counts as corruption" is actually contested, not just sloppily defined. Here's roughly the shape I want, but you fill in everything:

  The class is split between (a) a village committee in a fictional region where nothing official happens without accompanying gestures — a gift when you arrive, food when you negotiate, a "sitting fee" for people who gave up a day to attend, favors owed among families that go back decades; and (b) staff of a foreign NGO that has a grant for repairing the village school, who carry a compliance checklist requiring itemized receipts and a blanket no-gifts clause. Maybe a district official in the middle. Then run it in two rounds: round one under normal rules, where they discover they literally cannot schedule the first meeting without either violating local norms or writing something on the form that reads like a bribe; then round two, after HQ sends an auditor with a zero-tolerance policy, so the choice becomes: a formally clean failed project, or a successful school with fudged paperwork.

  Give it a payoff scheme that doesn't use real money but makes the conflict real — project points vs. compliance points, designed so you can't max both. Private role sheets with actual objectives (the committee chair loses standing if she hosts a meeting with no food; the auditor gets fired if a violation slips through and gets flagged later). Maybe a third round where a rival NGO shows up that quietly tolerates local norms and tries to poach the village — I want them to feel the enforcement problem, not just the definitional one.

  Then the debrief: map specific moments onto the real distinctions — whether the chair even holds "public office" in the relevant sense, diffuse reciprocity vs. a specific quid pro quo, clientelism as particularistic-but-legal distribution, the fact that gifts create open-ended obligation while bribes close a transaction, and whether the whole framework is a Western export or genuinely universal. Also tell me what will predictably go wrong the first time I run it (I assume half of them will just play caricatures), and be honest about which part of the real issue the role-play can't reproduce no matter how I set it up.
reasoning: |-
  Okay, the user is teaching a third-year seminar on corruption and governance and wants a role-play exercise. They've outlined a specific scenario involving a village committee and an NGO staff, with a district official mediating. The goal is to make students understand that corruption isn't just poorly defined but contested, with different cultural and institutional perspectives.

  First, I need to unpack their requirements. They want the students to experience the conflict between local norms (gifts, sitting fees, reciprocal favors) and NGO compliance rules (no gifts, itemized receipts). The role-play should have two rounds: the first where they try to schedule a meeting and face dilemmas, and the second where an auditor enforces zero-tolerance, pushing them towards either project failure or fudged paperwork. They also suggested a third round with a rival NGO to highlight enforcement issues.

  The user mentioned a payoff scheme using points instead of real money—project points vs. compliance points—with private objectives for each role. They want a debrief connecting the exercise to real concepts like diffuse reciprocity, clientelism, and Western frameworks. Additionally, they asked for potential pitfalls and limitations of the role-play.

  I should start by structuring the role-play phases. For Round 1, the main challenge is setting up the first meeting. The village committee expects gifts and sitting fees, while the NGO can't provide them without violating their rules. The district official might mediate, but their incentives could push them to side with the village for future support. The conflict here is immediate and cultural.

  Round 2 introduces the auditor with zero-tolerance. This escalates the stakes: the NGO must choose between compliance (failing the project) or falsifying records (risking exposure). The village might resist or propose under-the-table solutions. The rival NGO in Round 3 offers a contrast, showing how leniency can "solve" the problem but at the cost of compliance, highlighting enforcement dilemmas.

  For the payoff system, project points could come from completing stages like meetings, assessments, and construction, while compliance points are tied to documentation and rule adherence. Each role has hidden objectives: the chair needs hospitality to maintain standing, the auditor must avoid violations to keep their job. These create personal stakes beyond the group goals.

  In the debrief, I need to map specific moments to theoretical concepts. For example, the gift exchange versus bribe discussion ties into diffuse reciprocity vs. quid pro quo. The village chair's role questions if they're a "public official," touching on definitions of corruption. The rival NGO's approach illustrates clientelism and the tension between efficiency and accountability.

  Potential issues: Students might play caricatures—villagers as overly corrupt or NGO staff as rigid. To mitigate, provide nuanced role sheets with motivations. The district official's role could be underutilized, so giving them clear incentives might help. Time management is crucial; using timers and clear phases can keep things on track. Also, some students might disengage; assigning specific tasks per role can help.

  Limitations: The exercise can't replicate real power imbalances or long-term relationships. Students know it's a game, so stakes aren't as high. Cultural nuances might be oversimplified, and ethical discomfort from rule-breaking might not fully translate. Despite that, the role-play effectively highlights contested definitions and enforcement challenges, sparking discussion on cultural relativism in corruption frameworks.
answer: |-
  Here’s a detailed role-play design that meets your objectives, including mechanics, role sheets, debrief framework, and realism assessment:

  ---

  ### **Role-Play Structure: "The Broken School Dilemma"**
  **Phase 0: Setup (15 mins pre-class)**  
  - **Groups**: 
    - **Village Committee (6 students)**: Chair, Elder (kinship ties), Teacher (school rep), Merchant (local supplier), Farmer (land donor), Youth Rep.
    - **NGO Team (5 students)**: Project Manager, Finance Officer, Engineer, Local Liaison (from regional capital), Field Monitor.
    - **District Official (1 student)**: Technically neutral but relies on village support for reelection.
    - **Auditor (Round 2 only)**: Sent from NGO HQ.
    - **Rival NGO Rep (Round 3 only)**: "SwiftBuild NGO" (quietly flexible on gifts).
  - **Materials**: 
    - Role sheets (with secret objectives, see below). 
    - "Project Tracker" whiteboard showing: **Compliance Points (0-10)** and **Project Progress (0-10)**. 
    - Sticky notes for "gifts/favors," printed "receipt forms," and a timer.

  ---

  ### **Role Sheets (Key Objectives & Penalties)**

  | **Role**              | **Primary Goal**                              | **Secret Objective**                                  | **Penalty for Failure**                     |
  |-----------------------|-----------------------------------------------|-------------------------------------------------------|--------------------------------------------|
  | **Village Chair**     | Secure school repairs without losing authority | *Never host outsiders without food/gifts*             | Lose 2 Project Points if unmet             |
  | **NGO Finance Officer** | Perfect documentation for audit               | *Flag ANY receipt anomaly*                            | Lose 3 Compliance Points if violation found later |
  | **District Official** | Be seen as effective mediator                 | *Ensure village elites get symbolic recognition*      | Lose political standing (role disadvantage next round) |
  | **Auditor (R2)**      | Enforce zero-tolerance policy                 | *Find at least one violation to justify trip*         | Fired (removed from game) if misses violation |
  | **SwiftBuild Rep (R3)** | Poach the village project                     | *Secretly offer to cover "sitting fees" as "logistical support"* | N/A (competitive advantage) |

  ---

  ### **Rounds & Mechanics**
  **ROUND 1: The First Meeting (25 mins)**  
  - **Setup**: NGO must schedule a site assessment. Village insists on pre-meeting gifts + $5 "sitting fee"/attendee.  
  - **Conflict**: Village Chair refuses bare-bones meeting; NGO can’t pay fees without falsifying receipts (e.g., labeling fees as "transportation costs").  
  - **Scoring**:  
    - **+1 Project Point** if meeting happens.  
    - **-2 Compliance Points** if NGO mislabels gifts.  
    - **-1 Project Point** if Chair hosts without food (per secret objective).  

  **ROUND 2: Auditor’s Crackdown (20 mins)**  
  - **Setup**: Auditor arrives. Project stalled (e.g., villagers boycott over unpaid fees).  
  - **Choices**:  
    - *Option A*: Strict compliance → No meeting, project fails.  
    - *Option B*: Fake paperwork → School built but risk exposure.  
  - **Scoring**:  
    - **+3 Project Points** if construction starts (requires faked paperwork).  
    - **-5 Compliance Points** if Auditor catches fraud (Auditor wins if they expose it).  
    - **Project fails** if no progress (-3 Project Points).  

  **ROUND 3: Rival NGO (15 mins)**  
  - **Setup**: SwiftBuild Rep offers to fund repairs "your way."  
  - **Dilemma**: Village must choose:  
    - Stick with original NGO (high compliance, low progress).  
    - Switch to SwiftBuild (fast progress but no oversight → future corruption risks).  
  - **Scoring**:  
    - Village switch → **+4 Project Points** but **Compliance Points reset to 0**.  
    - No switch → Original scoring continues.  

  ---

  ### **Debrief Framework (20 mins)**
  Map in-game moments to real concepts:  
  1. **"Is the Chair a public official?"**  
     - *Trigger*: Debate over whether "sitting fees" for a community volunteer constitute bribery.  
     - *Theory*: Formal vs. informal authority (Philp 1997).  

  2. **Diffuse Reciprocity vs. Quid Pro Quo**  
     - *Trigger*: Village Elder calling in a decades-old favor vs. NGO’s "no gifts" rule.  
     - *Theory*: Mauss’ gift economy vs. modern anti-bribery law.  

  3. **Clientelism as Legal Distribution**  
     - *Trigger*: District Official directing NGO to hire the Merchant’s cousin for supplies.  
     - *Theory*: Stokes et al. on "particularism in democracies."  

  4. **Gifts as Obligation vs. Bribes as Closure**  
     - *Trigger*: Village’s insistence on post-deal feast (open-ended relationship) vs. NGO’s one-time payment.  
     - *Theory*: Gupta’s "blurred boundaries" in transactional cultures.  

  5. **Western Export or Universal Standard?**  
     - *Trigger*: SwiftBuild’s "local adaptation" vs. original NGO’s rigidity.  
     - *Theory*: Transnational Legal Orders (Halliday & Shaffer) vs. cultural relativism (Persson et al.).  

  ---

  ### **Predictable Problems & Mitigation**
  1. **Caricatures**: Students play villagers as "backward" or NGO as "colonial."  
     - *Fix*: Role sheets emphasizing **rational self-interest** (e.g., Chair fears social exclusion; NGO staff fear job loss).  

  2. **Deadlock**: Groups refuse to bend, stalling the game.  
     - *Fix*: Inject "crisis notes" mid-round (e.g., "Monsoon season starts next month → delay = collapsed school").  

  3. **Dominant Players**: Auditor/District Official monopolizing dialogue.  
     - *Fix*: Assign talking tokens (each student gets 3 tokens to speak; forces strategy).  

  4. **Oversimplified "Solution"**: Students assume "just record gifts honestly" works.  
     - *Fix*: In Round 2, have HQ reject any receipt with "gift" as non-compliant.  

  ---

  ### **Inherent Limitations of the Exercise**
  - **Power Asymmetry**: Real villagers face coercion or violence; students don’t. Role-play can’t replicate the fear factor.  
  - **Long-Term Networks**: Decades of reciprocity are compressed into 90 mins. Students miss how *systemic* norms become.  
  - **Structural Incentives**: The exercise frames corruption as cultural clash, but can’t showcase how *institutions* (e.g., underpaid officials) create bribery.  
  - **Moral Discomfort**: Real actors face ethical anguish; students experience academic debate.  

  ---

  **First-Run Tip**: Use a timer ruthlessly. End rounds even if unresolved—the frustration *is* the lesson. Assign the District Official role to a strong student; their maneuvering often sparks the richest conflict.
