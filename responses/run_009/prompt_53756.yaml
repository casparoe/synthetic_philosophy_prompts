prompt: |-
  Ok so I'm a junior in high school and I'm writing my term paper for an elective called Science and Society, and I watched this youtube video last night (like a 25 min explainer on philosophy of science, not gonna say which channel) and I kind of want to use it as a source but something felt off. The video summarized this thing called the underdetermination of theory by evidence and it went something like this: back in the early 1900s a physicist named Duhem proved that no experiment can ever test a theory on its own, because a theory never makes predictions by itself, you always need a whole pile of extra assumptions about your instruments and stuff, so when an experiment goes wrong you can always just blame one of the assumptions instead of the theory. Then Quine came along later and showed this applies to all of knowledge, not just physics. The video said this means for any set of data there are always multiple incompatible theories that fit it perfectly, so scientists literally cannot ever have evidence that favors one theory over another, and that's why theory choice ends up being about psychology and fashion and who has tenure, not about the evidence. The conclusion the video drew was that we can never be rational in believing one scientific theory over a rival, we just pick one.

  Here's my thing. The first half of that (the Duhem part about needing extra assumptions) actually made sense to me and matched what my chemistry teacher said once about how you're never testing just one thing at a time. But the jump at the end felt too fast?? Like "multiple theories fit the data" to "therefore no evidence can ever favor one over another." That doesn't sound right because scientists literally do this all the time, like with relativity vs newton, and everyone considers that evidence based. But maybe I'm just not getting it.

  So my question is: how much of that summary would an actual philosopher of science accept, and where would they wince? Like go through it bit by bit for me. Which parts are accurate, which parts are the video overreaching or smooshing two different ideas together (it also said stuff about how all observation is theory-laden, which I don't think is even the same claim as the Duhem thing but the video treated them as one thing, is that right?), and whether the conclusion about never being rational to prefer one theory follows from the parts that ARE accurate. Also if the "always multiple theories that fit equally well" part is an exaggeration of what underdetermination actually says, tell me what the real version says, because I want to explain it right in my paper and not just copy the video's spin. And honestly if the video is mostly right and I'm the one being naive about how science works, I'd want to know that too lol.
