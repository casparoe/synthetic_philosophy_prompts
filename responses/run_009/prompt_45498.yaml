  We are given a description of American Fourth Amendment doctrine concerning third-party information. The doctrine holds that when you share information with a third party (like a bank or phone company), you lose Fourth Amendment protection for that information. However, there are exceptions: the contents of a sealed letter, the contents of a phone call, and (since 2018) cell-site location records are protected even though they are held by third parties.

  The task is to reconstruct the theory of privacy that underlies this scheme. We are to consider several possibilities: secrecy (if another party can see it, it's not private), control over information, contextual appropriateness of information flows, or whether it's just a rough proxy for intrusiveness without a coherent theory.

  We must also distinguish what the practice strictly requires from what it merely tolerates, and note where the practice is underdetermined. Then, we are to consider what would change if the secrecy rationale were replaced by a contextual-flow view. Finally, we are to provide a short label (at most four words) for the theory of privacy the doctrine most plausibly presupposes.

  Step 1: Analyze the doctrine

  The doctrine, as described, has the following features:

  - Information handed over to a third party (like bank records, dialed phone numbers) loses Fourth Amendment protection because you assumed the risk of disclosure.

  But exceptions:

  1. The contents of a sealed letter in transit (even though held by the postal carrier) are protected.
  2. The contents of a phone call (even though they pass through the phone company's equipment) are protected.
  3. Since 2018, cell-site location records (which are held by the carrier) are protected.

  The pattern is not simply content vs. non-content because:

  - A postcard's content is unprotected (because it is exposed to the carrier) but a sealed letter's content is protected.
  - A bank's record of your deposit slip (which is a record about a communication) is not protected in the same way (it's exposed to the bank) but note that the bank record might be protected by other laws (like the Bank Secrecy Act) but not by the Fourth Amendment in the same way.

  Also, location data was not protected until 2018.

  Step 2: Consider the theories

  a) Secrecy: If information is exposed to a third party, it's not private. But this doesn't explain why the contents of a sealed letter are protected. The letter is held by the postal carrier, but the content is not exposed to them. Similarly, the contents of a phone call are not exposed to the phone company (they are transmitted as data, but the company doesn't typically listen in). However, the phone numbers you dial (metadata) are exposed because they are necessary to route the call. Also, a postcard is exposed, so it's not protected.

  b) Control over information: This theory would hold that privacy is about having control over who gets your information. But the doctrine does not protect information you have shared with a third party, even if you don't want the government to have it. So control doesn't seem to be the basis.

  c) Contextual appropriateness: This theory (associated with Helen Nissenbaum) says that privacy is about appropriate flows of information in a given context. In the context of sending a sealed letter, it is appropriate that only the sender and recipient see the content, not the government or the carrier. Similarly, for a phone call, the content is appropriate for the parties but not the government. But for bank records, when you share them with the bank, it's appropriate that the bank uses them for banking purposes and may share them with the government for regulatory reasons? The doctrine doesn't seem to align perfectly because the government can get bank records without a warrant. However, the 2018 decision on cell-site location records might be explained by the context of carrying a phone: the carrier collects that data for operational purposes, but it's not appropriate for the government to have a detailed record of your movements without a warrant.

  d) Intrusiveness as a rough proxy: The doctrine might be based on how intrusive the surveillance feels. But that is subjective and the Court has not explicitly used that.

  Step 3: The pattern in the doctrine

  The doctrine seems to distinguish between:

  - Information that is voluntarily exposed to a third party in the ordinary course of business (like bank records, phone numbers dialed) and thus loses protection.

  - Information that, even though held by a third party, is not intended to be exposed to that third party (like the contents of a sealed letter) or is collected in a way that the third party does not actually inspect it (like the contents of a phone call, which the phone company doesn't typically listen to) and thus retains protection.

  This suggests a focus on the individual's reasonable expectation of privacy. In the case of a sealed letter, the individual reasonably expects that the content remains private even though it is in the hands of the postal carrier. Similarly, for a phone call, the content is expected to be private. For cell-site location records, the Supreme Court in 2018 (Carpenter v. United States) held that individuals have a reasonable expectation of privacy in their physical movements over time, even though the data is held by the carrier.

  But note: the phone numbers you dial (metadata) are exposed to the phone company and are necessary for routing, so no reasonable expectation of privacy. A postcard is exposed to the carrier, so no reasonable expectation of privacy.

  So the doctrine is using a standard of "reasonable expectation of privacy" that is context-dependent. This standard was established in Katz v. United States (1967). However, the third-party doctrine (from United States v. Miller and Smith v. Maryland) holds that when you voluntarily turn over information to a third party, you assume the risk and thus lose that reasonable expectation.

  The exceptions, especially Carpenter, suggest that the third-party doctrine is not absolute. The Court in Carpenter said that even though cell-site location records are held by a third party, the extent of the data and the nature of the information (a detailed record of a person's physical movements) create a reasonable expectation of privacy.

  Therefore, the underlying theory might be a contextual one: whether the individual has a reasonable expectation of privacy in a given context.

  Step 4: Distinguish strict requirements, tolerances, and underdetermination

  Strictly, the doctrine requires that information shared with a third party loses Fourth Amendment protection unless the individual retains a reasonable expectation of privacy despite the sharing. The exceptions (sealed letter, phone call content, and now location data) show that the third-party rule is not absolute.

  The doctrine tolerates that some information shared with third parties might still be protected if the context creates a reasonable expectation of privacy.

  The practice is underdetermined in the sense that the boundaries of what creates a reasonable expectation of privacy are not precisely defined. For example, before 2018, location data was not protected, but now it is. The Court has to decide case by case. Therefore, several theories might be able to explain the outcomes in different areas. For instance:

  - A secrecy theory might try to explain the sealed letter by saying the content is not exposed, but the envelope is (so the address is not protected). But the secrecy theory would have trouble with location data: the carrier collects the location data and uses it, so it is exposed. But the Court in Carpenter said the exposure was limited and the data was not voluntarily shared in the same way as bank records.

  - A contextual appropriateness theory would fit well: in the context of using a cell phone, we don't expect the carrier to share our location data with the government arbitrarily. Similarly, for a sealed letter, the context implies that the carrier is just transporting it and not reading it.

  Step 5: What would change if we replaced secrecy with contextual appropriateness?

  Currently, the doctrine uses a mixture of the third-party rule (which is secrecy-based: if exposed, no privacy) and exceptions based on reasonable expectations (which are context-based). If we replaced the entire rationale with a contextual-flow view, then the rule would become:

  The government can obtain information from a third party without a warrant only if the flow of that information to the government is appropriate in the context of the relationship between the individual and the third party, and the purpose for which the information was shared.

  Under this view:

  - Bank records: shared for banking purposes. It might be appropriate for the bank to share them with the government in response to a subpoena (but not without any process) because of banking regulations? But the current rule allows a subpoena without a warrant. The contextual view might require a warrant if the information is particularly sensitive or if the individual has a strong expectation of confidentiality.

  - Phone numbers dialed: shared to connect the call. It might be appropriate for the phone company to use them for billing and maintenance, but not to share them with the government without a warrant? The current rule (Smith v. Maryland) says no warrant is needed. Under contextual appropriateness, that might change.

  - Location data: already protected under Carpenter, which aligns with contextual appropriateness.

  - Postcards: they are intended to be read by the carrier? So if the government wants to read them, that might be appropriate? But under contextual appropriateness, the context of sending a postcard is that it is open to anyone who handles it. So it might remain unprotected.

  - Sealed letters: the context is that the content is private and only for the recipient. So the government would need a warrant to open it.

  Therefore, the main change would be that the third-party rule would not be a categorical rule. Instead, every disclosure would be judged by context. This might lead to more protection for some types of records (like phone numbers and bank records) that are currently not protected.

  Step 6: Conclusion about the most plausible theory

  The doctrine most plausibly presupposes a theory of privacy based on reasonable expectations of privacy in a given context. This is a contextual theory. The Court in Katz established that the Fourth Amendment protects reasonable expectations of privacy. The third-party rule is a specific doctrine that applies when information is shared with a third party, but even then, the Court has recognized that some contexts create a reasonable expectation despite the sharing.

