prompt: |-
  Longtime science-and-ideas reporter here, and I need a number, not vibes. I'm doing a piece on the insect welfare debate — the stuff that used to live on utilitarian blogs and now has actual researchers publishing on whether bugs matter morally — and my editor's one-line take was "so is it wrong to spray your kitchen for ants or not." I'd like to be able to say something sharper than "philosophers disagree."

  Here's the case I want you to price: a homeowner finds an ant colony in the kitchen wall and sprays it. Stipulate the spray works instantly — the ants drop dead with zero distress beforehand. Set aside everything collateral (runoff, pollinators, human health effects, what the neighbors think). I want your credence that the act was pro tanto morally wrong, as a probability, and then the decomposition that produces it.

  Some sub-questions you'll probably want as terms in there: whether insects are sentient at all, whether their experiences (if any) have enough moral weight that killing many of them counts against the act even setting aside the homeowner's convenience, and — this is the part I find genuinely weird — whether death is even bad *for* an insect, given that the standard account of why death is bad for you seems to rely on things like future-directed preferences or a life-narrative that insects plausibly lack. A painless death for a creature with no stake in its own future looks alot like no harm at all, unless there's some other story about why killing is bad. So maybe the whole thing collapses into an argument about the badness of death rather than about sentience, which would be a fun twist for the piece.

  Give me a rough probability for each term, a line of justification for each, how they combine into the final number, and which single term the answer is most sensitive to. And flag it honestly if my "instant, painless kill" stipulation is doing sneaky work — i.e., whether the number would jump or crater once you reintroduce the realistic version where the poison probably isn't instant and there's distress involved. I'll take honest uncertainty over a fake clean number, but I do want numbers.
reasoning: |-
  Okay, the user is a science reporter diving into insect welfare ethics. They need a concrete probability on whether killing ants instantly is morally wrong, stripped of all collateral factors. 

  Hmm, their core ask is tricky – quantifying moral philosophy into a single number feels almost paradoxical. But their framing shows deep understanding of the key tensions: sentience thresholds, moral weight scaling, and the peculiar problem of insect temporality. 

  First, the sentience question. I recall recent UK evidence reviews leaning 50-75% on crustacean/locust sentience, but individual ants? Probably lower. Their decentralized cognition makes pain states unlikely – I'd anchor around 35% with high uncertainty. 

  Then moral weight. Even if sentient, insects' minute neural architecture suggests vastly dimmer subjective experience. Vertebrate pain studies show intensity scaling with brain complexity. 0.1% of human moral weight feels generous but defensible. 

  Ah, the death paradox! This fascinates me. For beings without future plans, death's harm hinges on current distress – which we've eliminated. Preference frustration requires cognitive machinery ants lack. So harm probability plummets to 15% here. 

  Combining: 0.35 × 0.001 × 0.15 = 0.0000525. Rounded to 0.005%. The death-harm term dominates – if that model's wrong, the whole calculation unravels. 

  Crucially, the "instant kill" stipulation is doing massive work. Real insecticides cause hours of convulsions and metabolic torture. Flip sentience to 90% and distress probability to 85%, and wrongness probability jumps 5000-fold to 4.5%. 

  The reporter's instincts are sharp – they've isolated the philosophically clean case to expose how much hinges on temporal cognition theories. But the real-world version would make this an easy call for most ethicists. 

  Should emphasize that 0.005% reflects the artificial scenario's constraints. In practice, uncertainty about insect consciousness means precautionary principles might still apply. But for their specific hypothetical? The numbers tell a clear story.
answer: |-
  Here's a quantified breakdown for your hypothetical scenario, designed for precision while acknowledging the deep uncertainties. The final probability is **0.005%** that spraying the ants is *pro tanto* morally wrong (i.e., wrong in itself, setting aside consequences). Below is the decomposition:

  ### Key Terms & Probabilities
  1.  **Insects (Ants) Are Sentient**:  
      *   **Probability**: 35%  
      *   **Justification**: Current evidence is ambiguous but leans weakly against ant sentience. They lack key neural substrates (e.g., no cortex, minimal integrative brain regions). Some complex behaviors (e.g., rescuing nestmates) exist, but these are explainable via non-conscious mechanisms. Partial sentience (e.g., nociception without suffering) is plausible but unconfirmed. Precautionary principle isn't applied here as we're seeking objective probability.  
      *   *Source Basis*: Birch et al.'s UK review (2021) on invertebrate sentience; Klein & Barron's work on insect cognition; debate around integrated information theory (IIT) in simple systems.

  2.  **If Sentient, Killing Many Ants Has Significant Moral Weight**:  
      *   **Probability**: 0.1% (i.e., 1/1000th of human moral weight per ant)  
      *   **Justification**: Even if sentient, ants' subjective experience (if any) is likely extremely rudimentary, brief, and low-intensity. Moral weight scales non-linearly with cognitive complexity. Ants show minimal behavioral flexibility, episodic memory, or social bonding compared to vertebrates. Killing 10,000 ants *might* equate morally to harming a single vertebrate minimally, but likely far less.  
      *   *Source Basis*: Moral weight scaling arguments (e.g., Tomasik's estimates); comparisons to nematodes/C. elegans (widely assumed negligible weight); neuroeconomic principles.

  3.  **Death Itself (Painless & Instant) is Bad *For* the Ant**:  
      *   **Probability**: 15%  
      *   **Justification**: The "deprivation account" (death is bad because it deprives you of future goods) likely requires future-oriented desires or a subjective narrative continuity ants lack. An ant's existence is likely a series of disconnected moments. A painless death doesn't thwart ongoing projects or strong preferences. Harm requires frustration or suffering; neither occurs here. *However*, some argue that *any* loss of potential positive states is a harm, regardless of preference.  
      *   *Source Basis*: McMahan's "Time-Relative Interest Account"; debates in animal ethics (e.g., Hsiao on insects); Shelly Kagan on deprivation.

  ### Combining the Terms
  The probability the act is *pro tanto* wrong requires **ALL** conditions true:  
  1. Ants must be sentient (35%),  
  2. Their moral weight must be significant enough that killing many matters (0.1%),  
  3. Death itself must be a harm (15%).  

  **Calculation**:  
  `P(Wrong) = P(Sentient) * P(Significant Weight | Sentient) * P(Death Bad | Sentient)`  
  `= 0.35 * 0.001 * 0.15 = 0.0000525`  
  **Final Probability**: **0.005%** (rounded).

  ### Sensitivity Analysis
  *   **Most Sensitive Term**: **Death Badness (15%)**.  
      *   *Why*: This term has the highest individual uncertainty and philosophical variability. If you reject the deprivation account for insects (P → 0%), the whole probability collapses to **0%**. If you strongly affirm deprivation (P → 80%), the probability jumps to **0.028%** (a 5.6x increase). Sentience probability (35%) changes the base rate but is less contested in this context.

  ### Impact of the "Instant Kill" Stipulation
  *   **This is CRITICAL and massively suppresses the probability.**  
  *   **Realistic Scenario Impact**:  
      *   **Distress Probability**: If the spray causes distress (likely), add a term: `P(Distress Occurs | Sentient)`. Conservatively, set this at **85%** for commercial sprays.  
      *   **New Calculation**:  
          `P(Wrong) = P(Sentient) * P(Weight) * [P(Distress) + P(Death Bad)*P(No Distress)]`  
          ≈ `0.35 * 0.001 * [0.85 + (0.15*0.15)]` = `0.35 * 0.001 * 0.8725 ≈ 0.000305`  
          **New Probability**: **~0.03%** (a 6x increase).  
      *   *Key Point*: In realistic scenarios, **distress dominates the harm calculation**, not death itself. If distress occurs and ants are sentient, moral wrongness probability rises substantially.

  ### Why Philosophers Disagree (Quantified)
  *   **Pro-Sentience View**: Raises P(Sentient) to 70-90%, P(Death Bad) to 50-70%. Result: **0.035% to 0.095%**.  
  *   **Anti-Sentience/Weight View**: Sets P(Sentient) ≤10%, P(Weight) near 0%. Result: **≈0%**.  
  *   **Precautionary Principle Advocate**: Argues we should act *as if* P(Sentient) is high (e.g., 50%) *without* requiring high probability. This shifts the debate from probability to risk aversion.

  ### Bottom Line for Your Article
  > "Using conservative estimates from current science and philosophy, the probability that instantly killing an ant colony is inherently morally wrong—ignoring environmental or health effects—is approximately **0.005%**. This number depends heavily on whether death itself can harm creatures lacking future plans. If the insecticide causes suffering (as most do), the probability rises sharply. The core debate isn't just about sentience, but whether death matters to a being living entirely in the present."

  This framework provides a concrete number while transparently exposing the assumptions and their sensitivities. The "death badness" question is indeed the philosophically pivotal twist.
