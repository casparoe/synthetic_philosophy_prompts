  ### Answer to Your Question

  Hume's point (and Goodman's) is not just the no-free-lunch theorem in a powdered wig. The residue is the **normative question**: which inductive bias are we *entitled* to use? Learning theory shows that without a bias we cannot learn (NFL), and it can even show that certain biases are effective in certain worlds (e.g., simplicity if the world is simple). But it does not tell us why we are justified in assuming that the world is simple (or that the future will resemble the past) in the first place. That normative leap from "without a bias we cannot learn" to "we are justified in using this particular bias" is not addressed by learning theory. 

  This residue is not a gap in your vocabulary but a fundamental limit of learning theory. Learning theory is descriptive: it tells us how to learn if we make certain assumptions. It does not and cannot justify those assumptions without circularity. The philosophical claim is clear: there is a normative gap. However, learning theory helps by making explicit the role of assumptions (inductive bias) and the consequences of choosing them. But the leap of faith remains.

  So the verdict: Hume and Goodman identified a problem that learning theory formalizes but does not solve. The circularity in justifying the prior is inexpressible in the sense that learning theory does not even attempt to break it. It simply assumes the prior and then moves forward.
