  We are comparing the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) as methods for updating credences in the presence of anthropic evidence. Let me first state them precisely.

  **Self-Sampling Assumption (SSA):**
  One should reason as if one were a random sample from the set of all observers in one's reference class, in the appropriate spacetime region. In probabilistic terms, upon learning that one is an observer with index i (or having a particular experience), one conditions on being in the set of observers that exist. Formally, for a hypothesis H that specifies a set of observers (and their number, say N), and given that one is an observer with certain properties (say, in a specific situation), the probability of H is proportional to the prior of H times the probability of having one's current index given H. But note: the index is sampled uniformly from the observers in the reference class under H.

  A common mathematical formulation for SSA in the context of a hypothesis H that specifies a set of observers (with total count N_H) is that the probability of being a particular observer j (among the N_H) is 1/N_H, if j exists in H, and 0 otherwise. Therefore, upon learning that one is an observer (without specifying which one, but with certain indexical information), one conditions on being one of the observers that exist under H. So the likelihood of observing what one observes (i.e., being an observer of the type one is) is proportional to the fraction of observers in the reference class under H that have that evidence.

  **Self-Indication Assumption (SIA):**
  SIA says that finding that you exist is evidence for hypotheses under which more observers exist. Specifically, it can be stated as: the prior probability of a hypothesis should be proportional to the number of observers that exist under that hypothesis (times a conventional prior without SIA). Then, upon learning indexical information, one conditions in the usual way. Alternatively, one can think of SIA as introducing an anthropic factor that weights each hypothesis by its number of observers. Formally, in the update, the likelihood of existing (as an observer) given H is taken to be proportional to the number of observers in H. This means that the posterior probability of H given that one exists (and has some evidence) is proportional to the prior probability of H times the number of observers in H that have the evidence (which in the simplest case, if every observer in H has the same evidence, is just the total number in H).

  A standard way to write SIA is that the probability of H given that one exists (and has a certain evidence E) is:
    P(H | E) ∝ P(H) * P(E | H) * N_H
  where N_H is the number of observers in H that have evidence E (or if E is the same for all, then the total number of observers in H). But note: sometimes SIA is applied only to the fact of existence, and then conditioning on E is done separately.

  However, note that in the literature, SIA is often described as making the probability of a hypothesis proportional to the number of observers it contains, even before accounting for the specific evidence E. Then, when we condition on E, we restrict to the observers that have E.

  **Important Note:** The reference class problem for SSA: SSA requires specifying a reference class of "observers" that one might have been. The results can be sensitive to how this class is defined.

  Now, let's apply to the four cases.

