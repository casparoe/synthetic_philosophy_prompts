  Is there a non-question-begging way to fix it? It's difficult. One might appeal to the principle of indifference: if the setup is symmetric in the total number of observers, then the observer base measure is natural. But the problem is symmetric in the total number of observers. The universe base measure breaks that symmetry.

  However, in the tails case, there are more universes. If we think of the multiverse, then tails creates more universes. Why should we care about the number of universes? If our existence is as an observer, then the observer base measure might be appropriate.

  But if the theory of the multiverse is that each universe is a separate entity, then we might be more likely to find ourselves in a universe that is common. That is, if there are more universes of a certain type, we are more likely to be in one of them.

  But note: in the tails case, each universe has only one observer, so the chance of being in a particular tails universe is the same as being in the heads universe? Not if there are more tails universes.

  This is the same as the base-rate fallacy example. Without an objective way to choose the base measure, we have an ambiguity.

  ### Overall Comparison

  **Tractability:**
  - SSA is more straightforward in cases where the reference class is clear. But the reference class problem makes it messy.
  - SIA is simple to apply: multiply the prior by the number of observers and then condition. But it leads to the presumptuous philosopher problem.

  **Resistance to counterintuitive verdicts:**
  - SSA: counterintuitive in doomsday (we are likely to be in the doom scenario) and in Sleeping Beauty (depending on reference class) it can be either 1/2 or 1/3.
  - SIA: counterintuitive in the presumptuous philosopher and in doomsday (if we expect doom, but SIA cancels it) it might be seen as a benefit, but the presumptuous philosopher is a severe problem.

  **Fit with ordinary Bayesian reasoning:**
  In cases with a fixed number of observers, both reduce to standard Bayesian updating. But when the number of observers varies, SSA conditions on being an observer, while SIA adjusts the prior.

  ### Tentative Verdict

  I lean toward SSA (with a carefully chosen reference class) over SIA because the presumptuous philosopher case is a fatal flaw for SIA. However, I am not highly confident because of the reference class problem in SSA. The reference class problem might be addressed by defining the reference class as narrowly as possible (e.g., observers with the same non-indexical evidence) but it is still messy.

  The strongest comeback for the SIA defender is that in the doomsday argument, SIA provides a principled cancellation that avoids the otherwise counterintuitive conclusion of impending doom. And in the Universe-Builder's Discount, both assumptions agree and give the intuitive 1/2.

  But the presumptuous philosopher case is too damaging. Therefore, I tentatively prefer SSA, but with low confidence (say 60%).

  ### Corrections to the Framing

  In the Universe-Builder's Discount, the problem states that the total evidence is the same for every observer. But this is only possible if the evidence does not include the presence or absence of other observers in the same universe. We assumed that. But then both SSA and SIA give 1/2. The case does not expose a difference between them. It does, however, expose that the base measure (observer-based vs universe-based) can be chosen arbitrarily, and that choice affects the result. Both SSA and SIA, as usually defined, use the observer-based measure. So the case does not show a difference between SSA and SIA but rather a deeper problem in anthropic reasoning: the choice of the base set.

  In the doomsday argument, we saw that the cancellation by SIA is exact only if we condition on the exact birth rank. In practice, we often condition on a range, so SIA only partially cancels.

  In the Sleeping Beauty problem, the mapping to SSA and SIA is not exact because it depends on whether we use observer moments or observers in the reference class.

  Therefore, the cases are complex and the assumptions are not always applied consistently.
