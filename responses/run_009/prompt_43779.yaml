  ### 2. Bostrom's Presumptuous Philosopher

  **Setup:** We have two theories about the universe:
  - T1: The universe is small and contains 1 billion observers.
  - T2: The universe is large and contains 1 trillion observers.

  We have some empirical evidence that slightly favors T1, say from physics, so that the prior ratio P(T1)/P(T2) = 1.1 (i.e., 10% more likely for T1). But then we apply anthropic reasoning.

  **SSA analysis:**
  With SSA, we reason that we are a random observer. The fact that we exist gives no update (because under both theories we would exist). Then, without any indexical evidence beyond existence, the posterior ratio remains the same as the prior: 1.1. So we still favor T1 slightly.

  **SIA analysis:**
  SIA adjusts the prior by the number of observers. So:
    P_{SIA}(T1) ∝ P_0(T1) * 1e9
    P_{SIA}(T2) ∝ P_0(T2) * 1e12

