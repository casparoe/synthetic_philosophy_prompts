  **Reference-Class Problem for SSA:**
  SSA avoids this problem but has its own issue: the reference-class problem. For example, if we define the reference class as "human-like observers" or "any conscious being", the results can change. Also, what counts as an observer? If we include potential AI or animals, the numbers change. This makes SSA subjective and context-dependent.

