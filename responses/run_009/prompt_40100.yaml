answer: |-
  ## Ethics Committee: Aftermath

  **Characters:**
  *   **Dr. Aris Thorne:** Utilitarian Ethicist (Focused on maximizing overall well-being)
  *   **Dr. Lena Vance:** Scanlonian Contractualist (Focused on principles no one could reasonably reject)

  **Setting:** Empty hospital ethics committee conference room after the review.

  **(The door clicks shut behind them. Lena sighs, placing her folder heavily on the table.)**

  **Lena:** Aris, I still cannot reconcile myself to our stamp on that rescue report. Signing off felt... procedurally wrong. Like we skipped the hard part.

  **Aris:** (Leaning against the table, arms crossed) Skipped? Lena, it was *obvious*. Five lives saved versus one. The arithmetic is brutal but necessary. The crew made the only rational choice. Refusing to count lives when we can *act* on that count borders on moral negligence.

  **Lena:** It’s not about refusing to count lives, Aris. It’s about *how* we justify the choice. Scanlonianism demands we justify actions by principles no one could reasonably reject from their perspective. Look at the single worker, alone at Site B. What principle could *he* not reasonably reject that tells him his life is worth less because five are clustered elsewhere? His complaint – "You let me die when you could have saved me" – is identical in kind and intensity to the complaint any one of the five might have had if saved alone. Your "arithmetic" just aggregates identical complaints. But aggregation isn't licensed by the contractualist apparatus. It smuggles in your consequentialism.

  **Aris:** (Pushes off the table) So, what? You’d have them flip a coin? Taurek’s 50/50 shot? That feels like abdication! Isn't it *worse* to ignore the fact that choosing the five *does* answer five distinct, equally valid complaints? Choosing the one answers only one. The sheer number *matters*, Lena. Denying that is the abdication.

  **Lena:** (Nods slowly) Perhaps flipping a coin *would* be the procedurally fair approach if we genuinely see the claims as symmetrical. It gives each person an equal chance, acknowledging each life matters supremely to *them*. It respects the separateness of persons. Choosing the five based *solely* on the number prioritizes a group over an individual in a way that individual, facing death alone, could reasonably reject. The principle "save the larger group" *can* be reasonably rejected by the person in the smaller group facing certain death because of it.

  **Aris:** But what if the numbers aren't symmetrical? Imagine the single worker is 25 with a full life ahead. The five are all 85, frail, with minimal life expectancy. Their combined *life-years* saved might be less than the single worker's. My calculus easily adapts: save the young one. Does yours? Can the young worker reasonably reject a principle prioritizing saving more *life-years*? His potential loss is objectively greater.

  **Lena:** (Pauses, conceding slightly) That... complicates things. Objectively, yes, the loss of potential life-years is greater for the young worker. And yes, perhaps a principle prioritizing saving more life-years *could* be one no one reasonably rejects, *if* we all accept life-years as the metric. It's less about comparing individuals directly and more about the magnitude of loss. But Aris, that's a *very* different principle than simply "save the larger number of lives." It shifts the justification away from mere headcount. Our committee report didn't cite life-years; it cited five versus one. That's the smuggled arithmetic I objected to.

  **Aris:** Alright, concede that life-years might offer a contractualist path. But let's press your framework harder. The transmitter room. One technician suffers unbearable, agonizing pain unless we intervene. But to intervene, we disrupt a broadcast, mildly inconveniencing millions of viewers – a brief signal loss, no lasting harm. Utilitarianism is clear: spare the agony. The net suffering prevented is vastly greater. Can contractualism *really* demand we let the technician suffer? Can *he* not reasonably reject a principle that prioritizes preventing millions of fleeting annoyances over preventing his unbearable agony? Surely his complaint outweighs each individual viewer's trivial complaint?

  **Lena:** (Takes a deep breath) This *is* the hardest case. But yes, the technician *can* reasonably reject a principle that says "prevent minor inconveniences for millions over preventing unbearable agony for one." The *nature* of the burden matters immensely. His complaint – enduring unbearable pain – is of a fundamentally different *order* of magnitude and kind than the viewers' complaints about a blip in their entertainment. Each viewer's complaint is vanishingly small. Reasonable rejection isn't just about numbers; it's about the *salience* and *severity* of the burden imposed. No one could reasonably demand that someone else endure unbearable agony to spare them a minor, fleeting annoyance. The principle "prevent the worst suffering first, even if affecting fewer people" seems robust against reasonable rejection here. It doesn't require summing the minor complaints; it recognizes the qualitative chasm between the burdens.

  **Aris:** Hmm. You're saying the severity of the *individual* complaint matters, and it can be so overwhelming that it trumps the aggregated minor complaints, even with huge numbers. But doesn't that just reintroduce a *different* kind of weighting? Instead of summing identical complaints, you're weighing qualitatively different ones. Is that still pure contractualism, or is it consequentialism in a Scanlonian coat?

  **Lena:** It's contractualism working as intended. It forces us to articulate *why* a burden matters from an individual perspective and whether a principle imposing it could be reasonably rejected. It doesn't aggregate *welfare*; it assesses the *reasonableness* of principles considering the burdens they impose *on individuals*. In the transmitter case, the principle imposing unbearable agony is uniquely rejectable. In the mass casualty case with identical claims, the principle imposing certain death on one for the sake of saving five others *is* reasonably rejectable *by that one*. The numbers alone don't dissolve that rejection.

  **Aris:** But in the identical-claims case, doesn't the *fact* that five other people stand to lose everything create a stronger *demand* on the principle? Five distinct, equally powerful pleas versus one? Doesn't ignoring that feel like failing the five? I still see a profound moral loss in not saving the five when you could.

  **Lena:** And I see a profound moral wrong in *deliberately* choosing to let one person die *because* there are fewer of them, when you could have saved them. The loss of the five is tragic. The *choice* to sacrifice the one, justified solely by the number, violates a duty we owe to each person individually. Contractualism forces us to confront the cost *to the individual* of our principles. Sometimes, tragically, saving everyone isn't possible, and any choice leaves someone with a devastating complaint. We must choose the principle for choosing that minimizes the grounds for reasonable rejection *by anyone left behind*. In symmetrical cases, a fair procedure like randomization might do that best. It avoids ranking lives by group size.

  **Aris:** (Sighs, rubs his temples) I cannot accept randomization in a clear 5 vs. 1. It feels irrational. But... I concede your point about the committee report. We *did* just cite "five versus one." We didn't articulate a deeper principle about life-years, potential, or severity of loss. That was lazy. We smuggled in the arithmetic without the justifying work, even on utilitarian grounds. The report should have been more robust. But Lena, I still believe your framework risks paralysis or perverse outcomes when numbers *should* count.

  **Lena:** And I concede that contractualism struggles to give a simple, decisive answer when claims are symmetrical and severe. It can feel frustratingly procedural. But Aris, that complexity is the price of taking each person's inviolable moral standing seriously. We avoid the tyranny of the aggregate, even if it means sometimes the numbers don't deliver the clean, maximizing answer you seek. The justification must be one the loser could, in principle, understand as fair, even if devastating.

  **(They gather their things, the argument unresolved, but a mutual, grudging respect in the air.)**

  ---

  **Where the Exchange Turned**

  The pivotal moment arrived with the **transmitter-room scenario**. Aris deployed it as contractualism's hardest case, expecting Lena to either crumble or reveal inconsistency. Instead, Lena's response demonstrated contractualism's hidden resource: analyzing the **qualitative difference in burdens**. By distinguishing the technician's "unbearable agony" from the viewers' "mild inconvenience," she showed that reasonable rejection hinges not merely on counting complaints, but on their **salience and severity**. This move reframed the debate. It proved contractualism *can* prioritize saving one over many without aggregation, based on the overwhelming nature of an *individual* complaint, fundamentally distinct from summed minor ones. While it didn't resolve the symmetrical 5 vs. 1, it forced Aris to acknowledge contractualism's ability to handle non-identical cases robustly, shifting the burden back onto him to challenge the framework's core mechanisms rather than just its counter-intuitive results in specific scenarios.

  ---

  **My Verdict: Contractualism's Nuanced Accounting**

  Scanlonian contractualism *can* account for the moral significance of numbers without illicitly smuggling in aggregation, but it does so indirectly and contextually, not through simple summation. Its success lies in its focus on the **reasonableness of rejecting principles** governing actions, considering the **burdens imposed on individuals**.

  In symmetrical cases like the original 5 vs. 1 rescue, contractualism correctly blocks direct aggregation. The single person's complaint ("You let me die when you could have saved me") is identical in kind and severity to any one complaint from the larger group. A principle "save the larger group" *can* be reasonably rejected by the individual sacrificed solely because of their group's size. Here, numbers don't magically dissolve the force of the individual complaint. Contractualism might point to fair procedures (like randomization) as the only principle minimizing reasonable rejection grounds.

  However, contractualism isn't blind to numbers. Its power emerges when burdens differ:
  1.  **Severity Differential (Transmitter Room):** Contractualism decisively favors sparing one from unbearable agony over preventing millions of minor nuisances. It doesn't sum the minor complaints; it recognizes the *qualitative chasm* between an individually devastating burden and individually trivial ones. The one suffering agony has an overwhelmingly stronger case for reasonable rejection of a principle prioritizing the minor inconveniences.
  2.  **Magnitude of Loss (Life-Years):** As Lena conceded, a principle prioritizing saving more life-years *might* withstand reasonable rejection. The complaint of someone losing 60 potential years is arguably *worse* than someone losing 5 years, even if the latter are in a larger group. This isn't summing identical complaints but acknowledging differences in the *extent* of the loss suffered by individuals.

  Therefore, contractualism accounts for numbers through:
  *   **The Salience of Individual Burdens:** Overwhelming individual burdens trump aggregated minor ones.
  *   **The Relational Fairness of Procedures:** In symmetrical cases, fair random processes respect individual standing where a maximizing principle cannot be justified to the loser.
  *   **Comparing the Magnitude of Loss per Individual:** Assessing if the burden imposed on an individual under a principle (like losing vastly more life-years) is uniquely severe.

  It doesn't provide a formulaic "sum and save." Instead, it forces a deeper justification: not *how many* are affected, but *how* they are affected and whether the principle causing it can be defended *to each person* bearing the cost. This avoids the "smuggling" of aggregation by grounding moral weight in the texture of individual experience and the reasonableness of principles governing social choices, even when those choices are tragically constrained. While potentially less decisive in pure numbers games, this approach rigorously upholds the moral equality of persons in a way aggregation often obscures.
