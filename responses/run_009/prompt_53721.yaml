  **Key Clarifications:**

  1.  **Necessity of Borrowing:** The defining feature is that the argument *cannot be formulated or defended* without using the concepts/methods of Y. Simply mentioning Y or talking *about* it (e.g., citing its unpopularity sociologically) is insufficient. The *substance* of the argument against Y's value must itself be built using Y's intellectual framework.
  2.  **Awareness:** Unawareness intensifies the irony but is not necessary. A practitioner could knowingly use philosophical tools while dismissing philosophy's overall value ("philosophy is useless, but here's some philosophy I find useful to make my point against philosophy"). The incoherence lies in the pragmatic act of *deploying* Y to *devalue* Y, regardless of intent.
  3.  **Distinction from Ordinary Criticism:** Ordinary criticism of a field might use external standards (e.g., criticizing theology for lack of empirical evidence using scientific standards). Epistemic Poaching occurs when the criticism *uses the internal standards of the field it dismisses* to justify that dismissal (e.g., using theological reasoning to dismiss theology's value). The criticism is parasitically dependent on its target's own resources.
  4.  **Why 'Poaching'?** It captures the act of illicitly using resources (concepts, standards) from a domain whose value or relevance for one's own domain is simultaneously being denied. The poacher benefits from Y while declaring Y worthless for X.
