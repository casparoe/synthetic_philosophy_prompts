  Hmm, the user is describing a fascinating intellectual pattern they observed during an argument with a physicist friend about philosophy's value to science. They noticed their friend kept using philosophical concepts (like criteria for scientific demarcation) while dismissing philosophy itself. This happened repeatedly: when discussing string theory vs astrology, when justifying scientists' authority, and when citing Weinberg and Hawking who engage in philosophy while declaring it dead.

  The user wants to know if this specific phenomenon has a name - where someone dismisses field Y while simultaneously relying on its tools and frameworks. They've considered terms like "performative contradiction" or "self-refuting" but find them inadequate. They're asking for either an established term or a newly coined one, with precise boundaries and analysis.

  Key aspects to address:
  - The core paradox: Dismissing a field while depending on its methodology
  - How it differs from simple hypocrisy or inconsistency
  - Whether this applies beyond philosophy-science conflicts
  - The borrower's awareness level (conscious vs unconscious)

  I recall several related concepts but none perfectly fit:
  1. Performative contradiction (Austin/Searle) - but here there's no strict logical contradiction, just pragmatic inconsistency
  2. Self-defeating arguments - but the argument isn't logically invalidated
  3. Kuhn's disciplinary matrix - captures embedded assumptions but not the dismissal aspect
  4. Bourdieu's illusio - describes field-specific beliefs but not the act of attacking the field

  Since no existing term seems precise enough, I'll coin "epistemic poaching" as a new label. The defining features are: 
  - Practitioner of X rejects Y's value for X
  - Their rejection necessarily employs Y's conceptual tools
  - This creates pragmatic (not logical) incoherence

  Boundary cases to test:
  - A theologian using logic to reject logic (within scope)
  - A scientist dismissing philosophy while citing philosophical papers (still in scope)
  - Simply criticizing a field without using its methods (out of scope)

  This phenomenon likely extends beyond science-philosophy conflicts to any domain where implicit frameworks are denied while being used. My least confident point is whether conscious borrowing should be included - I think yes, but could be debated.

  The user seems intellectually sophisticated - they've clearly analyzed this deeply and want precise conceptual carving. Their frustration with "near-miss" concepts suggests they value philosophical rigor. This deserves equally careful treatment.
