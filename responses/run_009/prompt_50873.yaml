prompt: |-
  I've been trying to figure out what actually makes promises binding by going on gut feeling through a bunch of cases. Promising to help a friend move and then bailing for a concert: obviously binding. Promising to hand over my wallet at knifepoint: not binding at all. Promising a dying friend I'll look after her cat for the rest of the cat's life: binding, and it stays binding even though she's gone now and can't be hurt by my breaking it. But promising to keep paying dues to a club that's since dissolved: feels void, even though the club can't be hurt by my breaking it either. A promise to lie for a colleague on his resume: not binding, I'd almost say I'm bound in the opposite direction. But promising to keep a friend's affair secret from her husband: binding, even though that's also covering up a wrong. A promise my kids extract from me after an hour of whining: still binding, which honestly surprises me. A promise I make out loud to myself, like promising myself I'll never smoke again: barely binds at all, if it binds at all. So is there one principle that gets all of these, or close to it, and which of my verdicts would you tell me to give up? The cat vs. the club is the pair that really bugs me — surely the difference can't just be that I loved my friend and didn't love the club. And I'd want to know what the principle says about the case I keep flip-flopping on: a promise I made half-jokingly at a party, in front of witnesses, that I'd fund someone's documentary if they ever made one, and now years later they actually quit their job to make it.
reasoning: |-
  Okay, the user is wrestling with what makes promises binding. They've listed several scenarios where their gut feeling says a promise is or isn't binding, but they're struggling to find a consistent principle. The cat vs. club case really bothers them—both involve a promise where the beneficiary can't be harmed by breaking it, yet one feels binding and the other doesn't. They also mention a half-joking promise that now has serious consequences.

  First, I need to understand their core question: What underlying principle determines if a promise is morally binding across these varied cases? They want coherence, not just intuition. The user seems philosophically inclined, testing ethical theories against real-life examples. Their frustration with the cat/club dichotomy suggests they suspect emotional attachment isn't enough—and they're right. 

  The cat promise feels binding because it's a sacred vow to a dying person; the dissolved club doesn't because the institution's purpose evaporated. This hints at contextual factors beyond harm: reliance, intent, reciprocity. The joke-turned-real documentary promise is tricky because the promisor didn't expect reliance, but now real consequences exist. 

  I recall Scanlon's Contractualism: promises bind when breaking them violates reasonable expectations we've invited. That fits most cases—helping a friend move invites reasonable reliance; the knife-point promise doesn't. For the cat, the dying friend reasonably expected posthumous commitment; the dissolved club couldn't reasonably expect dues after ceasing to exist. The joking documentary promise? Initially, no reasonable expectation—but if the filmmaker seriously relied later, it might become binding retroactively. 

  The resume lie promise isn't binding because it invites unreasonable/unethical expectations. The affair secret is binding because it protects privacy (unless abuse is involved)—but if keeping it enables harm, that overrides the promise. Kids' whining: still binding because children reasonably rely on parental promises, even if annoyingly extracted. Self-promises lack interpersonal reliance, hence weaker. 

  Key principles emerging: 
  1. Reasonable reliance created by the promise 
  2. Absence of coercion/deception 
  3. Compatibility with broader moral duties 
  4. Ongoing relevance of the promise's purpose 

  The user might need to adjust their view on the documentary case—if genuine reliance occurred, it could bind despite initial unseriousness. And they should scrutinize the affair promise: does keeping it enable harm? If so, it may not bind. 

  Their examples are sharp; the only potential misstep is underestimating how reliance can transform a joke into an obligation. Overall, they're doing great philosophy—testing intuitions against principles. The answer isn't one rule but a framework balancing expectation, morality, and context.
answer: |-
  Your intuitions are remarkably consistent with a principle-based ethical framework—specifically, **Scanlon's Contractualism** and **relational autonomy** theories. The core idea is: **A promise is morally binding when breaking it would violate the reasonable expectations of reliance that you intentionally invited, provided the promise itself isn't inherently immoral.** Let's break this down with your cases:

  ### Key Principles:
  1. **Invited Reliance**: Did you knowingly encourage others to depend on your commitment?  
  2. **Reasonableness**: Was their reliance foreseeable and reasonable given the context?  
  3. **Immoral Premise**: Is the promise asking you to do something inherently wrong?  
  4. **Ongoing Purpose**: Does the promise’s original intent still exist?  

  ### Your Cases Revisited:
  | Case | Binding? | Why | Principle Applied |
  |------|----------|-----|-------------------|
  | **Help friend move → bail for concert** | Yes | Friend reasonably relied on you (e.g., rented truck, didn’t hire help). | **Invited reliance + reasonableness** |
  | **Hand over wallet at knifepoint** | No | Coercion voids consent; no genuine commitment was made. | **Immoral premise (coercion)** |
  | **Care for dying friend’s cat** | Yes | You invited reliance (friend died in peace because of your vow). The purpose (cat’s welfare) persists. | **Invited reliance + ongoing purpose** |
  | **Pay dues to dissolved club** | No | The club’s purpose (activities, services) no longer exists. Paying dues serves no rational goal. | **Lack of ongoing purpose** |
  | **Lie for colleague’s resume** | No | Fraud harms others; you can’t bind yourself to an immoral act. | **Immoral premise** |
  | **Keep friend’s affair secret** | *Contested* | Binding *only if* secrecy doesn’t enable harm (e.g., abuse, disease). If harm is likely, morality overrides promise. | **Immoral premise overrides if harm** |
  | **Promise to kids after whining** | Yes | Children reasonably rely on parental promises. Your consent (even if grudging) invited reliance. | **Invited reliance + reasonableness** |
  | **Promise to self (quit smoking)** | Weakly | No interpersonal reliance; only personal accountability. Breaking it disappoints you but harms no one else. | **No invited external reliance** |

  ### Resolving Your "Cat vs. Club" Dilemma:
  - **The cat promise**: Your friend *relied* on you to secure her cat’s future. The purpose (the cat’s well-being) remains intact.  
  - **The club dues**: The club’s dissolution voids the purpose. Paying dues now is pointless—no one reasonably relies on it.  
  **→ The difference isn’t love; it’s the *ongoing rationale* for the promise.**  

  ### The Documentary Promise Flip-Flop:
  - **Initial context**: Half-joking, no serious intent.  
  - **Changed context**: The filmmaker *relied* on your promise (quit their job!).  
  - **Verdict**: **Binding, but with caveats**.  
    - You *did* make a public commitment, inviting potential reliance.  
    - Once they acted on it reasonably (*e.g.*, gave up stable income), breaking it causes real harm.  
    - **But**: Your obligation scales with their *reasonable* reliance. Funding a lavish film? No. Helping them land softly? Possibly.  

  ### Where Your Intuitions Might Need Tweaking:
  1. **Affair secrecy**: If hiding it enables harm (e.g., the husband is being exposed to health risks), the promise *isn’t* binding. Morality trumps promises.  
  2. **Documentary promise**: A joke becomes binding when others reasonably act on it. You can’t control their reliance, but you invited it.  

  ### One-Sentence Principle:  
  **A promise binds when you intentionally invite reasonable reliance on a morally acceptable commitment, and breaking it would harm those who relied.**  

  This framework preserves 95% of your judgments while clarifying edge cases. It also explains why "self-promises" feel weak—they lack relational harm—and why the dissolved club is void: reliance became irrational.
