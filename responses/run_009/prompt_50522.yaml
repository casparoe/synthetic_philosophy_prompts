answer: |-
  Below is a complete, runnable package for your 75-minute session, designed to make students *feel* Nietzsche's three historical modes before naming them. I've refined your Weilstadt case to heighten tensions between the modes and included a council memo escalation targeting the antiquarian faction. The design prioritises experiential learning through competitive role-play, followed by a structured debrief mapping the exercise to Nietzsche's concepts.

  ---

  ### **Session Overview**
  **Objective:** Students experience the constraints and affordances of Nietzsche's historical modes (monumental, antiquarian, critical) through competitive negotiation, revealing how each serves or hinders "life."  
  **Time Allocation:** 75 minutes total.  
  **Student Roles:**  
  - 3 factions (5 students each): Bound to one historical mode (secret rules).  
  - Council (3 students): Unbound, decides the outcome.  
  **Materials Provided:**  
  - Faction briefing sheets (printed, one per student).  
  - Council memo (sealed envelope for mid-session reveal).  
  - Whiteboard listing the three town options.  
  - Timer.  

  ---

  ### **Timeline for 75-Minute Session**
  | Phase             | Time     | Activity                                                                                              | Instructor Role                                                                 |
  |-------------------|----------|-------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | **Setup**         | 0-5 mins | Introduce Weilstadt dilemma. Assign roles: 3 factions (5 each), council (3). Hand out briefings.      | Explain options neutrally. Emphasise: "Council decides; factions persuade."     |
  | **Faction Prep**  | 5-20 mins| Factions review briefings, plan arguments (15 mins). Council preps questions (separately).           | Circulate, enforce secrecy. Remind factions: "Stick to your rule—no exceptions!"|
  | **Presentations** | 20-40 mins| Each faction speaks (5 mins each). Order: Monumental → Antiquarian → Critical. Council questions (5 mins). | Timekeep. Note rule violations silently.                                         |
  | **Escalation**    | 40-45 mins| Council reads aloud memo revealing Reinecke’s philanthropy. Factions get 60 sec to adapt arguments.   | Hand memo to council. Announce: "New evidence—respond quickly!"                 |
  | **Council Delib.**| 45-55 mins| Council deliberates publicly. Must choose one option.                                                 | Observe silently. Intervene only if deadlocked.                                  |
  | **Decision**      | 55-60 mins| Council announces choice and justifies it.                                                            | Record decision on whiteboard.                                                  |
  | **Scoring**       | 60-65 mins| Council awards "persuasion points": 1 point per argument adopted from any faction. Tally points.     | Award prize (e.g., sweets) to faction with most points.                         |
  | **Debrief**       | 65-75 mins| Facilitate discussion linking exercise to Nietzsche. Reveal mode names.                              | Use guiding questions (scripted below).                                        |

  ---

  ### **Faction Briefing Sheets (Student Voice)**  
  *Distribute these secretly—each faction sees only their own.*  

  #### **Faction 1: The Inspirational Future-Builders**  
  *Your Secret Rule: You may ONLY use the past as a source of exemplars and inspiration. You must argue how history motivates greatness today. Never mention preservation or moral judgment.*  
  **Your Goal:** Persuade the council that **Option 1 (restore statue and archive)** fuels Weilstadt’s future. Reinecke’s ambition built this town—let his drive inspire new achievements!  
  **Talking Points:**  
  - "Reinecke’s vision made Weilstadt prosperous—imagine what we could achieve by reviving that spirit!"  
  - "His flaws? Even imperfect giants teach us resilience. Let’s honour his ambition, not his errors."  
  - "Restoration isn’t about the past; it’s a monument to what we could become."  
  **Avoid:** Preservation ("we must save the archive") or condemnation ("he was evil").  

  #### **Faction 2: The Heritage Guardians**  
  *Your Secret Rule: You may ONLY speak in the register of preservation and local belonging. Argue that history is valuable because it’s ours. Never use inspiration or moral judgment.*  
  **Your Goal:** Push for **Option 1 (restore both)** or **Option 2 (demolish statue but keep archive)**. This site is Weilstadt’s roots—don’t sever them!  
  **Talking Points:**  
  - "This archive is our story—erasing it erases us. We must preserve it for future generations."  
  - "The statue isn’t just metal; it’s 140 years of belonging. Repair it to honour our ancestors’ struggles."  
  - "Without these artefacts, we lose our identity. Weilstadt isn’t a town—it’s a legacy."  
  **Avoid:** Inspiration ("Reinecke motivates us") or condemnation ("he doesn’t deserve preservation").  

  #### **Faction 3: The Justice Seekers**  
  *Your Secret Rule: You may ONLY bring the past to judgment and condemn it. Demand moral reckoning. Never use inspiration or preservation.*  
  **Your Goal:** Fight for **Option 2 (build interpretive centre)** or **Option 3 (clear site for park)**. Tear down symbols of oppression!  
  **Talking Points:**  
  - "Reinecke’s wealth came from brutality—glorifying him condones violence."  
  - "Keeping the statue whitewashes crime. Replace it with a centre exposing the truth!"  
  - "This past poisons our town. A park would symbolise growth beyond exploitation."  
  **Avoid:** Inspiration ("learn from his drive") or preservation ("save the archive for continuity").  

  ---

  ### **Council Materials**  
  **Council Briefing (Verbal Instructions):**  
  "You are Weilstadt’s council. After hearing factions, choose one option:  
  1. **Restore both statue and archive**  
  2. **Demolish statue, keep archive, build interpretive centre**  
  3. **Sell archive, clear site, build park**  
  Your budget covers only one. Award persuasion points after your decision: 1 point per faction argument you explicitly adopt in your reasoning. The faction with the most points wins a prize."  

  **Mid-Session Memo (Revealed at 40 mins):**  
  *Text inside sealed envelope:*  
  > **URGENT COUNCIL MEMO**  
  > *From: Town Archivist*  
  > *Subject: New Reinecke Findings*  
  > Digitised diaries reveal Reinecke funded Weilstadt’s first orphanage (1892) and lobbied against child labour locally. He wrote: "This town is my legacy of compassion." These records are in the endangered archive.  

  *Why this escalation?* It pressures antiquarians (must preserve "compassionate" records), aids monumentalists (adds inspirational material), and challenges criticals (undermines pure condemnation).  

  ---

  ### **Rules for "Citing History"**  
  - Arguments must align with faction rules. Examples:  
    - **Monumental:** "Reinecke’s determination inspires our youth" → **VALID**. "Preserve his statue to teach history" → **INVALID** (violates rule).  
    - **Antiquarian:** "The archive binds us to our grandparents" → **VALID**. "Reinecke’s charity proves he’s inspiring" → **INVALID**.  
    - **Critical:** "The statue celebrates oppression" → **VALID**. "Save the archive to honour his charity" → **INVALID**.  
  - **Violation Handling:** Instructor notes violations silently but allows arguments. Debrief later highlights slippage.  

  ---

  ### **Debrief Script (10 Mins)**  
  *Reveal mode names after initial discussion.*  
  1. **Feel the Modes:**  
     - "Which faction found it *easiest* to stay in their lane? Why?" (Likely critical—clear moral stakes.)  
     - "What *couldn’t* your faction say?" (Monumental: couldn’t condemn; Antiquarian: couldn’t judge; Critical: couldn’t inspire.)  
     - "How did the memo disrupt you?" (Antiquarians torn—must preserve "good" and "bad" history; Criticals forced to ignore charity.)  

  2. **Map to Nietzsche:**  
     - "Monumental: 'Inspiration' = Nietzsche’s exemplars for action. Antiquarian: 'Preservation' = roots for belonging. Critical: 'Judgment' = smashing idols for liberation."  
     - "Nietzsche says history must 'serve life.' Which arguments felt most *life-affirming*? Why?" (Link council’s choice to vitality—e.g., park (critical) = growth; restoration (monumental) = ambition.)  
     - "Which mode felt most suffocating? Why?" (Highlight antiquarian’s burden: preserving everything paralyzes progress.)  

  3. **Excess as the Unseen Threat:**  
     - "In this debate, modes competed—but Nietzsche’s real fear was one mode saturating culture. Imagine a town drowning in preservation (antiquarian): nothing changes. Or constant condemnation (critical): no foundations. That’s the 'malady of history'—it kills action."  

  ---

  ### **What the Exercise Cannot Reproduce (Gap Analysis)**  
  **The Gap:** Role-play shows modes *in conflict* but cannot simulate Nietzsche’s core problem—historical *excess* (a culture saturated by all three modes, causing paralysis).  
  **Closing the Gap:**  
  - **Pre-Reading:** Assign Nietzsche’s §1 ("The Three Histories") and §4 ("The Malady of History").  
  - **Lecture Add-On:** After debrief, discuss:  
    > "Nietzsche isn’t anti-history—he’s anti-*too much* history. Modern life drowns in monuments (museums), antiquarianism (heritage industries), and criticism (cancel culture). Like Weilstadt’s factions, none serve life alone. The solution? Balance history with *forgetting*—like the council’s choice to demolish (critical) *or* restore (monumental) to enable vitality."  
  - **Example:** Contrast Weilstadt’s focused dilemma with modern "history saturation" (e.g., Brexit nostalgia, Holocaust memorial proliferation). Ask: "When does commemoration become toxic?"  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Factions Smuggling Forbidden Modes:**  
     - *Why:* Antiquarians might condemn; criticals might inspire.  
     - *Solution:* Note violations silently. In debrief, say: "I heard Faction 2 condemn Reinecke—what rule did that break? How did it *feel* to be silenced?" Turns error into learning.  

  2. **Council Deadlocks:**  
     - *Why:* Options force trade-offs (e.g., preservation vs. justice).  
     - *Solution:* Warn council: "You *must* choose. Tie? Chair casts deciding vote." If stalled, remind: "Life demands action—Nietzsche would urge decisiveness!"  

  3. **Uneven Engagement:**  
     - *Why:* Antiquarians may dominate (emotional stakes); monumentals may stall (abstract).  
     - *Solution:* Assign spokespeople during prep. If one faction lags, ask: "What’s your *positive* case?" (monumental) or "What’s lost if we forget?" (antiquarian).  

  ---

  ### **Design Notes & Rationale**  
  **Why This Framing?**  
  - **Case:** Kept Weilstadt but added orphanage records to the memo—this *escalates antiquarian tension* (must preserve "good" and "bad") and mirrors Nietzsche’s worry that antiquarianism avoids moral reckoning.  
  - **Payoff:** "Persuasion points" reward *argument adoption*, not faction victory. This ensures factions compete while council hears all modes. Prize (e.g., chocolate) sparks fun competition.  
  - **Sequencing:** Council memo timed after presentations—forces factions to adapt mid-flow, revealing mode rigidity.  

  **Why British English?**  
  - Used "prioritise," "centre," "labour," "defence," "cancelled," etc., per your request.  

  This design forces students into Nietzsche’s "modes" through experiential constraints, setting up your lecture on excess. Run it as is—then let Nietzsche’s text "name" what they’ve lived.
