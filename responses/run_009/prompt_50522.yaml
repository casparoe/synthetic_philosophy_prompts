  5. **Council Deliberation (10 mins):**
     - Council discusses openly. They must choose one option and explain why.

  6. **Decision and Scoring (5 mins):**
     - Council announces their decision and cites arguments from each faction that influenced them. Instructor tallies points: one point per cited argument.

  7. **Debrief (15 mins):**
     - Reveal the three modes. Ask:
       - What did it feel like to argue in your assigned mode?
       - What were the limitations? What couldn't you say?
       - How did the memo affect each faction?
       - Which mode was most persuasive to the council? Why?
       - How does this relate to Nietzsche's idea that history must serve life?
     - Discuss the dangers of excess: "In this exercise, we saw the modes in competition, but what if a whole culture was dominated by one? How might that harm life?"

  **Faction Briefing Sheets (Student's Voice):**

  **Faction 1: Monumental Mode (Source of Exemplars and Inspiration)**
  - Your Rule: You can only use the past as a source of great examples and inspiration. You must focus on what in history can inspire us to greatness today. Do not talk about preserving the past just because it's old or part of our identity. Do not condemn the past. Instead, use the past to motivate current action.
  - Your Goal: Persuade the council that one of the options uses history to inspire the town's future. You might argue for Option 1 (restore both) to celebrate Reinecke's founding spirit and inspire civic pride. Or, you could argue that even his flaws can inspire us to build a better future. Remember: stick to inspiration and exemplars.

