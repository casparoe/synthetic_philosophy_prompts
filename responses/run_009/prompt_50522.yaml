prompt: |-
  I teach a mid-level undergraduate elective called "Time, Memory, and Forgetting," and next month we reach Nietzsche's *On the Uses and Disadvantages of History for Life*. I'd like you to act as an instructional designer who also has graduate training in nineteenth-century philosophy: I want an in-class role-play that makes sixteen students *feel* the difference between what Nietzsche calls the monumental, antiquarian, and critical modes of history, before I ever put those names on the board. Here is the case I've been mulling, which you should refine or replace if you see something better: a fictional mid-sized town, Weilstadt, must decide what to do with its founder's statue and the decaying archive building next to it. The founder, August Reinecke, built the town's fortune in the 1880s, and newly digitized papers show his company's profits depended on coerced labor in its overseas trading posts. The town council has budget for exactly one of three options: restore both the statue and the archive to their original condition; demolish the statue, keep the archive, and build a small interpretive centre with the salvaged materials; or sell the archive's contents to a private collector, clear the site, and build a park. The students should be split into three lobbying factions, each secretly bound to a rule: one may only cite the past as a source of exemplars and inspiration, one may only speak in the register of preservation and local belonging, and one may only bring the past to judgment and condemn it. A small council of three students, bound by no rule, must actually choose, and the payoff structure should make the factions genuinely compete — perhaps each faction earns "persuasion points" for arguments the council later adopts, with some small prize, so no real money is needed.

  Please provide the full runnable package: a timeline for a single 75-minute session, the secret faction briefing sheets (written out, in students' voice), the materials I need to prepare beforehand, the rules about what counts as citing history, and a scripted escalation — for instance, a mid-session "council memo" revealing a further complication about Reinecke that pressures the antiquarian faction hardest. The debrief is the part I care most about: it should map specific moments in the exercise onto the three modes and onto Nietzsche's claim that history is only justified by serving life, and it should push students to notice which faction found it easiest to stay inside its rule, and what each faction *couldn't* say because of it. I'd also like you to include a frank section on what the exercise cannot reproduce — my worry is that Nietzsche's real target is the saturation of a whole culture by too much history, and an hour of competitive role-play may dramatize the modes while leaving the diagnosis of excess untouched; tell me what I must supply by lecture or reading to close that gap. Finally, please list the two or three things that will predictably go wrong the first time I run it — e.g. factions smuggling in the forbidden modes, or the council refusing to choose — and how to handle each.

  Before writing the final design, please brainstorm a few candidate framings for the case and the payoff scheme and briefly say which you chose and why; then present the session plan in a clear, well-organized format. Take your time and think carefully about the sequencing — the whole point is that students should collide with the three modes before they can name them. Please write your entire answer in British English.
reasoning: |-
  We are designing a 75-minute in-class role-play to help students experience Nietzsche's three modes of history (monumental, antiquarian, critical) without naming them initially. The scenario involves a fictional town, Weilstadt, deciding what to do with a founder's statue and a decaying archive building. The founder, August Reinecke, has been revealed to have used coerced labour. 

  The students will be divided into three factions, each bound to one mode:
  - Faction 1 (Monumental): Can only cite the past as a source of exemplars and inspiration.
  - Faction 2 (Antiquarian): Can only speak in the register of preservation and local belonging.
  - Faction 3 (Critical): Can only bring the past to judgment and condemn it.

  There will also be a council of three students who are not bound by any rule and must choose one of three options:
  1. Restore both the statue and the archive to their original condition.
  2. Demolish the statue, keep the archive, and build a small interpretive centre with the salvaged materials.
  3. Sell the archive's contents to a private collector, clear the site, and build a park.

  Each faction will earn "persuasion points" for arguments that the council later adopts in their decision. The points can be tallied and a small prize (like extra credit or sweets) can be awarded.

  We'll include a mid-session complication: a council memo revealing that Reinecke's archives also contain records of his charitable works for the town (e.g., funding schools, hospitals) which might pressure the antiquarian faction (who value preservation) and also provide material for the monumental faction.

  **Brainstorming Candidate Framings and Payoff Scheme:**

  1. **Framing the Case:**
     - Option A: Keep the case as described (statue and archive) with the three options.
     - Option B: Add more complexity, e.g., the archive building is also a historic landmark, or the town has a divided public opinion. But we want to keep it focused so the three modes are clear.
     - Option C: Instead of a town, frame it as a university debating a building named after a controversial founder. However, the town scenario allows for broader community stakes.

     I choose **Option A** because it is clear and directly presents the conflict between the three modes. The options are distinct and each aligns with one mode.

  2. **Payoff Scheme:**
     - Idea 1: Each faction gets one point for each argument they make that is explicitly referenced by the council in their decision. This might be hard to track.
     - Idea 2: After the council decides, they must explain their decision and cite which arguments from each faction they found most compelling. Then, the factions get points for each citation. This is more feasible.
     - Idea 3: The instructor and council together assign points during the debrief.

     I choose **Idea 2** because it encourages the council to listen and attribute arguments, and it is manageable.

  **Final Design:**

  **Session Title:** Weilstadt's Dilemma: History in Action

  **Time:** 75 minutes

  **Materials to Prepare Beforehand:**
  - Three options for the council written on a board or slide.
  - Secret faction briefing sheets (one set per faction, with enough copies for each member).
  - Council memo (for the mid-session twist) in an envelope.
  - Name tags or signs for factions (Monumental, Antiquarian, Critical) and council.
  - Timer.
  - A whiteboard or flip chart to record the council's decision and points.

