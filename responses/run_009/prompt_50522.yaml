  - Your Rule: You can only speak about preserving the past because it is part of Weilstadt's heritage and identity. You must focus on the value of the archive and statue as they are, as part of the town's story. Do not use the past to inspire greatness or to condemn it. Your arguments should be about roots, continuity, and belonging.
  - Your Goal: Persuade the council to choose an option that preserves the town's history. You might argue for Option 1 (restore both) to keep the site intact. Or, if you think the statue is problematic, you might focus on preserving the archive (Option 2) as the essential record. Remember: your core value is preservation, not inspiration or condemnation.

  **Faction 3: Critical Mode (Judgment and Condemnation)**
  - Your Rule: You must bring the past to judgment and condemn the wrongs you find. Focus on the injustices and argue that the past must be confronted and rejected where it is harmful. Do not use the past for inspiration or for preservation. Your arguments should be about breaking free from a harmful past.
  - Your Goal: Persuade the council to remove the statue and not simply preserve the archive without context. Argue for Option 2 (demolish statue, build interpretive centre) to expose the truth, or Option 3 (clear the site for a park) for a fresh start. Do not argue for preserving the statue or archive without critical reinterpretation.

