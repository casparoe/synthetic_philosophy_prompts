      - Council: 4? Then 16. But then the council would be 4. We can have them vote and if tie, the chair breaks? Or just 3 council and 13 students: 4,4,5. I think 4 per faction and 4 council (with the 4th council member as chair with tie-breaking) is acceptable.

  Alternatively, to keep it simple, we can have 3 council members and 13 students: 4 in two factions and 5 in one. But that might be uneven. Instead, let's have 5 per faction (15) and 1 council? Then 16. But one council member might not be enough. We need a council of 3 to deliberate. So: 4 per faction (12) and 4 council? Then 16. The council of 4 can work.

  **Revised:**
  - 4 students per faction (12 total for three factions)
  - 4 council members (they will deliberate together and vote; if tie, the chair (chosen by them) breaks it)

  **Timeline for 75-Minute Session:**

  1. **Introduction (5 mins):**
     - Instructor sets the scene: Weilstadt, the dilemma, and the three options. Explain that three lobbying groups will present their case to the town council (played by four students). The council will decide which option to choose. The goal for the factions is to persuade the council.

  2. **Faction Preparation (15 mins):**
     - Distribute secret briefing sheets to each faction. Each faction has 5 minutes to read their briefing and 10 minutes to prepare their arguments. They must stay within their rule. They can choose 1-2 spokespersons.

  3. **Council Briefing (5 mins, concurrent with faction prep):**
     - The council members are given an overview of their role: they must listen to the presentations and then deliberate and choose one option. They are not bound by any rule. They are told about the persuasion points: after the decision, they will cite which arguments from each faction they found compelling, and each cited argument will earn the faction one point. The faction with the most points wins a small prize.

  4. **Presentations (20 mins):**
     - Each faction has 5 minutes to present their case (total 15 mins). Order: Monumental, Antiquarian, Critical. Then 5 minutes for questions from the council to any faction.

  5. **Mid-Session Complication (5 mins):**
     - The instructor hands the council a sealed "memo" (prepared beforehand) to be read aloud. The memo reveals: "Further research in the archive has uncovered that Reinecke, despite his involvement in coerced labour, was also a major philanthropist in Weilstadt. He funded the town's first school and hospital, and his personal diaries show deep affection for the town." 
     - The council shares this memo with the whole class. Then, each faction has 2 minutes to respond to this new information (order same as before: Monumental, Antiquarian, Critical). Total 6 minutes.

  6. **Council Deliberation and Decision (10 mins):**
     - The council deliberates in front of the class (so all can hear) for 10 minutes and then announces their decision.

  7. **Scoring and Debrief (15 mins):**
     - The council explains their decision and cites specific arguments they adopted from each faction. The instructor tallies the points on the board.
     - Then, the instructor leads a debrief, mapping the exercise to Nietzsche's concepts.

  **Secret Faction Briefing Sheets:**

  **Faction 1: Monumental Mode (Source of Exemplars and Inspiration)**
  - Rule: You can only use the past as a source of great examples and inspiration. You must focus on what in history can inspire us to greatness today. You cannot talk about preserving the past for its own sake, and you cannot condemn the past. You must frame Reinecke as an example (positive or negative) that motivates current action.
  - Goal: Advocate for Option 1 (Restore both) because Reinecke, despite flaws, represents the monumental spirit of founding and building a town. Use his story to inspire current citizens to achieve great things. Alternatively, you might reinterpret: but note you cannot condemn, so you must find inspiration. You might argue that restoring the statue and archive reminds us of the heights of achievement and the fallibility of humans, driving us to build a better future without repeating mistakes (but without condemning). Remember: you cannot use preservation or condemnation arguments.

  **Faction 2: Antiquarian Mode (Preservation and Local Belonging)**
  - Rule: You can only speak about preserving the past as it is, because it is part of your local identity and heritage. You must focus on the value of the archive and statue as they are, as part of the town's fabric. You cannot use the past to inspire greatness (monumental) or to condemn (critical). You must argue that these objects are valuable simply because they are old and ours.
  - Goal: Advocate for Option 1 (Restore both) because they are part of Weilstadt's heritage and must be preserved for future generations. The archive holds the town's memory. Alternatively, if you feel Option 2 (demolish statue but keep archive) is more preservative, you can argue that, but note that the statue is also part of the past. However, the rule does not require preserving everything, but it does require a preservationist mindset. You might argue that the archive is the essential record and must be preserved, but the statue can be repurposed (if that is preservation). But note: you cannot condemn the statue.

  **Faction 3: Critical Mode (Judgment and Condemnation)**
  - Rule: You must bring the past to judgment and condemn the wrongs you find. You must focus on the injustices and argue that the past must be confronted and rejected where it is harmful. You cannot use the past for inspiration or for preservation. You must argue that the past is a burden that must be overcome.
  - Goal: Advocate for Option 2 (demolish the statue and build an interpretive centre) or Option 3 (clear the site and build a park). You want to remove the statue because it glorifies an oppressor. The archive should be used to expose the truth, not preserved without comment. Option 3 is a clean break. You cannot argue for preserving the statue or archive for their own sake.

  **Note:** Each faction must argue for one of the three options, but they are not forced to a particular option. They can choose which option best fits their mode, but they must stick to their rule.

  **Council Memo (Mid-Session Complication):**
  - Content: "Memo to the Council: Newly uncovered documents in the archive reveal that August Reinecke, despite his company's use of coerced labour in overseas trading posts, was also a major benefactor to Weilstadt. He personally funded the town's first school and hospital, and his diaries express a deep love for the town and its people. These documents are part of the archive collection."

  **Rules About What Counts as Citing History:**
  - For the factions, any argument that uses the past must be in their assigned mode:
    - Monumental: Arguments that use the past as an example to inspire current action (e.g., "Reinecke's entrepreneurial spirit should inspire us to rebuild our economy").
    - Antiquarian: Arguments that emphasize preserving the past because it is part of the town's identity (e.g., "These buildings are our heritage; they connect us to our roots").
    - Critical: Arguments that condemn the past and call for breaking with it (e.g., "We must tear down this statue because it represents oppression").
    
  If a faction uses a forbidden mode, the instructor (or council) can call it out and the argument is invalid (and they lose a point, or just a warning). But to keep it flowing, the instructor can note it during the debrief.

  **Debrief Plan (15 mins):**
  1. Reveal the three modes and their names: monumental, antiquarian, critical. 
  2. Map specific moments from the exercise:
     - Ask: Which faction found it easiest to stay within their rule? Why?
     - What couldn't each faction say? (e.g., the antiquarian couldn't condemn the coerced labour, the critical couldn't find inspiration in Reinecke's charity, the monumental couldn't dwell on preservation for its own sake.)
     - How did the complication (memo) affect each faction? (Especially for antiquarian: they had to preserve the whole, including the charity; for monumental, they could use the charity as inspiration; for critical, they had to condemn despite the charity.)
  3. Nietzsche's claim: History must serve life. Ask: Did the council's decision serve the life of Weilstadt? Which mode dominated the decision? How might an excess of one mode harm the town?
  4. Push students to see the limitations of each mode when used exclusively.

  **What the Exercise Cannot Reproduce:**
  - Nietzsche's main concern is the *excess* of history in modern culture, which paralyses life. The role-play focuses on the three modes in isolation and in competition, but it does not show how a culture saturated by history (e.g., endless memorials, preservation, or criticism) can stifle action and creativity.
  - To close this gap, in a follow-up lecture or reading, you must:
    - Discuss Nietzsche's diagnosis of the "malady of history" and his examples of historical excess.
    - Contrast with the "unhistorical" (forgetting) and the "suprahistorical" (art and religion) as necessary for health.
    - Use examples from contemporary culture (e.g., constant commemoration, heritage industry, or political correctness debates) to illustrate how an imbalance of history can be harmful.

  **Predictable Problems and Solutions:**
  1. **Problem:** Factions smuggling forbidden modes into their arguments.
     - *Solution:* The instructor can gently intervene during preparation or note it in the debrief. Emphasize that the point is to feel the constraint, so it's okay if they slip, but they should try. In the debrief, use examples to show how hard it is to stay pure.

  2. **Problem:** Council refusing to choose or deadlocking.
     - *Solution:* The council chair has a tie-breaking vote. Encourage them to choose based on the arguments. If they stall, remind them of the time and that they must decide.

  3. **Problem:** One faction dominating or being too quiet.
     - *Solution:* During preparation, check in with each faction to ensure they have arguments. During presentations, enforce time limits strictly.

  **Final Session Plan in British English:**

  **Materials:**
  - Faction briefing sheets (printed, one per faction member)
  - Council memo (in an envelope)
  - Whiteboard with the three options written
  - Timer

  **Session Flow:**

  1. **Introduction (5 mins):**
     - "Welcome to Weilstadt's town meeting. We are here to decide the fate of August Reinecke's statue and the decaying archive building. The town council has three options: [list options]. You have been assigned to either a lobbying faction or the council. Factions, you will present your case. Council, you will decide. Factions, note: you have specific rules about how you can use history. Council, you are free. The factions will earn persuasion points based on your citations of their arguments. Let's begin."

