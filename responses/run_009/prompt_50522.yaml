    - Council: 1 student? But that's 16. Alternatively, 4 per faction (12) and 4 council? Then 16. But the council should be 3? We can adjust to 3 council and 13 students: 4 per faction and one faction has 5? Or 4,4,5? Let's do:
      - Faction 1: 4
