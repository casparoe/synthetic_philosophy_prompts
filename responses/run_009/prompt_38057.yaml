answer: |-
  The industry's seemingly inconsistent practices reveal a fascinating, pragmatic theory of meaning that blends multiple philosophical approaches without fully committing to any single one. Here's a reconstruction of the implicit framework, its tensions, and what would change if "machines understand nothing" were taken seriously:

  ### 1. **The Implicit Theory of Meaning: Graded Contextual Functionalism**
     - **Meaning = Utility within a Contextual Frame:** The industry treats meaning not as a universal property but as *fitness for a specific purpose within a bounded context*. Different texts have different functional requirements:
       - **Technical Manuals:** Meaning is **procedural accuracy**. Success is defined by the user correctly performing a task (e.g., assembling a part, troubleshooting). Statistical overlap with a reference translation is a *proxy* for preserving instruction sequences. Errors are tolerable if they don’t impede function.
       - **Contracts:** Meaning is **performative validity**. The text must hold legal weight in court. Human certification is less about linguistic nuance and more about assigning legal liability. Formulaic language isn't trusted to MT because legal systems require a human agent to attest to the translation's authority.
       - **Literature:** Meaning is **experiential fidelity**. Success requires preserving the author’s voice, cultural subtext, aesthetic resonance, and the reader’s emotional/intellectual engagement. Statistical metrics fail here because they can’t measure *how* a phrase evokes joy, dread, or irony.

     - **The Role of Stakes & Liability:** High-risk domains (legal, medical, literary reputation) demand human accountability. A mistranslated idiom in a manual may cause frustration; in a contract, it could cost millions; in literature, it destroys artistic integrity.

  ### 2. **Where Practice is Underdetermined: Competing Theories in Tension**
     - **Behaviorism vs. Intentionalism:** Technical MT relies on behaviorist metrics (output matches reference behavior), while literature requires intentionalism (capturing the author's mind). The practice never resolves this conflict—it switches frameworks based on text type.
     - **The "Human Smuggling" Paradox:** Reference-based QA for MT *does* presuppose that human translations encode "real meaning." The metric assumes the reference is a gold standard created by a mind that *understood* the text. This implicitly rejects pure statistical equivalence as sufficient—it’s a cost-saving approximation where stakes are low.
       - *Where the Proxy Breaks Down:*  
         - **Idioms & Ambiguity:** "Spirit vs. flesh" → "vodka vs. meat" has perfect lexical overlap but catastrophic semantic divergence.  
         - **Pragmatics:** A perfectly "accurate" translation might be culturally offensive or misleading.  
         - **Emergent Meaning:** Nuance arising from syntax, rhythm, or intertextuality (e.g., Joyce’s puns) is invisible to alignment metrics.

  ### 3. **What Changes if "Machines Understand Nothing" is Taken Seriously**
  If the industry fully internalized this view (à la Searle's Chinese Room), practices would shift dramatically:
     - **All MT becomes "Drafting Aid":** MT output would *always* be treated as raw material for human post-editing, never as final product. The "reference translation" metric would be seen as insufficient—even for manuals—because it can’t verify *comprehension* of intent or context.
     - **QA Overhaul:** Metrics would prioritize:
       - **Human-in-the-loop validation:** Cognitive testing (e.g., "Does this instruction confuse native speakers?").  
       - **Cross-checking against world knowledge:** Does the translation contradict factual realities?  
       - **Adversarial testing:** Intentional insertion of ambiguities to probe MT's fragility.
     - **Legal/Literary Work Unchanged:** Human certification for contracts and literary translation would be reinforced as non-negotiable. The "understanding gap" would justify their premium cost.
     - **Ethical Disclosures:** Clients might be warned: "MT generates plausible strings without comprehension—use only for low-risk texts."

  ### The Unspoken Consensus
  The industry’s pragmatism suggests a deflationary view: **Meaning is what humans do with texts in specific situations.** Machines are tools for manipulating symbols; humans are agents who *interpret* them. The split isn’t fundamentally about meaning *theory*—it’s about **risk allocation**. Where consequences of failure are manageable (a misassembled chair), statistical proxies suffice. Where failure is catastrophic (a voided contract, a butchered novel), we pay humans to assume responsibility for interpretation.

  **In short:** The practice licenses itself through *functional adequacy*, not philosophical coherence. It accepts that meaning has grades—not as an ontological truth, but as a reflection of human needs and institutional demands. To change this, you wouldn’t need a better theory of meaning; you’d need AI that convinces courts it can bear legal liability, or readers that it feels Murakami’s melancholy. Until then, the split persists.
