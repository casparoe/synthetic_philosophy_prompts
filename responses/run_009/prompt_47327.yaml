answer: |-
  Your query dissects a profound tension in contemporary mathematical practice. Let's reconstruct the implicit epistemology step by step, addressing each question systematically.

  ---

  ### **Brief Brainstorming: Candidate Commitments**
  The mixed practice suggests mathematicians hold *all* these commitments simultaneously:
  1. **Formal certitude as necessary/sufficient**: Machine verification provides indefeasible warrant for truth.
  2. **Understanding as irreducible**: Human-graspable proofs offer semantic insight beyond syntax.
  3. **Social-epistemic pragmatism**: Knowledge transmission requires community-accessible exposition.
  4. **Error-robustness**: Multiple verification layers (human + machine) hedge against systemic risks.
  5. **Mathematical progress as explanatory**: Proofs should illuminate *why* theorems hold, not just *that* they hold.
  6. **Institutional trust**: Proof assistants are opaque "black boxes"; their acceptance relies on communal validation of their kernels over time.

  ---

  ### **Reconstruction of Implicit Epistemology**

  #### **1. Machine Verification & Formalism: Necessary but Not Sufficient?**
  Accepting machine verification **does not strictly presuppose formalism**. Consider:
  - A **Platonist** could hold:  
    - Formal systems *model* mathematical truth (à la Gödel's Platonism).  
    - Machine verification certifies that a theorem follows from axioms within a chosen system.  
    - This is epistemically valuable because it eliminates human error in syntactic checking.  
    - *Grounds*: Reliability of syntactic deduction for establishing conditional truth ("if axioms, then theorem").  
  - An **Anti-Mechanist** (e.g., Penrose) could consistently accept it by distinguishing:  
    - **Verification** (syntax-checking) vs. **Discovery/Understanding** (semantic insight).  
    - Machines excel at the former; humans at the latter.  
    - *Crucial nuance*: The practice accepts machines for *verification*, not for *generating mathematical insight*.  

  **Verdict**: Machine verification presupposes **formal reliability for syntactic deduction**, but not that mathematics *reduces* to formalism. The practice fits with **moderate realism**: truth transcends formalism, but formal proof is our best access to it.

  #### **2. The Demand for Readable Exposition: Beyond Mechanist Explanations**
  The insistence on human-readable proofs **cannot be fully explained by mechanist pragmatism**. While:
  - **Hedging against bugs**: Redundancy guards against kernel errors (e.g., early Coq bugs).  
  - **Trust-management**: Exposition lets referees spot "proof smells" without auditing code.  
  - **Pedagogy**: Explanatory proofs train intuition for future work.  
  - **Conjecture-generation**: Understanding reveals new connections.  

  ...these **presuppose that understanding is epistemically distinctive**. The key evidence:  
  - Mathematicians report machine proofs deliver "conviction without understanding" (e.g., Hales on Flyspeck).  
  - Referees reject formally verified but inexplicable proofs (e.g., if a proof assistant output a proof with no human-interpretable strategy).  
  - The value placed on "insight," "elegance," and "explanatory power" implies that **mathematical knowledge includes grasping *reasons***, not just verifying steps.  

  **Anti-mechanist implication**: Human understanding accesses **semantic content** (meanings, structures, implications) that syntax alone cannot capture. Gödel’s point isn’t that humans "see" truth mystically, but that we leverage **open-ended semantic reasoning** (e.g., recognizing consistency of a system from outside it).  

  #### **3. Philosophical Underdetermination**  
  The practice is compatible with several views but **constrains** them:  
  | **View**               | **Fits Practice?** | **Constraints** |  
  |-------------------------|--------------------|----------------|  
  | **Formalism**           | Yes                | Must accommodate explanatory norms as pragmatic (not epistemic). |  
  | **Platonism**           | Yes                | Must accept formal verification as truth-tracking (not truth-constitutive). |  
  | **Anti-Mechanism**      | Yes                | Must concede machines can handle routine verification. |  
  | **Social Constructivism**| Partially          | Cannot explain why machine proofs compel *all* mathematicians universally. |  

  **What the practice requires**:  
  - Proofs must be **formally verifiable** (machine/human).  
  - Proofs must be **human-interpretable** at some level (not necessarily line-by-line).  

  **What it accommodates**:  
  - *Why* interpretability matters (e.g., pedagogy vs. intrinsic epistemology).  
  - The ontology of mathematical objects.  

  ---

  ### **What If Journals Dropped Readability?**  
  #### **Changes to Norms**  
  - **Proof Assistants as Institutions**:  
    - Mathematicians would need to vouch for the **kernel's reliability** (e.g., via collective "certification boards" for Coq/Lean).  
    - Referees shift from verifying arguments to **auditing metadata** (were axioms consistent? Was the correct kernel used?).  
  - **Loss of Referees**: Traditional refereeing dies; "verificationists" replace them, checking only that code compiles.  
  - **Epistemic Vulnerability**:  
    - Bugs in kernels could propagate undetected (cf. Intel Pentium FDIV bug).  
    - Mathematics risks becoming a **black-box science**—results accepted on trust in tools.  

  #### **Gain or Loss?**  
  - **Mechanist View (Gain)**:  
    - Eliminates human error in verification.  
    - Enables checking of "unreadable" proofs (e.g., 10,000-page combinatorics).  
    - *Net gain*: Mathematics becomes more secure and scalable.  
  - **Anti-Mechanist View (Loss)**:  
    - **Erosion of understanding**: Proofs as mere certificates atrophy mathematical insight.  
    - **Loss of heuristic value**: Unexplanatory proofs don't guide new discoveries (e.g., Appel-Haken's 4-color proof stalled graph theory for years).  
    - *Net loss*: Mathematics becomes a "librarian of truths" without depth.  

  ---

  ### **Coherence of the Practice**  
  The practice is **internally coherent** because it distinguishes two goals:  
  1. **Certification** ("Is this true?") → Delegated to machines for precision.  
  2. **Understanding** ("Why is it true?") → Reserved for humans, requiring exposition.  

  It avoids **self-contradiction** because:  
  - Anti-mechanists can accept that machines verify *derivations* (syntax) while humans grasp *meaning* (semantics).  
  - Gödelian arguments target **complete formalization of human insight**, not formal verification of specific theorems.  

  **Tacit commitment**: Mathematical knowledge is **bifurcated**. Truth is established formally, but the *value* of mathematics lies in human-comprehensible structures. The profession’s silence on this point is pragmatic—not philosophical evasion, but recognition that both verification and understanding are indispensable.  

  **Conclusion**: The practice encodes a **moderately anti-mechanist epistemology** that values formal certainty but treats human understanding as irreplaceable. Dropping readability would sacrifice mathematical depth for efficiency—a tradeoff reflecting a mechanist victory the community implicitly resists.  

  ---  
  Would you like to explore how this aligns with historical cases (e.g., controversies over computer proofs) or specific philosophical frameworks (e.g., Lakatosian proof-analysis)?
