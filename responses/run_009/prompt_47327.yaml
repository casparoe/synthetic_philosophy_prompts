  Let me unpack their three layered questions. First: does machine verification commit mathematicians to formalism? Second: why retain human exposition if machines suffice? Third: where is the practice philosophically flexible? They also want to know what would change if readability requirements were dropped. 

  *scratches head* The tension feels very real. On one hand, accepting Coq/Lean proofs suggests proof-is-derivation. On the other, when mathematicians say they "see" the truth of Gödel sentences, they're claiming something extra-formal. And yet - curiously - both coexist in practice. 

  *starts brainstorming candidate commitments*
  The profession might believe:
  - Formal verification is sufficient for truth
  - Human exposition is necessary for community function
  - Understanding is distinct from verification
  - Proofs serve multiple epistemic purposes
  - Trust requires redundancy

  For reconstruction... perhaps the practice isn't inconsistent but pluralistic? Mathematical knowledge appears to have both a syntactic dimension (verifiable by machine) and a semantic dimension (requiring human interpretation). The residual demand for exposition could be explained mechanistically as error-checking or socially as trust-building, but that feels reductive. More plausibly, mathematicians act as if understanding provides additional justification beyond formal correctness. 

  *considers underdetermination*
  Fascinatingly, the practice could accommodate both:
  - A mechanist who views exposition as heuristic scaffolding
  - An anti-mechanist who sees machines as useful but incomplete
  - A pluralist who considers multiple proof modes valuable

  If journals dropped readability requirements... *winces* The verificationist gain in efficiency might be offset by losses in heuristic value and error-detection. Referees would become glorified metadata checkers. The mechanist might celebrate this; the anti-mechanist would mourn it as epistemological impoverishment. 

