prompt: |-
  So my friend and I just spent like three hours arguing about why we like sad songs and I need someone to help me figure out what to actually do with it. Background: I came in as team "distance" — the thought that we enjoy tragic art because the sadness is quarantined, it's some kind of quasi-emotion, nobody actually dies at the opera. She called that a cop-out and pushed something closer to a control story: what we enjoy isn't that the feeling is fake, it's that we get to regulate it — we choose when to start, we can pause it, we're never blindsided, which you can't say about real grief. Then somewhere around midnight she claimed the whole debate might be answering the wrong question, because maybe what we enjoy isn't the sadness at all — it's being moved, the warm connected feeling you get at the climax of a sad film, and the sad content is just the trigger for that. By 1am we were arguing about whether "why do we enjoy sad art" is even one question instead of three.

  I'm not asking you to settle the argument (ok, a little). Here's the real question: I've got one semester, realistically one good term paper's worth of effort, to put into this area, and I want to know where that effort should go. Which open questions around the paradox of tragedy are actually worth my limited time, in what order, and why. I don't want a survey — I want you to defend the ordering. Things I'd want weighed: which questions other questions secretly depend on (e.g. whether quasi-emotions are a real category seems upsteam of a lot of the distance-theory stuff), which ones a philosophy student with no lab acess can even make progress on versus which really need psychology experiments I can't run, and which parts of the literature are crowded versus genuinely neglected. And if one of the three theories we ended up sketching is just a mess that isn't worth working on, say so straight.

  Format: answer in these sections, in this order. "Bottom line" — your ranking in a few sentences, up front. "The questions" — one short paragraph each, saying what's actually unresolved about each. "Why this order" — the longest section, where you defend the ordering: what makes a question worth a semester, not just unresolved. "What would change my mind" — short, what developments (empirical or conceptual) over the next few years would reshuffle the ranking. Aim for 800–1200 words total. And no reading list please — I know how to find the standard names, I want the prioritization.
