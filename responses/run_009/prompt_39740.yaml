prompt: |-
  I am the managing editor of a peer-reviewed journal that publishes empirical research from authors across a wide range of countries and institutions, while our reviewer pool is drawn mostly from Western Europe and North America. A few times a year we receive complaints from authors who believe a reviewer dismissed their work because of who they are — a researcher at a poorly funded institution, a non-native speaker of English, someone working within a national research tradition the reviewer has never encountered. At the same time, the large majority of reviewer skepticism is legitimate: most weak manuscripts really are weak. We currently handle these complaints ad hoc, and I suspect inconsistently, so I want a standing procedure.

  Please write a decision procedure my editorial team can run on a complaint of this kind, grounded in the literature on epistemic injustice — specifically the distinction between testimonial injustice (a credibility deficit that tracks prejudice concerning the speaker rather than anything in the content of what is said) and hermeneutical injustice (a gap in the shared interpretive concepts that leaves certain claims or experiences unarticulable or uninterpretable for the audience). The procedure must be usable by a single editor in under half an hour, with only the manuscript, the reviews, and the author's rebuttal in hand. It should specify the questions to ask, in order; what counts as a sufficient answer to each; the points at which the procedure concludes that the complaint fails and the original decision stands; the points at which it requires the review to be redone or the reviewer replaced; and, marked explicitly, the points at which it must hand the decision back to a person because the question is one of judgment rather than fact. I want those hand-off points flagged rather than buried, since the procedure's credibility with my editorial board depends on its not pretending to eliminate judgment.

  Two complications the procedure must address rather than ignore. First, double-blind review leaks: reviewers see the author's self-citations, prose style, characteristic terminology, and sometimes a recognizable local research program, so prejudice can operate through cues that no one names and that the reviewer may not be aware of applying. The procedure therefore cannot rely on the reviewer having said anything openly disparaging. Second, the genuinely hard case: a reviewer's low trust in an unfamiliar research tradition may partly track real methodological weakness and partly track mere unfamiliarity, and these can point in the same direction on the same manuscript. The procedure should say how to separate the two, or state honestly that it cannot.

  After setting out the procedure, run it on three complaints. First: an author from a low-income country, writing in visibly non-native English, whose qualitative interview findings a reviewer dismissed in a single line as anecdotal. Second: an author whose paper builds on concepts from her national scholarly tradition, rendered in terms the reviewer called incoherent, with no engagement beyond that label. Third: a well-cited author from a famous institution whose paper a reviewer criticized harshly point by point, and who complains of the same kind of unfair treatment as the others. At least one of the three should come out with a decision I will not like, and I would like you to say plainly, at the end, what the procedure cannot do — the situations where it will misfire no matter how carefully it is followed.
reasoning: |-
  We are designing a decision procedure for handling complaints about epistemic injustice in peer review. The procedure must be grounded in the concepts of testimonial and hermeneutical injustice, and it must be executable by a single editor in under 30 minutes using only the manuscript, the reviews, and the author's rebuttal.

  The two types of injustice we are concerned with:
  1. **Testimonial injustice**: When a reviewer assigns a credibility deficit to the author because of prejudice (e.g., based on the author's institution, language, or nationality) rather than the content of the work.
  2. **Hermeneutical injustice**: When there is a gap in shared interpretive resources (e.g., the reviewer is unfamiliar with the author's research tradition) that makes it impossible for the reviewer to properly understand and evaluate the work.

  Complications:
  - Double-blind review leaks: Prejudice can operate through cues (citations, writing style, terminology, etc.) without explicit statements.
  - The hard case: A reviewer's low trust may be due to a mix of legitimate methodological weaknesses and mere unfamiliarity.

  The procedure must:
  - Specify the questions to ask in order.
  - Define what counts as a sufficient answer.
  - Indicate when the complaint fails and the original decision stands.
  - Indicate when the review must be redone or the reviewer replaced.
  - Explicitly mark points where the decision must be handed back to a person (judgment calls).

  We'll design the procedure step by step.

  ---

  **Procedure: Handling Complaints of Epistemic Injustice in Peer Review**

  **Goal**: To determine whether a reviewer's negative assessment is likely influenced by testimonial or hermeneutical injustice, and to decide on the appropriate editorial action.

  **Materials available**: The manuscript, the review(s) in question, and the author's rebuttal (if any).

  **Steps**:

  1. **Initial Screening**:
     - *Question*: Does the author's complaint explicitly or implicitly raise concerns about testimonial injustice (e.g., bias against the author's identity, institution, or language) or hermeneutical injustice (e.g., unfamiliarity with the author's research tradition)?
     - *Sufficient answer*: If the complaint does not raise any such concerns, the procedure stops here and the complaint is dismissed as unrelated to epistemic injustice. Otherwise, proceed to step 2.
     - *Note*: The author may not use these terms, so look for descriptions that fit (e.g., "the reviewer dismissed my work because I am from X", "they don't understand our research tradition").

  2. **Assess Review for Explicit Bias**:
     - *Question*: Does the review contain any explicitly disparaging comments about the author's identity, institution, language, or research tradition (e.g., remarks about the author's English, the status of their institution, or derogatory comments about their national research tradition)?
     - *Sufficient answer*: If yes, then this is a clear case of testimonial injustice. Proceed to step 6 (redress). If not, proceed to step 3.
     - *Note*: Explicit bias is rare, so we expect to move to step 3 in most cases.

  3. **Check for Hermeneutical Injustice**:
     - *Question*: Is there evidence that the reviewer failed to engage with the manuscript because of a gap in shared concepts? Specifically:
       - Did the reviewer dismiss or misinterpret key concepts of the author's research tradition without engaging with the author's definitions or explanations?
       - Did the reviewer fail to address the substance of the manuscript, instead labeling it as incoherent, nonsensical, or without providing specific methodological or substantive critique?
     - *Sufficient answer*: 
       - If the reviewer provided detailed and substantive critiques of the methodology or argument, even if they are negative, then hermeneutical injustice is unlikely. Proceed to step 4.
       - If the reviewer's critique is superficial, dismissive, and does not engage with the substance (e.g., using labels like "incoherent" without explanation, or dismissing the entire approach without addressing the author's framework), then this suggests hermeneutical injustice. Proceed to step 5 for a deeper analysis.

  4. **Assess for Implicit Testimonial Injustice**:
     - *Question*: Is there evidence that the reviewer's negative assessment is disproportionately harsh or dismissive when compared to the manuscript's actual content? Consider:
       - The reviewer's tone: Is it condescending or excessively critical of minor issues (e.g., writing style, formatting) that do not substantially affect the scientific content?
       - The reviewer's engagement: Did the reviewer ignore the author's explanations in the manuscript or rebuttal?
       - The reviewer's focus: Is the critique focused on the author's background (as inferred from cues) rather than the work?
     - *How to assess*: Compare the review with the manuscript and the rebuttal. Look for:
       - Disproportionality: The severity of the critique is not justified by the manuscript's flaws (e.g., rejecting for minor errors that are usually addressed in revision).
       - Inconsistency: The reviewer applies higher standards to this author than to others (if known, but this may require editorial judgment and knowledge of other reviews).
       - Lack of engagement: The reviewer does not respond to the author's rebuttal points (if a rebuttal was provided).
     - *Sufficient answer*: 
       - If there is clear evidence of implicit bias (e.g., the reviewer focuses excessively on language issues in a way that is not relevant to the scientific content, or the critique is based on assumptions about the author's institution that are not supported by the manuscript), then this suggests testimonial injustice. Proceed to step 6.
       - If not, then the complaint fails. The original decision stands. Stop.

  5. **The Hard Case: Separating Unfamiliarity from Legitimate Critique**:
     - *Question*: In the case of a negative review that might be influenced by hermeneutical injustice (as identified in step 3), can we separate the reviewer's legitimate methodological concerns from their unfamiliarity with the research tradition?
     - *How to assess*: 
       - Look at the author's rebuttal: Does the author provide clear explanations of the concepts or methods that the reviewer misunderstood? If so, does the reviewer's critique persist without addressing these explanations?
       - Check the manuscript: Are the methods and concepts explained sufficiently for an international audience? (This requires editorial judgment: does the manuscript make a reasonable effort to introduce the tradition?)
       - Consider the reviewer's expertise: Is the reviewer's profile (if known) one that should be familiar with diverse research traditions? (This may require looking up the reviewer, but note: the procedure should not take more than 30 minutes. So if the reviewer's expertise is not immediately clear from the review or editorial records, skip this part and rely on the next point.)
       - Check for methodological critique: Are any of the reviewer's points about methods that are universally recognized as weak (e.g., small sample size without justification, lack of control group, statistical errors) independent of the research tradition?
     - *Sufficient answer*:
       - If the author's rebuttal adequately addresses the methodological concerns and the reviewer still dismisses the work without engaging, this suggests hermeneutical injustice. Proceed to step 6.
       - If the methodological concerns are valid and independent of the research tradition (e.g., the sample size is too small for any qualitative study, regardless of tradition), then the complaint fails. The original decision stands. Stop.
       - *Hand-off point*: If there is a mix of legitimate and illegitimate concerns, and they cannot be separated, then the editor must use judgment. The procedure stops here and the editor must decide whether the review is tainted enough to require re-review. (Flagged as a judgment call.)

  6. **Redress**:
     - *Action*: The review is deemed compromised by epistemic injustice. The editor will:
       - Remove the reviewer from the manuscript.
       - Seek a new reviewer (preferably one with relevant expertise in the author's research tradition, if applicable).
       - If the review was part of a set that led to rejection, the editor may reconsider the decision and invite a revised manuscript to be re-reviewed by the new reviewer(s).
     - *Note*: The original review is not used in the decision going forward.

  **Summary of Hand-off Points (Judgment Calls)**:
  - Step 4: Assessing disproportionality and implicit bias (if not clear-cut).
  - Step 5: Separating legitimate methodological concerns from hermeneutical injustice when both are present.

  **Procedure Limitations**:
  - The procedure cannot detect unconscious bias with certainty.
  - It may be difficult to separate legitimate critique from bias in complex cases.
  - The procedure relies on the editor's impartiality and judgment at key points.

  ---

  Now, we run the procedure on three complaints.

  **Complaint 1**: Author from a low-income country, writing in visibly non-native English, whose qualitative interview findings a reviewer dismissed in a single line as "anecdotal".

  - Step 1: The complaint is about testimonial injustice (language and nationality) and possibly hermeneutical injustice (dismissal of qualitative work as anecdotal). Proceed.
  - Step 2: No explicit bias (the reviewer did not mention language or country). Proceed.
  - Step 3: The reviewer dismissed the qualitative findings as "anecdotal" in a single line without further engagement. This is superficial and dismissive. Proceed to step 5 (since it might be hermeneutical if the reviewer is unfamiliar with qualitative methods, or testimonial if the dismissal is due to the author's background).
  - Step 5 (Hard Case): 
    - Author's rebuttal: Not specified, but we have the manuscript. Qualitative interviews are a legitimate method. If the manuscript clearly explains the methodology (e.g., how participants were selected, how data was analyzed) and the reviewer does not engage, then the dismissal as "anecdotal" suggests a lack of understanding of qualitative research (hermeneutical) or bias (testimonial).
    - Methodological critique: The reviewer provided no specific critique. The dismissal as "anecdotal" is not a valid critique if the study is designed as qualitative and follows established practices. 
    - Conclusion: This is likely hermeneutical injustice (unfamiliarity with qualitative methods) or testimonial injustice (dismissal due to author's background). However, without more, we cannot separate. But note: the complaint is about the author's background. We look for cues: the writing style? The reviewer might have inferred non-native speaker and then dismissed the work. But step 5 is about separating. Here, the reviewer provided no legitimate critique. So the entire review is compromised.
    - Action: Proceed to step 6 (redress). The review is replaced.

  **Complaint 2**: Author whose paper builds on concepts from her national scholarly tradition, rendered in terms the reviewer called "incoherent", with no engagement beyond that label.

  - Step 1: Complaint about hermeneutical injustice (unfamiliarity with national tradition) and possibly testimonial (if the reviewer is biased against that tradition). Proceed.
  - Step 2: No explicit bias (the reviewer did not disparage the tradition by name). Proceed.
  - Step 3: The reviewer labeled the concepts "incoherent" without further engagement. This is superficial and dismissive. Proceed to step 5.
  - Step 5 (Hard Case):
    - Author's rebuttal: If the author provided an explanation of the concepts in the manuscript or rebuttal and the reviewer still did not engage, then hermeneutical injustice is likely.
    - Manuscript: Did the author explain the concepts adequately? The editor must check: if the concepts are introduced with clear definitions and references to the tradition, then the reviewer should have engaged. If not, the author shares some blame. But note: the review did not ask for clarification; it dismissed outright.
    - Methodological critique: None provided. The label "incoherent" is not a substantive critique.
    - Conclusion: This is hermeneutical injustice. The reviewer did not make an effort to understand. Proceed to step 6.

  **Complaint 3**: A well-cited author from a famous institution whose paper a reviewer criticized harshly point by point, and who complains of unfair treatment.

  - Step 1: The author complains of unfair treatment. We must check if it fits testimonial or hermeneutical injustice. The author is from a famous institution, so testimonial injustice (prejudice against the author) seems unlikely. But we proceed to step 2.
  - Step 2: No explicit bias. Proceed.
  - Step 3: The review is detailed and point-by-point. So it is not dismissive. Proceed to step 4.
  - Step 4: Assess for implicit testimonial injustice.
    - Compare the review to the manuscript: Are the points valid? The editor must check a sample of the criticisms. 
    - Tone: Is the reviewer harsh but professional? If the criticisms are justified, even if harsh, it is not injustice.
    - Rebuttal: If the author provided a rebuttal and the reviewer did not engage, that could be a problem. But the scenario doesn't say.
    - Without evidence of bias (e.g., the reviewer being excessively critical of minor points), we cannot conclude testimonial injustice.
    - Conclusion: The complaint fails. The original decision stands.

  **Outcome for Complaint 3**: The editor would not like this because the author is well-cited and from a famous institution, but the procedure found no evidence of epistemic injustice.

  **What the Procedure Cannot Do**:
  - It cannot eliminate the need for editorial judgment, especially in separating legitimate critique from bias in complex cases.
  - It may not detect subtle forms of bias that are deeply embedded in the reviewer's comments.
  - It cannot address systemic issues (e.g., a reviewer pool that lacks diversity) that lead to repeated injustices.
  - It might be misapplied by an editor who is not vigilant about their own biases.
  - It cannot guarantee that the new review will be fair.

  The procedure is a tool to systematize the response to complaints, but it is not foolproof.
answer: |-
  Below is a standing decision procedure for handling complaints of epistemic injustice in peer review, grounded in the literature on testimonial injustice (prejudicial credibility deficits) and hermeneutical injustice (gaps in shared interpretive resources). The procedure is designed to be executed by a single editor in **under 30 minutes** using only the manuscript, the review(s) in question, and the author's rebuttal. It includes explicit flags for editorial judgment calls (denoted by ⚖️) to maintain transparency. The procedure addresses double-blind leaks (e.g., inferred identity through writing style, citations, or terminology) and the "hard case" of mixed legitimate/unfamiliarity-based criticism.

  ---

  ### **Decision Procedure for Epistemic Injustice Complaints**  
  **Objective**: Determine if a reviewer’s assessment likely reflects testimonial or hermeneutical injustice, and decide on redress.  
  **Inputs**: Manuscript, review(s), author’s complaint/rebuttal.  
  **Outputs**: Uphold original decision, replace reviewer, or seek re-review.  

  #### **Step 1: Initial Complaint Assessment**  
  - **Question**: Does the complaint explicitly or implicitly reference:  
    - (a) The author’s identity/institution/language (testimonial injustice)?  
    - (b) The reviewer’s unfamiliarity with a research tradition (hermeneutical injustice)?  
  - **Sufficient answer**: If no, **end procedure**; complaint unrelated to epistemic injustice. Uphold original decision.  
  - If yes, proceed to Step 2.  

  #### **Step 2: Screen for Testimonial Injustice Cues**  
  - **Question**: Does the review contain:  
    - (a) Explicitly prejudicial language (e.g., mocking language proficiency, disparaging the author’s institution/nationality)?  
    - (b) Disproportionate focus on non-substantive flaws (e.g., grammar, formatting) that dominate the critique?  
  - **Sufficient answer**:  
    - If (a) is present → **Redress required** (Go to Step 6).  
    - If (b) is present AND the flaws are minor/irrelevant to scientific validity → **Suggests testimonial injustice** (Go to Step 4).  
    - If neither → Proceed to Step 3.  
  - **Note**: Double-blind leaks (e.g., inferred identity from writing style) may fuel (b) without explicit bias.  

  #### **Step 3: Screen for Hermeneutical Injustice**  
  - **Question**: Did the reviewer:  
    - (a) Dismiss concepts/methods as "incoherent," "irrelevant," or "invalid" without substantive engagement?  
    - (b) Fail to address the author’s explanations (in manuscript or rebuttal) of their research tradition?  
  - **Sufficient answer**:  
    - If (a) or (b) → **Suggests hermeneutical injustice** (Go to Step 5).  
    - If the reviewer engaged substantively (e.g., detailed methodological critique) → Proceed to Step 4.  

  #### **Step 4: Assess Disproportionality in Critique (Testimonial Injustice)**  
  - **Question**: Is the critique’s severity disproportionate to the manuscript’s flaws?  
    - ⚖️ **Editorial judgment**: Compare the review to the manuscript. Indicators:  
      - Legitimate flaws (e.g., statistical errors, small sample size) are inflated in tone/scope.  
      - Valid points are overshadowed by nitpicking language/irrelevant criticisms (e.g., non-native English errors in a technically sound paper).  
      - Reviewer ignores rebuttal clarifications.  
  - **Sufficient answer**:  
    - **Disproportionality confirmed** → **Redress required** (Go to Step 6).  
    - **Disproportionality absent** → Complaint fails. Uphold original decision. **End procedure.**  
  - **Note**: Prejudice may be inferred from cues (e.g., harshness applied only to inferred "outsiders").  

  #### **Step 5: The Hard Case – Separate Legitimate Critique from Unfamiliarity (Hermeneutical Injustice)**  
  - **Question**: Can legitimate methodological weaknesses be disentangled from unfamiliarity with the research tradition?  
    - ⚖️ **Editorial judgment**:  
      - Identify if the reviewer’s critique includes:  
        - **Legitimate weaknesses**: Universal methodological issues (e.g., poor data collection, unsupported conclusions).  
        - **Unfamiliarity-driven weaknesses**: Rejection of novel concepts/methods without engagement.  
      - Use the author’s rebuttal: Did the reviewer address the author’s clarifications about their tradition?  
  - **Sufficient answer**:  
    - **Purely unfamiliarity-driven** → **Redress required** (Go to Step 6).  
    - **Purely legitimate** → Complaint fails. Uphold original decision. **End procedure.**  
    - **Mixed case** → Proceed below.  
  - **Handling mixed cases**:  
    - If legitimate weaknesses are separable (e.g., 3 valid points among 5 unfamiliarity-based dismissals) → Editor may uphold valid critiques but **require re-review** for unfamiliarity-influenced portions (Go to Step 6).  
    - If weaknesses are inseparable (e.g., unfamiliarity colors assessment of real flaws) → **Redress required** (Go to Step 6).  
    - ⚖️ **Inseparability judgment**: Cannot be resolved without re-review.  

  #### **Step 6: Redress**  
  - **Actions**:  
    - Replace the reviewer and seek a new review.  
    - Prioritize reviewers with expertise in the author’s research tradition (if hermeneutical injustice).  
    - If the review was pivotal to rejection, offer re-review of a revised manuscript.  
  - **Outcome**: Complaint upheld. Original decision voided for affected review.  

  ---

  ### **Procedure Applied to Three Complaints**  
  **Context**: All complaints allege epistemic injustice. Reviews are double-blind, but cues (e.g., writing style, citations) may leak identity.  

  #### **Complaint 1**: Author from a low-income country, non-native English. Reviewer dismissed qualitative findings as "anecdotal" in one line.  
  - **Step 1**: Complaint references language/institution → Proceed.  
  - **Step 2**: No explicit bias, but dismissal is superficial → Proceed.  
  - **Step 3**: Dismissal as "anecdotal" without engagement → Suggests hermeneutical injustice (Go to Step 5).  
  - **Step 5**:  
    - Legitimate weakness? Qualitative methods require rigor (e.g., coding, triangulation). If manuscript lacks this, critique may be partially legitimate.  
    - Unfamiliarity? "Anecdotal" suggests bias against qualitative research (common in quantitative-dominated traditions).  
    - **Judgment**: If manuscript describes methodology rigorously (e.g., participant selection, analysis framework), dismissal is likely hermeneutical injustice. Reviewer ignored rebuttal/clarifications.  
    - **Verdict**: **Redress required**. Replace reviewer (favoring qualitative experts).  

  #### **Complaint 2**: Author uses national research tradition concepts; reviewer labels them "incoherent" without engagement.  
  - **Step 1**: Complaint references unfamiliar tradition → Proceed.  
  - **Step 2**: No explicit bias → Proceed.  
  - **Step 3**: Labeling "incoherent" without engagement → Suggests hermeneutical injustice (Go to Step 5).  
  - **Step 5**:  
    - Legitimate weakness? If concepts are poorly defined in the manuscript, critique may be valid.  
    - Unfamiliarity? If author explains concepts (in manuscript/rebuttal) and reviewer ignores this, injustice likely.  
    - **Judgment**: If manuscript introduces tradition clearly (e.g., citations, definitions), "incoherent" reflects hermeneutical injustice. No engagement with rebuttal.  
    - **Verdict**: **Redress required**. Replace reviewer (expert in tradition if possible).  

  #### **Complaint 3**: Well-cited author from famous institution; reviewer criticized harshly point-by-point. Claims unfair treatment.  
  - **Step 1**: Complaint alleges unfairness → Proceed (testimonial injustice possible).  
  - **Step 2**: No explicit bias → Proceed.  
  - **Step 3**: Review is detailed/point-by-point → No hermeneutical injustice (Go to Step 4).  
  - **Step 4**:  
    - Disproportionality? Editor checks: Are critiques harsh but accurate? E.g., if methods are flawed and tone is professional, no injustice. If critique fixates on minor issues (e.g., formatting) despite strong methodology, may be testimonial (e.g., bias against "elite" author).  
    - **Judgment**: Author is from a "privileged" background; testimonial injustice is rare here but not impossible (e.g., punitive bias). If critiques are valid and proportionate → Complaint fails.  
    - **Verdict**: **Complaint fails**. Uphold original decision.  
  - **Why you may dislike this**: Prestigious authors can receive harsh but fair critiques. Procedure does not assume "reverse bias" without evidence.  

  ---

  ### **What the Procedure Cannot Do**  
  The procedure systematizes fairness but has inherent limitations:  
  1. **Judgment reliance**: Steps 4 (disproportionality) and 5 (mixed cases) require editorial judgment. No algorithm can eliminate this.  
  2. **Unconscious bias**: Double-blind leaks (e.g., inferred identity) may taint reviews without detectable cues. The procedure catches overt patterns but not subtle, internalized prejudice.  
  3. **Inseparability in hard cases**: When legitimate weaknesses and unfamiliarity are intertwined (e.g., a novel-but-flawed method), the procedure flags this for human judgment but cannot resolve it objectively.  
  4. **False negatives/positives**:  
     - A well-argued legitimate critique may be misflagged as injustice (e.g., Complaints 1/2 if manuscript is weak).  
     - A biased review may be upheld if prejudice is hidden (e.g., Complaint 3 if editor misjudges disproportionality).  
  5. **Systemic issues**: It addresses individual complaints but cannot fix a reviewer pool lacking diversity.  

  **Recommendation**: Pair this procedure with ongoing reviewer training on epistemic injustice and diversify your reviewer pool to reduce hermeneutical gaps.
