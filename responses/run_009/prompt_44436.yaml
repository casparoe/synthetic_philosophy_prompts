prompt: |-
  You're a philosopher who's spent the last few years hanging around conservation biologists and wild-animal-welfare people, so you know both literatures well. Think for a bit before writing — brainstorm what the hard cases actually are — and then give me the following.

  I keep getting into arguments that go like this: someone says "habitat destruction is bad", someone else says "actually, most wild animals live short brutal lives, so fewer of them might mean less suffering, so maybe habitat loss is net positive", and then everyone throws population ethics at each other until the meeting ends. I don't want another take. I want the spec first: the list of things a theory would have to get right before it's allowed to issue verdicts on whether destroying or restoring a given habitat reduces wild animal suffering. Like, what any adequate theory of *net ecosystem welfare* has to deliver.

  Some things I want the list to reckon with, at minimum — the theory has to handle r-selected species (destroying a wetland can mean preventing billions of short insect lives — does that count as preventing suffering?), the baseline problem (compare the destroyed habitat to what — pristine wilderness, current degraded state, the parking lot that replaces it?), whether it can even say destruction *wrongs* animals that will never exist because of it, the fact that evolution optimizes fitness and not welfare, and whether the theory says anything about predation (a theory on which more habitat is always good had better not be secretly assuming most lives are worth living). It should also respect the individualism/holism split — Aldo Leopold's land ethic treats the ecosystem as the unit of moral concern, most welfare people treat individual animals as the unit; a theory that stays silent on that is hiding the ball. And it has to be *usable* under massive empirical uncertainty, or admit it isn't and tell me what that admission costs.

  Structure it like this, sections in this order:

  1. **Why the obvious answers die fast** — ~150 words, the two or three moves everyone tries and why each begs a question.
  2. **The desiderata** — the bulk of it, ~700 words. Each requirement stated, then the case or consideration behind it, briefly. Don't just list the repugnant conclusion by name and move on — tell me what applying it to animals specifically changes.
  3. **Tensions** — ~250 words. Which pairs of desiderata you suspect can't be jointly satisfied, and what it means for the whole enterprise if the list is unsatisfiable.
  4. **Non-negotiables vs camp preferences** — ~150 words. Which requirements any serious theory must meet and which are just what utilitarians (or holists, or person-affecting people) happen to want.
  5. **Scorecard** — ~200 words max, and keep it quick: total utilitarianism, average utilitarianism, a person-affecting view, and the land ethic, against the list. I care about the criteria, not the scoreboard.

  Don't pad, don't hedge everything into mush, and dont pretend there's a view that passes every requirement — if there isn't, say which requirement you'd drop and why.
reasoning: |-
  Okay, the user wants me to create a structured analysis of what a theory of net ecosystem welfare must include to evaluate habitat destruction. They're frustrated with endless philosophical debates about wild animal suffering and habitat loss, and want concrete criteria for any adequate theory.

  Hmm, the user seems knowledgeable - they mention r-selected species, the baseline problem, and Aldo Leopold's land ethic. They're probably an academic or conservation professional tired of circular arguments. The challenge is balancing ethical rigor with practical usability.

  First, I need to address why simple answers fail. "Prevent suffering" arguments ignore that preventing existence isn't harm in all frameworks, while "biodiversity good" assumptions don't examine individual welfare. Baseline issues plague both approaches.

  For the desiderata section, I'll organize around seven key requirements:
  1) Handling r-selection - must account for insect-scale suffering
  2) Solving baselines - must specify comparison scenarios
  3) Non-identity problem - address whether never-existing animals are wronged 
  4) Evolution/welfare disconnect - recognize fitness ≠ wellbeing
  5) Predation's role - can't ignore food chain suffering
  6) Individualism/holism tension - must declare primary moral unit
  7) Uncertainty tolerance - must work with limited data

  The tensions section will highlight conflicts, like reconciling individualism with ecosystem stability, or handling r-selection without absurd conclusions about extinction being good.

  For non-negotiables, empirical awareness and declaring moral units seem essential, while specific population ethics choices feel more like camp preferences.

  In the scorecard, I'll quickly show how total utilitarianism, average utilitarianism, person-affecting views, and land ethics each fail different requirements - not to declare winners but to illustrate how the criteria expose weaknesses.

  The user clearly wants this to cut through debates, so I'll keep it sharp and avoid hedging. If pressed, I'd probably drop the non-identity requirement as least essential for practical conservation decisions.
answer: |-
  ### 1. **Why the obvious answers die fast**  
  The intuitive "prevent suffering" argument (destroying r-selected habitats = fewer miserable lives) collapses because it assumes non-existent beings can be harmed by never existing—a claim rejected by person-affecting views. Conversely, "more habitat = more welfare" presumes wild lives are net positive, ignoring evolutionary pressures toward high reproduction/suffering equilibria. Baseline issues torpedo both: comparing destruction to "pristine" nature ignores current degradation, while comparing to human replacement (e.g., parking lots) smuggles in assumptions about artificial ecosystems. Each move implicitly picks a contested population axiology or baseline, begging the core questions.

  ### 2. **The desiderata**  
  **A. r-Selected Suffering Accounting**  
  *Requirement:* The theory must quantify welfare impacts of mass short-lived animal cohorts (e.g., insects, fish spawn).  
  *Why:* Billions of brief, predation-heavy lives dominate ecosystem headcounts. Ignoring them renders the theory empirically irrelevant for most habitats.  

  **B. Resolved Baseline Specification**  
  *Requirement:* Explicitly define the counterfactual(s) for comparison (e.g., "natural" state, current trajectory, human-altered alternative).  
  *Why:* "Destroying habitat X" could reduce suffering vs. a degraded baseline but increase it vs. restoration. Silent baselines guarantee equivocation.  

  **C. Non-Identity Problem Engagement**  
  *Requirement:* Clarify whether preventing future beings (due to destruction) constitutes harming them or reducing suffering.  
  *Why:* If future animals aren't "harmed" by non-existence, destruction may reduce suffering without wronging anyone—undermining restoration ethics.  

  **D. Evolution-Fitness Decoupling**  
  *Requirement:* Acknowledge that traits maximizing fitness (e.g., high fecundity, pain tolerance) often exacerbate suffering.  
  *Why:* Assuming "natural = good" ignores that selection optimizes for genes, not welfare. A theory must separate biological "success" from moral value.  

  **E. Predation-Inclusive Calculus**  
  *Requirement:* Integrate predation’s welfare impacts—both victim suffering and predator dependence.  
  *Why:* A theory claiming habitat expansion is good must explain why creating more predator-prey cycles isn’t net harmful if most lives are net negative.  

  **F. Individualism/Holism Stance**  
  *Requirement:* Declare the primary moral unit: individual animals (welfare) or ecosystems/biodiversity (holism).  
  *Why:* Leopold’s land ethic prioritizes ecosystem integrity even if individuals suffer; individualism rejects this. Hybrid models must specify how they balance units.  

  **G. Uncertainty-Tolerant Operability**  
  *Requirement:* Deliver actionable verdicts under ignorance of species ratios, sentience, and welfare distributions.  
  *Why:* We lack data on >99% of species. A theory demanding precise suffering metrics is useless for real-world decisions.  

  ### 3. **Tensions**  
  **Individualism vs. Holism + Uncertainty:** Prioritizing individual welfare requires data on suffering distributions (desideratum G), but holism (F) sidesteps this with ecosystem metrics. Yet holism struggles with r-selection (A) if insect suffering is morally negligible. **Predation vs. Non-Identity:** If predation is intrinsically bad, preventing predator existence via habitat loss might be good—but only if non-existent predators aren’t "harmed" (C). If the list is unsatisfiable, the enterprise may fracture: one theory for high-data cases (e.g., mammals), another for invertebrates, or concede habitat-scale verdicts are intractable.  

  ### 4. **Non-negotiables vs Camp Preferences**  
  **Non-negotiables:** Any theory must resolve the baseline (B), declare its moral unit (F), and acknowledge evolution-welfare decoupling (D). Without these, it’s either incoherent or covertly ideological.  
  **Camp preferences:** Handling non-identity (C) is split: person-affecting views demand it, total utilitarianism rejects it. Similarly, predation’s intrinsic (dis)value (E) is optional—negative utilitarians care, others may see it as instrumentally necessary.  

  ### 5. **Scorecard**  
  - **Total Utilitarianism:** Fails D (ignores fitness-suffering link), shaky on E (more lives = good even with predation), strong on A/C.  
  - **Average Utilitarianism:** Better on E (if average welfare is low, avoid expansion), fails G (requires precise welfare data), silent on F.  
  - **Person-Affecting:** Strong on C (no harm to non-existent), fails A (r-selection welfare irrelevant), ignores D/F.  
  - **Land Ethic (Holism):** Excels at F/G (ecosystem metrics, tolerates uncertainty), fails A/C (ignores individual suffering/non-identity).  

  **If forced to drop one:** Desideratum C (non-identity). While philosophically weighty, its intractability paralyzes policy; we can act *as if* future animals matter pragmatically without resolving it.
