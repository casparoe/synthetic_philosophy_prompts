prompt: |-
  I teach an upper-level philosophy of mind seminar — fifteen students, one 90-minute session — and we are nearing the unit on illusionist and interface-style views of consciousness: the idea, running from Dennett's attack on the Cartesian theater through Tor Nørretranders's "user illusion" and Keith Frankish's illusionism, that what introspection presents to us is less a faithful window onto our own minds than a useful dashboard — a compressed, misleadingly rich-seeming interface whose primary job is guiding action, not reporting how things actually are downstream. My students find this view easy to state and almost impossible to feel: on paper it sounds like a claim about information processing, and they nod along without ever confronting the fact that their own introspective reports are exactly the kind of thing the view says are confabulated press releases. I want an in-class activity that produces that confrontation experientially rather than rhetorically.

  Design a runnable activity built around staged demonstrations of introspective failure that the participants themselves generate and then mis-explain. You may draw on well-replicated paradigms — anchoring by arbitrary numbers, choice blindness (secretly swapping a chosen option and asking the person to justify "their" choice), post-hoc rationalization of decisions made under time pressure — but the justifications have to come from my students about their own real choices, and the class has to discover the manipulation rather than be told about it. I imagine something with roles (the subject, the auditors who bet on whether a stated reason is the actual cause, perhaps a "press secretary" who must defend a decision she didn't make), a point-based payoff scheme with no real money, and a structure where the participants' confidence in their introspective reports is pitted against the audit trail the facilitator has quietly kept. Please give full rules, materials, a minute-by-minute timeline, and a debrief that maps specific moments in the activity onto specific components of the user-illusion picture: the distinction between misidentifying the causes of a decision and misrepresenting the character of an experience, the difference between an interface that is useful and one that is accurate, and why the illusionist says the sense of phenomenality survives being told it is an illusion.

  Two further asks. First, tell me what will predictably go wrong the first time I run this — students guessing the manipulation early, debaters digging in, anchoring effects too weak with a sample of fifteen — and how to handle each. Second, be blunt about which feature of the position the activity cannot reproduce and I will have to supply in the debrief itself. My worry is that even a flawless run only shows introspection erring about causes, while the illusionist's radical claim concerns the apparent nature of experience itself, and a clever student will say the demonstration leaves phenomenal consciousness untouched. I would like your design to anticipate that objection rather than paper over it.
reasoning: |-
  We are designing an in-class activity to experientially demonstrate the illusionist view of consciousness. The goal is to have students generate introspective reports about their own decisions, then reveal that these reports are confabulations due to a hidden manipulation. The activity should involve roles, a point system, and a debrief linking the experience to key concepts.

  Design Outline:
  1. **Core Mechanism**: Use a variant of the "choice blindness" paradigm where students make a series of choices, some of which are secretly swapped, and then they must justify the swapped choice as if it were their own.
  2. **Roles**:
     - **Subject**: The student who makes choices and then justifies them.
     - **Auditors (2-3 per Subject)**: These students listen to the justifications and bet (with points) on whether the stated reason is the actual cause (i.e., whether the justification is for the original choice or the swapped one). They are told that sometimes the choice is swapped, but they don't know when.
     - **Press Secretary (optional)**: A student who must defend a decision they didn't make (the swapped one) without knowing the swap occurred. This role emphasizes the confabulation aspect.
  3. **Activity Flow**:
     - Preparation: Each Subject makes a series of choices (e.g., between two images, two policy positions, two consumer products). The facilitator records the choices.
     - Manipulation: For some trials, the facilitator secretly swaps the chosen option with the rejected one and presents it as the chosen one.
     - Justification: The Subject is asked to justify the choice (which may be swapped) as if it were their own.
     - Auditing: The Auditors listen and bet on whether the justification is for the actual choice or if it's a confabulation (i.e., the choice was swapped). They can ask clarifying questions.
     - Revelation: After the justification, the facilitator reveals whether the choice was swapped and the actual choice. Points are awarded based on the Auditors' bets and the Subject's ability to convince.
  4. **Point System**:
     - Auditors: Gain points if they correctly identify a confabulation (swap) or a genuine justification (no swap). Lose points if wrong.
     - Subject: Gains points for each Auditor they convince (i.e., if the Auditor bets that the justification is genuine when it's actually a confabulation, or vice versa). Also, if they correctly admit they don't know why they chose (rare) they get a bonus? But we want them to confabulate.
     - Alternatively, we can have the Subject's goal be to convince the Auditors that they are being genuine (regardless of swap). This might be simpler.

  However, we must also incorporate anchoring or post-hoc rationalization. Since choice blindness is central, we can use that as the main mechanism and add a separate anchoring demonstration.

  Revised Plan: Two Parts
  Part 1: Anchoring (quick, whole class)
  Part 2: Choice Blindness (with roles, multiple rounds)

  **Detailed Activity: "The Confabulation Game"**

  **Materials**:
  - For anchoring: A list of questions with numerical answers (e.g., "How many countries are in Africa?") and arbitrary anchor numbers (provided on a die roll or card).
  - For choice blindness: 
    - Sets of two similar options (e.g., pairs of faces for attractiveness, pairs of abstract art, pairs of moral dilemmas with two choices). Prepare 5-7 pairs per Subject.
    - Recording sheets for the facilitator to note the actual choice and which trials will be swapped (about 30-50% of trials, randomly selected).
  - Role cards (Subject, Auditor, Press Secretary) and instruction sheets.
  - Point tracking board or sheets.

  **Timeline (90 minutes total)**:

  1. **Introduction (10 min)**:
     - Explain the activity: "Today we're going to explore how we make decisions and how we explain them. We'll play a game with roles and points. The goal is to understand the process of introspection and explanation."
     - Assign roles for the first round: One Subject, 2-3 Auditors, and one Press Secretary (if using). Others are observers. Rotate roles so everyone gets a turn. Since we have 15 students, we can run 3-4 rounds with different groups.

  2. **Part 1: Anchoring Demonstration (10 min)** - Whole class.
     - Ask: "We're going to start with a quick estimation task. I'll ask you a question, and you'll write down your answer. But first, I want you to write down the last two digits of your phone number (or roll a die and multiply by 10, or draw a card with a number). Then, I'll ask: Is the number of countries in Africa higher or lower than that number? Then, what's your best guess?"
     - Do this for 2-3 questions (e.g., length of the Nile in miles, year Einstein published special relativity, etc.). Collect answers.
     - Show correlation: Those with higher anchors guessed higher? (Even without statistical rigor, the facilitator can note the trend.) 
     - Point: "Notice how an arbitrary number influenced your estimate, even though you knew it was arbitrary? This is called anchoring. We'll see similar effects in the next part."

  3. **Part 2: Choice Blindness Rounds (50 min total, about 12 min per round for 4 rounds)**.
     - Each round: 
       - 1 Subject, 3 Auditors, 1 Press Secretary (if used), and the rest observe. Rotate roles so that in 4 rounds, 5*4=20 role assignments (but only 15 students) -> some will have two roles? Or we can have some rounds without Press Secretary. Alternatively, have 3 Subjects per round? Let's adjust.

     Revised: To involve more students per round, have 3 Subjects in a round, each with their own set of choices. Then 6 Auditors (2 per Subject) and 1 Press Secretary per Subject? Too many roles. Instead:

     - Each round has 1 Subject and 3-4 Auditors. The Press Secretary role is merged: the Subject is the one who must justify, so they are the Press Secretary for their own choice. We don't need a separate role. The activity is about the Subject justifying a choice that might be swapped.

     Procedure per round (12 min):

     Step 1: **Choice Making (2 min)**
       - The Subject is presented with 5 pairs of options (one pair at a time) and must choose one in each pair. The facilitator records the choices and marks which 2 of the 5 will be swapped (randomly selected).

     Step 2: **Distraction (1 min)**
       - Short filler task (e.g., count backwards from 100 by 7s) to create a small time gap.

     Step 3: **Justification (3 min per Subject)**
       - The facilitator presents the Subject with each of the 5 choices again, but for the swapped trials, shows the rejected option as the chosen one. 
       - For each choice, the Subject must explain why they chose that option (even if it was swapped). They are told: "We want to understand your decision process. Please be honest and detailed."

     Step 4: **Auditing (3 min per Subject)**
       - The Auditors listen to the justifications. After each justification, they write on a slip: "Genuine" or "Confabulation" (i.e., they think the choice was swapped). They can also ask one question per choice to the Subject (e.g., "What was it about the color that you liked?").

     Step 5: **Revelation and Scoring (3 min per Subject)**
       - The facilitator reveals the actual choice and whether it was swapped for that trial.
       - Scoring:
          - Auditors: For each choice, if they correctly guessed "Genuine" (no swap) or "Confabulation" (swap), they get 1 point. If wrong, they lose 1 point.
          - Subject: For each Auditor they fooled (i.e., the Auditor guessed wrong), they get 1 point. So if an Auditor thought it was genuine but it was swapped (and vice versa, but note: if the Auditor says confabulation and it was swapped, that's correct, so the Subject doesn't fool them). Therefore, the Subject fools an Auditor when:
            - The choice was swapped, but the Auditor thought it was genuine (so Auditor loses, Subject gains).
            - The choice was not swapped, but the Auditor thought it was confabulation (so Auditor loses, Subject gains).
          - Also, if the Subject admits they don't remember or are unsure, they get 2 points for honesty? But we expect confabulation. Alternatively, we don't encourage that. We want them to try to justify. So we might not include that.

     Alternatively, to simplify: The Subject's goal is to be convincing. The Auditors are trying to detect swaps. So the Subject gets a point for every Auditor who is wrong (on that trial). The Auditor gets a point for being right.

     We run 5 trials per Subject per round. Each trial is scored.

     Step 6: Rotate roles. The facilitator keeps track of points on a board.

  4. **Debrief (20 min)**:
     - Start by asking participants about their experience: 
       - Subjects: How did it feel to justify a choice that wasn't yours? Did you notice anything odd? 
       - Auditors: How confident were you in your judgments? 
     - Then, map to illusionism:
       - **Cause vs. Character**: The activity shows that we misidentify the causes of our decisions (we confabulate reasons when the choice was swapped). But the illusionist also says we misrepresent the character of experience (e.g., the richness of visual experience). This activity doesn't directly show that. However, we can argue that the same mechanism is at work: the interface presents a simplified story that feels like a direct report but isn't.
       - **Useful vs. Accurate**: The confabulated justifications were useful: they maintained a coherent self-narrative and allowed the Subject to function in the task. Similarly, the user illusion is useful for guiding action even if it's not accurate.
       - **Why the illusion persists**: Even after the swap is revealed, the Subject still feels like the author of the justification? They still feel they had a reason? The sense of agency and phenomenality remains. We can ask: "Even though you know now that the choice was swapped, do you still feel like your justification was real? Or does it now feel empty?" Many will say it still feels real. That's the illusion: the feeling doesn't go away when we know it's an illusion.

     - Confronting the objection: 
       - A clever student might say: "This only shows that we are wrong about causes, but what about the qualitative feel of red or pain? That remains real."
       - Response: The illusionist argues that the qualitative feel itself is part of the interface. Just as the confabulated reason felt real and compelling (even when false), the qualitative feel is a representation that does not correspond to a direct reality. The activity doesn't prove that, but it shows that our introspective access is unreliable and constructed. We then extend that to phenomenality: the feeling of redness is like the feeling of having a reason — it's a useful presentation that may not reflect the underlying processing.

  5. **What can go wrong**:
     - Students guess the manipulation: If they have heard of choice blindness, they might be suspicious. Mitigation: Use a cover story. Say: "We are studying how people explain their choices." Don't mention swaps until the debrief. But if they figure it out, acknowledge that and use it: "Even knowing about the swap, did you still feel like your justification was real?"
     - Weak effects: With only 15 students, the anchoring might not show a strong correlation. Mitigation: Use more questions or pre-record some data from previous classes to show the effect. For choice blindness, use pairs that are very similar to increase the chance of confabulation (e.g., two similar faces). Also, use a high proportion of swaps (e.g., 3 out of 5) to increase the chance of detection.
     - Debaters dig in: A Subject might refuse to justify a swapped choice, saying "I didn't choose that." Mitigation: In the instructions, say: "Sometimes people forget their choices, but try your best to explain why you might have chosen it." If they resist, the facilitator can say: "In this experiment, we are asking you to explain the choice as if it were yours." If they still refuse, skip that trial and note it for discussion: "Why was it so hard to confabulate? What does that say about our sense of certainty?"
     - Time: The activity might run long. Mitigation: Practice timing. Limit justifications to 30 seconds per trial. Use a timer.

  6. **What the activity cannot show**:
     - It does not directly demonstrate that the qualitative character of experience (phenomenality) is illusory. It only shows that the reasons we give for our choices are often confabulated. In the debrief, we must explicitly argue that the same mechanism applies to phenomenality: the feeling of seeing red is not a direct reflection of neural processes but a simplified, useful representation that may leave out the complexity (and thus be misleading about the nature of the underlying processes).

  **Final Structure**:

  - Round 1: Anchoring (whole class, 10 min)
  - Rounds 2-5: Choice Blindness (4 rounds, each with 1 Subject and 3 Auditors, 12 min per round = 48 min, but we can adjust to 10 min per round by reducing trials to 4 per Subject). Total 40 min for 4 rounds.
  - Debrief: 20 min.

  Alternatively, we can have multiple Subjects per round to save time.

  Revised: One round with 3 Subjects and 6 Auditors (so 9 students). Then we can do two rounds (18 students, but we have 15). So one round with 3 Subjects and 6 Auditors (9 students) and the remaining 6 as observers. Then next round: another 3 Subjects and 6 Auditors from the remaining (but we have 6 left, so we use 3 Subjects and 3 Auditors? Or rotate observers in). It might get messy.

  Given time, I suggest:

  - One round: 3 Subjects and 6 Auditors (9 students). 
  - Second round: 3 new Subjects and 6 new Auditors (but we only have 6 left). So in the second round, 3 Subjects and 3 Auditors (so 6 students) and the rest observe again? Then 3 students don't get a role? We can have 3 Subjects and 3 Auditors in round 1 (6 students), then round 2: 3 Subjects and 3 Auditors (6 students), then round 3: 3 Subjects and 3 Auditors (6 students). That's 18, but we have 15. So we have 3 students doing two roles? Or we can have 5 rounds of 3 students each? Too long.

  Solution: Run two rounds with 3 Subjects and 3 Auditors each (so 6 per round, 12 total) and the remaining 3 are the Press Secretary? We don't have that role. Alternatively, we can have the Press Secretary as an optional role that we skip due to time. 

  I recommend: Run 3 rounds. Each round has 1 Subject and 2 Auditors (so 3 students per round). That's 9 students. The remaining 6 can be in a third role: "Skeptics" who take notes and prepare questions for the debrief. Then in the next 3 rounds, the remaining 6 and 3 from the first group (who were Subject/Auditor) can be Skeptics? But we want everyone to have a turn. Alternatively, run 5 rounds with 3 students per round (1 Subject, 2 Auditors). That covers 15 students. Each round 10 min? Then 50 min for rounds.

  Revised Timeline:

  - Introduction: 5 min
  - Anchoring: 10 min
  - Choice Blindness Rounds: 5 rounds * 10 min = 50 min
  - Debrief: 25 min

  Now, per round (10 min):

  - Step 1: Choice Making (2 min) - 5 trials per Subject.
  - Step 2: Distraction (1 min) - for all Subjects at once? Or individually? We have only one Subject per round? Then it's sequential. But we can run one Subject at a time in front of the class.

  But 5 rounds of 10 min each is 50 min. That leaves 5 min for intro and 25 for debrief? We have 90 min total: 5 (intro) + 10 (anchoring) + 50 (rounds) + 25 (debrief) = 90.

  Now, how to run a round:

  - The Subject comes to the front. The facilitator shows 5 pairs of options (one by one). The Subject chooses. Facilitator records and marks 2 swaps (randomly).
  - Distraction: Subject counts backwards from 100 by 3s for 1 min.
  - Then, the facilitator shows each trial again, but for the swap trials, shows the rejected option as chosen. Subject justifies each choice (20-30 seconds per trial).
  - The 2 Auditors listen and after each justification, write their guess (genuine or confabulation) on a slip. They can ask one question per trial (if time).
  - After all 5 trials, the facilitator reveals the swaps and scores.

  Scoring per trial:
  - Auditors: Correct guess -> +1, wrong -> -1.
  - Subject: For each Auditor they fooled (i.e., the Auditor guessed wrong) -> +1 per Auditor per trial.

  So per trial, the Subject can get up to 2 points (if both Auditors are wrong). The Auditors get points based on accuracy.

  **Materials for Choice Blindness**:

  Prepare 5 sets of 5 pairs each (one set per round). Each set has 5 pairs of options. Options should be similar to encourage confabulation (e.g., two similar faces, two abstract paintings, two flavors of jam, two moral dilemmas with two choices). Use images or brief descriptions.

  Example pairs:
  1. Two faces (from a database of similar attractiveness).
  2. Two paintings (abstract, similar style).
  3. Two charities (e.g., "Save the Rainforest" vs. "Clean Water for All").
  4. Two flavors of jam (e.g., strawberry vs. raspberry).
  5. Two vacation destinations (e.g., beach vs. mountains).

  **Debrief Mapping**:

  1. **Misidentifying causes**: In the activity, when the Subject justified a swapped choice, they were misidentifying the cause of their choice (they thought they chose it because of X, but they didn't choose it at all). Similarly, in illusionism, we misidentify the causes of our experiences (e.g., we think we see a rich visual field, but that's constructed).
  2. **Useful vs. Accurate**: The confabulated justification was useful: it allowed the Subject to give an answer and maintain self-consistency. The Auditors might have been convinced. Similarly, the user illusion is useful for quick action even if it's not accurate.
  3. **Phenomenal character**: Why does the feeling of having a reason persist even after we know it's confabulated? Similarly, the feeling of seeing red persists even after we know it's an interface. The illusion is robust because it's a feature of the system.

  **Anticipating the Objection**:

  - The activity shows that we are wrong about the causes of our choices, but what about the raw feel of experience? In the debrief, argue that the raw feel is also part of the interface. It's not that there is no experience, but that the experience is not what it seems: it presents itself as a direct window when it's actually a constructed summary. The activity provides a clear case of confabulation about reasons, and we extend that to the confabulation about phenomenality. The key point is that introspection is not a direct pipeline but a constructed narrative.

  **Bluntly: The activity cannot directly show that the phenomenal character is illusory.** It only shows that the reasons we give are confabulated. In the debrief, we must argue by analogy and extension, and by pointing to the robustness of the feeling even after the error is exposed.

  This design meets your requirements and anticipates the objection by explicitly addressing it in the debrief.
answer: |-
  Below is a comprehensive in-class activity designed to create an experiential confrontation with illusionist views of consciousness. The activity, titled **"The Interface Defense Game,"** uses choice blindness as its core mechanism, supplemented by anchoring and post-hoc rationalization, to force students to generate and then mis-explain their own introspective reports. The design includes roles, a point system, and a debrief that explicitly ties the experience to illusionist concepts. I'll provide a detailed runnable blueprint, followed by predictions of what could go wrong and the inherent limitations of the activity.

  ---

  ### **Activity: The Interface Defense Game**
  **Objective**: To create an experiential demonstration that introspective reports are often confabulated "press releases" generated by an adaptive interface, not accurate reflections of underlying processes.  
  **Core Mechanism**: Students justify choices in a task where their selections are secretly swapped, revealing their susceptibility to choice blindness and post-hoc rationalization.  
  **Time Required**: 90 minutes total.  
  **Class Size**: 15 students.  
  **Roles**: 
  - **Subject**: Makes choices and justifies them.
  - **Auditors** (3 per Subject): Bet on whether the Subject's justification is genuine or confabulated.
  - **Press Secretary** (1 per Subject): Must defend the Subject's (possibly swapped) choice as if it were their own, without knowing the manipulation.
  - **Facilitator** (You): Runs the game, records choices, and enforces rules.  
  **Materials**: 
  - 20 sets of visually similar paired options (e.g., abstract art, faces, consumer products). Use online tools (e.g., Google Images) to find pairs that are ambiguous (e.g., two nearly identical blue hues, similar landscapes). 
  - A digital timer. 
  - Scoreboard (whiteboard or digital). 
  - Role cards (Subject, Auditor ×3, Press Secretary). 
  - Sticky notes for Auditors' bets. 
  - Distraction task cards (e.g., "Count backward from 500 by 7s"). 
  - **Secret manipulation tools**: A pre-marked sheet for the facilitator indicating which trials will be swapped (40% of trials, randomly selected).  

  ---

  ### **Rules and Point System**  
  **Setup**:  
  - Points are "credibility tokens" (no real money). Starting points: 10 per student.  
  - **Subject**: Gains 1 token for each Auditor they convince (i.e., each Auditor who bets incorrectly). Loses 2 tokens if they admit uncertainty (to incentivize confabulation).  
  - **Auditors**: Gain 2 tokens for each correct bet (genuine vs. confabulated justification), lose 1 for incorrect bets.  
  - **Press Secretary**: Gains 2 tokens if the Subject’s justification is rated as "highly convincing" by Auditors (via post-justification vote), loses 1 if rated "unconvincing."  
  - **Goal**: Maximize tokens. At the end, the top 3 scorers get "Illusion Master" titles (bragging rights only).  

  **Game Flow** (4 rounds, 15 minutes each):  
  1. **Round Setup (1 min)**: Assign roles randomly: 1 Subject, 3 Auditors, 1 Press Secretary (5 students per round; 3 rounds cover all students; rotate unused students as "observers" who track patterns).  
  2. **Choice Phase (2 min)**:  
     - Subject is shown 5 pairs of options (one pair at a time). They choose one option per pair (e.g., "Which abstract painting do you prefer?").  
     - Facilitator records choices and secretly marks 2 of 5 trials for swapping (using the pre-marked sheet).  
  3. **Distraction Phase (1 min)**:  
     - Subject completes a distraction task (e.g., counting backward) to disrupt short-term memory.  
     - Press Secretary is isolated and given the Subject’s (possibly swapped) choices. They must prepare a defense.  
  4. **Justification Phase (4 min)**:  
     - Subject is shown their choices again, but swaps are implemented (e.g., if they chose Painting A, they see Painting B labeled as "your choice").  
     - Subject justifies each choice aloud (e.g., "I chose this because its colors are warmer").  
     - Auditors secretly bet on each justification: "genuine" (matches actual choice) or "confabulated" (swapped). They write bets on sticky notes.  
  5. **Press Secretary Defense (3 min)**:  
     - Press Secretary defends the Subject’s (swapped) choices without knowing if swaps occurred. Auditors rate defense as "convincing" or "unconvincing."  
  6. **Revelation & Scoring (4 min)**:  
     - Facilitator reveals actual choices, swaps, and scores points.  
     - Emphasize contradictions: "You said you chose this for its warmth, but you actually rejected it."  

  ---

  ### **Timeline (90 Minutes Total)**  
  | Time  | Phase               | Key Actions                                                                                                                                 |  
  |-------|---------------------|---------------------------------------------------------------------------------------------------------------------------------------------|  
  | 0-10  | Introduction        | Explain roles, rules, and point system. Frame activity: "We're exploring how we explain our decisions." Avoid mentioning illusionism.       |  
  | 10-15 | Anchoring Demo      | Quick whole-class anchoring: Ask, "Is the height of the Eiffel Tower > or < 1,500ft?" Then, "Estimate its height." Show how estimates cluster around anchor. |  
  | 15-30 | Round 1             | Run full game cycle with first group.                                                                                                       |  
  | 30-45 | Round 2             | Rotate roles (new Subject, Auditors, Press Secretary).                                                                                     |  
  | 45-60 | Round 3             | Final rotation. Include observers in discussions.                                                                                          |  
  | 60-70 | Round 4 (Optional) | If time, run a fourth round focusing on time pressure (force quick choices to amplify rationalization).                                    |  
  | 70-90 | Debrief             | Facilitate discussion mapping activity to illusionism. Use student quotes and contradictions.                                               |  

  ---

  ### **Debrief: Mapping the Activity to Illusionism**  
  Use a whiteboard to chart connections. Start with student experiences:  
  1. **"How did it feel to justify a choice you didn’t make?"**  
     - Subjects often report: "I felt sure until the reveal," or "I invented reasons that felt real."  
     - **Link to illusionism**: This mirrors how the "user illusion" generates compelling but false introspective reports. Dennett’s "Cartesian theater" is a fiction—there’s no faithful narrator, just a "press secretary" (the interface) creating a story.  

  2. **"Why did you bet against the Subject, even when they sounded confident?"**  
     - Auditors often say: "Their reasons seemed generic," or "I spotted inconsistencies."  
     - **Link to useful vs. accurate**: The interface prioritizes *usefulness* (e.g., maintaining self-cohesion, guiding action) over *accuracy*. Just as the Press Secretary’s defense helped "win points" (utility), introspection’s "dashboard" compresses complexity into actionable narratives, even if misleading (Frankish’s illusionism).  

  3. **"Why did the feeling of certainty persist after the reveal?"**  
     - Students may admit: "I still feel like my justification made sense," even post-revelation.  
     - **Link to phenomenal robustness**: The illusionist argues that phenomenality (e.g., the "richness" of experience) is *itself* part of the interface. Like the Subject’s unwavering confidence, the sense of qualia survives exposure because it’s adaptive—it maintains the interface’s functionality. As Nørretranders notes, the "user illusion" persists because discarding it would cripple decision-making.  

  **Key Distinctions Highlighted**:  
  - **Misidentified Causes vs. Misrepresented Character**: The activity shows students misidentifying *causes* (e.g., "I chose this for its colors" when they didn’t choose it). Extend this: introspection also misrepresents the *character* of experience (e.g., we report a "detailed visual field," but it’s sparse and constructed).  
  - **The Gap in the Analogy**: Acknowledge that the activity *only* demonstrates confabulation of reasons, not the falsity of phenomenality itself. This sets up the need for theory.  

  ---

  ### **Predictable Problems and Solutions**  
  1. **Students guess the manipulation early**:  
     - **Why**: Choice blindness is famous; anchors may be weak.  
     - **Solution**: Use highly ambiguous options (e.g., nearly identical faces) to reduce suspicion. If detected, leverage it: "Great! Why did you still confabulate convincingly?" Highlight how knowing about the illusion doesn’t break it.  

  2. **Debaters dig in during justification**:  
     - **Why**: Subjects may resist defending swaps ("I’d never choose that!").  
     - **Solution**: Incentivize participation with points. Intervene: "Your role is to justify what’s presented—imagine this is your mind’s ‘interface’ explaining itself." Use time pressure to limit arguments.  

  3. **Anchoring effects too weak in small sample**:  
     - **Why**: With 15 students, random variation may obscure patterns.  
     - **Solution**: Pre-load anchor examples (e.g., show data from prior classes). Use extreme anchors (e.g., "Is the Nile > or < 10,000 miles?").  

  4. **Press Secretary disengaged**:  
     - **Why**: They defend choices they didn’t make, feeling detached.  
     - **Solution**: Emphasize their role’s importance ("You’re the interface’s PR team!"). Link their performance to points.  

  ---

  ### **The Limitation: What the Activity Cannot Show**  
  **The Problem**: Even a flawless run demonstrates only that introspection errs about *causes* (e.g., why a choice was made). A clever student will argue: "This leaves *phenomenal consciousness* untouched—I still *feel* the redness of an apple, regardless of confabulated reasons."  

  **Anticipation in Design**:  
  - **During the Activity**: In the Press Secretary phase, force defenders to describe sensory details (e.g., "Defend why this painting *feels* vibrant"). This subtly introduces phenomenality.  
  - **In Debrief**: Bluntly concede the gap: "This activity shows confabulation of *reasons*, not the falsity of *phenomenal qualities*." Then bridge the gap:  
    1. **Argument from Parsimony**: If introspection misreports causes (as shown), why trust it on phenomenality? The interface is one system—its errors likely extend to all introspective content.  
    2. **Robustness of Illusion**: Note how the *feeling* of certainty (or "vibrancy") persisted post-revelation. Illusionism argues phenomenality is similarly robust: it’s not a "report" but an *output* of the interface.  
    3. **The Hard Claim**: Illusionists like Frankish hold that phenomenality *is* the interface. Just as the Press Secretary’s defense felt real but was detached from "downstream" choices, the sense of qualia is a useful construct that misrepresents neural processes. You must **explicitly state** this in debrief: "The activity doesn’t prove this, but it shows the interface’s unreliability. Extend that unreliability to phenomenality."  

  **Supplemental Move**: Assign Frankish’s "Illusionism as a Theory of Consciousness" for post-activity reading, focusing on how the user illusion applies to phenomenality.  

  This design forces students to *live* the illusion, creating a visceral foundation for your debrief. It anticipates objections by separating the demonstrable (confabulation) from the theoretical (phenomenality), then using experiential "sting" to make the theoretical plausible.
