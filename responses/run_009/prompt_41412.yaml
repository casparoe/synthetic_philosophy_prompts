  Okay, the user is clearly well-versed in decision theory, having followed LessWrong and the Sequences for years. They're finally engaging actively, specifically wanting to defend causal decision theory (CDT) against functional decision theory (FDT). They've set up a structured debate format, providing clear scenarios—Newcomb's problem and Counterfactual Mugging—and outlined their stance. Their challenge is for me, as a committed functional decision theorist, to present a scenario where FDT outperforms a CDT agent equipped with precommitment tools.

  The user's core argument is that precommitments allow CDT to mimic FDT in Newcomb's (by locking in one-boxing) while avoiding the "cost" of Counterfactual Mugging (by not paying). They view precommitment as a practical tool rather than embracing FDT's algorithmic identity approach. Their frustration seems to be with FDT's demand to act based on counterfactual correlations—paying in a world where the coin flip already went against them.

  Hmm, I need a scenario where precommitment fails but FDT shines. The user explicitly asked for a case where armed CDT loses and FDT wins, so I must deliver that precisely. They're sharp—no strawmen allowed. Their mention of "algorithmic identity" suggests they see FDT as overly abstract, so my example must ground it in tangible stakes.

  Ah! The *predictable precommitment* flaw in CDT+precommit. In Parfit's Hitchhiker with a twist: if the driver can detect your precommitment device, they'll strand you anyway. Precommitment becomes a visible defect. Meanwhile, FDT pays naturally because it considers the driver's response to your decision algorithm. This directly answers their challenge—CDT's tools backfire here, while FDT gets the win without extra devices.  

  I should emphasize why this isn't just "buying" cooperation. FDT wins by correctly modeling the dependency: your algorithm's output (paying) causes the driver's good behavior. CDT, even with precommitments, breaks this link by making the commitment legible and thus exploitable. The cost isn't monetary but structural—CDT's approach modifies the game tree unfavorably.  

  Also, subtle point: the user thinks Counterfactual Mugging is FDT's weakness, but here I'm flipping it—showing FDT avoids a *worse* loss. Keeps the pressure on.  

  ...Wait, did I keep it to one paragraph? *checks* Yes. Good. No essays. Sharp, concedes nothing core. Now to see if they bite.
answer: |-
  Fair challenge. Consider **Parfit's Hitchhiker with a Predictable Precommitment**: You're stranded in the desert. A driver will rescue you *only if* you promise to pay $1000 once safe in town. Crucially, this driver is a perfect predictor of your decision algorithm *and* they can detect if you're using external precommitment devices (e.g., locks, contracts). If they see you've externally precommitted to paying, they know your *algorithm* is untrustworthy (relying on force, not intent) and drive off, leaving you to die. 

  **Why FDT wins:**  
  FDT evaluates the *algorithmic policy*. It pays upon rescue because the driver's decision depends on predicting that *agents like you* honor agreements. Paying is the only policy that gets you rescued *and* paid. The driver rescues because FDT's algorithm outputs "pay" *by default*—no detectable crutches needed.

  **Why your armed CDT loses:**  
  Your CDT agent precommits (e.g., signs a contract forcing payment). The driver detects this artificial binding, infers your core algorithm would *defect* without it, and abandons you. You die. Precommitment isn't just costly here—it *destroys the very correlation* (trust) needed for rescue. FDT doesn't "pay for identity"; it *leverages* the necessary correlation between your algorithm's output and the driver's prediction to survive. CDT's toolkit actively sabotages that link. Your move.
