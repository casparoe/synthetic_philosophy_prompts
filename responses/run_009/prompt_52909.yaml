  We are designing an intake procedure based on Dennett's hierarchy of creatures. The hierarchy has four levels:

  1. Darwinian creatures: improve only across generations by natural selection.
  2. Skinnerian creatures: can learn within a lifetime through operant conditioning (trial-and-error).
  3. Popperian creatures: can test hypotheses internally without risking themselves in the real world (using an internal model).
  4. Gregorian creatures: use cultural tools, especially language, to enhance their thinking.

  The procedure must be run by a first-year student in about 20 minutes without philosophy background. It must help avoid mismatches between an experimental paradigm and the subject's cognitive level.

  The procedure consists of a series of ordered questions. We start at the bottom and move up only if the evidence supports it. We must be cautious: we do not assume a higher level without positive evidence.

  **Procedure Steps:**

  1. **Is the system a Darwinian creature?**  
     We start by assuming the system is Darwinian (only evolves across generations). We then look for evidence of within-lifetime learning. If we find no evidence of learning within an individual's lifetime, then we stop: the system is Darwinian. But note: almost all animals we study show some learning, so this step is often quickly passed. However, for some simple organisms (like bacteria) or non-living evolving systems, this might be the level.

  2. **Is it at least Skinnerian?**  
     We look for operant conditioning: the ability to change behavior based on rewards and punishments. The classic test is trial-and-error learning. If we see that the system can adjust its behavior based on consequences (e.g., via reinforcement learning), then it is at least Skinnerian. This is the default level for many animals.  
     *What counts as sufficient?* Evidence of learning curves in simple tasks, such as increasing success rate over trials, or shaping of behavior through reinforcement.  
     *Boundary marker:* If the system can learn a new behavior through reinforcement (even if slowly) and without requiring a single trial, then it is Skinnerian.

  3. **Is it at least Popperian?**  
     To be Popperian, the system must show evidence of using an internal model to test actions without executing them. This is the critical step because many experiments mistakenly assume this level when the subject might be a fast Skinnerian.  
     *What counts as sufficient?* We require evidence that the system can solve a problem without trial-and-error in the real world. Key tests:  
     - **One-trial learning**: solving a problem on the first try without prior direct experience. However, caution: one-trial learning might be due to pre-existing associations.  
     - **Reversal learning**: rapid adaptation when contingencies change. But rapid reversal might also be explained by a fast associative process.  
     - **Detour tasks**: where the direct path is blocked and the subject must take an indirect route without trying the blocked path. Success without prior exploration suggests an internal model of space.  
     - **Latent learning**: learning without reinforcement and then using that knowledge when motivated.  
     - **Insight tasks**: such as Kohler's box-stacking experiments with chimpanzees.  
     *Critical boundary marker for Popperian vs. Skinnerian:* The key is the absence of trial-and-error. If the system can generate a novel solution without having to try (and possibly fail) in the real world, that suggests an internal model. However, if the solution is achieved after many trials (even if rapid) and can be explained by shaping, then it remains Skinnerian.  
     *Judgment call:* This step is tricky. We must rule out that the behavior is due to pre-trained associations or rapid operant conditioning. Therefore, we require at least two independent lines of evidence (e.g., one-trial learning in a novel context plus success in a detour task). If we cannot rule out a Skinnerian explanation, we do not assign Popperian status.

  4. **Is it at least Gregorian?**  
     Gregorian creatures use cultural tools, especially language, to augment their thinking.  
     *What counts as sufficient?* Evidence that the system uses symbols (like words) to represent and manipulate information. The use of language (or other symbolic systems) in a way that allows the individual to offload cognitive work is key.  
     *Boundary marker:* The system must show evidence of using an external symbolic system (e.g., language, mathematical symbols, diagrams) to solve problems that it could not solve without them. For non-human animals, this is very rare.  
     *Caution:* If an animal uses tools but not symbols, it might be Popperian. Gregorian requires the use of symbols that are culturally transmitted.

  **Output of the Procedure:**

  - If at any step the evidence does not support moving up, we stop and assign the highest level for which we have evidence.  
  - If a proposed experimental paradigm requires the subject to be at a higher level than the evidence supports, we flag that the paradigm must not be run as designed. For example, if we have only shown a system to be Skinnerian, but the paradigm requires Popperian abilities (like planning without trial-and-error), then the paradigm is flawed and must be redesigned to allow a Skinnerian route to the solution.  
  - Some questions are not about competence but about other issues (like welfare). The procedure does not address whether the system experiences suffering. If the question of suffering arises (for instance, in designing an experiment that might cause distress), we must stop and hand that to a human (e.g., an ethics committee). The hierarchy is about cognitive competence, not sentience.

  **Judgment Calls Dressed as Checks:**

  - The step from Skinnerian to Popperian is particularly prone to being a judgment call. We require multiple lines of evidence and rule out associative explanations. But this is inherently interpretive. We must be explicit that this is a high bar and that we err on the side of caution.

  **Where the Ladder Breaks:**

  - Some systems are not monolithic. For example, a honeybee colony: individual bees might be Skinnerian (or even Darwinian in some aspects), but the colony as a whole can show Popperian-like behavior (e.g., in decision-making about nest sites). For such cases, we apply the procedure to the unit of study (the colony as a whole) and note that the level assigned is for that unit, not the parts.  
  - Some systems might have mixed abilities: an animal might be Popperian in spatial tasks but Skinnerian in social ones. We must note the domain specificity.  
  - The procedure should say: when the system does not fit neatly, we assign the level for which we have evidence in the domain of the proposed experiment, and we note the limitations. We do not force a single rung.

  **Now, applying the procedure to the three cases:**

  **Case 1: Jays in food-caching and future-planning paradigm.**

  - We start by noting that jays are known to be at least Skinnerian: they learn through experience (e.g., caching and retrieving food).  
  - The key question is whether they are Popperian. The future-planning paradigm tests whether they can plan for future states (e.g., caching food in a place where they will be hungry the next morning).  
  - *Procedure application:*  
    - We know jays can learn through trial-and-error (Skinnerian).  
    - For Popperian: we require evidence they use an internal model. In food-caching, if they cache based on a future need (without having experienced that exact situation before) and without trial-and-error, that might suggest planning.  
    - However, caution: if the jays have been extensively trained (shaped) in similar contexts, then the behavior might be associative.  
    - The intake procedure would ask: Has the jay been tested in a novel situation without prior training? If the paradigm involves a novel context and the jay solves it on the first trial, that would be evidence for Popperian. But if the jay has been trained for months, then we cannot rule out associative learning.  
    - *Output:* The procedure flags that if the jays have had extensive training, we cannot distinguish between genuine planning and shaped association. Therefore, the paradigm must be redesigned to test in a novel context without prior training. If that is not possible, then the experiment cannot conclusively demonstrate Popperian planning.

  **Case 2: Cuttlefish given a puzzle box.**

  - Cuttlefish are known to be capable of rapid learning (Skinnerian).  
  - The question is whether they can show one-trial insight.  
  - *Procedure application:*  
    - We assume they are at least Skinnerian.  
    - For Popperian: we require evidence of solving without trial-and-error.  
    - In the puzzle box, if the cuttlefish solves it on the first try without any prior exposure to the box, that would be one-trial learning. But we must rule out that the solution is due to pre-existing behaviors (e.g., if the box is similar to natural prey capture).  
    - What would settle it? We need a task that is novel and cannot be solved by pre-existing associations. For example, a box that requires a sequence of actions that the cuttlefish has never performed, and success on the first trial without any exploratory trials.  
    - Also, we might require a control: if the cuttlefish fails when the problem is altered in a way that breaks the insight but not the associations, that might support insight.  
    - *Output:* The procedure would note that without a first-trial success in a truly novel task, we cannot call it insight. If the cuttlefish tries multiple approaches (even rapidly) and then succeeds, that is trial-and-error (Skinnerian). The procedure would flag that the puzzle box experiment must be designed to allow only one trial and be novel enough to rule out prior associations.

  **Case 3: Robotics group's language-model robot.**

  - The robot narrates its plan out loud before executing it.  
  - *Procedure application:*  
    - We start at the bottom.  
    - Is it Darwinian? No, because it learns within its lifetime (via training, but also during operation if it's an online learning system). But note: the robot is built by humans, so its design is Darwinian at the human level, but we are testing the robot itself.  
    - Is it at least Skinnerian? Yes, because it can learn from feedback (if designed to). But note: the robot might not need trial-and-error in the real world if it uses a model.  
    - Is it at least Popperian? The robot uses an internal model (the LLM) to generate plans before acting. It "previews" moves internally (via the model) and then executes. This is classic Popperian. The narration is a byproduct.  
    - Is it at least Gregorian? The robot uses language, which is a cultural tool. The LLM was trained on human language and culture. Therefore, it imports thinking tools (language) from human culture. So it is Gregorian.  
    - *But note:* The procedure does not address whether the robot is conscious or experiences anything. It only assigns competence levels.  
    - *Output:* The procedure assigns the robot as Gregorian. However, we must be explicit that this says nothing about subjective experience. The hierarchy is about cognitive abilities, not phenomenology. The robotics group might not like that we are putting their robot at the same level as humans in terms of cognitive tools, but that is what the evidence (use of language) supports.  
    - Also, we must note that the robot's behavior might be a mix: the LLM is a product of human culture (Gregorian), but the robot's learning during operation might be Skinnerian (if it learns from rewards) or Popperian (if it uses a model). But overall, because it uses language as a tool, it is Gregorian.

  **Where the Ladder Breaks:**

  - As noted, a honeybee colony: the colony as a whole can be tested. If we apply the procedure to the colony, we might find Popperian abilities (e.g., in choosing a nest site via a process that resembles hypothesis testing). But individual bees are not Popperian. The procedure should say: when the system is a collective, we assign the level for the collective unit.  
  - An animal with dense memory (like a squirrel remembering cache locations) might be misclassified. The procedure must note that having a good memory does not necessarily imply an internal model (Popperian). The squirrel might be using a Skinnerian approach with a large memory. We require evidence of simulation (e.g., planning a novel route) to assign Popperian.  
  - When meeting such a case, the procedure should say: assign the level for which there is evidence in the specific domain and context of the experiment, and note any limitations. Do not overgeneralize.

  **Final Memo:**

  To: Lab Members  
  From: [Your Name]  
  Subject: Intake Procedure for New Subjects and Paradigms  

  In our lab, we often face a mismatch between the cognitive abilities of our subjects and the demands of the experimental paradigms we use. To prevent this, we are implementing an intake procedure based on Dennett's hierarchy of cognitive systems: Darwinian, Skinnerian, Popperian, and Gregorian. This procedure is designed to be run by any lab member in about twenty minutes and requires no background in philosophy. The goal is to ensure that we only run experiments that are appropriate for the subject's established cognitive level.  

  The procedure is a step-by-step assessment that starts at the bottom of the hierarchy and moves up only when the evidence supports it. We begin with the assumption that a system is Darwinian (only capable of change across generations) and then look for evidence of within-lifetime learning to move to Skinnerian (trial-and-error learning). From there, we look for evidence of internal modeling to assign Popperian status, and then for the use of cultural tools (especially language) to assign Gregorian. At each step, we require clear evidence. If we do not have evidence for a higher level, we do not assume it. This is critical because many experiments fail when they require a higher level than the subject possesses.  

  Here are the steps:  

  First, we ask: is there any evidence that the system can learn within its lifetime? If not, then the system is Darwinian. However, most of our subjects show at least some learning, so we move to the next step.  

  Second, we ask: is there evidence of Skinnerian learning? That is, can the system change its behavior through trial-and-error, shaped by rewards and punishments? If we see a learning curve in a simple task or evidence of operant conditioning, then we assign Skinnerian. This is the default level for many animals.  

  Third, we ask: is there evidence of Popperian abilities? This requires that the system can generate a novel solution without trial-and-error in the real world. We look for behaviors such as solving a problem on the first try in a novel context (one-trial learning), rapidly adapting to reversed contingencies without extensive retraining, or solving detour tasks without exploration. We must rule out that the behavior is due to pre-existing associations or rapid operant conditioning. Therefore, we require at least two independent lines of evidence (such as one-trial learning plus success in a detour task). If we cannot rule out a Skinnerian explanation, we do not assign Popperian status. This step is a judgment call, so we must be conservative.  

  Fourth, we ask: is there evidence of Gregorian abilities? This requires that the system uses cultural tools, especially language, to enhance its thinking. We look for the use of symbols in a way that offloads cognitive work. Without evidence of symbolic representation (beyond simple signals), we do not assign Gregorian.  

  The output of this procedure has two main consequences:  
  - If a proposed experimental paradigm requires the subject to be at a higher level than the evidence supports, we must not run it as designed. For example, if we have only shown a subject to be Skinnerian, but the paradigm requires Popperian planning, then we must redesign the paradigm to allow a Skinnerian route to the solution.  
  - The procedure does not address questions of suffering or ethics. If an experiment raises welfare concerns, we must halt and refer to the appropriate ethics committee.  

  Now, let's apply the procedure to three examples:  

  First, our jays in the food-caching and future-planning paradigm. We know jays are at least Skinnerian. To test for Popperian planning, we must ask: can they solve a novel planning problem without prior training? If the jays have been trained for months, we cannot distinguish genuine planning from shaped associations. Therefore, the procedure flags that our current design may not be able to distinguish these, and we must redesign to include a novel context without prior training.  

  Second, a cuttlefish in a puzzle box. We know cuttlefish are Skinnerian. To show one-trial insight (Popperian), we need the cuttlefish to solve the box on the first try in a novel task that cannot be solved by pre-existing behaviors. If we see trial-and-error (even rapid), we cannot call it insight. The procedure says we must design the task to allow only one trial and be truly novel.  

  Third, the robotics group's language-model robot. The robot narrates its plan before acting. It uses an internal model (Popperian) and language (Gregorian). Therefore, the procedure assigns it as Gregorian. However, this says nothing about whether the robot experiences anything; it only describes its cognitive tools.  

  Finally, note that some systems do not fit neatly into one rung. For example, a honeybee colony may behave as a Popperian system at the group level, while individual bees are Skinnerian. In such cases, we assign the level to the unit under study (the colony) and note the discrepancy. Also, an animal might be Popperian in one domain and Skinnerian in another. We must be domain-specific. When the ladder breaks, we do not force a single rung but instead note the evidence and the limitations.  

  This procedure is a tool to prevent wasted effort and flawed conclusions. Use it rigorously, and when in doubt, err on the side of caution.  

  [End of Memo]
answer: |-
  ### Intake Procedure Memo for Comparative Cognition Lab

  To all lab members, as we integrate new species, systems, or paradigms into our work, we must rigorously pre-assess their cognitive alignment with our experimental designs. This prevents recurring mismatches where paradigms demand capabilities a subject lacks, yielding uninformative "null" results. We adopt Daniel Dennett’s hierarchy—Darwinian, Skinnerian, Popperian, Gregorian—as a framework. This ladder classifies systems by their capacity for improvement: Darwinian across generations, Skinnerian via lifetime operant conditioning, Popperian through internal simulation of actions, and Gregorian via cultural tools like language. The procedure is tiered, starting conservatively at the Darwinian baseline and escalating only with positive evidence. A first-year student can execute this in twenty minutes by answering ordered questions. I’ll outline the steps, sufficiency criteria, boundary markers, and failure modes, then apply it to three cases.

  Begin by gathering basic ethological or technical literature on the subject. With this, ask: **1. Is there robust evidence of within-lifetime behavioral modification?** If no, classify as Darwinian: improvement occurs only over generations via selection. Sufficient evidence includes documented phenotypic plasticity, like physiological changes to environmental shifts. If Darwinian, stop: no paradigm requiring learning is permissible without redesign. If yes, proceed. **2. Does the system exhibit trial-and-error learning?** Sufficient evidence includes incremental adjustment to rewards/punishments (e.g., lever-pressing for food). Boundary marker: Skinnerian competence is confirmed if learning curves show gradual improvement over trials, not instantaneous solutions. If absent, classify as Darwinian; if present, classify as minimally Skinnerian. Proceed only if higher claims are made. **3. Can the system solve novel problems without observable trial-and-error?** This distinguishes Popperian creatures, which use internal models to "preview" actions. Sufficient evidence requires two convergent markers: (a) One-trial learning in entirely new contexts (e.g., avoiding a toxin after one exposure), ruling out pre-existing associations; (b) Success in detour tasks, where direct paths are blocked and subjects must navigate obstacles immediately without exploration. Reversal learning alone is insufficient—it may reflect fast association. Crucially, if prior training could explain performance (e.g., months of shaping), the system remains Skinnerian. If evidence is ambiguous, default to Skinnerian. If Popperian is confirmed, proceed. **4. Does the system use external symbolic tools to augment cognition?** Gregorian status requires culturally transmitted symbols (e.g., language, numbers) that transform problem-solving. Sufficient evidence includes innovation using tools not innately available (e.g., chimpanzees combining symbols lexically). Mere tool use is inadequate; it must involve representational symbols.

  Where paradigms presuppose higher competence than established, the procedure flags them as invalid without redesign. For example, if a planning task assumes Popperian abilities but the subject is only confirmed Skinnerian, the design must incorporate associative pathways. Judgment calls arise at the Skinnerian-Popperian boundary: claims of one-trial learning or insight must exclude latent shaping or environmental cues. These are not mere checks but interpretative steps requiring careful literature review. Crucially, the hierarchy does not address sentience or suffering. If welfare concerns emerge (e.g., stress in repeated trials), halt and escalate to a human—this framework is agnostic to subjective experience.

  Now, applying the procedure to three cases:

  **Jays in food-caching and future-planning paradigm**: Jays show trial-and-error learning (Skinnerian confirmed). For Popperian planning claims, we ask: Is caching behavior improvable without real-world trial? Evidence includes jays adapting caches to future hunger states in novel contexts. However, if prior training (e.g., months of exposure to caching contingencies) could build associations, the behavior may be Skinnerian. The procedure flags our paradigm: if jays were pre-trained in similar tasks, we cannot distinguish model-based planning from shaped association. To validate Popperian status, we need a one-trial test where jays encounter a never-before-seen scenario (e.g., novel food type in a new social context) and cache optimally without prior reinforcement. Without this, the paradigm is invalid for claiming planning.

  **Cuttlefish in a puzzle box**: Cutttlefish exhibit rapid trial-and-error learning (Skinnerian confirmed). For one-trial insight (Popperian), we ask: Can it solve a novel puzzle immediately? Sufficient evidence requires: (a) First-trial success in a box design eliminating sensory cues (e.g., no residual smells from previous attempts); (b) Failure in a control condition where the solution requires sequential steps impossible to associate through conditioning (e.g., disassembling a multi-part latch). If the cuttlefish solves it through rapid but incremental attempts (e.g., 5–10 trials), it remains Skinnerian. Observing a "Eureka moment"—like sudden, deliberate manipulation without prior exploration—would settle Popperian status. Without such evidence, the puzzle box must allow associative solutions.

  **LLM-driven robot**: The robot narrates plans aloud. It shows within-lifetime learning (e.g., fine-tuning), confirming beyond Darwinian. Operant conditioning analogs exist (e.g., reinforcement learning from feedback), so minimally Skinnerian. It then previews actions internally (via LLM simulations) before acting, satisfying Popperian criteria: no real-world trial-and-error is needed for novel problems. Crucially, it uses language—a cultural tool—to structure its thinking, meeting Gregorian criteria. However, the procedure explicitly halts at competence: it does *not* license claims about experience ("what it is like" to be the robot). The hierarchy cannot bridge competence to phenomenology, so we must not infer suffering or consciousness. The robotics group may dislike this—fluent self-description implies Gregorian tools but says nothing about inner experience.

  Finally, the ladder breaks for non-unitary systems. **Honeybee colonies**: Scouts individually operate via trial-and-error (Skinnerian), but collective decision-making (e.g., nest-site selection through waggle dances) resembles Popperian hypothesis-testing. The procedure assigns levels to the *unit of analysis*: if studying the colony, classify it as Popperian; if studying individual bees, default to Skinnerian. **Animals with dense memory but no internal models**: A squirrel recalling thousands of cache sites might exploit memory without simulation. Here, the procedure demands evidence of *previewing* (e.g., planning novel routes) for Popperian status; mere recall is Skinnerian. When systems span rungs, we note the disjunction and specify which rung applies to the tested behavior. Never mistake ladder failures for subject limitations—hybrid systems reveal where Dennett’s hierarchy oversimplifies.

  Use this procedure at intake. It will save semesters by aligning paradigms with proven capacities.
