answer: |-
  Here's a breakdown of your fascinating observation:

  **What the practice is:**
  The art world treats physical paintings uniquely. A revealed forgery, materially identical to before, loses almost all monetary value and museum status. Meanwhile, prints or digital copies of the *same image* are openly sold and displayed without fraud claims. Performing arts are different: playing Bach on a modern piano is still Bach; performing Shakespeare in modern dress is still Shakespeare. An honest artist making a "Vermeer-style" painting today has minimal value compared to an actual Vermeer, even if visually similar. Workshops are an accepted grey area: a painting mostly made by assistants but overseen/signed by the master (like Titian) is still deemed "by Titian" and valuable, though less so than a fully autograph work.

  **The implicit theory:**
  The dominant view here is **Authenticity as Historical Witness & Unique Creation Event.** Value is tied to the *specific physical object* as a unique artifact from a specific historical moment and creative act. The "real" Vermeer isn't just the image; it's the *actual canvas and paint* Vermeer applied in the 17th century. This object witnessed his genius firsthand, carries the trace of his hand, and embodies the historical context of its creation. A forgery, no matter how skilled, is a *different* object from a different time and creator, masquerading as the original artifact. It lacks that historical testimony. Honest pastiches lack the historical origin. Prints and performances are understood as *interpretations* or *reproductions* of the *idea* or *composition*, not claims to *be* the unique historical artifact. Workshops fit because the master's involvement (concept, supervision, key touches) provides enough historical connection to the creator, even if not 100% their handiwork.

  **What it strictly needs vs what it just fits with:**
  *   **Strictly Needs:** This theory *requires* the core idea that the physical object's unique history and direct link to the creator is the *primary* source of its highest value. It explains the catastrophic drop in forgery value (it's a lie about origin/history) and the low value of honest pastiches (correct origin, wrong history). It necessitates the focus on provenance and technical analysis (proving history).
  *   **Fits With (but doesn't strictly require):** The high market value and museum reverence flow naturally from scarcity and this unique historical status, but pure market forces *could* theoretically value fakes highly if undiscovered (though the scandal reveals the dependency on authenticity). The workshop grey area *fits* the theory (prioritizing connection to the master over pure physical execution) but also shows its flexibility/potential inconsistency – the "10% rule" is arbitrary.
  *   **Underdetermined/Inconsistent:** Why is painting *so much more* tied to the physical artifact than music/literature? The theory points to the nature of the medium (unique physical creation vs. inherently reproducible scores/texts), but it feels amplified by tradition and market forces. The workshop practice highlights the inconsistency in applying the "artist's own hand" standard.

  **What would change:**
  *   **Purely Aesthetic Experience Value:** Museums would display the best *image* available – the most convincing forgery or highest-quality print might replace the original if it offered a "better" experience. Originals would have no special status. Auction prices would reflect perceived aesthetic quality alone, regardless of origin. Workshops and forgeries wouldn't be scandals, just variations in quality. Performances and prints would be valued similarly to originals if the experience was comparable.
  *   **Pure Market Value:** The only thing that matters is what collectors will pay. If a brilliant, known-forgery developed a cult following and fetched millions, it would be celebrated. Provenance would only matter if it boosted price, not as inherent truth. Museums would chase crowd-pleasers regardless of authenticity. Honest pastiches could be highly valued if marketed cleverly. The distinction between original, copy, and performance would blur entirely, dictated solely by demand.
  *   **The "Feel" Factor:** Your intuition about the difference is key. The Authenticity theory taps into a deep human response: the awe of encountering the *actual thing* made by the revered creator in the distant past. It's about tangible connection to history and genius. Music and theater, by their performative nature, condition us to value the *experience* of the work *now*, mediated through contemporary interpreters. The painting world prioritizes the relic; the performing arts world prioritizes the ritual. Changing the core theory would fundamentally alter that emotional and cultural connection to the physical object.
