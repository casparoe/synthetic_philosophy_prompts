  **Facilitator’s Notes**:  
  - **Verbal Disputes Flagged**: "Type" ambiguity in "grain-level refinement" (functional role vs. physical state) and "triviality" (descriptive convenience vs. ontological commitment) are clarified in Section 1.5.  
  - **Non-Vacuous Shared Ground**: Agreement on physicalism, exclusion’s severity, and maturity criteria (Section 1) avoids stalemate by isolating testable disputes.  
  - **Neutral Framing**: Cruxes use symmetric evidence (e.g., cross-species conservation vs. neural constraints) to ensure falsifiability.  
  - **Prediction Asymmetry**: F bets on diversity under constraints; I bets on unity through refinement. Both positions are empirically vulnerable.
