y persists all the way down to the level of ion-channel mechanisms, or conversely if it turned out that fine-grained molecular constraints turned every token of a psychological type into tokens of a single neural type. Do not resolve the dispute yourself; your job is to make the residual disagreement exact, and to flag any sub-dispute you judge to be merely verbal. Please begin by brainstorming which claims are genuinely shared versus which merely sound shared, before drafting the final document.
