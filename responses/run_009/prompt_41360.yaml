answer: |-
  ### Joint Statement: Functionalist (F) and Type-Identity Theorist (I)  

  #### Section 1: Shared Commitments  
  After rigorous discussion, we agree on the following non-vacuous claims, grounded in empirical and philosophical common ground:  

  1. **Rejection of Cartesian Dualism**:  
     Both parties reject Cartesian dualism because it violates the causal closure of the physical, lacks empirical support, and fails to explain how non-physical substances could interact with the physical brain. Mental phenomena must be grounded in physical systems.  

  2. **Physicalist Framework**:  
     Mental states supervene on physical states; there can be no mental difference without a physical difference. Both accept the completeness of physics (all physical effects have sufficient physical causes).  

  3. **Definition of "Mature Neuroscience"**:  
     A mature neuroscience is one that provides:  
     - A unified, multilevel theory linking molecular/cellular mechanisms to cognitive/behavioral phenomena.  
     - Predictive and explanatory power across species, individuals, and pathologies.  
     - No in-principle barriers to refining grain levels (e.g., from circuits to ion channels).  
     Current neuroscience is not yet mature, as it lacks comprehensive mapping and predictive robustness.  

  4. **Empirical Facts on Grain Levels**:  
     Apparent multiple realizability (MR) exists at coarse grains (e.g., pain in mammals vs. octopuses). Both agree MR must be empirically tested at finer grains (e.g., neural ensembles, molecular pathways) and that coarseness can mask underlying unity or disunity.  

  5. **Verbal Disputes in Historical Debates**:  
     Past conflicts often conflated:  
     - "Type" individuation (functional-role vs. physical-state criteria).  
     - "Realization" (causal role occupancy vs. token identity).  
     - "Triviality" in functionalism (e.g., whether disjunctive types or lookup tables count as valid realizers).  
     These are resolvable through conceptual clarity, not substantive disagreement.  

  6. **Causal Efficacy**:  
     Mental states are causally efficacious. Neither party endorses epiphenomenalism, but both acknowledge the causal exclusion problem as a central challenge for non-reductive theories.  

  #### Section 2: Table of Residual Disagreements  
  Each party endorses their column’s wording below. Disagreements focus on *individuation criteria* and *scientific progress*:  

  | Issue | Functionalist (F) | Type-Identity Theorist (I) |
  |-------|-------------------|----------------------------|
  | **1. Mental state individuation** | Mental state types are individuated by their causal-functional roles (e.g., inputs, outputs, internal transitions). This allows MR across substrates (e.g., carbon/silicon) as a matter of principle. | Mental state types are identical to specific neural state types (e.g., glutamatergic circuit patterns). Apparent MR reflects coarse-grained folk-psychological categories, not ontologically robust types. |
  | **2. Grain-level refinements** | Finer-grained discoveries (e.g., ion-channel variants) reveal progressive, naturalistic carving of functional roles. Disjunctions are non-arbitrary if they share causal profiles (e.g., "pain realizers" converge on nociceptive function). | Grain refinements are ad hoc retreats to preserve functionalism. Disjunctive types (e.g., "pain ≡ ion-channel A or B or C...") are not scientifically legitimate; they sacrifice parsimony and predictive power. |
  | **3. Status of functional roles** | Causal-functional roles are precise enough to avoid triviality: they exclude brute lookup tables (via counterfactual-supporting structures) and disallow wildly disjunctive realizers (via dynamic stability constraints). | Functional roles are either trivially permissive (admitting lookup tables) or collapse into disjunctive physical types. Only token-identity provides a rigorous psychophysical bridge. |

  #### Section 3: Cruxes and Predictions  
  Cruxes are framed to force empirical adjudication. Both parties agree on the relevance of the described findings but predict divergent outcomes.  

  **Crux 1: Can functional roles avoid triviality/disjunction?**  
  - **Issue**: Whether functionalist criteria can exclude pathological cases (e.g., a lookup table mimicking beliefs) or wild disjunctions (e.g., "pain" realized by unrelated mechanisms), without collapsing into reductive identity or vacuity.  
  - **Relevant Evidence**:  
    - *Cross-species conservation*: If neuroscientists discover that a psychological capacity (e.g., associative learning) is realized by homologous ion-channel mechanisms in vertebrates, insects, and AI, despite divergent evolutionary origins.  
    - *Artificial systems*: If a silicon system replicates human functional organization but uses non-biological mechanisms (e.g., photonic circuits).  
  - **Predictions**:  
    - **F**: Cross-species/artificial cases will show *non-trivial MR*: realizers share causal dynamics (e.g., feedback loops), excluding lookup tables. Homology is unnecessary; functional convergence suffices.  
    - **I**: Apparent MR will vanish under grain refinement: either (a) conserved molecular mechanisms emerge, or (b) functional differences reveal distinct psychological types. Brute lookup tables lack causal powers and are excluded.  

  **Crux 2: Does causal exclusion favor identity theory?**  
  - **Issue**: Whether functionalism’s "causal role" view is vulnerable to exclusion (if physical states do all causal work, functional states are redundant), giving I a principled advantage with its direct psychophysical links.  
  - **Relevant Evidence**:  
    - *Neural constraints*: If mature neuroscience shows every token of a psychological type (e.g., "fear") is identical to a single neural type (e.g., amygdala-hypothalamus circuit with specific neurotransmitters) across all organisms.  
    - *Gapped realizers*: If realizers of a functional role (e.g., working memory) have no overlapping physical properties, even at fine grains (e.g., ionic vs. dopaminergic mechanisms in mammals vs. AI).  
  - **Predictions**:  
    - **F**: Gapped realizers will exist but cause no exclusion: functional states are *causally relevant* via organization. Tight neural constraints are unlikely; evolution/engineering favors diverse solutions.  
    - **I**: Neural constraints will prevail; gaps reflect poor typing. If every psychological token reduces to a neural token, exclusion dissolves. Functional "relevance" without identity is explanatory pretense.  

  ---  
  **Signed**,  
  [Functionalist]  
  [Type-Identity Theorist]  
  [Date]  

