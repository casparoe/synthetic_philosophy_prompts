  Section 1: Shared Commitments

  1. We both reject Cartesian substance dualism because it postulates non-physical substances that would violate the principle of the causal closure of the physical and because it lacks empirical support.
  2. We are both physicalists: we hold that mental states are entirely dependent on and realized by physical states, and that mental causation must be explained within a physicalist framework that respects the completeness of physics.
  3. We agree that current neuroscience is still developing and that a mature neuroscience will provide a comprehensive, multi-level account of brain function that is predictively and explanatorily robust across a wide range of cognitive and behavioral phenomena.
  4. We agree that at our current level of description, there is an appearance of multiple realizability of mental states in different physical systems. However, we disagree on whether this appearance will persist as neuroscience matures and refines its categories.
  5. We agree that some historical disputes in the philosophy of mind (e.g., about whether mental states are "nothing but" brain states) have been verbal, turning on ambiguities in terms like 'type' and 'level of description'. We commit to using these terms with greater precision in the future.
