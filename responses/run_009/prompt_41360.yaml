  - F predicts: We will be able to create artificial systems that are physically very different from brains but that realize the same functional roles and exhibit the same mental states (with causal efficacy). In such systems, the causal efficacy of the mental state will be attributed to the functional organization, and there will be no overdetermination because the functional and physical descriptions are at different levels.
