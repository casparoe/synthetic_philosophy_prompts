  - F: Mental state types are individuated by their causal-functional roles, which can be realized by a potentially open-ended set of physical states, even at the most fine-grained levels of physical description.
  - I: Mental state types, as they will be characterized in a mature neuroscience, will be found to be identical to specific, fine-grained neural state types (e.g., at the level of neural circuits or even molecular mechanisms), and apparent multiple realizability is due to our current coarse-grained descriptions.

  Disagreement 2: On the status of grain-level refinements
  - F: Refinements in grain level that reveal disjunctions of realizers are a natural part of scientific progress and do not undermine functionalism; they are progressive carvings that reveal the true nature of mental states as multiply realizable.
