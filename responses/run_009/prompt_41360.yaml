  Now, for the shared claims section, we must be careful:

  1. We both reject Cartesian dualism because it violates the principle of physical causal closure and is not supported by empirical evidence.
  2. We are both committed to the view that mental states are entirely realized by physical states and that mental causation must be explained within a physicalist framework.
