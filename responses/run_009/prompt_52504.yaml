prompt: |-
  Hey, so for this one I want you to take on the role of a professional philosopher whose specilization is free will and moral responsibility — someone who keeps up with the contemporary literature, not just the intro textbook stuff. I host a small podcast, and next month's guest is a compatibilist of roughly the Dennett school — she holds that free will is real, but that what we should actually care about is securing a kind of free will worth wanting, grounded in reasons-responsiveness, self-control, and the ability to act on values you endorse, rather than in any power to be an uncaused cause. Before you write anything, I'd like you to actually think it through and do a little brainstorming about where the real pressure points in the literature are, and then draft me around nine interview questions. Nothing generic like what drew you to philosophy — every question has to turn on the actual content of her position. At a minimum, I want at least one question each on three things: first, the complaint that this whole approach is a bait-and-switch — that what ordinary people mean by free will involves a kind of ultimate origination, and that reasons-responsive control, however valuable, just isn't the thing they were worried about (I have in mind the Galen Strawson style basic argument that you can't be responsible for your character in a way that would require being somehow the cause of yourself); second, the manipulation-argument stuff, the four-case structure where you go from cases of overt covert manipulation to plain ordinary determinism and the compatibilist is supposed to say at some point the cases come apart — I want to know where she draws that line and why it isn't arbitrary; and third, whether her kind of free will is actually enough to ground deserved blame in the strong retributive sense, or whether what she's really defending only supports forward-looking things like accountability, apology, and protection of others. For every question you draft, also write a follow-up keyed to the answer she's most likely to give, so I can push past the canned response instead of nodding along. One more thing, and it matters to me: my listeners are the type to write in and complain if I dress up a fringe objection as if it's the consensus, so somewhere in your reply, in plain running text, please clearly seperate what's genuinely contested among people who know this literature from what's more or less settled — i.e., tell me which of these pressure points are currently seen as serious open problems versus which ones most working philosophers think the compatibilist has a pretty solid standing answer to. Format-wise, please write everything as continuous prose, like a long email — no headings, bullet points, bold text, or tables, just flowing paragraphs, since I'll be reading it off my phone backstag before we record. And go easy on the name-dropping inside the questions themselves — one or two philosopher names is fine, but I don't want the interview to turn into a pub quiz.
