prompt: |-
  Retired biochemist here, spending my retirement reading history and philosophy of history, and there's a pattern I keep bumping into that I can't find a proper name for. In the lab we kept full notebooks — every failed run got written down right next to the one that worked, so when you went back to explain why the protocol finally succeeded, you knew the base rate of failures. History seems to run the opposite way. When people explain why some institution collapsed or why some war went the way it did, the evidence they're working from — the documents, the memoirs, the numbers that got recorded at all — was itself shaped by the outcome. The losers' papers burned or got written defensively decades later, the surviving clerks are the ones who filed the archive, and the famous "warning signs" everyone cites were one memo among hundreds of equally confident memos pointing in other directions. So the explanation fits the evidence beautifully, but the evidence was pre-sorted to make explanations of exactly this outcome fit. I know about hindsight bias, which lives in the head of the explainer, and about survivorship bias, which is about a filtered sample — but this feels like a third thing, where the event being explained is itself part of the mechanism that curated the evidence used to explain it. Is there an established concept for this kind of outcome-contaminated evidence, and how does it relate to those two (or to anything else in the philosphy of history)? If nobody's named it, coin a term for me and tell me where its edges are — where it stops and plain survivorship bias starts, and whether it makes historical explanation structurally different from explanation in the sciences or just noisier. I'm not after a label I can drop at dinner, I want to know what the phenomenon actually is and what it isnt.
reasoning: |-
  Okay, a retired biochemist is noticing a pattern in history that reminds them of lab notebooks. In science, they record everything—failures and successes—so when you look back, you see the whole process. But in history, the evidence that survives is shaped by the outcome. The losers' documents are lost, archives are curated by survivors, and "warning signs" are cherry-picked from a pile of conflicting memos. This makes historical explanations seem neat but potentially misleading because the evidence is pre-sorted. 

  They mention hindsight bias (judging past events based on knowing the outcome) and survivorship bias (focusing only on what survived). They feel this is a third thing: the outcome itself curates the evidence used to explain it. They want to know if there's a term for this, how it relates to other biases, and if it makes historical explanation fundamentally different from science.

  First, I need to recall if there's an established concept for this. Hmm, in epistemology or philosophy of history, there might be something. Hayden White talks about emplotment, where historians shape narratives, but that's more about interpretation. The Collingwood idea of the "historical imagination" involves reenacting past thoughts, but doesn't address evidence curation by outcomes. 

  Then there's archival silences or gaps, which refer to missing records, often due to power structures. But that's part of it, not the whole picture. The user is pointing to the active shaping of evidence by the outcome itself—like losers' documents being destroyed or survivors controlling the narrative. 

  The concept of "path dependence" in social sciences is related—once an event happens, it influences what follows. But here, it's about evidence curation. Maybe "retrospective determinism" or "outcome-driven evidentiary bias"? But those aren't standard terms. 

  I remember that in statistics, there's "selection bias," where the way data is selected skews results. Survivorship bias is a type of selection bias. The user's phenomenon is a specific form where the outcome determines what survives. So it's a subset of survivorship bias but with a feedback loop: the event changes the evidence pool. 

  For example, in WWII, the Allies' archives are intact; the Nazis burned documents. So when historians explain why the Allies won, they use Allied records, which naturally emphasize their strengths and the Nazis' failures. But contemporaneous evidence might show more uncertainty. 

  This relates to the "winner's archive" problem. Michel-Rolph Trouillot wrote about how power shapes historical narratives—silencing certain voices. That's close. Also, Reinhart Koselleck's concept of "asymmetrical counterconcepts," where opposing groups define each other in ways that survive based on who won. 

  So the term could be "evidentiary contamination by outcome" or "teleological curation." But I need to coin something precise. "Outcome-dependent evidentiary selection" captures the mechanism. Its edges: it's when the event itself alters evidence survival, distinct from general survivorship bias which can occur without the event causing it (e.g., only interviewing survivors of a disaster). Here, the outcome is the curator. 

  Regarding science vs. history: in controlled experiments, scientists preserve all data. History lacks this control; evidence is organic and vulnerable to power dynamics. So it's not just noisier—it's structurally different because the object of study (human events) affects its own evidence trail. Philosophers like Paul Ricoeur discuss narrative's role in history, which science avoids. 

  In summary, the phenomenon is the feedback loop between historical outcomes and evidence preservation. It's a subtype of survivorship bias with a causal twist. I'll define it clearly, relate it to existing ideas, and suggest a term like "teleogenic archival distortion."
answer: |-
  What you're describing is a profound and underappreciated epistemic problem in historical methodology. It **is** distinct from hindsight bias and survivorship bias, though deeply entangled with them. Let's break it down:

  1.  **The Core Problem:** The historical **outcome itself actively curates the surviving evidence pool**, creating a self-reinforcing explanatory loop. The event being explained (e.g., a revolution's success, an empire's collapse, a war's outcome) determines *which* documents, perspectives, and data survive and become accessible to historians. This curated evidence then inevitably makes explanations favoring that specific outcome appear overwhelmingly strong and "obvious," obscuring the genuine contingency and alternative pathways that existed at the time.

  2.  **Why it's Distinct:**
      *   **Hindsight Bias:** This is a *cognitive bias* in the historian's mind. It's the tendency to perceive past events as having been *more predictable* than they actually were *after* knowing the outcome. The problem you describe exists *prior* to the historian's interpretation – it's embedded in the **raw material** they work with.
      *   **Survivorship Bias:** This is a *selection bias* where only a non-random subset of data survives. While your phenomenon *involves* survivorship bias, it specifies **why** the survival is non-random: the survival mechanism is **directly caused by the outcome being explained**. The evidence isn't just randomly lost; it's *systematically destroyed, hidden, distorted, or privileged* **by the consequences of the event itself**. The outcome acts as the curator.

  3.  **An Established Concept?** While philosophers and historians grapple with aspects of this, there isn't a single, universally accepted term specifically capturing this *causal feedback loop between outcome and evidence curation*. However, several closely related concepts provide pieces of the puzzle:
      *   **Archival Silences/Gaps:** (Michel-Rolph Trouillot, Jacques Derrida) Highlights the systemic absences in the historical record, often due to power structures. Your point focuses on how the *specific outcome* creates *specific* silences relevant to explaining itself.
      *   **The Historian's Craft / Historical Method Challenges:** (Marc Bloch, E.H. Carr, Leopold von Ranke) All emphasize the inherent difficulties of source survival, bias, and perspective. Your observation sharpens this to the *causal link to the outcome*.
      *   **Path Dependence & Contingency:** (Historical Sociology, Complexity Theory) Emphasize how early events constrain later possibilities. Your point shows how the *winning path* retrospectively erases evidence of viable alternatives.
      *   **Teleology in History:** The problematic idea that history unfolds towards a predetermined end. Your phenomenon is a *mechanism* that makes non-teleological explanations *evidentially harder* to construct, creating a *pseudo-teleology* in the archives.
      *   **Winner's History / Victors Write History:** A common aphorism capturing the bias, but lacks the specific focus on the *evidential curation mechanism* itself being shaped by the outcome.

  4.  **Coining a Term: Evidential Contamination by Outcome (ECO)** or **Teleogenic Archival Distortion (TAD)**
      *   **Definition:** ECO/TAD is the systematic distortion of the historical record where the very outcome (event, process, power shift) being studied actively determines the survival, accessibility, and perceived significance of the evidence used to explain it. This creates a self-reinforcing loop favoring deterministic or overly simplistic narratives aligned with the outcome.
      *   **Edges/Distinctions:**
          *   **vs. General Survivorship Bias:** ECO/TAD is a *specific subtype*. General survivorship bias (e.g., only studying successful companies) doesn't necessarily involve the *outcome causing the loss*. ECO/TAD *requires* the causal link: the collapse burns the archives, the victors seize/destroy the loser's records, the surviving bureaucracy rewrites history to justify its survival, contemporaneous "noise" (alternative memos) is discarded *because* it proved irrelevant to the outcome.
          *   **vs. Hindsight Bias:** ECO/TAD is about the *ontology of evidence* before interpretation. Hindsight bias is about the *epistemology of interpretation* using that evidence.
          *   **vs. Simple Bias in Sources:** All sources are biased. ECO/TAD focuses on how the *final outcome* retrospectively shapes *which biased sources* dominate the record *and* how their biases align to explain that outcome. It's about the *system-level curation* driven by the result.

  5.  **Impact on Historical Explanation vs. Scientific Explanation:**
      *   **Structural Difference, Not Just Noise:** This isn't merely "noisier" data. It represents a **fundamental structural asymmetry** between historical and experimental science.
          *   **Science (Ideally):** The experimenter *controls* the conditions and *systematically records all data* (failures, controls, anomalies) *before* knowing the outcome. The "protocol" mandates recording the base rate. The evidence exists independent of the result.
          *   **History:** The "experiment" (the past event) *happens uncontrolled*. Crucially, **the outcome actively participates in creating its own evidentiary trail.** Evidence is *organic* – generated, preserved, or destroyed *within* the historical process by actors whose fortunes were shaped by the outcome. There is no external, pre-defined "notebook protocol" enforced by a disinterested observer.
      *   **Consequence:** Historical explanation is inherently **more vulnerable to deterministic narratives**. ECO/TAD makes it disproportionately difficult to recover the genuine uncertainty, the plausible alternatives, the suppressed voices, and the chaotic contingencies that characterized the *past-as-lived-experience*. The archive itself whispers, "It had to happen this way."

  6.  **Navigating ECO/TAD:** Historians aren't helpless. Mitigation strategies involve:
      *   **Source Criticism on Steroids:** Relentlessly asking: *Why* does this source survive? *Who* benefited from its preservation/distortion/destruction? *What* perspectives are *missing* and *why* might they be missing (linking absence to outcome)?
      *   **Seeking Counter-Narratives:** Actively looking for surviving fragments from losers, marginalized groups, or alternative paths, however scarce. Reading archives "against the grain."
      *   **Focusing on Process & Contingency:** Emphasizing the *unfolding* of events, the points of decision, the alternatives considered *at the time* (using diaries, internal memos, drafts – if they survive!), rather than solely the endpoint.
      *   **Comparative History:** Examining similar events with different outcomes to highlight what factors might be obscured by ECO/TAD in a single case.
      *   **Theoretical Awareness:** Explicitly acknowledging the ECO/TAD problem as a fundamental constraint on historical knowledge.

  **In essence:** You've identified a core epistemological challenge in history – **the past's winners not only write history, they curate the archive upon which all subsequent history must be written.** ECO/TAD (or TAD) names the mechanism by which the outcome retroactively sculpts the evidence landscape, making its own inevitability seem more evident than it truly was. It highlights a structural asymmetry between the controlled, prospective evidence-gathering of your lab notebooks and the organic, retrospective, outcome-shaped evidence survival of the historical record. Recognizing this isn't nihilism; it's the mark of a sophisticated historical consciousness, forcing us to constantly question the apparent determinism whispered by the surviving documents.
