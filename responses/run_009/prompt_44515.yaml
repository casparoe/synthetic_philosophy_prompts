  ### Moral Trade Activity Design for 75-Minute Session

  #### Core Structure
  1. **Prep (5 min)**: Distribute "moral portfolio" cards and explain rules.
  2. **Baseline Round (10 min)**: Unilateral allocation of activist hours.
  3. **Trading Round (25 min)**: Negotiation and deal-making.
  4. **Scoring (5 min)**: Calculate points.
  5. **Debrief (30 min)**: Discussion and conceptual mapping.

  ---

  ### Activity Mechanics
  **Rules Summary (1 paragraph handout):**  
  *"You represent a moral agent with 10 activist hours to spend. Your portfolio card shows a secret point system valuing 4 actions differently. First, allocate hours alone. Then, negotiate trades: promise to shift your hours to actions others value, or form coalitions. No real money—only hour reallocations and verbal agreements count. Goal: maximize your points."*

  **Key Components:**  
  - **4 Universal Actions** (displayed publicly):  
    A: Fund animal shelters ($1k = 1 unit)  
    B: Plant trees (1 tree = 1 unit)  
    C: Distribute malaria nets (1 net = 1 unit)  
    D: Lobby for immigration restrictions (1 policy push = 1 unit)  
  - **6 Portfolio Types** (shuffled secretly; 2-3 copies each for variation):  

  | Portfolio         | Weight Multipliers (Points per Unit) | Behavioral Predictions                     |
  |-------------------|-------------------------------------|--------------------------------------------|
  | Animal Advocate   | A:10, B:1, C:0, D:0                | Will overspend on A; may reject D trades   |
  | Climate Utilitarian | A:2, B:8, C:5, D:0                | Values B/C; open to trades excluding D     |
  | Global Health Focus| A:0, B:3, C:10, D:0               | Wants all hours on C; may undervalue A/B  |
  | Family Partisan   | A:1, B:1, C:1, D:10               | Highly values D; others may shun them      |
  | Neutral Egalitarian| A:4, B:4, C:4, D:4                | Natural dealmaker; seeks compromises      |
  | Rights Restrictor | A:0, B:0, C:0, D:10               | "Nasty" portfolio; may face trade boycotts |

  **Gains from Trade Engineering:**  
  - **Hidden Synergies** (baked into point systems):  
    - Animal Advocate + Global Health: Animal Advocate values A at 10× but only gets 2× from C. Global Health gets 0 from A but 10× from C. Trading "A-for-C" hours gives both >50% gains.  
    - Family Partisan + Neutral Egalitarian: Partisan gets 10× from D but only 1× from A/B/C. Egalitarian values all at 4×. Shifting D hours from Egalitarian to Partisan in exchange for A/B/C hours creates mutual gains.  
    - Climate Utilitarian + Global Health: Climate values B at 8× and C at 5×; Health values C at 10× and B at 3×. Health should "sell" B hours to Climate in exchange for more C hours.  

  - **Predictable Frictions:**  
    - Rights Restrictor (D-focused) will be ostracized, though trading with them could objectively improve outcomes (e.g., they value D at 10×, others at 0–4×).  
    - Animal Advocates may refuse *any* deals involving animal-harm actions (even if net points increase).  

  ---

  ### Step-by-Step Flow
  1. **Baseline Allocation (10 min)**  
     - Participants allocate 10 hours across A/B/C/D alone (e.g., spreadsheet or cards).  
     - *Example:* Animal Advocate might allocate: A:10h, B:0h, C:0h, D:0h → 100 pts.

  2. **Trading Round (25 min)**  
     - Open negotiation: Bilateral/multilateral deals, side agreements allowed.  
     - **Critical constraint:** Reallocations must be feasible (total hours ≤10).  
     - *Sample deal:* Animal Advocate shifts 5h from A to C; Global Health shifts 5h from C to A. Outcome:  
       - Advocate gains (5A×10) + (5C×0) = 50 → but gets additional 5A from Health! New total = (5A own + 5A from Health)×10 = **100 pts** (vs. 50 without trade).  
       - Health gains (5C×10) + (5A×0) = 50, plus 5C from Advocate → (5C own + 5C from Advocate)×10 = **100 pts** (vs. 50 alone).  

  3. **Scoring (5 min)**  
     - Calculate points from:  
       - Own actions × personal multipliers  
       - Plus actions others performed *for you* via deals × your multipliers.  

  ---

  ### Debrief Framework (30 min)
  **Guided Discussion Path:**  
  1. **Map Experiences to Concept:**  
     - "Which pairs found large gains? How did you coordinate *without* agreeing on values?"  
     - Highlight Pareto improvements: "Did any deal help everyone *by their own standards*?"  

  2. **Hard Questions:**  
     - Address the Rights Restrictor: "Why did most avoid Portfolio D? If trading with them nets you +30 points *and* gives them +50, is refusal immoral by your own calculus?"  
     - Complicity vs. Pragmatism: "Does trading with 'bad' agents normalize their views? Or is it a net win if their harmful action (D) is offset by your gains in A/B/C?"  

  3. **Moral Uncertainty Insights:**  
     - "How did your willingness to trade change if you were uncertain about weights?"  
     - Link to Ord: Trade thrives under *unresolved* disagreement because differences create value.  

  4. **Limitations of the Game (Be Transparent):**  
     - "What this *doesn't* capture:  
       - **Real-world externalities:** In life, funding D might harm others; the game assumes actions are morally isolated.  
       - **Power imbalances:** We negotiated as equals, but real activists face coercion.  
       - **Emotional friction:** Philosophers traded coolly, but moral disgust (e.g., toward D) often overrides logic."  

  ---

  ### Predictable Challenges & Solutions
  - **Problem:** "Nasty" portfolio (Rights Restrictor) gets isolated.  
    *Solution:* In debrief, calculate hypothetical gains if they *had* traded (e.g., "If Climate Utilitarian shifted 5h to D for Rights Restrictor doing 5h of B, Climate gains 20 pts, Rights gains 50 pts—both win").  

  - **Problem:** Analysis paralysis during trading.  
    *Solution:* Provide a "deal menu" of 2-party templates (e.g., "I do Xh of [your priority] if you do Yh of [my priority]").  

  - **Problem:** Overly complex point calculations.  
    *Solution:* Use a shared spreadsheet with auto-calculated scores (Google Sheets template provided below).  

  - **Problem:** Faculty dominating student negotiations.  
    *Solution:* Assign portfolios randomly; emphasize student-led dealmaking.  

  ---

  ### Materials to Prepare
  - **Portfolio cards** (ensure 1 Rights Restrictor exists)  
  - **Shared spreadsheet** with:  
    - Dropdowns for hour allocations  
    - Auto-calculation: `Total Points = Σ (Units of Action × Your Multiplier)`  
    - Public view: Only actions/hours visible (not multipliers)  
  - **Timer** for rounds  

  This design forces engagement with trade-offs, ensures built-in gains from moral divergence, and surfaces real tensions for debrief. The "nasty" portfolio ensures the complicity debate isn't hypothetical.
