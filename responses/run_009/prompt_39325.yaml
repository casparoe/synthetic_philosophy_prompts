  For the critique-of-randomness angle, I should highlight how Tessie's "it isn't fair" comes only after her family is chosen - exposing how equality of chance masks substantive injustice. Warner's "lottery in June, corn be heavy soon" shows ritualized violence framed as collective benefit. Students should compare this to "randomness as neutral" arguments in sortition.

  But the category error defense is equally strong. The story's horror derives from communal violence, not selection mechanics. When Summers instructs villagers to check slips, Jackson emphasizes their reluctance - this isn't eagerness to govern but complicity in murder. The seminar should contrast this with citizens' assembly recruitment where participants volunteer.

