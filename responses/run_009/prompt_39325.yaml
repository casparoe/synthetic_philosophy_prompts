  Finally, the inversion of what gets randomized: power vs. victimhood. This challenges students to consider why we consider randomness appropriate for some roles (legislators) but not others (judges? bureaucrats?). The permanent administrator role (Summers) should spark discussion about sortition's need for non-random institutional supports.

  Seminar structure: open with the pairing's apparent similarity, then systematically fracture it across four axes (purpose, permanence, ritual, responsibility), using specific scenes. Conclude that the analogy breaks in philosophically productive ways - the story isn't about sortition but becomes a cautionary tale about any system where procedure obscures substantive injustice.
answer: |-
  Here is an essay-length reading structured for your seminar, focusing on the productive tension and fracture points between Jackson's "The Lottery" and the theoretical case for sortition:

  **The Leveller and the Scapegoat: Fracturing the Analogy Between Jackson's Lottery and Political Sortition**

  Shirley Jackson’s "The Lottery" and the advocacy for political sortition both deploy randomness as a core legitimizing principle. Yet, placing them side-by-side reveals not a neat analogy but a profound collision that illuminates the ethical and political stakes of random selection. The strongest case for seeing Jackson as critiquing randomness-as-legitimation rests on the story’s meticulous dissection of how procedural equality masks substantive horror and diffuses responsibility. However, the strongest rebuttal argues this is a category error: sortition confers agency, Jackson’s lottery demands sacrifice. The story’s unique contribution lies not in direct critique of sortition, but in dramatizing the dangers of procedural fetishism and the inversion of what we choose to randomize, offering crucial cautions for any system relying on chance.

  **I. The Case for Jackson as Critique of Randomness-as-Legitimation:**
  Jackson masterfully exposes how the *appearance* of fairness legitimizes atrocity. The ritual’s key elements mirror superficially democratic ideals:
  1.  **Procedural Rigor & Equal Chance:** The repeated emphasis on the box’s history, the slips, the sworn-in official (Summers), the public drawing, and the mantra "fair and square" (scene: the initial gathering and preparation) create a veneer of impartiality. Tessie’s late arrival even introduces a minor procedural hiccup, dismissed as unimportant, underscoring the focus on form over substance. The equality of chance ("everybody took the same chance") is presented as the ritual’s core justification, echoing sortition’s claim to neutralize privilege.
  2.  **Diffusion of Responsibility:** The central horror stems from the collective participation enforced by the ritual. No individual *chooses* Tessie; the lot absolves each villager of direct culpability ("It isn't fair, it isn't right," Tessie screams, but the stones come from the crowd, not a single executioner). This mirrors a potential dark side of sortition: could a randomly selected body make harsh decisions (austerity, war) while members psychologically disclaim personal responsibility, hiding behind "the will of the lot" or "the mandate of the random sample"? The story suggests randomness can be the perfect tool for laundering collective violence into fate.
  3.  **Entrenched Administration:** Mr. Summers isn't chosen by lot; he's the permanent, powerful administrator. His control over the box (the switch to paper slips, its storage and handling) directly parallels contemporary critiques of *who designs and manages sortition*. Who defines the pool? Who sets the agenda? Who facilitates? Summers embodies the risk that the "neutral" random mechanism is curated and controlled by unaccountable figures (scene: Summers consulting the list, the discussion of the box's upkeep, his authority throughout). The randomness of the victim selection obscures the permanence of the power structure administering it.
  4.  **The Reform Debate & Tradition:** The brief exchange where Mrs. Adams mentions villages abandoning the lottery, countered by Old Man Warner’s superstitious fear ("Next thing you know, they'll be wanting to go back to living in caves"), is a perfect miniature of constitutional conservatism (scene: during the drawing, before the Hutchinsons are selected). Warner’s appeal to tradition and dire warnings of chaos mirror arguments against sortition ("it’s untested," "elections are our tradition," "it invites instability"). The story shows tradition weaponized to stifle critical reflection on a barbaric practice legitimized by procedure.

  **II. The Case for Category Error: Power vs. Sacrifice, Selection vs. Ritual:**
  However, the analogy fundamentally breaks because Jackson’s lottery and political sortition serve diametrically opposed purposes:
  1.  **Conferring Power vs. Inflicting Sacrifice:** This is the irreducible fracture. Sortition aims to empower ordinary citizens, granting them agency, voice, and the capacity to shape collective decisions. Jackson’s lottery selects a victim for communal annihilation. The randomness in the story isn't a flawed *method* for achieving a good end (like imperfect representation); it's the very *form* the cruelty takes, making the horror arbitrary and thus more absolute. Tessie isn't given a mandate; she is marked for death. The story critiques the *purpose* of the ritual, not the selection mechanism per se. Random victim selection is intrinsically evil; random empowerment is intrinsically democratic.
  2.  **Ritual, Community, and Scapegoating:** The lottery is embedded in a dense web of communal ritual and implied scapegoating (Warner’s "Lottery in June, corn be heavy soon"). Its function is purgative, binding the community through shared violence against a randomly chosen member. Selection for a citizens' assembly involves recruitment, induction, deliberation, and decision-making focused on policy, not ritual sacrifice (scene: the swift, brutal transition from drawing to stoning, the villagers' awkwardness turning to ritualized violence). The psychological and social dynamics are utterly different. Sortition selects participants for a constructive (if challenging) task; the lottery selects a target for destruction.
  3.  **Volitional vs. Coerced Participation (Implied):** While not explicit in the text, the villagers' participation feels coerced by tradition and social pressure. Citizens' assemblies rely on *volunteers* from the selected pool who agree to participate. This difference in agency is crucial. No one volunteers for Jackson’s lottery.

  **III. What the Story Uniquely Adds to the Sortition Debate:**
  While not a direct critique of sortition, Jackson provides indispensable cautions:
  1.  **The Inversion of Permanent vs. Random Roles:** This is the most philosophically potent contribution. Sortition advocates target *power* for randomization to break elite capture and careerism. Jackson’s story shows a system where *victimhood* is randomized, while *administrative power* (Summers, Graves) remains permanent and entrenched. This forces the question: *Which roles in a polity* should be randomized and *which* require stability, expertise, or accountability? Should we randomize legislators but elect administrators? Or vice versa? The story is a stark warning against randomizing roles where vulnerability, not power, is the primary characteristic.
  2.  **Procedural Fetishism as Moral Blindness:** The story is a masterclass in how meticulous attention to "fair" procedure can numb participants to the monstrous substance of the outcome. The villagers focus on the slips, the box, the drawing rules – anything but the impending murder. This cautions sortition advocates: a perfectly random, meticulously managed selection process guarantees nothing about the *wisdom* or *morality* of the body’s outputs. The procedure must serve just ends, not become an end in itself that obscures injustice. The "fairness" of the draw becomes the villagers' moral alibi.
  3.  **Tradition as Obstacle to Moral Reflection:** The Adamses/Warner debate crystallizes how appeals to tradition and fear of change can paralyze necessary reform. While sortition is presented as a reform *against* traditional electoral systems captured by elites, Jackson reminds us that *any* system, no matter how entrenched or procedurally "fair," must be open to ethical scrutiny. The story challenges students to consider the *source* of resistance to sortition: is it legitimate concern, or a Warner-like clinging to familiar dysfunction?

  **Conclusion: A Fractured Analogy, a Generative Caution**
  The analogy between Jackson’s lottery and political sortition breaks decisively at the point of purpose: empowerment versus sacrifice. Reading the story as a *direct* critique of sortition is a category error. However, the fracture points are philosophically rich. Jackson provides an unparalleled dramatization of how procedural equality and randomness can legitimize atrocity, diffuse responsibility, and mask the permanence of underlying power structures. Most crucially, the story’s inversion – randomizing victimhood while entrenching administration – forces a vital question for sortition advocates: *What exactly are we randomizing, and why?* It serves as a powerful caution against procedural fetishism and a reminder that no selection mechanism, however fair, is immune to being harnessed for unjust ends or obscured by the weight of tradition. Use the pairing not to equate them, but to expose the profound ethical gulf between random empowerment and random victimization, and to sharpen critical thinking about the *context, purpose, and administration* of randomness in any political system. The seminar should conclude not that sortition *is* the lottery, but that Jackson forces us to confront the *preconditions* necessary to ensure sortition empowers justly and avoids becoming merely a "fair" machine for other, darker purposes.
