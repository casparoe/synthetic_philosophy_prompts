  We are designing a procedure for moral trade between two donors with stable, divergent ethical views. The foundation has a discretionary fund of ~$2M per quarter. The procedure must be executable by staff without philosophy training, using about one day per donor per quarter. The board must sign off.

  The core idea: identify "tradeable margins" where the donors' marginal evaluations of budget lines differ sufficiently (in magnitude or direction) such that a trade can make both better off by their own lights. Avoid averaging; respect each donor's distinct ethics. The procedure has four parts: (1) intake, (2) identifying tradeable margins, (3) deal-making rules, and (4) hand-off of value judgments.

  Procedure:

  1. **Intake (Structured Interview)**:
     - Staff conducts separate 2-hour interviews (within the day) with each donor, using a fixed questionnaire.
     - **Step 1.1: List Candidate Projects**. Present a pre-screened list of ~20 projects (with cost, expected outcomes, etc.) for the quarter. Donors may add up to 2 projects each, subject to staff feasibility check.
     - **Step 1.2: Elicit Moral Weights**. For each project, ask:
       - "On a scale from -100 (extremely harmful) to +100 (extremely beneficial), how do you rate this project?" 
       - "What is the maximum amount you would be willing to pay (in $) for this project to happen?" (This is the donor's total value for the project, not per dollar.)
       - For negative ratings: "Would you actively oppose this project? If so, how much would you pay to prevent it?"
     - **Step 1.3: Constraints and Lexical Priorities**. Ask:
       - "Are there any projects you would never fund, regardless of benefits elsewhere? (e.g., deception in research)." Record as hard constraints.
       - "Are there any projects so important that they should be funded first, before considering others, even if others have higher average returns?" Record as lexical priorities.
       - "Are there any projects that must be fully funded or not at all (lumpiness)?" Record.
     - **Step 1.4: Record Marginal Rates of Substitution (MRS)**. For projects without constraints, ask: "If you had to choose, how much of Project X would you give up to get an additional $100,000 for Project Y?" (This captures tradeoffs at the margin.) Do this for a few high-priority project pairs.
     - **Output**: Two sets of records: (A) a list of projects with total value (WTP) and constraints, (B) MRS estimates for key margins.

  2. **Test for Tradeable Margins**:
     - **Step 2.1: Identify Candidate Trades**. For each project pair (i,j) where:
       - Neither donor has a hard constraint against i or j.
       - The projects are divisible (or lumpy but we can trade whole units).
       - Compute for each donor D the marginal value per dollar (MVD) for each project: MVD_i^D = (WTP_i^D) / (cost of i) [if positive, for funding; if negative, for preventing]. For negative projects, the MVD is negative (so preventing it is positive).
     - **Step 2.2: Tradeability Condition**. A trade is possible if:
       - (Case 1: Same project) For a single project i, if Donor A has MVD_i^A and Donor B has MVD_i^B, and sign(MVD_i^A) ≠ sign(MVD_i^B) [e.g., A wants to fund, B wants to prevent], then a trade is possible: one pays the other to change the funding (e.g., B pays A not to fund i).
       - (Case 2: Different projects) For two projects i and j, if Donor A has a higher MVD for i than for j (so A values i more at the margin) and Donor B has a higher MVD for j than for i, then they can trade: A gets more funding for i, B for j.
     - **Step 2.3: Threshold**. Only consider trades where the absolute difference in MVDs is at least $0.10 per dollar (to avoid negligible gains). Also, skip if one donor has a lexical priority that would preempt the trade.

  3. **Deal-Making Rules**:
     - **Step 3.1: Pricing**. For a trade between project i (favored by A) and project j (favored by B):
       - Let the "price" of shifting $1 from j to i be set by splitting the difference: if A values $1 in i at $a (in utility) and B values $1 in j at $b, then the trade ratio is set at (a+b)/2 per dollar shifted? Not exactly. We want both to gain. Instead: 
         - The maximum A would pay to shift $1 from j to i is $a (since A gains $a from i and loses nothing from j if A didn't value j). But we must account for the fact that both are giving up something. Actually, we need the MRS.
         - Better: use the MRS from the intake. Suppose A is willing to give up $x from j to get $1 for i, and B is willing to give up $y from i to get $1 for j. Then the trade is possible if x>1 and y>1 (so both gain by trading). The exchange rate can be set anywhere between 1 and min(x,y). We split the surplus equally: set the rate at (x+y)/2? But that might not be feasible. Alternatively, we set the rate so that the utility gain is equal? Not necessary. We aim for a fair split of the gains from trade.
       - **Rule**: For a trade of budget reallocation between i and j, let:
           - A's gain from shifting $1 to i from j: Gain_A = MVD_i^A - MVD_j^A   [if positive, A benefits]
           - B's gain from shifting $1 to j from i: Gain_B = MVD_j^B - MVD_i^B   [if positive, B benefits]
           - Then the total gain per dollar shifted is Gain_A + Gain_B. We can shift dollars until the gains are exhausted (or projects fully funded).
           - The price is implicit: we are shifting money from j to i (if Gain_A and Gain_B positive). The split of the surplus: we do it proportionally to the gains? Actually, we don't need to set a price; we just reallocate until one of the gains becomes zero or a constraint binds.
