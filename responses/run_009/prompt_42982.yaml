     - **Incentive Misalignment**: Donors may misreport their MRS to get a better deal. E.g., if A underreports their value for B's project, they might get a better trade. We have no verification. Mitigation: we rely on honesty and the fact that repeated interactions may build trust. Also, we record the MRS in a structured way to make misreporting harder (by asking for tradeoffs).
     - **Lexical Priorities and Constraints**: If a project is lexically prior, we might skip a trade that would have been beneficial at the margin. We respect the lexical order.
     - **Lumpiness**: If a project is lumpy, we can only trade whole units. We might leave gains on the table.
     - **Incommensurability**: If the MRS are not linear, our marginal approach may not capture large shifts. We assume local linearity.

