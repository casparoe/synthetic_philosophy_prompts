     - **Step 4.1: Staff Role**. Staff compute the trades and present a proposed allocation. The proposal shows:
       - The initial allocation without trade (e.g., 50-50 split, or by a default rule).
       - The trades found and the gains for each donor (in their own WTP terms).
       - The final allocation and the net benefit for each donor (compared to no trade).
     - **Step 4.2: Donor Approval**. The donors are shown the proposal and must each approve the trades that affect them. They can veto any trade that they now feel violates a constraint (if staff missed it) or if they think the MRS was misestimated. They cannot change the MRS at this stage (unless they spot an error in recording).
     - **Step 4.3: Board Sign-off**. The board reviews for procedural compliance and that the trade does not violate the foundation's charter.

