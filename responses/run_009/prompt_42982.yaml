         **Practical Rule**: For a candidate trade between i and j, compute the total gains (Gain_A and Gain_B per dollar) and then shift as much as possible until:
           - The gains drop below a threshold (e.g., $0.10 per dollar), or
           - One project is fully funded (or defunded) as desired, or
