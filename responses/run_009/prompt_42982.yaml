  ### Moral Trade Allocation Procedure

  **Overview**: This quarterly procedure enables donors A and B to exchange funding authority on projects where their moral valuations diverge sufficiently to create mutual gains. Staff conduct structured interviews to capture values and constraints, identify tradeable margins, broker deals, and route value judgments back to donors. The budget is $2M per cycle.

  ---

  **1. Intake: Structured Interview (3 hours/donor)**  
  *Goal*: Record moral weights, priorities, and constraints without flattening distinctions.  
  *Staff Instructions*:  
  - **Step 1.1**: Present 10–15 pre-vetted projects (cost, impact estimates). Allow donors to add 2 projects each.  
  - **Step 1.2**: Elicit **moral weights** for each project:  
    - "What is the *maximum* you would pay (in $) to fund this project? If harmful, what would you pay to *prevent* it?" Record as `WTP` (willingness-to-pay).  
  - **Step 1.3**: Flag **constraints and lexical priorities**:  
    - "Are any projects *absolutely unacceptable*? Would you veto them regardless of benefits?" Record as `HARD_CONSTRAINT: [Project]`.  
    - "Should any projects be prioritized *first* or *last*, irrespective of cost-effectiveness?" Record as `LEXICAL: [Project] (Priority Level X)`.  
  - **Step 1.4**: Estimate **marginal rates of substitution (MRS)**:  
    - "If you had to reallocate $100,000 from Project Y to Project X, how much would you gain/lose in value?" Compute MRS<sub>X,Y</sub> = (Δ Value<sub>X</sub>) / (Δ Value<sub>Y</sub>).  
  *Output*: For each donor: WTP, HARD_CONSTRAINTS, LEXICAL priorities, and MRS for key project pairs.

  ---

  **2. Test for Tradeable Margins (Staff: 2 hours)**  
  *Goal*: Identify projects where donors’ marginal valuations diverge sufficiently for mutual gains.  
  *Criteria for Tradeability*:  
  - **Case 1: Same project** (e.g., A wants to fund, B wants to prevent):  
    - Tradeable if sign(WTP<sub>A</sub>) ≠ sign(WTP<sub>B</sub>) and |WTP<sub>A</sub>| + |WTP<sub>B</sub>| > 0.  
  - **Case 2: Different projects** (e.g., A prefers cages, B prefers pandemics):  
    - Tradeable if:  
      MRS<sub>Cages,Pandemics</sub><sup>A</sup> > 1 and MRS<sub>Pandemics,Cages</sub><sup>B</sup> > 1.  
      *(i.e., A values cages > pandemics by own lights, and vice versa for B)*.  
  - **Exclusions**:  
    - Projects subject to LEXICAL priorities (allocate these first/last without trade).  
    - If HARD_CONSTRAINTS apply to either project (e.g., B’s anti-deception rule), no trade.  
  - **Threshold**: Only pursue trades where the **gain ratio** (min(MRS<sub>A</sub>, MRS<sub>B</sub>)) ≥ 1.2 (i.e., ≥20% mutual gain).  

  ---

  **3. Deal-Making Rules (Staff: 2 hours)**  
  *Goal*: Price trades and split surplus while respecting constraints.  
  *Rules*:  
  - **Pricing**: For a trade between Project<sub>A</sub> (A’s priority) and Project<sub>B</sub> (B’s priority):  
    - Compute the **bargaining range**:  
      - *A’s minimum ask*: $X such that Value<sub>A</sub>(Project<sub>A</sub> +$X) = Value<sub>A</sub>(Project<sub>B</sub> -$Y) + ε.  
      - *B’s maximum offer*: $Y such that Value<sub>B</sub>(Project<sub>B</sub> +$Y) = Value<sub>B</sub>(Project<sub>A</sub> -$X) + ε.  
    - Set the **trade ratio** $X:$Y at the midpoint of the bargaining range (e.g., if A accepts $1.2M for cages if B funds $0.8M for pandemics, and B accepts up to $1M, set $X=1.2M, $Y=0.8M).  
  - **Constraints**: If a trade violates HARD_CONSTRAINTS, discard it.  
  - **Surplus Splitting**: After pricing, compute:  
    - *Gain<sub>A</sub>* = Value<sub>A</sub>(post-trade) - Value<sub>A</sub>(no-trade)  
    - *Gain<sub>B</sub>* = Value<sub>B</sub>(post-trade) - Value<sub>B</sub>(no-trade)  
    - If Gain<sub>A</sub>/Gain<sub>B</sub> > 2 or < 0.5, adjust trade ratio to **balance relative gains** (e.g., shift 10% of surplus to the lesser-gaining donor).  
  - **Multiple Trades**: Execute highest-gain-ratio trades first until the budget is exhausted.  

  ---

  **4. Hand-off to Donors and Board (1 hour)**  
  *Goal*: Separate factual computation from value judgments.  
  *Procedure*:  
  - Staff present donors with:  
    - **Factual Outputs**: Proposed trades, trade ratios, computed gains, and budget allocation.  
    - **Value/Trust Questions** (routed to donors):  
      - "Does this trade violate your constraints?" (veto right).  
      - "Do you accept the reported WTP/MRS?" (if not, restart intake).  
      - "Is the gain-split fair?" (donors may renegotiate; staff recalculate).  
  - Board reviews for:  
    - Adherence to this procedure.  
    - No averaging of donor values.  
    - No violation of foundation bylaws.  

  ---

  **Where It Misfires**:  
  - **Incentive Misalignment**: Donors may underreport WTP for their priorities to secure better trade ratios (e.g., A underreporting value for cages to "buy" B’s support cheaper). No verification exists beyond donor honesty.  
  - **Non-Linear Values**: If project values are not marginal (e.g., high fixed costs), MRS becomes inaccurate.  
  - **Binding Constraints**: Trades involving lexical priorities or HARD_CONSTRAINTS are impossible (e.g., B’s anti-deception rule).  
  - **Zero-Sum Scenarios**: If no mutual gains exist (e.g., both value only their own projects equally), trade fails.  

  ---

  **Case Applications**:  
  **Case 1: Battery Cages (A) vs. Pandemic Research (B)**  
  - *Intake*:  
    - A: WTP<sub>Cages</sub> = $1.5M, WTP<sub>Pandemics</sub> = $0.3M → MRS<sub>Cages,Pandemics</sub><sup>A</sup> = 5.0.  
    - B: WTP<sub>Pandemics</sub> = $1.8M, WTP<sub>Cages</sub> = $0.2M → MRS<sub>Pandemics,Cages</sub><sup>B</sup> = 9.0.  
  - *Tradeability*: MRS<sub>A</sub> > 1 and MRS<sub>B</sub> > 1 → tradeable.  
  - *Deal*:  
    - A funds $1M for pandemics (B’s priority).  
    - B funds $1M for cages (A’s priority).  
    - Gain<sub>A</sub>: Values cages at $1.5M (B’s funding) vs. $0.75M in 50/50 split → +$0.75M.  
    - Gain<sub>B</sub>: Values pandemics at $1.8M (A’s funding) vs. $0.9M in 50/50 split → +$0.9M.  
    - *Surplus split*: Relative gains balanced (Gain<sub>A</sub>/Gain<sub>B</sub> = 0.83).  
  - *Outcome*: Each donor funds the other’s priority. Throughput doubles (each project gets $1M from the other’s budget).  

  **Case 2: Space Settlement (B) vs. A’s Opposition**  
  - *Intake*:  
    - B: WTP<sub>Space</sub> = $2.0M.  
    - A: WTP<sub>Space</sub> = -$1.5M (harm), and flags creation of sentient life as HARD_CONSTRAINT.  
  - *Tradeability*: A’s constraint → no trade possible.  
  - *Outcome*: No allocation to space.  

  ---

  **Your Discomfort**:  
  - **In Case 1**, the procedure recommends the reciprocal funding swap you anticipated, doubling throughput. Your discomfort (that this feels like "averaging" or undermines purity of values) is **recorded in the hand-off phase** as a value judgment. Staff explicitly state: "This trade serves Donor A’s and B’s *self-reported* values, not the foundation’s ethics."  
  - The procedure routes all discomfort about trade fairness to donors. If they accept the gains, it is not staff’s or the board’s role to override (per your mandate: "the foundation is committed to no one’s ethics but each donor is committed to their own").  
  - **Misfire note**: In Case 1, donors might misreport WTP to manipulate trade ratios. Staff cannot verify introspective reports, relying on donor integrity.  

  ---  
  **Final Output**: Allocation package with trades, gains, and donor sign-off. Word count: 1,380.
