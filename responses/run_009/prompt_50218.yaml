prompt: |-
  I teach a mixed bunch of sixth formers at a state school in Leeds (15 of them, Year 12, doing classical civilisation, and we can get two 45-minute sessions in the same week) and this term we're on Athenian democracy's car-crash moments. Rather than just lecturing on the Mytilene affair, I want them to actually live through it, and I'm hoping you can design the whole thing. Quick recap in case it helps you get the setting right: in 428/427 BC Mytilene revolted against Athens with Spartan backing, the Athenian assembly voted to execute the entire male population and enslave the women and children, a trireme was dispatched to carry it out, and then a second assembly was held the next day and reversed the decision — a second ship had to be rowed flat out to overtake the first. Thucydides gives us both speeches from the second debate: Cleon arguing that harshness is what imperial security requires, and Diodotus, whose move I find most interesting — he explicitly refuses to argue from mercy, and instead attacks the *procedures* of the debate itself, pointing out that a city which puts speakers under suspicion when they advocate for the defeated will end up hearing only bad arguments.

  Here's my problem: my students are nice kids. If I just say "you're the Athenian assembly, vote," they'll vote mercifully on day one and there's no drama, no reversal, nothing to debrief. So the first assembly has to actually go harsh — I need engineered incentives, not hope. Maybe role cards with private interests (generals terrified of looking soft on revolts, families who lost people or money, allies' representatives watching, a few genuine moderates), maybe some payoff scheme that doesn't involve real money, maybe rules about speaking time or who's allowed to speak when. Then in the second session, one or two students need the Diodotus role — the job of flipping the majority not by appealing to compassion but by reframing the question and gaming the procedure, and I want the class to viscerally feel that the same facts plus a different framing turned a bloodthirsty majority around.

  So please design: the setup, the role cards, the voting mechanics across both sessions, the payoffs, and a debrief that maps what actually happened onto the institutional failure modes of direct democracy — deciding irreversible policy in one afternoon, emotional momentum, speakers' incentives to outbid each other, the way accountability after the fact (people being punished for their speeches, which is what happened after Arginusae) makes deliberation worse. Then a short extension showing how the same machinery explains the enthusiasm for the Sicilian expedition or the vote to execute Socrates. Also be honest about what a classroom version can't possibly reproduce — the real stakes, the plague, the genuine fear of losing the empire — and tell me what will predictably go wrong the first time I run it (I'm braced for one kid grandstanding as Cleon for laughs, and for the second debate collapsing into modern moralising about how obviously slavery is bad, which rather misses the point). Oh, and could you write the whole thing up in American English? My TA is American and she'll be adapting it for her own class, so I don't want her having to translate. Sorry for the long brief, and thankyou in advance!
reasoning: |-
  Okay, the user is a teacher in Leeds running a classical civilization class for Year 12 students. They want to simulate the Mytilene debate to make Athenian democracy's failures tangible. The key challenge is ensuring the first vote goes harshly—students naturally lean merciful. 

  Hmm, they need engineered incentives. Role cards with hidden agendas could work—military advisors fearing career damage if seen as soft, merchants with sunk costs, bereaved families. Must avoid modern moralizing about slavery during the debate. 

  For structure: Session 1 should feel rushed. Limited speaking slots, emotional framing ("Remember your dead at Plataea!"), maybe a timer. Voting must be public to create peer pressure. 

  Session 2 needs procedural cleverness. Diodotus' card should explicitly forbid mercy arguments—force tactical framing like "Executions waste resources" or "Bad precedent for future revolts." Maybe give this role to quieter students. 

  Debrief is crucial. Map classroom dynamics to Thucydides: how speed/public voting bred hysteria, how role constraints mimicked real Athenian speaker fear. Then pivot to Sicilian Expedition parallels—same impulsive assembly, different catastrophe. 

  Predictable hiccups: The class clown playing Cleon as a villain, someone blurting "But slavery is wrong!" Mitigations: Pre-brief modern ethics, make procedural arguments worth bonus points. 

  American English note: Done—"math" not "maths," "tire" not "tyre." Added a cheat sheet for the TA on Leeds-to-US terms (e.g., "sixth form" = "11th/12th grade"). 

  Final touch: A reflection worksheet where students annotate their role cards with what they *really* thought vs. what they argued. Helps unpack the "institutional car crash" metaphor.
answer: |-
  Here’s a complete, ready-to-run simulation designed for your constraints (2x45-min sessions, 15 students, American English), with engineered incentives to force the dramatic reversal Thucydides describes. It leans into role-play, strategic payoffs, and procedural manipulation to mirror Athenian institutional failures.

  ---

  ### **Simulation Title:** *The Mytilene Crisis: Democracy Under Pressure*

  ### **Learning Goal:**  
  Students experience how direct democracy’s procedures—not just ideas—can drive catastrophic decisions, and how reframing debates can override moral instincts.

  ---

  ### **Setup Before Session 1**
  1. **Room Layout:**  
     - Desks in a semicircle (the Pnyx hill).  
     - Teacher’s desk = "Bema" (speaker’s platform).  
     - Whiteboard tracking "Athenian Interests" (see Voting Mechanics).  

  2. **Role Cards (15 students):**  
     *(Assign secretly; roles incentivize harsh votes unless otherwise noted)*  
     - **General (x2):** *"If Mytilene goes unpunished, allies will revolt! Sparta will see us as weak. Your reputation is at stake—voters punish ‘soft’ generals."* **PAYOFF:** +2 influence if harsh vote wins.  
     - **Ship Owner (x2):** *"Your trade fleet was burned in Mytilene’s harbor. Rebuilding costs 50 talents. Only seizing Mytilene’s wealth covers this."* **PAYOFF:** +1 influence if harsh vote wins.  
     - **War Widow (x1):** *"Your husband died fighting Spartans. Mytileneans stabbed Athens in the back. Demand justice."* **PAYOFF:** Emotional leverage—others gain +1 if they reference your story.  
     - **Trierarch (Elite Citizen) (x3):** *"You fund warships. Harsh punishment deters revolts—protecting your investments. Mercy looks like indecision."* **PAYOFF:** +1 influence if harsh vote wins.  
     - **Allied Diplomat (x2):** *"Your city (e.g., Samos) pays tribute to Athens. You’re watching: will Athens reward treachery? If not harsh, your city may revolt too."* **PAYOFF:** +1 if harsh vote wins.  
     - **Moderate Politician (x2):** *"Sparta forced Mytilene to revolt! Executing innocents is unjust and will radicalize other allies."* **PAYOFF:** +2 if merciful vote wins.  
     - **Cleon (x1):** *"You DEMAND execution! Mercy is weakness. Attack speakers who disagree as traitors. Rally the angry mob."* **PAYOFF:** +3 if harsh vote wins.  
     - **Undecided Voter (x2):** *"You lost no family/wealth. You’ll vote with the majority’s energy. Watch who’s persuasive."* **PAYOFF:** +1 for voting with the majority.  

     > 🔑 **Key Incentive:** "Influence" points determine who gets priority speaking time/extra credit. No real money—just strategic capital.  

  3. **Voting Mechanics (Session 1):**  
     - **Step 1:** Quick "revolt briefing" (2 mins): *"Mytilene betrayed Athens mid-war. They have Spartan troops. What message do we send?"*  
     - **Step 2:** Open Debate (15 mins):  
       - Speakers raise hands. Teacher calls 1 harsh/1 merciful speaker alternately.  
       - **Rule:** Accuse opponents of "corruption" or "cowardice" to cut their speaking time.  
       - **Whiteboard Tracker:**  
         ```  
         ATHENIAN INTERESTS  
         SECURITY: [ ]  
         REPUTATION: [ ]  
         PROFIT: [ ]  
         ```  
       - Speakers argue for which interest matters most. Teacher ticks boxes when arguments align.  
     - **Step 3:** Vote (5 mins):  
       - **Public vote by show of hands.** Teacher tallies.  
       - **Manipulate Outcome:** Announce *before voting*: *"Spartan spies report your allies will defect if you show mercy."* (Triggers Allied Diplomat/General payoffs).  

  ---

  ### **Session 1: Engineered "Car Crash"**
  - **Predictable Outcome:** With 10/15 roles incentivizing harsh votes + public pressure + Cleon riling anger, harsh vote wins (13-2 or similar).  
  - **Teacher Script:**  
    > *"The decree passes! Kill all men, enslave women/children. A trireme sails NOW to enact this. Guards, remove any Mytilenean ‘sympathizers’ who opposed this!"* (Dramatically point at merciful voters).  
  - **Crucial Cliffhanger:** *"Tomorrow, we reconvene. Some of you... regret this."*  

  ---

  ### **Setup Before Session 2**
  - Rearrange room identically.  
  - **Update Role Cards:**  
    - **Diodotus (x1–2, assign to quiet students):** *"STOP! Arguing mercy gets you called a traitor. Instead, attack the *process*: ‘Rushed votes force bad decisions! Punishing speakers means only fools speak!’ Frame harshness as *stupid*: ‘Dead Mytileneans can’t pay tribute!’"* **PAYOFF:** +3 if vote flips.  
    - **Moderates/Undecideds:** *"You’ve slept on it—this feels extreme. But Cleon’s faction will attack you if you speak kindly of Mytilene."*  
    - **Others:** Unchanged goals, but nervous about "buyer’s remorse."  

  ---

  ### **Session 2: The Reversal**
  - **Step 1:** (5 mins) *"Dawn breaks. You hear whispers: executing thousands feels reckless. But Cleon’s faction watches for ‘traitors.’"*  
  - **Step 2:** Debate (25 mins):  
    - **New Rule:** Speakers must start with *"This isn’t about compassion, it’s about..."*  
    - **Teacher Tactics:**  
      - Let Cleon speak first (emotional rant).  
      - Interrupt moralizing: *"Diodotus, you’re accused of taking Mytilenean bribes! Defend yourself!"*  
      - **Diodotus’ Playbook:** Forces debate onto:  
        - *Procedure:* "Yesterday’s vote was rushed! Suspecting speakers means no honest advice!"  
        - *Pragmatism:* "Alive, they pay tribute. Dead, they’re useless. Harshness *invites* rebellions!"  
    - Track "PRAGMATISM" and "PROCEDURE" on whiteboard.  
  - **Step 3:** Vote (5 mins):  
    - **Secret ballot** (reduce peer pressure).  
    - **Manipulate:** Before vote, announce *"Mytilene offers double tribute if spared."* (Triggers Ship Owner/Trierarch payoffs).  
  - **Outcome:** Vote flips to mercy (9-6 or similar).  

  ---

  ### **Debrief (15 mins)**  
  *Map classroom dynamics to Athens:*  
  1. **Speed + Emotion:** *"Why did you vote harshly yesterday? Was anyone swayed just because others shouted louder?"* → Link to Athens’ single-day irreversible decisions.  
  2. **Speaker Incentives:** *"Cleon, why call opponents traitors? Diodotus, why avoid moral arguments?"* → Explain how accountability (post-Arginusae executions) warped debate.  
  3. **Framing Matters:** *"Same facts—why did ‘tribute’ beat ‘justice’ today?"* → Diodotus understood democracy’s levers.  
  4. **Whiteboard Tactic:** *"Why did ‘Security/Profit’ beat ethics?"* → Direct democracy prioritizes immediate interests.  

  *Institutional Car-Crash Takeaway:*  
  > "Athens wasn’t full of monsters—it had procedures that *manufactured* cruelty. Your role cards made you complicit. That’s why the Sicilian Expedition (415 BC) happened: same speed, same emotional appeals (‘Glory! Wealth!’), same silencing of doubters. Socrates? Same machine: ‘corrupting youth’ was the ‘security interest’ that overrode fairness."  

  ---

  ### **What This Simulation CAN’T Capture (Tell Students)**  
  - **Real Stakes:** No one dies. You debated points, not lives.  
  - **Plague/War Fear:** Athens was exhausted, paranoid—like voting after a terrorist attack.  
  - **Imperial Logic:** Athens *needed* terror to hold its empire; your "influence" points are pale shadows of that desperation.  

  ---

  ### **Predictable Problems & Fixes**  
  - **Grandstanding Cleon:** *Lean in.* Let him rant, then ask: "Why did this work yesterday but not today? What changed?"  
  - **Modern Moralizing:** Pre-brief: *"You’re Athenians—slavery/tributary empires are normal. Judging antiquity is week 12; today, think like them."*  
  - **Quiet Students:** Assign Diodotus to them—they’ll shine with procedural arguments.  
  - **Time Shortage:** Use strict speaking timers (1 min/speech). Cut recap if needed.  

  ---

  ### **Extension for Fast Classes**  
  *"In 415 BC, Athens voted to invade Sicily. Same assembly, same pressures. Role-play it:*  
  - **Pro:** *"We’ll gain wealth! Glory! Easy victory!"*  
  - **Con:** *"It’s overreach! Don’t abandon war with Sparta!"*  
  *Vote by energy—who shouts loudest? Then reveal: it led to total defeat. Why didn’t they learn from Mytilene?"*  

  ---

  ### **Materials to Prep**  
  - Printed role cards (with payoffs).  
  - Whiteboard markers.  
  - Voting tally sheets.  
  - Trireme image (visual for cliffhanger).  

  This forces the emotional arc you want: knee-jerk cruelty → procedural regret → institutional paranoia. By making students *complicit* in the mechanics, they’ll feel the car crash in their guts. Let me know how the rowing goes!
