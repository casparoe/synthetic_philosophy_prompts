  The user's frustration with recycled arguments is palpable. When they mention "no experiments to wait for," they're highlighting how this differs from scientific disputes. Yet their suggestion about modality being a hidden factor is acute - van Inwagen's modal arguments for endurantism do surface occasionally but get reabsorbed into familiar patterns.

