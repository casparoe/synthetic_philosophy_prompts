  First, I need to address each part of the book's argument. Let me verify Sahlins' original work. The "original affluent society" concept is real, but Sahlins was discussing low wants, not just work hours. He used examples like the !Kung, but his argument was more about satisfaction with minimal material goods. The work hours might be oversimplified since foragers' efforts vary seasonally and by environment. 

  Next, the skeletal evidence. The book says life expectancy dropped to 30 with farming. But life expectancy at birth is different from adult lifespan. High infant mortality skews the average. Some studies show that foragers who survived childhood could live longer, but farming populations had higher birth rates, even if individuals lived shorter lives. Also, health issues like dental problems and diseases did increase with sedentism and close proximity to animals, but that's not the whole story. 

  Then there's inequality. The book ties property to farming, but the user mentioned Northwest Coast foragers who had complex societies with hierarchy without agriculture. Examples like the Chumash or Calusa also challenge this. So agriculture isn't the sole cause of social stratification. 

  The user's deeper concerns might be questioning the oversimplification in pop-science books. They want a balanced view but are inclined to believe the forager-life part. They might be interested in understanding if the core argument holds despite inaccuracies. Also, they want to know if they can still recommend the book, which suggests they value the critical perspective but want to avoid spreading misinformation.

  I should structure the answer as per their request: solid parts, wobbles, conclusion, verdict. The solid points include health decline and disease spread. Wobbles involve Sahlins' nuances, life expectancy confusion, and exceptions in forager societies. The conclusion is that while there were downsides, farming enabled cultural advancements, so it's not a straightforward downgrade. The verdict might be that the book is provocative but oversimplified, so recommend with caveats.
answer: |-
  Here's a breakdown of the passage, addressing your specific concerns:

  **The solid part**
  The passage correctly highlights several downsides of the Neolithic Revolution. Agriculture *did* often lead to poorer health markers initially: skeletal evidence shows higher rates of dental caries (cavities), enamel defects, and certain infectious diseases due to sedentary living, proximity to animals (zoonoses), and reliance on less varied diets (especially grains). Population density increased dramatically, enabling devastating epidemics. Sedentism and stored surpluses *were* prerequisites for the development of complex social hierarchies, inherited wealth, and large-scale inequality that were generally absent in most mobile forager societies. Jared Diamond *did* popularize the "worst mistake" argument based on these health and equality costs.

  **The wobbles**
  This section unpacks the specific issues and your questions:

  1.  **Sahlins & the "Original Affluent Society":** Sahlins *did* coin the term. However, his argument was nuanced. He argued hunter-gatherers were "affluent" because they easily satisfied their **limited material wants**, freeing up leisure time. He *didn't* claim all foragers universally worked only 3-4 hours daily. The famous !Kung data (~2.5 days/week foraging) applied to a *specific* group in a *rich* environment (Kalahari). Workload varied massively by environment (e.g., Arctic vs. tropics) and season. The "affluence" was largely about low material desire, not necessarily zero effort or constant leisure.
  2.  **Life Expectancy & Skeletons:** This is a major oversimplification:
      *   **"Lived into their seventies":** This confuses lifespan with life expectancy. *Some* foragers certainly lived into their 60s and 70s, just as some early farmers did. **Life expectancy at birth (LEB)** was low for *both* groups primarily due to very high infant and child mortality. A LEB of 30 doesn't mean everyone died at 30; it means many died as infants/children, but those surviving childhood had a reasonable chance of living to 50 or 60. Skeletal data shows that while adult stature often declined *initially* with agriculture, and markers of nutritional stress/infection increased, the claim of a *universal* crash from "seventies" to "thirty" is incorrect. Pre-agricultural LEB was likely 20-35, rising only slowly over millennia with agriculture (despite the health costs).
      *   **"Everything got worse":** While health often declined *initially*, farming eventually enabled larger populations, greater specialization, and, over the *very long term*, significant improvements in public health, medicine, and lifespan – though these took thousands of years and were unevenly distributed.
  3.  **Inequality & Your Northwest Coast Point:** This is the book's strongest point about agriculture *facilitating* hierarchy, but it's not absolute. **You are absolutely right to highlight the Northwest Coast societies (like the Tlingit, Haida, Kwakwakaʼwakw).** These complex hunter-gatherers had permanent villages, inherited social rank, significant wealth accumulation (canoes, slaves, copper plates), and slavery – **all without agriculture!** Similar complex, sedentary, hierarchical forager societies existed elsewhere (e.g., Calusa in Florida, Chumash in California, Jomon in Japan). Agriculture was a *powerful engine* for inequality (granaries, land ownership, surplus control), but **it wasn't the *only* pathway.** Dense, predictable resources (like salmon runs or shellfish beds) could also support sedentism and social stratification independently.
  4.  **"No Reason to Switch / Farmers Outbred Them":** While the demographic advantage of farming (sustaining far higher population densities) is key to its spread, the "no reason" claim is too strong. Farming offered predictable food in one place (reducing some risks), allowed accumulation of possessions impossible for mobile foragers, and provided surplus for feasting/trade. The transition was likely gradual and messy, involving mixed economies for millennia, not a simple choice or immediate displacement.

  **Does the conclusion survive?**
  The core thesis – that the adoption of agriculture often imposed significant *immediate* health costs and created structural conditions enabling unprecedented inequality and vulnerability to disease – **retains substantial validity.** However, the claim of a "permanent downgrade in the quality of human life" is overstated. Agriculture enabled the development of cities, writing, advanced technology, complex art, and eventually, much longer lifespans and reduced physical toil for many. It created *different* problems and trade-offs. The "downgrade" was likely acute for the *first generations* of farmers, and the costs of inequality and epidemic disease remain profound burdens, but framing 12,000 years of subsequent human experience as a single "permanent downgrade" ignores the complex tapestry of gains and losses.

  **Verdict**
  The book presents a provocative and partially valid critique of the Neolithic Revolution, highlighting crucial downsides often overlooked. **However, it relies heavily on oversimplification, selective evidence, and hyperbolic language.** You can recommend it as a thought-provoking counter-narrative, **but it must come with strong caveats about its accuracy on specifics like lifespan, Sahlins's nuance, and the existence of complex foragers. Recommend it as a starting point for debate, not as definitive history.**
