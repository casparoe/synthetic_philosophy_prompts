answer: |-
  Below is a diagnostic quiz designed to identify your anthropic reasoning style through concrete cases. The quiz avoids technical terms and focuses on your intuitive responses. Answer based solely on the described scenarios. There are 8 questions, each with 2-4 options. At the end, a scoring key will map your answers to positions in anthropic reasoning (without judgment—it’s about consistency, not correctness). One question (Q8) is deliberately unscored to accommodate deflationary views.

  ---

  ### **Q1: The Coin Flip**  
  A coin is flipped. If heads, God creates 1 person in a room. If tails, God creates 10 people in identical rooms. You wake up in one of these rooms. What odds do you assign to the coin being heads?  
  - A. 50% (1:1)  
  - B. About 9% (1:10)  
  - C. 100%  
  - D. I don’t know / the question feels misleading  

  ### **Q2: The Colored Room**  
  Two theories are equally likely: **Theory A** creates 1 person (always in a red room). **Theory B** creates 1,000 people, each independently assigned a red or blue room with 50% probability. You wake up in a red room. What is the probability of Theory A?  
  - A. ~66.7% (2/3)  
  - B. ~0.2% (1/501)  
  - C. 50%  
  - D. I don’t know / the question feels misleading  

  ### **Q3: The Birth Rank**  
  You learn you are the 60 billionth human ever born. Based on this, what is your confidence that humanity’s total population (past + future) will be less than 1 trillion?  
  - A. Lower than before (you’re likely "typical," so total is large)  
  - B. Unchanged from before (your birth rank is irrelevant)  
  - C. Higher than before (you’re "early," so total is small)  
  - D. I don’t know / the question feels misleading  

  ### **Q4: Sleeping Beauty (Standard)**  
  Sleeping Beauty is told: A fair coin is flipped. If heads, she is awakened once (Monday). If tails, she is awakened twice (Monday and Tuesday). After each awakening, she forgets everything. When awakened, what should her credence be for heads?  
  - A. 1/3  
  - B. 1/2  
  - C. I don’t know / the question feels misleading  

  ### **Q5: Sleeping Beauty (Monday)**  
  Same as Q4, but now Beauty is told, "Today is Monday" during the awakening. What should her credence for heads be?  
  - A. 1/2  
  - B. 2/3  
  - C. 1/3  
  - D. I don’t know / the question feels misleading  

  ### **Q6: The Bet**  
  Two theories are equally likely: **Theory A** predicts 1 observer in the universe. **Theory B** predicts 2 observers (you and one other). You are offered a bet: win $1 if A is true, lose $1.50 if B is true. Do you take it?  
  - A. Yes  
  - B. No  
  - C. I don’t know / the question feels misleading  

  ### **Q7: The Absent-Minded Driver (Variant)**  
  A driver forgets their location. They know the road has two exits: Exit 1 (good) comes first, Exit 2 (bad) comes later. They are equally likely to be at either exit. What probability should they assign to being at Exit 1?  
  - A. 50%  
  - B. 67% (2/3)  
  - C. I don’t know / the question feels misleading  

  ### **Q8: The Comet (Unscored)**  
  A comet has a 1% chance to have hit Earth in the past, preventing your birth. You exist today. What is the probability the comet hit?  
  - A. 0%  
  - B. 1%  
  - C. I don’t know / the question feels misleading  
  *(This question is for reflection and not used in scoring.)*  

  ---

  ### **Scoring Key**  
  Map your answers to positions by comparing patterns. The logical space of anthropic positions is defined by how they handle self-locating uncertainty:  

  1. **Self-Sampling Assumption (SSA)**: You reason as if randomly sampled from all actual observers.  
  2. **Self-Indication Assumption (SIA)**: You treat your existence as evidence for theories with more observers.  
  3. **Full Non-Indexical Conditioning (FNC)**: You condition only on non-indexical facts (what exists), not on your identity.  
  4. **Deflationary (D)**: You reject self-locating probabilities as ill-defined or subjective.  

  #### **Answer Patterns**  
  - **SSA**: Q1=B, Q2=A, Q3=C, Q4=A, Q5=A, Q6=B, Q7=B  
    - *Profile*: Favors "being typical" (e.g., Doomsday pessimism, Sleeping Beauty 1/3).  
  - **SIA**: Q1=B, Q2=B, Q3=B, Q4=A, Q5=A, Q6=B, Q7=A  
    - *Profile*: Weights theories by observer count (e.g., presumptuous optimism).  
    - *Note*: SIA and SSA agree on Sleeping Beauty but diverge elsewhere (Q2, Q3).  
  - **FNC**: Q1=A, Q2=C, Q3=B, Q4=B, Q5=A, Q6=B, Q7=A  
    - *Profile*: Ignores indexical info (e.g., 50% in God’s coin flip).  
  - **Deflationary (D)**: ≥3 "D" or "I don’t know" answers (any questions).  
    - *Profile*: Skeptical of anthropic probabilities; may mix answers.  
  - **Incoherent/Undefended**:  
    - Q1=A but Q2=A/B: FNC requires non-indexicality (Q1=A), so Q2=A/B breaks consistency.  
    - Q4=A but Q5=B/C: Thirders (Sleeping Beauty) must say Q5=A (1/2 on Monday).  

  #### **Boundaries and Ambiguities**  
  - SSA and SIA **cannot be separated** when observer counts match (e.g., Q4, Q5).  
  - SIA and FNC **overlap in practice** on some bets (Q6) but diverge on observer-count updates (Q1, Q2).  
  - Q8 is **unscored** and reserved for deflationary views.  
  - **No position** defends: Q1=C, Q3=A, or Q7=C.  

  ---

  ### **How to Use**  
  1. Tally your answers.  
  2. Match to the closest pattern.  
  3. Positions are defined by consistency, not correctness. Deflationary responses are valid and explicitly included.  
  4. Ambiguities reflect real philosophical boundaries (e.g., SSA/SIA convergence in Sleeping Beauty).  

  This quiz isolates core intuitions while avoiding jargon. It’s diagnostic—not prescriptive—and highlights where positions agree or fracture. Use it to spark discussion, not to declare winners!
