  We are creating a diagnostic quiz to identify anthropic reasoning positions without using technical jargon. The positions we want to map to are:
  1. Self-Sampling Assumption (SSA): You reason as if you are a random sample from the set of all observers (or a suitable reference class).
  2. Self-Indication Assumption (SIA): You reason as if your own existence is evidence for hypotheses that make your existence more likely (i.e., you weight by the number of observers).
  3. Full Non-indexical Conditioning (FNC): You condition on all non-indexical information (i.e., everything you could in principle observe, without adding extra weight for your own existence). This is sometimes called "centered evidence" without the SIA adjustment.
  4. Deflationary (D): You think self-locating probabilities are not real or these questions have no objective answers.

  We'll design 8-10 concrete cases with answer options. We want to capture:
  - The coin flip with 1 or 10 people (to distinguish SSA and SIA).
  - A presumptuous philosopher bet (to highlight SIA).
  - A Doomsday argument variant (to see if they use their birth rank to predict the future).
  - A Sleeping Beauty variant (to see if they are consistent).

