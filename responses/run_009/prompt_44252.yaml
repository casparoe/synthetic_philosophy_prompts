prompt: |-
  One practice I find philosophically puzzling is the institutional life of modern cryptography, and I would like an analysis of what it presupposes. Consider the following, all of which is common ground in the field. Government standards bodies publish encryption standards whose security rests on unproved mathematical conjectures: that factoring large integers is intractable in practice, or that certain lattice problems admit no efficient algorithm. Security agencies have set binding timetables for migrating public infrastructure to new schemes on the strength of two further conjectures at once — that large-scale quantum computers will eventually be built, and that the replacement lattice problems will withstand classical attack indefinitely. Meanwhile, the same community runs public contests with cash prizes for breaking its own assumptions, and celebrates each newly factored challenge number as progress. And the formal apparatus is telling: a modern security proof is typically a reduction — a rigorous conditional showing that breaking the scheme would solve the underlying hard problem — so the practice demands mathematical rigour for the conditional while accepting conjecture for the antecedent, and then manages that conjecture socially, through open publication and decades of failed cryptanalysis, rather than mathematically.

  Here is what I want you to do. Reconstruct the implicit epistemology of this practice. Does it presuppose platonism about arithmetic — that it is already determinately true or false, prior to anyone's proof, that an efficient factoring algorithm exists — or could it survive on a more deflationary view? Does the reliance on 'hardness' treat computational complexity classes as something like natural kinds, with polynomial-time feasibility functioning as a surrogate for a law of nature, so that the practice quietly modalises a mathematical question into a physical one? Is the confidence in unproved hardness best read as induction from a long history of failure, as something a priori about the structure of the problems, or as neither — a purely pragmatic commitment that happens to be manageable by the community's social procedures? Address the asymmetry directly: the migration timetables bet that one technological contingency (scalable quantum computers) will obtain while another (a clever classical algorithm for the lattice problems) will not, so what view of technological possibility and of our ability to foresee our own future mathematics does that wager presuppose? And say whether the apparent inconsistency is real: a community that demands proofs of correctness for algorithms while basing its entire enterprise on conjectures, and that simultaneously treats hardness as bedrock and as something expected to erode at the edges.

  Distinguish carefully between what the practice strictly presupposes and what it merely sits comfortably with, and identify where it is underdetermined — several rival philosophies of mathematics could each license it, and I want to know which parts of the practice, if any, would discriminate between them. Then close with two counterfactuals: what, if anything, in the practice would actually change if a proof of P ≠ NP arrived tomorrow (would it be any real news to the cryptographers, and if not, what does that show about what their commitment was actually to?), and what the practice reveals about itself in the scenario where the conjectures are simply never settled either way, so that cryptography goes on indefinitely resting on the difference between what is provable and what is merely unhappened. Please answer in British English.
reasoning: |-
  Okay, the user is asking about the philosophical underpinnings of modern cryptography, focusing on its reliance on unproven conjectures and how the field manages that uncertainty. They want an analysis of the implicit epistemology—what the practice presupposes about mathematical truth, computational complexity, and technological forecasting. 

  The user seems well-versed in both cryptography and philosophy, given their precise framing of the paradoxes: the rigor of security proofs versus the conjectural foundations, the simultaneous treatment of hardness assumptions as both bedrock and temporary, and the asymmetry in betting on quantum computers materializing while assuming classical attacks won’t breach lattice problems. Their frustration with the apparent inconsistency feels genuine—they’re not just curious but intellectually unsettled by it. 

  Breaking this down: First, the mathematical presuppositions. Cryptography doesn’t strictly need Platonism; even a deflationary view works since the practice only cares about the *absence of counterexamples* (failed cryptanalysis) rather than metaphysical truth. The field’s "unproven yet treated as fact" stance is pragmatic, not ontological. 

  Then, the complexity-as-natural-kind angle. Polynomial-time feasibility is indeed treated like a physical law—not because complexity classes are natural kinds, but because the practice modalizes them ("efficient means feasible in our universe"). This shifts the question from math to physics/engineering, which explains the asymmetry: quantum computing is seen as an engineering challenge (contingent but plausible), while classical attacks failing is seen as law-like stability. 

  The confidence in hardness assumptions? Neither pure induction nor a priori insight. It’s a communal bet managed by social processes (contests, standards migration) that tacitly assumes the future will resemble the past mathematically—no sudden algorithm breakthroughs. 

  On inconsistency: Demanding proofs for reductions while relying on conjectures isn’t hypocritical; it’s division of labor. Rigor for conditionals, pragmatism for antecedents. And hardness is both bedrock (for current schemes) and expected to erode (hence migration timetables)—that’s just layered contingency planning. 

  Counterfactuals: A P≠NP proof would change little because cryptographers already assume it behaviorally. But if conjectures *never* resolve? That’s the status quo extended indefinitely. The practice reveals it doesn’t need mathematical certainty—just sustained empirical failure and social consensus. 

  The user’s deeper itch might be about whether this "muddle through" epistemology is philosophically respectable. The answer is: yes, because it works by outsourcing uncertainty to communal scrutiny and time. Mathematics here is less about truth and more about a shared, adversarial game.
answer: |-
  The institutional practice of modern cryptography operates within a distinctive epistemological framework—one that deftly navigates mathematical uncertainty through a blend of conditional rigour, empirical pragmatism, and social management of conjecture. Its presuppositions can be dissected as follows:

  ### I. Mathematical Presuppositions: Platonism vs. Deflationism  
  - **Strict Presupposition**: The practice requires that mathematical statements (e.g., "Factoring integers of bit-length *n* requires superpolynomial time") possess **determinate truth values** *prior to proof*. This aligns superficially with Platonism but is compatible with deflationary views.  
  - **Compatibility**:  
    - A **deflationary formalist** could accept that the *consistency* of mathematical systems allows conjectures to function as placeholders. Cryptography treats hardness assumptions *as if* they are true—not by accessing Platonic truths, but by leveraging the empirical track record of their unrefuted status.  
    - **Underdetermined**: The practice does not discriminate between Platonism and deflationism. What it strictly demands is that *mathematical refutation is possible* (via algorithms or proofs), enabling falsification through contests. The absence of disproof sustains confidence, regardless of metaphysics.  

  ### II. Computational Hardness: Mathematical Ideal or Physical Law?  
  - **Natural Kind Analogy**: Complexity classes (e.g., **NP-hardness**) are treated as **stable, intrinsic properties** of problems—akin to natural kinds. Polynomial-time feasibility acts as a **proxy for physical realizability**, implicitly modalizing mathematics:  
    > *"No physical device (classical or quantum) can solve this problem efficiently"* becomes the operational assumption.  
  - **Presupposition**: This *conflates mathematical structure with physical constraints*. The asymmetry in migration timetables reveals this:  
    - **Quantum computing** is seen as a *technological contingency*—a foreseeable engineering hurdle.  
    - **Classical hardness** is treated as *nomological*—a "law" unlikely to be violated.  
    This wager presupposes **predictive stability in mathematical discovery**: past failures signal future resilience, while quantum threats are "known unknowns" deemed tractable.  

  ### III. Grounds for Confidence: Induction, A Priori Insight, or Pragmatism?  
  - **Neither Induction Nor Apriority**:  
    - **Induction** is insufficient: 50 years of failed factoring attempts cannot *prove* perpetual hardness.  
    - **A Priori** claims are rejected: no cryptographer asserts intuitive certainty about P vs. NP.  
  - **Pragmatic-Social Justification**: Confidence emerges from **adversarial scrutiny**—open contests, peer review, and iterative stress-testing. This social process transforms conjecture into a **manageable epistemic resource**. Hardness assumptions are "tentative baselines" ratified by *communal non-falsification*.  

  ### IV. Apparent Inconsistencies Resolved  
  1. **Proofs for Algorithms vs. Conjectural Foundations**:  
     - No inconsistency. Security proofs (reductions) are **conditional**: *"If problem X is hard, Scheme Y is secure."* Rigour is applied to the *implication*, while the antecedent’s uncertainty is managed socially.  
  2. **Hardness as Bedrock vs. Erodible**:  
     - Hardness is **contextually stable** but **historically contingent**. Migration timetables embrace this: lattice problems are "bedrock" *until* quantum computers emerge, at which point new problems (resistant to *both* classical and quantum attacks) take precedence.  

  ### V. Counterfactuals: What the Practice Reveals  
  1. **If P ≠ NP Were Proved Tomorrow**:  
     - **Minimal impact**. Cryptographers already *behave as if P ≠ NP*, and most schemes rely on stronger assumptions (e.g., factoring ∉ BQP). The proof would validate existing practice but not alter day-to-day work—revealing that their commitment is to **specific hardness assumptions** (e.g., lattice problems), not abstract complexity classes.  
  2. **If Conjectures Remain Forever Unsettled**:  
     - The practice is **designed for this scenario**. Cryptography would continue treating "unrefuted conjectures + sustained cryptanalytic effort" as **functional truth**. This reveals its core epistemology: **mathematical uncertainty is managed through perpetual adversarial testing**, not deductive closure.  

  ---

  ### Conclusion: A Hybrid Epistemology of Managed Contingency  
  Modern cryptography presupposes:  
  1. **Determinate mathematical truth values** (compatible with Platonism or deflationism),  
  2. **Computational hardness as a nomological boundary** between feasible and infeasible physical computation,  
  3. **Social processes as proxies for mathematical justification**.  

  It thrives precisely *because* it avoids metaphysical commitments, instead outsourcing epistemic validation to a communal adversarial process. The migration timetables and public contests embody a wager that:  
  - **Technological evolution** (quantum computing) is predictable enough to plan for,  
  - **Mathematical discovery** (classical algorithms) is sufficiently constrained by history to bet against breakthroughs.  

  This practice is not inconsistent but *strategically bifurcated*: rigour for conditionals, pragmatism for antecedents, and social consensus for uncertainty. Its resilience lies in treating mathematics not as a static edifice but as a dynamic, contested terrain—one where "truth" is operationalised through sustained, organised doubt.
