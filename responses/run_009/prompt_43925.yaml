answer: |-
  *(Leans forward, tone urgent but respectful)*  
  "Your data’s fair context, but *which* reference class? Those were largely tokamak projects chasing incremental gains. We’re leveraging new superconducting tapes and AI-driven plasma stability that simply didn’t exist in the 90s. Base rates anchor us, but they’re not destiny—remember how skeptics dismissed private rocketry before SpaceX? What *should* convince you? Two things: our peer-reviewed magnet performance at 20 Tesla, and that our demo last month sustained confinement 5x longer than required for net gain. If we replicate that at scale next year—which our models say we will—isn’t that evidence the class has meaningfully shifted?"

  *(Holds your gaze, waiting for your counter)*  

