prompt: |-
  our reading group just wrapped up Principia Ethica and I'm putting together a little zine to close out the semester. I want a poem out of Moore's two worlds thing from the chapter on the ideal — you know, the bit where he asks whether a world stuffed with beautiful things but with nobody in it to see them is better than an ugly, foul world that's populated. I want the form to do the work of the thought experiment: two stanzas that are structurally identical — same line count, same syntax, same shape — with only the aesthetic vocabulary swapped out, so the reader physically feels the "everything held fixed except beauty" move. Like the second stanza is the first one wearing a worse face. Then a short coda that brings in the other thing Moore actually cared about, personal affection — his real ideal wasn't beauty on its own but friends looking at the world together, the affection and the appreciation forming one value thats more than the sum. Maybe two people in whichever world they got. No fixed meter or rhyme scheme, loose blank verse is fine, aim for 20ish lines total.

  after the poem, add a brief note on where you took liberties — especially whether the coda is leaning on the organic unities doctrine in a way Moore scholars would wince at (I know the "whole greater than parts" framing is easy to over-apply and I'm honestly not sure I'm applying it right here). and if you think I've misremembered the two-worlds comparison, or you think the "second stanza as corrupted first" structure can't actually carry the intuition and just reads as a gimmick, tell me that plainly instead of writing a polite poem — I'd rather fix the zine than print something clever but wrong. one more thing: don't just name-drop Moore, the poem should be recognizable as *his* argument to someone who knows him, and just a decent poem to someone who doesn't.
