   The game runs in rounds. Each round, each group (or individual within the group, depending on design) makes a move. The groups have different rules:

   1. Darwinian creatures:
      - They must commit to a full path (sequence of moves) in advance, without any feedback during planning.
      - After all paths are submitted, the environment (the grid) is revealed, and any path that hits an obstacle is eliminated (the creature dies).
      - The surviving creatures reproduce (with mutations) for the next round.
      - Note: To keep eliminated players engaged, they become the "environment" (see below).

   2. Skinnerian creatures:
      - They move step by step. At each step, they choose a direction (e.g., up, down, left, right).
      - After each step, they get feedback: if they hit an obstacle, they lose a life (or get a penalty) and are reset to start (or the previous safe position) but continue playing. If they reach the goal, they get a reward (points).
      - They learn only from the consequences of their own actions.

   3. Popperian creatures:
      - Before each move, they can simulate one step (i.e., they are told what would happen if they moved in a particular direction without actually moving). They can use this to avoid bad moves.
      - However, they have a limited number of simulations per round (or per game) to prevent it from being too easy.

   4. Gregorian creatures:
      - They are given a tool: a partial map (with some fixed known obstacles) and/or the ability to write down and share information within their group.
