prompt: |-
  Six weeks ago I was appointed to my town's public works and safety committee, a body I had never given a moment's thought to before, and I have discovered that nearly every dispute that reaches us is at bottom a dispute about the precautionary principle — though not one of my colleagues ever calls it that. Residents invoke it when it suits them and forget it the moment it cuts against them, and I have caught myself doing the same. Rather than continue on impressions, I have tried to record my actual verdicts on the cases we have faced and to find the rule behind them. Here is what I have so far.

  The utility proposed trialing a new corrosion-control additive in the drinking water. There is no evidence of harm, only the absence of long-term studies, and meanwhile our ageing pipes are leaching lead into the water right now — every month of delay is a month of known exposure. I voted to wait for further toxicology anyway. It felt obviously right at the time, and still does, even though on any simple reading the known harm was on the side of acting.

  The school district proposed replacing its diesel bus fleet with electric buses, and a group of residents objected, citing battery fires. I thought we should approve immediately: the fire risk struck me as a bare possibility, not worth prolonging children's daily exposure to diesel exhaust. Structurally, this case looks identical to the first — a new technology, an uncertain risk, a harmful status quo — and I gave the opposite verdict without hesitation.

  A telecom carrier wants to place a small tower four hundred metres from my daughter's elementary school, and a parents' group demands it be denied pending studies of health effects. I found the demand illegitimate, and I note that I hold this view with some feeling, since the case concerns my own child. Yet it rests on the same epistemic basis as my first verdict: unknown effects of something new.

  The lake association asked to treat an invasive weed with a species-specific herbicide before it spreads further through the shallows. Waiting has costs of its own — the weed does not wait — and I said treat now, monitor closely. Precaution on the side of action, apparently.

  Finally, a member asked that the summer fireworks festival be postponed pending a study of its effect on migrating birds. I thought that was perfectly reasonable: a small burden on the organizer, so why not ask. Yet I bristle at the parents' tower demand, which asks for exactly the same kind of study-before-permit.

  My tentative principle is something like this: where an intervention carries a possibility of serious and irreversible harm, hold off until there is reasonable evidence of safety, unless holding off perpetuates a comparable harm. But I can see this principle does not fit me. The escape clause decides the water case against my own verdict, since lead exposure is surely a comparable harm; and the herbicide case, which the clause should also push toward immediate action, I did decide that way, while in the chemically identical-in-structure water case I did not. So either my principle is wrong, my verdicts are, or the relevant difference between the cases is something I have not yet named — perhaps who bears the risk, or whether the feared harm has a plausible mechanism (the tower fears have none, the chemical fears arguably do), or whether the proposed study is cheap to demand.

  What I would like from you, then, is this. State, as precisely as you can, the principle or small set of candidate principles that best captures these verdicts, with the case that motivates each clause. Tell me what the best principle predicts for two cases now pending before us: whether to remove the derelict dam on the creek, which blocks fish passage but whose removal might stir up sediment-bound contaminants downstream; and whether to permit a company to pilot sidewalk delivery robots in the town centre. And be honest with me about which of my verdicts your principle cannot accommodate — I want to know not only which ones it overturns, but whether the ones it overturns are ones I should be glad to lose.
reasoning: |-
  Okay, let me start by really understanding what this user is asking. They’re on a public works committee and noticed that every dispute comes down to the precautionary principle, but no one calls it that. They’ve recorded their own verdicts on several cases and are struggling to find a consistent principle behind them. Now they want me to help formulate a principle that fits their decisions, apply it to new cases, and point out where their past verdicts might be inconsistent.

  First, I need to go through each case they mentioned and note their decision. For the water additive, they voted to wait despite the known harm of lead. For the electric buses, they approved immediately, dismissing battery fire risks. The telecom tower near their kid's school—denied the parents' demand for studies. The herbicide for invasive weeds—approved action. Fireworks for birds—supported postponing for a study. 

  Hmm, there's a pattern here. Sometimes they lean towards precaution (water additive, fireworks), other times against (buses, tower, herbicide). The user’s own tentative principle includes an exception for ongoing harm, but it doesn’t hold because in the water case, lead exposure is ongoing yet they still chose caution. So why the inconsistency?

  Looking deeper, maybe the key differences are in the nature of the risks. For the water additive, the harm is chemical, systemic, and affects everyone. The herbicide is similar but they approved it—but here the harm from inaction (weed spreading) is immediate and ecological. The buses and tower involve technological risks; they dismissed the tower concerns partly because the mechanism isn’t plausible. Fireworks affecting birds is environmental, with a plausible mechanism, and postponing is low-cost.

  Also, the user admits personal bias in the tower case since it involves their child. That’s a big clue—emotional involvement might sway decisions even when the epistemic basis is similar to other cases. But they still want a principle that rationalizes their verdicts.

  So possible factors: plausibility of harm mechanism, cost of delay, who bears the risk, reversibility. The herbicide and bus cases have clear, present harms from inaction, while the water additive’s harm is known but the new risk feels scarier because it’s systemic and irreversible. The tower risk seems implausible, so no action needed. Fireworks—low cost to study, plausible harm to birds.

  Now, structuring a principle that fits. The core could be evaluating risks along dimensions: plausibility, severity, reversibility, cost of waiting, and alternative harms. Also, the burden of proof might shift based on these. For example, if the feared harm lacks a plausible mechanism (like the tower), no need for studies. If inaction causes immediate harm (buses, herbicide), act now. If the study is cheap and harm plausible (fireworks), do it.

  Applying this to the dam removal: sediment contaminants might be irreversible, but blocking fish is ongoing. If contaminants are bound and disturbance low, removal might be okay. But if contaminants are toxic and mobile, precaution might say wait. The robots: novel tech, but fire risk plausible? If sidewalks are crowded, high severity. Low cost to study, so maybe require a pilot or mitigations.

  Where does their principle clash? The water additive verdict is inconsistent because ongoing lead harm is comparable, yet they voted to wait. My principle would overturn that, urging action. They might be glad to lose that verdict because delaying causes real harm. The tower case they dismissed fits, as the risk wasn’t plausible. Fireworks delay is consistent due to low cost and plausibility.

  Honesty check: yes, the water case is the one that doesn’t fit, and overturning it might be better for public health. The tower case, despite personal feelings, aligns with the principle because the mechanism wasn’t credible. So the user should examine why they were overly cautious with the water additive—maybe the unknown felt scarier than the known, which is a cognitive bias.

  In summary, the principle needs to balance multiple factors explicitly, reducing emotional or situational bias. Applying it to new cases requires assessing each dimension. The user’s inconsistency in the water case highlights where emotion overruled logic, and correcting that could lead to better decisions.
answer: |-
  Based on your detailed case judgments, I propose the following principle, structured around key differentiating factors your verdicts reveal:

  **The Precautionary Decision Principle:**

  > **1. Assess Plausibility:** If the feared harm lacks a plausible biological/ecological mechanism *or* is demonstrably less severe than the status quo harm, reject precautionary delay and permit action.
  >    *   *Motivated by:* Telecom Tower (no plausible biological mechanism for harm at that distance/power), Electric Buses (diesel exhaust harm is severe, documented, and immediate; battery fire risk plausible but statistically far lower severity/occurrence than daily exhaust exposure).
  >
  > **2. Weigh the Costs of Waiting:** If delaying action perpetuates a known, significant, and ongoing harm, reject precautionary delay unless the new intervention's *plausible* risks are catastrophic and irreversible.
  >    *   *Motivated by:* Herbicide (inaction allows irreversible ecological damage; herbicide risk is targeted and monitorable), Electric Buses (daily harm to children continues), Dam Removal? (inaction perpetuates harm to fish populations).
  >
  > **3. Consider Burden & Reversibility:** If demanding study imposes minimal burden/cost/delay on the proponent *and* the feared harm (if real) would be difficult to reverse, support limited precautionary delay for targeted study/monitoring.
  >    *   *Motivated by:* Fireworks (postponing 1 year is low burden; bird disruption, if significant, could be avoided/reduced in future years), Robots? (pilot program with monitoring is low burden).
  >
  > **4. Default to Precaution for Systemic Novelty:** For introducing novel substances/energy into core human/ecological systems (e.g., water, air) with uncertain long-term effects *and* plausible pathways for harm, apply precautionary delay for further study, *unless* Clause 2 overwhelmingly applies.
  >    *   *Motivated by:* Water Additive (systemic exposure route, long-term uncertainty, plausible chemical harm pathways exist), Herbicide (Clause 2 overrode systemic concern).

  **Applying the Principle to Pending Cases:**

  1.  **Derelict Dam Removal:**
      *   **Clause 2 (Cost of Waiting):** Inaction perpetuates known, significant harm (blocked fish passage, degraded ecosystem).
      *   **Clause 4 (Systemic Novelty):** Removal might disturb sediments, but this is a *release* of existing contaminants, not introducing a *novel* systemic substance. The "novelty" is the disturbance mechanism, not the contaminant itself.
      *   **Clause 1 (Plausibility/Severity):** Harm from disturbed sediments is plausible and potentially significant (ecological damage, water quality impact). However, the *severity* needs comparing: Is the potential sediment release impact likely worse than the *certain, ongoing* harm of the blocked ecosystem? Probably not, especially if mitigation (e.g., phased removal, sediment traps) is possible.
      *   **Clause 3 (Burden/Reversibility):** Studying sediment load/distribution pre-removal is feasible and imposes moderate burden/cost. Harm from released contaminants might be difficult to reverse downstream.
      *   **Prediction:** The principle leans strongly towards **removal** due to Clause 2 (ongoing harm). However, Clause 3 suggests **mandating a pre-removal sediment study and phased removal/mitigation plan** as a reasonable precaution given plausibility and irreversibility concerns. *Delay for multi-year health studies on contaminants likely rejected (Clause 1 - contaminants are existing/known, not novel; Clause 2 - cost of waiting high).*

  2.  **Sidewalk Delivery Robots:**
      *   **Clause 1 (Plausibility/Severity):** Hazards (tripping, malfunction causing injury, fire) are plausible. Severity of potential harm (pedestrian injury) is significant. Compare to status quo: Delivery trucks causing congestion/emissions? Likely less direct/immediate pedestrian risk than robots mixing closely with crowds? Requires analysis.
      *   **Clause 4 (Systemic Novelty):** Introducing autonomous machines into dense pedestrian spaces is novel, but not a *chemical/biological* systemic exposure. The "system" is pedestrian traffic flow/safety.
      *   **Clause 3 (Burden/Reversibility):** A limited, monitored pilot imposes a low-moderate burden. Harm from an incident might be localized but severe (injury). Pilot allows quick reversal/shutdown.
      *   **Clause 2 (Cost of Waiting):** Inaction avoids a *new* risk but doesn't stop an existing significant harm (unless delivery congestion is deemed a major current harm, which is unlikely to outweigh potential robot risks).
      *   **Prediction:** The principle supports **approving a tightly controlled pilot program** (Clause 3 - low burden, enables monitoring/reversal) rather than outright denial or indefinite delay. **Mandate specific safety features (speed limits, geofencing, clear signaling, remote monitoring, safety operator requirement), robust insurance, and a sunset clause with mandatory safety review before full approval.** Reject demands for extensive *pre-pilot* studies of highly speculative harms (e.g., long-term AI implications - implausible for a pilot).

  **Honest Assessment of Fit with Your Past Verdicts:**

  *   **Accommodated Well:**
      *   **Electric Buses (Approved):** Clause 1 (Diesel harm worse & proven), Clause 2 (Daily harm continues).
      *   **Telecom Tower (Denied Delay):** Clause 1 (No plausible mechanism for harm).
      *   **Herbicide (Approved):** Clause 2 (Ecological harm ongoing & significant), Clause 1 (Targeted herbicide risk plausibly lower severity than uncontrolled spread).
      *   **Fireworks (Delay Supported):** Clause 3 (Low burden to delay, potential irreversible disruption to migration).

  *   **Overturned Verdict & Why You Should Be Glad:**
      *   **Water Additive (Wait Verdict Overturned):** The principle (Clause 2 strongly, Clause 1 weakly) would urge **approving the trial with monitoring**. Your verdict prioritized the low-plausibility/unknown risk (Clause 4) over the *known, significant, ongoing harm* of lead exposure (Clause 2). This is the core inconsistency with your bus/herbicide decisions. You *should* be glad to lose this verdict. Every month of delay inflicted documented harm (lead exposure) to avoid undocumented, purely theoretical harm. The principle corrects this by forcing a rigorous comparison: Is the *plausible worst-case* of the new additive truly worse than the *certain, quantified harm* of the status quo? Here, likely not. Monitoring during the trial manages residual uncertainty.

  *   **Potential Tension (But Defensible):**
      *   **Telecom Tower vs. Fireworks:** You bristled at the tower study demand but accepted it for fireworks. The principle justifies this via Clause 1 (Tower fear lacks plausibility; Fireworks disruption is plausible) and Clause 3 (Tower study demand imposes high burden/delay on infrastructure; Fireworks delay is low burden). Your feeling about your child is understandable, but the principle provides objective grounds for the different outcomes. It suggests your tower verdict was correct on the merits, not just bias.

  **The Core Insight:** Your decisions hinge on comparing the *quality* (plausibility, severity, irreversibility) and *immediacy* of the *avoided* harm (from action) versus the *perpetuated* harm (from inaction/delay). The "chemically identical" water and herbicide cases differ crucially: the harm from herbicide *inaction* (irreversible ecological damage) was vivid and immediate, while the lead harm, though severe, may have felt like an accepted background risk. The principle forces explicit comparison, protecting against both reckless innovation and harmful inertia rooted in fear of the unknown. It treats precaution as a scalpel, not a blanket.
