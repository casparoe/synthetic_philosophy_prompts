answer: |-
  ## Evaluating "Collapse" in Scenario Briefs

  **The idea in one paragraph:**
  "Collapse" should only be used when a society experienced a rapid, widespread, and fundamental discontinuity *felt by its people* as the ending of their core institutions and way of life. Our test asks: would the survivors themselves, looking back, say their world definitively ended, not just changed? If not, "collapse" is likely misleading and requires rewriting.

  **The Procedure:**

  1.  **Define the Subject:** *What specific entity is claimed to be collapsing?*
      *   Identify the specific entity named (e.g., "The Maya civilization," "Roman administration in Britain," "Easter Island society").
      *   *Output:* Clarify the subject in the draft. If vague (e.g., just "society collapsed"), flag for rewrite: "Specify *what* entity is collapsing (e.g., central governance, urban life, population)."

  2.  **Pinpoint the Change:** *What specific institutions, structures, or ways of life does the draft claim ended?*
      *   List the key elements the brief states ceased or fundamentally changed (e.g., "centralized kingship," "imperial tax collection," "monumental statue carving").
      *   *Output:* Ensure the claimed changes are explicit in the draft. If implied but not stated, flag: "Specify *what* collapsed (e.g., political structures, economic systems)."

  3.  **Assess Rate of Change:** *Was the core change relatively abrupt (within 1-2 generations) or very gradual?*
      *   Using standard textbook accounts, note the timeframe for the key changes identified in Step 2. Look for events like major battles, rapid depopulation, sudden abandonment of key sites, or swift institutional failure.
      *   *Output:* If the core changes demonstrably unfolded over many centuries (e.g., >150 years), mark: "Change appears gradual; 'decline,' 'transformation,' or 'reorganization' likely more accurate than 'collapse.' Rewrite." If abrupt or rapid (e.g., <50-100 years), proceed. If ambiguous, proceed but note for Step 7.

  4.  **Assess Scale of Change:** *Was the change geographically widespread and affected a large portion of the population?*
      *   Using standard accounts, check if the changes identified affected the core areas of the subject entity broadly and impacted significant population segments, not just elites or specific regions.
      *   *Output:* If change was highly localized or primarily affected only a small elite class, mark: "Change appears limited in scale; 'crisis,' 'downfall (of elites),' or 'local disruption' likely more accurate. Rewrite." If widespread and societal, proceed. If ambiguous, proceed but note for Step 7.

  5.  **Apply the Obituary Test (Survivor Perspective):** *Would a significant portion of the survivors, looking back after ~1 generation, have said their core way of life and world definitively *ended*?*
      *   *Key Question:* Based on standard historical/archaeological narratives (e.g., evidence from texts, settlement patterns, material culture changes), did the people experience the change as a catastrophic *end* of their fundamental institutions, identity, and daily reality, not just a difficult transition or shift?
      *   *Consider:* Loss of core identity (e.g., "We are no longer Romans/Britons"), abandonment of defining practices (e.g., monumental building, key rituals), severe rupture in social/political order, widespread perception of catastrophe in surviving records. Did life for most people *fundamentally* reset?
      *   *Output:*
          *   **Pass:** Clear evidence (even if inferred from material record) that survivors experienced a profound break and loss of core identity/way of life. Proceed to Step 6.
          *   **Fail:** Evidence suggests significant continuity for large populations, adaptation without perceived "end," reorganization under new structures, or survival of core cultural identity/practices despite political change. Mark: "Obituary Test FAILED. Survivor perspective suggests transformation/reorganization, not collapse. Rewrite using terms like 'major transformation,' 'reorganization,' or 'end of an era.'"
          *   **Ambiguous/Mixed:** Evidence conflicts (e.g., elites devastated, peasants saw little change; some regions collapsed, others transformed). Mark: "Handoff to Senior Editor. Obituary Test inconclusive; judgment call needed on interpreting survivor experience and weighting perspectives." *Include brief summary of conflicting evidence.*

  6.  **Confirm Duration:** *Did the discontinuity last? Or was it a temporary setback quickly overcome?*
      *   Check if the "collapsed" state was relatively enduring (e.g., centuries) or if the core elements identified in Step 2 were substantially rebuilt/replaced within a generation or two.
      *   *Output:* If core elements were rapidly rebuilt/replaced within ~50 years, mark: "Change appears temporary; 'crisis' or 'major disruption' likely more accurate than 'collapse.' Rewrite." If the discontinuity endured for a significant time (e.g., >100 years), the term "collapse" *may* be justified (pending Step 7). If ambiguous, proceed.

  7.  **Synthesize & Final Check:**
      *   Review outputs from Steps 3-6. Consider any ambiguities noted.
      *   *Output:*
          *   If Steps 3, 4, or 6 yielded a definite "Rewrite," follow that instruction.
          *   If Step 5 yielded "FAIL," rewrite.
          *   If Step 5 yielded "Handoff," flag for senior editor with summary.
          *   **Only** if Steps 3, 4, and 6 *did not* require a rewrite, *and* Step 5 yielded a clear "Pass," *then* the term "collapse" is provisionally justified. *However, add:* "Note: 'Collapse' is a strong term. Consider if 'catastrophic transformation,' 'systemic failure,' or 'civilizational rupture' might be more precise or less loaded, depending on context."

  **Three Worked Cases:**

  1.  **The Maya Lowlands (Terminal Classic, ~800-900 CE):**
      *   *Subject:* Classic Maya lowland polities/civilization (centered on divine kingship, monumental cities).
      *   *Claimed Change:* End of divine kingship, abandonment of major ceremonial centers, decline of monumental construction and inscribed monuments.
      *   *Rate:* Relatively rapid in core southern lowlands (within ~100 years).
      *   *Scale:* Widespread across the southern lowland heartland; affected elite culture profoundly.
      *   *Obituary Test:* **Pass?** The survivors (or their children) in the abandoned southern heartland cities saw the *complete end* of the institution of divine kingship, the abandonment of their sacred urban centers, and the cessation of the stela cult defining elite political and religious life. While populations persisted and adapted elsewhere (e.g., northern Yucatan), the core political structure and elite cultural identity of the Classic Maya world *did end* for populations in the southern lowlands. They experienced a discontinuity – their world *as they knew it* collapsed. (*Contradicts your instinct*)
      *   *Duration:* Enduring. The Classic political system and its associated elite culture were never reconstituted in the southern lowlands.
      *   *Procedure Verdict:* **Pass.** "Collapse" is justifiable *for the specific political system and elite cultural complex in the southern lowlands* (be specific!). However, emphasizing "transformation" for the broader Maya people is also valid. The brief must clearly define *what* collapsed.

  2.  **End of Roman Britain (Early 5th Century CE):**
      *   *Subject:* Roman provincial administration and urban/economic system in Britain.
      *   *Claimed Change:* Withdrawal of Roman legions and administrators, collapse of centralized tax collection, money economy, large-scale trade, and maintenance of Roman towns/villas.
      *   *Rate:* Abrupt (within a generation or two after 410 CE).
      *   *Scale:* Widespread, affecting urban life, economy, and elite structures across the former province.
      *   *Obituary Test:* **Ambiguous/Mixed.** For the Romano-British elite and urban populations reliant on the imperial system, the loss of security, coinage, markets, and administrative structure likely felt like a catastrophic end ("We are no longer part of Rome"). For many rural peasants, life may have continued with less disruption ("The tax collector stopped coming"). Identity likely fractured.
      *   *Duration:* Enduring. The Roman system was never restored.
      *   *Procedure Verdict:* **Handoff to Senior Editor.** The Obituary Test is mixed. Judgment needed: Does the brief emphasize the perspective of the urban elite/administrative class (where collapse is clearer) or the broader population (more continuity)? The term "collapse of Roman administration/urban life" is likely safer than "societal collapse."

  3.  **Easter Island (Rapa Nui) after European Contact (Mainly 18th-19th C):**
      *   *Subject:* Rapa Nui society (pre-contact: complex clan-based society, monumental statue (moai) culture).
      *   *Claimed Change:* Devastating population decline, collapse of the moai cult and clan-based social structure, cultural disintegration.
      *   *Rate:* Abrupt *after* contact (disease, slave raiding, social disruption within decades).
      *   *Scale:* Catastrophic population loss (>80% within a century), widespread societal disruption.
      *   *Obituary Test:* **Pass.** Survivors experienced an absolute catastrophe: the near-total destruction of their population, the violent suppression of their religion and social order, and the forced abandonment of core cultural practices (like moai carving/erection). They would unequivocally recognize their world had ended.
      *   *Duration:* Enduring. Pre-contact society was utterly destroyed.
      *   *Procedure Verdict:* **Pass.** "Collapse" is strongly justified for Rapa Nui society *as it existed pre-contact*.

  **Where a Human Has to Decide (Judgment Dressed as Process):**

  1.  **Interpreting the "Survivor Perspective" (Step 5):** Weighing often fragmentary or indirect evidence (archaeology, later texts) to judge if people *felt* a discontinuity. This requires judgment about whose perspective matters most and interpreting "core way of life."
  2.  **Defining "Core Way of Life" (Steps 2 & 5):** Deciding what institutions/structures define the entity's core. Is it political elites? Religious practices? Daily subsistence?
  3.  **Weighting Conflicting Evidence (Step 5 Output: Ambiguous):** Deciding whether elite experience or peasant continuity is more significant to the brief's argument when the record conflicts.
  4.  **Assessing "Abrupt" vs. "Gradual" (Step 3):** Defining the threshold when change becomes rapid enough to qualify (50 vs. 100 years?).
  5.  **Final Term Choice (Step 7):** Even if "collapse" passes the test, judging if a less loaded term ("rupture," "systemic failure") might better serve the brief's clarity and avoid unintended connotations.

  **What This Procedure Can't Do:**

  This procedure cannot eliminate the inherent subjectivity in interpreting history, especially pre-modern societies with limited records. It relies heavily on "standard textbook stories," which may oversimplify or be contested. It struggles with very long-term, multi-causal declines where "collapse" feels intuitively descriptive but fails the abruptness or survivor-perspective tests. It cannot resolve deep scholarly debates; it provides a pragmatic filter based on defined criteria. Most importantly, it cannot guarantee that using "collapse," even when justified by the test, won't be misinterpreted by downstream readers who bring their own assumptions to the word. Its primary value is forcing clarity about *what* changed, *how* it changed, and crucially, *how it was experienced*, thereby reducing the most egregious misuses.
