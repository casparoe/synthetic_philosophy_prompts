prompt: |-
  A member of my ethics reading group has an argument that he claims reduces consequentialism to silence about everyday choices, and a week of arguing with him has left me unable to say exactly where it slips. It runs:

  (1) For a consequentialist, whether an act is permissible depends only on the comparative value of its total consequences, however far in the future those consequences fall.
  (2) For ordinary acts — a donation to malaria relief, a career switch, telling a hard truth to a friend — the effects we can actually discern run out after a few years; beyond that, any act can be traced to arbitrarily large goods and arbitrarily large harms, and nothing in our evidence marks one act's causal future as better than another's.
  (3) When our evidence about the value of two acts' consequences is symmetric in this way, the expected difference in value between them is zero.
  (4) So for ordinary acts the expected difference in value is zero, and there is no consequentialist reason to prefer one to another: none to give rather than keep, none to tell the hard truth rather than the kind one.
  (5) A theory of right and wrong on which we have no reason to prefer telling a friend a hard truth over flattering him is not a viable theory.
  (6) So consequentialism is not a viable theory of right and wrong.

  I feel the trouble is between (2) and (3): "we cannot tell which future is better" and "the expected difference is zero" are not the same claim, and I suspect (3) converts an epistemic blank into a substantive assignment of zero. But I cannot see how to reject (3) without simply asserting that our evidence is asymmetric wherever it matters, which looks question-begging. The friend who proposed the argument says it is valid and that the real exit is (2): he thinks we can discern more than the argument allows, at least for some acts. I don't find that convincing for acts with long shadows.

  Where does the argument go wrong? Commit to one diagnosis rather than surveying the exits: name the step or inference that fails, say whether the failure is a false premise or an equivocation, and defend your rejection against the strongest version of that step. Then price it: if the consequentialist blocks the argument where you say, what is she giving up, and does what remains still count as consequentialism? And if you think the argument in fact succeeds, say that plainly and tell me what accepting (6) forces on us.
reasoning: |-
  We are given an argument against consequentialism and asked to diagnose where it goes wrong. The argument is:

  (1) For a consequentialist, whether an act is permissible depends only on the comparative value of its total consequences, however far in the future those consequences fall.

  (2) For ordinary acts, the effects we can discern run out after a few years; beyond that, any act can be traced to arbitrarily large goods and arbitrarily large harms, and our evidence does not mark one act's causal future as better than another's.

  (3) When our evidence about the value of two acts' consequences is symmetric, the expected difference in value between them is zero.

  (4) Therefore, for ordinary acts the expected difference in value is zero, so there is no consequentialist reason to prefer one to another.

  (5) A theory that yields no reason to prefer telling a hard truth over flattery is not viable.

  (6) Therefore, consequentialism is not viable.

  The user feels the trouble is between (2) and (3) and suspects that (3) converts an epistemic blank into a substantive assignment of zero. The friend who proposed the argument thinks the exit is at (2) and that we can discern more than the argument allows.

  I will argue that the argument fails at step (3). Specifically, I will claim that (3) is false because it misapplies the principle of indifference or symmetry in a context where it is not warranted. The problem is that the symmetry in our evidence does not necessarily imply that the expected difference in value is zero. This is because the set of possible long-term consequences is unbounded and we cannot assign a uniform probability distribution over an unbounded space. Moreover, even if we could, the expected value might not converge to a finite number, let alone zero.

  Let me break down the rejection of (3):

  **Step (3) is false: Symmetric evidence does not imply zero expected difference in value.**

  The argument in (3) seems to rely on a principle of indifference: if we have no reason to think one outcome is more likely than another, then we assign equal probabilities and thus the expected difference is zero. However, when the space of possibilities is infinite and unbounded, this principle leads to paradoxes and is generally rejected.

  In the context of the long-term consequences of an act, the consequences are potentially infinite in time and magnitude. The argument in (2) says that beyond a few years, any act can be traced to arbitrarily large goods and arbitrarily large harms. This means that the consequences are not only unknown but also potentially unbounded in both positive and negative directions.

  Now, when we try to compute an expected value over an unbounded set of possibilities, we run into problems. For example, suppose we consider the set of possible long-term consequences for act A and act B. We might imagine two scenarios:

  - The set of possible consequences for each act has a symmetric distribution around zero in terms of net value? But why assume that? The argument in (2) only says that we can trace the act to arbitrarily large goods and arbitrarily large harms. It does not say that the distribution is symmetric. In fact, it might be that for a particular act, the distribution of long-term consequences is skewed. But even if we assume symmetry, we cannot assign a uniform probability over an unbounded set because that would lead to an improper prior.

  Moreover, the expected value of an act is the integral of the value of each possible outcome multiplied by its probability. If the distribution of possible outcomes is such that the integral does not converge (for example, if the tails are too heavy), then the expected value may be undefined. In such a case, we cannot say that the expected difference is zero. It might be that we cannot compute an expected value at all.

  Therefore, step (3) is making an unwarranted leap: from symmetric evidence (which we might interpret as having no information to break the symmetry) to an expected difference of zero. But without a proper probability distribution, we cannot compute an expected value. And even if we could, the symmetry in evidence does not necessarily imply a symmetric distribution that leads to zero expected difference.

  In fact, the consequentialist might argue that we should not assign equal probabilities to every possible long-term outcome. Our evidence might not be symmetric in the way the argument assumes. For instance, we might have background knowledge that the world is structured in a way that certain types of acts tend to have certain types of long-term effects. But even if we set that aside and grant that our evidence is symmetric, the move to zero expected difference is invalid.

  **Defense against the strongest version of step (3):**

  The strongest defense of (3) would be to insist that in the absence of any evidence to break symmetry, the rational thing to do is to assign equal probabilities and thus the expected difference is zero. However, this is exactly the principle of indifference. The problem is that the principle of indifference is notoriously problematic when applied to continuous or unbounded spaces. We can parameterize the space of long-term consequences in multiple ways, and each parameterization can yield a different probability distribution. Without a natural parameterization, we cannot apply the principle of indifference.

  Moreover, the set of possible consequences is so vast that we cannot even enumerate it. We are forced to use some prior. But the prior that assigns equal probability to every possible outcome is not a proper probability distribution. Therefore, the expected value calculation is not well-defined.

  Hence, step (3) fails because it requires a probability distribution that we do not have and that we cannot construct in a non-arbitrary way. The consequentialist can reject (3) by saying that we simply do not have enough information to compute the expected value of the long-term consequences, so we must rely on the short-term consequences or use a different decision rule.

  **What the consequentialist gives up:**

  By rejecting (3), the consequentialist is giving up the idea that we can always compute an expected value for the total consequences. This means that in practice, consequentialism must rely on a decision procedure that is more limited. For instance, the consequentialist might say that we should maximize expected value based on the consequences we can reasonably foresee. This is often called "expectational consequentialism" and it is a common response to epistemic limitations.

  Alternatively, the consequentialist might adopt a satisficing approach or a rule-based approach that is derived from consequentialist considerations (rule consequentialism). But note that the argument targets consequentialism in its direct, act-utilitarian form. So if we accept that we cannot compute the total expected value, then we must use a proxy.

  Does what remains still count as consequentialism? Yes, because the fundamental commitment is that the rightness of an act is determined by the goodness of its consequences. We are simply acknowledging that we must use the best available evidence to estimate that goodness. We are not abandoning the idea that consequences are what matter; we are only acknowledging the limitations in our ability to predict them.

  **Conclusion on the argument:**

  The argument fails at step (3). The premise (3) is false because symmetric evidence does not imply that the expected difference in value is zero when the space of possibilities is unbounded and we lack a proper probability distribution. The consequentialist can block the argument by rejecting (3) and then adopting a decision procedure that focuses on the foreseeable consequences.

  Therefore, the argument does not succeed. Consequentialism remains viable, but it must be understood as requiring practical decision procedures that account for our epistemic limitations.

  **Final note: If the argument succeeded?**

  If the argument succeeded, then we would have to accept (6) and conclude that consequentialism is not a viable theory. We would then have to look for an alternative ethical theory, such as deontology or virtue ethics, that does not rely solely on consequences. However, since I have argued that the argument fails at step (3), we are not forced into this conclusion.
answer: |-
  The argument fails at step (3). Premise (3) is false: symmetric evidence about the value of two acts' consequences does not entail that the expected difference in value is zero. This misstep is critical and stems from a flawed application of decision theory under uncertainty. I'll defend this rejection against the strongest counterarguments, explain what the consequentialist gives up by blocking the argument here, and clarify why what remains still counts as consequentialism.

  ### Why (3) is false: A false premise
  Step (3) claims that when evidence about the value of two acts' consequences is symmetric, the expected difference in value is zero. This assumes that symmetry in evidence implies symmetry in the probability distribution over possible outcomes, which in turn implies an expected value difference of zero. But this is incorrect for three reasons:

  1. **Unbounded outcome spaces violate the principle of indifference**:  
     The argument relies on an intuitive "principle of indifference" (if evidence is symmetric, assign equal probabilities). However, this principle breaks down when the outcome space is unbounded—which (2) explicitly grants by stating that consequences can include "arbitrarily large goods and arbitrarily large harms." In such cases, there is no unique or non-arbitrary way to assign probabilities. For example:
     - Suppose we consider the long-term consequences of donating to malaria relief versus keeping the money. The potential outcomes might include scenarios where the donation triggers a chain of events leading to immense future flourishing (e.g., a child saved invents a clean energy source) or immense catastrophe (e.g., the same child becomes a tyrant). The set of such outcomes is infinite and unbounded in value (both positive and negative).
     - Assigning a uniform probability distribution over an unbounded space is mathematically impossible—it would require probabilities that sum to infinity or fail to integrate to 1. Consequently, the expected value calculation is undefined, not zero. We cannot coherently say the expected difference is zero; we can only say it is indeterminate.

  2. **Symmetric evidence does not imply symmetric distributions**:  
     Even if we could define probabilities, symmetric evidence does not necessitate a symmetric probability distribution. Evidence might be symmetric in the sense that it doesn't favor one act over another, but the underlying causal structure of the world could still skew outcomes. For instance:
     - Background knowledge tells us that certain acts (e.g., saving a life) often lead to predictably positive ripple effects (e.g., community stability), while others (e.g., deception) often lead to erosion of trust. This isn't "question-begging"; it's a rejection of (2)'s claim that evidence is perfectly symmetric. But even granting (2)'s strict symmetry, the leap to a symmetric distribution is unwarranted. We might have a heavy-tailed distribution where extreme outcomes dominate, making expectations diverge (e.g., positive outcomes might be more probable but less extreme, or vice versa). Without a specific distribution, we cannot derive an expected difference of zero.

  3. **Expected value requires convergence, which isn't guaranteed**:  
     Expected value is defined only if the integral (or sum) over possible values converges absolutely. In an unbounded outcome space with "arbitrarily large" goods and harms, convergence may fail. For example, if the tails of the value distribution decay too slowly (e.g., power-law tails), the expectation may be infinite, undefined, or non-zero even under symmetry. Step (3) falsely assumes convergence to zero without justification.

  **Defense against the strongest version of (3)**:  
  The proponent might argue that, absent evidence, we must default to a symmetric prior (e.g., equal probabilities for symmetric outcomes). But this is precisely what decision theory rejects for unbounded spaces. In Bayesian terms, an "uninformative prior" over an unbounded set is improper (non-normalizable) and leads to paradoxes (e.g., the "water/wine paradox" in probability). The strongest defense collapses under mathematical incoherence. Even if we force a uniform prior, it would imply that all acts have infinite expected absolute value (since large-magnitude outcomes dominate), making comparisons meaningless—not zero difference. Thus, (3) is not just dubious; it's untenable.

  ### What the consequentialist gives up
  By rejecting (3), the consequentialist must abandon the idea that **expected value calculations can be straightforwardly applied to the total infinite consequences of every act**. This is a significant concession. Consequentialism, in its simplest form, evaluates acts based on their total consequences. But if we cannot compute expected values for unbounded futures, we need a practical decision procedure. The consequentialist thus shifts to **bounded rationality**: we maximize expected value based on foreseeable consequences (e.g., decades, not millennia) or use heuristics justified by long-run consequentialist reasoning (e.g., rules like "don't lie" that generally promote good outcomes).

  ### Does what remains still count as consequentialism?
  Yes. Consequentialism is defined by the claim that an act's permissibility depends solely on the value of its consequences. Blocking at (3) does not alter this core tenet; it only addresses how we handle epistemic limitations. What remains is a **moderate** or **practical consequentialism**:
  - We still aim to maximize expected value, but we focus on consequences within a tractable horizon (e.g., using discount rates for far-future effects) or rely on empirically grounded proxies (e.g., rules derived from historical patterns).
  - This is widely accepted in consequentialist thought (e.g., by Sidgwick, Smart, or contemporary "cluelessness" responders like Greaves and Ord). It doesn't collapse into deontology; the rules are instrumental, not intrinsic.

  ### If the argument succeeded
  If the argument were sound, (6) would force us to reject consequentialism outright. This would push us toward non-consequentialist theories (e.g., deontology, virtue ethics) that ground permissibility in features other than consequences (e.g., duties, character). However, since (3) fails, we avoid this outcome. The argument's failure leaves consequentialism viable, albeit with a pragmatic twist for everyday choices.
