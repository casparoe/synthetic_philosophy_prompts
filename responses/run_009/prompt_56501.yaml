prompt: |-
  I had better say who is asking. I spent a working life as an experimental physicist and have, since retiring, taken up philosophy of probability. I keep encountering the Judy Benjamin problem and its cousins: an agent with settled prior probabilities is told, not a plain fact, but a conditional — in the canonical case, that if she is in Red territory, there is a three-quarters chance she is at headquarters — and must revise on that alone. Conditioning on the material conditional gives a result everyone finds absurd, and the various repairs on offer each satisfy some intuitions and betray others. Rather than sign up with one of the schools, I want the specification written out first.

  Write the desiderata: what any rule for updating on an asserted conditional must deliver. Cover at least the following, with the case behind each: it must not raise the probability of the antecedent when only the consequent clause is being vouched for; it must agree with ordinary conditionalization whenever the testimony can be recast as a straight conditional probability or a likelihood; it must keep the speaker's reliability separable from the content of the conditional, since in the laboratory a technician's remark that if the gauge is drifting the fault is thermal is partly evidence about the gauge and partly evidence about the technician; it must give either a determinate answer or an honest interval when the assertion is qualitative ('probably', 'in most cases'); and it must not turn on an arbitrary choice among rules that fit the same constraints. Mark which requirements are non-negotiable and which are prejudices of particular camps, and say whether some subset is jointly unsatisfiable — that is the part I most want to see, since the literature appears to keep discovering one further intuition that no single rule can accommodate. Fix adequacy against this purpose: a rule good enough that a working scientist could apply it to testimony, not one that settles every dispute about conditionals. Please write in British English, and give no bibliography — I will trace the references myself.
reasoning: |-
  We are to state desiderata for a rule that updates an agent's credences upon receiving testimony in the form of a conditional statement. The canonical example is the Judy Benjamin problem: an agent (Judy) is in a territory that is divided into areas, and she has a prior over her location. She is told: "If you are in Red territory, then the probability that you are at headquarters is 3/4." We need a rule to update her credence accordingly.

  We are to list desiderata (requirements) that any such rule should satisfy. The requirements should cover the following points:

  1. It must not raise the probability of the antecedent when only the consequent clause is being vouched for.
  2. It must agree with ordinary conditionalization when the testimony can be recast as a straight conditional probability or a likelihood.
  3. It must keep the speaker's reliability separable from the content of the conditional (so that we can separately account for the reliability of the speaker and the content of what they say).
  4. It must give either a determinate answer or an honest interval when the assertion is qualitative (e.g., 'probably', 'in most cases').
  5. It must not turn on an arbitrary choice among rules that fit the same constraints.

  Additionally, we are to mark which requirements are non-negotiable and which are prejudices of particular camps, and we are to discuss whether some subset is jointly unsatisfiable.

  We are writing in British English and for the purpose of a working scientist who needs to update on testimony. We are not to provide a bibliography.

  Let us now state the desiderata:

  ---

  **Desiderata for Updating on an Asserted Conditional**

  1. **Non-Increase of Antecedent Probability (Non-Negotiable)**:  
     When the testimony vouches only for the consequent clause given the antecedent (without providing any direct evidence about the antecedent), the updated probability of the antecedent must not increase. For example, in the Judy Benjamin case, hearing "If you are in Red territory, then there's a 3/4 chance you are at headquarters" should not make Judy more confident that she is in Red territory. This is because the statement does not directly assert anything about the antecedent (being in Red territory) but only about the consequent (being at headquarters) under the supposition of the antecedent.

  2. **Agreement with Conditioning on Ordinary Information (Non-Negotiable)**:  
     If the testimony can be interpreted as providing a straightforward conditional probability (i.e., a likelihood) or as asserting a plain fact (a proposition), then the update rule must reduce to standard Bayesian conditionalization. For instance, if the testimony is "The probability of B given A is r" and we take this as a constraint that P(B|A) = r, then when r=1 (so the testimony is effectively "If A then B" with certainty) the update should be equivalent to conditioning on the material conditional A⊃B only in the case when the testimony is taken as certain and the agent fully trusts the speaker. However, note that in general, the rule should also cover cases where the testimony is uncertain (due to speaker reliability) and should reduce to conditioning on the event when the testimony is equivalent to a proposition. Also, if the testimony is a likelihood (e.g., "Given A, the chance of B is r") then the update should adjust the agent's likelihood for A accordingly.

  3. **Separability of Reliability and Content (Non-Negotiable)**:  
     The update rule must allow for the separation of the reliability of the speaker from the content of the conditional assertion. In a laboratory setting, a technician's statement "If the gauge is drifting, then the fault is thermal" provides two kinds of evidence: evidence about the state of the gauge and the fault, and evidence about the technician's knowledge or truthfulness. The rule should have parameters or a structure that allows these to be modelled separately. For example, the agent might have a prior on the technician's reliability, and the update should depend on both the content and the reliability.

  4. **Handling Qualitative Assertions (Negotiable, but Desirable)**:  
     When the testimony is qualitative (e.g., "probably B if A", or "in most cases B when A"), the rule should yield either a determinate updated probability distribution or a set of distributions (an interval) that honestly reflects the vagueness of the testimony. This requirement is important for practical application because many real-world conditionals are expressed qualitatively.

  5. **Uniqueness (or Non-Arbitrariness) (Negotiable, but Desirable)**:  
     The rule should be uniquely determined by the constraints of the problem and the desiderata. If multiple rules satisfy the other requirements, then the rule should not require an arbitrary choice among them. However, it is acceptable if the rule leaves some parameters to be set by the agent (e.g., the reliability of the speaker). This requirement is desirable to avoid ad hoc choices but may be too strong because different contexts might require different rules.

  **Discussion of Joint Satisfiability and Tensions**:

  It is widely acknowledged in the literature that no single rule satisfies all intuitions. In particular:

  - The requirement of **Non-Increase of Antecedent Probability** (Desideratum 1) is sometimes violated by rules that are otherwise natural, such as updating by minimizing Kullback-Leibler divergence subject to the constraint that P(B|A) = r (the so-called "Jeffrey conditioning" for conditional constraints). In the Judy Benjamin case, such minimization can lead to an increase in the probability of the antecedent (Red territory) which many find counterintuitive.

  - The requirement of **Agreement with Conditioning** (Desideratum 2) is non-negotiable but note that when the testimony is a conditional probability, standard conditionalization does not apply directly because we are not conditioning on an event. Instead, we are imposing a constraint on our conditional probabilities. This leads to the use of more general methods like Jeffrey conditioning or other minimum-change rules. However, when the testimony is a proposition, we do require reduction to conditionalization.

  - The **Separability of Reliability and Content** (Desideratum 3) is crucial for realistic application. However, modelling speaker reliability might require a more complex model (e.g., a hierarchical model) and might lead to a departure from simple update rules. This can be done by treating the testimony as data and using a likelihood function that depends on both the content and the reliability. This requirement may be compatible with the others if we model the testimony as evidence about the world and the speaker simultaneously.

  - The requirement of **Handling Qualitative Assertions** (Desideratum 4) might lead to indeterminacy (intervals) and thus might not give a unique posterior. This is acceptable as long as the rule provides an honest representation of the uncertainty.

  - The requirement of **Uniqueness** (Desideratum 5) is likely too strong. It is known that multiple rules (e.g., different divergence measures for minimum-change updating) can satisfy the same constraints. Moreover, in the presence of qualitative information, uniqueness might be unattainable. Hence, we may have to relax this to: the rule should be well-motivated and not arbitrary, but it might be one of a family of rules that are contextually appropriate.

  **Conclusion on Satisfiability**:

  It appears that no single rule satisfies all the desiderata simultaneously. In particular, the combination of Desiderata 1 and 2 with the requirement of minimizing change in some sense (which is often taken as a guiding principle) leads to the Judy Benjamin problem's controversy. Some rules (like the one proposed by van Fraassen) satisfy Desideratum 1 but not the minimization of Kullback-Leibler divergence, while others (like the Kullback-Leibler minimization) satisfy Desideratum 2 in a generalized sense but violate Desideratum 1.

  Therefore, for a working scientist, we recommend a rule that:

  - Explicitly models the speaker's reliability (Desideratum 3) and reduces to standard conditionalization when the speaker is fully reliable and the testimony is a proposition (Desideratum 2).
  - Does not increase the probability of the antecedent when the testimony only provides information about the consequent under the antecedent (Desideratum 1). This might require a rule that is sensitive to the structure of the testimony and avoids updating the antecedent when the testimony does not bear on it directly.
  - For qualitative assertions, uses a representation that captures the vagueness (e.g., by taking the constraint as an interval of conditional probabilities) and updates to a set of distributions (Desideratum 4).

  However, we must note that the requirement of non-increase of the antecedent (Desideratum 1) might be context-dependent. In some cases, the mere fact that the speaker chooses to utter a conditional about A and B might provide indirect evidence about A. But the desideratum as stated requires that the rule should not force an increase in the probability of A solely because of the content of the conditional (without considering pragmatic factors). Therefore, the rule should allow for such pragmatic factors to be modelled separately (via Desideratum 3) but by default not increase the antecedent probability.

  In summary, the desiderata are not jointly satisfied by any existing rule without compromise. A practical rule for a scientist might be:

  1. Model the testimony as a constraint on the conditional probability P(B|A) = r, but also model the reliability of the speaker (which might be represented by a parameter θ, the probability that the speaker is truthful and accurate).
  2. Update by treating the testimony as data and using a likelihood function that depends on the actual state of the world and θ. For instance, the likelihood of the testimony might be higher when the actual conditional probability is close to r and when θ is high.
  3. This approach naturally separates reliability and content (Desideratum 3) and reduces to standard conditionalization when θ=1 and the testimony is a proposition (Desideratum 2). It also does not force an increase in the probability of A (because the update is done by Bayesian conditioning on the event of the testimony, and the effect on A will depend on the model). However, it might not satisfy Desideratum 1 in all models because the testimony might indirectly affect A. But by building an explicit model, the scientist can control this.

  For qualitative information, one could use a prior distribution over r (e.g., if the testimony is "probably B if A", then r might be modelled as being above 0.5, with some distribution) and then integrate over r.

  This approach, while not unique, is principled and flexible enough for laboratory use.
answer: |-
  ### Desiderata for Updating on an Asserted Conditional  
  Below are the requirements for a rule that revises an agent’s credences upon hearing a conditional (e.g., "If \(A\), then probably \(B\)"), based on cases like the Judy Benjamin problem. The goal is a rule usable by scientists for practical testimony evaluation, not a universal resolution of philosophical disputes. Requirements are categorised as **non-negotiable** (essential for coherence) or **negotiable** (context-dependent or school-specific). Tensions between desiderata are noted, including joint unsatisfiability.  

  #### Core Desiderata  
  1. **Non-Increase of Antecedent Probability (Non-Negotiable)**  
     - **Requirement**: Upon learning a conditional of the form "If \(A\), then \(B\)" (or probabilistic variants), the probability of the antecedent \(A\) must not increase *unless* the testimony directly supports \(A\).  
     - **Rationale**: In Judy Benjamin, hearing "If in Red territory, then \(P(\text{headquarters}) = 0.75\)" provides no evidence for being in Red territory; it only constrains the consequent under the supposition of \(A\). Raising \(P(A)\) violates epistemic neutrality towards \(A\).  
     - **Violations**: Rules like *standard conditioning on the material conditional* \(A \supset B\) often raise \(P(A)\), yielding absurd results (e.g., Judy becoming more confident she is in Red territory after the update).  

  2. **Agreement with Standard Conditionalisation (Non-Negotiable)**  
     - **Requirement**: The rule must reduce to Bayesian conditionalisation when:  
       - (a) The testimony asserts a categorical fact \(E\) (i.e., \(P(E) = 1\)).  
       - (b) The testimony states a conditional probability \(P(B|A) = r\) *and* the agent treats it as a likelihood (i.e., direct evidence about \(B\) given \(A\)).  
     - **Rationale**: Scientists routinely handle evidence like "the technician says the gauge reads \(X\)" (case a) or "the instrument has 95% sensitivity to \(B\) if \(A\)" (case b). The rule must generalise established practice, not reinvent it.  
     - **Example**: If testimony states \(P(B|A) = 1\) with certainty, it should behave like conditioning on \(A \supset B\) *only if* this aligns with likelihood-based interpretations (e.g., in medical diagnostics).  

  3. **Separability of Reliability and Content (Non-Negotiable)**  
     - **Requirement**: The rule must explicitly decouple the speaker’s reliability (e.g., trustworthiness, competence) from the semantic content of the conditional.  
     - **Rationale**: In laboratory settings, a technician’s statement "If the gauge drifts, the fault is thermal" provides two signals: (i) information about the system (content), and (ii) information about the technician’s accuracy (reliability). These must be isolatable for calibration (e.g., via priors on reliability parameters).  
     - **Example**: A rule that conflates content and reliability (e.g., treating \(P(\text{conditional} | A, B)\) as inseparable) fails in scenarios where technician skill is independently assessed.  

  #### Practicality Constraints  
  4. **Handling Qualitative Testimony (Negotiable)**  
     - **Requirement**: If the testimony is qualitative (e.g., "probably \(B\) if \(A\)", "in most cases \(A\) implies \(B\)"), the rule must output a determinate posterior or an honest probability interval (e.g., \(P(B|A) \in [0.7, 0.9]\)).  
     - **Rationale**: Scientists often receive vague testimony; the rule must not collapse into ambiguity. Intervals are acceptable to reflect uncertainty.  
     - **Prejudice**: Some Bayesian schools demand precise inputs, but this is unrealistic for applied work.  

  5. **Non-Arbitrariness (Negotiable)**  
     - **Requirement**: The rule must not rely on arbitrary choices among mathematical alternatives (e.g., minimising divergence metrics) when multiple options satisfy other desiderata. If indeterminacy exists, it must be explicit.  
     - **Rationale**: Ad hoc choices (e.g., picking one entropy-minimisation method over another without justification) undermine objectivity. Scientists need reproducible methods.  
     - **Prejudice**: Information-geometric approaches (e.g., Kullback-Leibler minimisation) often impose arbitrary structure; this requirement pushes for uniqueness or transparency.  

  #### Tensions and Joint Unsatisfiability  
  - **Key Conflict**: The triad of **Non-Increase of \(P(A)\)**, **Agreement with Conditionalisation**, and **Separability** cannot be jointly satisfied in all cases without compromise.  
    - **Source**: Judy Benjamin–type problems expose this. For testimony like \(P(B|A) = r\), standard likelihood-based rules (satisfying 2) often raise \(P(A)\) (violating 1). Rules fixing this (e.g., *Jeffrey conditioning* variants) may break Separability by binding reliability and content.  
    - **Example**: If Judy updates via KL-minimisation to satisfy \(P(B|A) = 0.75\), \(P(A)\) may rise. Van Fraassen’s *imaging* avoids this but fails Separability: reliability cannot be cleanly factored.  
  - **Weaker Satisfiability**: A rule can satisfy all non-negotiable desiderata *if* testimony is treated as a likelihood model *and* reliability is modelled hierarchically (e.g., "Did the speaker correctly estimate \(P(B|A)\)?"). However, this:  
    - Conflicts with **Non-Arbitrariness** (multiple likelihood models fit "if \(A\), probably \(B\)").  
    - Fails for qualitative testimony unless intervals are used.  
  - **Salvage Path**: For scientific use, prioritise **1–3** and accept intervals (**4**) when vagueness exists. **5** is aspirational but rarely achievable; document choices instead.  

  #### Adequacy for Scientific Testimony  
  A rule is adequate if it:  
  - Respects **1–3** to handle evidence without paradoxes.  
  - Outputs intervals for qualitative inputs (**4**).  
  - Explicitly models speaker reliability (e.g., via priors on error rates).  
  - Avoids "universal" solutions—applied rules may differ across contexts (e.g., diagnostics vs. physics).  

  No extant rule meets all desiderata perfectly, but a pragmatic hybrid (e.g., reliability-weighted likelihood updates with \(P(A)\)-preserving constraints) suffices for laboratory testimony. The tensions reflect deeper indeterminacies in conditional semantics; a scientist need not resolve these but must demarcate where the rule introduces subjectivity.  

  ---  
  This specification isolates the non-negotiable foundations (1–3) while acknowledging where flexibility is needed. For your work on probability, the central insight is that **Separability** and **Non-Increase of \(P(A)\)** are defensible bedrock, but their enforcement risks arbitrariness—a trade-off requiring contextual discretion.
