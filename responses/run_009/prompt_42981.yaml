prompt: |-
  i'm in a bioethics seminar and last week we did the nonidentity problem — depletion policies, the 14-year-old who chooses to conceive now rather than wait and so has a child with a serious condition, that kind of case. whenever someone says the depletion policy or the mother's decision is wrong, my TA just replies "no one is harmed, so no one is wronged" and kind of closes discussion with it. I get the shape of the argument — the people who exist because of the policy have lives worth living, and the alternative for them wasn't a better life, it was no life at all — but the one-liner is doing a LOT of work and nobody ever unpacks it. another student brought up wrongful life lawsuits (kid sues for being born, basically) and the TA used the same slogan to wave that off too, which made me suspect it's being stretched across different claims.

  can you take the slogan apart for me? i want the distinct precise theses it could be expressing, from trivial readings (like, nobody is comparatively worse off than a nonexistence baseline, which might just be true by stipulation) to more radical ones (like, there are no procreative obligations toward the child at all, or wronging someone requires that they be worse off than they could otherwise have been). for each reading say whether it's plausibly true, whether it's actually contentious, and whether it's false. and importantly, tell me which readings would actually support what my TA was doing — using the slogan to dismiss the claim that the depletion policy or the conception decision wrongs someone. i suspect some readings are true but toothless (don't support the dismissal) and some would support the dismissal but are wildly contentious (like denying that you can harm someone non-comparatively, or denying that duties to particular people need a victim). also flag whether the wrongful-life lawsuit case is even the same claim or whether the slogan changes meaning when you move from policy cases to it. lay it out as a numbered list of readings with verdicts — i want to bring it to office hours and actually pin him down for once. sorry for typos, typing this fast before class.
