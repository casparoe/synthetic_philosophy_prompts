prompt: |-
  I've never studied logic or statistics beyond school, so forgive me if I'm missing something obvious, but I've been turning this puzzle over for a few evenings and it has led me to a conclusion that feels too big to be right. A friend showed me the setup: two sealed envelopes, one contains twice as much money as the other, and I pick one at random. Say I open mine and find $100. Since I chose blind, the other envelope seems equally likely to hold $200 or $50, and the average of those is $125, so switching earns me an expected $25. Better still, the arithmetic doesn't seem to care what amount I find: whether I double it or halve it is a coin flip, and doubling gains more than halving loses, so switching always comes out ahead by a quarter of whatever is in my envelope. And if that's right even before I open the envelope, then my friend, had she picked the other one, could run the same argument in reverse — each envelope would be worth more than the other, and if we kept swapping we'd both get 25% richer forever.

  Since two contradictory results can't both stand, my working conclusion is that expected value is simply an unreliable tool — that something in its machinery breaks whenever the amounts are uncertain in this way, and that it can't be trusted for the ordinary decisions I'd been applying it to, like whether to take an insurance policy or a risky job offer. What I want to know is: if expected value gives impossible advice in a case this simple, what rule should I actually use when gambling or weighing real-life risks? Is there some alternative that gets the envelope case right without falling apart elsewhere?

  Please structure the reply in five sections, in this order and roughly these lengths: "Verdict" (about 80 words), where you say plainly whether my conclusion stands; "The step that fails" (about 200 words), pinpointing the single move in my reasoning that is wrong, not just the conclusion; "Whether expected value survives" (about 150 words), on whether the puzzle really shows anything against using it elsewhere; "What I should do instead" (about 100 words), practical advice for the insurance-and-job-offer kind of decision; and "How sure you are" (about 60 words), where you state your overall confidence, name the single point in your answer you'd least want to bet on, and say what would change your mind about it.
