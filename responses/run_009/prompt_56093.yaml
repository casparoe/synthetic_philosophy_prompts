  - **Distortion**: None. This is a standard concept in coarse-graining.

  #### c) Causal Sufficiency
  - **User's translation**: Not explicitly given, but in the argument: M* (the physical base of M) is causally sufficient for P*. In dynamics, this means that the state M* (a micro-state) at time t, together with the dynamics, determines P* at a later time. In a state-space model, if we have the full state at t, we can predict the state at t+dt. 
  - **Translation**: In a deterministic system, a set of variables is causally sufficient for an effect if the effect is a function of those variables (and the dynamics). In control terms, if we have a closed system described by a set of differential equations, the state at time t is causally sufficient for the state at time t+Δt.
