  ### Fact Check
  Your summary is accurate. One nuance: the 2004 law also banned large crosses, Sikh turbans, and Jewish kippas, but hijabs were the primary target due to scale. Small crosses were exempted as "discreet," which critics called inconsistent (why is a small cross "private" but a hijab "political"?). This *does* challenge laïcité’s claim of perfect neutrality.
