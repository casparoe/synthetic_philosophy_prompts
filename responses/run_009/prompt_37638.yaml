prompt: |-
  I'm a software engineer, definitely no philosophy background, so go easy on jargon (or at least explain it when you use it). Here's my situation: I work at a company with a big Paris office, and I keep getting into this recurring argument with a French coworker over lunch about the headscarf bans in French schools. He's a smart guy and basically says: in France the state is neutral, so public schools are religion-free zones for everyone equally, and that's what lets a muslim girl grow up and choose her own life instead of being pressured by her community. My instinct as an american is that forcing a teenage girl to remove her hijab to attend math class is the opposite of neutral, and my government would never dream of it. We keep talking past each other and I want to actually understand what's going on instead of just vibes.

  So here's the episode I want analyzed, with the facts laid out so we're on the same page. In 1989, a principal in Creil (north of Paris) expelled three teenage girls for refusing to remove their headscarves in class. The education minister at the time, Lionel Jospin, asked the Conseil d'État for a ruling, and it came back saying that wearing religious symbols in school was in principle compatible with laïcité (French secularism) as long as it wasn't disruptive or proselytizing. This was basically the status quo for 15 years, a patchwork of local deals and expulsions. Then in 2004, France passed a law banning "conspicuous" religious symbols in public schools, which in practice meant the hijab (small crosses and discreet pendants were explicitly tolerated). In 2013 they added a charter of laïcité displayed in every school. And the debate keeps resurfacing, e.g. over long dresses and what counts as "conspicuous."

  Now the two theories I want this run through:

  1. French laïcité, the way my coworker would defend it: the republic has one civic identity, the state actively keeps religion out of public institutions, and equality means the same treatment for everyone regardless of their religion — your religion is private, full stop. Assimilation into a shared civic culture is not a dirty word, it's the point.

  2. Anglo-American multiculturalism, the way I'd defend it: the state is neutral by not forcing anyone to express or suppress a religious identity, minorities get accommodation within shared institutions, and a "neutral" public sphere that happens to look like the majority culture's norms isn't actually neutral.

  What I want is a real mapping, not a summary of the news story. Like: who is even the moral agent here — the state, the school, the girl, her family, the majority culture? What does each theory say the 2004 law was actually doing (liberating girls from community pressure vs. liberating the state from having to see religion?). What does each theory genuinely explain about how this played out — including why a lot of muslim women's organizations in France ended up split, some supporting the law? And then be honest about where each theory breaks: does laïcité have an answer for the girl who sincerely wants to wear it and experiences the ban as the coercion, not the scarf? Does multiculturalism have an answer for the girls who were pressured to wear it, or does it just assume that choice is real? And does the fact that the 1989 Conseil d'État position (tolerate unless disruptive) was seen as unworkable for 15 years tell us something about either theory — like maybe the whole framing is missing something about what happens when a "private" identity is visible on your body?

  I want it to run both directions: does the episode vindicate laïcité, vindicate multiculturalism, or show that both were built for different problems (laïcité was mostly built for the Catholic church's fight with the republic a century ago — does wearing a headscarf even fit that template?).

  For format: write the analysis as prose first, but after it, give me a structured summary as a JSON object with these fields:

  - "episode_in_one_sentence": string
  - "laicite_mapping": what the laïcité view says happened and who the actors are
  - "multiculturalism_mapping": same for the multiculturalist view
  - "laicite_explains": array of strings, things the episode shows laïcité handles well
  - "laicite_breaks": array of strings, things it can't explain or misdescribes
  - "multiculturalism_explains": array of strings
  - "multiculturalism_breaks": array of strings
  - "historical_mismatch": string, does the headscarf case fit the original problem each theory was designed for
  - "lunch_verdict": string, one or two sentences of what I should actually say to my coworker next time this comes up

  Also if some historian would say I've got the facts above wrong in an important way, flag it rather than building on my mistake. And sorry for any typos, I typed this fast between standup and a deploy.
