answer: |-
  ## Q&A Prep Sheet: "The Patient's Future Self as Ethical North Star"  
  **Core Concession Up Front:** "This framework *only* advises when current preferences are demonstrably distorted by reversible, pathology-driven factors like acute pain or delirium—and only where we have strong longitudinal evidence of stable preferences. It does *not* override clear, capacitated refusals, nor replace human judgment. The care team remains ethically and legally accountable."  

  **The Reply That Must Land:** "We already accept preference idealization in informed consent doctrine. We ask, 'What would a *fully informed* patient choose?' I’m proposing we also ask, 'What would *this* patient choose if *not* impaired by reversible distress?' This isn’t paternalism—it’s fidelity to her own values."  

  ---  
  ### Objections & Replies (Ordered by Damage Potential)  
  1. **Objection (Doctrinal/Legal):** "You’re gutting substituted judgment. Surrogates struggle to approximate what the patient would want *now*. Your AI asks what she *would become* after some transformation. That’s not her authentic voice—it’s creating a new person."  
     *Reply:* "Substituted judgment fails when surrogates project biases. Here, the AI models *only her documented values* (e.g., prior directives, clinical conversations) under *corrected impairments*—like removing delirium’s distortion. It’s not creating a ‘new’ person; it’s simulating *this* patient minus transient noise. Legal risk? We’re advising, not deciding—like an ethics consult."  
     *Soft Spot:* If her past preferences are sparse, modeling risks becoming speculative.  

  2. **Objection (Conceptual/Paternalism):** "Calling her delirious refusal ‘inauthentic’ dangerously medicalizes dissent. Autonomy-as-authenticity (Christman, Meyers) requires respecting her current expression *unless coercion exists*. Pain isn’t coercion—it’s her reality."  
     *Reply:* "When pain or fear *systematically distorts* judgment against her own deeply held values—like refusing life-sustaining treatment she consistently valued—we’re not respecting autonomy but a pathology. This isn’t dismissing suffering; it’s contextualizing it within her life narrative. We do this already when we delay decisions until pain is managed."  
     *Soft Spot:* Risks overconfidence in defining "systematic distortion."  

  3. **Objection (Practical/Epistemic):** "How can an AI model ‘calm deliberation’ without imposing Western, utilitarian biases? What if her ‘stable self’ would adapt to illness (e.g., renal failure) and change preferences? You’re freezing her identity at an arbitrary point."  
     *Reply:* "The AI uses *her* data: advance directives, recorded conversations, treatment adherence patterns. We’re not imposing rationality standards—we’re asking, ‘What aligns with *her* history of choices when undistorted?’ If she adapts post-recovery (adaptive preferences), that’s her new baseline. But dialysis refusal *mid-delirium* isn’t adaptation—it’s distress."  
     *Soft Spot:* AI training data may reflect systemic biases (e.g., under-documented preferences in marginalized groups).  

  4. **Objection (Empirical):** "Preference instability isn’t just noise—it’s fundamental (Loewenstein’s ‘hot-cold empathy gap’). Your ‘fixed point’ is a fiction. If she refuses dialysis in crisis, maybe her prior acceptance was denial!"  
     *Reply:* "Agreed—people aren’t static. But we *must* triage instability: is this fluctuation within her normal range (e.g., ambivalence) or deviation driven by acute pathophysiology? For our dialysis patient, months of lucid consent + abrupt post-procedure refusal suggests distortion. AI can flag statistical outliers in *her* data."  
     *Soft Spot:* Requires high-resolution preference data we rarely have.  

  5. **Objection (Role Morality):** "This turns clinicians into mind-readers. Our duty is to her *present self* in front of us. If she has capacity *now* (even if fluctuating), overriding her based on a prediction is unethical."  
     *Reply:* "Capacity isn’t binary. We already seek lucid intervals or delay decisions for impairment (Appelbaum). If she lacks *decisional* capacity *due to reversible factors*, we use surrogates. The AI is a tool to aid surrogates/clinicians—not override present wishes when capacity exists."  
     *Soft Spot:* Blurry capacity thresholds make "reversible impairment" hard to operationalize.  

  6. **Objection (Clinical):** "In palliative care, pain isn’t ‘noise’—it’s data. A patient saying ‘let me die’ during agony may reflect a rational trade-off. Your AI might pathologize valid suffering."  
     *Reply:* "Crucially, this framework only triggers when pain/fear *conflicts* with clear prior values. If she *always* valued comfort over longevity, the AI validates her refusal. But if she fought for years to survive kidney disease, then refuses dialysis *only* during post-op delirium, we suspect distortion. We treat the pain first—*then* reassess."  
     *Soft Spot:* May undervalue how suffering can *legitimately* shift priorities.  

  7. **Objection (Power Dynamics):** "This gives cover to teams who think they know best. ‘The AI says your real self wants this’ is coercive—especially if the patient disagrees. See Faden & Beauchamp on intentionality in consent!"  
     *Reply:* "Hence transparency: the AI’s reasoning must be explainable. ‘You said for months you wanted dialysis. Today, in pain, you’re refusing. The model suggests this pain may be distorting your choice. Can we discuss?’ This *enhances* autonomy by surfacing hidden influences—like ethicists do."  
     *Soft Spot:* Power imbalance may make patients defer to the AI’s "authority."  

  8. **Objection (Conceptual/Identity):** "Parfit would ask: if the AI ‘corrects’ her preferences, is it serving *her*—or creating a successor person? Illness can be transformative (Paul). Who are we to say her pre-illness self is ‘truer’?"  
     *Reply:* "We’re not privileging past over present. We’re privileging *unimpaired* over *impaired*—regardless of timing. If she lucidly adapts to illness (e.g., ‘I now reject dialysis’), that’s her new preference. But if impairment *blocks* her from engaging that transformation? That’s when we intervene."  
     *Soft Spot:* Unclear how to define "blocking" transformative experiences.  

  ---  
  **The Question I Hope Nobody Asks:**  
  *"If a patient with chronic depression refuses life-saving care while suicidal, would your AI ‘extrapolate’ a non-depressed version of her—and advise overriding her current wish to die?"*  
  **Why it’s dangerous:** My framework invites this by treating psychopathology like physiological impairment. But depression is often identity-constitutive, not "reversible noise." Conceding "no" undermines coherence; saying "yes" validates worst fears of paternalism.  
  **Mitigation Strategy:** "This tool is designed for *acute*, *reversible* impairments (delirium, acute pain). Chronic conditions like depression require separate frameworks—though we might ask if *untreated* depression resembles reversible distortion. Proceed with extreme caution."  

  ---  
  **Summary Strategy:**  
  - **Anchor in existing doctrine:** Informed consent already idealizes; capacity assessments already exclude impairment.  
  - **Stress narrow scope:** Only for acute, reversible distortions against documented preferences.  
  - **Human oversight:** AI advises; team interprets. Transparency is non-negotiable.  
  - **Empower, don’t override:** Frame as "surfacing hidden values," not "correcting mistakes."  

  **Word Count:** 1,050
