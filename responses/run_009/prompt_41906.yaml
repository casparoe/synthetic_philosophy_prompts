answer: |-
  Your verdicts reveal a coherent principle focused on the **fate of core sociopolitical institutions** rather than population continuity or cultural persistence. Here’s the refined principle, grounded in your cases:

  ---

  ### **The Institutional Relocation Principle**
  **A societal collapse occurs when there is an *involuntary, irreversible dissolution of core sociopolitical institutions* without their functional relocation to a successor entity within the same cultural sphere.**  
  - **"Core sociopolitical institutions"**: Structures central to political authority, economic redistribution, ideological legitimacy, or collective coordination (e.g., dynastic kingship, palatial bureaucracies).  
  - **"Functional relocation"**: The institution’s *organizational role* is absorbed/adapted elsewhere (e.g., Roman law → Germanic kingdoms).  
  - **"Irreversible"**: The institution isn’t restored in comparable form within the region’s historical trajectory.  
  - **"Same cultural sphere"**: Excludes external adoptions (e.g., Maya calendar in Postclassic Yucatán isn’t "relocation" of Classic lowland institutions).  

  ---

  ### **How Your Verdicts Align**
  1. **Terminal Classic Maya** (Collapse):  
     - **Core institutions lost**: Divine kingship, long-count calendrics, monumental civic construction.  
     - **Not relocated**: Power fragmented into smaller, less complex units; no successor state replicated the institution of *k’uhul ajaw*.  
     - *Why persistence of people/language doesn’t contradict*: Core *political* institutions vanished irreversibly.  

  2. **Late Bronze Age Mediterranean** (Collapse):  
     - **Core institutions lost**: Palatial administrations, linear B writing, interregional trade networks.  
     - **Not relocated**: Egypt survived but didn’t absorb Hittite/Mycenaean systems; Levantine revival (e.g., Phoenicia) was structurally distinct.  

  3. **Western Roman Empire** (Transformation):  
     - **Core institutions relocated**: Landholding aristocracy → Germanic nobility; tax systems → manorialism; Roman law → Germanic codes; Church as ideological successor.  
     - *Continuity of administration*: Theoderic’s Italy or Visigothic Spain maintained Roman bureaucratic practices.  

  4. **Indus Valley** (Not Collapse):  
     - **Institutions dissolved but likely relocated**: Urban planning/standardization gave way to localized agrarian systems (e.g., Cemetery H culture). No evidence of *unabsorbed* loss—complexity decentralized.  

  5. **Greenland Norse** (Collapse):  
     - **Core institutions lost entirely**: Church hierarchy, feudal land tenure, European trade ties.  
     - **No relocation**: No Inuit or Norse successor absorbed these structures.  

  6. **Rapa Nui** (Your Gut Correct; **Not Pre-Contact Collapse**):  
     - **Pre-contact changes**: End of statue production ≠ institutional collapse. *Mata* (clan) systems persisted; deforestation was adaptive (e.g., lithic gardens).  
     - **European contact**: Introduced disease/slavery causing irreversible loss of sociopolitical structures.  
     - *Fits principle*: Pre-contact was transformation; collapse was post-contact.  

  ---

  ### **Predictions for Unmentioned Cases**
  | Case                  | Prediction (Collapse?) | Reasoning |  
  |-----------------------|------------------------|-----------|  
  | **Angkor** (15th c.)  | **Yes**                | Core institutions (devaraja kingship, baray-based redistribution) dissolved without relocation. Power shifted to riverine trade centers (e.g., Phnom Penh) with distinct structures. |  
  | **Chaco Canyon**      | **Yes**                | Regional system (ceremonial centrality, road networks) collapsed. Ancestral Puebloans relocated but did not replicate Chaco’s hierarchical coordination. |  
  | **Cahokia**           | **No**                 | Decline involved dispersal/reorganization (e.g., Mississippian successor sites like Moundville). Core practices (mound-building, cosmology) persisted in adapted forms. |  
  | **Western Zhou**      | **No**                 | Mandate of Heaven, bronze ritualism, and feudalism fragmented but were relocated/reworked by Eastern Zhou states and Qin/Han. |  
  | **Roman 3rd-C. Crisis**| **No**                 | "Crisis" led to institutional *reconfiguration* (e.g., Diocletian’s reforms), not dissolution. The Empire retained core tax/military structures. |  

  ---

  ### **Which Verdict Must Give?**
  - **Your Harappan Verdict Contradicts the Principle**:  
    If future evidence shows Indus urban institutions (e.g., standardized weights, hydraulic management) were *not* functionally relocated to later cultures (e.g., Gangetic Vedic societies), your principle would classify this as collapse. Currently, your intuition ("dispersal without warfare") aligns with transformation—**stick with it, but flag it as contingent on evidence**.  

  ---

  ### **Threshold vs. Degree**
  - **Collapse is a threshold**: The *irreversible dissolution of core institutions without relocation* is binary.  
  - **Severity is a spectrum**: Measured by:  
    - **Centrality**: How essential the lost institution was to societal function (e.g., Maya divine kingship was more central than Bronze Age palatial trade).  
    - **Scope**: Proportion of institutions lost (Greenland lost *all*; Late Bronze Age retained some in Egypt).  
    - **Recovery time**: Centuries vs. millennia (explains your "more collapsed" Maya vs. Bronze Age intuition).  

  ---

  ### **Why This Works**
  - **Avoids continuity/collapse false dichotomy**: By focusing on institutional *relocation*, it accepts transformation (Rome) and collapse (Maya) as distinct.  
  - **Decouples population/culture from institutions**: Persistence of language (Maya) or cities (post-Bronze Age Levant) doesn’t override institutional dissolution.  
  - **Handles scale**: Applies equally to Greenland (micro) and Maya (macro).  

  **Recommendation**: Keep your Harappan verdict but specify it hinges on current evidence of decentralized relocation. For Rapa Nui, trust your gut—pre-contact changes were transformation; collapse was exogenous. Your principle is robust, needing only sharper definitions of "core institutions" and "relocation."
