  ### Exam Question: St. Petersburg Paradox  
  **Time Allotment:** 60 minutes  
  **Total Marks:** 25 (plus 5 bonus marks)  
  **Instructions:** Answer all parts clearly and concisely. Define any games you discuss; do not assume prior knowledge of named variants. Logical reasoning is valued over verbosity.  

  ---

  #### **1. Truncation and Finite Resources (6 marks)**  
  Consider the St. Petersburg game: A fair coin is tossed until it lands heads. If heads first appears on toss \(n\), the payoff is \(2^n\) dollars. The expectation is divergent.  

  Suppose the game is *truncated* due to finite resources: The casino pays \(2^n\) if \(n \leq k\) (for some integer \(k\)), but only \(2^k\) if \(n > k\).  
  (a) Show that the expectation of this truncated game is \(k + 1\) (or approximately \(k\) for large \(k\)).  
  (b) Explain why truncation resolves a *different game* but not the original paradox. Generalize this to any "resolution" that imposes an upper bound on utility (e.g., diminishing marginal utility or bounded utility).  

  #### **2. Revenge via Dominance (8 marks)**  
  Suppose a decision rule assigns the original St. Petersburg game a finite price \(p\).  
  (a) Define a new game (a "cousin") where:  
      - Every outcome strictly dominates the corresponding outcome of the original game, OR  
      - Every payoff is the original payoff plus \(p\).  
      (Specify payoffs clearly.)  
  (b) Show how applying the *same rule* to your cousin game leads to:  
      - A price that is demonstrably too low, OR  
      - A sure-loss arrangement (Dutch book).  
  (c) Explain why this "revenge" challenges the decision rule.  

  #### **3. The Fork: Taking a Stand (11 marks)**  
  Defend **one** of the following positions. Justify rigorously:  
  **(a) Infinite expectation, any finite price:** The expectation is infinite, and it is rational to pay any finite price. Explain what makes some finite prices "better" than others.  
  **(b) Expectation is the wrong statistic:** Propose and justify an alternative to expectation (e.g., based on repeated play, where the sample mean fails to converge).  
  **(c) Bounded utility reducio:** Rationality requires bounded utility; the paradox is a reductio against unbounded utility.  

  #### **4. Bonus: Alternating Payoffs (5 marks)**  
  Consider a variant: Payoff is \((-2)^n\) dollars if heads first appears on toss \(n\) (e.g., \(-2, +4, -8, +16, \dots\)).  
  (a) Write the expectation as an infinite series. Show that rearranging terms yields different sums (or divergence).  
  (b) What does this imply for using expectation in such games? Suggest how to assign value.  

  ---

  ### Model Answer (≈700 words)  

  #### **1. Truncation and Finite Resources**  
  **(a)** The truncated game’s expectation is:  
  \[
  E = \sum_{n=1}^k \left( \frac{1}{2^n} \cdot 2^n \right) + \sum_{n=k+1}^{\infty} \left( \frac{1}{2^n} \cdot 2^k \right) = \sum_{n=1}^k 1 + 2^k \cdot \frac{1}{2^k} = k + 1.
  \]  
  For large \(k\), \(k + 1 \approx k\).  
  **(b)** Truncation resolves a *finite-resource game*, not the original. The original paradox asks why rational agents reject high prices for an *infinite*-expectation game. Truncation avoids divergence by altering the game, but this does not justify paying only a modest amount for the *original*. Similarly, imposing a utility cap (e.g., \(u(\text{wealth}) \leq U_{\text{max}}\)) forces convergence by redefining payoffs, but the original game—with unbounded utility—retains divergent expectation. Such "resolutions" change the problem rather than solving it.  

  #### **2. Revenge via Dominance**  
  **(a)** Define the cousin game: Payoff is \(2^n + p\) if heads first appears on toss \(n\) (original payoff plus \(p\)).  
  **(b)** The decision rule assigns \(p\) to the original game. Applying it to the cousin, it assigns a finite price \(q\). But the cousin strictly dominates the original: For every outcome, \(2^n + p > 2^n\). Thus, \(q\) should exceed \(p\) (dominance). However, the cousin is equivalent to owning the original *plus* a sure \(p\). If the agent values a sure \(p\) at \(p\), then \(q\) should be \(p + p = 2p\).  
  - **Contradiction:** If \(q < 2p\), the agent undervalues the cousin. If \(q = 2p\), consider the outcome \(n=1\): Payoff is \(2 + p\), but the agent paid \(2p\), so net gain is \(2 + p - 2p = 2 - p\). If \(p > 2\), this is a loss. The agent is exposed to possible loss despite "rational" pricing.  
  **(c)** This revenge shows the rule is inconsistent: Pricing the original at \(p\) forces undervaluation or risk of loss in a dominating cousin, violating dominance or coherence.  

  #### **3. The Fork: Bounded Utility Reductio (Position c)**  
  I defend **(c)**: Rational agents must have bounded utility. The original game’s infinite expectation is absurd—it implies willingness to stake arbitrarily high wealth for finite gain probability—yet no rational agent does this. This is a reductio ad absurdum against unbounded utility.  
  - **Resolution:** With bounded utility (e.g., \(u(x) = \log(x)\) or \(u(x) \leq U_{\text{max}}\)), expectation converges: \(\sum_{n=1}^{\infty} \frac{1}{2^n} u(2^n) < \infty\). For \(u(x) = \log_2(x)\), expectation is \(\sum_{n=1}^{\infty} \frac{n}{2^n} = 2\).  
  - **Necessity:** Unbounded utility permits St. Petersburg-like games to "explode" expectation, violating rationality (e.g., accepting infinite-stakes gambles). Boundedness aligns with real-world scarcity and avoids such pathologies.  
  - **No new problems:** Bounded utility handles standard decisions (e.g., insurance) and is standard in neoclassical economics. Objections (e.g., "unbounded moral value") are irrelevant to wealth-based choice.  

  #### **4. Bonus: Alternating Payoffs**  
  **(a)** Expectation is \(\sum_{n=1}^{\infty} \frac{1}{2^n} (-2)^n = \sum_{n=1}^{\infty} (-1)^n\). This diverges (partial sums oscillate). Rearrangement (e.g., \(( -1 + 1 ) + ( -1 + 1 ) + \dots = 0\), or \(-1 + (1 - 1) + (1 - 1) + \dots = -1\)) yields different sums.  
  **(b)** Ordinary expectation fails for non-absolutely convergent series. Value should depend on risk attitudes (e.g., loss aversion) or use a norm like \(\lim_{m \to \infty} \frac{1}{m} \sum_{k=1}^m S_k\) (Cesàro mean). Repeated play stabilizes to no single value, so rational pricing requires context-specific criteria.  

  ---

  ### Marking Scheme  
  **Total: 25 marks (+5 bonus).** Must-hit points and mark allocations:  

  #### **1. Truncation and Finite Resources (6 marks)**  
  - (a) Correctly computes expectation as \(k + 1\) (≈\(k\)): **2 marks**.  
  - (b) Explains truncation resolves a different game: **2 marks**.  
  - (b) Generalizes to utility bounds as "deflationary": **2 marks**.  
    *Typical mistake: Only states truncation gives finite expectation without addressing the original paradox.*  

  #### **2. Revenge via Dominance (8 marks)**  
  - (a) Defines cousin with explicit payoffs (e.g., \(2^n + p\)): **2 marks**.  
  - (b) Shows contradiction (e.g., \(q < 2p\) undervaluation or \(q = 2p\) risk of loss): **4 marks**.  
  - (c) Identifies rule is challenged (e.g., violates dominance/coherence): **2 marks**.  
    *Typical mistake: Defines cousin but fails to show explicit pricing contradiction.*  

  #### **3. The Fork (11 marks)**  
  - Takes a stand (a, b, or c): **1 mark**.  
  - Defends chosen position coherently: **10 marks** (breakdown by option):  
    - (a) Explains "better" prices via e.g., risk-neutral benchmarking or regret minimization.  
    - (b) Proposes alternative (e.g., median, safety first, or long-run growth rate) and justifies.  
    - (c) Argues bounded utility is necessary and resolves paradox without circularity.  
    *Typical mistake: Selects (c) but does not frame it as reductio or address alternatives.*  

  #### **4. Bonus (5 marks)**  
  - (a) Writes series and demonstrates non-absolute convergence: **3 marks**.  
  - (b) Discusses expectation’s failure and suggests alternative: **2 marks**.  

  #### **Grading Standards**  
  - **A (21–25 marks)**: Hits all must-hit points. For revenge, constructs explicit cousin and shows sure loss/undervaluation. For the fork, defends chosen position deeply (e.g., for (c), explains reductio and rebuts objections). Bonus: Fully resolves (a) and (b).  
  - **B (16–20 marks)**: Correctly states truncation result and diminishing utility but superficially explains why they fail. Defines a revenge cousin but shows weak contradiction (e.g., abstract dominance without pricing). Picks a fork but does not price it (e.g., for (a), doesn’t rank prices). Bonus: Incomplete (a) or (b).  
  - **C (11–15 marks)**: Significant gaps (e.g., wrong truncation expectation, no revenge cousin, or fork not defended).  
  - **D/F (≤10 marks)**: Major errors or omissions.  

  *Note: B answers often lose marks by not generalizing truncation to utility bounds (Q1b) or pricing the revenge cousin (Q2b). A answers excel in rigorous justification, especially in Q3.*
