  **Marking Scheme (Total: 25 marks + 5 bonus)**

  1. **Truncation and Finite Resources (6 marks)**
     - (a) Correctly computes expectation as k+1 (or approximately k for large k) (2 marks)
     - (b) Explains that truncation changes the game and thus doesn't resolve the original paradox (2 marks)
     - (b) Generalizes to any utility bounding resolution: it redefines the game and evades the original (2 marks)

  2. **Revenge via Dominance (8 marks)**
     - (a) Defines a cousin game that strictly dominates the original or shifts payoffs by a fixed amount (e.g., adds p) (2 marks)
     - (b) Shows that the decision rule must assign a price to the cousin and argues for a contradiction (e.g., undervaluation, sure loss, or inconsistency) (4 marks)
     - (c) Draws the implication that the decision rule is flawed (2 marks)

  3. **The Fork (11 marks)**
     - Chooses one position and defends it consistently (1 mark)
     - For (a): Must explain why paying any finite price is rational and how to choose among them (e.g., minimizing regret or using a different criterion) (10 marks)
     - For (b): Must propose an alternative to expectation (e.g., median, or behavior under repeated play) and justify why it is better (10 marks)
     - For (c): Must argue that bounded utility is necessary and how it resolves the paradox without circularity or new problems (10 marks)

  4. **Bonus: Alternating Payoffs (5 marks)**
     - (a) Writes the series and shows it does not converge and can be rearranged to different sums (3 marks)
     - (b) Discusses the implications for expectation and suggests an alternative approach (2 marks)

  **A vs B Answer**

  - **B Answer**: Correctly states the truncation result and why it doesn't resolve the paradox. Defines a revenge cousin game and shows some inconsistency. Chooses a fork but does not deeply defend it (e.g., for (c) only states that bounded utility resolves it without discussing the reductio or potential issues). May miss some implications in the revenge part or not fully connect the sure loss.

  - **A Answer**: In addition to B-level, for truncation, clearly articulates that any utility bounding resolution changes the game and thus avoids rather than solves the paradox. For revenge, constructs a cousin explicitly and shows a clear sure loss or inescapable contradiction. In the fork, takes a stand and provides a robust defense that addresses the core challenge and potential objections.

  **Typical Mistakes**

  - Truncation: Only computes the expectation but does not explain why it fails to resolve the original.
  - Revenge: Defines a cousin game that is not clearly dominating or fails to show how it leads to a contradiction.
  - Fork: States a position without defending it deeply, or changes position mid-answer.
  - Bonus: Fails to recognize the series as conditionally convergent or does not discuss rearrangement.

