  **Final Exam Question: St. Petersburg Paradox (25 marks + 5 bonus)**

  Consider the classic St. Petersburg game. A fair coin is tossed repeatedly until it comes up heads for the first time. If this occurs on the n-th toss, the player receives a payoff of $2^n$ dollars. Thus, the probability of heads on the first toss is 1/2, yielding $2; the probability of tails followed by heads (on the second toss) is 1/4, yielding $4; and so on.

  1. **Truncation and Finite Resources (6 marks)**
     It is often noted that a real casino has finite resources. Suppose the casino can pay at most $2^k$ dollars for some positive integer k. This truncates the game: if the first heads occurs at toss n where n ≤ k, the player receives $2^n$; if the first heads occurs at n > k, the player receives $2^k$ (or 0, but for this question, $2^k). 
     (a) Show that the expected value of this truncated game is exactly k dollars (or approximately k for large k, with a small correction). [Hint: The expectation is the sum from n=1 to k of (1/2^n)*2^n plus the probability of n>k times 2^k.] 
     (b) Explain why this truncation, while making the expectation finite, does not resolve the original St. Petersburg paradox. In particular, why does the fact that the casino has finite resources not explain why a rational agent would pay only a modest amount for the original game? Also, comment on how this issue generalizes to any resolution that imposes an upper bound on utility (as in diminishing marginal utility or bounded utility).

  2. **Revenge via Dominance (8 marks)**
     Suppose a decision rule assigns a finite price p to the original St. Petersburg game. Design a new game (a "cousin" of the original) such that the same decision rule, applied to the new game, either assigns a price that is demonstrably too low (i.e., the rule undervalues the new game relative to the original) or exposes the agent to a sure loss (i.e., a Dutch book). 
     (a) Explicitly define your cousin game. [Note: It should be defined in a way that every outcome of the cousin game strictly dominates the corresponding outcome of the original game, or has a payoff that is shifted by a fixed amount, etc.] 
     (b) Show how applying the same rule to your cousin game leads to a contradiction or an unacceptable consequence. 
     (c) What does this imply for the decision rule?

  3. **The Fork: Taking a Stand (11 marks)**
     Choose one of the following three positions and defend it. Your defense should address the core of the paradox and the challenge posed by the divergent expectation.

     (a) The expectation of the original game is infinite, and it is rational to pay any finite price to play. However, some finite prices are better than others. Explain how one might determine a better finite price and why it is rational to pay it.

     OR

     (b) The expectation is the wrong statistic for this game. Propose an alternative criterion for setting a price for the game and justify why it is more appropriate. You may draw on the behavior of the game under repeated play, noting that the sample mean does not converge in the usual way.

     OR

     (c) Rational agents must have bounded utility. The St. Petersburg paradox thus serves as a reductio ad absurdum against unbounded utility functions. Argue for this position, explaining why bounded utility is necessary and how it resolves the paradox without generating new problems.

  4. **Bonus: Alternating Payoffs (5 marks)**
     Consider a variant of the St. Petersburg game in which the payoffs alternate in sign. Specifically, the game proceeds as before, but the payoff when the first heads occurs on the n-th toss is $(-2)^n$ dollars. 
     (a) Write the expectation of this game as an infinite series and show that by rearranging the terms, the series can be made to converge to different values or to diverge. 
     (b) What does this imply for the use of expectation in games with conditionally convergent or divergent series? How should we assign a value to such a game?

