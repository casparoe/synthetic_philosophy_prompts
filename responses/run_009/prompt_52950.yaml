  **Model Answer (around 700 words)**

  **1. Truncation and Finite Resources**

  (a) In the truncated game where the casino can pay at most $2^k, the expected value is calculated as follows: for trials n=1 to k, the probability of first heads on trial n is (1/2)^n and the payoff is $2^n, contributing (1/2)^n * 2^n = 1 to the expectation for each n. The probability of no heads in the first k tosses is (1/2)^k, and in this case, the payoff is $2^k, so it contributes (1/2)^k * 2^k = 1. Therefore, the expectation is the sum of k terms of 1 (from n=1 to k) plus 1, totaling k+1. This is approximately k for large k.

  (b) This truncation addresses a different game, not the original St. Petersburg game which has no cap. The original game's expectation is infinite, and the paradox questions why people won't pay large amounts for it. The finite bankroll explanation says that in practice, we only face truncated versions. However, this does not resolve the theoretical paradox of the original game. Similarly, any resolution that bounds utility (e.g., diminishing marginal utility) changes the game by mapping monetary payoffs to a bounded utility scale. This avoids the infinite expectation but by redefining the payoffs, thus evading the original problem. The core issue remains: for unbounded utility, the expectation diverges.

  **2. Revenge via Dominance**

  (a) Let the cousin game, G', be defined as follows: it is identical to the original St. Petersburg game except that in every outcome (i.e., when the first heads occurs at trial n), the payoff is increased by a fixed amount p, where p is the finite price assigned to the original game. Thus, G' pays $2^n + p for outcome n.

  (b) G' strictly dominates the original: for every possible outcome, G' pays more than the original. Therefore, any rational agent should value G' at least as much as the original. Moreover, G' is equivalent to holding the original game plus receiving a sure payment of p. Since the sure p is worth p, and the original is worth p, the value of G' should be p + p = 2p. However, the decision rule that assigned p to the original must assign a finite price q to G'. If q < 2p, then the agent undervalues G'. If q = 2p, then consider the minimum payoff of G': when n=1, G' pays $2+p. If the agent pays q=2p to play G', and the first toss is heads, the net payoff is (2+p) - 2p = 2 - p. If p>2, this is negative, meaning the agent incurs a loss in this state. But the agent was willing to pay 2p because the rule said so, yet in one state they lose money. This is inconsistent because the rule was meant to reflect the value of the game, but now leads to a loss in a possible outcome. Hence, the decision rule is flawed.

  (c) This implies that any decision rule assigning a finite price to the original St. Petersburg game is vulnerable to a revenge game that either exposes the agent to a loss or forces an inconsistent valuation, showing that the rule cannot be sound for unbounded utility.

  **3. The Fork: Bounded Utility (Position c)**

  I argue that rational agents must have bounded utility. The St. Petersburg paradox, with its infinite expectation, is absurd because it suggests that one should be willing to pay any finite amount to play, yet no one would. This serves as a reductio ad absurdum against unbounded utility functions. If utility is bounded, say by a constant U_max, then the expected utility of the St. Petersburg game becomes a convergent series: sum_{n=1}^{infty} (1/2^n) * u(2^n) <= sum_{n=1}^{infty} (1/2^n) * U_max = U_max, which is finite. For example, with logarithmic utility, u(x)=log(x), the series sum_{n} (1/2^n)*log(2^n) = log(2) * sum_{n} n/2^n = 2*log(2), which is finite. This resolves the paradox. Bounded utility is not overly restrictive; it is a natural and common assumption in decision theory, especially for wealth, as there are diminishing returns. It does not generate new problems because in practice, payoffs are finite, and bounded utilities can model realistic scenarios. Unbounded utility, however, leads to infinities in decision theory, which are not tractable.

  **Bonus: Alternating Payoffs**

  (a) The alternating payoff game has payoff (-2)^n for outcome n. The expectation is the series: sum_{n=1}^{infty} (1/2^n) * (-2)^n = sum_{n=1}^{infty} (-1)^n. This is -1 + 1 -1 + 1 - ... which does not converge. By rearranging terms, we can achieve different sums; for example, grouping as (-1+1) + (-1+1) + ... = 0, or starting with -1 and then grouping as -1 + (1-1) + (1-1) + ... = -1.

  (b) This shows that the expectation is not absolutely convergent and thus not well-defined. In such cases, the ordinary expectation is inadequate. We must therefore use alternative methods, such as the Cesaro summation or refuse to assign a value. In decision theory, one could use a bounded utility function to ensure convergence, or consider only the properties of the distribution (like median or variance) that might be finite.

