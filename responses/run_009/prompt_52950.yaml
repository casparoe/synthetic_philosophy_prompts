  **3. The Fork**

  I choose (c) bounded utility.

  (c) The St. Petersburg paradox shows that unbounded utility leads to an infinite expected utility, which is absurd because no one would pay an arbitrarily large amount to play. Therefore, rational agents must have bounded utility functions. This means there is an upper limit to the utility that any amount of money can provide. With bounded utility, the expected utility of the St. Petersburg game becomes finite. For example, if utility is logarithmic, then the utility of $2^n is n * constant, and the expectation is the sum of (1/2^n)*n, which is finite (approximately 2). This resolves the paradox. One might worry that bounded utility is too restrictive, but it is actually a natural and common assumption in decision theory. It does not generate new problems because in the real world, we always face finite payoffs, and bounded utility functions can approximate any realistic scenario.

  **Bonus: Alternating Payoffs**

  (a) The expectation is sum_{n=1}^{infty} (1/2^n) * (-2)^n = sum_{n=1}^{infty} (-1)^n.

     This is a geometric series with ratio -1: -1 + 1 -1 + 1 - ... which does not converge in the usual sense. We can rearrange the terms to get different sums: e.g., group as (-1+1) + (-1+1) + ... = 0; or as -1 + (1-1) + (1-1) + ... = -1; or leave the first -1 and then group the rest: -1 + (1-1) + (1-1) + ... = -1, or group differently.

  (b) This shows that the expectation is not well-defined for this game. The use of expectation requires absolute convergence to be immune to rearrangement. In such cases, we must use a different method, such as the Cesaro sum or refuse to assign a value. Alternatively, we could use a utility function that is bounded and then compute expected utility, which would converge absolutely.

