  1. Truncation: Explain why truncating the game (due to finite bankrolls) gives a finite expectation but does not resolve the original paradox. Also, note that imposing an upper bound on utility similarly deflates the problem without solving the original.
  2. Revenge structure: Construct a cousin game for which the same pricing rule leads to a contradiction (e.g., a sure loss or an obviously too low price). The student must explicitly build at least one such cousin.
  3. The fork: Take a stand on one of three positions and defend it.

  Additionally, an optional bonus part about a variant with alternating sign payoffs.

  Deliverables:
  - Exact wording of the question (for 60 minutes, 25 marks + 5 bonus)
