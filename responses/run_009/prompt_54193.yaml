prompt: |-
  so here's my situation. im a novelist, a few chapters into a book about a woman who worked in a mill town in the 1890s — someone ordinary, illiterate probably, no letters, no diary, nothing. the further i get the more i realize that almost everything that survives about people like her was written *about* them, not by them: court records, charity ledgers, asylum admission registers, the census taker's line. and the ones who never crossed an official's desk are just gone, completely. before i write another word i want the actual spec, not vibes: write me the desiderata — what any honest reconstruction of a life like this has to get right before it can count as more than costume drama.

  the things I want the list to handle, at minimum: the difference between silence-as-absence (nobody thought to record it), silence-as-destruction (records that existed and were burned, pulped, or never indexed), and recorded-but-marginal (one line in a property inventory that's technically about her because she's listed as an asset) — it has to respect all three and not treat them as the same kind of gap. it has to say what a reconstruction may do with a single attested fact vs a rich trove, and where "plausible" stops being an excuse for "invented." and it has to deal with what i keep stumbling into, which is that the poor who got documented were disproportionately the policed, hospitalized, and prosecuted ones — so the surviving "voices" of people like my character skew toward crisis, and if I write her from those sources alone she's a tragic case study, not a person. whether that's a bias a reconstruction is required to correct, or just a fact i have to sit with, i genuinely don't know.

  also tell me which requirements are non-negotiable vs which are basically taste (like whether an author's note flagging invention is required or just a convention), and flag any pair you suspect can't be jointly satisfied — e.g. make her life typical of women of her station AND grounded only in what documentation exists, since documentation mostly exists for the atypical. if some subset of the desiderata is jointly unsatisfiable, say so plainly, that's the part i most want to see, because it means i have to choose which to break and i'd rather choose knowingly. then a quick scorecard, a sentence each, against three strategies: the novelist who invents freely and drops an author's note, the microhistorian type who stays tiny and close to the documents, and the one who refuses to write the undocumented at all. don't go longer on the scorecard than that, the criteria are the point.

  one more thing: i can't check any of this myself, that's why im asking. so as you go, mark how confident you are in each requirement, and call out the one you'd be least willing to defend if a working historian pushed back on it — i suspect it'll be one of the ones about the destroyed records, since we mostly can't know what was in them, but you tell me.
reasoning: |-
  Okay, the user is a novelist working on a book set in the 1890s about an ordinary, illiterate woman in a mill town. They're grappling with how to authentically reconstruct such a life given the scarcity of first-person sources. Most surviving records are institutional documents that portray marginalized people through crises (court cases, asylum records, etc.), not daily life. The user wants a clear set of principles (desiderata) to guide their reconstruction, distinguishing between different types of silences in the historical record and setting boundaries for invention.

  Hmm, the user's frustration is palpable. They've hit the core tension: wanting to honour the invisibility of people like their protagonist while avoiding reducing her to trauma tropes. Their request is unusually precise—they want epistemological rigor, not writing tips. Key angles they specified: 

  First, the taxonomy of silence. They're right that conflating "no record was made" (e.g., her thoughts on Tuesday) with "records burned" (e.g., lost factory timebooks) is a category error. The former is permanent unknowability; the latter might leave traces like references in other documents. 

  Second, the bias issue. Institutional records inherently pathologize. If the only "voice" of the poor is through arrest sheets, we get a distorted view. But correcting this risks overwriting history. 

  Third, the feasibility question. They suspect some goals conflict—e.g., "typical life" vs. "document-driven" when docs capture extremes. They want honesty about where trade-offs are unavoidable. 

  *scribbles* The non-negotiables should center on integrity to the archival reality: never pretending gaps don't exist, never letting invention masquerade as evidence. But "typicality" is trickier—since the ordinary rarely left traces, insisting on pure typicality might mean writing nothing. That feels like a place where historical fiction's license applies, if transparently. 

  For the scorecard: 
  - Free invention + author's note: honest about method but risks anachronism. 
  - Microhistory: rigorous but might not serve a novel's scope. 
  - Refusing to write the undocumented: ethically clean but abandons such stories entirely. 

  Least defensible point? Probably my claim that acknowledging "silence-as-destruction" requires mapping archival losses. A historian could argue we can't quantify what we don't know exists. Fair—but the novelist can still signal that absence consciously. 

  User's deeper need: permission to invent responsibly, with guardrails. Their anxiety is about authority—who gets to speak for those erased. The desiderata should make that burden visible.
answer: |-
  Here's your desiderata for reconstructing an undocumented 1890s mill worker's life, designed to prevent "costume drama" and respect historical silence. Requirements are categorized, confidence-graded (High/Medium/Low), and conflicts are flagged.

  **Core Desiderata (Non-Negotiable):**

  1.  **Acknowledge & Distinguish Silences:** Explicitly recognize *why* information is missing. Never treat "unrecorded," "destroyed," and "marginalized within a record" as interchangeable absences. *Confidence: High.*
  2.  **Respect Provenance:** Anchor all significant claims about the character's *specific circumstances* (job, residence, family structure, legal encounters) to actual, identifiable source types (census, directory, court record, etc.) where such evidence exists for similar people. *Confidence: High.*
  3.  **Source Transparency (Implicit/Explicit):** The narrative must signal the *nature* of its foundation. Is this scene built from common practice (attested generally)? A single fragile record? Or pure gap-filling? Avoid presenting speculation as documented fact. *Confidence: High.*
  4.  **Reject Pathologizing as Default:** Resist portraying the character *solely* through crisis lenses (crime, illness, charity) just because those are the dominant surviving records of the poor. Actively counterbalance by reconstructing non-crisis aspects of existence using other sources (material culture, work processes, community norms). *Confidence: High.*
  5.  **Plausibility ≠ Invention License:** "Plausible" is constrained by *attested possibilities*. If historical evidence shows *no* mill women held certain roles, performed specific leisure activities, or lived certain ways, "plausibility" cannot override that absence without violating #2. *Confidence: High.*
  6.  **Integrate Systemic Context:** Embed the character within rigorously researched, non-negotiable systems: labor conditions (hours, pay, hazards), housing realities (overcrowding, sanitation), gender roles, class structures, and power dynamics shaping her choices and constraints. *Confidence: High.*

  **Contextual Desiderata (Negotiable/Taste):**

  7.  **Degree of Corrective Bias:** *How much* to counterbalance the "crisis record" bias is artistic choice. The *need* to counterbalance it is non-negotiable (#4), but the *extent* (e.g., dedicating 30% vs. 70% of narrative to non-crisis life) is flexible. *Confidence: Medium.*
  8.  **Explicit Author's Note:** Flagging invention is a convention, not an absolute requirement for honesty. The narrative itself (#3) can achieve transparency. However, an AN is often the clearest way to meet #3 for a general audience. *Confidence: Medium.*
  9.  **Representativeness Goal:** Aiming for the character to be "typical" is aspirational, but constrained by #1 and #2. Strict typicality might be impossible; the goal is *resonance* within documented constraints, not statistical average. *Confidence: Medium.*
  10. **Interpreting "Marginal" Records:** How much weight/meaning to give a single line (e.g., "female, 24, operative" in a ledger) is interpretive. The *fact* of her existence/role is fixed (#2); the *significance* or *internal life* inferred requires careful scaffolding (#3, #5). *Confidence: Medium.*

  **Handling Specific Gaps:**

  *   **Silence-as-Absence (Never Recorded):** Accept unknowability. Reconstruction here relies *entirely* on general context (#6) and must be flagged as such (#3). *Confidence: High.*
  *   **Silence-as-Destruction (Lost Records):** Acknowledge the *likelihood* of lost information based on known record-keeping practices/destruction events. Reconstruction can cautiously infer *types* of information likely lost (e.g., specific payroll details if fire destroyed mill books) but not specific content. *Confidence: Medium (Specificity is limited).* **Least Defensible Point:** *Inferring specific content from destroyed records.* Historians would rightfully argue this is indistinguishable from invention. We can know *categories* of loss, but not *unique individual data* within them. Stick to acknowledging the loss and its probable *type* of impact.
  *   **Recorded-but-Marginal:** The *attested fact* (e.g., being listed as property) is bedrock (#2). Interpretation of its meaning for *her* experience must be grounded in the systemic context (#6) and avoid anachronistic projection. *Confidence: High (for the fact), Medium (for interpretation).*
  *   **Single Attested Fact:** Acts as an anchor point. Reconstruction must be consistent with it and the broader context (#6). It doesn't license expansive invention *beyond* that consistency. *Confidence: High.*
  *   **Rich Trove (for her "type"):** Allows denser reconstruction of *material and social conditions* surrounding her. Still constrains *individual specificity* unless the trove directly pertains to her. *Confidence: High.*

  **Inherent Conflicts (Jointly Unsatisfiable):**

  *   **"Typicality" vs. "Document-Driven Specificity":** As you note, documentation skews towards the atypical (crisis, deviation). Achieving strict, document-proven "typicality" for an *individual* is likely impossible. **Resolution:** Use documented *patterns and norms* (#6) to construct a *plausibly representative* life (#9, contextual). Accept that her *specific* documented existence (if any) might mark her as slightly atypical, or focus the narrative on the mundane documented patterns themselves.
  *   **Fully Correcting Crisis Bias vs. Pure Document Fidelity:** Eliminating *all* distortion from crisis-dominant sources requires reconstructing undocumented non-crisis life. This *always* involves some degree of informed invention (#1, Silence-as-Absence). Pure document fidelity would leave her defined *only* by crises. **Resolution:** Non-negotiable #4 *requires* corrective effort, accepting that reconstruction of non-crisis aspects involves responsibly managed inference/generalization (#5, #6, #3), not pure invention.

  **Strategy Scorecard (1 Sentence Each):**

  *   **Invent Freely + Author's Note:** Honest about method, risks anachronism/undermining #4 if bias isn't actively countered, best for thematic exploration over strict reconstruction.
  *   **Microhistorian (Tiny & Close):** Maximizes #2 & #3, risks fragmentation and missing broader context (#6), may struggle with #4 due to source limitations.
  *   **Refuse to Write Undocumented:** Purest fidelity to #1 & #2, ethically clear, but surrenders the entire project of representing the invisible majority, reinforcing their silence.

  **Your Path Forward:** Embrace the conflicts knowingly. Anchor your character in the non-negotiable systemic realities (#6) and any scrap of plausible specific attestation (#2). Use Silence-as-Absence for her inner world, grounded in material context. Counter the crisis bias (#4) by reconstructing the *texture* of daily, unremarkable survival using the richest available general sources on work, home, and community. Be ruthlessly transparent (#3) within the narrative texture itself.
