  We are designing an in-class activity to demonstrate the discursive dilemma (also known as the doctrinal paradox) and the manipulability via agenda-setting. The goal is to have students experience how majority votes on premises can lead to a different outcome than a majority vote on the conclusion, and how the order of voting can change the result.

  **Activity Design: Mock Hiring Committee**

  **Context:** The class is an upper-level seminar on democratic theory and collective decision-making. The students are familiar with Condorcet and Arrow, but new to judgment aggregation.

  **Staging:** A hiring committee for a faculty position at a fictional university. The bylaws require that a candidate must meet all three criteria to be hired: 
  1. **Research Quality (RQ)**: Is the candidate's research of sufficiently high quality?
  2. **Teaching Fit (TF)**: Does the candidate fit the teaching needs of the department?
  3. **No Disqualifying Circumstance (DQ)**: Are there no disqualifying circumstances? (Note: We frame this as a positive condition: "No DQ" meaning the candidate is clean.)

  Each committee member (student) will have a private judgment card that specifies their yes/no (True/False) on each of the three premises and the conclusion (Hire: Yes/No) that they derive from their own judgments. The conclusion is determined by the rule: Hire if and only if (RQ and TF and no DQ). 

  We will have three candidates (A, B, and C) but to keep the activity focused and within time, we will run the paradox for one candidate at a time. However, to make it feel like a hiring committee, we can have three candidates and run the scenario for each, but the paradox will be set up only for one candidate (say Candidate B). We can have the other two candidates as decoys (with non-paradoxical profiles) to avoid making it obvious.

  Alternatively, we can have one candidate and focus on that. Given time constraints (80 minutes) and the need to have multiple voting rounds, I suggest one candidate and then we can do a second candidate to show agenda manipulation.

  **Materials:**
  - Judgment cards for each student (18 cards, each for a committee member). Each card will have:
    - Committee Member ID (1 to 18)
    - For Candidate B (the candidate we focus on):
      - Research Quality (RQ): [Yes/No]
      - Teaching Fit (TF): [Yes/No]
      - No Disqualifying Circumstance (DQ): [Yes/No]  (Note: We label it "No DQ" to avoid double negatives. We can also call it "Clean Record" or "Clear Background")
      - Conclusion: Hire? [Yes/No] (which they must fill based on their own judgments: Hire only if all three are Yes)
  - A ballot for each student to vote on each premise and the conclusion (we'll do multiple rounds of voting).
  - A whiteboard or projector to tally votes.

  **Card Construction for the Discursive Dilemma:**
  We need a profile of judgments such that:
  - A majority says Yes to RQ.
  - A majority says Yes to TF.
  - A majority says Yes to DQ (meaning no disqualifying circumstance).
  But a majority says No to hiring (because for a majority of committee members, at least one premise fails, so they individually conclude not to hire).

  We can achieve this with 18 students. We'll create three groups:

  Group 1 (6 members): 
    RQ: Yes, TF: Yes, DQ: No -> Conclusion: No (because DQ fails)
  Group 2 (6 members):
    RQ: Yes, TF: No, DQ: Yes -> Conclusion: No (because TF fails)
  Group 3 (6 members):
    RQ: No, TF: Yes, DQ: Yes -> Conclusion: No (because RQ fails)

  Now, let's check the majorities:
  - RQ: Group1 (6 Yes) + Group2 (6 Yes) = 12 Yes; Group3 (6 No) -> Majority Yes (12 out of 18)
  - TF: Group1 (6 Yes) + Group3 (6 Yes) = 12 Yes; Group2 (6 No) -> Majority Yes
  - DQ: Group2 (6 Yes) + Group3 (6 Yes) = 12 Yes; Group1 (6 No) -> Majority Yes

  But the conclusion: 
    All 18 members have Conclusion: No (because each group fails on one premise). So 18 No, 0 Yes -> Majority No.

  This is the paradox: majority on every premise, but unanimous (or majority) against the conclusion.

  However, note that in this setup, every individual concludes No. We can also have a situation where the conclusion is split but majority against, but this is stark and clear.

  **Alternative: Make it less extreme?**
  We can have some members who would hire. But then we need to adjust. For example, we can have:

  Group1: 7 members: RQ=Y, TF=Y, DQ=N -> No
  Group2: 6 members: RQ=Y, TF=N, DQ=Y -> No
  Group3: 5 members: RQ=N, TF=Y, DQ=Y -> No

  Now:
  - RQ: Group1 (7Y) + Group2 (6Y) = 13Y, Group3 (5N) -> 13Y (majority)
  - TF: Group1 (7Y) + Group3 (5Y) = 12Y, Group2 (6N) -> 12Y (majority)
  - DQ: Group2 (6Y) + Group3 (5Y) = 11Y, Group1 (7N) -> 11Y (majority? 11<18/2? 18/2=9, so 11 is majority? Yes, 11>9)

  But the conclusion: 7+6+5=18 No -> majority No.

  But note: 11 is a majority? In 18, majority is at least 10. So 11 is majority.

  But we can also have:

  Group1: 6 (Y,Y,N -> No)
  Group2: 6 (Y,N,Y -> No)
  Group3: 6 (N,Y,Y -> No)

  This is symmetric and each premise has 12 Yes (which is two-thirds) and the conclusion is 0 Yes. It's more dramatic.

