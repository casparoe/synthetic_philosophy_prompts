     - How to handle:
          - For (1) and (2): Emphasize at the start that cards are private and they should not share. If a student recognizes it, ask them to play along and not spoil. If they do announce, turn it into a teaching moment: "Yes, this is a known paradox, but let's see it play out."
          - For (3): Stress that they should vote sincerely as per their card.
          - For (4): Adjust the numbers on the fly. If you have 17 students, remove one card from one group (make it 5,6,6). Or if 19, add one more to a group. The specific numbers are not sacred as long as the majorities hold and the conclusion is majority against.

     **What the activity cannot reproduce:**
          - Deliberation: In the real world, committee members discuss and might change their views. Here, judgments are fixed.
          - Systematic impossibility: This is one example. The literature shows it's a general possibility.
          - Strategic voting: In the activity, we assume sincere voting. In reality, voters might misrepresent their judgments to manipulate the outcome.

     **When to abandon or redesign:**
          - If during the first vote (conclusion-based) there is a majority in favor of hiring, then the paradox doesn't arise. This would happen if our card distribution is off (e.g., we have more than 9 students in groups that have all three Yes). We must ensure that no individual has all three Yes.
          - If during the premise-based vote, one of the premises does not get a majority, then we don't get the paradox. We must ensure each premise has a majority.

     Evidence of failure:
          - The conclusion-based vote shows a majority in favor (we expect 0 in favor).
          - In the premise-based vote, at least one premise fails to get a majority.

     In that case, you can still explain what happened: 
          - "In this profile, we see that the premise-based approach would have [passed all or not] and the conclusion-based [agreed or not]."
          - But then you can say: "The paradox I wanted to show is when the premises all pass but the conclusion is to reject. Let me show you the intended profile on the board."

     Given the time, I think the card distribution as described (6,6,6) for the three groups is robust for 18 students.

     **Materials:**
          - Judgment cards for Candidate B (18 cards) as described.

     Example card for Group1:
          Committee Member ID: 1 to 6 (label Group1)
          Candidate B:
            Research Quality (RQ): Yes
            Teaching Fit (TF): Yes
            No Disqualifying Circumstance (DQ): No   [Note: This means they found a disqualifying circumstance]
            Conclusion: Hire? No   (because not all are Yes)

     Similarly for Group2 and Group3.

     We can also include two decoy candidates (A and C) on the card to make it less obvious, but with clear instructions that we are focusing on B today.

     For Candidate A: 
          We can have a non-paradoxical profile, e.g., all premises No -> not hire.
     For Candidate C: 
          All premises Yes -> hire.

     But only B is used in the activity.

     Alternatively, to save paper, we can have only B.

     Given the complexity, I hope this meets the needs. I apologize for not delivering on the agenda-setting part with an activity, but I hope the board illustration will suffice.
answer: |-
  ### Activity Design: Discursive Dilemma Seminar Exercise  
  **Title:** The Paradox of Reasons: A Faculty Hiring Committee Simulation  
  **Objective:** Experience the discursive dilemma firsthand, revealing how premise-based and conclusion-based voting yield conflicting outcomes, and demonstrate agenda-setting power.

  ---

  ### **Setup & Materials**  
  **Staging:** Faculty hiring committee for a tenure-track position in Philosophy. Each student is a committee member.  
  **Decision Rule:** Hire a candidate only if they meet **all three criteria**:  
  1. **Research Excellence (R)**: Candidate’s research is groundbreaking.  
  2. **Teaching Fit (T)**: Candidate can teach core courses effectively.  
  3. **Ethical Integrity (E)**: No evidence of misconduct (e.g., plagiarism).  

  **Materials:**  
  - **18 Judgment Cards** (one per student): Cards specify a student’s private judgments on R, T, E (Yes/No) and their sincere conclusion (Hire: Yes/No) for **Candidate X**.  
  - **Ballots:** Separate slips for voting on R, T, E, and Hire.  
  - **Whiteboard:** To tally votes publicly.  
  - **Stakes:** "Hiring points" (e.g., 3 points for each vote aligning with the final committee outcome). Points can be redeemed for small privileges (e.g., choosing a discussion topic).  

  ---

  ### **Card Construction for Discursive Dilemma**  
  Split students into three groups of 6. Assign judgments to ensure:  
  - **Majorities on all premises (R, T, E) support Candidate X.**  
  - **Majority on the conclusion (Hire) rejects Candidate X.**  

  | Group | Size | Research (R) | Teaching (T) | Ethics (E) | Conclusion (Hire?) |  
  |-------|------|--------------|--------------|------------|-------------------|  
  | **A** | 6    | Yes          | Yes          | No         | No (E fails)      |  
  | **B** | 6    | Yes          | No           | Yes        | No (T fails)      |  
  | **C** | 6    | No           | Yes          | Yes        | No (R fails)      |  

  **Outcome:**  
  - **Premise-Based:** Majority Yes on R (12Y: Group A+B), T (12Y: Group A+C), E (12Y: Group B+C).  
  - **Conclusion-Based:** Unanimous No (18N) → Hire fails.  

  **Card Example (Group A):**  
  ```
  COMMITTEE MEMBER #1  
  Candidate X Assessment:  
  ☑ Research Excellence: YES  
  ☑ Teaching Fit: YES  
  ☐ Ethical Integrity: NO (Evidence: Citation irregularities)  
  CONCLUSION: HIRE? NO (Ethics violation disqualifies)  
  ```  
  *(Cards for B/C follow similarly. Include red herrings like candidate names like "Dr. Thorne" to avoid suspicion.)*  

  ---

  ### **Timeline (80 Minutes)**  
  **Phase 1: Private Judgment & Conclusion-Based Vote (20 min)**  
  1. **Intro (5 min):** Frame the scenario. Distribute cards. Emphasize: *"Vote sincerely. Your points depend on matching the committee’s final outcome."*  
  2. **Private Review (5 min):** Students review their cards. Ask: *"Would you hire Candidate X based on your judgments?"*  
  3. **Conclusion-Based Vote (10 min):**  
     - Secret ballot on "Hire Candidate X: Yes/No."  
     - Tally publicly: 18–0 against hiring. Announce: *"Candidate X rejected."*  

  **Phase 2: Premise-Based Vote & Revelation (25 min)**  
  1. **Premise Voting (15 min):**  
     - Vote sequentially on R, T, E via show of hands. Tally each.  
     - **Expected Result:** Majorities approve all three (12Y each).  
     - Announce: *"By committee rules, Candidate X meets all criteria → HIRED!"*  
  2. **Reveal the Paradox (10 min):**  
     - Ask: *"How many of you concluded NO on Hire?"* (All hands).  
     - Contrast with premise-based outcome: *"But every reason to hire won majority support. What happened?"*  

  **Phase 3: Agenda-Setting Power (20 min)**  
  1. **New Candidate Y (Same Judgments):** Use identical judgments as Candidate X.  
  2. **Chair-Controlled Agenda (Student Volunteer):**  
     - First vote: Chair chooses **one premise** (e.g., Ethics). If it fails, reject immediately.  
     - Scenario 1: Chair starts with **Ethics (E)** → Majority Yes (12Y) → Proceed to **Teaching (T)** → Majority Yes (12Y) → Proceed to **Research (R)** → Majority Yes (12Y) → Hired.  
     - Scenario 2: Chair starts with **Research (R)** → Majority Yes (12Y) → Proceed to **Teaching (T)** → Majority Yes (12Y) → Proceed to **Ethics (E)** → Majority Yes (12Y) → Hired.  
  3. **Twist:** Reveal judgments are identical to Candidate X. Discuss: *"Why did we get the same outcome? What if the chair had prioritized a weaker premise?"*  

  **Debrief (15 min):**  
  - **Map the Coalitions:**  
    | Group | Premises Supported | Why Conclusion Failed |  
    |-------|---------------------|-----------------------|  
    | A     | R, T                | E rejected → No hire |  
    | B     | R, E                | T rejected → No hire |  
    | C     | T, E                | R rejected → No hire |  
    - **Premise-Based Aggregation:** "We ignored individual conclusions and aggregated reasons. Result: Hire."  
    - **Conclusion-Based Aggregation:** "We aggregated final decisions. Result: No hire."  
  - **Key Insight:** *"Voting on reasons doesn’t prevent incoherence—it just shifts the paradox. Plus, agenda control can force outcomes even with identical preferences."*  
  - **Real-World Link:** "This mirrors judicial panels (e.g., liability requires both negligence and causation) or grant reviews."  

  ---

  ### **Practical Honesty: Predictable Challenges & Solutions**  
  1. **Students comparing cards early:**  
     - **Prevention:** Start with: *"Your judgments are confidential. Leaks undermine the exercise."*  
     - **Response:** If caught, say: *"Now you see collusion risks—but let’s proceed to see the systemic issue."*  

  2. **Student recognizes the paradox:**  
     - **Response:** *"Brilliant! Now help us test if it plays out as you expect."* Channel their insight into facilitating the debrief.  

  3. **Voting errors:**  
     - **Prevention:** Use clear ballots ("R: Yes/No") and public tallying.  
     - **Recovery:** If a premise vote fails unexpectedly, say: *"Interesting! Let’s compare this to the theoretical paradox."*  

  4. **Absent students:**  
     - **Adjustment:** Scale group sizes (e.g., 5-6-6 for 17 students). Ensure majority thresholds still hold.  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **Deliberation:** Real committees debate premises. *Supply at board:* "In practice, deliberation might shift judgments—but the paradox persists even with sincere voting."  
  2. **Strategic Misreporting:** Students vote sincerely. *Explain:* "People might lie about premises to force outcomes. This mirrors Arrow’s strategic voting."  
  3. **Systemic Impossibility:** This is one example. *Clarify:* "The literature proves no aggregation rule avoids all paradoxes. This is a symptom, not an exception."  

  ---

  ### **Red Flags: When to Abandon/Redesign**  
  1. **Premise Votes Fail:** If any premise lacks a majority (e.g., ethics only gets 10Y), the paradox collapses.  
     - **Evidence:** Premise-based and conclusion-based outcomes align (both reject).  
     - **Fix:** In debrief, contrast with intended paradox using whiteboard examples.  

  2. **Conclusion Vote Supports Hire:** If votes are miscounted or cards misassigned.  
     - **Evidence:** Conclusion-based vote has ≥10Y.  
     - **Fix:** Use a spare "control card" (e.g., R=Y, T=Y, E=Y → Hire=Y) to audit.  

  3. **Agenda-Setting Fizzles:** If students see through the manipulation.  
     - **Evidence:** Chair selects weak premises first, but outcome unchanged.  
     - **Redesign:** Simplify to 2 premises (e.g., R and T only) with a 7-5-6 split to force path-dependence.  

  **Why This Works:** The hiring context feels authentic, stakes (points) incentivize engagement, and the card setup ensures the paradox emerges organically. Students *feel* the disconnect between reasons and outcomes—making the theory unforgettable.
