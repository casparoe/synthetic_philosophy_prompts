prompt: |-
  Is there an established term for the following explanatory configuration, or a literature I could locate if I only knew the keyword? I have in mind explanations that cite a rationale without any reasoner behind it: sentences of the form "the reason X is as it is, is that being that way achieves Y," where Y is an outcome that nobody ever planned, represented, or even noticed — and yet the sentence seems to do genuine explanatory work rather than functioning as a loose metaphor.

  A few instances to fix the idea. A naturalist explains that the reason certain moths emit clicks when hunted by bats is to jam the bats' echolocation; no moth or bat grasps this, and no designer built it. A beekeeper explains that honeycomb is hexagonal because hexagons enclose the most honey for the least wax; the bees follow simple rules and know nothing of economies of wax. An economist writes that the reason prices move as they do is to pool information scattered across thousands of traders; no trader intends this, and most would be unable to state it.

  I can find partial matches, but none exact. Teleology is the obvious neighbor, but teleological explanation has traditionally been understood to presuppose a mind — a designer, an agent, a cosmic purpose — and here the whole point is that no mind is available. Function talk in biology ("the function of the heart is to pump blood") is close, but functions look like selected effects, whereas what interests me is the reason-giving character of the explanation: these explanations purport to answer a why-question, not merely to record what a trait was selected for. And talk of "as if" intentionality seems to license the idiom without explaining why the explanations so often strike us as correct rather than merely convenient.

  So: does the phenomenon have a name? If several candidate concepts partially fit, I would like to know which carves it best and where each leaves something out. If nothing in the literature matches, I would like a coined term with a definition precise enough to settle the boundary cases — for example, whether the phenomenon extends to social practices whose point has been forgotten by every current participant, and whether artifacts with conscious designers fall outside it by definition or only by degree. Finally, is the standard view that such explanations are shorthand for selection histories, or do some philosophers take the unowned rationale itself to be something real?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're asking about a specific type of explanation where a rationale is given without any intentional agent behind it. The examples include moths jamming bat sonar, bees making hexagonal honeycombs for efficiency, and prices pooling information in markets. The user mentions that terms like teleology, function, and "as if" intentionality don't quite fit because they either imply a mind or don't capture the reason-giving aspect properly.

  First, I need to recall related concepts in philosophy and biology. Teleology comes to mind, but it's traditionally tied to intentional design. The user explicitly wants to exclude any mind, so that's out. Biological functions, like the heart pumping blood, are close but focus on selected effects rather than answering "why" in a reason-giving way. "As if" intentionality seems metaphorical, but the user wants to know why these explanations feel correct, not just convenient.

  Looking at the examples, they all involve systems evolving or self-organizing to achieve an optimal outcome without conscious planning. The moths evolved through natural selection, bees through instinctual behavior, and markets through decentralized actions. This points towards evolutionary explanations but also broader concepts like emergent phenomena or optimization processes.

  I remember that in biology, there's "teleonomy," coined by Pittendrigh to describe goal-directed behavior in living systems without implying purpose. That might be a candidate. Then there's "invisible hand" explanations in economics, like Adam Smith's idea. But these might be too narrow. 

  The user also asks about social practices with forgotten purposes. This extends beyond biology into cultural evolution, where practices persist because they serve a function, even if no one remembers why. So the term needs to cover both biological and social domains.

  Another angle is the philosophical discussion on "rationale without a reasoner." Daniel Dennett's "design stance" comes to mind, where we interpret systems as if designed for a purpose. But Dennett frames this as a useful perspective rather than an ontological claim. The user wants to know if the rationale is real or just a shorthand for selection histories.

  I should also consider "evolutionary explanation" versus "functional explanation." The latter often gets criticized for being teleological unless grounded in selection history. But the user emphasizes the reason-giving aspect, so maybe "functional teleology" or "unintended functional explanation" could work as terms.

  For boundary cases, artifacts with designers might be excluded if the rationale is intended, but what about designs that evolve beyond original intentions? Like software algorithms optimizing in unexpected ways. The term should accommodate such nuances.

  The user's deeper need seems to be understanding the ontological status of these rationales. Are they real patterns in the world, or just explanatory tools? Philosophers like Dennett argue for patterns as real, while others insist on causal histories. This ties into debates in philosophy of science and biology.

  So possible terms are "teleonomy," "invisible hand explanation," "emergent functionality," or "systemic rationale." Among these, "teleonomy" is established in biology but less known elsewhere. "Invisible hand" is specific to social sciences. "Unintended functional explanation" might be more encompassing. 

  To address all parts: define the term clearly, explain its scope regarding social practices and artifacts, and discuss whether it's shorthand or real. Conclude that while "teleonomy" is closest, a new term like "systemic rationale" could be coined for clarity.
answer: |-
  Your query identifies a fascinating and philosophically rich explanatory pattern: **unowned functional rationales** — where a system's feature is explained by its beneficial outcome, despite no agent intending or representing that outcome. This phenomenon straddles biology, economics, and social theory, and while no single term is universally established, several closely related concepts exist. Below is a structured analysis:

  ### 1. **Closest Established Terms & Their Fit**
     - **Teleonomy** (Pittendrigh 1958, popularized by Ernst Mayr):
       - **Definition**: Goal-directed behavior in living systems *explained by natural selection*, without implying cosmic purpose.
       - **Fit**: Best match for biological cases (moths, bees). It captures the "reason-giving" character via evolutionary optimization. Explicitly excludes conscious designers.
       - **Limitation**: Primarily biological; less applied to economics or social practices. Doesn't fully emphasize the *rationale* aspect over mechanism.
       - **Key Literature**: Ernst Mayr's *Toward a New Philosophy of Biology* (1988); Pittendrigh's original paper in *Behavior and Evolution* (1958).

     - **Invisible-Hand Explanation** (Adam Smith, modernized by Nozick/Ullmann-Margalit):
       - **Definition**: Explains social/economic patterns (e.g., market prices) as unintended consequences of individual actions.
       - **Fit**: Perfect for economic cases (e.g., price signals pooling information). Centers on emergent functionality without a planner.
       - **Limitation**: Narrow to social sciences; less used in biology. May imply human agents (though unintendedly creating outcomes).
       - **Key Literature**: Robert Nozick's *Invisible-Hand Explanations* (1994); Edna Ullmann-Margalit's *The Invisible Hand and the Cunning of Reason* (1997).

     - **Systemic Function** (in functionalism/systems theory):
       - **Definition**: A feature's function is its role in maintaining a system's stability or efficiency (e.g., honeycomb structure minimizing wax).
       - **Fit**: Covers all cases by focusing on system-level benefits. Used in biology (physiology), cybernetics, and sociology.
       - **Limitation**: Often conflated with intentional design. Less emphasis on "answering why" versus describing causal roles.
       - **Key Literature**: Robert K. Merton's *Social Theory and Social Structure* (1949) on unintended functions; Walter Cannon's *The Wisdom of the Body* (1932) for physiology.

  ### 2. **Partial Fits & Why They Fall Short**
     - **Teleology**: Rejected as you note—traditionally requires a mind (Aristotle, Aquinas). Modern "natural teleology" (e.g., Ruth Millikan) still roots functions in evolutionary *history*, not unowned rationales.
     - **Selected Effects Theory of Function**: Reduces functions to past selection (e.g., Larry Wright, Millikan). Explains *why a trait exists* but not its current rationale-as-optimization (e.g., bees' hexagons may not be directly selected).
     - **"As-If" Intentionality**: Descriptive metaphor (e.g., Friedman's economics), but doesn't explain *why* the explanation is robust. Often seen as instrumentalist.

  ### 3. **Coining a Precise Term: Systemic Rationale Explanation**
     Given gaps, I propose:  
     **Systemic Rationale Explanation (SRE)**  
     - **Definition**: An explanation where a feature *X* of a self-organizing system is accounted for by its propensity to achieve outcome *Y*, where *Y* contributes to the system's persistence, efficiency, or adaptability, and *Y* arises without representation or intent by any agent within the system.  
     - **Boundaries Clarified**:
       - Includes social practices with forgotten purposes (e.g., a ritual that originally aided cohesion but is now followed mechanically).
       - Excludes artifacts *only if* the designer explicitly intended *Y*. If an artifact evolves beyond its design (e.g., HTTP protocol's unintended uses), it qualifies.
       - Requires *Y* to be causally relevant (not accidental). E.g., moth clicks *actually* jam sonar; hexagons *factually* minimize wax.

  ### 4. **Philosophical Status: Is the Rationale "Real"?**
     - **Selectionist View (Dominant)**: SREs are shorthand for causal histories (evolution, learning, cultural transmission). The "rationale" is epiphenomenal (e.g., Dennett's *Darwin's Dangerous Idea*, 1995).
     - **Realist View**: The rationale is a mind-independent "explanatory pattern." Proponents argue:
       - Optimization principles (e.g., least action in physics) reveal objective efficiencies.
       - "Unreasoned reasons" exist as causal forces (e.g., entropy minimization drives hexagonal honeycombs via physical constraints).
       - **Key Advocates**: Daniel Dennett (*Real Patterns*, 1991) treats rationales as real but not ontologically fundamental; John Beatty (*The Evolutionary Contingency Thesis*, 1995) critiques non-historical explanations.

  ### Recommended Literature & Keywords
  - **Biology**: Search **teleonomy + adaptationism** (Mayr, G.C. Williams). Also **self-organization** (Stuart Kauffman) for physics-driven rationales.
  - **Economics/Social Sciences**: **Invisible-hand explanations + spontaneous order** (Hayek, Nozick). Ullmann-Margalit's *The Emergence of Norms* (1977) for forgotten social functions.
  - **Philosophy**: **Functionalism without intention** (Peter Godfrey-Smith on "modern function talk"); **emergent teleology** (Mark Bedau on weak emergence).
  - **Cross-Disciplinary**: Daniel Dennett's *From Bacteria to Bach and Back* (2017)—frames evolution as a "competence without comprehension" process.

  This explanatory configuration thrives where purpose emerges without a purposive mind. "Systemic rationale" captures its essence, but **teleonomy** (biology) and **invisible-hand explanation** (social sciences) remain the canonical terms. The realism debate is unresolved, making this a fertile philosophical frontier.
