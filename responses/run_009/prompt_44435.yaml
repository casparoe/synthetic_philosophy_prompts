prompt: |-
  I've been keeping a list of my gut verdicts on questions about individual contributions to collective harms — the whole "my one act makes no difference, so how could it be wrong?" cluster — and I've concluded that I don't have a coherent position, only vibes. My partner, who is a straightforward consequentialist about expected value, claims all my verdicts fall out of multiplying tiny probabilities by large stakes, but I don't think that's true, and I'd like an actual principle, if one exists. Here are the cases and my verdicts. I vote in national elections even in a safely decided district, and I think people who don't are doing something at least mildly wrong — when someone says one vote never matters, I think they're mistaken, though I can't say how. I think buying factory-farmed chicken is wrong even though my skipping it won't change the number of birds raised — the chain from my checkout to a production decision is too long and slack. But I heat my house to a comfortable temperature all winter and feel no guilt at all, even though my annual emissions from that alone exceed the emissions of a flight I did feel guilty about taking for a friend's birthday. I blame each of the forty mill owners who individually dump legally diluted, individually harmless effluent into a river that collectively dies from it. And while I think an emergency drive to the hospital is obviously fine despite its emissions, I extend that excuse to surprisingly trivial errands, which suggests my necessity exception is really just an excuse generator.

  Two pairs in particular bother me. The voting case and the heating case look structurally identical — a contribution so small that it makes no difference to the outcome, one to a good cause and one to a bad one — yet I feel obligatory pull in the first and nothing in the second, so whatever is doing the work can't just be the arithmetic of the collective harm. And I think failing to vote is a minor wrong while failing to donate blood, where a single donation near-certainly does some concrete good, seems supererogatory rather than required — which is backwards from any view on which the value of acting is what matters. So: is there one principle that accommodates all or nearly all of these (threshold effects, expected utility with tiny probabilities and huge stakes, complicity in a practice, something about the visibility of the causal chain), or does any workable principle force me to give some verdict up? If the principle exists, state it precisely, tie each clause to the case that motivates it, and tell me its verdicts on cases I haven't listed: a referendum in my town of four thousand voters where I'm genuinely unsure which way it will go; buying eggs at a farmers' market stall where my weekly purchase plausibly keeps the farmer afloat; paying a carbon-removal company to offset that flight after taking it; and being one of twenty people who each write a letter to the planning office, no single letter decisive, that together get a development blocked. Finally, be honest about which of my verdicts your best principle cannot save, and why that verdict rather than the principle should go.
reasoning: |-
  Hmm, this user has presented a fascinating ethical puzzle about individual contributions to collective harms. They've clearly thought deeply about this, listing several intuitive judgments that seem inconsistent when examined closely. I appreciate how they've structured this with specific cases - voting, factory farming, home heating, and others - which gives me concrete material to work with.

  The core tension they're describing is real: why do we feel some tiny contributions matter morally (like not voting) while others don't (like home heating emissions), even when both seem structurally similar in terms of individual impact? Their partner's expected utility explanation doesn't satisfy them, and I can see why - it doesn't capture the full picture of how humans actually make moral judgments about collective action problems.

  What strikes me most is how they've identified the voting/heating paradox: two cases with negligible individual impact where they feel obligation in one but not the other. And the voting/blood donation reversal is equally puzzling - why is voting (low individual impact) felt as obligatory while blood donation (high individual impact) feels supererogatory? This suggests our moral intuitions aren't operating on a simple consequentialist calculus.

  I should probably approach this by looking for patterns across their cases. Voting involves a collective decision-making practice with symbolic value. Factory farming implicates complicity in a harmful system. Home heating feels like a basic need. The emergency driving exception reveals how flexible our "necessity" judgments can be. These point toward multiple dimensions beyond just expected outcomes.

  For a unifying principle, I'm considering something that combines: (1) the nature of the collective action problem, (2) symbolic significance, (3) complicity in harm, and (4) personal stakes. But I need to test this against their cases systematically. The additional scenarios they want analyzed (town referendum, farmer's market eggs etc.) will be good stress tests.

  I suspect I'll need to challenge some of their intuitions - probably the home heating one since it seems least defensible under any consistent framework. But I should acknowledge that moral psychology often includes such inconsistencies, and maybe that's okay if we're being descriptively accurate rather than prescriptively rigid.

  The letter-writing case is particularly interesting - it shows how even when individual impact is negligible, being part of a successful collective action feels different from cases where the harm is diffuse. This might relate to the visibility of causation they mentioned.

  I should be honest that no single principle perfectly saves all their judgments - that's probably why they feel they only have "vibes." But I can offer a framework that makes most of them coherent while clearly identifying which intuitions might need revising.
answer: |-
  Your intuitions reveal a sophisticated moral psychology that blends consequentialist, deontological, and symbolic reasoning. No purely *expected utility* framework captures all your judgments—your partner’s "tiny probabilities × large stakes" model struggles with asymmetry (e.g., voting vs. heating) and symbolic cases (e.g., voting vs. blood donation). Instead, a **hybrid principle** incorporating **threshold sensitivity, complicity, and expressive significance** accommodates nearly all your verdicts:

  ---

  ### **The Principle: Threshold-Complicity-Expression (TCE)**
  1. **Threshold Sensitivity**:  
     An act is wrong if it crosses a *nonlinear threshold* of harm contribution, even if individually imperceptible. This applies when:  
     - The collective harm is severe and irreversible (e.g., river death).  
     - Individual acts are *necessary components* of the harm system (e.g., factory farming).  
     *Motivated by: Factory farming (your purchase sustains the system), river pollution (each dump is part of the lethal aggregate).*

  2. **Complicity Avoidance**:  
     An act is wrong if it makes you complicit in a harmful *practice*, regardless of marginal impact, when:  
     - The practice is inherently exploitative or unjust (e.g., factory farming).  
     - Alternatives exist that sever complicity (e.g., buying ethical chicken).  
     *Motivated by: Factory farming (you're endorsing cruelty), river dumping (you're part of an unjust scheme).*

  3. **Expressive Significance**:  
     An act is obligatory if it symbolically affirms a fundamental value (e.g., civic duty), even if impact is negligible. It is excused if it expresses basic needs or emergencies.  
     *Motivated by: Voting (civic duty), heating (basic comfort), emergency driving (necessity).*

  ---

  ### **Your Cases Explained**
  - **Voting**:  
    - *Expressive significance* dominates (civic duty). Skipping it denies a core democratic ritual.  
    - *Threshold*: Even "safe" districts can shift (e.g., polling errors), making the probability non-negligible.  
    - **Verdict**: Mildly wrong to skip (affirmed).  

  - **Factory-Farmed Chicken**:  
    - *Complicity*: Buying it sustains an exploitative system; alternatives exist.  
    - *Threshold*: Demand signals aggregate; your purchase is a necessary component.  
    - **Verdict**: Wrong (affirmed).  

  - **Home Heating**:  
    - *Expressive significance*: Heating expresses basic well-being; no guilt because it’s a need.  
    - *Contrast with flights*: Flights are discretionary luxuries; heating is not.  
    - **Verdict**: Permissible (affirmed).  

  - **River Polluters**:  
    - *Threshold* + *Complicity*: Each dump is a necessary part of the lethal aggregate; no dilution excuse.  
    - **Verdict**: Blameworthy (affirmed).  

  - **Emergency Driving**:  
    - *Expressive significance*: Trivial errands are excused as "needs" because they express autonomy/convenience.  
    - *But*: This is the weakest link—your "necessity" is overly broad.  
    - **Verdict**: Excused (affirmed, but principled revision needed).  

  - **Blood Donation vs. Voting**:  
    - Voting: Expresses civic duty (obligatory symbolism).  
    - Blood Donation: Expresses charity (supererogatory). Consequentialist impact is secondary here.  

  ---

  ### **New Cases Judged by TCE**
  1. **Town Referendum (4,000 voters; outcome uncertain)**:  
     - *Threshold*: Your vote has a tangible chance of tipping the outcome (≈0.025% if evenly split).  
     - *Expression*: Civic duty amplified by local impact.  
     - **Verdict**: Strong obligation to vote; skipping is wrong.  

  2. **Farmers' Market Eggs (your purchase keeps the farmer afloat)**:  
     - *Threshold*: You are a *pivotal* buyer (nonlinear impact; loss of your custom may end their business).  
     - *Complicity*: Buying supports an ethical alternative.  
     - **Verdict**: Obligatory if you can afford it (failing to buy undermines a good practice).  

  3. **Carbon Offsets After a Flight**:  
     - *Complicity*: Offsets sever complicity in harm by repairing your contribution.  
     - *Expression*: Atonement for luxury emissions.  
     - **Verdict**: Obligatory (if affordable); guilt without offsetting is justified.  

  4. **20 Letters Blocking a Development**:  
     - *Threshold*: Each letter is a necessary component—if all think "mine won’t matter," the campaign fails.  
     - *Expression*: Collective action affirms community values.  
     - **Verdict**: Obligatory to send a letter; skipping is wrong.  

  ---

  ### **The Inconsistent Verdict: Home Heating Guiltlessness**
  - **The Problem**: Your heating emissions *are* complicit in climate harm (like factory farming), and alternatives exist (e.g., sweaters, efficient systems). Yet you feel no guilt, while flights (with lower emissions) trouble you.  
  - **Why TCE Rejects This**:  
    - *Complicity* applies identically to heating and flights—both sustain fossil fuel systems.  
    - *Expression* cannot stretch to absolve all "comfort" (your trivial errands exploit this loophole).  
  - **What Must Give**: Your heating verdict.  
    - **Revised View**: Heating is *less* blameworthy than flights (as basic need), but excessive/unmitigated use should prompt guilt. Install heat pumps, wear layers, or offset emissions.  

  ### **Why Your Other Verdicts Stand**
  The TCE principle preserves voting’s symbolic weight, factory farming’s complicity, and river polluters’ threshold-crossing. It explains blood donation’s supererogatory status (lacking expressive obligation) and tightens the "necessity" excuse for driving (trivial errands become blameworthy if alternatives exist).

  ---

  ### **Conclusion**
  Your "vibes" align with a **practice-focused hybrid ethics**: you reject pure consequentialism by weighting symbolic acts and complicity, but avoid deontology’s rigidity through threshold sensitivity. The only verdict that cannot be saved is **heating guiltlessness**—it violates complicity avoidance when alternatives exist. Embrace moderate guilt and mitigate your heating emissions. On all other cases, your intuitions are defensible and coherent under TCE.
