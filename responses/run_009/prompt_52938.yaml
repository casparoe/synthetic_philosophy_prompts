prompt: |-
  Two philosophers — a committed non-reductive physicalist and a philosopher persuaded by the causal exclusion argument that mental properties, if irreducible, are causally idle — have spent three years arguing about mental causation and have agreed to run an adversarial collaboration. Draft the joint statement they should produce.

  The document must contain, in this order:

  1. An agreed-claims section (numbered) covering what both can sign: the causal closure of physics as they will jointly understand it (including any agreed limits of that principle — e.g., whether "closed under physics" means no non-physical causes, not that physics is complete), the causal inheritance intuition each concedes in his own idiom, and the shared insistence that the dispute does not turn on dualism, since both are physicalists.

  2. A disagreements section, as a table, stating the residual disputes in wording each side would accept for its own view: at minimum, (a) whether causal overdetermination is an option or a cost; (b) whether the exclusion principle's "sufficient cause" is a notion of production, of contrastive explanatory relevance, or something the two parties were using differently all along; (c) whether reduction of the mental preserves what mattered about mentality or forfeits it; and (d) whether the argument generalizes — whether, if it works against mental causes, it equally threatens the causal efficacy of biological, geological, and thermodynamic properties, and whether that generalization is a reductio of the argument or of higher-level causation generally.

  3. A cruxes section with, for each crux, a case or argument both sides agree bears on it, plus each side's prediction recorded in advance. At least two cruxes should engage engineered systems where the relevant facts are uncontested — for example, a simulated reinforcement-learning agent whose "beliefs" are explicitly represented as high-level variables over a fully known substrate, or a virtual machine whose instruction-level states are multiply realizable across processors. State what each philosopher predicts an interventionist account of causation would find in such systems, and where those predictions come apart.

  4. A short closing note, signed jointly, addressing the question the two cannot resolve in a signed document: state how confident the drafter is in the formulations above, and identify the single numbered agreed claim or table entry the drafter is least sure both parties would actually endorse as worded, with a sentence on why.

  Do not quote either party or any published author verbatim; attribute the exclusion argument to Jaegwon Kim by name once, and otherwise argue from the structure of the views. Avoid vacuous agreed claims — anything both would sign but that no one disputes in this debate — and avoid formulations that quietly decide a contested question (e.g., don't stipulate that causation is production when contrastive explanation is at issue).
reasoning: |-
  We are drafting a joint statement for two philosophers: 
   - A committed non-reductive physicalist (NRP) who believes mental properties are real and causally efficacious without being reducible to physical properties.
   - A philosopher persuaded by the causal exclusion argument (CEA) that if mental properties are irreducible, then they are causally idle.

   The document must have four sections: agreed claims, disagreements (as a table), cruxes, and a closing note.

   Section 1: Agreed Claims (numbered)
   - Both agree on the causal closure of physics (CCP). We must state it clearly, including any agreed limits. 
     - CCP: Every physical event that has a cause has a sufficient physical cause at the time it occurs. (Note: This does not necessarily entail that physics is complete in the sense of accounting for all phenomena, but it does entail that there are no non-physical causes of physical events.)
   - Both are physicalists: they agree that everything is physical, or supervenes on the physical. There is no dualism.
   - Both concede a causal inheritance intuition: 
     - The NRP holds that if a mental property is realized by a physical property, then the mental property inherits its causal powers from the physical realizer. However, the NRP insists that the mental property can still be causally relevant in its own right, without being identical to the physical property.
     - The CEA proponent concedes that if mental properties were reducible, they could inherit causal efficacy via reduction, but maintains that without reduction, they cannot. The CEA proponent also agrees that if a higher-level property is reducible, then it can be causally efficacious without overdetermination.

   Section 2: Disagreements (as a table)
   We need a table with at least the following rows for (a) to (d). Each row should have two columns: one for the NRP and one for the CEA proponent.

   (a) Causal overdetermination: 
     - NRP: Accepts that overdetermination (in a benign, non-systematic form) is possible and occurs in the case of mental causation. 
     - CEA: Rejects overdetermination as a cost, because it would require that the physical cause alone is sufficient and the mental cause would be redundant.

   (b) Interpretation of "sufficient cause" in the exclusion principle:
     - The exclusion principle (Kim) states: If an event e has a sufficient cause c at a time t, then no other cause of e at t is possible, unless it is a case of overdetermination.
     - NRP: The notion of "sufficient cause" is not one of production but of contrastive explanatory relevance. Alternatively, the NRP might argue that the principle is ambiguous and that in the context of non-reductive physicalism, the mental cause is not a competing cause but operates at a different level.
     - CEA: The notion of "sufficient cause" is one of production: the physical cause produces the effect, and any other cause would be either identical or overdetermining.

   (c) Reduction and mentality:
     - NRP: Reduction of the mental to the physical would forfeit what matters about mentality (e.g., the subjective character, intentionality, or normative dimensions) because it would eliminate the mental level of description and explanation.
     - CEA: Reduction preserves what matters about mentality because it shows how mental properties are nothing over and above physical properties and hence can be causally efficacious without loss.

   (d) Generalization of the argument:
     - NRP: The exclusion argument, if successful against mental properties, would equally threaten the causal efficacy of biological, geological, and thermodynamic properties. This is a reductio of the argument because we know these higher-level properties are causally efficacious.
     - CEA: The argument does generalize, but that is not a reductio; instead, it shows that all higher-level properties that are irreducible are causally idle. However, the CEA proponent might hold that some higher-level properties can be reduced, so they are safe, or that the generalization is acceptable because we can have pragmatic explanations without real causation.

   Section 3: Cruxes
   We need at least two cruxes that engage engineered systems. Both sides agree on the facts of the system, but they predict different outcomes when applying an interventionist account of causation.

   Example 1: A simulated reinforcement-learning agent.
     - The agent has high-level states (e.g., "beliefs") that are explicitly represented as variables and are multiply realizable over a known physical substrate.
     - Interventionist account: We consider whether an intervention on the high-level state (while holding fixed the underlying physical state) would change the outcome, and vice versa.

     Predictions:
       - NRP: An intervention on the high-level state (e.g., changing the belief) while holding the physical state fixed (by finding an alternate physical realization for the same high-level state) would not be possible without changing the causal outcome. But if we consider a scenario where we intervene to change the high-level state and that intervention is implemented by a change in the physical state, then the high-level state is causally relevant. Alternatively, if we can find a case where the same physical state can realize different high-level states (if that is possible in the system), then an intervention on the high-level state without changing the physical state would show no effect? Actually, the NRP would argue that in typical cases, the high-level state supervenes on the physical, so you cannot change the high-level without changing the physical. Therefore, the NRP would focus on cases where the same high-level state can be realized by different physical states. The interventionist test would then be: if we set the high-level state to a particular value via different physical realizations, does the outcome (the agent's action) depend on the high-level state? The NRP says yes.

       - CEA: The physical state is the real cause. Any intervention on the high-level state must be implemented by a change in the physical state, so the causal work is done by the physical. The high-level state is epiphenomenal.

     How they come apart: The NRP would say that the high-level state is causally relevant because it makes a difference to the outcome when we vary it (even if via different physical realizations). The CEA would say that the variation in the outcome is due to the variation in the physical realizers, not the high-level state itself.

   Example 2: A virtual machine.
     - The virtual machine has instruction-level states (e.g., the value of a register in the virtual machine) that are multiply realizable across different physical processors.
     - Intervention: Change the virtual machine state (e.g., by changing the register value) and see if it affects the output of a program, while holding fixed the processor's physical state? But note: holding fixed the physical state while changing the virtual state is impossible if the virtual state supervenes on the physical. So we must consider interventions that change the virtual state by changing the physical state in a way that corresponds to the virtual change.

     Alternatively, we can consider two different physical realizations of the same virtual state and see if they lead to the same outcome. Then, we can change the virtual state by changing from one physical realization to another that realizes a different virtual state, and see if the outcome changes. 

     Predictions:
       - NRP: The virtual state is causally relevant because the outcome (the program's output) depends on the virtual state. The same virtual state, regardless of the physical realization, produces the same output. Changing the virtual state (by any physical means) changes the output.
       - CEA: The physical state is what does the work. The virtual state is just a pattern in the physical. The pattern itself doesn't cause anything; the physical substrate does.

     How they come apart: The NRP would point to the counterfactual: if the virtual state had been different (even if realized by a different physical state), the output would have been different. The CEA would counter that the counterfactual is made true by the physical changes.

     We must state what an interventionist account of causation would find. The interventionist account (as per Woodward) says that X is a cause of Y if there is an intervention on X that changes Y, while holding fixed other variables. In the virtual machine, if we intervene to change the virtual register (by whatever physical means) and that changes the output, then the virtual register is a cause. However, the CEA proponent might argue that the intervention is really on the physical, so the virtual register is not the cause.

   Section 4: Closing note
     - We (the drafter) state our confidence in the formulations and identify the one agreed claim or table entry that we are least sure both parties would endorse as worded.

   Now, let's draft the document accordingly.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Mental Causation

  #### 1. Agreed Claims  
  Both parties, as physicalists, affirm the following:  
  1. **Causal Closure of Physics (CCP)**: Every physical event has a sufficient physical cause occurring at the time the event takes place, provided a cause exists. This principle entails that no *non-physical entity* causes physical events. It does not presuppose that physics is metaphysically or explanatorily complete (e.g., it allows for emergent properties).  
  2. **Causal Inheritance Intuition**:  
     - The non-reductive physicalist holds that if a mental property \(M\) is synchronically realized by a physical property \(P\), then the causal powers of \(M\) are inherited from \(P\) without requiring identity or reduction.  
     - The exclusion proponent agrees that *if* \(M\) were reducible to \(P\), \(M\) could inherit causal efficacy via reduction. Absent reduction, however, \(M\) cannot gain novel causal powers beyond \(P\)'s.  
  3. **Physicalist Commitment**: The dispute assumes a physicalist ontology: all entities/processes supervene on the physical. Dualism is dismissed as irrelevant to this discussion.  
  4. **Kim’s Exclusion Argument Structure**: Jaegwon Kim’s argument (that irreducible mental properties face exclusion by physical causes) is valid *if* its premises are granted. The disagreement centers on whether those premises hold.  

  #### 2. Disagreements  
  The table below summarizes residual disputes in mutually accepted phrasing:  

  | Issue | Non-Reductive Physicalist (NRP) Position | Exclusion Proponent (EP) Position |
  |-------|------------------------------------------|----------------------------------|
  | **(a) Causal Overdetermination** | Benign, non-systematic overdetermination occurs when distinct levels (e.g., mental and physical) cause the same effect without redundancy (e.g., as in ordinary cases of macroscopic causation). | Overdetermination is a prohibitive cost: if \(P\) is sufficient for an effect, \(M\)’s causal role is precluded. Systematic overdetermination trivializes mental causation. |
  | **(b) "Sufficient Cause" (in exclusion principle)** | "Sufficient cause" conflates production with contrastive explanatory relevance. The physical cause produces the effect, but mental properties explain *why* that cause occurred in a specific context (e.g., justifying actions). | "Sufficient cause" denotes production: if \(P\) produces an effect, no distinct property (e.g., \(M\)) can produce it without overdetermination. Explanatory relevance requires productive efficacy. |
  | **(c) Reduction & Mentality** | Reduction eliminates mentality’s distinctive features (e.g., subjectivity, intentionality) by flattening explanations to the physical. Non-reduction preserves mental causation without loss. | Reduction preserves mentality’s causal efficacy by grounding it in physical mechanisms. Non-reduction forfeits causal relevance, rendering mentality explanatorily inert. |
  | **(d) Argument Generalization** | Generalization to biology/geology/etc. is a *reductio*: it absurdly implies all "higher-level" properties are idle. This undermines science’s explanatory practice. | Generalization holds: irreducible higher-level properties *are* causally idle. Their utility is pragmatic, not ontological. Only reducible properties (e.g., thermodynamics) are causal. |

  #### 3. Cruxes  
  Both parties agree the following cases bear on the dispute and record predictions:  

  - **Crux 1: Simulated Reinforcement-Learning Agent**  
    *Case*: An AI agent’s "belief state" (high-level variable) is multiply realizable over a known substrate (e.g., neural network weights). We intervene to alter the belief while holding substrate variables fixed (via isomorphic reconfigurations).  
    - **NRP Prediction**: Interventionist causation will attribute causal relevance to the belief: varying it (via substrate changes) alters behavior, while fixed-belief substrate variations do not.  
    - **EP Prediction**: Only substrate changes affect outcomes; the belief is a dependent variable. "Interventions" on beliefs reduce to substrate manipulations, showing no autonomous high-level causation.  
    *Divergence*: NRP expects belief-state interventions to be causal *qua* high-level; EP expects causation to track only substrate variables.  

  - **Crux 2: Virtual Machine (VM) Instruction Execution**  
    *Case*: A VM executes an instruction (e.g., `ADD R1, R2`), multiply realizable across hardware. We test whether altering the instruction (e.g., to `SUB R1, R2`) changes output while preserving hardware state (via emulator-level adjustments).  
    - **NRP Prediction**: VM instructions are causes: interventions altering instructions change outputs, even when hardware states are non-identical but functionally equivalent.  
    - **EP Prediction**: Hardware states exclusively cause outputs; instruction changes necessitate hardware changes, revealing the latter as the true cause.  
    *Divergence*: NRP asserts VM states are *sui generis* causes under interventionism; EP contends causation collapses to hardware.  

  - **Crux 3: Biological Generalization**  
    *Case*: A neuron’s firing (physical) suffices for muscle contraction. Does the biological property "action potential" add causal power?  
    - **NRP Prediction**: Excluding biological properties implies neuroscientific explanations are epiphenomenal—a scientifically untenable result.  
    - **EP Prediction**: If irreducible, biological properties are excluded; their explanatory role is just heuristic. Reduction (e.g., to biochemistry) rescues causation.  

  #### 4. Closing Note  
  We jointly submit this statement as a provisional framework. While we stand by its accuracy to our positions, the drafter notes moderate confidence due to the risk of residual ambiguities. The least certain formulation is **Table (b)**, where "production" vs. "explanatory relevance" may embed unacknowledged assumptions about causation itself. Future work must dissect this further.  

  Signed,  
  [Name], Non-Reductive Physicalist  
  [Name], Exclusion Proponent  

  ---  
  *This document reflects three years of rigorous debate. It does not resolve our disagreement but crystallizes its core for ongoing inquiry.*
