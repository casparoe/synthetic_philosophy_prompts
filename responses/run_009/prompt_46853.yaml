answer: |-
  ## Abstract  
  This prospectus explores G. E. M. Anscombe's potential stance on lethal autonomous weapons systems (LAWS) through rigorous application of her core ethical principles: the absolute prohibition against intentional killing of the innocent (murder), the doctrine of double effect (DDE), and the irreplaceable moral significance of intention in action. It argues that Anscombe would condemn LAWS not necessarily for autonomy *as such*, but for fundamentally undermining the conditions necessary for the licit application of DDE and obscuring intentionality. Her critique would diverge sharply from consequentialist risk assessments by focusing on the intrinsic moral structure of the act of delegating life-and-death decisions to machines. However, extrapolating her position involves significant speculation concerning whether systemic delegation constitutes a new form of intentional indiscriminate violence, revealing a key limit of applying her framework to this novel technology.

  ---

  ## Argument Outline  

  **I. Anscombe's Core Framework Applied to LAWS**  
      A. **The Primacy of Intention and Double Effect:**  
          1. For Anscombe, moral permissibility hinges on whether death/damage is *intended* as means/end (murder) or merely *foreseen* as a side-effect of a legitimate act.  
          2. DDE demands that the good effect (e.g., destroying a legitimate military target) must be the directly intended act, the bad effect (civilian death) must be unintended and not the means to the good, and proportionality must be satisfied.  
      B. **The Problem of "Intention" in LAWS:**  
          1. **The Vacuum:** LAWS lack human intention *at the moment of target selection and engagement*. No human forms the specific intention to kill *this* particular person/group *at this* time.  
          2. **Designer/Commander Intention:** The relevant human intentions lie in the design, deployment parameters (e.g., target profiles, rules of engagement), and the decision to deploy the system.  
          3. **Key Question:** Can the deaths caused by LAWS be attributed to a *human intention* in a way that satisfies or violates DDE? Or does the autonomy create a moral void?  

  **II. Anscombe's Likely Critique: Delegation and the Erosion of Moral Structure**  
      A. **The Indeterminacy of Autonomy *as such*?**  
          1. Anscombe's framework focuses on the *act* (intention/object) and its *effects* (discrimination/proportionality).  
          2. A perfectly discriminating LAWS used proportionately *might* seem permissible *if* the civilian deaths it causes are genuinely unintended side-effects of attacking legitimate targets.  
          **BUT:**  
      B. **The Core Problem: Delegating Intention-Formation**  
          1. **Undermining DDE:** DDE requires a *human agent* forming a specific intention about a specific act. LAWS remove the human from the specific intention-formation loop.  
          2. **Obscuring Intention & Object:** The delegation blurs the link between the commander's/designer's *general* intention ("destroy enemy capability in area X") and the *specific* lethal act chosen by the machine. It becomes impossible to identify *whose* intention governs the specific killing or whether the machine's "choice" reflects a licit object.  
          3. **Risk of Inherent Indiscrimination:** Designing a system to make kill-decisions inherently involves programming it with criteria that *may* equate to intending civilian deaths (e.g., if "military advantage" is algorithmically prioritized in a way that inherently discounts non-combatant immunity). The *system itself* cannot "intend" discrimination; its discrimination is a function of programming and sensor input.  
      C. **The Verdict:** Anscombe would likely argue LAWS make it *structurally impossible* to satisfy DDE and ensure non-combatant immunity is respected as an absolute prohibition. The delegation inherently risks creating situations where civilian deaths are functionally intended by the system's operational logic, even if no human *wills* a specific death. This constitutes a novel form of potential "murder of the innocent" enabled by the technology's architecture.  

  **III. Divergence from Consequentialist Critiques**  
      A. **Consequentialist Concerns:** Focus on risks - malfunction, hacking, escalation, proliferation, erosion of accountability, difficulty assigning blame, lowering threshold for war.  
      B. **Anscombe's Rejection:**  
          1. She would dismiss these as secondary to the *intrinsic moral wrong* of the delegation itself.  
          2. **Her Focus:** Even if LAWS *reduced* civilian casualties statistically (a consequentialist hope), she would condemn them if the *way* they cause death involves the structural obscuring or delegation of intention necessary for DDE, potentially treating innocents as permissible targets within the system's logic.  
          3. **The Absolute Barrier:** For Anscombe, the absolute prohibition on murdering the innocent *cannot* be outweighed by good consequences or risk mitigation. The act-type (delegating kill-decisions) is inherently suspect and likely violates this prohibition by its very nature.  

  **IV. Point of Genuine Speculation: Delegation as Systemic Intentionality**  
      A. **The Speculative Leap:** While Anscombe clearly condemns *individuals* forming murderous intentions, does her framework definitively categorize the act of *creating a system designed to autonomously perform acts that would be murder if done with human intention* as itself a new *form* of intentional murder?  
      B. **Arguments Either Way:**  
          *   **Yes:** Designing and deploying LAWS knowing they *will* inevitably kill innocents based on their programming *could* be seen as intentionally creating a "murderous system," making the designers/commanders responsible for the *category* of killings it performs, even without specific intent for each death.  
          *   **No:** Her focus is intensely on the *individual human act and its intention*. The lack of a human forming the specific intention *in actu* might lead her to see LAWS killings as tragic accidents or unforeseeable consequences falling outside "murder," however morally repugnant the delegation is.  
      C. **Why Speculative:** Anscombe's writings focus on individual agency and proximate intention. She does not systematically address complex delegation or systemic agency where intention is embedded in institutions and technologies rather than individual minds at the moment of action. **This is where disciplined extrapolation ends, and reasoned speculation begins.** Students must grapple with whether her absolute prohibition extends to *institutionalizing* lethal decision-making in a way that bypasses individual human intention in the act.  

  **Conclusion:** Anscombe would likely condemn LAWS as incompatible with the absolute prohibition on murdering the innocent, primarily because their autonomy structurally undermines the conditions for applying double effect and obscures the intentionality crucial to distinguishing licit killing from murder. Her critique would fundamentally differ from consequentialism by targeting the nature of the act (delegation) rather than its risks. However, definitively classifying LAWS killings *as murder* within her framework requires speculating on how she would conceptualize systemic intentionality – a point where her principles alone do not yield a certain answer.
