  - Marcus advocates for ontic structural realism (OSR) where relations are fundamental and objects dissolve into structural positions
  - Priya defends epistemic structural realism (ESR) where objects exist but we can only know their relational properties

  The database metaphors are crucial here. Marcus's "schema without rows" vs Priya's "edge list without node table" create concrete analogies for abstract philosophical concepts. I should evaluate each argument in both philosophical and database/graph theory terms.

  For Marcus's opening move:
  His particle-as-bundle-of-values view aligns with OSR's core tenet. The database analogy holds - each particle is like a row defined entirely by foreign keys to other relational data. But Priya's counter about nodes being necessary for edges makes graph theory sense. In standard graph definitions, edges depend on pre-existing nodes.

  On Marcus's graph permutation defense:
  His unlabeled graph example is mathematically valid - vertices are indistinguishable when defined by adjacency alone. This supports his "no node substance" claim. Priya hasn't addressed how quantum indistinguishability might strengthen this point.

  Regarding Newman's objection:
