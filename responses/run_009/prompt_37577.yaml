answer: |-
  The law of evidence embodies a **pragmatic hybrid epistemology** that blends foundationalist, coherentist, and instrumental elements to resolve the tension between infinite regress and practical necessity. Below is a reconstruction of its implicit structure, points of underdetermination, and the consequences of adopting infinitism:

  ### 1. **Implicit Epistemology: A Structured Hybrid**
     - **Judicial Notice as Limited Foundationalism**:  
       Courts treat certain facts (e.g., "water boils at 100°C at sea level," historical dates) as **contextually basic**. These are not "self-warranting" in an absolute sense but derive authority from **socially reinforced certainty**. The restriction to "common knowledge" or "indisputable facts" (e.g., FRE 201) avoids subjectivity by tethering foundationalism to **intersubjective verification**. *Why not broader?* To prevent judicial overreach and maintain adversarial fairness—expanding it would risk substituting judicial bias for evidence.
     
     - **Presumptions & Burdens as Pragmatic Instrumentalism**:  
       Rules like *res ipsa loquitur* (negligence presumed from the event itself) or the presumption of mailing receipt are **procedural shortcuts**. They reflect:
       - **Policy goals** (e.g., incentivizing evidence preservation),
       - **Empirical generalizations** (e.g., letters usually arrive if properly mailed),
       - **Risk allocation** (e.g., placing burden on the party with superior access to evidence).  
       This is less about "tracking justification" than **resolving uncertainty decisively** to avoid deadlock.

     - **Coherentist Undercurrents**:  
       Evidence is evaluated as a **web of mutual support**. Testimony corroborated by documents, which align with physical evidence, generates "narrative coherence." Foundational facts (via judicial notice) and presumptions act as **fixed nodes** that stabilize the web, but the system tolerates circularity (e.g., a witness’s credibility supported by evidence their testimony helps authenticate).

  ### 2. **Underdetermination Between Theories**
     - **Judicial Notice**: Could be seen as foundationalist (basic beliefs) *or* coherentist (deeply embedded in a stable web of common knowledge). Its "indisputability" criterion is ambiguous: Is it ontological (truths beyond doubt) or sociological (facts the community agrees on)?
     - **Presumptions**: Are they epistemic (inferences from typicality) or purely procedural (allocating risk regardless of truth)? *Example*: The presumption of innocence is both moral (protecting rights) and probabilistic (most accused aren’t guilty).
     - **Burden Shifting**: Pragmatic (e.g., plaintiff proves injury, defendant proves contributory negligence) but implicitly relies on coherentist reasoning about typical causal relationships.

  ### 3. **Infinitism in the Courtroom: A Thought Experiment**  
     Adopting infinitism—where *every* claim requires further justification *ad infinitum*—would paralyze trials. Key changes:
     - **Collapse of Judicial Notice**: No fact could be "noticed" without infinite chains (e.g., "How do we *know* gravity exists?" → "Cite peer-reviewed physics" → "How do we *know* the journals are reliable?").
     - **Erosion of Presumptions**: Presumptions like "people act in conformity with habit" (FRE 406) would demand endless proof of behavioral psychology.
     - **Testimonial Regress**: Witnesses could be cross-examined infinitely ("How do you know your perception was accurate?" → "How do you know your memory is reliable?" → "How do you know memory mechanisms function normally?").
     - **Practical Consequences**:  
       - Trials become interminable and prohibitively expensive.  
       - Verdicts rarely reached, undermining law’s dispute-resolution function.  
       - Power shifts to parties who can out-resource opponents in generating regress.  
       - **Paradox**: Demanding infinite justification for *all* claims would include infinitism itself ("How do you justify infinitism?" → infinite regress).

  ---

  ### Conclusion: Law’s Epistemological Pragmatism
  The evidence system presupposes that **justification must terminate** at socially/practically validated points. It is neither purely foundationalist (due to its reliance on coherence and policy) nor purely coherentist (due to its foundational stops). Instead, it uses **bounded rationality**:
  - Foundationalism for uncontested social knowledge,  
  - Coherentism for evaluating evidence holistically,  
  - Instrumentalism where epistemology hits practical limits.  

  Infinitism is incompatible with law’s core function: rendering **timely, authoritative decisions** under uncertainty. The rules of evidence reflect an unspoken epistemic humility: courts seek *sufficient* justification for practical purposes, not infinite certainty.
