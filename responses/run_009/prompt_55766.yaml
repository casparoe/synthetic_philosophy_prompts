prompt: |-
  my friend Maya is deep into animal welfare, like she thinks most of what matters morally right now is factory farming. her friend Dev thinks basically none of that matters and what matters is reducing existential risk for the far future. they're close though, so they do this thing called moral trade, where each of you does what the other values since it's usually cheap for you and vice versa. Maya gives Dev's whole worldview maybe a 10-15% chance of being correct, fwiw.

  her track record so far, the deals she's said yes or no to:

  - Dev gave up chicken entirely, and in exchange she donates $15 a month to his favorite x-risk org, which she thinks mostly pushes paper around. accepted.
  - Dev offered that if she volunteered a month every summer at his org, he'd go fully vegan and drag his very meat-loving family along with it. she said no, said it was to much.
  - Dev does vegetarian lent every year, and in exchange she put a bequest to his org in her will (her words: money after you're dead is the cheapest concession there is). accepted.
  - Dev offered to cover a year of printing costs for her group if she'd give a toast at a mutual friend's party making the case for his views. she turned it down, which surprised me, it seemed basically free.

  now there's a big one on the table. Dev is coming into some money and says that if Maya leaves her job at the animal nonprofit for two years to work at his org — he insists she's exactly the kind of person they need — he'll bankroll a corporate campaign that by her own estimates would spare around three million hens from cages. her own estimate is that two years at her current job spares about five million. so on her picture of the world she'd be netting minus two million hens for two years of her life, but she does hold that small credence that the far future stuff dominates everything, and under that view the two years could matter more than everything else she'll ever do.

  what's she going to say? I'm less interested in the yes/no than in the rule she's actually running. is it expected value across her moral uncertainty, that moral parliament kind of thing? is it more like "trade the cheap stuff, but your one life isn't up for a vote" (which would explain the summer volunteering rejection, and maybe the toast)? or "only take deals that come out ok whichever moral view turns out true"? do all of those even fit her record, including the toast one, which still bugs me? give me your best guess with reasons, and then tell me what deal you'd offer her next to tell the surviving rules apart.
reasoning: |-
  Hmm, the user is describing a fascinating moral trade dynamic between Maya and Dev. Maya prioritizes animal welfare (especially factory farming) while Dev focuses on existential risk reduction. They engage in "moral trades" where each acts on the other's values when it's relatively low-cost for them. The user wants to understand the implicit rules Maya follows in accepting/rejecting these trades, especially given the puzzling rejection of the "free toast" proposal.

  First, let's break down the pattern from her track record:
  - She accepts low-cost/high-impact trades: $15/month donation (cheap for her) in exchange for Dev giving up chicken (high impact for her cause)
  - She rejects high-personal-cost asks: The summer volunteering demand was too burdensome
  - She accepts "cheapest concessions": Bequest in will (post-death money has no opportunity cost)
  - She rejects the toast request despite it seeming free - this is the anomaly

  The toast rejection is particularly interesting. If it was truly "free," why refuse? Possible explanations:
  1) Social/emotional cost: Making an insincere toast might violate her integrity
  2) Signaling risk: Endorsing Dev's views could undermine her own cause's credibility
  3) Hidden valuation: She might assign negative value to promoting views she considers 85-90% wrong

  For the big current proposal (2 years at Dev's org vs 3M hens spared), the math suggests:
  - Under her view: -2M hens (since her current job would save 5M vs the deal's 3M)
  - Under Dev's view: Potentially astronomical positive value
  - With her 10-15% credence in Dev's view, expected value might slightly favor accepting

  But her rejection patterns suggest Maya operates with non-utilitarian constraints:
  - Personal cost ceiling: She won't trade major life chunks (like career years)
  - Authenticity boundary: Won't endorse opposing views (toast rejection)
  - Zero-risk principle? The bequest and small donations don't risk active harm to her cause

  The "moral parliament" model (weighting both views) fits most decisions except the toast. That implies an additional rule: "Don't actively promote disbelieved views" even when materially cheap.

  To test this, I'd propose:
  1) A materially costly but ideologically neutral trade (e.g., "I'll volunteer at your shelter if you data-clean for my AI safety project")
  2) A trivial promotion ask without audience (e.g., "Share our post anonymously")
  3) A high-impact animal welfare trade requiring minimal Dev effort but high Maya cost

  The pattern would reveal whether ideological contamination or pure cost aversion drives her boundaries.
answer: |-
  Based on Maya's pattern of decisions and the principles of moral trade, here's my analysis of the implicit rules she's likely following, why the toast rejection fits, predictions for the big ask, and a test proposal to distinguish the rules.

  ### Maya's Likely Decision Rules (Best Fit)
  1. **Core Principle: Cost-Sensitivity with a Personal Autonomy Floor**  
     She accepts trades where her *personal sacrifice* (time, effort, life disruption) is low relative to Dev's concession, **unless** it violates her integrity or core life priorities. She rejects trades demanding high personal cost (e.g., the summer volunteering) or compromising her values (e.g., the toast).  

  2. **Moral Uncertainty as a Tiebreaker, Not Driver**  
     Her 10–15% credence in Dev's view justifies small, low-cost trades (e.g., $15/month, the bequest). But it doesn't override major life decisions or integrity concerns. Expected value calculations only *tip the scales* when personal costs are marginal.  

  3. **Anti-Promotion Clause**  
     She refuses actions that actively endorse views she disagrees with—even if materially "free" (explaining the toast rejection). Promoting Dev's cause risks legitimizing what she sees as 85–90% misguided, conflicting with her advocacy.  

  4. **Zero-Risk Baseline**  
     She prefers trades that are neutral or positive *even if her view is 100% correct* (e.g., Dev going vegetarian helps animals regardless of x-risk). She avoids deals that are net-negative under her worldview unless the cost is trivial (e.g., the bequest).  

  **Why This Fits All Decisions**:  
  - ✅ **Chicken/$15 trade**: Low cost for her, high impact for her cause. Positive under her view.  
  - ❌ **Summer volunteering**: High personal cost (1 month/year). Fails autonomy floor.  
  - ✅ **Bequest**: Zero cost while alive. Positive under her view (Dev’s vegetarianism).  
  - ❌ **Toast**: Materially free but violates anti-promotion. Social/emotional cost of endorsing nonsense.  
  - *Big ask prediction*: She’ll **reject** Dev’s offer. Swapping her job for 2 years (-5M hens + 3M hens = -2M hens net under her view) fails the cost-sensitivity and zero-risk tests. Her 15% credence isn’t enough to offset the career/autonomy sacrifice.  

  ---

  ### Testing the Rules: A Diagnostic Trade Proposal  
  To distinguish between "expected value," "autonomy floor," and "zero-risk" rules, propose this:  
  > *"Dev funds a corporate campaign sparing 500K hens (low impact for Maya) in exchange for Maya taking a 1-week course on AI safety (low time cost)."*  

  - **If she accepts**: Supports **expected value** rule. A minor cost (1 week) for modest animal gains fits her uncertainty calculus.  
  - **If she rejects**: Confirms **autonomy/integrity** rule. Even small acts (like training) might feel like endorsing Dev’s worldview.  
  - **If she counters**: E.g., "Only if Dev also goes vegan," it emphasizes **zero-risk baseline**. She ensures the deal isn’t net-negative under her view.  

  **Why this works**:  
  - Low personal cost (1 week vs. 2 years) isolates whether *any* involvement in Dev’s cause is vetoed by integrity.  
  - The small animal impact (500K hens) is trivial under her view—revealing if she requires strict non-negativity.  
  - Her response clarifies if moral uncertainty ever *drives* action beyond token gestures.  

  ---  
  **Final Thought**: Maya’s rules prioritize her values, autonomy, and credibility. Dev’s big ask fails because it treats her life as a bargaining chip—something her "no" to the toast hinted at. Moral trade works for marginalia, not identity-defining commitments. If you run this test, watch her reaction to the *framing* ("learning about x-risk" vs. "supporting Dev’s work"); that’ll reveal if anti-promotion is the hidden barrier.
