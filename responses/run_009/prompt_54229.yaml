answer: |-
  Your analysis cuts to the core of democratic legitimacy in urban governance. Let's reconstruct the implicit theories, test their coherence, and envision alternatives.

  ### Implicit Theories Behind Current Practice
  1. **Concentrated Costs Principle**:  
     Those facing immediate, tangible harms (noise, views, parking) deserve procedural priority because they bear disproportionate burdens. Diffuse benefits (regional housing supply, economic growth) are non-excludable and thus politically "unownable."

  2. **Proximity-as-Proxy**:  
     Physical adjacency substitutes for direct impact measurement. Property ownership within X feet is an administrable bright-line rule, assuming correlation between proximity and stake intensity. Environmental review's wider scope acknowledges that some impacts (pollution, traffic) defy proximity boundaries.

  3. **Status Quo Entitlement**:  
     Existing residents are the polity's constitutive members. Future residents lack political existence until they arrive. Zoning boards act as trustees for the *current* community's character, implicitly treating development as a loss imposition rather than opportunity creation.

  4. **Property-Centric Standing**:  
     Ownership grants unique standing because land use decisions alter property rights' value and enjoyment. Renters (even existing ones) often lack equivalent voice, underscoring a propertied conception of stakeholding.

  **Where Practice is Underdetermined**:  
  All these theories converge on excluding future residents, but for different reasons. A "status quo entitlement" view might allow overriding neighbors if regional needs were extreme, while a "concentrated costs" theory could not. Similarly, proximity rules could be adjusted (e.g., 500m vs. 200m) without abandoning the core paradigm.

  ### The Affected-Interests Objection
  **The Challenge**: Yes, prospective residents are profoundly affected—they’re denied housing options, commute times, or even homelessness. But direct participation is impossible: they’re unidentified, non-existent, or statistically aggregated. This doesn’t sink the principle; it demands *institutional innovation*:
  - **Proxy Advocates**: A city housing advocate with subpoena power to counter NIMBY claims with regional data.  
  - **Deliberative Panels**: Lottery-selected citizens (including renters, commuters) reviewing projects for citywide impacts.  
  - **Future Representatives**: NGOs for housing-insecure populations given standing at hearings.  
  - **Impact Witnessing**: Developers presenting testimony from tenants of past projects (e.g., "This building housed nurses from our hospital").  

  **Coherence Test**: The asymmetry doesn’t invalidate affected-interests theory—it reveals *selective application*. Environmental review quantifies diffuse *costs* (traffic, pollution) but ignores diffuse *benefits* (housing accessibility, job proximity). The system can measure regional emissions but not regional displacement; this is a choice, not inevitability.

  ### Concrete Changes Under an Affected-Interests Regime
  If future/population-wide interests had equal standing:
  1. **Notice & Outreach**:  
     - Mailings to community boards, transit agencies, and housing nonprofits within 5 miles.  
     - Public ads in regional papers and online portals for "interested future residents."  
     - Developer-funded outreach to displaced communities (e.g., those priced out of area).

  2. **Standing to Testify**:  
     - City planners present regional housing need assessments.  
     - Labor unions testify on worker shortages.  
     - Housing advocates represent demographic groups (e.g., "This project would house 50 low-income families currently in shelters").  

  3. **Valid Objection Grounds**:  
     - Localized harms (shadow, congestion) must be quantified and mitigated, not veto-worthy.  
     - "Neighborhood character" claims require historical/district evidence, not subjective preference.  
     - Board must weigh *net* regional impact: "Will blocking this increase sprawl/commutes?"  

  4. **Surviving Neighborhood Input**:  
     - **Problem-Solving Role**: Neighbors propose design tweaks (setbacks, facades) but can’t veto density.  
     - **Mitigation Bargaining**: Developers fund local parks or traffic calming in exchange for support.  
     - **Neighborhood Caps**: If area meets regional housing targets, stricter local review triggers (e.g., Boston’s "affirmative fair housing" compliance).  

  ### Why This Isn’t Radical
  Precedents exist:  
  - **Housing Elements**: California mandates cities zone for regional needs.  
  - **Environmental Justice**: EPA requires assessing impacts on vulnerable groups.  
  - **Development Corporations**: UK/NYC entities with citywide remit override local opposition.  

  **The Realignment**: Current practice treats land use as a neighborhood-level negotiation. An affected-interests model treats it as infrastructure planning—like approving a subway line where riders don’t yet exist. The shift isn’t from localism to technocracy, but from exclusionary proceduralism to inclusive consequentialism.
