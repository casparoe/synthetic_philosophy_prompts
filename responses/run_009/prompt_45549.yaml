answer: |-
  The aviation industry's dual approach reflects a sophisticated, pragmatic understanding of human-system interaction rather than a strict commitment to philosophical theories like extended mind. Let's reconstruct the implicit theory:

  ### Core Presuppositions & Tensions
  1. **Contextual Agency Boundaries**  
     - **Investigations**: Treat agency as *distributed* across human + machine + procedure. "Pilot error" is seen as a symptom of system design flaws (e.g., misleading instrument layout, ambiguous checklist wording).  
     - **Licensing/Enforcement**: Treats agency as *individual* when certifying competence or assigning legal responsibility. Pilots must demonstrate mastery of tools/procedures under pressure.

  2. **Skill as Scaffolded Performance**  
     Skill is presupposed as:  
     - **Embedded**: Proficiency exists only within the cockpit ecosystem (yoke, checklists, CRM).  
     - **Testable**: Individuals must prove reliable integration with this scaffold during recurrent training.  
     - **Accountable**: Captains retain final authority over the system, hence liability when negligence occurs.

  3. **The Immunity-for-Truth Bargain**  
     Investigations strictly presuppose:  
     - Honest participant testimony requires legal protection.  
     - Fixing systems prevents future harm more effectively than punishing individuals.  
     - **Not required**: Belief that checklists are *literal cognitive parts*. Pragmatic efficacy alone justifies the approach.

  ### Extended Mind Thesis (EMT): Compatibility vs Necessity
  - **Sits Comfortably With**:  
    Aviation practice aligns with EMT in treating laminated checklists/avionics as *functional extensions* of cognition. Errors in "transactive memory" (e.g., miscommunication) are diagnosed as system failures.  
  - **Does Not Presuppose**:  
    EMT’s metaphysical claim that tools are *constitutively* part of the mind. Aviation needs only:  
    - Tools are *reliable scaffolds* for cognition.  
    - System redesign can mitigate human limitations.  

  ### Licensing Enforcement: No Inconsistent Internalism
  Licensing assumes pilots must:  
  - **Internalize scaffold mastery** (procedures become "second nature").  
  - **Remain the critical node** for decision authority.  
  This *complements* systemic investigations by ensuring individual competence to operate within the extended system. No contradiction: one focuses on *designing resilient systems*, the other on *certifying competent operators*.

  ### What Would Change Under Explicit EMT Adoption?
  1. **Radical Redesign Logic**  
     Failures might trigger rethinking *entire roles* (e.g., "Should pilots still manage this automation?" rather than "Improve the alerting system").  

  2. **Expanded "System" Boundaries**  
     Investigators might analyze ATC interactions, airline scheduling pressures, or maintenance logs as *constitutive parts* of cockpit cognition.  

  3. **Redefined Proficiency Standards**  
     Checks could emphasize seamless human-tool integration over isolated skills (e.g., testing memory-without-checklist as irrelevant).  

  ### What If EMT Were Explicitly Rejected?
  - **Minimal Practical Change**:  
    Current practices could continue unchanged. The no-blame protocol relies on *functional utility* (better data → better fixes), not metaphysical claims. "Scaffolding" metaphors suffice without endorsing mind-extension.  
  - **Risks**:  
    Rejection might encourage regressive "pilot error" diagnoses, undermining systemic solutions. EMT’s value is heuristic, not foundational.

  ### The Implicit Theory: Pragmatic Scaffolding Realism
  Aviation presupposes:  
  - Minds are *dependent* on reliable external structures for high-stakes performance.  
  - Individuals remain accountable for engaging those structures competently.  
  - **Boundary of the mind is irrelevant**; what matters is that cognition *operates through* integrated systems requiring holistic optimization.  

  This duality persists because it works: systemic fixes reduce accidents, while individual accountability maintains standards. EMT offers a compelling *description* of this symbiosis but isn’t its operating principle. The true foundation is **pragmatic resilience engineering** — where truth-telling, redesign, and accountability serve complementary safety functions.
