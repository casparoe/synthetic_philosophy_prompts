prompt: |-
  I teach a historiography seminar for undergrads (14 students, one 80-minute session) and I want them to actually feel hindsight bias and the narrative fallacy rather than just read about them. Design an activity built around predictions: students should be asked to forecast how some real historical episode turned out before they know the outcome, get the outcome revealed, then be asked to explain it -- and the punchline should be them realizing how inevitable and over-determined their explanation makes the outcome feel, even though they just failed to predict it. Ideally there's a second phase where they rate how predictable the outcome was, so we can catch them rating it as more obvious than their own failed forecasts could possibly justify. Use an episode that's real but obscure enough that most of them won't already know how it went -- suggest one or two candidates and tell me why they work. I want concrete rules, timing, and worksheets/questionnaires I can print. Then a debrief that clearly separates the two ideas: hindsight bias as a memory/knowledge-contamination effect versus the narrative fallacy as the urge to compress messy contingency into a tidy causal story. Finally, be honest about what a 80-minute classroom version can't reproduce (e.g. the emotional distance of real historical distance, or the months/years over which real analysts sat with their uncertainty), and what I'll have to just assert in the debrief.
reasoning: |-
  We are designing an 80-minute seminar activity to help students experience hindsight bias and the narrative fallacy. The activity will have students predict an outcome of a historical event they are unlikely to know, then after revealing the outcome, they will explain it. Then they will rate the predictability of the outcome. We need an obscure historical event.

  Event Candidates:

  1. **The 1904 World's Fair (Louisiana Purchase Exposition) in St. Louis: The Olympic Marathon Debacle.**
     - Why it works: It's a discrete event with a clear outcome. Most students won't know the details. The marathon was a fiasco due to extreme heat, poor organization, and one runner being given strychnine (as a stimulant) and brandy by his trainers. The winner was carried over the finish line by his trainers. It's a great example because the outcome is surprising and the factors leading to it are multiple and contingent, but after knowing the outcome, it seems inevitable that it would be a disaster.

  2. **The 1938 British Mount Everest Expedition.**
     - Why it works: This expedition was the first serious attempt to climb Everest. The outcome was that they failed to reach the summit due to a combination of weather, logistical issues, and the unexpected difficulty of the last part of the climb. The story is compelling because it sets the stage for later successes and the challenges seem obvious in hindsight.

  I choose the **1904 Olympic Marathon** because it's more contained and has a clear, dramatic outcome that is easy to predict or not predict. Also, it has multiple factors that can be discussed.

  Activity Design:

  **Total Time: 80 minutes**

  **Materials:**
  - Worksheet 1 (Prediction Phase)
  - Worksheet 2 (Explanation and Rating Phase)
  - A timer

  **Phase 1: Prediction (20 minutes)**
  1. Introduce the activity (2 min): Explain that the class will explore how we think about historical events by trying to predict an outcome of a real historical episode. Emphasize that they should not look up anything and that the event is chosen because it's obscure.
  2. Present the context (5 min): Give a brief background of the 1904 Olympic Marathon without revealing the outcome. 
     - Context: 
       - The marathon was held in St. Louis during the World's Fair in August. 
       - The weather was extremely hot and humid (around 90°F/32°C). 
       - The course was described as hilly and on dusty roads with little shade. 
       - There were only 32 runners, many of whom were not experienced long-distance runners. 
       - The organizers did not provide water stations along the course because they believed it was unhealthy to drink water during exercise. 
       - One of the runners (Fred Lorz) actually dropped out after 9 miles and hitched a ride in a car, then ran the last 5 miles. 
       - Another runner, Thomas Hicks, was given strychnine (a stimulant) and brandy by his trainers during the race.
     - **Do not reveal the outcome yet.**
  3. Prediction Task (8 min): Hand out Worksheet 1. Ask students to predict:
     - What place did Thomas Hicks finish in? (Options: 1st, 2nd, 3rd, or did not finish)
     - How many runners finished the race? (Options: 0-5, 6-10, 11-15, 16-20, 21-25, 26-32)
     - What was the winning time? (Options: under 3 hours, 3-3.5 hours, 3.5-4 hours, over 4 hours)
     - Also, ask them to note down the main reason they think the race turned out as they predicted.

     Worksheet 1 Example:
     ```
     PREDICTION WORKSHEET

     Event: 1904 Olympic Marathon, St. Louis

     1. What place did Thomas Hicks finish in?
        ( ) 1st   ( ) 2nd   ( ) 3rd   ( ) Did not finish

     2. How many runners finished the race?
        ( ) 0-5   ( ) 6-10   ( ) 11-15   ( ) 16-20   ( ) 21-25   ( ) 26-32

     3. What was the winning time?
        ( ) Under 3 hours
        ( ) 3 to 3.5 hours
        ( ) 3.5 to 4 hours
        ( ) Over 4 hours

     4. Briefly, what is the main reason you think the race turned out this way?
     ```

  4. Collect Worksheet 1 (1 min).

  **Phase 2: Reveal and Explain (15 minutes)**
  1. Reveal the outcome (2 min): 
     - Thomas Hicks won the race (1st place). 
     - Only 14 runners finished. 
     - The winning time was 3 hours, 28 minutes, and 53 seconds (so in the 3-3.5 hours bracket). 
     - Additional details: Hicks was carried over the finish line by his trainers. Fred Lorz crossed the finish line first but was disqualified because he had ridden in a car. Many runners suffered from heat exhaustion, and one almost died from dust inhalation.

  2. Explanation Task (8 min): Hand out Worksheet 2. Ask students to write an explanation of why the outcome happened as it did. They should incorporate the factors they now know. Also, they are to rate the predictability of the outcome.

     Worksheet 2 Example:
     ```
     EXPLANATION AND RATING WORKSHEET

     Outcome: 
       - Thomas Hicks finished 1st.
       - Only 14 runners finished.
       - Winning time: 3 hours, 28 minutes, 53 seconds.

     1. Explain why this outcome happened. What were the main causes?

     2. How predictable was this outcome? Rate on a scale of 1 to 5 (1 = very unpredictable, 5 = very predictable).
        - The fact that only 14 runners finished: [1] [2] [3] [4] [5]
        - That Thomas Hicks won: [1] [2] [3] [4] [5]
        - The winning time (between 3 and 3.5 hours): [1] [2] [3] [4] [5]

     3. Now, thinking back to your prediction: How confident were you in your prediction? (1 = not at all confident, 5 = very confident)
        [1] [2] [3] [4] [5]
     ```

  3. Collect Worksheet 2 (2 min).

  **Phase 3: Debrief (45 minutes)**
  1. Start by showing the distribution of predictions (from Worksheet 1) and the ratings of predictability (from Worksheet 2) (5 min). 
     - Point out that the outcome was not predicted by many (if any) and that the ratings of predictability are likely higher than what their initial predictions would have justified.

  2. Introduce the two concepts (10 min):
     - **Hindsight Bias (the "I-knew-it-all-along" effect):** The tendency to believe, after an event has occurred, that one would have predicted or expected the outcome. It's a memory/knowledge-contamination effect where the outcome knowledge makes the event seem more predictable than it was. Use the ratings from Worksheet 2 to show that they now think the outcome was obvious, but their predictions (which they made without outcome knowledge) were not accurate.
     - **Narrative Fallacy:** The human tendency to create a coherent and tidy story to explain an event, which often oversimplifies the complex, contingent factors that led to the outcome. Point to their explanations in Worksheet 2: they likely constructed a causal chain that makes the outcome seem inevitable, even though they couldn't predict it.

  3. Breakout Discussion (15 min): 
     - Divide students into small groups (3-4 students). 
     - Ask them to discuss: 
       - How did your group's explanations in Worksheet 2 make the outcome seem inevitable? 
       - What factors did you emphasize? 
       - How does this relate to the way historians write about the past?
     - Then, have each group share one insight.

  4. Class Discussion (10 min): 
     - Bring the class back together and ask: 
       - "How does this activity change the way you think about historical narratives?" 
       - "Can you think of a current event where people are falling prey to these biases?" 
     - Emphasize that history is contingent and that the narrative fallacy can make it seem less so.

  5. Limitations (5 min):
     - Be honest about what the activity can't capture:
       - **Emotional distance:** In real history, we are often detached from the event. Here, the event was presented and resolved quickly. In reality, historians (and contemporaries) lived with uncertainty for a long time.
       - **Time scale:** The activity compressed the prediction and explanation into minutes. Real historical analysis might take months or years, and the feeling of uncertainty is more profound.
       - **Complexity:** We used a single event. Real historical events are embedded in a web of interconnected factors that we haven't captured.
     - Therefore, we must be cautious: we are simulating the biases, but in real life, they are more deeply ingrained and harder to notice.

  **Wrap-up (5 min)**
  - Reiterate the lesson: Hindsight bias and the narrative fallacy are two powerful cognitive biases that affect how we understand history. Being aware of them can make us better historians and critical thinkers.

  **Materials to Prepare:**
  - Worksheet 1 (one per student)
  - Worksheet 2 (one per student)
  - A slide or handout with the background context for the 1904 marathon (without outcome)
  - A slide or handout with the revealed outcome
  - A way to tabulate and present the prediction distribution and rating averages (e.g., on the board or a slide)

  This activity should fit within 80 minutes and give students a visceral experience of the two biases.
answer: |-
  ### Activity Design: Experiencing Hindsight Bias & Narrative Fallacy  
  **Total Time:** 80 minutes  
  **Students:** 14 undergraduates  
  **Goal:** Make students viscerally experience hindsight bias (overestimating predictability after knowing the outcome) and the narrative fallacy (constructing overly tidy causal stories from chaos).  

  ---

  ### **Phase 1: Prediction (20 min)**  
  **Context Setup (5 min)**  
  - **Event:** The **1961 Bay of Pigs Invasion** (U.S.-backed Cuban exiles vs. Castro’s forces).  
    - **Why it works:**  
      - Obscure enough that students won’t know details (despite recognizing the name), but dramatic and multi-faceted.  
      - Outcome hinges on contingent factors (weather, morale, intelligence failures) that seem obvious *after* the fact.  
  - **Alternative Event:** The **1850 Don Pacifico Affair** (British blockade of Greece over a trivial debt dispute). Equally obscure, with an unpredictable diplomatic outcome.  
  - **Handout:** Background summary (see *Appendix A*).  

  **Prediction Task (15 min)**  
  - **Worksheet 1: Forecast** (distribute printed copies):  
    > **Instructions:** *Based ONLY on the background, predict:*  
    > 1. Did the invasion succeed? (Yes / No)  
    > 2. How many days did the invasion last? (1–2 / 3–4 / 5–7 / 8+)  
    > 3. What was the *main reason* for the outcome? (1–2 sentences).  
    > 4. Confidence in your prediction? (1 = Low, 5 = High).  
  - **Rules:**  
    - No phones/research.  
    - Work individually.  
    - Collect worksheets immediately after 15 min.  

  ---

  ### **Phase 2: Reveal & Explain (25 min)**  
  **Reveal the Outcome (5 min)**  
  - **Outcome:** **Total failure.** Invasion lasted 2 days; 1,200 exiles surrendered; Castro lost only 176 men; U.S. humiliated.  
  - **Handout:** Outcome summary (see *Appendix B*).  

  **Explanation Task (15 min)**  
  - **Worksheet 2: Explanation & Rating** (distribute):  
    > **Instructions:** *Now that you know the outcome:*  
    > 1. Explain why the invasion failed. What were the 3 most important causes?  
    > 2. Rate how predictable this outcome was *in advance*:  
    >    - Failure itself: (1 = Unpredictable, 5 = Obvious)  
    >    - 2-day duration: (1 = Unpredictable, 5 = Obvious)  
    > 3. Re-rate your *original* confidence (from Worksheet 1). Did it change? Why?  
  - **Rules:**  
    - Students write explanations individually.  
    - Collect worksheets after 15 min.  

  **Data Collection (5 min)**  
  - Tally prediction results (from Worksheet 1) on the board:  
    - % who predicted failure.  
    - Avg. confidence rating.  
  - Tally hindsight ratings (from Worksheet 2) on the board:  
    - Avg. "predictability" ratings for failure and duration.  

  ---

  ### **Phase 3: Debrief (35 min)**  
  **Punchline Setup (10 min)**  
  - Contrast the pre-outcome predictions (low accuracy, mixed confidence) with post-outcome explanations (high "obviousness" ratings).  
  - **Key observation:** Students rated the outcome as "obvious" (e.g., 4/5) *despite* failing to predict it.  

  **Concept Separation (15 min)**  
  1. **Hindsight Bias** (Knowledge Contamination):  
     - *Definition:* "I knew it all along" effect. Outcome knowledge distorts memory of past uncertainty.  
     - *Evidence:* Their predictability ratings ↑ vs. actual predictions.  
     - *Quote:* *"Hindsight makes surprises seem inevitable."*  

  2. **Narrative Fallacy** (Causal Compression):  
     - *Definition:* Forcing chaos into a tidy story. Overemphasizing "causes" that seem logical *after* the fact.  
     - *Evidence:* Their explanations ignored pre-outcome uncertainty (e.g., "Castro’s strength was obvious" — but was it?).  
     - *Quote:* *"We turn noise into narrative."*  

  **Group Discussion (10 min)**  
  - **Prompt:** *"Re-read your explanation. Did you portray the failure as inevitable? What messy details did you ignore (e.g., weather, luck) to make the story coherent?"*  
  - **Guided Reflection:**  
    - "How might this bias affect historians writing about WWII or COVID-19 decades from now?"  
    - "Can we avoid these biases, or just acknowledge them?"  

  ---

  ### **Limitations & What to Assert**  
  **Honest Caveats (5 min)**  
  1. **Emotional Distance Missing:**  
     - Real historians work with years/decades of detachment. Here, outcome-to-reflection took 20 minutes.  
     - *Assert:* "In real life, hindsight bias strengthens over time as narratives solidify."  

  2. **Uncertainty Duration Missing:**  
     - Analysts lived with ambiguity for months (e.g., Bay of Pigs planners debated for weeks). Here, uncertainty lasted 15 minutes.  
     - *Assert:* "The longer you sit with uncertainty, the more hindsight bias warps memory."  

  3. **Complexity Compression:**  
     - Real events involve 100s of variables; we used 3–4.  
     - *Assert:* "Narrative fallacy is worse in complex events — we cherry-pick ‘causes’ that fit a plot."  

  ---

  ### **Appendices**  
  #### **Appendix A: Background Summary (Handout)**  
  > **The Bay of Pigs Invasion (1961)**  
  > - Cuban exiles, trained/funded by the CIA, planned to invade Cuba and overthrow Fidel Castro.  
  > - Strengths: 1,400 troops, air support, U.S. backing.  
  > - Weaknesses: Swampy landing site, Castro’s 20,000-strong army.  
  > - Unknowns: Will locals join the rebels? How strong is Castro’s air force?  

  #### **Appendix B: Outcome Summary (Handout)**  
  > **Actual Outcome**  
  > - **Failed in 2 days.** Exiles faced coral reefs, swamp, and ambushes.  
  > - Castro’s air force sank supply ships; U.S. canceled air support last-minute.  
  > - 1,200 exiles surrendered; 100+ died. Castro’s image strengthened.  

  #### **Worksheets**  
  - **Worksheet 1 (Prediction):** [Download PDF Template](https://example.com/bayofpigs_prediction)  
  - **Worksheet 2 (Explanation):** [Download PDF Template](https://example.com/bayofpigs_explanation)  

  ---

  ### **Why This Works**  
  - **Obscure Event:** Bay of Pigs is known by name, but few students recall details (unlike D-Day or 9/11).  
  - **Emotional Punch:** The contrast between their predictions and post-hoc certainty creates cognitive dissonance.  
  - **Debrief Clarity:** Separating the two biases using their *own work* makes it tangible.  

  **Final Tip:** Use the tally data to shame them gently (e.g., "85% of you rated failure as 'obvious'... but only 10% predicted it!"). The embarrassment cements the lesson.
