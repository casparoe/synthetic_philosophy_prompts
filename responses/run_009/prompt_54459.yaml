prompt: |-
  You are an expert in formal epistemology, specializing in accuracy-first epistemology and epistemic utility theory, with hands-on experience translating that theory into working procedures for analytic and forecasting teams; you write for practitioners, not for journals.

  I lead a geopolitical forecasting unit at a risk consultancy. Each quarter, my analysts log credences on 80–120 questions with fixed resolution dates, and everyone is scored on a Brier-style basis. We run a two-stage process: credences are logged privately, then revealed to the whole team, and each analyst may revise once after seeing the others' numbers. Our current revision policy is "use your judgment," which in practice means the timid drift toward the median and the stubborn don't move at all. I want to replace this with a disciplined second-stage policy grounded in what accuracy-first epistemology actually supports: what the propriety of scoring rules implies about when deference maximizes expected accuracy, when averaging over a crowd with conditionally independent evidence beats holding your own credence, and — crucially — when those arguments break, for instance when analysts share the same news diet so their errors are correlated, when one analyst holds private information the others cannot see, or when the resolution criterion is vague enough that "the truth" is not a fixed target.

  Please think carefully and begin with a short brainstorm of what the epistemic utility framework gives you to work with here and what it does not, then commit to the procedure.

  The deliverable: a decision procedure an analyst can run in about ten minutes at the reveal stage, before revising a single credence. It should be stated in words with at most arithmetic — nobody on my team will evaluate an integral under deadline — and should specify, in order: what to inspect about the distribution of the other credences (spread, clustering, who holds the outliers), what to inspect about one's own credence and the evidence behind it, when the policy mandates moving a specified distance toward the group mean, when it permits holding, and when it requires flagging the question to me rather than revising at all. Mark honestly which steps are judgment calls dressed up as procedure. Then work the procedure through three cases: (1) all seven other analysts cluster tightly around 0.15 on a currency-crisis question where you logged 0.45, and you suspect your number leans on sources the whole team reads anyway; (2) you are the only analyst with a contact on the ground, and the team median runs against you; (3) the team splits cleanly into clusters at 0.2 and 0.8 on an election question whose resolution wording is ambiguous enough that reasonable people could score the outcome either way. At least one worked case should end in an answer my analysts will resent, and you should close by stating what the procedure cannot do — the situations in which the entire framing of accuracy-maximizing revision misfires and the honest move is to escalate or abstain rather than revise.
reasoning: |-
  We are in an accuracy-first epistemology framework. The goal is to maximize expected accuracy, as measured by a strictly proper scoring rule (like the Brier score). The key principle is that your credence should equal your expected truth-value (i.e., your best estimate of the probability). 

  Important concepts:
  1. **Propriety of the scoring rule**: Because the Brier score is strictly proper, each analyst maximizes expected accuracy by reporting their true credence. However, when we consider the possibility of learning from others, we must update our credence by conditionalizing on the information we glean from others' reports.

  2. **Deference and Independence**: 
     - If you regard another analyst as an "expert" (i.e., they have strictly more information than you, or you take their credence to be a direct estimate of the truth and you have no private information), then you should adopt their credence (this is the principle behind the "deference to experts").
     - If you have conditionally independent evidence (given the truth) from the other analysts, then the optimal way to aggregate is to combine the credences using a logarithmic opinion pool (which in the case of independent evidence and a uniform prior, can approximate a linear average of log-odds, but note: for independent signals the optimal aggregation is multiplicative in the likelihoods, which leads to a formula that is not a simple average of probabilities). However, in practice, for a group of analysts with independent evidence and equal weight, the geometric mean of odds (or the logarithmic opinion pool) is often recommended.

  3. **Breaking Conditions**:
     - **Shared Evidence/Correlated Errors**: If analysts are exposed to the same news sources, their errors may be correlated. Then, the group's average may be overconfident and not as accurate as it would be under independence. In such cases, one should not fully defer to the group.
     - **Private Information**: If you have unique information that others don't have, then you should not abandon your credence entirely. Instead, you should adjust by weighting your own information appropriately.
     - **Vagueness in Resolution**: If the question is ambiguous, then the "truth" is not well-defined. In such a case, the expected accuracy maximization is problematic because the scoring depends on an external judgment that might be inconsistent.

  Given the above, the goal is to design a procedure that, in the second stage, allows an analyst to revise their credence to maximize expected accuracy, taking into account the group's credences and the potential issues of shared evidence, private information, and ambiguity.

  **Brainstorm of what the framework gives and does not give:**

  What it gives:
  - A foundation for when to defer: when you judge that the group (or a subset) has more information or when the evidence is conditionally independent and you have no private information.
  - A mathematical basis for aggregation under independence (e.g., the logarithmic opinion pool for multiplicative aggregation).
  - A reason to be cautious when there is shared evidence (because the independence assumption fails) or when you have private information (which the group lacks).

  What it does not give:
  - A simple formula that accounts for all the complexities (like correlated errors or the exact weight of private information) without making strong assumptions. We must rely on heuristics and judgment in many cases.
  - A way to precisely measure the level of shared evidence or the weight of private information. These remain qualitative assessments.

  **The Procedure:**

  We design a step-by-step procedure for an analyst to follow at the revision stage for one question. The analyst has their own credence (call it `p_own`) and sees the other credences (a list of probabilities). The procedure outputs a revised credence or a decision to flag the question.

  **Step 1: Inspect the distribution of other credences**
     - Compute the **mean** and **median** of the group's credences (excluding your own).
     - Note the **spread**: the range (min, max) and the interquartile range (IQR) or standard deviation (if easy to compute). Also, note if there are **clusters** (e.g., two distinct groups) and **outliers**.
     - Identify **who** holds the extreme credences (if you have knowledge about the analysts' expertise or information access).

  **Step 2: Inspect your own credence and evidence**
     - Ask: **"Do I have private information that the others likely do not have?"** (e.g., a unique source, a unique analytical insight, or a unique piece of data). Rate the uniqueness of your evidence on a scale (low, medium, high). 
     - Ask: **"Is my evidence based on sources that the whole team shares?"** (e.g., common news feeds, common databases). Rate the commonality (low, medium, high).
     - Ask: **"Is the resolution criterion clear and unambiguous?"** (If not, note that the truth might be subject to interpretation.)

  **Step 3: Decision tree**

     - **Case A: Ambiguous resolution criterion** (you answered in Step 2 that it is unclear): 
          * Do not revise. Instead, flag the question to the manager (you) with a note about ambiguity.

     - **Case B: Clear resolution but you have high private information** (from Step 2, you rated uniqueness as high and commonality as low):
          * Hold your credence (or revise only slightly if the group is very clustered and your credence is an extreme outlier) but note: this is a judgment call. Specifically:
            - If your credence is within the range of the group, hold.
            - If your credence is an outlier (say, beyond the 10th or 90th percentile of the group distribution) and the group is tightly clustered, then you might consider a small revision (e.g., move 20% of the way toward the group median). But if you strongly believe in your private information, hold.
          * However, if the group includes an analyst you consider an expert on the topic (based on past performance or domain expertise), then you might defer to that expert (if they are an outlier) or move toward them. But note: this is a judgment.

     - **Case C: Clear resolution and low private information** (you rated uniqueness as low and commonality as high) and the group is in agreement (low spread, e.g., IQR < 0.15 and your credence is outside the IQR):
          * Defer to the group mean (or median). Move your credence to the group mean (or median). 

     - **Case D: Clear resolution and low private information but the group is divided** (high spread, e.g., IQR >= 0.15 or multiple clusters):
          * Use a weighted aggregation that accounts for expertise. But without a clear expert, move toward the geometric mean of odds (which is a standard way to aggregate independent probabilities). However, if the group clusters into two distinct groups, consider whether one cluster has more credible analysts and move toward that cluster's average.

          * **Geometric mean of odds procedure** (for a group without clear clusters):
              - Convert each probability `q_i` (including your own) to odds: `o_i = q_i / (1 - q_i)`
              - Compute the geometric mean of the odds: `o_gm = (o_1 * o_2 * ... * o_n)^(1/n)`
              - Convert back: `p_agg = o_gm / (1 + o_gm)`
              - Set your revised credence to `p_agg`.
          * **If there are clear clusters** (e.g., two groups with means at `a` and `b`), then:
              - If you have reason to trust one cluster more (e.g., it contains the experts on the topic), move toward that cluster's mean.
              - If not, then you might use the geometric mean of the entire group, or if the clusters are of size `k` and `m` (with `k+m = n`), then you might take a weighted average of the two cluster means (weighted by the size of the cluster) and then move part of the way toward that. But note: this is a judgment.

     - **Case E: Mixed situation** (medium private information, or medium commonality, or unclear group dynamics):
          * This is a judgment call. The procedure suggests moving a fraction (say 30-70%) of the way from your own credence toward the group mean (or the geometric mean of odds). The fraction should be:
            - Higher the lower your private information and the higher the commonality of your evidence.
            - Lower the higher your private information and the lower the commonality.
          * A simple rule: Let `w = (1 - uniqueness_weight) * (1 - commonality_weight)`, where each weight is on a scale from 0 (low) to 1 (high). Then:
              revised_credence = w * group_mean + (1 - w) * p_own
          * But note: if the group is divided (high spread), then use the geometric mean of odds instead of the arithmetic mean for the group aggregation.

  **Step 4: Flagging conditions**
     - Flag the question to the manager if:
          * The resolution criterion is ambiguous (as above).
          * The group's distribution is so spread out (e.g., from 0.1 to 0.9) that you suspect the question is fundamentally unclear or that there is deep disagreement about the evidence.
          * You have very strong private information that contradicts the group, but you are not allowed to reveal the source (and so you are torn between holding and deferring) and you want to escalate.

  **Worked Examples:**

  **Case 1: Currency Crisis**
  - Your credence: 0.45
  - Others: seven analysts tightly clustered around 0.15 (say, between 0.12 and 0.18).
  - Step 1: The group has low spread (IQR is very small) and is clustered. The mean is about 0.15.
  - Step 2: You suspect your evidence is based on sources the whole team reads (commonality high) and you have no unique private information (uniqueness low). 
  - Step 3: This is **Case C**. You should defer to the group. Move to the group mean (0.15). 
  - **Revised credence: 0.15**

  **Case 2: Contact on the Ground**
  - Your credence: 0.7 (for an event, say a rebel group taking a city)
  - Others: median is 0.3 (and let's say the group clusters around 0.3, with little spread).
  - Step 1: Group is clustered around 0.3 (low spread).
  - Step 2: You have a unique contact on the ground (uniqueness high). Commonality: your other evidence might be shared (commonality medium) but the contact is unique.
  - Step 3: This is **Case B** (high private information). You might hold your credence. However, if the group is very tight and your credence is an extreme outlier, you might move slightly toward the group. But note: the procedure says hold or move only a little. Let's say you decide to hold because the private information is high. 
  - **Revised credence: 0.7** (hold). 
  - However, if you are very unsure about the reliability of the contact, you might move a little. This is a judgment call. The strict procedure says hold, but the analyst might resent holding when the group is so confident the other way. We'll note that resentment.

  **Case 3: Ambiguous Election**
  - The team splits: some at 0.2, some at 0.8 (say 4 at 0.2 and 4 at 0.8, including you at one of them). 
  - Step 1: The distribution is bimodal with two clusters. The spread is extreme (min 0.2, max 0.8).
  - Step 2: You note that the resolution criterion is ambiguous (e.g., the election outcome might be decided by a court, and the question doesn't specify). 
  - Step 3: **Case A**. Do not revise. Flag the question to the manager. 
  - **Action: Flag**

  **What the procedure cannot do:**
  - Handle situations where the truth is not well-defined (like the ambiguous election) without escalation.
  - Precisely weight the private information against the group's wisdom without making subjective judgments.
  - Account for complex dependencies in the evidence beyond the analyst's qualitative assessment (like when errors are correlated in an unknown way).
  - Replace deep expertise: if an analyst knows that a particular source is unreliable but the group doesn't, the procedure might not capture that if the analyst does not explicitly note it as private information.

  **Closing:**
  The procedure is designed to maximize expected accuracy under the constraints of the scoring rule and the information available. However, it relies on the analyst's honest assessment of their own information and the group's. In situations of extreme ambiguity, deep disagreement, or when the scoring rule itself might be misapplied (due to vagueness), the honest move is to flag the question or abstain.

  **Note on resentment:** In Case 2, the analyst holds at 0.7 against a group clustered at 0.3. This might cause resentment because the group might see it as stubbornness. But the procedure supports it because of the private information. However, if the event then resolves to 0 (the rebel group does not take the city) and the analyst gets a poor score, the resentment might be even more. The procedure, however, is about maximizing expected accuracy and using the information at hand. It is possible that the private information was wrong, but at the time of revision, it was the best move.

  **Procedure in a Nutshell:**

  For each question at the revision stage:

  1. Look at the group's credences: compute mean, median, spread (IQR or range), and note clusters and outliers.
  2. Assess your own evidence: 
     - Uniqueness (low, medium, high) 
     - Commonality (low, medium, high)
     - Resolution clarity (clear or ambiguous)
  3. Follow the decision tree:
     - If ambiguous: flag.
     - Else if high uniqueness: hold or move slightly (if extreme outlier in a tight group) [judgment call].
     - Else if low uniqueness and high commonality and group is in agreement: move to group mean.
     - Else if group is divided: use geometric mean of odds or move toward a trusted cluster [judgment call].
     - Else (mixed): move a fraction (w) of the way to the group aggregate (mean or geometric mean) where w is based on uniqueness and commonality.
  4. Flag if: ambiguous, extreme spread, or strong private information that you cannot disclose and that makes you uncertain.

  This procedure should take about 10 minutes per question once familiar.
answer: |-
  ### Epistemic Utility Framework: Brainstorm  
  **What the framework gives you:**  
  - **Propriety implies deference to more accurate credences:** If you judge another analyst’s credence to be better informed (e.g., based on stronger evidence), moving toward it *increases* your expected accuracy.  
  - **Independence justifies averaging:** When analysts’ evidence is conditionally independent, the geometric mean of odds (logarithmic pooling) maximizes group accuracy.  
  - **Scoring rules flag correlated errors:** If analysts share evidence sources (e.g., same news feed), the group mean may be overconfident—deference should be partial.  
  - **Private information justifies holding:** Unique evidence (e.g., a confidential source) means your credence has value the group lacks.  

  **What it does NOT give you:**  
  - A magic formula for weighting credences. Judgment is needed to assess evidence quality, independence, and ambiguity.  
  - Protection against vague resolution criteria. If "truth" is ill-defined, scoring rules break.  
  - Solutions for extreme disagreement—this signals deeper issues (e.g., ambiguous question).  

  ---

  ### Revised Credence Procedure  
  **Goal:** Revise your credence in ≤10 minutes using arithmetic and structured judgment.  

  **Step 1: Inspect the Group’s Credences**  
  - **Compute:** Group mean, median, range (min-max), and clusters (e.g., tight group at 0.3, outliers at 0.7).  
  - **Note:** Who holds outliers? If an expert on the topic (e.g., regional specialist) is an outlier, their view may be weightier.  
  - *Judgment call:* Is the group spread tight (range ≤0.2) or split (e.g., bimodal)?  

  **Step 2: Inspect Your Credence and Evidence**  
  - **Assess evidence uniqueness (1-5 scale):**  
    - `1` = Solely shared sources (e.g., common news).  
    - `5` = Strong private evidence (e.g., ground contact, proprietary data).  
  - **Assess evidence commonality (1-5 scale):**  
    - `1` = Entire team uses identical sources.  
    - `5` = Sources completely disjoint (e.g., you alone read local-language press).  
  - **Flag if:** Resolution criteria are vague (e.g., "crisis" undefined).  

  **Step 3: Choose Action**  
  - **🚩 Flag to manager (do not revise) if:**  
    - Resolution is ambiguous (Step 2).  
    - Group spread is extreme (min ≤0.2, max ≥0.8) AND clusters are equally sized.  
  - **Hold your credence (no move) if:**  
    - Evidence uniqueness ≥4 AND commonality ≤2.  
  - **Move to group geometric mean of odds if:**  
    - Evidence uniqueness ≤2 AND commonality ≥4 AND group spread >0.2.  
  - **Move toward group mean if:**  
    - Evidence uniqueness ≤2 AND commonality ≥4 AND group spread ≤0.2.  
  - **Partial move (weighted average) if:**  
    - Evidence uniqueness =3 OR commonality =3.  
    - *Formula:* `Revised = (0.7 × Your credence) + (0.3 × Group mean)`  
    - *Adjust weights:* If uniqueness →4, weight your credence higher (e.g., 0.8/0.2).  

  **Why geometric mean of odds?**  
  For independence, convert all credences to odds, take geometric mean, convert back:  
  1. Convert credence `p` to odds: `o = p / (1-p)`.  
  2. Compute geometric mean of all odds: `o_gm = (o₁ × o₂ × ... × oₙ)^(1/n)`.  
  3. Convert back: `p_revise = o_gm / (1 + o_gm)`.  
  *(Use if group is divided but evidence independent.)*  

  ---

  ### Worked Cases  
  **Case 1: Currency Crisis**  
  - Your credence: **0.45**  
  - Group: Tight cluster at **0.15** (range 0.12–0.18).  
  - Evidence: Suspect sources are shared (uniqueness=1, commonality=5).  
  - **Procedure:**  
    - Group spread tight (≤0.2), uniqueness low → **move to group mean (0.15)**.  
    - *Why?* Shared evidence means your 0.45 is likely noise. Moving maximizes accuracy.  

  **Case 2: Ground Contact**  
  - Your credence: **0.70** (based on confidential source).  
  - Group median: **0.30** (range 0.25–0.35).  
  - Evidence: Unique contact (uniqueness=5), common sources otherwise (commonality=2).  
  - **Procedure:**  
    - Uniqueness=5 → **hold at 0.70**.  
    - *Resentment trigger:* Team sees you as stubborn, but private evidence justifies holding. Accuracy demands it.  

  **Case 3: Ambiguous Election**  
  - Group clusters: **0.2** (4 analysts) and **0.8** (4 analysts).  
  - Resolution: Wording vague (e.g., "win" could mean popular vote or electoral college).  
  - **Procedure:**  
    - Extreme spread + ambiguous resolution → **🚩 flag to manager**. Do not revise.  

  ---

  ### When the Procedure Fails  
  **Escalate or abstain if:**  
  1. **Resolution ambiguity:** "Truth" is contestable (e.g., subjective criteria like "significant recession").  
  2. **Pathological disagreement:** Group splits into equal clusters (e.g., 50% at 0.2, 50% at 0.8). This signals unresolved evidence conflicts or question vagueness.  
  3. **Correlated errors dominate:** All analysts share the same flawed source (e.g., misreporting by a single news agency). No aggregation fixes this.  
  4. **Adversarial incentives:** Analysts distort credences for reasons other than accuracy (e.g., office politics).  

  **Final Note:** This procedure optimizes for *scoring rule accuracy*, not persuasiveness or consensus. Analysts must prioritize evidence over ego—even when it’s unpopular.
