prompt: |-
  I manage the sensory panel at a mid-size specialty coffee roastery — eight trained cuppers, weekly calibration cuppings, and ad-hoc panels whenever a supplier changes, a customer complains, or we sign off on a blend reformulation. Increasingly I realize my core job is a philosophical problem wearing an apron. When a panelist who has scored our flagship blend's body as a 7 for two years suddenly scores it a 5, I have to decide whether the coffee changed or the taster did — and when she insists, from the inside, that she can tell the difference between the coffee tasting different and her merely judging it differently, I have no way to check that claim, only her word. This is, I gather, exactly the bind Dennett stages in Quining Qualia with his coffee drinker who moves from cream and sugar to black, and his wine expert whose once-loved vintage now strikes him as cloying: the taster's introspective report seems unable, by itself, to settle whether the change is in the object, the percept, or the reaction to an unchanged percept — and the deeper suggestion is that the very idea of a determinate answer may rest on treating qualia as more well-defined posits than they are.

  Please turn that cluster of ideas into a decision procedure my lab can actually run, written so a shift lead with no philosophy background can follow it. I need: an ordered list of questions to ask about any reported difference (whose report, over what interval, against what reference, with what blind controls, corroborated by whom), what counts as a sufficient answer at each step, and the specific outputs — accept as a product change, treat as panelist drift and recalibrate, split the panel and retrain, or declare the difference undecidable from within and say what external evidence would settle it. Mark clearly the points where the procedure cannot eliminate a judgment call, and say so plainly rather than disguising it as measurement. Then run the procedure on three cases: (1) our shelf-life study, where the same six panelists scored the same lot at month zero and month eight, and the staleness scores rose for three of them but not the rest; (2) our most senior cupper — the one whose palate we treat as the reference standard — returns from a national competition and starts scoring our flagship as thin, while the rest of the panel scores it unchanged; and (3) the head roaster wants to approve a new lot from a new farm that he swears tastes identical to the lot it replaces, and two of our newest panelists, hired last month, score it as brighter. One of these cases should produce an answer I won't like — probably the one about our senior cupper or about what our calibration history is worth — and I want you to give that answer anyway. Finish by stating honestly what the procedure cannot do: which distinctions it renders genuinely undecidable, where a cupper's from-the-inside confidence will simply have to be overruled or deferred to as a matter of policy rather than knowledge, and where the philosophical point that the object/subject split may be partly a posit shows up as a permanent hole in the flowchart rather than a step in it.
reasoning: |-
  Okay, let me approach this systematically. The user manages a sensory panel at a specialty coffee roastery and faces philosophical challenges in distinguishing objective product changes from subjective taster variations. They specifically referenced Dennett's qualia arguments, showing they need practical decision protocols grounded in that framework.

  First, I need to translate complex philosophical concepts into actionable steps for coffee professionals. The core challenge is designing a flowchart that:
  - Separates detectable changes in coffee from taster variability
  - Handles disagreements in calibration data
  - Provides clear outputs like "product change" or "panelist drift"
  While acknowledging where judgment calls are unavoidable

  For the decision procedure, I'll structure it as a branching questionnaire with these critical filters:
  1. Individual vs group divergence (isolates outliers)
  2. Temporal patterns vs sudden changes (identifies drift)
  3. Reference standards usage (controls for memory effects)
  4. Corroboration methods (handles conflicting reports)
  Each step must specify evidence thresholds and fail-safes

  The three test cases present distinct challenges:
  - Shelf-life study shows split panel data - here I'll demonstrate how to resolve partial agreement
  - Senior cupper divergence will likely produce the "unpleasant answer" about overriding internal authority
  - New farm lot comparison highlights how to handle contested similarity claims

  Key limitations to emphasize:
  - Can't verify first-person qualia reports independently
  - Must sometimes prioritize operational consistency over epistemological certainty
  - The object/subject distinction remains porous in edge cases

  The procedure should honestly flag where it reaches its limits - particularly when internal certainty conflicts with external evidence. For the senior cupper case, I'll need to show how their status as reference standard creates a logical paradox that forces an operational decision rather than perfect resolution.
answer: |-
  Here’s a decision procedure for resolving sensory discrepancies, designed as a flowchart with explicit steps, outputs, and acknowledgment of judgment calls. **Philosophical uncertainties are marked with ⚖️** and integrated into the protocol.  

  ---

  ### **Sensory Discrepancy Decision Procedure**  
  *For Shift Leads (No Philosophy Required)*  

  #### **Step 0: Initial Report**  
  **Input:** Any panelist reports a sensory difference in a coffee (e.g., "Body dropped from 7 to 5").  
  **Immediate Action:** Freeze remaining samples, log batch IDs, and note panelist ID.  

  #### **Step 1: Verify the Basics**  
  **Question 1:** *Is this a single panelist or multiple panelists reporting the change?*  
  - **If single panelist → Proceed to Step 2.**  
  - **If multiple (≥2) → Skip to Step 4.**  
  **Output:** Isolates outliers vs. potential product shifts.  

  **Question 2:** *Over what time interval did the change occur?*  
  - **Short-term (≤1 week):** Likely taster drift or error. → Proceed to Step 3.  
  - **Long-term (>1 month):** Possible product drift or cumulative taster shift. → Skip to Step 4.  

  #### **Step 2: Interrogate the Single Panelist Report**  
  **Question 3:** *Was the assessment blind and controlled?*  
  - **No:** Discard report. Mandate retest under blind conditions.  
  - **Yes:** Proceed.  
  **Controls Required:** Current sample vs. reference sample (from frozen archive) served blind + randomized.  

  **Question 4:** *Did the panelist retest correctly?*  
  - Test: Serve reference sample (labeled "A") vs. current sample (labeled "B") blind.  
  - **If panelist scores A/B identically → Taster drift/error.** Output: **Recalibrate panelist.**  
  - **If panelist detects difference → Proceed to Step 5.**  

  #### **Step 3: Check for Taster Drift Triggers**  
  **Question 5:** *Any known changes for this panelist?*  
  - Health (illness, medication), diet (e.g., new toothpaste), competition exposure (e.g., judged high-acidity coffees), or missed calibrations.  
  - **Yes:** Output: **Recalibrate panelist.**  
  - **No:** Proceed to Step 5.  

  #### **Step 4: Corroborate with the Panel**  
  **Action:** Run a **blind triangle test** for the disputed attribute (e.g., body, acidity):  
  - 3 cups: 2 reference (frozen archive) + 1 current sample.  
  - **If ≥5/8 panelists ID the odd cup → Likely product change.** Proceed to Step 6.  
  - **If <5/8 ID the odd cup → Output: ⚖️ Undecidable. Gather external evidence.**  

  #### **Step 5: Split-Panel Retest**  
  **Action:** Divide panel into 2 groups.  
  - **Group 1:** Tastes reference vs. current sample blind.  
  - **Group 2:** Tastes current sample vs. new reference (e.g., different batch).  
  **Question 6:** *Do both groups agree on the direction of change?*  
  - **Yes:** Output: **Accept product change.**  
  - **No:** Output: ⚖️ **Declare undecidable. Flag for external review** (e.g., chemical analysis, customer feedback).  

  #### **Step 6: Final Validation**  
  **Action:** Cross-check with **external anchors**:  
  - Roaster logs (profile changes?)  
  - Green coffee specs (moisture, density)  
  - Customer complaints/praises  
  **Question 7:** *Does external data confirm the sensory shift?*  
  - **Yes:** Output: **Document product change.**  
  - **No:** Output: **Panelist drift/system error. Recalibrate entire panel.**  

  ---

  ### **Case Applications**  

  #### **Case 1: Shelf-Life Study (3/6 panelists report increased staleness)**  
  - Step 1: Multiple panelists → Skip to Step 4.  
  - Step 4: Triangle test → If <5/8 ID staleness increase → **Undecidable**.  
  - Step 6: Check roast dates/green coffee aging → If beans are older, **accept staleness**. If not, **recalibrate panelists reporting change**.  
  **Output:** Likely product drift (age) but verify with bagging date logs.  

  #### **Case 2: Senior Cupper Scores Flagship as "Thin" (Others Unchanged)**  
  - Step 1: Single panelist → Step 2.  
  - Step 2: Blind retest → If senior cupper IDs reference vs. current correctly → Step 5.  
  - Step 5: Split-panel retest → Group 1 (senior + new panelists): Flagship vs. archive.  
    Group 2 (remaining panelists): Flagship vs. competitor’s "thin" benchmark.  
    *Likely outcome:* Group 2 disagrees with "thin" characterization.  
  - Step 6: External data (roast curves unchanged, no customer complaints) → **No product change**.  
  **Output:** **Recalibrate senior cupper** (competition exposure likely altered their perception).  
  ⚖️ **Judgment Call:** Senior cupper’s "from-the-inside" certainty is overruled by lack of corroboration.  

  #### **Case 3: New Farm Lot vs. Old Lot (2 New Panelists Report "Brighter")**  
  - Step 1: Multiple panelists → Step 4.  
  - Step 4: Triangle test (old lot A vs. A vs. new lot B).  
    - If ≥5/8 ID B as brighter → **Accept product change**.  
    - If <5/8 ID B → Step 5.  
  - Step 5: Split-panel retest → Group 1 (new panelists): Old vs. new.  
    Group 2 (senior panelists): New vs. known "bright" control.  
    *Likely outcome:* Group 1 detects difference; Group 2 does not.  
  **Output:** ⚖️ **Undecidable**. Require green coffee analysis (e.g., citric acid levels) or customer test batch.  

  ---

  ### **What This Procedure CANNOT Do**  
  1. **Verify "from-the-inside" certainty:** When a panelist insists they "just taste" a difference, but controls contradict them, we must prioritize evidence over introspection. Policy: **Overrule unsubstantiated reports.**  
  2. **Resolve undecidable splits:** If the panel fractures (e.g., 4 vs. 4 on a change), no test can prove who is "objectively" right. Policy: **Freeze the product and seek external validation** (lab tests, market trial).  
  3. **Distinguish percept vs. reaction:** ⚖️ We cannot know if a panelist’s *perception* of acidity changed or their *preference* for it shifted. Policy: **Attribute all changes to "sensory response" and recalibrate.**  
  4. **Absolve reference standards:** If archive coffee degrades or panelists collectively drift (e.g., competition judges normalize higher acidity), the "reference" becomes unreliable. Policy: **Refresh references quarterly using fresh + neutral benchmarks.**  

  **Philosophical Hole in the Flowchart:** At Step 4 (triangle test), a "negative" result doesn’t prove the coffee *didn’t* change—it proves the panel *couldn’t detect it under test conditions*. This mirrors Dennett’s point: we treat "product change" as a posit justified by consensus + controls, not an infallible truth.  

  ---  
  **Final Outputs Summary**  
  - **Product Change:** Corroborated by panel + external evidence.  
  - **Recalibrate Panelist:** Isolated divergence + no product proof.  
  - **Recalibrate Panel:** Systemic drift (e.g., competition exposure).  
  - **Undecidable:** Split panel + no external anchor → Escalate.  
  **Unpleasant Truth:** Your senior cupper’s post-competition scores are likely drift, not truth. Calibration history is only valid if references are immutable—and they aren’t.
