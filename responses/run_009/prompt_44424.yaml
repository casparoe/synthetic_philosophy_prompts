  Overall this is far more than a rant. The combination of field experience, engagement with philosophical texts, and concrete examples (membrane protein work, quantum interpretations) makes it compelling. The apprenticeship perspective is particularly valuable - philosophers rarely hear how their ideas play out in lab trenches.

