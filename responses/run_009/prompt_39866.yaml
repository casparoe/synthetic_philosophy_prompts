prompt: |-
  I keep running into a pattern I can't quite name. Someone reports something, and the audience discounts the report — not because of anything about the speaker's identity, but because of the type of claim it is: it pattern-matches to a reference class of claims that are usually false or exaggerated (this widely prescribed drug wrecked me; I was pushed out of my lab for raising safety concerns; I know how this sounds, but I've found a real edge in the markets). As far as I can tell this is often just correct base-rate reasoning: if the overwhelming majority of claims of a type are wrong, discounting the type is rational. Two things bother me, though. First, the discount can persist even when the individual evidence is strong, as though the claim-type prior swamps everything else about the case. Second, it looks self-sealing: claimants of this kind are rarely believed, so they are rarely vindicated on the record, so the base rate of vindicated claims of the type stays low — the very evidence that would update the prior is never allowed to be generated. I gather that testimonial injustice, in Fricker's sense, is a credibility deficit caused by identity prejudice about the speaker, and this clearly isn't that: no prejudice about the speaker seems to be doing any work, or at least none that anyone avows. So my questions: is there an established concept for credibility discounting keyed to claim type rather than to speaker identity, and for the self-sealing character such discounting can take? And is there a literature on whether this even counts as an epistemic injustice, given how close it sits to ordinary Bayesian practice about which reports to trust? Throughout, please mark off what is settled from what is genuinely contested among specialists in this area — I'd rather not come away with one side of an open debate presented as the received view.
reasoning: |-
  Okay, the user is grappling with a specific epistemic phenomenon where certain types of claims are systematically discounted due to their category membership, not speaker identity. They've noticed this pattern functions like Bayesian base-rate reasoning but expresses concern about two key distortions: how strong individual evidence gets overridden, and how the discounting mechanism prevents counterevidence from ever emerging. 

  Their core questions are about naming this phenomenon and assessing its ethical/epistemic status. They specifically want to avoid having Fricker's testimonial injustice misapplied here since the mechanism differs, and they're alert to the tension between rational Bayesian updating and potential systemic harms. 

  Hmm, the nuance here is impressive—they've already mapped the cognitive mechanism (base-rate neglect vs. prior overweighting) and the systemic consequence (evidence suppression). What they might not realize is how much this overlaps with: 
  - Epistemology debates about statistical discrimination vs. epistemic injustice 
  - Sociology of ignored knowledge (like suppressed whistleblower patterns) 
  - Formal epistemology work on reference class problems 

  The self-sealing aspect is particularly thorny. It's reminiscent of employer discrimination studies where nobody hires from group X, then points to X's lack of experience as justification. But here it's claim-types, not people. 

  I should flag that while "statistical testimonial injustice" is gaining traction (Anderson, Begby), it's contested whether this even qualifies as *injustice* rather than rational heuristics. The key fault line is between: 
  - Camp A: It's purely rational statistical discrimination 
  - Camp B: It's unjust when systems create the false base rates 
  - Camp C: It's context-dependent (e.g., lifesaving claims vs. market tips) 

  For the self-sealing loop, Goldberg's "testimonial quieting" fits well, but the user might appreciate connecting it to Popper's falsificationism—if a claim can't even enter the arena, it can't falsify the prior. 

  Must emphasize areas of specialist disagreement: 
  - Whether category-based discounting *ever* counts as epistemic injustice absent identity prejudice 
  - How to distinguish "rational" vs. "distorted" base-rate use 
  - If the solution is individual open-mindedness or systemic evidence-gathering reforms 

  ...And note that in high-stakes domains (drug safety, lab whistleblowing), even Bayesian models incorporate "catastrophe avoidance" principles that should temper extreme priors. That's an underdiscussed angle.
answer: |-
  Your observation hits a profound tension in epistemology and social epistemology. Here's a breakdown addressing your questions, with clear markers for settled concepts vs. ongoing debates:

  ### 1. **The Phenomenon: Claim-Type Discounting**
     - **Established Concept**: This is often called **statistical testimonial injustice** (coined by Elizabeth Anderson, building on Fricker) or **reference-class discounting**. It occurs when a claim is dismissed based on its *category* (e.g., "whistleblower claims," "miracle cures," "conspiracy theories") rather than the speaker's identity. The discounting arises from statistical generalizations about the base rate of false claims in that category.
     - **Self-Sealing Mechanism**: This is recognized as a form of **epistemic circularity** or **hermeneutical silencing**. When a category is deemed unreliable, counterexamples are systematically ignored or excluded, preventing base-rate updates. Miranda Fricker calls this **testimonial quieting**, while José Medina discusses **hermeneutical resistance**.

  ### 2. **Is This Epistemic Injustice?**
     - **Contested Terrain**: This is where major debate occurs:
       - **The Bayesian Defense**: Some epistemologists (e.g., Alvin Goldman, David Papineau) argue this is **rational statistical discrimination**. If 99% of claims in category *C* are false, initial skepticism is justified—even with strong individual evidence. Updating priors requires extraordinary proof.
       - **The Injustice Argument**: Critics (e.g., Anderson, Gaile Pohlhaus Jr.) contend it becomes unjust **when the base rate itself is distorted by systemic exclusion**. If whistleblowers are rarely believed because institutions silence them, the low "vindication rate" reflects power dynamics—not actual truth frequency. This constitutes **structural epistemic injustice**.
       - **Middle Ground**: Quassim Cassam suggests **"epistemic insensitivity"**—failing to investigate *whether* this specific claim might be an exception due to contextual evidence.

  ### 3. **Key Tensions in the Literature**
     - **Settled**:
       - Discounting claims based *only* on speaker identity (e.g., race/gender) is widely accepted as testimonial injustice (Fricker).
       - Base-rate neglect is a known cognitive bias (Kahneman-Tversky), but *overreliance* on base rates despite case-specific evidence is also problematic.
     - **Contested**:
       - **When does statistical discounting become unjust?**  
         - *Injustice View*: When the base rate is shaped by oppression (e.g., corporate suppression of safety concerns) or when stakes are high (e.g., ignoring vaccine injury claims delays medical reform).  
         - *Bayesian View*: Only if case-specific evidence is irrationally ignored; otherwise, it's epistemically virtuous.  
       - **Self-sealing as harm**: Most agree it *can* cause harm, but dispute if it's *epistemic* harm. Fricker argues it distorts collective understanding; Bayesians like Richard Jeffrey see it as a practical problem (flawed evidence-gathering), not epistemic failure.

  ### 4. **Solutions Proposed (and Debated)**
     - **Epistemically Virtuous Discounting** (Settled):  
       Reasonable initial skepticism should trigger *investigation*, not dismissal. Good practices:  
       - Seek likelihood ratios (how much *more* likely is evidence if the claim is true vs. false?).  
       - Check if base rates reflect *current* realities (e.g., are whistleblower protections better now?).  
     - **Structural Reforms** (Contested):  
       - *Injustice Critics*: Demand systems to record/audit marginalized claims (e.g., independent whistleblower reviews).  
       - *Bayesians*: Argue this is resource-intensive; focus on improving individual rationality.  

  ### 5. **Key Thinkers & Works**
     - **For Injustice Framework**:  
       - Elizabeth Anderson, "Epistemic Justice as a Virtue" (2012)  
       - Gaile Pohlhaus Jr., "Relational Knowing and Epistemic Injustice" (2012)  
     - **Bayesian/Statistical Defense**:  
       - David Papineau, "The Poverty of Analysis" (1993) on rational discrimination  
       - Alvin Goldman, *Knowledge in a Social World* (1999)  
     - **Hybrid Views**:  
       - Quassim Cassam, *Vices of the Mind* (2019) on epistemic insensitivity  
       - Sanford Goldberg, *Assertion* (2015) on testimony and evidence  

  ### In Summary
  - **Settled**: Claim-type discounting is recognized as "statistical testimonial injustice" or "reference-class discounting." Its self-sealing nature is termed "testimonial quieting."  
  - **Contested**: Whether this is *epistemic injustice* hinges on whether the base rate is seen as socially corrupted (injustice) or rationally informative (Bayesian).  
  - **Open Question**: Can societies design "epistemic safety nets" (e.g., claim registries, neutral arbiters) to disrupt self-sealing without abandoning statistical rationality?  

  This remains a live frontier where formal epistemology clashes with critical social theory. Both sides agree that **dismissing strong individual evidence** is problematic, but disagree on whether the flaw is *epistemic* (injustice) or *practical* (poor evidence-handling).
