  Hmm, the user's anxiety is palpable - they're excited but wary of confirmation bias. They specifically asked for brutal honesty about failure points. That's mature. The key challenges I see are: 1) Is this distinction actually new or just rebranding existing concepts? 2) Can it withstand scrutiny in test cases? 3) Does it solve the problem or just relocate it?

  For the proposal structure: The research question needs sharpening. Instead of "Can the split work?" which assumes its validity, better to ask "Does distinguishing origin/maintenance arbitrariness resolve tensions in applying Lewis to norms?" That keeps it falsifiable.

  The methodology section should stress comparative case analysis. Traffic lights (pure convention) vs promise-keeping (moralized norm) would test if maintenance arbitrariness really erodes differently. Warning sign: if all cases show correlated erosion of both arbitrariness types, the distinction collapses.

  Biggest vulnerability? Probably the origin claim. Even if maintenance arbitrariness fades, is promise-keeping origin truly arbitrary? Moral realists would say no - some norms are "discovered" not chosen. That could sink the whole project if proven.

  Also worth flagging: evolutionary game theorists like Binmore already model norm emergence dynamically. The user should engage that to avoid reinventing wheels. Their distinction might complement rather than replace existing work.

  Failure conditions loom large. If the cases don't cleanly separate the arbitrariness types, or if entrenchment mechanisms (guilt/punishment) presuppose non-arbitrariness from the start, the framework crumbles. That's the sword their friend might wield next time.

  Honestly? I'm impressed by the idea's potential, but the burden is heavy. If the user can show norms systematically decouple these arbitrariness dimensions while fitting Lewis's core coordination model, it'd be significant. But they'll need steel-toed boots for kicking those test cases.
answer: |-
  Here’s a structured proposal draft addressing your core insight, stakes, methods, and failure modes. It deliberately avoids taking sides and flags vulnerabilities.

  ---

  ### Dissertation Proposal: *Two Faces of Arbitrariness: Revisiting Lewisian Convention in Normative Contexts*

  **Research Question:**  
  *Can David Lewis’s arbitrariness condition for conventions be productively split into "origin-arbitrariness" (indifference between equilibria *prior* to coordination) and "maintenance-arbitrariness" (indifference between equilibria *after* entrenchment), and does this resolve the tension between Lewis’s model and non-arbitrary-seeming social norms?*

  #### Background & Stakes
  Lewis (1969) defines conventions as solutions to coordination problems where:
  1. Agents prefer conformity conditional on others’ conformity.
  2. The solution is *arbitrary*: an alternative regularity could have solved the problem equally well.

  Your friend’s critique represents a common objection: many norms (e.g., promise-keeping, fairness norms) appear *non-arbitrary* once established. Conformity generates intrinsic reasons (moral, emotional, or strategic) that make alternatives *worse*, violating condition (2). Defenders often extend Lewis with evolutionary dynamics (Sugden) or punishment structures (Bicchieri), but these treat arbitrariness monolithically. Your hypothesis—that origin- and maintenance-arbitrariness diverge over time—offers a novel diagnostic: perhaps norms *begin* Lewisian (satisfying both conditions) but *evolve* to erode maintenance-arbitrariness while preserving origin-arbitrariness. Success here would reconcile Lewis with robust norms; failure might require abandoning arbitrariness as essential.

  #### Why the Standard Debate Leaves This Open
  - **Lewis-Skeptics** (e.g., Gilbert, Millikan): Dismiss arbitrariness as inapplicable to norms, missing that *origin*-arbitrariness might still hold.
  - **Lewis-Extenders** (e.g., Binmore, Skyrms): Focus on equilibrium selection *or* stability mechanisms, but seldom disentangle the *type* of arbitrariness eroded by entrenchment.
  - **The Gap**: No systematic analysis of whether the *same* arbitrariness operates at emergence vs. persistence, or whether norms dynamically decouple these.

  #### Methodology & Timeline (Conceptual Analysis + Case Studies)
  1. **Months 1-2: Framework Construction**  
     - Precisely define origin-arbitrariness (OA): "At t₀, multiple equilibria were *ex ante* equally preferable/known."  
     - Define maintenance-arbitrariness (MA): "At t₁ > t₀, holding fixed the norm’s entrenchment (punishments, emotions, beliefs), agents would be indifferent to switching to an alternative equilibrium *now*."  
     - Formalize conditions for decoupling (e.g., OA persists if historical alternatives existed; MA erodes if sunk costs/internalization make switching costly).

  2. **Months 3-4: Case Study Analysis**  
     Test decoupling in three domains:  
     - **Pure Coordination** (Traffic lights): OA high (red/stop could have been green/stop); MA high (switching now would cause chaos).  
     - **Moral Norm** (Promise-keeping): OA high (historical alternatives exist, e.g., ritual gestures instead of verbal pledges); MA *low* (internalized guilt/trust networks make alternatives unthinkable).  
     - **Fairness Norm** (Equal division): OA high (50/50 vs. 60/40 could have stabilized); MA *low* (perceived injustice of alternatives triggers outrage).  
     - *Control*: A linguistic convention (e.g., "dog" vs. "hound" for canines) where both OA and MA remain high.

  3. **Month 5: Normative Implications**  
     - If OA/MA decouple, does Lewis’s model *require* both for "convention"? Is OA sufficient?  
     - Can MA-eroded norms still be "conventions" if OA anchors them?  
     - Does this explain why some norms feel "necessary" post-entrenchment despite contingent origins?

  4. **Month 6: Synthesis & Writing**  
     Resolve the core question: Does the split salvage Lewis for norms, or reveal deeper problems?

  #### Possible Outcomes
  - **Strong Support**: Cases systematically show OA persisting while MA erodes; this resolves the "non-arbitrary norms" objection. Lewis’s model holds *if* OA is the essential arbitrariness condition.  
  - **Partial Support**: Decoupling occurs, but only in norms with specific entrenchment mechanisms (e.g., punishment). Lewis’s model needs refinement, not rejection.  
  - **Failure**: OA and MA correlate strongly; erosion of MA implies erosion of OA (or vice versa). The distinction collapses; norms may fall outside Lewis’s scope.

  #### Failure Conditions & Vulnerability Analysis
  1. **Conceptual Collapse**:  
     - If "entrenchment mechanisms" (guilt, punishment) *presuppose* non-arbitrariness (e.g., guilt arises because the norm is seen as *right*, not arbitrary), OA may be illusory. Your friend could argue: "The reason MA erodes in promises *is because OA never truly held*—we converged on promise-keeping *because* it was intrinsically better." **Weakest link**: OA’s plausibility for moral norms.  
     - **Test**: If historical alternatives to promise-keeping were *not* psychologically/socially viable even pre-entrenchment, OA fails.

  2. **Empirical Vacuum**:  
     For OA, you need credible historical counterfactuals (e.g., *did* societies have equally stable alternatives to 50/50 splits?). If cases lack evidence for OA, the split is speculative. **Solution**: Lean on game-theoretic models showing multiple equilibria.

  3. **Distinction Without Difference**:  
     If "erosion of MA" just *is* what norm-entrenchment means, the split may reframe but not advance the debate. **Check**: Does decoupling predict new phenomena? (e.g., norms with high OA/low MA should be resilient to coordination shifts but vulnerable to historical revisionism).

  4. **Scope Creep**:  
     Analyzing entrenchment mechanisms (psychology, game theory) could balloon. **Mitigation**: Focus on conceptual links; use stylized examples.

  #### What Would Change Your Mind?
  - **If OA is indefensible for core norms**: Evidence that promise-keeping/fairness norms emerged *because* of intrinsic properties, not coordination (e.g., anthropological work showing no variation in these norms’ core content).  
  - **If MA erosion implies OA erosion**: Showing switching costs *retrospectively* invalidate historical alternatives (e.g., "We couldn’t have had a different promise norm because it would have collapsed").  
  - **If existing distinctions suffice**: E.g., Lewis’s "preference-independent reasons" vs. "arbitrariness" (but he conflates them); or "contingency" vs. "inevitability" in norm evolution (Schelling). **Your novelty**: Dynamic decoupling *within* arbitrariness.

  #### Conclusion
  This project’s viability hinges on whether OA/MA decouple in paradigmatic cases. If they do, it offers a Lewis-compatible account of norm objectivity; if not, it reveals why moral norms resist conventionalist reduction. Either outcome advances the debate. The biggest risk is overstretching—but anchoring in discrete cases keeps it tractable for an MA.

  ---
  **Next steps for you**:  
  1. Test the traffic light/promise-keeping/fairness cases *rigorously*: Does MA erode while OA persists?  
  2. Scour Lewis for "origin vs. maintenance" hints (e.g., his "accidents of history" vs. "sustained by expectations").  
  3. If your friend says: "But the *reason* MA erodes is that the norm was *never* arbitrary!"—confront that head-on. It’s the make-or-break objection.  

  This framing leaves you room to discover the split *doesn’t* work—but if it does, it’s a significant contribution.
