prompt: |-
  been going back and forth with my brother in law about whether one person's flight or one burger actually does anything, and before I pick a side I want the spec written down first. What does a theory of individual contributions to collective harms have to get right? Give me the desiderata -- the cases it must handle (voting in a large election, the millionth hamburger vs being the only customer, one transatlantic flight, throwing your trash in a stream that's already polluted), the distinctions it can't collapse (harmless-by-itself vs trivially-harmful, making a difference vs joining in, expected value vs actual difference made, participation without causation), the plain facts it has to stay consistent with (no single flight changes the climate, elections occasionally come down to one vote, meat gets produced at a certain scale for a reason), with the case or consideration behind each. And flag pairs of desiderata you suspect can't be jointly satisfied -- like getting both "my vote can matter because elections are sometimes razor thin" and "my hamburger doesn't matter even though the feedlot exists because enough people buy meat" without smuggling in an arbitrary threshold, or getting threshold sensitivity without saying the last person to buy the ticket is a monster while everyone before them is fine. Then very briefly score the two obvious contenders, expected-utility style accounts and non-causal "you're participating in it" accounts, against the list, and tell me which single desideratum knocks out the most theories. The bar is: good enough to tell me what to actually do on a Tuesday, not just to redescribe the puzzle.
reasoning: |-
  Okay, let me try to figure out how to approach this user's question. They want a clear framework to decide if individual actions like flying or eating a burger actually contribute to collective harms. The user mentioned arguing with their brother-in-law, so they probably need solid reasoning to settle the debate. 

  First, I need to list what a good theory must handle. Desiderata include cases like voting, buying the millionth burger, taking a flight, and littering in a polluted stream. The theory must explain why one vote matters sometimes but one burger usually doesn't. Also, it should distinguish between harmless acts alone versus those that are trivially harmful, and participation without direct causation.

  The user wants consistency with facts: single flights don't change the climate, but elections can hinge on one vote. Meat production scales with demand. Conflicts might arise, like reconciling threshold sensitivity without unfair blame—like the last burger buyer being vilified while others aren't.

  Next, I recall common theories. Expected utility focuses on marginal probabilities and expected harm. Participation accounts emphasize being part of a harmful group. I need to evaluate these against the desiderata. For example, expected utility handles thresholds and probabilities well but might struggle with tiny individual impacts. Participation avoids thresholds but might overblame by making all contributors equally responsible, even when their individual impact is negligible.

  Key conflicts: How can one vote matter due to close elections while one burger doesn't, despite both having thresholds? Also, avoiding arbitrary blame for the "last" contributor. Expected utility might resolve this by considering the probability of being pivotal, which is high in close elections but near zero for burgers. Participation accounts might not distinguish between pivotal and non-pivotal roles.

  The hardest desideratum is "Avoiding Threshold Absurdity." Many theories fail here by either ignoring thresholds or creating moral cliffs. Expected utility handles it better by using probabilities, but participation accounts collapse this distinction entirely. The user needs practical advice for real-life decisions, so the theory must guide actions without paralysis.

  Scoring the theories, expected utility seems more robust despite challenges with tiny probabilities. Participation accounts are simpler but risk overgeneralizing blame. The user's deeper need is clarity on when individual actions matter, to make informed choices without guilt over negligible impacts. Highlighting the pivotal role concept in close votes versus low-probability impact in consumption could offer that guidance.
answer: |-
  Here’s a rigorous specification for a theory of individual contributions to collective harms, designed to resolve debates like your flight/burger dilemma. The goal is **practical action guidance**—not just philosophical redescription.

  ---

  ### **Core Desiderata: What the Theory Must Get Right**

  1. **The Razor-Thin Election Case**  
     *Case*: Your vote in a large election where the margin is 1 vote.  
     *Requirement*: The theory must explain why your vote **causally matters** here.  
     *Plain Fact*: Elections *do* occasionally hinge on one vote (e.g., 2017 Virginia House of Delegates election decided by lot after a tie).

  2. **The Millionth Burger Case**  
     *Case*: You buy a burger at a fast-food chain; it’s the millionth sold.  
     *Requirement*: The theory must explain why your purchase **does not trigger a new cow’s death** or expand production.  
     *Plain Fact*: Meat production scales in batches (herds slaughtered, trucks shipped); demand signals are aggregated over time.

  3. **The Solo Flight Case**  
     *Case*: You take one transatlantic flight.  
     *Requirement*: The theory must acknowledge your flight **emits CO₂**, yet explain why it **does not cause a measurable climate impact** (e.g., no single storm/flood).  
     *Plain Fact*: Climate harm is cumulative; linear models break down at micro-scales.

  4. **The Polluted Stream Case**  
     *Case*: You toss trash into a stream already full of garbage.  
     *Requirement*: The theory must condemn your act as **wrong** without claiming you **caused the pollution**.  
     *Distinction*: Participation ≠ Causation. You worsen the harm without being its origin.

  5. **Threshold Sensitivity**  
     *Requirement*: The theory must handle **discrete thresholds** (e.g., 10,000 burgers trigger a new order) without absurdity.  
     *Problem*: It can’t imply that the 10,000th burger-buyer is a "monster" while the 9,999th is "blameless."

  6. **Expected vs. Actual Harm**  
     *Requirement*: The theory must distinguish between:  
     - **Expected harm**: Probability-weighted impact (e.g., 1-in-a-million chance your vote tips the election).  
     - **Actual harm**: What *really* happened (e.g., your burger didn’t change output).  
     *Distinction*: We often blame based on *foreseeable risk*, not just outcomes.

  7. **Participation Without Pivotal Causation**  
     *Requirement*: Explain why joining a harmful practice (e.g., flying) is **ethically significant** even if your act alone changes nothing.  
     *Distinction*: Complicity vs. direct causation.

  ---

  ### **Knockout Conflicts: Desiderata That Clash**

  1. **"Votes Matter" vs. "Burgers Don’t" Without Arbitrary Thresholds**  
     - *Conflict*: If voting matters because elections *can* be close, why doesn’t buying meat matter when production *can* be at a threshold?  
     - *Resolution Challenge*: Must explain why the *probability* of being pivotal is high enough in voting but negligible in consumption.

  2. **Avoiding Threshold Absurdity**  
     - *Conflict*: If harm occurs only when a threshold is crossed, the "last contributor" absorbs all blame for the harm—which is unfair and impractical.  
     - *Resolution Challenge*: Must distribute responsibility smoothly across contributors near thresholds.

  ---

  ### **Scoring the Main Theories**

  | Desideratum                     | Expected Utility (EU) Theory<br>(*Focus: Marginal expected harm*) | Participation Theory<br>(*Focus: "You’re part of the problem"*) |
  |---------------------------------|----------------------------------|--------------------------------|
  | **Razor-Thin Election**         | ✅ Strong: Your vote has high *expected* impact in close races. | ❌ Weak: You’re "participating" whether you’re pivotal or not. |
  | **Millionth Burger**            | ✅ Strong: Near-zero probability you’re pivotal. | ❌ Fails: You’re "complicit" regardless of impact. |
  | **Solo Flight**                 | ✅ Moderate: Tiny expected harm per flight (~0.0001°C warming). | ✅ Strong: You’re adding to cumulative harm. |
  | **Polluted Stream**             | ❌ Weak: Expected harm is tiny if stream is already polluted. | ✅ Strong: Clear complicity in desecration. |
  | **Threshold Sensitivity**       | ✅ Strong: Uses probabilities to smooth thresholds. | ❌ Fails: Collapses all contributors into equal blame. |
  | **Expected vs. Actual Harm**    | ✅ Strong: Built into the framework. | ❌ Weak: Often conflates the two. |
  | **Participation w/o Causation** | ❌ Weak: Frames harm as causal (even if probabilistic). | ✅ Strong: Directly addresses complicity. |

  **Winner**: **Expected Utility** (barely). It handles thresholds, probability, and pivotal cases best.  
  **Biggest Flaw**: Struggles with *participation/complicity* (e.g., polluted stream).  

  **Knockout Desideratum**:  
  **Avoiding Threshold Absurdity** sinks most non-EU theories. Participation theories can’t handle it—they either ignore thresholds (making all acts equally blameworthy) or create moral cliffs (absurdly blaming only the "last" actor). EU avoids this by spreading responsibility via probabilities.

  ---

  ### **The Single Desideratum That Kills Most Theories**  
  **"The Millionth Burger Case"** requires explaining why trivial individual consumption *usually* doesn’t matter—without denying that collective harm occurs.  
  - **Kills**: Causal theories (if your burger didn’t cause harm, you’re blameless), rigid threshold theories (only the last buyer matters), and pure participation theories (you’re always blameworthy).  
  - **Sparks**: Only EU (low expected harm) and *hybrid* theories survive.

  ---

  ### **What to Do on a Tuesday: Practical Guidance**  
  1. **For harms with thresholds** (e.g., meat, flights):  
     - **Act based on expected harm**: Reduce consumption where your *marginal impact* is non-negligible (e.g., boycotting a *small* farm vs. a global chain).  
     - **Vote in close elections**: Your pivotal probability is meaningfully high.  
  2. **For symbolic/participatory harms** (e.g., littering):  
     - **Don’t do it**—even if impact is tiny, you’re endorsing harm.  
  3. **Avoid "all-or-nothing" thinking**: Going vegan 90% of the time reduces expected harm more than being perfect 10% of the time.  

  **Bottom Line**: Expected utility wins because it tells you **when your act is likely to change outcomes**. Use it for climate, consumption, and voting. For purely ethical harms (e.g., littering), add a participation rule: *"Don’t be the person who does this."* No theory is perfect, but this combo is actionable.
