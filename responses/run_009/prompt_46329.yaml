prompt: |-
  I've been reading up on how we actually decide someone is dead, and my gut verdicts don't obviously add up to one principle. Trying to figure out if they do. Here's the set:

  Someone with total irreversible loss of all brain function, brainstem included, kept on a ventilator so their heart keeps beating and they stay warm and pink: dead. That one feels rock solid to me.

  A patient in a permanent vegetative state, cortex destroyed but brainstem chugging along, breathing on their own, sleeping and waking: not dead, even though the person everyone knew is gone. Also feels solid, though I notice some philosophers would say this one IS death if they go for a consciousness-based definition.

  A guy whose heart stops, no resuscitation attempted, doctor waits, pronounces him dead, and then 3 minutes later he gasps and sits up on his own (this actually happens, it's called the Lazarus phenomenon): never died. It's not that he died and came back, it's that the doctor was wrong.

  But an organ donor whose heart stops, the team waits two to five minutes for it to be sure it won't restart on its own, then declares death and takes the organs (donation after circulatory death): dead at that point, and I'm fine with that, it seems right.

  A hypothermic person pulled from an icy lake, no pulse, no brain activity visible on the monitor, basically frozen, but they rewarmed slowly and came back: never dead either.

  A brain-deatd patient where it turns out the posterior pituitary is still secreting antidiuretic hormone, so not literally every cell of the brain is off: still dead, I'm not going to flip on that one over the hypothalamus.

  And an anencephalic baby born without most of the brain but with a working brainstem: not dead.

  So my picture is something like death is the irreversible loss of all brain function, with irreversibility doing the work in the hypothermia case (loss is real but reversible, so not death). But then I hit the pair I can't square: the Lazarus guy and the DCD donor. If autoresuscitation can happen within a few minutes of circulatory arrest, and we say the guy who sits up at minute three never died, in what sense was the DCD donor, declared dead at minute two, actually dead? And the hypothermia case makes it worse, since with cold bodies people have come back after much longer than that.

  Is there a principle that saves all of these, or close? Maybe something about what would happen with versus without intervention? And I'd want to know what it says about a case I haven't made up my mind on: someone in deep hypothermic cardiac arrest put on ECMO, where the machine is circulating and oxygenating their blood while they're rewarmed — during that window, are they dead, alive, or somehow indeterminate? Also happy to hear which of my verdicts you'd throw out if the clean principle requires it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're grappling with the definition of death, presenting several scenarios where their intuitive judgments seem inconsistent. The core issue is reconciling Lazarus phenomenon with donation after circulatory death (DCD), especially regarding irreversibility. 

  First, I need to map their cases: brain death (irreversible loss of all brain function) feels solid to them. PVS patients aren't dead despite lost consciousness. Lazarus cases were misdiagnosed, not resurrected. DCD donors are dead after waiting minutes post-cardiac arrest. Hypothermic recovery isn't death. Partial pituitary function doesn't negate brain death. Anencephalic infants with brainstem function are alive. 

  Their struggle centers on DCD vs. Lazarus: why is one dead at 2 minutes while the other isn't at 3 minutes? The hypothermia case complicates it further with extended reversibility. They hint at a "with vs without intervention" principle and ask about ECMO cases. 

  Hmm... their underlying need seems twofold: 
  1) A coherent biological/philosophical framework that doesn't contradict their intuitions. 
  2) Practical guidance for edge cases like ECMO. 

  They might also be wrestling with ethical implications (organ donation legitimacy) or personal anxiety about misdiagnosis. The mention of philosophers suggests they want rigor but distrust purely consciousness-based definitions. 

  The irreversibility criterion is clearly bothering them. In Lazarus, autoresuscitation means circulation wasn't irreversible; in DCD, protocols ensure irreversibility by context (no resuscitation intent). But the user's gut says Lazarus guy "never died," which clashes with DCD timing. 

  Ah! The key is distinguishing "irreversible" from "permanent." Medical standards define death as irreversible loss, but "irreversible" means "cannot be reversed," while "permanent" means "won't be reversed" due to intent. DCD relies on permanence (no intervention planned), not biological irreversibility. That resolves the Lazarus/DCD tension. 

  Hypothermia fits because biological irreversibility isn't absolute—it depends on conditions (e.g., temperature). ECMO cases are alive because circulation is artificially maintained, preventing irreversible loss. 

  I should validate their instincts—they're mostly aligned with medical consensus. The only potential conflict is philosophers defining PVS as death, but they correctly note that's minority view. 

  For ECMO: during rewarming with circulation supported, the patient is alive (not dead) because loss isn't irreversible yet. If ECMO restarts circulation after biological irreversibility sets in, it's more complex, but they're likely asking about the supported phase. 

  Final note: Their anencephalic baby verdict aligns—brainstem function means alive. Posterior pituitary quibble? Correctly dismissed; whole-brain death isn't cellular. 

  Phew. Nailed it.
answer: |-
  Your intuitions are remarkably consistent with mainstream medical and legal definitions—they just need a slight reframing to resolve the tension. The key is distinguishing **biological irreversibility** from **clinical irreversibility** (which incorporates intent and context). Here's the principle that unifies your cases:

  ### Death is the **irreversible cessation of the organism's integrated functioning as a whole**, determined by either:
  1. **Irreversible loss of all brain functions** (including brainstem),  
     OR  
  2. **Irreversible cessation of circulatory/respiratory functions**, *where "irreversible" means "cannot be restored spontaneously or with medical intervention"*.

  ---

  ### How This Resolves Your Cases:
  1. **Brain-dead patient on ventilator**  
     → *Dead*: Irreversible loss of *all* brain-mediated integration (even with artificial circulation).  
     *(Matches your verdict)*

  2. **Permanent Vegetative State (PVS)**  
     → *Not dead*: Brainstem maintains autonomic functions (breathing, BP), enabling integrated organismal function.  
     *(Matches your verdict; consciousness-based definitions are minority views)*

  3. **Lazarus phenomenon (no resuscitation attempted)**  
     → *Never died*: Spontaneous autoresuscitation proves circulatory cessation was *reversible*. Death was incorrectly declared.  
     *(Matches your verdict)*

  4. **Organ donor after circulatory death (DCD)**  
     → *Dead at declaration*: "Irreversible" here means **permanent cessation by intent**—no intervention will be attempted. Biological potential for autoresuscitation exists but is irrelevant because:  
     - Protocol waits beyond typical autoresuscitation window (2-5 mins).  
     - *No further medical effort* will reverse it.  
     → **Clinical irreversibility = death**.  
     *(Matches your verdict)*

  5. **Hypothermic "corpse" rewarmed to life**  
     → *Never dead*: Biological irreversibility wasn't established (hypothermia preserved cellular function). Loss was *reversible* with intervention.  
     *(Matches your verdict)*

  6. **Brain-dead with residual pituitary function**  
     → *Dead*: Isolated cellular activity ≠ integrated brain function. Whole-brain death requires loss of *neurological* integration, not every cell.  
     *(Matches your verdict)*

  7. **Anencephalic baby**  
     → *Not dead*: Brainstem supports autonomic functions (breathing, circulation), enabling integrated organismal function.  
     *(Matches your verdict)*

  ---

  ### Solving the Lazarus/DCD Puzzle:
  - **Lazarus case**: Circulation ceased *reversibly* (spontaneous return proved reversibility).  
  - **DCD case**: Circulation ceased *irreversibly* **because no intervention will occur**.  
    → The difference is **context of intent**:  
    - *Without intent to resuscitate*, cessation is permanent → irreversible → death.  
    - *With intent to resuscitate*, cessation is temporary until efforts fail.  

  This aligns with the **Uniform Determination of Death Act (UDDA)** and clinical practice: "Irreversible" in death determination means **"cannot be reversed *given current intent and available technology*."** Hypothermia protocols explicitly suspend death declarations because intent *is* to reverse via rewarming.

  ---

  ### Your ECMO Case: Deep Hypothermic Cardiac Arrest
  - **During ECMO rewarming**: **Alive, not dead.**  
    - *Why?* Circulation/oxygenation is artificially maintained, preserving organ function. Integrated functioning hasn't ceased irreversibly—it's *suspended but reversible*.  
    - Death requires **irreversible** loss. ECMO prevents irreversibility by design.  
    - If rewarming fails *and* ECMO is withdrawn *with no further intervention*, death occurs when circulation irreversibly ceases.

  ---

  ### If Forced to Toss a Verdict? Philosophers' PVS Take
  Your only conflict is with philosophers who equate PVS with death via consciousness loss. I'd **reject their view** because:  
  - PVS patients maintain brainstem-mediated integration (homeostasis, respiration).  
  - Medicine defines death as *biological cessation of the organism*, not loss of personhood.  
  - Legally/medically, PVS ≠ brain death.

  ---

  ### Summary Principle:
  **Death occurs when the organism loses its capacity for integrated functioning *irreversibly*—either through total brain failure or circulatory/respiratory failure *that will not/cannot be reversed in that context*.**  
  - "Irreversible" = biologically impossible *or* permanently unattainable by intent.  
  - Context (hypothermia protocols, DCD) defines the threshold for irreversibility.

  This preserves all your verdicts, resolves the Lazarus/DCD conflict, and clarifies ECMO: patients are alive during support because irreversibility hasn't occurred.
