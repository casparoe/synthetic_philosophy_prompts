prompt: |-
  I write novels and I'm in a small writing group that's got a situation I cant stop chewing on. One member, Priya, took a storyline another member had workshopped with us and quietly sold a very similar story to a magazine without saying anything. Everyone agrees it was a scummy move. My problem is I really want to be the one to tell her off — but a few years back I took my ex-boyfriend's family history, which he'd told me about in confidence, and built my second novel out of it without ever asking him. That book is basically what I'm known for. So do I even have the standing to blame her? And if I do go ahead and say something, has she basically earned the right to point at my novel and change the subject? My gut says her hypocrisy... sorry, MY hypocrisy doesn't cancel the message I'd be delivering, but I'm aware that's an awfully convenient thing for me to believe right now. Also worth saying: it's not like I can secretly confess to the group and be cleansed, they'd rightly ask why I never told my ex. Help me think this through — in British English please — and be upfront about how confident you are in your read, plus which part of it you're least sure of.
reasoning: |-
  Okay, the user is a novelist in a writing group dealing with a tricky ethical situation. Priya used another member's workshopped storyline to sell her own story without credit. The user wants to call her out but is conflicted because they did something similar years ago - they based their second novel on their ex-boyfriend's confidential family history without permission. That novel became their claim to fame. 

  Hmm, the core tension here is fascinating - it's about moral authority versus hypocrisy. The user's gut says their past doesn't invalidate calling out Priya's current bad behavior, but they're smartly questioning if that's just self-serving. There's also the practical fear Priya might retaliate by exposing their own plagiarism. 

  Right, the British English request is interesting - suggests either location or preference for understatement. The tone should be measured but firm, avoiding American directness. Phrases like "rather dodgy" and "moral high ground" would fit. 

  What's really eating at them, I suspect, isn't just the ethics but the group dynamics. They're sitting on this secret that could blow up their reputation if revealed. The writing group is their community, and this threatens that. There's also creative guilt - that novel built their career on stolen emotional material. 

  The hypocrisy angle is thorny. Philosophically, bad behavior doesn't magically become okay just because the accuser is flawed. But in practice? Oh absolutely it undermines credibility. If they call Priya out without addressing their own mess, it reeks of selective outrage. 

  Most interesting bit is how they describe their own act vs Priya's. They call hers "a scummy move" but theirs is "built my second novel out of it" - slightly softer language. That cognitive dissonance is very human. 

  The confession idea is telling - they've clearly imagined absolving themselves to the group but realize it's not that simple. Good instinct. Admitting now would just transfer the ethical burden to the group about whether to "forgive" them while ignoring the wronged ex. 

  Least certain part is advising whether to confront Priya at all. The ethical answer might be to fix their own house first, but that feels impractical. Maybe a middle path - address the group issue without personal grandstanding? 

  Also wonder if the magazine submission is provably plagiarism. If it's just "similar," that's murkier territory in creative circles. But the group consensus suggests it's egregious. 

  Ultimately they need two things: how to handle Priya professionally, and how to live with their own creative sin. Those might need separate solutions.
answer: |-
  Right, let's unpack this ethical tangle with a stiff upper lip and a dose of clear-eyed candour. You're absolutely right to feel conflicted – it's a proper mess, ethically speaking.

  **The Core Conflict: Moral Standing vs. Moral Truth**

  1.  **Priya's Action:** Taking a workshopped storyline and selling a substantially similar piece without acknowledgment or credit is, as your group agrees, **fundamentally wrong**. It breaches the implicit trust and purpose of a writing group, which relies on mutual support and ethical sharing. It's intellectual and creative theft. Full stop.
  2.  **Your Past Action:** Using your ex-boyfriend's confidential family history as the *foundation* for your novel without his knowledge or consent is **also fundamentally wrong**. It was a breach of personal trust and confidence. While the *output* (the novel) is your creative work, the *core inspiration and deeply personal material* were taken without permission. This is different from Priya's *direct lifting* of a specific *storyline*, but it's still a serious ethical lapse based on exploiting personal vulnerability.

  **The Hypocrisy Question: Does it Disqualify You?**

  *   **My Read (Highly Confident):** **No, your past action does not automatically disqualify you from recognising and calling out Priya's current, *specific* wrongdoing *within the group context*.** The ethical failing in Priya's action exists independently of your own past. Think of it like this: a reformed thief can still accurately identify and condemn a current burglary. The *wrongness* of Priya's act doesn't vanish because you've also done wrong.
  *   **The Credibility Problem (Also Highly Confident):** **However, your *credibility and moral authority* to be the *primary vocal accuser* or "the one to tell her off" is severely undermined, and Priya *absolutely* "earns the right" to point at your novel if you confront her directly.** Your past action makes you highly vulnerable to accusations of hypocrisy, which Priya will likely (and effectively) weaponise to deflect blame and discredit you personally. It shifts the focus from *her* transgression to *your* character. Your gut feeling ("my hypocrisy doesn't cancel the message") is *philosophically* correct on the *message itself*, but it's naive about *human dynamics*. In practice, your hypocrisy *will* drown out the message and make you look self-serving.

  **The Practical Problem: Group Dynamics & Your Secret**

  *   **My Read (Very Confident):** You are spot-on that secretly confessing to the group now is **not a viable solution and likely to backfire spectacularly**. The group would rightly ask:
      *   Why now? (Only because Priya did something similar? Convenience, not conscience).
      *   Why didn't you tell your ex? (Because you benefited hugely and avoided consequences).
      *   Why didn't you disclose this *before* becoming known for the book? (Again, self-interest).
      *   It would look like a desperate, self-preserving tactic to gain leverage against Priya, not genuine remorse. It would likely damage your standing permanently and potentially fracture the group further.

  **What Should You Do? A Measured Approach (British Stiff Upper Lip Style)**

  Forget the fantasy of being the righteous hero "telling her off." Focus on protecting the group's integrity *without* making yourself the hypocritical lightning rod. Here’s a sensible strategy:

  1.  **Step Down as Chief Accuser:** Recognise that *you* personally leading the charge against Priya is strategically and ethically unwise. Your past makes you too vulnerable.
  2.  **Support the Wronged Party (Quietly & Behind the Scenes):** Speak privately to the member whose storyline was pinched. Express your support for *them* and your shared view that Priya's action was unacceptable. Ask *them* how *they* want to handle it and offer your backing. **Crucially: DO NOT reveal your own past to them as some twisted justification.** This is about *their* grievance.
  3.  **Facilitate a Group Discussion (Without Grandstanding):** When the issue is inevitably raised (ideally by the wronged member or another "clean" member), support a calm, group discussion about the breach of trust. Frame it around **the group's principles and future viability**:
      *   *"Look, regardless of anything else, what Priya did fundamentally undermines the trust this group relies on. If we can't share work-in-progress without fear of it being lifted, the whole point of workshopping collapses. How do we move forward and rebuild that trust?"*
      *   Focus on the *action* and its *impact on the group*, not on attacking Priya's character (even if deserved). Avoid phrases like "scummy move," however accurate.
  4.  **If Directly Challenged by Priya:** If Priya points the finger at your novel in a group setting:
      *   **DO NOT:** Get defensive, lie, or try to justify it on the spot. Denial will crumble.
      *   **DO:** Acknowledge briefly and deflect back to the *current* issue: *"That's a separate matter concerning personal history, Priya, and not relevant to the breach of group trust we're discussing right now. This is about protecting the integrity of *this* group moving forward."*
      *   **Keep it Brief & Principle-Focused:** Don't engage in a tit-for-tat. Reiterate the core point: *"Regardless of anything else, what happened with [Wronged Member's] story cannot become the norm here if we want this group to survive."*
  5.  **Address Your Own Past (Separately & Personally):** This is the hardest part and completely separate from the Priya/group issue. Your conscience is gnawing at you for a reason.
      *   **Consider Contacting Your Ex (Carefully):** This is high-risk and requires deep thought. Is it for *his* closure or *yours*? Could it cause him fresh pain? Is there a way to acknowledge the source and potentially offer reparations (credit, royalties?) without causing undue harm? **This is the part I'm least confident advising on**, as it depends entirely on your specific history, his personality, and whether contact would be reopening old wounds or providing needed closure. **Professional advice (solicitor?) might be prudent before taking any action**, especially regarding potential legal implications. If you do nothing, you live with the secret and the guilt. That's your burden.

  **Conclusion:**

  *   **Confident On:** Priya acted unethically. Your past action was also unethical. You *cannot* effectively be the vocal public accuser of Priya without your hypocrisy dominating the conversation and likely backfiring. Confessing to the group now solves nothing and creates more problems.
  *   **Less Confident On:** The *best* way to handle the conversation with your ex, if you choose to have it. The nuances of that are highly personal and risky.
  *   **The Path Forward:** Support the wronged member privately. Advocate for the group's principles *collectively* when the issue arises, focusing on the future health of the workshop, not personal attacks. Deflect if Priya brings up your novel, but don't deny it. Acknowledge your own past wrongdoing requires separate, careful, and *personal* resolution, not a public performance for the group's benefit.

  It's messy, uncomfortable, and lacking in clear heroes. Focus on damage limitation for the group's trust and start grappling honestly, privately, with your own past transgression. The desire for a dramatic confrontation is understandable, but pragmatism and protecting the group's function must win out. Good luck – you'll need a strong cuppa after navigating this lot.
