prompt: |-
  In my ethics class we discussed Peter Singer's famous example of walking past a shallow pond in which a stranger's child is drowning, and since then I have been trying to work out what I actually believe by recording my gut reactions to a series of rescue cases. I would like to know whether a single principle captures all of my verdicts, and I would rather you tell me honestly that some of them cannot be held together than force a principle that fits everything only by becoming useless. Here are the cases and my verdicts:

  1. I pass a pond and see a stranger's child drowning; wading in would ruin my phone and make me late for school. Verdict: I must do it, and someone who walks past is doing something seriously wrong, not merely being unkind.
  2. A leaflet tells me that a small regular donation would prevent a child far away from dying of malaria. Verdict: I should do it, but skipping it feels like a failure of generosity rather than a cruelty; I would not call someone who never donates a monster, and I do feel that way about the person who walks past the pond.
  3. Ten other bystanders are standing around the pond, all equally able to wade in. Verdict: less obligation falls on me in particular, though I would still blame the group as a whole.
  4. I already gave part of my allowance to charity this month, so the leaflet can wait until next month. Verdict: excused. Yet if I had already pulled one child out of a pond this month, I do not feel excused from the next drowning child I pass. Both of these feel right to me, and I cannot see how they can both be right.
  5. My own child and a stranger's child both need saving and I can reach only one, and mine is slightly farther away. Verdict: saving mine is not merely permitted, it is what I ought to do.
  6. A rescue that would cost me a broken arm, or my part-time job that pays for my sister's care. Verdict: heroic if done, but not wrong if not done.

  I can imagine several candidate principles: that the obligation turns on the size of the cost relative to the good; that it turns on physical proximity and being able to see the victim; or that it turns on whether I am the only one who can help. Perhaps it is several principles at once. Please state the principle, or a shortlist of candidates, precisely; tie each clause to the case that motivates it; tell me plainly which of my verdicts the best principle cannot accommodate and which verdict I should give up; and then tell me what the principle predicts about the case I keep going back and forth on: whether a one-time donation of $200 that would save a stranger's life is obligatory in the same way that wading into the pond and ruining a $200 phone is. If the answer is no, I would like to know what the morally relevant difference is supposed to be; and if the answer is yes, I would like to know why it does not feel that way to me, or to nearly anyone else I have asked.
reasoning: |-
  Okay, I'm diving into this user's ethics dilemma. They've clearly put a lot of thought into Singer's shallow pond analogy and are genuinely wrestling with their moral intuitions. The way they've structured their cases shows analytical rigor—they're not just accepting surface-level answers but testing their gut reactions systematically. 

  Hmm... the core tension seems to be between their intellectual recognition of Singer's argument and their emotional resistance to equating distant aid with immediate rescue. That pond case (#1) triggers a visceral "must act" response, while the donation (#2) feels optional. Interesting how they describe the emotional difference: failing to donate feels like lacking generosity, but ignoring the drowning child feels like cruelty. That's a crucial nuance.

  Let me unpack their cases one by one. Case #3 introduces group dynamics—their intuition suggests moral obligation distributes among available agents. Case #4 reveals a temporal asymmetry: past charity excuses future delay, but past rescues don't. That's particularly thorny. Case #5 affirms special obligations to kin, and #6 draws a cost threshold where sacrifice becomes supererogatory.

  Wait—their sticking point about the $200 comparison is illuminating. They're noticing cognitive dissonance: rationally, saving a life for $200 should be equivalent whether it's a phone or a donation, but emotionally it's not. I suspect the "rule of rescue" effect is at play here—the immediacy of the drowning child hijacks our emotional machinery in ways abstract statistics don't. 

  The user's meta-request is refreshingly honest: they want coherence over comfort. They'd rather abandon a conflicting intuition than force a false reconciliation. That tells me they're philosophically serious. Their frustration with case #4 is palpable—they sense inconsistency between excusing delayed charity but not sequential rescues.

  For the principle... proximity alone seems insufficient given case #5 (saving their own distant child). Pure cost-benefit fails case #2 (same cost, different obligation feel). The "sole potential rescuer" factor from case #3 helps but doesn't explain the charity/rescue asymmetry. 

  Ah! Maybe a three-axis model: (1) directness of causal chain (stepping in vs donating), (2) uniqueness of opportunity (only-me-now vs others-can-help-later), (3) special relationships. That handles cases #1-6 reasonably well, though case #4 remains tricky—perhaps because donations involve fungible resources while rescues are discrete events.

  For the $200 test, the principle says "not equivalent" due to directness/uniqueness factors. But we should acknowledge the user's discomfort: evolution wired us for "person in need right here," not "statistical life somewhere." That doesn't make the intuition correct, but explains its persistence. Might suggest they read about "affective blunting" in moral psychology...
answer: |-
  Based on your carefully considered intuitions, a single, simple principle *cannot* capture all your verdicts without significant tension. However, a **multi-factored principle incorporating cost, uniqueness of opportunity, special relationships, and directness/rescue context** best explains your pattern. Here's the analysis:

  **The Proposed Principle:**

  You have a strong moral obligation to prevent serious harm (like death) to others **if and only if**:
  1.  **The cost to you is not excessive** (relative to the harm prevented and your resources).
  2.  **You are uniquely positioned to help at that moment**, or the obligation isn't reasonably distributable to others.
  3.  **No special relationship obligates you to prioritize someone else.**
  4.  **The harm is imminent and requires direct, personal intervention (a "rescue" context).** (This factor explains the key divergence).

  **How it Explains Your Cases:**

  1.  **Pond/Child:** Low cost ($200 phone/late), unique opportunity (only you present), no conflicting relationships, direct rescue context. **Obligatory.** (Factors 1, 2, 4)
  2.  **Donation/Leaflet:** Low cost (relative), NOT a unique opportunity (many others can donate anytime), no conflicting relationships, **NOT a direct rescue context** (abstract, systemic, mediated aid). **Not obligatory, but commendable.** (Lacks Factor 2 uniqueness *and especially* Factor 4 rescue context).
  3.  **10 Bystanders:** Low cost, **NOT uniquely positioned** (obligation distributable), rescue context. **Reduced individual obligation, group blame.** (Lacks Factor 2).
  4.  **Past Charity vs. Past Rescue:**
      *   *Charity Excused:* Donation lacks Factor 4 (rescue context) and Factor 2 (uniqueness/urgency). It's a recurring, distributable opportunity. Delaying is reasonable.
      *   *Rescue Not Excused:* Each pond case has Factor 4 (direct rescue) and Factor 2 (unique opportunity *at that moment*). Past rescues don't negate the immediate, direct demand of the next one. **Tension Point:** This highlights the critical role of Factor 4 (rescue context).
  5.  **Own Child vs. Stranger:** Special relationship (Factor 3) justifies prioritizing your child, even at slightly higher cost/effort. **Obligatory to save your child.** (Factor 3 dominates).
  6.  **High Cost (Broken Arm/Job):** Cost is excessive relative to the harm prevented *from your perspective* (Factor 1: "excessive" is agent-relative). **Supererogatory, not obligatory.** (Factor 1 threshold exceeded).

  **The Tension & What Must Give:**

  *   **The Major Conflict:** Your intuitions strongly differentiate between the **direct rescue context** (pond) and the **systemic aid context** (donation), even when cost and outcome (life saved) are identical. Your verdicts on Case 2 (donation not obligatory like rescue) and Case 4 (past charity excuses, past rescue doesn't) *require* Factor 4 to be morally significant.
  *   **What Must Give for Coherence:** To achieve a fully consistent principle *without* Factor 4, you would need to **revise your verdict on Case 2**. If saving a life for $200 is obligatory in the pond, it *should* be equally obligatory via donation. The "rule of rescue" (Factor 4) is psychologically powerful but logically hard to justify if the cost/benefit ratio is identical. Singer argues it *is* logically inconsistent to treat them differently. Your intuition that the donor isn't a "monster" while the pond-walker is reveals this deep-seated psychological bias towards immediacy and directness.

  **The $200 Test Case:**

  *   **According to Your Verdicts/Principle (with Factor 4):** **NO**, the one-time $200 donation is **NOT obligatory in the same way** as wading in and ruining a $200 phone to save the drowning child.
  *   **Morally Relevant Difference (Based on Your Intuitions):** The **directness and immediacy of the rescue context (Factor 4)**. In the pond:
      *   The harm is concretely visible and imminent *right now*.
      *   The causal chain is direct and immediate (your action *is* the rescue).
      *   You are the sole, immediate cause of the harm continuing if you walk away.
      *   The donation scenario lacks this visceral immediacy, direct causation, and concrete presence. The harm is probabilistic, distant, mediated by organizations, and many others *could* act (reducing uniqueness, Factor 2).

  **Why It Doesn't Feel Obligatory (The Psychological Explanation):**

  1.  **The Identifiable Victim Effect:** We feel stronger obligations to specific, identifiable individuals (the drowning child) than to statistical lives (a child saved by malaria nets).
  2.  **Proximity (Spatial & Psychological):** Physical presence triggers powerful emotional and instinctive responses (empathy, urgency) that abstract knowledge does not.
  3.  **Omission vs. Commission:** Walking past the pond feels like *actively letting die* (commission by omission). Not donating feels more like *failing to save* (pure omission). Psychologically, the former often feels worse.
  4.  **Diffusion of Responsibility:** In the systemic case (donations), it feels like others *could* and *should* help, diluting individual obligation. At the pond with only you, responsibility is undiluted.
  5.  **Causal Link Perception:** The link between your $200 and a specific life saved feels indirect and uncertain compared to pulling a child out of the water.

  **Conclusion:**

  Your intuitions point towards a **context-sensitive morality** where direct, immediate rescue creates a uniquely strong obligation that systemic aid does not, even with equivalent costs and outcomes. The best principle capturing *most* of your verdicts includes Cost, Uniqueness, Relationships, **and Direct Rescue Context**.

  To achieve perfect logical consistency *without* the rescue context factor, you would need to **abandon your verdict that skipping the donation is merely ungenerous (Case 2) and accept it's as wrong as walking past the pond** (as Singer argues). Alternatively, you must accept that the visceral, direct "rescue" scenario triggers a distinct, psychologically potent (and perhaps rationally privileged) level of obligation that systemic aid does not – even if this distinction is hard to justify purely on cost/benefit grounds. Your struggle with Case 4 powerfully illustrates why this distinction feels necessary to you. The tension is real and reflects a deep debate in ethics.
