prompt: |-
  quick bit of background: i've gotten deep into the pragmatic encroachment literature lately and honestly i'm tired of reading papers that argue for the view before telling me what the view is even supposed to accomplish. so before I take sides, I want the spec. write me the desiderata: what any adequate theory of whether practical stakes affect knowledge has to deliver, with the case or consideration behind each requirement, and flag which ones you suspect can't be jointly satisfied -- that tension is the part I actually care about.

  a few things I'd want on the list, but I'm open to being told these are wrong or camp prejudices:

  - it has to handle the standard bank-type stuff in both directions, and also cases where stakes LOWER the bar. my pet case (be honest if you think it's disanalogous): two inspectors with identical readings from the same testing protocol on whether a bridge is load-bearing; one is signing off on a footbridge, one on a highway bridge. same evidence, different practical stakes, and my intuition is the footbridge guy can sign off and the highway guy can't -- but maybe that's just competence-talk smuggling in?
  - it has to explain why, when I learn about the stakes only AFTER hearing the knowledge attribution ("wait, it mattered?!"), the attribution doesn't feel like it shifted. if stakes are supposed to be doing semantic or epistemic work, this temporal asymmetry needs a story.
  - it has to keep the subject's stakes and the attributor's stakes straight. contextualism and subject-sensitive invariantism both get to raise and lower thresholds, but they disagree about whose situation does it, and there's got to be some datum (disagreement cases? the "yesterday I knew, today the bank is the same but my mortgage is due" case?) that separates them.
  - it can't collapse into skepticism via lottery/preface cases: if "practically relevant alternative" just means "any alternative it would be bad to ignore," everything is relevant everywhere and nobody knows anything.
  - it has to say whether encroachment generalizes. does it apply to justified belief? to rational credence? if it only applies to knowledge, why is knowledge special -- and if it applies everywhere, is it even a thesis about knowledge anymore?
  - it can't contradict the plausible thought that what evidence you have is one thing and what you should do with it is another. i.e., don't let "it's more practical to act on p" quietly turn into "the evidence for p got better." this seems like the one that quietly rules out a bunch of views, but I might be overvaluing it.

  also please mark which requirements you think are non-negotiable vs. which are just what one camp happens to care about, and tell me which single requirement does the most exclusion work. no need to actually score contextualism vs. SSI vs. classical invariantism against the list, I can do that part myself, I just keep going in circles on the criteria.

  (no need for citations or a reading list btw, I've read the standard stuff. just the thinking.)
reasoning: |-
  Okay, the user is deep into pragmatic encroachment literature but frustrated with papers that argue for views without clarifying what the view is supposed to accomplish. They want desiderata for any adequate theory of whether practical stakes affect knowledge. They've listed some initial thoughts but are open to critique and want tensions between desiderata highlighted.

  First, I need to outline the core desiderata. The user mentioned several points: handling bank cases in both directions, cases where stakes lower the bar (like the bridge inspectors), temporal asymmetry in knowledge attributions, distinguishing subject vs. attributor stakes, avoiding skepticism from lottery cases, generalization to justified belief or rational credence, and not conflating practical actionability with evidence strength.

  The bridge inspector case is key. The user thinks the footbridge inspector can know it's safe with the same evidence that the highway inspector cannot. But is this due to stakes or competence? Maybe higher stakes require more evidence, not different competence. But the user wants to ensure the theory accounts for stakes lowering the bar too. So desideratum 1 should include bidirectional stakes effects.

  Temporal asymmetry is another big one. If someone says "I knew it was safe" and later finds out stakes were high, the knowledge attribution doesn't retract. Why? If stakes are part of the truth conditions, learning about higher stakes later should make the original claim false. But intuitively, it doesn't. So the theory needs to explain this without making knowledge attribution time-dependent in a way that feels wrong.

  Subject vs. attributor stakes distinction is crucial. Contextualism says the attributor's context sets the standard, while SSI says the subject's practical situation does. Cases like "yesterday I knew, today I don't" (same subject, changing stakes) might support SSI, but disagreement cases where two attributors in different contexts disagree on whether S knows could support contextualism. The theory must handle such data without conflating whose stakes matter.

  Avoiding skepticism is critical. If every possible alternative that's practically relevant must be ruled out, then in high-stakes scenarios, knowing anything becomes impossible. But people do know things even when stakes are high. So the theory must allow that some alternatives are properly ignored, even when it matters.

  Generalization: does pragmatic encroachment apply only to knowledge? If so, why is knowledge special? If it applies to justified belief or rational credence, then encroachment might be more about action than knowledge specifically. The user wants to know if this undermines the focus on knowledge.

  Non-conflation of evidence and actionability. The user insists that practical stakes shouldn't alter the evidence itself. Evidence is about truth, action is about what to do given beliefs. If a theory blurs this, it might be smuggling in pragmatism where it doesn't belong. This is probably the user's non-negotiable, as they mentioned it rules out many views.

  Now, tensions between desiderata. The biggest one might be between temporal asymmetry and stakes affecting knowledge. If stakes are part of the knowledge conditions, why doesn't learning later about higher stakes change past knowledge attributions? Contextualism might handle this by saying the attributor's context at the time of attribution fixes the standard, but then attributor stakes matter, not the subject's. But SSI focuses on the subject's stakes, so if the subject's stakes change, knowledge changes. That could conflict with temporal asymmetry if the subject's stakes change over time.

  Also, avoiding skepticism while handling high-stakes cases. If in high stakes, more alternatives are relevant, how do we prevent that from making knowledge too hard? The theory needs a principled way to limit relevant alternatives without being ad hoc.

  The user's pet case about bridge inspectors might be challenged as competence-based, not stakes. But if the evidence is identical, competence might not differ. Still, higher stakes could require more evidence, so the subject might need to gather more. But the user specifies same evidence, so the theory must explain why the same evidence isn't sufficient for knowledge when stakes are high.

  Non-negotiable desiderata: avoiding skepticism (4), non-conflation of evidence and actionability (6), and temporal asymmetry (2) seem strong intuitions. Desideratum 1 (bidirectional stakes) and 5 (generalization) might be more debatable. Desideratum 3 (subject vs. attributor) is key for differentiating theories.

  The requirement doing the most exclusion work is likely 6 (non-conflation). If a theory allows practical stakes to affect the strength of evidence, it might be rejected outright by those who see evidence as purely truth-related. Similarly, temporal asymmetry (2) could rule out some strict forms of SSI where knowledge is time-sensitive in a way that clashes with our intuitions about past attributions.

  The user might be hinting at a deeper concern: preserving the objectivity of evidence while acknowledging that practical stakes affect epistemic states. They want a theory that doesn't reduce epistemology to practicality but still accounts for stakes' impact on knowledge. The tension between desiderata 2, 3, and 6 could be where most theories fail.
answer: |-
  Here's a distilled set of desiderata for pragmatic encroachment theories, built from your points and core philosophical pressures. I'll flag tensions and non-negotiables, with cases illustrating each requirement. The goal is a "spec sheet" for evaluating theories.

  ### Core Desiderata (With Cases & Tensions)

  1.  **Bidirectional Stakes Sensitivity (The "Bridge Inspector" Problem):**
      *   **Requirement:** The theory must explain how *increased stakes can raise the epistemic standard* (e.g., highway bridge inspector needs more evidence/certainty than footbridge inspector with identical readings) **AND** how *decreased stakes can lower the epistemic standard* (e.g., footbridge inspector *can* know based on evidence insufficient for highway inspector).
      *   **Case:** Your bridge inspectors. Identical evidence/test results. High-stakes inspector (highway) cannot appropriately act/know; low-stakes inspector (footbridge) can. *Is it competence?* Only if competence is defined relative to stakes – the low-stakes inspector *is* competent *for their practical context* with that evidence, suggesting the stakes directly affect the knowledge threshold itself.
      *   **Tension Potential:** Needs a mechanism where stakes modulate a *single epistemic standard*, not just "different types" of evaluation. Smooth bidirectional modulation is hard.

  2.  **Temporal Asymmetry of Attributions ("Wait, it mattered?!")**
      *   **Requirement:** The theory must explain why learning about *higher stakes after* a knowledge attribution doesn't typically make us retract the *past* attribution, even if we *wouldn't make the same attribution now* in light of the new stakes information. The "truth-value" of the past attribution feels stable.
      *   **Case:** "I *knew* the ice was thick enough to walk on yesterday (attribution made in low-stakes context: just for fun). Wait, you were planning to cross with the life-saving medicine?! Oh God... [Yet, we don't say 'I was wrong yesterday when I said I knew']."
      *   **Non-Negotiable:** This is a powerful intuition about the *retrospective stability* of knowledge attributions. It severely challenges views where knowledge is *intrinsically* and *constantly* tied to the subject's *current* stakes (like strong Subject-Sensitive Invariantism - SSI). Contextualism handles this better.

  3.  **Distinguishing Subject vs. Attributor Stakes (The "Whose Situation?" Problem)**
      *   **Requirement:** The theory must clearly specify whose practical situation (subject's or attributor's) determines the epistemic standard and provide data distinguishing the options. It must handle disagreement cases and shifting stakes for the subject.
      *   **Cases:**
          *   *Subject Shifting Stakes ("Yesterday I Knew"):* Subject S checks bank hours Saturday (low stakes). Knows p: "Bank open Sat." Sunday, S realizes mortgage due Monday, huge penalty (high stakes). Bank hours unchanged. S says: "I *knew* yesterday it was open Sat, but I don't know *now*." (Favors SSI - subject's stakes matter).
          *   *Attributor Disagreement:* Attributor A (low stakes) says "S knows p." Attributor B (high stakes, aware of S's evidence) says "S doesn't know p." Who's right? Is it relative? (Favors Contextualism - attributor's stakes matter).
      *   **Tension Potential:** Accommodating *both* types of cases cleanly is difficult. "Yesterday I Knew" pulls towards SSI; stable disagreement pulls towards Contextualism. Hybrids are messy.

  4.  **Avoidance of Skepticism via Relevant Alternatives (Lottery/Preface Block)**
      *   **Requirement:** The theory *must not* make knowledge impossible in ordinary or high-stakes situations by making *every* remote possibility (e.g., lottery loss, undetected preface error) a "practically relevant alternative" that must be ruled out whenever ignoring it would be disastrous.
      *   **Case:** Lottery Paradox. If needing to act on "This ticket lost" (high stakes: investing life savings) makes the possibility "It won" a relevant alternative requiring evidence I *can't* have, then I never know my ticket lost. But this seems absurdly skeptical. The theory must have a *principled* way to keep most lottery/preface-like possibilities *irrelevant* even in high stakes.
      *   **Non-Negotiable:** This is critical. Any theory collapsing into universal skepticism under high stakes is a non-starter. It forces a constrained notion of "practical relevance" or a mechanism preventing stakes from *infinitely* raising the standard.

  5.  **Scope/Generalization Clarity (Is Knowledge Special?)**
      *   **Requirement:** The theory must state whether pragmatic encroachment applies *only* to knowledge, or also to justified belief, rational credence, etc. If only knowledge, it must explain *why* knowledge is uniquely sensitive to practical factors. If broader, it must clarify the relationship and whether this undermines "encroachment" as a specifically *epistemic* thesis about *knowledge*.
      *   **Case:** If stakes raise the bar for *knowledge* that p (e.g., highway bridge), do they *also* raise the bar for the bridge inspector to be *justified* in believing p? Or to rationally have a high *credence* in p? Or is it *only* the knowledge status that changes? If only knowledge, why isn't the justification/credence sufficient for knowledge when stakes are low?
      *   **Tension Potential:** If encroachment applies only to knowledge, it needs a unique link between knowledge and action/practical reasoning. If it applies broadly (e.g., to justified belief), it risks becoming a thesis about practical rationality/belief-formation bleeding into epistemology, potentially dissolving the distinct "knowledge" question.

  6.  **Evidence-Action Separation (The "No Conflation" Constraint)**
      *   **Requirement:** The theory must *not* allow practical stakes to alter the *evidential support relation itself* or the *objective strength* of the evidence. Stakes can affect *what is required to count as knowing given that evidence*, but not *what the evidence actually supports*. Evidence remains a matter of truth-connection; stakes affect the "passing grade" for action/knowledge.
      *   **Case:** Identical gas gauge readings for two drivers. Low-stakes driver (plenty of gas stations) rationally acts/knows "Enough gas to get home." High-stakes driver (desert, no stations) cannot rationally act/know based on *that same gauge reading*. The theory must *not* say the gauge evidence is *stronger* for the low-stakes driver. It's the same evidence; the *risk tolerance* for action/knowledge differs.
      *   **Non-Negotiable & Major Exclusion Work:** This is likely **THE** requirement that does the most exclusion work. It rules out views that implicitly or explicitly let pragmatic factors directly influence the *content* or *strength* of evidence (extreme versions of pragmatism). It demands encroachment happens *downstream* of the evidence-fixing facts. Views violating this often get accused of confusing epistemic and practical rationality. This constraint is why many encroachment views focus on *epistemic justification* as the locus of stakes sensitivity – justification is the "gatekeeper" for knowledge and is sensitive to *epistemic risk*, which stakes can modulate.

  ---

  **Summary of Tensions & Non-Negotiables:**

  *   **Deepest Tension:** **Temporal Asymmetry (2)** vs. **Subject-Stakes Sensitivity ("Yesterday I Knew" aspect of 3)**. If knowledge *is* constituted by the subject's *current* practical situation (strong SSI), then learning about higher stakes *later* should reveal the past attribution was false. But (2) says it doesn't feel false. Reconciling this is extremely hard for pure SSI. Contextualism avoids this tension but struggles with the subject's own sense of lost knowledge over time.
  *   **Other Key Tension:** **Avoiding Skepticism (4)** vs. **Strong Bidirectional Sensitivity (1)**. Preventing stakes from making *all* possibilities relevant (4) requires limiting how much stakes can raise the bar, potentially constraining the *degree* of high-stakes encroachment in (1).
  *   **Non-Negotiables:**
      *   **Avoid Skepticism (4):** A non-starter if violated.
      *   **Evidence-Action Separation (6):** Violating this fundamentally changes the nature of evidence/epistemology.
      *   **Temporal Asymmetry (2):** A robust pre-theoretical intuition that must be respected or compellingly explained away.
  *   **Camp-Prejudices (Potentially):**
      *   **Bidirectional Sensitivity (1):** Some invariantists might argue the bridge case is *only* about action/competence, not knowledge itself. They might deny stakes *lower* the bar for knowledge.
      *   **Scope (5):** Classical invariantists might see encroachment *only* as a thesis about knowledge's link to action, denying it applies to justification/credence. More radical pragmatists might embrace broader application.
  *   **The Major Excluder:** **Evidence-Action Separation (6)** is the clearest litmus test. It immediately disqualifies views that muddy the purely truth-conducive nature of evidence. If a theory can't satisfy (6), it's likely abandoning core epistemic commitments for many philosophers. **Temporal Asymmetry (2)** is the other major excluder for strong forms of SSI.

  This list provides the necessary friction points. When evaluating a theory (Contextualism, SSI, Impurism, Classical Invariantism), see how it navigates these, especially the tensions between 2 & 3, and the constraints of 4 & 6. The inability to fully reconcile 2 and 3 is often the rock theories founder upon. Good luck breaking the circle!
