answer: |-
  Your suspicion is well-founded: the argument proves too much by making *all* wicked-but-procedurally-valid statutes non-law retroactively, collapsing into a strong natural law position. The misstep lies in **step (4)**, which presents a false dichotomy about judicial duty. Here’s the breakdown of escape routes and why rejecting (4) is the soundest solution:

  ---

  ### **Escape Routes & Their Costs**
  1. **Reject (4): "Identifying the law correctly is all fidelity demands..."**  
     - **Diagnosis**: This premise conflates *legal validity* with *judicial duty*. Positivism separates "what law *is*" from "what judges *ought to do* with it." Fidelity to law *as an ideal* requires applying valid law, but this is a moral-political commitment, not a logical necessity. Judges have role-specific moral obligations that may override applying wicked law (e.g., resigning, civil disobedience, or appealing to extra-legal principles in transitional justice contexts).  
     - **Cost**: Must clarify that positivism accommodates judicial defiance as a moral choice, not a legal one. It accepts that judges may sometimes act *extra-legally* while preserving the separation thesis.  
     - **Why (4) looked plausible**: Hart’s "internal point of view" suggests officials accept rules as standards, but this is descriptive, not normative. The premise smuggles in a moralized view of judicial duty.

  2. **Reject (6): "The decision is paradigmatically legal reasoning..."**  
     - **Diagnosis**: The post-war court’s reasoning *was* retroactive moral correction disguised as legal interpretation. It invoked the 1871 Code not as valid superior law (Nazi statutes had overridden it), but as a vessel for natural law. Calling this "legal" stretches the concept beyond positivist bounds.  
     - **Cost**: Forces you to argue that transitional justice is inherently extra-legal, making the court’s act revolutionary (per Hart in "Positivism and the Separation of Law and Morals"). This risks alienating intuitions about law’s continuity.  
     - **Why (6) looked plausible**: Fuller’s "internal morality of law" makes the court’s appeal to congruence *feel* legal, but this is a normative claim, not a conceptual one.

  3. **Accept the Conclusion (7): "Separation thesis is false..."**  
     - **Cost**: Validates your worry: fugitive-slave laws, apartheid statutes, etc., become "non-law," obliterating positivism’s core function (identifying law without moral evaluation). Law loses its social fact character, collapsing into morality. Historical legal systems (e.g., Rome with slavery) are retroactively nullified.  
     - **Why (7) looked plausible**: In extreme cases like Nazi statutes, moral revulsion tempts us to deny legality. But this confuses moral condemnation with conceptual analysis.

  ---

  ### **The Case for Rejecting (4)**
  - **Step-by-Step Breakdown**:  
    - (1)–(3) are correct positivist claims: Nazi statutes *were* valid law in 1944 by German criteria.  
    - (4) is false: Fidelity to law does *not* exhaust judicial duty. A positivist judge may recognize a statute as valid law but refuse to apply it because of extreme injustice (a moral choice). Hart explicitly endorses this in "Concept of Law" (Chapter IX), suggesting judges should resign rather than apply deeply immoral law.  
    - (5) thus fails: The post-war court did *not* "misidentify" Nazi law. It acknowledged its past validity but applied *new* legal principles post-regime change (per Radbruch: "statutory injustice" negates validity only *after* the fact). This was a moral-political reset, not legal continuity.  
    - (6) is misleading: The court’s reasoning was "legal" only by post-hoc reframing (e.g., treating Nazi laws as void *ab initio*). A positivist can call this constructive myth-making without conceding it reflects law’s nature.  
    - (7) doesn’t follow: Validity *at the time* still depended solely on sources. The court’s later correction doesn’t rewrite history.

  - **Why (4) Looked Unassailable**:  
    Legal positivists (e.g., Raz) often stress that officials *should* apply valid law to maintain rule-of-law values. However, this "should" is defeasible and moral—not a conceptual truth. The argument exploits this by portraying judicial defiance as *necessarily* a failure of legal fidelity, ignoring that positivism permits (even expects) moral pushback against wicked law.

  - **Saving the Fugitive-Slave Example**:  
    A positivist judge in 1850s America could say:  
    > "The Fugitive Slave Act is valid law, but I refuse to enforce it because it is unconscionable. I act against my legal duty, accepting legal consequences for my moral choice."  
    This preserves separation: validity is source-based, while the judge’s defiance is a moral act. The post-war German court did similarly—but retroactively, exploiting a revolutionary moment.

  ---

  ### **Conclusion: How the Machinery Proves Too Much**
  The argument slips at (4) by equating *fidelity to law* with *unconditional obedience*. Once this is accepted, positivism is forced into absurdity: any refusal to apply valid law becomes "misidentification," collapsing validity into morality. Rejecting (4) restores balance:  
  - **Legal validity remains source-dependent** (per positivism).  
  - **Judges may defy law on moral grounds** without redefining validity (per moral pluralism).  

  This aligns with Hart’s response to Fuller: the grudge-informer case shows not that Nazi laws were invalid, but that post-war Germany *needed* retroactive justice to rebuild moral order—a political choice, not a jurisprudential insight. Your instinct about instability between (3) and (5) was correct: (4) is the brittle link that snaps under the weight of history’s worst laws.
