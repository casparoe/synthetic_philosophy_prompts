  Below is a decision tree designed to navigate the logical space of future contingents, starting from the sentence "There will be a sea battle tomorrow" (denoted **P**). The tree uses diagnostic questions to lead a student to one of the named positions (or an unoccupied node), based on commitments about truth values and metaphysical structure. Each node is answerable without prior knowledge of the outcome. The tree includes key tests like the tautology (**P ∨ ¬P**) and the "privileged future" question.

  ---

  ### **Decision Tree: Future Contingents**

  #### **Start**: Evaluate the truth value of **P** ("There will be a sea battle tomorrow") *today*.
  - **Q1: Is P true, false, or neither today?**
    - **Option A: True or false (bivalent)** → Go to Q3.
    - **Option B: Neither (non-bivalent)** → Go to Q2.

  ---

  #### **Q2 (if Q1=B)**: Evaluate the tautology **P ∨ ¬P** ("Either there will be a sea battle tomorrow or there won't").
  - **Option A: True today** → Go to Q3.
  - **Option B: False today** → **Unoccupied** (incoherent; violates fundamental logic).
  - **Option C: Neither true nor false today** → Go to Q3.

  ---

  #### **Q3**: Is there a *privileged future*? (i.e., is one possible future already fixed as the "actual" future, even if contingent?)
  - **Option Yes**: 
    - If from **Q1=A (bivalent)**: → **Leaf 1: Ockhamism or Fatalism** (tree cannot separate; both are bivalent with a privileged future).
    - If from **Q2 (non-bivalent)**: → **Unoccupied** (incoherent; a privileged future implies bivalence for P, contradicting Q1=B).
  - **Option No**:
    - If from **Q1=A (bivalent)**: → **Unoccupied** (unattractive; bivalence without a truthmaker is unmotivated).
    - If from **Q2 (non-bivalent)**:
      - If **Q2=A (tautology true)**: → **Leaf 2: Supervaluationism, Open-Future Branching, or Peirceanism** (tree cannot separate; all share this combination).
      - If **Q2=C (tautology neither)**: → **Leaf 3: Łukasiewicz's Three-Valued Semantics**.

  ---

  ### **Leaf Assignments**
  1. **Leaf 1: Ockhamism or Fatalism**  
     - **Path**: Q1=A → Q3=Yes.  
     - **Features**: Bivalence for **P**; privileged future; tautology **P ∨ ¬P** is true.  
     - **Why tree cannot separate**: Both positions agree on truth values and metaphysics; they diverge on *modal status* (Ockhamism: future contingent; Fatalism: future necessary), which the tree does not test.

  2. **Leaf 2: Supervaluationism, Open-Future Branching, or Peirceanism**  
     - **Path**: Q1=B → Q2=A → Q3=No.  
     - **Features**: Non-bivalence for **P**; tautology **P ∨ ¬P** is true; no privileged future.  
     - **Why tree cannot separate**: All three positions share this logical profile. Differences are in *semantic machinery* (e.g., supervaluation vs. branching timelines) or *grounds for truth* (e.g., Peircean inevitability), not captured here.

  3. **Leaf 3: Łukasiewicz's Three-Valued Semantics**  
     - **Path**: Q1=B → Q2=C → Q3=No.  
     - **Features**: Non-bivalence for **P**; tautology **P ∨ ¬P** is *neither* true nor false; no privileged future.

  ---

  ### **Unoccupied Combinations & Why**
  - **Q1=A (bivalent) → Q3=No**:  
    Unattractive. Bivalence requires a truthmaker; without a privileged future, there is no fact to ground **P**'s truth/falsehood.
  - **Q1=B (non-bivalent) → Q2=B (tautology false)**:  
