  ### **Tree Limitations**
  - **Cannot separate Leaf 2**: Supervaluationism, Open-Future Branching, and Peirceanism share identical answers to the diagnostic questions.  
  - **Cannot separate Leaf 1**: Ockhamism and Fatalism are indistinguishable without testing necessity/contingency.  
