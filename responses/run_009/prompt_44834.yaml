  In the end, the branching futures approach resolves most cases, but the prenatal period requires accepting that nonexistence isn’t harmful when there’s no prior existence to be deprived. That’s the trade-off. For the borderline case, it’s still a loss, just a smaller one. The user’s challenge is whether they can accept that asymmetry as principled or if it feels ad hoc. 

