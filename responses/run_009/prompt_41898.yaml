answer: |-
  Your intuitions align perfectly with **dual inheritance theory** and **memetics**, which distinguish between cultural traits selected for **host benefit** vs. **transmission advantage**. Here's a breakdown of the principle, your cases, and the new example:

  ---

  ### **The Clean Principle: Two Selection Pressures**
  1. **Host-Benefit Selection**  
     Traits spread because they improve survival, reproduction, social cohesion, or utility *for the individual or group*.  
     *Examples:* Literacy, evidence-based medicine, efficient tools.

  2. **Transmission-Selection**  
     Traits spread because they exploit cognitive biases (e.g., curiosity, threat detection, emotion) or social dynamics (e.g., status signaling, low cost), making them **"sticky"** or contagious.  
     *Examples:* Urban legends, superstitions, viral trends.

  **Most cultural traits experience both pressures**, but we can categorize based on the *dominant* driver.

  ---

  ### **Your Verdicts vs. the Principle**
  | **Your Case**               | **Dominant Pressure**         | **Alignment** | **Notes**                                                                 |
  |-----------------------------|-------------------------------|---------------|---------------------------------------------------------------------------|
  | Chain letters               | Transmission (threat/novelty) | ✅ Perfect    | Exploits threat-detection bias.                                           |
  | Literacy                    | Host benefit (utility)        | ✅ Perfect    | Directly improves individual capability.                                  |
  | "10% of brains" myth        | Transmission (juicy/simple)   | ✅ Perfect    | Falsity irrelevant; satisfies curiosity.                                  |
  | Knocking on wood            | Transmission (low-cost/ritual)| ✅ Perfect    | Costless superstition "just in case."                                     |
  | Earworm pop songs           | Transmission (catchiness)     | ✅ Perfect    | Optimized for auditory memory, not depth.                                 |
  | Tipping                     | **Host benefit (social smoothing)** | ✅ Your call  | Reduces interaction friction—functional norm.                             |
  | Religious kid-rearing       | **Mixed** (flip-flop justified)| ⚠️ Nuanced    | Host benefit (comfort/community) + transmission (faith propagation).      |
  | "Honey never spoils" fact   | **Transmission (fun/novelty)**| ❗ Your gut is right | True/useful, but shared for intrigue—not utility. Host benefit is incidental. |

  ---

  ### **The "Honey" Problem & Framework Limits**
  - **Why it fits Transmission**: Even true/useful facts can spread *primarily* via transmission advantages (e.g., surprise value, simplicity). People share "honey never spoils" because it’s **counterintuitive and satisfying**, not because they use it to store honey. Utility is secondary to stickiness.
  - **Framework Limitation**: Host-benefit traits *can* become detached from utility if transmitted for entertainment (e.g., "fun facts"). The key is **why it persists**: Is it used, or just repeated?

  ---

  ### **The Mnemonic Case: A Clear Verdict**
  > **A mnemonic so catchy students remember it forever, but forget its purpose.**  
  > - **Dominant Pressure: Transmission-selection**  
  >   - It persists due to **perfect memorability** (rhyme, rhythm, etc.), not ongoing utility.  
  >   - The host derives *no benefit* once the original purpose is forgotten—it’s a "zombie meme."  
  > - *Analogy:* An earworm song you can’t forget, but hate.  

  ---

  ### **What You Might Give Up**
  To apply this cleanly, you’d need to:
  1. **Accept that utility ≠ transmission driver**.  
     (e.g., "honey" is useful but spreads via novelty).
  2. **Classify "tipping" as host-benefit** despite its flaws, as it solves coordination problems.  
  3. **Treat religion as mixed**, not forcing it into one box.

  ---

  ### **Key Insight: The "Why" Behind Persistence**
  Ask: **"Would this spread if it offered no benefit, or if it were false?"**  
  - *Chain letters*: Yes (they’re false but spread).  
  - *Literacy*: No (useless skills die out).  
  - *The mnemonic*: Yes (it’s already detached from function).  

  This clarifies why "honey" leans transmission-driven—it *would* spread even if useless (like "knocking on wood"). Your framework holds, but requires weighing the *primary* evolutionary pressure.
