  The honey fact is their sticking point. It's true and useful, yet shared for amusement, not utility. This exposes the framework's flaw: transmission drivers (like fun facts) can hijack even beneficial traits. The user intuitively wants to put honey with literacy but realizes repetition isn't tied to personal use. 

