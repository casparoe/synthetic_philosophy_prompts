prompt: |-
  I run patient safety investigations for an NHS trust, and every serious incident report we produce has a seperate section for 'causal and contributory factors'. The arguments I keep getting into are about omissions — things somebody *didn't* do. The pre-op pause wasn't done before a wrong-site block; the call bell was left out of reach and hourly rounding hadn't happened before a fall at night; the on-call doctor didn't escalate to the consultant. Half my team thinks listing an omission as a cause is basically meaningless (nothing didn't happen, so how can nothing cause something?), and the other half wants to stick every conceivable non-action into the report, which dilutes it so much that none of the recommendations ever get made. I gather philosophers have actually worked on this — causation by omission, whether it turns on what *should* have happened versus what usually happens, that kind of thing — but I need something my investigators can run in under an hour per case, with zero philosophy background, and phrased so it survives being read by a coroner and by bereaved families, not just by us.

  So please write me a decision procedure: the questions to ask in order about any candidate omission, what counts as a good enough answer at each step, where the procedure stops with 'don't list it', and the points where it has to hand the call over to the panel because the question is one of values rather than facts. Then run it on three cases: (1) a wrong-site nerve block that went in because the team didn't do the pre-procedure pause, though the surgeon had also marked the wrong limb beforehand, so both an act and an omission are candidates; (2) the night-time fall where the bell was out of reach and rounding hadn't happened, and we genuinely cant tell which one mattered; (3) a delayed diagnosis where the on-call doctor didn't escalate overnight and the delay probably made no difference to the outcome, but the family is (understandably) furious and wants it listed as a cause. Include at least one case where the procedure gives an answer I won't like — I suspect it'll come out exonerating somebody I'd rather it didn't. And please be upfront about what the procedure can't settle, since the report has to go out either way. Please write the whole thing in British English. Thanks!
reasoning: |-
  Okay, this is a fascinating and high-stakes query from an NHS patient safety investigator. They're grappling with a very real philosophical and practical problem: how to handle omissions (things that weren't done) in their causal analyses of serious incidents. The tension they describe is palpable - some team members dismiss omissions entirely ("nothing can't cause something"), while others over-list them to the point of diluting reports. 

  What they need isn't theoretical philosophy but a practical, coroner-proof decision tool that can be applied quickly by frontline staff. The three scenarios they've provided are excellent test cases that cover different omission complexities: concurrent acts/omissions, indistinguishable factors, and emotionally charged "near misses" where harm was inevitable.

  I'm struck by how well they've framed the problem - they explicitly want the tool to flag when value judgments are needed (not hide them), and they're brave enough to request an example that might exonerate someone. That shows real intellectual honesty. The British English requirement is clearly important for legal precision in their context.

  The core challenge is balancing three things: 1) philosophical coherence (can an omission truly be causal?), 2) practical utility for safety improvement, and 3) legal/ethical accountability to families and coroners. I'll need to draw on but radically simplify concepts from Hart & Honoré's causation theory and Reason's Swiss Cheese model.

  For the decision procedure, I'm imagining a flowchart-style checklist with clear stop/go points. The key will be making the "but-for" test operational without using legal jargon, and building in proportionality checks to prevent laundry-listing. The "handover to panel" moments need to be unmistakable - probably when professional standards or harm assessments come into play.

  The wrong-site block case is perfect for showing how acts and omissions interact - the marking error (act) and missed pause (omission) are both necessary but neither sufficient alone. The fall case brilliantly demonstrates probabilistic causation where we can't determine which factor was decisive. The delayed diagnosis case will likely be the uncomfortable one - if escalation wouldn't have changed outcome, does it belong in causation? (Spoiler: I think it might not, which they won't like but need to hear.)

  I'll use very concrete language throughout - no "counterfactual dependence" talk. Instead: "If this action HAD been done, would harm likely have been prevented?" The coroner-proofing means every criterion must be justifiable under oath. Phrases like "foreseeable harm" and "duty of care" will anchor it in UK clinical governance frameworks.

  Most importantly, the tool must force prioritization. As they said, listing every possible omission makes reports useless. So the final filter will be about preventing future harm - if including the omission doesn't enable better safeguards, it doesn't make the cut. That's where their patient safety mission comes center stage.
answer: |-
  Here’s a practical decision procedure for handling omissions in causal analyses, designed for NHS investigators. It’s grounded in legal/clinical reasoning (not philosophy), uses plain language, and prioritises patient safety over theoretical debates. The procedure has **5 questions**, with clear exit points.

  ---

  ### **Decision Procedure: Should We List an Omission as a Causal/Contributory Factor?**
  **(Time: < 15 mins per omission candidate)**

  1.  **Was there a RECOGNISED DUTY TO ACT?**
      *   *Ask:* Was the omitted action required by policy, protocol, training, or professional standards?
      *   *Good Answer:* "Yes, defined in [Policy X/Protocol Y/Professional Code Z]."
      *   *Stop/Exit:* If **NO** → *Do not list as causal/contributory.* (e.g., *"Nurse didn’t sing a lullaby"* isn’t a duty).
      *   *Handover to Panel:* If the duty is ambiguous, contested, or relies on unwritten norms → *Panel must decide.*

  2.  **Was the omission a PRACTICAL POSSIBILITY?**
      *   *Ask:* In the specific circumstances, was it realistically feasible for the person(s) to perform the action?
      *   *Good Answer:* "Yes, resources/staffing/time/environment allowed it." OR "No, because [specific barrier]."
      *   *Stop/Exit:* If **NO** (due to genuine barrier like emergency diversion) → *List as CONTEXT, not cause.* (e.g., *"Staffing levels prevented hourly rounding"* → context, not direct cause of *this* fall).
      *   *Handover to Panel:* If feasibility is highly debatable (e.g., perceived vs. actual time pressure).

  3.  **Is the omission a NECESSARY CONDITION ("But For")?**
      *   *Ask:* **"If the action HAD been done, is it MORE LIKELY THAN NOT that the harm would have been PREVENTED or SIGNIFICANTLY REDUCED in severity?"**
      *   *Good Answer:* Clear "Yes" (e.g., *Pause done → wrong site blocked identified*) or "No" (e.g., *Escalation wouldn't have changed outcome*).
      *   *Stop/Exit:* If **NO** → *Do not list as causal/contributory.* List as LEARNING POINT if appropriate (see Q5).
      *   *Handover to Panel:* If the link is probabilistic/uncertain (e.g., *Would rounding *definitely* have prevented *this* fall?*), or if harm reduction is debatable.

  4.  **Was the omission a FORESEEABLE RISK?**
      *   *Ask:* Should a reasonable professional in that role have foreseen that *not* doing this action could lead to *this type* of harm?
      *   *Good Answer:* "Yes, this is a known, documented risk of omitting [action]." (e.g., *Not doing pause → wrong site surgery*).
      *   *Stop/Exit:* If **NO** (truly unforeseeable, novel event) → *Do not list as causal/contributory.* (Rare in NHS).
      *   *Handover to Panel:* If foreseeability is marginal or depends on specialist knowledge.

  5.  **Does including it add VALUE FOR PREVENTION?**
      *   *Ask:* Will listing this omission lead to a **specific, actionable recommendation** that demonstrably improves future safety? Or is it just blame-listing?
      *   *Good Answer:* "Yes, it points directly to [recommendation, e.g., audit pause compliance, redesign bell placement]."
      *   *Stop/Exit:* If **NO** (vague, no clear action, duplicates other factors) → *Do not list as causal/contributory.* Mention in narrative if contextually vital.
      *   *Handover to Panel:* If the safety value vs. blame potential is finely balanced.

  ---

  ### **Applying the Procedure: Case Studies**

  #### **Case 1: Wrong-Site Nerve Block**
  *   **Act:** Surgeon marked the wrong limb.
  *   **Omission Candidate:** Team didn't perform the pre-procedure pause.
  *   **Analysis:**
      *   **Q1 (Duty):** YES (Mandatory policy/protocol).
      *   **Q2 (Possible):** YES (No reported barriers).
      *   **Q3 (Necessary):** **YES.** If the pause *had* been done competently, the wrong mark *should* have been identified, and the block *should not* have proceeded on the wrong site. The pause is a *specific defence* against marking errors.
      *   **Q4 (Foreseeable):** YES (Core purpose of pause).
      *   **Q5 (Value):** YES (Recommendations: Mandatory pause audit, training on challenge culture).
  *   **Conclusion:** **LIST THE OMISSION** as a key contributory factor alongside the wrong marking. The harm required *both* the act *and* the omission of the safety check.

  #### **Case 2: Night-Time Fall (Bell out of reach + No Rounding)**
  *   **Omission Candidates:** 1) Call bell left out of reach. 2) Hourly rounding not done.
  *   **Analysis (Apply to each):**
      *   **Q1 (Duty):** YES for both (Basic nursing care / policy).
      *   **Q2 (Possible):** ASSUME YES for both (No specific barriers reported).
      *   **Q3 (Necessary):** **HANDOVER TO PANEL.** We *cannot know* which omission was the necessary condition. *Maybe* the patient would have used the bell if reachable. *Maybe* rounding would have intervened before the fall. *Maybe* both were needed. The link is probabilistic. The panel must weigh the evidence and decide if *either or both* meet the "more likely than not" threshold for *this specific fall*, based on patient factors, timing, etc. **Likely Outcome:** Panel lists BOTH as contributory factors, acknowledging the uncertainty but recognising both are failures of fundamental care creating risk.
      *   **Q4 (Foreseeable):** YES for both (Known risks).
      *   **Q5 (Value):** YES for both (Recommendations: Bell placement audits, mandatory rounding compliance monitoring).
  *   **Conclusion:** **HANDLED BY PANEL.** Likely both listed as contributory due to clear duties, foreseeability, safety value, and the inherent difficulty in isolating a single "necessary" factor in fall prevention.

  #### **Case 3: Delayed Diagnosis (No Escalation, Probably No Impact)**
  *   **Omission Candidate:** On-call doctor didn't escalate to consultant overnight.
  *   **Act:** Underlying condition progressed (but outcome likely unchanged).
  *   **Family Demand:** List non-escalation as a cause.
  *   **Analysis:**
      *   **Q1 (Duty):** YES (Escalation policy likely exists for concerning cases).
      *   **Q2 (Possible):** ASSUME YES.
      *   **Q3 (Necessary):** **NO.** Expert review confirms that even *if* escalation happened overnight, the diagnosis/treatment trajectory and **final outcome would not have been materially different.** The delay, while regrettable, did not *cause* the harm. The underlying condition was too advanced/aggressive.
      *   **Stop/Exit at Q3.**
  *   **Conclusion:** **DO NOT LIST as a causal/contributory factor for the harm.** This is the answer you won't like.
  *   **But...**
      *   **Learning Point:** The omission *can and should* be mentioned in the narrative as a deviation from protocol and a factor in the *delay* (even if not causal of the *final outcome*). This supports recommendations (e.g., review escalation criteria, junior doctor support).
      *   **Communication:** Explain clearly to the family *why* it's not listed under causation (based on expert clinical opinion on outcome impact), while acknowledging the failure to follow procedure caused understandable distress and is being addressed. The Coroner will understand the distinction between process failure and causation of harm.

  ---

  ### **What the Procedure Can't Settle (Be Upfront in Reports)**

  1.  **Value Judgments (Handover Points):** Where duties are unclear, feasibility contested, necessity probabilistic, or safety value debatable. *State clearly in the report:* "The panel determined that [omission] met the criteria for causation based on [reasoning]."
  2.  **"Root Cause" vs Contributory Factor:** It identifies factors meeting the criteria, not necessarily *the* single root cause. Most incidents involve multiple necessary factors (like Swiss cheese).
  3.  **Blame vs. System Focus:** The procedure focuses on *factors* for *prevention*. It identifies *what* failed, not *who* to blame. Ensure recommendations target systems (processes, environment, training) not individuals.
  4.  **Certainty:** It uses "more likely than not". Absolute certainty is rare in complex systems. Reports should reflect this (e.g., "contributed to" vs "caused").
  5.  **Family/Cultural Expectations:** It may not list factors families *feel* are causal (like Case 3). This requires sensitive, separate communication explaining the *safety analysis* rationale.

  ---

  **Key for Coroners & Families:** Frame the report narrative using this consistent logic:
  > *"The team did not perform [Action X], which was required by [Policy Y]. If [Action X] had been performed, it is likely the harm would have been prevented [or significantly reduced]. Failing to perform [Action X] is a known risk for this type of incident. Therefore, this omission is listed as a contributory factor. Addressing this through [Recommendation Z] will reduce future risk."*

  This procedure provides rigour, consistency, and safety focus while efficiently filtering out irrelevant or non-causal omissions. It makes the reasoning behind listing (or not listing) omissions transparent and defensible.
