prompt: |-
  I teach metaethics, and over the last decade or so I've talked myself into evolutionary debunking -- roughly the line that natural selection shaped the content of our evaluative judgments, so the moral realist owes us a story about why those judgments would happen to track stance-independent moral truths, and (I say) they don't have that story. I'm on Street's side of that debate, though I'll admit I've moved to my own stronger version: I call it the twin-lineages test. Imagine two species like ours, evolved under identical selection pressures but with inverted evaluative starting points -- the one with our altruistic tendencies toward kin, the other with, say, a flagellant streak that happens to be equally fitness-enhancing. Now give both species ten thousand years of rational reflection. If reflection washes out the difference and they converge, my realist colleague says the evolutionary origin becomes irrelevant. If the difference persists, I win: it shows reasoning itself is contaminated by its starting points. What worries me is that I've never actually thought through what would make me give the view up, and my colleague (a committed realist, very smug about it) keeps telling me the position is engineered to survive anything -- every apparent counterargument gets absorbed as "just what you'd expect selection to produce."

  So here's my ask: give me a map of what would actually count against evolutionary debunking, as I've stated it. I want the defeaters ranked, and I want you to be honest about which ones a committed debunker would concede as genuine problems versus dismiss with the standard moves (third-factor stories, the "selection explains the capacity not the content" line, the complaint that the argument proves too much and debunks logic or math too, the point that self-defeat cuts both ways). Also tell me which empirical findings -- from moral psychology, cross-cultural work, evolutionary theory, wherever -- should worry me, including ones that have arguably already landed rather than hypothetical ones. And crucially: tell me whether my twin-lineages test is doing any real work or whether it's just intuition-pumping that I'd reinterpret either way. If the view is genuinely insulated from counterevidence, I want to know whether that's fatal for a view of this kind or whether metaethical views get some kind of pass that empirical theories don't.

  Since my notes are a mess, please give me the whole thing as structured data -- a single JSON object like this:

  {
    "restated_position": "the debunking position as you understand it, two sentences max",
    "defeaters": [
      {
        "defeater": "short name for it",
        "what_it_looks_like": "the observation, argument, intuition, or empirical result that would count against the view",
        "decisiveness": "one of: fatal, serious, merely awkward",
        "standard_debunker_response": "the move a committed debunker would make here",
        "assessment_of_that_response": "whether the response is principled or ad hoc, and why"
      }
    ],
    "already_happened": ["defeater names from the list above that have arguably already occurred, with one-line justifications"],
    "twin_lineages_verdict": "whether my thought experiment is load-bearing or reinterpretation-proof, and why",
    "insulation_verdict": "has the view been qualified into unfalsifiability, and if so is that a problem for a metaethical view specifically",
    "shortest_path_to_abandonment": "the single thing that, if it happened, should make me give the view up"
  }

  Fill the defeaters array with at least six entries and sort them from most to least decisive. And if you think the realists have actually been winning this one and I've had my head in the sand, say so in the insulation_verdict -- don't spare my feelings, I get enough of that at faculty meetings.
