prompt: |-
  I'm TA-ing a first-year ethics course and my section has 16 students, 75 minutes. This week the reading is on moral testimony -- the idea that taking someone's word for moral stuff (vs. just asking them to give you reasons) is somehow defective, in a way it isn't for weather forecasts or medical diagnoses. My professor says the reading always slides right off them, and honestly when I was an undergrad it slid off me too. So: design me an activity where they run into the problem before I name it, no lecture up front.

  Here's the shape I was imagining, but feel free to improve it: students get paired, and one student in each pair recieves a sealed "verdict card" from a made-up ethics consultation bureau about a concrete case (e.g. whether to tell a friend her fiance is cheating, or whether to renege on a club commitment to take a better one). The card gives only the verdict, no reasons -- the bureau is "paid by the verdict" or whatever fiction makes the setup natural. The other student gets the full case description and isn't allowed to say what's in it. The verdict-holder has to decide whether to act on the verdict alone, then they compare notes and find out how far apart they were. Then maybe a second round where the "bureau" offers reasons on request, but only at a cost, so they feel the pull of outsourcing vs. demanding reasons.

  What I want at the end: a debrief that maps the moments in the game onto the actual issue -- the asymmetry between deferring on facts and deferring on morals, and the difference between using someone as a proxy and using them as a pointer to reasons. Also tell me what will predictably go wrong the first time I run this (my gut says some students will just treat the verdict as a coin flip and not feel any discomfort at all), and be honest about which part of the moral testimony debate an activity like this just can't reproduce and I'll have to supply in the debrief. Keep the whole thing runnable by one stressed TA with a printed stack of cards and no budget.
reasoning: |-
  We are going to design an activity that simulates the dilemma of relying on moral testimony without reasons. The goal is for students to experience the discomfort of acting on a moral verdict without understanding the reasoning behind it, and then to explore the difference when reasons are available (but at a cost). We'll use a concrete case to make it tangible.

  Structure:
  1. Introduction (without revealing the topic): Very brief, just to set up the activity.
  2. Pair students: 16 students -> 8 pairs.
  3. Each pair gets:
     - One student (Role A: "Agent") receives a sealed "Verdict Card" from the "Ethics Consultation Bureau" (ECB). The verdict is a simple yes/no or a specific action to take.
     - The other student (Role B: "Case Holder") receives a detailed case description. They are not allowed to show or read the case to the Agent. They can only answer specific questions about the case if the Agent asks (but in the first round, the Agent doesn't have the case, so they might not know what to ask).
  4. Round 1: The Agent must decide whether to act on the verdict alone (without knowing the case). They must record their decision and their confidence level (e.g., on a scale of 1-5).
  5. Then, the pair shares: The Case Holder reveals the case description. The Agent then sees the details and they discuss how they would have decided without the verdict and whether the verdict changed their mind. They note how far apart they were.
  6. Round 2: Now, we introduce the option of getting reasons. The ECB (which is the TA) can provide a reasons card, but at a cost. The cost could be an opportunity cost: they have to spend time (or a token) to get it, meaning they can't do something else (like discuss with their partner more). Alternatively, we can simulate a cost by having the Agent write down what they are giving up (e.g., 2 minutes of discussion time). The Agent then gets the reasons and can reassess. They record their decision again and confidence.
  7. Debrief: Whole group discussion, mapping the experience to the concept of moral testimony.

  Materials needed:
  - 8 different case descriptions (so that not all pairs have the same case, to avoid cross-talk and to have variety). But we can have 2 pairs per case if we want to reduce prep, but 4 cases might be enough (so 4 cases, each done by 2 pairs).
  - 8 Verdict Cards (one per pair) that are sealed and only for the Agent.
  - 8 Case Descriptions for the Case Holders.
  - 8 Reasons Cards (for Round 2) that are only given upon request and after paying the cost.

  Case Selection:
  Choose cases that are morally ambiguous and relatable to first-year students. Examples:
  1. Telling a friend about a cheating fiancé.
  2. Whether to renege on a club commitment for a better opportunity.
  3. Whether to report a classmate you saw cheating on an exam.
  4. Whether to donate a large sum of money to a charity that is efficient but in a faraway country, versus a local charity that is less efficient.

  Verdicts: We assign a verdict arbitrarily (but consistently for the same case) so that half the cases have one verdict and half the other? Actually, for each case, we can have two different verdicts? But that might complicate. Instead, let's assign a verdict that is non-obvious (so not the one most people would choose). For example:
  - Case 1: "Don't tell your friend about the cheating fiancé."
  - Case 2: "Renege on the club commitment."
  - Case 3: "Don't report the cheating classmate."
  - Case 4: "Donate to the local charity."

  The idea is that the verdict might be counterintuitive, so that when the Agent acts on it without reasons, they feel uneasy.

  How to run the activity:

  Step-by-Step:

  1. [5 min] Introduction: "Today we're going to do an activity about decision-making in ethical situations. You'll be in pairs, each with different information. Follow the instructions step by step. Don't reveal your information until told."

  2. [5 min] Divide into pairs and assign roles (A and B). Hand out materials: to each Agent (A) a sealed Verdict Card, to each Case Holder (B) a Case Description. Tell them not to open the verdict until instructed.

  3. [5 min] Instruct the Agents: "Open your verdict card. It contains a verdict from the Ethics Consultation Bureau about what you should do in a situation. You don't know the situation yet. Based ONLY on the verdict, you must decide: will you follow the verdict? Record your decision (yes/no) and your confidence in that decision (1=very unsure, 5=very sure)."

     Instruct the Case Holders: "You have a description of the case. Do not reveal it to your partner until instructed. If your partner asks you questions about the case, you may answer, but only with the information in the case. Do not offer your opinion."

     However, note: the Agent doesn't know the case, so they might not know what to ask. That's part of the point: they have to act on the verdict alone. But if they ask, the Case Holder can answer. But the Case Holder cannot volunteer information.

  4. [10 min] Round 1: Agents make their decision. They write it down.

  5. [10 min] Now, tell the pairs: "Case Holders, reveal the case to your Agent. Agents, read the case. Discuss together: 
     - What would you (the Agent) have decided if you had known the case but not the verdict?
     - Did the verdict change your mind? 
     - How confident are you now in the verdict? 
     - How do you feel about having acted on the verdict without knowing the case?"

     They should note down key points.

  6. [10 min] Round 2: "Now, the Ethics Consultation Bureau offers a service: for a cost, they will provide the reasons behind the verdict. The cost is: you must give up 2 minutes of your discussion time. If you want the reasons, the Agent must raise their hand and I will come and collect the cost (by taking 2 minutes off your remaining time) and give you the reasons card."

     Actually, we can't easily take 2 minutes off, so instead: tell them that if they request the reasons, they must wait for 2 minutes (during which they can't discuss) while the TA brings the reasons. Or, to simplify: the cost is that they have to give up one of their discussion points (a token) that they might use later? But that's abstract.

     Alternative: Tell them that if they request the reasons, they have to spend 30 seconds writing down what they are giving up (e.g., "I give up the chance to discuss the case further with my partner for 2 minutes"). Then the TA gives the reasons card. Then they can read it and discuss with the remaining time.

     Actually, let's make the cost concrete: when they request the reasons, they must wait for 1 minute (the TA will time it) without talking to their partner. Then they get the reasons. Then they can discuss for 3 minutes (so total 4 minutes for Round 2, but the pair that paid the cost only gets 3 minutes of discussion).

     But time is tight. Alternatively, we can have the cost be that they get less time in the next part? That might be messy.

     Since we have 75 minutes, we can allocate:

     Round 2: 10 minutes total.
     - First 2 minutes: pairs discuss without reasons (unless they request them). 
     - If they request reasons, the Agent raises hand. TA comes, takes the Verdict Card and gives the Reasons Card and a stopwatch. They must wait 1 minute (without talking) to simulate the cost. Then they can read the reasons and then discuss for the remaining time.

     But let's not overcomplicate. We can do:

     "If you want the reasons, you must pay a cost: you will have 1 minute less for the entire Round 2 discussion. The reasons will be provided immediately upon request, but you lose 1 minute of the 5 minutes allocated for Round 2."

     Then, for Round 2: 
     - Total time: 5 minutes.
     - For pairs that request reasons: they get 4 minutes of discussion (and the reasons card immediately).
     - For others: 5 minutes.

     During Round 2, they should discuss: 
     - How do the reasons affect your confidence in the verdict?
     - Would you now follow the verdict? (They can change their decision.)

  7. [20 min] Whole group debrief. Key questions:

     - How did it feel to make a decision based only on a verdict without knowing the case?
     - How did it feel when you learned the case? Did the verdict seem more or less reasonable?
     - For those who paid for reasons: how did the reasons change your perspective? Was it worth the cost?
     - Compare this to other kinds of testimony: for example, if a weather forecast tells you it will rain, do you need to know the reasons? What if a doctor gives you a diagnosis without explaining? Why is moral testimony different?
     - Point out: the discomfort they felt is what philosophers call the problem of moral testimony. Why do we think it's problematic to outsource moral decisions? And why might we be okay with outsourcing factual ones?
     - Also, note the difference between using the bureau as a proxy (just doing what they say) versus as a pointer to reasons (so you can engage with the reasons yourself).

     Map the activity to the concepts:
     - Round 1: pure moral testimony without reasons -> feels alienating, like you're not the moral agent.
     - Round 2: reasons provided -> now you can engage, but at a cost (you had to give up something). This reflects that getting reasons requires effort, but it allows you to form your own judgment.

     Also, note: sometimes we do rely on moral testimony (e.g., in a crisis, or when we trust an expert), but there's a worry that it bypasses moral autonomy.

  What might go wrong:
  - Some students might not take the verdict seriously and just flip a coin. To mitigate: emphasize that this is a real decision and they are expected to take it seriously. Also, the cases should be engaging and the verdicts non-obvious to create tension.
  - Case Holders might accidentally reveal too much. Emphasize that they can only answer direct questions and not volunteer.
  - Time: 75 minutes is tight. We must keep to the schedule.
  - The cost in Round 2 might feel artificial. But we can explain in debrief that it represents the time/effort we must spend to understand reasons.

  What the activity can't capture:
  - The activity focuses on the experience of the recipient of testimony, but the debate also involves the testifier's perspective (e.g., whether it's appropriate to give moral testimony without reasons). 
  - The deeper philosophical arguments (e.g., about moral expertise, the nature of moral facts, etc.) will have to be covered in the debrief or in follow-up discussion.
  - The activity might not fully capture the idea that moral testimony is problematic even when the testifier is reliable. We experience discomfort, but the philosophical reasons for why that discomfort is justified (or not) must be explained.

  Materials preparation:
  - Print 8 case descriptions (each on a card or sheet). We'll have 4 different cases, 2 copies of each.
  - Print 8 verdict cards (for each case, two verdict cards? Actually, we want the same verdict for the same case to avoid confusion. So for each case, we have one verdict. Since we have 2 pairs per case, we make two identical verdict cards for each case? Or one per pair? So 2 verdict cards per case? Actually, we have 8 pairs -> 8 verdict cards. But if we have 4 cases, then for each case we have 2 identical verdict cards.

  Alternatively, to save printing, we can have one verdict per case and then the Case Holder can also have the verdict? But then the Agent is the only one with the verdict. Let's do:

  For each pair:
  - Case Holder: gets a sheet with the case description (and the verdict? No, because the verdict is sealed for the Agent). So the Case Holder does not know the verdict until the Agent reveals it? Actually, the Case Holder should not know the verdict until after Round 1? Because if they know, they might bias the Agent.

  So: 
  - The verdict card is only for the Agent and is sealed until Round 1.
  - The case description is only for the Case Holder.

  Then, in Round 1, the Agent reads the verdict and decides. The Case Holder does not know the verdict until the Agent tells them? Or after Round 1 when they reveal the case, the Agent also reveals the verdict? That works.

  So materials:
  - 8 sealed envelopes (or folded cards) with the verdict for the case (each case has a verdict, and we have two pairs per case, so two identical verdict cards for each case).
  - 8 case description sheets (two copies of each of the 4 cases).

  For the reasons cards: 8 reasons cards (one for each verdict). We write a brief set of reasons that support the verdict. These should be plausible but not necessarily conclusive, to leave room for discussion.

  Example for Case 1 (don't tell about the cheating fiancé):

