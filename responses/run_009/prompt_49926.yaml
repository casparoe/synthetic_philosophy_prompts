  ### Money Pump Game for Intermediate Decision Theory Discussion Section  
  **Objective:** Students experience a series of seemingly rational trades that leave them worse off, illustrating diachronic irrationality and money pumps.  

  ---

  ### **Game Rules & Setup**  
  1. **Participants & Stakes**:  
     - 15 undergrads.  
     - Each starts with **10 points** (convertible to extra credit or small prizes, e.g., 10 points = $1).  
     - Three "assets" to trade: **Coffee Mug (A)**, **Book (B)**, and **T-Shirt (C)**.  

  2. **Preference Cycle (Hidden from Students)**:  
     - **A > B**: Students prefer the mug to the book (e.g., mug is practical *now*).  
     - **B > C**: Students prefer the book to the t-shirt (e.g., book is intellectually valuable).  
     - **C > A**: Students prefer the t-shirt to the mug *later* (e.g., t-shirt is trendy for weekend wear).  

  3. **Trading Rounds (Conducted in Sequence)**:  
     - **Round 1: Trade A for B**  
       - *Prompt*: "You have a Coffee Mug (A). Trade it for a Book (B) by paying 0.5 points. The book is perfect for the exam next week!"  
       - *Rationale*: Immediate benefit (exam prep) makes B seem better than A.  
     - **Round 2: Trade B for C**  
       - *Prompt*: "You have a Book (B). Trade it for a T-Shirt (C) by paying 0.5 points. The t-shirt is great for the campus event this weekend!"  
       - *Rationale*: Weekend event makes C seem better than B.  
     - **Round 3: Trade C for A**  
       - *Prompt*: "You have a T-Shirt (C). Trade it for a Coffee Mug (A) by paying 0.5 points. You need caffeine for tonight’s study session!"  
       - *Rationale*: Urgent study need makes A seem better than C.  

  4. **Key Mechanics**:  
     - **Real stakes**: Points deducted instantly. Record starting/ending points publicly.  
     - **No backtracking**: Once a trade is made, students can’t reverse it.  
     - **Debrief delay**: Only reveal the cycle *after* all trades.  

  ---

  ### **Predicted Student Actions**  
  - **Round 1**: Most trade A for B (pay 0.5 pts).  
  - **Round 2**: Most trade B for C (pay 0.5 pts).  
  - **Round 3**: Most trade C for A (pay 0.5 pts).  
  **Result**: Students end with A (same as start) but **1.5 points poorer**.  

  ---

  ### **Debrief: Mapping to Decision Theory**  
  1. **The Trap**:  
     - *Static choice*: Each trade seemed rational in isolation (e.g., "Book helps my exam!" → B > A).  
     - *Dynamic choice*: The *sequence* created a cycle (A → B → C → A) that drained points.  

  2. **Core Concepts**:  
     - **Money Pump**: A mechanism exploiting non-transitive preferences (A > B > C > A) to extract value.  
     - **Diachronic Irrationality**: Choices that appear rational *at each step* but are collectively self-defeating.  

  3. **Escape Routes (When Students Bring These Up)**:  
     - **Naive vs. Sophisticated Choice**:  
       - *Naive*: "I’ll make the best choice now and worry about later later." → Leads to pumping (what happened here).  
       - *Sophisticated*: "I foresee the cycle and refuse Round 1 to avoid future losses." → Trade only if no harmful path exists.  
     - **Commitment Devices**: "Could I pre-commit to never trade C for A?" (Yes! e.g., vow to ignore future offers involving A).  
     - **Reputation/Repeat Play**: "If I know you’ll keep offering trades, I’d refuse Round 1 to avoid being pumped." → Assumes repeated interaction.  

  4. **Why the Cycle Feels "Natural"**:  
     - Context shifts (exam → weekend → study session) masked the intransitivity.  
     - No single trade looked suspicious—only the *pattern* was exploitative.  

  ---

  ### **Limitations & Predictable Flops**  
  1. **Predictable Flops**:  
     - **Suspicious Students**: 1–2 may refuse trades, especially if they suspect a "trap." *Workaround*: Emphasize real-world stakes (e.g., "This reflects actual consumer decisions!").  
     - **Point Stinginess**: Students might skip trades to save points. *Workaround*: Use small deductions (0.5 pts) so fees feel trivial.  
     - **Time Crunch**: Rushing trades → some miss instructions. *Workaround*: Use slides to display prompts clearly.  

  2. **What Can’t Be Replicated in 80 Minutes**:  
     - **Infinite Pumping**: Real money pumps exploit *indefinite* cycles (e.g., pumping until bankrupt). We stop after one cycle.  
     - **Long-Term Learning**: Students won’t experience how repeated cycles compound losses. Focus on the *logic* of exploitation.  

  ---

  ### **Instructor Script**  
  **Opening**: "Today we’re simulating real-world trades. Your goal: maximize points. Each decision is optional, but choose wisely—points = rewards!"  

  **During Game**:  
  - Announce trades briskly (≤5 min/round).  
  - Track points on a board: "After Round 1, avg. points = 9.5..."  

  **Post-Game Reveal**:  
  1. "Who ended with fewer points than they started? *[Show of hands]* Why did you make each trade?"  
  2. "Let’s map your choices: At Step 1, you preferred B to A. At Step 2, C to B. At Step 3, A to C. But A = what you started with! This is a **preference cycle**."  
  3. "In static choice, each trade was rational. But dynamically, you were **pumped**."  

  **Discussing Escapes**:  
  - "What if you foresaw the cycle? *[Sophisticated choice]*"  
  - "Could signing a contract to skip Round 3 help? *[Commitment]*"  
  - "What if I offered this daily? *[Reputation]*"  

  **Closing**: "Real money pumps prey on shifting contexts—like impulse buys or subscription traps. Tomorrow, we’ll model commitment devices!"  

  ---

  **Why This Works**: Students *feel* the drain (losing points on "rational" choices), making diachronic irrationality visceral. The debrief links their actions to theory while preempting classic objections. Run it tight, and they’ll never forget money pumps!
