prompt: |-
  I teach an introductory ethics course for second-year students with no philosophy background beyond a semester of applied topics. Next week I have a single seventy-five-minute seminar on the procreation asymmetry — roughly, the thought that creating a person whose life would go badly is seriously wrong in a way that creating a person whose life would go well is not correspondingly required, so that the badness and the goodness of new lives cannot just be weighed against each other on a single scale. Plan the session for me rather than explaining the asymmetry itself. In particular, tell me: (1) the order in which the pieces must be introduced and why — especially whether the distinction between making existing people better off and bringing into existence people whose lives go well has to be secured before the asymmetry is even stated, and whether my co-teacher is right that the non-identity problem should open the session or whether it should be cut entirely; (2) what the carrying example should be — I am tempted to use a municipal government choosing between subsidizing fertility treatment for involuntarily childless couples and expanding a pediatric ward, since both options are sympathetic and neither side is a cartoon, but assess whether that case actually has the right features or whether it smuggles in confounds (the beneficiaries on one side exist and on the other do not) that will confuse more than they carry, and propose a replacement if so; (3) the misconceptions students will predictably form and where in the sequence each should be headed off — my own guesses are that the asymmetry will be heard as flat antinatalism, as the claim that additional happy lives are not good at all, or as simply total utilitarianism running in reverse, and I would like to know whether to expect others; (4) one question I can pose at the end that would show me whether they can apply the asymmetry to a case they have not seen, rather than merely nodding along to it; and (5) what I should openly refuse to bring in at this level — the repugnant conclusion, average versus total views, anything else — and how to say so in one honest sentence without making the students feel shortchanged. Bear in mind that the students arrive directly from a unit on Singer's famine argument, so their working picture of morality is entirely about duties to people who already exist; I want to know whether that inheritance is scaffolding to build on or a habit I have to break in the first ten minutes.
reasoning: |-
  Okay, let me approach this ethics seminar planning request methodically. The user is teaching second-year students with limited philosophy background, fresh from studying Singer's famine argument. They need a focused 75-minute session on the procreation asymmetry, with five specific components to address.

  First, considering the student context: coming from Singer means they're primed for obligation-based ethics focused on existing people. That's both useful scaffolding (they understand moral reasoning) and a potential hurdle (they may automatically apply that framework to future people). The key pedagogical challenge will be creating cognitive dissonance around whether bringing new people into existence is morally symmetrical with helping existing people.

  For the session flow: The non-identity problem seems essential upfront because it demonstrates why procreative ethics can't be reduced to Singer-style harm/benefit analysis. Starting with it creates the necessary conceptual rupture. Then introducing the distinction between harming/benefiting existing people versus creating new people sets the stage for stating the asymmetry itself. This sequence prevents students from force-fitting the concept into their existing utilitarian framework.

  Regarding the municipal policy case: While nuanced, it introduces problematic variables. The fertility treatment option mixes creating new people with curing existing infertility (which could be framed as benefiting existing couples). A cleaner alternative would contrast creating lives worth living against preventing suffering in future possible people. For example: choosing between funding a playground for existing children or genetic research to prevent a congenital disease in future generations. This maintains the existence/nonexistence distinction without conflating beneficiary types.

  Anticipating misconceptions: Beyond the predicted misunderstandings (confusing asymmetry with antinatalism, denying any value to happy lives, or reversed utilitarianism), students might also think the asymmetry implies we have no positive duties to potential people at all. The lesson should explicitly state that while creating happy people isn't obligatory, we still have constraints against creating miserable ones.

  For the application question: A case involving resource allocation between existing and future populations would test their grasp. Perhaps: "Should a community with scarce medical resources prioritize treating current residents' illnesses or preventing birth defects in future children?" This forces them to apply the asymmetry's core insight rather than default to Singer-esque calculations.

  Boundaries to set: The repugnant conclusion and average/total utilitarianism debates should be explicitly excluded as "questions for advanced seminars." This manages expectations while acknowledging the complexity beyond this introductory session.

  The Singer foundation actually helps here - students will immediately notice how procreation breaks its patterns. The opening case should exploit that dissonance rather than avoid it.
answer: |-
  Here's a carefully structured 75-minute seminar plan focusing on pedagogy and addressing your specific concerns:

  ### (1) Session Flow & Why This Order
  **(Total: 60 mins)**
  1.  **Opening Hook (10 mins):** Start with **Singer's framework applied to a procreation case (BUT MAKE IT FAIL)**. Use a simple, stark case: *"Imagine a couple knows any child they conceive will have a severe, incurable genetic illness causing a life of constant, excruciating pain, barely outweighed by minor joys. Should they have the child?"* Students will intuitively say *No*. Ask *Why?* They'll say it's cruel/harmful to the child. **Crucial Question:** *"But if the child is never born, they never exist to be harmed. Who is harmed by them not being born?"* Highlight the tension with Singer's focus on *existing* individuals.
  2.  **Introduce the Non-Identity Problem (15 mins - DO INCLUDE IT):** **Your co-teacher is right.** Use the classic case: *"Building a hazardous waste facility creates minor pollution causing health issues 100 years later for people who wouldn't exist otherwise (as society develops differently). Are we harming those future people?"* Guide discussion: If we don't build it, *those specific people* never exist. Their lives, though flawed, are likely still "worth living" overall. So, did our action *harm them* compared to non-existence? Conclude: Standard harm-based reasoning (like Singer's) struggles here because the alternative is non-existence for *that specific person*. **Why first?** It shatters the intuitive "harm/benefit" model applied to future people, creating the conceptual space *needed* to even grasp the asymmetry. It shows why "making existing people better off" and "bringing people into existence" are fundamentally different *kinds* of acts.
  3.  **Clarify the Distinction (5 mins):** Explicitly state: *"Singer focused on our duties to beings who already exist or will exist independently of our choices. Procreation choices are different: they determine whether specific potential beings* ***come to exist at all***. *We need different tools for this."* **This distinction MUST be secured before stating the asymmetry.**
  4.  **State & Explain the Procreation Asymmetry (15 mins):** Present it clearly:
      *   **(A) Pain Premise:** It is wrong to bring into existence a person whose life would be full of suffering and not worth living (net negative).
      *   **(B) Pleasure Premise:** It is *not* wrong (or not required) to bring into existence a person whose life would be happy and worth living (net positive).
      *   **The Asymmetry:** The moral reason against creating a miserable life is very strong, while the moral reason *for* creating a happy life is weak or non-existent. The badness of suffering isn't symmetrically counterbalanced by the goodness of happiness in creation contexts.
  5.  **Analyze a Simple Case (10 mins):** Use a *clean* case: *"A couple is deciding whether to have a child. Scenario 1: They know any child would have a terrible life (e.g., severe genetic illness). Scenario 2: They know any child would have a wonderful life. What are their moral obligations in each scenario?"* Apply (A) and (B). Emphasize that in Scenario 2, while having the child might be *good*, it's not *required* in the way helping an existing starving child is required (linking back to Singer).
  6.  **Address the Municipal Policy Case (5 mins - CAUTION):** Briefly present your case. **Assessment:** It *does* smuggle in confounds. The fertility treatment side involves both benefiting *existing* infertile couples (a Singer-style duty?) AND creating new lives. The pediatric ward benefits *existing* children. **Proposed Replacement:** Use a case focused *only* on creating future lives with different qualities: *"A government must fund one project: (A) Genetic screening/treatment ensuring all future children avoid a debilitating, painful disease (creating healthy lives), or (B) Enhancing early childhood programs for future children, significantly increasing their average lifetime happiness (creating happier lives). Is there a strong moral obligation to choose one over the other?"* The asymmetry suggests no strong obligation to create *happier* lives (B) exists, but a strong obligation to avoid creating *miserable* lives (A) *does* exist. This focuses purely on the creation aspect.

  ### (2) The Carrying Example: Replace the Municipal Case
  *   **Problem with Original:** The key confound is the direct benefit to *existing* people (infertile couples) on one side, muddying the "creation" aspect. It conflates duties to existing people with the ethics of creation.
  *   **Proposed Replacement:** **The "Disease Prevention vs. Happiness Enhancement" Dilemma** (described in Step 6 above). This isolates the core issue:
      *   Both options involve creating *future* people.
      *   Option A focuses on preventing net-negative lives (strong duty).
      *   Option B focuses on creating net-positive lives that are *even happier* (weak/no duty to do so).
      *   **Why it works:** It cleanly separates the asymmetry's components. The intuition that A might be more urgent stems from the asymmetry's "Pain Premise" strength, not Singer-esque harm to identifiable existing people. It avoids the "beneficiary existence" confound.

  ### (3) Predictable Misconceptions & When to Head Them Off
  *   **"This is just anti-natalism (it's always wrong to have kids)."** Head off immediately after stating the asymmetry (Step 4). Explicitly say: *"This is NOT anti-natalism. The Pleasure Premise (B) says it is PERMISSIBLE, even good, to create happy lives. It's just not REQUIRED in the same way we are required not to create miserable lives."* Use the Simple Case (Step 5) Scenario 2.
  *   **"Creating happy people isn't good at all."** Head off when explaining the Pleasure Premise (B). Stress: *"The Asymmetry says creating a happy life IS a good thing! We are saying there isn't a strong MORAL OBLIGATION (or requirement) to do it, unlike the strong obligation NOT to create a miserable life."* Contrast with the strong obligation Singer identifies to help existing people.
  *   **"It's just total utilitarianism in reverse (minimize bad lives, ignore good ones)."** Head off during the analysis of the Simple Case (Step 5). Explain: *"Total utilitarianism would say: create more happy lives! They add to total happiness. The asymmetry REJECTS this. It says adding happy lives isn't morally required, even though adding misery IS forbidden. It's not symmetric."*
  *   **"So we have NO duties at all concerning future people?"** (Likely misconception). Head off after clarifying the distinction (Step 3) and when stating the Pain Premise (A). Emphasize: *"We have a very strong duty NOT to create people who will suffer terribly. The asymmetry is specifically about why this duty is strong, while a duty TO create happy people is weak or absent."* Reiterate this during the Disease Prevention vs. Happiness Enhancement case.
  *   **"Not creating a happy person harms them."** Head off immediately when introducing the Non-Identity Problem (Step 2). The core lesson of the NIP is that non-existence isn't comparable harm *to the non-existent person*.

  ### (4) Application Question (End of Session - 5 mins)
  *   **Pose:** *"Imagine a safe, effective, cheap drug exists. If taken by a woman before conception, it guarantees her child will be extremely happy – significantly happier than the average person. Is there a strong moral obligation for women to take this drug? Why or why not, based on the asymmetry?"*
  *   **Why it works:** It isolates the "Pleasure Premise" component. Students must recognize that while creating this *happier* life is good, the asymmetry denies there's a *strong obligation* to do so. It prevents them from conflating it with the "Pain Premise" (no suffering involved) or Singer-style duties (no existing person in need).

  ### (5) What to Exclude & How to Say It (5 mins - Throughout/Conclusion)
  *   **Exclude:** The Repugnant Conclusion, Average vs. Total Utilitarianism, Complex population ethics models, Deep meta-ethical justifications for the asymmetry.
  *   **How to Say It (Honestly & Briefly):** *"The ethics of future populations gets incredibly complex fast. Today, we're just focusing on the core puzzle of the asymmetry – why avoiding miserable lives seems so urgent, while creating happy lives feels optional. We won't tackle the giant questions like the 'Repugnant Conclusion' or whether we should maximize total happiness or average happiness – those are fascinating, but for another day (or another course!). Today is about understanding this specific, counter-intuitive idea."*
  *   **Why:** These are deep rabbit holes that would consume the entire session and confuse the core asymmetry concept. Acknowledging them briefly validates student curiosity while firmly setting boundaries.

  ### Addressing the Singer Inheritance
  *   **Scaffolding AND Habit to Break:** Singer provides crucial scaffolding: students grasp moral reasoning, consequentialism, and the idea of strong obligations based on suffering. **USE THIS.**
  *   **Habit to Break Early (First 10 mins):** The habit of **automatically applying the "harm/benefit to existing individuals" model to procreation choices**. The Non-Identity Problem (Step 2) is your primary tool for this. By showing how Singer's harm-based reasoning *fails* when applied to creating specific future people, you create the necessary conceptual rupture. Singer's framework is the springboard you jump off.
  *   **How:** Explicitly contrast the opening case (conceiving a miserable child) with a Singer case (not helping a starving child). Ask: *"Why does 'don't create the suffering child' feel so compelling, even though Singer's 'harm' argument technically struggles here? That's the puzzle we're tackling."*

  This plan leverages their Singer background to create tension, uses the Non-Identity Problem to break the automatic application of that model to creation, clearly establishes the necessary distinction, presents the asymmetry, uses clean cases, preempts key misconceptions, includes a good application question, and sets clear boundaries – all within the 75-minute constraint.
