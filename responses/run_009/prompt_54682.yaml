prompt: |-
  For some years I have kept a private list of cases in which I record my gut verdicts on whether something is corruption, and I have come to suspect that the list is less a moral position than a map of my own society's tolerances. I would like to know whether my verdicts add up to a principle, and I would like your help settling this.

  The cases and my verdicts:

  1. A procurement officer awards a road contract to the firm of an old schoolfriend. No money changes hands, and the friend's bid is anyway the lowest. My verdict: this is corruption, though nothing was bought.
  2. The same officer accepts a case of wine at Christmas from a firm that regularly bids for his contracts. My verdict: not corruption — an ordinary courtesy, though I would want it declared.
  3. A nurse expects patients' families to leave an envelope of cash in addition to flowers, as custom in her country more or less requires. My verdict: corruption.
  4. The same nurse accepts only the flowers, which cost much the same as the envelope. My verdict: not corruption, and the difference between this and case 3 seems real to me even though economically it is nearly none.
  5. A backbencher tells a village, openly and on the record: re-elect me and I will bring the water project here. My verdict: not corruption — constituency representation, arguably democracy working as intended.
  6. A local councillor quietly gets parking tickets cancelled for the households that delivered her votes. My verdict: corruption, and I feel the gap between this and case 5 even though both trade targeted benefits for electoral support.
  7. A clerk moves his cousin's licence application to the top of the queue as a family favour. My verdict: not corruption, just ordinary life.
  8. The same clerk moves a stranger's application to the top for a cash payment. My verdict: corruption — and yet I cannot say what the cousin is entitled to that the stranger is not.

  So my question. Is there one principle — breach of a duty of impartiality, betrayal of a role's defining obligation, exploitation of monopoly over a scarce good, or something else — that captures these verdicts, or close? Or is the best explanation simply that I have absorbed the institutional taboos of one particular corner of the West and mistaken them for universals? Please state the principle, or a short list of candidates, as precisely as you can; say which verdicts it captures and which it forces me to give up, distinguishing verdicts that are merely uncomfortable from those that are genuinely unacceptable to hold; and apply it to the case I keep going back and forth on, which I have deliberately not listed: a party machine that, in the week before an election, hands out sheets of roofing tin to householders in districts whose votes it needs.

  Please answer in British English, in at most 500 words.
reasoning: |-
  Okay, the user has presented a fascinating ethical dilemma. They've compiled a list of scenarios where they've made gut judgements about what constitutes corruption, and now suspect these judgements may reflect societal norms rather than universal principles. They want help identifying an underlying principle that explains their verdicts consistently.

  Looking at their eight cases, I notice several patterns emerging. The user seems particularly sensitive to violations of impartiality where personal relationships or payments create unfair advantages. Yet they make interesting distinctions - the Christmas wine is acceptable while cash isn't, family favors pass muster but identical actions for money don't. The electoral cases show they distinguish between open constituency service and covert vote-trading.

  The roofing tin case they mention last is particularly tricky - it sits right at the intersection of legitimate campaigning and improper inducement. I need to formulate a principle that explains why this might differ from case 5 (open promises) while resembling case 6 (covert favors).

  I'm considering "breach of institutional role for private benefit" as the core principle. This would explain why case 1 is corrupt (using public role for friendship benefit) while case 7 isn't (family favor doesn't necessarily exploit institutional position). The wine case might be borderline but saved by its customary nature. The roofing tin scenario would likely qualify as corruption under this principle because it's a targeted, transactional benefit exploiting public resources.

  The user's self-awareness about potential cultural bias is impressive. While some distinctions might indeed reflect Western institutional norms, the underlying principle of role integrity feels universally applicable. Their discomfort in case 8 shows admirable consistency - recognizing that their own distinction between cousin and stranger might not hold up to scrutiny.

  I'll structure the response to first state the principle clearly, then walk through each case demonstrating how it applies, noting where the principle might challenge the user's original verdicts. For the roofing tin case, I'll explain why it likely constitutes corruption under this framework while acknowledging its proximity to legitimate campaigning.
answer: |-
  Your verdicts largely align with a principle centred on **breach of institutional role integrity**. Specifically:

  **The Principle:** An act constitutes corruption when it involves the *exploitation of a public or institutional role for private or partial benefit, violating the core duty of impartial service inherent in that role.* This includes:
  1.  **Breach of Fiduciary Duty:** Misusing entrusted power for non-public gain.
  2.  **Subversion of Institutional Purpose:** Prioritising private ties or payments over the role's objective function (e.g., fair competition, equal service).
  3.  **Creation of Hidden Obligation:** Establishing a personal debt (monetary or relational) influencing official decisions.

  **Analysis of Your Verdicts:**

  1.  **Awarding contract to schoolfriend (Corruption):** Breaches impartiality. The friendship creates an obligation, subverting the duty to base the award solely on merit (even if the bid was lowest, the *reason* for awarding is suspect). **Captured.**
  2.  **Accepting Christmas wine (Not Corruption):** Seen as harmless custom, not creating a *specific* obligation compromising future impartiality. Declaring it mitigates risk. **Captured** (no *exploitation* or clear obligation).
  3.  **Nurse demanding cash (Corruption):** Exploits her institutional role (access to patients/care) for private, unofficial payment, subverting the principle of equal access. **Captured.**
  4.  **Nurse accepting only flowers (Not Corruption):** Gifts of nominal value given openly are typically seen as tokens of gratitude, not payments creating an obligation or exploiting the role. **Captured** (distinction hinges on *intent* and *understanding* – payment vs. gift).
  5.  **Backbencher openly promising project for votes (Not Corruption):** Aligns with the institutional role of constituency representation and democratic accountability. The benefit is public, the exchange is transparent. **Captured.**
  6.  **Councillor cancelling tickets for voters (Corruption):** Exploits public office for private political gain (securing votes) by granting *personal*, covert favours (cancelled fines). Subverts impartial administration. **Captured.** Gap from case 5: *Targeted private benefit* vs. *public promise*; *covert action* vs. *open politics*.
  7.  **Clerk fast-tracking cousin as family favour (Not Corruption):** You see this as a personal act within "ordinary life," not inherently exploiting the *institutional role*. **Problematic for the principle.** The principle *would* classify this as corruption (breach of impartiality in public service for private/kinship benefit). You may need to **revise this verdict** if consistency is paramount. It's likely reflecting a societal tolerance for nepotism in minor acts.
  8.  **Clerk fast-tracking for cash (Corruption):** Clear exploitation of institutional power for private gain, creating a hidden market for access. **Captured.** The cousin/stranger distinction is uncomfortable because *both* involve partiality; the principle highlights that *both* breach impartiality, even if kinship feels less venal than cash.

  **Societal Taboos vs. Universals?** Your distinctions often reflect Western institutional norms (impartial bureaucracy, separation of public/private). However, the core principle – prohibiting the subversion of an institution's purpose for private gain – has broad resonance, even if specific applications (like minor nepotism) vary culturally. Your discomfort in case 8 suggests the principle has merit beyond just absorbed taboos.

  **The Roofing Tin Case:** This is corruption under the principle.
  *   **Exploitation of Role:** The party machine uses its position/resources (access to/public funds for materials?) to gain electoral advantage.
  *   **Private/Partial Benefit:** The benefit (roofing tin) is targeted to specific households for their votes, a private political gain (winning the election).
  *   **Violation of Impartiality:** It distorts the electoral process by trading material goods (beyond normal campaigning/promises) for votes.
  *   **Covert/Transactional:** While possibly visible, the *quid pro quo* is implied and targeted, resembling the covert favour-trading of case 6 more than the open democratic promise of case 5. It exploits the institutional machinery of politics for a partial, electoral payoff.

  **Conclusion:** Your core principle is the **breach of institutional role integrity through partiality for private gain.** It captures most verdicts. Case 7 ("ordinary life" nepotism) is the most significant inconsistency, forcing a potentially uncomfortable revision if strict impartiality is the standard. The roofing tin handout clearly violates this principle.
