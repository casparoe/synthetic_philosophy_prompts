prompt: |-
  You are a decision theorist preparing materials for a graduate seminar. Think carefully about this, and before drafting anything, brainstorm which of the requirements below are genuinely forced by the cases and which are prejudices imported from the expected-utility tradition or from neighboring debates.

  I will spend a semester evaluating theories of choice under ambiguity, and I want the grading rubric settled before I study any theory in detail, so that theories get judged against the criteria rather than the criteria reverse-engineered from the theories I happen to like. Write the list of desiderata a theory of choice under ambiguity must meet. Fix the purpose as follows: the theory must be good enough to advise a regulator allocating resources under ambiguity — say, how much to spend preparing for a pandemic whose probability no one can pin down — not merely good enough to rationalize laboratory choices.

  The core cases must be built in, so I state them here and nothing should depend on recalling them elsewhere: in the two-urn case, urn A is known to contain 50 red and 50 black balls while urn B contains 100 red/black balls in unknown proportions, and most people prefer betting on either color from A to the same bet on B; in the three-color case, one urn contains 30 red balls and 60 balls that are black and yellow in unknown proportions, and most people prefer a bet on red to a bet on black, while also preferring a bet on black-or-yellow to a bet on red-or-yellow. The theory must accommodate the modal pattern in both, and — this is a formal requirement distinct from mere accommodation — it must not be able to rationalize the three-color pattern with any single probability assignment over the urn's composition, since that is what separates every genuine ambiguity theory from the deflationary view that beliefs are always precise.

  Beyond those, consider, and include or reject with reasons, these further requirements I half-believe in: dynamic consistency, i.e. plans made ex ante remain optimal at later choice nodes; node-consequentialism, i.e. the choice at a node depends only on what remains reachable from it; tractability for the regulator, whose analysts must be able to express the theory's advice in a two-page memo a non-specialist can follow; and my suspicion that a theory which can only represent ambiguity aversion will mispredict choices involving small probabilities, where people sometimes appear to pay a premium for ambiguity rather than avoid it.

  The part I most want: if any subset of the desiderata is jointly unsatisfiable — I suspect dynamic consistency, node-consequentialism, and any sensitivity to ambiguity form exactly such a triple — say so plainly, since that would be the list's main result. Mark each requirement as non-negotiable or as a preference of one camp, and flag which single requirement does the most to exclude candidates. Then, in one short paragraph, note only how the worst-case-priors view (evaluating each act against a set of probability assignments and using the most unfavorable one), the smooth view (precise beliefs about the probabilities themselves, plus an attitude toward that spread resembling an attitude toward risk), and the deflationary precise-beliefs view fare against your list. Do not include citations, a bibliography, or a reading list; refer to positions by name or description only.
