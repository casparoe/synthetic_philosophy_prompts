prompt: |-
  I'm designing a seminar unit on the norms of assertion, and I want the standards of adequacy settled before we turn to any of the contenders — the knowledge rule, the truth rule, the justified-belief rule — so that we judge the views against a fixed list rather than reverse-engineering the list from a view we already like. Please write the desiderata: what any adequate theory of the norm (or norms) of assertion has to deliver.

  The purpose the theory has to serve: making sense of our practice of evaluating assertions — what we challenge, what we demand retraction of, what we let pass without comment, and who we blame — rather than predicting when people assert.

  Include, with the case or consideration behind each, at least the following, plus any others you think the data require:

  1. Moore-paradoxical assertions — saying "It's snowing, but I don't believe it is" is not false and not a lie, yet strikes hearers as defective in a distinctive way. An adequate theory should explain the defect rather than stipulate it.
  2. Lottery propositions — telling a ticket holder "Your ticket will lose" seems improper to many people even when the probability is overwhelming and the speaker believes it. The theory should say what, if anything, goes wrong here, and whether the same diagnosis extends to flatly asserting future contingents like "The coin will land heads."
  3. Selfless assertion — a physician who asserts to a panicking patient a diagnosis she does not herself believe, purely for its calming effect. Must the theory count this as a violation, and is counting it a violation a cost or a credit?
  4. The distinction between the norm governing the act and the norms governing the speaker — an assertion can be proper by the rule yet blameworthy, or improper yet excusable. The desiderata should not collapse these.
  5. Hedged and qualified assertions — "I'd guess it's under ten," "It's probably fine." Are these assertions made under a weaker norm, assertions of something weaker, or something else? The theory should have some account, even if the account is that ordinary hedging is loose talk.
  6. The standing practice of answering challenges with evidence: when challenged, asserters offer grounds, not merely sincerity, which suggests the norm advertises more than the speaker's state of mind. Say what this observation does and doesn't establish.

  Then do three things with the list: mark each requirement as non-negotiable or negotiable, saying why; flag any subset of the requirements you suspect is jointly unsatisfiable — this is the part I most want, since if the data pull in incompatible directions, that is itself the seminar's headline result; and identify which single requirement excludes the most candidates, since that one will structure our later discussions. Do not score the actual theories against the list; we will do that in class, and I want the criteria uncontaminated by premature verdicts.

  End with two sentences of epistemic bookkeeping: your overall confidence in the list as it stands, and the one requirement you are least sure deserves its place, with a word about what would change your mind.

  Hard limit: 500 words for the entire response, including the bookkeeping. That is tight, so spend the words on the motivating cases, not on stage-setting.
reasoning: |-
  Okay, the user is designing a seminar on assertion norms and wants a solid list of desiderata before evaluating theories. They've specified six key cases that any adequate theory must handle, plus any others I find necessary. The goal is to set standards independent of existing theories to avoid bias. 

  First, I need to unpack each case briefly but precisely:
  - Moore's paradox highlights a unique defect where the assertion isn't false but feels wrong.
  - Lottery propositions probe whether high probability suffices for assertion, tying into future contingents.
  - Selfless assertions test if good intentions excuse violating epistemic norms.
  - The act/speaker distinction prevents conflating whether an assertion was proper with whether the asserter was blameworthy.
  - Hedging examines how weakeners ("probably") interact with assertion norms.
  - Challenge responses show we demand evidence, not just sincerity.

  I'll add one critical missing piece: retraction norms. When must assertions be withdrawn? This is fundamental to practice but absent from their list. 

  For categorization:
  - Non-negotiables include Moore cases, retraction, and challenge responses—core to assertion's social function.
  - Negotiables: selfless assertion and hedging interpretations might vary by theory without fatal cost.

  The tension spot is clear: lottery cases and selfless assertions might jointly conflict. If knowledge is required (explaining lottery impropriety), the benevolent physician becomes a violator—but counting that as defective may clash with intuition. Alternatively, if we excuse selfless assertions, lottery intuitions weaken. 

  The knowledge norm exclusion is key: it's most vulnerable to selfless assertion cases, which could structurally sink all knowledge-based views. 

  Epistemic bookkeeping: Medium confidence—the list covers major pain points but might overprioritize intuition over function. Selfless assertion's "cost/credit" status feels least settled; empirical data on blame attribution could shift this. 

  Word count is tight, so examples get skeletal phrasing. Prioritize clarity over flourishes.
answer: |-
  Here are the desiderata for an adequate theory of assertion norms, driven by the specified cases/practices:

  1.  **Moore-Paroxysm:** Explain why asserting "p, but I don't believe p" is defective despite being possibly true/non-lying. (Non-negotiable: Core puzzle for any norm.) **Case:** Intrinsic oddness.
  2.  **Lottery Impropriety:** Explain why asserting "Your ticket lost" (based only on high probability) feels improper, and whether this applies to future contingents like "The coin will land heads." (Non-negotiable: Tests sufficiency of probabilistic grounds.)
  3.  **Selfless Assertion:** Account for the physician asserting a diagnosis she disbelieves for therapeutic effect. Must the theory deem this a norm violation? Is this a cost or credit? (Negotiable: Intuitions vary; theories may reasonably differ on blameworthiness vs. propriety.)
  4.  **Act/Speaker Distinction:** Preserve the difference between an assertion *being proper/improper* (act-level) and the speaker *being blameworthy/excusable* (agent-level). (Non-negotiable: Essential for nuanced evaluation practices like excusable violations.)
  5.  **Hedging Phenomena:** Explain utterances like "I'd guess p" or "Probably p" – weaker norm? Assertion of weaker content? Loose talk? (Negotiable: Core practice, but precise analysis may vary.)
  6.  **Challenge Response:** Explain why challenges ("How do you know?") typically demand evidence/reasons, not just sincerity. (Non-negotiable: Reveals the norm demands more than mental state.) **Case:** Practice of justification.
  7.  **Retraction Obligation:** (Added) Explain when and why improper assertions *must be retracted* (e.g., upon discovering lack of knowledge/justification). (Non-negotiable: Central to normative practice.)

  **Joint Unsatisfiability Flag:** Requirements **2 (Lottery)** and **3 (Selfless)** likely conflict. A norm strict enough to explain Lottery impropriety (e.g., Knowledge Rule) *must* deem the Selfless Assertion a violation, which many find counterintuitive (a cost). Weaker norms (e.g., Justified Belief) may handle Selfless assertion better but struggle with Lottery.

  **Most Excluding Requirement:** **2 (Lottery Impropriety)** excludes the most candidates. Theories requiring only belief, justified belief, or truth often struggle to explain why high-probability lottery assertions feel improper, while knowledge-based views handle this readily but face other challenges (like Selfless assertion).

  **Epistemic Bookkeeping:** Medium confidence; the list captures major pressures but may need refinement. Least sure about **3 (Selfless Assertion)** as a *fixed* desideratum – its weight depends heavily on intuitions about blame vs. propriety; empirical work on actual judgments could shift its significance. (499 words)
