prompt: |-
  I'm in a philosophy of philanthropy course and have to run one 50-minute tutorial session (~12 students) myself. Design an activity where they run into what our lecturer calls the measurability bias in effective altruism: interventions with clean, countable outcomes (bednets delivered, deworming pills administered) crowding out interventions whose effects are real but diffuse or slow-moving (strengthening a health ministry, funding slow policy work), even when the diffuse stuff might matter more. The trick is they can't be told about the bias up front — the rules have to produce it. My idea: they play a small funding committee allocating a fixed pot across maybe 8 candidate interventions, and the rules themselves do the work, e.g. the committee must file a one-page report justifying every grant quantitatively, and they only get full "credit" for the session if their numbers add up. Then the debrief shows them what got defunded without anyone ever arguing against it — things dropped not because they lost the debate but because they couldn't be put in the spreadsheet.

  Give me the full design: the candidate list of interventions (make them up, that's fine, they just need to feel realistic), roles or no roles, timing, the exact rules that generate the bias, the debrief that maps what happened onto the critique (including where it connects to the institutional critique — that the most effective changes are ones no funder can measure), and an honest note on what the activity can't reproduce and I'll have to supply myself. Also predict what goes wrong the first time I run it. One thing I need though: make the actual choices — one definite version of the design with your reasons, not a menu of options for me to pick between. And if one or two of the fake interventions on the list are quietly unmeasurable but plausibly huge, say so after the design, since I want to know whether you stacked the deck the way a real funder's world is stacked.
reasoning: |-
  We are designing a simulation activity where students, acting as a funding committee, experience measurability bias without being explicitly told about it. The key mechanism is that they must justify every grant quantitatively in a one-page report and only get full credit if their numbers add up. 

  **Activity Design: "Global Health Funding Committee Simulation"**

  **Learning Objective:** 
  - To experience how the requirement for quantitative justifications biases funding towards measurable interventions and away from those with diffuse, long-term, or unquantifiable outcomes, even when the latter might be more impactful.

  **Setup:**
  - **Time:** 50 minutes total.
  - **Participants:** 12 students, divided into 3 groups of 4. Each group is a funding committee.
  - **Resources:** 
    - A list of 8 candidate interventions (described below).
    - A fixed pot of $10 million to allocate (for simplicity, each group has the same pot).
    - A one-page template for the report (with sections: Intervention, Amount Requested, Amount Awarded, Quantitative Justification, Expected Outcomes).
    - Rules handout.

  **Rules:**
  1. Each group must allocate the entire $10 million across the 8 interventions. They can choose to fund any intervention partially or fully (but note: some interventions might require full funding to be effective, which is not stated upfront to see if they notice).
  2. They must fill out the one-page report justifying every grant they make. The justification must be quantitative (e.g., "We expect this grant to save X lives per dollar" or "This will lead to Y additional bednets distributed"). 
  3. They are told that to get full credit for the activity, their report must:
     - Be exactly one page.
     - Include a clear, quantitative justification for every funding decision.
     - Show that the total funding adds up to $10 million.
  4. They have 25 minutes for discussion and allocation.

  **Candidate Interventions:**
  We create 8 interventions. Some are highly measurable, some are not. We also include one or two that are quietly unmeasurable but plausibly huge. 

  1. **Bednet Distribution:** Distribute insecticide-treated bednets in a malaria-endemic region. *Highly measurable: cost per bednet, expected reduction in malaria cases.*
  2. **Deworming Program:** Provide deworming pills to school children in a high-parasite-load area. *Measurable: cost per pill, expected reduction in worm load and improvement in school attendance.*
  3. **Vaccination Campaign:** Fund a measles vaccination campaign in a region with low coverage. *Measurable: cost per vaccine, expected lives saved.*
  4. **Emergency Food Aid:** Provide food aid to a famine-stricken area. *Measurable: cost per calorie, expected reduction in malnutrition.*
  5. **Health Worker Training:** Train community health workers in rural areas. *Less measurable: cost per worker trained, but long-term impact on health outcomes is harder to quantify and might take years.*
  6. **Health Ministry Strengthening:** Support the national health ministry to improve its data systems and planning capacity. *Diffuse and hard to measure: no immediate lives saved, but potential for systemic improvements. Outcomes are uncertain and long-term.*
  7. **Policy Advocacy:** Fund a local NGO to advocate for increased government health spending and policy reforms. *Very diffuse: impact might be huge (e.g., leading to sustained increases in health budgets) but is uncertain, slow, and hard to attribute.*
  8. **Research Grant:** Fund research on a new vaccine for a neglected disease. *Long-term and uncertain: might lead to a breakthrough, but could fail and has no immediate impact.*

  Note: Interventions 6 and 7 are the ones we expect to be underfunded due to measurability bias. Intervention 8 might also be underfunded because of uncertainty.

  **Roles:**
  - No assigned roles within groups. Let them self-organize to simulate a real committee.

  **Timing:**
  - **Introduction (5 min):** Explain the scenario: "You are a funding committee for a global health foundation. You have $10 million to allocate among these 8 interventions. You must submit a one-page report justifying your decisions quantitatively. The goal is to maximize impact with the money, but note: you must justify every grant with numbers. You have 25 minutes to decide and fill out the report."
  - **Group Work (25 min):** Groups discuss and allocate funds. They must complete the report.
  - **Report Collection (1 min):** Collect reports.
  - **Debrief (19 min):** Lead a discussion as below.

  **Debrief Structure:**
  1. **Report Out (5 min):** Ask each group to share one intervention they funded the most and one they funded the least (or not at all). Write these on the board.
  2. **Pattern Recognition (5 min):** Point out patterns: 
     - "I notice that interventions like bednets and deworming got a lot of funding. Why?"
     - "What about health ministry strengthening or policy advocacy? How much did they get?"
     - "Was anyone in your group advocating for an intervention but couldn't because you couldn't come up with numbers?"
  3. **Introduce the Bias (4 min):** Explain the measurability bias: "In the real world, funders often require quantitative justifications. This tends to favor interventions with clear, countable outcomes and disfavor those with diffuse, long-term, or hard-to-measure outcomes, even if the latter are more important. Today, the rules required you to do exactly that. Notice how the rules didn't let you fund what you couldn't put in a spreadsheet?"
  4. **Connect to Institutional Critique (5 min):** 
     - "The most effective changes might be the ones that no single funder can measure or take credit for. For example, strengthening a health ministry might lead to better health outcomes for decades, but how do you quantify that in a one-year grant report? And if you can't, does that mean it's not worth funding?"
     - "This is a systemic issue: funders are often held accountable by their boards or donors for measurable results. So even if they want to fund the diffuse stuff, the system pushes them toward the countable."
  5. **Wrap-up (optional, if time):** Ask: "What would you change about the rules to reduce this bias?" (e.g., allowing qualitative justifications, long-term evaluations, etc.)

  **What the Activity Can't Reproduce and You'll Have to Supply:**
  - **Real-world complexity:** In reality, the bias is not just about one report but about the entire ecosystem of accountability (donors, boards, public opinion). The activity simplifies this into one report requirement.
  - **Long-term impact:** Students won't actually see the long-term consequences of underfunding the diffuse interventions. You'll have to explain the potential missed opportunities.
  - **Group dynamics:** In a real committee, there might be power imbalances or experts who push for certain interventions. Here, it's a level playing field.

  **Predict What Goes Wrong the First Time:**
  1. **Time pressure:** 25 minutes might be too short for 12 students in 3 groups (each group of 4) to discuss 8 interventions and write a report. They might rush and default to the measurable ones even more quickly. Solution: Be strict on time to create the pressure that real funders face.
  2. **One group might rebel:** A group might try to fund the unmeasurable interventions and write a qualitative justification. But the rules say they must have quantitative justifications to get full credit. If they do, you can use that in the debrief: "Did any group try to fund the health ministry? How did you justify it? Was it hard to put numbers? Did you feel you were breaking the rules?"
  3. **Over-justification:** Some groups might spend too much time trying to invent numbers for the unmeasurable interventions (e.g., "We estimate that strengthening the health ministry will save 100,000 lives over 10 years"). In the debrief, point out that such numbers are often speculative and can be misleading.
  4. **Lack of engagement:** Some students might not participate. Encourage by reminding them of the credit requirement.

  **The Quietly Unmeasurable but Plausibly Huge Interventions:**
  - **Health Ministry Strengthening (Intervention 6):** This could lead to systemic improvements in the entire health system, making every dollar spent on health more effective. But it's impossible to attribute specific outcomes to this funding in the short term.
  - **Policy Advocacy (Intervention 7):** If successful, it could lead to a sustained increase in government health spending (e.g., an extra $100 million per year). But the advocacy might fail, and even if it succeeds, it's hard to prove causality and the impact is years away.

  **Why This Design?**
  - The rules (quantitative report, one page, full credit for compliance) directly create the bias without you having to explain it. 
  - The interventions are realistic and cover a range of measurability.
  - The debrief connects the dots and links to the institutional critique.

  **Final Note:** Be prepared to gently steer the debrief if the students don't immediately see the pattern. Have a backup plan: if no group underfunds the diffuse interventions, ask them why they didn't fund certain ones and point out that in the real world, the pressure for numbers often leads to underfunding.
answer: |-
  Here's a complete, ready-to-run tutorial design based on your specifications. The activity forces measurability bias through procedural constraints, then reveals it during debrief.

  ---

  ### **Activity Title**: "The Global Health Impact Challenge"  
  **Time**: 50 minutes  
  **Students**: 12 (3 groups of 4)  
  **Core Mechanism**: Groups must justify funding using *only quantitative metrics* to receive "success points," implicitly penalizing interventions with diffuse outcomes.

  ---

  ### **Setup & Materials**  
  - **Funding Pot**: $100 million total per group  
  - **Interventions** (8 options, printed on cards with descriptions):  
    1. **Bednet Distribution**  
       - *Cost*: $5M for full coverage  
       - *Impact*: Prevents ~100,000 malaria cases (based on RCTs)  
       - *Measurability*: High (cases prevented = countable)  

    2. **Deworming Program**  
       - *Cost*: $3M  
       - *Impact*: Treats 500,000 children; boosts school attendance by 15%  
       - *Measurability*: High (pills administered, attendance records)  

    3. **Emergency Vaccination Drive**  
       - *Cost*: $8M  
       - *Impact*: Saves 20,000 lives from cholera outbreak  
       - *Measurability*: High (lives saved = direct count)  

    4. **Mobile Clinics for Rural Areas**  
       - *Cost*: $10M  
       - *Impact*: Provides 200,000 consultations/year  
       - *Measurability*: Medium (consultations countable, but health outcomes diffuse)  

    5. **Health Worker Training**  
       - *Cost*: $7M  
       - *Impact*: Trains 1,000 workers; improves care quality long-term  
       - *Measurability*: Low (quality improvements are anecdotal without 5+ years of data)  

    6. **Health Ministry Capacity Building** (★ **Quietly huge impact**)  
       - *Cost*: $15M  
       - *Impact*: Strengthens policy coordination, data systems, and outbreak response *across entire country*. No short-term metrics; could prevent future pandemics or multiply other interventions’ impact.  
       - *Measurability*: None (system-level change, 10+ year horizon)  

    7. **Anti-Corruption Reform Support** (★ **Quietly huge impact**)  
       - *Cost*: $12M  
       - *Impact*: Reduces graft in health spending by ~30% over 5–10 years. Could redirect $1B+ to actual care, but success is probabilistic and invisible short-term.  
       - *Measurability*: None (no attributable metrics without risky estimates)  

    8. **Nutrition Policy Advocacy**  
       - *Cost*: $6M  
       - *Impact*: Lobbies for fortified staple foods; could reduce stunting by 5% in 5 years (estimates highly uncertain).  
       - *Measurability*: Low (slow, political, hard to isolate variables)  

  ---

  ### **Rules (Handed to Students)**  
  1. **Goal**: Allocate $100M to maximize "impact" (undefined).  
  2. **Reporting**: Submit a 1-page report with:  
     - Table listing: **Intervention, Funding Awarded, Expected Outcome**  
     - **Outcomes must be quantitative** (e.g., "100K cases prevented," not "better systems").  
  3. **Success Condition**: Groups earn 3 "impact points" only if:  
     - All outcomes in the report are numerical.  
     - Total funding sums to exactly $100M.  
  4. **Time**: 25 minutes to decide + write report.  

  ---

  ### **Procedure**  
  1. **Introduction (3 min)**:  
     - "You’re a funding committee for a global health foundation. Allocate $100M to these 8 evidence-based interventions. Submit a report proving your impact with numbers. Earn points for rigor."  
     - *Don’t* mention bias; imply quantitative justification is "professional."  

  2. **Group Work (25 min)**:  
     - Divide into 3 groups of 4.  
     - Give each: intervention cards, rule sheet, report template (blank table).  
     - Circulate and enforce rules: "Can you put that outcome in numbers?" if groups discuss unquantifiable benefits.  

  3. **Report Collection (2 min)**:  
     - Collect reports. Scan and "award" points if rules followed (most groups will comply).  

  4. **Debrief (20 min)**:  
     - **Step 1: Reveal Funding Patterns** (5 min):  
       - Tally results on board: "Which interventions got *zero* funding across all groups?" (Likely: Health Ministry, Anti-Corruption).  
       - Ask: "Why did [Bednets/Deworming] win? Why did [Health Ministry] lose?" Students will say: "We couldn’t measure their impact!"  
     - **Step 2: Introduce Bias** (5 min):  
       - "Today, you experienced **measurability bias**—a tendency to favor countable outcomes even when diffuse work matters more. The rules forced you to do this: no numbers, no justification."  
       - Show quotes from reports: "We funded Bednets because we knew exact lives saved, but dropped Health Ministry because we couldn’t quantify anything."  
     - **Step 3: Institutional Critique** (5 min):  
       - "In real philanthropy:  
         - Funders demand metrics to show ‘accountability,’ but this *creates* blind spots.  
         - The highest-impact work (e.g., policy, systems change) often has **no attributable metrics**—it’s probabilistic, long-term, or depends on others.  
         - Result: Bednets get funded because they’re ‘measurable,’ even if fixing corruption would save 100x more lives. The ‘optimal’ intervention is invisible to spreadsheets."  
     - **Step 4: Discussion** (5 min):  
       - "How did it *feel* to drop an intervention you suspected was important? What would you change about real philanthropy to fix this?"  

  ---

  ### **What the Activity Can’t Reproduce (Need to Explain)**  
  1. **Long-term uncertainty**: Students won’t *see* the consequences of underfunding systems work (e.g., a future pandemic). You must highlight: "In 10 years, that unfunded Health Ministry project might have prevented 10M deaths, but we’ll never know."  
  2. **Power dynamics**: Real funders face pressure from boards/donors for "results." Simulate this by noting: "Imagine your points were real job evaluations."  
  3. **Emotional weight**: Real program officers agonize over these choices. Say: "Think of a Health Ministry staffer watching measurable projects eat their budget."  

  ---

  ### **Predicted First-Run Problems**  
  - **Problem 1**: One group "cheats" by inventing numbers for unmeasurable interventions (e.g., "Anti-Corruption will save $200M!").  
    - *Mitigation*: In debrief, praise creativity but note: "In reality, funders reject speculative numbers. Would your board believe that $200M claim?"  
  - **Problem 2**: Groups fund diffuse interventions minimally ($1M) to "tick the box," ignoring that these require full funding to work.  
    - *Mitigation*: Point out: "Throwing $1M at policy work is tokenism—it won’t move the needle. The rules encouraged this half-measure."  
  - **Problem 3**: Students argue *for* measurable interventions on merit, not just rules.  
    - *Mitigation*: Agree but refocus: "Yes, Bednets work—but did Health Ministry lose because it’s *worse*, or because you *couldn’t measure* it?"  

  ---

  ### **Why This Works**  
  - **The deck is stacked realistically**: Health Ministry (#6) and Anti-Corruption (#7) have massive *potential* impact but **zero short-term metrics**. Students will drop them without debate—not because they’re ineffective, but because they "break" the report. This mirrors real EA paralysis around policy.  
  - **The debrief maps directly to critique**: It shows how institutional demands (e.g., quarterly reports) create perverse incentives, crowding out systemic change.  
  - **Emotional resonance**: Students feel frustrated realizing they excluded critical work. This sticks longer than a lecture.  

  **Run it verbatim, and watch the measurable projects win every time.** Good luck!
