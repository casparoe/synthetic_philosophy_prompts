  Okay, let me start by unpacking the user's query. They’ve noticed a pattern where certain things exist only because of collective agreement, yet individuals can’t opt out without facing consequences. Examples given are paper money, borders, and queues. The key elements are the collective creation and the individual constraint. 

  First, I need to recall philosophical concepts that might fit. Searle’s institutional facts come to mind because he talks about things like money and marriage existing through collective intentionality. But does that cover the inability to opt out? Searle mentions deontic powers, which include obligations, so maybe that’s part of it. 

  Then there’s the threshold aspect the user mentioned, like hyperinflation or failed local currencies. Searle’s framework includes the idea that collective recognition can erode, leading to institutional failure. That seems relevant. But I should check if other concepts like social constructs or conventions fit better. Social constructs are broader and include things like gender, which might not have the same enforcement mechanisms. Conventions, à la Lewis, rely on mutual expectations but don’t necessarily have the normative force the user describes. 

  The user also asked about edge cases. Language is a good test—does it fit? Well, it’s collectively created, but individuals can’t opt out without communication breakdowns. However, people can create sub-languages or slang, which might not have the same rigid enforcement. Marriage involves mutual agreement but legal systems enforce it, making it hard for one person to dissolve it unilaterally. Reputation depends heavily on others’ perceptions; if ignored, it might fade, but the individual can’t easily escape it. 

  Laws on the books but unenforced are tricky. They exist as institutional facts only if there’s collective recognition. If ignored, they’re more like "dead letters," which don’t bind anyone. Titles or promises depend on context; a promise might bind morally, but without societal enforcement, it’s weaker. 

  The user wants precise boundaries. So the core criteria should be: collective intentionality, constitutive function, deontic powers (obligations), and persistence beyond individual defection. Thresholds matter too—the critical mass required for the institution to function. 

  Terms like "institutional facts" are close but might need specifying the binding nature. Coining "collectively binding entities" could work, emphasizing both creation and constraint. Need to ensure it’s distinct from mere habits or personal obligations. 

  Finally, ensuring the explanation addresses the user’s deeper interest in understanding societal structures’ power and their fragility, which ties into trust and coordination in communities. They might be seeking frameworks to analyze social phenomena or validate their observations philosophically.
answer: |-
  This phenomenon you're describing is brilliantly observed and sits at the heart of social ontology – the philosophical study of how social reality comes into existence and functions. While there's no single *perfect*, universally agreed-upon term that captures *every nuance* you highlight, the closest established concept is **John Searle's "Institutional Facts."** However, let's dissect why it fits, where it might need tightening, and explore near-misses.

  1.  **The Core Concept: Searle's Institutional Facts**
      *   **Definition:** Facts that exist *only* because of collective human agreement, intention, acceptance, or recognition. They are constituted by a specific kind of collective attitude: **collective intentionality** directed towards imposing a **status function** onto a physical object or event.
      *   **Key Components:**
          *   **X counts as Y in context C:** This is Searle's constitutive formula. A piece of paper (X) counts as money (Y) in a given society (C). A line of people (X) counts as a queue (Y) in a bakery (C). A geographical boundary (X) counts as a national border (Y) for citizens of that nation (C).
          *   **Collective Intentionality:** It's not just individual belief; it's a shared *we-intention* ("We accept that this paper is money," "We recognize this as a border"). Your individual disbelief doesn't dissolve it because the collective "we" sustains it.
          *   **Status Function:** The collective agreement imposes a *function* and a *status* that the thing doesn't have solely by its physical properties. The status (being money, being a border, being a queue) carries **deontic powers** – rights, obligations, permissions, authorizations, and requirements (e.g., the obligation to pay with it, the requirement to show a passport, the expectation to wait your turn).
      *   **Why it Fits Your Description:**
          *   Constituted by collective attitude? ✅ (Collective intentionality imposing status functions).
          *   Binds individuals? ✅ (Via deontic powers – obligations, sanctions like arrest or social disapproval for cutting the queue).
          *   Cannot be opted out of individually? ✅ (Your disbelief doesn't destroy the collective fact; you face consequences for non-compliance).
          *   Thresholds & Failure Modes? ✅ (Searle explicitly acknowledges institutional facts require continued collective acceptance. Hyperinflation is the erosion of the "money" status function; the failed local currency lacks sufficient collective intentionality to impose the status function effectively).

  2.  **Near-Miss Concepts & What They Leave Out:**
      *   **Social Constructs:** This is a broader category. *All* institutional facts are social constructs, but *not all* social constructs are institutional facts in Searle's specific sense.
          *   *Leaves Out:* Social constructs like "race" or "gender" (while heavily influenced by collective agreement) may not always have the *explicit, codified status functions* and *deontic powers* (like specific legal obligations or sanctions) inherent in institutional facts. They can be more diffuse norms. Your examples (money, borders, queues) have clearer constitutive rules and sanctions.
      *   **Conventions (David Lewis):** Regularities in behavior sustained by common expectations (e.g., driving on the right side of the road).
          *   *Leaves Out:* Conventions often lack the explicit *status function* and strong *deontic powers*. You drive on the right because you expect others to, and it coordinates behavior, but violating it might cause an accident (a physical consequence) or a fine (a deontic power *if* backed by law – an institutional fact itself). A queue has a clearer status ("your place") and deontic power ("you *shouldn't* cut in") than mere convention.
      *   **Emergent Phenomena:** Properties of a system that arise from interactions of parts but aren't properties of the parts themselves (e.g., traffic jams).
          *   *Leaves Out:* While institutional facts *emerge* from collective intentionality, "emergent phenomena" is too broad. It doesn't capture the specific *intentional imposition of status functions* and the *deontic* nature of the binding force. A traffic jam constrains you physically, not because you collectively agree it *should* constrain you as a "jam."
      *   **Normative Practices:** Shared activities governed by rules about what *ought* to be done.
          *   *Leaves Out:* While institutional facts involve norms, this term doesn't emphasize the *constitutive* aspect – how the practice *creates* the very thing (money, border) that then imposes the norm. It also focuses more on the "ought" than the "is" (the existence of the fact itself).

  3.  **Sharpening the Definition: Addressing Your Needs & Edge Cases**
      Searle's "institutional fact" is the best foundation. To precisely capture your emphasis on the *binding force* and *individual inability to opt-out*, we can define a sub-type or sharpen the concept:

      > **Collectively Binding Institutional Entity (CBIE):** An entity, state of affairs, or fact that:
      >    1.  **Is Constitutively Dependent:** It exists *only* in virtue of collective intentionality imposing a specific status function (X counts as Y in C) upon some physical or behavioral substrate.
      >    2.  **Confers Deontic Powers:** This status inherently carries rights, obligations, permissions, authorizations, or requirements (deontic powers) for participants within the context.
      >    3.  **Is Individually Non-Opt-Outable:** The entity and its associated deontic powers persist and exert normative force on individuals *regardless* of an individual's personal belief or acceptance, due to the collective nature of the sustaining intentionality and the potential for sanctions (legal or social) enforcing the deontic powers. Individual defection does not dissolve the entity; it typically results in the defector facing consequences.
      >    4.  **Requires Critical Mass:** Its existence and functionality are threshold-dependent on a sufficient level of collective acceptance and participation. Below this threshold, the status function fails to be imposed or is eroded.

  4.  **Testing the Edge Cases with the CBIE Criteria:**
      *   **Language:**
          *   *CBIE?* **Partly, but complex.** Words (sounds/scribbles) count as meaningful symbols (Y) within a linguistic community (C) via collective intentionality. They confer the "power" to communicate, but also obligations (to use words roughly correctly to be understood). You cannot individually opt-out of a language's basic structure and expect to communicate effectively within that community; you face the "sanction" of incomprehension. *However*, language is more fluid, organic, and decentralized than money or borders. Status functions (meanings) shift gradually without formal declarations. Deontic powers are weaker ("you *should* use grammar correctly" vs. "you *must* pay taxes with this money"). **Verdict:** Language *shares core features* (constitutive dependence, some binding force) but is often seen as a foundational *precondition* for institutional facts rather than a pure CBIE itself. It's a borderline case, leaning towards being a CBIE in its standardized forms (e.g., legal or technical jargon).
      *   **Marriage:**
          *   *CBIE?* **Yes.** A ceremony/contract (X) counts as marriage (Y) within a legal/social system (C). It confers deontic powers (rights to inheritance, spousal privilege; obligations of support). An individual cannot unilaterally dissolve a legally recognized marriage by disbelief; they face legal and social consequences for ignoring its obligations (e.g., bigamy charges, loss of rights). Requires collective (societal/legal) recognition.
      *   **A Person's Reputation:**
          *   *CBIE?* **No, or Weakly.** Reputation is clearly a social construct heavily dependent on collective attitudes. However, it generally *lacks* a specific, codified constitutive rule ("X counts as reputation Y"). It's an aggregate perception, not a single imposed status function. Its deontic powers are indirect and fuzzy (influencing trust, opportunities) rather than specific rights/obligations. You *can* largely "opt-out" by isolating yourself or not caring, though it might be costly. Sanctions are social disapproval, not formal enforcement of a specific status. **Verdict:** A social fact, but not a CBIE.
      *   **A Law Still on the Books but Unenforced:**
          *   *CBIE?* **No (or a "Dead" CBIE).** The status function "X (this text) counts as Y (binding law) in C (this jurisdiction)" *requires* collective intentionality, crucially including the authorities (police, courts) who must generally *accept* and *act* upon it. If enforcement and recognition by key players erode, the deontic powers disappear. It exists as a *potential* institutional fact (the text is there), but without sustained collective acceptance (especially by enforcers), it fails criterion 3 (binding force) and 4 (critical mass). It's a relic, not a functioning CBIE.
      *   **A Title (e.g., "Doctor," "Knight"):**
          *   *CBIE?* **Yes.** A certificate/ceremony (X) counts as conferring the title (Y) within an institution/society (C). It confers deontic powers (right to use the title, sometimes specific privileges; obligations of conduct). Ignoring it (e.g., falsely claiming the title) leads to sanctions (loss of credibility, professional censure, legal action for fraud). Requires collective recognition by the granting institution and relevant community.
      *   **A Promise:**
          *   *CBIE?* **Marginal/Small-Scale.** Saying certain words (X) counts as creating a promise (Y) within a social context (C). It imposes an obligation (deontic power) on the promisor. If the promisee recognizes it, the promisor cannot unilaterally "opt-out" without facing the sanction of broken trust (and potentially legal consequences if it's a contract). *However,* it often requires only *dyadic* collective intentionality (between promisor and promisee), not necessarily a wider community. Its enforcement is often limited to interpersonal sanctions or specific legal contexts (contracts). **Verdict:** A promise is a *minimal* or *proto*-CBIE, most clearly fitting when embedded in a larger institutional structure (like contract law).

  **Conclusion:**

  The established philosophical term most directly addressing your core insight is **Institutional Fact (John Searle)**. It nails the constitutive dependence on collective intentionality (status functions) and the inherent deontic powers.

  To emphasize the specific facets you highlighted – the *rigid binding force on individuals* despite their personal belief and the *threshold dependency* – the sharpened concept **Collectively Binding Institutional Entity (CBIE)** is useful. It clearly distinguishes these powerful social facts from looser social constructs, conventions, or mere norms.

  The borders *are* blurry at the edges (like language or reputation), but the core cases (money, borders, queues, marriage, enforceable titles) stand out clearly: they are realities made real only by our shared agreement, yet they grip each of us with the force of necessity, dissolving only when the collective faith that sustains them finally crumbles. This is the fascinating and sometimes unsettling power of the social world we inhabit.
