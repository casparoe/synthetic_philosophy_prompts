answer: |-
  ## Dissertation Proposal: Truth-Conduciveness Asymmetries in Moral Foundations Theory: Assessing the Normative Implications of Political Moral Psychology

  **Working Title:** Beyond Activation: Assessing the Truth-Conduciveness of Moral Foundations Across the Political Spectrum

  **1. Research Question:**
  Can Moral Foundations Theory (MFT), specifically the empirical finding that political left and right differentially rely on distinct moral foundations, support a normative claim that *one side* is more reliably tracking objective moral truth? Specifically, does the *pattern of foundation activation* characteristic of either the political left (prioritising Care/Harm and Fairness/Cheating) or the political right (utilising a broader range including Loyalty/Betrayal, Authority/Subversion, Sanctity/Degradation) exhibit an *asymmetry in truth-conduciveness*, such that the causal processes underlying one pattern are demonstrably more sensitive to moral facts than the other?

  **2. Background and Problem Statement:**
  Moral Foundations Theory (Haidt, Graham, et al.) posits that human moral intuitions arise from a limited set of evolved psychological foundations – commonly Care/Harm, Fairness/Cheating, Loyalty/Betrayal, Authority/Subversion, Sanctity/Degradation – with Liberty/Oppression later proposed as an addition. Empirical research consistently demonstrates a political asymmetry in foundation activation: individuals on the political left primarily rely on Care and Fairness foundations, while those on the political right utilise a broader palette including Loyalty, Authority, and Sanctity.

  This descriptive asymmetry is frequently leveraged for normative conclusions:
  *   **Left-Debunking Argument:** Critics on the left often argue that the right's reliance on foundations like Sanctity (linked to disgust) and Loyalty/Authority (linked to tribalism) reveals their morality as arational, evolutionarily contingent sentiment, thereby debunking the objectivity of their moral claims.
  *   **Right-Completeness Argument:** Proponents like Haidt suggest the left's narrower focus constitutes a form of moral "colour-blindness," rendering their morality incomplete and potentially unstable. A wiser, more robust morality would integrate all foundations.

  **The Core Problem:** Both arguments make an unwarranted leap. They assume that the *psychological origin* of a moral intuition (its foundation) directly determines its *epistemic status* (its likelihood of tracking truth). However, a psychological explanation only debunks a belief if the causal process producing it is *insensitive* to the relevant truths (e.g., Street 2006, Joyce 2006). Explaining *how* someone came to believe a true proposition does not undermine its truth. Therefore, the critical question is not *which* foundations are used, but *whether the specific causal processes* associated with the *differential reliance* on these foundations by left and right show any *asymmetry in their truth-conduciveness*. The existing normative interpretations leave this crucial question unaddressed, implicitly smuggling in contested assumptions about the reliability of different foundations.

  **3. Research Rationale and Original Contribution:**
  This project addresses a significant gap in the application of MFT. While the descriptive asymmetry is well-established, the normative leap remains philosophically underdeveloped. This dissertation aims to:
  1.  **Critique:** Systematically expose the hidden assumptions about truth-conduciveness underpinning both the "left-debunking" and "right-completeness" interpretations of the MFT asymmetry.
  2.  **Reframe:** Shift the normative focus from *which foundations are activated* to the *epistemic quality (truth-conduciveness)* of the psychological processes associated with their characteristic activation patterns for each political orientation.
  3.  **Analyse:** Rigorously examine whether there is a plausible *asymmetry* in the truth-conduciveness of these patterns. Crucially, it will explore the possibility that debunking arguments targeting specific foundations (e.g., Sanctity as 'mere disgust') might apply *symmetrically* to all foundations (e.g., Care as 'mere empathy'), potentially rendering MFT normatively silent on the left/right question.
  4.  **Map Conditions:** Identify the specific metaethical and epistemological conditions under which such an asymmetry *could* plausibly emerge or remain elusive. This involves exploring how different conceptions of moral truth (e.g., realist, constructivist) and truth-conduciveness impact the analysis.

  The original contribution lies in applying sophisticated philosophical tools regarding evolutionary debunking arguments and epistemic justification directly to the empirical claims of MFT, moving beyond simplistic descriptive-to-normative leaps to a more nuanced assessment of the theory's normative implications.

  **4. Methodology:**
  This is primarily a **conceptual research project** employing philosophical analysis. The method will involve:

  1.  **Conceptual Clarification:** Precisely defining key concepts: "truth-conduciveness" in the context of moral psychology, "debunking argument," "epistemic sensitivity/insensitivity," and the core MFT foundations (operationalised using standard MFT definitions).
  2.  **Critical Analysis of Existing Arguments:** Deconstructing the logic of both the "left-debunks-right" and "right-completes-left" positions to expose their implicit, undefended assumptions about the truth-conduciveness (or lack thereof) of specific foundations or activation patterns.
  3.  **Truth-Conduciveness Assessment:** Drawing on philosophical literature on evolutionary debunking arguments (e.g., Street, Joyce, Enoch, Vavova) and epistemic justification, analyse *each* core MFT foundation (Care, Fairness, Loyalty, Authority, Sanctity) and the *characteristic activation patterns* (Left pattern: Care/Fairness dominant; Right pattern: Broader spread). Assess the potential epistemic strengths and weaknesses of the psychological processes associated with each foundation/pattern regarding their sensitivity to plausible moral facts. Key questions include:
      *   Are certain foundations inherently more susceptible to distortion by evolutionarily selected biases irrelevant to truth (e.g., kin favouritism, in-group bias)?
      *   Does relying on a broader/narrower range of foundations inherently make intuitions more/less reliable?
      *   Are concerns about emotional contamination (e.g., disgust for Sanctity) equally applicable to emotional bases of other foundations (e.g., empathy for Care)?
  4.  **Symmetry/Asymmetry Analysis:** Systematically compare the assessments of the left and right activation patterns. Does the analysis reveal a genuine *asymmetry* in overall truth-conduciveness? Or do debunking pressures apply symmetrically, or in ways that cancel out? Under what metaethical assumptions (e.g., realism vs. certain forms of constructivism) does an asymmetry become more or less plausible?
  5.  **Synthesis and Conclusion:** Synthesise the findings to answer the core research question, clearly stating the conditions under which MFT could (or could not) support a normative asymmetry claim between left and right.

  **Empirical MFT literature will be engaged with at arm's length**, taken as providing the well-established descriptive starting point (the activation asymmetry) but not as the source of normative conclusions. No new empirical studies (surveys, experiments) will be conducted.

  **5. Scope and Limitations:**

  *   **Focus:** The project centres on the **original five MFT foundations** (Care, Fairness, Loyalty, Authority, Sanctity). The Liberty/Oppression foundation, being a later addition with less established empirical traction regarding the left/right asymmetry, will be excluded to maintain focus and feasibility.
  *   **Metaethics:** The project **cannot resolve** deep, longstanding metaethical debates about the nature of moral truth itself. Instead, it will adopt a **minimalist, working conception** of moral truth as involving robust moral facts (e.g., suffering is *pro tanto* bad, betrayal generally wrong) that moral judgements aim to track. The analysis will explicitly explore how the *viability* of an asymmetry claim *depends* on different metaethical starting points (e.g., realist, response-dependent, constructivist), without attempting to definitively settle these broader debates.
  *   **Political Complexity:** "Left" and "Right" are treated as broad, empirically identified clusters based on MFT research findings, acknowledging internal heterogeneity but focusing on the dominant activation patterns identified in the literature.
  *   **Scope Feasibility:** Focusing solely on the truth-conduciveness question regarding the *characteristic activation patterns*, while excluding Liberty/Oppression and bracketing deep metaethics, makes this ambitious project manageable within a single semester. The core analytical work involves comparing the epistemic profiles of the two patterns across the five foundations.

  **6. Definition of Success and Failure:**

  *   **Successful Outcome:** The project will be successful if it:
      1.  Provides a clear, rigorous critique demonstrating why existing normative interpretations of the MFT asymmetry are incomplete due to unexamined assumptions about truth-conduciveness.
      2.  Delivers a systematic analysis of the potential truth-conduciveness (strengths and weaknesses) of the psychological processes associated with each core foundation and the characteristic left/right activation patterns.
      3.  Establishes a clear position on the symmetry/asymmetry question: either demonstrating a plausible asymmetry under specific conditions, or robustly arguing for symmetry/cancellation, or mapping the precise conditions under which each outcome holds.
      4.  Clearly articulates the key metaethical and epistemological factors that determine the plausibility of any asymmetry claim derived from MFT.
  *   **Failure:** The project would be considered to have failed if:
      1.  It remains purely descriptive or merely rehearses existing debates without advancing the critical analysis of truth-conduciveness.
      2.  The analysis of truth-conduciveness remains superficial or fails to engage adequately with the philosophical literature on debunking and epistemic justification.
      3.  It becomes bogged down in unresolvable metaethical debates to the point where the core question about the MFT asymmetry cannot be meaningfully addressed.
      4.  It fails to reach a coherent conclusion regarding the symmetry/asymmetry question and the conditions affecting it.

  **7. Feasibility and Timeline (One Semester):**
  This project is ambitious but feasible within one semester *given the defined scope* (original 5 foundations, conceptual analysis, bracketing deep metaethics/Liberty). Key to success is strict adherence to the focus on the truth-conduciveness of the *activation patterns*.

  *   **Trimming if Necessary:** Should time pressure arise, the most logical reduction would be to focus the truth-conduciveness analysis on **three core contrasting foundations** where the debate is sharpest: **Care** (prioritised by left), **Fairness** (prioritised by left, but potentially interpreted differently across spectrum), and **Sanctity** (prioritised by right, often targeted for debunking). This would allow for a deep dive into the most contentious epistemic comparisons while still addressing the core asymmetry. Loyalty and Authority could be addressed more briefly or synthesised if needed.
  *   **Timeline (Illustrative):**
      *   Weeks 1-2: Finalise proposal, deep dive into MFT empirical literature & philosophical debunking literature.
      *   Weeks 3-5: Conceptual groundwork, critique of existing normative interpretations (Left-Debunking & Right-Completeness).
      *   Weeks 6-9: Core analysis of truth-conduciveness per foundation and per activation pattern; symmetry/asymmetry assessment.
      *   Weeks 10-12: Synthesis of findings regarding conditions for asymmetry, conclusion drafting, revisions.
      *   Week 13: Final editing and submission.

  This proposal outlines a philosophically rigorous investigation into the normative potential of MFT, moving beyond descriptive psychology to critically assess whether the well-documented differences in moral foundation use between left and right carry any weight in determining who might be "more right" about morality, and crucially, *under what conditions* such a claim could hold water.
