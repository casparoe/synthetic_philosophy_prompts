  Here's my rigorously decomposed credence for the burned-ledger case, structured as requested. I'll provide a numerical probability that "pay" is the correct action, break it down into key factors with one-line justifications, combine them multiplicatively (since they're interdependent premises), and highlight the shakiest term.

  **Final Credence: 79.2% that FDT-style decision theory says "pay" (rounded to 79% for practicality)**  
  *Decomposition and Calculation:*  

  1.  **Factor 1: Dominance of Updateless/Functional Decision Theories (FDT) in Limit Cases (90%)**  
      *Justification:* FDT/UDT consistently outperforms CDT in dilemmas involving precommitment, predictors, and policy-dependent counterfactuals by optimizing for the *function* of your decision across branches.  
      *Weight:* 0.90  

  2.  **Factor 2: Irrelevance of "Physically Fixed but Causally Inaccessible" Facts (95%)**  
      *Justification:* The burned ledger's fixed outcome lacks causal levers (like XOR blackmail's meteor trigger), so it shouldn't override the *functional* dependence of Omega's actions on your policy.  
      *Weight:* 0.95  

  3.  **Factor 3: Evidential vs. Causal Relevance Favors Functional Control (92%)**  
      *Justification:* Your action *is* evidentially linked to the coin outcome (via Omega's setup), but under FDT, it's your policy's *counterfactual influence* on Omega's strategy that matters, not the inert fixed fact.  
      *Weight:* 0.92  

  **Combined Calculation:**  
  \[ \text{Credence} = \text{F1} \times \text{F2} \times \text{F3} = 0.90 \times 0.95 \times 0.92 = 0.7866 \approx 79\% \]  

  **Shakiest Factor: Factor 3 (Evidential vs. Causal Relevance)**  
  - **Why shaky?** The distinction between "evidence of a fixed state" and "functional control over the setup" feels ontologically slippery. Intuitions from XOR blackmail (where paying *is* evidence of doom) bleed into this case, creating tension.  
  - **What would move it?** Concrete examples where *ignoring* fixed-but-inaccessible data demonstrably improves outcomes *across simulations* (e.g., an AI experiment showing FDT agents winning against CDT in ledger-style problems). If such results consistently show <50% payoff for "pay", I’d drop this factor toward 0.50.  

  **Key Insight from Your Setup:**  
  Your struggle stems from conflating two boundaries: (1) *causal accessibility* (ledger vs. blackmail) and (2) *counterfactual responsibility* (mugging’s policy impact). The ledger case isolates the latter—Omega’s response depends on your *function*, not your ability to *alter* the coin. FDT cares about (2), not (1), hence the "pay" verdict. Your pre-registered 0.75/0.50 split suggests intuition is over-indexing on the fixed coin (like blackmail) while theory favors mugging logic.  

  **If I’m Wrong, Blame This:**  
  The error would likely stem from **Factor 1** (FDT dominance). If CDT can be shown optimal in *all* real-world implementations (e.g., no verified predictors exist), FDT collapses. But given the problem’s reliance on perfect Omega, I stand by the weights.
