answer: |-
  ### Faithful Restatement in Decision-Theoretic Vocabulary  

  #### 1. **Original Position as a Formal Choice Problem**  
  - **Acts**: The choice of principles of justice (e.g., utilitarianism vs. Rawls’s two principles).  
  - **States**: Possible future social positions (e.g., born rich/poor, majority/minority, able/disabled).  
  - **Outcomes**: Lifetime bundles of *primary goods* (rights, liberties, income, opportunities, self-respect).  
  - **Choosing Agent**: Rational, mutually disinterested parties representing citizens. Each seeks to maximize their share of primary goods but *does not know* their own traits or social position.  
  - **Faithfulness/Distortion**: Using primary goods as outcomes is **faithful** — Rawls explicitly defines outcomes this way. However, modeling agents as purely self-interested maximizers *is a distortion*: Rawls’s parties are also constrained by a desire for reciprocal fairness (a moral element not captured by standard utility maximization).  

  #### 2. **Refusal of Probabilities & Complete Ignorance**  
  - The veil imposes **complete ignorance**: Parties have *no basis* for assigning probabilities to states (social positions). This is stricter than Savage’s "uncertainty" (where probabilities exist but are unknown) — it deletes even the *conceivability* of probabilistic reasoning.  
  - **Maximin as a Rule Selection**: Rawls’s argument for the difference principle (maximize the worst-off position) is explicitly a **maximin rule** under complete ignorance. His justification:  
    - The stakes are existential (basic liberties/livelihoods).  
    - Some outcomes are "intolerable" (e.g., oppression).  
    - Alternatives (e.g., utilitarianism) risk catastrophic losses.  
    This is **not underdetermined** for Rawls — he argues maximin is uniquely rational given the gravity of the choice.  

  #### 3. **Lexical Ordering & Expected Utility**  
  - **Lexical Priorities**:  
    - *First Principle* (basic liberties) ≻ *Second Principle* (opportunities + difference principle).  
    - Fair equality of opportunity ≻ Difference principle (economic inequalities must benefit the least advantaged).  
  - **Expected Utility Representation?**  
    - **No, it cannot be represented by expected utility**. Lexical ordering violates the **continuity axiom** (no trade-offs between priorities). The difference principle is *maximin-focused*: it only cares about the worst outcome, not the distribution’s shape or average.  
    - **Why this matters**: Risk aversion (e.g., concave utility) still weighs all outcomes; maximin ignores everything but the floor. This failure of utility representation is **informative** — Rawls rejects the very framework of probabilistic trade-offs for justice.  

  #### 4. **Strains of Commitment**  
  - **Decision-Theoretic Counterpart**: A **precommitment constraint** on acts. Parties must select principles they can rationally adhere to *after* the veil lifts, avoiding choices that would cause defection or instability.  
  - **What Gets Lost**: Rawls ties this to *moral psychology* and *social stability* — it’s not just about individual rationality but about securing willing compliance in a pluralistic society. Modeling it as a constraint on acts reduces it to instrumental rationality, ignoring its role in Rawls’s broader theory of legitimacy.  

  ---

  ### Residue Report  
  **(a) Clean Translations**  
  - Veil of ignorance → Complete ignorance setup.  
  - Difference principle → Maximin decision rule.  
  - Primary goods as outcomes → Faithful outcome space.  
  - Refusal of probabilities → Rejection of probabilistic reasoning in the model.  

  **(b) Distortions Required**  
  - **Single rational agent**: Rawls’s parties are *plural* and mutually disinterested. Modeling one "representative" agent flattens the interpersonal dimension.  
  - **Complete/transitive preferences**: Rawls assumes parties have these, but his lexical ordering *deliberately* violates continuity — a feature, not a bug.  
  - **Self-interest only**: Rawls’s parties are designed to be free of envy/egoism, but this is a normative stipulation, not derived from decision theory.  

  **(c) Untranslatable Elements**  
  - **Moral constructivism**: The original position is a device to *derive* moral principles, not just optimize preferences.  
  - **The basis for maximin**: Rawls’s argument relies on the *moral significance* of the worst-off position ("reciprocity"), not solely on decision rules.  
  - **Intrinsic value of liberties**: Liberties aren’t "goods" to be maximized; they’re preconditions for moral agency.  

  ---

  ### Adjudication: Your Hypothesis vs. Rawls  
  **Your Hypothesis**: *"Difference principle = extreme risk aversion; dispute with Harsanyi is about priors/risk attitudes."*  
  **Verdict**: **Does not survive**. Here’s why:  

  1. **Lexical Ordering ≠ Risk Aversion**  
     - Extreme risk aversion (e.g., Arrow-Pratt index → ∞) still uses a utility function. Lexical priorities *cannot* be represented by *any* real-valued utility function — they require a vector-valued or discontinuous function.  
     - Rawls’s ordering is a *structural constraint*, not a degree of risk aversion. Risk aversion operates *within* a priority class; lexical ordering *deprioritizes* entire classes.  

  2. **Harsanyi vs. Rawls: More Than Priors**  
     - Harsanyi’s impartial observer uses **equal probabilities** → average utilitarianism.  
     - Rawls rejects probabilities *entirely* → maximin.  
     - **The clash**: Harsanyi assumes rational choosers *must* use probabilities (per Savage). Rawls argues probabilities are *meaningless* behind the veil — it’s a **fundamental disagreement about rationality**, not just risk attitudes.  

  3. **What Your Vocabulary Misses**  
     - Rawls’s veil excludes not just probabilities but *all knowledge of society-specific facts*. This makes the choice **categorical** (applying to all societies), not parametric.  
     - The difference principle reflects **reciprocity** (no social group ought to dominate others) — a moral concept absent in decision theory’s preference aggregation.  

  **On Your TA’s Point**:  
  - **Where translation fails**: It’s because your framework is **missing moral constructs**, not because Rawls is unclear. His "no risk" claim means:  
    > *The original position isn’t a gamble to optimize; it’s a moral test for non-exploitative institutions.*  
  - **Territorial or deep?** Deep. Reducing it to decision theory strips the *justificatory role* of the veil — it’s meant to model fairness, not uncertainty.  

  ### Conclusion  
  Your instinct that the original position *resembles* a decision problem is astute, but the residue (lexical priorities, moral reciprocity, categorical reasoning) shows that Rawls co-opts decision-theoretic structures for a **non-instrumentalist moral framework**. The difference principle isn’t extreme risk aversion — it’s a *deliberate rejection* of the utility-maximization paradigm. Your vocabulary *can* state the surface mechanics but not the moral stakes Rawls cares about. To bridge the gap, study **Amartya Sen** (e.g., "Maximin and the Arrow Impossibility") or **Ken Binmore** ("Natural Justice") — they rigorously dissect this interface.
