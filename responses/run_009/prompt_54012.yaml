  Ah, the ending challenge... Need to show the indexicality of actuality without stating it. Maybe her noticing ordinary people going about their lives while thinking "each believes this is the real one" - perhaps while sitting in a park? The coffee cup detail could serve well - a mundane object anchoring the cosmic thought.

