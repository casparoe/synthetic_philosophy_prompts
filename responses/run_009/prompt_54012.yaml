  Word count target means every scene must pull weight. Probably three acts: 1) conversion, 2) emotional exploration, 3) deliberation + quiet ending. The park bench setting for the end could bookend with an earlier academic setting (community college classroom?) to show her journey from student of theory to lived experience.

  The coffee choice is perfect for the deliberation scene - small but loaded with her new perspective. Her hesitation before answering "yes" to cream will subtly show her hoping to align with a "better" counterpart's path. And the final image of steam rising while she imagines other selves making different choices... that visualizes the metaphysics without explanation.

