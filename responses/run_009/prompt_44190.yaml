prompt: |-
  You're a professional philosopher working on philosophy of mind and action, and I want you to think carefully before answering — start with some brainstorming notes, then discard them from the final answer if you like. Here's my situation: I got into an argument with a friend about whether self-deception is even coherent, and I want to go into the literature prepared rather than just picking the first theory I find sympathetic. So before I read a single paper, I want the spec.

  The paradox, as I understand it: to deceive someone you generally need to know the truth, and you need to intend that they believe the falsehood. But in self-deception the deceiver and the deceived are the same person, so it looks like I'd have to simultaneously believe p and intend to make myself believe not-p, which seems doxastically impossible. Fine. But I suspect the way people resolve this differs wildly depending on what they think a theory of self-deception is FOR, and I want that surfaced first.

  So: write the desiderata — what any adequate theory of self-deception must deliver. For each requirement, give the motivating case or consideration, and say whether it's a genuine requirement or just a prejudice of one camp. Things I'd want you to at least consider putting on the list (add or discard as you see fit):

  - It has to dissolve or domesticate the strategic paradox without just relabelling it.
  - It has to distinguish self-deception from mere wishful thinking, optimism bias, and motivated reasoning in general — is there a fact of the matter here or is the boundary vague? If vague, the theory still needs to say where the vagueness comes from.
  - It has to handle the timing question: confabulation after the fact (I decide, then invent my reasons) versus belief formation bent by desire in the first place. Both get called self-deception. Can one theory cover both, or do the desiderata pull apart here?
  - It has to deal with partial belief and self-deception about one's own beliefs — the person who sincerely says "I've forgiven him" but flinches whenever his name comes up. Does the theory need a graded notion of belief?
  - It can't contradict what we know from psychology and neuroscience: cognitive dissonance experiments, choice blindness, split-brain confabulation, anosognosia patients who deny their own paralysis. Though note some of these people seem like genuinely bad analogues for ordinary self-deception — figure out whether that's a problem for the requirement itself.
  - It has to explain the distinctive moral profile: why we blame the self-deceived person more than the person who makes an honest error, but seemingly less than the person who flat-out lies to others — and whether that asymmetry is even real or an artefact of how we talk about it.
  - It has to say something about first-person detectability: why self-deception is sometimes catchable from the inside ("I only believe that because I want it to be true" is a thought we can actually have), and what that implies about the structure of the mind doing the deceiving.
  - A nastier one I keep chewing on: should the theory explain why self-deception often seems to require outside help — a complicit spouse, a yes-man colleague, a feed curated by an algorithm that just shows you what you already want? If self-deception is fundamentally a social affair, that's a very different theory than the lone agent deceiving themselves, and I want to know whether that belongs in the requirements or is a separate research programme.

  Then flag which pairs of desiderata you suspect can't be jointly satisfied — e.g. does demanding an intention-like element (to keep self-deception distinct from mere bias) inevitably reintroduce the paradox? I have a feeling the list itself, if the tensions are real, is already a result, and that's the part I most want to see.

  Finally, briefly — and keep this light, the criteria are where the thinking is — score the main contenders against the list: the deflationary/motivated-cognition approach on the one hand and the divided-mind or partitions-of-the-self approaches on the other. I don't need a full scorecard, just where each one takes its big hits.

  Please structure the response with these sections, in this order and roughly these lengths:

  1. "The target, fixed" — what a theory of self-deception is a theory of, 100–150 words.
  2. "The desiderata" — the list, each with its motivating case and a genuine-requirement-or-camp-prejudice verdict, the bulk of the response, 600–800 words.
  3. "The conflicts" — which requirements can't be jointly met and what that means, 150–250 words.
  4. "The contenders, briefly" — the light scoring, 150–200 words.

  If a table helps for section 2, use one, but the motivating cases should be in prose so they actually land. And please be honest about where you're unsure — I'd rather have a flagged uncertainty than a confident hand-wave.
reasoning: |-
  Alright, let me start by really unpacking what the user is asking. They want a framework for evaluating theories of self-deception before diving into the literature. The key here is to identify the core requirements any theory must meet and the tensions between them. 

  First, the paradox: how can one person be both deceiver and deceived? The user mentioned that resolving this might depend on what the theory is for. That's crucial. Different philosophers might prioritize different aspects—like moral responsibility versus psychological plausibility. 

  Looking at their list of desiderata, each needs a motivating case and a verdict on whether it's essential or debatable. For example, distinguishing self-deception from wishful thinking. The user wonders if the boundary is vague. A good theory should clarify that vagueness, not ignore it. Also, the timing question—pre-decision versus post-hoc confabulation. Some theories might handle one better than the other. 

  Neuroscience constraints are tricky. Cases like anosognosia might not perfectly map to everyday self-deception, but a theory can't contradict solid evidence. The moral aspect is another layer. Why blame the self-deceived more than someone honestly mistaken? The user’s point about outside help—social elements—adds complexity. Is self-deception ever truly individual, or does it require social reinforcement? That could split theories into individual versus social paradigms.

  Then there's the conflict between intentionality and avoiding paradox. If a theory requires intention to distinguish from bias, it might reintroduce the paradox. But without any strategic element, does it cease to be deception? That's a core tension. Also, partial belief—how to handle cases where someone claims a belief but acts otherwise. Does this need graded beliefs, or can it be explained by belief-behavior gaps?

  The user’s deeper needs: they want to avoid cherry-picking theories. By mapping the desiderata and conflicts, they can critically assess any theory they encounter. They might also be interested in how these requirements shape the debate—what gets sacrificed and why. Highlighting where contenders (like deflationary vs. partitioned mind) succeed or fail against these criteria will give them a roadmap for further reading.

  I need to ensure each desideratum is clearly motivated. For instance, first-person detectability matters because we sometimes catch ourselves in self-deception, which challenges how subconscious the process is. If a theory can’t explain that, it’s lacking. Also, being honest about uncertainties—like whether social elements are essential or supplementary—keeps the analysis balanced.

  Finally, structuring the response to match their sections. The target definition must capture the essence without pre-solving the paradox. The desiderata section is the bulk, so each point needs concise motivation and a verdict. Conflicts should highlight irreconcilable tensions, like intentionality vs. avoiding paradox. The contenders' evaluation should show where each theory struggles, using the desiderata as a measure. Keeping it light but insightful there, since the user values the criteria most.
answer: |-
  ### 1. The Target, Fixed  
  A theory of self-deception must explain cases where an agent appears to hold a belief *because* they desire it to be true, despite accessible evidence to the contrary, while exhibiting behaviors suggesting they implicitly recognize the truth. Crucially, it involves **active resistance to unwelcome truths** (e.g., denying a partner’s infidelity despite mounting proof) and **strategic avoidance of counterevidence** (e.g., refusing to check bank statements while insisting finances are fine). The core challenge is reconciling this with the unity of the mind: how can one agent simultaneously evade and harbor a truth? The target excludes passive biases (e.g., optimism about vague futures) or unconscious errors, centering on **agent-level conflict where desire distorts epistemic responsibility**.

  ---

  ### 2. The Desiderata  
  *(Key: 🌟 = Uncontroversial core requirement | ⚖️ = Contentious/domain-dependent | 🤔 = Uncertain status)*  

  | Desideratum                                                                 | Motivating Case & Status                                                                                               | Verdict                                                                 |
  |-----------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------|
  | **1. Resolve the strategic paradox**                                        | *Case*: A smoker who insists “I won’t get cancer” but avoids medical screenings. Must explain how the same mind avoids truth while holding its opposite. | 🌟 **Genuine requirement**: Any theory collapsing into “hidden lying” or brute irrationality fails. |
  | **2. Distinguish from wishful thinking/motivated reasoning**                | *Case*: Wishful thinking: “I’ll win the lottery!” (no counterevidence). Self-deception: “My addiction isn’t harming my kids” (ignoring evidence). Boundary may be vague (e.g., climate change denial). | ⚖️ **Contentious**: Some (e.g., Mele) argue self-deception *is* motivated reasoning; others insist on strategic intent. Boundary vagueness requires explanation. |
  | **3. Handle timing (preemptive vs. post-hoc)**                              | *Case*: **Preemptive**: Avoiding job performance data to believe you’re excelling. **Post-hoc**: Claiming “I never wanted that job” after rejection. Both exhibit resistance to dissonant truths. | 🌟 **Genuine requirement**: A unified theory must cover both temporal structures without ad hoc divisions. |
  | **4. Account for partial belief & belief-behavior gaps**                    | *Case*: “I believe therapy helps” (sincere assertion) yet chronically avoids scheduling sessions. Graded belief or discord between avowal and implicit belief? | 🤔 **Uncertain**: Psychology supports degrees of belief, but philosophers debate if this is necessary or if belief-behavior mismatches suffice. |
  | **5. Cohere with empirical psychology/neuroscience**                        | *Case*: **Anosognosia** (denying paralysis) lacks strategic intent; **cognitive dissonance** (Festinger) shows post-decision justification. Is strategic self-deception a distinct category? | 🌟 **Genuine requirement**: Cannot contradict robust findings (e.g., choice blindness), but may need to *contrast* clinical/experimental cases from agential self-deception. |
  | **6. Explain moral asymmetry**                                              | *Case*: Blaming a parent for denying their child’s addiction (self-deception) more than a misinformed neighbor (error) but less than a liar covering for the child. Asymmetry may stem from reduced control vs. dishonesty. | ⚖️ **Contentious**: Moral weight may depend on theory (e.g., partitioned-mind theories imply less blame; deflationists more). |
  | **7. Explain first-person detectability**                                   | *Case*: “Am I only defending this policy because it benefits me?” – fleeting awareness of one’s bias. Implies self-deception isn’t fully unconscious. | 🌟 **Genuine requirement**: Must explain how self-interrogation can pierce deception without collapsing it. |
  | **8. Address social scaffolding**                                           | *Case*: A politician surrounded by sycophants who reinforce their denial of scandal. Does self-deception *require* social echo chambers, or are they merely facilitators? | 🤔 **Uncertain**: Likely a feature of many cases, but whether it’s *essential* divides individualist vs. embedded-mind theories. |

  ---

  ### 3. The Conflicts  
  **Core tensions arise between:**  
  - **Intentionality vs. Paradox Resolution (D1 vs. D2/D7):** Demanding strategic intent (to distinguish self-deception from bias) risks reintroducing the paradox of simultaneous knowledge/ignorance. Yet eliminating intent may reduce self-deception to mere bias, violating D2.  
  - **Unity of Mind vs. Partial Belief/Social Scaffolding (D4/D8 vs. D1):** Partitioned-mind theories (e.g., Freudian subagents) neatly resolve D1 but struggle with D4/D8—graded beliefs and social dependence suggest fluid, context-driven processes, not stable subpersonae.  
  - **Moral Responsibility vs. Psychological Mechanism (D6 vs. D5/D7):** If self-deception is subpersonal (D5) or partially detectable (D7), does blame diminish? Theories prioritizing empirical plausibility (D5) may undermine the agential control implied by D6.  

  **Implication:** No theory satisfies all desiderata equally. The field fractures along fault lines: those preserving agency (emphasizing D1/D6) vs. those prioritizing empirical unity (D4/D5/D8).

  ---

  ### 4. The Contenders, Briefly  
  - **Deflationary/Motivated Cognition (e.g., Mele):** Reduces self-deception to biased belief-formation (e.g., selective evidence gathering). **Hits**: Elegantly resolves the paradox (D1) by eliminating intent; aligns with psychology (D5); handles partial belief (D4). **Misses**: Blurs distinction from wishful thinking (D2); struggles with first-person awareness (D7—why *feel* deceptive?); weak on moral asymmetry (D6—if just bias, why extra blame?).  
  - **Partitioned Mind (e.g., Davidson, Rorty):** Posits subconscious modules or conflicting belief-sets. **Hits**: Explains the paradox (D1) via mental division; accommodates detectability (D7—one partition “notices”); justifies moral blame (D6—agential negligence). **Misses**: Neuroscientifically dubious (D5—no evidence for stable partitions); poor fit with social scaffolding (D8—overly individualistic); vague on partial belief (D4).  

  **Emerging approaches**: "Dynamical systems" models (integrating D4/D5/D8) treat self-deception as feedback loops between cognition, affect, and social inputs—promising but underdeveloped on D1/D6. **Overall**: Deflationism leads on empirical coherence; partition theories on agential/phenomenal fidelity. The choice hinges on which desiderata you weight.
