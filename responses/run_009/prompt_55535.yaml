answer: |-
  **Bell's theorem, in causal-inference terms, establishes that no latent-variable DAG satisfying locality (d-separation of outcomes given the source), free choice (exogeneity of settings), and causal sufficiency can reproduce the quantum correlations without violating the constraints of probability theory.**

  ### Restatement in Causal-Inference Vocabulary:
  1. **DAG Structure**:  
     - **Nodes**: Latent confounder \( \Lambda \) (source, e.g., entangled particle pair), observed variables \( X \) (Alice's setting), \( Y \) (Bob's setting), \( A \) (Alice's outcome), \( B \) (Bob's outcome).  
     - **Edges**:  
       - \( \Lambda \rightarrow A \), \( \Lambda \rightarrow B \) (outcomes depend on the source).  
       - \( X \rightarrow A \), \( Y \rightarrow B \) (settings locally influence outcomes).  
       - *No other edges*: No \( X \rightarrow B \), \( Y \rightarrow A \), \( A \leftrightarrow B \), or direct cross-wing influences.  
     - **Graph**:  
       ```
         X    Y
          \  / 
           Λ
          / \
         A   B
       ```  
       Implicitly: \( X \rightarrow A \), \( Y \rightarrow B \) (omitted to avoid clutter, but critical).  

  2. **Assumptions**:  
     - **Locality**: \( A \perp\!\!\!\perp B \mid \Lambda, X, Y \) (conditioning on \( \Lambda \) screens off correlations between outcomes).  
       - *Translation of Bell's locality*: Outcomes are independent given the source and local settings.  
     - **Free Choice**: \( X \perp\!\!\!\perp \Lambda \) and \( Y \perp\!\!\!\perp \Lambda \) (settings are exogenous, unconfounded with \( \Lambda \)).  
       - *Superdeterminism*: Explicitly denies this, allowing \( X \not\!\perp\!\!\!\perp \Lambda \) or \( Y \not\!\perp\!\!\!\perp \Lambda \).  
     - **Causal Sufficiency**: \( \Lambda \) includes all common causes of \( A \) and \( B \).  
     - **Faithfulness**: All conditional independences arise from the DAG structure (no fine-tuning).  

  3. **Bell's Inequality as a Constraint**:  
     - The joint distribution \( P(A, B \mid X, Y) \) must factorize as:  
       \[
       P(A, B \mid X, Y) = \sum_{\lambda} P(\lambda) \, P(A \mid X, \lambda) \, P(B \mid Y, \lambda).
       \]  
     - **Violations imply**: No such \( \Lambda \) exists that satisfies the factorization while matching experimental data.  
     - *In graphical terms*: The DAG induces constraints (via d-separation) that quantum correlations violate.  

  4. **Measurement Settings and Free Choice**:  
     - Settings \( (X, Y) \) are root nodes (no parents).  
     - **Free choice** = Exogeneity: \( X, Y \) have no confounders with \( \Lambda \) or each other (\( X \perp\!\!\!\perp Y, \Lambda \)).  
     - Denial (superdeterminism) introduces edges like \( \Lambda \rightarrow X \) or \( \Lambda \rightarrow Y \), violating exogeneity.  

  ### Residue Report:
  **I. Translates Cleanly:**  
  - **Locality** = \( A \perp\!\!\!\perp B \mid \Lambda, X, Y \) (d-separation).  
  - **Free choice** = Exogeneity of \( X, Y \) (no confounders with \( \Lambda \)).  
  - **Latent confounders** at the source (\( \Lambda \)) as the mechanism for correlation.  
  - **Bell inequality** = Necessary condition for the existence of a latent-variable DAG with the given structure.  

  **II. Survives with Distortion:**  
  - **Realism**:  
    - *Philosophy*: Outcomes exist independently of measurement (counterfactual definiteness).  
    - *Causal translation*: Implicit in defining \( P(A \mid X, \lambda) \) and \( P(B \mid Y, \lambda) \) for all \( X, Y \) (counterfactuals exist).  
    - *Distortion*: Causal models assume counterfactuals are well-defined, but do not require determinism (stochastic functions are allowed).  
  - **Determinism**:  
    - *Philosophy*: Often presented as essential.  
    - *Causal translation*: Not required; stochastic outcomes (\( A, B \) as functions of \( X, Y, \Lambda \)) are permitted.  

  **III. No Expression in Graphical Models:**  
  1. **Nonexistence of Joint Distributions for All Settings**:  
     - *Philosophy*: Quantum outcomes lack a joint distribution over \(\{A_x, B_y\}\) for all combinations of settings \( (x,y) \).  
     - *Causal limitation*: Graphical models **always** assume a joint distribution over all variables (including counterfactuals via \( \Lambda \)).  
       - The model implies \( P(A_{x_1}, A_{x_2}, B_{y_1}, B_{y_2}, \dots \mid \Lambda) \) exists.  
       - Bell violations prove **no such model exists**, but the framework cannot express the *absence* of a joint distribution—only the impossibility of a DAG.  

  2. **Bell as a Proof of No Model (vs. Constraint)**:  
     - *Philosophy*: Highlights the incompatibility of quantum phenomena with *any* joint distribution.  
     - *Causal limitation*: The framework is inherently *generative*; it assumes joint distributions and tests for DAG compatibility.  
       - Violations imply "no compatible DAG," not "no joint distribution" as a primitive concept.  

  ### Is the Residue a Defect or Insight?
  - **Not a defect**: The residue reveals that the standard "locality/realism/determinism" framing **misdescribes the theorem's structure**.  
    - Graphical models show that **free choice** (exogeneity) and **locality** (d-separation) are the core assumptions. "Realism" is redundant—it is baked into the latent-variable approach.  
    - The joint distribution issue is a *consequence* of the DAG assumptions, not an independent postulate.  
  - **Insight**: Causal inference provides a rigorous language:  
    - Bell violations refute **any**\( \Lambda \)-based DAG with locality and free choice.  
    - Superdeterminism is not "mysterious"—it is the denial of \( X, Y \perp\!\!\!\perp \Lambda \).  
    - The real divide is between **causal structures** (local DAGs vs. nonlocal models), not vague "isms."  

  ### Conclusion:
  Bell's theorem is best viewed as a **constraint on feasible DAGs**: quantum correlations cannot be generated by a locally separable latent-variable model with exogenous settings. The graphical framework excels in clarifying assumptions (locality = d-separation, free choice = exogeneity) but cannot escape its generative nature—it frames violations as "no model exists" rather than "no joint distribution." This is not a flaw but a precision tool, exposing the standard philosophical taxonomy as underspecified.
