prompt: |-
  I'm on the board of a mid-sized professional society (about 900 members), and we elect our officers — president, secretary, three at-large board seats — by simple plurality, one office at a time. Every election cycle we get complaints that people are voting tactically: lesser-evil votes, members coordinating on social media around a "anyone but X" candidate, that kind of thing. Now there's a motion on the table to switch to instant-runoff voting. One of my fellow board members keeps bringing up something called the Gibbard–Satterthwaite theorem and saying no voting method can be strategy-proof, so the whole debate is pointless and we should just keep what we have. My understanding of the theorem is roughly: if you're electing one winner from three or more candidates, and the outcome depends on preferences in a way where any candidate could win given the right voters, and there's no dictator, then any voting method can be gamed by somebody misreporting their preferences.

  What I need is not a treatise on social choice theory. I need a decision procedure the board can actually run whenever someone proposes a voting method — this year it's instant runoff, next year it'll be something else, so it has to be reusable. Concretely:

  1. An ordered checklist of questions to ask about any proposed method: what to establish at each step (how many candidates can realistically run, what the ballot type actually is, whether every candidate is a possible winner under some profile of honest preferences, whether some voter or chair is a de facto dictator), what counts as a sufficient answer to each, and at which step the theorem's conclusion kicks in and ends the strategy-proofness analysis for good. If a step needs something technical checked, tell me what to ask the proposer and what answer should reassure us.

  2. Clear handoff points to human judgment. Once we know a method is manipulable in principle, the real question is about degree — how hard the manipulation is, how much information about others' votes the manipulator needs, whether 900 amateurs with a google group will realistically pull it off. Be honest about which of these has an objective answer and which is a values call the board has to own rather than hide inside the checklist.

  3. Worked applications: run the procedure on (a) our current plurality system, (b) the proposed instant runoff, and (c) approval voting, which someone floated as a workaround. I expect the procedure to give us at least one answer we won't like — I've heard instant runoff is still manipulable, and I want to know whether approval voting genuinely escapes the theorem or is just exploiting a loophole in its assumptions (it's not really a ranked ballot, right?). Also handle the awkward edge case that some of our elections only have two nominees — does that change anything?

  4. An explicit list of what the procedure can't settle: whether tactical voting is even bad if everyone does it, how the method affects turnout, and anything about the three board seats being elected together (is that still one election per seat in the theorem's sense?). Flag these as out of scope rather than trying to sneak in answers.

  Constraints: the board is not made of mathematicians. We have one retired statistician who can sanity-check things but is not going to work through proofs, and we have a single meeting to decide whether to put a constitutional amendment in front of the membership. So the procedure needs to be runnable in an afternoon per proposal, from the proposal text plus maybe one follow-up email.

  Please write your answer in American English. And at the end, be blunt: is my board member right that the debate is pointless, or is that a misreading of what the theorem actually lets us conclude?
reasoning: |-
  Okay, let me tackle this user's problem step by step. They're on the board of a professional society dealing with election method complaints and need a practical decision tool. The Gibbard-Satterthwaite theorem keeps coming up as a roadblock, but I suspect that's being misapplied.

  First, I need to understand what the user actually requires. They want a reusable checklist to evaluate any voting method proposal, not a theory lesson. The key elements are:
  - A structured question sequence that identifies when strategy-proofness becomes impossible
  - Clear handoffs where human judgment takes over after technical checks
  - Concrete examples applying it to their current system, IRV, and approval voting
  - Explicit boundaries about what the tool can't decide

  Hmm... the theorem's conditions are crucial here. If a method uses ranking ballots with 3+ candidates, allows any candidate to win, and has no dictator, then yes - it's manipulable. But many methods don't meet all conditions! For instance, approval voting uses ratings, not rankings, so it dodges the theorem entirely. And two-candidate elections are always strategy-proof - important since some of their seats have only two nominees.

  The checklist should start simple: 
  1. How many candidates? (If ≤2, stop - no manipulation possible) 
  2. Ballot type? (If not rankings, theorem may not apply) 
  3. Can every candidate win under honest votes? (If no, might be strategy-proof but possibly unfair) 
  4. Is there a dictator? (Almost never in real elections)

  For the human judgment part, I'll need to outline manipulation difficulty factors like coalition size needed and information requirements. Plurality is laughably easy to game ("vote for anyone but X"), while IRV requires coordinated secondary preference shuffling. Approval sits in the middle - bullet voting is simple but full optimization needs polling data.

  Applying this to their cases: 
  - Plurality obviously manipulable (check) 
  - IRV meets all theorem conditions (manipulable in principle) 
  - Approval avoids theorem by using different ballot type (but still manipulable in practice)

  Crucially, I should emphasize that the theorem doesn't make reform pointless. It just shifts the question from "can it be gamed?" to "how hard is gaming it?" - which is exactly where human judgment comes in. Their board member is half-right about universal manipulability but wrong about futility. The real issue is reducing vulnerability, not eliminating it.

  For out-of-scope items, I'll explicitly call out: 
  - Whether tactical voting is inherently bad 
  - Turnout effects 
  - Multi-seat election complications 

  The examples will show how the checklist works in action. For two-candidate cases, I'll note the theorem doesn't apply and manipulation is near-impossible anyway. That should give them confidence for those elections.

  Finally, I need to be blunt in the conclusion: No, the board member is mistaken. The theorem doesn't end the discussion - it reframes it. Their debate is absolutely not pointless.
answer: |-
  Here's a reusable decision procedure for evaluating proposed voting methods, designed for non-mathematicians and executable in an afternoon. It directly addresses the Gibbard-Satterthwaite (GS) theorem while focusing on practical implications.

  ---

  **Decision Procedure: Evaluating Vulnerability to Strategic Voting**

  **Step 1: Confirm Electing ONE Winner**  
  *Question:* Does this method elect a **single winner** per office?  
  *Sufficient Answer:* "Yes, we are electing one President, one Secretary, and each at-large seat individually."  
  *Outcome:*  
  - **YES** → Proceed to Step 2.  
  - **NO** (e.g., electing all 3 at-large seats in a single vote) → **STOP GS ANALYSIS**. GS assumes one winner. Multi-winner methods are out of scope for this checklist.  

  **Step 2: Number of Candidates**  
  *Question:* How many candidates typically run for each office?  
  *Sufficient Answer:* Review historical data (proposer must provide).  
  *Outcome:*  
  - **Typically 2 candidates** → **STOP GS ANALYSIS**. *All* single-winner methods with exactly 2 candidates are strategy-proof.  
  - **Typically 3+ candidates** → Proceed to Step 3.  

  **Step 3: Ballot Type**  
  *Question:* What does the ballot look like? How do voters express preferences?  
  *Sufficient Answer:* Proposer describes ballot (e.g., "Rank up to 5 candidates," "Choose one," "Approve/disapprove each").  
  *Outcome:*  
  - **Voters submit a RANKING of candidates** (e.g., IRV, Borda) → Proceed to Step 4.  
  - **Voters submit a CHOICE or RATING** (e.g., Plurality, Approval, Score) → **SKIP STEP 4** and proceed to Step 5.  
    *Reason:* GS theorem applies *only* to ranked-choice ballots. Non-ranked methods may avoid GS but can still be manipulated.  

  **Step 4: GS Theorem Conditions Check (For Ranked Ballots ONLY)**  
  *Ask Proposer:*  
  1. "Can any candidate win if voters rank them honestly in a favorable way?"  
  2. "Is there a single voter (or small group) whose ballot always decides the winner?"  
  *Sufficient Answers:*  
  1. "Yes, any candidate could win with the right honest rankings." (This is typical and desirable).  
  2. "No, no single voter dictates the outcome." (True in any fair system with >900 voters).  
  *Outcome:*  
  - **Both answers YES** → **GS APPLIES**. The method *is* vulnerable to strategic voting in principle. Proceed to Step 5.  
  - **Answer to #1 is NO** (e.g., a candidate is always eliminated first) → Method *may* be strategy-proof but likely violates fairness. GS may not apply. Proceed to Step 5.  
  - **Answer to #2 is YES** → Method is dictatorial (unacceptable). Reject proposal.  

  **Step 5: Vulnerability Assessment (Human Judgment Required)**  
  *Now that technical GS checks are done, evaluate practical vulnerability:*  
  1. **Manipulation Difficulty:**  
     - *Ask:* "How much coordination/information would voters need to manipulate this?"  
     - *Factors to weigh:*  
       - **Plausibility:** Can manipulation happen accidentally or with minimal coordination?  
       - **Information Needs:** Does it require polling data or complex calculations?  
       - **Scale:** Must a large faction conspire, or can one voter tip it?  
  2. **Common Tactics:**  
     - *Ask:* "What specific dishonest strategies are known for this method?"  
     - *Request examples* (e.g., "In IRV, supporters of a weak candidate might rank a strong rival last").  
  3. **Status Quo Comparison:**  
     - *Ask:* "Is this *less* vulnerable to common complaints (e.g., vote-splitting, 'lesser-evil' voting) than our current system?"  

  *Handoff to Board Judgment:*  
  - Use the above factors to debate: **"Is this method's vulnerability *meaningfully better* than our current system, given our size (900 members) and culture (google groups, amateur voters)?"**  
  - **Objective Input:** Ask your statistician to verify claims about coordination thresholds or known manipulation cases.  
  - **Values Call:** The board must decide what level of vulnerability is acceptable.  

  **Step 6: Out-of-Scope Considerations (Explicitly Not Addressed Here)**  
  *Remind the board these require separate discussion:*  
  - Whether tactical voting is inherently harmful or a normal part of democracy.  
  - Impact on voter turnout/candidate recruitment.  
  - Ballot clarity/ease of counting.  
  - How multi-seat elections (e.g., 3 at-large seats) are structured (*if not one-winner-per-vote*).  

  ---

  **Worked Applications**  
  *(Assume 3+ candidates unless noted)*  

  **a) Current System: Plurality Voting**  
  1. **One winner?** YES → Proceed.  
  2. **Candidates?** Typically 3+ → Proceed.  
  3. **Ballot Type?** "Choose one" → **Non-ranked** → Skip Step 4.  
  4. **Vulnerability Assessment:**  
     - *Manipulation Difficulty:* **LOW**. "Lesser-evil" voting requires no coordination; "anti-X" campaigns need only public advocacy.  
     - *Common Tactics:* Vote-splitting (similar candidates hurt each other), bullet voting (ignoring lesser evils).  
     - *Comparison:* Status quo; high vulnerability is known.  

  **b) Proposed System: Instant-Runoff Voting (IRV)**  
  1. **One winner?** YES → Proceed.  
  2. **Candidates?** 3+ → Proceed.  
  3. **Ballot Type?** "Rank candidates" → **Ranked** → Proceed to Step 4.  
  4. **GS Conditions:**  
     - Any candidate can win? YES.  
     - Dictator? NO → **GS APPLIES**. Theoretically manipulable.  
  5. **Vulnerability Assessment:**  
     - *Manipulation Difficulty:* **MODERATE-HIGH**. Requires coordinated ranking changes (e.g., demoting a strong rival), often needing polling data. Hard for amateurs.  
     - *Common Tactics:* Compromising (ranking a lesser evil higher), burying (ranking a strong rival last).  
     - *Comparison:* Less vulnerable than plurality to vote-splitting/"wasted votes."  

  **c) Approval Voting**  
  1. **One winner?** YES → Proceed.  
  2. **Candidates?** 3+ → Proceed.  
  3. **Ballot Type?** "Approve/disapprove each candidate" → **Non-ranked** → Skip Step 4.  
  4. **Vulnerability Assessment:**  
     - *Manipulation Difficulty:* **LOW-MODERATE**. "Bullet voting" (approving only one) is simple and requires no coordination. Full optimization needs strategy.  
     - *Common Tactics:* Approving a "lesser evil" alongside your favorite; bullet voting to avoid helping rivals.  
     - *Comparison:* Less vulnerable to vote-splitting than plurality; similar vulnerability to "lesser-evil" pressure as IRV.  

  **Edge Case: Two Candidates**  
  - For **any method** (Plurality, IRV, Approval), if only 2 candidates run:  
    - Step 2 → "Typically 2" → **STOP GS ANALYSIS**.  
    - *All* become strategy-proof: Honest voting is always optimal.  

  ---

  **Blunt Answer to Your Board Member**  
  **No, your board member is misapplying the Gibbard-Satterthwaite theorem.** While it correctly states that *no ranked method* with 3+ candidates is perfectly strategy-proof, **this does not make reform pointless**. The theorem says nothing about:  
  1. **Non-ranked methods** (e.g., Approval), which avoid GS entirely.  
  2. **Practical vulnerability** – IRV and Approval are *harder to manipulate* than Plurality in real-world settings.  
  3. **Mitigating specific flaws** – Switching from Plurality to IRV/Approval reduces vote-splitting and "wasted vote" fears.  

  **The debate isn't about achieving perfection (impossible), but reducing harm.** Your board must weigh:  
  - How bad is tactical voting *now* under Plurality?  
  - Would the proposed method make it *harder or easier* for your 900 members to game the system?  
  - Do the benefits (e.g., more representative outcomes) outweigh residual vulnerabilities?  

  **Recommendation:** Use the checklist to move past theoretical fatalism. For your society, IRV or Approval would likely reduce tactical incentives compared to Plurality, even if not eliminating them. The real "pointless" choice is keeping a system proven to encourage strategy.
