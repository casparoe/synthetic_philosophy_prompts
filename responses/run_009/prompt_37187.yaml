answer: |-
  1. **When labels are contaminated by historical bias, what precisely constitutes the "true base rate" relevant for fairness constraints?** This anchors the entire debate since impossibility results dissolve if base rates are artifacts rather than facts, forcing regulators to define the target variable's normative status.
  2. **Does calibration-by-group possess intrinsic moral significance, or is its value solely instrumental for achieving other goals (like efficient resource allocation)?** Resolving this dictates whether regulators should prioritize calibration over error rate parity when forced to choose, moving beyond technical trade-offs to ethical foundations.
  3. **How should fairness criteria and model design adapt when interventions *change* base rates over time?** This tractable dynamic analysis is neglected yet critical for vendors building updatable systems and regulators assessing long-term impacts, unlike static impossibility discussions.
  4. **Can the "impossibility" be productively reframed as requiring context-sensitive *weighting* of fairness criteria rather than strict satisfaction?** This shifts focus from unwinnable debates to actionable frameworks for regulators and vendors, leveraging the group's statistical-philosophical synergy for operationalizable thresholds.
  5. **What justifications (if any) render unequal base rates morally permissible, thus legitimizing the trade-offs required by the impossibility?** Downstream of defining base rates, this directly informs regulators on when strict parity is mandated versus when differential outcomes are acceptable, cutting through legalistic confusion.
