  Second scenario: Choosing between 11% chance for $2,000 versus 10% chance for $12,000 (both with nothing otherwise). Here the user chose the riskier $12,000 option because neither felt like guaranteed money, and the 1% probability difference seemed negligible while the potential reward was much higher.

