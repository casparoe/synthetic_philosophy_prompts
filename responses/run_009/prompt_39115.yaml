answer: |-
  Your choices aren't "irrational" in a practical sense—they reflect how humans *actually* make decisions under risk, which differs from how classical economic models *assume* we *should*. Your friend is correct that your choices violate **expected utility theory (EUT)**, the standard model of rational choice. However, behavioral economics (her field) exists *because* EUT often fails to describe real behavior. Here's a breakdown separating settled arithmetic from debated interpretation:

  ### 1. **The Arithmetic: Where Everyone Agrees**
  - **First Choice:**  
    - Sure Thing: $2,000 (100%)  
    - Gamble: 89% chance of $2,000 + 10% chance of $12,000 + 1% chance of $0  
    *Expected Value (EV): (0.89 × $2,000) + (0.10 × $12,000) = $1,780 + $1,200 = $2,980*  
    **→ The gamble has a higher EV ($2,980 vs. $2,000).**

  - **Second Choice:**  
    - Gamble A: 11% chance of $2,000 (89% nothing)  
    *EV: 0.11 × $2,000 = $220*  
    - Gamble B: 10% chance of $12,000 (90% nothing)  
    *EV: 0.10 × $12,000 = $1,200*  
    **→ Gamble B has a higher EV ($1,200 vs. $220).**

  - **The "Contradiction" Claim**:  
    Your friend argues that the first choice reduces to the second if you "cancel" the common 89% chance of $2,000:  
    - **Sure Thing (First Choice)** = 100% $2,000 → *If you subtract 89% $2,000, you get 11% $2,000 + 89% $0*  
    - **Gamble (First Choice)** = 89% $2,000 + 10% $12,000 + 1% $0 → *Subtract 89% $2,000, you get 10% $12,000 + 1% $0*  
    → What's "left" is **11% $2,000 vs. 10% $12,000 + 1% $0** — nearly identical to your second choice (11% $2,000 vs. 10% $12,000).  
    **Classical EUT says: Preferring the sure $2,000 (over the gamble) in Round 1 but Gamble B (over A) in Round 2 is inconsistent.**

  ### 2. **The Behavioral Reality: Why Your Choices Make Psychological Sense**
  Your friend is correct that EUT *requires* consistency here, but humans don't follow EUT. Your reasoning aligns with **Prospect Theory** (Kahneman & Tversky), which explains *why* the choices felt different:
  - **Framing & Reference Dependence**:  
    - In Round 1, the sure $2,000 felt like a *reference point* ("money already yours"). Losing it (even with 1% probability) triggers **loss aversion** (losses hurt ~2x more than equivalent gains feel good).  
    - In Round 2, both options were framed as *gains from nothing*. With no reference point to lose, you became **risk-seeking** for a large gain (the $12,000), especially since 11% vs. 10% felt negligible.  
    → This shift from loss-averse to risk-seeking behavior violates EUT but is empirically normal.

  - **Probability Weighting**:  
    Humans overweight small probabilities (e.g., 1% chance of $0 in Round 1 felt scarier than it "should"). Conversely, 10% and 11% are often underweighted ("barely different"), making the $12,000 more appealing in Round 2.

  ### 3. **Was It Irrational? The Debate**
  - **The Classical View (EUT)**:  
    Yes, it's irrational. EUT assumes preferences depend *only* on final outcomes and probabilities, not framing. Canceling shared components *must* preserve rankings. Your choices violate the **independence axiom** of EUT.  
    → *Under EUT, you should either:*  
      - Always take the gamble with higher EV (take the gamble in Round 1, Gamble B in Round 2), *or*  
      - Always prefer safety (take sure $2,000 in Round 1, Gamble A in Round 2 if you value $2,000 highly).  

  - **The Behavioral View**:  
    No, it's *descriptively rational*. Prospect Theory and similar models accept that framing matters. Your choices reflect how humans *actually* weigh risks when outcomes are emotionally salient (e.g., rent or debt). Behavioral economists argue that models must account for this to predict real choices.  
    → **Consensus**: *Your choices are inconsistent with EUT but consistent with robust empirical patterns in human psychology.*  

  ### 4. **Which Answer "Should" You Change?**
  - If you value theoretical consistency (per EUT), **change your Round 1 choice to the gamble**. Its EV is $980 higher, and the 1% risk of $0 is small.  
  - If you value real-world needs (rent security), **stick with your Round 1 choice**. Loss aversion is adaptive when failure is catastrophic (e.g., eviction).  
  - For Round 2, **Gamble B is defensible under any model**—it has far higher EV ($1,200 vs. $220) and similar risk.  

  ### 5. **How to Approach the Real-Money Version**
  - **Choose based on your actual needs/feelings**, not theoretical consistency. If $2,000 guarantees rent, take it. If both options are "bonus money," go for the higher upside.  
  - **Point out the framing effect**: Tell your friend, "In Round 1, $2,000 felt like a loss to risk. In Round 2, it felt like a gain to chase. Prospect Theory explains this—it's why your field exists!"  

  ### Bottom Line:
  - **Settled Arithmetic**: Your choices *are* mathematically inconsistent under EUT due to the shared component argument.  
  - **Settled Behavioral Science**: Humans *routinely* make such "inconsistent" choices due to framing. Prospect Theory formalizes this and is Nobel Prize-winning work.  
  - **Your Rationality**: You were *ecologically rational*—your choices reflected your context (job loss, debt). Under behavioral models, both picks make perfect sense.  
  - **Real-Money Advice**: Prioritize your immediate needs. If $2,000 secures essentials, take it. If not, optimize for EV.  

  Your friend is technically right about EUT but misses the point of her own field: human choices aren't EUT-consistent, and that's why we need behavioral economics. For deeper reading, suggest Kahneman & Tversky's 1979 paper or *Thinking, Fast and Slow*.
