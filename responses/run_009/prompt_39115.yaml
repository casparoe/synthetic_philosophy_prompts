  But the subtraction leaves us with 11% $2000 vs 10% $12000 + 1% $0, which is NOT identical to the second choice pair (11% $2000 vs 10% $12000). There's that pesky 1% chance of nothing in the modified gamble option. 

  This is important - the equivalence isn't perfect because of that 1% difference. However, in expected value terms, 10% $12000 + 1% $0 is very close to 10% $12000 since the 1% $0 has minimal impact. But strictly speaking, the friend's argument has a small flaw here.

