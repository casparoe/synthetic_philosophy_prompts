  ## THE SEA BATTLE MUTUAL ASSURANCE SOCIETY  
  *Underwriting Manual Supplement: Form SB-9 (Temporal Indemnity)*

  **Preamble:** Founded 1723 by syndicates convinced of the actuarial necessity of temporal invariance. Our esteemed founding actuaries determined that the obligation to pay premiums, and the correlative obligation to settle claims, exist in a state of perfect determination from the inception of the insured venture. Subsequent events merely reveal this pre-existing financial reality. The Society operates accordingly.

  ### POLICY TERMS & CONDITIONS

  1.  **BIVALENCE OF CLAIM STATUS:**  
      The status of any claim asserted under this Policy ("Payable" or "Not Payable") is, and has always been, definitively fixed. Loss Adjusters dispatched by the Society undertake a process of ceremonial verification only, confirming the status inherent to the claim from eternity. Their reports possess declarative, not constitutive, force.

  2.  **INTERIM STATUS RIDER (OPTIONAL):**  
      Policyholders subscribing to this Rider acknowledge that the status of a claim arising from a future, contingent maritime engagement may enter a state of Interim Determination. During this period, commencing upon the filing of intent to claim and terminating only upon the unambiguous resolution of the contingent event, the Society shall:
      *   Refrain from declaring the claim "Payable" or "Not Payable."
      *   Suspend all payment processing.
      *   Engage the claimant in detailed, ongoing correspondence regarding hypothetical scenarios, logistical minutiae, and the ontological prerequisites for definitive settlement. No other action shall be taken.

  3.  **EXCLUSIVE REALITY ENDORSEMENT:**  
      Where the insured vessel's itinerary details multiple potential future engagements, only one such described future sequence is designated the "Actual Scheduled Engagement" (ASE) for underwriting purposes. All other described sequences are "Illustrative Scenarios Only" (ISO). Liability under this Policy attaches *solely* to losses arising directly from the ASE. The designation of the ASE is inherent and singular, though discernible only post-event to the prudent policyholder. Premiums are calculated solely on the ASE.

  4.  **BRANCHING PREMIUM SCHEDULE (Open Voyage Cover):**  
      For risks where the future engagement possesses inherent unresolved contingency, the premium shall be calculated and collected *provisionally* across all materially possible candidate futures (CFs) identifiable at policy inception. The initial premium equals the sum of the premium calculated for each CF.
      *   Installments are payable per distinct CF.
      *   Upon the Provisional Actualization (PA) of one CF (rendering all others void for indemnity purposes), premiums paid for non-actualized CFs shall be rebated *pro-rata*, minus a 15% Administration Fee reflecting the cost of maintaining provisional accounting branches.
      *   Liability is limited to the actualized CF.

  5.  **DISPUTES & ARBITRATION:**  
      Any dispute regarding claim status under Clauses 1, 2, 3, or 4 must be referred to the Society's appointed Temporal Arbiter. The Arbiter's sole mandate is to determine whether the financial truth pertaining to the claim event supervenes entirely upon the state of maritime and meteorological facts obtaining at the time the dispute is lodged. The Arbiter's finding on this point is final and materially settles the dispute.

  6.  **ACKNOWLEDGEMENT OF TEMPORAL INERTIA:**  
      The Underwriting Members freely acknowledge that all obligations arising under this Policy, including the payment of claims and premiums, were immutably fixed prior to the Society's incorporation, the signing of this Policy, and indeed the launching of any insured vessel. Consequently, the operational activities of the Society (premium collection, claims adjustment, correspondence) possess no causal efficacy regarding the ultimate settlement. Nevertheless, the Members, for reasons of tradition and completeness, hereby unanimously vote to renew the Society's charter in perpetuity.

