answer: |-
  Alright, I hear your frustration. Been there with philosophical scraps. Forget the "survey" approach – here's my committed defense of the deflationist position against Maya's normativity challenge. I think her dilemma is a false one and she's underestimating how norms can emerge *from* practice without needing heavy metaphysical baggage attached to the concept itself.

  Maya's core claim is that for "Believe what is true!" to be a *real* norm, "true" must pick out some substantive, valuable property that *explains why* we should care about it. She thinks deflationism, by making truth "thin," robs this norm of its force, leaving either a substantive truth property (which deflationism denies) or a meaningless command. But this assumes norms *always* need a deeper "why" baked into the concept they employ. That's where I push back hard.

  The deflationist move isn't to "deflate the norm itself" into a bare command. It's to locate the normativity *elsewhere* – specifically, in the very nature of belief and assertion, *using* the truth-concept as the indispensable tool to express it. Here's how:

  1.  **Belief Aims at Truth Constitutively:** What is belief *for*? What makes a mental state a *belief* rather than a hope, fear, or whim? Deflationists argue that aiming at truth is *constitutive* of belief. To hold that "S believes that p" is *just* to hold that S is in a state that purports to represent how the world actually is. Getting it wrong (false belief) isn't just undesirable; it's a *failure* of that very state to fulfill its defining function. Think of a map: its constitutive aim is to accurately represent territory. A wrong map fails *as a map*. Similarly, a false belief fails *as a belief*. The norm "Believe truths!" isn't an external command slapped onto belief; it's built into what belief *is*. Truth is the standard by which beliefs succeed or fail *as beliefs*.

  2.  **Assertion's Essential Rule:** This connects directly to assertion. Why can we criticize someone for asserting something false? Because assertion isn't just making noise; it's a social practice governed by constitutive rules. A core rule is: "Assert p only if you believe p, and only if p is true." When you assert "p," you present p *as true*. If p is false, you've violated the essential commitment of the act of asserting. Deflationism happily uses the truth-predicate (*"p is true"*) to formulate this rule – that's its *job*! But the normativity arises from the *practice* of assertion and its inherent commitments, not from truth being some mystical property. Criticizing someone for asserting a falsehood is criticizing them for breaking the rules of the game they're playing by asserting.

  3.  **The Practical Payoff (Even if Derivative):** Beyond the constitutive level, there's the obvious instrumental reason: believing truths generally leads to successful action, while believing falsehoods usually leads to failure. Maya might say, "Aha! *That's* the substantive value!" But the deflationist can say this pragmatic value *presupposes* the constitutive norm. Why does believing a falsehood about the bus schedule lead to missing the bus? Because the belief failed in its job of accurately representing the world, which is what we *rely* on it to do for action. The instrumental value rests on the constitutive function. Truth being the norm isn't explained *by* the instrumental value alone; the instrumental value works *because* truth is the constitutive standard.

  **Where Maya Might Press (The Weak Spot):**

  The toughest pushback comes when Maya asks: "Okay, but *why* should I care about having mental states that fulfill their 'constitutive function'? Why care about playing the 'assertion game' by its rules? Isn't *that* where the real normativity needs justification?"

  This is the weak point. A hardcore deflationist might bite the bullet: "If you don't care about representing the world accurately or communicating reliably, then *for you*, the 'Believe truths!' norm *lacks* force. But that says more about your disengagement from core cognitive and social practices than it does about truth itself." It highlights that the normativity is *internal* to the practices of believing and asserting. For someone embedded in those practices (which we pretty much all are), the norm has teeth. For someone utterly rejecting those practices... well, philosophical arguments might be the least of their worries. The force isn't *metaphysical* (from Truth with a capital T), it's *pragmatic* and *constitutive* (from what we *do* when we believe and assert).

  **Bottom Line:**

  Deflationism doesn't make truth-norms toothless. It explains their teeth by anchoring them in the essential nature of belief and assertion. "Truth" is the indispensable concept we use to express the standard inherent in these practices. Maya demands normativity spring *from* the concept of truth. Deflationism locates it in the *use* of that concept within our fundamental cognitive and linguistic activities. Her dilemma fails because it ignores how powerful norms can arise constitutively from practices, needing no extra metaphysical juice. You were on the right track with the assertion angle – push that, hard, and bring it back to belief's core function. Good luck Friday!

