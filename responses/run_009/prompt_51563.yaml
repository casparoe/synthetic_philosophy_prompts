prompt: |-
  So I moderate a mid-sized gaming Discord, about 4000 members, and me and three other volunteer mods keep running into the same fight: someone posts something gross, and when we warn them, they reply "I didn't say anything bad, I was just quoting / joking / asking a question / describing what someone ELSE did." And honestly sometimes they're right and we're just being twitchy, and sometimes they're clearly weaseling, and none of us can articulate the difference.

  Here's the thing I've been chewing on with zero philosophy background so bear with me. I've noticed that some sentences don't just report stuff, they actually DO stuff. When I type "you're muted for 24 hours" in the mod channel, that's not me describing a mute that already happened somewhere, the typing IS the muting. Same with "I'm sorry" vs "he's sorry" — the first one is me doing an apology, the second one is just a fact about his feelings. So it seems like every post has two sides: what it says, and what it DOES. And our rules are all written about the saying side ("no slurs," "no threats") but the actual harm seems to live on the doing side, because the same words can do totally different things depending on who types them, to whom, in what situation. Like "you should log off before I make you" from some random member is a threat, but "you should log off" from me in a "you're clearly tilted, go to bed" context is... not? And there's the whole thing where it only "works" if the other person takes it that way — like if nobody believes I have the authority to mute, my mute command is just words.

  What I want is a procedure the mod team can actually run, because right now it's vibes and we're inconsistent enough that people accuse us of favoritism and honestly sometimes they're right. So please build me:

  1. A checklist or ordered set of questions a mod can go through in the 2-3 minutes they have when they see a report, based on whatever the actual philosophy of this stuff says (I gather people have thought hard about "words that do things" — I've seen the phrase "speech acts" and "performative" floating around but I couldn't tell you who coined what, and I don't want to misattribute anything, so just tell me if some idea has a standard name I should be aware of). Which distinctions absolutely have to survive into a 3-minute version, which fancy ones can we drop?

  2. It needs to handle our hard cases at minimum: sarcasm that reads as aggression ("wow, great play, really brilliant stuff"), people quoting rule-breaking content to complain about it or to mock it, "someone should do something about that guy" (is that an order? a wish? a threat by proxy?), and the joke-commands like "*I hereby banish thee to the shadow realm*" which everyone knows isn't real.

  3. It has to say where the procedure just can't decide and we have to make an actual judgment call as a team, and how to be honest about that when people appeal our decisions. We get maybe 15-20 reports a day, mods are unpaid, sometimes it's one person online at 3am making the call alone.

  4. Then run it on three cases and show the work: (a) a member posts "if I ever see [specific person] at a con I'm going to say some things to his face" — vague, but the target is a smaller streamer in our server; (b) someone posts "asking for a friend: hypothetically what's the ban evasion policy wink wink"; and (c) one of MY fellow mods, who I recruited personally and consider a friend, replied to a newbie's bad take with "mods, remove this garbage" which the newbie took as an official warning from staff even though the mod has no removal powers.

  Also tell me what this procedure will get wrong — where it'll misfire on our weird population (a lot of neurodivergent members who mean things extremely literally, a lot of members whose first language isn't English). And keep in mind we can't see tone of voice, just text and emotes.

  Please write the whole answer in American English. I'd rather have something my co-mods will actually print out and pin than something philosophically airtight, but I also don't want us building a system that sounds official and is really just our vibes wearing a lab coat — call out wherever the procedure is a judgment call dressed up as a step.
reasoning: |-
  Okay, let's tackle this mod's problem. They run a gaming Discord with 4000 members and four volunteer mods. The main issue is handling rule-breaking content where users defend themselves by claiming they were quoting, joking, asking, etc. The mods struggle to differentiate between genuine cases and weaseling. 

  The user mentioned speech acts and performative language but isn't familiar with the philosophy. I recall J.L. Austin's "How to Do Things with Words" where he introduces speech acts. The key idea is that utterances can perform actions (like apologizing or warning) beyond just stating facts. This seems relevant here. The mods' rules focus on the content ("no slurs"), but the harm comes from the action the speech performs (e.g., threatening).

  The user needs a practical checklist for mods to use in 2-3 minutes. It must handle sarcasm, quotes, ambiguous statements (like "someone should do something"), and joke commands. Also, they need clarity on when a judgment call is necessary and how to handle appeals. Plus, considering neurodivergent members and non-native English speakers.

  First, I'll outline the core principles from speech act theory that are essential. The locution (what is said), illocution (what is being done), and perlocution (the effect). For a quick checklist, focusing on illocutionary force is key. Contextual factors like speaker role, audience, and channel norms matter a lot. 

  For the checklist, steps could include identifying the explicit content, the intent (if discernible), the speaker's role, the audience, the context, and the likely effect. Then assess if it violates rules based on the action performed. 

  Handling hard cases: sarcasm relies on tone indicators or context; quoting needs clear disclaimers; ambiguous statements depend on context and history; joke commands should be obvious to the community. 

  The procedure must flag when context is too ambiguous, requiring team review. Transparency in appeals is crucial—explaining which factors led to the decision. 

  Testing the checklist on the provided examples: 
  (a) The threat to a streamer: context shows it's vague but targeted, likely a threat. 
  (b) "Asking for a friend" about ban evasion: contextual cues suggest probing for loopholes. 
  (c) A mod friend saying "remove this garbage": the mod's role blurs lines, causing misunderstanding, necessitating a team discussion. 

  Potential pitfalls: Neurodivergent members might not pick up on sarcasm or implied meanings. Non-native speakers could miss nuances. The checklist might misinterpret literal statements or cultural contexts. Emphasizing clear disclaimers and considering user history can mitigate some issues. 

  The mods need to accept that some ambiguity remains, and the checklist is a tool, not a perfect solution. They should document decisions and be transparent about judgment calls, especially in appeals.
answer: |-
  Here’s a practical, philosophy-rooted procedure for your mod team—based on **speech act theory** (J.L. Austin’s "How to Do Things with Words")—designed for speed, consistency, and transparency. It focuses on **what the words DO** (their *illocutionary force*) over just *what they say*.  

  ---

  ### **The 3-Minute Mod Checklist: "SAID vs. DONE"**  
  **Core Principle:** Words aren’t just facts—they’re **actions** (apologies, threats, jokes, commands). Harm lives in the *action* performed, not just the literal text.  

  #### **Step 1: What’s the LITERAL CONTENT?** (10 sec)  
  - *Check:* Does it **explicitly** break a written rule? (e.g., slur, direct threat, doxxing).  
  - *If YES → Violation. Act.*  
  - *If NO → Move to Step 2.*  
  - *Why?* Catches clear-cut cases fast.  

  #### **Step 2: What’s the SPEECH ACT?** (What is it **DOING**?) (60 sec)  
  **Key questions:**  
  - **Who is speaking?** (Mod? Regular member? Known troll?)  
  - **Who is it directed at?** (Specific person? Group?)  
  - **Context:** What’s the convo *about*? Is it a debate, shitposting, support channel?  
  - **Format:** Is it a quote (with “>” or “/s”)? A joke (“lol”/emojis)? A “hypothetical”?  
  - **Likely effect:** Would a reasonable person feel attacked, threatened, or harassed?  
  - *Use this cheat sheet:*  

  | **If it looks like...**       | **It’s probably DOING...**          | **Violation?**                               |  
  |-------------------------------|-------------------------------------|----------------------------------------------|  
  | "Kill yourself"               | Threatening/harassing               | YES                                          |  
  | "> Kill yourself" (with context critiquing it) | Reporting/condemning                | NO (if clearly framed)                       |  
  | "Wow, you’re SO smart" (in argument) | Mocking (illocution: insult)        | **Likely YES** (context-dependent)           |  
  | "*I banish thee!*" + 😂        | Joking (illocution: play-acting)    | NO                                           |  
  | "Someone should punch that guy" | Inciting violence (even if "hypothetical") | **Likely YES**                               |  
  | "Mods, delete this trash"     | Commanding (illocution: request)    | **YES if non-mod; NO if mod** (see Step 3)   |  

  #### **Step 3: Does CONTEXT ERASE HARM?** (30 sec)  
  Even if it *looks* harmful, does context flip the action? **Only 3 escapes:**  
  1. **Unambiguous satire/joke:** Clear tone indicators (/s, 😂, "this is a joke"), *and* no history of targeting.  
  2. **Critique/quoting:** Framed as *opposing* the bad content (e.g., "Look at this toxic DM: [screenshot]—report?").  
  3. **Role/relationship:** Speaker has **zero power** (e.g., a member “joking” about muting has no mod rights).  
  - *If context ERASES harm → NO violation.*  
  - *If context AMPLIFIES harm → Violation.*  

  #### **Step 4: Is it AMBIGUOUS?** (20 sec)  
  **Red flags for "judgment call needed":**  
  - No tone indicators, but plausible deniability ("just asking!").  
  - High-stakes situation (targets a vulnerable member, involves IRL safety).  
  - Borderline sarcasm/aggression.  
  - *If ambiguous → PUNT to team chat. DO NOT act alone.*  

  #### **Step 5: ACTION & RECORD** (60 sec)  
  - **Violation?** Apply standard sanction (warning/mute/ban).  
  - **Ambiguous?** Flag in #mod-chat for group review.  
  - **No violation?** Dismiss report *with reason* (e.g., "Context: clear joke").  
  - **ALWAYS document:**  
    ```  
    [Timestamp] User X post: "[quote]".  
    Ruling: [Violation/No violation].  
    Why: [Speech act + context]. e.g., "Illocution: threat. Context: targeted at streamer, no satire cues."  
    ```  

  --- 

  ### **Handling Your Hard Cases**  
  1. **Sarcasm/aggression** ("Wow, great play, really brilliant stuff"):  
     - *Step 2:* Likely DOING mockery (illocution: insult).  
     - *Step 3:* Harm erased? Only if clear /s or 😜. Otherwise → Violation (hostility).  

  2. **Quoting rule-breakers**:  
     - *Step 2:* Is it DOING reporting? (e.g., "Can you believe this? > [slur]"). → NO violation.  
     - *Step 3:* If no critique framing (e.g., just "> [slur]"), it’s amplifying harm → Violation.  

  3. **"Someone should do something"**:  
     - *Step 2:* DOING incitement (illocution: provocation). Context rarely erases harm → Violation.  

  4. **Joke-commands** ("*I banish thee*"):  
     - *Step 2:* DOING play-acting (illocution: joke).  
     - *Step 3:* Harm erased by format/emotes? Almost always YES → NO violation.  

  --- 

  ### **Test Runs on Your Cases**  
  **Case (a):** *"If I ever see [streamer] at a con I’m going to say some things to his face."*  
  - Step 1: No explicit threat → Proceed.  
  - Step 2:  
    - Speaker: Regular member.  
    - Target: Specific, smaller streamer (vulnerable?).  
    - Doing: Vague threat ("say some things" implies aggression). Illocution: intimidation.  
    - Effect: Likely to cause anxiety.  
  - Step 3: No satire cues, not a quote → Harm NOT erased.  
  - Step 4: Unambiguous → Violation (threat).  
  - **Action:** 24hr mute + warning.  

  **Case (b):** *"Asking for a friend: hypothetically what’s the ban evasion policy wink wink"*  
  - Step 1: No explicit rule-break → Proceed.  
  - Step 2:  
    - Speaker: Likely banned member/suspicious account.  
    - Doing: Probing for loopholes (illocution: evasion test).  
    - Effect: Undermines rules.  
  - Step 3: "Wink wink" = satire? NO—context suggests malice. Harm amplified.  
  - Step 4: Unambiguous → Violation (circumvention).  
  - **Action:** Ban (evasion intent).  

  **Case (c):** *Mod-friend posts "mods, remove this garbage" re: newbie’s take.*  
  - Step 1: No slur/threat → Proceed.  
  - Step 2:  
    - Speaker: **Mod** (but no removal power).  
    - Target: Newbie.  
    - Doing: Public shaming + pseudo-command (illocution: humiliation).  
    - Effect: Newbie felt officially warned → Harm confirmed.  
  - Step 3: Role blurs lines—member sees mod badge, assumes authority. Harm NOT erased.  
  - Step 4: Ambiguous (mod intent vs. impact) → **PUNT TO TEAM CHAT**.  
  - **Team Resolution:**  
    - Violation (unprofessional conduct). Mod-friend gets warning + coaching: *"Use mod channels for reports. Public shaming harms trust."*  
    - Apologize to newbie: *"Not an official action. We’ve addressed this with the mod."*  

  --- 

  ### **Where This Gets It Wrong**  
  1. **Neurodivergent/Literal Speakers:**  
     - May miss sarcasm cues or use deadpan humor read as hostile.  
     - *Mitigation:* Assume good faith first. DM user: *"Hey, this read as aggressive—intent?"*  

  2. **Non-Native English Speakers:**  
     - Could misuse tone indicators or cultural context (e.g., "wink wink" sincere in some cultures).  
     - *Mitigation:* Escalate ambiguous cases; never assume malice.  

  3. **"Vibes" Gaps:**  
     - Inside jokes or niche memes may look like attacks.  
     - *Mitigation:* **Ask the community.** In appeals: *"We ruled this a threat because [speech act + context]. If we missed nuance, appeal here."*  

  4. **Power Blindspots:**  
     - Mods might excuse allies ("just joking!") → **Documented rationales prevent this.**  

  --- 

  ### **Final Notes**  
  - **Print this and pin it in #mod-private.** Train with mock reports.  
  - **When appeals happen:** Show your work. *"We banned because the speech act was incitement, not satire. Context: targeted, no /s."*  
  - **This ISN’T perfect:** It flags 80% of cases cleanly. The 20% ambiguous ones? **That’s why humans mod.** Admit: *"This was borderline; we made a call. We’ll note your perspective."*  
  - **Lab coat vs. vibes:** Steps 2-3 are judgment calls—but structured, documented ones. That’s professionalism, not vibes.  

  This turns "words that do things" into a weapon against weaseling—while protecting good-faith users. Run it for a week, then refine. You got this.
