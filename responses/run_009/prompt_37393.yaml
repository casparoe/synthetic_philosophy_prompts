answer: |-
  Here are the five numbered points:

  1.  **The paradox can still fire within a restricted fragment** if that fragment is closed under certain logical operations, specifically conjunction and propositional quantification (or allows the formation of propositions like "p ∧ ¬Kp" where p is in the fragment).
  2.  **Crucially, the fragment must be closed under conjunction** so that if a proposition p is in the fragment and unknown (¬Kp), the conjunction "p ∧ ¬Kp" (which is also a truth) can be formed within the fragment and subjected to the knowability principle, leading to contradiction.
  3.  **Restricting knowability to a fragment is not a full rescue for anti-realism** because it explicitly concedes that truths *outside* the fragment are verification-transcendent, abandoning the core anti-realist claim that *all* truth is knowable.
  4.  **Some argue the factivity of knowledge (Kp → p) is key to the paradox**: Without factivity, knowing that p ∧ ¬Kp wouldn't entail the contradiction ¬Kp ∧ Kp, as knowing something wouldn't guarantee its truth, potentially blocking the derivation.
  5.  **For the fragment to avoid the paradox**, it must *not* be closed under forming conjunctions like "p ∧ ¬Kp" for unknown truths p within it (e.g., mental states might lack this closure if "¬Kp" isn't considered part of the mental fragment).
