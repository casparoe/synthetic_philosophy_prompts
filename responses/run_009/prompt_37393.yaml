prompt: |-
  hey, so I'm taking a phil of language course and we just did Fitch's paradox of knowability. The vanilla version I get: if every truth is knowable, and there's at least one truth nobody actually knows, you can derive that there's a truth that's not knowable at all, so the verificationist principle kind of eats itself. Fine. But this week my professor floated a twist I cant get my head around, and I think it'll be on the take-home exam. Suppose you don't claim every truth is knowable — only every truth in some restricted fragment of the language. Say just the arithmetical truths, or just truths about your own current mental states. Does the paradox still fire inside the fragment? And what exactly does a fragment need to contain for the argument to run — is it enough that it's closed under conjunction, so you can conjoin something that's known with something that's unknown? A related question she raised: is restricting the anti-realist to a fragment even a rescue, or is it just conceding that there are verification-transcendent truths while renaming the position? She also mentioned offhand that some people blame the factivity of knowledge rather than the way knowability interacts with conjunction, but I honestly couldnt follow that part.

  Please explain all this as a numbered list of exactly five items, each item a sentence or two. No intro or conclusion, just the five numbered points. Order them however makes them easiest to follow.
