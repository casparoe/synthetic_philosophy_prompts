            - Record the net for each team after both scenarios.

          ### 2. Free-Choice Run
            - The same two scenarios are run again, but this time, the teams decide what to do at the time.
            - For each team, the facilitator uses the same advance preparations (coin toss for A, prediction for B) but the prediction for B must be based on what the team would actually do in the free run. But how to base the prediction on their free choice if it's in the future? 
            - This is a problem because the prediction must be made in advance.

          How to resolve? For the free run, we cannot use the same prediction because the prediction should be about the free choice. So we need to make new predictions for the free run in advance? But then we have to trust that the facilitator can predict.

