                 - With information, they choose safe and get $0.
              - Outcomes:
                 - Policy: Pay
                   - Prediction is Pay -> letter sent.
                   - They pay $1 and then get $0 in the future problem -> net -$1.
                 - Policy: Don't Pay
                   - Prediction is Don't Pay -> letter not sent.
                   - They do nothing -> net $0.

          Then in the policy run, teams choose policies for both scenarios.

          In the free run, teams face the same scenarios but decide in the moment without commitment.

          For the free run of CM, they don't know the coin toss, so they might choose to pay because of the positive expected value ($0.5).

          For the free run of XB, if they receive the letter, they will choose to pay to avoid the expected loss of $1.5, netting -$1. If they don't receive the letter, they do nothing and get $0. But note: they only receive the letter if Omega predicted they would pay. And in the free run, if they are going to pay, then the prediction would have been pay, so they receive the letter. Therefore, teams that would pay in the free run receive the letter and get -$1. Teams that would not pay in the free run do not receive the letter and get $0.

