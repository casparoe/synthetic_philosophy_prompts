            With information, you get the $20: so $20.
          Then the information is worth $18? That's too much.

          We want the saving to be $2, so let one box contain $2, the others $0. Without information, expected value $0.2. With information, you get $2. So the information is worth $1.8.

          This is messy.

          Let's redefine the saving as the expected gain. Then the letter can say: "this information will give you an expected gain of $2". And then in the future problem, we design it so that the information provides an expected $2 gain over the baseline without information.

          But then without information, what is the baseline? We can set without information, you get $0. With information, you get $2. Then the gain is $2.

          How to achieve that? We can have a problem where you have to allocate resources and without information you make a suboptimal choice that yields $0, but with information you make the optimal choice that yields $2.

          Given time constraints, I propose we fake the saving by having the facilitator hand out $2 to those who paid when they face the future problem. But then the correlation is fake.

          Instead, let's make the future problem very simple: after the blackmail decision, the facilitator asks a trivia question that the player has a 50% chance of answering correctly. If correct, they win $4; if not, $0. But if they paid the blackmail, they are given the answer. So they get $4 for sure.

