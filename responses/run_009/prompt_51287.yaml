answer: |-
  Below is a complete design for your in-class activity, optimized for 90 minutes with 12 participants, real but tiny stakes, and a focus on experiential learning of Counterfactual Mugging (CM) and XOR Blackmail (XB) without naming them. The core innovation is a **Policy Auction** forcing teams to commit to binding policies upfront, followed by a **Free-Choice Round** where decisions are made in the moment. Crucially, both scenarios share an identical prediction mechanic to highlight the difference in logical linkage.

  ---

  ### **Materials & Prep (Night Before)**
  1. **Envelopes & Prediction Sheets**:
     - 12 prediction sheets (6 for Policy Run, 6 for Free Run). For each:
       - **CM Prediction**: _"Team [X] will choose to [Pay/Refuse] in Scenario 1."_
       - **XB Prediction**: _"Team [X] will choose to [Pay/Refuse] in Scenario 2."_
     - 12 sealed envelopes (6 per run, labeled by team/scenario). 
     - **Neutral Student Role**: Choose 1 student to sign envelopes pre-session (they don’t play). Facilitator writes predictions secretly, student signs/seals without seeing contents.

  2. **Game Funds**:
     - **Team Endowment**: $1/player → $4/team (4 teams of 3). 
     - **Slush Fund**: $20 (covers payouts). Use poker chips or printed bills.

  3. **Scenario Cards** (print):
     - **Scenario 1 (CM)**:  
       *"Omega claims it predicted your choice. If it predicted PAY, it placed $3 in an envelope for you. If it predicted REFUSE, it placed $0. You now choose: PAY $1 to receive the envelope, or REFUSE and get nothing."*
     - **Scenario 2 (XB)**:  
       *"You receive a letter from Omega. It states: 'I only sent this if I predicted you’d PAY. If you PAY $1, I will give you a clue worth $2 in a later test. If you REFUSE, you get nothing and no clue.' Choose: PAY $1 for the clue, or REFUSE."*
     - **Test (for XB)**:  
       *"Which box has $2? Box A or B? (Without the clue, guess blindly. With the clue, you’ll know the answer.)"*  
       *(Clue = pre-written solution, e.g., "Box A has $2")*.

  4. **Policy Auction Sheet** (whiteboard or poster):  
     | Policy Bundle | Team Bid |  
     |---------------|----------|  
     | PAY-PAY       | $?       |  
     | PAY-REFUSE    | $?       |  
     | REFUSE-PAY    | $?       |  
     | REFUSE-REFUSE | $?       |  

  ---

  ### **Activity Flow (90 Min)**
  #### **Step 1: Setup (10 min)**
  - Split into **4 teams of 3**. Each team gets $4 endowment.
  - Explain: *"Today’s game involves two scenarios. You’ll face both, but under two rules:  
    **Round 1**: Commit to a policy upfront (no changing!).  
    **Round 2**: Decide freely when scenarios hit.  
    Predictions are sealed by [Neutral Student] and can’t be changed."*

  #### **Step 2: Policy Auction & Commitment (20 min)**
  - **Teams draft policies**: Each team creates a "policy bundle" (actions for Scenarios 1 & 2).  
    *Example bundles: PAY-PAY, PAY-REFUSE, REFUSE-PAY, REFUSE-REFUSE.*  
  - **Auction**: Teams bid *from their endowment* for which bundle becomes the **global binding policy**. Highest bid wins, money burned (no refunds).  
    - *Why auction?* Forces value-based debate ("Is REFUSE-REFUSE worth $2?").  
  - **Lock-in**: Winning policy is announced and binding for all teams in Round 1.  
    - *Example: Winning bid = $2 for PAY-REFUSE → all teams must PAY in Scenario 1, REFUSE in Scenario 2.*

  #### **Step 3: Round 1 – Policy Run (20 min)**
  - **Scenario 1 (CM)**:  
    - Teams simultaneously choose per locked policy.  
    - Facilitator reveals **CM prediction envelopes**.  
    - **Payout**:  
      - If policy = PAY: Get envelope ($3 if prediction correct, $0 if wrong) minus $1.  
      - If policy = REFUSE: $0.  
  - **Scenario 2 (XB)**:  
    - Teams choose per locked policy.  
    - Facilitator reveals **XB prediction envelope** **only if policy = PAY** (simulates "letter sent iff predicted PAY").  
    - **If policy = PAY**:  
      - If prediction correct → receive clue (worth $2 in test).  
      - If prediction wrong → no clue.  
      - Teams pay $1 regardless.  
    - **If policy = REFUSE**: No letter, no action, no test.  
    - **Test (if they paid)**: Guess box A/B for $2. With clue, they win $2; without, 50% chance.  
  - **Record payouts**.

  #### **Step 4: Round 2 – Free-Choice Run (20 min)**
  - **Same scenarios**, but teams decide freely *in the moment* (no binding policy).  
  - **Predictions**: New pre-sealed envelopes (same neutral student setup).  
  - **Key difference for XB**:  
    - Teams only receive the letter *if* XB prediction = PAY (envelopes control this).  
    - If they receive it, they choose freely. If not, no scenario occurs.  
  - **Payouts**: Same as Round 1 (CM: pay to get envelope; XB: pay for clue → test).

  #### **Step 5: Compare & Debrief (20 min)**
  - **Results**: Display Round 1 (policy) vs. Round 2 (free) payouts.  
    *Typical outcome*:  
    - **CM**: Policy run wins (teams commit to PAY, net +$0.50/team). Free run similar (players PAY anyway).  
    - **XB**: Policy run wins with REFUSE (net $0). Free run loses (players PAY if letter sent, net -$0.50/team).  
  - **Debrief Structure**:  
    1. **Reveal scenarios**: "Scenario 1 was Counterfactual Mugging, 2 was XOR Blackmail."  
    2. **Contrast decisions**:  
       - *CM*: Paying is ex-ante optimal (positive EV). Free choice doesn’t override this.  
       - *XB*: Paying feels optimal *ex-post* (if letter received), but committing to refuse ex-ante avoids exploitation.  
    3. **Key difference**:  
       - In XB, the **letter’s existence correlates with your action** (sent iff you’d pay). Paying *after* seeing the letter leaks that you’re exploitable.  
       - In CM, the prediction is independent (Omega appears regardless).  
    4. **Limitation**:  
       - *"In class, correlations were staged via envelopes. Real Omega uses logical causality (your decision algorithm determines the prediction). But the dilemma is identical: committing to ignore 'I saw a letter' prevents blackmail."*  

  ---

  ### **Predictable Problems & Fixes**
  1. **"Renegotiating after policy lock-in"**:  
     - *Prevent*: Announce: "Policy is software code—no overrides. Violations forfeit $2."  
     - *Fix*: If a team rebels, apply penalties mechanically.

  2. **Stakes too small**:  
     - *Prevent*: Use "points" redeemable for candy/privileges. Say: "Focus on the intellectual betrayal!"  
     - *Fix*: Highlight humiliation in results ("Team 3 lost $0.50 by rethinking XB!").

  3. **Prediction mechanic misses**:  
     - *Prevent*: Neutral student signs envelopes publicly. Stress: "Predictions were locked at 9 AM!"  
     - *Fix*: If a prediction is wrong, confess: "Real Omega is infallible; I’m not. But the lesson holds."

  4. **Time overrun**:  
     - *Prevent*: Run 1 practice round with CM. Use timers (2 min/decision).  
     - *Fix*: Skip detailed XB test (simulate: "Clue gives $2, no clue = $0").

  ---

  ### **Why This Works**
  - **Pre-commitment clash**: Policy auction forces ex-ante vs. ex-post tension. Teams *feel* the agony of locking in REFUSE for XB while knowing they’ll want to PAY if tested.  
  - **Shared prediction mechanic**: Identical envelope system for both scenarios highlights why "ignoring the past" works in CM but fails in XB.  
  - **Honesty in debrief**: By admitting the "staged correlation," you turn a flaw into a lesson on logical vs. empirical causality.  

  This design transforms abstract theory into visceral experience—no reading-group recitations, just cold, hard cash (and regret).
