            We need that if you are the type that would not pay, you avoid the situation where you have to make the decision and you are better off.

          Revised XB:

            - If Omega predicts you would pay upon receiving the letter, then it sends the letter and sets up a future problem in which you will lose $2 unless you have the information from the letter.
