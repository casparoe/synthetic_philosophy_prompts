          To avoid that, we can design Scenario B in the free run to be played without the prediction: we simply assume that the prediction is whatever the team actually does. So for the free run of B:

            - If the team would choose to pay upon receiving the letter, then they should receive the letter. But we haven't sent the letter yet.

          This is circular.

