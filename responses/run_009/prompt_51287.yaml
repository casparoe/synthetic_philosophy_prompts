  We are going to design an in-class activity that involves both the Counterfactual Mugging and XOR Blackmail scenarios without revealing the names. The activity will have two runs: one where participants commit to a policy in advance (via a policy auction) and one where they decide freely in the moment. The goal is to highlight the tension between ex-ante and ex-post reasoning and to illustrate the difference between updateful and updateless decision theories.

  ### Overview of the Activity
  1. **Participants**: 12 people, divided into 3 teams of 4 (or adjust as needed). Each team will represent one "player" in the decision problems.
  2. **Stakes**: Each participant contributes a small amount (e.g., $1) to a pool, so the total pool is $12. The facilitator also has a slush fund to cover payouts (if necessary) and to add stakes. The idea is that the teams can earn money for their members based on their decisions.
  3. **Two Runs**:
     - **Policy Run**: Teams draft and commit to a single policy (a function from scenarios to actions) without knowing which scenarios they will face. One policy is selected (via auction or vote) and applied mechanically in the scenarios.
     - **Free-Choice Run**: The same scenarios are presented again, but this time each team decides what to do at the moment without any pre-commitment.
  4. **Scenarios**:
     - **Counterfactual Mugging (CM)**: Omega appears and says, "I have predicted what you would do in this situation. If I predicted you would pay me $1, then I put $3 in an envelope for you. Otherwise, I put nothing. Now, will you pay me $1?" (Note: The player does not know the prediction.)
     - **XOR Blackmail (XB)**: Omega sends a letter to the player (only if Omega predicted the player would pay upon receiving the letter). The letter says: "I have predicted what you will do upon receiving this letter. If you pay me $1, I will tell you a secret that will save you $2 in a future problem. But if you don't pay, then I will do nothing. However, note: if I predicted you wouldn't pay, I wouldn't have sent this letter at all." (The key is that the letter is only sent if Omega predicted the player would pay. If the player pays, they get the secret which is worth $2 in a future problem, but if they don't, they avoid the $1 cost but the letter wasn't sent in the first place if they weren't going to pay.)

