  The biggest unspoken need seems to be avoiding dead ends. As a non-academic, they can't afford to waste time on untestable theories or questions requiring inaccessible sources. They need "tractable" problems - ones where English-language scholarship offers enough material for meaningful analysis.

  I should prioritize questions where:
  - Major scholarly work exists in English
