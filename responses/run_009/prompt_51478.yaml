prompt: |-
  I've been going down the verisimilitude rabbit hole (Popper's "how can one false theory be closer to the truth than another" thing) and I want to stop reading proposals until I'm clear on what a proposal is even supposed to deliver. Assume you're a philosopher of science who's spent way too many years on this literature. Please actually think carefully, maybe brainstorm the candidate requirements first before committing to the final list, then write me the full spec:

  - the list of things any adequate theory of truthlikeness MUST deliver, with the concrete case or consideration behind each requirement. I want at minimum that it make sense of the Newton-vs-Ptolemy intuition (both false, one obviously closer to how the world actually works), that it explain why a tautology, despite being true, is not somehow the best theory there is, and that it handle the quantitative cases (a law that's off by a tiny correction term vs one that's wildly wrong) and not just qualitative ones. Beyond those I'll let you decide what belongs on the list.
  - for each requirement: non-negotiable, or a preference that one camp (Popperians, the possible-worlds distance people, etc.) happens to hold? I suspect some things people demand are just camp prejudice, tell me which.
  - whether any subset of the requirements is jointly unsatisfiable -- the Tichý/Miller style counterexamples already sank Popper's own qualitative account, and Miller's language dependence theorem arguably sank the response too, so I want to know if the survivors can even coexist or whether the list itself is a mini no-go result. This is the part I care about most, don't gloss it.
  - which single requirement knocks out the most otherwise-plausible proposals.

  Then, briefly, how the two main surviving families -- the content-based approach and the possible-worlds/possible-world distance approach -- do against your list. Keep the scorecard short, the criteria are where the thinking is. Assume the purpose is fixed: the theory of verisimilitude has to be good enough to make sense of scientific progress, i.e., to justify saying modern physics is an improvement on its predecessors even though both got things wrong. If you think that purpose itself smuggles in a requirement that the purists would deny, say so. Don't just give me names of requirements, give me the cases. Typos forgiven in advance because I made some of my own.
