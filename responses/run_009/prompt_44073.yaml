  ### Step-by-Step Analysis and Resolution

  Your friend's version of the two-envelope paradox avoids the standard mistake (incorrectly assuming equal probabilities for the other envelope being double or half) by deriving probabilities directly from the coin-flip mechanism. The conditional expected value calculation in steps (2)–(4) is mathematically correct for any observed amount \(3^k\), and you have verified this for \(k=2\) by enumeration. However, the paradox arises from the inference in step (5) and the conclusion in step (6) that decision theory is inconsistent. The flaw lies in step (5), and rejecting this step resolves the paradox while preserving the validity of the conditional computations in (2)–(4). Below, I explain why step (5) must be rejected, why it appears innocent, the cost of rejecting it, and why the damage is local rather than a fundamental wound to decision theory.

  #### Step to Reject: Step (5)
  **Step (5) states:** "If switching is favored after every possible observation, then it is favored without looking."

  This step is invalid in this setup. While it is true that, conditional on observing any specific amount \(3^k\), switching yields a higher expected value (as shown in steps (2)–(4)), this does not imply that switching is unconditionally favored when the envelope is unopened. The reason is that the unconditional expected value of both envelopes is infinite, and in such cases, dominance arguments based on pointwise conditional expectations do not translate to unconditional preferences.

  **Why it looked innocent:** Step (5) appears plausible because in finite scenarios with bounded expectations, if an action is conditionally beneficial for every possible outcome, it is often unconditionally beneficial (e.g., by the law of total expectation). However, this intuition relies on the existence of finite expected values. Here, the probability distribution over envelope amounts has a heavy tail—specifically, the expected value diverges to infinity—which breaks the equivalence. The setup's infinite expectation creates a situation where conditional reasoning (which always shows a gain) is not informative about unconditional decisions (where symmetry holds). This pitfall is subtle because the coin-flip probabilities are well-defined and the conditional math is correct, masking the underlying issue with the unconditional distribution.

  #### Cost of Rejecting Step (5)
  Rejecting step (5) comes with a conceptual cost: we lose the ability to infer unconditional dominance directly from conditional dominance when expectations are infinite. This means:
  - **In practical decision-making:** We cannot assume that "always switch" is unconditionally optimal just because it is conditionally optimal for every observation. Instead, unconditional decisions must be evaluated separately, based on symmetry or other principles when expectations are undefined.
  - **In decision theory:** It highlights that expected-value reasoning requires finite expectations for consistent unconditional conclusions. When expectations are infinite, conditional and unconditional perspectives can diverge, and decision rules must be applied contextually (e.g., only after conditioning on available information).

  Despite this cost, rejecting step (5) does not invalidate the conditional computations in steps (2)–(4). The arithmetic in (2)–(4) is sound and should be kept, as it correctly describes the decision-maker's perspective after observing the amount. The issue arises only when we try to extrapolate this to the unobserved case.

  #### Why the Damage is Local, Not to Decision Theory Itself
  Your friend claims in step (6) that this paradox reveals an inconsistency in decision theory, but this is incorrect. The problem is confined to the specific setup with infinite expectations and does not generalize to all decision-theoretic contexts:
  - **Local nature:** The paradox stems from the heavy-tailed distribution generated by the coin-flip process. Specifically, the probability of a long run of tails decreases exponentially (as \((1/2)^{n+1}\) for first heads on flip \(n+1\)), but the reward \(3^n\) grows exponentially, causing the expected value to diverge:
    \[
    E[\text{my envelope}] = \sum_{n=0}^{\infty} P(H_n) \cdot E[\text{amount} \mid H_n] = \sum_{n=0}^{\infty} (1/2)^{n+1} \cdot 2 \cdot 3^n = \sum_{n=0}^{\infty} (3/2)^n = \infty.
    \]
    This divergence means that:
    - Unconditionally, the envelopes are symmetric (\(E[\text{other}] = E[\text{my envelope}] = \infty\)), so switching is not favored.
    - Conditionally, for any finite observation, switching has positive expected gain (e.g., \((11/9) \cdot 3^k > 3^k\)), but this gain is "local" to that observation and does not accumulate to an unconditional improvement.
  - **Switching back and forth:** The endless cycle of switching (step (6)) is a consequence of myopic conditional reasoning: at each step, given the current observation, switching seems beneficial. However, this is not a contradiction but a feature of the infinite expectation. Decision theory can handle this by prescribing a one-time switch after observation (since it is conditionally optimal) or by using bounded utility functions to avoid divergence (see below).
  - **Decision theory remains intact:** Expected-value reasoning is consistent when expectations are finite or when bounded utility functions are used. For example:
    - With a bounded utility function (e.g., \(u(x) = \min(x, M)\) for some large \(M\)), the unconditional and conditional expected utilities become finite and comparable. In this case, the conditional advantage of switching may not hold for large amounts, and symmetry ensures no unconditional gain, resolving the cycle.
    - Without bounded utility, decision theory still correctly prescribes switching after observation but indifference when unopened, as the conditional and unconditional problems are distinct.

  #### The Series Divergence: Your Mathematical Question
  When you compute the expected value of the unopened envelope, the series diverges (as in your derivation), and this is not due to weak mathematics—it is inherent to the setup. The series \(\sum_{n=0}^{\infty} (3/2)^n\) diverges because the ratio \(r = 3/2 > 1\). This divergence confirms the infinite expectation, which is central to the paradox. It means that:
  - Before opening the envelope, there is no finite expected value to compare, so "favoring" switching is meaningless.
  - The divergence signals that step (5) cannot be justified, as unconditional dominance requires finite expectations.

  #### Conclusion
  - **Reject step (5):** The inference from conditional to unconditional dominance fails due to infinite expectations. The conditional math in (2)–(4) is correct and should be kept, but it does not extend to the unobserved case.
  - **Resolution:** Unconditionally, symmetry dictates indifference; conditionally, switching is rational given the observation. The endless switching cycle arises from misapplying conditional reasoning recursively but does not invalidate decision theory.
  - **Lesson:** The paradox highlights a pitfall in decision theory when dealing with heavy-tailed distributions (infinite expectations). It underscores the need for bounded utility functions or careful handling of conditional information. This is a local issue, not a fundamental flaw—expected-value reasoning remains consistent in finite or bounded cases.

  By rejecting step (5), you preserve the correct parts of the argument while resolving the paradox. Your friend has indeed crafted a clever variant, but it exploits the limits of expected value with infinite means rather than exposing a genuine inconsistency.
