  ### Diagnostic Quiz on Resolving Social Choice Conflicts

  #### (a) Ten Diagnostic Questions (Plus One)

  1. **Book Club Preferences**  
     *In a book club, members choose what to read. Some members have strong preferences about what others should read. Should these preferences be considered when the club votes?*  
     A) Yes, everyone's preferences should count.  
     B) No, each member should only be concerned with their own reading experience.  

  2. **Room Tidiness**  
     *Two roommates: Amy is tidy, Ben is messy. Their rooms are private, but Amy is bothered by Ben's messiness simply because she dislikes mess. Should Ben be forced to tidy?*  
     A) No, it’s Ben’s room.  
     B) Yes, because Amy is bothered.  

  3. **Headphone Music**  
     *Carol listens to music via headphones in her office. David dislikes the genre but cannot hear it. Should Carol be allowed to listen?*  
     A) Yes, it doesn’t affect David.  
     B) No, because David finds it distasteful.  

  4. **Shared Kitchen Smells**  
     *Emma and Finn share a kitchen. Emma gets nauseated by the smell of Finn’s meat cooking. Should Finn be allowed to cook meat?*  
     A) Yes, it’s his food.  
     B) No, because it makes Emma sick.  

  5. **Community Mural**  
     *Artist Gia designs a mural for a community center. All members except Gia unanimously hate the design. Should Gia be allowed to paint it?*  
     A) Yes, it’s her assigned task.  
     B) No, because everyone else hates it.  

  6. **Birthday Dinner Choice**  
     *Harry picks a restaurant serving insects for his birthday. His family is horrified. They’d be equally horrified if taken there without Harry’s choice. Should they override him?*  
     A) No, it’s Harry’s birthday.  
     B) Yes, because the meal will be unpleasant.  

  7. **Project Color Scheme**  
     *Ian has the right to choose a project’s color scheme. He picks an ugly option. Everyone (including Ian) prefers another available scheme. Should Ian be allowed his choice?*  
     A) Yes, it’s his right.  
     B) No, because everyone prefers the alternative.  

  8. **Committee Decision**  
     *A committee gives Julia the right to choose between options X and Y. Julia picks X, but everyone prefers Y. Should they accept X?*  
     A) Yes, because Julia was given the choice.  
     B) No, they should override and pick Y.  

  9. **Boat Naming**  
     *Ken names his boat "Sea Slut." All friends and family hate it. Should Ken be allowed to use the name?*  
     A) Yes, it’s his boat.  
     B) No, because everyone hates it.  

  10. **House Painting Spillover**  
      *Lena paints her house purple. Neighbor Mike says it lowers his property value. Should Lena be allowed to paint it?*  
      A) Yes, it’s her house.  
      B) No, because it affects Mike’s value.  

  11. **Movie Night Choice**  
      *Nora picks a movie for group night. Everyone else hates it. Should they watch Nora’s choice?*  
      A) Yes, it’s her right to choose.  
      B) No, they should pick something else.  

  ---

  #### (b) Scoring Key  
  Map answer patterns to leaves using the tree below. Answers not listed default to "Unresolved."  

  | Leaf                          | Required Answers                                  |
  |-------------------------------|--------------------------------------------------|
  | Domain restriction            | Q1=B                                             |
  | Side constraints              | Q1=A and Q2=A                                    |
  | Preference scrutiny           | Q1=A and Q2=B and Q3=A                           |
  | Game-form rights              | Q1=A and Q2=B and Q3=B and Q8=A                  |
  | Alienable rights              | Q1=A and Q2=B and Q3=B and Q8=B and Q7=B         |
  | Unanimous override            | Q1=A and Q2=B and Q3=B and Q8=B and Q7=A and (Q5=B or Q9=B or Q11=B) |
  | Unresolved                    | None of the above patterns                       |

  ---

  #### (c) Decision Tree with Numbered Branch Nodes  
  1. **Should preferences about others' personal choices be admissible?**  
     - **B (No) →** Leaf: **Domain restriction**  
       *Awkward commitment: Declares certain preferences "invalid," requiring scrutiny of preference content.*  
     - **A (Yes) →** Node 2.  

  2. **Should personal choices always be respected, regardless of others' preferences?**  
     - **A (Yes) →** Leaf: **Side constraints**  
       *Awkward commitment: Demands fine-grained state individuation (e.g., distinguishing outcomes by how they were chosen).*  
     - **B (No) →** Node 3.  

  3. **Should purely meddlesome preferences (no tangible effect) be disregarded?**  
     - **A (Yes) →** Leaf: **Preference scrutiny**  
       *Awkward commitment: Judges which preferences are "legitimate," risking paternalism.*  
     - **B (No) →** Node 4.  

  4. **Are rights defined as freedom to choose (procedures), not fixed outcomes?**  
     - **A (Yes) →** Leaf: **Game-form rights**  
       *Awkward commitment: Requires rights-exercising procedures to yield Pareto-efficient outcomes, or the paradox resurfaces.*  
     - **B (No) →** Node 5.  

  5. **Should rights be waived if exercising them causes a Pareto-inferior outcome avoidable without overriding rights?**  
     - **B (Yes) →** Leaf: **Alienable rights** (Gibbard)  
       *Awkward commitment: Individuals lose rights if unanimous Pareto improvements exist, sacrificing autonomy.*  
     - **A (No) →** Node 6.  

  6. **Should rights yield to unanimous opposition from others?**  
     - **B (Yes) →** Leaf: **Unanimous override**  
       *Awkward commitment: Overrides personal choices if all others object, even without tangible spillovers.*  
     - **A (No) →** Leaf: **Unresolved**  

