  ### Notes on Logical Space and Limitations  
  - **Empty Cell**: The combination where individuals endorse overriding in the abstract (Q2=B) but reject every concrete override (Q5=A, Q9=A, Q11=A, and Q7=A) is **incoherent** (inconsistent willingness to override).  
  - **Indistinguishable Pair**: **Side constraints** and **Unresolved** cannot be separated if Q2=A answers are inconsistent with never overriding (Q5–Q11). The 11th question (Movie Night) mitigates this by testing concrete override willingness.  
  - **Flagged Limitation**: The quiz cannot separate **Alienable rights** from **Unanimous override** if a respondent rejects Pareto-based waiver (Q7=A) but supports override in unanimous scenarios (Q5=B/Q9=B/Q11=B). This reflects a theoretical tension: Gibbard’s alienability relies on Pareto comparisons, while unanimous override ignores Pareto efficiency.  

