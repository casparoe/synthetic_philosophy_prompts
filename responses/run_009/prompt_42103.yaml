answer: |-
  ## Tenant

  **ADVANCE DIRECTIVE OF MARGARET ELIZABETH VANCE: SECTION 7.1**
  *In the event I exhibit persistent inability to recognize my children, Ruth Vance or Thomas Vance, due to cognitive impairment, I refuse all antibiotics, hospitalization, and life-sustaining treatment for any subsequent acute infection. Comfort measures only. This directive is informed and irrevocable.*

  Ruth’s knuckles were white on the directive. Outside the sunroom window, her mother leaned close to the feeder, tracking a chickadee’s darting flight. A faint, wet rattle punctuated Margaret’s shallow breaths. She turned, eyes bright but vacant, and resumed sorting fabric swatches – teal, cerulean, cobalt – humming a shapeless tune.

  *Diary, April 12th: Drafted Section 7.1 today. Saw it too often: the husk animated by tubes, the family’s agony protracted. If I cannot know Ruthie, if I cannot know Tom, then *I* am gone. What remains is the tenant. And the tenant doesn’t get to rewrite the lease.*

  Ruth touched her mother’s shoulder. “Mom? It’s Ruth.” Margaret beamed, a sunburst of pure, uncomplicated warmth, then returned to her blues. She picked up a scrap of cornflower cotton, holding it to the light like a jewel. The rattle deepened. Dr. Amin said a simple course of amoxicillin would likely clear the infection. Without it, pneumonia would follow.

  *Diary, April 15th: Discussed the directive with Ruth. She understands, intellectually. But she’ll look at the tenant and see my face. She must resist. The tenant’s contentment is irrelevant – it’s the contentment of a well-fed pet, devoid of history, love, consequence. My life, my whole life, demands this ending. The tenant is merely occupying space I vacated. Ruth must be the landlord who enforces the lease.*

  Margaret coughed, a thick, jarring sound. She blinked, momentarily startled, then sighed, her gaze drifting back to the fluttering birds. A smile touched her lips as a cardinal landed. She resumed humming, a fragment of "Amazing Grace" emerging, then dissolving. Ruth remembered her father’s last months, the indignity Margaret had raged against.

  *Diary, April 28th: Finalized it. Signed. Witnessed. The tenant moves in when the lights go out for good. My responsibility ends there. Ruth’s begins: hold the line. No heroics for the ghost in the machine. This isn’t cruelty. It’s the final act of respect for the woman I was, the life I built. The tenant gets shelter, warmth, kindness – but not a single day purchased by betraying everything I believed. The lease is clear.*

  The sun warmed the swatches in Margaret’s lap. She carefully placed the cornflower blue atop a pile of sky blues, her movements deliberate, absorbed. She patted the stack, a small sound of satisfaction in her throat. Her breath hitched, rattled again. Ruth looked at the directive on the wicker table, then at her mother’s face – untroubled, bathed in afternoon light, utterly present in her vibrant, diminished world. The woman who wrote the diary saw only darkness in this room. She saw a ghost. Ruth saw sunlight on white hair, a fleeting cardinal’s flash, a hand gently smoothing fabric.

  Ruth picked up the phone. Her thumb hovered over the screen, Dr. Amin’s number displayed. The directive lay beside it, the words *informed and irrevocable* stark under the glass tabletop. Margaret hummed her nameless hymn, sorting blues into an order only she understood.

  The phone was cool in Ruth’s palm. Outside, a chickadee called. Margaret looked up, her eyes finding the window, finding the world beyond. Waiting.
