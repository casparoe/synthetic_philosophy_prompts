prompt: |-
  I'm in a small ethics reading group (two philosophy grad students, a lawyer friend, and me) and for the better part of a year we've been circling the same fight about what deception and coercion actually do to consent, and we are completely stuck. The setup: everyone agrees lying to someone to get them into bed is wrong, and everyone agrees blackmailing them is worse. The fight is about the mechanism. One camp says consent is basically a normative power you exercise — like signing a contract — so when you're deceived, the consent still *happened*, it's just tainted, and the wrong is a separate wrong (fraud, manipulation) layered on top. The other camp says consent is fundamentally a choice, and a choice made on false premises isn't a corrupted instance of consent but no consent at all — the deception doesn't make the consent bad, it makes it absent. Our lawyer keeps muddying things by pointing out that contract law has already solved this in her favor: contracts induced by fraud are void*able*, not void, so why should bedroom consent work differently? And the grad students keep insisting that the actual patchwork in criminal law is the real data any theory has to explain — deception about the nature of the act voids consent outright, deception about identity sometimes does, deception about your income or your fidelity basically never does — and that any account that can't reproduce that graded structure is just not fit for purpose.

  We've tried the obvious moves. Someone proposed distinguishing deception about the act itself from deception about the surrounding world, and that lasted one meeting before the counterexample about a swapped twin (same "act," deceived about who) killed it. Someone else proposed a "but-for" causal test — if she wouldn't have agreed had she known, no consent — and that collapsed immediately because it would invalidate consent obtained by, say, hiding your vasectomy from someone who wants kids, which nobody at the table wanted to call rape. Coercion produces the same stall in miniature: we all agree a gun to the head vitiates, we all agree a boss leaning on a subordinate at least taints, but no one can say *where* the line is or what makes the line fall where it does, and every criterion we propose (would a reasonable person refuse? was there a threat or just an offer? was the pressure wrongful or just unfortunate?) gets picked apart within twenty minutes.

  My working hypothesis, and I'd like you to actually evaluate it rather than just take it on: the stall isn't because anyone is being dense, it's because the two camps are answering two different questions under one word. The "consent as choice" people are really doing moral psychology — they care about what happened inside the person's head and whether it counts as an autonomous exercise of agency. The "consent as signature" people, and probably the law, are really doing normative bookkeeping — they care about what permissions and liabilities the act generates downstream, which is why the law can afford graded responses (void, voidable, valid-but-actionable) that the psychology camp finds incoherent. If that's right, then maybe the disagreement is largely verbal and the real fight is about which function the word consent *should* be reserved for, which would be a normative question about conceptual engineering, not a discovery about the nature of consent. But I'm not sure — the camps also seem to genuinely disagree about whether deception victims are *wronged in the same way* as outright refusals, which doesn't feel verbal. So: diagnose the disagreement for me. Is it verbal, substantive-but-ill-posed, two projects with one label, or a real disagreement about which of consent's functions we should care about most? Use what each side actually argues, not a survey of positions. And then tell me honestly what would count as progress given your diagnosis — a distinction, a test case, a way of splitting the question, or whether this is just one of those debates where the sides should agree to use different words and stop.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're stuck in a debate about how deception and coercion affect consent. There are two main camps: one sees consent as a normative power (like a contract), so deception taints it but doesn't nullify it. The other sees consent as a choice, where false premises mean no real consent at all. The lawyer points to contract law where fraud makes contracts voidable, not void, while the grad students argue criminal law's patchwork shows different levels of vitiation.

  The user's hypothesis is that the two sides are answering different questions—moral psychology vs. normative bookkeeping. They wonder if the disagreement is verbal or substantive. The key is to diagnose the core issue and suggest a path forward.

  First, I need to validate both perspectives. The "consent as choice" camp focuses on autonomy and the internal state of the person. If someone is deceived, their decision isn't truly autonomous, so consent wasn't valid. Examples like swapped twins or deception about identity support this view. The "consent as signature" camp, influenced by legal frameworks, cares about the social and transactional outcomes. They separate the act of consent from the wrongness of deception, allowing for degrees of invalidation.

  The lawyer's contract law analogy is crucial. Voidable contracts imply that the consent existed but is defeasible, whereas void means it never existed. Criminal law's inconsistencies—like deception about the act voiding consent but not deception about income—show the grad students' point that any theory must explain this variance.

  The user's insight about different functions of consent seems spot on. The camps aren't just defining consent differently; they're prioritizing different aspects. The moral psychology view emphasizes the victim's experience and autonomy violation. The normative bookkeeping view looks at societal rules and practical consequences. This isn't merely verbal because they disagree on the harm's nature—whether deceived victims are wronged similarly to those who outright refuse.

  To resolve this, the group needs to distinguish between validity (was consent given?) and vitiation (should it be voided?). They should map the underlying values: autonomy, harm prevention, social coordination. Using test cases like the vasectomy example or coercion scenarios can clarify where each camp's priorities lie. Progress would involve agreeing on a framework that incorporates both perspectives, perhaps with a taxonomy of harms affecting consent differently. This way, they can move beyond semantic debates to address the core ethical concerns.
answer: |-
  Here’s a diagnosis of your group’s impasse, grounded in your description of the arguments, followed by a realistic path forward:

  ### Diagnosis: **Substantive Disagreement Masquerading as Conceptual Confusion (with a Core Normative Split)**
  The two camps *are* answering different but **intertwined** questions, and the label "consent" is doing double duty. However, this isn’t *merely* verbal, nor is it just "two projects under one label." The core disagreement is about **which aspect of consent is morally definitive** when harm occurs, and this disagreement has substantive ethical consequences.

  1.  **"Consent-as-Choice" (Moral Psychology Focus):**
      *   **Core Question:** "Was this person’s *actual will* sufficiently autonomous and informed to generate a genuine moral permission?"
      *   **Argument:** Autonomy requires accurate information relevant to the decision. Deception/coercion distorts the agent’s internal reasoning process, making the resulting "yes" *not an expression of their true will* regarding the situation as it *actually is*. The harm *is* fundamentally the same as outright refusal: a violation of bodily autonomy. The graded legal structure reflects societal reluctance to criminalize common deceptions, not a coherent moral distinction.
      *   **Strength:** Explains the visceral wrong of deception/coercion (feels like a violation *of the self*).
      *   **Weakness:** Struggles with the "graded structure" problem (vasectomy deception isn’t rape) and risks over-expanding "invalid consent" to include *any* misrepresentation.

  2.  **"Consent-as-Signature" (Normative Power / Bookkeeping Focus):**
      *   **Core Question:** "Did the agent perform an act (verbal/non-verbal) that conventionally transfers permission in this social context, *even if flawed*?"
      *   **Argument:** Consent is a performative act that changes normative relations (like a contract). Deception/coercion are *wrongs done to obtain that act*, making the transaction defective or voidable, but the act of consent itself occurred. The primary harm might be fraud or duress, distinct from the violation inherent in non-consensual sex. The legal graded structure *is* morally relevant, reflecting different degrees of defect in the normative transaction.
      *   **Strength:** Explains legal distinctions (voidable contracts, criminal law patchwork) and avoids collapsing all deception into "no consent."
      *   **Weakness:** Seems to downplay the autonomy violation inherent in deception (e.g., "You *said* yes, even if tricked, so it's 'consent plus fraud' not 'no consent'").

  3.  **The Lawyer's Point & The Grad Students' Point:**
      *   **Lawyer:** Correctly highlights that social/legal systems *treat* consent-like acts as existing but defeasible. This is practical bookkeeping.
      *   **Grad Students:** Correctly insist that *any* moral theory of consent must *explain why* the law draws the lines it does (or critique those lines), not just accept them as definitional. The patchwork *is* data to be explained.

  4.  **Your Hypothesis (Partially Right, But Deeper):**
      *   You're right that the camps prioritize different functions of consent (internal state vs. external permission). **This *is* the source of the stall.**
      *   **Where it's Substantive:** The camps genuinely disagree on the *nature of the wrong* done to the deceived/coerced person. Is it *primarily* a violation of bodily autonomy akin to force (Choice Camp)? Or is it *primarily* a wrong of fraud/duress that *exploited* a consent-granting act (Signature Camp)? This isn't verbal; it's about the fundamental harm.

  ### Why You're Stuck: The Normative Elephant in the Room
  The disagreement isn't *just* descriptive ("What is consent?") but **deeply normative**: **What aspect of consent matters most for determining the *kind* and *severity* of the moral violation when things go wrong?**
  *   The "Choice" camp prioritizes **Subjective Autonomy & Bodily Integrity**. The core sin is bypassing/violating the will.
  *   The "Signature" camp prioritizes **Social Coordination & Transactional Integrity**. The core sin is defective agreement/exploitation.

  **Neither camp's "test" works universally because they are trying to force one prioritized value to do all the work in complex situations where both values are relevant but in tension.**

  ### Path to Progress: Distinguish, Map Values, Reframe the Question
  Forget "solving" consent in one go. Aim for conceptual clarity and value mapping:

  1.  **Distinguish Validity from Vitiation:**
      *   **Act of Consent:** Did the agent perform a conventionally recognized act signifying "yes"? (Signature camp focuses here).
      *   **Validity of Consent:** Was that act sufficiently autonomous and informed to generate genuine moral permission? (This is where the core fight lies).
      *   **Vitiation:** *Why* is it invalid? What *kind* of defect is it (fraud, duress, incapacity)? This impacts *how* we respond (void, voidable, damages, criminal sanction).

  2.  **Explicitly Map the Underlying Values:** Use concrete cases.
      *   **Case:** Boss implies promotion depends on sex (coercion).
          *   *Choice Camp:* Autonomy destroyed by threat/power imbalance. Consent invalid. Violation akin to force.
          *   *Signature Camp:* Consent act occurred under duress. Transaction is voidable/actionable. Wrong is exploitation/abuse of power.
      *   **Case:** Lying about vasectomy.
          *   *Choice Camp:* Autonomy undermined on a core aspect (reproductive consequences). Consent invalid? (Camp likely splits internally here, causing their own problem).
          *   *Signature Camp:* Consent act occurred. Fraud about collateral matter. Transaction might be voidable (for annulment?) or grounds for civil suit, but not criminal "no consent." Wrong is fraud.
      *   **Key Question:** "In this case, which value (Autonomy or Transactional Integrity) feels *more* violated, and why? What kind of redress fits best?"

  3.  **Reframe the Core Question:**
      *   Instead of "Does deception/coercion negate consent?", ask: **"Under what conditions do deception/coercion *vitiate* consent to such a degree that it constitutes a violation of bodily autonomy *equivalent in kind* to non-consensual sex by force, versus constituting a serious but *different kind* of wrong (like fraud or duress)?"**
      *   This acknowledges the Choice camp's core concern (violation equivalence) while allowing the Signature camp to argue why the wrongs are distinct.

  4.  **Use the Law as Data, Not Authority:**
      *   Stop arguing *from* law (e.g., "contract law says voidable!"). Instead, analyze *why* criminal law voids consent for deception about the "nature of the act" (e.g., switching condom removal) but not about income. What underlying *values* is the law trying to protect in each case? (Bodily integrity vs. freedom to make bad bargains?). Does the law get it right? *This* is the debate the grad students want.

  ### What Counts as Progress
  1.  **Agreed Distinction:** Explicitly adopting the "Act / Validity / Vitiation" distinction.
  2.  **Value Mapping:** Clearly articulating for specific cases *why* each camp thinks the primary wrong is Autonomy Violation or Transactional Defect/Fraud/Duress.
  3.  **Reframed Agreement:** Acknowledging that *both* camps identify real harms, but disagree on whether the core harm in deception/coercion scenarios is *identical in kind* to the harm of forced sex, or a distinct (though potentially equally severe) category of wrong.
  4.  **Splitting the Question:** Agreeing that "consent" as a social/legal *transaction* might be voidable, while "consent" as a mental state *wasn't truly formed* under deception/coercion. Using different terms ("defective consent" vs. "non-autonomous assent") could *clarify* the disagreement without resolving the normative core about the nature of the harm.
  5.  **Progress on Coercion:** Shifting focus from a bright line ("where is the line?") to a framework: "What factors *increase* the vitiating power of pressure?" (Power imbalance, wrongfulness of threat, proportionality of threat to demand, availability of alternatives). Discuss *how* these factors impact Autonomy vs. Transactional Integrity.

  **Honest Assessment:** You likely won't get total agreement on the core normative question (Is deceived sex *the same kind of violation* as forced sex?). That *is* a deep philosophical split. However, you *can* achieve significant progress by clarifying *why* you disagree, separating the conceptual layers, and mapping the values at stake in specific cases. This moves the debate from circling definitions to engaging with the underlying moral priorities – which is where the real substance lies. Stop trying to win; start trying to understand the structure of the disagreement and the values driving each position. That *is* progress. If the semantic confusion persists, adopting distinct terms for the "act" and the "valid mental state" *is* a practical solution for group harmony, even if it papers over the normative rift.
