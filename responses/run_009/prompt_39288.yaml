answer: |-
  That's an incredibly sharp observation, and you've perfectly pinpointed a deep, pervasive issue in consequentialist reasoning, especially long-term utilitarianism. You're right that the move you describe – truncating the causal chain and assuming distant effects "cancel out" – is incredibly common, often unspoken, and does indeed smuggle in a significant assumption (symmetry) that rarely gets properly defended. While there isn't a single universally agreed-upon term that captures *every* nuance you describe, several concepts and labels are relevant:

  1.  **The Cancellation Assumption (or Symmetry Assumption):**
      *   **What it is:** This is the core *premise* you identified: the assumption that the vast, unpredictable long-term effects of an action are *equally likely* to be positive or negative, and/or that their *net expected value* averages out to zero. It's the belief that the noise is symmetric.
      *   **Status:** This assumption is rarely explicitly argued for in the context you describe. It's often treated as a default heuristic or a necessary epistemic concession. Critics (like you) point out it lacks justification – why *shouldn't* interventions systematically bias the future in positive or negative ways we can't foresee? (E.g., saving lives *might* systematically increase existential risk by accelerating technological development, or it *might* systematically decrease it by creating more stable societies – we don't know, and no symmetry is guaranteed). It's distinct from risk aversion, which is about weighting known bad outcomes more heavily; here, the outcomes are *unknown*.

  2.  **Expected Value Myopia / Near-Termism (in EA/Utilitarian Contexts):**
      *   **What it is:** This refers to the practical *decision* to focus calculation only on near-term, tractable consequences because the long-term is deemed "clueless." It's the *truncation move* itself.
      *   **Relation to Cluelessness:** Cluelessness is the *problem* (the inability to know long-term consequences). Expected Value Myopia/Near-Termism is a common *response* or *coping strategy* for dealing with cluelessness. It explicitly accepts that the long-term is unknowable and *chooses* to base decisions only on the knowable near-term impacts.
      *   **The Assumption Smuggled In:** While sometimes presented as purely pragmatic ("we *can't* know, so we *shouldn't* try"), it implicitly relies on the Cancellation Assumption. If you genuinely believed the unseen long-term effects were *systematically* negative (or positive), ignoring them wouldn't be myopia – it would be a potentially catastrophic mistake (or missed opportunity). The move only makes sense *if* you assume (explicitly or implicitly) that ignoring them is neutral *on average*.

  3.  **Bounded Rationality / Satisficing:**
      *   **What it is:** A broader concept from decision theory and cognitive science. Humans have limited time, information, and computational power. "Satisficing" means seeking a "good enough" solution rather than the theoretically optimal one. Truncating the causal chain is a form of satisficing in the face of overwhelming complexity.
      *   **Relation:** This provides a *pragmatic justification* for the truncation move. It argues that exhaustive calculation is impossible, so we *must* use heuristics like focusing on the near-term. However, it doesn't inherently justify the *symmetry* assumption; it just explains *why* we truncate. The symmetry assumption is the specific heuristic chosen within this bounded rationality framework.

  4.  **Negligibility Heuristic:**
      *   **What it is:** Treating very small probabilities or very distant/uncertain effects *as if* they were zero for practical decision-making.
      *   **Relation:** This is similar to the truncation move. Applied to long-term effects, it says "these effects are so uncertain and diffuse that their *expected value* is negligible, effectively zero." This *directly* incorporates the Cancellation/Symmetry Assumption. If the expected value of the long tail isn't zero, it's not negligible. This is precisely the heuristic invoked when dismissing the "pure noise" part of the chain.

  **How this differs from Pascal's Mugging & Risk Aversion:**

  *   **Pascal's Mugging:** This is about being exploited by *speculative, high-stakes* claims based on tiny probabilities of vast payoffs (or losses). The standard response is *epistemic skepticism* ("I don't believe your probability estimate is reliable enough to justify this action") or *decision-theoretic adjustments* (e.g., using a bounded utility function, discounting tiny probabilities to zero). The truncation move you describe is different: it's about abandoning calculation for *systematically unknowable* long-term chains *regardless* of the claimed stakes, often *because* the probabilities become effectively undefined, not just tiny. The skepticism is about the *tractability of the model itself*, not just the probability estimate of a specific outcome.
  *   **Risk Aversion:** This is a preference for certainty over uncertainty with the same expected value, or an aversion to potential losses. The truncation move isn't primarily about *preferring* certainty; it's about declaring the uncertainty *intractable* and defaulting to the visible near-term effects. The symmetry assumption ensures that this default *approximates* the risk-neutral position, but it's a distinct step. You could be risk-averse *within* the near-term calculation while still truncating the long-term.

  **Does anyone defend it?**

  Yes, but often implicitly or pragmatically rather than with rigorous philosophical justification for the symmetry:

  1.  **Pragmatic Necessity:** The most common defense: exhaustive calculation is impossible. We *must* truncate somewhere to act. Assuming symmetry/cancellation is the simplest, most neutral default in the absence of evidence for systematic bias. It's seen as the least bad option.
  2.  **Epistemic Modesty:** Arguing that we genuinely have *no reason* to think the net long-term effect is systematically positive *or* negative for most interventions. Since we lack evidence of asymmetry, symmetry is the appropriate null hypothesis. (This is controversial – critics argue the null hypothesis should be "unknown," not "zero").
  3.  **Focus on Tractability (EA):** Many in Effective Altruism explicitly argue for focusing on interventions with clear, measurable near-term impacts (like bed nets) *precisely because* of cluelessness. They defend this by pointing to the high confidence in the near-term good and the inability to do better with the long-term. The symmetry assumption is often the unstated bedrock making this focus seem reasonable compared to interventions aimed at very long-term, speculative futures.
  4.  **Local vs. Global Optimism:** Some argue that while *individual* actions might have unpredictable long tails, *patterns* of beneficial actions (like consistent charitable giving) are *likely* to have net positive long-term effects, even if we can't trace them. This justifies focusing on the near-term good as a proxy. This is still a form of the symmetry/cancellation assumption applied at a meta-level.

  **In Summary:**

  *   The **Cancellation Assumption** or **Symmetry Assumption** names the core premise you identified: that unknowable long-term effects net to zero.
  *   **Expected Value Myopia** or **Near-Termism** names the practical decision to truncate the causal chain and focus only on near-term, tractable consequences.
  *   **Negligibility Heuristic** describes treating the long-term as having effectively zero expected value.
  *   **Bounded Rationality / Satisficing** provides the overarching framework explaining *why* we use these heuristics.

  The truncation move is **the dominant practical response to cluelessness**. While defended on pragmatic grounds ("we have to act"), the crucial **Symmetry Assumption** underpinning it is rarely rigorously justified; it's largely treated as a necessary, neutral default. Critics rightly point out that this assumption is substantive and potentially flawed, but alternatives (like trying to model the truly long-term) often seem even less feasible or more prone to error. It's a fundamental tension in applied utilitarianism that remains unresolved. Your observation that this move "does real work" by enabling action while smuggling in an unargued premise is exactly right and highlights a core challenge in consequentialist ethics.
