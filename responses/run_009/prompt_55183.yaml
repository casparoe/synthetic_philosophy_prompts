answer: |-
  ## Joint Statement: Emotions Working Group  
  *After 6 Months, 42 Meetings, and 17 Potlucks*  

  **Look, we all agree on this much:**  
  1.  **Emotions are real phenomena.** They are psychologically potent, nameable states/processes that play central roles in cognition, motivation, and social life. They are not epiphenomenal.  
  2.  **Emotions possess intentionality.** They are *about* something (e.g., fear is about a threat, guilt is about a transgression). This "aboutness" is a core feature of emotional experience and reporting.  
  3.  **Emotions involve bodily changes and evaluative components.** Both bodily perturbations (autonomic, hormonal, expressive) *and* some form of evaluation/appraisal concerning the significance of a situation for the subject reliably co-occur with paradigmatic emotional episodes.  
  4.  **There is bi-directional influence.** Evaluative appraisals *can* cause bodily changes, *and* perceptions of bodily changes *can* influence evaluative appraisals. The causal pathways are complex and context-dependent.  
  5.  **Phenomenology matters.** Emotions feel like something to the subject. Any adequate account must address the distinctive "what-it's-like-ness" of fear, joy, anger, etc.  
  6.  **Core disagreements remain.** We fundamentally disagree on the *essential nature* and *primary constitutive components* of an emotion.  

  **Here's Exactly Where We Still Disagree:**  

  | Aspect                     | Judgment/Appraisal Camp (Camp J)                                                                 | Bodily Feeling Camp (Camp B)                                                                 |
  | :------------------------- | :----------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------ |
  | **Core Constitutive Element** | An emotion (e.g., fear) *is* (or essentially, constitutively involves) an evaluative appraisal (e.g., the judgment or construal of a situation as dangerous). | An emotion (e.g., fear) *is* the perception (interoceptive & proprioceptive) of a specific pattern of bodily changes (arousal, tension, flight impulse). |
  | **Role of Bodily Changes** | Bodily changes are frequent, important *causal consequences* or *correlates* of the core appraisal, but not constitutive of the emotion itself. | Bodily changes and their perception *are* the emotion. Their specific pattern defines the emotion type. |
  | **Role of Appraisal**      | The evaluative appraisal *is* the core intentional content of the emotion. Its "aboutness" is intrinsic. | Appraisals are often rapid cognitive *precursors* or *interpretations* that trigger the bodily pattern, or *consequent interpretations* of the bodily feeling. The "aboutness" is derived. |
  | **Token-Reflexivity / Self-Involvement** | Emotions are inherently self-involving. Fear isn't just "danger exists," it's "*I am* threatened *here and now*." This first-personal perspective is essential. | Bodily feelings are inherently first-personal (it's *my* body). While appraisals *can* be self-involving, the core emotional state (the feeling) doesn't *necessarily* require a complex self-referential judgment beyond the bodily perception. |
  | **"Recalibrational" Emotions (Guilt, Shame, Emb.)** | These powerfully demonstrate the primacy of appraisal. Their core is a self-evaluative judgment (e.g., "I violated a norm I endorse"). Bodily feelings are variable and secondary. | These *do* have characteristic, detectable bodily profiles (e.g., gaze aversion, slumped posture, warmth/blushing - though variable), and the feeling *is* the emotion. The "self-judgment" is a cognitive overlay or cause/consequence. |

  **The Cruxes: What Would Actually Change Minds (or At Least Force a Rethink)?**  
  We commit to the following test cases/predictions:

  1.  **The Recalibrational Challenge:**
      *   **Case:** Imagine a subject who sincerely judges "I have committed a serious moral transgression against someone I care about" (full Camp J appraisal for guilt) but reports *absolutely no* concomitant bodily feelings (no visceral unease, no lump in throat, no urge to avert gaze, no flushing, no muscular tension associated with guilt – perhaps due to a novel neuro-intervention or hypothetical blocker). *Would this subject be experiencing genuine guilt?*
      *   **Camp J Prediction:** YES. The core constitutive element (self-condemning appraisal) is present. The lack of feeling is a deficiency, but the emotion itself is present.
      *   **Camp B Prediction:** NO. Without the perception of the characteristic (though variable) bodily pattern, the emotion "guilt" is absent. This is merely a cold intellectual judgment.

  2.  **The Pure Bodily Challenge:**
      *   **Case:** Imagine a subject who, due to an unusual but non-emotional cause (e.g., specific drug, direct brainstem stimulation, intense but non-fearful physical exertion), reliably experiences *all* the physiological and expressive patterns characteristic of intense fear (racing heart, sweating, trembling, widened eyes, adrenaline surge, flight impulse) *without* any appraisal of threat or danger. The subject is fully aware the bodily state is artificially induced and non-threatening. *Is this subject experiencing fear?*
      *   **Camp J Prediction:** NO. The constitutive appraisal ("This is dangerous to me") is absent. This is mere "fear-like" arousal or panic, not genuine fear with its intentional object.
      *   **Camp B Prediction:** YES. The perception of the specific bodily pattern *is* fear. The lack of a congruent appraisal is a dissociation, but the emotion is present.

  3.  **The Emotional Contagion / Mirroring Challenge:**
      *   **Case:** Consider rapid, unconscious emotional contagion – e.g., instantly "catching" fear from a crowd's panic, or sadness from a loved one's tears, *before* any conscious appraisal of the situation. Does this initial "caught" state constitute the full emotion?
      *   **Camp J Prediction:** NO. This initial state is a precursor – perhaps a bodily reaction or primitive affect – but the full emotion (e.g., fear) requires the appraisal that grounds its specific intentionality ("*I* am in danger *here*").
      *   **Camp B Prediction:** YES. The rapid mirroring involves perceiving bodily changes (in oneself, triggered by perception of others' expressions/state) that constitute the core emotional state. Appraisal may follow and refine it.

  4.  **The Token-Reflexivity Challenge:**
      *   **Case:** Can a subject experience a genuine emotion like fear or shame directed *solely* at a *hypothetical* or *impersonal* scenario (e.g., fear about "danger existing somewhere in the abstract universe," shame about "a norm violation occurring in general") without any sense that *they themselves, here and now*, are threatened or culpable?
      *   **Camp J Prediction:** NO. Genuine fear/shame inherently involves a token-reflexive, self-involving appraisal ("*This* threatens *me* now," "*I* did *this* wrong"). Abstract fear/shame is conceptually related but lacks the core self-involving character of the emotion proper.
      *   **Camp B Prediction:** POSSIBLY YES. Intense bodily feelings *could* be triggered by abstract contemplation (e.g., existential dread, vicarious embarrassment). The feeling *is* the emotion, even if the appraisal is impersonal or hypothetical. The self-involvement is frequent but not strictly essential to the bodily state.

  **Possible Verbal Stumbling Block:**  
  We suspect some disagreement may stem from differing focal uses of the term "emotion." Camp J often focuses on the *intentional core* – the specific evaluative stance defining the emotion's type and object. Camp B often focuses on the *phenomenal core* – the distinctive bodily feeling that characterizes "what it's like." Both agree these aspects are deeply intertwined in typical cases but disagree on which is constitutive. Clarifying whether we are asking "What *defines* fear as fear (its identity)?" (Camp J: appraisal) vs. "What *is* the fundamental experiential component?" (Camp B: bodily feeling) might sometimes resolve apparent contradictions. However, we agree the core ontological claim ("What *is* an emotion?") remains a substantive disagreement.

  **Signed,**  
  *The Exhausted But Still Talking Members of the Emotions Working Group*  
  *(Names Illegible Due to Coffee Stains and Lingering Tension)*

  ---
  **Note on Historical Interpretation:** The characterization of Camp B draws inspiration from James-Lange but is framed in contemporary terms (e.g., "perception of patterned bodily changes"). The historical James-Lange theory itself is subject to various interpretations (e.g., concerning the *specificity* of patterns, the role of *visceral* vs. *skeletal* feedback). This statement does not assert that our Camp B view is identical to James's or Lange's original formulations.
