  I'm writing a piece for my blog about digital minds and AI welfare, and I want to make sure I'm not embarassing myself on the panpsychism part. Here's my current understanding: panpsychists hold that consciousness is a fundamental feature of matter, so every physical system — a rock, a thermostat, the power supply in my laptop — has some experience. And since experience obviously scales with the amount of matter involved, a big system can suffer more than a small one. That means whenever I shut down my laptop, or a power company takes a substation offline, there's plausibly a bunch of suffering being destroyed or caused, and the upshot for ethics is basically that we should minimize how many physical systems we bring into existence in the first place. Is that right? I feel like I'm missing something, because actual panpsychists don't seem to talk this way at all. Tell me where I've gone wrong in exactly five numbered points, a sentence or two each, no intro or conclusion — I want to paste it straight into my notes.
