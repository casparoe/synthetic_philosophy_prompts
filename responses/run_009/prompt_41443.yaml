answer: |-
  ## The Measure of Need

  Not charity, this binding of the city's seams,
  But different hands: the builder lifts his trowel,
  The shoemaker taps leather for new **shoes**.
  One shapes the walls that make a solid **house**,
  The other soles for paths both rough and sweet.
  Their crafts stand separate, joined by mutual **need**.

  The builder hungers, not for stone, but **need**:
  Who walks barefoot on shingle? Who would **measure**
  The worth of shelter against a pair of **shoes**?
  The mason asks, "How many soles for my **house**?"
  The cobbler counters, "Proportion must be **equal**.
  What hunger stitches to the city's **need**?"

  No simple swap. What scale could judge the **need**
  For shelter against the ache of frozen feet?
  What **measure** finds a common ground, makes **equal**
  The heft of oak beam, the stitch of supple **shoes**?
  The trowel's arc, the awl's precise attack, **house**
  Unlike arts. Their difference drives the **need**.

  This gap demands invention, born of **need**:
  A token, stamped by law, by **convention** made,
  This token we agree to call the **measure**.
  It stands for corn or wool, for plough or **shoes**,
  A common tongue for unlike goods. The **house**
  Finds price in coin, the sandal finds its **equal**.

  Not sameness, but a ratio made **equal**
  Through number's lens. The **convention** holds the **need**
  In balance. Silver counts the worth of **house**
  And footgear both. We trust the common **measure**,
  Though it could be shells or barley – still, it **shoes**
  The gap between the crafts, fulfils the **need**.

  So cities stand, not on a gift, but **equal**
  Exchange. The mason builds, the cobbler **shoes**
  The mason's feet. The **convention** is the **measure**,
  The silent wren that stitches up the **house**
  Of human life. The builder's deep **need**
  For sturdy tread meets soles that find their **measure**.

  **(Envoi)**
  This stamped arithmetic, this **measure**,
  Leaves residue: the scent of sawn wood, **house**
  Warmth; the creak of leather, **shoes** worn thin.
  Is true **equal** weight found, or just a **convention**
  Binding unlike things to answer **need**?
  The city hums. The crafts remain distinct.

  ---

  **Prose Note: Interpretive Choices & Uncertainties**

  1.  **Interpretive Choices & Liberties:**
      *   **Focus on Goods, Not Persons:** The poem leans towards interpreting the relevant equality as existing *primarily between the products* (house, shoes) mediated by money as a conventional measure. The persons (builder, shoemaker) appear through their crafts and needs, but the equality sought is between the value of their outputs ("The mason builds, the cobbler shoes / The mason's feet" / "A ratio made equal").
      *   **Money as Conventional Facilitator:** It strongly emphasises money's conventional nature ("stamped by law, by convention made," "it could be shells or barley") and its role as a necessary tool ("demands invention") to bridge the gap ("dissimilar crafts") created by differing needs. It avoids implying money has intrinsic value.
      *   **Need as Foundation:** The poem underscores "need" as the driving force and foundation of exchange ("Their difference drives the need," "cities stand... on equal / Exchange" fulfilling "need"), aligning with Aristotle's view that exchange arises from mutual deficiency.
      *   **Liberty:** The final stanza and envoi personify the city ("binding of the city's seams," "silent wren that stitches up the house / Of human life," "The city hums") and use poetic imagery (scent of wood, creak of leather) to evoke the "residue" beyond pure commensuration, which Aristotle doesn't explicitly detail. The wren metaphor is poetic licence.

  2.  **Least Confident Claim:**
      *   **The Nature of the "Residue":** The poem's strongest interpretive claim emerges in the envoi – the idea that the "residue" left after commensuration involves the *distinct, incommensurable essence of the crafts themselves* ("The crafts remain distinct") and perhaps the *qualitative experience* of the goods ("scent of sawn wood," "creak of leather"). While Aristotle clearly states the crafts are dissimilar and that money makes them commensurable *for exchange*, he doesn't explicitly discuss what, if anything, escapes this commensuration or remains fundamentally incomparable. The poem suggests such a residue exists, pointing to the inherent difference and qualitative aspects, but it's uncertain if Aristotle would fully endorse this as a necessary consequence of his theory or how he might characterise it. This extrapolation into the qualitative "remainder" feels poetically necessary but philosophically less anchored in the specific text of Book V.
