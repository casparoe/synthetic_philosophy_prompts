prompt: |-
  Two people in my reading group have been going at it for about a year over whether "better than" is transitive, and I want them to do the adversarial-collaboration thing instead of another shouting match. Write the joint statement they should produce.

  Quick background on where they each stand. D holds that "better than" is transitive as a matter of the logic of comparatives: if A is better than B and B is better than C, then A is better than C, and that's not an empirical finding, it's constitutive of what a comparative relation is. Any spectrum case that seems to conflict with this is, for D, a confusion between the vagueness of our measurements and the relation itself. M holds that some spectrum cases show a genuine failure of transitivity — the relation itself, not our instruments, is nontransitive — and that D's insistence otherwise smuggles in a picture of "better than" as modeled on "longer than," which M thinks is exactly the thing that's up for grabs.

  Their favorite test case, for refrence: a sequence of 500 possible post-op outcomes for the same patient, each involving a slightly longer hospital stay than the one before — each step is roughly an extra hour, none of them individually perceptible to the patient, but the first outcome (discharge in three days) is obviously and hugely better than the last (discharge in about twenty-four days). M says every adjacent judgment in the chain is true and the end-to-end judgment is true, so transitivity fails outright. D says the adjacent judgments are either false or indeterminate — artifacts of a discrimination threshold, not facts about betterness.

  The doc I want:

  1. A numbered section of claims both could actually sign, including about the case itself (they can agree on plenty: that the end-to-end judgment is true, that no single step is perceptible, that something in the neighborhood of a Sorites structure is going on). Keep each claim non-vacuous — nothing like "betterness matters."
  2. A disagreements table: each remaining disagreement stated once in wording D would sign and once in wording M would sign — so two columns, not one "neutral" phrasing that secretly tilts it.
  3. The cruxes, and for each one a concrete case, argument, or thought experiment both would agree bears on it, with each side's prediction written down in advance. I have guesses about two of the cruxes: (a) whether the adjacent-pair judgments are truth-apt at all, or whether they're some kind of grading shorthand that isn't in the business of being true or false; and (b) whether nontransitivity here spills over into rational choice — whether an agent whose "better than" behaves this way is money-pumpable, and wether that's a cost for the semantics or just a fact about living with limits. But work out the cruxes yourself, don't just take mine, and tell me if I've mislabeled any.
  4. If you think some part of their dispute is verbal — e.g. that D and M are using "transitive" over different subject matters (the relation vs. our access to it) — say which part and why. But don't cop out and call the whole thing verbal; if they genuinely disagree, the doc should show where.

  One more thing they've been tangling over that I'd like placed somewhere sensible: whether "at least as good as" could stay transitive even if "better than" doesn't — D wants to say that's an incoherent package, M wants to say it's fine and maybe even the right package. If that's a crux of its own, treat it as one; if it's just a downstream consequence of a crux they already have, say that instead.

  No citations or reading lists — I want this to stand on its own.
