  Now, for the exact formulation. Jeffrey conditionalization updates the posterior probability when the evidence is uncertain. The formula is P_new(H) = P_old(H|E) * P_new(E) + P_old(H|~E) * P_new(~E). The user's partial update seems similar, where the shift is proportional to trust, which is like setting P_new(E) based on reliability. But Jeffrey's assumes that the input is the new probability of E, not how reliability affects the shift. So the user's rule is an instance where P_new(E) is determined by trust.

