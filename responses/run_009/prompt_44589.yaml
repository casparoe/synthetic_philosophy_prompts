answer: |-
  Your practice is a perceptive and mathematically coherent approach to uncertain evidence, known in formal epistemology as **Jeffrey Conditionalization** (or Jeffrey updating). It's an extension of Bayesian updating for cases where the evidence itself is uncertain. Let's carve it precisely.

  **1. The Established Name and Formulation: Jeffrey Conditionalization**

  *   **Core Idea:** When you receive uncertain evidence `E` (e.g., the instrument reading or the rumor), you don't set `P(E) = 1` (as in standard Bayesian updating). Instead, you directly specify a *new* probability distribution over the possible evidence states based on your assessment of the source's reliability and the observation itself. Your posterior belief in hypothesis `H` (e.g., "the material property is X") is then a weighted average of what it *would* be if `E` were certainly true and what it would be if `E` were certainly false, weighted by your *new* probabilities for `E` and `~E`.
  *   **Exact Formulation:**
      Let:
      *   `P_old(H)` = Your prior belief in `H`.
      *   `P_old(E | H)` = Likelihood of evidence `E` if `H` is true (often based on instrument characteristics).
      *   `P_old(E | ~H)` = Likelihood of evidence `E` if `H` is false.
      *   `P_new(E)` = Your **newly assigned degree of belief** that `E` is true *after* observing the reading/hearing the rumor. This is where your "trust fraction" (`f`) comes in. Crucially, `P_new(E)` is *not* derived from the prior model; it's a direct input reflecting your assessment of the evidence's reliability *in this instance*.

      Jeffrey Conditionalization calculates the posterior belief in `H` as:
      `P_new(H) = P_old(H | E) * P_new(E) + P_old(H | ~E) * P_new(~E)`

      Where:
      *   `P_old(H | E) = [P_old(E | H) * P_old(H)] / P_old(E)` (Standard Bayes for if `E` were certain)
      *   `P_old(H | ~E) = [P_old(~E | H) * P_old(H)] / P_old(~E)` (Standard Bayes for if `E` were certainly false)
      *   `P_new(~E) = 1 - P_new(E)`

  *   **Connection to Your Rule:** Your "shift confidence by a fraction" is mathematically equivalent to setting `P_new(E) = f` (your trust fraction for the source *this time*) and then applying the formula above. If `f=1`, it reduces to standard Bayesian updating. If `f=0.8`, you are effectively saying "after this observation, I am 80% sure `E` is true and 20% sure it's false," and `P_new(H)` is the corresponding weighted average.

  **2. The Entanglement Problem (Your First Concern)**

  *   **The Issue:** You correctly identify a flaw: your trust in the instrument (`f`, or `P_new(E)`) should ideally depend *only* on the instrument's reliability characteristics and *not* on the hypothesis `H` or the specific reading `E`. However, you (and most humans) find it harder to trust surprising results (`E` contradicts `P_old(H)`) than confirming ones (`E` matches `P_old(H)`). This means `P_new(E)` becomes entangled with `H` and `E`.
  *   **What Jeffrey Assumes (The Rigidity Assumption):** Jeffrey Conditionalization relies critically on the **Rigidity Assumption**: `P_new(H | E) = P_old(H | E)` and `P_new(H | ~E) = P_old(H | ~E)`. This means that *conditional on the truth value of `E`*, your beliefs about `H` don't change just because `E` became uncertain. Your assessment of the instrument's reliability (`P_new(E)`) should *only* affect your belief about `E` itself, not the relationship between `E` and `H`.
  *   **Where the Assumption Fails (Entanglement):** Your habit of adjusting trust based on surprise **violates the Rigidity Assumption**. If the surprising reading makes you doubt the instrument *more* than a confirming reading would, then `P_new(H | E)` might actually be *lower* than `P_old(H | E)`! You are learning not just about `E`, but potentially about the instrument's reliability *in a way correlated with `H`* (e.g., "this machine tends to fail when readings are extreme" or "my colleague exaggerates bad news"). Your simple rule has nothing to say here because it treats `f` as an independent input.
  *   **The Right Treatment (Conceptually):** To handle entanglement, `H` must be expanded to include the instrument's reliability state (`R`). You need hypotheses like:
      *   `H1`: The material property is `X` *and* the instrument is reliable.
      *   `H2`: The material property is `X` *and* the instrument is faulty.
      *   `H3`: The material property is *not* `X` *and* the instrument is reliable.
      *   `H4`: The material property is *not* `X` *and* the instrument is faulty.
      You need prior beliefs about the material property *and* the instrument's reliability (possibly conditional on the true state), and likelihoods for the reading `E` given each joint hypothesis `(H, R)`. Updating on `E` then simultaneously updates your belief about the material *and* the instrument's reliability. This is significantly more complex but necessary for entangled cases. Hierarchical Bayesian models formalize this.

  **3. Order-Dependence (Your Second Concern)**

  *   **The Phenomenon:** Order-dependence in sequential Jeffrey updates is a **known and studied phenomenon**. It is *not* inherently sloppiness or incoherence, but a consequence of how `P_new(E)` is specified.
  *   **Why it Happens:** The core issue is that the input to Jeffrey Conditionalization (`P_new(E)`) for the *second* piece of evidence often **depends on your *current* state of belief** (`P_current(H)`), which was just updated by the *first* piece of evidence. Your assessment of the second instrument's reliability (`f2` or `P_new(E2)`) might be influenced by whether `E2` confirms or contradicts the new `P_current(H)` resulting from the first update. Since the first update changes `P_current(H)`, the surprise (and thus `P_new(E2)`) caused by `E2` depends on the order.
  *   **Mathematical Condition for Order-Dependence:** Sequential Jeffrey updates commute (order doesn't matter) **if and only if** the `P_new(E)` assigned for each piece of evidence depends *only* on the evidence itself and the *original prior* (`P_old(H)`), *not* on any intermediate posterior belief. If your assessment of trust/`P_new(E)` for the second piece of evidence changes based on the posterior resulting from the first update, order-dependence is inevitable.
  *   **Is it "Real"?** Yes, it reflects a genuine feature of learning under uncertain evidence where the *credibility assessment of later evidence depends on what you learned from earlier evidence*. Imagine:
      1.  **Order A (Confirm then Surprise):** Instrument 1 (moderately trusted) gives a reading confirming your prior. You trust it, update `P(H)` up. Instrument 2 (same nominal trust) now gives a surprising reading (contradicting the new `P(H)`). You heavily discount it (`f2` low), small update down.
      2.  **Order B (Surprise then Confirm):** Instrument 2 gives the surprising reading first. You discount it (`f2` low), small update down. Instrument 1 now gives a reading confirming your *slightly lowered* prior. It's less surprising, you trust it (`f1` high), update up significantly.
      The final `P(H)` could easily differ. The key is that your interpretation/discounting of the second reading *changed* based on the result of the first reading. This path-dependence captures the context-sensitivity of evidence interpretation.
  *   **Avoiding Order-Dependence:** To force order-independence, you must:
      *   **Batch Processing:** Treat both readings `E1` and `E2` as a single composite piece of uncertain evidence and assign `P_new(E1, E2)` directly based on your joint assessment of the sources' reliability and the readings, relative to your *original prior*. Then apply Jeffrey's rule once. This is often impractical.
      *   **Stable Reliability Assessment:** Ensure your assessment of trust `f` (`P_new(E)`) for each source depends *only* on the source and the specific reading, *not* on your current belief state `P_current(H)`. This is difficult for humans and often unrealistic.
      *   **Model Reliability Explicitly:** Use the expanded hypothesis space (`H` and `R`). Updating on `E1` and `E2` sequentially within this joint space *will* be order-independent (like standard Bayes) because the evidence is treated as certain (`P(E)=1`) within the model, and reliability `R` is part of the hypothesis being updated. The complexity moves into defining the larger model.

  **Summary & The Carving**

  1.  **Name:** Your practice is **Jeffrey Conditionalization**.
  2.  **Formulation:** `P_new(H) = P_old(H|E) * P_new(E) + P_old(H|~E) * P_new(~E)`, where `P_new(E)` is your direct assessment of the evidence's credibility (your trust fraction `f`).
  3.  **Core Assumption:** Rigidity (`P_new(H|E) = P_old(H|E)`, `P_new(H|~E) = P_old(H|~E)`). This assumes the *relationship* between `E` and `H` is unchanged; only your belief about `E` itself changes.
  4.  **Where it Fails (Edges):**
      *   **Entanglement:** When the reliability of the evidence source is correlated with the hypothesis `H` or depends on the specific reading `E` in a way that violates rigidity (e.g., trusting confirming results more than surprising ones). Fixing this requires expanding the hypothesis space to include reliability (`H x R`) and using standard Bayesian updating within that larger space.
      *   **Order-Dependence:** When the assessment of trust (`P_new(E)`) for later evidence depends on the posterior belief resulting from earlier updates. This is a recognized consequence of context-sensitive reliability assessment. Order-independence requires either batching evidence or having stability in `P_new(E)` assignments independent of belief state changes (or modeling reliability explicitly).
  5.  **Order-Dependence Status:** It is a **genuine feature** of sequential Jeffrey updating when reliability assessments are belief-state-dependent. It is not inherent sloppiness, but reflects the contextuality of evidence interpretation under uncertainty. It disappears only under restrictive conditions (stable `P_new(E)` or batching/explicit reliability modeling).

  Your intuitive "proportionality rule" is a significant insight, placing you squarely within a formal framework developed for uncertain evidence. The entanglement and order-dependence you observe highlight the limitations of the simple Jeffrey rule and point towards the complexities of real-world belief revision where the source's reliability is itself uncertain and context-dependent. Hierarchical Bayesian modeling is the primary tool for carving these entangled situations precisely.
