    Case: Sam is in a room with only one exit. Sam decides to leave the room and does so. Unbeknownst to Sam, the door was locked from the outside, but just as Sam tried the handle, a gust of wind blew the door open. So Sam could have stayed in the room, but only by not trying to leave.
