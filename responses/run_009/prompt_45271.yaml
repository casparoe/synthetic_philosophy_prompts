    Options:
      A. Yes, because Riley exercised self-control.
      B. No, because Riley's desire to be healthy was determined by factors beyond their control.

  Question 10: Moral luck
    Case: Two drivers, each texting while driving, run a red light. One is lucky and doesn't hit anyone. The other is unlucky and hits a pedestrian, causing severe injury.
    Question: Is the unlucky driver more blameworthy than the lucky one?
    Options:
