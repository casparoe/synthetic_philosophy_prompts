answer: |-
  Below is a 12-question quiz designed to sort participants into theories of free will based on their intuitions about concrete cases, without mentioning technical terms, determinism, or philosopher names. The questions focus on key disagreements in the logical space (ability to do otherwise, sourcehood, desert, and implications of determinism). Each case is followed by 2–3 answer options. The **scoring key** maps answer patterns to specific theories, flags indistinguishable pairs, and notes contested cases where professionals disagree. It also identifies incoherent/unoccupied answer combinations.

  ---

  ### **Quiz: Which Theory of Free Will Do You Hold?**  
  *Instructions: For each scenario, choose the answer that best matches your intuition. Answer based on the case, not prior philosophical knowledge.*  

  1. **Neuroscientist Case**: Alex is deciding whether to cheat on a test. Unbeknownst to Alex, a neuroscientist monitors their brain and will force Alex to cheat if they show signs of deciding not to. Alex decides to cheat without intervention.  
     - A. Alex is responsible for cheating.  
     - B. Alex is not responsible for cheating.  

  2. **Unwilling Addict**: Taylor is addicted to a drug. Taylor desperately wants to quit but always gives in to cravings. Today, Taylor takes the drug while hating themselves for it.  
     - A. Taylor is responsible for taking the drug.  
     - B. Taylor is not responsible for taking the drug.  

  3. **Engineered Reasoning**: Robin was raised from infancy by neuroscientists who engineered Robin’s brain to be selfish. As an adult, Robin steals money after coolly reasoning it benefits them (exactly as intended).  
     - A. Robin is responsible for stealing.  
     - B. Robin is not responsible for stealing.  

  4. **Identical Universes**: Two universes are identical in every detail. In both, Jamie decides whether to donate to charity. In one, Jamie donates; in the other, Jamie does not.  
     - A. The difference is due to pure chance.  
     - B. The difference cannot happen—Jamie must choose the same in both.  

  5. **Reshaped Character**: Casey grew up in a violent home and had a quick temper. Over ten years, Casey deliberately trained themselves to become patient. Now, when provoked, Casey stays calm.  
     - A. Casey is more responsible for their calm reaction now than for a violent reaction in their youth.  
     - B. Casey is equally responsible (or not) for both reactions.  

  6. **Determinism and Regret**: Suppose every event (including decisions) is caused by past events and natural laws. If someone does something terrible, can they appropriately feel deep regret?  
     - A. Yes, they can feel deep regret.  
     - B. No, they cannot feel deep regret.  

  7. **Sourcehood**: Morgan commits a crime. The causes of Morgan’s decision trace entirely to factors beyond their control (genes, upbringing).  
     - A. Morgan is not responsible.  
     - B. Morgan is responsible.  

  8. **Desert-Based Punishment**: Someone does a terrible wrong. Punishing them would not reform, deter, or protect society—it would only make them suffer.  
     - A. It is just to punish them (they deserve it).  
     - B. It is not just to punish them.  

  9. **Self-Control**: Riley has a strong urge to eat unhealthily but a stronger desire to be healthy. Riley resists temptation and eats healthily.  
     - A. Riley is responsible for eating healthily.  
     - B. Riley is not responsible for eating healthily.  

  10. **Moral Luck**: Two drivers text while running a red light. One is lucky and hits no one. The other is unlucky and hits a pedestrian.  
      - A. The unlucky driver is more blameworthy.  
      - B. Both are equally blameworthy (or not).  

  11. **Locked Door**: Sam decides to leave a room with one exit. Unbeknownst to Sam, the door was locked, but a gust of wind blew it open when Sam tried it. Sam could have stayed only by not trying to leave.  
      - A. Sam could have stayed in the room.  
      - B. Sam could not have stayed in the room.  

  12. **Deep Self**: Jordan has a strong urge to gamble but believes gambling is foolish and wants to save money. When the urge overwhelms them, Jordan gambles.  
      - A. Jordan acts freely when gambling.  
      - B. Jordan does not act freely when gambling.  

  ---

  ### **Scoring Key**  
  Compare your answers to the profiles below. The theory with the **most matching answers** is your closest fit. If multiple theories match equally, see "Indistinguishable Pairs." Contested cases (🐔) reflect professional disagreement.  

  | Theory                          | Answers (Q1–Q12)                                                                 | Notes                                                                 |
  |---------------------------------|---------------------------------------------------------------------------------|-----------------------------------------------------------------------|
  | **Event-Causal Libertarianism** | 1B, 2B, 3B, 4A, 5A, 6B, 7A, 8A, 9A, 10B, 11A, 12B                                | Requires indeterminism and sourcehood; emphasizes ability to do otherwise. |
  | **Agent-Causal Libertarianism** | Same as event-causal libertarianism (see "Indistinguishable Pairs" below).        | Differs only in theory (not cases) by positing a non-physical "agent cause." |
  | **Hard Determinism**            | 1B, 2B, 3B, 4B, 5B, 6B, 7A, 8B, 9B, 10B, 11B, 12B                                | Denies free will/responsibility if determinism is true.               |
  | **Hard Incompatibilism**        | Same as hard determinism (see "Indistinguishable Pairs" below).                   | Denies free will/responsibility even if indeterminism is true.        |
  | **Classical Compatibilism**     | 1A, 2A, 3A, 4B, 5B, 6A, 7B, 8B, 9A, 10B, 11A, 12A                                | Defines "could have done otherwise" conditionally (e.g., "if they wanted to"). |
  | **Reasons-Responsiveness View** | 1A, 2B, 3B, 4B, 5A, 6A, 7B, 8B, 9A, 10B, 11A, 12B                                | Focuses on responsiveness to reasons, not ability to do otherwise.    |
  | **Frankfurt’s Hierarchical View** | 1A, 2B, 3A🐔, 4B, 5A, 6A, 7B, 8B, 9A, 10B, 11A, 12B                              | Requires alignment with one’s "deep self" (values/higher-order desires). |
  | **Dennettian View**             | 1A, 2A, 3A, 4B, 5A, 6A, 7B, 8B, 9A, 10B, 11A, 12B                                | Rejects desert-focused free will; emphasizes self-control/social value. |

  #### **Indistinguishable Pairs**  
  The quiz **cannot separate** these pairs, as they share all case verdicts:  
  - **Event-causal vs. agent-causal libertarianism**: They agree on cases (e.g., Q4’s "chance" answer). They diverge only in *how* indeterminism enables freedom (event-causation vs. agent-causation), not in judgments.  
  - **Hard determinism vs. hard incompatibilism**: They agree on cases (e.g., Q6’s "no regret"). Hard incompatibilism extends hard determinism’s verdicts to indeterministic worlds.  

  #### **Contested Cases (🐔)**  
  Professionals disagree on how certain cases should be interpreted. If your answer matches a 🐔, your result may align with one side of the debate:  
  - **Q3 (Engineered Reasoning)**: *Frankfurtians* often say "A" (responsible if Robin endorses their actions), while *manipulation argument defenders* (e.g., Pereboom) say "B" (not responsible, as engineering undermines ownership).  
  - **Q1 (Neuroscientist)**: *Compatibilists* say "A" (intervener irrelevant if unused), while *leeway theorists* say "B" (responsibility requires ability to do otherwise, which the intervener negates).  

  #### **Incoherent or Unoccupied Combinations**  
  - **Incoherent**: Answers requiring both determinism and indeterminism (e.g., Q4A + Q4B) or desert without agency (e.g., Q8A + Q7A).  
  - **Unoccupied**: No major theory holds, e.g.:  
    - `1A, 2B, 3A, 4A, ...` (combines compatibilist Q1 with libertarian Q4). Diagnosed as *inconsistent* if Q4A (chance) contradicts Q1A (responsibility under determinism-like control).  
    - `1B, 2A, 3B, 4B, ...` (denies PAP in Q1 but affirms responsibility for addiction). Diagnosed as *unoccupied*—theories don’t pair these verdicts.  

  #### **Final Sorting Insight**  
  \answer{Q6 (Determinism and Regret) does the most sorting work, as it cleanly separates compatibilists (A) from incompatibilists (B), the deepest divide in free will debates.}
