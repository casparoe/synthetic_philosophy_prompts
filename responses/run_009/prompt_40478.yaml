prompt: |-
  i'm in a reading group that went through Dennett's Darwin's Dangerous Idea last month, and one image stuck with everybody: explaining complex things is either building them up from below with cranes — gradual, mindless processes that accumulate design over time, natural selection being the paradigm case — or hoisting them from above with skyhooks, some intelligence reaching down and doing the designing work in one go. the way my group uses it now, anything that can't currently be given a crane-style story is a skyhook, which basically amounts to an appeal to magic. one friend has started applying this everywhere: he says free will is a skyhook that neuroscience will eventually dismantle, moral realism needs a skyhook because evolution can explain why we hold moral beliefs but not (in his telling) what makes any of them true, and consciousness research should give up on the subjective feel stuff and just look for the cranes or admit there are none.

  someone else pushed back that this is exactly the greedy reductionism Dennett warned about — that my friend is using crane-talk to skip the actual explanatory work, declaring problems solved just by classifying them as crane-shaped, without ever building the crane. and honestly i can see both sides, so i want an audit of the crane/skyhook analogy itself as it's being used in our arguments: what maps onto what, where the mapping breaks, what the analogy quietly assumes about what counts as an explanation, and whether my friend's conclusions survive once all that is on the table.

  format-wise: give me exactly five numbered points, each one or two sentences, no intro and no conclusion. (1) the correspondence in prose — what plays the role of the crane, the skyhook, the ground it builds from, and the thing being lifted; (2) the main place the analogy breaks when applied to free will, moral realism, or consciousness; (3) what it smuggles in about explanation being all-or-nothing; (4) your verdict on whether my friends conclusions survive; (5) whether greedy reductionism is actually the right name for his mistake or whether its a different one dressed in the same clothes. keep it in the weeds — no textbook intro to Dennett, we've all read the book. no reading lists either, just the reasoning.
reasoning: |-
  Hmm, the user is part of a reading group that discussed Dennett's crane/skyhook analogy from Darwin's Dangerous Idea. They're grappling with how a friend is applying this analogy to dismiss concepts like free will, moral realism, and consciousness as "skyhooks" that will eventually be explained away by "cranes" (gradual processes like evolution). Another group member is pushing back calling this "greedy reductionism."

  The user wants me to analyze this application of the analogy through five specific points: the mapping of the analogy elements, where it breaks down, what assumptions about explanation it smuggles in, whether the friend's conclusions hold up, and whether greedy reductionism is the right label for the mistake.

  I need to be precise and concise - exactly five numbered points, one or two sentences each, with no introduction or conclusion. These are philosophy students who've read Dennett, so I can dive straight into the analysis without background explanations.

  For point 1 (correspondence): The crane represents stepwise natural processes (like evolution), skyhooks represent unexplained gaps treated as miraculous, the ground is material reality/physics, and the thing being lifted is the complex phenomenon in question.

  For point 2 (where analogy breaks): It assumes complex phenomena are reducible to constituent parts only, ignoring how emergent properties like consciousness or morality might not be fully captured by bottom-up explanations alone.

  For point 3 (smuggled assumption): It frames explanations as binary (either crane or skyhook), ignoring legitimate explanatory gaps that require new theoretical frameworks rather than just more crane steps.

  For point 4 (verdict on conclusions): The friend's conclusions don't survive because declaring something a crane doesn't constitute actual explanation; it's preemptive dismissal without doing the work.

  For point 5 (greedy reductionism label): Yes it fits perfectly - the friend is using crane-language to claim victory prematurely without building the actual reduction.

  I'll make sure each point is dense with insight but stays within the one-to-two sentence limit, focusing on the conceptual flaws in how the analogy is being weaponized rather than rehashing Dennett's original points.
answer: |-
  1.  The "crane" corresponds to any stepwise, naturalistic process (like evolution or neural mechanisms), the "skyhook" to any unexplained gap treated as miraculous (like dualism or unexplained subjectivity), the "ground" to established physical/material reality, and the "thing being lifted" to the complex phenomenon itself (free will, moral truth, consciousness).
  2.  The analogy breaks by assuming complex phenomena *must* be reducible solely to their constituent parts' interactions, ignoring that emergent properties (like consciousness's subjective feel or normativity in morals) might not be fully captured by, or reducible to, the crane's stepwise assembly alone.
  3.  It smuggles in the assumption that explanation is strictly all-or-nothing: either a phenomenon is fully decomposable into crane steps *right now* (and thus "real"), or it's an illusory skyhook, denying legitimacy to partial explanations or phenomena requiring fundamentally new descriptive levels.
  4.  Your friend's conclusions don't survive: declaring phenomena "skyhooks" prematurely dismisses them without actually providing the crane's step-by-step account, mistaking the *promise* of reduction for its *accomplishment*.
  5.  It's precisely greedy reductionism: using crane-*talk* as a substitute for building the actual crane, thereby declaring complex phenomena explained or illusory solely by labeling them as crane-compatible, without doing the explanatory work.
