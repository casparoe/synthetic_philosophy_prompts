  ## INTERNATIONAL COMMISSION ON THE JOINTS OF NATURE (ICJN)
  **OFFICIAL LIST OF FREQUENTLY ASKED QUESTIONS (FAQ)**
  **Revision 17.3.4b** | **Publication Date: 2023-11-15** | **Supersedes: Revision 17.3.4a**

  **1. What is the mandate of the ICJN?**
  The International Commission on the Joints of Nature (ICJN) is the globally recognized authority vested with the solemn duty of identifying, delineating, and cataloging genuine Natural Kinds. Our mission, as per the Treaty of Salzburg (1951), is to discern the objective, mind-independent joints in nature – the fundamental categories upon which robust inductive inference and lawful generalization depend – and to issue definitive rulings codifying their essential properties and necessary and sufficient conditions for membership. These rulings constitute the *Universal Standard Taxonomy (UST)*.

  **2. How does the ICJN define a "Natural Kind"?**
  A Natural Kind (NK) is an objective ontological category characterized by:
      a)   A set of necessary and sufficient conditions defining membership.
      b)   A shared microstructural essence determining observable properties.
      c)   The capacity to support non-accidental, projectible generalizations.
      d)   Existence independent of human conceptual schemes or practical interests.
  Ruling ICJN-1952-001 (The Water Paradigm) established the archetype: Water (NK-001) is definitively H₂O, possessing the essential microstructure enabling its lawful phase transitions, solvent properties, and density anomalies. Deviations from this model require rigorous justification via Petition Form NK-7A.

  **3. Why are biological entities proving challenging for classification?**
  Biological systems exhibit a regrettable tendency towards non-compliance with idealized essentialist frameworks. Specific challenges necessitating frequent UST amendments include:
      *   **Ring Species (Complex NK-405 "Larus gulls"):** Adjacent populations interbreed, but terminal populations do not, creating a continuous loop without a clear essential discontinuity. Ruling ICJN-1987-044 established an arbitrary "75% genetic similarity threshold" at designated nodal points, acknowledging operational necessity while preserving ontological commitment (See Amendment NK-405-A7).
      *   **Asexual Lineages (e.g., NK-712 "Bdelloid Rotifers"):** The absence of sexual reproduction precludes standard genetic cohesion criteria. Ruling ICJN-2001-118 defines essential kind-membership based on shared derived mutations within clonal lineages exceeding 10⁶ generations, contingent upon molecular clock calibration (Form NK-23D required).
      *   **Intermittent Hybridization (e.g., Provisional NK-P882 "Canis lupus lycaon / Canis latrans"):** Entities display sporadic and context-dependent interbreeding, violating the necessity of reproductive isolation. Ruling ICJN-2015-331 introduced the "Grudging Introgression Coefficient (GIC)," classifying hybrid zones exceeding GIC 0.8 as distinct, unstable meta-kinds pending further ontological review.

  **4. How does the ICJN handle cases like "Jade" where one common name refers to multiple substances?**
  Ruling ICJN-1968-012 (The Nephrite/Jadeite Incident) definitively resolved this confusion. The term "Jade" was deemed a non-kind, a mere practical label lacking ontological rigor. Two distinct Natural Kinds were established:
      *   NK-102: **Nephrite** (essential composition: Ca₂(Mg,Fe)₅Si₈O₂₂(OH)₂)
      *   NK-103: **Jadeite** (essential composition: NaAlSi₂O₆)
  Any usage conflating NK-102 and NK-103 is ontologically imprecise and deprecated. Educational outreach materials (Pamphlet ONT-5) are available.

  **5. Do extinct entities qualify as Natural Kinds?**
  Yes, provided they meet the essential criteria. Ruling ICJN-1975-055 established that past existence does not negate ontological status. *Tyrannosaurus rex* (NK-521) possesses a definitive essential genetic blueprint (inferred via phylogenetic bracketing and osteological correlates) and supports lawful generalizations about large theropod carnivory in the Late Cretaceous. However, practical challenges arise regarding verification of necessary conditions for fragmentary specimens (Refer to Procedure FOSS-4: Extinct Kind Verification).

  **6. Is there a "fact of the matter" prior to ICJN rulings, or does the Commission create the joints?**
  The ICJN categorically rejects constructivist interpretations. Our rulings *discover* and *codify* pre-existing ontological joints. However, the epistemological access to these joints requires rigorous methodology. As per Ruling ICJN-1999-201, the issuance of a definitive UST entry *retroactively clarifies* the ontological status for the purpose of standardized scientific discourse and induction, resolving prior ambiguities inherent in pre-systematic observation. The joints existed; we provide the definitive cartography.

  **7. How does the Commission address the distinction between kinds supporting genuine induction and mere "convenient shelf-space" categories?**
  The ICJN mandate, as clarified in Ruling ICJN-2008-277 (Response to Quinean Anxieties), explicitly defines projectibility *as a constitutive feature* of a Natural Kind. Any category demonstrating robust inductive potential *is*, by ICJN operational definition, indicative of an underlying ontological joint. Categories lacking such potential (e.g., "things weighing more than 50 kg but less than 51 kg found on a Tuesday") are excluded from the UST as non-kinds by definition. Convenience is merely the practical recognition of ontological salience.

  **8. Why is the classification of "Tiger" (Proposed NK-204) still listed as "Under Perpetual Review"?**
  The *Panthera tigris* complex presents persistent ontological recalcitrance. Initial essentialist definitions based on morphology (Ruling ICJN-1955-008) were invalidated by clinal variation. Genetic criteria (Ruling ICJN-1992-101) revealed complex hybridization histories and incomplete lineage sorting. Mitochondrial haplogroup definitions (Amendment NK-204-G3) conflicted with nuclear DNA analyses and captive breeding viability data. Current subcommittees (TGR-α, TGR-β) are evaluating a multi-dimensional "Tigritude Matrix" incorporating genetic distance, ecological niche stability coefficients, and stripe-pattern Fourier analysis. Public patience is appreciated. Expect a Provisional Ruling by Q3 2025.

  **9. Why won't the Commission rule on whether "Five-Year-Old Humans" constitute a Natural Kind?**
  Such inquiries, often originating from non-specialist sources lacking proper ontological training, fundamentally misunderstand the nature of natural kinds. Developmental stages are inherently transient properties of individuals belonging to the established Natural Kind *Homo sapiens* (NK-002). They lack a fixed essence or microstructural definition independent of temporal location relative to conception or birth, and exhibit extreme variance in properties. Classifying them as a distinct kind would violate criteria (a), (b), and (d) (See Ruling ICJN-1980-089: On Transient States and Non-Kinds). Petitions on this matter (e.g., Petition NK-P00529 "The Ontology of Juice Preferences") are summarily rejected without review.

  ---

  **SIDEBAR: RECEIVED CORRESPONDENCE (SELECTED EXCERPTS)**

  *   **From "Lumper's League for Ontological Sanity":** "Your Commission is a disgrace! NK-102 and NK-103 are clearly the same kind – they're both green rocks people carve! Your obsession with 'microstructure' is splitting nature beyond recognition. Next you'll declare each individual snowflake a separate kind! Return to common sense! #LumpTheJade #EssencesAreEverywhere"
  *   **ICJN Response:** The distinction between Nephrite and Jadeite is empirically verifiable and fundamental to their differing physical properties (hardness, crystal structure). Common names lack ontological authority. Refer to Ruling ICJN-1968-012 and Pamphlet ONT-5. The snowflake hypothesis, while intriguing, fails criterion (c) regarding projectible generalizations and is thus dismissed per Procedure NK-REJ-8.
  *   **From "The Society for Precise Splitting (SPS)":** "Your 'Tigritude Matrix' is a laughable fudge! True joints demand maximal distinction. Why stop at sub-species? Each genetically distinct population, no, each *individual genotype*, represents a truer joint! Your refusal to recognize NK-P882b (Eastern Coyote-Wolf Hybrid Clade Gamma-4) as distinct from NK-P882a reveals a shocking institutional bias towards lumping. You are betraying the essentialist cause! #SplitToTheAtom #EveryVariantAVirtue"
  *   **ICJN Response:** The ICJN mandate requires discerning joints *of nature*, not cataloging every conceivable difference. Excessive splitting renders generalization impossible, violating criterion (c). Genomic individuality is a property of organisms, not kinds. See Ruling ICJN-2010-254 (On the Limits of Splitting) and the rebuttal of Petition NK-P77421 (For Recognition of Household Dust Variant 7a as a Distinct Kind).

  ---

  **10. How can the public submit inquiries or petitions?**
  Formal inquiries regarding existing UST entries must use Form NK-QUERY-1. Petitions for new kind recognition, reclassification, or declassification require Form NK-PETITION-2, accompanied by a minimum 200-page evidentiary dossier adhering to Annex B specifications. Incomplete submissions will be rejected. Allow 18-24 months for initial review. Do not contact individual Commissioners.

  **11. What is the Commission's long-term vision?**
  The ICJN remains committed to the complete and final cataloging of all Natural Kinds within the observable universe, thereby providing the definitive ontological foundation for all scientific endeavor. Progress, while methodical, is continuous. Revision 18.0.0 of the UST, incorporating finalized rulings on several problematic fungal hybrids and a revised taxonomy of elementary particles (pending neutrino mass confirmation), is projected for 2028.

  *Admissions Officer's Footnote (Internal Use Only - Do Not Circulate):* Analysis of Kind Boundary Regions under high-resolution epistemic scrutiny (Project CARVE-X) suggests structural ambiguity at scales approaching Planck length. Observed boundary phenomena increasingly resemble stress fractures in particulate aggregates or... *[DATA EXPUNGED PER PROTOCOL DELTA-7]*. Further investigation required, budget permitting. Recommend maintaining current operational definitions for macroscopic coherence. Proceed to FAQ 12.

  **12. Where can I purchase official ICJN publications and merchandise?**
  Visit the ICJN Web Portal (www.icjn-ont.int) and navigate to the "Publications & Resources" section. The complete Universal Standard Taxonomy (UST), Volumes I-CCXXIV, is available for purchase in hardcopy or via secure digital download. ICJN-approved "Essence of Water" (H₂O compliant, NK-001 Certified) desk sets and commemorative "Joint Carving" letter openers are also available.
