answer: |-
  Here is a prioritized list of open questions for your exploration, ordered by their foundational importance and leverage for a self-directed researcher with your background and constraints. The ordering prioritizes **upstream conceptual clarity**, **tractability without measure theory**, and **prerequisites for downstream problems**.

  1.  **What constitutes a rational preference ordering when the expected utility is undefined?**
      *   **Why First?** This is the *core* philosophical and decision-theoretic question *underlying* all the examples (Pasadena, St. Petersburg variants, heavy tails). Without a coherent answer here, discussions about truncation, aggregation, or specific distributions lack a foundation. It asks: "If the standard tool (expected value) fails, what principle *should* a bounded agent use to choose?" Addressing this provides the framework for evaluating any proposed solution to the subsequent problems.
      *   **Upstream/Downstream:** Utterly upstream. Answers here constrain or enable answers to *all* other questions. Truncation, distribution comparisons, and ethical aggregation *depend* on what principle replaces or refines expected utility maximization.
      *   **Tractability:** High. You can rigorously explore specific examples (Pasadena, St. Petersburg), analyze proposed decision rules (Finite Dominance, Tail-Sensitive Discounting, Rank-Dependent Utilities, Minimax Regret), and their axiomatic justifications using calculus, asymptotic analysis, and logic. Key concepts like stochastic dominance are accessible.

  2.  **How can agents rigorously compare prospects with heavy-tailed payoffs (where moments diverge) when strict stochastic dominance doesn't apply?**
      *   **Why Second?** This generalizes the Pasadena problem to real-world heavy tails (finance, forecasting, catastrophic risks). Question #1 asks "What principle?", this asks "How do we apply it *specifically* to the most common pathological case?" It moves from abstract preference foundations to concrete mathematical comparison techniques for the distributions causing the problem. Progress here directly impacts practical domains (e.g., evaluating risky interventions with poorly characterized tail risks).
      *   **Upstream/Downstream:** Downstream of #1 (the principle guides the comparison method), but upstream of #3 (truncation), #4 (aggregation), and #5 (computation). You *need* a comparison method to know if truncation is valid or how to aggregate divergent tails.
      *   **Tractability:** High. Focuses on specific classes of distributions (Pareto, Cauchy-like). Concepts like mean excess functions, quantile dominance, and asymptotic comparisons of tail behavior can be explored with calculus and probability theory. You can simulate comparisons under different decision rules derived from #1.

  3.  **Under what conditions (if any) is it rationally justified to truncate or censor extreme tail outcomes to force a finite expected value?**
      *   **Why Third?** This is the most common *pragmatic* response ("Just ignore outcomes beyond some threshold"). But is it valid? Answering this requires answers from #1 and #2. Does the chosen decision rule (#1) tolerate truncation? How does the truncation threshold interact with the comparison method (#2)? When does truncation preserve the "true" preference? This question bridges theory and practical necessity.
      *   **Upstream/Downstream:** Directly downstream of #1 and #2. Its justification *depends entirely* on the answers to those prior questions. It's upstream of #4 and #5 only in the sense that truncation might be used *within* those contexts.
      *   **Tractability:** Moderate-High. You can analyze how the value of the truncation threshold affects the computed expectation and the resulting decision for specific distributions and specific decision rules. Explore sensitivity and convergence rates using analysis. Requires grounding in #1/#2.

  4.  **What are the implications of undefined/order-dependent expectations for aggregative moral theories (e.g., utilitarianism) across large populations or long time horizons?**
      *   **Why Fourth?** This applies the core problem (#1) to your ethical interest. It forces a confrontation: if summing welfare across lives mimics summing payoffs in Pasadena, does "total welfare" become meaningless? Can we define a coherent population axiology under these conditions? This is philosophically deep and has significant implications for long-termism and cause prioritization.
      *   **Upstream/Downstream:** Primarily downstream of #1. The aggregation problem *is* an application of the core decision problem under payoff divergence. It might inform #1 by providing ethical constraints, but progress fundamentally depends on it. It relies on concepts from #2 and #3.
      *   **Tractability:** Moderate. Requires translating decision-theoretic concepts (#1) into ethical reasoning. While challenging, it avoids advanced math; focus on thought experiments (infinite populations, varying densities), paradoxes (Mere Addition), and how different rules from #1 (e.g., overtaking, average utilitarianism with limits) fare. Accessible literature exists (e.g., Nick Bostrom, Nick Beckstead).

  5.  **How can bounded agents feasibly approximate or compute robust decisions under awareness of potential expectation divergence?**
      *   **Why Fifth?** This focuses on the *algorithmic* challenge given answers to #1-#4. If the ideal rule (#1) is computationally intractable for heavy tails (#2), how should a bounded agent act? This is crucial for real-world implementation but depends entirely on knowing *what* we are trying to approximate.
      *   **Upstream/Downstream:** Strongly downstream. Requires well-defined goals (#1, #4) and understanding the distributions (#2) to design approximations. Truncation (#3) is one type of approximation.
      *   **Tractability:** High (computationally). Leverage your software skills! Implement simulations comparing different approximation schemes (truncation, sampling, robust optimization) for different decision rules (#1) and distributions (#2). Explore sensitivity to prior beliefs and computational budgets.

  **Why this order?** It builds from the absolutely fundamental (#1: *What principle?*) through the mathematically central challenge (#2: *How compare heavy tails?*) and the key practical hack (#3: *Can we truncate?*) to the significant ethical application (#4: *What about aggregation?*), ending with the computational reality (#5: *How do we actually do it?*). Each step provides essential tools or constraints for the next. It maximizes leverage for your background by front-loading conceptual and analytical tractability.

  **What would change my mind about the top choice?** If a convincing, *broadly applicable*, and *computationally feasible* decision rule for handling expectation divergence gained significant traction and addressed the core paradoxes (Pasadena, St. Petersburg variants), then Question #1 might become less "open" and more about *applying* that rule. In that case, **Question #2 (Comparing Heavy-Tailed Prospects)** would likely become the top priority. The argument promoting it would be: "We have a consensus principle (#1), now the critical open challenge is developing rigorous, practical methods to implement it for the heavy-tailed distributions prevalent in the real world."

  The most likely place for this shift to happen is around proposals like **Tail-Based Discounting** or **Risk-Neutral Stochastic Dominance** combined with bounded utility functions. If these approaches could be shown to resolve the Pasadena paradox without introducing equally bad counterexamples, handle a wide class of heavy-tailed distributions, and offer reasonable guidance in practical cases (e.g., catastrophic risk assessment), the field might coalesce around them, reducing the urgency of the purely foundational #1 and elevating the comparative #2. However, the current lack of consensus and the deep philosophical disagreements (e.g., between frequentist and Bayesian responses, or between various axiomatic approaches) firmly keep #1 at the top for now.
