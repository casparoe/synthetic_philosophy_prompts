prompt: |-
  quick background: I've been going down a rabbit hole on WEIRD moral psychology (western, educated, industrialized, rich, democratic — the populations that almost all moral psychology research gets drawn from) and I want to figure out what it does to the claim that morality is objective. I don't want to argue for any particular metaethical view yet, I want the spec first: the list of requirements any adequate theory of moral objectivity would have to meet to stay compatible with what we actually know about cross-cultural moral variation. And I want the requirements to engage the real variation, not the strawman version — for instance whether the theory has to handle cultures where the same act only counts as wrong if somebody witnessed it, whether it's allowed to lean on claims about "universal" moral intuitions that were established almost entirely with WEIRD samples, whether it needs to keep apart cultures differing on moral content from cultures that differ mainly in how hard norms get enforced. Give me exactly five requirements, numbered, each one or two sentences, no intro or conclusion. If you think two of the five can't be jointly satisfied, say so inside whichever item that tension shows up in. Make the fifth the requirement you're least sure belongs on the list at all, and have that item end by saying what would change your mind about it. also dont sneak in a sixth requirement by packing two into one item, I'll notice.
