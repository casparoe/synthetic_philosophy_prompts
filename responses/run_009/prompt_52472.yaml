answer: |-
  Here are five requirements for a theory of moral objectivity compatible with cross-cultural moral variation:

  1.  **Non-Witness-Dependent Wrongness:** The theory must accommodate cases where an act's moral status (e.g., being "wrong") within a culture depends crucially on contingent factors like being witnessed (e.g., theft only wrong if seen), without collapsing into relativism or denying the objectivity *claimed* by that culture's own normative framework for *when* the act is deemed wrong.
  2.  **WEIRD Intuition Scrutiny:** Any appeal to purportedly "universal" moral intuitions as evidence for objectivity must rigorously account for the WEIRD sampling bias, demonstrating that claimed universals hold robustly across diverse non-WEIRD populations, not just within variations of WEIRDness.
  3.  **Content vs. Enforcement Distinction:** The theory must clearly differentiate between genuine variation in moral *content* (e.g., differing beliefs about what constitutes harm or fairness) and variation in the *intensity*, *scope*, or *enforcement mechanisms* of shared or overlapping norms (e.g., stricter punishment, broader application), explaining how objectivity applies to the former without being undermined by the latter.
  4.  **Disagreement vs. Error Accommodation:** The theory must provide a principled criterion for distinguishing genuine moral *disagreement* (where both parties might be accessing objective truth under differing circumstances/interpretations) from cases of straightforward moral *error* or false belief (e.g., beliefs grounded in empirically false factual premises about the world or human nature), potentially creating tension with Requirement 1's witness-dependent cases.
  5.  **Adaptive Variation Explanation:** The theory must engage with evidence suggesting some moral variation is adaptive to local ecological or social conditions (e.g., honor cultures in weak-state environments), explaining how such functional variation is compatible with moral objectivity—**though I'm least sure this is essential; convincing evidence that adaptive explanations *directly* undermine core features of objectivity (e.g., mind-independence, categoricity) in relevant cases would solidify its place.**

  These requirements ensure the theory directly confronts the complexity of real-world variation, moving beyond simplistic universality claims or dismissive relativism.
