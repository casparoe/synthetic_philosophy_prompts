prompt: |-
  Social epistemology PhD student here (dissertation on testimony, so naturally I see my topic everywhere), and I've kind've gotten obsessed with the implicit epistemology built into Wikipedia's sourcing rules. Sketch of the practice as I read it, and tell me if I'm off:

  The Verifiability policy states that "Wikipedia's content is determined by published information rather than editors' beliefs, experiences, or previously unpublished ideas or information," and the No original research policy flatly says that "If no reliable independent sources can be found on a topic, Wikipedia should not have an article about it." So an editor who personally witnessed an event, or proved a theorem, or ran an experiment in their own lab, can't use any of that as the basis for an article claim — first-hand knowledge is banned as a foundation, only testimony transmitted through vetted channels counts. Meanwhile there's a whole apparatus for ranking the channels: academic and peer-reviewed publications are usually the most reliable, then books from respected publishing houses, reputable newspapers, and so on, while outlets without editorial control or fact-checking structures get downgraded or excluded. And separately, when sources disagree, editors are told to present the disagreement while "giving each side its due weight" — majority views dominate the article, fringe views are described as fringe.

  Here's what's bugging me. On its face the whole edifice looks aggressively anti-reductionist: the encyclopedia treats certain channels of testimony as a basic source of justification it can rely on wholesale, without any individual editor having earned trust in those outlets through inductive track-record checking (nobody at Wikipedia has verified a journal's whole publication history, and the policy doesn't ask them to). But other parts look reductionist in spirit: ranking sources by type and demoting outlets with bad track records is exactly the induction-on-particulars that a reductionist says all testimonial trust must bottom out in.

  So, my question: what theory of testimony does this practice actually presuppose, if any? Is there a coherent implicit view here — maybe anti-reductionism relocated from the individual to the institution, where the entitlement lives at the level of the encyclopedia as a body rather than in any particular editor's justification? Or is the practice philosophically underdetermined, such that several positions in the reductionism/anti-reductionism debate would license it equally well? Please separate what the rules strictly require from what they merely sit comfortably with. And here's the stress test I keep coming back to: suppose the community decided to rewrite sourcing policy on strict reductionist grounds, requiring that every act of relying on a source be earned by track-record evidence available to the relying editor herself. Could the encyclopedia still function at all, or does the no-original-research rule make that literally incoherent — given that even checking "this journal published this paper" is something the checking editor knows only through further testimony?

  Also flag any internal tension I've missed. The one I half-see: verifiability is supposed to sever justification from truth (the community long repeated that the bar for inclusion is verifiability, not truth), but due weight seems to encode a prior on which views are actually right — you give the mainstream view most of the article, not just any view held by one prolific outlet. Does the practice need a notion of "where the sources stand" that's genuinely independent of "where the truth is," and does either the reductionist or the anti-reductionist have an easier time making sense of that separation?
reasoning: |-
  Okay, let me start by unpacking this fascinating question from a social epistemology PhD student. They're dissecting Wikipedia's sourcing rules through the lens of testimony theories, specifically reductionism vs. anti-reductionism. 

  First, I need to validate their reading of Wikipedia policies. They've nailed the core principles: the ban on first-hand knowledge, the hierarchy of sources, and the "due weight" doctrine. That's accurate. Where it gets juicy is the philosophical tension they've spotted—the system seems simultaneously anti-reductionist (accepting certain sources as default-reliable) and reductionist (demoting sources based on track records). 

  Hmm, the user's real puzzle is whether Wikipedia's practice presupposes a coherent theory of testimony. Let me mentally walk through the options. Anti-reductionism? Partially—the blanket trust in peer-reviewed journals feels like accepting testimony without personal verification. But then Wikipedia explicitly rejects *individual* anti-reductionism when it bans eyewitness accounts from editors. Curious! The reductionist angle appears in source-ranking, but the hierarchy is applied categorically (e.g., "all peer-reviewed journals > all blogs") without requiring editors to personally verify each outlet's track record. So it's... institutionalized quasi-reductionism? 

  Ah, the stress test they propose is brilliant: if Wikipedia demanded strict reductionism (editors personally verifying every source's reliability), the project would collapse. Checking a journal's existence requires more testimony (DNS records, publisher websites), creating infinite regress. That alone suggests Wikipedia's foundational epistemology *must* be non-reductionist at the institutional level. 

  The "due weight" tension they mention is equally thorny. Verifiability ≠ truth, but "weight" implicitly tracks epistemic authority—which correlates with truth-conduciveness. Yet Wikipedia can't admit that without violating its "no truth claims" mantra. Clever catch. 

  I'm realizing the user might be circling a deeper question: does Wikipedia's success prove that institutional anti-reductionism is viable? Or is it just a pragmatic compromise? I should emphasize the hybrid nature—anti-reductionist foundations with reductionist filters—while noting the unresolved friction around "weight." 

  ...Wait, did I just hear a coffee cup shatter? No, just my brain wrestling with how "due weight" smuggles in social epistemology's least favorite guest: truth. Gotta address that head-on.
answer: |-
  Your reading of Wikipedia's epistemology is astute, and the tensions you identify are central to its function. Let's dissect the implicit theory of testimony, separating what the rules strictly entail from what they accommodate, and address your stress test and internal tensions.

  ### Core Epistemological Commitments
  1.  **Strict Institutional Anti-Reductionism (as a Foundational Rule):**
      *   **What the rules require:** Wikipedia mandates that *all* justificatory weight for article content must come *exclusively* from pre-published, "reliable" sources. An editor's direct experience, expertise, or reasoning is categorically inadmissible *as evidence*. This is a structural, non-negotiable rule (WP:No original research, WP:Verifiability).
      *   **Epistemological Implication:** This constitutes a strong, institutionalized form of **anti-reductionism**. Wikipedia treats specific *types* of sources (peer-reviewed journals, reputable publishers, major newspapers) as possessing *presumptive epistemic authority*. Editors are *not* required (or even permitted) to rebuild the justification for trusting each specific claim from non-testimonial foundations. The institution grants an entitlement to rely on these source *types* based on their institutional role and perceived gatekeeping functions, not on individual editor verification of track records for each source outlet. Trust in the *category* is foundational within the system.

  2.  **Pragmatic Reductionism (as a Filtering Mechanism):**
      *   **What the rules require:** Editors *must* assess the *reliability* of specific sources using guidelines that explicitly reference factors reductionists emphasize: editorial oversight, fact-checking processes, reputation for accuracy, expertise of authors, and crucially, **track record** (WP:Reliable sources). Sources with demonstrably poor track records are demoted or excluded.
      *   **Epistemological Implication:** This layer involves induction on particulars. Editors *are* expected to engage in a form of reductionist practice *when evaluating specific sources against the pre-defined categories*. They look for evidence (often itself testimonial!) about the outlet's history, processes, and known errors to justify including/excluding it or weighting its claims.

  ### The Coherent (though Hybrid) Implicit View
  The practice presupposes a **Hybrid Institutional Epistemology**:

  1.  **Anti-Reductionist Foundation:** The core rule is anti-reductionist: *Certain institutional channels of testimony (academic publishing, mainstream media) are granted default justified status within the Wikipedia system.* Justification flows from the source *being* a member of that vetted category. Individual editors do not need to (and often cannot) reconstruct the justification for trusting *Nature* from scratch every time they cite it. The entitlement lives at the institutional level of Wikipedia itself.
  2.  **Reductionist Filtering:** *Within* that framework, reductionist principles are applied pragmatically to:
      *   **Define the vetted categories:** What counts as "peer-reviewed," "reputable publisher," or "mainstream news" is determined by community consensus based *on observed characteristics and track records* (induction on particulars).
      *   **Handle borderline/contested sources:** Assess specific outlets that may nominally fit a category but have shown unreliability (e.g., a specific newspaper with known biases/errors).
      *   **Manage source conflicts:** Determine "due weight" by assessing the *prevalence and standing* of views within the reliable source ecosystem (itself an inductive assessment).

  This hybrid view isn't philosophically pure reductionism *or* anti-reductionism, but it's coherent as a *social epistemic practice* for a massive, decentralized, non-expert project aiming for stability and verifiability.

  ### Your Stress Test: Strict Reductionist Rewrite - Collapse is Inevitable
  Requiring every editor to personally earn, via track-record evidence they possess, the justification for trusting *each specific source they cite* would **render Wikipedia non-functional**:

  1.  **Epistemic Regress:** As you note, verifying the *existence* of a source (Does this journal issue exist? Was this article published?) relies on further testimony (library catalogs, DOI resolvers, publisher websites). Verifying the *track record* of a journal requires accessing meta-analyses, retraction databases, or media reports – all themselves testimonial sources requiring justification. This leads to an infinite regress or a foundational reliance on *some* testimony without reductionist justification.
  2.  **Expertise Barrier:** Most editors lack the expertise, time, and resources to rigorously evaluate the track record of sources across diverse fields (particle physics, medieval history, virology, etc.).
  3.  **Paralysis:** The sheer volume of sourcing needed for millions of articles makes individualized, deep track-record verification for every citation logistically impossible. Editing would grind to a halt.
  4.  **Violates NOR Core:** The stress test rule directly contradicts the fundamental "No Original Research" principle. If an editor *personally* verifies a source's track record to justify trusting *this specific claim*, they are arguably introducing original synthesis – they are *creating* the justification chain linking their observation of the track record to the reliability of *this* claim. Wikipedia forbids editors from being the *origin* of the justification; it must pre-exist in published form.

  **Conclusion on Stress Test:** Wikipedia's foundational rules, *especially* the ban on original research and the reliance on pre-published sources as the *only* admissible evidence, make strict individual reductionism incoherent *within its system*. The project's scale and structure *depend* on institutional anti-reductionism as its bedrock.

  ### Internal Tension: Verifiability vs. Due Weight (Truth-Poking)
  You've identified a profound and persistent tension:

  *   **Verifiability (Source-Centric):** "What reliable sources say" is the criterion. Truth is officially irrelevant. A well-sourced falsehood could, in theory, be included; an unsourced truth must be excluded. Justification is severed from truth.
  *   **Due Weight (Truth-Conduciveness-Centric):** "Weight" is determined by the *prevailing view among reliable sources*. This inherently reflects the community's (and the sources') implicit judgment about which views are *more likely correct* or *more credible*. Giving prominence to the mainstream view isn't just about counting sources; it's based on the understanding that consensus within reliable sources *tracks truth more reliably* than fringe views. This smuggles in a truth-oriented prior.

  **How the Hybrid View Handles This (Uneasily):**

  1.  **"Where the Sources Stand" as Proxy:** Wikipedia *officially* only cares about "where the sources stand." The mainstream view gets weight *because* it's the mainstream view *within the vetted source ecosystem*, not because Wikipedia asserts it's *true*. The system treats the aggregated output of reliable sources as the best available *proxy* for warranted assertibility/justified belief, deliberately avoiding direct truth claims.
  2.  **Anti-Reductionist Anchor:** The institutional trust in the *categories* of reliable sources carries an implicit (though defeasible) expectation that these sources *as systems* are truth-conducive *in general*. This justifies prioritizing the consensus they produce.
  3.  **Reductionist Reality Check:** The focus on track records when *defining* reliability or demoting specific outlets acknowledges that sources *can* be wrong. Due weight can shift if the consensus shifts, reflecting an inductive responsiveness.
  4.  **Tension Point:** The tension arises precisely when a well-established mainstream view within reliable sources is later shown to be false, or when a fringe view is later vindicated. Wikipedia must follow the current consensus of sources, lagging behind truth. The "due weight" rule, by solidifying the mainstream view's dominance, can make correcting this lag difficult. It also struggles with topics where reliable sources are scarce or deeply divided.

  **Which Theory Handles the Separation Better?**
  *   **Anti-Reductionism** has an easier time with the *source-centric* nature of verifiability. If you grant presumptive authority to institutions, then "what they say" *is* the relevant epistemic fact, regardless of ultimate truth. The separation is built-in.
  *   **Reductionism** struggles more with the separation because it ultimately ties justification to truth-conduciveness via induction. For a reductionist, Wikipedia's source-centric focus is a *pragmatic heuristic* based on the *assumed* (inductively supported) truth-conduciveness of reliable sources, not a fundamental separation. The "due weight" rule aligns more naturally with the reductionist impulse to weigh evidence based on its perceived reliability/truth-tracking ability.

  ### Conclusion
  Wikipedia's epistemology is best understood as **Institutional Source Anti-Reductionism with Pragmatic Reductionist Filtering**. It fundamentally relies on granting presumptive justified status to testimony from specific institutional channels, enforcing this via the ban on original research and the verifiability policy. Reductionist principles operate *within* this framework to define source reliability categories, handle edge cases, and implement "due weight" by assessing the distribution of views within the vetted source ecosystem. This hybrid is coherent as a functional social epistemic practice for its goals (verifiable, stable, collaborative knowledge aggregation) but contains inherent tensions, most notably between its strict source-centric verifiability principle and the truth-tracking implications of its "due weight" policy. Strict individual reductionism is incompatible with its core "no original research" foundation and would cause systemic collapse.
