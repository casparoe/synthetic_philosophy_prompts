prompt: |-
  I'm taking a graduate seminar on Scanlon's contractualism, and a classmate has put an argument to me that she claims shows the individualist restriction on complaints refutes itself, and I can't find where it goes wrong. Here it is. (1) An act is wrong if and only if it would be disallowed by some principle that no one could reasonably reject. (2) Whether a principle can be reasonably rejected depends only on the strength of the strongest single-person complaint against it, where a person's complaint is the burden that principle would impose on them; complaints do not sum across persons, and this is supposed to be what keeps the separateness of persons in view. (3) A lifeguard can save either one swimmer or five, all of whom will otherwise drown; the strongest complaint against a principle permitting her to let the five die is one death, and the strongest complaint against a principle permitting her to let the one die is also one death. (4) Since the strongest complaints on either side are exactly equal, neither principle can be reasonably rejected, and where the reasonable-rejection test cannot discriminate, contractualism neither requires nor forbids either choice. (5) So the numbers count for nothing even as a tiebreaker, which is just Taurek's view that the difference between one and five is in itself morally irrelevant -- a view almost no one accepts. (6) The same comparison run in the other direction says that a city may not condemn one family's home to supply running water to a million residents, since the family's complaint against that principle is larger than any single resident's complaint against the alternative. (7) So either (2) is false and complaints must be allowed to aggregate after all, in which case contractualism turns into a headcount of burdens and loses exactly what distinguished it from utilitarianism, or contractualism is refuted outright, since it shrugs at the five and forbids the reservoir.

  I can't accept (7), but every step looks defensible to me individually. Which step should I reject, and what does rejecting it cost? For what it's worth, I'd like to keep (2), since what drew me to the view in the first place is its refusal to trade one person's burden against anyone else's, and I also think the lifeguard who lets the five die does something wrong. Is there a reading of some step that lets me keep both, or am I forced to give one of them up -- and if so, which is the cheaper sacrifice?
reasoning: |-
  Okay, let me try to work through this problem. The user is grappling with an argument against Scanlon's contractualism, specifically the individualist restriction. Their classmate claims that the restriction leads to counterintuitive results like not saving the larger group and prohibiting public projects that harm one for many's benefit. The user wants to reject the conclusion but can't find the flaw in the steps.

  First, I need to recall Scanlon's core ideas. The individualist restriction means complaints aren't aggregated; only the strongest individual complaint matters. The lifeguard case shows a problem: saving one vs. five, where each side has a max complaint of one death, so no decision is required. That leads to Taurek's view, which most reject. Then the reservoir case: one family loses their home versus a million getting water. The family's complaint (losing home) outweighs any single resident's complaint (no running water), so the project is forbidden. 

  The user wants to keep the individualist restriction but also thinks saving the five is obligatory. They need to find which step is flawed without abandoning key principles. Step 3 seems like the weak point. The complaint against letting the one die isn't just death; it's being singled out arbitrarily. Scanlon emphasizes the reasonableness of rejecting principles that treat individuals unfairly. In the lifeguard case, a principle permitting saving the one over the five is vulnerable because it allows arbitrary disregard for the five. Each of the five has a complaint that they are being sacrificed without justification. The lifeguard's choice isn't neutral; it needs justification. Saving the greater number provides a reason that's impartial. 

  For the reservoir, the family's complaint isn't just the burden but whether the principle unfairly imposes a disproportionate sacrifice. The principle allowing such takings must consider if the burden is unreasonable compared to the benefits distributed. However, Scanlon might allow such projects if compensation or necessity justifies it. The complaint here is about fairness in distribution, not just the individual burden. 

  The user's deeper need is to reconcile contractualism with intuitive judgments about saving more lives and public goods. They might also seek to defend Scanlon without collapsing into utilitarianism. Rejecting step 3's framing of the complaints addresses both cases: in lifeguard, the complaint includes fairness, making saving five required. In reservoir, the complaint might be reasonable if the burden is necessary and mitigated. This preserves the individualist restriction without absurd outcomes.
answer: |-
  You're grappling with a classic and powerful critique of Scanlon's individualist restriction. While the argument seems logically tight, **Step 3 is the crucial misstep**, specifically in its characterization of the *strength of the complaint* against the principle permitting saving the one instead of the five. Rejecting this step allows you to preserve the core of the individualist restriction (2) while avoiding the unacceptable conclusions (Taurek in the rescue case and paralysis in the reservoir case).

  Here's the breakdown:

  1.  **The Problem in Step 3:** Step 3 claims: "the strongest complaint against a principle permitting her to let the one die is also one death." This is incorrect within Scanlon's framework. It misidentifies the relevant principle and the nature of the complaint against it.
      *   **The Relevant Principle:** The principle being evaluated isn't simply "Permit letting the one die." It's a principle governing *choices under scarcity*. A more accurate formulation for the choice facing the lifeguard might be: "When an agent can save either group A or group B, but not both, and all will die otherwise, it is permissible to save the larger group." (Or, conversely, "it is permissible to save either group").
      *   **The Complaint Against the "Save the One" Principle:** Imagine the lifeguard acts on a principle permitting saving the one instead of the five. Who has the strongest complaint? It's *not just* the death of the one swimmer who *could* have been saved under the alternative principle. Crucially, **each of the five** who are left to die has a powerful complaint against *this specific principle*.
      *   **The Nature of the Complaint:** The complaint of each of the five isn't *only* "I died." That burden exists regardless of the principle chosen. Their specific complaint against the principle *permitting saving the one* is: **"This principle allows an agent to let me die *when saving me (and the others in my group) was possible*, and *for no reason that justifies imposing this burden specifically on me rather than someone else*."**
      *   **The Key Insight:** The complaint here involves **arbitrariness** and **lack of justification for differential treatment**. The principle permits the lifeguard to treat the five as if their lives count for less than the life of the one, or as if it's permissible to arbitrarily select who lives and who dies without a compelling reason grounded in the claims of the individuals involved.

  2.  **Why the Complaints Aren't Equal:**
      *   **Complaint Against "Permit Saving the One" Principle:** As above, each of the five has a strong complaint: they are sacrificed arbitrarily when saving them was possible.
      *   **Complaint Against "Require Saving the Five" Principle:** The one swimmer has a complaint: "This principle requires the agent to let me die when saving me was possible." This is a very strong complaint – the loss of life.
      *   **Comparing the Complaints:** Scanlon argues that the complaint of the one swimmer against a principle *requiring* saving the five **is not stronger than** the complaint *each* of the five would have against a principle *permitting* saving the one. In fact, Scanlon contends the latter complaint is *at least as strong*. Why? Because the one swimmer, facing the "require saving five" principle, is not being treated *arbitrarily*. The principle provides a justification for why *they* bear the burden: saving the greater number provides a reason grounded in the claims of others that justifies not saving *this particular individual* in this specific circumstance. It appeals to an impartial consideration (the number of lives saved) that the one swimmer, reasoning impartially, should acknowledge as justifying the burden imposed on them. They are not being singled out without reason.

  3.  **Resolving the Dilemma:**
      *   The principle "Permit saving the one" **can be reasonably rejected** by each of the five. Their complaint (being sacrificable for no justifying reason grounded in claims) is very strong.
      *   The principle "Require saving the five" **cannot be reasonably rejected** by the one swimmer *alone*. While their burden (death) is immense, the justification for the principle (saving more lives) is one they cannot reasonably dismiss as insufficient to justify imposing this burden on *someone* in this situation. Crucially, the one swimmer cannot claim that an alternative principle (e.g., "save either group") is one *they* couldn't reasonably reject *if they were in the position of one of the five* – they would likely see the complaint of the five against such permissiveness as decisive.
      *   **Therefore,** the lifeguard is *required* to save the five. The numbers *do* count as a tiebreaker precisely *because* the complaint against a principle that ignores numbers involves a distinctive kind of objection – arbitrariness and lack of justification for differential sacrifice – that makes it reasonably rejectable. The individualist restriction is maintained; we aren't summing burdens. We are comparing the strength of the *strongest individual complaint* against each principle, recognizing that the complaint against the number-ignoring principle is *stronger* than it initially appears (Step 3's error) due to its justificatory deficit.

  4.  **Applying to the Reservoir Case (Step 6):**
      *   Step 6 claims the family's complaint (losing their home) is larger than any single resident's complaint (lacking running water), so the project is forbidden. This repeats the Step 3 error.
      *   **The Relevant Principle:** Something like: "Society may impose significant burdens (like taking a home with fair compensation) on a few individuals to secure essential, widely distributed benefits (like water for a city) if necessary and no less burdensome alternative exists."
      *   **The Family's Complaint:** "This principle imposes a very severe burden on me/us (loss of home, disruption) for the benefit of others."
      *   **A Resident's Complaint Against the *Alternative* Principle:** Imagine a principle forbidding such takings: "Society may never impose significant burdens like taking a home, even with compensation, for public projects, regardless of the benefit." A single resident's complaint against *this* principle isn't merely "I lack running water." It's: **"This principle forbids society from securing an essential good for me and everyone else *even when it could do so by imposing a much smaller, compensated burden on a few*, and *for no reason that justifies denying me and others this essential benefit*."** This complaint involves being denied a significant benefit necessary for normal life *unnecessarily* – because a feasible, less burdensome way to provide it (compensated taking) is forbidden without sufficient justification.
      *   **Comparing the Complaints:** Scanlon argues that the resident's complaint against the *forbidding* principle is *stronger* than it initially seems (it's not just "inconvenience," it's being denied an essential public good unnecessarily), while the family's complaint, though severe, may be mitigated by fair compensation and the necessity/non-arbitrariness of their being burdened (e.g., their land is uniquely suited). The resident can argue that the burden on the family, while real, is *justified* by the essential, widespread benefit and the lack of alternatives, and that a principle forbidding *all* such necessary projects for essential goods could reasonably be rejected by any member of the public. The family, conversely, must acknowledge that a principle *allowing* takings *without* necessity, compensation, or for trivial benefits *could* reasonably be rejected by those burdened. The "necessary/compensated/essential" principle aims to be one *nobody* could reasonably reject.

  **Costs and Benefits of Rejecting Step 3:**

  *   **Cost:** It requires embracing a more complex understanding of what constitutes a "complaint." It's not *just* the raw burden imposed, but the burden *in the context of the principle's justification and its implications for arbitrariness and fairness*. This can feel less straightforward than simply comparing magnitudes of harm. Critics argue this smuggles in aggregation through the back door by letting the *number* of people affected influence the *character* of the complaint (e.g., creating a complaint about "arbitrariness" that only exists because there are many others).
  *   **Benefit:** It preserves the core individualist restriction. We still compare individual complaints, not summed burdens. It avoids the Taurekian absurdity (indifference in rescue cases) and the paralyzing conclusion in public goods cases, making contractualism more plausible. It captures a deep intuition about fairness: principles allowing arbitrary sacrifice *are* reasonably rejectable, while principles requiring justified sacrifices for significant impartial gains may not be. This aligns with your intuition that saving the five is required and that the reservoir project might be permissible.

  **Conclusion:** Your classmate's argument stumbles at Step 3 by oversimplifying the nature of the complaint against the principle permitting saving the one/few. Scanlon's response is that the complaint against such a principle isn't merely "a death," but "being sacrificed arbitrarily when saving us was possible and there's no reason justifying *our* sacrifice over *theirs*." This complaint is distinctively strong and allows the numbers to break the tie *without* aggregating burdens, preserving the separateness of persons. Rejecting Step 3 costs some simplicity but saves the core of contractualism from counterintuitive collapse. You *can* keep the individualist restriction and the intuition that saving the five is obligatory. The key is recognizing the morally salient difference between being burdened by a principle with a justifying reason and being burdened arbitrarily.
