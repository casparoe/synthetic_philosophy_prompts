prompt: |-
  I have been assembling my verdicts on cases involving paternalism and nudging, and I would like to know whether they amount to a defensible principle or whether something has to give. Here are the cases, each with my gut verdict.

  (1) The Treasury automatically enrols private-sector employees into a pension scheme, from which they can opt out at any time. Fine; I think this is one of the better policies of the past two decades.

  (2) A council-run café at a leisure centre places the salads at eye level and the chips below the counter. Fine, trivially so.

  (3) Parliament makes seatbelts compulsory, on pain of a fine. Fine.

  (4) Parliament also caps the size of soft drinks that cinemas may sell. Not fine — and I cannot easily say why, since it crosses a line the seatbelt law does not.

  (5) The Treasury raises duty steeply on cigarettes. Fine.

  (6) An airline's booking site pre-ticks travel insurance and priority boarding; un-ticking them requires locating a small grey link on a page users are known not to read. Not fine — and this is what bothers me most, because it is structurally the same device as (1): a default, plus friction on one side, with every option left open and no falsehood told. I approve of one and condemn the other, and I do not trust my grounds for the difference.

  (7) A friend from whom I have explicitly asked help in quitting hides my cigarettes. Fine.

  (8) The same friend hides my cigarettes unasked, having privately judged that I smoke too much. Not fine — even though I accept the state doing something similar in (5), with less of a mandate from me than I gave the friend in (7).

  (9) A hospital, on evidence that defaults strongly move choices and that dying patients systematically overvalue resuscitation, pre-ticks "not for resuscitation" on the consent form, the physicians sincerely believing this is best for each patient. I genuinely cannot settle this one, and it is the case I keep returning to.

  (10) The state replaces the organ-donation register with a requirement that every adult record a preference, with no default at all. Fine — and I suspect my approval here rests on the thought that no one should choose for me, which sits badly with my approval of the pension default in (1).

  I have a tentative principle: steering is legitimate when (a) every option remains available and resistance is cheap, (b) the steerer has standing — a democratic mandate or my explicit request — and (c) the steering is done for the steered person's own good rather than the steerer's. But it misfires: (a) cannot distinguish (1) from (6), since the airline's default is about as easy to resist as the Treasury's; (c) condemns the café in (2) whenever the council also wants the salad revenue, and it seems to bless the resuscitation default in (9) outright, which I find myself unable to accept or reject. Meanwhile (b) cannot explain the difference between (3) and (4), where the standing and the motive are identical and only the intrusiveness and the stakes vary.

  So here is what I would like. First, tell me whether there is a single principle — or a small set of candidate principles, if one will not do — that captures all or nearly all of these verdicts; state it precisely, clause by clause, and say which case motivates each clause. Second, tell me what the principle says about a case I have not yet decided: a health authority commissions a smoking-cessation app that, without disclosing it, delays its push notifications by a few minutes whenever it predicts the user is in a weak-willed state, on the theory that the momentary delay lets a resolution reassert itself. Resistance in each instance is trivially cheap, the steerer has public standing, and the aim is entirely the user's own good. Third, tell me what the principle says about the resuscitation default in (9), which is where my own verdicts run out. Finally, be honest about which of my verdicts the principle cannot accommodate, explain why the overridden verdict looked appealing anyway, and say whether you think I should keep it and complicate the principle, or drop it and accept the loss. Please write your answer in British English.
reasoning: |-
  Hmm, the user presents a fascinating ethical puzzle about paternalism and nudging across ten diverse cases. They've clearly put deep thought into this, wrestling with inconsistencies in their own gut reactions. The core tension lies between valuing autonomy and recognising that some steering can be beneficial - a classic liberal dilemma.

  Looking at their tentative principle (a+b+c), I spot immediate problems. Condition (a) fails to distinguish between the pension opt-out (which they approve) and the airline's pre-ticked extras (which they condemn), even though both involve defaults with similar resistance costs. Condition (b) about "standing" can't explain why they accept state cigarette taxes but reject a friend hiding cigarettes without consent. And condition (c) unravels when motives are mixed, like the council café potentially profiting from salad placements.

  What's really interesting is their struggle with case (9) about resuscitation defaults. This exposes a raw nerve in medical ethics: how much weight to give statistical evidence versus individual autonomy when stakes involve life-or-death decisions. Their discomfort mirrors broader debates in behavioural ethics.

  For the smoking app case they propose, my principle would condemn the covert delay tactic despite its good intentions. The lack of transparency crosses a bright line - it's manipulative in a way that differs meaningfully from transparent defaults like pension enrolment. This aligns with their instinctive rejection of the airline's dark pattern in case (6).

  I'll need to carefully construct a principle that respects their intuitive distinctions while providing consistent guidance. The key elements should include: transparency requirements to address the airline/resuscitation dilemma; a "reasonableness" threshold for state intervention to distinguish seatbelts from drink sizes; and explicit treatment of delegation/relationship contexts to resolve the friend-versus-state cigarette cases. The organ donation case (10) actually strengthens the framework by showing how mandatory active choice preserves autonomy better than defaults.

  Notably, their verdict on the resuscitation default (9) remains unsettled - appropriately so, as this sits at the frontier of medical ethics. My proposed principle would reject it due to the high-stakes nature combined with lack of transparency, though I'll acknowledge this remains controversial. For their inconsistent salad verdict in case (2), I'll suggest they maintain it by recognising that trivial interventions require less justification - this minor inconsistency seems worth preserving given how obviously unobjectionable salad placement feels.
answer: |-
  You've crafted a remarkably clear and self-critical analysis of a complex ethical landscape. Your "tentative principle" highlights the core tensions well. While no principle captures every intuition perfectly without becoming unwieldy, a refined principle *can* accommodate most of your verdicts and provide guidance. Let's build one based on your cases.

  **A Proposed Principle: The Justified Steering Principle (JSP)**

  1.  **Permissibility of Steering:** Steering (nudges, defaults, mandates, friction) is presumptively permissible when aimed at promoting a person's own significant welfare interests, provided it meets the following conditions.

  2.  **Transparency & Avoidance of Manipulation:** The steering mechanism must be reasonably transparent and avoid exploiting cognitive biases or vulnerabilities in a way that constitutes manipulation or undermines meaningful choice.
      *   *Motivated by:* (6) Airline pre-ticking (exploits inattention, hidden un-ticking = manipulative), (9) Resuscitation default (non-transparent, exploits default effect at a vulnerable moment).
      *   *Explains:* Why (1) Pension auto-enrolment is fine (transparent policy, widely known, opt-out clear) vs. (6) (exploits known user inattention with hidden actions). Also why (2) Salad placement is trivial (transparent, doesn't exploit a *vulnerability* - seeing salad first isn't manipulative).

  3.  **Reasonableness of Intervention & Proportionality:** The intervention must be proportionate to the significance of the welfare interest at stake and the degree of interference with choice. For state interventions, this requires a plausible case that individuals systematically err in ways causing significant harm to themselves, and the intervention is a reasonable response.
      *   *Motivated by:* (3) Seatbelts vs. (4) Soft drinks cap. Seatbelts address a high-risk, often impulsive decision with severe consequences; large drink caps address a lower-risk, cumulative harm where individual choice variation is more reasonable. (5) Cigarette tax addresses a severe, well-established harm with strong evidence of systematic error/impulse. (4) Soft drink cap seems disproportionate interference for the harm/stakes.
      *   *Explains:* Why (7) Friend hiding cigs *when asked* is fine (proportionate to your expressed, significant welfare goal) vs. (8) Unasked (disproportionate interference for the level of mandate/stakes). State tax (5) is proportionate to the massive public health harm; unasked friend intervention (8) is not.

  4.  **Standing & Relationship Context:** The legitimacy of the steerer depends on the context and the nature of the relationship. The state requires democratic legitimacy and a clear public interest justification. Private entities have less standing for paternalism unless explicitly delegated (e.g., by contract or user request). Personal relationships allow intervention based on closeness and explicit requests, but unrequested intervention requires extreme justification due to high intimacy/autonomy stakes.
      *   *Motivated by:* (1) State pension (democratic mandate, public interest in retirement saving) vs. (6) Airline (private profit motive, no standing for paternalism). (7) Friend asked (explicit delegation in personal relationship) vs. (8) Friend unasked (lacks standing/authorisation despite relationship). (10) Organ donation (state has standing for public policy on scarce resource allocation, but active choice respects autonomy better than a default).

  5.  **Availability & Cost of Resistance:** Options must remain legally/practically available. However, the *practical cost* of resistance (friction) is evaluated under the "Transparency & Avoidance of Manipulation" and "Proportionality" clauses. High, deliberately hidden friction is manipulative.
      *   *Motivated by:* Reinforces why (6) is wrong (high, hidden friction) even though opt-out exists, while (1) is acceptable (lower, known friction).

  **Applying the JSP to Your Cases:**

  *   **(1) Pension Auto-enrolment:** **Fine.** State standing (4), promotes significant welfare (1), transparent/non-manipulative (2), proportionate (3), resistance possible with reasonable friction (5).
  *   **(2) Salad Placement:** **Fine.** Trivial intervention (3), non-manipulative (2), low stakes (3). Standing (4) is weak for the *council* specifically, but the triviality overrides concerns.
  *   **(3) Seatbelt Mandate:** **Fine.** State standing (4), addresses high-risk harm (1,3), proportionate (3).
  *   **(4) Soft Drink Cap:** **Not Fine.** Disproportionate interference for the stakes/harm (3). State standing (4) exists, but fails on proportionality.
  *   **(5) Cigarette Tax:** **Fine.** State standing (4), addresses severe harm (1), proportionate (3), non-manipulative/transparent (2).
  *   **(6) Airline Pre-ticking:** **Not Fine.** Lacks standing (4 - private profit motive), manipulative (2 - exploits known inattention, hidden un-ticking).
  *   **(7) Friend Hides Cigs (Asked):** **Fine.** Explicit delegation in personal relationship provides standing (4), promotes welfare (1), proportionate to request (3).
  *   **(8) Friend Hides Cigs (Unasked):** **Not Fine.** Lacks standing/delegation (4), disproportionate interference in autonomy for the relationship context (3,4).
  *   **(9) Resuscitation Default:** **Not Fine** (according to JSP). Fails on Transparency (2) - exploiting default effect at a uniquely vulnerable, high-stakes moment without explicit disclosure is manipulative. The stakes (life/death, deeply personal values) make non-transparent steering highly problematic, even with good intentions. Standing (4) is complex (medical authority), but manipulation and high stakes override.
  *   **(10) Mandated Active Choice (Organs):** **Fine.** State standing for public policy (4), promotes welfare/public good (1), maximises autonomy/transparency (2 - forces conscious choice, no default), proportionate (3).

  **The Smoking-Cessation App Case:**

  *   **The Case:** Health authority app secretly delays notifications when predicting weak will, to aid cessation.
  *   **JSP Verdict: Not Fine.**
      *   **Fails Transparency (Clause 2):** The core problem. Actively hiding its intervention (the delay and its reason) is fundamentally non-transparent and manipulative. It exploits the user's state without their knowledge or consent, undermining autonomy.
      *   **Standing (Clause 4):** Public health authority has standing *for transparent interventions*.
      *   **Welfare & Proportionality (Clauses 1 & 3):** Aim is user's good, proportionate to harm of smoking. Resistance per instance is cheap *if you know to resist*, but you don't know it's happening.
      *   **Cost of Resistance (Clause 5):** Options exist (ignore notification), but the *steering mechanism itself* is covert, making meaningful resistance impossible in the moment. The cheap resistance only applies *after* the covert nudge may have already worked.
      *   **Conclusion:** The covert, predictive manipulation crosses the line, despite good intentions and public standing. Transparency is essential.

  **Honest Assessment of Misfits and Recommendations:**

  1.  **Your Verdict on (2) Salad Placement:** You say "Fine, trivially so." The JSP agrees. However, if the council's *primary* motive is profit (salad markup), Clause 1 ("*aimed at* promoting... welfare") could be strained. Your intuition likely (and correctly) dismisses this because the intervention is so trivial and non-coercive/manipulative that motive becomes almost irrelevant. **Recommendation: Keep your verdict.** Don't complicate the principle. Add a caveat: "For extremely trivial, non-manipulative interventions (like (2)), the requirement for the steerer's *primary* motive to be welfare may be relaxed, as autonomy is minimally impaired." The triviality overrides.
  2.  **Your Verdict on (9) Resuscitation Default:** You are unsettled. The JSP clearly condemns it due to lack of transparency at a critical moment. This may feel harsh given physician sincerity and evidence. However, your own discomfort likely stems from the profound stakes and vulnerability – precisely where transparency is *most* crucial. **Recommendation:** **Adopt the JSP verdict (Not Fine).** The loss of potentially beneficial outcomes is outweighed by the ethical necessity of transparency and respecting patient autonomy in life-or-death decisions. Alternatives exist (structured conversations, transparent defaults *disclosed* as such).
  3.  **Underlying Tension in (1) Pension vs. (10) Organ Donation:** You approve both but sense a tension ("no one should choose for me" vs. pension default). The JSP resolves this through **Clause 2 (Transparency)** and **Clause 4 (Standing/Context)**. Pension default is a transparent policy tool for a widespread welfare issue (retirement saving inadequacy) where systematic inertia is the main problem. Organ donation active choice addresses an even more profound autonomy question (disposition of one's body) and a scarce resource allocation, where *forcing* a conscious choice is more respectful than a default, even a default to donate. Both are state actions with standing, but the *nature* of the choice justifies different approaches. Your intuition in (10) is sound.

  **Conclusion:**

  The **Justified Steering Principle (JSP)** – emphasising **Transparency/Avoiding Manipulation, Proportionality, Standing/Context, and Welfare Aim** – captures nearly all your verdicts and provides clear guidance for new cases like the smoking app and resolves your struggle with the resuscitation default. It explains why the airline dark pattern (6) differs from the pension nudge (1) (manipulation vs. transparency), why the state can tax (5) but your friend mostly cannot hide your cigs unasked (8) (standing, proportionality, relationship context), and why the drink cap (4) feels different from seatbelts (3) (proportionality).

  The minor misfit with the salad motive is best handled by acknowledging the overriding effect of *triviality*. Adopting the JSP verdict on resuscitation (9) involves accepting that transparency is non-negotiable at such high stakes, even with benevolent intent. Your analysis demonstrates a sophisticated grasp of the ethical nuances; this principle provides a structured framework for those intuitions.
