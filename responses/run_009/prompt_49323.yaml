answer: |-
  Let's break this down step-by-step, focusing on the conditional mechanics and pathological cases. The "standard fix" is indeed correct for well-behaved distributions with finite expectations, but the paradox bites deeper with heavy tails. I'll address your points with math, intuition, and connections.

  **Core Setup:** Two envelopes contain amounts `(A, 2A)`. A fixed but unknown `A > 0` is chosen by some process. You get one envelope randomly (50/50 chance of small/large). You observe the amount `X` in your envelope. Should you switch?

  ### 1. Conditional on Observed Value `X = x`
  The key is Bayesian updating. Your observation `x` provides evidence about whether you hold the smaller (`S`) or larger (`L`) envelope.

  *   **Prior Belief:** `P(S) = P(L) = 1/2`
  *   **Likelihood:** The probability of observing `x` depends on whether you have `S` or `L` and the *prior distribution of possible values for `A`*. Let `f_A(a)` be the prior probability density function (pdf) for `A`.

  *   If you hold `S` (amount `A`): `P(X=x | S) = f_A(x)`
  *   If you hold `L` (amount `2A`): `P(X=x | L) = f_A(x/2) / 2` (The `/2` arises because `A = x/2`, and the density transforms; this is crucial!)

  *   **Posterior Odds (Bayes' Theorem):**
      `P(S | X=x) = P(X=x | S) * P(S) / P(X=x) = [f_A(x) * 1/2] / P(X=x)`
      `P(L | X=x) = P(X=x | L) * P(L) / P(X=x) = [(f_A(x/2) / 2) * 1/2] / P(X=x) = [f_A(x/2) / 4] / P(X=x)`

      The normalizing constant `P(X=x)` is `[f_A(x) / 2] + [f_A(x/2) / 4]`.

  *   **Posterior Probability Ratio:**
      `P(S | X=x) / P(L | X=x) = [f_A(x) * 1/2] / [f_A(x/2) / 4] = 2 * [f_A(x) / f_A(x/2)]`

  *   **EV of Switching:** If you switch, you gain `x` if you had `L` (prob `P(L|x)`), or you gain `2x - x = x` if you had `S` (prob `P(S|x)`). The *change* in value from switching is:
      `EV(switch | X=x) = [ (x) * P(S | X=x) ] + [ (-x) * P(L | X=x) ]`
      `= x * [P(S | X=x) - P(L | X=x)]`

  *   **Switch if +EV:** Switch if `P(S | X=x) > P(L | X=x)`. From the ratio above:
      `P(S | X=x) > P(L | X=x)` iff `2 * [f_A(x) / f_A(x/2)] > 1` iff `f_A(x) / f_A(x/2) > 1/2`

  *   **The Flip Point:** This is determined by the prior `f_A(a)`. Switching is +EV when `f_A(x) > (1/2) f_A(x/2)`. Intuitively: **Switching is favorable when the density at your observed value `x` is high relative to the density at half of `x`.** This suggests you're more likely to be holding the *smaller* envelope when `x` is a value that is relatively "denser" than values half as large.

      *   **Example (Uniform Prior over `[a_min, a_max]`):** Suppose `f_A(a) = 1/(a_max - a_min)` for `a_min <= a <= a_max`. Then `f_A(x) / f_A(x/2) = 1` if both `x` and `x/2` are in `[a_min, a_max]`. So `P(S|x) / P(L|x) = 2 * 1 = 2`. You're twice as likely to have the smaller envelope, making switching +EV (`EV(switch) = x*(2/3 - 1/3) = x/3 > 0`). **Flip Point:** If you observe `x < 2*a_min`, you *know* you have the smaller envelope (since `x/2 < a_min` is impossible). Switch for sure! If you observe `x > 2*a_max`, you *know* you have the larger envelope (`x/2 > a_max` impossible). Stay! For `2*a_min < x < 2*a_max`, switching is always +EV in the uniform case.
      *   **Priors where observing never helps:** Yes. This happens if `f_A(x) / f_A(x/2) = 1/2` for all `x`. This implies `f_A(a)` is proportional to `1/a` (log-uniform prior). `f_A(a) = k / a` for `a_min <= a <= a_max`. Then `f_A(x) / f_A(x/2) = (k/x) / (k/(x/2)) = (1/x) / (2/x) = 1/2`. So `P(S|x) / P(L|x) = 2 * (1/2) = 1`. `P(S|x) = P(L|x) = 1/2`. `EV(switch | x) = 0` always. Observing `x` gives no information about whether you have S or L.

  ### 2. Always Favors Switching & The Money Pump Question
  This is the pathological case. It occurs when the prior distribution of `A` is **heavy-tailed**, specifically when `f_A(x) / f_A(x/2) > 1/2` for *all* `x`. Crucially, this also implies the expectation of `A` (and hence the money in the envelopes) is **infinite or undefined**.

  *   **The Distribution:** The classic example is `P(A = 2^k) = (2/3) * (1/3)^k` for `k = 0, 1, 2, ...` (A takes values 1, 2, 4, 8, ... with probabilities 2/3, 2/9, 2/27, 2/81, ...). Check the ratio: `f_A(2^k) = P(A=2^k) = (2/3)(1/3)^k`. `f_A(2^k / 2) = f_A(2^{k-1}) = (2/3)(1/3)^{k-1}`. Ratio: `[(2/3)(1/3)^k] / [(2/3)(1/3)^{k-1}] = (1/3)` which is *less* than `1/2`. Hold on! That suggests switching is *not* favored? We need the ratio `f_A(x)/f_A(x/2)` for the *observed* `x`, not the generating `A`. The observed `X` can be either `A` or `2A`. The relevant densities are for `A` at `x` (if you have S) and at `x/2` (if you have L). For *any* possible observed value `x` (which must be a power of 2), say `x = 2^m`:
      *   `f_A(x) = f_A(2^m) = (2/3)(1/3)^m`
      *   `f_A(x/2) = f_A(2^{m-1}) = (2/3)(1/3)^{m-1}`
      *   Ratio `f_A(x) / f_A(x/2) = [(2/3)(1/3)^m] / [(2/3)(1/3)^{m-1}] = (1/3)`
      *   `P(S|x) / P(L|x) = 2 * (1/3) = 2/3 < 1`
      *   Therefore `P(L|x) > P(S|x)`? **Mistake!** We forgot the `/2` in the likelihood for `L`! Recall:
          `P(S | X=x) / P(L | X=x) = 2 * [f_A(x) / f_A(x/2)] = 2 * (1/3) = 2/3`
          So `P(S | X=x) = 2/3 * P(L | X=x)`. Since `P(S|x) + P(L|x) = 1`, solving gives `P(S|x) = 2/5`, `P(L|x) = 3/5`.
      *   `EV(switch | X=x) = x * [P(S|x) - P(L|x)] = x * [2/5 - 3/5] = x * (-1/5) < 0`. **Switching is *negative* EV!** This distribution doesn't exhibit "always switch".

  *   **The Correct Heavy-Tailed Example:** Use a prior where the density decays slower than `1/a`. Try `f_A(a) \propto 1/(a^2)` for `a >= 1` (properly normalized as `f_A(a) = 1/a^2` for `a >= 1`). Now calculate for any observed `x >= 2` (smallest possible `x` if you have `L` is `2*A_min = 2*1=2`):
      *   `f_A(x) = 1/x^2`
      *   `f_A(x/2) = 1/(x/2)^2 = 4/x^2`
      *   Ratio `f_A(x) / f_A(x/2) = (1/x^2) / (4/x^2) = 1/4`
      *   `P(S|x) / P(L|x) = 2 * (1/4) = 1/2` --> `P(S|x) = 1/3`, `P(L|x) = 2/3`
      *   `EV(switch | X=x) = x * [P(S|x) - P(L|x)] = x * [1/3 - 2/3] = -x/3 < 0`. Still negative! We need the ratio `f_A(x)/f_A(x/2)` to be *large*. That requires a density that *increases* or decays very slowly as `a` increases. This is tricky because densities must integrate to 1. **The classic "always switch" example uses a discrete distribution over the pairs themselves:** Suppose the possible *(Small, Large)* pairs are (1, 2), (2, 4), (4, 8), (8, 16), ... each chosen with probability 1/2, 1/4, 1/8, 1/16, ... (probabilities `(1/2)^n` for the pair starting with `S=2^{n-1}`). Now observe `X=x`:
          *   If you see `x=1`: Must be the small envelope of pair (1,2). Switching gets you 2. Gain +1. (Prob 1/2)
          *   If you see `x=2`: Could be S of pair (2,4) (prob 1/4) or L of pair (1,2) (prob 1/2 * 1/2 = 1/4? Wait, no.) **Conditional Probabilities:**
              *   `P(X=2) = P(hold S in (2,4)) + P(hold L in (1,2)) = (1/2 * P(pair (2,4))) + (1/2 * P(pair (1,2))) = (1/2 * 1/4) + (1/2 * 1/2) = 1/8 + 1/4 = 3/8`
              *   `P(S | X=2) = P(hold S in (2,4) | X=2) = [P(hold S in (2,4))] / P(X=2) = (1/2 * 1/4) / (3/8) = (1/8) / (3/8) = 1/3`
              *   `P(L | X=2) = P(hold L in (1,2) | X=2) = [P(hold L in (1,2))] / P(X=2) = (1/2 * 1/2) / (3/8) = (1/4) / (3/8) = 2/3`
              *   `EV(switch | X=2) = [ (4-2=+2) * P(S|X=2) ] + [ (1-2=-1) * P(L|X=2) ] = [+2 * 1/3] + [-1 * 2/3] = 2/3 - 2/3 = 0`
          *   If you see `x=4`:
              *   `P(X=4) = P(hold S in (4,8)) + P(hold L in (2,4)) = (1/2 * 1/8) + (1/2 * 1/4) = 1/16 + 1/8 = 3/16`
              *   `P(S | X=4) = P(hold S in (4,8) | X=4) = (1/16) / (3/16) = 1/3`
              *   `P(L | X=4) = P(hold L in (2,4) | X=4) = (1/8) / (3/16) = (2/16) / (3/16) = 2/3`
              *   `EV(switch | X=4) = [+4 * 1/3] + [-2 * 2/3] = 4/3 - 4/3 = 0`
          *   **Pattern:** For any observed `x = 2^k` (`k >= 1`), `P(S|X=x) = 1/3`, `P(L|X=x) = 2/3`, `EV(switch) = 0`. For `x=1`, `EV(switch)=+1>0`. So switching is only strictly +EV if you see 1, otherwise 0. Still not "always +EV".

  *   **The True "Always Switch" Example (Infinite Expectation Required):** Modify the above. Let the pairs be (2^k, 2^{k+1}) for k=0,1,2,... (S=1,2; L=2,4). Assign probability `P(pair k) = (1/2)^{k+1}`. Now:
      *   `P(hold S=k) = P(select S in pair k) = (1/2) * (1/2)^{k+1} = (1/2)^{k+2}`
      *   `P(hold L=k) = P(select L in pair k) = (1/2) * (1/2)^{k+1} = (1/2)^{k+2}`
      *   Observe `X=x=2^m`. What values `m` can we see? `m=0` (1), `m=1` (2), `m=2` (4), etc.
          *   `P(X=2^m) = P(hold S=m) + P(hold L=m-1)` (since L in pair k is `2^{k+1}`, so L=m means k+1=m, k=m-1)
          `= (1/2)^{m+2} + (1/2)^{(m-1)+2} = (1/2)^{m+2} + (1/2)^{m+1} = (1/2)^{m+2} + 2*(1/2)^{m+2} = 3*(1/2)^{m+2}`
          *   `P(S | X=2^m) = P(hold S=m | X=2^m) = [P(hold S=m)] / P(X=2^m) = [(1/2)^{m+2}] / [3*(1/2)^{m+2}] = 1/3`
          *   `P(L | X=2^m) = P(hold L=m-1 | X=2^m) = [P(hold L=m-1)] / P(X=2^m) = [(1/2)^{(m-1)+2}] / [3*(1/2)^{m+2}] = [(1/2)^{m+1}] / [3*(1/2)^{m+2}] = [2 * (1/2)^{m+2}] / [3*(1/2)^{m+2}] = 2/3`
          *   `EV(switch | X=2^m) = [ (2^{m+1} - 2^m = 2^m) * P(S|X=2^m) ] + [ (2^{m-1} - 2^m = -2^{m-1}) * P(L|X=2^m) ]`
          `= [2^m * (1/3)] + [ -2^{m-1} * (2/3) ] = (2^m)/3 - (2^m)/3 = 0` **Still 0!** Where's the "always switch"?

  *   **The Resolution & The Actual "Disaster":** The examples above show it's hard to get *strictly* positive EV for every `x`. However, the **infinite expectation case breaks the symmetry argument ex-ante**. Recall the flawed unconditional argument: `EV(other) = (1/2)(2X) + (1/2)(X/2) = (5/4)X`. The standard fix says `X` isn't fixed. But if `E[X] = ∞`, then `E[EV(other | X)]` could be `∞` while `E[EV(keep | X)] = E[X] = ∞`. Comparing `∞` to `∞` is meaningless. The flaw manifests as the conditional `EV(switch | X=x)` being undefined or infinite in a way that prevents the ex-ante symmetry argument from holding water. **The "always switch" feeling arises because in these distributions, for *most* observed `x` (especially large ones), the evidence *slightly* favors you holding the smaller envelope (`P(S|x) > 1/2`), but crucially, the *expected gain conditional on large x is also large*, and the probabilities don't decay fast enough to make the overall expectation finite and equal.** There isn't a finite flip point. The money pump illusion occurs *because the expectation is infinite*; you can't actually run the pump because any *finite* sequence of switches won't give you infinite money, and the probabilities of astronomical gains are vanishingly small. It's pathological, not practical.

  ### 3. Infinite Expectations, Broome, St. Petersburg, and Patching
  This is where the core issue lies. **The underlying disease is the same: divergent (infinite or undefined) expectations.**

  *   **Broome-style Paradox:** Suppose the prior for `A` is such that `E[A] = ∞`. Then:
      *   `E[Value in your envelope] = E[X] = ∞`
      *   `E[Value in other envelope | X=x]` could also be `∞` for each `x`, or defined but greater than `x`.
      *   The flawed argument `EV(other) = (5/4)X` suggests `EV(other) = ∞` while `EV(yours) = ∞`.
      *   The conditional argument might suggest switching is +EV for every `x` (or many `x`), even if only slightly.
  *   **St. Petersburg Paradox:** Payoff `= 2^k` with probability `(1/2)^k` for `k=1, 2, 3, ...`. `E[Payoff] = Σ [2^k * (1/2)^k] = Σ 1 = ∞`.
  *   **Pasadena Paradox:** Payoff `= (-1)^{k+1} * 2^k / k` with prob `(1/2)^k`. `E[Payoff] = Σ [ (-1)^{k+1} * 2^k / k * (1/2)^k ] = Σ [ (-1)^{k+1} / k ]`, the alternating harmonic series, which is conditionally convergent (sums to `ln(2)`), but rearrangement changes the sum.

  **The Failure Mode:** Expected utility maximization requires the expectation to be well-defined and finite. When it's infinite or undefined:
  1.  **Comparisons are meaningless:** `∞` vs `∞` tells you nothing. Is switching "better" if both options have `∞` EV? Naive application says yes via `(5/4)X > X`, but it's invalid.
  2.  **Conditionalization breaks:** The expectation `E[EV(switch | X)]` might not equal `EV(switch)` due to non-integrability (Fubini/Tonelli theorems fail).
  3.  **Reordering/Rearrangement:** Like in Pasadena and St. Petersburg, the order of summation/integration matters. The flawed two-envelope argument (`EV(other) = (1/2)(2X) + (1/2)(X/2)`) implicitly assumes a specific way of grouping the possibilities (by the value in *your* envelope), which might not be valid if the sum is conditionally convergent or divergent.

  **The Takeaway:**
  *   **"Expected utility maximization is broken"** is too strong. **EU is well-behaved when utilities have finite expectation.** The problem is applying it naively to gambles with infinite expectation.
  *   **"Comparing infinite/undefined expectations is the broken part"** is closer. The core issue is using EU for non-integrable utilities.
  *   **Same Disease:** Yes, Broome two-envelope, St. Petersburg, and Pasadena are all manifestations of the same problem: **divergent or ill-defined expectations make naive EU comparisons invalid.** The mathematical pathology is identical – the integral (or sum) defining the expected value doesn't converge absolutely.

  **The Patch(es):** (Same core idea for all these paradoxes)
  1.  **Reject Infinite Expectations:** Insist that any gamble considered must have finite expected utility. If a prior implies `E[A] = ∞`, the two-envelope setup with that prior is simply inadmissible for EU maximization. This is the safest "patch".
  2.  **Relative Utilities:** Consider the *ratio* of utilities instead of the difference. Switching doubles or halves your money. `EU_switch / EU_keep` might be well-defined even if absolute EU is infinite. In the symmetric finite case, this ratio is 1. In the heavy-tailed case, it might be definable.
  3.  **Finite Truncation:** Assume the universe/machine/priest generating the amounts has a finite upper bound `M`. All expectations become finite, the symmetry argument holds, `EV(switch)=0`. The "always switch" urge disappears. This resolves St. Petersburg too.
  4.  **Non-Linear Utility:** Use a utility function `u(money)` that grows slow enough to make `E[u(X)]` finite (e.g., `u(x) = log(x)` for St. Petersburg). This often provides consistent answers but changes the decision rule.
  5.  **Weak Expectations / Distributional Approaches:** Compare the distributions (e.g., stochastic dominance) instead of expectations. In the symmetric finite case, neither envelope dominates the other. In heavy-tailed cases, it's messy.

  **If you had to pick one patch:** **Finite Truncation** (Patch 3) is the most universally applicable and conceptually clearest for resolving the *apparent* paradoxes in St. Petersburg and Broome-style two-envelope. It forces the expectations to be finite and well-defined, restoring the validity of the symmetry argument in two-envelope and making the St. Petersburg gamble have a large but finite price. It reveals the infinities as purely mathematical artifacts.

  **In summary:** The clean story stops applying when the prior distribution implies `E[A] = ∞`. The conditional mechanics always work *mathematically* (given a proper prior), but when `E[A] = ∞`, `EV(switch | X=x)` can be positive for all `x` (or many `x`), and the ex-ante symmetry `E[EV(switch | X)] = 0` fails because `E[EV(switch | X)]` and `E[EV(keep | X)]` are both infinite. The "always switch" conclusion is not legitimate; it's an artifact of trying to compare infinities. The underlying disease is divergent expectations, shared with St. Petersburg/Pasadena. The fix is to ensure finite expectations before applying EU.
