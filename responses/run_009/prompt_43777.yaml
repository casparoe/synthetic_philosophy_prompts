prompt: |-
  Grading season, so forgive the typos and the slightly cranky tone. I've taught philosophy of biology for a while now, and every spring we hit the "what is life" unit, and every spring I die a little inside going through the same borderline casses — viruses, prions, mules, brain-dead patients, that immortal cancer cell line. I want something fresh, built to order, because honestly the specs are where the philosophy lives. What the case is ultimately for: I want to show students that the two big definitional families don't just disagree about where to draw one line, they disagree about which axis the line should even be drawn on.

  Setup. On one side, the self-maintenance family: something is alive if it's a self-producing, boundary-maintaining system that actively works to keep itself going (metabolism, membrane, homeostasis — you know the genre). On the other, the evolution family: something is alive if it belongs to a lineage undergoing natural selection, i.e. replicators with heritable variation. These two mostly agree. Build me where they don't, under these constraints:

  1. Realistic. No von Neumann machines, no synthetic life in a vat, no "imagine an entity that...". Built out of ordinary biology — farm, zoo, hospital, lab bench, greenhouse, your pick.

  2. Not a stock case, or at most a cousin of one. If it's a variant of a standard example, the difference has to do actual argumentative work, not costume changes.

  3. The split has to be generated, not stipulated. Don't write "and clearly this thing is alive" and let the definitions trail along — show me what each definition actually computes when you run it on the case. And make it a case where a competent defender of the losing side can still put up a fight; a contested split is worth more than a slam dunk.

  4. This is the part I care about most. Don't give me one case, give me a pair: the main case splits them self-maintenance yes / evolution no; then a nearby variant, changed in exactly one feature, that splits them the other way — self-maintenance no / evolution yes. The feature you toggle has to be the same one doing the work in both splits, so the pair jointly isolates a single variable. I have a hunch the variable is something like where the persistence comes from — work the system does on itself versus conditions it merely happens to sit in — but I'd like to be suprised.

  5. After the pair: name the load-bearing feature; say what happens if you neutralize it, whether both cases collapse into boring territory where the definitions agree; and give the best response available to whichever definition loses in each case — bullet-biting, definitional surgery, or attacking the case itself. And confront the token/type problem head on: does the evolution view even classify organisms, or only lineages, and does your case make the lineage-level move look principled or like a dodge? If the self-maintenance view has an analogous escape hatch, name it and tell me whether it's better or worse.

  Bonus gratitude if a room of non-science undergrads can grasp both cases in about two minutes.
reasoning: |-
  Hmm, the user is a philosophy of biology professor who's frustrated with teaching the same old examples about defining life. They're grading papers and feeling cranky, but they're clearly passionate about engaging students with genuine philosophical dilemmas. 

  The core request is brilliant: they want a pair of realistic biological cases where the two main definitions of life (self-maintenance vs evolution) split in opposite directions when a single feature is toggled. This isn't just about finding edge cases—it's about exposing how the definitions fundamentally measure different things. 

  Key constraints to honor:
  - Must use ordinary biology (no sci-fi)
  - Avoid textbook clichés like viruses
  - Show definitions doing computational work, not just declare outcomes
  - Make the toggle feature identical in both cases
  - Address the token/type problem head-on
  - Keep it accessible to undergrads

  I'm considering farm animals because they're familiar yet rich for manipulation. The persistence mechanism toggle (active maintenance vs environmental passivity) seems promising. For the evolution-yes/self-no case, a heavily managed livestock breed where artificial selection drives adaptation but individual animals are helpless without human intervention. Then flip the persistence mechanism: feral descendants where natural selection operates but individuals are ruggedly self-sufficient. 

  The lineage vs organism issue is crucial here. The evolution view must consistently argue at population level, while self-maintenance focuses on individual physiology. The professor will appreciate forcing students to confront whether "life" is a property of organisms or histories. 

  For accessibility: using pigs keeps it concrete. Students can visualize pampered show pigs versus wild boars. The toggle (source of persistence) is visible in daily care routines versus survival behaviors. Should fit in two minutes if I avoid jargon. 

  Best defenses for each view:
  - Evolution defender: "The show pig lineage is evolving—just via artificial selection. Life is about the information flow, not who presses the select button."
  - Self-maintenance defender: "That feral pig is clearly alive! Its independence proves self-maintenance is what matters at the organism level."

  Neutralizing the toggle collapses both cases: unmanaged heritage breeds would satisfy both definitions, making the disagreement vanish. That's perfect—it shows the toggle is doing the heavy lifting. 

  This should surprise the professor. Instead of weird lab specimens, it uses mundane agriculture to reveal how definitions prioritize agency (self-driven persistence) versus historical process (selection-driven change).
answer: |-
  Okay, professor, grading trenches solidarity. Let's ditch the viral undead and build you a fresh pair of cases from the farmyard, designed to your exact specs. The core variable? **The source of persistence:** whether the system's continued existence depends primarily on *its own active, ongoing work* or on *external conditions/structure that passively maintain it*.

  **The Pair:**

  1.  **Case Alpha: Self-Maintenance YES / Evolution NO**
      *   **The Entity:** A single, purebred, highly inbred line of *show-quality dairy goats* (e.g., Saanens) kept in a meticulously managed environment.
      *   **Conditions:**
          *   **Highly Managed:** Constant human intervention: climate-controlled barns, precisely formulated feed delivered on schedule, routine veterinary care (vaccinations, parasite control, hoof trimming), assisted breeding (often AI), assistance during kidding, protection from predators.
          *   **Artificial Selection:** Breeding is *entirely* driven by human aesthetic/performance standards (udder conformation, milk yield for shows, coat quality, temperament). No natural selective pressures operate; weak or sickly kids are nursed to health. Genetic diversity is very low due to inbreeding; spontaneous beneficial mutations are extremely unlikely to spread meaningfully.
          *   **Self-Maintenance Intact:** *Individually*, each goat performs all core metabolic functions: respiration, digestion, circulation, waste excretion, homeostasis (regulating temperature, blood pH, etc., *within the bounds supported by the environment*). It has a clear boundary (skin), repairs itself, grows, responds to stimuli (e.g., gets hungry, seeks the feed trough humans provide).
      *   **Running the Definitions:**
          *   **Self-Maintenance:** YES. Each goat is a clear, ongoing, self-producing, boundary-maintaining system. It actively works to maintain its internal state using the abundant resources provided. Its metabolism, membrane, and homeostatic processes are fully operational *as an individual organism*.
          *   **Evolution:** NO (arguably). The *lineage* is not undergoing significant *natural* selection. Variation is minimized (inbreeding), selection is artificial and static (breed standard), and adaptation to a changing natural environment isn't happening. The lineage's persistence depends entirely on human management, not heritable variation leading to differential survival/reproduction in a natural context. It's arguably *stasis*, not evolution.

  2.  **Case Beta (Toggled Feature): Self-Maintenance NO / Evolution YES**
      *   **The Entity:** A *feral population* descended from escaped dairy goats (same genetic starting point as Case Alpha).
      *   **Conditions:**
          *   **Unmanaged Environment:** Lives in a rugged, variable environment (e.g., coastal cliffs, mountains). Exposed to weather, predators, food scarcity, disease without human intervention.
          *   **Natural Selection:** Strong selective pressures operate. Goats with better foraging skills, disease resistance, predator evasion, toughness, or adaptations to the specific terrain survive and reproduce more effectively. Heritable variation (even from the original limited gene pool + new mutations) leads to differential fitness. The population is demonstrably adapting to its environment over generations (e.g., changes in size, coat, behavior, digestive efficiency).
          *   **Self-Maintenance Compromised:** *Individually*, goats often suffer significant failures of self-maintenance due to environmental harshness. A goat might be chronically malnourished, parasite-ridden, injured, suffer from exposure (failed thermoregulation), or die from a treatable infection. Its internal systems are constantly *overwhelmed* by external pressures it cannot fully regulate against. Its "active work" is insufficient without the managed environment.
      *   **Running the Definitions:**
          *   **Self-Maintenance:** NO (arguably). While the goat *attempts* homeostasis and metabolism, it often fails catastrophically due to the unrelenting environment. Its boundaries are frequently breached (injury, disease), its internal state dysregulated beyond recovery (starvation, severe infection). It dies *because* its self-maintenance systems are inadequate to the conditions. It's not robustly self-sustaining.
          *   **Evolution:** YES. The *population* is clearly undergoing natural selection. There is heritable variation, differential survival/reproduction based on that variation, and adaptation to the local environment is observable across generations. The lineage persists *because* of this evolutionary process.

  **The Load-Bearing Feature (Toggled): The Source of Persistence**

  *   **In Alpha (Self-YES/Evol-NO):** Persistence of the *individual* goat depends heavily on **passive, externally provided structure/conditions** (managed environment, human care). Its *own* active self-maintenance operates effectively *only within* this provided bubble.
  *   **In Beta (Self-NO/Evol-YES):** Persistence of the *lineage* depends on **active, population-level processes** (natural selection acting on heritable variation). Persistence of the *individual* is frequently compromised because the **active self-maintenance of the individual is insufficient** against the harsh, unmanaged environment.

  **Neutralizing the Feature: The Collapse into Agreement**

  Imagine **heritage breed goats on a well-managed *organic/sustainable* farm.** Environment provides basic shelter/protection but isn't hyper-controlled. Some natural selective pressures exist (e.g., requiring basic foraging ability, some disease resistance), but human intervention prevents catastrophic failure (basic veterinary care, supplemental feed in winter). Breeding prioritizes breed traits but allows some natural selection within the herd.

  *   **Self-Maintenance:** YES. Individuals generally maintain themselves effectively *with moderate, non-intrusive support*.
  *   **Evolution:** YES (arguably). The population experiences some natural selection alongside artificial selection, leading to slow adaptation within the farm environment. Heritable variation matters.

  **Best Responses & The Token/Type Problem:**

  *   **For Alpha (Self-YES/Evol-NO):**
      *   *Evolution Defender's Best Response (Biting Bullet/Shift Level):* "Alpha isn't about the *goat*, it's about the *lineage*. The lineage *is* evolving, just artificially. Artificial selection *is* a form of selection – the replicators (genes) still have heritable variation leading to differential replication. Humans are just part of the selective environment. Calling it 'not evolution' is arbitrary. Life is a property of the evolving lineage, not the comfort of the individual token organism." *Confronting Type/Token:* This forces the evolution view to clearly embrace the lineage-level perspective. Is it principled? Only if you accept artificial selection as "real" evolution. It can feel like a dodge if you emphasize "*natural*" selection as key. The defender must argue selection mechanism (natural vs artificial) isn't the core – replicators and differential fitness are.
      *   *Self-Maintenance Analog Escape Hatch (Worse):* "The *goat itself* isn't truly self-maintaining; it's just a cog in the human maintenance system." This is weak. The goat demonstrably *does* perform core metabolic functions. Denying this undermines the definition entirely. Worse than the lineage shift.

  *   **For Beta (Self-NO/Evol-YES):**
      *   *Self-Maintenance Defender's Best Response (Attack the Case/Surgery):* "The *individual feral goat* IS alive! Its systems are *working*, just under duress. Starving is a *process* of a living system breaking down; a rock doesn't starve. Death from exposure proves it *was* thermoregulating until overwhelmed. 'Robustness' isn't in the definition – active maintenance attempts count, even if they fail in harsh conditions. We wouldn't say a human lost in the woods isn't alive until they die!" *Confronting Type/Token:* The self-maintenance view naturally focuses on the token organism. Its escape hatch is lowering the threshold for "active maintenance" to include struggling systems. This risks including things like burning candles.
      *   *Evolution Analog Escape Hatch:* None really. The evolution view is happy at the lineage level.

  **Why This Works for Undergrads (2-Minute Pitch):**

  1.  **"Picture two kinds of goats..."** (Immediate concrete image)
  2.  **"Goat A: Pampered show goats. Perfect barn, vet on call, fancy food. Each goat is healthy and does all its goat stuff internally (breathes, eats, poops). BUT, they're so inbred and managed, they aren't really evolving as a group."** (Self-YES/Evol-NO)
  3.  **"Goat B: Their wild cousins. Tough life: find food, avoid coyotes, no doctor. The *herd* is getting tougher over time (evolution!). BUT, *individual* goats? Often sick, starving, injured – their bodies can't keep up."** (Self-NO/Evol-YES)
  4.  **"The difference? Pampered goats stay alive because of their *perfect setup*. Wild goats stay *as a group* because of *survival of the fittest*, but individuals struggle."** (Source of Persistence)
  5.  **"So, does 'life' mean a working body *right now* (Self), or being part of a changing family line (Evol)? They pick different winners here."**

  This uses familiar concepts (pets, wild animals), clear contrasts (barn vs wilderness, health vs sickness), and avoids deep jargon. The toggle ("who/what keeps it going?") is intuitive. The lineage vs individual tension is inherent in the examples. Good luck with the grading!
