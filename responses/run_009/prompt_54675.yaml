  For point 1, I think SETI practices assume meaning can bootstrap from physical patterns alone - that artificiality announces itself structurally without shared context. This rules out strong cultural relativism about meaning.

  For point 2, the narrowband focus strictly presupposes that nature doesn't produce such signals, so detection requires no prior context. It fits with but doesn't require the idea that intelligence must announce itself this way.

  For point 3, the noise convention adds that meaning must be intentionally accessible - senders should avoid compression that requires receivers to guess the decoding. This assumes cooperative communication.

  For point 4, a context-constituted view would predict SETI should look for messages embedded in natural phenomena, or messages that build context gradually rather than announcing artificiality upfront.

  For point 5, the biggest change under a context-constituted view would be abandoning the distinction between noise and signal - all data would need examination as potential culturally embedded messages.

  I'll structure this as exactly five numbered points in British English as requested, with no introduction or conclusion. I'll maintain a philosophical tone while grounding it in the actual practices the user described.
answer: |-
  Here are the five points as requested:

  1.  The practice implicitly presumes a theory wherein meaning is fundamentally structural and potentially universal, residing in mathematically discernible patterns that can be extracted from raw physical signals by any sufficiently advanced intelligence, independent of shared biological, cultural, or historical context; meaning bootstrap from physics via detectable artificiality.
  2.  The narrowband preference strictly presupposes that artificiality *must* manifest as a statistically improbable deviation from natural background processes (a detectable frame message), whereas it merely fits well with, but does not strictly require, the notion that intelligence universally *chooses* such easily detectable signatures for initial contact.
  3.  The compression-as-noise filing convention adds the presupposition that intelligible meaning requires *intentional accessibility* – that a sender aiming for contact bears the burden of ensuring their message's outer message (decoding scheme) is either self-evident from the structure (like Arecibo's prime factors) or explicitly provided in a universally readable format (like Voyager's cover), ruling out messages where the decoding key is opaque or requires serendipitous guesswork.
  4.  A context-constituted view (where meaning is inseparable from shared culture, history, or biology) would predict that SETI should instead focus on signals *embedded within* recognisable natural contexts or phenomena potentially shared across worlds (e.g., stellar rhythms, planetary transits), or that METI should prioritise sending messages mimicking natural processes that gradually build a shared contextual framework *before* attempting complex inner messages like human languages or music.
  5.  The most philosophically consequential change under a context-constituted view would be the abandonment of the core distinction between "signal" and "noise," demanding that SETI treat *all* received data, no matter how apparently random, as potentially meaningful *only within a specific, as-yet-unknown cultural or contextual framework*, requiring vastly different analysis focused on pattern emergence over cosmic timescales or relative to specific cosmic locales.
