answer: |-
  ## The Fiction Framer: Temporal Hygiene for Serious Novelists  
  **By Prof. Thaddeus Quill, Ph.D. (Metaphysics), MFA (Iowa), Editor-at-Large for Narrative Persistence**

  Gentle colleagues, it has come to my attention that an insidious metaphysical sloppiness pervades our craft. Novelists, in their well-intentioned haste to spin yarns, persistently (if you’ll pardon the term) treat their characters as *enduring substances* – monolithic entities plodding unchanged from chapter one to “The End.” This is not only philosophically bankrupt but a profound disservice to narrative integrity. Let us cleanse our prose with the scalpel of **Perdurantism**.

  **Rule 1: Ban the Enduring Adjective.** Your character *at page 50* is not “brave” simply because the *page-10-part* performed a valiant act. That earlier temporal part exhibited bravery; the current part may well be cowering behind the chaise longue. Describing Captain Ahab *throughout* as “obsessed” is a continuity error akin to having him wear spats in Chapter 3 and sandals in Chapter 4 *without remarking on the change*. Instead: “The Chapter-7-Ahab-part gripped the rail, its monomaniacal features contorted…” Precision!

  **Rule 2: Change Demands Explicit Segmentation.** That beloved trope, “character development”? A mirage. When young Pip encounters Magwitch, you are not depicting *Pip changing*. You are depicting the *Pip-at-the-graveside-part* (frightened, common) and then, later, the distinct *Pip-reading-in-Matthew-Pocket’s-study-part* (ambitious, slightly pretentious). The transition is not growth, it is *succession*. If the timid bank clerk suddenly draws a revolver, don’t write “He found courage he never knew he had.” Write: “The Tuesday-3:15-PM-Clive-part, distinct from the cowering Monday-part, produced a Smith & Wesson from its briefcase.”

  **Rule 3: Count Your Protagonist-Parts (Especially with Unreliability).** An unreliable narrator doesn’t merely distort *one* enduring protagonist; they create a proliferation of *apparent* protagonist-parts! That confession in the final chapter? It doesn’t reveal the *true, enduring* narrator. It reveals that the *epilogue-narrator-part* possesses different beliefs/memories than the *chapter-one-narrator-part*. Are they the same protagonist? Only in the loose, vulgar sense that they are causally connected parts of a larger, four-dimensional protagonist-worm. Your novel doesn’t have *one* Humbert Humbert; it has hundreds, perhaps thousands, strung along the temporal line, some lying flagrantly. Count accordingly during revisions.

  **Objection Anticipated (Sigh):** “But Professor Quill, this makes my characters feel… *fragmentary*! Where’s the *soul*?” Precisely where it belongs: nowhere in respectable narrative ontology. Your character is the sum of its temporal parts, not a ghostly passenger riding atop them. Capture the sequence, the causal glue, the *relations* between parts, and the character emerges – not as an enduring lump, but as a magnificent, intricate *process* laid bare on the page.

  ---

  **SIDEBAR: Stage Theory - The "Close Third-Person" Aesthetic**

  For writers seeking an even tighter focus, consider **Stage Theory** as your narrative lens. Here, *only the current temporal part exists* within the scene’s "now." Think of it as the ultimate close third-person POV, zoomed in not just mentally, but *ontologically*.

  *   **The "I" of the Moment:** In a first-person Stage Theory narrative, "I" refers *only* to the narrator-part currently writing/scene-unfolding. Yesterday’s "I" is gone. This creates intense immediacy and fascinating unreliability – the Chapter 12 narrator-part may genuinely not recall (or believe) what the Chapter 5 narrator-part did.
  *   **Scene as Isolated Stage:** Each scene contains exactly one temporal part per character. Descriptions apply *only* to that part. The brave knight-part enters the dragon’s cave; whether the quivering squire-part waiting outside is "the same knight" is irrelevant *to the cave scene*. Focus on the knight-part’s gleaming, *current* armour and its present-terror.
  *   **Pros:** Unmatched present-moment intensity; eliminates accidental endurance-smuggling; perfect for kaleidoscopic or amnesiac narratives.
  *   **Cons:** Requires rigorous scene discipline; readers accustomed to enduring egos may feel adrift. Use judiciously.

  ---

  **Letters to the Framer**

  *   **"Perplexed in Poughkeepsie" writes:** *“Prof. Quill, your advice ruined my claymation bildungsroman! I described the lump of clay in Chapter 1, then the sculptor shaped it into a bust of Cicero in Chapter 2. Your copy-editor flagged it as an ‘endurantist category error.’ But it’s the SAME CLAY!”*  
      **Prof. Quill replies:** Dearest Perplexed, your error is fundamental. The Chapter-1-clay-part and the Chapter-2-Cicero-bust-part are distinct temporal parts of a single *spacetime worm*. They are not “the same” in the sense of numerical identity enduring change; they are successive stages. Describe the *process*: “The sculptor’s hands worked upon Tuesday’s clay-part, imposing form, resulting in Wednesday’s distinct Cicero-bust-stage.” Clarity! (And consider filing down that bildungsroman obsession.)

  *   **"Splitting Hairs (and Selves?) in Seattle" writes:** *“After implementing your rules, my amnesiac twin storyline feels like it has FOUR protagonists! The pre-amnesia part, each twin part post-split… it’s chaos!”*  
      **Prof. Quill replies:** Seattle, you grasp the glorious consequence! Post-fission, you *do* have multiple, distinct protagonist-worms (or stages, depending on your aesthetic). The pre-fission part is a shared temporal segment for *both* resulting protagonist-worms. This isn’t chaos; it’s ontological accuracy. Embrace the multiplicity! Label your POVs rigorously: “Protagonist-Worm-Alpha (Wednesday-Morning-Part)”, etc. Your readers will thank you for the precision, once they adjust their primitive endurantist intuitions. Persist!
