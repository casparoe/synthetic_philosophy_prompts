  First, I need to break down Lakatos's framework piece by piece. The hard core is the set of untouchable assumptions. In ML, that could be the scaling hypothesis—the belief that bigger models and more data/compute lead to better performance. The protective belt consists of auxiliary hypotheses that can be adjusted to protect the hard core. In ML, this might involve techniques like data augmentation or regularization when a model fails on a benchmark. 

  Positive heuristics guide what to pursue, like scaling models or exploring architectures. Negative heuristics tell you what to avoid, such as questioning the scaling hypothesis. Progressive problemshifts mean the program predicts novel facts and improves benchmarks, while degenerating ones involve ad-hoc fixes without real progress. Sophisticated falsification considers the whole program's trajectory, unlike naive falsification which rejects theories based on single failures.

  Now, translating to ML terms: Benchmark leaderboards act as empirical tests. Held-out test sets prevent overfitting. Scaling laws and compute budgets are part of the positive heuristic. Ablation studies test auxiliary hypotheses. Baselines and SOTA-chasing reflect competition within the program. Preprints and peer review (including reviewer 2's critiques) are part of the social process. Replication issues and benchmark contamination are anomalies that challenge the program.

  For the residue report, the user wants to know if ML has concepts for the hard core being protected by methodological decisions. Also, if there's a counterpart to the long time horizon Lakatos mentions. And any missing pieces due to corporate influence.

  The hard core in ML isn't explicitly acknowledged as such. The community protects the scaling hypothesis by ignoring negative results from ablations or attributing failures to insufficient scale. That's similar to Lakatos. But ML lacks a term for this methodological decision. Terms like "scaling hypothesis" exist, but not the idea of it being untouchable by design.

  Time horizon is a big gap. ML's rapid leaderboard cycles don't allow for long-term assessment. Papers often don't revisit past failures. The field moves too fast, making it hard to judge if a program is truly degenerating. Corporate ownership exacerbates this by hiding internal research and failed experiments. Rational reconstruction is harder when history isn't visible.

  Corporate influence means the "actual history" is obscured. Researchers might not see the protective belt adjustments happening internally, like tweaks to handle benchmark failures. This lack of transparency prevents a clear view of whether a program is progressive or degenerating.

  So, the residue report points out that ML needs terms for the methodological protection of the hard core and lacks long-term evaluation frameworks. Corporate control makes applying Lakatos's ideas challenging because key data is inaccessible.
answer: |-
  Here's a faithful translation of Lakatos's MSRP into ML's operational vocabulary, followed by the residue report you requested:

  ### Core Translation: Lakatos → ML
  1.  **Hard Core:** *The Scaling Hypothesis*. The unfalsifiable core belief that "performance (capabilities, generalization, eventually AGI) improves predictably with model scale, data scale, and compute scale." Protected by methodological decision.
  2.  **Protective Belt (Auxiliary Hypotheses):** *Benchmark-Specific Hacks & Architecture Tweaks*. Techniques like specialized optimizers (Lion, Sophia), architectural modifications (RoPE, GQA), data augmentation strategies, prompt engineering tricks, and *especially* **benchmark contamination mitigation strategies** (e.g., deduping training data against specific test sets *after* contamination is discovered). Protects the core when benchmarks aren't surpassed as predicted.
  3.  **Positive Heuristic:** *Scaling Laws & Compute-Optimal Training*. The "playbook": predict performance gains via scaling laws, allocate compute budgets optimally, engineer infrastructure for larger runs, explore novel architectures *within the scaling paradigm* (Transformers → Mixture of Experts), discover emergent phenomena through scale. Guides *what to build next*.
  4.  **Negative Heuristic:** *The "Bitter Lesson" Mandate*. Avoids dedicating significant effort to hand-engineered features, symbolic systems, or complex inductive biases that might compete with scale. Directs effort *away* from paths deemed likely to lose to brute-force scaling in the long run. Protects the core by deflecting criticism towards insufficient scaling.
  5.  **Progressive Problemshift:** *Novel Capabilities & Benchmark Supersaturation*. A model release (e.g., GPT-4, Gemini Ultra) not only tops leaderboards (**quantitative growth**) but demonstrably enables *new* capabilities not explicitly benchmarked (e.g., complex tool use, high-quality few-shot instruction following, qualitative leap in reasoning) or *saturates* existing benchmarks so thoroughly that the benchmark itself becomes questionable (**novel fact prediction**).
  6.  **Degenerating Problemshift:** *Leaderboard Gaming & Post-Hoc Rationalization*. Focus shifts to:
      *   Overfitting leaderboards via benchmark-specific tweaks (protective belt adjustments).
      *   Marginal gains (<1%) on saturated benchmarks requiring massive compute.
      *   Ablation studies used primarily to *excuse* failures ("We didn't have enough data for that sub-task") rather than challenge core assumptions.
      *   SOTA claims based on narrow, cherry-picked, or contaminated benchmarks.
  7.  **Sophisticated vs. Naive Falsificationism:**
      *   *Naive:* Rejecting the scaling hypothesis because a *specific* large model fails on a *specific* benchmark (e.g., "LLMs can't do math!" after an early GPT failure). Common in pop-sci commentary.
      *   *Sophisticated:* Evaluating the *entire trajectory* of the scaling programme. Does scaling consistently drive progress across *diverse* benchmarks over time? Does it predict and deliver *novel* capabilities? Requires looking beyond a single model or benchmark cycle.
  8.  **Rational Reconstruction vs. Actual History:**
      *   *Rational Reconstruction:* The clean narrative in papers: "Motivated by scaling laws (positive heuristic), we scaled model/data/compute (core), achieving SOTA on benchmarks X,Y,Z (progressive shift). Ablation A showed component B is crucial (protective belt adjustment)."
      *   *Actual History:* The messy reality: failed runs, benchmark contamination discovered post-submission, negative results buried, compute bottlenecks forcing compromises, reviewer 2 demanding ablations that accidentally cripple performance but get included anyway, SOTA chase leading to overfitting known test sets, corporate pressure shaping release timing/claims.

  **On the Protective Belt:** It's **broader than just "benchmark hacking."** Yes, it includes leaderboard overfitting and post-hoc ablation rationalization. But it *also* encompasses legitimate technical innovations (new optimizers, efficient attention) developed *within the core paradigm* to overcome specific obstacles *without* challenging scale. The key Lakatosian point is its function: **defending the core against anomalies.** Whether a specific belt adjustment is "hacking" or "legitimate innovation" is often only clear in hindsight based on the programme's *future* progressiveness.

  ### The Residue Report: Where ML's Vocabulary Fails Lakatos

  1.  **The Methodological Decision Protecting the Hard Core:**
      *   **Gap:** ML **lacks explicit vocabulary** for the *deliberate, social decision* to insulate the scaling hypothesis from direct falsification. We have "scaling hypothesis," but no term capturing its *protected status by community fiat*.
      *   **Manifestation:** It's visible in *what doesn't happen*. Critiques attributing failures to "insufficient scale" are accepted, even when scale increases are impractical. Proposals to abandon scaling for a fundamentally different paradigm (e.g., neurosymbolic) are dismissed *a priori* via the "Bitter Lesson" (negative heuristic). Failed scaling experiments are attributed to faulty auxiliary assumptions (bad architecture, noisy data, insufficient RLHF – protective belt) rather than the core. **The core's immunity is an implicit, unspoken rule enforced socially, not a concept we name.**
      *   **Verdict:** **Missing concept.** We don't have a term like "core immunization strategy" or "methodological protection pact." This is a significant residue.

  2.  **The Long Time Horizon for Judging Degeneration:**
      *   **Gap:** ML's operational cycle (**quarterly leaderboards, arXiv sprint, conference deadlines**) is fundamentally **antithetical** to Lakatos's required timeframe. Degeneration is assessed over *years or decades* of a programme's trajectory.
      *   **Counterpart?** The closest is vague appeals to "long-term trends" in scaling laws or discussions of "plateaus," but these lack the *structured framework* Lakatos provides. The "Bitter Lesson" itself is a *post-hoc* historical argument applied retrospectively, not a real-time assessment tool.
      *   **Verdict:** **No functional counterpart.** Our incentive structure (SOTA chasing, rapid publishing) actively *prevents* the necessary long-view assessment. We can *describe* a programme's history as degenerating (e.g., "GANs after BigGAN"), but we lack tools/consensus for declaring *ongoing* programmes degenerate *in real-time* based on Lakatosian criteria. The time horizon residue is massive.

  3.  **Concepts Without ML Counterparts & Why:**
      *   **Rational Reconstruction as an Explicit Ideal vs. Invisible History:**
          *   **Gap:** Lakatos assumes rational reconstruction is *possible* and *valuable* for understanding scientific progress, even if messy. In corporate-dominated ML, **the "actual history" is often completely inaccessible** (proprietary failed runs, internal benchmark contamination, undisclosed compute budgets, undisclosed data, strategic paper framing). The "mess" isn't just messy; it's *classified*.
          *   **Why Missing:** Corporate ownership creates a **fundamental asymmetry**. Researchers *inside* the programme (at labs) have access to messy history but strong incentives to present only clean rational reconstructions. Researchers *outside* (academia) lack access to the mess needed for accurate reconstruction. **Lakatos's model assumes a level of transparency incompatible with current ML practice.** His notion of rational reconstruction as a useful tool for philosophers/historians *of the field* breaks down when the history is proprietary.
      *   **Sophisticated Falsification as a Community Practice:**
          *   **Gap:** While the *concept* can be described (as above), the **community norms and mechanisms** for consistently applying it are weak.
          *   **Why Weak:** Short cycles, SOTA pressure, and corporate interests favor **naive falsification** ("Model X failed benchmark Y, therefore technique Z is useless") or **dismissive immunization** ("Just needs more scale/compute/data"). Reviewers often lack time/context for sophisticated assessment. **Lakatos assumes a community committed to his methodology; ML's community is committed to empirical progress on visible benchmarks, often within commercial constraints.**
      *   **The "Novel Fact" Criterion for Progress:**
          *   **Gap:** We celebrate **benchmark saturation** (e.g., "human-level on GLUE") but rarely frame it as Lakatos's key indicator of progress ("progressive problemshift"). We lack frameworks for rigorously identifying and validating truly *novel* capabilities predicted by the core that weren't explicitly targeted.
          *   **Why Missing:** Benchmarks are concrete; "novel facts/capabilities" are fuzzy and often retrospectively claimed. Our evaluation infrastructure (leaderboards, standardized datasets) isn't built for agile assessment of genuinely unexpected emergence. **Lakatos prizes prediction of the novel; ML often values mastery of the known.**

  **Conclusion:** Translating Lakatos reveals significant residues. ML *implicitly* protects its hard core (scaling) via social practice but lacks the vocabulary to describe this methodological decision. Our frantic pace inherently obstructs the long time horizon Lakatos requires for judging degeneration. Most critically, **corporate ownership and secrecy fundamentally undermine the visibility of "actual history" and the feasibility of Lakatos's rational reconstruction project.** The Bitter Lesson functions as a powerful negative heuristic protecting the core, but it's a historical argument, not a real-time assessment tool compatible with quarterly leaderboards. Lakatos provides a powerful lens, but applying it rigorously to modern ML exposes not just conceptual gaps, but structural incompatibilities between his model of "science" and the reality of a corporate-driven, benchmark-obsessed, fast-paced field. The residue isn't just missing words; it's a reflection of the field's sociology clashing with the philosophy.
