  For structure, each item should present concrete scenarios with answer options phrased as evaluations (e.g., "spoke falsely" not "violated truth norm"). The scoring key must map answer combinations to five positions: knowledge norm, truth norm, justified-belief norm, belief norm, and no-norm deflationism. I anticipate truth and justified-belief norms will be hardest to distinguish—maybe the forgetful expert case can pry them apart if designed carefully.

  Key design considerations: 
  - The retraction case should contrast initial propriety vs. later retraction duty to test norm constitutivity.
  - Blame judgments (Item 8) are crucial for separating norms that otherwise converge on truth conditions.
  - Novel cases should stress-test boundaries: the expert case targets justification without conscious access, while the forecast case challenges probabilistic thresholds.

  For the answer key, I'll define decision points as binary questions about truth/belief/justification/knowledge requirements and norm status (constitutive vs. pragmatic). Unstable combinations (e.g., requiring justification but not belief) will be flagged as incoherent. The lottery case is pivotal for truth vs. knowledge norms, while the selfless assertion separates belief-based norms from others.

  Finally, machine-readable output will list the five norm labels for verification. The quiz avoids theoretical terms throughout to force intuitive responses—exactly what the professor needs to bypass students' paper-matching tendencies.
answer: |-
  ## Diagnostic Quiz: Which Norm of Assertion Do You Actually Accept?

  **Instructions:** For each scenario, choose the verdict that best captures your intuitive judgment about the speaker's assertion. Answer based solely on your reaction to the case, not on theoretical labels. Select one option per item.

  ---

  1.  **The Stopped Watch:** Alex glances at their antique pocket watch, which stopped exactly 12 hours ago at 2:00 PM. Unbeknownst to Alex, it is now exactly 2:00 AM. Alex asserts, "It's 2:00 right now."
      *   (A) Alex spoke correctly; their assertion was fine as uttered.
      *   (B) Alex spoke falsely; what they said was not true.
      *   (C) Alex asserted something true, but spoke improperly despite the truth.

  2.  **The Lottery Ticket:** Brenda holds a single ticket in a large, fair lottery where the odds of her ticket winning are one in a million. She has no special information. Brenda asserts, "My ticket is a loser; it won't win."
      *   (A) Brenda spoke correctly; her assertion was fine as uttered.
      *   (B) Brenda spoke falsely; what she said was not true (since it *could* win).
      *   (C) Brenda asserted something true (or likely true), but spoke improperly in asserting it so flatly.

  3.  **Gettiered Sheep:** Carlos is in a field looking at a rock that looks exactly like a sheep. Based on this perception, Carlos forms the belief "There is a sheep in the field." Unbeknownst to Carlos, there *is* a real sheep hidden directly behind the rock. Carlos asserts, "There is a sheep in the field."
      *   (A) Carlos spoke correctly; his assertion was fine as uttered.
      *   (B) Carlos spoke falsely; what he said was not true (because he was looking at a rock).
      *   (C) Carlos asserted something true, but spoke improperly despite the truth.

  4.  **Selfless Warning:** Dana strongly believes, based on misleading but compelling evidence, that a bridge is unsafe. Dana knows their friend Evan intends to cross the bridge. Fearing for Evan's safety, and despite disbelieving the bridge is actually unsafe (which it isn't), Dana urgently asserts, "Don't cross that bridge; it's unsafe!" to prevent Evan from crossing.
      *   (A) Dana spoke correctly; their assertion was fine as uttered (it achieved its good purpose).
      *   (B) Dana spoke falsely; what they said was not true (the bridge was safe).
      *   (C) Dana asserted something false, but spoke properly given their noble intention.

  5.  **Moore's Paradox:** Fiona asserts: "It is raining outside, but I don't believe that it is raining outside."
      *   (A) Fiona spoke correctly; her assertion was fine as uttered.
      *   (B) Fiona spoke falsely; at least one part of what she said must be false.
      *   (C) Fiona spoke improperly or absurdly, regardless of the truth about the rain or her belief.

  6.  **The Forgetful Expert:** Dr. Grant, a renowned and highly reliable geologist, has just finished meticulously examining core samples, conclusively proving Site X contains no oil. As she starts to drive home, she suffers a temporary, minor concussion from a low-hanging beam in her garage, causing her to completely forget her findings and the examination process, though her expertise remains intact. Relying only on her general geological knowledge of the region (which makes oil *possible* but unlikely at Site X), and unaware she just disproved it, Dr. Grant asserts to a colleague: "There is definitely no oil at Site X."
      *   (A) Dr. Grant spoke correctly; her assertion was fine as uttered (she *is* entitled to say it).
      *   (B) Dr. Grant spoke falsely; what she said was not true (if, counterfactually, there was oil).
      *   (C) Dr. Grant asserted something true (or likely true), but spoke improperly because she lacked access to her full justification.

  7.  **Retraction Challenge:** Yesterday, Harry observed Jill walking out of a bank wearing a ski mask and carrying a bag. Based on this, Harry justifiably asserted to Irene: "Jill robbed the bank yesterday." Today, overwhelming evidence surfaces proving Jill was participating in a sanctioned bank security drill at that exact time; she did not rob the bank. Irene confronts Harry with this new evidence.
      *   (A) Harry's original assertion was correct yesterday and he need not retract it now; the new evidence doesn't change that.
      *   (B) Harry's original assertion was correct yesterday, but he *must* retract it now given the new evidence.
      *   (C) Harry's original assertion was incorrect yesterday, regardless of today's evidence.

  8.  **The Chancy Forecast:** The national weather service's most advanced models show a 70% chance of rain tomorrow afternoon. Meteorologist Kelly, reporting on the evening news, asserts: "It will rain tomorrow afternoon."
      *   (A) Kelly spoke correctly; her assertion was fine as uttered.
      *   (B) Kelly spoke falsely; what she said was not true (since it's only 70% likely).
      *   (C) Kelly asserted something that might be true or false, but she spoke improperly by stating it as certain.

  9.  **Blame for a Lucky Truth:** Liam hates his neighbor Miles. Liam plants fake evidence suggesting Miles committed a crime, intending to get Miles arrested, and asserts to the police: "Miles stole the jewels." Unbeknownst to Liam, Miles *did* actually steal the jewels, though Liam's planted evidence played no role in Miles's decision. Liam's assertion leads to Miles's arrest.
      *   (A) Liam spoke correctly; his assertion was fine as uttered (it was true).
      *   (B) Liam spoke falsely; his assertion was not true (it relied on fake evidence).
      *   (C) Liam asserted something true, but deserves significant blame for making the assertion due to his malicious intent and method.
      *   (D) Liam asserted something true, and deserves no particular blame for making the assertion (the blame is only for planting evidence).

  10. **The Inadvertent Truth-Teller:** Nora wants to deceive Omar. Nora believes (correctly) that the treasure is not in the red box, but she wants Omar to think it *is* in the red box. However, Nora misspeaks and asserts: "The treasure is not in the red box" (stating her true belief by accident). Unbeknownst to Nora, Omar knows she is often deceptive but sometimes truthful by accident.
      *   (A) Nora spoke correctly; her assertion was fine as uttered (it was true and expressed her belief).
      *   (B) Nora spoke falsely; what she said was not true (if the treasure was in the red box).
      *   (C) Nora asserted something true, but spoke improperly because she intended to deceive.

  ---

  ### Scoring Key: Mapping Your Verdicts to the Logical Space

  This key identifies your underlying commitments based on your pattern of answers. It uses the following fundamental questions defining the logical space of assertion norms:

  1.  **Truth Required?** (T): Must the proposition asserted *be true* for the assertion to be correct? (Yes/No)
  2.  **Belief Required?** (B): Must the speaker *believe* the proposition asserted for the assertion to be correct? (Yes/No)
  3.  **Justification Required?** (J): Must the speaker be *justified* in believing the proposition for the assertion to be correct? (Yes/No)
  4.  **Knowledge Required?** (K): Must the speaker *know* the proposition asserted for the assertion to be correct? (Yes/No)
  5.  **Constitutive Norm?** (C): Is this requirement a *constitutive norm* of assertion (essential to the act itself, often triggering duties like retraction if violated later) or merely a rule of *good practice*? (Constitutive/Pragmatic)

  Your answers to the quiz items reveal your answers to these questions. The major positions correspond to specific combinations:

  *   **Knowledge Norm (KN):** T=Yes, B=Yes, J=Yes, K=**Yes**, C=Constitutive.
      *   *Verdict Pattern:* Expects impropriety in Stopped Watch (1C), Lottery (2C), Gettiered Sheep (3C), Forgetful Expert (6C), Chancy Forecast (8C), Blame for Lucky Truth (9C), and Retraction required (7B). Fine in Selfless Assertion only if true *and* believed *and* known (unlikely here, 4B/C). Moorean absurd (5C).
  *   **Simple Truth Norm (ST):** T=**Yes**, B=No, J=No, K=No, C=Constitutive.
      *   *Verdict Pattern:* Fine if true: Stopped Watch (1A), Gettiered Sheep (3A), Forgetful Expert (if true, 6A), Blame for Lucky Truth (9A/D), Inadvertent Truth-Teller (10A). False if false: Lottery (if ticket wins, 2B), Selfless Assertion (4B), Retraction (only false if wrong yesterday, 7C). No issue with disbelief (Selfless 4B, Moore 5B/C), lack of justification (Forgetful Expert 6A, Lottery 2B if false), or chance (Chancy Forecast 8A/B based on outcome). Retraction only if false yesterday (7C).
  *   **Justified Belief Norm (JB):** T=No, B=**Yes**, J=**Yes**, K=No, C=Constitutive or Pragmatic (key distinguishes).
      *   *Verdict Pattern:* Fine if believed and justified, regardless of truth: Stopped Watch (1A/C depending on justification), Gettiered Sheep (3A), Lottery (2A), Forgetful Expert (6C - lacks conscious justification), Chancy Forecast (8A/C depending on whether 70% counts as justification). False if false *and* not justified? (Less emphasis on truth). Wrong if not believed: Selfless Assertion (4B/C), Moore (5C). Blame tied to justification/intent (9C). Retraction if lacked justification yesterday, regardless of truth (7B/C). **Crucially Separated from Truth Norm by Forgetful Expert (6):** JB requires (C) Impropriety; ST allows (A) Fine if true.
  *   **Belief Norm (BN):** T=No, B=**Yes**, J=No, K=No, C=Constitutive or Pragmatic.
      *   *Verdict Pattern:* Fine if believed, regardless of truth or justification: Stopped Watch (1A), Gettiered Sheep (3A), Lottery (2A), Forgetful Expert (6A - if she believes it), Blame for Lucky Truth (9A - if believed). Wrong if not believed: Selfless Assertion (4B/C), Moore (5C). Chancy Forecast (8A/C based on belief). Retraction only if disbelieved yesterday? (7A). **Separated from JB by Lottery (2) or Chancy Forecast (8) if JB requires more justification than mere belief.**
  *   **No Constitutive Norm / Deflationary (D):** T=No, B=No, J=No, K=No, C=**Pragmatic (Only)**. Norms are purely about good practice, not correctness of the act itself.
      *   *Verdict Pattern:* Judgments driven by context, consequences, intentions, not constitutive rules. Often pragmatic "impropriety" even when true/justified (e.g., Chancy Forecast 8C, Lottery 2C, Blame for Lucky Truth 9C, Retraction 7B). Stopped Watch (1A/C), Gettiered Sheep (3A/C) – impropriety possible due to luck. Selfless Assertion (4C) – good intention makes it proper despite falsity/disbelief. Moore (5C) – pragmatic absurdity. Forgetful Expert (6A/C) – pragmatic issue only. Inadvertent Truth-Teller (10C) – pragmatic issue due to intent.

  **Unstable/Unattractive Combinations & Limitations:**

  *   **Requires Justification but Not Belief (J=Yes, B=No):** Unstable. Justification is typically *for a belief*. If no belief is required, requiring justification for it is incoherent. *(e.g., Might answer Gettier (3A) but Forgetful Expert (6C) - inconsistent on B).*
  *   **Requires Knowledge but Not Truth (K=Yes, T=No):** Unstable. Knowledge entails truth. *(e.g., Might answer Gettier (3C) but Stopped Watch (1A) - inconsistent on T).*
  *   **Truth Norm vs. Justified Belief Norm:** Distinction hinges critically on cases where a speaker asserts a *true* proposition *without* adequate justification/entitlement (Forgetful Expert - 6) and where justification exists without certainty (Lottery - 2, Chancy Forecast - 8). **Item 6 (Forgetful Expert) is the key separator:** ST allows (A), JB requires (C).
  *   **Truth Norm vs. Belief Norm:** Distinction hinges on cases of sincere false assertion (Selfless Assertion - 4, Blame for Lucky Truth - 9) and insincere true assertion (Inadvertent Truth-Teller - 10). ST requires truth (4B, 10A), BN requires belief (4B/C, 10A/C).
  *   **Knowledge Norm vs. Justified Belief Norm:** Distinction hinges on Gettier cases (3) and cases of justified true belief without knowledge (Forgetful Expert - 6, if she had justification). KN requires impropriety (3C, 6C), JB allows propriety if justified (3A, 6A/C depending on justification access).
  *   **Instrument Limitation - Blame Focus:** Item 9 (Blame for Lucky Truth) is crucial for separating norms indifferent to speaker state (ST: 9A/D) from those sensitive to it (KN, JB, BN, D: 9C). It also helps distinguish constitutive norms (KN, JB, BN, ST) from purely pragmatic ones (D) regarding the *source* of blame.
  *   **Instrument Limitation - Retraction:** Item 7 (Retraction Challenge) primarily distinguishes norms that are constitutive (KN, JB: 7B) from those that are not (D: 7B based on pragmatics) or are purely truth-based (ST: 7C only if false yesterday). BN is less clear on retraction.

  \answer{Knowledge Norm; Simple Truth Norm; Justified Belief Norm; Belief Norm; Deflationary}
