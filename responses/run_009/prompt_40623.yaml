prompt: |-
  I'm a retired biochemist (protein sequencing mostly, a stint in pharma at the end) and lately I've been reading philosophy for fun and getting into arguements on the internet, which was a mistake. Anyway, here's a pattern I keep hitting and I want to know if it has a name.

  The fight I keep having is about whether DNA is a "code". One side says: obviously, the codon table is a code in exactly the sense a cryptographer would use, an arbitrary mapping from one alphabet onto another, and the fact that people literally talk about "cracking" the genetic code (Nirenberg and all that) shows the word was doing that job all along. The other side says: no, a code is something somebody devises, symbols that are about something, minds required — and calling DNA a code smuggles in a coder. That second camp is usually making a creationism-adjacent move, the "codes come from coders" thing, though I've also seen atheists do it in reverse to bait people.

  Here's what I've noticed. Neither side ever switches meanings mid-argument. Each is completely consistent. So it's not equivocation, at least not the textbook kind, because textbook equivocation is one person sliding between two senses. What I'm seeing is two people, each locked onto a different but equally old and legitimate sense of the same word, and the whole disagreement is over which sense the word should be carrying. And it matters! The word is load-bearing: "codes require coders" is true on one sense and false on the other, so whoever wins the word wins the argument without doing any further work. I've seen the same shape in fights about whether the universe came "from nothing", where the two sides mean different things by nothing (no matter vs. no matter AND no laws AND no quantum fields), and people wave it off with "oh, that's just semantics" — but in these fights the semantics IS the argument, which seems like the opposite of an idle dispute.

  So: is there an established concept for a dispute where two parties hold fixed two seperate senses of one word, each is internally consistent, and the fight is over which sense gets the word — with the twist that the fight isn't idle, because settling the word settles the downstream conclusion? I know about equivocation and it's not quite that. A friend mentioned philosophers have a notion of "merely verbal disputes", but that always sounds dismissive, like the dispute dissolves and nobody was really disagreeing, and my case is the reverse: the parties only stop disagreeing once you force a sense on the word, and which sense you force decides who was right. If there's no exact term, coin one and give me the edges — e.g., how what I'm describing differs from a persuasive definition (I gather that's when someone redefines a word to win, but in my pattern nobody is redefining anything; both senses are standard issue).

  For format, please structure your answer in these sections, in this order:

  1. "Nearest existing concepts" — a short list (~100 words) of the closest things philosophy already has names for.
  2. "Fit and misfit" — roughly 200 words on how my pattern matches each of those and where it pulls away from each.
  3. "The carve" — if nothing fits exactly, give this thing a name and a definition, with boundary cases (~150 words).
  4. "Back to DNA" — about 150 words applying your carving to my actual argument: on which senses of "code" and "information" is DNA a code or information, is either sense the "real" one, and does "codes come from coders" survive once the senses are pulled apart.
reasoning: |-
  Alright, let's tackle this. The user is a retired biochemist who's run into philosophical arguments about whether DNA is a "code." They've noticed that both sides use the word "code" consistently but with different meanings—one as an arbitrary mapping, the other as something requiring a mind. The dispute isn't about equivocation since both parties stick to their definitions. The user wants to know if there's a term for this kind of disagreement where the conflict hinges on which definition of a word is used, and settling that determines the outcome.

  First, I need to recall relevant philosophical concepts. The obvious ones are equivocation, where one person shifts meanings, but that doesn't fit because here both sides are consistent. Then there's merely verbal disputes, where disagreements dissolve when definitions are clarified. But in this case, after clarification, the disagreement remains because each definition leads to different conclusions. Persuasive definitions involve redefining terms to win arguments, but here both sides aren't redefining; they're using established meanings. Conceptual ethics deals with which concepts we should use, which is closer but more meta. Semantic externalism might not apply directly.

  The user mentions that in the DNA argument, one sense of "code" implies a coder, while the other doesn't. This isn't just semantics because the choice of definition affects whether "codes require coders" is true. So, it's a substantive disagreement masked as a definitional one. The existing terms don't capture this exactly. Merely verbal disputes suggest the conflict is trivial, but here it's crucial. Persuasive definitions involve redefinition, but here both meanings are standard. 

  So, a new term might be needed. "Definitionally Loaded Dispute" makes sense because the outcome hinges on which definition is chosen, and each definition carries different implications. The boundaries would include cases where definitions lead to different truths, unlike merely verbal disputes where agreement follows clarification. 

  Applying this to DNA: in the descriptive sense, DNA is a code as an arbitrary mapping. In the intentional sense, it requires a coder. Neither sense is more "real"; context decides. "Codes require coders" is true only in the intentional sense, so separating the definitions clarifies that the argument rests on which sense is applied, not on empirical evidence.
answer: |-
  Here's the structured analysis of your philosophical pattern:

  **1. Nearest Existing Concepts**  
  - **Merely Verbal Disputes**: Conflicts resolvable by clarifying definitions (e.g., "Is Pluto a planet?" resolves by defining "planet").  
  - **Persuasive Definitions**: Redefining terms to sway arguments (e.g., defining "justice" to favor a political stance).  
  - **Equivocation**: Illicitly shifting a term's meaning mid-argument (e.g., "banks" as rivers vs. financial institutions).  
  - **Conceptual Ethics**: Debating *which concept* a word *should* denote (e.g., whether "freedom" prioritizes liberty or security).  
  - **Semantic Externalism**: Meaning fixed by external factors (e.g., "water" means H₂O regardless of speakers' beliefs).

  **2. Fit and Misfit**  
  - **Merely Verbal Dispute**: **Fits** in being definition-driven. **Misfits** because your case doesn't dissolve when meanings are clarified; it *reveals* a substantive conflict (e.g., "Does DNA's 'code' imply a coder?" remains contested).  
  - **Persuasive Definition**: **Fits** as both sides aim to control the term's implications. **Misfits** because neither redefines the word; both appeal to established senses ("code" as cipher vs. intentional symbols).  
  - **Equivocation**: **Fits** in involving multiple meanings. **Misfits** as both parties *fix* their definitions rigidly; no sleight-of-hand.  
  - **Conceptual Ethics**: **Fits** perfectly in debating *which concept deserves the word*. **Misfits** slightly as this field focuses on normative choice, not the dispute structure itself.  
  - **Semantic Externalism**: **Fits** in recognizing meanings transcend personal usage. **Misfits** as your dispute centers on *competing* external references (e.g., cryptographers' vs. philosophers' "code").

  **3. The Carve**  
  **Term**: **Definitionally Loaded Dispute (DLD)**  
  **Definition**: A disagreement where:  
  1. Parties fixate on distinct, established senses of a pivotal term (S1 and S2).  
  2. Both senses are linguistically legitimate and consistently maintained.  
  3. The dispute *appears* substantive but reduces to which sense (S1 or S2) should govern the term.  
  4. Choosing S1 or S2 mechanically settles a downstream claim (C), making C true under one sense and false under the other.  
  **Boundaries**:  
  - *Not DLD*: If senses are ad hoc (e.g., redefining "code" mid-debate → persuasive definition).  
  - *DLD Adjacent*: If clarifying meanings resolves conflict → merely verbal dispute.  
  - *Core DLD*: When choosing a sense *is* the argument’s crux (e.g., S1="code as cipher" vs. S2="code as intentional symbol" dictates if "codes require coders").

  **4. Back to DNA**  
  - **DNA as "code" (Descriptive Sense)**: Valid per cryptography: codons are arbitrary mappings (e.g., UUU → phenylalanine), deciphered via experiment. No coder implied; it's a pattern.  
  - **DNA as "code" (Intentional Sense)**: Invalid without evidence of teleology; implies symbols "about" something, requiring interpretation (e.g., DNA as a "blueprint" metaphorically).  
  - **"Real" Sense?**: Neither. Context rules: Biochemical practice uses descriptive sense; philosophy of mind may require intentionality.  
  - **"Codes require coders"**: Only tautologically true in the intentional sense. In the descriptive sense, codes arise from natural processes (e.g., evolution "assigns" codons via selection). The DLD *exposes* this: Creationists fix the intentional sense to force a coder; scientists use descriptive sense to block that inference. Resolving the dispute requires agreeing on the operative sense *before* assessing the claim — or conceding that "code" is polysemous and context-dependent.
