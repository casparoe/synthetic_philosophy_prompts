  - **Stage 5: The Grand Mugging (5 min)**:
    - The facilitator presents an offer: "Give me 10 points (a significant portion of what they might have) and I will give you a 1 in 10^40 chance of 10^40 points." (Or adjust to make EV=1? Or greater? Let's do EV=10: so if the cost is 10 points, then we want 10 = (1/10^40) * X => X = 10^41 * 10 = 10^42? But then we can set: cost=10 points, probability=1/10^40, payoff=10^42 points -> EV=10^42 / 10^40 = 100, which is 10 times the cost? So positive EV.)

      But note: we are trying to get fanaticism. We want them to see that by expected value, they should pay even though the probability is tiny and the cost is real.

    - They individually decide whether to pay 10 points for this offer.

    - We then reveal that we cannot actually deliver 10^42 points, but we are considering the decision in principle.

  ### Debrief (30 min)
  - **Map the stages to the philosophical issue**:
    - Stage 1: Basic preference for more over less.
    - Stage 2: Introduction of expected value in gambles with known probabilities. They accept that EV is a good guide when probabilities are known and stakes are moderate.
    - Stage 3: They extend EV to gambles with very small known probabilities and large payoffs (as long as EV is favorable). This is the beginning of fanaticism: they are willing to take arbitrarily small chances for large payoffs if the EV is positive.
    - Stage 4: The shift to subjective probabilities. They now face a situation where the probability is not known but assigned by credence. They might still take the gamble if their credence, however small, leads to a positive EV. But note: the cost is real and the reward is hypothetical (and we can't pay). This highlights the difference between objective and subjective tiny probabilities. Also, it introduces the idea that even a tiny credence in an astronomical payoff can dominate.
