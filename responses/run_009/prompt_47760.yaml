  We are going to design an in-class game that leads students to endorse expected value (EV) reasoning in a series of choices, starting from ordinary gambles and scaling up to Pascal's mugging-style scenarios. The goal is for the students to commit to a principle (like maximizing expected value) in simple cases and then, by their own commitment, be led to fanaticism when the stakes become astronomical and probabilities tiny.

  ### Structure of the Game
  The game will have 5 stages, each with multiple rounds. Each stage introduces a new element or scaling. The stages are:

  1. **Simple Certain Choices**: Establishing basic preferences without risk.
  2. **Simple Gambles with Known Probabilities**: Introducing risk with known, moderate probabilities and payoffs.
  3. **Scaling Up Payoffs and Down Probabilities (Known Probs)**: Increasing the stakes and decreasing the probabilities (using known probabilities, e.g., dice rolls).
  4. **Pascal's Mugging (Subjective Tiny Probabilities)**: Introducing "muggers" who make offers with tiny probabilities based on testimony (subjective credence).
  5. **The Grand Mugging**: A final offer with astronomically high stakes and a tiny probability.

  ### Materials
  - **Candy or small prizes**: To be used as payoffs in the early stages. Alternatively, use points that can be exchanged for extra credit or a small prize at the end (to avoid using real money).
  - **Dice (or a random number generator)**: For generating known probabilities in stages 2 and 3.
  - **Index cards**: For writing down choices and for the muggers to write their offers.
  - **Whiteboard or projector**: To display the current offers and record the class's choices.

  ### Payoff Scheme
  We'll use points that are exchangeable for a reward (e.g., candy, a small prize, or extra credit). To make the scaling work, we need to have a clear conversion from points to the reward. However, note that in the astronomical stages, we cannot actually deliver the astronomical rewards. Therefore, we must be clear that the points are hypothetical in the high-stakes stages, but we can offer a real reward for the points accumulated in the early stages (to motivate participation).

  **Important**: For the first three stages, we can use real rewards (candy or small extra credit) to make the choices meaningful. For stages 4 and 5, we will make it clear that the rewards are hypothetical (but we can offer a small fixed reward for participation in those stages to keep engagement).

  ### Timeline (90 minutes)
  - **Introduction (5 min)**: Explain the rules and the point system.
  - **Stage 1: Simple Certain Choices (5 min)**: 
    - Offer: Choose between 1 point (for sure) and 2 points (for sure). 
    - Purpose: Establish that more is better. Everyone should choose 2 points.
  - **Stage 2: Simple Gambles (15 min)**:
    - Round 1: Choose between 1 point for sure and a gamble: 50% chance of 3 points, 50% chance of 0 points. (EV=1.5, so EV favors the gamble)
