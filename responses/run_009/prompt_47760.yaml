answer: |-
  ### In-Class Game: The Escalating Gamble  
  **Objective:** Guide students to endorse expected value (EV) maximization step-by-step, leading them to fanaticism via their own choices. The game progresses from mundane gambles to Pascal’s Mugging, forcing confrontation with EV’s implications.  

  ---

  ### **Rules & Setup**  
  - **Students:** 14, seated in a circle for discussion.  
  - **Materials:**  
    - Dice (d6, d10), coin, random number generator (RNG) app for probabilities.  
    - "Mugger Cards" (index cards) for Stage 4.  
    - Payoff: **Points** (tracked publicly on a whiteboard) redeemable for small prizes (e.g., candy, extra credit). **Stage 1–3 use real points; Stage 4–5 use hypothetical points** (explained later).  
  - **Key Mechanics:**  
    - **Voting:** Students vote on choices at each stage. Majority wins, binding the group.  
    - **EV Principle:** After Stage 2, formalize the "EV Rule": *When choosing, pick the option with the highest expected value.*  

  ---

  ### **Game Stages & Timeline**  
  *(Total: 90 minutes)*  

  #### **Stage 1: Simple Certainty (5 min)**  
  - **Goal:** Establish baseline preference for "more is better."  
  - **Choice:**  
    - Option A: 1 point (certain).  
    - Option B: 2 points (certain).  
  - **Outcome:** Students choose B. **Principle endorsed:** *Dominance (more > less).*  

  #### **Stage 2: Mundane Gambles (15 min)**  
  - **Goal:** Introduce EV with intuitive gambles.  
  - **Rounds:**  
    1. **Coin Flip:**  
       - A: 1 point (certain).  
       - B: 50% chance of 3 points, 50% of 0. *EV = 1.5*.  
       - *Students choose B (EV > certainty).*  
    2. **Dice Roll:**  
       - A: 1 point (certain).  
       - B: 10% chance (d10 roll) of 11 points, 90% of 0. *EV = 1.1*.  
       - *Students choose B (small risk for EV gain).*  
  - **Facilitator:** Formalize the "EV Rule" after Round 2.  

  #### **Stage 3: Scaled-Down Probabilities, Scaled-Up Payoffs (20 min)**  
  - **Goal:** Extend EV to tiny **objective probabilities**.  
  - **Rounds:**  
    1. **Low Probability, Moderate Payoff:**  
       - A: 1 point (certain).  
       - B: 1% chance (RNG 1–100) of 200 points. *EV = 2*.  
       - *Students choose B (EV still higher).*  
    2. **Microscopic Probability, Huge Payoff:**  
       - A: 1 point (certain).  
       - B: 0.001% chance (RNG 1–1,000,000) of 1,000,000 points. *EV = 1*.  
       - *Trap:* EV is equal, but students may still pick B (risk-seeking) or flip a coin. Highlight: "EV Rule forces indifference? But earlier choices suggest scaling doesn’t break EV."  
    3. **Extreme Scaling (Reinforce Fanaticism):**  
       - A: 1 point (certain).  
       - B: 1 in 10 billion chance of 10 billion points. *EV = 1*.  
       - *Students debate; EV Rule forces indifference, but many pick B, anticipating Stage 4.*  

  #### **Stage 4: Pascal’s Muggers (25 min)**  
  - **Goal:** Introduce **subjective credence** vs. objective probability.  
  - **Setup:**  
    - Assign 3 volunteers as "muggers." Give each a "Mugger Card" to invent an offer:  
      *"Pay me **X points**, and I’ll give you a **1 in [huge number]** chance of **[astronomical prize]**."*  
      - Example: *"Pay 1 point for a 1 in 10^20 chance of 10^20 points."*  
    - Muggers present offers dramatically ("I have a quantum box!" "God told me!").  
  - **Group Choice:**  
    - Students vote on accepting **one** mugger’s offer (if any). Costs **real points** (from Stages 1–3).  
    - **Key Twist:** Prizes are hypothetical ("imagined points"), but the cost is real.  
  - **Predicted Outcome:**  
    - Students reject offers despite positive EV (e.g., 1 in 10^20 chance of 10^20 points → EV = 1 point, but cost = 1 point).  
    - **Why?** Subjective credence in mugger’s story is near-zero, not the stated probability. EV fails when probability is not objective.  

  #### **Stage 5: The Grand Mugging (5 min)**  
  - **Goal:** Force fanaticism via EV consistency.  
  - **Offer:**  
    - A: Keep 10 points (real).  
    - B: Pay 10 points (real) for a **1 in 10^40 objective chance** (RNG) of **10^40 hypothetical points**. *EV ≈ 1*.  
  - **Trap:** EV Rule demands indifference, but students face real loss for near-impossible gain. Most reject.  
  - **Facilitator:** "You broke the EV Rule. Why?"  

  ---

  ### **Debrief (20 min)**  
  Map the game to philosophy:  

  | **Game Stage** | **Philosophical Issue** | **Escape Routes** | **Cost of Escape** |
  |----------------|-------------------------|-------------------|---------------------|
  | Stage 1–2      | EV as intuitive for mundane choices | None | — |
  | Stage 3        | EV with tiny **objective** probabilities | **1. Reject commensurability:** Ignore probabilities below threshold (e.g., 1 in 10^9). | Loses rational grounding; arbitrary thresholds. |
  | Stage 4        | EV with **subjective credence** (muggers) | **2. Bounded utility:** Cap utility (e.g., max 10^9 points). | Cannot handle true existential stakes (e.g., asteroid prevention). |
  | Stage 5        | EV fanaticism bites | **3. Drop aggregation:** Deny EV linearity (e.g., risk-weighting). | Abandons standard decision theory; may violate Dutch books. <br> **4. Bite the bullet:** Accept mugging. | Pays for near-impossibilities. |

  **Honest Limitations:**  
  - **"Nonsense" intuition never tested:** Real-world muggers can’t deliver 10^40 utils. Students intuitively dismiss hypotheticals. Facilitator must stress: *"This is about principle. Would you pay if the mugger could deliver?"*  
  - **Credence vs. probability:** Stage 4 exposed that testimony isn’t probability—students *felt* this without lecture.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Stage 4 muggers flop:**  
     - *Risk:* Students assign 0% credence, rejecting all offers.  
     - *Fix:* Prep muggers to sell stories ("I swear on my life!"), or pre-seed offers (e.g., "I’ll donate $1,000 to charity if true").  

  2. **Time crunch in Stage 3:**  
     - *Risk:* Complex RNG slows gameplay.  
     - *Fix:* Use app-based RNG; skip physical dice for tiny probs (describe outcomes).  

  3. **EV Rule rejected early:**  
     - *Risk:* In Stage 2, risk-averse students pick certainty.  
     - *Fix:** Note dissent but side with majority. Ask: "If B had 100% of 1.1 points, would you choose it?" to reinforce EV.  

  4. **Hypothetical points disengage:**  
     - *Risk:* Students shrug off Stages 4–5.  
     - *Fix:** Stage 4 costs **real points**; Stage 5’s cost is real (10 points = significant candy/credit loss).  

  **Facilitator Script for Final Trap:**  
  *"Stage 5’s chance is objective—like a cosmic lottery. The EV Rule says: ‘Be indifferent.’ But you said no. You’ve arrived at fanaticism’s limit. How do you escape? And what does it cost?"*  

  This game mirrors Arntzenius’s "Pascal’s Mugging" and Bostrom’s "Big World" dilemmas. Students build the reductio themselves—your role is to let them wrestle, then dissect the wreckage.
