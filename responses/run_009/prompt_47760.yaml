    - **Compromise**: We do not actually pay the huge rewards. We are honest: we cannot pay them. But we ask the students to make the decision as if they would receive the reward if the mugger is telling the truth. We then record their choices. Then, we reveal that none of the muggers were telling the truth (or we can have one mugger that we pre-arranged to be "truthful" with a small real probability? Not necessary). The point is to see if they are willing to pay 1 point for a tiny chance of a huge reward based on testimony.

