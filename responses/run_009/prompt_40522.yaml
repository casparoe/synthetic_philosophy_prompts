prompt: |-
  Me and my friend argue about this constantly: which everyday conventions are actually moral obligations, and not just things it's weird not to do. She has a pretty stable track record, so here are her verdicts so far. Regulars at a diner who never tip even though they know the waitstaff depend on tips: wrong. Cutting a line because you're in a hurry: wrong. Jaywalking across a totally empty street at 5am: not wrong, even though it's technically illegal. A tourist in Japan wearing shoes indoors after being told: wrong. A tourist who hagggles aggressively in a country where prices are fixed and everyone knows it: wrong, even though no one is really harmed. A visitor who skips the small greeting ritual when entering a shop in a small French town: not wrong.

  Now the case we fought about for an hour and never resolved: a German exchange student, three weeks into a semester in the US, who stiffs a server at a mid-range restaurant, knowing full well that tips are how servers get paid, but reasoning (not totally crazy) that he never opted into the American tipping system and at home it would be almost strange to tip.

  Predict what my friend will say about him, and say which rule she's actually running -- the options I can see are "conventions that create real reliance and harm generate obligations, for anyone who knowingly participates in the situation" versus "you're only bound by conventions of a community you're a member of or knowingly benefit from, and tourists get some slack," but there might be better ones. Give me your best guess with reasons, and tell me what further case would best split the candidate rules apart, since I want to win next time this comes up. Lead with your bottom line in the first sentence, then the reasoning -- no preamble and dont restate my whole question back at me.
reasoning: |-
  Okay, let me approach this systematically. The user wants to predict their friend's judgment about the German exchange student who doesn't tip in the US, and identify the underlying moral rule being applied. 

  Looking at the friend's consistent pattern across previous cases: she distinguishes between conventions that cause real harm versus those that are merely formal or harmless violations. Key examples show:
  - Not tipping regulars: wrong (harms workers who rely on tips)
  - Skipping French greetings: not wrong (no clear harm)
  - Japanese shoes: wrong (violates clear cultural rule with potential offense)
  - Aggressive haggling: wrong (exploits system despite no direct harm)

  The exchange student case has two key elements: 
  1) Harm potential - servers lose expected wages
  2) Membership status - student is temporary, not fully integrated

  The friend's pattern suggests harm trumps temporary status. Her Japanese shoes verdict shows she holds even short-term visitors accountable for local norms that prevent offense or harm. The French greeting case was harmless, hence excused, but tipping directly impacts livelihoods.

  The deeper principle seems to be: "Conventions generate obligations when violation creates material harm or relational harm, regardless of community membership if participation is voluntary." 

  To test this against alternative rules:
  - Create a case with high membership but low harm (e.g., longtime resident skipping harmless ritual)
  - Versus low membership but high harm (e.g., tourist refusing malaria medication in endemic area, enabling disease spread)

  This would force distinguishing between harm and membership factors.
answer: |-
  **Your friend will say the German student is wrong.** Her underlying rule: **Conventions create moral obligations when violating them knowingly causes real, material harm to individuals who reasonably rely on them, regardless of formal community membership if you voluntarily participate in the system.**

  **Reasons based on her pattern:**
  1.  **Harm/Reliance is her core driver:** She condemns not tipping by regulars (harms server's income) and aggressive haggling (harms seller's expected income/fairness), even calling the latter wrong despite "no one really harmed" – implying *unfairness* or *undermining reliance* is the harm. She excuses jaywalking (no harm) and skipping French greetings (likely seen as harmless ritual).
  2.  **Community Membership is secondary:** She condemns the tourist wearing shoes in Japan – a clear violation of a strong local norm preventing offense/hygiene *harm*, even as a non-member. The student, by dining in a US restaurant, voluntarily participates in a system where servers *rely* on tips for wages. His 3-week stay means he *knows* the system and the harm caused by stiffing.
  3.  **His reasoning fails:** "Not opting in" ignores that by using the service in the context, he *is* participating and benefiting from the underpriced meal subsidized by the *expectation* of tips. "It's strange at home" is irrelevant under her harm principle.

  **Best splitting case to win next time:**
  **Scenario: A lifelong resident of a remote Scottish island, where everyone greets every neighbor with a specific, time-consuming blessing ritual each morning, deliberately skips the ritual for their next-door neighbor one day because they're late. No one else sees, the neighbor isn't offended (just surprised), and no tangible harm occurs.**

  *   **Under YOUR proposed rule ("bound by conventions of community you're a member of"):** This should be *wrong*. They are a core community member violating a deep-seated local convention.
  *   **Under YOUR FRIEND'S likely rule ("harm/reliance triggers obligation"):** This should be *not wrong*. While a strong convention, the violation causes no material harm, unfairness, or broken reliance (the neighbor wasn't relying on it for income/survival). It's closer to skipping the French shop greeting.

  If your friend says skipping the Scottish ritual *is* wrong, she prioritizes community membership/habitual practice over harm. If she says it's *not* wrong, it confirms harm/reliance is her primary trigger, weakening her stance on the German student (where harm *is* present). Use this case to force the distinction.
