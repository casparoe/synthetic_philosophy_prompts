prompt: |-
  ok so last night me and my friend daniel had a huge fight about population ethics that went til like 2am and ended totally unresolved, so now im bringing it to you. the fight: whether it could ever be better to have a huge number of people each with lives barely worth living than a smaller number of people with really great lives (the repugnant conclusion thing). he says obviously yes if the total wellbeing is higher, i say that sounds insane but i couldnt actually say why without it coming out like im just being a snob about quality of life.

  so instead of another round of "no you", heres what i want: the actual spec. write me the list of things any view about comparing alternative populations (ranked by wellbeing, keep the rest out for now) has to get right before i should take it seriously -- which cases it must deliver the right verdict on, which arguments it must not make a mess of, which distinctions it has to respect. for each requirement give me the case or consideration behind it, and be honest about which ones are genuinely non-negotiable and which are just things total utilitarians like daniel happen to care about.

  a few specific things i want in there bc they came up:

  - the mere addition argument: which exact premise do you have to deny to dodge the repugnant conclusion, and what does denying it cost you (telling me that adding a happy person, changing nothing else, doesnt make things better is a weird price to pay)
  - the mirror-image case: views where adding a smaller number of lives of terrible suffering comes out better than adding a vastly larger number of slightly-happy lives. daniel admitted this one made him sweat, and honestly it seems way worse than the repugnant conclusion
  - whether a population axiology can even care about equality without going off the rails somewhere else -- like does adding a strict egalitarian constraint create its own absurd cases, and if so what's the tradeoff
  - whether just refusing to rank certain population pairs (giving up on comparing them at all) is a legit move or a cop-out that just hides the problem

  and the part i actually care about most: tell me which pairs of requirements cant be jointly satisfied, if any. i have a vague memory that someone proved a no-go result saying you cant get everything on the list at once, so if the whole thing is jointly unsatisfiable, say that plainly, then tell me which single requirement YOU would drop first and why (and what the view looks like once its dropped).

  dont give me names of papers or who proved what, i just want the structure of the problem laid out so i can go back to daniel with an actual position instead of a vibe. and yes i realize asking you to settle a 2am argument is exactly the kind of thing this fight was about, dont start.
