answer: |-
  ## Joint Statement on Simpson's Reversal: Findings of the Adversarial Collaboration

  **Preamble:** We, representatives of the causal resolutionist and statistical formalist perspectives, present the outcomes of our collaborative deliberation on Simpson's reversal using the provided drug trial scenarios. Our goal was rigorous mutual understanding, identifying genuine agreements, clarifying disagreements, and specifying testable cruxes. We acknowledge past tendencies to characterise each other unfairly: causal resolutionists sometimes portrayed formalists as ignoring contextual meaning, while formalists sometimes reduced causal language to mere jargon. We found significant common ground in practical reasoning, even where foundational interpretations diverge.

  ### 1. Agreed Claims
      1.  **Arithmetic Fact:** The reversal phenomenon – where the association between treatment (drug) and outcome (recovery) reverses direction upon aggregation/disaggregation by a third variable (sex or blood pressure) – is an uncontroversial mathematical consequence of the given contingency tables in both scenarios. It arises from the differing group sizes and conditional recovery rates.
      2.  **Paradox Status:** Simpson's reversal is a "paradox" only in the sense of being counter-intuitive when naively interpreting observed associations as causal effects. It demonstrates no logical inconsistency within probability theory itself.
      3.  **Insufficiency of Raw Association:** The aggregated association (drug appears harmful) is demonstrably misleading for decision-making in both scenarios. Neither camp considers the marginal association sufficient evidence for the drug's causal effect.
      4.  **Resolution in Scenario 1 (Sex):** For a new patient where sex is known, the correct decision-relevant quantity is the sex-specific recovery rate difference (Drug better: Women: 90% vs 80%, Men: 70% vs 20%). Both camps agree the drug should be recommended for both men and women. Conditioning on sex is necessary and sufficient for sound decision-making here.
      5.  **Resolution in Scenario 2 (Blood Pressure):** For a new patient, conditioning on the *observed* blood pressure reading (taken post-treatment) is inappropriate for predicting the effect *of taking the drug*. Both camps agree the aggregated association is misleading, but also reject directly using the blood-pressure-stratified rates for causal inference about the drug. Both camps recognise that blood pressure here acts as a potential collider or mediator influenced *by* treatment, making its stratification invalid for estimating the drug's total effect. Neither camp endorses the marginal or stratified associations as estimating the causal effect of the drug in this scenario. The "right decision" for a new patient *cannot be determined solely from this dataset* without further assumptions; both camps require additional structure (causal or exchangeability-based).
      6.  **Need for External Assumptions:** Both camps explicitly agree that resolving the paradox and determining the correct causal or predictive inference requires assumptions beyond the observed associations in the data table alone. The data alone are insufficient.
      7.  **Practical Equivalence (Scenario 1):** In the sex scenario, the methods advocated by both camps lead to the identical practical conclusion: recommend the drug for both men and women. Neither camp claims the other's *final recommendation* is wrong in this instance.

  ### 2. Disagreements Table
  | Disagreement Focus          | Causal Resolutionist Position (as accepted by them)                                                                                                                                 | Statistical Formalist Position (as accepted by them)                                                                                                                                                                                               | What Turns On It                                                                                                                               |
  | :-------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Nature of Required Assumptions** | The assumptions necessary to resolve the paradox and identify valid causal effects are inherently *causal*. They concern the data-generating mechanism (e.g., direction of influence, absence of confounding, no selection bias). Probability calculus applied to data under exchangeability is insufficient without embedding it within a causal framework specifying potential outcomes, interventions, or graphical structures. | The assumptions necessary for sound prediction and decision (resolving the paradox) are assumptions about *exchangeability* or *ignorability* conditional on covariates. These are probabilistic statements about the symmetry of new units relative to observed groups under the sampling/reasoning model. Framing them as "causal" adds no necessary substantive content beyond this symmetry. | Whether causal concepts (intervention, counterfactuals) are indispensable for defining and identifying the target quantity (e.g., average causal effect), or whether they can be fully reduced to symmetry assumptions under a predictive model. |
  | **Interpretation of Stratification in Scenario 2** | Conditioning on blood pressure (a post-treatment variable influenced by the drug) in Scenario 2 *creates* spurious associations (collider bias) due to the underlying causal structure. The apparent reversal here is fundamentally different from Scenario 1; it's not just statistical but reflects a causal misstep. Recognising this *requires* causal knowledge. | Conditioning on blood pressure in Scenario 2 violates the conditions for valid inference because patients with the same observed blood pressure under drug vs control are not *exchangeable* groups with respect to recovery *under the intervention of interest*. The invalidity stems from the asymmetry in the data-generating process breaking exchangeability, describable without causal metaphysics. | Whether the invalidity of conditioning on post-treatment variables is best explained and diagnosed using causal concepts (colliders, paths) or purely through violations of probabilistic exchangeability under the intervention model. |
  | **Role of Randomisation**   | Randomisation (if properly executed) *establishes* the causal interpretation by physically enforcing exchangeability *on average* across potential treatment groups before treatment. It licenses causal inference by breaking confounding paths. | Randomisation *is* a symmetry (exchangeability) assumption about the assignment mechanism. It justifies conditional probabilities as estimates of causal effects *because* it makes the treatment groups probabilistically identical in all relevant aspects pre-treatment. The justification is the symmetry, not an independent causal ontology. | Whether randomisation provides a warrant for causal claims *because* it instantiates a causal notion (no confounding) or *because* it instantiates a strong probabilistic symmetry (exchangeability). |

  ### 3. Cruxes: Key Testable Differences
  We identify the following specific questions, where settling them would meaningfully shift at least one camp's position. For each, we specify an agreed test/argument/case and each camp's prediction.

  1.  **Crux: Does Exchangeability Imply Causality?**
      *   **Test Case:** Consider a hypothetical pre-treatment variable `Z` (e.g., genetic marker) that predicts both the *propensity* to choose the drug *and* recovery, but where `Z` itself *has no causal effect* on recovery. Assume the true causal effect of the drug is null. Due to the confounding by `Z`, aggregated data may show an association. However, conditioning on `Z` yields valid conditional associations (zero difference). Are groups defined by `Z` and treatment assignment exchangeable for recovery? Does conditioning on `Z` yield the correct *causal* effect estimate?
      *   **Formalist Prediction:** Yes. Conditional exchangeability given `Z` holds (by construction). Therefore, the conditional association *is* the valid estimate for the causal effect for a new patient with known `Z`. The formalist method correctly identifies the null effect without needing causal labels for `Z`.
      *   **Resolutionist Prediction:** Yes, *but* crucially, recognising that `Z` is a confounder (a *causal* role) is necessary to understand *why* conditioning works and to ensure `Z` wasn't selected post-hoc or is a collider. Exchangeability holds here *because* `Z` blocks the confounding path – a causal concept. The formalist description is accurate but incomplete; the causal structure explains *when* exchangeability suffices.
      *   **What it Bears On:** Whether causal structure is merely a helpful narrative for when exchangeability holds, or whether it constitutes an essential layer of understanding necessary for robust inference (e.g., generalising to new settings, selecting covariates).

  2.  **Crux: The Necessity of Causal Language for Post-Treatment Conditioning (Scenario 2)**
      *   **Test Case:** Analyse Scenario 2 using *only* the language of conditional probability and exchangeability, without using causal terms like "effect", "cause", "collider", or "mediator". Can the invalidity of conditioning on blood pressure for estimating the effect of *taking the drug* be fully and unambiguously explained?
      *   **Formalist Prediction:** Yes. It can be explained as: The blood pressure groups (Normal/High) under Drug and Control are not exchangeable groups with respect to recovery. Patients who achieve Normal BP via the drug may differ systematically in unobserved ways from those who are Normal without the drug, breaking symmetry. The target of prediction (effect of *taking the drug*) requires comparing outcomes under intervention `Drug=1` vs `Drug=0` for *comparable* individuals. Conditioning on BP creates incomparable groups for this specific predictive contrast.
      *   **Resolutionist Prediction:** No, not unambiguously or completely. While the lack of exchangeability can be stated, the explanation lacks the diagnostic power and clarity of causal concepts. Without "collider bias" or "mediator", one cannot easily articulate *why* the groups are incomparable (the drug causes BP changes which affect outcome, and conditioning blocks/creates paths) or distinguish this scenario from others (e.g., pure confounding). The formalist description risks being vague or circular ("they lack exchangeability because they aren't comparable").
      *   **What it Bears On:** Whether causal models provide essential explanatory power and diagnostic clarity beyond stating that exchangeability fails for a given task.

  3.  **Crux: Verbal Disagreement on "Causal"?**
      *   **Test Argument:** Is the statement "Randomised controlled trials (RCTs) allow us to estimate causal effects" best understood as:
          *   (A) Asserting that RCTs create a physical scenario where the difference in observed outcomes *is* the average causal effect (a claim about the world).
          *   (B) Defining the term "causal effect" operationally as the quantity estimable from a well-conducted RCT under an exchangeability assumption.
      *   **Resolutionist Lean:** Primarily (A), with (B) as a consequence. The causal effect exists independently; RCTs measure it by breaking confounding.
      *   **Formalist Lean:** Primarily (B). The causal effect *is defined by* what RCTs estimate under exchangeability. (A) adds an unnecessary metaphysical layer.
      *   **What it Bears On:** Whether the core disagreement is partly verbal, hinging on whether "causal" refers to a distinct ontological category or is a label for inferences licensed under specific (exchangeability) conditions. Both agree RCTs work; they disagree on the *meaning* of "causal" in the justification.

  **Conclusion:** Our collaboration confirms that both approaches converge on identical practical decisions in the straightforward confounding scenario (Sex). Significant disagreement remains regarding the conceptual necessity of causal assumptions versus probabilistic symmetry (exchangeability), particularly evident in more complex scenarios like the blood pressure mediator/collider. These disagreements centre on the interpretation of foundational concepts (causality, exchangeability) and the language best suited for diagnosing pitfalls and guiding inference, rather than on the mathematical validity of the reversal or the ultimate decision in Scenario 1. The identified cruxes provide a roadmap for future focused debate and investigation. We affirm the value of both perspectives in illuminating different facets of this profound statistical phenomenon.
