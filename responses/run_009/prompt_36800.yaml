prompt: |-
  You'll probably be able to tell I'm a philosophy professor and not an anthropologist, so bear with me. I'm teaching a seminar this term on ritual and obligation, which means I've been reading a bunch of anthropology and cultural-evolution stuff on the side, and I keep running into a pattern I can't find a name for. Help me figure out whether the cultural evolution people have a term for it, or whether it needs a new one.

  The pattern: a cultural practice survives and gets passed on *because* it's costly, and when somebody comes along and removes the cost — usually to be helpful — the practice doesn't spread, it dies. It's as if the cost is doing the transmitting, and the "content" is almost incidental.

  Some instances, so you know what I mean. After Vatican II, the Catholic mass was translated into the vernacular partly so ordinary people could participate without the barrier of Latin, and it worked — and parishes with the easy version have been emptying out for decades, while the small crowd keeping the demanding Tridentine rite keeps producing the priests and the families who carry it forward. Handwritten thank-you notes: once email made them effortless, the gratitude didn't migrate to the effortless medium, the practice just evaporated. Fraternity hazing: administrators keep banning it on the theory that it's a pointless cost standing in front of the fellowship, and it keeps coming back, while the groups that swap it for a pizza mixer don't bond. Even in my own shop: the brutal reading-heavy seminars are the ones students evangelize to their friends; nobody has ever recommended a course to me on the grounds that it was streamlined.

  Nearest things I know of, none of which quite fit: Veblen goods, where the high price signals wealth to onlookers — but here the cost isn't a status display aimed at outsiders, it seems to be what makes *transmission* work at all. Some signaling theory of religious cost that I've seen referenced (Sosis, Irons?) — that explains why an individual is willing to pay, not why the practice spreads better when it's expensive. And plain survivorship bias — maybe I only notice the costly survivors because the easy versions that died are forgotten? Though I don't think that's it, since the easy versions are sitting right there, visibly failing to get picked up.

  So what I'd like:

  First, casual prose. (a) Tell me whether this configuration has an established name, and if so whether the name actually covers it or just overlaps; (b) if nothing established fits, coin a term and give a real definition, and be explicit about the edges — what's in, what's out, especially how it differs from costly signaling and from the boring idea that people just value what's effortful.

  Then, after the prose, a JSON object summarizing your verdict, with this schema. Fields: "nearest_concepts", an array of objects each with "name", "how_it_fits", and "where_it_diverges"; "verdict", either "established" or "needs_new_term"; "best_fit" (if established) or "coined_term" (if new), the latter as an object with "name" and "one_line_definition"; "boundary_cases", an array of one-sentence cases that stress the edges; "confidence", a number from 0 to 1 plus a one-line reason; and "what_would_change_my_mind", where I want you to actually commit — name the kind of evidence or counterexample that would move you to a different verdict, and say which link in your reasoning is the most likely to be wrong. Don't be vague on that last field, it's the part I care about most.
reasoning: |-
  Okay, the user is a philosophy professor teaching a seminar on ritual and obligation. They've been reading anthropology and cultural evolution literature and noticed a pattern where costly cultural practices survive because of their cost. When the cost is removed, the practice dies instead of spreading. They want to know if there's an established term for this or if a new one needs to be coined.

  First, I need to recall relevant concepts in cultural evolution. Costly signaling theory comes to mind, mainly associated with Zahavi and Sosis/Irons in religious contexts. But the user already mentioned that costly signaling explains individual commitment, not necessarily transmission dynamics. The professor's examples—Latin Mass, handwritten notes, hazing, reading-heavy seminars—all show that removing costs leads to the practice fading, not adapting. 

  Next, I should consider other related ideas. Veblen goods are about conspicuous consumption, which doesn't fit since the cost here isn't for status display but for internal group transmission. Survivorship bias is another point, but the user argues that the low-cost versions are observable and failing, so that's not it. 

  Looking deeper, there's work by Henrich on credibility-enhancing displays (CREDs), where costly actions signal belief credibility, aiding cultural transmission. This seems closer. CREDs explain how observing others incur costs makes beliefs more transmissible. In the Latin Mass example, the effort involved signals commitment, making participants more likely to internalize and transmit it. When the cost is removed (vernacular mass), the signal weakens, leading to lower transmission. 

  But does CREDs fully cover the pattern? The user's case is about the practice itself requiring cost to be transmitted, not just beliefs. The persistence of hazing despite bans because it fosters bonding through shared suffering aligns with CREDs—costly acts enhance group commitment. However, handwritten notes shifting to email might be different. The cost of handwriting signals sincerity, making the gratitude more credible. If emails are effortless, they lack that signal, so the practice evaporates. 

  Boundary cases: voting by mail vs. in-person. In-person voting has higher cost (time, effort), which might enhance civic commitment. If mail-in voting reduces cost, does participation increase but perceived commitment decrease? That's a testable edge case. Another is open-source software with complex vs. user-friendly interfaces. If complexity acts as a cost barrier, removing it might attract more users but reduce core contributor retention. 

  So, CREDs seem the best fit. But the user wants precision. The term "cost-transmission hypothesis" or "costly ritual persistence" isn't established. Henrich's CREDs explicitly link cost to transmission credibility. The divergence is that CREDs focus on belief adoption, but the examples include practices (hazing, seminars) where the cost itself is key to transmission, not just beliefs. 

  The professor might need a new term if CREDs isn't broad enough. But I think CREDs can be extended to practices. Henrich's framework includes rituals as CREDs. So verdict: established term is CREDs. Confidence at 0.8 because while CREDs cover the core mechanism, the emphasis on practice persistence over belief transmission might require slight stretching. 

  What would change my mind? If evidence shows low-cost practices spreading effectively despite lacking cost (e.g., digital rituals with high engagement without inherent cost). Or if a specific anthropological term exists that directly addresses practice transmission via cost. If found, that would shift the verdict.
answer: |-
  Based on your description and analysis, here's a breakdown of the phenomenon, drawing on cultural evolution literature:

  ### (a) Established Name & Fit
  The closest established concept is **Credibility-Enhancing Displays (CREDs)**, developed by Joseph Henrich (building on Sosis/Irons' signaling theory). 

  **How it fits:**  
  CREDs explain how *costly actions* (not just words) signal genuine commitment to beliefs or norms, making them more likely to be adopted by observers. In your examples:
  - The Latin Mass's difficulty acts as a CRED, signaling deep commitment to tradition. Removing the cost (vernacular mass) weakens the credibility signal, impairing transmission.
  - Handwritten notes' effort signals sincere gratitude (CRED). Emails lack this costly display, so the norm degrades.
  - Hazing's pain signals investment in the group (CRED). Pizza mixers lack this costly signal, weakening perceived commitment.
  - Reading-heavy seminars signal intellectual seriousness (CRED), making students "evangelize" them.

  **Where it diverges:**  
  Classic CREDs focus on how *observing* costs enhances *belief transmission*. Your cases emphasize how the cost itself *sustains the practice* by filtering for committed participants who become transmitters. CREDs explains *why* costly practices transmit effectively; your pattern highlights that *removing the cost disrupts transmission*, causing collapse rather than adaptation.

  ---

  ### (b) If No Fit → Coined Term
  **Verdict:** CREDs is *established* and covers the core mechanism, but your emphasis on **cost as the transmission engine** warrants a specific sub-term:  

  **Coined Term:** **Cost-Dependent Transmission (CDT)**  
  **One-Line Definition:** *A cultural trait persists and spreads primarily because its inherent costs filter for high-commitment adopters who become effective transmitters; cost-reduced variants fail because they lack this filtering mechanism.*  

  **Boundaries (What’s In/Out):**  
  - **IN:** Practices where cost is *functional* for transmission (e.g., Latin Mass, hazing).  
  - **OUT:**  
    - Veblen goods (cost signals status *to outsiders*, not commitment *within* the group).  
    - Pure survivorship bias (your low-cost comparators are observable failures).  
    - Effort-justification bias (people *retroactively* value effort; CDT is about *forward* transmission).  

  ---

  ### JSON Summary

  ```json
  {
    "nearest_concepts": [
      {
        "name": "Credibility-Enhancing Displays (CREDs)",
        "how_it_fits": "Explains how costly actions signal commitment, enhancing belief/practice transmission.",
        "where_it_diverges": "CREDs focuses on observer adoption; your cases emphasize cost as a filter for transmitters and collapse upon cost-removal."
      },
      {
        "name": "Costly Signaling Theory (Sosis/Irons)",
        "how_it_fits": "Links costs to honest signals of commitment in religious/group contexts.",
        "where_it_diverges": "Explains individual motivation, not transmission dynamics or failure of cost-reduced variants."
      },
      {
        "name": "Veblen Goods",
        "how_it_fits": "High cost increases desirability via status signaling.",
        "where_it_diverges": "Your cases involve internal commitment/transmission, not conspicuous consumption."
      }
    ],
    "verdict": "established",  
    "best_fit": {
      "name": "Credibility-Enhancing Displays (CREDs)",
      "one_line_definition": "Costly actions that signal genuine commitment, enhancing cultural transmission."
    },
    "boundary_cases": [
      "Voting in person (costly) vs. mail-in ballots (low-cost): If in-person voting declines but civic engagement doesn't, it challenges CDT.",
      "Open-source software: Complex contribution barriers may sustain developer communities; simplifying might attract users but lose core transmitters.",
      "Patreon tips: Small payments signal fan commitment more effectively than free 'likes', aligning with CDT."
    ],
    "confidence": 0.85,
    "confidence_reason": "CREDs robustly explains the core mechanism, but your focus on systemic collapse after cost-removal is an underexplored nuance.",
    "what_would_change_my_mind": [
      "Evidence of a cultural practice thriving *because* it became low-cost (e.g., email replacing letters without gratitude norms degrading).",
      "Anthropological studies showing cost-reduced variants *outcompeting* costly originals in transmission (e.g., vernacular Mass attracting more devoted priests than Latin).",
      "If CREDs literature explicitly rejects cost as a filter for transmitters (it doesn’t; Henrich notes it selects for 'credible models')."
    ]
  }
  ```

  ### Key Reasoning
  - **Why CREDs fits:** Henrich (2009) argues CREDs solve cultural transmission's "free-rider problem" by ensuring only committed individuals invest in learning/teaching. Your cases align: cost filters free-riders, ensuring transmitters are invested.  
  - **Why CDT extends it:** CREDs doesn’t explicitly predict that *removing* costs causes practice collapse (rather than adaptation). CDT highlights cost as the transmission infrastructure.  
  - **Weakest link:** The handwritten notes example. If studies show email gratitude norms *strengthened* over time (e.g., emoji/formatting conventions conveying sincerity), CDT weakens. CREDs could still hold if new costs emerge (e.g., crafting perfect emails).  

  If you find counterexamples where low-cost variants *enhance* transmission, focus shifts to "ritual form" theories (e.g., Whitehouse's modes of religiosity). But your pattern suggests cost isn’t incidental—it’s the transmission catalyst.
