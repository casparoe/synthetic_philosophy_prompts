prompt: |-
  Otto Neurath spent much of his career arguing that pictures could function as an international language: his Isotype project, developed in interwar Vienna with the graphic artist Gerd Arntz and later in Oxford with Marie Neurath, used standardised, simplified figures and strict conventions for depicting quantities and comparisons, initially in the service of civic education through social and economic statistics. Now suppose Neurath were somehow presented with the visual-communication landscape of the early twenty-first century. In particular, consider four phenomena that postdate him entirely: (1) emoji, with their rapid, unplanned, community-driven drift of meaning; (2) wordless assembly instructions of the IKEA kind, which rely on numbered sequence and exploded diagrams rather than any standardised symbol vocabulary; (3) internationally standardised hazard and safety pictograms, in which a central body fixes a symbol's meaning and users must simply learn it; and (4) text-to-image models that can generate bespoke pictorial sequences on demand, with no designer and no standardisation at all. Drawing on what is known of his commitments — the demand for rule-governed, unambiguous symbols, the ideal of a picture vocabulary that crosses language barriers, the educational and broadly egalitarian purpose behind Isotype, and his general distrust of decoration that carries no information — which of these four would he welcome as genuine descendants of his project, which would he condemn as a regression into ambiguity or mere ornament, and where would he perhaps have to concede that his own idea of a picture language needs revision in the face of systems that evolve without any central designer? In composing your answer, bear in mind the tension between his desire for fixed, rule-governed symbols and the possibility that a living, self-correcting vocabulary that changes with its users might serve communication better than one laid down by an institute.

  Please give exactly five numbered points. Each point should be one or two sentences long. Points one to four should each assign a verdict to one of the four phenomena listed above, stating whether Neurath would recognise it as a continuation of his project and why; the fifth should address the general question of whether his picture-language idea survives contact with the fact that the most widely used pictorial systems of today were never centrally designed. Use British English throughout, and include no introduction, preamble, or conclusion.
