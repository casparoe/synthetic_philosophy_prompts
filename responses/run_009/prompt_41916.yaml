answer: |-
  Below is a comprehensive in-class simulation designed to help students grasp the epistemic (rather than computational) challenges at the heart of the socialist calculation debate. The simulation contrasts three systems—**Market**, **Planned Economy**, and **Lange-style Hybrid**—using a simple 2-good economy where participants hold private, dispersed knowledge and face incentives to misreport. The goal is to highlight Hayek's argument: the core problem is eliciting decentralized, tacit knowledge under strategic incentives, not solving equations.

  ---

  ### **Simulation Overview**
  - **Goods:** Apples (A) and Bananas (B).  
  - **Participants:** 16 students divided into roles (reassign roles between conditions).  
  - **Key Mechanics:**  
    - Each producer has **private production costs** (per unit) and **tacit know-how** (a cost-reducing action they can choose to hide).  
    - Each consumer has **idiosyncratic preferences** (utility weights) that **shift mid-game** due to a "local event" (e.g., a weather shock or trend).  
    - **Strategic misreporting** is incentivized in non-market conditions: producers can understate costs to get easier quotas, or overstate them to gain higher compensation.  
  - **Conditions:**  
    1. **Market:** Decentralized trades with price discovery.  
    2. **Planned Economy:** Central Planning Board (CPB) sets quotas/allocations based on reported data.  
    3. **Hybrid:** CPB uses a "solver" (student + spreadsheet) to adjust prices iteratively *à la* Lange.  

  ---

  ### **Materials & Roles**  
  **Total Participants:** 16 students. Roles shift between conditions:  
  - **Producers (10 students):**  
    - 5 produce Apples (A), 5 produce Bananas (B).  
    - Each holds a **Private Role Card** with:  
      - Cost per unit (e.g., "Your cost: 2 points per Apple").  
      - "Tacit know-how" action (e.g., "If you work slowly, cost falls by 1 point, but output halves").  
      - Initial preference weights for A and B (e.g., "Utility = (A^0.7) * (B^0.3)").  
      - Sealed "Local Event" envelope (opened mid-game).  
  - **Consumers (6 students):**  
    - Only consume goods (no production role).  
    - **Private Role Card** with:  
      - Initial preference weights (e.g., "You value A more: Utility = (A^0.9) * (B^0.1)").  
      - Budget (20 points for market/hybrid rounds).  
      - Sealed "Local Event" envelope (e.g., "A drought hits: your preference for B rises—new weights: A^0.3, B^0.7").  
  - **Central Planning Board (CPB) (4 students):**  
    - Active only in Planned/Hybrid conditions.  
    - Roles: 1 Chair (leads questioning), 2 Data Collectors (record reports), 1 Solver (only in Hybrid—uses spreadsheet).  
    - **Task:** Set quotas/allocations (Planned) or adjust prices (Hybrid) based on reports.  

  **Physical Materials:**  
  - Role cards, envelopes, tally sheets, calculators.  
  - Spreadsheet for Hybrid solver (Google Sheets with supply/demand formulas).  
  - Whiteboard for price/quantity tracking.  
  - Timer.  

  ---

  ### **Timeline (90-Minute Session)**  
  **Setup (10 min):**  
  - Assign roles (Producers/Consumers/CPB), distribute cards.  
  - Explain rules, payoffs, and the "local event" twist.  
  - Quick practice round for market trading.  

  **Round 1: Market Condition (20 min)**  
  - **Phase 1 (8 min):**  
    - Producers announce prices for A/B.  
    - Consumers use budgets to submit purchase orders.  
    - Trades executed: Producers fulfill orders, incur costs, earn revenue.  
  - **Local Event (4 min):**  
    - Everyone opens envelopes—preferences/costs shift.  
    - Producers adjust prices; consumers adjust demands.  
  - **Phase 2 (8 min):**  
    - Repeat trading with updated prices/demands.  
  - **Outcome:** Prices, quantities, and payoffs recorded.  

  **Round 2: Planned Economy (20 min)**  
  - **Phase 1 (10 min):**  
    - CPB interviews producers/consumers:  
      - Producers report costs (may misreport).  
      - Consumers report preferences (may exaggerate).  
    - CPB sets quotas and allocations to "maximize social welfare" (using reported data).  
  - **Local Event (5 min):**  
    - Envelopes opened; changes occur.  
    - CPB may re-interview (limited time).  
  - **Phase 2 (5 min):**  
    - CPB finalizes quotas/allocations.  
    - Producers produce; goods distributed.  
  - **Outcome:** Quotas, allocations, and payoffs recorded.  

  **Round 3: Hybrid Condition (20 min)**  
  - **Phase 1 (15 min):**  
    - CPB announces initial prices (e.g., A=3, B=4).  
    - Producers report supply quantities at these prices.  
    - Consumers report demand quantities given budgets.  
    - **Solver** aggregates data in spreadsheet, checks surplus/shortage, adjusts prices (2 iterations max).  
  - **Local Event (5 min):**  
    - Envelopes opened; changes occur.  
    - Final price adjustment; production/allocation.  
  - **Outcome:** Prices, quantities, and payoffs recorded.  

  **Debrief (20 min):**  
  - Discuss payoffs, efficiency, and strategic behavior across conditions.  
  - Map outcomes to the socialist calculation debate.  

  ---

  ### **Payoff Scheme**  
  **Producers:**  
  - Profit = Total Revenue − (Actual Cost × Quantity Produced).  
  - **In Planned:** "Revenue" is CPB compensation (based on *reported* cost).  
  - **Bonus:** +5 points for truthful reporting (if discovered in debrief—creates moral tension).  

  **Consumers:**  
  - Utility = (A^α) × (B^β) (using **true** weights, not reported ones).  
  - Converted to points: Utility × 100.  
  - **In Market/Hybrid:** Must stay within budget.  

  **CPB Members:**  
  - Paid average consumer utility + 10 points if total "social welfare" (sum of utility) exceeds a threshold.  

  ---

  ### **Predicted Problems & Mitigations**  
  1. **Time Overruns:**  
     - **Why:** Haggling in Market, CPB indecision in Planned.  
     - **Fix:** Use strict timers; cap iterations in Hybrid.  

  2. **Hybrid Solver Errors:**  
     - **Why:** Student solver may misadjust prices.  
     - **Fix:** Pre-load spreadsheet with simple rules (e.g., "If surplus, lower price 10%; if shortage, raise 10%").  

  3. **Misreporting Overkill:**  
     - **Why:** Producers/consumers may exaggerate strategically, causing chaos.  
     - **Fix:** Include a "truth bonus" to incentivize honesty.  

  4. **Complexity Confusion:**  
     - **Why:** Utility math may intimidate.  
     - **Fix:** Use whole-number weights (e.g., 0.7/0.3 → 70/30) and calculators.  

  ---

  ### **Debrief: Mapping to the Debate**  
  1. **Market Condition:**  
     - **Observed Outcomes:** Prices adjusted rapidly to local events; no misreporting (knowledge embedded in actions).  
     - **Hayek’s Epistemic Point:** Prices aggregate decentralized knowledge *without* requiring articulation. Tacit know-how (e.g., "work slowly to reduce costs") was naturally incorporated.  

  2. **Planned Economy:**  
     - **Observed Outcomes:** CPB faced distorted reports (e.g., producers understated costs to avoid high quotas; consumers overstated demand for favored goods). Local events caused allocations to be obsolete.  
     - **Mises/Hayek vs. Lange:** Highlights the **incentive problem**—even with infinite computing power, garbage in = garbage out. The CPB couldn’t access genuine local knowledge.  

  3. **Hybrid Condition:**  
     - **Observed Outcomes:** Prices converged faster than in Planned, but strategic reporting persisted (e.g., producers "gamed" trial-and-error by lowballing initial supply).  
     - **Computational vs. Epistemic:** Solver handled arithmetic easily, but **elicitation remained flawed**. Prices only reflected *reported* preferences/costs, not true ones. Proves Lange’s trial-and-error solves computation *but not* the epistemic crisis.  

  **Limitations of the Simulation:**  
  - **Oversimplified Incentives:** Real-world misreporting is subtler (e.g., hiding innovation).  
  - **No Innovation/Entrepreneurship:** Hayek’s "knowledge of circumstances" was reduced to static costs.  
  - **Equilibrium Bias:** Markets may not converge perfectly in 20 minutes, risking false confidence.  

  **Key Takeaway for Students:**  
  The debate wasn’t about "solving equations"—it was about whether central planners can *access* the dispersed, tacit knowledge that markets leverage through prices. Cheap computing doesn’t fix elicitation under incentives.  

  ---

  This simulation forces students to grapple with Hayek’s epistemic argument experientially. The first run will be messy, but the chaos itself demonstrates why dispersed knowledge can’t be "downloaded" into a central database—even with powerful solvers.
