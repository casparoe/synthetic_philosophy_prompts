answer: |-
  ## Inventory, With Statistical Preface

  1.  Water boils at 100 degrees Celsius at sea level.
  2.  The mitochondria are the powerhouse of the cell.
  3.  Light requires approximately 8 minutes and 20 seconds to travel from the Sun to Earth.
  4.  Napoleon Bonaparte died on the island of Saint Helena.
  5.  Sputnik 1, the first artificial satellite, was launched in October 1957.
  6.  The chemical formula for table salt is NaCl.
  7.  Mount Everest is the highest point above sea level on Earth's surface.
  8.  The heart possesses its own intrinsic electrical conduction system.
  9.  Lead is denser than aluminum at standard conditions.
  10. Oxygen comprises roughly 21% of Earth's atmosphere by volume.
  11. Human adults require 7-9 hours of sleep per night for optimal health.
  12. The Amazon River carries the largest volume of water of any river on Earth.
  13. Photosynthesis converts light energy into chemical energy stored in glucose.
  14. Sound travels significantly faster through water than through air.

  Given the documented frequency of minor errors
  in compilations of fact, even those rigorously checked,
  and the inherent complexities of verification across domains,
  it is statistically inevitable, demonstrably rational to accept,
  that at least one assertion recorded above is false.
  I know this. The evidence compels it.
  I stand by each line, and by this final note.
  Somewhere above, bound to be wrong,
  this page holds its quiet contradiction.

  ---

  **How it Enacts the Paradox:**

  1.  **Flat, Declarative Certainty:** Each numbered claim is stated plainly, as an established, verified fact. They cover diverse, generally reliable domains (physics, biology, history, geography). The tone is confident, unhedged.
  2.  **The Statistical Preface:** The final stanza explicitly states the rational belief that *at least one* of the preceding claims is false, grounding this in the statistical reality of error rates in complex works ("documented frequency," "statistically inevitable," "evidence compels it").
  3.  **Simultaneous Belief:** The speaker asserts unwavering belief in each individual claim ("I stand by each line") *and* in the preface ("I stand by... this final note"). This creates the tension.
  4.  **Unresolvable Ambiguity (The Rereading Effect):**
      *   **#2:** While fundamental, "powerhouse" is a simplification; mitochondrial roles are more complex (signaling, apoptosis).
      *   **#5:** Sputnik 1 launched October *4th*, 1957. Is "October 1957" specific enough? Or is the month/year the uncontested core fact?
      *   **#7:** Everest is highest *above sea level*. Mauna Kea is taller *from base to peak* (underwater base). Is the phrasing precise enough?
      *   **#11:** "Require" and "optimal health" are points of ongoing research and debate; individual variation is significant. Is this *fact* or *guideline*?
      *   **#14:** "Significantly faster" is vague but qualitatively true. Is the lack of quantitative precision a 'falsity'?
  5.  **No Winking, No Collapse:** The poem doesn't hint at which claim might be flawed. The ending ("quiet contradiction") acknowledges the paradox neutrally. It doesn't descend into skepticism ("nothing is knowable") nor dismissiveness ("it doesn't matter"). The paradox stands intact.
  6.  **Structure as Recognition:** The numbered list + the detached, statistically grounded admission of collective fallibility is the hallmark structure for those familiar with the preface paradox. For others, it's a list of facts ending with the unsettling, undeniable admission that one is probably wrong, prompting a fruitless re-examination (the "bugging them" effect).

  The poem forces the reader into the author's epistemic state: rationally compelled to endorse each piece individually *and* rationally compelled to endorse the statement that one piece is flawed, without resolution. The rereading hunt for the "false" claim, where multiple candidates emerge but none can be definitively settled, is the core experiential enactment.
