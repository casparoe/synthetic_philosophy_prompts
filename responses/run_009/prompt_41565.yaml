prompt: |-
  I'd like your help identifying a concept, and I'd rather have careful carving than a quick label, so please consider the nearest candidates before concluding anything.

  Here is the pattern. In discussions of minds, science, or society, someone invokes Gödel's incompleteness theorems for a sweeping conclusion: that no system can understand itself, that any theory rich enough to describe the world must leave some truths unestablished, that science can never finish its self-description, that a legal system must contain gaps it cannot close. When pressed, the arguer retreats to the precise statement — any consistent, effectively axiomatized theory strong enough for arithmetic is incomplete — and, having defended that, goes on using the sweeping conclusion as though it had been established. What makes it interesting is that the retreat usually isn't a knowing bait-and-switch; the arguer is often sincere. The slide happens through words like "system", "prove", and "complete", which mean something exact in the theorem and something much looser in the conclusion, so the theorem appears to license a claim it says nothing about. I've noticed the same figure with other results: Heisenberg's uncertainty principle invoked to show that knowledge in general is limited, the second law of thermodynamics invoked to show that social order must decay, the halting problem invoked to show that software can never be fully verified.

  I'm aware there's a general literature complaining about loose invocations of Gödel. But I'm after a name for the specific rhetorical structure: the sincere round trip between a true technical statement and a sweeping claim that the statement does not support, mediated by a word that is precise on one side of the trip and vague on the other. The nearest concepts I know are equivocation and motte-and-bailey, but neither quite fits: motte-and-bailey usually involves retreating from a claim one knows is indefensible, whereas here the sweeping claim isn't clearly false, merely unsupported; and it isn't plain equivocation, because the arguer isn't ping-ponging between two fixed meanings of one word so much as borrowing the theorem's authority across the word's vagueness.

  So, as an expert in philosophy of logic and the rhetoric of formal results: does this figure have an established name? If yes, define it precisely and say how it differs from equivocation, motte-and-bailey, and mere loose analogy. If not, say so plainly, coin a term, and give a definition that fixes its edges — does it cover using the second incompleteness theorem to argue that minds are not machines, and at what point does an instance stop being this phenomenon and become an ordinary, harmless analogy? A bare name will not satisfy me; I want the boundaries drawn.
reasoning: |-
  Okay, let me unpack this user's query. They're describing a specific rhetorical pattern where someone uses a precise technical theorem (like Gödel's incompleteness) to justify a broad philosophical or societal claim, then retreats to the exact technical statement when challenged, only to continue using the sweeping interpretation. The user wants to know if this pattern has a name, and if not, to coin a term with clear boundaries.

  First, I need to analyze the core mechanism. The key here is the semantic drift of terms like "system" or "proof" - they're precise in the theorem but vague in the application. This isn't quite equivocation (where a word switches meanings deliberately) nor motte-and-bailey (where there's conscious retreat from an indefensible position). The user emphasizes the arguer's sincerity, which makes this distinct.

  Looking at philosophy of science and logic literature, I recall similar discussions. Susan Haack's "Deviant Logic" touches on misapplications of formal results, but doesn't name the pattern. Searle's Chinese Room thought experiment often gets similarly misused. The closest existing concept might be "reification fallacy" but that's too broad.

  The user's boundary questions are crucial. When does this become harmless analogy? I think it hinges on maintaining the theorem's necessary conditions (like consistency for Gödel) in the new context. For example, arguing minds can't be machines via Gödel's second theorem fails because minds may not be consistent formal systems.

  For coining a term, I consider possibilities: "Theorem Prestige Projection" captures the authority-borrowing aspect. "Formal Fallacy" is cleaner but might be confused with logical fallacies. "Transference Fallacy" highlights the meaning-shift but sounds vague. I settle on "Theorem Transposition" as it suggests moving a concept to an incompatible context while preserving its symbolic weight.

  Defining the boundaries: It's distinct from loose analogy when the technical precision is used as proof rather than illustration. The Heisenberg example would qualify only if someone claims it directly proves epistemological limits beyond quantum contexts. The halting problem misapplication to software verification clearly fits.

  The user's depth suggests they're likely an academic in philosophy or logic. Their frustration with superficial labeling tells me they need this for precise critique, probably in writing or teaching. The request for boundary-drawing implies they want to use this concept discerningly.
answer: |-
  Based on your meticulous description and boundary requirements, this specific rhetorical figure **lacks a single, universally established name** in the literature on logic, philosophy of science, or rhetoric. However, it's a recognized and recurring pattern. Let's analyze it, coin a precise term, and rigorously define its boundaries.

  **Analysis of the Pattern:**

  1.  **Core Mechanism:** The fallacy hinges on exploiting the **semantic drift of pivotal terms** (e.g., "system," "proof," "complete," "uncertainty," "decay," "halt") between a *precise formal context* and a *vague informal context*. The authority and aura of the proven theorem are illegitimately transferred to the sweeping conclusion via this semantic bridge.
  2.  **Sincere Misapplication:** The arguer genuinely believes the theorem *directly implies* or *strongly supports* the broad conclusion, often due to a misunderstanding of the theorem's scope or necessary conditions. This distinguishes it from cynical motte-and-bailey.
  3.  **Retreat and Re-advance:** When challenged on specifics, the arguer retreats to the unassailable technical statement (the "safe ground"), demonstrating they *know* the formal result. Having defended *that*, they feel justified in immediately re-asserting the sweeping conclusion, believing the defense of the theorem *was* the defense of the conclusion.
  4.  **Illegitimate Authority Transfer:** The perceived rigor and profundity of the theorem lend unwarranted credibility to the vague conclusion. The theorem acts as a "prestige token."

  **Distinctions from Nearest Concepts:**

  *   **Equivocation:** While semantic drift is central, equivocation typically involves *deliberately* switching between distinct meanings of a word *within* an argument to mislead. Here, the shift is often *unconscious* and happens *between* the defense of the theorem and the assertion of the conclusion. The arguer feels the meanings are sufficiently aligned.
  *   **Motte-and-Bailey (M&B):** This is the closest structural analogy (retreat to defensible position). **Crucial Differences:**
      *   **Intent:** M&B often implies strategic insincerity (defending the indefensible bailey by retreating to the motte). This pattern is characterized by *sincerely held belief* in the connection.
      *   **Nature of Bailey:** In M&B, the bailey is typically indefensible. Here, the sweeping conclusion *might* be true or plausible *on other grounds*; its flaw is being *unsupported by the cited theorem*. The fallacy is one of *justification*, not necessarily the conclusion's falsity.
      *   **Retreat Justification:** In M&B, retreating to the motte is purely defensive. Here, retreating to the theorem's precise statement is seen as *validating* the broader claim.
  *   **Loose Analogy/Metaphor:** Analogies are inherently suggestive and non-demonstrative. This pattern goes beyond analogy: it presents the theorem as *evidence* or *proof* for the conclusion, leveraging its formal authority. The retreat isn't to "it's just an analogy," but to "see, the theorem *is* true, therefore my point stands."

  **Coined Term & Definition:**

  **Theorem Transposition Fallacy (TTF)**

  **Definition:** The Theorem Transposition Fallacy occurs when an arguer:

  1.  **Invokes a Precise Theorem (T):** Cites a formally proven result (e.g., Gödel's Incompleteness, Heisenberg Uncertainty, Second Law of Thermodynamics, Halting Problem) possessing rigorously defined terms and specific necessary conditions (e.g., consistency, effective axiomatization, conjugate variables, closed system, Turing machine).
  2.  **Asserts a Sweeping Conclusion (C):** Draws a broad, often philosophical, social, or metaphysical implication that uses core terms from (T) but in a significantly vaguer, looser, or materially different sense (e.g., "system" meaning a formal theory vs. a mind/society; "prove" meaning formal derivation vs. establish belief; "complete" meaning negation-completeness vs. comprehensive understanding; "uncertainty" meaning position/momentum precision vs. general epistemological limits; "decay" meaning entropy increase vs. social collapse; "halt" meaning program termination vs. software verification).
  3.  **Believes (T) Supports (C):** Sincerely holds that (T) provides significant, direct, or even conclusive support for (C), based primarily on the perceived resonance of the key terms and the authority of (T).
  4.  **Retreats to (T) Under Challenge:** When the connection between (T) and (C) is challenged, defends the precise, technical statement of (T), demonstrating knowledge of its formal meaning and validity.
  5.  **Re-asserts (C) Based on Defense of (T):** Takes the successful defense of the *technical truth* of (T) as validation of the *sweeping claim* (C), and proceeds to use (C) as if supported by the authority of (T). The semantic gap bridged during the initial assertion remains unaddressed.

  **Defining the Boundaries:**

  1.  **Does it cover using Gödel's Second Theorem to argue minds ≠ machines?** **Yes, this is a classic instance of TTF.**
      *   *T:* Second Incompleteness Theorem (consistent formal system strong enough for arithmetic cannot prove its own consistency).
      *   *C:* Therefore, minds (which can "see" their own consistency) cannot be formal systems/machines.
      *   *Semantic Drift:* "Prove" (formal derivation) vs. "see" (informal conviction/meta-awareness). "Consistency" (logical non-contradiction) vs. functional coherence/stability. Ignores necessary conditions: Is the mind a *consistent, effectively axiomatized, formal system*? Can "seeing consistency" be formalized as a *proof within the system*? The authority of Gödel is transposed onto the unsupported conclusion.
  2.  **When does it stop being TTF and become harmless analogy?**
      *   **TTF:** When the theorem is presented as *evidence*, *proof*, or *strong support* for the conclusion. When the defense retreats to the theorem's technical truth and uses that defense to justify the conclusion. When the key terms are used in a way that *requires* their precise meaning for the theorem to hold, but are used vaguely for the conclusion.
      *   **Harmless Analogy:** When the theorem is used purely for *illustrative* or *heuristic* purposes, often prefaced with "it's *like*" or "this *reminds me of*". When the connection is explicitly framed as suggestive, non-demonstrative, and not relying on the theorem's formal authority. When the speaker readily acknowledges the disanalogies and the limits of the comparison. There is no "retreat and re-advance" based on defending the theorem.
  3.  **Boundary Case - Strong, Well-Argued Extrapolation:** If someone meticulously argues *how* the *principles* underlying the theorem *might* apply in a new domain, carefully adapting the concepts and acknowledging the differences and limitations, this is **not TTF**. It's philosophical or scientific extrapolation/hypothesis. TTF occurs when the leap is made *implicitly* via semantic drift and relies on the theorem's prestige rather than independent argumentation bridging the gap.
  4.  **Other Examples:**
      *   **Heisenberg Uncertainty:** *T:* Fundamental limit on precision of measuring conjugate variables (pos/mom) in QM. *C:* Therefore, knowledge/measurement in *any* complex system (economics, psychology) is fundamentally limited. *TTF?* **Yes**, if presented as direct evidence/implication via the drift of "uncertainty" and "measurement". *Boundary:* An argument *inspired* by uncertainty about observer effects in social science, explicitly not claiming QM *causes* it, is analogy.
      *   **Second Law of Thermodynamics:** *T:* Entropy in an isolated system never decreases. *C:* Therefore, societies/civilizations inevitably decay/disintegrate. *TTF?* **Yes**, via drift of "decay" (entropy increase vs. social collapse) and ignoring "isolated system" (societies aren't closed). *Boundary:* Discussing resource depletion and increasing complexity *analogous* to entropy, without invoking the 2nd Law as proof.
      *   **Halting Problem:** *T:* No general algorithm exists to decide if an arbitrary program halts. *C:* Therefore, software verification is fundamentally impossible/always incomplete. *TTF?* **Yes**, via drift of "halt" (termination vs. correctness) and ignoring that verification often deals with *specific* programs/properties, not a general halting decider. *Boundary:* Using it correctly to show limits of *general* program analyzers, or as an analogy for practical difficulties.

  **Conclusion:**

  The **Theorem Transposition Fallacy (TTF)** captures the core of this sincere, yet fallacious, rhetorical pattern: the illegitimate transfer of epistemic authority from a formally proven theorem to a sweeping, loosely related conclusion, mediated by the semantic drift of key terms, and characterized by a retreat to the theorem's technical truth as validation for the unsupported conclusion. It is distinguished from equivocation, motte-and-bailey, and harmless analogy by its specific structure, the sincerity of the belief in the connection, and the nature of the semantic shift used to borrow the theorem's prestige. Its boundaries are defined by whether the theorem is presented as *supporting evidence* relying on semantic drift and prestige, versus being used as a *suggestive analogy* or the basis for a *carefully argued extrapolation*.
