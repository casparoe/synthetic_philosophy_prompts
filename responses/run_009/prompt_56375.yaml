  ### Residue Report: What Survives, What's Fudged, What's Lost  
  | **Step**                  | **Translation Status**                                                                 | **Notes**                                                                 |
  |---------------------------|----------------------------------------------------------------------------------------|---------------------------------------------------------------------------|
  | **Propositions as types** | Clean                                                                                  | Core of Curry-Howard holds.                                               |
  | **Knowledge \(Kp\)**      | Fudged                                                                                 | Requires epistemic layer: \(Kp\) tracks proof *possession*, not truth.    |
  | **Moore sentence**        | Clean (as product), but \(\neg Kq\) is shaky                                           | \(\neg Kq\) is meta-theoretic unless given a proof.                       |
  | **Distribution**          | Clean                                                                                  | \(\text{fst}/\text{snd}\) model conjunction elimination perfectly.        |
  | **Factivity**             | Clean                                                                                  | \(\text{extract} : Kp \to p\) is a natural coercion.                      |
  | **Modality \(\diamond\)** | **No native counterpart**                                                              | Quantification over worlds isn't computational. Key friction point.       |
  | **Contradiction**         | Clean in \(w'\)                                                                        | Type \(\textbf{0}\) inhabitation directly models inconsistency.           |
  | **Non-omniscience**       | Fudged                                                                                 | Assumes we can inhabit \(p \times \neg Kp\) without solving it.           |

  #### The Crucial Friction: Modality and Truth vs. Knowledge  
  - **Your suspicion is correct**: The paradox **hinges entirely on \(\diamond\)** and the **separation of truth from knowledge**.  
    - In type theory without modalities, truth *is* knowledge (inhabitation = proof possession). Non-omniscience (\(p \land \neg Kp\)) becomes:  
      _"There's a type \(p\) with a proof \(t : p\), but no proof \(t : p\) exists."_  
      This is **immediately contradictory**—so omniscience holds trivially.  
    - \(\diamond\) breaks this: It allows \(p\) true *here* but \(Kp\) only true *somewhere else*. This is the only way the contradiction "bites."  
  - **Residue verdict**:  
    - **Not a bug in your vocabulary**: The collapse of truth and knowledge is a feature of standard type theory.  
    - **Sign of ill-formedness?**: Yes, for verificationism. The knowability principle smuggles in a non-constructive, world-quantifying modality (\(\diamond\)) that clashes with constructive truth (inhabitation). In a computational setting, "knowable" has no clear semantics—it's a claim about hypothetical states, not proofs.  

  #### The Gödel Analogy: Vibes, Not Load-Bearing  
  - **Why not Gödelian?**  
    - Gödel's sentence is a *fixed point*: \(G \leftrightarrow \neg \text{Prov}(\ulcorner G \urcorner)\), leading to undecidability.  
    - The Moore sentence is a *witness to ignorance*: \(q \times \neg Kq\), with no self-reference. It's just a true proposition we don't know.  
  - **When it could work**: If you try to define a "knowability Gödel sentence" \(G\) where \(G \leftrightarrow \neg KG\), you'd get a similar contradiction—but Fitch doesn't need this. The paradox uses an arbitrary unknown truth.  

  #### Confidence and Least Sure Point  
