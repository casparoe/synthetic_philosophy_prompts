prompt: |-
  I'm a novelist working on a book where a small-town utilitarian character keeps losing arguments to her sister, and I want a scene where she finally turns the tables. You're a professional philosopher who specializes in utilitarianism and its critics, so please think this through carefully before answering, and maybe start with a quick brainstorm of candidate setups and why you discard most of them.

  Here's the assignment: the utility monster (Nozick's hypothetical creature whose welfare counts so much that utilitarianism says everyone else should sacrifice for it) is normally used as an objection against utilitarianism -- it makes the utilitarian verdict feel monstrous. Construct a thought experiment that flips the intuition: a case where the utilitarian verdict (favoring the "monster") is the one that feels humane and right, and it's the anti-utilitarian resistance that starts to look cruel. Constraints: fully realistic and mundane -- no sci-fi superhuman feelings, no brain implants, think family life or a small community. The monster's greater capacity for wellbeing should come from something ordinary we can sympathize with (e.g. some people really do feel things more vividly, and it can't just be stipulated that their pleasure is 1000x everyone else's -- it has to be the kind of difference you'd actually meet in real life). Keep the scenario itself to one paragraph.

  After the scenario, walk me through why the flipped intuition arises -- which features of the case are doing the work of making the utilitarian verdict attractive. Then tell me what a critic of utilitarianism would say to un-flip the intuition again, and whether that rebuttal also threatens the original use of the utility monster as an objection (i.e., whether the two can be made consistent without special pleading). My novel needs the utilitarian sister to win this round but leave the reader uneasy about it, so the case should feel like a real victory, not a cheap trick.
