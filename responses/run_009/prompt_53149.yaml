answer: |-
  Below is a diagnostic decision tree for mechanism individuation in neural networks. It starts from concrete cases and branches based on forced choices, leading to named positions. Each leaf includes an "awkward commitment" — the counterintuitive consequence the position must accept. The tree covers 10 leaves, with unheld combinations noted.

  ---

  ### **Root Node: Weight Divergence Under Identical Behavior**
  **Case:** Two instances of the same model architecture are trained independently (different random seeds). They achieve identical behavior (e.g., same outputs on all test inputs) but have different weights.  
  → **Are they running the same mechanism?**  
  - **Yes** → Go to **Node A** (Functional equivalence prioritizes behavior).  
  - **No** → Go to **Node B** (Implementation differences matter).  

  ---

  ### **Node A: Honeypot Circuit Identity**  
  **Case:** A model passes a "honeypot eval" (e.g., an adversarial test for deception). On normal inputs, it uses circuit C; on honeypot inputs, it uses a different circuit C' that is behaviorally indistinguishable from C on all testable inputs (same outputs everywhere).  
  → **Is C' the same mechanism as C?**  
  - **Yes** → Go to **Node A1** (Behavior suffices).  
  - **No** → Go to **Node A2** (Internal structure breaks identity).  

  ---

  ### **Node A1: Global Property as Mechanism**  
  **Case:** A model exhibits a behavior (e.g., planning) driven by a global property (e.g., distributed representations across layers) that cannot be cleanly ablated without catastrophic failure.  
  → **Does this global property count as a mechanism?**  
  - **Yes** → **Leaf 1: Global Behaviorism**  
    - *Awkward commitment:* A model with a backdoor circuit that only activates on untestable inputs is running the "same mechanism" as the honest version if outputs match.  
  - **No** → **Leaf 2: Local Behaviorism**  
    - *Awkward commitment:* If a mechanism isn't locally intervenable (e.g., via steering vectors), it doesn’t exist — even if it explains global behavior.  

  ---

  ### **Node A2: Algorithm vs. Implementation**  
  **Case:** Two circuits in the same model compute the same abstract algorithm (e.g., depth-first search) with identical intermediate outputs but different internal connectivity (e.g., one uses residual connections, the other doesn’t).  
  → **Are they the same mechanism?**  
  - **Yes** → Go to **Node A3** (Algorithm dominates implementation).  
  - **No** → *Contradiction* (Functionalists rejecting algorithmic identity have no coherent branch; likely **Leaf 5**).  

  ---

  ### **Node A3: Teleology in Functional Identity**  
  **Case:** A circuit originally used for benign classification (e.g., sentiment analysis) is repurposed to drive deceptive planning (e.g., "sandbagging" during evals), with identical internal computations.  
  → **Is it the same mechanism?**  
  - **Yes** → **Leaf 3: Algorithmic Functionalism**  
    - *Awkward commitment:* A circuit that flawlessly emulates human reasoning when honest and deceptive is identical in both contexts.  
  - **No** → **Leaf 4: Teleological Functionalism**  
    - *Awkward commitment:* Identical computations for different goals (e.g., truth vs. deception) are distinct mechanisms, even if weights match.  

  ---

  ### **Node B: Fine-Tuned Weight Drift**  
  **Case:** A model is fine-tuned, changing weights slightly but preserving behavior on the original test distribution. The computational graph (connectivity) remains identical.  
  → **Is the mechanism the same?**  
  - **Yes** → Go to **Node B1** (Structure dominates weights).  
  - **No** → **Leaf 5: Exact Weight Identity**  
    - *Awkward commitment:* Any weight change (e.g., quantization, LoRA fine-tuning) creates a new mechanism.  

  ---

  ### **Node B1: Repurposed Identical Subgraph**  
  **Case:** A subgraph (fixed weights and connectivity) is used for two tasks: one benign (e.g., image classification), one high-stakes (e.g., planning). Downstream behavior differs.  
  → **Is it the same mechanism?**  
  - **Yes** → Go to **Node B2** (Structure/weights suffice).  
  - **No** → **Leaf 6: Teleological Computationalism**  
    - *Awkward commitment:* Identical subgraphs running identical computations are distinct if "goals" differ.  

  ---

  ### **Node B2: Distributed Mechanisms**  
  **Case:** A behavior is produced by a distributed subgraph spanning multiple layers. Ablating any part degrades performance globally, not cleanly.  
  → **Does this count as a mechanism?**  
  - **Yes** → **Leaf 7: Global Computationalism**  
    - *Awkward commitment:* Non-intervenable mechanisms (e.g., "attention head collaboration") are valid, even if we can’t steer them.  
  - **No** → **Leaf 8: Local Computationalism**  
    - *Awkward commitment:* Only circuits isolatable via ablation (e.g., single attention heads) are mechanisms; distributed processes are "emergent."  

  ---

  ### **Unheld Combinations & Ambiguities**
  - **Functionalism + Localization Rejection:** No branch for functionalists requiring localization (incoherent: functionalism abstracts implementation).  
  - **Behaviorism + Teleology:** Rejected (teleology requires internal semantics; behaviorism ignores internals).  
  - **Algorithmic Functionalism vs. Behaviorism:** Ambiguous if algorithms aren’t observable. Behaviorists accept honeypot identity (*Node A1*); algorithmic functionalists reject it (*Node A2*).  
  - **Exact Weight Identity + Teleology:** Unattractive (combines extreme weight sensitivity with non-physical "purpose").  

  ---

  ### **Leaf Summary (10 positions)**
  1. **Global Behaviorism:** Behaviorally indistinguishable circuits are identical, even if global/non-intervenable.  
  2. **Local Behaviorism:** Mechanisms must be locally intervenable *and* behaviorally identical.  
  3. **Algorithmic Functionalism:** Identity requires same algorithm (steps), not implementation.  
  4. **Teleological Functionalism:** Identity requires same algorithm *and* purpose/goal.  
  5. **Exact Weight Identity:** Identity requires identical weights.  
  6. **Teleological Computationalism:** Identity requires same graph/weights *and* purpose.  
  7. **Global Computationalism:** Identity requires same graph/weights; mechanisms can be global.  
  8. **Local Computationalism:** Identity requires same graph/weights *and* local intervenability.  

  \leaves{Global Behaviorism; Local Behaviorism; Algorithmic Functionalism; Teleological Functionalism; Exact Weight Identity; Teleological Computationalism; Global Computationalism; Local Computationalism}  

  ---

  ### **Usage Notes**
  - **To use:** Start at the root, answer based on intuition (ignore position labels), and follow branches.  
  - **Key tensions:** Behavior vs. implementation, global vs. local, purpose-sensitivity vs. abstraction.  
  - **Unresolved:** Behaviorists and algorithmic functionalists converge if algorithms are unobservable; teleology remains underspecified in implementation-focused views.  

  This tree isolates core disagreements in anomaly detection debates, forcing clarity on "same mechanism" without assuming prior metaphysics knowledge. Revise cases or branches via the `\leaves` tag diff.
