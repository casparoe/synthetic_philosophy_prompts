answer: |-
  Here is a specification of requirements for an adequate account of idealization in scientific modeling, structured around your cases, with non-negotiables marked (**★**). The levitation case (4) and constitutive idealization (3) emerge as the most discriminating tests.

  ---

  ### **Requirements for an Adequate Account of Idealization**
  *(Non-negotiables marked **★**)*

  1. **Benign Idealization Stability**  
     - **Must explain** why relaxing assumptions in cases like point masses or ideal gases yields convergent accuracy.  
     - **Case:** *Point-mass planes, ideal gases*.  
     - **Core Mechanism:** Account must appeal to *stability under perturbation* (e.g., continuum limits, asymptotic analysis).  
     - **Non-negotiable (**★**):** Failure here invalidates the account for most physical sciences.  

  2. **Non-Monotonic Improvement**  
     - **Must explain** when/why *adding* realism degrades predictive power or utility.  
     - **Case:** *Representative-agent models in economics; particle-based traffic flow*.  
     - **Core Mechanism:** Account must distinguish *tractability-enabling* idealizations (reducing noise/degrees of freedom) from mere approximations.  
     - **Non-negotiable (**★**):** Rejects naïve "scaffolding" views.  

  3. **Constitutive Idealization**  
     - **Must explain** how assumptions *define* (rather than approximate) a target system.  
     - **Case:** *Infinite populations in evolutionary models; frictionless vacuums in Newtonian mechanics*.  
     - **Core Mechanism:** Account must allow idealizations to be *ineliminable* for certain results (e.g., determinism requires infinite populations).  
     - **Non-negotiable (**★**)** and **most exclusionary** (sinks many accounts).  

  4. **Anti-Levitation Constraint**  
     - **Must reject** theories with empirically successful but *explanatorily disconnected* false assumptions.  
     - **Case:** *"Agents levitate" yielding correct economic predictions*.  
     - **Core Mechanism:** Account must require *causal-structural coherence* between assumptions and mechanisms.  
     - **Non-negotiable (**★**):** Separates idealization from lucky falsehoods.  

  5. **Functional Plurality**  
     - **Must distinguish roles** of assumptions: negligibility (e.g., friction), domain restriction (e.g., low velocities), heuristic (e.g., continuum limits).  
     - **Case:** *A single assumption (e.g., rational expectations) may serve multiple functions*.  
     - **Preference:** Some camps (e.g., pragmatic views) collapse distinctions; structuralists insist on separation.  

  6. **Explanation-Prediction Asymmetry**  
     - **Must address** why some predictively adequate models fail to explain.  
     - **Case:** *Black-box ML models vs. mechanistic models*.  
     - **Core Mechanism:** Account must link idealization to *counterfactual robustness* or *causal depth*.  
     - **Non-negotiable (**★**):** Purely predictive accounts (e.g., F-twist) fail here.  

  ---

  ### **Tensions Between Requirements**
  - **Prospective Guidance vs. Retrospective Validation:**  
    Requirement 1 (prospective stability) conflicts with actual practice (requirement 2), where modelers often *discover* stability only *after* relaxing assumptions.  
    - **Resolution:** Drop strict *prospective* guidance. Accounts should describe *how* idealizations function, not mandate *a priori* rules. Practice is inherently iterative.  

  - **Constitutive vs. Benign Idealization:**  
    Accounts emphasizing stability (1) struggle with constitutive cases (3), which lack a "real" target.  
    - **Resolution:** Accept that constitutive idealizations are *sui generis*—they refer to universality classes (e.g., phase transitions) rather than concrete systems.  

  ---

  ### **Scorecard of Contending Accounts**
  *(Against non-negotiables ★)*

  | **Account**               | **Benign (1★)** | **Non-Mono (2★)** | **Constitutive (3★)** | **Levitation (4★)** | **Explanation (6★)** | **Verdict** |  
  |---------------------------|-----------------|-------------------|------------------------|---------------------|----------------------|-------------|  
  | **Friedman’s F-twist**    | ❌ (Ignores why) | ✅                | ❌ (Denies issue)      | ❌ (Fails)          | ❌ (Denies asymmetry) | **Fails**: Violates 1,3,4,6. |  
  | **Galilean Concretization** | ✅              | ⚠️ (Rarely)       | ❌ (Assumes removal)   | ✅                  | ✅                   | **Fails**: Violates 3 (constitutive cases). |  
  | **Models as Fictions**    | ✅ (If stable)  | ✅                | ✅ (Fictions can define) | ❌ (Arbitrary)      | ⚠️ (Varies)          | **Fails**: Violates 4 (levitation). |  

  - **Best performer:** *Galilean account* satisfies most except constitutive cases (3★).  
  - **Most exclusionary requirement:** **Constitutive Idealization (3★)**. It forces accounts to reconcile mathematical necessity with empirical interpretation—a challenge for predictive (F-twist) and removal-focused (Galilean) views. Fiction views handle it but fail levitation.  

  ---

  ### **Key Conclusion**
  The **levitation case (4★)** and **constitutive idealization (3★)** jointly exclude all simplistic accounts. An adequate theory must:  
  - Treat some idealizations as *autonomous constructs* (not approximations),  
  - Tether assumptions to *causal-mechanistic structures*,  
  - Allow *non-removable* idealizations for explanatory depth.  
  **Recommendation:** Examine *minimal-model accounts* (e.g., Batterman, Weisberg) for constitutive cases, and *structural explanations* (e.g., Rice) for anti-levitation. Friedman’s F-twist fails all non-negotiable criteria except non-monotonic improvement.
