prompt: |-
  Me and a friend from my grad seminar on formal epistemology have been going back and forth for weeks about logical omniscience, and at this point I'd rather have a number than more vibes. The proposition, stated as precisely as I can: ideal rationality requires logical omniscience, in the sense that the standard idealization — a fully rational agent assigns probability 1 to every logical consequence of what it knows, never prices a tautology below 1, never values A and (A-and-B) differently — is the *right* idealization, and logical uncertainty (being genuinely unsure about consequences of things you already know, like whether some huge digit is the trillionth digit of pi before computing it) is just a resource limitation, the same sort of thing as bounded memory or slow hardware. My credence is about 0.35 and hers is like 0.7, and we genuinely can't locate what we're disagreeing about.

  Here's the decomposition I want, though feel free to restructure it if you think something's missing or mislabeled. (1) Probability that deductive closure of credences is a real normative requirement on rationality and not just a convenience baked into the Bayesian formalism — I keep half-buying the point that probabilism plus closure is only ever justified by Dutch book arguments that assume the bookie can compute what you can't. (2) Probability that the logical induction setup — the one where traders exploit any efficiently computable pattern in your prices, and in the limit you can't be exploited, so you "learn" logical facts over time — is a genuinely coherent alternative norm for ideal rationality and not just an asymptotic curiosity that doesn't say anything about any actual agent at any actual finite time. (3) Probability that the objection from incompleteness/halting-problem style results — that no possible agent can even approximate logical omniscience from the inside, so the idealization is worse than a frictionless plane — actually counts against the idealization rather than just being confused about how idealizations work. (4) Whatever else you think belongs in there, maybe something about whether a theory of rationality is even supposed to be action-guiding for agents like us.

  So: give me a number and one line of justification for each component, then however you think they should combine into a final credence, and flag which component you're least confident in. Then the part I actually care about: looking at my 0.35 and her 0.7, tell me which of us is more likely wrong and which sub-question the disagreement most likely lives in — my suspicion is we're not even disagreeing about the same proposition, but I can't prove it. And if there's some argument or known result that would move your overall number the most, I want to hear about it, since we need something to argue about at the next meeting anyway.
