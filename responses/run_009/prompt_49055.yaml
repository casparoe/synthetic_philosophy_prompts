  This analysis reveals current alignment as a *bureaucratic instrumentalism*: values are operationalized as preferences of paid contractors, policed by operators’ undisclosed meta-rules. The shift to true value alignment would require transforming AI development into a branch of applied moral philosophy—a prospect as daunting as it is necessary.
