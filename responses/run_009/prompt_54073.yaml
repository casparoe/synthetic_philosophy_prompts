prompt: |-
  My flatmate Elsie has been forming opinions about animals and what we owe them for years, and since we do the shopping and cooking together, her rulings have basically become case law that I live under. Her track record so far: battery-farmed eggs are wrong (she actually checks the boxes); the roadkill pheasant we found on the lane was fine and she cooked it; cultivated meat is fine, she says she'd queue for it on day one; foie gras is wrong; eggs from our other neighbour's hens, who live out their retirement as garden pets, are fine; horse riding is fine (she rides, and insists the horse likes it); cricket flour is fine, she puts it in her smoothies, which I find grim but she swears the crickets are dispatched in a freezer so it's painless; boiling a live lobster is wrong; and she wouldn't go near a bullfight on our trip to Spain last year.

  The problem is that Elsie is away for three weeks and I have decisions to make that I can't run past her. One: our smallholding neighbour keeps four pigs outdoors, they genuinely seem happy rooting around, there's no transport involved, and they're killed on the farm with a captive bolt — she's offered us a shoulder joint from the latest one, and it's in the freezer now. Two: my cousin stalks deer and has offered us a haunch; the animal had a wild life and a quick death. Three: I want to order a jumper from a wool outfit that tail-docks its lambs without anaesthetic (they say it prevents flystrike and that pain relief isn't practical at their scale) — no deaths involved there at all.

  Here's what I want from you, and please keep it under 500 words because I'll be reading this on my phone in a supermarket queue. Figure out what rule or rules actually fit her track record — I can see at least "it's the suffering, nothing else" versus "you don't kill them, full stop", and maybe something in between where death only counts against smarter animals, but tell me if there are others I'm missing. Then say what each surviving rule predicts for the pork, the venison, and the wool, give me your best guess at her actual verdict on each with your reasons, and finally tell me what single further case would most cleanly split the rules that are still standing — some hypothetical I could put to her when she's back, where they just have to come apart. Don't just tell me what *you* think about eating pork; I need to know what *she'll* say, because I'm the one who has to defend the shopping to her when she gets home.
reasoning: |-
  Okay, let me try to figure out Elsie's ethical framework based on her past decisions. She allows eggs from happy backyard hens but rejects battery-farmed eggs due to suffering. The roadkill pheasant was acceptable because there was no suffering caused by humans. She's okay with cultivated meat, which avoids animal death entirely. Foie gras is out because of force-feeding suffering. Horse riding is fine since the horse enjoys it. Cricket flour is acceptable because freezing is considered painless. Boiling live lobster is wrong due to pain. Bullfighting is clearly out for suffering and killing.

  The key patterns seem to be: suffering is a major factor, but death isn't always forbidden. Death is acceptable if the animal had a good life and quick death, like the pheasant or proposed venison. Suffering prevention matters, as seen in tail docking for flystrike, but she might object if it's done without pain relief. 

  For the pork: the pigs lived happily, killed quickly with captive bolt. This seems similar to the roadkill and venison cases—minimal suffering. Prediction: Acceptable.

  Venison: Wild deer, quick death. Like the pheasant. Prediction: Acceptable.

  Wool: Tail docking without anesthesia causes suffering, even if for flystrike prevention. She might reject it because of the pain involved, similar to avoiding battery eggs and foie gras. Prediction: Unacceptable.

  To split the rules, consider a scenario where a smart animal (like a pig) is killed painlessly but had an unhappy life. Rules focusing only on suffering during death might accept it, but those considering overall welfare would reject. Alternatively, a less intelligent animal suffering for human convenience versus necessary prevention, to test if intelligence matters.
answer: |-
  Based on Elsie's track record, her core principle appears to be **minimizing suffering and avoiding unnecessary cruelty, rather than an absolute prohibition on killing or using animals**. Death itself isn't the primary wrong; it's the *suffering* inflicted (e.g., battery cages, force-feeding, boiling alive, bullfighting) or the denial of a natural/wild life (e.g., battery hens vs. happy backyard hens) that matters. Killing is acceptable if it's quick/painless and the life was good/wild (roadkill, potentially venison/stunned pigs, crickets frozen). Using live animals or their products is acceptable if significant suffering isn't involved (riding a willing horse, eggs from happy hens, cricket flour via "painless" freeze, cultivated meat).

  **The Surviving Rule:**  
  *   **Primary:** Avoid actions that cause significant suffering or involve unnecessary cruelty. Prioritize animals having a reasonably natural/wild life free from avoidable distress. Death is permissible only if preceded by a good life and a quick, painless end.

  **Predictions & Verdicts:**  
  1.  **Pork (Neighbour's Pig):**  
      *   *Rule Prediction:* Acceptable.  
      *   **Verdict: YES.** Happy life outdoors, quick captive bolt death, no transport stress. Analogous to the roadkill pheasant or retired hen eggs – suffering minimized, life was good.

  2.  **Venison (Cousin's Stalked Deer):**  
      *   *Rule Prediction:* Acceptable.  
      *   **Verdict: YES.** Wild life, quick death (assuming accurate stalking). Directly analogous to the roadkill pheasant – the animal lived freely and died suddenly without prolonged suffering.

  3.  **Wool (Tail-Docking without Anaesthetic):**  
      *   *Rule Prediction:* Unacceptable.  
      *   **Verdict: NO.** This causes significant, acute suffering (tail docking is painful) for human convenience/prevention, even if the reason (flystrike) is valid. She rejects practices causing suffering without adequate mitigation (like battery farms). The lack of practical pain relief wouldn't excuse the suffering inflicted, similar to why battery eggs are wrong despite the "practicality" of cages.

  **The Splitting Hypothetical:**  
  To definitively test if "minimized suffering" is the *only* rule vs. a hidden "no killing smarter animals" rule, ask her:  
  **"Would it be okay to eat pork from a pig that lived a genuinely happy, free-range life but was killed *completely painlessly and instantly* in its sleep (via hypothetical future tech), solely for human consumption?"**

  *   **"Minimized Suffering" Rule:** Accepts it (no suffering at any point).  
  *   **"No Killing Smarter Animals" Rule:** Rejects it (killing a pig is wrong regardless of method).  

  Her answer here cleanly splits the potential hidden rule from the observed suffering-based pattern. Based on her acceptance of the roadkill (intelligent bird) and the pig shoulder under the described conditions, I strongly suspect she'd accept the hypothetical pork, confirming the suffering-focused rule. Good luck with the shopping defense!
