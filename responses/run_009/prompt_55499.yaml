answer: |-
  You've diagnosed the core problem brilliantly: the **slipperiness of "comparison"** itself. The Historikerstreit wasn't a simple "for vs. against comparison" debate; it was a clash over *what kind of comparison was being performed, for what purpose, and with what implications*. Let's dissect it using your framework and then address the meta-questions.

  **Dissecting "Comparison": A Typology**

  1.  **Causal Explanation:** Seeks origins, mechanisms, triggers. Asks: *Why did this happen? What structural factors, precedents, or fears enabled/provoked it?* (e.g., "Did Bolshevik terror create conditions/fears that facilitated Nazi radicalization?").
  2.  **Scale-Fitting:** Quantifies and juxtaposes magnitudes (victim counts, geographic scope, temporal intensity). Asks: *How extensive was the suffering relative to other events?* (e.g., "X million vs. Y million dead," "Total war vs. targeted genocide").
  3.  **Contextualization:** Situates an event within broader historical patterns, ideologies, or sequences without necessarily establishing direct causation or equivalence. Asks: *Where does this fit in the larger tapestry of violence, political thought, or modernity?* (e.g., "Extreme nationalism as a 20th-century phenomenon," "The Holocaust as a product of industrial bureaucracy").
  4.  **Competitive Ranking:** Implicitly or explicitly assigns *relative moral weight or significance*. Asks: *Which event was "worse"? Whose suffering demands greater recognition or guilt?* (e.g., "The Holocaust stands alone," or "Communism killed more than Nazism"). This often involves collapsing the first three types into a single moral calculus.

  **Locating Nolte's "Sin":**

  Nolte wasn't engaged in *pure* causal explanation, contextualization, or scale-fitting. His argument was a **toxic amalgamation**:

  1.  **Causal Claim:** The Holocaust was a *defensive imitation* ("Asiatic deed") of prior Bolshevik crimes. Nazis acted out of *fear* of the Bolshevik precedent. This wasn't merely noting influence; it implied a reactive, almost *understandable* (if excessive) motivation. (Sin: **Moral deflection via causation** - shifting agency/blame).
  2.  **Contextualization Claim:** Framing the Holocaust within a "European Civil War." (Potential Sin: **Dilution of specificity** - subsuming the uniquely ideological/biological Nazi project into a broader, less distinct category of political violence).
  3.  **Implied Competitive Ranking (via Causation & Scale):** By positioning the Holocaust as a *response* to Bolshevik terror and implying comparable brutality ("Asiatic deed"), Nolte implicitly suggested a *moral equivalence* or even a *lesser agency* ("They did it first/feared it more"). This wasn't explicit ranking, but the functional effect was **relativization for normalization**. His project aimed explicitly at overcoming the "past that will not pass" to facilitate German national identity restoration.

  **Habermas's core objection wasn't to comparison *per se*, but to the specific *type* Nolte performed:** A **causal-exculpatory comparison** leading to **competitive de-ranking** of the Holocaust's significance for German identity. The *function* in the Kohl/Bitburg era – providing historical justification for "normalization" – made the intellectual operation politically obscene.

  **The Anti-Comparativist Position & the Symmetry Problem:**

  You're absolutely right about the symmetry problem. Habermas *was* comparing, but to a different end:

  1.  **Comparison for Singularity:** Habermas argued the Holocaust was unique *because* of specific characteristics (industrial-bureaucratic extermination based on racial biology aiming at total annihilation). This *requires* comparison (to other genocides, massacres, terror regimes) to *identify* what makes it different. His uniqueness claim was **comparative-contrastive**.
  2.  **Functional Comparison:** Habermas compared the Holocaust *to itself* as Germany's foundational negative reference point ("constitutional patriotism"). This wasn't about ranking against external events, but about establishing its *singular* role in *German* post-war identity and democratic legitimacy. Relativizing it threatened this foundation.
  3.  **The Anti-Relativization Stance:** The core objection wasn't intellectual comparison for understanding, but comparison deployed to **diminish moral/political responsibility**. Habermas feared Nolte's comparison served an *apologetic function* ("Germans weren't uniquely evil; they were reacting to a universal evil").

  **The anti-comparativist position thus refines to:** Opposition to comparisons that **functionally relativize or diminish the specific historical responsibility and moral singularity** of an event *within its primary context of remembrance and political identity*, especially when done for contemporary political normalization. They embrace comparison for understanding singularity or universal lessons, but reject it for competitive ranking or exculpation.

  **Principles for "Non-Obscene" Comparison:**

  1.  **Clarity of Operation:** Explicitly state *what kind* of comparison is being attempted (causal, contextual, scale, etc.) and rigorously adhere to its limits. Don't let scale-fitting imply moral equivalence; don't let causal explanation imply justification.
  2.  **Avoid False Equivalence:** Scrupulously attend to *specificity* - ideology, intent, methods, target selection, bureaucratic structures. The Holocaust wasn't "like" the Gulag; Stalinism wasn't "like" Nazism. Comparisons must illuminate *differences* as much as similarities or sequences.
  3.  **Respect Contexts of Remembrance:** Acknowledge the *political and ethical weight* an event carries *within specific societies*. A comparison that might be analytical in one context could be deeply offensive and politically charged in another (e.g., comparing the Holocaust to *anything* in Germany vs. doing so in a different academic setting). The burden of sensitivity falls heaviest when challenging established national narratives of guilt/responsibility.
  4.  **Interrogate Motivation & Function:** Be transparent about *why* the comparison is being made. Is it purely historical understanding? To draw universal lessons? Or does it serve a contemporary political agenda (e.g., minimizing guilt, attacking ideological opponents)? The burden of justification is highest when the comparison challenges a deeply embedded negative foundational memory *within the perpetrator/victim society*.
  5.  **Direction Matters (Asymmetry of Burden):**
      *   **Deflating the Holocaust (Germany, etc.):** The burden of justification is *extremely high* because it directly challenges a cornerstone of post-war democratic identity and grapples with unparalleled industrial genocide. Relativizing comparisons risk appearing as apologetics.
      *   **Elevating Communist Crimes (France, etc.):** While also sensitive, the burden is *different*. Communist crimes were often minimized or justified within certain leftist narratives. Elevating them *without simultaneously diminishing the Holocaust* (e.g., not using inflated numbers competitively, not implying equivalence of intent) can be a legitimate corrective *if* done rigorously and without instrumentalization against contemporary political opponents (as Courtois arguably did). The obscenity arises if the elevation is *primarily* a tool for anti-left polemics or implicitly serves to *retrospectively justify* anti-communist actions (e.g., "See, fascism wasn't the *real* threat").

  **The Black Book (1997): Same Structure, Different Context?**

  *   **Similarities:**
      *   Core Issue: Scale-fitting (100 million dead) leading directly to Competitive Moral Ranking (Communism = Nazism in evil).
      *   Methodological Sin: Inflated, contested figures used for explicit moral equivalence.
      *   Political Charge: Highly charged context (post-Cold War reckoning with Communism).
      *   Function: Served a contemporary political agenda – discrediting the ideological left (especially in France) by associating it with totalitarian evil *equivalent* to Nazism. Courtois explicitly aimed to break a perceived "taboo."
      *   Relativization Accusation: Critics argued it relativized the Holocaust *by* equating it, diluting its specificity. Proponents argued Communism's crimes were *under*-relativized and needed elevation.
  *   **Key Differences:**
      *   **Direction:** Primarily *Elevating* Communist crimes, not *deflating* the Holocaust (though equivalence did the latter implicitly for some critics).
      *   **Primary Target of Relativization Charge:** Not a perpetrator society diminishing its *own* crime (like Germany), but an ideological opponent (the left/communism) being accused of *underplaying its own* past crimes. The charge was less about national guilt evasion and more about ideological warfare.
      *   **Motivation:** Less about restoring a *positive national identity* (like Nolte/Kohl) and more about *ideological condemnation* of the opponent.
  *   **Verdict:** It's the **same structure** (scale-fitting → competitive moral ranking serving a contemporary political agenda) but a **mirror image** in direction and primary target. It confirms that the **obscenity lies not in comparison *itself*, but in specific *operations* (especially flawed scale-fitting used for competitive moral ranking) performed for specific *apologetic or polemical functions* (national normalization in Germany, anti-communist crusading in France). Courtois, like Nolte, prioritized the polemical/political function over rigorous historical differentiation, making the comparison obscene. The difference in context highlights the *asymmetry of burden* – deflating the Holocaust in Germany carries a uniquely heavy burden due to its foundational role, while elevating communist crimes, though sensitive, operates in a different ethical/political space.

  **Conclusion for Your Paper:**
  Your suspicion is correct. The Historikerstreit reveals "comparison" as a multifaceted, often weaponized tool. The core conflict wasn't about comparison vs. non-comparison, but about:
  1.  **What KIND of comparison?** (Causal-exculpatory/competitive ranking vs. contextual-understanding/comparative-contrastive).
  2.  **For what PURPOSE?** (National normalization/apologetics vs. understanding singularity/buttressing democratic vigilance).
  3.  **With what ETHICAL/POLITICAL FUNCTION?** (Diminishing specific responsibility vs. acknowledging it).

  A "non-obscene" comparison requires meticulous differentiation of types, rigorous methodology, transparency of purpose, profound respect for contexts of remembrance, and a rejection of competitive ranking and false equivalence. The obscenity arises when comparison serves not understanding, but exculpation, polemics, or the dilution of specific historical responsibilities embedded in political identity. Both Nolte and Courtois crossed this line, proving it's the *how* and *why*, not the *whether*, of comparison that determines its legitimacy. Your paper's strength lies in precisely this nuanced disentanglement.
