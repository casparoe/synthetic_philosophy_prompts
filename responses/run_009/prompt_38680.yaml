  Okay, let me start by unpacking the user's question. They're a data analyst dealing with noisy time series data and noticing that patterns emerge at certain granularities but disappear at finer levels. They mention examples like recessions, chess forks, and low-res images, all pointing to patterns that are real in some contexts but dependent on the observer's scale and error tolerance.

  First, I need to identify the core issue. The user is struggling with the ontology of these patterns—are they real, constructed, or something else? They've already ruled out emergence, social construction, and supervenience as not fully capturing the idea. The key elements here are granularity, error tolerance, predictive utility, and observer-relative categorization without being arbitrary.

  I recall philosophical concepts that might fit. Perspectival realism comes to mind, where reality is accessible through specific perspectives. Then there's Dennett's real patterns, which explicitly ties patterns to compression and predictive utility. Maybe also Carnap's linguistic frameworks, where entities exist within a chosen framework. 

  The user wants clarity on settled vs. contested ideas. For Dennett, some philosophers like Ladyman and Ross support him, while others like Searle criticize the idea. Perspectival realism has proponents like Giere and Massimi. I should present these debates without bias, highlighting where they agree and disagree.

  Looking at the examples: time series compression fits Dennett's real patterns well. Chess forks align with intentional stances and functional roles in games. Low-res images relate to perceptual gestalts. But each concept has limitations. Dennett doesn't address granularity explicitly, while perspectival realism might not cover compression efficiency. 

  The user might need a synthesized view. Perhaps combining elements: patterns are real relative to a granularity level and purpose, with their reality tied to their predictive robustness. The edge cases would be when patterns aren't compressible or when error tolerance varies too much between observers.

  Also, the user's deeper need might be to validate their analytical approach. They want philosophical grounding to justify treating patterns as objective yet scale-dependent. They might be seeking terminology to communicate this in their work or research.

  I should make sure to distinguish each concept's strengths and weaknesses. For instance, Dennett's real patterns handle compression but face criticism on realism. Perspectival realism incorporates frameworks but might be too broad. Carnap's frameworks are precise but lack the pragmatic utility aspect.

  In conclusion, no single term perfectly fits, but Dennett's real patterns come closest. However, the user should know it's contested. Offering a synthesized definition could help them apply it across their examples while acknowledging philosophical debates.
answer: |-
  Your question cuts to the heart of deep philosophical debates about **ontology** (what exists) and **epistemology** (how we know). There isn't a single uncontested term for *exactly* what you describe, but several closely related concepts are fiercely debated. Here's a breakdown of the strongest contenders, their nuances, settled points (where they exist), and contentious frontiers:

  1.  **Dennett's "Real Patterns" (The Closest Fit):**
      *   **Core Idea:** Daniel Dennett argues that patterns are "real" if they support *robustly better compression* of the data for prediction *from a particular point of view* (or "stance": physical, design, intentional). A pattern is real not because it's composed of fundamental particles, but because ignoring its reality (treating it as noise) forces you into a predictively worse description. The chess fork, the smoothed trend, and the face *are* real patterns because compressing the state of the board, the time series, or the pixel array *while ignoring them* is inefficient and loses predictive power.
      *   **Fits Your Cases:**
          *   **Granularity/Error Tolerance:** The pattern's "reality" depends on the scale/resolution and the predictive task. A fork is real for a chess player (using the design/intentional stance), not for a physicist describing quark interactions. A smoothed trend is real for a quarterly business forecast but not for a millisecond-by-millisecond market analysis.
          *   **Objective but Observer-Relative:** The compressibility/predictive advantage is objective *relative to the stance and purpose*. Two analysts independently finding the same trend confirms its reality *for that predictive purpose and granularity*. Different observers (e.g., high-frequency trader vs. long-term investor) might validly identify *different* patterns as "real" from the same data.
          *   **Not Fundamental Physics:** The pattern doesn't have causal powers "over and above" the substrate; its reality *is* its predictive/compressional utility from a perspective.
      *   **Settled Aspect:** Dennett's framework is widely recognized as a powerful and influential way to talk about higher-level patterns, especially in complex systems, biology, and cognitive science. The *logic* of compression-for-prediction defining pattern reality is clearly articulated.
      *   **Contentious Aspects:**
          *   **Is it *Really* Realism?** Critics (e.g., John Searle, David Chalmers) argue this is a form of *instrumentalism* or *pragmatism* disguised as realism. They claim it reduces reality to usefulness for prediction, failing to capture a "mind-independent" existence. Defenders (e.g., James Ladyman, Don Ross) argue it *is* a form of robust realism suitable for complex domains, where "mind-independent" in a naive sense is the wrong standard.
          *   **How Robust is "Robustly Better"?** Defining the threshold where compression becomes "robustly better" enough to confer "reality" is fuzzy and context-dependent.
      *   **Edge Cases for You:** Does a pattern that offers only a *marginal* compression/prediction advantage count as "real"? What if two different compressions (smoothing algorithms) offer *equivalent* predictive power for a given task? Dennett might say both patterns are real relative to that purpose, or that the "real" pattern is the equivalence class itself.

  2.  **Perspectival Realism:**
      *   **Core Idea:** (Associated with Ronald Giere, Nancy Cartwright, Michela Massimi) Scientific knowledge, and the entities/patters it reveals, are always situated within a specific *perspective*. This perspective includes the instruments used, the theories guiding inquiry, the questions asked, and crucially, **the scale or granularity of investigation**. Reality is accessible only through these perspectives, but this doesn't mean it's merely constructed; the perspectives are constrained by the world and can be more or less adequate.
      *   **Fits Your Cases:**
          *   **Granularity as Perspective:** The "pattern" in the time series is real *from the perspective* of analyzing quarterly data for GDP trends. The recession is real *from the perspective* of macroeconomic analysis. The fork is real *from the perspective* of the game's rules and the player's goals.
          *   **Objective Constraints:** The perspective isn't arbitrary; the world pushes back. You can be *wrong* about the pattern within a perspective (bad smoothing, misidentifying a fork). Different perspectives (e.g., microeconomics vs. macroeconomics) can reveal different, equally valid patterns.
      *   **Settled Aspect:** It's widely accepted that scientific observation and theorizing are perspectival. The debate is about *how much* ontology (what exists) depends on the perspective.
      *   **Contentious Aspects:**
          *   **Degree of Relativity:** Does the perspective *constitute* the reality of the pattern/entity, or does it merely *reveal* an aspect of a perspective-independent reality? Perspectival realists lean towards the former (the recession pattern *is constituted by* the macroeconomic perspective), while more traditional realists argue for the latter.
          *   **Commensurability:** How do we relate truths/entities from different perspectives? Is there a "view from nowhere" that reconciles them?
      *   **Edge Cases for You:** Is the "grain of description" itself perspectival? Could two observers using the *same* granularity but different predictive purposes (e.g., risk analysis vs. trend forecasting) identify different "real" patterns? Perspectivalism readily accommodates this.

  3.  **Ontological Relativity / Carnap's Linguistic Frameworks:**
      *   **Core Idea:** (W.V.O. Quine, influenced by Rudolf Carnap). What exists is relative to a chosen conceptual scheme or linguistic framework. Asking if entities like "recessions" or "forks" *really* exist is meaningless outside of the framework that defines them. Frameworks are chosen based on their overall utility and simplicity for our purposes. Carnap famously distinguished internal questions (within a framework, e.g., "Is *this* a recession?") which have answers, from external questions ("Do recessions *really* exist?") which are pragmatic choices about framework adoption.
      *   **Fits Your Cases:**
          *   **Framework Dependence:** The "recession" framework defines what counts as a recession. The "chess" framework defines what a fork is. The "time-series analysis with tolerance X" framework defines the smoothed pattern.
          *   **Utility/Pragmatics:** Frameworks are adopted based on their usefulness for prediction, compression, communication (e.g., economists agreeing on recession definitions, chess players on fork rules, analysts on smoothing algorithms).
          *   **"Real Within the Framework":** The pattern is undeniably real *once you adopt the framework*. The question of its "ultimate" reality is rejected as ill-formed.
      *   **Settled Aspect:** The distinction between internal/external questions and the pragmatic basis for framework choice are foundational in analytic philosophy.
      *   **Contentious Aspects:**
          *   **Radical Relativity:** Critics (e.g., Hilary Putnam, later Quine himself to some extent) argue this leads to an untenable relativism where incompatible frameworks are equally valid. Defenders argue it's simply acknowledging how language and science work.
          *   **Thin Realism?:** Does this allow for *any* robust sense of reality, or is it just a linguistic convention? Carnap aimed for a pragmatic realism within frameworks.
      *   **Edge Cases for You:** What happens when frameworks conflict? (e.g., two competing definitions of "recession"). Carnap/Quine would see this as choosing the pragmatically superior framework. It doesn't easily capture the idea that *within a single framework*, the pattern's reality depends on granularity/error tolerance – that feels like a parameter *within* the framework.

  4.  **Functional Kinds / Role-Functionalism:**
      *   **Core Idea:** Some entities are defined not by their physical constitution, but by the *function* they perform or the *causal role* they play within a system. A "fork" in chess is defined by its functional role: attacking two pieces simultaneously. A "recession" might be defined by its functional role in an economic system (sustained downturn impacting employment, investment, etc.). A "trend" could be seen as the functional role of capturing the dominant direction of change over a relevant timeframe.
      *   **Fits Your Cases:**
          *   **Multiple Realizability:** The exact low-level transactions (pixels, moves) don't matter, only the higher-level functional role.
          *   **Predictive Power:** Identifying the functional kind is crucial for prediction (knowing it's a fork tells you what moves are threatened; knowing it's a recession tells you likely policy responses).
      *   **Settled Aspect:** Functional kinds are widely accepted as legitimate in philosophy of mind, biology, and social sciences. Their reality isn't undermined by multiple realizability.
      *   **Contentious Aspects:**
          *   **Grain & Tolerance:** Functionalism itself doesn't inherently address *how coarse* the grain needs to be for the function to emerge, or the tolerance for error in identifying the functional state. Your focus on granularity adds a layer not always explicit in functionalist discussions.
          *   **Defining the System/Role:** The "system" (chess game, economy, time series analysis) and the specific "role" must be defined. This can be context-dependent.
      *   **Edge Cases for You:** Is a very noisy, ambiguous pattern that *partially* fulfills the functional role still an instance of the kind? How much deviation is allowed? Functional kinds often have fuzzy boundaries regarding realization, but the granularity dependence for *identification* is your specific emphasis.

  **Synthesis, Gaps, and a Suggested Path:**

  *   **Common Thread:** All these approaches grapple with how **useful, predictive, higher-level descriptions** relate to **lower-level physical reality** in a way that is **objective yet relative to context, scale, and purpose.** They reject both naive reductionism (only atoms are real) and radical constructivism (it's all just made up).
  *   **Your Unique Emphasis:** Your focus on **granularity/resolution and explicit error tolerance** as the *key parameters* determining the reality of the pattern is particularly sharp. While implied in Dennett ("stances" imply scale/purpose) and Perspectivalism (perspective includes scale), it's not always foregrounded. Carnap's frameworks are coarser-grained choices.
  *   **The "Real" Question:** The core *philosophical* disagreement underlying all this is: **Does the predictive utility/compressibility of the pattern, relative to grain and tolerance, warrant calling it *real* in a robust ontological sense, or merely *useful*?** Realists (Dennett, Ladyman & Ross, many Perspectivalists) say Yes. Critics (Eliminativists, Strict Reductionists, some Instrumentalists) say No, it's just a calculational shortcut. Pragmatists (like Carnap, perhaps Quine) sidestep the "really real" question as non-productive.

  **Recommendation:**

  1.  **Start with Dennett:** His "Real Patterns" paper (*Journal of Philosophy*, 1991) is the *locus classicus* most directly addressing your data analyst intuition about compression and prediction defining reality at a scale. Understand his argument and the Searle/Chalmers critiques.
  2.  **Explore Perspectival Realism:** Read Giere ("Scientific Perspectivism") or Massimi. This places your idea in a broader context of scientific observation and modeling.
  3.  **Consider Carnap/Quine:** For the linguistic/framework angle, Carnap's "Empiricism, Semantics, and Ontology" is foundational. Quine's "Ontological Relativity" develops it further.
  4.  **Coining a Term?** If you need a precise label *within your work*, consider something like **"Grain-Dependent Real Patterns" (GDRPs)** or **"Tolerance-Relative Ontic Structures" (TROS)**. Define it clearly:
      *   *"A GDRP is a pattern describable at level of abstraction L, with tolerance for error T, in a system S, such that descriptions positing the pattern enable significantly more accurate and efficient prediction of future states of S (relative to L and T) than descriptions that ignore it. The reality of the pattern is constituted by this predictive/compressional advantage within the (L, T, S) context."*
      *   **Edge Cases:** When does "significantly more accurate/efficient" become true? What if two different patterns offer identical predictive power at (L, T, S)? Does changing S (e.g., from "global economy" to "tech sector") change the reality of the recession pattern?

  **Conclusion:** Your noisy time series, chess fork, and low-res face are all compelling examples of a profound phenomenon: **real patterns constituted by their predictive robustness relative to a specific scale of description and tolerance for error.** Dennett's "Real Patterns" is the most direct philosophical articulation. Perspectival Realism provides a broader epistemological context. Ontological Relativity tackles the linguistic framing. Functional Kinds explain the role-based definition. There is no single, universally agreed-upon term because the underlying question – *how real are these useful patterns?* – remains a vibrant and contested frontier in metaphysics and philosophy of science. You are grappling with a genuinely deep and unresolved philosophical problem encountered daily in data analysis.
