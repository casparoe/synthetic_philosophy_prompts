prompt: |-
  For the past few months I have been trying to work out whether there is a genuine moral difference between lying and merely misleading someone with true statements, and rather than argue from theory I have been cataloguing my gut verdicts on concrete cases. I would like your help extracting the principle behind them, or a verdict that no coherent principle captures them all and some of my judgments must be abandoned.

  The cases and my verdicts:

  1. A lawyer, asked in settlement negotiations whether her client has a history of accounting fraud, answers that the client has never been found liable for accounting fraud, knowing that an enforcement action is currently pending. Not fine — this feels about as bad as a lie, and perhaps worse, because it is harder to call out.

  2. Asked at a party whether I smoke, I say that I have not touched a cigarette in years, though I vape constantly. Fine, or close to fine.

  3. A gate agent, asked whether the flight is leaving on time, says that it has not yet been cancelled, knowing it will be within the hour. Not fine.

  4. My child asks whether Santa Claus is real, and I say that Santa is as real as the spirit of giving. Fine.

  5. A friend asks whether the investment fund I am promoting is doing well, and I say that it outperformed the market last year, quietly selecting the one good year out of the last five. Not fine.

  6. A colleague asks whether I am seeing anyone, and I say I have been too busy with work to date, when in fact I have been in a relationship for three months and simply do not want office gossip. Fine, I think, though I cannot articulate why this does not collapse into case 5.

  7. When my aunt asks how I like the sweater she knitted, I say that the wool looks wonderfully soft. Fine.

  8. A used-car dealer asked whether the car is in good condition answers that it passed its inspection last month, knowing the transmission is failing. Not fine — and noticeably worse than case 2, though the two have the same shape.

  9. A realtor asked about damp answers that the house has been dry as a bone since she started listing it; she started two weeks ago, at the beginning of a dry spell, and the basement floods every winter. Not fine.

  I have also noticed something that complicates any theory I might have: a witness who lies on the stand in a way the jury plainly sees through still seems to me to have done something seriously wrong, which suggests that the wrongness cannot consist solely in a false belief actually being produced.

  My tentative principle is that the bad cases are the ones where the speaker profits from the resulting misunderstanding: the lawyer, the promoter, the dealer, and the realtor all stand to gain, whereas the vaper, the parent, and the sweater-recipient do not. But I can already see two problems with it. The gate agent in case 3 does not profit, yet I judge that case bad; and I profit in case 6 (I get my privacy), yet that case strikes me as fine.

  So my request is this. Test my profit principle against the cases, repair it or replace it, and state the resulting principle — or the best small set of candidate principles — precisely, with the case that motivates each clause. Then apply it to three cases I have not considered: a doctor who answers a patient's question about whether the scan results are serious by saying only that she will want to run further tests, when she already strongly suspects a terminal diagnosis; a politician whose campaign promise is phrased so that it is technically satisfiable by nearly any outcome; and a defendant's spouse who, asked directly whether the defendant was home on the night in question, says that they always stay home on weeknights, which happens to be false on that one night. Finally, tell me honestly which of my nine verdicts your principle cannot accommodate, and whether I should revise the verdict or the principle.
reasoning: |-
  Okay, the user has been grappling with the moral distinction between lying and misleading with truthful statements. They've cataloged nine specific cases with their gut reactions, and they're looking for a principle that explains these judgments. The user is clearly thoughtful and detail-oriented, having noticed nuances like the witness perjury example where the lie is transparent but still wrong. 

  Hmm... their initial "profit principle" fails because case 3 (gate agent) has no profit but feels wrong, while case 6 (privacy about relationship) involves personal gain but feels acceptable. This suggests the core issue isn't mere material gain. 

  Let me analyze their cases for deeper patterns. The problematic ones (1,3,5,8,9) all involve either: high-stakes contexts (legal/financial/safety), exploiting asymmetric information, or violating specific role duties. The acceptable ones (2,4,6,7) involve low-stakes social situations, protective intentions, or cultural conventions (like Santa). Interesting that case 6 feels okay despite gain - perhaps because privacy is a legitimate interest unlike financial exploitation.

  The witness perjury point is crucial. It shows the wrongness isn't just about successful deception but about the attempt to subvert a truth-seeking system. That points toward a "violation of epistemic duty" framework. 

  For their new cases: The doctor's evasion feels wrong because it violates medical transparency duties. The political promise is acceptable under social/political speech conventions. The spouse's statement is tricky - probably acceptable as protective loyalty despite formal deception, similar to their case 4. 

  Their verdicts mostly align with my proposed "violated expectation" principle except case 2 (vaping). If they see vaping as materially different from smoking, their "fine" judgment holds. If not, they might need to adjust either verdict or principle - but I'd argue the social expectation about "smoking" questions is contextually about tobacco. 

  The user seems intellectually honest - they'll appreciate me flagging where their judgments might need refinement (like case 2 consistency). The key insight is that morality here depends on what truthfulness the listener is entitled to in that context, not just factual accuracy.
answer: |-
  Based on your cases and the witness perjury observation, the "profit principle" is insufficient. Your judgments hinge on **contextual expectations of informational duty and the stakes of the misunderstanding**. Here's a principle refined to fit your verdicts:

  **The Violated Expectation Principle:**
  *Deception (by lie or truthful misleading) is morally problematic when:*
  1.  **The speaker has an explicit or strongly implied duty of candor** (e.g., professional roles, fiduciary responsibilities, formal inquiries); *or*
  2.  **The listener has a reasonable, context-specific expectation of receiving materially complete information** relevant to their likely needs or decisions; *and*
  3.  **The stakes of the misunderstanding are significant** (financial, safety, legal, major life choices).

  **Where the Principle Fits Your Cases:**

  1.  **Lawyer:** Strong duty of candor in legal negotiations (1), significant stakes (financial/legal) (3) → **Not fine.**
  2.  **Vaping:** No strong duty (casual party) (1), low stakes (social) (3), "smoking" often contextually means tobacco → **Fine.**
  3.  **Gate Agent:** Implied duty (service role providing travel info) (1), listener expects timely status (2), significant stakes (travel plans/time) (3) → **Not fine.**
  4.  **Santa:** No duty for literal truth here (cultural role) (1), listener (child) expects reassurance/magic (2), stakes low (harmless tradition) (3) → **Fine.**
  5.  **Investment Fund:** Strong implied duty when promoting (1), listener expects representative performance (2), significant stakes (financial loss) (3) → **Not fine.**
  6.  **Relationship Privacy:** No strong duty in casual social chat (1), listener's expectation of full personal disclosure is weak (privacy norm) (2), stakes low/moderate (personal comfort) (3) → **Fine.** (Gain isn't *unfair* exploitation).
  7.  **Sweater Compliment:** Social norm expects polite focus on positives (1 & 2), stakes very low (feelings) (3) → **Fine.**
  8.  **Car Dealer:** Strong duty (seller disclosing defects) (1), listener expects condition assessment (2), significant stakes (safety, cost) (3) → **Not fine** (Worse than 2 due to explicit role duty & higher stakes).
  9.  **Realtor:** Strong duty (seller disclosing known defects) (1), listener expects condition assessment (2), significant stakes (cost, habitability) (3) → **Not fine.**

  **Addressing the Witness Perjury:** The wrongness lies in the *intent* to deceive and the *violation of the oath/duty* (clause 1) within the truth-seeking system of the court, regardless of success. The act itself corrupts the process.

  **Applying the Principle to New Cases:**

  1.  **Doctor & Scan Results:**
      *   **Duty:** Strong explicit duty of candor (Hippocratic Oath, informed consent).
      *   **Expectation:** Patient reasonably expects material truth about their health.
      *   **Stakes:** Extremely high (life planning, treatment).
      *   **Verdict:** **Not fine.** Evasion violates core professional duty and patient trust regarding critical information.

  2.  **Politician's Vague Promise:**
      *   **Duty:** Vague duty (public trust), but political speech has known conventions of vagueness/puffery.
      *   **Expectation:** Voters reasonably expect *some* substance but are often skeptical; literal technical truth is a known political tactic.
      *   **Stakes:** High (governance), but expectations are complex.
      *   **Verdict:** **Potentially Fine (or less bad)** under this principle. While cynical, it exploits *known* ambiguities in political communication norms (weak clause 2). It may violate a *different* principle (good faith governance) but fits your deception focus.

  3.  **Spouse Alibi (False General Truth):**
      *   **Duty:** Strong personal/moral duty (marital loyalty?), but conflicting legal duty (truth to court?).
      *   **Expectation:** Questioner (e.g., police) expects a truthful answer to a direct question about a specific night. The general statement misleads.
      *   **Stakes:** Very high (legal consequences, justice).
      *   **Verdict:** **Not fine** under the principle. Violates duty of truthfulness in a formal inquiry (clause 1) and exploits a reasonable expectation (clause 2) about a specific event with high stakes (clause 3). Loyalty might explain but not justify the deception in this context.

  **Where Your Verdicts and the Principle Might Conflict & Recommendation:**

  *   **Case 2 (Vaping):** This is the most vulnerable. If someone argues "smoking" now *includes* vaping in common parlance, or that the health implications are similar enough, your "Fine" verdict might be challenged. The principle supports "Fine" based on weak duty, low stakes, and contextual interpretation of "smoke."
      *   **Recommendation:** *Stick with your verdict.* The contextual interpretation of "smoke" as meaning combustible tobacco in casual conversation is reasonable. Revising the principle to force "Not fine" here would break it for cases like 4, 6, and 7.

  *   **Case 6 (Relationship Privacy):** Your principle explains why the gain (privacy) isn't *unfair* exploitation like in cases 5, 8, or 9, due to the lack of duty and weak expectation of full disclosure in casual office chat.

  *   **Case 3 (Gate Agent):** The principle explains why the lack of *personal profit* doesn't matter. The duty (role-based) and reasonable expectation (timely status for travel plans) exist regardless.

  **Honest Assessment:**

  The **Violated Expectation Principle** accommodates your 9 verdicts remarkably well, providing a coherent explanation for why "gain" alone wasn't sufficient (Cases 3 vs. 6) and incorporating the witness perjury insight (duty violation). It highlights the crucial roles of:
  *   **Role-based duties** (Lawyer, Gate Agent, Dealer, Realtor, Doctor, Witness).
  *   **Contextual informational expectations** (Party chat vs. financial advice vs. flight status).
  *   **Stakes** (Santa vs. cancer diagnosis).

  **Conclusion:** Your gut judgments are largely coherent. The key moral difference isn't primarily *truth vs. lie* or *gain vs. no gain*, but rather the **breach of a contextual obligation to provide materially relevant information when the listener reasonably relies on it for significant decisions.** Abandoning Case 2 ("Vaping") is unnecessary; it fits within a nuanced understanding of conversational context and expectations. The principle offers a robust framework for evaluating future cases.
