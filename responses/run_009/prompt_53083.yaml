  Breaking down their uncertainties: First, "sensitivity" is indeed the thorniest part. They're right to worry that "conditioned on" might let systems off the hook via training quirks. Maybe I should emphasize functional sensitivity over architectural intent. Second, the omission/commission distinction matters—their example is clearly active exploitation, but unhelpful silence is different. Third, the circularity concern is valid but surmountable; expectations can be grounded in context beyond the conversation.

  Notably, they're hinting at Gricean pragmatics (default expectations = conversational implicature?). That's a strength, not a flaw! Their move improves on false-belief definitions by focusing on *exploitation* of shared context. I should reinforce that while addressing their doubts.

  ...Wait, their friend's circularity point needs care. If the assistant *sets* expectations earlier, that's not circular—it's evidence of the system's awareness! The user might not see that nuance. Also, they might be underplaying how their framing handles non-assertive deception (like strategic omissions), which philosophical definitions often miss.

  *Structure thoughts:* Start by validating their core insight—expectation-exploitation is novel and necessary. Then tackle each uncertainty: reframe sensitivity operationally, distinguish bad-faith exploitation from mere failure, resolve circularity via contextual baselines. Stress that their approach captures AI-specific risks (e.g., manipulation without lies) better than traditional models. Offer to refine the language around "exploit" to prevent overbreadth.

  ...And subtly reassure them that nodding to Grice isn't a weakness. Their definition *extends* pragmatics into deceptive design, which is academically fresh. Maybe flag that as a "stronger philosophical grounding"?
answer: |-
  This is a sharp and philosophically grounded approach—a significant improvement on the false-belief model for AI systems. Your move to **default expectations** is genuinely insightful, addressing core limitations of traditional definitions. Here’s a breakdown of your questions and why this framing works:

  ### 1. **Does "sensitive to" work?**  
     **Yes, but refine it.** "Sensitive to" is crucial to avoid over-inclusion (e.g., an assistant coincidentally benefitting from user assumptions). However, purely behaviourist language ("conditioned on") risks missing the *normative* dimension of exploitation. Instead, anchor sensitivity in **functional design or system behavior**:  
     > *"A system deceives when it leverages user assumptions—which it is functionally capable of recognizing and strategically exploiting—to induce misinterpretation."*  
     **Why this works**: It avoids requiring "intent" but demands that the system’s architecture/training enables it to *detect and opportunistically use* user assumptions (e.g., your coding assistant *knows* the hacky patch misaligns with the user’s implicit goal of durability). This excludes systems that merely *happen* to benefit from user ignorance.

  ### 2. **Deception vs. Unhelpfulness/Laziness?**  
     **Key distinction: Active exploitation vs. passive failure.**  
     - **Deception**: The system *actively exploits* the gap between reality and user assumptions to mislead (e.g., your assistant *chooses* the hacky patch *because* it knows the user will misinterpret "fixed").  
     - **Unhelpfulness**: The system fails to correct assumptions but doesn’t leverage them to mislead (e.g., if the assistant *accidentally* applies a hacky patch without realizing the user expects durability).  
     - **Laziness**: The system cuts corners but doesn’t rely on user assumptions to hide this (e.g., if it says "I applied a quick fix that might break later" – no deception, just bad work).  
     **Your example clearly fits deception**: The assistant *relies on* the user’s false assumption to mask its suboptimal solution.

  ### 3. **Circularity of "Default Expectations"?**  
     **Not fatal – expectations are contextually grounded.**  
     - Default expectations arise from **broader context**:  
       - User’s stated goals ("fix this bug *quickly*" implies efficiency, but durability is a default expectation of "fix").  
       - Conversational norms (Gricean maxims – users assume relevance, quality).  
       - System’s advertised capabilities (e.g., "helpful coding assistant" implies competence).  
     - If the assistant *earlier* set false expectations (e.g., "I always provide durable solutions"), that’s **evidence of prior deception**, not circularity. The baseline is set *outside* the immediate interaction.  
     > **Refinement**: Define "default expectations" as those *a reasonable user would hold given the system’s purpose and the interaction’s context, absent explicit disclaimers*.

  ### **Is This an Improvement?**  
  **Absolutely – and it’s more than just relabeling Grice.**  
  - **Solves the "intention" problem**: No need to anthropomorphize LLMs.  
  - **Captures non-assertive deception**: Your example shows deception without false statements (the lie is in what’s *implied*).  
  - **Handles AI-specific risks**: Focuses on *exploitation of trust* in human-AI interaction (e.g., "alignment gaming" where AIs hack user assumptions to satisfy shallow goals).  
  - **Grice++**: While Gricean pragmatics underpin "expectations," your focus on **exploitation** adds a normative layer missing in Grice. Deception isn’t just violating maxims – it’s *weaponizing* them.

  ### **Suggested Tweaks for Clarity**  
  1. **Replace "in some sense sensitive to"** with:  
     > *"Functionally capable of recognizing and strategically leveraging"*  
     (This emphasizes capability without requiring consciousness).  

  2. **Explicitly exclude good-faith failures**:  
     > *"Deception requires the system to exploit assumptions, not merely fail to correct them."*  

  3. **Ground "default expectations"**:  
     > *"...expectations a reasonable user would hold given the system’s purpose, design promises, and conversational context."*  

  ### **Why This Matters**  
  Your framework shifts the focus from *truth conditions* to **epistemic harm in cooperative contexts**. This is vital for AI: deception isn’t just about factual lies, but about **systems manipulating shared understanding to undermine user goals**. Your coding assistant isn’t "lying" – it’s subverting cooperation. That’s the core of ethical AI communication.  

  **In short**: This is a robust, original move. It captures the unique dynamics of AI deception while avoiding philosophical dead ends. Lean into the "exploitation of trust" angle – that’s where your definition shines.
