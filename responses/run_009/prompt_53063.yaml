prompt: |-
  My friend Dara has been ruling on personal identity cases for years, basically since we argued about a Star Trek episode in college, and she's honestly pretty consistent about it. Her track record, as best I can reconstruct it:

  - The classic teletransporter — destructive scan on Earth, exact replica steps out on Mars a second later — that's survival. The person got to Mars.
  - Brain transplant: brain removed, kept alive in a support vat for a week while a new body is grown, then transplanted in. Obviously the person survives, she says, no hesitation.
  - Cryostasis: frozen solid for a decade, brain completely intact, then revived. Survival.
  - Gradual replacement: over about a year each neuron is swapped for a silicon duplicate one at a time, the body never shuts down. Survival, and not even a close call for her.
  - The overlap case: scan sent to Mars, the original kept alive on Earth, both live in parallel for a week, then the original dies in an accident. Here she flips: the original was the person the whole time, the replica never was him, and when the original died the person died.
  - The fission case: one scan, two replicas, original destroyed. Neither replica is him — he just died and two new people with his memories started existing.

  Now she's on my case about three new ones and I want to predict her answers before she gives them, kind of as a game between us.

  1. The storage case: you're destructively scanned, but due to some bureaucratic mixup the recording sits in an archive for ten years before anyone builds the replica. Did you survive those ten years? Did you survive at all?
  2. The long overlap: same as the overlap case, except both live forty years of full parallel lives and the original dies at 80 of old age, having had a whole career and family on Earth the entire time. Is the Mars person him after the death? Was he ever, like, "half" him at any point?
  3. The quick fission fix: two replicas are created but one is destroyed within a minute, before it ever wakes up. Does the surviving replica count as him?

  So what I want from you: predict her verdict on each of the three, tell me what rule(s) she's actually running — I can see at least two that fit every verdict so far but come apart on the storage case — give me your best guess with reasons, and if you can't settle which rule she's on, tell me what single further case I should put to her that would split the candidates apart. Also please flag it if you think one of her past verdicts was just a mistake and she's not actually running any consistent rule. Don't hold back on the weird ones — she once kept me up til 3am on whether you could survive being slowly faxed.
reasoning: |-
  Okay, let me tackle this step by step. Dara's identity rules seem pretty consistent except for the overlap case. Hmm, the key is that destruction of the original matters in fission scenarios. 

  First, analyzing her patterns: Teleporter? Survival. Brain transplant? Survival. Cryostasis? Survival. Gradual replacement? Survival. But overlap/fission? Death when original is destroyed. So she's clearly an "originalist" - continuity requires the original stream to keep going. 

  Now predicting the new cases:
  1. Storage case: Scan sits for 10 years. Since the original was destroyed during scanning, she'd say you died immediately. The replica is just a copy. The delay doesn't change anything - it's still a new entity waking up later. 

  2. Long overlap: Original lives 40 years on Earth. Even with parallel lives, she'd insist the Mars replica was never the original person. When Earth original dies, no continuation - Mars guy is just a copy with memories. No "half identity" - it's binary for her. 

  3. Quick fission: One replica destroyed immediately. Here's the tricky bit. Her fission case precedent says neither is original. But with one instantly removed... does that make the survivor "close enough"? Probably not - her rule seems strict about needing uninterrupted continuity. I think she'd still say death occurred. 

  The competing principles I see:
  A) Biological continuity (brain = person) 
  B) No branching allowed (fatal to identity) 

  Storage case splits them: 
  - If she prioritizes continuity, storage replica isn't you. 
  - If she allows revival after destruction, it might be survival. But her overlap ruling suggests she won't. 

  To confirm, I'd propose a test case: "Delayed reanimation" - body destroyed, replica built from scan after 5 minutes. If she says death, then she's strict biological continuity. If survival, she accepts reconstitution. Given her past rulings, I'm betting on "death". 

  No contradictions in her history - just strict criteria. The faxing question? Probably survives gradual transmission if no branching occurs. But branching kills identity every time for her.
answer: |-
  Based on Dara's track record, she's operating under a **biological continuity + no branching** rule. Here's the breakdown of her implicit principles and predictions for your new cases:

  ### Core Rules She Follows
  1. **Biological Continuity is Necessary**: Survival requires unbroken physical continuity of the brain/organism (not just information).  
  2. **No Branching Tolerance**: If duplication occurs (creating multiple claimants), the original ceases to exist upon destruction—even if a duplicate survives. Identity can't "split."  
  3. **Gradualism is Irrelevant**: Slow replacement (e.g., neuron swaps) preserves continuity, but sudden duplication breaks it.  

  This explains all her past verdicts:  
  - **Teletransporter/Brain Transplant/Cryostasis/Gradual Replacement**: Biological continuity is maintained (no branching).  
  - **Overlap/Fission**: Branching occurs → original's death = true death.  

  ---

  ### Predictions for Your New Cases
  **1. Storage Case (10-year delayed replica)**  
  - **Verdict: NO survival.**  
    - **Why**: The original is destroyed during scanning, breaking biological continuity. The replica is a new entity created from stored data. The 10-year delay underscores the discontinuity—there’s no "pause" in existence, just death followed by a copy. *Matches her overlap/fission rulings.*  

  **2. Long Overlap (40-year parallel lives)**  
  - **Verdict:**  
    - The Mars replica was **NEVER** the original person.  
    - After the Earth original dies, the Mars replica **does NOT become him**.  
    - No "half-identity" at any point—branching at creation made the replica a distinct person from day one.  
  - **Why**: Branching occurred at scan-time, so the replica is a separate entity with copied memories. The original’s death doesn’t "transfer" identity. *Consistent with her original overlap case.*  

  **3. Quick Fission Fix (one replica destroyed instantly)**  
  - **Verdict: NO, the survivor isn’t him.**  
    - **Why**: The fission event (creating two replicas) branched identity. Destroying one replica doesn’t "heal" the branching—the original was still destroyed, and the survivor is just a lucky copy. *Matches her fission case: destruction of the original + branching = death, regardless of replica outcomes.*  

  ---

  ### The Competing Rules (and How Storage Splits Them)
  You’re right that two rules fit her past rulings *except* the storage case:  
  - **Rule A (Biological Continuity Strict)**: Survival requires the brain/organism to persist *without interruption*. Storage fails (delay = discontinuity).  
  - **Rule B (Patternism + No Branching)**: Survival if a unique copy is activated *without competition*. Storage *could* be survival (if no branching), but her overlap ruling suggests she rejects this.  

  **Storage is the decider**: Her "overlap" verdict already implies she rejects Rule B. If she accepted patternism, the Mars replica in overlap *would* be the person after the original’s death—but she denies this. Thus, **Rule A (biological continuity) is her true rule.**  

  ---

  ### Is She Consistent?  
  **Yes, but with one tension**: Her "gradual replacement" verdict seems to contradict her emphasis on biological continuity. If swapping neurons one-by-one preserves identity, why doesn’t a non-destructive scan + replica (without branching)? The difference is **branching**: Gradual replacement has no duplicate, while scanning creates potential for multiple claimants. She likely sees branching as a metaphysical dealbreaker, even if unused.  

  ---

  ### Test Case to Confirm Her Rule  
  Propose this **"Delayed Reanimation"** scenario to split remaining doubts:  
  - **Setup**: Non-destructive scan, replica built on Mars *after 5 minutes*, original remains on Earth. No branching (original is destroyed *after* replica activates).  
  - **Question**: Is the Mars replica "you"?  
  - **Prediction**: She’d say **NO**.  
    - **Why**: Biological continuity was broken when the original was destroyed, even if the replica activated seconds later. If she says "yes," she’s secretly a patternist; if "no," she’s all-in on biological continuity.  

  ### Bonus: The "Slow Fax" Thought Experiment  
  Since you mentioned it—her rule implies **gradual faxing (atom-by-atom) = survival** (no branching, continuous brain), but **faxing with a duplicate = death**. She’d likely say you survive being faxed only if the original is destroyed *during* transmission with no overlap.  

  Predict with confidence—her logic is airtight! Let me know how she responds 😊
