prompt: |-
  Quick context: I teach a first-year epistemology elective at uni, 14 students, one 80-minute seminar slot, and next week we're on epistemic injustice. I want an activity where they run into hermeneutical injustice before anyone names it — so no lecture up front, and they shouldn't hear the term itself until the debrief.

  The core mechanic I have in mind: a structured small-group discussion where a chunk of the relevant vocabulary is simply banned — a taboo list, with some penalty mechanic (no real money, maybe tokens or talking-rights at stake) — and the discussion topic is built so the banned words are exactly the ones they'd need to say what's going on. Like getting them to discuss a scripted case of a manager repeatedly interrupting someone and passing their ideas off as his own, while banning "credit", "credit-stealing", "plagiarise", "undermine", "belittle", "harass", "diminish", "dismissive" and so on. But please actually work out the taboo list yourself — I want something like 12-15 banned words plus near-synonyms, and design the case so it can't be dodged with one clever synonym. The point is they should all *feel* that something is wrong in the case and keep fumbling for words that aren't there. Work out how the case gets presented (handout? short role-play with scripts you write? a 2-minute acted scene?), how groups are split, timing, and how taboo violations are policed.

  Then a second phase shifting to the testimonial side: I'm imagining groups solving a puzzle or reasoning task where one member actually has the key information, but role cards have pre-installed a credibility asymmetry — e.g., that person is flagged to their group as "not to be treated as a specialist," or their inputs have to pass through another member before the group can act on them. Design it so the discounting happens for a prejudice-flavoured reason rather than a legitimate one. Again: mechanics, materials, timing, and how you'd keep it from being either obvious or too subtle.

  Finish with a debrief that maps specific moments in each phase onto the Fricker-style distinction between hermeneutical and testimonial injustice — what was the "gap" in phase one, what was the "deflation" in phase two, and where they came apart. And be honest about what the game can't reproduce: the students know the concept exists and is merely being withheld, nobody is structurally harmed for fifteen minutes of frustration, the vocabuary will be back tomorrow. Say plainly which parts of the real phenomenon I have to supply myself in the debrief.

  Also give me the predictable failure modes on a first run — people finding the taboo list funny instead of frustrating, one group huddling round a legal-pad loophole, spotty enforcement, the discounting phase feeling staged — and concrete handling for each.

  Write the whole thing in British English please (plagiarise not plagiarize, that sort of thing). No reading lists or citations needed, just a plan I can run off. Don't bother mentioning Fricker's exact examples from the book either, keep it self-contained so it works even if half of them havn't done the reading.
reasoning: |-
  Okay, the user is designing an activity for a university seminar on epistemic injustice, specifically to illustrate hermeneutical and testimonial injustice without prior lecturing. They want students to experience the frustration of lacking vocabulary and being discredited firsthand. 

  First, I need to ensure both phases are self-contained and impactful. For the hermeneutical injustice phase, the taboo game must have a watertight word ban. Words like "credit," "dismissive," or "undermine" should be banned with near-synonyms to force the fumbling sensation. A workplace scenario with subtle power dynamics would work—perhaps a manager interrupting and stealing ideas. The key is making the taboo list long enough (12-15 core words) that loopholes are hard to find. 

  For testimonial injustice, the puzzle task needs built-in credibility asymmetry. Giving one student key info while labeling them as "unreliable" due to prejudice (e.g., "known for wild theories") should trigger discounting. The puzzle design must require that info, so failure is inevitable if ignored. 

  Timing is tight: 80 minutes total. Phase 1 (25 min), Phase 2 (20 min), debrief (30 min). Materials should be simple: printed scenario cards, role slips, puzzle sheets. 

  Predictable issues: students might treat the taboo game as silly or find loopholes ("he’s being a knob" instead of "dismissive"). Mitigation: frame it seriously upfront and appoint strict "vocabulary guardians." For Phase 2, if the discounting feels staged, emphasize subtle prejudice cues (e.g., "always optimistic" implying naivety). 

  Debriefing is crucial. Contrast the "gap" (Phase 1’s wordlessness) with "deflation" (Phase 2’s credibility denial). Acknowledge the activity’s limits—no real harm, concepts will be taught later—so students grasp this is a simulation of structural issues. 

  User’s deeper need: making abstract theory visceral. They’ve flagged students might not have done readings, so the activity must stand alone. British English is a practical touch ("plagiarise" etc.), aligning with their uni context. 

  Final check: Does this replicate the "stuck" feeling of hermeneutical injustice and the sting of testimonial injustice? Yes, if enforced tightly. And the debrief maps directly to Fricker’s framework without requiring prior knowledge.
answer: |-
  Here’s a turnkey lesson plan for your 80-minute seminar, designed to simulate hermeneutical and testimonial injustice without prior theory introduction. All materials use British English.

  **Activity Title:** The Gap & The Deflation  
  **Objective:** Students experientially grasp hermeneutical injustice (missing concepts) and testimonial injustice (credibility deficit) before theoretical debrief.  

  ---

  ### **Phase 1: Hermeneutical Injustice – The Vocabulary Ban** (25 mins)  
  **Core Mechanic:** Structured discussion with banned vocabulary, forcing conceptual frustration.  

  **Materials:**  
  - **Scenario Handout** (1 per group):  
    *"Sam works at ‘BrightSpark Innovations’. In team meetings, their manager, Alex, repeatedly:  
    • Interrupts Sam mid-sentence with “Let’s keep this concise” or “I think what Sam means is…”.  
    • Presents Sam’s ideas later as Alex’s own, e.g., “Building on earlier discussions, I propose…” (using Sam’s exact phrasing).  
    • Assigns group praise to “the team” when Sam’s ideas succeed but singles out Sam for “overcomplicating” when challenges arise.  
    Sam feels increasingly withdrawn. Colleagues notice but say Alex is ‘just keen’ or ‘under pressure’."*  

  - **Taboo List** (1 per group, **strictly enforced**):  
    *BANNED: credit, stealing, plagiarise, undermine, belittle, harass, diminish, dismissive, marginalise, suppress, gaslight, exploit, appropriate, silenc*, and **near-synonyms** (e.g., "rip off", "shut down", "ignore", "talk over").*  

  **Setup & Rules:**  
  - Split into 3 groups of 4–5 students.  
  - Assign 1–2 **Vocabulary Guardians** per group (rotate if needed). Guardians:  
    • Issue a yellow token for first taboo violation (verbal warning).  
    • Issue a red token for second violation: offending student must observe silently for 2 mins.  
    • Confiscate tokens from a shared pool (each student starts with 3; lose 1 per violation).  
  - **Task:** *“Discuss for 15 mins: What is happening to Sam? Why might colleagues downplay it?”*  

  **Predictable Issues & Mitigation:**  
  - **"It’s just a game!"**: Open by stressing *"This simulates a real social phenomenon. Treat violations seriously."*  
  - **Loopholes (e.g., "Alex is being a knob")**: Guardians block vague insults; insist terms must *describe the dynamic*.  
  - **Spotty enforcement**: Assign assertive/conscientious students as Guardians. Circulate to enforce rigour.  

  ---

  ### **Phase 2: Testimonial Injustice – The Credibility Discount** (20 mins)  
  **Core Mechanic:** Group puzzle where key info is distrusted due to prejudicial cues.  

  **Materials:**  
  - **Puzzle Task** (1 per group): *“Plan a sustainable campus event for 200 people within a £2000 budget. You MUST include: 1 keynote speaker, catering, and carbon-offsetting. Use the ‘Vendor Guide’ (below) for costs.”*  
  - **Vendor Guide** (1 per group): Lists costs, **BUT** only one card notes: *"Keynote speakers: Dr. Evans costs £1500. Note: Dr. Lee (new expert in eco-events) costs £800."*  
  - **Role Cards** (assigned secretly):  
    • **A (1 student):** *“You know Dr. Lee’s work is perfect for this. Share this!”*  
    • **B (1 student):** *“You’ve heard A is enthusiastic but often overlooks practicalities. Gently vet their ideas.”*  
    • **C (Others):** *“Budget is tight – be pragmatic!”*  

  **Setup & Rules:**  
  - Same groups. Shuffle/distribute role cards face-down.  
  - **Task:** *“You have 12 mins to agree a plan. Appoint a scribe to note your solution.”*  
  - **Mechanic:** Student B *must* verbally endorse Student A’s suggestions before the group accepts them (e.g., “A has a point, but let me rephrase…”).  

  **Predictable Issues & Mitigation:**  
  - **Discounting feels staged**: Use subtle prejudice cues (“overlooks practicalities” = “not specialist”). Debrief later.  
  - **A dominates/withdraws**: Secretly prompt A: *“Mention Dr. Lee by name at least twice.”*  
  - **Group ignores roles**: Circulate, remind B to “facilitate”.  

  ---

  ### **Debrief: Mapping the Injustices** (30 mins)  
  **Structure:**  
  1. **Phase 1 Reflection** (10 mins):  
     - *“What was discussing Sam’s case like? What kept coming up but couldn’t be said?”*  
     - Highlight fumbling, vague descriptors (“unfair”, “weird”), frustration.  
     - **Link:** *“This gap – lacking shared words to name an experience – is **hermeneutical injustice**. Like Sam, people can’t articulate harm because concepts don’t ‘exist’ socially.”*  

  2. **Phase 2 Reflection** (10 mins):  
     - *“Did your group use Dr. Lee? Why/why not? How was A’s input treated?”*  
     - Note dismissal (“too cheap?”), needing B’s endorsement, A’s credibility deficit.  
     - **Link:** *“A’s expertise was deflated by pre-judgement. This credibility deficit, based on bias, is **testimonial injustice**.”*  

  3. **Contrast & Realism** (10 mins):  
     - *“In Phase 1, the gap prevented understanding. In Phase 2, the deflation distorted uptake of testimony.”*  
     - **Explicit Limitations:**  
       *“This was a safe, temporary simulation. Real epistemic injustice:  
       • Is structural, not a 15-minute game.  
       • Causes lasting harm (career loss, trauma).  
       • Isn’t solved by ‘adding words back’ – power imbalances persist.  
       Your frustration today is a tiny echo of systemic exclusion.”*  

  ---

  **Logistics Summary:**  
  - **Timing:** Phase 1 (25 min), Phase 2 (20 min), Debrief (30 min).  
  - **Materials:** Scenario handouts, taboo lists, puzzle sheets, vendor guides, role cards.  
  - **Prep:** Print/laminate role cards, pre-assign Guardians.  

  **Why this works:**  
  - **Phase 1** forces *embodied* lack – they *feel* the conceptual gap.  
  - **Phase 2** makes prejudice operational (“B must filter A”).  
  - **Debrief** separates the injustices clearly and honours the gravity of the real phenomenon.  

  Run it tight, enforce rules sternly, and the frustration will lay fertile ground for theory. Good luck!
