prompt: |-
  I'm a psych PhD student working on moral disengagement, and at a lab social last night we somehow got onto Hannah Arendt's banality of evil thing. The way I've always understood it, her claim in Eichmann in Jerusalem is basically that Eichmann did what he did *because* he was thoughtless — the bureaucracy switched off his conscience, he just processed orders without ever reflecting on them, and the horror came out the other end. So in my head Arendt is kind of a precursor to Milgram: an argument that ordinary psychological machinery, not monsterous character, produces atrocity. My advisor (a political theorist I share a student with) says I'm mangling her, though she was three glasses of wine in and wouldn't elaborate.

  Here's where I actually get stuck: if Arendt really diagnosed Eichmann as a cog who'd lost the capacity for moral reflection, wasn't her position more or less that he was less culpable — like, at minimum he deserved a lighter sentence, and maybe trying him at all was a category error, since someone whose conscience just doesn't fire is closer to sick than guilty? I've also seen people say she thought the "just following orders" defense deserved to be taken seriously in his case. But I dimly remember hearing that she actually endorsed the death sentence, which would seem to flatly contradict the thoughtlessness reading? Basically: does the banality thesis function as an explanation that mitigates his guilt, as an excuse, or as something else entirely? And is it meant as a general theory of evildoers (evil people are mostly banal) or just a claim about this one guy? Would love someone to untangle what she actually argued, because my psych framing and my advisor's reaction clearly can't both be right.
