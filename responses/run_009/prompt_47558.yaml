  The user has provided very specific instructions: I need to create a joint statement with numbered sections of claims both would accept, a disagreements table, cruxes with the human chin as an example, and evidence both sides would agree bears on each crux. I also need to address whether parts of the dispute are merely verbal versus substantive.

  I'll start by recalling the core positions. Adaptationists believe natural selection is the primary driver of complex functional traits and that assuming adaptation is a productive starting hypothesis. The Gould-Lewontin spandrels critics argue that adaptationists often overreach by attributing traits to selection when they might be byproducts, constraints, or historical accidents.

  For the joint statement, I'll need to find common ground first. Both sides likely agree on the importance of natural selection, the existence of non-adaptive traits, and that the spandrels analogy illustrates how traits can arise as side effects. They'd probably concur that "just-so storytelling" is a methodological concern rather than invalidating all adaptationist claims.

  For the disagreements table, I'll highlight differences in how each side views the default assumption for traits, the burden of proof, and the value of assuming adaptation as a heuristic. The adaptationist would want wording about selection being the "primary" explanation, while the spandrels advocate would emphasize "contingency" and "pluralism."

  The cruxes section is crucial. Using the human chin as an example: the spandrels side sees it as a structural byproduct, while adaptationists consider it a potential object of selection. Both would agree that developmental biology evidence (like gene expression patterns) and comparative genomics could bear on this. For complex traits like music or depression, they'd differ in their predictions about signatures of positive selection.

  On the verbal/substantive distinction: I think the debate over "adaptationism" as empirical claim versus heuristic strategy is partly verbal - both sides might agree on the heuristic value while disagreeing on how often traits actually are adaptations. The substantive disagreement is about the actual frequency of adaptations versus non-adaptive explanations in nature.

  I'll structure this carefully: starting with the joint statement, then the disagreements table, followed by the cruxes with evidence, and ending with the verbal/substantive analysis. For the chin example, I'll be specific about what evidence each side would predict. I need to make sure everything is framed in neutral, academic language that both sides could genuinely endorse.
answer: |-
  **Joint Statement: On Productive Inquiry into Evolutionary Explanations**

  **Section 1: Points of Agreement**

  1.  **Centrality of Natural Selection:** Natural selection is the only known evolutionary process capable of generating complex functional organization and adaptation. It is a powerful, indispensable force explaining the fit between organisms and their environments.
  2.  **Existence of Non-Adaptive Traits:** Not all features of organisms are adaptations. Evolution produces traits that are byproducts of developmental or structural constraints, consequences of phylogenetic history, results of genetic drift, or simply neutral variations with no significant functional consequence.
  3.  **Value & Limitation of the Spandrels Analogy:**
      *   **Does Show:** Effectively demonstrates that complex, integrated systems can generate features (like spandrels) that are *necessary architectural consequences* of prior adaptations or structural constraints, *without* being direct targets of selection themselves. It highlights the importance of considering organismal integration and developmental pathways.
      *   **Does Not Show:** That adaptations do not exist, that natural selection is unimportant, or that *all* complex traits are spandrels. It is an argument against *premature* adaptationist accounts and for methodological caution, not a refutation of adaptationism per se.
  4.  **"Just-So Story" as Methodological Critique:** The charge of "just-so storytelling" is primarily a *methodological* complaint. It targets the practice of constructing plausible, but insufficiently tested, adaptive narratives based on current utility alone, without rigorous consideration of alternatives or evidentiary support. It does *not*, in itself, refute any specific adaptive hypothesis that *is* well-supported by evidence. Both sides agree that adaptive hypotheses require robust empirical testing against viable alternatives.
  5.  **Necessity of Pluralism:** A complete understanding of evolution requires consideration of multiple evolutionary forces (selection, drift, mutation, migration) and levels of analysis (genetic, developmental, organismal, phylogenetic).
  6.  **Heuristic Value *and* Risk:** Assuming adaptation as a *starting point for investigation* can be a productive heuristic, generating testable hypotheses. However, this approach carries the inherent risk of biasing research towards adaptive explanations and potentially overlooking non-adaptive alternatives if not applied critically.

  **Section 2: Key Disagreements (Wording Acceptable to Each Side)**

  | Disagreement Area          | Adaptationist Wording                                                                 | Spandrels Advocate Wording                                                                 |
  | :------------------------- | :------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------- |
  | **Default Stance**         | In the absence of specific contraindications, the *first and primary* hypothesis for the origin of a trait, especially one exhibiting apparent complexity or function, should be that it is an adaptation produced by natural selection. | While adaptive hypotheses are essential, the *default assumption* should be one of *contingency*; traits arise through a complex interplay of selection, constraint, history, and chance, and an adaptive origin is but one possibility requiring demonstration. |
  | **Burden of Proof**        | The burden lies primarily on those proposing *non-adaptive* explanations (byproduct, constraint, drift) to demonstrate why a plausible adaptive hypothesis is inadequate or impossible. | The burden lies primarily on those proposing an *adaptive* explanation to rigorously test it against plausible non-adaptive alternatives using independent evidence, not merely plausibility. |
  | **Scope of Adaptation**    | Natural selection is responsible for the *overwhelming majority* of complex functional traits in nature; non-adaptive explanations are significant but apply to a *minority* of cases, often involving simpler features or specific contexts. | While selection builds adaptations, non-adaptive factors (constraints, history, byproducts, drift) play a *far more substantial and pervasive role* in shaping organismal form than often acknowledged, influencing even complex traits. |
  | **Heuristic Primacy**      | The adaptationist heuristic is *uniquely powerful* and *the most productive starting strategy* for evolutionary biology, as it directly targets the engine of complex design. | While useful, the adaptationist heuristic is *not uniquely privileged*; approaches focusing on development, constraint, or phylogeny offer equally valid and often necessary starting points that can mitigate bias and lead to novel insights. |

  **Section 3: Cruxes and Evidential Tests**

  *   **Crux 1: Can we classify traits (e.g., the human chin) as adaptation/byproduct/drift *before* direct evidence of selective history?**
      *   **Adaptationist Stance:** Yes, plausibly. The chin's structural prominence and variation make it a *candidate* for an adaptive explanation (e.g., sexual selection, biomechanical reinforcement). Its status as a "byproduct" of jaw reduction is a hypothesis requiring testing against adaptive alternatives; it shouldn't be the default conclusion without evidence *against* selection.
      *   **Spandrels Advocate Stance:** Tentative classification *can* favor non-adaptive origins based on developmental necessity and lack of obvious function. The chin is a *prime candidate* for a structural byproduct of differential growth fields in the mandible. Calling it an adaptation without evidence *for* specific selection is the overreach.
      *   **Agreed Evidence:**
          *   **Developmental Biology:** Detailed analysis of gene expression, signaling pathways, and growth dynamics during mandibular development. Does the chin emerge predictably as a direct consequence of developmental processes shaping other functional jaw components, with minimal independent developmental control? (Spandrels predicts strong evidence for this; Adaptationist predicts potential for independent modulators).
          *   **Comparative Genomics (Population Genetics):** Analysis of genetic variation and potential signatures of selection around genes influencing chin morphology in human populations. Are there signals of recent positive selection? (Adaptationist predicts plausible signals exist; Spandrels predicts weak or absent signals inconsistent with strong selection).
          *   **Functional Biomechanics:** Rigorous testing of biomechanical advantages (e.g., stress resistance) conferred by different chin shapes under relevant loads (biting). Does variation correlate with demonstrable performance differences? (Adaptationist predicts measurable advantages; Spandrels predicts minimal functional consequence).
          *   **Fossil Record/Comparative Anatomy:** Tracing the emergence of the chin in hominin evolution alongside other cranial/jaw changes. Does its appearance correlate tightly with other changes suggestive of a developmental byproduct, or does it appear/modify independently? (Spandrels predicts tight correlation; Adaptationist predicts potential for decoupled evolution).
      *   **Agreed Standard:** A "byproduct" verdict requires more than a label; it requires evidence of the *specific developmental or structural necessity* linking the trait's form to the primary adaptation/constraint, and evidence *against* its independent modification by selection or significant functional advantage. Conversely, an "adaptation" verdict requires evidence *for* function and *for* modification by selection, beyond plausibility.

  *   **Crux 2: Frequency of Selection Signatures for Complex Traits (e.g., Music Aptitude, Chronic Depression)**
      *   **Adaptationist Prediction:** Comparative genomic studies (scanning for signatures of recent positive selection) will find such signatures associated with a *substantial proportion* of complex, species-typical human traits like music aptitude or emotional regulation systems (even if depression itself is a dysregulation, the underlying capacity might be shaped by selection). Non-adaptive explanations will dominate for simpler, non-functional, or highly variable traits.
      *   **Spandrels Advocate Prediction:** Comparative genomic studies will find signatures of recent positive selection associated with *only a minority* of such complex traits. Many will show patterns consistent with neutral evolution, balancing selection maintaining variation, or reflect underlying developmental/neurological constraints and byproducts. Non-adaptive factors will explain a *majority* of the genomic and phenotypic landscape, even for complex features.
      *   **Agreed Evidence:** Large-scale, well-powered genome-wide scans for signatures of positive selection (e.g., reduced diversity, extended haplotype homozygosity, population differentiation) in humans and closely related primates, specifically targeting genomic regions associated with the development and function of complex traits like music processing or mood regulation. Requires careful trait definition and control for demography.
      *   **Agreed Standard:** The relative frequency of clear selection signatures vs. patterns consistent with neutrality/constraint/balancing selection across a broad set of well-defined complex traits will be a key empirical arbiter of the *relative scope* of selective vs. non-selective explanations for complex phenotypic features.

  **Section 4: Verbal vs. Substantive Disagreements**

  *   **Primarily Verbal Disagreement:** The core dispute over defining "adaptationism."
      *   The Spandrels Advocate often hears "adaptationism" as the *empirical claim* that "the vast majority of traits are adaptations."
      *   The Adaptationist often intends "adaptationism" as the *methodological heuristic* that "assuming adaptation is the most productive initial research strategy for understanding complex traits."
      *   **Resolution Potential:** Both can agree that the methodological heuristic is valuable but carries risks of bias (Agreement Point 6). They can further agree that the *empirical frequency* of adaptations vs. non-adaptive traits is an open question requiring evidence (Crux 2), distinct from the value of the heuristic. Much heat stems from conflating these two meanings.

  *   **Primarily Substantive Disagreements:**
      1.  **The Empirical Frequency:** What is the *actual proportion* of traits (especially complex ones) in nature that are direct adaptations vs. byproducts/constraints/drift? (Crux 2 directly addresses this).
      2.  **Default Stance & Burden of Proof:** Should the starting assumption lean towards adaptation (requiring non-adaptive proposals to disprove it) or towards contingency/pluralism (requiring adaptive proposals to prove themselves against alternatives)? (Disagreement Table).
      3.  **The Power of Constraints/Byproducts:** To what extent do developmental constraints, architectural byproducts, and historical contingency *actively shape and limit* the potential outcomes of evolution, even for functional complexes? The Spandrels Advocate sees these as fundamental, creative, and constraining forces; the Adaptationist sees them as boundary conditions within which selection operates as the primary creative force.
      4.  **Classification Prior to Evidence:** How much weight should be given to developmental logic vs. functional plausibility when tentatively classifying traits like the human chin *before* definitive selective history is known? (Crux 1).

  **(Reflections on Drafting Challenges):**
  *   **Balancing "Committed" Views:** Phrasing agreements strong enough to be meaningful but not so strong they misrepresent either "committed" position required careful wording (e.g., Agreement 1 & 2, Disagreement Table wording).
  *   **The Chin Example:** Making the "byproduct" case concrete beyond just labeling it was crucial. Specifying the developmental link (differential jaw growth fields) and the agreed evidentiary standard for a non-adaptive verdict addresses the Spandrels concern about substance.
  *   **Frequency Crux:** Defining "complex traits" operationally for genomic scans remains a challenge, but both sides accept the *principle* that genome-wide data on selection signatures vs. other patterns is a key test for the *scope* of adaptation.
  *   **Verbal/Substantive Split:** Explicitly separating the empirical frequency claim from the methodological heuristic claim felt essential to reducing unnecessary contention. The Adaptationist often embraces the heuristic but might privately hold a range of views on the empirical frequency, while the Spandrels critique is fundamentally aimed at perceived empirical overreach *enabled* by the heuristic.
