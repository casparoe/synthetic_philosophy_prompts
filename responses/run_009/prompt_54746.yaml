answer: |-
  Here’s a practical music selection procedure for your hospice team, based on Schopenhauer’s distinction between representational and direct musical effect. The goal is to quickly identify pieces that work *directly* through tension/resolution patterns vs. those relying on lyrics/story/associations. Use this **5-minute checklist**:

  ---

  ### **Hospice Music Selection Checklist**  
  *(Answer in order; stop if any "STOP" condition is met)*

  1. **DOES THE PIECE DEPEND ON LYRICS/STORY?**  
     - *Ask:* "Would this lose meaning if played wordlessly?"  
     - **If YES → STOP: Defer to patient/family request.**  
       *Why:* Schopenhauer sees text as "representation" — its power relies on the listener’s personal/cultural associations.  
     - **If NO → Proceed to Q2.**  

  2. **DOES THE HARMONY RESOLVE CLEARLY?**  
     - *Ask:* "Does it end with a sense of arrival (e.g., V-I cadence)? Or does tension linger?"  
     - **If NO RESOLUTION → Avoid for anxious/agitated patients.**  
       *Why:* Unresolved harmony may amplify unrest (direct effect).  
     - **If CLEAR RESOLUTION → Proceed to Q3.**  

  3. **IS THE PRIMARY EFFECT SETTLING (not agitating)?**  
     - *Ask:* "Does the tempo/dynamics/rhythm feel calming (e.g., slow tempo, even pulse)?"  
     - **If AGITATING → Avoid unless patient seeks catharsis (use judgment).**  
     - **If SETTLING → Proceed to Q4.**  

  4. **IF SAD, IS THE SADNESS CATHARTIC?**  
     - *Ask:* "Does the sadness feel 'completed' (e.g., minor key with resolved phrases)? Or is it raw/distressing?"  
     - **If DISTRESSING → Avoid near death/for fragile patients.**  
     - **If CATHARTIC → Strong candidate for direct effect.**  

  ▶️ **WHEN TO DEFER TO PATIENT PREFERENCE:**  
  - **Always** if Q1 = YES (lyrics/story essential).  
  - **Always** if patient has a strong emotional connection to a piece, even if the checklist advises against it.  

  ▶️ **WHAT THIS CAN’T DO:**  
  - **Override patient love.** If a piece is deeply meaningful, play it — even if theoretically "unsuitable."  
  - **Predict personal associations.** A "resolved" piece may still trigger grief if tied to a memory.  
  - **Replace clinical judgment.** Watch the patient’s breathing/expression and adjust.  

  ---

  ### Worked Examples  

  **Case 1: Dying woman requests church hymns (sung with words)**  
  - **Q1:** YES (hymns rely on lyrics/religious meaning).  
  - **→ STOP. Defer to request.**  
    *Reasoning:* This is "representational" art. Power comes from her life associations, not musical structure.  

  **Case 2: Non-religious man near death; suggested Mahler’s Adagietto (Symphony No. 5)**  
  - **Q1:** NO (no lyrics; works instrumentally).  
  - **Q2:** YES (resolves gently in final chords).  
  - **Q3:** YES (slow tempo, soft dynamics).  
  - **Q4:** SAD but CATHARTIC (melancholy flows toward resolution).  
  - **→ PLAY, with caution:**  
    *Reasoning:* Strong direct effect through resolution/settling. *But:* Monitor closely — its depth may overwhelm some.  

  **Case 3: Anxious patient at 3 AM; musician proposes Bach’s C Major Prelude (WTC Book 1)**  
  - **Q1:** NO (no text/story).  
  - **Q2:** YES (arpeggios create gentle tension resolved in each cadence).  
  - **Q3:** YES (steady pulse, moderate tempo).  
  - **Q4:** NEUTRAL (not overtly sad).  
  - **→ PLAY, even if musician dislikes it:**  
    *Procedure overrides personal taste:* The piece’s harmonic motion (constant resolution) directly reduces agitation.  

  ---

  ### Key Takeaway for Your Team  
  **Use this tool to:**  
  - Quickly veto pieces that *risk agitation* for fragile patients (e.g., unresolved harmonies).  
  - Identify "direct effect" pieces for when patients lack requests or need grounding.  
  **Override the tool when:**  
  - A patient *loves* a piece (even Mahler for an anxious person).  
  - Cultural/religious meaning is central (e.g., hymns, folk songs).  

  The procedure doesn’t make philosophers of your musicians — it turns abstract insight into actionable filters. When in doubt, "What does the patient need *now*?" trumps all theory.
