prompt: |-
  I chair a monthly review commitee at a mid-sized logistics company where we decide which internal projects keep getting funded and which get killed. Think software migrations that are two years late, a rebrand that's half rolled out, a warehouse automation pilot eating money — you know the type. The problem is that every month, the person running each project shows up and argues that they're 70% done and it'd be a waste to stop now, and every month we nod along and approve another tranche. I've read enough pop-management stuff to know "sunk cost fallacy, just ignore sunk costs, next question" but I've also started to suspect that advice is too glib, and here's why: I once read about the dollar auction, where the top bidder wins the prize but the *second* bidder also has to pay their bid and gets nothing. The nasty part is that at every point after you're in second place, bidding a bit more is actually the cheaper move compared to eating your loss and walking away — it's locally rational to keep going even though the whole sequence is ruinous. That maps onto our projects uncomfortably well: when we've sunk 2 million into a migration, "one more quarter" often genuinely looks better than abandoning it, and I don't think the standard sunk-cost lecture captures that. The trap isn't just bias, it's structure.

  So what I want is a real procedure my committee can actually run in a 20-minute slot per project, written so the least philosophical person in the room can follow it. Please base it on whatever escalation-of-commitment research and the dollar-auction logic actually support, not just vibes. Specifically I'd want it to cover: (a) questions that separate "this is genuinely 70% done and the last 30% is cheap" from "this is the auction talking"; (b) some way to handle the fact that the local-rationality trap means we can't trust our own month-to-month judgements — maybe pre-commitment devices or reframing what's on the table at each decision point, you decide what's actually workable; (c) where the procedure has to stop and hand it to human judgement because it's a values question, not a facts question; and (d) it should be honest about where it will misfire, e.g. projects that get killed and restarted later at higher cost.

  Then run it on three cases: the warehouse software migration that's 70% "done" (the vendor says the last 30% is always the hard 30%), a modest rebrand that is on budget and on time but where nobody can articulate what the rebrand is *for*, and a case where the procedure should say keep going even though the gut says kill it — I want at least one of the three to come out as an answer I won't like, because otherwise I won't trust the thing.

  Please write the whole answer in British English, and keep it usable — I'm going to print it and put it in front of five tired people with a spreadsheet.
reasoning: |-
  Okay, let me tackle this logistics committee chair's problem. They're stuck in a classic dollar auction trap with their project reviews - every month teams claim they're 70% done and get more funding, even when projects are clearly failing. 

  The user's frustration is palpable - they've read the sunk cost theory but found it doesn't match reality. That dollar auction analogy is spot on: when you've already sunk £2m into something, walking away feels worse than throwing good money after bad. I need to give them something more nuanced than textbook economics.

  First, I should acknowledge their insight about structural traps versus cognitive bias. The committee isn't just being irrational - they're in a system that punishes stopping. Any solution must address that incentive problem. 

  For the procedure itself, I'm considering building in three defenses:
  1) Mandatory pre-mortems at funding approval to surface risks early
  2) A "commitment horizon" requiring teams to define upfront what "done" looks like
  3) Forcing functions like hard checkpoints where projects get cut unless they prove viability

  The three test cases will show how this works:
  - The warehouse migration likely fails because "70% done" is meaningless without defined deliverables
  - The rebrand gets killed despite being on track because it lacks purpose
  - The counterintuitive "keep going" case would be something like regulatory compliance where stopping has catastrophic costs

  I'll use British English throughout - "tranche" instead of "chunk", "whilst" not "while". The tone must stay pragmatic for exhausted committee members. Most importantly, I'll include where the system can misfire, like killing projects that could be salvaged. Brutal honesty builds credibility.

  The key is making the procedure feel inevitable rather than personal. If the spreadsheet flags red, it's the system talking - not the chair being harsh. That should reduce defensive reactions in meetings.
answer: |-
  ## Project Continuance Review Protocol (PCRP)  
  *For Mid-Sized Logistics Company Committee Use*  
  *Version 1.0 | Based on Escalation-of-Commitment Research & Dollar-Auction Mechanics*  

  **Core Principle:** Treat every funding request as a *new* investment decision. Past spending is irrelevant except as evidence of competence. The trap isn’t emotion—it’s the *structure* of sequential decisions making "one more tranche" always seem cheaper than writing off sunk costs. This protocol forces holistic re-evaluation.  

  ---

  ### THE PROCEDURE (20 mins/project)  
  **Step 1: The Reset (2 mins)**  
  *Chair states:* "We disregard all prior spend. We are investors considering whether to fund this project *from scratch today*, given current knowledge. Project Lead: What is the *minimum* cash and time needed to reach a usable outcome?"  
  *Output:* Fresh "Time to Value" (TtV) and "Cost to Complete" (CtC) estimates.  

  **Step 2: The "70% Trap" Interrogation (5 mins)**  
  *Ask sequentially (use template below):*  
  1. **"Define 'Done':** What *specific, measurable outcomes* constitute 100%? List them."  
  2. **"The 30% Autopsy:** Of remaining work, what % is:  
     - *Unavoidable complexity* (e.g., legacy system integration)?  
     - *Known unknowns* (e.g., vendor API limitations)?  
     - *New scope* added since initiation?"  
  3. **"Sunk Cost ≠ Evidence:** What have we *learned* from past spend that reduces risk/uncertainty in the CtC? *Concrete examples only.*"  
  4. **"Walkaway Value:** If killed today, what tangible assets (code, kit, contracts) can be *repurposed or sold*? Quantify."  

  **Step 3: Pre-Commitment Check (3 mins)**  
  *Chair references:* "At project start, the sponsor defined [pull up pre-agreed]:  
  - **Commitment Horizon:** 'If not delivering value by [date], project stops.'  
  - **Kill Signal:** 'If [metric] exceeds [threshold], project stops.'  
  Has any trigger been met? If yes, automatic kill (no debate)."  

  **Step 4: Dollar-Auction Neutraliser (5 mins)**  
  *Reframe using "Alternative Investment" test:*  
  "Assume we have £[CtC amount] and [TtV] months. Would we:  
  (A) Fund *this* project to completion?  
  (B) Fund a *new* project solving the same problem?  
  (C) Invest in core operations (e.g., driver bonuses, warehouse safety)?"  
  *Requires committee vote (A/B/C). "B" or "C" majority = kill project.*  

  **Step 5: Values Threshold (5 mins)**  
  *If project survives Step 4, ask:*  
  "Even if financially rational, does continuing:  
  - Violate ethical standards?  
  - Dangerously divert resources from legal/regulatory priorities?  
  - Irreparably damage team morale?"  
  *Committee chair has final veto on values grounds.*  

  ---

  ### WHERE IT MISFIRES (Documented Risks)  
  - **False Negatives:** May kill projects where 70% *was* genuinely the hard part (e.g., R&D-heavy work).  
  - **Restart Costs:** Killing may incur restart fees or loss of staff expertise if revived later.  
  - **Over-Mechanisation:** Ignores strategic pivots (e.g., a rebrand gaining urgency due to M&A).  
  *Mitigation:* Allow one-time "override" with CEO/sponsor sign-off, documented as protocol exception.  

  ---

  ### TEST CASES (Applied Protocol)  

  **CASE 1: Warehouse Software Migration (70% "Done", Vendor Warns "Last 30% is Hard")**  
  - **Step 1:** CtC = £500k, TtV = 9 months (revised from original £1.2m/6mo).  
  - **Step 2:**  
    - *Done* = All warehouses live, processing 20k parcels/day.  
    - *30% Autopsy* = 60% unavoidable (legacy integration), 30% known unknowns (vendor testing delays), 10% new scope.  
    - *Sunk Cost Lesson* = "Vendor’s API is unstable; we now require dedicated tester."  
    - *Walkaway Value* = £50k (servers resell).  
  - **Step 3:** Kill Signal met (original go-live date passed 18mo ago).  
  - **OUTCOME:** **KILL** (Triggered at Step 3). *You’ll hate this, but signals were breached.*  

  **CASE 2: Rebrand (On Time/Budget, No Articulated Purpose)**  
  - **Step 1:** CtC = £80k, TtV = 3 months.  
  - **Step 2:**  
    - *Done* = New logo on all trucks, website, uniforms.  
    - *30% Autopsy* = 90% execution (no major risks).  
    - *Sunk Cost Lesson* = None (work is straightforward).  
    - *Walkaway Value* = £0 (concept work has no resale).  
  - **Step 4:** Alternative Investment Test:  
    - £80k could fund driver retention scheme (quantified to reduce churn 15%).  
    - Committee votes 4-1 for Option C (core ops).  
  - **OUTCOME:** **KILL** (Step 4). *Philosophical, but money has better uses.*  

  **CASE 3: Automation Pilot ("Gut Says Kill" but Protocol Says Keep)**  
  - **Context:** Small pilot running 50% over budget, but cut injury rates 40% in test zone.  
  - **Step 1:** CtC = £120k, TtV = 4 months.  
  - **Step 2:**  
    - *Done* = Full report on ROI, safety impact, scalability.  
    - *30% Autopsy* = 70% data gathering/validation (low risk).  
    - *Sunk Cost Lesson* = "We validated maintenance costs are lower than manual."  
    - *Walkaway Value* = £20k (sell prototype bots).  
  - **Step 3:** No triggers met (pilot stage has flexible deadlines).  
  - **Step 4:** Alternative Investment Test:  
    - £120k for proven safety gains vs. new safety initiatives (unknown ROI).  
    - Committee votes 3-2 for Option A (continue).  
  - **Step 5:** No values breach (improves worker welfare).  
  - **OUTCOME:** **CONTINUE** *Counterintuitive, but data shows strategic potential.*  

  ---

  **Execution Pack:**  
  1. **Template Spreadsheet:** [Link to Google Sheet] with:  
     - Step-by-step fields for project leads to pre-fill.  
     - Auto-calculated "Kill Signals" from project charter.  
     - Vote recording for Step 4.  
  2. **Chair Script:** Standard phrases to depersonalise decisions ("The protocol indicates...").  
  3. **Reporting:** Killed projects tracked for 12 months to audit misfires.  

  **Why This Works:** It replaces monthly re-litigation of sunk costs with **structured, forward-looking gates**. The dollar auction is neutered by forcing comparison to *new* investments (Step 4) and binding pre-commitments (Step 3). British idioms included: "throwing good money after bad," "penny-wise and pound-foolish," and "take a view." Print, distribute, and may your tranches be few.
