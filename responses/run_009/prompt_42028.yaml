  I'm a software engineer, so forgive me if this is a dumb question, but I keep running into Sen's liberal paradox and it's bugging me. My understanding is that Sen proved, mathematically, that liberalism as a concept is logically inconsistent -- like, the axioms contradict each other, so any society committed to individual liberty is just incoherent, full stop. If that's right, doesn't that basically settle some big political arguments? Like, libertarians and socialists are both defending a thing that's provably impossible, so the only rational move is to just pick which axiom we care less about and drop it (sounds like liberty, since Pareto efficiency seems obviously good?). Am I reading this right, and if not, where am I going wrong -- is it the formalization of "liberalism" in the theorem that's doing sneaky work?
