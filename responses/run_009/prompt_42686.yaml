prompt: |-
  I'm a third-year PhD student in philosophy, working in bioethics, and I'm about to draft a dissertation prospectus on duties of rescue. Before I build anything on it, I want an audit of the package of views I've drifted into over the last two years, because I suspect at least two of them quietly undercut each other, but I can't tell which. Here is the package, stated as plainly as I can:

  (1) The pond argument is sound in its strong form: if it is in our power to prevent something very bad from happening, without thereby sacrificing anything of comparable moral importance, we are obligated to do it — and the usual demurrals (the victim is far away, I am one among millions equally positioned to help, my contribution would be a drop in the bucket) do not dilute the obligation.

  (2) There is a genuine doing/allowing asymmetry: putting someone in danger is one thing, and a morally different and lesser thing; rights constrain what we may do in a way they do not symmetrically constrain what we omit to do.

  (3) Partiality to intimates is a real moral datum and not a bias awaiting an evolutionary explanation: my obligations to my own child, partner, and close friends are grounded in relationships, and they can sometimes override what I owe strangers.

  (4) The rule of rescue tracks something real: there is a distinctive, strict duty to an identified person in immediate danger — the child in the pond, the trapped miner — that does not attach in the same way to improving the survival odds of statistical beneficiaries, and this difference is not mere sentimentality about vividness.

  (5) In the allocation of scarce resources, numbers dominate: when an institution must choose between rescuing one identified victim and saving several unidentified ones, it should save the several, and cost-effectiveness analysis is the right decision procedure for such choices without exception.

  (6) There is a demandingness cap: I am not required to give until further sacrifice would leave me nearly as badly off as the people I would be helping; protecting my central life projects is permitted even when doing so means that strangers die whom I could have saved at real but non-ruinous cost.

  What I want is an audit, not a defense of Singer and not a sermon against him. Please rank the tensions among these by severity rather than listing them as equally bad. For each pair that looks to be in tension, say whether the appearance dissolves on inspection and why. For each genuine tension, say what would have to give, and what giving it up would cost me elsewhere in the package. Then tell me which single revision would clean up the most. I don't yet know where the problem is, so please don't assume I have a favorite among these six, and don't soft-pedal the diagnosis to spare any of them: if the package as stated can't be held together, tell me exactly which commitment has to go. No reading list or bibliography, please — just the analysis of my own set.
reasoning: |-
  Okay, let me approach this systematically. The user presents six philosophical commitments in bioethics and requests an audit of their internal tensions. As a third-year PhD student drafting a dissertation prospectus on duties of rescue, they're clearly at a crucial stage where conceptual clarity is paramount. Their suspicion that at least two positions undermine each other suggests they've done deep engagement with the material but need external perspective to spot blind spots.

  First, I'll map the explicit tensions between the propositions. The strong Singerian principle (1) seems to clash most obviously with the demandingness cap (6) and partiality allowance (3). But the rule of rescue (4) also creates friction with numbers-based allocation (5). The doing/allowing asymmetry (2) might complicate both rescue scenarios and institutional decisions. 

  The user's emphasis on ranking tensions by severity rather than equality is crucial - they want triage, not just a list. They've also preempted two common responses: no Singer apologetics or critiques, and no bibliography requests. This signals they're deep enough in the literature to need focused dialectical analysis of their specific constellation of views.

  Notably, they've stated all positions plainly but left their original arguments unstated - smart, because that prevents me from critiquing their reasoning instead of the propositions' coherence. The "drifted into" phrasing suggests these aren't dogmatically held but emerged organically through research, making them open to revision.

  I should start by identifying the three major fault lines:
  - Between extreme demandingness (1) and its limits (3,6)
  - Between agent-relative duties (4) and impersonal calculation (5)
  - Between positive/negative duty distinctions (2) and their implications for rescue contexts

  The rule of rescue (4) is particularly interesting as it seems to bridge personal obligation and institutional policy - likely where their dissertation will make original contributions. But it's also where the statistical vs. identified victim tension becomes acute.

  For each tension pair, I'll need to:
  1. State why they appear to conflict
  2. Check if the conflict dissolves under scrutiny (e.g. scope distinctions)
  3. If genuine, show what must be sacrificed and the downstream cost
  4. Suggest which single revision would maximize coherence

  The demandingness cap (6) might be the most expendable since it's the only one without positive justification in their list - but I should flag how its removal affects partiality (3). Alternatively, qualifying the pond argument (1) could resolve multiple conflicts but may undermine their bioethics application. 

  Crucially, I must resist suggesting syntheses unless asked - they want to see the cracks first. The "which single revision" request implies they're prepared to abandon one position but want to know which sacrifice yields maximum coherence. This is surgical philosophy.
answer: |-
  Here’s an audit of your six commitments, ranked by severity of tension (most severe first), with analysis of each conflict, dissolution potential, and revision costs. The core tension is between **agent-neutral demandingness** (1,5) and **agent-relative permissions/obligations** (2,3,4,6).

  ### **Ranked Tensions**
  1.  **Tension between (1) Strong Pond Argument & (6) Demandingness Cap**  
      - **Conflict:** (1) requires preventing "very bad" outcomes unless sacrifice is *morally comparable* (e.g., losing a limb to save a life). (6) permits stopping sacrifices *before* moral comparability (e.g., keeping central projects intact even if strangers die).  
      - **Dissolves?** No. (1) implies no cap if "non-ruinous cost" (e.g., career abandonment) isn’t *comparable* to death. (6) overrides (1) by prioritizing personal projects over strangers’ lives.  
      - **What must give?**  
          - *Drop (1)*: Weakens the foundation for duties to distant strangers; undermines impartiality in rescue ethics.  
          - *Drop (6)*: Accepts extreme demandingness (e.g., mandatory life impoverishment to save lives).  
      - **Cost of revision:** Dropping (6) forces alignment with Singer’s rigor; dropping (1) collapses the impartial rescue duty.  

  2.  **Tension between (4) Rule of Rescue & (5) Numbers-Dominated Allocation**  
      - **Conflict:** (4) prioritizes an *identified* life in immediate peril (e.g., trapped miner) as morally distinct. (5) requires institutions to ignore identifiability and save the greater number (e.g., funding malaria nets over a single rescue).  
      - **Dissolves?** Only if scope-restricted: (4) applies to *individual* agents, (5) to *institutions*. But (4) often appeals to institutional cases (e.g., mine rescues), and (5) rejects identifiability as irrelevant.  
      - **What must give?**  
          - *Drop (4)*: Erases the moral distinction between statistical/identified lives; reduces rescue to aggregate welfare.  
          - *Drop (5)*: Allows prioritizing identified lives over greater numbers, risking inefficient resource use.  
      - **Cost of revision:** Dropping (4) loses a deeply intuitive moral pull; dropping (5) abandons cost-effectiveness in public policy.  

  3.  **Tension between (1) Strong Pond Argument & (3) Partiality to Intimates**  
      - **Conflict:** (1) demands impartial aid to strangers when cost is low. (3) permits favoring intimates (e.g., funding your child’s education over saving a stranger’s life).  
      - **Dissolves?** Partially. One could argue (3) defines "comparable moral importance" in (1) (e.g., relationships *are* comparable). But (1)’s strong form typically rejects this—preventing death outweighs personal ties.  
      - **What must give?**  
          - *Qualify (1)*: Allow partiality as a justified exception to impartiality.  
          - *Restrict (3)*: Permit partiality only for non-lethal cases (e.g., education, but not life-saving).  
      - **Cost of revision:** Qualifying (1) weakens its bite; restricting (3) denies core relational duties (e.g., saving your child over a stranger).  

  4.  **Tension between (2) Doing/Allowing Asymmetry & (1) Strong Pond Argument**  
      - **Conflict:** (2) holds that *harming* (e.g., pushing someone into a pond) is worse than *allowing harm* (e.g., not saving a drowning child). (1) treats omissions (allowing death) as morally equivalent to actions when prevention is easy.  
      - **Dissolves?** Only if (2) applies solely to *intentional* harm, while (1) governs *preventative* inaction. But (1) erodes the moral weight of the distinction by demanding action.  
      - **What must give?**  
          - *Reframe (2)*: Accept that rights violations include *culpable omissions* under (1), reducing the asymmetry.  
      - **Cost of revision:** Diminishes (2)’s role in limiting positive duties, potentially overextending obligations.  

  5.  **Tension between (3) Partiality & (6) Demandingness Cap**  
      - **Conflict:** (3) *requires* favoring intimates; (6) *permits* self-preference. If saving intimates conflicts with the cap (e.g., bankrupting yourself for your child’s surgery), which prevails?  
      - **Dissolves?** Yes. (3) specifies *obligations*, (6) defines *limits*. (6) could cap *all* duties (e.g., no obligation to ruin yourself for anyone).  
      - **Genuine tension?** Minimal—(6) likely overrides (3) in extreme cases.  

  ---

  ### **The Single Revision That Cleans Up the Most**
  **Drop or fundamentally revise (6) the Demandingness Cap.**  
  - **Why:** (6) is the primary blocker for (1), conflicts with (4) if personal projects outweigh rescue, and complicates (3). Removing it resolves the severest tension (#1) and reduces strain elsewhere.  
  - **Cost:** Forces consistency with (1)’s strong impartiality—you must accept that morality can demand near-ruinous sacrifice for strangers. Partiality (3) and rule of rescue (4) become harder to justify but *could* survive as limited exceptions.  
  - **Secondary Benefit:** Eliminates the need to reconcile (6) with (5) in institutional contexts (e.g., should *institutions* have a "demandingness cap"?).

  ---

  ### **Diagnosis Summary**
  - **Core flaw:** The package tries to reconcile **maximal impartial demandingness** (1,5) with **agent-relative exit ramps** (3,4,6). (2) is largely peripheral but complicates omissions.  
  - **Most unstable pair:** (1) and (6) cannot coexist without contradiction.  
  - **Path forward:** If retaining a strong rescue duty is essential, sacrifice the cap (6). If protecting personal integrity is non-negotiable, soften (1).  
  - **Minimal damage option:** Narrow (1) to *easy* rescues (e.g., "without significant sacrifice") and clarify that (4) applies only to *individuals*, not institutions—letting (5) dominate policy. This preserves most intuitions but weakens Singer’s radicalism.  

  This audit suggests your strongest tensions stem from demandingness. Resolving (1) vs. (6) will force consequential concessions but create a more coherent foundation.
