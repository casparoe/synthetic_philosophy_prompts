answer: |-
  You've perfectly captured the core tension in this debate! The distinction between conventionalist (practice) views and normative power (autonomy/authority) views is fundamental, but the point about consent also relying on norms hits the nail on the head. Here's a breakdown of the disagreement, why it matters, and how it handles your edge case:

  **The Core Disagreement: Source and Ground of the Obligation**

  1.  **Conventionalist/Practice Views (Hume, Rawls, Hart, possibly Scanlon - though Scanlon is complex):**
      *   **Source:** The obligation arises *externally* from a pre-existing social practice or institution.
      *   **Ground:** Promising binds *because* there is a shared social practice with specific rules and expectations. The practice exists because it serves vital social functions (coordination, trust, reliance).
      *   **Mechanism:** When you utter "I promise," you invoke the rules of this public practice. You're essentially saying, "I hereby place myself under the rules of *this* institution." The obligation comes from the rules of the institution itself.
      *   **Analogy:** Like the rules of a game (chess) or a legal system. Moving a pawn binds you to chess rules only because there's a shared practice of playing chess with those rules. The move itself, absent the practice, means nothing.
      *   **Role of Intention/Will:** Your intention matters primarily to signal that you *are* invoking the practice correctly. The *power* to bind yourself comes from the practice, not from your will alone.

  2.  **Normative Power/Authority/Autonomy Views (Raz, Shiffrin, perhaps Owens, influenced by Kant):**
      *   **Source:** The obligation arises *internally* from the individual's exercise of a fundamental moral power or authority over their own normative landscape.
      *   **Ground:** Promising binds because individuals possess a basic moral capacity to intentionally create obligations for themselves and rights in others through a specific kind of performative act (the promise). This power is grounded in autonomy – the right and capacity to govern oneself and shape one's moral relationships.
      *   **Mechanism:** The act of promising *itself* (understood as an intentional act with the appropriate content) *creates* the obligation. It's an exercise of your normative authority. The practice might be a common *way* we exercise this power, but the power itself is prior and independent.
      *   **Analogy:** Like consent or commanding (within legitimate authority). When you consent to surgery, you *change* the doctor's normative permissions *by your will*, based on your autonomy over your body. The act of consent *is* the normative change.
      *   **Role of Convention:** Conventions might be crucial for *communication* (ensuring the promisor and promisee understand the act *as* a promise) and perhaps for *stability*, but they are not the *source* of the obligation-creating power. The power itself is a fundamental moral feature of persons.

  **Addressing the Consent Point ("Isn't that a convention too?")**

  This is a powerful objection, and normative power theorists have sophisticated responses:

  1.  **Conventions as Enabling vs. Constituting:** They argue conventions *enable* the *effective exercise* of the power (making it recognizable, reliable) but do not *constitute* the power itself. The moral power exists independently; conventions are the tools we use to wield it clearly in a social world. Consent requires understanding, but the normative effect flows from the autonomous act, not *merely* from the convention enabling recognition.
  2.  **The Power is Basic:** They posit the normative power to bind oneself via promise (or change rights via consent) as a *primitive* or *fundamental* moral fact about autonomous agents. It's not reducible to or derivable from conventions plus something else. Conventions facilitate its *use*, not its *existence*.
  3.  **Focus on the Act's Intentional Structure:** The obligation arises from the specific *kind of intentional act* performed – an act of committing one's will to a future action, creating an expectation and a right in another. The moral significance lies in the nature of this act and its impact on relationships and autonomy, not solely in its conventional labeling.

  **Your Edge Case: The Skeptics' Promise**

  This case brilliantly highlights the disagreement:

  *   **Conventionalist View:**
      *   **Verdict:** **No binding promise exists.**
      *   **Reasoning:** The core element – a shared social practice governing promising that both parties invoke and are subject to – is missing. If both parties genuinely believe promising is "superstition," they cannot be invoking a practice they don't believe in and don't see as governing their behavior. There's no external rule system being appealed to. Any utterance of "I promise" is purely performative play-acting without normative force. The obligation depends on the context of a functioning practice, which is absent here.

  *   **Normative Power View:**
      *   **Verdict:** **A binding promise *potentially* exists.**
      *   **Reasoning:** If both parties genuinely perform the *intentional act* of promising – meaning they sincerely intend to commit themselves to the future action *and* to create an expectation and right in the other party – then they have exercised their normative power, thereby creating an obligation. Their *belief* about promising being superstition is irrelevant to the *moral effect* of the act they performed, *if* they performed it correctly.
      *   **The Big "If":** Did they *really* perform the act? This is the crux. Can you genuinely intend to create a binding obligation *while simultaneously believing no such obligation is possible*? This seems psychologically incoherent.
          *   **Option 1 (Strict):** If they *intended* to create a real obligation *despite* their stated belief (perhaps subconsciously relying on the power, or just being inconsistent), then the promise binds. Their belief is mistaken but doesn't negate the act's effect.
          *   **Option 2 (Psychological Impossibility):** Truly believing promising is superstition *means* they cannot form the necessary intention to create a binding obligation. Their utterance is ironic, sarcastic, or purely descriptive ("I hereby utter the superstitious phrase..."), not a genuine exercise of the normative power. Therefore, **no binding promise exists.** Most plausible normative power theorists would likely take this route to avoid the "magic" charge.
      *   **Why it might *not* seem like magic:** The view relies on the idea that certain intentional acts (like consenting, commanding within authority, promising) have inherent normative significance due to the nature of autonomy and interpersonal relations. The "magic" is the basic moral fact of autonomous normative powers. It *is* a kind of moral "creation ex nihilo," but proponents argue this is a fundamental feature of our moral universe, no more magical than the idea that consent makes a punch permissible when otherwise it wouldn't be.

  **Why the Disagreement Matters**

  1.  **Foundations of Contract Law:** Does contract law rest on social conventions or on a pre-legal moral power of commitment? This affects how we interpret agreements in novel situations or between parties from different cultural/legal backgrounds.
  2.  **Moral Autonomy vs. Social Embeddedness:** How fundamental is individual autonomy in creating moral bonds? Are we fundamentally independent actors creating obligations, or are our obligations deeply shaped by the social structures we inhabit?
  3.  **Edge Cases (Like Yours):** How do we handle promises in contexts where the social practice is weak, contested, or absent (e.g., promises to dying people, promises between enemies, promises in a "state of nature" thought experiment, promises to AI)?
  4.  **The Scope of Promissory Obligation:** Does the *content* of the promise matter only if the practice allows it, or does the normative power have inherent limits based on autonomy or morality (e.g., can you promise to do something immoral? Conventionalists might say "yes, it's still a promise, just possibly overridden"; strict normative power theorists might say the power doesn't extend to creating immoral obligations).
  5.  **The "Bootstrapping" Problem:** Normative power views avoid the question of how the convention *itself* gets its normative force. Conventionalists must explain why we *ought* to follow the rules of the promising practice (e.g., utility, fairness, reliance). Normative power views ground the obligation directly in the act itself.

  **Conclusion:**

  The core disagreement is whether the *source* of promissory obligation lies in a **shared social practice** (Conventionalism) or in the **exercise of a basic moral power of autonomous agents** (Normative Power). The consent analogy highlights the challenge for normative power views: they must explain how such powers exist without *ultimately* relying on convention. Your skeptic case is a powerful test: Conventionalists clearly say "no obligation," while Normative Power theorists face a dilemma but generally lean towards "no obligation" if the skepticism prevents the genuine intention to bind. The debate matters profoundly for understanding the nature of commitment, autonomy, and the relationship between individuals and society. It's not just academic taxonomy; it cuts to the heart of how we create moral bonds with each other.
