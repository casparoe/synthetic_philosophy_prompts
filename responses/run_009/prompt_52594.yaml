answer: |-
  ## Memo: To the Esteemed Members of the Advisory Panel on International Trade and Monetary Policy

  **From:** David Hume (Resurrected, somewhat bewildered, but intellectually engaged)
  **Date:** October 26, 2023
  **Subject:** Reflections on Peculiar Modern Phenomena: Paper, Imbalances, and Neo-Mercantilist Fears

  Gentlemen of the Panel,

  My return to this bustling world has been accompanied by an education as startling as it is profound. The economic landscape you navigate bears only a spectral resemblance to the one I observed in the mid-18th century. While the fundamental springs of human action – industry, avarice, sociability – remain constant, the mechanisms through which they operate have undergone a metamorphosis I confess I scarcely anticipated. You solicit my thoughts on three such novelties, grounded in the principles I expounded concerning money, interest, and commerce. I shall address each in turn, striving for the skeptical temper and empirical reasoning that guided my original essays.

  **1. The Reign of Pure Fiat Currencies & Central Bank Discretion:**
  *   **Hume's Probable Position: Profound Skepticism Tempered by Observation.** Gentlemen, this notion of money unmoored from any tangible commodity – specie – and entrusted entirely to the discretion of central banks is, frankly, astonishing. My quantity theory of money ("Of Money," "Of the Balance of Trade") was predicated on the observation that an increase in circulating medium (gold/silver) would, *ceteris paribus*, raise prices proportionally over time, eventually negating any competitive advantage gained by the initial inflow. The idea that banks can conjure this medium *ex nihilo*, at will, strikes me as fraught with peril.
      *   I would immediately warn of the **grave risk of inflation**. If money is multiplied without a concurrent increase in goods and services, its value *must* depreciate. My skepticism towards "paper credit" exceeding the "solid stock" of an economy ("Of Public Credit") would be amplified a hundredfold. The temptation for governments to finance profligacy through this easy creation appears irresistible and deeply corrosive to public trust and economic stability.
      *   However, observing your modern economies function – albeit with periodic crises and inflationary bouts – I must acknowledge the system possesses a resilience I might not have predicted. My view that interest rates are determined primarily by the **demand for loans and the profits of commerce** ("Of Interest"), rather than the absolute quantity of money *per se*, offers a partial explanation. Central banks seem to influence the *cost* of borrowing, affecting investment and consumption, which aligns with my view that commerce drives interest. Yet, the sheer *scale* and *discretion* of their power over the money supply remains deeply unsettling. I would urge utmost caution, transparency, and independence for these institutions, lest they become engines of debasement.

  **2. Floating Exchange Rates & Persistent Current-Account Imbalances:**
  *   **Hume's Probable Position: Confusion over the Mechanism's Failure, Concern over Distortions.** This phenomenon directly challenges my "price-specie-flow mechanism" ("Of the Balance of Trade"). My argument was elegant in its simplicity: a trade deficit causes gold to flow out, contracting the money supply, lowering prices and wages, thereby restoring competitiveness and reversing the deficit. The surplus nation, flooded with gold, would experience inflation, losing its advantage. The system was self-correcting.
      *   The persistence of deficits for decades, without the predicted "draining of coin" or automatic correction, is baffling under my old framework. Where is the automaticity? **Floating exchange rates** appear to be the intended modern substitute for specie flows. In theory, a deficit should weaken a nation's currency, making its exports cheaper and imports dearer, thus correcting the imbalance. That this often fails to occur promptly or sufficiently suggests other powerful forces are at play – perhaps the vast, globally integrated **capital markets** you describe, where financial assets flow freely seeking return, decoupling trade flows from monetary adjustment.
      *   I perceive a dangerous **illusion of wealth**. A nation consuming far more than it produces for decades, financed by inflows of foreign capital (effectively, selling IOUs or assets), resembles the very "hoarding" I warned against, but in reverse. While not hoarding specie, it is consuming future prosperity. My insistence that real wealth lies in "the number of industrious poor" and productive capacity ("Of Commerce") suggests such persistent deficits, if financing consumption rather than productive investment, must ultimately weaken the nation's industrial base and long-term prosperity. The absence of immediate pain does not negate the underlying imbalance. The transition I described when money flows out – involving temporary hardship as prices and wages adjust – seems indefinitely postponed, potentially leading to a more severe adjustment later.

  **3. The Revival of Tariffs, Controls, and "Friend-Shoring":**
  *   **Hume's Probable Position: Deep Suspicion of Mercantilist Echoes, Skeptical of Security Pretexts.** Gentlemen, the arguments for these policies sound distressingly familiar – the zero-sum mindset of my mercantilist opponents, albeit cloaked now in the garb of "national security" rather than naked wealth accumulation. My core conviction stands firm: **"The encrease of riches and commerce in any one nation, instead of hurting, commonly promotes the riches and commerce of all its neighbours"** ("Of the Jealousy of Trade"). Prosperity is not a fixed pie; it is generated by industry and exchange. Impeding trade through tariffs and controls stifles industry, raises prices for consumers and manufacturers, and impoverishes all nations involved relative to their potential.
      *   While I acknowledged the king's prerogative regarding matters of vital state interest ("Of the Protestant Succession," though not economic), I find the **scope and elasticity of the "national security" justification** deeply troubling. My skepticism, honed against superstition and unfounded fears, compels me to ask: Is *every* restriction truly indispensable for security, or is this often a convenient veil for protecting particular domestic industries from competition – the very "jealousy of trade" I condemned? The historical parallels to the mercantilist wars and restrictive policies of my own time are undeniable.
      *   The concept of "friend-shoring" carries an implicit hostility that contradicts my belief in the mutually beneficial nature of commerce. While practical necessity in a fractured world might demand *some* diversification, erecting permanent economic blocs based on political alignment strikes me as recreating the very rivalries that hinder prosperity. I might grudgingly concede *exceptional, narrowly defined* security measures (e.g., critical military supplies), but only with profound regret for the lost gains from trade and a firm insistence that such measures be truly temporary and exceptional, lest they become the norm and invite retaliation, impoverishing all.

  **Modern Assessment: Hume's Light and Shadows**

  *   **Where Hume Illuminates:**
      *   **Quantity Theory & Inflation Risk:** Hume's core insight – that excessive money creation relative to goods debases value – remains fundamentally sound and powerfully explains the persistent modern challenge of inflation, especially under discretionary fiat regimes.
      *   **Trade Cosmopolitanism:** His argument that trade is mutually beneficial and that neighbouring prosperity is not a threat but an advantage remains a bedrock principle of economic welfare. The costs of tariffs and protectionism (higher prices, inefficiency, reduced innovation) are as real today as in the 18th century.
      *   **Focus on Real Economy:** Hume's emphasis that real wealth stems from industry, labour, and productive capacity ("Of Commerce"), not merely accumulated money (or financial claims), is a crucial antidote to the illusion that persistent deficits financed by asset sales are sustainable indefinitely.
      *   **Transition Costs:** His recognition that shifts in money flows cause temporary but real economic pain (unemployment, falling wages during adjustment) is often overlooked in modern models focused solely on long-run equilibria. This resonates with concerns about the disruptive effects of rapid globalization or sudden capital flight.

  *   **Where Hume's Framework Breaks Down or Needs Adaptation:**
      *   **Price-Specie-Flow vs. Floating Rates & Capital Mobility:** The automatic, mechanical adjustment Hume described via specie flows does not translate perfectly to floating fiat currencies. Exchange rates are influenced by massive cross-border capital flows (investment seeking returns, speculation, safe-haven flows) that can overwhelm or distort trade-balance signals for long periods. Central bank intervention and modern financial instruments further complicate the picture. The "automaticity" is lost.
      *   **Central Banking & Interest Rate Management:** Hume's view of interest driven solely by commercial profit/demand is incomplete in a world where central banks directly set key rates and use open market operations to manage liquidity. While the *long-run* neutral rate may still be influenced by real factors (as modern theory suggests), the short-to-medium term is heavily shaped by policy, a power unimaginable in Hume's specie-based world.
      *   **Complexity of Security-Economics Nexus:** Hume's era had security concerns (wars, dynastic struggles), but the nature of modern threats (cyber warfare, supply chain fragility for complex technologies, economic coercion as a weapon) and the deep interdependence of economies create legitimate dilemmas Hume couldn't foresee. Dismissing *all* security-motivated trade restrictions as mere mercantilism is arguably too simplistic, though Hume's skepticism about pretexts remains vital. The challenge is defining genuine, proportional security needs without collapsing into protectionism.
      *   **Global Capital Markets:** The sheer scale and speed of global finance fundamentally alter the dynamics Hume described. Persistent imbalances are *financed* by capital flows in ways that bypass the monetary contraction/expansion mechanism he relied upon. The concept of a nation "living beyond its means" financed by foreign lending for decades was not a prominent feature of his model.

  **In Conclusion, Gentlemen:**

  The world has changed, and with it, the levers and dials of economic governance. My core principles – the dangers of inflationary money creation, the folly of impeding mutually beneficial trade, the importance of industry over mere financial accumulation, and the recognition that prosperity abroad aids prosperity at home – retain their force. However, the mechanisms have grown vastly more complex. The substitution of fiat for specie and the rise of global capital markets have broken the elegant automaticity of the price-specie-flow mechanism, while the intertwining of security and economics presents novel and difficult trade-offs.

  My counsel, consistent with my skeptical temper, is this: Treat the discretionary power over fiat money with profound caution, for inflation is a thief in the night. View persistent imbalances not as triumphs of modern finance, but as potential distortions storing up future trouble. And approach the new mercantilism cloaked in security garb with unwavering scrutiny, for the siren song of protectionism, however justified in the moment, has ever impoverished nations in the long run. Pursue policies that foster industry and genuine commerce, for therein lies true wealth and lasting strength.

  Yours in Reasoned Inquiry,

  **David Hume**
