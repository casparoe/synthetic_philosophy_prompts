prompt: |-
  I'm a journalist covering science and ideas for a long-form magazine, and I'm at work on a piece about omissions — cases where a failure to act seems, uncomfortably, to do causal work: the surgeon who never rechecks the chart, the neighbor who never phones the fire brigade, and, increasingly, automated systems that fail to warn a human operator in the seconds when a warning would have mattered. My working thesis is that our everyday concept of causation is quietly at war with itself over absences: we say the gardener killed the plants by not watering them, yet most analyses of causation — regularity, counterfactual dependence, production — take causes to be events, and a non-watering is not an event but the lack of one. Philosophers have offered various escape routes, and I want my piece to hang its narrative on the ones that are genuinely live rather than on tidy textbook resolutions.

  So I'd like a defended prioritization of the open questions in the metaphysics and semantics of causation by omission. I'm less interested in a survey than in the reasoning: for each question you rank, tell me why it deserves the place it gets — how many other issues in the area turn on it, whether it's tractable by argument alone or hostage to unsettled physics or psychology, whether it's neglected because it's unfashionable or because it's genuinely hard, and what would make you move it up or down. To give you a sense of the terrain as I understand it, the candidates I've encountered include at least these: whether omissions are causes at all, or merely occasions on which ordinary causes operate unchecked; whether every omission is irreducibly relative to a norm or expectation — a "failure" only against a background of what someone was supposed to do — and if so, whether that relativity imports morality into causation rather than the other way round; whether omission-causation is really a species of double prevention, and if not, what separates the two; how a chain of nested omissions transmits responsibility (the lifeguard who didn't check the schedule, the scheduler who didn't circulate it, the manager who didn't require circulation); and whether the moral distinction between doing and allowing should be respected by, or simply corrected against, whatever metaphysics of absence we settle on. If the most important question isn't on my list, say so and put it at the top on its own terms. Please also flag, as you go, which of these questions my journalistic treatment could responsibly leave open in the final piece and which I would be misleading readers to present as settled.

  For the last line of your answer, please give a machine-readable summary: a single line of the form \answer{...} containing a short phrase (no more than about ten words) naming the one open question you'd place first.
reasoning: |-
  Okay, let me tackle this fascinating query about omissions in causation. The journalist wants a prioritized list of open questions with clear reasoning, not just a survey. They mentioned several candidates: whether omissions are causes at all, their relativity to norms, connection to double prevention, responsibility chains, and the doing/allowing distinction. 

  First, I need to identify the core tension: our intuitive blame of omissions (like the negligent gardener) clashes with standard causal theories that require positive events. This isn't just academic - it affects legal liability and AI ethics. The "are omissions causes?" question must come first because every other issue branches from it. If we deny their causal status entirely, the other questions dissolve or transform. 

  But why prioritize this over norm relativity? Because the existence question is more fundamental - we can't debate how norms shape omissions if we haven't established they're causes at all. It's also more tractable: philosophers like Beebee and Schaffer have concrete arguments about counterfactuals and event-ontologies, whereas norm debates bleed into moral relativism. 

  The double prevention link is intriguing but derivative - if omissions aren't causes, they can't be "a species" of anything causal. Responsibility chains depend entirely on whether we treat omissions as causal links. And the doing/allowing distinction? That's downstream - first we need to know if "allowing" via omission is even causal. 

  I'm noting gaps too: the journalist didn't mention preemption (where an omission prevents another cause) or probabilistic causation (how likely outcomes affect blame). But those feel secondary to the existential question. 

  For journalistic handling: we can present the "are they causes?" debate as live but must flag that denying causation entirely leads to counterintuitive outcomes (like no causal blame for clear negligence). The norm relativity question can safely be left open - it's thornier and less settled. 

  Final machine line crystallizes this: the existence question is the linchpin.
answer: |-
  Here’s a defended prioritization of the most pressing open questions in the metaphysics of causation by omission, tailored to your narrative needs. The ranking reflects **explanatory primacy** (how many downstream issues depend on it), **tractability** (whether arguments can resolve it or if it’s hostage to empirical unknowns), and **neglect** (whether it’s underexplored for substantive reasons).

  ---

  ### **1. Are omissions causes at all, or merely explanatory placeholders?**  
  **Why #1?** This is the keystone. If omissions aren’t genuine causes, most other questions evaporate or transform.  
  - **Downstream issues**: Resolving this redefines responsibility chains, moral distinctions (doing vs. allowing), and the role of norms. If omissions aren’t causes, then "the gardener didn’t water the plants" merely describes a context where drought *did* the causal work.  
  - **Tractability**: Argument-driven but intractable so far. Production theorists (e.g., Phil Dowe) say causes require energy transfer (so omissions aren’t causes). Counterfactualists (e.g., David Lewis) argue omissions *do* cause iff change alters the outcome (e.g., *if watered, plants survive*).  
  - **Neglect**: Often sidelined as "solved" by counterfactualism, but production theorists still mount robust defenses. Recent tech cases (e.g., algorithmic silence) force re-engagement.  
  **Move up/down**: If physics confirms causation requires physical processes (e.g., quantum interactions), production theories gain ground. If AI negligence cases legally require causal omission, counterfactualism dominates.  
  **Journalistic note**: **Must present as unsettled**. Treating it as resolved misleads readers—philosophy and law still clash here.

  ---

  ### **2. Is omission-causation irreducibly normative?**  
  **Why #2?** If all omissions imply "should-have-done" expectations, causation bleeds into ethics.  
  - **Downstream issues**: Determines whether moral norms *create* causal facts (e.g., "the surgeon *should* have rechecked" makes non-rechecking causal) or merely describe them. Shapes responsibility chains: if normative, the scheduler’s omission only "causes" harm if duties existed.  
  - **Tractability**: Hostage to moral philosophy. Descriptive approaches (e.g., causal models) avoid norms but struggle with asymmetry (why isn’t "not singing opera" a cause of plant death?).  
  - **Neglect**: Rising attention due to algorithmic bias (e.g., systems "failing" to flag errors reflects designers’ norms).  
  **Move up/down**: If empirical work shows people attribute causation sans norms (e.g., in amoral contexts), its rank drops.  
  **Journalistic note**: **Leave open**. Core dispute is whether normativity is metaphysical or psychological.

  ---

  ### **3. How do chains of omissions transmit responsibility?**  
  **Why #3?** Practical urgency (e.g., corporate liability) but *depends on Q1/Q2*.  
  - **Downstream issues**: Clarifies whether nested omissions dilute responsibility (e.g., lifeguard + scheduler + manager) or create cumulative causes. Turns on causal "distance" and preemption.  
  - **Tractability**: Needs Q1 resolved first. If omissions aren’t causes, chains break. Models exist (e.g., structural equations), but debate rages on overdetermination.  
  - **Neglect**: Hot in legal theory but metaphysically underexplored.  
  **Journalistic note**: **Responsibly unsettled**—cite real cases but flag dependence on deeper metaphysics.

  ---

  ### **4. Is omission-causation just a form of double prevention?**  
  **Why #4?** Technically niche but sharpens Q1.  
  - **Downstream issues**: If omissions *are* double prevention (e.g., not watering prevents water from preventing death), they might fit production theories. But Schaffer argues double prevention is causation’s "asteroid belt"—messy but physical.  
  - **Tractability**: Arguments can resolve if physics accepts "prevention" as causal.  
  - **Neglect**: Growing literature, but less urgent than Q1–3.  
  **Journalistic note**: **Settle lightly**? If Q1 affirms omissions as causes, this becomes a sub-debate.

  ---

  ### **5. Should the doing/allowing distinction constrain metaphysics?**  
  **Why last?** Moral distinction that *presupposes* causal metaphysics.  
  - **Downstream issues**: If doing/allowing is morally significant, should causation reflect that? Or should metaphysics correct moral intuitions?  
  - **Tractability**: Highly normative—depends on ethical commitments.  
  - **Neglect**: Ethicists debate this; metaphysicians often ignore it.  
  **Journalistic note**: **Leave open** but note it’s more ethical than metaphysical.

  ---

  ### **Missing Top Candidate?**  
  **"Do omissions require a privileged baseline?"** (e.g., why "not watering" not "not poisoning" causes death).  
  - **Why it could be #1**: If unaddressed, omission-causation is hopelessly arbitrary. But it’s partly subsumed by Q2 (norms) and Q1 (causal status).  
  - **Rank**: Would tie with Q2 if emphasized, but Q1’s primacy holds.

  ---

