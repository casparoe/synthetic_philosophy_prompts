  ## Digital Collections Advisory Board - Decision Memorandum

  **To:** Library Digital Collections Advisory Board  
  **From:** [Your Name], Graduate Student Representative  
  **Date:** [Current Date]  
  **Subject:** Recommendation Regarding Online Access to the "Village Massacre Oral History Collection" (Accession #XXXX)  

  ### 1. Background
  In the early 1990s, university anthropology researchers recorded approximately 80 oral history interviews with survivors and witnesses of the [Name of Village] massacre during the [Country] civil conflict. Interviewees consented to recording for the "historical record." Digitized in 2015, the collection (audio, transcripts) was made fully public online. In [Date], the [Name] Descendants' Association formally requested complete removal of the collection from public access, citing the ongoing trauma caused by universal availability and its hindrance to community healing and civic normalization. Historians and the original researcher oppose removal, emphasizing the collection's vital role in preserving primary evidence against official minimization and potential denialism. Options include: full removal, status quo, tiered access (e.g., on-site/appointment only), or partial redaction.

  ### 2. Analysis & Recommended Action
  After careful review of the ethical, historical, and community concerns, the Advisory Board recommends implementing a **tiered access model with a built-in review mechanism**. Specifically:

  *   **Immediate Action:** Remove the collection *from full public online access* within **30 days**.
  *   **New Access Protocol:** Establish a **mediated access system**.
      *   Access to the full digital collection will be available **on-site at the University Library Special Collections reading room**.
      *   **Remote access** may be granted only to **verified researchers** (academic, professional historians, human rights investigators) upon submission of a formal research application outlining purpose, methodology, and intended use. Applications will be reviewed by Library Special Collections staff in consultation with a designated liaison from the History Department and Anthropology Department.
  *   **Review Clause:** This access protocol will be formally reviewed by the Library and Advisory Board **every 5 years**, explicitly considering:
      *   Evolving perspectives within the descendant community (including formal feedback mechanisms).
      *   The political/historiographical landscape within [Country].
      *   Technological developments impacting privacy/accessibility.
      *   Usage patterns and scholarly impact.

  ### 3. Reasoning & Ethical Framework
  This recommendation seeks a principled balance between the legitimate, yet competing, imperatives presented:

  *   **The Duty to Remember & Countering Denialism:** Avishai Margalit argues for an "ethics of memory," suggesting we have special obligations to remember atrocities to honor the victims and prevent future harms ("thick relations"). Removing this primary evidence *entirely* risks violating this duty. Its existence counters state narratives minimizing the atrocity. Historians rightly fear deletion enables denialism. On-site/appointment access preserves this vital evidentiary function for serious scholarship and accountability efforts, fulfilling the original interviewee intent for a "historical record."
  *   **The Case for Forgetting/Healing & Community Agency:** David Rieff cautions that perpetual, unmediated remembrance can "calcify grievance," hindering reconciliation and the building of a "normal" civic life – precisely the concern raised by the descendants. Universal online availability transforms testimony intended for the historical archive into readily accessible, potentially re-traumatizing content that defines the community externally and internally in perpetuity. As an institution *external* to the conflict and community, the university’s primary "duty" is arguably one of *ethical stewardship*, not protagonist in the remembrance debate. Our role is custodial, not commissional. The descendants' plea for relief from constant external exposure warrants significant deference. Full public access prioritizes academic "profit" (as they framed it) over their current well-being.
  *   **Consent, Standing, and Time:** The original interviewee consent is crucial but not absolute or eternal. Consent was given in a specific context (early 90s, for the "historical record"), likely without envisioning universal digital accessibility decades later. Descendants possess a distinct moral standing rooted in their lived experience of the atrocity's *ongoing* legacy and the collective identity imposed by its constant visibility. They are not merely third parties; they bear the direct, intergenerational consequences. Their request for relief, while not negating the original consent entirely, necessitates a reassessment of *how* access aligns with ethical stewardship in the present.
  *   **The Third-Country Factor:** Our university's geographical and historical distance underscores the need for humility. We lack the inherent "thick relations" Margalit identifies as grounding deep ethical obligations. Our responsibility is best framed as one of *respectful custodianship* – preserving the record responsibly while minimizing harm to the living community most affected by its content. Tiered access acknowledges this position.

  ### 4. Why Not Other Options?
  *   **Status Quo (Full Public Access):** Disregards the profound harm identified by the descendant community and fails in our duty of ethical stewardship. Prioritizes abstract historical principle over tangible present suffering.
  *   **Full Removal:** Erases vital evidence, potentially aiding denialist narratives and disregarding the original interviewees' intent for preservation. Constitutes an over-correction that fails to balance the needs of history and the community.
  *   **Redaction Only:** Impractical and ethically fraught. Redacting living interviewees addresses privacy but not the core community concern about the massacre narrative's pervasive accessibility. Redacting deceased interviewees severs their voices from the record against their original consent. Does not resolve the fundamental tension.
  *   **On-Site Only (no remote):** The recommended mediated access *includes* on-site as the primary method but allows for responsible remote access under strict review, acknowledging the global nature of scholarship while maintaining control.

  ### 5. Implementation Timeline
  1.  **Immediate (0-30 days):** Remove collection from public website. Draft formal access policy & application form.
  2.  **Short Term (30-60 days):** Finalize and publish access policy. Train Special Collections staff on application review process. Establish formal communication channel with Descendants' Association for feedback (separate from access requests).
  3.  **Ongoing:** Implement mediated access system. Track usage and feedback.
  4.  **Year 5:** Formal review by Advisory Board, incorporating descendant community input, scholarly assessment, and contextual analysis, to determine if the access protocol remains appropriate or requires modification.

  ### 6. Confidence & Caveats Note

  *   **Overall Confidence:** **High Confidence** in the tiered access model as the most ethically balanced and practically feasible solution. It directly addresses the descendant community's core objection (unfettered public exposure) while preserving the collection's integrity and accessibility for legitimate historical and accountability purposes. The 5-year review provides necessary flexibility.
  *   **Area of Least Certainty:** **The relative weight accorded to original interviewee consent versus descendant community requests.** While confident that descendant concerns *must* significantly shape access (especially given the context shift to universal digital availability), the reasoning involves complex philosophical and cultural interpretations of intergenerational rights and the "ownership" of traumatic memory. This remains the point most open to principled disagreement.
  *   **Interpretive Liberty:** The memo applies Rieff's critique of "calcified grievance" directly to the *mechanism of access* (universal online availability) as a potential hindrance to community healing, which is a specific application of his broader concern about cultures of remembrance. Margalit's "thick relations" concept is used to *limit* the university's inherent duty relative to the affected community, focusing our duty more narrowly on responsible custodianship – a plausible but not explicitly detailed application by Margalit.
