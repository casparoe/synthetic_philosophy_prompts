  0.4. My credence that indicative conditionals have truth conditions satisfying Adams's Equation (P(if p then q) = P(q|p)) in a way sustainable for unembedded cases is 0.4.

  Decomposition:

  1.  **P(Lewis refutes truth-conditions outright) = 0.15.** Lewis's proofs formally show the Equation *cannot* hold unrestrictedly across *all* probability functions if conditionals are propositions in the same algebra. However, contextualism (relativizing truth/assertability to a fixed function or context) remains a viable retreat path, not a full refutation.
  2.  **P(Equation holds unrestrictedly, ignoring McGee/chains) = 0.2.** Even setting aside specific counterexamples, the Equation demonstrably fails for unembedded conditionals under specific embeddings or shifts in context (e.g., in nested suppositions, or under credence changes), as shown by triviality and undermining intuition.
  3.  **P(Best escape is no-truth-value vs. trivalent/supervaluational) = 0.7.** The no-truth-value view (e.g., Adams, Edgington) cleanly avoids triviality by rejecting truth conditions altogether, making the Equation definitional. Trivalent/supervaluational approaches (e.g., de Finetti, Belnap) struggle with compounds and intuitive truth-value gaps without fully dodging triviality pressures.
  4.  **P(Compounds sink no-truth-value view independently) = 0.3.** While compounds are a major challenge for the no-truth-value view (requiring supplementary logics/assertability rules), dynamic semantics (e.g., Gillies) and restrictor views show promise, proving it's not *independently* fatal; triviality remains the core threat.

  **Combination:** My final credence (0.4) estimates P(Truth-conditional view survives *and* Equation holds reasonably for unembedded cases). I start with P(Truth-conditional survives) ≈ 1 - P1 = 0.85. Multiply by P(unrestricted Equation holds) ≈ P2 = 0.2 → 0.17. Adjust upward (~0.25) for contextualist retreats (e.g., relativized Equation). Adjust downward (~0.15) for P(Best alternative is no-truth-value) * P(Compounds don't sink it) = 0.7 * 0.7 = 0.49, acknowledging its viability. Net ~0.4. Alternatively: Weight P(Truth-conditional + Contextualist Equation) at ~0.3 and P(No-Truth-Value + Compounds managed) at ~0.5, blend for ~0.4.

  **Sensitivity:** The final number (0.4) is most sensitive to **Term 1**. A significant change in P(Lewis forces outright abandonment of truth conditions) would drastically alter the landscape. If P1 rises to 0.5, the truth-conditional path collapses, pushing the final number below 0.2. If P1 falls to 0.05, the truth-conditional path looks robust, pushing towards 0.6+.

  **Disagreement Assessment:** Your colleague (0.6) is most likely too optimistic about **Term 2**. Credence 0.6 requires near-certainty that the Equation holds unrestrictedly for unembedded conditionals after known counterexamples are set aside (she likely assigns P2 > 0.8). However, Lewis's results formally show it *cannot* hold unrestrictedly across probability functions *even for unembedded conditionals* if they are propositions—undermining this certainty. Contextualism helps, but doesn't guarantee the Equation holds *simpliciter* in every context without restriction; shifts during evaluation or embedding often break it.

  **Evidence to Move Me:** A fully formal, non-stipulative contextualist or trivalent semantics that: (1) Validates the Equation *as the literal probability of truth* for unembedded conditionals within a fixed context/state, (2) Naturally handles embeddings without collapse or extreme artificiality, and (3) Matches key intuitions better than dynamic/no-truth-value rivals. Khoo's recent work on probabilistic contextualism comes closest; empirical evidence on compound interpretation (e.g., "It's not the case that if P, Q") favoring truth-conditional accounts would also shift P3/P4.
