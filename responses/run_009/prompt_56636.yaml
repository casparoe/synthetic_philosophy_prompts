  My colleague and I disagree about what Lewis's triviality results for indicative conditionals actually show, and I'd like a third opinion in the form of a number. The proposition to evaluate: English indicative conditionals (of the form "if p, q") express propositions with truth conditions, and for an unembedded conditional the probability is given by Adams's Equation, P(if p then q) = P(q|p). My credence that this combination — truth conditions plus the Equation — can be sustained is about 0.25; hers is about 0.6, because she thinks the triviality proofs only bite when you demand that one and the same conditional proposition retain that probability under every embedding and across every probability function, and that a contextualist or trivalent semantics can carve out enough room to survive. Give me your own credence, decomposed: (1) the probability that Lewis's proofs refute the truth-conditional view outright rather than merely forcing a retreat, e.g., to relativizing the Equation to a single fixed probability function; (2) the probability that the Equation holds unrestrictedly, once you set aside McGee-style counterexamples to modus ponens and the cases where a chain of individually assertible conditionals yields a plainly false one; (3) the probability that the best escape from triviality is the no-truth-value view, on which conditionals are not propositions at all, versus a trivalent or supervaluational semantics; and (4) the probability that the compounds problem — what to say about negated, conjoined, and iterated conditionals — sinks the no-truth-value view independently of any triviality result. Assign a rough probability to each term with a one-line justification, state how you combine them into your final number, and say which term the final number is most sensitive to. Then tell me which of us, at 0.25 versus 0.6, is most likely wrong about which term, and what argument or evidence would move you most. Please keep clearly separate what is settled as a matter of the formal results themselves from what remains genuinely contested among philosophers of language, and do not present a contested interpretive claim as the consensus; lead with your final number in the first sentence, then give the decomposition, with no preamble and no restatement of the question.
