  Below is a decision tree quiz designed to identify your underlying decision theory based on concrete choices in thought experiments. Each node presents a scenario with two options. Answer honestly based on what you'd actually do, not what you think you "should" say. The tree uses variations to split subtle positions, especially distinguishing why you might pay in a counterfactual mugging.

  ---

  ### **Node 1: Newcomb's Paradox**  
  *Omega, a perfect predictor, offers you two boxes: Box A (opaque) and Box B (transparent, containing $1,000). Omega put $1,000,000 in Box A only if it predicted you would take *only* Box A. If it predicted you'd take both, Box A is empty. You see $1,000 in Box B. What do you do?*  
  - **A) Take only Box A** → Go to Node 2  
  - **B) Take both boxes** → Go to Node 3  

  ### **Node 2: Counterfactual Mugging (Heads World)**  
  *Yesterday, a coin was flipped. If heads: nothing happens. If tails: Omega would have simulated you and asked for $100 to give you $1,000,000 next week. The coin was heads, so Omega asks you for $100 now. Paying costs you $100 and gains nothing (since heads), but if the coin had been tails, a simulation of you would have been asked. Do you pay?*  
  - **A) Pay $100** → Go to Node 4  
  - **B) Refuse to pay** → Go to Node 5  

  ### **Node 3: XOR Blackmail (Base)**  
  *You get a letter: "We sent this *only if* you have termites OR you’ll pay $1,000. If you pay, we’ll tell you if you have termites and won’t release the info. If you don’t pay AND have termites, we’ll release it, costing you $10,000." You have no idea if you have termites. Do you pay?*  
  - **A) Pay $1,000** → Go to Node 6  
  - **B) Refuse to pay** → Go to Node 7  

  ### **Node 4: Counterfactual Mugging (Record-Based)**  
  *Identical to Node 2 (coin was heads), but Omega reveals it never simulated you. Instead, it used your high school record to predict your choice. Paying still costs $100 and gains nothing. Do you pay?*  
  - **A) Pay $100** → **Leaf: Functional Decision Theory (FDT)**  
  - **B) Refuse to pay** → **Leaf: Updateless Decision Theory (UDT)**  

  ### **Node 5: XOR Blackmail (Dumb Script)**  
  *Identical to Node 3, but you learn the letter was sent by a dumb script that randomly picks 50% of people, regardless of termites or your choice. The letter’s text is unchanged. Do you pay?*  
  - **A) Pay $1,000** → **Leaf: Evidential Decision Theory (EDT)**  
  - **B) Refuse to pay** → **Leaf: Inconsistent EDT**  

  ### **Node 6: Counterfactual Mugging (Transparent Tails)**  
  *Omega flips a coin in front of you—it lands tails. If tails, Omega asks for $100 to give you $1,000,000 tomorrow. If heads, nothing. Do you pay?*  
  - **A) Pay $100** → **Leaf: Causal Decision Theory (CDT)**  
  - **B) Refuse to pay** → **Leaf: Irrational/Risk-Seeking**  

  ### **Node 7: Dumb Script XOR Blackmail**  
  *Same as Node 5: letter sent randomly to 50% of people. Do you pay?*  
  - **A) Pay $1,000** → **Leaf: Causal Decision Theory (CDT)**  
  - **B) Refuse to pay** → **Leaf: Irrational/Risk-Seeking**  

  ---

  ### **Leaf Explanations**  
  1. **Causal Decision Theory (CDT)**: You focus on direct cause-and-effect. In Newcomb’s, you take both boxes because your choice *now* can’t change Omega’s past action. You pay in muggings only if you see proof (e.g., transparent coin) that your payment causes a reward.  
  2. **Evidential Decision Theory (EDT)**: You act based on what your choice *implies* about the world. In XOR Blackmail, you pay because refusing is strong evidence you have termites. You refuse the mugging because paying doesn’t change the coin flip.  
  3. **Functional Decision Theory (FDT)**: You decide as the "best version of yourself" across all scenarios. You pay in muggings—even when simulated or judged by your record—because you want "you-in-all-possible-worlds" to cooperate with Omega for maximum payoff.  
  4. **Updateless Decision Theory (UDT)**: You ignore "new" information (like the coin flip outcome) and stick to a precommitted optimal strategy. You pay in muggings only if a simulation was run (you identify with it), but refuse if judged by a static record (you don’t identify with your past self).  
  5. **Inconsistent EDT**: You act like EDT in XOR Blackmail but refuse the dumb script case, suggesting a lapse in applying evidential reasoning.  
  6. **Irrational/Risk-Seeking**: Your choices ignore expected value (e.g., refusing a 50% chance to avoid a $10,000 loss for $1,000).  

  ---

  ### **Key Notes**  
  - **FDT vs. UDT Distinction**: The tree splits them using Node 4 (record-based mugging). FDT pays to uphold a timeless identity ("I always cooperate"); UDT refuses because the record isn’t "you" making a decision. In practice, most people who pay in Node 2 also pay in Node 4 (FDT dominates), but the leaf exists to catch UDT outliers.  
  - **Your Variations in Action**:  
