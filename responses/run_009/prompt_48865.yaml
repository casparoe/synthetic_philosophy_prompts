    - *Record-based mugging* (Node 4) splits FDT (pays) from UDT (refuses).  
    - *Dumb script* (Nodes 5/7) exposes whether refusal in XOR Blackmail is evidential (EDT pays here) or causal (CDT pays).  
  - **Unoccupied Leaf**: "Inconsistent EDT" is rare—most EDT pays in the dumb script case. It’s a sanity check, not a coherent theory.  
  - **Asterisks**: FDT and UDT often converge (both pay in Node 2). The record case is the *only* practical split, but real-world adherents rarely diverge.  

