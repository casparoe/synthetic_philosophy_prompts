  #### Leaf Positions and Awkward Commitments
  1. **Illusionism**  
     *Awkward commitment:* "Consciousness as it seems to you—the 'what-it's-like'—is an illusion; introspection systematically misrepresents your own mind."  
  2. **Type-A Materialism**  
     *Awkward commitment:* "The vivid, seemingly non-physical 'what-it's-like' of experience is fully explained by physical facts, even though introspection can't see how."  
  3. **Type-B Materialism**  
     *Awkward commitment:* "Zombies are coherent and we can't explain why they're impossible, but they're still metaphysically impossible."  
  4. **Type-C Materialism**  
     *Awkward commitment:* "Future science will make zombies inconceivable, but we have no idea how or why."  
  5. **Russellian Monism**  
     *Awkward commitment:* "Physics only describes the structure of reality; consciousness is the hidden intrinsic nature of that structure (with panpsychist/neutral flavors)."  
  6. **Epiphenomenalism**  
     *Awkward commitment:* "Consciousness has no causal power; your pain doesn't make you wince, it just 'rides along' with physical causes."  
  7. **Interactionist Dualism**  
     *Awkward commitment:* "Non-physical consciousness breaks physics' causal closure, but we haven't detected this violation empirically."  
  8. **Unoccupied A** (*Inconsistent Absent-Qualia Denier*)  
     *Diagnosis:* Incoherent. Grants zombies are possible (implying absent qualia) but denies gradual replacement could extinguish qualia (contradicting zombie possibility).  
  9. **Unoccupied B** (*Interactionist Who Denies Absent Qualia*)  
     *Diagnosis:* Incoherent. Grants zombies are possible but denies functional duplicates could lack qualia—yet interactionism requires functional duplicates *could* lack qualia.  
  10. **Unoccupied C** (*Demonstrative-Concept Temporary-Gap Holder*)  
      *Diagnosis:* Incoherent. Claims the concept of experience is direct (like pointing) *and* the zombie gap is temporary—but direct concepts don't allow gaps to close via empirical progress.  

