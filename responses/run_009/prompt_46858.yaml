  ### Decision Tree for the Conceivability Argument

  #### Tree Structure
  ```
  1. After ideal reflection, do you find the idea of a zombie (a physical/functional duplicate of a conscious being with no experience) coherent?  
     (That is, is this idea logically consistent, not self-contradictory like a "square circle"?)  
     A. Yes, it is coherent.  
     B. No, it is incoherent.  

     If B:  
     2. When you introspect, does it *seem* like there is a "what-it's-like" aspect of your experience that goes beyond physical/functional facts?  
        A. Yes, it seems that way, but this seeming is an illusion.  
        B. Yes, it seems that way, and this seeming is veridical (it reflects reality).  

     If A (from 1):  
     3. Is our concept of conscious experience like the concept of "water" (descriptive, picking out its referent indirectly) or like a demonstrative (directly pointing to the experience itself)?  
        A. Like "water" (descriptive).  
        B. Like a demonstrative (direct).  

     4. Does the coherence of zombies strongly support their metaphysical possibility?  
        (That is, if you can coherently conceive it, does that make it genuinely possible?)  
        A. Yes, it strongly supports possibility.  
        B. No, it does not support possibility.  

        If A:  
        5. Do you accept causal closure of the physical?  
           (Every physical event has a sufficient physical cause; no non-physical causes needed.)  
           A. Yes.  
           B. No.  

           If A:  
           6. Could gradual replacement of neurons with functionally identical silicon extinguish consciousness while behavior stays normal?  
              A. Yes, this is possible.  
              B. No, this is impossible.  

              If A:  
              7. Are physical facts (as per physics) purely structural?  
                 (Do they describe only relations/patterns, not intrinsic properties?)  
                 A. Yes.  
                 B. No.  

                 If A:  
                 8. Could consciousness be the intrinsic nature of physical properties?  
                    A. Yes.  
                    B. No.  

           If B (from 5):  
           9. Could gradual replacement of neurons with functionally identical silicon extinguish consciousness while behavior stays normal?  
              A. Yes, and I accept this.  
              B. Yes, but this shows functionalism is false.  
              C. No, this is impossible.  

        If B (from 4):  
        10. Is the coherence of zombies due to current cognitive limitations (resolvable by future progress)?  
            A. Yes.  
            B. No.  
  ```

