  - But specific agents or events can be hinges if they were irreplaceable (smallpox, French navy, Lenin, Luther)

  For the Berlin Wall fall, the structural factors were strong. Gorbachev's policies and Hungary's actions created conditions where the Wall's fall seemed inevitable. Schabowski's mistake might be seen as a replaceable spark - if not that night, it would have happened soon after.

  Therefore, Dan would likely call it "coming anyway."

