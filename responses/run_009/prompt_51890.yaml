  3. The distinction between "something-like-it-happens" and "exactly-it-happens" (whether the outcome would be fundamentally different)

  Dan also mentions "a necessary element of a sufficient set" from philosophy, which refers to INUS conditions - an insufficient but necessary part of an unnecessary but sufficient condition.

  Applying these to the Berlin Wall:

