prompt: |-
  I've been teaching applied ethics long enough that I really should have my commemoration views sorted, but my gut verdicts keep not lining up, so help me run reflective equilibrium on this. My verdicts: a Confederate general on a courthouse lawn should go, that one's easy. A statue of a genuinely great scientist who held views that were standard for his time but are repugnant now -- keep, plaque it. A street named after a local 1920s benefactor, where it turns out the money was made on labor practices that were brutal even by the standards of his own day -- rename, though I feel worse for the residents who have to change their addresses than for the guy's memory. Moving a toppled statue into a museum with full historical context rather than destroying it: obviously right. Destroying a statue deliberately, even illegally, when the community has petitioned for removal for decades and been ignored: I can't actually bring myself to condemn it, which is awkward for me as a rule-of-law person. And here's the pair I can't square: I want the brutal-but-typical-of-his-era benefactor renamed, but I want the repugnant-but-typical-of-his-era scientist kept and plqued, and I notice the scientist is famous and the benefactor is local, and I don't think fame should buy that much forbearance. Is there a principle that gets all these -- something like "what was the statue honoring, and when" rather than "how bad was the man" -- or do I have to drop one? Give me your best principle stated precisely, tell me which clause does which bit of work, apply it to a couple of cases I haven't listed (maybe a war memorial with one name among many that turns out to be a war criminal, or a building named after someone whose reputation was entirely manufactured by the honoree's own PR machine decades after their death), and be honest about which of my verdicts your principle can't save. Lead with the bottom line in your first sentence, then the reasoning -- no preamble, dont restate my cases back at me.
reasoning: |-
  Okay, the user is an applied ethics professor struggling to reconcile their intuitive judgments about commemorative justice cases. They've listed several specific scenarios where their gut reactions conflict, particularly around when to remove/keep names or statues. 

  Hmm, their core tension is between wanting to rename a local benefactor with brutal labor practices (despite those practices being typical for his era) while keeping a famous scientist whose repugnant views were also era-typical. They're suspicious that fame shouldn't grant such leniency, and they want a principle that resolves all their cases without abandoning any intuitions.

  *scratches head* Their existing framework seems to prioritize contextual harm over historical typicality. But that doesn't explain the scientist/benefactor discrepancy. Maybe... the commemorative function is key? Like, what the statue actively celebrates versus what's merely acknowledged. 

  *starts drafting principle* Focus on: (1) Does the honor actively perpetuate harm? (2) Was the honored trait itself morally problematic even contextually? (3) Is the context inseparable from the honor? 

  Testing on their cases: Confederate statue clearly celebrates racism → remove. Scientist statue celebrates scientific achievement → keep with plaque. Benefactor street celebrates philanthropy built on brutality → rename. 

  *winces at the illegal destruction case* The principle says removal was necessary, but can't endorse illegality. User might not love that. Also their sympathy for address-changing residents—this principle doesn't address that inconvenience, just the moral permissibility. 

  New test cases: War memorial with one war criminal? The honor is collective sacrifice; removing one name might be surgical. Building named after self-mythologized fraud? If the honor relies on false pretenses, stripping it seems valid. 

  *checks consistency* Ah—the fame discrepancy dissolves because the scientist's honor isn't tied to his repugnant views, while the benefactor's wealth is inherently tied to exploitation. Not about fame; about what's being glorified. 

  *self-critique* Principle fails to capture user's rule-of-law unease about illegal removals. Also doesn't weigh practical harms (like address changes). But it saves all their other verdicts. Should name this the "Commemorative Harm Principle" for clarity.
answer: |-
  **Bottom line:** Your verdicts can be reconciled by a principle focusing on **the specific justification for the commemoration and whether that justification remains morally tenable or is inherently linked to the harm, considering both historical context and present impact.**

  **The Principle (Commemorative Harm Principle):**
  *A commemoration should be removed, renamed, or significantly recontextualized if either:*
  1.  **The primary trait or achievement being honored is intrinsically linked to significant, contextually indefensible harm** (even if common at the time), *or*
  2.  **The commemoration itself actively perpetuates significant present-day harm or injustice**, *and this harm outweighs the value of preserving the commemoration in its current form for historical or educational purposes.*

  **Clause Breakdown & Work:**
  *   **Clause 1:** Targets the *honor itself*. Does the reason we put this thing up celebrate something inherently harmful, even by the standards of its own time? This clause does the heavy lifting for the Confederate general (honoring treason for slavery), the brutal benefactor (honoring philanthropy built on exceptional brutality), and likely the self-mythologized PR figure (honor based on false pretenses). It saves your "brutal benefactor rename" verdict.
  *   **Clause 2:** Addresses *present impact*. Even if the original honor wasn't *intrinsically* linked to indefensible harm (Clause 1), does the monument *now* cause significant, ongoing harm that outweighs its preservation value? This clause saves your "repugnant scientist kept/plaqued" verdict (honors science, not the repugnant views; harm mitigated by contextual plaque) and explains the Confederate removal again (active harm). It also permits moving a toppled statue to a museum (harm mitigated by context). It captures your reluctant acceptance of illegal removal after decades of ignored petitions (harm outweighed preservation value *in that location*).

  **Application to New Cases:**
  1.  **War Memorial with One War Criminal's Name:** *Keep the memorial, contextualize the name.* Clause 1 doesn't apply because the memorial honors collective sacrifice, not the war crimes. Clause 2 applies to the *individual name* – it could cause harm to victims. The solution isn't removing the whole memorial (valuable historical record of sacrifice) but adding context *specifically* to that name (e.g., "Listed here; later convicted of war crimes for actions unrelated to this service"). Removing just the name surgically might also be justified under Clause 2.
  2.  **Building Named After Self-Mythologized PR Creation:** *Rename.* Clause 1 applies strongly. The honor is based entirely on a false narrative manufactured by the honoree. There is no genuine praiseworthy achievement being commemorated; the justification itself is fraudulent and potentially obscures real harm or lack of merit.

  **Which Verdicts It Can't Save (Honest Assessment):**
  *   **Your sympathy for residents changing addresses:** The principle focuses on the *moral justification* for removal/renaming, not the practical inconvenience. It provides a reason *why* the renaming is justified (Clause 1 for the benefactor), but doesn't mitigate the real hardship for residents. Your feeling is valid but falls outside the scope of this ethical principle about commemoration itself.
  *   **Your refusal to condemn illegal destruction after decades of ignored petitions:** The principle explains *why* removal was morally necessary (Clause 2: harm outweighed preservation value *in situ*), justifying the *goal* of removal. However, it **does not** endorse the *illegal method*. As a principle focused on the ethics of commemoration, it remains silent on civil disobedience vs. rule of law. Your discomfort as a "rule-of-law person" persists because the principle doesn't address the means, only the ends concerning the commemoration's existence in that place. It saves your verdict that removal was *necessary*, but not necessarily your verdict on the *method* being non-condemnable.

  **How it Solves Your Scientist/Benefactor Tension:**
  *   **Scientist:** The statue honors scientific achievement (Clause 1 not triggered). Repugnant views, while harmful, aren't the *reason* for the statue. A plaque adds context, mitigating present harm (Clause 2 addressed), allowing preservation. Fame isn't the shield; the *nature of the honor* is.
  *   **Benefactor:** The street name honors philanthropy. However, if the philanthropy is *intrinsically linked* to brutality that was *exceptional even then* (Clause 1: "brutal even by the standards of his own day"), the very thing being honored is tainted by indefensible harm. The justification for the honor collapses *based on its own contemporary context*. Renaming is justified under Clause 1. Local vs. famous is irrelevant; the *link between the honor and the harm* is key.
