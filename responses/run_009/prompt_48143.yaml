prompt: |-
  Here's a weird thing about my company I keep turning over. We have an "Above and Beyond" award — quarterly, a shoutout at the all-hands plus a $100 gift card if you did something way outside your role, like the support guy who spent a weekend hand-migrating a customer's data so we didn't lose the account. Nobody thinks the people who don't do that kind of thing did anything wrong — it's not like skiping a deadline, no one gets talked to for merely doing their job. But at the same time, in performance reviews, "meets expectations" is quietly treated as a bad rating: it's the box managers check for someone they're about to put on a improvment plan, and when we had layoffs last year, the people who "just did their job" were the first to go. So in one breath going beyond the role is optional-but-praiseworthy, and in the next it's basically required, just with the requirement never stated out loud. What's going on here philosophically? What view of duty and obligation does this setup actually presuppose — is there really a category of acts that are good to do but not bad to omit, or does the review/layoff side reveal that the "optional" part was a fiction all along? And if there's no such category, what would the award itself have to become for the whole system to be consistent? Answer as exactly five numbered points, each one or two sentences, no intro or conclusion.
reasoning: |-
  Hmm, the user is describing a contradiction in their company's recognition system. On one hand, there's an "Above and Beyond" award that treats extraordinary efforts like weekend data migrations as optional-but-praiseworthy actions. On the other hand, merely meeting expectations in performance reviews is treated as a bad rating that can lead to improvement plans or layoffs. This creates a philosophical tension between what's presented as optional and what's functionally required.

  The user wants to understand what's happening philosophically - what view of duty and obligation this setup presupposes, and whether there's truly a category of actions that are good to do but not bad to omit. They're also asking how the award system would need to change for consistency if such a category doesn't exist.

  I need to break this down into five precise points. The core issue seems to be a conflict between stated norms and actual expectations. Philosophically, this resembles the concept of supererogation - actions that are morally good but not obligatory. But the company's practices suggest that what they call "above and beyond" is actually expected baseline performance.

  The contradiction lies in how "meets expectations" is treated. While officially framed as adequate, it's punished through PIPs and layoffs, revealing that the optionality of going beyond is illusory. This creates a bait-and-switch dynamic where employees are praised for extraordinary efforts while simultaneously being penalized for not making them.

  For the system to be consistent, the award would need to transform into something that genuinely recognizes optional extras without making them de facto requirements. This might involve decoupling it from performance evaluations or reframing expectations more honestly.

  The user seems frustrated by this inconsistency, likely wanting both philosophical clarity and practical solutions. They might be looking for validation of their perception that the system is unfair or hypocritical. The answer should address both the theoretical underpinnings and practical implications while sticking to the requested five-point format without introduction or conclusion.
answer: |-
  Here are five numbered points addressing the philosophical inconsistency:

  1.  The system relies on a *false category* of supererogation (good beyond obligation) by implicitly converting it into *expected baseline performance*. What is nominally "above and beyond" is functionally required for job security.
  2.  It presupposes a *shifting baseline* of obligation: the official job description defines "duty," but the *real* duty (revealed in reviews/layoffs) includes extra-role contributions to meet unstated survival thresholds.
  3.  The "meets expectations" rating reveals the contradiction: it linguistically implies adequate fulfillment of duty but is operationally treated as *culpable underperformance*, punishing the omission of the supposedly optional "above and beyond" acts.
  4.  The "optional" nature of the praised acts is exposed as a *fiction* by the consequences of omission (PIPs, layoffs); the award exists primarily to *incentivize* what is secretly mandatory, not to recognize true voluntarism.
  5.  For consistency, the award must become *genuinely optional* recognition, decoupled from performance survival; this requires redefining "meets expectations" as truly sufficient and reserving PIPs/layoffs for *actual* failures against stated core duties.
