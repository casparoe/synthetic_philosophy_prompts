prompt: |-
  After years in corporate fundraising I've unexpectedly joined the grant committee of a small family foundation that gives away roughly two million pounds a year across a scatter of causes, and the trustees have decided we can no longer just fund whoever has the best photos in their annual report. They've settled on the importance–tractability–neglectedness framework after reading about it somewhere, but nobody on the committee has any analytic training, and our last attempt collapsed into trustees awarding each cause a score out of ten for each factor and multiplying. Please write a decision procedure the committee could actually run in a two-hour meeting on each shortlisted proposal: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it must hand the decision back to the trustees because the question is one of values rather than facts. I'd like the procedure to grapple honestly with the places where the framework bends — the fact that a cause's neglectedness score shifts the moment we fund it, that tractability estimates usually come from the applicants themselves, and that importance refuses to aggregate when you're comparing small certain harms against large unlikely ones. Then run it on three actual dilemmas from our current docket: a research programme on lead exposure in low-income countries, a community literacy scheme in our home city whose importance is modest but whose outcomes we could measure almost perfectly, and a speculative early-career grant programme in pandemic preparedness that may achieve nothing visible for a decade. Include at least one case where the procedure yields an answer the trustees will hate, and say plainly what the procedure cannot settle.
reasoning: |-
  Okay, the user has a complex situation. They're transitioning from corporate fundraising to managing a small family foundation's grant committee. The trustees want to move beyond superficial criteria like glossy photos to using the importance-tractability-neglectedness (ITN) framework, but they're struggling with implementation. 

  Hmm, their last attempt failed because trustees were just scoring each factor out of ten and multiplying - that's a common but flawed approach. The user clearly recognizes the framework's limitations: neglectedness changes when funding occurs, tractability data comes from biased sources, and importance comparisons are messy. Smart observer.

  They need a practical decision procedure for 2-hour meetings. The real challenge is making ITN operational for non-analysts while acknowledging its wrinkles. And they want it tested on three real cases where the framework bends or breaks. 

  Let me unpack their deeper needs:
  - They're probably feeling overwhelmed by the sudden analytical demand
  - There's tension between rigorous assessment and trustee preferences
  - They need cover to say no to beloved projects using objective criteria
  - The foundation likely faces pressure to fund locally despite global opportunities

  For the decision procedure, it must be:
  1) Sequential to avoid premature scoring 
  2) Conversational with clear exit ramps 
  3) Value-explicit at key junctions 
  4) Time-boxed for practicality

  The three test cases are perfectly chosen to stress-test ITN:
  - Lead research (global importance but uncertain tractability)
  - Local literacy (measurable but incremental impact)
  - Pandemic prep (high stakes but long horizon)

  The pandemic case will be the trustees' pain point - it fails ITN despite its appeal. Must emphasize that the procedure can't resolve value conflicts about time horizons or local vs global. 

  Biggest insight: The procedure's real power isn't choosing winners, but cleanly eliminating 80% of proposals so trustees can focus deliberation on the ambiguous 20% where values must dominate. That's where I'll position its utility.
answer: |-
  Here's a decision procedure designed for a 2-hour meeting per proposal, grappling honestly with ITN's complexities, followed by analysis of your three cases:

  **Decision Procedure: Structured ITN Interrogation**

  **Core Principle:** **Sequential Elimination.** Each factor (Importance, Tractability, Neglectedness) is assessed *in order*. A "No" at any stage ends consideration. Only proceed if the previous factor is deemed sufficient. Values questions are explicitly flagged for trustee input.

  **(0) Pre-Meeting (Trustee Prep - 15 mins before discussion):**
  *   Circulate proposal & key metrics.
  *   Trustees individually note: 1 core value alignment question, 1 major concern about the evidence.

  **(1) Importance: "How much suffering is at stake?" (30 mins)**
  *   **Question 1:** *"What specific harm does this project aim to reduce or benefit does it aim to create? Quantify the scale (number affected, severity per person) in the clearest terms possible. What is the source of this estimate?"*
      *   *Sufficient Answer:* Clear definition of the outcome, credible source (e.g., peer-reviewed study, reputable agency data), attempt at quantification (even if ranges/uncertain). Avoids vague terms like "empowerment" without defined metrics.
      *   *Stop/No:* Outcome is ill-defined, completely unquantifiable, or demonstrably trivial in scale/severity *even if achieved*. Or, value conflict identified (e.g., trustees fundamentally disagree this *is* a harm/benefit).
  *   **Question 2:** *"Compared to other causes we see, how does this scale/severity rank? Is the harm certain for the affected population, or is it a risk (low-probability/high-impact)? If a risk, what's the best estimate of probability?"*
      *   *Sufficient Answer:* Contextual comparison (e.g., "affects 50k people with severe disability vs. our usual causes affecting 10k mildly"). For risks, a stated probability estimate with source.
      *   **Values Hand-Back Trigger:** **Comparing Certain vs. Uncertain Harms.** If the proposal involves a *small, certain, immediate harm* vs. a *large, uncertain, future harm* (or vice-versa), and trustees fundamentally disagree on which deserves priority, STOP. Flag: *"Committee cannot resolve values trade-off between near-term certainty and long-term scale/risk. Trustees must decide priority."*
  *   **Outcome:** Proceed only if Importance is deemed sufficiently high *relative to our portfolio* and no unresolvable values conflict exists.

  **(2) Tractability: "Can *this specific project* make a dent?" (30 mins)**
  *   **Question 3:** *"What is the specific causal pathway? (Inputs -> Activities -> Outputs -> Short-Term Outcomes -> Long-Term Impact). Where does this project sit on that pathway?"*
      *   *Sufficient Answer:* A logical chain, even if simplified. Clear statement of what the grant *directly* funds (e.g., research, pilot program, core delivery).
      *   *Stop/No:* Pathway is incoherent, magical thinking ("raise awareness" leading directly to massive policy change), or project is misaligned (funding basic research when the bottleneck is delivery).
  *   **Question 4:** *"What evidence supports the effectiveness of *this approach* for *this problem*? How strong is that evidence? (e.g., RCT, pilot data, theory, expert consensus?)"*
      *   *Sufficient Answer:* Evidence directly relevant to the proposed *method* in a *similar context*. Strength acknowledged (e.g., "strong RCT in similar setting", "promising pilot data here", "theoretically sound but novel"). Applicant's claims are scrutinized ("They cite X study, which actually looked at Y different intervention").
      *   *Stop/No:* No credible evidence beyond applicant assertion. Evidence strongly contradicts the approach. Project is fundamentally untestable.
  *   **Question 5:** *"What are the key assumptions? Which are most likely to fail? What's the applicant's plan if they do?"*
      *   *Sufficient Answer:* Key assumptions identified (e.g., "community engagement", "partner cooperation", "technology works as lab-tested"). Realistic mitigation/contingency mentioned.
      *   **Values Hand-Back Trigger:** **Risk Tolerance.** If tractability hinges on highly uncertain breakthroughs or complex systemic change with high failure risk, and trustees fundamentally disagree on funding high-risk/high-reward vs. lower-risk/lower-reward, STOP. Flag: *"Committee assesses technical pathway as [High/Medium/Low] risk. Trustees must decide if this level of risk aligns with foundation's appetite."*
  *   **Outcome:** Proceed only if the project has a plausible, evidence-informed pathway to impact and risk level is acceptable *or* flagged for trustee values decision.

  **(3) Neglectedness: "Is our funding likely to be decisive?" (20 mins)**
  *   **Question 6:** *"What other significant funding exists for *this specific problem* using *this specific approach* in *this specific geography/population*? What are the major funders (govt, other foundations, individual donors) and their recent commitments?"*
      *   *Sufficient Answer:* Applicant provides landscape; committee cross-checks with basic desk research (quick Google, foundation directories). Focus on *close substitutes*.
      *   *Stop/No:* The field is demonstrably saturated with well-funded players pursuing identical approaches. Our grant is a drop in a very full bucket.
  *   **Question 7:** *"If we fund this, how likely is it to catalyze significantly more funding (crowding-in) or displace other funding (crowding-out)?"*
      *   *Sufficient Answer:* Applicant provides rationale (e.g., "proof of concept to attract govt", "filling a unique niche others avoid"). Committee assesses plausibility.
      *   **Values Hand-Back Trigger:** **Marginal Impact & Values.** If funding is *highly* likely to crowd-in others (making our grant catalytic) OR *highly* likely to crowd-out others (making it redundant), STOP. Flag: *"Committee predicts significant [crowding-in/crowding-out]. Trustees must decide if catalytic potential justifies funding OR if displacement is acceptable given our values."* **Acknowledge the Bend:** Explicitly state: *"Note: Funding this will *reduce* its neglectedness score for future funders."*
  *   **Outcome:** Proceed only if the space is not saturated, and our grant has a plausible chance of being decisive/catalytic, or the crowding-in/out question is flagged for values.

  **(4) Synthesis & Decision (10 mins)**
  *   Reiterate: Passed Importance? Passed Tractability? Passed Neglectedness? Any Values Flags?
  *   If all passed with no flags: **Recommend Funding.**
  *   If eliminated at any stage: **Recommend Decline.**
  *   If Values Flags exist: **Recommend Trustees Discuss & Vote** based *only* on the flagged values question(s).

  ---

  **Analysis of Your Cases:**

  1.  **Research Programme on Lead Exposure (Low-Income Countries)**
      *   **Importance (Pass):** Huge scale (millions of children affected globally). Severe harm (permanent cognitive/physical damage). Quantifiable via DALYs/economic cost. Credible sources (WHO, World Bank). **Proceeds.**
      *   **Tractability (Pass w/ Note):** Pathway: Research -> Identify sources/exposure routes -> Inform policy/intervention. Strong evidence research *can* lead to effective interventions (e.g., phased gasoline removal). Applicant likely experts. Assumption: Research will lead to actionable findings & adoption. Risk: Policy uptake isn't guaranteed. **Medium-High Tractability.** Proceeds (Risk likely acceptable).
      *   **Neglectedness (Hand-Back Trigger):** Field *is* neglected relative to scale, *but* significant players exist (e.g., Pure Earth, UNICEF). Key question: Is funding for *this specific research* (e.g., novel exposure pathways in Region X) neglected? Likely catalytic? Crowding-in probable? **Flag:** *"Trustees must decide: Does this specific research fill a critical neglected niche with high catalytic potential, or is it duplicative?"* **Decision:** Handed back for values on niche/catalytic potential.

  2.  **Community Literacy Scheme (Home City - Modest Importance, Perfect Measurability)**
      *   **Importance (Pass - Low Relative Scale):** Defined harm (low literacy -> poor outcomes). Quantifiable (# of low-literacy adults locally). Severity is real but per-person impact moderate compared to lead poisoning. **Proceeds** (but note: lower end of scale).
      *   **Tractability (Pass - High):** Pathway clear: Tutoring -> Improved test scores. Strong evidence for adult literacy programs. Outcomes *perfectly measurable* (pre/post tests). Low risk. **High Tractability.** Proceeds.
      *   **Neglectedness (Stop/No):** Local literacy is a crowded field. Government programs, large local charities, other foundations fund this. Our grant is unlikely to be catalytic or fill a unique gap; high risk of displacement/crowding-out. **Eliminated at Neglectedness.** **Decision:** Decline. *(Trustees may hate this - it's local, measurable, feels "safe" and "doable". The procedure forces confrontation with "Is this the *best* use of funds?")*

  3.  **Speculative Early-Career Grant Programme (Pandemic Preparedness)**
      *   **Importance (Hand-Back Trigger):** Enormous potential harm (catastrophic pandemics). BUT: Low probability? (Experts disagree - could be 1%/yr, could be less). **Values Hand-Back Trigger:** *"Committee cannot resolve values trade-off: Funding tackles a potential catastrophe of immense scale (millions+ deaths) but very low annual probability vs. funding more certain, immediate harms affecting thousands now. Trustees must decide priority on certainty vs. scale/risk."* **Decision:** Handed back *immediately* after Importance. (Tractability/Neglectedness irrelevant until values settled).

  **What the Procedure Cannot Settle (Plainly Stated):**

  1.  **Fundamental Value Conflicts:** It can only *flag* when choices involve deep, irreconcilable differences in values (e.g., certainty vs. catastrophic risk, local vs. global focus, funding high-risk science vs. proven delivery). Trustees *must* own these decisions.
  2.  **Comparing Radically Different Goods:** Aggregating "lives saved from lead" vs. "adults gaining literacy" vs. "reducing existential risk" at a fundamental level requires value judgments the procedure can't make. It forces relative comparison *within the portfolio context* but cannot create a universal metric.
  3.  **Predicting the Unpredictable:** While it forces scrutiny of evidence and assumptions, it cannot eliminate uncertainty, especially for long-term, speculative bets. It clarifies the *level* of uncertainty for trustees.
  4.  **Defining "Sufficient" Importance/Tractability/Neglectedness Thresholds:** The absolute bar for "high enough" is a foundation value set by trustees, informed by the portfolio. The procedure ensures consistent *application* once the bar is set.
  5.  **The Crowding Paradox:** It highlights the issue (funding reduces neglectedness), but whether catalytic potential outweighs this, or whether displacement is acceptable, remains a values call.

  **Why this works for your committee:**

  *   **Structured & Sequential:** Prevents "score-and-multiply." Forces focus on one factor at a time.
  *   **Time-Boxed:** Fits 2 hours. Prevents endless debate.
  *   **Concrete Questions:** Asks for specific evidence, pathways, comparisons.
  *   **Explicit Exit Ramps:** Clear "No" criteria and Values Flags.
  *   **Acknowledges Complexity:** Builds in discussion of bends (neglectedness shift, applicant bias in tractability, certainty vs. risk).
  *   **Protects Committee:** Provides clear rationale for tough decisions (like declining the local literacy scheme) and cleanly hands unresolvable value conflicts back to trustees.
  *   **Focuses Trustee Effort:** Trustees only deliberate deeply on the flagged values questions, not the entire proposal.

  This procedure won't remove all subjectivity, but it creates rigor, transparency, and forces honest engagement with the ITN framework's strengths *and* limitations within the constraints of your committee and meeting time.
