prompt: |-
  When U.S. regulatory agencies evaluate a rule, they routinely monetize the mortality benefits using a single "value of a statistical life" — an estimate derived mainly from revealed preference, i.e., the wage premiums workers accept for riskier jobs — and then sum those dollars together with compliance costs across all affected parties into one net-benefit figure. Yet the neoclassical economics that grounds this practice insists that utility is ordinal only, that it cannot be compared across persons, and that one person's gain cannot be stacked against another's loss; the revealed-preference method itself adds that choices under constrained options reveal welfare. What theory of value does cost-benefit analysis actually presuppose here? Is it that dollars, not utils, serve as a common currency (a potential-compensation story in the Kaldor–Hicks tradition), that market choices are authoritative even about life and health, or something else? Reconstruct the implicit view, say whether it is coherent in light of the objections economists themselves raise — that willingness-to-pay tracks ability to pay, that risk wages reflect desperation as much as valuation — and tell me what would have to change in the practice if agencies instead treated preferences as one input among several rather than as the measure of welfare.
reasoning: |-
  Okay, let me unpack this user's query. They're asking about the theoretical foundations of cost-benefit analysis (CBA) in U.S. regulatory agencies, specifically regarding how agencies monetize mortality benefits using the Value of Statistical Life (VSL). The user points out a contradiction: neoclassical economics treats utility as ordinal and non-comparable across individuals, yet CBA aggregates monetary values across people. The user wants to know what theory of value underpins this practice, whether it's coherent given economists' own critiques, and how the practice would change if agencies treated preferences as just one input among several.

  First, I need to recall the key elements of neoclassical welfare economics. Utility is indeed ordinal and non-comparable. The Kaldor-Hicks criterion is central here—it's about potential compensation, not actual compensation. VSL comes from revealed preferences, like wage premiums for risky jobs. The user mentions critiques like willingness-to-pay being tied to ability to pay and wage premiums reflecting desperation. I should address those.

  The implicit theory here is Kaldor-Hicks efficiency. Dollars are used as a common metric because actual utils can't be compared. But the critiques are valid. VSL might be higher for wealthier people, and workers in risky jobs might not have real alternatives. So the practice assumes market choices are authoritative, but that ignores context and inequality.

  The user also asks how CBA would change if preferences weren't the sole measure. Alternatives could include using a standardized VSL regardless of income, incorporating equity weights, or considering other ethical principles. That would make CBA more complex and less tied to market choices alone. But it might address fairness concerns. 

  I should structure the answer to first explain the implicit theory, then the critiques, then the alternatives. The user seems knowledgeable in economics, so I can use terms like Kaldor-Hicks and Pareto without oversimplifying. They're likely an academic or policy analyst looking for a nuanced critique. Their deeper need might be to understand whether current regulatory practices are ethically defensible and what alternatives exist. 

  I need to ensure I cover all parts: the presupposed theory, coherence given objections, and changes if preferences aren't primary. Also, emphasize that while Kaldor-Hicks is internally consistent, its real-world application faces issues like distributional effects and constrained choices. Moving away from strict revealed preferences would involve value judgments beyond efficiency, which agencies might not be equipped to handle but could be necessary for fairness.
answer: |-
  The practice you describe rests on a **Kaldor-Hicks potential compensation criterion**, implicitly treating dollars (as a proxy for willingness-to-pay/revealed preference) as an interpersonally comparable measure of welfare impact, despite neoclassical economics formally rejecting interpersonal utility comparisons. This creates a fundamental tension.

  **The Implicit Theory of Value Presupposed:**

  1.  **Kaldor-Hicks Efficiency as the Normative Goal:** CBA's core aim is not Pareto improvement (where no one is worse off) but Kaldor-Hicks efficiency: a change is desirable if the winners *could* hypothetically compensate the losers and still be better off (potential compensation), *regardless of whether compensation actually occurs*. This bypasses the need for actual interpersonal utility comparisons by focusing on monetary gains and losses.
  2.  **Money as the Common Currency:** Dollars, derived from revealed preferences (willingness-to-pay/willingness-to-accept compensation), are treated as a measurable, additive, and interpersonally comparable *proxy* for welfare changes. A dollar gained or lost is assumed to represent an equivalent welfare change regardless of who experiences it, *for the purposes of aggregate calculation*. This transforms the ordinal, non-comparable concept of utility into a cardinal, comparable metric via market behavior.
  3.  **Revealed Preference as Authoritative Welfare Measure:** The theory presupposes that individuals' choices in markets (even constrained markets like labor) are the best, objective, and *authoritative* revelation of their true preferences and valuations. If a worker accepts $X more per year for a 1/10,000 higher annual risk of death, this revealed preference *definitively* establishes that their VSL is $X * 10,000. It assumes choices reflect informed, rational trade-offs based on underlying welfare.
  4.  **Consumer Sovereignty Extended to Life/Health:** The practice extends the principle of consumer sovereignty – that individuals are the best judges of their own welfare – into domains like mortality risk. It assumes the value derived from market choices about risk (wage premiums) is the correct basis for valuing mortality reductions in regulatory contexts. The market is seen as the arbiter of value, even for non-market goods like life and health, through revealed trade-offs.

  **Coherence in Light of Economists' Objections:**

  The implicit view is **internally coherent within its own narrow Kaldor-Hicks framework** but **profoundly fragile and normatively problematic** when confronted with real-world complexities and the foundational objections of welfare economics:

  1.  **Willingness-to-Pay Tracks Ability to Pay:** This is the fatal flaw for interpersonal comparability. A dollar means vastly different things to a billionaire and a minimum-wage worker. Using unadjusted WTP/VSL values from market data implicitly weights the welfare of the rich far more heavily than the poor. A regulation saving the lives of predominantly poor people will show lower monetized benefits than one saving wealthier lives, even if the *utility* gain (life saved) is identical. This violates the principle that utils are non-comparable and makes Kaldor-Hicks highly sensitive to the existing (often unequal) distribution of income/wealth.
  2.  **Risk Wages Reflect Desperation & Constrained Choice:** Labor markets are rife with imperfections: lack of information, limited job alternatives, unequal bargaining power, systemic discrimination, economic desperation. Workers accepting high risks for modest premiums may be revealing *lack of viable options*, not a genuine, uncoerced preference for that risk-wage trade-off. This undermines the claim that revealed preferences in such contexts accurately reflect underlying welfare or "true" valuation. It confounds preference with coercion.
  3.  **Ordinal Utility & Non-Comparability:** The entire practice of summing dollar gains/losses across individuals directly contradicts the core neoclassical tenet that utility is ordinal and cannot be compared between persons. Kaldor-Hicks *pretends* dollars solve this by being comparable, but dollars only measure *potential* compensation capacity, not actual utility equivalence. It's a pragmatic workaround that ignores the theoretical limitation.
  4.  **Existence of Non-Welfarist Values:** The practice assumes welfare (as revealed by preference) is the *only* relevant value. It ignores other ethical considerations (equity, fairness, rights, justice, the intrinsic value of life) that society or policymakers might deem important, regardless of individual WTP.

  **Conclusion on Coherence:** While logically consistent *if one accepts the Kaldor-Hicks criterion and the dollar-as-welfare-proxy assumption*, the practice is **theoretically inconsistent** with the fundamental ordinal/non-comparable view of utility in neoclassical welfare economics. Its coherence breaks down dramatically when confronted with the realities of income inequality, market imperfections, and constrained choices that economists themselves highlight. It prioritizes potential efficiency gains while systematically undervaluing the welfare of the poor and vulnerable and ignoring non-preference-based values.

  **Changes if Preferences Were One Input Among Several:**

  Moving away from treating revealed preference/WTP as the *sole authoritative measure* of welfare would necessitate significant shifts:

  1.  **Equity Weights:** Explicitly adjust VSL or benefit valuations based on income/wealth. A dollar benefit to a poor person would count for more in the analysis than a dollar benefit to a rich person, attempting to account for diminishing marginal utility of income and equity concerns. This directly tackles the ability-to-pay objection but requires normative judgments about the social welfare function.
  2.  **Contextual Analysis of Revealed Preferences:** Scrutinize the labor market data used to estimate VSL. Adjust for factors like:
      *   **Information Gaps:** Were workers truly informed about risks?
      *   **Job Alternatives:** Did workers have meaningful choices, or was the risky job the only option?
      *   **Bargaining Power:** Were premiums suppressed due to weak unions or employer monopsony?
      *   **Vulnerability:** Does the sample reflect workers under economic duress?
      This could lead to "corrected" VSL estimates or using only data from contexts deemed reasonably competitive and informed.
  3.  **Incorporating Stated Preference & Deliberative Methods:** Supplement revealed preference with stated preference (contingent valuation surveys) designed to elicit valuations in hypothetical but informed scenarios, potentially incorporating equity considerations. Use deliberative methods (citizen juries, focus groups) to derive socially considered valuations of life/health, potentially reflecting collective values beyond individual WTP.
  4.  **Non-Monetary Benchmarks & Multi-Criteria Analysis (MCA):** Treat monetized CBA as *one input* alongside other criteria:
      *   **Distributional Analysis:** Explicitly report who bears costs and who receives benefits (e.g., by income quintile, region, race).
      *   **Rights/Fairness Analysis:** Consider if the rule respects fundamental rights or promotes fairness, even if costly.
      *   **Qualitative Health/Environmental Benefits:** Describe significant non-monetizable impacts qualitatively.
      *   **Precautionary Principle:** Apply in cases of severe uncertainty or irreversible harm, even if benefits are hard to monetize.
      Decision-making would then involve weighing the CBA result *alongside* these other criteria, not being dictated solely by the net-benefit figure.
  5.  **Transparency on Normative Choices:** Acknowledge that moving away from pure revealed-preference CBA involves unavoidable normative judgments (e.g., choosing equity weights, defining "acceptable" constraints on choice, prioritizing non-welfarist values). This transparency is crucial.

  **In essence:** Treating preferences as one input rather than the measure requires abandoning the pretense that dollars summed via revealed preference provide a uniquely objective, value-neutral measure of net welfare gain. It necessitates explicit consideration of distributional justice, market imperfections, non-welfarist values, and potentially deliberative democratic input, making regulatory evaluation more complex, context-dependent, and overtly normative, but potentially more ethically defensible and aligned with broader societal goals.
