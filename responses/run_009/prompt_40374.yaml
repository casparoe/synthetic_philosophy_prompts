prompt: |-
  I'm a software engineer, no philosophy training, but I do A/B testing for a living and read decision theory stuff in the evenings, so I know about Good's theorem — the result that the expected value of information is never negative: if an observation costs nothing and you get to pick your act after seeing it, then observe-then-decide is never worse in expectation than deciding blind. I buy the theorem; it's basically the law of total expectation once you write it down.

  Here's my argument, and I can't break it:

  1. Good's theorem: costless information, followed by choosing the best act, weakly dominates choosing now.
  2. "Costless" should mean what it says — no money, no time, no compute.
  3. So any observation that costs me nothing — an email I could open, a medical scan, Ulysses hearing the sirens' song from the mast — cannot make my expected outcome worse.
  4. Therefore refusing to look at costless information is always irrational: it forfeits a weakly dominating option.
  5. But precommitment devices — burning your ships, tying yourself to the mast, not keeping cookies in the house, avoiding the dessert menu — are exactly refusals to receive costless information, plus a tying-down of your future act.
  6. So precommitment is irrational, or at best rational precisely in the cases where it seems most obviously sensible.
  7. That can't be right. Ulysses was not an idiot.

  I can feel the sleight of hand is somewhere in steps 2 to 3 — in what "costless" and "observation" are allowed to do to you — but I cant pin it down, and I'd like to keep step 1 if I possibly can. Which premise do I give up, what does giving it up cost me, and does the theorem itself come with fine print that I wasn't told about? Please answer in British English, name the step you reject in your first sentence, and keep it under 400 words.
reasoning: |-
  Okay, the user is a software engineer who works with A/B testing and has been reading decision theory. They're grappling with Good's theorem and how it seems to contradict the rationality of precommitment devices like Ulysses tying himself to the mast. They've laid out a clear argument with steps, and they feel the flaw is between steps 2 and 3. They want me to identify which premise to reject, explain why, and do it in British English under 400 words.

  First, I need to recall Good's theorem: it states that the expected value of information is never negative when the information is costless and you can choose the best act after observing it. The user's argument concludes that precommitment devices are irrational because they involve refusing costless information. But that clashes with examples like Ulysses, which are clearly sensible.

  The user suspects step 2 or 3 is the problem. Step 2 defines "costless" as no money, time, or compute. Step 3 says that any such observation can't make outcomes worse. But in precommitment scenarios, the "observation" itself might have hidden costs. For instance, hearing the sirens' song isn't just free data—it could trigger irresistible urges that change your decision-making ability. That's not captured by the theorem's definition of costless.

  Good's theorem assumes that your decision-making remains consistent after observation. But if the observation alters your preferences or self-control, it's not truly costless in the decision-theoretic sense. The cost here is endogenous—it arises from how the information affects you internally, like temptation or weakness of will. That's why Ulysses avoids hearing the song; the observation isn't harmless.

  I should reject step 3. The flaw is that "costless" in Good's theorem doesn't account for psychological or internal costs that change your ability to choose rationally post-observation. Precommitment works precisely because it avoids these costs. So the theorem holds, but its application needs careful boundaries—when observations carry implicit costs to decision integrity, refusing them can be rational.

  This explains why Ulysses wasn't an idiot: he recognized the observation wasn't costless in practice. The user can keep step 1, but must refine what "costless" means beyond just external resources. Giving up this premise costs some simplicity, but it saves the rationality of precommitment. Now, I need to phrase this concisely in British English, starting by naming step 3 as the reject, and stay under 400 words.
answer: |-
  Right, the flaw is in **step 3**. You're overlooking that "costless" must mean *only* no external resource cost *and crucially* that the observation doesn't *itself* alter your decision-making capabilities or preferences in a way that harms your ability to choose the best act afterwards.

  Good's theorem assumes your utility function and choice mechanism remain stable before and after the observation. Precommitment devices exist precisely because certain observations *aren't* costless in this deeper sense – they trigger irresistible temptation, akrasia (weakness of will), or a fundamental shift in your preferences that you *know beforehand* will lead you to choose a worse option than you would choose blind *or* than you can secure via precommitment.

  Hearing the sirens' song isn't just free auditory data; it fundamentally overwhelms Ulysses's will, making the "best act" *after* hearing it (steering towards them) worse than the best act *without* hearing it (staying safe) *and* worse than the act he secured via precommitment (being tied up). The "cost" is endogenous – the observation *destroys* his future rational agency concerning that choice. Refusing the information isn't forfeiting a dominator; it's avoiding a landmine that cripples your future decision-making power.

  The theorem holds, but its domain excludes cases where the observation itself predictably corrupts the agent's subsequent choice function. Precommitment is rational precisely when the information, while externally free, carries this internal cost to your future self's rationality. Ulysses was wise, not daft.

