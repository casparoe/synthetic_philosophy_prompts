  Similarly, Q5: bird's nest, no human artist intention? The displayer has intention, but the creator (bird) does not. So if they say yes, they don't require creator's intention.

  For cluster, they typically require some of the features but not any particular one.

  For the quiz, we can say that if the student's answers show that they do not require any one feature (by saying yes to cases that lack each feature), then they are cluster.

  But it's complex for a quick quiz.

  Alternatively, we can have a separate question that directly tests necessity.

  For example, we can add a question at the end:

  Question 9: Which of the following do you think is absolutely necessary for something to be art? (Choose one)
     A) That it provides an aesthetic experience.
     B) That it is created by an artist with the intention to make art.
     C) That it is accepted as art by the artworld.
     D) None of the above; no single feature is necessary.

  Then, this directly separates AF, IH, IT, and cluster/anti-essentialist.

  But this tips off the necessity question.

  Given the time, we might do without.

  We'll proceed with 8 questions and then in the scoring key, we'll have:

  Count the number of times you chose:

     For AF: Q1A, Q2B, Q3C, Q4A, Q5A, Q6C, Q7B, Q8A
     For IT: Q1C, Q2C, Q3B, Q4B, Q5C, Q6A, Q7A, Q8C
     For IH: Q1B, Q2C, Q3A, Q4C, Q5B, Q6A, Q7C, Q8B

  The theory with the highest score is your primary alignment.

  If there is a tie, or if your answers are mixed, you might be cluster or anti-essentialist.

  Then, for cluster, if you have:
     - Said yes to at least one of: Q3 (certificate) or Q6 (disgusting) [lacking traditional aesthetic]
     - Said yes to at least one of: Q5 (bird's nest) or Q8 (driftwood) [lacking institutional acceptance? But home display might not be institutional] 
     - Said yes to at least one of: Q7 (child's scribble) or Q4 (AI) [lacking human intentional creation? For AI, the human's role is minimal]

  But for Q4, if they said B (yes because contest), then it has institutional acceptance.

  This is not perfect.

  Alternatively, we can have the students see which theory they match most, and then discuss the limitations.

  In the reveal, we can explain the theories and how they would answer, and then the students see where they fit.

  Time is short, so we'll go with the matching.

  Finally, the quiz:

  **Art Definition Quiz**

  Instructions: For each question, read the case and choose the answer that best reflects your view.

  1. **The Forged Painting**: A painting is a perfect replica of a famous masterpiece, created by a forger to deceive and sold as the original. It fooled experts for decades but is now known to be a forgery. Is it a work of art?
     A) Yes, because it provides the same aesthetic experience as the original.
     B) Yes, because it was created by an artist (the forger) who intended it to be received as art and fits within the art tradition.
     C) No, because it is a forgery and lacks the proper institutional or historical status.

  2. **The Urinal**: Marcel Duchamp's "Fountain" (a signed urinal) is displayed in a museum. An identical urinal is at a hardware store. Which statement do you agree with?
     A) Both are art because they have identical aesthetic properties.
     B) Only the museum one is art because it is presented for aesthetic contemplation.
     C) Only the museum one is art because the artworld (artist and museum) has conferred art status upon it.

  3. **The Conceptual Certificate**: An artist sells a certificate that states: "The owner of this certificate is authorized to draw a single line on any wall. The certificate is the artwork." The buyer never draws the line. Is the certificate an artwork?
     A) Yes, because the artist intended it as art and it is part of the art historical tradition.
     B) Yes, because the artworld (galleries, collectors, etc.) recognizes it as art.
     C) No, because it does not provide an aesthetic experience and is just an idea.

  4. **AI-Generated Image**: An image created by an AI (with a human typing one prompt and selecting from 40 variations) wins a photography contest. Is this image a work of art?
     A) Yes, because it has aesthetic value and the human provided creative input.
     B) Yes, because the artworld (the contest) accepted it as art.
     C) No, because art requires substantial human intentional creation, and the AI did most of the work.

  5. **Bird's Nest on Pedestal**: A person finds a beautifully constructed bird's nest and displays it on a pedestal in their home, calling it art. Is it art?
     A) Yes, because it has aesthetic qualities and is presented for appreciation.
     B) Yes, because the person's act of displaying it with artistic intention makes it art.
     C) No, because it is a natural object, not created by an artist for artistic purposes.

  6. **Disgusting Work**: An artist displays a piece of rotting meat in a gallery, intending to provoke disgust. Nobody enjoys looking at it. Is it art?
     A) Yes, because it is presented in an art context (gallery) and the artist intended it as art.
     B) Yes, because it successfully provokes a strong emotional response, which is a kind of aesthetic experience.
     C) No, because art must provide a positive aesthetic experience, and this does not.

  7. **Child's Scribble**: A child randomly scribbles on paper. An art collector frames it and displays it in a gallery as art. Is the scribble an artwork?
     A) Yes, because it is now displayed in an art context (gallery) and accepted by the artworld.
     B) Yes, because it has interesting formal qualities that can be appreciated aesthetically.
     C) No, because the child had no artistic intention, and it was a random act.

  8. **Driftwood "Sculpture"**: A beachcomber finds a piece of driftwood that has been naturally eroded into an interesting shape. They clean it and display it in their home as art. They did not carve or alter it. Is it art?
     A) Yes, because it has aesthetic qualities and is displayed for appreciation.
     B) Yes, because the beachcomber's act of selection and display with artistic intention makes it art.
     C) No, because it is a natural object, not created by the beachcomber.

  **Scoring Key**

  Tally your answers and see which theory you match the most:

  - **Aesthetic Functionalism (AF)**: Count how many of these you chose: Q1A, Q2B, Q3C, Q4A, Q5A, Q6C, Q7B, Q8A
  - **Institutional Theory (IT)**: Count how many of these you chose: Q1C, Q2C, Q3B, Q4B, Q5C, Q6A, Q7A, Q8C
  - **Intentional-Historical (IH)**: Count how many of these you chose: Q1B, Q2C, Q3A, Q4C, Q5B, Q6A, Q7C, Q8B

  The theory with the highest score is your primary alignment. If you have a tie or your answers don't align well with one theory, you might lean towards:

  - **Cluster/Disjunctive View**: If you believe that art can be defined by a disjunction of properties (like aesthetic qualities, institutional acceptance, authorial intention, etc.) and no single property is necessary, then your answers may be mixed. You likely said "yes" to at least one case that lacks traditional aesthetic experience (e.g., Q3 or Q6), to at least one that lacks institutional acceptance (e.g., Q5 or Q8), and to at least one that lacks authorial intention by the creator (e.g., Q7 or, to some extent, Q4).

  - **Anti-Essentialism**: If you think 'art' cannot be defined by any set of necessary and sufficient conditions, you might have found many questions difficult and your answers may not fit a pattern. You might have chosen "no" for some cases that others would say are clearly art, or vice versa.

  Note: This quiz is a simplification. The theories often have nuanced positions, and your answers might overlap with multiple theories.

  **Time Estimate**:
  - Quiz: 10 minutes (8 questions, about 1 minute per question plus 2 for instructions)
  - Scoring: 5 minutes
  - Reveal and initial discussion: 15 minutes
  - Total: 30 minutes, leaving 20 minutes for open discussion.

  This fits within 50 minutes.

  In the reveal, you can explain each theory and how they would answer the cases, then discuss the results.

  Let me know if you need adjustments.
answer: |-
  Below is a complete "Which Definition of Art Do You Actually Hold?" quiz designed for your tutorial session. It's built around concrete cases to surface pre-theoretical intuitions, with 8 questions (each with 2-3 options). The cases prioritize your requested examples while covering a range of definitional challenges. The scoring key maps answer patterns to major theories of art, flags overlaps (e.g., aesthetic functionalism vs. cluster view), and notes where positions can't be separated. 

  The quiz is structured to:
  - **Avoid theory-driven questions**: Cases probe intuitions first (e.g., "Is this art?"), not abstract principles.
  - **Reveal tensions**: Questions force trade-offs (e.g., between aesthetic experience and institutional acceptance).
  - **Test necessity covertly**: Cases lack one "typical" art feature (e.g., Q3 lacks sensory experience, Q7 lacks creator intention) to see if students still call it art.
  - **Fit time constraints**: Takes ~12 minutes to complete, 5 minutes to score, and 10 minutes to reveal results. Total: 27 minutes, leaving 23 minutes for discussion.

  ---

  ### **Quiz: What Counts as Art?**  
  **Instructions**: For each scenario, choose the answer that best matches your intuition. Don’t overthink—go with your gut!  

  1. **The Forged Painting**: A perfect replica of Van Gogh’s *Starry Night* is chemically identical to the original. Painted by a forger in 1920, it fooled experts until 2020. Is it art? Is it as *good* as the original?  
     A) **Yes, it’s art (and just as good)**—it creates the same visual experience.  
     B) **Yes, it’s art, but worse**—it lacks the original’s history and intent.  
     C) **No, it’s not art**—it was made to deceive, not contribute to art.  

  2. **The Urinal**: Marcel Duchamp’s *Fountain* (a signed urinal) is displayed in the MoMA. An identical unused urinal sits in a hardware store. Which is art?  
     A) **Both are art**—they’re physically identical and could be appreciated the same way.  
     B) **Only the MoMA urinal is art**—it’s in a museum, presented as art.  
     C) **Neither is art**—they’re just functional objects.  

  3. **The Certificate Artwork**: An artist sells a certificate stating, "The owner may draw one line on any wall. This certificate is the artwork." The buyer never draws the line. Is the certificate art?  
     A) **Yes**—it’s a creative idea from an artist, even without a physical object.  
     B) **No**—it’s just a piece of paper; art needs to be experienced directly.  

  4. **The AI Photo Winner**: An image wins a photography contest. It was generated by an AI after a user typed one prompt and selected from 40 variations. Is it art?  
     A) **Yes**—it’s visually striking, and the human guided the process.  
     B) **Yes, but only because it won**—the contest validated it as art.  
     C) **No**—the AI did the creative work; the human just clicked buttons.  

  5. **Bird’s Nest on a Pedestal**: A person finds a beautifully woven bird’s nest and displays it on a pedestal in their living room, calling it art. Is it art?  
     A) **Yes**—its beauty is now framed for appreciation.  
     B) **Yes, but only because of the display**—the person’s act made it art.  
     C) **No**—it’s natural, not made by humans for artistic purposes.  

  6. **Rotting Meat Installation**: An artist displays rotting meat in a gallery to provoke disgust. Viewers hate it; no one enjoys it. Is it art?  
     A) **Yes**—it’s in a gallery, and the artist intended it as art.  
     B) **Yes**—it creates a strong reaction (disgust counts as an experience).  
     C) **No**—art should offer something positive or beautiful.  

  7. **Child’s Scribble in a Gallery**: A toddler randomly scribbles on paper. An art collector frames it and displays it in a gallery as "Untitled Genius." Is it art?  
     A) **Yes**—the gallery context makes it art.  
     B) **Yes**—the scribble has interesting shapes and colors.  
     C) **No**—the child didn’t intend to make art.  

  8. **Minimally Carved Driftwood**: A beachcomber finds driftwood with a naturally beautiful shape, lightly carves one edge, and displays it at home as "Ocean Memory." Is it art?  
     A) **Yes**—it’s aesthetically pleasing and displayed intentionally.  
     B) **Only the carving part is art**—the natural shape isn’t "made," but the human touch is.  
     C) **No**—it’s mostly nature, not human creation.  

  ---

  ### **Scoring Key**  
  Tally your answers and match patterns to theories. **Important notes**:  
  - **Overlaps flagged**: Aesthetic functionalism and cluster view often agree on cases but diverge on whether any feature is *necessary* (Q3 and Q6 expose this).  
  - **"Unexplored" positions**: Some patterns (e.g., "only natural objects are art") are coherent but unattractive, so no major theory defends them.  
  - **Anti-essentialism** isn’t a pattern—it rejects patterns! Scattered/unmappable answers lean here.  

  | Theory                           | Definition (Simplified)                                                              | Answer Pattern                                                                                                | Notes                                                                 |
  |----------------------------------|---------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------|
  | **Aesthetic Functionalism**      | Art’s function is to provide aesthetic experience (beauty, emotion, etc.).            | **Q1A, Q2A, Q3B, Q4A, Q5A, Q6C, Q7B, Q8A**                                                                      | Rejects Q3 (no experience) and Q6 (no pleasure).                     |
  | **Institutional Theory**         | Art is what the "artworld" (museums, experts, etc.) accepts as art.                   | **Q1C, Q2B, Q3A, Q4B, Q5C, Q6A, Q7A, Q8C**                                                                      | Prioritizes context (Q2, Q7) over form/intent.                       |
  | **Intentional-Historical**       | Art is made with the right intentions, linked to art history.                         | **Q1B, Q2B, Q3A, Q4C, Q5B, Q6A, Q7C, Q8B**                                                                      | Values creator’s intent (rejects Q4, Q7) and history (Q1B).         |
  | **Cluster/Disjunctive View**     | Art has no single rule; it’s a cluster of properties (e.g., beauty, expressiveness, institutional recognition). | **Mixed patterns**: (1) Says "yes" to Q3, Q5, or Q6 AND (2) Says "no" to at least one of Q1/Q2/Q4/Q7/Q8. | No necessity: accepts non-beautiful (Q6), non-institutional (Q5), and non-intentional (Q7) art. |
  | **Anti-Essentialism**            | Art has no definition; it’s an open concept.                                          | **Unmappable patterns**: e.g., inconsistent "yes/no," or rejects all theories.                             | Scored low in all categories; embraces contradictions (e.g., Q1A + Q1C). |
  | **Radical Nominalism (Bonus)**   | Each artwork is unique; categories like "art" are useless.                            | **N/A**—this view rejects the quiz! If you think all answers are wrong, you might lean here.                | Rare and extreme; no practical defense.                               |

  #### **How to Score**  
  1. For **aesthetic functionalism**, **institutional**, and **intentional-historical**:  
     - Give yourself 1 point for each matching answer.  
     - Highest score (6–8) = primary alignment.  
  2. For **cluster view**:  
     - Award 1 point if you said "yes" to Q3, Q5, or Q6 (art without typical features).  
     - Award 1 point if you said "no" to at least one of Q1, Q2, Q4, Q7, or Q8 (rejecting necessity).  
     - If you have both, you align with cluster.  
  3. For **anti-essentialism**:  
     - If your highest theory score is ≤4, or your answers conflict (e.g., Q1A + Q1C), you lean here.  
  4. **Overlap Alert**:  
     - Aesthetic functionalism and cluster view often share answers (e.g., both may say Q2A). They **diverge on necessity**: If you said Q3B ("no" to certificate art) or Q6C ("no" to rotting meat), you likely require aesthetic experience (aesthetic functionalism). Cluster view would say "yes" to at least one of these.  
     - Institutional and intentional-historical often agree (e.g., both say Q2B) but split on intent: Institutional accepts Q4B/Q7A (artworld validation over intent), while intentional-historical requires creator intent (Q4C/Q7C).  

  #### **Theories Not Separated**  
  - **Aesthetic functionalism vs. cluster view**: Identical answers unless Q3/Q6 expose necessity (Q3B/Q6C = functionalism; Q3A/Q6A/B = cluster).  
  - **Institutional vs. intentional-historical**: Hard to separate in Q2/Q6 (both often say "yes"), but Q4/Q7 split them (intentional-historical rejects AI/child scribble without strong intent).  
  - **Anti-essentialism vs. "noise"**: Low/scored patterns may reflect confusion, not principled anti-essentialism.  

  ---

  ### **Time Breakdown & Session Flow**  
  - **Quiz (12 min)**: Read instructions (2 min), answer questions (8–10 min).  
  - **Scoring (5 min)**: Students tally results using the key.  
  - **Reveal (10 min)**: Share theory descriptions and poll results (e.g., "Hands up if you’re aesthetic functionalists!"). Highlight overlaps and surprises.  
  - **Discussion (23 min)**: Use these prompts:  
    - "Which cases caused the most disagreement? Why?"  
    - "Did your answers feel consistent? Where did you have to compromise?"  
    - "How might your quiz result change after reading the theories?"  

  Total: 50 minutes. The quiz is fast, intuitive, and primes students for deeper theory discussions. Let me know if you’d like a printable version or adjustments!
