prompt: |-
  My friend Maya and I have been arguing for weeks about when following the crowd is actually rational versus just being a sheep, and I've started writting down her verdicts on cases to see if theres a consistent rule in there somewhere. So far, from a bunch of real situations that came up: picking the street-food stall with the long line over the identical-looking empty one next to it — sensible; buying the blender with the most reviews on the store's site — not sensible, she rolled her eyes at that one; going to the fuller of two parallel sessions at a conference when you have no other basis for choosing — sensible; her cousin piling into crypto because everyone at his job was talking about it and it had been climbing all year — not sensible, as she put it, that's not information, that's just the crowd watching itself; going with the used car model that everyone drives so it must be reliable — sensible; and the rooftop bar that everyone says is the place to be — sensible, though she hesitated longer on that one then on any of the others.

  Next month we're going through a new batch of cases and I'd like to walk in with predictions. The new ones: (1) she picks the stall with the long line at the night market, but halfway there she notices the line is mostly one big tour group that a guide marched over; (2) buying the blender with the most purchases, not the most reviews, on the site; (3) seeing the movie that topped this weekend's box office. What will she say on each? What rule is she actually running, what other rules fit her track record just as well, and which further case would best split those rules apart? For what it's worth, my own guess at her rule is something like: follow the crowd when the members' choices were costly and made independently, because then each choice leaks private information. But that can't be the whole story, since she said no to the most-reviewed blender even though those reviews only exist because people went out and bought the thing — so test my guess against her record too, and tell me honestly which of her verdicts, if any, refuses to fit any clean rule at all.

  Please answer in American English, and when you propose the further discriminating cases keep them concrete and everyday — no abstract "an agent observes a signal" stuff.
reasoning: |-
  Okay, let me tackle this step by step. The user and Maya have been debating when following the crowd is rational versus just being a "sheep." The user has compiled a list of Maya's verdicts on various real-life situations and wants to predict her responses to three new cases, uncover her underlying rule, and test the user's own hypothesis.

  First, I need to analyze Maya's past verdicts to identify patterns. The situations are:

  1. **Street-food stall with long line vs. identical empty one:** Sensible.
  2. **Blender with most reviews:** Not sensible (rolled eyes).
  3. **Fuller conference session:** Sensible.
  4. **Cousin piling into crypto:** Not sensible ("crowd watching itself").
  5. **Used car model everyone drives:** Sensible.
  6. **Rooftop bar everyone recommends:** Sensible (but hesitated).

  The user's hypothesis is that Maya follows the crowd when choices are costly and made independently, as each choice leaks private information. But the blender example seems to contradict this—reviews imply costly and independent purchases, yet Maya rejected it. So what's different?

  Looking closer, reviews might not reflect genuine quality signals. They could be fake, biased, or from unverified buyers. The number of reviews doesn't necessarily correlate with informed decisions but might just indicate popularity or marketing. Whereas for the street food, standing in line is costly (time), and each person likely decided independently based on their own judgment. Similarly, the popular car model's reliability is proven through widespread adoption, which implies many independent decisions over time. Crypto, however, is driven by hype and herd behavior without real information—people are just following others, not making informed choices.

  For the new cases: 

  1. **Night market stall with long line, but mostly one tour group:** The line isn't organic; it's manufactured by the guide. This breaks the independence and genuine signaling. Prediction: Not sensible.
  2. **Blender with most purchases (not reviews):** Purchases indicate actual buying decisions, which are costly. If the platform verifies purchases, this might be a stronger signal than reviews. Prediction: Sensible.
  3. **Movie topping box office:** Box office success could be due to marketing or hype, not necessarily quality. People might be influenced by peers or ads rather than independent judgment. Prediction: Not sensible.

  Maya's rule seems to be: **Follow the crowd when the aggregate behavior reflects costly, independent decisions that reveal genuine hidden information (like quality or reliability), but not when it's driven by social proof, hype, or artificial factors.**

  Alternative rules could be:
  - **Information Cascade Theory:** Following when private signals outweigh public signals, but this gets abstract.
  - **Costly Signaling:** Focuses only on cost, but crypto was costly and rejected.
  - **Wisdom of Crowds:** Requires diversity and independence, which fits most cases except the rooftop bar hesitation—why? Social buzz might not be reliable for quality.

  To split these rules, a test case: **Two competing food trucks at a festival. Truck A has a long line of diverse locals (office workers, students, families). Truck B has a shorter line but several known food critics are eating there.** 
  - Wisdom of Crowds would favor Truck A (diverse crowd). 
  - Information Cascade might favor Truck B (experts' signals). 
  - Maya's rule? Likely Truck A, as critics aren't "costly signals" from regular users. But critics' presence could signal quality, complicating it.

  The rooftop bar hesitation might not fit cleanly. "Everyone says it's the place to be" could be social hype, not genuine quality signaling. Yet Maya called it sensible—maybe because the buzz implies a good experience, even if not independent. But her hesitation suggests she's wary of pure popularity.

  So, refining the rule: **Follow the crowd when their actions (not just words) demonstrate costly, independent commitments that reveal hard-to-fake attributes (quality, reliability), especially in contexts where personal experience trumps social influence.**

  This explains the blender reviews (words, not actions) vs. purchases (actions). The crypto case is actions (buying) but driven by hype, not independent judgment. The rooftop bar is tricky because recommendations are words, but "place to be" might imply social proof over quality. Her hesitation hints at this ambiguity.

  In conclusion:
  - New cases: 1) Not sensible, 2) Sensible, 3) Not sensible. 
  - Rule: Costly, independent actions signaling quality. 
  - Test case: Food trucks with locals vs. experts. 
  - Outlier: Rooftop bar—fits if "everyone says" includes personal endorsements, but her hesitation shows it's borderline. It slightly strains the rule, suggesting social context matters too.
answer: |-
  Based on Maya's track record and your "costly + independent signals" hypothesis, here's a breakdown of predictions for the new cases, her likely underlying rule, alternatives, and a simple test case to split them. I'll also flag where her past verdicts get messy.

  ---

  ### **Predictions for New Cases**
  1. **Night market stall with a long line (mostly one tour group):**  
     **Verdict: NOT sensible.**  
     *Why?* The line isn't organic—it's manufactured by a guide herding a group. This breaks "independence" (they didn't choose based on personal judgment) and "cost" (they didn't seek it out). Matches her rejection of crypto herd behavior.

  2. **Buying the blender with the most *purchases* (not reviews):**  
     **Verdict: SENSIBLE.**  
     *Why?* Purchases imply *actual costly actions* (spending money), unlike reviews which can be gamed, fake, or low-effort. This fits her "yes" to the popular car model (purchases signal reliability) and street-food line (time cost). Your hypothesis nails this.

  3. **Seeing the movie that topped the box office:**  
     **Verdict: NOT sensible.**  
     *Why?* Box office success often reflects hype, marketing, or social contagion (e.g., "everyone's talking about it"). Like crypto or the rooftop bar hesitation, this risks being "the crowd watching itself" without signaling true quality. If Maya hesitates here, it'll mirror her rooftop bar uncertainty.

  ---

  ### **Maya's Likely Rule**
  **Her core principle:**  
  *Follow the crowd when their actions reflect costly, independent decisions that reveal hard-to-observe information (e.g., quality, reliability), but not when the crowd is self-referential, artificial, or low-stakes.*  

  **How it fits her track record:**  
  - ✅ **Street-food stall (long line):** Costly (time), independent (individuals choosing based on taste/hunger), reveals hidden info (food safety/taste).  
  - ✅ **Fuller conference session:** Costly (opportunity cost of time), independent (attendees choosing based on interest), reveals info (session quality).  
  - ✅ **Used car model:** Costly (financial commitment), independent (buyers researching/experiencing), reveals info (long-term reliability).  
  - ❌ **Blender with most reviews:** Reviews aren't inherently costly *or* independent (can be fake, incentivized, or copied). She sees this as noise, not signal.  
  - ❌ **Crypto hype:** Not independent (coworkers amplifying groupthink), not revealing new info (price rise is already public).  
  - ⚠️ **Rooftop bar ("place to be"):** Hedged because "everyone says" could be cheap talk (low cost) or herd behavior. She likely approved *only* if "says" implies firsthand experience (e.g., "it's great!" vs. "it's trendy").

  **Your hypothesis holds up well**, but the rooftop bar case is the strain point. If "everyone says" means social buzz without personal cost (e.g., influencers posting vs. friends swearing it's worth the $20 cover), it blurs the line.

  ---

  ### **Equally Plausible Alternative Rules**  
  Two other rules fit her history *almost* as well:  
  1. **"Wisdom of Crowds" Lite:**  
     *Follow when the crowd is diverse and their aggregated choices reduce error (e.g., avoiding empty food stalls), but not when homogeneity creates bias (e.g., crypto bros).*  
     - Fits everything except the rooftop bar (homogeneous hype might not reduce error).  

  2. **"Actions Over Words" Rule:**  
     *Trust observable *actions* (waiting in line, buying cars), not opinions (reviews, buzz).*  
     - Fits all cases: She rejects reviews (words) and crypto (hype), but approves lines/purchases (actions). Struggles with "everyone says" for the bar (words vs. implied experience).  

  ---

  ### **One Concrete Test Case to Split These Rules**  
  **Scenario:** *You're at a farmers' market. Stand A has a long line of locals (regulars chatting about the peaches). Stand B has no line but a posted sign: "Recommended by Food & Wine Magazine." Which does Maya pick?*  

  - **Under Maya's Likely Rule:** **Stand A**. Locals waiting = costly (time) + independent (regulars acting on personal experience) → reveals hidden quality. The magazine rec is "cheap signal" (no crowd cost/independence).  
  - **Under "Wisdom of Crowds" Lite:** **Stand A**. Locals = diverse crowd reducing error vs. one expert (magazine) prone to bias.  
  - **Under "Actions Over Words" Rule:** **Stand A**. Line = action vs. sign = words.  

  **But tweak it to split them:**  
  *Stand C has a short line of tourists (led by a blogger) and a sign: "Voted Best Jam by 100 Influencers." Stand D has no line but 3 chefs quietly buying jars.*  
  - **Maya's Likely Rule:** Chooses **Stand D**. Chefs buying = costly, independent actions. Tourists = artificial herd.  
  - **"Wisdom of Crowds" Lite:** Chooses **Stand D**. Chefs = diverse experts (better signal than homogenous influencers).  
  - **"Actions Over Words" Rule:** Chooses **Stand C** (line = action) *or* **Stand D** (buying = action). This rule cracks—it can't distinguish *meaningful* actions.  

  **Result:** If Maya picks Stand D, her rule prioritizes *who* acts (informed/independent agents) over the action itself. This kills "Actions Over Words" and leans toward her true rule.

  ---

  ### **Does Any Verdict Refuse a Clean Rule?**  
  **The rooftop bar hesitation** is the outlier. If "everyone says it’s the place to be" means:  
  - *Social proof* ("It's cool because others say so") → Not sensible under her rule.  
  - *Aggregated experience* ("Everyone who went loved it") → Sensible.  

  Her pause suggests she’s wrestling with whether "buzz" implies genuine costly signals (e.g., people paid cover charges and had fun) or hollow herd behavior. It’s the only case where the *source* of the crowd’s opinion isn’t clear-cut. If pressed, she’d likely demand: "Did people *go* and find it worth the cost, or are they just parroting hype?" That fits her rule but highlights real-world ambiguity.  

  **Your hypothesis works**—it explains 5/6 cases cleanly and makes the rooftop bar the "edge case." The blender review rejection is consistent: reviews = low-cost/noise, not independent quality signals. Purchases (new case #2) fix that by focusing on actions.  

  Predict confidently for the new batch—she’ll appreciate the rigor. If she rules differently on the rooftop bar, ask: "Was the crowd sharing *proof* or just *vibes*?" That’ll crack her code.
