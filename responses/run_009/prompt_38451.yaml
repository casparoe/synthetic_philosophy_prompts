prompt: |-
  I run public programming at a mid-sized regional history museum, and each season we receive proposals for events — lectures, traveling exhibits, panel evenings, private collections on loan — a growing fraction of which involve contested history. In the past year these have included a docent-led "mysteries of the ancients" evening that treats Atlantis as an open archaeological question, a local enthusiast of Fomenko's New Chronology who wants to argue that our conventional dating of medieval documents is a scholarly construct, a collector asserting that artifacts in his possession prove extensive pre-Columbian transoceanic contact, and — harder — a proposal on the peopling of the Americas, where the scholarly consensus has itself shifted within living memory. Our refusals have been ad hoc and inconsistent enough that the board has asked for a written procedure. The committee that would apply it consists of volunteers with roughly a semester of college history each, and they can spend perhaps an hour per proposal. Where a proposal is refused, the refusal may be appealed to the board, so the procedure needs to leave a record showing its reasoning.

  Please write that decision procedure. Ground it in whatever the philosophy of pseudoscience and the study of pseudohistory actually offer on demarcation — the difference between an unorthodox hypothesis and a pseudo-inquiry, what it takes for a claim to answer to evidence rather than merely coexist with it, the role of consilience across independent lines of evidence, the standard warning signs such as claims that explain everything, hostility to falsification, and appeals to suppression by the academy — but operationalize all of this so a lay committee can run it. The procedure should specify: the questions to ask about a proposal, in order; what counts as a sufficient answer to each; the points where the procedure terminates in a "no"; the points where it hands the decision to a human because the remaining question is one of values rather than facts (for instance, whether to host a talk the committee judges false because it draws a crowd and is honestly labeled as entertainment); and, crucially, how to distinguish a fringe-but-live scholarly question from a closed one. Because the committee cannot itself evaluate radiocarbon dating or statistical arguments about manuscript chronologies, the procedure must say which proxy indicators — how a claimant treats counter-evidence, whether the claim connects to anything outside itself, who is engaging with it — can stand in for the expertise the committee lacks.

  Then run the procedure on three proposals. First, the Atlantis evening, which is popular with donors. Second, a talk presenting Norse presence in North America as established fact — include this case because it is the procedure's hardest test: that claim was itself considered fringe until excavation vindicated it, so the procedure must say what would have allowed a committee in the skeptical era to host such a talk without opening the door to every claim of the same shape, and it must not achieve this by knowing the answer in advance. Third, a talk arguing that a local carved stone is evidence of pre-Columbian contact, promoted by its supporters as a persecuted minority view. Finally, be honest about what the procedure cannot do: whether it can really distinguish a claim that is wrong from a claim that is not even being investigated, and how the committee should handle proposals that are wrong in ways the committee considers harmless but that bring in visitors who then trust our other labels a little less.
reasoning: |-
  We are designing a decision procedure for a museum committee to evaluate proposals involving contested history. The procedure must be grounded in the philosophy of pseudoscience and pseudohistory, and it must be operationalized for a lay committee with limited time and expertise.

   Key principles from the philosophy of pseudoscience and pseudohistory:
   1. Demarcation: Distinguishing between unorthodox hypotheses (which may be legitimate but minority views) and pseudo-inquiry (which is not genuinely responsive to evidence).
   2. Falsifiability: A claim that is not testable or that is shielded from falsification by ad hoc adjustments is problematic.
   3. Consilience: The convergence of multiple independent lines of evidence is a hallmark of robust scientific theories.
   4. Warning signs: 
      - Claims that explain too much (too broad, too vague).
      - Hostility to counter-evidence and falsification.
      - Appeals to suppression by the academy or mainstream.
      - Lack of connection to established knowledge, or arbitrary dismissal of established knowledge.
      - Failure to engage with the broader scholarly community.

   The procedure must also account for:
   - Distinguishing fringe-but-live scholarly questions from closed ones.
   - The fact that some claims once considered fringe (like Norse presence in North America) were later vindicated.

   We design a step-by-step procedure with questions. The procedure terminates in a "no" if any of the red flags are triggered. It may also lead to a "values decision" if the proposal is deemed pseudohistorical but the museum considers hosting it for other reasons (e.g., as entertainment, clearly labeled).

   Steps:

   1. **Preliminary Check: Is the proposal clearly labeled?**
      - If the proposal does not clearly state what it is (e.g., entertainment, a controversial view) and the museum is considering hosting it without such labeling, that is a problem. But note: labeling alone is not sufficient for acceptance.

   2. **Check for Established Scholarly Consensus:**
      - The committee must determine if the topic is one where there is a strong consensus. How?
          - Use reliable sources (e.g., encyclopedia entries, academic society statements, standard textbooks) to see if the claim is widely accepted or rejected.
          - If the claim is against a strong consensus, proceed to step 3. If there is no strong consensus (i.e., the issue is open or actively debated in mainstream scholarship), then the proposal may be considered (with appropriate labeling) and the procedure goes to step 6 (values check).

   3. **Check for Falsifiability and Testability:**
      - Ask: What evidence would disprove the claim? If the proposer cannot name any or if the claim is structured such that no evidence could ever disprove it, that is a red flag (terminate with "no").
      - Also, check if the claim makes specific, testable predictions.

   4. **Examine Treatment of Counter-Evidence:**
      - How does the proposer handle counter-evidence? If they dismiss it without consideration, or explain it away with ad hoc hypotheses, that is a red flag (terminate with "no").
      - If the proposer engages with counter-evidence and attempts to refute it with evidence and reason, that is a positive sign.

   5. **Check for Consilience and Connection to Broader Knowledge:**
      - Does the claim connect to other established facts? Or does it require overturning multiple independent lines of evidence without strong justification?
      - If the claim is isolated and cannot be integrated with other knowledge, that is a red flag.
      - Also, look for overreach: does the claim explain too much? (e.g., Atlantis as the source of all ancient civilizations)

   6. **Appeal to Persecution or Suppression:**
      - Does the proposer claim that mainstream scholars are suppressing their view? If yes, and without providing specific evidence of suppression (e.g., documented cases of bias), that is a red flag (terminate with "no"). Note: legitimate minority views usually do not rely on conspiracy theories.

   7. **Scholarly Engagement:**
      - Is the claim being discussed in peer-reviewed journals? Even if controversial, if it is being engaged with by scholars in the field, then it may be a live issue.
      - If the claim is only promoted outside of academic channels (e.g., self-published books, conferences without peer review, internet forums) and not in reputable academic venues, that is a red flag.

   8. **Distinguishing Fringe-but-Live from Closed Questions:**
      - A closed question is one where the consensus is strong and the evidence is overwhelming (e.g., the Earth is round). A fringe-but-live question might have a strong consensus against it but still has some scholarly engagement (e.g., a few papers in reputable journals challenging the consensus, or a respected scholar making the case). 
      - Proxy indicators for a closed question:
          - The claim has been thoroughly investigated and rejected by multiple independent lines of evidence.
          - There are no recent publications in reputable peer-reviewed journals supporting the claim.
          - The claim is not taught in any mainstream academic programs (except as an example of a debunked theory).
      - If the question is closed, then the proposal is likely pseudohistorical and the committee should consider rejecting it unless they are considering it for non-scholarly reasons (step 9).

   9. **Values Check:**
      - If the proposal fails one or more of the above tests (i.e., it is pseudohistorical) but the museum is considering hosting it for other reasons (e.g., it is popular, it is labeled as speculative entertainment, it sparks public interest), then the decision is handed to a human (the committee or the board) for a values-based decision. They must weigh the benefits (attendance, revenue, engagement) against the risks (eroding trust in the museum, lending credibility to false claims).

   10. **Documentation:**
       - The committee must document their reasoning at each step, especially if they terminate at a "no". For a values-based decision, they must clearly state that the proposal does not meet scholarly standards but is being accepted for other reasons, and note how it will be labeled and presented.

   Now, we run the procedure on three proposals.

   **Proposal 1: Docent-led "Mysteries of the Ancients" evening that treats Atlantis as an open archaeological question.**

   Step 1: Preliminary Check - The event is labeled as "mysteries", which suggests it is speculative. But the museum must ensure that the docent does not present it as an open question in archaeology without qualification.

   Step 2: Scholarly Consensus - The existence of Atlantis as described by Plato is not considered an open question in archaeology. The consensus is that it is a myth. Therefore, we proceed to step 3.

   Step 3: Falsifiability - The claim of Atlantis is often presented in a way that is unfalsifiable (e.g., it sank without a trace). But the proposer might argue that evidence could be found. However, the burden is on the proposer to show testability. The docent's presentation might not address this.

   Step 4: Treatment of Counter-Evidence - Typically, proponents of Atlantis as historical dismiss the lack of evidence by saying it's under the sea or that the evidence was destroyed. This is ad hoc. (Red flag)

   Step 5: Consilience - The claim of Atlantis often overreaches, being used to explain multiple ancient civilizations. (Red flag)

   Step 6: Suppression - Often, proponents claim that mainstream archaeology ignores the evidence. (Red flag)

   Step 7: Scholarly Engagement - There is no current engagement in peer-reviewed archaeology journals with the idea of Atlantis as a real place (it is discussed as a myth or in literature). 

   Step 8: Closed Question - Atlantis is a closed question in archaeology.

   Therefore, the procedure terminates at step 4, 5, or 6 with a "no". The committee would document the red flags.

   However, note that the event is popular with donors. The committee might, at step 9, consider a values-based decision: they could accept it only if it is explicitly framed as a myth or as a cultural phenomenon (not as an open archaeological question) and labeled as entertainment. But the procedure as written for the committee would have terminated at the red flags. The committee must then either reject it or, if they wish to consider non-scholarly reasons, they must note that they are overriding the scholarly rejection for values reasons and specify the labeling and framing.

   **Proposal 2: A talk presenting Norse presence in North America as established fact.**

   This is a test because until the 1960s, the Norse presence was considered fringe, but then the L'Anse aux Meadows site was found.

   We must run the procedure as if we are in the pre-1960 era (without knowing the future).

   Step 1: The talk is presented as established fact. But at the time, the consensus was that there was no Norse presence. So:

   Step 2: Scholarly Consensus - In the pre-1960 era, the consensus was that there was no Norse presence. So we proceed.

   Step 3: Falsifiability - The claim is falsifiable: if no evidence is found in the areas described in the sagas, that would disprove it. Also, the sagas give specific locations (Vinland) and events. So it is testable.

   Step 4: Treatment of Counter-Evidence - Proponents (like Helge Ingstad) were actively looking for evidence and engaging with the counter-arguments (e.g., that the sagas were not historical). They did not dismiss the lack of evidence but were trying to find it.

   Step 5: Consilience - The claim was based on the sagas, which were independent of the archaeological record. It did not require overturning other established knowledge (unlike, say, transoceanic contact that would require rewriting entire histories). It was a specific claim about a specific group at a specific time.

   Step 6: Suppression - Some proponents might have claimed suppression, but Ingstad and others were working within the academic framework and did not rely on conspiracy theories.

   Step 7: Scholarly Engagement - Even in the pre-1960 era, the idea was discussed in scholarly circles (e.g., historians and archaeologists were aware of the sagas). It was a minority view, but not entirely absent from academia.

   Step 8: Closed Question? - In the pre-1960 era, it was not a closed question because the evidence was still being sought. The fact that there was ongoing research (even if not mainstream) and the claim was testable and had not been definitively disproven would mean it was fringe-but-live.

   Therefore, the procedure would not terminate at any of the red flag steps. Then:

   Step 9: Values Check - The committee must decide whether to host a talk that presents a minority view as established fact. The procedure would note that the claim is not pseudohistorical (because it passes the tests) but is a minority view. The committee should then decide on the framing: if they host it, they should label it appropriately (e.g., "A Controversial Theory: The Norse in North America"). But note: the proposal presents it as established fact. The committee might require that the talk be reframed to note the lack of consensus and the ongoing debate.

   However, the procedure does not automatically reject minority views. It only rejects those that show red flags of pseudohistory. Since this proposal does not, the committee can approve it, but they might require that the presentation be adjusted to reflect the current state of scholarship (i.e., that it is a hypothesis under investigation, not established fact). If the proposer refuses to adjust, then the committee might reject it because the presentation would be misleading.

   **Proposal 3: A talk arguing that a local carved stone is evidence of pre-Columbian transoceanic contact.**

   Step 1: The proposal is presented as a persecuted minority view.

   Step 2: Scholarly Consensus - The consensus is that there was no pre-Columbian transoceanic contact (except for the Norse, which is now accepted). The specific stone in question may not be known, but the broader claim of extensive pre-Columbian contact is against the consensus.

   Step 3: Falsifiability - The claim might be falsifiable: if the stone can be shown to be a modern creation or from a known local culture, that would disprove it. But note: the proposer might make the claim in a way that is unfalsifiable (e.g., "it must be from an unknown group"). We must look at the details.

   Step 4: Treatment of Counter-Evidence - How does the proposer handle the lack of other evidence? If they dismiss the overwhelming lack of evidence for transoceanic contact by saying it was lost or overlooked, that is ad hoc. Also, if they dismiss the dating of the stone (if it is dated to a period after Columbus) as a mistake, that is a red flag.

   Step 5: Consilience - The claim of pre-Columbian contact would require overturning multiple independent lines of evidence (linguistic, genetic, archaeological) that show no contact. The stone must be explained in a way that is consistent with the rest of the evidence. If the proposer uses the stone to rewrite large parts of history without supporting evidence, that is overreach.

   Step 6: Suppression - The proposal is promoted as a persecuted minority view. This is a red flag unless the proposer can provide specific evidence of suppression (e.g., a paper rejected without review because of bias). Without such evidence, it is a red flag.

   Step 7: Scholarly Engagement - Is the stone discussed in peer-reviewed journals? If it is only discussed in alternative outlets, that is a red flag.

   Step 8: Closed Question? - The idea of widespread pre-Columbian transoceanic contact (beyond the Norse) is a closed question. There is no credible evidence and the consensus is strong.

   The procedure would likely terminate at step 6 (suppression claim) or step 7 (lack of scholarly engagement). Also, step 4 and 5 might be red flags.

   Therefore, the committee would reject the proposal.

   **Limitations of the Procedure:**

   1. **Distinguishing wrong claims from non-investigated claims:** The procedure relies on the existence of a scholarly consensus and engagement. If a claim is so new that it hasn't been investigated, the procedure might reject it because of the lack of consensus and engagement. The committee might need a way to flag such claims for a second look by an expert.

   2. **Harmless but wrong claims:** The procedure can identify pseudohistorical claims, but the museum might decide to host them for entertainment. The values check allows this, but the committee must consider the long-term risk: even if labeled as entertainment, some visitors might take it seriously and then question the museum's credibility on other topics. The procedure cannot make that trade-off for the committee; it only flags the scholarly issues.

   3. **Expertise:** The committee uses proxy indicators (like scholarly engagement and treatment of counter-evidence) because they lack expertise. But these proxies are not foolproof. For example, a legitimate new theory might initially be ignored by the mainstream and might be presented by a proponent who is frustrated (leading to claims of suppression). The procedure might reject a legitimate but radical new idea. The museum must be aware of this and might want to have a mechanism for expert consultation when a proposal is borderline.

   **The Written Procedure Document:**

   We now write the procedure as a document for the committee.

  ---

  **Museum Program Proposal Evaluation Procedure**

  **Purpose:** To evaluate proposals for public programming that involve contested historical claims, ensuring that the museum maintains scholarly integrity while allowing for diverse perspectives when appropriately framed.

  **Committee Instructions:** 
  - Spend no more than one hour per proposal.
  - Use reliable sources (e.g., encyclopedias, academic society websites, university department pages) to check consensus and scholarly engagement.
  - Document your reasoning for each step.

  **Procedure Steps:**

  1. **Labeling and Framing:** 
     - Check: Does the proposal clearly state how the event will be labeled and framed? (e.g., "entertainment", "controversial view", "established fact")
     - If not, ask the proposer for clarification. If the proposer does not provide clear labeling, terminate with "no" (reason: risk of misleading the public).

  2. **Check Consensus:**
     - Research: What is the current scholarly consensus on the main claims of the proposal?
     - Sources: Consult at least two reputable reference sources (e.g., Encyclopedia Britannica, Oxford Reference, major academic society statements).
     - Outcome:
          - If the claim is within the current mainstream consensus, proceed to step 6 (values check, but note: there may be other issues).
          - If the claim is against the consensus, proceed to step 3.
          - If there is no clear consensus (i.e., the issue is actively debated in mainstream scholarship), the claim is a legitimate minority view. Proceed to step 6 (values check) with a note that the event must be framed as a minority view.

  3. **Falsifiability:**
     - Question: What evidence would disprove the claim? Does the claim make specific, testable predictions?
     - Outcome:
          - If the proposer cannot state any such evidence, or if the claim is structured so that no evidence could disprove it, terminate with "no" (reason: unfalsifiable claim).
          - Otherwise, proceed to step 4.

  4. **Treatment of Counter-Evidence:**
     - Question: How does the proposer address existing counter-evidence? (Look at the proposal materials and any provided references.)
     - Outcome:
          - If the proposer dismisses counter-evidence without evidence-based argument, or uses ad hoc adjustments to explain away counter-evidence, terminate with "no" (reason: evasion of falsification).
          - If the proposer engages with counter-evidence and provides reasoned arguments, proceed to step 5.

  5. **Consilience and Overreach:**
     - Question: Does the claim connect to established knowledge? Or does it require overturning multiple independent lines of evidence without compelling justification? Is the claim overly broad (explaining too much)?
     - Outcome:
          - If the claim is isolated from other knowledge, requires overturning well-established facts without strong evidence, or explains too many disparate phenomena, terminate with "no" (reason: lack of consilience and overreach).
          - Otherwise, proceed to step 6.

  6. **Suppression Claims:**
     - Question: Does the proposer claim that the mainstream is suppressing their view?
     - Outcome:
          - If yes, and the proposer does not provide specific, verifiable evidence of suppression (e.g., documented cases of biased peer review, censorship), terminate with "no" (reason: reliance on conspiracy theory).
          - Otherwise, proceed to step 7.

  7. **Scholarly Engagement:**
     - Research: Is the claim discussed in peer-reviewed academic journals or books from reputable academic presses? 
     - Outcome:
          - If the claim is only found in non-academic sources (self-published books, non-peer-reviewed websites, etc.) and there is no engagement in the last 10 years in mainstream academic venues, terminate with "no" (reason: lack of scholarly engagement).
          - If there is some engagement (even critical) in academic venues, proceed to step 8.

  8. **Closed Question Check:**
     - Research: Is the claim on a topic that is considered closed in the field? (A closed question has overwhelming evidence for one position and no active debate among experts.)
     - Indicators of a closed question:
          - The claim has been thoroughly investigated and rejected by multiple independent lines of evidence.
          - There are no recent (last 10 years) peer-reviewed publications supporting the claim in reputable journals.
          - The claim is not taught in mainstream academic programs (except as a debunked theory).
     - Outcome:
          - If the question is closed, the claim is pseudohistorical. Proceed to step 9 (values check).
          - If the question is open or actively debated, the claim is a legitimate minority view. Proceed to step 9 (values check) with a note that the event must be framed as a minority view.

  9. **Values Check:**
     - If the proposal has passed all steps without termination (i.e., it is a legitimate minority view) or if it was flagged as pseudohistorical in step 8 but the museum is considering it for other reasons, then the committee must make a values-based decision.
     - Considerations:
          - Would hosting the event serve the museum's mission in a way that justifies the risk (e.g., drawing a crowd, donor relations, sparking interest in history)?
          - How will the event be labeled and framed to avoid misleading the public?
          - What is the risk that hosting the event might erode trust in the museum's other programs?
     - Outcome:
          - Approve with specific framing requirements (e.g., "This event presents a controversial theory that is not accepted by most scholars").
          - Reject if the risks outweigh the benefits.

  **Appeals:** If a proposal is rejected, the proposer may appeal to the board. The committee must provide the documented reasoning.

  ---

  **Running the Examples (as per the procedure):**

  **Example 1: Atlantis Evening**

  - Step 1: The event is labeled as "mysteries". This is acceptable framing if done right, but the content must be checked.
  - Step 2: Consensus is that Atlantis is a myth. Proceed to step 3.
  - Step 3: The claim is often unfalsifiable. (But let's say the docent does not provide falsifiable criteria.) Terminate at step 3: "no" (reason: unfalsifiable claim).

  **Example 2: Norse Presence (Pre-1960)**

  - Step 1: The talk is presented as established fact. This is problematic. We would require the proposer to reframe it as a hypothesis. (Assume they agree to reframe.)
  - Step 2: Consensus at the time was against. Proceed to step 3.
  - Step 3: Falsifiable: yes. Proceed.
  - Step 4: Treatment of counter-evidence: Proponents were seeking evidence and not dismissing counter-arguments. Proceed.
  - Step 5: Not overreaching: it was a specific claim. Proceed.
  - Step 6: Typically, proponents did not claim suppression (or if they did, without evidence). Proceed.
  - Step 7: There was some scholarly discussion (e.g., historians debated the sagas). Proceed.
  - Step 8: Not a closed question at the time (no overwhelming evidence either way). Proceed to step 9.
  - Step 9: Values decision: The committee might approve with framing as a minority view.

  **Example 3: Local Carved Stone**

  - Step 1: Presented as a persecuted minority view. This is a problem in labeling. We would require reframing without the persecution claim. (But the content remains.)
  - Step 2: Consensus against pre-Columbian transoceanic contact (beyond Norse). Proceed to step 3.
  - Step 3: Might be falsifiable? But the proposer might not specify how. (Assume they don't.) Terminate at step 3? Or proceed to step 4.
  - Step 4: Likely ad hoc treatment of counter-evidence. Terminate at step 4? 
  - Step 6: Suppression claim: yes, without evidence. Terminate at step 6.

   Note: The procedure might terminate at any of these steps.

  **Final Note:** This procedure is a safeguard against pseudohistory, but it is not infallible. The museum should periodically review the procedure and consider expert consultation for borderline cases.
answer: |-
  ### Decision Procedure for Evaluating Contested History Proposals  
  **Grounding in Demarcation Philosophy**  
  This procedure operationalizes key principles from the philosophy of pseudoscience/history (e.g., Popper’s falsifiability, Kuhn’s consilience, Thagard’s warning signs) to distinguish:  
  - **Legitimate minority hypotheses** (testable, engaged with evidence, open scholarly debate) vs. **pseudo-inquiry** (unfalsifiable, insulated from criticism, detached from evidence).  
  - **Proxy indicators** replace technical expertise: Treatment of counter-evidence, consilience, scholarly engagement, and absence of "red flags" (e.g., claims of academic suppression) signal robustness.  

  **Procedure Structure**  
  - **Time Budget:** 1 hour per proposal. Use readily accessible sources (e.g., Wikipedia, academic society websites, JSTOR abstracts).  
  - **Documentation:** Record answers at each step. If rejected, document specific red flags. If appealed, the record must show clear reasoning.  
  - **Termination Points:** End with "no" if red flags are triggered. Hand off to "values check" for proposals that are false but potentially acceptable as entertainment.  

  ---

  ### Step-by-Step Procedure  
  1. **Preliminary Check: Clarity of Framing**  
     - **Question:** Does the proposal explicitly state how the event will be framed? (e.g., "entertainment," "controversial hypothesis," "established fact").  
     - **Sufficient Answer:** Clear labeling (e.g., "This talk presents a speculative theory").  
     - **Termination:** If absent or vague → **Hand off to values check** (committee must decide if labeling can be enforced).  

  2. **Scholarly Consensus Status**  
     - **Question:** Is the claim’s core subject a *closed question* in mainstream scholarship?  
       - *Closed*: Overwhelming consilient evidence; no live debate (e.g., Holocaust denial).  
       - *Open*: Active debate in peer-reviewed literature (e.g., pre-Clovis settlement in the Americas).  
     - **Sources:** Check 2–3 authoritative summaries (e.g., Encyclopaedia Britannica, academic society statements).  
     - **Proxy for Expertise:**  
       - **Closed if:**  
         - Major academic bodies explicitly state it is settled (e.g., American Historical Association).  
         - No peer-reviewed papers supporting the claim in the last 20 years.  
         - It overturns consilient evidence (e.g., genetics + archaeology + linguistics) without new data.  
       - **Open if:**  
         - Recent peer-reviewed papers debate it (even if minority).  
         - Consensus has shifted within 50 years (e.g., Norse presence pre-1960).  
     - **Termination:** If closed → Proceed to Step 3. If open → Skip to Step 6 (values check).  

  3. **Falsifiability and Testability**  
     - **Question:** Does the claim specify what evidence could disprove it?  
     - **Sufficient Answer:** Concrete, observable conditions for falsification (e.g., "If radiocarbon dating shows this artifact is post-1492, the theory fails").  
     - **Red Flags:**  
       - No conceivable counter-evidence (e.g., "Absence of evidence is evidence of suppression").  
       - Explains everything (e.g., "Atlantis accounts for all ancient cultures").  
     - **Termination:** If unfalsifiable → **No**.  

  4. **Treatment of Counter-Evidence**  
     - **Question:** How does the proposal engage with established counter-evidence?  
     - **Proxy for Expertise:**  
       - **Legitimate:** Addresses counter-evidence directly (e.g., "Mainstream dating conflicts, but here’s why the methods are flawed").  
       - **Pseudohistory:** Dismisses counter-evidence as "fraudulent," "biased," or ignores it.  
     - **Termination:** If hostile to counter-evidence → **No**.  

  5. **Consilience and Scholarly Engagement**  
     - **Question:** Does the claim connect to multiple independent lines of evidence? Is it discussed in peer-reviewed forums?  
     - **Proxy for Expertise:**  
       - **Lacks consilience if:** Relies on a single anomaly (e.g., one artifact) without linking to broader evidence.  
       - **Scholarly engagement check:** Search Google Scholar for the claim + keywords.  
         - **Legitimate:** 5+ peer-reviewed papers engaging with it (even critically).  
         - **Pseudohistory:** Only self-published books, YouTube, or conferences without peer review.  
     - **Termination:** If no consilience AND no peer-reviewed engagement → **No**.  

  6. **Appeals to Suppression**  
     - **Question:** Does the proposer claim academic persecution?  
     - **Red Flag:** Assertions of "suppressed truth" without evidence (e.g., "Academics ignore this because it upsets their careers").  
     - **Sufficient Answer:** Specific, verifiable examples (e.g., "Paper X was rejected by Journal Y for reason Z").  
     - **Termination:** If suppression claimed without evidence → **No**.  

  7. **Values Check**  
     - **Handoff Point:** If proposal passes Steps 1–6 but is still contested, OR if rejected but has non-scholarly merit, ask:  
       - "Could this be framed as entertainment/controversy without compromising the museum’s credibility?"  
       - "Does the public interest (e.g., attendance, donor support) outweigh the risk of eroding trust?"  
     - **Decision:** Committee approves with mandatory labeling (e.g., "For entertainment only") OR rejects.  

  ---

  ### Application to Proposals  
  #### **Proposal 1: "Mysteries of the Ancients" Atlantis Evening**  
  - **Step 1 (Framing):** Labeled as "mystery" → Pass.  
  - **Step 2 (Consensus):** Atlantis is a *closed question* (UNESCO: "myth with no archaeological basis").  
  - **Step 3 (Falsifiability):** Unfalsifiable—proponents claim Atlantis is "hidden" or "destroyed." → **Red flag** → **No**.  
  - **Documentation:** "Terminated at Step 3 (unfalsifiable). Ignores oceanography/archaeology consensus."  
  - **Appeal Note:** If donors insist, **values check** could approve if rebranded: "Pseudoarchaeology: Why Atlantis Captures Imagination."  

  #### **Proposal 2: Norse Presence as "Established Fact"**  
  *Testing the procedure as if pre-1960 (pre-L’Anse aux Meadows):*  
  - **Step 1 (Framing):** Presented as fact → **Fail** → Hand off to values check for relabeling.  
  - **Step 2 (Consensus):** *Open question* pre-1960 (minority view but peer-reviewed debates, e.g., sagas vs. archaeology). → Proceed.  
  - **Step 3 (Falsifiability):** Falsifiable—e.g., "No Norse artifacts found in North America." Proponents actively sought evidence. → Pass.  
  - **Step 4 (Counter-Evidence):** Engaged with critiques (e.g., "Sagas may be exaggerated but contain plausible details"). → Pass.  
  - **Step 5 (Consilience):** Connected to Norse seafaring/archaeology; peer-reviewed papers existed (e.g., *Journal of Medieval History*). → Pass.  
  - **Step 6 (Suppression):** No suppression claims → Pass.  
  - **Step 7 (Values):** Approve with labeling: "Controversial Hypothesis: Norse in North America."  
  - **Why This Doesn’t Open Floodgates:** Procedure requires falsifiability + scholarly engagement. Atlantis/Stonehenge pseudo-theories fail Step 5 (no peer-reviewed engagement).  

  #### **Proposal 3: Local Stone as "Pre-Columbian Contact Evidence"**  
  - **Step 1 (Framing):** Promoted as "persecuted truth" → **Fail** → Hand off for relabeling.  
  - **Step 2 (Consensus):** Pre-Columbian transoceanic contact (beyond Norse) is *closed* (consilient genetics/archaeology shows no contact).  
  - **Step 3 (Falsifiability):** Unfalsifiable—proponents dismiss counter-evidence as "suppressed." → **Red flag** → **No**.  
  - **Documentation:** "Terminated at Step 3 (unfalsifiable) and Step 6 (suppression claims without evidence)."  

  ---

  ### Limitations and Mitigations  
  1. **Wrong vs. Non-Investigated Claims:**  
     - The procedure cannot distinguish a *new* legitimate hypothesis from pseudo-inquiry. Example: A novel claim about Polynesian-Amerindian contact might lack peer review simply because it’s new.  
     - **Mitigation:** Flag proposals with testable claims but no peer engagement for expert consultation (if time/resources allow).  

  2. **"Harmless" False Claims:**  
     - Hosting entertainment-labeled pseudo-history (e.g., "Aliens Built the Pyramids Night") may draw crowds but erode trust in the museum’s credibility.  
     - **Mitigation:**  
       - In **values check**, require:  
         - Explicit disclaimers ("Not based on historical evidence").  
         - Post-event discussions debunking myths.  
       - Track visitor feedback to detect trust erosion.  

  3. **Proxy Reliability:**  
     - Scholarly engagement (Step 5) is imperfect—some legitimate minority views are ignored due to bias.  
     - **Mitigation:** Cross-check with independent databases (e.g., JSTOR, Scopus) and note dissent in academic societies.  

  **Conclusion**  
  This procedure prioritizes scholarly rigor while allowing flexibility for public engagement. It rejects pseudo-inquiry based on demarcation criteria but empowers the committee to make values-based decisions for contested or entertaining content. Documentation ensures transparency for appeals. Regular review (e.g., annual updates to consensus lists) will maintain its relevance.
