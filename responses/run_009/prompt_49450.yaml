  Message 1: "you are not in quadrant C."
  Message 2: "if you are in quadrant A, then the odds are 3:1 that you're in Blue territory."

  Students have seen that message 1 is ordinary conditioning material, that message 2 can't be handled by conditioning because its antecedent is left unsettled, and they've been taught Adams conditioning as the standard tool for messages like 2 (fix the conditional credences the message gives you, redistribute over the antecedent possibilities proportionally to prior).

  The question I want has three parts, and I want the question text to state the parts crisply:

  (a) compute Judy's final credence in Blue, and in each quadrant, if the messages arrive in the order 1-then-2, showing the intermediate distribution after each update

