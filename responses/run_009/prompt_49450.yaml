        Total = 3/16 + 1/16 + 3*3/40 + 3*7/40 = 4/16 + (9+21)/40 = 1/4 + 30/40 = 1/4 + 3/4 = 1? 

        But 3/40*3 = 9/40, 7/40*3=21/40, so 9/40+21/40=30/40=3/4, and 3/16+1/16=4/16=1/4, so total 1/4+3/4=1. Good.

