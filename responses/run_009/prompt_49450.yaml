              P(quadrant B) = 0.1 + 0.2333 = 0.3333
              P(quadrant C) = 0
              P(quadrant D) = 0.1 + 0.2333 = 0.3333

  (b) Messages arrive first Message 2 then Message 1.

      Start with prior.

