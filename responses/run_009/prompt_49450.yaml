   But note: in this specific case, the updates commute. That is a feature of the Adams conditioning in this setup. However, Adams conditioning is not always commutative with other updates. But here it is because the two updates affect independent aspects? (The first update eliminates some cells, the second adjusts within a partition that is not affected by the elimination in a way that the conditional probability update is independent.) But we don't need to go into that.

