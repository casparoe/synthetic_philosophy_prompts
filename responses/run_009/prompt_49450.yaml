answer: |-
  ### Exam Question: Judy Benjamin Problem

  **Setup:**  
  Judy is dropped in a region with two territories: Blue (prior probability 0.3) and Red (prior probability 0.7). Each territory is divided into quadrants A, B, C, D. The prior is uniform within each territory:  
  - Each Blue quadrant: \(0.075\)  
  - Each Red quadrant: \(0.175\)  

  HQ sends two messages:  
  1. **Message 1:** "You are not in quadrant C."  
  2. **Message 2:** "If you are in quadrant A, then the odds are 3:1 that you're in Blue territory."  

  Updates:  
  - **Message 1** is handled by Bayesian conditioning (eliminate C quadrants, renormalize).  
  - **Message 2** is handled by Adams conditioning (set \(P(\text{Blue} \mid A) = 3/4\), adjust probabilities of Blue-A and Red-A proportionally to their current values, leave non-A cells unchanged).  

  **Questions:**  
  **(a)** Compute Judy’s final credence in Blue and in each quadrant (A, B, C, D) if the messages arrive in the order 1-then-2. Show the intermediate distribution after each update.  
  **(b)** Compute the same if the messages arrive in the order 2-then-1. Does the order matter? If yes, is this a bug (flaw in Adams conditioning) or a feature (genuine difference in evidence)?  
  **(c)** Short essay: Judy complains that the conditional message (2) was "useless" and she’d be no worse off ignoring it. Is she right? Specifically, can ignoring such a conditional message ever be rational when the source is reliable but the antecedent (being in A) is unverifiable? Take a position and justify it.  

  ---

  ### Model Answer (≈650 words)  
  **(a) Order: Message 1 then Message 2**  
  - **After Message 1 (eliminate C):**  
    Eliminate Blue-C and Red-C. Remaining probability: \(0.075 \times 3 + 0.175 \times 3 = 0.75\).  
    Renormalize (divide by 0.75):  
    - Blue-A: \(0.075 / 0.75 = 0.1\)  
      Blue-B: \(0.1\), Blue-D: \(0.1\)  
    - Red-A: \(0.175 / 0.75 = 7/30 \approx 0.2333\)  
      Red-B: \(7/30\), Red-D: \(7/30\)  
  - **After Message 2 (Adams conditioning on A):**  
    Current \(P(A) = 0.1 + 7/30 = 1/3\).  
    Set \(P(\text{Blue} \mid A) = 3/4\):  
    - New \(P(\text{Blue-A}) = (3/4) \times (1/3) = 0.25\)  
      New \(P(\text{Red-A}) = (1/4) \times (1/3) = 1/12 \approx 0.0833\)  
    Non-A cells (B, D) unchanged:  
    - Blue-B: \(0.1\), Blue-D: \(0.1\)  
      Red-B: \(7/30 \approx 0.2333\), Red-D: \(7/30\)  
  - **Final credences:**  
    - \(P(\text{Blue}) = 0.25 + 0.1 + 0.1 = 0.45\)  
    - Quadrants:  
      - \(P(A) = 0.25 + 1/12 \approx 0.3333\)  
      - \(P(B) = 0.1 + 7/30 \approx 0.3333\)  
      - \(P(C) = 0\)  
      - \(P(D) = 0.1 + 7/30 \approx 0.3333\)  

  **(b) Order: Message 2 then Message 1**  
  - **After Message 2 (Adams conditioning on A):**  
    Prior \(P(A) = 0.075 + 0.175 = 0.25\).  
    Set \(P(\text{Blue} \mid A) = 3/4\):  
    - New \(P(\text{Blue-A}) = (3/4) \times 0.25 = 0.1875\)  
      New \(P(\text{Red-A}) = (1/4) \times 0.25 = 0.0625\)  
    Non-A cells unchanged:  
    - Blue-B: \(0.075\), Blue-C: \(0.075\), Blue-D: \(0.075\)  
      Red-B: \(0.175\), Red-C: \(0.175\), Red-D: \(0.175\)  
  - **After Message 1 (eliminate C):**  
    Eliminate Blue-C and Red-C. Remaining probability: \(0.1875 + 0.075 + 0.075 + 0.0625 + 0.175 + 0.175 = 0.75\).  
    Renormalize (divide by 0.75):  
    - Blue-A: \(0.1875 / 0.75 = 0.25\)  
      Blue-B: \(0.075 / 0.75 = 0.1\), Blue-D: \(0.1\)  
    - Red-A: \(0.0625 / 0.75 = 1/12 \approx 0.0833\)  
      Red-B: \(0.175 / 0.75 = 7/30 \approx 0.2333\), Red-D: \(7/30\)  
  - **Final credences:**  
    - \(P(\text{Blue}) = 0.25 + 0.1 + 0.1 = 0.45\)  
    - Quadrants: \(P(A) \approx 0.3333\), \(P(B) \approx 0.3333\), \(P(C) = 0\), \(P(D) \approx 0.3333\)  
  - **Order does not matter:** Final distributions are identical in both orders. Adams conditioning commutes with the elimination update here. This is a *feature*: The evidence is order-invariant, so no "bug" exists.  

  **(c) Judy is wrong**  
  Ignoring Message 2 is irrational. The message *does* affect Judy’s beliefs, even though the antecedent (being in A) is unverifiable:  
  - Without Message 2, after Message 1, \(P(\text{Blue}) = 0.1 + 0.1 + 0.1 = 0.3\).  
  - With Message 2, \(P(\text{Blue}) = 0.45\).  
  The change occurs because Message 2 alters the weight of the A-region within Blue versus Red. Though the message explicitly constrains only \(P(\text{Blue} \mid A)\), it implicitly shifts probability *from Red-A to Blue-A* (in this case, increasing Blue-A by 0.15 and decreasing Red-A by 0.15). Since A is possible, this changes the overall \(P(\text{Blue})\).  

  A reliable conditional message can only be ignored if it matches current conditional credences (e.g., if Judy already had \(P(\text{Blue} \mid A) = 3/4\)). But Judy cannot assume this; rationality requires updating on all reliable evidence, even if the antecedent is unverified. Here, ignoring Message 2 leaves her with an inaccurate credence (0.3 vs. 0.45), so she is "worse off."  

  ---

  ### Marking Scheme (20 points total)  
  **Part (a) (8 points):**  
  - Message 1 update: Correct elimination of C and renormalization (2 points).  
  - Intermediate probabilities: Blue-A/B/D each 0.1; Red-A/B/D each \(7/30\) (2 points).  
  - Message 2 (Adams): Correct \(P(\text{Blue-A}) = 0.25\), \(P(\text{Red-A}) = 1/12\), non-A unchanged (2 points).  
  - Final \(P(\text{Blue}) = 0.45\) (1 point).  
  - Final quadrants: \(P(A)=P(B)=P(D)=1/3\), \(P(C)=0\) (1 point).  

  **Part (b) (7 points):**  
  - Message 2 (Adams): Correct \(P(\text{Blue-A}) = 0.1875\), \(P(\text{Red-A}) = 0.0625\), non-A unchanged (2 points).  
  - Message 1 update: Correct elimination of C and renormalization (2 points).  
  - Final distribution matches part (a) (2 points).  
  - States order does not matter (1 point).  

  **Part (c) (5 points):**  
  - Notes \(P(\text{Blue})\) changes (0.3 without Message 2 vs. 0.45 with) (1 point).  
  - Explains *why*: Message 2 shifts probability within A, affecting overall Blue (2 points).  
  - Rejects Judy’s claim: Ignores reliable evidence (1 point).  
  - Qualifies that ignoring is only rational if current credences match the message (1 point).  

  **Deductions:**  
  - Part (a/b): Arithmetic errors (-1 per major miscalculation).  
  - Part (b): Claims order matters without justification (-2).  
  - Part (c): Asserts no change outside A or claims message is irrelevant (-2).  

  ---

  ### Common Mistakes & A/B Differentiation  
  **Expected mistakes:**  
  1. **Prior misstep:** Using quadrant probabilities as 0.15 (Blue) and 0.175 (Red) without normalizing (total Blue becomes 0.6, not 0.3).  
  2. **Adams conditioning error:** Changing non-A cells or renormalizing the entire distribution after Message 2.  
  3. **Order (b):** Incorrectly asserting order matters due to arithmetic errors.  
  4. **Part (c):** Claiming Message 2 only affects A-cells, so \(P(\text{Blue})\) is unchanged.  

  **A vs. B in part (b):**  
  - **A answer:** Computes both orders correctly, shows distributions match, concludes order invariance.  
  - **B answer:** Has minor arithmetic errors but correct method; or correctly computes one order but not both; or states order doesn’t matter without verification.  
  - **C/D answer:** Claims order matters due to misunderstanding Adams conditioning (e.g., "Message 2 is invalid after C is eliminated").  

  **Note:** The question is self-contained; no external literature is needed.
