prompt: |-
  In the metaphysics seminar I'm designing, I want students to practice diagnosing when a dispute is merely verbal, as opposed to substantive. To that end, I've come up with a working distinction that I'd like you to apply, and I'm curious how you'd triage a set of classic debates under it.

  My distinction is between three ways a dispute can be "verbal":

  1. Quantifier-verbal: the parties agree on all the ordinary facts, but their quantifiers range over different domains, so each side's existence claims come out true on their own usage (e.g., one side says "there is a table" while the other says "there are only particles arranged table-wise," and neither is disagreeing about the arrangement itself).
  2. Criterion-verbal: the parties agree on the underlying facts but implicitly fix the criteria for applying a predicate differently, so the fight is over which criteria are built into a word, not over what the world is like.
  3. Substantive: the disagreement persists no matter how one tinkers with words; some possibility is genuinely open or closed.

  Please evaluate the following six debates: (a) whether a statue is identical to the lump of clay that constitutes it; (b) whether mereological composition ever occurs (the composition question); (c) whether the Ship of Theseus, planked over year by year, remains the same ship; (d) whether holes exist; (e) whether a person survives teleportation with all memories and traits preserved; (f) whether there are objective joint-carvings in nature or only useful groupings of individuals into kinds.

  For each debate, give a verbalness score from 0.0 to 1.0, where 1.0 means you judge the dispute to be entirely verbal (in either the quantifier-verbal or criterion-verbal sense) and 0.0 means entirely substantive. For any debate you score above 0.5, say explicitly whether it is quantifier-verbal or criterion-verbal (or a mix, with the mixture's rough proportions). Then produce an overall ranking from most verbal to least verbal, and for each item in the ranking give a one-to-two-sentence justification. Finally, tell me which single debate you'd pick for the seminar's first session, given that I want the clearest possible illustration of the difference between the quantifier-verbal and criterion-verbal categories, and why.
reasoning: |-
  Okay, let me approach this systematically. The user is designing a metaphysics seminar and wants help analyzing philosophical debates through their proposed verbalness framework. They've shared a nuanced tripartite distinction (quantifier-verbal, criterion-verbal, substantive) and six classic metaphysical puzzles to evaluate. 

  First I need to internalize their taxonomy: quantifier-verbal disputes involve different ontological commitments without factual disagreement (like table vs particles), while criterion-verbal disputes center on definitional boundaries (what counts as "same ship" or "hole"). Substantive disputes resist linguistic resolution. 

  Looking at the debates: 
  - The statue/clay identity seems criterion-verbal (0.8) - turns on whether "identical" requires exact spatiotemporal coincidence or allows temporary coincidence. 
  - Mereological composition feels quantifier-verbal (0.9) - hinges on unrestricted vs restricted domains of quantification for "composition occurs".  
  - Ship of Theseus is predominantly criterion-verbal (0.75) - concerns the definition of persistence conditions for "same ship".  
  - Holes debate is quantifier-verbal (0.95) - disagreement dissolves if we specify whether "exist" applies to immaterial absences.  
  - Teleportation survival blends both types (0.6 quantifier, 0.3 criterion) - involves existence questions (quantifier) and personal identity criteria (criterion).  
  - Natural kinds is substantive (0.1) - reflects deep disagreement about mind-independent structure.  

  For the seminar opener, I'd select the holes debate. It's exceptionally pure: one side claims holes exist as real absences, the other denies them as mere topological descriptions. This cleanly separates quantifier issues (what we commit to existing) from criterion issues (how we define "existence" for voids), making the taxonomy vivid without contamination. The statue/clay case would be a close second but involves temporal complications that might distract beginners.  

  The user's framework is sophisticated - they clearly want students to disentangle linguistic from metaphysical disagreements. I should emphasize how quantifier-verbal disputes often map onto ontological parsimony debates, while criterion-verbal ones relate to semantic contextualism. The natural kinds case remains stubbornly substantive precisely because it challenges the framework itself - perfect for advanced sessions.
answer: |-
  Here's my triage of the debates using your framework, with scores, classifications, rankings, and seminar recommendation:

  **Debate Analysis:**
  (a) **Statue = Lump of Clay?**  
  Score: **0.8** (Criterion-verbal, 80%; Quantifier-verbal, 20%)  
  Dispute centers on criteria for "identity" (strict Leibnizian vs. constitution-based) and quantifier scope over temporal parts. Agreement on physical facts about clay arrangement.

  (b) **Does Mereological Composition Occur?**  
  Score: **0.9** (Quantifier-verbal)  
  Nihilists restrict quantifiers to simples; universalists include composites. Identical descriptions of particle arrangements, differing only on what "there exists" includes.

  (c) **Ship of Theseus Identity**  
  Score: **0.75** (Criterion-verbal, 70%; Quantifier-verbal, 30%)  
  Turns on criteria for "same ship" (material continuity vs. form/function) and whether quantifiers range over temporal stages. Facts about plank replacement are uncontested.

  (d) **Do Holes Exist?**  
  Score: **0.95** (Quantifier-verbal)  
  Disagreement dissolves if quantifiers are specified: "hole" as absence (materialists deny existence) vs. posit of topological feature (realists affirm). All agree on the physical object's structure.

  (e) **Teleportation Survival**  
  Score: **0.4** (Substantive leaning)  
  Verbal elements involve criteria for "person" (psychological continuity vs. biological), but core disagreement about causal/metaphysical grounding of identity persists under linguistic tinkering.

  (f) **Objective Joint-Carvings in Nature?**  
  Score: **0.1** (Substantive)  
  Fundamental dispute about mind-independent structure. Linguistic adjustments can't resolve whether kinds reflect reality or utility; touches on laws, properties, and natural necessity.

  ---

  **Ranking (Most to Least Verbal):**  
  1. **Holes Exist? (d) - 0.95**  
     *Pure quantifier dispute: identical descriptions of perforated objects, divergent existential commitments based on domain restrictions.*  
  2. **Mereological Composition (b) - 0.9**  
     *Quantifier-verbal: universalists/nihilists describe identical arrangements but quantify over different entities (wholes vs. simples).*  
  3. **Statue = Clay? (a) - 0.8**  
     *Primarily criterion-verbal: disagreement hinges on definition of "identity" (endurantist vs. constitution-theoretic criteria), not physical facts.*  
  4. **Ship of Theseus (c) - 0.75**  
     *Mostly criterion-verbal: dispute over persistence conditions ("same ship" defined by material or functional criteria), with minor quantifier elements.*  
  5. **Teleportation Survival (e) - 0.4**  
     *Mixed but substantive: verbal aspects in "survival" criteria, but core disagreement about identity metaphysics resists linguistic resolution.*  
  6. **Objective Joint-Carvings (f) - 0.1**  
     *Robustly substantive: disputes reality's structure vs. conceptual schemes; linguistic tinkering can't close the possibility gap.*

  ---

  **Recommended First Debate: Holes (d)**  
  **Why:** It provides the clearest *contrast* between your categories.  
  - **Quantifier-verbal interpretation**: Realists quantify over holes as immaterial objects; eliminativists restrict quantifiers to material entities (both agree on the physical matrix).  
  - **Criterion-verbal interpretation**: Disagreement over whether "exists" applies to absences/features (e.g., "hole" as a predicate requiring a host vs. independent entity).  
    
  This case isolates the distinction perfectly: parties can be seen as either (1) *quantifying differently* over ontological categories or (2) applying *criteria for "existence"* to the same structure. The physical facts are undisputed, making the verbal mechanisms transparent. Statue/clay (a) is a close second but introduces temporal complications that may muddy initial exposure.
