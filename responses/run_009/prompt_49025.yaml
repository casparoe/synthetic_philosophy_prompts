prompt: |-
  My friend and I have been arguing about where corruption actually begins, and I've been keeping a list of her verdicts so I can pin down her underlying rule, but I can't do it. Her calls so far: a patient giving her surgeon a box of expensive chocolates after a successful operation, not corruption; a contractor handing a city procurement officer an envelope of cash after winning a bid, obviously corruption; wealthy donors paying to attend dinners where the mayor takes questions in private, not corruption — her view there is that everyone knows this is how politics works, and nobody is guaranteed anything; in the small town where her grandmother grew up, everyone gave gifts to a well-connected local man who used his relationships to get their paperwork unstuck from the bureaucracy, and she insists that was not corruption either, just how the place functioned; but she called it corruption when a ministry official hired his own brother for a job the brother couldn't do. What strikes me is that all of these seem consistent with several different principles at once: maybe she thinks corruption requires an explicit trade of money for a specific official act; maybe she thinks it requires an official abandoning impartial duty; maybe she thinks it's whatever the local norms condemn. Now she has a new case to judge, and I want your prediction before I show her your answer: the principal of a selective public school admits a donor's academically weak child shortly after the donor funds the school's new gym, with nothing going to the principal personally and the gym benefiting every student. Which rule is my friend really running, what will she say here, and what further case should I put to her that would actually distinguish the rules from each other? I'd also like your honest view on whether any of the three rules gets at what corruption really is, or whether all of them miss something her intuitions are tracking.
reasoning: |-
  Okay, let me try to unpack this user's problem. They've been arguing with their friend about what constitutes corruption, and they've listed several scenarios where their friend made judgments. The user wants to figure out the underlying rule their friend is using. 

  First, I need to look at the examples provided. The patient giving chocolates to a surgeon after surgery isn't corruption. That makes sense because it's a gift after the fact without any prior agreement. Then there's the contractor giving cash to a procurement officer after winning a bid—definitely corruption. That's a clear quid pro quo. 

  Next, wealthy donors attending dinners with the mayor for private chats. The friend says not corruption because it's transparent and no guarantees. The user mentions the grandma's town where gifts to a fixer aren't seen as corruption because it's the norm. But hiring an unqualified brother is corruption. 

  Hmm, the key here seems to be whether there's an explicit exchange. The chocolates are a thank-you, no prior agreement. The cash is a direct payment for the bid. The donors get access but no specific promises. The fixer operates within accepted local practices. Hiring the brother is nepotism without merit. 

  So the friend's rule might be about explicit quid pro quo versus implicit understandings. Transparency and local norms matter to her. Now the new case: a school admits a donor's weak child after funding a gym. Nothing personal for the principal, gym benefits all. 

  I think the friend will say this isn't corruption. Why? No personal gain, the gym helps everyone, and it's similar to the donor dinners—access but no guaranteed outcome. The admission might be seen as a reciprocal gesture without explicit trade. 

  But wait, the user wants to distinguish between the three rules: explicit trade, abandoning duty, or local norms. The new case lacks explicit trade and personal gain, so it fits the friend's pattern. To test, propose a case where local norms accept something that involves explicit trade but no personal gain. Maybe a small town where bribes are normal to speed up permits. If she calls it corruption despite norms, then norms aren't her main factor. If not, then local acceptance matters more. 

  As for what corruption really is, each rule captures aspects but misses systemic issues. Explicit trade is straightforward but ignores implicit exchanges. Abandoning duty is key but doesn't cover norm-driven actions. Local norms vary, so corruption might be relative, but there's a universal harm in unfair advantage. The friend's view is pragmatic, focusing on transparency and no personal enrichment, but might overlook institutional corruption where the system itself is skewed.
answer: |-
  Based on your friend's pattern of judgments, her underlying rule appears to be: **Corruption requires an *explicit, personalized quid pro quo* where a *specific benefit is traded for a specific official act*, violating formal rules and impartiality.** Her judgments consistently forgive *implicit reciprocity*, *systemic practices*, or *non-personalized benefits*, even when they distort fairness.

  **Breaking down her reasoning from past cases:**
  1.  **Chocolates for Surgeon (Not Corruption):** Gift given *after* the service, no prior agreement, no specific act traded.
  2.  **Cash to Procurement Officer (Corruption):** Explicit, direct payment *for* winning the bid (specific act).
  3.  **Donor Dinners with Mayor (Not Corruption):** Access and influence are implicit/systemic ("how politics works"); no *guaranteed* specific outcome traded for payment.
  4.  **Gifts to Local Fixer (Not Corruption):** Seen as a *functional norm* ("how the place functioned"); not an explicit trade violating rules the community recognizes as binding. The benefit comes from relationships, not a direct cash-for-act.
  5.  **Hiring Unqualified Brother (Corruption):** Explicit violation of impartiality and merit (formal rules) for *personal/familial gain* (nepotism). A specific job given for a specific (familial) reason.

  **Prediction for the New Case (School Principal & Donor):**
  *   **Your friend will likely say this is *NOT* corruption.**
  *   **Why it fits her rule:**
      *   **No Explicit Quid Pro Quo:** There's no evidence of a verbal/written agreement like "Pay for the gym, and I'll admit your child." The timing is suggestive, but not explicit proof of a direct trade.
      *   **No Personalized Gain:** The principal didn't pocket the money; the benefit (the gym) went to the *entire school*. This parallels the donor dinners benefiting the campaign/cause, not the mayor personally.
      *   **Systemic/Norm-like:** She might argue this is an unfortunate but accepted reality of how underfunded public institutions sometimes operate ("everyone knows this happens"), similar to the donor dinners or the local fixer. The *act* (admission) isn't explicitly *traded* for the *donation*.
      *   **Violates Impartiality?** While it *objectively* violates meritocracy, her past judgments (fixer, dinners) show she downplays this if the *mechanism* isn't an explicit, personalized exchange violating clear formal procedures in the moment.

  **The Critical Test Case to Distinguish the Rules:**

  Propose this scenario: **"In a country where bribery is culturally normalized and expected for basic services, a citizen explicitly hands cash to a low-level customs officer *before* processing their paperwork, saying 'This is for you to approve my forms quickly.' The officer accepts the cash and processes the forms immediately, ahead of others."**

  *   **How her rule (Explicit Quid Pro Quo) would judge:** **CORRUPTION.** Clear explicit trade of cash ("This is for you...") for a specific official act (fast-tracking paperwork). Personal gain to the officer.
  *   **How the "Abandoning Impartial Duty" rule would judge:** **CORRUPTION.** The officer prioritized personal gain over fair treatment and procedure.
  *   **How the "Local Norms Condemn" rule would judge:** **NOT CORRUPTION.** If the norm *expects and accepts* this practice ("how the place functions"), it wouldn't be condemned locally, similar to her grandmother's fixer. This directly conflicts with the other two rules.

  **Analysis: What Corruption "Really Is" and Her Intuitions:**

  1.  **Explicit Quid Pro Quo:** Captures the clearest, most egregious form of bribery. It's legally and ethically unambiguous. *Weakness:* Misses systemic corruption, nepotism without explicit deals (though she called out the brother!), influence peddling, and situations where norms enable corruption (like the test case). Her view forgives too much.
  2.  **Abandoning Impartial Duty:** Gets closer to the core *harm* of corruption – the subversion of fairness, merit, and the public trust for private gain. It covers nepotism (brother), bribery (cash), and likely the school case. *Weakness:* Can be overly broad (is the chocolates surgeon abandoning duty? Her "no" suggests she sees a distinction between gratitude and influence). Her fixer/dinner judgments show she doesn't consistently apply this.
  3.  **Local Norms Condemn:** Recognizes corruption is socially constructed. *Weakness:* Dangerously relativistic. Allows horrific practices to be excused as "just how things work" (e.g., the test case bribery). This fails as a universal definition. Her judgment on the brother shows she *doesn't* fully rely on this – hiring family might be the norm somewhere, but she still called it corrupt.

  **Your friend's intuitions are tracking a *pragmatic, transactional* definition:** She focuses intensely on the *mechanism of exchange* – is it a direct, explicit, personalized trade violating formal rules? She's much more forgiving of:
  *   **Implicit exchanges** (dinners, the school donation/admission link).
  *   **Systemic practices** (dinners, local fixer).
  *   **Benefits diffused beyond the official** (gym for school, fixer's role in community function).
  *   **Actions lacking explicit proof of a prior agreement.**

  **What she misses (and what corruption often *really* is):** The core of corruption is the **misuse of entrusted power for private gain**, undermining fairness, equity, and institutional integrity. Her rule misses:

  *   **Institutional Corruption:** Systems (like donor access or norm-driven fixers) that systematically distort fairness, even without explicit deals.
  *   **Nepotism/Favoritism:** Giving undue advantage based on connections (like the brother, and arguably the school case), not just cash trades.
  *   **Harm to Public Interest:** The school case harms meritocracy and fairness for all students, even if no one person pocketed cash. The donor dinners undermine equal access to influence.
  *   **The "Grey Area":** Much real-world corruption operates in the space she excuses – implicit understandings, systemic advantages, norm-driven practices that pervert fairness.

  **Conclusion:** Your friend's rule is overly narrow, focusing on the crudest bribery while excusing more subtle but equally damaging forms of corruption based on implicitness, diffusion of benefit, or normalization. Her likely "not corruption" verdict on the school case highlights this limitation. The test case involving culturally normalized but explicit bribery will force her to either condemn it (showing her rule prioritizes the *explicit mechanism* over local norms) or excuse it (showing dangerous relativism). Neither her rule nor the other two fully capture the multifaceted harm of corruption, which fundamentally erodes fair and equitable governance. Her intuitions track the *form* of the transaction but downplay its *impact* on fairness and the public good.
