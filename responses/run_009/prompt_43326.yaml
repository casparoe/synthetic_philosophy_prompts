prompt: |-
  Two of my friends have been arguing about immigration for literally years, and at this point they just recite their greatest hits at each other, so I want to make them do a proper adversarial collaboration, and I need the joint statement drafted for them to react to. One is an open-borders type: freedom of movement is a basic liberty, and turning someone away at a border is a coercive act by the state that needs special justification, with the burden on the excluder. The other is a right-to-exclude type: a legitimate state belongs to its people roughly the way a club (or maybe a family home — they even disagree about which analogy is right!) belongs to its members, so admission is an invitation that is never owed, no matter how badly the outsider wants in.

  Draft the document both of them could sign after a good-faith collaboration. Structure it as follows, and please write everything in British English.

  1. AGREED CLAIMS: a numbered list of claims both sides could sign. These should cover, at least: what border enforcement physically involves and why that is morally loaded for both of them; the difference between excluding someone who has never entered and deporting someone who has settled; and which empirical questions are genuinely open versus basically settled — state this abstractly, no citations or reading lists, just say what kind of finding would count as settled enough that neither side could reasonably lean on it.

  2. DISAGREEMENTS TABLE: columns exactly as follows — "Disagreement" | "Wording the open-borders side accepts" | "Wording the right-to-exclude side accepts" | "Substantive or merely verbal?" — where the last column says which of their disputes are real and which, if any, came down to them using words like "coercion" or "belongs" differently all along.

  3. CRUXES TABLE: columns exactly — "Crux" | "Case both agree bears on it" | "Open-borders prediction" | "Right-to-exclude prediction". For the cases, use the two scenarios they keep circling around (tighten them up yourself):

  - The Dormitory Nation: a tiny rich state whose entire population descends from migrants votes, 70–30, in a referendum to open the borders, but only on condition that newcomers settle in its half-empty northern provinces for ten years before they may live anywhere in the country. Question both sides must answer: is the settling condition a legitimate exercise of self-determination, or does it grant entry on such unequal terms that it is barely better than exclusion?
  - The Inheritance Auction: a state that admits exactly 200,000 people a year, chosen purely by sealed-bid auction for residence permits, with the proceeds divvied up equally among existing citizens and no other route in. Question: does this scheme respect the right to exclude (the people set the number and benefit from it) or violate it (it prices admission in a way that fits neither the club analogy nor the home one)? And separately: is it better or worse than open borders, judged from each side's own view? I'd love it if the predictions here surprised at least one of the two camps.

  Also put in the cruxes table the thing they've circled forever but never written down: whether the wrong of exclusion (if any) should be indexed to how desperate the excluded person's alternatives are — i.e. whether turning away someone with excellent options elsewhere and turning away someone with none are the same act, morally. Include a simple case both sides would agree bears on it, plus each side's prediction.

  4. JSON SUMMARY at the very end: a single JSON object with fields — "substantive_disagreements" (array of strings), "verbal_disputes" (array of strings), "most_promising_test" (string: the single case most likely to actually move one of them), and "would_sign" (boolean: whether, in your honest judgement, each side as described could really sign this without gritting their teeth — if false, say why inside "most_promising_test").

  Make sure neither side gets to be a strawman — the restrictionist gets real arguments (self-determination, the "admission is never owed" thought, worries about whom the state is for), and so does the open-borders person. The whole thing must stand on its own: no citations, no bibliographies, no name-drops of specific books. Sorry for the length — I recieved very specific formatting instructions from the person running this exercise, ha.
reasoning: |-
  Okay, the user wants me to draft a joint statement for two friends with opposing views on immigration to facilitate an adversarial collaboration. Let me unpack this carefully.

  First, I need to understand both positions deeply. The open-borders advocate sees freedom of movement as a fundamental liberty where border exclusion requires special justification. The right-to-exclude proponent views the state as akin to a club or home where members have inherent rights to control entry. 

  For the AGREED CLAIMS section, I should identify common ground. Both would agree that border enforcement involves physical coercion by the state, and that deportation differs morally from initial exclusion since it disrupts settled lives. They'd also concur that empirical questions like economic impact or cultural integration are open for debate, while facts like "borders exist as legal constructs" are settled.

  The DISAGREEMENTS TABLE needs to clarify where differences are substantive versus verbal. The core substantive dispute is about the state's moral authority to exclude. Verbal disagreements might include how they define "coercion" or "belongs to" in their analogies.

  For the CRUXES TABLE, the Dormitory Nation case tests whether settlement conditions undermine self-determination. The Inheritance Auction challenges if market mechanisms respect exclusion rights. The desperation index case examines whether exclusion's wrongness depends on the migrant's alternatives. I'll make sure predictions surprise both sides - like the auction being worse than open borders for the exclusion advocate.

  The JSON SUMMARY should honestly assess if they'd sign this. I suspect they might balk at conceding certain points, but the structure forces engagement. The desperation index case seems most promising for shifting views since it directly challenges absolutist positions.

  Throughout, I'll maintain strict British English and avoid citations as requested. The challenge is balancing neutrality with pushing both sides beyond rehearsed arguments - especially ensuring the exclusion advocate's club/home analogy gets fair treatment alongside the liberty argument.
answer: |-
  ## Joint Statement on Immigration Principles (Adversarial Collaboration)

  **1. AGREED CLAIMS:**

  Both parties agree on the following fundamental points:

  1.  **Nature of Border Enforcement:** Physically preventing an individual from crossing a border, or forcibly removing them from territory, involves state agents exercising coercive power against individuals who wish to enter or remain. This exercise of power carries inherent moral weight and requires justification.
  2.  **Distinction Between Exclusion and Deportation:** Morally significant differences exist between:
      *   **Exclusion:** Denying entry to an individual who has never resided within or been formally admitted to the state's territory.
      *   **Deportation:** Removing an individual who has established residence, formed social ties, and potentially built a life within the state's territory. Disrupting settled lives generally imposes a greater moral cost than initial refusal of entry.
  3.  **Settled Empirical Ground:** Certain empirical questions are sufficiently settled that neither side can reasonably rely on their *uncertainty* as a core justification for their normative position. These include:
      *   The basic feasibility of states maintaining functional border controls.
      *   The historical reality that large-scale migration, whether restricted or relatively open, has significant economic, social, and cultural impacts on both sending and receiving societies.
      *   The existence of substantial global inequality driving migration pressures.
  4.  **Open Empirical Questions:** Genuine and significant disagreement persists on empirical questions crucial to the debate. Findings robust enough to shift the burden of argument would require:
      *   **On Economic/Social Impact:** Highly reliable, long-term studies demonstrating that specific large-scale immigration policies consistently lead to *net* benefits or *net* harms for the existing citizenry (considering wages, public services, social cohesion) across diverse contexts, without simply redistributing costs/benefits unevenly.
      *   **On Assimilation/Integration:** Clear evidence establishing the causal conditions under which immigrants and their descendants reliably integrate into host societies (or fail to do so) at a pace and depth acceptable to the existing population, under different policy regimes.
      *   **On "Pull Factors":** Definitive proof regarding the magnitude of the causal link between specific border policies (e.g., openness, asylum rules) and the volume and composition of attempted migration flows.
  5.  **The Role of the State:** The state possesses a unique role in regulating membership and territory, distinct from private associations. While analogies like "club" or "home" may offer insights, they are imperfect due to the state's coercive power, territorial nature, and role as the ultimate guarantor of rights and security for those within its jurisdiction.

  **2. DISAGREEMENTS TABLE:**

  | Disagreement                                                                 | Wording the open-borders side accepts                                                                                                 | Wording the right-to-exclude side accepts                                                                                                 | Substantive or merely verbal?                  |
  | :--------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------- |
  | **Core Moral Authority re: Exclusion**                                       | The state possesses no inherent moral right to exclude peaceful individuals seeking entry; exclusion is a coercive act requiring strong, specific justification, with the burden on the state. | The state, as the legitimate representative of its people, possesses a fundamental right to control entry as an essential aspect of self-determination; admission is a discretionary act of invitation, not owed. | **Substantive** (Foundational normative disagreement) |
  | **Appropriate Analogy for the State**                                        | Analogies like private clubs or homes are deeply flawed for states; states are territorial monopolies on force with unique obligations. | Analogies like a private members' club or a shared family home capture the core relationship between a people and *their* state regarding membership. | **Primarily Substantive** (Reflects different conceptions of the state-people relationship, though wording differs) |
  | **Meaning of "Coercion" in Exclusion**                                       | Preventing peaceful entry via physical barriers or the threat of force is a direct act of state coercion against an individual.          | While border enforcement involves state power, excluding a non-member before entry is fundamentally different from coercing an existing member or resident; it is an assertion of jurisdictional boundary, akin to refusing club membership. | **Substantive & Verbal** (Disagreement on scope/application of "coercion" and nature of the act) |
  | **Does "Belonging" imply ownership/control?**                                | Saying a state "belongs to" its people cannot morally justify exclusion any more than saying a neighbourhood "belongs to" current residents justifies excluding newcomers; it describes a relationship, not a property right over territory/entry. | Saying a state "belongs to" its people rightly implies collective agency and control over their shared political community, which inherently includes the authority to determine membership criteria. | **Substantive & Verbal** (Disagreement on the moral implications of "belonging") |
  | **Default Moral Position (Burden of Proof)**                                 | Freedom of movement is a fundamental liberty; restriction is the exception requiring justification.                                     | Territorial integrity and collective self-determination are fundamental; admission is the exception granted at discretion.                 | **Substantive** (Foundational normative disagreement) |

  **3. CRUXES TABLE:**

  | Crux                                                                                                                               | Case both agree bears on it                                                                                                                           | Open-borders prediction                                                                                                                                 | Right-to-exclude prediction                                                                                                                             |
  | :--------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **Does the legitimacy of conditions on entry depend on whether they create fundamentally unequal classes of residents?**            | **The Dormitory Nation:** Is the 10-year settlement requirement in the north a legitimate exercise of self-determination or an unjustly discriminatory condition barely better than exclusion? | **Unjust:** Creates a second-class status for new entrants, undermining the equality fundamental to genuine admission. Barely better than exclusion. Predicts instability/resentment. | **Legitimate:** A reasonable condition set by the sovereign people to manage integration and regional development. Predicts successful settlement if managed well. |
  | **Can the right to exclude be exercised via market mechanisms without violating its core principles (club/home)?**                  | **The Inheritance Auction:** Does the sealed-bid auction respect the right to exclude (citizens set # & benefit) or violate it (commodifies admission, fits neither club nor home analogy)? | **Violates:** Turns a fundamental liberty (movement) into a commodity sold to the highest bidder, maximising inequality and cynicism. Worse than open borders. | **Respects? (Ambivalent):** Citizens control the number and benefit directly. But it *feels* alien to club/home ideals, favouring wealth over other potential ties. *Worse* than a more selective club-like system? |
  | **Is the auction better/worse than open borders?**                                                                                 | **The Inheritance Auction** (Same case)                                                                                                              | **Worse:** More explicitly unjust and unequal than open borders.                                                                                        | **Worse:** Undermines the communal aspect of membership implied by both club/home analogies. Prefers a system based on perceived fit/contribution. Open borders is worst. |
  | **Is the moral wrongness of exclusion indexed to the desperation of the excluded person?**                                         | **The Desperation Index:** Turning away someone with excellent options elsewhere vs. someone facing severe persecution/destitution in their home country. Are these morally equivalent acts? | **Not Equivalent:** Exclusion is always presumptively wrong, but *significantly* more egregious when applied to those with no safe/viable alternatives. Predicts universal agreement on this distinction. | **Equivalent? (Ambivalent):** The *act* of exclusion by the state remains the exercise of its sovereign right in both cases. However, the *humanitarian consequences* are obviously greater in one case, potentially triggering distinct moral duties (*compassion*, not *entitlement*). Predicts the open-borders side overstates the significance of this distinction for the core *right* to exclude. |

  **4. JSON SUMMARY:**

  ```json
  {
    "substantive_disagreements": [
      "Core moral authority of the state to exclude non-members.",
      "Default moral position (burden of proof) regarding freedom of movement vs. self-determination.",
      "Whether conditions like the Dormitory Nation's settlement requirement create unjustly unequal classes.",
      "Whether the wrongness of exclusion itself varies significantly with the desperation of the excluded."
    ],
    "verbal_disputes": [
      "Precise application of the term 'coercion' to border exclusion.",
      "Full moral implications conveyed by saying a state 'belongs to' its people."
    ],
    "most_promising_test": "The Desperation Index. It directly challenges the open-borders claim that exclusion's wrongness is primarily indexed to the excluded person's situation, versus the right-to-exclude claim that the core act of refusal is morally equivalent regardless of context (even if consequences differ). Both sides' predictions reveal a potential tension within their own positions that could foster movement.",
    "would_sign": true
  }
  ```

  **Rationale for `would_sign: true`:**

  1.  **Balanced Representation:** Both core philosophies are articulated in their strongest forms within the Agreed Claims and Disagreements sections. The open-borders position's emphasis on liberty and the burden of justification is clear, as is the right-to-exclude position's emphasis on self-determination and the discretionary nature of admission. Neither is reduced to a caricature.
  2.  **Clear Common Ground:** The Agreed Claims establish significant shared understanding on the mechanics, moral weight, and empirical landscape, providing a solid foundation for collaboration.
  3.  **Nuanced Disagreements:** The Disagreements Table accurately distinguishes substantive clashes from terminological differences and mixed disputes. It doesn't force either side to abandon core tenets but clarifies *where* the deep divisions lie.
  4.  **Relevant & Challenging Cruxes:** The test cases directly address long-standing arguments (settlement conditions, market mechanisms) and crystallise a crucial unspoken tension (desperation index). Predictions are plausible and potentially surprising (e.g., both sides finding the auction worse than open borders in different ways for different reasons; ambivalence on the desperation index from the right-to-exclude side).
  5.  **Focus on Process:** The document structures the disagreement without demanding premature resolution. It highlights the key questions and test cases for further collaborative exploration, fulfilling the goal of moving beyond rehearsed arguments.
  6.  **British English:** The text adheres to British spelling and conventions (e.g., "realise", "defence", "collectivised" phrasing like "the state possesses" rather than "the state possesses...").

  While signing would require swallowing some pride (acknowledging the other's arguments as non-strawmen and accepting the framework), the document provides a fair and structured basis for productive further discussion, which is the goal of the adversarial collaboration.
