  ## Keynote Address: Fifty Years of Framing the World

  [Raise glass] To Margaret. To her vision. To fifty years of this remarkable cooperative. [Set glass down]

  Friends, family, filmmakers, supporters – welcome. Standing here, where Margaret stood countless times, feels like standing on sacred ground. Not marble and gold, but ground hallowed by decades of fierce debate, shared struggle, late-night edits, and the unwavering belief that what we create *matters*. Margaret built this house on a foundation poured from W.E.B. Du Bois’s powerful, unflinching words. She carried his 1926 essay, "The Criteria of Negro Art," not like a pamphlet, but like scripture. And its core tenet – that **all art is propaganda** – wasn't just a theory to her; it was the air we breathe in a world shaped by race. She knew, as Du Bois argued, that the artist claiming neutrality has simply surrendered their voice to the dominant narrative, becoming unwitting propaganda *for* the status quo.

  Margaret’s generation, the pioneers in this room tonight, understood this with bone-deep clarity. They chose their subjects – the weight of history, the sting of injustice, the resilience of community – precisely *because* they understood the power of the frame. They knew that in a society structured by race, no Black film, no Black image, no Black story arrives in the world naked. It arrives already draped – embraced or burdened – by centuries of projection, stereotype, expectation, and struggle. For them, embracing "propaganda" wasn't about reducing art to a slogan; it was about seizing the frame. It was about insisting that beauty, truth, and the complexity of Black life be seen *on our own terms*, countering the distortions that flooded the screens and the streets. They understood Du Bois’s profound point: the very idea that art could exist in some pure, apolitical realm, divorced from its social meaning, was itself a luxury, a fiction, often available only to those whose humanity wasn't constantly on trial. The choice wasn't *between* propaganda and beauty; beauty *was* the weapon, the affirmation, the truth-telling that *was* the political act.

  [Gesture towards the younger filmmakers] And then there’s the brilliant, restless energy sitting here tonight – the generation whose formally adventurous, genre-bending, sometimes deliberately apolitical, sometimes unabashedly commercial work is being celebrated. We honor you. Your explorations of Afrofuturism, your intimate character studies, your sleek thrillers, your experiments with form and sound – they expand the language of cinema itself. They declare that Black creativity is boundless.

  But here’s where Margaret’s conviction, Du Bois’s enduring challenge, presses in. It asks: When does formal innovation risk becoming its own kind of insulation? When does the pursuit of the purely personal, or the strategically commercial, risk forgetting the weight of the frame that society *still* places around our work? Does the thrilling escape into fantasy sometimes inadvertently sidestep the messy, urgent realities that shaped the ground we stand on? Does the drive for mainstream success require navigating a system whose default settings still often demand a certain palatability, a softening of the edges Margaret so fiercely sharpened? The Du Boisian lens insists: even your dazzlingly abstract short, your slick romantic comedy – when released into *this* world, with *its* history – will be read, interpreted, and assigned meaning through the filter of race. Can you be sure that meaning aligns with your intent? Or does the sheer act of creating *without* explicit engagement sometimes leave that meaning vulnerable to being filled by others?

  These are hard questions. Margaret would have asked them, fiercely and lovingly. But here’s the crucial thing: this generation isn’t simply evading. You have answers. Profound ones.

  You answer by asserting that **expanding the *range* of Black expression *is* political.** Showing the full, glorious, contradictory spectrum of Black humanity – our joy, our interiority, our fantasies, our mundane moments – shatters the monolithic cage of stereotype far more effectively than any single-issue film ever could. You answer by mastering the *grammar* of cinema itself, proving technical brilliance isn't reserved for others, claiming every genre and technique as your birthright. You answer by building viable careers, creating economic power within our community, demonstrating that Black stories are *bankable*, shifting the industry’s calculus from the inside – a long game Margaret would deeply respect. You answer by understanding that sometimes, the most radical act is simply to *be*, unburdened, to explore the human condition without the constant demand to explain or protest. You answer by demanding the right to define beauty, complexity, and ambition on your own terms, refusing to be confined solely to the role of social critic.

  The tension in this room? It’s not a divide. It’s a dialogue – a necessary, generative friction. It’s the legacy of Margaret’s fierce clarity meeting the expansive vision of her heirs. The older generation reminds us that context is inescapable, that the frame exists, that art has consequence. The younger generation reminds us that the frame can be shattered, remade, painted over, or ignored in the pursuit of new ways of seeing. They remind us that claiming every facet of human experience, mastering every tool, and building sustainable futures *are* acts of profound defiance and creation.

  Margaret built this cooperative not as a museum for a single idea, but as a living workshop for Black cinematic vision. Fifty years on, that vision is richer, more varied, and more potent because it holds this tension. It honors Du Bois not by dogma, but by the vibrant, sometimes uncomfortable, always necessary conversation about what it means to create while Black, right here, right now.

  So, let us celebrate tonight. Celebrate the towering legacy of Margaret and her generation, who taught us the power of the frame. Celebrate the dazzling innovation of this new generation, who are painting breathtaking new pictures within it and beyond it. Celebrate fifty years of this cooperative – a testament to the enduring power of community, vision, and the unshakeable belief that our stories, in all their forms, are essential.

  [Raise glass again] To Margaret – her fire, her faith, her foundation. To the filmmakers – past, present, and future – who continue to frame our world, challenge our sight, and expand our horizons. To fifty more years of necessary, glorious, Black cinematic light. Cheers!
