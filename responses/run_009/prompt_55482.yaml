  I'm a PhD student in theoretical physics — my day job is gauge theories and their symmetries — and after a seminar disagreement about what it means to "quotient by the symmetry group," I've been reading into the metaphysics literature on the identity of indiscernibles, starting with Max Black's two-sphere universe. The physicist's instinct, that symmetry-related configurations are one physical situation described twice, keeps colliding with my gut verdicts about how many objects are in these worlds. I've now written down six cases with my verdicts on each, and I cannot find a single principle behind my own answers. I'd like you to tell me whether my verdicts are capturable at all, and if so by what principle, where a "principle" may be a single criterion or a principled package.

