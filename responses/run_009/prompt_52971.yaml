answer: |-
  Your query dissects a profound inconsistency in how legal systems handle microscopic harms across regulatory, tort, and criminal contexts. Below is a systematic analysis distinguishing presuppositions from rationalizations, coherence from contradiction, and underdetermined elements—followed by a projection of strict-aggregation alternatives.  

  ---

  ### **I. Brainstorming Candidate Philosophical Views**  
  1. **Genuine Threshold View (Non-Aggregative Ethics)**  
     - *Core Claim*: Harms below a threshold are morally null—not just imperceptible but *nonexistent* as wrongs. No number of sub-threshold harms sums to a bad outcome.  
     - *Supports*: Regulatory thresholds (e.g., EPA’s 1 in 1,000,000 de minimis cancer risk).  
     - *Tension*: Contradicts tort aggregation (e.g., *Amchem v. Windsor* aggregating asbestos exposure claims).  

  2. **Administrative Pragmatism (Aggregative Ethics + Feasibility Constraints)**  
     - *Core Claim*: All harms *matter*, but aggregation is abandoned when:  
       - **Epistemic costs** exceed benefits (e.g., proving causation for 0.001% increased cancer risk across 10,000 sources).  
       - **Transaction costs** dwarf redress (e.g., monitoring each car’s CO₂ contribution to climate change).  
       - **Institutional limits** prevent coherent enforcement (e.g., no "registry" of cumulative micro-exposures).  
     - *Compatible with*: Utilitarianism that accepts Pareto-irrelevant harms below detection thresholds.  

  3. **Hybrid View (Contextual Aggregation)**  
     - *Core Claim*: Aggregation is permissible *across victims* (tort) but prohibited *across sources* (regulation) due to:  
       - **Causal asymmetry**: Tort addresses single-source/multi-victim harms; regulation governs multi-source/single-victim exposures.  
       - **Temporal discounting**: Future diffuse harms are discounted vs. present concentrated ones.  

  4. **Incommensurability View**  
     - *Core Claim*: Regulatory thresholds reflect "safe" vs. "unsafe" as qualitatively distinct states (like Rawlsian lexical thresholds), while tort uses monetary commensuration.  

  ---

  ### **II. Reconstructing the Implicit Theory**  
  **What Practice Strictly Presupposes**:  
  - **Non-aggregation across sources** is foundational to regulatory design. A pollutant’s lawfulness is source-specific; cumulative impacts are excluded by *structural omission* (not just cost concerns).  
  - **De minimis as moral truncation**: Below-threshold risks are treated as *ontologically void*—e.g., FDA’s Delaney Clause exceptions for "trivial" carcinogens.  

  **What It Is Merely Consistent With**:  
  - Administrative pragmatism (e.g., OSHA feasibility standards). This *rationalizes* but does not *require* thresholds.  
  - Rule-utilitarian trade-offs (e.g., thresholds maximize welfare by avoiding regulatory paralysis).  

  **Key Distinction**:  
  - **Presupposition**: Sub-threshold exposures *do not exist as harms* in regulatory calculus.  
  - **Consistency**: Systems *could* aggregate if costs were lower (but they structurally don’t).  

  ---

  ### **III. Coherence Analysis**  
  **Apparent Tension**:  
  - Regulation: Ignores cumulative sub-threshold harms (e.g., 10,000 factories each emitting 0.1x threshold PM2.5).  
  - Tort: Aggregates microscopic harms (e.g., *In re Methyl Tertiary Butyl Ether* aggregating groundwater contamination claims).  
  - Criminal Law: Treats distributed harm as *more* culpable (e.g., *State v. Avery*: poisoning 100 people with 1% lethal dose each = murder).  

  **Resolution via Consistent Implicit View**:  
  - **Aggregation Across Victims ≠ Aggregation Across Sources**:  
    - Tort/criminal law aggregates harms *to a group* from *one source/act* (vertical aggregation).  
    - Regulation forbids aggregating harms *to one person* from *many sources* (horizontal aggregation).  
  - **Rationale**: Legal systems prioritize manageable causation chains. Tort targets identifiable defendants; regulation lacks a "defendant" for cumulative micro-harms.  

  **Incoherence Remainder**:  
  Criminal law’s rejection of dose-based exoneration (e.g., no "de minimis defense" for distributed poisoning) contradicts regulatory logic, revealing a **fault line**: Criminal law presupposes *intent* or *foreseeability* can moralize micro-harms, while regulation quantifies *outcomes*.  

  ---

  ### **IV. Philosophically Underdetermined Elements**  
  The practice is compatible with:  
  1. **Scalar Utilitarianism**: Thresholds approximate optimal stopping rules under uncertainty.  
  2. **Non-Comparative Harm Theories**: Sub-threshold exposures alter no individual’s welfare meaningfully (Parfit).  
  3. **Rights-Based Thresholds**: Harms below a level violate no rights (Nozick).  
  4. **Epistemic Conservatism**: We lack warrant to act on undetectable risks (Sunstein).  

  **Underdetermination Illustrated**:  
  - A regulator using thresholds could endorse *any* of these without changing practice.  

  ---

  ### **V. Regulatory Design Under Strict Aggregation**  
  If all harms aggregate (à la Derek Parfit’s "Harmless Torturers" or Temkin’s continuum), thresholds collapse. Alternatives:  

  **Surviving Thresholds (Limited Domains)**:  
  - **Natural Thresholds**: Where toxicology shows nonlinear effects (e.g., hormesis).  
  - **Feasibility Safeguards**: "Best available technology" standards (e.g., Clean Air Act §112) if aggregation is infeasible.  

  **Replacements Where Thresholds Fail**:  
  1. **Cumulative Impact Assessments**:  
     - Permit denials based on *existing background exposure* (e.g., California’s AB 617 hotspots).  
     - **Tool**: "Pollution budgets" for basins (e.g., EU’s NEC Directive summing NOₓ emissions).  
  2. **Tort-ification of Regulation**:  
     - Class-action-style permitting (e.g., communities sue to cap cumulative emissions).  
  3. **Risk Pooling**:  
     - Emissions trading with *declining aggregate caps* (e.g., climate markets, but with lower ceilings).  
  4. **Strict Liability Regimes**:  
     - Per-unit pollution taxes (Pigouvian) scaled to marginal harm × exposure count.  

  **Practical Consequences**:  
  - **Increased Litigation**: Every emitter potentially liable for background risk contributions.  
  - **Stratified Regulation**: Heavy industry zones face near-zero emission limits; rural areas relax.  
  - **Administrative Burden**: Real-time exposure tracking (e.g., IoT sensors + AI monitoring).  

  ---

  ### **VI. Conclusion: The Implicit Worldview**  
  Current practice presupposes **non-aggregation across sources as a moral axiom**, not merely a tool. It coheres superficially by isolating aggregation *contexts* (victims vs. sources) but fractures under criminal law’s moral intensification of distributed harm. Under strict aggregation, thresholds become dynamic ceilings sensitive to background conditions—shifting regulation from *permission* to *allocation*. The deepest takeaway: **Our systems treat harm as *countable* in tort but *discountable* in regulation, revealing a societal preference for manageable injustice over ungovernable fairness.**  

  Would you like to explore specific doctrinal examples (e.g., *Summers v. Tice* vs. Clean Water Act permitting) or ethical frameworks (e.g., Kamm’s non-consequentialism) next?
