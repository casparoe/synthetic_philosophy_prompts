  **Rigid Designators Ltd.™ - Limited Warranty & Terms of Service**  
  **Effective: Timelessly (Subject to Actual World Conditions)**  
  **Product:** Designative Tokens ("Designators")  

  **1. Warranty Scope & Rigidity Guarantee:**  
  Subject to the limitations herein, Rigid Designators Ltd.™ ("RDL") warrants that any Designator purchased shall designate the same concrete, particular object (the "Referent") in every possible world in which said Referent exists, for the duration of its existence within said worlds. This rigid designation is the sole performance metric covered.

  **2. Non-Existent World Exclusion:**  
  Warranty coverage is expressly void in possible worlds where the designated Referent does not exist. Failure of the Designator to designate the Referent in such worlds is not a defect, does not constitute a breach of warranty, and shall not entitle the Purchaser to refunds, replacements, or modal compensation. "Exists" shall be interpreted under actual world metaphysical parameters.

  **3. Discovery of Necessary Truths & Retroactive Application:**  
  The discovery by the Purchaser of an identity statement involving the Designator (e.g., "Designator A = Designator B") that constitutes a necessary a posteriori truth does not constitute a defect in either Designator. RDL is not liable for:  
      (a) The Purchaser's prior ignorance of said identity.  
      (b) The retroactive application of necessity to all possible worlds consequent upon such discovery.  
      (c) Any existential, conceptual, or emotional distress arising from the realization that the identity held necessarily in all possible worlds since the Designator's inception.

  **4. Contingent A Priori Fixing & Standard Liability:**  
  Where reference is fixed for a Designator via ostension to a physical standard (e.g., "Let 'Meter' designate the length of *that* bar in Paris at time T"), RDL warrants only the successful initial act of reference-fixing under the actual conditions at time T. RDL assumes no liability for:  
      (a) The stability, persistence, or intrinsic properties of the physical standard itself.  
      (b) Contingent properties later discovered about the standard (e.g., material imperfections, thermal expansion).  
      (c) The contingent a priori status of statements derived from the fixing act. The Purchaser bears all risk associated with the standard's contingent nature.

  **5. Causal-Historical Transmission Chains:**  
  Designators acquired indirectly through communicative chains ("Hearsay Acquisition") are warranted to designate the object at the originating source of the causal-historical chain, irrespective of:  
      (a) The accuracy or completeness of descriptive information associated with the Designator by any transmitting party, including the Purchaser.  
      (b) Widespread or universal misidentification within the chain.  
      *(Example Scenario: Purchaser acquires "Smith" designator via hearsay intending to designate a renowned inventor, based solely on descriptions of inventiveness. Warranty coverage ensures "Smith" designates the specific individual initiating the chain, even if that individual (e.g., a janitor) performed no inventive acts and all descriptive beliefs held by the Purchaser and transmitters are false).*  
      RDL is not liable for referential outcomes resulting from chain contamination or bifurcation post-origination.

  **6. Descriptivist Use Voidance:**  
  ANY USE OF A DESIGNATOR PURCHASED FROM RDL PRIMARILY OR EXCLUSIVELY BASED ON SATISFYING A DEFINITE DESCRIPTION ("Descriptivist Deployment") IMMEDIATELY AND IRREVOCABLY VOIDS THIS WARRANTY. Designators sold by RDL are intended solely for direct reference via the causal-historical mechanism. RDL makes no warranties, express or implied, regarding referential stability under Descriptivist Deployment. Such use is "As-Is," "Where-Is," and "However-It-Works-If-At-All."

  **7. Exclusions - What This Warranty Does NOT Cover:**  
  This warranty specifically excludes coverage for failures or issues arising from:  
      (a) **Fictional/Non-Existent Referents:** Designators intended for Pegasus, Vulcan, or similar non-actual entities.  
      (b) **Artifact Origin Misconceptions:** Incorrect Purchaser beliefs about the contingent origin of an artifact (e.g., believing Ship A was rebuilt using no original planks when, in fact, it was Ship B).  
      (c) **Metaphysically Indeterminate Objects:** Referents lacking clear identity conditions across possible worlds.  
      (d) **Natural Kind Terms:** While sold, referential stability for natural kinds (e.g., "Water," "Tiger") is contingent upon underlying microstructural properties holding constant across worlds; microstructural discovery is not covered.  
      (e) **Improper Modal Handling:** Designator failure due to Purchaser error in possible world navigation or identification.  
      (f) **Intentional Misuse:** Including, but not limited to, attempting to designate abstract objects, universals, or world-bound individuals across worlds where they don't exist.

  **8. Dispute Resolution & Governing World:**  
  Any dispute arising from this warranty or the performance of a Designator shall be settled by binding arbitration conducted exclusively within **The Actual World**. Possible worlds, however similar, are explicitly excluded as venues. The laws and metaphysical facts of the Actual World at the time of arbitration shall govern exclusively. Appeals based on counterfactual scenarios will be dismissed.

  **9. Limitation of Liability:**  
  RDL's maximum liability for any breach of this warranty shall be limited to the original purchase price of the defective Designator. UNDER NO CIRCUMSTANCES SHALL RDL BE LIABLE FOR CONSEQUENTIAL, CONTINGENT, COUNTERFACTUAL, OR TRANS-WORLD IDENTITY DAMAGES, LOST ESSENCES, OR EPISTEMIC HARM.

  **10. Warranty Duration:**  
  This Limited Warranty endures for the lifetime of the designated Referent within the Actual World, or until the Designator ceases to be used within a causal-historical chain originating from the initial baptism/ostension event, whichever occurs first. Transfer of the Designator to a new user within a valid causal chain does not reset the warranty period.

  **11. Entire Agreement:**  
  This document constitutes the sole and entire agreement between RDL and the Purchaser regarding the rigid designation guarantee, superseding all prior oral or written communications, descriptions, or metaphysical intuitions. Modification requires written agreement bearing RDL's official seal within the Actual World.  

  **Rigid Designators Ltd.™ - Because It's The Same Thing, Everywhere It Is.**  
  *(Customer Service operates in Actual World Business Hours. Please have your Designator Baptism Certificate ready.)*
