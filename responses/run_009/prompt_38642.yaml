prompt: |-
  I'm a high school junior working on an extended essay for a philosophy elective, and I've gotten myself stuck on the question of what an emotion actually is. The background reading I've done says that philosophers divide roughly into three camps: some think emotions are judgments (evaluations of how things are going for you), some think they are perceptions (of, say, value or danger), and some think they are just feelings (bodily states that happen to matter to us). Going in, my own tentative principle was that an emotion is a judgment that something good or bad is happening, felt in the body — anger is judging you've been wronged, felt as heat; fear is judging there's danger, felt in the stomach. But when I test that principle against my honest gut verdicts on particular cases, it keeps failing, and I can't tell whether the principle is wrong or my verdicts are.

  Here are the verdicts. On a flight last spring I was genuinely terrified during turbulence, even though I believe, and would argue in class, that commercial flying is safer than driving — that fear was an emotion, and a full-strength one. When a car backfires behind me and I jump, I don't think that's an emotion at all; it's a reflex, closer to blinking than to being afraid. I have been moved to tears by an instrumental piece of music with no lyrics and nothing I believe about the notes — no judgment I can identify — and I count that as an emotion. Watching a classmate freeze through a class presentation, I felt strong embarrassment on his behalf, even though I don't think he did anything embarrassing (I thought he was brave to push through), and I'd still call that an emotion. Feeling betrayed when a friend shared something I'd told her in confidence is my clearest case of an emotion, and there the judgment seems essential: the feeling is inseparable from thinking a wrong was done. Yet I also felt real anger at my coffee table after stubbing my toe on it, while believing perfectly well that tables can't be at fault, and I don't want to be told that wasn't anger. Finally, if I'm irritable all afternoon for no reason I can name, I'd call that a mood rather than an emotion, though I can't articulate the difference. The pair I keep grinding on: the turbulence fear and the backfire startle both involve no judgment of real danger, and both are bodily, sudden, and unwilled — yet one goes in the emotion column and one doesn't, and I don't know what does the sorting.

  What I'd like from you is a principle, stated precisely, that captures these verdicts or as many of them as can honestly be saved — and I'd like to know which of the three camps (judgment, perception, or feeling) it belongs to, or whether it cuts across them. Please tell me what the principle predicts for cases I haven't listed: is nostalgia an emotion? Is jealousy about a partner's affair that I know for a fact never happened? Is the chill at a horror movie I know is fake? And rather than adding one saving clause per case, tell me plainly which of my verdicts your principle cannot accommodate and which one you'd overturn first, so I can see the trade-off between a complex principle that saves everything and a simple one that doesn't. One more request: since my essay will be graded on accuracy, please keep a clear line between what is actually settled in this area and what is genuinely contested among people who study it. If the judgment theory I started with is a live option, say so; if it's widely thought to fail on cases like mine, I'd much rather learn that than be handed it back as if it were the consensus.
reasoning: |-
  Okay, the user is a high school junior working on a philosophy extended essay about the nature of emotions. They're struggling to reconcile different philosophical theories with their personal experiences. Let me unpack their query step by step.

  First, they outline the three main philosophical camps: judgment theories, perceptual theories, and feeling theories. Their initial hypothesis blended judgment and bodily feelings, but their real-life examples challenge this. They list several cases where their principle fails: turbulence fear without belief in danger, a startle response they don't consider emotion, emotional music without discernible judgment, empathetic embarrassment without personal evaluation, anger at an inanimate object, and irritability as mood versus emotion.

  The core tension seems to be between the necessity of cognitive evaluation and the reality of non-cognitive emotional experiences. Their examples highlight involuntary bodily responses (startle vs fear), cases where cognition and feeling diverge (anger at coffee table), and ambiguous states (mood vs emotion).

  I need to provide a principle that honors as many of their intuitions as possible while being philosophically sound. The perceptual theory seems most promising because it accommodates the immediacy of emotions without requiring full judgments. Jesse Prinz's embodied appraisal theory could bridge their initial bodily focus with perceptual elements.

  For their specific cases:
  - Turbulence fear: fits as perception of danger despite contrary beliefs
  - Startle reflex: excluded as pre-emotional neural response
  - Music emotion: captured as perception of expressive properties
  - Empathetic embarrassment: explained by perceptual contagion
  - Object anger: treated as misfired perception due to pain
  - Mood vs emotion: distinguished by object-directedness

  Important to note where trade-offs occur: their anger at the coffee table would be classified as "as if" emotion under this framework, which might feel unsatisfying but is philosophically coherent. Also, the mood-emotion distinction relies on intentionality, which some might debate.

  For unlisted cases:
  - Nostalgia: qualifies as object-directed perception
  - Baseless jealousy: counts if experienced as perception
  - Horror movie chill: included as "offline" perception

  Crucially, I must clarify this isn't settled science - all three theories remain live options. Judgment theorists have responses (e.g. unconscious evaluations), and feeling theorists would dispute the perceptual framing. The user needs to know this is genuinely contested terrain.

  Their deeper need seems to be: how to trust their philosophical instincts when examples contradict established theories. They're demonstrating excellent philosophical practice by testing theories against lived experience. The essay will be stronger if they show awareness of multiple perspectives while defending a coherent position.
answer: |-
  Your struggle is precisely what makes this question philosophically rich—you're encountering the tension between theory and phenomenology, and your detailed cases are excellent test probes. After analyzing your verdicts against major theories, here's a principle that preserves most of your intuitions while fitting within a specific philosophical camp:

  **Proposed Principle:**  
  *An emotion is a conscious, embodied perception of salient value or disvalue in the world or self, arising from automatic appraisal processes, and distinguished from reflexes by its intentional object and from moods by its specific focus and duration.*

  **Philosophical Camp:** This is a **Perceptual Theory** of emotion (e.g., inspired by Roberts, Deonna, Teroni, or Prinz's embodied appraisal variant), but incorporates elements of feeling theories. It *rejects* judgment theories as too cognitively demanding and feeling theories as too vague.

  ---

  ### How It Captures Your Verdicts:
  1. **Turbulence Fear:**  
     - **Captured.** You perceived *salient disvalue* (danger) despite your belief. Perception doesn't require belief (like seeing an optical illusion). Bodily feeling (terror) embodies the appraisal.  
     - *Contrast with backfire startle:* The startle is a reflex—no perception of *value*, just a neural response. It lacks an intentional object ("danger" isn't *perceived*; the body jerks pre-emotionally).

  2. **Music-Induced Tears:**  
     - **Captured.** You perceived *salient value* (beauty, sorrow, etc.) in the music's expressive properties. No *judgment* needed—value is perceived directly through bodily feeling.

  3. **Empathetic Embarrassment:**  
     - **Captured.** You perceived *salient disvalue* (potential social threat) *for your classmate*. The appraisal is automatic and embodied (cringing), even if you judge he was brave.

  4. **Betrayal Anger:**  
     - **Captured.** Clear perception of *moral disvalue* (wrongdoing), felt bodily. Aligns with your intuition that judgment is essential here—but note: on this model, the "judgment" *is* the perception.

  5. **Anger at Coffee Table:**  
     - **Captured (with nuance).** Pain triggers an automatic appraisal of *agent-caused harm* (misfiring due to evolved threat-detection). You perceive disvalue *as if* the table were blameworthy. This explains why it feels like anger despite lacking belief.

  6. **Irritability (Mood):**  
     - **Captured.** Moods lack a *specific intentional object*—your irritability isn't *about* anything salient. It's a diffuse background state, not a focused perception.

  ---

  ### Trade-offs: What’s Overturned or Struggles
  - **The Startle Reflex Verdict:** Your intuition that it's "not an emotion" is preserved. The principle excludes it cleanly.  
  - **Biggest Trade-off:** Your initial emphasis on *judgment* is downgraded. The betrayal case *feels* judgmental, but the principle treats it as perception. If you insist judgments *must* be conscious, this is a revision.  
  - **Edge Case Tension:** Coffee-table anger is included as "as if" perception. If you demand emotions *always* track genuine value, this fails—but your verdict ("I don’t want to be told that wasn’t anger") is prioritized.

  ---

  ### Predictions for New Cases:
  - **Nostalgia:** *Yes, emotion.* Perception of salient value in past experiences (e.g., warmth/loss), embodied as longing.  
  - **Jealousy About Non-Existent Affair:** *Yes, emotion.* You perceive *salient threat* to the relationship (based on suspicion/misinformation), felt as dread/anger. Reality is irrelevant to the appraisal.  
  - **Chill at Horror Movie:** *Yes, emotion.* Perception of *disvalue* (danger) *as portrayed*, embodied physiologically. Knowing it's fake doesn't disable automatic appraisal.

  ---

  ### What’s Settled vs. Contested in Philosophy
  **Settled (Broad Consensus):**  
  - Emotions involve bodily changes (neural, physiological).  
  - Emotions are intentional (they're *about* something).  
  - Basic emotions (fear, anger) are cross-culturally recognizable.  
  - Reflexes (startle) and moods are distinct categories.

  **Genuinely Contested:**  
  1. **Judgment Theories** (Solomon, Nussbaum):  
     - *Status:* Live, but declining.  
     - *Response to your cases:* They'd argue turbulence fear involves a fleeting "judgment of danger," music moves you via unconscious evaluations, and coffee-table anger is a "subrational" judgment. **Problem:** Strains "judgment" beyond recognition; struggles with non-cognitive emotions (e.g., music).  
     - *Expert view:* Widely seen as *too intellectualized*—infants/animal emotions become inexplicable.

  2. **Perceptual Theories** (Deonna, Teroni, Prinz):  
     - *Status:* Rising, especially in hybrid forms.  
     - *Strength:* Handles your cases well (as above). Allows emotions to be rational (perceptions can be accurate) or irrational (illusions).  
     - *Criticism:* Can "perception" explain complex emotions like guilt? Does it reduce to feeling theories?

  3. **Feeling Theories** (James, Damasio):  
     - *Status:* Influential in psychology, but philosophically weak alone.  
     - *Response:* Your music case is pure feeling; moods are feelings without focus.  
     - *Problem:* Fails your betrayal case—feelings without intentionality (e.g., nausea) aren't emotions. Can't distinguish startle from fear.

  **Hybrid Views:** Many argue emotions are *processes* combining appraisal, bodily feeling, and action tendencies (e.g., Scherer). This might resolve your turbulence/startle distinction: startle lacks cognitive appraisal.

  ---

  ### Recommended Path for Your Essay
  1. **Adopt the Perceptual Principle** but acknowledge its limitations (e.g., coffee-table anger as a "misfire").  
  2. **Concede one verdict:** Overturn the idea that betrayal *requires* judgment—frame it as a vivid case of value-perception.  
  3. **Discuss Contested Ground:** Explicitly contrast how judgment vs. perceptual theories handle your turbulence and music cases. Judgment theorists *do* have responses (e.g., "unconscious evaluations"), but note their ad-hoc feel.  
  4. **Use Moods as Contrast:** Leverage your irritability case to argue emotions require an intentional object.  

  **Why This Works:** It saves 6/7 verdicts (only downgrading judgment in betrayal), aligns with cutting-edge philosophy, and handles new cases intuitively. Crucially, it treats your turbulence fear and music tears as *paradigm emotions*—which they are—without over-intellectualizing them. 

  This area remains fiercely debated, but your cases powerfully challenge "pure" judgment or feeling theories. A perceptual account with embodied appraisals currently offers the most coherent framework for experiences like yours.
