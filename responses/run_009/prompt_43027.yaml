answer: |-
  ### Comparative Political Economy Seminar Activity: **"The Settlement Game"**
  This 90-minute activity forces students to confront the core inference problem in comparative political economy: Why do some nations become rich while others stay poor? Students experience firsthand why isolating causal factors (geography, institutions, culture) is nearly impossible with real-world historical data. The game uses minimal materials and emphasizes emergent dynamics over prescriptive answers.

  ---

  ### **Activity Structure**
  **Learning Goal:** Students grapple with endogeneity, omitted variable bias, and the impossibility of rerunning history.  
  **Core Twist:** "Economic historians" must explain divergent outcomes using only incomplete, noisy evidence—mirroring real-world constraints.  

  #### **Materials** (for 14 students)
  - **Dice:** 5 standard dice (one per settlement).  
  - **Cards:** A deck of playing cards for resource draws (optional; dice can substitute).  
  - **Paper & Pens:** For tracking production, investments, and scores.  
  - **Score Sheets:** Simple templates (see below).  
  - **Rule Sheets:** Secret instructions for each settlement.  
  - **"Archival Scraps":** 3–4 handwritten notes with ambiguous clues for historians.  

  ---

  ### **Setup (10 min)**  
  1. **Divide Students:** Split into 5 settlements (3 groups of 3, 2 groups of 2). Assign each a letter (A–E).  
  2. **Secretly Assign Variations:**  
     - **Settlement A (Geography):** Rich endowment (starts with 10 "resource units").  
     - **Settlement B (Institutions):** "Raider rule" (one member can confiscate up to 50% of group assets per round).  
     - **Settlement C (Culture):** No rules—norms emerge organically.  
     - **Settlement D (Geography + Institutions):** Poor endowment (starts with 2 units) + raider rule.  
     - **Settlement E (Control):** Medium endowment (5 units), no rules.  
  3. **Distribute Materials:**  
     - Each group gets a die, score sheet, and secret rule sheet.  
     - **Score Sheet Template:**  
       | Round | Production | Trade/Conflict | Investment | Total Assets |  
       (Groups track assets per round; "Total Assets" = cumulative score.)  

  ---

  ### **Game Rules (5 min explanation)**  
  - **Objective:** Maximize group assets over 5 rounds (10 min/round).  
  - **Phases per Round:**  
    1. **Produce:** Roll die. Output = roll + current assets.  
       - *Geography effect:* Rich groups (A) add +3 to rolls; poor (D) subtract -2.  
    2. **Trade/Confront (Optional):** Groups trade resources bilaterally (e.g., "We give 2 units for 1 future IOU").  
       - *Institutions effect:* Raiders (B, D) can steal up to 50% of another group’s assets (must declare target).  
    3. **Invest:** Convert assets to "infrastructure" (1 unit invested = +0.5 to future rolls).  
       - *Culture effect:* No-rule groups (C, E) can invent norms (e.g., "No stealing" or "Rotate raider role").  
  - **End Condition:** After Round 5, groups sum assets. Highest score "wins."  

  ---

  ### **The Historian Twist (10 min)**  
  - Mid-game (after Round 3), pull out 2 students as "economic historians." They:  
    1. **Receive Evidence:**  
       - Final scoreboard (group assets).  
       - 3 "archival scraps" (e.g., *"Settlement B ledger: ‘Raider took 6 units—protests ignored’"*; *"Settlement C diary: ‘We agreed: no theft’"*; *"Settlement A map: fertile land"*).  
    2. **Task:** Explain why outcomes diverged. They **cannot** observe the game or ask groups questions.  

  ---

  ### **Debrief (35 min)**  
  1. **Historians Present Theories:** What caused divergence? What evidence is missing?  
  2. **Reveal Game Variations:** Map mechanics to real-world concepts:  
     - Geography → Starting endowments (A, D).  
     - Institutions → Raiders (B, D) vs. no rules (C, E).  
     - Culture → Emergent norms in C and E (e.g., "We punished raiders").  
  3. **Core Inference Problem:**  
     - When historians say, "Just rerun with different rules," emphasize: **History offers no reruns.**  
     - Highlight endogeneity: "Raider" groups developed different norms (e.g., D became more punitive than B), mirroring how real institutions interact with culture.  
  4. **Limitations Discussion:**  
     - **What the game can’t replicate:**  
       - Real-world geography influences institutions (e.g., resource scarcity incentivizes conflict).  
       - Rules evolve endogenously (e.g., a "raider" group might democratize after revolts).  
       - *Bonus muddying:* In Round 4, secretly let poor-endowment groups (D) raid *more* (up to 70%) to simulate resource scarcity driving institutional change.  

  ---

  ### **Timeline**  
  - **0:00–0:10:** Setup and rules.  
  - **0:10–0:50:** Gameplay (5 rounds × 8 min each).  
  - **0:50–0:60:** Historian analysis (while others finish Round 5).  
  - **0:60–1:30:** Debrief (historians present → reveal mechanics → discussion).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Raider Mechanics Cause Anger:**  
     - **Why:** Students feel robbed (literally). Settlement D (poor + raider) may descend into infighting.  
     - **Solution:**  
       - Pre-game: Frame raiding as "historical legacies" (e.g., colonial extraction), not personal.  
       - During game: Remind raiders to rotate roles to share "blame."  
       - Debrief: Turn tension into insight ("How did distrust impact investment?").  

  2. **Historians Finish Early/Bored:**  
     - **Why:** Limited evidence leads to quick (overconfident) theories.  
     - **Solution:**  
       - Add a "speculation log": They must list 3 unanswered questions (e.g., "Did Group C have trade partners?").  
       - Give ambiguous "scraps" (e.g., *"Settlement E: ‘Meeting about rules... no consensus’"*) to fuel debate.  

  3. **Group Norms Fail to Emerge:**  
     - **Why:** Students default to individualism.  
     - **Solution:**  
       - Seed "culture" groups (C, E) with provocations: *"Hint: Will you elect a leader? Punish cheaters?"*  

  ---

  ### **Instructor Notes**  
  - **Emphasize:** This is about the *inference problem*, not "correct" theories.  
  - **Endogeneity Bonus:** In Round 3, let "poor" groups (D) raid more if they have fewer assets—linking geography to institutional change.  
  - **Key Debrief Insight:** Real historians face *layered endogeneity* (e.g., African geography → extractive institutions → persistent poverty). The game’s "clean" treatments are a luxury history denies us.  
  - **Final Point:** "You’ve experienced why we still debate Acemoglu vs. Diamond—no one has the lab notebook of history."  

  This activity transforms abstract methodological challenges into visceral, memorable lessons. By confronting the limits of historical evidence firsthand, students will leave skeptical of monocausal narratives—and hungry for deeper analysis.
