  We are designing a 90-minute seminar activity for 14 undergraduates on the question "Why are some nations rich?" The goal is to have students experience the inference problem faced by economic historians. 

  Key elements:
  - Split the class into 5 settlements (each with 2-3 students). Each settlement plays a multi-round game of production, trade, and investment.
  - We secretly vary three factors across settlements:
    1. Starting endowments (some get rich resources, others poor).
    2. Rules: 
        - One settlement has strong property rights (no theft).
        - Another has a "raider" role (rotates each round) that can confiscate.
        - Others: no imposed rules (let norms develop).
    3. For the remaining settlements, we do nothing (let their internal norms develop).
  - Minimal materials: dice, cards, paper, score sheet.
  - Twist: After the game, 2 students are pulled out as "economic historians" who see only the final scoreboard and a few noisy archival scraps. They must explain the divergence without having observed the game.

  Debrief:
  - Map game elements to real-world factors: 
     - Endowments → geography/natural resources
     - Rules → institutions
     - Evolved norms → culture
  - Historians explain what they would need to know to settle their explanation, and then we show that history doesn't allow reruns.

  Realistic timeline:
  1. Introduction (5 mins)
  2. Setup and rules explanation (10 mins)
  3. Game play (30 mins)
  4. Historian phase (10 mins)
  5. Debrief (35 mins)

  Potential problems and solutions:
  1. The raider mechanic might cause real anger: 
