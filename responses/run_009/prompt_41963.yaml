answer: |-
  You've articulated excellent considerations - here are the precise parameters to finalize your prompt design:

  **Target Parameters for Prompt & Response:**  
  1.  **Prompt Length:** ~150-250 words (sufficient for complex scenarios without being verbose)  
  2.  **Number of Prompts:** **3 distinct prompts** (creating a mini-dataset for consistency testing)  
  3.  **Model Answer Format/Length:** **Formal policy memo**, ~500-800 words. Expectation: Full structured argument with clear recommendations, not an outline or bullet points.  

  **Your Working Plan - Confirmed & Refined:**  
  ✅ **Domain:** Leveling-Down Objection / Prioritarianism (applied healthcare ethics)  
  ✅ **Prompt Type:** Policy Decision Memo  
  ✅ **Scenario:** Public drug plan coverage dilemma (expensive gene therapy for few severely ill children vs. population-wide program)  
  ✅ **Key Philosophical Elements:**  
      -   Force a stance on *weighted priority* vs. *lexical priority* for the worst off.  
      -   Explicitly address whether the leveling-down objection applies to the recommended prioritarian approach.  
  ✅ **Requirements:** Hypothetical figures/institutions, American English, formal tone.  

  **Execution Guidance:**  
  -   **Structure each prompt clearly:** Context → Conflict → Specific Task (write memo) → Explicit Requirements.  
  -   **Vary specifics slightly between the 3 prompts:** (e.g., disease names, exact cost/benefit figures, fictional agency names like "Federal Therapeutic Access Board" or "National Health Resource Authority") while maintaining the core ethical conflict.  
  -   **Explicitly state the memo requirements:** Include phrases like:  
      > "*Your memo must take a clear position on whether priority for the worst off should be weighted or absolute (lexical), and explicitly address whether the leveling-down objection undermines the ethical framework you apply. Conclude with a definitive funding recommendation.*"  
  -   **Specify American English & Formality:**  
      > "*Write this memo in polished, formal American English appropriate for senior policymakers.*"  

  **Example Prompt Snippet (Illustrating Alignment):**  
  > "...The National Health Resource Authority (NHRA) faces a critical allocation decision. Program Alpha offers a one-time gene therapy curing 'Type-X Degenerative Syndrome' in 8 critically ill children, costing $28 million total. Program Beta provides subsidized insulin pumps improving quality of life for 11,000 diabetic adults, costing $30 million. NHRA leadership demands a policy memo analyzing this through prioritarianism. Your memo must:  
  > 1.  Recommend funding either Alpha or Beta,  
  > 2.  Determine if priority for the severely ill children should be *weighted* or *lexical*,  
  > 3.  Analyze if the leveling-down objection challenges your chosen prioritarian approach,  
  > 4.  Justify your position using ethical reasoning.  
  > Write this memo in polished, formal American English for the NHRA Director..."  

  **Proceed to create your 3 prompts.** This structure ensures each prompt elicits a substantive, comparable memo (~500-800 words) focused precisely on the targeted philosophical and practical dilemmas.
