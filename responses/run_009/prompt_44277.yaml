answer: |-
  Here’s a decision tree designed to cut through the "copy vs. continuity" debate by forcing concrete answers to thought experiments. It uses 15 branch nodes (including repeats for key cases) and generates 8 distinct leaves, with empty cells flagged. Branch questions avoid jargon; leaves are labeled explicitly.

  ---

  ### **Mind Uploading Decision Tree**  
  *Answer each question honestly. Proceed to the next question based on your "yes" or "no". No peeking at the leaves!*

  1. **Gradual Replacement (Identity):**  
     Your brain is replaced neuron-by-neuron with identical artificial parts while you’re awake. After full replacement, is the resulting entity **you**?  
     → **Yes**: Go to Q2.  
     → **No**: Go to Q3.  

  2. **Gradual Replacement (Rationality):**  
     Facing terminal illness, you can pay for the gradual replacement procedure. After replacement, "you" wake up healthy. Is paying for this **rational**?  
     → **Yes**: Go to Q4.  
     → **No**: **Leaf: Inconsistent Answers** (Rare—usually indicates unresolved intuition clash).  

  3. **Destructive Scan (Identity):**  
     Your brain is scanned in a process that destroys it. An upload boots up immediately after. Is the upload **you**?  
     → **Yes**: Go to Q5.  
     → **No**: Go to Q6.  

  4. **Destructive Scan (Rationality):**  
     Facing death, you pay for the destructive scan + immediate upload. Is this **rational**?  
     → **Yes**: Go to Q7.  
     → **No**: Go to Q8.  

  5. **Non-Destructive Scan (Identity):**  
     A scan copies your brain without harming you. The upload runs while you’re still alive. Is the upload **you**?  
     → **Yes**: Go to Q9.  
     → **No**: **Leaf: Biological Continuity + Branching Rejection** (Accepts gradual/destructive as "you" but rejects copies when original exists).  

  6. **Animalist Check:**  
     In the destructive scan (Q3), you said the upload isn’t you. Is this **only** because the biological brain was destroyed?  
     → **Yes**: Go to Q10.  
     → **No**: **Leaf: Deflationary/No Fact** (Identity is ill-defined or context-dependent).  

  7. **Parallel Uploads (Identity):**  
     One scan creates **two identical uploads** running at the same time. Are **both** you?  
     → **Yes**: **Leaf: Patternism/Functionalist** (You are the pattern; substrate/branching irrelevant).  
     → **No**: Go to Q11.  

  8. **Delayed Upload (Rationality):**  
     Your brain is destructively scanned at death, but the upload isn’t activated until 40 years later. Is paying for this **rational**?  
     → **Yes**: Go to Q12.  
     → **No**: Go to Q13.  

  9. **Non-Destructive (Rationality):**  
     In the non-destructive scan (Q5), you said the upload is you. Would it be **rational** to pay for this procedure to "survive" a fatal risk?  
     → **Yes**: **Leaf: Psychological Continuity (No Branching)** (Identity requires unbroken continuity; rejects parallel uploads as "both you").  
     → **No**: **Leaf: Inconsistent** (Theoretical gap—rarely held).  

  10. **Delayed Upload (Identity):**  
      In the 40-year-delayed destructive scan, is the upload **you**?  
      → **Yes**: **Leaf: Inconsistent with Animalism** (Animalism requires biological persistence; delay shouldn’t matter if upload is "you").  
      → **No**: **Leaf: Biological Continuity (Animalist)** (You = your living biological organism; dies in all destructive/scan cases).  

  11. **Parallel Uploads (Rationality):**  
      Facing death, you pay for a scan creating **two parallel uploads**. Is this **rational**?  
      → **Yes**: **Leaf: Survivalist Pragmatism** (Identity ≠ survival; you have reason to care if experiences continue, even with branching).  
      → **No**: **Leaf: Unique Psychological Continuity** (Only one stream can be "you"; rejects branching).  

  12. **Delayed Upload (Identity):**  
      In the 40-year-delayed upload, is the upload **you**?  
      → **Yes**: **Leaf: Patternism/Functionalist** (Substrate and timing irrelevant; pattern is you).  
      → **No**: **Leaf: Survivalist Pragmatism** (Identity isn’t preserved, but what matters survives).  

  13. **Consistency Check:**  
      In gradual replacement (Q1), you said the result **is** you. In destructive scan (Q3), you said it **isn’t**. Is the difference that destruction creates a **gap** in consciousness?  
      → **Yes**: **Leaf: Continuity-Gap View** (Rejects any break in consciousness, even if brief).  
      → **No**: **Leaf: Biological Fuzziness** (Accepts gradual biological change but not artificial replacement; philosophically unstable).  

  ---

  ### **Leaf Explanations**  
  1. **Patternism/Functionalist**: The upload is you. What matters is the computational pattern (structure + function), not substrate, timing, or branching.  
  2. **Psychological Continuity (No Branching)**: The upload is you *only* if there’s no branching (e.g., accepts non-destructive scan but rejects parallel uploads).  
  3. **Biological Continuity (Animalist)**: You are your biological organism. Dies in all destructive/scan scenarios. Gradual replacement kills you.  
  4. **Survivalist Pragmatism**: The upload isn’t "you" (identity isn’t preserved), but uploading is rational because your values, memories, and goals survive.  
  5. **Unique Psychological Continuity**: Only one stream of consciousness can be "you"; rejects parallel uploads and possibly non-destructive scans if original exists.  
  6. **Deflationary/No Fact**: "Is it you?" is a meaningless question—there’s no objective answer.  
  7. **Continuity-Gap View**: Rejects any break in consciousness (e.g., destructive scans with delays), but accepts gradual replacement.  
  8. **Inconsistent/Biologial Fuzziness**: Incoherent or unstable positions (e.g., accepts gradual replacement but rejects all scans without principled distinction).  

  ---

  ### **Empty Cells & Controversies**  
  - **"Gradual yes, destructive scan no"** (Q1→Q3): Leads to Q6. If answered biologically (Q6→Yes), **Animalism** is unstable unless you reject *all* artificial minds as "not you"—but this conflicts with gradual replacement. Marked as **Biologically Fuzziness** (unattractive/rare).  
  - **"Non-destructive upload is me, but paying isn’t rational"** (Q9→No): Logically possible but incoherent (if it’s *you*, why avoid it?). Marked **Inconsistent**.  
  - **"Delayed upload rational but not identity"** (Q8→Yes→Q12→No): Core **Survivalist Pragmatism** (e.g., Parfit). Controversial—critics say if it’s not *you*, survival is illusory.  
  - **Branching forces choice**: Rejecting "both are me" in parallel uploads (Q7→No) *requires* adding a "no branching" clause to psychological views. Philosophers debate if this is ad-hoc.  

  ### **Why This Works**  
  - Tests **substrate dependence** (gradual replacement), **spatiotemporal continuity** (delayed upload), **branching** (parallel uploads), and **gaps** (destructive scan).  
  - Separates **identity** from **rational concern** in multiple scenarios.  
  - Exposes inconsistencies (e.g., accepting gradual replacement but rejecting destructive scans without a clear principle).  
  - Acknowledges contested edges (e.g., "Does continuity require no gaps?" isn’t settled).  

  Pin this with: **"Find your view FIRST—then debate. If your leaf says 'inconsistent,' rethink your principles!"** This won’t prevent fights, but it forces clarity.
