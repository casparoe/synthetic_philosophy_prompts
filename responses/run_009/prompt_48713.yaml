  Dennett’s concept compares the self to a story maintained by the brain. The metaphor of storytelling fits perfectly with her being a novelist. Translating this into accessible language: her life was a story she authored, and even in dementia, the narrative continued with contributions from loved ones.

  Structure the eulogy: Start with her essence as a storyteller. Acknowledge the dementia without focusing on loss. Highlight how everyone played a role in sustaining her story. Avoid calling out the cousins; instead, frame different ways of interacting as part of the collective effort. End with the idea that her story lives on through others.

  Potential pitfalls: Don’t imply the cousins were wrong. Use phrases like "different ways" to validate all approaches. Keep the tone warm and inclusive. Use metaphors like "holding up the sky" to convey shared responsibility without blame.

  Check for religious references: Ensure no mentions of an afterlife. Focus on her presence in memories and stories. The closing lines should reinforce that her narrative endures in the family’s recollections and actions.

