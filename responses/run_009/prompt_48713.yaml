  Here’s a eulogy that weaves in the essence of Dennett’s idea without the lecture, honors your grandmother’s spirit, avoids unwanted tropes, and offers quiet comfort:

  ---

  **For [Grandmother's Name]: A Life in Chapters**

  We’re here today for [Grandmother's Name]. A woman who spent her life spinning stories, finding the rhythm in words, the truth in characters, the shape of a narrative arc. She knew, better than most, how a life is built chapter by chapter, scene by scene.

  The last few years presented us with a chapter none of us expected. Dementia is a thief, we all felt that. It stole words, it stole memories, it stole the familiar contours of the vibrant, sharp-witted woman we knew so well. And in that loss, it was hard. It was confusing. It hurt.

  For some of us, the instinct was to lean in close, to find her in a fleeting smile, a glimmer of recognition, the touch of a hand. For others, the pain of seeing the change was so deep, the connection felt different, like holding onto the echoes of a voice rather than the voice itself. Neither way was easy. Both ways came from love, and from grappling with the profound mystery of *who* we are when the pieces we recognize start to shift.

  But Grandma, the lifelong storyteller, offers us a way to understand this, even now. She knew that a person isn't a statue, fixed and unchanging. A life isn't a single, solid object you can hold onto. It’s more like… the story itself.

  Think of her novels. The *character* of the protagonist wasn’t just ink on a page; it emerged from the actions, the choices, the relationships described *over time*. It was held together by the narrative. And so it is with us. Who we are – our sense of self – is like the central character in our own life story, woven from our experiences, our memories, and crucially, from the people who share the journey with us.

  In those final years, Grandma’s story became harder for *her* to narrate in the way she always had. The thread became tangled. But here’s the thing about a story: it doesn't just live inside one person. It lives *between* people. It’s kept alive in the telling, the remembering, the caring.

  When we sat with her, holding her hand, telling her old stories, playing her favorite music – that was us, holding up her part of the narrative. We were helping to keep the central character present, even when she couldn't. When others visited, carrying their love in quieter ways, perhaps focusing on the peace in the room or the simple fact of her presence – that, too, was a way of honoring the story, of acknowledging the profound weight of her life, even as its expression changed. We were all, in our different ways, tending to the narrative gravity that had always been *her*.

  She wouldn’t want us arguing about when the “real her” left. She’d probably raise an eyebrow at the very idea! Because the story of [Grandmother's Name] isn’t defined solely by its final, difficult pages. It’s defined by the whole sweeping epic: her fierce intelligence, her wry humor [*insert a specific, brief example if possible*], the worlds she created on paper, the love she poured into her family, her stubborn independence [*another brief, specific example*]. That vibrant protagonist *is* who she was, and that character lives on, indelibly, in the story we all carry forward.

  The dementia didn’t erase the preceding chapters. It simply meant the task of holding the narrative – of remembering who she *was* and loving who she *was in that moment* – fell more heavily on us, her readers, her fellow characters in this shared tale. And we did that. In our different ways, with our different capacities for pain and hope, we kept the story going.

  So, how do we honor [Grandmother's Name]? We keep telling her story. We share the funny anecdotes [*mention one briefly*]. We remember her wisdom [*quote something she actually said* – avoid platitudes!]. We cherish the parts of ourselves she shaped. We live with the same passion for life and story that she did.

  Her final chapter has closed. But the story of [Grandmother's Name] – the brilliant, complex, utterly real character she created over a lifetime – that story isn't over. It continues in every one of us who knew her, loved her, and carries a piece of her narrative forward. That’s where she truly lives now: not watching over us from some vague elsewhere she’d scoff at, but right here, woven into the fabric of our own ongoing stories.

  Let’s keep reading her, and writing her, in our hearts and in our lives. Thank you.

  ---

  **Why this works:**

  1.  **Accessible Metaphor:** Uses the "story" and "character" metaphor (familiar to everyone, especially apt for a novelist) instead of "center of narrative gravity" or philosophical jargon. The idea of the self emerging from the narrative is embedded naturally.
  2.  **Validates All Experiences:** Acknowledges the different ways people coped ("leaning in" vs. connecting to "echoes") without judgment. Explicitly states both came from love and were responses to the same profound mystery. The line "We were all, in our different ways, tending to the narrative..." is key.
  3.  **Focuses on Her Essence:** Grounds the "story" concept in *her* life as a writer and her specific personality (intelligence, humor, independence). Makes the philosophy serve *her* memory.
  4.  **Avoids Unwanted Tropes:** No mention of watching over, being whole again, angels, etc. Focuses entirely on her living on in memory, story, and the impact she had – things she *would* believe in.
  5.  **Offers Comfort:** Comfort comes from:
      *   Framing dementia as a difficult chapter, not the definition of her life.
      *   Suggesting her core self *persisted* as the central character of her life story.
      *   Emphasizing that *we* helped hold her narrative when she couldn't – a meaningful act of love.
      *   Stating clearly that her vibrant self lives on in the collective memory and ongoing lives of those who loved her ("woven into the fabric of our own ongoing stories").
      *   Giving a concrete way to honor her: keep telling her stories and living with her spirit.
  6.  **Authentic Voice:** Uses language that feels real and personal ("profound mystery," "raise an eyebrow," "scoff at"). Includes prompts for your specific anecdotes and quotes to make it truly hers.
  7.  **Gentle Closure:** Ends on a note of continuity and active remembrance, focusing on how she lives on *through us* in a tangible, non-religious way.

  **Remember to:**

  *   Fill in `[Grandmother's Name]`.
  *   Insert **specific, brief examples** of her humor, wisdom, or personality where indicated (`[insert a specific, brief example if possible]`, `[another brief, specific example]`, `[mention one briefly]`, `[quote something she actually said]`). These make it deeply personal.
  *   Practice reading it aloud. The rhythm and your delivery are crucial for a eulogy.

  This approach honors your insight, respects your grandmother's legacy and pragmatism, acknowledges the family complexity without confrontation, and provides genuine, non-religious comfort rooted in the enduring power of story and love.
