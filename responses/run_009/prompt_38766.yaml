prompt: |-
  I am a novelist by trade — literary fiction, mostly — and for the last three years I have also marked scripts for a second-year course on ethics and economics at the university in my city. The arrangement began when the course convener, an old friend, found himself short of graders one spring and remembered that I had written a novel about a utilitarian economist and had, in researching it, read rather more welfare economics than most examiners care to. I am now marking this year's finals, and I have reached a script that I cannot place with confidence: parts of it look quite strong to me, and parts give me an unease I would struggle to put my finger on. So I would like you to act as an experienced examiner in the history of welfare economics and moral philosophy. Read the question and the candidate's answer below, then give me (a) a mark out of 20 and (b) the specific comments that justify it: go through the answer point by point, naming what is correct and what is not, rather than giving me a general impression. Where the answer errs, say precisely what kind of error it is — a conflation, a misattribution, a step that does not follow — and what the correct claim would be; where a passage is defensible but contestable, say so and on what grounds. Please do not tell me it could reasonably be marked either way; I have doubts enough of my own, and what I need from you is a committed verdict, with reasons, on every point, and a definite mark at the end. I would ask you to think through each claim in the answer carefully before commenting on it, and to note as well whether the answer does equal justice to each part of the question as asked.

  The question, worth 20 marks, read as follows:

  "In what sense, if any, are interpersonal comparisons of utility possible, and in what sense are they needed? Explain the basis of Lionel Robbins's methodological objection to such comparisons in the economics of his day; describe how welfare economics responded to that objection (ordinal utility, the Pareto criteria, hypothetical-compensation tests, social choice theory, and the work of John Harsanyi); and assess one philosophical defence of the practice of comparing welfare across persons."

  The candidate wrote:

  "Robbins argued in the 1930s that interpersonal comparisons of utility are impossible. Utility is a subjective mental quantity, and there is no observation or experiment that could establish that the utility a given sum of money yields one person exceeds the utility it yields another. Since such comparisons cannot be made, they cannot form part of a scientific economics, and welfare economics had to be rebuilt without them. Economists responded in two ways. First, they abandoned cardinal utility altogether and moved to ordinal rankings: a person can say that she prefers A to B, but not by how much. Second, they sought criteria that never compare persons: the Pareto criterion approves a change if at least one person gains and nobody loses, and Kaldor and Hicks extended this by hypothetical compensation — a policy passes if the gainers could compensate the losers and still remain better off, and because the compensation is only hypothetical, everyone could in principle be made better off, so the criterion is consistent with Pareto. Arrow later showed that even given only this ordinal, non-comparable information, no collective decision rule can satisfy a handful of reasonable conditions without someone's preferences dictating the outcome; this informational poverty is part of why later economists, following Sen, returned to richer information, comparisons included. The decisive move, however, was Harsanyi's: in his 1955 paper he proved that if rational individuals maximize expected utility under an equal probability of finding oneself in any individual's position, then social choice must maximize average utility. This shows that interpersonal comparisons are not merely possible but required by rationality itself — a theorem that adds different people's utilities together could not even be stated unless the additions made sense. The comparisons Robbins called impossible are therefore the very foundation of welfare economics, as philosophers such as Harsanyi and Peter Singer have argued: we can make rough comparisons of how well off people are, and in ordinary life we do so all the time."
reasoning: |-
  Okay, the user is a novelist who also grades exams for a university ethics and economics course. They've come across a script they're unsure about and want me to act as an experienced examiner. The question is about interpersonal utility comparisons, Robbins' objection, and how welfare economics responded. The candidate's answer covers Robbins, ordinal utility, Pareto criteria, hypothetical compensation, Arrow's theorem, and Harsanyi's approach. 

  First, I need to assess how accurately the candidate represents Robbins' position. Robbins didn't just say comparisons are impossible; he made a methodological point about scientific verification. The candidate somewhat conflates impossibility with unscientific status here. That's an important nuance missed. 

  Looking at the response to Robbins: The candidate correctly identifies the shift to ordinal utility and Pareto criteria. But they oversimplify Kaldor-Hicks by implying it's consistent with Pareto principles without mentioning the Scitovsky paradox or reversal problems. That's a significant omission. 

  The Arrow section is stronger—they capture the essence of the impossibility theorem linking it to informational constraints. Good. 

  Now Harsanyi... This is where it gets messy. The candidate presents Harsanyi's veil-of-ignorance approach as proving interpersonal comparisons are "required by rationality." That's a major overstatement. Harsanyi's theorem assumes comparability via identical utility functions—it doesn't prove comparability possible. And saying philosophers like Singer use this misunderstands Singer's preference utilitarianism. 

  The concluding claim that Robbins' "impossible" comparisons are foundations of welfare economics ironically contradicts the earlier accurate description of ordinal developments. The tension here is glaring. 

  For philosophical defenses, the question explicitly asked to assess one. The candidate vaguely gestures at "rough comparisons" but doesn't engage with formal defenses (e.g., extended preferences, capabilities). That's a structural failure. 

  Hmm... the user wants a committed verdict. Despite some accurate technical summaries (ordinal, Pareto, Arrow), the errors in Robbins' nuance, Kaldor-Hicks, and especially Harsanyi's misinterpretation are serious. The missing philosophy section alone costs at least 4 marks. 

  Final mark? 11/20 feels right—barely passing. Credit for framework understanding, but too many substantive errors and omissions for higher. The user's unease probably stems from sensing these holes masked by confident phrasing.
answer: |-
  Here is a point-by-point assessment of the candidate's answer, following your requested format. The mark and comments are based on accuracy, completeness, structure, and engagement with the question's specific requirements.

  **Overall Verdict:**  
  **Mark: 11/20**  
  **Breakdown:**  
  - **Strengths:** Correctly summarizes core concepts (ordinal utility, Pareto, Arrow, Harsanyi's setup).  
  - **Weaknesses:** Misrepresents Robbins, oversimplifies Kaldor-Hicks, gravely misinterprets Harsanyi, omits philosophical defenses, and fails to structure the answer around the question’s three explicit parts.  

  ---

  ### Detailed Comments  
  *(Key: ✓ = Correct | ✗ = Error | ⚠ = Defensible but contestable/oversimplified)*  

  1. **Robbins’ Objection (Question Part 1):**  
     - *"Robbins argued... interpersonal comparisons of utility are impossible."*  
       **✓** Correct on impossibility claim.  
     - *"Utility is a subjective mental quantity... no observation or experiment..."*  
       **✓** Accurately captures Robbins’ positivist stance (based on verifiability).  
     - *"Since such comparisons cannot be made, they cannot form part of a scientific economics..."*  
       **✗ MISREPRESENTATION.** Robbins’ objection was *methodological*, not ontological. He argued comparisons lack *scientific validity* (non-verifiable/introspective), not that they are metaphysically impossible. **Correct claim:** Robbins held that interpersonal comparisons are *value judgments* incompatible with positive economics, not that they are universally impossible.  
     - **Missing Nuance:** Robbins conceded comparisons occur in policy but deemed them unscientific.  

  2. **Welfare Economics’ Response (Question Part 2):**  
     - *"Abandoned cardinal utility... moved to ordinal rankings."*  
       **✓** Correct and relevant.  
     - *"Pareto criterion approves a change if at least one gains and nobody loses."*  
       **✓** Accurate.  
     - *"Kaldor and Hicks extended this by hypothetical compensation... could compensate... still better off."*  
       **✓** Correct description of Kaldor-Hicks.  
     - *"...everyone could in principle be made better off, so consistent with Pareto."*  
       **✗ CONFLATION.** Kaldor-Hicks is *not* Pareto-consistent. It allows potential losers if compensation *could* occur (but doesn’t), violating Pareto’s "no actual losers" requirement. **Correct claim:** Kaldor-Hicks is a *weaker* criterion that *relaxes* Pareto, risking contradictions (Scitovsky paradox).  
     - *"Arrow later showed... no collective decision rule satisfies reasonable conditions..."*  
       **✓** Correct core of Arrow’s Impossibility Theorem.  
     - *"Informational poverty... Sen returned to richer information."*  
       **⚠** Oversimplified but defensible. Sen critiqued ordinality’s limitations, advocating for interpersonal comparability or capabilities, but didn’t "return" single-handedly.  
     - *"The decisive move was Harsanyi’s... proved that if rational individuals maximize expected utility under equal probability... social choice must maximize average utility."*  
       **✓** Correct setup of Harsanyi’s veil-of-ignorance reasoning.  
     - *"This shows interpersonal comparisons are not merely possible but required by rationality itself."*  
       **✗ CATEGORICAL ERROR.** Harsanyi *assumes* interpersonal comparability (via identical utility functions) to derive utilitarianism. His theorem does *not* "prove" comparability possible; it *presupposes* it. **Correct claim:** Harsanyi’s model *justifies* utilitarianism *if* we accept comparability and rationality axioms; it doesn’t resolve Robbins’ verification challenge.  
     - *"A theorem... couldn’t be stated unless additions made sense."*  
       **✗ NON SEQUITUR.** The theorem’s mathematical coherence doesn’t imply real-world validity. Robbins would reject adding utilities as meaningful without empirical verification.  

  3. **Philosophical Defence (Question Part 3):**  
     - *"Philosophers such as Harsanyi and Peter Singer have argued... rough comparisons... we do so all the time."*  
       **✗ OMISSION & MISATTRIBUTION.**  
       - **Omission:** Fails to *assess* any defense (e.g., Harsanyi’s "extended preferences," Sen’s capabilities, or empirical/phenomenological arguments). Merely gesturing at "rough comparisons" ignores the question.  
       - **Misattribution:** Singer advocates preference utilitarianism, not utility comparisons via Harsanyi’s theorem.  
       **Correct approach:** Should have critiqued one defense (e.g., Harsanyi’s: "It assumes rational agents accept utilitarianism behind a veil, but Robbins would reject its non-empirical axioms").  

  4. **Structure & Coverage:**  
     - **✗ IMBALANCE:** Spends 80% on welfare economics’ response, glossing over Robbins’ methodology and entirely neglecting the *assessment* of a philosophical defense.  
     - **✗ OMISSION:** No mention of *why* comparisons are "needed" (e.g., for distributive justice, policy evaluation beyond Pareto).  
     - **⚠ CONCLUSION:** The final sentence conflates Harsanyi (theorem) with everyday intuition without engaging philosophy.  

  ---

  ### Final Mark Justification:  
  - **Robbins Section:** 2/4 (Accurate on surface, misses methodological nuance).  
  - **Response Section:** 6/8 (Solid on ordinal/Pareto/Arrow; major error on Kaldor-Hicks consistency and Harsanyi’s implications).  
  - **Philosophy Section:** 0/5 (No defense identified or assessed).  
  - **Structure/Completeness:** 3/3 (Logically written but omits key question parts).  
  **Total: 11/20**  

  **Recommendation for Feedback:**  
  *"The answer demonstrates sound knowledge of welfare economics’ technical evolution but misrepresents Robbins’ methodological critique and the Kaldor-Hicks-Pareto relationship. Crucially, it fails to engage with philosophical defenses of interpersonal comparability, which was a core part of the question. Harsanyi’s theorem was inaccurately presented as resolving Robbins’ objection; it relies on assumptions Robbins explicitly rejected. To improve: focus on precise distinctions (e.g., methodological vs. ontological impossibility) and allocate equal attention to all sub-questions."*
