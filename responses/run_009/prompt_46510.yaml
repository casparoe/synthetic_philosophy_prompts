prompt: |-
  I am a graduate teaching assistant responsible for next week's fifty-minute section in a third-year abstract algebra course. The professor has just used Zorn's lemma to prove that every nonzero commutative ring with unity has a maximal ideal, and my job is to make sure the students can deploy the lemma themselves on the coming problem set (existence of Hamel bases, of maximal chains, of algebraic closures). Most of them have never taken a set theory course; their only model of constructing an object by exhaustion is finite-dimensional linear algebra, where you literally count your way up to a basis. I understand the lemma perfectly well myself — I do not need it explained to me — and I do not want the section to turn into a lecture on the axiom of choice, which I am not prepared to give.

  What I want is a plan for the section. First, the order of ideas and what depends on what: where the maximal-element-versus-greatest-element distinction has to be settled (I suspect before the statement even goes on the board, and I would like to know if that is right), when to introduce upper bounds and in what form — in particular, when to force them to notice that an upper bound need not belong to its chain and need not be unique — and whether to state the lemma in full generality before touching the ring example or extract its content from the example first. Second, the carrying example: the maximal ideal argument is prescribed by the course, so judge whether it should carry the whole section or whether something smaller and stranger should be run first, and if it does carry, identify exactly which features of the poset of proper ideals do the work — where the fact that the union of a chain of proper ideals is proper gets used, and what is merely decoration. Third, the misconceptions I should expect, in the order the students will actually generate them, with the point in the sequence at which each should be intercepted: I anticipate maximal element being heard as largest element, upper bound being heard as top of the chain, and someone proposing to skip the lemma entirely by taking the union of the whole poset at once — but also tell me about the subtler ones I won't see coming, such as students checking only increasing sequences of ideals rather than arbitrary chains, or assuming the maximal element produced is unique, or believing the lemma is a garden-variety theorem of ZF rather than something equivalent to the axiom of choice. On that last point I intend to state the equivalence without proof and say so plainly — tell me whether that is the right call for this audience and what sentence to use. Fourth, one question to end on that would distinguish a student who can apply the lemma from one who can only recite it; I am considering the poset of finite subsets of the natural numbers under inclusion and asking what Zorn's lemma yields there — tell me if that is diagnostic and what the correct answer reveals. Finally, tell me what to openly refuse to do at this level: what belongs to the proof of the lemma rather than its use, and how to say no to it without leaving the students feeling that the whole structure is a conjuring trick.
reasoning: |-
  Okay, the user is a graduate teaching assistant preparing for a section on Zorn's Lemma in an abstract algebra course. Their students are third-years who haven't taken set theory, and they're familiar with finite-dimensional linear algebra as their main model for constructing objects. The user wants a plan that avoids turning into a lecture on the axiom of choice while ensuring students can apply Zorn's lemma to problems like existence of Hamel bases, maximal chains, and algebraic closures.

  First, I need to address the structure of the section. The key is to build understanding step by step. Starting with the distinction between maximal and greatest elements is crucial because students will likely conflate them. Using a simple example like subsets of {1,2,3} can illustrate this difference early on. Then, introducing chains and upper bounds with tangible examples, like finite subsets of naturals or ideals in rings, helps solidify these concepts. It's important to emphasize that an upper bound isn't necessarily in the chain and isn't unique. 

  Next, presenting the lemma in full generality after working through a concrete example might make it less abstract. The ring example is prescribed, so using it to demonstrate the application makes sense. Highlighting where the union of a chain of proper ideals remains proper shows the critical point where the poset properties come into play. Students might miss why the union being proper matters, so stressing that step is key.

  Misconceptions are a big concern. The user mentioned maximal vs. greatest, upper bounds being tops of chains, and trying to union the whole poset. But subtler issues like only considering sequences instead of arbitrary chains, or assuming uniqueness, need attention. Addressing these as they naturally arise in examples can preempt confusion. Also, stating the equivalence to AC without proof is necessary but should be done clearly to avoid derailing the session.

  For the diagnostic question, finite subsets of naturals under inclusion is a good choice. The maximal elements are the cofinite sets, but no greatest element exists. This tests if students understand that maximal elements aren't necessarily unique or all-encompassing. 

  Lastly, setting boundaries is important. The proof of Zorn's Lemma is off-limits, and the user should refuse to delve into AC equivalence proofs. Emphasizing that the lemma is a tool for existence proofs, not a construction method, helps manage expectations. Making it clear that deeper set theory topics are beyond the course scope keeps the focus on application.
answer: |-
  Here’s a structured plan for your section, prioritizing application over set theory while preempting common pitfalls. Focus on **poset literacy**—students must internalize the language of chains, upper bounds, and maximality before invoking the lemma.

  ---

  ### **Section Plan: 50 Minutes**

  #### **1. Maximal vs. Greatest Element (5 min)**
     - **Why now?** *Essential pre-work.* Students will conflate these unless explicitly corrected.
     - **Demo:** Use the poset of *proper subsets of {1,2,3} under inclusion*. 
       - Maximal elements: {1,2}, {1,3}, {2,3} (cannot add another element).
       - No greatest element (no single set containing all others).
     - **Key phrase:** *"Maximal means nothing larger; greatest means larger than everything."*

  #### **2. Chains, Upper Bounds, and Critical Nuances (10 min)**
     - **Define chain:** Totally ordered subset (e.g., ∅ ⊆ {1} ⊆ {1,2} ⊆ ... in finite subsets of ℕ).
     - **Upper bound (UB):** 
       - Example: Chain *C = { {1}, {1,3} }* in subsets of {1,2,3}. 
         - UBs: {1,2,3}, {1,3} — *UB need not be in C, and need not be unique.*
       - **Non-example:** Chain of finite subsets of ℕ: *C = { ∅, {1}, {1,2}, {1,2,3}, ... }*. 
         - UB: ℕ itself (not in the chain). 
     - **Misconception interception:** *"An upper bound isn’t a ‘cap’ on the chain—it’s any element above every chain member, possibly outside it."*

  #### **3. State Zorn’s Lemma (General Form) (5 min)**
     - **Phrasing:** *"If every chain in a nonempty poset has an upper bound, then the poset has a maximal element."*
     - **Emphasize:** 
       - "Every chain" (not just countable sequences). 
       - "An upper bound" (not necessarily in the chain).
     - **Equivalence to AC:** *"This is equivalent to the Axiom of Choice; we’ll use it as a tool, not prove it."* → **Do not elaborate.** If pressed: *"That’s set theory—we’re here to use it in algebra."*

  #### **4. Carry Example: Maximal Ideals (15 min)**
     - **Poset:** Proper ideals of a nonzero commutative ring *R* with unity, ordered by inclusion.
     - **Critical checks:**
       1. *Nonempty?* (0) is proper. ✓
       2. *Chains?* Arbitrary chains *C* of proper ideals.
       3. *UB for C?* *I* = ∪_{J ∈ C} J.
          - **Why proper?** If *I* = *R*, then 1 ∈ *I*, so 1 ∈ some *J* ∈ *C* → *J* = *R* (contradiction). **This is the crux.** Stress: *"The union isn’t automatically proper—this fails if the ring lacks unity!"*
     - **Maximal element?** By Zorn, exists a maximal proper ideal ≠ *R*.  
     - **What’s decoration?** The ring operations are irrelevant here—only inclusion and union matter. *This is a poset argument.*

  #### **5. Anticipated Misconceptions & Interception Points**
     - **"Maximal = largest":** Intercept during Step 1 (subset demo).
     - **"UB = top of chain":** Crush in Step 2 with finite-subsets-of-ℕ example.
     - **"Union the whole poset":** Ask: *"Is the union of all proper ideals proper?"* (No; e.g., in ℤ, ∪ proper ideals = (0) ≠ ℤ). → Only chains have controlled unions.
     - **"Only increasing sequences":** Show a non-nested chain (e.g., ideals (2), (3), (4), ... in ℤ). Ask: *"Is this totally ordered? Can we take its union?"* 
     - **"Maximal element is unique":** Counterexample: Maximal ideals in ℤ×ℤ are (pℤ)×ℤ and ℤ×(qℤ) for primes p,q.
     - **Subtler:** *"Zorn’s lemma constructs the object."* → Clarify: *"It guarantees existence—it doesn’t tell you how to build it."* (vs. linear algebra basis construction).

  #### **6. Diagnostic Closing Question (5 min)**
     - **Poset:** *Finite subsets of ℕ under inclusion.*
     - **Question:** *"What does Zorn’s lemma give us here?"*
     - **Diagnostic:**
       - Correct: **No maximal element** (for any finite *S*, *S* ∪ {max(*S*)+1} is larger). Chains have UBs (e.g., ℕ), but the lemma’s hypothesis (*every chain has a UB*) holds while the conclusion fails. → Reveals understanding that the UB condition is necessary but not sufficient for maximal elements to exist. 
       - **Why it works:** Tests if they see the lemma’s structure (hypothesis satisfied? conclusion valid?) beyond rote application.

  #### **7. What to Refuse (and How)**
     - **Proof of Zorn’s Lemma/AC equivalence:** *"This is deep set theory—our focus is using it as a tool for algebra, much like you use derivatives without proving real numbers exist."*
     - **"Why not avoid Zorn by [naive alternative]?":** *"Many alternatives secretly use choice (e.g., picking elements recursively). Zorn streamlines this."*
     - **"What if the poset isn’t closed under unions?":** *"Then the lemma doesn’t apply—that’s why we check the UB exists (e.g., in ideals, we proved ∪chain is a proper ideal)."*
     - **Refusal phrasing:** *"That’s beyond our scope—I’d be doing you a disservice by oversimplifying profound foundations. For this course, we use Zorn’s lemma as a black box for existence proofs."*

  ---

  ### **Why This Sequence Works**
  - **Builds poset intuition** *before* algebra: Students confront maximality/chains in a familiar setting (sets).
  - **Isolates critical steps** in the ring example: The union being proper is the *only* nontrivial part; the rest is template.
  - **Preempts 90% of errors** by attacking misconceptions upfront with minimal examples.
  - **Diagnostic question** exposes surface-level vs. structural understanding: Correct answer requires seeing the lemma’s conditions holistically.

  **End goal:** Students leave knowing Zorn’s lemma is a *hypothesis-checking machine*: Find a poset where chains have UBs → get a maximal element. No set theory needed—just vigilance about chains and bounds.
