prompt: |-
  I am a PhD student in economic history, and I keep running into the same methodological fight in my field without anyone ever stating what would actually settle it. When someone asks why the Industrial Revolution happened in Britain and not in China — the Needham question, the Great Divergence debate — I can never tell whether the answers on offer are competing answers to one question or answers to several questions that have been sloppily merged. Before I read another monograph, I want the specification the monograph is supposed to meet.

  Act as a senior philosopher of history with a specialty in the methodology of causal explanation in historiography and comparative social science. Before you draft anything, spend a moment mapping the logical space: what an answer to a contrastive "why here and not there?" question must do, which of the things economic historians instinctively demand of such answers are genuine requirements and which are prejudices of particular schools (the demand for a single prime mover, the demand that the answer not be "contingent," the demand for China-side evidence and not just Europe-side), and whether the requirements can even be jointly satisfied. Then produce the deliverable.

  Write the desiderata an adequate answer to a "why Britain and not China?" style question must meet. For each requirement, give the case or consideration that motivates it — a concrete situation in which an answer violating that requirement would clearly be defective — and say whether you take it to be non-negotiable or a camp preference, and of which camp. At minimum, the list should confront the following, plus anything else you judge essential:

  1. Contrast-class discipline. An answer must pin down which comparison is being made: Britain vs. China as wholes, Britain vs. the Yangzi delta as regions of comparable development, Northwest Europe vs. East Asia as systems, or England vs. what China would have become absent some specific contingency. Different contrast classes license different answers; answers that silently swap between them are answering different questions while appearing to disagree.

  2. Symmetry. My advisor insists on what he calls a contrast-stability condition: whatever explanatory structure you propose for the Britain–China comparison should not fall apart when you run the same structure on adjacent contrasts — why Britain and not France or the Dutch Republic, why the Yangzi delta and not, say, the poorer interior provinces of China, why the nineteenth century and not the Song dynasty in the twelfth, when China was arguably the world's technological leader. If an explanation works only for the one contrast class that inspired it, is it an explanation or a retrofitted narrative? Decide whether this condition is a genuine desideratum, an unreasonable one, or something that must be weakened, and say why.

  3. Counterfactual load. The question is contrastive, so any answer commits to a counterfactual claim — that with factor X absent or present, the divergence goes away or does not happen. Specify how much counterfactual discipline the answer owes: must it identify a difference that would have flipped the outcome, or is it enough to identify differences that were load-bearing without claiming reversal? Note what this implies for answers built on deep, non-modifiable features like geography or long-run cultural inheritances, which appear to resist the counterfactual test entirely.

  4. The well-posedness challenge itself. Some historians hold that the question is malformed — that picking out Britain and China as the pair to explain smuggles in the answer, since salience was conferred by the outcome. Decide where this challenge belongs: is it a fatal objection that belongs on the desiderata list as a requirement no answer can meet, or a constraint that an adequate answer must discharge (say, by showing the comparison would have struck a well-informed observer in 1700 as natural rather than post hoc), or a confusion the list should dissolve?

  Finally, do three things with the completed list. First, identify any subset of the desiderata you suspect is jointly unsatisfiable, and explain the tension — this is the part I most want to see. Second, say which single requirement does the most work excluding the familiar styles of answer (the single-cause explanations, the "fortuitous conjuncture" explanations, the deep-roots explanations), without you needing to adjudicate between those styles. Third, note honestly whether any adequate answer would have to be a book rather than a sentence, and what that fact does to the idea that there is a "Needham question" waiting for an answer at all. Do not name specific authors, works, or bibliographic items; I am after the methodological structure, not a literature review. A table for the main list is fine, with the surrounding argument in prose.
reasoning: |-
  Okay, I need to address this PhD student's concerns about the methodological issues in the Great Divergence debate. The user is frustrated with the recurring arguments in economic history and wants clarity on what constitutes a valid answer to "why Britain and not China?"

  The core issues seem to be: determining the exact question being asked, evaluating the symmetry requirement across different comparisons, handling counterfactuals, and addressing whether the question itself is well-posed.

  First, I should map the logical space. Contrastive explanations require specifying what's being compared - is it regions, entire civilizations, or specific time periods? Without this discipline, scholars end up talking past each other. The symmetry demand from their advisor adds another layer - can the explanation work for adjacent contrasts like Britain vs France or different Chinese regions? 

  Counterfactuals are tricky too. Any contrastive claim implies "if X changed, the outcome might differ." But how specific must this counterfactual be? And what about explanations relying on fixed factors like geography that resist counterfactual testing? 

  Then there's the meta-question: is comparing Britain and China even valid since we only notice this pairing after knowing the outcome? This needs addressing - perhaps by showing the comparison would have made sense to observers in 1700.

  For the desiderata table, I consider including: contrast-class specification, causal asymmetry identification, contrast-stability, counterfactual explicitness, outcome salience justification, causal sufficiency, and causal mechanism plausibility. Each needs concrete motivation - what failure looks like - and classification as essential or camp-specific.

  The big tension I see is between contrast-stability and causal asymmetry. Stable explanations might miss what's unique to Britain-China, while overly specific ones can't generalize. Also, counterfactual demands conflict with deep-rooted explanations that can't be "modified."

  The contrast-class requirement does the most work in excluding bad answers. Vague comparisons allow scholars to shift between regional and civilizational levels, making debates incoherent.

  Finally, any adequate answer must be book-length. The "Needham question" is really a cluster of questions needing unpacking. This challenges the idea of a single answer waiting to be discovered.

  I'll structure this with a table of desiderata followed by analysis of tensions, key requirements, and implications for research practice. The goal is to provide methodological clarity rather than push any particular substantive answer.
answer: |-
  Below is a methodological specification for an adequate answer to the "Why Britain and not China?" question, structured as a set of desiderata. The table summarizes each requirement, its motivation, and its methodological status. Following the table, I address your three additional requests: (1) tensions between desiderata, (2) the most exclusionary requirement, and (3) implications for the question’s coherence.

  ### **Desiderata for an Adequate Answer**
  | Requirement                     | Motivation & Concrete Defect Example                                                                 | Status                                                                 |
  |---------------------------------|------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------|
  | **1. Contrast-Class Discipline** | *Defect*: An answer cites British coal deposits but fails to specify if comparing:<br>- Britain vs. China (national units), ignoring regional dynamism (e.g., Yangzi’s proto-industry vs. Britain’s Midlands).<br>- Northwest Europe vs. East Asia (systems), obscuring intra-system variation (e.g., Dutch stagnation vs. British takeoff).<br>*Motivation*: Prevents conflating distinct causal scales (regional, national, civilizational). | **Non-negotiable**. Violation guarantees category errors.             |
  | **2. Causal Asymmetry Identification** | *Defect*: An answer lists "property rights" without showing why they were:<br>- **Present/decisive** in Britain but **absent/ineffective** in China (e.g., customary rights in English enclosures vs. Qing codified land rights in Yangzi).<br>- *Not* merely a shared precondition (e.g., "markets existed in both").<br>*Motivation*: Contrastive explanations require *difference-makers*, not universal conditions. | **Non-negotiable**. Core logic of contrastive explanation.            |
  | **3. Contrast-Stability (Symmetry)** | *Defect*: An answer explains Britain vs. China via "naval power" but collapses when asked:<br>- Why Britain vs. Netherlands (superior Dutch navy pre-1750)?<br>- Why Yangzi vs. interior China (no naval relevance)?<br>*Motivation*: Tests if the explanation is *ad hoc* or generalizable to adjacent contrasts. | **Weakened desideratum**. Useful diagnostic but not fatal; unique conjunctions may exist. Camp preference (comparative institutionalists). |
  | **4. Counterfactual Explicitness** | *Defect*: An answer cites "scientific culture" without stating:<br>- How removing it from Britain *prevents* industrialization (minimal test).<br>- How adding it to China *enables* industrialization (strong test).<br>*Motivation*: Clarifies causal weight. Deep factors (e.g., geography) can still explain if tied to contingent mediators (e.g., coal *accessibility* via canals). | **Non-negotiable** (minimal test). Strong test is camp preference (cliometricians). |
  | **5. Outcome Salience Justification** | *Defect*: An answer assumes "industrialization" is the only outcome worth explaining, ignoring:<br>- Parallel innovations in Song China or Mughal India.<br>- Non-industrial pathways (e.g., Qing’s sustainable intensive agriculture).<br>*Motivation*: Avoids teleology. Forces engagement with *why this divergence* was pivotal. | **Non-negotiable**. Requires showing why the comparison was plausible *ex ante* (e.g., similar GDP/capita ca. 1750 per Pomeranz). |
  | **6. Causal Sufficiency** | *Defect*: An answer identifies "cheap coal" but cannot explain:<br>- Why Britain industrialized *when it did* (coal existed earlier).<br>- Why other coal-rich regions (e.g., Ruhr) lagged.<br>*Motivation*: Isolates necessary but insufficient factors. Demands combinatorial explanations. | **Non-negotiable**. Camp-neutral (all require sufficient causes).      |
  | **7. Causal Mechanism Plausibility** | *Defect*: An answer claims "Protestant work ethic" without specifying:<br>- How it translated into capital accumulation/innovation *differently* than Confucian merchant ethics.<br>- Micro-evidence (e.g., firm-level records, patents).<br>*Motivation*: Prevents "just-so stories." Requires evidence of operative pathways. | **Non-negotiable**. Shared by all rigorous historiography.            |

  ---

  ### **Tensions in the Desiderata**
  **The Core Tension: Contrast-Stability vs. Causal Asymmetry & Sufficiency**  
  Contrast-stability demands explanations that work across multiple comparisons (e.g., Britain/China, Britain/France). Yet **causal asymmetry** requires identifying *unique* differences in the Britain-China dyad, and **causal sufficiency** often entails complex conjunctions (e.g., "coal + colonies + institutions") that may not transfer neatly to other contrasts. This creates a dilemma:  
  - **Overgeneralization**: A stable explanation (e.g., "market integration") may ignore critical Britain-specific factors (e.g., naval supremacy enabling colonial resource extraction).  
  - **Overspecification**: A bespoke Britain-China explanation (e.g., "Atlantic trade + absent Qing embargoes") fails when applied to Britain vs. the Dutch (who had Atlantic trade but no industrialization).  

  *Resolution*: Contrast-stability must be **heuristic, not axiomatic**. It tests whether an explanation is *arbitrary*, but unique historical conjunctions need not generalize. The tension dissolves if contrast-stability is weakened (as above).  

  **Secondary Tension: Counterfactual Explicitness vs. Deep-Rooted Factors**  
  Deep factors (e.g., geography, cultural legacies) resist direct counterfactual modification (we cannot rerun history without the Himalayas). Yet **counterfactual explicitness** demands showing how changes alter outcomes.  
  *Resolution*: Deep factors are admissible if linked to *contingent mediators*. Example:  
  > *"China’s north-south rivers aided imperial cohesion, reducing pressure for maritime innovation (vs. Europe’s competitive states). Remove state competition in Europe → no naval arms race → no oceanic expansion."*  

  ---

  ### **Most Exclusionary Requirement**  
  **Contrast-Class Discipline** excludes more inadequate answers than any other. It invalidates:  
  - **Single-cause explanations**: Coal alone cannot explain national vs. regional divergences.  
  - **"Fortuitous conjuncture" explanations**: If contrasting systems (Europe/Asia), contingency must be systemic, not idiosyncratic.  
  - **Deep-roots explanations**: "Chinese culture was anti-commercial" fails if the contrast class is Yangzi vs. interior China (Yangzi had vibrant commerce).  

  By forcing specification of *what is being compared*, it reveals when answers are mis-scaled or conflate units of analysis.  

  ---

  ### **The Adequacy of Books and the Question’s Coherence**  
  **An adequate answer must be book-length**, and this exposes the methodological flaw in seeking *the* Needham question. The desiderata show that "why Britain and not China?" is not one question but a family of questions:  
  - **Regional**: Why Lancashire vs. Jiangnan?  
  - **Systemic**: Why European state system vs. East Asian tributary system?  
  - **Global**: Why did industrialization cluster in 19th-c. Northwest Europe?  

  A monograph can disentangle these layers, specify contrast classes, and test counterfactuals. A single-sentence answer ("Coal!") violates nearly all desiderata. Crucially, the question’s viability hinges on **outcome salience justification**. If the divergence was overdetermined (e.g., multiple paths to industrialization existed but were blocked by external shocks), the question may be retroactive mythmaking. A robust answer must first establish that the Britain-China divergence was a *contingent bifurcation*, not an inevitable outcome of prior differences.  

  Thus, the "Needham question" is valid **only if** framed as: *"Given comparable development levels in [specified region/system] ca. 1700, why did sustained industrial growth emerge in Britain by 1800 but not in [specified Chinese comparator]?"* Anything broader is a poorly posed puzzle; anything narrower is a footnote. Your task is not to answer *the* question but to **rigorously construct which question you are answering**.
