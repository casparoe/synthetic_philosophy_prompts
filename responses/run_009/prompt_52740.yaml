prompt: |-
  For my decision theory seminar we just finished the unit on updateless decision theory — the idea that an agent should choose a policy as if from behind a veil, before knowing which observation it's actually making at the node, rather than updating on everything it's learned and deciding myopically. For the final paper we're allowed to analyze a film through a theory from the course, and I want to do Arrival, beacuse Louise makes the choice to have her daughter while literally remembering the daughter's death, and goes ahead anyway. My professor floated in office hours that this looks "updateless" — she commits to the policy ex ante and doesn't let the future memories the heptapod language gives her function as an update that changes her act. But I'm honestly not sure the analogy holds, since UDT is usually about payoff correlations with copies of yourself or other agents, and Louise doesn't seem to be coordinating with anyone. Or is she? There's the phone call to General Shang, where she uses information from a future that her own choice helps bring about, which smells like the fixed-point / self-referential structure people talk about with Newcomb and blackmail cases.

  Take the role of a professional decision theorist who is also serious about film, and think carefully through the angles before answering (do the brainstorming internally, I only want the final product). Then give me the analysis as a numbered list of exactly five points, each one a sentence or two, with no intro or conclusion. The five points should between them cover: (1) whether Louise is genuinely acting updatelessly or just has unusual preferences and it's a coincidence of vocabulary, (2) whether the Shang call creates a real bootstrap problem or just narrative magic, (3) whether the film trades on a confusion between choosing a policy and simply having a fixed future, and anything else you think the paper needs. At the end of each point, say how confident you are in that reading, and flag clearly which single point you're least sure about — I don't want to build the paper on the shakiest analogy in the bunch without knowing which one it is.
