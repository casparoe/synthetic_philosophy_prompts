   Starting point: We accept that the original Gettier cases show that justified true belief (JTB) is not sufficient for knowledge. So we are looking for what else is needed.

   The positions we must cover as leaves:
     - No-false-lemmas
     - Causal externalism
     - Tracking externalism
     - Safety-based views
     - Reliabilism
     - Virtue epistemology
     - Knowledge-first views
     - Contextualism
     - Bullet-biting (denying that Gettier victims lack knowledge)

   We'll design the tree with concrete cases and forced choices. We'll use:
     - Fake-barn country: You see a real barn in an area full of barn facades and form the true belief "That's a barn."
     - Lottery: You have a ticket in a fair lottery with very low odds. You form the true belief "I lost" (but you haven't checked the results).
     - Broken dashboard: A monitoring dashboard is broken (e.g., it's stuck on a value) but by chance it displays the true value (e.g., the service is actually healthy and the stuck value is the same as the healthy one).
     - Original Gettier-style: E.g., you have evidence that suggests Smith owns a Ford (he drove one, etc.) and you form the belief "Smith owns a Ford or Jones is in Barcelona". It turns out Smith doesn't own a Ford (so your evidence was wrong) but Jones is in Barcelona (so the belief is true). Your evidence rested on a false assumption (Smith owns a Ford) that didn't spoil the conclusion.

   We'll also add one from software engineering:
     - Health check: A health check endpoint for a service is misconfigured (e.g., it's hitting the wrong port) but by luck the service is actually healthy at the moment (so the health check returns true and the service is indeed healthy). You form the belief "The service is healthy" based on the health check.

   We note that some positions might collapse in our cases, so we'll be explicit when we can't distinguish.

   Steps:

   1. We start by introducing the cases and asking questions that force a choice about whether the subject in the case has knowledge.

   2. We build the tree step by step, using the cases to branch.

