answer: |-
  ### **Nozick's Entitlement Theory: In-Class Game Design**  
  **Objective:** Stage the Wilt Chamberlain argument through experiential learning. Students impose a distributional pattern, witness its breakdown via voluntary transfers, and experience the "treadmill" of maintaining patterns through a Pattern Commission.  

  ---

  ### **Game Rules**  
  **Participants:** 18 students.  
  **Duration:** 75 minutes (split into two rounds).  
  **Tokens:** Poker chips or paper slips (no real money).  
  - **Starting tokens:** 10 per student.  
  - **Payoff:** Tokens convert to trivial rewards (e.g., 1 token = 1 bonus point on a low-stakes quiz, capped at 5 points total per student to avoid excessive incentives).  

  #### **Phase 0: Setup**  
  1. **Initial Pattern Choice:**  
     - Students vote on a distributional pattern (equality, merit, need). Guide them toward equality (e.g., "We start equal unless you object").  
     - Implement pattern: Distribute 10 tokens to each student.  
     - **Record distribution** on the board.  

  2. **Form Pattern Commission (PC):**  
     - Elect 3 students to the PC via majority vote.  
     - **PC Powers:** Restore the initial pattern when invoked. Each restoration costs the class 20 tokens (see "Cost Mechanism" below).  

  3. **Cost Mechanism:**  
     - **Class Fund:** At the start, each student contributes 1 token to a "Class Fund" (total: 18 tokens).  
     - **Restoration Cost:** Each PC intervention deducts 10 tokens from the Class Fund. If the fund is empty, restorations stop.  

  ---

  ### **Round 1: Skilled Star**  
  **Goal:** Break the pattern via voluntary transfers to a "deserving" star.  

  1. **Select the Skilled Star:**  
     - Test a trivial skill openly (e.g., "First to solve 3 anagrams wins"). Winner becomes the "star" (give a visible badge).  

  2. **Trading Phase (5 minutes):**  
     - Students freely trade tokens for any voluntary reason (e.g., "I’ll give 1 token for your pen," "Pay 2 tokens to hear the star sing").  
     - **Key:** Encourage trades with the star (e.g., "Get the star’s autograph for 1 token!").  
     - **Record distribution** afterward.  

  3. **Pattern Breakdown & Restoration:**  
     - Display the new distribution. Point out inequality.  
     - PC is invoked: They restore equality (reset everyone to 10 tokens) and deduct 10 tokens from the Class Fund.  
     - **Repeat trading (3 minutes) → Breakdown → Restoration** until the Class Fund is empty (max 1 restoration).  

  ---

  ### **Round 2: Lucky Star**  
  **Goal:** Break the pattern with a "non-deserving" star to isolate discomfort.  

  1. **Reset:**  
     - Redistribute 10 tokens per student. Refill Class Fund (each contributes 1 token).  

  2. **Select the Lucky Star:**  
     - Choose via coin flips (e.g., "Heads stays in, tails out" until one remains).  

  3. **Repeat:**  
     - Trading (5 min) → Breakdown → PC restoration (cost: 10 tokens) → Trading (3 min).  

  ---

  ### **Predictable Problems & Mitigation**  
  1. **Refusals to Trade:**  
     - **Why:** Students may resist "harming" equality.  
     - **Fix:** Incentivize trades (e.g., "Star offers a funny dance for 2 tokens!"). Participate as a trader to model behavior.  

  2. **Sandbagging:**  
     - **Why:** Students hide tokens to avoid redistribution.  
     - **Fix:** Publicly record distributions after each phase.  

  3. **Awkwardness Around the Star:**  
     - **Why:** Guilt about privileging one student.  
     - **Fix:** Frame the star role as "silly" (e.g., "Star wears a silly hat"). Normalize transfers early ("Trade 1 token for a high-five!").  

  4. **PC Reluctance:**  
     - **Why:** Unpopularity of taking tokens.  
     - **Fix:** Clarify PC’s duty ("Your job is to enforce our chosen pattern").  

  ---

  ### **Revealing Nozick’s Argument**  
  - **When:** After Round 2, before debrief.  
  - **Script:**  
    > "What you experienced mirrors Robert Nozick’s *Wilt Chamberlain argument*. We chose a pattern (equality), but your free choices broke it—exactly how Chamberlain’s fans paid him, disrupting equality. Nozick argues that **liberty upsets patterns**, and enforcing them requires constant, costly interference."  

  ---

  ### **Debrief: Mapping to Nozick’s Theory**  
  1. **Justice in Acquisition (Game Limitation):**  
     - **Point:** The game *stipulated* the initial distribution (10 tokens). Nozick demands historical justification for initial holdings (e.g., "Did anyone steal or cheat?").  
     - **Supply This Yourself:** Explain Locke’s proviso ("Acquisition just if enough left for others") and note the game bypassed this.  

  2. **Justice in Transfer:**  
     - **Phase:** Trading rounds.  
     - **Key Question:** "Were your trades voluntary? If yes, Nozick says the result is just—*even if inequality results*."  

  3. **Justice in Rectification:**  
     - **Phase:** PC interventions.  
     - **Nozick’s View:** Rectification fixes past injustices (e.g., theft). Here, the PC "rectified" voluntary acts—which Nozick rejects. Ask: "Did the PC *correct injustice* or *impose equality*?"  

  4. **Liberty vs. Patterns:**  
     - **Treadmill Effect:** Students experienced: Trade → Break pattern → Pay to restore → Repeat.  
     - **Nozick’s Punchline:** "Patterns require continuous violations of liberty. Why value patterns over freedom?"  

  5. **Skilled vs. Lucky Star:**  
     - **Discomfort Check:** "Did inequality feel worse when the star was lucky? Why?"  
     - **Nozick’s Insight:** If discomfort persists even when inequality is "deserved" (skilled star), it reveals a deeper commitment to patterns over liberty.  

  ---

  ### **What the Game Cannot Simulate (Supply Yourself)**  
  - **Theory of Just Acquisition:**  
    The game assumes initial equality is fair. Nozick rejects this—he requires a historical account of property (e.g., "Did anyone violate the Lockean proviso?"). Discuss: "What if the initial 10 tokens were stolen? What if earned by labor?"  

  ### **Token Economy Rationale**  
  - **Why Tokens?** Abstract value avoids real-world stakes but incentivizes participation.  
  - **Costs Matter:** Class Fund depletion shows the "burden" of enforcing patterns.  

  ### **Timing**  
  - Phase 0: 10 min  
  - Round 1: 25 min  
  - Round 2: 25 min  
  - Debrief: 15 min  

  Run this, and your students won’t just *hear* Nozick—they’ll *live* the tension between liberty and equality.
