prompt: |-
  I'm a final-year undergraduate taking a seminar on contemporary normative ethics, and we have just finished a unit on Scanlon. For my next paper I have to set out my considered position on contractualism and the aggregation problem, and I would like a consistency check before I commit anything to print. Here is roughly where I have landed.

  (1) I accept Scanlon's contractualist test for wrongness: an act is wrong if it would be disallowed by any principle for the general regulation of behaviour that no one could reasonably reject.

  (2) I accept the individualist restriction, which is what draws me to the view in the first place: when we ask whether a principle could be reasonably rejected, we consider each person's complaint on its own, and a complaint never gains strength from the fact that others have similar complaints. Reasons for rejection are never summed across persons.

  (3) In a plain rescue case — five people will die unless rescued at one site, one person will die at another, the prospective losses are the same for everyone, and I can reach either site but not both — I hold that I must save the five. The numbers count, and Taurek was wrong to flip his coin.

  (4) I hold the same when the stakes are probabilistic: if I must choose between saving one person from certain death and saving a hundred people each from a one per cent risk of death (two expected deaths, but nobody on the hundred-person side faces anything approaching certain loss), I must save the hundred. This seems obvious to me.

  (5) I think Scanlon is right about his World Cup case in What We Owe to Each Other: Jones is caught in the transmitter room of a television station with electrical equipment crushing his arm, receiving extremely painful shocks, and the only way to rescue him at once is to turn off the transmitter for fifteen minutes, interrupting a match that millions are watching and that will not be over for an hour. I hold that we must rescue him immediately, and that the viewers' disappointment, however widely it is spread, is not the kind of thing that could reasonably be invoked to make him wait.

  (6) I hold the mirror-image verdict as well: it would be wrong to impose a day of mild headache on each of a million people in order to save one stranger from death — say, the only process that can manufacture a life-saving drug in time predictably leaves everyone in the region with a mild headache for a day. Small burdens borne by many must not be added up against a grave burden borne by one.

  Before the seminar tears this apart, I would like to know whether it hangs together. Which pairs of these commitments are genuinely in tension, and which only look to be? Please rank any real tensions by severity rather than presenting them all as equally serious, and for each one tell me exactly what would have to give and what the revision would cost me elsewhere. If one of my verdicts can in fact be delivered by Scanlon's own machinery without any summing across persons — that is, if an apparent tension dissolves on inspection — please say so and show me the mechanism rather than assuming it. I honestly do not know where the problem is, if there is one.
reasoning: |-
  Okay, the user is a final-year undergrad in a seminar on contemporary normative ethics, specifically focusing on Scanlon's contractualism. They've outlined their position regarding the aggregation problem and want a consistency check before writing their paper. Let me break down their commitments:

  First, they accept Scanlon's contractualist test for wrongness and the individualist restriction. That means they believe reasons for rejecting principles aren't summed across persons. Each complaint is considered individually. That's the core of Scanlon's view.

  Then, they have specific verdicts: saving five over one, saving a hundred with probabilistic risks over one certain death, and prioritizing Jones in the World Cup case. But they also say that imposing a million mild headaches to save one life is wrong. That last point seems to contradict the others because it involves many small burdens versus one large one. 

  Hmm, the tension is between (4) and (6). In (4), they allow aggregating many small risks (100 people with 1% risk each) to outweigh one certain death. But in (6), they say a million mild headaches can't outweigh one death. The challenge here is that both cases involve distributed burdens versus a concentrated harm. Why is the risk aggregation acceptable but the headache aggregation not? 

  Scanlon's individualist restriction says you can't sum complaints. So in the probabilistic case, each of the hundred has a 1% risk, which individually is a weak complaint compared to the one person facing certain death. But the user thinks saving the hundred is required. How to justify that without summing? Scanlon’s response is that the principle "save the greater number" itself can't be reasonably rejected. Each person in the hundred can argue that their individual risk, while small, is still a significant loss if it materializes. But the one facing death has a stronger complaint. Yet, the user sides with saving the hundred. 

  Wait, Scanlon actually uses the idea of ex ante expectations. Each of the hundred might reasonably reject a principle that ignores their risk entirely. But the user needs to reconcile this with (6). In the headache case, each of the million has a minimal burden. Their complaint against bearing the headache is weak individually. The one dying has an overwhelming complaint. So no one in the million can reasonably reject a principle that prioritizes saving a life over preventing headaches. 

  The key difference might be in the nature of the burden. Risk of death vs. certain death is different in kind from a headache. Even a small risk of death is significant enough that each person in the group has a non-negligible stake. Whereas a headache is a trivial burden. So perhaps the user can argue that the complaint strength isn't additive, but the type of harm matters. 

  But how does this work for the World Cup case? The viewers' disappointment is trivial per person, so it doesn't outweigh Jones's severe pain. That aligns with (6). Saving five over one is okay because each of the five has the same complaint as the one, so the principle to save the greater number isn't rejectable by the one. 

  The user might need to refine their justification for (4). Instead of aggregating risks, they could argue that a principle allowing ignoring small risks would be rejectable. Each person in the hundred has a reason to reject a principle that never saves groups with distributed risks. The one facing death can't reasonably reject a principle that sometimes saves groups because they too might be in such a group. 

  The main tension is between (4) and (6). The user must explain why distributed risks of death can be aggregated (in a way) but distributed headaches cannot. They need a principled distinction between significant but small-stakes harms (like risk of death) and trivial harms (headaches). Without that, they might be accused of inconsistent application of the individualist restriction. 

  Another point: in the rescue case, the five each have equal complaints. The one can't reasonably reject a principle that saves the greater number since, in similar situations, they'd benefit. But in the headache case, no one would accept a principle that imposes headaches to save a life because the burden is certain and immediate, while the benefit is to someone else. 

  The user should clarify their stance on the threshold of harm. What makes a burden significant enough to be considered in such trade-offs? Scanlon might say that only comparable harms can be weighed this way. Death risks are comparable to certain death, but headaches are not. 

  So the user's position can be consistent if they articulate a threshold: burdens must meet a minimum level of seriousness to be relevant in rejection. Headaches fall below, risks of death (even small) do not. But that requires defending that threshold within contractualism, which is tricky. 

  They might also need to address how the number of people plays a role without summing. Scanlon's 'tie-breaking' idea: when individual complaints are comparable, numbers can decide. But in the headache case, the complaints aren't comparable. 

  In conclusion, the user's main tension is between probabilistic risks and trivial burdens. They need to provide a clear criterion for when a burden is significant enough to be weighed against a life. Without that, their position might seem inconsistent. But with careful articulation, they can maintain their commitments by emphasizing the qualitative difference in harms rather than quantitative aggregation.
answer: |-
  Your position is philosophically sophisticated and largely coherent within Scanlon's framework, but there's **one critical tension** between your commitments (4) and (6) that requires reconciliation. Below is a ranked analysis of tensions, with solutions and costs:

  ### 🚨 **Ranked Tensions (Highest to Lowest Severity):**
  1.  **🆘 (4) vs. (6): Probabilistic Risk Aggregation vs. Headache Case Non-Aggregation**  
      *   **The Conflict:**  
          In (4), you prioritize saving 100 people facing a 1% risk of death *over* saving 1 person facing certain death. This implies the combined claims of individuals facing *small individual risks* can outweigh the claim of an individual facing a *massive, certain harm*.  
          In (6), you refuse to aggregate a million mild headaches to outweigh one person's certain death. This implies the combined claims of individuals facing *small, certain harms* *cannot* outweigh the claim of an individual facing a *massive, certain harm*.  
          **The Tension:** Why can small *probabilistic* harms be aggregated (in effect) against a large certain harm, while small *certain* harms cannot? Both scenarios involve distributed burdens vs. a concentrated catastrophe under the Individualist Restriction (IR).
      *   **What Gives?** You need a principled distinction between the types of burdens in (4) and (6) that justifies treating the probabilistic risk as generating a stronger *individual* complaint than the mild headache. Simply appealing to "obviousness" isn't sufficient under the IR.
      *   **Scanlonian Solution (Preserving IR):**  
          *   **For (4):** Argue that each person facing a 1% risk of death has a *significant individual complaint* against a principle that *systematically ignores small risks*. Their complaint isn't "I have a 1% complaint," but rather: "A principle allowing agents to *always* prioritize a single certain death over any number of distributed small risks would leave me (and everyone) vulnerable to being left to die when facing a small risk, simply because others aren't *currently* facing a larger *certain* harm. This vulnerability is unreasonable." The certain-death victim's complaint ("Save me!") is very strong, but the *principle* "ignore small risks" can be reasonably rejected by each small-risk individual *on grounds of the unacceptable vulnerability it creates for them over a lifetime*. This leverages Scanlon's idea of principles governing *practices* and *ex-ante* expectations.
          *   **For (6):** Argue that the complaint against enduring a mild headache (even if certain) is *so trivial* that no single individual can reasonably reject a principle requiring them to bear it to save a life. While the headache is certain, its *magnitude* is too low to constitute a significant burden for any one person. A principle *permitting* letting someone die to avoid imposing such a minor burden *on anyone* would be unreasonable. The death victim has an overwhelming complaint against such a principle.
          *   **The Distinction:** The key is the *nature of the burden* and the *reason for rejection*. The probabilistic risk involves a complaint about *vulnerability to catastrophic loss* (death) under a bad principle, even if the immediate probability is low. The headache involves only a complaint about a minor, transient discomfort. The IR is preserved because the strength of the complaint *for each individual* differs qualitatively, not quantitatively summed. The "aggregation" in (4) is an *epiphenomenon* of many individuals having similarly *strong* (though probabilistic) complaints about vulnerability, not a summation of *weak* complaints.
      *   **Cost of Solution:** This requires accepting that complaints based on *risk/vulnerability* to serious harm can be significantly stronger than complaints based on *certain minor* harms, even if the *expected disutility* of the risk is similar to the certain minor harm (e.g., 1% chance of death ≈ 1 day of severe illness in some utility models, but not in complaint-strength). You must defend this qualitative difference in burden types within contractualism. Some critics will argue this smuggles in aggregation through the back door by inflating the complaint strength of small-stakes risks.

  2.  **⚖️ (3) vs. (2): Saving Five vs. Individualist Restriction**  
      *   **Apparent Conflict:** How can numbers count in the plain rescue case (save 5 over 1) if complaints aren't summed? The IR seems to imply Taurek's coin flip.
      *   **Scanlonian Solution (No Revision Needed):**  
          Scanlon himself resolves this. The principle "Save the greater number" (SGN) is not reasonably rejectable. The single person cannot reasonably reject SGN because:  
          (a) Their complaint ("I wasn't saved") is *identical* in strength to the complaint each of the five would have had ("I wasn't saved") if the one was saved instead.  
          (b) There is no relevant personal characteristic distinguishing them.  
          (c) Rejecting SGN would mean endorsing a principle ("Save Fewer" or "Flip a Coin") that *they themselves* would find unreasonable if they were in the larger group. The IR is satisfied – we compare the *single* complaint of the one person (losing their life) against the *single* complaint of *one representative individual* in the group of five (also losing their life). Since the burdens are equal, the only way to choose fairly is to save where more burdens are lifted, i.e., save the five. The numbers count via a form of *pairwise comparison tie-breaking*, not summation.
      *   **Resolution:** This apparent tension dissolves completely under Scanlon's own mechanism. Commitment (3) is fully compatible with (1) & (2).

  3.  **📺 (5) World Cup Case: Coherence**  
      *   **Consistency Check:** Your verdict aligns perfectly with Scanlon and your other commitments. The IR shines here: Jones's complaint (excruciating pain, potential permanent injury) is immensely strong for a single individual. Each viewer's complaint (mild disappointment/frustration) is exceedingly weak. No single viewer has a complaint remotely strong enough to outweigh Jones's complaint. The fact that there are millions of viewers doesn't matter under the IR – summing isn't allowed. Jones can reasonably reject any principle forcing him to endure that suffering for the sake of avoiding minor, fleeting disappointments for others. This is the paradigm case illustrating the power of the IR against aggregation of trivial burdens.
      *   **Resolution:** No tension. (5) is a cornerstone example supporting your adherence to (1), (2), and (6).

  ### 🔑 Summary & Recommendation
  *   **Primary Challenge:** Reconciling (4) (probabilistic risk) and (6) (headaches). This is the **crucial battleground** for your paper.
  *   **Proposed Solution:** Defend a qualitative distinction between burdens:
      *   **Complaints about vulnerability to catastrophic loss** (even with low probability) generate significant individual complaint strength against principles that ignore such risks. (Supports 4).
      *   **Complaints about certain minor burdens** (like headaches) generate trivial individual complaint strength, insufficient to reasonably reject principles requiring bearing them to prevent catastrophe. (Supports 5 & 6).
  *   **Cost:** You must robustly defend this burden hierarchy within contractualism, arguing why risk-of-death vulnerability creates a complaint qualitatively stronger than a certain minor harm, *without* relying on summing expected utilities. Be prepared for challenges accusing you of inconsistency or covert aggregation.
  *   **Strengths:** Your positions on (3) and (5) are solidly Scanlonian and IR-compliant. (6) is also strongly supported by the IR and Scanlon's core examples.

  **Your position *can* hang together coherently by emphasizing the *qualitative nature of complaints* rather than the size of the group or the certainty of the burden.** Focus your paper on articulating and defending the burden hierarchy that allows (4) and (6) to coexist under the Individualist Restriction. This is where the deepest philosophical work lies, and where you'll make your most original contribution. Good luck with the seminar!
