prompt: |-
  I've been circling the literature on the epistemic status of the Church–Turing thesis for a while — the definitional reading, the empirical reading, the quasi-empirical-mathematical reading — and before I read another word of it, I want the specification fixed. Write the desiderata: what any adequate account of the thesis's epistemic status has to deliver, with the motivating case behind each requirement, and a judgment about which are non-negotiable and which are mere prejudices of one camp. Fix the purpose as follows: an account is adequate if it settles what kind of claim the thesis is, what would count for or against it, and whether and how it could be overturned.

  Some requirements I want you to at least consider taking a stance on, though you should add and subtract: the account must say what to make of the convergence of independently invented formalisms — Turing machines, lambda-definability, general recursiveness, register machines, Post systems — since a stipulative definition makes that convergence a lucky accident while a substantial claim makes it evidence, and the account must wear which story it tells; it must keep the original thesis, about the informal notion of effective calculability, cleanly separate from the stronger physical variants about what any machine can compute, and say whether they share an epistemic status or merely a name; it must say something principled about well-specified but uncomputable functions, since an account on which the thesis could not have been false struggles to explain why the halting problem feels like a discovery rather than a bookkeeping choice; it must either assign the thesis a plausible role in mathematical practice, where it is routinely invoked as if beyond doubt, or explain away that practice; it must explain rather than merely dismiss the peculiar phenomenology of the thesis, the way it strikes nearly everyone as obvious in retrospect; and it must not simultaneously demand that the thesis be substantive enough to be refutable and immune from refutation by physics we do not actually possess — though if you think that pairing is jointly satisfiable, or jointly dispensable, say so, since that is the part I most want to see. Finally, mark which single requirement excludes the most popular accounts: I suspect it is the one about convergence, but I want to see whether you agree. Then, briefly only, run the definitional, empirical, and quasi-empirical-mathematical readings against the list — I care about the criteria, not the scorecard.
reasoning: |-
  Okay, the user is deeply engaged with the epistemic status of the Church-Turing Thesis (CTT) and wants a structured set of desiderata to evaluate different accounts. They're clearly well-versed in the literature but frustrated by circular debates. My task is to crystallize the non-negotiable requirements while challenging tribal assumptions.

  First, unpacking their explicit demands: they want criteria that force clarity on (1) CTT's claim-type, (2) its verification/falsification conditions, and (3) its potential revocability. The sub-requirements they listed—convergence of formalisms, physical CTT separation, uncomputable functions, mathematical practice, retrospective obviousness, and the physics-immunity paradox—are all vital. But I must add what's implied: any account must handle CTT's unique duality as both mathematically useful and philosophically contested.

  The physics-refutation point is their burning concern. Can CTT be both empirical enough to matter yet safe from alien physics? My instinct: refutability by physics isn't necessary if we distinguish epistemic grounds. A mathematical account could treat physical CTT as derivative. But I'll let the desiderata decide.

  Now structuring the desiderata. Non-negotiables should be those that expose fatal flaws. Convergence is indeed a killer—definitional accounts make the 1930s formalism overlap a coincidence, which feels absurd. That alone sinks naive stipulativism. Similarly, accounts that can't explain why the halting problem proof lands as a discovery rather than convention fail a basic intuition test.

  For the physics dilemma: I'll make robustness a tiered requirement. Core CTT (about effective calculability) shouldn't be vulnerable to tomorrow's quantum computer, but physical CTT might be—if the accounts can separate them. Some readings (like quasi-empirical) might handle this better than others.

  When briefly applying readings: Definitionalist views will crash on convergence and uncomputable function explanations. Empirical views stumble on mathematical practice and retrospective obviousness. Quasi-empirical may struggle with separating core/physical CTT. None escape unscathed—exactly why the user needs these criteria.

  Finally, tagging the convergence desideratum as the strongest filter. It's why Turing's original paper remains indispensable: he didn't just define, he argued from human cognition. That's the gold standard no definitional account can meet.
answer: |-
  Here are the desiderata for an adequate account of the Church-Turing Thesis (CTT), structured to meet your request. I've categorized them, provided motivations, judged negotiability, and identified the key filter. After the list, I briefly apply the major readings.

  **Core Desiderata (Non-Negotiable):**

  1.  **Clarity on Claim Type & Ontological Status:**
      *   **What it must deliver:** Precisely state what kind of claim CTT is (e.g., definitional stipulation, empirical hypothesis, mathematical conjecture, conceptual analysis, synthetic a priori). Is it about *meaning* or *fact*?
      *   **Motivating Case:** Fundamental disagreement in the literature. A definitional account sees it as true by fiat, an empirical account sees it as contingent and falsifiable by discovery. This underpins everything else.
      *   **Non-Negotiable:** Yes. Without this, the account is fundamentally ambiguous.

  2.  **Conditions for Support/Refutation:**
      *   **What it must deliver:** Specify what evidence or arguments count for or against CTT. What would falsify it? What would confirm it beyond its current status?
      *   **Motivating Case:** If it's empirical, counterexamples should be conceivable; if definitional, they are ruled out by meaning. The halting problem proof *feels* like evidence *for* CTT, not against it – how?
      *   **Non-Negotiable:** Yes. Core to understanding its epistemic standing and revisability.

  3.  **Revisability/Overturnability:**
      *   **What it must deliver:** State whether and how CTT could be overturned or fundamentally revised. Is it permanent? If revisable, what process would achieve this?
      *   **Motivating Case:** Contrast with mathematical theorems (proven true) vs. empirical laws (falsifiable). Does CTT belong in a third category? The "obviousness" suggests permanence, but epistemology demands revisability.
      *   **Non-Negotiable:** Yes. Directly addresses its foundational nature.

  4.  **Accounting for Convergence of Formalisms:**
      *   **What it must deliver:** Explain the historical fact that multiple, independently developed formalisms (Turing machines, λ-calculus, general recursiveness, etc.) were proven extensionally equivalent. Does this convergence constitute *evidence* for a pre-theoretic concept, or is it merely a happy coincidence of stipulation?
      *   **Motivating Case:** This is the strongest argument *against* a purely definitional/stipulative reading. If CTT is *just* a definition, the convergence is accidental and carries no epistemic weight. If CTT makes a substantial claim, convergence is strong evidence. The account must explicitly wear one story or the other.
      *   **Non-Negotiable:** Yes. This is often the crux. It exposes the core tension between stipulation and discovery.
      *   **The Key Filter:** **This is the single requirement that most decisively excludes popular accounts.** Naive definitionalism fails this spectacularly. Weak empirical accounts often struggle to explain the *mathematical necessity* felt in the convergence proofs.

  5.  **Separation of Core CTT from Physical CTT:**
      *   **What it must deliver:** Clearly distinguish the *original* CTT (about the informal notion of "effective calculability" or "algorithm") from stronger variants (e.g., "any physically realizable system can compute only recursive functions"). Explain their relationship: Do they share the *same* epistemic status, or are they fundamentally different types of claims merely sharing a name?
      *   **Motivating Case:** Constant conflation causes confusion. Arguments against Physical CTT (based on quantum mechanics, hypercomputation, etc.) are irrelevant to Core CTT if properly separated. Failure to distinguish muddies discussions of evidence and refutation.
      *   **Non-Negotiable:** Yes. Essential for precision.

  6.  **Explaining Uncomputable Functions:**
      *   **What it must deliver:** Provide a principled account of well-specified but uncomputable functions (like the Halting Problem). Why do proofs of their existence feel like *discoveries* about the limits of computation, rather than mere artifacts of definitional bookkeeping? If CTT could not have been false, how is the Halting Problem non-trivial?
      *   **Motivating Case:** The visceral sense of discovery in diagonalization arguments. A purely stipulative definition struggles mightily to explain this; it makes uncomputability seem arbitrary. The account must show why these limits are inherent to the concept of computation itself.
      *   **Non-Negotiable:** Yes. Addresses a core intuition about the *significance* of the thesis and its mathematical consequences.

  **Important, but Potentially Negotiable/Interpretive Desiderata:**

  7.  **Accounting for Mathematical Practice:**
      *   **What it must deliver:** Either assign CTT a plausible, non-question-begging role in mathematical practice where it’s invoked confidently (e.g., "this is uncomputable by CTT"), or provide a compelling explanation/justification for why this practice is legitimate despite the thesis's contested epistemic status. If dismissing the practice, the burden is high.
      *   **Motivating Case:** Mathematicians use CTT as a bedrock principle. An account that implies this practice is fundamentally mistaken or irrational needs strong justification. An account that validates it must show how.
      *   **Negotiable:** Partially. *How* it accounts for practice might vary (e.g., pragmatic utility vs. justified belief), but ignoring it entirely is inadequate. Prejudice: Some strongly empirical views might see the practice as unwarranted dogma; some definitional views might see it as trivial.

  8.  **Explaining Retrospective Obviousness:**
      *   **What it must deliver:** Address the peculiar phenomenology that CTT, once grasped, strikes nearly everyone as obvious or inevitable in retrospect. Why does it feel like uncovering a necessary truth rather than learning a contingent fact or a definition?
      *   **Motivating Case:** This is a widespread experience that needs explanation. It pushes towards non-empirical accounts but needs integration.
      *   **Negotiable:** Partially. While important for a complete picture, an account *could* potentially sidestep phenomenology and focus solely on logical/epistemic structure, though this feels incomplete. Prejudice: Hard empiricists might dismiss this as irrelevant psychology; definitionalists might claim it's the obviousness of a tautology.

  9.  **Physics-Immunity/Refutability Tension:**
      *   **What it must deliver:** Resolve the apparent tension: An account cannot simultaneously demand that CTT be substantive enough to be refutable *and* demand it be immune from refutation by hypothetical (non-actual) physics (e.g., hypercomputation). It must either:
          *   Show the tension is illusory and both demands *are* jointly satisfiable (e.g., by clearly separating Core CTT from Physical CTT and assigning different statuses).
          *   Argue convincingly that one demand is illegitimate or dispensable (e.g., Core CTT *is* immune to physics refutation; Physical CTT *is* genuinely vulnerable).
          *   Reconfigure the demands entirely.
      *   **Motivating Case:** This is a central point of contention. Many want CTT to be robust against unknown physics (suggesting non-empirical core) but also want it to be more than just a definition (suggesting refutability). How is this circle squared?
      *   **Negotiable:** The *specific form* of the demand might be negotiable, but any adequate account **must** explicitly address this tension and provide a coherent resolution. Prejudice: Hardcore empiricists might insist Physical CTT *must* be vulnerable; definitionalists might dismiss physics as irrelevant entirely.

  **Brief Application to Major Readings:**

  *   **Definitional/Stipulative:**
      *   Fails (4) Convergence (renders it accidental), struggles severely with (6) Uncomputable Functions (makes limits seem arbitrary), and struggles with (7) Mathematical Practice (why invoke a definition as a substantive reason?). May handle (8) Obviousness (tautologies are obvious) and (9) Tension (dismisses physics as irrelevant). Clearly defines (1) Claim Type. Makes (2) Refutation impossible and (3) Overturning nonsensical. Fails on (5) Separation (often conflates or ignores Physical CTT).
  *   **Empirical:**
      *   Struggles with (4) Convergence (why did independent formalisms converge *mathematically* if it's empirical?), (7) Mathematical Practice (why treat an empirical hypothesis as certain?), and (8) Obviousness (empirical truths aren't usually obvious in this way). Handles (2) Refutation (in principle) and (3) Overturning. Addresses (9) Tension by embracing vulnerability to physics for Physical CTT, but must clearly separate Core CTT (which it often struggles to define non-circularly). May struggle with (6) Uncomputable Functions (if CTT is contingent, are *these* proofs contingent too?).
  *   **Quasi-Empirical/Mathematical (e.g., conceptual analysis, indispensability, synthetic a priori):**
      *   Can handle (4) Convergence (as evidence revealing a robust concept), (6) Uncomputable Functions (as genuine discoveries about conceptual limits), (7) Mathematical Practice (as justified), and (8) Obviousness (as recognizing conceptual necessity). Addresses (9) Tension by grounding Core CTT conceptually/mathematically (immune to physics), allowing Physical CTT to be empirical/vulnerable (satisfying separation (5)). Defines (1) Claim Type as non-standard (neither pure math nor pure empirical). Specifies (2) Refutation via conceptual analysis/counterexamples to intuitions about algorithms, not physics. (3) Overturning requires conceptual revolution, not mere empirical discovery. **This reading generally satisfies the most desiderata coherently.**

  **Conclusion:** An adequate account must satisfy Desiderata 1-6 non-negotiably. The convergence of formalisms (4) is indeed the most effective filter, decisively challenging definitional views and demanding a substantial element. Resolving the physics-refutability tension (9) is crucial, best achieved by rigorously separating Core CTT (grounded in conceptual/mathematical analysis) from Physical CTT (empirical/hypothetical). The quasi-empirical/mathematical reading, particularly conceptual analysis, emerges as the strongest contender against these criteria, offering coherent explanations for convergence, uncomputability, mathematical practice, and the phenomenology while cleanly separating the physical variant.
