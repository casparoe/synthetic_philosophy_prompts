  **The Daily Clarion**  
  **ECONOMIC THERAPY with Dr. Verity Choice**  
  *(Dr. Choice holds the Paul A. Samuelson Distinguished Chair in Preference Revelation at Market State University. Her advice is based solely on observed choice behavior. Statements about feelings are treated as consumption expenditures.)*

  ---

  **Dear Dr. Choice,**  
  I’m writing in frustration, mainly at myself. Four years ago, I signed up for a premium gym membership, convinced I’d finally get fit. I’ve used it exactly twice. Yet, every year when the renewal notice arrives, I pay it! I tell myself *this* year will be different. My bank account weeps, and my treadmill gathers dust. What is wrong with me?  
  *– Perpetually Paying in Peoria*

  **Dear Perpetually Paying,**
  Nothing is wrong! Your behavior is exquisitely rational. You reveal, year after year, a clear preference: you value the *option* of going to the gym more than the alternative uses of that $799.99. The alternative uses presumably include the utility derived from *not* exercising while possessing the membership card (a feeling of potential, perhaps?), or avoiding the minor hassle of cancellation. Your renewal choice demonstrates that the total bundle of benefits – the membership card itself, the *idea* of fitness, the avoidance of cancellation guilt – provides greater satisfaction *at that decision point* than any other bundle you could purchase with that sum. The dust on the treadmill is simply a testament to the high opportunity cost of actual exercise *for you, specifically*, revealed by your consistent non-attendance. You are optimally allocating your resources. Stop worrying and enjoy your efficiently purchased peace of mind (or potential thereof). The market has spoken, through you!

  ---

  **Dear Dr. Choice,**  
  I “want to quit” smoking. I say it all the time. I know it’s expensive and killing me. But every single day, I walk into the store and buy a pack. The moment after I light up, I feel regret. How can I be so stupid?  
  *– Regretfully Puffing in Providence*

  **Dear Regretfully Puffing,**
  Your language betrays a misunderstanding of preference. What you *state* (“I want to quit”) is cheap talk. What you *do* (buying the pack daily) reveals your true, ordinal preference at the moment of purchase. Clearly, the utility derived from smoking that next cigarette, *at the precise instant you hand over the cash*, exceeds the utility you anticipate from the alternative: the saved money plus the avoided health risk *discounted by your personal time preference*. The regret you feel *afterwards* is merely a datum about a *different temporal self* – a self facing a new set of constraints (nicotine levels dropping, perhaps). That later self may reveal a different preference ordering (e.g., preferring not to have smoked *then*). But the economist observes the choice *when it was made*. Your daily purchase demonstrates, with beautiful consistency, that smoking provides optimal satisfaction *at the point of sale*. Your revealed preference is clear: smoke. Own it. The circularity you sense is merely the elegant consistency of rational choice.

  ---

  **Dear Dr. Choice,**  
  My daughter called me sobbing last night. She hates her job. It’s draining her soul, she says. She described hours of pointless meetings, a toxic boss, and work that bores her. Yet, when I gently asked if she was looking for something else, she snapped, “Of course not! The benefits are good, and the market is terrible!” Her misery seems profound, but she stays. How can I help her see she has options?  
  *– Concerned Dad in Cleveland*

  **Dear Concerned Dad,**
  Your daughter is a masterful utility maximizer. Her observed choice – remaining employed at her current job – reveals her unambiguous preference for that specific bundle of wages, benefits, and working conditions *over all available alternatives*. Her tears and complaints are not evidence of error; they are *components* of the chosen bundle. She evidently derives utility from the catharsis of complaining (a valuable consumption good!), the security of “good benefits,” and the avoidance of search costs and perceived risks in the job market. Her statement about the “terrible market” is her subjective assessment of the opportunity cost of leaving – an assessment confirmed by her revealed choice to stay. If a better option existed *that she preferred*, she would have chosen it. She hasn’t. Therefore, by the iron logic of revealed preference, her current job is demonstrably her best available option. Your role isn’t to question her optimal choice but to appreciate her efficient allocation of resources (including emotional ones). Perhaps offer tissues – a complementary good to her consumption of complaint.

  ---

  **Dear Dr. Choice,**  
  As a behavioral economist, I find your column dangerously simplistic. Humans aren't frictionless optimizers! Cognitive biases, present bias, loss aversion – these *systematically* cause choices that don't reflect true underlying preferences. Your "revealed preference" is often just revealed error, trapping people in suboptimal outcomes they genuinely dislike. When will you acknowledge the evidence?  
  *– Prof. Bea Haven, Psych & Econ Dept., Riverbend College*

  **Dear Prof. Haven,**
  How charmingly… *descriptive*. Your letter reveals a preference for mental accounting gymnastics over the pristine logic of choice data. You posit mythical "true underlying preferences" floating in some Platonic realm, unobservable and conveniently invoked *only* when choices displease the observer. How unscientific! Revealed preference demands we respect the sovereignty of the *actual choice*, made under *actual constraints* (including the constraint of one's own cognitive architecture, biases included). If someone exhibits "present bias," their choice *still* reveals that they prefer the present satisfaction more highly at that moment – that *is* their preference then! The fact that a future self might choose differently doesn't invalidate the earlier choice; it simply reveals shifting constraints or preferences over time. Labeling choices "errors" based on hypothetical alternatives or surveys is an exercise in normative arrogance, not positive science. Our discipline studies *what is chosen*, not what a well-meaning academic thinks *should* be preferred. Your preference for complexity merely reveals your taste for a different, less elegant (and less operational) model. *De gustibus non est disputandum* – even for behavioralists. Stick to your surveys and 'nudges'. We'll stick to the data: what people *do*.

  ---

  *Dr. Choice reminds readers: Your choices are perfect. Always. If you think they aren't, that thought is simply part of the optimal bundle you've selected. Now, go forth and reveal!*
