answer: |-
  ### Exam Question: Philosophy of Science Take-Home Final  
  **Time Limit:** 90 minutes | **Open Notes** | **Total Marks: 20**  

  **Question:**  
  Thomas Malthus’s *An Essay on the Principle of Population* (1798) argued that population grows geometrically while food production grows arithmetically, inevitably forcing wages down to subsistence levels. Yet the "demographic transition" (declining birth rates amid industrialization) and the Green Revolution (mid-20th-century agricultural innovation) appeared to avert this outcome. Some scholars defend Malthus by claiming he was "right about the mechanism but wrong about the timeline," or even that his warnings *caused* the innovations that falsified his prediction. Meanwhile, the 1980 Simon–Ehrlich wager (on five commodity metals’ prices) saw Ehrlich pay Simon in 1990 after prices fell, but had the wager extended to 2011, Ehrlich would have won on four of five metals.  

  Using Popper’s falsificationism and Lakatos’s methodology of scientific research programmes (MSRP):  
  1. **Analyze** whether the "right but early" defense of Malthus is a legitimate auxiliary-hypothesis adjustment or an immunizing stratagem.  
  2. **Evaluate** the epistemic status of theories with sliding doom dates (e.g., Malthusian collapse, resource depletion). Can they ever be falsified?  
  3. **Classify** the argument that "Malthus was vindicated *because* his warnings prompted the Green Revolution" within Lakatos’s framework.  

  Support your analysis with explicit references to falsification criteria, progressive/degenerative problem shifts, and the provided historical cases.  

  ---

  ### Model Answer (600 words)  
  The "right but early" defense of Malthus exemplifies the tension between Popperian falsification and Lakatosian flexibility. For Popper, a theory is falsified if its core prediction fails observationally. Malthus’s prophecy of collapse by the mid-19th century was refuted by rising wages and food surpluses during the demographic transition. Defenders then shifted the predicted timeline (e.g., to 2100), which Popper would condemn as *ad hoc*: it immunizes the theory by making it unfalsifiable, as no failure date can disprove it if the horizon perpetually recedes. The Simon-Ehrlich wager underscores this: Ehrlich’s 1990 loss falsified his short-term prediction, but the 2011 metal-price reversal shows Simon’s optimism could equally be "falsified" by further delays, revealing how both sides exploit temporal ambiguity.  

  Lakatos’s MSRP, however, permits timeline adjustments if they are *theoretically progressive*. A research programme (e.g., Malthusianism) has a "hard core" (population pressure threatens resources) protected by a "protective belt" of auxiliary hypotheses (e.g., technological ceilings). Adjustments to this belt (e.g., extending doom dates) are legitimate only if they:  
  1. **Predict novel facts** (e.g., new mechanisms for collapse),  
  2. **Expand empirical content** (e.g., explaining counter-evidence like the Green Revolution).  

  The "right but early" move fails Lakatos’s test. Malthusians merely *react* to surprises (e.g., the demographic transition) without predicting *new* phenomena. Contrast this with the Green Revolution: it emerged from exogenous innovation (e.g., Borlaug’s wheat breeding), not Malthusian theory. Calling this "vindication by warning" is a *degenerative* stratagem: it retrospectively reinterprets falsifying evidence (abundant food) as confirmation, violating Lakatos’s ban on *ad hoc* explanations. If every failure proves the theory’s "influence," the programme becomes non-falsifiable.  

  Sliding doom dates pose a deeper problem: they risk making theories *empirically vacuous*. For falsificationists, a single failure suffices if the prediction was unambiguous. Lakatosians, however, tolerate delays if supported by *independent evidence* of the mechanism. For example, evidence that population growth *currently* strains resources (e.g., famine hotspots) could justify timeline extensions. Yet Malthusianism’s repeated retreats—from 1800 to 2100—without novel predictions, exemplify degeneration. The Simon-Ehrlich flip (1990 vs. 2011) proves both sides use the same rescue tactic, exposing how MSRP criteria (progressive shifts) are essential to distinguish science from pseudoscience.  

  Ultimately, Malthusianism could be falsified by *structural disproof* of its core mechanism. If rising populations consistently correlate with *increasing* per-capita resources (e.g., via innovation feedback loops), the hard core erodes. Conversely, evidence that innovation is *exhaustible* (e.g., declining crop-yield growth) would support it. Without such tests, "right but early" is an immunizing stratagem—a shield for ideologies, not science.  

  ---

  ### Marking Scheme (20 Marks Total)  
  **Award marks for demonstrated analysis, not mere description.**  

  | **Criteria**                                                                 | **Marks** | **Common Mistakes (Mark Deductions)**                                                                 |
  |-----------------------------------------------------------------------------|-----------|-------------------------------------------------------------------------------------------------------|
  | **1. Correct application of Popper** to Malthus’s initial falsification. Must state why timeline shifts are *ad hoc* under falsificationism. | 4 | *Vague Popper reference (‑2); Claims "not yet falsified" is automatically valid/invalid without criteria (‑3)*. |
  | **2. Lakatosian analysis of "right but early"**: Uses MSRP to evaluate timeline shifts. Must distinguish progressive vs. degenerative adjustments using empirical content/novel predictions. | 6 | *Recites Lakatos definitions without applying to timeline (‑4); Fails to cite novel predictions/explanatory power (‑3)*. |
  | **3. Treatment of symmetry** (Simon-Ehrlich 1990/2011): Explains how both sides use "not yet!" and why MSRP criteria resolve this. | 4 | *Ignores the metal-basket flip (‑2); Doesn’t link to sliding-timescale problem (‑2)*. |
  | **4. Classification of "vindicated by warning"**: Identifies it as degenerative (immunizing via *post hoc* narrative). | 3 | *Uncritically accepts the argument (‑2); Labels it *ad hoc* without Lakatosian rationale (‑1)*. |
  | **5. Answers "can it be falsified?"**: Proposes *structural* tests (e.g., mechanism failures) despite sliding dates. | 3 | *States "no" without justification (‑2); Suggests only temporal failure counts (‑2)*. |
  | **BONUS (1 mark)**: Articulates what evidence could settle disputes (e.g., observed breakdown of innovation feedback loops, sustained resource depletion despite low population growth). | +1 | *N/A* |  

  **Clarity & Structure**: Deduct up to 2 marks for disorganization or significant irrelevance.  

  ---  
  **Rationale for Design**:  
  - The question embeds all historical facts to ensure equity.  
  - Forces engagement with the sliding-timescale paradox via the Simon-Ehrlich flip.  
  - The bonus mark incentivizes deeper epistemology (e.g., testing mechanisms beyond timing).  
  - Targets predictable failures: students must *apply* criteria, not just recount theory or history.
