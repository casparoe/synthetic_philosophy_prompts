  We are preparing a Q&A sheet for a presentation on the Löbian obstacle and its broader implications. The audience consists of formal verification engineers and ML engineers, each with their own perspectives and managers concerned with practical impact.

  Key points from the presenter's position:
  1. The Löbian obstacle is not just Gödel's second incompleteness theorem in disguise, nor is it irrelevant to ML systems because they don't rely on proof.
  2. It's a general phenomenon: a verification regime cannot certify its own trustworthiness from the inside.
  3. Examples from software: test suites testing themselves, bootstrapped compilers, Thompson's hack.
