answer: |-
  ### Diagnostic Decision Tree: Moral Positions on Harm  
  *Based on your judgments about concrete cases, starting from the commitment: "It can sometimes be permissible to cause serious harm in pursuit of a proportionately greater good, though not always."*  
  **Assume you find it permissible to redirect a runaway tram from killing five people to killing one (the "Switch" case). If not, your view is stricter than the starting commitment and falls outside this tree's scope.**  

  ---

  #### **Question 1: Footbridge Case**  
  *You stand on a footbridge above trolley tracks. A runaway tram will kill five people ahead. Pushing a large man onto the tracks will stop the tram, saving the five but killing him. Is pushing permissible?*  
  - **YES** → Proceed to **Question 2**.  
  - **NO** → Proceed to **Question 3**.  

  #### **Question 2: Terror Bomber Case**  
  *Bombing enemy civilians will kill them and break enemy morale, shortening a war and saving many lives. The deaths are the direct means to demoralize the enemy. Is bombing permissible?*  
  - **YES** → **Leaf: Unrestricted Consequentialism (UC)**.  
  - **NO** → **Inconsistent judgment** (no natural position).  

  #### **Question 3: Strategic Bomber Case**  
  *Bombing an enemy munitions factory will shorten a war and save many lives, but also kill nearby civilians as a side effect. You do not target the civilians; their deaths are unintended. Is bombing permissible?*  
  - **NO** → **Inconsistent judgment** (contradicts permissibility in Switch).  
  - **YES** → Proceed to **Question 4**.  

  #### **Question 4: Craniotomy Case**  
  *A doctor must crush a fetus's skull to save a pregnant woman's life (e.g., to remove it). The death is the direct means to save her. Is this permissible?*  
  - **YES** → **Inconsistent judgment** (contradicts Footbridge judgment).  
  - **NO** → Proceed to **Question 5**.  

  #### **Question 5: Loop Trolley Case**  
  *Redirecting a tram from five people to a side track with one person will kill the one. The side track loops back; the one person’s body is needed to stop the tram from circling back to kill the five. Is redirecting permissible?*  
  - **YES** → **Leaf: Doctrine of Double Effect (DDE)**.  
  - **NO** → **Leaf: Deontological View without DDE (D)**.  

  ---

  ### Answer Key  
  - **Unrestricted Consequentialism (UC)**: Harm is permissible whenever it maximizes net good (e.g., allows Footbridge and Terror Bomber).  
  - **Doctrine of Double Effect (DDE)**: Harm is permissible only if:  
    - It is *foreseen but not intended* (e.g., allows Strategic Bomber but not Terror Bomber).  
    - It is a *side effect*, not the means to the good (e.g., forbids Craniotomy).  
    - Proportionality holds.  
  - **Deontological View without DDE (D)**: Harm is forbidden if it *uses a person as a means* (e.g., forbids Footbridge, Craniotomy, and Loop), but allowed as a side effect (e.g., allows Switch and Strategic Bomber). Intention is irrelevant; causal role matters.  
  - **Inconsistent judgment**: Your answers conflict with core principles of standard positions.  

  ---

  ### Flags and Caveats  
  1. **Unresolved Boundary: Loop Trolley Case**  
     - **Issue**: The Loop case blurs the line between "side effect" (DDE) and "using as a means" (Deontological View D). Philosophers debate whether redirecting in Loop is more like Switch (DDE-allowed) or Craniotomy (DDE-forbidden).  
     - **Cause**: Genuine indeterminacy in positions. DDE theorists disagree on whether "causal necessity" (Loop) implies "means."  
     - **Advice for Students**: If you hesitated on Loop, your intuition may align with either DDE or Deontological D. Reflect on *why* you answered as you did: Is redirecting inherently acceptable (favoring DDE), or does the victim’s role as a "stopper" make it impermissible (favoring Deontological D)?  

  2. **Missing Position: Refined DDE**  
     - **Issue**: The tree does not distinguish "Refined DDE" (e.g., requiring that the agent *not rely on or welcome the harm*). Cases here lack attitude-based tests (e.g., a Strategic Bomber variant where the agent is indifferent to civilian deaths).  
     - **Cause**: Defect in the instrument. Attitudinal factors require nuanced cases beyond this tree’s scope.  
     - **Advice**: If you endorsed DDE but felt uneasy about Strategic Bomber, you may lean toward Refined DDE.  

  3. **Inconsistent Judgments**  
     - **Cause**: Some combinations (e.g., "YES to Footbridge but NO to Terror Bomber") lack a natural home due to conflicting principles. This may reflect context-dependent intuitions or unacknowledged biases.  
     - **Advice**: Revisit cases where you flagged inconsistency. Do war/trolley contexts or direct/indirect acts explain your answers?  

  4. **Limitations**  
     - This tree tests *patterns* in intuitions, not theoretical knowledge. Real-world factors (e.g., emotions, risk) are simplified.  
     - Positions are idealized; many philosophers blend elements. Use this as a starting point for reflection, not a final label.  

