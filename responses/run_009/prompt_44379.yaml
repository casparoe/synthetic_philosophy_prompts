  5. **Craniotomy**: Crush a baby's skull to save the mother's life (the death is the means to the good end).
  6. **Loop Trolley**: Redirect the tram to a side track where one person is tied down; if the tram were not redirected, it would go onto a loop and then kill the five (so the one's body stops the tram, making the death necessary even though we are only redirecting).

  We aim to distinguish the following positions:

  - Unrestricted consequentialism (UC): Permissible to cause harm whenever it leads to the best overall outcome.
  - Doctrine of double effect (DDE): Permissible to cause harm as a foreseen side effect if (a) the action is good or neutral, (b) the bad effect is not intended, (c) the good effect is not produced by the bad effect, and (d) there is proportionality.
  - Refined DDE (with double intention, RDDE): Adds that the agent must not rely on or welcome the harm, even if not intended.
  - Deontology without DDE (D): Forbids using people as means, but does not use the intended/foreseen distinction. Thus, might allow some side effects but not using harm as a means.

  Branch points:

  1. **Switch vs. Footbridge**: This is the classic test for the means/side-effect distinction and the use of force. If a student thinks both are permissible, they are likely consequentialist. If they think Switch is permissible but Footbridge is not, then they are making a distinction that DDE and deontology without DDE might capture.

  2. **Strategic Bomber vs. Terror Bomber**: This tests the intended/foreseen distinction. If a student thinks Strategic is permissible but Terror is not, they are using the intended/foreseen distinction (a key part of DDE). If they think both are permissible, they may be consequentialist. If they think both are impermissible, they may be deontologists without DDE or have a strict prohibition.

