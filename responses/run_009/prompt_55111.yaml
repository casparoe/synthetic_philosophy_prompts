prompt: |-
  I'm a doctoral student in computational neuroscience, and last week's dissertation committee meeting turned into an argument I wasn't prepared for. My project compares visual object recognition in mammalian cortex with recognition in deep convolutional networks, and the philosopher on my committee challenged the framing: if functionalism and multiple realizability are as advertised—psychological kinds individuated by causal role and realizable in neurons, silicon, or anything else with the right organization—then the cross-substrate comparison is straightforward and legitimate. But my advisor thinks the empirical convergence we observe between neural and artificial systems reflects deep implementation constraints, such that the "same" computation can only be realized in a narrow family of substrates—which would make the comparison far less informative than I'd assumed. Since then I've been reading around the topic, and I've realized the textbook presentation conceals quite a lot of live disagreement.

  Give me your credence that the multiple realizability argument, properly stated, succeeds: that is, that mental state kinds (belief, pain, visual recognition of objects) are individuated by functional role in a way that both (a) is actually true of the world—those kinds really are realized in physically very different systems—and (b) blocks the reduction of psychological kinds to neurobiological or physicochemical kinds. Decompose the number into the sub-questions you think it rests on. Candidates you should weigh: whether multiple realizability is in fact widespread at the grain that matters, versus being an artifact of describing things coarsely while implementations converge; whether disjunctive or species-by-species identities (pain-in-mammals, pain-in-octopuses, and so on) count as a successful reduction or merely as its failure dressed up; whether non-reductive functionalism is stable against Jaegwon Kim's causal exclusion worry, on which higher-level functional causes risk being preempted by their physical realizers; and whether computational functionalism in particular—the version actually relevant to comparing brains and neural networks—inherits these problems or escapes them. Add any further terms you think belong. Assign each sub-question a rough probability with a line of justification, show how they combine into your final credence, and tell me which term you're least confident in and what evidence would move it most.

  Two constraints on the answer. First, keep my situation in view: I need to know how much weight a cross-species, cross-substrate comparison of visual systems can actually bear, so don't drift into general philosophy-of-mind essay mode. Second, please clearly separate what is settled among knowledgeable people from what is genuinely contested—e.g., whether the mere occurrence of some multiple realizability should be treated as established, versus the contested questions of how widespread it is at relevant grains and what follows from it—rather than presenting one side's position as the consensus view.
