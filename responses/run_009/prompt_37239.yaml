  - Prolonged grief involves clear value judgements about normal vs pathological suffering. This must be explicitly handed to ethics/policy groups.

  I notice the user's personal stakes (sceptical of #1, invested in #2). The procedure must override biases, so I'll bluntly state when outcomes contradict their position. 

