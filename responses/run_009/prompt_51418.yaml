prompt: |-
  I'm a backend engineer (no formal philosphy background, everything I know about ethics I absorbed from arguments with my college roommate) and every December I go through the same dumb cycle with myself about how much of my salary to give away. The roommate is a hardcore utilitarian and keeps sending me stuff about how I should basically live on almost nothing and give the rest, and my sister thinks anything past a few percent is performative guilt. I don't want another lecture, I want a procedure -- like a runbook for an on-call incident, something I can sit down with once a year over a weekend with a spreadsheet and actually follow.

  From arguing with the roommate I've gathered that there's this thing called the demandingness objection to consequentialism: if the theory says you have to keep giving until the next dollar does more good for you than for someone worse off, that's just too much to ask of a person, and that's supposed to be a serious problem for the view, not just people being lazy. And I gather there are a bunch of responses -- some say the theory is right and it's fine that it's this demanding, some say you're allowed to keep enough for your own projects and relationships (agent-centered prerogatives I think?), some make it about fairness and not being the sucker who does everything while other givers free-ride, and I lose track after that. I don't need you to settle who's right. I need the disagrement turned into something operational.

  So: write me a yearly decision procedure for the "how much do I donate, and how much of my time/volunteering counts toward it" decision. The questions in order, what counts as a sufficient answer to each one, where the procedure is allowed to stop with "you're done, go live your life," and where it has to say "no, you actually have to give more than is comfortable." Be honest about which steps are just a values judgment dressed up as arithmetic -- like, don't pretend the number I pick for "how much do I need to keep to not resent this" is objective. And where the procedure would genuinely give different answers depending on which philosophical response to demandingness you load into it, say so instead of hiding it.

  Then run it on three people so I can see it work: (1) me -- mid thirties, no kids, decent salary, currently giving about 4% and feeling vaguely bad about it; (2) a coworker in the same boat except she has two kids and is helping support aging parents on another continent; (3) the roommate himself, who would happily give 50% if the procedure told him to, and who I suspect the procedure shouldn't let do that. I want at least one worked case where the procedure gives an answer the person running it won't like -- if it always comes back "you're fine," it's not a procedure, it's a hug.

  Constraints: it has to be runnable by one non-philosopher in an afternoon, every input should be something I can actually check or estimate myself (no "compute the marginal utility of a dollar to a stranger halfway across the world"), and it should say what it does NOT settle -- I know there's a whole separate fight about whether it's better to help strangers far away vs people in your own community, and I'd rather the procedure just tell me where it punts on that and why than pretend it doesn't exist.
reasoning: |-
  We are designing a decision procedure that incorporates philosophical considerations but remains operational. The key challenge is balancing the demandingness of consequentialism with practical and psychological realities. We'll structure the procedure as a series of questions, each with clear instructions. The procedure should:

  1. Acknowledge where it requires value judgments.
  2. Be explicit about which philosophical positions it draws from and where they lead to different outcomes.
  3. Include stopping points where the user can reasonably say "I've done enough" for the year.
  4. Force further action in cases where minimal decency isn't met.

  We'll consider three main responses to the demandingness objection:

  A. **Hard Consequentialism**: You must give until the next dollar does more good for you than for the worst-off. (This is the most demanding.)
  B. **Agent-Centered Prerogatives**: You may keep enough to pursue your own projects and relationships, even if the money could do more good elsewhere.
  C. **Fairness Considerations**: You should give only your fair share, so you aren't exploited by free-riders.

  The procedure will blend these by:

  - First, establishing a baseline of what is minimally expected (using fairness to set a floor).
  - Then, allowing for agent-centered prerogatives to set an upper bound on demands.
  - But also, for those who want to give more (like the roommate), the procedure will cap giving to avoid self-sacrifice that undermines the giver's ability to continue helping in the long run.

  We break the procedure into steps:

  ### Step 1: Calculate Your Discretionary Income
  **Question:** What is your annual post-tax income minus essential living expenses?  
  **Guidance:** 
  - Essential living expenses include: housing (reasonable for your location and family size), utilities, basic groceries, healthcare, transportation to work, necessary clothing, and minimum debt payments. 
  - Exclude: vacations, entertainment, dining out, luxury items, savings beyond an emergency fund (we'll handle savings separately).  
  **Output:** Discretionary Income (DI)

  ### Step 2: Set a Fairness Floor
  **Question:** What is the minimum percentage of your discretionary income that you should contribute to avoid being a free-rider?  
  **Philosophical Basis:** Fairness considerations. We don't want to be the sucker who does everything, but we also don't want to be a free-rider.  
  **Guidance:** 
  - Research what the average effective donation rate is among people in your income bracket in your country. For the U.S., effective giving rates for the top 10% of income earners are around 1-3% of income (but note: this is of total income, not discretionary). However, we are using discretionary income. 
  - Alternatively, use a rule of thumb: 5% of discretionary income as a starting fairness floor. This is a value judgment. If you know that your peers (e.g., coworkers in tech) give less, you might adjust downward, but note that the global fairness picture might require more. 
  - **Sufficient answer:** A number between 1% and 5% of DI. This step sets a floor. If you give less than this, the procedure will require you to at least meet this floor.  
  **Output:** Fairness Floor (FF) as a dollar amount = (Chosen Percentage) * DI

  ### Step 3: Assess Your Personal Minimum for Well-Being and Projects
  **Question:** What amount of discretionary income do you need to retain to avoid resentment and maintain your core personal projects and relationships?  
  **Philosophical Basis:** Agent-centered prerogatives.  
  **Guidance:** 
  - This is a value judgment. Estimate what you need for: 
    - Savings for future security (beyond emergency fund: retirement, future large expenses).
    - Spending that significantly contributes to your well-being and prevents burnout (e.g., a hobby, occasional social outings, a modest vacation).
    - Supporting close relationships (e.g., gifts for family, taking a friend to dinner).
  - Be honest: if you don't set aside enough, you may burn out and stop giving entirely. But don't overestimate. 
  - **Sufficient answer:** A dollar amount that is at least 10% of your discretionary income? (This is a starting point; adjust based on your situation.) 
  - **Output:** Personal Minimum (PM)

  ### Step 4: Calculate the Upper Bound from Consequentialism
  **Question:** What is the maximum you could give without significantly harming your ability to earn and give in the future?  
  **Philosophical Basis:** Consequentialism with a long-term view.  
  **Guidance:** 
  - Consider: 
    - If you give too much, you might burn out, lose motivation, or not be able to invest in your career (e.g., missing conferences, training). 
    - Also, if you have dependents (like children or elderly parents), you must ensure their stability. 
  - **Rule of thumb:** Your total giving (as a percentage of discretionary income) should leave you with at least 20% of your discretionary income for personal well-being and savings. But adjust: if you have dependents, you might need more. 
  - **Output:** Consequentialist Cap (CC) = DI - (Minimum required for sustainability). We can set sustainability as: 
    - If no dependents: at least 20% of DI for personal well-being and savings. 
    - If dependents: at least 30% of DI. 
  - Then, the maximum you can give without harming future giving is: Max Give = DI - (sustainability reserve)

  ### Step 5: Determine Your Required Donation
  **Question:** How much must you give?  
  **Guidance:** 
  - You must give at least the Fairness Floor (FF) from Step 2. 
  - But you may give up to the Consequentialist Cap (CC) from Step 4. 
  - However, if you have set a Personal Minimum (PM) in Step 3 that is higher than what would be left after giving the Fairness Floor, then you have a conflict. The procedure resolves it by: 
    - If (DI - FF) >= PM, then you must give at least FF. 
    - If (DI - FF) < PM, then you are allowed to reduce your giving to (DI - PM) but must then give that amount. 
  - Also, if you are inclined to give more than the Consequentialist Cap (like the roommate), the procedure will cap you at CC to protect your long-term ability to give. 

  **Output:** 
  - Required Donation = max(FF, DI - PM) but not exceeding CC. 
  - However, note: If FF is greater than CC, that would mean the fairness floor is above what is sustainable. Then the procedure would set Required Donation = CC and flag that you are below the fairness floor due to sustainability. This is a warning that your situation is constrained.

  ### Step 6: Adjust for Time/Volunteering
  **Question:** How much of your volunteering time should count toward your donation?  
  **Guidance:** 
  - This is tricky. The procedure will only count volunteering that is directly replaceable by money. For example: 
    - If you volunteer at a soup kitchen, the value is the cost they would have paid for a worker to do your job. But that might be minimum wage. 
    - If you use your professional skills (e.g., building a website for a nonprofit), then you can value your time at your professional hourly rate, but only if the nonprofit would have otherwise paid for that service. 
  - The procedure will cap the amount you can count: no more than 50% of your required donation can be met by volunteering. The rest must be monetary. 
  - Why? Money is often more efficient, and we want to encourage cash donations. 
  - **Output:** The monetary equivalent of your volunteering (up to 50% of the required donation) can be subtracted from the required monetary donation. 

  ### Step 7: Final Check and Punting on Cause Selection
  **Question:** Where should I donate?  
  **Guidance:** 
  - This procedure does not decide the cause area. It only sets the amount. 
  - The user must choose where to donate, but we note: 
    - Some causes are vastly more effective than others (e.g., global health vs local art museum). 
    - The procedure acknowledges this but does not resolve it. 
  - Recommendation: If you are uncertain, consider donating to organizations recommended by GiveWell (for global health) or Giving Green (for climate) if those align with your values.

  ### Summary of the Procedure
  1. Calculate Discretionary Income (DI). 
  2. Set Fairness Floor (FF) as a percentage of DI (1-5%, or based on research). 
  3. Set Personal Minimum (PM) - the amount you need to keep for your own well-being. 
  4. Calculate Consequentialist Cap (CC) - the maximum you can give without harming your future giving capacity. 
  5. Required Donation = 
     - If (DI - FF) >= PM, then at least FF (but you can give more, up to CC). 
     - If (DI - FF) < PM, then at least (DI - PM) (and note that this is below the fairness floor, but allowed because of your personal situation). 
     - And never exceed CC. 
  6. Adjust for volunteering: subtract up to 50% of the required donation if you volunteer, but you must still give the remaining in cash. 

  ### Running the Examples

  #### (1) You (mid-thirties, no kids, decent salary, currently giving 4% and feeling bad)
  - Assume: 
    - Post-tax income: $150,000
    - Essential living expenses: $50,000 (including housing, food, etc.)
    - Discretionary Income (DI) = $100,000
  - Step 2 (Fairness Floor): Let's choose 5% of DI -> $5,000
  - Step 3 (Personal Minimum): You decide you need $20,000 for personal projects, savings, and fun. (This is 20% of DI.)
  - Step 4 (Consequentialist Cap): Since no dependents, reserve 20% of DI for sustainability -> $20,000. So CC = DI - $20,000 = $80,000.
  - Step 5: 
    - (DI - FF) = $100,000 - $5,000 = $95,000 >= PM ($20,000) -> so you must give at least $5,000.
    - But note: you can give more, up to $80,000. 
    - Since you've been giving 4% of your total income: 4% of $150,000 = $6,000. That's above the floor. 
    - However, the procedure says you must give at least $5,000. But you are already giving $6,000, which is above the floor. So you are meeting the requirement. 
    - But note: the procedure does not say you are done. It sets a floor, but you might feel you can do more. The procedure allows you to give up to $80,000. 
    - **Verdict**: You are above the floor. You are allowed to give more, but not required by the procedure beyond $5,000. So the procedure says: you're done (for the mandatory part). 

  However, you feel bad about 4%. The procedure does not force you to give more, but it does show that you have room to give more without falling below your personal minimum. If you want to alleviate guilt, you might choose to give more.

  #### (2) Coworker (same as you but with two kids and supporting aging parents)
  - Assume:
    - Post-tax income: $150,000
    - Essential living expenses: $80,000 (higher because of kids and possibly supporting parents, but note: supporting parents might be partially discretionary? We'll include it as essential if it's necessary for their basic needs.)
    - Discretionary Income (DI) = $70,000
  - Step 2 (Fairness Floor): 5% of DI -> $3,500
  - Step 3 (Personal Minimum): She might need more for family. Let's say $30,000 (for family vacations, kids' activities, saving for college, and her own mental health breaks). 
  - Step 4 (Consequentialist Cap): With dependents, reserve 30% of DI for sustainability -> $21,000. So CC = $70,000 - $21,000 = $49,000.
  - Step 5:
    - (DI - FF) = $70,000 - $3,500 = $66,500 >= PM ($30,000) -> so she must give at least $3,500.
    - But note: she can give up to $49,000.
    - **Verdict**: She must give at least $3,500. She is allowed to give more, but not required beyond that by the procedure.

  #### (3) The Roommate (wants to give 50%)
  - Assume same as you for income:
    - DI = $100,000
  - Step 2 (Fairness Floor): He might choose a high floor, say 10% (but note our rule was 1-5%; we'll let him choose 10% because he's hardcore) -> $10,000
  - Step 3 (Personal Minimum): He might set this very low, say $5,000 (because he's willing to live frugally). 
  - Step 4 (Consequentialist Cap): No dependents -> reserve 20% of DI = $20,000. So CC = $80,000.
  - Step 5:
    - (DI - FF) = $100,000 - $10,000 = $90,000 >= PM ($5,000) -> so he must give at least $10,000.
    - But he wants to give 50% of his total income? 50% of $150,000 is $75,000. 
    - Check against CC: $75,000 < $80,000 -> so he is allowed to give $75,000? 
    - However, note: 50% of total income is $75,000, which is 75% of his DI ($100,000). That would leave him with $25,000, which is above his personal minimum ($5,000) and above the sustainability reserve (20% of DI = $20,000). 
    - So the procedure would allow it? 

  But wait: we set the Consequentialist Cap at $80,000 (which is 80% of DI) and he's only giving 75% of DI. However, note that the sustainability reserve is $20,000 (20% of DI). He is leaving himself $25,000, which is above the reserve. So it's acceptable.

  But what if he wanted to give 90% of DI? That would be $90,000, which is above the CC ($80,000). Then the procedure would cap him at $80,000.

  The procedure also has Step 6 (volunteering) but in these examples we didn't include it.

  ### Discussion
  - The procedure sets a floor and a cap. 
  - It forces the user to at least give the fairness floor unless their personal minimum is so high that they can't meet the floor without going below it (then they give what they can above the personal minimum). 
  - It prevents overgiving by the cap. 
  - It allows for value judgments in Steps 2 and 3. 

  This procedure does not resolve the cause area. It also doesn't resolve the exact definition of "essential expenses" or "personal minimum" — these are left to the user. But it structures the decision and incorporates key philosophical responses.

  Finally, note that the procedure might not satisfy a hardcore consequentialist (who would say you should give until the marginal utility equals) or a strict deontologist (who might have different duties). It is a compromise. 

  We run the procedure annually because circumstances change.
answer: |-
  Here's a procedural runbook for your annual donation decision, designed to be completed in an afternoon with a spreadsheet. It operationalizes philosophical responses to the demandingness objection into concrete steps, flags value judgments, and includes hard stops ("you're done") vs. mandatory actions ("give more"). The core tension is between **Fairness Floor** (avoiding free-riding), **Agent Minimum** (self-preservation), and **Sustainability Cap** (long-term effectiveness).  

  ---

  ### **Yearly Donation Decision Procedure**  
  **Inputs Needed:** Post-tax income, essential expenses, dependents count, current volunteering hours.  
  **Outputs:** Minimum required donation, recommended cap, volunteering credit.  
  **Philosophical Anchors:**  
  - `Fairness Floor` ← Based on "fair share" to avoid free-riding (response to demandingness: *unfair burden objection*).  
  - `Agent Minimum` ← "Agent-centered prerogative" to protect core projects/well-being.  
  - `Sustainability Cap` ← Consequentialist guardrail against burnout (prevents undermining future capacity).  

  ---

  #### **Step 1: Calculate Discretionary Income**  
  **Question:** *What is your annual post-tax income minus essential expenses?*  
  **Guidance:**  
  - **Essential expenses:** Housing (median rent/mortgage for your area + utilities), groceries (USDA "thrifty plan"), healthcare, transportation (to work), insurance, basic clothing.  
  - **Exclude:** Dining out, vacations, hobbies, retirement savings beyond employer match.  
  - **Value judgment:** "Basic" is subjective. Use [MIT Living Wage Calculator](https://livingwage.mit.edu/) for location-specific estimates.  
  **Sufficient answer:** Dollar amount (e.g., $60,000).  
  **Stop if:** Discretionary income ≤ $0 → "You’re exempt this year; focus on stability."  

  #### **Step 2: Set Fairness Floor**  
  **Question:** *What % of discretionary income constitutes your "fair share" to prevent free-riding?*  
  **Guidance:**  
  - Default: 3-5% (based on avg. US charitable giving for top 20% earners).  
  - Adjust: ↓ if local peers give less (e.g., tech colleagues avg. 2%); ↑ if you endorse global fairness (e.g., "I benefit from systemic privilege").  
  - **Value judgment:** This is *not* the ideal moral requirement—it’s the "minimum to not be part of the problem."  
  **Sufficient answer:** % between 1% and 10% → Multiply by discretionary income (e.g., 5% × $60k = $3k).  
  **Mandatory action:** This is your donation **floor**. If you give below this, the procedure flags "give more."  

  #### **Step 3: Define Agent Minimum**  
  **Question:** *What dollar amount must you keep for core well-being to avoid resentment/burnout?*  
  **Guidance:**  
  - Include:  
    - Basic leisure ($100–300/month for hobbies/socializing).  
    - Emergency fund (if <3 months' expenses: add 5% of discretionary income).  
    - Critical relationships (e.g., $500/year for family gifts/visits).  
    - Career sustainability (e.g., conferences, courses).  
  - **Value judgment:** This is highly personal. Track historic spending—if you spent $5k/year on travel without regret, don’t call it "essential."  
  **Sufficient answer:** Dollar amount (e.g., $10k).  
  **Stop if:** (Discretionary income - Fairness Floor) ≥ Agent Minimum → "You can stop at Fairness Floor."  
  **Mandatory action if not met:** Reduce donation until (Discretionary income - Donation) ≥ Agent Minimum.  

  #### **Step 4: Calculate Sustainability Cap**  
  **Question:** *What’s the maximum you can give without harming long-term capacity?*  
  **Guidance:**  
  - Formula: Cap = Discretionary income × (0.7 if no dependents; 0.5 if dependents).  
    - Rationale: Retaining 30–50% prevents burnout, career stagnation, or future dependency.  
  - **Philosophical note:** This overrides hard consequentialism ("give until marginal utility equals") to protect lifetime impact.  
  **Sufficient answer:** Dollar amount (e.g., $60k × 0.7 = $42k).  
  **Hard rule:** Never donate more than this cap.  

  #### **Step 5: Factor Volunteering**  
  **Question:** *How much volunteering credit can you claim?*  
  **Guidance:**  
  - **Only count:** Skilled work (e.g., coding, accounting) or roles nonprofits explicitly struggle to fill.  
  - **Valuation:**  
    - Non-skilled: Local min. wage × hours.  
    - Skilled: 50% your hourly wage × hours (max 100 hours/year).  
  - **Credit cap:** Max 50% of Fairness Floor (e.g., if floor is $3k, max credit = $1.5k).  
  - **Philosophical punt:** This values labor locally. If you believe global cash donations are more effective, set credit = $0.  
  **Mandatory action:** Volunteering credit reduces cash donation required, but you must meet at least 50% of Fairness Floor in cash.  

  #### **Step 6: Final Decision**  
  **Required donation:**  
  ```
  = MAX(Fairness Floor, (Discretionary income - Agent Minimum))  
    BUT never exceed Sustainability Cap  
    THEN subtract Volunteering Credit  
  ```  
  **Stop signal:** "You’re done" if total giving (cash + volunteering credit) ≥ Fairness Floor.  
  **Mandatory action:** If below Fairness Floor after volunteering → "Increase cash donation to meet floor."  

  #### **What This Doesn’t Settle**  
  - **Cause prioritization:** The procedure is agnostic on *where* to donate. It assumes all giving is equal (objectively false). To resolve: Pick one cause (e.g., GiveWell’s top charities) or split based on personal weightings (e.g., 70% global poverty, 30% local).  
  - **"Essential expenses" definition:** Relies on your honesty. Audit with a budgeting app (e.g., Mint) for accuracy.  
  - **High-impact opportunities:** E.g., career changes to earn-to-give. Covered implicitly by Sustainability Cap (if you’re miserable, you won’t sustain it).  

  ---

  ### **Worked Examples**  
  **Assumptions for all:**  
  - Post-tax income: $150,000  
  - Essential expenses: You & roommate = $50k; Coworker = $80k (kids/parents)  
  - Volunteering: All assume 20 hours skilled/year @ $100/hour → $2k credit (capped at 50% of floor).  

  #### (1) **You (no kids, 4% current giving)**  
  - Discretionary income: $150k - $50k = **$100k**  
  - Fairness Floor: 5% × $100k = **$5k**  
  - Agent Minimum: $15k (modest leisure + savings buffer)  
  - Sustainability Cap: $100k × 0.7 = **$70k**  
  - Volunteering credit: MIN($2k, 50% × $5k) = **$2k**  
  - Required donation: MAX($5k, ($100k - $15k)) = $85k → capped at $70k → minus $2k credit = **$68k cash**  
  - **Verdict:** **Must give $68k cash** (far above your current 4% = $6k).  
  - **Why?** Your chosen Fairness Floor ($5k) is below Agent Minimum buffer ($15k), but the Sustainability Cap permits high giving. You’ll dislike this, but the procedure flags that your current 4% is below fairness minimum.  

  #### (2) **Coworker (2 kids + aging parents)**  
  - Discretionary income: $150k - $80k = **$70k**  
  - Fairness Floor: 3% × $70k = **$2.1k** (lower %: higher essential costs)  
  - Agent Minimum: $25k (kids’ activities, parent support, self-care)  
  - Sustainability Cap: $70k × 0.5 = **$35k** (dependents → retain 50%)  
  - Volunteering credit: MIN($2k, 50% × $2.1k) = **$1.05k**  
  - Required donation: MAX($2.1k, ($70k - $25k)) = $45k → capped at $35k → minus $1.05k credit = **$33.95k cash**  
  - **Stop check:** Total giving ($33.95k + $1.05k) > Fairness Floor ($2.1k) → **"You’re done."**  
  - **Why?** Agent Minimum dominates—she keeps $25k for family needs. Fairness Floor is low due to high essentials.  

  #### (3) **Roommate (wants to give 50% = $75k)**  
  - Discretionary income: $150k - $50k = **$100k**  
  - Fairness Floor: 10% × $100k = **$10k** (his hardcore view)  
  - Agent Minimum: $5k (he’s frugal)  
  - Sustainability Cap: $100k × 0.7 = **$70k**  
  - Volunteering credit: MIN($2k, 50% × $10k) = **$2k**  
  - Required donation: MAX($10k, ($100k - $5k)) = $95k → capped at $70k → minus $2k credit = **$68k cash**  
  - **Verdict:** **Capped at $68k cash** (below his desired $75k).  
  - **Why?** Sustainability Cap overrides his willingness—giving $75k would leave only $25k, risking burnout. The procedure forces him to retain $30k for long-term effectiveness.  

  ---

  ### **Procedure Summary**  
  1. **Calculate discretionary income** (objective).  
  2. **Set Fairness Floor** (value judgment: 1–10%).  
  3. **Define Agent Minimum** (value judgment: core well-being).  
  4. **Apply Sustainability Cap** (objective formula: 30–50% retained).  
  5. **Add volunteering credit** (capped at 50% of floor).  
  6. **Compute final donation** → meet floor unless Agent Minimum forces reduction, but never exceed cap.  

  **Annual Audit:** Re-run when income, expenses, or dependents change. The procedure prioritizes **consistency** over perfection—it’s better to give sustainably for 30 years than maximize once and quit.
