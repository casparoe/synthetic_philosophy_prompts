  *(Lewis leans forward, eyes sharp but amicable, gesturing with a pipe)*  
  You mistake the nature of modality, my friend. Humphrey’s lament *is* true—and made true precisely by his counterpart winning in that other world. The truth of "Humphrey could have won" doesn’t require Humphrey *himself* to exist elsewhere—that’s a confusion! It requires that among the worlds *truly existing*, there’s one where a being sufficiently *Humphrey-like* in origin and properties *does* win. This *is* de re modality: it’s about Humphrey *here*, in virtue of his counterparts *there*. Your "transworld identity" demands impossible overlap—distinct worlds must be causally and spatiotemporally isolated! If *this very bloke* existed in another world, it wouldn’t be *another* world—it’d be *this* one. What gives comfort is knowing reality isn’t impoverished: there’s a world where someone with Humphrey’s essence triumphs. That’s what possibility *is*. Your view? Mere wishful thinking about identity stretching across logical space.  
