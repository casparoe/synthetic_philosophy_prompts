prompt: |-
  A friend of mine has gone pretty deep into Fomenko's New Chronology (the idea that ancient history is mostly phantom copies of medieval history, shifted back by centuries, no conspiracy needed — just everyone copying everyone else). I keep telling him its basically zero and he keeps saying I can't put a number on it since I haven't checked the manuscripts myself. Fine — put a number on it. What's your credence that Fomenko's core claim is true, meaning specifically that at least one major event conventionally dated before 500 AD is actually off by more than a thousand years? Decompose it: the probability that the main independent dating methods (radiocarbon, tree rings, eclipse retrocalculation, stratigraphy, cross-checks against Chinese records and so on) are all circular or contaminated enough to hide an error that big, the probability that recorded ancient eclipses like the ones in Thucydides were back-calculated and inserted into the text later rather than actually observed, the probability that a compression of history on that scale could happen without leaving traceable contradictions somewhere in the sources, and any other terms you think belong. Then tell me which term is doing the most work in your final number, and what evidence would actually move it.
reasoning: |-
  Okay, let me approach this systematically. The user wants a quantified credence assessment of Fomenko's New Chronology core claim, specifically that at least one major pre-500AD event is misdated by over 1000 years. They requested decomposition into key probabilistic components and identification of the most influential term.

  First, I need to establish reasonable prior probabilities for each critical dependency in Fomenko's thesis. The core claim relies on three improbable foundations: (1) all independent dating methods failing catastrophically yet consistently, (2) ancient astronomical records being systematically forged, and (3) historical compression occurring without generating detectable contradictions across disciplines.

  For the dating methods, I consider radiocarbon dating's multiproxy calibration via dendrochronology. The probability that tree-ring sequences across hemispheres and species (oak/pine/sequoia) all contain identical millennium-scale errors seems astronomically low. Similarly, the odds that Chinese eclipse records - independently maintained and verifiable via celestial mechanics - would perfectly align with forged Mediterranean records by coincidence are negligible. I'll assign conservative estimates of 10^-6 and 10^-9 respectively for these failures.

  Regarding astronomical forgeries, Thucydides' eclipse during the Peloponnesian War presents a critical test case. The probability that medieval forgers could accurately calculate and insert solar eclipses visible only in specific Greek locations - without telescopes or modern ephemerides - while perfectly mimicking Classical Greek linguistic styles seems implausible. Modern textual scholarship confirms these passages show no signs of later interpolation.

  The historical compression aspect faces even greater challenges. The simultaneous disappearance/reappearance of artifact types across Egypt, Mesopotamia, and China would require impossible coordination. For example, the abrupt cessation of Roman imperial coinage in 5th century Britain followed by identical 11th century Byzantine coins in England defies material evidence. Probability here drops to perhaps 10^-15.

  Multiplying these conservative estimates (10^-6 * 10^-9 * 10^-15) already yields 10^-30, but since the claim requires only one real misdating, I'll adjust upward to 10^-15 as an extremely generous upper bound. The dominant term remains the historical compression paradox - no known mechanism allows global rewrites of material culture without leaving forensic traces.

  What could shift this? If core samples from Egyptian pyramids contained medieval pollens, or if astronomical clay tablets showed telescope-era star positions, that might force reconsideration. But currently, such evidence doesn't exist. The final credence stays below one in a quadrillion - effectively zero for any practical purpose.
answer: |-
  Here's a decomposed credence assessment for Fomenko's core claim, focusing specifically on the probability that **at least one major event conventionally dated before 500 AD is actually off by more than a thousand years** due to phantom copying/chronological errors. I'll use conservative estimates favoring skepticism about established history, then explain the dominant term and evidence that could shift it.

  **Final Credence:** **≤ 10⁻¹⁵ (0.0000000000001%)**. Effectively zero for any practical purpose. Below is the decomposition.

  ---

  ### Core Claim Decomposition
  1.  **Probability that all independent dating methods are catastrophically wrong *and* conceal >1000-year errors:**  
      *   **Radiocarbon Dating:** Calibrated via dendrochronology (tree rings) back >14,000 years. Requires global tree-ring sequences (oak, pine, sequoia across continents) to be misaligned by >1000 years *and* independently corroborated radiocarbon plateaus to be misinterpreted *and* marine/varve/ice-core tie-ins to fail. **P = 10⁻⁶** (1 in 1,000,000).
      *   **Astronomical Dating (Eclipses/Planetary Records):** Requires records (e.g., Thucydides' eclipse, Babylonian Venus tablets, Chinese eclipse lists) to be medieval forgeries *or* misidentified. Retrocalculations are precise and rely on immutable celestial mechanics. **P = 10⁻⁵** (1 in 100,000).
      *   **Stratigraphy & Archaeology:** Requires layers with coins/artifacts of known dates (e.g., Roman coins in Britain) to be misdated by >1000 years *and* thermoluminescence/OSL dating to fail *and* pollen/ice-core chronologies to be invalid. **P = 10⁻⁷** (1 in 10,000,000).
      *   **Cross-Cultural Synchronisms:** Requires Chinese/Korean/Japanese chronicles, Maya Long Count calendar, and Roman/Byzantine/Persian records to *all* contain identical >1000-year errors without detectable contradictions (e.g., Chinese records of Roman embassies align with Western dates). **P = 10⁻⁶** (1 in 1,000,000).  
      **Joint P(all dating methods fail) ≈ 10⁻⁶ × 10⁻⁵ × 10⁻⁷ × 10⁻⁶ = 10⁻²⁴**.

  2.  **Probability that ancient astronomical records were back-calculated/forged:**  
      *   Requires medieval scholars to:  
          - Correctly compute eclipse paths/planetary positions without telescopes or ephemerides.  
          - Perfectly mimic archaic language/styles (e.g., Thucydides' Greek).  
          - Insert forgeries into manuscripts *without* leaving physical/trace evidence (e.g., ink composition, parchment age).  
      *   **Example:** Thucydides' 431 BC eclipse was visible *only* in a narrow path over Greece. A forger would need impossible astronomical knowledge to fake this. **P = 10⁻⁸** (1 in 100,000,000).

  3.  **Probability of no detectable contradictions in sources/material culture:**  
      *   Requires:  
          - **Artifact Continuity:** Technologies/styles (e.g., Roman concrete, Greek black-figure pottery) to disappear then identically reappear after 1000 years with no evolution.  
          - **Biological Evidence:** Mummified remains, seeds, or textiles dated via multiple methods to agree falsely (e.g., Egyptian mummies "shifted" from 1000 BC to 1000 AD would have anachronistic pollen/insects).  
          - **Linguistic Evolution:** Languages (e.g., Latin → Romance) evolving identical changes in compressed time.  
      *   **P = 10⁻¹²** (1 in 1,000,000,000,000) given the volume of cross-verified evidence.

  4.  **Probability of motive/mechanism for global error:**  
      *   Requires unintentional error propagation across all Eurasian cultures *and* the Islamic world *and* the Americas (Maya calendar) simultaneously. **P = 10⁻³** (1 in 1,000) – most plausible term, but still speculative.

  ---

  ### Final Calculation
  - **Joint Probability (Core Claim True):**  
    P = P(dating fails) × P(forgeries) × P(no contradictions) × P(mechanism)  
    ≈ 10⁻²⁴ × 10⁻⁸ × 10⁻¹² × 10⁻³ = **10⁻⁴⁷**  
  - **Adjustment for "at least one major event":** This is overly harsh. If we generously assume 100 independent events could *plausibly* be misdated (e.g., Fall of Troy, Caesar's assassination), the probability becomes **100 × 10⁻⁴⁷ ≈ 10⁻⁴⁵**.  
  - **Conservative Upper Bound:** Even allowing for unknown unknowns, **P ≤ 10⁻¹⁵** is defensible (e.g., if dating methods share one critical flaw).

  ---

  ### Dominant Term
  **P(no detectable contradictions in sources/material culture) ≈ 10⁻¹²**  
  This term dominates because:  
  - Material evidence is **multivariate and redundant**. Coins in stratified layers, radiocarbon-dated artifacts, and cross-cultural trade goods (e.g., Chinese silk in Roman tombs) form an interlocking system.  
  - A >1000-year shift would require:  
    - Egyptian New Kingdom artifacts (e.g., Tutankhamun's gold) to appear in medieval layers without contamination.  
    - Roman concrete technology to vanish for 10 centuries then re-emerge identically.  
    - Ice cores from Greenland/Antarctica to have identical volcanic signatures at "shifted" dates.  
  - No mechanism explains how pottery styles, shipbuilding, or metallurgy could "freeze" for a millennium.

  ---

  ### Evidence That Could Move the Needle
  To significantly increase credence (e.g., to 1% or higher), you'd need:  
  1. **Smoking-Gun Contradiction in Dating Methods:**  
     - E.g., a sealed Roman tomb with coins of Emperor Honorius (5th c. AD) containing textiles radiocarbon-dated to 1400 AD *and* pollen from medieval European plants.  
     - Or a solar eclipse recorded in China in 200 AD that retrocalculation proves *only* occurred in 1200 AD.  

  2. **Proof of Forgery:**  
     - Carbon-dating ink/parchment of Thucydides' manuscript to the 14th century *and* linguistic analysis showing later Greek.  

  3. **Inconsistency in Ice-Core/Tree-Ring Data:**  
     - A major volcanic eruption (e.g., Thera/Santorini) dated to 1600 BC in Mediterranean archaeology but 600 AD in ice cores.  

  4. **Viable Mechanism:**  
     - Mathematical proof that calendar systems *must* duplicate events over 1000-year gaps (Fomenko's algorithms fail when tested objectively).  

  ---

  ### Conclusion
  **Credence: ≤ 10⁻¹⁵** – comparable to the probability of tossing a coin and getting heads 50 times in a row. The near-impossibility arises from **cumulative redundancy**: each independent dating method, cross-cultural record, and archaeological layer acts as a failsafe. While isolated errors exist (e.g., contested eclipses), a >1000-year shift in *any* major event would violate so many lines of evidence simultaneously that it becomes implausible beyond rational consideration. Your friend's "check the manuscripts" argument ignores that chronology doesn't rely on scribal copies alone—it's anchored by physics, astronomy, and cross-cultural materialism.
