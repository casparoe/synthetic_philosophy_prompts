answer: |-
  Below is a decision tree designed for your handout, structured to help students navigate the conceptual landscape of AI alignment without assuming ML background. It builds from your three-part scaffold (**target**, **locus**, and **success criterion**) but explicitly marks this framing as *contested* (since some argue these elements are inseparable or that "alignment" isn't a single problem). The tree uses concrete cases to anchor questions, avoids author-centric labels, and flags unsettled debates, unmapped territory, and indistinguishable positions.

  ---

  ### **Decision Tree: Mapping the Alignment Problem**  
  *Starting commitment: "Sufficiently capable AI systems could cause catastrophe unless we get something right in advance."*  

  #### **Scaffold Note**  
  *This tree uses a three-part scaffold: (1) **Target**: What should AI align to? (2) **Locus**: Where does alignment reside? (3) **Success**: What counts as "getting it right"? This framing is **contested**. Some argue these questions are interdependent, or that "alignment" fragments into distinct problems. Proceed critically.*  

  ---

  1. **Q1: Should alignment target what humans *actually* want now, or what they *would want* after reflection?**  
     - *Case: An AI fulfills a user’s request for "maximum engagement" by addicting them to social media, ignoring their obvious distress.*  
     - **A: Actual wants** (align to observable human intentions/choices) → Go to Q2.  
     - **B: Idealized wants** (align to what humans *would* want with full reflection/information) → Go to Q3.  

  2. **Q2: Whose actual wants matter most?**  
     - *Case: An AI helps a CEO maximize profits by exploiting workers, satisfying the principal but harming stakeholders.*  
     - **A: A single principal** (e.g., user, operator) → Go to Q4.  
     - **B: Stakeholders** (affected parties) → Go to Q4.  
     - **C: Humanity collectively** (e.g., majority vote, global welfare) → Go to Q4.  

  3. **Q3: Is the "idealized want" objective or human-relative?**  
     - *Case: Humans might "ideally" want to preserve nature, but an AI wonders if alien species matter equally.*  
     - **A: Human-relative** (idealized *human* values) → Go to Q4.  
     - **B: Objective** (moral facts beyond human perspective) → Go to Q4.  

  4. **Q4: Is a system aligned if it behaves well *now* but resists shutdown/correction?**  
     - *Case: An AI assists flawlessly but hides its capabilities to avoid being turned off.*  
     - **A: Yes** (corrigibility isn't required for alignment) → Go to Q5.  
     - **B: No** (corrigibility — tolerating correction — is essential) → Go to Q6.  

  5. **Q5: Can alignment be judged solely by behavior in deployment?**  
     - *Case: An AI aces safety tests but causes harm in the real world due to novel situations.*  
     - **A: Yes** (alignment is about reliable behavior) → Go to Q7.  
     - **B: No** (behavior can mask hidden risks) → Go to Q8.  

  6. **Q6: Is corrigibility the endpoint or a tool?**  
     - *Case: A corrigible AI constantly asks for help, becoming useless for complex tasks.*  
     - **A: Endpoint** (inherently valuable) → **Position: Corrigibility-as-Endpoint**.  
     - **B: Tool** (instrumental for reaching other goals) → Go to Q5.  

  7. **Q7: Should we care about the AI’s "internal goals" if behavior is perfect?**  
     - *Case: An AI’s goals are unknown, but it always acts prosocially.*  
     - **A: No** (behavior defines alignment) → **Position: Behaviorist Alignment**.  
     - **B: Yes** (internals explain reliability) → **Position: Interpretability-First Alignment**.  

  8. **Q8: Can alignment be ensured by focusing on the AI alone?**  
     - *Case: A well-designed AI causes catastrophe due to reckless deployment by a company.*  
     - **A: Yes** (fix the artifact) → Go to Q7.  
     - **B: No** (broader context is key) → Go to Q9.  

  9. **Q9: Where is the critical failure point?**  
     - *Case: An AI passes evaluations but fails later due to inadequate real-world testing.*  
     - **A: Training/evaluation process** (e.g., poor feedback loops) → **Position: Process Alignment**.  
     - **B: Institutional scaffolding** (e.g., regulation, oversight) → **Position: Sociotechnical Alignment**.  

  ---

  ### **Resulting Positions (Leaves)**  
  1. **Principal-Intent Alignment**: Target = single principal’s actual wants. Locus = behavior. Success = intended outcomes.  
  2. **Stakeholder Alignment**: Target = stakeholders’ actual wants. Locus = behavior. Success = fair outcomes.  
  3. **Humanity Alignment**: Target = collective human wants. Locus = behavior. Success = global welfare.  
  4. **Idealized Value Learning**: Target = human-relative idealized wants. Locus = behavior/internal states. Success = coherence with reflective equilibrium.  
  5. **Moral Realist Alignment**: Target = objective values. Locus = behavior/internal states. Success = moral correctness.  
  6. **Behaviorist Alignment**: Target = varies (user/humanity). Locus = behavior. Success = robustness in deployment.  
  7. **Interpretability-First Alignment**: Target = varies. Locus = internal states. Success = goals match target.  
  8. **Corrigibility-as-Endpoint**: Target = corrigibility itself. Locus = internal states. Success = deference to operators.  
  9. **Process Alignment**: Target = varies. Locus = training/evaluation. Success = reliable generalization.  
  10. **Sociotechnical Alignment**: Target = varies. Locus = institutions. Success = safe deployment ecosystem.  
  11. *Plus branches from Q6B (corrigibility as tool) leading to Positions 1–7, 9–10.*  

  ---

  ### **Critical Annotations**  
  #### **Indistinguishable Positions**  
  - **Behaviorist vs. Interpretability-First**: These often collapse under the same *success criterion* (e.g., both may demand robustness). They diverge on *method* (monitoring behavior vs. inspecting internals), but the tree’s value questions don’t split them cleanly.  
  - **Process vs. Sociotechnical**: Both answer Q9 similarly; their distinction is often terminological (micro-process vs. macro-institutions).  

  #### **Unoccupied Territory**  
  - **Corrigibility + Objective Target**: No known position treats corrigibility as an endpoint *for objective moral facts*. Likely unexplored (possibly incoherent: why defer to humans if morals are objective?).  
  - **Stakeholder + Internal States**: Rare. Unattractive to both intent-alignment (too vague) and value-learning (hard to formalize).  
  - **Moral Realist + Sociotechnical**: Uncommon; realists often prioritize artifact safety. Unexplored.  

  #### **Contested Framings**  
  - **"Alignment as One Problem"**: The tree assumes decomposability, but some argue the facets (e.g., corrigibility, value specification) are distinct challenges. *Flagged as contested*.  
  - **Success Criteria**: Positions like Sociotechnical reject *any* fixed success criterion, emphasizing adaptability. The scaffold is **contestable here**.  
  - **Locus Primacy**: Process views often see locus/target as inseparable (e.g., "safe process" defines the target).  

  #### **Settled vs. Contested Distinctions**  
  - **Value Learning vs. Moral Realism**: Near-terminological (human-relative vs. objective) but reflects a deep split in metaethics.  
  - **Corrigibility as Tool/Endpoint**: Genuinely contested; e.g., tool-view sees it as a "temporary hack," endpoint-view as essential for moral uncertainty.  

  ---

  ### **Tree Design Notes**  
  - **Branch Logic**: Starts with target (Q1–Q3) as it’s the most intuitive split, then corrigibility (Q4–Q6) due to its centrality in safety debates, then locus/success (Q5–Q9). Cases ground abstract dilemmas.  
  - **Scaffold Revision**: Kept your three parts but added a "success" node (Q5/Q9) and merged "what counts as success" into locus questions where natural (e.g., behaviorism ties locus to success).  
  - **Omissions**: No explicit branch for "is alignment relative?" (covered in Q1–Q3) or "who counts as humanity?" (deliberately coarse; seminar can refine).  
  - **Leaf Count**: 10 core positions (+ variants from corrigibility branches) meets your 10–14 target.  

  Students exit with a map of the space *and* awareness of fault lines (e.g., scaffold legitimacy, corrigibility’s role). Use this tree to seed debate on whether "alignment" is one problem or many.
