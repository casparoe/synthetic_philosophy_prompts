  The user wants me to argue against their deflationary view. So I need to emphasize that for a substantivalist, the identity of points matters. Even if two metrics are related by a diffeomorphism, if points are individuals, then assigning different properties to them creates distinct physical scenarios. Cauchy surfaces can't determine which point has which metric properties inside the hole, leading to indeterminism.

