answer: |-
  Here's a thought experiment meeting your specifications:

  **Scenario:** Alex is a skilled software engineer and community organizer in a struggling neighborhood. Years ago, they made a sincere, open-ended promise to their neighbors to "always be there to help fix things." Alex successfully organized local tech literacy classes, set up a neighborhood watch app, and mentored local youth. However, the neighborhood's deep-seated problems (systemic poverty, underfunded schools, lack of jobs) persist and manifest in constant, urgent crises: the app needs constant maintenance and bug fixes due to user errors and outdated donated phones; the youth mentorship requires near-daily intervention to resolve conflicts or help with complex homework Alex isn't fully qualified for; neighbors constantly ask Alex for tech support, troubleshooting, and minor website fixes for personal needs (job applications, benefits forms). Alex spends 30+ hours weekly on this reactive maintenance, leaving them exhausted and unable to focus on their demanding full-time job, which involves developing critical security software. A prestigious non-profit offers Alex a role developing an open-source platform automating many basic tasks Alex currently handles manually for their neighbors (e.g., simplified job application portals, automated tutoring chatbots, robust community apps requiring minimal maintenance). This role pays well and would impact *millions* in similar underserved communities globally, but requires relocation and significant focus, making sustained local involvement impossible. Alex feels a deep sense of loyalty and obligation to their specific neighbors who rely on them personally.

  **Analysis:**

  1.  **Act Consequentialism Says:** Alex should take the non-profit job. *Why?* The welfare math heavily favors it:
      *   **Local Impact Stagnant:** Alex's local efforts are reactive, inefficient (manual fixes, constant troubleshooting), and address symptoms, not root causes. The hours spent yield diminishing returns for the same small group.
      *   **Global Impact Potential:** The new role leverages Alex's core expertise to create scalable, sustainable solutions. Automating basic tasks frees up *millions* of potential "Alex-hours" globally. The impact per hour invested is orders of magnitude higher.
      *   **Agent Welfare:** Alex's exhaustion hinders effectiveness in both community work and their paid job (which also has positive impact). The new role offers better work-life balance, allowing sustained, high-impact contribution.
      *   **The "Walking Away" is Justified:** The consequentialist isn't "lazy"; they redirect effort from low-leverage, high-cost activities to high-leverage, scalable impact with tangible, vastly greater welfare gains. The "real good elsewhere" is demonstrably larger and more sustainable.

  2.  **Duty/Common-Sense Morality Says:** Alex must stay and honor their promise/loyalty. *Why?*
      *   **Promise-Keeping:** Alex made an open-ended commitment ("always be there"). Walking away feels like breaking that promise to the specific people who relied on it.
      *   **Loyalty & Relationships:** Alex has built deep personal relationships and trust. Neighbors depend on *Alex personally*, not just abstract help. Abandoning them violates duties of loyalty, reciprocity, and care owed to these specific individuals.
      *   **Proximity & Responsibility:** The neighbors' needs are immediate, concrete, and Alex is directly involved. Common-sense morality often prioritizes "the devil you know" – the tangible needs of those close over abstract potential good for distant strangers.
      *   **The Demandingness:** This view demands Alex remain trapped in an endless cycle of reactive, inefficient labor. No matter how much time Alex invests, new crises emerge *because* the underlying problems remain unsolved and the *personal* dependence grows. There's no natural endpoint ("until the world's problems are solved" becomes "until *these specific neighbors* have no more problems," which is unattainable locally). Alex's well-being and potential for broader impact are sacrificed indefinitely.

  3.  **The Single Feature Doing All the Work:** **The irreversible personal investment creating escalating, personalized dependence.** Alex's initial success and dedication fostered deep *personal* reliance. Neighbors don't just need the *functions* Alex provides (tech support, mediation); they need *Alex specifically* to provide them. This dependence escalates because the local solutions aren't systemic or self-sustaining; they require Alex's constant personal intervention. This feature turns the initial virtue (loyalty, promise-keeping) into an engine of perpetual, inefficient demand.

  4.  **Effect of Deleting That Feature:** If Alex's efforts had built *self-sustaining* systems (e.g., truly robust apps, trained local volunteers who took over, systemic changes) so neighbors no longer relied *personally* on Alex for constant maintenance, the duty-based demand largely vanishes. Alex could leave knowing the core promise (helping fix things) was fulfilled by creating lasting capacity. The consequentialist calculation might still favor the global role, but the duty-based objection to leaving would be weak ("I set it up successfully, now others run it"). It's the *irreversible personal dependence* that makes the duty path relentlessly demanding.

  5.  **Duty Defender's Attack (Not Biting the Bullet):** A defender of the duty view would likely attack the **predictability and certainty of the alleged greater global impact.**
      *   **Skepticism of Scale:** They'd argue the promised global impact is speculative. The non-profit's project might fail, or the tools might not be adopted effectively. The claimed "millions impacted" is a probabilistic forecast, not a guarantee.
      *   **Certainty of Local Harm:** In contrast, the harm caused by Alex leaving is immediate, tangible, and certain: specific neighbors *will* lose vital support they depend on *right now*. Mrs. Jones *will* miss her benefits deadline without Alex's help; the youth group *will* dissolve without Alex's mediation.
      *   **Value of Personal Bonds:** They'd emphasize the intrinsic moral value of keeping personal promises and maintaining deep, trusting relationships within a community. This value isn't fungible; it can't be traded for abstract statistical lives saved elsewhere. Abandoning these bonds causes a distinct kind of moral harm – betrayal – that isn't offset by potential future gains.
      *   **Ignoring Local Ripple Effects:** Leaving might destabilize the fragile local ecosystem Alex helped create. The collapse of the mentorship or watch app could have negative knock-on effects the global calculus ignores. The duty is to *this* community Alex is embedded in.

  **Regarding the Baseline:** You're right. Demandingness is inherently relative. The classic objection implicitly uses **common-sense expectations of permissible self-interest and partiality** (spending on hobbies, family, moderate comforts) as the baseline. Consequentialism demanding near-monasticism seems "excessive" *relative to that*. In this flipped case, the baseline is the **agent's capacity for broader impact and sustainable contribution**. The duty-based demand for perpetual, inefficient local intervention seems "excessive" *relative to the agent's potential to do vastly more good elsewhere while living a sustainable life*. The baseline shifts depending on which moral framework's *starting assumptions* (agent neutrality vs. agent-centered permissions/obligations) you adopt. The objection highlights a tension between these starting points.

  \answer{Irreversible personal investment creating escalating personalized dependence}
