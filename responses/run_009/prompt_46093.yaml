prompt: |-
  I'm taking a module this term called Ethical Theory, and we've just hit the moral testimony thing (the "should you just take someone's word for what's right?" debate), and I've been keeping a list of my actual gut reactions to cases so I can figure out where I stand for my essay. The problem is my gut seems to disagree with itself. Here's roughly the list:

  - My flatmate tells me that a joke I made at the pub on Friday actually really upset our friend Dan, and that it was a nasty thing to say. I hadn't clocked it at all, but I trust her read of Dan completely, so I accept it and apologise. Feels totally fine.
  - Dan himself tells me later that I should have known the joke would land badly, given what was going on in his life. Even though I don't think I could have known, I accept his moral verdict on the situation. Also fine? Though slightly less fine, somehow.
  - I read a memoir where the author says the way her parents raised her was wrong, in ways I can kind of see but couldn't articulate or defend. I come away believing her. This one bugs me — it feels like I'm carrying around a belief I didn't earn.
  - A vegan friend, who I know has looked into it properly, tells me factory farming is seriously wrong. I don't really work through the arguments myself, I just take his word and change my diet. Weirdly this feels MORE acceptable than the memoir one, even though the stakes are way higher and I understand even less of what's going on.
  - Same flatmate as the joke case — whose judgement I trust more than my own on anything personal — tells me my girlfriend treats me badly and I should end it. I honestly can't see it myself. If I broke up with her purely on her word, that feels like the worst one on this list, even though I'd be deferring to the person I trust most.
  - In seminar someone asks what I think of utilitarianism and I say "yeah, I'm with what Kieran said" without being able to add anything. Embarrassing, but I can't tell whether it's an actual moral/epistemic failure or just cringe.

  My tentative principle was something like: moral testimony is fine for filling in the details but not for the big verdicts. But that doesn't survive contact with the list — the factory farming one is a big verdict and I'm fine with it, while the joke one is a detail and the Dan follow-up one niggles at me. And I have a feeling "how much I understand" is doing work I can't pin down, because I understood plenty about my girlfriend's situation and still think deferring is bad.

  So: is there a single principle that gets these verdicts, or close? I want you to actually commit to one — state it properly, say which case forces which clause, and if it can't save one of my verdicts, tell me which one to give up and why it was wrong anyway. And then tell me what your principle says about a case I haven't decided on: at the last general election I basically took my politically-obsessed friend's word that a certain policy was unjust, and voted on that basis — on your principle was that fine, and is the answer different if I'd been voting on something I half-understood and just let her tie-break? Don't give me a survey of the options — pick a position and defend it, and say up front if you think one of my verdicts is just mistaken.
reasoning: |-
  Okay, let me tackle this user's problem. They're studying Ethical Theory and struggling with moral testimony—when it's okay to accept someone else's moral judgment. Their list of cases shows conflicting gut reactions, and their tentative principle doesn't hold up. I need to find a unified principle that explains all their reactions or tells them which verdict to drop.

  First, I'll look at each case. The joke scenario with the flatmate feels fine because the flatmate has situational knowledge the user lacks. Dan's follow-up niggles because it’s a blame judgment, which feels different. The memoir case bothers them because they accept a verdict without understanding the reasons, making it feel unearned. The vegan friend’s advice is acceptable even though the stakes are high—why? Probably because the friend has expertise. The girlfriend case feels wrong to defer despite trusting the flatmate. And the seminar reply is embarrassing but maybe not a moral failure.

  The user’s initial principle (details vs. big verdicts) fails because factory farming is a big verdict they accept, while Dan's blame is a detail that niggles. Understanding seems important, but in the girlfriend case, they understand the situation yet won’t defer. So maybe the key is the type of judgment and the source's expertise.

  I recall Hopkins' view on moral testimony: deferring is problematic because moral judgment requires understanding reasons. But in the factory farming case, the user defers to expertise, which feels okay. That suggests expertise matters. Also, blame judgments involve personal relationships, so deferring there might undermine the relationship, like in the Dan and girlfriend cases.

  So my principle: Deferring is permissible when the testifier has relevant expertise or access that you lack, but impermissible when it’s about blaming you or involves undermining personal relationships. Also, understanding reasons is crucial for genuine moral belief, but deferring can be practical when expertise is involved.

  Applying this: The flatmate in the joke case has situational knowledge (expertise), so deferring is okay. Dan’s blame is impermissible because accepting blame without understanding undermines moral agency. The memoir lacks reasons, so it feels unearned—deferring isn't ideal. The vegan friend has expertise, so it's permissible. The girlfriend case is impermissible because personal relationships require firsthand judgment. The seminar reply is cringey but not a moral failure since it's not a deep commitment.

  For the voting case: Taking a friend’s word on policy is okay if they have expertise, but if it’s a tie-breaker on something half-understood, it’s practical but not ideal for forming genuine belief.

  Now, which verdict to drop? The memoir case feeling bugged is correct—accepting without reasons is epistemically problematic. The user should accept that deferring there isn’t ideal.

  So the final principle combines expertise, type of judgment, and the need for understanding where possible. This explains all cases and gives clear guidance on the voting scenario.
answer: |-
  Here's a single, defensible principle that captures your intuitions while forcing one revision to your list. I'll commit to this position:

  **The Principle:**  
  *Deferring to moral testimony is permissible when the testifier possesses relevant expertise or access to facts that you lack, AND the testimony does not demand a response that bypasses your core moral agency (e.g., accepting blame or making a deeply personal relational decision solely on another's authority). However, such deference is epistemically deficient (it doesn't yield "earned" understanding) when you lack the capacity to grasp the justifying reasons, even if practically necessary.*

  ### How it explains your list:
  1.  **Flatmate re: Joke:** **Permissible & Unexceptional.** Your flatmate has *epistemic access* you lack (observing Dan's reaction, knowing his context). The verdict ("it was nasty") is about *interpretation of a social fact*. It doesn't demand you accept fundamental blame *solely* on her word – you can reflect on the act itself once pointed out. Expertise: High (social awareness).
  2.  **Dan re: Should Have Known:** **Impermissible (You Should Resist).** Dan claims you *should have known*. This is a verdict on *your moral competence/responsibility*. Accepting this purely on his testimony bypasses your core agency in evaluating your own culpability. While his hurt is factual (access you lacked), the *blame verdict* must involve your own judgment. Expertise: High on his feelings, but *not* on your culpability.
  3.  **Memoir re: Parenting:** **Epistemically Deficient (Feels Unearned - Correctly).** The author has *epistemic access* (lived experience) you lack, making deference *pragmatically reasonable*. However, you *cannot grasp or articulate* the justifying reasons ("ways I can kind of see but couldn't articulate or defend"). Deference gives belief, but not understanding. It feels "unearned" *because it is epistemically deficient*. Expertise: High (lived experience), but understanding inaccessible.
  4.  **Vegan Friend re: Factory Farming:** **Permissible (Despite Stakes) but Epistemically Deficient.** Your friend has *expertise* (deep research) you lack. The stakes make deference *pragmatically vital* (preventing harm). It feels *more* acceptable than the memoir because the expertise is clearer and the motivation is urgent prevention, not just belief. However, since you "understand even less," it's still *epistemically deficient*. The practical acceptability overrides the epistemic lack due to stakes/expertise. Expertise: High (researched).
  5.  **Flatmate re: Girlfriend:** **Impermissible.** While your flatmate has high *expertise* (knows you both, trusted judgment) and *epistemic access* (observing dynamics), the demand is a *core relational decision* impacting your fundamental agency ("end it"). Deferring *completely* bypasses your own perception and judgment within *your own* intimate relationship. Expertise isn't enough here; this decision requires your own moral engagement. **This is the verdict you should give up.** Your gut feels it's worst because the stakes are deeply personal, but the principle says the *reason* it's impermissible is the *type* of demand (core agency), not the stakes or trust alone. If you investigated *based* on her testimony and concluded she was right, *that* would be permissible. Blind deference isn't.
  6.  **Seminar re: Utilitarianism:** **Not a Moral Failure, Just Epistemically Cringe.** You lack *expertise* (Kieran presumably articulated it better). Deferring is a practical shortcut in discussion. It doesn't demand a *core agency* response (like breaking up) or *accept blame*. It's epistemically lazy/cringe, but not a *moral* failing. You haven't abdicated deep responsibility.

  ### The Revision & Why:
  Your gut reaction to **Case 5 (Girlfriend)** is **overly strict**. If you genuinely trust your flatmate *more than your own judgment on personal matters* (as stated), and she identifies harmful treatment you're blind to (e.g., emotional manipulation you rationalize), *investigating based on her testimony is crucial*. Blindly breaking up *is* problematic as it bypasses agency, but dismissing her testimony *entirely* because "I can't see it" risks enabling harm. The principle allows using testimony as a vital prompt for your *own* re-evaluation, even leading to agreement. Your gut treats it as absolutely impermissible to act on; the principle says blind deference is impermissible, but testimony can be decisive *after* engaging your own agency prompted by it.

  ### Your Voting Case:
  1.  **Taking friend's word on policy being unjust:** **Permissible & Epistemically Deficient.** Your friend has *expertise* ("politically-obsessed," presumably well-informed on policy impacts, ethical arguments). You lack this access/research time. Voting based on trusted expertise on complex issues is a practical necessity in a democracy. It's *epistemically deficient* if you couldn't explain *why* it's unjust, but permissible given the stakes of voting and reliance on legitimate expertise. Similar to factory farming.
  2.  **Friend as tie-breaker on something half-understood:** **Still Permissible, Less Deficient.** You've done *some* work (half-understood). Using testimony to resolve uncertainty leverages expertise appropriately. It's *less epistemically deficient* than the first scenario because you have partial grasp of the reasons. It's a reasonable way to handle marginal cases.

  ### Why this Principle Works
  *   **Saves Expertise/Access:** Explains why the vegan friend (expertise) and initial flatmate (access) are acceptable sources.
  *   **Saves the "Unearned" Feeling:** Explains the memoir case (inaccessible reasons) and the epistemic lack in factory farming/voting.
  *   **Handles the Blame/Relationship Core:** Explains the problem with Dan's "should have known" (blame agency) and the girlfriend case (relational agency).
  *   **Demotes Stakes as Primary:** Explains why high stakes (factory farming, voting) don't *prohibit* deference – expertise and practicality matter more. Low stakes (seminar) don't make laziness *moral*.
  *   **Acknowledges a Trade-off:** Permissible deference often comes with epistemic deficiency. We accept this trade-off when expertise/access/stakes demand it, *except* when core agency is threatened.

  **In short:** Trust expertise on facts and complex judgments, but never outsource the responsibility for your own blameworthiness or your deepest personal commitments. And accept that sometimes, believing the expert means believing *without* fully understanding – that's the price of navigating a complex moral world. For your essay, defend this as a hybrid "Agency-Respecting Pragmatic Deference" view.
