  We are creating a decision tree to help ML engineers in a reading group clarify their beliefs about whether neural networks genuinely have representations. The tree starts from a shared observation: training a sparse autoencoder (SAE) on an LLM's activations uncovers a feature that fires on sarcastic text, and steering with that feature induces sarcastic responses.

  The internal nodes are questions about concrete experiments and research instincts. Leaves are named positions (robust realism, structural/role-functionalist realism, instrumentalism, eliminativism, pluralism/indeterminacy, and possibly one for superposition-based views).

  We avoid nodes that directly ask about philosophical labels. We also note where positions collapse (e.g., instrumentalism and fictionalism might not be separable) and if two leaves share the same path.

  Let's design the tree:

  1. **Starting Point**: We have an SAE-derived feature that fires on sarcastic text and steering it causes sarcastic outputs.

  2. **Node 1: Steering as Causal Work**
     - Question: When steering the feature causes sarcastic outputs, does this demonstrate that the feature is doing *real causal work* in the model's normal operation, or is it merely one of many potential handles to influence behavior without being a privileged part of the model's intrinsic structure?
     - Branches:
       - A: It demonstrates real causal work (the feature is part of the model's intrinsic causal structure).
       - B: It is just one handle among many (the feature is a useful intervention point but not necessarily a privileged intrinsic part).

  3. **Node 2A (from A): Decomposition Disagreements**
     - Question: If two different SAEs (or SAEs with different dictionary sizes) each give a clean decomposition of the same layer but with incompatible sets of features (e.g., one has a single "sarcasm" feature, the other has multiple features that in combination capture sarcasm), what do you conclude?
     - Branches:
       - A1: One decomposition is more correct (e.g., due to better sparsity, lower loss, or alignment with other evidence). There is a fact of the matter about the model's features.
       - A2: Both are valid decompositions; the model's representation is such that there are multiple equally valid ways to decompose it into features (pluralism about decomposition).

  4. **Node 2B (from B): Role in Normal Operation**
     - Question: Does the feature (as found by the SAE) play a role in the model's normal operation (i.e., without intervention) for processing sarcasm?
     - Branches:
       - B1: Yes, the feature is active during normal processing and is part of how the model computes sarcasm.
       - B2: The feature is a useful construct for us, but in normal operation the model uses a different set of computations that we are approximating.

  5. **Node 3A1 (from A1): Generalization and Correctness Conditions**
     - Question: For the feature to genuinely represent sarcasm, is it necessary that it fires correctly on inputs far outside the training distribution (i.e., not just correlating with sarcasm but having a robust representation)? And must the model be capable of misrepresenting (e.g., firing the feature on non-sarcastic text in a way that is the model's own error, not a labeling error) to grant it correctness conditions?
     - Branches:
       - A1a: Yes, both generalization and the possibility of misrepresentation are required for genuine representation. (Leads to robust realism)
       - A1b: No, the feature can be considered to represent sarcasm even without these, as long as it plays a causal role in the model's processing. (Leads to structural/role-functionalist realism)

  6. **Node 3A2 (from A2): Fact of the Matter**
     - Question: In the case of multiple equally good decompositions, is there still a fact of the matter about whether the model has a sarcasm representation at a more fundamental level (e.g., in the distributed geometry), or is the representation only relative to a decomposition?
     - Branches:
       - A2a: There is a fact of the matter at a more fundamental level (e.g., the model does represent sarcasm, but the decomposition into features is an artifact of our method). (Leads to structural/role-functionalist realism, but note: might also lead to a superposition view if we interpret the fundamental level as distributed)
       - A2b: There is no fact of the matter; the representation is only relative to a decomposition. (Leads to pluralism/indeterminacy)

  7. **Node 3B1 (from B1): Feature as Approximate or Intrinsic**
     - Question: Is the feature we found an approximation of an intrinsic, decomposable structure in the model, or is the model's representation fundamentally distributed such that individual features (like the sarcasm direction) are never truly isolated in the network?
     - Branches:
       - B1a: The model has intrinsic decomposable structure; the SAE is approximating it. (Leads back to the A branch? But note: we started at B because we thought steering didn't show intrinsic causal work, but now we are saying the feature is part of normal operation. This might be a contradiction? Let's reconsider the structure.)

