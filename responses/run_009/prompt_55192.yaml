  **Node 3B (Pluralism)**:
  - Question: Even with multiple decompositions, is there a fact of the matter about whether the model represents sarcasm at a more fundamental level (e.g., in the distributed geometry)?
    - Yes: Structural/role-functionalist realism (with a distributed representation view) OR a superposition view (if we take the fundamental level to be the distributed features without decomposition).
    - No: Pluralism/indeterminacy.

  But note: We want a leaf for superposition. The superposition view might be that features exist only as patterns in the distributed representation and not as individual directions. So we can adjust:

  **Node 3B (Pluralism)**:
  - Question: Are the multiple decompositions merely different ways of approximating an underlying distributed representation that does not decompose into individual features?
    - Yes: Then we have a leaf for "Distributed Representation Realism" (or Superposition-Based Realism) - the model represents sarcasm, but not as an individual feature; it's part of a distributed code.
    - No: Then we have pluralism/indeterminacy (no fact of the matter).

  Now, let's list the leaves:

  1. **Robust Realism**: Features are natural kinds in the network. They are unique, objective, generalize robustly, and allow for misrepresentation.
  2. **Structural/Role-Functionalist Realism**: Features are defined by their causal role. There might be multiple decompositions (if we take that branch) or one, but the causal role is what matters. They might not require robust generalization or misrepresentation.
  3. **Distributed Representation Realism (Superposition)**: The model represents concepts, but as distributed patterns. Individual features in an SAE are approximations of these patterns, but the real representation is at the level of the entire activation vector (or subspace).
  4. **Pluralism/Indeterminacy**: There is no fact of the matter about which decomposition is correct; the model does not have a unique set of features. Feature attributions are relative to our interpretability tools.
  5. **Instrumentalism**: Feature talk is a useful fiction for predicting and steering behavior, but it does not correspond to anything intrinsic in the model. It's just scaffolding.
  6. **Eliminativism**: The model is just weights and activations. Feature talk is misleading and should be eliminated in favor of lower-level descriptions.

  Collapses:
  - Instrumentalism and Fictionalism: We note that these are not separable in the tree. They both lead to the same leaf: Instrumentalism.
  - Robust Realism and Structural Realism: They are separated by the generalization and misrepresentation question (Node 3A).

  Now, we write the tree:

  ---

  **Decision Tree: What Do You Believe About Neural Representations?**

  **Starting Point**: We trained a sparse autoencoder (SAE) on an LLM's activations and found a feature that fires on sarcastic text. When we add this feature to the activations at inference, the model responds sarcastically.

  **Node 1: Causal Role in Normal Operation**
  *Without any intervention, does this SAE-identified feature play a causal role in the model's normal processing of sarcastic text?*
  - **Yes** (I believe the feature is part of the model's intrinsic causal mechanism for sarcasm) → **Node 2A**
  - **No** (I believe the feature is a useful handle we created, but not part of the model's normal causal structure) → **Node 2B**

  **Node 2A: Uniqueness of Decomposition**
  *If we train multiple SAEs (with different initializations, dictionary sizes, etc.) on the same layer, and they each give clean but incompatible sets of features (e.g., one has a single "sarcasm" feature, another has multiple features that together capture sarcasm), is there a unique and objectively correct decomposition?*
  - **Yes, there is a unique decomposition** (One SAE is more correct, e.g., due to better sparsity, lower loss, or other evidence) → **Node 3A**
  - **No, there are multiple equally valid decompositions** → **Node 3B**

  **Node 2B: Usefulness of Feature Talk**
  *Is the feature a useful concept for predicting and explaining the model's behavior, even if it's not part of the model's intrinsic structure?*
  - **Yes, feature talk is a useful fiction** → **Leaf: Instrumentalism** (Feature talk is a pragmatic tool; it doesn't reflect intrinsic reality in the model.)
  - **No, feature talk is dispensable** → **Leaf: Eliminativism** (The model is just matrix multiplications; features are our invention and not part of the model.)

  **Node 3A: Requirements for Genuine Representation**
  *For the feature to genuinely represent sarcasm, must it: (a) respond correctly to sarcastic inputs far outside the training distribution (robust generalization), and (b) allow for the possibility of the model misrepresenting (i.e., firing on non-sarcastic text in a way that is the model's error, not a labeling error)?*
  - **Yes, both are required** → **Leaf: Robust Realism** (The feature is a natural kind in the model; it has correctness conditions and robust generalization.)
  - **No, the causal role is sufficient** → **Leaf: Structural/Role-Functionalist Realism** (The feature represents sarcasm by virtue of its causal role; it doesn't need to generalize perfectly or allow misrepresentation.)

  **Node 3B: Nature of Multiple Decompositions**
  *Given multiple equally valid decompositions, what does this say about the model?*
  - **The model represents sarcasm in a distributed manner; no single decomposition is fundamental, but the distributed pattern is real** → **Leaf: Distributed Representation Realism (Superposition)** (Features exist only as patterns in the distributed geometry; individual directions are not the model's representations.)
  - **There is no fact of the matter about how the model represents sarcasm; the decompositions are relative to our tools** → **Leaf: Pluralism/Indeterminacy** (The model doesn't have a unique set of features; our carvings are equally valid and there's no objective truth.)

  ---

  **Notes on Positions that Collapse**:
  - **Instrumentalism** and any form of fictionalism about features are treated together. We do not have a node that separates them because they share the same practical stance: features are useful but not real in the model.
  - **Robust Realism** and **Structural Realism** are separated by the requirements for representation (Node 3A). If you take the causal role as sufficient without robust generalization, you land in Structural Realism.
  - **Distributed Representation Realism** (Superposition) is distinct from Pluralism because it asserts that there is a real distributed representation (a fact of the matter at the distributed level) even if the decomposition into individual features is not unique.

  This tree should fit on one page and help the group map their views by focusing on concrete research questions.
answer: |-
  ### Decision Tree: What Do You Believe About Neural Representations?  
  **Starting Point**: We trained a sparse autoencoder (SAE) on an LLM’s activations, found a feature that fires on sarcastic text, and steering it (adding it to activations) causes sarcastic outputs. Everyone accepts this observation. Now, what does this imply about whether the model "has representations"?

  ---

  #### **Node 1: Steering as Causal Work**  
  *When steering the feature causes sarcastic outputs, does this prove the feature is a* ***necessary part*** *of the model’s intrinsic causal structure for sarcasm?*  
  - **Yes** (Steering reveals a "real" causal role; without it, sarcasm breaks or changes fundamentally) → **Go to Node 2A**  
  - **No** (Steering is just one handle among many; you could use other features/perturbations to get sarcasm) → **Go to Node 2B**  

  ---

  #### **Node 2A** (from "Yes" at Node 1)  
  *If two different SAEs (e.g., different initializations or dictionary sizes) decompose the same layer into clean but* ***incompatible features*** *(e.g., one has a unified "sarcasm" feature, another splits it into sub-features), what does this imply?*  
  - **The model has a unique ground-truth decomposition** (One SAE is "more correct"; disagreements reflect SAE flaws or misalignment) → **Go to Node 3A**  
  - **Multiple decompositions are equally valid** (The model’s representation is "overcomplete"; no single "true" decomposition exists) → **Go to Node 3B**  

  #### **Node 2B** (from "No" at Node 1)  
  *Is the feature still a* ***useful concept*** *for predicting/modeling the model’s behavior (e.g., for debugging or controlling outputs), even if it’s not fundamental?*  
  - **Yes, it’s pragmatically useful** (Features are tools for *us*, not claims about the model’s structure) → **Leaf: Instrumentalism**  
  - **No, it’s misleading** (The model is *only* weights/activations; feature-talk distracts from the real math) → **Leaf: Eliminativism**  

  ---

  #### **Node 3A** (from "unique decomposition" at Node 2A)  
  *For the feature to "genuinely represent sarcasm," must it:*  
  **(a)** *Generalize robustly* to out-of-distribution inputs (beyond training data),  
  **(b)** *Allow for misrepresentation* (e.g., fire on non-sarcastic text due to model error, not labeling error)?  
  - **Yes, both are required** (Generalization + error-possibility define "true" representation) → **Leaf: Robust Realism**  
  - **No, neither (or only one) is required** (Causal role in the model is sufficient; it’s "sarcasm" if it functions as such internally) → **Leaf: Structural/Role-Functionalist Realism**  

  #### **Node 3B** (from "multiple decompositions" at Node 2A)  
  *When SAEs disagree, is there still a* ***fact of the matter*** *about whether the model "represents sarcasm" at a* ***fundamental level*** *(e.g., in its distributed geometry)?*  
  - **Yes** (The disagreement is superficial; sarcasm is *really* encoded in the network’s geometry, even if decompositions vary) → **Leaf: Distributed Representation Realism (Superposition)**  
  - **No** (The model has no objective "sarcasm feature"; features are artifacts of our tools) → **Leaf: Pluralism/Indeterminacy**  

  ---

  ### Leaf Positions  
  1. **Robust Realism**:  
     - The model *literally* has features (e.g., "sarcasm") as natural kinds. They are unique, generalizable, and can misrepresent. SAEs (when ideal) discover these "joints" of reality.  
     - *Diagnostic*: Requires causal necessity (Node 1), decomposition uniqueness (Node 2A), and generalization/misrepresentation (Node 3A).  

  2. **Structural/Role-Functionalist Realism**:  
     - Features are defined by their *causal role* in the model. "Sarcasm" is real because it plays a functional part, even if decompositions vary or lack perfect generalization.  
     - *Diagnostic*: Causal necessity (Node 1), but no need for unique decomposition (Node 2A) or generalization/misrepresentation (Node 3A).  

  3. **Distributed Representation Realism (Superposition)**:  
     - Features *only exist holistically*—sarcasm is a distributed pattern, not an isolable direction. SAEs approximate this, but no decomposition is "truer" than others.  
     - *Diagnostic*: Accepts causal necessity (Node 1) but rejects decomposition uniqueness (Node 2A → Node 3B), while affirming underlying reality.  

  4. **Pluralism/Indeterminacy**:  
     - There’s no fact of the matter. SAE features are useful carvings, but the model doesn’t "have" sarcasm in any objective sense—it’s all relative to our tools.  
     - *Diagnostic*: Causal necessity (Node 1) but rejects decomposition uniqueness (Node 2A → Node 3B) and fundamental reality (Node 3B).  

  5. **Instrumentalism**:  
     - Feature-talk is *only* a useful fiction for prediction/control (e.g., steering works). It’s not about reality—it’s scaffolding for researchers.  
     - *Diagnostic*: Rejects causal necessity (Node 1 → Node 2B), but affirms usefulness.  

  6. **Eliminativism**:  
     - Features are illusions. The model is just matrices transforming vectors; "sarcasm" is a story we tell.  
     - *Diagnostic*: Rejects causal necessity (Node 1 → Node 2B) and usefulness (Node 2B).  

  ---

  ### Important Notes  
  - **Collapsed Positions**:  
    - **Instrumentalism** and **fictionalism** (e.g., "features are like epicycles") always map to the same leaf. No question splits them—both deny intrinsic reality but value utility.  
    - **Robust Realism** and **Structural Realism** are separated by Node 3A (generalization/misrepresentation). If you reject those, you’re Structural.  
  - **Ambiguity**: Nodes 2A/3B distinguish "Distributed Representation Realism" (geometric reality exists) from "Pluralism" (no reality). In practice, answers may correlate with views on superposition.  
  - **What This Isn’t**: No node asks about labels (e.g., "Are you a realist?"). Questions force engagement with experiments (e.g., SAE disagreements, OOD generalization, steering effects).  

  ---  
  *One page, ready for your Thursday meeting. Print and argue!*
