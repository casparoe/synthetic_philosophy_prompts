prompt: |-
  Is there an established name for the following phenomenon, and if not, can you coin one? In reading about the end of the Classic Maya, the Late Bronze Age palatial system, and Easter Island, I keep finding that the verdict "collapse" depends on which continuities you take to constitute the society. Track the Maya royal courts, the monument dedications, and the long-distance exchange in jade and obsidian, and the southern lowlands collapse in the ninth century; track the villages in the same valleys, and they mostly keep farming the same land in much the same way, speaking the same language, under new elites. Easter Island reads as ecological suicide if you track the palm forest and the statue cult, and as adaptation to a badly degraded island if you track the people, who were still there, in the thousands, when Europeans arrived. I am not after declinism, which is a bias of the observer, and I am not asking about resilience theory; what I want named is the structural fact that the verdict is fixed not by the society's fate but by the choice of what to count as the society — a choice usually made silently, and often dictated by the evidence itself, since the institutions that perished are exactly the ones that wrote, while the ones that persisted left little for us to read. Does this dependence of a verdict like "collapse" on the choice of unit and of tracked continuities have a name, or anything close to one? If the nearest concepts each capture only part of it, tell me which part each captures and where each fails. If nothing established fits, coin and define a term, give boundary cases — a change thorough enough that "collapse" holds on any tracking, and a change that is "collapse" on exactly one — and make clear how your term differs from the ordinary evaluative question of whether a change was bad.
reasoning: |-
  Okay, the user is asking about a specific phenomenon in historical and archaeological studies where the classification of a society's "collapse" depends on what aspects of the society are being tracked. They provided examples like the Classic Maya, the Late Bronze Age palatial systems, and Easter Island. 

  First, I need to understand the core of their query. They want to know if there's an established term for this phenomenon—where the verdict of collapse hinges on which continuities are considered essential to the society. They emphasize it's not about observer bias like declinism or resilience theory, but about the structural fact that the choice of societal elements tracked determines the outcome.

  Looking at the examples: For the Maya, if you focus on royal courts and monuments, it's a collapse; if you look at villages continuing to farm, it's continuity. Easter Island's statue cult vs. the people adapting. The evidence itself influences this because literate institutions leave records, while persistent ones might not. 

  Now, I recall similar concepts. "Collapse" is vague in academia. Tainter's work comes to mind, but he focuses on complexity. Yoffee's "transformation" is close but not exactly this. "Dechêance" is about decline, not the selective tracking. "Continuity problem" is too broad. "Elite focus" addresses evidence bias but misses the societal unit choice. 

  The existing terms don't fully capture the phenomenon. Each covers part: "elite focus" explains evidence bias, "continuity problem" the persistence of some elements. But the user's point is about how the definition of the society itself affects the verdict. So coining a term seems necessary.

  I consider possible terms. "Societal referent" or "ontological tracking" emphasize the choice of what constitutes the society. "Collapse relativity" highlights dependence on perspective. But "referential elasticity" combines the flexibility of reference and societal definition. "Elasticity" suggests the societal boundaries stretch based on what's tracked.

  Defining it: The dependence of collapse verdicts on the chosen societal unit and tracked continuities. Boundary cases: A true collapse (Chaco Canyon) where all elements end, and a case like the Maya where only elite structures collapse. Differentiating from evaluative judgments: It's about definition, not whether the change was bad.

  Need to ensure the term is clear, academic-sounding, and captures both the choice of unit and the evidence bias. Also, must distinguish from existing concepts. The user is likely an academic or advanced enthusiast, so precision is key. They want a tool for clearer discourse, avoiding unnoticed shifts in societal definition.
answer: |-
  This phenomenon you describe is both astute and under-acknowledged in historical discourse. There is **no single, established term** that perfectly captures the *full structural dependence* of the "collapse" verdict on the choice of societal unit and tracked continuities, especially with the inherent evidence bias you note. However, several related concepts touch on parts of it:

  1.  **"Collapse" Definition Problem / Semantic Ambiguity:** This addresses the core issue that "collapse" is poorly defined. It captures the vagueness but doesn't explicitly highlight the dependence on *which elements* are tracked as constitutive of the society.
  2.  **Norman Yoffee's "Transformation":** Yoffee argued against simplistic "collapse" narratives, emphasizing transformation and reorganization, particularly the decline of *specific institutions* (like palaces) rather than entire populations or cultures. This directly addresses the Maya/LBA examples but doesn't explicitly name the *methodological choice* of tracking unit as the determining factor. It focuses on the outcome (transformation vs. disappearance).
  3.  **"Continuity Problem" (Archaeology):** This recognizes the difficulty of identifying societal continuities in the archaeological record, especially for non-elites. It captures the *evidential challenge* you mention but doesn't frame it as the *determining factor* for the collapse verdict itself.
  4.  **"Elite Focus" / "Monumental Bias":** This critiques the over-reliance on elite-centric evidence (texts, monuments, palaces) which naturally foregrounds the fate of elites and state institutions. This perfectly captures the *evidence bias* driving the choice but doesn't encompass the broader *conceptual choice* about what *defines* the society (e.g., language, subsistence, kinship), which can exist even if evidence were equal.
  5.  **"Levels of Societal Integration" (Joseph Tainter):** Tainter discusses collapse occurring at specific levels (e.g., regional polity vs. local community). This acknowledges different scales but doesn't explicitly state that the *verdict* depends entirely on *which level you choose to track* as "the society."

  **Why These Fall Short:** While "Elite Focus/Monumental Bias" powerfully addresses the *evidential driver* of the phenomenon, and "Transformation" describes the *nature of the outcome*, none explicitly name the **core methodological act**: that the label "collapse" is not an objective property of the event, but a *relational property dependent on the specific societal unit and set of continuities selected for tracking*. The verdict is fixed by the definition, not the event.

  **Coined Term: Referential Elasticity of Societal Collapse (RESC)**

  *   **Definition:** The phenomenon whereby the historical verdict of societal "collapse" is determined not solely by the events experienced by a population in a region, but by the *referential choices* made by the analyst regarding:
      1.  **The Societal Unit:** What constitutes "the society" (e.g., the state apparatus, the elite class, the ethnic/language group, the subsistence community, the population aggregate)?
      2.  **The Tracked Continuities:** Which specific elements or functions are deemed essential for the society's persistence (e.g., political centralization, monumental construction, specific religious practices, elite lineages, core subsistence techniques, language, population level, settlement pattern)?
      Crucially, this elasticity is often masked or constrained by the **differential visibility** of evidence, where the elements most likely to leave clear traces (elite institutions, writing) are precisely those most susceptible to disruption, while persistent elements (subsistence, language, local community structures) leave fainter archaeological signatures.

  *   **Boundary Cases:**
      *   **"Collapse Holds on Any Tracking":** The complete abandonment and disappearance of a population from a region with no known descendants or cultural continuities elsewhere (e.g., the Greenland Norse colonies). RESC is minimal; the referential choice has little effect on the verdict.
      *   **"Collapse on Exactly One Tracking":** A dramatic disruption affecting *only* a highly specific, narrowly defined societal unit or continuity, while the broader population and culture persist largely unchanged. Example: The abrupt end of the Egyptian Old Kingdom pyramid-building tradition and central pharaonic administration (c. 2200 BCE). If "the society" is defined strictly as *that specific mode of pharaonic kingship and monumental construction*, it collapses. If defined as the Egyptian population, its language, its core agricultural practices, or its religious concepts, it persists and transforms. The verdict depends entirely on the chosen referent.

  *   **Distinction from Evaluative Judgment:** RESC is fundamentally about **definition and identification**, not evaluation. It asks: *"Based on what we define as 'Society X' and what we track as its essential continuity, did it cease to exist in that form?"* The question of whether the change was "bad" (declinism) is separate and evaluative: *"Was the disruption of State Institution Y or the degradation of Environment Z a negative outcome for the people involved or humanity generally?"* RESC explains *why* historians might disagree on whether a collapse *occurred*, even if they agree on the negative consequences of specific changes.

  **Why "Referential Elasticity"?**

  *   **Referential:** Directly addresses the core act of defining *what* "the society" refers to.
  *   **Elasticity:** Emphasizes the flexibility and non-fixed nature of the societal boundaries and essential criteria. The "snap" point (collapse) changes depending on how the societal unit is stretched or defined.
  *   **Of Societal Collapse:** Specifies the phenomenon being described.

  RESC provides a precise conceptual tool to:
  1.  Expose the hidden assumptions behind collapse narratives.
  2.  Frame debates more productively by forcing explicit definition of the societal unit and tracked continuities.
  3.  Acknowledge the profound influence of evidentiary bias on grand historical narratives.
  4.  Move beyond simplistic "collapse vs. continuity" binaries towards nuanced understandings of transformation.

  Your observation cuts to the heart of historical epistemology. RESC names the structural dependence you've identified, differentiating it from both outcome types (transformation) and evaluative biases (declinism).
