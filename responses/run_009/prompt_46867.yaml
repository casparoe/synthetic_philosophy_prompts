  I am applying to an eight-week summer research program for high school students, and I need a two-page proposal for a project culminating in a written report. My topic is Bell's theorem, and my half-formed idea is this: popular accounts say the theorem proves that nature is "nonlocal," yet the same accounts insist that entanglement cannot be used to send a message faster than light, and these two claims pull in different directions. I suspect the tension comes from sliding between two things "locality" can mean: a very strong prohibition on any superluminal causal influence, versus the weaker fact that no observer can exploit the correlations to signal. My rough question is whether Bell's theorem, properly interpreted, establishes only that signaling is impossible, or whether it establishes something stronger about the structure of the world — and if the latter, what exactly that something is. I have also read that philosophers sometimes divide Bell's assumption into two parts, one concerning whether distant settings influence outcomes and one concerning whether outcomes remain correlated given the settings, and I would like the proposal to say whether and how that division bears on my question. Please structure the proposal as follows: a precise statement of the question; an explanation of why the standard textbook presentations leave it open; a week-by-week method section that separates the conceptual analysis from the weeks in which I would work through a derivation of the Bell inequalities myself; a statement of the possible conclusions and what would decide among them; and an honest assessment of what would count as failure, including whether the project is too ambitious for a student who has completed AP Physics and single-variable calculus but no course in quantum mechanics. No citations are needed; I will add those myself.
