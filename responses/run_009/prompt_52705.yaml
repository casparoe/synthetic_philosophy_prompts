prompt: |-
  I teach a graduate seminar on moral psychology, and one of my colleagues — an ethicist who has spent her career on the question of whether guilt or shame is the better moral emotion, and on whether a culture can deliberately redesign its emotional repertoire — has built up a track record of judgments on concrete practices that I would like help reasoning forward from. Her verdicts so far: she praised a university that abolished its practice of posting the names of students convicted of honor-code violations and replaced it with private conferences in which the student faces the affected classmate and negotiates restitution; she condemned a municipal program that posted photographs of convicted shoplifters on an official website; she praised a school, modeled on Japanese classroom practice, in which a child who stole from a classmate sits with a small circle of peers, hears how the theft affected each of them, formally apologizes, and is then explicitly welcomed back into the group; she condemned a parenting manual's advice that parents correct children in front of dinner guests by unfavorably comparing them to their siblings; and she praised traditional confession-and-absolution, in which penitents privately acknowledge specific wrongs, receive penance, and are granted forgiveness. In conversation she has also said that she doubts a culture can simply choose its dominant moral emotion, the way it might choose a tax code, though she grants that institutions can nudge the balance between guilt and shame at the margins.

  Next month she has agreed to give a verdict on a proposed corporate policy: an employee found to have harassed a colleague would be required to stand before an all-hands meeting of several hundred employees, describe what they did, and apologize, and then, upon completing a restorative training program, would be formally welcomed back by the CEO in a ceremony marking their full reintegration into the company. I would like you to predict her verdict. Her record strikes me as consistent with at least two principles — that shame is morally acceptable when reintegrative but indefensible when stigmatizing, and that the decisive variable is instead the size, permanence, and composition of the audience rather than any subsequent reintegration — and perhaps with a third, that what matters is whether a practice targets deeds or instead targets character. Please say what each candidate principle predicts about the corporate policy, whether her skepticism about wholesale cultural choice should pull her toward any of them, give your best guess as to her verdict along with your reasons for preferring that reading, and describe the further case — a practice we could put to her — that would best distinguish the principles from one another. Please write continuous prose only, as in a letter or email, without headings, bullet points, bold text, or tables.
reasoning: |-
  Okay, the user is a professor teaching a graduate seminar on moral psychology. They have a colleague who's an ethicist specializing in guilt versus shame as moral emotions. The colleague has a track record of judgments on various practices, and the user wants help predicting her verdict on a proposed corporate policy for handling harassment. The user also wants to understand the underlying principles behind her judgments and how to distinguish them further.

  First, I need to recap her colleague's past verdicts. She praised practices that involve private conferences, small peer circles, and traditional confession—all of which focus on reintegration and addressing specific deeds. She condemned public shaming like posting names or photos, and public humiliation such as comparing children in front of guests. The colleague also doubts that cultures can wholesale choose their dominant moral emotion but allows for nudging through institutions.

  The user suggests three possible principles guiding her decisions:
  1. Shame is acceptable only if reintegrative, not stigmatizing.
  2. The audience's size, permanence, and composition matter most.
  3. Targeting deeds vs. character is key.

  Now, applying these to the corporate policy: the harasser must apologize at an all-hands meeting (large audience) and later be reintegrated by the CEO. 

  For Principle 1 (reintegration): The policy includes a reintegration ceremony, which aligns with praise-worthy cases. However, the initial public apology might be stigmatizing, which could lead to condemnation.

  For Principle 2 (audience): The all-hands meeting is a large, potentially permanent audience (if recorded), similar to condemned cases like posting shoplifters' photos. This would predict condemnation.

  For Principle 3 (deeds vs. character): The apology focuses on describing actions, not attacking character, which might align with praise. But public exposure risks character stigmatization, so it's ambiguous.

  The colleague's skepticism about cultural change might make her lean toward principles that are more feasible institutionally, like audience factors or deeds vs. character, rather than reintegration which requires deeper cultural shifts.

  Best guess: Condemnation. The large audience is a red flag based on her past reactions to public exposure. The reintegration ceremony might not offset the initial shaming's potential stigma.

  To distinguish the principles, a test case could involve private shaming without reintegration. If she condemns that, Principle 1 (reintegration) is key. If she focuses on the audience, Principle 2 is stronger. If she emphasizes the deed/character distinction regardless of audience, Principle 3 wins.
answer: |-
  Your colleague’s verdicts reveal a nuanced, consistent ethic centered on minimizing *stigmatizing* shame while favoring practices that facilitate moral growth and reintegration. Let me unpack how each candidate principle applies to the corporate policy, weigh the influence of her cultural skepticism, predict her verdict, and propose a test case to clarify her framework.  

  ### Candidate Principles Applied to the Corporate Policy  
  1. **Reintegrative vs. Stigmatizing Shame**:  
     This principle would scrutinize whether the corporate ritual prioritizes healing and reconnection after accountability. The *apology* before hundreds risks public humiliation (echoing her condemnation of photo-posting and sibling comparisons), which could cement a permanent "harasser" identity. However, the *reintegration ceremony* explicitly signals forgiveness, mirroring praised cases like the Japanese classroom circle or confession-and-absolution. Yet the scale matters: a CEO-led welcome may feel performative in a large corporation, unlike intimate peer reintegration. **Prediction**: She’d condemn this as *stigmatizing-first*, as the public shaming may overshadow later reintegration.  

  2. **Audience Size, Permanence, and Composition**:  
     Her recoil from public shaming (e.g., the municipal shoplifter site) hinges on broadcast exposure to vast, impersonal audiences. An all-hands meeting—hundreds of colleagues, potentially recorded—creates lasting, uncontrollable visibility, amplifying shame’s sting. Contrast this with her praised cases: private conferences, small peer circles, or confessional secrecy all limit exposure to affected parties or trusted authorities. **Prediction**: She’d condemn this, viewing the audience as too large and permanent for genuine moral repair.  

  3. **Targeting Deeds vs. Character**:  
     The policy requires describing "what they did," focusing on actions—aligning with her support for deed-specific accountability (e.g., confession naming "specific wrongs"). But public exposure risks conflating deeds with character: standing before peers as a "harasser" could imply inherent flaw, echoing her rejection of sibling comparisons (which attack character). **Prediction**: Ambivalent. The deed-focused apology is laudable, but the spectacle may still stigmatize character.  

  ### Cultural Skepticism’s Influence  
  Her doubt that cultures can "wholesale" choose moral emotions reinforces principles 2 and 3. Institutions can "nudge" via *structural* changes (e.g., shifting audiences or deed-focused framing), but reintegration (principle 1) demands deeper cultural buy-in she deems fragile. A giant corporation forcing public apology may strike her as overestimating institutional power to engineer redemption—risking empty ritual over organic moral growth.  

  ### Predicted Verdict: Condemnation  
  I believe she will **reject the corporate policy**, primarily on audience grounds (principle 2). The all-hands meeting mirrors the condemned shoplifter-photo program: exposure to a broad, impersonal audience invites voyeurism and permanent stigma, undermining repentance. While reintegration is attempted, its ceremonial formality in a large hierarchy feels less authentic than the peer-driven welcomes she praised. Her skepticism about cultural engineering amplifies this—expecting public shaming to yield contrition ignores shame’s tendency to provoke defensiveness or alienation. The deed-focused apology is a saving grace, but likely insufficient to offset the spectacle’s harm.  

  ### A Test Case to Distinguish Principles  
  To disentangle these principles, propose this practice:  
  *A community court for minor thefts, where offenders privately confess to the victim and a neutral mediator, agree to restitution, and later receive a sealed certificate of resolution. If reconciliation succeeds, the victim may optionally announce this outcome in a community newsletter—without naming the offender.*  

  - **Principle 1 (Reintegration)** would *praise* this: private accountability, then optional public closure *focused on repair*.  
  - **Principle 2 (Audience)** would *praise* it: strict privacy unless victims *choose* limited, anonymized disclosure.  
  - **Principle 3 (Deeds/Character)** would scrutinize the newsletter: if it says "the harm was repaired," it targets deeds; if it implies "the offender was reformed," it risks character judgment.  

  Her verdict here would clarify priorities. If she blesses it despite the newsletter, audience control (principle 2) dominates. If she demands no public element, reintegration (principle 1) is key. If she critiques language like "reformed," deeds-vs-character (principle 3) is decisive.  

  In essence, your colleague champions *contained* shame that enables reconciliation—a vision the corporate policy, with its theatrical publicity, seems destined to violate.  

  ---  
  *I hope this dissection aids your seminar—it’s a rich case study in how abstract ethics confronts institutional design. Should you test her prediction, I’d be curious to hear if it aligns.*
