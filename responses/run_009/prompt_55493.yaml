prompt: |-
  I'm a bioethics PhD student and I sit on my university's IRB as the student rep, which mostly means I read consent forms all day, and I've realized I can't actually state the principle behind my own gut verdicts. So here they are, and I want to know what captures them.

  Consent to surgery while blackout drunk: obviously invalid, no contest. A research participant who's told there's a 50% chance of placebo: fine, that's just how trials work. The same participant told the study drug is "very promising" by an investigator who privately thinks it's near worthless: not fine, and I don't care that everything technically disclosed was true. A stranger returns my lost wallet but only after I agree to a "finder's fee" he names while holding the wallet: I think my agreement doesn't count as real consent, though nothing was false and no one touched me. Someone sleeps with a person who has been lying for weeks about being in love with them to keep them interested: not valid consent, in my gut. The same scenario but the lie is about their job title on an app: valid, though I get why people waver. An employee who "freely" agrees to unpaid weekend overtime when the boss has mentioned that not being a team player is noted in reviews: I go back and forth, leaning not valid. A desperately poor person who takes $8000 to join a somewhat risky trial: I keep flip-flopping — the amount is exactly why they're saying yes, and exactly why we can't call it unfair. A surgeon who never mentions he holds equity in the device company whose implant he's recommending: something's wrong there, but I honestly can't decide whether it invalidates the consent or just makes the surgeon a jerk.

  And the case I keep circling and can't settle: the fully informed, competent, uncoerced participant in a phase 1 oncology trial who, in the exit interview, casually mentions they expect the drug to cure their cancer — therapeutic misconception, textbook version. Everyone did their job right on paper. Is that consent valid?

  Is there a principle — maybe something about what has to be true of the person's decision situation rather than just the information packet — that gets all or nearly all of these? If two of my verdicts genuinely can't coexist, tell me which one to give up and why that one rather than the other. And if you land on a principle, I want to hear what it says about a case I haven't mentioned: a patient who consents to a procedure after their doctor, honestly and correctly, says "in your position I would do this" — the nudge that isn't a lie, isn't a threat, and isn't undisclosed.
reasoning: |-
  Okay, let me try to unpack this bioethics puzzle. The user is a PhD student on an IRB who's noticed their gut reactions to consent scenarios don't neatly fit standard frameworks - and that's brilliant self-awareness. They're wrestling with cases where autonomy seems violated despite checking technical boxes: drunken consent, therapeutic misconception, exploitative finder's fees. 

  Hmm... the wallet example is particularly sticky. Legally, the finder could demand a reward, but ethically? Holding the wallet hostage creates a power asymmetry that feels coercive. Similarly, the surgeon's undisclosed financial interest - it's not about lying but about hidden motivations that should be transparent. 

  Ah! What connects these is how the decision architecture itself gets manipulated. Voluntariness isn't just about overt threats; it's eroded by emotional manipulation (the fake lover), situational pressure (the boss's "team player" comment), or distorted cognition (the blackout drunk). 

  The $8000 payment case is a real brain-twister though. Poverty isn't coercion per se, but when money becomes the only reason for consent, does that choice reflect values or desperation? Maybe the principle should focus on whether alternatives exist - the poor participant likely has no other $8000 options, while the Tinder liar about his job title does. 

  For the "in your position I would do this" doctor... that's fascinating. If said genuinely, it's sharing expertise; if said strategically, it's nudging. The line might be whether the doctor is amplifying the patient's values versus substituting their own. 

  *scribbles mental notes* Core elements emerging: 
  - Cognitive capacity (drunk vs placebo-aware) 
  - Voluntariness beyond coercion (wallet, boss pressure) 
  - Authenticity of understanding (therapeutic misconception) 
  - Absence of manipulative architecture (fake lover, hidden conflicts) 

  Therapeutic misconception is the thorniest. Perfect paperwork, but if hope overrides comprehension, is consent meaningful? I lean toward "no" - autonomy requires grasping the nature of the act, not just hearing words. 

  If forced to sacrifice one gut call... maybe the finder's fee? But that feels wrong because exploitation matters. No, better to ditch the "unpaid overtime is sometimes okay" hesitation. Boss pressure exploits power imbalance as clearly as the wallet holder. 

  Final principle draft: Valid consent requires a decision architecture free of distorting constraints (like incapacity), pressures (like exploitation), or manipulations (like deception) that disconnect choice from authentic values. 

  *checks oncology trial case through this lens* Even with perfect disclosure, therapeutic misconception *is* a cognitive distortion - the participant isn't truly choosing an experiment; they're choosing a mirage of treatment. So consent fails. 

  Doctor's "I would" statement? If it clarifies rather than directs, it could enhance autonomy. But if it exploits trust to steer, it corrupts the architecture. Depends on delivery and context. 

  Phew. User's asking for coherence in the messy reality of consent - exactly what bioethics needs. Time to structure this into principles with concrete examples.
answer: |-
  Your gut verdicts reveal a deeper principle that transcends traditional autonomy-based models (like Beauchamp & Childress) and information-disclosure standards (like Faden & Beauchamp). The unifying thread is **the integrity of the decision-making architecture**. Consent is invalid when the *structure of the decision situation itself* distorts, bypasses, or substitutes the agent's authentic evaluative judgment, even if information is technically adequate and no overt coercion exists.

  Here's how this principle explains your cases:

  1.  **Blackout Drunk:** The architecture is destroyed by incapacity. Judgment is biologically impossible.
  2.  **50% Placebo Chance:** The architecture is intact. The participant understands the core nature of the trial; judgment is operational.
  3.  **"Very Promising" Misrepresentation:** The architecture is corrupted. The investigator exploits trust and manipulates the *evaluative weight* the participant assigns to disclosed facts ("50% placebo" feels different when framed as "very promising"). Judgment is distorted.
  4.  **Finder's Fee:** The architecture is coercively constructed. The stranger *creates* an artificial situation exploiting vulnerability (loss, urgency) and power imbalance (holding the wallet hostage). Judgment is pressured by manufactured necessity.
  5.  **Lying About Love:** The architecture is built on profound deception regarding a *fundamental basis for intimacy*. Authentic judgment about the sexual act itself is impossible because its relational context is falsified. Consent is to a fictional relationship.
  6.  **Lying About Job Title:** The architecture is minimally distorted for a casual encounter. While deception exists, it typically doesn't strike at the *core basis* for the decision to engage sexually in that context for most people. Judgment about the act itself is largely intact (though ethically dubious).
  7.  **Unpaid Overtime Pressure:** The architecture exploits inherent power asymmetry and manufactured vulnerability ("not a team player" = threat to livelihood). Judgment is distorted by fear, not free evaluation. **(Your gut "not valid" is consistent)**.
  8.  **$8000 for Risky Trial:** The architecture is distorted by *desperation*, not coercion. The crushing lack of alternatives *substitutes* the agent's authentic valuation of risk/benefit with a survival imperative. Judgment is overridden by necessity. **(This is the hardest, leaning towards "invalid" under this principle - the payment creates a situation where "choice" is fundamentally inauthentic)**.
  9.  **Surgeon's Undisclosed Equity:** The architecture is corrupted by *hidden conflict of interest*. The patient's judgment about the recommendation's trustworthiness is based on a false premise (assumed objectivity). The evaluative process is tainted, even if the disclosed facts are true. **(Invalidates consent - it's not just jerkiness, it's structural deceit)**.
  10. **Therapeutic Misconception (Phase 1 Oncology):** The architecture is intact *procedurally*, but the *participant's internal processing* is fundamentally flawed. Despite perfect information, they fail to grasp the *nature* of the act (research vs. treatment). Their "consent" is to an action they fundamentally misunderstand. **Invalid under this principle.** Authentic judgment requires accurate comprehension of the act's essence.
  11. **Doctor's "In Your Position I Would Do This":** **This is VALID consent under this principle, and illuminates its boundary.** The doctor shares expertise and perspective *within* a transparent decision architecture. They are not distorting the situation, hiding motives, exploiting vulnerability, or bypassing judgment. They are providing information (their own values/choice as data) the patient can integrate into *their own* authentic evaluative process. It's a nudge, not a distortion.

  **The Core Principle:**

  **Valid consent requires a decision architecture that preserves the agent's capacity for authentic evaluative judgment about the nature and consequences of the act, free from structural distortion, bypass, or substitution.**

  *   **Structural Distortion:** External manipulation of the situation that warps perception/weighting of information (Misrepresentation, Finder's Fee setup, Undisclosed COI, Boss Pressure).
  *   **Bypass:** Circumventing judgment entirely (Incapacity).
  *   **Substitution:** External forces or desperation supplanting the agent's own values in the decision (Desperation Poverty, Therapeutic Misconception - internal value substitution).
  *   **Authentic Evaluative Judgment:** Requires capacity, understanding the *nature* of the act (not just facts), and the ability to weigh it against one's own values without overriding distortion.

  **Reconciling Conflicts & Sacrifices:**

  *   **$8000 Payment vs. "Freely" Agreed Unpaid Overtime:** Under this principle, both lean towards invalid due to distorted architecture (desperation/power asymmetry). If you *must* sacrifice one, reluctantly sacrifice the "unpaid overtime" verdict *only if* you define "structural distortion" very narrowly as *intentional* exploitation. The boss *intends* to pressure, while poverty is a systemic condition. However, the *effect* on authentic judgment is similar. Your gut flips because the systemic nature of poverty makes the "distortion" feel less like a *personally* engineered trap. Stick with "invalid" for both – the architecture is compromised.
  *   **"Very Promising" vs. Job Title Lie:** The key difference is the *impact on the core basis for judgment*. The misrepresentation directly warps the risk/benefit evaluation central to research participation. The job title lie typically doesn't warp the core basis for a casual hookup decision (physical attraction, momentary interest) in the same fundamental way. Sacrifice the "valid" verdict on the job title lie if you believe *any* deception about identity invalidates sexual consent (a defensible view), but your instinct recognizes a difference in the *degree* of architectural corruption.

  **Conclusion:** Your intuition points to flaws in the *conditions for autonomous choice* itself, not just the inputs (information) or absence of force. Focusing on the "integrity of the decision-making architecture" captures the vulnerability in drunkenness, the exploitation in manufactured situations, the corruption of hidden conflicts, the bypass of therapeutic misconception, and the substitution by desperation, while allowing for valid consent in transparent risk scenarios (placebo), genuine nudges (doctor's opinion), and minor deceptions less central to the act's essence (job title). It elevates the *process* and *context* of decision-making to co-equal status with competence, information, and non-coercion.
