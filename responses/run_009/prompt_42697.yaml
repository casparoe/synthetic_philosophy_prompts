  The user's framing isn't confused; it's insightful. The real disagreement might be over the mind-independence of reality's structure. The user should consider if they've accurately captured Thomasson's deflationism, which might be more about semantic access than just verbal disputes. Also, the verbal/substantive distinction might need refining, as "verbal" can be contentious. 

