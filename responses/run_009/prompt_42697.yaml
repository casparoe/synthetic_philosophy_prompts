  I need to address each part. Let me start by examining the user's hypothesis. They might be onto something: deflationists and substantivists are indeed answering different questions. Thomasson is concerned with how we use quantifiers in language, while Sider is asking about the structure of reality. So their answers don't directly conflict. But the substantivist retort is that the existence of a mind-independent structure is itself a substantive issue. So even if they're answering different questions, the deflationist's stance might imply that there's no such structure, leading to conflict.

