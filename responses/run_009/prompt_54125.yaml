prompt: |-
  I'm writing a short essay on Galileo and the Church, and a friend who reads a lot of popular science gave me this summary of Galileo's actual views on scripture. Could you act as a historian of early modern science and philosophy and audit it for me? Go claim by claim — what a specialist would accept, what's a simplification, and what's flat wrong — and tell me whether his overall point survives once you fix the errors.

  His summary: "Galileo basically held that religion is about how to live, not how the world works, so scripture should never be read literally on scientific matters — he loved quoting that cardinal's line about how the intention of the Holy Spirit is to teach us how one goes to heaven and not how heaven goes. By 1615 he had the telescope proof in hand anyway: the phases of Venus settled the question, so the Church's only option left was to condemn him for saying the Bible was wrong, which is what happened in 1633. His view is basically Gould's non-overlapping magisteria three centuries early, and the Church admitted as much when it apologised in 1992."

  Something about this feels definately too tidy to me. I vaguely recall Galileo thinking that demonstrations about nature can actually force reinterpretations of scripture, which doesn't sound like separate magisteria at all — but honestly I can't tell where my friend is oversimplifying versus getting things wrong. Maybe brainstorm a quick list of the distinct claims in his summary first, then go through them. And if the Venus point matters, say exactly what it did and didn't rule out. Please think carefully before answering. No reading lists or citations — I can't check sources right now, I just want your reasoning. Also please write the whole thing in British English.
