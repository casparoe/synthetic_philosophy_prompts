  ### Step 1: Articulating the Rules  
  The actuary's rulings consistently prioritize **causal homogeneity** and **relevance of mechanisms** over raw data volume or surface-level similarity. Two overarching rules rationalize her decisions:  

  #### Primary Rule: **Causal Mechanism Alignment**  
  - **Description**: Select the reference class where the *causal drivers* of the outcome are most homogeneous and directly relevant to the target case. Broader classes are rejected if they introduce heterogeneity in causal mechanisms; narrower classes are preferred if they isolate the key mechanisms. Broader classes are only acceptable when they share the *same* causal drivers (as in Ruling 4).  
  - **Fits the Rulings**:  
    - Ruling 1: Focuses on homogeneous drivers (sector economics/founder experience).  
    - Ruling 2: Isolates the causal mechanism (vehicle maturity), ignoring broader spaceflight risks.  
    - Ruling 3: Rejects institutional rates in favor of individualized causal factors (record quality).  
    - Ruling 4: Broad class accepted because causal driver (outside-option market) is field-agnostic.  

  #### Alternative Rule: **Predictive Salience**  
  - **Description**: Select the reference class where the *most salient predictive features* of the target case are best represented, even if causal mechanisms are not explicitly isolated. This rule emphasizes observable, high-impact variables (e.g., founder experience, vehicle novelty) over deep causality.  
  - **Fits the Rulings**:  
    - Matches all four rulings similarly to the primary rule, as salient features (e.g., founder experience, first-flight status, record quality, quantitative training) are strong proxies for outcomes.  
  - **Distinction from Primary Rule**: Predictive Salience prioritizes surface-level predictors that correlate with outcomes; Causal Mechanism Alignment demands that predictors *directly influence* the outcome via a shared causal pathway. In practice, they often converge (as here), but diverge when salient features are non-causal or when causality is ambiguous.  

  ### Step 2: Where Rules Diverge on the AI Paradigm Case  
  The question: **Will scaled pretraining remain the dominant path to AI capability in 2035?**  
  Classes on offer:  
  - **(i) Stalled AI paradigms** (e.g., symbolic AI, expert systems).  
  - **(ii) Sustained scaling technologies** (e.g., Moore’s Law, genome sequencing).  
  - **(iii) Hyped transformative technologies** (undifferentiated).  

  #### How the Rules Diverge:  
  - **Causal Mechanism Alignment**:  
    - Focuses on *why* a paradigm stalls or scales.  
    - Argues for class (ii): The core uncertainty is whether *scaling laws* (compute/data/parameters) will continue driving progress. This class shares a causal mechanism—engineering improvements and predictable returns to scale—making it homogeneous and relevant.  
    - Rejects class (i): Stalled AI paradigms failed due to *different* mechanisms (e.g., brittle reasoning in symbolic AI, narrow applicability in expert systems), not scaling limits.  
    - Rejects class (iii): Hyped technologies have wildly heterogeneous causal paths (e.g., success for transistors vs. failure for cold fusion).  
    **Prediction**: Selects class (ii).  

  - **Predictive Salience**:  
    - Focuses on surface similarities: "promising paradigm that might stall."  
    - Argues for class (i): The target (scaled pretraining) shares salient features with past AI paradigms: hype, initial breakthroughs, and a "boom-bust" risk profile.  
    - Rejects class (ii): Scaling technologies lack the domain-specific risks of AI (e.g., algorithmic plateaus, safety failures).  
    - Rejects class (iii): Too noisy; hype alone is a weak predictor.  
    **Prediction**: Selects class (i).  

  **Underdetermination**: The track record *does not* fully determine a ruling here. Both rules fit past cases, and the AI question involves novel causal ambiguities (e.g., is scaling a *sufficient* causal driver, or will AI-specific constraints dominate?).  

  ### Step 3: Best Guess for Her Ruling  
  **Prediction**: She selects **class (ii) — sustained scaling technologies**.  

  **Reasons**:  
  1. **Causal Homogeneity Over Domain Similarity**:  
     - Like Ruling 2 (spaceflight maturity vs. general spaceflight), she isolates the core mechanism—*scaling dynamics*—not the AI domain. The paradigm’s progress is driven by empirical scaling laws (e.g., Chinchilla, GPT trends), mirroring Moore’s Law or genome costs. Past AI paradigms lacked this property.  
  2. **Rejection of Superficial Analogies**:  
     - Class (i) is akin to Ruling 1’s "all ventures" class: heterogenous failures (symbolic AI hit hardware limits; expert systems faced knowledge-engineering bottlenecks). Scaled pretraining’s causal drivers (data/compute scaling) are absent there.  
  3. **Broad Class Acceptance When Causal Drivers Align**:  
     - Like Ruling 4 (postdoc retention), class (ii) is broad but shares a stable causal mechanism (returns to scale) across fields.  
  4. **Irrelevance of Hype**:  
     - Class (iii) is rejected outright, as in Ruling 3’s dismissal of institutional averages when individualized factors dominate.  

  ### Step 4: Proposed Next Dispute to Separate the Rules  
  **Proposition**: Will a new quantum-computing startup (focused on error correction) achieve profitability within 5 years?  

  **Candidate Classes**:  
  - **(a) Quantum computing companies founded by academics with prior startup experience**.  
  - **(b) Deep-tech startups in capital-intensive hardware sectors** (e.g., fusion energy, advanced semiconductors).  
  - **(c) All VC-backed startups in computing hardware**.  

  **Why This Separates the Rules**:  
  - **Causal Mechanism Alignment**: Chooses (a). Profitability hinges on *domain-specific expertise* and *founder skill* in quantum (like Ruling 1). Class (b) is too broad—fusion/semiconductors have distinct technical risks.  
  - **Predictive Salience**: Chooses (b). Salient features are "deep-tech," "hardware," and "capital intensity" (like Ruling 4’s quantitative postdoc class). Ignores quantum-specific causality.  
  - **Outcome**: If she picks (a), it affirms Causal Mechanism Alignment. If (b), Predictive Salience dominates. Class (c) acts as a rejected "noisy" control.  

  This case cleanly isolates whether she prioritizes *domain-specific causality* (quantum expertise) or *sector-wide predictors* (deep-tech risks), resolving the ambiguity from the AI paradigm dispute.
