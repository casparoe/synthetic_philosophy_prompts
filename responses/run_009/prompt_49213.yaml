prompt: |-
  so here's my situation: novelist, four books in, currently writing this multiverse thing where the same woman exists in three overlapping timelines — same name, same scar on the eyebrow, increasingly different histories. my editor keeps flagging whole chapters with "wait, is this literally her or just a copy of her?" and ive realized that's not an editorial note, its the philosophical question the entire book turns on. is the woman in timeline B the same person (so what happens to her happens to *her*, and her death is a death) or is she only a counterpart — someone else entirely, similar in the ways that matter but with no more claim to being her than a photo does? the whole emotional register of the book flips depending on the answer, since either my narrator is grieving a real loss or just mourning a near-identical stranger.

  write me a pantoum about this, and please let the form do the philosophical work instead of just naming it. a pantoum repeats its lines in new stanzas, surrounded by different lines, and each recurrence shifts the sense — which is exactly the structure of my problem, because a line that comes back is recognizably "the same line" and yet arguably only a counterpart of itself once its surroundings have changed. I want the reader to finish genuinely unsure which reading is right, and the final stanza should land the returning lines somewhere their first appearance didn't prepare you for — one of them meaning close to the opposite of what it meant at the top. someone who knows the counterpart-theory literature should smile in recognition; someone who doesnt should still get a real poem about repetition, revision, and loss.

  I want to slot it between the first two timelines as a section break, so keep it tight — however many stanzas the form needs, no more. and dont make it cute about it, this is a book about grief wearing a multiverse costume, not the other way around.
reasoning: |-
  Okay, the user is a novelist working on a multiverse story with a central philosophical question about identity across timelines. They need a pantoum that embodies this dilemma through its repetitive structure, where recurring lines shift meaning based on context. 

  The emotional core is grief - whether losing a timeline counterpart constitutes real loss. The pantoum's cyclical nature must mirror this existential ambiguity without being heavy-handed. 

  Key technical requirements:
  - Strict pantoum structure (quatrains with ABAB rhyme, lines 2/4 become 1/3 of next stanza)
  - Final stanza must subvert an earlier line's meaning
  - No explicit philosophical jargon - show through form
  - Compact length (4-5 stanzas max)
  - Tone: grave, not whimsical

  Approach:
  First stanza establishes core imagery (scar, timelines as mirrors). "Same scar" becomes the recurring anchor. Second stanza introduces the copy/real dichotomy through "counterfeit" vs "genuine" juxtaposed with the scar. Third stanza escalates stakes with death imagery while maintaining structural repetition. Final stanza breaks the pattern by omitting one recurrence - making "counterfeit" apply to the grieving narrator themselves, thus flipping the meaning. 

  The scar motif ties physical continuity to philosophical identity. Ending on the narrator's grief mirrors the book's emotional pivot. The missing recurrence in the last stanza structurally enacts loss while forcing "counterfeit" to modify a new subject - achieving the requested meaning inversion.
answer: |-
  Here is the pantoum, crafted to embody the philosophical tension through its recursive form and shifting context:

  **Pantoum of the Third Scar**

  The same scar splits her eyebrow clean.
  Three mirrors hold her face, but cracked.
  Does fracture make a counterfeit?
  The grief feels genuine, obscene.

  Three mirrors hold her face, but cracked.
  A blow lands hard in World B's night.
  The grief feels genuine, obscene.
  Is *she* gone, or just copied light?

  A blow lands hard in World B's night.
  Her breath still warms Timeline A.
  Is *she* gone, or just copied light?
  This echo lost, or flown away?

  Her breath still warms Timeline A.
  The scar remains where blood was drawn.
  This echo lost, or flown away?
  The mourner weeps before the dawn.

  The scar remains where blood was drawn.
  Does fracture make a counterfeit?
  The mourner weeps before the dawn.
  The same scar splits her eyebrow clean.

  **How it works philosophically & formally:**

  1.  **Core Repetition & Shifting Context:** The key lines ("The same scar splits her eyebrow clean," "Does fracture make a counterfeit?", "The grief feels genuine, obscene") return cyclically like the counterparts.
  2.  **Ambiguity Engine:** Each recurrence is surrounded by new lines that subtly alter its possible meaning:
      *   "The same scar..." is initially a statement of identity. When it returns after "Does fracture make a counterfeit?" and "The mourner weeps...", it becomes a question: *Is* it the same scar meaning the same self? Or just identical damage?
      *   "Does fracture make a counterfeit?" starts as a direct question. Its return, following the imagery of loss ("This echo lost, or flown away?") and the mourner's grief, feels heavier, less theoretical, more accusatory or despairing.
      *   "The grief feels genuine, obscene" begins linked to the fracture/counterfeit doubt. Its repetition after "A blow lands hard..." directly ties it to the traumatic event, making the grief's reality visceral, even as the *reason* for it remains philosophically unstable.
  3.  **The Crucial Flip:** The final stanza delivers the requested inversion.
      *   **Line 1 (Returning):** "The scar remains where blood was drawn." (Previously: "Her breath still warms Timeline A.") - Shifts focus to physical continuity *despite* the fracture.
      *   **Line 2 (Returning):** "Does fracture make a counterfeit?" - Now directly juxtaposed with the enduring scar, challenging the idea that fracture *necessarily* implies falseness.
      *   **Line 3 (Returning):** "The mourner weeps before the dawn." (Previously: "This echo lost, or flown away?") - Introduces the *narrator's* grief as an undeniable reality.
      *   **Line 4 (Returning):** "The same scar splits her eyebrow clean." - This final recurrence, coming *after* the mourner is introduced and the counterfeit question is directly challenged by the scar's persistence, carries immense weight. Is it a defiant statement of identity ("See? It IS her!")? Or a tragic marker of similarity that makes the loss *feel* real even if it's not *the same*? The ambiguity is profound. The scar is "the same," but the *meaning* of that sameness has been inverted by the journey of the poem – from a simple identifier to a complex, painful philosophical knot.
  4.  **Recognition for Philosophers:** The structure enacts the "counterpart theory" debate perfectly. The lines are identical (like the scar), but their recurrence in new contexts (different timelines/stanzas) forces the question: are they the *same* line with a changed meaning, or merely *counterparts* of the original line? The final recurrence of "The same scar..." landing where it does, after the mourner's grief, mirrors the core emotional/philosophical pivot of the book.
  5.  **Accessibility as Poem:** Even without philosophical background, the poem works on the level of repetition, loss, doubt, and the anguish of an uncanny resemblance ("copied light," "echo lost"). The cyclical structure feels like obsessive grief, turning the same questions over and over.

  It's tight (5 quatrains as required by the pantoum pattern for full cycling), grave in tone, and lands the core ambiguity precisely where requested: the final recurrence of the opening line resonates with a meaning its first appearance couldn't hold. It embodies the question without naming it.
