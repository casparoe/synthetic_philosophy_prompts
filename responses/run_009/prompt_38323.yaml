  For the gap analysis: Both Walzer and McMahan don’t consider how asymmetries impact MEC. Walzer’s convention relies on reciprocity, which modern warfare lacks. McMahan rejects MEC but his liability argument might also assume some symmetry. Highlighting this gap strengthens the proposal’s originality.

