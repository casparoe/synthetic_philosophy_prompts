prompt: |-
  so I'm doing the IB and my extended essay is in philosophy, and my supervisor is making everyone write a proper research proposal (like a page) before we break for summer, and I've got a topic but honestly only half of an idea. the topic is the "moral equality of combatants" thing in just war theory — the traditionalist view, the Walzer one, that a soldier fighting for an unjust cause is still morally equal to the soldier defending against them, they're both legitimate targets of each other and neither is a murderer, versus the revisionist line (McMahan is the name that keeps coming up) that this is insane, that if a mugger and the person he's mugging have a shootout we don't call them moral equals, and unjust combatants are at least doing something badly wrong even if they shouldn't be shot for it. my cousin is in the air force and operates drones and he made an offhand comment once that got me thinking — he says his side can see everything and the other side can't see him at all, and the "we're all just soldiers facing each other" picture doesn't describe anything he does.

  my half-formed idea is this: when you look at the actual arguments FOR moral equality, they all seem to quietly assume a symmetrical situation. mutual risk (both sides can kill and be killed), mutual visibility, roughly equal information about the war. and my thought is that modern war breaks all three at once, and not just with drones. so my question would be something like: is moral equality a genuine moral truth about soldiers, or is it more like a convention — like the rules of boxing, which make the fighters "equal" inside the ring regardless of who's in the right outside it — and if it's a convention, what happens to it in a fight where one boxer is blindfolded and doesn't know the bout has even been rigged? the bit I find exciting is that if the convention reading is right, maybe the traditionalists are right about yesterday's wars and wrong about the ones happening now, which is a conclusion neither camp seems to have on the table.

  anyway can you write me the proposal? what I need in it: the research question stated precisely enough that it has an actual answer and isn't just "discuss", a section on why the standard debate doesn't settle my question (both camps argue about liability but neither seems to ask whether the symmetry assumptions are load-bearing), a method section — what I'd actually do chapter by chapter across 4000 words, which I worry is way too small for this, tell me honestly — and crucially what would count as the essay failing, because my supervisor is obsessed with that for some reason. don't put citations in, I'll find those myself later. also if you think the duel/boxing analogy is a red herring and there's a better framing, say so, I'd rather know now than in November.
