answer: |-
  ## The Weight We Carry Forward

  Friends, neighbours. We gather today as we have for forty-three years. We speak the names. We lay the wreath. We stand together. But this September Sunday is different. It is the last time we will meet like this, in this hall, for this specific act of remembrance.

  That decision weighs on me. It weighed on our committee. We know it weighs especially on some of you here today – the four who voted to continue, and others, like Sarah, who have spoken of a fear that stopping means forgetting. That fear is real. Hearing it matters. To those of you holding that fear, holding that grief most closely: we see you. We are not here to dismiss what you feel, or to tell you it is time to put this down. We are here because we must find a way to carry it differently.

  For too long, perhaps, we have thought of this service – this sacred, painful ritual – as a kind of payment. A debt owed to the thirty-one souls lost, to the fourteen children, to the families shattered on that terrible day in 1981. We came year after year, reading the names, laying the wreath, feeling the weight of that obligation. And like any debt, there was a hope, however unspoken, that one day it might finally be paid off, settled, done. Yet that hope sat uneasily beside a deeper dread – the dread that stopping *would* feel like betrayal, like saying the debt was cleared when it never could be.

  Our late chaplain, who stood here reading those names for thirty years, offered us a different way. She spoke of memory not just as a debt, but as an inheritance. Think on that.

  A debt is owed *to* someone. It burdens the debtor until it’s paid, and once paid, it’s gone. Finished. An inheritance is different. It isn't *owed* to the person who left it. It comes to us unasked. We don't discharge an inheritance; we *receive* it. We hold it. We use it. We are changed by it. And then, crucially, we hand it on – not exactly as we received it, but shaped by our own lives, our own time.

  This service, these forty-three years… they weren’t an installment on a debt we hoped to finish paying. They were how we first learned to *hold* the inheritance. They taught us how to speak the unspeakable loss, how to stand together in the raw space grief leaves behind. They taught us the names, the stories, the sheer weight of what happened. They bound us as a community facing something too vast for any one person to carry alone. This ritual was the vessel we forged, year by year, to contain the enormity of that inheritance when it was too new, too sharp, too overwhelming to hold any other way.

  But an inheritance isn’t meant to stay locked in the vault, only brought out once a year. It’s meant to be lived with. It’s meant to shape the house we build. Ending this specific service isn’t about being finished with the flood. It isn’t about forgetting, or moving on as if it never happened, or being "healed" in some neat, complete way. How could we be? The scar remains. The absence echoes. The inheritance is still here, woven into the fabric of this town, into families, into the landscape itself.

  Ending the service is an acknowledgment that the vessel we needed then might not be the only way, or the forever way, to honour what we carry. It doesn’t settle a debt, because the memory wasn’t a debt to be settled. It was, and is, an inheritance to be lived. The question isn’t “Have we paid enough?” The question is, “What do we do now with what we have been given?”

  So, for next September – the first September without this service – we propose something different. Not an end to remembering, but a change in *how* we actively engage with this inheritance. We propose planting. We propose an orchard.

  On the high ground overlooking the river, the land where the water never reached, we will plant thirty-one trees. Young, strong, resilient trees. Fourteen will be fruit trees – apples, pears, plums – for the children. The rest will be native oaks and maples, for strength and enduring presence. Each tree will bear a small plaque with a name.

  This orchard won’t be a monument frozen in grief. It will be a living thing. It will grow. It will need tending – by schoolchildren, by volunteers, by anyone who wishes to put their hands in the earth and care for something that endures. It will bear fruit. We can gather that fruit, share it, bake with it, nourish ourselves with it. Children will climb in the strong branches. In time, those trees will offer shade, beauty, and a place simply to be – a place where the names are present, woven into the living landscape, not just spoken once and set aside. It’s a way to take the inheritance – the memory, the loss, the resilience learned – and *use* it. To put it back into the earth and let it grow something new. To hand it on, in a different form.

  Today, we do the familiar things one last time. We will speak the names of the thirty-one. We will lay the wreath at the weir, where the water took so much. We will feel that familiar ache, that shared weight.

  But after today, the work of memory doesn’t stop. It transforms. The orchard will be our promise: that the names aren’t forgotten, that the story isn’t over, that the inheritance is not locked away. It’s here. It’s growing. It’s something we tend, and harvest, and pass on.

  So now, let us speak the names. Let them fill this hall one last time in this way, not as a payment due, but as an acknowledgment of the profound inheritance they left us.

  *(Pause, then read the names slowly, clearly)*

  **(After the last name, a long, deliberate silence. Hold the pause. Let the names resonate in the quiet hall.)**

  The tea is ready. Let’s go.
