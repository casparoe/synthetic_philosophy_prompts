prompt: |-
  I keep hitting the same wall in the betterness literature: everyone insists 'better than' has to be transitive because anything else is irrational, and then the spectrum cases come along (trading duration of pain against intensity, or longer-but-duller lives against shorter-richer ones) and each local step seems fine while the global comparison seems obviously right. Before I pick a side I want the spec first, not another defense of one camp.

  So write me the desiderata: the list of things any adequate verdict on whether 'better than' is transitive has to get right — the cases it has to handle, the intuitions it has to explain rather than just wave off, the distinctions it can't collapse (worse vs. merely not-better, betterness vs. choiceworthiness, all-things-considered vs. pro tanto), and what it owes to the theory of choice, since transitivity is usually defended via choice principles and the spectrum cases seem to let you choose sanely at every step while walking into disaster. For each requirement, say what puts it on the list. Mark which ones you'd treat as non-negotiable and which are basically camp prejudices, and if you think some subset of them can't be jointly satisfied, say so — that part is what I most want to see, and don't soften it.

  No citations, I'll add those myself. If it helps to fix the purpose: I care about this as a question about the formal structure of betterness, not as a tiebreaker for any particular applied dispute.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're deep into the betterness literature and hitting a wall with the transitivity debate. Everyone says "better than" must be transitive for rationality, but spectrum cases like pain intensity vs. duration or life quality vs. length challenge that. Each step seems okay, but the global comparison feels wrong. The user wants desiderata—what any theory must handle—without taking sides yet.

  First, I need to identify the core issues. The user mentions key distinctions: worse vs. not better, betterness vs. choiceworthiness, all-things-considered vs. pro tanto. Also, the link to choice theory, where transitivity is often defended, but spectrum cases allow stepwise rational choices leading to disaster. The user wants a clear list of non-negotiables and negotiables, plus any inherent conflicts.

  Let me list the must-handle cases. Spectrum cases are central. The pain spectrum: slight pain for long time vs. intense pain briefly. Life quality: adding small benefits over time leading to a clearly worse life. Also, parity cases where options are on par but intransitivity arises. These need explaining, not dismissing.

  Distinctions matter. If a theory says two things aren't comparable, that's different from saying one isn't better. Collapsing worse and not-better is a problem. Betterness might be normative, but choiceworthiness involves practical constraints. All-things-considered vs. pro tanto: if pro tanto considerations conflict, how does that affect overall betterness?

  Choice theory is crucial. Transitivity is tied to avoiding money pumps or sequential choice problems. But in spectrum cases, each step is rational, yet the outcome isn't. How to reconcile that? A theory must address whether rational choice requires transitivity or if there's a way around it.

  Now, non-negotiables. The user wants to know which desiderata are essential. Accurate representation of core intuitions in spectrum cases? That's non-negotiable. Distinguishing worse from not better? Probably non-negotiable too. Choice constraints might be negotiable—some theories might separate betterness from choice rules.

  Conflicts? Here's the big one. If a theory insists on transitivity, it might have to deny that the last item in the spectrum is worse than the first. Or it might introduce vagueness, but then struggle with the sharp cutoff. If it rejects transitivity, it risks money pumps or undermines rational choice. So satisfying all desiderata might be impossible. The user needs to see this tension clearly without softening.
answer: |-
  Here's a breakdown of the core desiderata for adjudicating the transitivity of 'better than', structured around the demands you specify. The key tension lies in satisfying **I, II, III, IV, and V** simultaneously – a strong case can be made that this is impossible, forcing concessions.

  **Non-Negotiable Desiderata (Failure here means the theory is inadequate):**

  1.  **Accommodate Spectrum Cases Intuitions:** *What:* The theory must directly engage with the core phenomenological data: the strong intuition that each small step in a spectrum (e.g., reducing pain intensity slightly while increasing duration proportionally; adding a tiny period of slightly lower quality to a life) is *not worse* than (or may even seem marginally preferable/acceptable compared to) its immediate predecessor, *combined with* the strong intuition that the *endpoint* of the spectrum is *clearly worse* than the starting point. *Why Non-Negotiable:* Dismissing either intuition outright (e.g., insisting the first step *must* be worse, or denying the endpoint is worse) contradicts the very phenomenon driving the challenge. A theory must *explain* these intuitions, not deny them or explain them away as mere error.
  2.  **Respect the "Worse Than" / "Not Better Than" Distinction:** *What:* The theory must provide a clear account of when a relation signifies that A is *genuinely inferior* to B ("worse than"), versus when A simply lacks the properties making it *superior* to B ("not better than," which could encompass incomparability, parity, or equality). *Why Non-Negotiable:* Collapsing this distinction (e.g., interpreting "B is not better than A" *always* as "A is worse than B") destroys the possibility of non-trivial incomparability/parity and misrepresents the structure of value comparisons, particularly within spectrum arguments where steps might be "not worse" without being "better".
  3.  **Formal Coherence & Definite Output:** *What:* The theory must provide a determinate formal relation (or set of relations) governing comparisons. It cannot leave the comparative status of items fundamentally unresolved or indeterminate in a way that prevents reasoned evaluation or choice *in principle*. *Why Non-Negotiable:* Betterness relations are foundational for practical reasoning and normative theory. A theory rendering comparisons systematically indeterminate or incoherent fails its core function. (Note: This allows for *vagueness* at boundaries, but not global indeterminacy).

  **Highly Constraining Desiderata (Failure here severely weakens the theory, but proponents might bite the bullet):**

  4.  **Integrate with Plausible Choice Constraints:** *What:* The theory must offer a coherent account of rational choice, particularly in sequential decision contexts resembling spectrum cases. It must explain how an agent can make seemingly rational pairwise choices at each step without being forced into a "dominated" outcome (choosing the clearly worse endpoint over the start) or becoming vulnerable to exploitation (money pumps). *Why Constraining:* Transitivity is typically defended *because* it's seen as necessary for coherent choice. A theory rejecting transitivity owes an alternative account of rational sequential choice that avoids these pitfalls. Failure here makes the theory pragmatically dubious, even if formally possible.
  5.  **Handle Pro Tanto vs. All-Things-Considered (ATC) Betterness:** *What:* The theory must clarify the relationship between contributory value considerations ("pro tanto better/worse in respect R") and overall verdicts ("ATC better/worse"). *Why Constraining:* Spectrum arguments often exploit trade-offs between different value dimensions (intensity vs. duration; peak quality vs. duration). A theory must explain how these pro tanto considerations aggregate (or fail to aggregate) into an ATC betterness relation. Ignoring this risks misdiagnosing the source of intransitivity or conflating different levels of comparison.
  6.  **Preserve Core Asymmetry & Irreflexivity:** *What:* The theory should maintain that "A is better than B" implies "B is not better than A" (Asymmetry) and that "A is better than A" is false (Irreflexivity). *Why Constraining (but potentially negotiable):* These are deeply entrenched logical features of "better than". While one *could* define radically non-standard relations, abandoning asymmetry or irreflexivity drastically alters the meaning of "better than" beyond recognition for most purposes, making it less a theory *of* betterness and more a theory of something else. Most participants in the debate accept these.

  **Camp-Prejudices / Negotiable Desiderata (Reflecting background commitments, not core adequacy):**

  7.  **Analogy to Quantity/Measurement:** *What:* A preference for theories where "better than" behaves like "greater than" for measurable quantities (implying transitivity, completeness, and often an underlying cardinal structure). *Why Prejudicial:* This reflects a specific metaphysical view about value (measurability, commensurability) that the spectrum arguments directly challenge. Insisting on this analogy begs the question against non-transitive views.
  8.  **Strict Adherence to Revealed Preference/Choice:** *What:* The view that the *only* meaning of "better than" is derived from idealized rational choice, implying transitivity is definitional. *Why Prejudicial:* This collapses the distinction between betterness and choiceworthiness (Desideratum III explicitly separates them). It privileges a specific (behaviorist/decision-theoretic) methodology over phenomenological or normative analysis of value comparisons themselves.
  9.  **Avoidance of Vagueness/Epistemic Limitations:** *What:* A strong aversion to explanations invoking vagueness in the betterness relation itself or limitations in our ability to discern small differences. *Why Prejudicial:* While excessive vagueness undermines Desideratum III, *some* role for vagueness or epistemic constraints is a live and plausible option for explaining the "local indifference" in spectrum steps. Dismissing this entirely reflects a preference for sharp boundaries that may not exist in value.
  10. **Maintaining Completeness (Comparability):** *What:* The insistence that for any two distinct alternatives, one must be better than the other, or they must be equally good. *Why Prejudicial:* This is often bundled with transitivity in standard decision theory but is logically independent. Spectrum cases powerfully motivate allowing genuine incomparability or parity ("on a par") as a way to block transitivity without implying the endpoint is *better*. Rejecting incomparability/parity out of hand is a substantive commitment.

  **The Core Impossibility (Or At Least Profound Tension):**

  The fundamental conflict lies in satisfying **I (Spectrum Intuitions)**, **II (Worse/Not-Better Distinction)**, **III (Formal Coherence)**, **IV (Choice Constraints)**, and **V (Pro Tanto/ATC)** simultaneously within a single, coherent framework.

  *   **Option 1: Defend Transitivity:** To satisfy **I**, it must deny one intuition: either claim the *first step* *is* worse (denying the "local step seems fine" intuition), or claim the *endpoint is not worse* (denying the "global comparison seems obviously right" intuition). Both moves violate **I**. To avoid money pumps (**IV**), it usually requires sharp cutoffs or denying **II** (insisting "not better" *means* "worse" at the precise point where transitivity breaks). Explaining the *appearance* of non-worseness in steps often invokes vagueness or pro tanto trade-offs (**V**), but struggles to show why this doesn't *actually* imply non-transitive ATC betterness.
  *   **Option 2: Reject Transitivity:** Satisfies **I** fully by accepting both intuitions. Uses **II** crucially: spectrum steps are "not worse than" (due to parity, incomparability, or a non-transitive relation) but not necessarily "better," while the endpoints violate transitivity (Start > End). However, this faces severe challenges with **IV (Choice Constraints)**: How to avoid sequential choices leading to disaster or money pumps without *effectively* imposing transitivity via choice rules? Solutions (e.g., employing "sorites-resistant" choice functions, appealing to framing or context-dependence) are complex and often seen as ad hoc, potentially violating the spirit of **III** (formal coherence) or collapsing **VI (Betterness vs. Choiceworthiness)**. Integrating **V** is more natural (trade-offs create parity/incomparability) but requires a robust account of how pro tanto considerations aggregate non-transitively into ATC.

  **Conclusion:** You cannot smoothly preserve *all* the strong intuitions in spectrum cases (**I**) *while* maintaining a sharp distinction between "worse" and "not better" (**II**) *and* ensuring rational choice avoids dominance/vulnerability (**IV**) *within* a formally coherent framework (**III**) that respects pro tanto/ATC distinctions (**V**). **The spectrum cases expose a fracture point in our concepts.** Any adequate verdict *will* involve a significant concession: either modifying our core intuitions about local/global comparisons (sacrificing part of **I**), abandoning the hope for straightforward rational choice rules (**IV**), blurring the worse/not-better distinction (**II**), introducing significant vagueness that strains **III**, or radically rethinking the relationship between betterness and choice (**VI**). The "prejudices" (**VII-X**) often determine *which* concession seems least painful. The impossibility of satisfying all core constraints simultaneously is the crux of the problem.
