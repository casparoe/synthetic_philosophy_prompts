prompt: |-
  I've been trying to figure out my actual view on what to do when you're unsure about morality itself, and instead of reading more theory I decided to just go thorugh cases where I have a gut verdict and see what principle, if any, generates all of them:

  - I'm about 70% confident eating meat is seriously wrong (animal suffering) and 30% confident it's fine. Gut: I should cut way down and avoid the worst stuff, but I'm not obligated to be a strict vegan, and I wouldn't blame a friend in the same epistemic position who keeps eating normally.
  - I'm 60% deontologist about promises, 40% consequentialist. I promised my niece I'd take her to the park Saturday, and a volunteer thing came up that same afternoon where I could do a lot of good. Gut: keep the promise, and it's not close.
  - I'm only 40% confident there's a duty to vote, but I vote in every election and do quietly think worse of people who can't be bothered. Feels inconsistent even to me.
  - I'm maybe 30% confident that gossiping about friends is wrong, I gossip, feel basically fine about it, and yet I judge people who gossip maliciously. Thirty percent credence in wrongness seems like it should be too low for blame to come out — unless blame tracks something other than credence.
  - I'm 90% confident death is bad for the person who dies (deprivation view) and 10% Epicurean, and that 10% gives me zero pause about anything. Small credence in an extreme view counts for nothing here.

  So is there one principle that gets all five? The candidates seem to be the standard moral-uncertainty rules — maximizing expected choiceworthiness, majority vote among views, some hedging rule — but I don't think any of them delivers my verdicts uniformly (the promise case and the gossip case seem to pull in different directions, and I can't tell if that's because promises and gossip are different in kind or because one of the verdicts is just wrong). And there's the case I keep flip-flopping on: I have maybe a 1% credence that creating happy people is extremely good, and my gut says that 1% shouldn't dominate decisions about having kids — but if whatever principle saves the promise case can't say anything about the 1% case, I don't trust it. Tell me which of my verdicts have to go and what the surviving principle says about the kid question. Under 400 words please.
reasoning: |-
  Okay, the user is grappling with moral uncertainty and trying to find a consistent principle that aligns with their gut reactions across different scenarios. They've presented five cases where they have varying confidence levels in moral positions but their actions and judgments don't always match those probabilities. 

  Hmm, the core tension seems to be between epistemic humility and practical conviction. The user feels conflicted because their theoretical uncertainty doesn't translate neatly to action - like judging non-voters despite only 40% confidence in voting duty, or dismissing Epicureanism despite 10% credence. Interesting how the promise/gossip contrast highlights this: high-stakes promises demand certainty while low-stakes gossip allows judgment flexibility. 

  Ah! The key might be distinguishing two separate dimensions: (1) how much harm/benefit is at stake (consequential weight), and (2) how much social coordination matters (deontic weight). In the promise case, both dimensions align - breaking it harms trust (high consequence) and violates coordination norms (high deontic weight). But for voting, the consequence per vote is tiny while the coordination value is huge - explaining why they feel strongly despite low credence. 

  For the kid question... *pauses* The 1% credence in creating happy people being extremely good shouldn't dominate because: (a) the "harm" of not creating someone is abstract versus the concrete costs of raising a child, and (b) there's no coordination element like with promises. Their gut reaction here seems defensible. 

  *Nods* The surviving principle would be: When uncertainty is high but stakes are low (gossip), moderate action suffices. When stakes are high (promises, avoiding worst meat), act cautiously regardless of uncertainty. For structurally important norms (voting), uphold them firmly. And crucially - extreme minority views only matter when they point to catastrophic risks, not abstract gains.
answer: |-
  Your gut reactions reveal a nuanced principle: **act cautiously under uncertainty when stakes are high or norms are fragile, but discount low-probability views unless they warn of catastrophe**. Let's reconcile your cases:

  1.  **Meat eating:** High *uncertainty* (70% wrong), but *asymmetric stakes* (massive suffering vs. minor inconvenience). Caution demands cutting down, especially on worst practices. No strict vegan obligation reflects practical limits and social coordination costs.
  2.  **Promise:** *High stakes for coordination.* Breaking promises erodes trust even if consequentialism *might* justify it. Your 60% deontology isn't the driver; it's the *social fabric risk*.
  3.  **Voting:** *Low individual stakes* (your vote rarely matters), but *high systemic stakes* if norms collapse. Your judgment targets free-riders undermining the coordination mechanism, not the individual act's impact.
  4.  **Gossip:** *Low stakes per instance, context-dependent wrongness.* Malicious gossip risks real harm (reputation, trust), justifying blame. Benign gossip has minimal stakes, so low credence doesn't compel action. Blame tracks *actual harm risk*, not just credence.
  5.  **Death Badness:** 10% Epicurean view implies *no harm* – so no reason to act differently. Only views implying *preventable harm* demand caution under uncertainty.

  **The Principle:**  
  **Hedge against credible risks of significant harm given your uncertainty. Discount low-probability views unless they warn of severe, irreversible damage. Prioritize protecting fragile norms essential for cooperation.**

  **Which Verdicts Go?**  
  Your judgment of *non-malicious* gossipers might be inconsistent if based *only* on the 30% wrongness credence. Blame should track *demonstrable harm or malice*, not low-probability abstract wrongness.

  **The Kid Question (1% credence creating happy people is extremely good):**  
  This 1% view points to a *potential massive benefit*, not a *preventable harm*. The principle **discounts it**:  
  - No catastrophe is avoided by acting on it.  
  - Creating a life has massive, irreversible *costs and risks* (to you, the child, environment).  
  - The 99% uncertainty dominates. Your gut (ignore the 1%) is correct. Act based on near-certain responsibilities and risks.

  **In short: Focus on preventing probable harms and upholding critical norms. Ignore low-probability utopias.**
