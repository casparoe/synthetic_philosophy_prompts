  The user recognizes this mirrors the epistemicism vs supervaluationism debate in philosophy. Epistemicism would align with their "secret canon" approach - there are definite answers to every question about the fictional world, even if readers don't know them. Supervaluationism matches their editor's view - truth emerges only through specific interpretations or adaptations, and some questions genuinely have no answer.

