answer: |-
  ## Formal Rebuttal: Counterfactual Mugging & XOR Blackmail as FDT's Subjunctive Dependence Failures

  Your analysis correctly identifies the crux: FDT's treatment of subjunctive dependence – the counterfactual link between your decision procedure's output and the predictor's model – falters when confronted with branch-specific information asymmetry and independent state variables. I'll argue precisely for the reversal you propose: **non-payment in Counterfactual Mugging (CM) and payment in XOR Blackmail (XBM)**, exposing a critical flaw in how standard FDT handles the temporal and informational context of "precommitment-on-the-fly."

  ### Core Theses
  1.  **CM's Fatal Flaw:** FDT illegitimately converts an *ex ante* policy evaluation into an *ex post* prescription after branch resolution, ignoring that the "value" of the policy is sunk cost in the Tails branch. Subjunctive dependence alone cannot justify payment when branch-specific evidence renders the policy's counterfactual benefit causally inert and informationally irrelevant.
  2.  **XBM's Signaling Equilibrium:** FDT misdiagnoses the subjunctive dependence structure. Payment isn't *only* a costly signal; it's *informative*. A policy of paying creates a self-referential equilibrium where receiving the letter becomes strong evidence of *no termites*, making payment rational conditional on the letter's arrival. Refusal discards valuable evidence.
  3.  **Symmetry Breaker:** The critical difference is whether the predictor's model depends *causally and asymmetrically* on **independent state variables**. In CM, the coin flip branches are symmetric; the predictor models you identically in both. In XBM, the termite state (`T`) is a fixed fact *before* Omega runs its prediction; the predictor's model (`M`) depends on `T` *and* its prediction of your response (`Y`). Your decision procedure's output (`Y`) becomes entangled with learning about `T`.

  ---

  ### I. Counterfactual Mugging: Why Paying is Irrational *Ex Post*

  **FDT Argument (Standard):**  
  *   Let `P` be the policy "Pay if asked in Tails."  
  *   `U(P) ≈ 0.5 * $0 + 0.5 * $10,000 = $5,000`  
  *   `U(~P) ≈ 0.5 * $0 + 0.5 * $0 = $0`  
  *   FDT agent implements `P` because its decision procedure `F` outputs `Pay` when faced with CM, ensuring `F` is the type that gets $10,000 in Heads.

  **Refutation: The Sunk Policy Value & Branch-Specific Evidence**

  1.  **Temporal Misapplication of Policy Value:**  
      The value `U(P) = $5,000` is an *ex ante* expectation *before* the coin flip. It represents the expected utility of *adopting policy `P` as a precommitment* prior to the flip. Crucially, **this value is fully realized or sunk *by the time Omega asks you***.  
      *   In *Heads*, the value ($10,000) is already delivered or withheld based on Omega's *past* prediction of `P`. Your action *now* (in Tails) cannot retroactively cause or alter this.  
      *   In *Tails*, the *only* consequence of your action is the immediate loss of $100. The "benefit" of being type `P` ($10,000 in Heads) is a *sunk benefit* – it exists only in the counterfactual world where the coin was Heads. It provides no *actual* utility in the Tails branch.

  2.  **Subjunctive Dependence is Causally & Informationally Irrelevant in Tails:**  
      FDT relies on subjunctive dependence: "If my `F` outputted `Pay` now, then in the Heads branch, Omega predicted `Pay`, so my counterpart got $10,000." However:  
      *   **Causal Irrelevance:** Your action in Tails has *zero* causal effect on the Heads branch outcome.  
      *   **Informational Irrelevance:** You *know* you are in Tails (`No Envelope`). Knowing your decision procedure `F` outputs `Pay` tells you *nothing new* about the Heads branch outcome; it was already determined by Omega's prediction based on `F` *yesterday*. Your action reveals no hidden state.  
      *   **`F` as Identity, Not Lever:** Your decision procedure `F` is fixed. Running it *now* doesn't "make you the type" that gets $10,000 in Heads; you *already were* that type (or not) when Omega made its prediction. Implementing `Pay` in Tails merely *confirms* you are type `P`. It doesn't *create* the value in Heads; that value is gone.

  3.  **The Ex Post Rational Choice:**  
      Conditional on being in Tails (`No Envelope`):  
      *   `Pay` yields `-$100`  
      *   `Don't Pay` yields `$0`  
      Rational choice maximizes *actual* utility given *known* branch state: **Don't Pay**. The ex ante policy value is irrelevant; it's sunk. Prescribing payment mistakes the *evaluation* of the procedure for its *output* in a context where the procedure's counterfactual value is known to be unrealizable.

  **Strongest FDT Rejoinder & Rebuttal:**  
  *   **Rejoinder:** "FDT evaluates agents by the *lifetime performance of their decision procedure `F`*. `F` outputting `Pay` in *all* instances of CM (including Tails) is what *constitutes* it being the type that gets $10,000 in Heads. Refusing in Tails means your `F` isn't the `P` type, so you wouldn't have gotten the $10,000 in Heads either. The $5,000 expectation is the *only* relevant metric."  
  *   **Rebuttal:** This conflates the *definition* of the type with the *rationality of the action within a branch*. The agent *is* type `P` iff `F` outputs `Pay` in CM-Tails. However, *within the Tails branch*, the agent knows:  
      a) If they *are* type `P`, the $10,000 is already secured in Heads (but inaccessible in Tails).  
      b) If they *are not* type `P`, the $10,000 was already lost in Heads.  
      *Outputting `Pay` in Tails does not retrospectively cause them to be type `P`; it merely demonstrates that they are.* The utility consequence of *being* type `P` is entirely confined to the Heads branch, which is counterfactual from the perspective of Tails. Maximizing *branch-local* utility, given *known* branch state, requires `Don't Pay`. FDT's insistence on evaluating only the global procedure performance ignores the agent's situated knowledge at the decision point. The subjunctive dependence becomes an empty loop in the informationally saturated Tails branch.

  ---

  ### II. XOR Blackmail: Why Paying is Rational *Conditional on the Letter*

  **FDT Argument (Standard):**  
  *   Let `R` be the policy "Refuse to pay upon receiving the letter."  
  *   If `R`, then by Omega's sending condition: Letter is sent only if `(¬T ∧ Pay)` or `(T ∧ ¬Pay)`. Since `R` implies `¬Pay`, letter is sent only if `T` (Termites true). Receiving the letter under `R` means `T` is true. You have termites regardless of paying. Paying gains nothing.  
  *   An agent whose `F` implements `R` never receives the letter if `¬T` (no termites), thus avoiding the $1,000 cost entirely in the no-termites case. `U(R) = 0.5 * $0 + 0.5 * -$1,000,000 = -$500,000`.  
  *   Let `P` be "Pay upon receiving the letter." Under `P`, letter is sent only if `(¬T ∧ Pay)` or `(T ∧ ¬Pay)`. Since `P` implies `Pay`, letter is sent only if `¬T`. Receiving the letter under `P` means `¬T`. You pay $1,000 unnecessarily. `U(P) = 0.5 * -$1,000 + 0.5 * -$1,000,000 = -$500,500`.  
  *   `U(R) > U(P)`, so FDT agent implements `R` (Refuse).

  **Refutation: The Signaling Value & Conditional Information**

  1.  **FDT's Misplaced Focus on Precommitment:** The standard argument fixates on how `R` avoids the letter when `¬T`. However, **you have *already received* the letter**. The relevant question is *not* "Which policy minimizes the chance of receiving the letter?" but "**Given I have received the letter, what should I do *now*?**" FDT fails to properly condition on the evidence provided by the letter's arrival.

  2.  **Payment Creates Informative Signaling:**  
      The key is recognizing that your decision procedure `F` and Omega's prediction create a **signaling equilibrium** contingent on the fixed state `T`.  
      *   **Policy `P` (Pay):**  
          *   Omega sends letter iff `(¬T ∧ Pay)` or `(T ∧ ¬Pay)`.  
          *   If `F` outputs `Pay` (policy `P`), then Omega sends letter **only if `¬T`**.  
          *   Therefore, **Receiving the Letter ⇒ `¬T` (No Termites)**.  
          *   Conditional on receiving the letter under policy `P`: `P(T | Letter) = 0`. You *know* you have no termites. Paying $1,000 is costly, but avoids the *certainty* of a $1,000,000 repair bill you *would* face if you refused (since refusal would imply `T` is true, making the repair necessary regardless). Utility: `-$1,000`.  
      *   **Policy `R` (Refuse):**  
          *   If `F` outputs `¬Pay` (policy `R`), then Omega sends letter **only if `T`**.  
          *   Therefore, **Receiving the Letter ⇒ `T` (Termites)**.  
          *   Conditional on receiving the letter under policy `R`: `P(T | Letter) = 1`. You *know* you have termites. Refusing costs nothing now, but you face the $1,000,000 repair bill. Paying would be futile (letter condition requires `¬Pay` if `T`, so paying changes nothing about the termites). Utility: `-$1,000,000`.

  3.  **The Ex Post Rational Choice (Conditional on Letter):**  
      *   If you are a `P`-type agent: `Letter ⇒ ¬T` → `Pay` yields `-$1,000`; `Refuse` yields `-$1,000,000` → **Pay is better**.  
      *   If you are an `R`-type agent: `Letter ⇒ T` → `Pay` yields `-$1,001,000?` (Pay $1k + Repair $1M, refusal doesn't change T); `Refuse` yields `-$1,000,000` → **Refuse is better (but worse than `P`-type outcome)**.  

      Crucially, **an agent whose `F` is `P` has strictly better utility *conditional on receiving the letter*** (`-$1,000`) than an agent whose `F` is `R` (`-$1,000,000`). The *only* way to achieve the informative state where `Letter ⇒ ¬T` is to be a `P`-type agent. Therefore, the rational agent, understanding this self-referential structure, adopts `F = P` (Pay). Receiving the letter under `P` provides valuable information (`¬T`) worth far more than $1,000. Refusing under any policy discards this information gain.

  **Strongest FDT Rejoinder & Rebuttal:**  
  *   **Rejoinder 1:** "Adopting `P` means you *always* pay the $1,000 when you receive the letter, and you receive it *only* when `¬T`. But if you had adopted `R`, you would *never* receive the letter when `¬T`, thus saving the $1,000 cost entirely in that case. The ex ante expectation favors `R`."  
      *   **Rebuttal:** This rejoinder repeats the error of prioritizing the *ex ante* policy expectation over the *ex post* rational action *given the evidence*. Once the letter arrives, the `R`-type agent is doomed to lose $1M, while the `P`-type agent only loses $1K. Avoiding the letter in `¬T` is beneficial *ex ante*, but irrelevant *ex post* after the letter arrives. Rationality requires maximizing utility *given current information*, not globally minimizing the chance of encountering a decision scenario. `P` dominates `R` conditional on the decision node being reached.  
  *   **Rejoinder 2:** "FDT defines rationality by the procedure's output across all possible situations. An `R` procedure yields better overall outcomes by avoiding the shakedown in the `¬T` case."  
      *   **Rebuttal:** This assumes `¬T` and `T` are equally likely *and* that avoiding the cost in `¬T` outweighs the massive loss in `T` when the letter arrives. However, the critical flaw is that the `R` procedure *guarantees* maximum loss (`$1,000,000`) *if* the letter is sent (which happens iff `T`). The `P` procedure guarantees a small loss (`$1,000`) *if* the letter is sent (which happens iff `¬T`). The *difference* in loss severity conditional on the letter being sent makes `P` the safer and more rational procedure **when evaluated at the point of decision under uncertainty**, precisely because it creates favorable information upon receiving the signal. FDT's global aggregation hides this conditional dominance.

  ---

  ### III. The Symmetry Breaker: Independent State Variables & Causal Asymmetry

  The fundamental difference explaining the reversal lies in **how the predictor's model incorporates independent state variables**:

  1.  **Counterfactual Mugging (Symmetric Dependence):**  
      *   The state variable (Coin: `H`/`T`) creates symmetric branches.  
      *   **Omega's model `M` depends *only* on predicting your decision procedure `F`.** `M = Simulate(F)`.  
      *   The dependence between `F`'s output and `M` is **identical in both branches**: `M = F(CM-Scenario)`.  
      *   **Subjunctive dependence is symmetric and informationally inert post-branch-resolution.** Once you know `T`, `F`'s output tells you nothing new about `H`; it only confirms your type. The value is sunk.

  2.  **XOR Blackmail (Asymmetric Dependence):**  
      *   The state variable (Termites: `T`/`¬T`) is fixed *before* Omega acts.  
      *   **Omega's model `M` depends *jointly* on `T` *and* its prediction of `F`'s output `Y`.** `M = f(T, Simulate(F(XBM-Scenario)))`.  
      *   The sending condition `Send Letter iff (¬T ∧ Y=Pay) XOR (T ∧ Y=¬Pay)` creates an **asymmetric, conditional dependence** between `F`'s output (`Y`) and the hidden state `T`.  
      *   **Subjunctive dependence creates a signaling channel.** Your policy choice `F` (whether it outputs `Pay` or `¬Pay`) directly determines *what the event "Letter Received" signals about `T`*. This makes `F`'s output causally relevant *to your knowledge of `T`* conditional on the letter arriving.

  **Conclusion:** FDT correctly identifies the importance of subjunctive dependence but fails to properly account for the **informational context** of the decision (branch-specific knowledge in CM) and the **causal asymmetry** introduced by **independent state variables** that the predictor's model incorporates (the termite state in XBM). This leads to its prescriptions being reversed in these critical edge cases:

  *   In **Counterfactual Mugging (Tails)**, knowing the coin flip outcome renders the subjunctive link to the Heads branch causally and informationally inert. Payment is irrational; the policy value is sunk. **Verdict: Don't Pay.**
  *   In **XOR Blackmail**, the subjunctive link between your decision procedure and Omega's model, conditioned on the independent termite state, creates a valuable signaling equilibrium. Payment, conditional on receiving the letter, provides definitive evidence of no termites, which is worth far more than its cost. **Verdict: Pay.**

  **Concession:** FDT's core insights about subjunctive dependence remain powerful and correct in the canonical cases (Newcomb, PD, Parfit). Its "precommitment-on-the-fly" framing successfully handles many scenarios involving acausal influence. However, CM and XBM expose a limitation: FDT underestimates how **branch-specific information** can sever the *practical relevance* of subjunctive dependence (CM) and overestimates the cost of signaling while underestimating its **informational value** when dependence is entangled with independent state variables (XBM). A truly robust decision theory must integrate FDT's subjunctive reasoning with a principled account of conditioning on *all* available evidence, including the implications of one's decision procedure for the information state one finds oneself in.
