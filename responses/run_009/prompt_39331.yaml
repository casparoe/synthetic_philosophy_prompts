  Biggest challenge: Their probe-relativity criterion might *seem* like a drafts-leaning Trojan horse, but it’s actually a profound point about methodology. If a theory can’t handle probe-dependence without calling reports "illusions," it might be epistemically bankrupt. That’s non-negotiable disguised as a question.
answer: |-
  Here's the desiderata sorted by negotiability, with tensions flagged. Probe-relativity gets special attention at the end.

  ### **Core Desiderata (Non-Negotiable)**  
  *Must be explained by any viable theory; failure invalidates the account.*

  1. **Accommodate Illusory Content with High Confidence**  
     - **Cases:** Cutaneous rabbit (hops felt where no tap occurred), Color phi (confident report of intermediate color never shown).  
     - **Why Non-Negotiable:** Subjects genuinely experience these illusions and can’t distinguish them from reality. Denying this dismisses empirical data.  

  2. **Explain Postdictive Effects**  
     - **Cases:** Backward masking (later stimulus alters perception of earlier one), Libet-style postdiction (delayed awareness of intention).  
     - **Why Non-Negotiable:** Demonstrates temporal holism—later events reshape past conscious content. Theories must reject strict causal chronology.  

  3. **Treat Subjective Reports as Data (Not Inherent Noise)**  
     - **Requirement:** Cannot dismiss *all* timing reports as confabulation. Must explain why reports are *sometimes* reliable (e.g., detecting actual taps) but sometimes illusory.  
     - **Why Non-Negotiable:** If all reports are noise, consciousness becomes empirically unstudiable.  

  4. **Distinguish Neural Timing from Experienced Timing**  
     - **Requirement:** Must clarify whether "time of content-fixation in the brain" equals "time of experience." If not, explain the relationship.  
     - **Why Non-Negotiable:** Libet (brain activity precedes report) and phi (retrospective color change) show these can diverge.  

  ---

  ### **Theater-Leaning Desiderata**  
  *Often assumed by "Cartesian theater" models but not essential for adequacy.*

  5. **Determinate Onset Time for Conscious Contents**  
     - **Theater Commitment:** Insists every content has a precise "moment of entry" into consciousness.  
     - **Why Theater-Leaning:** Postdiction (e.g., backward masking) shows content can be revised after neural registration, making "onset" ambiguous.  

  6. **Co-Presence of Simultaneous Contents**  
     - **Theater Commitment:** All contents in a "moment" of experience are presented together at a single spatiotemporal locus.  
     - **Why Theater-Leaning:** Rabbit/phi suggest experiences are constructed from asynchronous inputs; no evidence for a unitary "stage."  

  ---

  ### **Drafts-Leaning Desiderata**  
  *Prioritized by multiple drafts models but not universally required.*

  7. **No Privileged Spatiotemporal Locus**  
     - **Drafts Commitment:** Rejects any single brain region or time-window as "where/when consciousness happens."  
     - **Why Drafts-Leaning:** Neural processing is distributed; no "finish line" for consciousness (e.g., readiness potential spreads over time).  

  8. **Probe-Dependence of Content**  
     - **Drafts Commitment:** Content is fixed only upon report (probe), not before.  
     - **Why Drafts-Leaning:** Theater models assume content exists pre-probe; drafts see probing as part of content construction.  

  ---

  ### **Key Tensions & Incompatibilities**  
  - **Fatal Tension:** **Determinate Onset Time (5) + Unbounded Postdiction (2)**  
    If later stimuli can revise earlier experience (e.g., color phi), there’s no stable "onset" moment. *Resolution requires abandoning (5) or limiting postdiction’s scope*—but evidence shows postdiction has wide temporal windows.  
  - **Major Tension:** **Co-Presence (6) + Illusory Sequences (1)**  
    Rabbit/phi involve *dynamic* constructions (motion/color change) that can’t be reduced to static snapshots. Favors drafts.  

  ---

  ### **Probe-Relativity: Genuine Requirement or Smuggled Conclusion?**  
  - **Your Desideratum:** A theory must explain how probing time/method affects reports (e.g., phi color varies with question timing).  
  - **Assessment:**  
    - **Genuine Requirement** (leaning non-negotiable).  
    - **Why:** Experiments (e.g., Sergent & Dehaene’s *Psychological Science* 2004) show probe timing changes visibility reports for identical stimuli. Denying this ignores empirical variance in reports.  
    - **Not Inherently Drafts-Leaning:** A theater *could* say probes access different "stages" of content—but this risks stretching the metaphor. Drafts handle it more naturally by making probing constitutive.  
    - **Constraint:** "Must not default to calling inconvenient reports illusions" **is valid**. Theories should explain *why* reports vary, not dismiss them.  

  ---

  ### **Do the Theories Die or Bruise?**  
  - **Cartesian Theater:**  
    - **Dies on** unbounded postdiction (2) and probe-relativity. If content is "projected" at time T, later revisions contradict T’s privileged status.  
    - **Bruises on** illusory content (1)—can reframe as "misprojection."  
  - **Multiple Drafts:**  
    - **Dies on** nothing core, but **bruises on** "feels like now" intuition. Doesn’t *feel* like we’re narrating after the fact.  
    - **Bruises on** determinacy (5)—if asked "when did you decide?" we feel there’s an answer.  

  ### **Conclusion**  
  An adequate theory **must** explain illusions, postdiction, and report variance without epistemic cynicism. **Incompatible poles:** "Onset determinacy" vs. "postdictive revisionism." Probe-relativity is a legit constraint—theories must account for how questioning sculpts retrospective experience.
