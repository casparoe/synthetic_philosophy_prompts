  ### **Scoring Key**  
  Map your answers to the positions below. Positions are defined by their core commitments, not labels. *Blind spots* (indistinguishable positions) and *unmapped patterns* (no defended view) follow.  

  | Position (Defender/Descriptive Label) | Core Commitment | Expected Answer Pattern |  
  |--------------------------------------|----------------|-------------------------|  
  | **Equal Standing** (R. Jay Wallace) | Hypocritical blame falsely claims moral superiority, violating equal moral standing. Blame is inappropriate when the blamer implicitly exempts themselves from the standard they enforce. | Q1:B; Q2:A or C; Q3:B; Q4:A; Q5:B; Q6:B; Q7:B; Q8:B; Q9:B; Q10:A or B. |  
  | **Interest View** (Unnamed; resembles Bell 2013) | Standing requires a personal stake in the wrongdoing (e.g., as victim, beneficiary, or relationally affected party). Detached observers lack standing. | Q1:C; Q3:B or C; Q4:B or C; Q5:C; Q7:C; Q8:C; Q9:A; Q10:B or C. |  
  | **Causal-Contribution View** (Patrick Todd) | Standing is defeated if the blamer causally contributed to the specific wrongdoing they condemn (directly/indirectly). Benefit without contribution does not defeat standing. | Q1:A or B; Q2:A or B; Q5:B; Q7:B; Q9:B; Q10:A. (Answers vary if no contribution.) |  
  | **Reform-Restores-Standing View** (Unnamed; common in theological ethics) | Past hypocrisy removes standing, but genuine repentance and reform fully restore it. Current compliance is insufficient without reform. | Q1:A; Q2:A; Q8:A; Q3:B; Q4:A; Q5:A; Q6:B; Q7:A; Q9:A; Q10:A. |  
  | **Skeptical View** (G.A. Cohen) | "You too" objections often legitimately defeat blame, not due to standing per se, but because hypocrisy undermines blame’s force. Standing is rarely a distinct barrier. | Q1:B; Q2:A or C; Q3:A; Q4:A; Q5:B; Q6:C; Q7:A or C; Q8:B; Q9:B; Q10:A. |  
  | **Role-Based Standing** (Unnamed; added for completeness) | Standing derives from social roles (e.g., teacher, judge) regardless of personal stake or history. Roles grant authority to blame. | Q1:A; Q2:A; Q3:A; Q4:A; Q5:A; Q6:A; Q7:A; Q8:A; Q9:A; Q10:A. |  

