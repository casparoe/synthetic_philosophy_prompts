answer: |-
  ### **Where Do You Stand on Standing?**  
  *A Moral Philosophy Quiz*  

  **Instructions:** For each scenario, choose the option that best captures what (if anything) is wrong with the blamer’s act of blaming. Assume the target deserves blame for their wrongdoing. Focus solely on the appropriateness of the *blame itself*, not the blamer’s character or the target’s desert.  

  1. **Reformed Critic**  
     Aaron quit gambling after a decade of addiction, publicly repented, and now leads a gambling-free life. He blames his friend Ben, who still gambles heavily, for hurting his family.  
     - (A) Nothing: Aaron’s past doesn’t negate his right to blame since he reformed.  
     - (B) Aaron shouldn’t blame: his history undermines his credibility, even with reform.  
     - (C) Aaron shouldn’t blame: only those never tempted can condemn gambling fairly.  

  2. **Hidden Double Standard**  
     Clara publicly condemns lying as immoral but often lies herself to avoid awkwardness (calling it "social grace"). She blames a colleague, Dev, for lying to a client.  
     - (A) Clara shouldn’t blame: condemning others while excusing herself is hypocritical.  
     - (B) Clara shouldn’t blame: hiding her own lies makes her blame dishonest.  
     - (C) Nothing: if Dev deserves blame, Clara’s hypocrisy is irrelevant.  

  3. **Untouched Observer**  
     Erin, who has never felt romantic attraction or been in a relationship, learns that her coworker Finn cheated on his partner. She blames Finn for betrayal.  
     - (A) Nothing: Erin’s lack of experience doesn’t prevent her from recognizing wrongs.  
     - (B) Erin shouldn’t blame: never facing temptation, her blame is self-righteous.  
     - (C) Erin shouldn’t blame: only victims of infidelity have the right to condemn it.  

  4. **Stranger’s Judgment**  
     A thief, Kai, steals from Lena. Lena (the victim) blames Kai. Separately, River, a stranger uninvolved in the theft, also blames Kai.  
     Focusing *only on River’s blame*:  
     - (A) Nothing: anyone can blame wrongdoing, regardless of personal involvement.  
     - (B) River shouldn’t blame: lacking a direct stake, River has no authority to condemn.  
     - (C) River shouldn’t blame: only victims like Lena can rightfully address such harms.  

  5. **Luck’s Role**  
     Jamie and Taylor both drive recklessly daily. Jamie hits a pedestrian (injuring them); Taylor has never caused harm. Jamie blames Taylor for reckless driving.  
     - (A) Nothing: reckless driving is wrong, and Jamie’s accident doesn’t void their standing.  
     - (B) Jamie shouldn’t blame: causing harm makes Jamie’s blame hypocritical.  
     - (C) Jamie shouldn’t blame: their bad luck makes them resentful, not authoritative.  

  6. **Selective Enforcement**  
     Leo forgives members of his activist group when they break protest guidelines but harshly blames members of an opposing group for identical violations.  
     - (A) Nothing: partiality to one’s group is natural and doesn’t affect standing.  
     - (B) Leo shouldn’t blame: applying rules unevenly makes his blame unfair.  
     - (C) Leo’s blame is misguided (the groups differ), but not due to a standing defect.  

  7. **Systemic Beneficiary**  
     Maya lives in a city where corporate tax evasion funds public services she enjoys. She blames an executive, Neil, for evading taxes. Maya pays her taxes fully and condemns evasion.  
     - (A) Nothing: Maya’s personal compliance gives her standing to blame Neil.  
     - (B) Maya shouldn’t blame: benefiting from the system makes her complicit.  
     - (C) Maya shouldn’t blame: only those harmed by evasion (e.g., underfunded schools) can.  

  8. **Group Hypocrisy**  
     Pastor Idris once embezzled church funds but repented and repaid the money years ago. With full congregational awareness, he blames a member, Zara, for embezzling.  
     - (A) Nothing: Idris’s repentance restores his moral authority.  
     - (B) Idris shouldn’t blame: his past hypocrisy undermines his standing permanently.  
     - (C) Idris can blame only if Zara is harming *him*; otherwise, others must intervene.  

  9. **Contributing Critic**  
     Ava and Bo both cut corners on a safety report. Ava’s omissions caused a minor incident; Bo’s caused none. Bo blames Ava for professional negligence.  
     - (A) Nothing: Bo’s lesser role doesn’t negate Ava’s greater blameworthiness.  
     - (B) Bo shouldn’t blame: sharing responsibility for the problem voids his standing.  
     - (C) Bo shouldn’t blame: his blame distracts from systemic issues.  

  10. **Detached Educator**  
      A student, Jae, bullies another student, Kim. Kim’s parent, Lou, blames Jae. Separately, a teacher, Morgan (who has no children), also blames Jae.  
      Focusing *only on Morgan’s blame*:  
      - (A) Nothing: Morgan’s role as a teacher grants standing to uphold school norms.  
      - (B) Morgan shouldn’t blame: lacking a personal stake (e.g., as a parent), Morgan has no standing.  
      - (C) Morgan shouldn’t blame: only direct victims like Kim or Lou can.  

