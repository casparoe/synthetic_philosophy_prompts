  - **Role-Based Standing** added to capture institutional authority (e.g., Q10). Not covered by your diagnostics; detected via Q10.  
  - **Defender attributions** are conservative. Wallace, Todd, and Cohen are explicitly cited; others are descriptive to avoid misattribution.  

