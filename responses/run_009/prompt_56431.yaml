      "Predictive equivalence means no behavioral test can distinguish 'true' distinct priors from conditioning a common prior on different signals.",
      "While CPA existence is mathematically well-defined for fixed state spaces and partitions, the modeler can always construct an empirically equivalent model with an expanded/refined state space and partitions where CPA holds by encoding disagreement sources as part of the prior's domain.",
      "Standard defenses (rationality, shared pre-divergence) reify the modeling choice into metaphysics, ignoring this representational flexibility."
