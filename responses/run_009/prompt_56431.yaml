answer: |-
  ## The Case for Conventionality: The Common Prior as Modeling Choice

  Your suspicion is well-founded. The common prior assumption (CPA) is best understood not as an empirical claim about agents' cognitive states, but as a *conventional choice* in how the modeler allocates the sources of belief differences between the prior probability distribution and the structure of agents' private information partitions. Its "truth" is relative to the modeler's descriptive framework, not an intrinsic property of the agents themselves. Here's the rigorous argument:

  1.  **Reparameterization Invariance of Belief Systems:** Consider any interactive belief system, specifying each agent's beliefs about the state of the world (including others' beliefs) at every possible state. Crucially, the *predictive content* of this system – what each agent would believe or do given any information they might receive – is determined by the *joint distribution* over states and signals (types). This joint distribution can always be factored in two ways:
      *   **"Different Priors" Representation:** Agents start with distinct prior beliefs `P_i(ω)`. Each agent `i` then receives a private signal `s_i` generated by a likelihood function `P(s_i | ω)`, leading to posterior `P_i(ω | s_i) ∝ P_i(ω) * P(s_i | ω)`. Differences arise fundamentally from the `P_i(ω)`.
      *   **"Common Prior" Representation:** A single prior `P(ω, s_1, s_2, ..., s_n)` is defined over the fundamental state space `ω` *and all private signals*. Agent `i`'s "type" is defined by their signal `s_i`. Their beliefs are derived by conditioning the common prior on their signal: `P(ω, s_{-i} | s_i) = P(ω, s_1, ..., s_n) / P(s_i)`. Differences arise solely from conditioning on different `s_i`.

  2.  **Predictive Equivalence:** These two representations are *predictively equivalent*. For any action, bet, or prediction an agent might make based on their information, the two models yield identical probabilistic predictions. The disagreement between agents manifests identically in both models. There is no conceivable behavioral test distinguishing whether agents "truly had different priors" or "conditioned a common prior on different signals."

  3.  **The Modeler's Choice: Defining the State Space & Partitions:** The key insight is that *what counts as the fundamental state `ω` versus a private signal `s_i` is a modeling decision*. The modeler chooses the granularity of the state space and how to partition it to represent agents' information. Consider agents disagreeing on a stock's value:
      *   **Model 1 (Different Priors):** `ω` = {Fundamental Value High, Fundamental Value Low}. Agent A has prior P_A(High)=0.7; Agent B has prior P_B(High)=0.3. No further signals. Differences are in the prior.
      *   **Model 2 (Common Prior):** `ω` = {Fundamental Value High, Fundamental Value Low} **x** {Agent A's Research Report: Bullish, Bearish} **x** {Agent B's Research Report: Bullish, Bearish}. The common prior `P(ω, Report_A, Report_B)` specifies the joint probabilities (e.g., correlation between reports and truth). Agent A learns `Report_A` (her partition groups states with the same `Report_A`); Agent B learns `Report_B`. Conditioning yields posteriors. Differences arise from conditioning on different reports.
      Both models explain the *observed disagreement* (Agent A believes P(High|Info)=0.7, Agent B believes P(High|Info)=0.3). Model 2 "hides" the source of disagreement (differential information access + correlated research quality) within the expanded state space and the common prior defined over it, while Model 1 attributes it directly to the priors.

  4.  **Addressing the Rejoinder: Fixed Partitions & Mathematical Non-Existence:** The strongest objection is correct: *Given a fixed state space and fixed information partitions*, the mathematical question of whether there exists a single common prior generating the agents' specified conditional beliefs (posteriors) at every information set is well-defined and non-trivial. The "No-Betting" theorem (Aumann, Nau, etc.) characterizes precisely when such a prior exists: agents cannot agree to a bet that each expects to win conditional on their information. This seems substantive.
      *   **The Conventionality Claim Survives:** The conventionality lies not in denying the mathematics *for a given model specification*, but in the *choice of the model specification itself*. If the modeler observes agents who seem to disagree *and* seem willing to bet (violating the no-betting condition *under the initial modeling of their information*), the CPA is mathematically impossible *for that specific state space and partition structure*. However, the modeler can *revise the model*:
          *   **Expand the State Space:** Introduce hypothetical states representing differences in interpretation, cognitive biases, or unmodeled prior experiences ("Agent A is inherently optimistic", "Agent B attended a pessimistic seminar"). Define new partitions based on these new states.
          *   **Refine the Partitions:** Make the existing partitions finer-grained to distinguish states the agents *could* be confusing but the initial model lumped together.
      *   **Theoretical Equivalence:** Crucially, after such revision, one can *always* construct a new model with an expanded/refined state space and partitions where:
          1.  The agents' *observed beliefs and betting behavior* are replicated.
          2.  A common prior *exists* over this new state space.
          3.  The disagreement is explained entirely by conditioning this common prior on different private information (signals/types) within the new partitions.
      The initial model without CPA and the revised model with CPA are *empirically equivalent* regarding the agents' actual beliefs and actions; they differ only in the *attribution* of the disagreement's source (fundamental prior vs. differential evidence encoded in the model's structure).

  **Conclusion:** The common prior assumption is a powerful modeling *convention* that shifts explanatory burden. By defining the state space sufficiently richly to subsume the sources of disagreement as part of the description of the world over which agents share beliefs *before* receiving their idiosyncratic evidence, the modeler can always attribute differences to information. Asking if agents "in fact" have a common prior is incoherent without specifying *how the modeler has chosen to draw the line between prior beliefs and private evidence*. Defenses appealing to rationality or a mythical pre-divergence state are attempts to reify this modeling choice into a metaphysical necessity. The CPA's power lies in its tractability and the elegant results it enables (like Harsanyi type spaces and no-betting theorems), not in its direct correspondence to an unobservable cognitive state shared by agents. Its "truth" is a function of the modeler's descriptive framework, not the agents' psychology.

  ---

