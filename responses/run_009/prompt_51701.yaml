prompt: |-
  I'm a retired population ecologist -- 30-odd years of modeling vole cycles and fish stock collapses -- and lately I've fallen down the philosophy-of-history rabbit hole. Turchin's cliodynamics stuff is catnip for someone like me: secular cycles, elite overproduction, structural-demographic models that he claims predicted the instability peak around 2020 in a Nature comment back in 2010 (if I remember right). My nephew is a proper historian and we've been arguing about this for two years now, and its gotten stale. He says people aren't voles and that fitting cycles to the past is just numerology until you predict something out of sample; I say population pressure and elite overproduction work the same on peasants and on tenure-track academics. Neither of us budges.

  I want you to write the joint statement we'd both have to sign if we did an actual adversarial collaboration instead of shouting over Thanksgiving dinner. So: the claims we both accept (about the historical data, about what both approaches can and can't do), the precise disagreements phrased so each of us would accept the wording of our own side, the cruxes -- I suspect one is whether "prediction" even makes sense for historical processes that respond to being predicted, and another is how many out-of-sample successes it would take before he'd take the models seriously -- and for each crux, the argument or test we'd both agree bears on it, with each side's prediction written down in advance. Numbered agreed claims first, then a disagreements table. And if part of our fight turns out to be about words rather than substance, tell me which part, because honestly I suspect the "laws of history" framing does half the damage here.
