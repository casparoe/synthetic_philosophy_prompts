prompt: |-
  I'm the standards editor at a mid-sized general-interest science magazine, and my fact-checkers keep getting into arguments they aren't equipped to referee. Our op-ed and freelance desk regularly runs pieces that lean on heritability numbers — twin-study estimates, sometimes SNP-based figures from genome-wide studies — to support conclusions about education policy, weight, mental health, or workplace behavior. The writers rarely misquote the number; what they do is slide from the number to a conclusion it doesn't license ("it's 60% genetic, so the school program can't matter"; "highly heritable, so trying to change it is futile"). My checkers have genetics and statistics training at roughly the college-course level, can read an abstract, but cannot reanalyze data or adjudicate a contested literature, and they have perhaps fifteen minutes per piece. I want a decision procedure they can actually run on a paragraph that cites a heritability figure: an ordered list of checks, each stated as a question about the piece, with what counts as a pass, what counts as a fail that requires revision, and where the check can't be completed from the text alone and has to be handed back to me. The checks should cover the ones I half-remember from my own reading — that heritability is a property of a population in an environment, so it moves when environments get more or less uniform; that a within-population figure says nothing about differences between populations; that heritable doesn't mean unchangeable; that twin and molecular estimates come apart, with the "missing heritability" gap cutting both ways. But the procedure also has to be able to pass a piece: if someone uses a heritability figure correctly — say, to argue that a trait's heritability in one setting doesn't preclude big environmental effects elsewhere — the procedure should say so, not just function as a veto machine. And it should mark, honestly, which steps are genuine checks with a determinate answer versus judgment calls dressed up as procedure, and at least one point where the remaining question is a value question ("should we intervene?") that no fact-check can settle.

  Then run the procedure on three paragraphs from our recent slush pile, which I'll paraphrase: (a) an op-ed citing a twin study reporting heritability around 0.6 for children's reading ability in a nationally representative sample, concluding that literacy gaps between schools largely reflect ability rather than teaching, so reading-intervention funding is being wasted; (b) a wellness piece citing a heritability estimate around 0.7 for body-mass index, concluding that since the trait is mostly genetic, urging individual dietary discipline is blame-adjacent nonsense and the piece's own advice should pivot to medical treatment; (c) a piece I personally liked — an argument for universal early dyslexia screening that leans heavily on reading disability being heritable — where I suspect the procedure will flag the use made of the number anyway, and I want it applied straight regardless of whose ox is gored. For (c), I'd especially like to see whether the procedure distinguishes "hereditary, so screen for it" (often fine) from "heritable, so fixed" (never fine), or whether that distinction turns out to be a judgment call the procedure has to punt on.

  Please also include a short section on where the procedure will misfire — the cases where the ordered checks give a confident verdict that's actually wrong, or where two reasonable checkers applying the same step would diverge. And throughout, tell me how confident you are in each part of what you claim, and single out the one point you're least sure of — if any check in your list is really your own reconstruction of the reasoning rather than something practitioners would recognize as standard, say so plainly rather than presenting it as settled method.
reasoning: |-
  We are creating a decision procedure for fact-checkers to evaluate the use of heritability figures in articles. The procedure is an ordered list of checks with clear pass/fail criteria and instructions for when to hand back to the editor.

  Key concepts to cover:
  1. Heritability is population- and environment-specific. It can change if the environment changes.
  2. High heritability does not imply that the trait is unchangeable (e.g., phenylketonuria is genetic but treatable).
  3. Heritability within a population says nothing about differences between populations (the "between-group fallacy").
  4. Twin study heritability (often from ACE models) and SNP-based heritability (from GWA studies) are different and may not agree (missing heritability issue). Also, each has limitations (e.g., twin studies assume equal environments, GWA studies only capture common variants).
  5. Heritability estimates do not imply inevitability or that interventions are futile.

  The procedure must also allow for correct uses (e.g., noting that high heritability in one setting doesn't preclude environmental effects elsewhere).

  We'll design a step-by-step checklist. Each step is a question with:
  - What to look for in the article (the check)
  - Pass: when the article uses the heritability figure appropriately in this regard.
  - Fail: when the article makes a mistake that requires revision.
  - Inconclusive: when the check cannot be completed from the text and must be handed back to the editor.

  Additionally, we must note which steps are determinate and which involve judgment.

  The procedure:

  1. **Check: Does the article correctly report the heritability figure?**
     - Look: Compare the number and the trait as stated in the article to the cited source (if provided in the text or available to the checker). If the source is not provided, note that.
     - Pass: The number and trait match the source.
     - Fail: The number or trait is misstated (e.g., says 0.7 when source says 0.6, or misstates the trait).
     - Inconclusive: The source is not cited or not accessible in the time, so we cannot verify the number. Hand back to editor for source check.
     - Confidence: High. This is a straightforward check if the source is available.

  2. **Check: Does the article acknowledge that heritability is specific to the population and environment studied?**
     - Look: Does the article mention or imply that the heritability estimate is for a particular population at a particular time? Or does it treat the estimate as universal?
     - Pass: The article either explicitly states the context (e.g., "in the UK in the 1990s") or uses language that limits the conclusion to similar contexts. Also passes if the article notes that heritability can change with environment.
     - Fail: The article uses the heritability estimate as if it is a fixed, universal property of the trait (e.g., "the heritability of reading ability is 60%", without context, and then applies it to a different context without caveats).
     - Inconclusive: The article doesn't provide enough context to determine if they are generalizing inappropriately, but the inference drawn might be about a different population. Hand back if unsure.
     - Confidence: Medium. This involves some interpretation of the author's intent and the scope of the conclusion.

  3. **Check: Does the article avoid the between-group fallacy?**
     - Look: Is the heritability estimate (which is about variation within a group) used to explain differences between groups (e.g., between schools, races, or countries)? This is a common mistake.
     - Pass: The article does not use the within-group heritability to explain between-group differences. If it discusses group differences, it explicitly notes that heritability within groups does not explain between-group differences.
     - Fail: The article uses the heritability estimate to argue that differences between groups (e.g., in schools) are due to genetic differences (e.g., "gaps between schools reflect genetic differences in ability").
     - Inconclusive: The article discusses groups but it's unclear if the groups are being compared as between-group or if it's about variation within a group. Hand back if unclear.
     - Confidence: High. This is a well-established fallacy (e.g., Lewontin's argument).

  4. **Check: Does the article avoid the fallacy that heritable means unchangeable?**
     - Look: Does the article imply that because a trait is heritable, it cannot be changed by the environment? Or that interventions are futile?
     - Pass: The article does not draw the conclusion that the trait is unchangeable. It may note that heritability does not imply immutability, or it may acknowledge the possibility of environmental interventions even for highly heritable traits.
     - Fail: The article concludes that because the trait is heritable, environmental interventions (e.g., school programs, diets) are pointless or will have minimal effect.
     - Inconclusive: The article is ambiguous about the implications for change. Hand back if the inference is unclear.
     - Confidence: High. The distinction between heritability and fixity is well-established.

  5. **Check: Does the article acknowledge the limitations of the method used to estimate heritability?**
     - Look: Does the article mention the method (twin, adoption, GWA study) and note any caveats? Especially, does it note that twin studies and SNP-based estimates can differ? Or that heritability estimates are subject to methodological issues (e.g., twin studies assume equal environments, GWA studies miss rare variants)?
     - Pass: The article mentions the method and has a caveat about the limitations, or if not, the conclusion drawn does not rely on the precision of the estimate or the method. Also passes if the article uses the estimate appropriately without overstepping the method's limitations.
     - Fail: The article uses the estimate without any acknowledgment of the method's limitations and the conclusion critically depends on the estimate being exact and universally accepted (e.g., ignoring the "missing heritability" problem or potential biases in twin studies).
     - Inconclusive: The method is not stated and the conclusion is drawn in a way that might be affected by the method's limitations. Hand back if the method is unknown and the conclusion is sensitive to it.
     - Confidence: Medium to High for common methods (like twin studies) because the limitations are well-known, but the checker must know the method from the citation.

  6. **Check: Does the article draw a conclusion that the heritability estimate does not support?**
     - Look: Is there a non-sequitur? Does the article use the heritability figure to support a claim that does not logically follow (even if the previous checks pass)? This is a catch-all for other misuses.
     - Pass: The conclusion is appropriately cautious and limited to what the heritability estimate can tell us (e.g., that there is a genetic component to variation in the trait in the studied population, or that in a uniform environment genetic differences would explain more of the variation). It may also correctly note that high heritability does not preclude environmental effects (if the environment changes).
     - Fail: The conclusion oversteps, such as making policy recommendations based solely on the heritability estimate without considering other factors, or using the estimate to make a causal claim that is not justified.
     - Inconclusive: The logic is complex and it's unclear if the conclusion is entirely supported. Hand back if the checker is unsure.
     - Confidence: Medium. This step involves more judgment and may require understanding the broader context.

  7. **Check: Does the article conflate heritability with heredity?**
     - Look: Does the article use "heritable" when it means "hereditary" (i.e., passed from parents to children)? Heritability is about the proportion of variance, while hereditary just means it can be inherited. This is particularly relevant for (c) where screening might be justified by heredity (family history) even if heritability is not 100%.
     - Pass: The article uses the term correctly (heritability for the statistic) and does not use it to simply mean that the trait runs in families. Or, if the article uses it to mean hereditary, it does so without drawing incorrect inferences from the heritability statistic.
     - Fail: The article uses the heritability estimate to support a claim that is actually about heredity (e.g., "because reading disability is heritable [with h²=0.6], it is passed from parents to children, so we should screen children of dyslexic parents") without acknowledging that heritability does not directly predict transmission in families (because it's a population statistic). However, note that high heritability does imply that family history is a risk factor, so the distinction can be subtle. The key is whether the article is using the heritability number to quantify the risk (which it doesn't directly) or just to note that genetics plays a role.
     - Inconclusive: The use is ambiguous. Hand back if the checker cannot determine if the author is conflating the terms.
     - Confidence: Medium. This is a subtle point and may require interpretation.

  Additionally, we note that step 6 might involve value judgments (e.g., whether an intervention is worthwhile) that are beyond fact-checking. We should flag that.

  **Procedure Summary (Ordered Checks):**
  1. Check the number and trait against the source (if available).
  2. Check for contextual specificity (population and environment).
  3. Check for between-group fallacy.
  4. Check for unchangeability fallacy.
  5. Check for acknowledgment of method limitations.
  6. Check for non-sequiturs or overreaching conclusions.
  7. Check for conflation of heritability with heredity.

  If any step fails, the piece requires revision. If any step is inconclusive, hand back to the editor.

  Now, we apply this procedure to the three examples.

  **Example (a): Op-ed on reading ability**
  - Paraphrase: Cites twin study heritability ~0.6 for children's reading ability in a nationally representative sample. Concludes that literacy gaps between schools largely reflect ability rather than teaching, so reading-intervention funding is wasted.

  Step-by-step check:
  1. **Number and trait:** We assume the number is correctly reported (pass).
  2. **Context specificity:** The article uses a nationally representative sample, but then applies it to differences between schools. It does not acknowledge that heritability might be different in different school environments. It generalizes from the population to between-school differences without caveats. **Fail.**
  3. **Between-group fallacy:** The conclusion is about gaps between schools (between-group differences) and attributes them to genetic differences in ability. This is a classic between-group fallacy. **Fail.**
  4. **Unchangeability fallacy:** It concludes that intervention funding is wasted, implying that because reading ability is heritable, interventions won't work. **Fail.**
  5. **Method limitations:** The article cites a twin study but does not note limitations (e.g., equal environment assumption). The conclusion relies on the estimate being exact. **Fail.**
  6. **Overreaching conclusion:** The conclusion that funding is wasted does not follow from the heritability estimate alone. It ignores that heritability does not preclude environmental effects and that the estimate is for variation within the population, not between schools. **Fail.**
  7. **Conflation with heredity:** Not apparent in this example. **Pass.**

  Verdict: Multiple fails. Requires revision.

  **Example (b): Wellness piece on BMI**
  - Paraphrase: Cites heritability estimate ~0.7 for BMI. Concludes that since it's mostly genetic, urging individual dietary discipline is blame-adjacent nonsense and should pivot to medical treatment.

  Step-by-step check:
  1. **Number and trait:** Assume correct (pass).
  2. **Context specificity:** The article does not specify the population, but we'll assume it's from a study in a similar population. However, it does not acknowledge that heritability might be different in environments with more uniform diets. It treats the estimate as universal. **Fail.**
  3. **Between-group fallacy:** The piece does not discuss between-group differences, so **pass**.
  4. **Unchangeability fallacy:** It does not say that BMI cannot be changed, but it does argue that because it's genetic, individual dietary discipline is not the right approach. This is a more subtle issue. The article is not saying that environmental changes (like diet) don't matter, but that focusing on individual discipline is misplaced. However, it does imply that because it's genetic, the individual-level dietary intervention is futile. So, **fail** on unchangeability? But note: the article is not saying that medical treatment (which might be environmental, e.g., drugs or surgery) can't work. It's shifting the focus. However, the argument that because BMI is heritable we should not focus on diet is a non-sequitur. We'll see in step 6.
  5. **Method limitations:** The article does not note the method or limitations. If the estimate is from a twin study, it might be inflated. If from GWA, it might be lower. The conclusion relies on the high heritability. **Fail.**
  6. **Overreaching conclusion:** The conclusion that we should pivot to medical treatment because of heritability is not justified. Heritability does not imply that environmental interventions (including dietary) are ineffective. In fact, even highly heritable traits can be environmentally altered. The article also draws a normative conclusion (that urging discipline is blame-adjacent) which is partly a value judgment. However, the fact-checker can only check the factual basis: the heritability figure does not license the claim that individual dietary interventions are ineffective. **Fail.**
  7. **Conflation with heredity:** Not apparent. **Pass.**

  Verdict: Multiple fails. Requires revision.

  **Example (c): Argument for universal early dyslexia screening**
  - Paraphrase: Leans heavily on reading disability being heritable to argue for universal screening.

  Step-by-step check:
  1. **Number and trait:** Not provided, but we'll assume it's cited correctly (pass).
  2. **Context specificity:** The article may or may not specify the population. If it does, pass; if not, fail. We don't have the exact text, so we'll assume it's from a study and the context is appropriate. **Pass** (if context is given) or **inconclusive** (if not). For the sake of this exercise, we'll assume it passes because the editor says the piece leans on heritability and the context is likely given.
  3. **Between-group fallacy:** Not discussing between-group differences. **Pass.**
  4. **Unchangeability fallacy:** The argument for screening does not imply that dyslexia is unchangeable. In fact, early screening is meant to enable intervention. So, **pass.**
  5. **Method limitations:** The article may not discuss limitations. If it doesn't, and the conclusion relies solely on the heritability estimate without caveats, then it might fail. However, the argument for screening might be based on the idea that dyslexia has a genetic component and early identification is beneficial, which is supported by heritability but does not require the exact estimate. So, if the article presents the heritability as one piece of evidence among others (like family studies) then it's okay. Without the exact text, we'll assume it fails on this step if it only cites heritability and doesn't mention other evidence. But the editor says it "leans heavily" on heritability, so it might not mention limitations. **Inconclusive** without text, but let's say **fail** if it doesn't mention limitations and the conclusion depends on the precision of the estimate.
  6. **Overreaching conclusion:** The conclusion that we should have universal screening because dyslexia is heritable might be overreaching. Heritability alone doesn't necessarily justify universal screening (as opposed to targeted screening of high-risk groups, such as those with family history). However, if the article uses heritability as evidence that genetics plays a role and therefore universal screening is warranted (perhaps because family history is not always known, or because of other reasons), then it might be acceptable. The editor notes that the piece uses it correctly? But the procedure must be applied objectively. The key is whether the article is using the heritability to imply that the condition is fixed (which it isn't) or simply that it has a genetic basis. Also, heritability doesn't directly say anything about the effectiveness of screening. So, without additional arguments (e.g., that early intervention is effective), the conclusion might not follow. This step might be **fail** if the heritability is the only reason given for universal screening. But if the article also cites evidence that early intervention is effective, then it passes. Without text, we'll say **inconclusive** and hand back to editor. However, the editor says the piece "leans heavily" on heritability, so it might be the primary reason. We'll mark **fail** if the heritability is the main argument without other support.
  7. **Conflation with heredity:** This is critical. The article is arguing for screening, which is often justified by heredity (family history). But heritability is a population measure. If the article uses the heritability estimate (say, h²=0.6) to argue that because it's heritable, it runs in families and therefore we should screen, that's a conflation. However, high heritability does imply that family history is a risk factor. The article might be using the heritability to establish that genetics is involved, which is a prerequisite for genetic screening. But universal screening is not the same as family-based screening. The argument might be: because it's heritable (and therefore has a genetic component) and because early intervention is effective, universal screening is beneficial. That might be acceptable. But if the article says: "because heritability is high, we should screen everyone", that's a non-sequitur. The editor asks whether the procedure distinguishes "hereditary, so screen for it" (which is often fine) from "heritable, so fixed" (which is not). The key is that the procedure in step 7 is about conflation of terms. If the article uses the term "heritable" correctly and then argues for screening based on the genetic basis (without implying fixity), then it passes. But note: step 6 might catch an overreach if the heritability alone is used to justify screening without other arguments. We'll assume the article does not conflate the terms (pass on step 7) but might fail step 6.

  Given the ambiguity, we note that without the exact text, we have to make assumptions. The editor says they liked the piece and suspect the procedure will flag it. Let's be conservative:

  - Step 5: Fail (if no caveats about method limitations)
  - Step 6: Fail (if the heritability is the main argument without additional reasons for universal screening)

  But note: the editor's point is that the piece uses heritability to argue that dyslexia is hereditary (which it is) and therefore screening is justified. However, the procedure might flag it because the justification for universal (vs. targeted) screening might require more than heritability. Also, heritability is not the same as heredity, but high heritability does indicate that family history is a risk factor. The step 7 check is for conflation of terms, not for the policy recommendation. So step 7 might pass.

