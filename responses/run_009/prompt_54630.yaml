  Below is a clear breakdown of the different precise claims that "the expected value doesn't exist" could be making for the Pasadena game, based on the mathematical properties of the game. For each claim, I indicate whether it is true for this game, whether it is trivial or substantive, and whether it supports your friend's move from "expected value doesn't exist" to "there's no fact of the matter about what you should pay." I also address which claims might license the idea that a 69-cent subsidy makes the game fair versus which claims genuinely leave no rational basis for choosing a price.

  The Pasadena game is defined as follows: a fair coin is tossed until the first heads appears on toss \(n\). The payoff to the player is \((-1)^n \cdot 2^n / n\) dollars. This means:
  - When \(n\) is odd, the player pays the house (payoff is negative, e.g., \(n=1\): \(-2\) dollars).
  - When \(n\) is even, the house pays the player (payoff is positive, e.g., \(n=2\): \(+2\) dollars).
  - The probability of the first heads on toss \(n\) is \(P(N=n) = (1/2)^n\).

  The expected value (EV) is given by the series:
  \[
  E[X] = \sum_{n=1}^{\infty} X(n) P(N=n) = \sum_{n=1}^{\infty} \left[ (-1)^n \cdot 2^n / n \right] \cdot (1/2)^n = \sum_{n=1}^{\infty} (-1)^n / n.
  \]
  This series is the negative of the alternating harmonic series, which converges conditionally to \(-\ln 2 \approx -0.693\) dollars (about \(-69\) cents) in the natural ordering (i.e., summing terms for \(n=1, 2, 3, \ldots\) in sequence). However, it is not absolutely convergent because the series of absolute values, \(\sum_{n=1}^{\infty} |(-1)^n / n| = \sum_{n=1}^{\infty} 1/n\), is the harmonic series, which diverges to infinity.

  ### Summary of Claims
  Here are the key claims, evaluated for truth, triviality/substantiveness, and support for your friend's normative conclusion ("no fact of the matter about what you should pay"). The claims are ordered from most mathematical to more interpretive.

  1. **The series diverges in the natural ordering (i.e., it does not converge to a finite or infinite limit when summed sequentially by \(n\)).**
     - **Truth:** False. The series \(\sum_{n=1}^{\infty} (-1)^n / n\) converges conditionally to \(-\ln 2\) in the natural ordering. It does not diverge.
     - **Trivial/Substantive:** Trivial if one checks convergence; substantive in the sense that divergence would imply no EV, but it doesn't apply here.
     - **Supports "no fact of the matter"?** No. Since the series converges, this claim does not challenge the existence of a limit in the natural order. It does not support the idea that there's no fact of the matter.

  2. **The series is not absolutely convergent (i.e., the expected absolute value \(E[|X|]\) is infinite).**
     - **Truth:** True. \(E[|X|] = \sum_{n=1}^{\infty} |(-1)^n / n| = \sum_{n=1}^{\infty} 1/n = \infty\), so the series converges conditionally but not absolutely.
     - **Trivial/Substantive:** Substantive, as absolute convergence is a stronger condition than convergence and is key to many definitions of the EV in probability theory.
     - **Supports "no fact of the matter"?** Partially, but not decisively. Absolute convergence is a common requirement for the EV to be well-defined and robust (e.g., immune to rearrangement). Its absence raises issues but does not, by itself, imply that the EV "doesn't exist" in all contexts (e.g., St. Petersburg has no absolute convergence but has a defined EV of \(\infty\)). Thus, it supports the friend's point weakly but is not sufficient alone.

  3. **The Lebesgue integral is undefined because both the positive and negative parts have infinite expectation (i.e., \(E[X^+] = \infty\) and \(E[X^-] = \infty\), where \(X^+ = \max(X, 0)\) and \(X^- = \max(-X, 0)\)).**
     - **Truth:** True. Here, \(X^+\) corresponds to the positive payoffs (even \(n\)), and \(X^-\) to the negative payoffs (odd \(n\)). The expectations are:
       \[
       E[X^+] = \sum_{k=1}^{\infty} \frac{1}{2k} = \infty, \quad E[X^-] = \sum_{m=1}^{\infty} \frac{1}{2m-1} = \infty.
       \]
       Since both are infinite, the Lebesgue integral (and thus the EV) is undefined in standard measure-theoretic probability.
     - **Trivial/Substantive:** Highly substantive. This is the core mathematical reason why many probabilists say the EV "doesn't exist" for such games. It is a standard definition in rigorous probability theory (e.g., based on the requirement that \(E[|X|] < \infty\) for integrability).
     - **Supports "no fact of the matter"?** Yes, strongly. This claim directly implies that the EV is not defined in the most common formal sense, making it impossible to assign a unique fair price based on expectation. It supports the move to "no fact of the matter" because, without a defined EV, no price can be derived from it.

  4. **By the Riemann rearrangement theorem, the series can be rearranged to converge to any real number (or diverge), so the value depends on the order of summation.**
     - **Truth:** True. Because the series converges conditionally but not absolutely, rearranging the terms (i.e., changing the order of summation) can yield any real number for the sum (e.g., 0, 100, or \(-\ln 2\)), or cause divergence.
     - **Trivial/Substantive:** Substantive. This highlights a lack of robustness: the EV is sensitive to how outcomes are ordered or grouped, which has no real-world meaning in a sequential game like this.
     - **Supports "no fact of the matter"?** Yes. Even though the game has a natural ordering (by toss number \(n\)), the rearrangement theorem shows that the EV is not unique mathematically. If we consider different ways to "bookkeep" the outcomes (e.g., grouping high-payoff terms early), we could justify any fair price, undermining the idea that 69 cents is special. This supports the friend's conclusion that there is no objective fact about the fair price.

  5. **The partial sums oscillate and do not stabilize for finite truncations, so no practical implementation yields a consistent value.**
     - **Truth:** False. When the game is truncated at a finite maximum toss \(N\) (e.g., if no heads by \(N\), payoff is 0), the partial sums \(S_N = \sum_{n=1}^{N} (-1)^n / n\) oscillate around \(-\ln 2\) with decreasing amplitude (e.g., \(S_1 = -1\), \(S_2 = -0.5\), \(S_3 \approx -0.833\), \(S_4 \approx -0.583\), etc.), converging to \(-\ln 2\) as \(N \to \infty\). For large \(N\), it is close to \(-\ln 2\).
     - **Trivial/Substantive:** Trivial in this context, as the oscillation is typical of conditionally convergent series but does not prevent convergence.
     - **Supports "no fact of the matter"?** No. The finite-game EV approaches \(-\ln 2\), suggesting that 69 cents is a reasonable approximation for large \(N\). This claim does not support the friend's move.

  ### Which Claims Support the Move to "No Fact of the Matter"?
  - **Strong support:** Claims 3 and 4. Claim 3 (undefined Lebesgue integral) is the foundational mathematical reason why the EV is not considered to exist in standard probability theory. Claim 4 (rearrangement theorem) shows that even if we use the natural order, the value is fragile and not unique. Together, they imply that there is no well-defined expectation to base a fair price on, making it rational to say "there's no fact of the matter."
  - **Weak or no support:** Claims 1, 2, and 5. Claim 1 is false and irrelevant. Claim 2 (no absolute convergence) is necessary for the problems but not sufficient (as St. Petersburg shows). Claim 5 is false and does not challenge convergence.

  ### Does Any Claim License "69 Cents is Fair"?
  - **Yes, but only under specific interpretations:** If one insists on the natural ordering and accepts conditional convergence as sufficient for defining the EV (e.g., as a "principal value" or limit), then \(E[X] = -\ln 2 \approx -0.69\) dollars. This licenses the statement: "At a 69-cent subsidy (i.e., the player receives 69 cents to play), the net expected gain is approximately zero, so demanding 69 cents from the player to play is fair." This is the "obvious ordering" you mentioned, and it holds if we:
    - Fix the natural sequence of tosses.
    - Ignore the requirement for absolute convergence or Lebesgue integrability.
    - Assume the infinite game can be realized or approximated well by finite truncations.
  - However, **claims 3 and 4 undermine this**: 
    - Claim 3 (undefined Lebesgue integral) means that in rigorous terms, there is no EV, so no price can be fairly derived from it.
    - Claim 4 (rearrangement) shows that by reordering outcomes (e.g., to make the series sum to 0), we could justify a price of $0 as "fair," or any other price. Thus, 69 cents is not uniquely rational—it is an artifact of the bookkeeping.

  ### Which Claims Lead to "No Price is More Rational Than Another"?
  - **Claims 3 and 4 directly lead to this:** 
    - Because the EV is undefined (Claim 3), there is no mathematical expectation to serve as a benchmark for a fair price. Decision theory (e.g., maximizing expected utility) cannot be applied consistently.
    - Due to rearrangement (Claim 4), any price can be made to seem "fair" by reordering the terms, so no single price is objectively better. For example:
      - To make the EV 0, rearrange so positive and negative terms balance differently; then paying $0 is "fair."
      - To make the EV $100, rearrange to emphasize high-positive-payoff terms; then paying $100 is "fair."
    - Thus, claims 3 and 4 support your friend's stance that no fact of the matter exists: no price is more rational than another because the expectation itself is not a reliable guide.

  ### Contrast with St. Petersburg
  - In the St. Petersburg game, the EV is infinite (\(E[X] = \sum_{n=1}^{\infty} 2^n \cdot (1/2)^n = \sum_{n=1}^{\infty} 1 = \infty\)). Even though \(E[|X|] = \infty\), the EV is defined as \(\infty\) because \(E[X^-] = 0\) and \(E[X^+] = \infty\). Thus, "doesn't exist" is not used; instead, "infinite" implies any finite price is a bargain.
  - For Pasadena, both \(E[X^+]\) and \(E[X^-]\) are infinite (Claim 3), so the EV is undefined. This is why your friend switches registers: "doesn't exist" (Pasadena) vs. "infinite" (St. Petersburg) are distinct mathematical statements with different implications for decision-making.

  ### Conclusion
  Your friend is technically correct that the expected value doesn't exist for the Pasadena game based on Claims 3 and 4 (the Lebesgue integral is undefined, and rearrangement changes the sum). These claims support his move to "no fact of the matter about what you should pay" because they show that the expectation is not well-defined or unique, leaving no rational basis for choosing a fair price. While the natural ordering suggests 69 cents as a fair subsidy, this is not robust under mathematical scrutiny.

  If you want to push back, you could argue for accepting conditional convergence in the natural order as a practical definition (especially since the game has a sequential structure). However, in formal probability, Claims 3 and 4 are decisive and align with your friend's position. Bringing this list to him might clarify that the issue is not about divergence (Claim 1) or truncation effects (Claim 5), but about the lack of absolute convergence and its implications.
