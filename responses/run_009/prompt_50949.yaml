prompt: |-
  I became a naturalized citizen this spring, and I am now preparing to vote in my first national election. In the months since the ceremony, I have noticed something strange about the cluster of norms that surrounds the act of voting in my adopted country, and I would like some help figuring out what philosophical commitments it rests on. On one hand, everyone from my civics instructor to the volunteers registering voters outside the supermarket treats voting itself as a duty: low turnout is described as a civic disgrace, people who stay home are said to have forfeited their standing to complain about the government, and the whole apparatus of get-out-the-vote campaigns, reminder text messages, and stickers seems designed to celebrate the act of participating rather than any particular way of participating. Yet I gather that a single vote has an astronomically small chance of changing any outcome, so it is hard to see what the duty could be a duty *to*, if what matters is the result. On the other hand, when the subject turns from whether to vote to how to vote, the message becomes strikingly consequentialist: in a closely contested race I am told that voting for a third-party candidate is throwing my vote away, or even a tacit gift to the greater evil, and that I must support the lesser evil however tepidly. But friends who live in states where the outcome is a foregone conclusion tell me the same people would urge them, without embarrassment, to vote their conscience there. The same normative system, in other words, seems to treat my vote as weightless in its effects yet mandatory as an act, and as binding in its content only where its effects are non-negligible. I am told some countries even make voting legally compulsory, which would sharpen the puzzle further.

  What I would like is a reconstruction of the implicit theory here. Does the duty-to-vote side of the practice presuppose a non-consequentialist account of the vote — something like a civic or Kantian duty whose point is independent of outcomes — or can a consequentialist save it with appeals to expressive effects, the value of high turnout as such, or the generalization of the duty to everyone voting together? Does the lesser-evil norm presuppose the opposite, namely that the vote's significance lies entirely in its causal contribution to the result, and is the combination of the two norms coherent, or does the practice rest on an unresolved tension between viewing the vote as an expressive act and viewing it as a marginal causal intervention on an election? I would also like to know where the practice is philosophically underdetermined — whether, for instance, several rival theories of voting's ethics could each license the whole package, and if so which. And finally, if we replaced whatever view the practice presupposes with a straightforwardly expressive one, on which the vote is a statement of one's values rather than a lever on the outcome, what exactly would have to change? Would exhorting people to vote in safe districts, shaming abstainers, or even compulsory voting survive the replacement, or would the norms we currently bundle together come apart?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a newly naturalized citizen puzzled by the voting norms in their adopted country. On one hand, voting is treated as a duty with all the GOTV efforts, but on the other, they're told to vote strategically in swing states. The user is looking for the philosophical underpinnings of these seemingly conflicting norms.

  First, I need to address the tension between the duty to vote and the insignificance of a single vote. The user questions what the duty is even for if one vote doesn't matter. I recall consequentialist arguments like rule utilitarianism or the marginal probability impact. But also, deontological perspectives where voting is a civic duty regardless of outcome. Maybe the expressive function of voting ties into both?

  Then there's the lesser-evil advice in competitive races versus voting conscience in safe states. The user notices that the normative approach shifts based on the vote's impact. This seems pragmatic, but how does it align with the duty aspect? The combination might rely on a dual-purpose theory of voting: expressive where impact is low, instrumental where it's high. But is that coherent?

  The user also asks if the norms could stem from different ethical theories. I should consider if multiple theories could justify the same practices. For example, both a deontologist and a consequentialist might support voting as a duty for different reasons. But they'd diverge on strategic voting. The current system might be a hybrid, which could lead to tensions.

  Replacing the expressive view: if voting is only expressive, then compulsory voting or shaming abstainers might not hold. The focus would shift to expression rather than participation rates. But GOTV efforts might still encourage expression. Safe states could become havens for expressive votes, but swing states might still see strategic behavior.

  I need to check if I'm covering all parts. The user wants a reconstruction of the implicit theory, coherence of norms, underdetermination by theories, and the impact of an expressive-only view. Also, compulsory voting sharpens the puzzle, so that needs addressing.

  Underdetermination: practices like mandatory voting could be supported by both consequentialist (high turnout benefits) and deontological (duty) views. But strategic voting is more consequentialist. So different theories can overlap in supporting certain norms.

  Switching to expressive-only: Duty to vote might weaken since expression doesn't require participation. Shaming abstainers would lessen. Compulsory voting would lose justification unless tied to expressive goals. Lesser-evil advice might persist in swing states if expression includes influencing outcomes, but the rationale changes.

  Potential deeper needs: The user might be seeking validation of their observation that the system is inconsistent. Or they want to understand how to navigate these norms as a new voter. They might also be interested in critiques of the system and alternatives. Addressing the coherence and philosophical tensions helps them make sense of their civic role.
answer: |-
  Your observation brilliantly captures the central tension in democratic voting ethics. The implicit theory underlying this practice is a **hybrid model that combines expressive and instrumental functions of voting**, mediated by context-dependent norms. Here's a reconstruction of its philosophical commitments and tensions:

  ### Core Philosophical Foundations
  1. **The Duty to Vote: Non-Consequentialist Foundation**
     - **Kantian/Civic Republican Roots**: Voting is treated as a *duty of citizenship* – a performative act affirming membership in the political community. Like jury duty, its value lies in participation itself, not outcomes. This explains shaming abstainers: you're failing your role as a citizen, not merely failing to influence policy.
     - **Expressive Consequentialism**: Even if your vote doesn't change results, high turnout:
       - Legitimizes the system (stability gain)
       - Signals civic health (deterrent to authoritarianism)
       - Reinforces democratic habits (long-term consequentialism)
     - **Rule-Utilitarian Logic**: *If everyone thought like you* ("my vote doesn't matter"), democracy collapses. Voting is a rule whose universal adoption produces good consequences.

  2. **How to Vote: Contextual Consequentialism**
     - **Marginal Causality Calculus**: In swing states, your vote's *expected utility* (probability × impact) becomes non-negligible. Voting third-party risks enabling the worst outcome – hence "lesser evil" as a strategic imperative.
     - **Expressive Liberation**: In safe states, your vote's causal weight approaches zero. Here, the system permits (even encourages) expressive voting as it doesn't risk harmful outcomes. This functions as a "pressure valve" for dissent.

  ### Coherence & Tensions
  | **Aspect**          | **In Swing States**       | **In Safe States**       | **Tension Source**                     |
  |----------------------|---------------------------|--------------------------|----------------------------------------|
  | **Purpose of Vote**  | Instrumental (outcome-focused) | Expressive (value-signaling) | Shifting telos undermines unified theory |
  | **Normative Demand** | Strategic duty (prevent harm) | Moral luxury (voice conscience) | Inconsistent ethical framing            |
  | **Vote's 'Weight'**  | Treated as pivotal        | Treated as weightless    | Contradictory metaphysics of agency    |

  **The system is *pragmatically coherent* but *philosophically unstable***. It works because:
  - Safe states subsidize expressive voting while swing states bear strategic burdens.
  - High turnout (driven by duty norms) maintains systemic legitimacy regardless of *how* people vote in non-competitive races.

  But tensions arise because:
  1. **Duty Justification Mismatch**: If voting is a deontic duty, why does content suddenly become consequentialist when it matters?
  2. **Agency Paradox**: Your vote is simultaneously sacred (as participation) and negligible (as causality) – a cognitive dissonance resolved only by contextual bracketing.

  ### Where Philosophy Underdetermines Practice
  Multiple ethical theories could endorse this hybrid model:
  - **Consequentialism**: Could justify duty-to-vote via rule-utilitarianism or expressive effects, and lesser-evil via expected utility.
  - **Deontology**: Could ground voting as a perfect duty of citizenship, while permitting strategic voting as an imperfect duty to prevent harm.
  - **Contractualism**: Voting as a fair-play obligation to reciprocate social benefits, with strategic voting required when others' rights are at stake.

  **However**: A purely expressive theorist would reject lesser-evil demands. A pure consequentialist would reject voting in safe states. Only theories accepting *both* expressive and instrumental values can fully license the bundle.

  ### Consequences of Switching to a Purely Expressive Theory
  If voting is *solely* about stating values:
  1. **Duty to Vote Weakens**: Abstinence isn't failure if you're not "saying" anything. Compulsory voting becomes harder to justify (forced speech).
  2. **Shaming Abstainers Collapses**: Non-voters aren't freeloaders; they're just not speaking. GOTV campaigns focus on *empowering expression*, not guilt.
  3. **Strategic Voting Transforms**: "Lesser evil" arguments vanish. Voting third-party in Florida 2000 is no more "irresponsible" than writing poetry – it's pure expression.
  4. **Safe States Become Ideological Laboratories**: With no risk of "spoiling," they incentivize authentic preference revelation.
  5. **Turnout Concerns Shift**: Low turnout might indicate contentment or distrust, not "disgrace." Legitimacy stems from expressive freedom, not participation rates.

  **Crucially**: The current bundle would fracture. We'd see:
  - Compulsory voting abolished (unless reframed as fostering equal expressive opportunity).
  - "Wasted vote" rhetoric replaced by "find your voice" messaging.
  - Swing states still exert psychological pressure (via media), but ethical demands to vote strategically dissolve.

  ### Conclusion
  The practice rests on a **dual-aspect theory**: voting as both **ritual** (requiring universal participation) and **tool** (requiring strategic use when outcomes hang in balance). Its resilience comes from serving two distinct human impulses – the need to *belong* and the need to *influence* – even if philosophers might prefer tidier foundations. As a new citizen, your bewilderment is philosophically warranted; the system *is* an unstable alloy of Enlightenment duty ethics and Cold War realpolitik. Yet this very instability may be its democratic strength: it accommodates both idealists and pragmatists, letting you be a citizen-soldier in Ohio and a citizen-poet in California.
