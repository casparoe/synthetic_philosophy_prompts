  For (3), if a platform embraced full indeterminacy, appeals would need to change. Instead of yes/no, they might use scales or confidence levels. But that's messy, so platforms might keep binary appeals for simplicity. Risk management as the core reason doesn't change much, but it shifts focus from vagueness to error mitigation.

