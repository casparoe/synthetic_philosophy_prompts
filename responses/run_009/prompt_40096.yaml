  Next, the empirical claim. Some systems achieve competence through non-comprehension mechanisms. Chess engines use algorithms, not insight. The question is whether LLMs operate similarly. Critics say they're pattern matchers without true understanding. Supporters argue that the scale might lead to emergent understanding. This is contentious and hinges on definitions.

