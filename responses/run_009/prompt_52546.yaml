  A popular book on the history of behavioral economics that I've been reading gives this account of the Allais paradox: "In the 1950s, the French economist Maurice Allais posed two pairs of choices between monetary gambles. In each pair, the two gambles shared a common component — the same outcome occurring with the same probability in both — and differed only in what happened in the remaining component. The independence axiom of expected utility theory says that a person's preference between two options should not depend on any other options available to them, so everyone should choose consistently across the two pairs, no matter how the shared component is arranged. They did not: most subjects took the certain million in the first pair but the riskier gamble in the second pair, a preference for security near certainty that Allais himself named the certainty effect. Allais thereby proved that people are not rational in the economist's sense, and expected utility theory collapsed as a description of how people actually choose." I'm fairly confident the axiom has been garbled — I dimly recall it being about mixing lotteries with probabilities — but the author is a trained economist, so I can't tell how much of the rest is standard simplification and how much is genuinely wrong. Please go through the account claim by claim: separate what a decision theorist would accept as correct, what they would wince at as a simplification, and what is simply false, and explain the reasoning behind each verdict. Then tell me whether the author's final conclusion — that the paradox refuted expected utility theory as a descriptive theory and established that people are irrational — actually follows from the parts of the account that are accurate. Please answer in American English.
