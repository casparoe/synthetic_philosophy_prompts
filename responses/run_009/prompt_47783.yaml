  I need to understand the core paradox here: the speaker exists only because of the wasteful policies that created this depleted world. If those policies hadn't happened, someone else would exist instead. So there's no "harmed person" in the traditional sense - the speaker both suffers from the depletion and owes their existence to it.

  The end-words are crucial: "born", "choice", "harm", "same", "debt", "world". Each recurrence must shift meaning subtly. For example:
  - "Born" should toggle between biological birth and existential burden
  - "Debt" should blur ecological cost with moral obligation
  - "Same" needs to echo Parfit's argument that identity and wrong are inseparable

  The form itself should embody the paradox - these words can't be removed just as the policy can't be subtracted from the speaker. No explicit statements about harm, just the looming tension. The envoi must end on "same" to leave the identity claim hanging.

  I'm considering starting with concrete images of depletion (cracked earth, rationed water) to ground the abstraction. The middle stanzas could explore the speaker's conflicted inheritance - resentment mixed with existential gratitude. For the final "same", perhaps a visceral image like touching wrinkled skin that couldn't exist otherwise.

  The challenge is balancing philosophical precision with poetic resonance. Those unfamiliar with Parfit should still feel the weight of inheriting a spoiled world you wouldn't trade. For those who know the nonidentity problem, the shifting "same" should whisper: my existence is the debt.
answer: |-
  ## Sestina of the Depleted Heir

  They say the sky was bluer, once, before
  The Choice was made. Not mine. Long ere I'm **born**,
  The rivers thick with what we called progress.
  This brittle air, this dust-choked, wheezing **world**
  They gifted me. A cradle carved from **harm**,
  A legacy inscribed as sacred **debt**.

  This cracked earth whispers of a mounting **debt**,
  A cost deferred beyond the living **same**
  Who chose the feast. Did they foresee the **harm**
  That blooms like poison where the wheat was **born**?
  Not unto *them*, but unto this thin **world**,
  This consequence. They exercised their **choice**.

  And what, precisely, was my people's **choice**?
  To burn the future for a present **debt**
  Paid later? Later meant this altered **world**,
  This air I gasp. The crucial, damning **same**:
  That only *through* that waste was I **born**.
  Is absence better? That’s the subtler **harm**.

  Can I accuse them of direct **harm**,
  When *my* existence hinges on that **choice**?
  This fragile life, this breath, the day I’m **born** –
  All trace directly back to that great **debt**.
  The person wronged, they'd say, is not the **same**
  As me. My being *is* this ruined **world**.

  I did not ask to inherit this **world**,
  Scarred by their taking. Yet to call it **harm**
  Implies a cleaner path, a brighter **same**
  Existence, lost. But that's the rub, the **choice**
  Denies alternatives. This life, this **debt**,
  Are bound as tightly as the day I'm **born**.

  No pristine timeline holds the me just **born**.
  This dust is cradle. This depleted **world**
  Is my sole provenance. A binding **debt**
  I never signed, yet feel. Is that the **harm**?
  The suffocating weight of their **choice**
  That birthed me *into* consequence, the **same**.

  This wrinkled hand I touch – the vital **same**
  As the decision. Was there **harm**?
  This breath, this **world** – the price, the gift, the **debt**.
  Their **choice** defines the air in which I'm **born**.

  *(Envoi)*

  This **world** exists because they paid no **debt**.
  Through that exhausted **choice**, precisely, I was **born**.
  The **harm**? It is the cradle. We are **same**.

  ---

  **Notes on Execution:**

  1.  **Shifting End-Words:**
      *   **Born:** Moves from literal birth ("ere I'm born"), to existence as consequence ("the day I'm born"), to the inextricable link between identity and cause ("precisely, I was born").
      *   **Choice:** Shifts from the historical decision ("The Choice was made"), to the concept of free will ("their choice"), to the mechanism creating the speaker ("that choice / Denies alternatives"), finally becoming the defining act ("that exhausted choice").
      *   **Harm:** Begins as concrete damage ("cradle carved from harm"), becomes the questionable accusation ("call it harm"), explores the paradoxical nature of harm in this context ("Is that the harm?"), and finally accepts it as the fundamental condition ("The harm? It is the cradle").
      *   **Same:** Starts as the generation who chose ("beyond the living same"), becomes the crux of the nonidentity argument ("The person wronged... is not the same"), evolves into the identity between cause and self ("bound as tightly...", "the vital same / As the decision"), and culminates in the closing identity claim ("We are same").
      *   **Debt:** Transitions from ecological cost ("mounting debt"), to moral/economic obligation ("sacred debt", "debt / Paid later"), to the existential condition of the speaker ("binding debt"), ending as the unpaid ecological price ("they paid no debt").
      *   **World:** Moves from the physical planet ("this dust-choked, wheezing world"), to the inherited reality ("this altered world"), to the speaker's sole possible existence ("my sole provenance", "This breath, this world"), and finally back to the created reality ("This world exists").

  2.  **Carrying the Paradox, Avoiding Resolution:**
      *   The poem never states "I am harmed" directly. Instead, it presents the *conditions* (dust, brittle air, debt, cradle carved from harm) and the *argument* about harm ("Can I accuse...?", "Implies a cleaner path...").
      *   The speaker feels the weight ("suffocating weight") and inherits the damage ("scarred by their taking"), but simultaneously acknowledges existence depends on it ("This life, this debt, / Are bound as tightly as the day I'm born").
      *   The final lines of the envoi ("The harm? It is the cradle. We are same.") deliver Parfit's core point: the harm (the depleted world) *is* the necessary condition for the speaker's existence ("the cradle"). Identity ("We") and the harmful act ("same") are fused. It ends on the identity claim, not a verdict of "wronged" or "not wronged."

  3.  **Accessibility:**
      *   For those unfamiliar with Parfit: The poem clearly depicts inheriting a ruined world ("brittle air," "dust-choked," "cracked earth") caused by past waste ("burn the future"). The speaker's conflicted feelings – resentment at the inheritance ("They gifted me") mixed with a profound, inescapable connection to it ("This dust is cradle," "my sole provenance") – create tension. The final lines capture the core emotional paradox: the spoiled world is both harmful and the very thing that allowed the speaker to exist, making it impossible to wish away without wishing away themselves.
      *   For those familiar with Parfit: The shifting use of "same," the exploration of the counterfactual ("a cleaner path"), the focus on existence being contingent on the harmful policy ("only *through* that waste was I born"), and the final "We are same" directly articulate the nonidentity problem's central dilemma. The poem embodies the argument through its form and imagery.
