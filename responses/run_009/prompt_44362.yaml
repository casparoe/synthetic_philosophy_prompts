answer: |-
  Based on your meticulous description and the gaps you've identified in Lewis and moralization literature, this phenomenon **does not have a widely established, single-name treatment** within mainstream philosophy of conventions, social ontology, or norm psychology. It sits at an intersection often overlooked. However, it is a profoundly important and recognizable dynamic.

  Here’s a precise conceptual carving, a proposed term, and an analysis of edge cases:

  ### The Phenomenon Defined: The Conventional Expressive Threshold (CET)

  1.  **Core Definition:** The **Conventional Expressive Threshold (CET)** is the point at which an agent's violation of, or adherence to, a *local arbitrary convention* ceases to be interpreted primarily as a product of *ignorance* and begins to be interpreted primarily as an *expressive signal* of their attitude (e.g., respect, disregard, affiliation, differentiation) towards the local community or its members, contingent upon the common or reasonably presumed knowledge that the agent *knows* the convention.

  2.  **Key Differentiating Features:**
      *   **Vs. Simple Convention-Breaking:** Mere breaking is neutral or a coordination failure. CET-breaking occurs *after* the threshold of presumed knowledge is crossed, transforming the act's meaning.
      *   **Vs. Moralization of the Practice:** The *convention itself* remains fundamentally arbitrary and non-moral (e.g., no one believes shoe removal is intrinsically righteous). The *interpretation of the specific act by specific observers towards a specific agent* changes based on epistemic context, not a change in the convention's normative status.
      *   **The Epistemic Trigger:** The crucial variable is the observer's reasonable belief about the *agent's knowledge state*. The act's expressive meaning hinges on the exclusion of ignorance as a plausible explanation.
      *   **The Expressive Signal:** Once ignorance is excluded, the act becomes a signal. Violation signals disregard, indifference, or deliberate distancing. Adherence signals respect, care, or affiliative intent, often eliciting warmth beyond mere approval of correctness.
      *   **Locality & Arbitrariness:** CET applies specifically to conventions recognized as local and arbitrary ("we do it this way here, but it could be otherwise"). It is less relevant for universal norms or deeply moralized rules.
      *   **Observer-Dependent:** The threshold isn't absolute; it depends on the observer's perception of the agent's knowledge and integration. Different observers might apply the threshold differently to the same agent/act.

  ### Why "Conventional Expressive Threshold" (CET)?

  *   **Conventional:** Anchors it firmly in the domain of Lewis-style conventions (arbitrary, coordination solutions).
  *   **Expressive:** Highlights the core shift – the act becomes an expression of attitude *once* ignorance is ruled out.
  *   **Threshold:** Emphasizes the critical epistemic boundary being crossed (knowledge vs. ignorance). It's a tipping point in interpretation.

  ### CET in Relation to Existing Concepts (Why they don't quite fit)

  *   **Lewis's Conventions:** Lewis focuses on *how* conventions solve coordination problems through common knowledge and precedent. He spends little time on the *hermeneutics of violation*, especially how interpretation *changes* with the violator's perceived knowledge. CET adds this crucial layer of meaning-ascription *conditional on epistemic context*.
  *   **Moralization (e.g., Rozin, Haidt):** This describes a process where a conventional practice *itself* acquires intrinsic moral weight ("It's *wrong* not to do X"). In CET, the practice *doesn't* become moral; the *act of violation by a knowing agent* is interpreted as expressing a *moral failing in the agent* (disrespect, lack of care) towards the *community*, not that the *rule itself* is moral. The wrong is relational/attitudinal, not inherent in the act.
  *   **Signaling Theory (Spence):** CET *uses* signaling. Adherence/violation past the threshold *are* costly signals (showing effort to fit in or willingness to bear social cost). However, CET specifies the *precise condition* (presumed knowledge) that activates the signaling interpretation for arbitrary conventions, distinguishing it from other signals (wealth, health, commitment to moral principles).
  *   **Attribution Theory (Weiner):** CET is a specific application of attribution theory (internal vs. external causes for behavior) to the domain of conventional norms. It specifies that for arbitrary conventions, the key attribution shift (ignorance -> attitude) occurs at the point of presumed knowledge.

  ### Addressing the Edge Cases

  1.  **The Knowing Resident with Sincere Objection:**
      *   **CET Analysis:** Crossing the threshold still applies. Observers see the violation as expressive (disregard, rejection of local norms). The sincerity of the objection *might* mitigate the perceived *malice* ("He's principled, not malicious"), but it rarely negates the perception of *disregard* for local sensibilities or the feelings of hosts. The expressive signal of differentiation remains. The burden of communication shifts heavily to the objector to explain *before* violating to preempt the negative expressive reading. Failure to do so usually confirms the negative signal in observers' eyes.

  2.  **The Tourist Who Complies by Accident:**
      *   **CET Analysis:** They are below the threshold. Observers readily attribute compliance to luck, mimicry, or following a guide, not to a positive attitude. They won't receive the "warmth bonus" because their act isn't read as an expressive signal of regard (since knowledge isn't presumed). They might receive basic approval ("good they did it") or be seen as pleasantly surprising, but not the deeper affiliative warmth given to someone presumed to be knowingly choosing adherence as a sign of respect.

  3.  **The Eccentric Local Who Violates:**
      *   **CET Analysis:** This tests the boundaries. The key is *how* the eccentricity is framed within the common knowledge. If the eccentricity is well-known and established as a *general* trait unrelated to the specific convention or feelings towards the community ("Oh, that's just Bob, he *never* takes his shoes off anywhere, weirdly"), it can effectively *recontextualize* the violation. Observers might attribute it to the eccentricity (an internal, stable, but *non-attitudinal* cause regarding *this* community) rather than to disregard *for them specifically*. The violation loses its specific expressive power about *this* relationship because an alternative, plausible, non-attitudinal explanation (eccentricity) is readily available and accepted. However, if the eccentricity is new, unexplained, or selectively applied, the CET interpretation (disregard) is likely to apply initially.

  ### Significance and Implications of CET

  CET explains a fundamental mechanism of social cohesion and boundary maintenance within communities governed by arbitrary conventions. It transforms neutral coordination tools into powerful, low-cost signals of social alignment or misalignment. It highlights the social risk inherent in knowing a convention – the freedom of ignorance is lost, and actions become interpretable as statements of relational intent. Understanding CET is crucial for navigating cross-cultural interactions, managing social integration, and analyzing the micro-dynamics of in-group/out-group behavior.

  Your observation is astute and fills a genuine gap. "Conventional Expressive Threshold" (CET) aims to capture the essence you've described: the point where knowledge turns convention into expression.
