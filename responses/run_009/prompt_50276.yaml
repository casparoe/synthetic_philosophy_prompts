prompt: |-
  quick context before the actual question: my aunt died last year and left a decent chunk of money to a small family foundation, and somehow I'm now the one deciding where it goes. we're not huge — maybe $200k a year to give away — but suddenly I'm getting applications, and the ones that freak me out are the ones with astronomically large numbers attached. one group says insect welfare could involve tens of trillions of individual lives so small dollars here dwarf everything else. another is basically religious and says each converted soul has infinite value. a third wants to fund research on digital minds because if consciousness can run on computers the stakes are beyond counting. and then there's my cousin on the board who keeps saying "if one person gets a thousand times more enjoyment from money than everyone else, we should just fund their art project," which sounds dumb but I can't quite say why.

  I know there's the old thought experiment about the utility monster — the being who gets so much pleasure from everything that utilitarianism says you should feed it everything you own — and I know it's meant as a reductio of utilitarianism, not as a guide. but here's my actual problem: in practice, how do I tell the difference between a utility monster argument (which I should reject) and a legitimately huge-stakes claim (which I should fund even if it feels weird)? because the reasoning pattern looks identical from the outside. somebody asserts a big multiplier on utility per dollar or per beneficiary, the math checks out given the assertion, and the conclusion dominates everything else on the table.

  so what I want is a procedure I can actually run on an application, in an evening, with no philosophy training and no ability to verify empirical claims beyond a google of the org's finances. something like: ordered questions to ask, what counts as a red flag vs just an unusual claim, where the procedure should force me to cap how much weight a single unverifiable multiplier can carry, and — this part matters — where the procedure has to stop and hand the decision back to me because it's genuinely a values question the checklist can't settle.

  please also run it on three of the actual applications sitting in my inbox folder: (1) the insect welfare one, (2) the religious salvation one, (3) my cousin's artist friend who claims outsized enjoyment of funding. and include at least one case where the procedure gives an answer I won't like — I'd rather be annoyed at the checklist now than blindsided later.

  two more things: tell me honestly where this procedure will misfire or give silly answers, e.g. what a clever applicant could do to game it. and at the end, tell me what would change your verdicts — which specific step or assumption, if wrong, would flip the whole framework, and where you're most likely to have gone wrong. don't give me a reading list, I've got applications to read.
reasoning: |-
  Okay, let me start by really understanding what this user is dealing with. Their aunt passed away, leaving them in charge of a family foundation with about $200k annually to give away. They're overwhelmed by applications making huge claims—insect welfare involving trillions of lives, religious salvation with infinite value, digital minds with potentially astronomical stakes, and even a cousin pushing to fund an artist who supposedly gets extreme enjoyment from money. The user needs a practical, step-by-step procedure to evaluate these applications without getting bogged down in philosophy or unverifiable claims.

  First, I need to recognize the core problem: distinguishing between legitimate high-impact opportunities and "utility monster" arguments. The user wants a checklist that's actionable in one evening, using only Google-able info. They also want transparency on where the procedure might fail and how it applies to real cases in their inbox.

  The key challenges here are epistemic (how can we know these big claims are true?) and normative (when should we accept extreme multipliers?). The procedure needs to flag when claims are unfalsifiable, rely on contested premises, or demand disproportionate resources. I should build in safeguards like multiplier caps and forced diversification steps.

  For the insect welfare case, the big questions are: can we really compare insect welfare to human welfare? Is the scale claim credible? For the religious case, the infinite value claim is a major red flag—it can't be bounded or compared. The artist cousin is clearly a utility monster, but I need to explain why it's different from, say, funding a life-saving surgery with proven high impact.

  I'm thinking of a 7-step filter: start with falsifiability, then scale claims, multiplier reasonableness, counterfactuals, proportionality, and finally a forced diversification step. The cap on multipliers is crucial—maybe 1000x for extraordinary but plausible claims. 

  Where could this go wrong? An applicant might game it by breaking a huge claim into smaller steps ("first prove digital minds are possible, then scale up"). Or a legitimate longshot with huge upside might get capped unfairly. I should be honest about these flaws.

  Finally, for each case, I'll show exactly where the procedure flags issues: insects fail on the multiplier (insect vs. human welfare weight), religion fails on falsifiability (infinite value), artist fails on proportionality (no spillover benefits). And I'll note that if insects were proven to feel pain like mammals, that could change the verdict.

  The user's clearly stressed but pragmatic—they want tools, not theory. Keeping it step-by-step with clear red flags and exit points ("this becomes a values call") respects their need for decisiveness while acknowledging real uncertainty.
answer: |-
  Here's a practical step-by-step procedure designed for your constraints. It forces scrutiny on **claim credibility**, **comparability**, and **proportionality**, with built-in "stop-and-decide" points. Run this in order for each application:

  ### The Utility Monster Screening Protocol (UMSP)

  1.  **Falsifiability Check:** *"Could evidence *disprove* the core claim?"*
      *   Ask: What observable outcome would definitively show this theory is *wrong*?
      *   **Red Flag:** No conceivable test exists (e.g., "infinite value," "unprovable digital consciousness"). **→ STOP.** Flag as "Unfalsifiable Claim." *You must decide if funding unfalsifiable claims aligns with the foundation's purpose.*
      *   **Yellow Flag:** Test exists but is extremely difficult/expensive/long-term (e.g., "insect pain conclusively disproven" requires massive neurobiology).
      *   **Green Light:** Test is feasible (e.g., "Artist doesn't create promised work").

  2.  **Scale Claim Audit:** *"How do they get the big number?"*
      *   Break down: `Impact = (Number Affected) x (Benefit Per Individual) x (Probability of Success)`. Google the org's track record on similar projects.
      *   **Red Flag:** Any multiplier is claimed as certain (Probability = 100%) *or* effectively infinite. **→ STOP.** Apply "Multiplier Cap" (see Step 3).
      *   **Red Flag:** "Number Affected" relies on chain reactions far beyond the funded project's direct control (e.g., "funding us converts 1 person, who converts millions"). Downgrade "Probability" significantly.
      *   **Yellow Flag:** Reliance on highly contested science/philosophy (e.g., insect sentience, digital consciousness feasibility).
      *   **Green Light:** Numbers based on historical data, pilot studies, or conservative models published by credible third parties.

  3.  **Multiplier Cap & Comparability:** *"How much more valuable is *one unit* here vs. a standard human life/year?"*
      *   Ask: What specific, measurable outcome defines a "unit of benefit"? (e.g., one insect life spared suffering, one soul "saved," one unit of artist joy).
      *   **Cap Rule:** No single claimed multiplier (Benefit Per Individual) can exceed **1000x** the value of improving one human life/year *for the purposes of this calculation*. This is your sanity check against infinity and extreme subjectivity.
      *   **Red Flag:** Benefit unit is defined in a way *incomparable* to other applications (e.g., "infinite value," "unique aesthetic experience"). **→ STOP.** Flag as "Incommensurable Value." *You must decide if funding incommensurable values fits the foundation.*
      *   **Yellow Flag:** Benefit unit is comparable but the multiplier claim is highly speculative (e.g., "insect suffering is 1/1000th as bad as human suffering" – is this based on anything?).
      *   **Green Light:** Benefit unit aligns with common metrics (e.g., life saved, year of suffering averted, child educated) and multiplier has cited justification.

  4.  **Counterfactual & Neglectedness:** *"If I don't fund THIS, what happens? Is anyone else funding this?"*
      *   Ask: Would this specific project *not happen* without your grant? Is this cause area highly neglected by other funders?
      *   **Red Flag:** Project is likely funded elsewhere or has low barriers to entry (e.g., established artist seeking personal grant). Low "counterfactual impact."
      *   **Red Flag:** Cause area is already saturated with funding. Low "neglectedness."
      *   **Green Light:** Project is uniquely positioned, fills a critical gap, and addresses a cause few funders touch. High counterfactual impact & neglectedness.

  5.  **Proportionality & Spillover:** *"Does this ask fit our size? Are there wider benefits/risks?"*
      *   Ask: Is this specific grant request ($X) a sensible fraction of the *total project cost*? What are potential unintended consequences (positive or negative)?
      *   **Red Flag:** Grant is a tiny drop in a vast ocean (e.g., $200k towards a $100 trillion problem with no defined milestone). Low leverage.
      *   **Red Flag:** High risk of significant harm or controversy that could damage the foundation's reputation or ability to operate.
      *   **Green Light:** Grant achieves a concrete milestone, leverages matching funds, or has strong potential for positive spillover (e.g., pilot data unlocking larger funding).

  6.  **Forced Diversification:** *"Does this dominate *everything* else?"*
      *   Rule: After Steps 1-5, no single application can claim more than **50%** of the annual budget ($100k) unless *all* the following are true:
          *   No Red Flags were raised.
          *   It passed Step 3's Multiplier Cap convincingly.
          *   Counterfactual Impact & Neglectedness (Step 4) are exceptionally high.
          *   Proportionality (Step 5) is excellent.
      *   **Result:** Forces you to spread risk and value diversity unless faced with an overwhelmingly strong, credible, *actionable* opportunity.

  7.  **Values Checkpoint:** *"Does this feel morally coherent?"*
      *   If you get this far and the math still points strongly to one option, but it feels deeply wrong or misaligned with your aunt's intent/foundation values: **→ STOP.** Flag as "Values Conflict." *This is where philosophy enters. You must decide based on intuition and purpose.*

  ---

  ### Running the Protocol on Your Cases

  1.  **Insect Welfare (e.g., reducing suffering in farming)**
      *   **Step 1 (Falsifiability):** Yellow Flag. Insect sentience/pain is actively researched. Disproof *possible* but very complex.
      *   **Step 2 (Scale Audit):** Yellow Flag. "Tens of trillions" number is plausible for *existence*, but link to *reducible suffering via this specific project* is weaker. Probability hard to gauge.
      *   **Step 3 (Multiplier Cap):** **Red Flag → STOP (Incommensurable Value).** Defining the "benefit unit" (preventing suffering for one insect?) and comparing its value to preventing suffering for one human is highly contested and lacks consensus. *You must decide:* Do we assign *any* moral weight to potential insect suffering? If yes, *how much* relative to humans? (0.001x? 0.000001x? 0x?). The procedure can't resolve this core values question. *Recommendation:* Without a clear foundation stance on insect moral weight, this is high-risk for your small fund. Maybe pilot a tiny grant if due diligence on the org is stellar.

  2.  **Religious Salvation (Saving Souls)**
      *   **Step 1 (Falsifiability):** **Red Flag → STOP (Unfalsifiable Claim).** Core claim ("infinite value per soul saved") cannot be disproven by any conceivable evidence. *You must decide:* Does funding purely faith-based claims align with the foundation's secular purpose and your aunt's likely intent? The protocol forces you to confront this head-on. *Recommendation:* Unless the foundation is explicitly religious, this is a strong reject based on unfalsifiability and incommensurability.

  3.  **Cousin's Artist Friend (Utility Monster)**
      *   **Step 1 (Falsifiability):** Green Light. We can observe if the art gets made and gauge its reception/impact.
      *   **Step 2 (Scale Audit):** **Red Flag.** "1000x more enjoyment" is claimed as certain (Probability=100%) and is purely subjective. Downgrade Probability to *very low*.
      *   **Step 3 (Multiplier Cap):** **Red Flag → STOP (Incommensurable Value).** "One unit of artist joy" is defined in a way incomparable to, say, "one child fed for a month." *You must decide:* Do we fund based solely on maximizing claimed subjective experience of the *recipient*, regardless of output or wider impact? *Recommendation:* Reject. This fails proportionality (Step 5 - likely low leverage/spillover) and highlights why the multiplier cap exists. It's the textbook utility monster.

  ---

  **Where the Procedure Misfires & Gets Gamed:**

  1.  **"Salami Slicing" Big Claims:** Clever applicants might break an unfalsifiable/infinite claim into smaller, seemingly testable steps (e.g., "Phase 1: Prove digital minds *possible*"). The protocol might greenlight Phase 1, even if the *ultimate* goal is unbounded. *Mitigation:* Scrutinize the *ultimate* goal in Step 1 and the chain reaction in Step 2.
  2.  **Exploiting the Cap:** An applicant might claim a 999x multiplier just under the cap, based on shaky evidence. The procedure relies on your judgment in Steps 2 & 3 to call out weak justification. *Mitigation:* Demand strong evidence for any multiplier >10x.
  3.  **Over-Penalizing Long Shots:** Truly transformative, high-risk/high-reward science (e.g., early AI safety research) might get capped or flagged due to low probability (Step 2) or neglectedness ambiguity (Step 4). *Mitigation:* The "Forced Diversification" rule (Step 6) allows modest funding if other flags are green/yellow. Use Values Checkpoint (Step 7) if the *potential* upside feels compelling despite uncertainty.
  4.  **Ignoring Foundational Values:** The procedure helps screen monstrosity, but won't tell you *which* commensurable values to prioritize (e.g., human health vs. animal welfare vs. art). *Mitigation:* Define the foundation's core priorities *before* running applications.

  **What Would Change the Verdicts - Key Brittle Points:**

  1.  **The Multiplier Cap (1000x):** This is arbitrary. If you set it to 1,000,000x, insect welfare might pass Step 3. If you set it to 10x, even some strong global health interventions might struggle. *Why 1000x?* It's a pragmatic guardrail against infinity while allowing truly extraordinary (but plausible, like saving a life cheaply) claims to dominate. **Change it if you have strong reason.**
  2.  **Assigning Moral Weight (Step 3):** The insect verdict hinges entirely on whether you assign *any* weight to insect welfare and *how much*. If conclusive proof emerged that bees feel pain identically to mammals, and you set the multiplier at 0.5x, it would dominate. **This is the most likely point of error/value judgment.**
  3.  **Falsifiability Threshold (Step 1):** How strict are you? If you accept "eventual testability in principle" for digital minds, it might get a Yellow instead of Red, letting it proceed further. **Be ruthlessly pragmatic about what's testable *now* or relevant to your funding decision.**
  4.  **Neglectedness Assessment (Step 4):** Misjudging how unique an opportunity is can drastically change cost-effectiveness. If you later learn no one else will fund that specific insect welfare intervention, its counterfactual impact skyrockets. **Due diligence on the funding landscape is critical here.**

  **Honest Summary:** This protocol protects you from obvious utility monsters and unfalsifiable infinite claims. It forces scrutiny on scale and comparability. It *will* sometimes reject legitimate longshots with huge potential upside (Type II error) and occasionally let through a well-disguised monster exploiting the cap (Type I error). It shines brightest on the middle ground – comparing credible, commensurable, actionable opportunities. For the cases on your desk, it provides clear rejection rationales for the Artist (incommensurable utility monster) and Religion (unfalsifiable/infinite), while forcing a tough values call on Insects. Use it as a filter, not a final arbiter. Your judgment at the "STOP" points and Values Checkpoint is irreplaceable. Good luck!
