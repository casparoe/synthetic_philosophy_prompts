prompt: |-
  Science journalist here, and there's a pattern I keep running into that I cant find the word for. Two experts agree on every single fact, and will even admit it, but they keep fighting over whether some label applies. Whether obesity counts as a disease, whether an e-sports player counts as an athlete (that one decides visa categories in some countries), whether an AI system "authored" a work (that one decides copyright). If you push them, they'll say look, I know it's just a word, but whoever loses the word loses the money, or the visa, or the rights. Meanwhile a second group in the room dismisses the whole fight as "just semantics," as if settling the word would settle nothing. And there's a third group that doesn't want the word reassigned at all — they want the category retired: stop asking whether addiction is a disease, the disease frame is the problem. So: does this whole package have an established name in philosophy? If there isn't one term, then don't just list candidates and leave it to me — commit to whether this is one phenomenon or several glued together, and say where the edges are, i.e. what separates it from an ordinary factual dispute and from a definitional squabble with no consequences. A bare name won't help me; the carving is what I'm after. And take a stance on whether the "it's just semantics" dismissal is ever right in these cases, or always a mistake.
reasoning: |-
  Okay, the user is a science journalist who's noticed a recurring pattern where experts agree on facts but argue over labels, with real-world implications like visas or copyright. They want to know if there's a philosophical term for this, and if not, how to break it down. They're also curious about whether dismissing it as "just semantics" is valid.

  First, I need to figure out the core of the issue. The key points are: factual agreement, label disputes, stakes involved (money, rights), and different groups reacting differently. The journalist mentioned examples like obesity as a disease, e-sports athletes, and AI authorship. So this isn't just about definitions; there are tangible consequences.

  The user wants to know if there's a single term in philosophy. I recall that boundary work or categorization disputes might be relevant. But maybe there isn't one term, so I should consider breaking it down. They also want to know if this is one phenomenon or multiple. The common thread seems to be the application of socially constructed categories with real-world implications.

  Then there's the dismissal of "just semantics." In philosophy, that's often a mistake because the labels carry institutional power. The stakes show that semantics aren't trivial here. The third group wanting to retire the category adds another layer, like in social ontology where categories can be contested for ethical reasons.

  I should check philosophical concepts. Wittgenstein's language games come to mind—words gain meaning through use. Also, Hacking's interactive kinds, where labeling affects the labeled. Boundary objects from STS might apply, but maybe that's more about interdisciplinary collaboration. The institutional power angle is crucial here; the labels gatekeep resources.

  The journalist probably needs a framework to explain this in articles. Terms like "categorization dispute" or "normative boundary work" could work. Emphasizing the stakes is key. The dismissal as "just semantics" ignores the institutional embeddedness of these categories.

  For the third group wanting to retire the category, that's a metalinguistic negotiation—arguing over which linguistic framework to use. So the phenomenon combines semantic, normative, and institutional elements. It's one interconnected phenomenon because the factual agreement highlights that the dispute is over the application of socially significant labels.

  Edges: Unlike factual disputes, here facts aren't contested. Unlike trivial definition squabbles, there are real consequences. The dismissal is wrong because semantics here are tied to institutional outcomes. The retire-the-category group adds a reformist dimension, challenging the framework itself.

  So, synthesizing: the core is the contestation of institutional categories with material stakes. No single term, but "categorization dispute" with aspects like boundary work and metalinguistic negotiation. The dismissal is a mistake because semantics here are consequential.
answer: |-
  This is a brilliantly observed pattern – and you're right that philosophy *does* have tools to dissect it, though no single perfect term exists. It's fundamentally **one core phenomenon** – **the contestation of socially/politically/institutionally consequential categories** – but with distinct strategic responses to that contestation (your three groups). Here's the carving:

  1.  **The Core Phenomenon: Normative Boundary Work with Embedded Stakes**
      *   **Essence:** This is **categorization under institutional pressure**. The dispute isn't about empirical facts describing the *thing* (obesity, e-sports, AI output) *itself*, but about **which socially constructed, institutionally embedded category it *belongs to***. The category isn't neutral; it's a **gatekeeper for resources, rights, recognition, or blame** (visas, copyright, insurance coverage, research funding, moral responsibility).
      *   **Why it's One Phenomenon:** The unity lies in the **structure**: **Agreed facts + Disputed category application + High-stakes institutional consequences tied to the category label**. The *source* of the stakes (legal, economic, social, medical) varies, but the *mechanism* (category label = key to institutional machinery) is the same.
      *   **Name Candidates (Philosophical & Adjacent):**
          *   **Boundary Work (STS - Science & Technology Studies):** Originally about demarcating science from non-science, but perfectly applied here. Experts are *drawing boundaries* around categories like "disease," "athlete," "author" to include/exclude cases, often to control resources or authority.
          *   **Categorization Dispute / Contestation:** The most direct descriptive term. Emphasizes the core activity.
          *   **Normative Application of Concepts:** Highlights that applying the concept (e.g., "disease") isn't just descriptive but involves value judgments about what *should* count, given the norms associated with the category.
          *   **Metalinguistic Negotiation (Philosophy of Language):** Arguing *about* which linguistic/conceptual framework (which definition of "disease," "author") *should be used* in a given context, knowing the framework dictates outcomes.
          *   **Dispute over Institutional Kinds (Social Ontology):** Categories like "disease" or "author" are often "institutional kinds" – their existence and properties depend on social practices, rules, and institutions. Fighting over the label is fighting over the rules governing that institutional kind within a specific system.

  2.  **The Edges: Separating from Similar Disputes**
      *   **Vs. Ordinary Factual Dispute:** Clear. If they disagree on *whether* a specific AI generated text independently or *whether* a specific e-sports player has cardiovascular capacity X, that's factual. Here, they *agree* on the relevant physical/functional properties but disagree on the *label* attached to those properties.
      *   **Vs. Trivial Definitional Squabble:** The **stakes** are the differentiator. If the argument over whether a "sandwich" includes a hot dog has no consequence for taxes, regulations, or rights, it's trivial semantics. **The moment the label triggers institutional consequences (money, rights, visas, liability), it ceases to be trivial.** The "just semantics" dismissal ignores these **embedded stakes**.
      *   **Vs. Conceptual Analysis for Clarity:** Sometimes philosophers argue definitions purely for intellectual precision, divorced from immediate real-world consequences. This dispute is *pragmatic* and *applied* – the definition matters *because* of the institutional machinery it activates.

  3.  **Your Three Groups: Strategic Responses to the Core Phenomenon**
      *   **Group 1 (Fighting for the Label):** Engaged in **strategic boundary work** or **metalinguistic negotiation**. They understand the institutional power of the category and are fighting to apply (or deny) it to achieve a specific outcome (visa, copyright, treatment access). They see the category as a necessary tool within the existing system.
      *   **Group 2 ("Just Semantics"):** Making a **category mistake about categorization disputes**. They fail to see (or dismiss) the **institutional embeddedness** of the contested label. They treat the label as *only* descriptive, ignoring its prescriptive, gatekeeping function. **This dismissal is ALMOST ALWAYS A MISTAKE in the cases you describe.** It ignores the material reality that words, in specific institutional contexts, *are* actions with consequences (money, freedom, rights). It's only "just semantics" if the semantic label *truly* has no downstream effects – which is rarely the case in your examples.
      *   **Group 3 (Retire the Category):** Engaging in **conceptual activism** or **framework critique**. They argue the *entire categorical framework* (e.g., the "disease model" of addiction) is flawed, harmful, or obscuring more important truths. They see the fight over the label within the existing system as legitimizing a harmful or inadequate framework. They want **ontological reframing**.

  4.  **The "Just Semantics" Dismissal: Is it Ever Right?**
      *   **Almost Never Right in Your Cases:** Given the *explicitly stated stakes* by Group 1 ("whoever loses the word loses the money..."), the dismissal is **demonstrably wrong**. It ignores the **pragmatic force** of language within institutions. Calling it "just semantics" is like calling a legal contract "just words" while ignoring it dictates who gets the house.
      *   **When *Might* it be Less Wrong?** Only in highly abstract, purely theoretical discussions *explicitly divorced* from real-world application, or in cases where the institutional consequences are genuinely negligible (the hot dog sandwich debate). But in the contexts you describe – obesity, visas, copyright, disease models – the consequences are material and significant. The dismissal usually reflects either ignorance of the stakes, a desire to avoid messy political realities, or a philosophical naiveté about how language functions in social systems.

  **The Carving You Need:**

  *   **Core Phenomenon:** **Consequential Categorization Dispute** (or **Stakes-Laden Boundary Work**). This emphasizes the agreed facts + contested label + institutional consequences.
  *   **It's one phenomenon:** The contestation over applying a socially/institutionally powerful label to agreed-upon facts, where the label dictates access to resources or recognition.
  *   **Key Differentiators:**
      *   From factual disputes: **Agreement on descriptive facts** about the entity.
      *   From trivial semantics: **Existence of significant institutional stakes** tied directly to the label.
  *   **The Groups:** Are different *responses* to this core phenomenon: playing the categorical game (Group 1), denying the game matters (Group 2 - mistakenly), or trying to change the game entirely (Group 3).
  *   **"Just Semantics" Dismissal:** Is **almost always a critical error** in these cases, as it ignores the **institutional pragmatics** of language – the fact that these specific words function as keys unlocking or locking doors to real-world benefits and burdens.

  **Why this framework works for a journalist:** It avoids jargon-heavy single terms while providing precise conceptual tools. You can describe the "consequential categorization dispute" over whether obesity is a "disease," explain it's "boundary work with high stakes" (access to treatment, insurance, stigma), note that some dismiss it as "just semantics" (but that ignores the real-world impact), and mention others argue we should "retire the disease framework" entirely. This gives readers a clear map of the *structure* of the disagreement beyond the surface-level squabble.
