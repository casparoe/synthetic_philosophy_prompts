  **Key Insight**: The debate *is* about threat model scoping — but Camp 1 insists on modeling the AI artifact as a *novel threat actor* with capabilities exceeding any real-world attacker (perfect deception, superhuman exploit discovery). This forces either untenable proof burdens (your "purchasable guarantee" threshold) or exposes specification gaps security rarely faces (e.g., "don’t harm humanity" lacks the precision of "prevent buffer overflows"). Camp 2’s pragmatism mirrors security’s risk management, but downplays the unprecedented *adaptation speed* of AI failures, making "patch cycles" potentially inadequate.
