  Identifying the cruxes is crucial. The main ones seem to be: 1) whether moral considerability is probabilistic or binary, and 2) how to handle moral uncertainty. For each, I'll propose concrete tests they could both accept as relevant - like analgesia self-administration studies or trade-off experiments - with specific predictions from each side.

