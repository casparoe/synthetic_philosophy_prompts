prompt: |-
  i've been going through the literature on thought experiments and it keeps splitting into two useless modes: pure celebration (Galileo dropping weights! Einstein chasing a light beam!) or pure debunking that treats every case as rhetoric in a lab coat. Before I read any more theories of how thought experiments actually persuade people — and where they mislead — I want the spec first. Write exactly five numbered requirements that any adequate theory of how thought experiments do their persuading must meet, one or two sentences per item, no introduction, no conclusion, and no scorecard of existing views (I already know the Norton argument-view stuff and Brown's platonic-rationalism line, so don't just replay that debate either).

  The purpose, so you can calibrate adequacy: good enough that when an author deploys a case I can decide whether the intuition it stirs in me counts as evidence or is just a reflex being pressed. A few things I suspect the requirements have to cover, but judge for yourself: misfires, and how a theory explains them — Dennett catalogued a whole bunch of ways intuition pumps can be rigged through framing, and a theory that can't say what went wrong when a pump misfires is only describing the successes; cases run in domains where nothing ever shaped our intuitions, like infinite sets or the far future, where the pump either runs dry or produces whatever the framer wanted; and what I think of as twist cases, where someone in the Kamm tradition runs thirty trolley variants each varying a single detail and the intuition drifts somewhere no individual variant supports. The theory has to cope with the drift, or at least say honestly that it's out of scope.

  Also, in each of the five items, mark whether the requirement is basically settled among people who actually know this literature or genuinely contested — dont dress one camp's prejudice up as the consensus. And if you think two of the requirements can't be jointly satisfied, say which two inside the relevant items; there is no conclusion section to save it for.
reasoning: |-
  Okay, the user is deep into thought experiments literature and frustrated with the binary approaches—either pure celebration or outright debunking. They want a theory that explains how thought experiments persuade, especially where they fail. Their key concerns are misfires (like Dennett's intuition pumps), domains without prior intuition shaping (infinite sets, far future), and "twist cases" with incremental variations shifting intuitions.

  First, I need to distill five essential requirements. The user explicitly wants no intros, conclusions, or rehashing Norton vs. Brown. Each requirement should be one or two sentences, marked as settled or contested. They also want conflicts noted within items.

  Requirement 1: Handling misfires. The theory must explain why some thought experiments fail, like framing errors. Dennett's work here is key. This is contested—some focus on cognitive biases, others on argumentative flaws.  

  Requirement 2: Domain constraints. How does the theory handle domains without evolved intuitions? Can it distinguish genuine insight from manufactured responses? Contested, with disagreements on innate structures vs. cultural tools.  

  Requirement 3: Incremental variation (twist cases). The theory should account for how small changes lead to intuition drift, possibly beyond individual variant support. Contested; formalists vs. those emphasizing narrative coherence.  

  Requirement 4: Distinguishing evidence from reflex. The core user need: a theory must help decide if an intuition is evidentiary or a triggered reflex. Contested, with reliability criteria varying widely.  

  Requirement 5: Persuasive mechanism specificity. Beyond "intuition," the theory must detail the cognitive process—visualization, narrative, etc. Contested, with no unified model.  

  Now, conflicts: Requirement 2 and 3 might clash. If a theory relies on evolved capacities (Requirement 2), it might struggle with incremental drifts in unnatural domains (Requirement 3). Need to note that in item 2 or 3.  

  Also, ensuring each point stays concise, avoids existing debates, and marks consensus status. The user's deeper need is practical—applying the theory to evaluate thought experiments in real-time, avoiding rhetorical traps. Highlighting conflicts and contested areas meets their request for honesty about the field's limitations.
answer: |-
  Here are five numbered requirements for an adequate theory of how thought experiments persuade, noting contested status and internal conflicts:

  1.  **Must Explicitly Account for Misfires:** The theory must provide a diagnostic framework for why specific thought experiments fail to reliably produce justified belief or insight, detailing mechanisms of error (e.g., framing biases, hidden assumptions, emotional manipulation) as demonstrated in cases like flawed intuition pumps. *(Contested: Deep disagreement exists on whether misfires stem primarily from cognitive limitations, flawed argument structure, or misuse, not just execution errors.)*
  2.  **Must Address Domain Applicability Limits:** The theory must explain how, whether, and why thought experiments can generate reliable intuitions in domains radically disconnected from human evolutionary or experiential history (e.g., quantum gravity, infinite sets, extreme futures), distinguishing genuine cognitive access from manufactured pseudo-intuition. *(Contested: Fundamental disagreement exists on whether reliable intuitions *can* be generated in such domains, with implications for innate structures vs. learned cultural tools.)* *(Conflict with R3: If R2 emphasizes reliance on evolved capacities, explaining intuition drift in unnatural domains via incremental variation (R3) becomes problematic.)*
  3.  **Must Explain Incremental Variation & Intuition Drift:** The theory must explain the persuasive effect (or lack thereof) of "twist cases" – systematic, minor variations on a core scenario (e.g., trolley variants) – accounting for how intuition can shift, stabilize, or become unreliable across the series, even when no single variant logically entails the endpoint. *(Contested: Significant debate exists on whether drift reveals deeper principles, cognitive noise, or narrative manipulation, and how to validate series outcomes.)*
  4.  **Must Provide Criteria for Distinguishing Evidence from Reflex:** The theory must offer operationalizable criteria (beyond subjective feeling) to determine when an elicited intuition constitutes plausible *evidence* relevant to the target claim versus a *cognitive or affective reflex* triggered by presentation, framing, or cognitive bias. *(Contested: No consensus exists on the necessary or sufficient conditions for an intuition counting as evidentiary; heavily tied to broader epistemological commitments.)*
  5.  **Must Specify the Persuasive Mechanism Beyond "Intuition":** The theory must articulate the specific cognitive or communicative process(es) by which the thought experiment structure (narrative, counterfactual, visualization, constraint manipulation) generates persuasive force, moving beyond merely invoking "intuition" as an explanans. *(Contested: Active debate centers on the primacy of mental modeling, argument recognition, emotional engagement, or modal imagination as the core mechanism.)*
