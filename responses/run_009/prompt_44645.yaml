  (He sits perfectly still, his ancient hands folded on the table. The flickering candle deepens the caverns of his eyes. His voice is low, graveled with age and absolute conviction.)

  "Completed? *Our* work?" (A dry, bitter chuckle escapes him.) "You describe a marketplace of appeasement, a bureaucracy of the belly. Where is the *miracle*? Where is the *mystery*? Where is the terror and the ecstasy that binds the soul? You speak of taxing bread, designing pensions... this is merely the stone in the desert offered again, endlessly, without transformation. We gave them not just sustenance, but the Body and Blood of God Himself. We turned their hunger into awe, their fear into trembling devotion. Your architects of choice offer only the stone, forever stone. They build a stable, not a cathedral. They offer comfort, but no redemption."

  (He leans forward slightly, the candlelight catching the iron cross on his breast.) "You say they need nothing above man? Precisely. That is their damnable poverty. Without the Tower touching Heaven, without the authority ordained by God Himself, what is their command but the whim of clever serpents? They lift freedom? No. They merely shift the chains. They speak of 'rationality' as if the slumbering herd could ever grasp it, or truly desire it. We bore the burden of true love – the love that *demands* submission for their own salvation, that offers the dread miracle to still their terrified hearts. Your... *institutions*... they offer only a milder cage, built by hands as frail as those they cage. They build my tower, but they build it in mud, without the spire that pierces the sky. They have the bread, they grasp at authority... but without the miracle and the dread of God, it is a dead thing. A corpse dressed in my robes. They are not descendants. They are... echoes. Faint, bloodless echoes in a material dark." 

  **Your next question might explore:** 
  *   The nature of the "miracle" he believes is essential (contrasting it with modern data/behavioral science as 'proof'). 
  *   His view of the modern concept of "what citizens would want if rational."
  *   How he justifies the *cruelty* inherent in his system as love, compared to the gentler modern 'nudges'.
  *   The significance of the kiss – its lingering presence in his argument.

  **End of Interview**
