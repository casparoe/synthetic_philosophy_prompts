prompt: |-
  I spent thirty-nine years in physical chemistry, most of them measuring the microwave and infrared spectra of transient gas-phase molecules, and I came to philosophy of physics only in retirement. During my working life I used the quantum state the way a joiner uses a level: constantly, competently, and without once asking what it is. Now that I finally ask, I find the field divided into two camps I'll label, following the usual terminology, psi-ontic (the quantum state is itself a feature of the world, as an electromagnetic field is) and psi-epistemic (it represents an agent's information or expectations, as a probability distribution does). Both camps contain serious people, and my impression is that each spends much of its energy answering a slightly different question than the one a laboratory scientist actually wants answered.

  Before I take sides, I would like the specification first, and that is what I am asking you to write: the desiderata that any adequate account of the status of the quantum state must satisfy. I want to fix the purpose explicitly, since adequacy is relative to it: I want an account good enough to guide a working scientist's stance toward the state in daily practice -- good enough, that is, to tell me whether to treat it as something out there in the molecule, or as bookkeeping about the molecule. Not a merely consistent interpretation; not a resolution of everything.

  From my own practice I have some candidate requirements, and I want you to assess each -- is it a genuine desideratum, or a prejudice of one camp dressed up as a demand -- alongside any further requirements you think the list needs:

  1. Replication without communication. Two laboratories on different continents, following the same published preparation procedure, with different apparatus, different backgrounds of information, and no communication, can produce systems whose quantum states are close enough to interfere coherently when combined. Whatever the state is, an account must explain what in the world underwrites this portability, or explain why no underwriting is needed.

  2. The Born question. If the state is knowledge, the Born-rule probabilities are probabilities *of what*? An epistemic reading appears to owe us an ontology over which those probabilities range -- some underlying state of affairs -- or an argument for why no such ontology is required and what the probabilities then mean.

  3. Surplus structure. The state carries phases and relative amplitudes that no classical probability table carries, and in computations of, say, a benzene ring's absorption the details of that structure do apparent causal work in predicting what the spectrometer records. An epistemic account owes an explanation of this surplus: why, if the state is merely someone's information, its fine structure tracks the world so faithfully.

  4. Consistency with what is already established. The account must coexist with Bell-type results -- the underlying picture, whatever it is, cannot be local -- and with the Pusey–Barrett–Rudolph theorem, which as I understand it shows that a model treating the state as mere information about an underlying physical state, together with the assumption that independently prepared systems have independent physical states, contradicts quantum theory's predictions. I take that theorem to threaten a joint unsatisfiability claim, and that is the part I most want to see addressed: which desiderata on the final list are jointly unsatisfiable, which leg of such conflicts should be dropped, and at what cost.

  5. Dual character. My own hunch, offered for your scrutiny, is that the state may be like thermodynamic entropy: a quantity that is simultaneously a physical thing, measurable by calorimeters and governing engines, and an information-like thing, whose value depends on the coarse-graining of the observer. If that analogy is apt, perhaps an adequate account must make the state capable of this dual character -- both out there and agent-relative -- without collapsing into one side. Or perhaps this is sentiment rather than a requirement; tell me honestly.

  For each requirement on your final list, give the case or consideration that motivates it; mark which are non-negotiable in principle and which are preferences of particular camps masquerading as demands; flag any subset that is jointly unsatisfiable, and say so plainly if the list itself then amounts to a result; and identify which single requirement does the most to exclude the live candidates. If you think a requirement of mine is confused or question-begging, strike it from the list and say why -- I would rather have a shorter list that stands up than a longer one that flatters me.

  Finally, a brief scorecard only, a few lines each, of how an Everett-style view, a Bohmian view (where the state is real but perhaps more like a law than a thing), a QBist or other neo-Copenhagen view, and a hidden-variable epistemic view fare against the list -- the weight should sit on the criteria and their motivating cases, not the scoring, and please do not append any reading lists or references; I want your reasoning, not a bibliography.
reasoning: |-
  Hmm, this is a fascinating request from a seasoned physical chemist transitioning into philosophy of physics. The user spent 39 years using quantum states instrumentally and now wants to understand their ontological status. They're clearly frustrated with the psi-ontic vs psi-epistemic dichotomy and want practical desiderata that would guide laboratory practice.

  The user presents five candidate requirements with impressive clarity. Let me unpack each:

  First requirement about replication without communication is crucial - it reflects the daily reality of spectroscopy labs worldwide reproducing quantum states independently. This seems non-negotiable; any interpretation that can't explain this would be useless to working scientists.

  The Born question cuts deep. If quantum states are epistemic, what are the probabilities about? This exposes a core tension in epistemic views - they need to specify their ontology while avoiding the pitfalls shown by PBR theorem.

  The surplus structure point is particularly insightful coming from an experimentalist. Those phase differences in benzene ring calculations aren't mathematical artifacts - they directly determine measured absorption spectra. Epistemic accounts really struggle here.

  The consistency requirement shows the user has done homework - they understand Bell and PBR theorems constrain possible interpretations. The PBR theorem especially threatens epistemic views that want hidden variables.

  The dual character hunch is intriguing. Comparing quantum state to thermodynamic entropy is suggestive - both have objective measurements yet context-dependent interpretations. But is this necessary or just appealing?

  Beyond their list, I should consider operational adequacy - any account must recover quantum mechanics' predictive success without adding interpretative baggage that hinders daily use. Also mathematical parsimony matters - introducing unnecessary ontological commitments violates Occam's razor.

  For the scorecard: Everett handles replication and surplus structure well but stumbles on Born probabilities being about branches. Bohm makes state real but with odd non-locality. QBists embrace subjectivity but make replication mysterious. Hidden variables get crushed by PBR.

  The core tension emerges: replication demands intersubjective stability while epistemic views make states observer-dependent. PBR then shows this tension becomes contradiction under independence assumptions. The unsatisfiable trio seems to be: (1) replication portability, (2) epistemic interpretation, and (3) preparation independence.

  Ultimately, for lab practice, psi-ontic views provide more straightforward guidance - treat the state as real because its features directly cause measurable interference. But I should acknowledge this doesn't resolve all philosophical worries.
answer: |-
  Below is a distilled set of desiderata for an account of the quantum state, tailored to guide laboratory practice. Your candidate requirements are rigorously assessed, and additional criteria are introduced where necessary. The list prioritizes operational adequacy over metaphysical completeness, focusing on what enables effective scientific engagement with quantum states.

  ---

  ### **Final List of Desiderata**  
  *(Non-negotiable requirements in bold; others are pragmatic but revisable)*  

  1. **Intersubjective Reproducibility**  
     - **Motivation**: Your "replication without communication" criterion. Laboratories worldwide reliably reproduce quantum states (e.g., for interference experiments) using public procedures, without shared context.  
     - **Non-negotiable**: Essential for scientific objectivity. Accounts must explain how state specifications transcend individual agents or apparatus.  
     - **Threat to Epistemic Views**: If the state is "knowledge," why does arbitrary agents' information converge identically? Pushes toward ontic or intersubjective structures.  

  2. **Operational Grounding of Probabilities**  
     - **Motivation**: Your "Born question." The Born rule’s probabilities must correspond to *predictably measurable outcomes* (e.g., detector clicks).  
     - **Non-negotiable**: Without this, quantum theory loses empirical content.  
     - **Epistemic Challenge**: If probabilities represent ignorance, *what* is the unknown ontology? Avoids handwaving ("probabilities of future experiences").  

  3. **Causal Efficacy of State Structure**  
     - **Motivation**: Your "surplus structure" point. Phases/amplitudes directly impact predictions (e.g., benzene’s IR spectrum).  
     - **Non-negotiable**: The state’s mathematical structure isn’t redundant; it determines outcomes.  
     - **Epistemic Challenge**: If the state is "bookkeeping," why do its details (e.g., relative phases) govern physical behavior? Favors ontic or structural realism.  

  4. **Consistency with No-Go Theorems**  
     - **Motivation**: Bell (non-locality) and PBR (threat to epistemic hidden variables).  
     - **Non-negotiable**: Violating proven theorems invalidates the account.  
     - **Key Tension**: PBR shows:  
       - *Joint unsatisfiability*: **Preparation independence** + **Epistemic states** + **Quantum predictions** → Contradiction.  
       - **Resolution Required**: Reject epistemic states (*ontic view*) or preparation independence (*QBism*).  

  5. **Minimal Ontological Commitment**  
     - **Motivation**: Beyond your list. Avoids adding hidden machinery (e.g., infinities of universes, nonlocal guides) unless necessary for 1–4.  
     - **Negotiable**: Practicality favors parsimony, but not absolute.  
     - **Tests Views**: Bohm’s particle-ontology adds hidden variables; Everett adds branches.  

  ---

  ### **Assessment of Your Candidates**  
  - **Dual Character (Your #5)**: Struck as *potentially misleading*. Thermodynamic entropy’s duality arises from *coarse-graining* (subjective choice of macrovariables). Quantum states lack this freedom—amplitudes are fixed by preparation. While *some* views (e.g., Relational QM) make state agent-relative, they struggle with **Intersubjective Reproducibility**. Not a core requirement.  

  ---

  ### **Core Tensions & Which Requirement Bites Hardest**  
  - **Unsatisfiable Trio**:  
    - **Intersubjective Reproducibility** (Demands state stability across agents)  
    + **Epistemic State** (State as "information")  
    + **Preparation Independence** (Systems prepared separately have independent physical states)  
    → **PBR Theorem shows this trio contradicts QM**.  
  - **The Decisive Requirement**: **Intersubjective Reproducibility**. It forces the state to be *agent-independent*, crippling epistemic views that tie states to observers. PBR then exposes preparation independence as the weak leg epistemicists must abandon.  

  ---

  ### **Brief Scorecard of Interpretations**  
  *(Against the final 5 desiderata)*  

  1. **Everett (Many-Worlds)**  
     - **Strengths**: States are ontic (satisfies 1–4); phases causally active (3).  
     - **Weaknesses**: Born probabilities lack grounding (2—"Why *this* branch?"); violates ontological minimality (5—infinite branches).  

  2. **Bohmian Mechanics**  
     - **Strengths**: Ontic state (wave function as physical field) satisfies 1–4; clear probability ontology (2—particle positions).  
     - **Weaknesses**: Violates minimality (5—adds particles + nonlocal guidance).  

  3. **QBism (Epistemic, Subjective)**  
     - **Strengths**: Consistent with no-gos (4—rejects preparation independence); minimal ontology (5).  
     - **Weaknesses**: Fails reproducibility (1—states are agent-specific); struggles with causal structure (3—why do "personal beliefs" govern benzene’s absorption?).  

  4. **Epistemic Hidden Variables (à la PBR)**  
     - **Weaknesses**: PBR proves incompatibility with QM if preparation independence holds. Fails consistency (4) and reproducibility (1). Effectively ruled out.  

  ---

  ### **Conclusion for Your Practice**  
  For a working scientist, **Intersubjective Reproducibility** and **Causal Efficacy** strongly favor treating the quantum state as "something out there" (ontic). The state’s portability and predictive precision resemble a physical field (e.g., EM field), not mere bookkeeping. While no interpretation satisfies all desiderata perfectly, **ontic views (Everett/Bohm)** align best with lab practice—treat phases as real, interference as objective. Epistemic views (QBism) sacrifice reproducibility for philosophical comfort, complicating daily use. Drop the "dual character" requirement; quantum states lack entropy’s coarse-graining freedom. The PBR theorem is the critical filter: if independently prepared systems share no hidden reality, epistemicism collapses.
