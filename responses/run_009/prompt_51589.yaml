  **Timeline (75 minutes):**

  1. **Introduction and Team Setup (5 minutes):**
     - Divide the class into 3 teams. Assign roles: DA, two Messengers, two BAs. Explain that they are going to play a reference game and that they will earn points for correct answers. The team with the most points wins a small prize (e.g., candy).

