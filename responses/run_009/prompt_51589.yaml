answer: |-
  ### **Rigid Designation Game: "Reference & Reality"**  
  **Goal:** Generate intuitions for rigid designation, reference-fixing vs. description, and epistemic/metaphysical modality splits without upfront theory. Students experience their own linguistic commitments backfiring.  

  ---

  ### **Game Setup**  
  **Materials:**  
  - **Phase 1 (Names for People):**  
    - **Team Packets:** 3 sealed envelopes (one per team) containing:  
      - *Team 1 (Direct Dubbing):* Photo of a person (e.g., "Ada") + note: "This is Ada."  
      - *Team 2 (False Description):* Note: "Belson proved the Reductio Lemma." (No photo.)  
      - *Team 3 (False Description + Chain):* Note: "Clara wrote the *Sonata Paradoxica*." (No photo.)  
    - **Revelation Cards:** To be opened mid-game:  
      - Team 1: "Ada is actually Dr. Alice Chen, a botanist."  
      - Team 2: "Belson DIDN’T prove the lemma; his grad student Schmidt did."  
      - Team 3: "Clara DIDN’T write the sonata; her rival Elise did."  
  - **Phase 2 (Names for Kinds):**  
    - Two identical flasks labeled "TOLU": One with water (clear liquid), one with ethanol (clear liquid).  
    - Sealed "Lab Report": "Tolu = H₂O."  
  - **Betting Sheets:** For counterfactual questions (see scoring).  
  - **Timer:** For strict phase transitions.  

  **Roles (Per Team of 5):**  
  - **Dubber:** Initiates the name (receives envelope).  
  - **Messenger 1:** Receives name from Dubber, passes to Messenger 2.  
  - **Messenger 2:** Receives name from Messenger 1, passes to Betting Agents.  
  - **Betting Agents (x2):** Collaborate on bets.  

  ---

  ### **Rules & Timeline (75 min)**  
  **Total:** 70 min activity + 5 min buffer.  

  #### **Phase 1: Person-Names (35 min)**  
  1. **Dubbing Ceremony (5 min):**  
     - *Dubbers* receive envelopes. **Critical twist:** Only *Team 1’s Dubber* sees a photo ("Ada"). Teams 2 & 3 get *only* descriptions (no photos).  
     - Dubbers *privately* read contents, then whisper the name/info to their Messenger 1.  
     - **Instructor Rig:** Secretly swap Team 3’s description mid-whisper: Tell Dubber, "Clara wrote the *Sonata Paradoxica*," but write "Elise" on the revelation card.  

  2. **Transmission (5 min):**  
     - Messenger 1 whispers to Messenger 2; Messenger 2 whispers to Betting Agents.  
     - **No notes allowed** – forces reliance on memory/chains.  

  3. **Pre-Revelation Bets (10 min):**  
     - Betting Agents answer on sheets:  
       - *Q1 (Actual):* "Who is [Ada/Belson/Clara] in the *actual* world?"  
       - *Q2 (Counterfactual):* "In a world where [Ada was swapped at birth/Belson plagiarized everything/Clara stole the sonata], who is [name]?"  
     - **Scoring:** Betting Agents lock in answers.  

  4. **Revelation & Post-Revelation Bets (15 min):**  
     - Teams open **Revelation Cards.** Chaos ensues!  
     - Betting Agents answer again:  
       - *Q3 (Actual):* "After the reveal, who was [name] *all along* in the actual world?"  
       - *Q4 (Counterfactual):* "In a world where [the photo was Schmidt/Belson wrote the proof/Clara composed the sonata], who is [name]?"  

  ---

  #### **Phase 2: Kind-Names (25 min)**  
  1. **Dubbing Ceremony (5 min):**  
     - Instructor holds up water flask: "This liquid is ‘Tolu’." All Dubbers witness the dubbing.  
     - Messengers transmit: "Tolu = the liquid in the flask."  

  2. **Pre-Discovery Bets (5 min):**  
     - Betting Agents answer:  
       - *Q5 (Actual):* "What is Tolu?" (They can describe appearances only.)  

  3. **A Posteriori Discovery (5 min):**  
     - Teams open "Lab Report": "Tolu = H₂O."  

  4. **Post-Discovery Bets (10 min):**  
     - Instructor shows ethanol flask: "In the closest world where lab tests showed *this* was in the original flask, what would Tolu be?"  
     - *Q6 (Counterfactual):* "In that world, does the flask contain Tolu?"  
     - *Q7 (Necessity):* "Could Tolu *not* have been H₂O?"  

  ---

  ### **Scoring**  
  - **Points:** 1 pt per correct bet (pre-revelation Q1–Q2; post-revelation Q3–Q7).  
  - **Correct Answers (Kripkean Intuition):**  
    - **Team 1 (Direct Dubbing):**  
      - Ada is *the person in the photo* (even after reveal; even in counterfactuals).  
    - **Teams 2 & 3 (False Description):**  
      - Belson/Clara refers to *the person dubbed* (Belson himself), not Schmidt/Elise, even when descriptions fail.  
      - In counterfactuals where Belson *did* write the proof, he *is* the author.  
    - **Phase 2 (Tolu):**  
      - Tolu is H₂O in all worlds after discovery.  
      - In the ethanol-world, Tolu *still* = H₂O (rigidity), so the flask does NOT contain Tolu.  
  - **Prize:** Small reward (e.g., candy) for the winning team.  

  ---

  ### **Debrief (20 min)**  
  **Map Game Moments to Concepts:**  
  1. **Fixing Reference vs. Giving Meaning:**  
     - *Game Moment:* Team 1’s photo dubbing fixed Ada to a person *without* descriptions. Teams 2 & 3 tried to fix reference via descriptions (which failed).  
     - *Concept:* Descriptions don’t define names; they fix reference. When descriptions fail, names still refer.  

  2. **Rigid vs. Accidental Designation:**  
     - *Game Moment:* Post-revelation, "Belson" still referred to Belson (rigid), even when his properties changed. In counterfactuals, names tracked the *same* entity.  
     - *Concept:* Rigid designators pick the same object in all possible worlds (Belson is Belson in all scenarios). Descriptions (e.g., "proof-writer") are accidental.  

  3. **Epistemic vs. Metaphysical Modality:**  
     - *Game Moment:* Pre-revelation, it was *epistemically possible* that Belson wrote the proof (they didn’t know). Post-revelation, they saw it was *metaphysically necessary* that "Belson" referred to Belson regardless.  
     - *Phase 2 Moment:* Pre-lab, Tolu *could* have been ethanol (epistemic). Post-lab, Tolu *must* be H₂O in all worlds (metaphysical necessity).  
     - *Concept:* What we can imagine (epistemic) vs. what is genuinely possible in reality (metaphysical).  

  **Key Transition:**  
  - "When you discovered Tolu was H₂O, you treated it as necessary—not because of the dubbing, but because you intuited that the *identity* is rigid. This is how water = H₂O is necessary a posteriori."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Students "Lawyer" the Rules:**  
     - *Problem:* Argue that "Belson" should refer to Schmidt because "that’s who we meant."  
     - *Solution:* Stay neutral: "The game isn’t about what *should* be true—bet based on how you actually used the name." Record their protests; use in debrief to show descriptivist intuitions failing.  

  2. **Smug Students "Get" the Trick Early:**  
     - *Problem:* A student whispers, "This is Kripke! Names are rigid!"  
     - *Solution:* Isolate them: "Ah, our in-house philosopher! Help your team *bet*, not lecture. If you’re right, you’ll win—but let them answer." If persistent, assign them as a Messenger (reduces influence).  

  3. **Chains Break:**  
     - *Problem:* Messenger 2 forgets the description.  
     - *Solution:* Embrace it: "This happens in real reference chains! Bet based on what your *team actually received*."  

  4. **Counterfactual Confusion:**  
     - *Problem:* Teams misjudge scenarios (e.g., think "Belson in plagiarism-world" means Schmidt).  
     - *Solution:* Clarify: "In this world, Belson *did* the action—how does that change who *he* is?"  

  ---

  ### **Limitations & What You Must Supply**  
  **What the Activity Achieves:**  
  - Generates strong intuitions for **rigidity** (names track entities across counterfactuals).  
  - Shows **reference-fixing** (dubbing > descriptions).  
  - Illustrates **epistemic/metaphysical split** (pre/post-revelation bets diverge).  

  **What It Can’t Reproduce:**  
  - **Metaphysical Necessity of Identities (e.g., water = H₂O):**  
    - *Why:* Students will intuit rigidity ("Tolu designates *this stuff*"), but not that "water couldn’t be XYZ" is a fact about the *world* (not just language). The game ties necessity to the dubbing act, not essence.  
    - *Bridge You Must Build:* In debrief, contrast:  
      - Game: Rigidity arises from how *we fix reference*.  
      - Kripke: Metaphysical necessity arises from *essential properties* (e.g., molecular structure).  
      - **Supply:** "Science discovers essences. Once we know water is H₂O, it’s necessary—not because we dubbed it, but because H₂O is what water *is*. The dubbing fixes reference; science discovers necessity."  

  **Final Tip:**  
  - **Do not say "rigid designator" until debrief.** Let discomfort brew when descriptions fail. When teams protest ("But Belson *isn’t* the real proof-writer!"), smile: "Write your bet. We’ll discuss later."
