     But note: We want the description to be false. So for Team 3: We tell the DA: "Dr. Evans is the scientist who first cloned a mammal in 1996." Then later we reveal that it was actually Dr. Wilmut and his team.

     After the initial setup, each team has their name fixed either by direct dubbing (Team 1) or by description (Teams 2 and 3).

  3. **Phase 1: First Betting Round (10 minutes):**
     - The BAs in each team are given a form with questions. They must agree on answers and write them down. Questions include:
