  We are designing an in-class activity for a 75-minute session that requires no lecture up front. The goal is to have students experience the rigidity of names and the epistemic/metaphysical modality split through a game. The activity has two main phases:

  Phase 1: Names for people (inspired by Gödel/Schmidt)
  Phase 2: Names for kinds (inspired by the water/H2O case)

  We'll break down the activity into:
  - Rules and Setup
  - Roles and Materials
  - Timeline (75 minutes total)
  - Scoring
  - Debrief
  - Predictable Problems and Solutions
  - Limitations

  **Rules and Setup:**

  The class is divided into 3 teams (5 students each). Each team will have:
  - A "Dubbing Agent" (DA) who performs the initial dubbing.
  - Two "Messengers" who pass along the name to others in the team.
  - Two "Betting Agents" (BAs) who will make the final bets.

  However, note that in Phase 1, the name might be introduced via a description that is false (like Gödel/Schmidt). We will have two types of names:

  Type A (Direct Dubbing): 
    - The DA is shown a picture of a person (let's call him "Person A") and told: "This is [Name1]." The picture is then hidden.

  Type B (Description-based): 
    - The DA is given a description: "The person who [did X] is [Name2]." But the description is false (e.g., "Belson is the guy who proved the Reductio Lemma"). The DA is not shown a picture.

  In both cases, the DA tells the name to the Messengers, who then tell the name and the information they have (either the picture memory or the description) to the Betting Agents. The Betting Agents then have to answer questions about reference.

  **Materials:**
  - For Type A (Direct Dubbing): A picture of a real person (e.g., a philosopher or a scientist) that the students are unlikely to know. We'll call this person "Argle". Also, a sealed envelope with the true identity of Argle (which will be revealed later).
