  - Satz-style (high damage): Highlights structural injustice
  - Natural law (moderate): Appeals to intrinsic wrongness
  - Health economist (least damaging): Pragmatic disagreement

  The user's argument has three pillars: repugnance targets desperation, class hypocrisy in objections, and fiction as empathy test. Each critic threatens these differently. The Kantian undermines the autonomy defense, Satz questions the desperation framing, natural law rejects the body-as-property premise, while the economist just prefers alternatives.

  For responses, I'll craft two-minute rebuttals with soft spots:
