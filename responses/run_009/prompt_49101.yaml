  - Satz reply: Argue markets reduce vulnerability but concede power imbalances
  - Natural law: Contrast with accepted practices but acknowledge incommensurability
  - Economist: Show market efficiency while admitting implementation challenges

  The concession about real-world risks feels crucial upfront - it disarms critics by acknowledging imperfections. The nightmare question about "human capital" exploitation requires careful handling by distinguishing between body parts and labor.

